<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Show Progress on the Hill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
/* A small hill drawing: dots = [[x 0-100, color, label?]] */
const HILL=(dots,opt)=>{opt=opt||{};const X=p=>12+p*3.16,Y=x=>112-88*Math.exp(-Math.pow((x-170)/62,2));
  let pts='';for(let x=12;x<=328;x+=4)pts+=x+','+Y(x).toFixed(1)+' ';
  const C=['var(--pri)','var(--h2)','var(--h3)','var(--h4)'];
  return '<svg viewBox="0 0 340 150" style="width:100%;max-width:340px;display:block;margin:6px auto 0" role="img" aria-label="Hill chart">'+
   '<polyline points="'+pts+'" style="fill:none;stroke:var(--line2);stroke-width:3"/>'+
   '<line x1="170" y1="20" x2="170" y2="118" style="stroke:var(--line);stroke-dasharray:4 4"/>'+
   '<text x="88" y="140" text-anchor="middle" style="font:600 11px var(--sans);fill:var(--muted)">Figuring it out</text>'+
   '<text x="252" y="140" text-anchor="middle" style="font:600 11px var(--sans);fill:var(--muted)">Making it happen</text>'+
   dots.map((d,j)=>{const x=X(d[0]),y=Y(x);return '<circle cx="'+x.toFixed(1)+'" cy="'+(y-1).toFixed(1)+'" r="9" style="fill:'+(d[1]||C[j%4])+';stroke:var(--card);stroke-width:2;transition:all .4s"/>'+(d[2]?'<text x="'+x.toFixed(1)+'" y="'+(y+3.5).toFixed(1)+'" text-anchor="middle" style="font:700 10px var(--sans);fill:#fff">'+d[2]+'</text>':'');}).join('')+'</svg>'+
   (opt.legend?'<div style="display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;margin-top:6px">'+opt.legend.map((n,j)=>'<span class="small" style="display:inline-flex;align-items:center;gap:5px"><span style="width:12px;height:12px;border-radius:50%;background:'+C[j%4]+';display:inline-block"></span>'+n+'</span>').join('')+'</div>':'');};
const SC=['Join the waitlist','Spot opens','Notify members','Studio settings'];

Course.lesson({
  id:'0011', title:'Show progress on the hill', minutes:19, icon:'trend',
  goals:['Explain why task counts and estimates hide how much is still unknown','Read a hill chart and spot a stuck or badly drawn scope','Decide which scope to push uphill first'],
  parts:['Why lists mislead','The hill','Reading the hill','Climbing in order'],
  read:'Read chapter 13 of the book for the full dinner-party walk-through and the hill chart snapshots.',
  glossary:{
    'discovered-task':'Discovered task: a task the team only finds once they get into the real work, as opposed to an imagined task planned up front.',
    uphill:'Uphill: the first phase of any piece of work, full of unknowns, while you figure out your approach.',
    downhill:'Downhill: the second phase of a piece of work, when all unknowns are solved and only doing it is left.',
    backsliding:'Backsliding: moving a dot back down the uphill side after an unexpected unknown shows up.',
    'inverted-pyramid':'Inverted pyramid: the journalists’ habit of putting the most important facts first, so the end can be cut without losing anything essential.'
  },
  cheatsheet:[
    'To-do lists <b>grow as work moves forward</b>: tasks get discovered, so a short list doesn’t mean almost done.',
    'Estimates hide uncertainty: “4 hours” means very different things for familiar and brand-new work.',
    'Every piece of work is a hill: <b>uphill</b> = figuring it out, <b>downhill</b> = making it happen.',
    'Put each <b>scope</b> on the hill as a dot. Comparing snapshots shows what’s moving and what’s stuck, without asking for status.',
    'A dot that doesn’t move is a raised hand. Ask about the work: “What can we solve to get this over the hill?”',
    'A scope that’s half over and half not should be <b>split</b> into scopes that can move on their own.',
    '<b>Build your way uphill</b>: thought about it → validated it → built enough that no unknowns are left.',
    'Push the <b>riskiest, most novel</b> scopes uphill first; leave the routine work for the end.'
  ],
  steps:[
/* ---------- PART 1: WHY LISTS MISLEAD ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Bea’s to-do list for the waitlist shows 8 of 10 tasks checked off. Is the project 80% done?</h1>');
  L.mc(L.card,['Yes, the list shows it plainly','Not necessarily, more tasks may come'],1,
   'Right. The list only shows the tasks someone has written down so far. This lesson is about seeing progress in a way that doesn’t get fooled.',
   'Careful: the list only holds tasks written down so far. If the team keeps finding new ones, “8 of 10” can soon become “8 of 16”.');}},
{part:0,src:'Chapter 13 · The tasks that aren’t there',run(L){
  L.h(L.kick('learn','The tasks that aren’t there')+'<h1 class="q">A to-do list can’t tell you what nobody has found yet</h1>'+
   L.prose('Kind managers hate asking for status. It feels like nagging, and the follow-up questions make it worse. They’d rather look it up themselves. But to-do lists are a poor place to look.')+
   L.list([['list','An empty list is ambiguous','No open tasks could mean the work is done, or that nobody has written the next tasks yet.'],
     ['eye','Testing adds tasks','A scope looks finished, then a round of testing fills it with new issues.'],
     ['trend','Lists grow as you go','Most tasks are '+L.g('discovered-task','discovered')+' by doing the work, not planned up front. So the list gets longer as the team makes progress.']],1)+
   L.prose('From outside, you can’t tell whether the number of open tasks will go down or up.'));
  L.done();}},
{part:0,src:'Chapter 13 · The tasks that aren’t there',run(L){
  L.h(L.kick('ex','Pinecone, week 2 to week 3')+'<h1 class="q">Watch the “Spot opens” list for Kenji and Bea’s waitlist</h1>');
  L.beats(L.card,[
   ['Monday, week 2','The scope has 3 tasks. Bea checks off all 3. To Noor, glancing at the list, “Spot opens” looks finished.'],
   ['Wednesday','Bea wires the button to the real booking code and tests a cancelled spot, finding two things nobody planned: the spot count doesn’t refresh, and a member who already holds a booking can join the waitlist too.'],
   ['Friday','Testing with Kenji adds two more. The list now reads 3 of 7 done, even though the team moved forward all week.'],
   ['What it means','The list went from “done” to “less than half done” while the work got <i>closer</i> to finished. Counting tasks would have misled Noor twice.']],
   'Task counts move both ways as work is discovered. They can’t tell an outsider how far along a scope really is.');}},
{part:0,src:'Chapter 13 · Estimates don’t show uncertainty',run(L){
  L.h(L.kick('learn','Estimates don’t help either')+'<h1 class="q">Two tasks, both “4 hours”. They don’t mean the same thing.</h1>'+
   L.lanes([['check','Done it ten times','The team knows this work well. Four hours really means about four hours.',1],
            ['alert','Never done before','Unclear links to other parts of the system. Four hours if all goes perfectly, maybe two or three days if not.',4]])+
   L.prose('You can’t write “4 hours, or maybe 3 days” as an estimate. A number hides how much is still <b>unknown</b>.')+
   L.note('So the book stops counting tasks and stops using number estimates. It shifts the question from “what’s done?” to <b>“what’s still unknown, and what’s solved?”</b>','bulb'));
  L.done();}},
{part:0,src:'Chapter 13 · Estimates don’t show uncertainty',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Two waitlist tasks are each estimated at one day. Which estimate should Noor trust less?</h1>');
  L.mc(L.card,['Adding a “Join waitlist” button like the existing “Book” button','Making sure two members can’t grab the same opened spot'],1,
   'Right. The booking code already slips under load and the team hasn’t solved this before, so “one day” could easily become several.',
   'The button copies a pattern the team has built many times. The same-spot problem is new and tangled with the booking code, so its estimate hides the most uncertainty.');}},

/* ---------- PART 2: THE HILL ---------- */
{part:1,src:'Chapter 13 · Work is like a hill',run(L){
  L.h(L.kick('learn','Work is like a hill')+'<h1 class="q">Every piece of work has two phases</h1>'+
   HILL([[22,'var(--h4)'],[50,'var(--pri)'],[80,'var(--h2)']])+
   L.flow([['compass','Uphill','Figuring out the approach. Full of unknowns and problem solving.','',4],['check','The top','You can now see every step that’s left.','',1],['arrow','Downhill','Doing the work. Certain, confident, no open questions.','',2]])+
   L.prose('Uphill, “what percent done?” makes no sense, because you don’t yet know what the work is. Only from the top can you see it all, and only then is an estimate fair.'));
  L.done();}},
{part:1,src:'Chapter 13 · Work is like a hill',run(L){
  L.h(L.kick('ex','The book’s everyday example')+'<h1 class="q">Hosting a dinner party, step by step up and down the hill</h1>');
  L.beats(L.card,[
   ['Bottom left','The date is set, but you have no idea what to cook or even which cuisine.'],
   ['Halfway up','Two guests are vegetarian, so grilling is out. You lean toward Indian over Italian. Asked “how long will shopping take?”, you can’t say: no dish chosen yet.'],
   ['The top','You pick a recipe with ingredients you can find and write a shopping list. Now you know what to do, and can even estimate: an hour to shop, half an hour to prep, 45 minutes to cook.'],
   ['Downhill','The day before, you shop. Then you prep and cook.'],
   ['Bottom right','After the meal, only the clean-up is left.']],
   'Uphill feels like “I’m still not sure what I’m doing.” Downhill feels like “Now I know what to do.” The hill captures that feeling, not a task count.');}},
{part:1,src:'Chapter 13 · Work is like a hill',pts:4,
 solve:async L=>{for(const r of [0,1,2,4]){L.$('#hp').children[r].click();L.$('#hn').click();}},
 run(L){
  const POS=[5,27,50,74,96],NM=['Start','Halfway up','Top','Halfway down','Finished'];
  const Q=[['Bea','“I haven’t looked at the studio settings at all yet.”',0,'Nothing figured out yet: the bottom left.'],
   ['Kenji','“I’ve sketched two ways to show who’s waiting, but haven’t picked one.”',1,'Some figuring done, the approach not chosen: halfway up.'],
   ['Bea','“Nothing’s built yet for emails, but I can list every remaining step.”',2,'Seeing every step left is the top of the hill, even with nothing built.'],
   ['Kenji','“Only one last check and the deploy are left on “Join the waitlist”.”',4,'Just the clean-up left: almost at the bottom right.']];
  let k=0,ans=false;
  L.h(L.kick('pr','Place the dot')+'<h1 class="q">Where on the hill is each piece of waitlist work? Tap a spot.</h1><div id="hs"></div><div id="hq" style="margin:10px 0" class="prose"></div><div id="hp" style="display:flex;flex-wrap:wrap;gap:6px"></div><div id="hf"></div><button class="btn pri" id="hn" hidden style="margin-top:10px">'+L.ic('arrow')+'Next</button>');
  const show=()=>{ans=false;L.$('#hs').innerHTML=HILL([]);L.$('#hq').innerHTML='<b>'+Q[k][0]+':</b> '+Q[k][1];L.$('#hf').innerHTML='';L.$('#hn').hidden=true;};
  NM.forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=n;b.onclick=()=>{if(ans)return;ans=true;const ok=j===Q[k][2];
    L.$('#hs').innerHTML=HILL(ok?[[POS[j],'var(--ok-strong)']]:[[POS[j],'var(--no-strong)'],[POS[Q[k][2]],'var(--ok-strong)']]);L.award(ok);
    L.fb(L.$('#hf'),(ok?'<b>Yes.</b> ':'<b>It’s “'+NM[Q[k][2]]+'”.</b> ')+Q[k][3],ok?'ok':'no');
    if(k<Q.length-1)L.$('#hn').hidden=false;else{L.sheet('info','The hill tells the story','Each answer came from how the person <i>felt</i> about the work: still unsure, or knowing what to do. That’s what the hill shows.');L.done();}};L.$('#hp').appendChild(b);});
  L.$('#hn').onclick=()=>{if(!ans||k>=Q.length-1)return;k++;show();};show();}},
{part:1,src:'Chapter 13 · Scopes on the hill',run(L){
  L.h(L.kick('learn','Scopes on the hill')+'<h1 class="q">One dot per scope gives you a picture of the whole project</h1>'+
   L.prose('The '+L.g('scope','scopes')+' from the last lesson give the project its language. The hill gives each scope a status. Put every scope on the hill as its own coloured dot, and you have a '+L.g('hill-chart','hill chart')+'.')+
   HILL([[70],[30],[48],[12]],{legend:SC})+
   L.prose('Here, “Join the waitlist” is on its way down. “Studio settings” has barely started. “Spot opens” still has real unknowns. The people doing the work drag the dots themselves, because they know where things stand.')+
   '<p class="small">The book shows a real snapshot from one of its own projects in exactly this form.</p>');
  L.done();}},
{part:1,src:'Chapter 13 · Work is like a hill',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Uphill or downhill?',['Uphill','Downhill'],[
   ['“We’re still testing whether the member list loads fast enough for Ironleaf’s two rooms.”',0,'Still testing an approach means unknowns are left.'],
   ['“The email layout is settled; I just need to fill in the three message types.”',1,'The approach is clear. What’s left is doing it.'],
   ['“Not sure yet if the late-cancel rule should show on the waitlist or the booking.”',0,'An open design question: still figuring it out.'],
   ['“All the screens are wired. Two copy tweaks and a deploy to go.”',1,'Only execution left, near the bottom right.'],
   ['“I tried the waiting-members list on real data and it holds up; now I’m just building the screens.”',1,'The approach is checked and the rest is known work: downhill.']]);}},

/* ---------- PART 3: READING THE HILL ---------- */
{part:2,src:'Chapter 13 · Status without asking',run(L){
  L.h(L.kick('learn','Status without asking')+'<h1 class="q">Compare snapshots to see how the work is <i>moving</i></h1>'+
   L.prose('The team updates the hill chart every so often, and each update is saved. The real power for a manager is comparing past snapshots with today’s.')+
   L.list([['eye','What’s in motion and what’s stuck','Dots that moved show progress. A dot in the same spot for days stands out.'],
     ['clock','How the time was spent','Which problems the team chose first, and how long each spent going from unknown to known to done.'],
     ['chat','A pointed question, not a status meeting','No need to interrupt everyone. Ask about the one piece that looks wrong.']],2)+
   L.prose('The hill chart becomes the first place a manager looks when they feel nervous about a project.'));
  L.done();}},
{part:2,src:'Chapter 13 · Status without asking',pts:1,
 solve:async L=>{const b=L.$('#wk').children;b[0].click();b[1].click();b[2].click();},
 run(L){
  const W=[[[30],[24],[10],[5]],[[55],[27],[34],[20]],[[82],[27],[58],[44]]];const seen=new Set();
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Noor feels nervous about the waitlist in week 4. Step through three saved snapshots.</h1><div id="wk" style="display:flex;gap:6px;flex-wrap:wrap"></div><div id="hh">'+HILL([],{legend:SC})+'</div><div id="wq"></div>');
  ['Week 2','Week 3','Week 4'].forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=n;b.onclick=()=>{[...L.$('#wk').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(j);
    L.$('#hh').innerHTML=HILL(W[j],{legend:SC});
    if(seen.size===3&&!L.$('#wq').innerHTML){const q=L.$('#wq');q.innerHTML='<h2 class="sub">What should Noor do?</h2>';
      L.mc(q,['Ask everyone for a daily written status update','Ask Bea what unknown holds “Spot opens” back','Tell the team they look behind and must hurry up'],1,
       'Right. Three dots moved every week; “Spot opens” hasn’t moved since week 2. Noor can go straight to that one piece without interrupting the rest.',
       'The snapshots already show the status, so no extra reports or pep talks are needed. Three dots move steadily; only “Spot opens” is stuck. Ask about that piece of work.');}};L.$('#wk').appendChild(b);});}},
{part:2,src:'Chapter 13 · Nobody says “I don’t know”',run(L){
  L.h(L.kick('learn','Nobody says “I don’t know”')+'<h1 class="q">A stuck dot raises the hand that people won’t</h1>'+
   L.prose('Nobody likes telling management “I don’t know how to solve this.” So teams hide uncertainty, and risk piles up quietly. Yet the moments when someone is stuck or going in circles are where the biggest risks, and chances, are.')+
   L.quote('A dot that doesn’t move is effectively a raised hand.','Ryan Singer, Shape Up, chapter 13')+
   L.lanes([['x','About the person','“Looks like you’re stuck!”',4],['check','About the work','“What can we solve to get this over the hill?”',1]])+
   L.prose('Caught early, a stuck problem can get help from someone senior or a rework of the concept. Caught late, it can sink the project.'));
  L.done();}},
{part:2,src:'Chapter 13 · Prompts to refactor the scopes',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">The scope that looked stuck but wasn’t</h1>');
  L.beats(L.card,[
   ['The worry','On one of the book’s projects, a scope called “Notify” sat on the hill far too long.'],
   ['The check-in','The work was going fine. But “Notify” was really three things: designing an email, sending it from the back end, and showing the notice in an in-app menu.'],
   ['The mismatch','Sending was nearly coded, the email design nearly settled, the in-app part not started. Was “Notify” over the hill? Parts were, parts weren’t. No single dot could say.'],
   ['The fix','Split it into three smaller scopes. Now each dot shows where its piece really stands, and the team can show progress more often.']],
   'Sometimes a stuck dot means the scope lines were drawn wrong. Break it into pieces that can move on their own.');}},
{part:2,src:'Chapter 13 · Prompts to refactor the scopes',pts:1,run(L){
  L.h(L.kick('pr','Your call')+'<h1 class="q">“Studio settings” has sat halfway uphill for a week. Inside it: the per-class waitlist switch (built), the waiting-members list (design nearly settled), and showing the late-cancel rule (not started). What should Kenji and Bea do?</h1>');
  L.mc(L.card,['Leave the dot where it is and keep going','Split it into three scopes that move alone','Move the dot to the top to show progress'],1,
   'Right. Parts are over the hill and parts haven’t started, so one dot can’t be honest. Three scopes can each show where they stand.',
   'The dot isn’t stuck because the work is stuck. It’s stuck because one dot covers three pieces at different stages. Split the scope so each piece can move on its own.');}},
{part:2,src:'Chapter 13 · Status without asking · Nobody says “I don’t know”',pts:4,run(L){
  L.h(L.kick('pr','What does the hill tell you?')+'<h1 class="q">Sort each hill chart signal by the best next step.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Ask what’s unknown','Split the scope','All fine, no action'],[
   ['“Spot opens” hasn’t moved in six days and is all one problem.',0,'A still dot on a single problem is a raised hand. Ask what unknown is holding it back.'],
   ['“Notify members” is stuck, but its email is done and its in-app alert not started.',1,'Parts at different stages under one dot: split it.'],
   ['“Join the waitlist” moved from the top to near the bottom right this week.',2,'Steady downhill movement is just what you hope to see.'],
   ['A dot sits uphill and the team can’t say how done it is, its tasks are unrelated.',1,'Unrelated tasks inside one scope make “done” impossible to judge. Factor pieces out.']],
   'A still dot is a question about the work. A dot that can’t be placed honestly is a prompt to redraw the scopes.');}},

/* ---------- PART 4: CLIMBING IN ORDER ---------- */
{part:3,src:'Chapter 13 · Build your way uphill',run(L){
  L.h(L.kick('learn','Build your way uphill')+'<h1 class="q">Climb with your hands, not just your head</h1>'+
   L.prose('Teams new to hill charts often slide dots <i>back</i>. They mark a scope solved, then hit a surprise and have to move it down again. Usually someone did the uphill work in their head: “I’ll just use that service,” and reality was messier.')+
   L.tiers([['check','Final third, to the top','I’ve built enough that I don’t believe other unknowns are left.','',true,'Top'],
            ['flask','Second third','I’ve checked my approach actually works.'],
            ['bulb','First third','I’ve thought about this.']])+
   L.prose('Only first-hand work gets a scope over the top. A plan on paper is just the first step.'));
  L.done();}},
{part:3,src:'Chapter 13 · Build your way uphill',pts:1,run(L){
  L.h(L.kick('pr','Put in order')+'<h1 class="q">Bea is climbing “Spot opens”. Put Bea’s updates in the order they should happen, from the bottom of the hill to the top.</h1>');
  L.order(L.card,['I have an idea: let the first tap win','I tried two taps at once on a test copy','Built and wired; no unknowns left that I can see'],
   'That’s building your way uphill: an idea, then a check that it works, then enough real work that nothing hidden is left.',['First third','Second third','Final third']);}},
{part:3,src:'Chapter 13 · Build your way uphill',pts:1,run(L){
  L.h(L.kick('pr','Where does it belong?')+'<h1 class="q">On Monday Bea says, “For the spot-opened email I’ll just use our mail provider’s template feature.” Then Bea drags “Notify members” to the top of the hill. Where should it be?</h1>');
  L.mc(L.card,['At the top, since there’s a plan','Partway down, since Bea is confident','In the first third: it’s only an idea'],2,
   'Right. Bea has a theory but hasn’t tried it. Until it’s checked and enough is built, surprises can still push the dot back.',
   'A plan in your head is only the first step uphill. If the template feature turns out messier, the dot slides back. Keep it in the first third until Bea has tested it.');}},
{part:3,src:'Chapter 13 · Solve in the right sequence',run(L){
  L.h(L.kick('learn','Solve in the right sequence')+'<h1 class="q">Push the scariest work uphill first</h1>'+
   L.prose('All scopes start at the bottom. The team asks: <b>if we ran out of time, which of these could we throw together quickly anyway, and which might be much harder than we think?</b>')+
   L.lanes([['alert','Do first','Something the team has never done, with novel problems (the book’s example: geocoding data). It could eat weeks.',4],
            ['clock','Leave for later','Something routine (an email template). A good-enough version could be done in a day in the final week.',1]])+
   L.prose('Work expands to fill the time, so starting with the easy part can swallow weeks. Like a journalist’s '+L.g('inverted-pyramid','inverted pyramid')+', put the most important unknowns first. By the end, only nice-to-haves and maybes should be left.'));
  L.done();}},
{part:3,src:'Chapter 13 · Solve in the right sequence',pts:1,run(L){
  L.h(L.kick('pr','Plan the climb')+'<h1 class="q">Tap each piece until the sentence gives Kenji and Bea the right order for the waitlist.</h1>');
  L.sentence(L.card,[['Push the email wording uphill first,','Push “Spot opens” uphill first,'],['because it has the newest unknowns,','because it’s the quickest win,','because it’s the most fun to build,'],['and leave the email wording for later.','and leave the hard parts for week 6.']],[1,0,0],
   [['The email wording is routine. A good-enough version can be written in a day near the end.'],['Quick wins first is backwards: the scary, novel work should go first.','Fun isn’t the test. Ask which piece might be much harder than it looks.'],['Leaving the hard parts for the last week is how surprises sink projects.']],
   '“Spot opens” touches the booking code that already slips, and the team has never solved first-tap-wins. Get it over the hill early; the email can wait.');}},
{part:3,src:'Chapter 13 · Show Progress',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Mixed review',['Good practice','Trap'],[
   ['Noor judges the waitlist by how many tasks are checked off.',1,'Lists grow as work gets discovered. Task counts mislead.'],
   ['Kenji keeps a dot in the first third because they’ve chosen a design but haven’t tried it.',0,'Thinking is the first third; Kenji still needs to validate it.'],
   ['Tomás sees a dot unmoved for a week and asks what unknown is holding it.',0,'A still dot is a raised hand. Ask about the work.'],
   ['The team starts with polishing the email layout because it’s easy.',1,'Easy work expands to fill the time. Novel, risky work goes first.'],
   ['Bea moves a dot to the top after only picturing the solution.',1,'Uphill work done in your head leads to backsliding. Build your way up.']]);}}
  ]
});
</script>
</body>
</html>
