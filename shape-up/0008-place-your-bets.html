<!doctype html>
<html lang="en">
<head>

<title>Place Your Bets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">

</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0008', title:'Place your bets', minutes:19, icon:'compass',
  goals:['Tell whether a bet is on an existing product or a new one, and set expectations to match','Recognize R&D, production and cleanup mode and what each one expects','Use the five betting-table questions to debate a pitch'],
  parts:['Where you are','Three modes','At the table'],
  read:'Read chapter 9 of the book for the HEY and Hill Charts stories and the full list of questions.',
  glossary:{
    'existing-product':'Existing product: a product already in customers’ hands. New features fit into the space its current code and design leave.',
    'rd-mode':'R&D mode: the earliest phase of a new product, when senior people build to learn what the product should be. The goal is to spike, not ship.',
    'production-mode':'Production mode: the middle phase of a new product, once the core decisions are settled. Normal shaping, betting and building, with more teams.',
    'cleanup-mode':'Cleanup mode: the last phase before a new product launches. No shaping, no team boundaries, leadership decides what to fix and what to cut.',
    spike:'Spike: building a rough version of a key piece just to learn whether it works and how to model it.',
    'kick-off':'Kick-off message: the note posted after the betting table that tells everyone which projects were bet on and who will build them.'
  },
  cheatsheet:[
    '<b>Look where you are.</b> Existing product: shape, bet, build, and expect to ship by the end of the cycle.',
    'New product = finding where the walls go, not furnishing a room. It moves through three modes, still bet <b>one cycle at a time</b>.',
    '<b>R&D mode</b>: fuzzy shaping, senior people build, spike not ship. Aim: settle the load-bearing structure.',
    '<b>Production mode</b>: deliberate shaping, more teams, “shipping” means merging into the main code. Features can still be cut before launch.',
    '<b>Cleanup mode</b>: no shaping, no team boundaries, ship in small bites, final-cut decisions. No more than two cycles.',
    'Five questions: does the <b>problem</b> matter, is the <b>appetite</b> right, is the <b>solution</b> attractive, is it the right <b>time</b>, are the right <b>people</b> available?',
    'Don’t design at the table. Then post the <b>kick-off message</b>: which bets, and who builds them.'
  ],
  steps:[
/* ---------- PART 1: WHERE YOU ARE ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Which job can you plan more exactly before you start?</h1>');
  L.mc(L.card,['Building a couch for a room you’ve measured','Deciding where the walls of a new house go'],0,
   'Right. The room’s size is fixed, so you know what fits. With a new house you’re still working out the shape. The book uses this exact picture.',
   'The new house is the harder one: the walls aren’t there yet, so you can’t measure. A couch for a measured room is easy to plan.');}},
{part:0,src:'Chapter 9 · Look where you are',run(L){
  L.h(L.kick('learn','Look where you are')+'<h1 class="q">Existing product or new product? It changes what you expect.</h1>'+
   L.prose('Before betting, the table asks where the product is in its life, because that sets what should happen during the six weeks.')+
   L.lanes([['home','Existing product','The code and design that won’t change form a space the new feature fits into, like making furniture for a house that’s already built.<div class="small" style="margin-top:6px">Normal process: shape, bet, build. Expect a version to <b>ship by the end of the cycle</b>.</div>',1],
            ['map','New product','You’re still deciding where the walls and foundation go so the building will stand.<div class="small" style="margin-top:6px">The way you shape and what you expect change across <b>three phases</b>, each lasting several cycles.</div>',3]])+
   L.note('Even for a new product, the table still bets <b>one cycle at a time</b>.','info'));
  L.done();}},
{part:0,src:'Chapter 9 · Existing products',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Kenji and Bea are bet six weeks on the waitlist, a new feature in Pinecone’s booking app. What should everyone expect at the end?</h1>');
  L.mc(L.card,['Some learning, but nothing shipped yet','A version of the shaped work, shipped','A first draft for a second cycle'],1,
   'Right. Pinecone is an existing product, so the standard process applies: the team ships some version of the shaped work by the end.',
   'That’s what you’d expect from a new product’s early phases. The waitlist fits into an existing product, so the team should ship a version of it.');}},
{part:0,src:'Chapter 9 · Existing products · New products',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Existing product or new product?',['Existing product','New product'],[
   ['A clearer “class cancelled” email in Pinecone.',0,'It fits into Pinecone as it is today.'],
   ['Pinecone Coach: a separate app for trainers’ one-to-one sessions.',1,'Coach has no walls yet. Its core design and code still have to be found.'],
   ['Gift cards that studios can sell through Pinecone.',0,'A new feature, but it slots into the existing app and its payments.'],
   ['A brand-new data model for Coach’s trainer calendars.',1,'Deciding how to model the core in code is new-product, foundation work.'],
   ['Exporting members to a spreadsheet.',0,'A small feature in a product customers already use.']]);}},

/* ---------- PART 2: THREE MODES ---------- */
{part:1,src:'Chapter 9 · New products',run(L){
  L.h(L.kick('learn','Three modes for a new product')+'<h1 class="q">A new product moves through three phases</h1>'+
   L.tiers([['flask','R&D mode','Learn what the product is by building it. Senior people build. Spike, don’t ship.','Fuzzy shaping'],
            ['layers','Production mode','The core is settled. Normal shaping, betting and building, with more teams.','Deliberate shaping',true,'Most cycles'],
            ['check','Cleanup mode','Right before launch. No shaping, no team lines; fix what matters and cut the rest.','No shaping']])+
   L.prose('The phases stretch across many cycles, but every bet is still placed one cycle at a time. The next screens look at each mode.'));
  L.done();}},
{part:1,src:'Chapter 9 · R&D mode',run(L){
  L.h(L.kick('learn','R&D mode')+'<h1 class="q">When you can only learn what you want by building it</h1>'+
   L.prose('At first a new product is just a theory. Nobody knows if the imagined features will hold together, or how to model them in code. There’s lots of scrapwork. So the book changes three things in '+L.g('rd-mode','R&D mode')+':')+
   L.list([['Fuzzy shaping','The bet is time to '+L.g('spike','spike')+' key pieces, not a well-shaped pitch.'],
     ['Senior people build','You can’t hand off what you don’t know yet, and early architecture decides what future features can fit.'],
     ['No shipping expected','At best you keep some code and screens as a foundation. The goal is the <b>load-bearing structure</b>: the main decisions that shape the product.']],1)+
   L.quote('The aim is to spike, not to ship.','Ryan Singer, Shape Up, chapter 9')+
   '<p class="small">After each R&D cycle the table decides again whether to continue.</p>');
  L.done();}},
{part:1,src:'Chapter 9 · R&D mode',run(L){
  L.h(L.kick('ex','Pinecone Coach')+'<h1 class="q">Pinecone’s first new product starts in R&D mode</h1>');
  L.beats(L.card,[
   ['The glimmer','Personal trainers at Ironleaf keep asking for something built for one-to-one sessions, not group classes. Noor imagines a separate app: Pinecone Coach.'],
   ['Who builds','There’s no pitch a build team could run with. Tomás takes the programming and Ifeoma designs, with Noor guiding the vision.'],
   ['The cycle','They spike the core: how a trainer’s availability and a client’s sessions should work. Halfway through, they throw out one model and try another.'],
   ['The end','Nothing ships. They keep the session model and a few rough screens as a foundation. At the next betting table, they decide whether Coach gets another R&D cycle.']],
   'In R&D mode the senior people build to learn, keep the decisions that bear weight, and bet only one cycle at a time.');}},
{part:1,src:'Chapter 9 · R&D mode',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Noor suggests handing the very first Coach cycle to Kenji and Bea while the senior people keep shaping. What’s the problem?</h1>');
  L.mc(L.card,['Kenji and Bea are too new to Pinecone','Nobody knows yet what Coach should be','Six weeks is too long for a first try'],1,
   'Right. You can’t delegate what you don’t know yourself, and the early architecture decisions need people who hold the product’s vision.',
   'The book’s reason is about the work, not the people or the time: nobody knows what Coach should be yet, so the senior people must build it themselves.');}},
{part:1,src:'Chapter 9 · Production mode · Cleanup mode',run(L){
  L.h(L.kick('learn','Production and cleanup')+'<h1 class="q">Once the core is settled, then right before launch</h1>'+
   L.lanes([['layers','Production mode','<b>Shaping</b> is deliberate again.<br><b>Other teams</b> can join, several in parallel.<br><b>Shipping</b> means merging into the main code and not expecting to touch it again.<div class="small" style="margin-top:6px">Features can still be cut before launch, so a bet can be experimental.</div>',2],
            ['check','Cleanup mode','<b>No shaping</b>: closer to a bug smash, with leadership calling what matters.<br><b>No team lines</b>: everyone helps.<br><b>Ship continuously</b>, in small bites.<div class="small" style="margin-top:6px">Leadership makes the final cut. No more than two cycles.</div>',4]])+
   L.prose('Why cleanup? Near the launch button, forgotten details and bugs suddenly look important. But stay disciplined: work only on true must-haves, not on cold feet that want to delay launch.'));
  L.done();}},
{part:1,src:'Chapter 9 · R&D, production and cleanup mode',pts:6,run(L){
  L.h(L.kick('pr','Which mode?')+'<h1 class="q">Sort each moment from Coach’s development into its mode.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['R&D','Production','Cleanup'],[
   ['Tomás scraps half a feature to try a different approach',0,'Scrapwork is normal while you’re still learning what the product is.'],
   ['Kenji’s team and the other team each build a shaped Coach feature',1,'Several teams working in parallel on shaped bets is production mode.'],
   ['Noor walks the app and cuts two features before launch',2,'Final-cut decisions happen in cleanup.'],
   ['A finished feature is merged into the main code, not to be touched again',1,'That’s what “shipping” means before a product is public.'],
   ['Nobody expects anything to ship at the end of the cycle',0,'R&D aims to spike, not ship.'],
   ['Everyone jumps on whatever fix matters most, with no team lines',2,'No team boundaries and no shaping: that’s cleanup.']],
   'R&D learns by building, production builds the shaped feature set, cleanup finishes and cuts.');}},
{part:1,src:'Chapter 9 · New products',pts:1,
 solve:async L=>{for(let i=0;i<4;i++){const b=L.$('#sb [data-r="1"]');if(b)b.click();await new Promise(r=>setTimeout(r,30));}},
 run(L){
  const S=[
   ['After cycle 1','Tomás and Ifeoma tried two ways to model trainer sessions and dropped one. The core still feels shaky.',['Another R&D cycle','Switch to production mode','Start cleanup mode'],0,'The core isn’t settled, so there’s no structure for others to build on yet.'],
   ['After cycle 2','The session model and main screens hold together. The key code and design decisions feel settled.',['Another R&D cycle','Switch to production mode','Start cleanup mode'],1,'The load-bearing structure is in place. Now other teams can see where new features belong.'],
   ['After several production cycles','Both teams have merged most of Coach’s features. Launch is getting close.',['Go back to R&D mode','Keep adding new features','Start cleanup mode'],2,'Right before launch is when forgotten details pop up. Reserve that time.'],
   ['One cleanup cycle in','Lots of fixes have shipped. Noor wants three more cleanup cycles “just to be safe.”',['Agree, safety comes first','Make the final cut and launch','Go back to production mode'],1,'Cleanup shouldn’t run past two cycles. Check that you’re fixing must-haves, not cold feet.']];
  let i=0,clean=true;
  L.h(L.kick('pr','Steer Coach to launch')+'<h1 class="q">You sit at Pinecone’s betting table. After each cycle, choose what to bet on next.</h1><div id="tl" style="margin:6px 0"></div><div id="sb" style="background:var(--soft);border-radius:16px;padding:14px;margin:8px 0"></div><div id="sf"></div>');
  const draw=()=>{const s=S[i];
    L.$('#tl').innerHTML=S.slice(0,i).map(x=>'<span class="chip static ok">'+L.ic('check')+x[2][x[3]]+'</span>').join('');
    L.$('#sb').innerHTML='<div class="small"><b>'+s[0]+'</b></div><p style="margin:6px 0 10px">'+s[1]+'</p><div class="opts" style="display:flex;flex-wrap:wrap;gap:8px"></div>';
    const box=L.$('#sb .opts');
    s[2].forEach((o,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=o;if(j===s[3])b.dataset.r='1';
      b.onclick=()=>{if(j!==s[3]){clean=false;L.fb(L.$('#sf'),'<b>Not yet.</b> '+(i===0?'With the core still shaky, nobody else can build on it, and it’s far too early to clean up.':i===1?'The core is settled, so more R&D adds little. And with most features unbuilt, cleanup is too early.':i===2?'The features are mostly in. Going back or adding more delays launch; it’s time to clean up.':'More cleanup cycles than two usually means cold feet. Going back to production reopens the feature set.'),'no');return;}
        L.$('#sf').innerHTML='';i++;
        if(i>=S.length){L.$('#tl').innerHTML=S.map(x=>'<span class="chip static ok">'+L.ic('check')+x[2][x[3]]+'</span>').join('');L.$('#sb').innerHTML='<p style="margin:0"><b>Coach launches.</b> Every bet was placed one cycle at a time.</p>';
          L.award(clean);L.sheet(clean?'ok':'info',clean?'Launched, with every call right':'Launched','R&D until the core holds, production to build out the features, then at most two cycles of cleanup with a final cut. '+s[4]);L.done();}
        else draw();};box.appendChild(b);});};
  draw();}},
{part:1,src:'Chapter 9 · Examples',run(L){
  L.h(L.kick('ex','Three stories from the book')+'<h1 class="q">Flip each card to see how Basecamp set expectations</h1>');
  L.flips(L.card,[
   ['Dot Grid Calendar · existing product','Shaped, bet six weeks, built by a team, and shipped straight to customers. The standard process.'],
   ['HEY · a new product','About a year of R&D mode with three senior people, nearly a year of production mode with all the teams, then two cycles of cleanup that cut the feature set before the 2020 launch. Each bet was placed one cycle at a time.'],
   ['Hill Charts · an experiment','A feature for an existing product, but too uncertain to promise customers. So it was framed like a production-mode bet on a new product: a first version just good enough to use internally, and only one cycle bet. It worked, so a second cycle rounded it out and it shipped.']],
   'Where you are decides what you expect from a cycle. Even HEY’s two years were never committed up front.');}},
{part:1,src:'Chapter 9 · An experimental feature: Hill Charts',pts:1,run(L){
  L.h(L.kick('pr','Your call')+'<h1 class="q">Ifeoma wants to try “class streaks” in Pinecone, but nobody knows if members will care. How should the table frame the bet?</h1>');
  L.mc(L.card,['Bet two cycles now and promise it to studios','Bet one cycle on a first version, not yet released','Treat it like any feature and ship it in six weeks'],1,
   'Right. Like Hill Charts: one cycle on a first version that isn’t promised to customers. If it works, bet a second cycle to round it out. If not, scrap it.',
   'It’s too uncertain to promise customers, and betting two cycles gives up the clean slate. Bet one cycle on a first version, then decide.');}},

/* ---------- PART 3: AT THE TABLE ---------- */
{part:2,src:'Chapter 9 · Questions to ask',run(L){
  L.h(L.kick('learn','Questions to ask')+'<h1 class="q">Five questions you’ll hear at the betting table</h1>'+
   L.list([['Does the problem matter?','Keep problem and solution apart. With more problems than time, weigh them: is this more important than that, right now?'],
     ['Is the appetite right?','A pitch may be well shaped and still not be worth six weeks to someone.'],
     ['Is the solution attractive?','Every new button uses up screen space you can’t use later. Is it worth giving up?'],
     ['Is this the right time?','What have we done lately? Too long since a big new feature, too many features and not enough fixes, or a team tired of one area.'],
     ['Are the right people available?','Each bet gets a specific designer and one or two programmers, matched to the work and to who’s free.']],2)+
   L.note('A great project can still be passed over. It’s just not the right time.','info'));
  L.done();}},
{part:2,src:'Chapter 9 · Is the appetite right?',run(L){
  L.h(L.kick('ex','A debate at Pinecone’s table')+'<h1 class="q">Ifeoma pitches gift cards for six weeks. Tomás isn’t keen.</h1>');
  L.beats(L.card,[
   ['The pushback','Tomás says gift cards aren’t worth six weeks.'],
   ['Add knowledge','Ifeoma adds what the table may not know: owners ask for gift cards every holiday season, and support answers the same question dozens of times.'],
   ['Dig deeper','Ifeoma asks, “How would you feel if we could do it in two weeks?” Tomás admits it isn’t really the time: Tomás doesn’t want another payment dependency in checkout.'],
   ['The choice','Now the real objection is on the table. Ifeoma can let the idea go, or go back to shaping: a smaller version, or more research to make the case.']],
   'Saying no to the time is sometimes saying no to something else. Asking about a smaller appetite brings out the real objection.');}},
{part:2,src:'Chapter 9 · Is the appetite right?',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Why did Ifeoma ask Tomás how two weeks would feel?</h1>');
  L.mc(L.card,['To find out if the no was about something other than time','To bargain the project down to a cheaper version','To show that two weeks would be enough'],0,
   'Right. The answer revealed a technical worry, not a time worry. Now the shaper knows what to fix.',
   'The question isn’t a bargain or a promise. It tests whether the no is really about time. Here it wasn’t: it was about a new dependency.');}},
{part:2,src:'Chapter 9 · Questions to ask',pts:6,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which question is this person raising?',['Problem matters?','Appetite right?','Solution attractive?','Right time?','Right people?'],[
   ['“Only a few studios hit this, but each one costs support an hour a week.”',0,'This weighs how much the problem matters. Support burden is one way to judge it.'],
   ['“A big gift card banner on every class page uses space we may need later.”',2,'Screen space is an invisible cost of the solution.'],
   ['“We’ve shipped only payment features for two cycles. Owners are waiting on old requests.”',3,'The project may be fine. The timing isn’t.'],
   ['“Six weeks feels like a lot for this. Is it worth that much?”',1,'That questions the appetite, not the problem or the design.'],
   ['“Bea is on holiday for three weeks of the next cycle.”',4,'Availability is part of choosing the right people.'],
   ['“Kenji has done three big batch projects in a row and wants a change.”',4,'The kind of work someone has been doing lately matters when you pick teams.']]);}},
{part:2,src:'Chapter 9 · Is the solution attractive?',pts:1,run(L){
  L.h(L.kick('pr','Your call')+'<h1 class="q">Twenty minutes into the betting table, Noor and Tomás are still sketching where the gift card button should go. What should Ifeoma say?</h1>');
  L.mc(L.card,['“Let’s finish the layout so the team can start fast.”','“Let’s vote on the two button positions.”','“Okay, we’re not doing design here.”'],2,
   'Right. A quick design idea can be discussed for a few moments, but the table moves back up to the big picture. Design is for shaping and the team.',
   'The table avoids design and technical detail for more than a few moments. Finishing or voting on the layout is design work in the wrong place.');}},
{part:2,src:'Chapter 9 · Are the right people available?',run(L){
  L.h(L.kick('learn','People, then the kick-off message')+'<h1 class="q">Pick the team, then tell everyone</h1>'+
   L.prose('As part of betting, the table chooses <b>who plays which role</b>: a specific designer with one or two programmers, drawn from the pool of builders. They work together for the cycle; next cycle can be a different mix.')+
   L.list([['target','Expertise','Lots of front-end work? Likely scope creep? Pick someone good with the scope hammer.'],
     ['cycle','Variety','Someone after a long run of small batch work may want a big batch, or the other way round.'],
     ['cal','Availability','Holidays and time off mean a little Calendar Tetris.']],3)+
   L.prose('The book notes some companies let people choose their own projects instead. Then someone from the table posts a '+L.g('kick-off','kick-off message')+': which projects were bet on, and who is working on them.'));
  L.done();}},
{part:2,src:'Chapter 9 · Are the right people available?',pts:1,run(L){
  L.h(L.kick('pr','Your call')+'<h1 class="q">The next cycle’s big bet is a fiddly change that will invite lots of “while we’re at it” extras. Who should the table put on it?</h1>');
  L.mc(L.card,['Whoever happens to be free first','Someone who is good with the scope hammer','The newest programmer, to learn the code'],1,
   'Right. Work that invites scope creep needs someone who is good at cutting scope.',
   'Availability matters, but the book’s point is to match the people to the work. Scope creep calls for someone good with the scope hammer.');}},
{part:2,src:'Chapter 9 · Post the kick-off message',pts:1,run(L){
  L.h(L.kick('pr','Put it in order')+'<h1 class="q">Put Pinecone’s betting round in order, from cool-down to the start of the cycle.</h1>');
  L.order(L.card,['Everyone reads the pitches on their own time','The table weighs the pitches with the five questions','They pair each bet with a specific team','Someone posts the kick-off message','The cycle starts, with no interruptions'],
   'Read beforehand, decide in a short call, pick the people, announce it, then leave the teams alone for six weeks.');}}
  ]
});
</script>
</body>
</html>
