/* ---------- the holes in Ifeoma’s waitlist concept (odds are illustrative) ---------- */
const ROWS={
 core:{t:'The core: “Join waitlist”, the list of waiting members, “a spot opened”',core:1,short:'the core'},
 charge:{t:'Charge the member’s card automatically when they win a spot',tag:'New technical work',mv:'Patch',fix:'Patch: no auto-charge. The member books and pays the normal way.',p:.5,lo:2,hi:4,short:'card charging'},
 tap:{t:'Two members tap “Book” in the same second',tag:'How the parts fit',mv:'Patch',fix:'Patch: the first tap wins; the other member sees “Spot taken.”',p:.4,lo:2,hi:3,short:'same-second taps'},
 fee:{t:'A late-cancel fee on a spot won at the last minute',tag:'A hard decision',mv:'Patch',fix:'Patch: a won spot follows the studio’s usual late-cancel rule.',p:.3,lo:1,hi:2,short:'the late-fee question'},
 cases:{t:'Waitlists for workshops, retreats and private sessions too',tag:'Extra use cases',mv:'Out of bounds',fix:'Out of bounds: regular group classes only.',p:.5,lo:1,hi:3,short:'extra use cases'},
 line:{t:'A live counter of your place in line',tag:'An exciting extra',mv:'Cut back',fix:'Cut back: a nice-to-have at most.',p:.3,lo:1,hi:1,short:'the place-in-line counter'},
 bomb:{t:'“A spot opened” goes to everyone waiting at once',tag:'Time bomb Tomás found',mv:'Reshape',fix:'Back to shaping: message one member at a time, so there’s no rush.',p:.6,lo:3,hi:5,short:'the booking rush'}
};
const FIVE=['charge','tap','fee','cases','line'];
const N=40;
const perm=n=>{const a=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const wk=n=>n===1?'week':'weeks';
const riskTxt=r=>Math.round(r.p*10)+' in 10 runs: +'+(r.lo===r.hi?r.lo:r.lo+'–'+r.hi)+' '+wk(r.hi);

/* simulate 40 runs. Base: 4 of 40 run one week over (the thin tail).
   Each open hole hits exactly p×40 runs (stratified), adding lo..hi weeks. */
function simulate(open){
  const b=perm(N),runs=[];
  for(let i=0;i<N;i++)runs.push({w:b[i]<4?7:6,why:b[i]<4?[['small',1]]:[]});
  open.forEach(k=>{const r=ROWS[k],h=perm(N),m=Math.round(r.p*N);
    for(let i=0;i<N;i++)if(h[i]<m){const x=r.lo+Math.floor(Math.random()*(r.hi-r.lo+1));runs[i].w+=x;runs[i].why.push([k,x]);}});
  return runs;
}

/* ---------- 1. The finish-week dot stack ---------- */
function Stack(L,host,o){
  o=Object.assign({id:'k',rows:FIVE,state:{},bomb:'none',coreLock:false,lock:false,label:'Holes in Ifeoma’s concept · tap one to handle it',on:()=>{}},o||{});
  const ID=o.id,st={},S={busy:false,last:null,revealed:o.bomb==='shown',fresh:null,runs:0};
  o.rows.forEach(k=>{st[k]=o.state[k]||0;});
  if(o.bomb!=='none')st.bomb=o.state.bomb||0;
  const X0=14,CW=20,BASE=112;
  const cx=w=>X0+(Math.min(20,w)-5)*CW+CW/2;
  host.insertAdjacentHTML('beforeend','<div class="rr-chart"><svg id="'+ID+'-svg" viewBox="0 0 340 150" role="img" aria-label="Dot chart. Each dot is one simulated run of the waitlist project, placed on the week it finished. Weeks 5 to 20; the six-week appetite is marked."><g id="'+ID+'-ax"></g><g id="'+ID+'-gh"></g><g id="'+ID+'-dt"></g></svg>'+
   '<div class="rr-leg"><span><i style="background:var(--ok-strong)"></i>on time</span><span><i style="background:var(--h3)"></i>1 week over</span><span><i style="background:var(--no-strong)"></i>later</span><span><i style="border:1.5px solid var(--muted)"></i>previous run</span></div></div>'+
   '<div class="rr-stats" id="'+ID+'-st"></div><div class="rr-read" id="'+ID+'-rd" aria-live="polite"></div>'+
   (o.noRun?'':'<div class="rr-btns"><button class="btn pri" id="'+ID+'-run">'+L.ic('play')+'Run 40 projects</button></div>')+
   '<div id="'+ID+'-mid"></div><div class="rr-lbl">'+o.label+'</div><div class="rr-rows" id="'+ID+'-rows"></div>');
  const $=s=>host.querySelector(s),svg=$('#'+ID+'-svg'),gh=$('#'+ID+'-gh'),dt=$('#'+ID+'-dt'),box=$('#'+ID+'-rows'),rd=$('#'+ID+'-rd');
  const alive=()=>svg.isConnected;
  /* axis */
  (function(){let s='<rect x="'+(X0+2*CW)+'" y="14" width="'+(14*CW)+'" height="'+(BASE-14)+'" rx="6" style="fill:var(--no-bg);opacity:.7"/>'+
    '<line x1="'+X0+'" y1="'+BASE+'" x2="'+(X0+16*CW)+'" y2="'+BASE+'" style="stroke:var(--line2);stroke-width:1.5"/>'+
    '<line x1="'+(X0+2*CW)+'" y1="6" x2="'+(X0+2*CW)+'" y2="'+BASE+'" style="stroke:var(--ink);stroke-width:1.5;stroke-dasharray:4 3"/>'+
    '<text x="'+(X0+2*CW+5)+'" y="27" style="font-size:12px;font-weight:700;fill:var(--no)">past the 6-week appetite →</text>';
    [5,6,8,10,12,14,16,18,20].forEach(w=>{s+='<text x="'+cx(w)+'" y="128" style="font-size:12px;fill:var(--muted);text-anchor:middle;font-variant-numeric:tabular-nums">'+(w===20?'20+':w)+'</text>';});
    s+='<text x="170" y="145" style="font-size:12px;fill:var(--muted);text-anchor:middle">weeks to finish</text>';
    $('#'+ID+'-ax').innerHTML=s;})();
  const col=w=>w<=6?'var(--ok-strong)':w===7?'var(--h3)':'var(--no-strong)';
  const pos=(w,n)=>[cx(w)+[-6.4,0,6.4][n%3],BASE-4.5-Math.floor(n/3)*6.6];
  function stats(r){
    const t=$('#'+ID+'-st');
    if(!r){t.innerHTML=[['–','by week 6'],['–','past week 8'],['–','slowest run']].map(x=>'<div class="rr-stat"><b>'+x[0]+'</b><span>'+x[1]+'</span></div>').join('');return;}
    t.innerHTML='<div class="rr-stat '+(r.on>=36?'good':'bad')+'"><b>'+r.on+'/'+N+'</b><span>by week 6</span></div>'+
     '<div class="rr-stat '+(r.past8?'bad':'good')+'"><b>'+r.past8+'</b><span>past week 8</span></div>'+
     '<div class="rr-stat '+(r.worst<=7?'good':'bad')+'"><b>wk '+(r.worst>20?'20+':r.worst)+'</b><span>slowest run</span></div>';
  }
  function draw(){
    if(!alive())return;
    const keys=o.rows.concat(o.bomb!=='none'&&S.revealed?['bomb']:[]);
    const cut=st.core===1;
    box.innerHTML=keys.map(k=>{const r=ROWS[k],h=st[k]===1,gone=cut&&k!=='core';
      const cls='rr-row'+(r.core?' core':'')+(h&&!gone?' h':'')+(gone?' gone':'')+(k===S.fresh?' new':'');
      const badge=r.core?(h?'Cut':'Keep'):gone?'Gone':(h?r.mv:'Open');
      const sm=r.core?(h?'Cut. Nothing is left that made the project worth doing.':'Why the project is worth doing.'):gone?'Gone along with the core.':h?r.fix:r.tag+' · '+riskTxt(r);
      const icon=r.core?(h?'x':'star'):(h&&!gone?'check':gone?'x':'alert');
      return '<button class="'+cls+'" id="'+ID+'-r-'+k+'" data-k="'+k+'" aria-pressed="'+h+'"'+(o.lock||gone?' disabled':'')+'><span class="ic">'+L.ic(icon)+'</span><span style="flex:1;min-width:0"><span class="ti">'+r.t+'</span><span class="sm">'+sm+'</span></span><span class="st">'+badge+'</span></button>';}).join('');
  }
  box.addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(!b||b.disabled||S.busy||o.lock)return;const k=b.dataset.k;
    if(k==='core'&&o.coreLock&&st.core===0){L.shake(b);say('<span class="no-t">Refused.</span> Cutting the core removes every risk, and every reason to build the waitlist. Handle the holes instead.');o.on({type:'refused'});return;}
    st[k]=st[k]?0:1;S.fresh=null;draw();o.on({type:'set',k,v:st[k]});});
  function say(h){if(alive())rd.innerHTML=h;}
  const openKeys=()=>st.core===1?[]:Object.keys(st).filter(k=>k!=='core'&&st[k]===0);
  async function run(){
    if(S.busy||!alive())return null;S.busy=true;const btn=$('#'+ID+'-run');if(btn)btn.disabled=true;
    const open=openKeys();
    gh.innerHTML=S.last?S.last.map(p=>{const q=pos(p.w,p.n);return '<circle cx="'+q[0]+'" cy="'+q[1]+'" r="2.6" style="fill:none;stroke:var(--muted);stroke-width:1;opacity:.55"/>';}).join(''):'';
    dt.innerHTML='';
    const runs=simulate(open),cnt={};
    const pts=runs.map(r=>{const w=Math.min(20,r.w),n=cnt[w]||0;cnt[w]=n+1;return {w,n,r};});
    say('Running the waitlist 40 times…');
    for(const p of pts){
      if(!alive())return null;
      const q=pos(p.w,p.n),c=document.createElementNS(NS,'circle');
      c.setAttribute('cx',q[0]);c.setAttribute('cy',q[1]);c.setAttribute('r',3);
      c.setAttribute('style','fill:'+col(p.w)+';transform:translateY(-60px);opacity:0;transition:transform .28s ease-in,opacity .12s');
      dt.appendChild(c);c.getBoundingClientRect();c.style.transform='translateY(0)';c.style.opacity='1';
      await L.sleep(30);
    }
    await L.sleep(300);if(!alive())return null;
    S.last=pts.map(p=>({w:p.w,n:p.n}));S.runs++;
    const ws=runs.map(r=>r.w),res={type:'run',on:ws.filter(w=>w<=6).length,past8:ws.filter(w=>w>8).length,worst:Math.max(...ws),
      open:open.filter(k=>k!=='bomb').length,bombOpen:open.includes('bomb'),hidden:open.includes('bomb')&&!S.revealed,core:st.core!==1};
    stats(res);
    const slow=runs.reduce((a,b)=>b.w>a.w?b:a,runs[0]);
    const why=slow.why.map(x=>(x[0]==='small'?'a small surprise':x[0]==='bomb'&&!S.revealed?'<b>something not on the list</b>':ROWS[x[0]].short)+' +'+x[1]).join(', ');
    let h='Slowest run: <b>week '+slow.w+'</b>'+(why?' ('+why+').':'.');
    if(res.worst<=7)h+=' <span class="ok-t">Thin tail:</span> nothing past week 7.';
    else if(res.worst>=12)h+=' <span class="no-t">Long tail:</span> that’s '+(res.worst/6).toFixed(1).replace('.0','')+' times the appetite.';
    if(!res.core)h+=' <span class="no-t">But nothing worth building is left.</span>';
    say(h);
    S.busy=false;if(btn)btn.disabled=false;o.on(res);return res;
  }
  if(!o.noRun)$('#'+ID+'-run').onclick=()=>run();
  function reveal(){S.revealed=true;S.fresh='bomb';draw();}
  function set(obj){Object.keys(obj).forEach(k=>{if(k in st)st[k]=obj[k];});S.fresh=null;draw();}
  const idle=async()=>{for(let i=0;i<150&&S.busy;i++)await L.sleep(30);};
  stats(null);draw();
  say('Press <b>Run 40 projects</b>. Each run is one possible way the six weeks could go. The odds in this model are made up for illustration.');
  return {run,set,reveal,say,draw,idle,st,S,alive,openKeys};
}
/* click a row until it reaches state v (used by solvers: real controls only) */
function setRow(L,id,k,v){const b=L.$('#'+id+'-r-'+k);if(b&&(b.getAttribute('aria-pressed')==='true')!==!!v)b.click();}

/* Tomás’s two questions (screens in part 4) */
function Ask(L,host,s,id,onAsk){
  host.insertAdjacentHTML('beforeend','<div class="rr-lbl">Walk Tomás through it, then ask</div><div class="rr-btns"><button class="chip" id="'+id+'-q0">'+L.ic('chat')+'“Is this possible?”</button><button class="chip" id="'+id+'-q1">'+L.ic('clock')+'“Is this possible in six weeks?”</button></div><div class="rr-say" id="'+id+'-a" aria-live="polite"><small>Tomás says</small>…</div>');
  const a=L.$('#'+id+'-a');
  L.$('#'+id+'-q0').onclick=function(){this.classList.add('sel');L.$('#'+id+'-q1').classList.remove('sel');
    a.innerHTML='<small>Tomás says</small>“Sure. With enough time, anything is.”<br><span class="small">A polite yes. Nothing new goes on the list.</span>';onAsk&&onAsk(0);};
  L.$('#'+id+'-q1').onclick=function(){this.classList.add('sel');L.$('#'+id+'-q0').classList.remove('sel');
    a.innerHTML='<small>Tomás says</small>“The list and the message, yes. But if ‘a spot opened’ goes to everyone waiting at once, they all rush to book in the same second, and our booking code already slips there. Fixing that properly could take about four weeks.”';
    if(!s.S.revealed){s.reveal();}onAsk&&onAsk(1);};
}

const FR=[

function Film(L,host,o){
  o=Object.assign({on:()=>{}},o||{});
  let cur=0;const seen=new Set([0]),found={},tried={};let falseN=0;
  host.insertAdjacentHTML('beforeend','<div class="rr-film"><div class="rr-thumbs" id="fm-th" role="group" aria-label="Frames"></div>'+
   '<svg id="fm-svg" viewBox="0 0 340 168" role="img" aria-label="The scene: the class roster with eight spots on the left, Jonah’s and Priya’s phones on the right"></svg>'+
   '<div class="rr-cap" id="fm-cap" aria-live="polite"></div>'+
   '<div class="rr-btns"><button class="btn" id="fm-prev">Back</button><button class="btn pri" id="fm-next">Next frame'+L.ic('arrow')+'</button></div>'+
   '<button class="btn rr-flag" id="fm-flag">'+L.ic('alert')+'Something’s undefined here</button>'+
   '<div id="fm-q" class="rr-qq"></div><div id="fm-list"></div></div>');
  const $=s=>host.querySelector(s),svg=$('#fm-svg');
  const T=(x,y,s,st)=>'<text x="'+x+'" y="'+y+'" style="'+st+'">'+s+'</text>';
  function phone(x,name,lines,hl){
    let s=T(x+37,14,name,'font-size:12px;font-weight:700;fill:var(--ink);text-anchor:middle')+
      '<rect x="'+x+'" y="20" width="74" height="142" rx="13" style="fill:var(--card);stroke:'+(hl?'var(--pri)':'var(--line2)')+';stroke-width:'+(hl?2.5:1.6)+'"/>'+
      '<rect x="'+(x+27)+'" y="26" width="20" height="4" rx="2" style="fill:var(--line)"/>';
    lines.forEach((l,j)=>{const y=64+j*20;
      if(l[0]==='['){s+='<rect x="'+(x+8)+'" y="'+(y-14)+'" width="58" height="22" rx="11" style="fill:var(--pri-bg);stroke:var(--pri)"/>'+T(x+37,y+1,l.slice(1,-1),'font-size:11.5px;font-weight:700;fill:var(--pri-deep);text-anchor:middle');}
      else s+=T(x+37,y,l,'font-size:12px;'+(j===0?'font-weight:700;':'')+'fill:var(--ink);text-anchor:middle');});
    return s;
  }
  function scene(){
    const f=FR[cur];
    let s='<rect x="2" y="2" width="154" height="164" rx="14" style="fill:var(--soft);stroke:'+(f.look?'var(--pri)':'none')+';stroke-width:2.5"/>'+
      T(12,22,'6 p.m. Vinyasa','font-size:12.5px;font-weight:700;fill:var(--ink)')+T(12,37,'Ember Yoga · 8 spots','font-size:11px;fill:var(--muted)');
    BASEROSTER.forEach((nm,k)=>{const x=12+(k%4)*35,y=46+Math.floor(k/4)*34;let lab=nm,fill='var(--h2-bg)',tx='var(--h2)',dash='';
      if(k===5){if(f.spot==='open'){lab='open';fill='var(--card)';tx='var(--muted)';dash='4 3';}
        else if(f.spot==='Jonah'){lab='Jon';fill='var(--h1-bg)';tx='var(--h1)';}
        else if(f.spot==='Priya'){lab='Pri';fill='var(--h4-bg)';tx='var(--h4)';}}
      s+='<rect x="'+x+'" y="'+y+'" width="31" height="28" rx="7" style="fill:'+fill+';stroke:'+(dash?'var(--line2)':'none')+(dash?';stroke-dasharray:'+dash:'')+';stroke-width:1.5"/>'+T(x+15.5,y+18,lab,'font-size:11px;font-weight:600;fill:'+tx+';text-anchor:middle');});
    s+=T(12,132,'Waitlist:','font-size:11.5px;font-weight:700;fill:var(--muted)')+T(12,150,f.wait,'font-size:12px;fill:var(--ink)');
    s+=phone(170,'Jonah',f.J)+phone(258,'Priya',f.P);
    if(f.hole&&found[cur]){const m=f.hole.mk;s+='<circle cx="'+m[0]+'" cy="'+m[1]+'" r="13" style="fill:var(--no-strong);stroke:var(--card);stroke-width:2.5"/>'+T(m[0],m[1]+5.5,'?','font-size:16px;font-weight:700;fill:var(--card);text-anchor:middle');}
    svg.innerHTML=s;
  }
  function thumbs(){
    $('#fm-th').innerHTML=FR.map((f,k)=>'<button class="rr-th'+(seen.has(k)?' seen':'')+(k===cur?' cur':'')+(found[k]?' hole':'')+'" id="fm-t'+k+'" aria-label="Frame '+(k+1)+', '+f.t+(found[k]?', hole found':'')+'">'+(found[k]?'?':k+1)+'</button>').join('');
    FR.forEach((_,k)=>{$('#fm-t'+k).onclick=()=>go(k);});
  }
  function list(){
    const ks=Object.keys(found).map(Number).sort((a,b)=>a-b);
    $('#fm-list').innerHTML=ks.length?'<div class="rr-lbl">Holes found: '+ks.length+' of 4'+(falseN?' · '+falseN+' false alarm'+(falseN===1?'':'s'):'')+'</div><ul class="rr-found">'+ks.map(k=>'<li>'+L.ic('alert')+'<span><b>'+FR[k].hole.name+'</b> · '+QS[found[k]]+'</span></li>').join('')+'</ul>':'';
  }
  function go(k){cur=Math.max(0,Math.min(FR.length-1,k));seen.add(cur);$('#fm-q').innerHTML='';draw();}
  function draw(){
    if(!svg.isConnected)return;
    const f=FR[cur];scene();thumbs();list();
    $('#fm-cap').innerHTML='<span class="tm">Frame '+(cur+1)+' of '+FR.length+' · '+f.t+'</span>'+f.c;
    $('#fm-prev').disabled=cur===0;$('#fm-next').disabled=cur===FR.length-1;
    $('#fm-flag').disabled=!!found[cur];
  }
  $('#fm-prev').onclick=()=>go(cur-1);$('#fm-next').onclick=()=>go(cur+1);
  $('#fm-flag').onclick=()=>{
    const f=FR[cur],q=$('#fm-q');
    if(!f.hole){falseN++;q.innerHTML='';L.fb(q,'<b>Looks defined.</b> '+f.ok,'info');list();o.on({type:'false'});return;}
    if(found[cur]!=null)return;
    const k=cur;
    q.innerHTML='<div class="fb no" style="margin-bottom:8px"><b>Undefined!</b> '+f.hole.q+'</div><div class="rr-lbl" style="margin-top:4px">Which question catches it?</div><div id="fm-cs"></div>';
    QS.forEach((nm,j)=>{const b=document.createElement('button');b.className='chip';b.id='fm-c'+j;b.textContent=nm;
      b.onclick=()=>{if(found[k]!=null||cur!==k)return;const ok=f.hole.ok.includes(j);
        if(!tried[k]){tried[k]=true;L.award(ok);}
        if(ok){found[k]=j;q.innerHTML='';L.fb(q,'<b>'+nm+'.</b> '+f.hole.why,'ok');draw();o.on({type:'found',k,n:Object.keys(found).length});}
        else{b.disabled=true;b.style.opacity='.5';L.shake(b);const old=q.querySelector('.fb.info');if(old)old.remove();L.fb(q,'Not this one. Read the hole again: what makes it unknown?','info');}};
      $('#fm-cs').appendChild(b);});
    try{q.scrollIntoView({block:'nearest',behavior:'smooth'});}catch(e){}
  };
  draw();
  return {go,get found(){return found;},count:()=>Object.keys(found).length};
}

/* small static pictures for teaching screens */
const sixWeeks='<svg viewBox="0 0 320 70" style="width:100%;display:block;margin:6px 0 2px" role="img" aria-label="A six-week bar. Weeks 2 and 3 are lost to a surprise problem.">'+
 [0,1,2,3,4,5].map(k=>{const lost=k===1||k===2;return '<rect x="'+(4+k*52)+'" y="6" width="48" height="34" rx="8" style="fill:'+(lost?'var(--no-bg)':'var(--h2-bg)')+';stroke:'+(lost?'var(--no)':'none')+';stroke-width:1.5'+(lost?';stroke-dasharray:4 3':'')+'"/>'+
  '<text x="'+(28+k*52)+'" y="28" style="font-family:var(--sans);font-size:12.5px;font-weight:700;fill:'+(lost?'var(--no)':'var(--h2)')+';text-anchor:middle">Wk '+(k+1)+'</text>';}).join('')+
 '<text x="160" y="60" style="font-family:var(--sans);font-size:12.5px;font-weight:600;fill:var(--no);text-anchor:middle">a surprise eats 2 weeks = ⅓ of the budget</text></svg>';

Course.lesson({
  id:'0005', title:'Risks and rabbit holes', minutes:20, icon:'alert',
  goals:['Explain why a shaped project needs a thin tail of risk','Find holes by walking through a use case in slow motion','Patch, fence off or cut each risk, then check it with a technical expert'],
  parts:['Thin tails','Find holes','Patch it','Experts'],
  read:'Read chapter 5 of the book for the full to-do groups “patch” and the notify-groups story.',
  glossary:{
    'thin-tail':'Thin-tailed project: one that might run a week over at most, because every part is well understood. A long-tailed one could take several times its appetite.',
    'out-of-bounds':'Out of bounds: a use case the shaper says on purpose the project will not cover, to keep it inside the appetite.',
    'nice-to-have':'Nice-to-have: a part the team may build if time allows, but the project must be worth doing without it.',
    'time-bomb':'Time bomb: a hidden problem that only blows up after a team has committed to the project.'
  },
  cheatsheet:[
    'One hole can wreck a fixed-time project: two lost weeks is a third of a six-week cycle.',
    'Aim for a <b>thin tail</b>: independent, well-understood parts that fit together in known ways. Rabbit holes stretch the tail to several times the appetite.',
    'Slow down and <b>walk through a use case in slow motion</b>, from start point to end.',
    'Ask: new tech we’ve never done? Assumptions about how parts fit? A design we haven’t found ourselves? A hard decision to settle now?',
    '<b>Patch</b> the hole by deciding a simple answer in the concept, even if it’s a little messy.',
    '<b>Declare out of bounds</b> the cases you won’t support. <b>Cut back</b> the extras you got excited about. Never cut the core that makes it worth doing.',
    'Ask experts “is this possible <b>in six weeks</b>?”, not “is this possible?”, and hunt for time bombs.',
    'Done: elements, patches and fences. Ready to write the pitch.'
  ],
  steps:[
/* ---------- PART 1: THIN TAILS ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Kenji and Bea get six weeks for the waitlist. In week one they hit a surprise problem that takes two weeks to solve. How much of their time is gone?</h1>');
  L.mc(L.card,['About a tenth of it','A full third of it'],1,
   'Two of six weeks is a third. This lesson is about finding surprises like that before anyone bets on the project.',
   'Two weeks out of six is a third, not a tenth. That’s why shapers hunt for surprises before a team ever starts.');}},
{part:0,src:'Chapter 5 · Risks and Rabbit Holes',run(L){
  L.h(L.kick('learn','Why look closer')+'<h1 class="q">One hole can sink a fixed-time project</h1>'+
   L.prose('Ifeoma has the elements of the waitlist and trusts, from experience, that they fit in six weeks. But time is fixed. One hole in the concept is enough to derail it.')+sixWeeks+
   L.prose('Some holes have no answer at all. The book tells of a Basecamp project to redesign how projects with clients show on the home screen. Nobody checked during shaping that a workable design existed. Nobody found one in six weeks, so the project was dropped and rethought later.')+
   L.note('Some unknowns always remain, and the building practices later in the book handle those. But the holes you <i>can</i> find up front, remove before the bet.','shield'));
  L.done();}},
{part:0,src:'Chapter 5 · Different categories of risk',
 solve:async L=>{const s=L.sk;L.$('#k3-run').click();await L.sleep(30);await s.idle();FIVE.forEach(k=>setRow(L,'k3',k,1));L.$('#k3-run').click();await L.sleep(30);await s.idle();},
 run(L){
  let sawOpen=false,sawShut=false,fin=false;
  L.h(L.kick('ex','Try it live')+'<h1 class="q">How long could the waitlist really take? Run it 40 times with every hole open. Then tap each hole to handle it, and run it again.</h1>'+CSS+'<div id="x3"></div>');
  L.sk=Stack(L,L.$('#x3'),{id:'k3',on:e=>{
    if(e.type!=='run'||fin)return;
    if(e.open===5)sawOpen=true;if(e.open===0)sawShut=true;
    if(sawOpen&&!sawShut)L.sk.say(L.$('#k3-rd').innerHTML+'<br><b>Now tap all five holes to handle them, and run again.</b>');
    if(sawOpen&&sawShut){fin=true;L.sheet('info','Long tail vs thin tail','With every hole open, the dots smear far to the right: some runs take two or three times the appetite. With the holes handled, nearly every run lands on week 6 and a few on week 7. The book wants the tail that thin <i>before</i> anyone bets on the project.');L.done();}}});}},
{part:0,src:'Chapter 5 · Different categories of risk',run(L){
  L.h(L.kick('learn','Thin tails')+'<h1 class="q">Well-shaped work has a thin tail</h1>'+
   L.prose('Picture every way a project could go. Well-shaped work is '+L.g('thin-tail','thin-tailed')+': there’s a slight chance of one extra week, and no reason for more, because the parts are defined and familiar.')+
   L.prose('Any '+L.g('rabbit-hole','rabbit hole')+' left in the shaping stretches the right tail, so the project could take several times its appetite. The book names three kinds:')+
   L.list([['flask','Technical unknowns','Work nobody has done before, like charging a card with no member at the screen.'],
           ['pencil','Unsolved design problems','A design everyone assumes exists, but nobody has found.'],
           ['layers','Misunderstood interdependencies','Parts that touch in ways nobody checked, like the booking code and the waitlist.']],2)+
   L.note('The goal: independent, well-understood parts that fit together in known ways.','target'));
  L.done();}},
{part:0,src:'Chapter 5 · Different categories of risk',pts:1,
 solve:async L=>{L.$('#p5').children[1].click();await L.sleep(30);await L.sk.idle();},
 run(L){
  let pick=null;
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">Ifeoma handles every hole except one: charging the card automatically (5 in 10 runs gain 2 to 4 weeks). Where will the slowest runs land?</h1>'+CSS+
   '<div class="rr-btns" id="p5"></div><div id="x5"></div>');
  const s=L.sk=Stack(L,L.$('#x5'),{id:'k5',noRun:true,lock:true,state:{charge:0,tap:1,fee:1,cases:1,line:1},label:'Ifeoma’s concept (fixed for this question)'});
  s.say('Pick your prediction to run it 40 times.');
  ['No later than week 7','Around week 10 or 11','Spread out to week 20'].forEach((t,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=t;
    b.onclick=async()=>{if(pick!==null)return;pick=j;b.classList.add('sel');const r=await s.run();if(!r)return;
      const ok=j===1;L.award(ok);
      L.sheet(ok?'ok':'no',ok?'Right: one hole, a long tail':'Look where the red dots landed','About half the runs gained 2 to 4 weeks, so the slowest reached week '+r.worst+', close to twice the appetite. Most runs still finished on time, which is what makes one leftover hole easy to miss. A single open hole is enough to stretch the tail.');L.done();};
    L.$('#p5').appendChild(b);});}},

/* ---------- PART 2: FIND HOLES ---------- */
{part:1,src:'Chapter 5 · Look for rabbit holes',run(L){
  L.h(L.kick('learn','Look for rabbit holes')+'<h1 class="q">Slow down and question what you sketched</h1>'+
   L.flow([['pencil','Finding elements','Fast and broad','chapter 4',1],['eye','Looking for holes','Slow and deep','this step',2]])+
   L.prose('One good way: <b>walk through a use case in slow motion</b>. How exactly would a person get from the start to the end? Playing it out shows gaps. Then question each part you think is solved:')+
   L.list([['flask','New technical work?','Does it need something we’ve never done before?'],
           ['layers','How the parts fit','Are we assuming how the parts fit together?'],
           ['pencil','A design we haven’t found','Are we assuming a design exists that we couldn’t come up with ourselves?'],
           ['scale','A hard decision','Is there a tough choice to settle now, so it doesn’t trip up the team later?']],1));
  L.done();}},
{part:1,src:'Chapter 5 · Look for rabbit holes',pts:4,
 solve:async L=>{for(const k of [3,4,5,6]){L.$('#fm-t'+k).click();await L.sleep(10);L.$('#fm-flag').click();await L.sleep(10);L.$('#fm-c'+FR[k].hole.ok[0]).click();await L.sleep(10);}},
 run(L){
  let fin=false;
  L.h(L.kick('pr','Slow motion')+'<h1 class="q">Play Marisol’s 6 p.m. class through the waitlist, frame by frame. Flag each frame where the elements don’t say what happens, then name the question that caught it.</h1>'+CSS+'<div id="x7"></div>');
  Film(L,L.$('#x7'),{on:e=>{if(e.type==='found'&&e.n===4&&!fin){fin=true;
    L.sheet('info','Four holes in under two hours of story','At normal speed the flow looked done. In slow motion, four holes showed up, one for each question. Each one is cheaper to face now than in week four of a cycle. Ifeoma adds them to the list.');L.done();}}});}},
{part:1,src:'Chapter 5 · Look for rabbit holes',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Two members tap “Book” in the same second. What should Ifeoma do about it now?</h1>');
  L.mc(L.card,['Leave it for Bea to solve during the cycle','Settle a simple rule now, before the bet'],1,
   'It’s a hard decision that would trip up the team. Settling it in shaping keeps it from eating their weeks.',
   'Pushing it to the team means solving it under deadline. The book says to settle hard decisions in advance.');}},
{part:1,src:'Chapter 5 · Different categories of risk',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'What kind of rabbit hole?',['Technical unknown','Unsolved design problem','Misunderstood link between parts'],[
   ['Sending waitlist messages by text would need an outside service nobody at Pinecone has used.',0,'Never-done technical work. Nobody knows how long it takes.'],
   ['Ifeoma assumes Kenji will find a clean way to fit “Join waitlist” on the small mobile class card. Nobody has sketched it.',1,'A design is assumed to exist, but nobody has found it first-hand.'],
   ['Nobody checked whether a waitlist spot uses up a credit from a class pack.',2,'Two parts of the product touch, and nobody knows how they fit.'],
   ['Removing someone from the waitlist might also have to update the studio’s attendance report. Nobody looked.',2,'Another hidden link between parts of the product.']]);}},

/* ---------- PART 3: PATCH IT ---------- */
{part:2,src:'Chapter 5 · Case study: Patching a hole',run(L){
  L.h(L.kick('ex','The book’s case')+'<h1 class="q">Patching a hole in “to-do groups”</h1>');
  L.beats(L.card,[
   ['The concept','Basecamp shaped dividers that split a to-do list into groups. The idea made sense.'],
   ['The hole','Looking closer, they had never decided how <b>completed</b> items show. Today the latest few sit below the list. Inside each group now? Repeat the dividers? Rethink it all?'],
   ['Why it’s dangerous','Changing how completed items show touches the user experience, navigation and speed. Handing that knot to a team under a deadline isn’t fair.'],
   ['The patch','They decided it in the concept: completed items stay exactly as before, with the group’s name added to each. A bit messy, but far simpler.'],
   ['What they kept','The groups of open to-dos, the part that made the project worth doing. Most of the risk was gone, and the pitch would mention the patch.']],
   'In a cycle, a designer might think “a bit more styling and I’ll make it work” and lose days. Shapers trade the ideal design for basic quality and low risk.');}},
{part:2,src:'Chapter 5 · Declare out of bounds · Cut back',run(L){
  L.h(L.kick('learn','Three moves')+'<h1 class="q">Three ways to take risk out before the bet</h1>'+
   L.tiers([['check','Patch the hole','Decide a simple answer to a tricky detail right in the concept, even if it isn’t the ideal design.','Waitlist: the first tap wins; the other member sees “Spot taken.”'],
            ['lock','Declare out of bounds','Teams want to cover every case. Say on purpose which cases you <b>won’t</b> support.','Book’s case: picking a group of people to notify, only when posting a message. Not for to-dos or chat.'],
            ['x','Cut back','Drop parts you got excited about that aren’t really needed. You may mention one as a '+L.g('nice-to-have','nice-to-have')+'.','Book’s case: color-coded to-do groups were cut.']])+
   '<p class="small" style="margin-top:10px">Each move keeps the core that made the project worth doing, and fences off the rest.</p>');
  L.done();}},
{part:2,src:'Chapter 5 · Declare out of bounds · Cut back',
 solve:async L=>{for(const p of ['open','cutall','shaped']){L.$('#e12-'+p).click();await L.sleep(30);await L.sk.idle();}},
 run(L){
  const tried=new Set();let fin=false;
  const P={
   open:['Every hole open',{core:0,charge:0,tap:0,fee:0,cases:0,line:0},'The tail stretches far past the appetite. This is what betting on unshaped work looks like.'],
   patch:['Patch only',{core:0,charge:1,tap:1,fee:1,cases:0,line:0},'The tricky details are settled, but the extra use cases and the counter still stretch the tail. Patching alone isn’t enough.'],
   fence:['Fence and cut only',{core:0,charge:0,tap:0,fee:0,cases:1,line:1},'The scope is tighter, but the knots are still in it. The worst runs still blow past the appetite.'],
   cutall:['Cut everything',{core:1},'A perfectly thin tail, and nothing worth building. Taking out risk only counts if you keep the part that made the project worth doing.'],
   shaped:['Patch, fence and cut',{core:0,charge:1,tap:1,fee:1,cases:1,line:1},'Thin tail, and the core is still there. This is what de-risked looks like.']};
  L.h(L.kick('ex','Edge cases')+'<h1 class="q">Push the model to its limits. Try at least these three: every hole open, cut everything, and the shaped version.</h1>'+CSS+
   '<div class="rr-pre" id="e12"></div><div id="x12"></div>');
  const s=L.sk=Stack(L,L.$('#x12'),{id:'k12',rows:['core'].concat(FIVE),noRun:true,lock:true,label:'What each preset does to the concept'});
  s.say('Tap a preset. It sets the concept and runs it 40 times.');
  Object.keys(P).forEach(k=>{const b=document.createElement('button');b.className='chip';b.id='e12-'+k;b.textContent=P[k][0];
    b.onclick=async()=>{if(s.S.busy)return;[...L.$('#e12').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');
      s.set(Object.assign({core:0,charge:0,tap:0,fee:0,cases:0,line:0},P[k][1]));const r=await s.run();if(!r)return;
      tried.add(k);b.classList.add('tried');s.say(L.$('#k12-rd').innerHTML+'<br>'+P[k][2]);
      if(!fin&&['open','cutall','shaped'].every(x=>tried.has(x))){fin=true;
        L.sheet('info','Where the moves stop helping','Patches, fences and cuts thin the tail only when you use them together. And cutting has a floor: cut the core and the tail is perfect, but there’s nothing left to bet on. The skill is removing risk while keeping what made the project worth doing.');L.done();}};
    L.$('#e12').appendChild(b);});}},
{part:2,src:'Chapter 5 · Case study: Patching a hole · Declare out of bounds · Cut back',pts:6,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which move is this?',['Patch the hole','Declare out of bounds','Cut back'],[
   ['Two members tap at once: the first wins, and the other sees “Spot taken.”',0,'A tricky detail settled with a simple rule in the concept.'],
   ['Waitlists for one-to-one personal training aren’t part of this project.',1,'A whole use case fenced off on purpose.'],
   ['A live animated counter of your place in line: fun, but the waitlist works without it.',2,'An exciting extra, dropped from the core.'],
   ['Nobody is charged automatically. The member books and pays the normal way.',0,'A risky question answered with a simpler, known path.'],
   ['Online livestream classes won’t get waitlists for now.',1,'Another case named and left out.'],
   ['Studio-branded message templates are dropped. Maybe later, if time allows.',2,'Nice to have, not needed for the project to be worth it.']]);}},

/* ---------- PART 4: EXPERTS ---------- */
{part:3,src:'Chapter 5 · Present to technical experts',run(L){
  L.h(L.kick('learn','Present to technical experts')+'<h1 class="q">Check your assumptions with someone who knows the code</h1>'+
   L.prose('Until now shaping has been private. Before writing it up, the shaper may need to check a technical assumption, or make sure usage data doesn’t contradict a guess about customers. So they walk an expert through it.')+
   L.list([['chat','Say it’s just an idea','Not something already planned. The mood is friendly and a bit secret: “I’m not showing anyone yet. What do you think?”'],
           ['pencil','Keep it easy to change','A whiteboard, not a document or slides. Redraw the elements from the beginning, stick to your concept first, then invite ideas to simplify.'],
           ['clock','Ask about the appetite','Not “is this possible?” but “is this possible in six weeks?”'],
           ['alert','Hunt for time bombs','You’re looking for '+L.g('time-bomb','time bombs')+' that could blow up once a team is committed.']],2)+
   L.quote('In software, everything is possible but nothing is free.','Ryan Singer, chapter 5'));
  L.done();}},
{part:3,src:'Chapter 5 · Present to technical experts',
 solve:async L=>{const s=L.sk;L.$('#k15-run').click();await L.sleep(30);await s.idle();L.$('#t15-q0').click();L.$('#t15-q1').click();await L.sleep(20);setRow(L,'k15','bomb',1);L.$('#k15-run').click();await L.sleep(30);await s.idle();},
 run(L){
  let fin=false,asked=false;
  L.h(L.kick('ex','Ask Tomás')+'<h1 class="q">Ifeoma has handled every hole on the list. Suppose the waitlist hides one more that only someone who knows the booking code would spot. Run it, then ask Tomás both ways.</h1>'+CSS+
   '<div id="x15"></div>');
  const s=L.sk=Stack(L,L.$('#x15'),{id:'k15',bomb:'hidden',state:{charge:1,tap:1,fee:1,cases:1,line:1},on:e=>{
    if(e.type==='run'&&asked&&!e.bombOpen&&!fin){fin=true;
      L.sheet('info','A time bomb, found before the bet','The vague question got a polite yes and changed nothing. Asking within the appetite turned up a problem worth about four weeks. So Ifeoma goes back for another round of shaping: message one member at a time, and there’s no rush. That’s a normal ending for this session: either the approach is confirmed, or it goes back for more shaping.');L.done();}}});
  Ask(L,L.$('#k15-mid'),s,'t15',q=>{if(q===1){asked=true;s.say('A new hole is on the list. Tap it to send it back for shaping, then run again.');}});}},
{part:3,src:'Chapter 5 · Present to technical experts',pts:1,run(L){
  L.h(L.kick('pr','Run the session')+'<h1 class="q">Put Ifeoma’s session with Tomás in the order the book suggests.</h1>');
  L.order(L.card,['Tell Tomás it’s just an idea, not coming yet','Redraw the elements on a whiteboard from the beginning','Walk through the concept exactly as it was worked out','Open it up: could it be much simpler, or done differently?','Decide: approach confirmed, or back for more shaping'],
   'Keep it easy to change: a whiteboard, not a document. Stick to your own concept first, then invite new ideas.');}},
{part:3,src:'Chapter 5 · Present to technical experts',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Does this help the expert session?',['Helps','Hurts'],[
   ['Ifeoma sends Tomás a polished slide deck to review alone.',1,'Keep it easy to change. Redraw it together on a whiteboard instead.'],
   ['Ifeoma says, “This ships next cycle, just sanity-check it.”',1,'It should be framed as just an idea, not something already coming.'],
   ['Ifeoma asks what could blow up once a team takes it on.',0,'That’s the point: hunting for time bombs.'],
   ['Ifeoma explains why the solution fits six weeks, so Tomás helps keep it that size.',0,'It makes Tomás a partner in holding the appetite.'],
   ['Ifeoma opens by asking Tomás for ideas from scratch, before showing the concept.',1,'Walk through your own concept first, then open it up for new ideas.']]);}},
{part:3,src:'Chapter 5 · De-risked and ready to write up',pts:1,
 solve:async L=>{FIVE.forEach(k=>setRow(L,'k18',k,1));L.$('#t18-q1').click();await L.sleep(20);setRow(L,'k18','bomb',1);L.$('#c18').click();for(let i=0;i<150&&!L.$('#c18ok');i++)await L.sleep(30);},
 run(L){
  let first=true,busy=false;
  L.h(L.kick('pr','Challenge')+'<h1 class="q">Get the waitlist ready for the betting table: at least 36 of 40 runs done by week 6, none after week 7, and the core kept. Use every move you know.</h1>'+CSS+
   '<div id="x18"></div><button class="btn pri" id="c18" style="width:100%;justify-content:center;margin-top:10px">'+L.ic('target')+'Submit it for the bet</button><div id="r18"></div>');
  const s=L.sk=Stack(L,L.$('#x18'),{id:'k18',rows:['core'].concat(FIVE),bomb:'hidden',coreLock:true});
  s.say('Targets are illustrative. Run it as often as you like, then submit.');
  Ask(L,L.$('#k18-mid'),s,'t18');
  L.$('#c18').onclick=async()=>{
    if(busy||s.S.busy)return;busy=true;L.$('#c18').disabled=true;
    const r=await s.run();if(!r)return;
    const pass=r.core&&r.on>=36&&r.worst<=7;
    if(first){L.award(pass);first=false;}
    busy=false;L.$('#c18').disabled=false;
    if(pass){L.$('#c18').disabled=true;L.$('#r18').innerHTML='<span id="c18ok"></span>';
      L.sheet('ok','Ready to bet on','Every hole is patched, fenced off, cut or reshaped, and the core is intact: a thin tail. Notice what it took. Three holes came from walking the use case in slow motion, two from questioning the scope, and one only from asking Tomás the right question.');L.done();}
    else{const vis=FIVE.filter(k=>s.st[k]===0).map(k=>ROWS[k].short);
      let why=vis.length?'Still open: <b>'+vis.join(', ')+'</b>. Each open hole stretches the tail.':
        r.hidden?'Every hole you can see is handled, yet some runs slip for a reason that isn’t on your list. A shaper can’t see every risk alone. Who could you ask, and how?':
        r.bombOpen?'Tomás’s time bomb is still open. Send it back for shaping.':'Look at the slowest run and handle what caused it.';
      L.sheet('no','Not ready yet',why+' Fix it and submit again.');}};}},
{part:3,src:'Chapter 5 · De-risked and ready to write up',run(L){
  L.h(L.kick('learn','De-risked and ready to write up')+'<h1 class="q">From a rough idea with risks in it to a solid idea worth betting on</h1>'+
   L.flow([['box','Elements','Join button, waiting list, “spot opened” message','from chapter 4',1],['check','Patches','First tap wins; no auto-charging; usual late-cancel rule','holes filled',2],['lock','Fences','Regular group classes only','out of bounds',3]])+
   L.prose('With these three, shaping moves from private work with a small inner circle to something others will see. Next the shaper writes it up as a '+L.g('pitch','pitch')+' for the '+L.g('betting-table','betting table')+'.')+
   L.prose('The pitch can lobby for a team, collect wider feedback, or simply save the idea for a better time.'));
  L.done();}}
  ]
});
</script>
