<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hand Over Responsibility, Get One Piece Done</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0009', title:'Hand over responsibility, get one piece done', minutes:20, icon:'pointer',
  goals:['Hand a team a whole project instead of a list of tasks, and know what “done” means','Tell imagined tasks from discovered ones, and respect the quiet first days','Choose the first slice to build: core, small and novel, with design and code wired together'],
  parts:['Hand it over','Getting oriented','One slice','Start in the middle'],
  read:'Read chapters 10 and 11 of the book for the full Clients in Projects story and the screenshots of rough first designs.',
  glossary:{
    'imagined-task':'Imagined task: a task you expect to need just from thinking about the problem, before real work starts.',
    'discovered-task':'Discovered task: a task that only shows up once you are doing the real work. These make up most of a project.',
    slice:'Slice: one small piece of the project built all the way through, with working screens wired to working code, so anyone can click it and try it.',
    affordance:'Affordance: a thing on screen a person can use or read: a button, a field, a place where saved data shows up.',
    kickoff:'Kick-off call: a short call at the start of a project where the team walks through the shaped work and asks questions.'
  },
  cheatsheet:[
    '<b>Assign projects, not tasks.</b> Splitting a pitch into tasks up front is like shredding it. The team defines its own tasks inside the pitch’s boundaries.',
    '<b>Done means deployed</b> by the end of the cycle, testing included. Help docs and announcements can follow in cool-down.',
    '<b>Getting oriented</b> looks like silence. Don’t ask for status early; step in only if the silence lasts past about three days.',
    '<b>Imagined vs discovered tasks</b>: the tasks you find by doing real work are the true bulk of the project.',
    '<b>Integrate one slice</b> in the first week or so: design and code wired together, something real to click.',
    'Programmers don’t wait. Designers hand over <b>affordances</b> first, polish later. Program just enough for the next step.',
    '<b>Start in the middle</b>: pick a first piece that is <b>core</b>, <b>small</b> and <b>novel</b>.'
  ],
  steps:[
/* ---------- PART 1: HAND IT OVER ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">A friend helps you cook a big dinner. Which way will they more likely notice the sauce is missing?</h1>');
  L.mc(L.card,['They get a list of 12 chopping and stirring jobs','They get the whole menu and are asked to make it'],1,
   'Someone who sees the whole meal can spot the gap. Someone working down a chore list just does their chores. This lesson starts from that idea.',
   'A chore list keeps them busy, but nobody asked them to think about the whole meal. Seeing the full menu is what lets them spot the gap.');}},
{part:0,src:'Chapter 10 · Assign projects, not tasks',run(L){
  L.h(L.kick('learn','Assign projects, not tasks')+'<h1 class="q">Nobody splits the pitch into tasks for the team</h1>'+
   L.prose('When a cycle starts, there is no “taskmaster” who cuts the project into pieces for others to do. The book compares that to feeding the pitch through a paper shredder: everyone gets a scrap and nobody holds the whole.')+
   L.lanes([['list','Hand out tasks','Each person does their scrap. Nobody feels responsible for how the pieces fit, and what worked on paper rarely works as planned.',4],
            ['box','Hand over the project','The team takes the whole pitch, defines its own tasks and spots missing pieces as they go.',1]])+
   L.prose('This isn’t total freedom. The shaping already set the boundaries. The team fills in the outline with real design and code, and talented people don’t want to be treated like ticket takers.'));
  L.done();}},
{part:0,src:'Chapter 10 · Kick-off',run(L){
  L.h(L.kick('ex','The waitlist starts')+'<h1 class="q">Pinecone hands the waitlist to Kenji and Bea</h1>');
  L.beats(L.card,[
   ['Day 1','The cycle begins. Ifeoma posts the waitlist pitch where the team works: the problem, the six-week appetite, the solution sketch, the rabbit holes and the no-gos.'],
   ['The temptation','Noor offers to “help” by writing a 30-item task list for Kenji and Bea. Tomás says no: the team will find their own tasks.'],
   ['The '+L.g('kickoff','kick-off call'),'Ifeoma walks Kenji and Bea through the pitch. Bea asks how first tap wins should work. Kenji asks where the “Leave waitlist” link lives.'],
   ['After the call','Kenji and Bea have a rough picture of the whole project. Nobody hands them tickets. They own the waitlist from here.']],
   'The team gets the whole shaped project and a chance to ask questions. The tasks are theirs to find.');}},
{part:0,src:'Chapter 10 · Assign projects, not tasks',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Why does the book want the team to own the whole waitlist, not a list of tasks?</h1>');
  L.mc(L.card,['Task lists take the shaper too long to write','Nobody can predict every task up front','Tasks make it harder to measure each person'],1,
   'Right. What works on paper rarely works exactly as designed. The people doing the work are best placed to adjust and spot missing pieces.',
   'The book’s reason is about knowledge, not effort or measurement: nobody can predict up front what the work will need. The team doing it will find out.');}},
{part:0,src:'Chapter 10 · Done means deployed',run(L){
  L.h(L.kick('learn','Done means deployed')+'<h1 class="q">At the end of the cycle, the work is live</h1>'+
   L.prose('The team deploys by the end of the six weeks. A small batch team with several little projects ships each one when it likes, as long as it’s before the cycle ends. Otherwise the '+L.g('appetite','appetite')+' would mean nothing.')+
   L.lanes([['check','Inside the cycle','Building, deploying, and all testing and QA. The team finishes the most essential parts early and works with QA.',1],
            ['cal','Can follow in cool-down','Help pages, marketing updates and the announcement to customers. These are usually handled by other teams.',2]])+
   L.note('Why can those wait? They are low-risk: they never take five times longer than expected.','info'));
  L.done();}},
{part:0,src:'Chapter 10 · Done means deployed',pts:5,run(L){
  L.h(L.kick('pr','Inside the cycle or after?')+'<h1 class="q">For the waitlist bet, when must each thing happen?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Inside the six weeks','Can wait for cool-down'],[
   ['Testing that first tap wins and the other member sees “Spot taken”',0,'Testing and QA are part of done. They happen inside the cycle.'],
   ['Deploying the waitlist so studios can switch it on',0,'Done means deployed. No deploy, no done.'],
   ['A help page explaining the waitlist to studio owners',1,'Help pages aren’t held to the cycle. They are low-risk and can follow.'],
   ['An email announcing the waitlist to every studio',1,'Announcements often go out in cool-down, after the cycle.'],
   ['Fixing a bug QA finds in the “spot opened” message',0,'A bug in the feature itself blocks done, so it’s fixed inside the cycle.']],
   'The feature, its testing and its deploy fit inside the bet. Docs and announcements can trail behind.');}},

/* ---------- PART 2: GETTING ORIENTED ---------- */
{part:1,src:'Chapter 10 · Getting oriented',run(L){
  L.h(L.kick('learn','Getting oriented')+'<h1 class="q">The first few days look like nothing is happening</h1>'+
   L.prose('No tasks get checked off. Nothing is deployed. There’s often an odd radio silence. That’s because each person is learning how the existing system works and hunting for the best place to start.')+
   L.list([['eye','Respect it','Teams can’t dive straight into a code base. They read code, think through the pitch and try a few short dead ends.'],
     ['lock','Don’t ask for status too early','Pushing for visible progress doesn’t stop the exploring. It just drives it underground.'],
     ['chat','Make it OK to say so','“I’m still figuring out how to start” should be a normal thing to say out loud.'],
     ['clock','Three days','If the silence hasn’t started to break after about three days, it’s reasonable to step in.']],1));
  L.done();}},
{part:1,src:'Chapter 10 · Getting oriented',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Step in, or leave them be?',['Leave them be','Step in now'],[
   ['Day 1. Nothing checked off yet. Noor wants a progress update for the team meeting.',0,'Day 1 silence is normal. Asking now only pushes the exploring underground.'],
   ['Day 2. Bea posts: “Still figuring out where to start in the booking code.”',0,'That’s exactly the honest signal the book wants people to feel free to give.'],
   ['Day 4. Not a word from Kenji or Bea since the kick-off call.',1,'Silence that hasn’t broken after about three days is the time to check in.'],
   ['Day 2. Kenji is reading how class pages render on mobile. No designs yet.',0,'Learning the lay of the land is real work, even with nothing to show.']]);}},
{part:1,src:'Chapter 10 · Imagined vs discovered tasks',run(L){
  L.h(L.kick('learn','Imagined vs discovered tasks')+'<h1 class="q">Most of the work is found, not planned</h1>'+
   L.prose('The team starts with '+L.g('imagined-task','imagined tasks')+': what they assume they’ll need from thinking about the problem. Then real work turns up '+L.g('discovered-task','discovered tasks')+'. These make up the true bulk of the project, and often the hardest parts.')+
   L.flow([['bulb','Imagined','“Add a new button”','before work starts',3],['pencil','Real work','The button lands on desktop','hands dirty',2],['alert','Discovered','“No room for it on mobile”','a new task',4]])+
   L.prose('Tasks also pop up while doing something unrelated, like noticing code that must change later while reading it for another reason. The only way to really know what needs doing is to start doing real work.'));
  L.done();}},
{part:1,src:'Chapter 10 · Imagined vs discovered tasks',run(L){
  L.h(L.kick('ex','Week one on the waitlist')+'<h1 class="q">Kenji and Bea start finding tasks nobody imagined</h1>');
  L.beats(L.card,[
   ['Kenji, desktop','Kenji adds the “Join waitlist” button where “Book” used to be on a full class. It looks fine on desktop.'],
   ['Kenji, phone','On the small class card in the phone app, the “Class full” label already fills that spot. New task: <b>find room for the button on mobile</b>.'],
   ['Bea, reading code','Bea is studying how bookings are saved and spots that cancelling a booking doesn’t tell any other part of the app it happened. New task for later: <b>make cancelling announce that a spot opened</b>.'],
   ['Kenji, copy','Testing the flow, Kenji sees members won’t know what happens after they join. Two new tasks: <b>write a short line explaining it</b>, and <b>rework the layout to fit it</b>.']],
   'None of these tasks were on anyone’s list on day 1. They appeared because Kenji and Bea were doing real work.');}},
{part:1,src:'Chapter 10 · Imagined vs discovered tasks',pts:5,run(L){
  L.h(L.kick('pr','Imagined or discovered?')+'<h1 class="q">Which tasks could the team list on day 1, and which come from doing the work?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Imagined at the start','Discovered while working'],[
   ['Add a “Join waitlist” button to full classes',0,'The pitch names this element, so anyone could list it before starting.'],
   ['The waiting list overlaps the room name on studios with two rooms',1,'Only seen by building it and looking at Ironleaf’s two-room schedule.'],
   ['Send a “spot opened” message by email and in the app',0,'This is in the pitch, so it’s an obvious task from the start.'],
   ['An old booking method needs a fix before first tap wins can work',1,'Found by reading the code while working on something else.'],
   ['The “Spot taken” screen needs a link back to the class page',1,'Clicking through the real flow revealed a dead end.']],
   'Imagined tasks come from the pitch and from thinking. Discovered tasks come from building, reading code and clicking through.');}},

/* ---------- PART 3: ONE SLICE ---------- */
{part:2,src:'Chapter 11 · Get One Piece Done · Integrate one slice',run(L){
  L.h(L.kick('learn','Integrate one slice')+'<h1 class="q">Lots of tasks done, nothing really done</h1>'+
   L.prose('A team can check off many tasks and still have nothing to click on. That feels insecure. So the book says: don’t plan parts that come together in the last hour. Make something real and demoable early, in the first week or so.')+
   L.lanes([['layers','Horizontal layers','Design many screens, or build lots of back-end logic. Until they’re joined, nothing does anything, and you can’t judge if it’s right.',4],
            ['pointer','One vertical '+L.g('slice','slice'),'Pick one small piece. Wire its screen to its code. Now anyone can click it and see if it does what it should.',1]])+
   L.prose('The two layers that matter most are front-end and back-end: design and code.'));
  L.done();}},
{part:2,src:'Chapter 11 · Integrate one slice',pts:1,
 solve:async L=>{L.$('#go').click();},
 run(L){
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Two ways to spend the first week of the waitlist. Press the button to jump to Friday’s demo.</h1>'+
   L.lanes([['layers','Plan A: layers','Kenji designs all six waitlist screens. Bea builds the whole waitlist back-end.<div class="res" id="la"></div>',4],
            ['pointer','Plan B: one slice','Kenji and Bea wire up only “Join waitlist” on a full class, end to end.<div class="res" id="lb"></div>',1]])+
   '<button class="btn pri" id="go" style="margin-top:14px">'+L.ic('play')+'Friday: demo to Ifeoma</button><div id="hq"></div>');
  L.$('#go').onclick=function(){this.remove();
    L.$('#la').innerHTML='<span style="color:var(--no)">22 tasks checked off. Beautiful mockups, a tested back-end. Nothing to click. Will it fit together? Fingers crossed.</span>';
    L.$('#lb').innerHTML='<span style="color:var(--ok)">7 tasks checked off. Ifeoma taps “Join waitlist” on a real full class and shows up on the waiting list.</span>';
    const q=L.$('#hq');q.innerHTML='<h2 class="sub">Which team knows more about whether the waitlist will work?</h2>';
    L.mc(q,['Plan A, because it finished more tasks','Plan B, because it has a working piece'],1,
     'A working slice proves (or disproves) the idea for real. Plan A’s pieces are still a guess until they’re joined.',
     'More tasks isn’t more certainty. Plan A’s screens and code have never met. Plan B has something proven to work.');};}},
{part:2,src:'Chapter 11 · Case study: Clients in projects',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">How one designer and one programmer finished a first piece in three days</h1>');
  L.beats(L.card,[
   ['The project','Basecamp let firms invite clients and share only chosen content with them. The pitch had three parts: client access (heavy back-end work), client management, and a visibility toggle on each item.'],
   ['Pick a piece','After getting oriented, the designer chose the toggle. It was the most central piece of the interface, the one customers would use most.'],
   ['Rough, not polished','He didn’t make a pixel-perfect mockup. He tried different controls right in the app’s templates. Meanwhile the programmer started on the access model, guided by the pitch.'],
   ['Wire it','Once the designer liked the direction, the programmer briefly wired the toggle: it showed on all content, changed when clicked and saved its state. It didn’t yet hide anything from clients.'],
   ['Done','The designer kept refining it alone. About three days in, he demoed it to a manager, made a few tweaks, and called it done.']],
   'One piece designed, built, demoed and settled early. Both the team and management gained confidence from clicking a real thing.');}},
{part:2,src:'Chapter 11 · Case study: Clients in projects',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Kenji is still trying out where the “Join waitlist” button goes. What should Bea do meanwhile?</h1>');
  L.mc(L.card,['Wait for Kenji’s finished button design','Start modeling waiting members from the pitch','Polish the studio settings screen first'],1,
   'Right. Like the programmer in the book’s story, Bea has enough direction from the pitch to start on the back-end.',
   'The pitch already defines the moving parts, so Bea can start on back-end work like how waiting members are stored. Waiting wastes time, and settings aren’t the core.');}},
{part:2,src:'Chapter 11 · Affordances before pixel-perfect screens',run(L){
  L.h(L.kick('learn','Affordances first, pixels later')+'<h1 class="q">The first design a programmer gets can look very basic</h1>'+
   L.prose('Programmers don’t need a polished design to start. They need '+L.g('affordance','affordances')+': input fields, buttons, places where saved data should appear. Font, color, spacing and layout can come once those are wired up.')+
   L.quote('First make it work, then make it beautiful.','Ryan Singer, Shape Up, chapter 11')+
   L.prose('A rough first screen still tests the big questions: Does it make sense? Is it understandable? Does it do what we want? The book shows rough screens with plain links and bare borders that still settled real decisions. If the idea fails, little polish was wasted.'));
  L.done();}},
{part:2,src:'Chapter 11 · Program just enough for the next step',run(L){
  L.h(L.kick('learn','Program just enough for the next step')+'<h1 class="q">Back-end work can be patchy on purpose</h1>'+
   L.prose('The same holds for code. A designer may only need a couple of fields that save, a route from one rough screen to the next, or real data in a template to try different layouts.')+
   L.list([['layers','Strategically patchy','A screen with no data model yet, or a model with fake data and no way to edit it. Fine for now.'],
     ['lock','The book’s example','An interview app needed protecting before real data went in. Instead of building full login, the team hard-coded one simple password.'],
     ['cycle','Take turns','No big hand-off. Design and code take turns adding affordances, wiring and styling on the same piece, clicking through it each time.']],2));
  L.done();}},
{part:2,src:'Chapter 11 · Affordances before pixel-perfect screens',pts:6,run(L){
  L.h(L.kick('pr','Now or later?')+'<h1 class="q">Kenji and Bea are wiring the first version of “Join waitlist”. What does it need right now?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Needed for the first wired version','Can wait until it works'],[
   ['A “Join waitlist” button on a full class',0,'This is the affordance itself. Nothing works without it.'],
   ['The exact shade and rounded corners of the button',1,'Visual styling matters in the end product, not on the first pass.'],
   ['Saving that a member joined the waitlist',0,'That’s the wiring that makes the button actually do something.'],
   ['A place where the member sees they’re on the list',0,'A place where saved data shows up is a core affordance.'],
   ['A full studio login just to test it on staging',1,'Like the hard-coded password, a quick stand-in is enough for now.'],
   ['A smooth animation when the member joins',1,'Polish that can be layered on once the slice works.']],
   'Affordances plus just enough code to make them work. Styling and extras come after.');}},

/* ---------- PART 4: START IN THE MIDDLE ---------- */
{part:3,src:'Chapter 11 · Start in the middle',run(L){
  L.h(L.kick('learn','Start in the middle')+'<h1 class="q">Skip the setup, go straight to the interesting problem</h1>'+
   L.prose('In the book’s examples, the teams didn’t build login first, or a way to create projects. They jumped to the middle where the real problem was and stubbed the rest. To choose what to build first, check three things:')+
   L.list([['target','Core','Without it, the rest means nothing. The toggle was core; renaming a client was required but on the edge.'],
     ['clock','Small','Small enough to finish in a few days, so there’s something real to click and momentum builds.'],
     ['bulb','Novel','If two pieces are core and small, pick the one you’ve never done before. It removes the most uncertainty.']],1)+
   '<p class="small" style="margin-top:10px">In the client story, adding clients looked like adding regular users. Starting there would have moved the project but taught nobody anything.</p>');
  L.done();}},
{part:3,src:'Chapter 11 · Start in the middle',pts:1,run(L){
  L.h(L.kick('try','Build the rule')+'<h1 class="q">Tap each piece until the sentence states the book’s rule for choosing what to build first.</h1>');
  L.sentence(L.card,[['a core','a polished'],['but big','and small'],['and novel','and familiar'],['layer','piece']],[0,1,0,1],
   [['Polish comes last. The first piece should be central to the project.'],['A big first piece takes too long to finish and gives no early win.'],['Familiar work moves things along but teaches you nothing new.'],['A layer is only design or only code. You want a whole piece wired together.']],
   'Core, small, novel, and one piece built all the way through.');}},
{part:3,src:'Chapter 11 · Start in the middle',pts:1,
 solve:async L=>{const c=L.$('#cand').children;for(const b of c)b.click();},
 run(L){
  const C=[['Studio settings: turn the waitlist on or off',0,1,0,'Required, but on the edge. The waitlist means nothing without people joining it.'],
           ['Leave waitlist link',0,1,0,'Small, but not central, and it works like cancelling a booking, which Pinecone already does.'],
           ['Join waitlist, saved and shown on a full class',1,1,1,'Central, a few days of work, and Pinecone has never had a waitlist before.'],
           ['The full “spot opened” system with first tap wins',1,0,1,'Core and new, but it’s weeks of work with Tomás’s time bomb inside. Too big to go first.']];
  const seen=new Set();
  L.h(L.kick('pr','Pick the first piece')+'<h1 class="q">Tap each candidate to check it against core, small and novel.</h1><div id="cand" class="opts"></div>'+
   '<div style="background:var(--soft);border-radius:16px;padding:14px;margin:8px 0 6px;min-height:96px"><div id="cr" class="small">Tap a candidate above.</div></div><div id="cq"></div>');
  C.forEach((c,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=c[0];b.onclick=()=>{[...L.$('#cand').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(j);
    L.$('#cr').innerHTML=['Core','Small','Novel'].map((n,k)=>'<span class="chip static'+(c[k+1]?' ok':'')+'" style="'+(c[k+1]?'':'opacity:.45')+'">'+(c[k+1]?L.ic('check'):L.ic('x'))+n+'</span>').join('')+'<div style="margin-top:8px">'+c[4]+'</div>';
    if(seen.size===C.length&&!L.$('#cq').innerHTML){const q=L.$('#cq');q.innerHTML='<h2 class="sub">Which piece should Kenji and Bea build first?</h2>';
      L.mc(q,['Studio settings','Leave waitlist','Join waitlist','The spot-opened system'],2,
       'It’s the only one that passes all three checks. Within days, Ifeoma can tap it on a real class.',
       'Look for the one with three checks. Settings and leaving are on the edge; the spot-opened system is too big to finish in a few days.');}};L.$('#cand').appendChild(b);});}},
{part:3,src:'Chapter 10 · Kick-off · Chapter 11 · Integrate one slice',pts:1,run(L){
  L.h(L.kick('pr','Put it in order')+'<h1 class="q">Order the first stretch of the waitlist project, from day 1.</h1>');
  L.order(L.card,['Ifeoma posts the pitch and holds the kick-off call','Kenji and Bea get oriented in the code and design','They wire “Join waitlist” end to end, rough','Ifeoma clicks through it and they settle it','They pick the next piece to integrate'],
   'Hand over, get oriented, wire one rough slice, demo and settle it, then move to the next piece.');}},
{part:3,src:'Chapter 10–11 · review',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Good move or misstep?',['Good move','Misstep'],[
   ['Kenji spends week one perfecting the waitlist’s colors and fonts before Bea wires anything.',1,'Polish before it works risks wasted effort. Affordances first, pixels later.'],
   ['Bea fills the waiting-list screen with fake members so Kenji can try different layouts.',0,'Program just enough for the next step. Mock data lets design move.'],
   ['Noor asks for a daily task count from day 1 to “see progress”.',1,'Early status requests push exploring underground. Let the team get oriented.'],
   ['Bea writes down a booking method to fix later, then goes back to the current task.',0,'Noting a discovered task and moving on keeps the work flowing.'],
   ['The team builds member login improvements first, “so everything else is easier”.',1,'That’s setup at the edge. Start in the middle, where the real problem is.']]);}}
  ]
});
</script>
</body>
</html>
