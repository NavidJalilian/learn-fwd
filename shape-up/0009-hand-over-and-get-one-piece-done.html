const hvSleep=ms=>new Promise(r=>setTimeout(r,ms));
const hvIc=n=>Course&&Course.icon?Course.icon(n):'';

/* ---------- the build grid: rows are layers (design, code), columns are waitlist pieces ---------- */
const SG_DAY=['Mon','Tue','Wed','Thu','Fri'];
const SG_DAYL=['Monday','Tuesday','Wednesday','Thursday','Friday'];
const SG_P=[
 {short:'Join',name:'Join the waitlist',
  D:['Try spots for a “Join waitlist” button on a real class page','Rough “You’re on the list” line'],

 {short:'Spot opens',name:'Spot opens',
  D:['Rough “A spot opened” screen','Rough “Spot taken” screen'],

 {short:'Notify',name:'Notify members',

  C:['Pick who gets told when a spot opens','Send by email, like the class-cancelled email'],
  W:'Wire it: the message links to the class',
  P:['Final colors and fonts','Pixel-perfect spacing'],
  bd:[1,1,0],ok:'Ifeoma gets a rough “spot opened” email with a link to the class.'},
 {short:'Settings',name:'Studio settings',

  C:['Save the switch for each studio','Load the waiting members for the list'],

  bd:[0,1,0],ok:'Ifeoma flips the waitlist switch on and off. No member can join yet.'}];
const SG_WHY=['Without joining, nothing else in the waitlist means anything. A few days of work. And Pinecone has never had a waitlist.',
 'Core and new, but weeks of back-end work with Tomás’s time bomb inside. Too big to finish first.',
 'Core and small, but not novel: Pinecone already sends emails like the class-cancelled one. It would teach the team little.',
 'Required, but on the edge: a switch nobody needs until members can join. Not core.'];
function sgNew(){return {day:0,k:null,b:null,idleK:0,idleB:0,found:0,ev:{},log:[],
  cols:SG_P.map(p=>({D:p.D.map(t=>({t,done:false})),F:[],P:p.P.map(t=>({t,done:false})),C:p.C.map(t=>({t,done:false})),W:{t:p.W,done:false},clk:false}))};}
const sgClk=c=>c.D.every(x=>x.done)&&c.C.every(x=>x.done)&&c.W.done;
const sgFirst=(st,f,ord)=>{for(const i of (ord||[0,1,2,3]))if(f(st.cols[i]))return i;return null;};
const sgOpenD=c=>c.D.some(x=>!x.done)||c.F.some(x=>!x.done);
const SG_PLAN={
 manual:{k:st=>st.k==null?null:{c:st.k},b:st=>st.b==null?null:{c:st.b}},
 layers:{label:'All design first',k:st=>{const c=sgFirst(st,c=>c.D.some(x=>!x.done));return c==null?null:{c};},
  b:st=>{const c=sgFirst(st,c=>c.C.some(x=>!x.done));return c==null?null:{c,m:'skipWire'};}},
 slice:{label:'One slice through',k:st=>({c:sgFirst(st,sgOpenD)}),b:st=>({c:sgFirst(st,c=>!c.clk)})},
 noor:{label:'Noor’s 30-item list',k:st=>({c:[0,1,2,3,0][st.day]}),b:st=>({c:[3,2,1,0,2][st.day]})},
 polish:{label:'Kenji polishes first',k:()=>({c:0,m:'polish'}),b:()=>({c:0})},
 wait:{label:'Bea waits for designs',k:st=>({c:sgFirst(st,sgOpenD)}),b:()=>({c:0,m:'waitDesign'})},
 settings:{label:'Start with settings',k:st=>({c:sgFirst(st,c=>c.D.some(x=>!x.done),[3,0,1,2])}),b:st=>({c:sgFirst(st,c=>!c.clk,[3,0,1,2])})}};
function sgStep(st,plan){
  if(st.day>=5)return;
  const startD=st.cols.map(c=>c.D.every(x=>x.done)),startAll=st.cols.map(c=>c.D.every(x=>x.done)&&c.F.every(x=>x.done));
  const kp=plan.k(st),bp=plan.b(st),line={d:st.day,k:'',b:'',ev:[]};
  st.k=kp?kp.c:null;st.b=bp?bp.c:null;
  if(kp&&kp.c!=null){const c=st.cols[kp.c],ord=kp.m==='polish'?[c.P,c.D,c.F]:[c.D,c.F,c.P];let t=null;
    for(const a of ord){t=a.find(x=>!x.done);if(t)break;}
    if(t){t.done=true;line.k=t.t+(c.P.includes(t)?' (polish)':'');}else{line.k='nothing left here';line.kIdle=1;st.idleK++;}}
  if(bp&&bp.c!=null){const c=st.cols[bp.c];let r;
    if(bp.m==='waitDesign'&&!startAll[bp.c])r={w:'waits for Kenji’s finished designs'};
    else{const t=c.C.find(x=>!x.done);
      if(t)r={t};
      else if(bp.m==='skipWire')r={w:'leaves the wiring for the end'};
      else if(!c.W.done)r=startD[bp.c]?{t:c.W}:{w:'waits: no rough buttons to wire yet'};
      else r={w:'has nothing left on this piece'};}
    if(r.t){r.t.done=true;line.b=r.t.t;}else{line.b=r.w;line.bIdle=1;st.idleB++;}}
  const J=st.cols[0],S=st.cols[1];
  if(!st.ev.mob&&J.D[0].done){st.ev.mob=1;J.F.push({t:'Find room for the button on the phone’s class card',done:false});st.found++;
    line.ev.push(['found','Kenji, on a phone: the class card has no room for the new button. New task for Join.']);}
  if(!st.ev.cancel&&(J.C[0].done||S.C[0].done)){st.ev.cancel=1;S.C.push({t:'Make cancelling announce that a spot opened',done:false,f:1});st.found++;
    line.ev.push(['found','Bea, reading the booking code: cancelling doesn’t tell the rest of the app. New task for Spot opens.']);}
  st.cols.forEach((c,i)=>{if(!c.clk&&sgClk(c)){c.clk=true;line.ev.push(['works',SG_P[i].name+' is wired. Anyone can click it now.']);
    if(i===0&&!st.ev.copy){st.ev.copy=1;J.F.push({t:'Write a line on what happens after joining',done:false},{t:'Rework the layout to fit that line',done:false});st.found+=2;
      line.ev.push(['found','Kenji, clicking through: members won’t know what happens after they join. Two new tasks.']);}}});
  st.day++;st.log.push(line);}
function sgCount(st){let n=0;st.cols.forEach(c=>{[c.D,c.F,c.P,c.C].forEach(a=>a.forEach(x=>{if(x.done)n++;}));if(c.W.done)n++;});return n;}
function sgResult(st){return {clk:st.cols.map(c=>c.clk),n:st.cols.filter(c=>c.clk).length,checked:sgCount(st),found:st.found,idleK:st.idleK,idleB:st.idleB};}
/* o: {manual, strats:[keys], badges, onDay(st), onFriday(res)} */
function sgGrid(host,o){o=o||{};
  host.insertAdjacentHTML('beforeend','<div class="hv-g">'+
   '<div class="hv-days" aria-hidden="true">'+SG_DAY.map(d=>'<span>'+d+'</span>').join('')+'</div>'+
   '<div class="hv-grid" role="group" aria-label="Build grid: design and code for four waitlist pieces"></div>'+
   '<div class="hv-leg"><span><i class="pp d"></i>task done</span><span><i class="pp"></i>to do</span><span><i class="pp f d"></i>found while working</span><span><i class="pp p"></i>polish</span></div>'+
   (o.manual?'<div class="hv-ctl"><button class="btn pri" data-a="run"></button><button class="btn" data-a="reset">'+hvIc('cycle')+'Reset</button></div>':'')+
   '<div class="hv-stats" aria-live="polite"></div><div class="hv-log" aria-live="polite"></div><div class="hv-demo"></div></div>');
  const el=host.lastElementChild,g={st:sgNew(),run:0,el,badges:false};
  const pips=a=>a.map(x=>'<i class="pp'+(x.f?' f':'')+(x.done?' d':'')+'"></i>').join('');
  g.draw=()=>{const st=g.st,last=st.log[st.log.length-1]||{};let h='<span></span>';
    SG_P.forEach((p,i)=>{h+='<div class="hv-gh'+(st.cols[i].clk?' on':'')+'">'+p.short+(st.cols[i].clk?'<small>clickable</small>':'')+
      (g.badges?'<span class="hv-bd" aria-label="core, small, novel">'+['C','S','N'].map((l,j)=>'<em class="'+(p.bd[j]?'y':'n')+'">'+l+'</em>').join('')+'</span>':'')+'</div>';});
    const cell=(r,i)=>{const c=st.cols[i],at=(r==='k'?st.k:st.b)===i,idle=at&&st.day>0&&(r==='k'?last.kIdle:last.bIdle);
      const inner=r==='k'?pips(c.D)+c.F.map(x=>'<i class="pp f'+(x.done?' d':'')+'"></i>').join('')+c.P.filter(x=>x.done).map(()=>'<i class="pp p"></i>').join(''):pips(c.C);
      const nd=r==='k'?c.D.filter(x=>x.done).length+'/'+c.D.length+' rough affordances':c.C.filter(x=>x.done).length+'/'+c.C.length+' code tasks';
      return '<button class="hv-c '+r+(at?' at':'')+(c.clk?' lit':'')+'" data-r="'+r+'" data-c="'+i+'"'+(o.manual?'':' disabled')+' aria-label="'+(r==='k'?'Design':'Code')+' for '+SG_P[i].name+': '+nd+(at?', '+(r==='k'?'Kenji':'Bea')+' is here':'')+'">'+inner+
        (at?'<b class="hv-who '+r+(idle?' idle':'')+'">'+(r==='k'?'K':'B')+'</b>':'')+'</button>';};
    h+='<span class="hv-rl">Design<small>Kenji</small></span>';SG_P.forEach((p,i)=>h+=cell('k',i));
    h+='<span class="hv-rl sm">Wired?</span>';SG_P.forEach((p,i)=>h+='<span class="hv-w'+(st.cols[i].W.done?' on':'')+'"><b>'+(st.cols[i].W.done?'wired':'no')+'</b></span>');
    h+='<span class="hv-rl">Code<small>Bea</small></span>';SG_P.forEach((p,i)=>h+=cell('b',i));
    el.querySelector('.hv-grid').innerHTML=h;
    el.querySelectorAll('.hv-days span').forEach((s,j)=>{s.className=j<st.day?'past':(j===st.day&&o.manual?'now':'');});
    const r=sgResult(st);
    el.querySelector('.hv-stats').innerHTML='<div><b>'+r.checked+'</b>tasks checked</div><div><b>'+r.found+'</b>found while working</div><div class="'+(st.day===5?(r.n?'good':'bad'):'')+'"><b>'+r.n+'</b>pieces to click</div>';
    const lg=el.querySelector('.hv-log');
    if(!st.log.length)lg.innerHTML=o.manual?'<span class="small">'+(st.k==null||st.b==null?'Tap a design cell for Kenji and a code cell for Bea.':'Kenji and Bea are placed. Run the day.')+'</span>':'';
    else lg.innerHTML='<b>'+SG_DAY[last.d]+'</b> · Kenji: '+last.k+' · Bea: '+last.b+
      last.ev.map(e=>'<div class="hv-ev '+e[0]+'">'+hvIc(e[0]==='works'?'check':'alert')+'<span>'+e[1]+'</span></div>').join('')+
      (last.bIdle||last.kIdle?'<div class="hv-ev idle">'+hvIc('clock')+'<span>An idle day for '+(last.kIdle&&last.bIdle?'both':last.kIdle?'Kenji':'Bea')+'.</span></div>':'');
    if(o.manual){const b=el.querySelector('[data-a="run"]');b.hidden=st.day>=5;b.innerHTML=hvIc('play')+'Run '+(SG_DAYL[st.day]||'');}};
  g.demo=()=>{const st=g.st;let h='<h2 class="sub">Friday demo for Ifeoma</h2><div class="hv-dm">';
    st.cols.forEach((c,i)=>{const dz=c.D.every(x=>x.done),dn=c.D.some(x=>x.done)||c.P.some(x=>x.done),cn=c.C.some(x=>x.done);
      const t=c.clk?SG_P[i].ok:dz&&cn?'Screens and code that haven’t met yet. Nothing to tap.':(dz||dn)&&!cn?'Rough screens with no code behind them. The buttons do nothing.':cn&&!(dz||dn)?'Back-end work with nothing to tap.':dn&&cn?'Bits of screen and bits of code that haven’t met. Nothing to tap.':'Not started.';
      h+='<span class="i '+(c.clk?'y':'n')+'">'+hvIc(c.clk?'check':'x')+'</span><span><b>'+SG_P[i].name+'.</b> '+t+'</span>';});
    el.querySelector('.hv-demo').innerHTML=h+'</div>';};
  g.reset=()=>{g.run++;g.st=sgNew();el.querySelector('.hv-demo').innerHTML='';g.draw();};
  g.step=plan=>{sgStep(g.st,plan);g.draw();if(o.onDay)o.onDay(g.st);if(g.st.day===5){g.demo();if(o.onFriday)o.onFriday(sgResult(g.st));}};
  g.play=async(key,ms,days)=>{g.reset();const id=g.run,P=SG_PLAN[key];
    for(let d=0;d<(days||5);d++){await hvSleep(ms);if(id!==g.run||!el.isConnected)return null;g.step(P);}
    return sgResult(g.st);};
  if(o.manual){
    el.querySelector('.hv-grid').addEventListener('click',e=>{const b=e.target.closest('.hv-c');if(!b||g.st.day>=5)return;
      if(b.dataset.r==='k')g.st.k=+b.dataset.c;else g.st.b=+b.dataset.c;g.draw();});
    el.querySelector('[data-a="run"]').onclick=()=>{if(g.st.k==null||g.st.b==null){el.querySelector('.hv-log').innerHTML='<div class="hv-ev idle">'+hvIc('info')+'<span>Place both first: tap a design cell for Kenji and a code cell for Bea.</span></div>';return;}g.step(SG_PLAN.manual);};
    el.querySelector('[data-a="reset"]').onclick=()=>{g.reset();if(o.onReset)o.onReset();};}
  g.draw();return g;}
const sgTap=(L,r,c)=>L.$('.hv-c[data-r="'+r+'"][data-c="'+c+'"]').click();
const sgRun=(L,n)=>{for(let j=0;j<n;j++)L.$('[data-a="run"]').click();};

/* ---------- the quiet-days strip: what Noor sees above the line, what is really happening below ---------- */
const QD_SRC={
 calm:[
  {or:['Kenji reads how class pages draw on phones','Bea reads the booking code','Both reread the pitch'],see:[]},
  {or:['Bea tries one place in the code for the waiting list: a dead end','Kenji tries the button in two places'],see:[],honest:'Bea: “Still figuring out how to start.”'},
  {or:['Bea finds the right place in the code'],see:[['c','Store waiting members'],['m','Kenji: “First rough button is up.”']]},
  {or:[],see:[['c','Show who’s waiting'],['c','Rough “You’re on the list” line'],['c','Room for the button on phones']]},
  {or:[],see:[['c','Wire the button'],['m','Ifeoma clicks “Join waitlist”'],['c','Line on what happens after joining']]}],
 stuck:[
  {or:['Kenji reads how class pages draw on phones','Bea reads the booking code','Both reread the pitch'],see:[]},
  {or:['Kenji tries the button in two places','Bea tries one place in the code: a dead end'],see:[]},
  {or:['Kenji redraws the phone class card','Bea tries another place in the code: a dead end'],see:[]},
  {or:['Kenji redraws the phone class card again','Bea rereads the pitch'],see:[]},
  {or:['Kenji is still stuck on the phone class card'],see:[]}]};
function qdWeek(key,honest){return QD_SRC[key].map(d=>({or:d.or.map(t=>({t})),see:(honest&&d.honest?[['m',d.honest]]:[]).concat(d.see).map(s=>({k:s[0],t:s[1]}))}));}
function qdAsk(w,d){const real=w.map(x=>x.see.filter(s=>s.k!=='f'));const n=w.map(x=>({or:x.or.slice(),see:x.see.slice()}));
  for(let i=4;i>=d;i--)n[i].see=i===d?[{k:'f',t:'Status update: “Setting up the database”',nw:1}]:real[i-1].map(s=>Object.assign({},s,{nw:1}));
  if(n[d].or.length){const mv=n[d].or.pop();n[Math.min(4,d+1)].or.push({t:mv.t+' (pushed out of sight, a day later)',mv:1,nw:1});}
  return n;}
const qdChecks=w=>w.reduce((a,d)=>a+d.see.filter(s=>s.k==='c').length,0);
function qdSvg(w,o){o=o||{};let s='<svg class="hv-qs" viewBox="0 0 320 150" role="img" aria-label="Five days. Above the line: what Noor can see. Below: the work that is really happening.">'+
  '<text x="11" y="48" transform="rotate(-90 11 48)" text-anchor="middle" font-size="11" font-weight="600" fill="var(--muted)">Noor sees</text>'+
  '<text x="11" y="116" transform="rotate(-90 11 116)" text-anchor="middle" font-size="11" font-weight="600" fill="var(--h2)">Hidden</text>';
  w.forEach((d,i)=>{const x=31+i*57;
    if(o.sel===i)s+='<rect x="'+(x-4)+'" y="1" width="56" height="148" rx="8" fill="var(--pri-bg)"/>';
    d.see.forEach((it,j)=>{const y=82-(j+1)*17;const F=it.k==='c'?['var(--ok-bg)','var(--ok)']:it.k==='m'?['var(--pri-bg)','var(--pri)']:['var(--no-bg)','var(--no)'];
      s+='<g'+(it.nw&&o.anim?' class="nw"':'')+'><rect x="'+x+'" y="'+y+'" width="48" height="14" rx="4" fill="'+F[0]+'" stroke="'+F[1]+'" stroke-width="1.4"'+(it.k==='f'?' stroke-dasharray="3 2"':'')+'/>';
      if(it.k==='c')s+='<path d="M'+(x+18)+' '+(y+7)+'l4 4 7-8" fill="none" stroke="'+F[1]+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
      else if(it.k==='m')s+='<circle cx="'+(x+18)+'" cy="'+(y+7)+'" r="1.8" fill="'+F[1]+'"/><circle cx="'+(x+24)+'" cy="'+(y+7)+'" r="1.8" fill="'+F[1]+'"/><circle cx="'+(x+30)+'" cy="'+(y+7)+'" r="1.8" fill="'+F[1]+'"/>';
      else s+='<text x="'+(x+24)+'" y="'+(y+11)+'" text-anchor="middle" font-size="11" font-weight="700" fill="'+F[1]+'">?!</text>';
      s+='</g>';});
    const fog=o.fog==='all'||(o.fog&&o.fog.has&&!o.fog.has(i));
    if(fog){s+='<rect x="'+x+'" y="90" width="48" height="48" rx="6" fill="var(--soft2)"/><text x="'+(x+24)+'" y="119" text-anchor="middle" font-size="15" font-weight="700" fill="var(--faint)">?</text>';}
    else d.or.forEach((it,j)=>{const y=90+j*17;s+='<rect'+(it.nw&&o.anim?' class="nw"':'')+' x="'+x+'" y="'+y+'" width="48" height="14" rx="4" fill="var(--h2-bg)" stroke="var(--h2)" stroke-width="1.4"'+(it.mv?' stroke-dasharray="3 2"':'')+'/>';});
    if(o.mark===i)s+='<line x1="'+(x+24)+'" y1="4" x2="'+(x+24)+'" y2="146" stroke="'+(o.markOk?'var(--ok-strong)':'var(--no-strong)')+'" stroke-width="2.5" stroke-dasharray="5 3"/>';});
  s+='<line x1="24" y1="86" x2="318" y2="86" stroke="var(--ink)" stroke-width="1.6"/></svg>';return s;}
function qdText(w,i){const d=w[i];
  const see=d.see.length?d.see.map(s=>(s.k==='c'?'✓ ':s.k==='f'?'For show: ':'')+s.t).join(' · '):'nothing at all';
  return '<span class="t">'+SG_DAYL[i]+'</span><div><b>Noor sees:</b> '+see+'</div><div style="margin-top:3px"><b style="color:var(--h2)">Really happening:</b> '+(d.or.length?d.or.map(x=>x.t).join(' · '):'mostly visible work now')+'</div>';}
function qdSeenLine(w){return SG_DAY.map((n,i)=>{const c=w[i].see.filter(s=>s.k==='c').length,m=w[i].see.filter(s=>s.k==='m').length;return '<b>'+n+'</b> '+(c||m?(c?c+' ✓':'')+(c&&m?', ':'')+(m?m+' message':''):'silence');}).join(' · ');}

Course.lesson({
  id:'0009', title:'Hand over responsibility, get one piece done', minutes:22, icon:'pointer',
  goals:['Hand a team a whole project instead of a list of tasks, and know what “done” means','Respect the quiet first days, and know when it’s fair to step in','Pick a first slice that is core, small and novel, and wire design and code together on it early'],
  parts:['Hand it over','Getting oriented','One slice','Start in the middle'],
  read:'Read chapters 10 and 11 of the book for the full Clients in Projects story and the screenshots of rough first designs.',
  glossary:{
    'imagined-task':'Imagined task: a task you expect to need just from thinking about the problem, before real work starts.',
    'discovered-task':'Discovered task: a task that only shows up once you are doing the real work. These make up most of a project.',
    slice:'Slice: one small piece of the project built all the way through, with working screens wired to working code, so anyone can click it and try it.',
    affordance:'Affordance: a thing on screen a person can use or read: a button, a field, a place where saved data shows up.',
    kickoff:'Kick-off call: a short call at the start of a project where the team walks through the shaped work and asks questions.',
    layer:'Layer: one kind of work across the whole project, such as all the design or all the back-end code.'
  },
  cheatsheet:[
    '<b>Assign projects, not tasks.</b> Cutting the pitch into tasks up front is like shredding it: everyone gets a scrap and nobody holds the whole. The team finds its own tasks inside the pitch’s boundaries.',
    '<b>Done means deployed</b> by the end of the cycle, testing and QA included. Help pages and announcements can follow in cool-down.',
    '<b>Getting oriented</b> looks like silence. Asking for status early only pushes the exploring out of sight. If the silence hasn’t broken after about three days, step in.',
    '<b>Imagined vs discovered tasks</b>: the tasks you find by doing real work are the true bulk of the project.',
    '<b>Integrate one slice</b> in the first week or so: design and code wired together on one piece, so anyone can click it. Layers that never meet are still a guess.',
    '<b>Programmers don’t wait.</b> The pitch is enough to start the back-end. Designers hand over rough <b>affordances</b> first, polish later. Program just enough for the next step.',
    '<b>Start in the middle</b>: the first piece should be <b>core</b>, <b>small</b> and <b>novel</b>. Not login, not settings.'
  ],
  steps:[
/* ---------- PART 1: HAND IT OVER ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">A friend helps you cook a big dinner. Which way will they more likely notice the sauce is missing?</h1>');
  L.mc(L.card,['They get a list of 12 chopping and stirring jobs','They get the whole menu and are asked to make it'],1,
   'Someone who sees the whole meal can spot the gap. Someone working down a chore list just does their chores. This lesson starts from that idea.',
   'A chore list keeps them busy, but nobody asked them to think about the whole meal. Seeing the full menu is what lets them spot the gap.');}},

{part:0,src:'Chapter 10 · Assign projects, not tasks',
 solve:async L=>{L.$('#shA').click();L.$('#shB').click();},
 run(L){
  L.h(L.kick('learn','Assign projects, not tasks')+'<h1 class="q">Shred the pitch, or hand it over whole?</h1>'+
   '<p class="small">The waitlist pitch is ready for Kenji and Bea. Try both ways of starting, and watch what happens to a surprise on Wednesday.</p>'+
   '<div class="hv-chips"><button class="chip" id="shA">'+L.ic('list')+'Noor: hand out 30 tasks</button><button class="chip" id="shB">'+L.ic('box')+'Tomás: hand over the pitch</button></div>'+
   '<div class="hv-sh" id="sh"></div><div id="shx" aria-live="polite"></div>');
  const WH=[['Problem','Spots that open after a cancellation stay empty'],['Appetite','Six weeks'],['Solution','Join the waitlist, a spot opens, members get told'],['Rabbit holes','First tap wins; no automatic charging'],['No-gos','No text messages; no workshops']];
  const SC=[['Kenji','Draw the “Join waitlist” button'],['Bea','Add a waitlist table'],['Kenji','Draw the “spot opened” email'],['Bea','Send the email'],['Kenji','Draw the on/off switch']];
  const seen=new Set();
  function show(m){const sh=L.$('#sh');seen.add(m);
    sh.className='hv-sh '+(m==='A'?'shred':'whole');
    sh.innerHTML='<div class="hd">'+(m==='A'?'Five of 30 scraps':'The pitch · owned by Kenji and Bea')+'</div>'+(m==='A'?SC:WH).map(r=>'<div class="hv-pg"><b>'+r[0]+(m==='A'?':':'')+'</b>'+r[1]+'</div>').join('')+(m==='A'?'<div class="small" style="margin:4px 6px">…and 25 more scraps</div>':'');
    L.$$('.hv-chips .chip').forEach(c=>c.classList.toggle('sel',c.id==='sh'+m));
    L.$('#shx').innerHTML='<div class="hv-sur">'+L.ic('alert')+'<span><b>Wednesday:</b> on a phone, the class card has no room for the new button.</span></div>';
    L.fb(L.$('#shx'),m==='A'?'Kenji’s scrap said “Draw the button”. It’s drawn, so it gets ticked. The phone problem falls between the scraps: <b>nobody’s list covers it</b>, and nobody is judging how the pieces fit.':'Kenji and Bea own the whole waitlist, so the gap is theirs. They add a task: <b>find room for the button on phones</b>. Nobody had to predict it.',m==='A'?'no':'ok');
    if(seen.size===2){L.$('#shx').insertAdjacentHTML('beforeend',L.prose('The book says nobody plays “taskmaster” at the start of a cycle. The team gets the whole project and defines its own tasks. This isn’t total freedom: shaping already set the boundaries. And talented people don’t want to be treated like ticket takers.'));L.done();}}
  L.$('#shA').onclick=()=>show('A');L.$('#shB').onclick=()=>show('B');}},

{part:0,src:'Chapter 10 · Kick-off',run(L){
  L.h(L.kick('ex','The waitlist starts')+'<h1 class="q">Pinecone hands the waitlist to Kenji and Bea</h1>');
  L.beats(L.card,[
   ['Day 1','The cycle begins. Ifeoma posts the waitlist pitch where the team works: the problem, the six-week appetite, the solution, the rabbit holes and the no-gos.'],
   ['The temptation','Noor offers to “help” by writing a 30-item task list for Kenji and Bea. Tomás says no: the team will find their own tasks.'],
   ['The '+L.g('kickoff','kick-off call'),'Ifeoma walks Kenji and Bea through the pitch. Bea asks how first tap wins should work. Kenji asks where the “Leave waitlist” link lives.'],
   ['After the call','Kenji and Bea have a rough picture of the whole project. Nobody hands them tickets. They own the waitlist from here.']],
   'The team gets the whole shaped project and a chance to ask questions. The tasks are theirs to find.');}},

{part:0,src:'Chapter 10 · Done means deployed',
 solve:async L=>{L.$('#tq1').click();L.$('#tq0').click();},
 run(L){
  L.h(L.kick('learn','Done means deployed')+'<h1 class="q">Where does testing go? Try both.</h1>'+
   L.prose('At the end of the cycle, the team deploys. That’s what keeps the '+L.g('appetite','appetite')+' honest: six weeks has to mean six weeks.')+
   '<div class="hv-chips"><button class="chip" id="tq0">Test inside the six weeks</button><button class="chip" id="tq1">Test after, in cool-down</button></div>'+
   '<div class="hv-tl" id="tl"></div><div id="tlx" aria-live="polite"></div>');
  const seen=new Set();
  function draw(m){seen.add(m);L.$$('.hv-chips .chip').forEach(c=>c.classList.toggle('sel',c.id==='tq'+m));
    const bar=(cls,a,b,t)=>'<div class="bar '+cls+'" style="grid-column:'+(a+1)+' / '+(b+2)+'">'+t+'</div>';
    let h='<span></span>'+[1,2,3,4,5,6].map(n=>'<span class="wk">W'+n+'</span>').join('')+'<span class="wk cd" style="grid-column:span 2">Cool-down</span>';
    h+='<span class="lb">Build</span>'+bar('build',1,m?6:5,'design + code')+(m?'<span style="grid-column:span 2"></span>':'<span style="grid-column:span 3"></span>');
    h+='<span class="lb">Testing, QA</span>'+(m?'<span style="grid-column:span 6"></span>'+bar('qa bad',7,8,'QA'):'<span style="grid-column:span 3"></span>'+bar('qa',4,6,'QA')+'<span style="grid-column:span 2"></span>');
    h+='<span class="lb">Deploy</span>'+(m?'<span style="grid-column:span 7"></span>'+bar('dep bad',8,8,'⚑'):'<span style="grid-column:span 5"></span>'+bar('dep',6,6,'⚑')+'<span style="grid-column:span 2"></span>');
    h+='<span class="lb">Help page, news</span><span style="grid-column:span 6"></span>'+bar('docs',7,8,'can trail');
    L.$('#tl').innerHTML=h;L.$('#tlx').innerHTML='';
    L.fb(L.$('#tlx'),m?'Testing slid out of the cycle, so the deploy did too. The waitlist isn’t done in six weeks, and the appetite stops meaning anything.':'Testing and QA happen inside the cycle. The team finishes the most essential parts early and works with QA, so the waitlist deploys by the end of week six.',m?'no':'ok');
    if(seen.size===2){L.$('#tlx').insertAdjacentHTML('beforeend',L.note('Help pages, marketing updates and the announcement can follow in cool-down. They’re low-risk: they never take five times longer than expected, and other teams usually handle them. A small batch team deploys each little project whenever it likes, as long as it’s before the cycle ends.','info'));L.done();}}
  L.$('#tq0').onclick=()=>draw(0);L.$('#tq1').onclick=()=>draw(1);}},

{part:0,src:'Chapter 10 · Done means deployed',pts:5,run(L){
  L.h(L.kick('pr','Inside the cycle or after?')+'<h1 class="q">For the waitlist bet, when must each thing happen?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Inside the six weeks','Can wait for cool-down'],[
   ['Testing that first tap wins and the other member sees “Spot taken”',0,'Testing and QA are part of done. They happen inside the cycle.'],
   ['Deploying the waitlist so studios can switch it on',0,'Done means deployed. No deploy, no done.'],
   ['A help page explaining the waitlist to studio owners',1,'Help pages aren’t held to the cycle. They are low-risk and can follow.'],
   ['An email announcing the waitlist to every studio',1,'Announcements often go out in cool-down, after the cycle.'],

/* ---------- PART 2: GETTING ORIENTED ---------- */
{part:1,src:'Chapter 10 · Getting oriented',
 solve:async L=>{for(let j=0;j<3;j++)L.$$('#qdd button')[j].click();},
 run(L){
  L.h(L.kick('learn','Explore · the quiet days')+'<h1 class="q">Kenji and Bea’s first week. Tap Monday to Wednesday to look below the line.</h1>'+
   '<p class="small">Above the line is what Noor can see: check-offs and messages. Below it is the work that’s really going on.</p>'+
   '<div id="qdh"></div><div class="hv-qd" id="qdd"><span></span></div><div class="hv-qr" id="qdr" aria-live="polite">Tap a day.</div>'+
   '<div class="hv-chips" style="margin-top:10px"><button class="chip" id="qdo">'+L.ic('chat')+'Make “still figuring it out” OK to say</button></div>');
  let honest=false,sel=null,fin=false;const open=new Set();
  const draw=()=>{const w=qdWeek('calm',honest);L.$('#qdh').innerHTML=qdSvg(w,{fog:open,sel});if(sel!=null)L.$('#qdr').innerHTML=qdText(w,sel);
    L.$$('#qdd button').forEach((b,j)=>{b.classList.toggle('sel',j===sel);b.classList.toggle('seen',open.has(j)&&j!==sel);});};
  SG_DAY.forEach((d,j)=>{const b=document.createElement('button');b.textContent=d;b.setAttribute('aria-label','Show '+SG_DAYL[j]);
    b.onclick=()=>{sel=j;open.add(j);draw();
      if(!fin&&[0,1,2].every(x=>open.has(x))){fin=true;
        L.sheet('info','Busy, just not visibly','The first days don’t look like work: no check-offs, nothing deployed, often little talk. Each person has their head down learning the existing code, thinking through the pitch and trying short dead ends to find the best place to start. The book asks managers to respect this phase.');L.done();}};
    L.$('#qdd').appendChild(b);});
  L.$('#qdo').onclick=function(){honest=!honest;this.classList.toggle('sel',honest);if(sel==null){sel=1;open.add(1);}draw();
    if(honest)L.fb(L.$('#qdr'),'Now Bea can say it out loud on Tuesday. Noor sees an honest message, and the real work below the line didn’t shrink at all.','ok');};
  draw();}},

{part:1,src:'Chapter 10 · Getting oriented',pts:1,
 solve:async L=>{L.$('#apo').children[1].click();L.$('#apg').click();await L.sleep(900);},
 run(L){
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">Noor wants a status update on Monday, “to see progress”. What happens to the week?</h1>'+
   '<div id="aph"></div><div class="hv-qd" id="apd"><span></span>'+SG_DAY.map(d=>'<button tabindex="-1" aria-hidden="true">'+d+'</button>').join('')+'</div>'+
   '<div id="apo" class="opts" style="margin-top:12px"></div><button class="btn pri" id="apg" hidden>'+L.ic('play')+'Noor asks on Monday</button><div id="apx" aria-live="polite"></div>');
  const base=qdWeek('calm');let p=null;
  L.$('#aph').innerHTML=qdSvg(base,{});
  ['Real progress shows up sooner','The same exploring happens, out of sight, and real progress starts later','Nothing changes: they just answer and carry on'].forEach((t,j)=>{const b=document.createElement('button');b.className='opt';b.textContent=t;
    b.onclick=()=>{if(p!==null)return;p=j;b.classList.add('sel');L.$('#apg').hidden=false;};L.$('#apo').appendChild(b);});
  L.$('#apg').onclick=function(){this.remove();const after=qdAsk(base,0);
    L.$('#aph').innerHTML=qdSvg(after,{sel:0,anim:true});L.$$('#apd button')[0].classList.add('no');
    setTimeout(()=>{if(!L.$('#apx'))return;L.award(p===1);
      L.$('#apx').innerHTML='<div class="hv-qr"><b>Check-offs Noor sees by Friday:</b> '+qdChecks(base)+' → <b>'+qdChecks(after)+'</b> <span class="small">(illustrative)</span><br><b>For-show updates:</b> 1 (the dashed “?!” block)<br><b>Exploring:</b> still there, pushed out of sight and a day later (dashed, below)</div>';
      L.sheet(p===1?'ok':'no',p===1?'That’s the trap':'It pushes the work underground','The exploring has to happen anyway. Asking for visible progress takes time the team needs and only drives that work out of sight, so the real check-offs arrive later. Better: make “I’m still figuring out how to start” a normal thing to say.');L.done();},500);};}},

{part:1,src:'Chapter 10 · Getting oriented',pts:2,
 solve:async L=>{L.$('#sin').click();await L.sleep(30);L.$('#snx').click();await L.sleep(30);L.$$('#sid button')[3].click();},
 run(L){
  L.h(L.kick('pr','Step in, or leave them be?')+'<h1 class="q" id="sq"></h1><p class="small">You only see what Noor sees. Tap the day you’d step in, or leave them be.</p>'+
   '<div id="sih"></div><div class="hv-qd" id="sid"><span></span></div><p class="small" id="sil" style="margin:8px 0 0"></p>'+
   '<button class="btn" id="sin" style="margin-top:10px">'+L.ic('x')+'Don’t step in this week</button><div id="six" aria-live="polite"></div>');
  const R=[{key:'calm',right:-1,q:'Round 1 of 2. Pinecone’s waitlist, week one. When should Noor step in?'},
           {key:'stuck',right:3,q:'Round 2 of 2. A different week: same start, but the silence goes on. When should Noor step in?'}];
  let r=0,ans=false;
  function show(){ans=false;const w=qdWeek(R[r].key);L.$('#sq').textContent=R[r].q;L.$('#six').innerHTML='';L.$('#sin').hidden=false;
    L.$('#sih').innerHTML=qdSvg(w,{fog:'all'});L.$('#sil').innerHTML='What Noor sees: '+qdSeenLine(w);
    const d=L.$('#sid');d.innerHTML='<span></span>';SG_DAY.forEach((n,j)=>{const b=document.createElement('button');b.textContent=n;b.setAttribute('aria-label','Step in on '+SG_DAYL[j]);b.onclick=()=>pick(j);d.appendChild(b);});}
  function pick(j){if(ans)return;ans=true;const R0=R[r],ok=j===R0.right;L.award(ok);L.$('#sin').hidden=true;
    let w=qdWeek(R0.key);
    if(R0.key==='stuck'&&j===3){w[3].see=[{k:'m',t:'Noor checks in: Kenji is stuck on the phone card'}];w[4].see=[{k:'c',t:'Store waiting members'},{k:'c',t:'Rough button, kept simple on phones'}];}
    L.$('#sih').innerHTML=qdSvg(w,{mark:j>=0?j:null,markOk:ok,anim:true});L.$('#sil').innerHTML='What Noor sees: '+qdSeenLine(w);
    L.$$('#sid button').forEach((b,z)=>{if(z===j)b.classList.add(ok?'ok':'no');else if(z===R0.right&&!ok)b.classList.add('ok');});
    const msg=R0.key==='calm'?(j<0?'Right. Monday and Tuesday were quiet, but the silence broke on Wednesday: a check-off and a message. Below the line, they were reading code and trying dead ends.':j<2?'Too early. Below the line, they were reading the booking code and trying short dead ends. Asking now would only push that out of sight.':'No need: the silence already broke on Wednesday with a check-off and a message.')
      :(j===3?'Right. Three quiet days with no break. Thursday is a fair time to check in, and Noor learns Kenji is stuck on the phone card. By Friday, work shows up.':j<0?'The silence never broke. After about three days, it’s reasonable to step in and see what’s going on.':j===4?'Late. The silence hadn’t broken after three days, so Thursday was already fair. A day lost.':'A bit early. The book gives orientation about three days before stepping in.');
    L.fb(L.$('#six'),msg,ok?'ok':'no');
    if(r===0){L.$('#six').insertAdjacentHTML('beforeend','<button class="btn pri" id="snx" style="margin-top:10px">'+L.ic('arrow')+'Next week</button>');L.$('#snx').onclick=()=>{r=1;show();};}
    else{L.sheet('info','The three-day rule','Quiet first days are normal. If the silence hasn’t started to break after about three days, step in and see what’s going on. Before that, let them get oriented.');L.done();}}
  L.$('#sin').onclick=()=>pick(-1);show();}},

{part:1,src:'Chapter 10 · Imagined vs discovered tasks',
 solve:async L=>{L.$$('.hv-gr .btn').forEach(b=>b.click());},
 run(L){
  const G=[['Add a new button to the desktop screen','Do it',[['Figure out how to show the button on mobile','The designer adds it, then sees there’s no obvious place for it on the mobile version.']]],
           ['First pass of the design','Do it',[['Write explanatory copy','The layout looks good, then it’s clear people need more explanation.'],['Change the layout to fit the copy','The copy lands where it disrupts the layout.']]],
           ['A database change','Do it',[['Update a method another part of the project will need','While studying the data model for something else, the programmer spots a method that must change later.']]]];
  L.h(L.kick('learn','Imagined vs discovered tasks')+'<h1 class="q">Most of the work is found, not planned. Do each task and watch the list grow.</h1>'+
   '<p class="small">The book’s own examples. On day 1 the team only has '+L.g('imagined-task','imagined tasks')+'.</p><div id="grl"></div>'+
   '<div class="hv-cnt"><span>Imagined</span><div class="tr"><i id="gri" style="width:30%;background:var(--pri)"></i></div><b id="grin">3</b><span>Discovered</span><div class="tr"><i id="grd" style="width:0;background:var(--h4)"></i></div><b id="grdn">0</b></div><div id="grx"></div>');
  let n=0,done=0;
  G.forEach(g=>{const d=document.createElement('div');d.className='hv-gr';d.innerHTML='<div class="im"><span>'+g[0]+'</span><button class="btn">'+L.ic('play')+g[1]+'</button></div>';
    d.querySelector('.btn').onclick=function(){this.remove();done++;
      g[2].forEach(t=>{n++;d.insertAdjacentHTML('beforeend','<div class="dc"><b>New: '+t[0]+'</b><small>'+t[1]+'</small></div>');});
      L.$('#grdn').textContent=n;L.$('#grd').style.width=(n*10)+'%';
      if(done===G.length){L.$('#grx').innerHTML=L.note('Real work turned up '+L.g('discovered-task','discovered tasks')+' nobody listed. The book says these make up the true bulk of a project, and sometimes the hardest parts. Some appear while doing something unrelated. The only way to find them is to start real work on something meaningful.','bulb');L.done();}};
    L.$('#grl').appendChild(d);});}},

/* ---------- PART 3: ONE SLICE ---------- */
{part:2,src:'Chapter 11 · Get One Piece Done',run(L){
  L.h(L.kick('learn','Integrate one slice')+'<h1 class="q">Lots of tasks done, nothing really done</h1>'+
   L.prose('A team can check off many tasks and still have nothing to click. That feels insecure. So the book says: don’t plan parts that come together in the last hour. Make something real and demoable early, in the first week or so.')+
   L.lanes([['layers','Horizontal '+L.g('layer','layers'),'Design lots of screens, or build lots of back-end logic. Until they’re joined, nothing does anything, and you can’t judge if it’s right.',4],
            ['pointer','One vertical '+L.g('slice','slice'),'Pick one small piece. Wire its screens to its code. Now anyone can click it and see if it does what it should.',1]])+
   L.prose('The two layers that matter most are front-end and back-end: design and code. Next, you’ll run Kenji and Bea’s first week on a grid of exactly those two layers.'));
  L.done();}},

{part:2,src:'Chapter 11 · Integrate one slice',
 solve:async L=>{sgTap(L,'k',0);sgTap(L,'b',0);sgRun(L,5);},
 run(L){
  L.h(L.kick('learn','Explore · the build grid')+'<h1 class="q">Run week one yourself. Can you give Ifeoma something to click by Friday?</h1>'+
   '<p class="small">Columns are waitlist pieces. Kenji works the design row, Bea the code row. A piece is <b>clickable</b> only when its rough design and its code are both built and wired together. Tap a cell to move Kenji or Bea; they stay put until you move them. Task sizes are illustrative.</p><div id="gx"></div>');
  let fin=false;
  sgGrid(L.$('#gx'),{manual:true,onFriday(r){if(fin)return;fin=true;
    L.sheet('info',r.n?'Something real to click':'A busy week, nothing to click',(r.n?'Ifeoma can click a working piece. Notice that wiring needed both: Kenji’s rough buttons first, then Bea’s code hooked to them. ':'Lots of tasks, but no piece has its design and code wired together, so the demo is empty. ')+'Did you spot tasks popping out of cells? Nobody planned those. Reset and try again any time.');L.done();}});}},

{part:2,src:'Chapter 11 · Integrate one slice',pts:1,
 solve:async L=>{L.$('#ppo').children[1].click();L.$('#ppg').click();await L.sleep(2600);},
 run(L){
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">Same five days, same two people. Which plan gives Ifeoma something to click on Friday?</h1>'+
   '<p class="small"><b>All design first:</b> Kenji designs piece after piece; Bea builds back-end piece after piece and wires it all at the end. <b>One slice through:</b> both work on one piece until it’s wired, then move on.</p>'+
   '<div id="ppo" class="opts"></div><button class="btn pri" id="ppg" hidden>'+L.ic('play')+'Run both plans</button><div id="pph"></div><div id="ppx"></div>');
  let p=null;const g=sgGrid(L.$('#pph'),{});
  ['All design first: more tasks checked, and a piece works','One slice through: about as many tasks, and one piece works','Both plans end the week with a piece to click'].forEach((t,j)=>{const b=document.createElement('button');b.className='opt';b.textContent=t;
    b.onclick=()=>{if(p!==null)return;p=j;b.classList.add('sel');L.$('#ppg').hidden=false;};L.$('#ppo').appendChild(b);});
  L.$('#ppg').onclick=async function(){this.remove();
    L.$('#ppx').innerHTML='<p class="small"><b>Now playing:</b> all design first</p>';const a=await g.play('layers',200);if(!a)return;
    await L.sleep(350);if(!L.$('#ppx'))return;L.$('#ppx').innerHTML='<p class="small"><b>Now playing:</b> one slice through</p>';const b=await g.play('slice',200);if(!b)return;
    L.award(p===1);
    L.$('#ppx').innerHTML='<table class="hv-cmp"><tr><th>Plan</th><th>Tasks checked</th><th>Found</th><th>To click</th></tr><tr><td>All design first</td><td>'+a.checked+'</td><td>'+a.found+'</td><td style="color:var(--no);font-weight:700">'+a.n+'</td></tr><tr><td>One slice through</td><td>'+b.checked+'</td><td>'+b.found+'</td><td style="color:var(--ok);font-weight:700">'+b.n+'</td></tr></table>';
    L.sheet(p===1?'ok':'no',p===1?'You called it':'Only the slice has a working piece','Both plans checked off the same number of tasks. Only the slice joined design and code on one piece, so only it gives Ifeoma something real: proof it works, or a clear sign to rethink. The layers plan is still “fingers crossed” until the last hour. And clicking the working piece turned up two more tasks nobody had imagined.');L.done();};}},

{part:2,src:'Chapter 10 · Imagined vs discovered tasks',pts:1,
 solve:async L=>{L.$('#dpo').children[1].click();L.$('#dpg').click();await L.sleep(700);},
 run(L){
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">On Monday, Bea starts storing waiting members. Where will the task “make cancelling announce that a spot opened” come from?</h1>'+
   '<div id="dpo" class="opts"></div><button class="btn pri" id="dpg" hidden>'+L.ic('play')+'Play Monday</button><div id="dph"></div>');
  let p=null;const g=sgGrid(L.$('#dph'),{});
  ['It’s on the day-1 list: the pitch covers cancelling','Bea runs into it while working on something else','QA finds it in the last week of the cycle'].forEach((t,j)=>{const b=document.createElement('button');b.className='opt';b.textContent=t;
    b.onclick=()=>{if(p!==null)return;p=j;b.classList.add('sel');L.$('#dpg').hidden=false;};L.$('#dpo').appendChild(b);});
  L.$('#dpg').onclick=async function(){this.remove();const r=await g.play('slice',350,1);if(!r)return;L.award(p===1);
    L.sheet(p===1?'ok':'no',p===1?'Found by doing':'It popped out of real work','Bea was in the Join column, reading the booking code to store waiting members, and found a task for a different piece: Spot opens. Kenji found one too, by trying the button on a phone. Neither was on anyone’s list. The book: a task often appears while you’re doing something unrelated, and tasks like these are the bulk of the project.');L.done();};}},

{part:2,src:'Chapter 11 · Case study: Clients in projects',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">How one designer and one programmer finished a first piece in about three days</h1>');
  L.beats(L.card,[
   ['The project','Basecamp let service firms invite clients and share only chosen content with them. The pitch had three parts: client access (heavy back-end work), client management, and a visibility toggle on each piece of content.'],
   ['Pick a piece','After getting oriented, the designer chose the toggle. It was the most central piece of the interface: the one in demo videos and the one customers would use most.'],
   ['Rough, not polished','No pixel-perfect mockup. The designer tried different controls right in the app’s templates. Meanwhile the programmer wasn’t waiting: the pitch was enough to start on the access model.'],
   ['Wire it','Once the direction felt right, the programmer briefly wired the toggle: it showed on all content, changed when clicked and saved its state. It didn’t yet hide anything from clients, but the designer could click it with live data.'],
   ['Done','The programmer went back to the access model. The designer kept refining. About three days in, the designer demoed it to a manager, made a few tweaks, and they called it done.']],
   'One core piece designed, built, demoed and settled early. Team and management both gained confidence from clicking a real thing.');}},

{part:2,src:'Chapter 11 · Affordances before pixel-perfect screens',run(L){
  L.h(L.kick('learn','Affordances first, pixels later')+'<h1 class="q">The first design a programmer gets can look very basic</h1>'+
   L.prose('Programmers don’t need a polished design to start. They need '+L.g('affordance','affordances')+': input fields, buttons, places where saved data should appear. Font, color, spacing and layout can come once those are wired up.')+
   L.quote('First make it work, then make it beautiful.','Ryan Singer, Shape Up, chapter 11')+
   L.list([['pencil','A hand-made sign-up page','For a course registration app, the designer’s first screen had barely any style. Yet it held real decisions, like a dropdown of dates instead of a calendar picker, so long courses could label their phases.'],
     ['eye','Plain links, bare borders','The first piece of an interview app used default browser links and plain boxes. Still, clicking through it tested a real trade-off: was a separate screen for adding data acceptable?']],2)+
   L.prose('A rough screen still answers the big questions: does it make sense, is it understandable, does it do what we want? If the idea fails, little polish was wasted.'));
  L.done();}},

{part:2,src:'Chapter 11 · Program just enough for the next step',run(L){
  L.h(L.kick('learn','Programmers don’t wait · just enough code')+'<h1 class="q">Back-end work can start on day one, and can be patchy on purpose</h1>'+
   L.list([['clock','Don’t wait for design','Shaping already defined the moving parts, so the pitch gives enough direction for the first back-end decisions. A programmer can’t finish a feature without knowing the screen, but can start the model.'],
     ['layers','Strategically patchy','Sometimes a designer just needs a couple of fields that save, a route from one rough screen to the next, or real data in a template to try layouts. A screen with no model yet, or fake data with no way to edit it, is fine for now.'],
     ['lock','The hard-coded password','The interview app needed protecting before real interview data went in. Instead of building full login, the team hard-coded one simple password and kept learning.'],
     ['cycle','Take turns','No big hand-off. Design and code take turns adding affordances, wiring and styling on the same piece, clicking through it each time.']],2));
  L.done();}},

{part:2,src:'Chapter 11 · Affordances before pixel-perfect screens',pts:6,run(L){
  L.h(L.kick('pr','Now or later?')+'<h1 class="q">Kenji and Bea are wiring the first version of “Join waitlist”. What does it need right now?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Needed for the first wired version','Can wait until it works'],[
   ['A “Join waitlist” button on a full class',0,'This is the affordance itself. Nothing works without it.'],
   ['The exact shade and rounded corners of the button',1,'Visual styling matters in the end product, not on the first pass.'],
   ['Saving that a member joined the waitlist',0,'That’s the wiring that makes the button actually do something.'],
   ['A place where the member sees they’re on the list',0,'A place where saved data shows up is a core affordance.'],
   ['A full studio login just to test it on staging',1,'Like the hard-coded password, a quick stand-in is enough for now.'],
   ['A smooth animation when the member joins',1,'Polish that can be layered on once the slice works.']],
   'Affordances plus just enough code to make them work. Styling and extras come after.');}},

{part:2,src:'Chapter 11 · Integrate one slice',
 solve:async L=>{const c=L.$('#epc').children;c[0].click();await L.sleep(60);c[1].click();await L.sleep(60);c[2].click();await L.sleep(1000);},
 run(L){
  L.h(L.kick('learn','Edge cases · where week one goes wrong')+'<h1 class="q">Load the cases the book warns about. Try at least three.</h1><div id="epc" class="hv-chips"></div><div id="epx" aria-live="polite"></div><div id="eph"></div>');
  const E=[['noor','Noor’s 30-item list hands out scraps: a different cell every day. Ten tasks checked, nothing clickable, and the surprises land on nobody’s list. This is why Tomás turned it down: the pitch gets shredded.'],
    ['polish','Kenji spends three days on colors, corners and spacing before any rough buttons exist. Bea runs out of code that doesn’t need them and sits idle. Affordances first, pixels later.'],
    ['wait','Bea won’t start until Kenji’s designs are finished. Three idle days, and nothing is wired by Friday. The pitch already gave enough direction to start the back-end on Monday.'],
    ['settings','Small, wired by Wednesday, but not core: Ifeoma can flip a switch, and nothing about the waitlist idea is proven. Building login or setup first is the same mistake: it isn’t the middle.']];
  const g=sgGrid(L.$('#eph'),{}),tried=new Set();let fin=false;
  E.forEach((e,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=SG_PLAN[e[0]].label;
    b.onclick=()=>{L.$$('#epc .chip').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');L.$('#epx').innerHTML='<div class="fb info" style="margin:2px 0 8px">'+e[1]+'</div>';
      g.play(e[0],150);tried.add(j);
      if(tried.size===3&&!fin){fin=true;L.sheet('info','Every case breaks the same link','Each one leaves design and code apart, or wires the wrong piece. Shredded tasks, polish before affordances, a programmer waiting, or starting at the edge: all four can look busy and still give Ifeoma nothing that proves the waitlist works.');L.done();}};
    L.$('#epc').appendChild(b);});}},

/* ---------- PART 4: START IN THE MIDDLE ---------- */
{part:3,src:'Chapter 11 · Start in the middle',
 solve:async L=>{L.$$('.hv-bc').forEach(b=>b.click());},
 run(L){
  const B=[['Visibility toggle','Clients in Projects',[1,1,1],'Without it, the rest of the feature meant nothing. Finished and demoed in about three days. And new: proving it boosted everyone’s confidence. The book’s pick.'],
           ['Rename a client','Clients in Projects',[0,2,2],'Required, but on the edge. The book contrasts it with the toggle: one was far more central and worth proving early.'],
           ['Add clients to a project','Clients in Projects',[2,2,0],'Mostly the same screen as adding regular users. Starting there would move the project forward but teach the team nothing and remove no uncertainty.'],
           ['Log in, or set up a new interview project','Interview app',[0,2,2],'The team skipped both, stubbed them, and jumped to recording interview data, where the interesting problem was.']];
  L.h(L.kick('learn','Start in the middle')+'<h1 class="q">Three checks for the first piece: core, small, novel. Tap each case from the book.</h1>'+
   L.list([['target','Core','Without it, the other work wouldn’t mean anything.'],['clock','Small','Small enough to finish in a few days and build momentum.'],['bulb','Novel','If two pieces are core and small, pick the one you’ve never done before.']],1)+'<div id="bcl" style="margin-top:10px"></div><div id="bcx"></div>');
  const seen=new Set(),N=['Core','Small','Novel'];
  B.forEach((c,j)=>{const b=document.createElement('button');b.className='hv-bc';b.innerHTML='<b>'+c[0]+'</b><small>'+c[1]+' · tap to check</small>';
    b.onclick=()=>{if(seen.has(j))return;seen.add(j);b.classList.add('open');b.querySelector('small').textContent=c[1];
      b.insertAdjacentHTML('beforeend','<div class="bx">'+c[2].map((v,k)=>'<span class="'+(v===1?'y':v===0?'n':'u')+'">'+(v===1?'✓ ':v===0?'✗ ':'')+N[k]+(v===2?' –':'')+'</span>').join('')+'</div><p>'+c[3]+'</p>');
      if(seen.size===B.length){L.$('#bcx').innerHTML=L.note('A dash means the book doesn’t judge that check for this case. Starting in the middle means skipping the setup at the edges and stubbing it, to prove the new idea first.','info');L.done();}};
    L.$('#bcl').appendChild(b);});}},

{part:3,src:'Chapter 11 · Start in the middle',pts:1,
 solve:async L=>{sgTap(L,'k',0);sgTap(L,'b',0);sgRun(L,3);sgTap(L,'b',1);sgRun(L,2);},
 run(L){
  L.h(L.kick('pr','Challenge · plan week one')+'<h1 class="q">By Friday, Ifeoma must be able to click a piece that is core, small and novel, and nobody may sit idle a single day.</h1>'+
   '<p class="small">Tap cells to move Kenji or Bea between days. The first Friday counts; you can reset and play again after.</p><div id="chh"></div>');
  let graded=false;
  const g=sgGrid(L.$('#chh'),{manual:true,onFriday(r){g.badges=true;g.draw();if(graded)return;graded=true;
    const ok=r.clk[0]&&r.idleK===0&&r.idleB===0;L.award(ok);
    const why=[];
    if(!r.clk[0]){const o=r.clk.map((c,i)=>c?i:-1).filter(i=>i>0);why.push(o.length?'You wired '+o.map(i=>SG_P[i].name).join(' and ')+'. '+o.map(i=>SG_WHY[i]).join(' '):'Join the waitlist isn’t wired yet. '+SG_WHY[0]);}
    if(r.idleB)why.push('Bea sat idle '+r.idleB+' day'+(r.idleB>1?'s':'')+'. Programmers don’t need to wait: start the model from the pitch, and once a piece is wired, move to the next piece’s back-end.');
    if(r.idleK)why.push('Kenji sat idle '+r.idleK+' day'+(r.idleK>1?'s':'')+'. There’s always rough design or a discovered task to pick up.');
    L.sheet(ok?'ok':'no',ok?'Core, small, novel, and working':'Not quite',ok?'Join the waitlist passes all three checks: '+SG_WHY[0]+' Wired by Wednesday, with Bea moving on to Spot opens while Kenji handles what clicking through revealed. The badges above show how the other pieces score.':why.join(' ')+' The badges above (C core, S small, N novel) show how each piece scores.');L.done();},
   onReset(){g.badges=false;g.draw();}});}},

{part:3,src:'Chapter 10 · Kick-off · Chapter 11 · Integrate one slice',pts:1,run(L){
  L.h(L.kick('pr','Put it in order')+'<h1 class="q">Order the first stretch of the waitlist project, from day 1.</h1>');
  L.order(L.card,['Ifeoma posts the pitch and holds the kick-off call','Kenji and Bea get oriented in the code and design','They wire “Join waitlist” end to end, rough','Ifeoma clicks through it and they settle it','They pick the next piece to integrate'],
   'Hand over, get oriented, wire one rough slice, demo and settle it, then move to the next piece.');}},

{part:3,src:'Chapter 10–11 · review',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Good move or misstep?',['Good move','Misstep'],[
   ['Kenji spends week one perfecting the waitlist’s colors and fonts before Bea wires anything.',1,'Polish before it works risks wasted effort. Affordances first, pixels later.'],
   ['Bea fills the waiting-list screen with fake members so Kenji can try different layouts.',0,'Program just enough for the next step. Mock data lets design move.'],
   ['Noor asks for a daily task count from day 1 to “see progress”.',1,'Early status requests push exploring underground. Let the team get oriented.'],
   ['Bea writes down a booking method to fix later, then goes back to the current task.',0,'Noting a discovered task and moving on keeps the work flowing.'],
   ['The team builds member login improvements first, “so everything else is easier”.',1,'That’s setup at the edge. Start in the middle, where the real problem is.']]);}}
  ]
});
</script>
