const WP_SEC={P:['Problem','h1'],A:['Appetite','h2'],S:['Solution','h3'],R:['Rabbit holes','h4'],N:['No-gos','pri']};
const WP_ORDER=['P','A','S','R','N'];
const WP_JOB={P:'The starting idea, or what someone noticed, that makes this worth doing.',
 A:'The time we’re willing to give it, and how that shapes the solution.',
 S:'The core elements, shown so people get them right away.',
 R:'Details of the solution worth calling out to avoid trouble.',
 N:'What’s left out on purpose, to fit the appetite or keep the problem solvable.'};
const WP_WHO={N:'Noor',T:'Tomás',K:'Kenji',Su:'Support'};
const WP_DEF={P:'story',A:'six',S:'shaped',R:'patched',N:'listed'};
/* small fat-marker pictures used inside the page */
const WP_THUMB='<svg class="wp-th" viewBox="0 0 150 66" role="img" aria-label="Fat marker sketch of a full class card with a Join waitlist button"><rect x="3" y="3" width="144" height="60" rx="10" fill="none" stroke="var(--ink)" stroke-width="3.5"/><path d="M14 17h56" stroke="var(--ink)" stroke-width="4.5" stroke-linecap="round"/><path d="M14 30h34" stroke="var(--muted)" stroke-width="4" stroke-linecap="round"/><rect x="98" y="9" width="40" height="18" rx="9" fill="none" stroke="var(--no)" stroke-width="3"/><text x="118" y="22" text-anchor="middle" font-size="11" font-weight="700" fill="var(--no)">Full</text><rect x="40" y="38" width="98" height="19" rx="9.5" fill="var(--pri)"/><text x="89" y="51.5" text-anchor="middle" font-size="11" font-weight="700" fill="var(--card)">Join waitlist</text></svg>';
const WP_WIRE='<svg class="wp-th" viewBox="0 0 150 66" role="img" aria-label="Detailed wireframes of six screens"><g fill="none" stroke="var(--muted)" stroke-width="1.2">'+[0,1,2,3,4,5].map(j=>{const x=3+j*24.5;return '<rect x="'+x+'" y="4" width="21" height="58" rx="3"/><path d="M'+(x+3)+' 12h15M'+(x+3)+' 18h11M'+(x+3)+' 24h15M'+(x+3)+' 30h8"/><rect x="'+(x+3)+'" y="40" width="15" height="7" rx="2"/><path d="M'+(x+3)+' 53h15"/>';}).join('')+'</g></svg>';
const WP_RAW='<svg class="wp-th" viewBox="0 0 150 66" role="img" aria-label="Unlabelled whiteboard breadboard of words and arrows"><g fill="none" stroke="var(--muted)" stroke-width="1.6" stroke-linecap="round"><path d="M10 12h26M10 18h18M60 10h24M62 16h14M110 14h28M112 20h16M18 44h22M70 46h30M118 48h20"/><path d="M36 15 C48 18 50 12 58 13M84 13 C96 14 100 18 108 16M28 20 C30 34 22 38 24 42M78 18 C74 30 86 36 84 44M128 22 C132 32 120 38 126 46M42 46 C52 50 60 50 68 47"/><path d="M56 11l3 2-3 3M106 14l3 2-3 3M22 39l2 3 3-2M82 41l2 3 3-2"/></g></svg>';
const WP_BUL='<span class="wp-il">· two taps at once · charging cards · late-cancel fees · class packs · Ironleaf’s two rooms · time zones · …and 24 more</span>';
const WP_V={
 P:{story:[4,'Marisol’s 6 p.m. class at Ember Yoga is always full. Members email to ask about spots. When someone cancels, Marisol texts people one by one, and the spot often stays empty.'],
    vague:[1,'“Studios want a waitlist.”'],
    stat:[1,'38 support tickets asked for a waitlist this quarter. <span class="wp-il">(illustrative number)</span>']},
 A:{six:[2,'Six weeks, a big batch. If it doesn’t fit in six weeks, we change the solution, not the time.'],
    est:[1,'“Bea guesses it would take 4 to 9 weeks.”']},
 S:{shaped:[6,'A <b>Join waitlist</b> button on full classes. When a spot opens, waiting members get an email and an in-app message; the first to tap books it. Studios see who’s waiting.'+WP_THUMB+'<div class="wp-cap">Sketch of the class card. Designers may find a different layout.</div>'],
    wire:[14,'Wireframes of all six screens, with exact sizes, fonts and colors.'+WP_WIRE],
    raw:[5,'A photo of the whiteboard breadboard, no labels.'+WP_RAW],
    note:[1,'“Add a waitlist button to full classes.”']},
 R:{patched:[3,'Two members tap at once: the first tap wins, the other sees “Spot taken.” No automatic charging: members book and pay the normal way. A won spot follows the studio’s usual late-cancel rule.'],
    vague:[1,'“Watch out for the tricky parts.”'],
    all:[11,'Every edge case from the whiteboard, as 30 bullet points. '+WP_BUL]},
 N:{listed:[3,'No one-to-one personal training. No workshops, retreats or livestreams. No text messages: email and in-app only.'],
    tbd:[1,'“To be decided.”']}};

/* what the readers comment, given the page they read: the mechanism of the lesson */
function wpRead(st){
  const p=[],add=(s,w,k,t)=>p.push({s,w,k,t});
  if(st.votes){add('P','N','vote','+1, let’s do it!');add('S','T','vote','+1 from me.');add('N','K','vote','Sounds good!');return p;}
  if(st.P==='off'){add('P','N','gap','Why are we doing this? What goes wrong today?');if(st.S!=='off')add('S','K','gap','Better than what? With no problem, I can’t tell one design from another.');}
  else if(st.P==='vague')add('P','T','gap','Which studios, and what goes wrong for them? Are they customers we want to keep?');
  else if(st.P==='stat')add('P','K','gap','38 tickets, but what happens to those studios? I can’t replay a number against a design.');
  if(st.A==='off')add('A','N','gap','Love it. Could we also add texts, a priority line for members and workshops?');
  else if(st.A==='est')add('A','N','gap','Up to 9 weeks? Then there’s room for texts and workshops too.');
  if(st.S==='off')add('S','T','gap','This is a problem, not a project yet. What would the team build?');
  else if(st.S==='raw')add('S','N','gap','I can’t follow these arrows. Where does the button even go?');
  else if(st.S==='wire'){add('S','K','gap','So the layout is decided already? What’s left for me to design?');add('S','N','gap','Could the Join button be green?');}
  else if(st.S==='note')add('S','T','gap','A button that does what? Who hears that a spot opened?');
  if(st.R==='off'||st.R==='vague')add('R','T','gap','What if two members tap at once? Do we charge their card automatically?');
  if(st.N==='off'||st.N==='tbd')add('N','K','gap','Does this include texts? Workshops? Personal training?');
  const gaps=p.length;
  if((st.R==='patched'||st.R==='all')&&st.S!=='off')add('R','T','add','Class-pack credits work the same for waitlist spots, so no new code there.');
  if(!gaps)add('P','N','vote','+1, let’s do it!');
  return p;}
const wpKind={gap:['g','Leaves a gap'],add:['a','Adds information'],vote:['v','A vote: set aside for the betting table'],new:['v','New comment']};
const wpPinH=(p,extra)=>'<span class="wp-pin '+p.k+'"'+(extra||'')+' aria-hidden="true">'+p.w+'</span>';

let wpN=0;
/* the pitch page. o: {st, only[], anatomy, foot:false, read(st), on(ev,data)} */
function wpPage(host,o){
  o=o||{};const id='wpd'+(++wpN);
  const st=Object.assign({},WP_DEF,o.st||{}),only=o.only||WP_ORDER,extra={};
  let pins=[],busy=false;const opened=new Set();
  const rdr=['N','T','K'].concat(o.support?['Su']:[]);
  host.insertAdjacentHTML('beforeend','<div class="wp-doc" id="'+id+'"><div class="wp-hd"><div><b>Pitch: Waitlist for full classes</b><small>Posted by Ifeoma in Pitches</small>'+
    '<div class="wp-rd">Readers '+rdr.map(w=>'<span class="wp-av" title="'+WP_WHO[w]+'">'+w+'</span>').join('')+'</div></div><span class="wp-len"></span></div>'+
    only.map(k=>'<div class="wp-sec" data-s="'+k+'"></div>').join('')+'</div>'+(o.foot===false?'':'<div class="wp-ft" id="'+id+'f" aria-live="polite"></div>'));
  const el=document.getElementById(id),ft=document.getElementById(id+'f');
  const sec=k=>el.querySelector('.wp-sec[data-s="'+k+'"]');
  const lines=()=>only.reduce((a,k)=>a+((st[k]&&st[k]!=='off'&&WP_V[k][st[k]])?WP_V[k][st[k]][0]:0)+(extra[k]||[]).length,0);
  function drawSec(k){
    const s=sec(k),v=st[k],c=WP_SEC[k][1];
    let tx;
    if(o.anatomy&&!opened.has(k))tx='<button class="wp-ob" data-k="'+k+'">Tap: what goes here?</button>';
    else if(v==='off')tx='Folded away.';
    else if(!v)tx='<span class="wp-il">Pick a version above.</span>';
    else tx=(o.anatomy?'<div class="wp-job" style="color:var(--'+c+')">'+WP_JOB[k]+'</div>':'')+WP_V[k][v][1];
    tx+=(extra[k]||[]).map(x=>'<span class="wp-x '+x[1]+'">'+x[0]+'</span>').join('');
    s.className='wp-sec'+(v==='off'?' off':'');
    s.innerHTML='<div class="wp-tab" style="background:var(--'+c+'-bg);color:var(--'+c+')">'+k+'</div><div><div class="wp-h">'+WP_SEC[k][0]+'</div><div class="wp-tx">'+tx+'</div></div><div class="wp-mg"></div>';
    pins.filter(p=>p.s===k).forEach(p=>s.querySelector('.wp-mg').insertAdjacentHTML('beforeend',wpPinH(p,' style="animation:none"')));
    const b=s.querySelector('.wp-ob');if(b)b.onclick=()=>{opened.add(k);drawSec(k);if(o.on)o.on('open',opened.size);};}
  function drawLen(){el.querySelector('.wp-len').textContent=lines()+' lines';}
  function draw(){only.forEach(drawSec);drawLen();}
  function foot(msg){if(!ft)return;
    if(msg){ft.innerHTML='<p class="wp-ro">'+msg+'</p>';return;}
    const n=k=>pins.filter(p=>p.k===k).length;
    ft.innerHTML='<div class="wp-tl"><span class="tg">Gaps: '+n('gap')+'</span><span class="ta">Adds info: '+n('add')+'</span><span class="tv">Votes set aside: '+n('vote')+'</span></div>'+
      '<ol class="wp-cm">'+pins.map(p=>'<li>'+wpPinH(p)+'<div><small>'+WP_WHO[p.w]+' on '+WP_SEC[p.s][0]+' · '+wpKind[p.k][1]+'</small>'+p.t+'</div></li>').join('')+'</ol>';}
  const api={st,el,ft,
    get busy(){return busy;},
    lines,secLines:k=>((st[k]&&st[k]!=='off'&&WP_V[k][st[k]])?WP_V[k][st[k]][0]:0)+(extra[k]||[]).length,opened:()=>opened.size,
    folded:()=>only.filter(k=>st[k]==='off').length,
    pins:()=>pins.slice(),
    set(k,v,quiet){st[k]=v;pins=[];el.dataset.posted='';draw();if(!quiet)foot('Changed. Post it again to see what readers say.');},
    load(obj){Object.keys(obj).forEach(k=>{st[k]=obj[k];});if(!('votes' in obj))delete st.votes;pins=[];el.dataset.posted='';draw();foot('');},
    addLine(k,html,cls){(extra[k]=extra[k]||[]).push([html,cls||'patch']);drawSec(k);drawLen();},
    clearLines(){Object.keys(extra).forEach(k=>{extra[k]=[];});draw();},
    pin(p){pins.push(p);const m=sec(p.s).querySelector('.wp-mg');m.insertAdjacentHTML('beforeend',wpPinH(p));return m.lastElementChild;},
    clearPins(){pins=[];draw();},
    foot,
    async post(){
      if(busy)return;busy=true;el.dataset.posted='';pins=[];draw();foot('Noor, Tomás and Kenji are reading…');
      const all=(o.read||wpRead)(st);
      for(const k of only){if(!el.isConnected)return;const s=sec(k);s.classList.add('rd');if(o.scroll!==false)s.scrollIntoView({block:'nearest',behavior:'smooth'});await wpSleep(220);
        all.filter(p=>p.s===k).forEach(p=>api.pin(p));s.classList.remove('rd');}
      busy=false;el.dataset.posted='1';foot();if(o.on)o.on('posted',pins.slice());}};

/* notes for the “Ready to pitch?” sort: [note, card index 0 sol / 1 prob / 2 both, why] */
const WP_RP=[
 ['“Add a dark mode to the schedule screen.”',0,'It says what to build, but not what goes wrong today. Nothing to test it against.'],
 ['“Owners say studio reports are confusing. Let’s fix them.”',1,'A real complaint with no shaped answer. That’s unshaped work.'],
 ['Marisol’s story, six weeks, the waitlist elements, its patches and no-gos.',2,'Problem, appetite and solution come together.'],
 ['“Let’s add a calendar sync button.”',0,'A solution looking for a reason. Nothing to test it against.'],
 ['“Members can’t find classes on the app. We need to sort that out.”',1,'Handing this to a team pushes research down to the wrong level.']];

Course.lesson({
  id:'0006', title:'Write the pitch', minutes:20, icon:'pencil',
  goals:['Name the five ingredients of a pitch and predict what goes wrong when one is missing','Write the problem as one specific story and state the appetite as a limit','Show the solution at the right level of detail and share the pitch for reading ahead'],
  parts:['Ingredients','Problem and appetite','Show it','Present it'],
  read:'Read chapter 6 of the book to see the two real example pitches and their sketches.',
  glossary:{
    'no-go':'No-go: something the pitch says on purpose it won’t include, a feature or use case left out to fit the appetite.',
    'small-batch':'Small batch: a project a tiny team (a designer plus a programmer or two) finishes within a week or two. Several are grouped into one cycle.',
    async:'Asynchronous: people read and reply on their own time, instead of all meeting at once.',
    linchpin:'Linchpin: the one part of a design that everything else depends on, the part people must see to “get” the idea.',
    baseline:'Baseline: the specific story of how things work today. Any proposed solution has to give that story a better ending.',
    'test-of-fitness':'Test of fitness: a way to tell which of two solutions is the better one. A specific problem gives you one; taste does not.'
  },
  cheatsheet:[
    'A pitch has five ingredients: <b>problem, appetite, solution, rabbit holes, no-gos</b>. Leave one out and readers fall into a predictable hole.',
    'Always pair a problem with a solution. A solution alone has no test of fitness; a problem alone is unshaped work.',
    'The best problem is <b>one specific story</b> showing why today’s way doesn’t work. Any solution must give that story a better ending.',
    'State the <b>appetite</b>: it ends “wouldn’t it be better if…” debates and makes every reader a partner in keeping it simple.',
    'Show the solution a little more concretely than your notes, but no wireframes or polished mockups.',
    'Use an <b>embedded sketch</b> only for the linchpin part, with a note that designers may differ, and <b>label fat marker sketches</b> cleanly.',
    'Rabbit holes and no-gos often take just a few lines of text.',
    'Post the pitch for people to read ahead. Comments poke holes or add facts; the yes or no happens at the betting table.'
  ],
  steps:[
/* ---------- PART 1: INGREDIENTS ---------- */
{part:0,src:'Warm-up',pts:1,run(L){

  L.mc(L.card,['Yes, the idea is clear enough','No, it doesn’t say what it fixes or how big it is'],1,
   'Without the problem or a time limit, there’s nothing to judge it against. This lesson builds the write-up that lets people decide.',
   'The idea sounds clear, but Noor can’t tell what problem it solves or how much time it deserves. A good write-up gives Noor both.');}},
{part:0,src:'Chapter 6 · Write the Pitch',
 solve:async L=>{L.$$('#a2 .wp-ob').forEach(b=>b.click());},
 run(L){
  L.h(L.kick('learn','Anatomy of a pitch')+'<h1 class="q">A pitch puts the shaping on one page others can judge</h1>'+
   '<p class="wp-capt" style="margin-top:0">A '+L.g('pitch','pitch')+' presents a good possible bet, so the people who choose projects can decide with full information. Tap each of its five ingredients.</p><div id="a2"></div>');
  wpPage(L.$('#a2'),{anatomy:true,on:(ev,n)=>{if(ev==='open'&&n===5){
    L.sheet('info','Five ingredients, five jobs','<b>Problem</b> and <b>appetite</b> say what’s worth solving and how much it’s worth. <b>Solution</b>, <b>rabbit holes</b> and <b>no-gos</b> say what gets built, where the traps are, and what won’t be built at all.');L.done();}}});}},
{part:0,src:'Chapter 6 · Write the Pitch',
 solve:async L=>{L.$('#e3c [data-k="P"]').click();L.$('#e3c [data-k="R"]').click();L.$('#e3go').click();await wpWait(L,()=>L.$('#e3 .wp-doc').dataset.posted==='1');},
 run(L){
  L.h(L.kick('pr','Explore · fold the pitch')+'<h1 class="q">Fold away any two ingredients, then post the pitch. Watch where the readers’ comments land.</h1>'+
   '<div class="wp-chips" id="e3c" role="group" aria-label="Ingredients in the pitch"></div><div class="wp-row"><button class="btn pri" id="e3go">'+L.ic('chat')+'Post for reading</button></div><div id="e3"></div>');
  let gated=false;
  const api=wpPage(L.$('#e3'),{hint:'Not posted yet. Tap an ingredient to fold it away.',on:(ev,pins)=>{L.$('#e3go').disabled=false;if(ev!=='posted')return;
    if(api.folded()<2){api.foot();api.ft.insertAdjacentHTML('afterbegin','<p class="wp-ro">Fold at least two ingredients and post again.</p>');return;}
    if(!gated){gated=true;L.sheet('info','Each gap has its own reader','No problem: nobody can judge the solution. No appetite: Noor piles on more. No rabbit holes: Tomás asks about the traps. No no-gos: Kenji asks what’s in. Try folding others, or unfold everything: only a helpful fact and a +1 remain, and the +1 waits for the betting table.');L.done();}}});
  WP_ORDER.forEach(k=>{const b=document.createElement('button');b.className='chip sel';b.dataset.k=k;b.textContent=WP_SEC[k][0];b.setAttribute('aria-pressed','true');
    b.onclick=()=>{if(api.busy)return;const on=api.st[k]!=='off';api.set(k,on?'off':WP_DEF[k]);b.classList.toggle('sel',!on);b.classList.toggle('off',on);b.setAttribute('aria-pressed',String(!on));};L.$('#e3c').appendChild(b);});
  L.$('#e3go').onclick=()=>{if(api.busy)return;L.$('#e3go').disabled=true;api.post();};}},
{part:0,src:'Chapter 6 · Ingredient 5. No Gos',pts:1,
 solve:async L=>{L.$('#p4o').children[1].click();await wpWait(L,()=>L.$('#p4 .wp-doc').dataset.posted==='1');},
 run(L){
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">Ifeoma posts the pitch with only the no-gos folded away. Which comment will drop into the margin?</h1><div id="p4o"></div><div id="p4"></div>');
  const api=wpPage(L.$('#p4'),{st:{N:'off'},hint:'Waiting for your prediction.'});
  const O=[['Tomás','“What if two members tap at once?”'],['Kenji','“Does this include texts? Workshops?”'],['Noor','“What goes wrong for studios today?”']];
  let picked=false;
  O.forEach((o,j)=>{const b=document.createElement('button');b.className='wp-opt';b.innerHTML='<b>'+o[0]+'</b>'+o[1];
    b.onclick=async()=>{if(picked)return;picked=true;const ok=j===1;L.award(ok);b.classList.add(ok?'ok':'no');
      await api.post();if(!L.card.isConnected)return;
      L.sheet(ok?'ok':'no',ok?'Right: Kenji asks what’s in':'It was Kenji’s question','The problem, appetite, solution and rabbit holes were all there, so nobody asked about them. With no list of what’s left out, the team can’t tell which nearby features count. Is it texts too? Workshops? A '+L.g('no-go','no-go')+' answers that in one line, before anyone starts building.');L.done();};
    L.$('#p4o').appendChild(b);});}},
{part:0,src:'Chapter 6 · Write the Pitch',pts:5,run(L){
  L.h(L.kick('pr','Sort the draft')+'<h1 class="q">Here are lines from Ifeoma’s waitlist pitch. Put each under its ingredient.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Problem','Appetite','Solution','Rabbit holes','No-gos'],[
   ['When someone cancels, Marisol texts members one by one, and the spot often stays empty.',0,'A specific story of what goes wrong today.'],
   ['This is worth six weeks to us, not more.',1,'The time we’re willing to spend.'],
   ['A Join waitlist button on full classes, a list for the studio, and a “spot opened” message.',2,'The core elements of the solution.'],
   ['If two members tap “Book” at once, the first tap wins.',3,'A detail spelled out so the team doesn’t fall into a hole.'],
   ['No waitlists for one-to-one personal training.',4,'A use case left out on purpose.']],
   'Five ingredients, each doing its own job. Together they let the betting table judge the bet.');}},

/* ---------- PART 2: PROBLEM AND APPETITE ---------- */
{part:1,src:'Chapter 6 · Ingredient 1. Problem · Ingredient 3. Solution',run(L){
  L.h(L.kick('learn','Problem and solution travel together')+'<h1 class="q">Never pitch one without the other</h1>'+
   '<div class="wp-trio">'+['sol','prob','both'].map(k=>wpPair(k)).join('')+'</div><div class="wp-fig">'+WP_BASE+'</div>'+
   '<p class="wp-capt">A solution alone has no '+L.g('test-of-fitness','test of fitness')+', and no way to ask if it helps customers you want to keep, not ones known to leave. A problem alone is unshaped work. Pair them, with one story as the '+L.g('baseline','baseline')+'.</p>');
  L.done();}},
{part:1,src:'Chapter 6 · Ingredient 1. Problem',
 solve:async L=>{for(const k of ['vague','stat','story']){L.$('#m7c [data-v="'+k+'"]').click();await L.sleep(20);}},
 run(L){
  L.h(L.kick('ex','See it · what readers picture')+'<h1 class="q">Swap the problem line and watch what each reader pictures</h1><div class="wp-chips" id="m7c" role="group" aria-label="Problem line"></div><div id="m7"></div><p class="wp-ro" id="m7r" aria-live="polite"></p>');
  const seen=new Set();
  function show(v){const D=WP_MIND[v],same=v==='story';
    L.$('#m7').innerHTML='<p class="small" style="margin:6px 0 0"><b style="color:var(--ink)">'+D.t+'</b></p><div class="wp-minds">'+D.m.map(m=>'<div class="wp-mind"><div class="wp-bub'+(same?' same':'')+'">'+wpPic(m[1])+m[2]+'</div><div class="wp-who"><span class="wp-av">'+m[0]+'</span>'+WP_WHO[m[0]]+'</div></div>').join('')+'</div>';
    L.$('#m7r').innerHTML=same?'<b style="color:var(--ok)">Same picture: 3 of 3 readers.</b> Everyone can now judge a solution against the same story.':'<b style="color:var(--no)">Same picture: 0 of 3 readers.</b> '+(v==='stat'?'The number shows demand, but not what goes wrong. Each reader fills the gap with their own guess.':'Each reader fills the gap with their own idea of a waitlist.');
    seen.add(v);L.$$('#m7c .chip').forEach(c=>c.classList.toggle('sel',c.dataset.v===v));
    if(seen.size===3){L.sheet('info','One story gives one shared picture','A general wish or a bare number leaves every reader free to imagine a different project. One concrete story puts the same scene in everyone’s head, so the talk is about the story, not about three private guesses.');L.done();}}
  [['vague','A general wish'],['stat','A number'],['story','One specific story']].forEach(x=>{const b=document.createElement('button');b.className='chip';b.dataset.v=x[0];b.textContent=x[1];b.onclick=()=>show(x[0]);L.$('#m7c').appendChild(b);});
  L.$('#m7').innerHTML='<p class="wp-ro">Pick a problem line above. Try all three.</p>';}},
{part:1,src:'Chapter 6 · Ingredient 1. Problem',
 solve:async L=>{L.$('#y8s [data-s="1"]').click();L.$('#y8c').children[0].click();L.$('#y8c').children[1].click();L.$('#y8s [data-s="0"]').click();L.$('#y8c').children[2].click();},
 run(L){
  L.h(L.kick('ex','The story as a yardstick')+'<h1 class="q">Swap rival solutions into Marisol’s story. Then take the story away and try again.</h1>'+
   '<div class="wp-chips" id="y8s" role="group" aria-label="Problem in the pitch"><button class="chip sel" data-s="1">With the story</button><button class="chip" data-s="0">No story</button></div>'+
   '<div class="wp-chips" id="y8c" role="group" aria-label="Solution to test"></div><div id="y8"></div><p class="wp-ro" id="y8r" aria-live="polite"></p>');
  let story=true,cur=-1;const tried={1:new Set(),0:new Set()};
  WP_FIT.forEach((f,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=f.n;b.onclick=()=>{cur=j;draw();};L.$('#y8c').appendChild(b);});
  L.$$('#y8s .chip').forEach(b=>b.onclick=()=>{story=b.dataset.s==='1';L.$$('#y8s .chip').forEach(c=>c.classList.toggle('sel',c===b));draw();});
  function draw(){
    [...L.$('#y8c').children].forEach((c,j)=>c.classList.toggle('sel',j===cur));
    if(cur<0){L.$('#y8').innerHTML='<p class="wp-ro">Pick a solution to test.</p>';return;}
    const f=WP_FIT[cur];tried[story?1:0].add(cur);
    let h;
    if(story){h='<div class="wp-ys"><div class="wp-ysr"><span>4 p.m.</span>Ana cancels Marisol’s full 6 p.m. class.</div><div class="wp-ysr mid"><span>Then</span>'+f.mid+'</div><div class="wp-ysr '+(f.ok?'ok':'no')+'"><span>6 p.m.</span><b>'+(f.ok?'Spot filled. Marisol texted nobody.':'Spot empty. Same ending as today.')+'</b></div></div>'+
      '<div class="wp-vd">'+['N','T','K'].map(w=>'<div class="'+(f.ok?'y':'n')+'"><b>'+WP_WHO[w]+'</b>'+L.ic(f.ok?'check':'x')+' '+(f.ok?'Ends better':'No better')+'</div>').join('')+'</div>';
      L.$('#y8r').innerHTML='<b style="color:var(--ink)">Readers agree: 3 of 3.</b> They judge the story’s ending, not their taste.';}
    else{const yes=f.taste.filter(t=>t[2]).length;
      h='<div class="wp-ys"><div class="wp-ysr"><span>Story</span><i>None in the pitch. Nothing to replay.</i></div></div><div class="wp-vd">'+f.taste.map(t=>'<div class="'+(t[2]?'y':'n')+'"><b>'+WP_WHO[t[0]]+'</b>'+L.ic(t[2]?'check':'x')+' '+t[1]+'</div>').join('')+'</div>';
      L.$('#y8r').innerHTML='<b style="color:var(--no)">Readers split '+yes+' to '+(3-yes)+'.</b> Taste against taste: the debate has no end.';}
    L.$('#y8').innerHTML=h;
    if(tried[1].size>=2&&tried[0].size>=1&&!L.$('#y8ok')){L.$('#y8').insertAdjacentHTML('beforeend','<span id="y8ok"></span>');
      L.sheet('info','A test of fitness','With the story in the pitch, any solution, including a rival one, is judged the same way: does the story end better with it swapped in? Without it, people argue taste, and the debate can run forever.');L.done();}}
  draw();}},
{part:1,src:'Chapter 6 · Ingredient 1. Problem',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Ifeoma is shaping a clearer “class cancelled” email. Which is the strongest problem section?</h1>');
  L.mc(L.card,['Members say our emails could be much clearer.','Studios want a better class-cancelled email soon.','Last week a member drove to Ironleaf for a cancelled class. The email hid it below an ad.'],2,
   'One specific story of today’s way failing. Any new email can be tested against it.',
   'The other two are general wishes. A single specific story shows what goes wrong and gives a solution something to beat.');}},
{part:1,src:'Chapter 6 · Ingredient 2. Appetite',run(L){
  L.h(L.kick('learn','Ingredient 2: appetite')+'<h1 class="q">The appetite is part of the problem</h1>'+
   '<div class="wp-fig">'+WP_APP+'</div>'+
   '<p class="wp-capt">There’s always a better solution. Stating the '+L.g('appetite','appetite')+' (“six weeks, not three months”, or two weeks for a '+L.g('small-batch','small batch')+') changes the question to: what fits? Every reader then helps find the simple version.</p>'+
   L.quote('Anybody can suggest expensive and complicated solutions.','Ryan Singer, Shape Up'));
  L.done();}},
{part:1,src:'Chapter 6 · Ingredient 2. Appetite',
 solve:async L=>{L.$('#ap11go').click();await wpWait(L,()=>L.$('#ap11').dataset.done==='1');L.$('#ap11m [data-a="off"]').click();L.$('#ap11go').click();await wpWait(L,()=>L.$('#ap11').dataset.done==='1');},
 run(L){
  L.h(L.kick('pr','Hands on · the appetite as a limit')+'<h1 class="q">Noor reads the pitch and has three “wouldn’t it be better if…” ideas. Let Noor read it with the appetite, then without.</h1>'+
   '<div class="wp-chips" id="ap11m" role="group" aria-label="Appetite"><button class="chip sel" data-a="six">Appetite: six weeks</button><button class="chip" data-a="off">Appetite folded</button></div>'+
   '<div class="wp-row"><button class="btn pri" id="ap11go">'+L.ic('chat')+'Let Noor read it</button></div><div id="ap11"></div><div id="ap11f" aria-live="polite"></div>');
  const host=L.$('#ap11');
  const api=wpPage(host,{only:['P','A','S'],foot:false});
  const IDEAS=[['Can’t we also send text messages?','Not in six weeks. Email and in-app cover Marisol’s story.','+ Text messages too'],
               ['What about a priority line for members with memberships?','That’s a new rule system. It doesn’t fit six weeks.','+ Priority line for members'],
               ['And waitlists for workshops?','Regular classes only. Workshops can be their own pitch.','+ Waitlists for workshops']];
  const seen=new Set();let mode='six',run=false;
  L.$$('#ap11m .chip').forEach(b=>b.onclick=()=>{if(run)return;mode=b.dataset.a;L.$$('#ap11m .chip').forEach(c=>c.classList.toggle('sel',c===b));api.clearLines();api.set('A',mode,true);L.$('#ap11f').innerHTML='';});
  L.$('#ap11go').onclick=async()=>{if(run)return;run=true;host.dataset.done='';L.$('#ap11go').disabled=true;api.clearLines();api.clearPins();
    const before=api.secLines('S');let out='';L.$('#ap11f').innerHTML='';
    for(const id of IDEAS){await L.sleep(320);if(!host.isConnected)return;
      if(mode==='six'){api.pin({s:'A',w:'N',k:'vote',t:id[0]});out+='<li><span class="wp-pin vote" aria-hidden="true">N</span><div><small>Noor</small>'+id[0]+'<small style="color:var(--ok)">Ifeoma: '+id[1]+'</small></div></li>';}
      else{api.pin({s:'S',w:'N',k:'gap',t:id[0]});api.addLine('S',id[2],'grow');out+='<li><span class="wp-pin gap" aria-hidden="true">N</span><div><small>Noor</small>'+id[0]+'<small style="color:var(--no)">Ifeoma: Sure, why not? Added.</small></div></li>';}
      L.$('#ap11f').innerHTML='<ol class="wp-cm">'+out+'</ol>';}
    const after=api.secLines('S');
    L.$('#ap11f').insertAdjacentHTML('afterbegin','<p class="wp-ro">'+(mode==='six'?'<b style="color:var(--ok)">Solution: still '+after+' lines.</b> Each idea was weighed against six weeks and set aside.':'<b style="color:var(--no)">Solution grew: '+before+' → '+after+' lines.</b> Nothing on the page says when to stop.')+'</p>');
    seen.add(mode);run=false;L.$('#ap11go').disabled=false;host.dataset.done='1';
    if(seen.size===2&&!L.$('#ap11ok')){host.insertAdjacentHTML('beforeend','<span id="ap11ok"></span>');
      L.sheet('info','The appetite gives a reason to say no','Every idea Noor had was a good one. With six weeks on the page, each had to fit, and Ifeoma could turn it down without a fight. With no appetite, every better idea sounds reasonable, so the project keeps growing.');L.done();}};}},
{part:1,src:'Chapter 6 · Ingredient 1. Problem · Ingredient 3. Solution',pts:5,
 solve:async L=>{for(let i=0;i<WP_RP.length;i++){await wpWait(L,()=>L.$('#rp12q').dataset.i===String(i));L.$('#rp12 [data-c="'+WP_RP[i][1]+'"]').click();await L.sleep(20);if(i<WP_RP.length-1){L.$('#rp12nx').click();await L.sleep(20);}}},
 run(L){
  L.h(L.kick('pr','Ready to pitch?')+'<h1 class="q">Tap the card each note makes. Only one kind is ready to bet on.</h1><div id="rp12q"></div><div class="wp-trio" id="rp12" role="group" aria-label="Pitch cards" style="margin-bottom:34px"></div><div id="rp12f" aria-live="polite"></div><div class="wp-row"><button class="btn pri" id="rp12nx" style="display:none">Next note '+L.ic('arrow')+'</button></div>');
  const K=['sol','prob','both'],cnt=[0,0,0];let i=0,got=0,ans=false;
  L.$('#rp12').innerHTML=K.map((k,j)=>'<button class="wp-pc" data-c="'+j+'" aria-label="'+WP_PAIRN[k]+'">'+wpPair(k,1)+'<span class="wp-pcn"></span></button>').join('');
  const cards=[...L.$('#rp12').children];
  function show(){ans=false;const it=WP_RP[i];cards.forEach(c=>c.classList.remove('ok','no'));L.$('#rp12f').innerHTML='';L.$('#rp12nx').style.display='none';
    L.$('#rp12q').dataset.i=String(i);L.$('#rp12q').innerHTML='<div class="wp-cur"><small class="wp-ro" style="margin:0">Note '+(i+1)+' of '+WP_RP.length+'</small><p>'+it[0]+'</p></div>';}
  cards.forEach((b,j)=>b.onclick=()=>{if(ans)return;ans=true;const it=WP_RP[i],ok=j===it[1];L.award(ok);if(ok)got++;
    b.classList.add(ok?'ok':'no');if(!ok)cards[it[1]].classList.add('ok');cnt[it[1]]++;cards[it[1]].querySelector('.wp-pcn').textContent=cnt[it[1]];
    L.$('#rp12f').innerHTML='<div class="fb '+(ok?'ok':'no')+'" style="margin-top:6px">'+(ok?'Right. ':'It’s “'+WP_PAIRN[K[it[1]]]+'”. ')+it[2]+'</div>';
    if(i===WP_RP.length-1){L.sheet(got===WP_RP.length?'ok':'info',got+' of '+WP_RP.length+' right','Only the note with problem, appetite and solution together is ready to bet on. A bare solution has nothing to test it against; a bare problem goes back to the shaping track.');L.done();}
    else L.$('#rp12nx').style.display='';});
  L.$('#rp12nx').onclick=()=>{if(!ans)return;i++;show();};
  show();}},

/* ---------- PART 3: SHOW IT ---------- */
{part:2,src:'Chapter 6 · Ingredient 3. Solution · Help them see it',run(L){
  L.h(L.kick('learn','Ingredient 3: solution')+'<h1 class="q">Help readers see it, without designing it for them</h1>'+
   '<div class="wp-fig">'+WP_SPEC+'</div>'+
   '<p class="wp-capt">Readers weren’t there when Ifeoma shaped it. A raw '+L.g('breadboard','breadboard')+' is a jumble to them; wireframes box Kenji in and pull talk toward color and layout. Aim between: a bit more concrete than private notes, still rough.</p>');
  L.done();}},
{part:2,src:'Chapter 6 · Embedded sketches',pts:1,
 solve:async L=>{L.$('#b14 [data-e="card"] .chip').click();L.$('#b14n').click();L.$('#b14go').click();},
 run(L){
  L.h(L.kick('pr','Challenge · embed a sketch')+'<h1 class="q">Noor can’t picture the waitlist from the breadboard. Add sketches until Noor gets it, without boxing Kenji in.</h1>'+
   '<p class="small" style="margin:-8px 0 8px">Each sketch shows more, and decides more of the layout.</p><div id="b14"></div>'+
   '<div class="wp-row"><button class="chip" id="b14n" aria-pressed="false">Add a note: designers may find a different layout</button></div>'+
   '<p class="wp-ro" id="b14r" aria-live="polite"></p><div class="wp-row"><button class="btn pri" id="b14go">'+L.ic('check')+'Put it in the pitch</button></div>');
  const sk=new Set();let note=false,first=true;
  L.$('#b14').innerHTML=WP_BB.map((b,j)=>'<div class="wp-bb" data-e="'+b.e+'"><div><div class="wp-bbt">'+b.t+' <small>'+b.s+'</small></div>'+b.a.map(a=>'<div class="wp-aff">'+a+'</div>').join('')+
    '<div class="wp-skh"></div><button class="chip" aria-pressed="false">'+L.ic('pencil')+'Embed a sketch</button></div><div class="wp-mg"></div></div>'+(b.to?'<div class="wp-bba">↓ '+b.to+'</div>':'')).join('');
  function pins(){const P=[];
    if(!sk.has('card'))P.push(['card','N','gap','Where does Join waitlist go on a full class card? I can’t picture it.']);
    sk.forEach(e=>{if(e!=='card')P.push([e,'K','gap','This part was clear already. Now its layout is decided too.']);});
    if(sk.size&&!note)P.push([[...sk][0],'K','gap','Do I have to follow this layout exactly?']);
    return P;}
  function draw(){
    L.$$('#b14 .wp-bb').forEach(box=>{const e=box.dataset.e,on=sk.has(e),B=WP_BB.find(x=>x.e===e);
      box.classList.toggle('lit',on);box.querySelector('.wp-skh').innerHTML=on?'<svg class="wp-sk" viewBox="0 0 230 78" role="img" aria-label="Fat marker sketch of '+B.t+'">'+B.sk+'</svg>':'';
      const c=box.querySelector('.chip');c.classList.toggle('sel',on);c.setAttribute('aria-pressed',String(on));c.innerHTML=L.ic(on?'x':'pencil')+(on?'Remove sketch':'Embed a sketch');
      box.querySelector('.wp-mg').innerHTML='';});
    const P=pins();P.forEach(p=>L.$('#b14 [data-e="'+p[0]+'"] .wp-mg').insertAdjacentHTML('beforeend',wpPinH({w:p[1],k:p[2]})));
    L.$('#b14n').classList.toggle('sel',note);L.$('#b14n').setAttribute('aria-pressed',String(note));
    L.$('#b14r').innerHTML='Noor can picture it: <b>'+(sk.has('card')?'yes':'no')+'</b> · Layout decisions made: <b>'+sk.size+'</b> · Designer note: <b>'+(note?'on':'off')+'</b>'+
      (P.length?'<ol class="wp-cm" style="margin-top:8px">'+P.map(p=>'<li>'+wpPinH({w:p[1],k:p[2]})+'<div><small>'+WP_WHO[p[1]]+'</small>'+p[3]+'</div></li>').join('')+'</ol>':'<br><b style="color:var(--ok)">No open comments.</b>');}
  L.$$('#b14 .wp-bb').forEach(box=>box.querySelector('.chip').onclick=()=>{const e=box.dataset.e;sk.has(e)?sk.delete(e):sk.add(e);draw();});
  L.$('#b14n').onclick=()=>{note=!note;draw();};
  L.$('#b14go').onclick=()=>{const ok=sk.size===1&&sk.has('card')&&note;
    if(first){L.award(ok);first=false;}
    if(ok)L.sheet('ok','Selective detail','The class card was the '+L.g('linchpin','linchpin')+': the one part everyone had to see to “get” the idea. One fat marker sketch there, plus a note that designers may find a different layout, and the other parts stay as words and arrows.');
    else L.sheet('no','Not yet',!sk.has('card')?'Noor still can’t see where the button goes. Sketch the part people can’t picture.':(sk.size>1?'Only the class card needed a picture. The other sketches decide layout nobody asked about. Remove them.':'A sketch makes layout decisions. Add the note so Kenji knows they can design it differently.'));
    L.done();};
  draw();}},
{part:2,src:'Chapter 6 · Annotated fat marker sketches · How we do it in Basecamp',
 solve:async L=>{for(let i=0;i<3;i++){L.$('#f15go').click();await L.sleep(20);}},
 run(L){
  L.h(L.kick('ex','Annotated fat marker sketch')+'<h1 class="q">Some ideas are visual by nature. Turn Ifeoma’s pencil sketch into one a reader can use.</h1><div id="f15"></div><p class="wp-ro" id="f15t" aria-live="polite"></p><ul class="wp-cn" id="f15n"></ul><div class="wp-row"><button class="btn pri" id="f15go">Next step '+L.ic('arrow')+'</button></div>');
  const T=['<b style="color:var(--ink)">Step 1 of 4 · The pencil sketch.</b> Fine for Ifeoma while shaping. To anyone else, thin lines and scribbles are hard to read.',
   '<b style="color:var(--ink)">Step 2 of 4 · Redraw it with a fat brush.</b> Ifeoma redraws it on an iPad, still with a thick brush, so it stays rough but reads clearly.',
   '<b style="color:var(--ink)">Step 3 of 4 · Labels in a second color.</b> Labels in another color stay apart from the parts of the sketch itself.',
   '<b style="color:var(--ink)">Step 4 of 4 · Call-outs.</b> Numbered call-outs let readers discuss one part: “about call-out 2…”. The sketch goes into the pitch as an image with a caption.'];
  let s=0;
  function svg(){const fat=s>=1,ink=fat?'var(--ink)':'var(--muted)',w=fat?5:1.4;
    let h='<svg class="wp-big" viewBox="0 0 300 168" role="img" aria-label="Sketch of a full class card, step '+(s+1)+' of 4">'+
     '<rect x="14" y="14" width="186" height="120" rx="14" fill="none" stroke="'+ink+'" stroke-width="'+w+'"'+(fat?'':' stroke-dasharray="7 2 3 2"')+'/>'+
     '<path d="M32 42h96" stroke="'+ink+'" stroke-width="'+(fat?6:1.4)+'" stroke-linecap="round"/><path d="M32 62h56" stroke="var(--muted)" stroke-width="'+(fat?5:1.2)+'" stroke-linecap="round"/>'+
     '<rect x="140" y="30" width="50" height="24" rx="12" fill="none" stroke="'+(fat?'var(--no)':ink)+'" stroke-width="'+(fat?4:1.3)+'"/>'+(fat?'<text x="165" y="47" text-anchor="middle" font-size="12" font-weight="700" fill="var(--no)">Full</text>':'<path d="M149 42c6-4 12 4 18 0s10 2 14 0" stroke="var(--muted)" stroke-width="1.2" fill="none"/>')+
     '<rect x="32" y="88" width="152" height="30" rx="15" fill="'+(fat?'var(--pri)':'none')+'" stroke="'+(fat?'var(--pri)':ink)+'" stroke-width="'+(fat?3:1.3)+'"/>'+
     (fat?'<text x="108" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="var(--card)">Join waitlist</text>':'<path d="M60 104c10-5 20 5 30 0s20 4 30 0 20 3 34 0" stroke="var(--muted)" stroke-width="1.2" fill="none"/>');
    if(s>=2)h+='<g fill="var(--pri)" font-size="12" font-weight="600"><path d="M130 38L140 16H206" stroke="var(--pri)" stroke-width="1.5" fill="none" stroke-dasharray="3 3"/><text x="210" y="20">Class, time</text>'+
      '<path d="M178 56V68H206" stroke="var(--pri)" stroke-width="1.5" fill="none" stroke-dasharray="3 3"/><text x="210" y="72">Full tag</text>'+
      '<path d="M206 103h-20" stroke="var(--pri)" stroke-width="1.5" stroke-dasharray="3 3"/><text x="210" y="100">New:</text><text x="210" y="114">Join button</text></g>';
    if(s>=3)h+='<g><circle cx="150" cy="68" r="11" fill="var(--h2)"/><text x="150" y="72.5" text-anchor="middle" font-size="12" font-weight="700" fill="var(--card)">1</text><circle cx="20" cy="103" r="11" fill="var(--h2)"/><text x="20" y="107.5" text-anchor="middle" font-size="12" font-weight="700" fill="var(--card)">2</text></g>';
    return h+'</svg>';}
  function draw(){L.$('#f15').innerHTML=svg();L.$('#f15t').innerHTML=T[s];
    L.$('#f15n').innerHTML=s>=3?'<li><b>1</b> · The button only shows on full classes.</li><li><b>2</b> · Once a member joins, they get a “Leave waitlist” link instead.</li>':'';
    if(s>=3){L.$('#f15go').disabled=true;L.sheet('info','Clean enough to “get”, rough enough to leave room','A fat marker sketch works in a pitch if you label it cleanly: thick lines, labels in another color, and call-outs to discuss parts. Visual detail goes only where the idea needs it.');L.done();}}
  L.$('#f15go').onclick=()=>{if(s<3){s++;draw();}};
  draw();}},
{part:2,src:'Chapter 6 · Help them see it',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Right level of detail for a pitch?',['Too vague','Right level','Too detailed'],[
   ['A finished, colored mockup of the waitlist screen in the app’s real fonts.',2,'It boxes Kenji in and invites talk about color and layout.'],
   ['A photo of the raw whiteboard breadboard, with no labels.',0,'People who weren’t there will see a jumble of words and arrows.'],
   ['A thick-brush sketch of the class card, with labels in a second color.',1,'Concrete enough to “get”, rough enough to leave room.'],
   ['“There’ll be some kind of waitlist. Details to come.”',0,'Readers can’t judge what they can’t see.'],
   ['A clean breadboard of the member flow, plus one embedded sketch of the class card.',1,'Schematic where that’s enough, visual only where it’s needed.']]);}},
{part:2,src:'Chapter 6 · Ingredient 4. Rabbit holes · Ingredient 5. No Gos',run(L){
  L.h(L.kick('learn','Ingredients 4 and 5')+'<h1 class="q">Rabbit holes and no-gos often take just a few lines</h1>'+
   '<div class="wp-fig">'+WP_RN+'</div>'+
   '<p class="wp-capt">Rabbit hole: spell out how one tricky detail will work. '+L.g('no-go','No-go')+': name what you won’t build, even if some would like it, because it doesn’t fit the appetite. These are the patches and fences from the risk step.</p>');
  L.done();}},
{part:2,src:'Chapter 6 · Ingredient 4. Rabbit holes · Ingredient 5. No Gos',pts:5,run(L){
  L.h(L.kick('pr','Rabbit hole or no-go?')+'<h1 class="q">Sort the last lines of Ifeoma’s waitlist pitch.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Rabbit hole','No-go'],[
   ['If two members tap “Book” at once, the first wins; the other sees “Spot taken.”',0,'A tricky detail of the solution, answered up front.'],
   ['No waitlists for workshops, retreats or livestreams.',1,'Use cases left out on purpose.'],
   ['Nobody is charged automatically; the member books and pays the normal way.',0,'It patches a risky part of how the solution works.'],
   ['No text messages, only email and in-app notices.',1,'A feature left out to fit the six weeks.'],
   ['A spot won from the waitlist follows the studio’s usual late-cancel rule.',0,'A hard decision settled, so the team doesn’t stall on it.']],
   'Rabbit holes say how a tricky part <i>will</i> work. No-gos say what <i>won’t</i> be built at all.');}},

/* ---------- PART 4: PRESENT IT ---------- */
{part:3,src:'Chapter 6 · Examples',run(L){
  L.h(L.kick('ex','The book’s examples')+'<h1 class="q">Two real pitches from Basecamp</h1>'+
   '<div class="wp-fig">'+WP_EXM+'</div>'+
   '<p class="wp-capt">Same recipe, different media: show the problem, then the solution at the right level. Some to-do sketches exist because of rabbit holes; the notifications pitch adds charts of real usage that back a trade-off.</p>');
  L.done();}},
{part:3,src:'Chapter 6 · Ready to present · How we do it in Basecamp',run(L){
  L.h(L.kick('learn','Ready to present')+'<h1 class="q">Post it, let people read, then bet</h1>'+
   '<div class="wp-fig">'+WP_POST+'</div>'+
   '<p class="wp-capt">Basecamp posts pitches as messages in one place the people at the table can see. Everyone reads on their own time ('+L.g('async','asynchronous')+'), so the '+L.g('betting-table','betting table')+' stays short; a quick live sell is the backup. The CTO replies with technical thoughts.</p>');
  L.done();}},
{part:3,src:'Chapter 6 · How we do it in Basecamp',pts:5,
 solve:async L=>{const R=[1,0,1,0,1];for(let i=0;i<5;i++){await wpWait(L,()=>!!L.$('#t21b'+i));L.$('#t21b'+i).children[R[i]?0:1].click();await L.sleep(20);}},
 run(L){
  L.h(L.kick('pr','Triage the comments')+'<h1 class="q">The pitch is posted. Comments arrive one at a time. Keep the ones that help; set votes aside for the betting table.</h1><div id="t21q"></div><div id="t21"></div>');
  const api=wpPage(L.$('#t21'),{support:true,foot:false});
  const C=[['R','T','Class-pack credits work the same for waitlist spots, so no new code there.',1,'Adds a technical fact the pitch was missing.','+ Class-pack credits work the same for waitlist spots (Tomás).'],
           ['P','N','+1 from me. Let’s do it!',0,'That’s a vote. The yes or no happens at the betting table.'],
           ['S','Su','Ironleaf has two rooms. What happens when two classes overlap?',1,'Pokes a hole worth checking before the bet.','+ Open question: overlapping classes in Ironleaf’s two rooms (support).'],
           ['A','N','I’d rather spend the cycle on gift cards.',0,'Choosing between bets is the betting table’s job, not a comment’s.'],
           ['S','T','Our data: most Ember Yoga cancellations come one to three hours before class.',1,'Data that backs up a trade-off: the message has to go out fast.','+ Most cancellations come 1–3 hours before class (Tomás).']];
  let i=0,got=0;
  function ask(){
    if(i>=C.length){L.$('#t21q').innerHTML='';L.awardMany(got,C.length);
      L.sheet(got===C.length?'ok':'info',got+' of 5 right','Three comments improved the pitch: two facts and a hole to check. The two votes changed nothing on the page. They wait for the betting table, where the decision is made.');L.done();return;}
    const c=C[i];const pin=api.pin({s:c[0],w:c[1],k:'new',t:c[2]});
    L.$('#t21q').innerHTML='<div class="wp-cur"><small class="wp-ro" style="margin:0">Comment '+(i+1)+' of 5 · '+WP_WHO[c[1]]+' on '+WP_SEC[c[0]][0]+'</small><p>“'+c[2]+'”</p><div class="wp-row" id="t21b'+i+'"><button class="btn">'+L.ic('check')+'Keep: it helps</button><button class="btn">'+L.ic('scale')+'A vote: save it</button></div></div>';
    [...L.$('#t21b'+i).children].forEach((b,j)=>b.onclick=()=>{const keep=j===0,ok=keep===!!c[3];if(ok)got++;
      pin.className='wp-pin '+(c[3]?'add':'vote');
      if(c[3])api.addLine(c[0],c[5],'patch');
      L.$('#t21q').innerHTML='<div class="fb '+(ok?'ok':'no')+'">'+(ok?'Right. ':'Not quite. ')+c[4]+'</div>';
      i++;setTimeout(()=>{if(L.card.isConnected&&L.$('#t21q'))ask();},ok?650:1300);});}
  ask();}},
{part:3,src:'Chapter 6 · Write the Pitch',
 solve:async L=>{for(const k of ['solo','nosol','wire']){L.$('#x22c [data-p="'+k+'"]').click();await wpWait(L,()=>L.$('#x22 .wp-doc').dataset.posted==='1');}},
 run(L){
  L.h(L.kick('pr','Edge cases · where a pitch breaks')+'<h1 class="q">Load each broken pitch and watch the readers react. Try at least three.</h1><div class="wp-chips" id="x22c" role="group" aria-label="Broken pitches"></div><div id="x22e" aria-live="polite"></div><div id="x22"></div>');
  const P=[['solo','Solution only',{P:'off',A:'off',S:'note',R:'off',N:'off'},'This is the warm-up note. No problem means no test of fitness; no appetite means it can grow forever; nothing says where the traps are or what’s out.'],
   ['nosol','Problem, no solution',{S:'off'},'Unshaped work. Handing it to a team pushes research down to the wrong people, with the wrong time limit and a long tail of risk. It goes back to the shaping track.'],
   ['noapp','No appetite',{A:'off'},'There’s always a better solution. Without a time limit, every “wouldn’t it be better if…” sounds reasonable, so the debate over the perfect version never ends.'],
   ['wire','Wireframes in the pitch',{S:'wire'},'Kenji is boxed in, and Noor is talking about button color instead of the shaping work. The pitch also got much longer.'],
   ['stat','Numbers, not a story',{P:'stat'},'A number shows demand, but there’s no story to replay a solution against. Data can still help, as in the book’s notifications pitch, but next to the story, not instead of it.'],
   ['votes','Comments as votes',{votes:true},'Three +1s and no holes poked. The table learns nothing new, and the decision still happens at the betting table. Comments are for poking holes and adding facts.']];
  const api=wpPage(L.$('#x22'),{hint:'Pick a broken pitch above.'});const seen=new Set();
  P.forEach(p=>{const b=document.createElement('button');b.className='chip';b.dataset.p=p[0];b.textContent=p[1];
    b.onclick=async()=>{if(api.busy)return;L.$$('#x22c .chip').forEach(c=>c.classList.toggle('sel',c===b));
      api.load(Object.assign({},WP_DEF,p[2]));L.$('#x22e').innerHTML='';await api.post();if(!L.card.isConnected)return;
      L.$('#x22e').innerHTML='<div class="fb info" style="margin:0 0 4px"><b>'+p[1]+':</b> '+p[3]+'</div>';seen.add(p[0]);
      if(seen.size>=3&&!L.$('#x22ok')){L.$('#x22e').insertAdjacentHTML('beforeend','<span id="x22ok"></span>');L.sheet('info','Every break has a predictable symptom','Each missing or overdone ingredient shows up as the same kind of comment every time. That’s why the five ingredients are a checklist: a pitch with all five, at the right level of detail, leaves readers nothing to trip on but real questions.');L.done();}};
    L.$('#x22c').appendChild(b);});}},
{part:3,src:'Chapter 6 · Write the Pitch',pts:1,
 solve:async L=>{const pick={P:0,A:0,S:1,R:1,N:1};Object.keys(pick).forEach(k=>L.$('#c23s [data-k="'+k+'"]').children[pick[k]].click());L.$('#c23go').click();await wpWait(L,()=>L.$('#c23 .wp-doc').dataset.posted==='1'&&!!L.$('#c23done'));},
 run(L){
  L.h(L.kick('pr','Challenge · assemble the pitch')+'<h1 class="q">Pick one version of each ingredient. Post a pitch that leaves no gaps and stays within 20 lines.</h1>'+
   '<p class="small" style="margin:-8px 0 8px">The 20-line limit is illustrative: readers have limited time to read ahead.</p><div id="c23s"></div><div class="wp-row"><button class="btn pri" id="c23go" disabled>'+L.ic('chat')+'Post for reading</button></div><div id="c23"></div>');
  const S={P:[['story','Marisol’s story'],['stat','“38 tickets asked” (illustrative)']],A:[['six','“Six weeks, no more”'],['est','“Bea guesses 4–9 weeks” (illustrative)']],
    S:[['wire','Wireframes of all screens'],['shaped','Breadboard + one sketch']],R:[['all','30 edge-case bullets'],['patched','Three patches']],N:[['tbd','“To be decided”'],['listed','Three no-gos']]};
  const api=wpPage(L.$('#c23'),{st:{P:null,A:null,S:null,R:null,N:null},hint:'Pick all five, then post.'});let first=true;
  L.$('#c23s').innerHTML=WP_ORDER.map(k=>'<div class="wp-slot"><span>'+WP_SEC[k][0]+'</span><div data-k="'+k+'" role="group" aria-label="'+WP_SEC[k][0]+'">'+S[k].map(o=>'<button class="chip" data-v="'+o[0]+'">'+o[1]+'</button>').join('')+'</div></div>').join('');
  L.$$('#c23s [data-k]').forEach(g=>[...g.children].forEach(b=>b.onclick=()=>{if(api.busy)return;[...g.children].forEach(c=>c.classList.toggle('sel',c===b));api.set(g.dataset.k,b.dataset.v);
    L.$('#c23go').disabled=WP_ORDER.some(k=>!api.st[k]);}));
  L.$('#c23go').onclick=async()=>{if(api.busy||WP_ORDER.some(k=>!api.st[k]))return;L.$('#c23go').disabled=true;await api.post();if(!L.card.isConnected)return;L.$('#c23go').disabled=false;
    const g=wpGaps(api.pins()),n=api.lines(),ok=!g&&n<=20;
    if(first){L.award(ok);first=false;}
    api.ft.insertAdjacentHTML('afterbegin','<p class="wp-ro"><b style="color:var(--'+(ok?'ok':'no')+')">'+g+' gaps · '+n+' of 20 lines</b></p>');
    if(ok)L.sheet('ok','Ready for the betting table','One specific story, a six-week limit, a breadboard with one sketch where it was needed, three patches and three no-gos. Readers have nothing left to trip on, Tomás adds a fact, and Noor’s +1 waits for the table.');
    else L.sheet('no','Not ready yet',g?'Look at the red pins in the margin: each one marks an ingredient a reader couldn’t use. Swap that version and post again.':'No gaps, but '+n+' lines is too long to read ahead. Rabbit holes and no-gos usually take just a few lines, and the solution doesn’t need every screen.');
    if(!L.$('#c23done'))L.$('#c23').insertAdjacentHTML('beforeend','<span id="c23done"></span>');L.done();};}},
{part:3,src:'Chapter 6 · Ready to present',pts:1,run(L){
  L.h(L.kick('try','Before the table')+'<h1 class="q">Noor wants Ifeoma to present every pitch live in a one-hour meeting before the betting table. What’s the book’s default?</h1>');
  L.mc(L.card,['Present live, so nobody has to read','Email Noor alone, then let Noor decide','Post it to read ahead; go live only if needed'],2,
   'Reading ahead keeps everyone’s time in their own hands and keeps the betting table short. A quick live sell is the fallback.',
   'The book defaults to posting the pitch where everyone at the table can read it on their own time, with a live sell only when needed.');}}
  ]
});
</script>
