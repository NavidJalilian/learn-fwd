<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Write the Pitch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0006', title:'Write the pitch', minutes:19, icon:'pencil',
  goals:['Name the five ingredients of a pitch and spot a missing one','Write the problem as one specific story and state the appetite','Show the solution at the right level of detail and share it for reading ahead'],
  parts:['Ingredients','Problem','Show it','Present it'],
  read:'Read chapter 6 of the book to see the two real example pitches and their sketches.',
  glossary:{
    'no-go':'No-go: something the pitch says on purpose it won’t include, a feature or use case left out to fit the appetite.',
    'small-batch':'Small batch: a project one designer and one or two programmers can build in one or two weeks. Several are grouped into one cycle.',
    async:'Asynchronous: people read and reply on their own time, instead of all meeting at once.',
    linchpin:'Linchpin: the one part of a design that everything else depends on, the part people must see to “get” the idea.'
  },
  cheatsheet:[
    'A pitch has five ingredients: <b>problem, appetite, solution, rabbit holes, no-gos</b>.',
    'Always pair a problem with a solution. A solution alone has no test of fitness; a problem alone is unshaped work.',
    'The best problem is <b>one specific story</b> showing why today’s way doesn’t work.',
    'State the <b>appetite</b>: it ends “wouldn’t it be better if…” debates and makes everyone a partner in keeping it simple.',
    'Show the solution a little more concretely than your notes, but no wireframes or polished mockups.',
    'Use <b>embedded sketches</b> for the linchpin part and <b>labeled fat marker sketches</b> for visual ideas.',
    'Rabbit holes and no-gos often take just a few lines of text.',
    'Post the pitch for people to read ahead. Comments poke holes or add facts; the yes or no happens at the betting table.'
  ],
  steps:[
/* ---------- PART 1: INGREDIENTS ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Noor finds a note: “Add a waitlist button to full classes.” Nothing else. Can Noor tell if it’s worth six weeks of a team’s time?</h1>');
  L.mc(L.card,['Yes, the idea is clear enough','No, it doesn’t say what it fixes'],1,
   'Without the problem or a time limit, there’s nothing to judge it against. This lesson shows what a write-up needs so people can decide.',
   'The idea sounds clear, but Noor can’t tell what problem it solves or how big it should be. A good write-up gives Noor both.');}},
{part:0,src:'Chapter 6 · Write the Pitch',run(L){
  L.h(L.kick('learn','The pitch')+'<h1 class="q">Get the idea out of your head and into a form others can judge</h1>'+
   L.prose('After the last step, the waitlist is de-risked, but it lives in Ifeoma’s head and on a messy whiteboard. Now Ifeoma writes a '+L.g('pitch','pitch')+'. It’s basically a presentation of a good possible bet, so the people who choose projects can decide with full information.')+
   L.list([['Problem','The raw idea, a use case, or something you saw that makes this worth doing.'],
           ['Appetite','How much time you want to spend, and how that limits the solution.'],
           ['Solution','The core elements, shown so people understand them right away.'],
           ['Rabbit holes','Details of the solution worth calling out to avoid trouble.'],
           ['No-gos','Anything left out on purpose to fit the appetite or keep the problem solvable.']],1));
  L.done();}},
{part:0,src:'Chapter 6 · Write the Pitch',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Ifeoma writes: “No text messages. Email and in-app only.” Which ingredient is that?</h1>');
  L.mc(L.card,['Rabbit holes','Appetite','No-gos'],2,
   'It’s a feature left out on purpose to fit the time: a '+L.g('no-go','no-go')+'.',
   'Leaving out a feature on purpose is a no-go. Rabbit holes are details about what you <i>are</i> building; appetite is the time.');}},
{part:0,src:'Chapter 6 · Write the Pitch',pts:5,run(L){
  L.h(L.kick('pr','Sort the draft')+'<h1 class="q">Here are lines from Ifeoma’s waitlist pitch. Put each under its ingredient.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Problem','Appetite','Solution','Rabbit holes','No-gos'],[
   ['When someone cancels, Marisol texts members one by one, and the spot often stays empty.',0,'A specific story of what goes wrong today.'],
   ['This is worth six weeks to us, not more.',1,'The time we’re willing to spend.'],
   ['A Join waitlist button on full classes, a list for the studio, and a “spot opened” message.',2,'The core elements of the solution.'],
   ['If two members tap “Book” at once, the first tap wins.',3,'A detail spelled out so the team doesn’t fall into a hole.'],
   ['No waitlists for one-to-one personal training.',4,'A use case left out on purpose.']],
   'Five ingredients, each doing its own job. Together they let the betting table judge the bet.');}},

/* ---------- PART 2: PROBLEM ---------- */
{part:1,src:'Chapter 6 · Ingredient 1. Problem',run(L){
  L.h(L.kick('learn','Ingredient 1: problem')+'<h1 class="q">Never pitch a solution on its own</h1>'+
   L.prose('It sounds obvious, yet teams often jump straight to what to build, as if the reason were clear. The book gives two reasons to always include the problem:')+
   L.lanes([['scale','A test of fitness','Without a problem, there’s no way to say one solution is better than another. “Add tabs to the iPad app” can turn into an endless debate about screens.',2],
            ['people','A talk about demand','A perfect solution might only help customers who are a poor fit and tend to leave. Seeing the problem lets you ask: is this the right people?',3]])+
   L.prose('The best problem is <b>one specific story</b> that shows why today’s way doesn’t work. It becomes the baseline: does the story end better with the new solution swapped in?'));
  L.done();}},
{part:1,src:'Chapter 6 · Ingredient 1. Problem',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">Ifeoma writes the waitlist problem as a story</h1>');
  L.beats(L.card,[
   ['First draft','“Studios want a waitlist.” True, but there’s nothing to test a solution against.'],
   ['The story','Marisol’s 6 p.m. class at Ember Yoga is always full. Members email Marisol asking for spots. When someone cancels, Marisol texts people one by one, and the spot often stays empty.'],
   ['Swap in the solution','Replay it with the waitlist: Ana cancels, Pinecone messages the people waiting, Jonah books. Marisol texts nobody. The story ends better.'],
   ['Test a rival idea','Noor suggests a bigger “studio dashboard.” Replay the story: Marisol still texts members one by one. It doesn’t fix this problem.']],
   'One concrete story gives everyone the same yardstick for any solution, including rival ones.');}},
{part:1,src:'Chapter 6 · Ingredient 1. Problem',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Which is the strongest problem section for a pitch about the class-cancelled email?</h1>');
  L.mc(L.card,['Members say our emails could be much clearer.','Last week a member drove to Ironleaf for a cancelled class. The email hid it below an ad.','Studios want a better class-cancelled email soon.'],1,
   'One specific story of today’s way failing. Any new email can be tested against it.',
   'The other two are general wishes. A single specific story shows what goes wrong and gives a solution something to beat.');}},
{part:1,src:'Chapter 6 · Ingredient 2. Appetite',run(L){
  L.h(L.kick('learn','Ingredient 2: appetite')+'<h1 class="q">The appetite is part of the problem</h1>'+
   L.prose('The pitch doesn’t just say “solve this.” It says “solve this <b>in six weeks</b>, not three months,” or, for a '+L.g('small-batch','small batch')+', “in two weeks, not six.”')+
   L.prose('There is always a better solution. Stating the '+L.g('appetite','appetite')+' changes the question: if this is only worth two weeks right now, what does the solution look like?')+
   L.note('Anybody can suggest an expensive, complicated answer. It takes design insight to find a simple one that fits a small time box. The appetite turns every reader into a partner in that search.','bulb'));
  L.done();}},
{part:1,src:'Chapter 6 · Ingredient 2. Appetite',pts:1,
 solve:async L=>{const g=L.$('#vg').children;g[0].click();g[1].click();},
 run(L){
  const C=[['Noor','Can’t we also add SMS?'],['Tomás','What about a priority line for members with memberships?'],['Noor','And waitlists for workshops too?']],
   R=[['Sure, add it to the list.','Not in six weeks. Email and in-app are enough for Marisol’s story.'],['Good idea, let’s plan it.','That’s a new rule system. It doesn’t fit the six weeks.'],['Why not, it’s similar.','Out of scope for six weeks. Regular classes only.']];const seen=new Set();
  L.h(L.kick('pr','Toggle and compare')+'<h1 class="q">The same waitlist pitch, read two ways. Pick a version and watch the comments. Try both.</h1><div id="vg"></div>'+
   '<div style="background:var(--soft);border-radius:16px;padding:14px;margin:8px 0 6px;min-height:150px"><div class="small" id="vc" style="margin-bottom:8px">Choose a version above.</div><div id="vt"></div></div><div id="vq"></div>');
  ['No appetite stated','“Appetite: six weeks”'].forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=n;b.onclick=()=>{[...L.$('#vg').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(j);
    L.$('#vt').innerHTML=C.map((c,k)=>'<div style="margin:0 0 10px"><b>'+c[0]+':</b> '+c[1]+'<div class="small" style="margin-top:2px;color:'+(j?'var(--ok)':'var(--no)')+'">Ifeoma: '+R[k][j]+'</div></div>').join('');
    L.$('#vc').innerHTML=j?'Each idea is weighed against a fixed amount of time.':'Every good idea gets added. The project keeps growing.';
    if(seen.size===2&&!L.$('#vq').innerHTML){const q=L.$('#vq');q.innerHTML='<h2 class="sub">What did stating the appetite change?</h2>';
      L.mc(q,['It gave a reason to turn down good-but-costly ideas','It made the team promise to finish on time'],0,
       'With no limit, every better idea sounds reasonable. With six weeks on the page, each one has to fit.',
       'The appetite isn’t a promise from the team. It’s a constraint in the pitch that lets everyone judge whether an idea fits.');}};L.$('#vg').appendChild(b);});}},
{part:1,src:'Chapter 6 · Ingredient 3. Solution',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Ready to pitch?',['Solution, no problem','Problem, no solution','Ready to pitch'],[
   ['“Add a dark mode to the schedule screen.”',0,'It says what to build, but not what goes wrong today.'],
   ['“Owners say studio reports are confusing. Let’s fix them.”',1,'A real complaint with no shaped answer. That’s unshaped work.'],
   ['Marisol’s story, six weeks, the waitlist elements, its patches and no-gos.',2,'Problem, appetite and solution come together.'],
   ['“Let’s add a calendar sync button.”',0,'A solution looking for a reason. Nothing to test it against.'],
   ['“Members can’t find classes on the app. We need to sort that out.”',1,'Handing this to a team pushes research down to the wrong level.']]);}},

/* ---------- PART 3: SHOW IT ---------- */
{part:2,src:'Chapter 6 · Ingredient 3. Solution · Help them see it',run(L){
  L.h(L.kick('learn','Ingredient 3: solution')+'<h1 class="q">Help readers see it, without designing it for them</h1>'+
   L.prose('A problem with no solution isn’t ready either. It’s unshaped, and handing it to a team pushes the exploring to the wrong people, with the wrong time limit and a long tail of risk.')+
   L.prose('So the pitch shows the solution. Readers had no part in shaping it, so it needs to be a little more concrete than Ifeoma’s private notes:')+
   L.lanes([['x','Too much','Wireframes or polished mockups box in the designers and drag the talk into color and layout.',4],
            ['x','Too little','A raw breadboard has a “you had to be there” feel. To outsiders it looks like a jumble of words and arrows.',3]]));
  L.done();}},
{part:2,src:'Chapter 6 · Embedded sketches · Annotated fat marker sketches',run(L){
  L.h(L.kick('ex','The book’s examples')+'<h1 class="q">Two ways to help people see it</h1>');
  L.beats(L.card,[
   ['The breadboard','A shaping-session breadboard adds new affordances to a product’s Dashboard. Readers can’t picture where they go.'],
   ['One step clearer','Sketch a new box on the Dashboard. Better, but people still have to imagine too much.'],
   ['Embedded sketch','Go one step down into '+L.g('fat-marker','fat marker')+' detail for just that box. Now people can see it. The cost: some layout choices, so the pitch adds a note that designers may find a different design.'],
   ['Only where needed','This was the '+L.g('linchpin','linchpin')+' everyone had to see to get the idea. Other parts of the pitch need no such detail.'],
   ['Labeled fat marker sketch','For ideas that are visual by nature, a fat marker sketch works in a pitch if labeled cleanly: redraw it with a thick brush, use another color for labels, and add call-outs to discuss parts.']],
   'Add visual detail selectively, only where people need it to “get” the concept.');}},
{part:2,src:'Chapter 6 · Help them see it',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Noor reads Ifeoma’s breadboard and can’t picture where “3 waiting” shows on the class card. What should Ifeoma add?</h1>');
  L.mc(L.card,['A pixel-perfect mockup of the class card','A fat marker sketch of the card, with a note for Kenji','Nothing, Noor should study the breadboard'],1,
   'The class card is the linchpin, so add fat marker detail there only, and remind Kenji they may design it differently.',
   'A polished mockup would box Kenji in, and a bare breadboard leaves Noor lost. A labeled fat marker sketch with a disclaimer hits the middle.');}},
{part:2,src:'Chapter 6 · Help them see it',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Right level of detail for a pitch?',['Too vague','Right level','Too detailed'],[
   ['A finished, colored mockup of the waitlist screen in the app’s real fonts.',2,'It boxes Kenji in and invites talk about color and layout.'],
   ['A photo of the raw whiteboard breadboard, with no labels.',0,'People who weren’t there will see a jumble of words and arrows.'],
   ['A thick-brush sketch of the class card, with labels in a second color.',1,'Concrete enough to “get”, rough enough to leave room.'],
   ['“There’ll be some kind of waitlist. Details to come.”',0,'Readers can’t judge what they can’t see.'],
   ['A clean breadboard of the member flow, plus one embedded sketch of the class card.',1,'Schematic where that’s enough, visual only where it’s needed.']]);}},
{part:2,src:'Chapter 6 · Ingredient 4. Rabbit holes · Ingredient 5. No Gos',run(L){
  L.h(L.kick('learn','Ingredients 4 and 5')+'<h1 class="q">Rabbit holes and no-gos often take just a few lines</h1>'+
   L.tiers([['alert','Rabbit holes','Spell out a specific answer to a detail that could trip up the team. It isn’t central to the idea, but naming it patches a hole.','Book’s Payment Form: the form’s web addresses would never use custom domains in the first version.'],
            ['lock','No-gos','Name anything you’re not doing. Some people might prefer it, but it doesn’t fit the appetite.','Book’s Payment Form: no editing the form directly on the page. Just a logo and header text on a separate “customize” page.']])+
   '<p class="small" style="margin-top:10px">This is where the patches and fences from the risk step end up, so nobody down the line trips on them.</p>');
  L.done();}},
{part:2,src:'Chapter 6 · Ingredient 4. Rabbit holes · Ingredient 5. No Gos',pts:5,run(L){
  L.h(L.kick('pr','Rabbit hole or no-go?')+'<h1 class="q">Sort the last lines of Ifeoma’s waitlist pitch.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Rabbit hole','No-go'],[
   ['If two members tap “Book” at once, the first wins; the other sees “Spot taken.”',0,'A tricky detail of the solution, answered up front.'],
   ['No waitlists for workshops, retreats or livestreams.',1,'Use cases left out on purpose.'],
   ['Nobody is charged automatically; the member books and pays the normal way.',0,'It patches a risky part of how the solution works.'],
   ['No text messages, only email and in-app notices.',1,'A feature left out to fit the six weeks.'],
   ['A spot won from the waitlist follows the studio’s usual late-cancel rule.',0,'A hard decision settled, so the team doesn’t stall on it.']],
   'Rabbit holes say how a tricky part <i>will</i> work. No-gos say what <i>won’t</i> be built at all.');}},

/* ---------- PART 4: PRESENT IT ---------- */
{part:3,src:'Chapter 6 · Examples',run(L){
  L.h(L.kick('ex','The book’s examples')+'<h1 class="q">Two real pitches from Basecamp</h1>');
  L.beats(L.card,[
   ['To-do groups: problem','It opens with a workaround people already use in the current design, shown in two screenshots.'],
   ['To-do groups: solution','Fat marker sketches show the main ideas for optional groups. Some sketches exist because of rabbit holes found while shaping.'],
   ['Notifications: problem','A pitch to change how notifications work opens with two videos that show the problem.'],
   ['Notifications: solution','A fat marker sketch and a breadboard describe it. Charts of how people really use the product back up the trade-offs.']],
   'Different media, same recipe: show the problem, show the solution at the right level, explain the trade-offs.');}},
{part:3,src:'Chapter 6 · Ready to present · How we do it in Basecamp',run(L){
  L.h(L.kick('learn','Ready to present')+'<h1 class="q">Post it, let people read, then bet</h1>'+
   L.prose('Basecamp prefers '+L.g('async','asynchronous')+' communication, and meets live only when it must. That gives everyone the most time under their own control.')+
   L.flow([['pencil','Post','The full pitch goes where the people at the betting table can read it.','',1],['chat','Comment','Readers poke holes or add missing facts. No voting.','',2],['scale','Decide','Yes or no happens at the betting table.','',3]])+
   L.prose('If everyone reads ahead, the '+L.g('betting-table','betting table')+' stays short and useful. If not, the pitch is ready for a quick live sell. At Basecamp, pitches are posted as messages in one place, and the CTO may reply with technical thoughts.'));
  L.done();}},
{part:3,src:'Chapter 6 · How we do it in Basecamp',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Ifeoma posts the waitlist pitch. What are comments on it for?</h1>');
  L.mc(L.card,['Saying yes or no to the project','Poking holes and adding missing facts'],1,
   'Comments improve the pitch. The decision itself is made at the betting table.',
   'Voting yes or no happens at the betting table. Comments are for finding holes and adding information.');}},
{part:3,src:'Chapter 6 · How we do it in Basecamp',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Comment on the pitch, or save it?',['Good comment','Save for the table'],[
   ['Tomás: “Class-pack credits work the same for waitlist spots, so no new code there.”',0,'Adds a technical fact the pitch was missing.'],
   ['Noor: “Yes from me, let’s do it.”',1,'That’s a vote. The yes or no happens at the betting table.'],
   ['Support: “Ironleaf has two rooms. Does a waitlist work per room?”',0,'Pokes a hole worth checking before the bet.'],
   ['Noor: “I’d rather spend the cycle on gift cards.”',1,'Choosing between bets is the betting table’s job.'],
   ['Tomás: “Usage data shows most cancellations happen 1–3 hours before class.”',0,'Data that supports or challenges the trade-offs.']]);}},
{part:3,src:'Chapter 6 · Write the Pitch',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Tap each piece until the sentence describes a pitch ready for the betting table.</h1>');
  L.sentence(L.card,[['“Studios want waitlists”','Marisol’s 6 p.m. class story'],['with a six-week appetite','with no time limit yet'],['a mockup of every screen','a breadboard and a labeled sketch'],['plus its rabbit holes and no-gos','with the tricky parts left to the team']],[1,0,1,0],
   [['A general wish gives no test of fitness. Use one specific story.'],['Without an appetite, every better idea sounds reasonable.'],['Polished mockups box in the designer and side-track the talk.'],['Leaving tricky parts open pushes rabbit holes onto the team.']],
   'Problem, appetite, solution, rabbit holes, no-gos. All five, at the right level of detail.');}},
{part:3,src:'Chapter 6 · Ready to present',pts:1,run(L){
  L.h(L.kick('pr','Before the table')+'<h1 class="q">Noor wants Ifeoma to present every pitch live in a one-hour meeting before the betting table. What’s the book’s default?</h1>');
  L.mc(L.card,['Present live, so nobody has to read','Post it to read ahead; go live only if needed','Email Noor alone, then let Noor decide'],1,
   'Reading ahead keeps everyone’s time in their own hands and keeps the betting table short. A quick live sell is the fallback.',
   'The book defaults to posting the pitch where everyone at the table can read it on their own time, with a live sell only when needed.');}}
  ]
});
</script>
</body>
</html>
