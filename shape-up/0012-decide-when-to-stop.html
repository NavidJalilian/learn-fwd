const S12_HAMMER='<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M5 20l8.5-8.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><rect x="10" y="3.5" width="11" height="6.5" rx="1.6" transform="rotate(45 15.5 6.75)" fill="currentColor"/></svg>';

/* ---------- 1. The baseline ruler ---------- */
const RW=[['Nicer email layout',3],['Smoother animation',2],['“You’re #3” counter',3],['Logo in the email',1],['Text alerts',4],['Auto card charging',5]];
const RGRASS=['Waitlist across two rooms at once','Email in each member’s language','Studios reorder the waiting list'];
const R_MUST=6,R_LEFT=10;
const rY=v=>218-v*196;
function ruler(host,o){o=o||{};
  const st={ref:o.ref||'ideal',wish:new Set(),broken:false,grass:false};
  let cur=null,raf=0;
  host.insertAdjacentHTML('beforeend','<div class="s12-rl">'+
   '<div class="s12-seg" role="group" aria-label="Measure from"><span>Measure from</span><button class="chip" data-r="ideal">The ideal</button><button class="chip" data-r="base">Today’s baseline</button></div>'+
   '<svg class="s12-svg" viewBox="0 0 320 238" role="img" aria-label="A ruler with three marks: the ideal at the top, the waitlist as built in the middle, and today’s baseline at the bottom">'+
    '<text x="6" y="12" font-size="11" fill="var(--muted)">↑ better for Marisol</text>'+
    '<line x1="22" y1="18" x2="22" y2="232" stroke="var(--line2)" stroke-width="2"/>'+

    '<g class="mi"><line x1="14" x2="310" y1="0" y2="0" stroke="var(--h4)" stroke-width="2" stroke-dasharray="6 5"/><text class="t" x="34" y="-7" font-size="12.5" font-weight="700" fill="var(--h4)"></text></g>'+
    '<g class="mb"><line x1="14" x2="310" y1="0" y2="0" stroke="var(--h3)" stroke-width="2" stroke-dasharray="6 5"/><text x="34" y="-7" font-size="12.5" font-weight="700" fill="var(--h3)">Today: Marisol texts members</text><text class="sub" x="34" y="15" font-size="11.5" fill="var(--muted)">one by one; spots often stay empty</text></g>'+
    '<g class="mw"><line class="ln" x1="14" x2="310" y1="0" y2="0" stroke-width="4" stroke-linecap="round"/><circle class="dt" cx="22" cy="0" r="6"/><text class="t" x="34" y="-8" font-size="12.5" font-weight="700"></text></g>'+
    '<g class="ar"><line class="sh" x1="296" x2="296" stroke-width="2.5"/><path class="hd" d=""/></g>'+
   '</svg>'+
   '<p class="s12-meas" aria-live="polite"></p>'+
   '<p class="s12-say"></p>'+
   '<div class="s12-days"><div class="s12-dh"><span>Week 5</span><span>Week 6 ends · circuit breaker</span></div><div class="s12-cells"></div><div class="s12-dr"></div></div>'+
   (o.wishes?'<div class="s12-lbl">Wishes from Kenji, Bea and Noor (tap to build one)</div><div class="s12-wish"></div>':'')+

    b.onclick=()=>{if(api.lock)return;st.wish.has(j)?st.wish.delete(j):st.wish.add(j);draw();if(o.change)o.change('wish');};box.appendChild(b);});}
  el.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{if(api.lock)return;st.ref=b.dataset.r;draw();if(o.change)o.change('ref');});
  function paint(vw){
    const yi=rY(0.95),yb=rY(0.16),yw=rY(vw);

    svg.querySelector('.mw').setAttribute('transform','translate(0 '+yw+')');

  function tween(){cancelAnimationFrame(raf);const to=target();if(cur===null){cur=to;paint(cur);return;}

    if(over>0)say.innerHTML='<b>Out of time.</b> The wishes don’t fit before week 6 ends. The circuit breaker stops the project: nothing ships, and Marisol keeps texting.';
    else if(st.broken)say.innerHTML='<b>Bea:</b> “We skipped the tests on first-tap-wins to save a day.” Now two members can get the same spot.';
    else if(st.ref==='ideal')say.innerHTML='<b>Kenji:</b> “It’s still '+miss+' things short. It isn’t good enough yet. I need another week.”';

  }
  const api={st,el,draw,lock:false,
    setLock(v,why){api.lock=v;el.querySelectorAll('[data-r],[data-w]').forEach(b=>b.disabled=v);
      el.querySelector('.s12-seg>span').innerHTML='Measure from'+(v?' <span class="lk">· '+(why||'locked while it plays')+'</span>':'');},
    set(p){Object.assign(st,p);if(p.wish)st.wish=new Set(p.wish);draw();},over:()=>R_MUST+wishCost()>R_LEFT};
  draw();return api;}

/* o: {mode:'hammer'|'tap'|'qa', left, change()} ; state per peg: u standing, k knocked (~), c must-have */
function board(host,pegs,o){
  const S=pegs.map(()=>o.mode==='qa'?'k':'u');let sel=-1;
  const top=(o.left?'<div class="s12-days"><div class="s12-dh"><span>Work still standing · days are illustrative</span><span>'+o.left+' days left</span></div><div class="s12-cells"></div><div class="s12-dr"></div></div>':'')+
   (o.mode==='hammer'?'<div class="s12-hams"></div><div class="s12-ans" aria-live="polite"><span class="q">Pick a peg below first.</span></div>':'');
  host.insertAdjacentHTML('beforeend','<div class="s12-hb">'+(top?'<div class="s12-stk">'+top+'</div>':'')+'<div class="s12-board"></div></div>');
  const el=host.lastElementChild,bd=el.querySelector('.s12-board');
  pegs.forEach((p,j)=>{const b=document.createElement('button');b.className='s12-peg';b.dataset.i=j;
    b.innerHTML='<span class="s12-pb"><i></i></span><span class="s12-pt"><span class="tl">~</span>'+p[0]+'<small>'+p[1]+(o.nodays?'':' · '+p[2]+' day'+(p[2]>1?'s':''))+'</small></span><span class="s12-tag"></span>';
    b.onclick=()=>api.tap(j);bd.appendChild(b);});
  if(o.mode==='hammer'){const hb=el.querySelector('.s12-hams');HQ.forEach((h,k)=>{const b=document.createElement('button');b.className='s12-ham';b.dataset.h=k;b.disabled=true;
    b.innerHTML=S12_HAMMER+'<span>'+h[0]+'</span>';b.onclick=()=>api.strike(k);hb.appendChild(b);});}
  function draw(){
    [...bd.children].forEach((b,j)=>{b.className='s12-peg'+(S[j]==='k'?' k':S[j]==='c'?' c':'')+(j===sel?' sel':'');
      b.querySelector('.s12-tag').textContent=S[j]==='c'?'must-have':S[j]==='k'?'nice-to-have':'';
      b.setAttribute('aria-label',pegs[j][0]+(S[j]==='k'?', marked nice-to-have':S[j]==='c'?', must-have':', standing'));});
    if(o.left){const used=pegs.reduce((a,p,j)=>a+(S[j]==='k'?0:p[2]),0),n=Math.max(used,o.left);let c='';
      for(let j=0;j<n;j++)c+='<i class="'+(j<used?(j>=o.left?'o':'m'):'')+'"></i>';
      el.querySelector('.s12-cells').innerHTML=c;
      el.querySelector('.s12-dr').innerHTML='<b>'+used+'</b> days of work still standing, <b>'+o.left+'</b> days left. '+(used>o.left?'<b style="color:var(--no)">Doesn’t fit: over by '+(used-o.left)+'.</b>':'<b style="color:var(--ok)">Fits.</b>');}
    if(o.mode==='hammer')el.querySelectorAll('.s12-ham').forEach(b=>b.disabled=sel<0);}
  const api={S,el,draw,
    used:()=>pegs.reduce((a,p,j)=>a+(S[j]==='k'?0:p[2]),0),
    tap(j){if(api.lock)return;
      if(o.mode==='hammer'){sel=j;draw();const a=el.querySelector('.s12-ans');a.innerHTML='<span class="q">Now strike “'+pegs[j][0]+'” with a question.</span>';return;}
      if(o.mode==='qa')S[j]=S[j]==='k'?'c':'k';else S[j]=S[j]==='k'?'u':'k';
      draw();const b=bd.children[j];b.classList.remove('hit');void b.offsetWidth;b.classList.add('hit');if(o.change)o.change(j);},
    strike(k){if(api.lock||sel<0)return;const j=sel,ans=pegs[j][4][k],v=ans[1];
      const b=bd.children[j];b.classList.remove('hit');void b.offsetWidth;b.classList.add('hit');
      if(v!=='n')S[j]=v;draw();
      el.querySelector('.s12-ans').innerHTML='<span class="q">'+HQ[k][1]+'</span>'+ans[0]+'<span class="v '+v+'">'+(v==='k'?'→ ~ nice-to-have':v==='c'?'→ must-have':'not settled')+'</span>';
      if(o.change)o.change(j,v);}};
  draw();return api;}

/* ---------- 3. The two-lamp extend check ---------- */
const XC=[['must','Everything left is a true must-have','It survived every attempt to hammer it away'],['down','Everything left is downhill','No unsolved problems, no open questions']];
function xVerdict(m,d,h){
  if(!d)return ['no','stop','Stop. Let the circuit breaker do its job.','Uphill work at the end points to a hole in the shaping. Unknowns are too risky to bet more time on. Build something else next cycle and send this back to shaping. If shaping finds a way to patch the hole, it can be bet on again later.'];
  if(!m)return ['no','hammer','Don’t extend. Hammer first.','Anything that isn’t a true must-have gets a ~ and doesn’t earn extra time. Ship once the must-haves are done.'];
  if(h)return ['warn','habit','Allowed on paper, but it keeps happening.','Running into cool-down again and again points to a problem in the shaping, or a problem with how the team works. Fix that.'];
  return ['ok','rare','The rare case: extending is allowed.','A couple of weeks at most. Even so, the book prefers to hold the appetite: the two-week cool-down usually gives enough slack to finish a few leftover must-haves.'];}

  else if(kind==='hammer'){
    [120,148,176].forEach(x=>{s+='<rect x="'+(x-12)+'" y="18" width="24" height="18" rx="4" fill="var(--card)" stroke="var(--line2)" stroke-width="1.5" stroke-dasharray="3 3"/><text x="'+x+'" y="31" text-anchor="middle" font-size="13" font-weight="700" fill="var(--h4)">~</text>';});
    s+='<text x="6" y="28" font-size="11.5" font-weight="700" fill="var(--h4)">extras marked ~</text>'+

  else if(kind==='stop'){

function xcheck(host,o){o=o||{};const st={must:o.must!==undefined?o.must:null,down:o.down!==undefined?o.down:null,habit:false};
  host.insertAdjacentHTML('beforeend','<div class="s12-x">'+XC.map(c=>'<button class="s12-lamp" data-c="'+c[0]+'"'+(o.toggle?'':' disabled')+'><span class="bulb"></span><span class="lt">'+c[1]+'<small>'+c[2]+'</small></span><span class="yn"></span></button>').join('')+
   (o.habit?'<button class="s12-lamp" data-c="habit"><span class="bulb"></span><span class="lt">This happens most cycles<small>The team keeps running into cool-down</small></span><span class="yn"></span></button>':'')+
   '<div class="s12-verd" aria-live="polite"></div></div>');
  const el=host.lastElementChild;

      b.className='s12-lamp'+(v===true?' on':v===false?' off':'');b.querySelector('.yn').textContent=v===true?'Yes':v===false?'No':'?';});

    if(st.must===null||st.down===null){vd.className='s12-verd';vd.innerHTML='<span class="small">Tap each condition to set it.</span>';api.kind=null;return;}

  const api={st,el,draw,kind:null,set(p){Object.assign(st,p);draw();}};
  draw();return api;}

        L.sheet(ok?'ok':'no',ok?'Ship it':'It already beats today','Today members only hear about an open spot if Marisol texts them. Without the counter, the waitlist already beats that by a mile. The counter lifts it a little and eats 3 of the 4 spare days. It goes on the list as a ~ nice-to-have.');L.done();r.setLock(false);},600);},700);};}},

{part:0,src:'Chapter 14 · Limits motivate trade-offs · Scope grows like grass · Cutting scope isn’t lowering quality',
 solve:async L=>{for(const k of [0,1,2]){L.$('#ep [data-p="'+k+'"]').click();await L.sleep(20);}},
 run(L){
  L.h(L.kick('ex','Edge cases')+'<h1 class="q">Push the ruler to its limits. Try all three.</h1>'+
   '<div id="ep" class="s12-btns"></div><div id="er"></div><div id="ef"></div>');
  const r=ruler(L.$('#er'),{ref:'base'});r.setLock(true,'unlocks after all three');let run=0;const tried=new Set();
  const P=[['Measure from the ideal, build every wish',()=>{const id=++run;r.set({ref:'ideal',broken:false,grass:false,wish:[]});let j=0;
      const add=()=>{if(id!==run||!r.el.isConnected)return;if(j<RW.length&&!r.over()){r.set({wish:[...r.st.wish,j]});j++;setTimeout(add,320);}};setTimeout(add,250);},
     'Each wish lifts the build a little, but the days run out long before the ideal. With six weeks fixed, the circuit breaker stops the project and Marisol keeps texting. Aim at the ideal and you never arrive. So before any “wouldn’t it be better if…”, the team asks: <b>is there time for this?</b>'],

     'Building shows three new things that could be better: a waitlist across two rooms at once, emails in each member’s language, studios reordering the list. Nobody did anything wrong. You can’t see the small details until you’re in the work. The ideal ran further away, but the step up from today didn’t change. Switch the ruler to the baseline to check.'],

     'Bea skips the tests on first-tap-wins to save a day. Now two members can win the same spot. Cutting scope leaves parts out. Cutting quality breaks the part you ship. The book stays picky about the code, design, copy and speed of what ships.']];

{part:0,src:'Chapter 14 · Limits motivate trade-offs · Scope grows like grass · Cutting scope isn’t lowering quality',run(L){
  /* picture 1: a new idea arrives before the breaker wall */

  p1+='<rect x="252" y="30" width="6" height="52" rx="2" fill="var(--no-strong)"/><text x="264" y="48" font-size="11" font-weight="700" fill="var(--no)">circuit</text><text x="264" y="61" font-size="11" font-weight="700" fill="var(--no)">breaker</text>'+
   '<rect x="70" y="4" width="176" height="24" rx="8" fill="var(--card)" stroke="var(--h4)" stroke-width="1.5" stroke-dasharray="4 3"/><text x="158" y="20" text-anchor="middle" font-size="11.5" fill="var(--h4)">“Wouldn’t it be better if…”</text>'+
   '<line x1="186" y1="29" x2="186" y2="43" stroke="var(--h4)" stroke-width="2"/><path d="M181 41 L186 48 L191 41 Z" fill="var(--h4)"/>'+
   '<text x="264" y="16" font-size="12" font-weight="700" fill="var(--ink)">Time</text><text x="264" y="29" font-size="12" font-weight="700" fill="var(--ink)">for it?</text></svg>';
  /* picture 2: scope grows like grass, the team keeps mowing */

    p2+='<path d="M'+(x-3)+' 68 Q'+(x-1)+' '+(68-hh*0.6)+' '+(x+1)+' '+(68-hh)+' Q'+(x+2)+' '+(68-hh*0.5)+' '+(x+4)+' 68 Z" fill="var('+(c?'--line2':'--h2')+')"/>'+(c?'<text x="'+(x+1)+'" y="'+(52)+'" text-anchor="middle" font-size="14" font-weight="700" fill="var(--h4)">~</text>':'');});
  p2+='<line x1="6" x2="314" y1="68" y2="68" stroke="var(--line2)" stroke-width="2"/><text x="8" y="84" font-size="11" fill="var(--muted)">Week 1</text><text x="312" y="84" text-anchor="end" font-size="11" fill="var(--muted)">Week 5</text><text x="160" y="84" text-anchor="middle" font-size="11" fill="var(--muted)">details show up as you work</text></svg>';
  /* picture 3: cut scope vs cut quality */
  const row=(y,lab,col,parts)=>{let s='<text x="6" y="'+(y+17)+'" font-size="12.5" font-weight="700" fill="var('+col+')">'+lab+'</text>';
    parts.forEach((p,j)=>{const x=104+j*38;
      if(p==='e')s+='<rect x="'+x+'" y="'+y+'" width="33" height="24" rx="5" fill="none" stroke="var(--line2)" stroke-width="1.5" stroke-dasharray="4 3"/><text x="'+(x+16.5)+'" y="'+(y+17)+'" text-anchor="middle" font-size="13" font-weight="700" fill="var(--h4)">~</text>';
      else if(p==='s')s+='<rect x="'+x+'" y="'+y+'" width="33" height="24" rx="5" fill="var(--pri)"/>';

  const p3='<svg viewBox="0 0 320 76" role="img" aria-label="Cut scope: three solid parts and two parts left out with a tilde. Cut quality: all five parts present, every one cracked.">'+
   row(4,'Cut scope','--ok',['s','s','s','e','e'])+'<text x="296" y="21" font-size="15" font-weight="700" fill="var(--ok)">✓</text>'+
   row(44,'Cut quality','--no',['c','c','c','c','c'])+'<text x="296" y="61" font-size="15" font-weight="700" fill="var(--no)">✗</text></svg>';

{part:0,src:'Chapter 14 · Cutting scope isn’t lowering quality',pts:5,run(L){
  L.h(L.kick('pr','Cut or cheap?')+'<h1 class="q">Is each choice cutting scope, or lowering quality?</h1><div id="bk"></div>');

/* ---------- PART 2: SCOPE HAMMERING ---------- */
{part:1,src:'Chapter 14 · Scope hammering',run(L){
  const hl=[['Must-have?'],['New or old?'],['How likely,','for whom?'],['Real impact?']];
  /* each hammer swings straight down at the task below it: two hold up, two fall flat */
  const up=[1,0,1,0];
  let s='<svg viewBox="0 0 320 214" role="img" aria-label="Four hammers, each a question: must-have, new or old, how likely and for whom, real impact. Each swings down at one task on the Notify members scope. Two tasks stay standing as must-haves. Two are knocked flat and marked with a tilde as nice-to-haves.">';
  hl.forEach((h,j)=>{const cx=40+j*80;
    s+='<g transform="translate('+(cx-12)+' 6)"><path d="M6 34 L19 21" stroke="var(--muted)" stroke-width="3.5" stroke-linecap="round"/><rect x="12" y="2" width="16" height="10" rx="2.5" transform="rotate(45 20 7)" fill="var(--h2)"/></g>'+
     h.map((t,k)=>'<text x="'+cx+'" y="'+(58+k*14)+'" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--ink)">'+t+'</text>').join('')+
     /* the swing: a dashed arrow from the question down to its task */
     '<line x1="'+cx+'" x2="'+cx+'" y1="'+(h.length>1?80:66)+'" y2="'+(up[j]?104:136)+'" stroke="var(--h2)" stroke-width="2" stroke-dasharray="4 3"/>'+
     '<path d="M'+(cx-5)+' '+(up[j]?103:135)+' L'+cx+' '+(up[j]?111:143)+' L'+(cx+5)+' '+(up[j]?103:135)+' Z" fill="var(--h2)"/>'+
     (up[j]?'<rect x="'+(cx-6)+'" y="116" width="12" height="50" rx="4" fill="var(--ok-strong)"/>'+
       '<text x="'+cx+'" y="190" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--ok)">must-have</text>'
      :'<rect x="'+(cx-25)+'" y="154" width="50" height="12" rx="4" fill="var(--line2)" stroke="var(--muted)" stroke-width="1"/>'+
       '<path d="M'+(cx-30)+' 148 l-6 -4 M'+(cx+30)+' 148 l6 -4" stroke="var(--h4)" stroke-width="2" stroke-linecap="round"/>'+
       '<text x="'+(cx+18)+'" y="148" text-anchor="middle" font-size="16" font-weight="700" fill="var(--h4)">~</text>'+
       '<text x="'+cx+'" y="190" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--h4)">nice-to-have</text>');});
  s+='<rect x="6" y="166" width="308" height="8" rx="3" fill="var(--line2)"/>'+
   '<text x="160" y="208" text-anchor="middle" font-size="11.5" fill="var(--muted)">Scope: Notify members · done once its must-haves are</text></svg>';
  L.h(L.kick('learn','Scope hammering')+'<h1 class="q">A stronger word than “cutting”</h1>'+
   '<div class="s12-pic">'+s+'</div>'+
   '<p class="s12-cap">It takes force to bang scope into the time box: that’s '+L.g('hammering','hammering')+'. Swing the questions at each new task. A '+L.g('must-have','must-have')+' stays up. A '+L.g('nice-to-have','nice-to-have')+' falls with a ~ and usually never gets built. Marking it ~ <i>is</i> the hammering.</p>');
  L.done();}},

{part:1,src:'Chapter 14 · Scope hammering',
 solve:async L=>{for(let j=0;j<NOTIFY.length;j++){L.$('#hb .s12-peg[data-i="'+j+'"]').click();const k=NOTIFY[j][4].findIndex(a=>a[1]!=='n');L.$('#hb .s12-ham[data-h="'+k+'"]').click();await L.sleep(10);}},
 run(L){

   '<p class="small">If the answer says it can go, the peg falls to ~. If it says it can’t, the peg locks in as a must-have. Some questions don’t settle a peg; try another.</p><div id="hb"></div>');

   '<circle cx="76" cy="92" r="70" fill="var(--h4-bg)" stroke="var(--h4)" stroke-width="1.5" stroke-dasharray="5 4"/>'+
   '<circle cx="76" cy="92" r="40" fill="var(--ok-bg)" stroke="var(--ok-strong)" stroke-width="2"/>'+
   '<text x="76" y="86" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ok)">Core</text>'+

   '<text x="76" y="40" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--h4)">Edges: QA</text>';

  /* right: QA list -> scope list */
  s+='<text x="168" y="16" font-size="11.5" font-weight="700" fill="var(--muted)">QA finds (all ~)</text>';

    s+='<rect x="166" y="'+y+'" width="150" height="21" rx="6" fill="var(--card)" stroke="var('+(j===0?'--pri':'--line2')+')" stroke-width="'+(j===0?2:1.2)+'"'+(j===0?'':' stroke-dasharray="4 3"')+'/><text x="173" y="'+(y+14.5)+'" font-size="11" fill="var('+(j===0?'--ink':'--muted')+')">'+t+'</text>';});
  s+='<path d="M240 104 L240 128" stroke="var(--pri)" stroke-width="2.5"/><path d="M234 124 L240 133 L246 124 Z" fill="var(--pri)"/>'+
   '<text x="248" y="122" font-size="11" fill="var(--pri-deep)" font-weight="700">triage</text>'+
   '<text x="168" y="150" font-size="11.5" font-weight="700" fill="var(--ok)">Scope: Join the waitlist</text>'+
   '<rect x="166" y="157" width="150" height="21" rx="6" fill="var(--ok-bg)" stroke="var(--ok-strong)" stroke-width="1.5"/><text x="173" y="171.5" font-size="11" fill="var(--ink)">joined, then class deleted</text>'+
   '<text x="160" y="206" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--pri-deep)">A level-up, not a gate</text></svg>';
  L.h(L.kick('learn','QA is for the edges')+'<h1 class="q">The team owns quality. QA hunts edge cases.</h1>'+
   '<div class="s12-pic">'+s+'</div>'+
   '<p class="s12-cap">One '+L.g('qa','QA')+' person hunts edge cases near the cycle’s end; the team owns basic quality. Findings go on a separate list, all ~. The team drags only must-haves onto the scope’s list. QA came once edge cases hit hundreds or thousands of users. Code review: welcome, not required.</p>');

{part:1,src:'Chapter 14 · QA is for the edges',pts:1,
 solve:async L=>{L.$('#qb .s12-peg[data-i="0"]').click();L.$('#qd').click();},
 run(L){
  L.h(L.kick('pr','Triage')+'<h1 class="q">Tomás hunts edge cases in week 6. The findings land flat, as ~. Raise only what must be fixed before launch.</h1>'+
   '<p class="small">Pinecone has no QA person, so Tomás takes the role for a day. Tap a peg to raise it to a must-have; tap again to lay it back down.</p><div id="qb"></div><button class="btn pri" id="qd" style="margin-top:10px">'+L.ic('check')+'Done triaging</button>');

{part:1,src:'Chapter 14 · Scope hammering',pts:1,
 solve:async L=>{ALL.forEach((p,j)=>{if(!p[3])L.$('#cb .s12-peg[data-i="'+j+'"]').click();});L.$('#cc').click();},
 run(L){
  L.h(L.kick('pr','Challenge')+'<h1 class="q">Start of week 5. Hammer the whole waitlist so the work still standing fits the 10 days left, without cutting the core.</h1>'+
   '<p class="small">Tap a peg to knock it down to ~. Tap again to stand it back up.</p><div id="cb"></div><button class="btn pri" id="cc" style="margin-top:10px">'+L.ic('check')+'Check the scope</button><div id="cf"></div>');
  const b=board(L.$('#cb'),ALL,{mode:'tap',left:10,change(){L.$('#cf').innerHTML='';L.$$('#cb .s12-peg').forEach(x=>x.classList.remove('core-cut'));}});
  let first=true;
  L.$('#cc').onclick=()=>{const cut=ALL.map((p,j)=>p[3]&&b.S[j]==='k'?j:-1).filter(j=>j>=0),fits=b.used()<=10,ok=fits&&!cut.length;
    if(first){first=false;L.award(ok);}
    L.$('#cf').innerHTML='';
    if(ok){ALL.forEach((p,j)=>{if(p[3])b.S[j]='c';});b.draw();b.lock=true;L.$('#cc').remove();
      L.sheet('ok','It fits, and it still works','Every core task still stands, so members can still join, win a spot, hear about it and leave. The ~ pegs stay on the list: build them only if there’s time. Usually they never get built.');L.done();return;}
    cut.forEach(j=>L.$('#cb .s12-peg[data-i="'+j+'"]').classList.add('core-cut'));
    L.fb(L.$('#cf'),cut.length?'<b>That’s the core.</b> Ask “could we ship without it?” of “'+ALL[cut[0]][0]+'”. Without it the waitlist stops doing its job. Stand it back up and cut something else.'
      :'<b>Still over by '+(b.used()-10)+' days.</b> Which pegs could Pinecone ship without? Who would really miss them?','no');};}},

/* ---------- PART 3: EXTEND OR STOP ---------- */
{part:2,src:'Chapter 14 · When to extend a project',
 solve:async L=>{for(const k of [0,1,2,3]){L.$('#xp [data-p="'+k+'"]').click();await L.sleep(10);}},
 run(L){
  L.h(L.kick('learn','When to extend a project')+'<h1 class="q">End of week 6, and work is left. Extend, or let it stop?</h1>'+
   '<div class="s12-pic" id="xtl"></div><div id="xh"></div>'+
   '<p class="s12-cap">Very rarely, the book adds a couple of weeks. Both lamps must light: only true must-haves left, all '+L.g('downhill','downhill')+'. Anything '+L.g('uphill','uphill')+' means stop. Tap the lamps or try the cases until you’ve seen all four verdicts.</p>'+
   '<div class="s12-lbl">Edge cases</div><div id="xp" class="s12-btns"></div><p class="small" id="xs">Verdicts seen: 0 of 4</p>');
  const seen=new Set();let fin=false;
  const note=()=>{L.$('#xtl').innerHTML=xTimeline(x.kind);if(x.kind)seen.add(x.kind);L.$('#xs').textContent='Verdicts seen: '+seen.size+' of 4';
    if(!fin&&seen.size===4){fin=true;L.sheet('info','Two lamps, one habit check','Only true must-haves, all downhill, earn a couple of extra weeks, and even then cool-down usually absorbs them. Anything uphill goes back to shaping, not into more time.');L.done();}};
  const x=xcheck(L.$('#xh'),{toggle:true,habit:true,change:note});L.$('#xtl').innerHTML=xTimeline(null);
  [['Waitlist: two must-haves, both downhill',{must:true,down:true,habit:false}],
   ['Pause a membership: billing still uphill',{must:true,down:false,habit:false}],
   ['Lots left, some of it could be ~',{must:false,down:true,habit:false}],
   ['Third cycle in a row into cool-down',{must:true,down:true,habit:true}]].forEach((pp,k)=>{const b=document.createElement('button');b.className='chip';b.dataset.p=k;b.textContent=pp[0];
    b.onclick=()=>{L.$$('#xp .chip').forEach(c=>c.classList.toggle('sel',c===b));x.set(pp[1]);note();};L.$('#xp').appendChild(b);});}},

{part:2,src:'Chapter 14 · When to extend a project',pts:3,
 solve:async L=>{[0,1,2].forEach(c=>L.$('#pk'+c+' .chip[data-v="'+[0,1,2][c]+'"]').click());L.$('#prun').click();},
 run(L){

  const C=[['The other team’s clearer “class cancelled” email: every task left is marked ~.',{must:false,down:true},0,'Nothing left is a must-have, so the scope is done. Ship it; the ~ items can wait or never happen.'],
   ['Kenji and Bea’s waitlist: two small must-haves left, both hammered, both downhill.',{must:true,down:true},1,'Both lamps light. True must-haves, all downhill: cool-down’s slack can absorb them before the next cycle. Just not as a habit.'],
   ['“Pause a membership”: three must-haves left. One, billing a member who pauses mid-month, is still uphill.',{must:true,down:false},2,'The downhill lamp stays dark. An open question at the end is a shaping hole. Noor’s “just give them two more weeks” won’t fix it. Let the breaker trip and reshape billing.']];
  const pick=[null,null,null];
  L.h(L.kick('pr','Predict, then check')+'<h1 class="q">Three projects at the end of week 6. Predict the call for each, then run the check.</h1>'+
   C.map((c,j)=>'<div class="s12-case" id="pk'+j+'"><p>'+c[0]+'</p><div class="pv">'+V.map((v,k)=>'<button class="chip" data-v="'+k+'">'+v+'</button>').join('')+'</div><div class="ck"></div></div>').join('')+
   '<button class="btn pri" id="prun" disabled>'+L.ic('play')+'Run the check</button>');
  C.forEach((c,j)=>L.$$('#pk'+j+' .chip').forEach(b=>b.onclick=()=>{if(L.$('#prun').dataset.ran)return;pick[j]=+b.dataset.v;L.$$('#pk'+j+' .chip').forEach(x=>x.classList.toggle('sel',x===b));L.$('#prun').disabled=pick.some(p=>p===null);}));
  L.$('#prun').onclick=function(){if(this.dataset.ran)return;this.dataset.ran=1;this.remove();let n=0;
    const show=j=>{if(!L.card.isConnected||!L.$('#pk0'))return;
      if(j===C.length){L.sheet(n===3?'ok':'info',n+' of 3 right','Two conditions, checked in order: is everything left a true must-have, and is it all downhill? Few projects meet both. For the rest, the circuit breaker does its job.');L.done();return;}
      const c=C[j],ok=pick[j]===c[2];n+=ok?1:0;L.award(ok);
      const box=L.$('#pk'+j+' .ck');
      box.innerHTML='<div class="s12-mini-l">'+XC.map(x=>'<span class="'+(c[1][x[0]]?'on':'off')+'"><i></i>'+(x[0]==='must'?'True must-haves':'All downhill')+'</span>').join('')+'</div>';
      L.$$('#pk'+j+' .chip').forEach(b=>{const v=+b.dataset.v;b.classList.remove('sel');if(v===c[2])b.classList.add('ok');else if(v===pick[j])b.classList.add('no');});
      L.fb(box,(ok?'<b>Yes.</b> ':'<b>'+V[c[2]]+'.</b> ')+c[3],ok?'ok':'no');
      setTimeout(()=>show(j+1),550);};
    show(0);};}},

/* ---------- PART 4: MOVE ON ---------- */
{part:3,src:'Chapter 15 · Let the storm pass · Stay debt-free · Feedback needs to be shaped',run(L){
  const T=(y,t,c)=>'<text x="6" y="'+y+'" font-size="12.5" font-weight="700" fill="var('+c+')">'+t+'</text>';
  let s='<svg viewBox="0 0 320 262" role="img" aria-label="Three pictures. One: launch-week complaints spike on day two, then fade over a few days. Two: next cycle’s six weeks stay clean after a gentle no, but each yes fills a week with debt. Three: a request goes from raw idea to the shaping track to the betting table.">'+
   T(14,'1 · Let the storm pass','--h3');
  const cv=[2,14,8,3,1],dn=['Mon','Tue','Wed','Thu','Fri'];
  cv.forEach((v,j)=>{const x=14+j*36,h=v*3.6;s+='<rect x="'+x+'" y="'+(76-h)+'" width="26" height="'+h+'" rx="3" fill="var(--no-strong)" opacity="'+(j===1?1:.75)+'"/><text x="'+(x+13)+'" y="90" text-anchor="middle" font-size="11" fill="var(--muted)">'+dn[j]+'</text>';});
  s+='<text x="196" y="40" font-size="11.5" fill="var(--ink)">“Change it back!”</text><text x="196" y="58" font-size="11.5" font-weight="700" fill="var(--ok)">Give it a few days.</text>'+
   '<line x1="6" x2="314" y1="102" y2="102" stroke="var(--line)" stroke-width="1"/>'+T(122,'2 · Stay debt-free','--h4');
  const slate=(y,lab,dbt)=>{let r='<text x="6" y="'+(y+15)+'" font-size="11.5" fill="var(--ink)">'+lab+'</text>';
    for(let w=0;w<6;w++){const x=120+w*32,d=w<dbt;r+='<rect x="'+x+'" y="'+y+'" width="28" height="22" rx="4" fill="var('+(d?'--no-bg':'--card')+')" stroke="var('+(d?'--no-strong':'--line2')+')" stroke-width="1.5"'+(d?'':' stroke-dasharray="4 3"')+'/>'+(d?'<text x="'+(x+14)+'" y="'+(y+15)+'" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--no)">yes</text>':'');}
    return r;};
  s+=slate(132,'Gentle “no”',0)+slate(160,'“Yes, next cycle”',2)+
   '<line x1="6" x2="314" y1="194" y2="194" stroke="var(--line)" stroke-width="1"/>'+T(214,'3 · Feedback needs to be shaped','--pri-deep');
  [['Raw idea',6,84,'--h3-bg','--h3'],['Shaping',116,84,'--h2-bg','--h2'],['Betting table',226,90,'--pri-bg','--pri-deep']].forEach(([t,x,w,bg,fg],j)=>{
    s+='<rect x="'+x+'" y="226" width="'+w+'" height="28" rx="14" fill="var('+bg+')"/><text x="'+(x+w/2)+'" y="244" text-anchor="middle" font-size="11.5" font-weight="700" fill="var('+fg+')">'+t+'</text>'+
     (j<2?'<path d="M'+(x+w+4)+' 240 L'+(x+w+20)+' 240" stroke="var(--muted)" stroke-width="2"/><path d="M'+(x+w+18)+' 235 L'+(x+w+25)+' 240 L'+(x+w+18)+' 245 Z" fill="var(--muted)"/>':'');});
  s+='</svg>';
  L.h(L.kick('learn','Move on')+'<h1 class="q">Shipping creates new work, if you let it</h1>'+
   '<div class="s12-pic">'+s+'</div>'+
   '<p class="s12-cap">Stay calm while the pushback dies down. Each “yes” spends next cycle before anyone shaped it. New requests are '+L.g('raw-idea','raw ideas')+': the shipped waitlist was a six-week '+L.g('bet','bet')+', and more needs a new bet at the '+L.g('betting-table','betting table')+'.</p>');
  L.done();}},

{part:3,src:'Chapter 15 · Stay debt-free · Feedback needs to be shaped',pts:1,run(L){
  L.h(L.kick('pr','Build the reply')+'<h1 class="q">Tap each piece until the sentence describes how Pinecone should handle launch feedback.</h1>');
  L.sentence(L.card,[['Treat new requests as promises to keep,','Treat new requests as raw ideas,'],['answer with a gentle “no”,','answer “yes, next cycle”,'],['and give each one to whoever is free.','and shape the ones that matter before any bet.']],[1,0,1],
   [['A promise is debt: it takes away next cycle’s clean slate.'],['A yes now commits future time before anyone has shaped or bet on it.'],['Unshaped work handed out as it comes is exactly what the method avoids. Shape first, then bet.']],
   'Raw ideas, a gentle no, and shaping before betting. That keeps Pinecone debt-free.');}},

{part:3,src:'Chapter 15 · Let the storm pass · Stay debt-free · Feedback needs to be shaped',pts:4,
 solve:async L=>{for(let g=0;g<20&&!L.$('#lw').dataset.end;g++){const o=L.$('#lw .s12-opts .chip[data-ok="1"]');if(o&&!L.$('#lw .s12-opts').dataset.done)o.click();else{const n=L.$('#lnext');if(n)n.click();}await L.sleep(20);}},
 run(L){
  const DAYS=['Mon','Tue','Wed','Thu','Fri'];
  const EV=[
   {who:'Monday · Marisol',say:'Three spots in the 6 p.m. class filled overnight, and Marisol sent no texts.'},
   {who:'Tuesday · Ember Yoga members',say:'The “Class full” label became a “Join waitlist” button. A few members are upset. One writes: “You ruined it! Change it back!”',
    opts:[['Change it back today',0,'The complaints stop, and so does the waitlist at Ember Yoga. Spots go empty again. That knee-jerk move undid the reason for the change.','undo'],
          ['Stay calm and give it a few days',1,'Right. Remember who the change helps: Marisol, and the members who now get spots. Watch the complaints fade.'],
          ['Promise a redesign next cycle',0,'The promise lands on next cycle as debt. The slate isn’t clean any more.','Redo UI']]},
   {who:'Wednesday · Dev from Ironleaf',say:'“Love it. Can members get text messages instead of emails?”',
    opts:[['“Yes, it’s coming next cycle!”',0,'That’s debt: next cycle’s time is spent before anyone shaped it or bet on it.','Texts'],
          ['Ask Kenji to squeeze it in this week',0,'That’s new work nobody shaped or bet on. The waitlist was a six-week bet; more needs a new bet.','Texts'],
          ['A gentle “not right now”; note it as a raw idea',1,'Right. Texts were a no-go in the pitch. Now it’s a raw idea Ifeoma can think about, with no promise attached.']]},
   {who:'Thursday · Dev again',say:'“And could you charge members’ cards automatically when they get a spot?”',
    opts:[['A gentle “no”; it joins the raw ideas',1,'Right. Automatic charging was a rabbit hole in the pitch. Saying no keeps the freedom to shape it later.'],
          ['Put it at the top of a backlog',0,'The book keeps no backlogs. A gentle no still lets you think about it later, without a list to groom.'],
          ['“Sure, next cycle.”',0,'Another promise, another chunk of next cycle gone.','Charge']]},
   {who:'Friday · The week in review',say:'',
    opts:[['Kenji and Bea add texts during the current cycle',0,'That interrupts the cycle and breaks the bet. Even feedback that matters is a raw idea: shape it first, then bet on it.'],
          ['Put texts on a backlog to review later',0,'The book keeps no backlogs. Feedback that matters gets shaped first, then pitched at the betting table.'],
          ['Ifeoma shapes texts first, then pitches them',1,'Right. It becomes the top priority on the shaping track while the teams build something else. The shaped version goes to the next betting table.']]}];
  let day=0,storm=0,spots=3,undone=false;const debt=[],raw=[],hist=[0,0,0,0,0];
  L.h(L.kick('pr','Launch week')+'<h1 class="q">The waitlist ships. Handle the week after launch.</h1>'+
   '<div id="lw"><div class="s12-wk" id="lwk"></div>'+
   '<div class="s12-tiles"><div class="s12-tile"><b id="lst">0</b><span>complaints today</span><svg id="lch" viewBox="0 0 90 36" style="width:100%;display:block;margin-top:4px" role="img" aria-label="Complaints per day this week"></svg></div><div class="s12-tile"><b id="lsp">3</b><span>spots filled by the waitlist</span></div><div class="s12-tile"><b id="lde">0</b><span>promises made for next cycle</span></div></div>'+
   '<div class="s12-lbl" style="margin-top:4px">Next cycle’s slate (6 weeks)</div><div class="s12-slate" id="lsl"></div>'+
   '<div class="s12-lbl">Raw ideas (no promise)</div><div class="s12-raw" id="lraw"></div>'+
   '<div class="s12-ev" id="lev"></div><div class="s12-opts" id="lop"></div><div id="lfb"></div></div>'+
   '<p class="small" style="margin-top:8px">Numbers are illustrative.</p>');
  function paint(){
    L.$('#lwk').innerHTML=DAYS.map((d,j)=>'<span class="'+(j<day?'past':j===day?'cur':'')+'">'+d+'</span>').join('');
    L.$('#lst').textContent=storm;hist[day]=Math.max(hist[day],storm);
    L.$('#lch').innerHTML=DAYS.map((d,j)=>{const v=j<=day?hist[j]:0,h=v*1.5;return (j<=day?'<rect x="'+(3+j*18)+'" y="'+(22-h)+'" width="12" height="'+Math.max(h,1)+'" rx="2" fill="var(--no-strong)"/>':'')+'<text x="'+(9+j*18)+'" y="34" text-anchor="middle" font-size="11" fill="var(--muted)">'+d[0]+'</text>';}).join('');
    L.$('#lsp').textContent=spots;L.$('#lde').textContent=debt.length;L.$('#lde').style.color=debt.length?'var(--no)':'';
    L.$('#lsl').innerHTML=[1,2,3,4,5,6].map((w,j)=>'<div class="'+(debt[j]?'d':'')+'">W'+w+(debt[j]?'<em>'+debt[j]+'</em>':'')+'</div>').join('');
    L.$('#lraw').innerHTML=raw.length?raw.map(r=>'<span>'+r+'</span>').join(''):'<span class="none">None yet</span>';}
  function show(){const e=EV[day];paint();
    L.$('#lev').innerHTML='<b>'+e.who.toUpperCase()+'</b>'+(day===4?(undone?'The waitlist is gone at Ember Yoga, and spots there go empty again. ':'Complaints have nearly died down, and the waitlist filled '+spots+' spots this week. ')+(debt.length?debt.length+' promise'+(debt.length>1?'s':'')+' already fill part of next cycle.':'Next cycle’s slate is clean.')+'<br><br><b>A MONTH LATER · NOOR</b>Many studios now ask for text alerts. Noor thinks they truly matter. What should happen?':e.say);
    L.$('#lop').innerHTML='';L.$('#lfb').innerHTML='';L.$('#lop').dataset.done='';
    if(e.opts){e.opts.forEach((o,k)=>{const b=document.createElement('button');b.className='chip';b.textContent=o[0];b.dataset.ok=o[1];
        b.onclick=()=>{if(L.$('#lop').dataset.done)return;L.$('#lop').dataset.done=1;L.award(!!o[1]);b.classList.add(o[1]?'ok':'no');
          if(o[3]==='undo'){undone=true;storm=0;}else if(o[3])debt.push(o[3]);
          if(day===2&&o[1])raw.push('Text alerts');if(day===3&&o[1])raw.push('Auto charging');
          if(day===4&&o[1]){const i=raw.indexOf('Text alerts');if(i>=0)raw[i]='Text alerts → shaping';else raw.push('Text alerts → shaping');}
          paint();L.fb(L.$('#lfb'),o[2],o[1]?'ok':'no');if(day===4)finish();else nextBtn();};
        L.$('#lop').appendChild(b);});}
    else if(day<4)nextBtn();
    else finish();}
  function finish(){L.$('#lw').dataset.end=1;
    L.sheet(debt.length||undone?'info':'ok',debt.length||undone?'How the week could go':'The storm passed','Left alone, the complaints fade in a few days while the waitlist keeps filling spots. Each “yes” spends next cycle before anyone shaped or bet on it. A gentle “no” turns asks like Dev’s into raw ideas. The ones that truly matter get shaped, then bet on.');L.done();}
  function nextBtn(){L.$('#lfb').insertAdjacentHTML('beforeend','<button class="btn pri" id="lnext" style="margin-top:8px">'+L.ic('arrow')+'Next day</button>');
    L.$('#lnext').onclick=()=>{day++;
      if(day===1)storm=14;else if(!undone)storm=Math.max(0,[0,14,8,3,1][day]);
      if(!undone)spots+=[0,2,3,2,3][day];show();};}
  show();}},

{part:3,src:'Conclusion · Key concepts',run(L){
  const box=(x,y,w,t,c,items)=>'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="70" rx="12" fill="var('+c+'-bg)" stroke="var('+c+')" stroke-width="1.5"/>'+
    '<text x="'+(x+10)+'" y="'+(y+18)+'" font-size="12.5" font-weight="700" fill="var('+c+')">'+t+'</text>'+
    items.map((it,k)=>'<text x="'+(x+10)+'" y="'+(y+35+k*14)+'" font-size="11" fill="var(--ink)">'+it+'</text>').join('');
  const arr=(d,hx,hy,rot)=>'<path d="'+d+'" fill="none" stroke="var(--muted)" stroke-width="2"/><path d="M-5 -4 L4 0 L-5 4 Z" transform="translate('+hx+' '+hy+') rotate('+rot+')" fill="var(--muted)"/>';
  const pic='<svg viewBox="0 0 300 196" role="img" aria-label="The method as a loop. Shaping: rough, solved, bounded work, appetites, breadboards and fat marker sketches. Betting: bets with a capped downside, six uninterrupted weeks, then a cool-down. Building: scopes, uphill and downhill, scope hammering. After launch, feedback comes back as raw ideas for shaping.">'+
    box(2,4,140,'Shaping','--h2',['rough, solved, bounded','appetite, not estimate','breadboards, sketches'])+
    box(158,4,140,'Betting','--h3',['capped downside','six quiet weeks','then a cool-down'])+
    box(80,120,140,'Building','--pri',['scopes, not tasks','uphill vs downhill','hammer the scope'])+
    arr('M144 39 L152 39',152,39,0)+
    arr('M236 76 Q236 155 226 155',226,155,180)+
    arr('M78 155 Q50 155 50 82',50,82,-90)+
    '<text x="62" y="98" font-size="11.5" font-weight="700" fill="var(--muted)">after launch: feedback</text><text x="62" y="112" font-size="11.5" font-weight="700" fill="var(--muted)">= raw ideas to shape</text></svg>';
  L.h(L.kick('learn','The whole method in key ideas')+'<h1 class="q">Full circle: feedback becomes the next raw idea</h1>'+
   '<div class="s12-pic">'+pic+'</div><p class="s12-cap">The book ends with the ideas it hopes you take home. Tap each card to recall one.</p>');
  L.flips(L.card,[
   ['Shaped vs unshaped work','Rough, solved, bounded before a team gets it.'],
   ['Appetites, not estimates','Decide what it’s worth first, then design to fit.'],
   ['The right level of abstraction','Breadboards and fat marker sketches, not wireframes or vague words.'],
   ['Bets with a capped downside','The circuit breaker, plus uninterrupted time to honour the bet.'],
   ['Six-week cycles and cool-down','Long enough to finish, with a break between.'],
   ['Scopes, the hill, hammering','Slice the work, show uphill vs downhill, separate must-haves from nice-to-haves.']],
   'The book admits the method is tightly woven, and that adapting it to your team may take thought and experiments. The next lesson is about exactly that.');}},

{part:3,src:'Chapters 14–15 · review',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Mixed review',['Good call','Trap'],[
   ['Kenji asks, “Is this clearly better than texting members one by one?”',0,'That’s comparing to the baseline.'],
   ['Noor promises Dev a new feature in next cycle’s work.',1,'That’s taking on debt before anything is shaped or bet on.'],
   ['Bea marks a rare edge case with ~ and keeps going.',0,'That’s scope hammering at work.'],
   ['The team extends two weeks to solve an open question.',1,'Uphill work at the end goes back to shaping, not into extra time.'],
   ['Tomás waits a few days before reacting to angry feedback.',0,'Letting the storm pass avoids knee-jerk changes.']]);}}
  ]
});
