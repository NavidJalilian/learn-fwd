<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decide When to Stop, Then Move On</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0012', title:'Decide when to stop, then move on', minutes:19, icon:'check',
  goals:['Judge “good enough” by comparing to what customers have today','Hammer scope by sorting must-haves from nice-to-haves','Decide when (rarely) to extend, and how to handle feedback after launch'],
  parts:['Good enough','Scope hammering','Extend or stop','Move on'],
  read:'Read chapters 14 and 15 and the conclusion of the book for the full list of scope-hammering questions.',
  glossary:{
    baseline:'Baseline: what customers do today without the thing you’re building, including their workarounds.',
    'must-have':'Must-have: a task the scope can’t be called done without.',
    'nice-to-have':'Nice-to-have: a task worth doing only if time is left over, marked with a ~ in front. Usually it never gets built.',
    'raw-idea':'Raw idea: a request or suggestion as it first arrives, before anyone has shaped it.',
    qa:'QA (quality assurance): a person who tests the product to find problems before customers do.'
  },
  cheatsheet:[
    '<b>Compare to baseline</b>, not to the ideal: is it clearly better than what customers do today?',
    'The fixed deadline forces trade-offs. Before any “wouldn’t it be better if…”, ask: <b>is there time for this?</b>',
    'Scope grows like grass. Nobody’s at fault; give the team the tools, authority and responsibility to keep cutting it.',
    'Cutting scope isn’t lowering quality. Choosing what to do well is what makes a product different.',
    '<b>Scope hammering</b>: must-have? could we ship without it? new or old problem? how likely, for whom, how bad? Mark the rest with ~.',
    'QA is for the edges. The team owns basic quality; QA findings are nice-to-haves until the team promotes them.',
    'Extend only rarely: what’s left must be true must-haves, all <b>downhill</b>. Uphill at the end means back to shaping.',
    'After launch: let the storm pass, say a gentle “no” to stay debt-free, and <b>shape</b> feedback before betting on it.'
  ],
  steps:[
/* ---------- PART 1: GOOD ENOUGH ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Your leaky tap has dripped for a month. A plumber can fix the drip today, but the shiny new handle you wanted is out of stock. What do you do?</h1>');
  L.mc(L.card,['Wait until the perfect handle arrives','Fix the drip now; the handle can wait'],1,
   'Right. Compared to a month of dripping, a fixed tap is a big step up. This lesson uses the same logic to decide when software is good enough to ship.',
   'Waiting for the perfect handle means living with the drip even longer. Compared to today, the fix is already a big improvement.');}},
{part:0,src:'Chapter 14 · Compare to baseline',run(L){
  L.h(L.kick('learn','Compare to baseline')+'<h1 class="q">Compare down to today, not up to the ideal</h1>'+
   L.prose('Near the end of a cycle there’s always more work than time. Designers and programmers want to do their best work, and that pride matters. But if you aim at a perfect design, you never arrive.')+
   L.lanes([['star','Up to the ideal','“Is this as good as it could possibly be?” The answer is always no.',4],
            ['home','Down to the '+L.g('baseline','baseline'),'“How do customers handle this today, without our feature? Is this clearly better?”',1]])+
   L.quote('It’s the difference between “never good enough” and “better than what they have now.”','Ryan Singer, Shape Up, chapter 14')+
   L.prose('Seeing that the work beats today’s workaround makes it easier to make calls on whatever is slowing you down.'));
  L.done();}},
{part:0,src:'Chapter 14 · Compare to baseline',run(L){
  L.h(L.kick('ex','Week 6 at Pinecone')+'<h1 class="q">Kenji isn’t sure the waitlist is good enough</h1>');
  L.beats(L.card,[
   ['The worry','Kenji looks at the “a spot opened” email. It’s plain text with a button. Kenji wants another week for a nicer layout and a smoother animation in the app.'],
   ['The question','Ifeoma asks: “What does Marisol do today when someone cancels a spot in the 6 p.m. class?”'],
   ['The baseline','Marisol texts members one by one, and the spot often stays empty. Members email Marisol asking about spots.'],
   ['The call','Next to that, a plain email that fills the spot on its own is a huge step up. Kenji agrees: it isn’t perfect, but it clearly works. The layout goes on the list as a nice-to-have.']],
   'Comparing to the baseline turns “it’s not good enough yet” into “it’s far better than what they have now.”');}},
{part:0,src:'Chapter 14 · Compare to baseline',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Bea wants to delay launch to add a waitlist position counter (“You’re #3”). Which question compares to the baseline?</h1>');
  L.mc(L.card,['Do members get a spot today without texts?','Would the best booking apps show a counter?','Would a counter make the screen look nicer?'],0,
   'Right. Today members don’t learn about opened spots at all unless Marisol texts them. Without the counter, the waitlist already beats that.',
   'That compares up to an ideal. The baseline question is about today: right now members only hear of a spot if Marisol texts them.');}},
{part:0,src:'Chapter 14 · Limits motivate trade-offs · Scope grows like grass · Cutting scope isn’t lowering quality',run(L){
  L.h(L.kick('learn','Limits, grass and quality')+'<h1 class="q">Three ideas that make cutting feel right</h1>'+
   L.list([['clock','Limits motivate trade-offs','The '+L.g('circuit-breaker','circuit breaker')+' means unfinished work doesn’t ship. So before any “wouldn’t it be better if…”, ask: <b>is there time for this?</b> Question new work before accepting it.'],
     ['leaf','Scope grows like grass','It’s nobody’s fault. You can’t see the small details until you’re in the work. Instead of trying to stop growth, give the team the tools, authority and responsibility to keep cutting.'],
     ['star','Cutting isn’t lowering quality','Not every part needs to be equally polished or every case equally handled. Choosing what to do well makes a product better at some things, and different from others.']],1)+
   L.note('Variable scope never means sloppy work. Be picky about the code, design, copy and speed of what you <i>do</i> ship.','shield'));
  L.done();}},
{part:0,src:'Chapter 14 · Cutting scope isn’t lowering quality',pts:5,run(L){
  L.h(L.kick('pr','Cut or cheap?')+'<h1 class="q">Is each choice cutting scope, or lowering quality?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Cutting scope','Lowering quality'],[
   ['No waitlist for workshops or retreats in this version.',0,'Leaving out a less common case is a choice about scope.'],
   ['Skipping tests on the first-tap-wins code to save time.',1,'The core code still has to work. Skipping its tests lowers quality.'],
   ['The spot-opened email stays plain text for now.',0,'A simpler version of a part is a scope choice, done well.'],
   ['The “Join waitlist” button has confusing copy nobody checked.',1,'Copy in the interface is part of quality. Keep it sharp.'],
   ['No position counter (“You’re #3”) at launch.',0,'A nice extra, left out on purpose.']],
   'Cutting decides <i>what</i> to build. Quality is about building that well. You can cut a lot without cutting corners.');}},

/* ---------- PART 2: SCOPE HAMMERING ---------- */
{part:1,src:'Chapter 14 · Scope hammering',run(L){
  L.h(L.kick('learn','Scope hammering')+'<h1 class="q">A stronger word than “cutting”</h1>'+
   L.prose('The book says '+L.g('hammering','hammering')+', to show the force it takes to keep banging the scope until it fits the time box. For anything new to fix, add or improve, ask:')+
   L.list([['Is it essential?','Is it a must-have? Could we ship without it? What happens if we don’t do it?'],
     ['Is it new?','Is this a new problem, or an old one customers already live with?'],
     ['How often, for whom?','How likely is it? Which customers see it: core, used by everyone, or an edge case?'],
     ['How bad, for whom?','What’s the real impact if it happens? How well does that use case match the audience we’re aiming at?']],2)+
   L.prose('The fixed deadline makes you ask these. Variable scope lets you act on the answers.'));
  L.done();}},
{part:1,src:'Chapter 14 · Scope hammering',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">Bea discovers a new case in week 5</h1>');
  L.beats(L.card,[
   ['The find','A member could sit on the waitlist for two classes at the same time slot, in Ironleaf’s two rooms. If both spots open, what should happen?'],
   ['Must-have?','Could we ship without handling it? Yes: the member just gets two emails and books one.'],
   ['New or old?','Members can already book two overlapping classes today. It’s an old problem, not one the waitlist creates.'],
   ['How likely, for whom?','Only studios with two rooms, only members on two lists, only when both open. An edge case.'],
   ['The call','Bea writes it on the scope as <b>~ Handle overlapping waitlists</b>. The tilde marks it as a nice-to-have.']],
   'Running the questions takes a minute and turns a worry into a clear decision.');}},
{part:1,src:'Chapter 14 · Scope hammering',pts:1,
 solve:async L=>{L.$('#tl').children[1].click();L.$('#tl').children[3].click();L.$('#tl').children[4].click();L.$('#tc').click();},
 run(L){
  const T=[['Send the “a spot opened” email',0],['Studio logo in the email header',1],['Email shows the class name and time',0],['Confetti when a member wins a spot',1],['Let members pick an alert sound',1],['Show the in-app alert',0]];const mk=T.map(()=>false);let done=false;
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Hammer the “Notify members” scope. Tap each nice-to-have to mark it with ~, then check.</h1><div id="tl" style="display:flex;flex-direction:column;gap:6px"></div><button class="btn pri" id="tc" style="margin-top:12px">'+L.ic('check')+'Check</button><div id="tf"></div>');
  const draw=()=>{const el=L.$('#tl');el.innerHTML='';T.forEach((t,j)=>{const b=document.createElement('button');b.className='chip'+(mk[j]?' sel':'');b.style.justifyContent='flex-start';b.style.textAlign='left';
    b.innerHTML=(mk[j]?'<b style="margin-right:4px">~</b>':L.ic('check'))+t[0];b.onclick=()=>{if(done)return;mk[j]=!mk[j];L.$('#tf').innerHTML='';draw();};el.appendChild(b);});};draw();
  L.$('#tc').onclick=()=>{if(done)return;const wrong=T.filter((t,j)=>mk[j]!==!!t[1]);
    if(!wrong.length){done=true;L.award(true);L.$('#tc').remove();
      L.$('#tl').innerHTML=T.map(t=>'<span class="chip static'+(t[1]?'':' ok')+'" style="justify-content:flex-start;'+(t[1]?'opacity:.55':'')+'">'+(t[1]?'<b style="margin-right:4px">~</b>':L.ic('check'))+t[0]+'</span>').join('')+'<div class="res" style="margin-top:8px"><b>Scope status: done.</b> All must-haves are finished. The three ~ items stay on the list; build them only if time is left.</div>';
      L.sheet('ok','Hammered','The scope counts as done once its must-haves are done. The ~ items can linger, and usually they never get built. Marking them <i>is</i> the hammering.');L.done();}
    else{L.fb(L.$('#tf'),'<b>Not yet.</b> '+wrong.length+' item'+(wrong.length>1?'s are':' is')+' marked wrong. Ask of each: could we ship without it? Would members miss it if it were gone?','no');}};}},
{part:1,src:'Chapter 14 · Scope hammering · QA is for the edges',run(L){
  L.h(L.kick('learn','QA is for the edges')+'<h1 class="q">The team owns quality. QA hunts edge cases.</h1>'+
   L.prose('In the book’s company, one '+L.g('qa','QA')+' person joins near the end of a cycle and looks for edge cases outside the core. That works because designers and programmers take responsibility for basic quality: programmers write their own tests, and the team checks the work does what was shaped.')+
   L.flow([['eye','QA finds issues','Each one starts as a '+L.g('nice-to-have','nice-to-have'),'',3],['scale','The team triages','By how bad it is and how much time is left','',2],['check','Some are promoted','Moved onto the scope as a '+L.g('must-have','must-have'),'',1]])+
   L.prose('For years they had no QA role at all. They added one when the user base grew and small edge cases began to hit thousands of people. QA is a <b>level-up, not a gate</b>. Code review works the same way: welcome if there’s time, never a required checkpoint.'));
  L.done();}},
{part:1,src:'Chapter 14 · QA is for the edges',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Pinecone has no QA person. Tomás offers to test the waitlist in week 6 and finds that the email shows the wrong time zone for one studio abroad. What happens to that issue first?</h1>');
  L.mc(L.card,['It blocks launch until it’s fixed','It goes back to Ifeoma for reshaping','It starts as a nice-to-have to triage'],2,
   'Right. Findings start as nice-to-haves. Kenji and Bea weigh how bad it is and how much time is left, and promote it to a must-have if it deserves it.',
   'Testing isn’t a gate, and this isn’t a shaping hole. The finding starts as a nice-to-have, then the team decides whether it’s serious enough to become a must-have.');}},
{part:1,src:'Chapter 14 · Scope hammering',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Must-have or nice-to-have?',['Must-have','~ Nice-to-have'],[
   ['Two members tap the same opened spot; both get booked into it.',0,'It hits the core case and breaks the class. The team can’t ship that.'],
   ['The waiting list could be sorted by membership type.',1,'Ship without it and nothing breaks. Rare need, small impact.'],
   ['A member who leaves the waitlist still gets the “spot opened” email.',0,'Common, confusing, and core to how the waitlist works.'],
   ['The email could use the studio’s brand colours.',1,'Nice polish, but the email works without it.'],
   ['A studio with no evening classes sees an empty waitlist screen with no message.',1,'Rare and harmless. Mark it ~ and move on.']]);}},

/* ---------- PART 3: EXTEND OR STOP ---------- */
{part:2,src:'Chapter 14 · When to extend a project',run(L){
  L.h(L.kick('learn','When to extend a project')+'<h1 class="q">Very rarely, and only if two things are true</h1>'+
   L.prose('Sometimes a project runs past its deadline. In rare cases the book extends it by a couple of weeks. Otherwise the circuit breaker does its job.')+
   L.list([['scale','True must-haves only','Every task left has survived every attempt to hammer it away.'],
     ['down','All downhill','No unsolved problems, no open questions. Only execution is left.']],1)+
   L.note('Anything still <b>uphill</b> at the end points to a gap in the shaping. Unknowns are too risky to bet more time on. Do something else next cycle and send the project back to shaping.','alert')+
   L.prose('Even when both are true, the book prefers to enforce the appetite. The two-week '+L.g('cool-down','cool-down')+' usually gives enough slack to finish a few leftover must-haves. Just don’t let that become a habit: it signals a shaping or team problem.'));
  L.done();}},
{part:2,src:'Chapter 14 · When to extend a project',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'End of week 6: what now?',['Ship it as it is','Finish in cool-down','Stop and reshape'],[
   ['Everything left on the waitlist scopes is marked ~.',0,'Nice-to-haves don’t block “done”. Ship it.'],
   ['Two small must-haves remain, both hammered, both clearly downhill.',1,'True must-haves, all downhill: the cool-down’s slack can absorb them before the next cycle.'],
   ['“Spot opens” is still uphill: first-tap-wins still double-books under load.',2,'An open question at the end is a shaping hole. Let the breaker trip and reshape.'],
   ['Bea wants another week to try a smoother booking animation.',0,'That’s a nice-to-have, not a reason to extend. Ship.']]);}},
{part:2,src:'Chapter 14 · When to extend a project',pts:1,run(L){
  L.h(L.kick('pr','Noor’s call')+'<h1 class="q">The other build team’s “pause a membership” project ends week 6 with three must-haves left. One is still uphill: how billing works when a member pauses mid-month. Noor says, “Just give them two more weeks.” What should Tomás say?</h1>');
  L.mc(L.card,['Agree, two weeks sounds about right','Let it stop; billing goes back to shaping','Extend, but check in on them daily'],1,
   'Right. Uphill work at the end means an unknown nobody can promise to solve in two weeks. Stop, bet on something else next cycle, and reshape the billing question first.',
   'More time, watched or not, doesn’t fix an unsolved problem. Uphill work at the end is a sign of a hole in the shaping, so the project goes back to the shaping track.');}},

/* ---------- PART 4: MOVE ON ---------- */
{part:3,src:'Chapter 15 · Let the storm pass · Stay debt-free · Feedback needs to be shaped',run(L){
  L.h(L.kick('learn','Move on')+'<h1 class="q">Shipping creates new work, if you let it</h1>'+
   L.list([['cycle','Let the storm pass','Launches bring requests, bugs and ideas. If the change alters how people work, a few may cry “change it back!” Stay calm, give it a few days, and remember who the change helps.'],
     ['lock','Stay debt-free','Promising changes eats next cycle’s clean slate. Answer with a gentle “no”. Saying yes is like taking on debt; saying no still lets you think about it later.'],
     ['pencil','Feedback needs to be shaped','New requests are '+L.g('raw-idea','raw ideas')+'. If one truly matters, make it the top shaping priority next cycle, then bring it to the betting table.']],3)+
   L.prose('The thing you shipped was a six-week '+L.g('bet','bet')+'. If that part of the product needs more, that’s a new bet, competing with everything else.'));
  L.done();}},
{part:3,src:'Chapter 15 · Let the storm pass · Stay debt-free',run(L){
  L.h(L.kick('ex','The waitlist ships')+'<h1 class="q">The week after launch</h1>');
  L.beats(L.card,[
   ['Day 1','Marisol is thrilled: three spots in the 6 p.m. class filled overnight, and Marisol sent no texts.'],
   ['Day 2','A few Ember Yoga members complain the “Class full” label became a “Join waitlist” button. One writes, “You ruined it! Change it back!”'],
   ['Day 3','Dev from Ironleaf asks for text messages instead of emails, and for charging cards automatically. Noor is tempted to reply, “Coming next cycle!”'],
   ['The response','Ifeoma suggests waiting a few days on the complaints, which fade. To Dev, a friendly “not right now, but we hear you”. Both requests were no-gos or rabbit holes in the pitch, so they’re raw ideas, not promises.']],
   'Staying calm and saying a gentle “no” keeps the next cycle’s slate clean.');}},
{part:3,src:'Chapter 15 · Feedback needs to be shaped',pts:1,run(L){
  L.h(L.kick('pr','What next?')+'<h1 class="q">A month later, many studios ask for text-message alerts. Noor now thinks it truly matters. What should happen?</h1>');
  L.mc(L.card,['Ifeoma shapes it first, then it’s pitched','Kenji and Bea add it during the cycle','It goes on a backlog for later review'],0,
   'Right. Make it the top priority on the shaping track while the teams build something else. Then pitch the shaped version at the next betting table.',
   'Interrupting the cycle breaks the bet, and the book keeps no backlogs. Feedback is a raw idea: shape it first, then bring it to the betting table.');}},
{part:3,src:'Chapter 15 · Stay debt-free · Feedback needs to be shaped',pts:1,run(L){
  L.h(L.kick('pr','Build the reply')+'<h1 class="q">Tap each piece until the sentence describes how Pinecone should handle launch feedback.</h1>');
  L.sentence(L.card,[['Treat new requests as promises to keep,','Treat new requests as raw ideas,'],['answer with a gentle “no”,','answer “yes, next cycle”,'],['and shape the ones that matter before any bet.','and give each one to whoever is free.']],[1,0,0],
   [['A promise is debt: it takes away next cycle’s clean slate.'],['A yes now commits future time before anyone has shaped or bet on it.'],['Unshaped work handed out ad hoc is exactly what the method avoids. Shape first, then bet.']],
   'Raw ideas, a gentle no, and shaping before betting. That keeps Pinecone debt-free.');}},
{part:3,src:'Conclusion · Key concepts',run(L){
  L.h(L.kick('learn','The whole method in key ideas')+'<h1 class="q">Tap each card to recall what the book hopes you take home</h1>');
  L.flips(L.card,[
   ['Shaped vs unshaped work','Rough, solved, bounded before a team gets it.'],
   ['Appetites, not estimates','Decide what it’s worth first, then design to fit.'],
   ['The right level of abstraction','Breadboards and fat marker sketches, not wireframes or vague words.'],
   ['Bets with a capped downside','The circuit breaker, plus uninterrupted time to honour the bet.'],
   ['Six-week cycles and cool-down','Long enough to finish, with a break between.'],
   ['Scopes, the hill, hammering','Slice the work, show uphill vs downhill, separate must-haves from nice-to-haves.']],
   'The book admits the method is tightly woven, and that taking it apart for your team may need thought and experiments. The next lesson is about exactly that.');}},
{part:3,src:'Chapters 14–15 · review',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Mixed review',['Good call','Trap'],[
   ['Kenji asks, “Is this clearly better than texting members one by one?”',0,'That’s comparing to the baseline.'],
   ['Noor promises Dev a new feature in next cycle’s work.',1,'That’s taking on debt before anything is shaped or bet on.'],
   ['Bea marks a rare edge case with ~ and keeps going.',0,'That’s scope hammering at work.'],
   ['The team extends two weeks to solve an open question.',1,'Uphill work at the end goes back to shaping, not into extra time.'],
   ['Tomás waits a few days before reacting to angry feedback.',0,'Letting the storm pass avoids knee-jerk changes.']]);}}
  ]
});
</script>
</body>
</html>
