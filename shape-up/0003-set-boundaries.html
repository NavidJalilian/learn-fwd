  const showApps=st.mode==='app'&&o.apps.length>0;q('.sb-apps').style.display=showApps?'':'none';q('.sb-ak').style.display=showApps?'':'none';
  el.querySelectorAll('[data-w]').forEach(b=>b.classList.toggle('sel',+b.dataset.w===st.weeks));
  el.querySelectorAll('[data-k]').forEach(b=>{const on=st.sc.has(b.dataset.k);b.classList.toggle('sel',on);b.setAttribute('aria-pressed',on);});
  if(q('.sb-md'))q('.sb-md').innerHTML=st.mode==='est'?'Design first, then count the weeks. The time grows to match.':'Pick the weeks first, then design to fit. The time is locked.';
  const r=sbRead(st.sc);let ro='<p>'+status()+'</p>';
  if(!o.hideVer&&st.sc.size)ro+='<p>This is <b>'+r[0]+'</b>. '+r[1]+'</p>';
  if(o.marisol&&!o.hideVer&&st.sc.size)ro+='<p>Marisol’s problem: '+(r[2]==='yes'?'<span class="sb-ok">solved</span>, spots refill without texting.':r[2]==='part'?'<b>helped</b>, but Marisol still contacts people herself.':'<span class="sb-no">not helped</span>.')+'</p>';
  q('.sb-ro').innerHTML=ro;}
 const api={el,st,sum,id,
  idle:()=>new Promise(r=>{if(!tm)r();else waits.push(r);}),
  setMode(m){st.mode=m;if(m==='app')st.shown=st.weeks;pile();fire('mode');},
  setWeeks(w){st.weeks=w;if(st.mode==='app')st.shown=w;draw();fire('weeks');},
  toggle(k){if(st.sc.has(k))st.sc.delete(k);else st.sc.add(k);pile();fire('scope');},
  setAll(p){settle();if(p.mode)st.mode=p.mode;if(p.weeks)st.weeks=p.weeks;if(p.scope)st.sc=new Set(p.scope);api.st.sc=st.sc;st.shown=st.mode==='est'?sum():st.weeks;draw();},
  drop(k){return new Promise(res=>{const g=el.querySelector('[data-b="'+k+'"]');if(g)g.classList.add('out');setTimeout(()=>{st.sc.delete(k);draw();res();},450);});},
  read:()=>sbRead(st.sc),draw};
 el.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>api.setMode(b.dataset.m));
 el.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>api.setWeeks(+b.dataset.w));
 el.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>api.toggle(b.dataset.k));
 draw();
 return api;}

/* ---- the request funnel ---- */
/* cfg: {req, who, asker, need (story pieces for a narrow problem, 0 = never), prob, qs:{key:{q,k:'wide'|'narrow'|'flat',a,w[],bit}}, order[], noq, onAsk} */
function sbFunnel(host,cfg){
 const id='sbf'+(++sbN),keys=cfg.order||Object.keys(cfg.qs);
 const st={asked:[],wish:[],bits:[],done:false};
 host.insertAdjacentHTML('beforeend','<div class="sb-fun" id="'+id+'"><svg class="sb-svg" viewBox="0 0 320 206" role="img" aria-label="Request funnel: wide questions widen it, questions about a real moment narrow it">'+
  '<rect x="10" y="2" width="300" height="26" rx="13" fill="var(--pri-bg)" stroke="var(--pri)" stroke-width="1.5"/><text x="160" y="19.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--pri-deep)">'+cfg.req+'</text>'+
  '<path class="sb-fn" fill="var(--soft)" stroke="var(--line2)" stroke-width="2" stroke-linejoin="round"/>'+
  '<g class="sb-wl"></g>'+
  '<circle class="sb-drop" cx="160" cy="178" r="6" fill="var(--pri)" opacity="0" style="transition:cy .5s ease-in,opacity .2s"/>'+
  '<text class="sb-tag" x="160" y="200" text-anchor="middle" font-size="12" font-weight="600" fill="var(--muted)"></text></svg>'+
  '<p class="sb-cnt" aria-live="polite"></p><div class="sb-say" hidden></div><ul class="sb-story"></ul><div class="sb-pw"></div>'+
  (cfg.noq?'':'<div class="sb-k">Ask '+cfg.who.split(',')[0]+'</div><div class="sb-qs" style="margin-top:6px">'+keys.map(k=>'<button class="sb-q" data-q="'+k+'"><span>'+cfg.qs[k].q+'</span></button>').join('')+'</div>')+'</div>');
 const el=document.getElementById(id),q=s=>el.querySelector(s);
 function shape(){
  const live=st.done?0:st.wish.length,nb=st.bits.length;
  let hw=st.done?44:Math.max(40,Math.min(152,70+18*live-22*nb));
  const nw=st.done?5:Math.max(6,30-12*nb);
  const d='M'+(160-hw)+' 38 L'+(160-nw)+' 150 L'+(160-nw)+' 172 L'+(160+nw)+' 172 L'+(160+nw)+' 150 L'+(160+hw)+' 38 Z';
  const p=q('.sb-fn');p.setAttribute('d',d);p.style.d='path("'+d+'")';
  const show=st.wish.slice(0,7);
  q('.sb-wl').innerHTML=show.map((w,i)=>'<text x="160" y="'+(56+13*i)+'" text-anchor="middle" font-size="12" font-weight="600" fill="var(--'+(nb?'muted':'no')+')" opacity="'+(st.done?0:1)+'">'+w+'</text>').join('');
  q('.sb-tag').textContent=st.done?'':(cfg.need&&nb?'narrowing…':st.wish.length>2?'the wish list keeps growing':'');
  q('.sb-cnt').innerHTML='Asked: <b>'+st.asked.length+'</b> · Wish list: <b>'+st.wish.length+'</b>'+(cfg.need?' · Story: <b>'+nb+' of '+cfg.need+'</b>':'');
  q('.sb-story').innerHTML=st.bits.map(b=>'<li>'+b+'</li>').join('');}
 const TAG={wide:'widened',narrow:'narrowed',flat:'no change'};
 const api={el,st,
  ask(k){if(st.asked.includes(k)||st.done)return;const Q=cfg.qs[k];st.asked.push(k);
   (Q.w||[]).forEach(x=>{if(!st.wish.includes(x))st.wish.push(x);});
   if(Q.bit&&!st.bits.includes(Q.bit))st.bits.push(Q.bit);
   const say=q('.sb-say');say.hidden=false;say.innerHTML='<b>'+(cfg.asker||'Ifeoma')+(Q.reply?' replies':' asks')+'</b><span>'+Q.q+'</span><b>'+cfg.who+'</b>'+Q.a;
   const b=el.querySelector('[data-q="'+k+'"]');if(b){b.disabled=true;b.insertAdjacentHTML('beforeend','<span class="t '+Q.k+'">'+TAG[Q.k]+'</span>');}
   if(cfg.need&&st.bits.length>=cfg.need){st.done=true;el.querySelectorAll('.sb-q:not([disabled])').forEach(x=>x.disabled=true);
    const dr=q('.sb-drop');setTimeout(()=>{if(!el.isConnected)return;dr.setAttribute('opacity','1');dr.style.cy='200px';},350);
    setTimeout(()=>{if(!el.isConnected)return;dr.setAttribute('opacity','0');q('.sb-pw').innerHTML='<div class="sb-prob">'+sbIc('target')+'<div><b>THE NARROW PROBLEM</b>'+cfg.prob+'</div></div>';if(cfg.onDone)cfg.onDone(api);},900);}
   shape();if(cfg.onAsk)cfg.onAsk(k,api);}};
 el.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>api.ask(b.dataset.q));
 shape();return api;}

Course.lesson({
  id:'0003', title:'Set boundaries', minutes:20, icon:'target',
  goals:['Set an appetite for an idea before anyone designs it','Answer a raw idea without saying yes or no too early','Narrow a vague request down to a real, specific problem'],
  parts:['Appetite','Fixed time','Raw ideas','Grab-bags'],
  read:'Read chapter 3 of the book for the full “calendar” story and the Files 2.0 lesson.',
  glossary:{
    'raw-idea':'Raw idea: a request or idea as it first arrives, before anyone has thought about its size or the problem behind it.',
    'small-batch':'Small batch: a project a tiny team (a designer plus a programmer or two) finishes within a week or two. Several are grouped into one cycle.',
    'big-batch':'Big batch: a project that takes the same small team a full six-week cycle.',
    'grab-bag':'Grab-bag: a vague “redesign” or “2.0” project with no single problem behind it, so nobody knows where it starts or ends.',
    estimate:'Estimate: a guess of how long a design will take. The design comes first; the number follows.'
  },
  cheatsheet:[
    'First step of shaping: <b>set boundaries</b>. Before designing anything, pin down three things: the idea, how much time it deserves, and the exact problem.',
    '<b>Appetite</b> = how much time the idea is worth. <b>Small batch</b>: 1–2 weeks. <b>Big batch</b>: 6 weeks.',
    'An estimate is a number you get <i>from</i> a design. An appetite is a number you design <i>to</i>.',
    '<b>Fixed time, variable scope</b>: the deadline holds, so the scope gives way. No six-week version conceivable? Narrow it or break off a part.',
    '“Good” is relative: the best solution depends on how much time the idea deserves.',
    'Answer raw ideas with a soft “Interesting. Maybe some day.” No backlog, no promise, no slammed door.',
    'Narrow the problem: ask <b>when</b> the person wanted the thing, and what broke down at that moment. No story and not urgent? Walk away for now.',
    'Watch out for <b>grab-bags</b> (“redesign”, “2.0”). Split them into small projects, each with its own problem and appetite.'
  ],
  steps:[
/* ---------- PART 1: APPETITE ---------- */
{part:0,src:'Warm-up',pts:1,run(L){

 run(L){

 run(L){

   '<p class="sb-cap">A story from the book. People ask for a <i>solution</i>. Behind it is one moment where their work broke down. Find that moment, and a six-week request can shrink to a one-day fix.</p>');
  L.done();}},
{part:2,src:'Chapter 3 · Case study: Defining “calendar”',
 solve:async L=>{let b;while((b=L.$('.sb-nx')))b.click();},
 run(L){
  L.h(L.kick('ex','Case study: defining “calendar”')+'<h1 class="q">Ask <i>when</i> they wanted it, not why</h1><div id="s13"></div>');
  sbSteps(L,L.$('#s13'),SB_CAL,'Asking <i>when</i> gets a real story, and the story shows the exact point where work breaks down. Can’t find one, and it isn’t critical? The appetite also caps how much digging is worth it: <b>walk away for now</b>.');}},
{part:2,src:'Chapter 3 · Case study: Defining “calendar”',pts:1,
 solve:async L=>{L.$('#o14').children[2].click();for(let i=0;i<150&&!L.p14;i++)await L.sleep(30);},
 run(L){
  L.p14=false;
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">Ifeoma calls Marisol, who asked for a waitlist. Which question will narrow the funnel?</h1><div id="f14"></div><div class="opts" id="o14" style="margin-top:12px"></div>');
  const f=sbFunnel(L.$('#f14'),Object.assign(SB_WAIT(),{noq:true}));
  const K=['look','why','when'];let picked=false;
  K.forEach((k,j)=>{const x=document.createElement('button');x.className='opt';   x.innerHTML='<span class="key">'+(j+1)+'</span><span>'+SB_WAIT().qs[k].q+'</span>';
   x.onclick=async()=>{if(picked)return;picked=true;const ok=j===2;L.award(ok);
    [...L.$('#o14').children].forEach((y,i)=>{y.setAttribute('aria-disabled','true');if(i===2)y.classList.add('ok');else if(i===j)y.classList.add('no');else y.classList.add('dim');});
    for(const q of K){if(!f.el.isConnected)return;f.ask(q);await sbWait(750);}
    if(!f.el.isConnected)return;
    L.sheet(ok?'ok':'no',ok?'The “when” question narrowed it':'It was the “when” question','Asking <i>when</i> pulls out a real moment, and the funnel narrows. Asking what it should look like, or why she wants it, invites a wish list: every answer adds more to build. One more question about what happened next would finish the story.');
    L.p14=true;L.done();};
   L.$('#o14').appendChild(x);});}},
{part:2,src:'Chapter 3 · Narrow down the problem',pts:1,
 solve:async L=>{L.$('#f15 [data-q="when"]').click();L.$('#f15 [data-q="then"]').click();for(let i=0;i<150&&!L.p15;i++)await L.sleep(30);},
 run(L){
  L.p15=false;
  L.h(L.kick('pr','Challenge')+'<h1 class="q">Get from “Can you add a waitlist?” to a narrow problem in <b>three questions or fewer</b>.</h1><div id="f15"></div>');
  let graded=false;
  sbFunnel(L.$('#f15'),Object.assign(SB_WAIT(),{order:['feat','when','look','then','why'],
   onDone:f=>{if(graded)return;graded=true;const ok=f.st.asked.length<=3;L.award(ok);
    L.sheet(ok?'ok':'no',ok?'Narrowed in '+f.st.asked.length+' questions':'Narrowed, but it took '+f.st.asked.length,
     (ok?'':'Questions about features or looks only widened the funnel. ')+'Two questions about the moment did it: the full 6 p.m. class, then the texting one by one while the spot stays empty. Now there’s a problem specific enough to shape against. Still no solution, and that’s fine.');
    L.p15=true;L.done();}}));}},
{part:2,src:'Chapter 3 · Narrow down the problem',pts:2,
 solve:async L=>{const b=L.sb16,c=k=>L.$('#'+b.id+' [data-k="'+k+'"]').click();c('join');c('list');L.$('#c16go').click();await L.sleep(500);c('msg');L.$('#c16go').click();},
 run(L){
  L.h(L.kick('pr','Challenge')+'<h1 class="q">Now you know Marisol’s problem. Load the waitlist that fits each appetite.</h1><div class="sb-stage" id="c16s"></div><div id="b16"></div>');
  const b=L.sb16=sbBeam(L.$('#b16'),{mode:'app',weeks:2,scope:[],modes:false,apps:[],hideVer:true});
  b.el.querySelector('.sb-chips').insertAdjacentHTML('afterend','<div class="sb-act"><button class="btn pri" id="c16go">'+sbIc('check')+'Check</button></div><div id="c16f"></div>');
  let stage=1,graded=[false,false],first=[false,false];
  const head=()=>{L.$('#c16s').innerHTML=stage===1?'Stage 1 of 2 · Appetite: <b>2 weeks</b>. Load a version that still helps Marisol.':'Stage 2 of 2 · Appetite: <b>6 weeks</b>. Load a version that solves the whole problem.';};head();
  L.$('#c16go').onclick=()=>{const sc=b.st.sc,tot=b.sum(),w=b.st.weeks,j=sc.has('join'),l=sc.has('list'),m=sc.has('msg');
   const ok=stage===1?(tot<=2&&j&&l):(tot<=6&&j&&m);
   if(!graded[stage-1]){graded[stage-1]=true;first[stage-1]=ok;L.award(ok);}
   const f=L.$('#c16f');f.innerHTML='';
   if(!ok){let why;
    if(tot>w)why='It tips: '+sbWk(tot-w)+' over the appetite. Take something off.';
    else if(!sc.size)why='The pan is empty.';
    else if(!j)why='Members have no way to get on the list.';
    else if(stage===1)why='Members can join, but Marisol can’t see who’s waiting, so nothing changes for her.';
    else why='It fits, but Marisol would still contact people herself. The problem says: without texting anyone. Which block does that?';
    L.fb(f,why+(graded[stage-1]?' Fix it and check again.':''),'no');return;}
   if(stage===1){L.fb(f,'<b>Stage 1 done.</b> That’s the cheap two-week waitlist: members join, and Marisol sees who’s waiting and contacts them herself. Not all she wants, but it helps, and it fits.','ok');
    stage=2;head();b.setWeeks(6);return;}
   L.$('#c16go').disabled=true;
   L.sheet(first[0]&&first[1]?'ok':'info','Two good waitlists','At six weeks, members join and an open spot is offered automatically, so Marisol texts nobody. The narrow problem told you which blocks to keep. Both versions are “good”: which one is right depends on the appetite. Noor and Ifeoma agree the problem is worth a full cycle, a '+L.g('big-batch','big batch')+'. Ifeoma now has all three boundaries: the raw idea, an appetite, a narrow problem.');
   L.done();};}},

/* ---------- PART 4: GRAB-BAGS ---------- */
{part:3,src:'Chapter 3 · Watch out for grab-bags',run(L){
  L.h(L.kick('learn','Watch out for grab-bags')+'<h1 class="q">A “redesign” with no single problem isn’t a project</h1>'+
   SB_BAG+
   '<p class="sb-cap">A “redesign” with no single problem behind it is a '+L.g('grab-bag','grab-bag')+': nobody can say where it starts or ends. Name one problem, and you can ask what’s broken and what can stay. A “2.0” label is the tell.</p>');
  L.done();}},
{part:3,src:'Chapter 3 · Watch out for grab-bags',
 solve:async L=>{for(const k of ['g','i','p']){L.$('#p18 [data-p="'+k+'"]').click();await L.sleep(20);for(const b of L.$$('#f18 .sb-q'))b.click();for(let i=0;i<60&&!L.$('#f18o');i++)await L.sleep(30);}for(let i=0;i<40&&!L.d18;i++)await L.sleep(30);},
 run(L){
  L.d18=false;
  L.h(L.kick('ex','Find the limits')+'<h1 class="q">Not every request narrows. Run all three through the funnel.</h1><div class="sb-ctl" id="p18"></div><div id="f18"></div>');
  const E={
   g:['Pinecone 2.0',{req:'“Pinecone 2.0: a new studio dashboard”',who:'Noor',need:0,qs:{
      when:{q:'“When did you last need it? What were you doing?”',k:'wide',a:'“Not one moment. Everything could be better.”',w:['Better reports','A new look']},
      what:{q:'“What’s not working today?”',k:'wide',a:'“The schedule page, payments, reports, the colours… all of it.”',w:['Schedule page','Payments','Colours']}}},
    '<b>A grab-bag.</b> Even “when” widened it: there’s no single problem, so no start and no end. The “2.0” label was the tell. Split it into small projects, each with its own problem.'],
   i:['Instagram',{req:'“Instagram integration”',who:'A studio owner',need:0,qs:{
      when:{q:'“When did you last wish you had it?”',k:'flat',a:'“Hmm. I can’t think of a time. It would just be nice.”'},
      what:{q:'“What would it fix for you?”',k:'flat',a:'“Nothing urgent, really.”'}}},
    '<b>No story, and nothing urgent: walk away.</b> The appetite also caps how much digging is worth it. A later request or story may bring better insight.'],
   p:['Permission rules',{req:'“We need more complex permission rules”',who:'A Basecamp customer',asker:'The team',need:1,prob:'People don’t know that archiving a file hides it for everyone.',qs:{
      rules:{q:'“Which rules do you want?”',k:'wide',a:'“Who can archive, who can delete, who can move things…”',w:['Archive rules','Delete rules']},
      when:{q:'“When did you run into this? What happened?”',k:'narrow',a:'“Someone archived a file, not knowing it would disappear for everyone else.”',bit:'<b>The moment:</b> a file archived by someone who didn’t know what archiving does.'}}},
    '<b>Narrowing can shrink the whole project.</b> Built as asked: about six weeks. A warning on the archive button that explains the effect: one day. (A story from the book.)']};
  const seen=new Set();
  Object.keys(E).forEach(k=>{const x=document.createElement('button');x.className='chip';x.dataset.p=k;x.innerHTML=sbIc('flask')+E[k][0];
   x.onclick=()=>{[...L.$('#p18').children].forEach(y=>y.classList.toggle('sel',y===x));const host=L.$('#f18');host.innerHTML='';
    const cfg=E[k][1],nq=Object.keys(cfg.qs).length;
    const fin=f=>{if(!host.isConnected||L.$('#f18o'))return;seen.add(k);x.classList.add('ok');
     const d=L.fb(host,E[k][2]+'<br><span class="small">'+seen.size+' of 3 tried</span>','info');d.id='f18o';
     if(seen.size===3&&!L.d18){L.d18=true;L.done();}};
    sbFunnel(host,Object.assign({},cfg,{onAsk:(q,f)=>{if(!cfg.need&&f.st.asked.length===nq)fin(f);},onDone:fin}));};
   L.$('#p18').appendChild(x);});
  L.$('#p18 [data-p="g"]').click();}},
{part:3,src:'Chapter 3 · Watch out for grab-bags',

{part:3,src:'Chapter 3 · Boundaries in place',pts:4,run(L){
  L.h(L.kick('pr','Boundaries in place?')+'<h1 class="q">Which ideas are ready for the next step, finding the elements of a solution?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Ready','Needs an appetite','Needs a narrow problem'],[
   ['Clearer cancellation email: members miss it because it looks like an ad. Worth two weeks.',0,'Raw idea, appetite and a narrow problem. Ready.'],
   ['Gift cards: owners lose sales at the front desk when visitors ask for one. Nobody has said how much time it deserves.',1,'The problem is clear, but there’s no time budget yet.'],
   ['Better reports: worth six weeks. Owners “want more insight.”',2,'There’s an appetite, but “more insight” isn’t a specific breakdown.'],
   ['Waitlist: fill spots after cancellations without texting by hand. One full cycle.',0,'All three boundaries are in place.']],
   'All three boundaries (the idea, the time budget and the exact problem) must be set before you look for the elements of a solution.');}}
  ]
