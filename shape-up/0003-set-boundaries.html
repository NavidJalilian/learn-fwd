<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set Boundaries</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0003', title:'Set boundaries', minutes:18, icon:'target',
  goals:['Set an appetite for an idea before anyone designs it','Answer a raw idea without saying yes or no too early','Narrow a vague request down to a real, specific problem'],
  parts:['Appetite','Raw ideas','Narrow it','Grab-bags'],
  read:'Read chapter 3 of the book for the full “calendar” story and the Files 2.0 lesson.',
  glossary:{
    'raw-idea':'Raw idea: a request or idea as it first arrives, before anyone has thought about its size or the problem behind it.',
    'small-batch':'Small batch: a project one designer and one or two programmers can build in one or two weeks. Several are grouped into one cycle.',
    'big-batch':'Big batch: a project that takes the same small team a full six-week cycle.',
    'grab-bag':'Grab-bag: a vague “redesign” or “2.0” project with no single problem behind it, so nobody knows where it starts or ends.',
    estimate:'Estimate: a guess of how long a design will take. It starts from a design and ends with a number.'
  },
  cheatsheet:[
    'First step of shaping: <b>set boundaries</b>. You need a raw idea, an appetite and a narrow problem.',
    '<b>Appetite</b> = how much time the idea is worth. <b>Small batch</b>: 1–2 weeks. <b>Big batch</b>: 6 weeks.',
    'An estimate starts with a design and ends with a number. An appetite starts with a number and ends with a design.',
    '<b>Fixed time, variable scope</b>: the deadline holds, so the scope gives way.',
    '“Good” is relative: the best solution depends on how much time the idea deserves.',
    'Answer raw ideas with a soft “Interesting. Maybe some day.” No backlog, no promise, no slammed door.',
    'Narrow the problem: ask <b>when</b> the person wanted the thing, and what broke down at that moment.',
    'Watch out for <b>grab-bags</b> (“redesign”, “2.0”). Split them into small projects, each with its own problem.'
  ],
  steps:[
/* ---------- PART 1: APPETITE ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Noor and Ifeoma talk for an hour about a waitlist for full classes. Noor pictures a small button. Ifeoma pictures a whole new booking flow. Why did the talk go nowhere?</h1>');
  L.mc(L.card,['They never agreed how big it should be','They needed more ideas on the table'],0,
   'They were talking about two different projects. This lesson is about agreeing on the size of an idea before anyone talks about solutions.',
   'More ideas would make it worse: one is thinking small, the other big. They first need to agree how big this should be.');}},
{part:0,src:'Chapter 3 · Setting the appetite',run(L){
  L.h(L.kick('learn','Setting the appetite')+'<h1 class="q">First decide how much time the idea is worth</h1>'+
   L.prose('Every project starts as a '+L.g('raw-idea','raw idea')+', like “studios are asking for a waitlist.” Before anyone dives into solutions, the shaper asks: how much of our time does this deserve? A quick fix? A whole cycle?')+
   L.prose('The book calls this the '+L.g('appetite','appetite')+': a time budget for a standard team of one designer and one or two programmers. It comes in two sizes:')+
   L.tiers([['clock','Small batch','One or two weeks. Several of these are grouped into one cycle.','Pinecone: a longer class description field'],
            ['cal','Big batch','A full six weeks for the same team.','Pinecone: a waitlist that fills open spots',true]])+
   '<p class="small" style="margin-top:10px">If an idea can’t fit in six weeks at all, narrow the problem, or break off a meaningful part that does fit.</p>');
  L.done();}},
{part:0,src:'Chapter 3 · Setting the appetite',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Studio owners want to export their member list to a spreadsheet. Ifeoma thinks it’s worth about two weeks of work. Which size is that?</h1>');
  L.mc(L.card,['A big batch, worth a full cycle','A small batch, grouped with others'],1,
   'One or two weeks is a small batch. It shares a cycle with other small projects.',
   'A big batch takes the whole six weeks. A two-week idea is a small batch, grouped with other small ones.');}},
{part:0,src:'Chapter 3 · Fixed time, variable scope',run(L){
  L.h(L.kick('learn','Fixed time, variable scope')+'<h1 class="q">An appetite is not an estimate</h1>'+
   L.lanes([['pencil','Estimate','Starts with a design, ends with a number: “this will take four weeks.”',4],
            ['clock','Appetite','Starts with a number, ends with a design: “we’ll spend two weeks, so what fits?”',2]])+
   L.prose('The appetite is a creative limit. The time stays fixed, so the <b>scope</b> (how much gets built) is what gives way. The book calls this <b>fixed time, variable scope</b>.')+
   L.prose('The author uses the book itself as the example. With a week left, he had to choose between fixing typos and adding a new section. The deadline made him cut the section and keep the quality. Without a deadline, he’d never have made that trade.')+
   '<p class="small">It works twice: during shaping it limits what kind of solution you design, and during building it pushes the team to separate the core from the extras.</p>');
  L.done();}},
{part:0,src:'Chapter 3 · Fixed time, variable scope',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Appetite or estimate?',['Appetite','Estimate'],[
   ['Kenji finishes a full waitlist design, then says it will take about five weeks.',1,'It starts from a design and ends with a number. That’s an estimate.'],
   ['Ifeoma says the cancelled-class email is worth two weeks, and shapes something that fits.',0,'The number came first and limits the design. That’s an appetite.'],
   ['Noor decides the waitlist is worth one full cycle, before any sketches exist.',0,'Time is set before the design, so it’s an appetite.'],
   ['Bea reads the spec and guesses the export will take nine days.',1,'Guessing from a finished spec is an estimate.']]);}},
{part:0,src:'Chapter 3 · Setting the appetite',pts:5,run(L){
  L.h(L.kick('pr','How big is it?')+'<h1 class="q">Sort Pinecone’s ideas by the appetite they deserve.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Small batch','Big batch','Too big: narrow it'],[
   ['A longer class description field',0,'A small, clear change: one or two weeks.'],
   ['Automatically fill spots that open in full classes',1,'A real flow with several parts, worth a whole cycle.'],
   ['A clearer “class cancelled” email',0,'A contained change: a small batch.'],
   ['“Rebuild everything studio owners see”',2,'Six weeks isn’t conceivable. Narrow the problem or break off one meaningful part.'],
   ['Export members to a spreadsheet',0,'One or two weeks of work.']],
   'Small batches share a cycle, big batches take one. Anything bigger has to be narrowed or split before shaping goes on.');}},

/* ---------- PART 2: RAW IDEAS ---------- */
{part:1,src:'Chapter 3 · “Good” is relative',run(L){
  L.h(L.kick('learn','“Good” is relative')+'<h1 class="q">There is no best solution, only the best one for the time</h1>'+
   L.prose('Without a time limit, there is always a better version. The book’s picture: the ultimate meal might be a ten-course dinner, but when you’re hungry and in a hurry, a hot dog is perfect.')+
   L.flow([['clock','Small appetite','A plain text box','a simple version',2],['cal','Bigger appetite','Many structured fields','a fancy version',3]],false)+
   L.prose('The same is true in software. You could add a feature to the busy main page, or put it on a quieter screen with fewer limits. Which is “good” depends on how much time you want to spend and how much the idea matters.'));
  L.done();}},
{part:1,src:'Chapter 3 · “Good” is relative',pts:1,
 solve:async L=>{const g=L.$('#ap').children;g[0].click();g[1].click();},
 run(L){
  const A=['Two weeks','Six weeks'],V=[
   ['Members tap “Join waitlist” on a full class.','Marisol sees who is waiting and contacts them in person.'],
   ['Members tap “Join waitlist” on a full class.','When someone cancels, the next person gets a “spot opened” message automatically.']];const seen=new Set();
  L.h(L.kick('pr','Toggle and compare')+'<h1 class="q">Same raw idea, two appetites. Pick each one and see what kind of waitlist could fit.</h1><div id="ap"></div>'+
   '<div style="background:var(--soft);border-radius:16px;padding:14px;margin:8px 0 6px;min-height:110px"><div class="small" id="ac" style="margin-bottom:8px">Choose an appetite above.</div><div id="ai"></div></div><div id="aq"></div>');
  A.forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.innerHTML=L.ic('clock')+n;b.onclick=()=>{[...L.$('#ap').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(j);
    L.$('#ac').innerHTML='<b>'+n+'</b>: one possible version';
    L.$('#ai').innerHTML=V[j].map(x=>'<span class="chip static ok">'+L.ic('check')+x+'</span>').join('');
    if(seen.size===2&&!L.$('#aq').innerHTML){const q=L.$('#aq');q.innerHTML='<h2 class="sub">Which version is the “good” one?</h2>';
      L.mc(q,['The six-week one, since it does more','It depends on the appetite we set'],1,
       'Both can be good. A hot dog beats a ten-course dinner when you’re in a hurry. The appetite decides.',
       'Doing more isn’t automatically better. If the idea is only worth two weeks, the simpler version is the good one.');}};L.$('#ap').appendChild(b);});}},
{part:1,src:'Chapter 3 · Responding to raw ideas',run(L){
  L.h(L.kick('learn','Responding to raw ideas')+'<h1 class="q">The default answer is a very soft “no”</h1>'+
   L.quote('Interesting. Maybe some day.','Ryan Singer, Shape Up, chapter 3')+
   L.prose('It’s too early to say yes or no when an idea first comes up. Nobody understands it yet, so nobody should promise it. The idea doesn’t go into a backlog either. It gets space, so you can learn whether it really matters.')+
   L.list([['shield','Don’t shut it down','You don’t understand it yet. Tomorrow you might hear something that changes your view.'],
           ['lock','Don’t get excited out loud','Too much enthusiasm sets the expectation that it will happen.'],
           ['scale','Keep a poker face','Stay calm and neutral. If you say yes to everything, the pile of work only grows.']],3));
  L.done();}},
{part:1,src:'Chapter 3 · Responding to raw ideas',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">On a support call, Dev from Ironleaf Fitness asks for a waitlist. What should the support person say?</h1>');
  L.mc(L.card,['“Great idea, it’s going on our roadmap!”','“Interesting, thanks. Maybe some day.”','“Sorry, we don’t build waitlists.”'],1,
   'A calm, soft “no” keeps every option open and promises nothing.',
   'The first answer promises something nobody understands yet. The third shuts the door before anyone has looked. A soft “maybe some day” avoids both.');}},
{part:1,src:'Chapter 3 · Responding to raw ideas',pts:5,run(L){
  L.h(L.kick('pr','Spot the response')+'<h1 class="q">Ideas pour into Pinecone’s team chat. Sort each reply.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Soft “no” (good)','Commits too soon','Shuts it down'],[
   ['Noor, about gift cards: “Yes! Let’s do it next cycle.”',1,'Nobody knows yet what gift cards would take. That promise comes too early.'],
   ['Tomás, about a dark mode: “Never. That’s a waste of time.”',2,'Tomás doesn’t understand the request yet. New information could change that view.'],
   ['Ifeoma, about class reminders: “Interesting. Maybe some day.”',0,'Calm, neutral and open. This is the default.'],
   ['Support files every request as a ticket in a big “to do” list.',1,'A backlog quietly says yes to everything, and the pile only grows.'],
   ['Kenji, about a new logo upload: “Hmm, noted. Let’s see if it comes up again.”',0,'Neutral, no promise, nothing stored. A soft “no”.']],
   'Too eager and too harsh both lock in a decision before anyone understands the idea. A soft “no” leaves room to learn.');}},

/* ---------- PART 3: NARROW IT ---------- */
{part:2,src:'Chapter 3 · Narrow down the problem',run(L){
  L.h(L.kick('learn','Narrow down the problem')+'<h1 class="q">Ask “What’s really going wrong?”, not “What could we build?”</h1>'+
   L.prose('Besides setting an appetite, you usually need to understand the problem better. People ask for a <i>solution</i>. Behind it there is a moment when their work broke down.')+
   L.flow([['chat','The request','“Add a calendar”','a solution someone named',4],['eye','The moment','When did it break down?','what was going on',3],['target','The problem','A narrow need','something you can shape',2]])+
   L.prose('Find that moment and the problem often shrinks. Then an idea can fit inside the appetite.'));
  L.done();}},
{part:2,src:'Chapter 3 · Narrow down the problem',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">A six-week request turns into a one-day fix</h1>');
  L.beats(L.card,[
   ['The request','A customer asks Basecamp for more complex <b>permission rules</b>. Built as asked, that could easily take six weeks.'],
   ['Dig deeper','Instead of taking it at face value, the team asks what happened. Someone had archived a file, not knowing it would disappear for everyone else.'],
   ['The real problem','Nobody needed new rules about who can archive. People just didn’t know what archiving would do.'],
   ['The fix','A warning on the archive button that explains the effect. A <b>one-day</b> change instead of a six-week project.']],
   'The request named a solution. Asking what actually went wrong found a much smaller one.');}},
{part:2,src:'Chapter 3 · Case study: Defining “calendar”',run(L){
  L.h(L.kick('ex','Case study: defining “calendar”')+'<h1 class="q">Ask <i>when</i> they wanted it, not why</h1>');
  L.beats(L.card,[
   ['The request','Customers asked Basecamp for a calendar. Everyone knows what a calendar is, but a full one could take six months.'],
   ['The question','The team called a customer. They didn’t ask why she wanted one or what it should look like. They asked <b>when</b> she wanted it: what was she doing at that moment?'],
   ['Her story','Her office tracked meeting rooms on a calendar drawn on a chalkboard wall. Working from home one day, a client asked for a meeting. She drove to the office through bad traffic to check the wall, and no free slot suited the client.'],
   ['The insight','She didn’t need “everything a calendar does.” She needed to <b>see free spaces</b> to decide when to schedule something.'],
   ['The result','No solution yet, but a problem narrow enough to fit an appetite. It led to the simpler Dot Grid idea from chapter 2.']],
   'Asking <i>when</i> gets a real story. A real story shows the exact point where the current way of working breaks.');}},
{part:2,src:'Chapter 3 · Case study: Defining “calendar”',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Ifeoma calls Marisol, who runs Ember Yoga and asked for a waitlist. What should Ifeoma ask first?</h1>');
  L.mc(L.card,['“What should the waitlist screen look like?”','“Why do you want a waitlist so badly?”','“When did you last wish you had a waitlist?”'],2,
   'Asking <i>when</i> brings out a real moment, and that moment shows what is actually going wrong.',
   'Asking what it should look like, or why Marisol wants it, invites a designed solution. Asking <i>when</i> brings out the real story behind the request.');}},
{part:2,src:'Chapter 3 · Narrow down the problem',run(L){
  L.h(L.kick('ex','Pinecone’s turn')+'<h1 class="q">What Marisol’s story reveals</h1>');
  L.beats(L.card,[
   ['The moment','Marisol’s 6 p.m. class is always full. Members email Marisol asking if a spot might open up.'],
   ['The breakdown','When someone cancels, Marisol texts waiting members one by one. Often nobody answers in time and the spot stays empty.'],
   ['Not the real need','“A waitlist that does everything a waitlist could do.”'],
   ['The real need','<b>Fill spots that open after a cancellation, without Marisol texting anyone.</b>'],
   ['The appetite','Noor and Ifeoma agree it’s worth a full cycle: a '+L.g('big-batch','big batch')+'.']],
   'Ifeoma now has all three boundaries: the raw idea, an appetite, and a narrow problem. Still no solution, and that’s fine.');}},
{part:2,src:'Chapter 3 · Narrow down the problem',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Tap each piece until the sentence is a narrow problem Ifeoma can shape against.</h1>');
  L.sentence(L.card,[['Studio owners need to','Studio owners would like to'],['fill spots that open after a cancellation','see every class in a full calendar','redesign how booking works'],['without texting members one by one','with every option a waitlist could have']],[0,0,0],
   [['“Would like to” is fine, but the point is a real need with a clear breaking point.'],['That’s a different, bigger request, and not what broke down for Marisol.','That’s a vague redesign with no clear end.'],['“Every option” brings back the unlimited version. Name the pain instead.']],
   'It names one moment that breaks (a spot opens, nobody fills it) and the pain (texting by hand). Specific enough to spark ideas that fit six weeks.');}},
{part:2,src:'Chapter 3 · Case study: Defining “calendar”',pts:1,run(L){
  L.h(L.kick('pr','No clear story?')+'<h1 class="q">A few owners ask for “Instagram integration.” Ifeoma calls three of them. Nobody can name a moment it would have helped, and it isn’t urgent. What now?</h1>');
  L.mc(L.card,['Walk away and work on something else for now','Keep researching until the problem becomes clear'],0,
   'The appetite also limits how much research is worth it. If it isn’t critical and the problem stays vague, walk away. A clearer story may come up later.',
   'The appetite also sets how much research is worthwhile. If it isn’t critical and nobody can name the problem, the book says to walk away and wait for a better story.');}},

/* ---------- PART 4: GRAB-BAGS ---------- */
{part:3,src:'Chapter 3 · Watch out for grab-bags',run(L){
  L.h(L.kick('learn','Watch out for grab-bags')+'<h1 class="q">A “redesign” with no single problem isn’t a project</h1>'+
   L.prose('The worst unclear ideas are redesigns or refactorings that aren’t driven by one problem. The book calls them '+L.g('grab-bag','grab-bags')+': nobody can say what they mean, where they start or where they end.')+
   L.lanes([['x','Grab-bag','“Redesign the Files section.”',4],
            ['check','A starting point','“Rethink Files, because sharing several files takes too many steps.”',2]])+
   L.prose('The second version lets you ask useful questions: what isn’t working, where are there too many steps, and what can stay as it is?')+
   L.note('A sure sign of a grab-bag is a “2.0” label.','alert'));
  L.done();}},
{part:3,src:'Chapter 3 · Watch out for grab-bags',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">How Basecamp recovered from “Files 2.0”</h1>');
  L.beats(L.card,[
   ['The kick-off','Excited about improving a big part of the app, the team started a “Files 2.0” project. They knew Files had many problems.'],
   ['The mistake','Nobody asked what exactly they would do. Nobody knew what “done” looked like.'],
   ['The mess','The project turned into a mess.'],
   ['The recovery','They split it into smaller projects, like <b>better file previews</b> and <b>custom folder colors</b>, each with its own appetite and clear expectations. Those shipped.']],
   'A grab-bag hides several small projects. Pull them apart, give each its own problem and appetite, and they can ship.');}},
{part:3,src:'Chapter 3 · Watch out for grab-bags',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Grab-bag or real starting point?',['Grab-bag','Real starting point'],[
   ['Noor: “Pinecone 2.0: a new studio dashboard.”',0,'The “2.0” label and no named problem. Nobody knows where it ends.'],
   ['“Rethink the schedule page, because moving a class to another room means deleting it first.”',1,'One clear pain. You can ask what’s broken and what can stay.'],
   ['“Refactor the whole booking system.”',0,'No problem is named, so there’s no way to know when it’s done.'],
   ['“Members miss that a class was cancelled, because the email looks like an ad.”',1,'A specific breakdown. That can be shaped.'],
   ['“Give the mobile app a fresh redesign.”',0,'A redesign with no single problem behind it.']]);}},
{part:3,src:'Chapter 3 · Watch out for grab-bags',pts:1,run(L){
  L.h(L.kick('pr','Handle Noor’s grab-bag')+'<h1 class="q">Noor insists on “Pinecone 2.0: a new studio dashboard.” What should Ifeoma do?</h1>');
  L.mc(L.card,['Start shaping the whole dashboard in one big pitch','Find the specific problems and split them into projects','Refuse, because redesigns are never worth doing'],1,
   'That’s how Files 2.0 was rescued: separate projects, each with its own problem and appetite.',
   'Shaping it whole repeats the Files 2.0 mess, and refusing ignores that there may be real problems. Find them and split them into small projects.');}},
{part:3,src:'Chapter 3 · Boundaries in place',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Ready for the next step?',['Ready to find elements','Needs an appetite','Needs a narrow problem'],[
   ['Clearer cancellation email: members miss it because it looks like an ad. Worth two weeks.',0,'Raw idea, appetite and a narrow problem. Ready.'],
   ['Gift cards: owners lose sales at the front desk when visitors ask for one. Nobody has said how much time it deserves.',1,'The problem is clear, but there’s no time budget yet.'],
   ['Better reports: worth six weeks. Owners “want more insight.”',2,'There’s an appetite, but “more insight” isn’t a specific breakdown.'],
   ['Waitlist: fill spots after cancellations without texting by hand. One full cycle.',0,'All three boundaries are in place.']]);}}
  ]
});
</script>
</body>
</html>
