<script>
/* ===== This lesson's own visuals: a time-vs-scope balance beam with a lock, and a request funnel ===== */
(function(){const st=document.createElement('style');st.textContent=`

.sb-todo li.on{color:var(--ink)}.sb-todo li.on i{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}

.sb-say b+span{display:block;margin-bottom:4px}
.sb-q{display:flex;justify-content:space-between;gap:8px;align-items:center;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-bottom-width:3px;border-radius:12px;padding:9px 12px;margin:0 0 7px;font-size:14.5px;line-height:1.4;color:var(--ink);min-height:44px}
.sb-q:hover{border-color:var(--line2)}

.sb-wk i.h3{background:var(--h3-bg);border-color:var(--h3)}.sb-wk i.h4{background:var(--h4-bg);border-color:var(--h4)}

.sb-ta{border:1.5px solid var(--line2);border-radius:8px;padding:8px 10px;min-height:64px;font-size:14px;color:var(--ink);background:var(--soft)}
.sb-fld{display:flex;justify-content:space-between;gap:8px;align-items:center;border:1.5px solid var(--line2);border-radius:8px;padding:6px 10px;margin:0 0 5px;font-size:13.5px}
.sb-fld span{color:var(--muted);font-weight:600}.sb-fld i{font-style:normal;color:var(--ink)}
`;document.head.appendChild(st);})();

const sbIc=n=>Course.icon(n);
const sbWait=ms=>new Promise(r=>setTimeout(r,ms));
const sbWk=n=>n+' week'+(n===1?'':'s');
let sbN=0;

/* ---- the balance beam ---- */
/* Block sizes are illustrative (labelled on screen): weeks of work for one designer + one or two programmers. */
const SB_B={
 join:{s:'Join button',t:'“Join waitlist” button',w:1,c:'h1'},
 list:{s:'Waiting list',t:'Studio’s list of who’s waiting',w:1,c:'h2'},
 msg:{s:'Auto message',t:'Automatic “spot opened” message',w:3,c:'h3'},
 charge:{s:'Auto-charge',t:'Charge the card automatically',w:3,c:'h4'},
 line:{s:'Place in line',t:'Members see their place in line',w:1,c:'h1'},
 sms:{s:'Texts',t:'Text messages',w:2,c:'h2'},
 all:{s:'Rebuild all',s2:'owners see',t:'Rebuild everything studio owners see',w:18,c:'h4'}};
const SB_ORDER=['join','list','msg','charge','line','sms'];
function sbRead(sc){
 if(sc.has('all'))return ['not a project yet','Nobody can say where it starts or where it ends.','no'];
 const j=sc.has('join'),l=sc.has('list'),m=sc.has('msg');
 if(!sc.size)return ['Nothing loaded','','no'];
 if(j&&m)return ['the automatic waitlist','When a spot opens, waiting members get it offered automatically. Nobody texts anyone.','yes'];
 if(j&&l)return ['the cheap two-week waitlist','Members join; the studio sees who’s waiting and contacts them by hand.','part'];
 if(!j)return ['not a waitlist yet','Members have no way to join.','no'];
 return ['half a waitlist','Members join a list that nobody sees or acts on.','no'];}
function sbCradle(xc){return '<line x1="'+xc+'" y1="26" x2="'+xc+'" y2="38" stroke="var(--muted)" stroke-width="2"/>'+
 '<line x1="'+(xc-54)+'" y1="38" x2="'+(xc+54)+'" y2="38" stroke="var(--muted)" stroke-width="2" stroke-linecap="round"/>'+
 '<line x1="'+(xc-54)+'" y1="38" x2="'+(xc-54)+'" y2="178" stroke="var(--line2)" stroke-width="1.5"/><line x1="'+(xc+54)+'" y1="38" x2="'+(xc+54)+'" y2="178" stroke="var(--line2)" stroke-width="1.5"/>'+
 '<rect x="'+(xc-58)+'" y="178" width="116" height="7" rx="3.5" fill="var(--muted)"/>';}
/* o: {mode:'est'|'app', weeks, scope[], modes:bool, apps:[], chips:bool, marisol:bool, hideVer:bool, on(ev,api)} */
function sbBeam(host,o){
 o=Object.assign({mode:'est',weeks:6,scope:[],modes:true,apps:[1,2,6],chips:true,marisol:false,hideVer:false},o||{});
 const id='sbb'+(++sbN);
 const st={mode:o.mode,weeks:o.weeks,sc:new Set(o.scope),shown:0};
 const sum=()=>[...st.sc].reduce((a,k)=>a+SB_B[k].w,0);
 st.shown=st.mode==='est'?sum():st.weeks;
 host.insertAdjacentHTML('beforeend','<div class="sb-beam" id="'+id+'">'+
  (o.modes?'<div class="sb-seg" role="group" aria-label="Which comes first"><button class="chip" data-m="est">'+sbIc('pencil')+'Estimate first</button><button class="chip" data-m="app">'+sbIc('clock')+'Appetite first</button></div><p class="sb-md"></p>':'')+
  '<svg class="sb-svg" viewBox="0 0 330 236" role="img" aria-label="Balance beam with time on the left and scope on the right">'+
   '<rect x="161" y="26" width="8" height="166" rx="3" fill="var(--line2)"/><rect x="120" y="188" width="90" height="9" rx="4.5" fill="var(--line2)"/>'+
   '<g class="sb-cl" style="transition:transform .45s ease">'+sbCradle(58)+'<g class="sb-tt"></g></g>'+
   '<g class="sb-cr" style="transition:transform .45s ease">'+sbCradle(272)+'<g class="sb-ss"></g></g>'+
   '<g class="sb-bm" style="transform-origin:165px 26px;transition:transform .45s ease"><rect x="52" y="22" width="226" height="8" rx="4" fill="var(--ink)"/></g>'+
   '<circle cx="165" cy="26" r="6" fill="var(--card)" stroke="var(--ink)" stroke-width="2.5"/>'+
   '<g class="sb-lk" transform="translate(22,203)"></g>'+
   '<text x="62" y="215" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--muted)" letter-spacing=".5">TIME</text>'+
   '<text class="sb-tv" x="58" y="231" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink)"></text>'+
   '<text x="272" y="215" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--muted)" letter-spacing=".5">SCOPE</text>'+
   '<text class="sb-sv" x="272" y="231" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink)"></text>'+
  '</svg><div class="sb-ro" aria-live="polite"></div>'+
  '<div class="sb-k sb-ak">Appetite: lock the time</div><div class="sb-ctl sb-apps">'+o.apps.map(w=>'<button class="chip" data-w="'+w+'">'+sbIc('lock')+sbWk(w)+'</button>').join('')+'</div>'+
  (o.chips?'<div class="sb-k">Scope: tap to load or unload</div><div class="sb-ctl sb-chips">'+SB_ORDER.map(k=>{const b=SB_B[k];return '<button class="chip" data-k="'+k+'" aria-pressed="false" aria-label="'+b.t+', '+sbWk(b.w)+'" title="'+b.t+'"><i class="sb-sw" style="background:var(--'+b.c+'-bg);border-color:var(--'+b.c+')"></i>'+b.s+' <small>'+b.w+'w</small></button>';}).join('')+'</div>':'')+
  '<p class="sb-fine">Block sizes are illustrative, not from the book.</p></div>');
 const el=document.getElementById(id),q=s=>el.querySelector(s);
 let tm=null;const waits=[];
 const fire=ev=>{if(o.on)o.on(ev,api);};
 function settle(){if(tm){clearInterval(tm);tm=null;}waits.splice(0).forEach(f=>f());}
 function pile(){
  if(st.mode!=='est'){st.shown=st.weeks;settle();draw();return;}
  if(tm)return;
  if(st.shown===sum()){draw();settle();fire('pile');return;}
  tm=setInterval(()=>{
   if(!el.isConnected){clearInterval(tm);tm=null;return;}
   if(st.mode!=='est'){settle();return;}
   const g=sum();
   if(st.shown===g){clearInterval(tm);tm=null;draw();waits.splice(0).forEach(f=>f());fire('pile');return;}
   st.shown+=st.shown<g?1:-1;draw();},110);
  draw();}
 function lock(open){return '<rect x="0" y="6" width="13" height="10" rx="2" fill="'+(open?'var(--muted)':'var(--pri)')+'"/>'+
  '<path d="'+(open?'M3 6 V2.5 a3.5 3.5 0 0 1 7 0':'M3 6 V3.5 a3.5 3.5 0 0 1 7 0 V6')+'" fill="none" stroke="'+(open?'var(--muted)':'var(--pri)')+'" stroke-width="2"/>';}
 function status(){const tot=sum();
  if(st.mode==='est'){
   if(st.shown!==tot)return 'Estimating… <b>'+sbWk(st.shown)+'</b> so far';
   if(!tot)return 'Load some scope and the estimate grows to match.';
   return 'Estimate: <b>'+sbWk(tot)+'</b>'+(tot>6?' · <span class="sb-no">longer than one six-week cycle</span>':'')+'. The time grew to fit the design.';}
  const d=tot-st.weeks;
  if(!tot)return 'The time is locked at '+sbWk(st.weeks)+'. The scope pan is empty.';
  if(d>0)return '<span class="sb-no">Tips over:</span> <b>'+sbWk(d)+' too much</b> for a '+st.weeks+'-week appetite. Something has to come off.';
  return '<span class="sb-ok">Fits</span> the '+st.weeks+'-week appetite'+(d<0?' · '+sbWk(-d)+' spare':' exactly')+'.';}
 function draw(){
  const tot=sum(),t=st.shown;
  const th=Math.max(-10,Math.min(10,(tot-t)*3)),dy=107*Math.sin(th*Math.PI/180);
  q('.sb-bm').style.transform='rotate('+th+'deg)';
  q('.sb-cl').style.transform='translateY('+(-dy).toFixed(1)+'px)';
  q('.sb-cr').style.transform='translateY('+dy.toFixed(1)+'px)';
  let h='';for(let i=0;i<t;i++){const c=i%3,r=Math.floor(i/3),x=6+c*36,y=154-r*23,ov=i>=6;
   h+='<rect x="'+x+'" y="'+y+'" width="32" height="20" rx="4" fill="var(--'+(ov?'no-bg':'pri-bg')+')" stroke="var(--'+(ov?'no-line':'pri')+')" stroke-width="1.5"/><text x="'+(x+16)+'" y="'+(y+14.5)+'" text-anchor="middle" font-size="12" font-weight="700" fill="var(--'+(ov?'no':'pri-deep')+')">'+(i+1)+'</text>';}
  q('.sb-tt').innerHTML=h;
  let y=176,s='';[...st.sc].forEach(k=>{const b=SB_B[k],hh=b.w>=10?125:15+(b.w-1)*7;y-=hh;
   s+='<g class="sb-blk" data-b="'+k+'"><rect x="220" y="'+y+'" width="104" height="'+hh+'" rx="4" fill="var(--'+b.c+'-bg)" stroke="var(--'+b.c+')" stroke-width="1.5"/>'+
    (b.s2?'<text x="226" y="'+(y+22)+'" font-size="12" font-weight="600" fill="var(--ink)">'+b.s+'</text><text x="226" y="'+(y+37)+'" font-size="12" font-weight="600" fill="var(--ink)">'+b.s2+'</text><text x="226" y="'+(y+56)+'" font-size="12" font-weight="700" fill="var(--muted)">'+b.w+'+ weeks</text>'
     :'<text x="272" y="'+(y+hh/2+4.2)+'" text-anchor="middle" font-size="12" font-weight="600" fill="var(--ink)">'+b.s+'</text>')+'</g>';y-=1.5;});
  q('.sb-ss').innerHTML=s;
  q('.sb-lk').innerHTML=lock(st.mode==='est');
  q('.sb-tv').textContent=st.mode==='est'?sbWk(t)+' · estimate':sbWk(st.weeks)+' · locked';
  q('.sb-sv').textContent=sbWk(tot)+' of work';
  el.querySelectorAll('[data-m]').forEach(b=>b.classList.toggle('sel',b.dataset.m===st.mode));
  const showApps=st.mode==='app'&&o.apps.length>0;q('.sb-apps').style.display=showApps?'':'none';q('.sb-ak').style.display=showApps?'':'none';
  el.querySelectorAll('[data-w]').forEach(b=>b.classList.toggle('sel',+b.dataset.w===st.weeks));
  el.querySelectorAll('[data-k]').forEach(b=>{const on=st.sc.has(b.dataset.k);b.classList.toggle('sel',on);b.setAttribute('aria-pressed',on);});
  if(q('.sb-md'))q('.sb-md').innerHTML=st.mode==='est'?'Start with a design, end with a number. The time grows to match.':'Start with a number, end with a design. The time is locked.';
  const r=sbRead(st.sc);let ro='<p>'+status()+'</p>';
  if(!o.hideVer&&st.sc.size)ro+='<p>This is <b>'+r[0]+'</b>. '+r[1]+'</p>';
  if(o.marisol&&!o.hideVer&&st.sc.size)ro+='<p>Marisol’s problem: '+(r[2]==='yes'?'<span class="sb-ok">solved</span>, spots refill without texting.':r[2]==='part'?'<b>helped</b>, but Marisol still contacts people herself.':'<span class="sb-no">not helped</span>.')+'</p>';
  q('.sb-ro').innerHTML=ro;}
 const api={el,st,sum,id,
  idle:()=>new Promise(r=>{if(!tm)r();else waits.push(r);}),
  setMode(m){st.mode=m;if(m==='app')st.shown=st.weeks;pile();fire('mode');},
  setWeeks(w){st.weeks=w;if(st.mode==='app')st.shown=w;draw();fire('weeks');},
  toggle(k){if(st.sc.has(k))st.sc.delete(k);else st.sc.add(k);pile();fire('scope');},
  setAll(p){settle();if(p.mode)st.mode=p.mode;if(p.weeks)st.weeks=p.weeks;if(p.scope)st.sc=new Set(p.scope);api.st.sc=st.sc;st.shown=st.mode==='est'?sum():st.weeks;draw();},
  drop(k){return new Promise(res=>{const g=el.querySelector('[data-b="'+k+'"]');if(g)g.classList.add('out');setTimeout(()=>{st.sc.delete(k);draw();res();},450);});},
  read:()=>sbRead(st.sc),draw};
 el.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>api.setMode(b.dataset.m));
 el.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>api.setWeeks(+b.dataset.w));
 el.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>api.toggle(b.dataset.k));
 draw();
 return api;}

/* ---- the request funnel ---- */
/* cfg: {req, who, asker, need (story pieces for a narrow problem, 0 = never), prob, qs:{key:{q,k:'wide'|'narrow'|'flat',a,w[],bit}}, order[], noq, onAsk} */
function sbFunnel(host,cfg){
 const id='sbf'+(++sbN),keys=cfg.order||Object.keys(cfg.qs);
 const st={asked:[],wish:[],bits:[],done:false};
 host.insertAdjacentHTML('beforeend','<div class="sb-fun" id="'+id+'"><svg class="sb-svg" viewBox="0 0 320 206" role="img" aria-label="Request funnel: wide questions widen it, questions about a real moment narrow it">'+
  '<rect x="10" y="2" width="300" height="26" rx="13" fill="var(--pri-bg)" stroke="var(--pri)" stroke-width="1.5"/><text x="160" y="19.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--pri-deep)">'+cfg.req+'</text>'+
  '<path class="sb-fn" fill="var(--soft)" stroke="var(--line2)" stroke-width="2" stroke-linejoin="round"/>'+
  '<g class="sb-wl"></g>'+
  '<circle class="sb-drop" cx="160" cy="178" r="6" fill="var(--pri)" opacity="0" style="transition:cy .5s ease-in,opacity .2s"/>'+
  '<text class="sb-tag" x="160" y="200" text-anchor="middle" font-size="12" font-weight="600" fill="var(--muted)"></text></svg>'+
  '<p class="sb-cnt" aria-live="polite"></p><div class="sb-say" hidden></div><ul class="sb-story"></ul><div class="sb-pw"></div>'+
  (cfg.noq?'':'<div class="sb-k">Ask '+cfg.who.split(',')[0]+'</div><div class="sb-qs" style="margin-top:6px">'+keys.map(k=>'<button class="sb-q" data-q="'+k+'"><span>'+cfg.qs[k].q+'</span></button>').join('')+'</div>')+'</div>');
 const el=document.getElementById(id),q=s=>el.querySelector(s);
 function shape(){
  const live=st.done?0:st.wish.length,nb=st.bits.length;
  let hw=st.done?44:Math.max(40,Math.min(152,70+18*live-22*nb));
  const nw=st.done?5:Math.max(6,30-12*nb);
  const d='M'+(160-hw)+' 38 L'+(160-nw)+' 150 L'+(160-nw)+' 172 L'+(160+nw)+' 172 L'+(160+nw)+' 150 L'+(160+hw)+' 38 Z';
  const p=q('.sb-fn');p.setAttribute('d',d);p.style.d='path("'+d+'")';
  const show=st.wish.slice(0,7);
  q('.sb-wl').innerHTML=show.map((w,i)=>'<text x="160" y="'+(56+13*i)+'" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--no)" opacity="'+(st.done?0:nb?.45:1)+'">'+w+'</text>').join('');
  q('.sb-tag').textContent=st.done?'':(cfg.need&&nb?'narrowing…':st.wish.length>2?'the wish list keeps growing':'');
  q('.sb-cnt').innerHTML='Asked: <b>'+st.asked.length+'</b> · Wish list: <b>'+st.wish.length+'</b>'+(cfg.need?' · Story: <b>'+nb+' of '+cfg.need+'</b>':'');
  q('.sb-story').innerHTML=st.bits.map(b=>'<li>'+b+'</li>').join('');}
 const TAG={wide:'widened',narrow:'narrowed',flat:'no change'};
 const api={el,st,
  ask(k){if(st.asked.includes(k)||st.done)return;const Q=cfg.qs[k];st.asked.push(k);
   (Q.w||[]).forEach(x=>{if(!st.wish.includes(x))st.wish.push(x);});
   if(Q.bit&&!st.bits.includes(Q.bit))st.bits.push(Q.bit);
   const say=q('.sb-say');say.hidden=false;say.innerHTML='<b>'+(cfg.asker||'Ifeoma')+(Q.reply?' replies':' asks')+'</b><span>'+Q.q+'</span><b>'+cfg.who+'</b>'+Q.a;
   const b=el.querySelector('[data-q="'+k+'"]');if(b){b.disabled=true;b.insertAdjacentHTML('beforeend','<span class="t '+Q.k+'">'+TAG[Q.k]+'</span>');}
   if(cfg.need&&st.bits.length>=cfg.need){st.done=true;el.querySelectorAll('.sb-q:not([disabled])').forEach(x=>x.disabled=true);
    const dr=q('.sb-drop');setTimeout(()=>{if(!el.isConnected)return;dr.setAttribute('opacity','1');dr.style.cy='200px';},350);
    setTimeout(()=>{if(!el.isConnected)return;dr.setAttribute('opacity','0');q('.sb-pw').innerHTML='<div class="sb-prob">'+sbIc('target')+'<div><b>THE NARROW PROBLEM</b>'+cfg.prob+'</div></div>';if(cfg.onDone)cfg.onDone(api);},900);}
   shape();if(cfg.onAsk)cfg.onAsk(k,api);}};
 el.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>api.ask(b.dataset.q));
 shape();return api;}

Course.lesson({
  id:'0003', title:'Set boundaries', minutes:20, icon:'target',
  goals:['Set an appetite for an idea before anyone designs it','Answer a raw idea without saying yes or no too early','Narrow a vague request down to a real, specific problem'],
  parts:['Appetite','Fixed time','Raw ideas','Grab-bags'],
  read:'Read chapter 3 of the book for the full “calendar” story and the Files 2.0 lesson.',
  glossary:{
    'raw-idea':'Raw idea: a request or idea as it first arrives, before anyone has thought about its size or the problem behind it.',
    'small-batch':'Small batch: a project one designer and one or two programmers can build in one or two weeks. Several are grouped into one cycle.',
    'big-batch':'Big batch: a project that takes the same small team a full six-week cycle.',
    'grab-bag':'Grab-bag: a vague “redesign” or “2.0” project with no single problem behind it, so nobody knows where it starts or ends.',
    estimate:'Estimate: a guess of how long a design will take. It starts from a design and ends with a number.'
  },
  cheatsheet:[
    'First step of shaping: <b>set boundaries</b>. You need a raw idea, an appetite and a narrow problem.',
    '<b>Appetite</b> = how much time the idea is worth. <b>Small batch</b>: 1–2 weeks. <b>Big batch</b>: 6 weeks.',
    'An estimate starts with a design and ends with a number. An appetite starts with a number and ends with a design.',
    '<b>Fixed time, variable scope</b>: the deadline holds, so the scope gives way. No six-week version conceivable? Narrow it or break off a part.',
    '“Good” is relative: the best solution depends on how much time the idea deserves.',
    'Answer raw ideas with a soft “Interesting. Maybe some day.” No backlog, no promise, no slammed door.',
    'Narrow the problem: ask <b>when</b> the person wanted the thing, and what broke down at that moment. No story and not urgent? Walk away for now.',
    'Watch out for <b>grab-bags</b> (“redesign”, “2.0”). Split them into small projects, each with its own problem and appetite.'
  ],
  steps:[
/* ---------- PART 1: APPETITE ---------- */
{part:0,src:'Warm-up',pts:1,run(L){

{part:0,src:'Chapter 3 · Setting the appetite',run(L){

   L.prose('Every project starts as a '+L.g('raw-idea','raw idea')+', like “studios want a waitlist.” Before anyone talks solutions, ask: how much of our time does this deserve? The book calls the answer the '+L.g('appetite','appetite')+': a time budget for one designer and one or two programmers.')+
   '<div class="sb-cyc" role="img" aria-label="One six-week cycle: three small batches side by side, or one big batch across all six weeks">'+
    '<div class="sb-cyl">'+L.g('small-batch','Small batch')+': 1–2 weeks each, several share a cycle</div>'+
    '<div class="sb-wk"><i class="h1" style="grid-column:span 2">Member export<small>2 wk</small></i><i class="h2" style="grid-column:span 2">“Class cancelled” email<small>2 wk</small></i><i class="h3" style="grid-column:span 2">Longer class description<small>1–2 wk</small></i></div>'+
    '<div class="sb-cyl">'+L.g('big-batch','Big batch')+': the same team, the full cycle</div>'+
    '<div class="sb-wk"><i class="h4" style="grid-column:span 6">One bigger project, like a waitlist, if it’s worth a whole cycle<small>6 wk</small></i></div>'+

{part:0,src:'Chapter 3 · Setting the appetite',pts:5,run(L){

/* ---------- PART 2: FIXED TIME ---------- */
{part:1,src:'Chapter 3 · Fixed time, variable scope',run(L){
  L.h(L.kick('learn','Fixed time, variable scope')+'<h1 class="q">Lock the time, and the scope is what gives way</h1>'+
   L.prose('The book’s author uses the book itself as the example. With one week left, there was time to fix the typos <i>or</i> add a new section to a chapter, not both.')+

{part:2,src:'Chapter 3 · Responding to raw ideas',run(L){

{part:2,src:'Chapter 3 · Narrow down the problem',run(L){

{part:2,src:'Chapter 3 · Case study: Defining “calendar”',run(L){

{part:2,src:'Chapter 3 · Case study: Defining “calendar”',pts:1,

  b.el.querySelector('.sb-chips').insertAdjacentHTML('afterend','<div class="sb-act"><button class="btn pri" id="c16go">'+sbIc('check')+'Check</button></div><div id="c16f"></div>');
  let stage=1,graded=[false,false],first=[false,false];
  const head=()=>{L.$('#c16s').innerHTML=stage===1?'Stage 1 of 2 · Appetite: <b>2 weeks</b>. Load a version that still helps Marisol.':'Stage 2 of 2 · Appetite: <b>6 weeks</b>. Load a version that solves the whole problem.';};head();
  L.$('#c16go').onclick=()=>{const sc=b.st.sc,tot=b.sum(),w=b.st.weeks,j=sc.has('join'),l=sc.has('list'),m=sc.has('msg');
   const ok=stage===1?(tot<=2&&j&&l):(tot<=6&&j&&m);
   if(!graded[stage-1]){graded[stage-1]=true;first[stage-1]=ok;L.award(ok);}
   const f=L.$('#c16f');f.innerHTML='';
   if(!ok){let why;
    if(tot>w)why='It tips: '+sbWk(tot-w)+' over the appetite. Take something off.';
    else if(!sc.size)why='The pan is empty.';
    else if(!j)why='Members have no way to get on the list.';
    else if(stage===1)why='Members can join, but Marisol can’t see who’s waiting, so nothing changes for her.';
    else why='It fits, but Marisol would still contact people herself. The problem says: without texting anyone. Which block does that?';
    L.fb(f,why+(graded[stage-1]?' Fix it and check again.':''),'no');return;}
   if(stage===1){L.fb(f,'<b>Stage 1 done.</b> That’s the cheap two-week waitlist: members join, and Marisol sees who’s waiting and contacts them herself. Not all she wants, but it helps, and it fits.','ok');
    stage=2;head();b.setWeeks(6);return;}
   L.$('#c16go').disabled=true;
   L.sheet(first[0]&&first[1]?'ok':'info','Two good waitlists','At six weeks, members join and an open spot is offered automatically, so Marisol texts nobody. The narrow problem told you which blocks to keep. Both versions are “good”: which one is right depends on the appetite. Noor and Ifeoma agree the problem is worth a full cycle, a '+L.g('big-batch','big batch')+'. Ifeoma now has all three boundaries: the raw idea, an appetite, a narrow problem.');
   L.done();};}},

/* ---------- PART 4: GRAB-BAGS ---------- */
{part:3,src:'Chapter 3 · Watch out for grab-bags',run(L){
  L.h(L.kick('learn','Watch out for grab-bags')+'<h1 class="q">A “redesign” with no single problem isn’t a project</h1>'+
   L.prose('The worst unclear ideas are redesigns or refactorings that aren’t driven by one problem. The book calls them '+L.g('grab-bag','grab-bags')+': nobody can say what they mean, where they start or where they end.')+
   L.lanes([['x','Grab-bag','“Redesign the Files section.”',4],
            ['check','A starting point','“Rethink Files, because sharing several files takes too many steps.”',2]])+
   L.prose('The second version lets you ask useful questions: what isn’t working, where are there too many steps, and what can stay as it is?')+
   L.note('A sure sign of a grab-bag is a “2.0” label.','alert'));
  L.done();}},
{part:3,src:'Chapter 3 · Watch out for grab-bags',
 solve:async L=>{for(const k of ['g','i','p']){L.$('#p18 [data-p="'+k+'"]').click();await L.sleep(20);for(const b of L.$$('#f18 .sb-q'))b.click();for(let i=0;i<60&&!L.$('#f18o');i++)await L.sleep(30);}for(let i=0;i<40&&!L.d18;i++)await L.sleep(30);},
 run(L){
  L.d18=false;
  L.h(L.kick('ex','Find the limits')+'<h1 class="q">Not every request narrows. Run all three through the funnel.</h1><div class="sb-ctl" id="p18"></div><div id="f18"></div>');
  const E={
   g:['Pinecone 2.0',{req:'“Pinecone 2.0: a new studio dashboard”',who:'Noor',need:0,qs:{
      when:{q:'“When did you last need it? What were you doing?”',k:'wide',a:'“Not one moment. Everything could be better.”',w:['Better reports','A new look']},
      what:{q:'“What’s not working today?”',k:'wide',a:'“The schedule page, payments, reports, the colours… all of it.”',w:['Schedule page','Payments','Colours']}}},
    '<b>A grab-bag.</b> Even the “when” question widened it: there’s no single problem, so nobody can say where it starts or ends. The “2.0” label was the tell. Find the specific problems and split them into small projects.'],
   i:['Instagram',{req:'“Instagram integration”',who:'A studio owner',need:0,qs:{
      when:{q:'“When did you last wish you had it?”',k:'flat',a:'“Hmm. I can’t think of a time. It would just be nice.”'},
      what:{q:'“What would it fix for you?”',k:'flat',a:'“Nothing urgent, really.”'}}},
    '<b>No story, and not urgent.</b> The appetite also caps how much research is worth it. If you can’t get your hands around the problem, walk away for now. A new request or story may bring better insight later.'],
   p:['Permission rules',{req:'“We need more complex permission rules”',who:'A Basecamp customer',asker:'The team',need:1,prob:'People don’t know that archiving a file hides it for everyone.',qs:{
      rules:{q:'“Which rules do you want?”',k:'wide',a:'“Who can archive, who can delete, who can move things…”',w:['Archive rules','Delete rules']},
      when:{q:'“When did you run into this? What happened?”',k:'narrow',a:'“Someone archived a file, not knowing it would disappear for everyone else.”',bit:'<b>The moment:</b> a file archived by someone who didn’t know what archiving does.'}}},
    '<b>Narrowing can shrink the whole project.</b> Built as asked, the new rules could easily take six weeks. A warning on the archive button that explains the effect took one day. (A story from the book.)']};
  const seen=new Set();
  Object.keys(E).forEach(k=>{const x=document.createElement('button');x.className='chip';x.dataset.p=k;x.innerHTML=sbIc('flask')+E[k][0];
   x.onclick=()=>{[...L.$('#p18').children].forEach(y=>y.classList.toggle('sel',y===x));const host=L.$('#f18');host.innerHTML='';
    const cfg=E[k][1],nq=Object.keys(cfg.qs).length;
    const fin=f=>{if(!host.isConnected||L.$('#f18o'))return;seen.add(k);x.classList.add('ok');
     const d=L.fb(host,E[k][2]+'<br><span class="small">'+seen.size+' of 3 tried</span>','info');d.id='f18o';
     if(seen.size===3&&!L.d18){L.d18=true;L.done();}};
    sbFunnel(host,Object.assign({},cfg,{onAsk:(q,f)=>{if(!cfg.need&&f.st.asked.length===nq)fin(f);},onDone:fin}));};
   L.$('#p18').appendChild(x);});
  L.$('#p18 [data-p="g"]').click();}},
{part:3,src:'Chapter 3 · Watch out for grab-bags',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">How Basecamp recovered from “Files 2.0”</h1>');
  L.beats(L.card,[
   ['The kick-off','Excited about improving a big part of the app, the team started a “Files 2.0” project. They knew Files had many problems.'],
   ['The mistake','Nobody asked what exactly they would do. Nobody knew what “done” looked like.'],
   ['The mess','The project turned into a mess.'],
   ['The recovery','They split it into smaller projects, like <b>better file previews</b> and <b>custom folder colors</b>, each with its own appetite and clear expectations. Those shipped.']],
   'A grab-bag hides several small projects. Pull them apart, give each its own problem and appetite, and they can ship. That’s what Ifeoma should do with Noor’s “Pinecone 2.0”.');}},
{part:3,src:'Chapter 3 · Watch out for grab-bags',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Grab-bag or real starting point?',['Grab-bag','Real starting point'],[
   ['Noor: “Pinecone 2.0: a new studio dashboard.”',0,'The “2.0” label and no named problem. Nobody knows where it ends.'],
   ['“Rethink the schedule page, because moving a class to another room means deleting it first.”',1,'One clear pain. You can ask what’s broken and what can stay.'],
   ['“Refactor the whole booking system.”',0,'No problem is named, so there’s no way to know when it’s done.'],
   ['“Members miss that a class was cancelled, because the email looks like an ad.”',1,'A specific breakdown. That can be shaped.'],
   ['“Give the mobile app a fresh redesign.”',0,'A redesign with no single problem behind it.']]);}},
{part:3,src:'Chapter 3 · Boundaries in place',pts:4,run(L){
  L.h(L.kick('pr','Boundaries in place?')+'<h1 class="q">Which ideas are ready for the next step, finding the elements of a solution?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Ready','Needs an appetite','Needs a narrow problem'],[
   ['Clearer cancellation email: members miss it because it looks like an ad. Worth two weeks.',0,'Raw idea, appetite and a narrow problem. Ready.'],
   ['Gift cards: owners lose sales at the front desk when visitors ask for one. Nobody has said how much time it deserves.',1,'The problem is clear, but there’s no time budget yet.'],
   ['Better reports: worth six weeks. Owners “want more insight.”',2,'There’s an appetite, but “more insight” isn’t a specific breakdown.'],
   ['Waitlist: fill spots after cancellations without texting by hand. One full cycle.',0,'All three boundaries are in place.']],
   'All three boundaries (a raw idea, an appetite and a narrow problem) must be in place before you look for the elements of a solution.');}}
  ]
});
