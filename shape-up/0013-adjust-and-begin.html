/* ---------- the people-and-hats board ---------- */
const HAT={S:['Shape','var(--h3)'],B:['Bet','var(--h4)'],D:['Design','var(--h2)'],P:['Program','var(--pri)'],U:['Support','var(--muted)']};
const HB_NEED=n=>Math.max(0,Math.min(1,(n-3)/7));   /* illustrative: 0 at 3 people, 1 at 10 or more */
const PINS=[['C','Six-week cycles'],['K','Cool-down'],['F','Formal pitches'],['T','Betting table'],['D','Dedicated shapers']];
const TRUTHS=[['pencil','Shape before you build','Shape first'],['scale','Bet with a capped downside','Capped bets'],['compass','Separate knowns from unknowns','Knowns vs unknowns']];
/* who wears which hats at headcount n (illustrative) */
function hbPeople(n){
  const k=n<=3?3:n<=5?2:n<=8?1:0;
  const prim=['P',n>=6?'S':'D',n>=8?'B':'U'].slice(0,n);
  const rest=Math.max(0,n-3),sup=n>=8?Math.max(1,Math.round(n*.2)):0,sh2=n>=20?1:0,rem=rest-sup-sh2;
  const des=n>=6?Math.max(1,Math.round(rem/3.5)):0,progs=rem-des;
  const teams=[];for(let t=0;t<des;t++)teams.push(['D']);
  const loose=[];for(let p=0;p<progs;p++){if(des)teams[p%des].push('P');else loose.push('P');}
  const all=prim.concat(sh2?['S']:[],...teams,loose,Array(sup).fill('U'));
  return all.map((p,i)=>{const h=[p];['U','B','S','D','P'].filter(x=>x!==p).slice(0,k).forEach(x=>h.push(x));
    if(i<3&&n>3&&!h.includes('B'))h.push('B');return {p,h};});}
/* one person: body, head, a stack of hats */
function hbFig(x,yb,s,hats,lab,name){
  const bw=s*.5,bh=Math.min(26,s*.26),hr=Math.min(13,s*.13),hy=yb-bh-hr-1;
  let o='<path d="M'+(x-bw/2).toFixed(1)+' '+yb.toFixed(1)+'v'+(-bh*.45).toFixed(1)+'a'+(bw/2).toFixed(1)+' '+(bh*.55).toFixed(1)+' 0 0 1 '+bw.toFixed(1)+' 0v'+(bh*.45).toFixed(1)+'z" fill="var(--line2)"/><circle cx="'+x.toFixed(1)+'" cy="'+hy.toFixed(1)+'" r="'+hr.toFixed(1)+'" fill="var(--line2)"/>';
  const ph=lab?15:Math.max(4,s*.15),pw=lab?Math.min(s-6,70):s*.62;let y=hy-hr-2;
  hats.forEach(h=>{y-=ph;o+='<rect x="'+(x-pw/2).toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+pw.toFixed(1)+'" height="'+(ph-1.5).toFixed(1)+'" rx="'+(lab?5:2)+'" fill="'+HAT[h][1]+'"/>'+(lab?'<text x="'+x.toFixed(1)+'" y="'+(y+ph*.66).toFixed(1)+'" class="hb-ht">'+HAT[h][0]+'</text>':'');y-=1.5;});
  if(name)o+='<text x="'+x.toFixed(1)+'" y="'+(yb+14).toFixed(1)+'" class="hb-nm">'+name+'</text>';
  return o;}
function hbNames(n){return n===3?['Tomás','Ifeoma','Noor']:n===15?['Tomás','Ifeoma','Noor','Kenji','Bea']:[];}
function hbSvgInner(n,names,H){H=H||262;
  const ppl=hbPeople(n),cols=n<=3?n:n<=8?4:n<=15?5:n<=20?7:10,rows=Math.ceil(n/cols),W=340;
  const s=Math.min(104,(W-20)/cols),lab=s>=60;
  const bh=Math.min(26,s*.26),hr=Math.min(13,s*.13),ph=lab?16.5:Math.max(5.5,s*.15+1.5),mh=Math.max(...ppl.map(q=>q.h.length));
  const nm=names&&names.length?14:0,content=bh+2*hr+3+mh*ph+nm,rowH=Math.min((H-6)/rows,content+10),y0=(H-rows*rowH)/2;
  let o='';ppl.forEach((q,j)=>{const r=Math.floor(j/cols),c=j%cols,inRow=Math.min(cols,n-r*cols);
    const x=W/2+(c-(inRow-1)/2)*s,yb=y0+r*rowH+(rowH+content)/2-nm;
    o+=hbFig(x,yb,s,q.h,lab,names&&names[j]);});
  return o;}
const hbLeg=()=>'<div class="hb-leg" aria-hidden="true">'+Object.keys(HAT).map(k=>'<span><i style="background:'+HAT[k][1]+'"></i>'+HAT[k][0]+'</span>').join('')+'</div>';
const hbAvg=n=>{const p=hbPeople(n);return (p.reduce((a,q)=>a+q.h.length,0)/p.length).toFixed(1);};
const hbWho=n=>n<=3?'Everyone, in between building':n<=5?'Ifeoma, squeezed in between design work':n<=8?'Ifeoma, mostly; others now design':n<20?'Ifeoma, full time, out of cycle':'Ifeoma and a second shaper, out of cycle';
const hbNews=n=>n<=3?'One message in the group chat and everyone knows':n<=8?'Chat mostly still works':'Chat threads and quick meetings pile up';
const hbFitH=n=>{const ppl=hbPeople(n),cols=n<=3?n:n<=8?4:n<=15?5:n<=20?7:10,rows=Math.ceil(n/cols),s=Math.min(104,320/cols),lab=s>=60;
  const c=Math.min(26,s*.26)+2*Math.min(13,s*.13)+3+Math.max(...ppl.map(q=>q.h.length))*(lab?16.5:Math.max(5.5,s*.15+1.5))+(hbNames(n).length?14:0);return Math.round(rows*(c+10)+6);};
const hbPic=(n,label)=>{const H=hbFitH(n);return '<div class="hb"><svg viewBox="0 0 340 '+H+'" role="img" aria-label="'+label+'">'+hbSvgInner(n,hbNames(n),H)+'</svg>'+hbLeg()+'</div>';};
/* hbBoard(host,{id,n,slider,pins:[on keys],showPins,lockPins,truths,onN(n),onPin()}) */
function hbBoard(host,o){
  const id=o.id,st={n:o.n||3,pins:new Set(o.pins||[])};
  const el=document.createElement('div');el.className='hb';
  el.innerHTML=(o.truths?'<p class="hb-tpl">BASIC TRUTHS · PINNED AT EVERY SIZE</p><div class="hb-tps">'+TRUTHS.map((t,j)=>'<button class="hb-tp" id="'+id+'-t'+j+'" aria-label="'+t[1]+'">'+L_ic('lock')+t[2]+'</button>').join('')+'</div>':'')+

      const t=L.$('#tpl');t.style.opacity=0;setTimeout(()=>{if(!t.isConnected)return;t.setAttribute('x','262');t.textContent='rush!';t.style.fill='var(--no)';t.style.opacity=1;},500);}
    if(j===1){L.$('#tpc').style.opacity=0;L.$('#tpo').style.opacity=1;L.$('#tpb').setAttribute('stroke-dasharray','6 5');L.$('#tpb').setAttribute('stroke','var(--no-strong)');}
    if(j===2){[0,1,2].forEach(i=>{const g=L.$('#tk'+i);g.style.transform='translate('+(214+i*26)+'px,78px)';g.querySelector('circle').setAttribute('stroke','var(--no-strong)');});
      L.$('#tpr').style.opacity=0;L.$('#tpo').style.opacity=1;}};
  TRUTHS.forEach((t,j)=>L.$('#tp-'+j).onclick=()=>{cur=j;TRUTHS.forEach((_,q)=>L.$('#tp-'+q).classList.toggle('sel',q===j));kept(j);
    L.$('#tp-cap').innerHTML='<b class="t">With the truth in place</b>'+T[j].kept+'.';L.$('#tp-go').disabled=false;});
  L.$('#tp-go').onclick=()=>{if(cur<0||L.$('#tp-go').disabled)return;const j=cur;L.$('#tp-go').disabled=true;setTimeout(()=>{if(svg.isConnected&&cur===j)pull(j);},40);
    pulled.add(j);L.$('#tp-'+j).classList.add('done');gate();
    L.$('#tp-cap').innerHTML='<b class="t">Pulled out: '+T[j].pull.toLowerCase()+'</b>'+T[j].sheet+(j===0?L.quote('the universe will force us to make trade-offs later in a mad rush','Ryan Singer, Shape Up, “Adjust to Your Size”'):'');
    if(pulled.size===3){L.sheet('info','The truths don’t care about size','Pull any one out and the same trouble comes back, for a team of two or of fifty. That’s why they stay pinned while the practices on top change.');L.done();}};
  kept(0);svg.style.opacity=.35;L.$('#tp-0').addEventListener('click',()=>svg.style.opacity=1);[1,2].forEach(j=>L.$('#tp-'+j).addEventListener('click',()=>svg.style.opacity=1));}},

{part:0,src:'Appendix · Adjust to Your Size · Basic truths vs. specific practices',pts:8,run(L){
  L.h(L.kick('pr','Truth or practice?')+'<h1 class="q">Sort each item: does it hold at any size, or depend on size?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Basic truth','Specific practice'],[
   ['Figure out the right work before building it',0,'It takes work to find the right work, at any size.'],
   ['Work in cycles of exactly six weeks',1,'Six weeks fits a certain size. A tiny team can make bets of any length.'],
   ['Cap the downside of every bet you make',0,'Whatever the time frame, bet on purpose and cap the downside with a circuit breaker.'],
   ['A two-week cool-down between cycles',1,'Useful once you have teams to coordinate; a tiny team can skip it.'],
   ['Make trade-offs early, not in a last-minute rush',0,'Shaping’s core reason holds everywhere.'],
   ['Written pitches read before a formal meeting',1,'Tiny teams can do without formal pitches.'],
   ['Order the work so unknowns get solved first',0,'Unknowns show up for every team.'],
   ['Dedicated shapers working out of cycle',1,'Small teams just switch hats instead.']],
   'Keep the truths always. Adopt the practices when your size calls for them.');}},

{part:1,src:'Appendix · Big enough to specialize',pts:1,
 solve:async L=>{L.$('#pw-o1').click();await L.sleep(20);L.$('#pw-go').click();await waitFor(L,'#pw-end',4000);},
 run(L){
  L_ic=L.ic;let picked=false,ran=false;
  const EV={6:'A decision about the waitlist gets lost in a long chat thread.',9:'Bea gets pulled off a project to answer a studio owner’s question.',12:'Studio reports drags on for months with no end in sight.',15:'Nobody has time to figure out what to build next.'};
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">Pinecone grows from 3 people to 15 but keeps winging it: no cycles, no betting table, no dedicated shaper. What happens?</h1>'+
   '<div class="opts" id="pw-o"></div><div class="hb-btns" id="pw-bt" style="margin-top:0"></div><div id="pw-b"></div>');
  const O=['Little changes: one group chat keeps everyone in sync','Staying in sync takes more and more time, and work gets dropped','Work speeds up, since each person can now wear more hats'];
  O.forEach((t,j)=>{const b=document.createElement('button');b.className='opt';b.id='pw-o'+j;b.innerHTML='<span class="key">'+(j+1)+'</span><span>'+t+'</span>';
    b.onclick=()=>{if(picked)return;picked=true;const ok=j===1;L.award(ok);[...L.$('#pw-o').children].forEach((x,q)=>{x.setAttribute('aria-disabled','true');if(q!==j&&q!==1)x.classList.add('dim');});
      b.classList.add(ok?'ok':'no');if(!ok)L.$('#pw-o1').classList.add('ok');
      L.$('#pw-bt').innerHTML='<button class="btn pri" id="pw-go">'+L.ic('play')+'Watch Pinecone grow</button>';
      L.$('#pw-go').onclick=()=>{if(ran)return;ran=true;L.$('#pw-bt').innerHTML='';let n=3;try{board.el.scrollIntoView({behavior:'smooth',block:'start'});}catch(e){}
        const iv=setInterval(()=>{if(!L.$('#pw-b')){clearInterval(iv);return;}n++;board.set(n);
          if(EV[n])L.$('#pw-log').insertAdjacentHTML('beforeend','<li><b>At '+n+' people · </b>'+EV[n]+'</li>');
          if(n>=15){clearInterval(iv);L.$('#pw-bt').innerHTML='<span id="pw-end"></span>';
            L.sheet(ok?'ok':'no',ok?'The asset flips to a liability':'Watch the bottom bar','At three, winging it was a strength: one chat message and everyone knew. At fifteen, the same freedom costs time, things fall through the cracks, and nobody is free to shape. That’s the moment the book says to take on cycles, a cool-down and a betting table. <i>(The events are illustrative.)</i>');L.done();}},190);};};
    L.$('#pw-o').appendChild(b);});
  const board=hbBoard(L.$('#pw-b'),{id:'pw',n:3,showPins:true,lockPins:true,pins:[],noRo:true,mid:'<ul class="hb-log" id="pw-log"></ul>'});}},

{part:1,src:'Appendix · Small enough to wing it · Big enough to specialize',pts:2,
 solve:async L=>{hbSetPins(L,'fp',[]);L.$('#fp-go').click();await L.sleep(30);hbSetPins(L,'fp',PINS.map(p=>p[0]));L.$('#fp-go').click();await L.sleep(30);},
 run(L){
  L_ic=L.ic;let stage=0,tries=[0,0];
  L.h(L.kick('try','Fit the practices')+'<h1 class="q">Pin only what Pinecone needs: no overhead, nothing slipping. First at 3 people, then at 15.</h1>'+
   '<p class="hb-gate" id="fp-s" style="margin-top:0"></p><div id="fp-b"></div><div id="fp-f"></div><div class="hb-btns"><button class="btn pri" id="fp-go">'+L.ic('check')+'Check</button></div>');
  const board=hbBoard(L.$('#fp-b'),{id:'fp',n:3,showPins:true,fit:true,noRo:true,pins:PINS.map(p=>p[0]),onPin:()=>{L.$('#fp-f').innerHTML='';}});
  const lab=()=>{L.$('#fp-s').innerHTML='<b>Stage '+(stage+1)+' of 2</b> · '+(stage?'Pinecone today, 15 people':'Pinecone’s first year, 3 people');};lab();
  L.$('#fp-go').onclick=()=>{if(stage>1)return;const ok=board.over()<.01&&board.slip()<.01;tries[stage]++;if(tries[stage]===1)L.award(ok);
    L.$('#fp-f').innerHTML='';
    if(!ok){L.fb(L.$('#fp-f'),(board.over()>0?'<b>Some pins are overhead.</b> ':'')+(board.slip()>0?'<b>Something is slipping.</b> ':'')+(stage?'At 15 people, chat no longer keeps everyone in sync. Which structure is missing?':'Three people can talk directly. Which pins only slow them down?'),'no');return;}
    if(stage===0){stage=1;board.set(15);lab();L.fb(L.$('#fp-f'),'<b>Clean board.</b> Three people need none of it. Now Pinecone has grown to 15, with the same pins. Look at the bottom bar.','ok');}
    else{stage=2;L.$('#fp-go').hidden=true;L.sheet('ok','Structure to fit the size','At 3 people every practice was overhead; at 15 every one earns its keep. The basic truths never changed. Only the scaffolding around them did.');L.done();}};}},

{part:1,src:'Appendix · Small enough to wing it · Big enough to specialize',
 solve:async L=>{for(let j=0;j<4;j++){L.$('#lm-'+j).click();await L.sleep(20);}},
 run(L){
  L_ic=L.ic;const seen=new Set();let fin=false;
  const PR=[['2 people, full ritual',()=>{b.set(2);b.setPins(['T','K']);},'<b class="t">Overhead, nothing gained</b>Two people can decide in one chat message. A formal betting table and a two-week break between cycles add meetings and waiting, and solve a problem they don’t have yet.'],
   ['15 people, winging it',()=>{b.set(15);b.setPins([]);},'<b class="t">Things slip</b>No cycles, no table, nobody free to shape. Staying in sync takes over the week, and work gets dropped. Winging it stopped working long before 15.'],
   ['Pull a basic truth',()=>{b.hitTruths();},'<b class="t">They don’t come off</b>The three truths hold at two people and at fifty. Drop shaping and deadlines force the trade-offs later. Drop capped bets and promises run open-ended. Ignore unknowns and they arrive with no room left.'],
   ['6 people: in between',()=>{b.set(6);b.setPins(['C','T']);},'<b class="t">A judgment call</b>Here every pin is “your call”. The book gives no headcount for the switch. The signal is in the work: when staying in sync takes over your week and work gets dropped, add structure.']];
  L.h(L.kick('ex','Limits')+'<h1 class="q">Where does fitting to size stop helping, or go wrong?</h1><p class="small" style="margin:0">Try each case on the board. <span id="lm-cnt" style="font-weight:600"></span></p>'+
   '<div class="lm-g">'+PR.map((p,j)=>'<button class="chip" id="lm-'+j+'">'+p[0]+'</button>').join('')+'</div><div id="lm-b"></div>');
  const b=hbBoard(L.$('#lm-b'),{id:'lm',n:6,slider:true,showPins:true,truths:true,noRo:true,pins:['C','T'],mid:'<div class="hb-say" id="lm-say" aria-live="polite"><b class="t">Pick a case above</b>Each one jumps the board to an extreme.</div>',onTruth:()=>{L.$('#lm-say').innerHTML=PR[2][2];}});
  const cnt=()=>{L.$('#lm-cnt').textContent='Cases tried: '+seen.size+' of 4';};cnt();
  PR.forEach((p,j)=>L.$('#lm-'+j).onclick=()=>{PR.forEach((_,q)=>L.$('#lm-'+q).classList.toggle('sel',q===j));p[1]();seen.add(j);cnt();L.$('#lm-say').innerHTML=p[2];try{b.el.scrollIntoView({behavior:'smooth',block:'start'});}catch(e){}
    if(!fin&&seen.size>=3){fin=true;L.sheet('info','Fit the practices, never the truths','Too much structure for a tiny team is pure overhead. Too little for a big one lets things slip. In between there’s no magic number: watch for syncing up taking over the week. And the basic truths stay at every size.');L.done();}});}},

{part:2,src:'Appendix · How to Implement Shape Up in Basecamp (tool-neutral summary)',pts:1,
 solve:async L=>{const C=L.tzC;for(let j=0;j<C.length;j++){L.$('#tz-c'+j).click();L.$('#tz-z'+C[j][1]).click();await L.sleep(5);}L.$('#tz-go').click();},
 run(L){
  const C=[['Pitches, posted for the bettors to read',0,'Pitches live in the small private space where shapers, trusted reviewers and the betting table discuss them.'],
   ['A kick-off message with the pitch',1,'Each bet’s project opens with the pitch, or a retelling of the shaped work, for the team to refer back to.'],
   ['One to-do list per scope',2,'Lists match scopes, and the team only finds scopes after getting oriented. They add more as they discover them.'],
   ['A hill chart dot per scope',2,'Each scope’s list gets its own dot, so the team can show where each piece stands.'],
   ['Noor’s task list for the team, written before kick-off',3,'Tasks written up front by someone else are guesses. The team discovers and tracks its own tasks, and finds its own scopes.'],
   ['The whole company, added to the shaping space',3,'Keep the shaping space small. Announce the bets more widely somewhere else when a cycle kicks off.']];
  L.tzC=C;
  const fig=(names,hats)=>{let s='<svg class="fig" viewBox="0 0 70 36" aria-hidden="true">';names.forEach((_,j)=>{s+=hbFig(12+j*23,34,30,hats[j],false,'');});return s+'</svg>';};
  const Z=[['Private shaping space','Ifeoma, Noor, Tomás',fig([1,2,3],[['S'],['B'],['B']])],['Waitlist project · day 1','Kenji and Bea',fig([1,2],[['D'],['P']])],['Waitlist project · after getting oriented','Kenji and Bea, a few days in',fig([1,2],[['D'],['P']])],['Doesn’t belong anywhere','Leave it off the board','']];
  let sel=null,checked=false;
  L.h(L.kick('try','Pin the pieces')+'<h1 class="q">Set up Pinecone’s tool for the waitlist cycle. Tap a card, then tap where it goes.</h1>'+
   '<div class="tz">'+Z.map((z,j)=>'<div class="tz-z'+(j===3?' bin':'')+'" id="tz-z'+j+'" role="button" tabindex="0"><div class="tz-h">'+z[2]+'<span><b>'+z[0]+'</b><small>'+z[1]+'</small></span></div><div class="tz-s" id="tz-s'+j+'"></div></div>').join('')+'</div>'+
   '<div class="tz-tray" id="tz-tray">'+C.map((c,j)=>'<button class="tz-c" id="tz-c'+j+'">'+c[0]+'</button>').join('')+'</div><div class="hb-btns"><button class="btn pri" id="tz-go">'+L.ic('check')+'Check the board</button></div>');
  const arm=()=>Z.forEach((_,j)=>L.$('#tz-z'+j).classList.toggle('arm',sel!==null));
  C.forEach((c,j)=>{L.$('#tz-c'+j).onclick=e=>{e.stopPropagation();if(checked)return;sel=sel===j?null:j;C.forEach((_,q)=>L.$('#tz-c'+q).classList.toggle('sel',q===sel));arm();};});
  Z.forEach((z,j)=>{const go=()=>{if(checked||sel===null)return;const b=L.$('#tz-c'+sel);b.classList.remove('sel');b.dataset.z=j;L.$('#tz-s'+j).appendChild(b);sel=null;arm();};
    L.$('#tz-z'+j).onclick=go;L.$('#tz-z'+j).onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}};});
  L.$('#tz-go').onclick=()=>{if(checked)return;if(L.$('#tz-tray').children.length){L.err('Place every card first');return;}checked=true;
    let n=0;const wrong=[];C.forEach((c,j)=>{const b=L.$('#tz-c'+j),ok=+b.dataset.z===c[1];if(ok)n++;else wrong.push(c);b.classList.add(ok?'ok':'no');});
    const ok=n===C.length;L.award(ok);
    L.sheet(ok?'ok':'no',ok?'A tidy board':n+' of '+C.length+' in place',(ok?'':wrong.map(c=>'<b>'+c[0]+':</b> '+c[2]).join(' ')+' ')+'Shaping stays small and private; each bet gets its own project; the team makes the lists and dots once it finds the scopes.');L.done();};}},

   '<g id="bt-e" class="bt-g"><rect x="176" y="8" width="158" height="180" rx="12" fill="none" stroke="var(--line2)" stroke-width="2" stroke-dasharray="6 5"/><text x="255" y="102" text-anchor="middle">No project yet</text></g>'+
   '<g id="bt-g2" class="bt-g" style="opacity:0"><path d="M152 66H170" stroke="var(--ink)" stroke-width="2.5"/><path d="M165 61l6 5-6 5" stroke="var(--ink)" stroke-width="2.5" fill="none"/><rect x="176" y="8" width="158" height="180" rx="12" fill="var(--card)" stroke="var(--pri)" stroke-width="2"/><text x="186" y="28" class="k">Waitlist project</text>'+
   '<rect x="186" y="38" width="138" height="26" rx="6" fill="var(--soft2)"/><text x="194" y="55" style="fill:var(--ink)">Kick-off: the pitch</text></g>'+
   '<g id="bt-g3" class="bt-g" style="opacity:0">'+[['Join waitlist','var(--h2)'],['Notify member','var(--pri)'],['Owner view','var(--h3)']].map((l,i)=>'<rect x="186" y="'+(72+i*22)+'" width="138" height="18" rx="5" fill="none" stroke="'+l[1]+'" stroke-width="1.5"/><circle cx="196" cy="'+(81+i*22)+'" r="4" fill="'+l[1]+'"/><text x="206" y="'+(85+i*22)+'" style="fill:var(--ink)">'+l[0]+' list</text>').join('')+'</g>'+
   '<g id="bt-g4" class="bt-g" style="opacity:0"><path d="M190 182C214 182 228 146 255 146S296 182 320 182" fill="none" stroke="var(--line2)" stroke-width="2.5"/><circle cx="218" cy="166" r="6" fill="var(--h2)"/><circle cx="255" cy="146" r="6" fill="var(--pri)"/><circle cx="294" cy="170" r="6" fill="var(--h3)"/></g></svg>';
  L.h(L.kick('ex','Build it up')+'<h1 class="q">Set up Pinecone’s tool for the waitlist bet. Tap the step that can happen next.</h1>'+svg+
   '<div class="bt-cs">'+ORD.map(j=>'<button class="chip" id="bt-s'+j+'">'+S[j][0]+'</button>').join('')+'</div>'+
   '<div class="hb-say" id="bt-r" aria-live="polite"><b class="t">Step 1 of 5</b>Nothing is set up yet. What has to come first?</div>');
  S.forEach((s,j)=>L.$('#bt-s'+j).onclick=()=>{const b=L.$('#bt-s'+j);if(j<next)return;
    if(j!==next){if(!awarded){awarded=true;L.award(false);}b.classList.remove('hit');void b.offsetWidth;b.classList.add('hit');
      L.$('#bt-r').innerHTML='<b class="t">Not yet: '+s[0].toLowerCase()+'</b>'+s[2];return;}
    b.classList.remove('hit');b.classList.add('ok');b.innerHTML='<span class="n">'+(j+1)+'</span>'+s[0];b.setAttribute('aria-disabled','true');
    L.$('#bt-g'+j).style.opacity=1;if(j===2)L.$('#bt-e').style.opacity=0;next++;
    L.$('#bt-r').innerHTML='<b class="t">Step '+(j+1)+' of 5 · '+s[0]+'</b>'+s[1];
    if(next===5){const clean=!awarded;if(clean){awarded=true;L.award(true);}
      L.sheet(clean?'ok':'no',clean?'Each piece waits for the one before':'Built, with a few false starts','A pitch before a bet, a bet before a project. And the lists and dots come last, because the team only finds the scopes once it’s working.');L.done();}});}},

/* ---------- PART 4: HOW TO BEGIN ---------- */
{part:3,src:'Appendix · How to Begin to Shape Up',run(L){
  L.h(L.kick('learn','Three ways to begin')+'<h1 class="q">You don’t have to change everything at once</h1><div id="tw"></div>'+
   L.prose('<b>A:</b> one protected six-week experiment. <b>B:</b> shape a project and send it through your usual process, when someone else controls the programmers’ time. <b>C:</b> switch from short sprints to six-week cycles.'));
  rmMap(L.$('#tw'),{});
  L.done();}},

{part:3,src:'Appendix · How to Begin to Shape Up · Option A: One six-week experiment',
 solve:async L=>{for(let j=0;j<7&&!L.$('#ra-end');j++){await waitFor(L,'#ra-n:not([disabled])',1500);const b=L.$('#ra-n');if(!b||b.hidden||b.disabled)continue;b.click();await L.sleep(20);}await waitFor(L,'#ra-end',3000);},
 run(L){
  L_ic=L.ic;let at=-1;
  L.h(L.kick('ex','Ride line A')+'<h1 class="q">Ride line A, one station at a time</h1><p class="small" style="margin:0">Option A is the book’s most detailed route. Tap to move the train on.</p>'+
   '<div id="ra-m"></div><div class="rm-ro" id="ra-r" aria-live="polite"><b class="t">Today</b>The whole product team isn’t ready for a big change. One experiment is.</div>'+
   '<div class="rm-later" id="ra-l"><span>Later: map the scopes</span><span>Later still: hill charts</span></div><div class="hb-btns"><button class="btn pri" id="ra-n">'+L.ic('arrow')+'Next station</button></div>');
  const m=rmMap(L.$('#ra-m'),{});const st=RM.A.st;
  L.$('#ra-n').onclick=()=>{const b=L.$('#ra-n');if(b.disabled||m.busy())return;b.disabled=true;
    if(at<st.length-1){const from=at;at++;m.run('A',from,at,420,()=>{if(!L.$('#ra-r'))return;L.$('#ra-r').innerHTML='<b class="t">Station '+(at+1)+' of 5 · '+st[at][0]+'</b>'+st[at][1];b.disabled=false;
        if(at===st.length-1)b.innerHTML=L.ic('arrow')+'Ride to the end';});}
    else{m.run('A',at,null,500,()=>{if(!L.$('#ra-r'))return;m.mark('END','win');b.hidden=true;L.$('#ra-r').className='rm-ro ok';L.$('#ra-r').innerHTML='<b class="t">First win</b>'+RM_END;
      L.$$('#ra-l span').forEach((s,j)=>setTimeout(()=>{if(s.isConnected)s.classList.add('on');},250+j*350));
      L.$('#ra-l').insertAdjacentHTML('beforeend','<span id="ra-end" hidden></span>');
      L.sheet('info','Skip what can wait','Notice what’s missing: no betting table, no scope map, no hill chart. When the team is comfortable finishing one piece, mapping scopes is the same idea repeated. Hill charts come later still.');L.done();});}};}},

{part:3,src:'Appendix · Option A: One six-week experiment · Option B: Start with shaping',pts:1,
 solve:async L=>{L.$('#lp-m [data-h="A1"]').dispatchEvent(new MouseEvent('click',{bubbles:true}));await waitFor(L,'#lp-end',4000);},
 run(L){
  L_ic=L.ic;let picked=false;
  L.h(L.kick('try','Predict, then watch')+'<h1 class="q">Where will line A stop for Lina?</h1>'+
   '<div class="rm-sit"><b>Lina, product lead at a bike-rental app</b>Lina can shape. But the CTO controls the programmers’ time and won’t free anyone for six weeks.</div>'+
   '<p class="small" style="margin:8px 0 0">Tap the station on line A (top) where the train will stop.</p><div id="lp-m"></div><div class="rm-ro" id="lp-r" aria-live="polite"><b class="t">Your prediction</b>Not picked yet.</div>');
  const sit={shaper:true,free:false,control:false,ready:false};
  const m=rmMap(L.$('#lp-m'),{onStation:(k,i)=>{if(picked)return;if(k!=='A'){L.err('Tap a station on line A, the top line');return;}picked=true;
    const res=rmJudge('A',sit),ok=i===res.stop;L.award(ok);m.mark('A'+i,'warn');
    L.$('#lp-r').innerHTML='<b class="t">You predicted: '+RM.A.st[i][0]+'</b>Watch the train…';
    m.run('A',-1,res.stop,900,()=>{if(!L.$('#lp-r'))return;m.mark('A'+res.stop,'block');L.$('#lp-r').className='rm-ro no';
      L.$('#lp-r').innerHTML='<b class="t">Stopped at “'+RM.A.st[res.stop][0]+'”</b>'+res.why+'<span id="lp-end"></span>';
      L.sheet(ok?'ok':'no',ok?'Right station':'It stops at “Free a team”',(ok?'':'Lina can shape, so “Shape” is fine. ')+'The experiment needs one designer and two programmers for six protected weeks, and Lina can’t get them. That’s what line B is for: shape a compelling project and put it through the existing process.');L.done();},true);}});}},

{part:3,src:'Appendix · Fix shipping first · Focus on the end result',run(L){
  L.h(L.kick('learn','Two last pieces of advice')+'<h1 class="q">Fix shipping first. Then judge by the end result.</h1>'+
   '<div class="fx"><svg viewBox="0 0 340 234" role="img" aria-label="Top: insight piles up behind a closed shipping gate. Bottom: zoomed in on hours, a quiet morning looks idle; zoomed out to six weeks, the project ships.">'+
   '<text x="6" y="14" class="k">Fix shipping first</text>'+
   [0,1,2,3,4].map(i=>'<g transform="translate('+(26+(i%3)*24)+' '+(i<3?52:34)+')"><circle r="9" fill="var(--h3-bg)" stroke="var(--h3)" stroke-width="2"/><rect x="-3.5" y="7" width="7" height="5" rx="1" fill="var(--h3)"/></g>').join('')+
   '<text x="50" y="80" text-anchor="middle">insight piles up</text>'+
   '<path d="M92 46h110" stroke="var(--line2)" stroke-width="5"/><rect x="200" y="26" width="9" height="40" rx="2" fill="var(--no-strong)"/><text x="205" y="80" text-anchor="middle" style="fill:var(--no)">can’t ship</text>'+
   '<path d="M216 46h40" stroke="var(--line2)" stroke-width="5" stroke-dasharray="5 4"/><rect x="262" y="32" width="70" height="28" rx="7" fill="none" stroke="var(--line2)" stroke-width="2" stroke-dasharray="4 3"/><text x="297" y="50" text-anchor="middle">customers</text>'+
   '<line x1="6" y1="98" x2="334" y2="98" stroke="var(--line)" stroke-width="1.5"/>'+
   '<text x="6" y="118" class="k">Focus on the end result</text>'+
   '<text x="6" y="138">Zoomed in: day 3, hour by hour</text>'+[0,1,2,3,4,5,6,7].map(i=>'<rect x="'+(6+i*41)+'" y="145" width="38" height="16" rx="3" fill="'+(i<3?'var(--soft2)':'var(--pri-bg)')+'"/>').join('')+'<text x="6" y="178">Bea reads code all morning. Idle?</text>'+
   '<text x="6" y="204">Zoomed out: six weeks</text><rect x="6" y="211" width="296" height="18" rx="5" fill="var(--pri)"/><circle cx="318" cy="220" r="11" fill="var(--ok-strong)"/><path d="M312 220l4 4 8-8" stroke="var(--card)" stroke-width="2.5" fill="none" stroke-linecap="round"/>'+
   '</svg></div>'+
   L.prose('The best customer insight is useless if you can’t ship it, so get a rhythm of finishing first. And if a quiet day worries you, zoom out: will you feel good about what shipped after six weeks?'));
  L.done();}},

{part:3,src:'Appendix · Option A · Fix shipping first · Focus on the end result',
 solve:async L=>{for(let j=0;j<4;j++){await waitFor(L,'#lr-'+j+':not([disabled])',3000);L.$('#lr-'+j).click();await waitFor(L,'#lr-ok'+j,3500);}},
 run(L){
  L_ic=L.ic;const seen=new Set();let fin=false;
  const PR=[['Research first',m=>m.run('R',-1,null,900,()=>{m.mark('R0','block');}),'no','<b class="t">Dead end: insight with nowhere to go</b>Noor wants a big customer research program before the team can finish projects reliably. The insight piles up, but nothing ships. Build the shipping muscle first; then improve what goes into shaping.'],
   ['Interrupt the team',m=>m.run('A',-1,1,800,()=>{m.mark('A1','block');},true),'no','<b class="t">Stopped at “Free a team”</b>In week 2, Bea is pulled onto customer questions “just for a day”. The whole experiment rests on six weeks nobody interrupts. Break that promise and the test proves nothing.'],
   ['Hand over a task list',m=>m.run('A',-1,2,900,()=>{m.mark('A2','block');},true),'no','<b class="t">Stopped at “Kick off”</b>Noor writes every task for Kenji and Bea before kick-off. But the team is meant to discover and track its own tasks. A list from outside hands them guesses, not responsibility.'],
   ['Fill the idle time',m=>m.run('A',-1,4,900,()=>{m.mark('A4','warn');setTimeout(()=>{if(m.el.isConnected)m.run('A',4,null,500,()=>m.mark('END','win'));},350);}),'warn','<b class="t">A wobble, then a first win</b>On day 3 Bea spends the morning reading booking code, and Noor wants to hand over extra tasks. The book’s answer is to zoom out and picture how six weeks of work will feel once it has shipped. The hours along the way don’t matter.']];
  L.h(L.kick('ex','Limits')+'<h1 class="q">What can derail a first experiment?</h1><p class="small" style="margin:0">Imagine Pinecone had begun with Option A. Try each “what if”. <span id="lr-c" style="font-weight:600"></span></p>'+
   '<div class="hb-btns" style="margin-top:8px">'+PR.map((p,j)=>'<button class="chip" id="lr-'+j+'">'+p[0]+'</button>').join('')+'</div><div id="lr-m"></div><div class="rm-ro" id="lr-r" aria-live="polite"><b class="t">Pick a case</b>Each one sends a train down the map.</div>');
  const m=rmMap(L.$('#lr-m'),{research:true});
  const cnt=()=>{L.$('#lr-c').textContent='Cases tried: '+seen.size+' of 4';};cnt();
  PR.forEach((p,j)=>L.$('#lr-'+j).onclick=()=>{if(m.busy())return;PR.forEach((_,q)=>{L.$('#lr-'+q).classList.toggle('sel',q===j);L.$('#lr-'+q).disabled=true;});m.reset();L.$('#lr-r').className='rm-ro';L.$('#lr-r').innerHTML='<b class="t">Running…</b>';
    p[1](m);const wait=j===3?1900:1050;
    setTimeout(()=>{if(!L.$('#lr-r'))return;PR.forEach((_,q)=>L.$('#lr-'+q).disabled=false);L.$('#lr-r').className='rm-ro '+p[2];L.$('#lr-r').innerHTML=p[3]+'<span id="lr-ok'+j+'"></span>';seen.add(j);cnt();
      if(!fin&&seen.size>=3){fin=true;L.sheet('info','The route only works if you protect it','Research before shipping goes nowhere. Interruptions and task lists from outside break the experiment’s two promises: protected time and a team that owns its work. And a quiet morning isn’t a failure: judge by what ships.');L.done();}},wait);});}},

{part:3,src:'Appendix · How to Begin to Shape Up',pts:3,
 solve:async L=>{const R=['B','C','A'];for(let j=0;j<3;j++){await waitFor(L,'#ch-'+R[j],2000);L.$('#ch-'+R[j]).click();L.$('#ch-run').click();await waitFor(L,'#ch-res'+j,3500);const nx=L.$('#ch-nx');if(nx&&j<2){nx.click();await L.sleep(20);}}},
 run(L){
  L_ic=L.ic;
  const S=[{t:'Ola, head of design at a ticket-selling startup',d:'Ola can shape a project. The CTO decides what every programmer works on.',shaper:true,free:false,control:false,ready:false,best:'B'},
   {t:'Bram, engineering lead at a dog-walking app',d:'The team runs two-week sprints and is worn out by planning meetings. Bram sets the schedule, but nobody has time to shape yet.',shaper:false,free:true,control:true,ready:true,best:'C'},
   {t:'Tess, founder of a recipe app',d:'The whole team isn’t ready for a big change. Tess has time to shape and can free one designer and two programmers.',shaper:true,free:true,control:true,ready:false,best:'A'}];
  let k=0,line=null,running=false,answered=false;
  L.h(L.kick('pr','Challenge · route three companies')+'<h1 class="q">Ifeoma advises three friends on how to begin. Send each one down the line that gets them to a first win.</h1>'+
   '<p class="hb-gate" id="ch-k" style="margin-top:0"></p><div id="ch-s"></div><div class="rm-pick">'+['A','B','C'].map(x=>'<button class="chip" id="ch-'+x+'"><b style="color:'+RM[x].c+'">●</b>Line '+x+'</button>').join('')+'</div>'+
   '<div id="ch-m"></div><div class="rm-ro" id="ch-r" aria-live="polite"><b class="t">Pick a line, then run it</b>The first run for each company counts.</div><div class="hb-btns" id="ch-b"><button class="btn pri" id="ch-run" disabled>'+L.ic('play')+'Run the train</button></div>');
  const m=rmMap(L.$('#ch-m'),{});
  const show=()=>{const s=S[k];answered=false;line=null;m.reset();L.$('#ch-k').innerHTML='<b>Company '+(k+1)+' of 3</b>';
    L.$('#ch-s').innerHTML='<div class="rm-sit"><b>'+s.t+'</b>'+s.d+rmTags(s)+'</div>';['A','B','C'].forEach(x=>L.$('#ch-'+x).classList.remove('sel'));
    L.$('#ch-r').className='rm-ro';L.$('#ch-r').innerHTML='<b class="t">Pick a line, then run it</b>The first run for each company counts.';
    L.$('#ch-b').innerHTML='<button class="btn pri" id="ch-run" disabled>'+L.ic('play')+'Run the train</button>';L.$('#ch-run').onclick=run;};
  ['A','B','C'].forEach(x=>L.$('#ch-'+x).onclick=()=>{if(running)return;line=x;['A','B','C'].forEach(y=>L.$('#ch-'+y).classList.toggle('sel',y===x));if(L.$('#ch-run'))L.$('#ch-run').disabled=false;});
  function run(){if(running||!line||L.$('#ch-run').disabled)return;running=true;L.$('#ch-run').disabled=true;m.reset();const s=S[k],res=rmJudge(line,s),ln=line,first=!answered;answered=true;
    const ok=res.kind==='win';if(first)L.award(ok);
    const fin=()=>{running=false;if(!L.$('#ch-r'))return;
      if(res.kind==='block'){m.mark(ln+res.stop,'block');L.$('#ch-r').className='rm-ro no';L.$('#ch-r').innerHTML='<b class="t">Line '+ln+' stopped at “'+RM[ln].st[res.stop][0]+'”</b>'+res.why+' Pick another line and run again.';}
      else if(res.kind==='detour'){m.mark('END','warn');L.$('#ch-r').className='rm-ro warn';L.$('#ch-r').innerHTML='<b class="t">Line '+ln+' arrives, the slow way</b>'+res.why+' Try another line.';}
      else{m.mark('END','win');L.$('#ch-r').className='rm-ro ok';L.$('#ch-r').innerHTML='<b class="t">Line '+ln+' reaches a first win</b>'+(ln==='A'?'A protected experiment proves the method on one team before asking everyone to change.':ln==='B'?'Ola can’t free anyone, but better-shaped work going through the old process can open the engineers up to longer cycles.':'Six-week cycles cut the planning meetings. With room to breathe, the team starts thinking about shaping.')+'<span id="ch-res'+k+'"></span>';
        if(k<2){L.$('#ch-b').innerHTML='<button class="btn pri" id="ch-nx">'+L.ic('arrow')+'Next company</button>';L.$('#ch-nx').onclick=()=>{if(k>=2)return;k++;show();};}
        else{L.$('#ch-b').innerHTML='';L.sheet('info','Each start fits a situation','B when someone else holds the programmers’ time. C when sprints are eating the team’s focus. A when you can protect one team for six weeks but the rest isn’t ready. Every route ends at a first win that earns the next step.');L.done();}}
      if(!ok&&L.$('#ch-run'))L.$('#ch-run').disabled=false;};
    if(res.kind==='block')m.run(ln,-1,res.stop,800,fin,true);
    else if(res.kind==='detour')m.run(ln,-1,null,1400,fin);
    else m.run(ln,-1,null,1100,fin);}
  show();}},

{part:3,src:'Appendices · review',pts:1,run(L){
  L.h(L.kick('pr','Wrap it up')+'<h1 class="q">Tap each piece until the sentence sums up how to adopt Shape Up.</h1>');
  L.sentence(L.card,[['Copy every practice exactly,','Keep the basic truths,'],['fit the structure to your size,','add every ritual from day one,'],['and start by getting good at shipping.','and start by perfecting your research.']],[1,0,0],
   [['The book separates truths from practices because practices depend on size.'],['Tiny teams can drop most of the structure; add it as you grow.'],['Fix shipping first. Research pays off only once you can finish.']],
   'Truths always, structure to fit, shipping first. That’s how to begin.');}}
  ]
});
</script>
