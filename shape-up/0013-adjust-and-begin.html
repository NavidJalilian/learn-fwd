<title>Adjust to Your Size and Begin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">

</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0013', title:'Adjust to your size and begin', minutes:18, icon:'leaf',
  goals:['Separate the basic truths of Shape Up from the practices that depend on size','Choose how much structure a team needs and set up any project tool to match','Pick a first step to start shaping up, and fix shipping first'],
  parts:['Truths and practices','Fit your size','Set up your tools','How to begin'],
  read:'Read the appendices of the book (“Adjust to Your Size” and “How to Begin to Shape Up”) for the original wording of each option.',
  glossary:{
    'basic-truth':'Basic truth: a part of Shape Up that holds for any team, such as shaping before building or capping the downside of a bet.',
    'specific-practice':'Specific practice: a part of Shape Up that depends on team size, such as six-week cycles or a formal betting table.',
    'shaping-space':'Shaping space: a private area in your project tool where shapers post pitches and the people at the betting table read and discuss them.'
  },
  cheatsheet:[
    '<b>Basic truths</b> hold at any size: shape before building, bet deliberately with a capped downside, separate knowns from unknowns.',
    '<b>Specific practices</b> depend on size: cycle length, cool-down, formal pitches, the betting table, dedicated shapers.',
    '<b>Tiny team (2–3)</b>: wing it. Same people switch hats; be clear which phase you’re in; bets can be any size.',
    '<b>Bigger team</b>: chat and ad-hoc meetings stop working. Add cycles, cool-down, a betting table and people who shape out of cycle.',
    'Any tool works: a private shaping space, one project per bet with a kick-off message, one list per scope, a hill chart dot per scope.',
    'Begin with <b>A</b> one six-week experiment, <b>B</b> shaping only, or <b>C</b> cycles only.',
    '<b>Fix shipping first</b>, then improve research. Judge by the end result, not by hours along the way.'
  ],
  steps:[
/* ---------- PART 1: TRUTHS AND PRACTICES ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">A two-person bakery copies a supermarket chain’s weekly planning meetings, forms and sign-offs. How will that go?</h1>');
  L.mc(L.card,['It will slow them down more than it helps','It will make them run like the big chain'],0,
   'Right. The chain needs that structure because it has hundreds of people. Two bakers can just talk. This lesson is about fitting Shape Up to your size.',
   'Structure that helps hundreds of people mostly gets in the way of two. They can sort things out by talking across the counter.');}},
{part:0,src:'Appendix · Adjust to Your Size · Basic truths vs. specific practices',run(L){
  L.h(L.kick('learn','Basic truths vs. specific practices')+'<h1 class="q">Some parts hold for everyone. Others depend on size.</h1>'+
   L.prose('To apply Shape Up, the book splits it into <b>'+L.g('basic-truth','basic truths')+'</b>, which hold at any size, and <b>'+L.g('specific-practice','specific practices')+'</b>, which depend on how big you are. One basic truth for each part of the method:')+
   L.tiers([['pencil','Shaping','It takes work to figure out the right work. If you don’t make trade-offs up front, deadlines and limits force them on you later, in a rush.','Even if the “team” is your future self'],
            ['scale','Betting','Open-ended promises hurt everyone. Whatever your time frame, be deliberate about what you bet on and cap the downside with a circuit breaker.','Six weeks may not be your number'],
            ['compass','Building','Unknowns show up, hill chart or not. Tell knowns from unknowns so you can order the work and leave room for the unknowns.','Even without a hill chart']]));
  L.done();}},
{part:0,src:'Appendix · Adjust to Your Size · Basic truths vs. specific practices',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Which of these is a basic truth that holds for any team?</h1>');
  L.mc(L.card,['Work in cycles of exactly six weeks','Hold a betting table during cool-down','Cap the downside of every bet you make'],2,
   'Right. Whatever the time frame, the book says to bet deliberately and cap the downside with a circuit breaker.',
   'Six weeks and a betting table are specific practices that fit a certain size. Capping the downside of a bet holds for everyone.');}},
{part:0,src:'Appendix · Adjust to Your Size · Basic truths vs. specific practices',pts:6,run(L){
  L.h(L.kick('pr','Truth or practice?')+'<h1 class="q">Sort each item: does it hold at any size, or depend on size?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Basic truth','Specific practice'],[
   ['Figure out the right work before building it',0,'It takes work to find the right work, at any size.'],
   ['A two-week cool-down between cycles',1,'Useful once you have teams to coordinate; a tiny team can skip it.'],
   ['Make trade-offs early, not in a last-minute rush',0,'Shaping’s core reason holds everywhere.'],
   ['Written pitches read before a formal meeting',1,'Tiny teams can do without formal pitches.'],
   ['Order the work so unknowns get solved first',0,'Unknowns show up for every team.'],
   ['Dedicated shapers working out of cycle',1,'Small teams just switch hats instead.']],
   'Keep the truths always. Adopt the practices when your size calls for them.');}},

/* ---------- PART 2: FIT YOUR SIZE ---------- */
{part:1,src:'Appendix · Small enough to wing it',run(L){
  L.h(L.kick('learn','Small enough to wing it')+'<h1 class="q">Two or three people can throw out most of the structure</h1>'+
   L.prose('In a tiny team everyone wears many hats. The person programming may also be answering customers and fixing a server problem. Long, uninterrupted stretches are hard. But talking is easy: one chat message and everyone knows.')+
   L.list([['x','Drop the scaffolding','No six-week cycles, no cool-down, no formal pitches, no betting table.'],
     ['cycle','Switch hats on purpose','The same people shape and build. Be clear which hat you’re wearing and which phase you’re in.'],
     ['clock','Bets of any size','Set an appetite, shape it, build it, shape the next. Two weeks here, three there.']],2)+
   L.note('You’re still <b>shaping, betting and building</b>, just more fluidly.','leaf'));
  L.done();}},
{part:1,src:'Appendix · Big enough to specialize',run(L){
  L.h(L.kick('learn','Big enough to specialize')+'<h1 class="q">With more people, that freedom turns into a problem</h1>'+
   L.prose('After you hire more people, winging it with chat threads and quick meetings stops working. Coordination eats time and things slip through the cracks.')+
   L.flow([['people','More builders','Someone must spend more time deciding what to build','',3],['pencil','Someone shapes','A founder shapes more and builds less, or a designer moves to shaping out of cycle','',2],['cal','Add structure','Six-week cycles, cool-down and a formal betting table','',1]])+
   L.prose('The book’s own company, at about 50 people with a dozen in product, also set up separate teams for infrastructure, operations and technical support. That way nobody interrupts the designers and programmers working on shaped projects in the cycle.'));
  L.done();}},
{part:1,src:'Appendix · Small enough to wing it · Big enough to specialize',run(L){
  L.h(L.kick('ex','Looking back at Pinecone')+'<h1 class="q">How Pinecone outgrew winging it</h1>');
  L.beats(L.card,[
   ['Three people','In the early days Noor, Tomás and Ifeoma did everything. They set an appetite, sketched, built, then picked the next thing. One bet took two weeks, the next three. No cycles, no betting table, and it worked.'],
   ['Growing to 15','More programmers joined. Decisions got lost in chat threads. Projects like studio reports dragged on for months with no end.'],
   ['Specializing','Ifeoma moved out of building to shape full time. The team adopted six-week cycles, a two-week cool-down and a betting table with Noor, Tomás and Ifeoma.'],
   ['Protecting builders','The support team now answers studio owners, so Kenji and Bea aren’t pulled off their bet every time someone asks a question.']],
   'Same basic truths at every stage. The structure grew with the team.');}},
{part:1,src:'Appendix · Small enough to wing it · Big enough to specialize',pts:1,
 solve:async L=>{const b=L.$('#sz').children;b[0].click();b[1].click();},
 run(L){
  const P=['Six-week cycles','Two-week cool-down','Formal pitches','Betting table','Dedicated shapers','Bets of any length','Same people switch hats'];
  const ON=[[5,6],[0,1,2,3,4]];const seen=new Set();
  L.h(L.kick('pr','Toggle and compare')+'<h1 class="q">Switch between Pinecone at 3 people and at 15. Which practices fit each size?</h1><div id="sz" style="display:flex;gap:6px;flex-wrap:wrap"></div>'+
   '<div style="background:var(--soft);border-radius:16px;padding:14px;margin:10px 0 6px;min-height:110px"><div class="small" id="szc" style="margin-bottom:8px">Choose a size above.</div><div id="szi" style="display:flex;flex-wrap:wrap;gap:6px"></div></div>'+
   '<p class="small">In both cases, the three basic truths stay switched on.</p><div id="szq"></div>');
  ['3 people','15 people'].forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.innerHTML=L.ic('people')+n;b.onclick=()=>{[...L.$('#sz').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(j);
    L.$('#szi').innerHTML=P.map((p,x)=>{const on=ON[j].includes(x);return '<span class="chip static'+(on?' ok':'')+'" style="'+(on?'':'opacity:.35')+'">'+(on?L.ic('check'):L.ic('x'))+p+'</span>';}).join('');
    L.$('#szc').innerHTML='<b>'+n+':</b> '+(j?'structure helps people coordinate':'talking is easy, so stay fluid');
    if(seen.size===2&&!L.$('#szq').innerHTML){const q=L.$('#szq');q.innerHTML='<h2 class="sub">Back when Pinecone was just Noor, Tomás and Ifeoma, what should they have run?</h2>';
      L.mc(q,['A full betting table and six-week cycles','Fluid bets of any size, switching hats'],1,
       'Right. Three people can talk directly. They still shape, set appetites and bet, but without the formal structure.',
       'With three people, a betting table and fixed cycles are overhead. They can shape, bet and build fluidly, keeping the basic truths.');}};L.$('#sz').appendChild(b);});}},
{part:1,src:'Appendix · Small enough to wing it · Big enough to specialize',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Wing it or add structure?',['Wing it','Add structure'],[
   ['Three friends build a studio app; they sit at one table and talk all day.',0,'Talking is easy and everyone wears many hats. Stay fluid.'],
   ['Twelve builders, and decisions keep getting lost in group chat.',1,'Coordination is eating time. That’s the signal to add cycles and a betting table.'],
   ['The only programmer also answers customer emails every morning.',0,'Long uninterrupted cycles are hard when one person covers many roles.'],
   ['Three build teams, and nobody has time to figure out what’s next.',1,'Someone needs to carve out time to shape, out of cycle.'],
   ['Two founders: one bet takes two weeks, the next takes three.',0,'Flexible bet sizes are fine for a tiny team.']]);}},

/* ---------- PART 3: SET UP YOUR TOOLS ---------- */
{part:2,src:'Appendix · How to Implement Shape Up (tool-neutral summary)',run(L){
  L.h(L.kick('learn','Set up your tools')+'<h1 class="q">Any project tool can hold the method</h1>'+
   L.prose('The book has an appendix showing how its authors set this up in the tool they build. You don’t need any particular tool. The setup boils down to four pieces:')+
   L.list([['lock','A private shaping space','For shapers, a few trusted reviewers and the people at the betting table. Pitches get posted and discussed here. Keep it small; announce the bets more widely elsewhere.'],
     ['box','One project per bet','Each bet gets its own project with its designer and programmers. It opens with a kick-off message: the pitch, or a retelling of the shaped work.'],
     ['list','One to-do list per scope','After getting oriented, the team makes a list for each scope they find, with design and programming tasks inside. Add more as they’re discovered.'],
     ['trend','A hill chart dot per scope','Each scope gets a dot. The team drags the dots and adds notes; past updates stay visible.']],1));
  L.done();}},
{part:2,src:'Appendix · How to Implement Shape Up (tool-neutral summary)',pts:1,run(L){
  L.h(L.kick('pr','Put in order')+'<h1 class="q">Pinecone sets up its tool for the next cycle. Put the steps in order.</h1>');
  L.order(L.card,['Ifeoma posts the pitch in the shaping space','The betting table picks the bets','Each bet gets a project with a kick-off message','The team makes one list per scope they find','Each scope gets a dot on the hill chart'],
   'Shaping space, then bets, then a project per bet, then scopes as they’re discovered, then dots to track them.');}},
{part:2,src:'Appendix · How to Implement Shape Up (tool-neutral summary)',pts:1,run(L){
  L.h(L.kick('pr','Your call')+'<h1 class="q">On day one of the cycle, Noor wants to create all of the waitlist’s to-do lists for Kenji and Bea before they start. Good idea?</h1>');
  L.mc(L.card,['Yes, it saves the team time in week one','No, the team makes lists as scopes appear','Yes, if Ifeoma writes them from the pitch'],1,
   'Right. The lists match scopes, and scopes are found by doing the work. The team creates them after getting oriented, and adds more as they discover them.',
   'Lists made up front by someone else turn into assigned tasks. In Shape Up the team discovers the scopes and makes one list per scope as they go.');}},

/* ---------- PART 4: HOW TO BEGIN ---------- */
{part:3,src:'Appendix · How to Begin to Shape Up',run(L){
  L.h(L.kick('learn','Three ways to begin')+'<h1 class="q">You don’t have to change everything at once</h1>'+
   L.tiers([['flask','Option A: one six-week experiment','Shape one project, give one small team six uninterrupted weeks, and show it works.','When one team can be freed'],
            ['pencil','Option B: start with shaping','Shape a project with clearer boundaries than usual and put it through your normal scheduling, however rough.','When someone else controls the programmers’ time'],
            ['cal','Option C: start with cycles','Switch to six-week cycles. Teams used to two-week sprints lose a lot of planning meetings and gain momentum.','For teams used to short sprints']]));
  L.done();}},
{part:3,src:'Appendix · Option A: One six-week experiment',run(L){
  L.h(L.kick('ex','Option A, step by step')+'<h1 class="q">How a single six-week experiment runs</h1>');
  L.beats(L.card,[
   ['1 · Shape','Shape one significant project that fits comfortably in six weeks. Be cautious and leave extra time on the first run.'],
   ['2 · Protect','Free one designer and two programmers for all six weeks. Promise nobody will interrupt them.'],
   ['3 · Skip the table','No formal betting table: just plan for the team to build what you shaped.'],
   ['4 · Kick off','Present the shaped work with all the ingredients of a pitch. Make clear the team will find and track their own tasks.'],
   ['5 · Together','Give the team a shared room or chat channel so they can work closely.'],
   ['6 · One piece','Encourage them to get one piece done early, with screens and code wired together.']],
   'Don’t worry about scope maps or hill charts yet. Uninterrupted time and shaped work alone should give a big leap. Scopes come later, then the hill chart. A good result earns the credibility to change more.');}},
{part:3,src:'Appendix · How to Begin to Shape Up',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">At a company Ifeoma advises, the CTO controls all programmers’ time and won’t free anyone for six weeks. Which option fits?</h1>');
  L.mc(L.card,['Option A: one six-week experiment','Option C: start with six-week cycles','Option B: start with shaping'],2,
   'Right. Shape a strong project with clear boundaries and send it through the existing process. Better-shaped work can open the door to longer cycles later.',
   'Options A and C both need control over the builders’ time. Without it, start by shaping a project well and putting it through the existing process.');}},
{part:3,src:'Appendix · How to Begin to Shape Up',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which way to begin?',['Option A','Option B','Option C'],[
   ['The team already runs two-week sprints and drowns in planning meetings.',2,'Six-week cycles cut the planning overhead and give builders room.'],
   ['Leaders can free one designer and two programmers, but the rest isn’t ready.',0,'One protected experiment can prove the method.'],
   ['A product lead has no say over the engineering schedule at all.',1,'Shape something compelling and send it through the usual process.'],
   ['A manager wants one clear success before asking the whole team to change.',0,'A single six-week experiment builds credibility for a bigger change.']]);}},
{part:3,src:'Appendix · Fix shipping first · Focus on the end result',run(L){
  L.h(L.kick('learn','Fix shipping first, focus on the end result')+'<h1 class="q">Two last pieces of advice</h1>'+
   L.lanes([['check','Fix shipping first','Build the habit of finishing before you polish your research. The best customer insight is useless if you can’t turn it into a shipped project.',1],
            ['target','Focus on the end result','Worried someone will sit idle, or the team won’t use all its time? Zoom out: will you feel good about what shipped after six weeks?',2]])+
   L.prose('When projects ship on time and everyone feels they made progress, that is the success. What happened hour by hour along the way doesn’t matter. It’s the outcome that counts.'));
  L.done();}},
{part:3,src:'Appendix · Focus on the end result',pts:1,run(L){
  L.h(L.kick('pr','Noor’s worry')+'<h1 class="q">On day 3, Noor notices Bea spent the morning reading booking code instead of writing any. Noor wants to give Bea extra tasks “so Bea isn’t idle.” What does the book suggest?</h1>');
  L.mc(L.card,['Ask whether the bet will ship well in six weeks','Track Bea’s hours each day to make sure','Give Bea a second project for slow days'],0,
   'Right. Shift from the small scale to the big one. If the project ships on time and the team feels good about it, the hours along the way don’t matter.',
   'Tracking hours or filling gaps pulls back to the micro level. The book asks: how will we feel about what ships after six weeks?');}},
{part:3,src:'Appendix · Fix shipping first',pts:1,run(L){
  L.h(L.kick('pr','Where to start?')+'<h1 class="q">The other build team rarely finishes on time. Noor proposes a new customer research program first, to improve their ideas. What should come first?</h1>');
  L.mc(L.card,['The research program, to pick better ideas','A rhythm of finishing and shipping projects','Both at once, with equal attention'],1,
   'Right. Build the shipping muscle first. Once the team can reliably finish, better inputs to shaping will pay off.',
   'Insight that never ships doesn’t help customers. The book says to fix shipping first, then improve research and discovery.');}},
{part:3,src:'Appendices · review',pts:1,run(L){
  L.h(L.kick('pr','Wrap it up')+'<h1 class="q">Tap each piece until the sentence sums up how to adopt Shape Up.</h1>');
  L.sentence(L.card,[['Copy every practice exactly,','Keep the basic truths,'],['fit the structure to your size,','add every ritual from day one,'],['and start by getting good at shipping.','and start by perfecting your research.']],[1,0,0],
   [['The book separates truths from practices because practices depend on size.'],['Tiny teams can drop most of the structure; add it as you grow.'],['Fix shipping first. Research pays off only once you can finish.']],
   'Truths always, structure to fit, shipping first. That’s how to begin.');}}
  ]
});
</script>

</html>
