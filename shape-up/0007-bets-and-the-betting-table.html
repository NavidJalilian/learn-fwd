<script>
/* ===== This lesson's own visuals: the year ribbon of cycles, the cycle plan board and Bea's momentum curve ===== */
(function(){const st=document.createElement('style');st.textContent=`
.bt-svg{display:block;width:100%;height:auto;margin:4px 0 2px;touch-action:manipulation}

/* ---------- the year ribbon ---------- */
const BTX=w=>9+w*6;   /* 52 weeks x 6px = 312px */
function btSegs(c,cd){const s=[];let w=0,n=0;
  while(w<52){n++;const e=Math.min(w+c,52);s.push({t:'b',s:w,e:e,n:n});w=e;if(w>=52)break;
    if(cd>0){const e2=Math.min(w+cd,52);s.push({t:'c',s:w,e:e2,n:n});w=e2;}else s.push({t:'z',s:w,e:w,n:n});}
  return s;}
function btDia(x,col){return '<path d="M'+x.toFixed(1)+' 5l6 6-6 6-6-6z" style="fill:var(--'+col+');stroke:var(--card);stroke-width:1"/>';}
/* o: {h, smash, lab:{n:label}, hl:[n], dim:[n], lock:[n], extra, aria, today} */
function btYear(c,cd,o){o=o||{};const S=btSegs(c,cd);let g='';
  S.forEach(x=>{const x0=BTX(x.s),wd=(x.e-x.s)*6;
    if(x.t==='b'){const sm=o.smash&&x.s>=46,col=sm?'h3':(o.red&&o.red.includes(x.n)?'no':'h1'),hl=o.hl&&o.hl.includes(x.n);
      g+='<rect x="'+(x0+.5)+'" y="22" width="'+Math.max(wd-1,1)+'" height="34" rx="3" style="fill:var(--'+(col==='no'?'no-bg':col+'-bg')+');stroke:var(--'+col+');stroke-width:'+(hl?2.6:1.2)+(o.dim&&o.dim.includes(x.n)?';opacity:.35':'')+'"/>';
      const lab=(o.lab&&o.lab[x.n])||(sm?'':String(x.n));
      if(lab&&wd>=Math.max(14,lab.length*7))g+='<text x="'+(x0+wd/2).toFixed(1)+'" y="43.5" text-anchor="middle" style="font-size:11px;font-weight:700;fill:var(--'+col+')">'+lab+'</text>';}
    else if(x.t==='c'){g+='<rect x="'+(x0+.5)+'" y="22" width="'+Math.max(wd-1,1)+'" height="34" rx="3" style="fill:var(--h2-bg);stroke:var(--h2);stroke-width:1.2"/>';g+=btDia(x0+wd/2,'pri');}
    else g+=btDia(x0,'no');});
  const M='JFMAMJJASOND';for(let k=0;k<12;k++)g+='<text x="'+BTX(k*52/12+2.17).toFixed(1)+'" y="71" text-anchor="middle" style="font-size:11px;fill:var(--muted)">'+M[k]+'</text>';
  if(o.today!=null)g+='<line x1="'+BTX(o.today)+'" x2="'+BTX(o.today)+'" y1="18" y2="60" style="stroke:var(--ink);stroke-width:2;stroke-dasharray:3 2"/><text x="'+BTX(o.today)+'" y="86" text-anchor="middle" style="font-size:11px;font-weight:700;fill:var(--ink)">today</text>';
  if(o.smash)g+='<text x="321" y="86" text-anchor="end" style="font-size:11px;font-weight:700;fill:var(--h3)">bug smash</text>';
  return '<svg class="bt-svg" viewBox="0 0 330 '+(o.h||76)+'" role="img" aria-label="'+(o.aria||'A year of six-week cycles and cool-downs')+'">'+g+(o.extra||'')+'</svg>';}
const BT_LEG='<div class="bt-leg"><span><i style="background:var(--h1-bg);border-color:var(--h1)"></i>Build cycle</span><span><i style="background:var(--h2-bg);border-color:var(--h2)"></i>Cool-down</span><span><svg width="13" height="13" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 0l6 6-6 6-6-6z" fill="var(--pri)"/></svg>Betting table</span></div>';
const btRo=rows=>rows.map(r=>'<div><span>'+r[0]+'</span><b class="'+(r[2]||'')+'">'+r[1]+'</b></div>').join('');
const btN=x=>String(Math.round(x*10)/10).replace('.5','½');

/* ---------- Bea's momentum (an illustrative model) ---------- */
/* Speed starts at 0.4 of full speed and climbs 0.12 a day to full. A day pulled away: no progress, and speed drops back to 0.4. */
function btMom(pulls){let m=.4,mb=.4,c=0,cb=0;const a=[0],b=[0];
  for(let d=1;d<=30;d++){cb+=mb;mb=Math.min(1,mb+.12);b.push(cb);
    if(pulls.has(d))m=.4;else{c+=m;m=Math.min(1,m+.12);}a.push(c);}
  return {a:a,b:b};}
const BMX=d=>34+d*(284/30),BMY=v=>160-v/28.2*140;
function btChart(pulls,upto,o){o=o||{};const r=btMom(pulls),U=upto==null?30:upto;let g='';
  [0,50,100].forEach(p=>{const y=160-p*1.4;g+='<line x1="34" x2="318" y1="'+y+'" y2="'+y+'" style="stroke:var(--line);stroke-width:1"/><text x="29" y="'+(y+4)+'" text-anchor="end" style="font-size:11px;fill:var(--muted)">'+p+'%</text>';});
  for(let k=1;k<6;k++)g+='<line x1="'+BMX(5*k)+'" x2="'+BMX(5*k)+'" y1="18" y2="160" style="stroke:var(--line);stroke-width:1;stroke-dasharray:2 3"/>';
  for(let k=0;k<6;k++)g+='<text x="'+BMX(5*k+2.5).toFixed(1)+'" y="176" text-anchor="middle" style="font-size:11px;fill:var(--muted)">Wk '+(k+1)+'</text>';
  pulls.forEach(d=>{g+='<rect x="'+BMX(d-1).toFixed(1)+'" y="18" width="'+(284/30).toFixed(1)+'" height="142" style="fill:var(--no-bg);stroke:var(--no-line);stroke-width:1"/>';});
  if(o.mark)g+='<text x="'+BMX(o.mark-.5).toFixed(1)+'" y="14" text-anchor="middle" style="font-size:11px;font-weight:700;fill:var(--no)">Bea away</text>';
  const path=arr=>'M'+BMX(0)+' '+BMY(0)+arr.slice(1,U+1).map((v,i)=>' L'+BMX(i+1).toFixed(1)+' '+BMY(v).toFixed(1)).join('');
  if(U>0){g+='<path d="'+path(r.b)+'" style="fill:none;stroke:var(--muted);stroke-width:2;stroke-dasharray:5 4"/>';
    g+='<path d="'+path(r.a)+'" style="fill:none;stroke:var(--pri);stroke-width:3;stroke-linejoin:round"/>';}
  const gap=r.b[30]-r.a[30];
  if(U>=30&&gap>.05){const y1=BMY(r.b[30]),y2=BMY(r.a[30]);
    g+='<path d="M321 '+y1.toFixed(1)+' h4 V'+y2.toFixed(1)+' h-4" style="fill:none;stroke:var(--no);stroke-width:2"/>';
    g+='<text x="318" y="'+(y1-6).toFixed(1)+'" text-anchor="end" style="font-size:11.5px;font-weight:700;fill:var(--no)">−'+gap.toFixed(1)+' days</text>';}
  if(o.tap)for(let d=5;d<=25;d++)g+='<rect class="bt-hit" data-d="'+d+'" x="'+BMX(d-1).toFixed(1)+'" y="18" width="'+(284/30).toFixed(1)+'" height="142" style="fill:transparent;cursor:pointer"/>';
  return {svg:'<svg class="bt-svg" viewBox="0 0 330 184" role="img" aria-label="Waitlist progress over 30 working days">'+g+'</svg>',gap:gap,pct:r.a[30]/r.b[30]*100};}
const BT_MLEG='<div class="bt-leg"><span><i style="background:var(--pri);border-color:var(--pri);height:4px;border-radius:2px"></i>Waitlist progress</span><span><i style="border:0;border-top:2px dashed var(--muted);border-radius:0;height:0"></i>Left alone</span><span><i style="background:var(--no-bg);border-color:var(--no-line)"></i>Bea pulled away</span></div>';

/* ---------- the circuit breaker board: two cycles ---------- */
function btBreak(on,k,o){o=o||{};const stop=o.stop!=null?o.stop:on&&k>=6,after=o.after!=null?o.after:on&&k>=6;const X=w=>10+w*19.5;let g='';
  [['Cycle 1',3],['Cool',7],['Cycle 2',11],['Cool',15]].forEach(t=>g+='<text x="'+X(t[1])+'" y="12" text-anchor="middle" style="font-size:11px;font-weight:700;fill:var(--'+(t[0]==='Cool'?'h2':'h1')+')">'+t[0]+'</text>');
  [6,14].forEach(w=>g+='<rect x="'+X(w)+'" y="18" width="39" height="104" rx="4" style="fill:var(--h2-bg)"/>');
  g+='<text x="'+X(0)+'" y="30" style="font-size:11px;fill:var(--muted)">Shaping · Ifeoma</text><text x="'+X(0)+'" y="78" style="font-size:11px;fill:var(--muted)">Build team</text>';
  const bar=(a,b,y,col,lab,dash)=>'<rect x="'+(X(a)+1)+'" y="'+y+'" width="'+Math.max(X(b)-X(a)-2,0)+'" height="26" rx="5" style="fill:var(--'+col+'-bg);stroke:var(--'+col+');stroke-width:1.6'+(dash?';stroke-dasharray:5 3':'')+'"/>'+(lab&&X(b)-X(a)>lab.length*6.4?'<text x="'+(X(a)+7)+'" y="'+(y+17)+'" style="font-size:11px;font-weight:700;fill:var(--'+col+')">'+lab+'</text>':'');
  const end=Math.min(k,on?6:14);
  if(o.bet)g+=bar(0,6,84,'h4','Bet: 6 weeks',true);
  if(end>0)g+=bar(0,end,84,'h4','Class packs');
  if(o.hole)g+=bT(X(4.6),78,'expiry?','font-weight:700;fill:var(--no)','middle')+bT(X(5.4),66,'refunds?','font-weight:700;fill:var(--no)','middle');
  if(stop){g+='<circle cx="'+X(6)+'" cy="97" r="10" style="fill:var(--no-strong)"/><path d="M'+(X(6)-4)+' 93l8 8M'+(X(6)+4)+' 93l-8 8" style="stroke:#fff;stroke-width:2.2"/>';}
  if(after){g+='<path d="M'+X(6)+' 84 V60" style="stroke:var(--pri);stroke-width:1.6;stroke-dasharray:3 3"/>';
    g+=bar(6,14,34,'pri','Reshape class packs',true)+bar(8,14,84,'h1','Next bet');}
  if(!on&&k>=14){g+='<path d="M'+(X(14)+2)+' 97h20" style="stroke:var(--h4);stroke-width:2.5"/><path d="M'+(X(14)+17)+' 91l7 6-7 6" style="fill:none;stroke:var(--h4);stroke-width:2.5"/>';
    g+='<text x="'+X(14)+'" y="129" text-anchor="end" style="font-size:11px;font-weight:700;fill:var(--no)">still not done · next bet waiting</text>';}
  [0,6,8,14].forEach(w=>g+='<text x="'+X(w)+'" y="142" text-anchor="'+(w?'middle':'start')+'" style="font-size:11px;fill:var(--muted)">'+(w?'wk '+w:'wk 0')+'</text>');
  return '<svg class="bt-svg" viewBox="0 0 330 146" role="img" aria-label="Class packs across two cycles">'+g+'</svg>';}

/* ---------- the cycle plan board (challenge) ---------- */
const BT_ITEMS=[
 {k:'wl',n:'Waitlist (6 wks)',s:'Waitlist',w:6,ok:'A',why:'The waitlist was shaped for six weeks: a big batch project. It gets Kenji and Bea for the whole cycle.'},
 {k:'ex',n:'Member export (2 wks)',s:'Export',w:2,ok:'B',why:'Member export is a shaped two-week job: small batch work for the other team.'},
 {k:'em',n:'“Class cancelled” email (2 wks)',s:'Email',w:2,ok:'B',why:'The clearer email is a shaped two-week job: small batch work for the other team.'},
 {k:'ty',n:'Receipt typo (Bea’s bug list)',s:'Typo',w:.5,ok:'O',why:'The table doesn’t schedule small bugs, and squeezing one into the waitlist interrupts Bea. It stays on Bea’s own list for cool-down.'},
 {k:'cp',n:'Class packs leftovers (3 wks)',s:'Packs',w:3,ok:'O',why:'Leftover work isn’t carried over. Class packs went back to shaping and must win at the table as a new pitch.'},
 {k:'pr',n:'Pinecone Payroll, both cycles',s:'Payroll',w:12,ok:'O',why:'Nobody bets two cycles up front. Payroll first needs a shaped six-week piece that ends working.'}];
function btPlan(A,B,O){const X=w=>8+w*39;let g='';
  for(let w=0;w<6;w++)g+='<text x="'+X(w+.5)+'" y="12" text-anchor="middle" style="font-size:11px;fill:var(--muted)">Wk '+(w+1)+'</text>';
  g+='<rect x="'+X(6)+'" y="0" width="78" height="128" rx="5" style="fill:var(--h2-bg)"/><text x="'+X(7)+'" y="12" text-anchor="middle" style="font-size:11px;font-weight:700;fill:var(--h2)">Cool-down</text>';
  for(let w=1;w<6;w++)g+='<line x1="'+X(w)+'" x2="'+X(w)+'" y1="18" y2="124" style="stroke:var(--line);stroke-dasharray:2 3"/>';
  g+='<text x="'+X(0)+'" y="30" style="font-size:11px;font-weight:700;fill:var(--h1)">Kenji + Bea · big batch</text><text x="'+X(0)+'" y="84" style="font-size:11px;font-weight:700;fill:var(--h3)">Other team · small batch</text>';
  const row=(list,y,col)=>{let s=0;list.forEach(it=>{const a=s,b=s+it.w;s=b;
      const seg=(p,q,c)=>{if(q<=p)return;const qq=Math.min(q,8);g+='<rect x="'+(X(p)+1)+'" y="'+y+'" width="'+Math.max(X(qq)-X(p)-2,2)+'" height="30" rx="5" style="fill:var(--'+(c==='no'?'no-bg':c+'-bg')+');stroke:var(--'+c+');stroke-width:1.6"/>';};
      seg(a,Math.min(b,6),col);seg(Math.max(a,6),b,'no');
      const vis=Math.min(b,8)-a;if(vis*39>it.s.length*6.6+8&&a<8)g+='<text x="'+(X(a)+6)+'" y="'+(y+19.5)+'" style="font-size:11px;font-weight:700;fill:var(--'+(a>=6?'no':col)+')">'+it.s+'</text>';});
    if(s>8)g+='<path d="M318 '+(y+8)+'l7 7-7 7" style="fill:none;stroke:var(--no);stroke-width:2.5"/>';
    return s;};
  const sa=row(A,36,'h1');row(B,90,'h3');
  if(O&&O.some(i=>i.k==='ty')&&sa<=6){g+=bR(X(6)+5,36,68,30,'fill:var(--card);stroke:var(--h2);stroke-width:1.4;stroke-dasharray:3 2',5)+bT(X(7),49,'Typo','font-weight:700;fill:var(--h2)','middle')+bT(X(7),61,'Bea’s list','fill:var(--h2)','middle');}
  return '<svg class="bt-svg" viewBox="0 0 330 128" role="img" aria-label="Next cycle plan: two team rows and cool-down">'+g+'</svg>';}
/* Bea's waitlist curve in miniature, for the challenge */
function btSpark(pulls){const r=btMom(pulls),X=d=>40+d*9.3,Y=v=>52-v/28.2*42;let g='';
  pulls.forEach(d=>{if(d>=1&&d<=30)g+=bR(X(d-1),8,9.3,44,'fill:var(--no-bg)',0);});
  const p=a=>'M'+X(0)+' '+Y(0)+a.slice(1).map((v,i)=>' L'+X(i+1).toFixed(1)+' '+Y(v).toFixed(1)).join('');
  g+='<line x1="40" x2="319" y1="52" y2="52" style="stroke:var(--line2)"/>'+bT(4,24,'Bea’s','font-weight:700;fill:var(--muted)')+bT(4,38,'curve','font-weight:700;fill:var(--muted)');
  g+='<path d="'+p(r.b)+'" style="fill:none;stroke:var(--muted);stroke-width:1.6;stroke-dasharray:4 3"/><path d="'+p(r.a)+'" style="fill:none;stroke:var(--pri);stroke-width:2.6;stroke-linejoin:round"/>';
  return '<svg class="bt-svg" viewBox="0 0 330 58" role="img" aria-label="Bea’s waitlist progress over the cycle">'+g+'</svg>';}

/* ---------- small drawing helpers for the pictures ---------- */
function bT(x,y,s,st,a){return '<text x="'+x+'" y="'+y+'"'+(a?' text-anchor="'+a+'"':'')+' style="font-size:11px;'+(st||'fill:var(--muted)')+'">'+s+'</text>';}
function bR(x,y,w,h,st,rx){return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+(rx==null?4:rx)+'" style="'+st+'"/>';}
function bArr(x1,y1,x2,y2,col,dash){const a=Math.atan2(y2-y1,x2-x1),h=7,p=t=>(x2-h*Math.cos(a+t)).toFixed(1)+' '+(y2-h*Math.sin(a+t)).toFixed(1);
  return '<path d="M'+x1+' '+y1+' L'+x2+' '+y2+'" style="fill:none;stroke:var(--'+col+');stroke-width:1.8'+(dash?';stroke-dasharray:4 3':'')+'"/><path d="M'+p(.45)+' L'+x2+' '+y2+' L'+p(-.45)+'" style="fill:none;stroke:var(--'+col+');stroke-width:1.8;stroke-linejoin:round"/>';}
const bSvg=(h,aria,g)=>'<svg class="bt-svg" viewBox="0 0 330 '+h+'" role="img" aria-label="'+aria+'">'+g+'</svg>';
const bCirc=(cx,cy,n,col)=>'<circle cx="'+cx+'" cy="'+cy+'" r="9" style="fill:var(--'+col+')"/>'+bT(cx,cy+4,n,'font-weight:700;fill:var(--card)','middle');

/* picture: a backlog pile vs a few pitches at a table */
function btPile(){let g='<line x1="165" x2="165" y1="4" y2="204" style="stroke:var(--line);stroke-width:1.2"/>';
  g+=bT(82,14,'With a backlog','font-weight:700;fill:var(--no)','middle')+bT(248,14,'With a betting table','font-weight:700;fill:var(--pri)','middle');
  [0,3,-2,4,-3,1,-1,3,-4,2,0,-2,3].forEach((j,i)=>{g+=bR(32+j,164-i*9,100,7,'fill:var(--no-bg);stroke:var(--no);stroke-width:1',2);});
  g+=bArr(146,120,146,64,'no')+bT(82,42,'240 rows, still growing','font-weight:700;fill:var(--no)','middle');
  g+=bT(82,188,'re-read and re-ranked','','middle')+bT(82,202,'every planning round','','middle');
  [194,248,302].forEach((x,i)=>{const bet=i===0;g+=bR(x-22,30,44,54,bet?'fill:var(--ok-bg);stroke:var(--ok);stroke-width:1.8':'fill:var(--card);stroke:var(--line2);stroke-width:1.5;stroke-dasharray:4 3',6);
    for(let k=0;k<3;k++)g+=bR(x-14,40+k*8,k===2?16:28,3,'fill:var(--'+(bet?'ok':'line2')+')',1.5);
    g+=bT(x,76,bet?'bet':'let go',bet?'font-weight:700;fill:var(--ok)':'fill:var(--muted)','middle');});
  g+=bArr(194,86,194,120,'ok')+bR(176,122,146,28,'fill:var(--h1-bg);stroke:var(--h1);stroke-width:1.4',5)+bT(249,140,'Next cycle: build it','font-weight:700;fill:var(--h1)','middle');
  g+=bT(248,188,'a few shaped pitches','','middle')+bT(248,202,'nothing kept on a list','','middle');
  return bSvg(208,'A growing backlog pile next to three pitches at a betting table: one bet, two let go',g);}

/* picture: three decentralized lists, one-on-ones, and the table */
function btLists(){let g='';
  [[6,'Support',['gift cards','late fees'],'h2'],[114,'Product',['gift cards?','waitlist'],'h1'],[222,'Programmers',['receipt typo','slow page'],'h3']].forEach(c=>{

   '<div class="bt-row"><button class="chip" id="h1a">'+L.ic('list')+'Year with a backlog</button><button class="chip" id="h1b">'+L.ic('scale')+'Year with betting tables</button></div>'+
   '<div id="h1v"></div>'+BT_LEG+'<div class="bt-log" id="h1l" aria-live="polite">Pick a way to run the year.</div>'+
   '<div class="bt-ro" id="h1s"><div><span>After a year with a backlog</span><b id="h1sb">not run yet</b></div><div><span>After a year with betting tables</span><b id="h1st">not run yet</b></div></div>'+
   '<p class="small">Illustrative numbers: about 45 new ideas arrive each cycle and about 10 ship.</p>');
  const TBL=[['b','b','g'],['b','x','x'],['b','b','g'],['b','x'],['b','b','x','g'],['b','x','x']];
  const TLOG=['<b>Table 1</b> · 3 pitches. 2 bet. Gift cards is let go, and nobody adds it to a central list.',
   '<b>Table 2</b> · 3 pitches, all shaped in the last six weeks. 1 bet, 2 let go.',
   '<b>Table 3</b> · Gift cards is back. Support kept hearing it from owners and lobbied Ifeoma again in a one-on-one.',
   '<b>Table 4</b> · 2 pitches. A short call, then a plan.',
   '<b>Table 5</b> · Gift cards again, with fresh examples. An idea that keeps coming back clearly matters.',
   '<b>Table 6</b> · 3 pitches. Still no list to groom.'];
  let busy=false;const seen={};
  function draw(mode,k){let ex='';
    if(mode==='b'){ex+='<text x="9" y="94" style="font-size:11px;fill:var(--muted)">Backlog rows after each cycle</text>';
      btSegs(6,2).filter(s=>s.t==='b').forEach(s=>{if(s.n>k)return;const rows=35*s.n,h=rows/245*62,cx=BTX(s.s+Math.min(6,s.e-s.s)/2);
        ex+='<rect x="'+(cx-9)+'" y="'+(170-h)+'" width="18" height="'+h+'" rx="2" style="fill:var(--no-bg);stroke:var(--no);stroke-width:1.2"/><text x="'+cx+'" y="'+(165-h)+'" text-anchor="middle" style="font-size:11px;font-weight:700;fill:var(--no)">'+rows+'</text>';});}
    else if(mode==='t'){ex+='<text x="9" y="94" style="font-size:11px;fill:var(--muted)">Pitches at each table</text>';
      TBL.forEach((t,j)=>{if(j>=k)return;const cx=BTX(8*j+7);t.forEach((p,q)=>{const y=100+q*17;
        ex+='<rect x="'+(cx-6.5)+'" y="'+y+'" width="13" height="13" rx="3" style="'+(p==='b'?'fill:var(--ok-strong);stroke:var(--ok-strong)':p==='g'?'fill:var(--h4-bg);stroke:var(--h4);stroke-width:2':'fill:none;stroke:var(--line2);stroke-width:1.5;stroke-dasharray:2 2')+'"/>';});});
      ex+='<text x="9" y="176" style="font-size:11px;font-weight:700;fill:var(--ok)">Central list: 0 rows</text>';}
    else ex+='<text x="165" y="130" text-anchor="middle" style="font-size:12px;fill:var(--faint)">Run a year to see what piles up</text>';
    L.$('#h1v').innerHTML=btYear(6,2,{h:180,extra:ex,aria:mode==='b'?'A year with a growing backlog':'A year with betting tables'});
    if(mode==='t'&&k>0)L.$('#h1v').insertAdjacentHTML('beforeend','<div class="bt-leg"><span><i style="background:var(--ok-strong);border-color:var(--ok-strong)"></i>Bet</span><span><i style="border-style:dashed;border-color:var(--line2)"></i>Let go</span><span><i style="background:var(--h4-bg);border-color:var(--h4)"></i>Gift cards</span></div>');}
  async function go(mode,btn){if(busy)return;busy=true;L.$$('#h1a,#h1b').forEach(b=>b.classList.remove('sel'));btn.classList.add('sel');
    const N=mode==='b'?7:6;
    for(let k=1;k<=N;k++){if(!btn.isConnected)return;draw(mode,k);
      L.$('#h1l').innerHTML=mode==='b'?(k<N?'<b>Cycle '+k+'</b> · about 45 ideas in, 10 shipped. Backlog: <b>'+35*k+'</b> rows.':'<b>Cycle '+k+'</b> · Backlog: <b>245 rows</b>. Gift cards is buried somewhere in there. Every planning round starts by re-reading the pile.'):TLOG[k-1];
      await L.sleep(320);}
    if(!btn.isConnected)return;
    if(mode==='t')L.$('#h1l').insertAdjacentHTML('beforeend','<br><b>Central list: 0 rows.</b> Each table looked at 2–4 shaped pitches.');
    const sb=L.$(mode==='b'?'#h1sb':'#h1st');sb.className=mode==='b'?'no':'ok';sb.textContent=mode==='b'?'245 rows to re-read':'0 rows · 2–4 pitches a table';
    btn.dataset.done='1';seen[mode]=1;busy=false;
    if(seen.b&&seen.t){L.sheet('info','Same ideas, different weight','A backlog grows by dozens each cycle and gets re-read every round. Betting tables see a few shaped pitches and let the rest go. Gift cards was let go twice and still came back, each time with a person and fresh examples.');L.done();}}
  L.$('#h1a').onclick=function(){go('b',this);};L.$('#h1b').onclick=function(){go('t',this);};
  draw('n',0);}},

{part:1,src:'Chapter 8 · Six-week cycles · Cool-down',run(L){

{part:1,src:'Chapter 8 · Six-week cycles',
 solve:async L=>{L.$('#c7-2').click();await L.sleep(30);L.$('#c7-6').click();await L.sleep(30);},
 run(L){
  let c=6,cd=2;const tried=new Set();
  L.h(L.kick('pr','Explore')+'<h1 class="q">Set Pinecone’s rhythm. Try short and long cycles and watch the year redraw.</h1>'+
   '<div class="bt-lab">Cycle length</div><div class="bt-row" id="c7c"></div><div class="bt-lab">Cool-down</div><div class="bt-row" id="c7d"></div>'+
   '<div id="c7v"></div>'+BT_LEG+'<div class="bt-ro" id="c7r" aria-live="polite"></div>'+
   '<p class="small">* Our reading of the book’s two tests. The book only reports that two weeks was too short and that six weeks won out.</p>');
  const FIT={2:['No','no'],4:['Small ones only*',''],6:['Yes','ok'],8:['Yes*','ok'],12:['Yes','ok']};
  const SEE={2:['Yes','ok'],4:['Yes','ok'],6:['Yes','ok'],8:['Getting hazy*',''],12:['No, it feels far off*','no']};
  const BR={0:['None','no'],1:['A little*',''],2:['Yes','ok']};
  function upd(){L.$('#c7v').innerHTML=btYear(c,cd,{aria:c+'-week cycles with '+cd+' weeks of cool-down'});
    L.$$('#c7c .chip').forEach(b=>b.classList.toggle('sel',+b.dataset.v===c));L.$$('#c7d .chip').forEach(b=>b.classList.toggle('sel',+b.dataset.v===cd));
    L.$('#c7r').innerHTML=btRo([['Betting tables a year','about '+btN(52/(c+cd))],['Longest wait to act on a new idea','up to '+c+' weeks'],['A whole project fits',FIT[c][0],FIT[c][1]],['End visible from day one',SEE[c][0],SEE[c][1]],['Time to breathe and plan',BR[cd][0],BR[cd][1]]]);}
  [2,4,6,8,12].forEach(v=>{const b=document.createElement('button');b.className='chip';b.id='c7-'+v;b.dataset.v=v;b.textContent=v+' wks';
    b.onclick=()=>{c=v;tried.add(v);upd();
      if(tried.has(2)&&tried.has(6)&&!L.$('#c7ok')){L.$('#c7r').insertAdjacentHTML('afterend','<span id="c7ok"></span>');
        L.sheet('info','Only six passes both tests','Two weeks: nothing real gets finished, and planning eats the time. Twelve weeks: the deadline is too far off to pull anyone. Six weeks: a whole project fits, and the finish line shows from week one. And a new idea waits one cycle at most.');L.done();}};
    L.$('#c7c').appendChild(b);});
  [0,1,2].forEach(v=>{const b=document.createElement('button');b.className='chip';b.dataset.v=v;b.textContent=v?v+' wk'+(v>1?'s':''):'None';b.onclick=()=>{cd=v;upd();};L.$('#c7d').appendChild(b);});
  upd();}},
{part:1,src:'Chapter 8 · Six-week cycles · Cool-down',pts:3,
 solve:async L=>{for(let p=0;p<3;p++){L.$('#c8p'+p).click();await L.sleep(30);L.$('#c8q .opt[data-r="1"]').click();await L.sleep(30);}},
 run(L){
  const P=[
   {n:'Two-week sprints',c:2,cd:0,o:['Too short to finish anything meaningful, and planning costs more than it yields','Teams wander because the deadline is too far away','Programmers get too much free time for bugs'],r:0,
    why:'Look at the top of the ribbon: 25 diamonds, a planning round every two weeks. The book found two weeks too short to get anything meaningful done, and the sprint planning cost more than the work it produced, plus the broken momentum each time people regroup.'},
   {n:'Six weeks, no cool-down',c:6,cd:0,o:['Teams finish early and sit idle','The betting table meets too often','No time to breathe, and the table has to meet in the rush to ship'],r:2,
    why:'The diamonds turn red: with cycles back to back, the table can only meet at the end of a cycle, the worst time to plan, when everyone is busy shipping. Nobody gets time to breathe, fix bugs or think about what’s next.'},
   {n:'Twelve-week cycles',c:12,cd:2,o:['Too many betting tables a year','The deadline feels far off on day one, so teams drift','Nothing meaningful fits in the time'],r:1,
    why:'On day one the end is three months away. The book’s reasoning: when the deadline feels distant and abstract, teams wander and use time poorly until it gets close. Six weeks keeps the end in sight.'}];
  const done=new Set();
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">Three rhythms to test. For each, predict what breaks, then watch the ribbon.</h1>'+
   '<div class="bt-row" id="c8b"></div><p class="bt-cap" id="c8c">Showing: Shape Up’s rhythm, six weeks + two</p><div id="c8v"></div>'+BT_LEG+'<div id="c8q"></div>');
  L.$('#c8v').innerHTML=btYear(6,2,{aria:'Shape Up rhythm: six weeks plus two'});
  P.forEach((p,j)=>{const b=document.createElement('button');b.className='chip';b.id='c8p'+j;b.textContent=p.n;
    b.onclick=()=>{if(done.has(j))return;L.$$('#c8b .chip').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');
      L.$('#c8v').innerHTML=btYear(6,2,{aria:'Shape Up rhythm: six weeks plus two'});L.$('#c8c').textContent='Showing: Shape Up’s rhythm, six weeks + two';
      const q=L.$('#c8q');q.innerHTML='<h2 class="sub">'+p.n+': what breaks?</h2>';let a=false;
      p.o.forEach((t,k)=>{const o=document.createElement('button');o.className='opt';o.dataset.r=k===p.r?'1':'0';o.innerHTML='<span class="key">'+(k+1)+'</span><span>'+t+'</span>';
        o.onclick=()=>{if(a)return;a=true;const ok=k===p.r;done.add(j);L.award(ok);
          o.classList.add(ok?'ok':'no');if(!ok)q.querySelector('.opt[data-r="1"]').classList.add('ok');q.querySelectorAll('.opt').forEach(x=>x.setAttribute('aria-disabled','true'));
          b.classList.remove('sel');b.classList.add(ok?'ok':'no');
          L.$('#c8v').innerHTML=btYear(p.c,p.cd,{aria:p.n});L.$('#c8c').textContent='Showing: '+p.n;
          L.fb(q,p.why,ok?'ok':'no');
          if(done.size===3){L.sheet('info','Why six plus two','Short cycles drown in planning and finish nothing. Long cycles lose the deadline’s pull. No cool-down leaves no room to breathe and forces the table into the busiest moment. Six-week cycles with a two-week cool-down avoid all three.');L.done();}};
        q.appendChild(o);});};
    L.$('#c8b').appendChild(b);});}},

{part:2,src:'Chapter 8 · The betting table',
 solve:async L=>{for(let i=0;i<6&&L.$('#ft-n');i++){L.$('#ft-n').click();await L.sleep(20);}},
 run(L){

   '<b>Who builds</b> · Kenji and Bea take the waitlist as the big batch team. The other team juggles export and the email as a small batch.',

  const show=()=>{L.$('#ft-v').innerHTML=btFirst(k);L.$('#ft-c').innerHTML=CAP[k];L.$('#ft-n').innerHTML='Next step <span style="opacity:.6;font-weight:500">'+(k+2)+'/4</span>'+L.ic('arrow');};

{part:2,src:'Chapter 8 · The meaning of a bet',
 solve:async L=>{for(const k of [0,1,2]){L.$('#mb-'+k).click();await L.sleep(20);}},
 run(L){

{part:2,src:'Chapter 8 · Uninterrupted time',pts:1,
 solve:async L=>{L.$('#m15p .chip[data-v="2"]').click();for(let i=0;i<150&&!L.$('#m15ok');i++)await L.sleep(30);},
 run(L){
  let p=null;const pulls=new Set([12]);
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">On day 12, Noor borrows Bea for “just one day” to help support. How much waitlist work does that cost by the end of the cycle?</h1>'+

{part:2,src:'Chapter 8 · Uninterrupted time',
 solve:async L=>{L.$('#m16pre .chip[data-k="mon"]').click();await L.sleep(30);L.$('#m16pre .chip[data-k="dbl"]').click();await L.sleep(30);L.$('#m16pre .chip[data-k="cri"]').click();await L.sleep(30);},
 run(L){
  const pulls=new Set();const tried=new Set();let day=12;
  L.h(L.kick('pr','Explore the limits')+'<h1 class="q">Tap days on the chart to pull Bea away, or try the presets. Which pull is worth it?</h1>'+
   '<div id="m16v"></div>'+BT_MLEG+
   '<label class="bt-sl"><div class="h"><span>Pick a day (5–25)</span><b id="m16dv">Day 12</b></div><input type="range" id="m16d" min="5" max="25" step="1" value="12" aria-label="Day to pull Bea away"></label>'+
   '<button class="btn" id="m16t">'+L.ic('person')+'Pull Bea on day 12</button>'+
   '<div class="bt-lab">Presets</div><div class="bt-row" id="m16pre"></div>'+
   '<div class="bt-ro" id="m16r" aria-live="polite"></div><div id="m16n"></div>'+
   L.quote('Losing the wrong hour can kill a day.','Ryan Singer, Shape Up, chapter 8'));
  const PRE={one:['One day',[12],'One day away costs about <b>2.8 days</b> of full-speed work: the day itself plus the climb back.'],
   mon:['Every Monday for support',[6,11,16,21],'Four “quick” days cost about <b>11 days</b>, more than two weeks of a six-week bet. The waitlist was shaped for six uninterrupted weeks. It won’t fit now.'],
   cri:['Booking is down',[14,15],'No member at any studio can book: a real crisis. Pulling Bea costs about <b>3.8 days</b>, and here it’s worth it. The book allows hitting the brakes for a true crisis. But true crises are very rare.'],
   dbl:['Double-booking bug',[16,17,18],'Two members grab the last spot about twice a month. Real, but no data is lost and booking still works. Three days on it cost about <b>4.8 days</b> of waitlist work for a fix that could wait: cool-down or a pitch at the next table.'],
   clr:['Clear',[],'Left alone, the waitlist gets the whole run of days the bet promised.']};
  function upd(note){const r=btChart(pulls,30,{tap:true});L.$('#m16v').innerHTML=r.svg;
    L.$('#m16r').innerHTML=btRo([['Days Bea was away',String(pulls.size)],['Waitlist work lost by day 30',r.gap.toFixed(1)+' days',r.gap>.05?'no':'ok'],['Waitlist built by day 30',Math.round(r.pct)+'%',r.pct<99.5?'no':'ok']]);
    L.$('#m16t').innerHTML=L.ic('person')+(pulls.has(day)?'Give Bea back day ':'Pull Bea on day ')+day;
    if(note!=null)L.$('#m16n').innerHTML=note?'<div class="fb info">'+note+'</div>':'';
    L.$$('#m16v .bt-hit').forEach(h=>h.addEventListener('pointerdown',e=>{e.preventDefault();const d=+h.dataset.d;tog(d);}));}
  function tog(d){if(pulls.has(d))pulls.delete(d);else pulls.add(d);day=d;L.$('#m16d').value=d;L.$('#m16dv').textContent='Day '+d;L.$$('#m16pre .chip').forEach(x=>x.classList.remove('sel'));
    upd(pulls.size?pulls.size+' day'+(pulls.size>1?'s':'')+' away cost about <b>'+btChart(pulls,30).gap.toFixed(1)+' days</b> of full-speed work.':'');}
  L.$('#m16d').oninput=e=>{day=+e.target.value;L.$('#m16dv').textContent='Day '+day;upd();};
  L.$('#m16t').onclick=()=>tog(day);
  Object.keys(PRE).forEach(k=>{const b=document.createElement('button');b.className='chip';b.dataset.k=k;b.textContent=PRE[k][0];
    b.onclick=()=>{pulls.clear();PRE[k][1].forEach(d=>pulls.add(d));L.$$('#m16pre .chip').forEach(x=>x.classList.toggle('sel',x===b));upd(PRE[k][2]);
      if(k!=='clr')tried.add(k);
      if(tried.has('mon')&&tried.has('cri')&&tried.has('dbl')&&!L.$('#m16ok')){L.$('#m16n').insertAdjacentHTML('beforeend','<span id="m16ok"></span>');
        L.sheet('info','So what if something comes up?','It waits, six weeks at most. If it still matters most then, the table bets on it; that’s why it bets only one cycle ahead. Only a real crisis, like booking being down, breaks in. The double-booking bug is real, but it can wait.');L.done();}};
    L.$('#m16pre').appendChild(b);});
  upd('');}},
{part:2,src:'Chapter 8 · The circuit breaker',
 solve:async L=>{for(let i=0;i<6&&L.$('#cb-n');i++){L.$('#cb-n').click();await L.sleep(20);}},
 run(L){
  const F=[[true,0,{stop:false,after:false,bet:true}],[false,6,{hole:true}],[true,6,{hole:true,after:false}],[true,6,{}]];
  const CAP=['<b>The bet</b> · In an earlier cycle, a team got six weeks for class packs: members buy ten classes up front and use them over time.',
   '<b>Week 6</b> · The team fell into a hole nobody had spotted: unused classes when a pack expires, and refunds. Not done.',
   '<b>The rule</b> · The '+L.g('circuit-breaker','circuit breaker')+': by default, no extension. Pinecone knowingly accepts that a project, as pitched, may not happen. Class packs stopped at week 6.',
   '<b>After</b> · Ifeoma reshaped class packs, with expiry and refunds handled up front. The new pitch had to win at the table again.'];
  let k=0;
  L.h(L.kick('ex','The circuit breaker, at Pinecone')+'<h1 class="q">What happened to class packs</h1><div id="cb-v"></div><div class="bt-log" id="cb-c" aria-live="polite"></div><button class="btn pri" id="cb-n"></button>');
  const show=()=>{const f=F[k];L.$('#cb-v').innerHTML=btBreak(f[0],f[1],f[2]);L.$('#cb-c').innerHTML=CAP[k];
    if(L.$('#cb-n'))L.$('#cb-n').innerHTML='Next step <span style="opacity:.6;font-weight:500">'+(k+2)+'/4</span>'+L.ic('arrow');};
  L.$('#cb-n').onclick=()=>{k++;if(k>=3){k=3;L.$('#cb-n').remove();show();
      L.sheet('info','The takeaway','Class packs was only worth six weeks to Pinecone, so six weeks is all it was allowed to cost.');L.done();return;}show();};
  show();}},
{part:2,src:'Chapter 8 · The circuit breaker',pts:1,
 solve:async L=>{L.$('#k18p .opt[data-v="1"]').click();for(let i=0;i<150&&!L.$('#k18on');i++)await L.sleep(30);L.$('#k18on').click();for(let i=0;i<150&&!L.$('#k18ok');i++)await L.sleep(30);},
 run(L){
  let p=null,busy=false;
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">Suppose Noor had switched the breaker off and said “two more weeks.” The hole keeps opening new questions. Where does the class packs bar end?</h1>'+
   '<div id="k18v"></div><div id="k18p"></div><div class="bt-ro" id="k18r" aria-live="polite"></div><div id="k18t"></div>'+
   '<p class="small">Illustrative replay: in this run, expiry and refunds keep raising new questions.</p>');
  L.$('#k18v').innerHTML=btBreak(false,6);
  const ro=(on,k)=>{L.$('#k18r').innerHTML=on?btRo([['Weeks spent on class packs','6 (the cap)','ok'],['Cool-down','kept','ok'],['Next bet','starts on time','ok'],['Class packs','back to shaping','']]):
     btRo([['Weeks spent on class packs',k+(k>=14?' and counting':''),k>6?'no':''],['Cool-down',k>6?'eaten':'…',k>6?'no':''],['Next bet',k>8?'pushed back':'…',k>8?'no':'']]);};
  ro(false,6);
  async function play(on){busy=true;const from=on?0:6,to=on?6:14;
    for(let k=from;k<=to;k++){if(!L.$('#k18v'))return false;L.$('#k18v').innerHTML=btBreak(on,k);ro(on,k);await L.sleep(on?110:150);}
    busy=false;return true;}
  [['Week 8: just the two extra weeks',0],['Deep in cycle 2, pushing the next bet back',1],['Week 6: the team stops on its own',2]].forEach((o,j)=>{const b=document.createElement('button');b.className='opt';b.dataset.v=o[1];b.innerHTML='<span class="key">'+(j+1)+'</span><span>'+o[0]+'</span>';
    b.onclick=async()=>{if(p!==null)return;p=o[1];L.$$('#k18p .opt').forEach(x=>x.setAttribute('aria-disabled','true'));
      if(!await play(false))return;const ok=p===1;b.classList.add(ok?'ok':'no');if(!ok)L.$('#k18p .opt[data-v="1"]').classList.add('ok');
      L.award(ok);
      L.sheet(ok?'ok':'no',ok?'A runaway project':'It kept going','Nobody knew how deep the hole was. With no breaker, the project ate the cool-down and the next cycle, and every later bet slid right. A project that was only worth six weeks has now cost more than twice that. Now switch the breaker on.');
      L.$('#k18t').innerHTML='<button class="btn pri" id="k18on">'+L.ic('shield')+'Replay with the circuit breaker on</button>';
      L.$('#k18on').onclick=async function(){if(busy)return;this.remove();if(!await play(true))return;
        L.$('#k18t').innerHTML='<span id="k18ok"></span><div class="fb ok">The bar stops at week 6. That does three things: no runaway project freezes the next cycle; the miss sends class packs back to shaping, not into more time on a bad approach; and with no extension, teams cut scope early and own their trade-offs.</div>';
        L.done();};};
    L.$('#k18p').appendChild(b);});}},

/* ---------- PART 4: BUGS AND A CLEAN SLATE ---------- */
{part:3,src:'Chapter 8 · What about bugs?',run(L){
  L.h(L.kick('learn','What about bugs?')+'<h1 class="q">Being a bug doesn’t make something urgent</h1>'+btBugMap()+
   L.prose('Ask how bad it is. Only a real crisis (lost data, a stalled app, many customers hit) stops the cycle, and that’s rare. Everything else waits for cool-down, the table or the yearly '+L.g('bug-smash','bug smash')+'. Some bugs never earn a fix.'));
  L.done();}},
{part:3,src:'Chapter 8 · What about bugs?',pts:6,
 solve:async L=>{for(let i=0;i<6;i++){for(let w=0;w<60&&!L.$('#b20o .opt');w++)await L.sleep(20);L.$('#b20o .opt[data-r="1"]').click();await L.sleep(30);const n=L.$('#b20n');if(n)n.click();await L.sleep(30);}},
 run(L){
  const D=[['now','Drop everything now','no'],['cool','Fix in cool-down','h2'],['table','Pitch it at the table','pri'],['smash','Save for the bug smash','h3']];
  const X={now:18.5,cool:23,table:27,smash:50};
  const B=[
   ['After a release, no member at any studio can book a class.','now','The app has stopped working for a huge number of customers. That’s a real crisis: pull people off and fix it.'],
   ['A typo in the booking receipt email.','cool','Small and harmless. It waits for cool-down, where it’s already on a programmer’s list.'],
   ['The double-booking bug: about twice a month two members grab the last spot at once. Fixing it means reworking the booking code.','table','Real but rare, and too big for cool-down. Shape a fix and let the table decide whether it’s worth a cycle.'],
   ['Tomás wants to move the slow reports step into a background job.','table','The book’s own example: a programmer makes the case in a pitch, and the table decides up front instead of the fix interrupting other work.'],
   ['Some studios’ class schedules were wiped overnight.','now','Data is being lost. Drop everything.'],
   ['Dozens of small, long-standing annoyances across the app: too many for any one cool-down, and none worth a pitch on its own.','smash','The bug smash is made for this: one whole cycle a year, around the holidays when normal projects are hard anyway, where the team picks off the most important bugs and long-standing issues.']];
  const placed=[];let k=0;
  L.h(L.kick('pr','Triage on the ribbon')+'<h1 class="q">Six bugs reach the team in the middle of cycle 3. Send each one to the right place in Pinecone’s year.</h1>'+
   '<div id="b20v"></div><div class="bt-leg">'+D.map(d=>'<span><i class="dot" style="background:var(--'+d[2]+')"></i>'+d[1]+'</span>').join('')+'</div><div id="b20c"></div><div id="b20o"></div><div id="b20f"></div>');
  function draw(){let ex='';const cnt={};
    placed.forEach((p,j)=>{const i=cnt[p]=(cnt[p]||0)+1,col=D.find(d=>d[0]===p)[2];
      ex+='<circle cx="'+BTX(X[p])+'" cy="'+(84+i*18)+'" r="8" style="fill:var(--'+col+')"/><text x="'+BTX(X[p])+'" y="'+(88+i*18)+'" text-anchor="middle" style="font-size:11px;font-weight:700;fill:var(--card)">'+(j+1)+'</text>';});
    L.$('#b20v').innerHTML=btYear(6,2,{h:132,smash:true,today:18,red:placed.includes('now')?[3]:[],extra:ex,aria:'Pinecone’s year with bug fixes placed'});}
  function show(){draw();const b=B[k];L.$('#b20f').innerHTML='';
    L.$('#b20c').innerHTML='<div class="bt-card"><small>Bug '+(k+1)+' of 6</small>'+b[0]+'</div>';
    const o=L.$('#b20o');o.innerHTML='';let a=false;
    D.forEach((d,j)=>{const btn=document.createElement('button');btn.className='opt';btn.dataset.r=d[0]===b[1]?'1':'0';btn.innerHTML='<span class="key" style="background:var(--'+d[2]+');border-color:var(--'+d[2]+')"></span><span>'+d[1]+'</span>';
      btn.onclick=()=>{if(a)return;a=true;const ok=d[0]===b[1];L.award(ok);btn.classList.add(ok?'ok':'no');if(!ok)o.querySelector('.opt[data-r="1"]').classList.add('ok');
        o.querySelectorAll('.opt').forEach(x=>x.setAttribute('aria-disabled','true'));placed.push(b[1]);draw();
        L.fb(L.$('#b20f'),b[2]+(b[1]==='now'?' Cycle 3 turns red on the ribbon: the bet is broken, and that’s accepted only because this is a crisis.':''),ok?'ok':'no');
        if(k<5)L.$('#b20f').insertAdjacentHTML('beforeend','<button class="btn pri" id="b20n" style="margin-top:10px">Next bug '+L.ic('arrow')+'</button>');
        const nx=L.$('#b20n');if(nx)nx.onclick=()=>{k++;show();};
        if(k===5){L.$('#b20o').innerHTML='';L.sheet('info','Only two of six broke the bet','Two crises justified pulling people mid-cycle. Everything else found a slot that doesn’t interrupt anyone: cool-down, a pitch at the next table, or the yearly bug smash. If we tried to fix every bug first, we’d never ship anything new.');L.done();}};
      o.appendChild(btn);});}
  show();}},
{part:3,src:'Chapter 8 · Keep the slate clean',run(L){
  L.h(L.kick('learn','Keep the slate clean')+'<h1 class="q">Every cycle starts fresh</h1>'+btSlate()+
   L.prose('Bet one cycle at a time. Leftover scraps never just roll over: they go back to shaping and must win again as a new bet. Any longer road map stays in heads and side talks, never promised, so options stay open.'));
  L.done();}},
{part:3,src:'Chapter 8 · Keep the slate clean',pts:1,
 solve:async L=>{L.$('#s22p .opt[data-v="1"]').click();for(let i=0;i<150&&!L.$('#s22ok');i++)await L.sleep(30);},
 run(L){
  let p=null;
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">Noor pictures “Pinecone Payroll” for paying instructors and thinks it needs two cycles: 3 and 4. How should the table bet?</h1>'+
   '<div id="s22v"></div>'+BT_LEG+'<div id="s22p"></div><div class="bt-log" id="s22l" aria-live="polite">Pick a way to bet, then watch the year play out.</div><div class="bt-ro" id="s22r" hidden></div><div class="bt-row" id="s22b"></div>'+
   '<p class="small">The urgent request in this replay is made up for the example.</p>');
  const show=(o)=>{L.$('#s22v').innerHTML=btYear(6,2,Object.assign({aria:'Payroll on cycles 3 and 4'},o));};
  show({hl:[3,4],lab:{3:'Pay?',4:'Pay?'}});
  [['Bet both cycles now so the team can plan ahead',0],['Bet six weeks that end with something working',1]].forEach((o,j)=>{const b=document.createElement('button');b.className='opt';b.dataset.v=o[1];b.innerHTML='<span class="key">'+(j+1)+'</span><span>'+o[0]+'</span>';
    b.onclick=async()=>{if(p!==null)return;p=o[1];L.$$('#s22p .opt').forEach(x=>x.setAttribute('aria-disabled','true'));b.classList.add('sel');
      show({hl:[3],lab:{3:'Pay 1',4:p?'?':'Pay 2'},dim:[]});L.$('#s22l').innerHTML='<b>Cycle 3</b> · Payroll’s first piece gets built.';await L.sleep(700);if(!b.isConnected)return;
      L.$('#s22l').innerHTML='<b>Week 22, at the table</b> · Paying instructors by class type turned out messier than Noor pictured. And a payment provider announces a change every studio’s checkout must support soon.';await L.sleep(800);if(!b.isConnected)return;
      const ok=p===1;L.award(ok);b.classList.add(ok?'ok':'no');if(!ok)L.$('#s22p .opt[data-v="1"]').classList.add('ok');
      L.$('#s22r').hidden=false;
      if(p===0){show({hl:[4],lab:{3:'Pay 1',4:'Lock'},red:[4]});L.$('#s22r').innerHTML=btRo([['Choices at the week-22 table','none: cycle 4 is promised','no'],['Urgent checkout change waits until','week 32','no']]);}
      else{show({hl:[4],lab:{3:'Pay 1',4:'?'}});L.$('#s22r').innerHTML=btRo([['Choices at the week-22 table','three','ok'],['Urgent checkout change can start','week 24','ok']]);
        [['Continue Payroll','Pay 2','Cycle 4: Payroll’s second piece, reshaped with what cycle 3 taught.'],['Change course','New','Cycle 4: a very different Payroll project, shaped around the messy pay rules.'],['Pause; do checkout','Chk','Cycle 4: the urgent checkout change. Payroll waits, and nothing is wasted: piece one already works.']].forEach(c=>{const x=document.createElement('button');x.className='chip';x.textContent=c[0];
          x.onclick=()=>{L.$$('#s22b .chip').forEach(y=>y.classList.toggle('sel',y===x));show({hl:[4],lab:{3:'Pay 1',4:c[1]}});L.$('#s22l').innerHTML='<b>Your call at week 22</b> · '+c[2];};L.$('#s22b').appendChild(x);});}
      L.$('#s22l').insertAdjacentHTML('afterend','<span id="s22ok"></span>');
      L.sheet(ok?'ok':'no',ok?'Options kept open':'The second cycle was already spent','One cycle at a time means aiming at a six-week piece that works when the cycle ends. Went as planned? Bet the next piece. If not, pick a different project, or pause for the urgent thing. Betting both cycles up front spent those choices before anyone learned anything.');L.done();};
    L.$('#s22p').appendChild(b);});}},
{part:3,src:'Chapter 8 · The betting table · Keep the slate clean',pts:1,
 solve:async L=>{for(const it of BT_ITEMS){L.$('#p23i-'+it.k).click();await L.sleep(15);L.$('#p23d-'+it.ok).click();await L.sleep(15);}L.$('#p23go').click();},
 run(L){
  const where={};let sel=null,first=true;
  L.h(L.kick('pr','Challenge')+'<h1 class="q">You’re at Pinecone’s betting table. Build the next cycle plan: each item to a team row, or off the plan. Keep Bea’s curve smooth.</h1>'+
   '<div id="p23v"></div><div id="p23s"></div><div class="bt-ro" id="p23r" aria-live="polite"></div>'+
   '<div class="bt-lab">1 · Tap an item</div><div class="bt-row bt-pool" id="p23pool"></div>'+
   '<div class="bt-lab">2 · Send it to</div><div class="bt-dest" id="p23dst"></div>'+
   '<div class="bt-tray bt-pool" id="p23off"></div>'+
   '<button class="btn pri" id="p23go" disabled>'+L.ic('check')+'Lock in the plan</button>');
  [['A','Kenji + Bea · big batch'],['B','Other team · small batch'],['O','Off the plan']].forEach(d=>{const b=document.createElement('button');b.className='btn';b.id='p23d-'+d[0];b.textContent=d[1];b.disabled=true;
    b.onclick=()=>{if(!sel)return;where[sel]=d[0];sel=null;upd();};L.$('#p23dst').appendChild(b);});
  function upd(){const A=BT_ITEMS.filter(i=>where[i.k]==='A'),B=BT_ITEMS.filter(i=>where[i.k]==='B'),O=BT_ITEMS.filter(i=>where[i.k]==='O');
    L.$('#p23v').innerHTML=btPlan(A,B,O);
    const PULL={ex:[8,10],em:[18,10],ty:[12,1],cp:[14,15],pr:[3,28]},pulls=new Set();
    A.forEach(i=>{const q=PULL[i.k];if(q)for(let d=q[0];d<q[0]+q[1]&&d<=30;d++)pulls.add(d);});
    L.$('#p23s').innerHTML=btSpark(pulls);
    const sa=A.reduce((s,i)=>s+i.w,0),sb=B.reduce((s,i)=>s+i.w,0),f=w=>String(w).replace('.5','½');
    const bea=A.some(i=>i.k!=='wl'),dirty=[...A,...B].some(i=>i.k==='cp'||i.k==='pr');
    L.$('#p23r').innerHTML=btRo([['Kenji + Bea',f(sa)+' of 6 weeks',sa>6?'no':sa===6?'ok':''],['Other team',f(sb)+' of 6 weeks',sb>6?'no':''],['Bea’s momentum',bea?'interrupted':'untouched',bea?'no':'ok'],['Clean slate',dirty?'no: old or unshaped work':'yes',dirty?'no':'ok']]);
    const pool=L.$('#p23pool');pool.innerHTML='';
    BT_ITEMS.filter(i=>!where[i.k]).forEach(i=>{const b=document.createElement('button');b.className='chip'+(sel===i.k?' sel':'');b.id='p23i-'+i.k;b.textContent=i.n;b.onclick=()=>{sel=sel===i.k?null:i.k;upd();};pool.appendChild(b);});
    if(!pool.children.length)pool.innerHTML='<span class="small">All placed. Tap an item in the box below to move it.</span>';
    const off=L.$('#p23off');off.innerHTML='<div class="t">PLACED (TAP TO TAKE BACK)</div>';
    BT_ITEMS.filter(i=>where[i.k]).forEach(i=>{const b=document.createElement('button');b.className='chip';b.id='p23i-'+i.k;b.innerHTML='<b style="color:var(--'+(where[i.k]==='A'?'h1':where[i.k]==='B'?'h3':'muted')+')">'+(where[i.k]==='O'?'Off':where[i.k]==='A'?'Big':'Small')+'</b> '+i.n;
      b.onclick=()=>{delete where[i.k];sel=i.k;upd();};off.appendChild(b);});
    L.$$('#p23dst .btn').forEach(b=>b.disabled=!sel);
    L.$('#p23go').disabled=BT_ITEMS.some(i=>!where[i.k]);}
  L.$('#p23go').onclick=()=>{const wrong=BT_ITEMS.filter(i=>where[i.k]!==i.ok);const ok=!wrong.length;
    if(first){L.award(ok);first=false;}
    if(ok){L.$('#p23go').disabled=true;L.sheet('ok','A clean, committed plan','The waitlist fills Kenji and Bea’s cycle, untouched. Export and the email fit the small batch team’s six weeks. The typo waits on Bea’s list for cool-down. Class packs must win again, reshaped. Payroll first needs a working six-week piece.');L.done();}
    else L.sheet('no','Not yet: '+wrong.length+' to fix',wrong.map(i=>'<b>'+i.s+':</b> '+i.why).join('<br>')+'<br>Move them and lock in again.');};
  upd();}}
  ]
});
</script>
