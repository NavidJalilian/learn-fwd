<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find the Elements</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0004', title:'Find the elements', minutes:19, icon:'pencil',
  goals:['Sketch a flow as a breadboard of places, affordances and connection lines','Choose between a breadboard and a fat marker sketch','Turn a rough idea into a short list of elements that leaves room for designers'],
  parts:['Right speed','Breadboards','Fat markers','Elements'],
  read:'Read chapter 4 of the book for the full Autopay breadboards and the to-do group sketches.',
  glossary:{
    place:'Place: something you can go to in an interface, like a screen, a dialog or a menu that pops up.',
    affordance:'Affordance: something a person can act on in a place, like a button or a field. The words on screen count too, because reading them helps people decide what to do.',
    'connection-line':'Connection line: an arrow in a breadboard showing how an affordance takes you from one place to another.',
    element:'Element: one concrete part of a solution, found while shaping, like “a Join waitlist button on a full class”.',
    wireframe:'Wireframe: a detailed drawing of a screen’s layout. Too precise for this early stage of shaping.'
  },
  cheatsheet:[
    'Move fast: work <b>alone or with one trusted partner</b>, and avoid the wrong level of detail.',
    'Answer four questions: where does it fit, how do you get there, what are the key parts, where does it take you?',
    '<b>Breadboard</b>: words only. <b>Places</b> (underlined), <b>affordances</b> below them, <b>connection lines</b> between them.',
    'A screen or a pop-up? Doesn’t matter yet. What’s connected to what is all that counts.',
    'Visual problem? Use a <b>fat marker sketch</b>: strokes too thick for detail.',
    'The output is a short list of <b>elements</b>, far narrower than the raw idea.',
    'Leave details out so designers have room. It’s the rules of a game, not a spec.',
    'Still private and not deliverable. Next: check risks. And you can still walk away: <b>no conveyor belt</b>.'
  ],
  steps:[
/* ---------- PART 1: RIGHT SPEED ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Ifeoma wants to compare five different ways a waitlist could work, all this afternoon. What will let Ifeoma move fastest?</h1>');
  L.mc(L.card,['Polished screen mockups for each idea','Rough notes in words and arrows'],1,
   'Rough notes take seconds to change, so Ifeoma can try many ideas. This lesson shows two ways to stay rough on purpose.',
   'Polished mockups take hours each, and Ifeoma would get stuck on details. Rough words and arrows allow many ideas, fast.');}},
{part:0,src:'Chapter 4 · Move at the right speed',run(L){
  L.h(L.kick('learn','Move at the right speed')+'<h1 class="q">Go from an idea in words to the parts of a solution, fast</h1>'+
   L.prose('With an appetite and a narrow problem, the shaper now looks for a solution. There could be dozens of ways to solve it, so they need to cover many ideas quickly. Two things make that possible:')+
   L.lanes([['people','The right people, or nobody','Work alone, or with one trusted partner who keeps pace, shares your background and speaks in shorthand.',2],
            ['eye','The right level of detail','Skip '+L.g('wireframe','wireframes')+' and exact layouts. They pull you into small details too early.',3]])+
   L.prose('Be concrete enough to make progress, without getting dragged into fine detail. Aim to answer four questions:')+
   L.list([['Where does it fit?','Where in the current product does the new thing go?'],['How do you get to it?','What leads people there?'],['What are the key parts?','The main components and interactions.'],['Where does it take you?','What happens next?']],1));
  L.done();}},
{part:0,src:'Chapter 4 · Move at the right speed',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Ifeoma wants a partner for an afternoon of waitlist ideas. Who fits best?</h1>');
  L.mc(L.card,['All 15 people on a video call, to hear every view','Tomás, who knows the booking code and talks frankly'],1,
   'One trusted partner who keeps pace and shares the background. They can jump between ideas in shorthand.',
   'A big call slows everything down. The book says: the right people, or nobody. One trusted partner like Tomás keeps pace.');}},
{part:0,src:'Chapter 4 · Move at the right speed',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Right level of detail for now?',['Right level','Too detailed'],[
   ['Deciding the full class needs a “Join waitlist” button.',0,'A key part of the solution. That’s exactly what to settle now.'],
   ['Choosing between teal and green for that button.',1,'Color is a visual detail. It comes much later, from the designer.'],
   ['Working out where a member lands after joining.',0,'“Where does it take you?” is one of the four questions.'],
   ['Drawing a pixel-perfect mockup of the waitlist screen.',1,'Too much fidelity. You’ll get stuck and stop exploring.'],
   ['Asking how owners would reach the waitlist settings.',0,'“How do you get to it?” is right on target.']]);}},

/* ---------- PART 2: BREADBOARDS ---------- */
{part:1,src:'Chapter 4 · Breadboarding',run(L){
  L.h(L.kick('learn','Breadboarding')+'<h1 class="q">All the wiring, none of the looks</h1>'+
   L.prose('In electronics, a breadboard is a test version of a device with every component and wire, but no case or styling. Deciding to have a light and a knob is very different from arguing about where the knob sits or how round the corners are.')+
   L.prose('A '+L.g('breadboard','breadboard')+' does the same for software. You draw three things, all in words:')+
   L.tiers([['home','Places','Where you can go: screens, dialogs, menus that pop up. Write the name and underline it.','e.g. Class page'],
            ['pointer','Affordances','What you can act on there: buttons, fields. The words on screen count too. Write them under the place.','e.g. Join waitlist button'],
            ['arrow','Connection lines','Arrows showing how an affordance takes you to another place.','e.g. Join waitlist → Confirmation']])+
   '<p class="small" style="margin-top:10px">With just these, you can play an idea through and judge whether the steps serve the problem.</p>');
  L.done();}},
{part:1,src:'Chapter 4 · Breadboarding (example)',run(L){
  L.h(L.kick('ex','The book’s example')+'<h1 class="q">Breadboarding “Autopay” for an invoicing tool</h1>');
  L.beats(L.card,[
   ['The idea','An invoicing tool wants to let its customers’ customers pay future invoices <b>automatically</b>.'],
   ['First sketch','Start on the <u>Invoice</u> (a place). Add a “Turn on Autopay” button (an affordance). Draw a line to <u>Setup Autopay</u>. Screen or pop-up? Doesn’t matter yet: what connects to what is the same.'],
   ['A question appears','What goes on the setup place? A card form and the bank’s logo. But wait: did the person actually pay <i>this</i> invoice? Just a few words raised a real question.'],
   ['A different approach','Instead, offer Autopay as an option <b>while paying</b>. No doubt about the current invoice. Add an “Autopay was enabled” note to the existing confirmation. The sketch also reminds them bank transfers work there too.'],
   ['Turning it off','A login for customers to manage Autopay felt like too much for the appetite. The team judged it fine for customers to ask the invoicer, who gets one “disable Autopay” option on a page they already have.']],
   'Words and arrows are cheap to change, so the team could try several flows and hit the hard questions early, without drawing a single screen.');}},
{part:1,src:'Chapter 4 · Breadboarding',pts:1,
 solve:async L=>{for(const id of ['#p0','#p1','#p2']){const b=L.$(id);if(b)b.click();await new Promise(r=>setTimeout(r,20));}},
 run(L){
  const P={
   cls:['Class page (full)',[['c','6 p.m. Vinyasa · Full'],['a','Join waitlist','conf','p0']]],
   conf:['Waitlist confirmation',[['c','You’re #2 on the waitlist'],['a','Leave waitlist','cls'],['a','Meanwhile, someone cancels…','msg','p1']]],
   msg:['“Spot opened” message',[['c','A spot opened in 6 p.m. Vinyasa'],['a','Book this spot','done','p2']]],
   done:['Booking confirmed',[['c','See you at 6 p.m.!']]]};
  const path=[];
  L.h(L.kick('pr','Play the breadboard')+'<h1 class="q">Here is Ifeoma’s first waitlist breadboard. Tap affordances to walk a member from a full class to a booked spot.</h1>'+
   '<div id="bb" style="background:var(--soft);border-radius:16px;padding:14px;margin:8px 0"></div><div class="small" id="trail"></div><div id="bq"></div>');
  const draw=k=>{const p=P[k];path.push(p[0]);
    L.$('#trail').innerHTML='Path so far: '+path.join(' → ');
    L.$('#bb').innerHTML='<div style="font-weight:700;text-decoration:underline;margin-bottom:8px">'+p[0]+'</div>'+
     p[1].map(x=>x[0]==='c'?'<div class="small" style="margin:4px 0">“'+x[1]+'”</div>':'<button class="chip" '+(x[3]?'id="'+x[3]+'" ':'')+'data-to="'+x[2]+'">'+L.ic('pointer')+x[1]+'</button>').join('');
    L.$('#bb').querySelectorAll('[data-to]').forEach(b=>b.onclick=()=>draw(b.dataset.to));
    if(k==='done'&&!L.$('#bq').innerHTML){const q=L.$('#bq');q.innerHTML='<h2 class="sub">Marisol’s spot got filled with no texting. Now: in this breadboard, which one is an affordance?</h2>';
      L.mc(q,['The “Spot opened” message','The line “You’re #2 on the waitlist”','The arrow from Join to the confirmation'],1,
       'Screen copy counts as an affordance: reading it helps the member decide what to do next.',
       'The message is a place you land on, and the arrow is a connection line. The words “You’re #2” are an affordance, because reading them is an action that informs the next step.');}};
  draw('cls');}},
{part:1,src:'Chapter 4 · Breadboarding',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">In a breadboard, what is the “Studio settings” screen?</h1>');
  L.mc(L.card,['An affordance','A connection line','A place'],2,
   'You can navigate to it, so it’s a place. Its name gets underlined.',
   'Anything you can navigate to, like a screen, dialog or pop-up menu, is a place. Buttons and fields are affordances; arrows are connection lines.');}},
{part:1,src:'Chapter 4 · Breadboarding',pts:6,run(L){
  L.h(L.kick('pr','Sort the breadboard')+'<h1 class="q">Ifeoma’s notes for the owner side of the waitlist. Sort each piece.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Place','Affordance','Connection line'],[
   ['The class roster screen',0,'You navigate to it, so it’s a place.'],
   ['A “See waitlist” button',1,'Something to act on: an affordance.'],
   ['“See waitlist” leads to the waiting list',2,'It shows how one place leads to another.'],
   ['A menu that pops up for each class',0,'Menus that pop up count as places too.'],
   ['The text “3 people waiting”',1,'Screen copy is an affordance, since reading it informs the next action.'],
   ['A field for how many people may wait',1,'Fields are affordances.']],
   'Places are where you are, affordances are what you can act on or read there, and connection lines show where they lead.');}},
{part:1,src:'Chapter 4 · Breadboarding (example)',pts:1,run(L){
  L.h(L.kick('pr','Screen or pop-up?')+'<h1 class="q">Tomás asks whether the waitlist settings should be a full screen or a pop-up. Should they settle it now?</h1>');
  L.mc(L.card,['No, what connects to what is all that matters now','Yes, the breadboard needs that decided first'],0,
   'Like Setup Autopay in the book’s example: screen or pop-up, the connections are the same. That choice can wait.',
   'In the Autopay example the book leaves this open on purpose. What’s connected to what is the same either way, so it can wait.');}},
{part:1,src:'Chapter 4 · Breadboarding (example)',pts:1,run(L){
  L.h(L.kick('pr','Watch the appetite')+'<h1 class="q">Playing it through, Ifeoma asks: how does a member leave the waitlist later? A new “My waitlists” page with logins feels big for six weeks. What fits the Autopay lesson?</h1>');
  L.mc(L.card,['Build the full “My waitlists” page anyway','Add one “Leave waitlist” link to a place members already see'],1,
   'Like the Autopay team, Ifeoma adds one simple option to a place that already exists, instead of a whole new area.',
   'The Autopay team skipped a whole login flow as too much scope and added one option to an existing page. Ifeoma can do the same.');}},

/* ---------- PART 3: FAT MARKERS ---------- */
{part:2,src:'Chapter 4 · Fat marker sketches',run(L){
  L.h(L.kick('learn','Fat marker sketches')+'<h1 class="q">When the layout is the problem, sketch thick</h1>'+
   L.prose('Sometimes the idea is visual: how things sit next to each other on the screen <i>is</i> the problem. A breadboard would miss the point. Wireframes would still be too detailed.')+
   L.prose('So the book uses a '+L.g('fat-marker','fat marker sketch')+': lines so thick that adding detail is hard or impossible. Basecamp’s team first did these with big markers on paper, later on tablets with a huge pen size.')+
   L.lanes([['alert','The downside','It’s less strict than a breadboard. You might sketch a sidebar and get attached to it, though it isn’t a key part.',4],
            ['bulb','Why give it a name','It’s too easy to skip ahead to detail. A named step reminds you to look at many options first.',2]]));
  L.done();}},
{part:2,src:'Chapter 4 · Fat marker sketches',run(L){
  L.h(L.kick('ex','The book’s example')+'<h1 class="q">Sketching “to-do groups”</h1>');
  L.beats(L.card,[
   ['The workaround','Basecamp’s own team kept making fake to-dos like “––– Needs testing –––” just to split a list into sections.'],
   ['The idea','Make dividers a real feature. But what does a divider do to the list? This is about arrangement, so they sketched.'],
   ['The rough answer','To-dos above the first divider stay “loose”. To-dos below it form groups. More dividers add more groups underneath.'],
   ['A worry','An “add” button in every group might break up the list visually. Maybe put “add” in the menu that already sits next to each to-do.']],
   'Thick strokes kept the talk on what goes where, not on fonts, colors or exact spacing.');}},
{part:2,src:'Chapter 4 · Fat marker sketches',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Ifeoma needs to work out where waiting members should appear inside the crowded class roster. Which tool fits?</h1>');
  L.mc(L.card,['A fat marker sketch','A breadboard'],0,
   'This is about arrangement on the screen, so a breadboard would miss the point.',
   'A breadboard shows flows between places. Where things sit inside one crowded screen is a visual question, so use a fat marker sketch.');}},
{part:2,src:'Chapter 4 · Fat marker sketches',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Breadboard or fat marker?',['Breadboard','Fat marker sketch'],[
   ['The steps a member takes to join a waitlist and get a spot.',0,'A flow from place to place: breadboard.'],
   ['How to show full classes on a busy weekly schedule grid.',1,'The 2D arrangement is the problem: fat marker.'],
   ['How an owner gets from settings to the waitlist rules.',0,'Getting from place to place: breadboard.'],
   ['Fitting a “waiting” count onto a small class card.',1,'It’s about space on the card: fat marker.'],
   ['What happens after a member taps “Leave waitlist”.',0,'Where an affordance leads: breadboard.']]);}},

/* ---------- PART 4: ELEMENTS ---------- */
{part:3,src:'Chapter 4 · Elements are the output',run(L){
  L.h(L.kick('learn','Elements are the output')+'<h1 class="q">A cloudy idea becomes a short list of concrete parts</h1>'+
   L.prose('The result of this step is a handful of '+L.g('element','elements')+'. Tap each idea to see what it became.')+'<div id="fl"></div>');
  L.flips(L.$('#fl'),[
   ['Autopay','A “use this to Autopay?” checkbox on the existing pay screen, and a “disable Autopay” option for the invoicer.'],
   ['To-do groups','Loose to-dos stay at the top; grouped to-dos sit below. Try an “add” in each group, or fall back to the existing menu.'],
   ['Calendar','Two months of grid side by side, dots for events, and a list below that scrolls to an event when you tap its dot.'],
   ['Pinecone waitlist','A “Join waitlist” button on a full class, a list of waiting members for the studio, and an automatic “a spot opened” message.']],
   'Compare “monthly calendar” with “dots on a two-month grid plus a list.” Much narrower and more specific. That narrowing is the point of shaping.');}},
{part:3,src:'Chapter 4 · Room for designers',run(L){
  L.h(L.kick('learn','Room for designers')+'<h1 class="q">Leave details out on purpose</h1>'+
   L.prose('Show a designer a detailed mockup and say “ignore the details” all you like: they’ll still follow it. Even more so if you’re senior to them. Every detail reads as an instruction.')+
   L.prose('Breadboards and fat marker sketches leave those details open, so the designer still has real choices to make later.')+
   L.note('It isn’t a spec. It’s more like the rules of a game: clear limits, but countless ways to play.','book'));
  L.done();}},
{part:3,src:'Chapter 4 · Not deliverable yet',run(L){
  L.h(L.kick('learn','Not deliverable yet')+'<h1 class="q">Elements are a big step, but not the finish line</h1>'+
   L.list([['eye','Still private','The notes on the wall or in a notebook may make no sense to anyone who wasn’t there. That’s normal.'],
           ['alert','Still risky','There’s an approach now, but maybe holes that could stop it shipping in the fixed time. Next comes stress-testing for risks, then the pitch.'],
           ['cycle','No conveyor belt','Nothing is bet or promised yet. You can still walk away. You’ve just made the raw idea more actionable, a better option to argue for later.']],2));
  L.done();}},
{part:3,src:'Chapter 4 · Room for designers',pts:1,run(L){
  L.h(L.kick('pr','Hand-off risk')+'<h1 class="q">Ifeoma made a detailed mockup of the waitlist screen and wants to show it to Kenji “just as an idea.” What’s the risk?</h1>');
  L.mc(L.card,['Kenji may take every detail as an order','Kenji will ignore it and start over','It saves Kenji time, so there’s none'],0,
   'Mockups bias whoever comes next, especially from someone senior. Kenji would lose room to design.',
   'The book’s worry is the opposite of ignoring it: any detail from a senior person reads as direction. That takes away the designer’s room.');}},
{part:3,src:'Chapter 4 · Elements are the output',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Tap each piece until the sentence describes what this step should produce.</h1>');
  L.sentence(L.card,[['A handful of concrete elements','A complete spec of every screen'],['sketched roughly in words and thick lines','drawn pixel-perfect in a design tool'],['that still leave the designer room','that the team simply copies']],[0,0,0],
   [['A complete spec is far too much. It removes the designer’s room and slows shaping down.'],['That’s the wrong level of detail. People get stuck on visuals.'],['If the team just copies it, the designer loses room for creative choices.']],
   'Specific enough to act on, rough enough to leave room. Like the rules of a game, not a spec.');}},
{part:3,src:'Chapter 4 · Not deliverable yet',pts:1,run(L){
  L.h(L.kick('pr','Where are we?')+'<h1 class="q">Put the waitlist’s journey in order, from first request to the pitch.</h1>');
  L.order(L.card,['Support hears “Can you add a waitlist?”','Set the appetite and narrow the problem','Breadboard the flows with Tomás','List the elements','Stress-test for risks and rabbit holes','Write it up as a pitch'],
   'Set boundaries, find the elements, check the risks, write the pitch. This lesson covered the breadboards and the elements. The risk check comes next.');}},
{part:3,src:'Chapter 4 · No conveyor belt',pts:1,run(L){
  L.h(L.kick('pr','No conveyor belt')+'<h1 class="q">Ifeoma has elements for a studio “logo upload.” Then Ifeoma learns studios almost never need it right now. Does it have to be pitched?</h1>');
  L.mc(L.card,['Yes, the shaping is done, so it must go forward','No, nothing is bet yet, so it can be set aside'],1,
   'Shaping isn’t a conveyor belt. Nothing was promised, and the work still made the idea easier to pick up later.',
   'Nothing has been bet or promised. Shaping isn’t a conveyor belt, so Ifeoma can walk away and keep the work as a better option for later.');}}
  ]
});
</script>
</body>
</html>
