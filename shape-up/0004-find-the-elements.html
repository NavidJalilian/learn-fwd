/* ===== This lesson's own tools: a breadboard wiring board with a walk-through token, and a marker-width sketch ===== */
(function(){const st=document.createElement('style');st.textContent=`

@keyframes feshr{from{transform:scale(1.3);opacity:.3}to{transform:none;opacity:1}}
@keyframes fefade{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.fe-tz{border-radius:14px;padding:8px 10px 10px;margin:8px 0}
.fe-tz>b{display:block;font-size:12px;letter-spacing:.3px;color:var(--muted);margin-bottom:4px}
.fe-tz.k{background:var(--h3-bg);border:2.5px solid var(--ink)}
.fe-tz.c{border:1.5px dashed var(--line2);min-height:52px}
.fe-ti{display:block;width:100%;min-height:38px;margin:5px 0 0;padding:6px 10px;border:1.5px solid var(--line2);border-radius:10px;background:var(--card);font-size:14px;line-height:1.35;text-align:left;animation:fepop .25s}
.fe-ti.good{border-color:var(--ok-strong);background:var(--ok-bg)}
.fe-ti.wrong{border-color:var(--no-strong);background:var(--no-bg)}
`;document.head.appendChild(st);})();

const FE_NS='http://www.w3.org/2000/svg';let feUid=0;
const FE_K={btn:'button',link:'link',field:'field',check:'checkbox',copy:'text'};
const feWait=ms=>new Promise(r=>setTimeout(r,ms));
/* an orthogonal path with rounded corners */
function feRP(pts,r){let d='M'+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1);
  for(let i=1;i<pts.length-1;i++){const p0=pts[i-1],p1=pts[i],p2=pts[i+1];const d1=Math.hypot(p1[0]-p0[0],p1[1]-p0[1]),d2=Math.hypot(p2[0]-p1[0],p2[1]-p1[1]);
    if(d1<0.5||d2<0.5)continue;const rr=Math.min(r,d1/2,d2/2);
    const ax=p1[0]+(p0[0]-p1[0])/d1*rr,ay=p1[1]+(p0[1]-p1[1])/d1*rr,bx=p1[0]+(p2[0]-p1[0])/d2*rr,by=p1[1]+(p2[1]-p1[1])/d2*rr;
    d+=' L'+ax.toFixed(1)+' '+ay.toFixed(1)+' Q'+p1[0].toFixed(1)+' '+p1[1].toFixed(1)+' '+bx.toFixed(1)+' '+by.toFixed(1);}
  const l=pts[pts.length-1];return d+' L'+l[0].toFixed(1)+' '+l[1].toFixed(1);}

/* The breadboard board. model: {places:[{id,name,tag,pop,isNew,sep,after,el,aff:[{id,k,t,to,lock,dead,role,el}]}],events:[{from,to}]}
   o: {readOnly,status:el,onChange(api),onWire(a)} */
function feBoard(host,model,o){o=o||{};const uid=++feUid;let sel=null,gen=0;
  const root=document.createElement('div');host.appendChild(root);
  const api={root,model};
  const place=id=>model.places.find(p=>p.id===id);
  const aff=id=>{for(const p of model.places)for(const a of (p.aff||[]))if(a.id===id)return a;return null;};
  const say=h=>{if(o.status)o.status.innerHTML=h;};
  api.place=place;api.aff=aff;
  function render(){gen++;
    root.className='fe-bb'+((model.events||[]).length?' ev':'')+(sel?' picking':'')+(o.cls?' '+o.cls:'');
    let h='';
    for(const p of model.places){
      if(p.sep)h+='<div class="fe-sep">'+p.sep+'</div>';
      h+='<div class="fe-pl'+(p.pop?' pop':'')+(p.isNew?' new':'')+'" data-p="'+p.id+'"><div class="fe-pn"><u>'+p.name+'</u>'+(p.tag?'<span class="fe-tg">'+p.tag+'</span>':'')+'</div>'+
        (p.aff||[]).map(a=>'<button type="button" class="fe-af'+(a.k==='copy'?' copy':'')+(a.to?' wired':'')+(a.dead?' dead':'')+(sel===a.id?' sel':'')+'" data-a="'+a.id+'"'+(a.k==='copy'?'':' aria-pressed="'+(sel===a.id)+'"')+'><span>'+(a.k==='copy'?'“'+a.t+'”':a.t)+'</span><span class="k">'+(a.dead||FE_K[a.k])+'</span></button>').join('')+'</div>';
      if(p.after)h+='<div class="fe-ev">'+p.after+'</div>';}
    h+='<svg class="fe-ov" aria-hidden="true"></svg><svg class="fe-tk" aria-hidden="true"></svg>';
    root.innerHTML=h;draw();if(o.onChange)o.onChange(api);}
  function geo(){const cr=root.getBoundingClientRect();const G={pl:{},af:{},w:{},W:root.clientWidth,H:root.scrollHeight};let R=0,Lx=1e9;
    root.querySelectorAll('.fe-pl').forEach(el=>{const r=el.getBoundingClientRect(),hr=el.querySelector('.fe-pn').getBoundingClientRect();
      G.pl[el.dataset.p]={l:r.left-cr.left,r:r.right-cr.left,t:r.top-cr.top,b:r.bottom-cr.top,hy:hr.top-cr.top+hr.height/2};R=Math.max(R,r.right-cr.left);Lx=Math.min(Lx,r.left-cr.left);});
    root.querySelectorAll('.fe-af').forEach(el=>{const r=el.getBoundingClientRect();G.af[el.dataset.a]={x:r.right-cr.left,y:r.top-cr.top+r.height/2};});
    G.R=R;G.L=Lx;const ws=[];
    model.places.forEach(p=>(p.aff||[]).forEach(a=>{if(a.to&&G.pl[a.to]&&G.af[a.id]){const s=G.af[a.id],t=G.pl[a.to];ws.push({a,s,t,lo:Math.min(s.y,t.hy)-6,hi:Math.max(s.y,t.hy)+6});}}));
    const into={};ws.forEach(w=>{(into[w.a.to]=into[w.a.to]||[]).push(w);});
    for(const k in into){const g=into[k];g.forEach((w,i)=>{w.ty=w.t.hy+(i-(g.length-1)/2)*7;w.lo=Math.min(w.s.y,w.ty)-6;w.hi=Math.max(w.s.y,w.ty)+6;});}
    ws.sort((x,y)=>(x.hi-x.lo)-(y.hi-y.lo));const lanes=[];
    ws.forEach(w=>{let k=0;while(lanes[k]&&lanes[k].some(q=>q.lo<w.hi&&w.lo<q.hi))k++;(lanes[k]=lanes[k]||[]).push(w);const gx=R+9+Math.min(k,3)*8;
      G.w[w.a.id]=feRP([[w.s.x,w.s.y],[gx,w.s.y],[gx,w.ty],[w.t.r+2,w.ty]],6);});
    G.e=(model.events||[]).map(e=>{const s=G.pl[e.from],t=G.pl[e.to];if(!s||!t)return null;const lx=Lx-12;return feRP([[Lx,s.b-12],[lx,s.b-12],[lx,t.hy],[Lx-2,t.hy]],5);});
    return G;}
  function draw(){const ov=root.querySelector('.fe-ov'),tk=root.querySelector('.fe-tk');if(!ov)return;const G=geo();
    [ov,tk].forEach(s=>{s.setAttribute('width',G.W);s.setAttribute('height',G.H);s.setAttribute('viewBox','0 0 '+G.W+' '+G.H);});
    let h='<defs><marker id="feA'+uid+'" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--pri)"/></marker>'+
      '<marker id="feE'+uid+'" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--muted)"/></marker></defs>';
    for(const id in G.w)h+='<path class="fe-w" d="'+G.w[id]+'" fill="none" marker-end="url(#feA'+uid+')"/>';
    G.e.forEach(d=>{if(d)h+='<path d="'+d+'" fill="none" style="stroke:var(--muted)" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#feE'+uid+')"/>';});
    ov.innerHTML=h;}
  root.addEventListener('click',e=>{if(o.readOnly)return;const b=e.target.closest('.fe-af'),pl=e.target.closest('.fe-pl');
    if(sel){const a=aff(sel);
      if(b&&b.dataset.a===sel){say(a.to?'Removed the line from “'+a.t+'”.':'Cancelled.');if(a.to)a.to=null;sel=null;render();return;}
      if(pl){a.to=pl.dataset.p;sel=null;say('Line drawn: “'+a.t+'” → '+place(a.to).name+'.');render();if(o.onWire)o.onWire(a);}
      return;}
    if(!b)return;const a=aff(b.dataset.a);
    if(a.k==='copy'){say('Text on screen is an affordance too: reading it helps people decide what to do next. It doesn’t lead anywhere by itself.');return;}
    if(a.dead){say('Jonah is already on the waitlist, so this button isn’t there for Jonah.');return;}
    if(a.lock){say('This line is already settled. Work with the new pieces.');return;}
    sel=a.id;say('Now tap the place “'+a.t+'” leads to. Tap “'+a.t+'” again to '+(a.to?'remove its line.':'cancel.'));render();});
  const ro=new ResizeObserver(()=>{if(!root.isConnected){ro.disconnect();return;}draw();});ro.observe(root);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(root.isConnected)draw();});
  api.render=render;api.draw=draw;
  api.lines=()=>{const out=[];model.places.forEach(p=>(p.aff||[]).forEach(a=>{if(a.to)out.push(a.t+' → '+place(a.to).name);}));return out;};
  api.reach=start=>{const seen=new Set([start]),q=[start];while(q.length){const c=q.shift();(place(c).aff||[]).forEach(a=>{if(a.to&&!a.dead&&a.k!=='copy'&&!seen.has(a.to)){seen.add(a.to);q.push(a.to);}});
      (model.events||[]).forEach(e=>{if(e.from===c&&!seen.has(e.to)){seen.add(e.to);q.push(e.to);}});}return seen;};
  /* shortest route from start to a wired affordance that passes test(a); returns a walk script or null */
  api.route=(start,test)=>{const prev={};prev[start]=null;const q=[start];
    while(q.length){const c=q.shift();
      for(const a of (place(c).aff||[])){if(a.k==='copy'||a.dead||!a.to)continue;
        if(test(a)){const sc=[{at:c,take:a.id}];let x=c;while(prev[x]){sc.unshift(prev[x].s);x=prev[x].from;}return sc;}
        if(!(a.to in prev)){prev[a.to]={from:c,s:{at:c,take:a.id}};q.push(a.to);}}
      (model.events||[]).forEach((e,i)=>{if(e.from===c&&!(e.to in prev)){prev[e.to]={from:c,s:{ev:i}};q.push(e.to);}});}
    return null;};
  api.ask=(id,txt)=>{const el=root.querySelector('.fe-pl[data-p="'+id+'"]');if(el&&!el.querySelector('.fe-q'))el.insertAdjacentHTML('beforeend','<span class="fe-q" title="'+txt+'" aria-label="Open question: '+txt+'">?</span>');};
  /* play a script: [{at,take}|{ev}] from wo.start; the token follows the learner's own lines */
  api.walk=async(script,wo)=>{wo=wo||{};const g=++gen;
    root.querySelectorAll('.stuck,.hit,.used,.bad').forEach(x=>x.classList.remove('stuck','hit','used','bad'));
    const G=geo(),tk=root.querySelector('.fe-tk');tk.innerHTML='';
    const tok=document.createElementNS(FE_NS,'circle');tok.setAttribute('r','8');tok.setAttribute('stroke-width','2.5');tok.style.fill='var(--pri)';tok.style.stroke='var(--card)';tk.appendChild(tok);
    const put=p=>{tok.setAttribute('cx',p[0].toFixed(1));tok.setAttribute('cy',p[1].toFixed(1));};
    const at=id=>[G.pl[id].r,G.pl[id].hy];
    const pe=id=>root.querySelector('.fe-pl[data-p="'+id+'"]'),ae=id=>root.querySelector('.fe-af[data-a="'+id+'"]');
    const samp=d=>{const p=document.createElementNS(FE_NS,'path');p.setAttribute('d',d);p.setAttribute('fill','none');tk.appendChild(p);const len=p.getTotalLength(),n=Math.max(8,Math.ceil(len/6)),out=[];
      for(let i=0;i<=n;i++){const q=p.getPointAtLength(len*i/n);out.push([q.x,q.y]);}p.remove();return out;};
    const go=async(pts,ms)=>{const t0=Date.now();for(;;){if(g!==gen||!root.isConnected)return false;const k=Math.min(1,(Date.now()-t0)/ms),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
      const x=e*(pts.length-1),i=Math.floor(x),j=Math.min(pts.length-1,i+1),f=x-i;put([pts[i][0]+(pts[j][0]-pts[i][0])*f,pts[i][1]+(pts[j][1]-pts[i][1])*f]);if(k>=1)return true;await feWait(16);}};
    let cur=wo.start,pos=at(cur);put(pos);
    const stuck=m=>{tok.style.fill='var(--no-strong)';const e=pe(cur);if(e)e.classList.add('stuck');return {ok:false,at:cur,msg:m};};
    const scan=async()=>{const pts=[pos];(place(cur).aff||[]).forEach(a=>{const s=G.af[a.id];if(s)pts.push([s.x,s.y]);});pts.push(pos);return go(pts,Math.min(1200,260*pts.length));};
    const wrong=exp=>(wo.wrong?wo.wrong(place(cur).name,place(exp).name):'They’re on “'+place(cur).name+'”, but the next step happens on “'+place(exp).name+'”. Check where the last line points.');
    await feWait(120);
    if(!script.length){if(!await scan())return {ok:false,gone:true};return stuck(wo.fail||'No way on from here.');}
    for(const s of script){
      if(s.ev!=null){const e=model.events[s.ev];if(cur!==e.from)return stuck(wrong(e.from));if(!await go(samp(G.e[s.ev]),480))return {ok:false,gone:true};cur=e.to;pos=at(cur);continue;}
      if(cur!==s.at)return stuck(wrong(s.at));
      const a=aff(s.take);if(!a||!(place(cur).aff||[]).includes(a)||a.dead){if(!await scan())return {ok:false,gone:true};return stuck(wo.fail||'Nothing on “'+place(cur).name+'” lets them go on.');}
      const el=ae(a.id);if(!a.to){if(el)el.classList.add('bad');const s0=G.af[a.id];await go([pos,[s0.x,s0.y]],260);return stuck('“'+a.t+'” doesn’t lead anywhere yet. Draw its line.');}
      if(el)el.classList.add('used');const s0=G.af[a.id];
      if(!await go([pos,[s0.x,s0.y]],260))return {ok:false,gone:true};
      if(!await go(samp(G.w[a.id]),480))return {ok:false,gone:true};cur=a.to;pos=at(cur);}
    if(wo.goal&&cur!==wo.goal)return stuck(wo.goalMsg?wo.goalMsg(place(cur).name):'They end up on “'+place(cur).name+'”.');
    const e=pe(cur);if(e)e.classList.add('hit');tok.style.fill='var(--ok-strong)';return {ok:true,at:cur};};
  render();return api;}

/* Ifeoma's first waitlist breadboard: places and affordances, no lines */
function feWL(){return {places:[
  {id:'cls',name:'Class page',aff:[{id:'full',k:'copy',t:'6 p.m. Vinyasa · Full'},{id:'join',k:'btn',t:'Join waitlist',el:'A “Join waitlist” button on a full class'}]},
  {id:'conf',name:'Waitlist confirmation',after:'Later, someone cancels. Pinecone sends the message by itself (no tap).',aff:[{id:'line',k:'copy',t:'You’re #2 in line',el:'The member’s place in line'},{id:'leave',k:'btn',t:'Leave waitlist',role:'leave'}]},
  {id:'msg',name:'“Spot opened” message',el:'An automatic “a spot opened” message',aff:[{id:'opened',k:'copy',t:'A spot opened in 6 p.m. Vinyasa'},{id:'book',k:'btn',t:'Book this spot',el:'Booking the spot straight from the message'}]},
  {id:'done',name:'Booking confirmed',aff:[{id:'see',k:'copy',t:'See you at 6 p.m.'}]}],
  events:[{from:'conf',to:'msg'}]};}
/* the same breadboard a week later, fully wired, seen by Jonah who is already waiting */
function feWLJonah(){const m=feWL();const A=id=>{for(const p of m.places)for(const a of p.aff)if(a.id===id)return a;};
  Object.assign(A('join'),{to:'conf',lock:true,dead:'not for Jonah'});Object.assign(A('leave'),{to:'cls',lock:true});Object.assign(A('book'),{to:'done',lock:true});return m;}

/* The book's Autopay example, four ideas in a row */
function feAP(k,pop){

Course.lesson({
  id:'0004', title:'Find the elements', minutes:20, icon:'pencil',
  goals:['Wire a flow as a breadboard of places, affordances and connection lines, and play it through','Choose between a breadboard and a fat marker sketch for the question at hand','Turn a rough idea into a short list of elements that leaves room for designers'],
  parts:['Right speed','Breadboards','Fat markers','Elements'],
  read:'Read chapter 4 of the book for the full Autopay breadboards and the to-do group sketches.',
  glossary:{
    place:'Place: something you can go to in an interface, like a screen, a dialog or a menu that pops up.',
    affordance:'Affordance: something a person can act on in a place, like a button or a field. The words on screen count too, because reading them helps people decide what to do.',
    'connection-line':'Connection line: an arrow in a breadboard showing how an affordance takes you from one place to another.',
    element:'Element: one concrete part of a solution, found while shaping, like “a Join waitlist button on a full class”.',
    wireframe:'Wireframe: a detailed drawing of a screen’s layout. Too precise for this early stage of shaping.'
  },
  cheatsheet:[
    'Move fast: work <b>alone or with one trusted partner</b>, and stay away from the wrong level of detail.',
    'Answer four questions: where does this live, how do people arrive, which parts matter, and where does it lead?',
    '<b>Breadboard</b>: words only. <b>Places</b> (underlined), <b>affordances</b> under them (screen text counts), <b>connection lines</b> between them.',
    'Play the flow through. A missing line is a question you haven’t answered yet. Screen or pop-up? Doesn’t matter yet.',
    'When the 2D layout is the problem, use a <b>fat marker sketch</b>: strokes too thick for detail. Watch out for getting attached to a part that isn’t key.',
    'The output is a short list of <b>elements</b>, far narrower than the raw idea.',
    'Leave details out so designers have room: shaping fixes what must exist, not how it looks or reads.',
    'Still private and not deliverable. Next: check risks. And you can still walk away: <b>no conveyor belt</b>.'
  ],
  steps:[
/* ---------- PART 1: RIGHT SPEED ---------- */
{part:0,src:'Warm-up',pts:1,run(L){

  L.mc(L.card,['Polished screen mockups for each idea','Rough notes in words and arrows'],1,
   'Rough notes take seconds to change, so Ifeoma can try many ideas. This lesson shows two ways to stay rough on purpose.',
   'Polished mockups take hours each, and Ifeoma would get stuck on details. Rough words and arrows allow many ideas, fast.');}},
{part:0,src:'Chapter 4 · Move at the right speed',run(L){
  L.h(L.kick('learn','Move at the right speed')+'<h1 class="q">Go from an idea in words to the parts of a solution, fast</h1>'+
   '<div class="fe-pic" role="img" aria-label="Left: one or two people try five rough ideas in a fast loop. Right: a big group polishes one detailed mockup and gets stuck. Below: a new waitlist fits into today’s product between the class page and a message, with four numbered questions.">'+feSpeedSVG()+'</div>'+
   '<p class="fe-cap">Work alone or with one trusted partner who keeps pace, and skip '+L.g('wireframe','wireframes')+'. Be concrete enough to answer the four questions, and no more.</p>');
  L.done();}},
{part:0,src:'Chapter 4 · Move at the right speed',pts:6,run(L){

  L.quick(L.$('#qk'),'Does it keep Ifeoma moving fast?',['Keeps it fast','Slows it down'],[
   ['Shaping with Tomás, who knows the booking code and talks frankly.',0,'The right people, or nobody: one trusted partner who keeps pace.'],
   ['Settling that a full class needs a “Join waitlist” button.',0,'A key part of the solution. That’s exactly what to settle now.'],
   ['Choosing between teal and green for that button.',1,'Color is a visual detail. It comes much later, from the designer.'],

/* ---------- PART 2: BREADBOARDS ---------- */
{part:1,src:'Chapter 4 · Breadboarding',
 solve:async L=>{L.$$('#anc .chip').forEach(b=>b.click());},
 run(L){
  L.h(L.kick('learn','Breadboarding')+'<h1 class="q">All the wiring, none of the looks</h1>'+
   '<div id="anb"></div><p class="fe-cap">An electronics breadboard has every part and wire but no case. A '+L.g('breadboard','breadboard')+' does that for software, in words only. Tap each part.</p>'+
   '<div class="fe-row" id="anc"></div><div id="anx"></div>');
  const bd=feBoard(L.$('#anb'),{places:[
    {id:'a',name:'Class page',aff:[{id:'a1',k:'copy',t:'6 p.m. Vinyasa · Full'},{id:'a2',k:'btn',t:'Join waitlist',to:'b'}]},
    {id:'b',name:'Waitlist confirmation',aff:[{id:'b1',k:'copy',t:'You’re #2 in line'}]}]},{readOnly:true});
  const P=[['hl-p','Places',L.g('place','Places')+' are where you can go: screens, dialogs, menus that pop up. Write the name and underline it.',1],
   ['hl-a','Affordances',L.g('affordance','Affordances')+' are what people can act on there, like buttons and fields, written under the place. Screen text counts too: reading it helps people decide what to do next.',2],
   ['hl-w','Connection lines',L.g('connection-line','Connection lines')+' show how an affordance takes you from one place to another.',4]];
  const seen=new Set();
  P.forEach(p=>{const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=p[1];
    b.onclick=()=>{P.forEach(q=>bd.root.classList.remove(q[0]));bd.root.classList.add(p[0]);L.$$('#anc .chip').forEach(x=>x.classList.toggle('sel',x===b));
      L.$('#anx').innerHTML='<div class="fe-panel" style="border-left:4px solid var(--h'+p[3]+')"><b class="t">'+p[1].toUpperCase()+'</b>'+p[2]+'</div>';
      if(!seen.has(p[0])){seen.add(p[0]);if(seen.size===3){L.sheet('info','That’s all you draw','Places, affordances and lines. With just these, you can play an idea through and judge whether the steps serve the problem.');L.done();}}};
    L.$('#anc').appendChild(b);});}},

{part:1,src:'Chapter 4 · Breadboarding',
 solve:async L=>{feClick(L,'[data-a="join"]');feClick(L,'[data-p="conf"] .fe-pn');feClick(L,'[data-a="book"]');feClick(L,'[data-p="done"] .fe-pn');feClick(L,'#fwalk');},
 run(L){
  L.h(L.kick('learn','Explore · wire a breadboard')+'<h1 class="q">Ifeoma’s first waitlist breadboard has places and affordances, but no lines yet. Wire it so a member gets from a full class to a booked spot.</h1>'+
   '<p class="small" style="margin:0">Tap an affordance, then tap the place it leads to. Then walk a member through.</p>'+
   '<div id="fb1"></div><p class="fe-ro" id="fst" aria-live="polite">No lines yet.</p>'+
   '<div class="fe-row"><button type="button" class="btn pri" id="fwalk">'+L.ic('play')+'Walk a member through</button><button type="button" class="btn" id="fnice">'+L.ic('star')+'Make it look nice</button></div><div id="fwm"></div>'+
   '<div class="fe-els" id="fels"></div>');
  let fin=false;
  const els=bd=>{const r=bd.reach('cls'),out=[];bd.model.places.forEach(p=>{if(!r.has(p.id))return;if(p.el)out.push(p.el);(p.aff||[]).forEach(a=>{if(a.el&&(a.k==='copy'||a.to))out.push(a.el);});});
    L.$('#fels').innerHTML='<b class="t">ELEMENTS SO FAR · '+out.length+'</b>'+(out.length?'<ul>'+out.map(x=>'<li>'+x+'</li>').join('')+'</ul>':'<span class="small">None yet. Draw a line to start.</span>');};
  const bd=feBoard(L.$('#fb1'),feWL(),{status:L.$('#fst'),onChange:els});
  L.$('#fnice').onclick=()=>{L.$('#fwm').innerHTML='';L.fb(L.$('#fwm'),'<b>Not on a breadboard.</b> No colors, fonts or layout here: just places, affordances and lines. A breadboard settles that a button exists, not what it looks like.','no');};
  L.$('#fwalk').onclick=async()=>{L.$('#fwm').innerHTML='';
    const r=await bd.walk([{at:'cls',take:'join'},{ev:0},{at:'msg',take:'book'}],{start:'cls',goal:'done',
      wrong:(c,e)=>'The member ended up on “'+c+'”, but the next step happens on “'+e+'”. Check where your last line points.'});
    if(r.gone||!L.$('#fwm'))return;
    if(!r.ok){L.fb(L.$('#fwm'),'<b>Stuck.</b> '+r.msg,'no');return;}
    if(!fin){fin=true;L.sheet('info','Marisol’s spot gets filled','The member went Class page → Waitlist confirmation → “Spot opened” message → Booking confirmed, and nobody texted anyone. Playing a flow through like this is how you check that the steps serve the problem. When it fits, you have your elements.');L.done();}
    else L.fb(L.$('#fwm'),'The member made it to <b>Booking confirmed</b>.','ok');};}},

{part:1,src:'Chapter 4 · Breadboarding',pts:1,
 solve:async L=>{L.$$('#po .chip')[0].click();L.$('#pplay').click();},
 run(L){
  let p=null;
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">A week later, Jonah wants off the 6 p.m. waitlist and opens the class page. Where will the token get stuck?</h1>'+
   '<p class="small" style="margin:0">Same breadboard, now fully wired. Jonah is already waiting, so “Join waitlist” isn’t there for Jonah.</p>'+
   '<div class="fe-row" id="po"></div><button type="button" class="btn pri" id="pplay" hidden>'+L.ic('play')+'Walk Jonah through</button><div id="pb"></div><p class="fe-ro" id="pst" aria-live="polite"></p>');
  const O=['On the Class page','On the Waitlist confirmation','On the “Spot opened” message','Nowhere: Jonah leaves just fine'];
  O.forEach((t,j)=>{const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=t;b.style.textAlign='left';
    b.onclick=()=>{if(p!==null)return;p=j;b.classList.add('sel');L.$('#pplay').hidden=false;};L.$('#po').appendChild(b);});
  const bd=feBoard(L.$('#pb'),feWLJonah(),{status:L.$('#pst')});
  L.$('#pplay').onclick=async function(){this.disabled=true;
    const r=await bd.walk([{at:'cls',take:'leave'}],{start:'cls',fail:'Nothing on the Class page lets Jonah leave.'});
    if(r.gone||!L.$('#pst'))return;L.$('#pst').textContent='Stuck: '+r.msg;
    L.award(p===0);
    L.sheet(p===0?'ok':'no',p===0?'You called it':'It stops on the Class page',
     (p===1?'The token never reaches the confirmation: for someone already waiting, no line leads there. ':p===2?'The message only comes when a spot opens, so it can’t help Jonah today. ':p===3?'Jonah can’t leave: the token stops on the first page. ':'')+
     'The only “Leave waitlist” sits on the confirmation, a page Jonah saw once, a week ago. Playing one real case through found the hole in seconds, with no screens drawn. That’s what a few words and lines are for.');
    L.done();};}},

{part:1,src:'Chapter 4 · Breadboarding (example)',
 solve:async L=>{feClick(L,'#appop');for(let j=0;j<3;j++){feClick(L,'#apn');await feWait(30);}},
 run(L){
  let k=0,pop=false;const seen=new Set([0]);
  L.h(L.kick('ex','The book’s example')+'<h1 class="q">Breadboarding “Autopay” for an invoicing tool</h1>'+
   '<p class="small" id="apk" style="margin:4px 0 0;font-weight:600"></p><div id="apb"></div>'+
   '<p class="fe-cap">Goal: let customers’ customers pay future invoices automatically. Watch a customer walk each of the team’s ideas.</p><div id="apt"></div><div class="fe-panel" id="aptx"></div>'+
   '<div class="fe-row"><button type="button" class="btn pri" id="apn">'+L.ic('arrow')+'Next idea</button></div>');
  function show(){const S=FE_APS[k];L.$('#apk').textContent='Idea '+(k+1)+' of 4 · '+S.lab;L.$('#apb').innerHTML='';
    const bd=feBoard(L.$('#apb'),feAP(k,pop),{readOnly:true});
    L.$('#apt').innerHTML=k<2?'<div class="fe-row"><span class="small">Setup Autopay is a:</span><button type="button" class="chip'+(pop?'':' sel')+'" id="apscr">Screen</button><button type="button" class="chip'+(pop?' sel':'')+'" id="appop">Pop-up</button></div>':'';
    if(k<2){L.$('#apscr').onclick=()=>{pop=false;show();toggled();};L.$('#appop').onclick=()=>{pop=true;show();toggled();};}
    L.$('#aptx').innerHTML='<b class="t">WHAT THE TEAM SAW</b>'+S.tx;
    if(k===3){L.$('#apn').hidden=true;L.sheet('info','Two clear elements','From a cloudy “Autopay” to two concrete parts: a <b>“Use this to Autopay?” checkbox</b> added to the pay screen people already use, and a <b>“Disable Autopay” switch</b> for the invoicer. Words and lines are cheap to change, so the team could try several flows and hit the hard questions early.');L.done();}
    bd.walk(S.script,{start:S.start}).then(r=>{if(r.ok&&S.q&&bd.root.isConnected)bd.ask(S.q[0],S.q[1]);});}
  function toggled(){L.$('#aptx').insertAdjacentHTML('beforeend','<p class="small" style="margin:6px 0 0"><b>Screen or pop-up?</b> The lines didn’t move: still 2 connections. From a what’s-connected-to-what view it’s all the same, so the choice can wait.</p>');}
  L.$('#apn').onclick=()=>{if(k<3){k++;seen.add(k);show();}};
  show();}},

{part:1,src:'Chapter 4 · Breadboarding',pts:6,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Ifeoma’s notes for the studio side of the waitlist. Sort each piece.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Place','Affordance','Connection line'],[
   ['The class roster screen',0,'You can navigate to it, so it’s a place.'],
   ['A “See waitlist” button',1,'Something to act on: an affordance.'],
   ['“See waitlist” leads to the waiting list',2,'It shows how one place leads to another.'],
   ['A menu that pops up for each class',0,'Menus that pop up count as places too.'],
   ['The text “3 people waiting”',1,'Screen text is an affordance, since reading it informs the next action.'],
   ['A field for how many people may wait',1,'Fields are affordances.']],
   'Places are where you are, affordances are what you can act on or read there, and connection lines show where they lead.');}},

{part:1,src:'Chapter 4 · Breadboarding (example)',pts:1,
 solve:async L=>{feClick(L,'#ft-link');feClick(L,'[data-a="leave2"]');feClick(L,'[data-p="cls"] .fe-pn');feClick(L,'#fjw');},
 run(L){
  const add={link:false,page:false,mail:false};let graded=false,fin=false;
  L.h(L.kick('pr','Challenge')+'<h1 class="q">Fix it for Jonah. Add as little as you can, wire it, then walk Jonah through.</h1>'+
   '<p class="small" style="margin:0">The appetite is six weeks. Pick pieces from the tray, then draw a line for any new affordance.</p>'+
   '<div class="fe-row" id="ftray"></div><div id="fcb"></div><p class="fe-ro" id="fcs" aria-live="polite"></p><p class="fe-ro" id="fcr"></p>'+
   '<button type="button" class="btn pri" id="fjw">'+L.ic('play')+'Walk Jonah through</button><div id="fcm"></div>');
  const m=feWLJonah();
  const T=[['link','+ “Leave waitlist” link on the Class page'],['page','+ New place: a “My waitlists” page'],['mail','+ “Leave waitlist” link in the “Spot opened” message']];
  const pl=id=>m.places.find(p=>p.id===id);
  function apply(){const cls=pl('cls'),msg=pl('msg');
    cls.aff=cls.aff.filter(a=>a.id!=='leave2'&&a.id!=='mybtn');msg.aff=msg.aff.filter(a=>a.id!=='leave4');m.places=m.places.filter(p=>p.id!=='mw');
    if(add.link)cls.aff.push(keep.leave2);
    if(add.page){cls.aff.push(keep.mybtn);m.places.splice(1,0,keep.mw);}
    if(add.mail)msg.aff.push(keep.leave4);
    m.places.forEach(p=>p.aff.forEach(a=>{if(a.to&&!m.places.some(q=>q.id===a.to))a.to=null;}));
    bd.render();}
  const keep={leave2:{id:'leave2',k:'link',t:'Leave waitlist',role:'leave'},mybtn:{id:'mybtn',k:'btn',t:'My waitlists'},leave4:{id:'leave4',k:'link',t:'Leave waitlist',role:'leave'},
    mw:{id:'mw',name:'My waitlists',isNew:true,tag:'new place',aff:[{id:'mwl',k:'copy',t:'6 p.m. Vinyasa · #2 in line'},{id:'leave3',k:'btn',t:'Leave waitlist',role:'leave'}]}};
  const ro=api=>{const n=m.places.filter(p=>p.isNew).length;L.$('#fcr').innerHTML='Places: <b>'+m.places.length+'</b> · New places: <b>'+n+'</b> · Lines: <b>'+api.lines().length+'</b>';};
  const bd=feBoard(L.$('#fcb'),m,{status:L.$('#fcs'),onChange:api=>{if(L.$('#fcr'))ro(api);}});
  T.forEach(t=>{const b=document.createElement('button');b.type='button';b.className='chip';b.id='ft-'+t[0];b.textContent=t[1];b.style.textAlign='left';b.setAttribute('aria-pressed','false');
    b.onclick=()=>{add[t[0]]=!add[t[0]];b.classList.toggle('sel',add[t[0]]);b.setAttribute('aria-pressed',String(add[t[0]]));b.textContent=add[t[0]]?'✓ '+t[1].slice(2):t[1];apply();};
    L.$('#ftray').appendChild(b);});
  L.$('#fjw').onclick=async()=>{L.$('#fcm').innerHTML='';
    const sc=bd.route('cls',a=>a.role==='leave');
    const r=await bd.walk(sc||[],{start:'cls',goal:'cls',
      fail:add.mail&&!add.link&&!add.page?'The message only arrives when a spot opens, so it doesn’t help Jonah today. And nothing on the Class page leads out.':'Nothing Jonah can reach from the Class page lets Jonah leave yet. Add a piece, or draw its line.',
      goalMsg:c=>'Jonah left, but landed on “'+c+'”. Where should leaving take Jonah? Back to the Class page, where “Join waitlist” shows again.'});
    if(r.gone||!L.$('#fcm'))return;
    if(!r.ok){L.fb(L.$('#fcm'),'<b>Not yet.</b> '+r.msg,'no');return;}
    const lean=!m.places.some(p=>p.isNew);
    if(!graded){graded=true;L.award(lean);}
    if(lean&&!fin){fin=true;L.sheet('ok','Lean and it works','Jonah leaves from a page Jonah already visits. No new place, nothing extra to design or build. It’s the Autopay team’s move: one option on a page people already have, not a whole new area.');L.done();}
    else if(!lean)L.sheet('no','It works, but it’s heavy','Jonah gets out, but through a whole new page to design, build and test. That’s scope the appetite didn’t ask for. Remove the new place, use a link on a page Jonah already visits, and walk again.');};}},

/* ---------- PART 3: FAT MARKERS ---------- */
{part:2,src:'Chapter 4 · Fat marker sketches',run(L){
  L.h(L.kick('learn','Fat marker sketches')+'<h1 class="q">When the layout is the problem, sketch thick</h1>'+
   '<div class="fe-pic" role="img" aria-label="The same class roster twice. Drawn with a fine pen it is full of small icons, colors and badges. Drawn with a fat marker it is just two blocks: booked and waiting.">'+feFineFatSVG()+'</div>'+
   '<p class="fe-cap">When where things sit <i>is</i> the problem, a breadboard misses it. A '+L.g('fat-marker','fat marker sketch')+' uses strokes too thick for detail. Naming the step stops you jumping to detail before you’ve surveyed your options.</p>');
  L.done();}},

{part:2,src:'Chapter 4 · Fat marker sketches',
 solve:async L=>{feSlide(L,1);feSlide(L,10);},
 run(L){
  let lo=false,hi=false,fin=false;
  L.h(L.kick('learn','Explore · the pen')+'<h1 class="q">Where should waiting members go on Marisol’s crowded class roster? Drag the pen from fine to fat. What’s left to decide?</h1><div id="fsk"></div>');
  feSketch(L.$('#fsk'),{w:5,slider:true,layoutBtns:true,onChange(w){if(w<=2)lo=true;if(w>=8)hi=true;
    if(lo&&hi&&!fin){fin=true;L.sheet('info','Thick lines leave only the big question','With a fine pen you were choosing fonts, colors and labels: choices that aren’t Ifeoma’s to make yet. With a fat marker, detail is impossible, so only placement is left. Under the booked list or beside it? Try both.');L.done();}}});}},

{part:2,src:'Chapter 4 · Fat marker sketches',
 solve:async L=>{['#td1','#td2','#tdg','#tdmn'].forEach(s=>feClick(L,s));},
 run(L){
  const st={conv:false,div:1,mode:null};const tried=new Set();let fin=false;
  L.h(L.kick('ex','The book’s example')+'<h1 class="q">Sketching “to-do groups” with a fat marker</h1>'+
   '<div class="fe-sk" id="tds" role="img"></div><p class="fe-cap">Basecamp’s team typed fake to-dos as dividers. Making dividers real changes how the list is arranged, so they sketched.</p><div class="fe-panel" id="tdr" aria-live="polite"></div>'+
   '<div class="fe-row"><button type="button" class="btn pri" id="td1">Make it a real divider</button><button type="button" class="btn" id="td2" disabled>Add another divider</button></div>'+
   '<div class="fe-row" id="tdm" hidden><span class="small">Where does “add” go?</span><button type="button" class="chip" id="tdg">In every group</button><button type="button" class="chip" id="tdmn">In the menu by each to-do</button></div>');
  function draw(msg){L.$('#tds').innerHTML=feTodoSVG(st);L.$('#tds').setAttribute('aria-label','Fat marker sketch of a to-do list'+(st.conv?' with '+st.div+' divider'+(st.div>1?'s':''):' with a fake divider to-do'));
    L.$('#tdr').innerHTML=msg;L.$('#tdg').classList.toggle('sel',st.mode==='group');L.$('#tdmn').classList.toggle('sel',st.mode==='menu');
    if(!fin&&st.conv&&st.div>1&&tried.size===2){fin=true;L.sheet('info','The to-do groups elements','<b>Loose to-dos</b> at the top belong to the list itself. <b>Grouped to-dos</b> sit below. Try an add button in each group, but if it breaks up the list, rely on the menu already beside each to-do. Thick strokes kept the talk on what goes where, not fonts or spacing.');L.done();}}
  L.$('#td1').onclick=function(){st.conv=true;this.disabled=true;L.$('#td2').disabled=false;L.$('#tdm').hidden=false;draw('A real divider. To-dos above it stay <b>loose</b> and belong to the list itself. To-dos below it form a <b>group</b>.');};
  L.$('#td2').onclick=function(){st.div=2;this.disabled=true;draw('Each new divider adds another group below. The loose to-dos stay on top.');};
  L.$('#tdg').onclick=()=>{st.mode='group';tried.add('g');draw('An add button inside every group, including the loose to-dos on top. The worry: do the buttons break the list into chunks that feel too separate?');};
  L.$('#tdmn').onclick=()=>{st.mode='menu';tried.add('m');draw('“Add” lives in the menu that already sits beside each to-do. The list stays in one piece.');};
  draw('Today: a fake to-do pretends to be a divider.');}},

{part:2,src:'Chapter 4 · Fat marker sketches',pts:4,
 solve:async L=>{FE_TOOL.forEach((t,j)=>feClick(L,'#tq'+j+' [data-t="'+t.r+'"]'));},
 run(L){
  let n=0,cnt=0;
  L.h(L.kick('pr','Which tool?')+'<h1 class="q">Ifeoma has four open questions. Pick the tool for each and see what it gives back.</h1><div id="tql"></div>');
  const NM=['breadboard','fat marker sketch'];
  FE_TOOL.forEach((t,j)=>{L.$('#tql').insertAdjacentHTML('beforeend','<div class="fe-qc" id="tq'+j+'"><b>'+t.q+'</b><div class="fe-row"><button type="button" class="chip" data-t="0">Breadboard</button><button type="button" class="chip" data-t="1">Fat marker sketch</button></div><div class="tqo"></div></div>');
    const box=L.$('#tq'+j);
    box.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{if(box.dataset.done)return;box.dataset.done='1';const c=+b.dataset.t,ok=c===t.r;b.classList.add('sel');
      box.querySelectorAll('[data-t]').forEach(x=>x.disabled=true);L.award(ok);n+=ok?1:0;cnt++;
      const out=box.querySelector('.tqo'),pv=c===0?t.bb:t.fm;
      out.innerHTML='<div class="fe-mini">'+pv[0]+'</div>';L.fb(out,(ok?'<b>Right tool.</b> ':'<b>Not this one.</b> ')+pv[1],ok?'ok':'no');
      if(!ok){const rv=t.r===0?t.bb:t.fm;out.insertAdjacentHTML('beforeend','<p class="small" style="margin:8px 0 0">Better: a '+NM[t.r]+'.</p><div class="fe-mini">'+rv[0]+'</div><p class="small" style="margin:0">'+rv[1]+'</p>');}
      if(cnt===FE_TOOL.length){L.sheet(n===cnt?'ok':'info',n+' of '+cnt+' right','A path from place to place calls for a breadboard. Where things sit on one screen calls for a fat marker sketch.');L.done();}});});}},

{part:2,src:'Chapter 4 · Fat marker sketches',
 solve:async L=>{L.$$('#lp .chip').forEach(b=>b.click());},
 run(L){
  const seen=new Set();let fin=false;
  L.h(L.kick('pr','Edge cases')+'<h1 class="q">Where do these tools stop helping? Try each case.</h1><div class="fe-row" id="lp"></div><div class="fe-panel" id="ltx" aria-live="polite">Pick a case.</div><div id="lst"></div>');
  const C=[
   ['Add a “My waitlists” page',h=>{const bd=feBoard(h,{places:[
       {id:'c',name:'Class page',aff:[{id:'x1',k:'copy',t:'You’re on the waitlist'},{id:'x2',k:'btn',t:'My waitlists',to:'m'}]},
       {id:'m',name:'My waitlists',isNew:true,tag:'new place',aff:[{id:'x3',k:'copy',t:'6 p.m. Vinyasa · #2 in line'},{id:'x4',k:'btn',t:'Leave waitlist',to:'c'}]}]},{readOnly:true});},
    '<b>A new place is more scope.</b> A whole page to design, build and test, plus a way to reach it, for a job one “Leave waitlist” link on a page members already visit can do. The Autopay team made the same call.'],
   ['Layout is the question',h=>{const bd=feBoard(h,{places:[{id:'r',name:'Class roster',tag:'studio side',aff:[{id:'y1',k:'copy',t:'Booked members'},{id:'y2',k:'copy',t:'Waiting members'}]}]},{readOnly:true});bd.ask('r','Under or beside?');
      feSketch(h,{w:9,layoutBtns:true});},
    '<b>The breadboard has no answer.</b> It can say the roster shows booked and waiting members, not where they sit. When the 2D arrangement is the problem, switch to a fat marker sketch (below).'],
   ['Fine pen everywhere',h=>{feSketch(h,{w:1});},
    '<b>You’re designing, not shaping.</b> Fonts, icons, colors and labels, all chosen too early. You get stuck on details and explore fewer ideas, and whoever designs it later will read every detail as an order.'],
   ['Attached to a sidebar',h=>{feSketch(h,{w:9,sidebar:true});},
    '<b>Fat markers are looser than breadboards.</b> You can sketch a sidebar and grow attached to it, though it isn’t a key part of the idea. Keep an eye on that. It’s still far better than wireframing too early.']];
  C.forEach((c,j)=>{const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=c[0];
    b.onclick=()=>{L.$$('#lp .chip').forEach(x=>x.classList.toggle('sel',x===b));L.$('#lst').innerHTML='';c[1](L.$('#lst'));L.$('#ltx').innerHTML=c[2];seen.add(j);
      if(seen.size===C.length&&!fin){fin=true;L.sheet('info','The limits','A breadboard can’t answer layout questions, and adding places quietly adds scope. A fat marker can still tempt you to get attached to a part that isn’t key. And a fine pen means you’ve skipped ahead to design. Pick the tool for the question, and keep it rough.');L.done();}};
    L.$('#lp').appendChild(b);});}},

/* ---------- PART 4: ELEMENTS ---------- */
{part:3,src:'Chapter 4 · Elements are the output',
 solve:async L=>{L.$$('#elc .chip').forEach(b=>b.click());},
 run(L){
  const seen=new Set();
  L.h(L.kick('learn','Elements are the output')+'<h1 class="q">A cloudy idea becomes a short list of concrete parts</h1>'+
   '<div class="fe-pic fe-elv" id="elv" role="img"></div><p class="fe-cap" id="elx" aria-live="polite"></p>'+
   '<p class="small" style="margin:6px 0 0">The output of this step is a handful of '+L.g('element','elements')+'. Tap each idea to watch it narrow.</p><div class="fe-row" id="elc"></div>');
  function show(k){L.$('#elv').innerHTML=feElSVG(k);L.$('#elv').setAttribute('aria-label','The cloudy idea “'+FE_EL[k].nm.join(' ')+'” narrowed into its elements.');L.$('#elx').innerHTML=FE_EL[k].cap;
    L.$$('#elc .chip').forEach((b,j)=>b.classList.toggle('sel',j===k));seen.add(k);
    if(seen.size===FE_EL.length&&!L.$('#elc').dataset.fin){L.$('#elc').dataset.fin='1';
      L.sheet('info','That narrowing is the point','Compare “monthly calendar” with “dots on a two-month grid, plus a list below.” Far narrower and more specific, yet nothing about fonts, colors or exact words is decided.');L.done();}}
  FE_EL.forEach((e,k)=>{const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=e.nm.join(' ');b.onclick=()=>show(k);L.$('#elc').appendChild(b);});
  show(0);}},

{part:3,src:'Chapter 4 · Room for designers',
 solve:async L=>{feClick(L,'#rdr');},
 run(L){
  const tried=new Set();let fin=false;
  L.h(L.kick('learn','Room for designers')+'<h1 class="q">Leave details out on purpose</h1>'+
   '<div class="fe-pic" id="rdv" role="img"></div>'+
   '<div class="fe-row"><span class="small">Ifeoma hands over:</span><button type="button" class="chip sel" id="rdm">A detailed mockup</button><button type="button" class="chip" id="rdr">Elements + rough sketch</button></div>'+
   '<p class="fe-cap" id="rdx" aria-live="polite"></p>');
  const TX={mock:'<b>Detailed mockup.</b> Ifeoma says “just an idea,” but every detail reads as an order, more so from someone senior. Kenji’s three tries all come out the same.',
    rough:'<b>Elements + rough sketch.</b> The four elements are fixed. Looks, exact words and placement are Kenji’s. Three very different designs, all fair.'};
  function draw(m){L.$('#rdv').innerHTML=feHandSVG(m);L.$('#rdv').setAttribute('aria-label',m==='mock'?'A detailed mockup goes to Kenji, and Kenji’s three designs are copies of it.':'Four element cards go to Kenji, and Kenji’s three designs use three different layouts.');
    L.$('#rdx').innerHTML=TX[m];L.$('#rdm').classList.toggle('sel',m==='mock');L.$('#rdr').classList.toggle('sel',m==='rough');tried.add(m);
    if(tried.size===2&&!fin){fin=true;L.sheet('info','What shaping fixes, and what it leaves open','Shaping fixes which parts exist and how they connect. How it looks and reads stays open, so the designer can take it many ways. That’s why breadboards and fat markers leave details out.');L.done();}}
  L.$('#rdm').onclick=()=>draw('mock');L.$('#rdr').onclick=()=>draw('rough');
  draw('mock');}},

{part:3,src:'Chapter 4 · Elements are the output',pts:1,
 solve:async L=>{L.$$('#trk .fe-ti[data-d="1"]').forEach(b=>b.click());feClick(L,'#trg');},
 run(L){
  let graded=false;
  L.h(L.kick('pr','Challenge')+'<h1 class="q">Ifeoma’s hand-off notes mix elements with design details. Tap each detail to leave it open for Kenji.</h1>'+
   '<div class="fe-tz k"><b>HAND-OFF CARD</b><div id="trk"></div></div><div class="fe-tz c"><b>LEFT OPEN FOR KENJI</b><div id="trc"></div></div>'+
   '<button type="button" class="btn pri" id="trg">'+L.ic('check')+'Hand it over</button><div id="trm"></div>');
  const I=[['“Join waitlist” button on a full class',0],['Teal button with rounded corners',1],['Studio’s list of waiting members',0],['Message wording: “Good news, a spot is yours!”',1],
    ['“Leave waitlist” link on the class page',0],['Waiting members in a 3-column grid with photos',1],['Automatic “a spot opened” message',0],['14px bold font for the place in line',1]];
  I.forEach(it=>{const b=document.createElement('button');b.type='button';b.className='fe-ti';b.textContent=it[0];b.dataset.d=it[1];
    b.onclick=()=>{if(graded)return;(b.parentNode.id==='trk'?L.$('#trc'):L.$('#trk')).appendChild(b);};L.$('#trk').appendChild(b);});
  L.$('#trg').onclick=()=>{if(graded)return;graded=true;
    const wrong=L.$$('.fe-ti').filter(b=>(b.parentNode.id==='trc')!==(b.dataset.d==='1'));
    L.$$('.fe-ti').forEach(b=>b.classList.add(wrong.includes(b)?'wrong':'good'));L.$('#trg').disabled=true;
    const ok=!wrong.length;L.award(ok);
    L.sheet(ok?'ok':'no',ok?'Four elements, nothing more':'Not quite',
     (ok?'':'Red cards are in the wrong place. ')+'The card says what must exist: join, leave, the studio’s list and the automatic message. Colors, wording, grids and fonts are design choices, so they stay open for Kenji.');
    L.done();};}},

{part:3,src:'Chapter 4 · Not deliverable yet',pts:1,run(L){
  L.h(L.kick('pr','Where are we?')+'<h1 class="q">Put the waitlist’s journey in order, from first request to the pitch.</h1>');
  L.order(L.card,['Support hears “Can you add a waitlist?”','Set the appetite and narrow the problem','Breadboard the flows with Tomás','List the elements','Stress-test for risks and rabbit holes','Write it up as a pitch'],
   'Set boundaries, find the elements, check the risks, write the pitch. This lesson covered breadboards, sketches and elements. The risk check comes next.');}},
{part:3,src:'Chapter 4 · Not deliverable yet',run(L){
  L.h(L.kick('learn','Not deliverable yet')+'<h1 class="q">Elements are a big step, but not the finish line</h1>'+
   '<div class="fe-pic" role="img" aria-label="Shaping as a line: boundaries done, elements where you are now, risks next, then the pitch. The notes so far are private. An arrow leaves the line: you can still walk away.">'+feNextSVG()+'</div>'+
   '<p class="fe-cap">The notes are still rough and private, and there may be holes that would stop it shipping in time. Next comes a risk check, then the pitch. Nothing is bet yet, so you can still walk away.</p>');
  L.done();}},
{part:3,src:'Chapter 4 · No conveyor belt',pts:1,run(L){
  L.h(L.kick('pr','No conveyor belt')+'<h1 class="q">Ifeoma has elements for a studio “logo upload.” Then Ifeoma learns studios almost never need it right now. Does it have to be pitched?</h1>');
  L.mc(L.card,['Yes, the shaping is done, so it must go forward','No, nothing is bet yet, so it can be set aside'],1,
   'Shaping isn’t a conveyor belt. Nothing was promised, and the work still made the idea easier to pick up later.',
   'Nothing has been bet or promised. Shaping isn’t a conveyor belt, so Ifeoma can walk away and keep the work as a better option for later.');}}
  ]
});
