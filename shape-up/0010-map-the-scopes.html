/* ---------- territory map data ---------- */
const SM_JUNK={'Front-end':'g','Back-end':'g','Bugs':'g','Kenji’s tasks':'p','Bea’s tasks':'p'};
const SM_NG={'Join the waitlist':'join','Spot opens':'spot','Notify members':'notify','Studio settings':'settings','Waiting order':'order','Chowder':'chow'};
const SM_GN={join:'Join the waitlist',spot:'Spot opens',notify:'Notify members',settings:'Studio settings',order:'Waiting order',chow:'Chowder'};
const SM_NAMES=['Join the waitlist','Spot opens','Notify members','Studio settings','Chowder','Front-end','Back-end','Bugs','Kenji’s tasks','Bea’s tasks'];
const smT=(id,t,g,o,d,f,n)=>({id,t,g,o,d:d||0,f:f||0,n:!!n});
/* d = day the task is found, f = day it gets checked off (both illustrative), n = a nice-to-have */

 smT('s3','First tap wins','spot','B',5),
 smT('s4','“Spot taken” screen','spot','K',6),

 smT('n4','Studios edit the message wording','notify','B',9,0,1),

const WLX=[ /* extra tasks for the edge-case presets */
 smT('x1','Bug: email shows the wrong time zone','notify','B',9),
 smT('x2','Bug: two taps both got the spot','spot','B',9),
 smT('x3','Bug: Join button overlaps on small phones','join','K',9),

 smT('c3','Rename an old settings label','chow','K',9),
 smT('c4','Swap an outdated icon','chow','K',9)];
const WLALL=WL.concat(WLX);

function smAt(st,day,tasks){st.day=day;st.vis=new Set(tasks.filter(t=>t.d<=day).map(t=>t.id));st.done=new Set(tasks.filter(t=>t.f&&t.f<=day).map(t=>t.id));}
function smCanon(tasks,groups){return groups.map(g=>({name:SM_GN[g],ids:tasks.filter(t=>t.g===g).map(t=>t.id)}));}
function smTake(st,ids){st.terrs.forEach(z=>z.ids=z.ids.filter(x=>!ids.includes(x)));}
function smPrune(st){st.terrs=st.terrs.filter(z=>z.ids.length);}

/* the book's signs, as live checks on one territory */
function smCheck(api,z){
  const st=api.st,TT=api.TT,ng=api.cfg.ng||SM_NG;
  const ids=z.ids.filter(id=>st.vis.has(id)),n=ids.length,gs=[...new Set(ids.map(id=>TT[id].g))];
  const name=z.name||'',chow=name==='Chowder',junk=SM_JUNK[name]||'',own=ng[name];
  const r={n,ids,gs,name,chow,doneN:ids.filter(id=>st.done.has(id)).length,flags:[],mixed:false,ok:false};
  if(!n)return r;
  if(!name)r.flags.push('Pick a name for this scope');
  if(junk==='g')r.flags.push('Junk drawer: “'+name+'” could be a scope in any project');
  if(junk==='p')r.flags.push('Sorted by person, not by structure');
  if(chow){const home=ids.filter(id=>TT[id].g!=='chow').length;
    if(n>5)r.flags.push(n+' items. Past three to five, something’s fishy');
    if(home)r.flags.push(home+(home>1?' items belong together somewhere':' item has a real home')+': a scope is hiding here');}
  else{r.mixed=gs.length>1;
    if(n>7)r.flags.push('Too big to finish in a few days');
    if(name&&!junk&&!r.mixed&&own&&own!==gs[0])r.flags.push('The name doesn’t match these tasks');}
  if(name&&st.terrs.filter(x=>x.name===name).length>1)r.flags.push('Two scopes share this name');
  r.ok=!r.flags.length&&!r.mixed;
  return r;}
function smRo(c){
  if(!c.n)return '<div class="sm-ro">Empty for now</div>';
  let h='';
  if(c.chow){if(!c.flags.length)h='<div class="sm-ro"><span class="sm-good">'+c.n+' loose '+(c.n>1?'items':'item')+'. Fine: keep an eye on it.</span></div>';}
  else if(c.mixed)h='<div class="sm-ro sm-hard">How done? Hard to say: the tasks inside are unrelated.</div>';
  else{const p=Math.round(c.doneN/c.n*100);
    h='<div class="sm-pb" role="img" aria-label="'+c.doneN+' of '+c.n+' done"><i style="width:'+p+'%"></i></div><div class="sm-ro">'+(c.doneN===c.n?'<span class="sm-good">Done ✓</span>':c.doneN+' of '+c.n+' done')+'</div>';}
  return h+c.flags.map(f=>'<span class="sm-flag">⚠ '+f+'</span>').join('');}

/* the overhead view: every task is a dot, every scope a territory. Redraws with the lists below it. */
let smUid=0;
function smMini(api){
  const st=api.st,TT=api.TT,cfg=api.cfg,W=300,SP=16,R=5.5,CW=144,f=n=>n.toFixed(1);
  const colOf=id=>{const k=st.terrs.findIndex(z=>z.ids.includes(id));if(k<0)return 0;return st.terrs[k].name==='Chowder'?0:(k%4)+1;};
  const regs=[];
  if(st.person){
    (cfg.owners||[['K','Kenji’s list'],['B','Bea’s list']]).forEach(([o,lab])=>{const ids=cfg.tasks.filter(t=>t.o===o&&st.vis.has(t.id)).map(t=>t.id);
      regs.push({name:lab,ids,col:-1,ro:ids.filter(id=>st.done.has(id)).length+'/'+ids.length+' tasks',bad:false,dotCol:colOf});});
  }else st.terrs.forEach((z,k)=>{const c=smCheck(api,z);if(!c.n)return;const col=z.name==='Chowder'?0:(k%4)+1;
    regs.push({name:z.name||'Unnamed',ids:c.ids,col,bad:!c.ok,dotCol:()=>col,
      ro:c.chow?c.n+' loose':c.mixed?'done? ?':c.doneN===c.n?'done ✓':c.doneN+'/'+c.n});});
  const cv=n=>n<=0?'var(--muted)':'var(--h'+n+')',cb=n=>n<=0?'var(--soft)':'var(--h'+n+'-bg)';
  const per=Math.floor((CW-12)/SP),rowsOf=r=>Math.max(1,Math.ceil(r.ids.length/per)),
    inl=r=>{const last=r.ids.length-(rowsOf(r)-1)*per;return 12+last*SP+r.ro.length*6.2+8<CW;},
    hOf=r=>24+rowsOf(r)*SP+(inl(r)?2:16);
  const colY=[4,4];let s='';
  const dot=(id,x,y,c)=>{const dn=st.done.has(id),nice=st.nice.has(id),sel=api.sel.has(id),hi=cfg.hi&&cfg.hi(TT[id]);
    return (sel||hi?'<circle cx="'+f(x)+'" cy="'+f(y)+'" r="'+(R+2.5)+'" fill="none" stroke="'+(sel?'var(--pri)':'var(--h4)')+'" stroke-width="1.8"/>':'')+
      '<circle cx="'+f(x)+'" cy="'+f(y)+'" r="'+R+'" fill="'+(dn?cv(c):'var(--card)')+'" stroke="'+cv(c)+'" stroke-width="1.8"'+(nice?' stroke-dasharray="2 2"':'')+'/>'+
      (nice?'<text x="'+f(x)+'" y="'+f(y+3.5)+'" text-anchor="middle" font-size="10" font-weight="700" fill="'+(dn?'var(--card)':cv(c))+'">~</text>':'');};
  regs.forEach(r=>{const j=colY[0]<=colY[1]?0:1,x=4+j*(CW+4),y=colY[j],h=hOf(r);colY[j]+=h+6;
    const stroke=r.bad?'var(--no)':r.col<0?'var(--line2)':cv(r.col);
    s+='<rect x="'+x+'" y="'+y+'" width="'+CW+'" height="'+h+'" rx="12" fill="'+(r.col<0?'var(--card)':cb(r.col))+'" stroke="'+stroke+'" stroke-width="2"'+(r.bad||r.col===0?' stroke-dasharray="5 4"':'')+'/>';
    const nm=r.name.length>19?r.name.slice(0,18)+'…':r.name,ry=inl(r)?y+30+(rowsOf(r)-1)*SP+4:y+h-6;
    s+='<text x="'+(x+8)+'" y="'+(y+16)+'" font-size="12" font-weight="700" fill="'+(r.col<0?'var(--ink)':cv(r.col))+'">'+nm+'</text>'+
       '<text x="'+(x+CW-7)+'" y="'+ry+'" text-anchor="end" font-size="11" font-weight="600" fill="'+(r.bad?'var(--no)':'var(--muted)')+'">'+r.ro+'</text>';
    r.ids.forEach((id,i)=>{s+=dot(id,x+12+(i%per)*SP,y+30+Math.floor(i/per)*SP,r.dotCol(id));});});
  let y=Math.max(colY[0],colY[1]);
  const inT=new Set();st.terrs.forEach(z=>z.ids.forEach(id=>inT.add(id)));
  const loose=st.person?[]:cfg.tasks.filter(t=>st.vis.has(t.id)&&!inT.has(t.id)).map(t=>t.id);
  const fog=!st.person&&cfg.fog?cfg.fog():'';const pid='smfog'+(++smUid);
  if(loose.length||fog||!regs.length){const lp=Math.floor((W-20)/SP),rows=Math.max(1,Math.ceil(loose.length/lp)),h=24+(loose.length?rows*SP:0)+(fog?26:4);
    s+='<rect x="4" y="'+y+'" width="'+(W-8)+'" height="'+h+'" rx="12" fill="var(--card)" stroke="var(--line2)" stroke-width="2" stroke-dasharray="4 4"/>'+
       '<text x="12" y="'+(y+16)+'" font-size="12" font-weight="700" fill="var(--muted)">Unmapped ground · '+loose.length+' loose</text>';
    loose.forEach((id,i)=>{s+=dot(id,16+(i%lp)*SP,y+31+Math.floor(i/lp)*SP,0);});
    if(fog){const fy=y+h-24;s+='<defs><pattern id="'+pid+'" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="10" fill="var(--soft2)"/></pattern></defs>'+
      '<rect x="10" y="'+fy+'" width="'+(W-20)+'" height="18" rx="7" fill="url(#'+pid+')"/><text x="'+(W/2)+'" y="'+(fy+13)+'" text-anchor="middle" font-size="11" fill="var(--muted)">fog: not walked yet</text>';}
    y+=h+4;}
  return '<svg class="sm-mini" viewBox="0 0 '+W+' '+f(y)+'" role="img" aria-label="Overhead view: each dot is a task, each coloured area a scope. Filled dots are done.">'+s+'</svg>';}

/* the territory map. cfg: {tasks, st:{terrs,vis,done,nice,person,day}, edit, tag, names, ng, day:{on(v)}, person, lock,
   hi(task), cap(), fog(), onTap(id), onChange(), owners, legend} */
function smMap(host,cfg){
  const st=cfg.st,TT={};cfg.tasks.forEach(t=>TT[t.id]=t);
  const sel=new Set();
  const root=document.createElement('div');root.className='sm';
  root.innerHTML=(cfg.day?'<label class="sm-day"><div class="sm-dayh"><span>Time in the cycle</span><b class="sm-dv"></b></div><input type="range" min="1" max="10" step="1" value="'+st.day+'" aria-label="Day of the cycle, 1 to 10"></label>':'')+
    (cfg.person?'<div class="sm-seg" role="group" aria-label="How the lists are organized"><button data-a="vs" class="on" aria-pressed="true">By scope</button><button data-a="vp" aria-pressed="false">By person</button></div>':'')+
    '<div class="sm-body"></div>';
  host.appendChild(root);
  const body=root.querySelector('.sm-body');
  const api={root,st,sel,TT,cfg,draw,check:z=>smCheck(api,z),
    view(p){st.person=p;seg();draw();},unlock(){cfg.lock=false;seg();}};
  const chg=()=>{if(cfg.onChange)cfg.onChange();};
  function seg(){root.querySelectorAll('.sm-seg button').forEach(b=>{const on=(b.dataset.a==='vp')===!!st.person;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);b.disabled=!!cfg.lock;});}
  const chip=id=>{const t=TT[id],dn=st.done.has(id),nice=st.nice.has(id),s=sel.has(id);
    if(cfg.compact)return '<span class="sm-dot sm-c'+(dn?' done':'')+(cfg.hi&&cfg.hi(t)?' hi':'')+'"><i class="o'+t.o+'" aria-hidden="true">'+t.o+'</i><span>'+(nice?'<span class="nt">~</span> ':'')+t.t+(dn?' <span class="ck">✓</span>':'')+'</span></span>';
    return '<button class="sm-dot'+(s?' sel':'')+(dn?' done':'')+(cfg.hi&&cfg.hi(t)?' hi':'')+(cfg.onTap?' tap':'')+'" data-id="'+id+'" aria-pressed="'+s+'"><i class="o'+t.o+'" aria-hidden="true">'+t.o+'</i><span>'+(nice?'<span class="nt">~</span> ':'')+t.t+(dn?' <span class="ck">✓</span>':'')+'</span></button>';};
  const selName=(z,k)=>{const names=(!z.name||cfg.names.includes(z.name))?cfg.names:[z.name].concat(cfg.names);
    return '<select data-z="'+k+'" aria-label="Name of this scope">'+(z.name?'':'<option value="" selected>Name it…</option>')+names.map(n=>'<option'+(n===z.name?' selected':'')+'>'+n+'</option>').join('')+'</select>';};
  function draw(){
    if(cfg.day){root.querySelector('.sm-dv').textContent='Day '+st.day+' · week '+(st.day<=5?1:2);const inp=root.querySelector('.sm-day input');if(+inp.value!==st.day)inp.value=st.day;}
    let h=cfg.cap?'<div class="sm-cap">'+cfg.cap()+'</div>':'';
    const edit=cfg.edit&&!st.person;
    if(edit&&sel.size)h+='<div class="sm-bar"><span><b>'+sel.size+'</b> selected</span><button data-a="new" class="sm-b pri">＋ New scope</button>'+(cfg.tag?'<button data-a="tag" class="sm-b">~ Tag</button>':'')+'<button data-a="clr" class="sm-b">Clear</button></div>';
    h+='<div class="sm-field">'+(cfg.mini===false?'':smMini(api)+'<div class="sm-mlab">'+(st.person?'Same dots, sorted by person. A dot’s colour is the scope it belongs to.':'Overhead view · <b>●</b> done · <b>○</b> to do'+(cfg.tag?' · <b>~</b> nice-to-have':'')+'. The lists below hold the same tasks.')+'</div>');
    if(st.person){
      const own=cfg.owners||[['K','Kenji’s list'],['B','Bea’s list']];
      h+=own.map(([o,lab])=>{const ids=cfg.tasks.filter(t=>t.o===o&&st.vis.has(t.id)).map(t=>t.id),dn=ids.filter(id=>st.done.has(id)).length;
        return '<div class="sm-zone"><div class="sm-zh"><b>'+lab+'</b></div>'+ids.map(chip).join('')+'<div class="sm-ro">'+dn+' of '+ids.length+' tasks checked</div></div>';}).join('')+
        '<div class="sm-zone"><div class="sm-zh"><b>Which parts of the waitlist work?</b></div>'+st.terrs.filter(z=>z.name!=='Chowder'&&z.ids.some(id=>st.vis.has(id))).map(z=>'<div class="sm-bl"><span>'+z.name+'</span><b>?</b></div>').join('')+'</div>';
    }else{
      const inT=new Set();st.terrs.forEach(z=>z.ids.forEach(id=>inT.add(id)));
      const loose=cfg.tasks.filter(t=>st.vis.has(t.id)&&!inT.has(t.id)).map(t=>t.id);
      const fog=cfg.fog?cfg.fog():'';
      st.terrs.forEach((z,k)=>{const c=smCheck(api,z);if(!c.n&&!edit)return;
        h+='<div class="sm-zone sm-t c'+(z.name==='Chowder'?0:(k%4)+1)+'"><div class="sm-zh">'+(edit?selName(z,k):'<b>'+(z.name||'Unnamed')+'</b>')+(edit&&sel.size?'<button class="sm-mv" data-a="mv" data-z="'+k+'">Move here</button>':'')+'</div>'+c.ids.map(chip).join('')+smRo(c)+'</div>';});
      if(loose.length||edit||fog)h+='<div class="sm-zone"><div class="sm-zh"><b>Unmapped ground</b><span class="small">'+loose.length+' loose</span>'+(edit&&[...sel].some(id=>inT.has(id))?'<button class="sm-mv" data-a="mv" data-z="-1">Move here</button>':'')+'</div>'+loose.map(chip).join('')+(fog?'<div class="sm-fog">'+fog+'</div>':'')+'</div>';
      if(edit&&!sel.size)h+='<p class="sm-tip">Tap tasks to select them. Then make a new scope, or move them.</p>';
    }
    h+='</div>';
    if(cfg.legend!==false)h+='<p class="sm-leg">'+(cfg.legend||'<b>K</b> Kenji (design) · <b>B</b> Bea (code) · ✓ checked off. Task days are illustrative.')+'</p>';
    if(!st.person){const cs=st.terrs.map(z=>smCheck(api,z)).filter(c=>c.n);const fl=cs.filter(c=>!c.ok).length;
      h+='<p class="sm-sum" aria-live="polite">'+cs.length+' scope'+(cs.length===1?'':'s')+' · '+cs.filter(c=>c.ok).length+' clear · '+fl+' flagged</p>';}
    body.innerHTML=h;}
  root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!root.contains(b))return;
    const a=b.dataset.a,id=b.dataset.id;
    if(id){if(cfg.onTap){cfg.onTap(id);return;}if(!cfg.edit||st.person)return;sel.has(id)?sel.delete(id):sel.add(id);draw();return;}
    if(a==='vs'||a==='vp'){if(cfg.lock)return;st.person=a==='vp';sel.clear();seg();draw();if(cfg.onView)cfg.onView(st.person);return;}
    if(a==='new'){const ids=[...sel];smTake(st,ids);st.terrs.push({name:'',ids});sel.clear();smPrune(st);draw();chg();return;}
    if(a==='mv'){const k=+b.dataset.z,ids=[...sel],dest=k>=0?st.terrs[k]:null;smTake(st,ids);if(dest)dest.ids.push(...ids);sel.clear();smPrune(st);draw();chg();return;}
    if(a==='tag'){const all=[...sel].every(x=>st.nice.has(x));sel.forEach(x=>all?st.nice.delete(x):st.nice.add(x));sel.clear();draw();chg();return;}
    if(a==='clr'){sel.clear();draw();}});
  root.addEventListener('change',e=>{const s=e.target.closest('select[data-z]');if(!s)return;st.terrs[+s.dataset.z].name=s.value;draw();chg();});
  if(cfg.day){const inp=root.querySelector('.sm-day input');inp.addEventListener('input',()=>{cfg.day.on(+inp.value);draw();chg();});}
  seg();draw();
  return api;}
/* helpers the solvers use: they drive the real controls */
const smPick=(r,ids)=>ids.forEach(id=>r.querySelector('.sm-dot[data-id="'+id+'"]').click());
const smBtn=(r,a)=>r.querySelector('[data-a="'+a+'"]').click();
const smName=(r,nm)=>{const s=[...r.querySelectorAll('select[data-z]')].find(x=>x.value==='');s.value=nm;s.dispatchEvent(new Event('change',{bubbles:true}));};
const smSlide=(r,v)=>{const i=r.querySelector('.sm-day input');i.value=v;i.dispatchEvent(new Event('input',{bubbles:true}));};

/* ---------- the cross-section: UI above the line, back-end below ---------- */
const cxCls=(ui,be)=>be>=ui*2?'ice':ui>=be*2?'up':'cake';
const CX_NAME={cake:'Layer cake',ice:'Iceberg',up:'Upside-down iceberg'};
function cxSvg(ui,be,tangled){
  const cls=cxCls(ui,be),Y=106,hU=12+ui*8.6,hB=12+be*11.6,wU=56+ui*24,wB=56+be*24,c=160,f=n=>n.toFixed(1);
  let s='<rect x="0" y="0" width="320" height="'+Y+'" fill="var(--soft)"/><rect x="0" y="'+Y+'" width="320" height="'+(240-Y)+'" fill="var(--pri-bg)"/>';
  if(cls==='cake'){const w=(wU+wB)/2,x=c-w/2;
    s+='<rect x="'+f(x)+'" y="'+f(Y-hU)+'" width="'+f(w)+'" height="'+f(hU)+'" rx="6" fill="var(--h1-bg)" stroke="var(--h1)" stroke-width="2"/>'+
       '<rect x="'+f(x)+'" y="'+Y+'" width="'+f(w)+'" height="'+f(hB)+'" rx="6" fill="var(--h2-bg)" stroke="var(--h2)" stroke-width="2"/>';
    for(let k=1;k<3;k++){const yy=Y+hB*k/3;s+='<line x1="'+f(x+6)+'" x2="'+f(x+w-6)+'" y1="'+f(yy)+'" y2="'+f(yy)+'" stroke="var(--h2)" stroke-width="1" stroke-dasharray="3 4" opacity=".6"/>';}
  }else{
    const top=[[c-wU/2,Y],[c-wU*0.3,Y-hU*0.55],[c-wU*0.08,Y-hU],[c+wU*0.14,Y-hU*0.78],[c+wU*0.32,Y-hU*0.4],[c+wU/2,Y]];
    const bot=[[c-wB/2,Y],[c+wB/2,Y],[c+wB*0.42,Y+hB*0.45],[c+wB*0.2,Y+hB],[c-wB*0.12,Y+hB*0.9],[c-wB*0.4,Y+hB*0.5]];
    const P=a=>a.map(p=>f(p[0])+','+f(p[1])).join(' ');
    s+='<polygon points="'+P(top)+'" fill="var(--h1-bg)" stroke="var(--h1)" stroke-width="2" stroke-linejoin="round"/>'+
       '<polygon points="'+P(bot)+'" fill="var(--h2-bg)" stroke="var(--h2)" stroke-width="2" stroke-linejoin="round"/>';}
  if(tangled)for(let k=-1;k<=1;k++){const x=c+k*14;s+='<path d="M'+x+' '+f(Y-hU*0.45)+' C '+(x+10)+' '+(Y-4)+', '+(x-10)+' '+(Y+4)+', '+x+' '+f(Y+Math.min(hB*0.7,60))+'" fill="none" stroke="var(--no)" stroke-width="2" stroke-dasharray="3 3"/>';}
  s+='<line x1="0" x2="320" y1="'+Y+'" y2="'+Y+'" stroke="var(--pri)" stroke-width="2" stroke-dasharray="7 5"/>'+
     '<rect x="4" y="'+(Y-20)+'" width="66" height="16" rx="5" fill="var(--card)" opacity=".9"/><text x="9" y="'+(Y-8)+'" font-size="11" fill="var(--muted)">on screen ↑</text>'+
     '<rect x="4" y="'+(Y+4)+'" width="112" height="16" rx="5" fill="var(--card)" opacity=".9"/><text x="9" y="'+(Y+16)+'" font-size="11" fill="var(--muted)">under the surface ↓</text>';
  const ty=hU>=30?Y-hU*0.38:Y-hU-6;
  s+='<text x="'+c+'" y="'+f(ty+4)+'" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--h1)">UI · design</text>'+
     '<text x="'+c+'" y="'+f(Y+Math.max(hB*0.45,14)+4)+'" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--h2)">Back-end · code</text>';
  return s;}
function cxMove(cls,tangled){
  if(cls==='cake')return 'Keep design and code tasks together in one scope. You can judge the work by its screens. A good default for apps that mostly enter, save and show back information.';
  if(cls==='ice')return tangled?'The screens depend on the hidden logic, so factoring the UI out won’t give you a piece you can finish. Look for back-end concerns you can split into scopes and finish in stages. But first ask: is all that complexity really necessary?':
    'Factor the UI out as its own scope. If the back-end is heavy enough, split it into separate concerns, each its own scope. But first ask: is all that complexity really necessary?';
  return 'Split the heavy UI work into pieces you can finish and integrate in stages. But first ask: do we really need that fancy UI?';}
/* o: {ui,be,tangled,on(api)} */
function cxMake(host,o){
  const v={ui:o.ui,be:o.be,tangled:!!o.tangled};
  const sl=(k,lab,sub)=>'<label class="cx-sl"><div class="cx-slh"><span><b>'+lab+'</b> <small>'+sub+'</small></span><b class="cx-v" data-k="'+k+'"></b></div><input type="range" min="1" max="10" step="1" value="'+v[k]+'" data-k="'+k+'" aria-label="'+lab+', 1 to 10" style="accent-color:var(--'+(k==='ui'?'h1':'h2')+')"></label>';
  host.insertAdjacentHTML('beforeend','<div class="cx"><svg class="cx-svg" viewBox="0 0 320 240" role="img" aria-label="Cross-section of one scope: UI work above the line, back-end work below it"></svg>'+
    '<div class="cx-leg"><span><i style="background:var(--h1-bg);border:2px solid var(--h1)"></i>UI work</span><span><i style="background:var(--h2-bg);border:2px solid var(--h2)"></i>back-end work</span></div>'+
    '<div class="cx-nmrow" aria-live="polite"></div>'+sl('ui','UI surface','screens, interactions')+sl('be','Back-end depth','logic, data')+'<div class="cx-ro"></div></div>');
  const el=host.lastElementChild;
  const api={v,el,cls:()=>cxCls(v.ui,v.be),draw,set(ui,be,t){v.ui=ui;v.be=be;v.tangled=!!t;draw();}};
  function draw(){const c=cxCls(v.ui,v.be),big=v.ui+v.be>=17;
    el.querySelector('svg').innerHTML=cxSvg(v.ui,v.be,v.tangled);
    el.querySelectorAll('input[data-k]').forEach(i=>{if(+i.value!==v[i.dataset.k])i.value=v[i.dataset.k];});
    el.querySelectorAll('.cx-v').forEach(b=>b.textContent=v[b.dataset.k]);
    el.querySelector('.cx-nmrow').innerHTML='<span class="cx-nm '+c+'">'+CX_NAME[c]+'</span><span>UI '+v.ui+' · back-end '+v.be+(v.tangled?' · tied together':'')+'</span>';
    el.querySelector('.cx-ro').innerHTML='<p style="margin:0"><b>The move:</b> '+cxMove(c,v.tangled)+'</p>'+
      (big?'<p class="warn">⚠ Whatever its shape, this is a lot for one scope. If it can’t be finished in a few days, break it up.</p>':'');}
  el.querySelectorAll('input[data-k]').forEach(i=>i.addEventListener('input',()=>{v[i.dataset.k]=+i.value;draw();if(o.on)o.on(api);}));
  draw();return api;}
const cxSlide=(el,k,val)=>{const i=el.querySelector('input[data-k="'+k+'"]');i.value=val;i.dispatchEvent(new Event('input',{bubbles:true}));};

const DR=[
 smT('a1','New-draft button','start','D'),smT('a2','Create the draft record','start','P'),smT('a3','Design the draft as it’s written','start','D'),

const DR_NG={'Start New':'start','Locate':'locate','Trash':'trash','Save/Edit':'save','Send':'send','Store':'store','Reply':'reply'};

Course.lesson({
  id:'0010', title:'Map the scopes', minutes:20, icon:'map',
  goals:['Organize a project by its structure (scopes) instead of by person','Tell when scopes are drawn well, and when to redraw them','Handle layer cakes, icebergs, chowder lists and nice-to-haves marked with ~'],
  parts:['By structure','Discovering scopes','Right or wrong','Kinds of work'],
  read:'Read chapter 12 of the book to see the Message drafts scope map change picture by picture.',
  glossary:{
    'scope-map':'Scope map: a picture of the project divided into scopes, like territories on a map. In practice, one to-do list per scope.',
    'layer-cake':'Layer cake: work where the UI and a thin layer of code below it grow evenly, so design and code tasks share one scope.',
    iceberg:'Iceberg: work where one side is much bigger than the other, such as a simple form with complex logic behind it. An upside-down iceberg is the reverse: heavy UI, simple back-end.',
    chowder:'Chowder: a short list of stray tasks that belong to no scope. If it grows past three to five items, a scope is probably hiding in it.',
    'nice-to-have':'Nice-to-have: a task worth doing only if there’s time. Marked with a ~ at the front so it’s easy to cut.',
    'junk-drawer':'Grab bag or junk drawer: a scope with a name that could fit any project, like “front-end” or “bugs”. A sign the scopes need redrawing.'
  },
  cheatsheet:[
    '<b>Organize by structure, not by person.</b> Lists per person can be busy while no part of the project is actually finished.',
    'A <b>scope</b> is an integrated slice (design and code) that can be finished on its own in a few days or less. Bigger than a task, much smaller than the project.',
    'The <b>scope map</b> is discovered, not planned: do real work first. Expect real scopes to appear around the turn from week one to week two, and expect some redrawing.',
    'Scopes become <b>the language of the project</b>: report status in scopes, not task by task.',
    'Right scopes: you see the whole, talk flows, new tasks have an obvious home. Redraw if “done” is hard to say, the name fits any project, or it’s too big.',
    '<b>Layer cake</b>: keep UI and code in one scope. <b>Iceberg</b> (either way up): split the heavy side out, but first question whether it’s needed.',
    'Keep a small <b>Chowder</b> list (three to five items at most). Mark <b>nice-to-haves with ~</b> so they’re easy to cut.'
  ],
  steps:[
/* ---------- PART 1: BY STRUCTURE ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Three friends help you move house. Which to-do lists tell you fastest whether the kitchen is ready?</h1>');
  L.mc(L.card,['Lists by room: Kitchen, Bedroom, Garage','Lists by person: Lia’s, Leo’s, Sam’s'],0,
   'One glance at the Kitchen list answers it. Per-person lists would make you hunt through all three. This chapter applies the same idea to software.',
   'With per-person lists, kitchen jobs are scattered across three lists. Lists by room show at once what’s done and what isn’t.');}},
{part:0,src:'Chapter 12 · Organize by structure, not by person',
 solve:async L=>{L.$('#fe [data-v="1"]').click();},
 run(L){
  L.h(L.kick('learn','Organize by structure')+'<h1 class="q">Lists per person hide whether anything is finished</h1>'+
   '<div class="sm-seg" id="fe" role="group" aria-label="How the event’s lists are organized"><button data-v="0" class="on" aria-pressed="true">By volunteer</button><button data-v="1" aria-pressed="false">By area</button></div>'+
   '<div class="vz"><svg id="fv" viewBox="0 0 300 214" role="img" aria-label="Twelve event jobs as tiles, sorted into three lists"></svg></div>'+
   '<p class="vz-cap" id="fc"></p>'+
   '<p class="vz-cap">An illustration of the book’s fundraising event (jobs are illustrative): the same jobs, listed two ways. Designer and programmer lists fail the same way.</p>');
  /* [label, area 0 food / 1 venue / 2 sound, volunteer, done] */
  const J=[['Menu',0,0,1],['Catering',0,1,1],['Cake',0,2,1],['Drinks',0,0,1],['Book hall',1,1,1],['Chairs',1,2,0],['Signs',1,0,0],['Tables',1,1,0],['Speakers',2,2,1],['Lights',2,0,0],['Mic',2,1,0],['Playlist',2,2,0]];
  const HV=['Ana','Ben','Chloe'],HA=['Food menu','Venue setup','Light/Sound'];
  let s='';
  const pos=v=>{const cnt=[0,0,0];return J.map(j=>{const col=v?j[1]:j[2],row=cnt[col]++;return 'translate('+(50+col*100)+'px,'+(30+row*33)+'px)';});},P0=pos(0);
  J.forEach((j,i)=>{const c=j[1]+1;s+='<g class="mv" id="fj'+i+'" style="transform:'+P0[i]+'"><rect x="-42" y="0" width="84" height="26" rx="8" fill="var(--h'+c+'-bg)" stroke="var(--h'+c+')" stroke-width="1.8"/>'+
    '<text x="'+(j[3]?-6:0)+'" y="17" text-anchor="middle" font-size="12" font-weight="600" fill="var(--ink)">'+j[0]+'</text>'+(j[3]?'<text x="32" y="17" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ok)">✓</text>':'')+'</g>';});
  [0,1,2].forEach(k=>{s+='<text class="fh" data-k="'+k+'" x="'+(50+k*100)+'" y="18" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)"></text>'+
    '<text class="fr" data-k="'+k+'" x="'+(50+k*100)+'" y="176" text-anchor="middle" font-size="12" font-weight="600"></text>';});
  s+='<text id="fq" x="150" y="204" text-anchor="middle" font-size="12.5" font-weight="700"></text>';
  L.$('#fv').innerHTML=s;
  let done=false;
  const show=v=>{const P=pos(v);
    J.forEach((j,i)=>{L.$('#fj'+i).style.transform=P[i];});
    L.$$('#fv .fh').forEach(t=>t.textContent=(v?HA:HV)[+t.dataset.k]);
    L.$$('#fv .fr').forEach(t=>{const k=+t.dataset.k,mine=J.filter(j=>(v?j[1]:j[2])===k),d=mine.filter(j=>j[3]).length;
      t.textContent=v&&d===mine.length?'Done ✓':d+' of '+mine.length+' done';t.setAttribute('fill',v&&d===mine.length?'var(--ok)':'var(--muted)');});
    const q=L.$('#fq');q.textContent=v?'Food is ready. Venue and sound aren’t.':'Everyone’s busy. Which part is ready?';q.setAttribute('fill',v?'var(--ok)':'var(--no)');
    L.$('#fc').innerHTML=v?'<b>By area:</b> each list is a part of the event that can be finished on its own. One glance shows what’s done.':'<b>By volunteer:</b> colours show which area each job belongs to. They’re scattered, so nobody can tell which part of the event is ready. Tap <b>By area</b>.';
    L.$$('#fe button').forEach(b=>{const on=+b.dataset.v===v;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);});
    if(v&&!done){done=true;L.done();}};
  L.$$('#fe button').forEach(b=>b.onclick=()=>show(+b.dataset.v));
  show(0);}},
{part:0,src:'Chapter 12 · Organize by structure, not by person · The scope map',run(L){
  const R=[['Join the waitlist',1,4,3],['Spot opens',2,5,1],['Notify members',3,3,0],['Studio settings',4,3,1]];
  let s='<rect x="3" y="26" width="294" height="146" rx="16" fill="var(--soft)" stroke="var(--pri)" stroke-width="2.5"/>'+
    '<text x="150" y="17" text-anchor="middle" font-size="13" font-weight="700" fill="var(--pri)">Project: waitlist for full classes · six weeks</text>';
  R.forEach((r,k)=>{const x=12+(k%2)*142,y=36+Math.floor(k/2)*66,c=r[1];
    s+='<rect x="'+x+'" y="'+y+'" width="134" height="58" rx="12" fill="var(--h'+c+'-bg)" stroke="var(--h'+c+')" stroke-width="2"/>'+
       '<text x="'+(x+9)+'" y="'+(y+18)+'" font-size="12.5" font-weight="700" fill="var(--h'+c+')">'+r[0]+'</text>';
    for(let i=0;i<r[2];i++)s+='<circle cx="'+(x+16+i*20)+'" cy="'+(y+39)+'" r="6.5" fill="'+(i<r[3]?'var(--h'+c+')':'var(--card)')+'" stroke="var(--h'+c+')" stroke-width="2"/>';});
  s+='<path d="M60 186 L60 160" stroke="var(--ink)" stroke-width="1.5" marker-end="url(#ar10)"/><path d="M210 186 L210 152" stroke="var(--ink)" stroke-width="1.5" marker-end="url(#ar10)"/>'+
    '<defs><marker id="ar10" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/></marker></defs>'+
    '<text x="60" y="201" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">a scope</text><text x="60" y="215" text-anchor="middle" font-size="11.5" fill="var(--muted)">a few days or less</text>'+
    '<text x="210" y="201" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">a task (one dot)</text><text x="210" y="215" text-anchor="middle" font-size="11.5" fill="var(--muted)">one concrete step</text>';
  L.h(L.kick('learn','Scopes')+'<h1 class="q">The project’s scope, split into scopes</h1>'+
   '<div class="vz"><svg viewBox="0 0 300 220" role="img" aria-label="The waitlist project as one big area, divided into four scopes, each holding a few task dots">'+s+'</svg></div>'+
   '<p class="vz-cap">'+L.g('scope','Scopes')+' sit between the whole bet and its tiny tasks. Each is a slice of design and code that can be finished on its own. The '+L.g('scope-map','scope map')+' is a mental picture: in practice, one to-do list per scope.</p>');

{part:1,src:'Chapter 12 · Case study: Message drafts',
 solve:async L=>{const nx=()=>{const b=L.$('#dn');if(b&&!b.disabled)b.click();};for(let k=0;k<4;k++)nx();smPick(L.$('#dm .sm'),['f1','g1','h1']);for(let k=0;k<4;k++)nx();},
 run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">Message drafts: watch the scopes appear one by one</h1>'+
   '<div class="sm-stage"><b class="n" id="dh"></b><p id="dt"></p><div id="dfb"></div></div><div class="sm-nav"><span id="dsn"></span><button class="btn pri" id="dn">Next</button></div><div id="dm"></div>');
  const st={terrs:[],vis:new Set(DR.map(t=>t.id)),done:new Set(),nice:new Set(),person:false};
  let k=0,m;
  const S=[
   ['Near the end of week 1','A designer and a programmer are building drafts for messages. They’ve checked off some tasks, but there’s nothing to show yet.',()=>{st.terrs=[];st.done=new Set(['a1','a2','e1','g1']);}],
   ['Get one piece done','They pick one interaction they can wire up: creating a new draft. They call it <b>Start New</b> and move its tasks in. One design task is left.',()=>{st.terrs=[{name:'Start New',ids:['a1','a2','a3']}];}],
   ['First scope done','They finish that design task. Start New is complete: a visible piece of the product.',()=>{st.done.add('a3');}],
   ['Tease out more','Finding drafts becomes <b>Locate</b> (one task so far; build tasks will land there later). Deleting becomes <b>Trash</b>. The rest looks like saving and editing, so: <b>Save/Edit</b>.',()=>{st.terrs.push({name:'Locate',ids:['b1']},{name:'Trash',ids:['c1d']},{name:'Save/Edit',ids:['e1','e2','f1','f2','g1','g2','h1']});}],
   ['Your turn: dig into Save/Edit','Its readout says “hard to say”. Tap a task inside Save/Edit that isn’t really about saving or editing, to factor out its own scope.',null],
   ['The whole project in view','(In the book, Send was split off first, then Store and Reply.) Now no scope is big enough to hide a hard task. After a little wiring, Locate is done. Tasks get checked in Send and Store.',()=>{['b1','f1','g2','e2'].forEach(x=>st.done.add(x));}],
   ['Nearly there','Send and Store are finished. Just a couple of tasks remain, in Trash and Reply.',()=>{['f2','e1','e2','g1','g2','f1'].forEach(x=>st.done.add(x));}],
   ['Done','They finish Trash and Reply, and the project is done. Nobody planned these scopes on day 1: they were found by doing the work.',()=>{DR.forEach(t=>st.done.add(t.id));}]];
  const fb=L.$('#dfb'),nb=L.$('#dn');
  const show=()=>{const s=S[k];L.$('#dh').textContent=s[0];L.$('#dsn').textContent='Step '+(k+1)+' of '+S.length+(k===4?' · tap a task in Save/Edit':'');L.$('#dt').innerHTML=s[1];if(s[2])s[2]();m.draw();
    nb.disabled=k===4;nb.style.opacity=k===4?.45:1;nb.innerHTML=k===S.length-1?'Finish':'Next';};
  m=smMap(L.$('#dm'),{tasks:DR,st,ng:DR_NG,hi:t=>k===4&&t.g!=='save'&&st.terrs.some(z=>z.name==='Save/Edit'&&z.ids.includes(t.id)),
    legend:'<b>D</b> designer · <b>P</b> programmer · ✓ checked off. Task names are illustrative; the book shows the real lists in pictures.',
    onTap:id=>{if(k!==4)return;const z=st.terrs.find(x=>x.name==='Save/Edit');if(!z||!z.ids.includes(id))return;const g=DR.find(t=>t.id===id).g;fb.innerHTML='';
      if(g==='save'){L.fb(fb,'That one really is about saving or editing, so it stays.','no');return;}
      const ids=z.ids.filter(x=>DR.find(t=>t.id===x).g===g);z.ids=z.ids.filter(x=>!ids.includes(x));st.terrs.push({name:DR_GN[g],ids});m.draw();
      const left=new Set(z.ids.map(x=>DR.find(t=>t.id===x).g)).size;
      if(left===1){L.fb(fb,'Save/Edit was really several scopes. Every readout is clear now.','ok');nb.disabled=false;nb.style.opacity=1;}
      else L.fb(fb,'<b>'+DR_GN[g]+'</b> is its own scope now. Save/Edit still mixes unrelated work: keep going.','info');}});
  nb.onclick=()=>{if(nb.disabled)return;if(k===S.length-1){nb.remove();L.$('#dsn').textContent='All 8 steps seen';L.sheet('info','The takeaway','The team didn’t plan these scopes on day 1. They found them by doing the work, and redrew them when a scope turned out to hold unrelated tasks.');L.done();return;}k++;fb.innerHTML='';show();};
  show();}},
{part:1,src:'Chapter 12 · Discovering scopes',
 solve:async L=>{for(let k=0;k<2;k++){const b=L.$('#dsb');if(b)b.click();}},
 run(L){
  L.h(L.kick('learn','Discovering scopes')+'<h1 class="q">Scopes are found by doing the work, not drawn up front</h1>'+
   '<div class="vz"><svg id="dsv" viewBox="0 0 300 172" role="img" aria-label="Twelve task dots: first scattered, then pulled together by real work, then circled into four scopes"></svg></div>'+
   '<p class="vz-cap" id="dsc" aria-live="polite"></p><div class="vz-row"><button class="btn pri" id="dsb">'+L.ic('play')+'Next</button></div>'+
   '<p class="vz-cap" style="color:var(--muted);font-size:14px">You can’t draw scopes on day 1. They come from how the parts depend on each other, and that decides when a piece can be called done. Real work reveals it.</p>');
  const SC=[[30,30],[250,108],[140,150],[200,25],[92,96],[272,40],[38,144],[160,70],[232,152],[110,28],[188,110],[58,72]];
  const CC=[[70,58],[222,58],[70,136],[222,136]],OF=[[-30,0],[0,10],[30,-2]];
  const NM=['Join the waitlist','Spot opens','Notify members','Studio settings'];
  const cp=i=>{const g=i%4,o=OF[Math.floor(i/4)];return [CC[g][0]+o[0],CC[g][1]+o[1]];};
  let s='';
  CC.forEach((c,g)=>{s+='<g class="fade" data-st="2" style="opacity:0"><rect x="'+(c[0]-64)+'" y="'+(c[1]-36)+'" width="128" height="62" rx="14" fill="var(--h'+(g+1)+'-bg)" stroke="var(--h'+(g+1)+')" stroke-width="2"/>'+
    '<text x="'+(c[0]-56)+'" y="'+(c[1]-20)+'" font-size="12" font-weight="700" fill="var(--h'+(g+1)+')">'+NM[g]+'</text></g>';
    const p=[0,1,2].map(r=>cp(g+r*4));s+='<path class="fade" data-st="1" style="opacity:0" d="M'+p.map(q=>q.join(' ')).join(' L')+'" fill="none" stroke="var(--h'+(g+1)+')" stroke-width="2" stroke-dasharray="4 3"/>';});
  SC.forEach((q,i)=>{s+='<g class="mv" id="dsd'+i+'" style="transform:translate('+q[0]+'px,'+q[1]+'px)"><circle r="7" style="fill:var(--card);stroke:var(--muted);stroke-width:2;transition:stroke .5s"/></g>';});
  L.$('#dsv').innerHTML=s;
  const T=['<b>Days 1–5.</b> Kenji and Bea capture tasks as they find them. Grouping them now would be a guess.',
    '<b>Real work.</b> Building things shows which tasks depend on each other, and which don’t.',
    '<b>End of week 1, start of week 2.</b> The natural dividing lines show, and the first real scopes appear. Expect some redrawing and renaming at first.'];
  let k=0;
  const show=()=>{L.$('#dsc').innerHTML=T[k];
    L.$$('#dsv .fade').forEach(e=>e.style.opacity=k>=+e.dataset.st?1:0);
    SC.forEach((q,i)=>{const p=k>=1?cp(i):q,c=L.$('#dsd'+i);c.style.transform='translate('+p[0]+'px,'+p[1]+'px)';c.firstChild.style.stroke=k>=1?'var(--h'+(i%4+1)+')':'var(--muted)';});};
  const nb=L.$('#dsb');
  nb.onclick=()=>{k++;show();if(k>=2){nb.style.display='none';L.done();}};
  show();}},
{part:1,src:'Chapter 12 · The scope map · Discovering scopes',pts:1,run(L){

  let s='<text x="8" y="14" font-size="12.5" font-weight="700" fill="var(--ink)">Status by task</text>';
  for(let i=0;i<58;i++){const x=10+(i%20)*14,y=24+Math.floor(i/20)*14;s+='<rect x="'+x+'" y="'+y+'" width="11" height="11" rx="2.5" fill="'+(i<31?'var(--muted)':'var(--card)')+'" stroke="'+(i<31?'var(--muted)':'var(--line2)')+'" stroke-width="1.2"/>';}
  s+='<text x="150" y="86" text-anchor="middle" font-size="12" font-weight="600" fill="var(--no)">“31 of 58 closed.” Which parts work?</text>'+
    '<line x1="8" x2="292" y1="100" y2="100" stroke="var(--line)" stroke-width="1.5"/>'+
    '<text x="8" y="120" font-size="12.5" font-weight="700" fill="var(--ink)">Status by scope</text>';
  [['✓','Join the waitlist','ok'],['◐','Spot opens','h4'],['○','Notify members','line2'],['○','Studio settings','line2']].forEach((p,k)=>{const x=6+(k%2)*148,y=128+Math.floor(k/2)*42;
    s+='<rect x="'+x+'" y="'+y+'" width="140" height="34" rx="17" fill="'+(p[2]==='ok'?'var(--ok-bg)':p[2]==='h4'?'var(--h4-bg)':'var(--card)')+'" stroke="var(--'+p[2]+')" stroke-width="2"/>'+
      '<text x="'+(x+14)+'" y="'+(y+22)+'" font-size="13" font-weight="700" fill="'+(p[2]==='line2'?'var(--muted)':'var(--'+p[2]+')')+'">'+p[0]+'</text><text x="'+(x+30)+'" y="'+(y+22)+'" font-size="12.5" font-weight="600" fill="var(--ink)">'+p[1]+'</text>';});
  s+='<text x="150" y="228" text-anchor="middle" font-size="12" font-weight="600" fill="var(--ok)">“Join is done. Spot opens is next.”</text>';
  L.h(L.kick('learn','The language of the project')+'<h1 class="q">Scopes become the words the team uses</h1>'+
   '<div class="vz"><svg viewBox="0 0 300 236" role="img" aria-label="Top, illustrative numbers: 58 small task squares, 31 filled, with no way to tell which parts work. Bottom: four named scopes, one done, one in progress, two not started.">'+s+'</svg></div>'+
   '<p class="vz-cap">Scope names show which parts already work, without arguing task by task (numbers are illustrative). The book’s Clients in Projects team even planned in scope names: “Bucket Access”, then “Invite Clients”.</p>'+
   '<p class="small">A later lesson puts these scopes on a '+L.g('hill-chart','hill chart')+'.</p>');
  L.done();}},

/* ---------- PART 3: RIGHT OR WRONG ---------- */
{part:2,src:'Chapter 12 · How to know if the scopes are right',run(L){
  const pin=(x,y,n,ok)=>'<circle cx="'+x+'" cy="'+y+'" r="9" fill="var(--'+(ok?'ok':'no')+'-bg)" stroke="var(--'+(ok?'ok':'no')+')" stroke-width="1.5"/><text x="'+x+'" y="'+(y+4)+'" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--'+(ok?'ok':'no')+')">'+n+'</text>';
  const reg=(x,y,w,h,c,bad,name)=>'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="10" fill="'+(bad?'var(--soft)':'var(--'+c+'-bg)')+'" stroke="var(--'+(bad?'no':c)+')" stroke-width="2"'+(bad?' stroke-dasharray="5 4"':'')+'/><text x="'+(x+7)+'" y="'+(y+16)+'" font-size="11.5" font-weight="700" fill="'+(bad?'var(--ink)':'var(--'+c+')')+'">'+name+'</text>';
  const dt=(x,y,c,full,dash)=>'<circle cx="'+x+'" cy="'+y+'" r="5.5" fill="'+(full?'var(--'+c+')':'var(--card)')+'" stroke="var(--'+c+')" stroke-width="1.8"'+(dash?' stroke-dasharray="2 2"':'')+'/>';
  let s='<rect x="2" y="2" width="145" height="184" rx="12" fill="var(--card)" stroke="var(--ok)" stroke-width="2"/><text x="12" y="19" font-size="12.5" font-weight="700" fill="var(--ok)">Right</text>'+pin(134,14,1,1)+
    reg(10,28,52,50,'h1',0,'Join')+dt(21,62,'h1',1)+dt(35,62,'h1',1)+dt(49,62,'h1',1)+
    reg(68,28,72,50,'h2',0,'Spot opens')+dt(80,62,'h2',1)+dt(96,62,'h2')+dt(112,62,'h2')+
    reg(10,84,130,42,'h3',0,'Notify members')+dt(20,114,'h3')+dt(36,114,'h3')+
    '<rect x="28" y="138" width="86" height="24" rx="12" fill="var(--soft)" stroke="var(--line2)" stroke-width="1.5"/><text x="71" y="154" text-anchor="middle" font-size="11.5" fill="var(--ink)">“Join is done.”</text>'+pin(16,150,2,1)+
    dt(124,170,'h3',0,1)+'<path d="M124 162 L124 134" stroke="var(--h3)" stroke-width="1.8" marker-end="url(#ar10b)"/>'+pin(139,152,3,1)+
    '<defs><marker id="ar10b" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="var(--h3)"/></marker></defs>';
  s+='<rect x="153" y="2" width="145" height="184" rx="12" fill="var(--card)" stroke="var(--no)" stroke-width="2"/><text x="163" y="19" font-size="12.5" font-weight="700" fill="var(--no)">Redraw</text>'+
    reg(175,28,116,44,'h2',1,'Spot opens')+dt(186,57,'h1',1)+dt(202,57,'h2')+dt(218,57,'h3')+'<text x="238" y="62" font-size="15" font-weight="700" fill="var(--no)" text-anchor="middle">?</text>'+pin(164,50,1,0)+
    reg(175,80,116,34,'h1',1,'Front-end')+dt(258,92,'h2')+dt(274,92,'h4')+pin(164,97,2,0)+
    reg(175,122,116,60,'h4',1,'Studio settings');
  for(let i=0;i<18;i++)s+=dt(186+(i%7)*15,148+Math.floor(i/7)*13,'h4',i<4);
  s+=pin(164,152,3,0);
  L.h(L.kick('learn','Are the scopes right?')+'<h1 class="q">Good scopes show the project’s anatomy</h1>'+
   '<div class="vz"><svg viewBox="0 0 300 188" role="img" aria-label="Two scope maps. Left, healthy: whole project in view, talk in scope names, a new task drops into its scope. Right, needs redrawing: a scope with unrelated tasks, a scope called Front-end, a scope too big.">'+s+'</svg></div>'+
   '<div class="vz-key"><div class="kg hd">Signs they’re right</div><div class="kr hd">Signs to redraw</div>'+
   '<div class="kg"><b>1</b>You see the whole project</div><div class="kr"><b>1</b>“How done?” is hard to say</div>'+
   '<div class="kg"><b>2</b>Talk flows in scope names</div><div class="kr"><b>2</b>Name fits any project: a '+L.g('junk-drawer','junk drawer')+'</div>'+
   '<div class="kg"><b>3</b>New tasks have an obvious home</div><div class="kr"><b>3</b>Too big to finish soon</div></div>'+
   '<p class="vz-cap">Like knowing whether a pain is in your arm or your leg: you know the parts by name, so you can say where it hurts.</p>');
  L.done();}},
{part:2,src:'Chapter 12 · How to know if the scopes are right · Chowder',
 solve:async L=>{L.$$('#ep .chip').forEach(b=>b.click());},
 run(L){
  L.h(L.kick('pr','Edge-case lab')+'<h1 class="q">Four ways a scope map goes wrong. Load each one, read the checks, then show the fix.</h1><div class="sm-pre" id="ep"></div><div id="ew"></div><div id="em"></div>');
  const st={terrs:[],nice:new Set(),person:false};smAt(st,8,WL);
  const canon=(day,extra)=>{smAt(st,day,WLALL);st.vis=new Set(WL.filter(t=>t.d<=day).map(t=>t.id).concat(extra||[]));
    const ts=WLALL.filter(t=>st.vis.has(t.id));st.terrs=smCanon(ts,['join','spot','notify','settings','order','chow']).filter(z=>z.ids.length);};
  canon(8);
  const P=[
   ['Final list on day 2',()=>{smAt(st,2,WL);st.terrs=[];},()=>canon(8),
    'Noor wants the final scope list on day 2. Kenji and Bea have found four tasks; most of the ground is still fog. Any scope list now would be a guess, not the project’s real anatomy.',
    'Walk the territory first. By day 8, real work has shown what connects, and the scopes draw themselves. Expect them to show up around the turn from week one to week two.'],
   ['Front-end, Back-end, Bugs',()=>{smAt(st,10,WLALL);st.vis=new Set(WL.map(t=>t.id).concat(['x1','x2','x3']));
      const core=WL.filter(t=>t.g!=='join'&&t.g!=='chow');
      st.terrs=[{name:'Join the waitlist',ids:WL.filter(t=>t.g==='join').map(t=>t.id)},{name:'Front-end',ids:core.filter(t=>t.o==='K').map(t=>t.id)},{name:'Back-end',ids:core.filter(t=>t.o==='B').map(t=>t.id)},{name:'Bugs',ids:['x1','x2','x3']},{name:'Chowder',ids:['c1','c2']}];},
    ()=>canon(10,['x1','x2','x3']),
    '“Front-end”, “Back-end” and “Bugs” could be scopes in any project. They aren’t integrated, so none of them can be marked done on its own, and each mixes unrelated work.',
    'Redraw by structure, and file each bug under the scope it belongs to. Now you can tell whether Notify members is done or needs a fix first.'],
   ['Chowder hits nine',()=>{canon(10);st.vis=new Set(WL.map(t=>t.id).concat(['o1','o2','o3','o4','o5','c3','c4']));
      st.terrs=smCanon(WL,['join','spot','notify','settings']);st.terrs.push({name:'Chowder',ids:['c1','c2','c3','c4','o1','o2','o3','o4','o5']});},
    ()=>{canon(10,['o1','o2','o3','o4','o5','c3','c4']);},
    'Week 3. The '+L.g('chowder','Chowder')+' list holds nine items, and five are all about the order of the waiting line. Past three to five items, something is fishy.',
    'Pull the five related tasks out into a scope of their own (here called Waiting order). Chowder shrinks back to a few true odds and ends.'],
   ['One giant scope',()=>{smAt(st,10,WL);st.terrs=[{name:'The waitlist',ids:WL.map(t=>t.id)}];},()=>canon(10),
    'Everything sits in one scope. It turns into one huge to-do list of its own: too big to finish soon, and impossible to say how done it is.',
    'Break it into scopes you can finish in a few days. Each one finished is a small win, and each problem has its own edges.']];
  const seen=new Set();let cur=-1,fixed=false;
  const m=smMap(L.$('#em'),{tasks:WLALL,st,compact:true,fog:()=>st.day<=5?'Not walked yet: most of the project is still unknown.':'',cap:()=>'<b>'+(cur<0?'A healthy map on day 8.</b> Pick a case above to break it.<b>':(fixed?'The fix: ':'The problem: ')+P[cur][0])+'</b>'+(cur>=0?' · day '+st.day:''),
    legend:'<b>K</b> Kenji · <b>B</b> Bea · ✓ checked off. Tasks are illustrative.'});
  const why=()=>{const p=P[cur];L.$('#ew').innerHTML='<div class="sm-why'+(fixed?' fix':'')+'"><b class="h">'+(fixed?'The fix':'What breaks')+'</b>'+(fixed?p[4]:p[3])+'</div><button class="btn" id="ef" style="margin:8px 0 2px">'+(fixed?'Show the problem again':'Show the fix')+'</button>';
    L.$('#ef').onclick=()=>{fixed=!fixed;(fixed?P[cur][2]:P[cur][1])();m.draw();why();};};
  P.forEach((p,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=p[0];
    b.onclick=()=>{cur=j;fixed=false;p[1]();m.draw();why();L.$$('#ep .chip').forEach((x,q)=>x.classList.toggle('sel',q===j));seen.add(j);
      if(seen.size===P.length){L.sheet('info','All four seen','Each flag is one of the book’s signs: a name that fits any project, “done” you can’t read, a scope too big to finish soon, and a Chowder list past three to five items. Too early a map is just fog.');L.done();}};
    L.$('#ep').appendChild(b);});
  m.draw();}},
{part:2,src:'Chapter 12 · How to know if the scopes are right',pts:5,run(L){
  L.h(L.kick('pr','Lob it in a bucket')+'<h1 class="q">New tasks keep coming up. Which waitlist scope does each belong in?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Join the waitlist','Spot opens','Notify members'],[
   ['The “Join waitlist” button overlaps the class time on small phones',0,'It’s about joining, so it goes with joining.'],
   ['Two members tap at once; the second must see “Spot taken”',1,'Who gets the opened spot is part of Spot opens.'],
   ['The spot-opened email shows the wrong class time',2,'A bug in the message belongs in Notify members.'],
   ['A spot freed by a late cancel must follow the studio’s usual rule',1,'This decides how a spot opens up, so it goes there.'],
   ['The in-app message needs a link straight to the class',2,'Part of telling members, so Notify members.']],
   'When scopes are right, every new task has an obvious bucket. Bugs too.');}},

/* ---------- PART 4: KINDS OF WORK ---------- */
{part:3,src:'Chapter 12 · Layer cakes · Icebergs',
 solve:async L=>{const el=L.$('#cx .cx');cxSlide(el,'ui',2);cxSlide(el,'be',9);cxSlide(el,'ui',9);cxSlide(el,'be',3);cxSlide(el,'ui',5);cxSlide(el,'be',5);},
 run(L){
  L.h(L.kick('ex','Cut a scope open')+'<h1 class="q">Every scope has work on screen and work hidden below. Move the sliders and find all three shapes.</h1><div id="cx"></div><div class="cx-found" id="cf"></div>');
  const found=new Set();let fin=false;
  const mark=()=>{L.$('#cf').innerHTML=['cake','ice','up'].map(c=>'<span class="'+(found.has(c)?'on':'')+'">'+(found.has(c)?'✓ ':'')+CX_NAME[c]+'</span>').join('');};
  cxMake(L.$('#cx'),{ui:4,be:4,on:a=>{found.add(a.cls());mark();
    if(found.size===3&&!fin){fin=true;L.sheet('info','All three shapes','A '+L.g('layer-cake','layer cake')+' grows evenly, so one scope holds design and code. An '+L.g('iceberg','iceberg')+' hides heavy logic under a small UI; upside down, a big UI sits on a simple back-end. Split an iceberg into pieces you finish and connect one at a time, so nothing waits for a last-minute hope that it all fits. But first, question whether the complexity is needed.');L.done();}}});
  found.add('cake');mark();}},
{part:3,src:'Chapter 12 · Icebergs',
 solve:async L=>{L.$$('#lp .chip').forEach(b=>b.click());},
 run(L){
  L.h(L.kick('pr','Limits of the shapes')+'<h1 class="q">The shape tells you how to slice a scope, not everything. Load each case.</h1><div class="sm-pre" id="lp"></div><div id="lx"></div><div id="lw"></div>');
  const a=cxMake(L.$('#lx'),{ui:4,be:4});
  const P=[['The book’s calendar',9,3,false,'The data model for a calendar is simple. Drawing an event that spans several days and wraps across the grid takes a lot of time and problem-solving. An upside-down iceberg, and still the first question is: do we need that fancy UI?'],
   ['A huge layer cake',9,9,false,'Even layers tell you to keep design and code together. They don’t tell you the size. A scope this big can’t be finished soon, so it needs breaking up like any other.'],
   ['Form tied to its logic',2,9,true,'The book adds a condition: factor the UI out only if it isn’t tied to the back-end complexity. Here each screen state depends on the rules, so look for back-end concerns to split out and question the rules first.']];
  const seen=new Set();
  P.forEach((p,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=p[0];
    b.onclick=()=>{a.set(p[1],p[2],p[3]);L.$$('#lp .chip').forEach((x,q)=>x.classList.toggle('sel',q===j));L.$('#lw').innerHTML='<div class="sm-why"><b class="h">Why it matters</b>'+p[4]+'</div>';seen.add(j);
      if(seen.size===P.length){L.sheet('info','Where the shapes stop helping','Shape decides how you slice a scope, not whether the work is needed or small enough. Always question an iceberg, and still check that every scope can be finished in a few days.');L.done();}};
    L.$('#lp').appendChild(b);});}},
{part:3,src:'Chapter 12 · Layer cakes · Icebergs',pts:3,
 solve:async L=>{const V=[[5,5],[2,9],[9,2]];for(let j=0;j<3;j++){L.$$('#ct .chip')[j].click();const el=L.$('#cc .cx');cxSlide(el,'ui',V[j][0]);cxSlide(el,'be',V[j][1]);}L.$('#cg').click();},
 run(L){
  L.h(L.kick('pr','Challenge')+'<h1 class="q">Set the sliders for three pieces of the waitlist so each shows its true shape.</h1>'+
   '<div class="cx-tabs" id="ct"></div><p class="cx-desc" id="cd"></p><div id="cc"></div><p class="small" style="margin:4px 0 0">Slider numbers are illustrative: only the shape counts.</p><button class="btn pri" id="cg" style="margin-top:10px">'+L.ic('check')+'Check all three</button>');
  const S=[['Studio settings','A switch to turn the waitlist on for each class, and a plain list of who’s waiting. Fields saved and shown back.','cake'],
   ['Spot opens','Almost nothing new on screen except “Spot taken”. Underneath: who gets offered the spot, first tap wins, and the late-cancel rule.','ice'],
   ['Kenji’s waiting board','Kenji sketches a colour-coded, animated board of everyone waiting across the week. Behind it: the same plain list of names.','up']];
  const V=S.map(()=>({ui:5,be:5,set:false}));let cur=0,graded=false;
  const a=cxMake(L.$('#cc'),{ui:5,be:5,on:x=>{V[cur].ui=x.v.ui;V[cur].be=x.v.be;V[cur].set=true;tabs();}});
  const tabs=()=>{L.$('#ct').innerHTML='';S.forEach((s,j)=>{const b=document.createElement('button');b.className='chip'+(j===cur?' sel':'');
      b.innerHTML=s[0]+' <span class="st">'+(V[j].set?CX_NAME[cxCls(V[j].ui,V[j].be)]:'not set')+'</span>';b.onclick=()=>{cur=j;a.set(V[j].ui,V[j].be);L.$('#cd').innerHTML=S[j][1];tabs();};L.$('#ct').appendChild(b);});};
  L.$('#cd').innerHTML=S[0][1];tabs();
  L.$('#cg').onclick=()=>{if(V.some(v=>!v.set)){L.err('Set the sliders for all three first');return;}
    const res=S.map((s,j)=>cxCls(V[j].ui,V[j].be)===s[2]);
    if(!graded){graded=true;res.forEach(ok=>L.award(ok));}
    const n=res.filter(Boolean).length;
    L.sheet(n===3?'ok':'no',n+' of 3 shapes right',S.map((s,j)=>(res[j]?'✓ ':'✗ ')+'<b>'+s[0]+'</b>: '+CX_NAME[s[2]]+'. '+(j===0?'Keep design and code in one scope.':j===1?'Split the heavy rules into their own scopes, and question whether all of them are needed.':'Ask whether the board is needed at all. It isn’t in the pitch.')).join('<br>'));
    L.done();};}},
{part:3,src:'Chapter 12 · Mark nice-to-haves with ~',run(L){
  const RW=[['Send the spot-opened email',0],['Add the studio’s logo to the email',1],['Show the in-app message',0],['Let studios edit the message wording',1]];
  let s='<rect x="3" y="3" width="294" height="184" rx="14" fill="var(--soft)" stroke="var(--line)" stroke-width="1.5"/>'+
    '<text x="16" y="26" font-size="13.5" font-weight="700" fill="var(--ink)">Notify members</text><text x="284" y="26" text-anchor="end" font-size="11.5" fill="var(--muted)">one scope’s to-do list</text>';
  RW.forEach((r,i)=>{const y=40+i*36;
    s+='<rect x="12" y="'+y+'" width="276" height="29" rx="8" fill="'+(r[1]?'var(--h3-bg)':'var(--card)')+'" stroke="'+(r[1]?'var(--h3)':'var(--line2)')+'" stroke-width="1.6"'+(r[1]?' stroke-dasharray="5 3"':'')+'/>'+
      '<rect x="21" y="'+(y+8)+'" width="13" height="13" rx="3" fill="var(--card)" stroke="var(--muted)" stroke-width="1.5"/>'+
      (r[1]?'<text x="42" y="'+(y+20)+'" font-size="15" font-weight="700" fill="var(--h3)">~</text>':'')+
      '<text x="'+(r[1]?56:42)+'" y="'+(y+19)+'" font-size="12" font-weight="'+(r[1]?400:600)+'" fill="'+(r[1]?'var(--muted)':'var(--ink)')+'">'+r[0]+'</text>';});
  L.h(L.kick('learn','Mark nice-to-haves with ~')+'<h1 class="q">A small mark that makes cutting easy</h1>'+
   '<div class="vz"><svg viewBox="0 0 300 190" role="img" aria-label="The Notify members to-do list: two plain must-have tasks, and two tasks marked with a ~ as nice-to-haves">'+s+'</svg></div>'+
   '<p class="vz-cap">Deeper in, you find clean-ups, edge cases and improvements. Record them on the scope with a <b>~</b> in front, so everyone sees must-haves apart from '+L.g('nice-to-have','nice-to-haves')+'. A whole scope can get one. With a fixed deadline, the ~ shows what to cut first.</p>'+
   '<p class="small">The ~ deletes nothing. A later lesson uses it when deciding what to cut.</p>');
  L.done();}},
{part:3,src:'Chapter 12 · Mark nice-to-haves with ~',pts:6,run(L){
  L.h(L.kick('pr','Must-have or ~?')+'<h1 class="q">Which of these waitlist tasks should get a ~?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Must-have','~ Nice-to-have'],[
   ['First tap wins; the other member sees “Spot taken”',0,'A core patch from the pitch. Without it, two people could claim one spot.'],
   ['Clean up old booking code Bea noticed along the way',1,'Cleaning up existing code is a classic nice-to-have.'],
   ['Send the spot-opened message by email and in the app',0,'The whole point: fill spots without the studio texting anyone.'],
   ['Handle Ironleaf members on two overlapping waitlists',1,'An edge case worth noting, but the waitlist works without it.'],
   ['A won spot follows the studio’s usual late-cancel rule',0,'Another patch from the pitch: it keeps the studio’s rules intact.'],
   ['A smoother animation on the “Spot taken” screen',1,'An improvement to something that already works.']],
   'Must-haves solve Marisol’s problem as pitched. Everything else gets a ~, so it’s easy to cut.');}},
{part:3,src:'Chapter 12 · How to know if the scopes are right · Chowder · Mark nice-to-haves with ~',pts:2,
 solve:async L=>{const r=L.$('#cm .sm');
   for(const g of ['join','spot','notify','settings','chow']){smPick(r,WL.filter(t=>t.g===g).map(t=>t.id));smBtn(r,'new');smName(r,SM_GN[g]);}
   smPick(r,['j5','n3','n4']);smBtn(r,'tag');L.$('#cg2').click();},
 run(L){
  L.h(L.kick('pr','Challenge')+'<h1 class="q">Kenji split the waitlist by role. Redraw the map so every check passes, then tag the three nice-to-haves with ~.</h1>'+
   '<p class="small" style="margin:0">Select tasks, then <b>New scope</b> or <b>Move here</b>. Use <b>~ Tag</b> on tasks the waitlist works without. Chowder may hold a couple of odds and ends.</p><div id="cm"></div><button class="btn pri" id="cg2" style="margin-top:10px">'+L.ic('check')+'Check my map</button><div id="cfb"></div>');
  const st={terrs:[{name:'Front-end',ids:WL.filter(t=>t.o==='K').map(t=>t.id)},{name:'Back-end',ids:WL.filter(t=>t.o==='B').map(t=>t.id)}],nice:new Set(),person:false};smAt(st,10,WL);
  const m=smMap(L.$('#cm'),{tasks:WL,st,edit:true,tag:true,names:SM_NAMES,cap:()=>'<b>Day 10.</b> All 18 tasks found so far.'});
  let graded=false;
  L.$('#cg2').onclick=()=>{
    const loose=WL.filter(t=>!st.terrs.some(z=>z.ids.includes(t.id))).length;
    if(loose||st.terrs.some(z=>!z.name)){L.err(loose?'Put every task in a scope first':'Name every scope first');return;}
    const cs=st.terrs.map(z=>m.check(z)),bad=cs.filter(c=>!c.ok);
    const mapOk=!bad.length;
    const tagOk=WL.filter(t=>t.n).every(t=>st.nice.has(t.id))&&[...st.nice].every(id=>m.TT[id].n||m.TT[id].g==='chow');
    if(!graded){graded=true;L.award(mapOk);L.award(tagOk);}
    const lines=[];
    lines.push(mapOk?'✓ <b>Map:</b> every scope is named for the project, holds related work, and can be finished on its own. Chowder stays small.':
      '✗ <b>Map:</b> '+bad.map(c=>'<b>'+c.name+'</b> ('+(c.mixed?'unrelated tasks inside':c.flags[0].toLowerCase())+')').join(', ')+'. Fix the flagged scopes and check again.');
    lines.push(tagOk?'✓ <b>~ tags:</b> place in line, studio logo, and editable wording. The waitlist works without them.':
      '✗ <b>~ tags:</b> the three nice-to-haves are the member’s place in line, the studio logo in the email, and studios editing the message wording. Everything else is in the pitch.');
    L.sheet(mapOk&&tagOk?'ok':'no',mapOk&&tagOk?'The map passes every check':'Not there yet',lines.join('<br>'));L.done();};}}
  ]
});
