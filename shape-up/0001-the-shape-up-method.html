<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Shape Up Method at a Glance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0001', title:'The Shape Up method at a glance', minutes:18, icon:'compass',
  goals:['Name the growing pains Shape Up is built to fix','Explain six-week cycles, shaping and responsible teams in plain words','Say which risk Shape Up targets and where it cuts it down'],
  parts:['Growing pains','Three big ideas','Targeting risk','The map'],
  read:'Read chapter 1 of the book for the full story of how Basecamp grew into this way of working.',
  glossary:{
    'vertical-slice':'Vertical slice: one small piece of a feature built all the way through, with its screen and its code working together, instead of all screens first and all code later.',
    estimate:'Estimate: a guess at how long some work will take. Shape Up asks a different question first: how long do we <i>want</i> to spend?',
    'raw-idea':'Raw idea: a request or idea as it first arrives, before anyone has narrowed the problem or set a time limit on it.'
  },
  cheatsheet:[
    '<b>Growing pains</b>: projects drag on, product people have no time to think, and features ship slower than they used to.',
    '<b>Six-week cycles</b>: long enough to build something real, short enough to feel the deadline. No counting hours, no daily meetings.',
    '<b>Shaping</b>: a small senior group outlines the solution before a team gets it. Concrete enough to act on, open enough to leave room.',
    '<b>Appetite, not estimate</b>: ask “how much time is this worth?” instead of “how long will it take?”',
    '<b>Responsible teams</b>: a small team of designers and programmers sets its own tasks and adjusts the scope.',
    'The risk Shape Up targets is <b>not shipping on time</b>. It is cut in shaping, in betting (the circuit breaker) and in building (integrate early).',
    'Three parts: <b>shaping</b>, <b>betting</b>, <b>building</b>.'
  ],
  steps:[
/* ---------- PART 1: GROWING PAINS ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Pinecone’s “studio reports” project has run for four months. Nobody can say when it will end. What is most likely missing?</h1>');
  L.mc(L.card,['More people working on it','A clear end point and time limit','A longer list of features'],1,
   'Projects with no fixed end tend to stretch. This course is about a way of working where every project has one.',
   'Adding people or features rarely brings an end closer. What the project lacks is a point where it has to be done. This course is about building that in.');}},
{part:0,src:'Chapter 1 · Growing pains',run(L){
  L.h(L.kick('learn','Meet Pinecone')+'<h1 class="q">A small company that just started to feel its size</h1>'+
   L.prose('<b>Pinecone</b> is a made-up app that small yoga, pilates and fitness studios use to publish their classes, sell memberships and let members book. About 15 people work there, all remote. Until recently, everyone did a bit of everything.')+
   L.prose('The book says that as software teams grow, the same three struggles show up:')+
   L.list([['cycle','Projects never end','Team members feel work goes on and on with no end in sight.'],
     ['clock','No time to think','Product managers can’t find time to think about where the product should go.'],
     ['flame','Shipping slows down','Founders wonder why features no longer get out the door like in the early days.']],1)+
   '<p class="small" style="margin-top:10px">Noor (CEO), Tomás (CTO), Ifeoma (head of product), Kenji (designer) and Bea (programmer) feel all three. They are trying Shape Up to fix them.</p>');
  L.done();}},
{part:0,src:'Chapter 1 · Introduction',run(L){
  L.h(L.kick('ex','Where the method came from')+'<h1 class="q">How Basecamp grew into Shape Up, step by step</h1>');
  L.beats(L.card,[
   ['2003','Three people build the first Basecamp. The programmer can only give it <b>ten hours a week</b>. To get anywhere, they cut the work hard to fit the time. That habit of “hammering” scope starts here.'],
   ['2009','A huge project: joining four products into one suite with one login and one bill. The author tries out early versions of the techniques in this book to manage it.'],
   ['2012','They use the same techniques to rebuild Basecamp from scratch. Again a lot of work, and again it goes smoothly.'],
   ['2015','The product team has grown four times over and works remotely. New hires can’t pick up the old instincts, so they need words and structure.'],
   ['The result','They switch to repeating <b>six-week cycles</b>, make pitching and betting formal, and coin the word <b>shaping</b>. The company has grown from four people to over fifty.']],
   'Shape Up grew out of real limits: little time, more people, and the need to explain the work to newcomers.');}},
{part:0,src:'Chapter 1 · Growing pains',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Ifeoma spends the whole week answering questions about open tickets and never gets to think about where Pinecone is headed. Which growing pain is this?</h1>');
  L.mc(L.card,['Shipping has slowed down','Projects never seem to end','No time to think about the product'],2,
   'Right. Product people buried in day-to-day questions have no time left for strategy.',
   'Look at what Ifeoma is missing: time to think about the product’s direction. That is the “no time to think” pain.');}},
{part:0,src:'Chapter 1 · Growing pains',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which growing pain?',['Projects never end','No time to think','Shipping slows down'],[
   ['Bea: “I’ve been on the booking rewrite since spring. I honestly don’t know when it’s finished.”',0,'Work with no end in sight is the first pain.'],
   ['Noor: “Two years ago we shipped something every week. Why does everything take months now?”',2,'That is the founder’s question about shipping speed.'],
   ['Ifeoma: “I meant to plan next quarter, but support questions ate my whole Friday.”',1,'The product lead has no room for strategy.'],
   ['Kenji: “The studio settings redesign keeps growing. Every week someone adds a new part.”',0,'A project that keeps growing never reaches its end.']]);}},

/* ---------- PART 2: THREE BIG IDEAS ---------- */
{part:1,src:'Chapter 1 · Six-week cycles',run(L){
  L.h(L.kick('learn','Idea 1 · Six-week cycles')+'<h1 class="q">Work happens in six-week blocks</h1>'+
   L.prose('Basecamp works in '+L.g('cycle','cycles')+' of six weeks. That is long enough to build something meaningful from start to finish, and short enough that everyone feels the deadline from day one. Most new features are built and released in a single cycle.')+
   L.lanes([['x','What they don’t do','Count hours. Question how each day is spent. Hold daily meetings. Rethink the roadmap every two weeks.',4],
            ['check','What they do','Ask: “If this ships after six weeks, will we be happy?” If yes, commit the six weeks and leave the team alone.',2]])+
   L.note('The focus moves up a level: from managing time to moving the product forward.','target'));
  L.done();}},
{part:1,src:'Chapter 1 · Shaping the work',run(L){
  L.h(L.kick('learn','Idea 2 · Shape the work first')+'<h1 class="q">Someone outlines the solution before a team gets it</h1>'+
   L.prose('A small senior group works alongside the teams. They define the key elements of a solution before anyone calls it ready. This is '+L.g('shaping','shaping')+'.')+
   L.prose('Shaped work sits at the right level: <b>concrete enough</b> that the team knows what to do, <b>open enough</b> that they can work out the interesting details themselves.')+
   L.lanes([['clock','The usual question','“How long will this take?” That is an '+L.g('estimate','estimate')+'.',3],
            ['target','The Shape Up question','“How much time do we <i>want</i> to spend? What is this idea worth?” That is the '+L.g('appetite','appetite')+'.',2]])+
   '<p class="small" style="margin-top:10px">Shaping means narrowing the problem and outlining a solution that fits the appetite.</p>');
  L.done();}},
{part:1,src:'Chapter 1 · Shaping the work',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Studio owners keep asking for a waitlist on full classes. Which question would Ifeoma ask first?</h1>');
  L.mc(L.card,['How much time is a waitlist worth to us?','How many weeks will a waitlist take to build?'],0,
   'That is an appetite question. You decide what the idea is worth, then shape a solution that fits.',
   'That is an estimate: it starts from a design and guesses the time. Shape Up flips it and asks what the idea is worth first.');}},
{part:1,src:'Chapter 1 · Making teams responsible',run(L){
  L.h(L.kick('learn','Idea 3 · Make teams responsible')+'<h1 class="q">The team owns the project, not a list of tickets</h1>'+
   L.prose('The whole project goes to a small team of designers and programmers, like Kenji and Bea. They:')+
   L.list([['list','Define their own tasks','Nobody hands them a pre-cut to-do list.'],
     ['scale','Adjust the scope','They decide what to trim so the work fits the time.'],
     ['layers','Build slices','They build '+L.g('vertical-slice','vertical slices')+' of the product, one at a time.']],2)+
   L.prose('The book contrasts this with methods where managers chop up the work and programmers act like ticket-takers.'));
  L.done();}},
{part:1,src:'Chapter 1 · Making teams responsible',pts:1,
 solve:async L=>{for(let i=0;i<4;i++)L.$('#spin').click();},
 run(L){
  const S=[['people','Teams work on their own','Kenji and Bea run the project themselves.'],['clock','Seniors manage less','Ifeoma doesn’t check on them every day.'],['pencil','Better-shaped projects','Ifeoma spends that time shaping the next project well.'],['target','Clearer boundaries','The next team knows what to build and what to skip, so it can work on its own.']];let n=0;
  L.h(L.kick('pr','See it happen')+'<h1 class="q">The three ideas feed each other. Press to follow the loop around.</h1><div class="ladder" id="vc"></div>'+
   '<button class="btn pri" id="spin">'+L.ic('cycle')+'Next link</button><div id="vq"></div>');
  const draw=()=>{L.$('#vc').innerHTML=S.slice(0,n).map((x,j)=>(j?'<div class="conn"></div>':'')+'<div class="rung'+(j===n-1?' cur':'')+'"><small>'+x[1]+'</small>'+x[2]+'</div>').join('');};
  L.$('#spin').onclick=function(){n++;draw();if(n>=S.length){this.remove();
    const q=L.$('#vq');q.innerHTML='<h2 class="sub">Now break it: Ifeoma has to check Bea’s work every day. What suffers next?</h2>';
    L.mc(q,['The next project gets shaped less well','Bea’s team works more on its own'],0,
     'Time spent managing comes out of time spent shaping. Rougher projects then need even more managing. The loop runs backwards.',
     'Daily checking means the team works <i>less</i> on its own, and Ifeoma has less time to shape the next project. The loop runs backwards.');}};
  draw();}},
{part:1,src:'Chapter 1 · Six-week cycles',pts:6,run(L){
  L.h(L.kick('pr','Shape Up or not?')+'<h1 class="q">Pinecone is trying out new habits. Sort each one.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Fits Shape Up','Doesn’t fit'],[
   ['A 15-minute stand-up every morning to check on progress',1,'The book says plainly: no daily meetings.'],
   ['Commit six weeks to the waitlist, then leave Kenji and Bea alone',0,'That is exactly the six-week commitment.'],
   ['Bea logs every hour so Noor can see where each day went',1,'Shape Up doesn’t count hours or question single days.'],
   ['Kenji and Bea write their own task list for the project',0,'Responsible teams define their own tasks.'],
   ['Tomás reshuffles the roadmap every second Monday',1,'The book says they don’t rethink the roadmap every two weeks.'],
   ['Ifeoma outlines the solution before the team starts',0,'That is shaping the work first.']],
   'Shape Up manages at a higher level: shape the work, commit six weeks, and trust the team with the details.');}},

/* ---------- PART 3: TARGETING RISK ---------- */
{part:2,src:'Chapter 1 · Targeting risk',run(L){
  L.h(L.kick('learn','The one risk it targets')+'<h1 class="q">Shape Up is built against one specific danger</h1>'+
   L.quote('the risk of not shipping on time','Ryan Singer, chapter 1')+
   L.prose('That means getting stuck, dragging last quarter’s work along, losing time to surprises, and not being free to do what you want next.')+
   L.note('The book is <b>not</b> about the risk of building the wrong thing; it points to other books for that. Its view: fix your ability to ship first, then improve how you find what to build. A great strategy is useless if you can’t act on it.','info'));
  L.done();}},
{part:2,src:'Chapter 1 · Targeting risk',run(L){
  L.h(L.kick('learn','Three places risk gets cut')+'<h1 class="q">Each stage removes a different kind of risk</h1>'+
   L.tiers([['pencil','In shaping','Open questions get solved before the work is given a time box. No project goes to a team with '+L.g('rabbit-hole','rabbit holes')+' or tangled dependencies still in it.','before the team starts'],
            ['scale','In planning','Every bet is capped at six weeks. A project that runs over gets no extension by default. This is the '+L.g('circuit-breaker','circuit breaker')+'.','when choosing work'],
            ['layers','In building','Design and code are joined early. The team builds one real piece end to end, then the next, starting with the most unknown parts.','during the cycle',true,'Watch it next']]));
  L.done();}},
{part:2,src:'Chapter 1 · Targeting risk',pts:1,
 solve:async L=>{L.$('#wk5').click();},
 run(L){
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Two ways to build a waitlist in six weeks. Jump to week 5 and compare.</h1>'+
   L.lanes([['box','Parts apart','Kenji designs every screen first. Bea writes all the code separately. They plan to join it all at the end.<div class="res" id="la"></div>',4],
            ['layers','One piece at a time','Kenji and Bea build “join the waitlist” fully working first, then the next piece.<div class="res" id="lb"></div>',2]])+
   '<button class="btn pri" id="wk5" style="margin-top:14px">'+L.ic('play')+'Jump to week 5</button><div id="wq"></div>');
  L.$('#wk5').onclick=function(){this.remove();
    L.$('#la').innerHTML='<span style="color:var(--no)">They join the parts. Screens expect data the code doesn’t have. One week left to untangle it.</span>';
    L.$('#lb').innerHTML='<span style="color:var(--ok)">Two pieces already work for real. They know what is left and what doesn’t fit.</span>';
    const q=L.$('#wq');q.innerHTML='<h2 class="sub">Why is the second team safer?</h2>';
    L.mc(q,['They learned early what fits and what doesn’t','They wrote more code in the first weeks'],0,
     'Building one piece end to end surfaces problems early, while there is still time to react.',
     'Amount of code isn’t the point. Joining design and code early shows what works while there is still time to fix it.');};}},
{part:2,src:'Chapter 1 · Targeting risk',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Class packs ran past its six weeks. By default, what happens?</h1>');
  L.mc(L.card,['It gets two more weeks to finish','The team splits it into two cycles','It stops, with no automatic extension'],2,
   'That is the circuit breaker. It stops a project from eating many times its appetite when the idea needs rethinking first.',
   'By default there is no extension. The circuit breaker stops the project so it can’t swallow many times its original appetite.');}},
{part:2,src:'Chapter 1 · Targeting risk',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Where is the risk cut?',['In shaping','In planning','In building'],[
   ['Ifeoma checks the tricky payment part with Tomás before anyone commits to the waitlist.',0,'Solving open questions before the time box is shaping.'],
   ['Noor and Tomás agree: six weeks for the waitlist, and no extension if it runs over.',1,'Capping the bet is how planning cuts risk.'],
   ['Bea wires up Kenji’s first screen to real data in week one.',2,'Joining design and code early is a building practice.'],
   ['Kenji and Bea start with the part nobody has built before, not the easy settings page.',2,'Working from most unknown to least worrisome happens while building.'],
   ['A pitch with a big unsolved question is sent back before it reaches a team.',0,'No project goes to a team with rabbit holes still in it.']]);}},
{part:2,src:'Chapter 1 · Targeting risk',pts:1,run(L){
  L.h(L.kick('pr','What first?')+'<h1 class="q">Pinecone keeps missing its own dates. Noor wants to start a big customer research program to make sure they build the right things. What does the book suggest?</h1>');
  L.mc(L.card,['Do the research first, then fix delivery','Fix shipping first, then improve discovery'],1,
   'The book says improving how you find what to build comes after you can ship again. A strategy you can’t act on doesn’t help.',
   'The book puts it the other way round: regain the ability to ship, then improve discovery. Better ideas don’t help if they never ship.');}},

/* ---------- PART 4: THE MAP ---------- */
{part:3,src:'Chapter 1 · How this book is organized',run(L){
  L.h(L.kick('learn','The three parts')+'<h1 class="q">The book, and the method, has three parts</h1>'+
   L.flow([['pencil','Shaping','Pre-work on an idea before it is ready to schedule','Part One',1],['scale','Betting','Choosing among pitched projects, six weeks at a time','Part Two',3],['layers','Building','How teams work out what to do and finish on time','Part Three',2]])+
   L.prose('Shaping goes from setting the appetite on a '+L.g('raw-idea','raw idea')+', to sketching a solution, to writing a '+L.g('pitch','pitch')+'. An appendix helps you start the method at your own company.'));
  L.done();}},
{part:3,src:'Chapter 1 · How this book is organized',run(L){
  L.h(L.kick('ex','A preview of the whole course')+'<h1 class="q">One request, followed from start to finish</h1>');
  L.beats(L.card,[
   ['A raw idea','Pinecone’s support team keeps hearing the same question from studio owners: “Can you add a waitlist?”'],
   ['Shaping','Ifeoma sets how much time it is worth, sketches a rough solution, looks for traps with Tomás, and writes it up as a pitch.'],
   ['Betting','At the '+L.g('betting-table','betting table')+', Noor and Tomás decide whether the waitlist gets the next six weeks.'],
   ['Building','Kenji and Bea get the whole project. They plan their own tasks and build it piece by piece.'],
   ['Done','At the end of the cycle, the waitlist ships. Or, if it doesn’t, the circuit breaker stops it.']],
   'Over the next lessons you will help Pinecone through each stage, with the waitlist as the main thread.');}},
{part:3,src:'Chapter 1 · How this book is organized',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Put the waitlist’s journey in order.</h1>');
  L.order(L.card,['Studio owners ask for a waitlist','Ifeoma shapes it and writes a pitch','Noor and Tomás bet on it','Kenji and Bea build it in one cycle'],
   'Shaping, then betting, then building. Nothing reaches a team until it has been shaped and bet on.');}},
{part:3,src:'Chapter 1 · Shaping the work',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Tap each piece until the sentence describes shaping correctly.</h1>');
  L.sentence(L.card,[['A small senior group','The build team'],['writes every task','outlines the key elements'],['after the cycle starts','before anyone bets on it']],[0,1,1],
   [['The build team builds. Shaping is done by a small senior group alongside them.'],['A task list is too detailed. Shaping outlines the solution and leaves the details to the team.'],['Shaping happens before the project is ready to bet on, not during the cycle.']],
   'A small senior group outlines the key elements of a solution before anyone bets on it.');}},
{part:3,src:'Chapter 1 · Making teams responsible',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Mixed review: which idea is this?',['Six-week cycles','Shaping the work','Responsible teams','The circuit breaker'],[
   ['Bea: “Don’t send me tickets. Give us the project and we’ll split it up.”',2,'Teams define their own tasks.'],
   ['Ifeoma: “Before we decide, how much is a waitlist worth to us?”',1,'Setting the appetite is part of shaping.'],
   ['Noor: “If this ships in six weeks we’ll be happy. Let’s commit and leave them alone.”',0,'That is the cycle mindset.'],
   ['Tomás: “Week six is over and it isn’t done. We stop and rethink it.”',3,'No extension by default.']]);}}
  ]
});
</script>
</body>
</html>
