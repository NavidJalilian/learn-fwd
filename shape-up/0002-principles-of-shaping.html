const psH=(a,b)=>{const s=Math.sin(a*12.9898+b*78.233)*43758.5453;return s-Math.floor(s)-.5;};

/* drawing kit: the same shapes look hand-drawn at level 2, crisp grey at 3, finished and colored at 4 */
function psKit(lv){

  k.R=(x,y,w,h,o)=>{o=o||{};
    if(sk){const p=[[x,y],[x+w,y],[x+w,y+h],[x,y+h]].map(([a,b])=>[a+J(a,b,2.4),b+J(b,a,2.4)]);let d='M'+p[0].join(' ');
      for(let i=1;i<=4;i++){const q=p[i%4],r=p[i-1];d+=' Q'+((q[0]+r[0])/2+J(q[0],r[1])).toFixed(1)+' '+((q[1]+r[1])/2+J(r[0],q[1])).toFixed(1)+' '+q.join(' ');}
      const f=o.fill?(o.fill==='pri'?'var(--pri-bg)':'var(--'+o.fill+'-bg)'):'none';
      return '<path d="'+d+'" style="fill:'+f+';stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round"/>';}
    if(px)return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+(o.r!=null?o.r:6)+'" style="fill:'+(o.fill?'var(--'+o.fill+')':'var(--card)')+';stroke:'+(o.fill?'none':'var(--line2)')+';stroke-width:1"/>';
    return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="2" style="fill:'+(o.fill?'var(--soft2)':'var(--card)')+';stroke:var(--faint);stroke-width:1"/>';};
  k.T=(x,y,t,o)=>{o=o||{};const txt=(!sk&&o.ex!=null)?o.ex:t;if(!txt)return '';
    const size=sk?(o.s||13)+2:(o.s||12.5);
    const fam=sk?'font-family:var(--serif);font-style:italic':'font-family:var(--sans)';
    const col=px&&o.on?'var(--pri-ink)':(sk||px)?'var(--ink)':'var(--muted)';
    return '<text x="'+x+'" y="'+y+'" text-anchor="'+(o.a||'start')+'" style="'+fam+';font-size:'+size+'px;font-weight:'+(o.b?700:400)+';fill:'+col+'">'+txt+'</text>';};
  k.L=(x1,y1,x2,y2)=>sk?'<path d="M'+x1+' '+y1+' Q'+((x1+x2)/2+J(x1,y2,2)).toFixed(1)+' '+((y1+y2)/2+J(y1,x2,2)).toFixed(1)+' '+x2+' '+y2+'" style="fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round"/>'
    :'<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" style="stroke:var(--line2);stroke-width:1"/>';
  k.C=(cx,cy,r,o)=>{o=o||{};let f,sw='';
    if(o.dot)f=sk?'var(--ink)':px?'var(--pri)':'var(--muted)';
    else if(sk){f='none';sw=';stroke:var(--ink);stroke-width:1.8';}
    else if(px)f=o.fill?'var(--'+o.fill+')':'var(--soft2)';
    else{f='var(--soft2)';sw=';stroke:var(--faint);stroke-width:1';}
    return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" style="fill:'+f+sw+'"/>';};
  k.A=(x1,y1,x2,y2)=>{const a=Math.atan2(y2-y1,x2-x1),h=(d)=>(x2-8*Math.cos(a+d)).toFixed(1)+' '+(y2-8*Math.sin(a+d)).toFixed(1);
    const c=sk?'var(--ink)':'var(--faint)';
    return k.L(x1,y1,x2,y2).replace('var(--line2)',c)+'<path d="M'+h(.5)+' L'+x2+' '+y2+' L'+h(-.5)+'" style="fill:none;stroke:'+c+';stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"/>';};
  k.D=(x,y,t,a)=>lv>=3?'<text x="'+x+'" y="'+y+'" text-anchor="'+(a||'start')+'" style="font-family:var(--sans);font-size:12px;font-weight:600;fill:var(--h4)">'+t+'</text>':'';
  k.X=(min,html)=>lv>=min?html:'';
  return k;}

function psDraw(obj,s){
  if(s.lv===0)return psSticky(obj.w0);
  if(s.lv===1)return psTicket(obj.w1);
  let h=obj.draw(psKit(s.lv));
  if(s.detail&&s.lv===2&&obj.det)h+=obj.det.map(([x,y,t])=>'<text x="'+x+'" y="'+y+'" style="font-family:var(--sans);font-size:12px;font-weight:600;fill:var(--h4)">'+t+'</text>').join('');
  if(!s.settled&&obj.q)h+=psQPin(...obj.q);
  if(s.openq&&obj.oq)h+=psQPin(...obj.oq);
  return h;}

/* the three lights: what the book says shaped work must be */
function psLights(s){
  const R=s.lv>=3?['off','No room: every detail is fixed']:s.detail?['off','Fonts and colors already fixed']:['on',s.lv<2?'All room, but no shape':'Room for the designer'];
  let S;if(s.lv<2)S=['off','Only a wish, no parts'];else if(!s.settled||s.openq)S=['off','An open question is left in'];else if(s.lv>=3)S=['warn','Looks solved, but hides costs'];else S=['on','Parts connect, no open questions'];
  let B;if(s.lv<2)B=['off','No edge: anything could be in'];else if(!s.app)B=['off','No appetite set'];else if(!s.nogos)B=['off','Nothing named as out'];else B=['on','Appetite set, what’s out named'];
  return [R,S,B];}
const psAll=s=>psLights(s).every(x=>x[0]==='on');

/* what the build team's designer says, and what happens in the cycle (member export) */
function psSay(s){
  if(s.lv===0)return ['“Export what, and to where? I’ll have to guess.”','Every choice is a guess. The work keeps growing, and nobody can say when it’s done.'];
  if(s.lv===1)return ['“I see why it matters. But what’s in, and where do I stop?”','“Make it nice” has no edge, so the team can’t make trade-offs. The scope grows.'];
  if(s.lv===3)return ['“Every box is placed. Am I meant to rethink this, or just fill it in?”','The team follows the drawing. A detail that costs more than it’s worth stays in, because it’s in the spec.'];
  if(s.lv===4)return ['“There’s nothing left for me to design.”','Getting every pixel just so uncovers hidden work, like that live progress bar. The estimate was wrong.'];
  if(!s.settled)return ['“The layout is mine, good. But will it work for a studio with thousands of members?”','In week two the team hits that open question and loses days on it.'];
  if(!s.nogos)return ['“Clear what to build. But is a weekly scheduled export part of it?”','Nobody said no, so “while we’re at it” extras creep in, and the two weeks stretch.'];
  return ['“I can see what to build and where to stop. The details are mine.”','The team works out the details and finishes within the two weeks.'];}

/* ---------- the shaping room ---------- */
const PS_PP={
 no:{n:'Noor',i:'N',sk:'S',role:'strategy'},

 if:{n:'Ifeoma',i:'I',sk:'DS',role:'design · strategy'},
 ke:{n:'Kenji',i:'K',sk:'D',role:'design · building now',b:1},

const PS_POS={D:[88,64],T:[232,64],S:[160,192],DS:[116,128],ST:[204,128],DT:[160,46]};
function psEval(st){const cov={D:0,T:0,S:0};st.room.forEach(id=>PS_PP[id].sk.split('').forEach(c=>{cov[c]=1;}));
  const builders=[...st.room].filter(id=>PS_PP[id].b),n=st.room.size,all=!!(cov.D&&cov.T&&cov.S);
  return {cov,n,all,builders,ok:all&&n<=2&&!builders.length&&!st.posted};}
function psVenn(st){const ev=psEval(st);
  let h=[['D',122,86,'h1'],['T',198,86,'h2'],['S',160,148,'h3']].map(([k,x,y,c])=>'<circle cx="'+x+'" cy="'+y+'" r="64" style="fill:'+(ev.cov[k]?'var(--'+c+'-bg)':'none')+';fill-opacity:.7;stroke:'+(ev.cov[k]?'var(--'+c+')':'var(--line2)')+';stroke-width:2;'+(ev.cov[k]?'':'stroke-dasharray:5 5')+';transition:fill .3s"/>').join('');
  h+='<text x="8" y="18" style="font-size:13px;font-weight:700;fill:var(--h1)">Design</text><text x="312" y="18" text-anchor="end" style="font-size:13px;font-weight:700;fill:var(--h2)">Technical</text><text x="230" y="208" style="font-size:13px;font-weight:700;fill:var(--h3)">Strategy</text>';
  h+=ev.all?'<circle cx="160" cy="106" r="14" style="fill:var(--ok-strong)"/><path d="M153 106l5 5 9-10" style="fill:none;stroke:var(--card);stroke-width:3;stroke-linecap:round;stroke-linejoin:round"/>'
    :'<circle cx="160" cy="106" r="14" style="fill:var(--card);stroke:var(--line2);stroke-width:2"/><text x="160" y="111" text-anchor="middle" style="font-size:14px;font-weight:700;fill:var(--muted)">?</text>';
  const groups={};PS_ORDER.filter(id=>st.room.has(id)).forEach(id=>{const key=PS_PP[id].sk.split('').sort().join('');(groups[key]=groups[key]||[]).push(id);});
  for(const key in groups){const g=groups[key],p=PS_POS[key];g.forEach((id,j)=>{const x=p[0]+(j-(g.length-1)/2)*28,P=PS_PP[id];
    h+='<circle cx="'+x+'" cy="'+p[1]+'" r="12.5" style="fill:var(--card);stroke:'+(P.b?'var(--no-strong)':'var(--ink)')+';stroke-width:2"/><text x="'+x+'" y="'+(p[1]+4.5)+'" text-anchor="middle" style="font-size:13px;font-weight:700;fill:var(--ink)">'+P.i+'</text>';});}

function psTracks(st){const pulled=[...st.room].filter(id=>PS_PP[id].b);const room=PS_ORDER.filter(id=>st.room.has(id));
  let h='<text x="6" y="14" style="font-size:12px;font-weight:700;fill:var(--muted)">Building track · this cycle</text><rect x="6" y="20" width="308" height="26" rx="7" style="fill:var(--h2-bg)"/>'+
   '<text x="14" y="38" style="font-size:12.5px;fill:var(--ink)">'+(pulled.length?'Project stalls: '+pulled.map(id=>PS_PP[id].n).join(' and ')+' pulled out':'A project shaped earlier')+'</text>';
  ['ke','be'].filter(id=>!st.room.has(id)).forEach((id,j)=>{const x=300-j*26;h+='<circle cx="'+x+'" cy="33" r="10" style="fill:var(--card);stroke:var(--ink);stroke-width:1.5"/><text x="'+x+'" y="37.5" text-anchor="middle" style="font-size:12px;font-weight:700;fill:var(--ink)">'+PS_PP[id].i+'</text>';});
  h+='<text x="6" y="66" style="font-size:12px;font-weight:700;fill:var(--muted)">Shaping track · for a future cycle</text><rect x="6" y="72" width="308" height="26" rx="7" style="fill:'+(st.posted?'var(--no-bg)':'var(--h1-bg)')+'"/>'+

  room.slice().reverse().forEach((id,j)=>{const x=300-j*24;h+='<circle cx="'+x+'" cy="85" r="10" style="fill:var(--card);stroke:'+(PS_PP[id].b?'var(--no-strong)':'var(--ink)')+';stroke-width:1.5"/><text x="'+x+'" y="89.5" text-anchor="middle" style="font-size:12px;font-weight:700;fill:var(--ink)">'+PS_PP[id].i+'</text>';});
  return h;}
function psRoomText(st){const ev=psEval(st);if(!ev.n&&!st.posted)return '<p>Tap people below to put them in the shaping room for the waitlist idea.</p>';
  const out=[];
  if(ev.n){if(!ev.cov.D)out.push('<b>No design:</b> nobody shapes how the waitlist works for a member, or where it fits in booking.');
    if(!ev.cov.T)out.push('<b>No technical sense:</b> nobody can judge what’s easy or hard, so a rabbit hole like automatic card charging slips through.');
    if(!ev.cov.S)out.push('<b>No strategy:</b> nobody asks what problem this solves, for which studios, or what it costs to do it instead of something else.');
    if(ev.all)out.push('<b>All three kinds of thinking</b> are in the room.');}
  if(ev.n>3)out.push('<b>Too many people</b> for a closed-door session: one generalist, or one or two others.');
  if(ev.builders.length)out.push('<b>'+ev.builders.map(id=>PS_PP[id].n).join(' and ')+'</b> '+(ev.builders.length>1?'are':'is')+' mid-cycle on the building track.');
  if(st.posted)out.push('<b>Posted:</b> everyone now treats the waitlist as coming. Ifeoma can’t quietly shelve it or drop it.');
  return out.map(x=>'<p>'+x+'</p>').join('');}

  const sw=el.querySelector('.ps-sw');if(sw)sw.onclick=()=>{st.posted=!st.posted;api.draw();if(o.change)o.change(st,'post');};
  api.draw();return api;}

{part:1,src:'Chapter 2 · Case study: The Dot Grid Calendar',
 solve:async L=>{for(let i=0;i<6&&L.$('#s6n');i++){L.$('#s6n').click();await L.sleep(20);}},
 run(L){
  const S=[
   ['The request',()=>psSchedule(),'Basecamp 3 launched with a “schedule”: a plain list of events, with no month, week or day grid. Soon customers asked Basecamp to “add a calendar.”'],
   ['Why it’s big',()=>PS_OBJ.calFull.draw(psKit(2))+psFcPins(),'They had built calendars before. A proper one can easily take <b>six months or more</b>. These things make it hard:<ol class="ps-ol"><li>Dragging events between days</li><li>Multi-day events wrapping round the screen edge</li><li>Month, week and day views</li><li>Dragging an event’s edge to change its length</li><li>Color coding by category</li><li>Different expectations on desktop and mobile</li></ol>'],
   ['The appetite',()=>psPeople(),'In past versions only about 10% of customers used the calendar. Six months wasn’t worth it. One six-week cycle was, if it could satisfy the customers writing in.'],
   ['The question',()=>psTenth(),'Six weeks buys only about a tenth of what people picture when they say “calendar.” So the real question was: <b>which tenth?</b>'],
   ['The idea',()=>PS_OBJ.calDot.draw(psKit(2)),'After researching the use case, they chose a concept inspired by phone calendars: a <b>two-month, read-only grid</b>. Each event puts a dot on its day. A list of events sits below, and clicking a day scrolls to its events. They called it the <b>Dot Grid</b>.']];
  L.h(L.kick('ex','A real case from the book')+'<h1 class="q">How Basecamp answered “add a calendar” in six weeks</h1>'+
   '<div class="ps-stage"><svg class="ps-svg" id="s6s" viewBox="0 0 320 190" role="img"></svg></div><div class="ps-cap" id="s6c" aria-live="polite"></div>'+
   '<div class="ps-step"><div class="ps-pips" id="s6p"></div><button class="btn pri" id="s6n">Next</button></div>');
  let i=0;
  const show=()=>{L.$('#s6s').innerHTML=S[i][1]();L.$('#s6s').setAttribute('aria-label',S[i][0]);L.$('#s6c').innerHTML='<b class="t">'+(i+1)+' of '+S.length+' · '+S[i][0]+'</b>'+S[i][2];
    L.$('#s6p').innerHTML=S.map((_,j)=>'<i class="'+(j<=i?'on':'')+'"></i>').join('');
    if(i===S.length-1){L.$('#s6n').remove();L.sheet('info','What they left out','No dragging events between days. No bars spanning multi-day events: the dots just repeat. No color coding or categories. They were comfortable with these trade-offs because they understood the use case.');L.done();}};
  L.$('#s6n').onclick=()=>{if(i<S.length-1){i++;show();}};show();}},

{part:1,src:'Chapter 2 · Case study: The Dot Grid Calendar',
 solve:async L=>{L.$('#g7 [data-k="0-10"]').click();for(const b of L.$$('#t7 button'))b.click();},
 run(L){
  L.h(L.kick('ex','Try the Dot Grid')+'<h1 class="q">Use the Dot Grid as it was shaped. Tap a day with dots, then try the three things people expect from a calendar.</h1>'+
   '<div class="ps-row" id="t7"><button class="chip" data-t="drag">Drag “Draft due” to Friday</button><button class="chip" data-t="span">Show the offsite as one long bar</button><button class="chip" data-t="color">Color events by category</button></div>'+
   '<div class="ps-ro" id="r7" aria-live="polite">Illustrative events. Tap any day that has dots.</div><div id="g7"></div><div class="ps-list" id="l7"></div>');
  let html='<div class="ps-wk" aria-hidden="true">'+PS_WD.map(d=>'<span>'+d[0]+'</span>').join('')+'</div>',list='';
  PS_MON.forEach(([nm,off,len],m)=>{html+='<div class="ps-mt">'+nm+'</div><div class="ps-grid">'+'<span></span>'.repeat(off);
    for(let d=1;d<=len;d++){const k=m+'-'+d,ev=PS_EV[k]||[];
      html+='<button class="ps-d'+(ev.length?' has':'')+'" data-k="'+k+'" aria-label="'+nm+' '+d+', '+(ev.length||'no')+' event'+(ev.length===1?'':'s')+'"><span>'+d+'</span><em>'+'<i></i>'.repeat(ev.length)+'</em></button>';
      if(ev.length)list+='<div class="ps-day" id="d7-'+k+'"><b>'+PS_WD[(off+d-1)%7]+', '+nm+' '+d+'</b>'+ev.map(e=>'<div>'+e+'</div>').join('')+'</div>';}
    html+='</div>';});
  L.$('#g7').innerHTML=html;L.$('#l7').innerHTML=list;
  const did=new Set();const check=()=>{if(did.size===4&&!L.$('#r7').dataset.f){L.$('#r7').dataset.f=1;
    L.sheet('info','A small, specific tenth','In: a two-month grid, a dot per event, a list below, and tapping a day to jump to its events. Out: dragging, spanning bars and color coding. Each was a deliberate trade-off, not an oversight.');L.done();}};
  L.$('#g7').addEventListener('click',e=>{const b=e.target.closest('.ps-d');if(!b)return;const k=b.dataset.k,ev=PS_EV[k];
    L.$$('#g7 .ps-d').forEach(x=>x.classList.remove('sel','span'));L.$$('#l7 .ps-day').forEach(x=>x.classList.remove('hl'));b.classList.add('sel');
    if(!ev){L.$('#r7').innerHTML='No dots on that day, so there’s nothing to show. Try a day with dots.';return;}
    const g=L.$('#d7-'+k);g.classList.add('hl');try{g.scrollIntoView({behavior:'smooth',block:'center'});}catch(_){}
    L.$('#r7').innerHTML='<b>'+b.getAttribute('aria-label')+'.</b> The list below jumps to that day. That’s how the Dot Grid shows detail: the grid stays simple.';did.add('day');check();});
  L.$('#t7').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(!b)return;const t=b.dataset.t;b.classList.add('sel');
    L.$$('#g7 .ps-d').forEach(x=>x.classList.remove('sel','span'));
    if(t==='drag'){const c=L.$('#g7 [data-k="0-25"]');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');L.$('#r7').innerHTML='<b>Nothing moves.</b> The Dot Grid is read-only: no dragging events between days.';}
    if(t==='span'){['0-17','0-18','0-19'].forEach(k=>L.$('#g7 [data-k="'+k+'"]').classList.add('span'));L.$('#r7').innerHTML='<b>No long bar.</b> A multi-day event just repeats its dot on each day it covers.';}
    if(t==='color')L.$('#r7').innerHTML='<b>Every dot stays the same.</b> No color coding and no categories.';
    did.add(t);check();});}},

{part:1,src:'Chapter 2 · Case study: The Dot Grid Calendar',pts:1,
 solve:async L=>{L.$('#c8 [data-c="dot"]').click();psSlide('#h8 input',2);L.$('#b8').click();},
 run(L){
  L.h(L.kick('try','Find Basecamp’s hand-off')+'<h1 class="q">Pick the concept and the level of detail Basecamp handed to its designer and programmers. Then hand it over.</h1>'+
   '<div class="ps-row" id="c8"><button class="chip sel" data-c="full">Full calendar</button><button class="chip" data-c="dot">Dot Grid</button></div>');
  const api=psHandoff(L.card,'h8',PS_OBJ.calFull,{lv:0,nogos:false},{hide:true,note:a=>a.s.lv<2?'Notes: none, just the words.':a.obj===PS_OBJ.calDot?'<b>Notes on the sketch:</b> two months, read-only, a dot per event. Out: dragging, spanning bars, color coding.':'<b>Notes on the sketch:</b> everything a calendar does, all six hard parts included.'});
  L.card.insertAdjacentHTML('beforeend','<button class="btn pri" id="b8" style="margin-top:10px">Hand it over</button>');
  let dot=false,a=false;
  L.$('#c8').addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(!b)return;dot=b.dataset.c==='dot';
    L.$$('#c8 .chip').forEach(x=>x.classList.toggle('sel',x===b));api.obj=dot?PS_OBJ.calDot:PS_OBJ.calFull;api.s.nogos=dot;api.draw();});
  L.$('#b8').onclick=()=>{const lv=api.s.lv,ok=dot&&lv===2;api.hide=false;api.draw();
    let msg;
    if(lv<2)msg='Words only: “add a calendar” could mean anything, from the six-month version down. The team can’t tell what’s in or out.';
    else if(lv>2)msg='Too concrete. The designer gets no room, and the polish hides costs. Basecamp’s sketch was rough on purpose.';
    else if(!dot)msg='Rough, but not bounded. A full calendar is six months or more of work, not one six-week cycle.';
    else msg='Rough enough that the designer had lots of room to decide the look, yet specific: it’s clear how it works, what to build, and what’s in and out.';
    if(!a){a=true;L.award(ok);L.sheet(ok?'ok':'no',ok?'That’s the one':'Not quite',msg+(ok?'':' Basecamp handed over a rough sketch of the Dot Grid.'));L.done();}
    else L.sheet(ok?'ok':'info',ok?'That’s the one':'Keep looking',msg);};}},

{part:1,src:'Chapter 2 · Case study: The Dot Grid Calendar',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Why did Basecamp build only a small part of a calendar?</h1>');
  L.mc(L.card,['Their programmers had never built a calendar','The idea was worth six weeks, not six months'],1,
   'The appetite set the limit. Few customers had used the old calendar, so six months wasn’t worth it, but six weeks was.',
   'They had built calendars before. The limit came from the appetite: few customers had used the old calendar, so it was worth six weeks, not six months.');}},

/* ---------- PART 3: ROUGH, SOLVED, BOUNDED ---------- */
{part:2,src:'Chapter 2 · Property 1: It’s rough',run(L){
  L.h(L.kick('learn','Three properties of shaped work')+'<h1 class="q">Shaped work is rough, solved and bounded</h1>'+
   L.tiers([['pencil','Rough','Anyone can see it’s unfinished, and where their own work will go. Detail that is too fine, too early commits everyone to the wrong choices.','room to work'],
            ['check','Solved','It’s thought through. The main parts are there and connect. It isn’t split into tasks, but the direction is clear, and the open questions and '+L.g('rabbit-hole','rabbit holes')+' seen up front are gone.','clear direction'],
            ['lock','Bounded','It says where to stop: a set '+L.g('appetite','appetite')+', and specific things left out, called '+L.g('no-go','no-gos')+'.','a clear edge']])+
   '<p class="small" style="margin-top:10px">Roughness gives the team room. Solved and bounded act like guard rails, so the team doesn’t build too much, wander or get stuck.</p>');
  L.done();}},

{part:2,src:'Chapter 2 · Property 2: It’s solved',
 solve:async L=>{for(const b of L.$$('#p11 button'))b.click();},
 run(L){
  L.h(L.kick('pr','Edge cases')+'<h1 class="q">Where does a hand-off break? Try each extreme on the member export.</h1>'+
   '<div class="ps-row" id="p11"><button class="chip" data-p="0">The sticky note</button><button class="chip" data-p="1">Noor’s pixel mockup</button><button class="chip" data-p="2">Rough but not solved</button><button class="chip" data-p="3">Solved but not bounded</button></div>');
  const P=[[{lv:0,settled:true,nogos:true},'Rough isn’t enough','A few words leave all the room in the world, but no parts and no edge. Rough only helps when it sits on top of a solved, bounded idea.'],
           [{lv:4,settled:true,nogos:true},'Every question answered, still broken','Even with no open questions and a list of no-gos, a pixel mockup fails on rough: nothing left to design, and the polish hides costs the team can’t back out of.'],
           [{lv:2,settled:false,nogos:true},'An open question left in','It looks right and has an edge, but nobody checked how big studios behave. Shaping should remove the open questions you can see up front, or the team gets stuck mid-cycle.'],
           [{lv:2,settled:true,nogos:false},'No edge','It’s thought through, but nothing says what not to do. Without named no-gos, “while we’re at it” extras creep in and the work overruns.']];
  const api=psHandoff(L.card,'h11',PS_OBJ.exp,{lv:2},{pins:'tap',say:true});
  L.card.insertAdjacentHTML('beforeend','<p class="small" style="margin:8px 0 0">You can also slide, and tap the notes to settle the question or write the no-gos.</p>');
  const tried=new Set();
  L.$('#p11').addEventListener('click',e=>{const b=e.target.closest('[data-p]');if(!b)return;const j=+b.dataset.p;
    L.$$('#p11 .chip').forEach(x=>x.classList.toggle('sel',x===b));api.set(Object.assign({},P[j][0]));tried.add(j);
    L.sheet('info',P[j][1],P[j][2]+(tried.size===4?' <b>All four tried.</b>':''));if(tried.size===4)L.done();});}},

{part:2,src:'Chapter 2 · Property 2: It’s solved',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Ifeoma’s sketch for a clearer “class cancelled” email is rough and has a two-week limit. But nobody has worked out how it fits the existing email system. Which property is missing?</h1>');
  L.mc(L.card,['Rough','Bounded','Solved'],2,
   'An open question is still sitting in the idea, so it isn’t solved yet.',
   'It already looks unfinished (rough) and has a limit (bounded). What’s missing is the thinking that makes the parts connect: it isn’t solved.');}},

{part:2,src:'Chapter 2 · Property 1: It’s rough',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which property does this show?',['Rough','Solved','Bounded'],[
   ['Ifeoma’s sketch uses boxes and arrows, with no colors or real wording.',0,'It looks unfinished on purpose, leaving room for the team.'],
   ['The write-up says: “Out of scope: printing the class list.”',2,'Saying what not to do sets the edge.'],
   ['Tomás confirms the main pieces connect, from the button to the stored record.',1,'The main parts are there and fit together.'],
   ['“This is worth two weeks, no more.”',2,'A fixed appetite is part of being bounded.'],

{part:2,src:'Chapter 2 · Property 3: It’s bounded',pts:1,
 solve:async L=>{psSlide('#h14 input',2);['app','out1','tomas'].forEach(c=>L.$('#k14 [data-c="'+c+'"]').click());L.$('#b14').click();},
 run(L){
  L.h(L.kick('pr','Challenge')+'<h1 class="q">Fix Ifeoma’s class-cancelled email hand-off. Set the detail and attach the right notes until all three lights are on.</h1>');
  const api=psHandoff(L.card,'h14',PS_OBJ.mail,{lv:4,settled:false,nogos:false,app:false});
  const C=[['app','Appetite: two weeks'],['out1','Out: text messages and push alerts'],['tomas','Tomás checked: it uses the email system we already have'],['fonts','Exact fonts, sizes and colors for every line'],['sms','Maybe a text message too? Decide later'],['out2','Out: studios writing their own wording']];
  L.card.insertAdjacentHTML('beforeend','<div class="ps-lab">Notes to attach (tap to add or remove)</div><div class="ps-cards" id="k14">'+C.map(c=>'<button class="chip" data-c="'+c[0]+'" aria-pressed="false">'+c[1]+'</button>').join('')+'</div><button class="btn pri" id="b14" style="margin-top:6px">Hand it over</button>');
  const on=new Set();let a=false;
  L.$('#k14').addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(!b)return;const c=b.dataset.c;on.has(c)?on.delete(c):on.add(c);b.classList.toggle('sel',on.has(c));b.setAttribute('aria-pressed',on.has(c));
    api.set({app:on.has('app'),nogos:on.has('out1')||on.has('out2'),settled:on.has('tomas'),detail:on.has('fonts'),openq:on.has('sms')});});
  L.$('#b14').onclick=()=>{const s=api.s,ok=psAll(s);const why=[];
    if(s.lv<2)why.push('it’s still just words');if(s.lv>2)why.push('it’s too concrete to leave the designer room');
    if(s.lv===2&&s.detail)why.push('the font and color note takes the designer’s room away');
    if(s.lv>=2&&!s.settled)why.push('the open question about the email system is still there');
    if(s.openq)why.push('“decide later” leaves a question open on purpose');
    if(!s.app)why.push('there’s no appetite');if(!s.nogos)why.push('nothing is named as out');
    const msg=ok?'Rough sketch, the email-system question settled with Tomás, a two-week appetite and named no-gos. The team has room and guard rails.':'Not yet: '+why.join('; ')+'.';
    if(!a){a=true;L.award(ok);L.sheet(ok?'ok':'no',ok?'Ready to hand over':'Not quite',msg+(ok?'':' Adjust it and hand it over again to check.'));L.done();}
    else L.sheet(ok?'ok':'info',ok?'Ready to hand over':'Still not there',msg);};}},

/* ---------- PART 4: WHO AND WHEN ---------- */
{part:3,src:'Chapter 2 · Who shapes',run(L){
  L.h(L.kick('learn','Who shapes')+'<h1 class="q">Shaping mixes three kinds of thinking</h1>'+
   L.list([['eye','Design','Shaping is mainly design work: what the feature does, how it works for the user, and where it fits in existing flows.'],
     ['shield','Technical sense','You needn’t be a programmer, but you must judge what’s possible, easy or hard.'],
     ['compass','Strategy','You question the problem: what are we solving, why does it matter, what counts as success, which customers are affected, and what it costs to do this instead of something else.']],1)+
   L.prose('One generalist can cover all three, or work with one or two others. Either way it’s <b>closed-door</b> work: rough diagrams nobody outside the room could read, fast talk, frank opinions.'));
  L.done();}},

{part:3,src:'Chapter 2 · Who shapes',
 solve:async L=>{L.$('#v16 [data-p="if"]').click();L.$('#v16 [data-p="to"]').click();},
 run(L){
  L.h(L.kick('ex','Explore · the shaping room')+'<h1 class="q">Ifeoma wants to shape the waitlist idea. Put people in the room and watch which kinds of thinking get covered.</h1><p class="small" style="margin:-8px 0 6px">Notice what the sketch would miss when a circle is empty.</p>');
  let lit=false,gap=false,fin=false;
  psRoom(L.card,'v16',{room:[]},{change:st=>{const ev=psEval(st);if(ev.all)lit=true;if(ev.n&&!ev.all)gap=true;
    if(lit&&gap&&!fin){fin=true;L.sheet('info','The overlap needs all three','Each missing circle leaves a different hole: no design means no clear form, no technical sense lets a rabbit hole through, no strategy solves a problem that may not matter.');L.done();}}});}},

{part:3,src:'Chapter 2 · Two tracks',run(L){
  const B=(x,y,w,t,c,d)=>'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="28" rx="7" style="fill:var(--'+c+'-bg);stroke:var(--'+c+');stroke-width:1.5;'+(d?'stroke-dasharray:4 3':'')+'"/><text x="'+(x+w/2)+'" y="'+(y+18.5)+'" text-anchor="middle" style="font-size:12px;font-weight:600;fill:var(--ink)">'+t+'</text>';
  L.h(L.kick('learn','Two tracks')+'<h1 class="q">Shaping and building run side by side</h1>'+
   L.prose('Unshaped work is risky and unknown, so you can’t really schedule it. That’s why there are '+L.g('two-tracks','two separate tracks')+'.')+
   '<div class="ps-stage"><svg class="ps-svg" viewBox="0 0 320 172" role="img" aria-label="Over three cycles, teams build work shaped earlier while shapers prepare what might come next">'+
   ['Cycle 1','Cycle 2','Cycle 3'].map((c,j)=>'<text x="'+(57+j*102)+'" y="14" text-anchor="middle" style="font-size:12px;font-weight:700;fill:var(--muted)">'+c+'</text>').join('')+
   '<text x="8" y="36" style="font-size:12px;font-weight:700;fill:var(--h2)">Building: teams</text>'+B(8,42,98,'builds A','h2')+B(110,42,98,'builds B','h2')+B(212,42,100,'builds C','h2')+
   B(8,106,46,'B','h1',1)+B(58,106,48,'D','h1',1)+B(110,106,98,'shapes C','h1',1)+B(212,106,100,'shapes E','h1',1)+
   '<text x="8" y="150" style="font-size:12px;font-weight:700;fill:var(--h1)">Shaping: shapers, in private</text>'+
   '<path d="M31 106 C 36 86, 150 94, 159 72" style="fill:none;stroke:var(--ink);stroke-width:1.6"/><path d="M153 77 L159 71 L162 79" style="fill:none;stroke:var(--ink);stroke-width:1.6"/><text x="88" y="86" style="font-size:12px;font-weight:700;fill:var(--ink)">bet</text>'+
   '<text x="8" y="166" style="font-size:12px;fill:var(--muted)">D was shelved: no harm done.</text></svg></div>'+
   L.note('Shaping stays <b>private</b> until someone commits to bet on it. That way shapers can put an idea on the shelf, or drop it when it isn’t working out.','lock'));
  L.done();}},

{part:3,src:'Chapter 2 · Two tracks',
 solve:async L=>{for(const b of L.$$('#p18 button'))b.click();},
 run(L){
  L.h(L.kick('pr','Edge cases')+'<h1 class="q">Five ways to set up the waitlist shaping. Try each one and watch the room and the tracks.</h1>'+
   '<div class="ps-row" id="p18"><button class="chip" data-p="0">Ifeoma alone</button><button class="chip" data-p="1">Noor and Tomás</button><button class="chip" data-p="2">Pull in Kenji and Bea</button><button class="chip" data-p="3">Whole-company brainstorm</button><button class="chip" data-p="4">Post the half-done sketch</button></div>');
  const P=[[['if'],0,'A gap in technical sense','Ifeoma brings design and strategy, but the payment and booking code is Tomás’s ground. Alone, Ifeoma could miss a rabbit hole like automatic card charging. Working solo only works if one person truly covers all three.'],
           [['no','to'],0,'No designer in the room','Strategy and technical sense, but shaping is mainly design work. Nobody works out how a member joins the waitlist or where it fits in booking.'],
           [['ke','be'],0,'Wrong track, and no strategy','Design and technical sense, but nobody asks which problem this solves or what it’s worth. And Kenji and Bea are mid-cycle building work shaped earlier, so their project stalls.'],
           [['no','to','if','ke','be','su'],0,'Covered, but not closed-door','All three circles light up, but shaping is fast, frank and private: one generalist, or one or two others. A big brainstorm can’t move that way.'],
           [['if','to'],1,'Right people, wrong move','Ifeoma and Tomás cover all three. But posting the half-done sketch makes the waitlist feel promised. Ifeoma loses the option to shelve it or drop it.']];
  const api=psRoom(L.card,'v18',{room:[]},{priv:true,tracks:true});const tried=new Set();
  L.$('#p18').addEventListener('click',e=>{const b=e.target.closest('[data-p]');if(!b)return;const j=+b.dataset.p;
    L.$$('#p18 .chip').forEach(x=>x.classList.toggle('sel',x===b));api.set(P[j][0],P[j][1]);tried.add(j);
    L.sheet('info',P[j][2],P[j][3]+(tried.size===5?' <b>All five tried.</b>':''));if(tried.size===5)L.done();});}},

{part:3,src:'Chapter 2 · Who shapes',pts:1,
 solve:async L=>{['no','ke','be','if','to'].forEach(p=>L.$('#v19 [data-p="'+p+'"]').click());L.$('#v19 .ps-sw').click();L.$('#b19').click();},
 run(L){
  L.h(L.kick('pr','Challenge')+'<h1 class="q">Fix this setup. Build a shaping room of at most two people that lights the overlap, keeps the builders building, and stays private.</h1>');
  const api=psRoom(L.card,'v19',{room:['no','ke','be'],posted:true},{priv:true,tracks:true});
  L.card.insertAdjacentHTML('beforeend','<button class="btn pri" id="b19" style="margin-top:10px">Start shaping</button>');let a=false;
  L.$('#b19').onclick=()=>{const st=api.st,ev=psEval(st),why=[];
    if(!ev.all)why.push('a circle is still empty');if(ev.n>2)why.push('the room has '+ev.n+' people');
    if(ev.builders.length)why.push(ev.builders.map(id=>PS_PP[id].n).join(' and ')+' should stay on the building track');if(st.posted)why.push('the sketch is still posted');
    const msg=ev.ok?'Ifeoma brings design and strategy, Tomás the technical sense, behind closed doors. Kenji and Bea keep building.':'Not yet: '+why.join('; ')+'.';
    if(!a){a=true;L.award(ev.ok);L.sheet(ev.ok?'ok':'no',ev.ok?'A good shaping room':'Not quite',msg+(ev.ok?'':' Adjust it and try again to check.'));L.done();}
    else L.sheet(ev.ok?'ok':'info',ev.ok?'A good shaping room':'Still not there',msg);};}},
