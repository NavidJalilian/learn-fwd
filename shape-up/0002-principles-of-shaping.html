<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Principles of Shaping</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0002', title:'Principles of shaping', minutes:18, icon:'pencil',
  goals:['Tell work that is too concrete or too vague from work shaped at the right level','Check an idea for the three properties: rough, solved, bounded','Say who shapes, on which track, and in which four steps'],
  parts:['Right level','Dot Grid','Rough, solved, bounded','Who and when'],
  read:'Read chapter 2 of the book for the Dot Grid sketches and the full case.',
  glossary:{
    wireframe:'Wireframe: a detailed layout of a screen showing where each element goes. High-fidelity mockups go further and look like the finished product.',
    'two-tracks':'Two tracks: shaping and building run side by side. Teams build work shaped earlier while shapers prepare what might come next.',
    'shaping-steps':'Steps of shaping: set boundaries, rough out the elements, address risks and rabbit holes, write the pitch.'
  },
  cheatsheet:[
    'Shape at the right level: <b>wireframes are too concrete</b>, <b>words are too abstract</b>.',
    'Too concrete leaves designers no room and hides costs. Too vague leaves no way to make trade-offs and no edge to the scope.',
    '<b>Dot Grid</b>: instead of a six-month calendar, a two-month read-only grid with dots, built in one cycle. Which tenth of the idea matters?',
    'Shaped work is <b>rough</b> (room to work), <b>solved</b> (main parts connect), <b>bounded</b> (an appetite and clear no-gos).',
    'Shapers combine <b>design</b>, <b>technical sense</b> and <b>strategy</b>, alone or with one or two others, in private.',
    '<b>Two tracks</b>: shaping runs alongside building. Shaped work stays private until it is bet on.',
    'Four steps: <b>set boundaries</b>, <b>rough out the elements</b>, <b>address risks and rabbit holes</b>, <b>write the pitch</b>.'
  ],
  steps:[
/* ---------- PART 1: THE RIGHT LEVEL ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Noor writes “Add a waitlist” on a sticky note and hands it to Bea. What is Bea most likely to say?</h1>');
  L.mc(L.card,['“Got it, I know exactly what to build.”','“What do you mean by a waitlist, exactly?”'],1,
   'Three words leave almost everything open. This lesson is about handing over work at the right level of detail.',
   'Three words leave almost everything open: who joins, what happens when a spot frees up, what is left out. Bea would have to guess.');}},
{part:0,src:'Chapter 2 · Principles of Shaping',run(L){
  L.h(L.kick('learn','Two ways to get it wrong')+'<h1 class="q">Shaped work is neither too concrete nor too vague</h1>'+
   L.lanes([['eye','Too concrete','Going straight to '+L.g('wireframe','wireframes')+' or polished mockups fixes the details too early. Designers get no room to rethink. And polished screens hide costs, so the work is <i>harder</i> to estimate, and nobody can drop a detail that turns out too expensive.',4],
            ['chat','Too abstract','“Build a calendar view” sounds sensible, but what does it include? The team can’t make trade-offs because they don’t know what is in or out. With no edge, the project grows out of control.',3]])+
   L.quote('You have to be a mind reader.','a programmer describing vague projects, chapter 2'));
  L.done();}},
{part:0,src:'Chapter 2 · Wireframes are too concrete',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Noor hands Kenji a pixel-perfect mockup of a new booking screen and says “make it better.” Kenji feels stuck. Why?</h1>');
  L.mc(L.card,['It is too vague to start from','It is too concrete to rethink'],1,
   'A finished-looking design already decides the details, which leaves Kenji no room to rethink it.',
   'The mockup isn’t vague at all: it fixes every detail. That is what leaves Kenji no room to rethink it.');}},
{part:0,src:'Chapter 2 · Principles of Shaping',pts:1,
 solve:async L=>{const c=L.$('#lv').children;c[0].click();c[2].click();c[1].click();},
 run(L){
  const LV=[['chat','Just words','“Add a member export.”','The team can’t tell what is in or out. Every choice is a guess, and the work keeps growing.','no'],
            ['pencil','Shaped','A rough sketch: an “Export” button on the members page, which columns go in the file, and a note that scheduled exports are out.','Clear what to build and where to stop, with room for the designer to work out the details.','ok'],
            ['eye','Wireframe','Every pixel of the export screen is drawn, down to the button color and the exact wording.','The designer has nothing left to design. If one detail turns out costly, nobody feels free to drop it.','no']];const seen=new Set();
  L.h(L.kick('pr','Toggle and compare')+'<h1 class="q">Ifeoma could hand over the member export at three levels. Try each one.</h1><div id="lv"></div>'+
   '<div style="background:var(--soft);border-radius:16px;padding:14px;margin:8px 0 6px;min-height:120px"><div class="small" id="lh">Choose a level above.</div><div id="lt"></div></div><div id="lq"></div>');
  LV.forEach((x,j)=>{const b=document.createElement('button');b.className='chip';b.innerHTML=L.ic(x[0])+x[1];b.onclick=()=>{[...L.$('#lv').children].forEach(y=>y.classList.remove('sel'));b.classList.add('sel');seen.add(j);
    L.$('#lh').innerHTML='<b>What the team gets:</b> '+x[2];
    L.$('#lt').innerHTML='<p class="small" style="margin-top:8px;color:var(--'+x[4]+')">'+x[3]+'</p>';
    if(seen.size===3&&!L.$('#lq').innerHTML){const q=L.$('#lq');q.innerHTML='<h2 class="sub">Which level gives the team both direction and room?</h2>';
      L.mc(q,['Just words','Shaped','Wireframe'],1,'Shaped work says what to build and where to stop, and leaves the details to the team.','One extreme leaves them guessing, the other leaves them nothing to decide. The shaped level gives both direction and room.');}};L.$('#lv').appendChild(b);});}},
{part:0,src:'Chapter 2 · Principles of Shaping',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Too concrete, too vague, or shaped?',['Too concrete','Too vague','Shaped right'],[
   ['A ticket that says only: “Improve the studio dashboard.”',1,'Nobody can tell what is in or out, so the work has no edge.'],
   ['Twelve finished mockups of a new check-in flow, every label and color decided.',0,'Every detail is fixed before anyone has worked through the real costs.'],
   ['A rough sketch of a longer class description field, where it shows, and a note that photos are out.',2,'Clear about what and where, with room for the details.'],
   ['“Add group notifications.”',1,'It sounds sensible, but nobody knows what it includes.'],
   ['A pixel-perfect spec of the “class cancelled” email, down to the font size.',0,'It leaves the designer nothing to decide and hides possible costs.']]);}},

/* ---------- PART 2: DOT GRID ---------- */
{part:1,src:'Chapter 2 · Case study: The Dot Grid Calendar',run(L){
  L.h(L.kick('ex','A real case from the book')+'<h1 class="q">How Basecamp answered “add a calendar” in six weeks</h1>');
  L.beats(L.card,[
   ['The request','Basecamp 3 launched with a plain list of events and no calendar grid. Soon customers started asking for a calendar.'],
   ['The problem','The team had built calendars before. A full one, with dragging, multi-day events, many views and color coding, can take <b>six months or more</b>.'],
   ['The appetite','In older versions, only about 10% of customers used the calendar. Six months wasn’t worth it. But one six-week cycle was, if it could satisfy the people writing in.'],
   ['The question','Six weeks buys about a tenth of what people picture as a “calendar.” So: <b>which tenth?</b>'],
   ['The idea','After some research they chose a concept inspired by phone calendars: a two-month, read-only grid. Each event puts a dot on its day. Events are listed below, and clicking a day scrolls to that day’s events. They called it the <b>Dot Grid</b>.'],
   ['What was left out','No dragging events between days. Multi-day events just repeat their dots. No color coding or categories. They were comfortable with that because they understood the use case.']],
   'The sketch was rough enough to leave the designer room, yet clear about what to build and what was out.');}},
{part:1,src:'Chapter 2 · Case study: The Dot Grid Calendar',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Why did Basecamp build only a small part of a calendar?</h1>');
  L.mc(L.card,['The idea was worth six weeks, not six months','Their programmers had never built a calendar'],0,
   'The appetite set the limit. Few customers had used the old calendar, so six months wasn’t worth it, but six weeks was.',
   'They had built calendars before. The limit came from the appetite: few customers had used the old calendar, so it was worth six weeks, not six months.');}},
{part:1,src:'Chapter 2 · Case study: The Dot Grid Calendar',pts:6,run(L){
  L.h(L.kick('pr','In or out?')+'<h1 class="q">Sort each feature: part of the Dot Grid, or left out?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['In the Dot Grid','Left out'],[
   ['A two-month grid of days',0,'The grid covered two months.'],
   ['Dragging an event to another day',1,'The grid was read-only, so no dragging.'],
   ['A dot on each day for each event',0,'That is where the name comes from.'],
   ['Color coding by category',1,'No colors or categories.'],
   ['Clicking a day scrolls the list to its events',0,'The event list below the grid did the detailed work.'],
   ['Long bars that stretch across multi-day events',1,'Multi-day events just repeated their dots.']],
   'A small, clear tenth of a calendar. Everything else was a deliberate trade-off, not an oversight.');}},

/* ---------- PART 3: ROUGH, SOLVED, BOUNDED ---------- */
{part:2,src:'Chapter 2 · Property 1: It’s rough',run(L){
  L.h(L.kick('learn','Three properties of shaped work')+'<h1 class="q">Shaped work is rough, solved and bounded</h1>'+
   L.tiers([['pencil','Rough','Anyone can see it is unfinished. The open spaces show where designers and programmers will add their own judgment. Detail that is too fine, too early locks everyone into the wrong choices.','room to work'],
            ['check','Solved','It has been thought through. The main parts of the solution are there and connect. It isn’t broken into tasks, but the direction is clear, and the open questions and rabbit holes seen up front are gone.','clear direction'],
            ['lock','Bounded','It says what <i>not</i> to do and where to stop. There is a set '+L.g('appetite','appetite')+', and fitting it means leaving specific things out.','a clear edge']])+
   '<p class="small" style="margin-top:10px">Roughness gives the team room. Solved and bounded act like guard rails.</p>');
  L.done();}},
{part:2,src:'Chapter 2 · Property 2: It’s solved',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">Ifeoma shapes the member export, a small two-week idea</h1>');
  L.beats(L.card,[
   ['The ask','Studio owners want their member list in a spreadsheet. Ifeoma decides it is worth about two weeks.'],
   ['Rough','A quick drawing: an “Export” button on the members page and a downloaded file. No colors, no exact wording. The team’s designer will work out the details.'],
   ['Solved','Ifeoma decides which columns go in the file and checks with Tomás that very large studios won’t break it. The parts connect from button to file.'],
   ['Bounded','Two weeks. Out: picking your own columns, scheduled exports, exporting other lists.'],
   ['The hand-over','Whichever team gets it can see what to build, where to stop, and where their own choices go.']],
   'All three properties at once: unfinished-looking, thought through, and fenced in.');}},
{part:2,src:'Chapter 2 · Property 2: It’s solved',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Ifeoma’s sketch for a clearer “class cancelled” email is rough and has a two-week limit. But nobody has worked out how it fits the existing email system. Which property is missing?</h1>');
  L.mc(L.card,['Rough','Bounded','Solved'],2,
   'The idea isn’t thought through yet: an open question is still sitting in it.',
   'It already looks unfinished (rough) and has a limit (bounded). What’s missing is the thinking that makes the parts connect: it isn’t solved.');}},
{part:2,src:'Chapter 2 · Property 3: It’s bounded',pts:1,
 solve:async L=>{const c=L.$('#sw').children;c[0].click();c[1].click();c[2].click();},
 run(L){
  const P=[['pencil','Rough','The sketch arrives as finished mockups. Kenji follows them to the pixel and nobody rethinks the details that turn out expensive.'],
           ['check','Solved','Kenji and Bea hit an open question in week two and spend days stuck on it.'],
           ['lock','Bounded','There is no edge. Kenji and Bea keep adding “one more thing” and build too much.']];const seen=new Set();
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Switch off one property at a time and see what happens to the team.</h1><div id="sw"></div>'+
   '<div style="background:var(--soft);border-radius:16px;padding:14px;margin:8px 0 6px;min-height:100px"><div class="small" id="sr">All three are on. The team has room and guard rails.</div></div><div id="sq"></div>');
  P.forEach((x,j)=>{const b=document.createElement('button');b.className='chip';b.innerHTML=L.ic(x[0])+'Remove “'+x[1]+'”';b.onclick=()=>{[...L.$('#sw').children].forEach(y=>y.classList.remove('sel'));b.classList.add('sel');seen.add(j);
    L.$('#sr').innerHTML='<b>Without '+x[1].toLowerCase()+':</b> '+x[2];
    if(seen.size===3&&!L.$('#sq').innerHTML){const q=L.$('#sq');q.innerHTML='<h2 class="sub">Bea keeps saying “while we’re at it, let’s also…” Which property is weak?</h2>';
      L.mc(q,['Rough','Solved','Bounded'],2,'Without a clear edge and an appetite, there is no reason to stop adding.','“While we’re at it” is scope creeping in. That happens when the work has no clear edge: it isn’t bounded.');}};L.$('#sw').appendChild(b);});}},
{part:2,src:'Chapter 2 · Property 1: It’s rough',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which property does this show?',['Rough','Solved','Bounded'],[
   ['Ifeoma’s sketch uses boxes and arrows, with no colors or real wording.',0,'It looks unfinished on purpose, leaving room for Kenji.'],
   ['The pitch says: “Out of scope: printing the class list.”',2,'Saying what not to do sets the edge.'],
   ['Tomás confirms the main pieces connect, from the button to the stored record.',1,'The main parts are there and fit together.'],
   ['“This is worth two weeks, no more.”',2,'A fixed appetite is part of being bounded.'],
   ['A tricky question about time zones was settled before the team got the work.',1,'Rabbit holes seen up front are removed.']]);}},

/* ---------- PART 4: WHO AND WHEN ---------- */
{part:3,src:'Chapter 2 · Who shapes',run(L){
  L.h(L.kick('learn','Who shapes')+'<h1 class="q">Shaping mixes three kinds of thinking</h1>'+
   L.list([['eye','Design','Shaping is mainly design work: how the feature works from the user’s point of view and where it fits in existing flows.'],
     ['shield','Technical sense','You needn’t be a programmer, but you must judge what is possible, easy or hard.'],
     ['compass','Strategy','You question the problem: what are we solving, why does it matter, which customers are affected, what counts as success, and what we give up to do it.']],1)+
   L.prose('One generalist can cover all three, or work with one or two others. Either way, it is a <b>closed-door</b> process: rough diagrams nobody outside the room could read, fast talk, frank opinions.'));
  L.done();}},
{part:3,src:'Chapter 2 · Who shapes',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Pinecone needs someone to shape the waitlist. Which setup fits the book best?</h1>');
  L.mc(L.card,['The whole company in an open brainstorm','Ifeoma, checking technical points with Tomás','Bea alone, as the one who will code it'],1,
   'Ifeoma brings design and strategy, Tomás the technical sense, and it stays a small private session.',
   'Shaping needs design, technical and strategic sense in a small, private group. Ifeoma with Tomás covers all three; a big brainstorm or one builder alone doesn’t.');}},
{part:3,src:'Chapter 2 · Two tracks',run(L){
  L.h(L.kick('learn','Two tracks')+'<h1 class="q">Shaping and building run side by side</h1>'+
   L.prose('Unshaped work is risky and unknown, so you can’t really schedule it. That’s why there are '+L.g('two-tracks','two separate tracks')+'.')+
   L.lanes([['layers','Building track','During a six-week cycle, teams build work that was shaped earlier. Kenji and Bea are here.',2],
            ['pencil','Shaping track','At the same time, shapers work on what teams <i>might</i> build in a later cycle. Ifeoma is here.',1]])+
   L.note('Shaping work stays <b>private</b> until someone commits to bet on it. That way the shapers can shelve an idea or drop it when it isn’t working.','lock'));
  L.done();}},
{part:3,src:'Chapter 2 · Two tracks',pts:1,run(L){
  L.h(L.kick('pr','What should happen?')+'<h1 class="q">Noor loves Ifeoma’s half-done waitlist sketch and wants to post it in the company chat “to build excitement.” What does the book suggest?</h1>');
  L.mc(L.card,['Post it, so everyone can help finish the design','Keep it private until it is bet on'],1,
   'Keeping it private lets Ifeoma shelve or drop the idea if it doesn’t work out, with no promises made.',
   'Shaping is private until there is a commitment. Posting it early turns a rough idea into an expectation, and Ifeoma loses the freedom to drop it.');}},
{part:3,src:'Chapter 2 · Steps to shaping',run(L){
  L.h(L.kick('learn','Four steps of shaping')+'<h1 class="q">The next four lessons follow these steps</h1>'+
   L.list([['Set boundaries','Decide how much time the raw idea is worth and define the problem.'],
     ['Rough out the elements','Sketch a solution, above the level of wireframes, that fits the appetite.'],
     ['Address risks and rabbit holes','Look hard for holes and open questions. Change the solution, cut parts, or pin down tricky details.'],
     ['Write the pitch','Package it as a '+L.g('pitch','pitch')+': problem, appetite, solution, rabbit holes and no-gos. It goes to the '+L.g('betting-table','betting table')+', and if chosen, helps kick off the project.']],2));
  L.done();}},
{part:3,src:'Chapter 2 · Steps to shaping',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Put Ifeoma’s shaping steps in order.</h1>');
  L.order(L.card,['Set boundaries','Rough out the elements','Address risks and rabbit holes','Write the pitch'],
   'Boundaries first, then a rough solution, then a hard look for holes, then the write-up.');}},
{part:3,src:'Chapter 2 · Steps to shaping',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which step is Ifeoma on?',['Set boundaries','Rough out elements','Risks and rabbit holes','Write the pitch'],[
   ['Ifeoma decides the waitlist is worth six weeks and pins down the real problem.',0,'Time and problem come first: setting boundaries.'],
   ['Ifeoma walks through the waitlist idea slowly, asking “what if two people grab the spot at once?”',2,'Hunting for holes is addressing risks and rabbit holes.'],
   ['Ifeoma sketches places and buttons in quick words and arrows.',1,'Sketching the solution is roughing out the elements.'],
   ['Ifeoma writes up the problem, appetite, solution and what is out, for Noor and Tomás.',3,'Packaging it for the betting table is the pitch.'],
   ['Ifeoma cuts automatic card charging from the idea because it is too risky.',2,'Cutting a risky part is how rabbit holes are handled.']]);}},
{part:3,src:'Chapter 2 · Property 3: It’s bounded',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Tap each piece until the sentence sums up shaped work.</h1>');
  L.sentence(L.card,[['Shaped work is polished,','Shaped work is rough,'],['leaving room for the team,','telling the team every step,'],['yet solved and bounded,','yet detailed and open-ended,'],['like guard rails.','like a to-do list.']],[1,0,0,0],
   [['Polished work fixes the details too early.'],['Shaped work leaves room for the team’s own judgment instead of spelling out each step.'],['Detailed is the wireframe trap, and flexible edges let scope grow.'],['Shaped work isn’t split into tasks. It sets direction and limits.']],
   'Shaped work is rough so the team has room, and solved and bounded so it acts like guard rails.');}}
  ]
});
</script>
</body>
</html>
