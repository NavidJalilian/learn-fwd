<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creativity Lives in All of Us</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0001', title:'Creativity lives in all of us', minutes:18, icon:'bulb',
  goals:['Swap the lone-genius myth for how creations really happen','Explain why creating is as natural as biology, and where ideas’ raw material comes from','Judge a creation by how it’s used, and start from your own spark'],
  parts:['No lone genius','Built in','Ingredients','Good, bad, yours'],
  read:'Read the Prologue and “Heresies,” the first chapter of Book I, for the Jerusalem walk and the taxi ride in full.',
  glossary:{
    'paradox':'Creativity paradox: great creations often have troubling side effects, and those side effects call for, and inspire, still more creations.',
    'multitudes':'Multitudes: the book’s phrase for the many, often clashing, sides inside each person. “Creators are not one thing.”',
    'hot-spot':'Hot spot: a crowded place and time where many people and ideas mix, compete and spark creations, like Florence, Harlem or Silicon Valley.'
  },
  cheatsheet:[
    'The <b>lone genius is a myth</b>. Creations pour out of crowded <b>hot spots</b> and build on centuries of small steps.',
    'Creativity is <b>biological</b>: ideas pop up at random like mutations, then the brain vets them. Most die, even for the best.',
    'Unlike nature, people can <b>choose</b> to create.',
    '<b>Big C</b> changes the world. <b>Little C</b> is the smaller work Big C’s are built on. Both count.',
    '<b>Spice Rack Theory</b>: you can only connect dots you’ve seen, felt or learned. Collect more.',
    'Creations are <b>neither good nor bad</b>: it depends on how they’re used. Side effects call for new creations (the <b>creativity paradox</b>).',
    'Creativity starts <b>personal</b>, not world-saving. <b>Creators are not one thing</b>, and creativity isn’t fame or a political side.'
  ],
  steps:[
/* ---------- PART 1: NO LONE GENIUS ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">A kids’ poster says one inventor, alone in a lab, dreamed up the smartphone overnight. Does that sound likely?</h1>');
  L.mc(L.card,['Yes, big inventions start with one mind','No, it built on many earlier inventions'],1,
   'A phone holds a camera, a tiny computer, a screen and a radio, each the work of many people over decades. This lesson is about why every creation looks like that.',
   'One person can have a key idea, but a phone is built from cameras, chips and screens that many others created first. This lesson shows why that’s true of every creation.');}},
{part:0,src:'Book I · Heresies',run(L){
  L.h(L.kick('learn','Meet Alder Commons')+'<h1 class="q">The place we’ll follow all course long</h1>'+
   L.prose('<b>Alder Commons</b> is a community makerspace in an old brick ferry warehouse in the river town of Alder Falls. It has a wood and metal shop, a music room, a café counter and an after-school program. Once a month, at <b>Idea Night</b>, anyone can pitch a project.')+
   L.list([['person','Jun Okafor, 58','Founder. A former shipyard welder with big dreams people laugh at.'],
     ['chat','Theo Brandt, 27','Runs the café, writes songs at night in the music room.'],
     ['flask','Amara Diallo, 34','Hospital lab technician and weekend tinkerer. Precise, quick to judge their own half-formed ideas.'],
     ['book','Lena Marsh, 41','Fifth-grade teacher who runs the Young Makers kids’ program.'],
     ['star','Sol Marsh, 10','Lena’s kid. Used to invent wild contraptions; lately calls their own ideas “dumb.”']],1)+
   '<p class="small" style="margin-top:10px">Some members say “I’m not the creative type.” The book’s main claim is that they’re wrong: creativity lives in all of us.</p>');
  L.done();}},
{part:0,src:'Book I · Heresies',run(L){
  L.h(L.kick('learn','The first myth')+'<h1 class="q">The lone, antisocial genius is a fable</h1>'+
   L.prose('A popular story says great creations come from isolated geniuses. The book calls this one of several “heresies” about creativity, handy shortcuts that aren’t true.')+
   L.prose('Research on whole populations points the other way. Creations seem to grow from <b>collective energy</b>: crowds of people gathering, sharing and arguing, until the ideas pour out through one person.')+
   L.flow([['people','Crowd','Many people mix, compete, argue'],['bulb','One portal','A person channels it'],['star','Creation','Credited to that person']])+
   L.prose('That’s why history has '+L.g('hot-spot','hot spots')+': Athens, Florence, Harlem, Paris, Hollywood, Silicon Valley and, the author argues, ancient Jerusalem.'));
  L.done();}},
{part:0,src:'Book I · Heresies',run(L){
  L.h(L.kick('ex','A real story from the book')+'<h1 class="q">The author walks through Jerusalem’s Old City</h1>');
  L.beats(L.card,[
   ['The stones','Late in 2019, a guide shows the author street stones laid more than 2,000 years ago by King Herod, a builder of roads, ports and forts, and also a brutal killer.'],
   ['The crowd','Herod’s Judea buzzed with about half a million people: clashing cultures, competing ideas, restless energy. That crowd, the author says, is key.'],
   ['The phone','The author pulls out an iPhone: a camera and a computer that once would have filled a room, in one hand.'],
   ['The point','Herod didn’t build Jerusalem any more than Steve Jobs built the iPhone. Both rest on centuries of small steps by many inspired people.']],
   'Big names get the credit, but every creation stands on a pile of earlier ones. And because <i>everyone</i> adds to that pile, creativity lives in each of us.');}},
{part:0,src:'Book I · Heresies',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">According to the book, why did creations pour out of places like ancient Jerusalem or Florence?</h1>');
  L.mc(L.card,['A rare genius happened to be born there','Crowds of people and ideas mixed there','Rulers ordered people to invent things'],1,
   'Hot spots gather people who share, argue and compete. The ideas build up and come out through individuals.',
   'The book’s answer is the crowd: many people and ideas mixing, competing and sharing, then pouring out through someone. Geniuses and rulers are the shorthand story.');}},
{part:0,src:'Book I · Heresies',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Myth or the book’s view?',['Myth','The book’s view'],[
   ['At Idea Night, a member says: “Jun built this whole place alone, from nothing.”',0,'Even the Commons rests on an old warehouse, members’ skills and many earlier makerspaces. Nobody creates from nothing.'],
   ['Amara’s flood sensor improves fast because makers in other towns keep swapping designs.',1,'Ideas grow where people share and mix, even online.'],
   ['“Real creativity belongs to a gifted few. The rest of us just use their stuff.”',0,'The book argues the opposite: creativity lives in each of us.'],
   ['A busy, crowded Idea Night sparks more pitches than a quiet one.',1,'That’s the hot-spot effect in miniature: more people mixing, more ideas.']]);}},

/* ---------- PART 2: BUILT IN ---------- */
{part:1,src:'Book I · Heresies',run(L){
  L.h(L.kick('learn','Creativity is biology')+'<h1 class="q">We are “creativity machines”</h1>'+
   L.prose('In nature, genes change at random. Most changes do nothing or harm the creature. A few give a small survival edge, and over ages those add up, to webbed feet or a wing. No fish crawled onto land in one sudden leap.')+
   L.prose('The book says our brains work in a closely similar way:')+
   L.flow([['bulb','Ideas pop up','Random links between ideas, like mutations','',2],['eye','Brain vets them','Can this survive? Should it?','',3],['check','A few survive','Most die in reality','',1]])+
   L.prose('One big difference: nature creates blindly. People can <b>choose</b> to create, and pursue it on purpose.'));
  L.done();}},
{part:1,src:'Book I · Heresies',run(L){
  L.h(L.kick('ex','A story the book tells')+'<h1 class="q">Even Einstein’s ideas mostly died</h1>');
  L.beats(L.card,[
   ['The spark','A creativity scholar told the author that Einstein once felt sure he’d found a theory to explain all of existence.'],
   ['The test','He shared it with a colleague.'],
   ['The verdict','The colleague found it interesting, but pointed out that under that theory the universe couldn’t exist.'],
   ['The pattern','Ideas bubble up, most die in contact with reality, and a few survive. That trial and error is how even relativity came about.']],
   'Dead ideas aren’t a sign you’re not creative. They’re how creating works, for everyone.');}},
{part:1,src:'Book I · Heresies',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">In the book’s comparison, what plays the part of a genetic mutation?</h1>');
  L.mc(L.card,['Hard work and long practice','A random new link between ideas','Approval from experts in the field'],1,
   'Ideas pop up from random connections in the brain, much as mutations pop up in genes. Then the brain vets them.',
   'The mutation is the random part: a new link between ideas that just pops up. Practice and expert approval come later, if at all.');}},
{part:1,src:'Book I · Heresies',pts:1,
 solve:async L=>{L.$('#bub').click();L.$('#vet').click();},
 run(L){
  const I=['A song about the ferry’s rusty bell','A love song in the style of a hit','Lyrics made only of café orders','A song in a key I can’t sing','A tune hummed by the river','A song rhyming “coffee” with “toffee”','A 20-minute ballad about pipes','A song about a kid who fixes clocks'],KEEP=7;
  L.h(L.kick('pr','See it happen')+'<h1 class="q">It’s late in the music room. Let Theo’s ideas bubble up, then let Theo’s brain vet them.</h1>'+
   '<div style="background:var(--soft);border-radius:16px;padding:14px;margin:8px 0;min-height:110px"><div class="small" id="bs" style="margin-bottom:8px">Nothing yet.</div><div id="bi"></div></div>'+
   '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" id="bub">'+L.ic('bulb')+'Let ideas bubble</button><button class="btn" id="vet" hidden>'+L.ic('eye')+'Vet them</button></div><div id="bq"></div>');
  L.$('#bub').onclick=function(){this.remove();L.$('#bs').innerHTML='<b>8 ideas</b> popped up, some odd, some promising';
    L.$('#bi').innerHTML=I.map((d,j)=>'<span class="chip static" id="b'+j+'">'+d+'</span>').join('');L.$('#vet').hidden=false;};
  L.$('#vet').onclick=function(){this.remove();
    I.forEach((d,j)=>{const c=L.$('#b'+j);if(j===KEEP){c.classList.add('ok');c.innerHTML=L.ic('check')+d;}else{c.style.opacity='.35';c.innerHTML=L.ic('x')+d;}});
    L.$('#bs').innerHTML='<b>1 of 8</b> survived the vetting';
    const q=L.$('#bq');q.innerHTML='<h2 class="sub">Theo feels bad about the seven dead ideas. What does the book suggest?</h2>';
    L.mc(q,['They show Theo isn’t truly creative','They’re the normal cost of creating','A real artist only gets good ideas'],1,
     'Like mutations, most ideas die. Even Einstein’s did. The dead ones are part of the process, not proof of failure.',
     'The book says most ideas die, even for the most creative people. Seven dead ideas and one survivor is the process working, not a verdict on Theo.');};}},

/* ---------- PART 3: INGREDIENTS ---------- */
{part:2,src:'Book I · Heresies',run(L){
  L.h(L.kick('learn','Big C and Little C')+'<h1 class="q">Researchers sort creations by size</h1>'+
   L.tiers([['star','Big C','Creativity that transforms the world: the wheel, antibiotics, vaccines, democracy, the Beatles’ catalog.','Rare, and remembered'],
            ['layers','Little C','Smaller experiments and steps in tech, science or art: the grains of sand that become the pillars Big C’s stand on.','Common, and crucial',true,'Where most of us start']])+
   L.prose('Most Little C creators are lost to history. But without them there is no Big C. That’s why the book tells the story of creation as a long series of inspirations, small, medium and huge, and why '+L.g('little-c','Little C')+' counts as real creativity.'));
  L.done();}},
{part:2,src:'Book I · Heresies',run(L){
  L.h(L.kick('learn','The Spice Rack Theory')+'<h1 class="q">You can only connect dots you’ve seen</h1>'+
   L.prose('People say creators “connect dots.” The author adds: they can only connect dots they have <b>seen, felt or experienced</b>. Research also finds creative people treat more of what they see as relevant, instead of quickly dismissing it.')+
   L.prose('The author’s own name for this is the '+L.g('spice-rack','Spice Rack Theory')+'. A mind stocked with spices like joy, agony, empathy, intellect and openness can mix and match more.')+
   L.list([['map','Travel','New places, new dots'],['people','New people','Other views and skills'],['flame','Emotion','Joy and pain are spices too'],['compass','Leaving your comfort zone','Experiences you’d normally skip']],2));
  L.done();}},
{part:2,src:'Book I · Heresies',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">Where did Amara’s flood-sensor idea come from?</h1>');
  L.beats(L.card,[
   ['Dot 1 · Work','At the hospital lab, Amara watches machines that beep when a level drifts out of range.'],
   ['Dot 2 · Home','Every spring the river floods, and riverside neighbors get caught off guard.'],
   ['Dot 3 · People','Online, makers in other towns share cheap circuit designs.'],
   ['The mix','Amara connects the three: a cheap device that “beeps” when the river rises.'],
   ['The lesson','None of the dots was new. The idea came from having all three on Amara’s spice rack at once.']],
   'More dots in, more possible links out. Someone who had never seen a lab monitor might not have made this one.');}},
{part:2,src:'Book I · Heresies',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Lena wants Young Makers to come up with more original projects. What does the Spice Rack Theory suggest?</h1>');
  L.mc(L.card,['Give the kids stricter project rules','Have the kids copy one famous inventor','Expose the kids to more places and people'],2,
   'More experiences mean more dots the kids can later connect in new ways.',
   'The theory is about ingredients: kids can only connect dots they’ve met. New places, people and experiences stock the rack; rules and copying don’t.');}},
{part:2,src:'Book I · Heresies',pts:5,run(L){
  L.h(L.kick('pr','Big or little?')+'<h1 class="q">Sort each creation.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Big C','Little C'],[
   ['Antibiotics',0,'Antibiotics changed medicine worldwide. The book lists them as Big C.'],
   ['Theo’s new café sandwich that regulars keep ordering',1,'Others notice and use it, but it doesn’t change the world.'],
   ['The wheel',0,'It transformed how humans live. A classic Big C.'],
   ['Amara’s tweak to a sensor design, adopted by makers in two towns',1,'A useful step others build on: a grain of sand, not a pillar.'],
   ['Democracy',0,'The book names democracy as a world-changing Big C.']],
   'Big C’s are rare. Little C’s are everywhere, and Big C’s are built on them.');}},
{part:2,src:'Book I · Heresies',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Tap each piece until the sentence gives Amara the book’s advice.</h1>');
  L.sentence(L.card,[['To get more ideas, Amara should'],['think harder, alone','see, feel and learn more','study one genius'],['because creators can only connect'],['dots experts approve','dots they’ve met','the newest dots']],[0,1,0,1],
   [[],['Thinking harder uses the same few dots. New ideas need new ingredients.','One genius is a single spice. The rack needs variety.'],[],['Approval isn’t the limit. Experience is.','Old dots work fine. What matters is having met them.']],
   'That’s the Spice Rack Theory: stock up on experiences, and you have more to mix.');}},

/* ---------- PART 4: GOOD, BAD, YOURS ---------- */
{part:3,src:'Book I · Heresies',run(L){
  L.h(L.kick('learn','Another myth')+'<h1 class="q">Creativity isn’t automatically good</h1>'+
   L.prose('We tend to treat “creative” as praise. The book says creativity is neither moral nor immoral in itself. What makes a creation good or harmful is the values of its creator and, even more, <b>how it gets used</b>.')+
   L.prose('Creators usually can’t predict how their creations will be used, and the more complex the world gets, the harder it is to guess.')+
   L.note('Many creations we now see as evil, the book notes, once seemed like good ideas to someone.','alert'));
  L.done();}},
{part:3,src:'Book I · Heresies',run(L){
  L.h(L.kick('ex','A real story from the book')+'<h1 class="q">A taxi ride outside Jerusalem’s walls</h1>');
  L.beats(L.card,[
   ['The ride','The author hails a taxi. The driver speeds, swerves across lanes and honks.'],
   ['The screen','Then he starts poking at the phone on his dashboard. Not a map: a friend’s new shipment of shirts. He’s shopping while driving.'],
   ['The stack','Cars: amazing, and deadly. Car phones: amazing, and distracting. Online shopping: amazing, unless you’re weaving through traffic.'],
   ['The twist','Out the window, the author sees a nicotine vape pen, made to replace cigarettes, yet some added chemicals had made some vapes deadly.'],
   ['The paradox','Great creations have side effects, and those side effects call for new creations, like seat belts after car crashes.']],
   'The book calls this the '+L.g('paradox','creativity paradox')+'. Same creation, different uses, very different results.');}},
{part:3,src:'Book I · Heresies',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">A member uses the Commons’ new laser cutter to copy a local shop’s product and sell it cheaper. Is the laser cutter a bad creation?</h1>');
  L.mc(L.card,['No, the harm comes from how it’s used','Yes, any tool that enables harm is bad'],0,
   'The same cutter makes repair parts and kids’ projects. Its moral weight comes from the use, not the tool.',
   'By that rule cars and phones would be bad too. The book says creations are neither good nor bad; it depends on use.');}},
{part:3,src:'Book I · Heresies',run(L){
  L.h(L.kick('learn','Where creativity starts')+'<h1 class="q">Not to save the world. Not at first.</h1>'+
   L.prose('It’s tempting to see creativity as a tool for fixing the world. The book says that’s one more myth. Creativity starts <b>personal</b>: an idea pops up and thrills you. “Necessity is the mother of invention” is only partly right; the book sees necessity as part of something bigger, <b>authenticity</b>.')+
   L.quote('People don’t believe in their own light.','guitarist Carlos Santana, to the author')+
   L.list([['layers','Creators are not one thing','We all hold '+L.g('multitudes','multitudes')+'. Singer Rhiannon Giddens grew up amid contradictions (Black and white, love and anger, elite schools and rough streets) and draws on all of them.'],
     ['star','It isn’t fame or fortune','Fame fades even for legends. Creating is part of our nature.'],
     ['scale','It belongs to no party','Creators can hold any politics. Creativity itself isn’t partisan.']],3));
  L.done();}},
{part:3,src:'Book I · Heresies',pts:1,run(L){
  L.h(L.kick('pr','Apply it')+'<h1 class="q">Amara says: “I follow lab protocols all day. I’m a rules person, not a creative one.” What would the book say?</h1>');
  L.mc(L.card,['Fair: creators have a creative personality','True, but Amara can borrow others’ ideas','Creators are not one thing; both fit'],2,
   'Amara can be precise at work and inventive at the workbench. Those multitudes are raw material, not a contradiction.',
   'The book says creators are not one thing. Being a rules person at the lab doesn’t rule out creating; it adds to Amara’s mix.');}},
{part:3,src:'Book I · Heresies',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Does it fit the book?',['Fits the book','Doesn’t fit'],[
   ['Amara’s sensor alarms wake whole streets at night, so Amara designs a gentler alert.',0,'A creation’s side effect calls for a new creation: the creativity paradox.'],
   ['“A project only counts as creative if it helps the whole town.”',1,'The book says creativity starts personal. It doesn’t need to save anyone at first.'],
   ['Sol builds a marble run just because the idea is fun and won’t leave their head.',0,'Personal spark is where creativity begins.'],
   ['“Idea Night should only welcome pitches from members who share our politics.”',1,'Creativity belongs to no party. Ideas can come from anyone.']]);}},
{part:3,src:'Book I · Heresies',pts:1,run(L){
  L.h(L.kick('pr','Apply it')+'<h1 class="q">A label scout liked one of Theo’s songs. Theo says: “Until I get signed, I’m not a real creator.” What does the book say?</h1>');
  L.mc(L.card,['Creating isn’t the same as fame','Signing proves Theo is creative','Theo needs a Big C hit to count'],0,
   'Theo is creating every night in the music room. A record deal is about success, which the book treats as a separate, fleeting thing.',
   'The book separates creativity from fame and fortune. Theo creates every night, deal or no deal, and Little C counts.');}}
  ]
});
</script>
</body>
</html>
