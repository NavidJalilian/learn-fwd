<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Ideas That Honor the Old</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0012', title:'New ideas that honor the old', minutes:19, icon:'book',
  goals:['Explain why the most lasting new ideas are novel yet familiar','Escape an “A or B” bind by finding a new story that gives you both','Spot when a rigid worldview is blocking new ideas'],
  parts:['The bind','New stories','Step by step','Worldview'],
  read:'Read “God” in Book II for Scott Cormode’s view of the Reformation, the full Marbury v. Madison story and the study on belief and creativity.',
  glossary:{
    'new-story':'New story: the book’s phrase for reinterpreting something people already accept, so real change feels like a truer reading of the past rather than a break from it.',
    'worldview':'Worldview: your fixed picture of how the world is and should be. The harder and more certain it is, the less room it leaves for ideas that don’t fit.'
  },
  cheatsheet:[
    'The chapter uses religion as a <b>lens on innovation</b>, not a statement of faith.',
    'Martin Luther couldn’t discard the Bible, so he <b>reinterpreted</b> it: the text was right, the church’s reading was wrong. He gave an old product a <b>new story</b>.',
    'Lasting ideas <b>connect past to present</b>. Creativity often happens within confines, not by burning the boats.',
    'Small C’s like the kosher smartphone let people embrace the new <b>without abandoning</b> their rules.',
    'Trapped between A and B? Look for the new story that gives you <b>A and B</b> (John Marshall and judicial review).',
    'Big change can come through a <b>chain of Small C’s</b>, each close enough to the past to be accepted (Thurgood Marshall’s path to Brown v. Board).',
    'A study links strong belief to lower creativity scores. Richtel reads it as being about <b>rigid worldviews</b>, not faith itself.',
    'What survives in culture and in biology balances <b>novel and familiar</b>.'
  ],
  steps:[
/* ---------- PART 1: THE BIND ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Jun Okafor is pitching the ferry workshop to the board again. Which pitch is more likely to win votes?</h1>');
  L.mc(L.card,['“The Commons’ own repair shop, taken onto the river”','“A bold new venture unlike anything we’ve ever done”'],0,
   'The first pitch ties a new idea to something members already love. This lesson shows why that’s how many of history’s biggest ideas spread.',
   'Bold sounds exciting, but it asks members to leave everything familiar. Tying the ferry to the repair shop they already love makes the new idea easier to accept.');}},
{part:0,src:'Book II · God',run(L){
  L.h(L.kick('learn','An unusual lens')+'<h1 class="q">What religion can teach about innovation</h1>'+
   L.prose('Richtel, who calls himself agnostic, says this chapter isn’t about faith. Religious texts are among the most influential creations ever, so he asks what they teach about <b>how new ideas take hold</b>.')+
   L.prose('His guide is Scott Cormode, a leadership professor at a seminary, who links the Reformation to the personal computer.')+
   L.flow([['shield','Around 1500','The church holds a chaotic Europe together'],['alert','The flaw','Forgiveness could be bought (“indulgences”)'],['people','The demand','People feel the rich get to heaven first']])+
   L.prose('Think of religion as a product, the book says, and this one wasn’t meeting its users’ needs.'));
  L.done();}},
{part:0,src:'Book II · God',run(L){
  L.h(L.kick('learn','The bind')+'<h1 class="q">Change everything without seeming to change anything</h1>'+
   L.prose('A monk named Martin Luther felt that dissatisfaction too. But he faced a hard problem. People believed the Bible was sacred and essential to their souls. He couldn’t ask them to throw it out.')+
   L.lanes([['flame','The myth','Big C creativity means “burning the boats”: abandon the past to reach the future.',3],['tree','The reality','We are tied to the past. The new idea has to grow out of it.',2]])+
   L.prose('Cormode says this challenge is common in creative leadership: make deep change while keeping what people already trust.'));
  L.done();}},
{part:0,src:'Book II · God',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">Luther re-creates the past</h1>');
  L.beats(L.card,[
   ['The setup','Priests were seen as the go-betweens between God and people. They interpreted the Bible.'],
   ['The insight','Luther couldn’t attack the Bible, but he could attack how it had been <i>read</i>. The text was right; the church had misunderstood it.'],
   ['The passage','He re-read a passage in the Letter to the Romans to mean that people are saved by grace, as a free gift. No priest needed.'],
   ['The reaction','Cormode says it’s one of those moments when someone says something and you realize nobody had thought of it that way.'],
   ['The result','Luther gave the old religion a <b>'+L.g('new-story','new story')+'</b>, and a reformed version became one of the world’s most embraced “products.”']],
   'Luther didn’t replace the foundation. He reinterpreted it, so a big change felt like a truer version of the familiar.');}},
{part:0,src:'Book II · God',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">What was Luther’s key creative move, in the book’s telling?</h1>');
  L.mc(L.card,['He wrote a brand-new holy book of his own','He kept the text and changed how it was read','He convinced priests to lower their prices'],1,
   'He kept what people trusted, the Bible, and changed its interpretation. That’s the new story.',
   'He didn’t replace the Bible or bargain with priests. He kept the text and argued it had been misread, which removed the priests’ power.');}},
{part:0,src:'Book II · God',pts:1,
 solve:async L=>{const c=L.$('#vv').children;c[0].click();c[1].click();c[2].click();},
 run(L){
  const V=[['Paint it','Repaint the ferry and keep it tied up as a quiet lounge.',95,10],
           ['Burn the boats','Close the warehouse and turn the Commons into a river-cruise company.',10,95],
           ['Repair shop afloat','Take the Commons’ repair shop to river towns, crewed by ex-shipyard members.',75,70]];const seen=new Set();
  L.h(L.kick('pr','Toggle and compare')+'<h1 class="q">Jun drafts three versions of the ferry pitch. Try each and watch the two bars.</h1><div id="vv"></div>'+
   '<div style="background:var(--soft);border-radius:16px;padding:14px;margin:8px 0"><div class="small" id="vd" style="margin-bottom:8px">Choose a version above.</div>'+
   '<div class="meterrow"><div class="lb">Feels familiar to members</div><div class="meter"><div id="mf" style="width:0;background:var(--h2)"></div></div></div>'+
   '<div class="meterrow"><div class="lb">Brings something new</div><div class="meter"><div id="mn" style="width:0;background:var(--h3)"></div></div></div></div><div id="vq"></div>');
  V.forEach((v,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=v[0];b.onclick=()=>{[...L.$('#vv').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(j);
    L.$('#vd').textContent=v[1];L.$('#mf').style.width=v[2]+'%';L.$('#mn').style.width=v[3]+'%';
    if(seen.size===3&&!L.$('#vq').innerHTML){const q=L.$('#vq');q.innerHTML='<h2 class="sub">Which version follows the book’s pattern for lasting ideas?</h2>';
      L.mc(q,['Paint it','Burn the boats','Repair shop afloat'],2,'Like Luther’s reading of the Bible, it keeps what members trust (the repair shop, the shipyard roots) and adds something truly new.','One version is barely new, the other throws away everything familiar. The repair shop afloat is the one that is both novel and familiar.');}};L.$('#vv').appendChild(b);});}},

/* ---------- PART 2: NEW STORIES ---------- */
{part:1,src:'Book II · God',run(L){
  L.h(L.kick('learn','The same pattern, again and again')+'<h1 class="q">New ideas stitched from accepted material</h1>'+
   L.prose('In Cormode’s reading, other religious founders followed the same pattern:')+
   L.list([['book','Jesus','Didn’t scrap the Jewish scriptures. He reinterpreted them, drawing on the story of the garden from the first pages of Genesis, and offered a new path open to everyone.'],
     ['map','Joseph Smith','On the crowded religious frontier of 1800s America, he presented new scripture as equal to the old. Consistent enough to keep believers, new enough to win others, and offering stability amid chaos.']],2)+
   L.note('The chapter’s main point: the most powerful new ideas often <b>connect the past to the present</b>. They don’t have to break the mold. Creativity often happens within limits.','bulb'));
  L.done();}},
{part:1,src:'Book II · God',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">According to the book, why might Joseph Smith have failed if he’d broken completely with older beliefs?</h1>');
  L.mc(L.card,['He would have lost the people tied to the old ideas','The frontier had no interest in religion at all'],0,
   'He needed to stay close enough to existing beliefs not to lose followers, while being new enough to attract others.',
   'The frontier was actually full of competing preachers. The risk was losing people who were attached to the old beliefs.');}},
{part:1,src:'Book II · God',run(L){
  L.h(L.kick('learn','Small C bridges')+'<h1 class="q">Having A and B</h1>'+
   L.prose('Smaller examples follow the pattern too. Some Orthodox Jewish communities needed phones to live in the modern economy but objected to things like web browsers. The answer was the <b>kosher smartphone</b>: a phone stripped of most apps.')+
   L.prose('Another rule bans manual work on the Sabbath, including flipping switches. The fix: lights on automatic timers. These '+L.g('little-c','Little C’s')+' (the book says “Small C’s”) let people embrace the new without abandoning their rules.')+
   L.quote('Then leaders come along and say you can have A and B.','Scott Cormode'));
  L.done();}},
{part:1,src:'Book II · God',pts:5,run(L){
  L.h(L.kick('pr','Which kind of change?')+'<h1 class="q">Sort each Alder Commons proposal.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Burns the boats','Novel yet familiar','Nothing new'],[
   ['Replace Idea Night with an app where members vote on pitches from home',0,'It throws out a gathering members love. Expect resistance.'],
   ['Keep Idea Night, and stream it so homebound members can pitch too',1,'The beloved event stays; the reach is new.'],
   ['Hold Idea Night exactly as it has always been run',2,'Safe, but nothing changes.'],
   ['Amara’s sensors flash the same color marks volunteers already paint on the levee',1,'A new tool that speaks a language people already trust.'],
   ['Sell the wood shop tools and turn the space into a coding lab',0,'Abandoning the shop’s past risks losing the members who built it.']],
   'Lasting change keeps one foot in what people trust and puts the other somewhere new.');}},
{part:1,src:'Book II · God',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Lena feels trapped: keep the Young Makers safety rules, or let the kids try wild ideas? Tap each piece until Lena has both.</h1>');
  L.sentence(L.card,[['Drop','Keep'],['every safety rule','the dull projects'],['and add','and ban'],['a weekly “wild idea” hour with safe materials.','any project that looks silly.']],[1,0,0,0],
   [['Dropping the rules gives up A to get B. The goal is both.'],['Keeping dull projects isn’t the A Lena cares about. Safety is.'],['Banning things keeps A but loses B.'],['Banning “silly” projects is the old trap, not a way out of it.']],
   'Like the kosher smartphone, the rule stays and the new thing fits inside it. Lena gets A and B.');}},

/* ---------- PART 3: STEP BY STEP ---------- */
{part:2,src:'Book II · God',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">The judge who found for everybody</h1>');
  L.beats(L.card,[
   ['1801','Before leaving office, President John Adams appointed a batch of judges, including William Marbury. Under the new president, Thomas Jefferson, Secretary of State James Madison wouldn’t move the appointment forward. Marbury sued.'],
   ['The bind','Chief Justice John Marshall was stuck. Rule against Jefferson, and the president could ignore the order. Rule against Marbury, and the court blesses a partisan purge. Either way, the court looks like a political tool.'],
   ['Point one','Marshall wrote that Marbury had a right to the job. The Adams side was satisfied.'],
   ['Point two','But the Supreme Court lacked the authority, under the law in question, to force it. The Jefferson side was satisfied.'],
   ['The twist','In saying what the court <i>couldn’t</i> do, Marshall established that it could review such laws at all: “judicial review,” one of the most important ideas in law.']],
   'Marshall escaped the A-or-B bind with a new story, one that let the court choose between A and B ever after.');}},
{part:2,src:'Book II · God',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">How did John Marshall get out of his bind?</h1>');
  L.mc(L.card,['He sided firmly with the more popular president','He delayed the ruling until tempers cooled','He gave each side something and built a new power'],2,
   'Each camp got part of what it wanted, and the court gained a new role. A and B, plus a new story.',
   'Picking a side was exactly the trap, and the book doesn’t describe a delay. Marshall gave each camp something and, in doing so, created judicial review.');}},
{part:2,src:'Book II · God',run(L){
  L.h(L.kick('learn','A chain of Small C’s')+'<h1 class="q">Big change can arrive one familiar step at a time</h1>'+
   L.prose('In 1896 the Supreme Court approved racial segregation as long as facilities were “equal.” Lawyer Thurgood Marshall didn’t attack that idea head-on at first. He attacked the <i>equal</i> part: the Black law schools on offer were nowhere near equal.')+
   L.flow([['scale','1930s','Law school wins in Maryland and Missouri',''],['scale','1950','Texas and Oklahoma: separate wasn’t equal',''],['star','1954','Brown v. Board: separate schools are unequal','',1]])+
   L.prose('Richtel is blunt that the early steps were nowhere near enough. But each built on precedent, staying close enough to the past to be accepted, until years of Small C’s added up to a giant change.'));
  L.done();}},
{part:2,src:'Book II · God',pts:1,run(L){
  L.h(L.kick('pr','Put it in order')+'<h1 class="q">The board still balks at the ferry. Jun plans small steps. Order them from closest to the familiar to the most new.</h1>');
  L.order(L.card,['Hold a repair day on the docked ferry','Fix bikes on deck at the riverside market','Sail to one nearby town for a weekend','Tour three river towns every summer'],
   'Each step stays close to what members already accept, then stretches a little further, like the legal steps that led to Brown v. Board.',['Most familiar','','','Most new']);}},
{part:2,src:'Book II · God',pts:1,run(L){
  L.h(L.kick('pr','Find the third option')+'<h1 class="q">With the city grant at risk, Ruth tells the board: “Either we protect the budget, or we fund new Idea Night projects.” What would Cormode suggest?</h1>');
  L.mc(L.card,['Pick the budget, since safety comes first','Look for a story that gives them both','Pick new projects and hope the grant holds'],1,
   'For example: fund small pilots that could bring in new members or donations. That protects the budget <i>and</i> lets ideas in.',
   'Choosing either side is the trap Cormode describes. Leaders look for the new story that gives you A and B.');}},

/* ---------- PART 4: WORLDVIEW ---------- */
{part:3,src:'Book II · God',run(L){
  L.h(L.kick('learn','A hard finding')+'<h1 class="q">Does strong belief limit creativity?</h1>'+
   L.prose('Richtel expects this to be the most debated part of the book. Jack Goncalo, the researcher who linked creativity with disgust, co-wrote six studies, published in 2021. States with more strongly religious people produced fewer patents, even after accounting for income and education. In lab tests, nonreligious people scored higher on idea-generating tasks.')+
   L.list([['Followership','Seeing yourself as someone who carries out orders runs against independent thought.'],['The established view','It can favor existing ways of seeing over ideas that challenge them.'],['Certainty','Feeling sure is comforting, but creating means accepting that contradictory views may be valid.']],3)+
   L.prose('Richtel’s reading: it’s about a rigid <b>'+L.g('worldview','worldview')+'</b>, not faith. Believers like Galileo and Max Planck were highly creative. The authors suggest simply not thinking about God and doing creative work at the same moment.'));
  L.done();}},
{part:3,src:'Book II · God',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">What does Richtel conclude from the study?</h1>');
  L.mc(L.card,['A very rigid worldview, of any kind, blocks ideas','Religious people simply cannot be creative'],0,
   'He reframes it as worldview. Anyone with a hard, certain picture of the world has less room for ideas that don’t fit.',
   'Neither he nor the authors say that. Many believers were great creators. The issue is a rigid worldview, which anyone can hold.');}},
{part:3,src:'Book II · God',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Rigid or open worldview?',['Rigid','Open'],[
   ['A board member insists a ferry is only for carrying people, so the workshop idea can’t be discussed.',0,'A fixed picture of what ferries are rules the idea out before anyone looks.'],
   ['Amara, a stickler for lab rules, asks whether the hospital’s fridge alarm logic could warn about floods.',1,'Following rules at work doesn’t mean a closed mind. Amara lets a familiar idea travel somewhere new.'],
   ['Lena says “that’s not how projects are done here” before Sol finishes describing an idea.',0,'Certainty shuts the idea down before it’s heard.'],
   ['Ruth admits the board may be wrong about which pitches are risky and invites two to come back.',1,'Accepting that other views may be valid is the opposite of certainty.']]);}},
{part:3,src:'Book II · God',run(L){
  L.h(L.kick('learn','The big takeaway')+'<h1 class="q">Novel enough to matter, familiar enough to fit</h1>'+
   L.prose('All creations exist in a context. Richtel’s takeaway: the ideas that stick strike a balance between being <b>new</b> and being <b>relevant</b>.')+
   L.tiers([['flame','Too new','Nobody can connect to it. It’s rejected or ignored.'],['star','Novel yet familiar','New in key ways, close enough to be adopted.','Religion, law, biology',true,'Sticks'],['lock','Too familiar','Accepted, but nothing changes.']])+
   L.prose('Biology works the same way: a new species survives only if it has enough in common with what already exists. That echoes the '+L.g('edge-of-chaos','edge of chaos')+'. And it sets up the next lesson: COVID-19 was new in key ways, yet familiar enough to our bodies to spread.'));
  L.done();}},
{part:3,src:'Book II · God',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Will it stick?',['Too new','Novel yet familiar','Too familiar'],[
   ['Theo turns their folk set into a 40-minute experimental noise piece for the café regulars.',0,'Nothing for the regulars to hold onto. It’s likely to be ignored.'],
   ['Theo writes new songs about the shipyard, set to the folk tunes the town grew up with.',1,'Fresh stories in a sound people already love.'],
   ['Young Makers repeat last year’s birdhouse project for the showcase.',2,'Safe, but nothing new for anyone.'],
   ['The Commons offers repair classes online for members who can’t come in.',1,'The classes are familiar; the format reaches new people.'],
   ['Jun asks the board to replace all of the Commons’ programs with ferry trips.',0,'It throws away everything members value at once.']]);}}
  ]
});
</script>
</body>
</html>
