<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Becoming an Authentic Creator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0005', title:'Becoming an authentic creator', minutes:18, icon:'person',
  goals:['Explain how a mix of rules, freedom and hardship can become a creator’s raw material','Tell a person with creative tools from an authentic creator','Notice the inner signals that your own voice is trying to get through'],
  parts:['Raw material','Making sense','Tools or voice','Hearing it'],
  read:'Read “Creator Takes Shape” in Book I for Rhiannon Giddens’s full story, told in her and her sister’s own words.',
  glossary:{
    'code-switching':'Code-switching: changing how you talk and act as you move between different groups or worlds.',
    'creative-tools':'Person with creative tools: someone with real creative skill who uses it mostly to meet other people’s expectations. Their work can be creative without being authentic.'
  },
  cheatsheet:[
    'Giddens grew up with <b>opposite messages</b>: rigid rules born of fear, and parents who gave <b>permission and celebration</b>.',
    '<b>Boredom</b> pushed her and her sister to invent games, and they credit it with building their imagination.',
    'A messy mix of worlds is <b>raw material</b>. Understanding her family, instead of fighting it, helped her parts form one whole.',
    'Skill and momentum aren’t a choice. Like Yo-Yo Ma, a creator may have to <b>choose</b> their craft on purpose.',
    'A <b>person with creative tools</b> and an <b>authentic creator</b> can look the same from outside. The difference is felt by the creator.',
    'Warning signs: feeling like a mimic or approval-seeker, misery, even the <b>body</b> saying something is off.',
    'A clue to your voice: a story or idea that <b>won’t go away</b>.',
    'Outside success can <b>drown out</b> the inner voice. Hearing it amid the noise can be wrenching.'
  ],
  steps:[
/* ---------- PART 1: RAW MATERIAL ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Two singers get the same applause at the Alder Commons café. One plays what the crowd expects. The other plays what truly moves them. Can you tell which is which just by watching?</h1>');
  L.mc(L.card,['Not always, from the outside','Yes, it’s always obvious'],0,
   'Right. From the outside the two can look almost the same. This lesson is about the difference the creator feels inside.',
   'It’s often hard to tell. Both can be skilled and both can be creative. This lesson is about the difference the creator feels inside.');}},
{part:0,src:'Book I · Creator Takes Shape',run(L){
  L.h(L.kick('learn','A childhood of opposite messages')+'<h1 class="q">Rhiannon Giddens grew up hearing “stay in line” and “take the risk” at once</h1>'+
   L.prose('Giddens is a singer-songwriter from North Carolina. She and her older sister, Lalenja Harrington, grew up between two very different sets of messages.')+
   L.lanes([['lock','Rules born of fear','Their mother’s parents carried the wounds of slavery and racism. They had learned that Black people who stood out could be punished, even killed. So the rules were strict: stay well within the lines. They were loving, but rigid, and they came by those rules honestly.',4],
            ['star','Permission and celebration','Their parents, a Black mother and a white father, were rebels in their own right. They urged the girls to try things and take risks, even when it felt uncomfortable. Their white grandmother loved the family without conditions.',2]])+
   L.prose('The book suggests that with only the strict rules, it isn’t clear the sisters’ creativity would have come through. The freer influences may have helped them past the slump in childhood creativity.'));
  L.done();}},
{part:0,src:'Book I · Creator Takes Shape',run(L){
  L.h(L.kick('learn','Boredom and many worlds')+'<h1 class="q">Freedom came from empty afternoons and from moving between worlds</h1>'+
   L.list([['leaf','Sent outside, bored','At their grandparents’ house they were told to stay out until dinner. Behind the house grew a giant oak. With nothing to do, the sisters pretended the ground around it was water full of sharks, and built landing pads of dead leaves. They credit that boredom with building their imagination.'],
     ['layers','Moving between worlds','They lived at times near poverty, yet did well in school and ended up at strong schools. One year Giddens ate lunch with the white girls for half the year and the Black girls for the other half. She called it '+L.g('code-switching','code-switching')+'.'],
     ['pencil','Her own corners','She read science fiction while walking the halls and drew horses for hours, dreaming of being a Disney animator.']],1)+
   '<p class="small" style="margin-top:10px">Rules and freedom, fear and belonging, hardship and opportunity: the book presents this whole mix as what she would later draw from.</p>');
  L.done();}},
{part:0,src:'Book I · Creator Takes Shape',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Lena fills every minute of Young Makers with planned tasks. “Bored kids just make trouble,” Lena says. What does the Giddens story suggest?</h1>');
  L.mc(L.card,['Planned tasks are the surest way to spark ideas','Some empty, unplanned time can feed imagination'],1,
   'The sisters credit long, bored afternoons under the oak with building their imagination.',
   'The sisters’ imagination grew when they had nothing planned at all. Boredom pushed them to invent their own games.');}},
{part:0,src:'Book I · Creator Takes Shape',pts:5,run(L){
  L.h(L.kick('pr','Two kinds of influence')+'<h1 class="q">Here is a week in Sol’s life. Which things push Sol to stay in line, and which free Sol to think?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Stay in line','Think freely'],[
   ['Lena: “No building until your plan is approved.”',0,'A rule like this teaches Sol to wait for permission before trying anything.'],
   ['A rainy Saturday with nothing scheduled and a box of scrap wood',1,'Like the sisters under the oak, empty time pushes Sol to invent.'],
   ['Sol’s grandparent: “Try it, even if it looks odd. Then show me.”',1,'That’s permission and celebration, the message Giddens got from her parents.'],
   ['A classmate laughs whenever a project looks different',0,'Mockery teaches Sol that standing out is risky.'],
   ['Jun lets the kids poke around the old ferry and invent uses for it',1,'Open, unjudged exploring frees Sol to think.']],
   'Giddens got both kinds of influence. The book suggests the freeing ones may be what carried her and her sister past the childhood slump.');}},

/* ---------- PART 2: MAKING SENSE ---------- */
{part:1,src:'Book I · Creator Takes Shape',run(L){
  L.h(L.kick('learn','From mess to raw material')+'<h1 class="q">The hard parts weren’t something to throw away</h1>'+
   L.prose('Middle school was a hard, sad time for Giddens. Her sister, her protector, had left for college, and home was tense. Then her grades won her a place at an elite math-and-science boarding school, another slice of society. Did she know all these inputs were stretching her creative muscles? The book’s answer: not really.')+
   L.flow([['people','Choral camp','Her first solo. Singing felt good, but it was a tool to please people, not yet creating.','',1],
           ['book','Reading history','Her mother’s and grandparents’ behavior began to make sense. It was material to understand and draw from.','',2],
           ['check','Acceptance','She stopped being angry at her mom, and embraced the good she was given too.','',3]])+
   L.prose('The book calls this accepting her inner <b>multitudes</b>. The less she fought the parts of herself, the more they formed one whole: a creator.'));
  L.done();}},
{part:1,src:'Book I · Creator Takes Shape',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">Talent carried Giddens a long way, but not by her own choice</h1>');
  L.beats(L.card,[
   ['Music school','She got into Oberlin, an elite music school, on raw talent. She was overwhelmed: unlike the others, she couldn’t read music and had no formal training.'],
   ['Momentum','She pushed herself because it seemed like what she should do, taking every music job she could find. She was carried along, not choosing.'],
   ['Signs of doubt','Her uncertainty leaked out. Once she showed up to an audition missing a shoe. After school she burned out. She says she never felt truly creative.'],
   ['Yo-Yo Ma','Years later the great cellist told her he had played since he was tiny, simply because that’s what he did. In his twenties and thirties he realized he had to <b>choose</b> to be a cellist. After that, he was much happier.']],
   'Skill and habit can carry you a long way without being a choice. Choosing your craft on purpose is part of becoming a creator.');}},
{part:1,src:'Book I · Creator Takes Shape',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Theo has played guitar since age eight. “It’s just what I do,” Theo shrugs. What does Yo-Yo Ma’s story suggest?</h1>');
  L.mc(L.card,['Theo can choose music on purpose','Theo should quit, since it’s habit'],0,
   'Playing out of habit isn’t a reason to stop. Yo-Yo Ma found more happiness once he actively chose the cello.',
   'Yo-Yo Ma didn’t quit. He kept playing but chose the cello on purpose, and was happier for it.');}},
{part:1,src:'Book I · Creator Takes Shape',pts:1,
 solve:async L=>{const g=L.$('#tg').children;g[0].click();g[1].click();},
 run(L){
  const M=[['Hide the hard parts',['Another love song in the style of the radio hits','A polished cover of this summer’s big song','A cheerful tune about nothing in particular']],
           ['Draw from all of it',['The night the shipyard went quiet','Scholarship kid with two accents','Long, bored summers on the riverbank']]];const seen=new Set();
  L.h(L.kick('pr','Toggle and compare')+L.note('Theo grew up in Alder Falls. Theo’s parent welded at the shipyard until it closed, and money got tight. A scholarship sent Theo to a fancy music school two towns over, where Theo never felt they fit. Summers were long and empty by the river.','person')+
   '<h1 class="q" style="margin-top:16px">Theo wants new song ideas. Try both ways of using that past and see what comes out.</h1><div id="tg"></div>'+
   '<div style="background:var(--soft);border-radius:16px;padding:14px;margin:8px 0 6px;min-height:110px"><div class="small" id="tc" style="margin-bottom:8px">Choose an approach above.</div><div id="tl"></div></div><div id="tq"></div>');
  M.forEach((m,j)=>{const b=document.createElement('button');b.className='chip';b.innerHTML=L.ic(j?'layers':'lock')+m[0];
    b.onclick=()=>{[...L.$('#tg').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(j);
      L.$('#tc').innerHTML=j?'<b>Ideas only Theo could write</b>':'<b>Ideas anyone could write</b>';
      L.$('#tl').innerHTML=m[1].map(x=>'<span class="chip static'+(j?' ok':'')+'">'+L.ic(j?'star':'x')+x+'</span>').join('');
      if(seen.size===2&&!L.$('#tq').innerHTML){const q=L.$('#tq');q.innerHTML='<h2 class="sub">Which approach matches what Giddens learned?</h2>';
        L.mc(q,['Leave the painful parts out','Draw from all of it'],1,
         'Giddens found her family’s hard history was material to understand and draw from, not to throw away.',
         'Hiding the hard parts leaves only ideas anyone could have. Giddens grew as a creator once she accepted all of her past as material.');}};
    L.$('#tg').appendChild(b);});}},

/* ---------- PART 3: TOOLS OR VOICE ---------- */
{part:2,src:'Book I · Creator Takes Shape',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">Living the dream, and wanting to cry</h1>');
  L.beats(L.card,[
   ['The band','Giddens formed the Carolina Chocolate Drops. Their first album was mostly old folk and fiddle songs. Their third album won a GRAMMY in 2010.'],
   ['Success','They were working musicians, which is very hard to pull off. From outside, she looked like she was living the dream.'],
   ['Misery','Inside, she was often miserable. When it was time to tour again she wanted to cry. She told herself she was good at it, so she was supposed to do it.'],
   ['The body','She got physically sick and became depressed. Her lesson: the body tells you what’s wrong.'],
   ['The truth','She felt she had buried how she really wanted to tell stories, for the band’s shared, commercial vision. She realized she was doing it for the money.']],
   'From outside she looked like an authentic creator. Inside, she wasn’t creating in a way true to herself, and her mind and body both said so.');}},
{part:2,src:'Book I · Creator Takes Shape',run(L){
  L.h(L.kick('learn','Two kinds of creator')+'<h1 class="q">Creative tools are not the same as an authentic voice</h1>'+
   L.prose('The author kept hearing the same distinction from creators and the scholars who study them.')+
   L.lanes([['pencil','Person with creative tools','Has real skill and makes creative work, but mostly to fit someone else’s tune. Often feels like a mimic or a grade-chaser seeking approval.',4],
            ['person','Authentic creator','Makes work that comes from their own voice. The work may look much the same, but it feels true to the person making it.',2]])+
   L.prose('From outside, the gap can look tiny. For the creator, it isn’t. Sooner or later a more personal voice pushes to get out, and the creator faces a choice: <b>outside approval, or freedom</b>. In the end, the book says, this is a story about happiness.')+
   L.note('Giddens adds that our culture doesn’t value self-knowledge much. Many people look outward for what they need to find inward, and stay soothed by other people’s creations.','eye'));
  L.done();}},
{part:2,src:'Book I · Creator Takes Shape',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">What best marks someone as a '+L.g('creative-tools','person with creative tools')+' rather than an '+L.g('authentic','authentic creator')+'?</h1>');
  L.mc(L.card,['Their work isn’t creative at all','They create mainly to please others','They have less skill than real artists'],1,
   'Both can make skilled, creative work. The difference is whose voice the work comes from.',
   'Their work can be creative and highly skilled. What sets them apart is that they create to fit someone else’s tune.');}},
{part:2,src:'Book I · Creator Takes Shape',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Creative tools or authentic voice?',['Creative tools only','Authentic voice'],[
   ['Theo copies the formula of the song the scout liked, hoping it gets a deal.',0,'Theo is skilled, but the target is someone else’s taste.'],
   ['Amara keeps sketching sensor ideas because a neighbor’s flooded basement won’t leave their mind.',1,'The drive comes from something Amara personally can’t let go of.'],
   ['Lena picks showcase projects mainly by what will impress the parents.',0,'The choice is shaped by outside approval, not the kids’ or Lena’s own voice.'],
   ['Jun keeps pushing the ferry idea though the board laughs, because it feels like Jun’s own.',1,'Jun is following an inner pull, even at the cost of approval.'],
   ['A Young Maker copies last year’s ribbon winner, though they find it boring.',0,'Skill aimed at a ribbon, not at what interests them.']]);}},
{part:2,src:'Book I · Creator Takes Shape',pts:1,run(L){
  L.h(L.kick('pr','Read the signals')+'<h1 class="q">The café crowd loves Theo’s cover sets and the tips are great. Yet Theo dreads each gig, and their stomach has been in knots for weeks. What does Giddens’s story point to?</h1>');
  L.mc(L.card,['Theo just needs rest, then the same set','Theo should drop the covers this week','Theo’s voice may be fighting the work'],2,
   'Giddens felt miserable and got sick while “living the dream.” The book reads that as a sign she wasn’t creating true to herself.',
   'The chapter doesn’t prescribe a fast fix. It treats misery, and even the body’s signals, as a sign the work may not match the creator’s own voice.');}},

/* ---------- PART 4: HEARING IT ---------- */
{part:3,src:'Book I · Creator Takes Shape',run(L){
  L.h(L.kick('learn','The voice breaks through')+'<h1 class="q">A story that would not go away</h1>'+
   L.prose('On long drives between band gigs, Giddens read accounts left by enslaved women. One story, about an enslaved woman and the mistress who owned her as Northern armies came near, gripped her. It would not go away. She thought of all the nameless Black people history would never know.')+
   L.flow([['book','Reading','Accounts of enslaved women, on tour drives','',1],['alert','It won’t leave','One story keeps returning to her','',3],['star','Her own song','“Julie,” about a woman’s agonizing choice to leave','',2]])+
   L.prose('It was her first awareness of herself as a songwriter. Until then she hadn’t thought of herself as one at all. The voice, the book says, came from the one-of-a-kind circumstances that made her who she is.'));
  L.done();}},
{part:3,src:'Book I · Creator Takes Shape',run(L){
  L.h(L.kick('learn','Success pulls the other way')+'<h1 class="q">Hearing your voice once doesn’t mean you’ll follow it</h1>'+
   L.prose('Giddens wasn’t ready to fully embrace herself as a songwriter. Outside success kept fueling her.')+
   L.list([['star','A solo album of mostly cover songs','Named one of the top 50 albums of 2015.'],
     ['play','Bigger stages','She opened for country stars and won a regular role on a TV drama.'],
     ['trend','On the cusp of stardom','At the 2016 country music awards she performed in a big made-for-TV moment.']],3)+
   L.quote('I was living the dream and was very frequently miserable.','Rhiannon Giddens, to the author')+
   L.prose('The praise clashed with an inner voice pointing somewhere else. Learning to hear your own voice amid outside noise, the book says, can be wrenching. And she is still changing today.'));
  L.done();}},
{part:3,src:'Book I · Creator Takes Shape',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Theo has forty song drafts. Which one is most likely to carry Theo’s own voice?</h1>');
  L.mc(L.card,['A tune built to sound like the radio','A song the café regulars keep requesting','A story Theo can’t stop thinking about'],2,
   'Like Giddens’s story that would not go away, an idea that keeps pulling at you is a clue to your voice.',
   'Radio sound and requests come from outside. Giddens’s first real song came from a story that kept pulling at her.');}},
{part:3,src:'Book I · Creator Takes Shape',pts:1,run(L){
  L.h(L.kick('pr','Put it in order')+'<h1 class="q">Put Giddens’s path in order, from childhood to the edge of stardom.</h1>');
  L.order(L.card,['Bored games under the oak','First solo at choral camp','Burnout after music school','Touring, miserable and sick','A story that won’t go away','TV role and award shows'],
   'Talent, success and momentum came first. Her own voice broke through only after misery told her something was off, and even then success kept pulling at her.');}},
{part:3,src:'Book I · Creator Takes Shape',pts:1,run(L){
  L.h(L.kick('pr','Apply it')+'<h1 class="q">The scout offers Theo an opening slot on a big summer tour, playing mostly covers. Theo feels flattered, and oddly flat. What does the chapter say about moments like this?</h1>');
  L.mc(L.card,['Praise can drown out the inner voice','Touring always ruins a creator','Flat feelings mean Theo lacks talent'],0,
   'Giddens kept saying yes to success while her inner voice pointed elsewhere. The chapter calls that tension wrenching, not a verdict on talent.',
   'The chapter doesn’t condemn success or doubt Theo’s talent. Its point is that outside praise can make the inner voice hard to hear, as it did for Giddens.');}}
  ]
});
</script>
</body>
</html>
