<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What Counts as Creative?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0002', title:'What counts as creative?', minutes:18, icon:'star',
  goals:['Test any idea against the working definition: novel plus valuable','Separate “valuable” from “good,” and the creator’s experience from the result','Explain why creating feels terrifying, and why that fear is reasonable'],
  parts:['Kangaroo Man','Definition','Not the same as good','Terrifying'],
  read:'Read “Leap of Faith” in Book I for the whole Kangaroo Man story, from the goats to the meeting in Canberra.',
  glossary:{
    'novelty':'Novelty: newness or originality. The first half of the working definition of creativity.',
    'value':'Value: meaning or influence; the creation makes a difference to someone. It separates creative work from work that is merely odd. Value is not the same as being good.',
    'kibbutz':'Kibbutz: a shared farming community in Israel where, in its early days, members got roughly equal pay, ate together and were assigned their jobs.'
  },
  cheatsheet:[
    'Creativity can bloom <b>late in life</b> and in places that seem hostile to it, like Gat’s survival-first kibbutz.',
    'Working definition: <b>creativity = novelty + value</b> (or influence).',
    'Value separates creative from merely <b>odd</b>. Surprise is a <b>debated</b> extra; many say it’s just novelty.',
    '<b>Value isn’t goodness.</b> Creativity is a process; its results are subjective and can be used for harm.',
    'You don’t have to change the world. <b>Little C’s</b> count, and Big C’s depend on them.',
    '<b>Authenticity</b> and <b>fun</b> describe the creator’s experience, and authentic work may resonate more.',
    'Creativity can be <b>terrifying</b>, and the fear is reasonable because outcomes are unknown. Creators go forward anyway, one step at a time.'
  ],
  steps:[
/* ---------- PART 1: KANGAROO MAN ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">At Idea Night, Jun pitches turning the rusting ferry behind the warehouse into a floating repair workshop that tours river towns. Several members laugh. What does the laughter tell you?</h1>');
  L.mc(L.card,['That the ferry idea is a bad one','Mostly that the idea is unusual'],1,
   'People often laugh at what’s unfamiliar. Whether the idea is any good is a separate question, and this lesson gives you a way to think about it.',
   'Laughter mostly tells you the idea is unfamiliar. Plenty of ideas that were laughed at worked out, as this lesson’s story shows.');}},
{part:0,src:'Book I · Leap of Faith',run(L){
  L.h(L.kick('learn','An unlikely place')+'<h1 class="q">A village built for survival, not for dreamers</h1>'+
   L.prose('The author’s family visits Nir David, a '+L.g('kibbutz','kibbutz')+' about two hours north of Jerusalem. For decades it had to scrape by: attacks, hunger and constant hard work.')+
   L.list([['scale','Same pay','Every member got roughly equal pay.'],['bowl','Same food','Everyone ate the same plain meals in a shared dining hall.'],['list','Assigned jobs','Field, kitchen, factory or accounts, as the community decided.'],['people','Shared childhood','Kids were raised together by caretakers and slept at their parents’ homes.']],1)+
   L.prose('The book calls it hardscrabble: not a place where you’d expect a painter or an eccentric entrepreneur to spring up. Yet, the chapter opens, creativity finds a way, like life itself.'));
  L.done();}},
{part:0,src:'Book I · Leap of Faith',run(L){
  L.h(L.kick('ex','A real story from the book')+'<h1 class="q">Yehuda Gat, the “Kangaroo Man”</h1>');
  L.beats(L.card,[
   ['The job','Around 1990, Gat is fifty. He had grown up on the kibbutz, raised turkeys and served as a paratrooper. Now the kibbutz suggests a new job: tend two goats and two sheep for visiting kids.'],
   ['The spark','The goats don’t appeal, but they spark something bigger: a Winnie-the-Pooh theme park and a petting zoo that teaches people about animals, drawing crowds.'],
   ['The obsession','Gat can’t think of anything else. Neighbors assume the craze will wear off and send him to a class for people starting projects.'],
   ['The “no”','After six months, his tutor tells him there is no way he’ll build a Pooh park.'],
   ['The pivot','A friend suggests sticking to Australian animals. Kangaroos! Gat faxes more than eighty European zoos asking to buy one. The two that arrive are very aggressive.'],
   ['The chuckles','He plants eucalyptus trees in the middle of a field to feed future koalas. The head of farming figures he must be crazy.']],
   'An ordinary man, late in life, in a place built for sameness, gets an idea he can’t shake, and keeps going while people laugh.');}},
{part:0,src:'Book I · Leap of Faith',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Why does the author tell Gat’s story first?</h1>');
  L.mc(L.card,['It shows creativity needs a creative setting','It shows a creator can emerge late, anywhere','It shows big ideas come from experts only'],1,
   'Gat was fifty, untrained in zoos, living in a place built for survival. Creativity still found a way.',
   'Gat had no creative setting and no zoo expertise, and he was fifty. The story shows creativity can show up late, in unlikely places.');}},
{part:0,src:'Book I · Leap of Faith',pts:1,run(L){
  L.h(L.kick('pr','Put it in order')+'<h1 class="q">Arrange the steps of Gat’s early journey, first to last.</h1><div id="od"></div>');
  L.order(L.$('#od'),['Offered two goats and two sheep to tend','Dreams of a Winnie-the-Pooh park','Tutor says there’s no way','A friend suggests Australian animals','Faxes over eighty zoos for a kangaroo'],
   'A small, dull job sparked a big idea. The idea met a hard “no,” changed shape, and kept moving.');}},
{part:0,src:'Book I · Leap of Faith',pts:1,run(L){
  L.h(L.kick('pr','Apply it')+'<h1 class="q">A board member says: “Jun is 58 and a welder, not a designer. It’s too late for something this wild.” What does Gat’s story suggest?</h1>');
  L.mc(L.card,['Wild ideas belong to the young','Jun should stick to welding','Age and background don’t rule it out'],2,
   'Gat was fifty, trained in farming, when his idea struck. Late starts and odd backgrounds are no barrier.',
   'Gat was fifty and trained in farming, not zoos. His story shows people can become creative later in life and from unlikely backgrounds.');}},

/* ---------- PART 2: DEFINITION ---------- */
{part:1,src:'Book I · Leap of Faith',run(L){
  L.h(L.kick('learn','So what is creativity?')+'<h1 class="q">A working definition: new, and it matters</h1>'+
   L.prose('Researchers call creativity an umbrella term: it can mean a product, a process, an identity or a personality. But most definitions meet in the same place.')+
   L.flow([['star','Novelty','New, original','',2],['target','Value','Meaningful, or influential','',3],['bulb','Creativity','Both at once','',1]])+
   L.prose('Why insist on '+L.g('value','value')+'? Because it separates creative work from work that is just <b>eccentric or odd</b>. A thing that’s only new isn’t enough; it has to mean something, at least to someone.')+
   L.note('Some researchers add a third part, <b>surprise</b>. Others think surprise is just novelty with an exclamation point. It’s debated, so treat it as optional.','info'));
  L.done();}},
{part:1,src:'Book I · Leap of Faith',run(L){
  L.h(L.kick('ex','Worked examples')+'<h1 class="q">Flip each card: novel, valuable, or both?</h1>');
  L.flips(L.card,[
   ['Sol glues 40 spoons to a hat','<b>Novel, but no clear value.</b> Nobody, Sol included, finds a use or meaning in it. Odd rather than creative, at least so far.'],
   ['Theo sells the same muffins as every café','<b>Valuable, not novel.</b> People like them, but nothing is new.'],
   ['Gat’s kangaroo petting zoo','<b>Both.</b> Unusual for its time and place, and it came to matter to visitors and to the kibbutz.'],
   ['Amara’s cheap river sensor','<b>Both.</b> A new low-cost design, and it could warn riverside homes before a flood.']],
   'Run every idea through two questions: <i>Is it new?</i> and <i>Does it matter to someone?</i>');}},
{part:1,src:'Book I · Leap of Faith',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">By the working definition, which one is creative?</h1>');
  L.mc(L.card,['A strange new noise with no use','A new song that moves its listeners','A popular song played note for note'],1,
   'It’s new, and it means something to people: novelty plus value.',
   'A strange noise is new but means nothing yet (odd). A note-for-note cover has value but no novelty. Only the new song that moves people has both.');}},
{part:1,src:'Book I · Leap of Faith',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Creative, just odd, or not new?',['Creative','Just odd','Not new'],[
   ['Lena paints the classroom door with stripes no one asked for and no one cares about.',1,'It’s new, but it doesn’t matter to anyone. Value is missing.'],
   ['Young Makers build a rain-catcher that waters the Commons garden in a new way.',0,'New, and useful to the garden: novelty plus value.'],
   ['Theo plays a well-known hit exactly as recorded, and the café crowd loves it.',2,'People enjoy it, so it has value, but nothing about it is new.'],
   ['Jun designs a new tool rack that halves the time members spend hunting for tools.',0,'A new design that makes a real difference.'],
   ['Amara wires a sensor that beeps randomly, unrelated to the water level.',1,'It’s new, but it doesn’t help anyone yet.']]);}},
{part:1,src:'Book I · Leap of Faith',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Tap each piece until the sentence states the book’s working definition.</h1>');
  L.sentence(L.card,[['Creativity is something'],['famous','novel','surprising'],['that has'],['a big audience','value or influence','a moral purpose']],[0,1,0,1],
   [[],['Fame isn’t part of the definition. Most creators are never famous.','Surprise is debated; many researchers say it’s just novelty with an exclamation point.'],[],['Audience size isn’t required. A creation can matter to a few people.','Value isn’t the same as good. Creations can matter and still be harmful.']],
   'Novelty plus value or influence: the most widely accepted starting point.');}},

/* ---------- PART 3: NOT THE SAME AS GOOD ---------- */
{part:2,src:'Book I · Leap of Faith',run(L){
  L.h(L.kick('learn','Value isn’t goodness')+'<h1 class="q">“Valuable” doesn’t mean “positive”</h1>'+
   L.prose('The book is blunt: tyrants who carried out genocide used new tools and tactics on a new scale. In a cold sense, that checks the boxes of novelty and influence. It is obviously not good.')+
   L.lanes([['target','Value means','The creation makes a difference: it has meaning or influence for someone.',2],
            ['scale','Value doesn’t mean','The creation is kind, moral or beneficial. That depends on use and values.',4]])+
   L.prose('So creativity is a <b>process</b>, not a badge of virtue, and its results are <b>subjective</b>: people can reasonably disagree about what a creation is worth.'));
  L.done();}},
{part:2,src:'Book I · Leap of Faith',run(L){
  L.h(L.kick('ex','A story the book cites')+'<h1 class="q">The painting program and the painter’s daughter</h1>');
  L.beats(L.card,[
   ['The program','Harold Cohen wrote AARON, a computer program that paints pictures good enough to hang in galleries.'],
   ['The daughter','His daughter also paints. Her work is far less known; most people wouldn’t pay for it.'],
   ['The judgment','Yet Cohen rates his daughter’s creativity as much greater than his program’s.'],
   ['The wider point','Some say “creative” should only describe great historical figures. Many scholars disagree: there’d be no lightbulb or smallpox vaccine without the Little C’s that came before.']],
   'Who judges the value, and by what measure, varies. And you don’t have to change the world to be creative.');}},
{part:2,src:'Book I · Leap of Faith',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Jun’s ferry might help a few river towns, nothing more. Could it still count as creative?</h1>');
  L.mc(L.card,['No, creative means changing the world','Yes, it doesn’t need to change the world'],1,
   'Many scholars say a creator just might change the world, but doesn’t need to. Little C’s count.',
   'Many scholars in the field say world-changing impact isn’t required. Big C’s are built on many smaller creations.');}},
{part:2,src:'Book I · Leap of Faith',run(L){
  L.h(L.kick('learn','The creator’s side')+'<h1 class="q">Two more words: authenticity and fun</h1>'+
   L.prose('Novelty and value describe the <i>result</i>. Some scholars add ideas about the <i>creator’s experience</i>.')+
   L.list([['compass','Authenticity','Creativity often blossoms from real experience and emotion. An authentic creation may have a better chance of resonating with others, and so of having value.'],
           ['flame','Fun','Authentic creating is often pleasurable, honest and true. Einstein, author of more than three hundred publications, linked it to fun.']],2)+
   L.quote('Intelligence having fun.','Albert Einstein’s description of creativity, cited in the chapter')+
   L.prose('The author’s full list: novelty, value, surprise, authenticity, fun, but not necessarily good or evil. And, he adds, creativity is vitally important.'));
  L.done();}},
{part:2,src:'Book I · Leap of Faith',pts:5,run(L){
  L.h(L.kick('pr','Which part is it?')+'<h1 class="q">Each statement about Jun’s ferry touches one part of the author’s list. Sort them.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Core definition','Debated extra','Creator’s experience'],[
   ['No river town has ever had a floating repair shop.',0,'That’s novelty, half of the core definition.'],
   ['It would fix tools and bikes for people far from any shop.',0,'That’s value: it makes a difference. The other half of the core.'],
   ['Members gasp when Jun unveils the sketch.',1,'Surprise. Some researchers include it; others call it novelty with an exclamation point.'],
   ['The idea grows from Jun’s decades in the shipyard.',2,'Authenticity: it comes from Jun’s real life.'],
   ['Jun grins for hours while sketching it.',2,'Fun: the pleasure of creating, felt by the creator.']],
   'Novelty and value judge the result. Authenticity and fun describe what it’s like to create.');}},

/* ---------- PART 4: TERRIFYING ---------- */
{part:3,src:'Book I · Leap of Faith',run(L){
  L.h(L.kick('learn','The part definitions leave out')+'<h1 class="q">Creating can be terrifying</h1>'+
   L.prose('The author says the most important thing about creativity is rarely in any definition, and it’s the first thing to understand: it can be <b>terrifying</b>.')+
   L.prose('Gat’s story previews the arc of a creator, which the next lessons follow:')+
   L.flow([['shield','Overcome doubt','Mocked, but not stopped'],['compass','Embrace authenticity','An idea that’s truly yours'],['arrow','Push past obstacles','Inside and outside']])+
   L.note('The fear starts early in life and works below awareness. The catch: <b>the fear is reasonable</b>, because nobody knows how a creative journey will end.','alert'));
  L.done();}},
{part:3,src:'Book I · Leap of Faith',pts:1,
 solve:async L=>{L.$('#po').children[2].click();L.$('#go').click();},
 run(L){
  let p=null;const O=['Fewer than 20,000','About 20,000','Far more than 20,000'];
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">Gat promised his zoo would draw 20,000 visitors a year. Before the pandemic, how many came each year?</h1><div id="po"></div>'+
   '<button class="btn pri" id="go" hidden style="margin-top:12px">'+L.ic('play')+'See what happened</button><div id="tl"></div>');
  O.forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=n;b.onclick=()=>{if(p!==null)return;p=j;b.classList.add('sel');L.$('#go').hidden=false;};L.$('#po').appendChild(b);});
  L.$('#go').onclick=function(){this.remove();
    L.$('#tl').innerHTML='<div class="ladder" style="margin-top:12px">'+[
     ['Australia','Mocked but undeterred, Gat gets the kibbutz to fly him to Australia. Six trips, over two dozen zoos: he learns to care for kangaroos, koalas, emus and wombats.'],
     ['Canberra, 1996','Two hours pitching officials. He leaves with permission to take the animals: the first such petting zoo outside Australia.'],
     ['The hit','About <b>140,000 visitors a year</b>, seven times his promise, and close to US$2 million in yearly revenue.'],
     ['The ripple','The zoo now supplies kangaroos to zoos around the world. The farm chief who called him crazy is a believer.']
    ].map((x,j)=>(j?'<div class="conn"></div>':'')+'<div class="rung'+(j===3?' cur':'')+'"><small>'+x[0]+'</small>'+x[1]+'</div>').join('')+'</div>';
    L.award(p===2);
    L.sheet(p===2?'ok':'no',p===2?'You called it!':'Far more came','The “crazy” idea beat its own promise many times over. But nobody could have known that in advance, which is exactly why creating feels scary.');L.done();};}},
{part:3,src:'Book I · Leap of Faith',run(L){
  L.h(L.kick('ex','A real story from the book')+'<h1 class="q">Gat’s secret, and the question it raises</h1>');
  L.beats(L.card,[
   ['His secret','Asked what makes him tick, Gat says he is very confident. When he decides on something, beekeeping or jazz saxophone, he just does it.'],
   ['His view','Can anyone do this? No, Gat insists. You must be a dreamer with your feet on the ground, with a flash in your eyes.'],
   ['His feeling','He describes the whole journey as living on the edge.'],
   ['The author’s answer','Is creativity an exclusive club? The short answer, the author says, is <b>no</b>. Seeing why means looking at the hidden challenges every creator faces.']],
   'Gat thinks he’s special. The book thinks anyone can do it, once they understand what stands in the way, starting with doubt.');}},
{part:3,src:'Book I · Leap of Faith',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Why does the book call the fear of creating reasonable?</h1>');
  L.mc(L.card,['Nobody can know how it will turn out','Most creative ideas are harmful','Only a few people are built for it'],0,
   'A creative journey heads into the unknown. Gat couldn’t know kangaroos would work, and neither can Jun know about the ferry.',
   'The book’s reason is uncertainty: creative outcomes are unknown. It doesn’t say ideas are mostly harmful, and it rejects the idea that creativity is only for a few.');}},
{part:3,src:'Book I · Leap of Faith',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Does it match the chapter?',['Matches','Doesn’t match'],[
   ['Jun feels scared before pitching again. “If I’m this afraid, the idea must be bad.”',1,'Fear is part of creating for nearly everyone. It says the outcome is unknown, not that the idea is bad.'],
   ['Even if the ferry succeeds, its full impact may be hard to measure.',0,'The book says just that about Gat: the ultimate impact of creating can be hard to measure.'],
   ['“Only people with a flash in their eyes should pitch at Idea Night.”',1,'That’s Gat’s view. The author’s short answer to “is it an exclusive club?” is no.'],
   ['Jun learns ferry repair step by step, like Gat’s six trips to Australia.',0,'Dreaming with feet on the ground: faith in yourself, one step after the next.']]);}},
{part:3,src:'Book I · Leap of Faith',pts:1,run(L){
  L.h(L.kick('pr','Apply it')+'<h1 class="q">After another round of laughter, Jun asks you: “Should I wait until I’m sure the ferry will work?” What fits this chapter best?</h1>');
  L.mc(L.card,['Yes, wait until the fear is gone','Go ahead, one grounded step at a time','Make the pitch bigger to win them over'],1,
   'The outcome can’t be known in advance, so certainty never arrives. Gat went forward anyway, learning his craft step by step.',
   'Certainty never comes, because creative outcomes are unknown, and a bigger pitch doesn’t change that. Gat’s way was faith in himself, one grounded step after the next.');}}
  ]
});
</script>
</body>
</html>
