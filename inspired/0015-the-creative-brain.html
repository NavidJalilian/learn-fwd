<title>The Creative Brain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">

<body>

<script>
Course.lesson({
  id:'0015', title:'The creative brain', minutes:20, icon:'bulb',
  goals:['Score ideas the way the brick test does: fluency, flexibility, originality, detail','Describe the three brain networks that work together when people create','Use brain science with care: let ideas come freely, test them later, and doubt big claims'],
  parts:['The brick test','Three networks','Quiet the planner','Rooms and caution'],
  read:'Read “The Brain,” the opening chapter of Book III, for Roger Beaty’s scanner, Arne Dietrich’s run in the Georgia woods and Judd Apatow’s writers’ rooms in full.',
  glossary:{
    'alt-uses':'Alternative-uses test: a creativity test from J.P. Guilford (1967) that asks for as many uses as you can think of for an everyday object, like a brick.',
    'default-net':'Default network: brain areas most active when you aren’t focused, such as resting, zoning out or mind wandering. Ideas seem to crop up here.',
    'salience-net':'Salience network: brain areas that act as a filter, picking out what seems relevant or interesting enough to pay attention to.',
    'exec-net':'Executive control network: the most evolved part of the brain, used for focus, complex decisions and directing attention.',
    prefrontal:'Prefrontal cortex: the front of the brain, its most evolved part, which handles planning, judging and keeping us to rules.',
    hypofrontality:'Transient hypofrontality: Arne Dietrich’s theory that a temporary slowing of the brain’s front, planning part lets more creative ideas through. “Hypo” means under.'
  },
  cheatsheet:[
    'Guilford’s <b>brick test</b> scores four things: <b>fluency</b> (how many ideas), <b>flexibility</b> (how many kinds), <b>originality</b> and <b>detail</b>.',
    'Roger Beaty: better scorers show stronger links among three networks: <b>default</b> (ideas crop up), <b>salience</b> (spots what’s interesting), <b>executive control</b> (focuses and finishes).',
    'The author’s picture: a <b>gold mine</b>. Dig up tons of stuff, sift for gold, then polish the best nugget and take it to market.',
    'Arne Dietrich’s <b>transient hypofrontality</b>: when the planning brain quiets for a while, more ideas get through.',
    'Small studies: artists and scientists both lit up the default network (Iowa); proven creators used <b>less</b> brain effort than smart peers (UCLA). Others can still create; it may take more work.',
    'Ideas pop up like <b>mutations</b>, then get tested by the judging brain. “Sleep on it” before you take an idea to the world.',
    'A group can work like one brain. One harsh critic, a <b>room killer</b>, can shut it down; a safe room lets ideas flow.',
    'The science is <b>very young and may mislead</b>. Doubt anyone selling a brain-based creativity fix.'
  ],
  steps:[
/* ---------- PART 1: THE BRICK TEST ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">The Commons has reopened after the spring flood, and a pile of spare bricks sits by the door. Lena asks Young Makers for uses. Which answer would most surprise a creativity researcher?</h1>');
  L.mc(L.card,['Stack them up to build a low wall','Grind one into powder to make red paint'],1,
   'Right. Walls are what bricks are for. Turning one into paint is unusual. This lesson starts with a real test built on exactly this question.',
   'A wall is the use everyone thinks of first. Grinding a brick into paint is far less expected, and unexpected answers are what a creativity test looks for.');}},
{part:0,src:'Book III · The Brain',run(L){
  L.h(L.kick('learn','The brick test')+'<h1 class="q">How do you measure creativity?</h1>'+
   L.prose('Book III turns to the creator’s body and mind, starting with the brain. Much of the research uses one classic tool: the '+L.g('alt-uses','alternative-uses test')+', created by psychologist J.P. Guilford in 1967. It asks a simple question: how many things can you do with a brick? (Or a paper clip, a pen, a shoe.)')+
   L.prose('The test measures <b>divergent thinking</b>, meaning branching out to many possible answers instead of one correct one. Guilford scored four qualities:')+
   L.list([['Fluency','How many ideas you come up with. A fancy word for quantity.'],
     ['Flexibility','How many different <i>kinds</i> of ideas. A doorstop and a paint are different categories.'],
     ['Originality','How unusual the ideas are.'],
     ['Detail','How specific and fleshed-out each idea is.']],1));
  L.done();}},
{part:0,src:'Book III · The Brain',run(L){
  L.h(L.kick('ex','The author takes the test')+'<h1 class="q">Richtel’s answers, scored</h1>');
  L.beats(L.card,[
   ['The setting','Neuroscientist Roger Beaty, now at Penn State, gives the author the brick question.'],
   ['First answers','A doorstop. Something to throw through a window. A block under a tire so a car doesn’t roll down a steep hill. That’s <b>fluency</b>: ideas piling up.'],
   ['Then a different one','Grind the brick into a red paste, mix it with water and use it as paint. Beaty’s interest perks up.'],
   ['Why it stands out','It may be <b>original</b>. It’s a new <b>category</b> (paint isn’t a doorstop), which is flexibility. And it’s specific, which is <b>detail</b>.']],
   'One answer can score on several qualities at once. The paint idea showed originality, flexibility and detail together.');}},
{part:0,src:'Book III · The Brain',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Which brick-test quality counts how many <i>different kinds</i> of ideas someone gives?</h1>');
  L.mc(L.card,['Fluency','Originality','Flexibility'],2,
   'Right. Flexibility counts categories: a doorstop, a weapon and a paint are three different kinds of use.',
   'Fluency is the raw count of ideas, and originality is how unusual they are. Counting different <i>kinds</i> of idea is flexibility.');}},
{part:0,src:'Book III · The Brain',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Lena scores the Young Makers’ answers for “uses for an old life jacket.” Which quality does each note describe?',['Fluency','Flexibility','Originality','Detail'],[
   ['“Mateo listed 31 uses in ten minutes.”',0,'A pure count of ideas is fluency.'],
   ['“Sol’s uses ranged across toys, tools, art and food.”',1,'Spanning many categories is flexibility.'],
   ['“Only one kid in the whole room thought of using it as a planter.”',2,'An answer almost nobody else gives is original.'],
   ['“Priya explained exactly which straps to cut to turn it into a backpack.”',3,'Spelling out how an idea would work is detail.'],
   ['“Sol had 12 uses, but all of them were for floating things.”',1,'Plenty of ideas, but all one kind: that’s low flexibility.']]);}},

/* ---------- PART 2: THREE NETWORKS ---------- */
{part:1,src:'Book III · The Brain',run(L){
  L.h(L.kick('learn','The brick test in a scanner')+'<h1 class="q">Three brain networks working together</h1>'+
   L.prose('As a graduate student, Beaty found an underused brain scanner “collecting dust” and put it to work. He scanned about 170 people while they took a timed brick test. The scanner tracks blood flow, which shows roughly which brain areas are working harder.')+
   L.prose('His finding: people who scored better had <b>stronger connections between three networks</b>.')+
   L.tiers([['bulb','Default network','Busiest when you’re not focused: resting, zoning out, mind wandering. Ideas crop up here.','digs up ideas'],
            ['eye','Salience network','A filter that picks out what seems relevant or interesting.','spots the promising ones'],
            ['target','Executive control network','The most evolved part of the brain: focus, complex decisions, directing attention.','does the final work',true,'finishes']])+
   '<p class="small" style="margin-top:10px">In short: the '+L.g('default-net','default')+' network lets ideas up, the '+L.g('salience-net','salience')+' network sifts them, and the '+L.g('exec-net','executive control')+' network processes the best ones.</p>');
  L.done();}},
{part:1,src:'Book III · The Brain',run(L){
  L.h(L.kick('ex','The author’s picture')+'<h1 class="q">Think of the brain as a gold mine</h1>'+
   L.prose('Richtel calls his version “simpleminded,” but it makes the three jobs easy to hold in your head.')+
   L.flow([['layers','Dig','Haul up tons of stuff: rocks, fossils, gunk and a few hunks of gold','default',2],
           ['eye','Sift','Pick out the pieces that might be gold','salience',3],
           ['star','Polish and sell','Melt the best nugget, shape it into a ring, take it to market','executive control',1]])+
   L.note('A mine that only digs is a pile of rubble. A mine that only polishes has nothing to polish. The finding is about the three parts being <b>well connected</b>.','info'));
  L.done();}},
{part:1,src:'Book III · The Brain',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Amara is half-asleep on the bus home, not thinking about anything, when a new way to anchor the flood sensors pops into their head. Which network was most likely at work?</h1>');
  L.mc(L.card,['The executive control network','The default network'],1,
   'Right. Zoning out is when the default network is busiest, and it’s where ideas seem to crop up.',
   'The executive control network handles focus and decisions. An idea that arrives while Amara is zoning out fits the default network.');}},
{part:1,src:'Book III · The Brain',pts:1,
 solve:async L=>{const c=L.$('#nw').children;c[0].click();c[1].click();c[2].click();},
 run(L){
  const N=['Default','Salience','Executive'],I=['bulb','eye','target'],on=[false,false,false],seen=new Set();
  const R={
   '000':'Theo stares at the wall. Nothing comes.',
   '100':'Half-melodies drift by all evening. None gets noticed, and none gets finished.',
   '010':'Theo is alert for something good, but nothing new is coming up to notice.',
   '001':'Theo polishes the same old cover song again. Tidy, but nothing new.',
   '110':'A great hook drifts up and Theo notices it. It never gets shaped into a song.',
   '101':'Plenty of ideas and plenty of hard work, but Theo polishes the weak ones.',
   '011':'Theo judges and sharpens, but there’s almost no raw material to work with.',
   '111':'Ideas drift up, Theo catches the strong hook, then shapes it into a finished song.'};
  L.h(L.kick('pr','Toggle and compare')+'<h1 class="q">Theo has an evening in the music room. Switch the three networks on and off and see what each mix produces.</h1>'+
   '<p class="small">A simplified model of Beaty’s finding, not a real brain scan.</p><div id="nw"></div>'+
   '<div style="background:var(--soft);border-radius:16px;padding:14px;margin:10px 0 6px;min-height:70px"><div class="small" style="margin-bottom:6px">Theo’s evening</div><div id="out" class="prose" style="margin:0"></div></div><div id="nq"></div>');
  const draw=()=>{const k=on.map(x=>x?'1':'0').join('');seen.add(k);L.$('#out').textContent=R[k];
    if(seen.size>=4&&!L.$('#nq').innerHTML){const q=L.$('#nq');q.innerHTML='<h2 class="sub">What did Beaty find in people who scored higher on the brick test?</h2>';
      L.mc(q,['One network far stronger than the others','Stronger links among all three networks'],1,
       'Right. It isn’t one star network. The better scorers had the three better connected, just as Theo needed all three to finish a song.',
       'Beaty didn’t find one star network. Higher scorers had stronger <b>connections</b> among all three, like Theo needing all three switched on.');}};
  N.forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.innerHTML=L.ic(I[j])+n;
    b.onclick=()=>{on[j]=!on[j];b.classList.toggle('sel',on[j]);draw();};L.$('#nw').appendChild(b);});
  draw();}},
{part:1,src:'Book III · The Brain',pts:6,run(L){
  L.h(L.kick('pr','Which network?')+'<h1 class="q">Sort these moments at the Commons by the network doing most of the work.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Default','Salience','Executive'],[
   ['Theo is walking home, thinking of nothing, and a melody shows up.',0,'Ideas cropping up while the mind drifts is the default network.'],
   ['Among twelve sensor sketches, Amara suddenly sees one could survive a long storm.',1,'Spotting which idea is interesting or relevant is the salience network’s filtering job.'],
   ['Jun checks every line of the ferry budget before the board meeting.',2,'Focused, careful decision work is executive control.'],
   ['In the bath, Sol daydreams about a raft made of soda bottles.',0,'Daydreaming at rest is the default network at work.'],
   ['Lena notices that one kid’s offhand joke could be a great project.',1,'Picking out the gem from the noise is the salience network.'],
   ['Amara solders the chosen design and tests it in a bucket.',2,'Finishing and testing the best idea takes focus: executive control.']],
   'Dig, sift, polish. Each moment leans on one network, but a finished creation needs all three working together.');}},

/* ---------- PART 3: QUIET THE PLANNER ---------- */
{part:2,src:'Book III · The Brain',run(L){
  L.h(L.kick('learn','Transient hypofrontality')+'<h1 class="q">Ideas flow when the planning brain eases off</h1>'+
   L.prose('Creativity scholar Arne Dietrich ran very long distances to train. After a 21-mile run in the Georgia woods in 2001, an idea struck him: creative ideas seem to flow when the '+L.g('prefrontal','prefrontal cortex')+' is in a lull.')+
   L.prose('That sounded almost backward. The prefrontal cortex is the most evolved part of the brain, the part that sets us apart from other animals. Dietrich spent years checking himself before publishing it in 2003 as '+L.g('hypofrontality','transient hypofrontality')+'.')+
   L.flow([['clock','Transient','for a while, not forever'],['down','Hypo','under, as in low blood pressure'],['layers','Frontality','the brain’s front, planning part']])+
   L.prose('The idea fits evidence earlier in the book: ideas come more freely in meditative, less rigid states, like a child’s easy flow of ideas. Dietrich also stresses that creativity is spread throughout the brain, and that creative people are <b>not a special class</b>.'));
  L.done();}},
{part:2,src:'Book III · The Brain',run(L){
  L.h(L.kick('ex','Two small studies')+'<h1 class="q">Modest clues, not a full map</h1>');
  L.beats(L.card,[
   ['Iowa: the setup','Seven accomplished creators (three authors, a filmmaker, a neuroscientist and two molecular biologists) lay in a scanner. Shown a common word, they whispered the first thing that came to mind. As a comparison, they just repeated a two-digit number.'],
   ['Iowa: the finding','Making up a word took more brain work, no surprise. But artists and scientists lit up <b>similar areas</b>, especially the default network, the part known for downtime, not active analysis.'],
   ['UCLA: the setup','The Big C Project scanned 107 people: proven high achievers in art and science, and a “Smart Comparison Group” with high IQ and lots of schooling. Both did divergent-thinking tasks.'],
   ['UCLA: the finding','Both groups used similar brain areas and got similar results. But the creators showed <b>less</b> activity. The smart group had to work harder to get there.'],
   ['What it suggests','For some people, creating may simply come more easily. That doesn’t rule anyone out. For others it may just take more effort.']],
   'Different kinds of creators use similar brain areas, and practiced creators may do it more efficiently.');}},
{part:2,src:'Book III · The Brain',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Amara reads about the UCLA study and sighs: “So creativity is only for people born with efficient brains.” What does the study actually suggest?</h1>');
  L.mc(L.card,['It may come easier to some, but others can still create with more work','Only people with high IQs can come up with original ideas'],0,
   'Right. The smart comparison group reached similar results; they just worked harder. Creativity wasn’t ruled out for anyone.',
   'The smart comparison group, chosen for high IQ, reached similar results to the creators. The point is effort, not a closed door: it may just take some people more work.');}},
{part:2,src:'Book III · The Brain',run(L){
  L.h(L.kick('learn','Your brain runs its own evolution')+'<h1 class="q">Ideas are mutations; your judging brain is the first test</h1>'+
   L.prose('The author links the brain science back to Book II’s biology. Broadly, ideas seem to be <b>generated</b> in one network and <b>assessed</b> in another, just as mutations appear and then get tested by the world.')+
   L.flow([['bulb','Ideas appear','From quiet, emotion, mind wandering. Allowed more than willed, like mutations','',2],
           ['scale','The brain tests them','The analytical networks act as a first, rough environment','',3],
           ['trend','The world tests them','Survivors face the real thing: investors, the band, an editor','',1]])+
   L.prose('Richtel often announces a brilliant idea to his wife. Her answer: sleep on it. Days later he admits the idea makes no sense. Most ideas die that way. Prolific creators produce <b>more</b> of them and test them well enough to send the best into the world.'));
  L.done();}},
{part:2,src:'Book III · The Brain',pts:1,run(L){
  L.h(L.kick('pr','Put it in order')+'<h1 class="q">Put the life of Jun’s idea for a ferry tool library in the order the chapter describes.</h1>');
  L.order(L.card,['On a slow evening walk by the river, the idea simply pops up','Jun notices it feels promising and jots it down','Next morning Jun works the numbers and cuts what doesn’t hold up','Jun pitches the surviving version to members at Idea Night'],
   'Appear, get noticed, get tested by the judging brain, then face the real world. The same arc as a mutation, run inside one head first.',
   ['1','2','3','4']);}},
{part:2,src:'Book III · The Brain',pts:1,run(L){
  L.h(L.kick('pr','What should Theo do?')+'<h1 class="q">At 1 a.m. Theo gets a rush: a whole concept album about the river. Based on this chapter, what’s the best next move?</h1>');
  L.mc(L.card,['Text the scout right now before the feeling fades','Decide it’s probably silly and try to forget it','Write it all down, sleep on it, then judge it'],2,
   'Right. Let the idea come without judging it, then let the analytical brain test it once rested. The good parts survive.',
   'Texting the scout skips the test inside your own head; forgetting it kills the idea before it’s tested. Capture it freely, then let the judging brain look tomorrow.');}},

/* ---------- PART 4: ROOMS AND CAUTION ---------- */
{part:3,src:'Book III · The Brain',run(L){
  L.h(L.kick('learn','A room can be one brain')+'<h1 class="q">The writers’ room as a group brain</h1>'+
   L.prose('Comedy writer and director Judd Apatow describes TV writers’ rooms as one “giant brain” firing in all directions. When a room works, people feel so comfortable that fears fade and ideas pour out, like several default networks building on each other.')+
   L.quote('A lot of my profession is about being open to strange connections.','Judd Apatow, in “The Brain”')+
   L.lanes([['bulb','The room as default network','One unfunny pitch reminds someone of something funny, which sparks a third person. Ideas flow first.',2],
            ['scale','The room as prefrontal cortex','The writers also reject ideas, sometimes in seconds. If that judging gets too harsh, the flow stops.',4]])+
   '<p class="small" style="margin-top:10px">Apatow’s name for one overpowering critic: a <b>room killer</b>, whose personality is so strong it shuts down the whole room.</p>');
  L.done();}},
{part:3,src:'Book III · The Brain',run(L){
  L.h(L.kick('ex','Two rooms, two results')+'<h1 class="q">Apatow’s tale of a broken room and a safe one</h1>');
  L.beats(L.card,[
   ['The broken room','On <i>The Larry Sanders Show</i>, star Garry Shandling was often too busy to be in the writers’ room. The writers tried to guess what he would like.'],
   ['What went wrong','A bad script upset Shandling, and that mood reached the room. Writers worried about trouble and wondered if they were good enough. Apatow says it grew neurotic, at times toxic.'],
   ['The diagnosis','The room had permission to create but fought itself, because an outside voice took over the flow of ideas.'],
   ['The safe room','On <i>Crashing</i>, comedian Pete Holmes was in the room and supremely open. When the room teased him, he laughed along. It felt safe, and great things could happen.'],
   ['The trade-off','A safe room voices plenty of bad ideas, even embarrassing or offensive ones, which then get filtered out. Apatow’s rule: fill the room with kind-hearted people.']],
   'Perfectionism and guessing at an outside judge shut a group brain down. Safety and openness let it work.');}},
{part:3,src:'Book III · The Brain',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Why did the <i>Larry Sanders</i> room struggle, even though it was full of talented writers?</h1>');
  L.mc(L.card,['They had too few ideas to choose from','They judged every idea by what the boss might think','They let in too many bad ideas'],1,
   'Right. Guessing what an absent judge would approve made the room’s inner critic too harsh, so the flow dried up.',
   'Talent and ideas weren’t the issue, and safe rooms let in plenty of bad ideas. The trouble was writers guessing at Shandling’s approval, which made their judging too harsh.');}},
{part:3,src:'Book III · The Brain',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Idea Night, reopening edition. Is the group working like a healthy brain or a broken one?',['Healthy group brain','Broken group brain'],[
   ['Before anyone speaks, members whisper about what Ruth, the board chair, would approve.',1,'Guessing at an outside judge is the <i>Larry Sanders</i> trap.'],
   ['Theo’s half-joke about a floating café reminds Amara of a sensor buoy, and Sol adds a bell.',0,'One idea sparking the next is the room acting as a shared default network.'],
   ['One member scoffs at every pitch within seconds, and the room goes quiet.',1,'That’s a room killer: one voice so strong it shuts everyone down.'],
   ['Wild pitches flow for twenty minutes, then the group picks two to test.',0,'Ideas first, judging second: generate, then assess.']]);}},
{part:3,src:'Book III · The Brain',run(L){
  L.h(L.kick('learn','The big caution')+'<h1 class="q">This science is young and may mislead</h1>'+
   L.prose('Brain mapping of creativity is controversial. Dietrich, a respected skeptic, calls much of it worthless and says creativity is too complex to map with today’s tools. Beaty believes a map is already taking shape. A middle ground is forming: researchers taking modest steps that give clues, not a full picture.')+
   L.note('The author deliberately did <b>not</b> build the book on neuroscience. He says it might have sounded exciting, but it would have overstated how early the research is.','alert')+
   L.prose('What the evidence broadly supports: ideas bubble up from relaxed states, then get checked by the analytical brain. So let your mind wander and don’t judge what comes up, then let logic put the ideas through their paces. Dietrich hopes that one day, mapping could lead to ways of training more creativity. Not yet.'));
  L.done();}},
{part:3,src:'Book III · The Brain',pts:1,run(L){
  L.h(L.kick('pr','Read the flyer')+'<h1 class="q">A flyer on the Commons corkboard: “Scientifically proven brain workout! Ten minutes a day to triple your creativity.” What would this chapter say?</h1>');
  L.mc(L.card,['Worth trying, since brain science backs creativity training','Be skeptical: the brain science is too young to prove that','Skip it, since creativity can’t be changed at all'],1,
   'Right. The chapter’s caution is that the field is embryonic. Nobody can yet point to a proven brain lever for creativity.',
   'The book says the research is too early to back a brain-based fix, so “proven” is a red flag. It also doesn’t say creativity is fixed: the habits of mind wandering and openness still help.');}},
{part:3,src:'Book III · The Brain',pts:1,run(L){
  L.h(L.kick('pr','Sum it up')+'<h1 class="q">Tap each piece until the sentence matches the chapter’s bottom line.</h1>');
  L.sentence(L.card,[['Ideas tend to bubble up','Ideas are carefully built'],['when the mind is focused','when the mind is relaxed'],['and then get checked by the judging brain','and need no further checking'],['but brain maps are still young','and brain maps now prove it']],[0,1,0,0],
   [['The chapter says ideas often arrive unbidden, more allowed than willed.'],['Focus belongs to the later, checking stage. Ideas tend to come in relaxed states.'],['Ideas still need testing, first by the analytical brain and then by the world.'],['The author stresses the science is early and may mislead, so it proves nothing yet.']],
   'Let ideas come freely, test them afterward, and hold the brain science loosely.');}}
  ]
});
</script>
</body>
</html>
