<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finding Your Voice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0006', title:'Finding your voice', minutes:20, icon:'chat',
  goals:['Spot the masks and outside expectations that drown out a person’s voice','Describe what “voice” means: listening without judgment to half-formed ideas','Explain why struggle is common on the way to your voice, but not required'],
  parts:['The mask','The turn','Euphoria','Your voice'],
  read:'Read “Author Takes Shape” in Book I for the author’s own story and the full Schulz, Swift, Milch and Springsteen accounts.',
  glossary:{
    'seed-corn':'Seed corn: the author’s image for the raw bursts your brain produces (a word, a feeling, a scrap of a phrase). Rarely finished ideas, but the seeds everything else grows from.',
    'facade':'Facade: a false front. A way of acting that hides what you really think and feel.'
  },
  cheatsheet:[
    'You don’t need trauma to lose your <b>voice</b>. An ordinary childhood of hearing others’ expectations can muffle it too.',
    'The author wore a <b>facade</b> (part jock, part jokester) and listened for his parents’ approval instead of himself.',
    'His turning point: nobody else had his answers. <b>His own voice</b> had to be his guide.',
    'He came out with <b>gratitude</b> (failure hurts less), <b>humility</b> (judge less, listen more) and <b>less self-judgment</b>.',
    'Trusting his voice meant choices like staying in San Francisco when the newspaper said “it’s what everybody does.”',
    'Inspiration can feel like <b>euphoria</b>, and belief can outweigh the cost of starting again (Schulz). Craft is not the same as creativity.',
    'Voice = listening <b>without judgment</b> to the half-formed bursts your brain produces, your <b>seed corn</b>. Trust yourself to say what comes next.',
    'All your selves ride in the car; ask who’s driving. Struggle is common, but not required.'
  ],
  steps:[
/* ---------- PART 1: THE MASK ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Many famous artists describe a dark, painful period before they found their voice. Does that mean suffering is required to find yours?</h1>');
  L.mc(L.card,['Yes, suffering is the price of it','No, it often isn’t needed'],1,
   'Right. Struggle is common in creators’ stories, but the chapter ends by saying it isn’t required.',
   'It feels that way because creators tell those stories often. The chapter ends by saying struggle isn’t required. This lesson shows why.');}},
{part:0,src:'Book I · Author Takes Shape',run(L){
  L.h(L.kick('learn','The author’s own story')+'<h1 class="q">Matt Richtel didn’t start out as a creator</h1>'+
   L.prose('The author says his book isn’t a memoir, but he shares his own path because he lived the change: from ignoring his voice, to hearing it, to expressing it. He grew up in Boulder, Colorado.')+
   L.lanes([['trend','His father, Murray','A law professor who became a judge, full of big ideas. He told his kids they could be anything. Richtel heard: be a star, like a president or a baseball legend. He also asked the kids what they thought about his cases at dinner, and pushed his son to think his own ideas.',1],
            ['home','His mother','Reserved, and rarely openly affectionate, shaped by a harsh father of her own. But she gave her children the freedom to make their own choices and wanted people to be who they are.',2]])+
   L.prose('So he got two gifts that could feed creativity, curiosity and permission, mixed with messages he took as pressure.'));
  L.done();}},
{part:0,src:'Book I · Author Takes Shape',run(L){
  L.h(L.kick('learn','The mask')+'<h1 class="q">Listening hard for everyone except himself</h1>'+
   L.flow([['star','Father’s aspirations','Maybe I should be like him','',1],['home','Mother’s affection','Does she care?','',2],['shield','A facade','Part jock, part jokester, mostly mute about real feelings','',4]])+
   L.prose('He wore a '+L.g('facade','facade')+' copied from the confident athletes around him, and rarely said what he really thought, felt or noticed. His seeds of '+L.g('doubt','doubt')+' and his seeds of creativity fought each other to a standstill for years.')+
   L.note('The author stresses this was nothing like the racism and trauma Giddens’s family faced. It was a “vanilla,” very common struggle. You don’t need to be traumatized to have trouble hearing your own '+L.g('voice','voice')+'.','info'));
  L.done();}},
{part:0,src:'Book I · Author Takes Shape',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Amara says: “I had a perfectly happy childhood, so all this voice stuff doesn’t apply to me.” What does the chapter suggest?</h1>');
  L.mc(L.card,['Only real trauma muffles a voice','Ordinary lives can muffle it too'],1,
   'The author’s own childhood was ordinary, and he still couldn’t hear his voice. He shares it precisely because it’s so common.',
   'The author calls his own struggle “vanilla” and very common. Hearing other people’s expectations louder than your own can happen in any childhood.');}},
{part:0,src:'Book I · Author Takes Shape',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Whose voice is speaking?',['Theo’s own voice','Others’ expectations','A mask'],[
   ['Theo cuts a chorus down because the scout said hits get to it in 30 seconds.',1,'The rule comes from the scout, not from what the song needs to Theo.'],
   ['At open mic, Theo cracks jokes and acts tough instead of saying what a song is about.',2,'Like the author’s jock-and-jokester act, it hides Theo’s real feelings.'],
   ['Theo jots down a line about the shipyard whistle just because it moves them.',0,'Nobody asked for it. It comes from Theo’s own experience.'],
   ['Theo picks a guitar tone only because the café crowd likes it.',1,'The choice is made to please the crowd.'],
   ['Theo writes a verse about a half-remembered dream, unsure where it’s going.',0,'Following a half-formed idea of their own is Theo listening to themselves.']]);}},

/* ---------- PART 2: THE TURN ---------- */
{part:1,src:'Book I · Author Takes Shape',run(L){
  L.h(L.kick('ex','The author’s story')+'<h1 class="q">A collapse, and the answer nobody else could give</h1>');
  L.beats(L.card,[
   ['1991','Working at a small newspaper, he was jogging when he felt dizzy. It was the first of many bouts of a mystery illness. Rounds of antibiotics didn’t help.'],
   ['Two years','Suspecting it was in his head, he went to a therapist. He spent two years in tears, begging the therapist to tell him what was wrong and who he was.'],
   ['The turn','Finally he stopped asking. The therapist had no more answers for him than he had for himself.'],
   ['The lesson','His voice was as valid as anyone else’s, and it was the one that should guide him. He admits it may partly have been just going through his twenties.']],
   'The breakthrough wasn’t a new answer from outside. It was realizing that no one outside had his answers.');}},
{part:1,src:'Book I · Author Takes Shape',run(L){
  L.h(L.kick('learn','What he came away with')+'<h1 class="q">Three feelings he now sees in many creators</h1>'+
   L.list([['star','Gratitude','He felt thankful for big things and tiny ones, like a great street taco. It changed how he saw failure: if no one liked what he wrote, he still had tacos.'],
     ['people','Humility','Having seen his own frailty, he stopped judging others and became less rigid in his views. He listened more, so clues could come from anywhere and stopped feeling threatening.'],
     ['check','Less judgment of himself','His thoughts had the simple value of a regular person’s thoughts. He cared less about others’ judgment and chose by what felt right to him, not by outside standards.']],2)+
   '<p class="small" style="margin-top:10px">The author says the third is the biggest link to creativity.</p>');
  L.done();}},
{part:1,src:'Book I · Author Takes Shape',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Theo’s new song falls flat at open mic. Which reaction shows the author’s kind of gratitude?</h1>');
  L.mc(L.card,['“The night was still good, so I’ll write another.”','“I need everyone’s approval before I share again.”'],0,
   'Gratitude shrinks failure. If the song flops, life still has its street tacos, so trying again is cheap.',
   'That reaction hands control to other people’s judgment. Gratitude works the other way: the flop matters less because so much else is good.');}},
{part:1,src:'Book I · Author Takes Shape',pts:6,run(L){
  L.h(L.kick('pr','Name the feeling')+'<h1 class="q">Which of the author’s three feelings is each Alder Commons member showing?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Gratitude','Humility','Less self-judgment'],[
   ['Amara’s sensor test fails, and Amara shrugs: the dawn walk by the river was still lovely.',0,'Being thankful for the good parts makes the failure small.'],
   ['Jun stops waving off a member’s odd idea and asks them to explain it.',1,'Judging less and listening more lets clues come from anywhere.'],
   ['Theo keeps a strange lyric because it feels right, not because it’s “correct.”',2,'Theo chooses by inner feel, not outside standards.'],
   ['Lena hears out a parent whose views Lena usually dismisses, and picks up a useful tip.',1,'Seeing others as worth hearing is humility.'],
   ['Sol’s popcorn bike flops, and Sol is just glad they built it with friends.',0,'Thankfulness for the experience softens the flop.'],
   ['Amara shares a rough sketch at Idea Night without polishing it first.',2,'Amara treats their own unfinished idea as worth sharing.']],
   'Gratitude makes failure smaller, humility opens you to new inputs, and less self-judgment lets your own ideas count.');}},
{part:1,src:'Book I · Author Takes Shape',run(L){
  L.h(L.kick('ex','The author’s story')+'<h1 class="q">The move to New York that he refused</h1>');
  L.beats(L.card,[
   ['The offer','In 2000, the <i>New York Times</i> hired him and let him stay in San Francisco.'],
   ['The reversal','A year later the paper said he must move to New York by October 1, 2001. By then he had met his future wife and felt the first seeds of inspiration.'],
   ['The meeting','He flew to New York and told a senior editor: I’m happy, and you’re happy with my work. The editor agreed, but said it wasn’t about happiness. It was about what everybody does.'],
   ['The choice','That settled it for him. He stayed. On October 1 he sat in his home office waiting to be fired. The call never came.'],
   ['The lion','He says there was no heroism in it. For years he had lived as if running from a '+L.g('lion','lion')+', but the lion was his own creation, made from fear of others’ judgment.']],
   'For him it wasn’t only about happiness. It was about protecting the conditions that let his own voice thrive.');}},
{part:1,src:'Book I · Author Takes Shape',pts:1,run(L){
  L.h(L.kick('pr','Apply it')+'<h1 class="q">The scout invites Theo to spend the summer in the city co-writing with a hit team. “It’s not about what you like, it’s about what sells.” Theo writes best at the Commons. What would the author’s reasoning weigh most?</h1>');
  L.mc(L.card,['How big the hit team’s past sales are','Whether Theo could still hear their voice','What most young songwriters would do'],1,
   'The author refused New York partly because he wasn’t sure he could hear himself amid the louder outside voices there.',
   'The author rejected “what everybody does” as a reason. His question was whether a place would let his own voice thrive.');}},

/* ---------- PART 3: EUPHORIA ---------- */
{part:2,src:'Book I · Author Takes Shape',run(L){
  L.h(L.kick('learn','The rush of inspiration')+'<h1 class="q">When ideas feel so right they take over</h1>'+
   L.prose('As he found his voice, the author felt touches of inspiration he likens to euphoria. He told his father he would create a comic strip. It sounded nuts, and he couldn’t draw. He found an illustrator, and in 2001 the strip went out daily in newspapers across the country.')+
   L.lanes([['pencil','Charles Schulz','The <i>Peanuts</i> creator woke each day sure he had the perfect strip, and worked on it all day. Next morning: “Not quite.” Then, at once, a new perfect idea. His belief outweighed the effort of starting again.',1],
            ['play','Mark Romanek','The celebrated music-video director calls it a euphoria. For one film, three whole acts flooded into his head, a feeling he remembers as physical.',3]])+
   L.note('The author was also learning the craft of writing. Craft has to come too, he says, but skill is not the same as creativity.','info'));
  L.done();}},
{part:2,src:'Book I · Author Takes Shape',run(L){
  L.h(L.kick('learn','Living for approval')+'<h1 class="q">Even a superstar can struggle to trust her voice</h1>'+
   L.prose('A documentary about Taylor Swift shows how she was raised to be a “good girl” who lived for praise. By sixteen she had written 150 songs, so ideas came from inside. But she didn’t yet trust them.')+
   L.flow([['star','Living for praise','Joy came from strangers’ approval','',3],['alert','The crumble','One bad thing, and everything falls apart','',4],['cycle','The reckoning','She had to take apart a whole belief system','',2]])+
   L.prose('The film shows ambition and an audience can coexist with creativity, since we are <b>multitudes</b>. But a voice nags until it is honored. When she later released a quieter album, people said she had “reinvented herself.” The author dislikes that phrase: it suggests she set out to repackage herself. Instead, she let herself hear and express new parts of herself.'));
  L.done();}},
{part:2,src:'Book I · Author Takes Shape',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Monday, Theo is sure their new song is perfect. Tuesday morning it sounds “not quite,” and a fresh idea grabs them. What does the Schulz story suggest?</h1>');
  L.mc(L.card,['Monday’s work was a waste','Theo’s taste can’t be trusted','This cycle is normal and useful'],2,
   'Schulz felt this every day. Belief in the new idea gave him the energy to start again.',
   'Schulz lived this cycle daily and kept creating. Belief in each new idea is what powers starting over.');}},
{part:2,src:'Book I · Author Takes Shape',pts:1,run(L){
  L.h(L.kick('pr','Apply it')+'<h1 class="q">The Alder Falls paper writes: “Café singer Theo Brandt reinvents themselves with a moody folk sound.” Why would the author object to that wording?</h1>');
  L.mc(L.card,['It gives the café too little credit','It implies Theo set out to repackage','It makes folk sound like a fad'],1,
   'The author says “reinvented” suggests a deliberate makeover. Really, a creator lets new parts of themselves be heard.',
   'His objection is about the idea of a planned makeover. A creator isn’t repackaging; they’re letting new parts of themselves be heard.');}},

/* ---------- PART 4: YOUR VOICE ---------- */
{part:3,src:'Book I · Author Takes Shape',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">A great TV writer on where his voice came from</h1>');
  L.beats(L.card,[
   ['Who','David Milch created hit TV dramas, earned a fortune and lost millions, and also had shows that flopped. Late in life, with Alzheimer’s, he spoke with the author about creativity.'],
   ['Age fourteen','He remembered drinking with a friend in a basement as teenagers and swapping tall tales. As their inhibitions dropped, telling stories brought him a sense of relief and connection.'],
   ['The link','Over time, he said, he learned that creating feels much like that uninhibited storytelling.'],
   ['The core','Inspiration, he said, is when you don’t know what you’ll say next, but you trust yourself to say it anyway. That’s part of friendship too.']],
   'The author calls this the most basic form of your voice: trusting yourself to say what comes next.');}},
{part:3,src:'Book I · Author Takes Shape',run(L){
  L.h(L.kick('learn','What “voice” means')+'<h1 class="q">Your voice is a way of listening, not a job title</h1>'+
   L.prose('Your '+L.g('voice','voice')+' isn’t some pure identity like “scientist” or “musician.” It is simply the part of you that can listen <b>without judgment</b> to what your brain spits out.')+
   L.flow([['bulb','Bursts','A word, a feeling, a phrase: rarely a whole idea','',1],['eye','Listen','Notice them without judging','',2],['leaf','Seed corn','Raw seeds, but they are yours','',3]])+
   L.prose('The author calls these bursts '+L.g('seed-corn','seed corn')+'. They are not finished thoughts, but they are you.'));
  L.done();}},
{part:3,src:'Book I · Author Takes Shape',pts:1,
 solve:async L=>{const g=L.$('#cg').children;g[0].click();g[1].click();},
 run(L){
  const B=['rust on the ferry rail','the shipyard whistle','hands that smell of coffee','a river that won’t sit still','two accents, one kid','the last bus home'];
  const J=['cliché','too weird','too sad','pointless','too personal','been done'];const seen=new Set();
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Six bursts pop into Theo’s head on a walk home. Run them past an inner critic, then just listen. Try both.</h1><div id="cg"></div>'+
   '<div style="background:var(--soft);border-radius:16px;padding:14px;margin:8px 0 6px;min-height:130px"><div class="small" id="cc" style="margin-bottom:8px">Choose a mode above.</div><div id="cl"></div></div><div id="cq"></div>');
  ['Inner critic on','Listen without judging'].forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.innerHTML=L.ic(j?'eye':'alert')+n;
    b.onclick=()=>{[...L.$('#cg').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(j);
      L.$('#cl').innerHTML=B.map((x,k)=>j?'<span class="chip static ok">'+L.ic('leaf')+x+'</span>':'<span class="chip static" style="opacity:.4">'+L.ic('x')+x+' · '+J[k]+'</span>').join('');
      L.$('#cc').innerHTML=j?'<b>6 of 6</b> seeds kept to grow later':'<b>0 of 6</b> kept. Each was judged before it could grow.';
      if(seen.size===2&&!L.$('#cq').innerHTML){const q=L.$('#cq');q.innerHTML='<h2 class="sub">Which mode is what the author means by voice?</h2>';
        L.mc(q,['Listening without judging first','Keeping only the bursts that pass'],0,
         'Voice listens to the raw bursts without judging them. Choosing and shaping can come later.',
         'Filtering each burst as it arrives is the critic, not the voice. Voice listens first, without judgment.');}};
    L.$('#cg').appendChild(b);});}},
{part:3,src:'Book I · Author Takes Shape',run(L){
  L.h(L.kick('learn','All your selves')+'<h1 class="q">Bruce Springsteen on the car full of selves</h1>'+
   L.prose('As a kid, Springsteen saw Elvis on TV and glimpsed a freer world. To taste it, he says, you only had to risk being your true self. The author calls this your '+L.g('spice-rack','spice rack')+': the part that is uniquely you. Springsteen still had to fight a condemning voice from his father to hear his own.')+
   L.tiers([['people','Everyone rides along','Every self you have ever been is in the car.','Theo: shipyard kid, scholarship kid, café worker, cover player'],
            ['arrow','New selves can get in','But the old ones never get out.','Theo the songwriter climbs aboard'],
            ['compass','The real question','Who has their hands on the wheel right now?','',true,'Key idea']]));
  L.done();}},
{part:3,src:'Book I · Author Takes Shape',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Theo wants to “leave the café kid behind” to become a real songwriter. What does Springsteen’s car image suggest?</h1>');
  L.mc(L.card,['Old selves stay; choose who drives','Drop the old self before writing'],0,
   'The old selves can’t get out of the car. Each can take the wheel at different times, and all of them are material.',
   'In Springsteen’s image the old selves never leave. The question is who drives at a given moment, not who gets thrown out.');}},
{part:3,src:'Book I · Author Takes Shape',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Tap each piece until the sentence describes what the author means by finding your voice.</h1>');
  L.sentence(L.card,[['Judge','Listen to','Polish'],['the finished hits','the half-formed bursts','the scout’s notes'],['without judgment,','with a red pen,'],['and wait until you’re sure.','and trust what comes next.']],[1,1,0,1],
   [['Judging the bursts is exactly what shuts the voice down.','Polishing comes later. First you have to hear them.'],['Ideas rarely arrive finished. They come as fragments.','The scout’s notes are an outside voice, not yours.'],['A red pen is judgment. Voice listens first.'],['Milch’s point: you don’t know what comes next, but you trust yourself to say it anyway.']],
   'That’s the chapter’s idea of voice: hear the seed corn without judging it, and trust yourself to keep going.');}},
{part:3,src:'Book I · Author Takes Shape',run(L){
  L.h(L.kick('learn','Is struggle required?')+'<h1 class="q">Pain is common on the road to your voice. It isn’t the only road.</h1>'+
   L.prose('Swift, Springsteen, Milch and the author all struggled. In a world that pushes people to conform, the author says, hearing your own voice can take work. If you do suffer, you may as well get an honest look at your own spice rack out of it.')+
   L.prose('But lots of people struggle, creators or not, and creators may simply talk about it more. Finding your voice doesn’t require a showdown with your soul or coming apart.')+
   L.quote('There often is no lion.','Matt Richtel, closing “Author Takes Shape”')+
   '<p class="small">The next lesson explores why: what the lion is, and how to quiet it.</p>');
  L.done();}},
{part:3,src:'Book I · Author Takes Shape',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'True to the chapter?',['Fits the chapter','Not what it says'],[
   ['Theo must hit rock bottom before their real voice can appear.',1,'Struggle is common, but the chapter says it isn’t required.'],
   ['Amara’s lab skill is real, but skill alone isn’t creativity.',0,'The author says craft must come too, but expertise is not the same as creativity.'],
   ['Theo can want a big audience and still create from their own voice.',0,'Swift’s story shows ambition and an audience can coexist with creativity.'],
   ['Your voice is a fixed identity, like “real musician” or “scientist.”',1,'Voice is a way of listening without judgment, not a job title.'],
   ['Jun’s fear of the board laughing can feel like running from a lion.',0,'The author describes fear of others’ judgment as a lion of his own making.']]);}}
  ]
});
</script>
</body>
</html>
