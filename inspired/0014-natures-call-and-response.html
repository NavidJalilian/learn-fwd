<title>Nature’s Call-and-Response</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">

<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0014', title:'Nature’s call-and-response', minutes:19, icon:'cycle',
  goals:['Explain call-and-response: how a disruption sets off a burst of human creating','Spot what powered the pandemic burst: fear past doubt, group openness, connecting existing dots','Trace how one person’s spark becomes a cascade others build on'],
  parts:['The call','Connect the dots','Cascade','A muse arrives'],
  read:'Read “Nature’s Call-and-Response” in Book II for the full stories of Dr. Sonali Wilborn’s pop-up hospice and Tina Syer’s meal program.',
  glossary:{
    'group-openness':'Group openness: the book’s phrase for people cooperating and sharing ideas across borders, like a whole group being curious and open together.',
    cascade:'Creativity cascade: the book’s image for one spark that others pick up and build on, each step adding something, until it grows far beyond the first idea.'
  },
  cheatsheet:[
    '<b>Call-and-response:</b> a disruption (the call) sets off a burst of creating (the response). The virus mutated; people answered by combining ideas across borders.',
    'Even <b>rule-bound</b> people create under real fear: doctors used sleep-apnea machines, salon hair dryers and flipping patients onto their stomachs.',
    'What powered the burst: fear strong enough to push past <b>doubt</b>, <b>group openness</b> across borders, and a furious <b>connecting of dots</b>.',
    'Dr. Wilborn didn’t invent hospice or protective gear. She <b>connected existing dots</b>: a pop-up hospice in 8 days instead of about 18 months.',
    'Creators of <b>all ages</b> respond: a seventeen-year-old built a site tracking accurate pandemic news.',
    'Tina Syer’s highway <b>aha</b> (“we have kitchens”) became a <b>cascade</b>: her organization, chefs, a news story, then donations.',
    'Rhiannon Giddens’s idea hit while rewatching an old song; she pictured far-flung collaborators and reached them by technology.',
    'Next: how the mind does all this. That’s Book III, the brain.'
  ],
  steps:[
/* ---------- PART 1: THE CALL ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">The spring flood has closed Alder Commons for weeks. Who is likely to come up with clever fixes?</h1>');
  L.mc(L.card,['Mostly the members known as “the creative ones”','People of every kind, even the most by-the-book'],1,
   'A real crisis pulls ideas out of people who don’t usually think of themselves as inventors. That’s this lesson.',
   'Crises tend to pull ideas out of everyone, including people who normally follow the rules closely. This lesson shows how.');}},
{part:0,src:'Book II · Nature’s Call-and-Response',run(L){
  L.h(L.kick('learn','Call-and-response')+'<h1 class="q">Nature made something new. People answered with new things of their own.</h1>'+
   L.prose('The last lesson showed the virus as nature’s accidental creation. This chapter shows the reply: a fierce burst of human creating under pressure.')+
   L.flow([['flask','The call','a disruption: the virus spreads','',4],['people','The response','people combine ideas to fight back','',2],['cycle','Again','new problems, new creations','',3]])+
   L.prose('The author says that in 2020 the two kinds of creating were almost the same. The virus appeared by mutation. Then scientists, officials, entrepreneurs and artists combined ideas across borders, fitting pieces together like splicing genes. The book calls this '+L.g('call-response','call-and-response')+'.'));
  L.done();}},
{part:0,src:'Book II · Nature’s Call-and-Response',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">Hospitals fear running out of ventilators</h1>');
  L.beats(L.card,[
   ['The setup','Doctors are known for following rules, and for good reason. You want them matching your symptoms to known patterns, not improvising.'],
   ['The fear','In 2020, hospitals feared they would run short of ventilators, the machines that breathe for very sick patients.'],
   ['Idea 1','On Long Island, doctors kept many patients breathing with machines made for people with sleep apnea.'],
   ['Idea 2','Engineers in New York turned hooded hair-salon dryers into small chambers that delivered oxygen and kept the virus from spreading to staff.'],
   ['Idea 3','Lung doctors across the country simply flipped struggling patients onto their stomachs, which raised their oxygen levels.'],
   ['The result','These improvised fixes helped many hospitals get through the surge. One doctor called the crisis a huge spur for creativity and collaboration.']],
   'The book reported this through a fellow reporter’s story: fear unleashed creativity in some of the most rule-bound people around.');}},
{part:0,src:'Book II · Nature’s Call-and-Response',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Why does the book find the doctors’ story especially telling?</h1>');
  L.mc(L.card,['Doctors were already known as the most inventive profession','Doctors normally follow strict rules, yet fear set ideas loose','Doctors were paid extra to invent new devices'],1,
   'The author stresses that doctors aren’t uncreative; their work asks them to hold back. Real fear released those ideas.',
   'The point is the contrast: doctors’ training rewards sticking to known patterns. The crisis, not money or reputation, unleashed their creativity.');}},
{part:0,src:'Book II · Nature’s Call-and-Response',run(L){
  L.h(L.kick('learn','What powered the burst')+'<h1 class="q">Three forces came together</h1>'+
   L.list([['flame','Fear past doubt','The fear was so strong it forced people to drop '+L.g('doubt','doubt')+', the fear of being judged for their ideas.'],
     ['people','Group openness','People cooperated across borders. The book calls this a kind of '+L.g('group-openness','group openness')+'.'],
     ['layers','Connecting dots','A furious joining of existing pieces into new uses, not inventing everything from nothing.']],1)+
   L.prose('Almost every part of life changed a little, the author says, through people adapting with creativity.'));
  L.done();}},
{part:0,src:'Book II · Nature’s Call-and-Response',pts:4,run(L){
  L.h(L.kick('pr','Name the force')+'<h1 class="q">Alder Commons members respond to the flood. Which force shows most clearly in each?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Fear past doubt','Group openness','Connecting dots'],[
   ['Amara, who usually waits until a design is perfect, puts rough sensors on homes the same week because the river is still rising',0,'Real danger beat Amara’s usual fear of showing half-finished work.'],
   ['Makers in three other river towns send Amara their sensor designs and test data overnight',1,'Sharing across town lines is the group openness the book describes.'],
   ['Jun turns old shop scrap and a cement mixer into a sandbag-filling rig',2,'Nothing new was invented; Jun joined existing pieces into a new use.'],
   ['Lena, nervous about looking silly, posts a messy video lesson for the Young Makers anyway',0,'The kids’ need outweighed the fear of judgment.']],
   'Under a real threat, all three show up at once: doubt shrinks, people share, and old pieces find new jobs.');}},

/* ---------- PART 2: CONNECT THE DOTS ---------- */
{part:1,src:'Book II · Nature’s Call-and-Response',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">Dr. Sonali Wilborn and the pop-up hospice</h1>');
  L.beats(L.card,[
   ['Who','Dr. Wilborn, a physician in Michigan, helps people die in better ways through hospice care (care that keeps dying people comfortable). She was medical chief of a hospice group across sixteen regions in the US South.'],
   ['The problem','In 2020, people were dying alone. Hospitals and nursing homes couldn’t safely allow visitors.'],
   ['Willie','On a video call she heard about Willie, a dying man in New Orleans, long estranged from his son, who longed to see his family.'],
   ['The idea','On March 30 she knew what to do: a new kind of inpatient hospice unit, safe enough that families could visit in full protective gear.'],
   ['Eight days','Opening such a unit normally takes about eighteen months of red tape. Her team did it in eight days. Willie said hello and goodbye to his son.'],
   ['After','By that fall the unit had served eighty-nine people who might otherwise have died without human contact, and other groups copied the approach.']],
   'A real need, a fast idea, and a team willing to move: fewer people died alone.');}},
{part:1,src:'Book II · Nature’s Call-and-Response',run(L){
  L.h(L.kick('learn','Connecting, not inventing')+'<h1 class="q">She didn’t invent anything new. She connected what was there.</h1>'+
   L.quote('People thought I was crazy.','Dr. Sonali Wilborn, on her pop-up hospice')+
   L.prose('The book is clear: Dr. Wilborn didn’t invent hospice, and she didn’t invent protective equipment. She joined existing pieces in a new way, at a moment that needed it.')+
   L.flow([['shield','Existing','hospice care','',1],['lock','Existing','protective gear','',1],['home','New combination','a safe pop-up unit for family goodbyes','',2]])+
   '<p class="small" style="margin-top:10px">Most creating in a crisis looks like this: dots you’ve already seen, joined quickly.</p>');
  L.done();}},
{part:1,src:'Book II · Nature’s Call-and-Response',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">What made Dr. Wilborn’s pop-up hospice creative, in the book’s view?</h1>');
  L.mc(L.card,['She invented a new kind of protective gear for visitors','She persuaded regulators to scrap hospice safety rules','She combined existing hospice care and protective gear in a new way'],2,
   'Old pieces, new combination, perfect moment. That’s connecting dots.',
   'The book stresses she invented neither hospice nor protective gear, and kept safety central. Her creation was the new combination.');}},
{part:1,src:'Book II · Nature’s Call-and-Response',pts:1,run(L){
  L.h(L.kick('pr','Advice for Amara')+'<h1 class="q">The river may rise again within a month. Amara wonders where to start on a better warning system. What fits this chapter best?</h1>');
  L.mc(L.card,['Combine the levee sensors, the hospital fridge-alarm logic and the town’s text alerts','Spend a year designing a brand-new waterproof chip from scratch','Wait until the board agrees on a full plan before building anything'],0,
   'Like Dr. Wilborn, Amara can join pieces that already exist and have something working before the next rise.',
   'With a month to go, a from-scratch design or a long wait helps nobody. The chapter’s crisis creators joined existing pieces quickly.');}},
{part:1,src:'Book II · Nature’s Call-and-Response',run(L){
  L.h(L.kick('learn','Creators of all ages')+'<h1 class="q">The response came from old scholars and teenagers alike</h1>'+
   L.prose('In March 2020, right after the pandemic began, a seventeen-year-old in Washington State built a website that searched the internet for accurate information on the virus and the response to it.')+
   L.prose('The author asks us to marvel at the whole chain of creating that let scientists find, describe and fight the virus. That, he says, is the creative tension at its core: disruption and response.')+
   L.note('A crisis doesn’t check your age or your job title before it asks for ideas.','people'));
  L.done();}},
{part:1,src:'Book II · Nature’s Call-and-Response',pts:1,run(L){
  L.h(L.kick('pr','Young Makers')+'<h1 class="q">Sol, age ten, wants to help after the flood with a hand-drawn map of which streets are dry. Lena says, “Leave the flood to the grown-ups.” What does the chapter suggest?</h1>');
  L.mc(L.card,['Lena is right: a crisis needs experts and proven tools','Let Sol try it: crisis responses come from every age','Let Sol try, but only once it’s as polished as an adult’s'],1,
   'The book’s seventeen-year-old shows that young creators answer the call too. Sol’s map may help neighbors right now.',
   'The chapter celebrates creators of all ages, including a teenager’s website. Waiting for polish, or for experts only, leaves useful ideas unused.');}},

/* ---------- PART 3: CASCADE ---------- */
{part:2,src:'Book II · Nature’s Call-and-Response',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">Tina Syer’s aha on the highway</h1>');
  L.beats(L.card,[
   ['Where','Syer worked for the Boys & Girls Club of the Peninsula, which served poor families near Palo Alto, one of the richest and most unequal regions in the world.'],
   ['The call','On March 19, 2020, driving to the club, she realized it would have to close for lockdown. The kids would lose the meals they got at school and at the club.'],
   ['The aha','Then it hit her: the clubhouses had good kitchens. The club had been serving 350 dinners a night.'],
   ['Little power','Syer was new there. She had a spark, but not much certainty or influence.'],
   ['Handed on','She passed the idea to her organization. Its chief executive and staff turned an education program into a huge takeout kitchen, with local restaurant chefs cooking.'],
   ['Scale','Two sites served more than 2,000 free meals a night and passed 100,000 meals in all.']],
   'A new staffer’s idea grew big because others took it up and built on it.');}},
{part:2,src:'Book II · Nature’s Call-and-Response',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Syer had little influence in her new job. What turned her aha into thousands of meals?</h1>');
  L.mc(L.card,['She ran the whole kitchen operation herself, night after night','She handed the idea to her organization, and others built on it','She waited until she had enough authority to give orders'],1,
   'The spark was hers; the scale came from people who picked it up and added their own skills.',
   'Syer didn’t run it alone or wait for authority. She passed the spark on, and the club’s leaders, staff and chefs grew it.');}},
{part:2,src:'Book II · Nature’s Call-and-Response',pts:1,
 solve:async L=>{L.$('#cas').click();},
 run(L){
  const S=[['bulb','Syer’s aha'],['people','Club leaders and staff'],['bowl','Local chefs'],['pencil','The author’s news story'],['book','Editors publish it'],['trend','Over $500,000 in donations']];
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Watch how one idea on a highway grew. Press the button.</h1>'+
   '<div class="ladder" id="cl"></div><button class="btn pri" id="cas">'+L.ic('play')+'Start the cascade</button><div id="cq"></div>');
  L.$('#cl').innerHTML=S.map((x,j)=>(j?'<div class="conn"></div>':'')+'<div class="rung" id="r'+j+'" style="opacity:.25">'+L.ic(x[0])+' '+x[1]+'</div>').join('');
  L.$('#cas').onclick=function(){this.remove();let k=0;
    const iv=setInterval(()=>{const el=L.$('#r'+k);if(!el){clearInterval(iv);return;}el.style.opacity='1';el.classList.add('cur');if(k>0){const pr=L.$('#r'+(k-1));if(pr)pr.classList.remove('cur');}k++;
      if(k>=S.length){clearInterval(iv);const q=L.$('#cq');
        q.innerHTML='<p class="small" style="margin-top:10px">The author adds that his story stood on others’ work too: the people who built the newspaper, took it online, and created the internet.</p><h2 class="sub">What does this cascade show?</h2>';
        L.mc(q,['A spark grows as each person builds on the step before','A good idea spreads on its own if it is clever enough'],0,
         'The book calls it a creativity cascade, born of urgency and fear, and fed by each person’s own spark.',
         'Nothing here spread by itself. Each step was a person choosing to build on the last one, all the way to the donations.');}},350);};}},
{part:2,src:'Book II · Nature’s Call-and-Response',pts:1,run(L){
  L.h(L.kick('pr','Theo’s cascade')+'<h1 class="q">Theo has an idea to raise repair money for the flooded Commons. Put the cascade in the order it most likely grows.</h1>');
  L.order(L.card,['Theo plans a livestream concert from the dry upstairs music room','Musicians from other river towns offer to join by video','The Alder Falls paper writes up the lineup','Donations come in for the ground-floor repairs'],
   'Like Syer’s meals, one spark grows as others pick it up: musicians, then the paper, then donors.',['Spark','Others join','Word spreads','Result']);}},

/* ---------- PART 4: A MUSE ARRIVES ---------- */
{part:3,src:'Book II · Nature’s Call-and-Response',run(L){
  L.h(L.kick('ex','Two stories from the book')+'<h1 class="q">A nephew and an aunt answer the call</h1>');
  L.beats(L.card,[
   ['Justin','Justin Harrington, Rhiannon Giddens’s nephew, spent lockdown alone in his bedroom in Greensboro, North Carolina, making an album. It energized him, then depressed him.'],
   ['Unmoved','The early protests didn’t stir him. He felt he’d seen people march before and go home defeated.'],
   ['The switch','In mid-May he saw a video of protests in his own downtown. He and his mother packed their van with masks and water to support the marchers, and saw his friends leading. Something switched on: this was what he was meant to do.'],
   ['Rhiannon','In June 2020, at her kitchen table in Ireland, Giddens saw a fan praise a song she’d written in 2015 after a mass shooting at a Charleston church. She rewatched it, and the idea hit.'],
   ['The vision','A bigger, grander version: she could picture Yo-Yo Ma on cello and the ballet dancer Misty Copeland dancing. She began reaching out across the distance by technology.']],
   'Both went from stuck to inspired when the moment called. Justin went on to make something mixing policy and art; Giddens set out to make her song bigger with far-flung collaborators.');}},
{part:3,src:'Book II · Nature’s Call-and-Response',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">What made Giddens’s new version possible from her kitchen table in Ireland?</h1>');
  L.mc(L.card,['Technology that lets people collaborate from far away','A record label that flew her collaborators to Ireland','Writing a completely new song from scratch'],0,
   'The book notes that technology allows far-flung collaboration as never before.',
   'She reworked her own 2015 song, and she reached Yo-Yo Ma and Misty Copeland in her mind and then by technology, not by travel.');}},
{part:3,src:'Book II · Nature’s Call-and-Response',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Tap each piece to describe Theo’s response the way this chapter would.</h1>');
  L.sentence(L.card,[['A record deal','The flood'],['stirred an idea in','was ignored by'],['Theo, who reached musicians in','Theo, who flew musicians from'],['other towns by video','the city to Alder Falls']],[1,0,0,0],
   [['The scout and the deal aren’t the call here. The flood is the disruption.'],['Theo answered the call; nothing was ignored.'],['Like Giddens, Theo used technology, not travel.'],['The musicians are in other river towns, joining by livestream.']],
   'The flood was the call; Theo’s livestream, built with far-flung musicians, is the response.');}},
{part:3,src:'Book II · Nature’s Call-and-Response',run(L){
  L.h(L.kick('learn','What unites these stories')+'<h1 class="q">All of it came from the human mind</h1>'+
   L.prose('Doctors, a hospice leader, a teenager, a club fundraiser, a young musician and a famous one. The author says what unites them is the great power of the human mind to innovate.')+
   L.tiers([['flask','Book II','Creativity follows the laws of nature: random novelty, a niche, and call-and-response.','this lesson',true,'Done'],
            ['bulb','Book III','A look inside the creator’s brain and body: how the mind actually makes ideas.','next lesson']])+
   L.prose('And the pattern keeps going: every response changes the world a little, which sets up the next call.'));
  L.done();}},
{part:3,src:'Book II · Nature’s Call-and-Response',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Call or response?',['The call','A response'],[
   ['The river floods the warehouse’s ground floor.',0,'A disruption that demands an answer.'],
   ['Lena drops craft kits on porches and runs Young Makers by video.',1,'An answer to the kids losing their room.'],
   ['With the Commons closed, the kids lose their only after-school space.',0,'A new problem the flood created. It calls for a response.'],
   ['Amara’s sensors text riverside homes when the water climbs.',1,'A creation built to answer the flood threat.'],
   ['Theo’s café job pauses while the café counter dries out.',0,'Another problem the flood created. Theo’s livestream is one answer.']]);}}
  ]
});
</script>

</html>
