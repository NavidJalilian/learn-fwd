<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Where Ideas Collide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0011', title:'Where ideas collide', minutes:19, icon:'people',
  goals:['Explain why bigger, denser places produce more ideas per person','Tell sharing ideas across distance from slow trial and error, and use both','Judge a creative life by your own terms, not someone else’s picture of success'],
  parts:['Cities','Sharing','Own terms','Noise'],
  read:'Read “Enter a Physicist” and “A Funny Thing Happened on the Way to a Platinum Record” in Book II for Geoffrey West’s full story and Justin Sandercoe’s.',
  glossary:{
    'scaling':'Scaling law: a math rule for how things change as size grows. Geoffrey West found that cities follow one: double the people and output per person rises by about 15%.',
    'gene-transfer':'Horizontal gene transfer: when one microbe passes a ready-made defense straight to a neighbor that lacks it, instead of each one waiting for its own lucky mutation.'
  },
  cheatsheet:[
    'Geoffrey West: life follows <b>scaling laws</b>. Double an animal’s size and it needs only about 75% more energy, not twice as much.',
    'Double a city and each person produces about <b>15% more</b>: wealth, patents, and also crime and pollution. The cause is more people bumping into each other.',
    '<b>Perfectionism is creativity’s public enemy #1.</b> If you wait to be 100% right, you never venture. Every rule has exceptions.',
    'Even Newton’s lonely plague-year breakthroughs stood on the shoulders of others.',
    '<b>Horizontal gene transfer</b>: microbes pass defenses to neighbors. People now pass ideas across the world, since the internet frees us from space.',
    'Justin Sandercoe missed the record deal and built a free guitar school instead. Creativity isn’t someone else’s idea of success.',
    'West worries life is <b>speeding up</b> faster than we can adapt. Richtel’s hope: quiet minds that turn down the outside noise, and a future <b>Big C</b> leader.'
  ],
  steps:[
/* ---------- PART 1: CITIES ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Amara Diallo is stuck on how to keep the flood sensors dry. Where are fresh ideas more likely to turn up?</h1>');
  L.mc(L.card,['Working alone in the garage for a month','At a busy Idea Night full of other makers'],1,
   'More people means more chances to bump into a useful idea. This lesson shows that this hunch has real math behind it.',
   'Quiet time has its place, but more people means more chances to bump into a useful idea. This lesson shows there is math behind that hunch.');}},
{part:0,src:'Book II · Enter a Physicist',run(L){
  L.h(L.kick('learn','A physicist’s question')+'<h1 class="q">Can math explain how life works?</h1>'+
   L.prose('Geoffrey West grew up in London in a tense home and found comfort in math. As a kid, he solved a homework problem about how far you can see from a cliff and wondered: maybe the whole world works like this.')+
   L.prose('He became a physicist, then drifted toward biology. He found that animals and plants follow the same <b>'+L.g('scaling','scaling law')+'</b>. Double an animal’s size and it needs only about 75% more energy, not twice as much.')+
   L.note('Richtel notes what great creators share: deep curiosity, humility, and an appetite for open, wandering conversation. West spent hours trading ideas with him.','people'));
  L.done();}},
{part:0,src:'Book II · Enter a Physicist',run(L){
  L.h(L.kick('learn','Cities follow the math too')+'<h1 class="q">Double a city, and each person gets more productive</h1>'+
   L.prose('West and physicist Luís Bettencourt applied the same thinking to cities. When a city doubles in population, it needs only about <b>85% more</b> pipes, gas stations and grocery stores. Bigger is more efficient.')+
   L.flow([['people','Double the people','200%'],['home','Roads and pipes','about 185%','less than double',2],['bulb','Wealth, patents','about 215%','more than double',1]])+
   L.prose('What the city <i>produces</i> rises faster than its size. Each person is about <b>15% more productive</b> than in a city half as big. That includes new ideas, measured by patents, but also crime and pollution.'));
  L.done();}},
{part:0,src:'Book II · Enter a Physicist',pts:1,
 solve:async L=>{L.$('#po').children[2].click();L.$('#dbl').click();},
 run(L){
  let p=null;const N=['People','Pipes and stores','New patents','Crime and pollution'],T=[200,185,215,215],C=['var(--h2)','var(--h3)','var(--ok-strong)','var(--no)'];
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">Imagine Alder Falls doubles in size. What happens to the number of new patents?</h1><div id="po"></div>'+
   '<div id="sim" hidden><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px;flex-wrap:wrap"><div class="small">Bars show size compared with today (today = half the bar)</div><button class="btn pri" id="dbl">'+L.ic('play')+'Double the town</button></div>'+
   N.map((n,j)=>'<div class="meterrow"><div class="lb">'+n+' <span class="small" id="v'+j+'">100%</span></div><div class="meter"><div id="m'+j+'" style="width:46%;background:'+C[j]+'"></div></div></div>').join('')+'</div>');
  ['Less than double','Exactly double','More than double'].forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=n;b.onclick=()=>{if(p!==null)return;p=j;b.classList.add('sel');L.$('#sim').hidden=false;};L.$('#po').appendChild(b);});
  L.$('#dbl').onclick=function(){this.remove();let s=0;
    const t=setInterval(()=>{s++;const f=s/10;let gone=false;
      T.forEach((v,j)=>{const m=L.$('#m'+j),x=L.$('#v'+j);if(!m||!x){gone=true;return;}const now=Math.round(100+(v-100)*f);m.style.width=Math.round(now*0.46)+'%';x.textContent=now+'%';});
      if(gone){clearInterval(t);return;}
      if(s>=10){clearInterval(t);L.award(p===2);
        L.sheet(p===2?'ok':'no',p===2?'You called it':'More than double','Ideas grew faster than the town: about 215% of today, so roughly 15% more per person. Pipes grew less than the people did. And crime and pollution rose just as fast as the patents. West’s math cuts both ways.');L.done();}},150);};}},
{part:0,src:'Book II · Enter a Physicist',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Why does West say people in bigger cities produce more ideas each?</h1>');
  L.mc(L.card,['Bigger cities attract smarter people','People have more encounters with each other','Big cities have more money for research'],1,
   'West’s explanation is more interactions per unit of time. Ideas get swapped, compete and get refined.',
   'West doesn’t credit smarter people or bigger budgets. His point is that more people bump into each other more often, so more ideas get exchanged and refined.');}},
{part:0,src:'Book II · Enter a Physicist',pts:1,run(L){
  L.h(L.kick('pr','Put it in order')+'<h1 class="q">Order the chain that turns a crowded town into more ideas.</h1>');
  L.order(L.card,['More people live close together','They bump into each other more often','Ideas get swapped, compete and get refined','More new ideas per person'],
   'Density leads to encounters, encounters lead to exchange, and exchange leads to more ideas. That’s why the book calls cities like Florence, Jerusalem and Silicon Valley idea machines.');}},
{part:0,src:'Book II · Enter a Physicist',run(L){
  L.h(L.kick('ex','Two side stories from the chapter')+'<h1 class="q">The crayfish and the apple</h1>');
  L.beats(L.card,[
   ['Critics pounce','Some scientists found exceptions to West’s scaling law. The crayfish, for example, didn’t seem to fit.'],
   ['West shrugs','Every rule has exceptions, he said. Only hunting for flaws is just note-taking, not science.'],
   ['The lesson','If you wait to be 100% right, you’ll never venture. Richtel calls <b>perfectionism the public enemy #1 of creativity</b>.'],
   ['The apple','West says great ideas almost always come from cities. The rare exception: in 1665 the plague drove young Isaac Newton to the countryside, where he laid the groundwork for calculus and gravity.'],
   ['Not so alone','Even Newton credited others. He said he saw further by standing on the shoulders of giants.']],
   'Don’t wait for perfect. And even “lone” breakthroughs are built on other people’s ideas.');}},
{part:0,src:'Book II · Enter a Physicist',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Perfectionism or venturing?',['Waiting for perfect','Venturing'],[
   ['Amara won’t test a sensor on the levee until it works in every kind of storm.',0,'That standard can never be met. Testing an imperfect sensor is how Amara learns what fails.'],
   ['Theo plays a half-finished song at an open mic to see how it lands.',1,'Putting a rough version out is venturing. It gives Theo real reactions to work with.'],
   ['Jun hears that the ferry idea has one flaw and starts fixing that flaw instead of dropping the plan.',1,'Like West with the crayfish, Jun treats the flaw as an exception to handle, not a reason to quit.'],
   ['Lena delays the Young Makers showcase until every project looks polished.',0,'Waiting for polish keeps the kids from ever sharing. That’s perfectionism, the book’s public enemy #1.']]);}},

/* ---------- PART 2: SHARING ---------- */
{part:1,src:'Book II · Enter a Physicist',run(L){
  L.h(L.kick('learn','Microbes that share')+'<h1 class="q">A shortcut past slow mutation</h1>'+
   L.prose('In the last lesson, microbes beat drugs through random mutations: slow trial and error. While reporting on a drug-resistant fungus called <i>Candida auris</i>, Richtel learned about a faster route.')+
   L.prose('A fungus in trouble can get a ready-made defense from a neighbor that already has one. Researchers call this <b>'+L.g('gene-transfer','horizontal gene transfer')+'</b>. It is a kind of cooperation, and it happens when the fungi are touching.')+
   L.lanes([['cycle','Mutation','Each microbe waits for its own lucky copying error.',3],['people','Gene transfer','A neighbor hands over a defense that already works.',2]])+
   L.prose('People in crowded cities do the same with ideas. They share what works, which gives everyone a platform to build on.'));
  L.done();}},
{part:1,src:'Book II · Enter a Physicist',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">Sharing knowledge without touching</h1>');
  L.beats(L.card,[
   ['The team','For the fungus series, Richtel and his fellow reporters and video crew were spread across the country.'],
   ['The sources','He interviewed experts by phone and internet from Russia, China, Brazil, South Africa, Israel and many other places.'],
   ['The video','Part of it was shot in his living room by producers based in New York. It drew over a million views and two Emmy nominations.'],
   ['The effect','The stories helped change policy in places the team had never visited.'],
   ['West’s view','Telephones and railroads already shrank distance. The internet speeds it up.']],
   'Microbes must touch to share. People no longer need to. Knowledge can now transfer across great distances.');}},
{part:1,src:'Book II · Enter a Physicist',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Amara swaps flood-sensor designs online with makers in other river towns. Which process is that most like?</h1>');
  L.mc(L.card,['Each fungus waiting for its own lucky mutation','A fungus handing its defense to a neighbor'],1,
   'Amara gets designs that already work elsewhere, just like a passed-on defense. And thanks to the internet, the makers don’t need to be next door.',
   'Waiting for your own lucky break is mutation. Getting a design that already works from someone else is like horizontal gene transfer.');}},
{part:1,src:'Book II · Enter a Physicist',pts:5,run(L){
  L.h(L.kick('pr','Made here, or passed over?')+'<h1 class="q">Sort each step in the flood-sensor project.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Own trial and error','Shared by others'],[
   ['Amara prints 20 case designs and keeps the 3 that don’t leak',0,'Making many tries and keeping the survivors is the mutation route.'],
   ['A maker two towns away posts a waterproof seal that already works',1,'A ready-made fix passed over: that’s the transfer route.'],
   ['An engineer overseas answers Amara’s question in a forum overnight',1,'Knowledge crossed an ocean in hours. No touching required.'],
   ['Amara tests five battery setups through a storm to see which lasts',0,'Testing your own variations is trial and error.'],
   ['Young Makers copy Amara’s wiring diagram for a class project',1,'The kids got a working design handed to them, then can build on it.']],
   'Good creators use both: their own trial and error, and the ideas others pass along.');}},

/* ---------- PART 3: OWN TERMS ---------- */
{part:2,src:'Book II · A Funny Thing Happened on the Way to a Platinum Record',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">The song that came from nowhere</h1>');
  L.beats(L.card,[
   ['Before','Justin Sandercoe grew up on remote Tasmania, learning guitar from records and the radio. Later, in London, he taught free guitar lessons online and wrote songs that few people heard.'],
   ['The idea','One summer day in 2012, sitting in his garden with his mind deliberately blank, three words arrived. He ran inside and wrote a whole song in under an hour, on a bass, the first instrument he could find.'],
   ['The hit','He shared it with one of his students, the British star Katie Melua. She recorded it, and the album went platinum.'],
   ['The call','The head of a major music publisher phoned to offer him a record deal. Sandercoe felt he’d won the lottery.'],
   ['The meeting','He played his other songs. The executive said they were okay, and asked if he had more like the hit. He didn’t. That was the end of the deal.']],
   'The deal fell through. The next screen shows why the book calls this a beginning, not an ending.');}},
{part:2,src:'Book II · A Funny Thing Happened on the Way to a Platinum Record',run(L){
  L.h(L.kick('learn','Success on your own terms')+'<h1 class="q">The rock-star dream was too small</h1>'+
   L.prose('Sandercoe kept teaching. Today about thirty thousand students a month take his lessons, still free, paid for by donations. A British newspaper columnist called him one of the most influential guitar teachers in history.')+
   L.prose('He shaped a whole life around creativity and brought it to the masses. Richtel argues that’s bigger than the rock-star life many picture.')+
   L.note('A family friend once tried painting, hated it, and decided he wasn’t creative. He then made a fortune through inventive real-estate deals, yet still says he isn’t creative. Creativity isn’t <b>someone else’s picture</b> of what it should look like.','star'));
  L.done();}},
{part:2,src:'Book II · A Funny Thing Happened on the Way to a Platinum Record',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">What does the book see as Sandercoe’s real creative success?</h1>');
  L.mc(L.card,['Writing a song for a platinum album','Building a creative life his own way','Finally signing with a big label'],1,
   'The song was great, but the book’s point is the life he built: a free school reaching students worldwide.',
   'He never signed, and the platinum song is only part of the story. The book celebrates the life he built: a free guitar school on his own terms.');}},
{part:2,src:'Book II · A Funny Thing Happened on the Way to a Platinum Record',pts:1,run(L){
  L.h(L.kick('pr','Theo’s version')+'<h1 class="q">The label scout tells Theo Brandt the same thing: “More like that one song, please.” Theo can’t produce it on demand. What does Sandercoe’s story suggest Theo remember?</h1>');
  L.mc(L.card,['Keep forcing copies of the hit until one lands','One person’s “no” doesn’t define a creative life'],1,
   'The scout’s view is one picture of success. Theo’s creative life can take a shape the scout never imagined, as Sandercoe’s did.',
   'Sandercoe’s hit arrived when he wasn’t trying, and he couldn’t make more on demand. The lesson is that one person’s “no” doesn’t define a creative life.');}},
{part:2,src:'Book II · A Funny Thing Happened on the Way to a Platinum Record',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Creative, even if it doesn’t look “artsy”?',['Yes, it counts','Not by itself'],[
   ['Ruth, the board chair, invents a new way for members to share tool costs that saves the Commons money.',0,'It’s new and has value. Like the real-estate friend, Ruth is creative even without a paintbrush.'],
   ['Jun recites the same welcome speech at every Idea Night, word for word.',1,'Repeating the same thing isn’t new. Creativity needs novelty.'],
   ['Sol, age ten, teaches younger kids a trick for fixing a bike chain, posted as a video.',0,'A fresh way of teaching something useful counts, just like Sandercoe’s lessons.'],
   ['Theo buys a pricier guitar hoping it will make them creative.',1,'Gear isn’t a creation. What Theo makes with it might be.']]);}},
{part:2,src:'Book II · A Funny Thing Happened on the Way to a Platinum Record',run(L){
  L.h(L.kick('learn','The New Jerusalem')+'<h1 class="q">The idea machine is now everywhere</h1>'+
   L.prose('The book opened in ancient Jerusalem, a crowded hub where people spoke, listened and refined lasting ideas. West’s research backs this up: denser places produce more new ideas.')+
   L.quote('The internet in some senses frees us from space.','Geoffrey West')+
   L.prose('Patents shared by inventors across borders rose from about 99,000 in 1999 to almost 143,000 in 2018. A teenager dancing at home reached a hundred million followers. During COVID-19, people worked from anywhere and many left big cities.')+
   L.prose('Richtel’s conclusion: the New Jerusalem is <b>everyplace</b>.'));
  L.done();}},

/* ---------- PART 4: NOISE ---------- */
{part:3,src:'Book II · A Funny Thing Happened on the Way to a Platinum Record',run(L){
  L.h(L.kick('learn','The catch')+'<h1 class="q">West worries that time is speeding up</h1>'+
   L.flow([['people','More connection','More ideas collide'],['bulb','More creations','Each with side effects'],['clock','Faster change','More new fixes needed']])+
   L.prose('Connection drives innovation, and innovation creates new problems that demand even faster innovation. West says life has sped up, and warns we may reach a point where we can’t adapt fast enough.')+
   L.prose('It’s the creativity paradox from lesson 1, running at internet speed.'));
  L.done();}},
{part:3,src:'Book II · A Funny Thing Happened on the Way to a Platinum Record',run(L){
  L.h(L.kick('learn','Two reasons for hope')+'<h1 class="q">Richtel’s answer to West</h1>'+
   L.list([['eye','Quiet, untapped minds','Most of us hold creative power we’ve kept at arm’s length. It comes from a calm mind that listens to itself, not from absorbing every outside voice and shouting back.'],
     ['star','A new leader','History keeps producing great leaders with Big C vision who reframe how people see the world. West agrees: the great innovation we need is a leader. Only the timing is unknown.']],2)+
   '<p class="small" style="margin-top:10px">Richtel calls today’s angry back-and-forth online a “supercollider” that spins up chaos. Feeding it drowns out your own voice.</p>');
  L.done();}},
{part:3,src:'Book II · A Funny Thing Happened on the Way to a Platinum Record',pts:1,
 solve:async L=>{L.$('#ev').children[0].click();L.$('#ev').children[1].click();},
 run(L){
  const E=[['Feed the supercollider','Amara spends the evening reading every post about the grant cut and replying angrily. By midnight Amara is furious and has made nothing.','no'],
           ['Turn down the volume','Amara mutes the thread, sits with the sensor and lets their mind settle. Around ten, an idea for a cheaper float arrives.','ok']];const seen=new Set();
  L.h(L.kick('pr','Toggle and compare')+'<h1 class="q">The city posts that the Commons grant may be cut. Try both ways Amara could spend the evening.</h1><div id="ev"></div><div id="eo" style="background:var(--soft);border-radius:16px;padding:14px;margin:8px 0;min-height:90px" class="small">Choose an evening above.</div><div id="eq"></div>');
  E.forEach((e,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=e[0];b.onclick=()=>{[...L.$('#ev').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(j);
    L.$('#eo').innerHTML='<span style="color:var(--'+e[2]+')">'+e[1]+'</span>';
    if(seen.size===2&&!L.$('#eq').innerHTML){const q=L.$('#eq');q.innerHTML='<h2 class="sub">Which of Richtel’s reasons for hope did the second evening use?</h2>';
      L.mc(q,['A great new leader','A quiet mind listening to itself'],1,'Amara turned the outside volume down and heard their own ideas. That’s the untapped resource Richtel means.','No leader appeared. Amara simply quieted the outside noise, which is Richtel’s first reason for hope.');}};L.$('#ev').appendChild(b);});}},
{part:3,src:'Book II · A Funny Thing Happened on the Way to a Platinum Record',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Tap each piece until the sentence sums up this lesson’s advice for Alder Commons.</h1>');
  L.sentence(L.card,[['Avoid','Seek out'],['other makers, near and far,','only perfect plans,'],['and turn down','and turn up'],['the outside noise.','your own voice.']],[1,0,0,0],
   [['Avoiding others cuts off the collisions that produce ideas.'],['Waiting for perfect plans is the perfectionism trap.'],['Turning up the outside volume drowns your voice. You want it lower.'],['You want your own voice louder, not quieter. Turning it down misses the point.']],
   'Collide with other people’s ideas, near and far, but keep the outside chatter low enough to hear yourself.');}},
{part:3,src:'Book II · Enter a Physicist',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Mixed review: which idea fits?',['Scaling','Sharing at a distance','Own terms','Quiet mind'],[
   ['Alder Falls merges with the next town, and Idea Night pitches jump by more than the population did.',0,'Bigger and denser means more ideas per person.'],
   ['A maker in another country sends Amara a battery fix by video call.',1,'Ideas no longer need physical closeness to spread.'],
   ['Sol skips the town science fair to run a bike-fixing club for younger kids, and loves it.',2,'Sol picks a creative life by their own measure, not by someone else’s idea of a prize.'],
   ['Lena stops checking parents’ group chats at night and plans the most inventive class of the year.',3,'Less outside noise, more room to hear their own ideas.'],
   ['A city of 400,000 sees more crime per person than one of 200,000.',0,'Scaling cuts both ways: crime and pollution rise too.']]);}}
  ]
});
</script>
</body>
</html>
