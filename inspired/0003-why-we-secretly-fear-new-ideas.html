<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Why We Secretly Fear New Ideas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0003', title:'Why we secretly fear new ideas', minutes:19, icon:'alert',
  goals:['Explain why people who say they love new ideas often reject them','Predict when a group will be worst at spotting a creative idea','Answer “creativity is only for some people” with the book’s view'],
  parts:['Big D, little d','Why it’s scary','Kangaroo coda','Only for some?'],
  read:'Read “Doubt” in Book I for the full Goncalo study, the burning-bush story and the author’s talks with doubting creators.',
  glossary:{
    'disgust':'Disgust (the “little d”): the hidden, gut-level aversion many people feel toward creativity, which links new ideas to things like vomit and poison.',
    'implicit-bias':'Implicit (hidden) bias: a feeling you hold below awareness. Researchers find it with rapid-fire tests that give you no time to think.',
    'uncertainty':'Uncertainty: not knowing what will happen. People who feel it, or tolerate it poorly, react worse to new ideas.'
  },
  cheatsheet:[
    'Creativity’s hidden barriers are the two D-words: <b>Doubt</b> (the Big D) and <b>disgust</b> (the little d).',
    'Goncalo’s study: people <b>say</b> they like creativity, but rapid-fire tests tie it to <b>vomit, poison and agony</b>.',
    'Feeling <b>uncertain</b> makes the hidden disgust stronger. People want creativity <i>and</i> stability, and it’s hard to have both.',
    'Uncertain people also fail to <b>recognize</b> a creative idea when they see one (the nanotech running shoe).',
    'New ideas threaten “death” two ways: most <b>fail and die off</b>; the ones that succeed <b>displace</b> what came before.',
    'Ideas <b>build on each other</b> (PerioChip to kangaroo enamel), and a creation’s value can be <b>debated</b>.',
    'Many think creativity is <b>only for some</b>. The book says it can be <b>cultivated</b>, and the first step is facing doubt.'
  ],
  steps:[
/* ---------- PART 1: BIG D, LITTLE D ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">On a survey, every Alder Commons board member ticks “I love new ideas.” Then they vote down every Idea Night pitch for a year. Which tells you more about how they really feel?</h1>');
  L.mc(L.card,['What they ticked on the survey','How they actually voted'],1,
   'What people do often reveals feelings they don’t admit, even to themselves. This lesson is about a hidden feeling toward new ideas.',
   'Surveys capture what people believe they feel. Their votes show what happens when a real new idea is in front of them, and that’s the feeling this lesson is about.');}},
{part:0,src:'Book I · Doubt',run(L){
  L.h(L.kick('learn','The hidden barrier')+'<h1 class="q">Two D-words stand between you and creating</h1>'+
   L.prose('Before the book shows that creating is more within reach than you think, it names the barrier. The author calls it the D-words.')+
   L.lanes([['shield','The Big D: Doubt','Fear of expressing your own ideas and being judged for them. The book treats it as the main enemy a creator faces.',4],
            ['alert','The little d: Disgust','A gut-level aversion to creativity itself. If you’re honest, the author says, new ideas can feel almost like a toxin.',3]])+
   L.prose('That sounds odd, because almost everyone says they love creativity. The next screens show the research behind the claim.'));
  L.done();}},
{part:0,src:'Book I · Doubt',run(L){
  L.h(L.kick('ex','A real study from the book')+'<h1 class="q">Jack Goncalo asks a “smart-dumb” question</h1>');
  L.beats(L.card,[
   ['The question','Researcher Jack Goncalo and two colleagues asked: do people <i>really</i> like creativity? It sounds silly, like asking if people like puppies. Journalists call it a “smart-dumb question”: it tests something we’re sure we know.'],
   ['The puzzle','Research also showed that companies, research centers and leaders routinely reject creative ideas, and teachers often dislike curious, creative students. Why, if everyone likes creativity?'],
   ['The setup','One group was told they might get extra money from a random lottery: cash they couldn’t control. That made them feel '+L.g('uncertainty','uncertain')+'. A second group got no such offer.'],
   ['What they said','On a questionnaire, people said positive things about creativity.'],
   ['What they felt','A rapid-fire computer test paired words like “novel” and “original” with pictures such as rainbows and cake, or vomit and poison. With no time to think, people’s '+L.g('implicit-bias','hidden feelings')+' showed.']],
   'Saying and feeling turned out to be two very different things. Next, see what the test found.');}},
{part:0,src:'Book I · Doubt',pts:1,
 solve:async L=>{L.$('#po').children[0].click();L.$('#go').click();},
 run(L){
  let p=null;const O=['The lottery group','The no-lottery group','Both groups the same'];
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">Both groups said nice things about creativity. Whose rapid-fire reactions tied it more strongly to vomit and poison?</h1><div id="po"></div>'+
   '<button class="btn pri" id="go" hidden style="margin-top:12px">'+L.ic('play')+'Run the rapid-fire test</button><div id="rs"></div>');
  O.forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=n;b.onclick=()=>{if(p!==null)return;p=j;b.classList.add('sel');L.$('#go').hidden=false;};L.$('#po').appendChild(b);});
  L.$('#go').onclick=function(){this.remove();
    const row=(lb,id,c)=>'<div class="meterrow"><div class="lb">'+lb+'</div><div class="meter"><div id="'+id+'" style="background:'+c+';width:0%;transition:width .9s"></div></div></div>';
    L.$('#rs').innerHTML='<h2 class="sub">No lottery (more certain)</h2>'+row('Says: likes it','a1','var(--ok-strong)')+row('Hidden: disgust','a2','var(--no)')+
     '<h2 class="sub">Lottery (uncertain)</h2>'+row('Says: likes it','b1','var(--ok-strong)')+row('Hidden: disgust','b2','var(--no)')+
     '<p class="small">Bars are an illustration of the pattern, not the study’s numbers.</p>';
    setTimeout(()=>{const W={a1:80,a2:45,b1:80,b2:75};Object.keys(W).forEach(k=>{const el=L.$('#'+k);if(el)el.style.width=W[k]+'%';});},50);
    setTimeout(()=>{if(!L.$('#rs'))return;L.award(p===0);
      L.sheet(p===0?'ok':'no',p===0?'You called it!':'The uncertain group, by more','Both groups hid a link between creativity and things like vomit, poison and agony. The group made uncertain by the lottery showed it even more strongly. Creativity promises change, and change feels worse when life already feels shaky.');L.done();},1100);};}},
{part:0,src:'Book I · Doubt',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Why did the researchers need a rapid-fire test at all?</h1>');
  L.mc(L.card,['Fast tests are cheaper to run on many people','Asked directly, people say they like creativity','People can’t read long survey questions well'],1,
   'Stated feelings were positive. Only reactions too fast to think about revealed the hidden disgust.',
   'The point wasn’t cost or reading. People’s stated views were positive, so the researchers needed a way to reach feelings below awareness.');}},
{part:0,src:'Book I · Doubt',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Stated belief or hidden reaction?',['Stated belief','Hidden reaction'],[
   ['Board chair Ruth tells a reporter: “Alder Commons runs on fresh ideas.”',0,'That’s what Ruth believes and says out loud, like the study’s questionnaire.'],
   ['Ruth’s stomach tightens before Jun even finishes describing the ferry.',1,'A gut reaction that comes before any thinking, like the rapid-fire test.'],
   ['A member flinches and mutters “ugh” at a sketch, then calls it “interesting.”',1,'The flinch came first and fast. The polite word came after thinking.'],
   ['The board’s mission statement promises to “champion bold projects.”',0,'A written statement is a considered, stated belief.']]);}},

/* ---------- PART 2: WHY IT'S SCARY ---------- */
{part:1,src:'Book I · Doubt',run(L){
  L.h(L.kick('learn','Creativity versus stability')+'<h1 class="q">We want two things that pull against each other</h1>'+
   L.prose('Goncalo’s reading of the results: people like creativity, but they also like <b>stability</b>. When life feels unstable, they’re more likely to reject creativity, because it hints at even more chaos.')+
   L.flow([['star','We want','New ideas, progress, hope','',2],['home','We also want','Stability, the familiar','',3],['alert','Under uncertainty','Stability wins; new ideas feel toxic','',4]])+
   L.prose('Creativity is <b>disruptive</b>. It changes what we eat, watch and listen to, how we work and how we treat each other. That can be wrenching. Yet it isn’t what we tell ourselves.')+
   L.quote('Saying you don’t want creativity is like saying you don’t like hope.','Jack Goncalo, quoted in “Doubt”'));
  L.done();}},
{part:1,src:'Book I · Doubt',run(L){
  L.h(L.kick('learn','Creativity is death')+'<h1 class="q">Biology explains why new ideas feel threatening</h1>'+
   L.prose('The author says the tension runs deeper, to biology. New ideas threaten “death” in two ways.')+
   L.list([['x','Most new things die','When microbes mutate by accident, the new forms almost always fail: they fit their world worse than the old ones. Most ideas don’t work either. They die off.'],
           ['arrow','The winners kill the past','When a new form does succeed, it pushes out what came before. New ideas end habits, businesses, power structures and jobs.']],4)+
   L.note('The author lived the second kind. In his early twenties he pumped gas on a “full-service island” to top up a $16,000 newspaper salary. Card readers ended the gas job, and the internet later closed that newspaper.','book'));
  L.done();}},
{part:1,src:'Book I · Doubt',run(L){
  L.h(L.kick('ex','A second experiment, and some history')+'<h1 class="q">Uncertain people don’t just dislike new ideas. They fail to see them.</h1>');
  L.beats(L.card,[
   ['The next question','If people link creativity with disgust, can they even <b>recognize</b> a creative idea when they see one?'],
   ['The shoe','Researchers showed people a new running shoe that uses nanotechnology to adjust fabric thickness, cooling the foot and reducing blisters.'],
   ['The result','People with more tolerance for uncertainty were more likely to rate the shoe as creative. People with less tolerance saw it as less creative.'],
   ['Monet','History is full of this. In 1872 Claude Monet painted <i>Impression, Sunrise</i>. A critic sneered that wallpaper sketches were more finished, and named the style “Impressionism” as an insult. Monet is now among the most celebrated painters.'],
   ['Galileo','Centuries earlier, Galileo was convicted of heresy for saying the Earth goes around the sun.']],
   'Uncertainty and instability make poor soil for new ideas. Even a good idea can look like a bad one to a worried audience.');}},
{part:1,src:'Book I · Doubt',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">The city hints it may cut Alder Commons’ grant, and the board feels uneasy. What does the research predict for next month’s Idea Night?</h1>');
  L.mc(L.card,['They’ll see the pitches as less creative','They’ll welcome bold ideas to save money','Their uncertainty won’t affect their votes'],0,
   'Uncertainty strengthens the hidden disgust and weakens people’s ability to recognize creativity. Good pitches may simply look “too risky.”',
   'The studies point the other way: feeling uncertain makes people react worse to new ideas and less able to see what’s creative in them.');}},
{part:1,src:'Book I · Doubt',pts:5,run(L){
  L.h(L.kick('pr','Two kinds of “death”')+'<h1 class="q">Each worry about a new idea at Alder Commons fits one of the two threats. Sort them.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['It may fail and die','It may push out the old'],[
   ['The ferry could swallow a year of savings and never leave the dock.',0,'Most new ideas don’t work. This worry is about failure.'],
   ['If Amara’s sensors work, the volunteers who walk the levee checking water marks won’t be needed.',1,'A successful idea replacing an old routine: the past gets displaced.'],
   ['Theo’s strange new song might empty the room at open mic.',0,'A fear that the idea flops, like most mutations.'],
   ['A touring repair ferry could take customers from the repair shop in the next town.',1,'If it succeeds, it pushes out an existing business.'],
   ['Young Makers’ new robotics club might replace the long-running woodworking club.',1,'Success for the new idea means the old one fades.']],
   'Either way, change can feel like a loss. That’s why the fear is real, not silly.');}},
{part:1,src:'Book I · Doubt',pts:1,run(L){
  L.h(L.kick('pr','Apply it')+'<h1 class="q">Jun wants the ferry judged fairly. Which audience is most likely to see what’s creative about it?</h1>');
  L.mc(L.card,['Members bracing for the grant cut','A board that just lost its treasurer','Members at ease with not knowing'],2,
   'People who tolerate uncertainty well were the ones who recognized the running shoe as creative.',
   'Feeling uncertain, whether from money worries or a shaken board, makes people less able to recognize creativity. The members comfortable with not knowing are the best audience.');}},

/* ---------- PART 3: KANGAROO CODA ---------- */
{part:2,src:'Book I · Doubt',run(L){
  L.h(L.kick('ex','The Kangaroo Man, continued')+'<h1 class="q">Creations can bring mixed and unexpected results</h1>');
  L.beats(L.card,[
   ['The problem','By 2010, Yehuda Gat’s park had more than fifty kangaroos. Then they began to suffer “lumpy jaw,” an infection so bad they stopped eating. It only happens in captivity, and there was no cure.'],
   ['The call','Gat and the kibbutz vet turned to scientists at Hebrew University, including microbiologist Doron Steinberg.'],
   ['An earlier idea','Years before, Steinberg and colleague Michael Feldman had co-invented the PerioChip, which tucks into the gums and releases antiseptic to prevent gum disease in people. The idea struck in a quick conversation in an elevator.'],
   ['The reuse','Borrowing from that work, and with two vets, they developed an enamel for kangaroos that has all but wiped out the deadly effects of lumpy jaw.']],
   'A new problem, caused by a creation, was solved by borrowing from an older creation.');}},
{part:2,src:'Book I · Doubt',run(L){
  L.h(L.kick('learn','Three lessons from the coda')+'<h1 class="q">What the kangaroo story adds</h1>'+
   L.list([['cycle','Ideas build on each other','Through cooperation, conversation and brainstorming, one idea feeds the next. Gum medicine became kangaroo medicine.'],
           ['scale','Value can be debated','The zoo earned money for a struggling community, delighted families and led to a cure. It also keeps animals in captivity. Whether it’s good or bad is open to debate.'],
           ['lock','Many think it’s only for some','Lots of people, including creators, believe creativity isn’t open to most of us. The last part of this lesson tests that belief.']],1));
  L.done();}},
{part:2,src:'Book I · Doubt',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">What does the path from the PerioChip to the kangaroo enamel show?</h1>');
  L.mc(L.card,['Great ideas come out of nowhere','Ideas build on earlier ideas','Only experts can solve animal health'],1,
   'The kangaroo cure borrowed directly from a human gum treatment. New ideas grow out of old ones.',
   'The cure didn’t appear from nowhere, and its key wasn’t expertise in kangaroos. It reused an earlier invention: ideas build on each other.');}},
{part:2,src:'Book I · Doubt',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which lesson does it show?',['Ideas build on ideas','Value is debatable','“Only for some”'],[
   ['Amara adapts the alarm logic from the hospital lab’s fridge monitors for the river sensor.',0,'An old idea from one field becomes a new one in another, like the PerioChip.'],
   ['The ferry would bring repairs to remote towns, but it would also burn fuel on the river.',1,'Real benefits and real costs: people can reasonably disagree on whether it’s good.'],
   ['A member says, “I’m just not a creative type. That’s for people like Jun.”',2,'The belief that creativity belongs to a gifted few.'],
   ['Theo builds a new song from a chord pattern they learned covering old hits.',0,'Something new made from earlier material.']]);}},

/* ---------- PART 4: ONLY FOR SOME? ---------- */
{part:3,src:'Book I · Doubt',run(L){
  L.h(L.kick('learn','Is creativity only for some?')+'<h1 class="q">Even creators often say “not everyone can do this”</h1>'+
   L.prose('The author asked many people whether anybody can be creative. The answers were strikingly firm.')+
   L.list([['flask','Doron Steinberg, inventor','No: you need a gift, a way of thinking that doesn’t fear the unknown. When people call you crazy, you must be brave. Some of his colleagues hear that and retreat to their caves.'],
           ['book','A top-selling author','Asked not to be named, they said nearly everyone takes their opinions from others and never thinks outside the box.'],
           ['pencil','David Streitfeld, journalist','A Pulitzer-winning reporter who was aghast at the idea of writing a book. He feels he lacks the trait that makes writing possible.']],3)+
   L.prose('Notice the last one: someone the author sees as highly creative doesn’t think of himself that way at all.'));
  L.done();}},
{part:3,src:'Book I · Doubt',run(L){
  L.h(L.kick('ex','Two ways to read it')+'<h1 class="q">Streitfeld says he doesn’t have the trait. Flip each card.</h1>');
  L.flips(L.card,[
   ['Reading 1: Why bother?','If a person doesn’t feel inspired, why should they create? The author finds this <b>very reasonable</b>. No one should be forced to feel inspired.'],
   ['Reading 2: Not set in stone','The resistance comes from a <b>state of mind</b>, and states of mind can change. The author believes inspiration can be learned.'],
   ['The key word','Streitfeld said he hadn’t <b>cultivated</b> the trait. The author seizes on it: creativity can be cultivated, like a garden.'],
   ['The first step','Cultivating it starts with facing <b>doubt</b>: self-doubt and other people’s expectations. And doubt starts early, in childhood.']],
   'Both readings are fair. But if you <i>want</i> to create, the second one matters: the barrier is doubt, not a missing gene.');}},
{part:3,src:'Book I · Doubt',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">What is the author’s own answer to “is creativity only for some?”</h1>');
  L.mc(L.card,['It can be cultivated, starting with doubt','It mostly depends on the genes you got','Only those who feel no fear can create'],0,
   'The author treats creativity as something you can grow, and the first, arguably most important, step is dealing with doubt.',
   'That’s Steinberg’s view, not the author’s. The book says creativity can be cultivated, and the first step is facing doubt.');}},
{part:3,src:'Book I · Doubt',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Tap each piece until the sentence sums up this chapter.</h1>');
  L.sentence(L.card,[['People say they love creativity, but'],['they welcome it even more when unsure','they hide a gut-level disgust for it','they forget about it when unsure'],['and creativity can be'],['inherited, but never learned','bought with enough money','cultivated, starting with doubt']],[0,1,0,2],
   [[],['Goncalo’s study found the opposite: uncertainty made the hidden disgust stronger.','The feeling doesn’t vanish. It hides below awareness and grows under uncertainty.'],[],['That’s the view of skeptics like Steinberg. The author argues it can be grown.','Money isn’t the barrier the chapter names. Doubt is.']],
   'Hidden disgust, made worse by uncertainty; and a way forward that starts with doubt.');}},
{part:3,src:'Book I · Doubt',pts:1,run(L){
  L.h(L.kick('pr','Apply it')+'<h1 class="q">Theo, who writes songs every night, sighs: “Why write anything? Everything great has already been written.” What fits the chapter best?</h1>');
  L.mc(L.card,['Agree: some people just lack the trait','Wait until they feel completely sure','See it as doubt, a mind state that can change'],2,
   'Theo sounds like Streitfeld. Since Theo clearly wants to create, the useful reading is that the resistance is doubt, a state of mind that can be cultivated past.',
   'The chapter rejects “some people lack the trait,” and certainty never arrives. Theo’s resistance is doubt, a state of mind, and that can change.');}},
{part:3,src:'Book I · Doubt',pts:1,run(L){
  L.h(L.kick('pr','Apply it')+'<h1 class="q">Board chair Ruth wonders why the board has rejected every pitch since the grant news. Based on this chapter, what’s the likeliest reason?</h1>');
  L.mc(L.card,['This year’s pitches have all been weak','Members simply lack creative talent','Uncertainty is clouding their judgment'],2,
   'Feeling uncertain strengthens the hidden disgust for new ideas and makes people worse at recognizing creative ones. The grant news did exactly that.',
   'Nothing suggests the pitches got worse, and the book rejects the idea that creativity is only for the talented few. The timing points to uncertainty, which makes people reject and misjudge new ideas.');}}
  ]
});
</script>
</body>
</html>
