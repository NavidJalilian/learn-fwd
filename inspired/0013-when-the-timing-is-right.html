<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>When the Timing Is Right</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0013', title:'When the timing is right', minutes:19, icon:'clock',
  goals:['Contrast a virus’s careless flood of ideas with the way people judge each idea, and spot “idea murder”','Explain why COVID-19 counts as “creative” by the book’s definition, and why that isn’t praise','Show how an old idea can suddenly catch on when its niche changes'],
  parts:['Sloppy vs careful','A perfect fit','Old idea, new niche','Linked'],
  read:'Read “Pandemic” in Book II for the full account of how the virus fit its moment and Darrin Bell’s view of the 2020 protests.',
  glossary:{
    pims:'PIMS (Premature Idea Murder Syndrome): the author’s joking name for killing a possibly good idea too early because we fear it will cost more than it’s worth.'
  },
  cheatsheet:[
    'Viruses are <b>super sloppy</b>: billions of random tries at no cost, and most fail. People <b>pay</b> for creating, so we judge each idea almost as soon as we have it.',
    'Judging too fast leads to <b>PIMS</b>, Premature Idea Murder Syndrome: killing possibly good ideas for fear of what they’ll cost.',
    'A creation that sweeps the world is <b>hard to predict</b> until the environment tests it. At another time, the same creation might have died.',
    'COVID-19 was “creative” in the book’s sense: <b>novel</b> to our immune systems, with <b>value</b> (it thrived), and superb <b>timing</b>. Value is not goodness.',
    'The 2020 racial-justice movement was an <b>old idea</b>. What changed was the terrain: phone videos as proof, and people at home who couldn’t look away.',
    'Creative change depends on the idea <b>and</b> on the <b>niche</b> where it lands.',
    'Creations are linked: the virus helped set up the movement. Creation and response are <b>unpredictable</b>, which is the call-and-response of the next lesson.'
  ],
  steps:[
/* ---------- PART 1: SLOPPY VS CAREFUL ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">A food truck in Alder Falls starts selling hot soup. In which week is it most likely to sell out?</h1>');
  L.mc(L.card,['The hottest week of a July heat wave','The first freezing week of winter'],1,
   'Same soup, same truck, very different moment. This lesson is about how much the moment decides whether a creation catches on.',
   'Same soup, same truck. In a heat wave nobody wants it; in the first freeze, everyone does. The moment matters as much as the soup, and that’s this lesson’s idea.');}},
{part:0,src:'Book II · Pandemic',run(L){
  L.h(L.kick('learn','How a virus “creates”')+'<h1 class="q">Viruses make new things in a way no person ever would</h1>'+
   L.quote('Viruses are super sloppy. They make mistakes.','Dr. Paul Duprex, vaccine researcher, to the author')+
   L.prose('Dr. Duprex meant that viruses copy themselves with random errors, producing billions of new combinations with no plan at all. Most of those new versions die. A tiny few find a new home and spread.')+
   L.lanes([['cycle','A virus','Pops out billions of tries. Each one costs it nothing, so it never asks whether a try is worth it.',1],
            ['person','A person','Pays for every creation in time, money and effort. So we ask “is this a <i>good</i> idea?” almost as soon as we have it.',2]])+
   L.prose('Dr. Duprex put the contrast simply: people don’t want a million pieces of art.'));
  L.done();}},
{part:0,src:'Book II · Pandemic',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Why can a virus afford to be so “sloppy” when people can’t?</h1>');
  L.mc(L.card,['Each failed try costs it nothing, and it makes billions of them','It quietly checks each new version before it spreads','It copies only the versions that have worked before'],0,
   'Failure is free for a virus, so it doesn’t judge. People pay for every try, so we judge each idea right away.',
   'A virus never checks or plans. Its new versions are random errors, and most die. It gets away with it because each try costs nothing and there are billions of them.');}},
{part:0,src:'Book II · Pandemic',run(L){
  L.h(L.kick('learn','The other extreme')+'<h1 class="q">People judge so fast that we kill good ideas too</h1>'+
   L.prose('Asking “is this worth it?” is sensible. But the author says we’ve swung so far from the virus that we often kill ideas that might have been good, simply because we fear they’ll take more than they’re worth.')+
   L.prose('He gives it a name, with a wink: '+L.g('pims','PIMS')+', <b>Premature Idea Murder Syndrome</b>. He jokes the term is barely worth the effort he put into it.')+
   L.flow([['cycle','Virus','Tries everything, judges nothing','',1],['scale','Useful middle','Gives an idea a chance to be tested','',2],['x','PIMS','Judges everything, kills early','',4]],false)+
   '<p class="small" style="margin-top:10px">The book isn’t asking you to act like a virus. It warns against killing ideas before they’ve met the world.</p>');
  L.done();}},
{part:0,src:'Book II · Pandemic',run(L){
  L.h(L.kick('ex','Meanwhile at Alder Commons')+'<h1 class="q">One March Idea Night, before the flood</h1>');
  L.beats(L.card,[
   ['The mood','The city has hinted it may cut the grant. Board chair Ruth opens Idea Night by reminding everyone that money is tight.'],
   ['Pitch 1','A member proposes a monthly repair night for neighbors’ broken toasters and lamps. Within a minute: “Who pays for the parts?” Voted down.'],
   ['Pitch 2','Amara Diallo asks for a small budget to put flood sensors on ten riverside homes. “What if they don’t work?” Voted down.'],
   ['Pitch 3','A teen member wants a weekend coding club. “We can’t staff it.” Voted down. Fifteen minutes, three ideas gone.'],
   ['The pattern','None of the three was tested, even cheaply. Each was killed by a fear of cost before anyone learned whether it had value.']],
   'That’s PIMS in action: the board judged the price of each idea instantly and never saw what the world might have made of it.');}},
{part:0,src:'Book II · Pandemic',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Virus-style, PIMS, or a fair test?',['Virus-style','PIMS','A fair test'],[
   ['Theo deletes a new song idea after one bar: “Recording it would take all weekend.”',1,'Killed for its cost before it was even heard. That’s premature idea murder.'],
   ['Jun bolts random scrap onto the ferry every night, with no aim and no check on what works.',0,'Endless tries with no thought of cost or value. Only a virus can afford that.'],
   ['Amara builds one cheap sensor, tests it on the levee for a week, then decides.',2,'A small, cheap trial lets the world judge the idea before anyone kills it.'],
   ['Lena cuts Sol’s project before the showcase because extra parts might cost twenty dollars.',1,'The fear of cost won before the project got a chance. That’s PIMS.']]);}},

/* ---------- PART 2: A PERFECT FIT ---------- */
{part:1,src:'Book II · Pandemic',run(L){
  L.h(L.kick('learn','Fit decides')+'<h1 class="q">You can’t tell if a creation will sweep the world until the world tests it</h1>'+
   L.prose('The author’s lesson from the pandemic: a creation that spreads everywhere is hard to predict in advance. It only shows its power once the environment tests it.')+
   L.flow([['flask','A new creation','a random new combination'],['compass','The environment','tests it against the moment'],['trend','Thrives or dies','depends on the fit']])+
   L.prose('COVID-19, a deadly and terrible disease, was a new genetic combination that happened to fit its moment almost perfectly. At another time in history, the author says, it might have died out. This is the '+L.g('niche','niche')+' idea from Book II, seen in real time.'));
  L.done();}},
{part:1,src:'Book II · Pandemic',run(L){
  L.h(L.kick('ex','Why the virus fit 2020')+'<h1 class="q">Step by step, the book shows how this virus matched its world</h1>');
  L.beats(L.card,[
   ['Novel','It combined genes from a bat with those of a human, so human immune systems had never faced it.'],
   ['Hidden','It could sit in people for up to two weeks before they felt sick, so carriers spread it through hugs, handshakes and shared surfaces without knowing.'],
   ['Compared','HIV was far harder to pass on, only through blood and other body fluids. Ebola killed its hosts so fast that it limited its own spread. This virus had neither problem.'],
   ['The world','People lived densely and close to animals that carried it. Planes, trains and buses could move it around the globe in hours.'],
   ['The people','Many countries had aging populations, and the virus hit older people hardest.']],
   'None of these traits was planned. The virus was a random combination that fit a crowded, connected, aging world.');}},
{part:1,src:'Book II · Pandemic',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">The book says Ebola “didn’t do itself any favors.” Why did it spread less widely than COVID-19?</h1>');
  L.mc(L.card,['It spread only through blood and body fluids','It killed its hosts too quickly to pass far','It appeared before air travel was common'],1,
   'A host who dies fast can’t carry a virus far. COVID-19 did the opposite: people carried it for days without symptoms.',
   'Spreading only through blood and fluids is what the book says about HIV, and the book doesn’t mention travel for Ebola. Its problem was that it killed hosts too fast to travel far.');}},
{part:1,src:'Book II · Pandemic',run(L){
  L.h(L.kick('learn','“Essentially creative”')+'<h1 class="q">By the book’s own definition, the virus was creative</h1>'+
   L.prose('Recall the working definition of '+L.g('creativity','creativity')+': something novel with value or influence. The author checks the virus against it:')+
   L.tiers([['flask','Novel','New to our immune systems. Doctors noticed an odd dry cough, and in some older patients the body overreacted to the never-seen threat, inflaming many organs.','“novel coronavirus”'],
            ['trend','Value','Not goodness. Value here means it found a way to thrive in its environment.','it spread worldwide'],
            ['clock','Timing','Superb, given how crowded the world was and how easily people crossed borders.','the right moment',true,'This lesson']])+
   L.note('Calling a deadly virus “creative” is not praise. Creations are neither good nor bad in themselves; value only means influence or success.','info'));
  L.done();}},
{part:1,src:'Book II · Pandemic',pts:5,run(L){
  L.h(L.kick('pr','Sort the evidence')+'<h1 class="q">Which part of the “creative” label does each fact support?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Novel','Value (it thrived)','Timing'],[
   ['Its genes mixed bat and human, a threat no immune system had seen',0,'New to us: that’s novelty.'],
   ['Air travel and mass transit could carry it worldwide in hours',2,'That’s the moment it landed in: a connected world.'],
   ['It spread to tens of thousands of people within weeks',1,'Thriving in its environment is what the book means by value here.'],
   ['Many nations had grown top-heavy with older people',2,'An aging population is a feature of the time, part of its timing.'],
   ['Doctors first called it a “novel coronavirus”',0,'The name itself says new.']],
   'Novel, valuable in the sense of thriving, and perfectly timed. None of it makes the virus good.');}},
{part:1,src:'Book II · Pandemic',pts:1,run(L){
  L.h(L.kick('pr','Careful reading')+'<h1 class="q">At a Commons book club, a member says: “So the author admires the virus?” What’s the best reply?</h1>');
  L.mc(L.card,['No. “Value” means it thrived; creations aren’t good or bad in themselves','Yes. He says it was useful to society in the long run','Partly. He admires its design but not its effects'],0,
   'The book’s definition separates value (influence, success) from goodness. The author calls the disease evil and deadly.',
   'The author calls the disease evil and deadly, and never praises it. He uses “value” in the narrow sense of thriving in its environment.');}},

/* ---------- PART 3: OLD IDEA, NEW NICHE ---------- */
{part:2,src:'Book II · Pandemic',run(L){
  L.h(L.kick('learn','A second creation of 2020')+'<h1 class="q">An old idea found its moment</h1>'+
   L.prose('In 2020, phone videos showed the killings of Ahmaud Arbery and George Floyd. Protests spread from city to city on a scale the country hadn’t seen. The author calls it the creation of a movement.')+
   L.prose('But the idea wasn’t new. For years, grieving mothers, pastors and community leaders had pleaded for change and stirred only some interest. What changed was the <b>terrain</b>:')+
   L.list([['clock','Timing','The moment was ripe.'],['eye','Technology','Mobile phones and police body cameras gave clear proof of what Black Americans had said for years.']],1)+
   L.prose('The author’s point: creative change depends not just on the idea, but on the ground where it lands.'));
  L.done();}},
{part:2,src:'Book II · Pandemic',run(L){
  L.h(L.kick('ex','A cartoonist’s view')+'<h1 class="q">Darrin Bell explained what the pandemic had to do with it</h1>');
  L.beats(L.card,[
   ['Who','Darrin Bell, the first African American to win the Pulitzer Prize for editorial cartooning, had co-created a daily comic strip with the author for a decade.'],
   ['1991','As a teen in Los Angeles, Bell watched the Rodney King beating on video. Older people called it an exception; for Bell it confirmed what he already knew.'],
   ['Younger kids','Later generations saw such videos one after another on their phones, from when they were small. They recorded and shared them.'],
   ['2020','Then the pandemic hit. No school, no commute, no offices, no pro sports. Stuck at home, people couldn’t look away from the videos.'],
   ['The niche','In a busier, healthier time, the evidence might have slipped from view. Instead, people had time to take it in, reflect and act.']],
   'The virus itself helped make the niche: it gave an old idea people’s full attention.');}},
{part:2,src:'Book II · Pandemic',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">According to the book, why did calls for change grow so loud in 2020 in particular?</h1>');
  L.mc(L.card,['A brand-new idea about justice appeared that year','Leaders that year finally found the right words','The terrain changed: phone proof, and people at home'],2,
   'The idea was old. Phones supplied proof, and lockdown gave people the time and attention to act on it.',
   'The book stresses the idea was old and the pleas had gone on for years. What changed was the terrain: the technology and the moment.');}},
{part:2,src:'Book II · Pandemic',run(L){
  L.h(L.kick('ex','The spring flood')+'<h1 class="q">In April, the river rises higher than anyone in Alder Falls remembers</h1>');
  L.beats(L.card,[
   ['The flood','Water pours into the old ferry warehouse. The wood shop, café counter and Young Makers room on the ground floor are swamped.'],
   ['Closed','The Commons shuts for weeks while it dries out. Members are stuck at home with nowhere to gather.'],
   ['The videos','Neighbors post phone videos of brown water rising in their basements. Everyone in town watches them, again and again.'],
   ['An old warning','Levee volunteers had warned for years that the town learns about rising water too late. Few had listened.'],
   ['Back on the table','Amara’s ten-home sensor plan, voted down in March, is suddenly what everyone in the group chat is asking about.']],
   'The sensor idea didn’t change. The moment around it did.');}},
{part:2,src:'Book II · Pandemic',pts:1,
 solve:async L=>{L.$('#po').children[2].click();L.$('#run').click();},
 run(L){
  let p=null;const N=['Last August, dry summer','March, grant fears','Week after the flood'],F=[.18,.08,.92];
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">Amara pitches the same sensor plan, word for word, at three Idea Nights. Where will it win the most support?</h1><div id="po"></div>'+
   '<div id="race" hidden><div style="display:flex;align-items:center;justify-content:space-between;margin-top:6px;gap:8px;flex-wrap:wrap"><div class="small">Members raising a hand</div><button class="btn pri" id="run">'+L.ic('play')+'Run the votes</button></div>'+
   N.map((n,j)=>'<div class="meterrow"><div class="lb">'+n+'</div><div class="meter"><div id="m'+j+'" style="background:'+(j===2?'var(--ok-strong)':'var(--h3)')+'"></div></div></div>').join('')+'</div>');
  N.forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=n;b.onclick=()=>{if(p!==null)return;p=j;b.classList.add('sel');L.$('#race').hidden=false;};L.$('#po').appendChild(b);});
  L.$('#run').onclick=function(){this.remove();let t=0;
    const iv=setInterval(()=>{t++;F.forEach((f,j)=>{const el=L.$('#m'+j);if(el)el.style.width=Math.round(f*Math.min(1,t/10)*100)+'%';});
      if(t>=10){clearInterval(iv);L.award(p===2);
        L.sheet(p===2?'ok':'no',p===2?'You read the niche':'The week after the flood wins','Same words, same plan. In a dry summer nobody felt the need; under grant fears the board killed it. After the flood, with everyone home watching basement videos, it fit the moment. The environment decided, not the pitch.');L.done();}},180);};}},
{part:2,src:'Book II · Pandemic',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Tap each piece to explain why Amara’s plan suddenly caught on.</h1>');
  L.sentence(L.card,[['The idea itself','Where the idea landed','Who pitched the idea'],['the flood and the basement videos','a better slide deck','a cheaper sensor chip'],['couldn’t look away','felt politely impressed']],[1,0,0],
   [['The plan was word-for-word the same in March. The idea didn’t change.','Amara pitched both times.'],['Nothing about the pitch changed; the moment did.','The design was the same plan voted down in March.'],['Polite interest is what the levee volunteers got for years. This time people couldn’t look away.']],
   'Where the idea landed changed: the flood and the videos made people unable to look away. Old idea, new niche.');}},

/* ---------- PART 4: LINKED ---------- */
{part:3,src:'Book II · Pandemic',run(L){
  L.h(L.kick('learn','One creation sets up the next')+'<h1 class="q">The virus and the movement were linked</h1>'+
   L.prose('The author ends the chapter by tying the two creations together. A random virus emptied schools and offices. That gave an old call for justice the attention it had lacked.')+
   L.flow([['flask','Creation','a new virus spreads'],['home','New conditions','people stuck at home'],['people','Response','an old idea finds its niche']])+
   L.prose('Nobody could have planned or predicted that chain. Creation and response are linked in unexpected ways, and then, as the chapter’s last line says, people begin to respond. That pattern of '+L.g('call-response','call-and-response')+' is the next lesson.'));
  L.done();}},
{part:3,src:'Book II · Pandemic',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'What mainly explains the outcome?',['The idea itself','The niche (timing)'],[
   ['A sump-pump rental the Commons offered for years is fully booked the week after the flood.',1,'The rental didn’t change. Flooded basements made it the right moment.'],
   ['Theo rewrites a dull chorus, and the song finally gets the room singing along.',0,'The song itself changed. That’s the creation improving, not the moment.'],
   ['Levee volunteers’ old warnings suddenly fill the local paper once the warehouse floods.',1,'An old warning met a moment when people couldn’t look away.'],
   ['Sol fixes the gear on the popcorn bike, and now it actually pops corn.',0,'A better design, same moment. The idea itself improved.'],
   ['A members’ group chat that barely worked is busy every night while the Commons is closed.',1,'Stuck at home, members suddenly had time and reason to use it.']]);}},
{part:3,src:'Book II · Pandemic',pts:1,run(L){
  L.h(L.kick('pr','Advice for Jun')+'<h1 class="q">Jun Okafor’s ferry workshop is still laughed at. Jun asks: “Does that prove it’s a bad idea?” What does this chapter suggest?</h1>');
  L.mc(L.card,['Yes: a good idea wins support the first time it’s pitched','Not necessarily: how a creation fares depends partly on its moment','No: if Jun believes in it, timing doesn’t matter'],1,
   'The chapter’s point: you can’t judge a creation’s fate until the environment tests it, and the moment is partly outside the creator’s control.',
   'The book shows old ideas winning only when their moment came, and a fit with the environment deciding success. Belief doesn’t override timing, and first reactions don’t prove much.');}}
  ]
});
</script>
</body>
</html>
