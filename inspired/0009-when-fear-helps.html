<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>When Fear Helps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0009', title:'When fear helps', minutes:19, icon:'flame',
  goals:['Tell the fear that blocks creating (doubt) from the fear of a real threat that fuels it','Explain why necessity alone doesn’t produce inventions','Use fear as fuel without letting it run the work, like the book’s inventors and artists'],
  parts:['Two fears','Fear as fuel','Inventors','Artists'],
  read:'Read “Fear,” the last chapter of Book I, for the full stories of Michael Monsky’s Clean Remote, Michael Lee’s calorie counter and Rhiannon Giddens’s song for her nephew.',
  glossary:{
    'authentic-fear':'Authentic fear: fear of a real threat outside you, like disease, danger to your children or lost opportunity. The book says it can fuel creating, unlike fear of judgment.',
    variolation:'Variolation: an old smallpox defense. A healthy person was given a small bit of the disease so their body could build defenses. It helped, but not reliably.'
  },
  cheatsheet:[
    'Two fears: <b>doubt</b> (fear of expressing yourself and being judged) blocks creating; <b>authentic fear</b> of a real threat can fuel it. Sometimes there <i>is</i> a lion.',
    'Smallpox drew many <b>Little C’s</b> (open windows, variolation) before Edward Jenner’s cowpox vaccine, a <b>Big C</b> inspired by fear.',
    '“Necessity is the mother of invention” is only part true. Many people face desperate times and don’t create. Fear <b>amplifies</b> a creator who can hear and pursue ideas.',
    'Doug Dietz couldn’t change the MRI machine, so he changed the <b>story</b>: kids pick an adventure and feel in control.',
    'Gregory Feist: artists <b>internalize</b> fear; scientists and entrepreneurs aim it at <b>problems outside</b> themselves. Both keep a near-stubborn faith, and misses don’t faze them.',
    'Monsky persisted through rejection; Lee’s wedding fear <b>launched</b> a hobby, then gave way to inspiration.',
    'Art from fear works best from <b>personal truth</b>, not from aiming at an outcome (Richard Wright, Rhiannon Giddens).',
    'The muse isn’t a Greek goddess: creativity comes from our <b>biology</b>. That’s Book II.'
  ],
  steps:[
/* ---------- PART 1: TWO FEARS ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">The river is rising early this spring. Amara Diallo has a rough flood-sensor design and two worries. Which worry is more likely to get the sensor finished?</h1>');
  L.mc(L.card,['“Neighbors’ basements will flood again”','“Members will think my design looks silly”'],0,
   'A real danger to neighbors pushes Amara to act. Worrying about looking silly tends to keep a design in the drawer. This lesson is about that difference.',
   'Fear of looking silly usually keeps a design in the drawer. The real danger to neighbors is the kind of fear that pushes people to build. This lesson is about that difference.');}},
{part:0,src:'Book I · Fear',run(L){
  L.h(L.kick('learn','Two kinds of fear')+'<h1 class="q">The last lesson said there is no lion. Sometimes, there is.</h1>'+
   L.prose('Book I has mostly been about learning to be fearless with your own ideas. This chapter adds a twist: sometimes fear is a creator’s best friend. It all depends on <i>which</i> fear.')+
   L.lanes([['x','Fear of expressing yourself','Fear of judgment, of your own half-formed ideas, of the quiet where they show up. This is '+L.g('doubt','doubt')+', and it blocks creating.',4],
            ['flame','Fear of a real threat','Fear for your safety or your children, of disease, of a lost chance. The book calls these '+L.g('authentic-fear','authentic fears')+', among the strongest reasons people create.',2]])+
   L.prose('So the line isn’t between fear and no fear. It’s between <b>fear of yourself</b> and <b>fear of a real '+L.g('lion','lion')+'</b>.'));
  L.done();}},
{part:0,src:'Book I · Fear',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">How fear of smallpox led to the world’s first vaccine</h1>');
  L.beats(L.card,[
   ['The threat','Smallpox killed 300 million people in the twentieth century alone, and countless more before. People lived in fear of every cough.'],
   ['Many small tries','Ideas sprang up like weeds over the centuries. One doctor prescribed lots of beer. Others kept windows open. These were '+L.g('little-c','Little C’s')+' (the book also says “Small C’s”).'],
   ['The best Little C','<b>'+L.g('variolation','Variolation')+'</b>: give a healthy person a little of the disease so they build defenses. It didn’t always work, because the dose wasn’t weakened enough.'],
   ['The Big C','Dr. Edward Jenner noticed that milkmaids exposed to cowpox, the cow version, didn’t get smallpox. Cowpox was close enough to smallpox, yet different enough, to protect people.'],
   ['The result','The first vaccine: medicine from a cow, inspired by fear. Later vaccines, and the fast COVID-19 vaccine work, stand on that groundwork.']],
   'A deadly real threat drew out many small creations and, finally, a '+L.g('big-c','Big C')+'.');}},
{part:0,src:'Book I · Fear',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">In the smallpox story, what role did fear play?</h1>');
  L.mc(L.card,['It froze doctors until the disease faded on its own','A real deadly threat pushed people to keep inventing'],1,
   'Right. Fear of a real killer drove centuries of tries, from open windows to variolation to Jenner’s vaccine.',
   'Nobody froze. Fear of a real killer drove centuries of tries, from open windows to variolation, and finally Jenner’s vaccine.');}},
{part:0,src:'Book I · Fear',run(L){
  L.h(L.kick('learn','The right person for the fear')+'<h1 class="q">Fear wasn’t enough. Jenner was also a born creator.</h1>'+
   L.prose('The book stresses that <i>who</i> felt the fear mattered as much as the fear itself. Jenner was intensely curious: he built hydrogen balloons, wrote poetry and music, played violin and studied cuckoos.')+
   L.prose('He was also orphaned at five. The book notes that early hardship like this can lead people to see the world differently from their peers, a point it returns to later.')+
   L.quote('Afraid of people dying, but not afraid of trying.','Matt Richtel, on Edward Jenner')+
   L.prose('He watched, listened to himself and came up with something novel and valuable. The fear pointed outward, at the disease, not inward at his own ideas.'));
  L.done();}},
{part:0,src:'Book I · Fear',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Doubt or authentic fear?',['Doubt (blocks)','Authentic fear (fuels)'],[
   ['Amara lies awake picturing an elderly neighbor trapped by fast-rising water.',1,'That’s a real danger to a real person. It’s the kind of fear that drives creating.'],
   ['Amara deletes a sensor sketch because a hospital coworker might find it amateur.',0,'That’s fear of judgment, aimed at Amara’s own idea. It’s doubt, and it blocks.'],
   ['Jun fears the Commons will close if the city cuts its grant.',1,'Losing the Commons is a real threat outside Jun’s head. It can push Jun to create.'],
   ['Theo won’t play a new song at Idea Night in case people laugh.',0,'Nothing outside threatens Theo here. It’s fear of self-expression: doubt.'],
   ['Lena worries Young Makers kids could be hurt by the river path they walk each day.',1,'Children’s safety is a real threat, the kind the book says can fuel creativity.']]);}},

/* ---------- PART 2: FEAR AS FUEL ---------- */
{part:1,src:'Book I · Fear',run(L){
  L.h(L.kick('learn','Necessity is only part of it')+'<h1 class="q">Why “necessity is the mother of invention” is half true</h1>'+
   L.prose('The old saying suggests desperation is what produces inventions. The author takes issue with it. Many people face dire, desperate situations and <b>don’t</b> create their way out.')+
   L.flow([['alert','A real threat','Fear and necessity','many people face this',4],['bulb','A creator','Hears their ideas and can pursue them','fewer people',1],['star','A creation','Fear speeds it up','',2]])+
   L.prose('So fear doesn’t create. It works more like an <b>accelerant</b> or <b>amplifier</b> for a creative drive that’s already there. Creators treat fear as one more ingredient on the '+L.g('spice-rack','spice rack')+', something to notice, tend and draw from.'));
  L.done();}},
{part:1,src:'Book I · Fear',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">An engineer who couldn’t change the machine</h1>');
  L.beats(L.card,[
   ['The task','Doug Dietz, an engineer at General Electric, was asked to make the MRI scanner easier for children. It’s a giant tube you slide into, and it thumps and clangs.'],
   ['The fear','Kids could become terrified inside it. Dietz kept picturing a frightened child going through cancer. Describing the job, he cried.'],
   ['The limit','He couldn’t redesign the machine. A scanner only works as a tight tube.'],
   ['The twist','So he changed what he could: the <b>perception</b>. Kids now choose an adventure, such as pirate or submarine captain, wear a costume, and enter a room decorated like a storybook. The noises become part of the quest.'],
   ['The point','Same machine, new story, and a feeling of control for the child. As one expert told the author, they needed a new story, not a new machine.']],
   'Fear for frightened children drove Dietz to create. He aimed it at the real problem: the child’s fear.');}},
{part:1,src:'Book I · Fear',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">What did Dietz actually change?</h1>');
  L.mc(L.card,['How the scan felt to the child','How loud the machine was inside','How long each scan took'],0,
   'Right. The machine stayed the same. The story around it, and the child’s sense of control, changed.',
   'He couldn’t touch the machine, not its noise and not its timing. He changed the story around it, so the scan felt like an adventure the child chose.');}},
{part:1,src:'Book I · Fear',pts:1,
 solve:async L=>{L.$('#fw').click();},
 run(L){
  L.h(L.kick('pr','See it happen')+'<h1 class="q">A flood warning goes out to three people on River Street. All three are scared. Press the button and watch what each one does.</h1>'+
   '<div style="display:flex;flex-direction:column;gap:10px">'+
   [['person','Amara','Has sketched sensor ideas for months and keeps testing them.','a'],
    ['home','A neighbor at No. 12','Never thinks about floods between springs.','b'],
    ['pencil','A neighbor at No. 30','Imagines a simple flood gate, then thinks: “Who am I to invent anything?”','c']]
    .map(x=>'<div style="background:var(--soft);border-radius:16px;padding:12px 14px"><b>'+L.ic(x[0])+' '+x[1]+'</b><div class="small">'+x[2]+'</div><div class="res" id="r'+x[3]+'"></div></div>').join('')+
   '</div><button class="btn pri" id="fw" style="margin-top:14px">'+L.ic('play')+'Flood warning</button><div id="fq"></div>');
  L.$('#fw').onclick=function(){this.remove();
    L.$('#ra').innerHTML='<span style="color:var(--ok)">Works three nights straight and puts the first two sensors on the riverbank.</span>';
    L.$('#rb').innerHTML='<span style="color:var(--no)">Piles sandbags the usual way and waits.</span>';
    L.$('#rc').innerHTML='<span style="color:var(--no)">Drops the gate idea and piles sandbags too.</span>';
    const q=L.$('#fq');q.innerHTML='<h2 class="sub">Same flood, same fear. What made the difference?</h2>';
    L.mc(q,['How frightened each person felt that night','How close each house sits to the river','Hearing their ideas and acting on them'],2,
     'Exactly the book’s point. Fear amplified Amara’s drive. The neighbor at No. 30 had an idea too, but doubt shut it down.',
     'All three were scared and all three live on the same street. The difference was that only Amara heard their own ideas and pursued them. Fear amplified that drive.');};}},
{part:1,src:'Book I · Fear',pts:1,run(L){
  L.h(L.kick('pr','Apply it')+'<h1 class="q">Young Makers kids are scared of the screaming table saw in the wood shop. Lena can’t make it quieter, and it’s needed for their projects. What’s the Dietz-style move?</h1><div id="dq"></div>');
  L.mc(L.$('#dq'),['Ban the saw for kids and drop the wood projects','Tell the kids the noise is harmless and to toughen up','Turn the saw station into a “launch pad” the kids help run'],2,
   'Like the MRI, the machine stays the same. A new story and a sense of control change how scary it feels.',
   'Dropping the projects throws away the work, and “toughen up” ignores the fear. Dietz kept the machine, gave it a new story and gave the child some control.');}},

/* ---------- PART 3: INVENTORS ---------- */
{part:2,src:'Book I · Fear',run(L){
  L.h(L.kick('learn','Two ways to use fear')+'<h1 class="q">Artists hold fear inside. Inventors point it outward.</h1>'+
   L.prose('Creativity scholar Gregory Feist told the author that, very generally, the two groups use fear differently:')+
   L.lanes([['pencil','Artists','Take the emotion inside and wrestle with its meaning through the work.',3],
            ['flask','Scientists and entrepreneurs','Feel the sting of fear but stay a touch more detached. They’re dealing with problems outside themselves.',2]])+
   L.prose('What they share is a near-irrational faith in their own view. They keep going when people call the idea silly. And the doubters are often right: many creative ideas flop. What marks creative people, Feist says, is that the misses don’t faze them.'));
  L.done();}},
{part:2,src:'Book I · Fear',run(L){
  L.h(L.kick('ex','Two inventors from the book')+'<h1 class="q">A grimy remote and a wedding tuxedo</h1>');
  L.beats(L.card,[
   ['Monsky’s spark','Michael Monsky ran a remote-control repair business. He kept reading news about bacteria that resist antibiotics. Then, in 2005, his son got peanut butter stuck in a remote. The two ideas married in a flash.'],
   ['The Clean Remote','By 2007 he had a remote with a smooth, wipe-clean cover over the keys. Clorox’s CEO loved it.'],
   ['The setback','Then that CEO had a heart attack and left. The new one didn’t see the value. Hotels didn’t want to replace their remotes. His own staff begged him to quit. He kept going anyway, and orders poured in years later, during the pandemic.'],
   ['Lee’s spark','In 2003 Michael Lee feared looking heavy in his wedding tuxedo. A trainer handed him a paper booklet for counting calories. A tech person, he threw it away.'],
   ['The hobby','He built a calorie counter around how people really behave: people eat the same breakfast daily, so logging it should be easy. He launched MyFitnessPal in 2005, thinking of it as a hobby.'],
   ['The payoff','It grew to tens of millions of users. In 2015 Under Armour bought it for $475 million. The fear launched him, then gave way to inspiration.']],
   'Both men pointed fear at a problem outside themselves: germs, and a weight goal. Neither let rejection or the odds stop them.');}},
{part:2,src:'Book I · Fear',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">What happened to Michael Lee’s fear of looking heavy at his wedding?</h1>');
  L.mc(L.card,['It kept driving every decision for ten years','It launched him, then gave way to inspiration'],1,
   'Right. The book compares the fear to rocket boosters that fall away once the rocket is in orbit. Curiosity about each new challenge took over.',
   'The fear fell away like rocket boosters once he was flying. Each new challenge became its own inspiration.');}},
{part:2,src:'Book I · Fear',pts:4,run(L){
  L.h(L.kick('pr','Which way does the fear point?')+'<h1 class="q">Sort each Alder Commons member’s response to fear.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Held inside, like an artist','Aimed outward, like an inventor'],[
   ['Theo writes a song about the dread of watching the river climb toward their parent’s house.',0,'Theo takes the emotion in and wrestles with its meaning in the song.'],
   ['Amara builds a sensor that texts riverside homes before the water arrives.',1,'Amara aims the fear at a problem outside themself: warning homes in time.'],
   ['Jun, afraid the grant will be cut, drafts a plan for the ferry to earn repair fees.',1,'Jun points the fear at an outside problem: the money.'],
   ['Lena paints a mural of last spring’s high water with the Young Makers kids.',0,'The mural works through what the flood felt like, the artist’s way.']],
   'Neither way is better. Both turn a real fear into a creation.');}},
{part:2,src:'Book I · Fear',pts:1,run(L){
  L.h(L.kick('pr','What would Monsky do?')+'<h1 class="q">A hardware chain loves Amara’s flood sensor. Then its buyer leaves, and the new one passes. Volunteers say: “Why waste more weekends on this?” What does the chapter suggest?</h1><div id="mq"></div>');
  L.mc(L.$('#mq'),['Stop, since a big buyer said no','Wait until a buyer comes back first','Keep going if Amara still believes in it'],2,
   'Monsky lost Clorox, was turned down by hotels and was begged to quit, and kept going. Feist says misses don’t faze creative people. The book is honest that many ideas still flop.',
   'Monsky faced the same setback, a backer leaving, and kept going. Feist says creative people aren’t fazed by misses. Staying depends on Amara’s own belief, not on one buyer.');}},

/* ---------- PART 4: ARTISTS ---------- */
{part:3,src:'Book I · Fear',run(L){
  L.h(L.kick('learn','Art from fear')+'<h1 class="q">The art that lands often starts with personal truth</h1>'+
   L.prose('In art, the work stays closer to the fear itself, because the artist holds the emotion inside to wrestle with it.')+
   L.lanes([['target','Richard Wright’s first book','Short stories with an idealistic, outcome-focused tilt. Talented writing, but it didn’t catch on.',4],
            ['flame','<i>Native Son</i> (1940)','Built from years of understanding fear and racism from the inside. Not pretty, but it sold 250,000 copies fast.',2]])+
   L.prose('<i>Native Son</i> didn’t start as an effort to change the world. It started with personal truth, and the plot, Wright said, more or less fell out. Its fear felt familiar to millions of readers.'));
  L.done();}},
{part:3,src:'Book I · Fear',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">Rhiannon Giddens writes from terror for her nephew</h1>');
  L.beats(L.card,[
   ['The moment','In 2017, riding in a friend’s car in New Orleans, feet on the dashboard, chatting, Giddens was suddenly seized by a song idea.'],
   ['The fear','It was about her nephew, Justin, a twenty-year-old with artistic dreams. As a Black teen he had already been stopped by police for no reason. She feared he would be killed.'],
   ['The song','One phrase struck her and became the title: “Better Get It Right the First Time,” about how little room for error some young Black men get.'],
   ['How it came','Her songs often arrive fast, with little second-guessing. She looks at them in awe, not judging good or bad.'],
   ['The turn','She was poised for stardom, with TV and bigger contracts. But what poured out were songs about her ancestors and her family. She was breaking away from outside approval and hearing herself.']],
   'Authentic terror plus a free, unjudged mind produced the song. It was her '+L.g('voice','voice')+', not a hit formula.');}},
{part:3,src:'Book I · Fear',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">What do Wright’s <i>Native Son</i> and Giddens’s song have in common?</h1>');
  L.mc(L.card,['Both began with personal fear, not a goal','Both were designed to win critics and awards'],0,
   'Right. Both started from fear the creator felt deeply. Neither was aimed at an outcome.',
   'Wright’s outcome-focused first book was the one that didn’t catch on. <i>Native Son</i> and Giddens’s song both grew from deeply personal fear.');}},
{part:3,src:'Book I · Fear',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">The scout asks Theo for a “catchy flood song for the news.” Tap each piece until the sentence gives Theo the chapter’s advice.</h1>');
  L.sentence(L.card,[['Start from','Avoid'],['the scout’s request','your own fear','a hit you admire'],['for the river town,','about the charts,'],['and let it','and make it'],['pour out unjudged','fit the brief exactly']],[0,1,0,0,0],
   [['Avoiding the starting point won’t help. Start from something.'],['That aims at an outcome, like Wright’s first book.','Copying a hit is someone else’s truth.'],['Chart worry is fear of judgment: doubt.'],['“Make it” pushes the song toward a brief.'],['Fitting a brief is outcome-first, the opposite of Giddens’s free flow.']],
   'Like Wright and Giddens: personal fear, written freely. The audience may follow, but that’s not where it starts.');}},
{part:3,src:'Book I · Fear',run(L){
  L.h(L.kick('learn','Where does the muse come from?')+'<h1 class="q">Not from Mount Olympus</h1>'+
   L.prose('Greek myth says the Muses, sisters from Mount Olympus, touch people and inspire them, each Muse for a different kind of work. The book closes Book I by asking where this power to create really comes from.')+
   L.flow([['star','Myth','The Muses visit a chosen few','',3],['leaf','The book’s answer','Our primitive biology','',2],['arrow','Next','Book II: the laws of nature','',1]])+
   L.prose('The author ties fear back to this. The threat of extinction, the most basic fear there is, drives change in creatures far simpler than us. Creativity comes from the same natural forces that made COVID-19, and that let us fight it. That’s where Book II begins.'));
  L.done();}},
{part:3,src:'Book I · Fear',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Mixed review',['Doubt blocking','Fear as fuel','Necessity alone'],[
   ['After a near-drowning upriver, Amara spends every evening testing a new sensor float.',1,'A real threat, plus a creator already hearing ideas. Fear amplifies.'],
   ['Many towns face the same floods every year and never try anything new.',2,'Same necessity, no creation. Necessity alone doesn’t invent.'],
   ['Sol won’t show the class a raft design: “Everyone will say it’s dumb.”',0,'Fear of judgment, aimed at Sol’s own idea.'],
   ['Jun, scared the Commons will close, finally pitches the ferry as a way to earn money.',1,'The grant threat is real, and Jun turns it into a creation.'],
   ['Amara has a fix for false alarms but won’t share it: “The hospital engineers will laugh.”',0,'No outside threat here, just fear of being judged.']]);}}
  ]
});
</script>
</body>
</html>
