<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sharp Mind, Open Mind</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0018', title:'Sharp mind, open mind', minutes:20, icon:'scale',
  goals:['Explain how a leader’s openness and humility let a junior person’s idea change the outcome','Describe James Allison’s open-ended way of reading data, and the “brake” he discovered','See how big breakthroughs build on earlier work and land in their moment'],
  parts:['An open coach','The 3 a.m. idea','Diamond Head','Shoulders of giants'],
  read:'Read “The Coach and the Diamond Head” in Book III for Steve Kerr’s path to the 2015 title and James Allison’s cancer breakthrough in full.',
  glossary:{
    'immune-brake':'Immune brake: a signal that tells the body’s defense cells to stand down, so they don’t attack the body itself. James Allison showed cancer can press it.',
    'ctla4':'CTLA-4: a molecule on the surface of immune cells that works as one of the immune system’s brakes.'
  },
  cheatsheet:[
    'Steve Kerr blends a sharp mind with <b>openness</b>: he listens to everyone because he knows nobody has all the answers.',
    'Kerr’s openness grew partly from <b>insecurity</b> about what he didn’t know, paired with inner confidence and a fierce competitive streak.',
    '2015 Finals: video assistant Nick U’ren’s <b>3 a.m. idea</b> (start Andre Iguodala) changed the series. Kerr heard it, used it and <b>credited U’ren publicly</b>.',
    'Ego and the need for control are the <b>opposite of openness</b>. Setting them aside lets a leader seize the right idea at the right moment.',
    'James Allison treats data like a <b>many-faceted crystal</b>: turn it and it may show a better question than the one you asked.',
    'Allison’s insight: the immune system <b>can</b> see cancer, but cancer presses its <b>brake</b> (CTLA-4). Release the brake and the body fights back.',
    'Breakthroughs stand on <b>earlier work</b> and arrive in their moment. Allison won his Nobel at <b>70</b>, after decades of work.'
  ],
  steps:[
/* ---------- PART 1: AN OPEN COACH ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Late one night, the newest and youngest volunteer at the Commons thinks of a smart way to rebuild the flooded wood shop. What most decides whether the idea ever gets used?</h1>');
  L.mc(L.card,['Whether the person in charge will listen','Whether the volunteer has the right degree'],0,
   'Good instinct. This lesson follows a famous coach who won a championship partly because he listened to the lowest-ranked person in the room.',
   'A degree doesn’t carry an idea to the decision. Someone in charge has to be open enough to hear it. This lesson shows a coach who was.');}},
{part:0,src:'Book III · The Coach and the Diamond Head',run(L){
  L.h(L.kick('learn','A coach who contains multitudes')+'<h1 class="q">Steve Kerr: a bookish kid in a closed culture</h1>'+
   L.prose('The author uses two creators to show the last chapter’s point: great creators blend a sharp mind with '+L.g('openness','openness')+'. The first is Steve Kerr, coach of basketball’s Golden State Warriors, who is unusually open in a sports culture that can be very closed.')+
   L.prose('As a kid Kerr was an introvert who read nonstop. He picked up his curiosity from his father, Malcolm Kerr, a scholar who became president of the American University of Beirut and worked to understand all sides.')+
   L.note('In Kerr’s first year of college basketball, his father was assassinated outside his office. The loss didn’t make Kerr bitter or narrow. Over time he grew more empathic and spoke out against blaming whole groups for the acts of a few.','book'));
  L.done();}},
{part:0,src:'Book III · The Coach and the Diamond Head',run(L){
  L.h(L.kick('ex','Kerr’s path')+'<h1 class="q">Insecure and confident at the same time</h1>');
  L.beats(L.card,[
   ['Overlooked','Kerr wasn’t heavily recruited for college. Small and not fast, he kept working, like a science-fair prodigy with a basketball.'],
   ['Precise','In the pros he set the record for highest career three-point shooting percentage, and won six championships as a role player with Michael Jordan’s Chicago Bulls.'],
   ['A curious mix','By the time the Warriors hired him in 2014, he was still <b>insecure</b> about how much he didn’t know, and deeply <b>confident</b> he could figure things out.'],
   ['Open by choice','He told the author he listens to everybody’s opinion, because nobody has all the answers. He links that openness to being insecure about not knowing.'],
   ['Not soft','Kerr is fiercely competitive. He once refused to back down in a shoving match with Jordan. He is strong enough to show curiosity without feeling weak.']],
   'Openness here isn’t meekness. It’s the security to admit what you don’t know.');}},
{part:0,src:'Book III · The Coach and the Diamond Head',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Where does Kerr say his habit of listening to everyone comes from?</h1>');
  L.mc(L.card,['Being the smartest person in most rooms','Knowing that nobody has all the answers','Winning so many titles as a player'],1,
   'Right. Kerr ties his openness to an early insecurity about not knowing things, which gave him lifelong humility.',
   'Kerr credits neither brains nor titles. He listens because he knows nobody, himself included, has all the answers.');}},
{part:0,src:'Book III · The Coach and the Diamond Head',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Rebuild meetings at the Commons: openness at work, or ego in the way?',['Openness','Ego and control'],[
   ['Ruth asks the newest volunteer what they would change about the café counter.',0,'Seeking ideas from the least senior person is Kerr-style openness.'],
   ['Jun waves off a suggestion because “it came from a kid.”',1,'Judging the source instead of the idea protects ego, not the project.'],
   ['Lena admits, “I don’t know how to run Young Makers in a half-built room. Let’s hear everyone.”',0,'Admitting what you don’t know opens the door to answers.'],
   ['A board member says, “We did it this way for ten years. No need to look again.”',1,'Refusing to look again is control, the opposite of openness.'],
   ['Amara says a teen’s wiring idea beats their own, and switches to it.',0,'Letting the better idea win, whoever had it, is openness.']]);}},

/* ---------- PART 2: THE 3 A.M. IDEA ---------- */
{part:1,src:'Book III · The Coach and the Diamond Head',run(L){
  L.h(L.kick('ex','The 2015 Finals')+'<h1 class="q">An idea from an unlikely place</h1>');
  L.beats(L.card,[
   ['The trouble','In Kerr’s first season the Warriors won one of the highest win totals in history. But in the Finals they trailed LeBron James’s Cleveland Cavaliers two games to one, playing away from home.'],
   ['Look at everything','Before game four, Kerr told a TV announcer the team would look at everything. That’s hard after a way of playing has worked all year.'],
   ['The noticer','Nick U’ren, 28, was a video assistant whose job was to cut game footage. Watching old games, he noticed teams that beat LeBron used smaller, quicker lineups.'],
   ['The idea','Start Andre Iguodala, a savvy, shorter veteran, instead of center Andrew Bogut, who was beloved by teammates and owners. U’ren felt certain without hard data, and a little terrified.'],
   ['3 a.m.','He texted an assistant coach in the middle of the night. The next day that coach raised it with Kerr, and it clicked.'],
   ['The result','The Warriors won the game and the series. Iguodala was named the Finals’ Most Valuable Player. Unprompted, Kerr gave U’ren credit at a press conference.']],
   'The idea came from the lowest rung. It mattered because the person at the top was open enough to hear it.');}},
{part:1,src:'Book III · The Coach and the Diamond Head',run(L){
  L.h(L.kick('learn','What the story shows')+'<h1 class="q">Hearing the right idea at the right moment</h1>'+
   L.prose('The author is careful: Kerr won with some of the best players ever and great basketball. One lineup change was key, but part of a much bigger picture.')+
   L.prose('The lesson is that Kerr could <b>hear and seize</b> the right idea at the right moment. He could because of a blend of intellect and openness, and enough humility to share the credit in public.')+
   L.lanes([['shield','Set aside','Ego and the need for control. The author calls them the opposite of openness.',4],
            ['eye','Made room for','Many possibilities, including one from a 28-year-old video assistant.',2]])+
   L.quote('There has to be some humility.','Steve Kerr, on coaching great players'));
  L.done();}},
{part:1,src:'Book III · The Coach and the Diamond Head',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">According to the author, what did Kerr have to set aside to hear U’ren’s idea?</h1>');
  L.mc(L.card,['His careful study of game data','His ego and need for control','His drive to beat other teams'],1,
   'Right. Ego and control are the opposite of openness. Kerr stayed competitive and analytical; he just didn’t need the idea to be his.',
   'Kerr kept his intellect and his competitive streak. What he set aside was ego and the need for control, which the author calls the opposite of openness.');}},
{part:1,src:'Book III · The Coach and the Diamond Head',pts:1,
 solve:async L=>{const c=L.$('#md').children;c[0].click();c[1].click();},
 run(L){
  const S=['Notices a pattern','Speaks up at midnight','Amara passes it on','Jun hears it out','Credit is shared'];
  const M=[['“We know this shop”',[1,1,1,0,0],'Jun: “A teen’s idea? I welded for thirty years.” The shop is rebuilt the old way, machines bolted to the floor, ready to flood again.'],
           ['“Let’s look at everything”',[1,1,1,1,1],'Machines go on rolling, raisable platforms. At the wood shop’s reopening, Jun names Tess and explains where the idea came from.']];
  const seen=new Set();
  L.h(L.kick('pr','Toggle and compare')+'<h1 class="q">Tess, a 16-year-old volunteer, sorts flood photos and notices that only gear on high shelves survived. Pick Jun’s attitude and follow the idea.</h1><div id="md"></div>'+
   '<div id="pp" style="margin:10px 0 6px"></div><div style="background:var(--soft);border-radius:16px;padding:14px;margin:6px 0;min-height:64px"><div id="po" class="prose" style="margin:0">Choose an attitude above.</div></div><div id="pq"></div>');
  M.forEach((m,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=m[0];
    b.onclick=()=>{[...L.$('#md').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(j);
      L.$('#pp').innerHTML=S.map((s,k)=>{const ok=m[1][k],dead=k>0&&!m[1][k-1];return '<span class="chip static'+(ok?' ok':'')+'" style="'+(ok?'':'opacity:'+(dead?'.3':'.7'))+'">'+L.ic(ok?'check':(dead?'lock':'x'))+s+'</span>';}).join('');
      L.$('#po').textContent=m[2];
      if(seen.size===2&&!L.$('#pq').innerHTML){const q=L.$('#pq');q.innerHTML='<h2 class="sub">Tess’s idea was the same both times. What changed the outcome?</h2>';
        L.mc(q,['How open the person in charge was','How much data Tess had collected'],0,
         'Right. Like U’ren, Tess did their part both times. The idea lived or died at the leader’s door.',
         'Tess had the same photos and the same idea both times. Only Jun’s openness changed, and that decided it, as with Kerr and U’ren.');}};
    L.$('#md').appendChild(b);});}},
{part:1,src:'Book III · The Coach and the Diamond Head',pts:1,run(L){
  L.h(L.kick('pr','What would Kerr do?')+'<h1 class="q">The raisable platforms work beautifully. At the wood shop’s reopening, the Alder Falls paper asks Jun about the clever new shop. What fits Kerr’s example?</h1>');
  L.mc(L.card,['Call it a team effort and move on','Explain the plan Jun had been building toward','Name Tess and tell where the idea came from'],2,
   'Right. Kerr credited U’ren publicly, unprompted. Naming Tess shows humility and tells every junior member their ideas count.',
   'A vague “team effort” or taking the story for yourself buries the source. Kerr named U’ren, unprompted, and Jun can do the same for Tess.');}},

/* ---------- PART 3: DIAMOND HEAD ---------- */
{part:2,src:'Book III · The Coach and the Diamond Head',run(L){
  L.h(L.kick('learn','The second creator')+'<h1 class="q">James Allison reads data like a crystal</h1>'+
   L.prose('The second creator is James Allison, the scientist the author credits with one of the most important Big C discoveries he has ever covered: a new way to treat cancer.')+
   L.flow([['list','Textbook science','Make a guess, test it, see if the data agree','interesting, but not very',3],['eye','Allison’s way','Turn the data like a many-faceted crystal','it may show a different question',2]])+
   L.prose('He also likes to get away from everybody. He takes some pride in reading fewer journal papers than other scientists. When papers made no sense to him, he would sit down and work out something that was logical to <b>him</b>, then just do it.'));
  L.done();}},
{part:2,src:'Book III · The Coach and the Diamond Head',run(L){
  L.h(L.kick('ex','Who is Diamond Head?')+'<h1 class="q">A stubborn, curious kid from Texas</h1>');
  L.beats(L.card,[
   ['Small town','Allison was born in 1948 and grew up in a small Texas town.'],
   ['The nickname','His brother called him “Diamond Head” for his stubborn resolve and independent thinking.'],
   ['Early loss','He lost his mother to cancer when he was a boy.'],
   ['Questioning','In high school he fought with his math teacher, refusing to treat God’s existence as a certainty. Today he has long white hair and plays blues harmonica.'],
   ['Not stubborn for its own sake','The author stresses that Allison wasn’t contrary for fun. He followed his curiosity and a gut sense that the accepted view of cancer didn’t add up.']],
   'A sharp scientific mind, joined to a refusal to accept an idea just because everyone holds it.');}},
{part:2,src:'Book III · The Coach and the Diamond Head',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Amara tests one guess: do the flood sensors read lower in cold water? The data shows something odd instead: readings jump whenever a barge passes. What would Allison do?</h1>');
  L.mc(L.card,['Throw out the barge readings as noise','Rerun the test until the oddity goes away','Turn the data over: it may hold a new question'],2,
   'Right. Allison looks at data from many angles, because it may answer a different question from the one you asked. Maybe the sensors can detect waves, too.',
   'Throwing out or rerunning away the surprise keeps Amara inside the original guess. Allison turns data like a crystal, looking for the better question.');}},
{part:2,src:'Book III · The Coach and the Diamond Head',run(L){
  L.h(L.kick('learn','The old view of cancer')+'<h1 class="q">Why cancer treatment used to be a blunt attack</h1>'+
   L.prose('For a long time, scientists believed the immune system (the body’s defense system) simply didn’t see a tumor as foreign. It attacks germs it recognizes as “not me,” but cancer looked like “me.”')+
   L.prose('So treatments mostly ignored the immune system and attacked the cancer directly, with chemotherapy and radiation. These are blunt tools that also destroy lots of healthy tissue.')+
   L.note('Allison’s work helped show the old view was wrong. The immune system <b>can</b> recognize cancer. The cancer then sends a signal telling it to turn off.','alert'));
  L.done();}},
{part:2,src:'Book III · The Coach and the Diamond Head',pts:1,
 solve:async L=>{const c=L.$('#ap').children;c[0].click();c[1].click();c[2].click();},
 run(L){
  const R=['Tumor','Healthy tissue','Immune attack'],C=['var(--no)','var(--ok-strong)','var(--h2)'];
  const A=[['Old view: attack the tumor',[45,40,10],'Chemo and radiation shrink the tumor, but scorch healthy tissue too. The immune system sits it out.'],
           ['Cancer’s trick: brake on',[90,90,12],'Immune cells find the tumor, then '+'<b>stand down</b>'+'. The cancer has pressed the brake.'],
           ['Allison: release the brake',[8,85,90],'Change the signal on the brake, and the body’s own defenders attack. In Allison’s mice, the tumors disappeared.']];
  const seen=new Set();
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Switch between the three pictures of cancer and the immune system.</h1><div id="ap" style="display:flex;flex-wrap:wrap;gap:6px"></div>'+
   R.map((n,j)=>'<div class="meterrow"><div class="lb">'+n+'</div><div class="meter"><div id="am'+j+'" style="width:0;background:'+C[j]+';transition:width .3s"></div></div></div>').join('')+
   '<p class="small">A cartoon of the idea, not real data.</p><div id="ao" class="prose" style="min-height:48px"></div><div id="aq"></div>');
  A.forEach((a,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=a[0];
    b.onclick=()=>{[...L.$('#ap').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(j);
      a[1].forEach((v,k)=>{L.$('#am'+k).style.width=v+'%';});L.$('#ao').innerHTML=a[2];
      if(seen.size===3&&!L.$('#aq').innerHTML){const q=L.$('#aq');q.innerHTML='<h2 class="sub">What was Allison’s key insight?</h2>';
        L.mc(q,['The immune system can’t see cancer, so hit it harder','The immune system sees cancer, but cancer brakes it'],1,
         'Right. The defenders show up; cancer tells them to stand down. Releasing that '+L.g('immune-brake','brake')+' was the breakthrough.',
         'That was the old view. Allison showed the immune system does recognize cancer, and that cancer presses its brake.');}};
    L.$('#ap').appendChild(b);});}},
{part:2,src:'Book III · The Coach and the Diamond Head',pts:6,run(L){
  L.h(L.kick('pr','Allison’s way or the rigid way?')+'<h1 class="q">Sort these habits at the Commons.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Allison’s way','Rigid way'],[
   ['Sol follows a weird result from the popcorn bike instead of ignoring it.',0,'A surprise in the data may hold a better question.'],
   ['Ruth funds only projects whose results match the plan’s predictions.',1,'Demanding the expected answer leaves no room for the unexpected one.'],
   ['Amara steps away from the forums for a week to work out what makes sense to them.',0,'Allison gets away from everybody and builds his own logic.'],
   ['Lena tells the kids their experiment may answer only the worksheet question.',1,'That locks the data into one question, the “not very interesting” way.'],
   ['Theo turns a failed song over and finds a different song hiding in it.',0,'Looking at the same material from another angle, like a crystal.'],
   ['A member drops an idea because every article they read says it can’t work.',1,'Accepting the common view without checking is what Allison refused to do.']],
   'Allison pairs a sharp mind with stubborn curiosity: look again, from another side, and trust your own logic.');}},

/* ---------- PART 4: SHOULDERS OF GIANTS ---------- */
{part:3,src:'Book III · The Coach and the Diamond Head',run(L){
  L.h(L.kick('learn','Built on earlier work, landing in its moment')+'<h1 class="q">How the brake was found, and what followed</h1>'+
   L.prose('In the 1990s Allison focused on '+L.g('ctla4','CTLA-4')+', a molecule on the surface of immune cells. Just being able to study molecules on a cell’s surface depended on many earlier creations: the shoulders of giants.')+
   L.prose('He found CTLA-4 acts as a brake. The brake exists to protect us: too little immune response leaves you open to disease, but too much and the body attacks itself. Cancer exploits that safety brake.')+
   L.list([['star','A shared Nobel','Allison and Japanese scientist Tasuku Honjo, who did complementary work, shared the 2018 Nobel Prize in Medicine for a whole new principle of cancer treatment.'],
     ['clock','Late in life','Allison won it at <b>70</b>, for work spanning decades.'],
     ['cycle','A wider influence','In COVID-19, much harm came from the immune system overreacting. Treatments that adjust the immune response drew on the kind of thinking Allison pioneered, though his work didn’t lead to them directly.']],1));
  L.done();}},
{part:3,src:'Book III · The Coach and the Diamond Head',run(L){
  L.h(L.kick('ex','Two creators, one pattern')+'<h1 class="q">What Kerr and Allison share</h1>');
  L.flips(L.card,[
   ['Sharp mind','Kerr: a record-setting shooter and a lifelong student of the game. Allison: a rigorous scientist who worked out the brake step by step.'],
   ['Open mind','Kerr listened to a 28-year-old video assistant. Allison let data suggest new questions instead of forcing it into old ones.'],
   ['Humility and nerve','Kerr admits he lacks some answers, yet won’t back down. Allison reads less and trusts his own logic, yet follows evidence.'],
   ['Their moment','Kerr’s idea came at a high-risk turning point. Allison’s built on decades of earlier science and arrived when it could change medicine.']],
   'Neither creator is just brilliant or just open. Each blends both, which is the balance the previous chapter described.');}},
{part:3,src:'Book III · The Coach and the Diamond Head',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">What does the chapter say about Allison’s work and the COVID-19 treatments of 2020?</h1>');
  L.mc(L.card,['His way of thinking shaped many later drugs','His discovery directly produced those drugs','His work had nothing to do with them'],0,
   'Right. The author is careful: not a direct line, but his conceptual leap about tuning the immune system influenced many drugs that followed.',
   'The author says plainly the link isn’t direct, but it isn’t nothing either. Allison’s leap in thinking shaped many later drugs, including some used in the pandemic.');}},
{part:3,src:'Book III · The Coach and the Diamond Head',pts:1,run(L){
  L.h(L.kick('pr','Put it in order')+'<h1 class="q">Put Allison’s path to the Nobel in order.</h1>');
  L.order(L.card,['Doctors treat cancer by attacking it with chemo and radiation','Allison sees that stimulating CTLA-4 makes immune cells stop attacking','He works out that CTLA-4 is a brake that cancer can press','He changes the signal, and tumors in treated mice disappear','He shares the 2018 Nobel Prize, at age 70'],
   'Old view, odd observation, explanation, proof, recognition: decades of curiosity built on earlier science.',['1','2','3','4','5']);}},
{part:3,src:'Book III · The Coach and the Diamond Head',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Mixed review: which lesson from the chapter fits each moment?',['Listen to anyone','Share the credit','Look at the data again','Build on the past'],[
   ['Ruth starts reading every Idea Night card aloud, including ones from first-time members.',0,'Like Kerr, good ideas can come from the lowest rung.'],
   ['In the newsletter, Amara thanks the three river towns whose test data made the sensors work.',3,'Amara built on others’ work and names it, like Allison’s giants.'],
   ['Jun tells the board the raisable shop platforms were Tess’s idea, not Jun’s.',1,'Giving public credit, unprompted, is what Kerr did for U’ren.'],
   ['Sol notices the popcorn bike works best uphill and starts asking why.',2,'A surprise in the results may point to a better question.'],
   ['Lena asks a shy kid what they would change about Young Makers.',0,'Openness means hearing those least likely to speak up.']]);}}
  ]
});
</script>
</body>
</html>
