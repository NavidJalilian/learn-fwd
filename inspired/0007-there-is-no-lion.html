<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>There Is No Lion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0007', title:'There is no lion', minutes:19, icon:'shield',
  goals:['Tell a real threat from an imagined “lion” that sets off your body’s alarm','Explain why creators need psychological safety, and what builds or breaks it','Use simple quieting tools to hear your own voice through the white noise'],
  parts:['Lions','Safety','Quieting tools','White noise'],
  read:'Read “Rise of the Voice” in Book I for Emma Seppälä’s work with veterans and General Walter Piatt’s full story.',
  glossary:{
    'sympathetic-response':'Sympathetic response: the body’s fight-or-flight alarm. Hormones raise adrenaline, focus, heart rate and blood pressure. Useful for a moment, harmful if it lasts.',
    'psych-safety':'Psychological safety: feeling safe from threat and judgment, at work or at home. Emma Seppälä says you need it to innovate.',
    'judgment-trauma':'Judgment trauma: the book’s name for the everyday fear of being judged, learned young, that makes us flinch even at our own ideas. It calls this “everyday PTSD.”',
    'white-noise':'White noise: the book’s image for the outside clamor that drowns out your voice: the internet, rigid assumptions, group loyalties, and ideas that some thoughts are off limits.'
  },
  cheatsheet:[
    '<b>Real lions vs imagined lions:</b> true danger vs threats we blow out of proportion, like a call from the boss. Our bodies react to both the same way.',
    'The <b>sympathetic response</b> (fight-or-flight) helps in a pinch but harms sleep, health and judgment if it lasts.',
    'Seppälä’s breathing work let veterans <b>separate the perception of threat from the alarm</b>. Memories stayed; the panic eased.',
    '<b>Judgment trauma</b> makes us flinch at our own ideas, most of all the personal ones. Yet the personal is what makes an idea unique.',
    'To innovate you need <b>psychological safety</b>. Ideas come in the shower or the car, when we feel relaxed and off guard.',
    'Drugs aren’t shown to boost creativity. <b>Meditation and breathing</b> slow you down so you can judge whether an idea has value.',
    'Hear your voice by <b>quieting the white noise</b>: the internet, rigid assumptions, group loyalties, “off-limits” thoughts.'
  ],
  steps:[
/* ---------- PART 1: LIONS ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Theo Brandt’s phone buzzes during the café rush. It’s the label scout: “Call me when you can.” Theo’s heart pounds before they know what it’s about. What is Theo reacting to?</h1>');
  L.mc(L.card,['Bad news the scout is about to give','A threat Theo is imagining'],1,
   'Theo doesn’t know what the call is about yet. The body is reacting to a danger it has imagined. This lesson is about those imagined dangers.',
   'Theo has no news yet, good or bad. The pounding heart is a reaction to a danger Theo has imagined, and that’s what this lesson is about.');}},
{part:0,src:'Book I · Rise of the Voice',run(L){
  L.h(L.kick('learn','Real lions and imagined ones')+'<h1 class="q">Your body can’t always tell a lion from a phone call</h1>'+
   L.prose('Long ago, if a lion came at our ancestors, the body set off a fast alarm. Scientists call it the '+L.g('sympathetic-response','sympathetic response')+'; you may know it as fight-or-flight.')+
   L.flow([['alert','Threat','A lion, or a call from the boss','real or imagined',4],['flame','Alarm','Adrenaline, focus, heart rate and blood pressure jump','',3],['clock','If it lasts','Poor sleep, a weaker immune system, all attention on the threat','',2]])+
   L.prose('That trade is great when the lion is real. The trouble is that we feel the same jolt over a tense chat with a partner, a child’s so-so grade or getting pulled over. Our bodies haven’t caught up with modern life, and worry makes the alarm louder. Often, the book says, <b>there is no lion</b>.'));
  L.done();}},
{part:0,src:'Book I · Rise of the Voice',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">A veteran learns to hear a car horn as a car horn</h1>');
  L.beats(L.card,[
   ['The researcher','Emma Seppälä works with military veterans with PTSD at Stanford and Yale, and her work has spread to big companies. The author spoke with her in early 2020.'],
   ['The veteran','A man who had questioned prisoners in Afghanistan came home in near-constant terror. He couldn’t sleep, and sleeping pills made it worse.'],
   ['The problem','His body reacted to <i>perceived</i> threats as if they were real. A soldier like him might hear a car honk at home and dive under the table, fearing a roadside bomb.'],
   ['The tool','Seppälä and other researchers used a specific rhythm of breathing that quickly brings on a meditative state. Within weeks, it slowed the alarm hormones before fight-or-flight took over.'],
   ['The change','He still remembered everything, but he could move on. He started sleeping, at times before he even remembered to take his pills.']],
   'Breathing didn’t erase the past. It gave him time to check the real threat, so a slamming door could be just a door.');}},
{part:0,src:'Book I · Rise of the Voice',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">What did the breathing practice actually change for the veterans?</h1>');
  L.mc(L.card,['It erased their painful war memories','It split the sense of threat from the alarm'],1,
   'Right. The researchers set out to untangle the <i>perception</i> of threat from the body’s fight-or-flight response, and the effect built up over time.',
   'The memories stayed. One veteran said he remembered everything but could move on. What changed was that a harmless noise no longer set off the alarm.');}},
{part:0,src:'Book I · Rise of the Voice',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Real lion or imagined lion?',['A real lion','An imagined lion'],[
   ['Late at night the river tops the levee and starts filling the warehouse’s ground floor.',0,'That’s real, immediate danger. A fast alarm is exactly what the moment needs.'],
   ['Ruth, the board chair, emails Jun: “Can we talk tomorrow?” Jun can’t sleep.',1,'Jun has no idea what Ruth wants. The alarm is running on a threat Jun imagined.'],
   ['Lena hears Sol got a so-so grade and spends the evening dreading the parents’ showcase.',1,'A so-so grade can matter, but the book says we often perceive far more threat than is there.'],
   ['A frayed power cord on the table saw throws sparks while Amara is cutting.',0,'Sparks next to a spinning blade are a true danger. Act fast.'],
   ['Theo is sure the scout will hate the new song, though the scout hasn’t heard it.',1,'Nobody has judged the song yet. The judge exists only in Theo’s head.']]);}},

/* ---------- PART 2: SAFETY ---------- */
{part:1,src:'Book I · Rise of the Voice',run(L){
  L.h(L.kick('learn','Everyday PTSD')+'<h1 class="q">We all learned to flinch at judgment, even our own</h1>'+
   L.prose('Most of us have never been to war. But the book says we have all lived through '+L.g('judgment-trauma','judgment trauma')+'. It starts young, peaks for some in the teenage years, and trains the same alarm the veterans had. Only now it fires at the sound of our own ideas.')+
   L.list([['pencil','“Here’s an idea for a book…”','“People will hate it.”'],['bulb','“Here’s an idea for a business…”','“Shut it down before you look like an idiot.”']],4)+
   L.prose('The alarm is loudest for <b>personal</b> ideas, the ones that show your hopes, fears and loves, because judging the idea feels like judging <i>you</i>. Yet that personal stamp is exactly what makes an idea unique and powerful.'));
  L.done();}},
{part:1,src:'Book I · Rise of the Voice',pts:1,
 solve:async L=>{L.$('#al').click();L.$('#br').click();},
 run(L){
  const I=['Sensors that text the levee volunteers directly','Borrow the hospital fridge alarm’s beep pattern','A float made from an old fishing bobber'];const seen=new Set();
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Amara has three half-formed ideas for the flood sensor on the walk home. Run the walk twice: once with the alarm on, once after a few slow breaths.</h1>'+
   '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="al">'+L.ic('alert')+'Alarm on</button><button class="btn" id="br">'+L.ic('leaf')+'Breathe first</button></div>'+
   '<div style="background:var(--soft);border-radius:16px;padding:14px;margin:12px 0 6px;min-height:120px"><div class="small" id="wl" style="margin-bottom:8px">Choose a walk above.</div><div id="wi"></div></div><div id="wq"></div>');
  const show=(k)=>{seen.add(k);
    L.$('#wl').innerHTML=k?'<b>Breathe first:</b> each idea gets written down to check later':'<b>Alarm on:</b> each idea gets judged the moment it appears';
    L.$('#wi').innerHTML=I.map(t=>'<div class="res" style="margin:6px 0">'+(k?L.ic('pencil'):L.ic('x'))+t+' <span style="color:'+(k?'var(--ok)':'var(--no)')+'">'+(k?'· noted':'· “Stupid.”')+'</span></div>').join('');
    if(seen.size===2&&!L.$('#wq').innerHTML){const q=L.$('#wq');q.innerHTML='<h2 class="sub">Between the two walks, what changed?</h2>';
      L.mc(q,['The ideas got better on the second walk','Only Amara’s reaction to the ideas'],1,
       'Same three ideas both times. The only difference was whether the alarm fired before Amara could look at them.',
       'Look again: the ideas were identical. What changed was the instant “Stupid,” the alarm Seppälä’s breathing work is meant to calm.');}};
  L.$('#al').onclick=()=>show(0);L.$('#br').onclick=()=>show(1);}},
{part:1,src:'Book I · Rise of the Voice',run(L){
  L.h(L.kick('learn','Psychological safety')+'<h1 class="q">Why ideas show up in the shower</h1>'+
   L.quote('If you want to innovate, you need psychological safety.','Emma Seppälä, speaking to the author')+
   L.prose('Safety, in the book’s sense, means not feeling threatened from outside: less fear of a lion, a spouse, a boss, or anyone’s judgment. That is why ideas so often arrive in the shower or while driving, when we feel relaxed and off guard.')+
   L.flow([['leaf','Relaxed and safe','Awake but drifting, not on guard'],['bulb','The idea arrives','From a place beyond the thinking mind'],['pencil','Then intellect','Shapes the idea and puts it out']])+
   '<p class="small" style="margin-top:10px">Seppälä says early brain research links this state to alpha waves, between awake and asleep. Treat that as early science.</p>');
  L.done();}},
{part:1,src:'Book I · Rise of the Voice',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Theo’s best lines come while washing café dishes after closing, not in the music room when they tell themselves “write a hit now.” Why, according to the chapter?</h1>');
  L.mc(L.card,['Washing dishes feels safe, so the guard drops','Theo works harder at the café than at night','Repetitive chores make Theo think more logically'],0,
   'Exactly. Doing dishes, Theo isn’t bracing for judgment. In the music room, “write a hit” sets off the alarm before an idea can land.',
   'The chapter’s point is about feeling safe and relaxed, not effort or logic. With the guard down, ideas get through.');}},
{part:1,src:'Book I · Rise of the Voice',pts:5,run(L){
  L.h(L.kick('pr','Idea Night check')+'<h1 class="q">Ruth wants Idea Night to feel safer. Sort each habit.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Builds safety','Sets off the alarm'],[
   ['Ruth asks “and how will that pay for itself?” one minute into each pitch.',1,'Judging the idea before it’s even out puts every pitcher on guard.'],
   ['The first round is ideas only; questions come in a second round.',0,'Separating hearing from judging gives ideas room to show up.'],
   ['Members groan and laugh when Jun mentions the ferry again.',1,'Laughter is exactly the judgment people learned to fear as kids.'],
   ['Anyone can drop a rough idea in a box before the night.',0,'A rough idea in a box faces no stares, so personal ideas get through.'],
   ['Pitches are scored live on a big screen as people talk.',1,'Live scoring turns each pitch into a threat, so people bring only safe ideas.']],
   'Safety doesn’t mean no judging at all. It means the judging comes after the idea is out, not as a reflex.');}},

/* ---------- PART 3: QUIETING TOOLS ---------- */
{part:2,src:'Book I · Rise of the Voice',run(L){
  L.h(L.kick('learn','What about drugs?')+'<h1 class="q">One musician’s view, and what the research says</h1>'+
   L.prose('Many creators have said drugs help them hear their voice. The author asked Carlos Santana, who credited marijuana with helping him believe in himself.')+
   L.lanes([['person','Santana’s own story','When pressed, he said he stopped using it from 1972 to 1982 and was intensely creative anyway. He found meditation, which gave him more clarity. Later he called weed a shortcut to the discipline of meditating.',3],
            ['book','The research','A 2016 review of the major studies couldn’t show that drug use directly made people more creative. The book’s verdict: not a proven path to a creative mind.',2]])+
   L.note('The author treats Santana’s praise as one man’s view. The tool that held up is the quiet, steady one: meditation and breathing.','info'));
  L.done();}},
{part:2,src:'Book I · Rise of the Voice',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">A café regular tells Theo that smoking before writing is how the greats found their sound. What does the chapter say?</h1>');
  L.mc(L.card,['Studies show it reliably sparks creativity','Studies haven’t shown it boosts creativity','It works for musicians but not scientists'],1,
   'Right. A 2016 review couldn’t show it, and even Santana did intensely creative work for a decade without it.',
   'The book cites a 2016 review that couldn’t show drug use directly boosted creativity, in any field. Santana himself found meditation worked better.');}},
{part:2,src:'Book I · Rise of the Voice',run(L){
  L.h(L.kick('learn','Simple quieting tools')+'<h1 class="q">Slow down long enough to judge what an idea is worth</h1>'+
   L.prose('The author says this isn’t a self-help book, so it offers only a few examples: guided-meditation apps, the sound of rain, or simply watching your breath. Here’s what he does himself:')+
   L.list([['leaf','Two phrases','Breathing in, he thinks “inhale calm.” Breathing out, “exhale stress” or “exhale fear.”'],
     ['list','Counting','He counts breaths to four, then starts again. On racing days he aims for twenty, and starts over at one each time his mind drifts.']],2)+
   L.prose('These tools don’t make you numb or dumb. They help you link feelings, experiences and ideas without freezing up. And they <b>slow down your perceptions</b>, so you can check whether something has value. A fast, distracted life makes it easy to ignore the ideas that scare us.'));
  L.done();}},
{part:2,src:'Book I · Rise of the Voice',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Tap each piece until the sentence matches the chapter.</h1>');
  L.sentence(L.card,[['Breathing practice','Constant stimulation','A stronger filter'],['speeds up','slows down','shuts off'],['your feelings,','your memories,','your perceptions,'],['so the ideas stop coming at all.','so you can judge if an idea has value.','so nobody can judge you again.']],[0,1,2,1],
   [['Constant stimulation is what lets us ignore our ideas, not hear them.','A stronger filter is the problem this chapter is trying to fix.'],['The chapter warns that speed makes it easier to ignore ideas.','The book says these tools don’t make you numb; nothing gets shut off.'],['The tools don’t remove what you feel; they help you connect feelings and ideas.','The veterans kept their memories; the goal isn’t to erase them.'],['Quieting isn’t about stopping ideas; it’s about hearing them.','Nobody can stop all outside judgment. The tool changes your reaction, not the world.']],
   'Slowing down doesn’t remove anything. It gives you the time to look at an idea before the alarm decides for you.');}},
{part:2,src:'Book I · Rise of the Voice',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Does the chapter back this up?',['The chapter backs it','The chapter disputes it'],[
   ['Mindfulness makes people soft and slow to act.',1,'A general in the chapter says it does the opposite: it brings you on point.'],
   ['The calming effect of breathing practice can build up over time.',0,'Seppälä’s research found the body and mind grew calmer even between sessions.'],
   ['Breathing exercises wipe out painful memories.',1,'The veterans remembered everything. They could pull past and present apart.'],
   ['Ideas tend to come when we feel relaxed and not on guard.',0,'That’s why the shower and the car are classic idea spots.'],
   ['Drug use is a proven gateway to a creative mind.',1,'A 2016 review couldn’t show that drugs directly boost creativity.']]);}},

/* ---------- PART 4: WHITE NOISE ---------- */
{part:3,src:'Book I · Rise of the Voice',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">A general who listened without judging</h1>');
  L.beats(L.card,[
   ['Who','Walter Piatt, a decorated combat veteran who later became director of the US Army Staff at the Pentagon. Also a poet and author, and a nonconformist.'],
   ['Afghanistan, 2003','A distressed sergeant said he felt only hate for the enemy, then asked if Piatt actually liked them. Part of Piatt did. He wrote his feelings down, trying not to judge or explain them, so he wouldn’t put up an emotional shield.'],
   ['A grenade','A young boy threw a grenade at Piatt’s vehicle; no one was hurt. Instead of punishing the boy’s father, Piatt opened a dialogue and learned extremists had threatened the village’s children.'],
   ['A sheep in the wire','Soldiers detained a shepherd boy whose sheep got caught in the base’s wire. Piatt let the problem percolate. His idea: the army bought animals to graze near the wire and worked with locals to graze farther out. A peace was born.'],
   ['A daily practice','In 2010 he learned mindfulness from researchers. Before a delicate meeting in Iraq, he did deep breathing under a palm tree, then listened to a tribal leader without forming a reply. Her expression said: we can work with this person.']],
   'Even creators who seem born with the knack can amplify it. Creators emerge over time; it’s not a one-time deal.');}},
{part:3,src:'Book I · Rise of the Voice',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">How did Piatt reach his answer to the sheep problem?</h1>');
  L.mc(L.card,['He followed the standard procedure faster','He let his mind wander on the problem','He asked his officers to vote on options'],1,
   'Yes. He let the problem percolate, and the grazing idea arrived, solving the problem behind the incident instead of just the incident.',
   'Standard procedure is what caused the arrest. The chapter says Piatt let his mind wander and let the problem percolate until an idea came.');}},
{part:3,src:'Book I · Rise of the Voice',run(L){
  L.h(L.kick('learn','Quiet the white noise')+'<h1 class="q">To hear your voice, turn down everything else</h1>'+
   L.prose('Piatt saw it in the Pentagon too: bright people with fixed ideas or fears, where the best idea can turn everyone off. His fix was to be open-minded. The chapter’s key takeaway is to quiet the '+L.g('white-noise','white noise')+' around you:')+
   L.list([['eye','The scream of the internet','Constant feeds and opinions'],['lock','Rigid assumptions','Notions you formed long ago and never checked'],['people','Group rules','The rules of partisanship: what “our side” thinks'],['x','Off-limits thoughts','Old, baked-in beliefs that some feelings aren’t allowed']],3)+
   L.prose('Breathing and emptying your head of those voices lets your own voice break through. But your voice isn’t the same as your ideas. The next lesson covers one way ideas surface: '+L.g('mind-wandering','mind wandering')+'.'));
  L.done();}},
{part:3,src:'Book I · Rise of the Voice',pts:4,run(L){
  L.h(L.kick('pr','Name the noise')+'<h1 class="q">Which kind of white noise is drowning out each voice at Alder Commons?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Internet','Rigid assumption','Group rules','Off-limits thought'],[
   ['Theo scrolls comments on other musicians’ videos until 2 a.m. instead of writing.',0,'The endless feed is the internet’s scream.'],
   ['A board member says ferries are for carrying people, so a floating workshop can’t work.',1,'That’s a fixed idea nobody has checked against Jun’s plan.'],
   ['A member votes against a pitch because the “other camp” on the board backs it.',2,'Siding with a camp, not judging the idea, is a group rule at work.'],
   ['Amara thinks a lab technician has no business writing poetry about the river.',3,'That’s a baked-in belief that some thoughts and feelings are off limits.']],
   'Each kind of noise is someone else’s voice. Turn it down and there’s room to hear your own.');}},
{part:3,src:'Book I · Rise of the Voice',pts:1,run(L){
  L.h(L.kick('pr','Apply it')+'<h1 class="q">Jun has ten minutes before a tense board meeting about the ferry. Ruth is known to be skeptical. What would the chapter suggest?</h1>');
  L.mc(L.card,['Rehearse sharp comebacks to every objection','Skip the meeting and email the plan instead','Breathe slowly, then listen without forming replies'],2,
   'That’s Piatt’s palm-tree move. Calm first, then really hear Ruth, and Ruth may see a partner worth working with.',
   'Rehearsing comebacks keeps the alarm running, and skipping avoids the lion without checking it’s real. Piatt breathed first, then listened without preparing a reply.');}}
  ]
});
</script>
</body>
</html>
