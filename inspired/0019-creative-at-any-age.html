<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creative at Any Age</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0019', title:'Creative at any age', minutes:19, icon:'clock',
  goals:['Explain why creativity doesn’t simply fade with age, using the research the book cites','Show how self-knowledge and expertise let late bloomers peak later','Use Jake Schroeder’s late calling to spot when inspiration is finally free to take hold'],
  parts:['Age and output','Late bloomers','A late calling','Chaos and timing'],
  read:'Read “Age” and “Two Short War Stories” in Book III for the full list of creators and their ages, and for Jake Schroeder’s trips to Normandy with veterans, police officers and kids.',
  glossary:{
    'late-bloomer':'Late bloomer: someone whose most creative work comes later in life, often at an age when early starters have already peaked.',
    'peak-output':'Peak productivity: the stretch of life when someone produces the most work. Dean Simonton found that peak creativity tends to fall in the same stretch.'
  },
  cheatsheet:[
    'Does creativity decline with age? Dean Simonton’s answer: <b>not quite</b>.',
    '<b>Peak creativity tracks peak productivity</b>, which takes energy. Some fields, like history and philosophy, show no clear decline.',
    '<b>Late bloomers</b> peak when early bloomers are past their prime. You can stay creative your whole life.',
    'Age brings <b>self-knowledge</b> (what you care about) and <b>expertise</b> (how things work). The author thinks this is the bigger reason.',
    'Nobel physics work: a century ago, a third came before age 30. Today the average age is <b>48</b>.',
    'Jake Schroeder left rock stardom and found his calling near fifty: taking <b>police officers and kids</b> to Normandy with WWII veterans.',
    'Schroeder’s idea of inspiration: <b>losing the shame</b> of feeling “not good enough.”',
    'War’s chaos also drove creation: <b>mass-produced penicillin</b> and the <b>first computers</b>. Disruption, creation, again and again.'
  ],
  steps:[
/* ---------- PART 1: AGE AND OUTPUT ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">At a board meeting, a member says Jun, at 58, is too old to lead something as big as the ferry workshop. Which is the fairer reply?</h1>');
  L.mc(L.card,['Age alone tells you little about it','The member is right, ideas fade early'],0,
   'Good instinct. This lesson looks at what research says about age and creativity, and the answer is far more hopeful than the board member thinks.',
   'It feels true, but the research in this chapter says otherwise. Plenty of people do their best creative work late in life.');}},
{part:0,src:'Book III · Age',run(L){
  L.h(L.kick('learn','Does creativity decline with age?')+'<h1 class="q">A researcher who counted what geniuses actually made</h1>'+
   L.prose('Psychologist Dean Simonton studies hard facts from creators’ lives: how many papers, patents or works they produced, and when. In a 2016 magazine article he asked whether creativity declines with age. His answer:')+
   L.quote('I can offer a confident answer: not quite!','Dean Simonton, quoted in “Age”')+
   L.prose('What he found is that a person’s peak creativity tends to line up with their '+L.g('peak-output','peak productivity')+'. That makes sense: following through on ideas takes energy, and it’s harder when you need more naps.')+
   L.prose('And in some careers, like history and philosophy, there is no clear decline at all.'));
  L.done();}},
{part:0,src:'Book III · Age',run(L){
  L.h(L.kick('ex','The author’s hunch')+'<h1 class="q">Why might some careers keep producing longer than others?</h1>');
  L.beats(L.card,[
   ['A guess, not data','Richtel offers his own observation from years of interviews. He says plainly it isn’t based on research.'],
   ['Outside information','Historians, scientists and journalists draw on material from <b>outside themselves</b>. Each year adds more to work with, so the well keeps filling.'],
   ['Only yourself','Artists draw mostly on their own inner life. The big discoveries about yourself tend to come early, so a style can peak young.'],
   ['The echo','Later work may still be plentiful, but it can sound like the earlier work. Think of a favorite musician whose new album reminds you of their old ones.']],
   'The author’s hunch: work that keeps feeding on new outside material may stay fresh longer. He offers it as an idea, not a finding.');}},
{part:0,src:'Book III · Age',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">According to Simonton, when does a person’s creativity usually peak?</h1>');
  L.mc(L.card,['Before they turn thirty years old','When they produce the most work','Right after they win their first prize'],1,
   'Right. Peak creativity tends to line up with peak productivity, which depends a lot on energy.',
   'Simonton didn’t tie the peak to a fixed age or to prizes. Creativity tends to peak when a person is producing the most work.');}},
{part:0,src:'Book III · Age',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Does the chapter back this claim?',['Backed by the chapter','Not what it says'],[
   ['“Creativity mostly ends by middle age.”',1,'Simonton’s answer to “does it decline?” was “not quite.” Late bloomers peak when early ones fade.'],
   ['“Historians and philosophers show no clear creative decline.”',0,'Simonton named these careers as ones with no noticeable drop.'],
   ['“Creative peaks tend to come when people produce the most.”',0,'That’s Simonton’s main finding: peak creativity tracks peak productivity.'],
   ['“Science has proven that artists always peak young.”',1,'That’s the author’s own guess, and he says it isn’t based on data. Nothing was proven.']]);}},

/* ---------- PART 2: LATE BLOOMERS ---------- */
{part:1,src:'Book III · Age',run(L){
  L.h(L.kick('learn','Late bloomers')+'<h1 class="q">Some people peak just as others fade</h1>'+
   L.prose('Simonton points out that '+L.g('late-bloomer','late bloomers')+' reach their creative peaks at ages when early bloomers are past their prime. So it’s possible to stay creative your whole life.')+
   L.prose('The author adds what he thinks is an even stronger reason creativity can ripen with age:')+
   L.lanes([['person','You know yourself','Over time people understand their own passions better. Longer lives give more time to hear yourself.',1],
            ['layers','You know how things work','Years of learning build expertise, so you have more to connect.',2]])+
   '<p class="small" style="margin-top:10px">Next: a striking number about Nobel Prize physics.</p>');
  L.done();}},
{part:1,src:'Book III · Age',pts:1,
 solve:async L=>{L.$('#po').children[2].click();L.$('#go2').click();},
 run(L){
  let p=null;const A=['About 28','About 38','About 48'];
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">Economists at Ohio State studied hundreds of Nobel Prize physics discoveries. Today, at what average age do physicists do their prize-winning work?</h1><div id="po"></div>'+
   '<div id="rv" hidden><div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:6px"><div><div class="small">Average age of prize work</div><div class="week" id="ag">Age 20</div></div><button class="btn pri" id="go2">'+L.ic('play')+'Reveal</button></div>'+
   '<div class="meterrow"><div class="lb">Today</div><div class="meter"><div id="mt" style="background:var(--ok-strong)"></div></div></div>'+
   '<div class="small" id="cent" style="margin-top:8px;opacity:0;transition:opacity .4s">A century ago: about a third did their prize work before 30, and another third before 40.</div></div>');
  A.forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=n;b.onclick=()=>{if(p!==null)return;p=j;b.classList.add('sel');L.$('#rv').hidden=false;};L.$('#po').appendChild(b);});
  L.$('#go2').onclick=function(){this.remove();let a=20;
    const t=setInterval(()=>{a+=2;const el=L.$('#ag'),m=L.$('#mt');if(!el){clearInterval(t);return;}el.textContent='Age '+a;if(m)m.style.width=Math.round(a/80*100)+'%';
      if(a>=48){clearInterval(t);const c=L.$('#cent');if(c)c.style.opacity=1;L.award(p===2);
        L.sheet(p===2?'ok':'no',p===2?'You called it!':'It’s 48','The young-genius image is out of date. People live longer, have more time to learn, and the fields have grown more complex. Very little breakthrough physics now comes from people under thirty.');L.done();}},80);};}},
{part:1,src:'Book III · Age',run(L){
  L.h(L.kick('ex','Creators from this book, by age')+'<h1 class="q">Tap each card to see when the creativity came</h1>');
  L.flips(L.card,[
   ['Jim Allison','Won the Nobel Prize for Medicine at <b>seventy</b>, for cancer work that spanned forty years. Still trying to extend it to more cancers.'],
   ['Steve Kerr','Won titles as a player, then three more as a coach, when he was decidedly creative in his <b>forties</b>.'],
   ['Mike Monsky','The Clean Remote inventor hit the most creative stretch of his life during the pandemic, in his <b>seventies</b>.'],
   ['Jennifer Eberhardt','Her curiosity wandered for years, then settled on unconscious bias and police. Her book came out in her <b>mid-fifties</b>.'],
   ['Rhiannon Giddens','In her <b>mid-forties</b>, kept producing so many projects that the author told her he couldn’t keep up.'],
   ['Bruce Springsteen','Still putting out rock albums in his <b>seventies</b>.']],
   'The author’s point: how old is a creator? Any age will do.');}},
{part:1,src:'Book III · Age',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Why do physicists now make their Nobel-winning discoveries later than they did a century ago?</h1>');
  L.mc(L.card,['Young physicists today are less talented','Prize committees now favor older people','Longer lives and more complex fields'],2,
   'Right. People live longer and have more time to learn, and the fields have grown more complex, so breakthroughs come later.',
   'The book doesn’t blame talent or prize committees. It says people live longer, have more time to learn, and the fields have become more complex.');}},
{part:1,src:'Book III · Age',pts:1,run(L){
  L.h(L.kick('pr','Build the argument')+'<h1 class="q">Jun wants a short answer for the board member who said 58 is too old. Tap each piece until it matches the chapter.</h1>');
  L.sentence(L.card,[['Creative peaks follow','Creativity declines with'],['peak IQ,','peak productivity,','early fame,'],['and late bloomers peak','and early bloomers peak','and most people peak'],['before age thirty.','when early bloomers fade.','only once, then stop.']],[0,1,0,1],
   [['Simonton’s answer to “does creativity decline?” was “not quite.” Peaks follow something.'],['Simonton tied the peak to how much people produce, not to IQ.','Fame isn’t the measure here. Simonton tied the peak to productivity.'],['The point is about late bloomers: they peak at a different time.','Simonton didn’t say most people peak at one set age.'],['Late bloomers peak later, not before thirty.','The research says creativity can continue throughout life.']],
   'That’s Simonton’s case in one line: peaks follow productivity, and late bloomers peak when early bloomers fade.');}},
{part:1,src:'Book III · Age',pts:1,run(L){
  L.h(L.kick('pr','Apply it')+'<h1 class="q">Jun welded ships for decades before founding the Commons. What does the chapter say those years add to the ferry idea?</h1>');
  L.mc(L.card,['Habits that make new ideas harder to see','Knowledge of how things work and of themselves','Nothing much: ideas come from fresh minds'],1,
   'Right. The author’s stronger reason creativity ripens with age: people understand how things work and know their own passions better. Jun knows hulls, welding and what they care about.',
   'The chapter argues the opposite. Years of experience give expertise and self-knowledge, which the author sees as a big reason creativity can grow with age.');}},

/* ---------- PART 3: A LATE CALLING ---------- */
{part:2,src:'Book III · Two Short War Stories',run(L){
  L.h(L.kick('ex','A real story from the book')+'<h1 class="q">A rock star who wasn’t happy</h1>');
  L.beats(L.card,[
   ['The star','Jake Schroeder, a childhood friend of the author, sang lead in Opie Gone Bad, one of Colorado’s most popular bands. It headlined the famous Red Rocks venue nine times.'],
   ['The doubt','Before each show he talked himself down, telling himself nobody would come or dance, so he wouldn’t be disappointed.'],
   ['The hollow part','His experience was mostly about the <b>crowd’s reaction</b>, not his own drive. He rarely wrote the songs, so the role felt a bit mechanical.'],
   ['The slide','Divorce, partying, feeling dark about who he was. A life that looked enviable wasn’t true to him.']],
   'From the outside he was a great creator. From the inside he was performing for others, not creating from his own voice.');}},
{part:2,src:'Book III · Two Short War Stories',run(L){
  L.h(L.kick('learn','The calling arrives near fifty')+'<h1 class="q">Connecting very different dots</h1>'+
   L.prose('After rock, Schroeder ran Denver’s Police Athletic League, which uses youth sports to build good relations between kids and police. His music shrank to one song: the national anthem at hockey games.')+
   L.prose('There he met soldiers who escorted World War II veterans back to Normandy. On a 2013 trip, he watched an old veteran open up to young soldiers back from Afghanistan as if they were family. That’s when it hit him.')+
   L.flow([['shield','WWII veterans','Their stories of sacrifice','',1],['people','Police officers','From Denver','',2],['person','Young people','From poor, minority neighborhoods','',3]],false)+
   L.prose('His plan: bring officers and kids to meet the veterans on the D-Day battlefields, so they’d get lost in the moment and see each other as people. The first trip, in 2016, took three kids, four veterans and four cops.'));
  L.done();}},
{part:2,src:'Book III · Two Short War Stories',run(L){
  L.h(L.kick('ex','What one trip did')+'<h1 class="q">Alex goes to Normandy</h1>');
  L.beats(L.card,[
   ['Who','Alejandro “Alex” Rizo, thirteen, from the poorest part of Denver, won a place by writing an essay.'],
   ['What he saw','Rows of white crosses, and a village church where two young American medics had cared for the wounded of both sides and were credited with saving 81 lives.'],
   ['What changed','At night he talked with a Denver homicide detective. He came to see not just a uniform but a dad, a husband and a son. They became friends.'],
   ['The rudder','Schroeder compares the program to the tiny rudder that starts a huge ship turning. A few kids and cops a year still count.']],
   'Helping a handful of people a year means more to Schroeder than thousands of screaming fans did.');}},
{part:2,src:'Book III · Two Short War Stories',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Why did rock stardom leave Schroeder unfulfilled?</h1>');
  L.mc(L.card,['It was mostly about the crowd’s reaction','The band was never really very popular','He had no singing talent to build on'],0,
   'Right. Looking back, his singing was more about how the audience responded than about his own drive, and he rarely wrote the songs.',
   'The band was hugely popular and his voice was remarkable. The problem was that the work centered on the crowd’s reaction, not his own inspiration.');}},
{part:2,src:'Book III · Two Short War Stories',pts:1,run(L){
  L.h(L.kick('pr','Put it in order')+'<h1 class="q">Arrange the steps of Schroeder’s path, from first to last.</h1>');
  L.order(L.card,['Sings lead in a hit Colorado band','Retires from rock and settles down','Meets soldiers who escort WWII veterans','Rides with a veteran and young soldiers','Takes kids and cops to Normandy'],
   'Each step added a dot: the stage, a quieter life, the soldiers he met while singing the anthem, and the moment in the car that connected them all.');}},
{part:2,src:'Book III · Two Short War Stories',pts:1,run(L){
  L.h(L.kick('pr','Apply it')+'<h1 class="q">Theo’s cover gigs fill the room, but Theo admits they mostly watch the crowd for approval. What would Schroeder’s story suggest Theo pay attention to?</h1>');
  L.mc(L.card,['The size of the crowd at each gig','Bookings that pay the most money','What truly inspires Theo inside'],2,
   'Right. Schroeder had huge crowds and still felt empty. The work that lit him up came from his own inspiration, not the audience’s reaction.',
   'Schroeder had crowds and money and was still unhappy. His story points Theo toward what moves Theo inside, not toward outside measures.');}},

/* ---------- PART 4: CHAOS AND TIMING ---------- */
{part:3,src:'Book III · Two Short War Stories',run(L){
  L.h(L.kick('learn','War’s chaos and creation')+'<h1 class="q">Disruption, creation, again and again</h1>'+
   L.prose('The chapter’s war stories also show the book’s '+L.g('call-response','call-and-response')+' pattern on a huge scale.')+
   L.list([['flask','Penicillin','Fleming found it in mold in 1928. In 1941 it helped an English policeman, but there wasn’t enough, and he died. Before D-Day, 21 companies made 2.3 million doses.'],
     ['lock','Code breaking','Alan Turing led work to crack the German Enigma code and helped shape the basic principle of modern computing.'],
     ['box','The first computer','In the US, a machine with 18,000 vacuum tubes was built to run big calculations for the army. It was revealed in 1946.']],3)+
   L.note('The war also produced the atomic bomb. As the book says throughout, creations are not good or bad in themselves.','alert'));
  L.done();}},
{part:3,src:'Book III · Two Short War Stories',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">What does the penicillin story show about creativity?</h1>');
  L.mc(L.card,['A crisis can push a creation to scale','Good ideas spread quickly on their own','Lab science matters more than factories'],0,
   'Right. Penicillin sat as a discovery for years. The pressure of war got 21 companies to make millions of doses.',
   'Penicillin didn’t spread on its own: there wasn’t enough to save the first patient. The chaos of war is what pushed its mass production.');}},
{part:3,src:'Book III · Two Short War Stories',run(L){
  L.h(L.kick('learn','When inspiration takes hold')+'<h1 class="q">Shame out, inspiration in</h1>'+
   L.prose('Schroeder described inspiration to the author in personal terms: it’s when he loses the shame of feeling he might not be good enough to do something like this.')+
   L.prose('That freedom hit him in his forties. The author’s conclusion: three things combine differently in each person, so the creative spirit takes hold at different times.')+
   L.flow([['map','Circumstances','Where life puts you','',1],['flame','Emotional state','Free of shame and doubt','',2],['layers','Expertise','What you’ve learned','',3]])+
   L.prose('Schroeder’s story shows two more lessons: age can lend the wisdom and experience that let a muse blossom, and creativity doesn’t need to be a '+L.g('big-c','Big C')+' to be powerful.'));
  L.done();}},
{part:3,src:'Book III · Two Short War Stories',pts:4,run(L){
  L.h(L.kick('pr','Which lesson fits?')+'<h1 class="q">Sort each Alder Commons moment by the lesson from Schroeder’s story it best shows.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Age adds wisdom','Small can be powerful','Chaos drives creation'],[
   ['Jun’s shipyard years tell them exactly which ferry hull plates can be saved.',0,'Decades of experience give Jun know-how a younger member wouldn’t have.'],
   ['Amara’s sensors only protect ten homes on River Street, and those neighbors sleep better.',1,'Like Schroeder’s little rudder, helping a few people still counts.'],
   ['The spring flood pushed Jun to build a sandbag-filling rig from shop scrap.',2,'A disruption called out a burst of creation, just as the war did with penicillin.'],
   ['Lena’s mural project reaches one class, and one shy kid finally speaks up.',1,'It’s no Big C, and it doesn’t need to be.']],
   'Schroeder’s story carries all three: experience ripens a muse, small creations matter, and disruption sparks creation.');}},
{part:3,src:'Book III · Two Short War Stories',pts:1,run(L){
  L.h(L.kick('pr','Apply it')+'<h1 class="q">Hal Pruitt, 67, a retired river-barge pilot, joins the Commons after the flood. They have a clever idea for a tow rig but say, “Who am I to pitch at Idea Night? I’ve never made anything.” What is holding Hal back?</h1>');
  L.mc(L.card,['Their age, which is past any creative peak','Shame about not being good enough','A lack of any useful experience at all'],1,
   'Right. In Schroeder’s words, inspiration comes when you lose the shame of feeling not good enough. Hal’s age and decades on the river are assets, not obstacles.',
   'The chapter says age doesn’t stop creativity, and Hal has decades of river know-how. What blocks them is the shame of feeling not good enough.');}},
{part:3,src:'Book III · Age',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Mixed review: does the chapter support this?',['Supported','Not supported'],[
   ['A board member says, “Breakthroughs come from people under thirty.”',1,'Not anymore: today’s Nobel physics work comes at an average age of 48.'],
   ['Ruth says, “Jun’s decades of work could help this idea, not hurt it.”',0,'Expertise and self-knowledge are why creativity can ripen with age.'],
   ['Theo says, “A small project for a few people can still be powerful.”',0,'Schroeder’s trips touch a few kids and cops a year, and he values that above stadium crowds.'],
   ['Amara says, “Creative peaks come at a fixed age for everyone.”',1,'Late bloomers peak when early bloomers fade. Circumstances, emotions and expertise differ by person.'],
   ['Lena says, “Big disruptions can also spark big creations.”',0,'War drove penicillin’s mass production and the first computers: call-and-response.']]);}}
  ]
});
</script>
</body>
</html>
