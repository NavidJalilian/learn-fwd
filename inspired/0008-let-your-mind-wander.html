<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Let Your Mind Wander</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0008', title:'Let your mind wander', minutes:19, icon:'compass',
  goals:['Explain what the research shows about ideas that arrive while the mind wanders, and what it doesn’t','Tell free, creative wandering from worry and from screen-filled distraction','Make room for unjudged mind wandering alongside focused work'],
  parts:['Drifting','The evidence','The twist','Without judgment'],
  read:'Read “Mind Wandering” in Book I for the full studies and Garry Trudeau’s account of his writing routine.',
  glossary:{
    'impasse':'Impasse: a point where you feel stuck on a problem and can’t see a way forward.',
    'hypnagogic':'Hypnagogic state: the drowsy space between being awake and asleep, which researcher Jonathan Schooler calls the space between conscious and unconscious.'
  },
  cheatsheet:[
    'Bedtime daydreams are <b>unfiltered output</b> from your mind: a free flow, not a worry loop.',
    '2017 study of writers and physicists: about <b>20%</b> of their best daily ideas came while the mind wandered, and <b>26%</b> of ideas that broke an impasse, with more “aha.”',
    'About <b>80%</b> still came from focused work. Wandering adds to effort; it doesn’t replace it.',
    'Tip-of-the-tongue: stop straining and it comes. Dalí and Edison used the <b>drowsy edge of sleep</b> on purpose.',
    'Deadlines: an accelerant for Trudeau, a source of forced, “B-plus” ideas for the author.',
    'Harvard: minds wander <b>47%</b> of the time, and wandering often feels unhappy because it turns into worry.',
    'Many people would rather <b>shock themselves</b> than sit alone with their thoughts for 15 minutes; most of us fill the quiet with screens.',
    'Creators learn to wander <b>without judgment</b>. Fear is not the creator’s friend (with one loophole, coming next).'
  ],
  steps:[
/* ---------- PART 1: DRIFTING ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Amara can’t recall the name of a parts supplier. The harder Amara tries, the more it slips away. What usually works?</h1>');
  L.mc(L.card,['Drop it, and let it come back later','Keep straining until it surfaces'],0,
   'Usually it pops up an hour later, while you’re doing something else. That everyday trick is a small version of this whole lesson.',
   'Straining tends to make it worse. Most people find the name arrives once they stop trying, and this lesson is about why.');}},
{part:0,src:'Book I · Mind Wandering',run(L){
  L.h(L.kick('learn','The bedtime storyteller')+'<h1 class="q">You may already be making up stories every night</h1>'+
   L.prose('Looking back, the author realized he had been writing stories all his life, in bed. At about ten, he imagined an hour-long shopping spree with five hundred dollars in a sporting-goods store. As a teen, he fended off enemies from a cabin, saving himself and the world.')+
   L.prose('This, he says, was random output from the back of his mind. Relaxed to the point of sleep, it was <b>the unfiltered him</b>, and that is where ideas come from when they can arrive without judgment or fear.')+
   L.lanes([['compass','Mind wandering','A free flow, like a magic carpet that steers itself wherever it goes.',2],['alert','Worry','Getting stuck on a fear and circling it again and again. Not what he means.',4]])+
   '<p class="small" style="margin-top:10px">The calm, unjudging state from the last lesson is what lets this kind of wandering happen.</p>');
  L.done();}},
{part:0,src:'Book I · Mind Wandering',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Lena lies awake replaying a parent’s complaint about the Young Makers showcase. Is that the mind wandering the author means?</h1>');
  L.mc(L.card,['Yes, any drifting thought at bedtime counts','No, that’s worry circling one fear'],1,
   'Right. The author separates a free flow that steers itself from getting stuck on a worry.',
   'The author is explicit: he doesn’t mean fixating on worry. Lena’s mind isn’t roaming; it’s stuck on one fear.');}},

/* ---------- PART 2: THE EVIDENCE ---------- */
{part:1,src:'Book I · Mind Wandering',run(L){
  L.h(L.kick('learn','A study of working creators')+'<h1 class="q">Where do professionals’ best ideas come from?</h1>'+
   L.prose('A study published in 2017 followed 53 professional writers and 45 physicists. Every night, each one emailed back the most creative idea they’d had that day, and answered a few questions about it.')+
   L.list([['eye','What were you thinking about?','Something unrelated, or the problem itself?'],['pointer','What were you doing?','Working on the project, on other work, or something unrelated, like paying a bill?'],['star','How did it feel?','Was it an “aha” moment? How important and how creative was it, on a 1-to-7 scale?']],2));
  L.done();}},
{part:1,src:'Book I · Mind Wandering',pts:1,
 solve:async L=>{L.$('#po').children[1].click();L.$('#go').click();},
 run(L){
  let p=null;const O=['About 5%','About 20%','About 50%','About 80%'];
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">What share of these creators’ ideas came while their minds were wandering, off the task at hand?</h1><div id="po"></div>'+
   '<button class="btn pri" id="go" hidden style="margin-top:12px">'+L.ic('play')+'Show the results</button><div id="rs"></div>');
  O.forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=n;b.onclick=()=>{if(p!==null)return;p=j;b.classList.add('sel');L.$('#go').hidden=false;};L.$('#po').appendChild(b);});
  L.$('#go').onclick=function(){this.remove();
    const row=(lb,id,c)=>'<div class="meterrow"><div class="lb">'+lb+'</div><div class="meter"><div id="'+id+'" style="background:'+c+';width:0;transition:width 1s"></div></div></div>';
    L.$('#rs').innerHTML='<div style="margin-top:12px">'+row('All ideas · wandering','a','var(--h2)')+row('Impasse-breakers · wandering','b','var(--h3)')+row('All ideas · focused','c','var(--h4)')+'</div>';
    setTimeout(()=>{const a=L.$('#a');if(!a)return;a.style.width='20%';L.$('#b').style.width='26%';L.$('#c').style.width='80%';},200);
    setTimeout(()=>{if(!L.$('#rs'))return;L.award(p===1);
      L.sheet(p===1?'ok':'no',p===1?'You called it!':'About 20%','About one idea in five came while the mind wandered, and <b>26%</b> of the ideas that broke an '+L.g('impasse','impasse')+'. Those ideas also felt more like “aha.” But roughly <b>80%</b> came from focused work.');L.done();},1400);};}},
{part:1,src:'Book I · Mind Wandering',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Amara reads about the study and plans to stop scheduled design work and wait for ideas to drift in. What does the study say about that plan?</h1>');
  L.mc(L.card,['Most ideas still came from focused work','Wandering ideas were rated less important','Only writers, not physicists, gained from it'],0,
   'Right. About 80% of ideas came from directed effort. Wandering is a valuable extra, especially when stuck, not a replacement.',
   'The study found wandering ideas felt more like “aha,” in both groups. The catch is that about 80% still came from focused work, so quitting it would be a mistake.');}},
{part:1,src:'Book I · Mind Wandering',run(L){
  L.h(L.kick('learn','Letting go on purpose')+'<h1 class="q">How can you be as good when you’re not trying?</h1>'+
   L.prose('Jonathan Schooler, one of the study’s authors, still marvels that people were about as creative in the shower, gardening or paying bills as while working. His everyday example is the name on the tip of your tongue.')+
   L.quote('If you just let it go, it will come to you.','Jonathan Schooler, speaking to the author')+
   L.prose('He also tells of Salvador Dalí and Thomas Edison dozing off holding a spoon or a ball bearing. When it clattered to the floor and woke them, both found they had ideas. Schooler calls that drowsy zone the '+L.g('hypnagogic','hypnagogic state')+': between asleep and awake, which is where daydreaming lives too.'));
  L.done();}},
{part:1,src:'Book I · Mind Wandering',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">A cartoonist’s shower, and a disagreement about deadlines</h1>');
  L.beats(L.card,[
   ['The shower','Garry Trudeau, the Pulitzer-winning creator of <i>Doonesbury</i>, told the author his ideas flow most in the shower right after he gets up. He once wrote a whole week of strips in a single shower, so he keeps sticky notes nearby.'],
   ['The night shift','His wife, broadcaster and writer Jane Pauley, would rush to her computer on waking. Trudeau thinks the brain works overnight, linking bits of experience in unexpected ways.'],
   ['Pressure helps him','Trudeau calls adrenaline an accelerant: a deadline forces him to focus and stress-tests ideas on the spot. Writing strips out of order, he took good ideas as they came.'],
   ['Pressure hurts the author','The author dislikes it. For him, deadline adrenaline produces forced, less authentic ideas, ones that work sometimes but rarely rise above a B-plus.']],
   'Unjudged drifting is a rich source. Pressure works for some creators and not others; know which kind you are.');}},
{part:1,src:'Book I · Mind Wandering',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Theo writes best with a gig in two days; Amara freezes under deadlines. What does the chapter suggest?</h1>');
  L.mc(L.card,['Deadlines always kill creative ideas','Deadlines always sharpen creative ideas','Deadlines help some people and not others'],2,
   'Right. Trudeau finds deadlines an accelerant; the author finds they force second-rate ideas. Both are reporting their own experience.',
   'The chapter shows both sides: Trudeau thrives on deadlines, while the author finds they force ideas. Neither “always” holds.');}},
{part:1,src:'Book I · Mind Wandering',pts:5,run(L){
  L.h(L.kick('pr','Where did the idea come from?')+'<h1 class="q">Sort each Alder Commons idea the way the 2017 study would.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Mind wandering','Focused work'],[
   ['Amara, weeding the garden, suddenly sees how to waterproof the sensor case.',0,'Amara was doing something unrelated. Classic task-independent wandering.'],
   ['Theo, at the piano working on a verse, finds a better rhyme for the chorus.',1,'Theo was absorbed in the song itself. That’s directed effort.'],
   ['Jun, dozing on the bus, wakes up with a name for the ferry workshop.',0,'The drowsy edge of sleep, like Dalí’s spoon.'],
   ['Lena drafts the showcase schedule and spots a way to fit in two more kids.',1,'Lena was working the problem directly.'],
   ['Sol, paying for popcorn at the movies, thinks of a gear fix for the bike-powered popcorn maker.',0,'Like paying a bill in the study: an unrelated task, mind elsewhere.']],
   'Both piles are full of good ideas. The study’s surprise is how much the first pile holds when people aren’t even trying.');}},

/* ---------- PART 3: THE TWIST ---------- */
{part:2,src:'Book I · Mind Wandering',run(L){
  L.h(L.kick('learn','So it’s easy, right?')+'<h1 class="q">Our minds wander almost half the time</h1>'+
   L.prose('In 2010, two Harvard researchers texted 2,250 adults at random moments and asked what they were doing, whether their mind was wandering, and how they felt.')+
   L.flow([['cycle','47%','of the time, people’s minds were wandering','',2],['list','Any activity','What people were doing barely changed it; intimacy was the one clear exception','',3]],false)+
   L.prose('Wandering is natural. It lets us travel in time, rebuilding past events and imagining future ones, something we know of in no other animal. But the study found a twist.'));
  L.done();}},
{part:2,src:'Book I · Mind Wandering',pts:1,run(L){
  L.h(L.kick('try','Predict it')+'<h1 class="q">When people’s minds wandered to something <i>pleasant</i>, were they happier than when focused on what they were doing?</h1>');
  L.mc(L.card,['Yes, clearly happier','No happier than when on task','Much less happy'],1,
   'Right. A pleasant daydream didn’t make people any happier. And the other half of the time, wandering went to neutral or unpleasant places, and people felt worse.',
   'The surprise: pleasant wandering left people no happier than staying on task. And when it went to neutral or unpleasant topics, about half the time, they were unhappy.');}},
{part:2,src:'Book I · Mind Wandering',run(L){
  L.h(L.kick('learn','A wandering mind, an unhappy mind')+'<h1 class="q">Why people resist letting their minds roam</h1>'+
   L.tiers([['star','Wanders somewhere pleasant','About half the time. No happier than staying on task.','',false],
            ['alert','Wanders somewhere neutral or unpleasant','The other half. People report feeling unhappy.','',true,'The catch']])+
   L.prose('The researchers concluded that thinking about what isn’t happening is a real mental feat with an emotional cost. The author’s reading: people aren’t just wandering, they’re <b>worrying</b> and ruminating. So, out of fear, we put up barriers to letting the mind roam.'));
  L.done();}},
{part:2,src:'Book I · Mind Wandering',run(L){
  L.h(L.kick('ex','A study Schooler pointed to')+'<h1 class="q">Fifteen quiet minutes, or an electric shock?</h1>');
  L.beats(L.card,[
   ['The setup','In a 2014 study, people sat alone in a room for fifteen minutes with nothing but their thoughts, and a button that gave them a mild electric shock.'],
   ['Beforehand','Earlier in the study, they had said they’d rather pay money than be shocked.'],
   ['The result','Even so, <b>67% of men</b> and <b>25% of women</b> pressed the button rather than just sit quietly.'],
   ['The everyday version','Most of us avoid the quiet less painfully: we stream shows and trade messages, keeping a constant buzz just above the level where self-discovery happens.']],
   'Being alone with our thoughts is so uncomfortable that many people pick pain, or a screen, over it. That quiet is where creativity often starts.');}},
{part:2,src:'Book I · Mind Wandering',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Match the number to the finding',['20%','26%','47%','80%'],[
   ['How often people’s minds wandered in daily life (Harvard texts)',2,'Nearly half the time, whatever people were doing.'],
   ['Share of creators’ ideas that came from focused work',3,'Most ideas still came from directed effort.'],
   ['Share of all creators’ ideas that came while minds wandered',0,'About one idea in five.'],
   ['Share of impasse-breaking ideas that came while minds wandered',1,'Higher than for ideas overall: wandering helps most when you’re stuck.']]);}},

/* ---------- PART 4: WITHOUT JUDGMENT ---------- */
{part:3,src:'Book I · Mind Wandering',run(L){
  L.h(L.kick('learn','The creator’s skill')+'<h1 class="q">Wander without judging what shows up</h1>'+
   L.prose('Here is what it adds up to. People who become creative learn to let their minds wander <b>without judgment</b>. They let ideas rise from the back of the mind, and some become the seed of a creation or the answer to a problem.')+
   L.flow([['compass','Let it drift','No task, no screen'],['eye','Notice what comes','Without labeling it good or bad'],['pencil','Keep the seeds','Some become creations or answers']])+
   L.note('To do this, creators can’t treat each idea as a source of worry. In creativity, the author says, fear is not the creator’s friend, with one loophole that the next lesson explores.','info'));
  L.done();}},
{part:3,src:'Book I · Mind Wandering',pts:6,run(L){
  L.h(L.kick('pr','What’s really happening?')+'<h1 class="q">Sort each moment at Alder Commons.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Free wandering','Worry loop','Screen filler'],[
   ['Walking home, Theo’s mind drifts to the sound of rain on the ferry’s roof.',0,'A free flow that steers itself. Good material.'],
   ['Theo replays, again and again, what the scout might say about the new song.',1,'Stuck on one fear. That’s rumination, not wandering.'],
   ['Amara scrolls short videos through the whole lunch break.',2,'Constant stimulation keeps the quiet, and the ideas, away.'],
   ['Lena lies in bed picturing a classroom built inside a treehouse.',0,'Unfiltered bedtime imagining, like the author’s childhood stories.'],
   ['Jun keeps hearing the board’s laughter from the last Idea Night.',1,'That’s judgment on repeat, the worry the Harvard study caught.'],
   ['Sol watches videos for the whole bus ride to Young Makers.',2,'A screen fills every quiet minute before the mind can roam.']],
   'Only the first pile feeds creativity. Worry makes wandering unhappy, and screens stop it before it starts.');}},
{part:3,src:'Book I · Mind Wandering',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Tap each piece until the sentence sums up the research.</h1>');
  L.sentence(L.card,[['Almost no','About a fifth of','Most of'],['creators’ ideas','creators’ worries','creators’ deadlines'],['came while minds wandered,','came under heavy pressure,','came from sitting alone,'],['so creators need both wandering and focus.','so focused work can be dropped.','so screens can fill the quiet.']],[1,0,0,0],
   [['The study found a real share, about 20%, came from wandering.','Most, about 80%, came from focused work, not wandering.'],['The study tracked ideas, not worries.','The study tracked ideas, not deadlines.'],['The study measured what people were thinking about, not pressure.','The study tracked wandering during daily life, not sitting alone in a room.'],['About 80% still came from focused work, so dropping it would be a mistake.','Screens keep the mind from wandering; they don’t help it.']],
   'About one idea in five, and more of the impasse-breakers, came from wandering. The rest came from focus, so creators need both.');}},
{part:3,src:'Book I · Mind Wandering',pts:1,run(L){
  L.h(L.kick('pr','Apply it')+'<h1 class="q">Theo has fifteen minutes between closing the café and opening the music room. Which use of that time fits the chapter best?</h1>');
  L.mc(L.card,['Catch up on other musicians’ new videos','Force out one finished chorus before nine','Sit by the river with a notebook, no phone'],2,
   'Right. Unplugged, unjudged drifting gives the back of the mind a turn, and the notebook catches anything worth keeping.',
   'Videos fill the quiet before the mind can roam, and forcing a chorus brings back the judging. The chapter points to unplugged, unjudged time.');}},
{part:3,src:'Book I · Mind Wandering',pts:1,run(L){
  L.h(L.kick('pr','Apply it')+'<h1 class="q">Amara is stuck on how to power the flood sensors through a long spring storm. Which plan fits the research best?</h1>');
  L.mc(L.card,['Keep the design sessions, and add unplugged walks','Drop design sessions and wait for an aha moment','Set a hard deadline, since pressure works for all'],0,
   'Yes. Most ideas came from focused work, but wandering produced more than its share of impasse-breakers. Amara is stuck, so add the walks.',
   'Focused work still produced about 80% of ideas, so don’t drop it. And deadlines help some people, not everyone; Amara freezes under them. Add wandering on top.');}}
  ]
});
</script>
</body>
</html>
