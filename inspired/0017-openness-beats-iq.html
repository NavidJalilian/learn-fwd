<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Openness Beats IQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0017', title:'Openness beats IQ', minutes:20, icon:'compass',
  goals:['Explain why a high IQ, past a point, doesn’t make someone more creative','Spot the better clues to future creativity: early making and openness','Tell healthy openness and real confidence from their extremes'],
  parts:['Smart isn’t enough','Better clues','Openness','Confident doubt'],
  read:'Read “Personality” in Book III for Gregory Feist’s research, Rhiannon Giddens and her sister, and Mark Romanek’s Johnny Cash video in full.',
  glossary:{
    threshold:'Threshold theory: the finding that IQ helps creativity only up to a point (about 120). Above that, more IQ adds almost nothing.',
    'openness-intellect':'Openness/intellect: the research name for one personality trait with two sides. Openness leans toward feelings, senses and imagination; intellect leans toward abstract, logical ideas.',
    apophenia:'Apophenia: seeing links between things that aren’t really connected. The extreme end of openness.',
    neuroticism:'Neuroticism: a personality trait of feeling more anxiety and sadness, along with more emotional sensitivity.'
  },
  cheatsheet:[
    'IQ helps creativity only up to a point. Above about <b>115–120</b>, more IQ adds almost nothing: the <b>threshold theory</b>. For simply generating ideas, the bar may be even lower.',
    'Better clues than test scores: how bright the <b>people who know you</b> say you are, and how much you <b>already make</b> early on.',
    'An intelligent person <b>answers</b> a question. A creative person <b>comes up with</b> the question, then answers it.',
    'The trait most tied to creativity is <b>openness</b>: a need for variety, change and novelty.',
    '<b>Openness/intellect</b>: strong creators work in the overlap of feeling and logic. The extremes are a rigid test taker and <b>apophenia</b> (false links).',
    'Openness doesn’t mean dropping every inhibition. You still choose what to share.',
    'Real experiences with people and places stretch you more than screens. Creators enjoy <b>not understanding</b>.',
    'Creative <b>confidence</b>: secure enough to stay unsure, then secure enough to hold the line on an authentic idea.'
  ],
  steps:[
/* ---------- PART 1: SMART ISN’T ENOUGH ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">The Commons is rebuilding after the flood, and Ruth, the board chair, wants someone to dream up new projects. One volunteer has an IQ of 150. Another tested around 120. Who is likelier to come up with creative ones?</h1>');
  L.mc(L.card,['The volunteer with the IQ of 150','Their IQ scores alone can’t tell you'],1,
   'Good instinct. This lesson shows why, past a certain point, a higher IQ stops predicting creativity.',
   'Most people guess that, and the author did too. But research finds that above about 120, extra IQ adds almost nothing to creative achievement. This lesson explains why.');}},
{part:0,src:'Book III · Personality',run(L){
  L.h(L.kick('learn','Intelligence gets you only so far')+'<h1 class="q">Smart and creative aren’t the same thing</h1>'+
   L.prose('The author started his research assuming that smart people are more likely to be creative. He later admitted he wasn’t even sure what he meant by “smart.”')+
   L.prose('Intelligence, as usually measured, means solving problems quickly, reasoning about abstract ideas and handling lots of information. It is part of creativity, <b>up to a point</b>.')+
   L.flow([['trend','Below the bar','More IQ helps a bit','up to about 115–120',3],['layers','Above the bar','More IQ adds almost nothing','the link becomes “essentially zero”',2]])+
   L.prose('An award-winning 2003 paper co-written by psychologist Gregory Feist pulled together many studies and named this the '+L.g('threshold','threshold theory')+'. Its image: intelligence and creativity are less like twins and more like <b>cousins</b>.'));
  L.done();}},
{part:0,src:'Book III · Personality',run(L){
  L.h(L.kick('ex','The evidence')+'<h1 class="q">What the studies found</h1>');
  L.beats(L.card,[
   ['A giant life study','Starting in 1921, researchers followed about 1,500 students with very high IQs, averaging 147. Over decades, their IQ did <b>not</b> predict who achieved creatively.'],
   ['More studies agree','People with above-average IQs turn out to be no likelier to achieve creatively than people with average IQs.'],
   ['The bar','Above an IQ of about 115 to 120, the link between IQ and creative achievement essentially disappears.'],
   ['A 2013 refinement','Scholars in Austria found the bar for one part of creativity, <b>generating ideas</b>, is much lower: below 100. For overall creativity, the bar of about 120 still holds.'],
   ['The author’s reaction','He calls this encouraging news for people of average intelligence, and counts himself among them.']],
   'IQ opens the door, but it doesn’t carry anyone through it. Past the bar, something else decides who creates.');}},
{part:0,src:'Book III · Personality',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">By the threshold theory, what does an IQ of 150 add over an IQ of 125 when it comes to creative achievement?</h1>');
  L.mc(L.card,['A large and steady boost','Close to nothing at all','A small but real drop'],1,
   'Right. Both are above the bar of about 120, and above the bar the link is essentially zero.',
   'Both scores sit above the bar of about 120. Above it, the research finds the link to creativity becomes essentially zero: no boost and no drop.');}},
{part:0,src:'Book III · Personality',pts:1,
 solve:async L=>{L.$('#po').children[1].click();L.$('#go').click();await new Promise(r=>setTimeout(r,1400));},
 run(L){
  let p=null;const IQ=['80','100','120','140','160'],H=[30,62,88,89,89];
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">Picture creative achievement rising (or not) as IQ goes up. Which shape do you expect?</h1><div id="po"></div>'+
   '<div id="gr" hidden><div style="display:flex;align-items:flex-end;gap:8px;height:150px;margin:14px 0 4px;padding:0 4px;border-bottom:2px solid var(--line,#ccc)">'+
   IQ.map((q,j)=>'<div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%"><div id="b'+j+'" style="height:0;background:var(--ok-strong);border-radius:8px 8px 0 0;transition:height .25s"></div></div>').join('')+
   '</div><div style="display:flex;gap:8px;padding:0 4px">'+IQ.map(q=>'<div class="small" style="flex:1;text-align:center">'+q+'</div>').join('')+'</div>'+
   '<p class="small" style="text-align:center;margin-top:2px">IQ score · a simplified picture of the research, not real data</p>'+
   '<button class="btn pri" id="go" style="margin-top:10px">'+L.ic('play')+'Show the research</button></div>');
  ['Keeps climbing','Climbs, then flattens','No link at all'].forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=n;
    b.onclick=()=>{if(p!==null)return;p=j;b.classList.add('sel');L.$('#gr').hidden=false;};L.$('#po').appendChild(b);});
  L.$('#go').onclick=function(){this.remove();let j=0;
    const t=setInterval(()=>{const el=L.$('#b'+j);if(!el){clearInterval(t);return;}el.style.height=H[j]+'%';j++;
      if(j>=IQ.length){clearInterval(t);L.award(p===1);
        L.sheet(p===1?'ok':'no',p===1?'You called it!':'It climbs, then flattens',
         'IQ matters up to about 120, which is the '+L.g('threshold','threshold')+'. After that the bars barely move. For simply generating ideas, the 2013 Austrian study suggests the flat part starts even sooner, below 100.');L.done();}},220);};}},

/* ---------- PART 2: BETTER CLUES ---------- */
{part:1,src:'Book III · Personality',run(L){
  L.h(L.kick('learn','Better clues than a test score')+'<h1 class="q">So what does predict creative achievement?</h1>'+
   L.prose('The research points to two clues that beat a measured IQ:')+
   L.list([['eye','What people around you see','How bright the people who know someone say they are. The 2003 paper found this “observer-rated” intellect, measured at age 27, predicted better than test scores. Its advice: ask the people closest to a would-be creator.'],
     ['pencil','What you already make','Early creative output predicts later creative output. People who make and share original work young tend to keep making it.']],1)+
   L.prose('The author reads the second clue as a point about <b>doing</b>: action and plain perseverance. And about caring: how much does a person care about the <i>question</i>, not just the answer?'));
  L.done();}},
{part:1,src:'Book III · Personality',run(L){
  L.h(L.kick('ex','Early making, later making')+'<h1 class="q">Two findings about starting young</h1>');
  L.beats(L.card,[
   ['A science contest','For 57 years from 1942, the Westinghouse Science Talent Search rewarded students for <b>original</b> research papers and science presentations, not for test scores.'],
   ['What happened next','Students who did well went on to do unusually well in creative fields. Some won Nobel Prizes.'],
   ['A new name','The contest later passed to Intel, then to Regeneron, the drug company whose COVID-19 treatment made news in 2020.'],
   ['Young scientists','A related study found that young scientists who publish many papers early tend to stay more productive, and achieve more creatively, than less productive peers.']],
   'The best clue that someone will create is that they are already creating, and sticking with it.');}},
{part:1,src:'Book III · Personality',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Lena is choosing two Young Makers for a summer build crew once the wood shop is rebuilt. Which clue does this chapter say predicts creativity best?</h1>');
  L.mc(L.card,['The highest score on a school IQ test','The best report-card grades in the class','A long record of things they’ve already built'],2,
   'Right. Early creative output is one of the strongest predictors of later creative output.',
   'Test scores and grades measure intelligence, which stops predicting creativity past a point. A track record of making is the stronger clue.');}},
{part:1,src:'Book III · Personality',pts:6,run(L){
  L.h(L.kick('pr','Sort the clues')+'<h1 class="q">Lena gathers notes on the kids who want a spot on the build crew. Which are strong clues to creativity, and which are weak?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Strong clue','Weak clue'],[
   ['Sol has built eleven contraptions this year, most of them flops.',0,'Early, steady making is a strong predictor, flops included.'],
   ['Kenji scored 142 on an IQ test last year.',1,'Kenji is already past the threshold, where extra IQ adds almost nothing.'],
   ['A volunteer who has worked beside Mateo for two years calls them the sharpest kid in the shop.',0,'How bright the people closest to someone say they are predicted better than test scores.'],
   ['Dana wins every timed math quiz at school.',1,'Speedy problem solving is intelligence, which only helps up to a point.'],
   ['Priya keeps coming back to fix a solar oven that keeps failing.',0,'Doing and perseverance are exactly what early output signals.'],
   ['Kenji memorized the whole tool-safety manual in one night.',1,'An impressive memory is raw intellect, not a sign of making new things.']],
   'Lena should weigh what kids <b>do</b> and what the people around them see, not just what a test says.');}},
{part:1,src:'Book III · Personality',run(L){
  L.h(L.kick('learn','The question comes first')+'<h1 class="q">Answering a question vs asking one</h1>'+
   L.prose('This leads the author back to a line from the book’s opening, which he treats as the core difference:')+
   L.lanes([['check','An intelligent person','Answers a question someone else asked.',3],
            ['bulb','A creative person','Comes up with the question in the first place, then answers it.',2]])+
   L.prose('A few personality traits, working alongside intelligence, make people want to ask questions, chase answers and stay unsatisfied with one neat answer. The most important of them, the research says, is <b>openness</b>.'));
  L.done();}},
{part:1,src:'Book III · Personality',pts:6,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'At the Commons: answering a question, or coming up with one?',['Answering a given question','Coming up with a new one'],[
   ['Amara works out how long a sensor battery lasts in cold river water.',0,'A clear question with one right answer: classic intelligence work.'],
   ['Amara wonders why the same three streets always flood first.',1,'Nobody asked this. Spotting the question is the creative step.'],
   ['Lena grades the kids’ tool-safety quiz.',0,'Checking answers against a key is answering, not asking.'],
   ['Sol asks: what if sandbags could fill themselves?',1,'A brand-new question that opens a whole project.'],
   ['Jun prices out a patch for the ferry’s hull.',0,'Useful, but it answers a question that’s already set.'],
   ['Theo wonders what a song would sound like from the river’s side.',1,'Theo invents the question their next song will answer.']]);}},

/* ---------- PART 3: OPENNESS ---------- */
{part:2,src:'Book III · Personality',run(L){
  L.h(L.kick('learn','The trait that matters most')+'<h1 class="q">Openness: a need for variety, change and novelty</h1>'+
   L.prose('In a 2013 study, Feist and a co-author compared 145 scientists at major US research universities. They measured each scientist’s creative achievement (how much they produced and how much it mattered) against their personality traits.')+
   L.prose('The standout was '+L.g('openness','openness')+', which they described as a need for <b>variety, change and novelty</b>. Curious scientists with wide imaginations, open to new experiences, tended to be more creative than their more conventional, down-to-earth colleagues.')+
   L.note('Open people may also see failure differently. For some creators, exploring matters so much that they nearly stop worrying about the outcome, and they still achieve.','info')+
   '<p class="small" style="margin-top:10px">Feist later told the author that openness is the predictor of creativity in both art and science.</p>');
  L.done();}},
{part:2,src:'Book III · Personality',run(L){
  L.h(L.kick('learn','Openness/intellect')+'<h1 class="q">One trait, two sides</h1>'+
   L.prose('The research names a single trait '+L.g('openness-intellect','openness/intellect')+'. The author was confused at first: aren’t those two different things? They’re grouped because both describe how a person takes in information.')+
   L.lanes([['eye','Openness','Engages with art and the senses, both in what you notice and what you imagine. Leads with the heart, flexible, sees many right answers.',2],
            ['layers','Intellect','Engages with abstract and logical ideas. Leads with the head, more rigid, looks for the one precise answer.',3]])+
   L.prose('Prolific, effective creators tend to score high on <b>both</b> and blur the two, where most people lean hard to one side.'));
  L.done();}},
{part:2,src:'Book III · Personality',run(L){
  L.h(L.kick('ex','Two sisters')+'<h1 class="q">Openness with lines drawn</h1>');
  L.beats(L.card,[
   ['Openness has limits','Openness means considering and exploring ideas, experiences and feelings. It does <b>not</b> mean shedding all inhibitions or living without rules.'],
   ['Giddens chooses','Rhiannon Giddens told the author there’s a guarded part of herself. Some of what she lived through as a child still feels too scary to bring into her work, so she hasn’t. She has found her comfort zone.'],
   ['Her sister','Lalenja Harrington runs a program at the University of North Carolina at Greensboro that gives a college education to students with intellectual disabilities, people often written off by narrow standards like IQ.'],
   ['Her method','She offers many ways to engage with each student and rejects the idea of one standard way to share information. Open, willing to take risks, determined.'],
   ['The balance','Both sisters sit in the middle of the spectrum that researchers call “innovation/imagination”: open to the world, with the analytic skill to make sense of what they see.']],
   'Openness is a willingness to explore, balanced by the judgment to choose. Not a floodgate.');}},
{part:2,src:'Book III · Personality',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Theo worries: “If openness is the key, do I have to put everything into my songs, even the year the shipyard closed and things fell apart at home?”</h1>');
  L.mc(L.card,['No. Openness still lets you choose what to share','Yes. An open creator has to hold nothing back'],0,
   'Right. Openness means being willing to explore. Like Giddens, Theo can keep a guarded piece and still create.',
   'The chapter says openness doesn’t require shedding all inhibitions. Giddens keeps a guarded part of her childhood out of her work, and Theo can draw lines too.');}},
{part:2,src:'Book III · Personality',pts:1,
 solve:async L=>{const c=L.$('#sp').children;c[0].click();c[4].click();c[2].click();},
 run(L){
  const P=[['Far intellect','Amara can follow any circuit diagram, but sees only the textbook answer. The sensor never changes.','very smart, very rigid: a great test taker'],
    ['Leans intellect','Amara double-checks every spec. Once in a while a new idea slips through.','careful, a little narrow'],
    ['The overlap','Amara tries odd parts, like a fishing bobber and a fridge alarm, then tests which ones really work.','“innovation/imagination”'],
    ['Leans openness','Amara gets lost imagining a whole city of talking sensors. Little gets built.','fantasy and absorption'],
    ['Far openness','Amara is sure the river readings track the café’s busy days and the phases of the moon.','apophenia: links that aren’t there']];
  const seen=new Set();
  L.h(L.kick('pr','Slide along the spectrum')+'<h1 class="q">Move Amara along the openness/intellect spectrum and see how the flood-sensor work changes. Visit both ends.</h1>'+
   '<div class="small" style="display:flex;justify-content:space-between;margin-bottom:4px"><span>'+L.ic('layers')+'Intellect</span><span>Openness'+L.ic('eye')+'</span></div><div id="sp" style="display:flex;flex-wrap:wrap;gap:6px"></div>'+
   '<div style="background:var(--soft);border-radius:16px;padding:14px;margin:10px 0 6px;min-height:96px"><div class="small" id="sl" style="margin-bottom:6px">Pick a spot.</div><div id="so" class="prose" style="margin:0"></div></div><div id="sq"></div>');
  P.forEach((x,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=x[0];
    b.onclick=()=>{[...L.$('#sp').children].forEach(y=>y.classList.remove('sel'));b.classList.add('sel');seen.add(j);
      L.$('#sl').innerHTML='<b>'+x[0]+'</b> · '+x[2];L.$('#so').textContent=x[1];
      if(seen.has(0)&&seen.has(4)&&!L.$('#sq').innerHTML){const q=L.$('#sq');q.innerHTML='<h2 class="sub">Where do prolific creators tend to sit?</h2>';
        L.mc(q,['At the open end, with no filter','In the overlap of both sides','At the intellect end, careful'],1,
         'Right. Strong creators blur the two: open enough to try odd ideas, analytic enough to test them.',
         'Each end has a cost: rigid thinking at one, '+L.g('apophenia','apophenia')+' at the other. Prolific creators work in the overlap of both.');}};
    L.$('#sp').appendChild(b);});}},
{part:2,src:'Book III · Personality',run(L){
  L.h(L.kick('learn','A lower threshold for letting things in')+'<h1 class="q">Sensitivity can be a gift and a burden</h1>'+
   L.prose('Feist’s 2013 study also linked creativity to '+L.g('neuroticism','neuroticism')+': a tendency to feel more anxiety and sadness, and more emotional sensitivity. Its effect is smaller than openness, but still real.')+
   L.prose('Feist sees a link between the two traits. Both lower the threshold for letting information in, from the world outside or from inside yourself.')+
   L.note('Music-video director Mark Romanek takes in so much that it exhausts him; he compares his brain to a laptop fan revving. He told the author he has Asperger syndrome. When a planned studio shoot of Johnny Cash fell through near the end of Cash’s life, Romanek flew to Tennessee with a tiny crew and no plan, and drew a celebrated video from the surroundings.','eye'));
  L.done();}},
{part:2,src:'Book III · Personality',pts:1,run(L){
  L.h(L.kick('pr','What should Lena do?')+'<h1 class="q">In the noisy metal shop, Mateo gets overwhelmed by the noise and sometimes has to leave. Mateo also notices details no other kid does. Which response fits this chapter?</h1>');
  L.mc(L.card,['Keep Mateo away from making until they toughen up','See the sensitivity as a source of ideas, and help with overload','Tell Mateo to tune it all out and focus on rules'],1,
   'Right. Like Romanek, taking in a lot can exhaust a person and also feed their work. Lena can protect Mateo from overload without shutting that richness off.',
   'The chapter treats a low threshold for taking things in as both a burden and a source of rich material. Shutting it out, or Mateo out, wastes the second part.');}},

/* ---------- PART 4: CONFIDENT DOUBT ---------- */
{part:3,src:'Book III · Personality',run(L){
  L.h(L.kick('learn','Real experience beats a screen')+'<h1 class="q">Openness grows through people and places</h1>'+
   L.prose('The author asked Feist: would watching all kinds of shows on a streaming service count as being open to new experience? Feist’s answer: the obvious difference is <b>direct contact with people</b>. Real encounters, especially travel, force you to face your habits and assumptions.')+
   L.quote('It’s a willingness to be confused and not understand and not know.','Gregory Feist, in “Personality”')+
   L.prose('Highly creative people, he said, jump into the unknown. They take <b>pleasure</b> in not understanding instead of pulling back from it.'));
  L.done();}},
{part:3,src:'Book III · Personality',run(L){
  L.h(L.kick('learn','The right kind of confidence')+'<h1 class="q">Confident enough to be unsure</h1>'+
   L.prose('The last piece of the creative personality is <b>confidence</b>. Researchers don’t mean being sure of everything you know. They mean two things that sound like opposites:')+
   L.flow([['compass','Stay unsure','Take in new information without feeling threatened','',2],['scale','Settle','Choose an answer true to your own approach','',3],['shield','Hold the line','Stick with it through pushback and criticism','',1]])+
   L.prose('The author calls it a razor’s edge. His summary of the whole chapter: creativity depends less on raw intellect, which may not be learnable, and more on <b>some</b> intellect plus a lot of openness, or curiosity.'));
  L.done();}},
{part:3,src:'Book III · Personality',run(L){
  L.h(L.kick('ex','At the Commons')+'<h1 class="q">Jun walks the razor’s edge with the ferry</h1>');
  L.beats(L.card,[
   ['Go see','Instead of reading about other river towns online, Jun spends a weekend visiting two of them and talking to people on their docks.'],
   ['Get confused','Jun comes back unsure. One town wanted repairs; the other mostly wanted help getting ready for floods. Jun lets the confusion sit instead of forcing an answer.'],
   ['Settle','Jun redraws the plan: a floating repair workshop that also carries flood gear from town to town. It still feels like Jun’s idea.'],
   ['Hold the line','Board members call it a distraction during the rebuild. Jun listens, fixes two weak spots in the budget, and keeps the floating workshop at the heart of the pitch.']],
   'Open to new information, then confident enough to stand behind an authentic idea. Neither stubborn nor a pushover.');}},
{part:3,src:'Book III · Personality',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">What kind of confidence does this chapter link to creativity?</h1>');
  L.mc(L.card,['Being sure you know the right answers','Never changing a plan once it’s made','Being secure enough to stay unsure, then commit'],2,
   'Right. Open to uncertainty first, then firm enough to stick with an authentic answer.',
   'Being sure of everything shuts out new information, and never changing a plan isn’t openness. Creative confidence welcomes doubt, then commits.');}},
{part:3,src:'Book III · Personality',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Tap each piece until the sentence describes a creator, as this chapter sees one.</h1>');
  L.sentence(L.card,[['A creator answers the question fastest,','A creator comes up with the question,'],['stays certain from the start,','stays willing to be confused,'],['then drops the idea at the first pushback.','then holds the line on an authentic idea.','then proves the idea with test scores.']],[1,1,1],
   [['Answering quickly is intelligence. The creator first finds the question.'],['Certainty shuts out new information. Creators enjoy not knowing for a while.'],['Dropping an idea at the first criticism is the opposite of creative confidence.','Test scores stop predicting creativity past about 120.']],
   'Ask the question, welcome the confusion, then stand behind the idea.');
}},
{part:3,src:'Book III · Personality',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Mixed review: which idea from the chapter does each moment show?',['IQ threshold','Early making','Openness','Too much openness','Confidence'],[
   ['Ruth beams: “Our new volunteer has an IQ of 155. Our idea problem is solved!”',0,'Above about 120, extra IQ adds almost nothing to creativity.'],
   ['Sol has kept building contraptions all year, flops included.',1,'Early, steady output is one of the best clues to later creativity.'],
   ['Amara swaps ideas with a beekeeper and a sailmaker, just to see what comes of it.',2,'A need for variety and novelty is openness.'],
   ['A member insists the river level predicts the café’s pie sales and builds a theory on it.',3,'Seeing links that aren’t there is apophenia, openness at its extreme.'],
   ['Theo hears the scout’s doubts, rewrites a verse, and keeps the song’s strange ending anyway.',4,'Open to feedback, then holding the line on what feels authentic.']]);}}
  ]
});
</script>
</body>
</html>
