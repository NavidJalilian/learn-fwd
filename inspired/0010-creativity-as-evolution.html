<title>Creativity as Evolution</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">

<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0010', title:'Creativity as evolution', minutes:20, icon:'leaf',
  goals:['Explain creating as evolution does it: lots of random variation, then selection','Aim new work at the edge of chaos: a little different, not too different','Separate what a creator controls (the creation) from what they don’t (timing and niche)'],
  parts:['Nature creates','Many tries','Edge of chaos','Luck and niche'],
  read:'Read “View from a Microbe” and “Parable of a Rock Star” at the start of Book II for Andreas Wagner’s lab, Fleming’s mold and Bono’s subwoofer story in full.',
  glossary:{
    mutation:'Mutation: a copying mistake when a living thing reproduces. Most mutations hurt or do nothing; once in a while one gives a new power.',
    'neutral-mutation':'Neutral mutation: a change that seems to have no effect when it happens, but can later make another change possible.',
    divergent:'Divergent thinking: going off the expected path. The answer may not look like the straight line between two points, so it can be labeled “wrong.”',
    convergent:'Convergent thinking: giving the expected, “correct” answer. Safe while nothing changes.'
  },
  cheatsheet:[
    'Andreas Wagner’s flasks: random copying errors (<b>mutations</b>) mostly kill bacteria, but a few let them beat antibiotics. Evolution is creative problem solving.',
    'Dawkins: an engineer’s <b>wastebasket</b> of drafts works like mutation and selection. Ideas pop up at random; then we test and tweak. Simonton calls creativity “essentially Darwinian.”',
    'What marks creators is not the quality of first ideas but the <b>quantity</b> of tries (songbirds, Beethoven’s notebooks).',
    'The <b>edge of chaos</b>: a little different, but not too different. Novel yet still tied to what works.',
    'Convergent thinking is safe until the world changes; then <b>divergent</b> thinking is what survives.',
    '<b>Neutral mutations</b> are hidden building blocks: a vacuum before a filament, small batteries before the pacemaker.',
    'Big C’s often need <b>luck and timing</b>. Fleming’s gift was recognizing an accident others would bin.',
    'Success depends on the fit between creation and environment, the <b>niche</b>. You control the creation, not the moment (Bono and the subwoofer).'
  ],
  steps:[
/* ---------- PART 1: NATURE CREATES ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Amara Diallo prints 20 different cases for the flood sensor. In a bucket test, 17 leak. Was printing all 20 a waste?</h1>');
  L.mc(L.card,['No, the three that held are the point','Yes, Amara should have planned one case'],0,
   'Most tries failing is normal, and the few that survive are the payoff. This lesson shows nature works the same way.',
   'Nobody can plan a perfect case up front. Most tries failing is normal, and the three that held are the payoff. Nature works the same way, as you’ll see.');}},
{part:0,src:'Book II · View from a Microbe',run(L){
  L.h(L.kick('learn','Evolution in a flask')+'<h1 class="q">Watching microbes create</h1>'+
   L.prose('Book II looks at creativity through other fields, starting with biology. At the University of Zurich, evolutionary biologist Andreas Wagner runs what he calls experimental evolution.')+
   L.flow([['flask','Feed','Bacteria eat sugar and multiply about every 20 minutes','',2],['alert','Attack','Researchers add antibiotics; most bacteria die fast','',4],['star','Survive','A few carry a copying error that beats the drug','',1]])+
   L.prose('Those copying errors are '+L.g('mutation','mutations')+'. They’re accidents, and they usually end badly. But once in a while, one gives a cell a new power. Wagner calls this a form of creativity.'));
  L.done();}},
{part:0,src:'Book II · View from a Microbe',run(L){
  L.h(L.kick('ex','Inside the flask')+'<h1 class="q">Two lucky mistakes that save a cell</h1>');
  L.beats(L.card,[
   ['Mistake 1: the pump','Cells have a pump that moves material in and out. A mutation can make it hyperactive. Now, as the antibiotic enters, the pump throws it right back out.'],
   ['Mistake 2: the cutter','Cells have enzymes that cut up other molecules, say for energy. A mutation can make one cut up penicillin instead, destroying the drug.'],
   ['Neither was planned','The genes weren’t doing these jobs when they went into the flask. Random change happened to fit a brand-new threat.'],
   ['Wagner’s view','He uses a common definition of a creative product: an original and appropriate solution to a problem. Every new ability in life’s history, like flight or eyes, was one.'],
   ['The balance','Survivors walk a line: stable enough for today’s conditions, flexible enough for new threats. The author says human creativity is the same balancing act.']],
   'Evolution is a long history of problem solving by random change plus survival of what works.');}},
{part:0,src:'Book II · View from a Microbe',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">In Wagner’s flasks, where do the bacteria’s winning defenses come from?</h1>');
  L.mc(L.card,['Cells sense the drug and redesign themselves','Random copying errors that happen to fit'],1,
   'Right. The mutations aren’t aimed at the drug. Most fail, and the few that happen to work survive.',
   'Bacteria can’t aim at anything. Copying errors happen at random, most fail, and the few that happen to beat the drug survive.');}},
/* ---------- PART 2: MANY TRIES ---------- */
{part:1,src:'Book II · View from a Microbe',run(L){
  L.h(L.kick('learn','The engineer’s wastebasket')+'<h1 class="q">Your ideas work the same way</h1>'+
   L.prose('Biologist Richard Dawkins described to the author an engineer designing a flying machine. “I have an idea!” Quick, write it down before rejecting it. Then another. The wastebasket fills with drawings.')+
   L.flow([['bulb','Vary','Ideas pop up, not aimed at improvement','',1],['x','Discard','Most land in the wastebasket','',4],['cycle','Test and tweak','Prototype, wind tunnel, crash, fix','',2]])+
   L.prose('Dawkins thinks a new idea pops into the mind partly at random, much like a mutation. Humans add one thing bacteria can’t: we can <b>run a simulation in our heads</b> before we build. Researcher Dean Simonton has written that the creative process is “essentially Darwinian.”'));
  L.done();}},
{part:1,src:'Book II · View from a Microbe',run(L){
  L.h(L.kick('ex','Birds and Beethoven')+'<h1 class="q">Even great melodies start dull</h1>');
  L.beats(L.card,[
   ['The bird','Young male sparrows copy their fathers’ songs. Some then warble and burble at random, and when a phrase sounds good, they repeat it.'],
   ['The composer','Beethoven took long walks and jotted good musical phrases in notebooks. Dawkins notes the notebooks show melodies that start rather dull and get worked into shape.'],
   ['The link','Same process: try, err, drop some, build on others. For birds, the songs also help win mates, so the creative urge is tied to survival.'],
   ['The lesson','Creativity doesn’t have to start with a burst of genius. A creator’s basic trait is the quantity of variation, not how good the first try is.']],
   'Lots of rough tries, kept or dropped by testing, is how both nature and great composers create.');}},
{part:1,src:'Book II · View from a Microbe',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">According to Dawkins, how does a new idea first show up in the mind?</h1>');
  L.mc(L.card,['Partly at random, like a mutation','Already aimed at the best answer'],0,
   'Right. Ideas pop up without aiming at improvement. Testing and tweaking come after.',
   'Dawkins thinks ideas first pop up partly at random, not aimed at improvement, much like mutations. Selection comes afterward.');}},
{part:1,src:'Book II · View from a Microbe',pts:1,
 solve:async L=>{L.$('#pk').children[1].click();L.$('#run').click();},
 run(L){
  let p=null;
  const A=[3,5,4],B=[2,6,3,7,5,4,9,3,6,2,5,8,4,6,3,7,5,2,6,4];
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">Theo has a week to find a song the scout likes. Plan A: write 3 careful drafts. Plan B: jot 20 rough ideas and throw most away. A song only “survives” if it scores 8 or more. Which plan finds one?</h1><div id="pk"></div>'+
   '<div id="sim" hidden><button class="btn pri" id="run" style="margin:8px 0">'+L.ic('play')+'Run the week</button>'+
   '<h2 class="sub">Plan A · 3 drafts</h2><div id="ga" style="display:flex;flex-wrap:wrap;gap:6px"></div>'+
   '<h2 class="sub">Plan B · 20 rough ideas</h2><div id="gb" style="display:flex;flex-wrap:wrap;gap:6px"></div></div>');
  ['Plan A','Plan B','Neither'].forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=n;b.onclick=()=>{if(p!==null)return;p=j;b.classList.add('sel');L.$('#sim').hidden=false;};L.$('#pk').appendChild(b);});
  const chip=v=>'<span class="chip static'+(v>=8?' ok':'')+'" style="'+(v>=8?'':'opacity:.4')+'">'+v+'</span>';
  L.$('#run').onclick=function(){this.remove();let i=0;
    const t=setInterval(()=>{const ga=L.$('#ga'),gb=L.$('#gb');if(!ga){clearInterval(t);return;}
      if(i<A.length)ga.innerHTML+=chip(A[i]);gb.innerHTML+=chip(B[i]);i++;
      if(i>=B.length){clearInterval(t);L.award(p===1);
        L.sheet(p===1?'ok':'no',p===1?'You called it!':'Plan B found the keepers','Plan A’s careful drafts all landed in the middle. Plan B threw away 18 ideas, and that’s how it found two that scored 8 and 9. The book says what marks creators isn’t the quality of first ideas but the sheer <b>quantity</b> of variation. (The scores are made up, but the pattern matches the book’s point.)');L.done();}},90);};}},

{part:1,src:'Book II · View from a Microbe',pts:5,run(L){
  L.h(L.kick('pr','Variation or selection?')+'<h1 class="q">Each move is part of the evolution-style process. Is it making variety, or picking among it?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Making variation','Selecting what works'],[
   ['Theo hums every hook into a phone memo before deciding if it’s any good.',0,'Capture first, judge later, like Dawkins’s engineer writing the idea down fast.'],
   ['Amara drops sensor cases into a bucket of water to see which leak.',1,'A bucket test is selection: the environment kills the weak designs.'],
   ['Young Makers sketch ten raft shapes in ten minutes, no erasing.',0,'Quantity first. That’s making variety.'],
   ['Theo plays three new songs at Idea Night and keeps the one people hum on the way out.',1,'The crowd is the test. Theo keeps what survives.'],
   ['Amara swaps designs with makers in other towns and tries their odd twists.',0,'Borrowed twists add more variety to test.']],
   'Creating needs both: lots of variation, then a test that keeps the few that work. Skipping the first step leaves nothing to select.');}},

/* ---------- PART 3: EDGE OF CHAOS ---------- */
{part:2,src:'Book II · View from a Microbe',run(L){
  L.h(L.kick('learn','The edge of chaos')+'<h1 class="q">A little different, but not too different</h1>'+
   L.prose('UCLA psychologist Robert Bilder studies zebra finches. A young male copies older birds’ songs, then adds novelty. Why do females like that? Bilder thinks a fresh song helps a male stand out and announce he’s there.')+
   L.tiers([['layers','Too ordered','An exact copy. Nobody notices.','Pure order'],
            ['star','The edge of chaos','Clearly new, but still tied to the familiar. Novel and useful at once.','Where creativity lives',true,'Sweet spot'],
            ['alert','Too chaotic','So different it sounds weird or off-key.','Pure chaos']])+
   L.prose('Bilder calls this the '+L.g('edge-of-chaos','edge of chaos')+': as new as possible while still connected to order. That mix of novelty and usefulness is the hallmark of creativity.'));
  L.done();}},
{part:2,src:'Book II · View from a Microbe',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Which new song sits at the edge of chaos?</h1>');
  L.mc(L.card,['A note-for-note copy of a familiar tune','Random notes with no beat or key at all','A familiar style with one surprising new turn'],2,
   'Right. It’s new enough to stand out and close enough to the familiar to make sense.',
   'A copy has no novelty, and random notes lose the tie to order. The edge of chaos is a familiar style with a surprising new turn.');}},
{part:2,src:'Book II · View from a Microbe',run(L){
  L.h(L.kick('learn','Safe answers and survival')+'<h1 class="q">The “correct” answer is safe, until the world changes</h1>'+
   L.lanes([['check','Convergent','Giving the expected, correct answer. For a cell, the pump does its normal job and wastes nothing.',3],
            ['compass','Divergent','Going off the expected path. Risky and costly, since a hyperactive pump wastes energy. Until the antibiotic arrives: then it means life.',2]])+
   L.prose('That’s the analogy behind '+L.g('convergent','convergent')+' and '+L.g('divergent','divergent')+' thinking. And there’s a middle ground: <b>neutral mutations</b>.')+
   L.prose('A '+L.g('neutral-mutation','neutral mutation')+' seems to do nothing at first. Later, a second change works <i>only because</i> of the first. Wagner points to Edison’s light bulb: you need a vacuum before a filament is any use. Or the pacemaker, which waited on tiny batteries and parts.'));
  L.done();}},
{part:2,src:'Book II · View from a Microbe',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Where does it land?',['Too ordered','Edge of chaos','Too chaotic'],[
   ['Theo releases a cover that copies the original exactly.',0,'No novelty at all. Pure order.'],
   ['Theo sets an old river work song to their own modern beat.',1,'New, but tied to something familiar. The sweet spot.'],
   ['Jun proposes a submarine that tours the river towns.',2,'So far from anything the members know, it loses the tie to what works.'],
   ['Jun proposes the old ferry, refitted as a floating repair shop.',1,'A familiar boat and a familiar trade, put together in a new way.']]);}},
{part:2,src:'Book II · View from a Microbe',pts:1,run(L){
  L.h(L.kick('pr','Spot the hidden building block')+'<h1 class="q">Last year Amara tinkered with a tiny solar charger “for fun.” It seemed pointless. This year it lets the flood sensors run off-grid through long spring storms. What was the charger?</h1><div id="nq"></div>');
  L.mc(L.$('#nq'),['A neutral mutation the sensor built on','Wasted time that luckily paid off','A copy of a better design'],0,
   'Like the vacuum before the filament, it had no payoff alone. It made the next change possible.',
   'It wasn’t wasted or copied. Like the vacuum before Edison’s filament, it looked useless alone but made the later change possible: a neutral mutation.');}},

/* ---------- PART 4: LUCK AND NICHE ---------- */
{part:3,src:'Book II · View from a Microbe',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">The mold that most people would have thrown away</h1>');
  L.beats(L.card,[
   ['Before','Alexander Fleming served as a doctor in World War I and watched soldiers die of infection. Afterward he studied the bacteria that killed them.'],
   ['The accident','One day he found a sample left uncovered under a window, overrun by mold. A failed experiment, headed for the bin.'],
   ['The recognition','Fleming didn’t toss it. He saw that the mold was killing the bacteria. It was penicillin.'],
   ['The slow start','The discovery was at first downplayed. It took about eleven years to reach mass production in World War II. A Nobel Prize came later.'],
   ['Two lessons','First, he created the conditions for accidents by playing in the space. Second, and bigger, he <b>recognized</b> the accident for what it could be.']],
   'Wagner’s caveat: a '+L.g('big-c','Big C')+' is possible, but often depends on luck and timing beyond the creator’s control.');}},
{part:3,src:'Book II · View from a Microbe',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">What does the book call the biggest lesson of Fleming’s discovery?</h1>');
  L.mc(L.card,['Plan every experiment to avoid accidents','Accidents matter only if someone sees them'],1,
   'Right. Accidents happen all the time. They become inventions only when someone recognizes them.',
   'Fleming’s breakthrough came from an unplanned accident. The lesson is to be able to recognize one when it happens.');}},
{part:3,src:'Book II · View from a Microbe',run(L){
  L.h(L.kick('learn','The environment decides')+'<h1 class="q">The same mutation can be useless or a winner</h1>'+
   L.prose('The book ends the microbe chapter with a twist. Antibiotics saved millions, but we’ve overused them. A mutated microbe that resists antibiotics would have died off in a world without the drugs, with no advantage. In a world soaked in them, it’s the only one that thrives.')+
   L.flow([['flask','Same mutation','Resists antibiotics','',3],['x','No antibiotics','No advantage, dies off','',4],['star','Antibiotics everywhere','Becomes the winner','',2]])+
   L.prose('So a creation’s success depends not only on how novel or valuable it is, but on the environment it lands in: its '+L.g('niche','niche')+'. A creator controls only part of that fit, just as a microbe makes the mutation but not the time and place.'));
  L.done();}},
{part:3,src:'Book II · Parable of a Rock Star',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">Bono’s theory of the subwoofer</h1>');
  L.beats(L.card,[
   ['The meeting','In 2001, the morning after U2 won a GRAMMY for “Beautiful Day,” Bono and the Edge met investor Roger McNamee, who congratulated them.'],
   ['The surprise','Bono brushed it off. Pop stars think the world revolves around them, he said, and that’s nonsense. Music’s popularity, he said, is based on hardware.'],
   ['The history','Hi-fi belonged to the Beatles. LPs and stereo, to Pink Floyd. The car stereo and whole albums, to U2. Then came the subwoofer, which put the beat ahead of melody. Hip-hop artists saw it; U2 missed it and had a dry spell.'],
   ['The comeback','“Beautiful Day” was U2 meeting the technology where it was: still their own sound, borrowing what people liked. At least, Bono said, they weren’t killed off.'],
   ['The investor’s view','McNamee credits his own success to timing too, starting his career on the first day of a bull market. He told the author he can’t overstate the role of dumb luck.']],
   'Like a microbe meeting a new drug, U2 adapted to a changed environment. Talent mattered, but so did the fit with the moment.');}},
{part:3,src:'Book II · Parable of a Rock Star',pts:5,run(L){
  L.h(L.kick('pr','What can Theo control?')+'<h1 class="q">Theo wants their songs to land. Sort each factor.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Theo controls it','Part of the niche'],[
   ['How many song drafts Theo writes each week',0,'Variation is in Theo’s hands.'],
   ['Whether listeners now discover songs mostly as short phone clips',1,'That’s the hardware of the moment, like Bono’s subwoofer. Theo can adapt but can’t choose it.'],
   ['Whether Theo adapts the songs to play well on phone speakers',0,'Meeting the technology where it is was U2’s move. That part is Theo’s choice.'],
   ['Whether the scout’s label is hiring this year',1,'Timing at the label is outside Theo’s control.'],
   ['Whether Theo notices when a “mistake” in a take sounds great',0,'Recognizing a lucky accident, like Fleming, is a skill Theo controls.']],
   'You control the creation and how you respond to the moment. The moment itself, the niche, is only partly yours.');}},
{part:3,src:'Book II · Parable of a Rock Star',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Amara’s sensor flopped at last year’s regional fair. This year, after a wet winter, towns are suddenly asking for flood warnings. Tap each piece until the sentence explains the change.</h1>');
  L.sentence(L.card,[['The sensor','The timing'],['got much better,','barely changed,'],['but the niche','and the price'],['finally fit it','fell sharply']],[0,1,0,0],
   [['Start with the creation itself: what happened to the sensor?'],['Nothing in the story says the design improved.'],['Nothing in the story says the price changed.'],['The story is about demand, not cost.']],
   'Same creation, new environment. Like the resistant microbe, the fit with the moment, not just the idea, decided its success.');}},
{part:3,src:'Book II · Parable of a Rock Star',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Mixed review',['Make more variation','Aim for the edge of chaos','Watch the niche'],[
   ['Theo has one song and has polished it for a year.',0,'One draft gives selection nothing to choose from. Write many rough ones.'],
   ['Lena’s Young Makers propose a showcase so odd that parents can’t tell what anything is.',1,'Pull it back toward the familiar: a little different, not too different.'],
   ['The board votes down Jun’s ferry; two years later, river tourism booms and the towns fill with boaters.',2,'The environment changed. The same idea may now fit its moment.'],
   ['Amara builds only the one sensor design the manual recommends.',0,'Try many versions and let a bucket test pick, like the engineer’s wastebasket.'],
   ['Theo’s folk songs got no plays, until a hit TV show makes old-time music popular again.',2,'Same songs, new environment. Like U2 and the subwoofer, the fit with the moment counts.']]);}}
  ]
});
</script>

</html>
