<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creating Through Chaos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0022', title:'Creating through chaos', minutes:20, icon:'compass',
  goals:['Explain the “two steps forward” math: every big creation brings side effects we answer by creating again','Use the book’s two truisms to respond to side effects with boundaries, not bans','Trust your own inspiration first, ahead of outcome, the way Yo-Yo Ma does'],
  parts:['Two steps forward','Boundaries','New Jerusalem','Inspired'],
  read:'Read Book V, “Creativity in the Time of Chaos,” for the full stories of Katalin Karikó, Taylor Swift’s quarantine album and Yo-Yo Ma’s Bach.',
  glossary:{
    'two-steps':'Two steps forward, one and seven-eighths back: the author’s “math of creativity.” We leap ahead with new creations, then lose nearly as much to their unintended side effects, then create again in response.',
    'decision-fatigue':'Decision fatigue: being worn out by too many choices. The book links it to the flood of new information, products and ideas.',
    'new-jerusalem':'The new Jerusalem: the author’s phrase for today’s spread-out creative hubs. Home offices, cafés and small gatherings linked by technology now play the role crowded ancient cities once did.'
  },
  cheatsheet:[
    'The internet was born of <b>fear</b> (survive an attack) and <b>hope</b> (more voices). It delivered both, plus noise, rumor and doubt about truth itself.',
    'The math of creativity: <b>two steps forward, one and seven-eighths back</b>. Slow, but still forward, because we keep creating in response.',
    'Two truisms: creativity is <b>inevitable</b> (it’s in us), and it has <b>unintended consequences</b>, so we need awareness and boundaries.',
    'Only history can judge a creation for sure. But it’s not the <i>best</i> judge: everyday creations are the <b>seed corn</b> of the big ones.',
    'Katalin Karikó: ignored, rejected and demoted, she kept going; her mRNA work became the base of COVID-19 vaccines.',
    '<b>The home office is the new Jerusalem.</b> Creative hubs are now everywhere technology connects people.',
    'The book’s most important point: creativity is first about <b>personal inspiration</b>, not outcome. It’s terrifying, and the greats leap anyway.',
    'Yo-Yo Ma’s process: feel lost, <b>collect</b> until solid, <b>look over the edge</b>, then <b>leap</b>, with faith in the inspiration.'
  ],
  steps:[
/* ---------- PART 1: TWO STEPS FORWARD ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Amara’s flood sensors now text every riverside home when the water rises. Could such a helpful creation cause new problems?</h1>');
  L.mc(L.card,['Yes, even helpful creations bring side effects','No, a warning system can only help people'],0,
   'Even the best creations carry surprises. This last lesson is about living with that, and creating anyway.',
   'Think of a car alarm that goes off every night: soon nobody listens. Even helpful creations bring side effects. This lesson is about that.');}},
{part:0,src:'Book V · Two Steps Forward',run(L){
  L.h(L.kick('learn','A creation born of fear and hope')+'<h1 class="q">Why the internet was built to have no center</h1>'+
   L.prose('People sometimes miss the days of Walter Cronkite, the TV anchor once voted the most trusted man in America. One clear source, one clear story.')+
   L.flow([['shield','Fear','Spread information across many hubs, so no single attack could take it all down.','',4],['people','Hope','Let more people have a voice, without needing a news job or a book deal.','',2]],false)+
   L.prose('The early builders of the internet decentralized it for both reasons. And the author notes Cronkite’s calm world wasn’t perfect: beneath that simple order, many people were denied full rights and a voice.'));
  L.done();}},
{part:0,src:'Book V · Two Steps Forward',run(L){
  L.h(L.kick('ex','What the creation brought')+'<h1 class="q">More voices. Many more.</h1>');
  L.beats(L.card,[
   ['The flood','One study found that 90 percent of all the information ever created appeared between 2016 and 2018. In 2020, millions of posts went up every minute.'],
   ['The good','Ideas crossed borders. People built products that changed the world, and that challenged it too.'],
   ['The cost','The very idea of truth came into question. Wild, baseless conspiracy theories spread, and many people believed them.'],
   ['The fatigue','A new term caught on: '+L.g('decision-fatigue','decision fatigue')+'. Too much information, too many products, too many directions to choose from.'],
   ['The pattern','Phones connected everyone and also hooked us with addictive bursts of information. The same tools united and divided us at once.']],
   'The author doesn’t call this a failure. Seen through the lens of creativity, 2020 was almost predictable.');}},
{part:0,src:'Book V · Two Steps Forward',run(L){
  L.h(L.kick('learn','The math of creativity')+'<h1 class="q">Two steps forward, one and seven-eighths back</h1>'+
   L.prose('Few powerful creations, the author writes, come without side effects nearly as strong as the good they do:')+
   L.list([['leaf','Fire','Brought us out of darkness, and burns villages and forests.'],['flask','Antibiotics','Saved lives, and gave rise to drug-resistant infections.'],['arrow','Cars','Moved the world, and made driving the riskiest thing most of us do.']],3)+
   L.prose('Then we create in response: laws, customs, technologies, businesses. Small creations add up until someone makes a big one that brings light back. The author calls this '+L.g('two-steps','two steps forward, one and seven-eighths back')+'. He admits the fraction is arbitrary. The point is: big leap, big side effects, then we create again.'));
  L.done();}},
{part:0,src:'Book V · Two Steps Forward',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">What does “two steps forward, one and seven-eighths back” tell us?</h1>');
  L.mc(L.card,['Most new creations end up doing more harm than good','Progress is slow, since side effects eat most gains, but it keeps going','Creating should pause until side effects can be predicted'],1,
   'We lose nearly as much as we gain, yet each round still nets a little progress, because we keep creating in response.',
   'The math still nets a small step forward each round. Side effects eat most of the gain, and we answer them by creating again, not by stopping.');}},
{part:0,src:'Book V · Two Steps Forward',pts:1,
 solve:async L=>{L.$('#pr').children[1].click();L.$('#go8').click();},
 run(L){
  let p=null;const O=['Back where it started','About one step ahead','Sixteen steps ahead'];
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">Each new creation moves the Commons two steps forward, then its side effects push it one and seven-eighths back. After eight creations, where is it?</h1><div id="pr"></div>'+
   '<div id="sim" hidden><div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px"><div><div class="small">Creations so far</div><div class="week" id="cn">0</div></div><button class="btn pri" id="go8">'+L.ic('play')+'Run 8 creations</button></div>'+
   '<div class="meterrow"><div class="lb">Net progress</div><div class="meter"><div id="np" style="width:0;background:var(--ok-strong)"></div></div></div><div class="small" id="nt">0 steps</div></div>');
  O.forEach((o,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=o;b.onclick=()=>{if(p!==null)return;p=j;b.classList.add('sel');L.$('#sim').hidden=false;};L.$('#pr').appendChild(b);});
  L.$('#go8').onclick=function(){this.remove();let n=0;
    const t=setInterval(()=>{n++;const c=L.$('#cn');if(!c){clearInterval(t);return;}c.textContent=n;L.$('#np').style.width=(n/8*100)+'%';L.$('#nt').textContent='+2 then −1⅞ → '+(n/8).toFixed(3).replace(/0+$/,'').replace(/\.$/,'')+' step'+(n===8?'':'s')+' ahead';
      if(n>=8){clearInterval(t);L.award(p===1);
        L.sheet(p===1?'ok':'no',p===1?'Right: one step ahead':'One step ahead','Each round nets just one-eighth of a step, so eight creations make one full step. Slow, messy, but forward. That’s the author’s point: we don’t stop creating because of side effects; we keep answering them.');L.done();}},250);};}},
{part:0,src:'Book V · Two Steps Forward',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Step forward or step back?',['Step forward','Step back'],[
   ['The members’ group chat organizes sandbag crews within an hour.',0,'Fast connection is the leap forward the tool brings.'],
   ['A false rumor that the levee is breaking races through the same group chat.',1,'The same tool that connects also spreads noise. That’s the side effect.'],
   ['After three false alarms, some neighbors start ignoring the sensor texts.',1,'Too many alerts wear people out, a small cousin of decision fatigue.'],
   ['Online Young Makers reached kids stuck at home during the flood.',0,'Technology let the program keep going. A step forward.'],
   ['Kids now expect every class on a screen and skip the hands-on shop.',1,'A side effect of the online fix, calling for a new response.']]);}},

/* ---------- PART 2: BOUNDARIES ---------- */
{part:1,src:'Book V · Two Steps Forward',run(L){
  L.h(L.kick('learn','Two truisms')+'<h1 class="q">Are we helpless in the face of creativity? No.</h1>'+
   L.prose('Creativity forces change on us, again and again, and change feels like the vomit and poison of the doubt research. Only history can say how well a creation serves us. Still, the author offers a handful of truisms:')+
   L.list([['Creativity is inevitable','It’s in us. The whole book has shown it. Trying to stop it won’t work.'],
     ['Creativity has unintended consequences','So we need awareness of how change can disrupt, and <b>boundaries</b>: laws and policies that limit the harm.']],2)+
   L.note('His example: nobody can walk into a corner store and buy a nuclear bomb. That’s a boundary on a creation’s harm.','shield'));
  L.done();}},
{part:1,src:'Book V · Two Steps Forward',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">After the levee rumor, Ruth proposes shutting down the members’ group chat. What does the chapter suggest?</h1>');
  L.mc(L.card,['Keep the chat and set boundaries that limit the harm','Shut it down, since the harm proves it was a bad idea','Leave it alone, since side effects sort themselves out'],0,
   'Creating is inevitable, side effects are expected, and boundaries are the answer. A rule like “emergencies only from the official alert” could work.',
   'The chapter neither bans creations nor ignores their harm. It says: expect side effects and set boundaries.');}},
{part:1,src:'Book V · Two Steps Forward',pts:1,run(L){
  L.h(L.kick('pr','Build the truism')+'<h1 class="q">Tap each piece until the sentence matches the chapter.</h1>');
  L.sentence(L.card,[['Since creating is','Since creating is rare and'],['inevitable,','optional,'],['the Commons should','the Commons can safely'],['set boundaries on its side effects.','ban its riskiest projects.','ignore its side effects.']],[0,0,0,0],
   [['The chapter says creativity is in everyone, not rare.'],['Creativity is in us. It isn’t optional, which is why boundaries matter.'],['“Safely” misses the second truism: there are always side effects.'],['Banning doesn’t stop something inevitable. Boundaries limit the harm.','Ignoring side effects goes against the second truism.']],
   'Creativity is inevitable and has side effects, so set boundaries instead of banning or ignoring.');}},
{part:1,src:'Book V · Two Steps Forward',pts:1,run(L){
  L.h(L.kick('pr','Put the cycle in order')+'<h1 class="q">Arrange the story of Amara’s sensors as the chapter’s math would tell it.</h1>');
  L.order(L.card,['Sensors start texting riverside homes','Homes get warnings hours earlier','False alarms teach some neighbors to ignore texts','Amara and other towns’ makers add a second check before alerts','People trust the texts again'],
   'Leap forward, side effect, creation in response, light again. Then the cycle starts over.',['Creation','Step forward','Step back','Create in response','Light again']);}},

/* ---------- PART 3: NEW JERUSALEM ---------- */
{part:2,src:'Book V · The New Jerusalem',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">The scientist nobody funded</h1>');
  L.beats(L.card,[
   ['The obsession','In the 1990s, Hungarian-born researcher Katalin Karikó became convinced that mRNA, a kind of genetic messenger, could carry new instructions into the body to fight disease.'],
   ['The no’s','The technology didn’t seem to work. Grant after grant came back rejected.'],
   ['The demotion','In 1995, after six years at the University of Pennsylvania, she was demoted. Most people, she said, would have left.'],
   ['The fix','With collaborator Drew Weissman she found the key: tweak the mRNA so the immune system wouldn’t attack it. Their papers from 2005 on drew little notice.'],
   ['The sprint','But two scientists did notice. They later helped found Moderna and BioNTech, the companies behind the first mRNA COVID-19 vaccines in 2020.']],
   'Work done in darkness for a quarter century became the base for vaccines that could save millions. A quintessential creativity story, the author says.');}},
{part:2,src:'Book V · The New Jerusalem',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Which lesson from the course does Karikó’s story show most clearly?</h1>');
  L.mc(L.card,['Good ideas get recognized right away by experts','A creation’s value may wait years for its moment','Lone geniuses succeed without anyone else’s help'],1,
   'Her work was ignored until its moment came, and others built on it. Timing and the '+L.g('niche','niche')+' matter.',
   'Her ideas were rejected for years, and she worked with Weissman and others who built on it. The lesson is that value can wait for its moment.');}},
{part:2,src:'Book V · The New Jerusalem',run(L){
  L.h(L.kick('ex','Another story from the book')+'<h1 class="q">An album made in quarantine</h1>');
  L.beats(L.card,[
   ['The stall','When the pandemic hit, Taylor Swift felt listless and hopeless, she later said. For the first three days.'],
   ['The work','Then she wrote a very different album, personal and reflective, without telling her label. Her co-producers worked with her from a distance.'],
   ['The mindset','One collaborator said that when old systems fall apart, you either cling to them or chart a new path. He called it a frontier mentality.'],
   ['The release','Swift said total uncertainty brings anxiety, but also releases old pressures. If everything must be rebuilt, start with what you love most.'],
   ['The reveal','Nervous, she finally showed the label. Their answer: make whatever you want. The album was <i>Folklore</i>.']],
   'The author had wondered if the pandemic put creativity on pause. A year later he saw it had exploded instead.');}},
{part:2,src:'Book V · The New Jerusalem',run(L){
  L.h(L.kick('learn','The new Jerusalem')+'<h1 class="q">Where the book began, and where it ended</h1>'+
   L.prose('The book began in Jerusalem’s crowded Old City in late 2019, and ended one year later on an old green couch in San Francisco, with news of the coming mRNA vaccines and a stream of Swift’s album.')+
   L.lanes([['clock','History judges','Only history can say which creations become legend. But it’s not the <i>best</i> judge: everyday creations are the seed corn of the big ones.',3],
            ['home','Creating spreads out','We no longer need to crowd into one city. Home offices, cafés and small gatherings linked by technology are '+L.g('new-jerusalem','the new Jerusalem')+'.',2]])+
   L.prose('Creativity, the author concludes, didn’t pause. It is in each of us, and now even more widespread than the virus.'));
  L.done();}},
{part:2,src:'Book V · The New Jerusalem',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which idea from these stories fits?',['Stubborn persistence','Frontier mentality','Seed corn','The new Jerusalem'],[
   ['Jun keeps reworking the ferry pitch, through vote after vote of “no.”',0,'Like Karikó, Jun keeps going while others see no point.'],
   ['After the flood, Lena drops the old Young Makers schedule and rebuilds it around what the kids love most.',1,'When old systems fall apart, chart a new path and start with what you love.'],
   ['Sol’s small popcorn-bike fixes teach skills the kids later use on bigger builds.',2,'Everyday creations are the seeds bigger ones grow from.'],
   ['Theo co-writes from the upstairs music room with players in three river towns by video.',3,'A small room linked by technology works as a creative hub.']]);}},

/* ---------- PART 4: INSPIRED ---------- */
{part:3,src:'Book V · Inspired',run(L){
  L.h(L.kick('learn','Watching inspiration happen')+'<h1 class="q">The map on Yo-Yo Ma’s face</h1>'+
   L.prose('In 2018, cellist Yo-Yo Ma played a short online concert. He began a Bach prelude, the first piece he learned at four. The author says the real action wasn’t his fingers but his <b>face</b>: eyes closed, frowns, a wry smile, a near-whisper, then waking back to the room.')+
   L.prose('The training had happened long ago. How he played <i>that</i> time came from inspiration in the moment. Ma said everything he has lived through is built into the way he plays.')+
   L.note('In a 2021 interview, Ma showed the traits the book keeps finding in creators: endless curiosity, smart-dumb questions, listening more than preaching. He widened the idea of a creator beyond artists, to people like Adam Smith and Einstein. And, the author adds, someone first had to build the cello.','eye'));
  L.done();}},
{part:3,src:'Book V · Inspired',run(L){
  L.h(L.kick('learn','The book’s most important point')+'<h1 class="q">Creativity is first about inspiration, not outcome</h1>'+
   L.prose('Outcome, influence, even process come second, the author says. First comes a personal impulse: a gut feeling, a spark. It isn’t reserved for the lucky few. What Ma feels, anyone can feel. Ma described what happens before he makes something:')+
   L.flow([['down','Lost','feels bereft, not knowing which way is up','',4],['layers','Collect','gathers information until it feels solid','',3],['eye','The edge','looks over at something scary: criticism, ridicule','',1],['arrow','Leap','can’t help it; it’s like falling in love','',2]])+
   L.prose('Creativity is terrifying, even for the greats. What sets Ma apart is <b>faith</b> that the inspiration is there for a reason. Parents and teachers, the science shows, can give kids permission to go to that edge.'));
  L.done();}},
{part:3,src:'Book V · Inspired',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">When Ma comes to the edge and leaps, what is driving him in that moment?</h1>');
  L.mc(L.card,['Releasing his inner creator, with faith he will land','Making sure this is his best performance yet','Changing how the world hears Bach for good'],0,
   'Whether it’s his best or changes the world isn’t what drives him then. It’s the release of the creator inside.',
   'The author says “best” and “world-changing” aren’t what drive Ma at that moment. He leaps to let his inner creator out, trusting he’ll land.');}},
{part:3,src:'Book V · Inspired',pts:1,run(L){
  L.h(L.kick('pr','Ma’s process at the Commons')+'<h1 class="q">Theo is stuck on a new song for café night. Put the steps in the order Ma describes.</h1>');
  L.order(L.card,['Theo sits feeling blank, unsure which way is up','Theo gathers old recordings, river sounds and café stories','Theo senses a scary idea: a song about their parent’s welding','Theo plays it at café night, unsure how it will land'],
   'Lost, collect, look over the edge, leap. Theo doesn’t wait to feel sure; they trust the inspiration.',['Lost','Collect','The edge','Leap']);}},
{part:3,src:'Book V · Inspired',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Inspiration first, or outcome first?',['Inspiration first','Outcome first'],[
   ['Sol keeps tinkering with a strange raft idea because it won’t leave their head.',0,'The spark comes first. Whether it “works” comes later.'],
   ['Amara drops a sensor idea because it probably wouldn’t win the regional fair.',1,'Judging by the prize puts outcome ahead of the impulse.'],
   ['Lena tells the class, “Go to the edge of your idea. Silly is allowed.”',0,'That’s the permission teachers can give, the science says.'],
   ['Theo only writes songs the scout is likely to want.',1,'Writing for someone else’s target puts outcome first and mutes the voice.']]);}},
{part:3,src:'Book V · Inspired',pts:1,run(L){
  L.h(L.kick('pr','The last Idea Night')+'<h1 class="q">At Idea Night, Sol, now eleven, stands up with a wild idea and freezes, afraid of being laughed at. What would this course say to Sol?</h1>');
  L.mc(L.card,['Wait until the idea is polished and certain to impress','Only pitch it if it could change the whole town','Feeling scared is normal; trust the spark and leap'],2,
   'Creativity is terrifying, even for Yo-Yo Ma. The creator’s move is permission and faith: you’re worthy, so leap.',
   'No idea is certain, and it needn’t change the world. The course’s last word: creating is scary for everyone; trust the inspiration and leap.');}},
{part:3,src:'Book V · Inspired',run(L){
  L.h(L.kick('learn','The end of the journey')+'<h1 class="q">We are the creators. Each of us.</h1>'+
   L.prose('Ma believes we’re living through a golden era of creativity, with digital tools in everyone’s hands. The author agrees, and warns it cuts both ways: what we build can snare our attention or build knowledge, curiosity and collaboration. Which one wins depends partly on luck and partly on how we use the tools.')+
   L.quote('We need to be the authors of our own narrative as we proceed.','Yo-Yo Ma, to the author')+
   L.prose('That’s the whole course in one line. Creativity lives in all of us. Doubt is its enemy, openness its fuel, and you are its secret ingredient. Be inspired.'));
  L.done();}}
  ]
});
</script>
</body>
</html>
