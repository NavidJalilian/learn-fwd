<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Four C’s</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">

</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0020', title:'The four C’s', minutes:18, icon:'layers',
  goals:['Explain why “Big C or Little C” was too blunt for creativity researchers','Place any creation on the Four C’s: Mini C, Little C, Pro C or Big C','Know that only time decides a Big C, and focus on the part you control'],
  parts:['Two C’s fall short','Mini and Little','Pro C','Big C and you'],
  read:'Read “Vocabulary: Four C’s” in Book III for the stories of Velcro, Vivian Maier, Linwood Barclay’s model railway and Norman Borlaug in full.',
  glossary:{
    'mini-c':'Mini C: a new idea or insight that matters to you personally, even if nobody else ever sees it or likes it.',
    'pro-c':'Pro C: creative work by someone with real training and practice in a field, good enough to have some impact on that field, even a small one.'
  },
  cheatsheet:[
    'Kaufman and Beghetto found <b>Big C vs Little C</b> too blunt: unseen ideas, hobbies and pro work didn’t fit.',
    '<b>Mini C</b>: novel and meaningful to you. Cinnamon in the mashed potatoes, even if nobody eats it.',
    '<b>Little C</b>: a Mini C that makes a ripple. “Make that chili again.” Nearly everyone can do it, and it counts.',
    '<b>Pro C</b>: work by trained, practiced people in their field. Not about money, fame or even talent. A huge span, with millions of people in it.',
    '<b>Big C</b>: enduring, field-changing work that becomes the new foundation. It’s domain-specific and decided only by history.',
    'Every C has a <b>dimmer switch</b>: each level spans a range, from low to high.',
    '<b>Creativity isn’t fame.</b> Norman Borlaug’s wheat fed the hungry, yet few know his name.',
    'You can’t control which C history gives you. The one thing you control is <b>you</b>.'
  ],
  steps:[
/* ---------- PART 1: TWO C'S FALL SHORT ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">At home, Sol turns an empty tissue box into a hat and grins at the mirror. Nobody else sees it. Was that creative?</h1>');
  L.mc(L.card,['No, since nobody else ever noticed it','Yes, in a small and personal way'],1,
   'Good instinct. Creativity researchers came to the same view, and gave this kind of moment its own name. This lesson shows the whole scale.',
   'It’s tempting to think it needs an audience. But two researchers decided that personal flashes like this count too, and gave them their own name.');}},
{part:0,src:'Book III · Vocabulary: Four C’s',run(L){
  L.h(L.kick('learn','A problem with two labels')+'<h1 class="q">Big C or Little C was too blunt</h1>'+
   L.prose('For decades, researchers sorted creativity into two bins: '+L.g('big-c','Big C')+' for the geniuses who change a field, and '+L.g('little-c','Little C')+' for the rest of us.')+
   L.prose('In 2009, over appetizers in San Diego, researchers James Kaufman and Ronald Beghetto decided this was a serious problem. Days later Kaufman flew to Oregon and they brainstormed until two in the morning. They kept finding loopholes:')+
   L.list([['eye','The shelved insight','In the late 1940s, George de Mestral noticed burrs stuck to his dog’s fur. He went on to invent Velcro. But if he had just shrugged and moved on, what was that moment?'],
     ['book','The unseen work','A brilliant creation that nobody else sees: does it count as anything?'],
     ['pencil','The student and the pro','Is a good eighth-grade essay the same kind of creation as a professional writer’s essay?']],1));
  L.done();}},
{part:0,src:'Book III · Vocabulary: Four C’s',run(L){
  L.h(L.kick('ex','A real story from the book')+'<h1 class="q">The nanny with a camera</h1>');
  L.beats(L.card,[
   ['Her life','Vivian Maier worked as a nanny in Chicago. As a hobby she walked the city with a camera, and later traveled the world taking pictures.'],
   ['Never shown','She often didn’t even get her film developed. She went unpublished and seemed uninterested in being published.'],
   ['The find','After her death, a real-estate broker came across about 150,000 of her photos and saw how brilliant they were: street life, faces, kids dancing in a hydrant’s spray.'],
   ['The puzzle','Acclaim and internet fame followed, none of which she sought. So what were the photos before anyone saw them? Does a creation need to be appreciated to count?']],
   'With only two labels, Maier’s work fits neither neatly. That’s the kind of puzzle that pushed Kaufman and Beghetto to rethink the scale.');}},
{part:0,src:'Book III · Vocabulary: Four C’s',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">What bothered Kaufman and Beghetto about Big C and Little C?</h1>');
  L.mc(L.card,['Too many creations were labeled Big C','The two labels left too many loopholes','Researchers couldn’t agree on the names'],1,
   'Right. Shelved ideas, unseen work, and students versus pros didn’t fit two bins.',
   'The issue wasn’t too many Big C’s or the names themselves. Two bins left too many cases, like shelved ideas and student versus pro work, with no clear place.');}},
{part:0,src:'Book III · Vocabulary: Four C’s',pts:1,
 solve:async L=>{L.$('#tg').children[1].click();L.$('#tg').children[0].click();},
 run(L){
  const C=[['De Mestral notices burrs, then shelves the idea','Unclear','Mini C'],
           ['Kaufman’s cinnamon mashed potatoes nobody eats','Unclear','Mini C'],
           ['A strong fifth-grade essay emailed to family','Little C','Little C'],
           ['A professional writer’s solid essay','Little C','Pro C']];
  const seen=new Set();
  L.h(L.kick('pr','Toggle and compare')+'<h1 class="q">Switch between the old two-label view and the new four-label one. Watch how each case gets labeled.</h1><div id="tg"></div>'+
   '<div style="background:var(--soft);border-radius:16px;padding:14px;margin:8px 0 6px;min-height:150px" id="cs"><div class="small">Choose a view above.</div></div><div id="tq"></div>');
  ['Two C’s','Four C’s'].forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.innerHTML=L.ic('layers')+n;b.onclick=()=>{[...L.$('#tg').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(j);
    L.$('#cs').innerHTML=C.map(c=>{const lab=c[j+1],bad=lab==='Unclear';return '<div style="display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0"><span class="small" style="flex:1 1 160px">'+c[0]+'</span><span class="chip static'+(bad?'':' ok')+'" style="'+(bad?'opacity:.5':'')+'">'+(bad?L.ic('x'):L.ic('check'))+lab+'</span></div>';}).join('');
    if(seen.size===2&&!L.$('#tq').innerHTML){const q=L.$('#tq');q.innerHTML='<h2 class="sub">What did the four-label view fix?</h2>';
      L.mc(q,['It gives private sparks and pro work their own places','It decides which creations are good or bad'],0,
       'Right. Personal flashes now have a home (Mini C), and the trained professional is no longer lumped in with the fifth grader (Pro C).',
       'The labels don’t judge good or bad. They give private sparks a home (Mini C) and separate professional work from everyday work (Pro C).');}};L.$('#tg').appendChild(b);});}},

/* ---------- PART 2: MINI AND LITTLE ---------- */
{part:1,src:'Book III · Vocabulary: Four C’s',run(L){
  L.h(L.kick('ex','Why it felt personal')+'<h1 class="q">Kaufman’s own path</h1>');
  L.beats(L.card,[
   ['The dream','As a kid, Kaufman wrote story after story and studied creative writing in college. He wanted to be a creative writer.'],
   ['The letter','A graduate writing program warned him: about twenty graduates a year, and only about thirty jobs for them in the whole country.'],
   ['The realization','Around then he decided he was “good, but not great.”'],
   ['The turn','He went to Yale to study psychology, then creativity itself. He kept writing too, including a musical staged at a small New York theater.']],
   'Kaufman lived the question himself: where does work like his musical, or a recipe the family raves about, fit if it isn’t Big C?');}},
{part:1,src:'Book III · Vocabulary: Four C’s',run(L){
  L.h(L.kick('learn','The Four C’s')+'<h1 class="q">Four levels instead of two</h1>'+
   L.prose('Kaufman and Beghetto’s answer was the '+L.g('four-cs','Four C’s')+'. The author calls it extremely helpful for understanding creativity and our own behavior.')+
   L.tiers([['star','Big C','Enduring work that remakes a field. Only history decides.','Norman Borlaug’s high-yield wheat'],
            ['shield','Pro C','Work by trained, practiced people that touches their field.','A thriller writer’s published novels'],
            ['people','Little C','A Mini C that makes a ripple: others notice.','“This chili is good. Make it again.”',true,'Nearly all of us'],
            ['bulb','Mini C','New and meaningful to you personally.','Cinnamon in the mashed potatoes']])+
   '<p class="small" style="margin-top:10px">The next screens take each level in turn, starting at the bottom.</p>');
  L.done();}},
{part:1,src:'Book III · Vocabulary: Four C’s',run(L){
  L.h(L.kick('learn','Mini C and Little C')+'<h1 class="q">From a private spark to a small ripple</h1>'+
   L.lanes([['bulb','Mini C','A fresh, personally meaningful take on an experience. It’s mostly about your own satisfaction. Kaufman once put cinnamon in mashed potatoes, and nobody would go near it. Still a Mini C. We all have these many times a day.',1],
            ['people','Little C','A Mini C that gets noticed, however modestly. Kaufman’s family asks him to make his chili again. A kid’s painting goes on the fridge. A song your partner asks you to play for guests.',2]])+
   L.prose('The author stresses that Little C counts. Thriller writer Linwood Barclay spent the pandemic building a model railway that filled a whole room. You could call it a hobby, but it’s still an inspiration acted on.'));
  L.done();}},
{part:1,src:'Book III · Vocabulary: Four C’s',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">What turns a Mini C into a Little C?</h1>');
  L.mc(L.card,['Other people notice it, even a little','It earns money from strangers','It changes how a whole field works'],0,
   'Right. A Little C is a Mini C that makes a ripple: the family asks for the chili again.',
   'Money and changing a field belong further up the scale. The step from Mini C to Little C is simply that others notice and value it, even a little.');}},
{part:1,src:'Book III · Vocabulary: Four C’s',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Mini C or Little C?',['Mini C','Little C'],[
   ['Sol sketches a raft with a paddle wheel, then hides it in a drawer.',0,'It’s new and meaningful to Sol, but nobody else has seen it yet.'],
   ['Theo’s café regulars keep asking for the honey-oat cookie Theo invented.',1,'People noticed and want it again. That’s the ripple of a Little C.'],
   ['Amara thinks up a faster way to coil cable and uses it only at home.',0,'A private improvement that pleases Amara alone is a Mini C.'],
   ['Lena’s Young Makers ask to play the clean-up game Lena made up, every week.',1,'The kids noticed and want it again, so it’s a Little C.'],
   ['Jun hums a new tune while welding, then forgets it.',0,'A personal flash that never leaves Jun’s head is a Mini C, and it still counts.']]);}},

/* ---------- PART 3: PRO C ---------- */
{part:2,src:'Book III · Vocabulary: Four C’s',run(L){
  L.h(L.kick('learn','Pro C')+'<h1 class="q">The big new category in the middle</h1>'+
   L.prose('The author calls '+L.g('pro-c','Pro C')+' the most important new category, and the most complicated. It covers creations by professionals, often recognized as very good or even great.')+
   L.list([['target','Where it starts','For Kaufman, Pro C begins when work is published or accepted and its impact grows from local to the field itself, even if that impact is small.'],
     ['shield','What it takes','Not money, not fame, not even talent. You need enough practice and training in the field. Pro C work doesn’t break the mold, but it shapes it.'],
     ['people','How big it is','Millions of people. A scientist who found the molecule that causes fever sits here with a famous singer, and with the author himself.']],2)+
   L.note('All four C’s work like a <b>dimmer switch</b>: each has a range from low to high. Pro C has the widest range of all.','info'));
  L.done();}},
{part:2,src:'Book III · Vocabulary: Four C’s',run(L){
  L.h(L.kick('ex','Same creator, different C’s')+'<h1 class="q">Tap each card. One person can work at several levels.</h1>');
  L.flips(L.card,[
   ['Linwood Barclay · novels','Pro C. A top-selling thriller writer with years of practice in his field.'],
   ['Linwood Barclay · trains','Little C. A room-sized model railway, built with love for a lifelong hobby, in a field that isn’t his profession.'],
   ['James Kaufman · cinnamon','Mini C. An exciting twist to him, even though his family wouldn’t touch it.'],
   ['James Kaufman · Four C’s paper','Pro C, of a higher notch. Published work that shapes his field of creativity research.']],
   'The C belongs to the creation, not the person. A pro in one field can be a Little C creator in another.');}},
{part:2,src:'Book III · Vocabulary: Four C’s',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">According to the chapter, what is the key requirement for Pro C?</h1>');
  L.mc(L.card,['Being well known to the public','Enough training and practice in the field','Selling the work for lots of money'],1,
   'Right. The key facet of Pro C is not money, fame or even talent. It’s enough practice and training in the field.',
   'The chapter says Pro C isn’t about money, fame or even talent. The key is enough practice and training in the field.');}},
{part:2,src:'Book III · Vocabulary: Four C’s',pts:5,run(L){
  L.h(L.kick('pr','Little C or Pro C?')+'<h1 class="q">Sort each Alder Commons creation.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Little C','Pro C'],[
   ['Amara’s new sample-labeling method is published in a hospital lab journal.',1,'Amara is a trained lab technician, and the work was accepted in that field. That’s where Pro C begins.'],
   ['Jun’s birdhouse design that three neighbors ask to copy.',0,'Neighbors noticed and wanted it. A welcome ripple outside Jun’s trained field.'],
   ['Lena’s reading unit is adopted by other fifth-grade teachers in the county.',1,'Lena is a trained teacher, and the work now reaches beyond one classroom into the field.'],
   ['Theo’s latte art that regulars photograph and share.',0,'People enjoy and share it. That’s a Little C ripple.'],
   ['A visiting boat builder’s new hull design is picked up by other shipwrights.',1,'A trained professional shaping their own field is Pro C.']],
   'Pro C needs training and practice in the field, and some impact on it. Being noticed by friends and neighbors is Little C, and it still counts.');}},
{part:2,src:'Book III · Vocabulary: Four C’s',pts:1,run(L){
  L.h(L.kick('pr','Apply it')+'<h1 class="q">Lena laughs: “My article in a teachers’ magazine can’t be the same C as a famous novelist’s books.” What does the chapter say?</h1>');
  L.mc(L.card,['Both can be Pro C, at different notches','Lena’s article is only a Little C','Only the novelist’s books count as Pro C'],0,
   'Right. Pro C spans a huge range, like a dimmer switch. A teacher’s published article and a bestseller can both sit in it, at different levels.',
   'Lena is a trained teacher whose work was published in their field, which is where Pro C starts. The category is wide, like a dimmer switch, so a famous novelist sits in it too.');}},

/* ---------- PART 4: BIG C AND YOU ---------- */
{part:3,src:'Book III · Vocabulary: Four C’s',run(L){
  L.h(L.kick('learn','Big C')+'<h1 class="q">Tiny, rare, and decided by time</h1>'+
   L.quote('Big C is for the ages.','James Kaufman, quoted in “Vocabulary”')+
   L.list([['clock','Enduring','A Big C’s worth can often be measured only over decades or centuries. No creator controls that.'],
     ['tree','Foundational','It breaks sharply from the way the field was going. Others copy its methods, and it becomes the field’s new foundation.'],
     ['scale','Domain-specific','Judge it within its own field. Don’t compare a medical pioneer with a musician.']],3)+
   L.prose('And creativity isn’t fame. Norman Borlaug developed new wheat strains that vastly increased harvests and fed hungry people. He won the 1970 Nobel Peace Prize, yet most people have never heard of him.'));
  L.done();}},
{part:3,src:'Book III · Vocabulary: Four C’s',run(L){
  L.h(L.kick('ex','The author tests the idea')+'<h1 class="q">Who might be a Big C today?</h1>');
  L.beats(L.card,[
   ['A guess','The author suggests Jim Allison, the Nobel-winning cancer scientist. Kaufman warns him not to compare a scientist with a musician or an athlete: Big C is judged field by field.'],
   ['A joke','Kaufman tells an old joke: a 1960s band sold only four hundred albums, and every buyer went on to start a band. Influence, not sales.'],
   ['A test case','What about Bruce Springsteen? Kaufman: in four hundred years not everyone will know the music, but music lovers will still name him as one of the few to hear. He’s in.'],
   ['The verdict','Only history can really decide which of the four C’s a creation belongs to.']],
   'A Big C is enduring, foundational and judged within its field. And that judgment belongs to time.');}},
{part:3,src:'Book III · Vocabulary: Four C’s',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Who decides whether a creation is a Big C?</h1>');
  L.mc(L.card,['Critics, the year it comes out','The creator, by aiming high','History, over a long time'],2,
   'Right. A Big C can often be measured only over decades or centuries. That’s the one part no creator controls.',
   'Neither early critics nor the creator’s ambition settle it. The chapter says only history can decide.');}},
{part:3,src:'Book III · Vocabulary: Four C’s',pts:1,run(L){
  L.h(L.kick('pr','Apply it')+'<h1 class="q">At Idea Night, Jun declares the ferry workshop will be a Big C. A board member snaps that it will never matter. What does the chapter suggest?</h1>');
  L.mc(L.card,['Jun is right, since bold ideas tend to last','The board member is right, it’s too small','Neither can know. Jun can focus on the work'],2,
   'Right. Whether something is a Big C only history decides. What Jun controls is Jun: doing the work authentically.',
   'Nobody can call a Big C ahead of time, for or against. Only history decides. The part Jun controls is the work itself.');}},
{part:3,src:'Book III · Vocabulary: Four C’s',pts:1,run(L){
  L.h(L.kick('pr','Put it in order')+'<h1 class="q">Imagine one of Lena’s ideas climbing the whole scale. Arrange the steps from smallest C to biggest.</h1>');
  L.order(L.card,['Lena dreams up a new clean-up game, just for fun','The Young Makers beg to play it every week','A teachers’ magazine publishes it as a method','Generations later, schools everywhere build on it'],
   'Mini C (a private spark), Little C (the kids notice), Pro C (a trained teacher’s work accepted in the field), and Big C (enduring, foundational). That last step only history can confirm.',
   ['Mini C','Little C','Pro C','Big C']);}},
{part:3,src:'Book III · Vocabulary: Four C’s',pts:6,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Mixed review: which C fits best?',['Mini C','Little C','Pro C','Big C'],[
   ['Norman Borlaug’s high-yield wheat strains.',3,'Enduring, field-changing and copied around the world, even though his name isn’t famous.'],
   ['Sol’s private joke that a tower of blocks looks like an upside-down pie.',0,'A personal, meaningful flash. It counts, even unshared.'],
   ['Theo’s song that friends ask Theo to play whenever they visit.',1,'People notice and ask again. A Little C ripple.'],
   ['A doctor’s discovery of the molecule that causes fever.',2,'The book places this scientist in Pro C: trained work that shapes the field.'],
   ['A professional thriller writer’s latest published novel.',2,'Like Linwood Barclay’s books: trained, practiced work in the writer’s own field.'],
   ['Kaufman’s chili, which his family asks for again.',1,'The book’s own Little C example: the family noticed and wants more.']]);}},
{part:3,src:'Book III · Vocabulary: Four C’s',pts:1,run(L){
  L.h(L.kick('pr','Build the takeaway')+'<h1 class="q">Tap each piece until the sentence sums up the chapter.</h1>');
  L.sentence(L.card,[['Mini C pleases you,','Mini C needs an audience,'],['Pro C needs fame,','Pro C needs training,','Pro C needs money,'],['only history crowns a Big C,','critics crown a Big C at once,'],['so aim only for the top level.','so focus on what you control: you.']],[0,1,0,1],
   [['A Mini C is personal. It doesn’t need anyone else to see it.'],['The chapter says Pro C isn’t about fame.','The chapter says Pro C isn’t about money.'],['Critics can’t settle it early. Big C is measured over decades or centuries.'],['Aiming for Big C misses the point. The chapter ends on what you control: yourself.']],
   'That’s the whole scale in one line, and the chapter’s last word: the one thing you control is you.');}}
  ]
});
</script>
</body>
</html>
