<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>100 Percent Responsibility Mastery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0009', title:'100 percent responsibility mastery', minutes:19, icon:'shield',
  goals:['Swap blame for 100 percent responsibility and zero criticism','Confront a client’s harmful habit with tough love, as an abundance-minded advisor','Spot fear, guilt and low feelings masking talent, and know what to do about each'],
  parts:['Abundance','Tough love','Own it','Masks'],
  read:'Read chapter 9 of the book for the full story of Ron, the Fun House, and the authors’ take on guilt used as a weapon.',
  glossary:{
    victim:'Victim consciousness: believing your troubles are always someone else’s doing, so you play the blame game instead of acting.',
    'judgment-free':'Judgment-free: looking for causes, not culprits. When someone does fall short, you help them improve instead of condemning them.',
    'own-metrics':'Your own metrics: judging your progress against your own goals and past, not by how fast, well or much someone else does.'
  },
  cheatsheet:[
    '<b>100 percent responsibility, 0 percent criticism</b>: no blame game, no victim consciousness.',
    'Move from scarcity to <b>abundance</b>: treat yourself and others as having unique gifts.',
    'Be <b>authentic</b> (share setbacks too), <b>vulnerable</b> (open to solicited feedback) and <b>judgment-free</b> (cause, not blame).',
    'Ask <b>“What could I have done better to earn this?”</b> Hold no grudges; don’t take your unhappiness out on others.',
    'Use <b>your own metrics</b>. Self-worth doesn’t rise or fall with your latest win, or with others’ words.',
    'Confronting harmful habits is the advisor’s job: that’s <b>tough love</b>. Ron had to stop being “the smartest guy in the room.”',
    '<b>Masks of talent</b>: fear (mostly false, to protect ego), guilt (accept, apologize, learn, move on), low feelings (talk them out).',
    'Advisors aren’t therapists: listen, share experience, and point to a professional when needed.'
  ],
  steps:[
/* ---------- PART 1: ABUNDANCE ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Kofi tells the Tidewater Table why Lumen Loop lost its biggest customer. Which version helps Kofi most next quarter?</h1>');
  L.mc(L.card,['“Their new buyer had it in for us from the start.”','“What could we have done better to keep them?”'],1,
   'Only the second gives Kofi something to change. This lesson is about owning 100 percent of your part.',
   'Blaming the buyer may even be partly true, but it leaves Kofi nothing to work on. The second question points at what Kofi can change.');}},
{part:0,src:'Chapter 9 · The Abundance Mindset',run(L){
  L.h(L.kick('learn','The core mindset')+'<h1 class="q">100 percent responsibility, 0 percent criticism</h1>'+
   L.prose('The authors ask for this mindset every day. It is empowering; the opposite, '+L.g('victim','victim consciousness')+' and the blame game, defeats you.')+
   L.quote('Most men live lives of quiet desperation.','Thoreau, quoted by the authors in chapter 9')+
   L.prose('Too many people, the authors say, live with a <b>scarcity</b> mindset. Recall the watertight doors from Social Contribution Mastery: getting from scarcity to '+L.g('abundance','abundance')+' takes real <i>changes</i>, or you stay scarcity-minded however “successful” you look.')+
   L.note('The shift starts with one belief: you and everyone around you have <b>unique gifts and talents</b>.','star'));
  L.done();}},
{part:0,src:'Chapter 9 · The Abundance Mindset',run(L){
  L.h(L.kick('learn','Three ways it shows')+'<h1 class="q">What treating people as gifted looks like. Tap each card.</h1>');
  L.flips(L.card,[
   ['Authentic','Honest and candid. You share your defeats and setbacks, not only your wins.'],
   ['Vulnerable','Not defensive. Open to '+L.g('solicited','solicited feedback')+', weighing others’ views to improve your own behavior and results.'],
   ['Judgment-free','You seek causes, not blame. When someone does fall short, you help them improve; you don’t condemn them.']],
   'All three are about how you show up. Clients copy what they see you do.');}},
{part:0,src:'Chapter 9 · The Abundance Mindset',run(L){
  L.h(L.kick('ex','At the Table')+'<h1 class="q">Rowan answers Kofi’s bad news</h1>');
  L.beats(L.card,[
   ['The moment','Kofi finishes the story of the lost customer and stares at the table. Two members start listing what Kofi did wrong.'],
   ['Authentic','Rowan cuts in gently with their own story: the year they lost their biggest retainer and what they missed.'],
   ['Vulnerable','Rowan adds: “Sunny told me I’d stopped listening to that client. Sunny was right.”'],
   ['Judgment-free','Then Rowan steers the room: “Let’s find what caused this, not who.” The group maps three causes; none is “Kofi is bad at this.”'],
   ['The effect','Kofi looks up and starts taking notes. The room has moved from a trial to a working session.']],
   'Rowan didn’t lecture about the mindset. Rowan showed it, and the group followed.');}},
{part:0,src:'Chapter 9 · The Abundance Mindset',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">A Copperline café manager gets an order badly wrong. What would a judgment-free Mireille do?</h1>');
  L.mc(L.card,['Find out what caused it and help the manager do better','Note the error in the manager’s file as a warning'],0,
   'Judgment-free means seeking cause and helping poor performance improve, not condemning it.',
   'A warning on file condemns without fixing anything. Judgment-free means finding the cause and helping the person improve.');}},
{part:0,src:'Chapter 9 · The Abundance Mindset',pts:5,run(L){
  L.h(L.kick('pr','Which trait?')+'<h1 class="q">Sort each moment by the trait it shows.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Authentic','Vulnerable','Judgment-free'],[
   ['Dana tells the staff about a boat launch that went wrong under Dana’s watch.',0,'Sharing defeats, not only victories, is being authentic.'],
   ['Mireille asks the Table, “What am I doing that makes my managers go quiet?”',1,'Asking for feedback and staying open to it is vulnerability.'],
   ['After a late delivery, Kofi asks “What broke?” instead of “Who broke it?”',2,'Looking for cause, not blame, is judgment-free.'],
   ['Rowan hears a member’s critique of a session and changes the agenda, without arguing.',1,'Being nondefensive with feedback you asked for is vulnerability.'],
   ['Rowan tells a new member about the year their practice nearly failed.',0,'Candor about setbacks is authenticity.']],
   'Authentic is what you share, vulnerable is how you take feedback, judgment-free is how you treat others’ mistakes.');}},

/* ---------- PART 2: TOUGH LOVE ---------- */
{part:1,src:'Chapter 9 · The Abundance Mindset',run(L){
  L.h(L.kick('learn','The advisor’s job')+'<h1 class="q">Confronting harmful habits is part of the work</h1>'+
   L.prose('The authors find these issues all the time in senior teams: talented people held back by esteem problems they aren’t taking responsibility for. They call it heartbreaking.')+
   L.prose('This is where an advisor helps most. You are responsible for <b>confronting</b> those behaviors, honestly. That is what '+L.g('tough-love','tough love')+' means.')+
   L.lanes([['x','Not this','Hint, hope the client notices, or keep quiet to stay liked.',4],
            ['check','This','Name the observed behavior, say what it costs, and help the client change.',2]]));
  L.done();}},
{part:1,src:'Chapter 9 · Case Study Vignette',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">Ron, the CEO who finished everyone’s sentences</h1>');
  L.beats(L.card,[
   ['The puzzle','Ron runs a successful specialty eyewear company. He is bright and energetic, but feels his team isn’t engaged.'],
   ['Watching','An advisor shadows Ron for two weeks: meetings, presentations, evaluations.'],
   ['The finding','At the debrief: Ron constantly cuts people off, finishes their sentences and moves on. He did it to his CFO and sales director just yesterday.'],
   ['The reason','Ron says he means to show he agrees and keep things moving. Being the smartest person in the room is how he got on the fast track.'],
   ['The reframe','The advisor: you’re not in that room anymore. Your job now is to bring out the best in others, not to keep proving you’re the best.'],
   ['The result','Ron changes, stops acting as if he’s competing for scarce credit, and his team becomes far more productive.']],
   'Ron wasn’t evil or insecure. He just hadn’t embraced abundance or grown comfortable with his own self-worth.');}},
{part:1,src:'Chapter 9 · Case Study Vignette',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">What was really behind Ron’s interrupting, according to the authors?</h1>');
  L.mc(L.card,['A scarcity habit left over from his rise','A hidden wish to humiliate his team'],0,
   'It had worked when he was competing in a room of bright people. He hadn’t yet embraced abundance.',
   'The authors say plainly that Ron wasn’t evil or insecure. It was an old scarcity habit from his climb.');}},
{part:1,src:'Chapter 9 · The Abundance Mindset',pts:1,run(L){
  L.h(L.kick('pr','Say it')+'<h1 class="q">Dana has started finishing family board members’ sentences, just as they once did to managers. Tap each piece until Rowan’s line is tough love done well.</h1>');
  L.sentence(L.card,[['People are saying that','In Tuesday’s board meeting,'],['you seem a bit impatient,','you finished your aunt’s sentences three times,'],['and they stopped offering ideas.','but maybe it doesn’t matter.'],['Let’s see if it settles down.','Your job now is to draw out their best.']],[1,1,0,1],
   [['Secondhand gossip isn’t observed behavior. Start from what Rowan saw.'],['“A bit impatient” is a label, not something Rowan observed.'],['Tough love doesn’t soften the cost away. Say what it does to the board.'],['Waiting is how habits like Ron’s last for years. Point to the change.']],
   'Observed behavior, its cost, and the new job: the same moves the advisor used with Ron.');}},

/* ---------- PART 3: OWN IT ---------- */
{part:2,src:'Chapter 9 · The Abundance Mindset',run(L){
  L.h(L.kick('learn','Owning your part')+'<h1 class="q">Three habits of a responsible mind</h1>'+
   L.list([['pointer','Assume responsibility','Ask “What could I have done better to earn this business?” (or promotion, or assignment), instead of blaming others.'],
     ['leaf','Hold no grudges','The person you blame usually doesn’t even know it. Until you let go, old slights trouble you forever.'],
     ['scale','Don’t take it out on others','Most anger is really anger at ourselves, turned outward. Admit your own errors and move on without anger.']],1));
  L.done();}},
{part:2,src:'Chapter 9 · The Abundance Mindset',run(L){
  L.h(L.kick('learn','Your worth is not on the scoreboard')+'<h1 class="q">Keep self-worth steady, whatever happens</h1>'+
   L.list([['target','Use your own metrics','Don’t judge your progress by how fast someone else runs, writes or speaks, and don’t be intimidated by people who do things well. ('+L.g('own-metrics','Own metrics')+'.)'],
     ['star','Love yourself first','If you’re happy with yourself, you can tolerate others’ shortcomings and enjoy their successes.'],
     ['shield','Wins and losses aren’t worth','Everyone wins some and loses some. Neither changes your '+L.g('self-worth','self-worth')+', nor do other people’s words or actions.']],2)+
   L.note('Feels like a lot? The authors say you are up to it: it’s a mindset, not a talent.','bulb'));
  L.done();}},
{part:2,src:'Chapter 9 · The Abundance Mindset',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Rowan sees another advisor online announcing a third book and a waiting list. Rowan feels small. What does the chapter suggest?</h1>');
  L.mc(L.card,['Set a goal to match their output within a year','Measure Rowan’s progress against Rowan’s own goals'],1,
   'Use your own metrics. And don’t be intimidated by people who do things well.',
   'Chasing someone else’s pace is using their metrics. The authors say to judge your progress by your own.');}},
{part:2,src:'Chapter 9 · The Abundance Mindset',pts:1,
 solve:async L=>{L.$('#lb0').click();L.$('#lb1').click();},
 run(L){
  const V=[['Blame lens','“Their new buyer had it in for us.”',['Kofi learns nothing to change.','Kofi stays angry at a person who doesn’t know it.','Next pitch: same approach, same risk.'],4],
           ['Responsibility lens','“What could we have done better to keep them?”',['Kofi finds three gaps: slow fixes, no check-ins, one contact only.','Nothing to hold a grudge about; the energy goes into fixes.','Next pitch: a check-in plan and two contacts.'],2]];
  const seen=new Set();
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Same lost customer, two ways to look at it. Tap each lens and watch where Kofi ends up.</h1>'+
   '<div style="display:flex;gap:8px;flex-wrap:wrap" id="lz"></div><div id="lo" style="margin-top:12px"></div><div id="lq"></div>');
  V.forEach((v,j)=>{const b=document.createElement('button');b.className='chip';b.id='lb'+j;b.innerHTML=L.ic(j?'check':'x')+v[0];
    b.onclick=()=>{[...L.$('#lz').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(j);
      L.$('#lo').innerHTML=L.lanes([[j?'check':'x',v[1],v[2].map(t=>'• '+t).join('<br>'),v[3]]]);
      if(seen.size===2&&!L.$('#lq').innerHTML){const q=L.$('#lq');q.innerHTML='<h2 class="sub">Is the blame lens ever worth it, if the buyer really was difficult?</h2>';
        L.mc(q,['Yes, if the blame is accurate','No, it still leaves Kofi stuck'],1,
         'Even fair blame changes nothing Kofi controls. Responsibility asks what Kofi could have done better.',
         'Accurate or not, blame gives Kofi nothing to act on and a grudge to carry. 100 percent responsibility is about what you can change.');}};
    L.$('#lz').appendChild(b);});}},
{part:2,src:'Chapter 9 · The Abundance Mindset',pts:6,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Owning it, or not?',['Owning it','Not owning it'],[
   ['Rowan loses a proposal and asks the prospect what would have made it a yes.',0,'“What could I have done better to earn this business?” is the responsible question.'],
   ['Dana still brings up, years later, the uncle who sided against them on the board.',1,'That’s a grudge. The uncle may not even know, and Dana stays troubled.'],
   ['After a bad week, Mireille snaps at every café manager’s report.',1,'Taking your own unhappiness out on others by critiquing them.'],
   ['Kofi stops comparing Lumen Loop’s growth to a rival’s funding news.',0,'Using your own metrics, not someone else’s.'],
   ['Rowan decides they’re a fraud after one session falls flat.',1,'One loss doesn’t change your worth. Self-esteem shouldn’t ride on the latest result.'],
   ['Dana admits to the team that a pricing call was Dana’s mistake, then moves on.',0,'Admitting your own error and moving on without anger.']]);}},

/* ---------- PART 4: MASKS ---------- */
{part:3,src:'Chapter 9 · Masking Your Own Talent',run(L){
  L.h(L.kick('learn','Masks of talent')+'<h1 class="q">Three conditions that hide what people can really do</h1>'+
   L.prose('Old camera lenses were coated to blur actors’ wrinkles. Some emotions do the same to talent: people see you through a haze. The authors name three '+L.g('masks','masks')+' that most undermine responsibility.')+
   L.tiers([['alert','Fear','Puts you on the defensive. It may feel safe, but you don’t gain ground.'],
            ['scale','Guilt','Lingers and enslaves when you let it fester, or let others use it on you.'],
            ['leaf','Depression (low feelings)','Feeling despondent, lost, unaccepted. Not clinical depression, which is for professionals.']])+
   L.prose('Fear comes in three kinds: <b>legitimate</b> (a tornado on the way), <b>exaggerated</b> (layoffs with no sign of them) and <b>false</b> (being rejected by a prospect, mocked during a speech).'));
  L.done();}},
{part:3,src:'Chapter 9 · Fear',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">Mireille is asked to give the keynote at the food-bank gala</h1>');
  L.beats(L.card,[
   ['The fear','Mireille wants to say no. “What if they laugh at me up there?”'],
   ['What kind?','Rowan asks: is it legitimate, exaggerated or false? Nobody in that room wants a speaker to fail.'],
   ['The book’s point','People at events want to go home saying the speaker was great. Audiences aren’t out to hurt anyone.'],
   ['The real cause','Mireille admits it’s about pride: being seen to stumble. Most fears, the authors say, protect the ego from bruises.'],
   ['The move','Mireille accepts, rehearses twice in front of the Table, and treats any critique as something to keep or discard.']],
   'Most fears are inventions to protect ourselves. Mastering responsibility means seeing that, most of the time, there is nothing to fear.');}},
{part:3,src:'Chapter 9 · Fear',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Kofi fears that a big clinic group will turn down a meeting request. What kind of fear is it?</h1>');
  L.mc(L.card,['A legitimate fear','A false fear'],1,
   'Rejection by a prospect is the book’s own example of a false fear. Kofi can learn from a no instead of fearing it.',
   'Legitimate fears are things like a tornado or a weapon. Fear of rejection by a prospect is the book’s example of a false fear.');}},
{part:3,src:'Chapter 9 · Guilt',run(L){
  L.h(L.kick('learn','Guilt')+'<h1 class="q">Deal with guilt in four steps, then let it go</h1>'+
   L.flow([['check','Accept','Own the offense.','',1],['chat','Apologize','If appropriate and possible.','',2],['bulb','Learn','Plan how to prevent it.','',3]])+
   L.prose('Then the fourth step: <b>move on</b>. Guilt left to fester enslaves you. An apology should be sincere, knowing it can’t undo what happened; the learning should last.')+
   L.note('Watch for guilt used as a <b>weapon</b>: “Do you want to be the only one who stops us reaching 100 percent?” Deserved guilt is legitimate; guilt as a weapon never is.','alert'));
  L.done();}},
{part:3,src:'Chapter 9 · Guilt',pts:1,run(L){
  L.h(L.kick('pr','Put it in order')+'<h1 class="q">Dana lost their temper with cousin Jules in front of the sales team. Put Dana’s way out of guilt in order.</h1>');
  L.order(L.card,['Dana admits it was wrong to blow up in public','Dana apologizes to Jules, sincerely','Dana resolves to raise problems with Jules in private','Dana stops replaying it and gets back to work'],
   'Accept, apologize, learn and prevent, move on. The book even gives this example: don’t lose your temper in a meeting; talk to the person later in private.',
   ['Accept','Apologize','Learn','Move on']);}},
{part:3,src:'Chapter 9 · Depression',run(L){
  L.h(L.kick('learn','Low times')+'<h1 class="q">When someone feels low, be a good listener</h1>'+
   L.prose('Everyone feels despondent, lost or unsuccessful at times. The authors’ way out: acknowledge it and <b>talk it out</b>, with good listeners or people who have been through the same. Alone, it is hard and takes much longer.')+
   L.lanes([['eye','What you may see','Low energy, lateness, lack of interest.',3],
            ['chat','What you can do','Name the behavior you see, ask how you can help, and share your own experience.',2]])+
   L.note('Advisors are <b>not therapists</b>. If the low feelings persist, or there may be signs of clinical depression, help the person find a professional.','shield'));
  L.done();}},
{part:3,src:'Chapter 9 · Depression',pts:1,run(L){
  L.h(L.kick('pr','What should Rowan do?')+'<h1 class="q">After two café closures, Mireille has been late to the last two sessions and seems flat. What should Rowan do first?</h1>');
  L.mc(L.card,['Let it pass; it’s personal, not business','Say what Rowan has noticed and ask how to help','Give Mireille a reading list on resilience'],1,
   'Confront the observed behavior kindly and offer help, sharing experience where it fits. If it persists, suggest a professional.',
   'Trusted advisors look at the whole person: we don’t live a business life and a personal life, just a life. Start by naming what Rowan sees and asking how to help.');}},
{part:3,src:'Chapter 9 · Masking Your Own Talent',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which mask?',['Fear','Guilt','Low feelings'],[
   ['Dana won’t present the new hull design to the board, “in case they pick it apart.”',0,'A false fear of critique, which you can accept or reject.'],
   ['Kofi still apologizes, months later, to staff who left after the customer loss.',1,'Guilt left to fester. Accept, apologize once, learn, move on.'],
   ['A Table member says, “Will you be the only one not to sign up for the charity run?”',1,'That’s guilt used as a weapon. It’s never legitimate.'],
   ['Rowan has felt flat and unsuccessful for weeks and keeps it to themselves.',2,'Talk it out: Sunny and the advisor peer group are good listeners.'],
   ['Mireille won’t open a café in a new town in case nobody comes.',0,'Fear of the unknown keeps you defensive, so you don’t gain ground.']]);}}
  ]
});
</script>
</body>
</html>
