<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proactive Health Mastery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0006', title:'Proactive health mastery', minutes:19, icon:'leaf',
  goals:['Put health first, for yourself and then your clients, with prevention over cure','Use the stress and productivity curve to place a client and their team','Separate opinion from fact, and know when to refer someone to a professional'],
  parts:['Priority one','Stress curve','Mental health','Emotion and intellect'],
  read:'Read chapter 6 of the book for the full case stories, including the bank executive and the personal trainer.',
  glossary:{
    eustress:'Eustress: the healthy kind of stress that pushes you to meet deadlines and give more than expected; the opposite of distress.',
    'my-pride':'“My pride”: the middle of the stress curve, where there is enough pressure to perform well but not so much that people freeze.',
    entitlement:'Entitlement (“my right”): the low-stress end of the curve, where people feel the organization is lucky to have them and nobody is held to account.',
    'observed-behavior':'Observed behavior: what people can agree they have actually seen or heard someone do or say.',
    'empirical-evidence':'Empirical evidence: facts that all reasonable people would accept as true, like “sales are down in one region.”'
  },
  cheatsheet:[
    '<b>Health is priority one</b>: yours first, then your clients’. Lead by example.',
    '<b>Prevention beats cure.</b> Book regular checkups before something goes wrong.',
    'Stress <b>masks talent</b>. Productivity peaks in the <b>middle</b> (“my pride”), not at low or extreme stress.',
    'Ask clients where they and their people sit on the curve, and <b>ask for evidence</b>.',
    'Learn the <b>warning signs of depression</b>. You can’t coach someone out of it: refer them to a professional.',
    'Emotional health: self-care, meaning, self-awareness, acceptance, resilience, humility, coping.',
    'Intellectual health: <b>separate opinion from fact</b>, using empirical evidence and observed behavior.',
    '<b>Validate opinions</b> before you treat them as facts.'
  ],
  steps:[
/* ---------- PART 1: PRIORITY ONE ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Mireille has skipped two yearly checkups. “I’ll see a doctor if something goes wrong,” they say. Is that a good plan?</h1>');
  L.mc(L.card,['Probably fine, if they feel healthy','No, it’s better to catch problems early'],1,
   'Right. Waiting for something to go wrong means relying on a cure. This chapter argues for prevention.',
   'Feeling fine doesn’t mean nothing is wrong. Waiting until something breaks means relying on a cure. The authors argue for prevention, as this lesson shows.');}},
{part:0,src:'Chapter 6 · Priority Number One',run(L){
  L.h(L.kick('learn','Priority number one')+'<h1 class="q">Health comes first, yours and then your clients’</h1>'+
   L.prose('The authors put it bluntly: your health must be your <b>first priority</b>, and your clients’ too. You lead by example, even remotely. An advisor who preaches self-control while plainly neglecting their own health isn’t credible.')+
   L.prose('Illness and accidents often can’t be avoided. What matters is what you do about them, and above all <b>prevention, not treatment</b>.')+
   L.flow([['flame','Stress','','',4],['alert','Illness','','',3],['cal','Absence','','',2],['trend','Cost','','',1]])+
   '<p class="small" style="margin-top:10px">The authors’ chain: stress is the top cause of illness, illness the top cause of absence, and absence the biggest staff cost after pay and benefits.</p>');
  L.done();}},
{part:0,src:'Chapter 6 · Priority Number One',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">The client who agreed, but never acted</h1>');
  L.beats(L.card,[
   ['The client','Phil, an entrepreneur in his early 50s, was the only one bringing in business and spent about 70% of his time on the road. He was overweight and a heavy smoker.'],
   ['The plan','His coach was helping him change his business model and improve his health and lifestyle.'],
   ['The gap','Phil agreed with the plan in his head, but couldn’t bring himself to make the move. Logic made him think; it didn’t make him act.'],
   ['The ending','Phil missed a scheduled call. Soon after, his wife wrote that he had died of a heart attack while travelling.']],
   'Agreeing that health matters isn’t enough. It has to come first in what you actually <b>do</b>.');}},
{part:0,src:'Chapter 6 · Priority Number One',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Rowan works about 70-hour weeks and wants to help Mireille look after their health. What should Rowan do first?</h1>');
  L.mc(L.card,['Get their own health and checkups in order','Send Mireille articles on the cost of stress'],0,
   'You go first. Leading by example is what makes Rowan credible on health.',
   'Articles may help later, but the authors say you lead by example. If Rowan is visibly run down, the advice won’t land. Rowan goes first.');}},
{part:0,src:'Chapter 6 · Priority Number One',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Prevention or cure?',['Prevention','Cure'],[
   ['Dana books a yearly physical before any symptoms show up.',0,'Checking before anything goes wrong is prevention.'],
   ['Copperline builds a staff gym but keeps piling on evening and weekend work.',1,'The gym treats stress the company keeps creating. The authors point to exactly this mismatch.'],
   ['Kofi starts sleeping properly only after collapsing at a conference.',1,'Change after the damage is treatment, not prevention.'],
   ['Rowan blocks two evenings a week with no client work, before burnout hits.',0,'Acting before the problem appears is prevention.']]);}},

/* ---------- PART 2: STRESS CURVE ---------- */
{part:1,src:'Chapter 6 · Priority Number One',run(L){
  L.h(L.kick('learn','Stress and productivity')+'<h1 class="q">Stress masks talent, but no stress isn’t the answer</h1>'+
   L.prose('Some people are proud of how much stress they can take. The authors say stress, like guilt or fear, <b>masks talent</b>: it stops people performing at their true potential. A sick leader, or a sick team, won’t hit their goals.')+
   L.tiers([['flame','Very high stress','Low productivity. People freeze in fear, hide problems and don’t act. Common where layoffs are frequent.'],
            ['star',L.g('my-pride','“My pride”')+' (the middle)','Peak productivity. Enough pressure to meet deadlines and give more than expected.','',true,'The goal'],
            ['leaf','Very low stress','Low productivity. An '+L.g('entitlement','entitlement')+' mindset, with almost no accountability.']])+
   L.prose('So the aim is to <b>manage</b> stress, not eliminate it. Helpful stress is '+L.g('eustress','eustress')+'; harmful stress is distress.'));
  L.done();}},
{part:1,src:'Chapter 6 · Figure 6.1 Stress and productivity',pts:1,
 solve:async L=>{L.$('#po').children[1].click();L.$('#go').click();},
 run(L){
  let p=null;const N=['Low stress','Moderate stress','Very high stress'],W=[28,92,22],C=['var(--h3)','var(--ok-strong)','var(--h2)'];
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">Mireille says they “thrive on stress.” Where does productivity actually peak?</h1><div id="po"></div>'+
   '<div id="cv" hidden><button class="btn pri" id="go" style="margin:8px 0">'+L.ic('play')+'Show the curve</button>'+
   N.map((n,j)=>'<div class="meterrow"><div class="lb">'+n+'</div><div class="meter"><div id="m'+j+'" style="width:0%;background:'+C[j]+';transition:width .8s"></div></div></div>').join('')+'</div>');
  N.forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=n;b.onclick=()=>{if(p!==null)return;p=j;b.classList.add('sel');L.$('#cv').hidden=false;};L.$('#po').appendChild(b);});
  L.$('#go').onclick=function(){this.remove();W.forEach((w,j)=>{L.$('#m'+j).style.width=w+'%';});
    L.award(p===1);
    L.sheet(p===1?'ok':'no',p===1?'You called it':'It peaks in the middle','Productivity is low at both ends: low stress breeds entitlement, very high stress breeds fear and freezing. The peak is the middle. Mireille may be proud of the stress they carry, but it is probably masking their talent.');L.done();};}},
{part:1,src:'Chapter 6 · Figure 6.1 Stress and productivity',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">After three rounds of layoffs, managers at a Tidewater firm stop reporting problems and avoid any decision. Where are they on the curve?</h1>');
  L.mc(L.card,['Low stress, entitled','Very high stress, frozen','In the healthy middle'],1,
   'Fear has frozen them. The authors note this is common where layoffs are frequent.',
   'Entitled people take what they can and aren’t accountable. These managers are frozen by fear, hiding problems: the very-high-stress end.');}},
{part:1,src:'Chapter 6 · Figure 6.1 Stress and productivity',run(L){
  L.h(L.kick('ex','Using the curve with a client')+'<h1 class="q">Rowan places Mireille, then Mireille’s team</h1>');
  L.beats(L.card,[
   ['Rowan first','Before the session, Rowan asks themselves the same question and checks with Sunny. The authors say to make sure you’re solidly in the middle yourself first.'],
   ['Ask Mireille','“Where are you on this curve?” Mireille says: the middle, of course.'],
   ['Ask for evidence','“Do you enjoy working against a deadline?” Mireille admits deadlines now make them dread the week, and they sleep badly before events.'],
   ['Then the team','“Where are your people? What’s your evidence?” Rowan asks whether staff feel safe taking prudent risks and suggesting ideas.'],
   ['What emerges','At two cafés, rumored closures have staff anxious and silent: the fear end. Mireille sees they need to address it openly.']],
   'Ask where they are, then ask for <b>evidence</b>. Do the same for their people. And check yourself first.');}},
{part:1,src:'Chapter 6 · Figure 6.1 Stress and productivity',pts:6,run(L){
  L.h(L.kick('pr','Place them on the curve')+'<h1 class="q">Signs from around the Tidewater Table. Where does each belong?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Low stress','Healthy middle','Very high stress'],[
   ['A Whitlock foreman takes supplies home and shrugs at quality complaints',0,'Taking what isn’t nailed down and ignoring quality: the entitlement end.'],
   ['Lumen Loop engineers push to beat a deadline and enjoy the challenge',1,'Enough pressure to perform, without fear: eustress.'],
   ['Café staff hide a broken oven because they fear being blamed for it',2,'Hiding problems out of fear: the very-high-stress end.'],
   ['A Copperline manager volunteers a risky new idea at a staff meeting',1,'Feeling safe to take prudent risks is a sign of the healthy middle.'],
   ['A long-serving Whitlock clerk says the firm is lucky they turn up at all',0,'“The organization is lucky to have me”: the entitlement mindset.'],
   ['After rumors of layoffs, a team stops making any decisions',2,'Paralyzed by fear, afraid to move.']],
   'Both ends are low productivity. The aim isn’t zero stress, but the right amount.');}},

/* ---------- PART 3: MENTAL HEALTH ---------- */
{part:2,src:'Chapter 6 · Priority Number One',run(L){
  L.h(L.kick('learn','Mental health')+'<h1 class="q">Know the warning signs, and refer</h1>'+
   L.prose('People happily sign a friend’s cast, the authors note, but tend to back away when the problem is mental rather than physical. Advisors shouldn’t.')+
   L.prose('Advisors are <b>not clinicians</b>. But they can learn to recognize the markers of depression, such as these from the American Psychiatric Association’s list:')+
   L.list([['eye','Mood and interest','Persistent sadness; losing interest in things once enjoyed.'],
           ['clock','Body and energy','Sleep or appetite changes; low energy; restlessness or slowed movement.'],
           ['pencil','Thinking','Feeling worthless or guilty; trouble concentrating or deciding.']],1)+
   L.note('You can’t coach someone out of depression, and coaching that carries on regardless won’t help. Notice the signs, then gently suggest a professional.','shield'));
  L.done();}},
{part:2,src:'Chapter 6 · Priority Number One',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">The star executive who seemed to have lost his touch</h1>');
  L.beats(L.card,[
   ['The worry','Dan, a top bank executive in his 60s, had a rough year: an unclear team and a very costly error. Colleagues feared he was simply too old now.'],
   ['The meeting','An advisor was asked to find out what was going on. Over a breakfast away from the office, Dan seemed flat and low on energy.'],
   ['The signs','Gentle questions revealed months of bad nights, and that he’d given away his tennis gear, a sport he once loved.'],
   ['The step','The advisor told Dan this looked like an illness, not a loss of talent, and asked if he’d be open to seeing someone. Dan saw a psychologist through the company’s employee assistance program.'],
   ['The result','He was treated, and the next year was his best ever at work.']],
   'The advisor didn’t diagnose or treat. They noticed the signs and helped Dan get professional help.');}},
{part:2,src:'Chapter 6 · Priority Number One',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">For months Kofi has slept badly, dropped the sailing they loved and keeps saying they’re worthless. What should Rowan do?</h1>');
  L.mc(L.card,['Gently suggest Kofi talk to a professional','Add weekly coaching to lift Kofi’s mindset','Wait until Kofi raises it themselves'],0,
   'These match several markers of depression. Rowan isn’t a clinician, so the right step is to gently point Kofi toward professional help.',
   'Coaching can’t lift someone out of depression, and waiting may let it drag on. These are several warning signs together, so Rowan gently suggests a professional.');}},
{part:2,src:'Chapter 6 · Priority Number One',run(L){
  L.h(L.kick('learn','Everyday mental health')+'<h1 class="q">How you start the morning colors the day</h1>'+
   L.prose('Mental health isn’t only about serious illness. It’s also about staying positive, involved and composed. The authors think people wake up in one of two moods:')+
   L.lanes([['alert','A long march','Bills, calls I’d rather avoid, people who’ll say no. Another slow day.',3],
            ['star','A great day','Full of opportunity. Who will I get to help today?',2]])+
   L.prose('Recall the habit from lesson 1: each morning, take 60 seconds to name <b>three things</b> you’ll accomplish today; each evening, review three you did. The way you talk to yourself shapes your behavior. Clients often lean pessimistic because the buck stops with them, so help them build this too.'));
  L.done();}},
{part:2,src:'Chapter 6 · Priority Number One',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Advisor’s job, or time to refer?',['Rowan can help','Suggest a professional'],[
   ['Dana starts each day dreading the to-do list and wants a better routine.',0,'Everyday mindset: the morning and evening three-things habit fits.'],
   ['For months a Table member has lost interest in everything, sleeps poorly and can’t make decisions.',1,'Several markers of depression together. Gently point them to a professional.'],
   ['Mireille is pessimistic after a weak sales month.',0,'A normal low. Positive self-talk and perspective are within Rowan’s role.'],
   ['Kofi often says they feel guilty and worthless, and seems slowed down.',1,'These are listed markers of depression. Refer, don’t coach.'],
   ['Rowan notices they’re snapping at clients after late nights.',0,'Rowan can fix their own rest first: going first on health.']]);}},

/* ---------- PART 4: EMOTION AND INTELLECT ---------- */
{part:3,src:'Chapter 6 · Emotional Health',run(L){
  L.h(L.kick('learn','Emotional health')+'<h1 class="q">How you handle challenge and change</h1>'+
   L.prose('Emotional health is how well you adapt and react to wins and defeats, celebration and trauma. It means a <b>proportionate, rational</b> reaction. What counts isn’t what happens to you, but what you choose to do about it. Tap each trait the authors list.'));
  L.flips(L.card,[
   ['Self-accommodation','Being in tune with your body and caring for yourself.'],
   ['Meaning','Knowing why you’re here and how you can serve others.'],
   ['Self-awareness','Noticing the people and setting around you, not being self-absorbed.'],
   ['Acceptance','Accepting who you are, without judging yourself by other people’s yardsticks.'],
   ['Resilience','Knowing setbacks will come, and having the agility to recover and thrive.'],
   ['Humility','Treating others with kindness and respect, without demanding anything back.'],
   ['Coping','Having tools and reserves of strength ready for the expected and the unexpected.']],
   'These traits help you handle stress and get back to the top of the curve. Ask clients, and yourself, how you measure up on each.');}},
{part:3,src:'Chapter 6 · Emotional Health',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Dana keeps measuring Whitlock against a rival yard’s revenue and feels like a failure. Which trait would help most?</h1>');
  L.mc(L.card,['Coping','Meaning','Acceptance'],2,
   'Acceptance means not using other people’s metrics to judge your own success.',
   'That trait helps, but Dana’s problem is judging themselves by someone else’s yardstick. Acceptance is about not using other people’s metrics.');}},
{part:3,src:'Chapter 6 · Intellectual Health',run(L){
  L.h(L.kick('learn','Intellectual health')+'<h1 class="q">Opinion is not fact</h1>'+
   L.prose('Intellectual health is the ability to reason objectively. For advisors and the leaders they advise, the key skill is telling <b>opinion</b> from <b>fact</b>. We mix them up when we don’t check what we’re told, believe what we’d prefer over what we see, give in to peer pressure, or rely on people with an agenda.')+
   L.lanes([['scale',L.g('empirical-evidence','Empirical evidence'),'Facts all reasonable people would accept: calls go unanswered, sales are down in one region.',2],
            ['eye',L.g('observed-behavior','Observed behavior'),'What we agree we’ve seen or heard: the sales manager is always late to the weekly meeting.',1]])+
   L.prose('Have an opinion? Fine. Then <b>validate it</b> with evidence so it can become a fact.'));
  L.done();}},
{part:3,src:'Chapter 6 · Intellectual Health',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">“Rick is just Rick”</h1>');
  L.beats(L.card,[
   ['The problem','Rick, a senior executive and son of the late owner, abused staff in the hallways. Three coaches had already failed with him, and he refused a fourth.'],
   ['The opinion','The president felt Rick’s strong results outweighed some “random complaints.”'],
   ['The facts','The advisor reported what everyone they spoke to said: they blamed the <b>president</b>, assuming Rick acted with his blessing.'],
   ['The choice','The president could stop it by removing Rick, or keep tolerating it and be blamed for it. Rick was let go the next day.']],
   'Facts and observed behavior moved the president where opinions hadn’t.');}},
{part:3,src:'Chapter 6 · Intellectual Health',pts:6,run(L){
  L.h(L.kick('pr','Opinion or fact?')+'<h1 class="q">Dana is preparing for the overdue talk with cousin Jules. Sort Dana’s notes.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Opinion','Fact'],[
   ['Jules missed the sales target in each of the last three quarters',1,'Anyone can check it: empirical evidence.'],
   ['Jules just doesn’t care about the business anymore',0,'A guess about Jules’s inner state. It needs validating.'],
   ['Jules arrived late to four of the last six sales meetings',1,'Observed behavior that others saw too.'],
   ['The family board thinks Jules is untouchable',0,'Dana hasn’t checked this. It may be true, but it’s still an opinion.'],
   ['Two dealers emailed to say Jules never returned their calls',1,'Written communication counts as observed behavior.'],
   ['Jules would do better in a different role',0,'Possibly right, but still a judgment until tested.']],
   'Lead the conversation with facts. Treat the opinions as things to check, not things to announce.');}},
{part:3,src:'Chapter 6 · Intellectual Health',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Tap each piece until Dana opens the talk with Jules in an intellectually healthy way.</h1>');
  L.sentence(L.card,[['Everyone knows','I’ve noticed'],['you’ve stopped caring,','you missed target three quarters running,'],['so you need to change.','so I’d like to understand what’s behind it.']],[1,1,1],
   [['“Everyone knows” presents an unchecked opinion as fact.'],['That’s an opinion about Jules’s feelings, not something anyone saw.'],['That jumps to a verdict. Dana should validate before deciding.']],
   'It starts from observed facts and invites Jules to help explain them, so any opinion can be validated.');}},
{part:3,src:'Chapter 6 · Chapter Return on Investment',pts:1,run(L){
  L.h(L.kick('pr','Rowan’s move')+'<h1 class="q">Kofi says: “The team has lost faith in me since we lost the big customer.” What should Rowan ask next?</h1>');
  L.mc(L.card,['“How long have you felt they doubt you?”','“Who on the team do you trust most now?”','“What have you seen them do that tells you that?”'],2,
   'It asks for observed behavior, so Kofi can test whether the opinion is a fact.',
   'That keeps the conversation on Kofi’s opinion. Rowan should ask for observed behavior, so the belief can be validated or dropped.');}}
  ]
});
</script>
</body>
</html>
