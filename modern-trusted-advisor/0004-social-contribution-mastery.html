<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Social Contribution Mastery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0004', title:'Social contribution mastery', minutes:19, icon:'leaf',
  goals:['Explain why doing good supports a business instead of competing with it','Place a person on the watertight doors and spot scarcity versus abundance','Name the four kinds of influence inside an organization'],
  parts:['Do good','Good citizen','Watertight doors','Influence'],
  read:'Read chapter 4 of the book for the Merck stories, the good-citizen chart and the watertight doors in full.',
  glossary:{
    'b-company':'B (beneficial) company: a firm certified for how it treats employees, supports charities, commits to diversity and contributes to its community.',
    sentient:'Sentient Strategy: the authors’ one-year strategy approach, built in a single day, focused on your impact on the environment and your awareness of that impact.',
    doors:'Watertight doors: the four stages survive, alive, arrive and thrive. You “seal” each door behind you so you don’t slide back.',
    referent:'Referent influence: people follow you because they trust you and believe in you, whatever your title, rewards or expertise.'
  },
  cheatsheet:[
    '<b>Do good, and good will follow.</b> Doing the right thing as often as you can supports the bottom line.',
    'Suggest clients become a <b>B (beneficial) company</b>; <b>Sentient Strategy</b> weighs impact on the environment and awareness of it.',
    '<b>Time is a priority, not a resource.</b> “I don’t have time” means “I chose something else.” Help clients reallocate.',
    'Giving is <b>more than money</b>: time, information, expertise, resources, introductions, referrals.',
    'Rate <b>good citizenship</b> on the spider chart: 0 at the center, 10 at the rim. Aim for well-rounded.',
    '<b>Watertight doors</b>: survive, alive, arrive, thrive. Seal each one by changing yourself, and move from scarcity to abundance.',
    'Four kinds of <b>influence</b>: hierarchical, reward and punishment, expertise, referent.',
    '<b>Alignment</b>: does it fit your calling, can you really help? And you go first.'
  ],
  steps:[
/* ---------- PART 1: DO GOOD ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Mireille wants Copperline to partner with a local food bank. A board member worries it will distract from the business. What’s your hunch?</h1>');
  L.mc(L.card,['It will mostly pull effort from the cafés','It can strengthen the business too'],1,
   'The authors agree: doing good and doing well support each other. This lesson shows why, and how an advisor helps clients give back.',
   'The authors see it the other way: community work supports the business and the people in it. This lesson shows why.');}},
{part:0,src:'Chapter 4 · The Beneficial Organization',run(L){
  L.h(L.kick('learn','The beneficial organization')+'<h1 class="q">Do the right thing as often as you can</h1>'+
   L.prose('One of the authors consulted for the drug company Merck for 12 years. Its founder’s motto ran through the annual reports and through people’s hearts:')+
   L.quote('Do good, and good will follow.','George Merck, as told in chapter 4')+
   L.prose('The idea: do the right thing as often as you can, and the bottom line will do fine. People joined Merck for its purpose, not to get rich.')+
   L.note('Today many firms seek certification as a '+L.g('b-company','B (beneficial) company')+', to show business can be a force for good. Nancy MacKay’s own CEO-forum company was certified in 2018. An advisor can suggest this to clients and help them get there.','leaf'));
  L.done();}},
{part:0,src:'Chapter 4 · The Beneficial Organization',run(L){
  L.h(L.kick('ex','Two Merck stories from the book')+'<h1 class="q">Good work that the people inside never heard about</h1>');
  L.beats(L.card,[
   ['An accident','A Merck drug failed its trials, but turned out to cure African river blindness, then a major killer. Nobody there could afford it, so Merck gave it away to anyone who needed it.'],
   ['At the vet','Paying a bill, the author mentioned Merck was a client. The vet said Merck had done more for animal health than any company in history.'],
   ['On stage','Two weeks later, the author told that story to Merck’s animal health division. The room went dead quiet.'],
   ['Why the silence','A vice president explained: staff mostly hear about late deliveries and errors, never about the good they do.'],
   ['The advice','Then bring vets on stage, or send your people to their offices, the author suggested.']],
   'Doing good also lifts the people inside a company, but only if they get to see it.');}},
{part:0,src:'Chapter 4 · The Beneficial Organization',run(L){
  L.h(L.kick('learn','Sentient Strategy')+'<h1 class="q">A strategy that counts your impact</h1>'+
   L.prose('Alan Weiss designed '+L.g('sentient','Sentient Strategy')+': it looks no more than a year ahead and owners can build it in a single day. It rests on two factors:')+
   L.flow([['leaf','Impact','on the environment around you','',2],['eye','Awareness','of the impact of your decisions and actions','',3]],false)+
   L.prose('It is meant to reward social contribution. To be an example for clients, the authors ask whether you are:')+
   L.list([['shield','Taking a stand','on causes that matter'],['alert','Confronting','inappropriate behavior, harassment and bias'],['people','Giving freely','coaching, mentoring and sharing without pay']],2));
  L.done();}},
{part:0,src:'Chapter 4 · The Beneficial Organization',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Dana sketches a one-year plan for Whitlock Boatworks using Sentient Strategy. Which two questions should it center on?</h1>');
  L.mc(L.card,['How fast can we grow, and who can we beat?','What do we cut, and how much can we save?','What is our impact, and are we aware of it?'],2,
   'Sentient Strategy rests on impact on the environment and awareness of the impact of your decisions and actions.',
   'Sentient Strategy rests on two factors: your impact on the environment, and your awareness of the impact of your decisions and actions.');}},
{part:0,src:'Chapter 4 · Case Study Vignette (Dennis)',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">The CEO who “had no time”</h1>');
  L.beats(L.card,[
   ['The claim','A CEO, Dennis, said he had no time to chair a local charity campaign, see his daughter’s recital and run his company 60 hours a week in the busy season.'],
   ['His logic','His job paid for his donations and his daughter’s school, so work had to come first.'],
   ['The reframe','The advisor pointed out that time is not a resource but a <b>priority</b>. Dennis has the same hours as anyone; he chooses where they go.'],
   ['The ask','The recital is one night. Delegate at work: the issues will still be there tomorrow.']],
   'Throwing money at a problem is a cop-out. Showing up, chairing, attending, often has far more impact, and you can give money too.');}},
{part:0,src:'Chapter 4 · The Beneficial Organization',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Real contribution or cop-out?',['Real contribution','Cop-out'],[
   ['Dana sends a check to the sailing club for kids and skips every event, saying “I’m too busy.”',1,'Money alone, with “no time” as the excuse. Showing up would have more impact.'],
   ['Kofi joins a clinic charity’s board to share what they know about software.',0,'On nonprofit boards you can share your expertise. That’s giving more than money.'],
   ['Mireille calls racism from a customer out in front of staff, then backs the barista.',0,'Confronting inappropriate behavior and bias is on the authors’ list.'],
   ['A Table member says, “My taxes fund the schools, so I don’t need to get involved.”',1,'Like Dennis, they’re using money to excuse not giving time.']]);}},

/* ---------- PART 2: GOOD CITIZEN ---------- */
{part:1,src:'Chapter 4 · The Social/Business Nexus',run(L){
  L.h(L.kick('learn','The social/business nexus')+'<h1 class="q">There is no line between business and community</h1>'+
   L.prose('Advisors and clients belong to several communities at once:')+
   L.lanes([['home','Where you live','Obey the laws, back civic efforts, sponsor a youth team, join the chamber of commerce, support local arts.',2],
            ['book','Your profession','Attend events, mentor, write for publications, sit on panels and boards, share best practices.',3]])+
   L.prose('These efforts are not <i>competing</i> with work time. The authors say they are <b>supportive</b>: they make us more well-rounded and productive.')+
   '<p class="small">To check yourself, the book offers a “good citizen” spider chart: eight axes, each scored from 0 at the center to 10 at the rim.</p>');
  L.done();}},
{part:1,src:'Chapter 4 · The Social/Business Nexus',pts:1,
 solve:async L=>{const g=L.$('#sp').children;g[0].click();g[1].click();},
 run(L){
  const AX=['Volunteer','Fundraising','Local arts','Prof. groups','Mentor','Candidates','Best practice','Local news'];
  const P=[['Dana',[1,2,1,5,1,0,2,2]],['Mireille',[6,7,5,4,3,2,3,8]]];const seen=new Set();
  const pt=(v,j,r)=>{const a=(-90+j*45)*Math.PI/180;return [(Math.cos(a)*r*v/10).toFixed(1),(Math.sin(a)*r*v/10).toFixed(1)];};
  const draw=vals=>{const R=78;let s='<svg viewBox="-178 -112 356 224" style="width:100%;max-width:330px;display:block;margin:0 auto" role="img" aria-label="Good citizen spider chart">';
    [5,10].forEach(k=>{s+='<polygon points="'+AX.map((_,j)=>pt(k,j,R).join(',')).join(' ')+'" fill="none" stroke="var(--line)" />';});
    AX.forEach((a,j)=>{const e=pt(10,j,R),t=pt(10,j,R+14);s+='<line x1="0" y1="0" x2="'+e[0]+'" y2="'+e[1]+'" stroke="var(--line)" />';
      const anc=Math.abs(t[0])<5?'middle':(t[0]>0?'start':'end');s+='<text x="'+t[0]+'" y="'+(+t[1]+4)+'" text-anchor="'+anc+'" font-size="11" fill="var(--muted)">'+a+'</text>';});
    if(vals)s+='<polygon points="'+vals.map((v,j)=>pt(v,j,R).join(',')).join(' ')+'" fill="var(--h2)" fill-opacity=".25" stroke="var(--h2)" stroke-width="2" />';
    return s+'</svg>';};
  L.h(L.kick('pr','Toggle and compare')+'<h1 class="q">Rowan helps two members rate their good citizenship. Look at both charts.</h1><div id="sp"></div>'+
   '<div style="background:var(--soft);border-radius:16px;padding:10px;margin:8px 0 6px"><div id="ch">'+draw(null)+'</div><div class="small" id="cn" style="text-align:center">Choose a member above.</div></div><div id="sq"></div>');
  P.forEach((p,j)=>{const b=document.createElement('button');b.className='chip';b.innerHTML=L.ic('person')+p[0];b.onclick=()=>{[...L.$('#sp').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(j);
    L.$('#ch').innerHTML=draw(p[1]);L.$('#cn').innerHTML=j?'Mireille: spread out, strongest on local news and fundraising.':'Dana: near the center on almost every axis.';
    if(seen.size===2&&!L.$('#sq').innerHTML){const q=L.$('#sq');q.innerHTML='<h2 class="sub">Dana says, “With 75-hour weeks, I don’t have time for any of this.” What should Rowan do?</h2>';
      L.mc(q,['Agree that Dana’s workload rules it out','Help Dana reallocate time to a few axes'],1,
       'Dana has the time; they choose where it goes. The authors want clients steered toward a more well-rounded chart, starting with a few axes.',
       'The book says “I don’t have the time” is rarely true. Dana chooses where the hours go, and Rowan’s job is to help reallocate them.');}};L.$('#sp').appendChild(b);});}},
{part:1,src:'Chapter 4 · The Social/Business Nexus',run(L){
  L.h(L.kick('ex','A question from the book')+'<h1 class="q">What would you do with an unexpected windfall?</h1>');
  L.beats(L.card,[
   ['The question','One of the authors asked a group of business owners what they’d do with a $600,000 windfall, free and clear.'],
   ['The answers','None would spend it all. Some would reinvest and take a holiday. Some would give part to good causes.'],
   ['The surprise','One woman, in the best year of her life and more successful than she’d ever dreamed, shouted that she wouldn’t touch a penny of it.'],
   ['The pattern','The authors call this the <b>scarcity mentality</b>. Leaders worry so much about having enough that “enough” is never enough, and “I don’t have time” is part of the same habit.']],
   'Success doesn’t cure scarcity by itself. It is a mindset, and an advisor has to help the client see it.');}},
{part:1,src:'Chapter 4 · The Social/Business Nexus',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Kofi tells Rowan: “I can’t mentor at the clinic charity. I just don’t have the time.” According to the book, what’s really going on?</h1>');
  L.mc(L.card,['Kofi has the time but is choosing other uses','Kofi has truly run out of hours this year'],0,
   'Time is a priority, not a resource. Kofi has the same hours as anyone; Rowan can help reallocate some of them.',
   'The authors say “I don’t have time” is almost never literally true. Kofi has the hours and chooses where they go.');}},

/* ---------- PART 3: WATERTIGHT DOORS ---------- */
{part:2,src:'Chapter 4 · The Watertight Doors',run(L){
  L.h(L.kick('learn','Change on purpose')+'<h1 class="q">Your life is a movie, not a snapshot</h1>'+
   L.prose('We tend to think tomorrow will be like today. It never is. The authors say change has to be conscious and deliberate: beliefs that served you years ago may no longer fit.')+
   L.prose('At school reunions, one author noticed a few classmates had grown a lot, but <b>most hadn’t changed at all</b>: same biases, just greyer hair.')+
   L.note('<b>To help others change, you have to change yourself.</b> That is the base of social contribution mastery.','cycle'));
  L.done();}},
{part:2,src:'Chapter 4 · The Watertight Doors',run(L){
  L.h(L.kick('learn','The watertight doors')+'<h1 class="q">Four stages, and a door you seal behind each one</h1>'+
   L.tiers([['alert','Survive','New to a business or role. You take any client or assignment to put bread on the table.','Not choosy at all'],
            ['clock','Alive','You can sustain yourself, with little in reserve. Very flexible and hardworking.','Some security and credibility'],
            ['target','Arrive','A growing business. You choose your clients and your brand strengthens.','Selective'],
            ['star','Thrive','Clients come to you and ask, “How can we work together?” You may own your niche.','Time to give',true,'Abundance']])+
   '<p class="small" style="margin-top:10px">Moving through the '+L.g('doors','doors')+' should also move you from a scarcity mindset to abundance. You seal each door so you don’t slide back.</p>');
  L.done();}},
{part:2,src:'Chapter 4 · The Watertight Doors',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Put the watertight doors in order, from first to last.</h1>');
  L.order(L.card,['Survive','Alive','Arrive','Thrive'],
   'Survive, alive, arrive, thrive: from taking any work, to holding your own, to choosing clients, to clients coming to you.');}},
{part:2,src:'Chapter 4 · The Watertight Doors',pts:5,run(L){
  L.h(L.kick('pr','Which door?')+'<h1 class="q">Place each moment on the watertight doors.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Survive','Alive','Arrive','Thrive'],[
   ['Rowan’s first year independent: any project that pays the rent',0,'Taking any work to put bread on the table is survive.'],
   ['Year two: steady retainers, little in reserve, working most weekends',1,'Holding your own but stretched thin is alive.'],
   ['Rowan now turns down clients who aren’t a good fit',2,'Choosing your clients is the mark of arrive.'],
   ['A CEO calls and asks Rowan, “How can we work together?”',3,'Clients coming to you is thrive.'],
   ['A new Copperline café manager takes every shift and task offered',0,'New in a role, taking any assignment: that’s survive.']],
   'The doors apply to firms and to people in roles. The further right, the more time and room there is to give.');}},
{part:2,src:'Chapter 4 · The Watertight Doors',run(L){
  L.h(L.kick('learn','Abundance is more than money')+'<h1 class="q">What you can share once you thrive</h1>'+
   L.prose('The move to abundance doesn’t happen for everyone. Some people look very successful yet share nothing, sue at the first hint of copying, and never admit a mistake.')+
   L.prose('An '+L.g('abundance','abundance mentality')+' isn’t about picking up the check. It is about giving:')+
   '<div style="display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px">'+['Information','Time','Expertise and coaching','Space, staff, supplies','Creativity','Introductions','Referrals and leads'].map(x=>'<span class="chip static ok">'+x+'</span>').join('')+'</div>'+
   L.note('Sealing the doors means <b>changing yourself</b>: your beliefs, friends, memberships, image, expectations, and how you invest time and money. Without that, you can’t get from scarcity to abundance.','lock'));
  L.done();}},
{part:2,src:'Chapter 4 · The Watertight Doors',pts:1,
 solve:async L=>{L.$('#pr').children[1].click();L.$('#go2').click();},
 run(L){
  let p=null;const D=['Survive','Alive','Arrive','Thrive'];
  const row=(id,cur)=>'<div id="'+id+'" style="display:flex;flex-wrap:wrap;gap:4px;margin:6px 0">'+D.map((d,j)=>'<span class="chip static'+(j===cur?' ok':'')+'" style="'+(j===cur?'':'opacity:.4')+'">'+(j===cur?L.ic('person'):'')+d+'</span>').join('')+'</div>';
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">Two founders sit at arrive. Kofi worked to seal the door; Lee, a Table guest, never did. Both lose their biggest customer. Where does Kofi’s mindset land?</h1><div id="pr"></div>'+
   '<div id="sim" hidden>'+L.lanes([['lock','Kofi · door sealed',row('ka',2)+'<div class="res" id="kt"></div>',2],['alert','Lee · door open',row('la',2)+'<div class="res" id="lt"></div>',4]])+
   '<button class="btn pri" id="go2" style="margin-top:12px">'+L.ic('play')+'The customer leaves</button></div>');
  ['Back at survive','Still at arrive'].forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=n;b.onclick=()=>{if(p!==null)return;p=j;b.classList.add('sel');L.$('#sim').hidden=false;};L.$('#pr').appendChild(b);});
  L.$('#go2').onclick=function(){this.remove();let s=0;
    const t=setInterval(()=>{s++;const la=L.$('#la');if(!la){clearInterval(t);return;}
      la.outerHTML=row('la',2-s);
      if(s>=2){clearInterval(t);
        L.$('#kt').innerHTML='<span style="color:var(--ok)">Revenue drops, but Kofi stays choosy and keeps sharing ideas at the Table.</span>';
        L.$('#lt').innerHTML='<span style="color:var(--no)">Lee grabs any client and stops sharing anything.</span>';
        L.award(p===1);L.sheet(p===1?'ok':'no',p===1?'You called it!':'Kofi’s mindset held','The money falls either way. What the sealed door protects is the mindset: Kofi doesn’t slide back into scarcity. That’s why the authors say to seal each door behind you.');L.done();}},700);};}},
{part:2,src:'Chapter 4 · The Watertight Doors',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Abundance or scarcity?',['Abundance','Scarcity'],[
   ['Dana introduces Kofi to a banker they trust.',0,'Making introductions is on the book’s list of abundant giving.'],
   ['A Table member won’t share their hiring checklist in case a rival copies it.',1,'Refusing to share anything is a hallmark of scarcity.'],
   ['Mireille lets a youth club use a café’s back room on Mondays.',0,'Providing space and resources counts, not just money.'],
   ['A member threatens to sue a rival over a similar menu name.',1,'Being quick to sue over presumed incursions is the scarcity pattern the book names.'],
   ['Rowan coaches a young nonprofit director for free each month.',0,'Giving time, expertise and coaching is abundance.']]);}},

/* ---------- PART 4: INFLUENCE ---------- */
{part:3,src:'Chapter 4 · Alignment',run(L){
  L.h(L.kick('learn','Four kinds of influence')+'<h1 class="q">Social mastery inside an organization</h1>'+
   L.prose('Social contribution also happens inside companies. The book names four ways people influence others:')+
   L.list([['shield','Hierarchical','Using your position to require change. Nobody holds a consensus meeting when the colonel gives an order.'],
           ['scale','Reward and punishment','Handing out or holding back incentives: good assignments, overtime, travel. Even someone junior in HR can do this.'],
           ['star','Expertise','People follow whoever they are sure knows the subject, like the top sales producer. Also called social proof.'],
           ['people','Referent','People follow someone they trust and believe in, whatever their title, rewards or expertise.']],4)+
   '<p class="small" style="margin-top:10px">The book says “charismatic” is too thin a label for '+L.g('referent','referent')+' influence: it is about trust and confidence.</p>');
  L.done();}},
{part:3,src:'Chapter 4 · Alignment',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">At Whitlock Boatworks, a foreman gives overtime only to crews that hit their targets. Which kind of influence is that?</h1>');
  L.mc(L.card,['Expertise','Reward and punishment','Referent'],1,
   'Handing out or withholding incentives like overtime is reward and punishment.',
   'Overtime is an incentive the foreman can give or hold back. That’s reward and punishment.');}},
{part:3,src:'Chapter 4 · Alignment',pts:5,run(L){
  L.h(L.kick('pr','Name the influence')+'<h1 class="q">Sort each moment by the kind of influence at work.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Hierarchical','Reward/punish','Expertise','Referent'],[
   ['Dana orders every crew to add a new safety check, starting Monday',0,'Dana uses their position as CEO to require it.'],
   ['Copperline’s HR coordinator decides who gets the popular weekend shifts',1,'Giving or holding back a wanted benefit is reward and punishment.'],
   ['New bakers copy the head baker, whose loaves always sell out',2,'They follow a proven track record: expertise, or social proof.'],
   ['Staff rally behind a shift lead with no title whom everyone trusts',3,'No position, no rewards: they follow because they trust them.'],
   ['Rookie salespeople at Whitlock ask the top seller how to close',2,'The top producer’s record makes them the go-to mentor.']],
   'An advisor has none of the first two over a client, which is why trust and expertise matter so much.');}},
{part:3,src:'Chapter 4 · Alignment',run(L){
  L.h(L.kick('learn','Alignment')+'<h1 class="q">Does it fit your calling?</h1>'+
   L.prose('Many people say they have nothing to offer. Yet everyone who has passed through the doors has something: resilience, adaptability, optimism, refusing to slide back, willingness to help others improve.')+
   L.prose('Before you commit, in business or in the community, ask:')+
   L.list([['compass','Does it align with my calling?','My purpose in life.'],['people','Can I offer significant help?','Not just my name on a list.'],['bulb','Does it fill me with gratitude and elation?','If not, it may not fit.']],1)+
   L.note('Alignment is never about money. “Not enough money” is often an excuse not to commit. As an old saying has it, generosity shows in what you have left after you give, not in the amount.','scale'));
  L.done();}},
{part:3,src:'Chapter 4 · Alignment',pts:1,run(L){
  L.h(L.kick('pr','What should Mireille ask?')+'<h1 class="q">Mireille is invited to chair a gala for a cause they feel little for. The main pull is press coverage. Which question should guide the decision?</h1>');
  L.mc(L.card,['Will it get Copperline good coverage?','Does it fit my calling, and can I really help?','Can I afford the donation it will expect?'],1,
   'Alignment means asking whether it fits your purpose and whether you can offer significant help. Press and money aren’t the test.',
   'The book’s alignment test is about calling and real help. Coverage is a side effect, and money, the authors say, is often just an excuse.');}},
{part:3,src:'Chapter 4 · Chapter Return on Investment',pts:1,run(L){
  L.h(L.kick('pr','You go first')+'<h1 class="q">Rowan wants to urge Dana to join a nonprofit board. What should Rowan do first?</h1>');
  L.mc(L.card,['Rate their own good citizenship and act on it','Send Dana a list of local boards that need people','Wait until Dana’s workload is under control'],0,
   'The authors say you must exemplify what you ask clients to master. Rowan rates and improves their own chart, then advises from experience.',
   'The chapter ends with a reminder: you must exemplify what you want clients to embrace. Rowan goes first, then advises from experience.');}}
  ]
});
</script>
</body>
</html>
