<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relationship Mastery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0007', title:'Relationship mastery', minutes:19, icon:'people',
  goals:['Be a client’s lifeline: confidential, honest and the first one called','Name the six traits of an evergreen advisory relationship and keep it green','Use accountability and community to help clients keep changing'],
  parts:['Lifeline','Evergreen','Stay green','Change'],
  read:'Read chapter 7 of the book for the full Calgon story, the advertising survey and the authors’ advice on communities.',
  glossary:{
    lifeline:'Lifeline: an advisor the client trusts so fully that they are the first one called in a crisis, and who says so honestly if they can’t help.',
    coaching:'Coaching: help with one specific behavior, such as presenting or writing, for a short time (the authors say no more than 90 days).',
    evergreen:'Evergreen relationship: a lifelong advisory relationship that keeps growing because the advisor keeps adding value, instead of fading like a tree losing its leaves.',
    attraction:'Chain reaction of attraction: introducing clients to valuable people they would never have met, so a community grows as each person attracts others.'
  },
  cheatsheet:[
    'Be a <b>lifeline</b>: keep confidences, practise <b>tough love</b>, be the first one called, and say so if you can’t help.',
    'Relationships are <b>holistic</b>: know the client’s life, family and interests, but don’t play therapist.',
    '<b>Coaching</b> is short and specific (90 days at most); an advisor is a lasting <b>sounding board</b>.',
    '<b>Evergreen</b> needs generosity, reciprocity, innovation, attraction, inclusion and accountability.',
    'You can be fired any time: <b>ask the buyer</b> how they value you, and never raise fees without adding value.',
    'Say <b>“we”</b>, not “you”: share the blame and give the client the credit.',
    'Client hears other advice? <b>Listen, take it in, back what works</b>. No huffing.',
    'Money and help aren’t the issue; <b>accountability and discipline</b> are. Public commitments and communities make change stick.'
  ],
  steps:[
/* ---------- PART 1: LIFELINE ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Dana rehearses next week’s pitch to the family board in front of Rowan. It’s muddled and far too long. What helps Dana most?</h1>');
  L.mc(L.card,['Rowan says it’s fine, so Dana walks in confident','Rowan says it isn’t working yet, while there’s time'],1,
   'Better to hear about lettuce in your teeth before the meeting than after. This lesson is about relationships built on that kind of honest care.',
   'False praise feels kind but leaves Dana to fail in front of the board. The authors call honest, caring truth a sign of trust.');}},
{part:0,src:'Chapter 7 · The Lifeline',run(L){
  L.h(L.kick('learn','The lifeline')+'<h1 class="q">What makes an advisor someone a client can hold on to</h1>'+
   L.prose('The authors define a relationship as a connectedness that shapes how two people treat, support and trust each other. An advisor’s relationships should not only support clients, but inspire them.')+
   L.flow([['lock','Confidential','You keep what you hear to yourself.','',2],['shield','Honest','You tell the truth, even when it hurts.','',3],['chat','First called','You’re the one they ring in a crisis.','',1]])+
   L.quote('Tough love is a sign of caring.','The authors, chapter 7')+
   L.prose('Telling people they perform better than they do doesn’t motivate them; it stunts them. That’s why '+L.g('tough-love','tough love')+' sits at the heart of a '+L.g('lifeline','lifeline')+'.'));
  L.done();}},
{part:0,src:'Chapter 7 · The Lifeline',run(L){
  L.h(L.kick('learn','The whole person')+'<h1 class="q">Relationships aren’t kept in compartments</h1>'+
   L.prose('A client’s family, interests, background and experiences all shape how they decide and how you can help. A 60-hour week means one thing if you live alone and another if you have a family.')+
   L.lanes([['check','Do','Know the client’s circumstances. Use observed behavior and evidence, not your opinions, to back your help.',2],
            ['x','Don’t','Try to be therapeutic. Advisors are not clinicians. Don’t judge or push opinions on people.',4]])+
   L.note('If you can’t help, say so and find someone who can. More often than not, though, you can.','compass'));
  L.done();}},
{part:0,src:'Chapter 7 · The Lifeline',run(L){
  L.h(L.kick('ex','A lifeline in action')+'<h1 class="q">Dana’s 7 a.m. call</h1>');
  L.beats(L.card,[
   ['The call','Whitlock Boatworks loses its largest dealer after months of missed follow-ups from cousin Jules’s sales team. Dana’s first call is to Rowan.'],
   ['Listen first','Rowan lets Dana vent, then asks about the evidence: what has the sales team actually done this year?'],
   ['Tough love','Rowan says it plainly: Dana has put off the talk with Jules for a year, and the delay helped cost the dealer.'],
   ['Keep it safe','What Dana says about Jules and the family board stays between them. Rowan promises an outline for the Jules talk by noon, and sends it at 11:40.'],
   ['The ripple','Dana sees Rowan give hard feedback with care, and finds the nerve to give it to Jules.']],
   'Your courage with feedback gives clients the courage to give tough feedback and make tough decisions themselves.');}},
{part:0,src:'Chapter 7 · The Lifeline',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Mireille leans in: “Can I share a secret about the café closures?” What should Rowan assume?</h1>');
  L.mc(L.card,['Nobody else at Copperline knows this yet','Others probably know it already'],1,
   'The authors learned the hard way: there are no secrets in organizations. Rowan keeps it confidential, but doesn’t assume they’re the only one who knows.',
   'The authors warn there are no secrets in organizations. Once someone says “secret,” you’re rarely the only one told. Rowan still keeps it confidential.');}},
{part:0,src:'Chapter 7 · The Lifeline',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Lifeline or not?',['Builds a lifeline','Weakens it'],[
   ['Kofi’s plan to win back customers is weak. Rowan calls it “a great start” to keep Kofi’s spirits up.',1,'Praising weak work stunts growth. Tough love means telling the truth with care.'],
   ['Rowan tells Dana about a hiring mistake Rowan once made, and what it cost.',0,'Allowing vulnerability, sharing mistakes and regrets, is on the authors’ list.'],
   ['Copperline’s sales have been flat for two years. Rowan calls it “healthy stability.”',1,'Don’t mistake a plateau or complacency for growth. Challenge the client to grow.'],
   ['Rowan points out that Dana interrupted people 12 times in the last meeting.',0,'Observed behavior, not opinion, makes feedback objective and nonjudgmental.'],
   ['Rowan promised Kofi a summary by Friday and sends it the next Wednesday.',1,'Honoring every commitment and deadline is part of the lifeline.']]);}},

/* ---------- PART 2: EVERGREEN ---------- */
{part:1,src:'Chapter 7 · The “Evergreen” or Lifetime Trusted Advisor Relationship',run(L){
  L.h(L.kick('learn','Coach or advisor?')+'<h1 class="q">Two kinds of help, with different time spans</h1>'+
   L.lanes([['clock','Coaching','Helps with a specific behavior: presenting, reviews, writing, running meetings. Lasts <b>90 days at most</b>, or it slides into codependency.',3],
            ['compass','Advising','A lasting sounding board: the client gets access to the advisor’s “smarts” on anything, over years.',2]])+
   L.prose('If someone can’t learn a task after about 90 days of expert '+L.g('coaching','coaching')+', the authors say it probably isn’t for them. Hire a speechwriter; get a handyman.')+
   L.prose('And it’s the strongest, most confident people (presidents, CEOs, star athletes) who are most comfortable using advisors.'));
  L.done();}},
{part:1,src:'Chapter 7 · The “Evergreen” or Lifetime Trusted Advisor Relationship',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Mireille has had eight months of media coaching and still freezes in TV interviews. What fits the book’s advice?</h1>');
  L.mc(L.card,['Add another six months of coaching','Have someone else face the cameras','Stop doing any press for Copperline'],1,
   'Past 90 days, coaching tends toward codependency, and the skill may just not be for Mireille. Get a spokesperson, the way you’d hire a speechwriter.',
   'The authors cap coaching at 90 days. If it hasn’t worked by then, find someone else to do it, like hiring a speechwriter, rather than more coaching or giving up.');}},
{part:1,src:'Chapter 7 · The “Evergreen” or Lifetime Trusted Advisor Relationship',run(L){
  L.h(L.kick('learn','Six traits of evergreen relationships')+'<h1 class="q">What keeps a client for life</h1>'+
   L.prose('The more you work with someone, the more they trust you; the more they trust you, the more they use you. You don’t want their job or a corner office. That’s what makes '+L.g('evergreen','evergreen')+' clients possible, if you bring:')+
   L.list([['leaf','Generosity','Be there professionally and personally, up to the edge of your expertise. Empathy, not sympathy.'],
           ['cycle','Reciprocity','Show you’re peers: share your own fears and ask for the client’s views.'],
           ['bulb','Innovation','Don’t just solve problems. Try new things, like an eight-minute “speed dating” idea round.'],
           ['people','Attraction','Introduce clients to valuable people they’d never otherwise meet.'],
           ['home','Inclusion','Consider the client’s family: learn their names and what occupies them.'],
           ['check','Accountability','Hold regular reviews of commitments and deadlines. You’re there to hold each other to goals, not to commiserate.']],1));
  L.done();}},
{part:1,src:'Chapter 7 · Case Study Vignette (Calgon)',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">The CEO who paid more than the bill</h1>');
  L.beats(L.card,[
   ['The setup','Forrest, CEO of Calgon, used one of the authors as a trusted advisor for five years, until he retired and the company was sold.'],
   ['The habit','Before each monthly board meeting, Forrest called on Monday night to review his plans, timing the call for halftime of Monday Night Football. He didn’t like football; the advisor did.'],
   ['The bill','In the third year, the advisor sent the usual yearly invoice of $100,000.'],
   ['The twist','Forrest refused to pay it. The advisor was worth more than that, he said, and paid $130,000.']],
   'Forrest showed generosity and reciprocity toward his advisor. When a relationship is truly evergreen, value flows both ways.');}},
{part:1,src:'Chapter 7 · The “Evergreen” or Lifetime Trusted Advisor Relationship',pts:6,run(L){
  L.h(L.kick('pr','Which trait?')+'<h1 class="q">Sort Rowan’s moves by the evergreen trait each one shows.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Generosity','Reciprocity','Innovation','Attraction','Inclusion','Accountability'],[
   ['Rowan stays on the phone an extra hour while Kofi talks through a family worry',0,'Being there personally as well as professionally is generosity.'],
   ['Rowan admits to Kofi their own fear of losing a big client, and asks how Kofi copes',1,'Sharing your own fears and asking the client’s view shows you’re peers.'],
   ['Rowan runs an eight-minute idea round at the Table to surface new business',2,'Going beyond problem solving to new ideas is innovation.'],
   ['Rowan connects Mireille with a food-bank director they would never have met',3,'Valuable introductions are the chain reaction of attraction.'],
   ['Rowan asks after Dana’s partner and kids by name',4,'Considering the client’s family is inclusion.'],
   ['Every quarter, Rowan and Dana check which commitments were kept',5,'Regular reviews of commitments and deadlines are accountability.']],
   'Six traits, one aim: a relationship that keeps growing instead of shedding its leaves.');}},

/* ---------- PART 3: STAY GREEN ---------- */
{part:2,src:'Chapter 7 · Guidelines for Holistic Relationship Mastery',run(L){
  L.h(L.kick('learn','Evergreen takes work')+'<h1 class="q">A pine tree is born evergreen. An advisor isn’t.</h1>'+
   L.prose('Advisors can be fired at any time, just as teams fire coaches. You have to keep showing the client that their life and business are better because of you. Too many advisors are, as the authors put it, deciduous: they lose their leaves, and their clients.')+
   L.list([['scale','Don’t raise fees without adding value','And never use existing clients to subsidize new ones.'],
           ['chat','Ask your buyer','What has worked, what hasn’t, and is the contact too often or too rare? Never assume they see it as you do.'],
           ['people','Never blame the client','Say “we didn’t prepare enough,” not “why didn’t you follow my advice.” Share the blame; give them the credit.']],2));
  L.done();}},
{part:2,src:'Chapter 7 · Case Study Vignette (advertising survey)',run(L){
  L.h(L.kick('ex','A survey, then Rowan’s fees')+'<h1 class="q">Do you know how your clients value you?</h1>');
  L.beats(L.card,[
   ['The survey','Years ago, clients of New York advertising firms were asked how they rated the service. They rated it <b>higher</b> than the firms rated themselves.'],
   ['The cost','Because of that gap, the firms charged less than they could have and put in more servicing and staff than needed.'],
   ['Rowan’s question','Rowan wants to raise retainer fees but isn’t sure the members would accept it. Sunny asks: “What new value would they get, and have you asked them?”'],
   ['Asking','Rowan asks Dana, Kofi and Mireille what has worked and what hasn’t. Kofi wants shorter, more frequent check-ins; Dana values the Monday calls most.'],
   ['The result','Rowan adds what clients asked for first, then sets fees on that new value, not on a guess.']],
   'Find out how the client perceives and values the relationship. It shapes what you do with them and with future clients.');}},
{part:2,src:'Chapter 7 · Guidelines for Holistic Relationship Mastery',pts:1,run(L){
  L.h(L.kick('try','Build it yourself')+'<h1 class="q">The family board voted down Dana’s plan. Tap each piece until Rowan’s opening line fits the book.</h1>');
  L.sentence(L.card,[['Why didn’t you','We didn’t'],['listen when I warned you about','prepare the family directors well enough for'],['the vote.'],['Next time, do it my way.','Let’s plan the next one together.']],[1,1,0,1],
   [['“Why didn’t you” blames Dana, like a tutor scolding a student.'],['Pointing back at your own warning is blame in disguise.'],[],['That puts Rowan above Dana. Share the work like peers.']],
   'Rowan shares the responsibility, says “we,” and leaves Dana the credit for the next win.');}},
{part:2,src:'Chapter 7 · Guidelines for Holistic Relationship Mastery',run(L){
  L.h(L.kick('learn','When the client listens to others')+'<h1 class="q">No umbrage, no huff</h1>'+
   L.prose('Some advisors are outraged when a client takes advice from someone else: another firm, a coach, family or business peers. They may even scold the client for it.')+
   L.flow([['eye','Listen','Hear the other advice out first.'],['layers','Take it in','Weigh it against what you know.'],['scale','Back or block','Support what will work, frustrate what might not.']])+
   L.note('Always with the client’s best interests in mind. Taking offense is a great way to lose the client, and their referrals, for good.','alert'));
  L.done();}},
{part:2,src:'Chapter 7 · Guidelines for Holistic Relationship Mastery',pts:1,
 solve:async L=>{const g=L.$('#rw').children;g[0].click();g[1].click();},
 run(L){
  const R=[['Rowan takes offense',2,'“Your investor doesn’t know clinics. And a sales coach? Why pay me, then?” Kofi goes quiet and stops mentioning the coach.','var(--no)'],
           ['Rowan listens first',8,'“Tell me what they said.” Rowan agrees with the coach on pricing and questions the timing of a sale, with reasons.','var(--ok)']];const seen=new Set();
  const tree=n=>'<div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0">'+Array.from({length:8},(_,j)=>'<span style="width:22px;height:22px;border-radius:50% 0;display:inline-block;background:'+(j<n?'var(--ok)':'#a0703c')+';opacity:'+(j<n?1:.55)+'"></span>').join('')+'</div>';
  L.h(L.kick('pr','Toggle and compare')+'<h1 class="q">Kofi says: “My investor thinks I should sell, and I’ve started with a sales coach.” Try both reactions.</h1><div id="rw"></div>'+
   '<div style="background:var(--soft);border-radius:16px;padding:12px;margin:8px 0 6px;min-height:120px"><div id="tr">'+tree(5)+'</div><div class="small" id="tx" style="text-align:center">Choose a reaction above.</div></div><div id="rq"></div>');
  R.forEach((r,j)=>{const b=document.createElement('button');b.className='chip';b.innerHTML=L.ic(j?'eye':'alert')+r[0];b.onclick=()=>{[...L.$('#rw').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(j);
    L.$('#tr').innerHTML=tree(r[1]);L.$('#tx').innerHTML='<span style="color:'+r[3]+'">'+r[2]+'</span>';
    if(seen.size===2&&!L.$('#rq').innerHTML){const q=L.$('#rq');q.innerHTML='<h2 class="sub">What made the second reaction keep the relationship green?</h2>';
      L.mc(q,['Rowan won the argument with the investor','Rowan put Kofi’s interests ahead of pride','Rowan told Kofi to drop the sales coach'],1,
       'Listen, take it in, back what works and question what might not, all in Kofi’s interest. Pride turns the leaves brown.',
       'The point isn’t winning or removing rivals. Rowan listened, took it in and judged each idea by Kofi’s best interests.');}};L.$('#rw').appendChild(b);});}},
{part:2,src:'Chapter 7 · Guidelines for Holistic Relationship Mastery',run(L){
  L.h(L.kick('learn','Holistic touches')+'<h1 class="q">Beyond the business: tap each card</h1>');
  L.flips(L.card,[
   ['Causes','Serve on boards with the client, especially nonprofits, or support causes the client or their family cares about.'],
   ['Travel and leisure','Swap travel and recreation ideas. You don’t have to take up the client’s hobby, but you can visit where it happens.'],
   ['Families','Plan a meeting somewhere nice and bring families. Offer to pay for dinner, but respect company rules on gifts.'],
   ['Never coast','Keep growing your own network and client base, so you bring clients better perspective.']],
   'The relationship is about the person, not just the business.');}},
{part:2,src:'Chapter 7 · Guidelines for Holistic Relationship Mastery',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Evergreen or deciduous?',['Keeps it green','Loses leaves'],[
   ['Rowan raises every retainer 15% with nothing new to offer.',1,'Higher fees without added value is exactly what the authors warn against.'],
   ['Rowan asks Mireille whether monthly check-ins are too frequent.',0,'Asking the buyer about method and frequency shows you want their view, not your guess.'],
   ['Rowan sulks after hearing Dana took advice from a board member’s banker.',1,'Huffing over other input is a great way to lose a client.'],
   ['Rowan charges Kofi more to cover discounts given to two new clients.',1,'Never use existing clients to subsidize new ones.'],
   ['Rowan joins the board of a boating safety charity Dana supports.',0,'Serving causes the client supports is part of holistic mastery.']]);}},

/* ---------- PART 4: CHANGE ---------- */
{part:3,src:'Chapter 7 · The Constancy of Change and the Need for Support',run(L){
  L.h(L.kick('learn','Change needs support')+'<h1 class="q">Money and help are rarely the problem</h1>'+
   L.prose('The authors point to stars who were nearly written off: Lady Gaga was dropped by her first record label, and an early audition note on Fred Astaire rated his dancing as merely passable. Both kept working and improved.')+
   L.prose('They also note Americans have spent a fortune on weight loss over a decade, yet weigh more than ever. Most people can spend money and find help. What’s missing is <b>accountability and discipline</b>.')+
   L.list([['Clients can change','if they’re committed to doing so.'],['Change is ongoing','because conditions keep changing.'],['We can support it','as a trusted resource in our advisory role.']],3));
  L.done();}},
{part:3,src:'Chapter 7 · Chapter Return on Investment',run(L){
  L.h(L.kick('ex','A public commitment')+'<h1 class="q">Dana says it out loud at the Table</h1>');
  L.beats(L.card,[
   ['The promise','At the monthly session, Dana tells all eight members: “I’ll have the conversation with Jules before we meet again.”'],
   ['The pull','Over the month, Dana nearly postpones twice. Each time, they picture walking into the room and saying “not yet.”'],
   ['The check','Next session, Rowan opens with a round of commitments. Dana reports the talk happened, and Jules agreed to a 90-day plan.'],
   ['The group','Kofi asks how Dana opened the talk. Dana’s story becomes a best practice for the room.']],
   'The authors say public accountability is always more effective, and a strong support system makes discipline more likely.');}},
{part:3,src:'Chapter 7 · The Constancy of Change and the Need for Support',run(L){
  L.h(L.kick('learn','Communities')+'<h1 class="q">Connect people who would never have met</h1>'+
   L.prose('The authors call this the '+L.g('attraction','chain reaction of attraction')+': as you attract people who attract others, and they start helping each other, your community grows fast.')+
   L.prose('They report that advisors with communities already in place before the 2020 pandemic did far better. Those communities:')+
   '<div style="display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px">'+['Shared best practices','Were already virtual','Gave members fast help','Had wide perspective','Built reliance on the leader'].map(x=>'<span class="chip static ok">'+x+'</span>').join('')+'</div>'+
   L.note('Advisors need this too. Nancy MacKay had her forum chairs form 90-day peer groups, set up an advisory board of clients and fellow advisors, and keep a top-20 list of relationships every quarter. Most advisors, the authors say, are lone wolves, and it doesn’t serve them.','people'));
  L.done();}},
{part:3,src:'Chapter 7 · The Constancy of Change and the Need for Support',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Kofi keeps putting off decisions and wants to buy an expensive productivity course to fix it. What does the chapter suggest is really missing?</h1>');
  L.mc(L.card,['Accountability and discipline','A better, pricier program','More time to research it'],0,
   'Spending money and finding help are rarely the issue. Rowan can help Kofi set commitments and check them, maybe in front of the Table.',
   'The authors’ point: most people can spend money and find help. What usually fails is accountability and discipline.');}},
{part:3,src:'Chapter 7 · The Constancy of Change and the Need for Support',pts:1,run(L){
  L.h(L.kick('pr','A setback')+'<h1 class="q">A big investor tells Kofi they “just aren’t a CEO.” Kofi is ready to give up the role. What should Rowan help Kofi see?</h1>');
  L.mc(L.card,['The investor is probably right about that','One harsh review needn’t end a career','The role should go to a stronger leader'],1,
   'Like Fred Astaire’s audition note, one poor review isn’t final. Kofi can improve if committed, and Rowan can be the support for that change.',
   'The chapter’s stars were nearly written off by early critics. Rowan’s job is to help Kofi see they can change and improve, with support.');}},
{part:3,src:'Chapter 7 · The Constancy of Change and the Need for Support',pts:1,run(L){
  L.h(L.kick('pr','You go first')+'<h1 class="q">Rowan works alone, talks only to Sunny now and then, and feels stuck. What would the chapter have Rowan do first?</h1>');
  L.mc(L.card,['Put in more hours with existing clients','Wait until the practice is less busy','Build a peer group and a top-20 relationship list'],2,
   'Advisors need lifelines too. Peer groups, an advisory board and a top-20 list keep Rowan inspired and learning from others’ wins and mistakes.',
   'The authors say lone-wolf advisors don’t do well. Rowan goes first: a peer group, an advisory board and a quarterly top-20 list.');}}
  ]
});
</script>
</body>
</html>
