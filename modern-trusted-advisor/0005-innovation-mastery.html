<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Innovation Mastery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0005', title:'Innovation mastery', minutes:19, icon:'bulb',
  goals:['Tell problem solving from innovation, and stop clients from defaulting to fixes','Name the three types of innovation and spot each in a client’s business','Use the 10 sources of innovation to find a client’s next idea'],
  parts:['Fix or raise','Three types','Make it happen','Ten sources'],
  read:'Read chapter 5 of the book for the full case stories, from the canteen truck to Sears, Harley-Davidson and FedEx.',
  glossary:{
    'problem-solving':'Problem solving: restoring something that has slipped back to the standard it used to meet.',
    innovation:'Innovation: setting a new, higher standard and working to reach it. It is riskier than a fix, because nobody knows yet whether the new bar can be met.',
    opportunism:'Opportunism: being triggered by an event or experience and taking advantage of it.',
    conformist:'Conformist innovation: improving something that already exists, like a better way to handle complaints.',
    nonconformist:'Nonconformist innovation: creating something truly new that doesn’t replace or improve anything that came before.',
    'speed-dating':'Speed dating (for ideas): two people fire quick questions and answers at a need or idea, sharing generously, to produce many ideas fast.',
    synthetic:'Synthetic happiness: finding the good in something that went wrong, such as “being fired was really a blessing.”'
  },
  cheatsheet:[
    '<b>Problem solving</b> restores an old standard. <b>Innovation</b> sets a new, higher one, and carries risk.',
    'Three types: <b>opportunism</b> (seize an event), <b>conformist</b> (improve what exists), <b>nonconformist</b> (create something new).',
    'Innovation is <b>daily and incremental</b>, often from the front line, not from retreats or committees.',
    '<b>Surround yourself</b> with innovative people. Use “speed dating” to produce scores of ideas fast.',
    'Capture ideas <b>at once</b>, apply the next-day test, keep a journal, and take a first step <b>within the week</b>.',
    'Focus on <b>what</b> before <b>how</b>. Look for quick, small wins. Take blame, share credit.',
    'Use the <b>10 sources</b>; new knowledge is the rarest one. Most ideas come from exploiting what is already around you.',
    'Don’t let clients <b>default to problem solving</b>.'
  ],
  steps:[
/* ---------- PART 1: FIX OR RAISE ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">The espresso machine at one Copperline café breaks. A technician repairs it and it works exactly as before. Has Copperline innovated?</h1>');
  L.mc(L.card,['No, it’s just back where it was','Yes, any fix is an innovation'],0,
   'Right. The café is back to its old normal. This lesson is about the difference between getting back to normal and setting a new normal.',
   'A repair gets the café back to where it was. Nothing is new or better than before. The book calls that problem solving, and this lesson shows why the difference matters.');}},
{part:0,src:'Chapter 5 · Typology',run(L){
  L.h(L.kick('learn','Two kinds of improvement')+'<h1 class="q">Fixing the past versus raising the bar</h1>'+
   L.lanes([['cycle',L.g('problem-solving','Problem solving'),'Something used to work and has slipped: a person, a process, a machine. You fix it (or replace it) to meet the <b>old</b> standard.',3],
            ['trend',L.g('innovation','Innovation'),'You set a <b>new, higher</b> standard and try to reach it. You act today; the results come later, in minutes or in a year.',2]])+
   L.prose('Problem solving is fairly safe: you know the standard can be met, because it was being met. Innovation is <b>riskier</b>: the new bar might not be reached, and trying can even cost you something.')+
   L.note('The authors open the chapter with a point that runs through it: innovation isn’t left to special teams or committees. It is <b>small improvement, every day</b>.','info'));
  L.done();}},
{part:0,src:'Chapter 5 · Typology',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Which of these is innovation, not problem solving?</h1>');
  L.mc(L.card,['Getting late boat deliveries back to their usual schedule','Promising every buyer a delivery date no rival offers','Replacing the paint sprayer that broke on Tuesday'],1,
   'It sets a new, higher standard nobody has met yet. That’s also why it carries risk.',
   'Getting back on schedule and replacing a broken sprayer both restore an old standard. Promising a date no rival offers sets a <i>new</i> one: that’s innovation.');}},
{part:0,src:'Chapter 5 · Typology',pts:1,
 solve:async L=>{L.$('#bf').click();L.$('#bi').click();},
 run(L){
  const seen=new Set();
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Whitlock Boatworks used to finish a hull in 8 days. Now it takes 12. Press each button and watch what Dana is aiming at.</h1>'+
   '<div style="background:var(--soft);border-radius:16px;padding:14px;margin:8px 0">'+
   '<div class="meterrow"><div class="lb">Today</div><div class="meter"><div style="width:40%;background:var(--h3)"></div></div></div>'+
   '<div class="meterrow"><div class="lb">Old best</div><div class="meter"><div style="width:60%;background:var(--h2)"></div></div></div>'+
   '<div class="meterrow"><div class="lb">Target</div><div class="meter"><div id="tg" style="width:0%;background:var(--ok-strong);transition:width .6s"></div></div></div>'+
   '<div class="small" id="tl" style="margin-top:6px">Longer bar = faster hull. Pick an approach.</div></div>'+
   '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="bf">'+L.ic('cycle')+'Fix the problem</button><button class="btn" id="bi">'+L.ic('trend')+'Innovate</button></div><div id="sq"></div>');
  const ask=()=>{if(seen.size<2||L.$('#sq').innerHTML)return;const q=L.$('#sq');q.innerHTML='<h2 class="sub">Why is the second target riskier?</h2>';
    L.mc(q,['Nobody knows yet that 6 days can be reached','Fixing problems never pays off in the end'],0,
     'Exactly. 8 days is proven, because the yard used to do it. 6 days has never been done, so the new bar may not be met.',
     'Fixing is useful, it just only restores the old standard. The risk in innovation is that the new bar has never been reached, so it may not be.');};
  L.$('#bf').onclick=()=>{seen.add(0);L.$('#tg').style.width='60%';L.$('#tl').innerHTML='<b>Problem solving:</b> back to 8 days. The yard knows it’s possible, because it used to do it.';ask();};
  L.$('#bi').onclick=()=>{seen.add(1);L.$('#tg').style.width='85%';L.$('#tl').innerHTML='<b>Innovation:</b> a new standard of 6 days. Never done before, so it might not work.';ask();};}},
{part:0,src:'Chapter 5 · Typology',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Fix or raise the bar?',['Problem solving','Innovation'],[
   ['Kofi’s app crashes on Mondays. The team patches it so it runs like last month.',0,'It restores the old standard: the app used to run fine.'],
   ['Mireille sets a goal that every café serves fresh bread by 6 a.m., which none do now.',1,'A new, higher standard that has never been met.'],
   ['Dana coaches a welder whose work has slipped back to their usual quality.',0,'Back to the past level of performance: a fix.'],
   ['Rowan offers members a new between-session check-in nobody else in town provides.',1,'Something new and better, with the risk that it doesn’t land.'],
   ['A Copperline supplier is late again, so Mireille finds a supplier who delivers on time.',0,'Replacing what stopped working restores the old standard. That’s problem solving.']]);}},

/* ---------- PART 2: THREE TYPES ---------- */
{part:1,src:'Chapter 5 · Typology',run(L){
  L.h(L.kick('learn','Three types of innovation')+'<h1 class="q">Not everyone realizes there are three</h1>'+
   L.tiers([['eye',L.g('opportunism','Opportunism'),'An event or experience triggers you, and you take advantage of it.','Book: a power cut closes a donut shop; a canteen truck sells out to the stranded customers'],
            ['layers',L.g('conformist','Conformist'),'You improve something that already exists. Very common, often small.','Book: ride hailing improves on taxis; a better way to handle complaints'],
            ['star',L.g('nonconformist','Nonconformist'),'Something truly new. It doesn’t replace or improve anything.','Book: Amazon, and once upon a time the Sears catalog']])+
   L.prose('The authors say advisors should help clients use <b>all three</b>, at work and in their personal lives. Otherwise we all slip into a rut someone else made.'));
  L.done();}},
{part:1,src:'Chapter 5 · Nonconformist Innovation',run(L){
  L.h(L.kick('ex','Stories from the book')+'<h1 class="q">What happens when a company stops innovating</h1>');
  L.beats(L.card,[
   ['Sears','In the late 1800s, Sears used the new railroads to send catalogs west and ship everything from tools to prefab houses. That was nonconformist innovation.'],
   ['The question','So why didn’t Sears become Amazon? The authors say later managers focused on profit and their store empire, not on innovation. Sears went bankrupt.'],
   ['Harley-Davidson','A famous motorcycle brand whose buyers kept getting older. The authors note it closed its India operation and never moved into rentable city scooters.'],
   ['The risk side','Innovation can also flop. The Segway was meant to change how people move; the authors say it ended up used mainly by tour guides, warehouses and police.']],
   'Stop innovating and you fade. Innovate and you might fail. The authors’ answer is <b>prudent risk</b>, not no risk.');}},
{part:1,src:'Chapter 5 · Opportunism',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">A concert crowd unexpectedly floods the street by a Copperline café. The manager wheels out a pastry cart and sells out in an hour. Which type is this?</h1>');
  L.mc(L.card,['Conformist innovation','Nonconformist innovation','Opportunism'],2,
   'An unexpected event triggered the manager, who took advantage of it, just like the canteen truck at the closed donut shop.',
   'Nothing existing was improved and nothing brand new was invented. The manager was triggered by an event and seized it: opportunism.');}},
{part:1,src:'Chapter 5 · Typology',pts:6,run(L){
  L.h(L.kick('pr','Sort the ideas')+'<h1 class="q">Ideas from around the Tidewater Table. Which type is each?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Opportunism','Conformist','Nonconformist'],[
   ['A rival boatyard closes, and Dana hires two of its best builders that week',0,'An event triggered Dana, who took advantage of it.'],
   ['Copperline cuts its shipping costs between cafés',1,'Improving something that already exists. The book uses shipping costs as an example.'],
   ['Kofi’s team makes the clinic booking screen faster',1,'A better version of what already exists.'],
   ['Dana invents a kind of vessel that no boatyard has ever built',2,'Truly new, not an improvement on anything.'],
   ['A storm cancels a ferry, and Mireille sends coffee to the waiting passengers',0,'Triggered by an unexpected event and used well.'],
   ['Rowan improves how they follow up after each session',1,'Improving an existing practice.']],
   'Opportunism seizes an event, conformist improves what exists, nonconformist creates what didn’t exist. Advisors help clients use all three.');}},
{part:1,src:'Chapter 5 · Opportunism',pts:1,run(L){
  L.h(L.kick('pr','Rowan’s move')+'<h1 class="q">Kofi has spent weeks stewing over the big customer Lumen Loop lost. What does this chapter suggest Rowan help Kofi do?</h1>'+
   '<p class="small">Recall '+L.g('synthetic','synthetic happiness')+' from lesson 1: finding the good in what went wrong.</p>');
  L.mc(L.card,['Analyze exactly why the customer left before doing anything else','Look at the loss for the opportunity it may be opening up'],1,
   'The authors say synthetic happiness is rich with opportunity. In the pandemic, some people built new businesses while others stewed.',
   'Some analysis is useful, but the chapter’s point is that bad events can open doors. Stewing, like those who bemoaned their fate in the pandemic, misses them.');}},

/* ---------- PART 3: MAKE IT HAPPEN ---------- */
{part:2,src:'Chapter 5 · Real Innovation in a Virtual World',run(L){
  L.h(L.kick('learn','Surround yourself with innovators')+'<h1 class="q">The people around you shape the ideas you have</h1>'+
   L.prose('Disruption and volatility feel like threats, but the authors see them as opportunity. The key, in person or online, is to <b>surround yourself with innovatively minded people</b>. In MacKay’s community, over 60 advisors meet monthly to swap ideas and methods.')+
   L.quote('Innovation is “applied creativity.”','The authors, chapter 5')+
   L.prose('Ideas alone aren’t enough: they must be honed into <b>actions</b> that improve the client’s situation, and yours. Once an idea is proven, you don’t reinvent it; you keep adapting it to each client.'));
  L.done();}},
{part:2,src:'Chapter 5 · Real Innovation in a Virtual World',run(L){
  L.h(L.kick('ex','At the Tidewater Table')+'<h1 class="q">Rowan runs a “speed dating” round for ideas</h1>');
  L.beats(L.card,[
   ['The format','Rowan pairs members up for 30 minutes. One presents a need; the other fires quick questions and offers what they can add. Then they swap. This is '+L.g('speed-dating','speed dating')+' for ideas.'],
   ['Mireille’s need','“My cafés waste day-old bread.” Dana asks rapid questions: who buys late in the day? Who else needs bread?'],
   ['Generosity','Dana offers the boatyard’s canteen as a buyer, and mentions a food bank a supplier works with.'],
   ['The yield','In half an hour the pairs have scores of rough ideas, far more than a slow group discussion.'],
   ['Applied','Rowan closes by asking each member to pick one idea to put into action. Creativity becomes innovation only when it’s applied.']],
   'Lightning-fast questions plus generous sharing produce many ideas quickly. It works among advisors and inside client companies.');}},
{part:2,src:'Chapter 5 · Real Innovation in a Virtual World',run(L){
  L.h(L.kick('learn','Where the best ideas come from')+'<h1 class="q">Not from brainstorms and retreats</h1>'+
   L.prose('Counterintuitively, the authors say the best ideas <i>don’t</i> come from brainstorming sessions or executive retreats. In their experience they come from two places:')+
   L.list([['person','Privately','In the shower, while focused on something else, watching TV. Write it down at once. If it still makes sense the next day, pursue it; if not, toss it.'],
           ['chat','Coaching others','Advice you give one client often applies to many. Note it, and apply the same next-day test.']],1)+
   L.prose('Then keep a <b>journal</b> of what you do with each idea so it doesn’t stall, and take a first step <b>within the week</b>, even just groundwork, to beat inertia.'));
  L.done();}},
{part:2,src:'Chapter 5 · Real Innovation in a Virtual World',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">On a walk, Rowan gets an idea for a new Table format. What should Rowan do first?</h1>');
  L.mc(L.card,['Save it for next month’s planning retreat','Write it down now, then check it tomorrow'],1,
   'Capture it immediately, then use the next-day test: if it still makes sense, pursue it.',
   'The authors say retreats aren’t where the best ideas come from, and an uncaptured idea is easily lost. Write it down now and check it tomorrow.');}},
{part:2,src:'Chapter 5 · Real Innovation in a Virtual World',pts:1,run(L){
  L.h(L.kick('pr','Put it in order')+'<h1 class="q">Mireille wakes with an idea for a bread subscription. Put the steps in the order the chapter suggests.</h1>');
  L.order(L.card,['Jot it on the notepad by the bed','Reread it the next day: does it still make sense?','Log it in an idea journal','Take a first step within the week','Look for a quick, small win to share'],
   'Capture, next-day test, journal, first step within the week, then an early win that brings others on board.');}},
{part:2,src:'Chapter 5 · Real Innovation in a Virtual World',run(L){
  L.h(L.kick('learn','Keeping ideas alive')+'<h1 class="q">Three habits that stop a good idea from dying</h1>'+
   L.list([['target','Focus on what, not how','Start with what you want to achieve. Ask “how” too early and someone will tell you why it can’t be done.'],
           ['star','Look for quick, small wins','Early success makes people jump on board and find ways to make it work elsewhere.'],
           ['people','Take blame, share credit','Own the setbacks and share the advances, so everyone, especially remote people, feels included.']],2)+
   L.note('The book’s summary adds that innovation usually comes from the <b>front lines</b>, where employees deal with customers.','info'));
  L.done();}},
{part:2,src:'Chapter 5 · Real Innovation in a Virtual World',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Keeps the idea alive, or kills it?',['Keeps it alive','Likely kills it'],[
   ['Dana opens with: “First, how would we even build that?”',1,'Asking how too early invites reasons it can’t be done. Agree on what first.'],
   ['Kofi tries the new feature with three clinics before the full launch.',0,'A quick, small win that others can rally behind.'],
   ['Mireille thanks the café team publicly when the pilot works.',0,'Sharing credit makes people feel included.'],
   ['An idea sits untouched for two months waiting for the right moment.',1,'Inertia wins. Take a first step within the week, even if it’s only groundwork.'],
   ['After a setback, Dana blames the night shift in front of everyone.',1,'Take the blame for setbacks; share the credit for advances.']]);}},
{part:2,src:'Chapter 5 · Real Innovation in a Virtual World',run(L){
  L.h(L.kick('learn','Questions to ask clients')+'<h1 class="q">Is there enough real innovation going on?</h1>'+
   L.prose('The authors suggest asking clients questions like these every 60 to 90 days. Tap each to see what it uncovers.'));
  L.flips(L.card,[
   ['If you knew you couldn’t fail…','…what would you take on soon, at work and in life?'],
   ['Highest and best use','What is the highest and best use of your talents and strengths?'],
   ['Blocked wishes','What have you wanted to do but haven’t, because of obstacles you see?'],
   ['Worst case','What’s the worst that could happen if you tried, and could you handle it?'],
   ['Best case','What’s the best that could happen that you’re missing right now?'],
   ['Closing windows','Are any windows of opportunity closing for you?']],
   'Ask all your clients regularly and patterns emerge. The authors’ rule: once is an accident, twice a coincidence, three times or more is probably a pattern.');}},
{part:2,src:'Chapter 5 · Real Innovation in a Virtual World',pts:1,run(L){
  L.h(L.kick('pr','Spot the pattern')+'<h1 class="q">Over two quarters, Rowan hears three different Table members say a fear of failing publicly is stopping a new idea. What should Rowan conclude?</h1>');
  L.mc(L.card,['It’s probably a pattern worth working on','It’s still too early to call it anything'],0,
   'Three times or more is probably a pattern. That’s a best practice Rowan can now address across clients, perhaps in a Table session.',
   'Once is an accident and twice a coincidence, but three times or more is probably a pattern. Rowan has enough to act on.');}},

/* ---------- PART 4: TEN SOURCES ---------- */
{part:3,src:'Chapter 5 · Sources of Innovation',run(L){
  L.h(L.kick('learn','The 10 sources of innovation')+'<h1 class="q">Where to look for a client’s next idea</h1>'+
   L.list([['Unexpected success','Results far beyond what anyone expected.'],
     ['Unexpected failure','Ask what opportunity a failure reveals.'],
     ['Unexpected event','A sudden change: ask what’s in it for you.'],
     ['Dramatic growth','Fast growth creates opportunities around it.'],
     ['Process weakness','Something done badly, which someone can do well.'],
     ['Market or industry change','The way a whole industry works shifts.'],
     ['Converging technologies','Technologies combine into something new.'],
     ['Demographic change','Shifts in age, income, education, living conditions.'],
     ['Perception change','What people believe shifts, and perception is reality.'],
     ['New knowledge','A discovery. Vital in some fields, but the least common source.']],3)+
   '<p class="small" style="margin-top:10px">Most organizations innovate not through new knowledge, the authors say, but by using the other nine to exploit what’s already around them.</p>');
  L.done();}},
{part:3,src:'Chapter 5 · Unexpected Success',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">Rowan helps Kofi notice an unexpected success</h1>');
  L.beats(L.card,[
   ['A book story','A milkshake-machine salesman got an order so big he went to see who needed it. He found one busy burger stand, and built McDonald’s from it.'],
   ['Kofi’s numbers','Rowan asks Kofi which accounts grew most this year. Kofi shrugs: small clinics, nothing special.'],
   ['The surprise','Rowan asks why. Those clinics use Lumen Loop to fill group classes, like physio exercise groups and waitlists. Nobody designed it for that.'],
   ['The question','Rowan asks: “If this keeps growing, what business are you really in?” Kofi starts to see a market beyond one-on-one bookings.'],
   ['Not a default fix','Kofi’s instinct was to replace the lost customer. Rowan helps Kofi look for a new, higher standard instead.']],
   'Unexpected successes hide in plain sight. Ask what the surprise tells you, the way the milkshake salesman did.');}},
{part:3,src:'Chapter 5 · Unexpected Failure',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">In the book, FedEx grew from the old postal service’s inability to deliver reliably overnight. Which source is that?</h1>');
  L.mc(L.card,['Unexpected failure','Converging technologies','Demographic change'],0,
   'A long-standing failure became the opportunity: deliver a different way altogether, not just “better.”',
   'The trigger was a failure: the post couldn’t deliver reliably by the next day. FedEx built a different way to deliver instead of trying to fix the old one.');}},
{part:3,src:'Chapter 5 · Sources of Innovation',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which source? (round 1)',['Unexpected success','Unexpected failure','Unexpected event','Dramatic growth','Process weakness'],[
   ['A Copperline seasonal loaf meant as a one-off outsells every other product for three months.',0,'Results far beyond expectations: an unexpected success.'],
   ['A big boat show is cancelled two weeks out, leaving Dana with a free booth budget and a cleared calendar.',2,'A sudden, unexpected event. Ask what’s in it for you.'],
   ['Clinics across the region struggle to remind patients by text, so Kofi sees a gap.',4,'Something done badly that someone could do well.'],
   ['Electric boat sales in the region are climbing fast every year.',3,'Rapid growth creates opportunities all around it.'],
   ['Dana’s new hull design, expected to sell well, gets almost no orders.',1,'An unexpected failure. Ask what it tells you rather than steering clear.']]);}},
{part:3,src:'Chapter 5 · Sources of Innovation',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which source? (round 2)',['Industry change','Converging tech','Demographic change','Perception change','New knowledge'],[
   ['More of Tidewater’s residents are retirees with money to spend on boats.',2,'A shift in age and income: demographic change.'],
   ['Customers now see day-old bread as eco-friendly, not second-rate.',3,'What people believe has shifted, and perception is reality.'],
   ['Clinics now treat many patients by video, changing how health care is delivered.',0,'The way a whole industry works has changed, like the book’s tele-health example.'],
   ['Kofi combines phone location, payments and booking into one tool.',1,'Several technologies coming together, like GPS plus phones.'],
   ['A lab discovers a new marine coating that stops barnacles for good.',4,'A genuine discovery. Rare as a source for most businesses.']]);}},
{part:3,src:'Chapter 5 · Chapter Return on Investment',pts:1,run(L){
  L.h(L.kick('pr','Don’t default to fixing')+'<h1 class="q">At a Table session, Dana says: “This year, Whitlock’s plan is to get delivery times back to where they were.” What should Rowan ask?</h1>');
  L.mc(L.card,['“Which team member caused the delays?”','“What new standard could you set instead?”','“Can you fix it faster than last year?”'],1,
   'Getting back to normal is problem solving. The authors want advisors to stop clients defaulting to it and push them to set a higher bar.',
   'That keeps Dana in problem-solving mode, looking backward. The chapter’s point is to stop clients defaulting to fixes and ask what new, higher standard they could reach.');}}
  ]
});
</script>
</body>
</html>
