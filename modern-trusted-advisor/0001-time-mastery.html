<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time Mastery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0001', title:'Time mastery', minutes:20, icon:'clock',
  goals:['Explain why an advisor has to “go first” before helping clients','Use the wheel of life, strengths and the four ability levels to reallocate time','Spot ego talk and below-the-line thinking, and apply the Happiness Formula'],
  parts:['Take control','Strengths','Ego talk','Toughness and fun'],
  read:'Read the introduction and chapter 1 of the book for all the case stories and the figures on control, ego and mental toughness.',
  glossary:{
    'wheel':'Wheel of life: a self-rating of about eight parts of life (career, money, health, family, fun and so on), each scored 1 to 10, to show where time really goes.',
    'locus':'Locus of control: what a person believes controls their life: themselves, outside forces, neither, or a mix of both.',
    'procrastination':'Procrastination (the book’s definition): fear of being judged for a finished piece of work or a decision that is bigger than the fear of being judged for not doing it at all.'
  },
  cheatsheet:[
    '<b>You go first.</b> Inspire yourself to act before you try to inspire a client. Skip it and you can’t help them.',
    '<b>Time is a priority, not a resource.</b> Rate the wheel of life, then reallocate time in gradual steps, like turning a dimmer, not flicking a switch.',
    '<b>Control:</b> know what you can and can’t control, and the give and take between the two.',
    '<b>Build on strengths.</b> Passion + competence + need, all three. Spend 80%+ of your time on Masterful and Excellent work; hand off the rest.',
    '<b>Efficacy and self-worth are separate.</b> A bad speech is a bad speech, not a worse person. Choose leadership over looking good.',
    '<b>Mental toughness:</b> stay above the line, limit self-blame to 60 seconds, name three positives morning and evening.',
    '<b>Happiness Formula:</b> if life condition ≠ expectation, change one of them. Aim for about 90% external energy, 10% internal.'
  ],
  steps:[
/* ---------- PART 1: TAKE CONTROL ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Rowan advises CEOs at the Tidewater Table. Dana, a member, works 75-hour weeks and wants help cutting back. Rowan works 70-hour weeks too. Who should change first?</h1>');
  L.mc(L.card,['Dana, because Dana is the paying client','Rowan, so the advice comes from example'],1,
   'Hard to coach someone out of a habit you’re living yourself. This lesson starts with exactly that idea: the advisor goes first.',
   'Dana pays for help, but help from someone stuck in the same trap rings hollow. The book says the advisor has to go first.');}},
{part:0,src:'Introduction',run(L){
  L.h(L.kick('learn','You go first')+'<h1 class="q">To inspire clients, an advisor first has to inspire themselves</h1>'+
   L.prose('A '+L.g('advisor','trusted advisor')+' is the outside person a leader leans on for honest help, over years. The authors say the best inspiring leaders and advisors do three things well:')+
   L.list([['pointer','Inspire themselves','They take positive action every day and set the example.'],
     ['people','Inspire others','They help the people around them take positive action too.'],
     ['star','Commit to extraordinary outcomes','In every part of their lives, every day, not only at work.']],1)+
   L.prose('So the advisor practises a “healthy selfishness”: '+L.g('go-first','you go first')+'. The book is built on 10 '+L.g('mastery','mastery areas')+', and each one applies twice: to you, then to your client. This lesson is the first: <b>Time Mastery</b>.')+
   '<p class="small">The authors note that it is lonely at the top, stress is high, and stress, guilt and fear “mask” a leader’s talent.</p>');
  L.done();}},
{part:0,src:'Chapter 1 · First, take control of your life',run(L){
  L.h(L.kick('learn','The wheel of life')+'<h1 class="q">Time is not a resource to manage. It’s a priority to allocate.</h1>'+
   L.quote('You can always make another dollar, but you can’t make another minute.','opening line of chapter 1')+
   L.prose('The '+L.g('wheel','wheel of life')+' splits life into eight parts, such as career, money, health, family and fun. Rate each from <b>1</b> (hardly any time there) to <b>10</b> (doing terrifically, plenty of time). The total runs from 8 to 80.')+
   L.prose('The authors find most people land around <b>50 to 70</b>, and the points are badly spread: a 10 in career and money, a 1 in fun and health. Rate yourself first, then a client.')+
   L.note('Clients often don’t see that they have <b>choices</b> about where their time goes. Part of the advisor’s job is to show them.','compass'));
  L.done();}},
{part:0,src:'Chapter 1 · Case study vignette (Felix)',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">A CEO working 80 hours a week gets his life back, one step at a time</h1>');
  L.beats(L.card,[
   ['The problem','Felix runs a large business and works <b>80 hours over six days</b>. He’s exhausted, and his wife is furious and wants a change.'],
   ['The goal','Together with the advisor, he aims for <b>55 hours over five days</b>.'],
   ['The method','They don’t cut overnight. The changes come in <b>gradual steps</b>.'],
   ['The shift','It isn’t only fewer hours. Time is <b>reallocated</b> from work toward his spouse, family and recreation.'],
   ['The result','His wheel score goes up, and he and his wife are delighted.']],
   'Change works best like a <b>dimmer</b> you turn a little at a time, not a switch you flick from off to on.');}},
{part:0,src:'Chapter 1 · First, take control of your life',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Dana rates their wheel: career 10, money 9, health 3, family 3, fun 2, and so on. Total: 52. What should Rowan notice first?</h1>');
  L.mc(L.card,['The total is fine, so nothing needs to change','The points are piled into career and money','The total is low, so Dana should add hours'],1,
   'A middling total can hide a lopsided wheel. Career and money are overloaded while health, family and fun starve.',
   'Look at the spread, not just the total. Dana’s points are piled into career and money, and health, family and fun are nearly empty.');}},
{part:0,src:'Chapter 1 · Locus of control (Figure 1.2)',run(L){
  L.h(L.kick('learn','What can you control?')+'<h1 class="q">Taking control means knowing what you can’t control, too</h1>'+
   L.prose('You can’t control the weather, but you can set a rain date. You can’t avoid taxes, but you can legally reduce them with expert help. The book maps four beliefs about '+L.g('locus','control')+':')+
   L.tiers([['compass','Random walk','No control from inside or outside. Just drifting day to day. Seen in some who inherit a business they weren’t prepared to run.'],
            ['star','“I rule my domain”','Total control, untouched by others. Often seen in leaders who rose by family ties or luck.'],
            ['cycle','Fate decides','Total outside control, so why fight it? Common after very bad luck or being cheated.'],
            ['scale','Give and take','Control over many things, not over others, and they see how the two interact. Resilient and realistic.','The healthy one',true,'Aim here']]));
  L.done();}},
{part:0,src:'Chapter 1 · Locus of control (Figure 1.2)',pts:4,run(L){
  L.h(L.kick('pr','Which belief is talking?')+'<h1 class="q">Sort what four Tidewater Table members say.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Random walk','I rule','Fate decides','Give and take'],[
   ['A new member who inherited the family firm unprepared just reacts to whatever lands each morning.',0,'No sense of control from inside or out: a random walk.'],
   ['A member who got the top job through family says no market shift could ever touch them.',1,'Believing nothing outside affects you is the “I rule my domain” trap.'],
   ['Kofi, after losing their biggest customer: “Nothing I do matters now. The market decides.”',2,'That’s handing all control to outside forces, common after a hard blow.'],
   ['Mireille: “I can’t set flour prices, but I can lock in contracts and tweak the menu.”',3,'Mireille sees what they can and can’t control and works the space between.']],
   'Only “give and take” is realistic: you control a lot, not everything, and you plan for the rest.');}},
{part:0,src:'Chapter 1 · Case study vignette (Felix) and Keys',pts:1,
 solve:async L=>{for(let i=0;i<4;i++)L.$('#dim').click();},
 run(L){
  const H=[75,70,65,61,57],F=[3,4,5,6,7],G=[3,4,4,5,6];let s=0;
  const row=(lb,id,c)=>'<div class="meterrow"><div class="lb">'+lb+'</div><div class="meter"><div id="'+id+'" style="background:'+c+'"></div></div></div>';
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Rowan and Dana agree a plan: turn the dimmer one notch a month. Press it and watch where the time goes.</h1>'+
   '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:6px"><div><div class="small">Dana’s week</div><div class="week" id="wk">75 hours</div></div><button class="btn pri" id="dim">'+L.ic('cycle')+'Turn one notch</button></div>'+
   row('Work hours','mh','var(--h3)')+row('Family score','mf','var(--ok-strong)')+row('Health score','mg','var(--h2)')+'<div id="dq"></div>');
  const draw=()=>{L.$('#wk').textContent=H[s]+' hours · month '+s;L.$('#mh').style.width=Math.round(H[s]/80*100)+'%';L.$('#mf').style.width=F[s]*10+'%';L.$('#mg').style.width=G[s]*10+'%';};draw();
  L.$('#dim').onclick=function(){if(s>=4)return;s++;draw();
    if(s===4){this.remove();const q=L.$('#dq');q.innerHTML='<h2 class="sub">Month five, a boat delivery runs late and Dana slips back to 68 hours. What should Rowan do?</h2>';
      L.mc(q,['Hold Dana to the plan and get back on the next notch','Drop the plan and cut straight to 45 hours a week'],0,
       'The book’s keys: allocate time, improve it in small steps, and give the <b>accountability</b> that makes the change stick.',
       'Flicking a switch is exactly what the book warns against. Rowan’s job is to provide accountability and keep turning the dimmer.');}};}},

/* ---------- PART 2: STRENGTHS ---------- */
{part:1,src:'Chapter 1 · Second, focus on strengths',run(L){
  L.h(L.kick('learn','Build on strengths')+'<h1 class="q">Most self-help fixes weaknesses. The strongest leaders build on strengths.</h1>'+
   L.prose('When one of the authors was fired with debts and little savings, they asked what they were already excellent at. The answer was writing and speaking, so they did lots of both, often for free, and clients followed. Strengths mean no learning curve, work you enjoy, and fast results.')+
   L.prose('The authors cite Gallup research: only 17 to 30 percent of leaders do what they do best every day. Assessments help, and so does asking people:')+
   L.list([['Pick about 20 people','Stakeholders, clients, suppliers, board members, trusted friends.'],
     ['Ask three things','What are my strengths? How could I use them better? Where would that matter most?'],
     ['Pack away your ego','Just listen, and look for patterns from very different sources.']],2));
  L.done();}},
{part:1,src:'Chapter 1 · Second, focus on strengths',run(L){
  L.h(L.kick('learn','The extraordinary formula')+'<h1 class="q">Passion + competence + need = extraordinary results</h1>'+
   L.prose('All three have to be there. Tap each card to see what happens when one is missing.'));
  L.flips(L.card,[
   ['No need','You have passion and competence, but nobody needs it: a message no one wants to hear.'],
   ['No competence','You have passion, and people need it, but you can’t deliver. You won’t help, and you’ll lose to competitors.'],
   ['No passion','You’re skilled and people need it, but you don’t care much. That’s just a nine-to-five job.']],
   'Two out of three isn’t enough. Lesson 8 goes deeper into this '+L.g('extraordinary','formula')+'.');}},
{part:1,src:'Chapter 1 · Case study vignette (Greta)',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">A CEO who wanted to sell her company finds the real problem in her calendar</h1>');
  L.beats(L.card,[
   ['The puzzle','Greta has just closed a career-making acquisition, yet the work is draining her and she’s thinking of selling.'],
   ['The check','She takes a strengths assessment and asks key stakeholders for feedback on her strengths.'],
   ['The finding','Dealing with the media is eating <b>half her time</b>. Despite lots of training, it will never be a strength.'],
   ['The plan','A 90-day plan: she hires a VP of Communications to take over most media work.'],
   ['The result','Media now takes under 20% of her time. About 80% goes to strategy, deals, her team and key customers.']],
   'The fix wasn’t more hours or more training. It was moving time onto strengths and handing off the rest.');}},
{part:1,src:'Chapter 1 · Second, focus on strengths',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Rowan loves running workshops and is very good at them. But no Table member has asked for one. Which ingredient is missing?</h1>');
  L.mc(L.card,['Passion','Competence','Need'],2,
   'Passion and competence without need is a message nobody wants to hear, however good it is.',
   'Rowan loves workshops (passion) and is good at them (competence). What’s missing is <b>need</b>: nobody has asked.');}},
{part:1,src:'Chapter 1 · Second, focus on strengths',run(L){
  L.h(L.kick('learn','Four levels of ability')+'<h1 class="q">Rate your top five work activities, then move your time</h1>'+
   L.tiers([['star','Masterful','Extraordinary, unparalleled.','',true,'Keep'],
            ['check','Excellent','Better than most, consistently.','',true,'Keep'],
            ['pointer','Competent','Adequate, but your heart isn’t in it.','',false,'Hand off'],
            ['alert','Peripheral','Sometimes fail, stressed, uninterested.','',false,'Hand off']])+
   L.prose('Aim for <b>more than 80%</b> of your time on Masterful and Excellent work. Delegate or outsource the rest. Why do we hang on to the wrong tasks? The book lists five “deadly” reasons:')+
   '<p class="small">We think we do it better · we’re doing someone else’s “failure work” · we enjoy it · we’re in a rush · we don’t delegate well.</p>');
  L.done();}},
{part:1,src:'Chapter 1 · Second, focus on strengths',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Mireille’s calendar: keep it or hand it off?',['Keep and grow it','Delegate or outsource'],[
   ['Developing new recipes. Stakeholders call it Mireille’s standout gift. (Masterful)',0,'Masterful work is where Mireille should spend the most time.'],
   ['Press interviews and social media. Draining, and the feedback says “fine, not great.” (Competent)',1,'Competent but uninspired: hand it off, as Greta did with media.'],
   ['Choosing new café sites. Consistently better than most. (Excellent)',0,'Excellent work belongs in the 80%.'],
   ['Fixing the online payroll tool. Stressful, and mistakes happen. (Peripheral)',1,'Peripheral work should go to someone who is good at it.'],
   ['Hosting the community events. Mireille enjoys them, but feedback says others do them better. (Competent)',1,'Enjoying it is one of the five “deadly” reasons to keep a task. Competent work goes.']]);}},
{part:1,src:'Chapter 1 · Second, focus on strengths',pts:1,run(L){
  L.h(L.kick('pr','Name the reason')+'<h1 class="q">Dana keeps making the sales calls that their cousin Jules, the sales director, should be making. Which “deadly” reason is this mainly?</h1>');
  L.mc(L.card,['Dana simply enjoys making calls','Dana is doing someone else’s failure work','Dana is rushing to meet a deadline'],1,
   'Covering for a person who isn’t delivering is “failure work.” It costs Dana time and hides the real problem with Jules.',
   'Nothing says Dana enjoys it or is rushing. Dana is covering for Jules, who isn’t performing: someone else’s failure work.');}},

/* ---------- PART 3: EGO TALK ---------- */
{part:2,src:'Chapter 1 · Third, eliminate ego talk',run(L){
  L.h(L.kick('learn','Efficacy is not self-worth')+'<h1 class="q">How good you are at a task and how much you’re worth are two different things</h1>'+
   L.prose(L.g('efficacy','Efficacy')+' is how well you do something. An author can write and speak well but can’t play an instrument. Nobody is good at everything; aim to be good at your calling.')+
   L.prose(L.g('self-worth','Self-worth')+' should stay steady <i>whatever</i> your efficacy. A poor speech is a poor speech, not a lesser person. The trouble: many executives set their self-worth by their last win or loss.')+
   L.lanes([['check','Healthy','Steady self-worth that can absorb life’s ups and downs.',2],
            ['alert','Three unhealthy types','The <b>empty suit</b> (big self-esteem, little ability), the <b>imposter</b> (able but fears being “found out”), and the <b>alienated</b> (feels neither able nor worthy).',3]]));
  L.done();}},
{part:2,src:'Chapter 1 · Case study vignette (Lorraine)',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">A star new CEO nearly gets fired for fighting her board</h1>');
  L.beats(L.card,[
   ['Year one','Lorraine delivers extraordinary results as a new CEO. Her one gripe: about 30% of her time goes on fighting and complaining about her board.'],
   ['Her view','She calls them micromanaging dinosaurs and wants advice on getting them off her back.'],
   ['The surprise','A 360-degree review (feedback from people all around her) shows the board is about to fire her.'],
   ['The shift','With a coach, she sees the board as successful leaders trying to set her up to succeed. She stops getting defensive, stops complaining to her team, and apologizes.'],
   ['The result','She parks her ego and shows up as a leader, just in time.']],
   'Ego talk cost Lorraine almost a third of her time, and nearly her job. Results alone didn’t protect her.');}},
{part:2,src:'Chapter 1 · Third, eliminate ego talk',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Rowan runs a flat Table session. Afterward Rowan thinks, “Maybe I’m just not cut out to be an advisor.” What has Rowan mixed up?</h1>');
  L.mc(L.card,['One weak session with their worth as a person','Their passion with their clients’ real needs'],0,
   'One flat session says something about efficacy that day. It says nothing about Rowan’s worth. The fix is to learn from it and move on.',
   'Nothing here is about need. Rowan has tied self-worth to one result, which is exactly the ego talk the book warns about.');}},
{part:2,src:'Chapter 1 · Third, eliminate ego talk (Figure 1.4)',run(L){
  L.h(L.kick('learn','The house of ego vs the house of leadership')+'<h1 class="q">Where does the time go: looking good, or truly leading?</h1>'+
   L.prose('Old habits that once brought success are hard to drop, even when they now do harm. The book asks clients four questions about where their time goes:')+
   L.list([['Blaming','or taking accountability?'],['Judging','or showing respect?'],['Getting defensive','or accepting and weighing feedback?'],['Insisting on being right','or valuing other people’s views?']],3)+
   L.prose('The first word in each pair lives in the <b>house of ego</b>: looking good yourself. The second lives in the <b>house of leadership</b>: helping others look good. The book adds that sharing credit actually saves everyone time.'));
  L.done();}},
{part:2,src:'Chapter 1 · Third, eliminate ego talk',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which house is this?',['House of ego','House of leadership'],[
   ['Dana tells the board a late boat delivery was the engineers’ fault.',0,'Blaming others is ego. Leadership takes accountability.'],
   ['Mireille thanks the café manager by name in front of staff for a record month.',1,'Sharing credit is leadership.'],
   ['Dana cuts off a sales manager mid-sentence: “I already know what you’re going to say.”',0,'Insisting on being right shuts out other views.'],
   ['Rowan asks the Table, “What did I miss in my advice to Dana?” and takes notes.',1,'Accepting and weighing feedback is leadership.'],
   ['Rowan treats a new prospect as “damaged” and lists what’s wrong with them.',0,'The book says many advisors start this way. It’s judging, not respect.']]);}},

/* ---------- PART 4: TOUGHNESS AND FUN ---------- */
{part:3,src:'Chapter 1 · Fourth, create and practice mental toughness',run(L){
  L.h(L.kick('learn','Mental toughness')+'<h1 class="q">Tough decisions and putting things off waste huge amounts of time</h1>'+
   L.prose('The book sees '+L.g('procrastination','procrastination')+' as fear: you fear criticism of a finished decision more than you fear criticism for never deciding.')+
   L.lanes([['trend','Above the line','Resilient about past mistakes, hopeful and alert to chances ahead. Better decisions get made here.',2],
            ['down','Below the line','Chewing over past mistakes and dreading the next ones.',3]])+
   L.prose('Help clients stay '+L.g('above-line','above the line')+'. Action steps from the book:')+
   L.list([['clock','60 seconds','Cap the time you spend beating yourself up over a mistake.'],
     ['star','Three and three','Each morning name three things you’ll do well today; each evening, three you did well.'],
     ['people','Use a gyroscope','Let others help keep you upright, and notice the triggers that pull you below the line.']],1));
  L.done();}},
{part:3,src:'Chapter 1 · Case study vignette (Jerry)',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">A CEO ready to quit turns things around in one peer-group meeting</h1>');
  L.beats(L.card,[
   ['Below the line','Jerry, a proven CEO, has just lost his biggest customer, taken a hit on exchange rates, and blames his finance chief. He’s sure the business will fail and wants to step aside.'],
   ['The question','At his peer group, someone asks: <i>If you knew you couldn’t fail, what would you do?</i>'],
   ['The answer','He knows right away: a deal with his biggest competitor, a new finance chief, and a 90-day turnaround plan with his team.'],
   ['The result','He leaves with that plan. He is still CEO, and the company was later named a “Best Managed Company.”']],
   'His peers were his gyroscope. The ideas were already in Jerry’s head; fear was hiding them.');}},
{part:3,src:'Chapter 1 · Fourth, create and practice mental toughness',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Since losing their biggest customer, Kofi keeps asking for “one more report” before deciding anything. How does the book explain this?</h1>');
  L.mc(L.card,['Fear of a decision being judged, so no decision','A careful mind that simply needs more data'],0,
   'That’s the book’s definition of procrastination. Rowan could try Jerry’s question: “If you knew you couldn’t fail, what would you do?”',
   'More data can sound careful, but the book reads this pattern as fear: Kofi fears critique of a decision more than critique for not deciding.');}},
{part:3,src:'Chapter 1 · Fifth, apply the Happiness Formula',run(L){
  L.h(L.kick('learn','The Happiness Formula')+'<h1 class="q">“Are you having fun?”</h1>'+
   L.prose('That’s the first question the authors ask executives, who are usually astonished. Yet upbeat energy spreads through a group. They also point to “synthetic happiness”: finding the good in a setback, like getting fired turning out to be a gift.')+
   L.flow([['home','Life condition (LC)','Where you are now'],['target','Expectation (E)','Where you expect to be'],['scale','LC = E?','Content. If not, change LC or change E.']])+
   L.prose('One CEO, passed over for the top job, blamed everyone and nearly quit. Mapping options, he chose to change his <b>expectations</b> and stay. Three years later he got the job.')+
   L.note('You only have 100% of your energy (“110%” means nothing). The best leaders put about <b>90%</b> into '+L.g('external','external')+' results and only <b>10%</b> into internal worry and strife.','info'));
  L.done();}},
{part:3,src:'Chapter 1 · Fifth, apply the Happiness Formula',pts:5,run(L){
  L.h(L.kick('pr','Condition or expectation?')+'<h1 class="q">Kofi is unhappy since the big customer left. Sort Kofi’s options.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Change the condition','Change the expectation'],[
   ['Sell Lumen Loop',0,'Selling changes Kofi’s actual situation.'],
   ['Accept that this year is a rebuilding year, not a growth year',1,'The situation stays; what Kofi expects of it changes.'],
   ['Win two mid-sized clinics to replace the lost revenue',0,'New customers change the condition itself.'],
   ['Treat the loss as a lesson about relying on one customer',1,'That’s a new way of seeing it, close to synthetic happiness.'],
   ['Drop the belief that a good CEO never loses a customer',1,'Letting go of an unrealistic standard changes the expectation.']],
   'Either lever restores LC = E. Like the passed-over CEO, sometimes the expectation is the smarter one to move.');}},
{part:3,src:'Chapter 1 · Fifth, apply the Happiness Formula (Figure 1.7)',pts:1,run(L){
  L.h(L.kick('pr','Where does the energy go?')+'<h1 class="q">Dana says about half their energy goes on arguments with family board members. Rowan estimates it’s close to 50/50. What does the book say about that split?</h1>');
  L.mc(L.card,['50/50 is normal for a family business','Even 50/50 seriously hurts results','Only above 90% internal is a problem'],1,
   'The best leaders aim for about 90/10 external. Even an even split undermines effectiveness and damages self-worth.',
   'The book says even a 50/50 split seriously undermines effectiveness. And if internal strife climbs much higher, coaching isn’t enough: the person needs professional help.');}}
  ]
});
</script>
</body>
</html>
