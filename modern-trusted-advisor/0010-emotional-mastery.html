<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emotional Mastery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0010', title:'Emotional mastery', minutes:20, icon:'compass',
  goals:['Read negative emotions as signals and help clients out of them before big decisions','Mix emotion and logic: resist peer pressure and paralysis by analysis, and find cause, not blame','Use flight, fight, fright, the pain pivot and the Epilog’s habits in daily advising'],
  parts:['Negative states','Emotion and logic','Cause and fear','Going forward'],
  read:'Read chapter 10 of the book for the thumb wrench, the Parachute Jump and Belinda’s story, and the Epilog for the authors’ closing advice.',
  glossary:{
    normative:'Normative pressure: peer pressure. An appeal to your emotions that mostly serves the other party, pushing you to act because many others are.',
    chess:'The chess game: the opposite extreme, analyzing every factor with no emotion, which leads to paralysis by analysis because there is never enough data.',
    'pain-pivot':'Pain pivot: the point where you can accept some short-term pain to end a long-term one, or avoid acting and keep bearing the pain.',
    oxygen:'Oxygen Mask Principle: take care of yourself first, so you are able to help others.',
    'one-percent':'One Percent Solution: improve by just 1 percent a day and, the authors say, in 70 days you are twice as good.'
  },
  cheatsheet:[
    'Negative states cost time and good decisions, but they are <b>signals</b>: something needs to change. Accept them; don’t deny or blindly “reverse” them.',
    '<b>Show up positive</b>. Aim for clients to be in a positive state 90 percent of the time, and keep them away from big decisions while they’re not.',
    'Four questions: <b>Is it true? How can I check? How should I act most positively? How can I remove these thoughts?</b>',
    'Logic makes us think; emotion makes us act. Avoid both extremes: <b>normative pressure</b> and <b>the chess game</b>.',
    'Ask <b>“How did this happen?”</b>, not “Who did this?” A problem means a deviation, an unknown cause, and that we care.',
    '<b>Flight, fight, fright</b>: notice which one a client is in. Help them past the <b>pain pivot</b>: a little pain now beats pain forever.',
    '<b>Oxygen Mask Principle</b>: you first. <b>One Percent Solution</b>: 1 percent a day, one mastery at a time.',
    'Show up judgment-free with zero criticism, use your own metrics, and watch for <b>hidden bias</b>.'
  ],
  steps:[
/* ---------- PART 1: NEGATIVE STATES ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">At 9 p.m., right after a painful call with an unhappy clinic, Kofi texts Rowan: “I’m going to sign the offer to sell tonight.” What should Rowan suggest?</h1>');
  L.mc(L.card,['Sleep on it and talk tomorrow morning','Sign now, while the decision feels clear'],0,
   'A decision made in the middle of a bad evening is rarely the best one. This lesson is about emotions and decisions.',
   'The clarity Kofi feels is the bad call talking. Big decisions made in a negative state are usually poor ones.');}},
{part:0,src:'Chapter 10 · Achieving a Positive Emotional State',run(L){
  L.h(L.kick('learn','What negative states cost')+'<h1 class="q">Bad moods make bad decisions, but they also carry a message</h1>'+
   L.prose('In a negative state we make poor decisions, waste time and procrastinate. We start to dislike others, our circumstances and ourselves, and confidence drains away. Jealousy, envy, anger, sadness, betrayal and a sense of no control all lead there.')+
   L.prose('The authors don’t say to deny these emotions. What you feel is valid. A negative emotion <b>signals that something needs to change</b>:')+
   L.flow([['alert','Anxiety','says you need more preparation, information or support','',3],['shield','Fear','says you may need to increase your safety','',2]],false)+
   L.prose('The answer is neither blind optimism nor “it’s out of my hands.” It is <b>accepting</b> what you feel, then acting on it.'));
  L.done();}},
{part:0,src:'Chapter 10 · Achieving a Positive Emotional State',run(L){
  L.h(L.kick('learn','Getting out of a negative state')+'<h1 class="q">Techniques, and four questions</h1>'+
   L.list([['eye','Recognize the symptoms','Prepare to deal with them; don’t assume they’ll pass.'],
     ['target','Use your own metrics','Handle it your way, not the way your parents or colleagues do.'],
     ['leaf','Get physical, forgive yourself','Work out, breathe, walk. Don’t add guilt to the load.'],
     ['pointer','Refocus, don’t “reverse”','Turn to what you want to accomplish. Unsupported optimism just sets up more disappointment.']],1)+
   L.prose('With clients, aim for a positive state <b>90 percent of the time</b>. When you see signs they’re not, stop and address it, and keep them away from important work (decisions, plans, evaluations) until they’re out.')+
   L.note('<b>The four questions:</b> Is what I believe is happening true? If I’m not sure, how can I check? How should I behave most positively now? How can I remove these thoughts?','list'));
  L.done();}},
{part:0,src:'Chapter 10 · Achieving a Positive Emotional State',run(L){
  L.h(L.kick('ex','The four questions at work')+'<h1 class="q">Rowan walks Kofi through them the next morning</h1>');
  L.beats(L.card,[
   ['The belief','Kofi: “Every clinic is about to leave. Lumen Loop is finished.”'],
   ['Is it true?','Rowan: “How many clinics have actually said they’re leaving?” Kofi: “One. The one from last night.”'],
   ['How can I check?','They agree on a short step, not a giant study: Kofi calls five long-time clinics this week and asks how it’s going.'],
   ['How to act most positively?','Kofi decides to fix last night’s clinic’s complaint first, and to park the sale offer until the calls are done.'],
   ['Remove the thoughts','Kofi writes the fear down, then writes what the calls actually show next to it. By Friday, four of five clinics are happy.']],
   'Emotional mastery isn’t avoiding bad moments. It’s what you do about them, and not making big decisions until you’re out.');}},
{part:0,src:'Chapter 10 · Achieving a Positive Emotional State',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Dana feels anxious about next month’s meeting with the family shareholders. What does the anxiety most likely signal?</h1>');
  L.mc(L.card,['Dana should cancel or delay the meeting','Dana needs more preparation or support'],1,
   'The authors read anxiety as a sign that you need better preparation, more information or more support.',
   'Running from the meeting doesn’t fix anything. The authors say anxiety signals a need for more preparation, information or support.');}},
{part:0,src:'Chapter 10 · Achieving a Positive Emotional State',pts:6,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Stop and address it?',['Warning sign: stop and address','Healthy: carry on'],[
   ['Dana rejects all four options for the new plant and offers none.',0,'Unhappiness with every option is a sign of a negative state.'],
   ['Mireille challenges one option, with reasons, and suggests a better one.',1,'That’s engaged debate, not a negative state.'],
   ['Kofi keeps saying, “It will never work, whatever we try.”',0,'The “it will never work” mentality is on the authors’ list.'],
   ['Dana keeps asking Rowan, “Just tell me what to do.”',0,'Wanting the advisor to supply every answer is a warning sign.'],
   ['Kofi has cut their last three calls short and missed one.',0,'Fatigue, shorter calls and missed appointments are signs.'],
   ['Mireille asks to move a call because a café opening ran late.',1,'One reasonable change isn’t a pattern of avoidance.']]);}},

/* ---------- PART 2: EMOTION AND LOGIC ---------- */
{part:1,src:'Chapter 10 · Emotions as an Aspect of Our Decisions',run(L){
  L.h(L.kick('learn','Two forces in every decision')+'<h1 class="q">Logic makes us think; emotion makes us act</h1>'+
   L.quote('Logic helps us to think, but emotions urge us to act.','The authors, chapter 10')+
   L.prose('As kids, we heard someone called us a name and lashed out, only to learn it was someone else, or never happened. Adults do the same: we hear what the board or a customer “said” and react on the spot.')+
   L.lanes([['eye','Normative pressure','Peer pressure. You act because many others are. Past a threshold, people do things they normally wouldn’t.',4],
            ['layers','The chess game','Pure analysis. Facts, references, color-coded reports, and never enough data: paralysis by analysis.',3]])+
   L.prose('Either extreme leads to poor decisions. The skill is the <b>mix</b>.'));
  L.done();}},
{part:1,src:'Chapter 10 · The Chess Game',run(L){
  L.h(L.kick('ex','Stories from the book')+'<h1 class="q">Too much emotion, too much logic, and the mix</h1>');
  L.beats(L.card,[
   ['Pressure','At an early job, colleagues running charity drives asked: do you want to be the <i>only</i> one who stops us reaching 100 percent? People usually caved.'],
   ['Fads','The authors watched a client come back from each seminar wanting the latest management “flavor of the month.”'],
   ['Scarcity','Late one night, a countdown clock on an infomercial pushed one author to order two “thumb wrenches.” Both are still unused.'],
   ['The mix','Good managers interview candidates against clear criteria. Once a few are close to ideal, they go with their gut.'],
   ['Under pressure','A great quarterback feels the urgency of the rush, yet still reads four receivers and picks the best one.']],
   'Use all the facts you have, plus a sense of urgency to act. Each one balances the other.');}},
{part:1,src:'Chapter 10 · Normative Pressure',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Mireille hears three other Table CEOs have moved to a trendy new management style. “Everyone’s doing it, so should I.” Which trap is this?</h1>');
  L.mc(L.card,['Normative pressure','The chess game'],0,
   'Acting because others are is peer pressure. Rowan can help Mireille ask whether it fits Copperline at all.',
   'The chess game is too much analysis. Following a trend because others did is normative pressure.');}},
{part:1,src:'Chapter 10 · Creating the Emotional/Rational Mix',pts:1,
 solve:async L=>{L.$('#m0').click();L.$('#m1').click();L.$('#m2').click();},
 run(L){
  const M=[['All emotion','Kofi signs the first offer, the night of a bad call, because it “expires Friday.” Six months later, Kofi sees it was worth far less than Lumen Loop.',4],
           ['All logic','Kofi orders a third valuation, then a market study, then another. A year passes; the buyer walks; nothing is decided.',3],
           ['The mix','Kofi gathers the key facts in two weeks, sets a decision date, and then acts. Urgency stops the stalling; facts stop the panic.',2]];
  const seen=new Set();
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Kofi must decide whether to sell Lumen Loop. Try all three ways of deciding.</h1>'+
   '<div style="display:flex;gap:8px;flex-wrap:wrap" id="mz"></div><div id="mo" style="margin-top:12px"></div><div id="mq"></div>');
  M.forEach((m,j)=>{const b=document.createElement('button');b.className='chip';b.id='m'+j;b.innerHTML=L.ic(['flame','layers','scale'][j])+m[0];
    b.onclick=()=>{[...L.$('#mz').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(j);
      L.$('#mo').innerHTML=L.lanes([[['flame','layers','scale'][j],m[0],m[1],m[2]]]);
      if(seen.size===3&&!L.$('#mq').innerHTML){const q=L.$('#mq');q.innerHTML='<h2 class="sub">Kofi tends to ask for “more data.” Which extreme should Rowan watch for?</h2>';
        L.mc(q,['Acting on pure emotion','Paralysis by analysis'],1,
         'Kofi’s risk is the chess game. Rowan can add urgency: a decision date and a short list of facts that really matter.',
         'Kofi’s habit of asking for more data points to the chess game. Perfection undermines excellence, and assurances block action.');}};
    L.$('#mz').appendChild(b);});}},
{part:1,src:'Chapter 10 · Emotions as an Aspect of Our Decisions',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which way is this decision going?',['Normative pressure','The chess game','A healthy mix'],[
   ['Dana buys a new design tool because every rival boat builder just announced it.',0,'“Everyone else is” is a purely emotional reason.'],
   ['Kofi has rewritten the pricing analysis five times and still won’t change prices.',1,'There is never enough data. That’s paralysis by analysis.'],
   ['Mireille shortlists three bakers against clear criteria, then hires the one who feels right.',2,'Criteria first, then the gut: the managers’ approach the authors endorse.'],
   ['A supplier tells Dana the discount ends at midnight, and Dana signs.',0,'Scarcity is a classic emotional trigger. Often the “last chance” comes again.'],
   ['Rowan sets a two-week fact check on raising fees, then a firm decision day.',2,'Facts plus urgency, each balancing the other.']]);}},

/* ---------- PART 3: CAUSE AND FEAR ---------- */
{part:2,src:'Chapter 10 · Finding Cause',run(L){
  L.h(L.kick('learn','Find cause, not blame')+'<h1 class="q">“How did this happen?” beats “Who did this?”</h1>'+
   L.prose('Clients often hunt for <i>who</i> is responsible for a setback, sometimes without noticing. The authors call it scapegoating: once blame is assigned, the bad result is still there. Advisors do it too, assuming the client is “damaged.” Don’t, and don’t let clients.')+
   L.prose('A real '+L.g('cause','problem')+' needs all three of these:')+
   L.list([['down','A deviation','Performance is below what was expected.'],['info','An unknown cause','If you know the cause, you have a decision, not a problem.'],['star','We care','If nobody cares, there’s nothing worth doing.']],3)+
   L.note('A squeaky garage door: dry springs? Then just oil them (a decision). Not squeaking but you worry it will? That’s a maintenance plan, not a problem.','home'));
  L.done();}},
{part:2,src:'Chapter 10 · Finding Cause',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">A Whitlock boat ships two weeks late</h1>');
  L.beats(L.card,[
   ['The blame','Dana storms in: “Who signed off the schedule? I want a name.”'],
   ['The reframe','Rowan: “Let’s ask how it happened first.”'],
   ['Deviation?','Yes: the promised date was missed by two weeks.'],
   ['Cause known?','No. The team suspects late engines, but the fitting crew also lost three days to rework. Unknown, so it’s a real problem.'],
   ['We care?','Very much: the buyer is a dealer Dana can’t afford to lose.'],
   ['The finding','The engine order went out after the schedule was set. A process gap, not a villain. Dana changes the ordering step.']],
   'Naming a scapegoat would have felt fast but left the gap in place. Finding cause actually fixed it.');}},
{part:2,src:'Chapter 10 · Finding Cause',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">A Copperline café’s sales drop sharply. Which question should Rowan help Mireille start with?</h1>');
  L.mc(L.card,['“Which manager let this happen?”','“What changed, and how did this happen?”'],1,
   'Ask how, not who. Blame doesn’t lift sales; finding the cause can.',
   'That hunts for a scapegoat. The result would still be sitting there. Start with how it happened.');}},
{part:2,src:'Chapter 10 · Finding Cause',pts:4,run(L){
  L.h(L.kick('pr','Problem or not?')+'<h1 class="q">Use the three tests. What does each situation call for?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['A problem to solve','A decision to make','Nothing right now'],[
   ['Lumen Loop sign-ups fell 30% this month and nobody knows why.',0,'Deviation, unknown cause, and Kofi cares: a real problem.'],
   ['Copperline’s oven broke because a part wore out; replace it or buy new?',1,'The cause is known, so it’s a choice, not a problem.'],
   ['Whitlock’s parking lot paint is fading; nobody minds.',2,'Nobody cares, so there’s no point acting.'],
   ['Rowan’s retainer renewals are exactly on target.',2,'No deviation, so nothing to fix.']],
   'A problem needs all three: a deviation, an unknown cause, and caring. Remove one and it becomes a decision, or nothing.');}},
{part:2,src:'Chapter 10 · Flight Fight Fright',run(L){
  L.h(L.kick('learn','Flight, fight, fright')+'<h1 class="q">Three ways people react to change and pain</h1>'+
   L.tiers([['arrow','Flight','Run from the pain: get someone else to give bad news, ignore complaints, skip board meetings, cancel on the advisor.'],
            ['flame','Fight','Retaliate first, call the lawyers, call the advisor’s methods useless. People stop telling them the truth.'],
            ['lock','Fright','Frozen, like the deer in the headlights. Hidden behind “we need more information” or polite excuses. The hardest to spot.','',true]])+
   L.prose('The way through is the '+L.g('pain-pivot','pain pivot')+': accept a little pain now to end a long one. The book’s own example: fearing the talk with a family member who can’t succeed in the business, so you endure their poor performance for years.'));
  L.done();}},
{part:2,src:'Chapter 10 · Flight Fight Fright',run(L){
  L.h(L.kick('ex','The pain pivot')+'<h1 class="q">Dana and Jules, one more time</h1>');
  L.beats(L.card,[
   ['The pain now','Jules’s 90-day plan is over, and the sales target was missed again. Dana still covers the gap with 10 extra hours a week.'],
   ['Fright','Dana keeps saying, “I need one more quarter of numbers first.” There are no more numbers to be had; Dana is frightened of the family fallout of moving Jules out of sales.'],
   ['Rowan names it','Rowan: “You can have one hard conversation, or this pain every quarter. Which costs more?”'],
   ['The pivot','Dana books the talk with Jules about a new role for Monday, with Rowan’s help on what to say and a plan for that role.'],
   ['After','Hard week. But the extra 10 hours a week are gone, and the family board hears it from Dana first.']],
   'At the pain pivot, short-term pain removes long-term pain. Refusing to act means bearing it forever.');}},
{part:2,src:'Chapter 10 · Flight Fight Fright',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Flight, fight or fright?',['Flight','Fight','Fright'],[
   ['Kofi asks the head of sales to tell the team about the lost customer.',0,'Getting someone else to deliver bad news is flight.'],
   ['A new Table member tells Rowan the advice “doesn’t work” but won’t try it.',1,'Blaming the advisor’s methods is fight, like Belinda in the book.'],
   ['Mireille graciously lets a manager present the bad numbers to the bank.',2,'Kind on the surface, it can hide a fear of doing it yourself.'],
   ['Dana cancels Rowan two weeks running after missing a public commitment.',0,'People who miss a public commitment are even more likely to flee.'],
   ['A supplier complains, and Dana’s first call is to the lawyers.',1,'Retaliating first is fight. People will soon stop telling Dana the truth.']]);}},

/* ---------- PART 4: GOING FORWARD ---------- */
{part:3,src:'Epilog',run(L){
  L.h(L.kick('learn','Two habits to take with you')+'<h1 class="q">You first, a little every day</h1>'+
   L.lanes([['person','Oxygen Mask Principle','Take care of yourself before helping others: your health, ego, emotions. That’s why every mastery starts with you going first.',2],
            ['trend','One Percent Solution','Improve by 1 percent a day and the authors say you’re twice as good in 70 days. Most people just repeat yesterday.',1]])+
   L.prose('Don’t try to apply all ten masteries at once, and don’t ask clients to. Master one technique, or part of one, daily or weekly. It’s a lifetime journey, best done with peers and your own trusted advisors.'));
  L.done();}},
{part:3,src:'Epilog',run(L){
  L.h(L.kick('ex','Rowan’s own plan')+'<h1 class="q">Rowan applies the Epilog to Rowan</h1>');
  L.beats(L.card,[
   ['Oxygen mask','Rowan still works about 70-hour weeks. First fix: two evenings a week fully off, with Sunny checking in each Friday.'],
   ['One at a time','Instead of “fix everything,” Rowan picks one mastery a quarter. This quarter: Ego Mastery, talking less in sessions.'],
   ['One percent','Each session, Rowan tries one small improvement: one fewer story, one more question.'],
   ['Three questions','Rowan asks themselves what the chapter’s summary suggests: What does success look like for me? What do I really want to achieve? Who do I want to be?'],
   ['Morning and evening','Each morning, Rowan notes what they want to accomplish; each evening, what they did, large or small: a gratitude journal.'],
   ['The ripple','At the next Table session, Rowan shares the plan. Dana, Kofi and Mireille each choose one mastery for themselves.']],
   'You walk the talk first. Clients pick one area at a time, just as you did.');}},
{part:3,src:'Epilog',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Mireille wants to start on all ten masteries next Monday. What does the Epilog advise?</h1>');
  L.mc(L.card,['Go for all ten while the motivation is high','Pick one, or part of one, and build from there'],1,
   'Master one technique daily or weekly. The areas overlap, so you’ll cover them all eventually.',
   'The authors warn against applying them all at once, for advisors and clients alike. One at a time, 1 percent a day.');}},
{part:3,src:'Epilog',pts:1,
 solve:async L=>{L.$('#po').children[1].click();L.$('#go1').click();},
 run(L){
  let p=null;const O=['About 1.7 times as good','About twice as good','About 70 times as good'];
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">Rowan gets 1 percent better each day, building on the day before. After 70 days, how much better?</h1><div id="po"></div>'+
   '<div id="run" hidden><div style="display:flex;align-items:center;justify-content:space-between;margin-top:6px;gap:8px;flex-wrap:wrap"><div><div class="small">Day</div><div class="week" id="dy">Day 0 · 1.00×</div></div><button class="btn pri" id="go1">'+L.ic('play')+'Run 70 days</button></div>'+
   '<div class="meterrow"><div class="lb">Skill</div><div class="meter"><div id="mt" style="background:var(--ok-strong);width:50%"></div></div></div></div>');
  O.forEach((o,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=o;b.onclick=()=>{if(p!==null)return;p=j;b.classList.add('sel');L.$('#run').hidden=false;};L.$('#po').appendChild(b);});
  L.$('#go1').onclick=function(){this.remove();let d=0;
    const t=setInterval(()=>{d+=2;const el=L.$('#dy');if(!el){clearInterval(t);return;}const v=Math.pow(1.01,d);el.textContent='Day '+d+' · '+v.toFixed(2)+'×';const m=L.$('#mt');if(m)m.style.width=Math.min(100,Math.round(v*50))+'%';
      if(d>=70){clearInterval(t);L.award(p===1);
        L.sheet(p===1?'ok':'no',p===1?'You called it!':'About twice as good','Each day’s 1 percent builds on the last, so 70 days gives roughly double, as the authors say: check it on a calculator. Not 70 times, and a bit more than 1.7. Most people just repeat yesterday and get nowhere.');L.done();}},60);};}},
{part:3,src:'Epilog',run(L){
  L.h(L.kick('learn','Judgment-free, every day')+'<h1 class="q">Zero criticism, your own metrics, and hidden bias</h1>'+
   L.prose('Show up judgment-free and with zero criticism, with vulnerability rather than defensiveness and empathy rather than sympathy. Stop judging yourself and it gets harder to judge others.')+
   L.prose('Don’t compare yourself to the most beautiful, rich and athletic people the media shows. Use your own metrics, and advise clients to do the same with themselves and their people.')+
   L.note('<b>Hidden bias.</b> One author had known a client, Jane, for five years and assumed, because of her Chinese heritage, that she spoke Chinese. She didn’t. Much bias rests on assumptions not grounded in fact, and advisors have a role in removing it.','eye'));
  L.done();}},
{part:3,src:'Chapter 10 · Chapter Return on Investment',pts:6,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Final review: what fits the book?',['Fits the book','Doesn’t fit'],[
   ['Kofi, furious after a board call, is about to set next year’s budget. Rowan suggests waiting a day.',0,'Keep clients away from important work, like planning, while in a negative state.'],
   ['Rowan tells Dana to cheer up, since things always work out in the end.',1,'Unsupported optimism tends to lead to more disappointment. Accept the feeling, then act.'],
   ['Rowan assumes the new young member won’t want to lead the finance discussion.',1,'That’s an assumption not grounded in fact: the hidden bias the Epilog warns about.'],
   ['Mireille starts each day by asking what success looks like and who they want to be.',0,'These questions are on the chapter’s own summary list.'],
   ['Dana spots that they’re fleeing a supplier they owe, and calls them first.',0,'Noticing flight and using it positively: face the short-term pain.'],
   ['Rowan helps clients for months while running on four hours of sleep.',1,'The Oxygen Mask Principle: take care of yourself first.']]);}}
  ]
});
</script>
</body>
</html>
