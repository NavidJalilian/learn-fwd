<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ego Mastery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0002', title:'Ego mastery', minutes:20, icon:'scale',
  goals:['Use ego situationally and earn respect rather than chase affection','Calm an emotional client with the MVE method instead of logic alone','Give feedback by sharing experience, and take solicited feedback without defending yourself'],
  parts:['Ego and respect','Self-awareness','Emotions','Feedback'],
  read:'Read chapter 2 of the book for the full stories of Rick, George, Jason and Jenny, and the Lobster Principle.',
  glossary:{
    'ego':'Ego: the part of the mind that tests reality and gives you a sense of who you are. The book treats it as neutral: neither good nor bad.',
    'empathy':'Empathy: feeling what someone else feels. Sympathy is feeling sorry for them, which is not the same.',
    'mve':'MVE method: Mirror what you saw or heard, Validate the person’s feelings, Empathize by feeling what they feel. Used to calm strong emotions.',
    'conscious':'Conscious competence: doing something well while noticing how you do it, instead of on autopilot. You need it to keep learning.'
  },
  cheatsheet:[
    '<b>Ego is neutral.</b> Don’t crush it; apply it to the situation. Keep yours in check so you never compete with a client.',
    '<b>Respect beats affection.</b> A trusted advisor is both respected and liked, but respect is what gets advice acted on.',
    '<b>When triggered:</b> don’t vent by phone or email, stew, or plan revenge. Ask what success looks like and whether it can be undone.',
    '<b>Self-awareness:</b> watch the room, test for understanding, take a back seat sometimes. Perception is reality.',
    '<b>Logic makes people think; emotion makes them act.</b> Practise empathy, not sympathy.',
    '<b>MVE:</b> Mirror, Validate, Empathize. Then decide logically what to do.',
    '<b>Feedback:</b> value solicited feedback from people you respect. Share your own hits and misses instead of telling people what to do.',
    '<b>Be a lobster:</b> growth needs the vulnerability to hear tough love without resentment.'
  ],
  steps:[
/* ---------- PART 1: EGO AND RESPECT ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">You need heart surgery. Surgeon A is charming but you doubt their skill. Surgeon B is cold but widely respected. Whose advice do you follow?</h1>');
  L.mc(L.card,['Surgeon A, because you like them','Surgeon B, because you respect them'],1,
   'Most of us pick respect when it really matters. This lesson shows why advisors should too.',
   'Liking someone feels good, but on the big decisions people follow those they respect. That’s the heart of this lesson.');}},
{part:0,src:'Chapter 2 · Ego as a game-changer or show-stopper',run(L){
  L.h(L.kick('learn','Ego is neutral')+'<h1 class="q">A strong ego isn’t the problem. A misused one is.</h1>'+
   L.prose('The book treats '+L.g('ego','ego')+' as neutral. It can push you forward or stop you dead. Most excellent leaders the authors know have strong egos, which doesn’t mean arrogant or bullying. It means comfortable in their own skin.')+
   L.lanes([['person','Your own ego','Keep it under control, so you never get pulled into competing with a client or feel threatened by them.',1],
            ['people','Your client’s ego','Help them steer it, so it stays powerful and productive, not harmful.',2]])+
   L.prose('So Ego Mastery isn’t about crushing ego. It’s about applying it <b>appropriately and situationally</b>. In lesson 1 you met ego talk; this lesson goes further.'));
  L.done();}},
{part:0,src:'Chapter 2 · Ego as a game-changer (Figure 2.1)',run(L){
  L.h(L.kick('learn','Respect vs affection')+'<h1 class="q">Being liked is nice. Being respected is what counts.</h1>'+
   L.prose('We all want to be liked and respected, but they aren’t the same. If I like you but doubt your advice, I won’t act on it. If I respect you, I’m far more likely to. The book maps four positions:')+
   L.tiers([['box','Vendor','Neither liked nor respected. Seen like someone selling office supplies.'],
            ['chat','Buddy','Liked, not respected. Fun to watch a game with, never asked for advice.'],
            ['book','Expert witness','Respected, not close. Trusted on the facts of one subject.'],
            ['shield','Trusted advisor','Respected <i>and</i> liked: trusted and relied on.','Where you want to be',true,'Goal']])+
   '<p class="small" style="margin-top:10px">Here neither side is on a high horse. It’s collaboration, not competition: about being helpful, not being right.</p>');
  L.done();}},
{part:0,src:'Chapter 2 · Case study vignette (Rick)',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">A brilliant CEO who kept finishing everyone’s sentences</h1>');
  L.beats(L.card,[
   ['The habit','Rick is one of the best CEOs the authors have met. But in team meetings he cuts people off and finishes their sentences.'],
   ['His reason','He wants to keep meetings moving: he knows what they’ll say and can sum it up faster.'],
   ['The cost','The advisor points out that people can’t take credit for their own thinking. They feel he doesn’t respect their views. What do 30 more seconds really cost?'],
   ['The fix','When someone pauses, Rick silently counts “one thousand one, one thousand two” to be sure they’ve finished.'],
   ['The result','The whole tone of the meetings changes. His ego wasn’t out of control; it just needed reining in at times.']],
   'And a warning for advisors: if you’re helping a client stop cutting people off, don’t cut your client off.');}},
{part:0,src:'Chapter 2 · Case study vignette (Rick)',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">At Whitlock Boatworks, Dana finishes their managers’ sentences “to save time.” What should Rowan help Dana see?</h1>');
  L.mc(L.card,['The meetings would run faster with fewer people','People feel their thinking isn’t respected','Dana’s ego is too strong and must be crushed'],1,
   'Like Rick, Dana is taking away people’s credit for their ideas. A silent two-second count is a simple fix.',
   'The issue isn’t meeting size, and the book doesn’t want ego crushed. Dana’s team feels their thinking isn’t respected, as Rick’s did.');}},
{part:0,src:'Chapter 2 · Ego as a game-changer (Figure 2.1)',pts:4,run(L){
  L.h(L.kick('pr','Where does Rowan stand?')+'<h1 class="q">Sort how different people see Rowan.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Vendor','Buddy','Expert witness','Trusted advisor'],[
   ['Copperline’s HR team files Rowan’s invoice with the coffee-bean supplier’s.',0,'No closeness, no particular respect: just another supplier.'],
   ['A Table member loves sailing with Rowan but never asks for advice.',1,'Liked, not relied on: a buddy.'],
   ['Kofi’s board calls Rowan in once to explain warehouse logistics. They barely chat.',2,'Respected for know-how on one topic, without closeness.'],
   ['When a crisis hits, Dana calls Rowan first and acts on the advice.',3,'Respected and liked, and relied on: the trusted advisor.']],
   'Rowan wants to move every relationship toward the top right: respect first, with affection as a bonus.');}},
{part:0,src:'Chapter 2 · Ego as a game-changer or show-stopper',run(L){
  L.h(L.kick('learn','Confidence, arrogance, smugness')+'<h1 class="q">Three words people mix up</h1>'+
   L.prose('The authors find that the more aggressive people are, the more insecure they tend to be. Some get so defensive they strike first. Assertiveness and confidence, by contrast, are good traits. Tap each card.'));
  L.flips(L.card,[
   ['Confidence','Truly believing you can help others.'],
   ['Arrogance','Truly believing you don’t need help yourself.'],
   ['Smugness','Arrogance without the talent to back it up.']],
   'A healthy, strong ego sits in the middle: confident, not arrogant. (The book treats bullying as a separate personality problem, not an ego issue.)');}},

/* ---------- PART 2: SELF-AWARENESS ---------- */
{part:1,src:'Chapter 2 · Self-awareness',run(L){
  L.h(L.kick('learn','When you’re triggered')+'<h1 class="q">Parking your ego starts with noticing you’re angry</h1>'+
   L.prose('When you or a client feel angry, annoyed or outraged, the book lists four things <b>not</b> to do:')+
   L.list([['x','Phone someone to vent',''],['x','Write an email to vent',''],['x','Sit and stew',''],['x','Plan revenge','']],3)+
   L.prose('Instead, notice the trigger and shift to a positive state. Ask: What would real success look like? If I did nothing, would it get worse, stay the same, or fade? Would acting make it worse? <b>Can it be undone?</b> You can’t unring a bell.'));
  L.done();}},
{part:1,src:'Chapter 2 · Case study vignette (George)',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">A CEO about to quit in anger tries disappointment instead</h1>');
  L.beats(L.card,[
   ['The anger','After a good year, George gets a disappointing bonus. He tells his wife the board chair is a jealous jerk and he’ll quit to prove a point.'],
   ['The advice','His wife suggests telling the chair he’s <b>disappointed</b>, not angry. He can still quit afterward.'],
   ['The talk','He tells the chair face to face that he’s disappointed enough to consider leaving, and wanted to show the respect of saying so in person.'],
   ['The response','The chair offers an independent committee to review his performance and pay.'],
   ['The result','No bigger bonus, but clearer, more valuable incentives the next year. He stays, and stays productive.']],
   'Quitting in a rage couldn’t be undone. Expressing disappointment kept every option open.');}},
{part:1,src:'Chapter 2 · Self-awareness',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Kofi is drafting a furious email to the customer who just left Lumen Loop. Kofi asks Rowan to read it before it goes. What does Rowan ask first?</h1>');
  L.mc(L.card,['“Could you make the tone a bit firmer?”','“What would real success look like here?”'],1,
   'Starting from success, and whether the email could ever be taken back, moves Kofi out of venting.',
   'Polishing a vent email is still venting, and an email can’t be unsent. Rowan asks what real success looks like first.');}},
{part:1,src:'Chapter 2 · Self-awareness',run(L){
  L.h(L.kick('learn','Reading the room')+'<h1 class="q">Perception is reality</h1>'+
   L.prose('Think of someone stopping at the bottom of a busy escalator to decide where to go. Not malicious, just unaware. The book offers checks to try on yourself and suggest to clients:')+
   L.list([['eye','Consider the room','Think about who you’ll be with, not only your own needs.'],
     ['chat','Listen, don’t endure','Treat questions as useful, not as interruptions. Watch faces and body language.'],
     ['check','Test for understanding','Ask whether people follow you and your pace works.'],
     ['people','Take a back seat','Let others host or lead sometimes, and engage with their interests.']],1)+
   L.prose('Move from doing things on autopilot to '+L.g('conscious','conscious competence')+'. Others may not see you the way you see yourself, and their view is what counts.'));
  L.done();}},
{part:1,src:'Chapter 2 · Self-awareness',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Self-aware or not?',['Self-aware','Not self-aware'],[
   ['Rowan pauses mid-talk: “Am I going too fast? What’s landing so far?”',0,'Testing for understanding is a self-awareness habit.'],
   ['Mireille checks phone messages while a Table member describes a layoff.',1,'Treating others’ talk as an interruption misses the room.'],
   ['Dana lets Kofi host the Table’s dinner and mostly listens.',0,'Taking a back seat when it fits is self-aware.'],
   ['Rowan sees two members frowning but keeps going with the plan.',1,'Ignoring the faces in front of you misses how you’re coming across.'],
   ['A member swears freely at the Table, as they do with their crew at work.',1,'What’s fine in one setting jars in another. Adjust to the group you’re with.']]);}},

/* ---------- PART 3: EMOTIONS ---------- */
{part:2,src:'Chapter 2 · Mastering emotions',run(L){
  L.h(L.kick('learn','Emotion drives action')+'<h1 class="q">Logic makes people think. Emotion makes them act.</h1>'+
   L.prose(L.g('empathy','Empathy')+' is feeling what someone else feels. Sympathy is feeling pity for them. To be empathic, an advisor has to rein in their own emotions first.')+
   L.prose('Urgency comes from feeling, not from reasoning. You don’t run from a fire because you reasoned it through. That’s why buyers can agree with every point and still never sign: you played intellectual chess, not emotional rugby.')+
   L.note('Check yourself before big decisions: Am I in an emotional state? Can I move to a positive one on my own? Am I rested and not over-stressed? Can I accept being disliked to do right by a client?','alert'));
  L.done();}},
{part:2,src:'Chapter 2 · Mastering emotions',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Mireille is upset that two café managers quit in one week. Which reply from Rowan shows empathy, not sympathy?</h1>');
  L.mc(L.card,['“Oh, you poor thing, what bad luck.”','“That would leave me rattled and worried too.”'],1,
   'Feeling what Mireille feels is empathy. Pity puts Rowan above Mireille, looking down.',
   'That’s pity, which is sympathy. Empathy is feeling it alongside Mireille: “I’d be rattled too.”');}},
{part:2,src:'Chapter 2 · Mastering emotions',run(L){
  L.h(L.kick('learn','The MVE method')+'<h1 class="q">How to calm a client’s strong emotions</h1>'+
   L.flow([['eye','Mirror','Say back what you saw or heard','“You’re upset about the bonus.”',1],
           ['check','Validate','Confirm the feeling makes sense','“Given what you told me, that makes sense.”',2],
           ['people','Empathize','Feel what they feel','“In your shoes, I’d feel the same.”',3]])+
   L.prose('This is how you talk someone down. Then comes the second half: what happens to us is emotional, but <b>what we do about it</b> should be logical and practical.'));
  L.done();}},
{part:2,src:'Chapter 2 · Case study vignette (Jason)',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">A drama student loses the lead role and calls home</h1>');
  L.beats(L.card,[
   ['The blow','One author’s son, Jason, worked hard for the lead in a big university play. The department cast an outsider instead.'],
   ['The feelings','Jason feels betrayed, furious, hurt and sad, and asks his father how he <i>should</i> feel.'],
   ['Validate','His father says there are no right or wrong feelings, and he’d feel the same.'],
   ['The choice','Then the options: boycott the play and appeal to the dean, or take a smaller part and do it brilliantly.'],
   ['The outcome','Jason takes the smaller part, is terrific, and later admits he wasn’t right for the lead.']],
   L.quote('It’s not what happens to you, it’s what you do about it.','the authors, chapter 2'));}},
{part:2,src:'Chapter 2 · Mastering emotions',pts:1,run(L){
  L.h(L.kick('pr','Put it in order')+'<h1 class="q">Dana is fuming: the family board blocked the new boat line. Put Rowan’s replies in MVE order, then the logical next step.</h1>');
  L.order(L.card,['“So the board voted down the new line.”','“Of course that stings after a year of work.”','“I’d be furious in your seat too.”','“Now, what do you want to do about it?”'],
   'Mirror, validate, empathize, and only then move to a calm, logical choice, just as with Jason.',['Mirror','Validate','Empathize','Then decide']);}},

/* ---------- PART 4: FEEDBACK ---------- */
{part:3,src:'Chapter 2 · The fine art of feedback',run(L){
  L.h(L.kick('learn','Solicited vs unsolicited')+'<h1 class="q">Not all feedback deserves your attention</h1>'+
   L.lanes([['check','Solicited','From a trusted source you respect, whom you asked.',2],
            ['x','Unsolicited','From anyone, unasked. Nearly always for the <i>sender</i>: a way to show they know better.',3]])+
   L.prose('Watch for “recency confirmation”: believing whatever you heard last over earlier, wiser advice. Without a filter, you get knocked around like a pinball.')+
   L.note('As a trusted advisor, your feedback is always <b>'+L.g('solicited','solicited')+'</b>: the client asked for it by hiring you. Encourage clients to seek feedback from others they respect too.','info'));
  L.done();}},
{part:3,src:'Chapter 2 · Case study vignette (Jenny)',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">The “second smartest person in the room”</h1>');
  L.beats(L.card,[
   ['The pattern','Jenny always offers commentary, tries to change agendas and even the group’s restaurant choices. She positions herself as the second smartest person present.'],
   ['The overrun','Told publicly she has 10 minutes left in a presentation, she runs on for 30 more.'],
   ['The confrontation','Gentle hints don’t land. Finally she is confronted in a session, mid-overrun. She leaves the room in a huff.'],
   ['The turn','Later, she asks for help from the people she respects.']],
   'Sometimes only '+L.g('tough-love','tough love')+' gets feedback heard.');}},
{part:3,src:'Chapter 2 · The fine art of feedback',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">After Rowan’s talk at a business lunch, a stranger says, “Here’s how I’d have done it.” What kind of feedback is this?</h1>');
  L.mc(L.card,['Solicited, so take it to heart','Unsolicited, likely for the sender'],1,
   'Nobody asked, and it comes from someone Rowan doesn’t know. Listen politely; weigh it lightly.',
   'Rowan never asked this stranger. That makes it unsolicited, which the book says mostly serves the sender.');}},
{part:3,src:'Chapter 2 · The fine art of feedback',run(L){
  L.h(L.kick('learn','Share, don’t tell')+'<h1 class="q">Park your ego and stop telling people what to do</h1>'+
   L.prose('A therapist rarely gives strong advice. They ask questions: what do you intend to do, how do you feel? The book asks advisors to do something similar: share your own experiences, hits and misses, and invite the client to share theirs.')+
   L.prose('Telling comes from a superior position. Sharing puts you in the same boat. And your power as an advisor is the wide range of experiences you can draw on.')+
   '<p class="small">Don’t tell people how you would do it; help them see how they can do it.</p>');
  L.done();}},
{part:3,src:'Chapter 2 · The fine art of feedback',pts:1,
 solve:async L=>{L.$('#tt').click();L.$('#ts').click();},
 run(L){
  const seen=new Set();
  L.h(L.kick('pr','Toggle and compare')+'<h1 class="q">Kofi rushed a price cut that lost money. Try both ways Rowan could give feedback.</h1>'+
   '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="chip" id="tt">'+L.ic('pointer')+'Tell</button><button class="chip" id="ts">'+L.ic('chat')+'Share</button></div>'+
   '<div style="background:var(--soft);border-radius:16px;padding:14px;margin:10px 0 6px;min-height:110px" id="tv"><div class="small">Pick a version above.</div></div><div id="tq"></div>');
  const V=[['“The problem is you used poor judgment and acted too rashly.”','A verdict from above. Kofi, who already blames themselves, now has one more critic.'],
           ['“Let me tell you what happened when I thought speed mattered more than being sure…”','A shared experience. Rowan is in the same boat, and Kofi is invited to compare notes.']];
  const show=(j,b)=>{['#tt','#ts'].forEach(x=>L.$(x).classList.remove('sel'));b.classList.add('sel');seen.add(j);
    L.$('#tv').innerHTML='<p class="prose" style="margin:0 0 8px">'+V[j][0]+'</p><div class="small">'+V[j][1]+'</div>';
    if(seen.size===2&&!L.$('#tq').innerHTML){const q=L.$('#tq');q.innerHTML='<h2 class="sub">Which one is Kofi more likely to accept?</h2>';
      L.mc(q,['The shared experience','The direct verdict'],0,'The book says sharing, rather than telling, is the strongest way to give feedback others will accept.','A verdict comes from a superior position. Sharing your own misses is what the book says people accept.');}};
  L.$('#tt').onclick=function(){show(0,this);};L.$('#ts').onclick=function(){show(1,this);};}},
{part:3,src:'Chapter 2 · The Lobster Principle',run(L){
  L.h(L.kick('learn','The Lobster Principle')+'<h1 class="q">To grow, you have to be vulnerable for a while</h1>'+
   L.flow([['shield','Hard shell','Safe, but it limits growth'],['alert','Shed it','Soft and exposed for a time'],['trend','Grow','Bigger with each new shell']])+
   L.prose('A lobster must shed its shell to grow, and while it does, it is exposed. It keeps doing this, and can grow very large. Ego gets in the way of feedback, so we have to park it and accept some vulnerability.')+
   L.prose('The greatest leaders and advisors the authors have seen allow that vulnerability. They take critique and tough love without resentment or hurt.'));
  L.done();}},
{part:3,src:'Chapter 2 · The fine art of feedback',pts:1,run(L){
  L.h(L.kick('pr','Rowan goes first')+'<h1 class="q">Rowan asks Sunny, a fellow advisor Rowan respects, for feedback on last month’s Table session. Sunny says bluntly: “You talked for most of it.” What should Rowan do?</h1>');
  L.mc(L.card,['Explain why the group needed all that input','Thank Sunny and ask what to change next time','Ask other members whether Sunny is right'],1,
   'This is solicited feedback from a respected source. Rowan parks the ego, accepts the vulnerability and asks how to improve.',
   'Rowan asked for this, from someone they respect. Defending or shopping for a second opinion is ego getting in the way. Thank Sunny and ask what to change.');}}
  ]
});
</script>
</body>
</html>
