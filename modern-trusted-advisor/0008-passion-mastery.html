<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Passion Mastery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0008', title:'Passion mastery', minutes:19, icon:'flame',
  goals:['Diagnose which part of passion + competence + need is missing','Confirm strengths through solicited feedback and build on them','Point passion outward, at outcomes, with rational optimism'],
  parts:['The formula','Strengths','Purpose','Direction and joy'],
  read:'Read chapter 8 of the book for the strengths exercise, the lawyer who worked until 2 a.m., and the figures on passion and on happiness and meaning.',
  glossary:{
    synthetic:'Synthetic happiness: happiness you create by finding the good in a setback (“losing that job was the best thing that happened to me”), as opposed to conventional happiness from birthdays, wins and promotions.',
    rational:'Rational optimism: seeing the real possibilities and opportunities in a situation, as opposed to blind optimism, which just trusts that things will turn out fine.',
    hundred:'The 100 percent factor: all your talent and energy goes either inward (politics, gossip) or outward (customers, products, relationships). Every bit spent inside is lost to the customer.'
  },
  cheatsheet:[
    '<b>Passion + competence + need</b> = extraordinary. No need: nobody hears you. No passion: a 9-to-5 job. No competence: you lose to rivals.',
    'Ask clients, <b>“Are you having fun?”</b> Passion is the ingredient people overlook.',
    '<b>Build on strengths</b>; don’t try to fix weaknesses. You’re not damaged.',
    'Confirm strengths with <b>solicited feedback</b>: list, ask, compare, measure use, plan to default to them. Trust patterns, not one-offs.',
    'Purpose means the work <b>never feels like a burden</b>. A workaholic isn’t passionate, just narrow.',
    'Control passion: <b>influence, don’t convert</b>. Aim it outward: about <b>80% external, 20% internal</b>.',
    'Be passionate about <b>outcomes</b>, not tasks: nobody needs a drill, they need holes.',
    'Allow yourself joy: <b>synthetic happiness</b> and <b>rational optimism</b>.'
  ],
  steps:[
/* ---------- PART 1: THE FORMULA ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Rowan opens a one-on-one by asking Dana, “Are you having fun?” Dana looks startled. Is it a fair question for a CEO?</h1>');
  L.mc(L.card,['No, leaders are paid to deliver, not enjoy it','Yes, enjoying the work is part of leading well'],1,
   'The authors ask clients this first, and say the surprise is telling, as if leaders aren’t allowed to have fun. This lesson is about why passion matters.',
   'The authors see it the other way: working well and being happy reinforce each other. That’s why “Are you having fun?” is their first question.');}},
{part:0,src:'Chapter 8 · The Extraordinary',run(L){
  L.h(L.kick('learn','The extraordinary formula, up close')+'<h1 class="q">Take away any one ingredient and see what’s left</h1>'+
   L.prose('Lesson 1 met the formula: '+L.g('extraordinary','passion + competence + need')+' = extraordinary results. Chapter 8 shows what happens when one is missing:')+
   L.tiers([['chat','No need','Passion and competence, but no market need: nobody hears your message.'],
            ['clock','No passion','Competence and market need, but no passion: a 9-to-5 job.','The one people overlook',true,'Often missed'],
            ['target','No competence','Passion and market need, but no competence: you lose to the competition.']])+
   '<p class="small" style="margin-top:10px">Focusing only on competence and need creates a grind with no fulfillment.</p>');
  L.done();}},
{part:0,src:'Chapter 8 · The Extraordinary',run(L){
  L.h(L.kick('learn','Passion is contagious')+'<h1 class="q">Emotion is what gets people moving</h1>'+
   L.prose('As earlier lessons noted, logic makes people think but emotion makes them act, and creates urgency. Passion spreads to the people around you.')+
   L.prose('Too few people are bold enough to say “I can help you,” “We can start right away” or “Let me put a proposal in front of you.” Passion gives you that nerve.')+
   L.note('If hobbies can stir passion, the authors ask, why not your calling? Set aside time to think about what you’re passionate about.','flame'));
  L.done();}},
{part:0,src:'Chapter 8 · The Extraordinary',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Lumen Loop’s team is skilled and clinics need its software. Yet Kofi says running it “feels like punching a clock.” Which ingredient is missing?</h1>');
  L.mc(L.card,['Competence','Market need','Passion'],2,
   'Competence plus need without passion is, in the authors’ words, a 9-to-5 job. Rowan can help Kofi reconnect with what they love about the work.',
   'Kofi has the skills and the market. A grind with skill and demand but no fulfillment means passion is missing.');}},
{part:0,src:'Chapter 8 · The Extraordinary',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'What’s missing?',['Passion','Competence','Need'],[
   ['Copperline’s marketing lead loves social media and posts daily, but rival chains’ posts are far better and win the audience.',1,'Passion and a market, but weaker skill: you lose to the competition.'],
   ['A Table member builds a beautiful app they love, for a problem no customer has.',2,'Passion and competence, but no market need: nobody hears the message.'],
   ['A Table member’s print shop is booked for two years and the crews are excellent, but the owner dreads Mondays.',0,'Skill and demand without passion: it has become a job.'],
   ['Rowan is gifted at running groups and loves it, but hasn’t checked if local CEOs want another forum.',2,'Without confirming need, the passion and skill may go unheard.']]);}},

/* ---------- PART 2: STRENGTHS ---------- */
{part:1,src:'Chapter 8 · The Extraordinary',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">The author who didn’t copy the competition</h1>');
  L.beats(L.card,[
   ['Fired','When one of the authors was fired, the US alone had over 250,000 independent consultants, most with a big head start.'],
   ['The wrong question','He didn’t ask what they were doing and how to copy it.'],
   ['The right question','He asked, “What am I really good at?” The answer: writing and speaking. He hated networking and didn’t believe in advertising.'],
   ['The result','So he wrote and spoke, again and again. He reports over 60 published books in 15 languages and a place in a speakers’ hall of fame.']],
   'We improve by building on strengths, not correcting weaknesses. Trying to “fix” what others did better would have held him back.');}},
{part:1,src:'Chapter 8 · The Extraordinary',run(L){
  L.h(L.kick('learn','Confirm your strengths')+'<h1 class="q">Use solicited feedback, in five steps</h1>'+
   L.prose('We all have blind spots, and when we look at ourselves we tend to fix on weaknesses, as if we need fixing. '+L.g('solicited','Solicited feedback')+' checks your strengths instead:')+
   L.list([['List','Write down what you believe are your outstanding strengths.'],
           ['Ask','Ask a friend, colleague or small group what they think your strengths are.'],
           ['Compare','Reconcile the lists (“I only see you at work”), using evidence and observed behavior.'],
           ['Measure','How often do you actually use those strengths? Always, daily, or only when you remember?'],
           ['Plan','With others’ help, make those strengths your default.']],2));
  L.done();}},
{part:1,src:'Chapter 8 · The Extraordinary',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Rowan is running the strengths exercise with Sunny’s help. Put the steps in order.</h1>');
  L.order(L.card,['Rowan lists their own top strengths','Sunny and two clients list Rowan’s strengths','They reconcile the lists with evidence','Rowan checks how often they use them','They plan how to default to them more'],
   'List, ask, compare, measure, plan. The goal isn’t a nice list; it’s using your best strengths more of the time.');}},
{part:1,src:'Chapter 8 · The Extraordinary',run(L){
  L.h(L.kick('learn','Patterns, not one-offs')+'<h1 class="q">Not a 360 review, and not a single voice</h1>'+
   L.lanes([['star','How it differs','Unlike popular 360° reviews, it looks only at <b>strengths</b>, asks people you <b>respect who know you</b>, and covers personal life as well as work.',2],
            ['layers','How to read it','Act on <b>patterns</b>. If only one person sees something, don’t make it a priority. The same goes for criticism.',3]])+
   L.prose('This matters for clients: most leaders rarely, maybe never, get unfiltered feedback. Staff fear seeming to flatter, peers are rivals, bosses think their job is to find fault, and family is often the hardest audience of all. An advisor can fill that gap.'));
  L.done();}},
{part:1,src:'Chapter 8 · The Extraordinary',pts:4,run(L){
  L.h(L.kick('pr','Build on it?')+'<h1 class="q">Rowan runs the exercise with Dana. Sort what comes back.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['A pattern: build on it','A one-off: don’t prioritize'],[
   ['Four of five people name Dana’s eye for boat design',0,'Most respondents see it, so it’s a real strength to lean on.'],
   ['One cousin says Dana is “a natural salesperson”',1,'Only one person sees it. Note it, but don’t make it a priority.'],
   ['Dana’s spouse and two crew leads all mention calm in a crisis',0,'Seen at home and at work, by several people: a pattern.'],
   ['A single board member calls Dana “a poor planner”',1,'One critic may say more about them than about Dana. Patterns count for weaknesses too.']],
   'Strengths are strengths whatever the setting. Build on what several respected people see.');}},

/* ---------- PART 3: PURPOSE ---------- */
{part:2,src:'Chapter 8 · The Purpose Behind Passion',run(L){
  L.h(L.kick('learn','The purpose behind passion')+'<h1 class="q">The work should never feel like a burden</h1>'+
   L.prose('One author treats advising as a sport: a healthy competition they enjoy. If an advisory call ever feels like a chore, the authors say, you’re in the wrong business. The pursuit itself should fulfill you.')+
   L.prose('Ask yourself, and your clients:')+
   L.list([['compass','What is my purpose?','And is it fulfilling?'],['target','Do I have a mission?','And how will I know I’m succeeding at it?'],['flame','What’s my default?','Is it happiness and enthusiasm?']],1)+
   L.note('You can’t teach enthusiasm or energy, but you can coach them. Don’t dampen yours for fear of “taking over.” Humility means recognizing others’ worth, not putting yourself down.','bulb'));
  L.done();}},
{part:2,src:'Chapter 8 · Case Study Vignette (Boston College)',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">The lawyer whose balance was “just work”</h1>');
  L.beats(L.card,[
   ['The claim','In a class on life balance, Harry, a law-firm partner, said he loved his work and happily worked until 2 a.m. six or seven days a week.'],
   ['The questions','The author asked about Harry’s young son, who played soccer. Had Harry taught him? No, he had coaches. Seen his games? One or two a season.'],
   ['The defense','Harry said his work paid for the coaching, so he didn’t feel bad about it.'],
   ['The reply','The author said to worry about how the son felt. He’d never be seven again, and the job would always be there.'],
   ['The contrast','The authors also met a senior police officer who talked about everything except police work until asked. Being well-rounded made him a better leader.']],
   'Harry wasn’t passionate, just a workaholic. People who can only talk about their specialty are less effective, and less attractive to others.');}},
{part:2,src:'Chapter 8 · The Purpose Behind Passion',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Dana says: “Boats are my passion. 75 hours a week, no hobbies, and I’m fine with that.” How would the authors read this?</h1>');
  L.mc(L.card,['More like a workaholic’s narrow focus','A model of true passion for the work'],0,
   'Like Harry, Dana equates long hours with passion. The authors want passion with balance: a well-rounded person is more effective.',
   'The book’s lawyer said the same. The authors called it workaholism, not passion, and pointed to the cost at home.');}},
{part:2,src:'Chapter 8 · The Purpose Behind Passion',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Passion or grind?',['Passion with purpose','A grind'],[
   ['Kofi says, “I have to go work on my woodworking this weekend.”',1,'A hobby treated as work is an oxymoron. It should relieve stress, not add to it.'],
   ['Mireille lights up describing a new sourdough and can’t wait to test it.',0,'That’s the pursuit itself fulfilling them.'],
   ['Rowan dreads Thursday client calls and puts them off until evening.',1,'If advisory calls feel onerous, the authors say you’re in the wrong business, or need to find your purpose again.'],
   ['A Table member spends Saturday sailing with family and comes back full of ideas.',0,'Well-rounded and refreshed: passion with balance.']]);}},
{part:2,src:'Chapter 8 · The Purpose Behind Passion',pts:1,run(L){
  L.h(L.kick('pr','Humility')+'<h1 class="q">A new prospect asks Rowan if they can help with a family-succession fight. Rowan can. What should Rowan say?</h1>');
  L.mc(L.card,['“I’m not sure I’m the best person for it.”','“Maybe, but I’d hate to overpromise.”','“I can help you, and we can start soon.”'],2,
   'Humility is recognizing others’ worth, not debasing yourself. Nobody asks for a humbler heart surgeon. Clients need talent and candor.',
   'Playing it down isn’t humility. The authors say too few people are bold enough to say “I can help you.” Passion gives you the nerve.');}},

/* ---------- PART 4: DIRECTION AND JOY ---------- */
{part:3,src:'Chapter 8 · The Limits of Passion',run(L){
  L.h(L.kick('learn','The limits of passion')+'<h1 class="q">Passion has to be controlled and aimed</h1>'+
   L.prose('Like any emotion, passion can run out of control. Sports fans can lift a team, or turn violent. The authors want passion short of zealotry: <b>influence and persuade, don’t “convert.”</b>')+
   L.prose('Aim matters too. Under the '+L.g('hundred','100 percent factor')+', all your energy goes either inside the organization or outside it:')+
   L.lanes([['home','Internal','Office politics, gossip, credit-taking, the corner office. About <b>20%</b> at most.',4],
            ['people','External','Customers, prospects, products, referrals. About <b>80%</b>, in the authors’ experience.',2]])+
   '<p class="small" style="margin-top:10px">It’s a hydraulic system: when the share shifts inward, the business struggles. Remote work can push the inward share to 40% or worse.</p>');
  L.done();}},
{part:3,src:'Chapter 8 · The Limits of Passion',pts:1,
 solve:async L=>{L.$('#pr').children[1].click();L.$('#go2').click();},
 run(L){
  let p=null;const M=[[80,50,70,80,80,80],[80,60,40,20,6,1]];
  const mt=(id,c)=>'<div class="meterrow"><div class="lb">External</div><div class="meter"><div id="'+id+'" style="background:'+c+';width:80%"></div></div></div>';
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">Mireille must close two Copperline cafés. Which plan keeps staff focused on customers?</h1><div id="pr"></div>'+
   '<div id="sim" hidden><div class="week" id="mo" style="margin:6px 0">Month 0</div>'+
   L.lanes([['alert','Strung out','Close one now, “review” the other, hint at more.'+mt('ma','var(--no)')+'<div class="res" id="ta"></div>',4],
            ['check','One bold move','Announce both closures at once, clearly.'+mt('mb','var(--ok)')+'<div class="res" id="tb"></div>',2]])+
   '<button class="btn pri" id="go2" style="margin-top:12px">'+L.ic('play')+'Run six months</button><p class="small">Illustrative numbers.</p></div>');
  ['Spread it out, one at a time','Do it in one clear move'].forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=n;b.onclick=()=>{if(p!==null)return;p=j;b.classList.add('sel');L.$('#sim').hidden=false;};L.$('#pr').appendChild(b);});
  L.$('#go2').onclick=function(){this.remove();let m=0;
    const t=setInterval(()=>{m++;const mo=L.$('#mo');if(!mo){clearInterval(t);return;}mo.textContent='Month '+m;
      const a=L.$('#ma'),b=L.$('#mb');if(a)a.style.width=M[1][m-1]+'%';if(b)b.style.width=M[0][m-1]+'%';
      if(m>=6){clearInterval(t);
        L.$('#ta').innerHTML='<span style="color:var(--no)">Staff hide and swap rumors. Customers drift away.</span>';
        L.$('#tb').innerHTML='<span style="color:var(--ok)">A hard month, then focus returns to customers.</span>';
        L.award(p===1);L.sheet(p===1?'ok':'no',p===1?'You called it!':'The bold move won','The authors say to cut staff in one complete, bold move. String it out and nobody works: focus goes almost entirely inward, and customers begin to disappear.');L.done();}},400);};}},
{part:3,src:'Chapter 8 · The Limits of Passion',run(L){
  L.h(L.kick('learn','Passion is about outcomes')+'<h1 class="q">Nobody needs a drill. They need holes.</h1>'+
   L.prose('Fixing the roof is a required task; finding a new home is something you can be passionate about. The authors aren’t passionate about workouts, but they are about a long, healthy life.')+
   L.flow([['list','Task','Asking for referrals','dull on its own',4],['star','Outcome','A thriving practice','worth the passion',2]])+
   L.prose('Help clients get passionate about the <b>results</b>, and the tasks along the way get easier. Do it yourself too.'));
  L.done();}},
{part:3,src:'Chapter 8 · The Purpose Behind Passion',pts:1,run(L){
  L.h(L.kick('pr','Rowan goes first')+'<h1 class="q">Rowan hates asking for referrals, so they keep skipping it. What fits the chapter’s advice?</h1>');
  L.mc(L.card,['Keep their eye on new business, and ask three people a day for named introductions','Wait until clients feel like offering names, so the request never seems pushy','Send every client an email asking if they know anyone who might need help'],0,
   'Passion for the outcome carries the task. The authors suggest three calls a day, prepared, asking for a specific introduction by name.',
   'The authors advise asking for introductions by name (“your counterpart on the West Coast”), not vague names, three calls a day, fueled by passion for new business.');}},
{part:3,src:'Chapter 8 · Joy',run(L){
  L.h(L.kick('learn','Joy')+'<h1 class="q">Working well and being happy reinforce each other</h1>'+
   L.prose('The authors cite Harvard psychologist Dan Gilbert: in their reading of his work, '+L.g('synthetic','synthetic happiness')+' matters as much as the conventional kind.')+
   L.lanes([['star','Conventional','Birthdays, graduations, wins, promotions: joy when you’d expect it.',2],
            ['cycle','Synthetic','“That hospital stay made me rethink my priorities.” Joy you build from a setback.',3]])+
   L.prose('Pair it with '+L.g('rational','rational optimism')+': not trusting fate, but seeing the real chances in a situation. One coffee-shop owner blamed the rain, then the sun, for bad business. His gloom drove customers away.'));
  L.done();}},
{part:3,src:'Chapter 8 · Joy',run(L){
  L.h(L.kick('ex','Happiness and meaning')+'<h1 class="q">Four kinds of life: tap each card</h1>');
  L.flips(L.card,[
   ['High meaning, high happiness','A successful life: contributing and receiving value, loving and being loved. The most productive people the authors have met.'],
   ['High happiness, low meaning','Addictive: always needing stimulus, not quality outcomes. Workaholics and perfectionists who fix typos but miss the content.'],
   ['High meaning, low happiness','Worthwhile work that doesn’t fulfill. These people contribute but don’t feel motivated or appreciated.'],
   ['Low meaning, low happiness','Merely surviving: going through the motions, every day the same as the last.']],
   'An advisor’s aim, for themselves and their clients, is high meaning and high happiness.');}},
{part:3,src:'Chapter 8 · Joy',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Name the attitude',['Conventional happiness','Synthetic happiness','Rational optimism','Blind optimism'],[
   ['Mireille throws a party for Copperline’s tenth anniversary.',0,'Joy at an expected milestone is conventional happiness.'],
   ['Kofi: “Losing that customer was the push we needed to stop relying on one account.”',1,'Finding the good in a setback is synthetic happiness.'],
   ['Dana says the boat market “always comes back” and changes nothing.',3,'Trusting fate without looking at the facts is blind optimism.'],
   ['Kofi notices clinics using the booking tool in a new way and asks what it could become.',2,'Seeing real opportunity in the situation is rational optimism.'],
   ['After a cold winter, Mireille sees students studying in the cafés and plans evening hours.',2,'Spotting a real opening in hard conditions: rational optimism.']]);}},
{part:3,src:'Chapter 8 · Joy',pts:1,run(L){
  L.h(L.kick('pr','Allow yourself to be happy')+'<h1 class="q">The Table emerges from a slow year. Some members are cutting every cost and “hunkering down.” What would the authors tell them?</h1>');
  L.mc(L.card,['Their sector decides how they’ll come out of it','Their attitude decides how they’ll come out of it','Their savings decide how they’ll come out of it'],1,
   'As the pandemic eased, the authors predicted that firms preparing for growth would ride the wave and the hunkered-down would be tossed about. Same sectors; different attitude.',
   'The authors say the difference between firms that ride a recovery and those tossed about isn’t sector or clients. It’s attitude.');}}
  ]
});
</script>
</body>
</html>
