<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shared Experience Mastery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0003', title:'Shared experience mastery', minutes:19, icon:'chat',
  goals:['Listen your way to common ground with a client, without judging or projecting','Use ISAR and the “drama” exercise to share an experience that moves a client','Keep a story log and draw out a client’s own stories'],
  parts:['Listen first','No authority','The drama','Story logs'],
  read:'Read chapter 3 of the book for the full case stories, including the West Point graduate and the CFO who wasn’t fired.',
  glossary:{
    projection:'Projection: assuming other people share your own strengths and weaknesses, such as warning someone off a ski slope because you struggled on it.',
    isar:'ISAR: a two-minute drill for sharing an experience: Issue, Situation, Action, Result.',
    'story-log':'Story log: a simple list or spreadsheet of your stories, each tagged with a keyword, so you can find the right one for a client.',
    'rhetorical-permission':'Rhetorical permission: a polite “Excuse me, may I interrupt?” that nobody really refuses, used to stop and dig into something a client just said.'
  },
  cheatsheet:[
    '<b>Shared experiences build trust</b>, and trust is what lets a client accept feedback and change.',
    '<b>Listen 80% of the time.</b> Common ground hides in family, travel, hobbies, civic life, not just business.',
    'Share <b>without judging or projecting</b> your own strengths and weaknesses onto the client.',
    'You have <b>accountability but no authority</b>, so share experiences instead of telling people what to do.',
    '<b>ISAR</b>: Issue, Situation, Action, Result. For each, ask “what have we experienced?”',
    'The <b>drama</b>: a time and place, a realistic character, a surprise, and a business point made without judgment.',
    'Executives are paid for <b>results, not action</b>. Sometimes waiting is the right move.',
    'Keep a <b>story log</b>, mine the client’s stories (“What’s your story?”), and never try to be the smartest person in the room.'
  ],
  steps:[
/* ---------- PART 1: LISTEN FIRST ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Dana is stuck on a hard talk with their cousin Jules. Rowan, their advisor, wants Dana to actually take the advice. Which approach is Dana more likely to welcome?</h1>');
  L.mc(L.card,['Rowan lays out exactly what Dana must say','Rowan tells of a time they faced the same thing'],1,
   'Most people bristle at being told what to do. A shared experience says “I’ve been there too,” and that makes advice easier to hear. This lesson is about using that on purpose.',
   'Being told what to do turns most people off. A story of “I faced this too” builds a bond that makes advice easier to accept. This lesson is about using that on purpose.');}},
{part:0,src:'Chapter 3 · Who’s in Their Shoes?',run(L){
  L.h(L.kick('learn','Who’s in their shoes?')+'<h1 class="q">Common ground is what makes feedback stick</h1>'+
   L.prose('The last lesson showed that feedback lands best when it comes through a <b>shared experience</b>. The authors say that shared experience creates a bond that cements a person’s ability to accept feedback and change.')+
   L.prose('So an advisor needs to find common ground. The book lists many parts of a client’s life where it can hide:')+
   '<div style="display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px">'+['Work setting','Work content','Their role','Business travel','Holidays','Family','Health and fitness','Recreation','Entertainment','Civic life','Hobbies','Giving','Professional groups','Hopes and goals'].map(x=>'<span class="chip static">'+x+'</span>').join('')+'</div>'+
   L.note('You don’t need to connect on all of them. <b>A few will do.</b> The wider your own experience, the easier it is to find them.','people'));
  L.done();}},
{part:0,src:'Chapter 3 · Who’s in Their Shoes?',run(L){
  L.h(L.kick('learn','Listen, and don’t project')+'<h1 class="q">Talk less, learn more, and keep your own baggage out of it</h1>'+
   L.prose('The authors suggest <b>listening 80% of the time</b>. The more you talk, the less you learn. Don’t rush to the business issues; listen for those other parts of the client’s life.')+
   L.prose('When you do share, keep it judgment-free and free of '+L.g('projection','projection')+': assuming others have your own strengths and weaknesses.')+
   L.lanes([['x','Projecting','“Don’t try the blue slope your first day. Stick to the green ones.” (Said by someone who couldn’t manage the blue slope themselves.)',4],
            ['check','Sharing','“My first day on skis, I froze at the top of the blue slope. What’s your plan for tomorrow?”',2]])+
   '<p class="small" style="margin-top:10px">The book’s rule: no judging, no projecting. Listen and empathize instead.</p>');
  L.done();}},
{part:0,src:'Chapter 3 · Who’s in Their Shoes?',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Kofi says they might write a short guide for clinic owners. Which reply from Rowan is projection?</h1>');
  L.mc(L.card,['“What would you most want clinic owners to learn?”','“Writing is brutal. You’ll never find the time.”','“I wrote one once. The hardest part was starting.”'],1,
   'Rowan is pinning their own struggle on Kofi. The book warns against exactly this: telling people how hard something will be for them because it was hard for you.',
   'That reply is fine. The projecting one is “You’ll never find the time”: Rowan assumes their own struggle will be Kofi’s too.');}},
{part:0,src:'Chapter 3 · Who’s in Their Shoes?',pts:1,
 solve:async L=>{const g=L.$('#tg').children;g[0].click();g[1].click();},
 run(L){
  const M=[['Rowan talks 60%',[['Work content','Mireille mentions the ovens keep breaking down.']]],
           ['Rowan listens 80%',[['Work content','The ovens keep breaking down.'],['Family','Their grandmother ran a village bakery.'],['Holidays','They spent a year learning to bake in Lyon.'],['Health and fitness','They run every Sunday at dawn.'],['Civic life','They want a food-bank partnership.']]]];
  const seen=new Set();
  L.h(L.kick('pr','Toggle and compare')+'<h1 class="q">Rowan has a first lunch with Mireille. Try both ways of spending it and see what Rowan learns.</h1><div id="tg"></div>'+
   '<div style="background:var(--soft);border-radius:16px;padding:14px;margin:8px 0 6px;min-height:150px"><div class="small" id="tc" style="margin-bottom:8px">Choose how Rowan spends the lunch.</div><div id="ta"></div></div><div id="tq"></div>');
  M.forEach((m,j)=>{const b=document.createElement('button');b.className='chip';b.innerHTML=L.ic(j?'eye':'chat')+m[0];b.onclick=()=>{[...L.$('#tg').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(j);
    L.$('#tc').innerHTML='<b>'+m[1].length+'</b> part'+(m[1].length>1?'s':'')+' of Mireille’s life Rowan learned about';
    L.$('#ta').innerHTML=m[1].map(a=>'<div style="margin:6px 0"><span class="chip static ok">'+L.ic('check')+a[0]+'</span> <span class="small">'+a[1]+'</span></div>').join('');
    if(seen.size===2&&!L.$('#tq').innerHTML){const q=L.$('#tq');q.innerHTML='<h2 class="sub">Rowan’s grandparents ran a market stall. What does the listening lunch give Rowan?</h2>';
      L.mc(q,['A family story they can genuinely share','A quicker way into the oven problem'],0,
       'Listening surfaced the grandmother’s bakery. Rowan can now share a real family story, and that common ground makes later advice easier to hear.',
       'Rushing to business is what the book warns against. Listening surfaced the grandmother’s bakery, which gives Rowan real common ground to share.');}};L.$('#tg').appendChild(b);});}},
{part:0,src:'Chapter 3 · Who’s in Their Shoes?',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Sharing, judging or projecting?',['Judgment-free sharing','Judging','Projecting'],[
   ['Dana mentions their 75-hour weeks. Rowan: “I did 70-hour weeks at the distributor for years. Here’s what it cost me.”',0,'Rowan shares their own experience and lets Dana draw the lesson.'],
   ['Mireille says they skipped two checkups. Rowan: “That’s just irresponsible for someone in your job.”',1,'That’s a verdict on Mireille, not a shared experience. It invites defense, not change.'],
   ['Kofi wants to try rock climbing. Rowan: “You’ll freeze halfway up like I did. Try an indoor wall first.”',2,'Rowan assumes their own weakness will be Kofi’s.'],
   ['Dana says the family board scares them. Rowan: “My first board meeting, my hands shook. What worries you most?”',0,'A real shared moment, then a question back to Dana. No judging, no projecting.']]);}},

/* ---------- PART 2: NO AUTHORITY ---------- */
{part:1,src:'Chapter 3 · Who’s in Their Shoes?',run(L){
  L.h(L.kick('learn','Accountability, no authority')+'<h1 class="q">An advisor can’t order anyone to do anything</h1>'+
   L.prose('The book points out a key difference between you and your client:')+
   L.lanes([['person','The advisor','Is accountable for helping, but has <b>no authority</b> over anyone.',1],
            ['people','The client','Has <b>both</b> accountability and authority over their people, so they can use reward and punishment.',3]])+
   L.prose('So you need a different approach. Telling people what to do turns most of them off. Boasting about how you’d do it better drives them crazy.')+
   L.note('Shared experiences are that different approach. They create empathy and lead to <b>new directions you agree on together</b>.','compass'));
  L.done();}},
{part:1,src:'Chapter 3 · Case Study Vignette (Prudential)',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">A new hire’s blunder, and a manager who shared instead of scolding</h1>');
  L.beats(L.card,[
   ['The mistake','Early in a career at Prudential, one of the authors sent a customer a document that was meant to stay internal and confidential.'],
   ['The calm fix','The manager, Bob, sat down and patiently walked through the right procedure.'],
   ['The shared experience','Then Bob told a story: at about the same age, he had approved a large claim that should never have been paid and could not be recovered. He expected to be fired.'],
   ['The twist','His own boss told him the company had just invested that money in his training, so he was too valuable to let go.'],
   ['The effect','The author says they have tried to copy that approach ever since.']],
   'Bob had authority, yet chose a shared experience over a lecture. It turned a mistake into loyalty and learning.');}},
{part:1,src:'Chapter 3 · Who’s in Their Shoes?',run(L){
  L.h(L.kick('learn','ISAR')+'<h1 class="q">A two-minute drill for sharing an experience</h1>'+
   L.prose('The authors use a short drill in small groups when training advisors. They call it '+L.g('isar','ISAR')+':')+
   L.flow([['target','Issue','What needs resolving?','',1],['people','Situation','Who and what surrounds it?','',2],['pointer','Action','What’s the best step?','',3],['check','Result','What do we want, and did it work?','',4]])+
   L.prose('For each letter, ask: <b>what have we experienced</b> that gives us common ground? Say the issue is presenting to big groups and the room is skeptical. Where have you met skepticism? What did you learn about getting everyone into the Q&amp;A?')+
   '<p class="small">The goal is a feeling of “we’re walking through this together.” Once you show it, the client can do the same with their own people.</p>');
  L.done();}},
{part:1,src:'Chapter 3 · Who’s in Their Shoes?',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Put the ISAR questions in order.</h1>');
  L.order(L.card,['What needs resolving?','Who and what surrounds it?','What’s the best step to take?','What do we want, and did it work?'],
   'Issue, Situation, Action, Result. At each step, look for an experience you share.',['Issue','Situation','Action','Result']);}},
{part:1,src:'Chapter 3 · Who’s in Their Shoes?',pts:5,run(L){
  L.h(L.kick('pr','Prep an ISAR share')+'<h1 class="q">Rowan preps a two-minute share for Dana about the talk with Jules. Which ISAR step does each of Rowan’s questions serve?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Issue','Situation','Action','Result'],[
   ['When did I have to tell a friend their work wasn’t good enough?',0,'That’s the core problem to resolve: a hard talk about poor performance.'],
   ['Where have I seen family on a board make hard news harder?',1,'The family board is the surrounding situation, the people and setting around the issue.'],
   ['What did I actually say in that talk, and what worked?',2,'That’s about the step taken, the intervention.'],
   ['How did it end, and did the friendship survive?',3,'That’s the outcome: what was wanted and whether it worked.'],
   ['Who else at the distributor was watching how I handled it?',1,'The people around the issue belong to the situation.']],
   'Each question digs up a piece of Rowan’s own experience that matches Dana’s. Together they make a story Dana can relate to.');}},
{part:1,src:'Chapter 3 · Who’s in Their Shoes?',pts:1,run(L){
  L.h(L.kick('pr','What should Rowan do?')+'<h1 class="q">After a Table session, Dana says: “Just tell me what to do about Jules.” What fits the book best?</h1>');
  L.mc(L.card,['Give Dana a firm script and a deadline to use it','Say it’s Dana’s call and change the subject','Share a similar case, then work out the next step together'],2,
   'Rowan has no authority, and orders tend to turn people off. A shared experience builds empathy and leads to a direction they both agree on.',
   'The book’s path is a shared experience that leads to a direction both agree on. A script is telling, which turns most people off; dodging leaves Dana with no help at all.');}},

/* ---------- PART 3: THE DRAMA ---------- */
{part:2,src:'Chapter 3 · The Drama of It All',run(L){
  L.h(L.kick('learn','The drama of it all')+'<h1 class="q">Turn an experience into a short story with four parts</h1>'+
   L.prose('The authors offer an exercise to make shared experiences more powerful. It is really a form of storytelling, and stories work because people can relate to them.')+
   L.list([['clock','A time and place','Set the scene: when and where it happened.'],
           ['person','A realistic character','Someone the listener can picture and identify with.'],
           ['alert','A surprise','A dramatic event that raises the stakes.'],
           ['bulb','A business point','The lesson, made without judging anyone.']],3)+
   L.note('Stories transfer value. They let people learn from others’ good and bad experiences.','book'));
  L.done();}},
{part:2,src:'Chapter 3 · The Drama of It All',run(L){
  L.h(L.kick('ex','The book’s own example')+'<h1 class="q">A Friday in tax season</h1>');
  L.beats(L.card,[
   ['Time and place','A Friday afternoon in the busiest season at a finance firm.'],
   ['Character','The CEO must guide staff late into the night on deadlines that can’t be missed, and has promised to attend their 12-year-old daughter’s music recital.'],
   ['Surprise','The spouse calls to confirm the evening. Panic. The CEO asks for advice; the spouse says their daughter will be crushed if the CEO isn’t there.'],
   ['The options','The recital can’t be made up. The work can: trusted aides can oversee it, the CEO can come in at the weekend, deadlines can often move, or a penalty can be accepted.'],
   ['The point','Life priorities. For the future, prevent the crunch with better staffing, longer deadlines and more confident delegation.']],
   'The story makes a point about priorities without lecturing. The more such moments you’ve lived or advised on, the more believable your stories are.');}},
{part:2,src:'Chapter 3 · Case Study Vignette (the CFO)',run(L){
  L.h(L.kick('ex','Results, not action')+'<h1 class="q">Sometimes the best move is to wait</h1>'+
   L.prose('Many executives think telling people what to do is their job, because they’re paid to act. The authors disagree:')+
   L.quote('Executives are NOT paid to take action; they are paid to achieve results.','The authors, chapter 3'));
  L.beats(L.card,[
   ['The urge','A CEO, Terry, decides his slow, error-prone CFO should go now. The banks are complaining about late reports. Terry plans to cover the job himself.'],
   ['The shared experience','The advisor tells of another client who tried the same thing. The stand-in was out of her depth, the controller was weak, and the CEO couldn’t carry it all.'],
   ['The result','Terry hadn’t seen those risks. Despite others urging a quick firing, he waited until the deadlines were met and hired a replacement three months later.']],
   'Doing nothing, for now, can be exactly what’s needed, even though it feels undramatic. A shared experience, good or bad, helped the client see it.');}},
{part:2,src:'Chapter 3 · The Drama of It All',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">After losing their biggest customer, Kofi hears from a board member: “Cut staff this week. Show you’re in charge.” What should Rowan help Kofi focus on?</h1>');
  L.mc(L.card,['The result Kofi needs, even if it means waiting','A bold move this week to calm the board'],0,
   'Executives are paid for results, not action. Rowan can share a case where acting fast backfired, so Kofi sees the risks before deciding.',
   'That’s the “do something, now” advice the book says often fails leaders. Executives are paid for results, so focus on the result first.');}},
{part:2,src:'Chapter 3 · The Drama of It All',pts:1,run(L){
  L.h(L.kick('pr','Build a story')+'<h1 class="q">Rowan wants Dana to delegate more. Tap each piece until the story has all four drama parts.</h1>');
  L.sentence(L.card,[['Once, a while back,','On a Friday in peak launch season,'],['a perfect, unflappable leader','a CEO who did every job themselves'],['got the usual weekly report,','learned their only welder had quit,'],['so Dana is doing it all wrong.','so train a backup before a crisis.']],[1,1,1,1],
   [['That’s vague. The drama needs a clear time and place.'],['Nobody relates to a perfect leader. Make the character realistic.'],['A routine report isn’t a surprise. The story needs a dramatic event.'],['That judges Dana. The business point should be made without judgment.']],
   'A time and place, a realistic character, a surprise and a judgment-free point. Dana can see themselves in it without feeling attacked.');}},
{part:2,src:'Chapter 3 · The Drama of It All',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which drama part is missing?',['Time and place','Realistic character','A surprise','Business point'],[
   ['“A plant manager I knew, on a Monday in March, was handed a recall notice by a customer. And that’s what happened.”',3,'The story ends without a lesson. Add the business point, said without judgment.'],
   ['“Someone somewhere was having a normal day, then their main supplier went bust, so keep a second supplier.”',1,'“Someone somewhere” is no one the listener can picture.'],
   ['“Last June, at the distributor, our night-shift lead ran the shift as usual, so build slack into the schedule.”',2,'Nothing happens. Without a surprise, there’s no drama to remember.'],
   ['“A founder much like Kofi had their biggest client leave without warning, so spread your revenue.”',0,'We never learn when or where. A time and place makes it real.']]);}},

/* ---------- PART 4: STORY LOGS ---------- */
{part:3,src:'Chapter 3 · The Drama of It All',run(L){
  L.h(L.kick('learn','Keep a story log')+'<h1 class="q">Write your stories down so you can find them when it matters</h1>'+
   L.prose('Stories take away the pressure to be the smartest person in the room and to prove it by telling people what to do. Learning through stories makes the client feel part of a group of peers.')+
   L.prose('The authors keep a '+L.g('story-log','story log')+': a simple list, even a spreadsheet, with a keyword for each story. “Open gate” is their story about dogs racing through an open gate without weighing the risk. A client with dogs gets the point about being too cautious at once.')+
   L.note('One author says their memory isn’t great, yet the log held 126 stories and was still growing every week.','book'));
  L.done();}},
{part:3,src:'Chapter 3 · Mining the Client’s Experiences',run(L){
  L.h(L.kick('learn','Mine the client’s stories')+'<h1 class="q">Clients have a story log too. They just don’t know it.</h1>'+
   L.prose('When a client mentions something in passing, don’t let the moment go. Interrupt politely: “Sorry to interrupt, were you in that championship?” The book calls “Excuse me, may I interrupt?” a '+L.g('rhetorical-permission','rhetorical permission')+': polite, and nobody refuses it.')+
   L.prose('We often miss these moments because we’re busy planning our own next line. A friend of the authors opens every new conversation with <b>“What’s your story?”</b> and means it.')+
   L.list([['Dig in','Why was that notable? How did you feel? What led up to it?'],['Draw it out','What did you learn? How do you use it today, or could you in your role? Have you shared it with others?']],2));
  L.done();}},
{part:3,src:'Chapter 3 · Case Study Vignette (American Press Institute)',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">The woman whose life was “vanilla”</h1>');
  L.beats(L.card,[
   ['The claim','At a storytelling workshop for newspaper editors, a woman said she had nothing to share: her life was dull.'],
   ['The questions','One of the authors kept asking simple follow-ups. Where did you go to school? West Point, in the very first class to admit women.'],
   ['More','She had been the top-ranked student commander, then volunteered for the paratroops.'],
   ['The room','Everyone was fascinated. To her it was just her history. To everyone else, it was remarkable.'],
   ['Years later','She wrote to that author. She had become a Carmelite nun.']],
   'People don’t see their own stories. A few curious questions bring them out, and helping the client find their story log enriches the whole advisory relationship.');}},
{part:3,src:'Chapter 3 · Mining the Client’s Experiences',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Kofi says: “Right after my team’s robotics final, I realized something…” and keeps going. What should Rowan do?</h1>');
  L.mc(L.card,['Note it silently and ask about it next month','Politely interrupt and ask about the final now'],1,
   'Don’t let the moment go. “Sorry to interrupt, what final was that?” is polite, and it may uncover a story Kofi doesn’t know they have.',
   'The moment may not come back. The book says interrupt politely and dig in right then.');}},
{part:3,src:'Chapter 3 · Mining the Client’s Experiences',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'How did Rowan handle it?',['Mines the story','Takes the spotlight','Lets it slip'],[
   ['Mireille mentions a year in Lyon. Rowan: “Excuse me, may I ask what a day in that kitchen was like?”',0,'A polite interruption that digs into Mireille’s own story.'],
   ['Kofi mentions coaching robotics. Rowan: “I coached a team once too, and we won the whole thing.”',1,'Rowan turns Kofi’s moment into Rowan’s story. Park the ego: it’s not about you.'],
   ['Dana says their first boat nearly sank. Rowan: “Interesting. Anyway, back to the quarterly numbers.”',2,'A rich story, dropped. Ask how it felt, or what led up to it.'],
   ['Dana tells the boat story again. Rowan: “What did you learn from that, and how could you use it with your team now?”',0,'Drawing the lesson out and linking it to Dana’s current role is exactly the book’s list of questions.'],
   ['Mireille mentions their grandmother’s bakery while Rowan is planning their next point. Rowan just nods.',2,'Busy with their own next line, Rowan misses it. That’s the trap the book describes.']]);}},
{part:3,src:'Chapter 3 · Chapter Return on Investment',pts:1,run(L){
  L.h(L.kick('pr','What should Rowan do?')+'<h1 class="q">At a Table session, Rowan knows far more about supply chains than anyone present. A member asks how to handle a supplier crisis. What fits the chapter best?</h1>');
  L.mc(L.card,['Give a mini-lecture to show their depth of knowledge','Ask members for their stories, then add one of their own','Stay quiet so nobody thinks Rowan is showing off'],1,
   'Never try to be the smartest person in the room. Drawing out members’ stories and adding a shared one builds the peer learning the book describes.',
   'The chapter’s advice is to share, not lecture or vanish: mine the members’ stories and add one of your own, without trying to be the smartest person in the room.');}}
  ]
});
</script>
</body>
</html>
