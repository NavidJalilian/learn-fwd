<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Make Responding Easy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">

</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0009', title:'Make responding easy', minutes:19, icon:'pointer',
  goals:['Cut the steps a reader needs to act, from defaults to ready-made meeting times','Put everything a reader needs to act in the message itself','Ask narrow questions and spell out simple steps so acting takes little attention'],
  parts:['Why acting fails','Fewer steps','Info in one place','Less attention'],
  read:'Read chapter 9 of the book for the full studies on texts to parents, Medicare letters and the tax-credit notice.',
  glossary:{
    'action-message':'Action message: a message whose goal is for the reader to do something concrete, like sign up, reply, schedule or fill in a form, not just to understand it.',
    'default-option':'Default: what happens automatically if the reader does nothing. “Opt out” means you are in unless you say no; “opt in” means you are out unless you say yes.'
  },
  cheatsheet:[
    'In an <b>action message</b>, understanding isn’t enough. If acting looks costly, busy readers put it off, forget, or skip it. Make the request as easy as possible.',
    'Rule 1, <b>simplify the steps</b>: a default does the most (texts to parents: under 1% via a portal, 11% by replying START, 95% stayed in when opted in).',
    'When you can’t change the process, cut steps in your message: offer a length, specific days and times, and a time zone, or a sign-up link.',
    'Know your reader: a calendar link or a fixed plan can feel pushy or presumptuous in some settings.',
    'Rule 2, <b>organize the key information</b>: restate what the reader needs instead of “see my email from April 3.” Medicare letters with the facts inside nearly doubled switching.',
    'Rule 3, <b>minimize attention</b>: fewer choices, narrow yes/no questions, and a clear, simple “what you need to do.”',
    'Simple beats thorough: a tax-credit worksheet with seven criteria instead of two cut responses by 17%.'
  ],
  steps:[
/* ---------- PART 1: WHY ACTING FAILS ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Lena texts 60 volunteers about Saturday sorting. Which text will get more sign-ups?</h1>');
  L.mc(L.card,['“Log in to the volunteer site and pick a shift”','“Reply YES to sort this Saturday, 9 to 12”'],1,
   'One reply versus a login, a search and a form. Every extra step loses some busy readers. This lesson is about cutting them.',
   'Logging in, finding the calendar and picking a slot is several steps. Many busy volunteers will mean to do it later, then forget.');}},
{part:0,src:'Chapter 9 · Sixth principle: make responding easy',run(L){
  L.h(L.kick('learn','Two kinds of message')+'<h1 class="q">Some messages inform. Others need the reader to act.</h1>'+
   L.lanes([['book','Informational','The goal is for readers to notice and understand. Fennick’s newsletter story about a record month.',2],
            ['pointer','Action','The goal is for readers to <i>do</i> something: sign up, reply, order, donate, book a meeting.',3]])+
   L.prose('In an '+L.g('action-message','action message')+', understanding is not enough. A reader can get your request, even want to do it, and still not do it because it looks too hard or slow.')+
   L.flow([['eye','Understands','“Yes, I should order.”'],['clock','Acting looks costly','“I’ll do it later.”'],['x','Forgets','No order by Thursday noon.']])+
   L.note('The book’s short version: make the request as easy as possible to comply with.','bulb'));
  L.done();}},
{part:0,src:'Chapter 9 · Sixth principle: make responding easy',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Tomás reads Arjun’s ordering email, agrees an order is needed, and means to place it. Tomás still misses the deadline. What does the book say usually happens?</h1>');
  L.mc(L.card,['Tomás didn’t really understand the email','Acting felt costly, so Tomás put it off','Tomás didn’t care about the deadline'],1,
   'Busy readers who postpone often never come back. That’s why the ask itself must be easy.',
   'Tomás understood and wanted to act. The book’s point is that a costly-looking action gets put off, then forgotten.');}},
{part:0,src:'Chapter 9 · Sixth principle: make responding easy',pts:5,run(L){
  L.h(L.kick('pr','Inform or act?')+'<h1 class="q">Sort each Fennick message by its goal.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Informational','Action'],[
   ['Mei’s newsletter story about last month’s record sorting',0,'Mei wants readers to know and feel good. No step is needed.'],
   ['Lena’s ask to fill three Saturday shifts',1,'Success means volunteers sign up.'],
   ['Kofi’s request for a board vote on the truck lease',1,'Success means a vote by Friday.'],
   ['Arjun’s note that the warehouse closes on a holiday',0,'Readers just need to know. Nothing to send back.'],
   ['Jordan’s email asking the grocery manager for a call',1,'Success means a call gets booked.']],
   'For the action messages, being clear is step one. Making the action easy is step two, and it’s what this lesson covers.');}},

/* ---------- PART 2: FEWER STEPS ---------- */
{part:1,src:'Chapter 9 · Rule 1: Simplify the steps required to act',run(L){
  L.h(L.kick('learn','Rule 1 · Simplify the steps required to act')+'<h1 class="q">The easiest action is one that needs no effort at all</h1>'+
   L.prose('A '+L.g('default-option','default')+' is what happens if the reader does nothing. Paper bills are a default: customers get them unless they actively switch to paperless.')+
   L.lanes([['lock','Opt in','You are out unless you act. Workers get plan details and must take steps to enroll in a retirement plan.',3],
            ['check','Opt out','You are in unless you act. Workers are enrolled automatically and can leave any time.',2]])+
   L.prose('Studies consistently find opt-out enrollment raises retirement plan participation dramatically. Opt-out messages have also helped with organ donor sign-ups, flu shots and renewable-energy plans.'));
  L.done();}},
{part:1,src:'Chapter 9 · Rule 1: Simplify the steps required to act',pts:1,
 solve:async L=>{L.$('#po').children[2].click();L.$('#run').click();},
 run(L){
  let p=null;const N=['Log in to the portal','Reply START','Already in, reply STOP to leave'],C=['var(--h3)','var(--h2)','var(--ok-strong)'],F=[1,11,95];
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">Washington, DC schools invited parents of 6,976 students to weekly text updates on missed classes and grades. Three ways to sign up. Which kept the most parents enrolled?</h1><div id="po"></div>'+
   '<div id="race" hidden><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:6px"><div class="small">Parents enrolled</div><button class="btn pri" id="run">'+L.ic('play')+'Reveal</button></div>'+
   N.map((n,j)=>'<div class="meterrow"><div class="lb">'+n+' · <b id="c'+j+'">0</b>%</div><div class="meter"><div id="m'+j+'" style="background:'+C[j]+'"></div></div></div>').join('')+'</div>');
  N.forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=n;b.onclick=()=>{if(p!==null)return;p=j;b.classList.add('sel');L.$('#race').hidden=false;};L.$('#po').appendChild(b);});
  L.$('#run').onclick=function(){this.remove();let s=0;
    const t=setInterval(()=>{s++;F.forEach((f,j)=>{const v=f*s/10,c=L.$('#c'+j),m=L.$('#m'+j);if(c)c.textContent=(j===0&&s>=10?'under 1':Math.round(v));if(m)m.style.width=Math.max(v,1)+'%';});
      if(s>=10){clearInterval(t);L.award(p===2);
        L.sheet(p===2?'ok':'no',p===2?'You called it':'The default won','Logging in to a portal: <b>under 1%</b>. Replying START to the text: <b>11%</b>, more than ten times as many. Enrolled by default with a STOP option: <b>95%</b> stayed in. And students whose parents were in the opt-out group got better grades and failed fewer courses.');L.done();}},200);};}},
{part:1,src:'Chapter 9 · Rule 1: Simplify the steps required to act',run(L){
  L.h(L.kick('learn','What writers can control')+'<h1 class="q">You may not set the process, but you can cut steps in your message</h1>'+
   L.prose('Most of us can’t change how a program enrolls people. But we can make our own asks easier. Take meetings. A polite, open question like “Want to talk next week?” often starts a long back-and-forth.')+
   L.lanes([['chat','Open-ended','“Want to talk next week?” The reader must check their calendar, propose times and wait.',3],
            ['cal','Ready to answer','“Want to meet for 30 minutes next week? How about Tue (3/10) 10:30 am, Wed (3/11) 12:00 pm or Thu (3/12) 3:00 pm, all ET?”',2]])+
   L.prose('The second version also heads off the usual mix-ups: the dates show it’s <i>next</i> week, and “ET” settles the time zone. Fewer emails, and a better chance the meeting happens.'));
  L.done();}},
{part:1,src:'Chapter 9 · Rule 1: Simplify the steps required to act',run(L){
  L.h(L.kick('ex','A study from the book')+'<h1 class="q">A university asks alumni leaders for a meeting, two ways</h1>');
  L.beats(L.card,[
   ['The test','A university vice chancellor’s office emailed 115 alumni leaders asking for a short Zoom or phone meeting. Only the closing ask changed.'],
   ['Standard','Asked readers to reply with their availability so they could coordinate a time.'],
   ['Easier','Included a link to the writer’s calendar so readers could pick an open time themselves.'],
   ['The result','<b>33%</b> of the Easier group booked a meeting, versus <b>17%</b> of the Standard group. Nearly double.'],
   ['The caveat','Some people feel insulted by a calendar link, especially when the sender is the one asking for the meeting. It worked at this university; elsewhere it may feel intrusive.']],
   'Fewer steps worked here. But every rule depends on your readers and their context.');}},
{part:1,src:'Chapter 9 · Rule 1: Simplify the steps required to act',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Arjun wants a short visit to Dev’s school pantry to check their new freezer. Which ask is easiest for Dev to answer?</h1>');
  L.mc(L.card,['“Can I stop by to see the freezer sometime soon?”','“Can I stop by for 20 minutes Mon (3/9) or Wed (3/11) at 2 pm?”','“Let me know a time that works and I’ll make it fit.”'],1,
   'Dev can answer with one word. The length, dates and times are all there.',
   'It sounds flexible, but it hands the work to Dev: check the calendar, propose times, wait for a reply. Offer specific options.');}},
{part:1,src:'Chapter 9 · Rule 1: Simplify the steps required to act',pts:1,run(L){
  L.h(L.kick('pr','Fewest steps last')+'<h1 class="q">Lena is testing ways for regular volunteers to sign up for next month’s Saturdays. Put them in order, from the most effort for the volunteer to the least.</h1>');
  L.order(L.card,['Log in to the volunteer site, find the calendar, pick a slot','Click a sign-up link and tap a slot','Reply YES to Lena’s text','Stay on the roster unless you reply NO'],
   'Like the parent texts: a portal is hardest, a one-word reply is far easier, and a default with an easy way out needs no effort. Lena should still know the volunteers: an automatic roster suits regulars, not newcomers.',
   ['Most effort','','','Least effort']);}},
{part:1,src:'Chapter 9 · Rule 1: Simplify the steps required to act',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Easy to answer, or too pushy?',['Easy and fitting','Too pushy here'],[
   ['Jordan, to a grocery manager they’ve never met: “I’ll see you Tuesday at 6:30 at your store unless I hear otherwise.”',1,'It decides for the reader. To someone you’re asking a favor of, offer options instead.'],
   ['Lena, to the regular sorters: “Can you sort Sat (3/14)? Reply 1 for 9–12 or 2 for 1–4.”',0,'Two clear options and a one-key reply. Easy and polite.'],
   ['Jordan, to a board member who asked to meet: “Would 30 minutes Thu (3/12) at 10 am or Fri (3/13) at 2 pm ET work?”',0,'Specific times save the back-and-forth without forcing a yes.'],
   ['Kofi, to a city council member: “Pick a slot on my calendar link to meet about our grant.”',1,'Kofi is the one asking. Some people feel insulted by a calendar link in that situation, so offer a few times instead.']]);}},

/* ---------- PART 3: INFO IN ONE PLACE ---------- */
{part:2,src:'Chapter 9 · Rule 2: Organize key information needed for action',run(L){
  L.h(L.kick('learn','Rule 2 · Organize key information needed for action')+'<h1 class="q">Don’t make readers dig</h1>'+
   L.prose('Put the details a reader needs to act right in your message, and use the clarity and design rules so they stand out.')+
   L.lanes([['x','Saves the writer time','“See my email from April 3 and let me know what you think.” The reader now hunts through a long chain.',3],
            ['check','Saves the reader time','Restate what matters from April 3 in two lines, then ask the question.',2]])+
   L.note('If readers have to go find the information, they are more likely to put the task off, and then forget it.','alert'));
  L.done();}},
{part:2,src:'Chapter 9 · Rule 2: Organize key information needed for action',run(L){
  L.h(L.kick('ex','A study from the book')+'<h1 class="q">Medicare drug plans: same facts, different place</h1>');
  L.beats(L.card,[
   ['The setup','A 2006 law gave people on Medicare a prescription drug benefit, with dozens of plans to choose from. Letters pointed them to a website with personal cost details, via an 84-character link.'],
   ['The barrier','To use it, people had to type that link, then find and compare plans on the site. That takes a lot of time and effort.'],
   ['The test','Government researchers sent 5,873 recipients one of two letters. Half got the usual letter, the link and a booklet on using the site.'],
   ['The simpler letter','The other half got the key facts in the letter: their current plan, the lowest-cost plan, a recommended plan and how much they could save by switching.'],
   ['The result','Switching rose from <b>17%</b> to <b>28%</b>, almost double, even though the same facts were free online. Had everyone got the simpler letter, the average person would have saved about $100 a year.']],
   'Collect and pare down what readers need, and put it where readers already are: in your message.');}},
{part:2,src:'Chapter 9 · Rule 2: Organize key information needed for action',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">The board needs to vote on the truck lease. Kofi’s draft says “See Arjun’s email from March 2 for the quotes.” What should Kofi do?</h1>');
  L.mc(L.card,['Forward Arjun’s email again so it’s on top','Restate the cost and terms in Kofi’s own message','Attach every email in the thread for context'],1,
   'Two lines ($1,900 a month for three years) and the ask. Board members can vote without searching.',
   'That still sends readers off to read and dig. Put the few facts they need to vote right in Kofi’s message.');}},
{part:2,src:'Chapter 9 · Rule 2: Organize key information needed for action',pts:1,
 solve:async L=>{const c=L.$('#tt').children;c[0].click();c[1].click();},
 run(L){
  const seen=new Set(),V=['Version A','Version B'];
  const S=[[['search','Find the welcome email from January for the login'],['search','Dig up last week’s email for the item list'],['search','Check an old flyer for the deadline'],['pointer','Place the order']],
           [['pointer','Tap the link, log in with the username shown'],['check','Order from the item list in the message, by Thursday noon']]];
  L.h(L.kick('pr','Toggle and compare')+'<h1 class="q">Arjun is writing to Tomás about this week’s order. Version A says “Order online as usual, details in earlier emails.” Version B includes the link, Tomás’s username, this week’s items and the deadline. Try both.</h1><div id="tt"></div><div id="rd" style="margin:8px 0"></div><div id="tq"></div>');
  V.forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.innerHTML=L.ic(j?'check':'list')+n;
    b.onclick=()=>{[...L.$('#tt').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(j);
      L.$('#rd').innerHTML='<div class="small" style="margin-bottom:6px"><b>'+S[j].length+' steps</b> for Tomás</div>'+S[j].map(x=>'<div style="background:var(--soft);border-radius:14px;padding:10px 12px;margin:6px 0">'+L.ic(x[0]==='search'?'eye':x[0])+x[1]+'</div>').join('');
      if(seen.size===2&&!L.$('#tq').innerHTML){const q=L.$('#tq');q.innerHTML='<h2 class="sub">Which version is Tomás more likely to act on today?</h2>';
        L.mc(q,['Version B, with everything in one place','Version A, because it is shorter to read'],0,
         'Every search is a chance to put the order off. B turns four steps with three hunts into two.',
         'Shorter to read, but slower to act on. Each hunt for a login or list is a chance for Tomás to say “later.”');}};
    L.$('#tt').appendChild(b);});}},
{part:2,src:'Chapter 9 · Rule 2: Organize key information needed for action',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Is the key info organized for action?',['Yes, ready to act','No, reader must dig'],[
   ['Lena: “Shift details are in the shared drive somewhere. Sign up if you can!”',1,'Volunteers must go find the time, place and what to bring. Put the details in the message.'],
   ['Mei to a donor: “Your gift link is below. Your donor ID, 4471, is already filled in.”',0,'Like giving the username with the website link: one less thing to look up.'],
   ['Jordan: “Per my earlier note, could you confirm the pickup plan?”',1,'The manager has to find the earlier note first. Restate the plan in a line or two.'],
   ['Arjun: “Pickup moves to Wed 3/11, 9–11 am, same loading dock. Reply OK to confirm.”',0,'Date, time, place and how to answer, all in one place.']]);}},

/* ---------- PART 4: LESS ATTENTION ---------- */
{part:3,src:'Chapter 9 · Rule 3: Minimize the amount of attention required',run(L){
  L.h(L.kick('learn','Rule 3 · Minimize the amount of attention required')+'<h1 class="q">Every choice you offer costs the reader focus</h1>'+
   L.prose('Offering many options feels kind. In practice it puts an attention tax on the reader. Studies find that with too many choices, people often put the decision off, sometimes forever.')+
   L.note('Retirement plans can mean many choices: how much to save and which funds to pick. When two companies offered employees a ready-made plan with the rate and funds already chosen, enrollment rose by 10 to 20 percentage points.','book')+
   L.list([['layers','Limit the choices','Two or three good options, not ten.'],
     ['check','Narrow the question','Ask for a yes, no or pick-one answer.'],
     ['list','Spell out the steps','Say plainly what to do, simply.']],2));
  L.done();}},
{part:3,src:'Chapter 9 · Rule 3: Minimize the amount of attention required',run(L){
  L.h(L.kick('learn','Narrow questions')+'<h1 class="q">Shorter isn’t always easier to answer</h1>'+
   L.lanes([['chat','Broad','“How was yesterday’s staff meeting?” The reader must sum up the whole meeting.',3],
            ['check','Narrow','“In yesterday’s staff meeting, did we decide whether to bid on the project?” A yes or no will do.',2]])+
   L.prose('The broad question is shorter but takes far more effort to answer. It might bring richer feedback, but only if the reader replies, which is less likely.')+
   L.prose('Some email tools turn questions into mini-polls with a few fixed answers. With practice, you can write that way yourself: keep each ask small and focused.'));
  L.done();}},
{part:3,src:'Chapter 9 · Rule 3: Minimize the amount of attention required',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Mei wants to know if Kofi approves the newsletter draft’s headline. Which question will Kofi answer fastest?</h1>');
  L.mc(L.card,['“Any thoughts on the newsletter draft?”','“What do you think of how it’s shaping up?”','“OK to run ‘A record month’ as the headline?”'],2,
   'Kofi can reply “yes” from their phone between meetings.',
   'An open question asks Kofi to review the whole draft and sum it up. Ask about the one thing you need.');}},
{part:3,src:'Chapter 9 · Rule 3: Minimize the amount of attention required',run(L){
  L.h(L.kick('ex','Two stories from the book')+'<h1 class="q">When the attention needed was too high, and when it was cut</h1>');
  L.beats(L.card,[
   ['A confusing ballot','In 2000, a “butterfly” ballot in Palm Beach County, Florida, listed names on two facing pages with holes punched in a column between them. Careful voters could follow the arrows. Hurried ones could punch the wrong hole.'],
   ['The cost','Analyses suggest over 2,000 voters marked a different candidate than they meant to. The state was decided by 537 votes, and the state decided the national election.'],
   ['A tax-credit notice','Researchers worked with the IRS on letters telling low-income workers they might qualify for a tax credit, which many eligible people never claim.'],
   ['Clear steps','The simple letter had a short “What you need to do” box: fill in the worksheet, and if you qualify, sign and mail it back. The complex one had six bullet points and a footnote. It got a <b>27% lower</b> response.'],
   ['But keep it simple','A worksheet listing seven eligibility rules instead of two had more relevant detail, yet cut responses by <b>17%</b>.']],
   'Spell out the steps, and keep them short. A clear but overloaded explanation can still put readers off.');}},
{part:3,src:'Chapter 9 · Rule 3: Minimize the amount of attention required',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Tap each piece to build the end of Lena’s volunteer text so it takes as little attention as possible.</h1>');
  L.sentence(L.card,[['Can you sort on Saturday (3/14)?','Tell me about your plans for March.'],['Reply 1 for 9–12 or 2 for 1–4.','Let me know which of our eight shift types you like.'],['Use the Elm Street side door.','Directions are in an older email.']],[0,0,0],
   [['An open question about the whole month takes real effort to answer. Ask one narrow question.'],['Eight options is an attention tax. Two clear choices are easier to pick from.'],['Making volunteers dig for directions is a reason to put it off. Put the key detail in the message.']],
   'One narrow question, two choices and the key detail, all in one text.');}},
{part:3,src:'Chapter 9 · The rules of easy-response writing',pts:6,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which rule fixes it?',['Simplify the steps','Organize key info','Minimize attention'],[
   ['Families must download a form, print it, and bring it to sign up for the mobile pantry’s Lincoln Park stop.',0,'Too many steps. Could they sign up by replying to a text, or at the truck?'],
   ['Arjun asks pantries, “Thoughts on the new ordering system?”',2,'Too broad. A narrow question, like “Is the Thursday noon deadline workable?”, is easier to answer.'],
   ['Kofi asks the board to vote “based on the attached 30-page report.”',1,'Board members must dig. Pull the cost, terms and deadline into the message.'],
   ['Mei’s donor form offers twelve giving levels and five funds to choose from.',2,'Too many choices. Offer a few levels and one suggested fund.'],
   ['Jordan asks the grocery manager to “suggest a few times for a call.”',0,'Offer two or three specific times so one reply settles it.'],
   ['Lena’s reminder says, “Remember what we discussed about parking?”',1,'Volunteers must recall an old chat. State the parking details again.']]);}},
{part:3,src:'Chapter 9 · Sixth principle: make responding easy',pts:1,run(L){
  L.h(L.kick('pr','Put it together')+'<h1 class="q">Which ending for Kofi’s board email makes responding easiest?</h1>');
  L.mc(L.card,['“Please review all the options when you can and share your thoughts.”','“Let me know how you’d like to proceed on the truck matter.”','“Lease: $1,900/month for 3 years. Reply YES or NO by Friday.”'],2,
   'The key facts are in the message, the question is narrow, and answering takes one word.',
   'That ending is open-ended and sends readers off to find the details. Give the cost and terms and ask for a yes or no by Friday.');}}
  ]
});
</script>
</body>
</html>
