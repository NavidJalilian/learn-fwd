<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Think Like a Busy Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0003', title:'Think like a busy reader, and know your goals', minutes:19, icon:'eye',
  goals:['Name the four quick decisions every reader makes about a message','Explain why readers skim, put things off and fail to act','Find your own key point with the five-second test before you write'],
  parts:['Four decisions','Skim and scan','Why no action','Know your goal'],
  read:'Read chapters 2 and 3 of the book for the research behind each reader decision and the authors’ case for revising everything.',
  glossary:{
    'four-decisions':'Four reader decisions: the quick, mostly automatic choices every reader makes about a message: whether to engage, when to engage, how to engage, and whether to respond.',
    'anchor-points':'Anchor points: the spots a scanning reader’s eyes land on: headings, first sentences of paragraphs, images and formatting that stands out.',
    'five-second-test':'Five-second test: asking yourself what the reader must come away with if they spend only five seconds on your message.'
  },
  cheatsheet:[
    'Every reader makes <b>four decisions</b>: whether to engage, when, how, and whether to respond. Most happen in a blink.',
    'Readers judge a message by its <b>envelope</b> (sender, subject, length) and quick rules of thumb, often without reading it.',
    'Short, easy-looking messages get handled <b>now</b>. Long or hard-looking ones get put off.',
    '<b>Everyone skims and scans.</b> Readers land on headings, first sentences and standout formatting, and stop when the next second seems worth less.',
    'Readers don’t act for three reasons: the ask is <b>unclear</b>, it doesn’t seem to <b>matter</b>, or they <b>put it off</b>.',
    'Before writing, run the <b>five-second test</b>: what must the reader come away with?',
    'On every revision ask: <b>what is the most important information</b>, and <b>how do I make it easier</b> to understand?',
    'If a busy reader misses your point, that is the <b>writer’s</b> failure, not the reader’s.'
  ],
  steps:[
/* ---------- PART 1: FOUR DECISIONS ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Kofi has five minutes between meetings. Two new emails: a two-line note from Lena, and a long “Quarterly partner framework update” from a sender Kofi doesn’t know. Which gets opened first?</h1>');
  L.mc(L.card,['The long update from the unknown sender','The two-line note from Lena'],1,
   'Kofi knows Lena, and two lines looks quick. Kofi decided all that without reading a word. This lesson is about those snap decisions.',
   'Almost nobody picks the long one from a stranger. Kofi knows Lena, and two lines looks quick. That snap call happens before any reading.');}},
{part:0,src:'Chapter 2 · Think like a busy reader',run(L){
  L.h(L.kick('learn','The four reader decisions')+'<h1 class="q">Every message has to pass four quick filters</h1>'+
   L.prose('Each time a '+L.g('busy-reader','busy reader')+' meets an email, text or chat message, they make '+L.g('four-decisions','four decisions')+', usually in a blink and without much thought:')+
   L.flow([['eye','1 · Whether','Engage at all?'],['clock','2 · When','Now or later?'],['book','3 · How','Read closely or skim?'],['chat','4 · Respond','Act on it or not?']])+
   L.prose('Your message has to get through each one. Lose the reader at any step and your idea never makes it from your head into theirs.'));
  L.done();}},
{part:0,src:'Chapter 2 · Think like a busy reader',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">A pantry coordinator sees Arjun’s message, thinks “that looks long,” and leaves it for tonight. Which decision just happened?</h1>');
  L.mc(L.card,['Whether to respond','How to engage','When to engage'],2,
   'They chose to engage, but later. That’s the “when” decision.',
   'They haven’t read it yet, so it can’t be “how” or “respond.” Leaving it for tonight is the <b>when</b> decision.');}},
{part:0,src:'Chapter 2 · Deciding whether to engage',run(L){
  L.h(L.kick('learn','Deciding whether to engage')+'<h1 class="q">Readers judge your message before they read it</h1>'+
   L.prose('Readers quietly ask: <i>is this worth my time?</i> They weigh the expected benefit against the expected cost in time and effort. In the authors’ survey of about 1,800 working professionals, people estimated they delete <b>about half</b> of their emails unread.')+
   L.lanes([['eye','Value clues','The '+L.g('envelope','envelope')+': who sent it, the subject line, the title. People favor senders they know and skip strangers whose message looks irrelevant.',2],
            ['clock','Cost clues','How long and how hard it looks. Short messages that look easy to navigate get opened more.',3]])+
   L.prose('To decide fast, readers lean on '+L.g('rule-of-thumb','rules of thumb')+', like picking the first option that seems good enough instead of hunting for the best one.'));
  L.done();}},
{part:0,src:'Chapter 2 · Deciding when to engage',run(L){
  L.h(L.kick('learn','Deciding when to engage')+'<h1 class="q">Easy and pleasant now, hard and dull later</h1>'+
   L.prose('People handle what they <i>want</i> to do before what they feel they <i>should</i> do. Given easy and hard tasks, they start with the easy ones, even when paid to do the hard ones first.')+
   L.list([['clock','Pay to get it now','In a classic study, most people took $100 today over $101 in a week.'],
     ['alert','Pay to delay','Students said they would rather sit in traffic 31 minutes next week than 30 minutes today.'],
     ['chat','Easy gets answered first','In one class, 99% of professionals said they would reply first to the message that looked easier to deal with.']],1)+
   L.prose('So if your message looks like a slog, readers will push it to “later,” and later often never comes.'));
  L.done();}},
{part:0,src:'Chapter 2 · Deciding whether and when to engage',pts:1,
 solve:async L=>{L.$('#po').children[0].click();L.$('#go').click();},
 run(L){
  let p=null;
  const M=[['Lena','Sat 9am: can you open the warehouse?','2 lines'],['Mei','Newsletter draft: thoughts welcome','9 paragraphs'],['Regional Partner Network','Updated compliance framework (Q3)','6-page PDF']];
  const R=[['Now','Answered in one tap before the next meeting.','var(--ok)'],['Later','Flagged for “tonight.” Tonight it stays flagged.','var(--h3)'],['Never','Deleted unread. The envelope said: stranger, long, dull.','var(--no)']];
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">Kofi has a 10-minute break. Judging only by sender, subject and length, which message gets handled first?</h1><div id="po"></div>'+
   '<div id="ib" hidden><div style="background:var(--soft);border-radius:16px;padding:12px;margin:10px 0">'+
   M.map((m,j)=>'<div style="padding:8px 0;border-bottom:1px solid rgba(0,0,0,.06)"><b>'+m[0]+'</b> · <span class="small">'+m[2]+'</span><div>'+m[1]+'</div><div class="res" id="r'+j+'"></div></div>').join('')+
   '</div><button class="btn pri" id="go">'+L.ic('play')+'Run Kofi’s break</button></div>');
  M.forEach((m,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=m[0];b.onclick=()=>{if(p!==null)return;p=j;b.classList.add('sel');L.$('#ib').hidden=false;};L.$('#po').appendChild(b);});
  L.$('#go').onclick=function(){this.remove();let k=0;
    const t=setInterval(()=>{const el=L.$('#r'+k);if(!el){clearInterval(t);return;}el.innerHTML='<b style="color:'+R[k][2]+'">'+R[k][0]+':</b> '+R[k][1];k++;
      if(k>=3){clearInterval(t);L.award(p===0);
        L.sheet(p===0?'ok':'no',p===0?'You called it':'Lena’s note went first','Kofi read the '+L.g('envelope','envelope')+', not the messages. Known sender plus short and easy means <b>now</b>. Long means <b>later</b>. Unknown, long and dull means <b>never</b>. Mei’s draft may matter most, but it looked like work.');L.done();}},500);};}},
{part:0,src:'Chapter 2 · Think like a busy reader',pts:5,run(L){
  L.h(L.kick('pr','Which decision?')+'<h1 class="q">Fennick readers in action. Which of the four decisions is each one making?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Whether','When','How','Respond'],[
   ['A board member sees “Monthly update #47” from Kofi and archives it unopened.',0,'Archiving unopened means they decided not to engage at all.'],
   ['A donor opens Mei’s appeal, reads the first line of each paragraph and jumps to the end.',2,'They are engaging, and choosing to skim. That’s how.'],
   ['A volunteer reads Lena’s ask, understands it, and decides not to sign up.',3,'They read it fully. Acting or not is the last decision.'],
   ['A pantry coordinator stars Arjun’s long message to read “after the lunch rush.”',1,'They will engage, but later. That’s when.'],
   ['A city staffer opens Jordan’s email and reads every word carefully.',2,'Reading closely rather than skimming is a choice about how to engage.']],
   'Whether, when, how, respond. A message can fail at any one of the four.');}},

/* ---------- PART 2: SKIM AND SCAN ---------- */
{part:1,src:'Chapter 2 · Deciding how to engage',run(L){
  L.h(L.kick('learn','Deciding how to engage')+'<h1 class="q">Everyone skims</h1>'+
   L.prose('Busy readers try to get the most value for the least time. They don’t read line by line. Second by second, they ask whether one more second of reading is worth more than whatever else they could be doing. Once they have the gist, each extra second seems worth less, so they stop.')+
   L.prose(L.g('skimming','Skimming')+' means skipping words, lines, even whole paragraphs. In the authors’ survey, people said they skim nearly 40% of their emails and 20% of their texts. Eye-tracking shows close readers move word by word, while skimmers pause less and jump across lines.')+
   L.note('Skimming is not cheating. It’s a smart way to save time. But it means readers <b>miss things</b>, and a message whose point comes at the end may lose them before they get there.','eye'));
  L.done();}},
{part:1,src:'Chapter 2 · Deciding how to engage',run(L){
  L.h(L.kick('learn','Scanning')+'<h1 class="q">Scanners jump to the spots that look useful</h1>'+
   L.prose(L.g('scanning','Scanning')+' means jumping between parts of a text, guided by rules of thumb about where the good stuff is. Eye-tracking shows readers skip big chunks and land on '+L.g('anchor-points','anchor points')+':')+
   L.list([['list','Headings','Read until one looks worth a closer look.'],
     ['arrow','First sentences','Readers expect the first sentence to say what the paragraph is about.'],
     ['eye','Images','Pictures pull the eye.'],
     ['star','Standout formatting','Anything that contrasts with the text around it.']],2)+
   L.prose('Readers will skim and scan no matter what. Your job is to write so they still catch your key information while they do.'));
  L.done();}},
{part:1,src:'Chapter 2 · Deciding how to engage',pts:1,
 solve:async L=>{L.$('#tg').click();},
 run(L){
  const P=[['Happy Monday, team!',' What a week at the warehouse. Thank you to everyone who helped at the school food drive. We sorted over 3,000 pounds.'],
    ['The new break room is finally done.',' There’s a fridge, a coffee maker and a notes board. Please label your lunches.'],
    ['Our Saturday sorting crew has been small lately.',' If you can, please sign up for this Saturday’s 9am shift by Thursday. Even two hours helps.'],
    ['<b>Don’t forget: the holiday party is December 12!</b>',' More details soon.']];
  let skim=false;
  L.h(L.kick('ex','Toggle and compare')+'<h1 class="q">Here is Lena’s weekly email. Switch to Kofi’s skim and see what survives.</h1>'+
   '<button class="btn" id="tg">'+L.ic('eye')+'Skim it like Kofi</button>'+
   '<div id="em" style="background:var(--soft);border-radius:16px;padding:14px;margin:10px 0">'+P.map(p=>'<p style="margin:0 0 10px">'+p[0]+'<span class="sk">'+p[1]+'</span></p>').join('')+'</div><div id="sq"></div>');
  L.$('#tg').onclick=function(){skim=!skim;this.innerHTML=L.ic('eye')+(skim?'Read it closely':'Skim it like Kofi');
    L.$('#em').querySelectorAll('.sk').forEach(s=>s.style.opacity=skim?'.12':'1');
    if(!L.$('#sq').innerHTML){const q=L.$('#sq');q.innerHTML='<h2 class="sub">After the skim, what does Kofi know about Saturdays?</h2>';
      L.mc(q,['That Lena needs sign-ups by Thursday','Only that the crew has been small','That the Saturday shift is canceled'],1,
       'The ask and the deadline sat mid-paragraph, after a first sentence that only set the scene. A skimmer reads that first line and moves on.',
       'Look at what stayed visible: only the first sentences and the bold line. The request and the Thursday deadline were in the skipped part.');}};}},
{part:1,src:'Chapter 2 · Deciding how to engage',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">A pantry coordinator scans Arjun’s three-paragraph message. Where do their eyes most likely land first?</h1>');
  L.mc(L.card,['On the first sentence of each paragraph','On the last sentence of the whole message','On every sentence, in order from the top'],0,
   'Readers expect the first sentence to say what a paragraph is about, so scanners lean on it.',
   'Scanners don’t go in order, and they rarely start from the end. They land on anchor points, and the first sentence of each paragraph is a big one.');}},
{part:1,src:'Chapter 2 · Deciding how to engage',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Will a skimmer catch it?',['Likely caught','Likely missed'],[
   ['Mei puts the donation deadline in the subject line and first sentence.',0,'Subject lines and first sentences are exactly where skimmers look.'],
   ['Arjun mentions the new Thursday noon deadline in the middle of the fourth paragraph.',1,'Mid-paragraph, deep in the message, is where skimmers skip.'],
   ['Kofi tells a long story whose real point (the board must vote) comes in the last line.',1,'Like a joke with the twist at the end: readers who stop at the gist never reach it.'],
   ['Lena puts “Saturday shifts” as a heading above the sign-up request.',0,'Headings are anchor points. Scanners read them to find what to read closely.']]);}},

/* ---------- PART 3: WHY NO ACTION ---------- */
{part:2,src:'Chapter 2 · Deciding whether to respond',run(L){
  L.h(L.kick('learn','Deciding whether to respond')+'<h1 class="q">Three reasons readers don’t act</h1>'+
   L.prose('Even after they read it, readers may not do what you asked. How likely they are to act depends heavily on how clearly the request is written and how easy it is to do. The book names three reasons they don’t:')+
   L.tiers([['info','They don’t understand it','If they have to work to decode the ask, they get distracted or give up. The fix is <b>clarity</b>.','“Pallet allocation window?”'],
            ['target','They don’t see why it matters','If the action seems unimportant, or not meant for them, they skip it. The fix is <b>relevance</b>.','“Is this even for my pantry?”'],
            ['clock','They put it off','They mean to, but later. Reminders help, but it’s better to make acting now easy.','“I’ll do it Friday.”']])+
   '<p class="small" style="margin-top:10px">Writers can’t control everything. A long form stays a long form. But you can explain the steps as clearly and simply as possible.</p>');
  L.done();}},
{part:2,src:'Chapter 2 · Deciding whether to respond',run(L){
  L.h(L.kick('ex','A Fennick story')+'<h1 class="q">Three pantries miss Arjun’s Thursday noon order deadline, each for a different reason</h1>');
  L.beats(L.card,[
   ['The message','Arjun posts: “Pallet allocation window closes Thu 12:00. Cold-chain SKUs via portal only.”'],
   ['Rosa','Rosa runs a church pantry. Rosa doesn’t know what a “pallet allocation window” is, means to ask, and never does. The ask was <b>unclear</b>.'],
   ['Dev','Dev runs a school pantry and never orders cold food. Dev reads “cold-chain SKUs” and decides the message isn’t about them. It didn’t seem <b>relevant</b>.'],
   ['Tomás','Tomás understands it and knows it matters. They plan to order Friday morning, after the weekend rush. They <b>put it off</b>, and Friday was too late.'],
   ['The lesson','One message, three failures. Arjun could fix the first two with plain words and by saying who it’s for. For the third, Arjun can make ordering quick enough to do right away.']],
   'Clarity, relevance, and putting it off. Each needs a different fix from the writer.');}},
{part:2,src:'Chapter 2 · Deciding whether to respond',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">A volunteer reads Lena’s ask, thinks “someone else will cover Saturday,” and moves on. Which reason is this?</h1>');
  L.mc(L.card,['They didn’t understand the ask','They didn’t see why it mattered','They meant to, but put it off'],1,
   'They understood it fine. They just didn’t think their help mattered. That’s a relevance problem.',
   'They understood it, and they aren’t planning to do it later. They decided it didn’t matter for them. That’s relevance.');}},
{part:2,src:'Chapter 2 · Deciding whether to respond',pts:5,run(L){
  L.h(L.kick('pr','Diagnose it')+'<h1 class="q">Why didn’t each reader act? Sort by the fix the writer needs.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Clarity','Relevance','Put off'],[
   ['A board member reads Kofi’s memo and can’t tell if a vote is being asked for.',0,'The ask itself was unclear.'],
   ['A family reads the mobile pantry flyer, sees “Route 3 change” and doesn’t know it’s their stop.',1,'They didn’t see that the change was about them.'],
   ['A donor likes Mei’s appeal and plans to give “when I sit down with my laptop.”',2,'They understood and agreed, then delayed.'],
   ['A partner reads “submit via the SKU portal” and has no idea which site that is.',0,'They can’t act on something they can’t decode.'],
   ['A volunteer saves Lena’s sign-up link to fill in “this weekend,” after the shift.',2,'Good intentions, wrong timing. Classic putting off.']],
   'Unclear asks need plainer words. Irrelevant-looking asks need to show why it matters to this reader. Putting off needs an easier step now.');}},

/* ---------- PART 4: KNOW YOUR GOAL ---------- */
{part:3,src:'Chapter 3 · Know your goals',run(L){
  L.h(L.kick('learn','The five-second test')+'<h1 class="q">You can’t get your point across if you don’t know it</h1>'+
   L.prose('Before anything else, ask yourself the '+L.g('five-second-test','five-second test')+': if your reader spends just five seconds on your message, <b>what is the most important thing they should come away with?</b> That answer is your '+L.g('key-info','key information')+'.')+
   L.prose('This is harder than it sounds, because writers are busy too. It’s easy to dash off a stream of thoughts. But if you don’t set the priority, readers decide for themselves what matters, and they may pick something else.')+
   L.note('Fix typos too. They break the reader’s flow and quietly say “this wasn’t worth editing,” and busy readers may treat it that way.','pencil'));
  L.done();}},
{part:3,src:'Chapter 3 · Know your goals',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">Kofi runs the five-second test on the board memo</h1>');
  L.beats(L.card,[
   ['The draft','Kofi’s monthly board memo covers a volunteer milestone, a donor event, warehouse repairs and, on page two, the refrigerated truck lease.'],
   ['The test','Kofi asks: if a board member reads for five seconds, what must they take away? Not the milestone. Not the event.'],
   ['The answer','“The board needs to approve the refrigerated truck lease by Friday.” Everything else is background.'],
   ['The surprise','Writing that one line forces Kofi to admit the memo’s real goal was hidden, even from Kofi.'],
   ['Next','Now Kofi knows what the memo is for. The rest of the course is about getting that line through to busy board members.']],
   'Find the one thing the reader must take away before you work on how to say it.');}},
{part:3,src:'Chapter 3 · Know your goals',run(L){
  L.h(L.kick('learn','Revise until it’s clear')+'<h1 class="q">Writing is how you find out what you think</h1>'+
   L.quote('Turning thoughts into words sharpens reasoning.','Adam Grant, quoted in chapter 3')+
   L.prose('The authors revise and rewrite not just books, but emails, memos and even texts. It sounds like overkill, but each pass makes their own ideas clearer. On every revision they ask two questions:')+
   L.flow([['target','Question 1','What is the most important information I want readers to understand?'],['bulb','Question 2','How do I make it easier for them to understand it?']]));
  L.done();}},
{part:3,src:'Chapter 3 · Know your goals',run(L){
  L.h(L.kick('learn','Whose job is it?')+'<h1 class="q">If readers miss it, the writer failed</h1>'+
   L.prose('Readers bring their own goals to your message. They skim, scan and put things off, and those habits can work against what you want. Effective writers plan for that instead of expecting readers to change.')+
   L.lanes([['home','Design','Designer Don Norman argues that if people can’t work out a door handle or an oven and give up, the designer failed, however beautiful the object is.',2],
            ['pencil','Writing','Same for practical writing. If a busy reader overlooks your key point and doesn’t act, <b>that’s not the reader’s fault</b>.',1]])+
   L.prose('The job is to meet busy readers where they are, and as they are.'));
  L.done();}},
{part:3,src:'Chapter 3 · Know your goals',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Lena is running the five-second test on the weekly volunteer email. Tap each piece until it states the key information.</h1>');
  L.sentence(L.card,[['Thanks for all you do!','Please sign up','Here’s some news:'],['for this Saturday’s sorting shift','about the new break room','for the holiday party'],['sometime soon','by Thursday']],[1,0,1],
   [['Thanks are kind, but they aren’t what Lena most needs volunteers to do.','“News” hides the ask. What does Lena need people to do?'],['The break room is nice to know, not the goal of the email.','The party is weeks away. Saturday shifts are the urgent problem.'],['“Sometime soon” gives readers permission to put it off. Name the deadline.']],
   'One line: <b>Please sign up for this Saturday’s sorting shift by Thursday.</b> Now Lena knows what the whole email has to deliver.');}},
{part:3,src:'Chapter 3 · Know your goals',pts:1,run(L){
  L.h(L.kick('pr','Whose fault?')+'<h1 class="q">Half the pantries missed the order deadline again. Arjun says, “It was in my message. They need to read more carefully.” What would the book say?</h1>');
  L.mc(L.card,['Arjun is right, since the information was there','It’s Arjun’s job to make the deadline hard to miss','Pantries should be sent a reading-skills workshop'],1,
   'The information being “in there” isn’t enough. Readers will skim anyway, so the writer has to make the key point impossible to miss.',
   'The book is firm: if busy readers miss key information, the writer failed. Asking readers to change their habits doesn’t work. Arjun has to change the message.');}},
{part:3,src:'Chapter 3 · Know your goals',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Mixed review: what should the writer do?',['Run the five-second test','Show why it matters','Make it easier to act now'],[
   ['Jordan has written three paragraphs to the grocery manager and can’t say what the email is asking for.',0,'If the writer can’t name the key point, readers won’t find it either. Start there.'],
   ['Mei’s donors understand the appeal but keep meaning to give “later.”',2,'They understand and agree, so the problem is delay. Lower the effort to act right away.'],
   ['City staff read Kofi’s update but don’t see why a food bank’s truck lease concerns them.',1,'They understood it but didn’t think it mattered to them. Make the relevance clear.'],
   ['Lena’s email mixes news, thanks and five asks, and Lena isn’t sure which one matters most.',0,'Pick the one thing readers must take away before rewriting anything.']]);}}
  ]
});
</script>
</body>
</html>
