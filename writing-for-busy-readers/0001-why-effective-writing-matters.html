<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Why Effective Writing Matters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0001', title:'Why effective writing matters', minutes:18, icon:'pencil',
  goals:['Say what makes writing effective, and why it isn’t the same as beautiful','Spot the three costs of writing that loses busy readers','Explain how a randomized experiment shows which message works'],
  parts:['We all write','Effective, not pretty','The cost','The science'],
  read:'Read the introduction of the book for the full Airbnb and ballot stories and how the authors built the book for busy readers.',
  glossary:{
    'time-tax':'Time tax: the total time a message takes from all its readers. A longer message sent to more people charges a bigger tax.',
    'control-group':'Control group: in an experiment, the people who get the usual message, so you have something to compare against.',
    'treatment-group':'Treatment group: in an experiment, the people who get the usual message plus one change you want to test.'
  },
  cheatsheet:[
    '<b>We are all writers</b> (texts, emails, chats, lists) and all <b>busy readers</b>.',
    '<b>Effective writing</b> has a clear purpose: busy readers notice, understand and act. It is <b>not</b> the same as beautiful writing.',
    'If you lose the reader, it’s <b>the writer’s job</b> to fix, not the reader’s fault.',
    'Clear writing helps the writer too: it forces clear thinking and gets faster replies.',
    'Bad writing costs: <b>missed chances</b>, a <b>time tax</b> on every reader, and <b>barriers</b> for people with less time or lower literacy.',
    'School writing (the five-paragraph essay) often works against practical writing.',
    'The advice comes from <b>randomized experiments</b>: random groups get different versions, and you compare who acts.'
  ],
  steps:[
/* ---------- PART 1: WE ALL WRITE ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Lena sends a four-paragraph email to 120 volunteers. The ask to sign up for Saturday shifts is in paragraph three. Only 5 people sign up. What most likely happened?</h1>');
  L.mc(L.card,['Most volunteers no longer care about the food bank','Most volunteers skimmed it or set it aside for later'],1,
   'Busy people skim, put off long messages or skip them. Most never reached paragraph three. This whole course is about writing for that reader.',
   'Nothing suggests they stopped caring. Busy people skim, put off long messages or skip them, so most never reached the ask in paragraph three.');}},
{part:0,src:'Introduction · The path from idea to action',run(L){
  L.h(L.kick('learn','We are all writers')+'<h1 class="q">If you sent a text today, you are a writer</h1>'+
   L.prose('The book starts with a claim: <b>we are all writers</b>. A text, a work email, a chat update, a social post, even a to-do list on the fridge (a note to your future, busy self) is writing.')+
   L.flow([['chat','Texts and chats','“Can you cover Saturday?”'],['list','Emails and forms','updates, sign-ups, reports'],['people','A busy reader','who skims, delays or skips']])+
   L.prose('This is '+L.g('practical-writing','practical writing')+': everyday writing that asks a reader to understand something or to do something. And we are all readers too, mostly '+L.g('busy-reader','busy readers')+', pulled in many directions at once.'));
  L.done();}},
{part:0,src:'Introduction · The path from idea to action',run(L){
  L.h(L.kick('ex','Meet the course’s running example')+'<h1 class="q">Fennick Food Bank runs on practical writing</h1>'+
   L.prose('Fennick is a made-up regional food bank. It sorts donated food with volunteers and sends it to about 40 partner pantries and its own mobile pantry truck. Nearly all its work happens through emails, texts, flyers and memos. Tap each card to meet the staff you’ll help all course long.'));
  L.flips(L.card,[
   ['Kofi · executive director','Warm and big-picture. Writes long, chatty emails and board memos. Reads everything on their phone between meetings.'],
   ['Lena · volunteer coordinator','Tireless. Sends a weekly volunteer email packed with news and asks. Struggles to fill Saturday sorting shifts.'],
   ['Arjun · operations manager','Runs the warehouse and trucks. Writes terse, one-line chat messages full of warehouse jargon.'],
   ['Mei · development and communications','Writes donor appeals and the newsletter. Likes to test two versions of a message to see which works.'],
   ['Jordan · program assistant','The newest staff member. Careful and a bit anxious. Writes long, very polite emails to important people.']],
   'Every one of them is a writer, and every one of their readers is busy.');}},
{part:0,src:'Introduction · The path from idea to action',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Which of these does the book count as writing?</h1>');
  L.mc(L.card,['Only Mei’s newsletter and Kofi’s board memos','Only messages sent to people outside Fennick','Every text, email, chat and list they send'],2,
   'Right. Any message meant for a reader, even a quick chat or a to-do list, is writing, and it works better when written for a busy reader.',
   'The book counts every text, email, chat post and list as writing, short or long, inside or outside the organization.');}},
{part:0,src:'Introduction · The path from idea to action',pts:4,run(L){
  L.h(L.kick('pr','Understand or act?')+'<h1 class="q">Practical writing usually asks readers to understand something or to do something. Sort these Fennick messages.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Mainly understand','Mainly act'],[
   ['Arjun asks pantries to place their orders by Thursday noon',1,'There’s a task and a deadline: the reader must do something.'],
   ['Kofi tells staff the warehouse will close early on Friday',0,'It’s information to take in. Nobody has to reply or do anything.'],
   ['Lena asks volunteers to sign up for a Saturday shift',1,'Signing up is an action the reader has to take.'],
   ['Mei’s newsletter explains how a new partner pantry got started',0,'It’s a story to read and understand, with no task attached.']],
   'Both kinds matter, and both compete for a busy reader’s time. Later lessons treat each one.');}},

/* ---------- PART 2: EFFECTIVE, NOT PRETTY ---------- */
{part:1,src:'Introduction · The path from idea to action',run(L){
  L.h(L.kick('learn','What is effective writing?')+'<h1 class="q">Five things the book says about effective writing</h1>'+
   L.list([['target','It has a clear purpose','It gets through to busy readers, even ones who want to stop reading and move on.'],
     ['people','It helps the writer too','You get faster, fuller replies, and writing clearly makes you think clearly.'],
     ['pencil','It isn’t beautiful writing','It aims to get specific information across fast, not to delight.'],
     ['flask','It rests on science','Research on how people read shows what works, so it’s less a matter of taste.'],
     ['compass','It is read in a context','The science is the same everywhere, but how you apply it depends on the writer and the readers.']],1)+
   '<p class="small" style="margin-top:10px">The book’s word for this is '+L.g('effective-writing','effective writing')+'.</p>');
  L.done();}},
{part:1,src:'Introduction · The path from idea to action',run(L){
  L.h(L.kick('learn','Whose job is it?')+'<h1 class="q">When a reader misses your point, the problem is the writing</h1>'+
   L.prose('Writers like to think readers will treat a message as important as the writer does. Busy readers don’t. Many want to get through your message, or past it, as fast as they can.')+
   L.quote('If you lose your reader, it’s not their fault.','Todd Rogers and Jessica Lasky-Fink, Introduction')+
   L.lanes([['book','Beautiful writing','Read by people who chose to set time aside. Often demanding and many-layered on purpose. Judged by taste, and takes a lifetime to master.',3],
            ['target','Effective writing','Read by people in a hurry. Gets specific information across and makes it easy to respond. A skill anyone can learn.',2]]));
  L.done();}},
{part:1,src:'Introduction · The path from idea to action',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Kofi’s board memo asks for a vote on a truck lease, on page two. Half the board never votes. Kofi says, “They should read more carefully.” What would the book say?</h1>');
  L.mc(L.card,['The board should set aside more time for memos','Kofi’s writing lost them, so it’s Kofi’s job to fix','Both sides share the blame equally here'],1,
   'Right. If busy readers miss the point, the writer has to change the writing, for example by putting the request up front.',
   'The book puts it on the writer: readers are busy and won’t change. If they missed the request, Kofi’s memo has to change.');}},
{part:1,src:'Introduction · The path from idea to action',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Beautiful or effective?',['Beautiful writing','Effective writing'],[
   ['Readers set aside time because they want to enjoy it.',0,'That’s reading as recreation, the home of beautiful writing.'],
   ['Built so a reader in a hurry gets the point fast.',1,'Getting through to busy readers is the whole goal of effective writing.'],
   ['Rich and layered on purpose, so it rewards rereading.',0,'Demanding, multilayered writing is literary craft, not practical writing.'],
   ['A skill anyone can learn by following clear principles.',1,'The book says effective writing is learnable by anyone.'],
   ['Mostly judged by personal taste.',0,'Beauty is subjective. Effective writing is judged by whether readers understand and act.']]);}},
{part:1,src:'Introduction · The path from idea to action',pts:1,run(L){
  L.h(L.kick('pr','The writer wins too')+'<h1 class="q">Jordan starts an email to a grocery chain manager about picking up unsold produce. After three paragraphs, Jordan still can’t say in one line what they’re asking for. What does that tell Jordan?</h1>');
  L.mc(L.card,['The email needs a warmer, more polite opening','Jordan’s own goal isn’t clear yet, so fix that first','The manager will work out the ask from context'],1,
   'Right. The book says clear writing forces clear thinking. If you can’t state the ask in one line, the reader surely won’t find it.',
   'More politeness or context won’t help if the goal itself is fuzzy. Clear writing forces clear thinking: Jordan should pin down the ask first.');}},

/* ---------- PART 3: THE COST ---------- */
{part:2,src:'Introduction · Better living through effective writing',run(L){
  L.h(L.kick('learn','What bad writing costs')+'<h1 class="q">Writing that loses busy readers is not harmless</h1>'+
   L.prose('People get dozens or hundreds of messages a day, and professionals spend nearly a third of their work week on email. Busy readers skim, put things off or ignore them. The book names three costs:')+
   L.tiers([['alert','Missed chances','Important news gets skipped or deleted: a health plan change, a school fair, a money-making offer.'],
            ['clock','A time tax','Every extra paragraph costs every reader time. The more readers, the bigger the bill.'],
            ['lock','Barriers','Hard writing shuts out people with less time, lower literacy, a second language or a learning disability.','So clear writing is fairer and more accessible',true,'Most serious']]));
  L.done();}},
{part:2,src:'Introduction · Better living through effective writing',run(L){
  L.h(L.kick('ex','A real story from the book')+'<h1 class="q">The email that cost people real money</h1>');
  L.beats(L.card,[
   ['The offer','Before Airbnb went public in December 2020, it emailed its hosts an invitation to buy shares.'],
   ['The envelope','The subject line was just the official name of the share program. It looked mundane and unimportant.'],
   ['What readers did','Many hosts later said they ignored it or set it aside because it didn’t look urgent.'],
   ['The cost','Hosts who did read it and took part made over $15,000. The others missed out.']],
   'The message was read through a busy reader’s filter. A plain-looking subject line made a big chance look like routine mail.');}},
{part:2,src:'Introduction · Better living through effective writing',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">What went wrong with the share-offer email?</h1>');
  L.mc(L.card,['Its subject line made a valuable offer look routine','The offer itself was not worth very much money','Hosts were not allowed to buy shares in time'],0,
   'Right. Busy readers judged it unimportant at a glance, so many never opened it.',
   'The offer was valuable and hosts could take part. The problem was that the subject line made it look routine, so busy hosts skipped it.');}},
{part:2,src:'Introduction · Better living through effective writing',pts:1,
 solve:async L=>{L.$('#po').children[2].click();L.$('#go').click();},
 run(L){
  let p=null;const P=['About 20 minutes','About 1 hour','About 4 hours'];
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">Kofi sends a carefully crafted three-paragraph email to all 120 volunteers. Each takes about 2 minutes to read it. How much time does it cost them in total?</h1><div id="po"></div>'+
   '<div id="tt" hidden><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:6px"><div><div class="small">Volunteers who have read it</div><div class="week" id="ct">0 of 120</div></div><button class="btn pri" id="go">'+L.ic('play')+'Send it</button></div>'+
   '<div class="meterrow"><div class="lb">Time tax</div><div class="meter"><div id="mt" style="background:var(--h3)"></div></div></div><div class="small" id="mm">0 minutes</div></div>');
  P.forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=n;b.onclick=()=>{if(p!==null)return;p=j;b.classList.add('sel');L.$('#tt').hidden=false;};L.$('#po').appendChild(b);});
  L.$('#go').onclick=function(){this.remove();let r=0;
    const t=setInterval(()=>{r+=10;const ct=L.$('#ct');if(!ct){clearInterval(t);return;}ct.textContent=r+' of 120';
      L.$('#mt').style.width=Math.round(r/120*100)+'%';L.$('#mm').textContent=(r*2)+' minutes';
      if(r>=120){clearInterval(t);L.award(p===2);
        L.sheet(p===2?'ok':'no',p===2?'You called it':'It’s about 4 hours','120 readers × 2 minutes = 240 minutes, a four-hour '+L.g('time-tax','time tax')+' from one email. The book’s own math: cut just one paragraph and you save about 80 minutes of readers’ time.');L.done();}},150);};}},
{part:2,src:'Introduction · Better living through effective writing',run(L){
  L.h(L.kick('learn','The barrier cost')+'<h1 class="q">Hard writing hits some readers hardest</h1>'+
   L.prose('The book points to a 2016 Colorado ballot question. It asked, in one long sentence that piles up words like removal, exception and prohibition, whether to remove an exception to a ban on slavery as punishment for crime. Even the authors weren’t fully sure what a “yes” vote meant.')+
   L.prose('Now picture a voter with a second language, lower reading skills or no time to reread it three times. A 2011 study found voters are <b>more likely to skip</b> ballot questions written in complex language.')+
   L.note('Hard writing doesn’t just lower reply rates. It decides <i>who</i> gets to take part. Clear writing is more accessible and more fair.','scale'));
  L.done();}},
{part:2,src:'Introduction · Better living through effective writing',pts:4,run(L){
  L.h(L.kick('pr','Name the cost')+'<h1 class="q">Which cost of ineffective writing does each Fennick problem show?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Missed chance','Time tax','Barrier'],[
   ['A free training for volunteers is mentioned at the bottom of Lena’s long email. Almost nobody shows up.',0,'A real opportunity got lost because busy readers never reached it.'],
   ['Arjun’s ordering notice uses warehouse terms. Pantry coordinators who read English as a second language can’t follow it.',2,'Hard wording shuts out readers with a second language or less time to decode it.'],
   ['Kofi’s weekly staff update runs five paragraphs. Each of 30 staff spends several minutes on it.',1,'Every extra paragraph is paid for by every reader. That’s the time tax.'],
   ['A grocery donor offers extra turkeys in a reply buried deep in a long email thread. Fennick misses the pickup window.',0,'The offer was there, but nobody noticed it in time.']],
   'The same mistake, writing without the busy reader in mind, shows up as all three costs.');}},

/* ---------- PART 4: THE SCIENCE ---------- */
{part:3,src:'Introduction · How to use this book',run(L){
  L.h(L.kick('learn','School writing vs practical writing')+'<h1 class="q">What school taught us can get in the way</h1>'+
   L.lanes([['book','Formal writing (school)','Grammar, spelling, flow, thesis statements, the five-paragraph essay. Useful skills, built for a teacher who must read every word.',3],
            ['chat','Practical writing (real life)','Mostly learned by trial and error: noticing which messages get quick replies and which get none.',2]])+
   L.prose('Good grammar and full sentences almost always help. But send your leaders a five-paragraph essay about a client meeting and they likely won’t read it, however fine the prose. Much of what school taught is irrelevant or even harmful for practical writing.'));
  L.done();}},
{part:3,src:'Introduction · How to use this book',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Jordan writes a report on a meeting with a city council office as a five-paragraph essay: introduction, three body paragraphs, conclusion. Kofi needs one decision from it. What’s the problem?</h1>');
  L.mc(L.card,['The essay needs more detail in the body paragraphs','The grammar in a school-style essay is too formal','A school essay format buries what a busy reader needs'],2,
   'Right. The essay shape was built for a teacher who reads every word. Kofi will skim, so the decision needs to be easy to find.',
   'Grammar is fine and more detail would make it worse. The issue is the shape: an essay built for a teacher buries the one decision a busy reader needs.');}},
{part:3,src:'Introduction · How to use this book',run(L){
  L.h(L.kick('learn','Where the advice comes from')+'<h1 class="q">The book’s rules come from randomized experiments</h1>'+
   L.prose('The authors reviewed research from psychology, economics, neuroscience and more, and ran hundreds of '+L.g('randomized-experiment','randomized experiments')+' themselves.')+
   L.flow([['people','1 · Big group','Start with many readers'],['cycle','2 · Random split','Some get the usual message, others the usual plus one change'],['check','3 · Compare','What share of each group acts?']])+
   L.prose('The usual-message group is the '+L.g('control-group','control group')+'; the changed one is the '+L.g('treatment-group','treatment group')+'. Because people are split at random, any difference comes from the change.')+
   L.note('One limit: experiments show what tends to happen across groups. They can’t predict what any one person will do.','info'));
  L.done();}},
{part:3,src:'Introduction · How to use this book',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">Mei tests Lena’s volunteer email</h1>');
  L.beats(L.card,[
   ['The question','Would more volunteers sign up if the Saturday ask came in the <b>first line</b> instead of paragraph three?'],
   ['The split','Mei takes the 120 volunteers and splits them <b>at random</b>: 60 get Lena’s usual email, 60 get the same email with the ask moved to the top.'],
   ['Why random','Mei doesn’t pick the keen volunteers for one version. Random groups are alike, so the only real difference is the change.'],
   ['The result','4 of 60 sign up from the usual email, 11 of 60 from the changed one. (Made-up numbers.)'],
   ['What it shows','For this group of readers, moving the ask up worked better. It doesn’t say which single volunteer will respond.']],
   'Same message, one change, random groups, then count who acts. That is how the book’s advice was tested.');}},
{part:3,src:'Introduction · How to use this book',pts:1,run(L){
  L.h(L.kick('pr','Put it in order')+'<h1 class="q">Mei wants to test two subject lines for the holiday appeal. Put Mei’s steps in order.</h1>');
  L.order(L.card,['Pick one change to test: the subject line','Split the donor list into two groups at random','Send the usual subject line to one group and the new one to the other','Compare what share of each group donates'],
   'Right. One change, a random split, then compare what share of each group acts.');}},
{part:3,src:'Introduction · How to use this book',pts:1,run(L){
  L.h(L.kick('pr','Reading the result')+'<h1 class="q">In Mei’s test, the new subject line got more donations. A board member asks, “So will my neighbor Sam give if we use it?” What can Mei honestly say?</h1>');
  L.mc(L.card,['Yes, the test proves Sam will donate this time','It works better across donors, not for any one person','No, the result only counts if every donor gave'],1,
   'Right. Experiments show tendencies across groups. They can’t predict a single person like Sam.',
   'Experiments can’t predict one person, and they don’t need everyone to act. They show which version works better across the group.');}},
{part:3,src:'Introduction · The path from idea to action',run(L){
  L.h(L.kick('learn','What comes next')+'<h1 class="q">A preview of the six principles</h1>'+
   L.prose('The book turns its research into '+L.g('six-principles','six principles')+', each with a few rules. You’ll learn one per lesson later in this course:')+
   L.list([['Less is more',''],['Make reading easy',''],['Design for easy navigation',''],['Use enough formatting but no more',''],['Tell readers why they should care',''],['Make responding easy','']],2)+
   L.note('The science is the same everywhere, but how you apply each rule depends on your readers and your situation. The next two lessons first look inside the busy reader’s head.','compass'));
  L.done();}},
{part:3,src:'Introduction · The path from idea to action',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Tap each piece to change it until the sentence states the book’s core stance.</h1>');
  L.sentence(L.card,[['When a careful reader','When a busy reader'],['misses the point,','reads every word,'],['it is the reader’s fault','it is the writer’s job'],['to write more.','to make it easier.']],[1,0,1,1],
   [['The book is about busy readers, which today is almost everyone.'],['The stance is about what happens when the reader misses the point.'],['The book says it’s not the reader’s fault. The writer has to fix it.'],['More words usually make it worse. The fix is making it easier to read and act on.']],
   'The book’s closing question puts it simply: how can I make this easier for the reader?');}}
  ]
});
</script>
</body>
</html>
