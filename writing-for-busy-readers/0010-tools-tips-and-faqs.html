<body>

<script>
Course.lesson({
  id:'0010', title:'Tools, tips and FAQs', minutes:20, icon:'compass',
  goals:['Trim a message with a lot to say, and decide whether to bundle or split several items','Set how often and how consistently to send reminders, and pick a credible messenger','Choose when to send and which medium fits, and avoid traps with links, sarcasm and emojis'],
  parts:['A lot to say','Many items','Repeat messages','Timing and medium'],
  read:'Read chapter 10 of the book for every FAQ, including its table of strengths and weaknesses for chat, text, email and paper.',
  glossary:{
    signposting:'Signposting: a short line at the top that tells readers what the message contains, like “Three items below: an update, a vote and a date.” A road map, not the content itself.',
    'mission-creep':'Mission creep: when a draft’s purpose slowly widens beyond the original goal, so the message grows unwieldy.',
    messenger:'Messenger: the person or organization that sends and signs a message. The same words can work better or worse depending on who they come from.'
  },
  cheatsheet:[
    '<b>A lot to say?</b> Edit for conciseness, keep only what’s needed for your goal, and move extras to a link, attachment or below the signature.',
    'Long documents, technical language and mixed audiences still follow the principles. Know your goal and your readers’ words.',
    '<b>Bundle or split?</b> Same event or action, bundle. Very different effort, split the quick asks from the hard ones. <b>Signpost</b> what’s coming.',
    '<b>Frequency:</b> send as many reminders as you need and no more. Weekly HIV reminders helped; daily ones didn’t.',
    '<b>Consistency:</b> vary low-value updates so they get opened; keep useful action messages looking the same so they’re recognized.',
    '<b>Messenger:</b> pick a credible, trusted sender. Never invent one.',
    '<b>Timing and medium:</b> send when readers have time, close to when they must act. Match the medium to the task and the readers; paper still works.',
    'Link the fewest meaningful words. Sarcasm and emojis are easy to misread, so signal clearly or skip them.'
  ],
  steps:[
/* ---------- PART 1: A LOT TO SAY ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Lena decides to text Saturday sorters a shift reminder every single day for a month. How will most volunteers respond by week three?</h1>');
  L.mc(L.card,['They’ll tune the texts out','They’ll read each one closely'],0,
   'Too many messages teach readers to ignore them. This lesson covers judgment calls like this one: how often, when, in what form, from whom.',
   'A daily text about the same thing quickly becomes background noise. Some will mute or block Lena’s number.');}},
{part:0,src:'Chapter 10 · What if I have a lot to say?',run(L){
  L.h(L.kick('learn','The how, not just the what')+'<h1 class="q">When you have a lot to say</h1>'+
   L.prose('The six principles are the <i>what</i>. This chapter answers common <i>how</i> questions. There are no universal answers: in the end you know your readers and make the call. But some moves help.')+
   L.list([['pencil','Edit for conciseness','Draft, pause, then take another pass. Software can flag wordy phrases. Or write a fresh, shorter second draft.'],
     ['target','Keep only what’s necessary','Can anything wait for a later message? Watch for '+L.g('mission-creep','mission creep')+' and refocus on your original goal.'],
     ['layers','Move extras out of the way','Put useful but non-critical content in an attachment, a link, an appendix or below your signature, and mention it in the main text.']],1)+
   L.note('The bottom line: as few words, ideas and requests as your goal needs, and no fewer. Some writing, like legal terms, puts completeness ahead of being read.','scale'));
  L.done();}},
{part:0,src:'Chapter 10 · What if I have a lot to say?',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Mei’s newsletter includes a long, lovely profile of a 20-year volunteer. It isn’t key to this issue’s goal. What’s the best move?</h1>');
  L.mc(L.card,['Cut it, since it isn’t the main goal','Keep it in full near the top for warmth','Link to it, with one line in the newsletter'],2,
   'Readers who want it can find it, and it doesn’t pull attention from the main message.',
   'The book suggests a middle path for useful but non-critical content: mention it, and move the full text to a link or below the sign-off.');}},
{part:0,src:'Chapter 10 · Longer formats, technical language and many audiences',run(L){
  L.h(L.kick('learn','Three more FAQs')+'<h1 class="q">Do the principles still apply when…? Tap each card.</h1>');
  L.flips(L.card,[
   ['…the document is long?','Yes. A required 20-page report still needs familiar words, clear sentences, short paragraphs and few ideas. Knowing your goal matters even more: it tells you what stays and what goes.'],
   ['…readers are experts?','Technical terms can make writing clearer and shorter for readers who know them. Use them with care, and only when they match your readers.'],
   ['…one message has many audiences?','Use the words most of your readers know. Jargon only one group knows can shut the rest out. Covering several groups’ concerns may need more words, and that can be worth it.']],
   'Same principles, different readers. Knowing who reads is what tells you how to apply them.');}},
{part:0,src:'Chapter 10 · What if I have a lot to say?',pts:5,run(L){
  L.h(L.kick('pr','Main text, moved out, or cut?')+'<h1 class="q">Kofi’s board email is about the truck lease vote. Sort each piece.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Main text','Link or attachment','Cut it'],[
   ['The cost and terms of the lease, and the Friday deadline',0,'Board members need this to vote. It belongs up front.'],
   ['The full 12-page quote from the leasing company',1,'Useful for anyone who wants to check details, but not to read first.'],
   ['A paragraph on the history of Fennick’s first truck',2,'It doesn’t serve this goal. Save it for another message, or drop it.'],
   ['Arjun’s spreadsheet comparing three trucks',1,'Valuable backup. Mention it and attach it.'],
   ['How to vote: reply YES or NO',0,'The action itself must be in the main text.']],
   'Main text for what readers need to act, a link or attachment for useful backup, and cut what doesn’t serve the goal.');}},

/* ---------- PART 2: MANY ITEMS ---------- */
{part:1,src:'Chapter 10 · What if I need to communicate multiple pieces of equally important information?',run(L){
  L.h(L.kick('learn','One message or several?')+'<h1 class="q">When several things are all equally important right now</h1>'+
   L.prose('A clinic must tell a new patient three things: send your insurance details, here’s how to check in, and here’s your appointment time. None can wait.')+
   L.prose('There’s no fixed rule. In one of the authors’ surveys, 72% of working professionals preferred one message with three items over three separate messages. Asking readers what they prefer is best, when you can. If you can’t, ask yourself two questions:')+
   L.flow([['cal','Same event?','Items about the same event or action can go together, like the clinic visit.','',2],['scale','Same effort?','If some asks are quick and others take real work, split them.','',3]],false));
  L.done();}},
{part:1,src:'Chapter 10 · What if I need to communicate multiple pieces of equally important information?',run(L){
  L.h(L.kick('ex','The book’s example')+'<h1 class="q">One email, three asks of very different sizes</h1>');
  L.beats(L.card,[
   ['The email','A relative writes before a holiday dinner. When will you arrive? Any gift ideas for the family? And can you find Grandma’s old cookie recipe?'],
   ['Quick','The arrival time takes seconds. You could answer on the bus.'],
   ['Some thought','Gift ideas need a few minutes of thinking.'],
   ['Real digging','The recipe could mean searching boxes or old files.'],
   ['What happens','Some readers answer the easy part and forget the rest. Others wait to answer everything at once, and that free moment never comes.']],
   'When asks differ a lot in effort, send the quick ones and the hard ones separately.');}},
{part:1,src:'Chapter 10 · What if I need to communicate multiple pieces of equally important information?',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">A new pantry joins Fennick. Arjun must send its login, its delivery day and the order deadline, all for its first delivery. One message or three?</h1>');
  L.mc(L.card,['Three, one per item, so nothing gets lost','One, since all three serve the first delivery'],1,
   'All three relate to the same event, like the clinic’s new-patient details. Bundle them.',
   'These items all serve the same first delivery, so three messages would be more annoying and less effective, like a clinic sending three emails about one visit.');}},
{part:1,src:'Chapter 10 · How can I get readers to engage with messages containing a lot of information?',run(L){
  L.h(L.kick('learn','Signposting')+'<h1 class="q">Tell readers what’s coming before it comes</h1>'+
   L.prose('Whether you bundle or split, a short preview helps. This is called '+L.g('signposting','signposting')+': a road map at the top, not the content itself.')+
   L.lanes([['list','Bundled','“Three items below: (1) the truck update, (2) a vote on the lease, (3) the date of our next meeting.”',2],
            ['arrow','Split','“This email is the truck update. I’ll send a separate note asking for your vote on the lease.”',3]])+
   L.prose('It adds a few words, but it makes longer or multi-item messages easier to navigate. Pair it with the other trick: move lower-priority details to an attachment, link or below your sign-off.'));
  L.done();}},
{part:1,src:'Chapter 10 · What if I need to communicate multiple pieces of equally important information?',pts:5,run(L){
  L.h(L.kick('pr','Bundle or split?')+'<h1 class="q">For each set of items, should Fennick send one message or separate ones?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Bundle in one','Split them up'],[
   ['Time, place and what to wear for a volunteer’s first Saturday shift',0,'All about the same shift. One message.'],
   ['Lena asks a volunteer for a quick yes to Saturday, and to write a 500-word story for the newsletter',1,'A one-word reply and a real writing task. Split them, or the quick yes may wait for the story.'],
   ['The mobile pantry’s new stop, day and hours',0,'All about the same change. Together they make one clear notice.'],
   ['Kofi asks the board to confirm Thursday’s meeting, and to review next year’s budget draft',1,'One takes a second, the other an evening. Separate them.'],
   ['A pantry’s order confirmation, delivery window and invoice',0,'All about the same order.']],
   'Same event: bundle. Very different effort: split the quick asks from the hard ones.');}},
{part:1,src:'Chapter 10 · How can I get readers to engage with messages containing a lot of information?',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Tap each piece to build the opening line of Mei’s donor email so it signposts what’s inside.</h1>');
  L.sentence(L.card,[['Thank you so much for everything you do!','Two things below:'],['(1) what your gifts did this year,','a long look back at our history,'],['and (2) a short survey with three questions.','and some other things you may like.']],[1,0,0],
   [['Warm, but it doesn’t tell readers what’s coming. A signpost names the items.'],['That doesn’t match the message’s items, and a long history isn’t why donors open it.'],['“Some other things” is vague. A signpost names each item so readers can find it.']],
   'A clear road map: readers know there are two items and can jump to the one they want.');}},

/* ---------- PART 3: REPEAT MESSAGES ---------- */
{part:2,src:'Chapter 10 · What if multiple communications are required?',run(L){
  L.h(L.kick('learn','Frequency')+'<h1 class="q">How many reminders is too many?</h1>'+
   L.prose('Reminders work because busy people forget and put things off. Reminders have cut missed medical appointments and helped people save money and pay child support.')+
   L.lanes([['x','Too few','A yearly note to pay a monthly bill? People forget.',3],
            ['x','Too many','A daily note about that bill? People ignore it, unsubscribe or block the sender, and forget anyway.',3]])+
   L.note('In one voting study, people got up to ten mailers. Each of the first five raised turnout a bit more. The last five added nothing.','book')+
   L.prose('The rule: send as many messages, as often, as you truly need, and no more. Picture them from the reader’s side.'));
  L.done();}},
{part:2,src:'Chapter 10 · What if multiple communications are required?',pts:1,
 solve:async L=>{L.$('#po').children[1].click();L.$('#run').click();},
 run(L){
  let p=null;const N=['No reminders','Weekly texts','Daily texts'],C=['var(--h3)','var(--ok-strong)','var(--h2)'],F=[0,32,0];
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">In Kenya, 431 patients on HIV treatment were randomly given no reminders, weekly texts or daily texts for 48 weeks. Which group did best at staying on treatment?</h1><div id="po"></div>'+
   '<div id="race" hidden><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:6px"><div class="small">More patients hitting the target, versus no reminders</div><button class="btn pri" id="run">'+L.ic('play')+'Reveal</button></div>'+
   N.map((n,j)=>'<div class="meterrow"><div class="lb">'+n+' · <b id="c'+j+'">'+(j===0?'baseline':'0')+'</b></div><div class="meter"><div id="m'+j+'" style="background:'+C[j]+'"></div></div></div>').join('')+'</div>');
  N.forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=n;b.onclick=()=>{if(p!==null)return;p=j;b.classList.add('sel');L.$('#race').hidden=false;};L.$('#po').appendChild(b);});
  L.$('#run').onclick=function(){this.remove();let s=0;
    const t=setInterval(()=>{s++;[1,2].forEach(j=>{const v=F[j]*s/10,c=L.$('#c'+j),m=L.$('#m'+j);if(c)c.textContent=(j===2&&s>=10?'about the same':'+'+Math.round(v)+'%');if(m)m.style.width=Math.max(v*2,1)+'%';});
      if(s>=10){clearInterval(t);L.award(p===1);
        L.sheet(p===1?'ok':'no',p===1?'You called it':'Weekly won','Weekly texts: <b>32% more</b> patients reached the target than with no reminders. Daily texts: about the same as <b>no reminders at all</b>. The researchers guess daily texts felt intrusive, or came so often that people stopped paying attention.');L.done();}},200);};}},
{part:2,src:'Chapter 10 · What if multiple communications are required?',run(L){
  L.h(L.kick('learn','Consistency')+'<h1 class="q">Should repeat messages look the same or different?</h1>'+
   L.prose('It depends on how much readers value the message. Readers use the subject line as a '+L.g('rule-of-thumb','rule of thumb')+' for whether to open it.')+
   L.lanes([['cycle','Vary it','For low-value updates. When an online course kept the same weekly subject line, students learned to ignore it. Varying it got more emails opened.',3],
            ['check','Keep it the same','For useful action messages. Credit card bills look identical every month, so people spot them at once.',2]])+
   L.prose('Campaigns know many readers don’t value their fundraising emails, so they keep changing subject lines and envelopes, all for the same ask.'));
  L.done();}},
{part:2,src:'Chapter 10 · What if multiple communications are required?',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Every week Arjun reminds pantries to order by Thursday noon. Pantries rely on it. How should the subject line work?</h1>');
  L.mc(L.card,['Change it every week so it feels fresh','Keep it the same so pantries spot it fast','Leave it blank and put details inside'],1,
   'It’s a useful action message, like a credit card bill. A familiar subject line says “this one matters, act on it.”',
   'Varying helps with low-value updates readers tend to skip. Pantries value this reminder, so make it instantly recognizable.');}},
{part:2,src:'Chapter 10 · Who should be the messenger?',run(L){
  L.h(L.kick('learn','The messenger')+'<h1 class="q">Who signs it can matter as much as what it says</h1>'+
   L.prose('Often you are simply your own '+L.g('messenger','messenger')+'. But updates, pitches and appeals could come from different people, and credibility counts: readers act more on messages from sources they trust.')+
   L.flow([['shield','State tax agency','Letter about a tax credit','3 times as many visited the website',2],['people','Local nonprofit','Same kind of letter','Fewer visits',3]],false)+
   L.prose('That was a study of California letters about a tax credit; the authors suspect the state agency was better known and more trusted.')+
   L.note('Never invent an expert. A student-loan company made up “Drew Cloud,” a fake loan expert quoted in the news. A newspaper exposed it in 2018, and the story still follows the company.','alert'));
  L.done();}},
{part:2,src:'Chapter 10 · What if multiple communications are required?',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Repeat-message judgment calls',['Good call','Rethink it'],[
   ['Mei gives the monthly newsletter a fresh, specific subject line each month.',0,'A low-value update gets opened more when the subject line changes.'],
   ['Lena sends a sorting reminder twice a day all week.',1,'Like the daily texts, too many reminders get tuned out. A well-timed one or two is enough.'],
   ['The grocery-chain pitch goes out signed by Kofi, the director the manager has heard of.',0,'A known, credible messenger makes readers more likely to act.'],
   ['To sound expert, Jordan signs a funding request as “Dr. Pat Lee, nutrition expert,” a made-up person.',1,'Inventing a messenger is deceptive and can backfire badly once found out.'],
   ['Arjun sends the order reminder once a week, with the same subject line each time.',0,'Steady frequency and a familiar look for a message pantries value.']]);}},

/* ---------- PART 4: TIMING AND MEDIUM ---------- */
{part:3,src:'Chapter 10 · When should communications be sent?',run(L){
  L.h(L.kick('learn','Timing')+'<h1 class="q">No magic day or hour, but two guides</h1>'+
   L.list([['clock','When readers have time and motivation','A teacher writing parents about tonight’s homework might send it in the afternoon, so it’s fresh when the child gets home. But if most parents work afternoons, morning is better.'],
     ['cal','Close to when the action is due','A tax reminder seven months early gets forgotten. One the day before leaves no time to do it. Aim for focused, not panicked.']],2)+
   L.prose('The right time differs between groups and changes over time. Knowing your specific readers is what tells you when.'));
  L.done();}},
{part:3,src:'Chapter 10 · When should communications be sent?',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">The mobile pantry starts at Lincoln Park on March 3, Tuesdays 4–6pm. When should the text to families go out?</h1>');
  L.mc(L.card,['On New Year’s Day, two months ahead','At 3:55pm on March 3, as the truck parks','A few days before, and again that morning'],2,
   'Close enough to remember, early enough to plan around work. A same-day nudge helps busy families.',
   'Too early and families forget; too late and they can’t rearrange their day. Send close to the time, with room to act.');}},
{part:3,src:'Chapter 10 · Email, chat, text, mail: what is the right medium for my message?',run(L){
  L.h(L.kick('learn','The medium')+'<h1 class="q">Email, chat, text or paper? Tap each card.</h1>'+
   L.prose('If you can, ask readers how they like to get each kind of message. If not, match the medium to the purpose, the length and how your readers behave.'));
  L.flips(L.card,[
   ['Chat','Good for real-time teamwork and urgent asks. Easy to forget if not answered at once, and the flood of notifications can make people tune out.'],
   ['Text','Reaches people almost instantly, so it’s ideal when they can act right away. But texts fade from mind once read: weak for later or multi-step actions.'],
   ['Email','Good for records, detail, attachments, links and cheap mass messages. But inboxes are saturated, so any single email can get lost.'],
   ['Paper','Sticks around, can be shared and talked about, and reminds people of later or multi-step tasks. Slower and costlier to send.']],
   'Paper still works: postcards were nearly twice as effective as emails at getting college students to enroll in California’s food-aid program. And norms shift: one voting text raised turnout about 4 points in 2006, about 1 in 2010, and almost nothing by 2017.');}},
{part:3,src:'Chapter 10 · Email, chat, text, mail: what is the right medium for my message?',pts:5,run(L){
  L.h(L.kick('pr','Pick the medium')+'<h1 class="q">Which medium best fits each Fennick message?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Chat','Text','Email','Paper'],[
   ['Arjun needs a forklift driver at the loading dock in the next ten minutes',0,'Urgent, real-time, among staff who are on chat.'],
   ['“The truck is at Lincoln Park now, until 6pm”',1,'Families can act right away, so an instant text fits.'],
   ['The truck lease contract and quotes for the board to keep on record',2,'Detail, attachments and a record: email’s strengths.'],
   ['A multi-step guide for families to apply for a food-aid program over several weeks',3,'Paper stays on the fridge and keeps reminding them across the steps.'],
   ['Mei’s monthly newsletter to 2,000 donors, with links',2,'Cheap for mass messages and good for links.']],
   'No medium wins everywhere. Match it to the task, the timing and the readers. Some readers have less access to technology, so paper can reach them better.');}},
{part:3,src:'Chapter 10 · Hyperlinks, humor and emojis, and pictures',run(L){
  L.h(L.kick('learn','The small stuff')+'<h1 class="q">Links, sarcasm, emojis, pictures and social posts</h1>'+
   L.list([['pointer','Links','Links draw the eye like bold text. Link the fewest words that still say where it goes. That helps skimmers, and people using screen readers that announce every link.'],
     ['chat','Sarcasm and humor','Writers in one study predicted 78% of readers would spot their sarcasm. Readers did no better than a coin flip. If you joke, signal it more than you think you need to.'],
     ['alert','Emojis','Meanings shift by age and over time. A smiley can read as warm to older readers and passive-aggressive to younger ones. Use with care in important writing.'],
     ['eye','Pictures and social media','Use a picture only if it saves readers time and doesn’t distract. Social posts follow the same six principles, balanced with a more personal style.']],1));
  L.done();}},
{part:3,src:'Chapter 10 · Tools, tips and FAQs',pts:6,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Mixed review: good call?',['Good call','Rethink it'],[
   ['Lena links the whole sentence “For more information about the volunteer handbook and our policies, see this page.”',1,'A whole linked sentence crowds the message. Link just “volunteer handbook.”'],
   ['Arjun texts a new pantry: “Oh great, another missed deadline 🙂”',1,'Sarcasm is easy to misread, and a smiley can read as passive-aggressive. Say it plainly.'],
   ['Kofi’s city update covers concerns of both neighbors and businesses, even though it runs longer.',0,'Many audiences can need more words. That’s a fair trade.'],
   ['Mei uses a simple chart in the annual report to show pounds of food by month.',0,'A picture that saves readers time and serves the goal is worth it.'],
   ['Arjun writes “cold-chain SKU allocation” in a note to all volunteers.',1,'Jargon only the warehouse team knows shuts other readers out. Use words most readers know.'],
   ['Jordan asks the grocery manager whether they’d rather get pickup updates by text or by email.',0,'When you can, asking readers which medium they prefer is the book’s first advice.']]);}}
  ]
});
</script>
</body>
</html>
