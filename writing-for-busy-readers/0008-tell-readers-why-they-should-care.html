<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Why Readers Should Care</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0008', title:'Tell readers why they should care', minutes:17, icon:'target',
  goals:['Explain why writers misjudge what their readers care about','Rewrite a message around what readers value, honestly (“So what?”)','Say up front which readers a group message is for (“Why me?”)'],
  parts:['The perspective gap','So what?','Why me?'],
  read:'Read chapter 8 of the book for both Rock the Vote emails in full and the other appeals the study tested.',
  glossary:{
    'personal-relevance':'Personal relevance: how much a reader feels a message affects them directly. The more it does, the more carefully they read.',
    'readers-perspective':'Reader’s perspective: writing that leads with what the reader values or who it is for, instead of what the writer wants (the writer’s perspective).'
  },
  cheatsheet:[
    'Writers are bad at seeing through readers’ eyes, like tappers sure their song is obvious. We think readers give us more time and value what we value.',
    'People read more carefully, and remember more, when a topic feels <b>personally relevant</b>.',
    'Rule 1, <b>“So what?”</b>: picture the reader and lead with what they value, not what you want. Ask why they should care <i>now</i>, too.',
    'Rock the Vote: “Want to attend free events?” got nearly <b>four times</b> the sign-ups of “Volunteer with Rock the Vote.”',
    'Stay honest. A hook that misleads wastes readers’ time and can turn them against you.',
    'Rule 2, <b>“Why me?”</b>: in group or mass messages, say up front which readers it’s for.',
    'A targeted title helps the right readers engage and lets everyone else skip it. That’s more effective <b>and</b> kinder.'
  ],
  steps:[
/* ---------- PART 1: THE PERSPECTIVE GAP ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Arjun taps the rhythm of “Happy Birthday” on a table for Jordan. In Arjun’s head, the tune is obvious. Is it just as obvious to Jordan?</h1>');
  L.mc(L.card,['Yes, it’s one of the best-known songs','Probably not, Jordan hears only knocks'],1,
   'Arjun hears the melody in their head. Jordan hears knocking. This lesson starts from that gap.',
   'It’s famous, but Jordan doesn’t hear the tune, only knocks. Arjun has the melody in their head and can’t un-hear it.');}},
{part:0,src:'Chapter 8 · Fifth principle: tell readers why they should care',run(L){
  L.h(L.kick('learn','Tappers and listeners')+'<h1 class="q">A simple study about seeing through someone else’s eyes</h1>'+
   L.prose('A Stanford researcher, Elizabeth Newton, split people into two groups.')+
   L.flow([['pointer','Tappers','Tapped the rhythm of well-known songs, like “Happy Birthday.”','',3],['eye','Listeners','Tried to name each song from the taps alone.','',2]])+
   L.prose('Then the tappers were asked to imagine being a listener and predict how many listeners would guess right. They said <b>about half</b>.')+
   '<p class="small">How close were they? Find out on the next screen.</p>');
  L.done();}},
{part:0,src:'Chapter 8 · Fifth principle: tell readers why they should care',pts:1,
 solve:async L=>{L.$('#po').children[0].click();L.$('#run').click();},
 run(L){
  let p=null;const N=['Tappers predicted','Listeners actually got'],C=['var(--h3)','var(--ok-strong)'],F=[50,2.5];
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">Tappers expected 50% of listeners to name the song. What share actually did?</h1><div id="po"></div>'+
   '<div id="race" hidden><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:6px"><div class="small">Songs named correctly</div><button class="btn pri" id="run">'+L.ic('play')+'Reveal</button></div>'+
   N.map((n,j)=>'<div class="meterrow"><div class="lb">'+n+' · <b id="c'+j+'">0</b>%</div><div class="meter"><div id="m'+j+'" style="background:'+C[j]+'"></div></div></div>').join('')+'</div>');
  ['About 2.5%','About 25%','About 50%'].forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=n;b.onclick=()=>{if(p!==null)return;p=j;b.classList.add('sel');L.$('#race').hidden=false;};L.$('#po').appendChild(b);});
  L.$('#run').onclick=function(){this.remove();let s=0;
    const t=setInterval(()=>{s++;F.forEach((f,j)=>{const v=f*s/10,c=L.$('#c'+j),m=L.$('#m'+j);if(c)c.textContent=(Math.round(v*10)/10);if(m)m.style.width=Math.max(v,1)+'%';});
      if(s>=10){clearInterval(t);L.award(p===0);
        L.sheet(p===0?'ok':'no',p===0?'You called it':'Only 2.5%','Tappers expected half the listeners to succeed. Just <b>2.5%</b> did. The tappers badly misjudged the listeners’ experience, and didn’t realize how far off they were.');L.done();}},200);};}},
{part:0,src:'Chapter 8 · Fifth principle: tell readers why they should care',run(L){
  L.h(L.kick('learn','Writers are tappers')+'<h1 class="q">We hear the tune. Our readers hear knocks.</h1>'+
   L.prose('Writers make the same mistake about readers. We assume they’ll give our message more time than they do, and that they value the same things we do. Often they don’t: writers’ and readers’ goals differ, and readers ignore messages that don’t seem to serve <i>their</i> goals.')+
   L.lanes([['pencil','What we can’t change','The topic itself. Lena can’t make sorting shifts thrilling.',3],
            ['bulb','What we can change','Which parts we stress, and how clearly we say why the reader should care.',2]])+
   L.note('Even great writing can’t guarantee readers will engage. It can make it a lot more likely.','info'));
  L.done();}},
{part:0,src:'Chapter 8 · Fifth principle: tell readers why they should care',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Mei loves the new warehouse shelving and gives it the top spot in the donor newsletter. What does the tapper study suggest?</h1>');
  L.mc(L.card,['Donors likely care as much as Mei does','Donors will read it if it is written well','Mei probably overrates donors’ interest'],2,
   'Like a tapper, Mei hears the tune. Donors may not share Mei’s excitement, so Mei should check what they actually value.',
   'Writers tend to assume readers value what they value, and good prose doesn’t fix that. Mei is the tapper here.');}},

/* ---------- PART 2: SO WHAT? ---------- */
{part:1,src:'Chapter 8 · Rule 1: Emphasize what readers value',run(L){
  L.h(L.kick('learn','Rule 1 · Emphasize what readers value')+'<h1 class="q">People read harder when it’s about them</h1>'+
   L.prose('When a topic feels '+L.g('personal-relevance','personally relevant')+', readers try harder to understand it, read more deeply and remember more.')+
   L.flow([['home','“Your college is considering it”','Students read the policy more carefully and fully','',2],['map','“A college in another state is”','Same policy, read less closely','',3]],false)+
   L.prose('That was a study by psychologist Richard Petty and colleagues. Students read about a proposed policy, such as a new exam needed to graduate. Only the “whose college” part changed.'));
  L.done();}},
{part:1,src:'Chapter 8 · Rule 1: Emphasize what readers value',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">Rock the Vote tests two subject lines</h1>');
  L.beats(L.card,[
   ['The goal','Rock the Vote, a group that signs up young voters at concerts, emailed 19,990 people asking them to volunteer at live shows.'],
   ['Writer’s Perspective','Subject: <b>“Volunteer with Rock the Vote.”</b> It states what the writer wants.'],
   ['Reader’s Perspective','Subject: <b>“Want to attend free events?”</b> The body added one line: volunteers see great shows for free while doing important work.'],
   ['The result','Readers who got the '+L.g('readers-perspective','Reader’s Perspective')+' version were nearly <b>four times</b> as likely to sign up.'],
   ['Other appeals','The study also tried appeals to helping others, values, fitting in and being seen as good. None beat free events here, but other readers in other settings will differ. Test when you can.']],
   'Same ask, same body. Leading with what readers value made the difference.');}},
{part:1,src:'Chapter 8 · Rule 1: Emphasize what readers value',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Saturday sorters at Fennick get a free lunch and work alongside friends. Which subject line takes the reader’s perspective?</h1>');
  L.mc(L.card,['Saturday sorting shifts need volunteers','Fennick volunteer program: weekly update','Free lunch and good company on Saturday?'],2,
   'It leads with what a volunteer gets, like “free events” did for Rock the Vote. And it’s true.',
   'That line states what Fennick needs or what the email is, which is the writer’s view. Lead with what the volunteer gets.');}},
{part:1,src:'Chapter 8 · Rule 1: Emphasize what readers value',run(L){
  L.h(L.kick('learn','Stay honest')+'<h1 class="q">A hook can help readers, or mislead them</h1>'+
   L.prose('Some people likely opened the Rock the Vote email for the free shows with no wish to volunteer. They lost time and may have felt misled. Others opened it for the shows and found they <i>did</i> want to volunteer, an opportunity they’d have missed with the plain subject line.')+
   L.lanes([['check','Worth it','The hook is true, and the cost to uninterested readers is small next to the readers you gain.',2],
            ['x','Not worth it','The hook feels deceptive, or readers don’t share your goals. Then you waste their time and can turn them against you.',3]])+
   L.note('Every writer weighs these costs and benefits. The book’s line: emphasize what readers value, but never at the price of misleading them.','scale'));
  L.done();}},
{part:1,src:'Chapter 8 · Rule 1: Emphasize what readers value',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Honest hook or misleading?',['Honest hook','Misleading hook'],[
   ['Lena’s subject: “Free lunch every Saturday shift.” Sorters do get lunch.',0,'It leads with something true that volunteers value.'],
   ['Mei’s appeal subject: “You’ve been selected for a reward!” It’s a plain donation request.',1,'There’s no reward. Readers who open it will feel tricked, and may stop opening Mei’s emails.'],
   ['Jordan to a grocery manager: “Cut your produce disposal costs.” Fennick would haul unsold produce away for free.',0,'If Fennick really takes it for free, the store really saves. That’s the manager’s “so what.”'],
   ['Lena’s subject: “Concert tickets inside!” The email is only a shift sign-up.',1,'Unlike Rock the Vote, nothing backs up the hook. Readers lose time and trust.']]);}},
{part:1,src:'Chapter 8 · Rule 1: Emphasize what readers value',run(L){
  L.h(L.kick('learn','The shorthand: “So what?”')+'<h1 class="q">Before you send, ask the reader’s question</h1>'+
   L.list([['person','Picture one reader','Not “volunteers,” but Rosa, running a church pantry on a Tuesday night.'],
     ['chat','Ask “So what?”','What would make this person care about what you’re saying? Lead with that.'],
     ['clock','Ask “Why now?”','Why should they care today, not next week? (Timing comes back in lesson 10.)']],1)+
   L.prose('This isn’t only for appeals and campaigns. Even a quick text, work email or chat thread works better written from the reader’s side.'));
  L.done();}},
{part:1,src:'Chapter 8 · Rule 1: Emphasize what readers value',pts:5,run(L){
  L.h(L.kick('pr','Whose perspective?')+'<h1 class="q">Sort each Fennick line by whose view it leads with.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Writer’s perspective','Reader’s perspective'],[
   ['“Our new online ordering system is live.”',0,'It announces Fennick’s news. Pantries still have to work out why it matters to them.'],
   ['“Place your weekly order in two minutes from your phone.”',1,'It leads with what a busy pantry coordinator gains.'],
   ['“Help us reach our year-end fundraising goal.”',0,'The goal is Fennick’s. Donors care about what their gift does.'],
   ['“Your gift puts a holiday meal on a neighbor’s table.”',1,'It shows donors the result they value.'],
   ['“We are short on Saturday sorters again.”',0,'It states Fennick’s problem, not anything the volunteer gets or values.']],
   'The writer’s perspective says what <i>we</i> want or have. The reader’s perspective answers “So what?” for them.');}},
{part:1,src:'Chapter 8 · Rule 1: Emphasize what readers value',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Tap each piece to build Mei’s year-end appeal subject line from the donor’s side. Assume the numbers are true.</h1>');
  L.sentence(L.card,[['Help us reach','Your $40 can put'],['our annual fundraising target','a holiday meal on a family’s table'],['this December','before our books close']],[1,1,0],
   [['“Help us reach” starts from Fennick’s goal, not the donor’s.'],['A fundraising target is what Fennick cares about. Donors care what their gift does.'],['Closing the books is Fennick’s deadline. “This December” ties it to the holidays the donor is living through.']],
   'It answers “So what?” (a family eats) and “Why now?” (the holidays), from the donor’s side.');}},

/* ---------- PART 3: WHY ME? ---------- */
{part:2,src:'Chapter 8 · Rule 2: Emphasize which readers should care',run(L){
  L.h(L.kick('learn','Rule 2 · Emphasize which readers should care')+'<h1 class="q">If you can’t guess what readers value, say who it’s for</h1>'+
   L.prose('Predicting <i>what</i> readers will care about is hard. A second strategy: make clear <i>which</i> readers should care.')+
   L.prose('A message that looks generic gets ignored by almost everyone, including the few people it really matters to. This is most important in mass messages, where you can’t pick the exact readers.')+
   L.note('Say a city library will close for repairs. Only that library’s users need to know, but the city doesn’t know who they are. Naming them in the message helps the right people notice it.','book'));
  L.done();}},
{part:2,src:'Chapter 8 · Rule 2: Emphasize which readers should care',run(L){
  L.h(L.kick('ex','The book’s example')+'<h1 class="q">A soup recall, titled two ways</h1>');
  L.beats(L.card,[
   ['The problem','A grocery store must recall a soup, Soup XYZ. It doesn’t know who bought it, but it can post notices online, by email and in stores.'],
   ['Writer’s Perspective','“Notice: Important product safety recall information.” It could apply to anyone, so the authors predict it reaches almost no one.'],
   ['Reader’s Perspective','“Notice: If you bought Soup XYZ in June, it has been recalled.” The right shoppers see at once that it’s for them.'],
   ['The bonus','Everyone else knows they can skip it. Their time is saved too.']],
   'Naming who should care makes a message more effective and kinder to busy readers.');}},
{part:2,src:'Chapter 8 · Rule 2: Emphasize which readers should care',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Arjun emails all 40 pantries. Only those with Tuesday pickups are affected: their pickup moves to Wednesday next week. Best subject line?</h1>');
  L.mc(L.card,['Important schedule information for partners','Please read: changes to operations ahead','Tuesday pickup pantries: come Wednesday next week'],2,
   'It names who should care and what changes. Tuesday pantries open it; the rest can skip it safely.',
   'That line could be for anyone, so it reaches almost no one, like the generic soup notice. Name the Tuesday pantries.');}},
{part:2,src:'Chapter 8 · Rule 2: Emphasize which readers should care',run(L){
  L.h(L.kick('learn','The shorthand: “Why me?”')+'<h1 class="q">Every group message gets asked one question</h1>'+
   L.prose('One-to-one messages have one obvious reader. But a group text, a staff email list or a busy chat channel has many, and each one silently asks: <b>“Why me? Why did I get this?”</b>')+
   L.lanes([['check','Clear up front','Readers who aren’t affected skip it in a second and get on with their day.',2],
            ['x','Not clear','Readers waste time on something irrelevant and feel irritated, even cheated.',3]])+
   L.prose('So say who you expect to care, and why. Your message feels more personal to the readers you want, and less disruptive to everyone else.'));
  L.done();}},
{part:2,src:'Chapter 8 · Rule 2: Emphasize which readers should care',pts:1,
 solve:async L=>{const c=L.$('#tt').children;c[0].click();c[1].click();},
 run(L){
  const seen=new Set(),P=[['Ana','Tuesday truck loader',1],['Ben','Saturday sorter',0],['Chloe','Saturday sorter',0],['Dmitri','Weekend driver',0]];
  const T=['Facility update','Tuesday truck loaders: use the front door next week'];
  const out=(j,r)=>j===0?(r?'<span style="color:var(--no)">Skips it as generic. Finds the side door locked on Tuesday.</span>':'<span class="small">Skips it as generic. Fine this time.</span>')
     :(r?'<span style="color:var(--ok)">Sees “Tuesday truck loaders,” reads it, uses the front door.</span>':'<span style="color:var(--ok)">Sees it’s not for them. Skips it in a second.</span>');
  L.h(L.kick('pr','Toggle and compare')+'<h1 class="q">Lena must tell all volunteers that the Elm Street side door is closed next Tuesday. Only the Tuesday truck loaders come in that day. Try both titles.</h1><div id="tt"></div><div id="rd" style="margin:8px 0"></div><div id="tq"></div>');
  T.forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.innerHTML=L.ic(j?'target':'info')+n;
    b.onclick=()=>{[...L.$('#tt').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(j);
      L.$('#rd').innerHTML=P.map(x=>'<div style="background:var(--soft);border-radius:14px;padding:10px 12px;margin:6px 0">'+L.ic('person')+'<b>'+x[0]+'</b> <span class="small">· '+x[1]+'</span><div style="margin-top:4px">'+out(j,x[2])+'</div></div>').join('');
      if(seen.size===2&&!L.$('#tq').innerHTML){const q=L.$('#tq');q.innerHTML='<h2 class="sub">Which title is better for all four readers?</h2>';
        L.mc(q,['“Facility update,” since it covers everyone','“Tuesday truck loaders: use the front door”'],1,
         'Ana, the one reader who needs it, reads it. Ben, Chloe and Dmitri skip it without wasting a minute.',
         'The generic title loses Ana, the only reader who needed it, and still makes the others guess. Name who it’s for.');}};
    L.$('#tt').appendChild(b);});}},
{part:2,src:'Chapter 8 · The rules of personally relevant writing',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which question fixes it?',['So what? · say why it matters','Why me? · say who it’s for'],[
   ['Lena’s email says “We have shifts open” but never says what a volunteer gets from coming.',0,'Readers can’t see why they should care. Lead with what they value.'],
   ['Kofi posts in the all-staff chat about a parking change that affects only truck drivers.',1,'Most staff will wonder why they got it. Address the drivers up front.'],
   ['Mei’s donor email explains the new shelving in detail but not how it helps families.',0,'Donors care about results for families. Answer “So what?” for them.'],
   ['The newsletter notes that the mobile pantry’s Oak Park stop is moving. Most families use other stops.',1,'Name Oak Park families in the headline so they notice and others can skip.'],
   ['Arjun’s message to new pantries explains the order system’s features but not the time it saves them.',0,'Lead with what a busy coordinator gains, like ordering in minutes.']]);}},
{part:2,src:'Chapter 8 · Fifth principle: tell readers why they should care',pts:1,run(L){
  L.h(L.kick('pr','Put it together')+'<h1 class="q">Kofi needs the board to approve the refrigerated-truck lease by Friday. Kofi’s subject line now reads “March update.” Which rewrite works best?</h1>');
  L.mc(L.card,['IMPORTANT, PLEASE READ: March board business','Board: vote by Friday so donated produce stays fresh','March update from Kofi, with several items inside'],1,
   'It answers “Why me?” (board members) and “So what?” (fresh produce for families, and a Friday deadline).',
   'Neither tells board members why this is for them or why it matters. Caps add urgency but no reason. Name the readers and the stakes.');}}
  ]
});
</script>
</body>
</html>
