<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Less Is More</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0004', title:'Less is more', minutes:19, icon:'leaf',
  goals:['Explain why longer messages get fewer readers and weaker results','Cut needless words, extra ideas and extra requests from a draft','Judge when a little extra length is worth its cost'],
  parts:['Why less','The limits','Fewer words','Ideas and requests'],
  read:'Read chapter 4 of the book for the full experiments and a longer list of wordy phrases to replace.',
  glossary:{
    concise:'Concise: saying what you need in as few words, ideas and requests as the goal allows.',
    'early-quitting':'Early quitting: when a reader drops out partway through a long message, meaning to come back, and may never return.'
  },
  cheatsheet:[
    'Concise writing costs the <b>writer</b> time and saves the <b>reader</b> time. Treat it as an investment.',
    'When editing, people tend to <b>add</b>. Push yourself to cut instead.',
    '<b>More deters:</b> long messages look like hard work, so readers skip them, put them off or quit early.',
    '<b>More dilutes:</b> every extra word, idea or request makes the key point easier to miss.',
    'Rule 1, <b>fewer words</b>: drop wordy phrases (“in order to” → “to”) and even nice-but-unneeded details.',
    'Rule 2, <b>fewer ideas</b>: keep the idea that matters most, and cut the rest.',
    'Rule 3, <b>fewer requests</b>: one clear ask beats several. Extra asks steal from the main one.',
    'Cut all that can be cut, <b>and no more</b>. Sometimes warmth or detail is worth the cost.'
  ],
  steps:[
/* ---------- PART 1: WHY LESS ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Two work emails land in your inbox. You only glance at their length. One is three lines, the other is six paragraphs. Which do you deal with first?</h1>');
  L.mc(L.card,['The six-paragraph one','The three-line one'],1,
   'In the authors’ survey, 165 of 166 professionals picked the short one too. This lesson is about why length matters so much.',
   'Almost everyone goes short first. In the authors’ survey, 165 of 166 professionals did. Length alone shapes what gets read.');}},
{part:0,src:'Chapter 4 · First principle: less is more',run(L){
  L.h(L.kick('learn','The myth that more is better')+'<h1 class="q">Short writing is harder to write and easier to read</h1>'+
   L.prose('Many writers believe more is better, maybe from school word counts, wanting to sound smart, or fear of leaving something out. But more writing makes readers <i>less</i> likely to read anything. An average adult reads about 240 words a minute, and every extra sentence also costs concentration.')+
   L.lanes([['pencil','The writer pays','Turning loose thoughts into a short, clear message takes real work. A stream of thoughts is much easier to type.',3],
            ['clock','The reader saves','A '+L.g('concise','concise')+' message is quicker to read, more likely to be read, and less likely to cause follow-ups and confusion.',2]])+
   L.prose('Most of us were never trained to cut. In one study, people summarized an article and were then asked to improve it. <b>83% added words.</b> We tend to add when we edit, not subtract.'));
  L.done();}},
{part:0,src:'Chapter 4 · First principle: less is more',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Kofi asks Mei to “polish” the newsletter draft. Left to instinct, what will Mei most likely do?</h1>');
  L.mc(L.card,['Leave the draft almost exactly as it is','Add words and details to the draft','Cut words and details from the draft'],1,
   'Research shows people tend to add when asked to improve something. Cutting takes deliberate effort.',
   'The research points the other way: when people edit, most of them add. Cutting has to be a deliberate choice.');}},
{part:0,src:'Chapter 4 · More deters readers',run(L){
  L.h(L.kick('learn','More deters readers')+'<h1 class="q">Length tells readers how hard something will be</h1>'+
   L.prose('The authors emailed over 7,000 school board members asking them to fill in a short survey. Half got a 127-word <i>Wordy</i> email, half a 49-word <i>Concise</i> one. Same survey, same link.')+
   L.flow([['list','Wordy · 127 words','2.7% replied','',3],['leaf','Concise · 49 words','4.8% replied','nearly twice as many',2]])+
   L.prose('Readers also guessed the survey would be harder after the long email. Only 15% of those who saw it expected the survey to take under five minutes, versus 29% for the short one.')+
   L.note('Some readers start a long message, feel it’s too much, and move on, hoping to return. The authors call this '+L.g('early-quitting','early quitting')+'. Some never come back, or come back after the deadline has passed.','alert'));
  L.done();}},
{part:0,src:'Chapter 4 · More deters readers',pts:1,
 solve:async L=>{L.$('#po').children[2].click();L.$('#run').click();},
 run(L){
  let p=null;const N=['Wordy, 130 words','Concise, 50 words'],C=['var(--h3)','var(--ok-strong)'],F=[5,9];
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">Mei tests Lena’s Saturday shift email: 60 volunteers get a 130-word version, 60 a 50-word one. Same ask, same link. What happens?</h1><div id="po"></div>'+
   '<div id="race" hidden><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:6px"><div class="small">Sign-ups so far</div><button class="btn pri" id="run">'+L.ic('play')+'Send both</button></div>'+
   N.map((n,j)=>'<div class="meterrow"><div class="lb">'+n+' · <b id="c'+j+'">0</b></div><div class="meter"><div id="m'+j+'" style="background:'+C[j]+'"></div></div></div>').join('')+'</div>');
  ['Wordy wins, it explains more','They come out about even','Concise gets more sign-ups'].forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=n;b.onclick=()=>{if(p!==null)return;p=j;b.classList.add('sel');L.$('#race').hidden=false;};L.$('#po').appendChild(b);});
  L.$('#run').onclick=function(){this.remove();let s=0;
    const t=setInterval(()=>{s++;F.forEach((f,j)=>{const v=Math.round(f*s/10),c=L.$('#c'+j),m=L.$('#m'+j);if(c)c.textContent=v;if(m)m.style.width=Math.round(v/10*100)+'%';});
      if(s>=10){clearInterval(t);L.award(p===2);
        L.sheet(p===2?'ok':'no',p===2?'You called it':'The short version won','These Fennick numbers are made up, but they mirror the book’s school-board study: the '+L.g('concise','concise')+' email got nearly <b>twice</b> the replies. Fewer readers skipped it, put it off or quit early.');L.done();}},200);};}},
{part:0,src:'Chapter 4 · More dilutes information',run(L){
  L.h(L.kick('learn','More dilutes information')+'<h1 class="q">Every extra word competes with your key point</h1>'+
   L.prose('Even readers who do engage are less likely to notice, understand and act on what matters most when a message holds more. The book gives two reasons:')+
   L.list([['eye','Skimmers think they got it','In a short message, a quick skim finds the main idea. In a long one, readers can skip the key point without noticing, or stop once they find what <i>they</i> wanted.'],
     ['cycle','Minds wander','A study found readers’ minds drift more often on longer passages. Drift off, and you may miss the one line that mattered.']],1)+
   L.prose('So the job is ruthless cutting. A former <i>Time</i> editor told staff that every word, sentence and idea has to earn its place.'));
  L.done();}},
{part:0,src:'Chapter 4 · More deters readers',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">A board member opens Kofi’s long memo, reads half, thinks “I’ll finish this tonight,” and doesn’t. The vote deadline passes. What happened?</h1>');
  L.mc(L.card,['The memo was diluted by too many points','The board member quit early and never came back','The board member decided not to engage at all'],1,
   'That’s early quitting: they started, meant to return, and missed the deadline.',
   'They did engage, and they didn’t miss the point while reading. They stopped partway, meaning to return, and never did. That’s early quitting.');}},
{part:0,src:'Chapter 4 · More deters, more dilutes',pts:4,run(L){
  L.h(L.kick('pr','Deters or dilutes?')+'<h1 class="q">Each reader was let down by a long message. Did length stop them reading, or bury the point?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Deters reading','Dilutes the point'],[
   ['A donor sees Mei’s 900-word appeal and closes it without reading.',0,'They never engaged. Length scared them off.'],
   ['A volunteer reads Lena’s whole email and remembers the party, not the shift ask.',1,'They read it, but the key point got lost among the rest.'],
   ['A pantry coordinator assumes Arjun’s long message means ordering is complicated and avoids it.',0,'Length signaled effort, so they stayed away.'],
   ['A board member skims Kofi’s memo, finds the budget figure they wanted, and stops.',1,'They met their own goal and missed Kofi’s.']],
   'More deters readers from starting, and dilutes the point for those who do. Both come from the same cause: too much.');}},

/* ---------- PART 2: THE LIMITS ---------- */
{part:1,src:'Chapter 4 · The limits of less',run(L){
  L.h(L.kick('learn','The limits of less')+'<h1 class="q">Shortest isn’t always best</h1>'+
   L.prose('Most people wrongly predict that wordier messages will work better. Part of the reason is a real tension: we want to be precise <i>and</i> complete, and we want readers to sense us as people, with warmth and style.')+
   L.prose('You can balance those things, but extra words always have a cost. Sometimes the cost is worth it.')+
   L.note('The book’s rule is not “always use the shortest message.” It is: <b>cut all that can be cut, and no more</b>, to suit your goal.','scale'));
  L.done();}},
{part:1,src:'Chapter 4 · The limits of less',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">A school district chooses the “less effective” email on purpose</h1>');
  L.beats(L.card,[
   ['The test','During remote schooling in the pandemic, the authors showed a school district that a concise survey message got more parent replies than a wordy one.'],
   ['The choice','The district kept sending the wordy one anyway.'],
   ['Why','Their top goal wasn’t survey replies. It was rebuilding warm relationships with parents after a hard year. The longer message felt more human.'],
   ['The point','They weighed their goals and decided warmth mattered more than replies. That was a fair, informed choice.']],
   'Know your goal first. Then decide how much length that goal is worth.');}},
{part:1,src:'Chapter 4 · The limits of less',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Cut hard, or keep the extra?',['Cut it to the bone','Extra is worth it'],[
   ['Lena’s reminder to volunteers about Saturday’s 9am shift start time.',0,'The goal is one fact, read fast. Every extra word works against it.'],
   ['Kofi’s note to a volunteer of twenty years whose spouse just died.',1,'Here the goal is care and connection. Warmth is the point, not a side effect.'],
   ['Arjun’s notice that the order deadline moved to Thursday noon.',0,'A deadline change is pure information. Short and plain wins.'],
   ['Mei’s thank-you to a family foundation after a hard year, renewing a long partnership.',1,'Rebuilding a relationship, like the school district, can justify some extra warmth.']]);}},

/* ---------- PART 3: FEWER WORDS ---------- */
{part:2,src:'Chapter 4 · Rule 1: Use fewer words',run(L){
  L.h(L.kick('learn','Rule 1 · Use fewer words')+'<h1 class="q">Swap long phrases for short ones that mean the same</h1>'+
   L.prose('The easiest first step is to drop truly needless words. Many common phrases have a shorter twin with nearly the same meaning:')+
   '<div style="display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px">'+[['in order to','to'],['for the reason that','because'],['in the near future','soon'],['whether or not','whether'],['with the exception of','except'],['ask the question','ask'],['one of the reasons','one reason']].map(x=>'<span class="chip static"><s style="opacity:.55">'+x[0]+'</s>&nbsp;→&nbsp;<b>'+x[1]+'</b></span>').join('')+'</div>'+
   L.prose('That part is easy to agree with. The harder part: sometimes it’s worth cutting words that are <i>not</i> quite needless, losing a little detail to save readers’ time.'));
  L.done();}},
{part:2,src:'Chapter 4 · Rule 1: Use fewer words',pts:1,
 solve:async L=>{L.$('#tx').querySelectorAll('.nw').forEach(s=>s.click());},
 run(L){
  const S=[['n','In order to','To'],['t',' keep the warehouse running, we need help '],['n','for the reason that','because'],['t',' our Saturday crew is small. Please tell me '],['n','whether or not','whether'],['t',' you can sort on '],['k','Saturday at 9am'],['t',', and sign up '],['n','in the near future','soon'],['t','.']];
  let left=4,miss=false;
  L.h(L.kick('pr','Trim it')+'<h1 class="q">Tap each wordy phrase in Lena’s message to swap in its short twin. Leave the key details alone.</h1>'+
   '<div id="tx" style="background:var(--soft);border-radius:16px;padding:14px;margin:10px 0;line-height:1.9"></div><div class="small" id="wc"></div><div id="tf"></div>');
  const tx=L.$('#tx');
  S.forEach(s=>{const e=document.createElement('span');e.textContent=s[1];
    if(s[0]==='n'){e.className='nw';e.style.cssText='background:rgba(230,160,40,.22);border-radius:6px;padding:1px 3px;cursor:pointer';
      e.onclick=()=>{if(e.dataset.d)return;e.dataset.d=1;e.textContent=s[2];e.style.background='rgba(60,170,110,.22)';left--;count();
        if(!left){L.award(!miss);L.sheet(miss?'info':'ok',miss?'Trimmed, but watch the key info':'Same message, fewer words','The meaning didn’t change at all. Only the reading time did. Notice “Saturday at 9am” stayed: needless words go, key details stay.');L.done();}};}
    else if(s[0]==='k'){e.style.cssText='cursor:pointer;font-weight:600';e.onclick=()=>{if(left){miss=true;L.fb(L.$('#tf'),'<b>Keep that one.</b> “Saturday at 9am” is the key information. Cut padding, not facts.','no');}};}
    tx.appendChild(e);});
  function count(){L.$('#wc').textContent='Words: '+tx.textContent.trim().split(/\s+/).length;}count();}},
{part:2,src:'Chapter 4 · Rule 1: Use fewer words',run(L){
  L.h(L.kick('ex','Two studies from the book')+'<h1 class="q">Cutting good-but-unneeded details pays off</h1>');
  L.beats(L.card,[
   ['The newsletter','Journalist’s Resource sends a weekly email to over 50,000 journalists. One issue offered six resources on wage theft, in 566 words.'],
   ['The cut','At the authors’ suggestion, its writers made a version with half the words (275), keeping all six links. They dropped lower-priority details, like a quote they liked but didn’t need.'],
   ['The result','Half the subscribers got each version. The shorter one got <b>twice as many clicks</b> on the resources.'],
   ['The consulting firm','In a separate study, employees answered short, focused emails faster than long ones. Shown a rambling email, more than one executive said they’d simply delete it.']],
   'Losing a little detail can win a lot of attention. Cut what’s relevant but not necessary.');}},
{part:2,src:'Chapter 4 · Rule 1: Use fewer words',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Mei’s newsletter item on a new school pantry includes a lovely quote from the principal. It’s relevant, but the item works without it. What does the book suggest?</h1>');
  L.mc(L.card,['Cut it, so the key point gets read','Keep it, since it’s relevant','Move it to the very top'],0,
   'Like Journalist’s Resource dropping a quote they liked, losing a nice detail can win more readers for the main point.',
   'Relevant isn’t the test. Necessary is. Journalist’s Resource cut a quote they liked and got twice the clicks.');}},
{part:2,src:'Chapter 4 · Rule 1: Use fewer words',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Arjun is rewriting the order reminder. Tap each piece until the sentence is as short as it can be without losing meaning.</h1>');
  L.sentence(L.card,[['For the reason that','Because'],['the truck leaves Friday,','the truck is scheduled to depart on Friday,'],['please order by Thursday noon.','it is requested that orders be placed by Thursday at noon.']],[1,0,0],
   [['Four words where “Because” does the same job.'],['Same meaning, five extra words. “Leaves” says it.'],['Wordy and indirect. “Please order by” is shorter and clearer.']],
   '<b>Because the truck leaves Friday, please order by Thursday noon.</b> Every word now earns its place.');}},

/* ---------- PART 4: IDEAS AND REQUESTS ---------- */
{part:3,src:'Chapter 4 · Rule 2: Include fewer ideas',run(L){
  L.h(L.kick('learn','Rule 2 · Include fewer ideas')+'<h1 class="q">Count the ideas, not just the words</h1>'+
   L.prose('The book shows a friend’s text about dinner that packs in about eight ideas: the time, the restaurant, its address, how good the breadsticks were, the untried lasagna, that it’s supposed to be tasty, a meet-up at the writer’s place 15 minutes early, and two friends joining.')+
   L.prose('The one that matters is <b>where and when to meet</b>. The other seven make it easier to miss. The whole text could be:')+
   L.note('<b>Dinner is on. Meet at my place at 6:15.</b>','chat')+
   L.prose('Cutting ideas often means dropping things that are relevant and true, so the most important one stands out.'));
  L.done();}},
{part:3,src:'Chapter 4 · Rule 2: Include fewer ideas',run(L){
  L.h(L.kick('ex','Two experiments')+'<h1 class="q">Fewer ideas, more action, even when it reads worse</h1>');
  L.beats(L.card,[
   ['The text messages','A school district texted about 22,700 parents a survey request. Half got 36 words with two warm, sympathetic sentences. Half got 20 words without them.'],
   ['Result','The shorter text got <b>6% more</b> responses. The warm lines added a second idea that competed with the ask.'],
   ['The fundraising email','A political campaign’s six-paragraph donation email went to over 776,000 people. The authors couldn’t tell which ideas mattered most besides the ask.'],
   ['The blunt cut','So they deleted every other paragraph. Most people who rated it said the short version flowed less well.'],
   ['Result','It still raised <b>16% more</b> money than the original.']],
   'Fewer ideas can beat smoother writing. There’s no magic number, so cut as much as your context allows.');}},
{part:3,src:'Chapter 4 · Rule 2: Include fewer ideas',pts:5,run(L){
  L.h(L.kick('pr','Keep or cut?')+'<h1 class="q">Lena’s text to Saturday volunteers has five ideas. Its goal: get people to the right door on time. Sort them.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Keep','Cut'],[
   ['Shift starts at 9am this Saturday.',0,'The when. Core to the goal.'],
   ['Use the side door on Elm Street; the front is locked.',0,'The where. Without it, people end up at a locked door.'],
   ['Last month we sorted a record 40,000 pounds.',1,'Nice news, but it has nothing to do with getting there on time.'],
   ['The new break room has a coffee maker.',1,'Pleasant, but it competes with the logistics.'],
   ['Thanks again for being such an amazing crew!',1,'Warm, but a second idea. Like the parent texts, it can pull attention from the ask.']],
   '<b>Saturday 9am, side door on Elm Street (front is locked).</b> Two ideas, both needed.');}},
{part:3,src:'Chapter 4 · Rule 3: Make fewer requests',run(L){
  L.h(L.kick('learn','Rule 3 · Make fewer requests')+'<h1 class="q">Ask for more, and readers do less</h1>'+
   L.prose('Two asks in one message? Readers often wait until they can do both, or do the easy one first and forget the hard one.')+
   L.list([['leaf','Climate actions','In one study, people given 1, 5 or 10 suggested actions took about two more actions on average than people given a list of 20.'],
     ['pointer','One link, not two','<i>Behavioral Scientist</i> promoted its new print issue. Dropping a second link to a past issue got <b>50% more clicks</b> on the main one.'],
     ['book','Crowded newsletters','At an economics newsletter, doubling the number of papers in a week cut each paper’s media coverage by about 30%.']],3)+
   L.prose('Readers don’t give a crowded message more time. They give each item less. Every extra ask steals from your main one.'));
  L.done();}},
{part:3,src:'Chapter 4 · Rule 3: Make fewer requests',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Arjun wants pantries to order by Thursday noon, and also to fill in a 10-minute survey about the new ordering system. Orders matter most. What should Arjun do?</h1>');
  L.mc(L.card,['Put both asks in one message, survey first','Put both asks in one message, order first','Ask only for the order now, survey another time'],2,
   'One ask keeps all the attention on the order. The survey can wait for its own message.',
   'Even with the order first, a second ask competes with it, like the second magazine link. Send the order request alone.');}},
{part:3,src:'Chapter 4 · The rules of less is more',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Mixed review: which rule fixes it?',['Fewer words','Fewer ideas','Fewer requests'],[
   ['Jordan writes “at this point in time” and “due to the fact that” all through an email.',0,'Swap the padding: “now,” “because.” Same meaning, fewer words.'],
   ['Lena asks volunteers to sign up, donate, share a post, fill in a survey and bring a friend.',2,'Five asks means each one gets less. Pick the one that matters most.'],
   ['Kofi’s truck-lease update also covers the gala, a new hire and a roof leak.',1,'Each is a separate idea competing with the decision the board must make.'],
   ['Mei’s appeal links to the donate page, the annual report and a volunteer form.',2,'Each link is an ask. Like the magazine test, extra links pull clicks from the main one.'],
   ['Arjun’s notice says “in the near future” and “with the exception of.”',0,'“Soon” and “except” do the same job in fewer words.']]);}}
  ]
});
</script>
</body>
</html>
