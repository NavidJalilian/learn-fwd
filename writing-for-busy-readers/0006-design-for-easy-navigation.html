<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Design for Easy Navigation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0006', title:'Design for easy navigation', minutes:20, icon:'map',
  goals:['Put the key information where busy readers will see it first','Lay out a message with spacing, grouping, order and headings so readers can find their way','Spot when a table or picture beats a paragraph'],
  parts:['Key info first','Separate and group','Order and headings','Visuals in action'],
  read:'Read chapter 6 of the book for the full school letter and the court summons redesign.',
  glossary:{
    'bury-the-lede':'Burying the lede: newsroom slang for hiding the main point deep inside a piece of writing, so readers have to hunt for it.',
    bluf:'BLUF (bottom line up front): a US Army writing rule. Put the key information at the very start, so readers always know where to find it.'
  },
  cheatsheet:[
    'Treat a message like a <b>map</b>: a big-picture view first, so readers can zoom in on what they need.',
    'Rule 1, <b>key info immediately visible</b>: use the subject line, first line or a summary. Put it where your readers expect it.',
    'Rule 2, <b>separate distinct ideas</b>: new paragraph, bullets or space for each topic.',
    'Rule 3, <b>place related ideas together</b>: group them, and often you can cut words too.',
    'Rule 4, <b>order by priority</b>: the first item gets the most attention.',
    'Rule 5, <b>headings</b>: long enough to describe the section, short enough not to replace it.',
    'Rule 6, <b>consider visuals</b>: a table or picture can beat a paragraph.',
    'Fit the culture and tone: sometimes one polite line comes before the point.'
  ],
  steps:[
/* ---------- PART 1: KEY INFO FIRST ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Kofi needs the board to approve a truck lease by Friday. Board members glance at subject lines between meetings. Which subject line gets the vote noticed?</h1>');
  L.mc(L.card,['“Vote needed by Friday: truck lease”','“Fennick monthly update, March”'],0,
   'The reader knows what the message is about, and what they must do, before opening it. This lesson is about designing messages so the important part can’t be missed.',
   'That subject line says nothing about a vote. Busy board members may file it for later and miss the deadline. Put the key point where they look first.');}},
{part:0,src:'Chapter 6 · Third principle: design for easy navigation',run(L){
  L.h(L.kick('learn','Think like a mapmaker')+'<h1 class="q">Readers use a message the way they use a map</h1>'+
   L.prose('Open a map and you first see the big picture: which country, which city. Then you zoom in on the part you need. Busy readers do the same with writing. They take in the overall shape, then zoom in on the parts that look useful.')+
   L.flow([['eye','Big picture','What is this about?'],['compass','Find your way','Which part do I need?'],['pointer','Zoom in','Read just that part']])+
   L.prose('School taught most of us grammar and evidence, not layout. But letters, words and paragraphs are visual shapes on a page or screen. Often you write better by working less on the words and more on <b>where and how they appear</b>.'));
  L.done();}},
{part:0,src:'Chapter 6 · Rule 1: Make key information immediately visible',run(L){
  L.h(L.kick('learn','Rule 1 · Key information immediately visible')+'<h1 class="q">Answer “What is this about?” right away</h1>'+
   L.prose('Journalists call hiding the main point '+L.g('bury-the-lede','burying the lede')+'. A magazine story may do it on purpose to build mood. Practical writing shouldn’t.')+
   L.prose('First, know your goals and rank them. Picture a CEO’s memo to the board: mainly an update, plus a smaller request for a consultant name. The layout should show that ranking.')+
   L.list([['list','Subject lines and titles','“One action item after today’s meeting” says more than “Today’s meeting.” They can only hint at the point, so keep going.'],
     ['arrow','The first lines','The US Army rule '+L.g('bluf','BLUF')+' puts the bottom line up front, so readers always know where to look.'],
     ['layers','Summaries','Executive summaries, abstracts and “TL;DR” lines all give busy readers a known place for the key point.']],1));
  L.done();}},
{part:0,src:'Chapter 6 · Rule 1: Make key information immediately visible',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Kofi’s memo covers the truck lease vote, program news and a staff update. The vote is what matters most. Where should it go?</h1>');
  L.mc(L.card,['After the program news, as a natural lead-in','At the very end, so it’s the last thing read','In the opening line, stated plainly'],2,
   'Bottom line up front. Even a board member who reads one line and stops will know a vote is needed.',
   'Then readers must get through other material first, and busy ones may stop before reaching it. Put the key point where they’ll see it first.');}},
{part:0,src:'Chapter 6 · Rule 1: Make key information immediately visible',run(L){
  L.h(L.kick('ex','It depends on your readers')+'<h1 class="q">“Up front” isn’t the same everywhere</h1>');
  L.beats(L.card,[
   ['Two cultures','The authors heard that in some former Soviet republics, official memos put the key point in the last paragraph, so readers skim from the bottom up. In many EU countries it goes in the first paragraph, so readers skim top-down.'],
   ['The insight','Both work, because readers know where to look and writers know where to put it. Your job is to put the key point where <i>your</i> readers expect it.'],
   ['When tone matters','Some messages are expected to feel warm. A sales email that opens with “Can we set up a time to discuss hiring my firm?” may feel pushy.'],
   ['The risk the other way','But if the ask sits at the end, after the pleasantries, readers who quit early never see it.'],
   ['A middle ground','Open with one polite sentence, then make the ask right away. One line of warmth, then the point.']],
   'There’s no single formula. Pick the placement that fits your goal and your readers.');}},
{part:0,src:'Chapter 6 · Rule 1: Make key information immediately visible',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'How should it open?',['Key point in line one','One warm line, then the point'],[
   ['Arjun tells all pantries the order deadline moved to Wednesday this week.',0,'Pure information that people must act on. Lead with it.'],
   ['Jordan’s first-ever email to the grocery chain manager, asking to pick up unsold produce.',1,'A cold email to a stranger can read as pushy if it opens with the ask. One polite line, then ask.'],
   ['Lena texts volunteers that Saturday’s shift is canceled because of snow.',0,'Readers need the news right away. Pleasantries could hide it.'],
   ['Kofi writes to a longtime donor after a hard year, asking them to renew their gift.',1,'The relationship matters here. A short warm opener, then the ask, so it isn’t buried.']]);}},

/* ---------- PART 2: SEPARATE AND GROUP ---------- */
{part:1,src:'Chapter 6 · Rule 2: Separate distinct ideas',run(L){
  L.h(L.kick('learn','Rule 2 · Separate distinct ideas')+'<h1 class="q">Give each topic its own space</h1>'+
   L.prose('A new paragraph tells readers “new topic here.” Bullets or numbers say it even more clearly.')+
   L.prose('In a Danish study, 888 adults read the rules for getting unemployment benefits, written in dense official language. Half saw one solid paragraph. Half saw the exact same words with each requirement on its own bullet.')+
   L.lanes([['list','Wall of words','One block. Readers had to work out where one requirement ended and the next began.',3],
            ['check','Visually separated','Same words, one bullet per requirement. Read about 10 seconds (nearly 15%) faster.',2]])+
   L.prose('Both groups understood it about equally well. The bullets just made it quicker. The authors expect blank space or numbers would work about as well.'));
  L.done();}},
{part:1,src:'Chapter 6 · Rule 2: Separate distinct ideas',pts:1,
 solve:async L=>{L.$('#vw').children[1].click();L.$('#vw').children[0].click();},
 run(L){
  const seen=new Set();
  const V=['<p style="margin:0">The board meets Thursday at 6pm in the new break room. The refrigerated truck lease needs a vote by Friday, and the cost is $1,900 a month for three years. March sorting hit a record 40,000 pounds. Two new partner pantries joined. The holiday party is set for December 12. Please send any questions about the lease to Kofi before Thursday.</p>',
    '<ul style="margin:0;padding-left:20px"><li><b>Vote by Friday:</b> refrigerated truck lease, $1,900 a month for three years. Questions to Kofi before Thursday.</li><li><b>Meeting:</b> Thursday, 6pm, new break room.</li><li><b>News:</b> record 40,000 pounds sorted in March; two new partner pantries.</li><li><b>Save the date:</b> holiday party, December 12.</li></ul>'];
  L.h(L.kick('pr','Toggle and compare')+'<h1 class="q">Same words from Kofi’s memo, two layouts. Switch between them and see how fast you can find the lease deadline.</h1><div id="vw"></div>'+
   '<div id="bx" style="background:var(--soft);border-radius:16px;padding:14px;margin:10px 0;line-height:1.6;min-height:120px"><span class="small">Choose a layout above.</span></div><div id="vq"></div>');
  ['Wall of words','Separated'].forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.innerHTML=L.ic(j?'list':'book')+n;
    b.onclick=()=>{[...L.$('#vw').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');L.$('#bx').innerHTML=V[j];seen.add(j);
      if(seen.size===2&&!L.$('#vq').innerHTML){const q=L.$('#vq');q.innerHTML='<h2 class="sub">In the Danish study, what did separating the ideas change?</h2>';
        L.mc(q,['Readers understood far more of it','Readers got through it faster'],1,
         'Same understanding, nearly 15% faster. Readers no longer had to work out where one idea ended and the next began.',
         'Understanding was about the same in both groups. The gain was speed: about 10 seconds, nearly 15% faster.');}};
    L.$('#vw').appendChild(b);});}},
{part:1,src:'Chapter 6 · Rule 3: Place related ideas together',run(L){
  L.h(L.kick('learn','Rule 3 · Place related ideas together')+'<h1 class="q">Keep what belongs together, together</h1>'+
   L.prose('The book shows a to-do list where two people’s tasks are mixed up. Reorder it so each person’s tasks sit side by side, and you can merge them, cutting words too. Here is the same idea at Fennick:')+
   L.lanes([['x','Mixed','Lena: email volunteers<br>Arjun: book the truck<br>Lena: print sign-in sheets<br>Arjun: check the freezer',3],
            ['check','Grouped','<b>Lena:</b> email volunteers, print sign-in sheets<br><b>Arjun:</b> book the truck, check the freezer',2]])+
   L.prose('<b>Several requests?</b> If they’re related, group them and give each its own line. If each belongs to a different section, put each in its section, and list them all at the top too. The repeat helps busy readers respond.'));
  L.done();}},
{part:1,src:'Chapter 6 · Rule 3: Place related ideas together',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Mei’s newsletter asks donors three things, each tied to a different story far down the page. How should Mei handle the asks?</h1>');
  L.mc(L.card,['Leave each ask inside its own story only','List all three at the top, then repeat each in its story','Move all three asks to the very end'],1,
   'Put each ask in its own section, and preview them at the top. Readers who skim still see all three.',
   'The asks are spread across different stories. The book suggests keeping each in its section <i>and</i> listing them together at the top, so skimmers don’t miss any.');}},
{part:1,src:'Chapter 6 · Rule 3: Place related ideas together',pts:5,run(L){
  L.h(L.kick('pr','Group it')+'<h1 class="q">Kofi’s memo jumps between topics. Put each item into the section where it belongs.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Truck lease','Program news','Events'],[
   ['The lease costs $1,900 a month for three years.',0,'A lease detail. It belongs with the vote.'],
   ['Two new partner pantries joined in March.',1,'Program news, separate from the decision.'],
   ['Without a refrigerated truck, fresh produce spoils in summer.',0,'The reason for the lease sits next to the lease.'],
   ['The holiday party is on December 12.',2,'An event. Keep it apart from the decision.'],
   ['The mobile pantry is moving to a new stop.',1,'Program news.']],
   'With related items side by side, a board member can read the whole lease case in one place.');}},

/* ---------- PART 3: ORDER AND HEADINGS ---------- */
{part:2,src:'Chapter 6 · Rule 4: Order ideas by priority',run(L){
  L.h(L.kick('learn','Rule 4 · Order ideas by priority')+'<h1 class="q">First place gets the most attention</h1>'+
   L.prose('Sometimes logic sets the order: by due date, or by how hard each task is. When it doesn’t, go by how people read. They start at the top and stop when they find something good enough.')+
   L.list([['check','Ballots','In some Texas elections, moving a candidate from last to first on the ballot raised their vote share by nearly 10 percentage points.'],
     ['pointer','Search results','The top spot is the most valuable, because people click the first good-enough result.'],
     ['scale','The last spot','Jurors weigh the last evidence heavily, but they must sit through it all. Busy readers don’t have to, so fewer of them reach the end.']],1)+
   L.prose('So put what matters most first.'));
  L.done();}},
{part:2,src:'Chapter 6 · Rule 4: Order ideas by priority',pts:1,
 solve:async L=>{L.$('#po').children[0].click();L.$('#run').click();},
 run(L){
  let p=null;const F=[30,21,15,11,8,10];
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">Mei shuffles the order of six links in the newsletter for different readers, like a study in the book. Which spot gets clicked most?</h1><div id="po"></div>'+
   '<div id="race" hidden><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:6px"><div class="small">Clicks by position</div><button class="btn pri" id="run">'+L.ic('play')+'Send it</button></div>'+
   F.map((f,j)=>'<div class="meterrow"><div class="lb">Link '+(j+1)+' · <b id="c'+j+'">0</b></div><div class="meter"><div id="m'+j+'" style="background:'+(j===0?'var(--ok-strong)':'var(--h3)')+'"></div></div></div>').join('')+'</div>');
  ['The first link','A middle link','The last link'].forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=n;b.onclick=()=>{if(p!==null)return;p=j;b.classList.add('sel');L.$('#race').hidden=false;};L.$('#po').appendChild(b);});
  L.$('#run').onclick=function(){this.remove();let s=0;
    const t=setInterval(()=>{s++;F.forEach((f,j)=>{const v=Math.round(f*s/10),c=L.$('#c'+j),m=L.$('#m'+j);if(c)c.textContent=v;if(m)m.style.width=Math.round(v/30*100)+'%';});
      if(s>=10){clearInterval(t);L.award(p===0);
        L.sheet(p===0?'ok':'no',p===0?'You called it':'The first link won','Clicks fall with each position, then rise a little for the last one. These Fennick numbers are made up, but the pattern matches the study the book describes. First place matters most, and last beats second-to-last.');L.done();}},200);};}},
{part:2,src:'Chapter 6 · Rule 4: Order ideas by priority',pts:1,run(L){
  L.h(L.kick('pr','Put it in order')+'<h1 class="q">Kofi ranks the memo’s goals: get the lease vote, then get feedback on the budget, then share news, then a date to save. Order the memo’s sections.</h1><div id="or"></div>');
  L.order(L.$('#or'),['Vote by Friday: truck lease','Budget: your feedback, please','March news from the warehouse','Save the date: holiday party'],
   'Most important first. A board member who reads only the top will still see the vote, and the budget ask comes next.',
   ['1st','2nd','3rd','4th']);}},
{part:2,src:'Chapter 6 · Rule 5: Include headings',run(L){
  L.h(L.kick('learn','Rule 5 · Include headings')+'<h1 class="q">Headings are the state lines on your map</h1>'+
   L.prose('Headings let readers scan and decide where to zoom in. Eye-tracking shows readers’ eyes jump from heading to heading. Emails, memos, even chat posts can open with a few words that set up what follows.')+
   L.note('<b>A study from the book:</b> a newsletter with three topics went to 46,648 subscribers. Half got headings above topics two and three. They were <b>more than twice as likely</b> to click links in those topics, and clicks on the first topic didn’t drop.','book')+
   L.tiers([['x','Too vague','“Next steps”','says nothing'],['check','Just right','“What is the school doing?”','describes the section',true,'Aim here'],['alert','Too long','A heading that sums up the whole section','adds reading work']]));
  L.done();}},
{part:2,src:'Chapter 6 · Rule 5: Include headings',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">A school letter fixed by layout alone</h1>');
  L.beats(L.card,[
   ['The letter','During the pandemic, a school district wrote to families: someone with Covid had been in a school, and the school would close for at least 48 hours, starting right away.'],
   ['The problem','The closure sat in a bulleted list partway down a long letter. A parent skimming it while cooking dinner might never notice that school was closed.'],
   ['The rule','The authors had little context, so they didn’t change a single word. They only changed the layout.'],
   ['The redesign','They added one bold line at the top: the school will be closed for at least 48 hours. Then question-style headings: what the school is doing, how you’ll know if your child was exposed, and what to do if someone is sick.'],
   ['Honest caveat','This version wasn’t tested. The authors are confident it worked better because it was easier to navigate.']],
   'Rule 1 for the key point, Rule 5 for the rest. Parents can jump to what they need.');}},
{part:2,src:'Chapter 6 · Rule 5: Include headings',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Rate Mei’s newsletter headings',['Too vague','Just right','Too long'],[
   ['“Updates”',0,'Readers can’t tell what’s inside or whether it’s for them.'],
   ['“Where the mobile pantry stops now”',1,'Clear about the topic, short enough to scan.'],
   ['“The mobile pantry moves to Lincoln Park on Tuesdays from 4 to 6pm starting March 3”',2,'That’s the whole section crammed into a heading. If the heading says it all, it’s too long.'],
   ['“How to sign up for a Saturday shift”',1,'Tells volunteers exactly what they’ll find.'],
   ['“Miscellaneous”',0,'Says nothing about the content. Readers will skip it.']]);}},

/* ---------- PART 4: VISUALS IN ACTION ---------- */
{part:3,src:'Chapter 6 · Rule 6: Consider using visuals',run(L){
  L.h(L.kick('learn','Rule 6 · Consider using visuals')+'<h1 class="q">Sometimes the best words are no words</h1>'+
   L.quote('Is this best conveyed with words?','Nancy Gibbs, former editor of Time, in margin notes to staff')+
   L.prose('Pictures can cross language barriers: a good symbol needs no translation. Graphs show trends. Step-by-step graphics show how to do things. Even a simple table can beat a paragraph. The book borrows an example from the US government’s plain-language guidelines, where a deadline that depends on how you send a form becomes a two-row table. At Fennick:')+
   '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:15px;margin:6px 0 10px"><tr><th style="text-align:left;padding:6px;border-bottom:2px solid var(--line,#ddd)">If you order…</th><th style="text-align:left;padding:6px;border-bottom:2px solid var(--line,#ddd)">We need it by…</th></tr><tr><td style="padding:6px">Online</td><td style="padding:6px">Thursday, noon</td></tr><tr><td style="padding:6px">By phone</td><td style="padding:6px">Wednesday, 5pm</td></tr></table></div>'+
   L.prose('A reader who orders online reads one row and is done.'));
  L.done();}},
{part:3,src:'Chapter 6 · Rule 6: Consider using visuals',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Which part of Fennick’s partner handbook would gain most from a table?</h1>');
  L.mc(L.card,['A welcome note from Kofi to new partners','Pickup days and times for each of 12 pantries','The story of how Fennick was founded'],1,
   'Each pantry looks up its own row and skips the rest. That’s exactly what tables are good at.',
   'That works well as prose. A table helps when readers need to look up one item among many, like their own pantry’s pickup time.');}},
{part:3,src:'Chapter 6 · The rules in action',run(L){
  L.h(L.kick('ex','All the rules at once')+'<h1 class="q">A redesigned court summons kept thousands out of trouble</h1>');
  L.beats(L.card,[
   ['The problem','In New York City, people charged with minor offenses get a paper summons to appear in court. Many didn’t show up, and missing court can lead to an arrest warrant. Officials assumed it was a choice.'],
   ['The old form','It was titled “Complaint/Information.” The court date, time and place sat near the bottom, below details about the person and the charges.'],
   ['The redesign','A clear title, “Criminal Court Appearance Ticket,” with where and when at the top (Rules 1 and 4). Court details moved away from the officer’s details (Rule 2), with address, date and time together (Rule 3).'],
   ['More fixes','Headings like “Show up to court on” (Rule 5). Courthouses printed as a row of bubbles to fill in, instead of an officer’s handwriting (Rule 6).'],
   ['The result','Nearly 324,000 people over 17 months got one form or the other. Missed court dates were <b>13% lower</b> with the new one, an estimated 23,000 fewer warrants. It’s now the standard form citywide.']],
   'Many people weren’t choosing to skip court. The form was just hard to navigate.');}},
{part:3,src:'Chapter 6 · The rules of well-designed writing',pts:6,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which rule is Kofi using?',['Key info visible','Separate ideas','Related together','Priority order','Headings','Visuals'],[
   ['The memo now opens with “Vote needed by Friday: truck lease.”',0,'The point is stated where readers look first.'],
   ['Each piece of news gets its own bullet instead of one long paragraph.',1,'Space between topics shows where one ends and the next begins.'],
   ['The lease cost, the reason and the deadline now sit in one section.',2,'Everything about the lease is in one place.'],
   ['The budget ask now comes second, ahead of the warehouse news.',3,'Ranked by importance, since nothing else sets the order.'],
   ['Above the news section Kofi adds “What happened in March.”',4,'Tells skimmers what the section holds.'],
   ['Kofi swaps three paragraphs of lease prices for a small chart comparing the options.',5,'Numbers compared side by side read faster as a picture.']]);}},
{part:3,src:'Chapter 6 · Rule 1: Make key information immediately visible',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Write the opening of Kofi’s memo. Tap each piece until a board member who reads only this line knows what to do.</h1>');
  L.sentence(L.card,[['Some thoughts on','Vote needed by Friday:'],['approving the refrigerated truck lease.','the refrigerated truck situation we discussed.'],['Details below under “Truck lease.”','Other updates follow, in no particular order.']],[1,0,0],
   [['Vague. It hides that a decision is needed, and when.'],['“Situation” doesn’t say what you’re asking for. Name the decision.'],['Point readers to the details. “No particular order” throws away Rule 4.']],
   '<b>Vote needed by Friday: approving the refrigerated truck lease. Details below under “Truck lease.”</b> The key point is visible, and the heading tells readers where to zoom in.');}}
  ]
});
</script>
</body>
</html>
