<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Words, Our Selves</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0011', title:'Our words, our selves, and what comes next', minutes:18, icon:'person',
  goals:['Explain how readers’ views of a writer shape how a message lands','Choose formality and warmth to fit your readers without losing the point','Use the truth test and the six-principle checklist on your own writing'],
  parts:['How readers judge us','Style and tone','The truth test','Now what?'],
  read:'Read chapters 11 and 12 of the book for the research on writers’ identities and the authors’ closing thoughts, then print the six-principle checklist from the book.',
  glossary:{
    'truth-test':'Truth test: the book’s check on honesty. Effective writing assumes the writer wants to be understood; writing that seems deliberately complicated may be hiding something.',
    formality:'Formality: how official or casual a message sounds, from “To whom it may concern” to “Hi, friend!” Readers use it to judge a writer’s credibility and intent.'
  },
  cheatsheet:[
    'Readers judge a message partly by who they think wrote it. The same one-line email can read as fine from one sender and rude from another.',
    'Randomized experiments in the US have repeatedly found bias against writers seen as women or minorities. That burden is unfair, and it isn’t the writer’s fault.',
    'Lower-status writers writing upward tend to send longer messages with fewer direct asks. Warmth signals get judged differently depending on who sends them.',
    '<b>Formality:</b> match what readers expect. Too stiff with a close colleague is odd; too casual with someone in power can read as rude.',
    '<b>Warmth:</b> one warm, personal sentence can help; two paragraphs of preamble can backfire. Sometimes writers choose not to bend to unfair expectations.',
    '<b>Truth test:</b> the principles assume you want to be understood. As a reader, be alert when a message seems deliberately complicated.',
    'Practice until the six principles are automatic. They help the writer too. AI tools can draft, but they don’t yet write with how people read in mind.',
    'Every time you write, ask: <b>How can I make this easier for the reader?</b>'
  ],
  steps:[
/* ---------- PART 1: HOW READERS JUDGE US ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">A board member gets the same one-line email, “Need your vote by Friday.” Once from Kofi, the director, once from Jordan, the newest staff member. Will it read the same both times?</h1>');
  L.mc(L.card,['Yes, the words are identical','Probably not, readers weigh who sent it'],1,
   'Readers judge messages through what they think of the writer. This lesson is about that, and what to do about it.',
   'The words are the same, but readers bring expectations about who should write how. From Kofi it may read as normal; from Jordan, some readers may find it abrupt.');}},
{part:0,src:'Chapter 11 · Our words, our selves',run(L){
  L.h(L.kick('learn','The writer is part of the message')+'<h1 class="q">Readers read the words, and also guess at who wrote them</h1>'+
   L.prose('Readers have expectations about how certain kinds of people <i>should</i> write, and assumptions about how they <i>do</i>. They quickly judge the writer from word choice, sentence shape, structure and tone.')+
   L.lanes([['person','From one sender','A one-line email reads as efficient.',2],
            ['person','From another','The same line reads as rude.',3]])+
   L.prose('The book is direct about why: stereotypes about gender, race, ethnicity and social status reach into writing too. Messages from women, racial or ethnic minorities, or people in low-status roles are often judged less favorably than the same messages from others.'));
  L.done();}},
{part:0,src:'Chapter 11 · Our words, our selves',run(L){
  L.h(L.kick('ex','What the book reports')+'<h1 class="q">A story, then the experiments</h1>');
  L.beats(L.card,[
   ['A story','Two professional editors, one a man and one a woman, swapped email signatures for a week. The book calls it anecdotal, but familiar.'],
   ['What they noticed','With the man’s signature, the woman found clients more receptive and took her more seriously. With the woman’s, the man found clients questioned his suggestions more and talked down to him.'],
   ['The experiments','Randomized experiments in the US have repeatedly shown bias against writers seen as women or minorities.'],
   ['Fewer replies','People were less likely to answer emails from senders they believed to be Black than from senders they believed to be White. This showed up among the general public, university professors, state legislators and public offices like libraries and county clerks.'],
   ['Hiring','University faculty rated male applicants for a junior research job as more competent and hirable than female applicants.']],
   'How a reader sees the writer can change how well the same message works. That is the reader’s bias, not a flaw in the writer.');}},
{part:0,src:'Chapter 11 · Our words, our selves',run(L){
  L.h(L.kick('learn','How identity shapes the writing')+'<h1 class="q">Writers adjust, often because they know how they’ll be seen</h1>'+
   L.list([['arrow','Writing upward','When lower-status writers write to higher-status readers, they tend to write longer messages with few direct requests. Higher-status writers tend to do the opposite.'],
     ['chat','Signals of warmth','Research finds women are more likely than men to use exclamation points, apologies and hedges like “I think” and “I feel.”'],
     ['scale','A catch-22','Women who write more like men report being seen as too cold or too aggressive. The book says writers from many stereotyped groups face this bind.']],1)+
   L.note('None of this is a judgment on these writers. It describes a world where the same words are received differently.','info'));
  L.done();}},
{part:0,src:'Chapter 11 · Our words, our selves',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Jordan, the newest staff member, writes long emails with buried asks whenever writing to board members. What does the chapter say about this pattern?</h1>');
  L.mc(L.card,['It shows Jordan simply lacks writing talent','It’s typical of lower-status writers writing up','It’s what busy board members prefer to get'],1,
   'Writers writing to people with more status tend to go longer and ask less directly. Knowing that, Jordan can choose differently.',
   'The book describes a common pattern tied to status, not talent. And longer, less direct messages are harder, not easier, for busy readers.');}},

/* ---------- PART 2: STYLE AND TONE ---------- */
{part:1,src:'Chapter 11 · Shape your identity as a writer',run(L){
  L.h(L.kick('learn','Shape your identity as a writer')+'<h1 class="q">You can’t change how society sees you. You can choose your style.</h1>'+
   L.prose('We have limited control over our identities and can’t fix society’s views alone. What we can do is stay aware of how our words may be read, and how that affects our goals.')+
   L.note('The book is frank that this is unfair: the extra effort falls most on people from disadvantaged groups. It’s also a balancing act, since giving in to stereotypes can help keep them alive.','scale')+
   L.prose('Every message starts with a choice of style and tone. Some settings have firm norms, like a formal grant letter. Everyday writing leaves many choices: “Hi, friend!” or “To whom it may concern”? Readers use these choices to judge how likable, credible and relatable you are.'));
  L.done();}},
{part:1,src:'Chapter 11 · Shape your identity as a writer',run(L){
  L.h(L.kick('learn','Formal or informal?')+'<h1 class="q">Match what your readers expect</h1>'+
   L.prose('Some studies found readers were more likely to respond to government messages in fairly '+L.g('formality','formal')+' language, partly because formality signals credibility there. Politicians who wrote informally on social media were seen as less credible, and people trusted unfamiliar brands less when they sounded casual, though these norms are shifting.')+
   L.lanes([['x','Too stiff','A formal, distant email to a close colleague or friend comes across as strange, even rude.',3],
            ['x','Too casual','A breezy email to someone in a position of power can also come across as rude.',3]])+
   L.prose('Either mismatch can make readers less likely to respond. As a general rule, write formally when that’s what readers expect.'));
  L.done();}},
{part:1,src:'Chapter 11 · Shape your identity as a writer',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Jordan is writing a first email to a city council office about a grant for the mobile pantry. Which opening fits best?</h1>');
  L.mc(L.card,['“Hey there! Quick q about grants 😊”','“Dear Council Member Ortiz,”','“Yo, got a sec for a pantry thing?”'],1,
   'A government office is a setting where readers expect formality, and it signals credibility.',
   'Breezy openings can read as rude to someone in a position of power, and may lower Jordan’s chances of a reply.');}},
{part:1,src:'Chapter 11 · Shape your identity as a writer',run(L){
  L.h(L.kick('learn','Warmth versus conciseness')+'<h1 class="q">A little warmth helps. A lot can backfire.</h1>'+
   L.prose('Lines like “Hope this finds you well!” don’t serve the main goal, but they matter in human contact. Cutting every one of them can make a message seem aggressive or rude, and less likely to be read.')+
   L.prose('For writers who are women, racial or ethnic minorities, or lower in status, the book says a bit more warmth may serve their goals, even at some cost in length. But “less is more” still holds:')+
   L.flow([['check','One warm sentence','Can engage the reader and buffer against harsh expectations','',2],['x','Two paragraphs of preamble','Can lose readers and even hurt how you’re seen','',3]],false)+
   L.note('Sometimes the right move is to refuse an unfair expectation. A writer in a senior role need not pile on extra warmth or formality to please readers who underrate them. Norms have changed partly because people refused to bend.','flame'));
  L.done();}},
{part:1,src:'Chapter 11 · Shape your identity as a writer',pts:1,
 solve:async L=>{const c=L.$('#tt').children;c[0].click();c[1].click();c[2].click();},
 run(L){
  const seen=new Set(),T=['No warmth','One warm line','Long preamble'];
  const E=['Dear Sam Patel, can Fennick pick up your unsold produce on Tuesdays? Two times to talk are below.',
    'Dear Sam Patel, thank you for the fresh bread your store gave our spring drive. Could Fennick pick up your unsold produce on Tuesdays? Two times to talk are below.',
    'Dear Sam Patel, I hope this finds you well. I am so sorry to take your time, as I know you must be incredibly busy. I wanted to introduce myself and tell you a little about Fennick, our history and our partners… (two paragraphs later) …I was wondering whether you might possibly consider produce pickups?'];
  const R=['<span style="color:var(--no)">Clear, but some readers may find it abrupt from someone they don’t know.</span>',
    '<span style="color:var(--ok)">Friendly and personal, and the ask is still in the second sentence.</span>',
    '<span style="color:var(--no)">The ask is buried and hedged. A busy manager may stop reading first.</span>'];
  L.h(L.kick('pr','Turn the warmth dial')+'<h1 class="q">Jordan’s cold email to Sam Patel, a grocery manager. Try all three openings.</h1><div id="tt"></div><div id="rd" style="margin:8px 0"></div><div id="tq"></div>');
  T.forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.innerHTML=L.ic(['x','check','layers'][j])+n;
    b.onclick=()=>{[...L.$('#tt').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(j);
      L.$('#rd').innerHTML='<div style="background:var(--soft);border-radius:14px;padding:12px 14px">'+L.ic('pencil')+'<span class="small">Jordan’s draft</span><p style="margin:6px 0">'+E[j]+'</p><div class="small">'+L.ic('person')+'Sam: '+R[j]+'</div></div>';
      if(seen.size===3&&!L.$('#tq').innerHTML){const q=L.$('#tq');q.innerHTML='<h2 class="sub">Which should Jordan send?</h2>';
        L.mc(q,['No warmth, since less is always more','One warm line, then the ask','The long preamble, to be polite'],1,
         'One genuine, personal sentence builds goodwill without hiding the ask. That’s “less is more” adjusted for the real world.',
         'The book’s balance: a single warm, personal sentence can help, while cutting all warmth risks seeming rude and long preamble loses busy readers.');}};
    L.$('#tt').appendChild(b);});}},
{part:1,src:'Chapter 11 · Shape your identity as a writer',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'What style fits these readers?',['More formal','More casual'],[
   ['Kofi’s letter to a state agency about a food-safety grant',0,'Readers expect formality from and to public offices, and it signals credibility.'],
   ['Lena texting Ben, a longtime volunteer and friend, about Saturday',1,'A stiff note to a close friend would seem strange, even rude.'],
   ['Jordan’s first email to a board member they haven’t met',0,'Writing to someone with more power, too casual can read as rude.'],
   ['Arjun messaging Mei in the staff chat about lunch orders',1,'Close colleagues in chat expect a relaxed tone. Formality would feel odd.']]);}},
{part:1,src:'Chapter 11 · Shape your identity as a writer',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Tap each piece to build Jordan’s email to a board member: warm, but direct.</h1>');
  L.sentence(L.card,[['Thanks for your help at last month’s food drive.','I’m so sorry to bother you, I know you’re incredibly busy.'],['I was hoping that maybe, if it’s not too much trouble,','Could you'],['you might possibly look at the volunteer policy?','approve the new volunteer policy by Friday?']],[0,1,1],
   [['An apology up front signals low status and delays the point. One warm, specific line works better.'],['Stacked hedges bury the request. Ask directly.'],['A vague “look at” leaves the reader unsure what to do. Name the action and the deadline.']],
   'One warm, specific sentence, then a direct ask with a deadline. Courteous and easy to act on.');}},

/* ---------- PART 3: THE TRUTH TEST ---------- */
{part:2,src:'Chapter 11 · Apply the truth test',run(L){
  L.h(L.kick('learn','Apply the truth test')+'<h1 class="q">The whole book assumes you want to be understood</h1>'+
   L.prose('Every principle takes for granted that the writer’s stated goal is their real goal. That isn’t always true. Some writers want to hide information they must disclose.')+
   L.list([['trend','Company reports','Studies find firms write more obscurely when disclosing things like CEO pay to investors.'],
     ['flask','Science','Scientists write more complexly when their research is fraudulent.'],
     ['alert','Paid spin','Some writers are paid to spread misleading ideas and lies, common on social media and nothing new.']],3)+
   L.note('The book offers no help for writing unclearly on purpose. Its advice is for readers: when a message seems <b>deliberately complicated</b>, slow down. Usually it’s just weak writing. Sometimes it means the writer has something to hide.','eye'));
  L.done();}},
{part:2,src:'Chapter 11 · Apply the truth test',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">The truck leasing company sends Kofi a contract where every other section is clear, but the fees section is long and tangled. What does the truth test suggest?</h1>');
  L.mc(L.card,['Skim it, since contracts are always dense','Read it closely and ask for a plain summary','Assume the company is lying and walk away'],1,
   'It may just be poor writing, but a part that seems deliberately complicated is worth a careful look and a plain-language question.',
   'The book says to be cautious, not cynical or careless. Most unclear writing is just unclear; sometimes it hides something. Slow down and ask.');}},
{part:2,src:'Chapter 11 · Apply the truth test',pts:4,run(L){
  L.h(L.kick('pr','Truth test')+'<h1 class="q">Does each Fennick message pass the truth test?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Passes','Fails'],[
   ['Mei’s appeal says plainly in the first paragraph that the matching gift has ended',0,'The key fact is easy to find, even though it’s not good news.'],
   ['Arjun mentions a new delivery fee only on page four, in a long technical sentence',1,'Unwelcome news made hard to find is exactly what the truth test flags.'],
   ['Kofi’s board memo puts the truck lease’s total cost right next to the ask',0,'Readers can weigh the real cost before they vote.'],
   ['A volunteer waiver hides that photos may be used in ads inside dense legal wording',1,'Writing to obscure, not to inform. Say it plainly instead.']],
   'Effective writing makes the important things easy to see, including the inconvenient ones.');}},

/* ---------- PART 4: NOW WHAT? ---------- */
{part:3,src:'Chapter 12 · Now what?',run(L){
  L.h(L.kick('learn','Make it automatic')+'<h1 class="q">Practice until you don’t have to think about it</h1>'+
   L.prose('Anything that takes a lot of conscious attention is draining, so we put it off. The goal is to make the principles part of how you normally write, the way driving or typing gets easy enough to do while talking.')+
   L.lanes([['people','It helps readers','Their lives get easier, as every lesson showed.',2],
            ['person','It helps you','It sharpens your own goals and makes reaching them more likely. It isn’t charity.',1]])+
   L.prose('Miscommunication can strain friendships and careers. The same skills scale from scheduling dinner to helping students stay out of debt and patients get to appointments.'));
  L.done();}},
{part:3,src:'Chapter 12 · Now what?',run(L){
  L.h(L.kick('learn','What will change, and what won’t')+'<h1 class="q">New media will keep coming. Busy readers will stay busy.</h1>'+
   L.prose('Email, texting and social media were each new once, and each brought new norms. Social views of identity keep changing too. But readers will still have too little time and attention.')+
   L.note('AI chatbots can help: a first draft from bullet points, polishing, or getting past a blank screen. But effective writing depends on how people <i>read</i>, and the book says these tools aren’t yet trained for that. That part is still the writer’s job.','bulb')+
   L.prose('The book began by saying that if a busy reader misses your point, it’s on the writer. It ends with one habit to keep:')+
   L.quote('How can I make this easier for the reader?','Todd Rogers and Jessica Lasky-Fink, chapter 12'));
  L.done();}},
{part:3,src:'Chapter 12 · The six principles checklist',run(L){
  L.h(L.kick('ex','The checklist at Fennick')+'<h1 class="q">The staff tape the six principles above their desks. A month later:</h1>');
  L.beats(L.card,[
   ['1 · Less is more','Lena’s weekly email is down to one ask, the Saturday shift. Fewer words, ideas and requests.'],
   ['2 · Make reading easy','Arjun’s ordering notes swap “cold-chain SKUs” for “frozen and chilled food.” Short, common words; shorter sentences.'],
   ['3 · Design for easy navigation','Kofi’s board memo opens with the vote, under a clear heading. Key information is visible first.'],
   ['4 · Enough formatting but no more','Lena bolds only the shift time. No more ALL CAPS rainbow.'],
   ['5 · Why readers should care','Mei’s subject lines say what donors’ gifts do, and name who each message is for.'],
   ['6 · Make responding easy','Jordan offers Sam Patel two call times, with everything needed in one email.']],
   'Six principles, one question behind all of them: how can I make this easier for the reader?');}},
{part:3,src:'Chapter 12 · Now what?',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Jordan asks an AI chatbot to draft the produce email. It comes back polished and long. What’s left for Jordan to do?</h1>');
  L.mc(L.card,['Read it as Sam Patel would and revise','Nothing, since a polished draft is ready','Add more detail so it looks thorough'],0,
   'The tool can draft, but Jordan knows the reader: a busy manager. Cut it down, put the ask first, make replying easy.',
   'Polished isn’t the same as easy for a busy reader. The book says these tools don’t yet write with how people read in mind.');}},
{part:3,src:'Chapter 12 · The six principles checklist',pts:6,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Course review: which principle fixes it?',['Less is more','Make reading easy','Design for navigation','Enough formatting','Why readers care','Make responding easy'],[
   ['Lena’s email has five different asks, and volunteers answer none.',0,'Fewer requests: one clear ask gets more action.'],
   ['Arjun writes “Allocation necessitates submission antecedent to the cutoff.”',1,'Short, common words: “Please order by Thursday noon.”'],
   ['Kofi’s vote request sits on page two of a long memo.',2,'Make key information immediately visible and order ideas by priority.'],
   ['Half of Lena’s email is bold, red or underlined.',3,'Limit formatting so the one key line stands out.'],
   ['Mei’s subject line, “Fennick update,” gives donors no reason to open it.',4,'Ask “So what?” and lead with what donors value.'],
   ['Jordan asks Sam Patel to “suggest some times to talk.”',5,'Simplify the steps: offer two specific times.']]);}},
{part:3,src:'Chapter 12 · Now what?',pts:1,run(L){
  L.h(L.kick('pr','Put it all together')+'<h1 class="q">Which final version of Jordan’s email to Sam Patel should go out?</h1>');
  L.mc(L.card,['A long apology, Fennick’s history, then a soft hope about pickups','One warm line, the pickup ask, why it helps, and two call times','“Fennick wants your unsold produce. Call us.” and nothing else'],1,
   'Warm but brief, direct ask, the reader’s “So what?”, and an easy reply. Every lesson in one email.',
   'One version buries the ask in apology and history; the other is so blunt it may seem rude and leaves Sam Patel to do the work. Aim for warm, direct and easy to answer.');}}
  ]
});
</script>
</body>
</html>
