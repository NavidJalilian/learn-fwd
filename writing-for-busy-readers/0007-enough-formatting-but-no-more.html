<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enough Formatting but No More</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0007', title:'Use enough formatting but no more', minutes:19, icon:'pencil',
  goals:['Pick formatting that readers will read the way you mean it','Bold, underline or highlight the one idea that matters most','Spot overformatting and strip a message back to one clear focus'],
  parts:['Why format','Match expectations','Bold the key','Limit it'],
  read:'Read chapter 7 of the book for the full survey, the bullet-point example and the taxi email itself.',
  glossary:{
    formatting:'Formatting: changes to how words look, such as bold, underline, highlight, italics, color, ALL CAPS or bullets.',
    contrast:'Visual contrast: when something looks different from what’s around it. The eye notices it first, without trying.',
    emphasis:'Emphasis: stressing a word to deepen the meaning of its sentence (“I am <i>very</i> excited”), which is not the same as marking it as the most important point.'
  },
  cheatsheet:[
    'Formatting does two jobs: it <b>adds meaning</b> and it <b>grabs attention</b> through contrast.',
    'Readers apply their own rules of thumb to formatting. Those rules don’t always match what you meant.',
    '<b>Bold, underline, highlight</b> are widely read as “most important.” Italics, color, ALL CAPS and bullets get mixed readings.',
    'ALL CAPS can read as shouting, and is slower to read. Don’t bullet low-priority items: bullets look important.',
    'Unsure how readers will read a format? Say it: “The most important points are in blue,” or add a label like “Most important:”.',
    'Formatting pulls attention <b>to</b> the formatted words and <b>away from</b> everything else. Format the right thing.',
    'Format one thing, in one style. Several highlights dilute each other; mixed styles create chaos.',
    'Check: read <b>only</b> the formatted words. Would a busy reader get what they need?'
  ],
  steps:[
/* ---------- PART 1: WHY FORMAT ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Lena’s volunteer email has twelve phrases in bold, three in red and two in ALL CAPS. The one line asking for Saturday help is plain. What will most skimmers notice?</h1>');
  L.mc(L.card,['The plain line asking for Saturday help','The bold, red and capital phrases'],1,
   'Formatted words stand out, so the eye goes there first. The plain ask hides in the crowd. This lesson is about using that pull on purpose.',
   'The plain line is the one that gets lost. Formatted words stand out, so busy eyes go there first and skip the rest.');}},
{part:0,src:'Chapter 7 · Fourth principle: use enough formatting but no more',run(L){
  L.h(L.kick('learn','Formatting is a spice')+'<h1 class="q">A little, chosen with care, goes a long way</h1>'+
   L.prose('The authors compare '+L.g('formatting','formatting')+' to spices in cooking: add it on purpose, and don’t overdo it. Bold, underline, italics, ALL CAPS and bullets are ingredients, not decoration.')+
   L.prose('Even spaces between words were once an invention. Early writing in the Roman alphabet ran words together, and Irish scribes in the seventh century began adding spaces to make reading easier. Compare:')+
   L.lanes([['x','Without spaces','<span style="word-break:break-all">Fennickneedssortersthissaturday</span>',3],
            ['check','With spaces','Fennick needs sorters this Saturday',2]])+
   L.prose('Later came paragraphs, then italics, highlighting and bold. Each tool helps readers see and navigate a text.'));
  L.done();}},
{part:0,src:'Chapter 7 · Fourth principle: use enough formatting but no more',run(L){
  L.h(L.kick('learn','Two jobs, one catch')+'<h1 class="q">Formatting adds meaning and grabs the eye</h1>'+
   L.flow([['bulb','Adds meaning','It says something beyond the words, like “this matters most.”','',2],['eye','Grabs attention','Formatted words '+L.g('contrast','contrast')+' with plain ones, so they get noticed first.','',1]],false)+
   L.prose('Remember the park scene from lesson 2: the eye jumps to whatever stands out. A bold phrase in a plain paragraph is the person walking the dog.')+
   L.note('<b>The catch:</b> readers decide what your formatting means using their own '+L.g('rule-of-thumb','rules of thumb')+'. ALL CAPS often reads as shouting; italics can read as emphasis or even as snark. Their rule may not match what you meant.','alert'));
  L.done();}},
{part:0,src:'Chapter 7 · Fourth principle: use enough formatting but no more',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Arjun bolds “Thursday noon” in their ordering instructions. Which two things is the bold doing?</h1>');
  L.mc(L.card,['Making the message look more professional and complete','Signaling “this matters” and drawing the eye to it first','Making the deadline easier to remember next week'],1,
   'Formatting adds meaning (this matters most) and grabs attention through contrast.',
   'The book names two jobs: formatting adds meaning beyond the words, and it grabs attention because it contrasts with plain text.');}},

/* ---------- PART 2: MATCH EXPECTATIONS ---------- */
{part:1,src:'Chapter 7 · Rule 1: Match formatting to readers’ expectations',run(L){
  L.h(L.kick('learn','Rule 1 · Match readers’ expectations')+'<h1 class="q">What readers think each format means</h1>'+
   L.prose('The authors asked 797 people, with no hints, what writers mean by common formatting. Some formats got one clear answer. Others got several.')+
   L.tiers([['check','Bold, underline, highlight','The vast majority read these as “what the writer thinks is most important.”','Clear signal',true,'Safe'],
            ['pencil','Italics and font color','Some read them as “most important,” others as stressing one word inside a sentence.','Mixed signal'],
            ['alert','ALL CAPS','Most read it as important, but about 25% said it signals anger.','Mixed signal'],
            ['list','Bullets','Most read them as important; many also read them as a connected, ordered list.','Mixed signal']])+
   '<p class="small" style="margin-top:10px">Texts and most social media don’t allow bold or underline, so writers there lean on the words themselves, ALL CAPS or emoji.</p>');
  L.done();}},
{part:1,src:'Chapter 7 · Italics and font color',run(L){
  L.h(L.kick('learn','Importance is not emphasis')+'<h1 class="q">Is this word the main point, or just stressed?</h1>'+
   L.prose('Marking the most important point is different from '+L.g('emphasis','emphasis')+'. In “I am <i>very</i> excited for Saturday,” the word <i>very</i> isn’t the key information. It just shows how excited the writer is.')+
   L.prose('Because italics and color can mean either, readers may guess wrong. Some fields have settled norms (legal writing italicizes case names), but most everyday writing doesn’t. So remove the guesswork:')+
   L.list([['chat','Announce your style','“The most important points are in blue.” Textbooks do this with key terms.'],
     ['pointer','Add a label','Put “Most important:” before the formatted line, so nobody has to guess.']],2));
  L.done();}},
{part:1,src:'Chapter 7 · All capital letters (all caps)',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">ALL CAPS in the fine print</h1>');
  L.beats(L.card,[
   ['The rule','US consumer rules say key terms in disclosures must be “clear and conspicuous,” meaning easy to notice.'],
   ['The habit','So many companies set key parts of their terms and conditions in ALL CAPS. Some state laws even require caps for certain sections.'],
   ['The problem','Some courts have since decided that caps alone are not enough to inform people.'],
   ['The research','Studies agree: capital-letter passages take much longer to read, especially for older adults, and can lower understanding.'],
   ['The upside','Caps work in every medium, even texts. But they can easily read as rude or childish shouting.']],
   'ALL CAPS can hide words in plain sight. If you use them, make sure readers will hear importance, not anger.');}},
{part:1,src:'Chapter 7 · All capital letters (all caps)',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Lena texts volunteers: “SATURDAY SHIFT NOW STARTS AT 10.” What’s the risk?</h1>');
  L.mc(L.card,['Some volunteers read it as Lena being upset','Phones will show the text in a smaller font','Volunteers will treat it as a casual aside'],0,
   'About a quarter of people read ALL CAPS as anger. Readers may stop to wonder which Lena means, and caps are slower to read.',
   'Caps do grab attention, so it won’t look casual, and phones show them fine. The real risk is the mixed reading: some hear shouting.');}},
{part:1,src:'Chapter 7 · Bullets',run(L){
  L.h(L.kick('learn','Bullets say “important”')+'<h1 class="q">Readers judge a list by the line above it</h1>'+
   L.prose('Bullets can make dense text much easier. The US plain-language guidelines show a long paragraph of Medicaid rules rewritten as a short lead-in line plus bullets, with sub-bullets under the one item they belong to. Same content, much faster to read.')+
   L.list([['arrow','The lead-in line decides','Readers read the sentence before a list to judge if the list is worth reading. If the order matters, say so there.'],
     ['layers','Sub-bullets belong to their parent','If the bullet above doesn’t apply to a reader, they skip everything nested under it.'],
     ['alert','Bullets look important','Readers may read the bullets, feel done, and skip the rest of your message.']],1));
  L.done();}},
{part:1,src:'Chapter 7 · Bullets',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">Thirteen bullets about gifts, one buried question</h1>');
  L.beats(L.card,[
   ['The email','A board chair emailed fellow board members. A main goal: find a date for the next board meeting.'],
   ['The layout','The scheduling question sat in a paragraph at the end. Above it were six paragraphs, including a bulleted list of thirteen gifts new clients get, like chocolates and a plant.'],
   ['What readers saw','The bullets stood out and looked like the important part. Readers could read them and feel done.'],
   ['The result','The chair had trouble scheduling the meeting.'],
   ['The fix','List the gifts in one sentence, separated by semicolons. Then they no longer pull attention from the real question.']],
   'Only bullet what deserves attention. Low-priority lists can sit inside a sentence.');}},
{part:1,src:'Chapter 7 · Bullets',pts:1,
 solve:async L=>{const c=L.$('#vt').children;c[0].click();c[1].click();},
 run(L){
  const seen=new Set();
  const V=[
   '<p>Hi team! Our new break room is stocked with:</p><ul style="margin:6px 0 10px 18px"><li>Coffee</li><li>Granola bars</li><li>Fresh fruit</li><li>Juice boxes</li><li>Cookies</li></ul><p>Can you take a Saturday sorting shift? Reply with a time that works.</p>',
   '<p>Hi team! Our new break room is stocked with coffee; granola bars; fresh fruit; juice boxes; and cookies.</p><p style="margin-top:10px">Can you take a Saturday sorting shift? Reply with a time that works.</p>'],
   R=['<span style="color:var(--no)">The eye lands on the snack list first. A skimmer reads the bullets, feels done, and may never reach the shift ask.</span>',
      '<span style="color:var(--ok)">Nothing pulls focus from the shift ask. The snacks are still there for anyone who reads every word.</span>'];
  L.h(L.kick('pr','Toggle and compare')+'<h1 class="q">Lena’s draft lists the break-room snacks. Try both layouts and see where a skimmer’s eye goes.</h1><div id="vt"></div>'+
   '<div id="em" style="background:var(--soft);border-radius:16px;padding:14px;margin:8px 0;min-height:150px" class="small">Choose a layout above.</div><div class="res" id="er"></div><div id="eq"></div>');
  ['Snacks as bullets','Snacks in one sentence'].forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.innerHTML=L.ic(j?'pencil':'list')+n;
    b.onclick=()=>{[...L.$('#vt').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(j);L.$('#em').innerHTML=V[j];L.$('#er').innerHTML=R[j];
      if(seen.size===2&&!L.$('#eq').innerHTML){const q=L.$('#eq');q.innerHTML='<h2 class="sub">Which layout should Lena send?</h2>';
        L.mc(q,['Snacks in one sentence, ask stands alone','Snacks as bullets, the ask follows below'],0,
         'The snack list is low priority. Bulleting it would tell readers it matters most and pull them away from the shift ask.',
         'Bullets signal importance. Here they would steer skimmers to the snacks and away from the one thing Lena needs.');}};
    L.$('#vt').appendChild(b);});}},
{part:1,src:'Chapter 7 · Rule 1: Match formatting to readers’ expectations',pts:6,run(L){
  L.h(L.kick('pr','Clear or mixed?')+'<h1 class="q">How reliably will readers take each choice to mean “this matters most”?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Clear signal','Mixed signal'],[
   ['Mei <b>bolds</b> the donation deadline in the newsletter.',0,'Most readers read bold as the writer’s most important point.'],
   ['Kofi turns the board vote date <span style="color:var(--h3)">orange</span>.',1,'Color can mean “most important” or just emphasis. Kofi should say what orange means.'],
   ['Arjun writes “ORDER BY THURSDAY NOON” in caps in a chat.',1,'Most see importance, but about a quarter see anger.'],
   ['Lena <u>underlines</u> the shift start time.',0,'Underline joins bold and highlight as a clear “most important” signal.'],
   ['Jordan puts <i>please</i> in italics in a request.',1,'Italics often read as emphasis inside a sentence, or even as snark, not as the key point.'],
   ['Mei highlights the event date in yellow.',0,'Highlighting is widely read as the most important information.']],
   'Bold, underline and highlight are the safe choices for “most important.” With the others, tell readers what you mean or pick a clearer tool.');}},

/* ---------- PART 3: BOLD THE KEY ---------- */
{part:2,src:'Chapter 7 · Rule 2: Highlight, bold, or underline the most important ideas',run(L){
  L.h(L.kick('learn','Rule 2 · Bold the most important idea')+'<h1 class="q">Format the key line, and more readers act on it</h1>'+
   L.prose('In one study, more than 1,600 paid participants read a five-paragraph passage. Midway through paragraph four, one sentence told them how to answer a later question.')+
   L.flow([['list','No formatting','65% followed the instruction · almost 2 minutes reading','',3],['star','Key sentence bold, underlined or highlighted','89% followed it · about 20 seconds less reading','',2]])+
   L.prose('Formatting the key words did three things at once: readers noticed them, understood the request, and spent less time on everything else.'));
  L.done();}},
{part:2,src:'Chapter 7 · Rule 2: Highlight, bold, or underline the most important ideas',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Mei highlights the one sentence in a five-paragraph donor update that asks readers to confirm their address. What should Mei expect?</h1>');
  L.mc(L.card,['More readers confirm, and they read the rest a bit less','More readers confirm, and they read the rest more closely','About the same number confirm, but they read faster'],0,
   'That’s the trade-off from the study: the highlighted line gets read more, and the rest gets less time.',
   'The study found both effects: far more readers followed the formatted sentence, and they spent less time on the rest, not more.');}},
{part:2,src:'Chapter 7 · Rule 2: Highlight, bold, or underline the most important ideas',pts:1,
 solve:async L=>{L.$('#po').children[2].click();L.$('#run').click();},
 run(L){
  let p=null;const N=['No formatting','Wrong sentence highlighted'],C=['var(--h2)','var(--h3)'],F=[48,39];
  L.h(L.kick('pr','Predict, then watch')+L.note('In a 2021 study, about 1,000 people read a passage with an instruction hidden in paragraph four. Following it earned a bonus. One group saw no formatting. Another saw a <i>different, unimportant</i> sentence highlighted.','book')+
   '<h1 class="q" style="margin-top:16px">What did highlighting the wrong sentence do to the share who found the instruction?</h1><div id="po"></div>'+
   '<div id="race" hidden><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:6px"><div class="small">Followed the instruction</div><button class="btn pri" id="run">'+L.ic('play')+'Show results</button></div>'+
   N.map((n,j)=>'<div class="meterrow"><div class="lb">'+n+' · <b id="c'+j+'">0</b>%</div><div class="meter"><div id="m'+j+'" style="background:'+C[j]+'"></div></div></div>').join('')+'</div>');
  ['Raised it','No real change','Lowered it'].forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=n;b.onclick=()=>{if(p!==null)return;p=j;b.classList.add('sel');L.$('#race').hidden=false;};L.$('#po').appendChild(b);});
  L.$('#run').onclick=function(){this.remove();let s=0;
    const t=setInterval(()=>{s++;F.forEach((f,j)=>{const v=Math.round(f*s/10),c=L.$('#c'+j),m=L.$('#m'+j);if(c)c.textContent=v;if(m)m.style.width=v+'%';});
      if(s>=10){clearInterval(t);L.award(p===2);
        L.sheet(p===2?'ok':'no',p===2?'You called it':'It lowered it','48% found the instruction with no formatting, but only 39% when an unimportant sentence was highlighted. Readers likely assumed the highlight marked what mattered and read everything else less closely. Formatting is a trade-off: it pulls attention <b>toward</b> one thing and <b>away</b> from the rest.');L.done();}},200);};}},
{part:2,src:'Chapter 7 · Rule 2: Highlight, bold, or underline the most important ideas',pts:1,
 solve:async L=>{L.$('#tx').querySelector('[data-k]').click();},
 run(L){
  const S=[['Thank you all for a record month: 40,000 pounds sorted!',0],['The new break room by the Elm Street side door is finally open.',0],['Please reply by Thursday to claim a Saturday sorting shift.',1],['Our holiday party is on December 12, more details soon.',0]];
  let first=true;
  L.h(L.kick('pr','Bold one thing')+'<h1 class="q">Lena can bold just one sentence. Lena’s goal this week is filling Saturday shifts. Tap the sentence to bold.</h1>'+
   '<div id="tx" style="background:var(--soft);border-radius:16px;padding:14px;margin:10px 0;line-height:1.8"></div><div id="tf"></div>');
  S.forEach(s=>{const e=document.createElement('span');e.textContent=s[0]+' ';e.style.cursor='pointer';if(s[1])e.dataset.k=1;
    e.onclick=()=>{if(L.$('#tx').dataset.done)return;
      if(s[1]){L.$('#tx').dataset.done=1;e.style.fontWeight='700';if(first)L.award(true);
        L.sheet(first?'ok':'info',first?'That’s the one':'Got there','Bold the idea that serves the goal. The record, the break room and the party are nice to know, but the shift ask is what Lena needs readers to act on.');L.done();}
      else{if(first){L.award(false);first=false;}e.style.fontWeight='700';setTimeout(()=>{e.style.fontWeight='';},900);
        L.fb(L.$('#tf'),'<b>Not that one.</b> It’s pleasant news, but bolding it would pull eyes away from what Lena needs: Saturday sign-ups.','no');}};
    L.$('#tx').appendChild(e);});}},

/* ---------- PART 4: LIMIT IT ---------- */
{part:3,src:'Chapter 7 · Rule 3: Limit your formatting',run(L){
  L.h(L.kick('learn','Rule 3 · Limit your formatting')+'<h1 class="q">Highlight five things and each one counts for less</h1>'+
   L.prose('In another version of the bonus study, one group saw only the instruction highlighted. Another saw it highlighted along with four other sentences.')+
   '<div style="margin:6px 0 12px">'+[['One sentence highlighted',84,'var(--ok-strong)'],['Five sentences highlighted',65,'var(--h2)'],['Nothing highlighted',55,'var(--h3)']].map(x=>'<div class="meterrow"><div class="lb">'+x[0]+' · <b>'+x[1]+'%</b></div><div class="meter"><div style="width:'+x[1]+'%;background:'+x[2]+'"></div></div></div>').join('')+'</div>'+
   L.prose('Five highlights still beat none, but they spread busy readers’ attention across all of them. As with words, ideas and requests, <b>less is more</b>.'));
  L.done();}},
{part:3,src:'Chapter 7 · Rule 3: Limit your formatting',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">The taxi email that formatted everything</h1>');
  L.beats(L.card,[
   ['The email','Co-author Jessica booked a taxi. The reply used it all: bold, ALL CAPS, underlines, italics, bullets, several font sizes and colors.'],
   ['The confusion','Shown it, students disagreed on what mattered most: the pickup details, the help phone number, the $25 deposit, or the cash balance due later. Was the all-caps balance line angry, or just a note?'],
   ['The misread','“All confirmed & booked” was bold and underlined, so Jessica thought her ride was booked. It wasn’t.'],
   ['The real point','Only after several reads did she see the one thing that mattered: pay a $25 deposit to confirm the ride.'],
   ['The cost','Jessica worked it out. Other readers likely didn’t, which may have cost the company customers and travelers their flights.']],
   'The authors liken it to a peanut butter, ham and blue-cheese sandwich on banana bread: good ingredients, awful together.');}},
{part:3,src:'Chapter 7 · Rule 3: Limit your formatting',run(L){
  L.h(L.kick('learn','When several things matter')+'<h1 class="q">Three important items? Ask two questions first</h1>'+
   L.list([['Is it all truly important?','Often, on a second look, only one item is.'],
     ['Does it all need to be in one message?','Some items can wait or go in a separate message (more on this in lesson 10).'],
     ['If yes to both, format sparingly','Format each key item clearly, accepting that the rest of the message will get less attention.']],2)+
   L.note('<b>The check:</b> imagine a busy reader reads <i>only</i> the formatted words. Do they learn everything essential? If not, rethink. And don’t mix many formatting types: that dilutes each one and creates visual chaos.','eye'));
  L.done();}},
{part:3,src:'Chapter 7 · Rule 3: Limit your formatting',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Kofi wants readers to notice one thing in their board memo: the truck-lease vote by Friday. Right now Kofi has highlighted six sentences. What should Kofi do?</h1>');
  L.mc(L.card,['Add bold to the vote sentence on top of its highlight','Remove the highlighting so nothing competes','Keep one highlight, on the vote, and remove the rest'],2,
   'One highlight did best in the study. The vote gets readers’ attention without five rivals.',
   'Stacking another format adds chaos, and removing all highlights throws away the pull. One highlight on the vote did best in the study.');}},
{part:3,src:'Chapter 7 · Rule 3: Limit your formatting',pts:1,
 solve:async L=>{L.$('#only').click();},
 run(L){
  L.h(L.kick('pr','Read only the formatted words')+'<h1 class="q">Here is Lena’s first draft. Press the button to see what a skimmer who reads only the formatting takes away.</h1>'+
   '<div id="dr" style="background:var(--soft);border-radius:16px;padding:14px;margin:10px 0;line-height:1.8">'+
   '<span class="f"><b>HI TEAM!!!</b></span> <span class="p">Here’s what’s new this week.</span> <span class="f"><b>Record month: 40,000 pounds sorted!</b></span> <span class="f"><u>The new break room is open.</u></span> <span class="f" style="color:var(--h3)">Holiday party on December 12!</span> <span class="p">We still need people for Saturday sorting shifts, so please reply by Thursday if you can help.</span> <span class="f"><b><i>THANK YOU ALL!!</i></b></span></div>'+
   '<button class="btn pri" id="only">'+L.ic('eye')+'Show only formatted words</button><div id="oq"></div>');
  L.$('#only').onclick=function(){this.remove();L.$('#dr').querySelectorAll('.p').forEach(e=>{e.style.opacity='.12';});
    const q=L.$('#oq');q.innerHTML='<h2 class="sub">The shift ask vanished. What’s Lena’s best fix?</h2>';
    L.mc(q,['Bold the shift ask too, keeping the rest','Format only the shift ask, in one style','Remove every bit of formatting from it'],1,
     'One formatted line, in one style, gets the most readers to it. Now the formatted-only read is the key message.',
     'A sixth bold line just joins the crowd, and no formatting at all did worse than one highlight in the study. Format only the ask.');};}},
{part:3,src:'Chapter 7 · Rule 3: Limit your formatting',pts:1,run(L){
  L.h(L.kick('pr','Put it in order')+'<h1 class="q">Mei thinks three newsletter items all matter. Put Mei’s steps in the order the book suggests.</h1>');
  L.order(L.card,['Ask whether each item is truly important','Ask whether all three must go in one message','Format each key item, in a single style','Read only the formatted words as a check'],
   'Question the items first, then the message, then format sparingly, then test it like a busy reader would.');}},
{part:3,src:'Chapter 7 · The rules of effective formatting',pts:6,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which rule would fix it?',['Rule 1 · Match expectations','Rule 2 · Format the key idea','Rule 3 · Limit formatting'],[
   ['Arjun writes the order deadline in ALL CAPS in a chat. Dev, a pantry coordinator, asks if Arjun is upset.',0,'Caps have a mixed reading. Bold, or plain words, would say “important” without “angry.”'],
   ['Mei’s newsletter bolds a caption under a volunteer photo. The donation link is plain text.',1,'The bold is pulling readers to the wrong thing. Bold the donation link instead.'],
   ['Lena’s flyer mixes red, bold, caps and underlines across nine lines.',2,'So much formatting dilutes every part of it and leaves readers guessing what matters.'],
   ['Kofi puts the vote date in italics, assuming everyone will read italics as “most important.”',0,'Italics get mixed readings. Use bold, or announce what italics mean.'],
   ['Jordan’s email to a grocery manager has no formatting, and the one pickup-time question sits in paragraph four.',1,'Bolding the key question would help a busy manager find it.'],
   ['Rosa highlights five sentences in their pantry update, including the one change in pickup hours.',2,'Five highlights compete. Keep only the pickup-hours change highlighted.']]);}}
  ]
});
</script>
</body>
</html>
