<!doctype html>

<title>Make Reading Easy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">

</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0005', title:'Make reading easy', minutes:19, icon:'eye',
  goals:['Explain why easy-to-read writing gets read and understood more','Swap fancy words for short, common ones without losing meaning','Fix sentences so readers get them in one pass, one idea at a time'],
  parts:['Why readable','Short words','Sentences','In action'],
  read:'Read chapter 5 of the book for the full readability studies and the side-by-side presidential speeches.',
  glossary:{
    'grade-level':'Reading grade level: a readability score shown as the US school grade a reader would need to finish to understand a text. Nursery rhymes are about grade 4.',
    'five-dollar-word':'Five-dollar word: a long, rare or fancy word (like “acquiesce”) used where a short, everyday one (“agree”) would do.',
    'straightforward':'Straightforward sentence: a sentence whose words come in a logical order, with related words next to each other, so readers get it in one read-through.'
  },
  cheatsheet:[
    '<b>Readability</b> is mostly about word and sentence length: short, common words and short, simple sentences are easier to read.',
    'Harder writing gets read less and understood less, and it hits people with less time, lower literacy or English as a second language hardest.',
    '<b>Short is not the same as easy.</b> A short message full of fancy words is still hard.',
    'Rule 1, <b>short and common words</b>: “get,” not “acquire.” If length and commonness clash, pick the common word.',
    'Rule 2, <b>straightforward sentences</b>: logical order, related words close, understood in one read-through.',
    'Rule 3, <b>shorter sentences</b>: one idea per sentence. Same words split into two sentences read far more easily.',
    'Context matters: some readers expect complexity. Aim for the <b>least complexity</b> that still engages your reader.',
    'Readable isn’t dumbed down. It is harder to write and worth the work.'
  ],
  steps:[
/* ---------- PART 1: WHY READABLE ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Two signs on the food bank door say the same thing in the same number of words. Which one would you take in faster?</h1>');
  L.mc(L.card,['“Ingress prohibited subsequent to 5pm”','“No entry after 5pm, please”'],1,
   'Same length, very different effort. This lesson is about why short, common words and simple sentences matter so much.',
   'Both have five words, but “ingress” and “subsequent” slow almost everyone down. Length isn’t the only thing that makes reading hard.');}},
{part:0,src:'Chapter 5 · Second principle: make reading easy',run(L){
  L.h(L.kick('learn','What readability means')+'<h1 class="q">Some text simply takes more work to read</h1>'+
   L.prose('The book opens with two things that make busy readers give up: <b>length</b> (lesson 4) and <b>complexity</b>. '+L.g('readability','Readability')+' is a way to measure complexity. The US military built the first measures in 1917, to check whether soldiers could read well enough for their jobs.')+
   L.prose('Scores are often given as a '+L.g('grade-level','reading grade level')+': the school grade you’d need to finish to understand the text.')+
   L.flow([['bowl','Nursery rhymes','about grade 4','',2],['book','The New York Times','about grade 11','',3]])+
   L.prose('The grade labels are rough, since schools vary so much. The key idea is simpler: <b>shorter, more common words</b> and <b>shorter, simpler sentences</b> are easier to read.'));
  L.done();}},
{part:0,src:'Chapter 5 · Second principle: make reading easy',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Arjun wants the ordering instructions to score as easier to read. Which change helps most?</h1>');
  L.mc(L.card,['Put the instructions in a nicer font','Add a friendly greeting at the top','Use shorter words and shorter sentences'],2,
   'Readability is mostly set by how long and common the words are and how long and simple the sentences are.',
   'That may help in other ways, but readability measures look at words and sentences: their length, how common they are, and how they’re built.');}},
{part:0,src:'Chapter 5 · Readable writing is effective',run(L){
  L.h(L.kick('learn','Readable writing is effective')+'<h1 class="q">Hard writing gets read less and understood less</h1>'+
   L.list([['shield','Consent forms','Studies show up to 60% of patients who sign consent forms for health research don’t understand what the forms say.'],
     ['people','Social posts','In a study of over 4,000 posts on a popular photo blog, simpler posts got more likes, comments and shares.'],
     ['star','Travel reviews','Across more than 41,000 reviews of New Orleans attractions, the more readable a review, the more “helpful” votes it got.']],1)+
   L.note('<b>The exception:</b> some readers expect complex writing and read it as effort or seriousness. More complex US research grant proposals got more funding on average, and the same held for some crowdfunding appeals. So aim for the <b>least complexity</b> that still engages your intended reader.','scale'));
  L.done();}},
{part:0,src:'Chapter 5 · Readable writing is clear',run(L){
  L.h(L.kick('ex','Who pays for hard writing')+'<h1 class="q">Short doesn’t mean easy, and hard writing doesn’t hit everyone equally</h1>');
  L.beats(L.card,[
   ['Short but hard','Fewer words alone don’t make text easy. You can write a short sentence stuffed with rare, long words. Given two messages of equal length, the one with simpler words takes less time and effort.'],
   ['Minds wander','Readers drift off more on complex text. Some give up if they don’t understand, or don’t have time to work it out.'],
   ['Who it hurts most','About half of American adults read at an eighth-grade level or below. About 20% speak English as a second language, and researchers estimate a similar share have dyslexia.'],
   ['Even strong readers','Fluent readers also read and understand simpler text faster. Easy writing helps everyone.'],
   ['Sometimes on purpose','Website terms and conditions read, on average, like scholarly journal articles. The book notes some companies may make terms hard to read so customers miss costly details.']],
   'Fennick’s readers include families who read English as a second language and people working two jobs. Hard writing shuts them out first.');}},
{part:0,src:'Chapter 5 · Readable writing is clear',pts:4,run(L){
  L.h(L.kick('pr','Short and easy, or short but hard?')+'<h1 class="q">All four Fennick messages are short. Sort them by how easy they are to read.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Short and easy','Short but hard'],[
   ['“Mobile pantry: new stop starts Tuesday. Same hours.”',0,'Short words, short sentences. Most readers get it at a glance.'],
   ['“Pursuant to relocation, distribution will commence Tuesday.”',1,'Seven words, but “pursuant,” “relocation” and “commence” make readers work.'],
   ['“Orders necessitate submission antecedent to Thursday noon.”',1,'Short, yet nearly every word is a five-dollar word.'],
   ['“Please order by Thursday noon.”',0,'Five common words. Nothing to decode.']],
   'Cutting words helps, but word choice matters too. Short and fancy is still hard.');}},

/* ---------- PART 2: SHORT WORDS ---------- */
{part:1,src:'Chapter 5 · Rule 1: Use short and common words',run(L){
  L.h(L.kick('learn','Rule 1 · Short and common words')+'<h1 class="q">Skip the five-dollar words</h1>'+
   L.quote('Don’t use a five-dollar word when a fifty-cent word will do.','often credited to Mark Twain, quoted in chapter 5')+
   L.prose('A '+L.g('five-dollar-word','five-dollar word')+' is fancier and rarer, and it takes longer to read. When two words mean the same, the shorter one is usually the more common one too:')+
   '<div style="display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px">'+[['acquiesce','agree'],['subsequent','next'],['acquire','get'],['demonstrate','show'],['hinder','slow']].map(x=>'<span class="chip static"><s style="opacity:.55">'+x[0]+'</s>&nbsp;→&nbsp;<b>'+x[1]+'</b></span>').join('')+'</div>'+
   L.note('<b>When length and commonness clash, pick the common word.</b> “Erudite” is shorter than “knowledgeable,” but “knowledgeable” is about five times as common, so more readers know it.','bulb'));
  L.done();}},
{part:1,src:'Chapter 5 · Rule 1: Use short and common words',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Arjun’s draft says “We deem late orders canceled.” Mei suggests “consider.” “Deem” is shorter. Which should Arjun use?</h1>');
  L.mc(L.card,['“Consider,” since far more readers know it','“Deem,” since it has fewer syllables','Either one, since they mean the same'],0,
   'Like “knowledgeable” over “erudite,” the more common word wins even when it’s longer.',
   'Short words usually help, but here length and commonness clash. The book says to lean toward the common word, since more readers know it.');}},
{part:1,src:'Chapter 5 · Rule 1: Use short and common words',pts:1,
 solve:async L=>{L.$('#tx').querySelectorAll('.nw').forEach(s=>s.click());},
 run(L){
  const S=[['n','Subsequent to','After',4,2],['t',' submitting your order, you will ',0,0,8],['n','acquire','get',2,1],['t',' a ',0,0,1],['k','confirmation',0,0,4],['t','. ',0,0,0],['n','Utilize','Use',3,1],['t',' it to ',0,0,2],['n','verify','check',3,1],['t',' your order ',0,0,3],['n','prior to','before',3,2],['t',' pickup.',0,0,2]];
  let left=5,miss=false,syl=S.reduce((a,s)=>a+(s[0]==='n'?s[3]:s[4]),0);const start=syl;
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Arjun’s note to pantries is full of five-dollar words. Tap each highlighted one to swap in a fifty-cent word, and watch the reading load drop.</h1>'+
   '<div id="tx" style="background:var(--soft);border-radius:16px;padding:14px;margin:10px 0;line-height:1.9"></div>'+
   '<div class="meterrow"><div class="lb">Syllables to read · <b id="sc"></b></div><div class="meter"><div id="sm" style="background:var(--h3)"></div></div></div><div id="tf"></div>');
  const tx=L.$('#tx');
  const draw=()=>{L.$('#sc').textContent=syl;L.$('#sm').style.width=Math.round(syl/start*100)+'%';};
  S.forEach(s=>{const e=document.createElement('span');e.textContent=s[1];
    if(s[0]==='n'){e.className='nw';e.style.cssText='background:rgba(230,160,40,.22);border-radius:6px;padding:1px 3px;cursor:pointer';
      e.onclick=()=>{if(e.dataset.d)return;e.dataset.d=1;e.textContent=s[2];e.style.background='rgba(60,170,110,.22)';syl-=s[3]-s[4];left--;draw();
        if(!left){L.$('#sm').style.background='var(--ok-strong)';L.award(!miss);L.sheet(miss?'info':'ok',miss?'Swapped, but one word was fine':'Same meaning, easier read','From '+start+' syllables down to '+syl+', with nothing lost. Notice “confirmation” stayed: it’s long, but nearly every reader knows it. Swap the rare words, not every long one.');L.done();}};}
    else if(s[0]==='k'){e.style.cssText='cursor:pointer';e.onclick=()=>{if(left){miss=true;L.fb(L.$('#tf'),'<b>Keep that one.</b> “Confirmation” is long, but it’s a common word everyone knows. Common beats short.','no');}};}
    tx.appendChild(e);});
  draw();}},
{part:1,src:'Chapter 5 · Rule 1: Use short and common words',run(L){
  L.h(L.kick('ex','Stories from the book')+'<h1 class="q">Simple words don’t make you look less smart</h1>');
  L.beats(L.card,[
   ['The authors’ own slip','An early draft of the book said “heuristic.” It’s the standard term in academia, but used almost nowhere else. They revised it to “rule of thumb,” which means the same thing.'],
   ['Tweets','Even in tweets, already forced to be short, those using the most common words got about 75% more retweets than those using the least common.'],
   ['Ethics codes','People read the ethics codes of 188 public companies. Companies with less readable codes were rated less moral and less trustworthy.'],
   ['Looking smart','In one study, college students rated writers who used complex language as <i>less</i> intelligent than writers who used simple language.'],
   ['Even academics','Top journals now ask for clear, simple writing, and one study found the most readable scholarly articles were five times as likely to win awards.']],
   'Fancy words rarely buy you the respect writers hope for, and they cost readers time.');}},
{part:1,src:'Chapter 5 · Rule 1: Use short and common words',run(L){
  L.h(L.kick('learn','When a harder word may be worth it')+'<h1 class="q">Weigh the cost before you reach for the fancy word</h1>'+
   L.prose('The book allows exceptions. Some fields have special words that let experts talk precisely to each other. And readers sometimes judge a writer’s competence by how complex the writing is.')+
   L.note('<b>Status matters.</b> Writers lower in rank or status may risk looking less smart if they write simply, while higher-status writers often get praised for being plainspoken.','scale')+
   L.prose('The problem is using fancy words without meaning to, in ways that hurt your own goals. Before you keep a harder word, ask two questions:')+
   L.list([['How much does the exact shade of meaning matter here?',''],['Is that extra meaning worth fewer readers reading and understanding, and more effort for those who do?','']],2));
  L.done();}},
{part:1,src:'Chapter 5 · Rule 1: Use short and common words',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Swap the word, or keep it?',['Swap for a simpler word','Keep the precise word'],[
   ['Mei’s donor email says the gift will “facilitate” more deliveries.',0,'“Help” or “pay for” says the same thing. The fancy word adds nothing.'],
   ['Arjun asks the refrigeration repair company to check the truck’s “compressor.”',1,'The reader is an expert, and the exact part matters. A vaguer word would cost precision.'],
   ['Kofi’s flyer tells families the pantry will “ameliorate” food costs.',0,'Many readers won’t know it. “Lower” or “ease” works for everyone.'],
   ['Jordan writes to a volunteer: “Please endeavor to arrive by 9am.”',0,'“Try to arrive by 9am” is shorter, more common and means the same.']]);}},

/* ---------- PART 3: SENTENCES ---------- */
{part:2,src:'Chapter 5 · Rule 2: Write straightforward sentences',run(L){
  L.h(L.kick('learn','Rule 2 · Straightforward sentences')+'<h1 class="q">Write so readers get it in one pass</h1>'+
   L.prose('People spoke long before they wrote, and speech comes in short, simple chunks. Long, winding sentences strain our limited attention.')+
   L.prose('Grammar books offer many tips: active voice, keeping subject, verb and object close, and so on. The book bundles them into one test: <b>can a reader understand the sentence after a single read-through?</b>')+
   L.lanes([['x','Less straightforward','“The order form, because of last month’s update and the new login, partners say is confusing.”',3],
            ['check','More straightforward','“Partners say the order form is confusing because of last month’s update and the new login.”',2]])+
   L.prose('Same words. In the first, the middle part splits “the order form” from “is confusing,” so readers must jump back. In a '+L.g('straightforward','straightforward sentence')+', each word builds on the last.'));
  L.done();}},
{part:2,src:'Chapter 5 · Rule 2: Write straightforward sentences',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Which version of Lena’s sentence can a volunteer understand in one pass?</h1>');
  L.mc(L.card,['“Gloves, since the boxes are sharp and the floor is cold, bring them.”','“Bring gloves, since the boxes are sharp and the floor is cold.”'],1,
   'The action comes first and everything after it builds on it. No need to jump back.',
   'In that version, “gloves” is cut off from “bring them” by the reasons in the middle. Readers have to hold “gloves” in mind and loop back.');}},
{part:2,src:'Chapter 5 · Rule 2: Write straightforward sentences',pts:1,run(L){
  L.h(L.kick('pr','Put it in order')+'<h1 class="q">Help Kofi write the first line of the mobile pantry text. Order the pieces so each builds on the one before.</h1><div id="or"></div>');
  L.order(L.$('#or'),['The mobile pantry','will move to Lincoln Park','every Tuesday, 4 to 6pm,','starting March 3.'],
   'Who, does what, where and when: <b>The mobile pantry will move to Lincoln Park every Tuesday, 4 to 6pm, starting March 3.</b> Related words sit side by side, so it reads in one pass.',
   ['Who','Does what, where','How often','From when']);}},
{part:2,src:'Chapter 5 · Rule 3: Write shorter sentences',run(L){
  L.h(L.kick('learn','Rule 3 · Shorter sentences')+'<h1 class="q">One idea per sentence</h1>'+
   L.prose('Even with the same total words, two 10-word sentences are easier than one 20-word sentence. Sentences have been getting shorter for a long time:')+
   L.flow([['book','Novels','about 27 words a sentence in 1800, about 10 in 2000','',3],['people','Inaugural speeches','first five sentences: about 64 words on average in 1789, about 7 in 2021','',2]])+
   L.prose('Eye-tracking studies show readers pause at each period to take in the sentence before going on. A long sentence makes them hold more in mind first, especially if it packs several ideas.')+
   L.note('The book splits one 30-word sentence into two with the same words. As two sentences it scored at an eighth-grade level. As one, at college sophomore level.','info'));
  L.done();}},
{part:2,src:'Chapter 5 · Rule 3: Write shorter sentences',pts:1,
 solve:async L=>{L.$('#j0').click();L.$('#j2').click();},
 run(L){
  const seg=[['Saturday’s shift starts at 9am','Saturday’s shift starts at 9am'],['please use the side door on Elm Street','Please use the side door on Elm Street'],['the one by the loading dock','It’s the one by the loading dock'],['bring gloves if you have them','Bring gloves if you have them']];
  const J=[[', and ','. ',true],[', which is ','. ',false],[', and ','. ',true]];const cut=[false,false,false];let miss=false,fin=false;
  L.h(L.kick('pr','Split it')+'<h1 class="q">Lena’s reminder is one long sentence. Tap a joint to turn it into a period. Split between separate ideas only.</h1>'+
   '<div id="tx" style="background:var(--soft);border-radius:16px;padding:14px;margin:10px 0;line-height:1.9"></div><div class="small" id="sc"></div><div id="tf"></div>');
  const draw=()=>{const tx=L.$('#tx');tx.innerHTML='';let n=1;
    seg.forEach((s,i)=>{const t=document.createElement('span');t.textContent=(i===0||cut[i-1])?s[1]:s[0];tx.appendChild(t);
      if(i<J.length){const b=document.createElement('span');b.id='j'+i;b.textContent=cut[i]?J[i][1]:J[i][0];if(cut[i])n++;
        b.style.cssText='border-radius:6px;padding:1px 3px;cursor:pointer;font-weight:600;background:'+(cut[i]?'rgba(60,170,110,.22)':'rgba(230,160,40,.22)');
        b.onclick=()=>{if(cut[i]||fin)return;
          if(!J[i][2]){miss=true;L.fb(L.$('#tf'),'<b>Not there.</b> “The one by the loading dock” describes the door, so it belongs with it. Split between ideas, not inside one.','no');return;}
          cut[i]=true;L.$('#tf').innerHTML='';draw();
          if(cut[0]&&cut[2]){fin=true;L.award(!miss);L.sheet(miss?'info':'ok','Three sentences, three ideas','When, where and what to bring now each get their own sentence. The door detail stays with the door. Readers can pause at each period and take in one idea at a time.');L.done();}};
        tx.appendChild(b);}});
    tx.appendChild(document.createTextNode('.'));
    const w=tx.textContent.trim().split(/\s+/).length;L.$('#sc').innerHTML='Sentences: <b>'+n+'</b> · average '+Math.round(w/n)+' words each';};
  draw();}},
{part:2,src:'Chapter 5 · The rules of readable writing',pts:5,run(L){
  L.h(L.kick('pr','Which rule fixes it?')+'<h1 class="q">Each draft has one readability problem. Sort them by the rule that fixes it.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Short, common words','Straightforward sentence','Shorter sentences'],[
   ['Arjun: “Please ascertain your allocation.”',0,'“Check your food list” uses everyday words.'],
   ['Kofi: “The truck lease, given the repair costs we saw this winter, the board must approve.”',1,'The middle part splits “the truck lease” from what happens to it. Put the board and the action first.'],
   ['Lena: one 45-word sentence covering the shift time, parking and the holiday party.',2,'Three ideas, one sentence. Give each its own.'],
   ['Mei: “Your contribution will augment our capacity.”',0,'“Your gift helps us do more” says it plainly.'],
   ['Jordan: a sentence about produce pickup times that also explains why food waste matters and thanks the manager.',2,'Split the pickup times, the reason and the thanks into separate sentences.']],
   'Words, order, length: three separate rules, and a hard sentence often needs more than one.');}},

/* ---------- PART 4: IN ACTION ---------- */
{part:3,src:'Chapter 5 · The rules in action',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">One hard sentence, three rules, one at a time</h1>'+
   L.prose('The book takes a dense sentence from a magazine article about ballot measures (ironically, an article complaining about obscure language) and fixes it rule by rule. Here is the same method on Arjun’s partner notice.'));
  L.beats(L.card,[
   ['Start','“Necessitated by cold-storage constraints, which the warehouse is currently remediating, perishable allocations will be disbursed exclusively on Fridays.”'],
   ['Rule 1 · Words','Swap the five-dollar words: “Because of limited cold storage, which the warehouse is currently fixing, fresh food will be given out only on Fridays.”'],
   ['Rule 2 · Order','Put the main point first, with related words together: “Fresh food will be given out only on Fridays, because of limited cold storage, which the warehouse is currently fixing.”'],
   ['Rule 3 · Length','Split the ideas: “Fresh food will be given out only on Fridays. Our cold storage is limited while we fix it.”'],
   ['The result','Same facts, much easier. In the book’s example, the rewrite went from a graduate-school reading level to a tenth-grade one.']],
   'Easier for every reader, from those still learning English to those simply too busy to decode “remediating.”');}},
{part:3,src:'Chapter 5 · The rules in action',run(L){
  L.h(L.kick('learn','Readable isn’t dumbed down')+'<h1 class="q">Easy to read is not easy to write</h1>'+
   L.prose('Ernest Hemingway’s <i>The Old Man and the Sea</i> is written at about a fourth-grade reading level. It is one of his best-known works, and it helped earn him a Nobel Prize, partly because its plain style stood out.')+
   L.lanes([['pencil','What it costs you','Unlearning the formal, winding style many of us were taught in school. Maybe pushing back on a boss who thinks complex looks smarter.',3],
            ['check','What it buys','Writing that more people read and understand. And with practice it gets easier.',2]])+
   L.prose('None of your writing matters if people don’t read it.'));
  L.done();}},
{part:3,src:'Chapter 5 · The rules in action',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Write the mobile pantry text for families. Tap each piece until the message is as easy to read as you can make it.</h1>');
  L.sentence(L.card,[['Commencing March 3,','Starting March 3,'],['the mobile pantry will stop at Lincoln Park.','the mobile pantry, relocated owing to construction, will be at Lincoln Park,'],['It is there Tuesdays, 4 to 6pm.','where distribution will occur Tuesdays, 4 to 6pm.']],[1,0,0],
   [['“Commencing” is a five-dollar word. “Starting” is common and shorter.'],['Fancy words, and a side note that splits the subject from its verb.'],['This keeps it all in one long sentence with a fancy phrase. Give the hours their own short sentence.']],
   '<b>Starting March 3, the mobile pantry will stop at Lincoln Park. It is there Tuesdays, 4 to 6pm.</b> Common words, clear order, one idea per sentence.');}},
{part:3,src:'Chapter 5 · Rule 1: Use short and common words',pts:1,run(L){
  L.h(L.kick('pr','Jordan’s worry')+'<h1 class="q">Jordan is writing to the grocery chain manager and worries plain words will make a junior staffer look unprofessional. What’s the best advice from this chapter?</h1>');
  L.mc(L.card,['Use fancy words: busy managers respect formal language','Mostly plain words: the risk is real, but fancy words cost more','Plain words always: status never affects how writing is read'],1,
   'The book admits lower-status writers can be judged for writing simply. But most practical writing doesn’t benefit from fancy words, and simple writers are often seen as smarter. Weigh it, and lean plain.',
   'The book takes a middle line. Status can shape how plain writing is judged, so it isn’t “never.” But fancy words cost busy readers, and studies found simple writers often seem <i>more</i> intelligent. Lean plain.');}}
  ]
});
</script>
</body>
</html>
