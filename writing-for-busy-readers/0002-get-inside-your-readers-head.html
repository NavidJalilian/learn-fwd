<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get Inside Your Reader’s Head</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0002', title:'Get inside your reader’s head', minutes:19, icon:'eye',
  goals:['Name the three limits of the busy brain','Predict what a reader will notice, and what they’ll miss','Explain why focus runs out and multitasking backfires'],
  parts:['Short on time','What we notice','How focus fades','Juggling tasks'],
  read:'Read chapter 1 of the book for the park picture exercises, the attention studies and the Stroop test.',
  glossary:{
    'selective-attention':'Selective attention: the brain’s filter that picks a few things to notice and quietly pushes the rest out of awareness.',
    'task-switching':'Task switching: what “multitasking” really is. The brain flips quickly between tasks instead of doing them at the same moment, and each flip costs time and focus.',
    'stroop-effect':'Stroop effect: the slowdown you feel when two signals clash, like a word that names one format but is printed in another.'
  },
  cheatsheet:[
    'Readers are as short on <b>time</b> as you: reading your message means not doing something else.',
    'Attention is limited: we hold only about <b>7 ± 2</b> things in mind at once.',
    'Three limits of the busy brain: we <b>can’t notice everything</b>, our <b>focus runs out</b>, and we <b>juggle tasks badly</b> but still try.',
    'We notice what <b>contrasts</b> with its surroundings, and what we’re <b>looking for</b>. Noticing one thing hides others.',
    'Focus wears down fast, and tiredness, wandering minds and interruptions make it worse. Complicated text makes minds wander more.',
    '“Multitasking” is really <b>task switching</b>: slower, more mistakes, faster fatigue.',
    'Give the busy brain one anchor: one thing to notice, one to focus on, one action. That’s <b>kind</b> writing.'
  ],
  steps:[
/* ---------- PART 1: SHORT ON TIME ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Kofi has four minutes between meetings and 30 unread emails. One is Lena’s long weekly update. What probably happens to it?</h1>');
  L.mc(L.card,['It gets a quick skim or gets saved for later','It gets read slowly and carefully, word by word'],0,
   'Kofi is short on time and attention, like nearly every reader. This lesson looks at what goes on inside that busy head.',
   'With four minutes and 30 emails, careful reading isn’t on the table. Busy readers skim or put long messages off.');}},
{part:0,src:'Chapter 1 · Get inside your reader’s head',run(L){
  L.h(L.kick('learn','Two scarce things')+'<h1 class="q">Your readers are short on time and on attention</h1>'+
   L.prose('In a 2018 Pew survey, 60% of US adults (and 74% of parents) said they feel too busy to enjoy life at least some of the time. Time spent on your message is time not spent on something else, so every message is a trade-off.')+
   L.prose(L.g('attention','Attention')+' is limited too. A classic study by psychologist George Miller found we can actively hold only about <b>seven things in mind, plus or minus two</b>.')+
   L.note('Your readers feel the time squeeze just as sharply as you do. It shapes both <i>what</i> they read and <i>how</i> they read it.','clock'));
  L.done();}},
{part:0,src:'Chapter 1 · Get inside your reader’s head',run(L){
  L.h(L.kick('learn','The three limits of the busy brain')+'<h1 class="q">A limited brain has three consequences for every reader</h1>'+
   L.list([['eye','We can’t notice everything','Far more reaches our eyes than our brain can process, so most of it gets filtered out.'],
     ['flame','Our focus runs out','Concentrating wears us down, often faster than we expect.'],
     ['cycle','We juggle tasks badly, but still try','Doing two things at once makes us worse at both, yet we keep doing it.']],1)+
   '<p class="small" style="margin-top:10px">The rest of this lesson takes them one at a time.</p>');
  L.done();}},
{part:0,src:'Chapter 1 · Get inside your reader’s head',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">Why can’t an expert driver talk on the phone?</h1>');
  L.beats(L.card,[
   ['Learning','A new driver must watch lights, cars, people on foot, bikes, sirens, potholes and speed limits. It takes enormous attention.'],
   ['Practice','With years of practice, most adults drive through busy cities almost without thinking.'],
   ['The puzzle','Most adults are also expert phone talkers. So doing both at once should be easy, right?'],
   ['The finding','No. Studies show phone calls make even experienced drivers worse. Some psychologists say the effect is as bad as driving legally drunk.'],
   ['The reason','Both tasks draw on the same limited attention. Being familiar with each one doesn’t make room for both.']],
   'Limits on attention apply even to things we’re good at, and reading your message is one more task competing for it.');}},
{part:0,src:'Chapter 1 · Get inside your reader’s head',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Kofi says, “I read email during board meetings. I’m great at multitasking.” Which limit of the busy brain is Kofi overlooking?</h1>');
  L.mc(L.card,['We can’t notice everything at once','Our focus runs out over time','We juggle tasks badly, but still try'],2,
   'Right. Doing two things at once makes us worse at both, even when we feel good at it.',
   'The one that fits is juggling: doing two tasks at once, like a meeting and email, makes us worse at both, even if we think we’re good at it.');}},
{part:0,src:'Chapter 1 · Get inside your reader’s head',pts:1,run(L){
  L.h(L.kick('pr','Count the load')+'<h1 class="q">Lena’s weekly email holds 14 separate items: news, thank-yous, five asks, reminders and dates. What does the research on attention suggest?</h1>');
  L.mc(L.card,['Readers can hold all 14 if they read slowly','Readers can hold about 7 at once, give or take 2','Readers will remember only the last item'],1,
   'Right. About seven, plus or minus two, is the cap. Fourteen items means many will be dropped, and Lena doesn’t get to choose which.',
   'Reading slowly doesn’t raise the cap, and nothing says only the last item survives. The research puts the limit at about seven things, plus or minus two.');}},

/* ---------- PART 2: WHAT WE NOTICE ---------- */
{part:1,src:'Chapter 1 · What we notice—and what we don’t',run(L){
  L.h(L.kick('learn','Attention is a filter')+'<h1 class="q">The brain decides what you notice before you know it</h1>'+
   L.prose('At any moment we face more information than we can process. So the brain’s '+L.g('selective-attention','selective attention')+' acts as a filter: it lets a few things through and suppresses the rest.')+
   L.flow([['layers','Everything in view','sights, sounds, thoughts'],['eye','The filter','picks what seems important or relevant'],['bulb','What you notice','a small slice']])+
   L.prose('Sometimes the filter works without us knowing: it hides background noise while you read. Sometimes we steer it on purpose. And it can be pulled away fast: if someone calls your name, you stop reading this sentence.'));
  L.done();}},
{part:1,src:'Chapter 1 · What we notice—and what we don’t',run(L){
  L.h(L.kick('learn','Two shortcuts, one blind spot')+'<h1 class="q">What gets through the filter</h1>'+
   L.list([['star','Shortcut 1 · Contrast','We notice first whatever stands out from its surroundings, like a full moon in a dark sky. This is built in, from human babies to barn owls.'],
     ['compass','Shortcut 2 · Searching','We can point our attention on purpose. When we look for something specific, we find it quickly.']],2)+
   L.note('<b>The blind spot:</b> when the brain notices one thing, it actively suppresses others. We often miss what we’re not looking for, even when it’s in plain sight.','eye'));
  L.done();}},
{part:1,src:'Chapter 1 · What we notice—and what we don’t',run(L){
  L.h(L.kick('ex','The book’s picture exercise')+'<h1 class="q">A busy park scene, looked at three times</h1>');
  L.beats(L.card,[
   ['Glance 1','Readers glance at a drawing of a park: a playground, a family on a blanket, a car, people on bikes. Each person notices something different first.'],
   ['Glance 2','In a second version, one person walking a dog is made to stand out from the rest. Now almost everyone looks there first. That’s <b>contrast</b>.'],
   ['Glance 3','Readers are asked to find a person sitting on a bench. They scan the paths for benches and find them quickly. That’s <b>searching</b>.'],
   ['The miss','Then the authors point out a play structure of hexagons and a triangle in the playground. It’s bigger than the bench, yet most readers never saw it.']],
   'We see what stands out and what we look for. Everything else can sit in plain sight, unnoticed.');}},
{part:1,src:'Chapter 1 · What we notice—and what we don’t',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Why did readers spot the dog walker first in the second park picture?</h1>');
  L.mc(L.card,['It was the biggest thing in the whole scene','It was placed right at the top of the picture','It stood out sharply from everything around it'],2,
   'Right. Contrast with the surroundings grabs attention automatically.',
   'Size and position weren’t the point: the play structure was bigger and still got missed. The dog walker stood out because it contrasted with its surroundings.');}},
{part:1,src:'Chapter 1 · What we notice—and what we don’t',pts:1,
 solve:async L=>{const g=L.$('#vt').children;g[0].click();g[1].click();},
 run(L){
  const LN=['Thanks to everyone who came to last week’s food drive!','Saturday sorting needs 12 more people. Sign up by Thursday.','The parking lot gets repainted next month.','Reminder: wear closed-toe shoes in the warehouse.'];const seen=new Set();
  L.h(L.kick('pr','Toggle and compare')+'<h1 class="q">Here is part of Lena’s volunteer email. Switch between the two versions and notice where your eyes land.</h1><div id="vt"></div>'+
   '<div id="em" style="background:var(--soft);border-radius:16px;padding:14px;margin:8px 0 6px;min-height:140px"><div class="small">Choose a version above.</div></div><div id="vq"></div>');
  ['Plain version','One line stands out'].forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=n;b.onclick=()=>{[...L.$('#vt').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(j);
    L.$('#em').innerHTML=LN.map((t,x)=>'<p style="margin:0 0 8px;'+(j===1&&x===1?'background:var(--h3);color:#fff;padding:6px 8px;border-radius:8px;font-weight:600':'')+'">'+t+'</p>').join('');
    if(seen.size===2&&!L.$('#vq').innerHTML){const q=L.$('#vq');q.innerHTML='<h2 class="sub">In the second version, what’s the trade-off?</h2>';
      L.mc(q,['Readers now notice every line about equally well','Readers see the shift ask, and may miss the shoe reminder','Readers will now skip the shift ask completely'],1,
       'Right. Contrast pulls eyes to the shift ask, and noticing one thing suppresses the others. Make sure what stands out is what matters most.',
       'Contrast doesn’t spread attention evenly, and it draws eyes to the shift ask rather than away. The cost is that other lines, like the shoe reminder, get noticed less.');}};L.$('#vt').appendChild(b);});}},
{part:1,src:'Chapter 1 · What we notice—and what we don’t',pts:5,run(L){
  L.h(L.kick('pr','Why did they notice it?')+'<h1 class="q">Sort each Fennick moment by what the reader’s attention did.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Grabbed by contrast','Found by searching','Missed while looking'],[
   ['A family scans the mobile pantry flyer only for a time of day, and finds it fast.',1,'They knew what they wanted, so their attention went straight to it.'],
   ['Hunting for the order deadline, a pantry coordinator never sees the line about a new pickup door.',2,'Focusing on one thing suppressed the other, even though it was right there.'],
   ['A big red “Closed Monday” sign on the plain warehouse door gets noticed by everyone walking past.',0,'It stands out from its surroundings, so eyes go to it without trying.'],
   ['Looking for their own name on the shift list, a volunteer misses that the start time changed.',2,'Searching for their name hid the change in plain sight.'],
   ['The one highlighted line in an all-gray chat message is what Arjun’s team reads first.',0,'Contrast with the gray text pulls attention automatically.']],
   'Readers notice what contrasts and what they’re looking for. Whatever else is there can be missed.');}},

/* ---------- PART 3: HOW FOCUS FADES ---------- */
{part:2,src:'Chapter 1 · Where we focus',run(L){
  L.h(L.kick('learn','Focus is costly')+'<h1 class="q">Once we notice something, staying focused on it uses up brainpower</h1>'+
   L.prose('Focus lets us shut out what doesn’t matter, sometimes to a startling degree. In a 1999 study, people counted basketball passes in a short video. Nearly half never noticed a person in a gorilla suit walking right through the scene.')+
   L.prose('But focus wears out, and faster than we expect. In one study, people who had to ignore flashing words during a six-minute video then scored about <b>20% lower</b> on a hard reading test than people who hadn’t.')+
   L.note('Being physically tired also makes focusing harder: at the end of a long day, after a workout, or after too little sleep.','flame'));
  L.done();}},
{part:2,src:'Chapter 1 · Where we focus',run(L){
  L.h(L.kick('learn','Wandering and interruptions')+'<h1 class="q">Even short messages compete with a wandering mind</h1>'+
   L.tiers([['cycle','Minds wander','One study estimated our minds wander about a third of the time while reading, and even more with complicated writing.'],
            ['clock','Refocusing is slow','Researcher Gloria Mark found workers need about 23 minutes on average to get fully back to a task after an interruption.'],
            ['alert','Interruptions hurt','In a Carnegie Mellon study, a phone call during a reading test cut scores by about 20%.']])+
   L.prose('Your message usually arrives in the middle of all this. Your reader may already be worn down, tired or distracted.'));
  L.done();}},
{part:2,src:'Chapter 1 · Where we focus',run(L){
  L.h(L.kick('ex','A Fennick evening')+'<h1 class="q">What state is Kofi in when Lena’s update finally gets read?</h1>');
  L.beats(L.card,[
   ['6 p.m.','After a day of back-to-back meetings, Kofi opens Lena’s long weekly update. Hours of focusing have already worn their attention down.'],
   ['Tired','Kofi skipped lunch and slept badly. Physical tiredness makes focus even harder.'],
   ['Wandering','Halfway through a dense paragraph, Kofi’s mind drifts to the truck lease. Complicated text makes that more likely.'],
   ['Interrupted','A board member calls. By the time Kofi gets back to the email, the thread is lost, and getting fully back can take a long time.'],
   ['The result','The Saturday ask in paragraph three never really lands. Kofi isn’t careless; Kofi is a busy reader.']],
   'Assume your reader arrives worn down, tired or interrupted, because they often do.');}},
{part:2,src:'Chapter 1 · Where we focus',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Arjun’s ordering instructions for pantries are long and full of warehouse terms. What does the research on focus predict?</h1>');
  L.mc(L.card,['Readers will focus harder because it looks official','Jargon has no real effect on how readers focus','Readers’ minds will wander even more than usual'],2,
   'Right. Minds wander about a third of the time while reading, and more with complicated writing.',
   'Looking official doesn’t buy focus, and complicated writing does matter. Minds wander more when text is complicated.');}},
{part:2,src:'Chapter 1 · Where we focus',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Is this reader’s focus likely worn down?',['Likely worn down','Likely still fresh'],[
   ['A pantry coordinator reads Arjun’s message at 10 p.m., after working a double shift.',0,'Physical tiredness at the end of a long day makes focus harder.'],
   ['A volunteer opens Lena’s short text first thing on a quiet, well-rested morning.',1,'Nothing has drained their attention yet, so this is about as good as it gets.'],
   ['A board member reads Kofi’s memo right after a long, tense meeting where they had to concentrate hard.',0,'Effortful focus earlier drains attention for what comes next, just like the flashing-words study.'],
   ['A donor gets a phone call halfway through Mei’s appeal and comes back to it ten minutes later.',0,'Interruptions break focus, and getting fully back often takes far longer than ten minutes.']]);}},

/* ---------- PART 4: JUGGLING TASKS ---------- */
{part:3,src:'Chapter 1 · How we juggle tasks',run(L){
  L.h(L.kick('learn','Multitasking is a myth')+'<h1 class="q">We don’t do two things at once. We switch, and it costs us.</h1>'+
   L.prose('Strictly speaking, we can’t think about two tasks at the same moment. What we call multitasking is '+L.g('task-switching','task switching')+': flipping fast between tasks. Each switch makes us slower, more likely to miss things, and tired sooner.')+
   L.quote('To do two things at once is to do neither.','Publilius Syrus, Latin writer, quoted in chapter 1')+
   L.prose('Yet we keep trying. In one survey, 63% of professionals said they regularly work on two or three tasks at once. We do it partly because we’re busy, and partly because we think we’re better at it than we are.'));
  L.done();}},
{part:3,src:'Chapter 1 · How we juggle tasks',run(L){
  L.h(L.kick('ex','Stories from the book')+'<h1 class="q">When task switching has real costs</h1>');
  L.beats(L.card,[
   ['Everyday','Some switching is useful: stirring the pasta while setting the table and answering a child’s homework question. Life with little time needs it.'],
   ['Pharmacists','A study by Butler University and Eli Lilly found pharmacists who answered questions while filling prescriptions took longer and made more errors.'],
   ['Drivers','US statistics link thousands of road deaths a year to texting while driving, yet by some estimates 22% of drivers do it daily.'],
   ['Your reader','Your message is often read in a switch: between meetings, in a queue, while cooking dinner.']],
   'Switching slows people down and makes them miss critical details, and your message is usually one of the tasks.');}},
{part:3,src:'Chapter 1 · How we juggle tasks',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Jordan drafts the cold email to the grocery chain manager while on a call with a volunteer and answering chat messages. What’s most likely?</h1>');
  L.mc(L.card,['The email turns out fine, since Jordan is used to all three','Jordan gets slower and makes more mistakes in all of them','Only the phone call suffers, since it is the hardest task'],1,
   'Right. Switching between tasks makes us less efficient at every one of them, not just one.',
   'Familiarity didn’t save the expert drivers, and the cost isn’t limited to one task. Switching makes us slower and more error-prone at all of them.');}},
{part:3,src:'Chapter 1 · How we juggle tasks',pts:1,
 solve:async L=>{L.$('#sg').click();for(let n=0;n<4;n++)L.$('#kb').children[+L.$('#wd').dataset.a].click();L.$('#sg2').click();for(let n=0;n<4;n++)L.$('#kb').children[+L.$('#wd').dataset.a].click();},
 run(L){
  const K=['Italic','Bold','Caps','Underline'];
  const R=[[['bold',1],['italic',0],['underline',3],['caps',2]],[['bold',3],['underline',0],['italic',2],['caps',1]]];
  const fmt=(w,k)=>k===0?'<i>'+w+'</i>':k===1?'<b>'+w+'</b>':k===2?w.toUpperCase():'<u>'+w+'</u>';
  let rd=0,i=0,t0=0,err=0;const res=[];
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Tap the <b>formatting</b> of each word, not what the word says. Go as fast as you can. Two rounds.</h1>'+
   '<div id="sb"><button class="btn pri" id="sg">'+L.ic('play')+'Start round 1</button></div>'+
   '<div id="sw" hidden><div class="small" id="sl"></div><div id="wd" data-a="0" style="font-size:34px;text-align:center;padding:18px 0;font-family:Inter,sans-serif"></div><div id="kb" style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center"></div></div>'+
   '<div id="sr"></div><div id="sq"></div>');
  K.forEach((n,k)=>{const b=document.createElement('button');b.className='chip';b.textContent=n;b.onclick=()=>pick(k);L.$('#kb').appendChild(b);});
  const show=()=>{const w=R[rd][i];L.$('#wd').innerHTML=fmt(w[0],w[1]);L.$('#wd').dataset.a=w[1];L.$('#sl').textContent='Round '+(rd+1)+' · word '+(i+1)+' of 4';};
  const start=()=>{L.$('#sb').innerHTML='';L.$('#sw').hidden=false;i=0;err=0;t0=Date.now();show();};
  L.$('#sg').onclick=start;
  function pick(k){if(k!==R[rd][i][1])err++;i++;if(i<4){show();return;}
    res.push([((Date.now()-t0)/1000).toFixed(1),err]);L.$('#sw').hidden=true;
    if(rd===0){rd=1;L.$('#sb').innerHTML='<p class="small">Round 1 done. In round 2 the words and their formatting won’t match.</p><button class="btn pri" id="sg2">'+L.ic('play')+'Start round 2</button>';L.$('#sg2').onclick=start;return;}
    L.$('#sr').innerHTML='<div class="res">Round 1: <b>'+res[0][0]+' s</b>, '+res[0][1]+' slip'+(res[0][1]===1?'':'s')+'. Round 2: <b>'+res[1][0]+' s</b>, '+res[1][1]+' slip'+(res[1][1]===1?'':'s')+'.<br><span class="small">Most people are slower or slip more in round 2. This is the '+L.g('stroop-effect','Stroop effect')+'.</span></div>';
    const q=L.$('#sq');q.innerHTML='<h2 class="sub">Why does round 2 feel harder?</h2>';
    L.mc(q,['The words in round 2 were longer and rarer','Reading each word fought with naming its format','Round 2 came later, so your eyes were tired'],1,
     'Right. In round 2 you had two tasks: name the format, and hold back the word you can’t help reading. Two tasks at once cost time and accuracy.',
     'The words were the same in both rounds, and a few seconds won’t tire your eyes. The clash between reading the word and naming its format turned one task into two.');}}},
{part:3,src:'Chapter 1 · How we juggle tasks',run(L){
  L.h(L.kick('learn','Writing that is kind')+'<h1 class="q">Give the busy brain one clear anchor</h1>'+
   L.prose('The chapter’s bottom line: the mind works best with a clear anchor point.')+
   L.flow([['eye','One thing','to notice'],['target','One thing','to focus on'],['pointer','One task','to act on']])+
   L.prose('Writing that respects these limits is more likely to get through to a busy reader. The book calls it <b>kind</b>, too, because it adds less stress to a reader who is already stretched. The six principles later in the course are ways to do exactly this.'));
  L.done();}},
{part:3,src:'Chapter 1 · Get inside your reader’s head',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which limit of the busy brain?',['Can’t notice everything','Focus runs out','Juggling tasks badly'],[
   ['Mei’s donors read the appeal on their phones while watching TV and cooking.',2,'They’re switching between tasks, so each one, your appeal included, gets done worse.'],
   ['Families looking for the new mobile pantry address never see the new hours printed beside it.',0,'Searching for one thing suppressed the other, right in plain sight.'],
   ['A board member gives up on Kofi’s ten-page memo around page six.',1,'Long, effortful reading wears focus down, often sooner than the writer expects.'],
   ['Arjun’s jargon-heavy message gets read three times by a tired coordinator and still isn’t clear.',1,'Complicated text plus tiredness drains focus and makes minds wander.'],
   ['Lena’s plain-text email hides the one urgent ask among twelve equal-looking lines.',0,'Nothing contrasts, so the urgent ask doesn’t get through the filter.']]);}},
{part:3,src:'Chapter 1 · How we juggle tasks',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Lena wants a one-line rule to remember before writing. Tap each piece until it matches the chapter.</h1>');
  L.sentence(L.card,[['Most of my readers are','Only a few readers are'],['rested and focused,','tired, distracted and switching,'],['so give them','so pack in'],['as many details as I can.','one clear thing to act on.']],[0,1,0,1],
   [['The book says nearly every reader today is a busy reader.'],['Most readers arrive worn down or in the middle of other tasks.'],['Packing in more works against limited attention.'],['More details means more to filter, focus on and juggle.']],
   'Busy readers have limited attention, so one clear anchor gets through.');}}
  ]
});
</script>
</body>
</html>
