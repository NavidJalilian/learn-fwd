<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What Makes Someone a Consultant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0001', title:'What makes someone a consultant', minutes:18, icon:'compass',
  goals:['Tell when you are consulting and when you are managing','Name the three skill sets and the five phases of consulting','Explain what “flawless” consulting promises, and why it starts with self-trust'],
  parts:['Consultant or manager','Three skill sets','Five phases','The promise'],
  read:'Read chapter 1 of the book for the full list of support roles and the overview of the five phases.',
  glossary:{
    'surrogate-manager':'Surrogate manager: a consultant who does the manager’s job in the manager’s place, like deciding who gets let go or installing a system top to bottom.',
    'lateral':'Lateral relationship: a working relationship between peers, with no boss and no subordinate. Power in it is unclear and open to negotiation.'
  },
  cheatsheet:[
    '<b>Consultant</b> = influence without direct power to make the change. <b>Manager</b> = direct responsibility for the action.',
    'Most staff and support people are consultants. Their clients are usually <b>line managers</b>.',
    'Doing the client’s job for them makes you a <b>surrogate manager</b>, not a consultant.',
    'Consulting aims at two kinds of change: new structures or procedures, and people <b>learning something new</b>.',
    'Three skill sets: <b>technical</b>, <b>interpersonal</b>, <b>consulting</b> (completing each phase).',
    'Five phases: entry and contracting; discovery and dialogue; analysis and the decision to act; engagement and implementation; extension, recycle or termination.',
    'Skip a phase and you are headed for trouble. Most disasters trace back to <b>contracting</b>.',
    'Work with clients is <b>lateral</b>: you don’t have to obey. Trusting yourself, not pleasing, is what serves the client.'
  ],
  steps:[
/* ---------- PART 1: CONSULTANT OR MANAGER ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Marcus runs the Copperleaf warehouse. Jordan, from a support team, tells Marcus to hire extra packers for the holidays. Who decides if it happens?</h1>');
  L.mc(L.card,['Jordan, who gave the advice','Marcus, who runs the warehouse'],1,
   'Jordan can only advise. Marcus has the power to act. That gap is what this whole book is about.',
   'Jordan gave the advice, but has no power over the warehouse. Marcus decides. That gap is what this whole book is about.');}},
{part:0,src:'Chapter 1 · Some definitions and distinctions',run(L){
  L.h(L.kick('learn','Consultant or manager?')+'<h1 class="q">The difference is who has direct control</h1>'+
   L.prose('A '+L.g('consultant','consultant')+' can influence a person, a group or a whole company, but has <b>no direct power</b> to make the change. A manager has <b>direct responsibility</b> for the action. The moment you take that responsibility, you are acting as a manager.')+
   L.lanes([['compass','Consultant','Advises, recommends, assists. Has to be listened to, but can’t order anything.',2],
            ['people','Manager','Decides and acts. Owns the result.',3]])+
   L.prose('You consult every time you advise someone who has the choice. Even telling a stranger which bus stop to get off at counts.'));
  L.done();}},
{part:0,src:'Chapter 1 · Some definitions and distinctions',run(L){
  L.h(L.kick('learn','Staff people are consultants')+'<h1 class="q">You may be a consultant without the job title</h1>'+
   L.prose('Most people in staff or support jobs are really consultants: HR, finance, audit, IT, training, safety, planning and many more. They plan, recommend, assist and advise.')+
   L.prose('The people they advise are '+L.g('client','clients')+'. Inside a company the client is usually a '+L.g('line-manager','line manager')+', who has to live with the advice whether they like it or not.')+
   L.note('A support group has direct control over only three things: <b>its own time</b>, <b>its own staff</b> and <b>the kind of service it offers</b>. Everything else, it can only influence.','lock')+
   L.prose('At Copperleaf, Jordan works in <b>Business Improvement</b>. It has no authority over the stores or the warehouse (“the DC”). Jordan is a consultant, and Marcus, the DC director, is the client.'));
  L.done();}},
{part:0,src:'Chapter 1 · Some definitions and distinctions',run(L){
  L.h(L.kick('ex','A story from the book, retold')+'<h1 class="q">Alfred’s “great” project</h1>');
  L.beats(L.card,[
   ['The project','Alfred leads a support team that puts a new information system into a line manager’s department. Four months of work.'],
   ['What they did','His team assessed the problems, designed the system and got the manager to let them install it from top to bottom.'],
   ['How he feels','Alfred is delighted. It felt like a great project.'],
   ['The catch','His satisfaction is a manager’s satisfaction. For four months he took over a piece of the line manager’s job.'],
   ['The name for it','The book calls this acting as a '+L.g('surrogate-manager','surrogate manager')+': doing the manager’s job in their place.']],
   'Having control is fine, and most of us want it. What matters is knowing which role you are in, for your sake and for what the client learns.');}},
{part:0,src:'Chapter 1 · Some definitions and distinctions',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Marcus says: “Just write the new packing rules yourself and post them on the floor.” If Jordan does exactly that, what role are they in?</h1>');
  L.mc(L.card,['Surrogate manager, doing Marcus’s job','Consultant, influencing without control'],0,
   'Writing and posting the rules is Marcus’s job. Jordan would be taking it over, not advising on it.',
   'A consultant advises the person who decides. Writing and posting the rules is the decision itself, so Jordan would be standing in for Marcus.');}},
{part:0,src:'Chapter 1 · Some definitions and distinctions',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Consulting or managing?',['Consulting','Managing'],[
   ['Jordan shows Marcus delivery-damage data and suggests where to look first.',0,'Jordan offers data and advice. Marcus still chooses.'],
   ['Marcus asks Jordan to pick which packers should be moved off the dock, and Jordan picks them.',1,'Deciding who stays and who goes is the manager’s call. Jordan would be a surrogate manager.'],
   ['Jordan decides how their own Business Improvement week is planned.',1,'Jordan has direct control over their own time, so here they are managing.'],
   ['A finance analyst tells a store manager their stock levels look high.',0,'The analyst can only advise. The store manager decides what to order.'],
   ['Jordan runs the counseling talk with a packer that Marcus didn’t want to have.',1,'Counseling the manager’s employee for them is doing the manager’s job.']]);}},
{part:0,src:'Chapter 1 · Some definitions and distinctions',run(L){
  L.h(L.kick('learn','What consulting is for')+'<h1 class="q">The end product is always some kind of change</h1>'+
   L.prose('The book names two kinds of change a consultant works toward:')+
   L.list([['layers','A new structure, policy or procedure','A new pay plan, a new reporting process, a new safety program.'],
           ['bulb','People learning something new','A team sees how its meetings really work, or a manager learns to involve people in setting goals.']],1)+
   L.prose('Put together, the goal is that people or organizations end up <b>managing themselves differently</b>. An interview, a survey, a training course or a study are all consulting acts aimed at that change.'));
  L.done();}},
{part:0,src:'Chapter 1 · Some definitions and distinctions',pts:4,run(L){
  L.h(L.kick('pr','Which kind of change?')+'<h1 class="q">Sort each Copperleaf result by the kind of change it is.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['New structure or procedure','People learned something'],[
   ['The DC adopts a new checklist for wrapping sofas',0,'A checklist is a new procedure.'],
   ['Marcus realizes their last-minute schedule changes make supervisors rush',1,'Nothing on paper changed. Marcus learned something about how they manage.'],
   ['Supervisors start setting their own shift goals with their teams',1,'This is a new way of involving people, which the book counts as learning.'],
   ['Damage reports now go to the DC every Monday',0,'A new reporting process is a procedural change.']],
   'Both kinds count. The deeper aim is that people end up managing themselves differently.');}},

/* ---------- PART 2: THREE SKILL SETS ---------- */
{part:1,src:'Chapter 1 · Technical, interpersonal and consulting skills',run(L){
  L.h(L.kick('learn','Three skill sets')+'<h1 class="q">Every moment of consulting draws on three kinds of skill</h1>'+
   L.tiers([['book','Technical skills','Expertise in your field: engineering, accounting, data, training. It’s why anyone asks your advice. The book assumes you have it.','Jordan: process analysis and data'],
            ['chat','Interpersonal skills','Putting ideas into words, listening, giving support, disagreeing reasonably. Keeping a relationship going.','Jordan: hearing Marcus out, even when they disagree'],
            ['map','Consulting skills','Completing the steps of each consulting phase, in order. This is the main focus of the book.','Jordan: not skipping a phase',true,'This course']])+
   '<p class="small" style="margin-top:10px">The first two are needed. The third is what this book teaches.</p>');
  L.done();}},
{part:1,src:'Chapter 1 · Technical, interpersonal and consulting skills',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">Marcus calls Jordan about damaged deliveries</h1>');
  L.beats(L.card,[
   ['The call','Complaints about scratched and broken furniture deliveries have doubled in six months. Marcus’s boss told them to fix it. Marcus calls Jordan: “My packers are careless. Design me a training course and run it next month.”'],
   ['Technical skill','Jordan knows how to read damage data and map a packing process. That’s why Marcus called them and not someone else.'],
   ['Interpersonal skill','Jordan listens, lets Marcus finish, and says calmly that they’d like to understand the problem before agreeing to a course.'],
   ['Consulting skill','Jordan sees this is the very first phase. Before designing anything, they need to agree with Marcus on the problem, what each of them expects and how to start.'],
   ['The pull','Jordan is tempted to just say “sure” and start building slides. That would skip a phase.']],
   'Expertise gets Jordan the call. Listening keeps the relationship. Knowing which phase they are in keeps the project from going wrong.');}},
{part:1,src:'Chapter 1 · Technical, interpersonal and consulting skills',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Jordan disagrees with Marcus’s plan but says so calmly and keeps the conversation friendly. Which skill set is that?</h1>');
  L.mc(L.card,['Technical skills','Consulting skills','Interpersonal skills'],2,
   'Disagreeing reasonably and keeping the relationship going are interpersonal skills.',
   'Technical skill is subject expertise, and consulting skill is completing each phase. Disagreeing reasonably is interpersonal.');}},
{part:1,src:'Chapter 1 · Technical, interpersonal and consulting skills',pts:6,run(L){
  L.h(L.kick('pr','Which skill set?')+'<h1 class="q">Sort what Jordan does into the three skill sets.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Technical','Interpersonal','Consulting'],[
   ['Works out the damage rate per shift from delivery records',0,'Data analysis is Jordan’s field of expertise.'],
   ['Repeats Marcus’s worry back to check they understood it',1,'Careful listening is an interpersonal skill.'],
   ['Agrees on expectations before collecting any data',2,'Finishing contracting before moving on is a consulting skill.'],
   ['Knows which packing materials protect glass tabletops',0,'This is subject knowledge, a technical skill.'],
   ['Offers support when Marcus admits they feel squeezed by their boss',1,'Giving support is part of keeping a relationship.'],
   ['Plans how the findings will be fed back and decided on',2,'Handling the feedback phase well is a consulting skill.']],
   'Jordan needs all three. The book’s focus is the third one: getting each phase right.');}},

/* ---------- PART 3: FIVE PHASES ---------- */
{part:2,src:'Chapter 1 · Consulting skills preview',run(L){
  L.h(L.kick('learn','The five phases')+'<h1 class="q">Every project goes through the same five phases, whether it lasts ten minutes or ten months</h1>'+
   L.list([['Entry and contracting','First contact. Explore the problem, decide if you’re the right person, and agree what each side expects.'],
     ['Discovery and dialogue','Form your own picture of the problem and of the client’s strengths, and help the client do the same.'],
     ['Analysis and the decision to act','Shrink lots of data to a few issues, feed it back, handle the pushback, and choose goals and steps.'],
     ['Engagement and implementation','Carry out the plan. Often a meeting or training event starts it.'],
     ['Extension, recycle or termination','Learn from it, then widen it, start a new round with a new agreement, or end well.']],2)+
   L.note('The steps are in order. Skip one, or assume it’s been taken care of, and the book says you’re headed for trouble.','alert'));
  L.done();}},
{part:2,src:'Chapter 1 · Consulting skills preview',pts:1,run(L){
  L.h(L.kick('try','Put them in order')+'<h1 class="q">Tap the '+L.g('phases','five phases')+' in the order a project goes through them.</h1>');
  L.order(L.card,['Entry and contracting','Discovery and dialogue','Analysis and the decision to act','Engagement and implementation','Extension, recycle or termination'],
   'Agree first, discover second, decide third, act fourth, then learn and choose what’s next.');}},
{part:2,src:'Chapter 1 · Consulting skills preview',run(L){
  L.h(L.kick('ex','How it could go')+'<h1 class="q">The damaged-deliveries project, phase by phase</h1>');
  L.beats(L.card,[
   ['1 · Entry and contracting','Jordan meets Marcus. They talk through the problem, whether Jordan is the right person, what each expects, and how to begin.'],
   ['2 · Discovery and dialogue','Jordan and Marcus decide who helps define the problem and what information to gather, then they gather it.'],
   ['3 · Analysis and the decision to act','Jordan boils the findings down to a few issues. Marcus may push back on some of it. Together they pick goals and next steps.'],
   ['4 · Engagement and implementation','The DC carries out the plan, maybe starting with a meeting that brings the shifts together.'],
   ['5 · Extension, recycle or termination','They look back at what they learned. Maybe they extend it to the Eastgate warehouse, start again on a clearer problem, or close the project well.']],
   'Notice that the course Marcus asked for might appear in phase 4, or not at all. The first three phases decide that.');}},
{part:2,src:'Chapter 1 · Consulting skills preview',pts:1,
 solve:async L=>{L.$('#ff').click();},
 run(L){
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Two versions of Jordan get Marcus’s call. Press the button to jump ahead six weeks.</h1>'+
   L.lanes([['flame','Jordan A: jumps in','Says “sure”, builds the training course, runs it next month.<div class="res" id="ra"></div>',4],
            ['list','Jordan B: phase by phase','First agrees with Marcus on the problem, what each expects and how to start.<div class="res" id="rb"></div>',2]])+
   '<button class="btn pri" id="ff" style="margin-top:14px">'+L.ic('play')+'Six weeks later</button><div id="fq"></div>');
  L.$('#ff').onclick=function(){this.remove();
    L.$('#ra').innerHTML='<span style="color:var(--no)">Complaints haven’t dropped. Nobody agreed what the course should fix, so Marcus and Jordan each blame the other.</span>';
    L.$('#rb').innerHTML='<span style="color:var(--ok)">Slower start, but both know what they’re working on and who does what.</span>';
    const q=L.$('#fq');q.innerHTML='<h2 class="sub">Where does the book say consultants’ disasters usually trace back to?</h2>';
    L.mc(q,['A weak training design','The first, contracting phase','Not enough data at the end'],1,
     'When consultants look back on their disasters, they usually find the project went wrong in the initial contracting.',
     'The book is clear: when consultants talk about their disasters, the fault usually lies in the initial contracting phase.');};}},
{part:2,src:'Chapter 1 · Consulting skills preview',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which phase is this?',['Entry and contracting','Discovery and dialogue','Analysis and decision','Engagement','Extension, recycle, end'],[
   ['Jordan and Marcus agree on how long the work will take and what each will provide.',0,'Agreeing on expectations is the heart of contracting.'],
   ['Jordan interviews packers and pulls six months of complaint records.',1,'Collecting information to form a picture of the problem is discovery.'],
   ['Jordan presents three main issues and Marcus pushes back on one of them.',2,'Feeding back the data, and meeting resistance to it, belongs to phase 3.'],
   ['The DC runs a kickoff meeting to introduce a new loading routine.',3,'Carrying out the plan, often starting with an event, is engagement and implementation.'],
   ['After the new routine, it turns out the real issue is scheduling, so they make a new agreement.',4,'When the real problem only shows up after implementation, the work recycles with a new contract.']]);}},

/* ---------- PART 4: THE PROMISE ---------- */
{part:3,src:'Chapter 1 · The promise of flawless consultation',run(L){
  L.h(L.kick('learn','Lateral, not vertical')+'<h1 class="q">Why consulting so often feels unclear</h1>'+
   L.lanes([['arrow','Vertical: boss and you','When your boss gives an order, you know they have the right to tell you what to do.',3],
            ['scale','Lateral: client and you','There’s no boss and no subordinate. If a client makes a demand, you don’t have to obey.',2]])+
   L.prose('A consultant is always working in a '+L.g('lateral','lateral relationship')+'. Who has how much power is unclear and open to negotiation. So when a client pushes back, you aren’t sure whether to push harder or let go.')+
   L.prose('The book says it is about managing exactly this uncertainty.'));
  L.done();}},
{part:3,src:'Chapter 1 · The promise of flawless consultation',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Marcus tells Jordan: “Have the course ready by the 1st.” What is true about this demand?</h1>');
  L.mc(L.card,['Jordan must do it, since Marcus is senior','Jordan can negotiate, since it’s lateral','Jordan should let their own boss decide'],1,
   'Marcus isn’t Jordan’s boss. The relationship is lateral, so the demand is open to negotiation.',
   'Marcus is the client, not Jordan’s boss. In a lateral relationship Jordan doesn’t have to obey; the terms are open to negotiation.');}},
{part:3,src:'Chapter 1 · The promise of flawless consultation',run(L){
  L.h(L.kick('learn','The promise')+'<h1 class="q">What “flawless” consulting offers you</h1>'+
   L.prose('The book calls its approach '+L.g('flawless','flawless consulting')+': consulting without error. It focuses on the early phases, because getting contracting, discovery and feedback right lays the ground for the rest. If you work this way, it promises you will:')+
   L.list([['check','Be used and heard','Your expertise gets used and your advice gets acted on more often.'],
     ['people','Be a partner','You work alongside clients, gain their support and trust, and have more influence.'],
     ['shield','Avoid no-win spots','You stay out of situations you can’t win, and clients become truly committed.']],1)+
   L.prose('Under the techniques sits one message: acting on trust in yourself and your own experience is always the right path.')+
   L.quote('Each act that is manipulative or filled with pretense is always self-destructive.','Peter Block, chapter 1'));
  L.done();}},
{part:3,src:'Chapter 1 · The promise of flawless consultation',pts:1,run(L){
  L.h(L.kick('pr','A real decision')+'<h1 class="q">Jordan thinks: “Support people are the first to be cut. I’d better just give Marcus what they ask and keep my feelings to myself.” What does the book say about this?</h1>');
  L.mc(L.card,['It’s wise: protecting the job comes first','It’s a trap: fear becomes an excuse','It’s fine for internal consultants only'],1,
   'The book says consultants really are vulnerable, but that fear can become an excuse to deny your own needs and stop being authentic. Trusting yourself serves the client better.',
   'The book admits consultants are easy to cut, but warns that this fear becomes an excuse to hide your own needs and feelings. Its alternative is to trust yourself.');}},
{part:3,src:'Chapter 1 · The promise of flawless consultation',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Tap each piece until the sentence describes Jordan’s job correctly.</h1>');
  L.sentence(L.card,[['Jordan','Marcus'],['has direct control over','can only influence'],['the DC’s packing,','their own time,'],['so they should','so they must never'],['advise and agree with Marcus','decide alone for Marcus']],[0,1,0,0,0],
   [['Marcus is the client. The sentence is about Jordan’s role.'],['Jordan has no authority over the DC. Direct control is the manager’s.'],['Jordan does control their own time. The DC’s packing is what they can only influence.'],['“Must never” turns it upside down. Advising is exactly the job.'],['Deciding alone for Marcus is the surrogate-manager role.']],
   'A consultant influences without control, and works with the client rather than in their place.');}}
  ]
});
</script>
</body>
</html>
