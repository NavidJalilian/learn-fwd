<title>The Agonies of Contracting</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">

<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0007', title:'The agonies of contracting', minutes:19, icon:'alert',
  goals:['Work through a project the client only half wants, in five steps','Spot a quiet shift in your role and renegotiate it at the right moment','Decide which consulting talks can happen online and which need the room'],
  parts:['Low motivation','Ceaseless negotiation','Other agonies','The virtual world'],
  read:'Read chapter 6 of the book for the full drug-company story and the two lists of virtual-world questions.',
  glossary:{
    coercion:'Coercion: being pushed into saying yes, by a boss, by your own people, or by finding it hard to say no.',
    'small-step':'Small-step project: a small first piece of a bigger project, so the client can see whether working together is as bad as they feared.',
    'ceaseless-negotiation':'Ceaseless negotiation: the idea that a consulting contract keeps shifting, so you keep renegotiating it for the whole project.',
    'go-between':'Go-between: someone, often on the client’s staff, who stands between you and the real client and passes messages along.'
  },
  cheatsheet:[
    '<b>Low motivation</b>: 1 consider not doing it; 2 name the pressure; 3 send the client back to renegotiate; 4 start with a small step; 5 ask how to protect their control and vulnerability.',
    'A yes given under <b>coercion</b> is a weak yes. Say so, at least to yourself.',
    'Your role shifts quietly. Watch for small cues: a missed invitation, a meeting that keeps getting moved, a decision made without you.',
    'Renegotiate <b>at the moment of change</b>. Leverage is highest then and drops every day you wait, but late is still better than never.',
    'Flirtatious client: ask why deciding is so hard. Credentials: tell one story, then ask “Are you concerned I can help you?”',
    'Go-betweens: get direct contact with the real client early and often.',
    'Keep problem talk under <b>35 percent</b> of a contracting meeting. Stuck? “Tell me what you want from me.”',
    'Online works for facts and logistics. Feelings, doubts, control and the client’s own part need the room. E-mail doesn’t count.'
  ],
  steps:[
/* ---------- PART 1: LOW MOTIVATION ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">A friend agrees to help you move house only because their partner insisted. How much should you count on them?</h1>');
  L.mc(L.card,['Fully, since a yes is a yes','Less, since a pushed yes is a weak one'],1,
   'A yes given under pressure tends to come with low energy. This lesson starts with the client version of that friend.',
   'They did say yes, but not by choice. A pushed yes usually brings low energy, and that is the first agony of contracting.');}},
{part:0,src:'Chapter 6 · The Agonies of Contracting',run(L){
  L.h(L.kick('learn','The first agony')+'<h1 class="q">The client says yes, but doesn’t really want the project</h1>'+
   L.prose('Sometimes a manager agrees to go ahead, but you can tell their heart isn’t in it. Block calls this an unnatural stance for a line manager. People rarely agree to work they don’t want unless they were pushed.')+
   L.list([['person','Their boss','Someone above them said “do it”.'],['people','Their own people','Pressure comes from below.'],['chat','You','They find it hard to say no to the consultant in front of them.']],4)+
   L.note('You may be under '+L.g('coercion','coercion')+' too: your own boss may want the project to happen.','alert'));
  L.done();}},
{part:0,src:'Chapter 6 · Dealing with Low Motivation',run(L){
  L.h(L.kick('learn','Five steps for low motivation')+'<h1 class="q">Each step applies only if the one before didn’t settle it</h1>'+
   L.list([['Consider not doing it','If the client has little energy for the project, the first choice is simply not to go ahead.'],
     ['Acknowledge the pressure','Admit, at least to yourself, that this starts with coercion. Ask the client if they feel pressured. Most will say so.'],
     ['Send them back to renegotiate','Suggest the client return to whoever is pushing and discuss whether, or in what form, the project must happen.'],
     ['Start with a small step','Agree on a '+L.g('small-step','small piece')+' of the work, so the client can see whether it is as bad as they feared.'],
     ['Minimize their concerns','Say you are going ahead despite low motivation. Ask how to set it up so they keep control and their vulnerability is protected.']],1)+
   '<p class="small" style="margin-top:10px">If you are the source of the pressure, as an auditor is, say you know the client has no choice but to work with you.</p>');
  L.done();}},
{part:0,src:'Chapter 6 · Dealing with Low Motivation',run(L){
  L.h(L.kick('ex','How it plays out at Copperleaf')+'<h1 class="q">Marcus finally says yes to the scheduling tool</h1>');
  L.beats(L.card,[
   ['The yes','Business Improvement must roll out a new shift-scheduling tool to every site. Marcus has refused it twice. Now they sigh: “Fine. Send it over.”'],
   ['Step 1','Jordan asks themself whether to skip the DC for now. Renata says the rollout is a company commitment, so it must go ahead.'],
   ['Step 2','Jordan asks: “Are you feeling pushed into this?” Marcus admits it: “Lena wants every site on it by June.”'],
   ['Step 3','Jordan suggests Marcus talk to Lena about the form it takes. Lena agrees the DC can go last and start with one shift.'],
   ['Step 4','They agree on a small step: one day-shift team uses the tool for two weeks, then Marcus decides on the rest.'],
   ['Step 5','Jordan asks: “How can we set this up so you don’t feel you’ve given up control?” Marcus wants supervisors to keep the final say on every schedule. Jordan agrees.']],
   'Jordan didn’t remove the pressure. They named it, shrank the first step and gave Marcus back some control. Block admits these are tough contracts; then you hope for the best.');}},
{part:0,src:'Chapter 6 · Dealing with Low Motivation',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">A store manager agrees to a project with almost no energy. According to Block, what is the first option to weigh?</h1>');
  L.mc(L.card,['Selling the benefits more strongly','Running a small pilot first','Not doing the project at all'],2,
   'Step 1: if the client has low energy for it, the first choice is to consider just not doing it.',
   'That comes later, if at all. Block’s first step is to consider not doing the project. Selling harder isn’t one of the steps.');}},
{part:0,src:'Chapter 6 · Dealing with Low Motivation',pts:1,run(L){
  L.h(L.kick('pr','Put it in order')+'<h1 class="q">Drag the five low-motivation steps into the order Block gives them.</h1>');
  L.order(L.card,['Consider not doing it','Acknowledge the pressure','Send the client back to renegotiate','Contract for a small step','Ask how to minimize their concerns'],
   'Each step is a fallback. You only move on when the one before didn’t settle it.');}},
{part:0,src:'Chapter 6 · Dealing with Low Motivation',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which step is Jordan taking?',['Acknowledge pressure','Send back to renegotiate','Small step','Minimize concerns'],[
   ['“Would it help if you asked Lena whether the DC has to go first?”',1,'Jordan points Marcus back to the person applying the pressure.'],
   ['“Let’s try it with one team for two weeks and then you decide.”',2,'A small first piece lets Marcus test whether working together is as bad as feared.'],
   ['“It sounds like this wasn’t really your choice. Is that right?”',0,'Jordan names the pressure and invites Marcus to own up to it.'],
   ['“What would make you feel this stays in your hands?”',3,'Jordan asks how to protect Marcus’s control while still going ahead.']]);}},

/* ---------- PART 2: CEASELESS NEGOTIATION ---------- */
{part:1,src:'Chapter 6 · Ceaseless Negotiation: The Shifting Tide of Your Role',run(L){
  L.h(L.kick('learn','The contract keeps moving')+'<h1 class="q">Your role is never settled once and for all</h1>'+
   L.prose('Projects live inside political organizations where people and pressures keep changing. The client also has mixed feelings: they want you on the project, and they want you kept at a distance. So your role is open to '+L.g('ceaseless-negotiation','ceaseless negotiation')+'.')+
   L.lanes([['alert','Obvious changes','A new manager arrives. The budget is cut. Midway findings point to new problems.',4],
            ['eye','Subtle cues','You expected an invitation to a meeting and didn’t get one. The client keeps fouling up the scheduling of your meetings.',2]])+
   L.prose('The subtle cues are harder to read, and they may be the sign that your contract needs renegotiating.'));
  L.done();}},
{part:1,src:'Chapter 6 · Ceaseless Negotiation: The Shifting Tide of Your Role',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">Block loses his seat on a committee in one day</h1>');
  L.beats(L.card,[
   ['The setup','Block, an outside consultant, is on a drug company’s committee planning a big May conference with three vice presidents. He feels like a full member.'],
   ['Tuesday','The group worries the president’s quiet style is causing trouble. After much pushing from Block, they agree to raise it with the president at 4:00 the next day.'],
   ['Wednesday','Block arrives early. One member mentions, in passing, that the 4:00 meeting is cancelled. The three met that morning and decided it was too risky.'],
   ['The puzzle','Block feels troubled for hours without knowing why. Then it lands: they made and carried out a big decision without him. Overnight he went from member to specialist who just gets told.'],
   ['The repair','A few days later he renegotiates with one member and is treated as a full member again. But he wished he had raised it in the meeting itself, with the whole group.']],
   'The contract shifted quickly and quietly. Block only noticed hours later, and fixing it with one person was harder than fixing it with the whole group on the spot.');}},
{part:1,src:'Chapter 6 · Ceaseless Negotiation: The Shifting Tide of Your Role',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">When should you raise a sense that the client has started treating you differently?</h1>');
  L.mc(L.card,['As soon as you sense the change','At the next planned project review','Once the pattern is clear and proven'],0,
   'Leverage is highest right at the moment of change. Every day you wait makes the talk harder.',
   'Waiting feels safer, but Block says leverage is highest at the moment of change. Raise it as soon as you sense it.');}},
{part:1,src:'Chapter 6 · Ceaseless Negotiation: The Shifting Tide of Your Role',pts:1,
 solve:async L=>{L.$('#po').children[0].click();L.$('#go').click();},
 run(L){
  let p=null;const N=['In the meeting itself','Three days later','A month later'],V=[90,45,15];
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">Marcus and the supervisors cancelled the joint interview days without Jordan. They just want to hand Jordan a spreadsheet. When does raising it give Jordan the most leverage?</h1><div id="po"></div>'+
   '<div id="tl" hidden><button class="btn pri" id="go" style="margin:8px 0">'+L.ic('play')+'Show the leverage</button>'+
   N.map((n,j)=>'<div class="meterrow"><div class="lb">'+n+'</div><div class="meter"><div id="m'+j+'" style="width:0%;background:var(--h'+(j+1)+')"></div></div></div>').join('')+'</div>');
  N.forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=n;b.onclick=()=>{if(p!==null)return;p=j;b.classList.add('sel');L.$('#tl').hidden=false;};L.$('#po').appendChild(b);});
  L.$('#go').onclick=function(){this.remove();let i=0;
    const t=setInterval(()=>{const el=L.$('#m'+i);if(!el){clearInterval(t);return;}el.style.width=V[i]+'%';i++;
      if(i>=3){clearInterval(t);L.award(p===0);
        L.sheet(p===0?'ok':'no',p===0?'You called it':'The meeting itself wins','Leverage is highest right at the moment of change, with everyone still in the room. Three days later it is harder; a month later, harder still. Block adds that the talk still needs to happen, however late.');L.done();}},450);};}},
{part:1,src:'Chapter 6 · Ceaseless Negotiation: The Shifting Tide of Your Role',pts:4,run(L){
  L.h(L.kick('pr','Obvious or subtle?')+'<h1 class="q">Sort each sign that Jordan’s contract with Marcus may be shifting.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Obvious change','Subtle cue'],[
   ['Lena cuts the deliveries project budget by half',0,'A budget cut is the kind of change everyone can see.'],
   ['Jordan is no longer copied on the DC planning e-mails',1,'Nobody announced it. It is a small sign the client is treating Jordan differently.'],
   ['Marcus’s assistant moves Jordan’s check-in three weeks running',1,'Fouled-up scheduling is one of Block’s own examples of a subtle cue.'],
   ['A new DC director replaces Marcus',0,'A new manager arriving is an obvious reason to renegotiate.']],
   'Obvious changes force a new conversation. Subtle cues are easy to miss, and they matter just as much.');}},
{part:1,src:'Chapter 6 · Ceaseless Negotiation: The Shifting Tide of Your Role',pts:1,run(L){
  L.h(L.kick('pr','What would you do?')+'<h1 class="q">Jordan and Lena agreed Jordan would give a “mirror” of how supervision works at the DC, with no names. Two weeks later Lena’s chief of staff e-mails: “Just send the bottom three names, informally.” What should Jordan do?</h1>');
  L.mc(L.card,['Send three names, since it is informal','Wait and raise it with the final report','Raise it with Lena directly, and soon'],2,
   'The contract is shifting, and through a go-between. Jordan should talk to Lena, the real client, while the change is fresh.',
   'Sending names quietly breaks the agreement, and waiting lets the leverage drain away. Jordan should raise the change with Lena directly, right now.');}},

/* ---------- PART 3: OTHER AGONIES ---------- */
{part:2,src:'Chapter 6 · Some Other Specific Agonies',run(L){
  L.h(L.kick('learn','Four more rough spots')+'<h1 class="q">Tap each agony to see Block’s advice</h1>');
  L.flips(L.card,[
   ['The flirtatious client','You learn you are the fourth person they have talked to about the project. Don’t just sell harder. Ask why deciding is so hard. Too much care over choosing a consultant often means the manager wants a project but doesn’t want anything to happen.'],
   ['“What are your credentials?”','Tell your favorite, well-rehearsed story and hope it speaks to their situation. Then ask: “Are you concerned about whether I can really help you?” Don’t recite degrees and past clients.'],
   ['Go-betweens','A '+L.g('go-between','go-between')+' who is too active or protective builds a screen between you and the manager. Get direct contact with the real client early and often, and urge them to attend.'],
   ['Defining the problem to death','The most common mistake in contracting meetings: spending most of the time on the problem and leaving little for the real business of wants, control and exposure.']],
   'All four pull you away from the real client and the real business of contracting.');}},
{part:2,src:'Chapter 6 · Defining the Problem to Death: A Common Mistake',run(L){
  L.h(L.kick('learn','Defining the problem to death')+'<h1 class="q">Why consultants keep asking about the problem</h1>'+
   L.prose('In a one-hour meeting, consultants often spend fifty minutes on the problem and ten on the real business. Block’s explanation: we pick up the client’s confusion, don’t know what to do next, and asking more questions is a relief for both sides.')+
   L.flow([['clock','Under 35%','Keep problem talk to about a third of the meeting',''],['chat','Then turn','“Let’s stop talking about the problem. Tell me what you want from me.”',''],['pencil','Still unclear?','Agree a small contract to find out more','']])+
   L.note('Another way out: just start making statements, such as “You seem confused about this problem. Here is what I’d like from you to take the next step.” If 20 minutes hasn’t made it clear, more questions won’t.','bulb'));
  L.done();}},
{part:2,src:'Chapter 6 · Credentials? With Your Experience!',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">A regional store manager asks Jordan: “So what have you actually done elsewhere?” What fits Block’s advice?</h1>');
  L.mc(L.card,['List the degrees, clients and wins','Tell one story, then ask about their doubt','Say that credentials don’t matter here'],1,
   'Tell your best story, then ask: “Are you concerned about whether I can really help you?” Managers often doubt they can be helped, so they need reassurance.',
   'A defensive list lets their doubts feed your own, and brushing it off ignores the worry. Tell one story, then ask if they are concerned you can help.');}},
{part:2,src:'Chapter 6 · Defining the Problem to Death: A Common Mistake',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Forty minutes into an hour with Marcus, they are still going round the damage numbers. Tap each piece to build what Jordan should say.</h1>');
  L.sentence(L.card,[
   ['“Let’s go through the damage reports again,','“Let’s stop talking about the problem for now,','“Let’s ask Lena how they see the problem,'],
   ['and let me ask a few more questions,','and I’ll go away and analyze it alone,','tell me what you want from me,'],
   ['and we can talk wants next month.”','and I’ll fit around whatever you like.”','and here’s what I need from you.”']],[1,2,2],
   [['More problem talk is the trap itself. It feels safe but leaves no time for the real business.','Lena isn’t in the room, and you can’t contract with someone who isn’t there.'],
    ['More questions keep defining the problem to death.','Going off alone is the expert role, and it skips the exchange of wants.'],
    ['Postponing wants leaves the business of the meeting undone.','Fitting around anything is pair-of-hands, with no wants of Jordan’s own.']],
   'Jordan stops the problem talk and moves the meeting to an exchange of wants and offers.');}},
{part:2,src:'Chapter 6 · Some Other Specific Agonies',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which agony is this?',['Flirtatious client','Credentials','Go-between','Problem to death'],[
   ['Every time Jordan asks to meet Marcus, Marcus’s deputy says “just tell me and I’ll pass it on.”',2,'The deputy is screening Jordan from the real client. Ask for Marcus directly.'],
   ['A store manager has already met three other internal teams about the same project and still won’t choose.',0,'Ask why the decision is so hard. They may want a project but not real change.'],
   ['Jordan’s hour with the Eastgate team ends with every question answered and no wants discussed.',3,'All the time went on the problem. The real business never happened.'],
   ['Lena opens with: “Remind me why you’re qualified to look at this?”',1,'Tell one story, then ask if Lena is concerned Jordan can really help.']]);}},

/* ---------- PART 4: THE VIRTUAL WORLD ---------- */
{part:3,src:'Chapter 6 · The Virtual World',run(L){
  L.h(L.kick('learn','The virtual world')+'<h1 class="q">The tools are new. The consulting job is not.</h1>'+
   L.prose('We now work with people we may never meet. Block’s point: online tools are fast, cheap and entertaining, but they are just technology. They are no substitute for relatedness, authenticity or meaning.')+
   L.quote('Saccharin is not sugar, margarine is not butter.','Peter Block, chapter 6')+
   L.prose('The process in this book still applies on a screen. You still exchange wants, look for doubts and surface '+L.g('resistance','resistance')+'. But with most of your senses gone, everything needs more care: double-check what the client wants, listen harder for patterns, make room for silence, and ask “Are you getting what you want from this?” halfway through.'));
  L.done();}},
{part:3,src:'Chapter 6 · E-mail Doesn’t Count; Make Distinctions in the Virtual World',run(L){
  L.h(L.kick('learn','E-mail, efficiency and distinctions')+'<h1 class="q">Decide what can be done online, and what needs the room</h1>'+
   L.list([['chat','E-mail doesn’t count','Meanings get distorted: mild sarcasm reads as disappointment, anger lasts longer. And a sent message has often not been read. Good for logistics, risky for the relationship.'],
     ['clock','Efficiency has hidden costs','Online is great for facts. When people’s relationships are vital to the change, it is a minor player.'],
     ['scale','Make distinctions','It is a question of depth and risk. Factual questions can go online. Personal ones, about feelings, doubts and the client’s own part, need people in the room.']],2)+
   L.note('Choosing which parts of a project happen in person is now part of contracting. Ask for what you think is important.','info'));
  L.done();}},
{part:3,src:'Chapter 6 · The Virtual World',run(L){
  L.h(L.kick('ex','How it plays out at Copperleaf')+'<h1 class="q">Jordan and Eastgate, a city away</h1>');
  L.beats(L.card,[
   ['The setup','Dana Brooks manages the Eastgate warehouse. Lena wants Eastgate to look at its damaged deliveries too. Jordan only reaches Dana by video and e-mail.'],
   ['The slip','Jordan e-mails a long proposal and treats the silence as a yes. Dana’s short reply, “Fine, whatever works,” reads as annoyed. Jordan can’t tell.'],
   ['The fix online','On the next video call Jordan covers the facts: history, who’s involved, timing. Halfway through they ask: “Are you getting what you want from this?” Then they wait through the silence.'],
   ['The in-person ask','Jordan asks to visit Eastgate for one day to talk about how Dana feels about working together and what doubts they have.']],
   'Logistics and facts can stay on screen. The talk that builds trust needs the room, and Jordan asks for it as part of the contract.');}},
{part:3,src:'Chapter 6 · Make Distinctions in the Virtual World',pts:6,run(L){
  L.h(L.kick('pr','Online or in the room?')+'<h1 class="q">Jordan plans the Eastgate work. Sort each question by where Block would ask it.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Fine online','Needs the room'],[
   ['Who are the people involved in Eastgate’s damage problem?',0,'Who the players are is a factual question. Video or e-mail can handle it.'],
   ['How do you feel about working with me on this?',1,'Feelings about the relationship need all your senses.'],
   ['How long will the first phase take?',0,'Time and scope are logistics. Fine online.'],
   ['What part have you played in how this problem came about?',1,'The client’s own part is personal and risky. Ask it in person.'],
   ['What history led up to the current situation?',0,'History is factual and impersonal, so it works on a screen.'],
   ['What doubts do you have that anything will change here?',1,'Doubts and reservations build or break trust. Ask them in the room.']],
   'Facts and logistics go online. Questions about feelings, doubts, control and the client’s own part need people in the room.');}},
{part:3,src:'Chapter 6 · E-mail Doesn’t Count',pts:1,run(L){
  L.h(L.kick('pr','What would you do?')+'<h1 class="q">Jordan e-mailed Marcus that the pilot of the scheduling tool will start a week earlier than agreed. No reply in a week. Jordan wants to go ahead. What fits the book?</h1>');
  L.mc(L.card,['Go ahead, since silence means consent','Talk with Marcus before going ahead','Send a firmer e-mail with a deadline'],1,
   'A sent e-mail has often not been read, and a change to the plan touches the relationship. Talk to Marcus.',
   'Block says assuming a sent e-mail was read is wrong half the time, and e-mail is risky for anything that touches the relationship. Talk with Marcus first.');}},
{part:3,src:'Chapter 6 · Efficiency Has Hidden Costs',pts:1,run(L){
  L.h(L.kick('pr','Putting it together')+'<h1 class="q">To save travel, Renata suggests running all of the Eastgate contracting by video, including the meeting about Dana’s doubts. What should Jordan say?</h1>');
  L.mc(L.card,['Agree, since the process works on any screen','Refuse to do any of the work by video','Facts by video, but the doubts talk in person'],2,
   'Block’s distinction is depth and risk. Facts can go online; doubts and feelings need the room. Jordan should ask for that, even if it costs a trip.',
   'The process does still apply online, but some talks need all your senses. And refusing video for everything ignores how useful it is for facts. Split by depth and risk.');}}
  ]
});
</script>
</body>
</html>
