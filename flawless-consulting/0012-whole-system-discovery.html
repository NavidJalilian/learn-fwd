<head>

<title>Whole-System Discovery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">

<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0012', title:'Whole-system discovery', minutes:18, icon:'people',
  goals:['Tell third-party discovery from whole-system discovery','Choose between them by weighing expertise against commitment','Check whether the conditions for a whole-system session are in place'],
  parts:['Two strategies','Strengths and limits','Your choice','Making it work'],
  read:'Read chapter 11 of the book, and its Further Reading list for the authors of large-group methods.',
  glossary:{
    'third-party':'Third-party discovery: a consultant, or a team, studies the situation and recommends actions for other people to carry out.',
    'whole-system':'Whole-system (first-party) discovery: the people who will carry out the change do the discovery together, from naming the problem to deciding what to do.',
    'design-team':'Design team: a group of employees, often 10 to 50, given months to study a problem and bring back recommendations. In a whole-system process, a design team plans only the event.',
    'large-group':'Large-group method: bringing many people, sometimes hundreds, into one room for two or three days to assess where they are and plan what to do.'
  },
  cheatsheet:[
    '<b>Third-party</b>: someone studies the situation and recommends for others. A design team of insiders is still a third party.',
    '<b>Whole-system</b>: the people who will implement the change do the discovery together. A large sample, not literally everyone.',
    'Third-party strengths: <b>objectivity</b>, a broader view, special expertise, simple decisions, outsider credibility.',
    'Third-party limit: discovery is split from doing, so the answer must be <b>sold</b>. Selling is the worst way to build commitment.',
    'Choose by priority: expertise and neutrality, or <b>commitment to implement</b>.',
    'Trust the process: full transparency, managers as equal participants, a full cross-section, a level playing field, a future focus, agreed next steps.',
    'In whole-system work the consultant <b>gives up the expert role</b> and designs the process. Managers can’t share power and then pull back.',
    'Payoff: the organization builds its own capacity to manage change.'
  ],
  steps:[
/* ---------- PART 1: TWO STRATEGIES ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Which plan will a team work harder to carry out?</h1>');
  L.mc(L.card,['One a planning group wrote for them','One they worked out together'],1,
   'Most of us push harder for a plan we helped make. This lesson is about building discovery on that fact.',
   'A plan from someone else has to be sold to us first. A plan we made is already ours, so we tend to push harder for it.');}},
{part:0,src:'Chapter 11 · Third-Party Consulting',run(L){
  L.h(L.kick('learn','The usual way')+'<h1 class="q">Third-party discovery: someone works it out for you</h1>'+
   L.prose('Everything so far in discovery assumed a '+L.g('third-party','third party')+': a consultant, engineer or support person who collects the data, analyzes it and reports back. That is what most clients expect.')+
   L.flow([['eye','Collect','Consultant gathers data'],['pencil','Analyze','Consultant makes sense of it'],['chat','Report','Client hears the answer']])+
   L.prose('The third party can be inside or outside the company. It can even be a '+L.g('design-team','design team')+' of 10 to 50 employees given about six months to come back with recommendations.')+
   L.note('Block’s rule: <b>whenever some person or group develops a solution for another</b>, it is a third-party stance, however many insiders are involved.','info'));
  L.done();}},
{part:0,src:'Chapter 11 · Whole-System Discovery',run(L){
  L.h(L.kick('learn','The alternative')+'<h1 class="q">Whole-system discovery: the doers do the discovery</h1>'+
   L.prose('In '+L.g('whole-system','whole-system')+' (or first-party) discovery, the client system itself redefines the problem, names the future it wants, lays out options and decides how to proceed. The consultant’s job becomes <b>convening</b> people to build their own change strategy.')+
   L.lanes([['person','Third-party','A few people work out what is best for many. Then the answer has to travel.',3],
            ['people','Whole-system','The people who discover and recommend are the <b>same people who will implement</b>. They are in it early and at every step.',2]])+
   L.note('“Whole system” doesn’t mean literally everyone. It means representatives of every part, so that a large sample of those who will act help create the plan. It also looks at the <b>whole</b>, not its separate parts.','layers'));
  L.done();}},
{part:0,src:'Chapter 11 · Third-Party Consulting',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Renata suggests a design team of twelve DC employees to spend four months studying the damage and report to Marcus. Which strategy is that?</h1>');
  L.mc(L.card,['Whole-system, because insiders do it','Third-party, because they solve it for others','Neither, since no consultant is involved'],1,
   'Right. Twelve people working out an answer for the rest of the DC is still a third-party stance, even though they are insiders.',
   'Being insiders doesn’t change the stance. Whenever a group develops a solution for others, it is third-party.');}},
{part:0,src:'Chapter 11 · Whole-System Discovery',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Third-party or whole-system?',['Third-party','Whole-system'],[
   ['Jordan interviews twenty people, analyzes the notes and presents findings to Marcus.',0,'Jordan collects, analyzes and reports. Classic third party.'],
   ['Packers, drivers, supervisors and Marcus spend two days together naming what goes wrong and planning fixes.',1,'The people who will act do the discovery together.'],
   ['An outside firm studies the DC and leaves a thick report.',0,'That is how the shelf report was made: outsiders recommending for insiders.'],
   ['Each Eastgate team assesses its own week and plans how to improve it, with Dana in the room.',1,'A whole unit self-assesses and plans. That is first-party work.'],
   ['Five senior supervisors design the new packing standard for everyone else.',0,'A small group solving for the rest is still a third party.']]);}},

/* ---------- PART 2: STRENGTHS AND LIMITS ---------- */
{part:1,src:'Chapter 11 · Third-Party Consulting',run(L){
  L.h(L.kick('learn','Why use a third party')+'<h1 class="q">The big strength is objectivity</h1>'+
   L.list([['eye','A fresh eye','Outsiders aren’t so soaked in the culture that they can’t see it. We see in others what we’re blind to in ourselves.'],
     ['alert','Willing to confront','They may face hard issues that insiders can’t or won’t face.'],
     ['bulb','Aware of options','They may know possibilities that people close to the problem miss.'],
     ['shield','Management backing','A sponsored study carries management’s energy. If leaders back it, and even model it, the change seems well on its way.']],1)+
   '<p class="small" style="margin-top:10px">Pairing a consultant with a design team adds close local knowledge of the work, so the recommendations should be more practical.</p>');
  L.done();}},
{part:1,src:'Chapter 11 · Third-Party Consulting',run(L){
  L.h(L.kick('learn','The limit')+'<h1 class="q">Discovery is split from doing, so the answer has to be sold</h1>'+
   L.prose('Third-party recommendations must be sold to management. Then management must sell or order them to employees. Block says the act of selling rests on flawed beliefs:')+
   L.list([['That there is one right answer',''],['That the consultant or design team knows it',''],['That the organization can and should be persuaded to act on it','']],4)+
   L.prose('For a strictly technical problem there may be a right answer that gets accepted on its merits. But where commitment, new skills or new working relationships are needed, this engineering approach brings modest change at best. At worst, a <i>correct</i> answer still isn’t acted on, even with full management backing.'));
  L.done();}},
{part:1,src:'Chapter 11 · Third-Party Consulting',run(L){
  L.h(L.kick('ex','Copperleaf: the shelf report')+'<h1 class="q">Why did a good report change nothing?</h1>');
  L.beats(L.card,[
   ['Two years ago','Copperleaf hires an outside firm to study the DC. Smart people, lots of data, months of work.'],
   ['The report','A thick, careful report with clear recommendations. Marcus reads it and agrees with every page.'],
   ['The handoff','Marcus is meant to pass the ideas to supervisors, who pass them to the floor. Each step is a sales job.'],
   ['On the floor','The packers and supervisors never saw the study. To them it is head office telling them how to work.'],
   ['Today','The report sits on a shelf. Now the DC faces a new crisis: damaged deliveries have doubled.']],
   'This is the third-party limit in one story: the answer may even have been right, but the people who had to act were never part of finding it.');}},
{part:1,src:'Chapter 11 · Taking a Whole-System Approach',pts:1,
 solve:async L=>{L.$('#sa').click();L.$('#sb').click();},
 run(L){
  const P={a:['Jordan finds the answer','Sell it to Marcus','Marcus sells or orders it to supervisors','Supervisors push it on the floor','Floor resists a change inflicted on it'],
           b:['Everyone in one room','All hear the same information','People decide together','The people who decided make it work']};
  const seen=new Set();
  L.h(L.kick('pr','Toggle and compare')+'<h1 class="q">Follow one idea, “check every item before loading”, along both paths. Tap each one.</h1>'+
   '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="chip" id="sa">'+L.ic('person')+'Third-party path</button><button class="chip" id="sb">'+L.ic('people')+'Whole-system path</button></div>'+
   '<div class="ladder" id="ld" style="margin-top:12px"><div class="small">Choose a path above.</div></div><div id="hq"></div>');
  const show=(k,btn)=>{[L.$('#sa'),L.$('#sb')].forEach(x=>x.classList.remove('sel'));btn.classList.add('sel');seen.add(k);
    L.$('#ld').innerHTML=P[k].map((x,j)=>(j?'<div class="conn"></div>':'')+'<div class="rung'+(j===P[k].length-1?' cur':'')+'">'+x+'</div>').join('');
    if(seen.size===2&&!L.$('#hq').innerHTML){const q=L.$('#hq');q.innerHTML='<h2 class="sub">What does the whole-system path remove?</h2>';
      L.mc(q,['The need for any management involvement','The need to sell the answer to anyone','The need for good information'],1,
       'Right. People who worked it out together don’t need convincing. Block calls selling the worst way to build commitment, because people resist change inflicted on them.',
       'Management is still in the room, and shared information is the heart of it. What disappears is the chain of selling.');}};
  L.$('#sa').onclick=function(){show('a',this);};L.$('#sb').onclick=function(){show('b',this);};}},
{part:1,src:'Chapter 11 · Taking a Whole-System Approach',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">What does a whole-system approach bet on most?</h1>');
  L.mc(L.card,['Collective knowledge and the commitment of deciding for yourself','Strong management sponsorship pushing the change from above','An expert’s independent and objective point of view'],0,
   'Yes. Management is still in the room, but the bet is on what people know together and the commitment that comes from choosing.',
   'Sponsorship and objectivity are the third party’s strengths. The whole-system approach doesn’t bet heavily on them. It bets on collective knowledge and choice.');}},

/* ---------- PART 3: YOUR CHOICE ---------- */
{part:2,src:'Chapter 11 · Your Choice',run(L){
  L.h(L.kick('learn','Weighing the two')+'<h1 class="q">Expertise and neutrality, or commitment to implement?</h1>'+
   L.lanes([['person','Third party','• Neutral observer, no stake in the answer<br>• Broader view from many organizations<br>• Expertise the unit doesn’t have<br>• Simple decisions, more manager control<br>• Outsider credibility',3],
            ['people','Whole system','• Deciding together builds commitment<br>• Deciders are the ones who make it work<br>• Closer local knowledge<br>• More realism about what will work<br>• The learning stays in the organization',2]])+
   L.note('Whatever you choose, remember the goal: to <b>spark action</b>, not just to produce an accurate assessment.','target'));
  L.done();}},
{part:2,src:'Chapter 11 · Your Choice',pts:6,run(L){
  L.h(L.kick('pr','Which way does it tip?')+'<h1 class="q">Each fact about a situation points to one strategy. Sort them.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Tips to third party','Tips to whole system'],[
   ['Nobody at the DC knows how to calibrate the new scanning gates.',0,'Expertise the unit doesn’t have favors a third party.'],
   ['The fix will only work if packers and drivers change daily habits.',1,'When people must make it work, they should be the ones deciding.'],
   ['Lena wants an outside view with no stake in the answer.',0,'A neutral observer is a third-party strength.'],
   ['The floor knows which shortcuts happen at 5 a.m. Head office doesn’t.',1,'Local knowledge sits with the people in the work.'],
   ['Marcus wants to keep tight control of the final decision.',0,'Simpler decisions and more manager control favor a third party.'],
   ['Copperleaf wants the DC to solve its next problem without outside help.',1,'Learning that stays in the organization is a whole-system gain.']],
   'It is a choice of priority: the consultant’s expertise and neutrality, or people’s commitment to carry out the change.');}},
{part:2,src:'Chapter 11 · Third-Party Consulting',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which strategy fits better?',['Third-party','Whole-system'],[
   ['A conveyor sensor keeps misreading parcel sizes. It’s a strictly technical fault.',0,'For a strictly technical problem, a right answer may be accepted on its merits.'],
   ['Damaged deliveries depend on speed pressure, shared data and shift habits.',1,'Commitment and new working habits are needed. Selling an answer brings modest change at best.'],
   ['Eastgate must choose which supplier’s pallet wrap meets a safety standard.',0,'Specialist knowledge decides it, and few habits have to change.'],
   ['Day and night shifts need a new way to hand over unfinished loads.',1,'A new relationship between two groups is best built by those groups.']]);}},

/* ---------- PART 4: MAKING IT WORK ---------- */
{part:3,src:'Chapter 11 · Whole-System Process',run(L){
  L.h(L.kick('learn','What a whole-system process looks like')+'<h1 class="q">Many people, one room, two or three days</h1>'+
   L.prose('These methods go by many names: '+L.g('large-group','large-group')+', high-interaction, large-scale. The name matters less than the intent. The room size is the main limit on numbers; sessions usually run two or three days in a row.')+
   L.list([['people','A design team plans the event','Usually guided by a consultant: who to invite, the focus, logistics and the activities.'],
     ['lock','…but not the answer','The design team stays out of stating the problem or the solutions.'],
     ['home','Everyone together if you can','If the whole unit fits in one room and the work allows it, invite everyone. Then nobody has to bridge to people who were absent.']],2)+
   L.note('What makes these methods special is <b>faith</b>: that with enough trust and honesty, every unit can name its own problems and find ways to address them.','leaf'));
  L.done();}},
{part:3,src:'Chapter 11 · Trusting the Process',run(L){
  L.h(L.kick('learn','Trusting the process')+'<h1 class="q">The conditions that have to be present</h1>'+
   '<p class="prose">Consultant and client both give up some control. Tap each card to see what that means.</p>');
  L.flips(L.card,[
   ['Full transparency','Management tells the group all it knows: finances, progress on goals, failures, and any planned changes in structure, even if it causes anxiety.'],
   ['Managers as equal participants','The planners and consultant lead. Each manager is one voice among many. A veto is hard to use without cries of manipulation.'],
   ['A full cross-section','Every level, support staff and closely linked units are in the room.'],
   ['A level playing field','Status, title and function fade. Mixed teams work as equals.'],
   ['Ready to speak up','Employees set aside caution and cynicism for a couple of days. It is not a complaint session; everyone has answers and questions.'],
   ['Choosing to take part','Those who opt out give up the right to complain later that they weren’t part of it.'],
   ['Future focus','Some talk about obstacles, but more about what people want to create together.'],
   ['Agreed next steps','The session ends with next steps and who will work on them. Management lets them emerge.'],
   ['No expert consultant','The consultant stops analyzing and recommending, and guides people through participatory steps. Less central, less visible.']],
   'Each condition moves the organization toward self-governing. That is the method’s power and its limit: managers can’t share power and then pull back when nervous.');}},
{part:3,src:'Chapter 11 · Trusting the Process',run(L){
  L.h(L.kick('ex','Copperleaf: Jordan sketches an option')+'<h1 class="q">Jordan drafts what a whole-system session on damaged deliveries would need</h1>');
  L.beats(L.card,[
   ['The idea','Two days, about eighty people, in the DC training hall. Jordan puts it to Marcus as one option, alongside a third-party study.'],
   ['Design team','Jordan, Kofi, a day-shift supervisor, a driver and someone from customer service. They plan who comes and what happens, not the answer.'],
   ['Who’s in the room','Packers and loaders from both shifts, supervisors, drivers, customer service, and Marcus at a table like everyone else.'],
   ['What gets shared','The full complaint data, which the floor has never seen, and Lena’s pressure on the DC, stated openly.'],
   ['The hard part','Marcus would have to sit as one voice among many, and let next steps come out of the room rather than Marcus’s office.']],
   'The design is only half of it. A whole-system session works only if Marcus is willing to live by the conditions too.');}},
{part:3,src:'Chapter 11 · Trusting the Process',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Marcus likes the idea but says: “I’ll open with a 45-minute talk on my packing plan, then they can discuss it.” Which condition does that break?</h1>');
  L.mc(L.card,['Choosing to take part','Managers as equal participants','A full cross-section'],1,
   'Right. Opening with the boss’s plan makes the boss’s ideas count for more than anyone else’s. In a whole-system session Marcus is one voice among many.',
   'The room can still be full and people can still choose to come. The problem is Marcus’s plan coming first and weighing more.');}},
{part:3,src:'Chapter 11 · Trusting the Process',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which condition is broken?',['Full transparency','A full cross-section','A level playing field','Future focus','No expert consultant'],[
   ['Marcus decides to keep the complaint figures out of the session. “They’ll only panic.”',0,'Management must share all it knows, even when it creates anxiety.'],
   ['Only supervisors and team leads are invited, “to keep it manageable”.',1,'Every level must be there, not just the ones with titles.'],
   ['Teams are grouped by job title, and supervisors present their table’s ideas.',2,'Mixed teams of equals. Status and title should fade.'],
   ['Day one is spent listing every past failure and who caused it.',3,'Some talk of obstacles is fine, but the weight is on what people want to create.'],
   ['Jordan plans to present their own analysis and recommend the fix on day two.',4,'In whole-system work the consultant gives up the expert role and guides the process.']]);}},
{part:3,src:'Chapter 11 · Trusting the Process',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Tap each part until the sentence describes Jordan’s role in a whole-system session.</h1>');
  L.sentence(L.card,[['analyze the data','design the process'],['and recommend a fix','and guide people through it'],['as the visible expert','while staying in the background']],[1,1,1],
   [['Analyzing the data is the third-party role. Here the group does it.'],['Recommending the answer is the expert role Jordan gives up.'],['The consultant becomes less central and less visible.']],
   'Jordan designs the process, guides people through it and stays in the background. The answer belongs to the people who will carry it out.');}},
{part:3,src:'Chapter 11 · The Payoff',run(L){
  L.h(L.kick('learn','The payoff')+'<h1 class="q">The organization learns to manage itself</h1>'+
   L.prose('Block admits a leaning toward whole-system work whenever the conditions are right. Its edge over a third-party stance: it <b>builds the organization’s own capacity</b> to manage itself in the future.')+
   L.prose('It also changes the consultant’s job into an educational one, with new skills:')+
   L.list([['pencil','Design learning experiences','for other people, not reports about them.'],
     ['people','Convene','Bring the right people together.'],
     ['compass','Help people question and imagine','Look hard at today and picture the future.'],
     ['scale','Confront through activities','Face people with their freedom and responsibility through the design of the session, rather than face to face.']],3));
  L.done();}},
{part:3,src:'Chapter 11 · Trusting the Process',pts:1,run(L){
  L.h(L.kick('pr','The moment of doubt')+'<h1 class="q">Suppose the session went ahead. On day two, a mixed team proposes that the floor see complaint data every week. Marcus whispers to Jordan: “I’ll just quietly drop that one.” What should Jordan say?</h1>');
  L.mc(L.card,['“Fine, nobody needs to know it was dropped.”','“Let’s agree a smaller version privately.”','“If you pull back now, the whole session loses trust.”'],2,
   'Right. Managers can’t start sharing power and then take it back at a nervous moment. Saying so plainly is also Jordan being authentic.',
   'Quietly dropping or reshaping the proposal behind the room’s back is exactly the pull-back Block warns against. It turns the session into manipulation.');}}
  ]
});
</script>
</body>
</html>
