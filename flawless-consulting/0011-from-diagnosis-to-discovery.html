<script>
Course.lesson({
  id:'0011', title:'From diagnosis to discovery', minutes:20, icon:'compass',
  goals:['Explain why discovery beats diagnosis when people have to change','Run discovery for action, not research, focused on what the client controls','Redefine a presenting problem and describe how it is being managed'],
  parts:['Not a doctor','Action, not research','The problem isn’t the problem','How it’s managed'],
  read:'Read chapter 10 of the book for the full staff-turnover story and the Discovery Model.',
  glossary:{
    'medical-model':'Medical model: treating consulting like a doctor’s visit. The consultant diagnoses what is wrong, predicts what will happen and prescribes a cure.',
    discovery:'Discovery: the phase where consultant and client build a fresh picture of what is going on, in a way that leads the client to own it and act.',
    'asset-based':'Asset-based (or strength-based) approach: looking at what already works, the strengths and gifts, and building on them, instead of hunting for what is wrong.',
    'action-approach':'Action approach: discovery aimed at getting the client to act, not at complete understanding. It focuses on what the client controls.',
    'underlying-problem':'Underlying problem: the real cause behind the pain, which the client’s first explanation missed.',
    'language-of-innocence':'Language of innocence: explaining a problem with causes nobody here is responsible for, so it is “not our fault”.'
  },
  cheatsheet:[
    'Discovery has two jobs: a <b>fresh view</b> of what is going on, and a process that builds <b>client commitment</b>. Aim to be effective, not right.',
    'The <b>medical model</b> (diagnose, prescribe, leave) fails in human systems. Clients can outsource the study, never the doing.',
    'There are no purely technical problems. People run the machines, and politics is always in the room.',
    '<b>Action approach</b>: narrow to what the client controls, use everyday words, involve the client at every step, treat how the group works as real data.',
    'Never accept the <b>presenting problem</b> as the real one. If the client’s explanation were right, their fix would have worked.',
    'Good discovery moves from the <b>language of innocence</b> (“not our fault”) to <b>accountability</b> (“this is in our hands”).',
    'Every picture covers the <b>technical or business problem</b> and <b>how it is being managed</b>. At least one section on the second, no recommendations needed.',
    'How the client manages you is a sample of how they manage everyone else.'
  ],
  steps:[
/* ---------- PART 1: NOT A DOCTOR ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">A family car keeps breaking down because three people drive it in very different ways. A mechanic replaces the worn part. Will the fix last?</h1>');
  L.mc(L.card,['Yes, the new part solves it for good','Probably not, the driving hasn’t changed'],1,
   'Right. The part was a symptom. The cause is how people use the car, and no mechanic can swap that out. This lesson is about that gap.',
   'The part wore out because of how the car is driven. Nothing about the driving changed, so the new part will likely wear out too.');}},
{part:0,src:'Chapter 10 · From Diagnosis to Discovery',run(L){
  L.h(L.kick('learn','Two jobs for discovery')+'<h1 class="q">Discovery is not about being right</h1>'+
   L.prose('Once the contract is clear, the work moves to '+L.g('discovery','discovery')+' (the course calls this phase “discovery and dialogue”). It has two jobs: find a <b>fresh, independent way</b> of seeing what is going on, and run a process that leads the '+L.g('client','client')+' to <b>commit, own it and act</b>.')+
   L.quote('…not to be right but to be effective and powerful.','Peter Block, on the goal of discovery')+
   L.prose('Most clients expect something else: the '+L.g('medical-model','medical model')+'.')+
   L.flow([['eye','Diagnose','Find what is wrong','consultant alone'],['trend','Prognosis','Say what will happen','consultant alone'],['pencil','Prescribe','Hand over the cure','client swallows it']])+
   L.note('A newer way of thinking looks at what <i>works</i> instead of what is wrong: an '+L.g('asset-based','asset-based')+' approach. Block leans that way, but supports both paths. When a problem is specific and technical, a direct technical answer is exactly right.','compass'));
  L.done();}},
{part:0,src:'Chapter 10 · It Is Still the Relationship That Counts',run(L){
  L.h(L.kick('learn','What clients want vs what helps')+'<h1 class="q">Clients want a pill. Lasting change needs more.</h1>'+
   L.prose('When we feel ill, we want a doctor to hand us a pill. If the doctor says “change your diet and exercise more”, that is not what we came to hear. Managers are the same. Their first questions are usually:')+
   L.list([['clock','How long will it take?',''],['scale','How much will it cost?',''],['shield','What causes the least disruption?','']],3)+
   L.prose('Give them exactly that, and you may not serve them. Tell them it will take longer, cost more and need their time, and you may lose them. This tension runs through every step, not just contracting.')+
   L.note('The key point: a client can hand the <b>study</b> to an outsider. Putting a solution in place and keeping it going they <b>always do themselves</b>. That is why the relationship still counts in discovery.','people'));
  L.done();}},
{part:0,src:'Chapter 10 · It Is Still the Relationship That Counts',run(L){
  L.h(L.kick('ex','Copperleaf: two ways to start')+'<h1 class="q">Jordan is about to begin discovery on the damaged deliveries. Step through both paths.</h1>');
  L.beats(L.card,[
   ['The request','Marcus wants a training course for “careless packers”, fast, and without taking the supervisors’ time. Complaints about broken furniture have doubled.'],
   ['Path 1 · The doctor','Jordan studies the DC alone for three weeks, writes a sharp report and prescribes training plus a new packing checklist.'],
   ['What follows','Marcus agrees with every page. Then the report goes on a shelf next to the one an outside firm wrote two years ago. Nothing on the floor changes.'],
   ['Path 2 · The guide','Jordan asks Marcus to help decide where to look, shares early findings as they come, and asks what Marcus makes of them.'],
   ['What follows','The picture is slower to build, but it is partly Marcus’s own. When it is done, Marcus is already halfway to acting on it.']],
   'Block’s point: a correct report that nobody acts on is a failed discovery. Treat discovery as a <b>process you guide</b>, not a <b>diagnosis you deliver</b>.');}},
{part:0,src:'Chapter 10 · It Is Still the Relationship That Counts',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Marcus says: “How long will it take, what will it cost, and don’t disrupt my floor.” What is Marcus really asking for?</h1>');
  L.mc(L.card,['A long study of every possible cause','A shared process that needs Marcus’s time','A quick, cheap and painless prescription'],2,
   'Yes. These are the classic first questions of a client who wants a turnkey answer, a pill to swallow.',
   'Marcus wants the opposite of involvement or a long study. Marcus wants the cure handed over: quick, cheap and painless.');}},
{part:0,src:'Chapter 10 · From Diagnosis to Discovery',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Doctor or guide?',['Doctor (diagnosis)','Guide (discovery)'],[
   ['Jordan plans to watch the packing line alone and hand Marcus a list of fixes.',0,'Studying alone and handing over a cure is the medical model.'],
   ['Jordan invites Marcus to two of the floor visits and asks what stands out to them.',1,'Involving the client in looking builds ownership of what is found.'],
   ['Jordan tells Marcus: “Leave it with me. I’ll find what’s wrong and tell you what to do.”',0,'That makes Jordan the doctor and Marcus a passive patient.'],
   ['Jordan asks the supervisors to help make sense of the complaint figures.',1,'The people who must act help interpret the data. That is discovery.'],
   ['Jordan assumes a better packing method will cure the damage on its own.',0,'That is the belief that a living system can be engineered, the heart of the medical model.']]);}},

/* ---------- PART 2: ACTION, NOT RESEARCH ---------- */
{part:1,src:'Chapter 10 · The Call to Action',run(L){
  L.h(L.kick('learn','No purely technical problems')+'<h1 class="q">Even a generator comes with family politics</h1>'+
   L.prose('Block’s example: you hire a contractor to install a backup generator at home. Sounds technical. But what size? Where does it go? Who will run and maintain it? How much does instant power matter to the family? And hardest of all: <b>does the family agree</b> on any of this?')+
   L.prose('Architects and builders say the same. Building the house they know how to do. The hard part is client doubts and family dynamics.')+
   L.note('If that is true for a family, it is bigger in an organization. Politics is always present. Machines and software mostly break because <b>people</b> run them, maintain them and ask them to do things they weren’t built for.','alert'));
  L.done();}},
{part:1,src:'Chapter 10 · The Call to Action',run(L){
  L.h(L.kick('learn','Research vs action')+'<h1 class="q">The purpose of discovery is action, not understanding</h1>'+
   L.prose('Research is happy just to understand. Discovery exists to get the organization to act. Block contrasts the two (and admits the contrast is a bit exaggerated):')+
   L.list([['All factors → what the client controls','Research looks at everything. Action looks at causes the client can actually change.'],
     ['Complete → enough','Research must be complete. For action, completeness can swamp the client at decision time.'],
     ['Alone → with the client','Research can be done alone. Action needs the client involved at each stage.'],
     ['No bias → judgment','Research removes intuition. In action, your feelings and hunches are what you are paid for: judgment.'],
     ['Neutral → cares','Research doesn’t mind how the client feels about results. Action cares deeply.']],2)+
   '<p class="small" style="margin-top:10px">The '+L.g('action-approach','action approach')+' assumes the client’s readiness to accept your input matters as much as your analysis.</p>');
  L.done();}},
{part:1,src:'Chapter 10 · The Call to Action',run(L){
  L.h(L.kick('learn','Four things beyond the technical')+'<h1 class="q">What an action approach asks of you</h1>'+
   L.prose('Your technical skill is taken for granted. On top of it, Block asks for four things:')+
   L.list([['target','Keep narrowing','Focus more and more on the client’s next steps and what is under their control.'],
     ['chat','Everyday language','Words should help information move, not block it.'],
     ['people','Tend the relationship','Include the client in every choice about how to proceed. Deal with resistance as it comes up, even if it won’t change your results.'],
     ['layers','Count how the group works','Treat data on how the organization functions as valid. Look at how the group you work with is managed.']],1));
  L.done();}},
{part:1,src:'Chapter 10 · The Call to Action',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">Jordan rewrites a discovery plan from research to action</h1>');
  L.beats(L.card,[
   ['First draft','Study <i>every</i> cause of damage: truck suspensions, road works, supplier boxes, weather, customer handling. Forty pages of method. Only hard data. Jordan works alone.'],
   ['Narrow','Jordan cuts it to causes the DC can change: how items are packed, loaded and checked, and how shifts run.'],
   ['Plain words','“Damage incidence variance by shift” becomes “which shifts send out more broken items”.'],
   ['Involve','Jordan asks Marcus to pick two areas to look at first, and plans a short check-in each week.'],
   ['Count it all','Jordan adds a section on how the floor is run, and keeps notes on their own hunches. That is judgment, not bias.']],
   'Same expertise, different aim: the plan is now built to end in something Marcus will <b>do</b>.');}},
{part:1,src:'Chapter 10 · The Call to Action',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Jordan learns that road works on the highway jolt the trucks. Under the action approach, how much weight should it get?</h1>');
  L.mc(L.card,['Plenty, since every cause has to be listed','Little, since the DC can’t change the road','The same weight as every other cause'],1,
   'Right. Discovery for action focuses on factors the client controls and that affect the situation.',
   'Listing everything equally is the research approach. For action, focus on what Marcus can change. The road isn’t one of those.');}},
{part:1,src:'Chapter 10 · The Call to Action',pts:6,run(L){
  L.h(L.kick('pr','Sort the habits')+'<h1 class="q">Is Jordan acting like a researcher or doing discovery for action?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Research','Action'],[
   ['Jordan won’t share anything until every cause is listed.',0,'Insisting on completeness first is research. It also leaves the client out.'],
   ['Jordan shares early findings each week and asks Marcus what they make of them.',1,'Involving the client at each stage is the action approach.'],
   ['Jordan drops a hunch about the loading rush because it isn’t hard data.',0,'In action, hunches count. They are your judgment.'],
   ['Jordan doesn’t care how Marcus feels about the results, as long as they’re accurate.',0,'Research is neutral about the client’s reaction. Action cares deeply.'],
   ['Jordan leaves the carrier’s truck design out of scope; the DC can’t change it.',1,'Narrowing to what the client controls is the action approach.'],
   ['Jordan notices Marcus tense up at the findings and plans the next talk around it.',1,'Caring about the client’s attitude to the outcome is part of action.']],
   'Research aims to understand. Discovery aims to get the client to act, so it stays narrow, shared and alert to how the client feels.');}},
{part:1,src:'Chapter 10 · The Call to Action',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which of the four is Jordan missing?',['Narrow to what they control','Everyday language','Tend the relationship','Count how the group works'],[
   ['Jordan’s draft says “inter-shift variance in damage incidence is non-trivial.”',1,'Say it the way Marcus would: some shifts break more items than others.'],
   ['Jordan decides the next steps alone and tells Marcus afterward.',2,'Include the client in every choice about how to proceed.'],
   ['Supervisors say Marcus moves their schedules at short notice. Jordan leaves it out: “That isn’t packing.”',3,'How the group is managed is valid data, not gossip.'],
   ['Jordan’s next steps include renegotiating the national carrier contract.',0,'That is far outside what Marcus controls. Narrow to steps Marcus can take.'],
   ['Marcus grumbles about the interviews. Jordan ignores it because it won’t change the numbers.',2,'Deal with resistance as it arises, even if it doesn’t touch your results.']]);}},

/* ---------- PART 3: THE PROBLEM ISN’T THE PROBLEM ---------- */
{part:2,src:'Chapter 10 · The Problem Is Not the Problem',run(L){
  L.h(L.kick('learn','The presenting problem')+'<h1 class="q">If the client’s explanation were right, you wouldn’t be there</h1>'+
   L.prose('Projects usually start with pain: people leaving, output down, deliveries late. Managers then explain to themselves why it hurts. When their explanation is right, their fix usually works.')+
   L.flow([['flame','Pain','Something hurts'],['bulb','Explanation','The manager names a cause'],['x','Fix fails','So a consultant is called']])+
   L.prose('So if you have been called in, the manager’s explanation was probably <b>incomplete</b>. Their first description is the '+L.g('presenting-problem','presenting problem')+'. Block never accepts it as the real problem without doing his own discovery.')+
   L.note('One of the most useful things a consultant gives a client is a <b>redefinition of the problem</b>: the '+L.g('underlying-problem','underlying problem')+'.','pencil'));
  L.done();}},
{part:2,src:'Chapter 10 · The Problem Is Not the Problem',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">A company keeps losing new hires after two or three years</h1>');
  L.beats(L.card,[
   ['The pain','A large technical company trains young employees, who then leave just as they become valuable.'],
   ['The explanation','Supervisors blame three things: low pay for the area, scarce and costly housing, and young people who want too much too soon.'],
   ['The fix','Management adjusts pay, opens a housing help desk and runs workshops on career realities.'],
   ['Eighteen months later','Turnover hasn’t dropped. In some sections it is higher.'],
   ['Discovery','Internal consultants interview supervisors and new hires. New hires get no real responsibility for almost a year and no honest feedback. Supervisors are too pressured to spend time with them.'],
   ['The new fix','Supervisors and new hires agree how much time they’ll spend together, what work they’ll do and when feedback comes. Turnover levels off, then starts to fall.']],
   'The causes moved from things nobody owned (pay, housing, “kids these days”) to things management could change: how new people are brought in and treated.');}},
{part:2,src:'Chapter 10 · The Problem Is Not the Problem',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">In the turnover story, what made the new explanation more useful than the old one?</h1>');
  L.mc(L.card,['It came from a larger set of hard data','It put the causes in management’s own hands','It moved the blame onto the supervisors'],1,
   'Yes. Block calls this the essence of discovery: moving from the '+L.g('language-of-innocence','language of innocence')+' (“not our fault”) to accountability (“this is in our hands”).',
   'The point wasn’t more data or a new target for blame. The new causes were things management itself could change, so they could finally act.');}},
{part:2,src:'Chapter 10 · The Problem Is Not the Problem',pts:1,
 solve:async L=>{L.$('#go').click();},
 run(L){
  const F=[['Day-shift supervisors are pushed hard by Marcus on loading speed.','trend'],['Nobody on the floor ever sees the customer complaint data.','eye'],['Marcus often overrides the supervisors’ schedules at short notice.','cal'],['Kofi’s night shift, which has the fewest damaged orders, runs a two-minute pack-check huddle that nobody asked for.','star']];
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Jordan has spent two weeks on the floor and talked with supervisors on both shifts. Compare Marcus’s explanation with what Jordan found.</h1>'+
   L.lanes([['person','Marcus’s explanation','“My packers are careless. Train them.”<div class="res small">Cause: the packers. Marcus’s part: none.</div>',4],
            ['compass','What discovery found','<div id="ff" class="small">Not shown yet.</div>',2]])+
   '<button class="btn pri" id="go" style="margin-top:14px">'+L.ic('play')+'Show Jordan’s findings</button><div id="hq"></div>');
  L.$('#go').onclick=function(){this.remove();
    L.$('#ff').innerHTML=F.map(f=>'<div style="display:flex;gap:6px;margin:6px 0">'+L.ic(f[1])+'<span>'+f[0]+'</span></div>').join('');
    const q=L.$('#hq');q.innerHTML='<h2 class="sub">Why is Jordan’s picture more useful to Marcus than “careless packers”?</h2>';
    L.mc(q,['It proves the packers aren’t to blame','It has far more data behind it','It points to things Marcus can change'],2,
     'Right. Speed pressure, hidden complaint data and last-minute overrides are all in Marcus’s hands, and Kofi’s huddle shows something that already works. That is the move from innocence to accountability.',
     'The packers may still matter, and more data isn’t the point. What makes the picture useful is that it names causes Marcus can act on.');};}},
{part:2,src:'Chapter 10 · The Problem Is Not the Problem',pts:6,run(L){
  L.h(L.kick('pr','Innocence or accountability?')+'<h1 class="q">People at the DC explain the damage. Which language is each one using?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Innocence','Accountability'],[
   ['“Customers are just pickier than they used to be.”',0,'A cause nobody at the DC owns. Nothing to act on.'],
   ['“We push loading speed so hard that checks get skipped.”',1,'This names something the DC does and could change.'],
   ['“The new sofa boxes are flimsy. Talk to the supplier.”',0,'It puts the cause outside the DC, so the DC has nothing to do.'],
   ['“Nobody on the floor ever sees the complaint numbers we get.”',1,'Sharing information is fully in management’s hands.'],
   ['“Young packers today just don’t care.”',0,'Like “kids want too much too soon” in the book’s story: not our fault.'],
   ['Marcus: “When I move people between shifts at the last minute, teams lose their rhythm.”',1,'Marcus names their own part. That is real accountability.']],
   'Innocence explains the pain with causes nobody here owns. Accountability names what we are doing, so we can do something different.');}},

/* ---------- PART 4: HOW IT’S MANAGED ---------- */
{part:3,src:'Chapter 10 · The Call to Action',run(L){
  L.h(L.kick('learn','The Discovery Model')+'<h1 class="q">Every picture has two halves</h1>'+
   L.tiers([['chat','The client gives you a presenting problem','“My packers are careless.”'],
            ['pencil','You redefine the problem or its cause','Not just the packers. Look wider.'],
            ['eye','You build a clear and simple picture','Short enough for Marcus to take in.'],
            ['layers','It describes the technical or business problem…','…and '+L.g('how-managed','how that problem is being managed'),'attitudes, the manager’s style, politics, and the strengths and possibilities around it',true,'Both halves'],
            ['arrow','This leads to recommendations','Next steps for the business problem and for how the group manages itself.']])+
   '<p class="small" style="margin-top:10px">The same model works when you are looking for strengths and possibilities instead of problems.</p>');
  L.done();}},
{part:3,src:'Chapter 10 · How the Problem Is Being Managed',run(L){
  L.h(L.kick('learn','The half we talk about at the coffee machine')+'<h1 class="q">Why consultants skip how the problem is managed, and why that’s a mistake</h1>'+
   L.prose('Consultants usually see the client’s style and the politics. But we feel we were hired for a business problem, not to comment on the organization. So we discuss it only in hallways, at breaks and over dinner, never in the report.')+
   L.lanes([['box','Technical or business problem','How items are padded, packed and loaded. The presenting problem is almost always about this half.',1],
            ['people','How it’s being managed','Speed pressure from the top, data that never reaches the floor, plans overridden at short notice.',3]])+
   L.note('Raising the second half is riskier for an internal consultant: “I didn’t ask you to comment on my style.” But skip it, and your technical recommendations get bent and only half used, because the group struggles to talk, trust and manage itself.','alert'));
  L.done();}},
{part:3,src:'Chapter 10 · Flawless Discovery',run(L){
  L.h(L.kick('learn','Flawless discovery')+'<h1 class="q">Make the management side a regular part of the job</h1>'+
   L.prose('To consult '+L.g('flawless','flawlessly')+', every assessment has <b>at least one section</b> on how the problem is being managed. It only needs a clear, simple picture. It doesn’t need specific recommendations.')+
   L.prose('The fear of raising it lives mostly in the consultant. Line managers usually <i>want</i> feedback on how they’re doing and rarely get it, because their own people are reluctant to give it. You are in a special position to provide it. The one caution: do it in a supportive, non-punishing way.')+
   L.list([['Ask about the client’s own part','What is the client doing that causes or keeps the problem going?'],
     ['Ask about others’ part','What are others in the organization doing that feeds it?'],
     ['Involve the client in interpreting','Make sense of the data together.'],
     ['Notice how they manage you','It mirrors how they manage their own people.']],4));
  L.done();}},
{part:3,src:'Chapter 10 · Flawless Discovery',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Jordan’s report on damaged deliveries is nearly done. What does flawless discovery require of it?</h1>');
  L.mc(L.card,['A section on how the problem is being managed','A recommendation for every management issue','Leaving management out, since Marcus didn’t ask'],0,
   'Right. At least one section with a clear, simple picture of how it is being managed. Recommendations on it are optional.',
   'Block asks for at least one section that pictures how the problem is managed. It needs no recommendations, and leaving it out lets the technical fixes get bent.');}},
{part:3,src:'Chapter 10 · The Call to Action',pts:1,run(L){
  L.h(L.kick('pr','Put it in order')+'<h1 class="q">Put Jordan’s path through the Discovery Model in order.</h1><div id="od"></div>');
  L.order(L.$('#od'),['Marcus describes the pain: careless packers','Jordan looks wider and redefines the cause','Jordan builds a clear, simple picture','The picture covers packing and how the DC is run','Jordan and Marcus agree next steps on both'],
   'That is the Discovery Model: presenting problem, redefinition, a simple picture with both halves, then next steps.');}},
{part:3,src:'Chapter 10 · How the Problem Is Being Managed',pts:6,run(L){
  L.h(L.kick('pr','Which half?')+'<h1 class="q">Sort Jordan’s notes. Is each one about the business problem, or how it is being managed?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Business problem','How it’s managed'],[
   ['Glass-top tables are packed without corner guards.',0,'A technical fact about packing.'],
   ['Supervisors say they’ve stopped raising problems because Marcus “already has the answer”.',1,'That is about the manager’s style and how people talk.'],
   ['Heavy items are loaded on top of light ones on the 6 a.m. trucks.',0,'A technical fact about loading.'],
   ['Complaint reports go to Marcus’s inbox and stop there.',1,'Who gets information is a management choice.'],
   ['Day shift is told speed counts, yet nobody is ever praised for care.',1,'What the boss rewards is part of how the problem is managed.'],
   ['Damage is highest on sofas over 40 kilograms.',0,'A business fact about where the damage happens.']],
   'Both halves belong in the picture. Leave out the second and the packing fixes get bent by the same habits that caused the damage.');}},
{part:3,src:'Chapter 10 · Flawless Discovery',pts:1,run(L){
  L.h(L.kick('pr','Your experience is data')+'<h1 class="q">Marcus has moved Jordan’s check-ins three times at an hour’s notice, and twice decided next steps before Jordan arrived. What should Jordan make of this?</h1>');
  L.mc(L.card,['It’s a personal snub, best kept out of the work','It’s just a busy director, so it means nothing','It may mirror how Marcus manages the floor'],2,
   'Yes. Block’s checklist says to notice how the client manages you, because it is often how they manage their own people. It matches the supervisors’ story about last-minute overrides.',
   'Don’t take it personally or wave it away. How a client manages you is a sample of how they manage everyone. Here it matches what supervisors said.');}}
  ]
});
</script>
</body>
</html>
