<title>The Elements of Engagement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">

<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0018', title:'The elements of engagement', minutes:20, icon:'chat',
  goals:['Design a gathering that is itself a sample of the change you want','Use the eight ways to engage in a real implementation meeting','Tell a freely made commitment from a bargain'],
  parts:['The message','Open the room','Doubt and creation','Choose and close'],
  read:'Read chapter 17 of the book for the eight ways to engage in full, and Checklists 9 and 10 for preparing and reviewing an implementation event.',
  glossary:{
    'level-field':'Level playing field: opening a gathering by telling everyone the whole story, including weaknesses and failures, so nobody knows more than the rest.',
    'peer-accountability':'Peer accountability: being answerable first to the colleagues who live with your work, and only then to your boss.',
    'barter':'Barter: a promise that depends on what someone else does in return. Block says that is a contract, not a commitment.',
    'old-conversation':'Old conversation: the familiar, safe way of naming a problem that people can defend, and that leads to the same old actions.'
  },
  cheatsheet:[
    '<b>The meeting is the message.</b> People judge a change by how the gathering about it is run. Make each event a sample of the destination.',
    'Open with a <b>transparent purpose and a level playing field</b>: the whole story, failures included, short and from the heart. No sponsor who blesses and leaves.',
    '<b>Renegotiate participation</b> early, and <b>rearrange the room</b>. There is no right layout; what matters is that people shape the structure to the task.',
    'Make a <b>platform for openness and doubt</b>. Expressing doubt counts, not resolving it. If people can’t say no, their yes means nothing.',
    'Ask <b>“What do we want to create together?”</b> Together means crossing boundaries, not a list of things each group does alone.',
    '<b>Create a new conversation.</b> Old conversations are safe and breed cynicism.',
    '<b>Choose commitment and accountability</b>: to peers first, and without barter. Then close by <b>focusing on gifts</b>.',
    'People commit through emotion, relatedness and choice. Redistribute power in <b>how we live</b>, not just in how we decide.'
  ],
  steps:[
/* ---------- PART 1: THE MESSAGE ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Marcus wants to tell day shift: “From now on, you’ll have more say in how we pack.” Marcus plans to do it in a 40-minute slide talk from a stage. Will the floor believe it?</h1>');
  L.mc(L.card,['Probably not: the talk itself gives them no say','Probably yes, if the slides make it clear'],0,
   'People judge a promise by how it is delivered. A one-way talk about having more say contradicts itself.',
   'Clear slides don’t fix the mismatch. The floor sits silently while being told they’ll have more say. They believe what they experience.');}},
{part:0,src:'Chapter 17 · The Elements of Engagement',run(L){
  L.h(L.kick('learn','Same spirit, new phase')+'<h1 class="q">What built commitment with the client now builds it across the system</h1>'+
   L.prose('Engagement has power whatever the content of the recommendations. Without a different kind of interaction in the client system, even the best decision won’t be acted on. Block suggests using the same principles you used with your client:')+
   L.flow([['chat','Contracting','Understand the problem, state wants, explore control and vulnerability, give support','',1],
           ['eye','Discovery','Treat each talk as learning, ask what the client is doing, describe without judging','',2],
           ['people','Implementation','Design every gathering for engagement, real choice and open doubt','',3]])+
   '<p class="small" style="margin-top:10px">One powerful service you can offer: help clients see how much engagement matters for implementation.</p>');
  L.done();}},
{part:0,src:'Chapter 17 · The Meeting Is the Message',run(L){
  L.h(L.kick('learn','The meeting is the message')+'<h1 class="q">How you gather is the sample people use to judge the whole change</h1>'+
   L.prose('In the end, implementation comes down to one thing: will people at several levels take responsibility for making the change succeed?')+
   L.prose('You can announce more choice and involvement. But if the meeting that announces it doesn’t itself give choice and involvement, the promise has little credibility. The tone and structure of how we come together are what people sample.')+
   L.note('So each event must be a <b>sample of the destination</b>. A meeting about new measures for a call center should itself put real choice on the table and handle hard questions in public.','eye'));
  L.done();}},
{part:0,src:'Chapter 17 · The Meeting Is the Message',run(L){
  L.h(L.kick('ex','Copperleaf')+'<h1 class="q">Marcus drafts the day-shift kickoff</h1>');
  L.beats(L.card,[
   ['The aim','Marcus wants to take what the pilot learned to the whole day shift. Jordan is helping plan the kickoff gathering.'],
   ['The draft','Lena opens for five minutes, then leaves. Marcus presents 40 minutes of slides from the front. Five minutes for questions at the end.'],
   ['The room','Rows of chairs facing a screen, supervisors in the front row.'],
   ['Jordan reads it','The agenda says “you watch, we talk”. The seating says “bosses up front”. Both contradict the message that the floor will have more say.'],
   ['The question','Jordan asks Marcus: “If someone filmed this meeting, would it look like the DC you want?”']],
   'Before the content, check what the design of the gathering says. People will believe the design.');}},
{part:0,src:'Chapter 17 · The Meeting Is the Message',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Renata is planning a session to explain the scheduling tool to store managers. What does “the meeting is the message” ask of it?</h1>');
  L.mc(L.card,['Have the clearest possible slides about the tool','Run it the way you hope the tool will be used'],1,
   'If the tool is meant to give managers more say over schedules, the session about it should give them real say too.',
   'Clarity helps, but people judge credibility by how the meeting itself works. It must be a sample of the change.');}},

/* ---------- PART 2: OPEN THE ROOM ---------- */
{part:1,src:'Chapter 17 · Eight Ways to Engage',run(L){
  L.h(L.kick('learn','Eight ways to engage')+'<h1 class="q">Easy to list, harder to practice</h1>'+
   L.list([['Open with transparent purpose and a level playing field',''],['Renegotiate expectations about participation',''],['Rearrange the room',''],['Create a platform for openness and doubt',''],
           ['Ask, “What do we want to create together?”',''],['Create a new conversation',''],['Choose commitment and accountability',''],['Focus on gifts','']],1)+
   '<p class="small" style="margin-top:10px">Block calls them a menu or a starting point, not a fixed series of steps. They work in any setting, whatever people expect when they walk in.</p>');
  L.done();}},
{part:1,src:'Chapter 17 · Open with Transparent Purpose and a Level Playing Field',run(L){
  L.h(L.kick('learn','Way 1 · Transparent purpose, level playing field')+'<h1 class="q">Tell the whole story, including what went wrong</h1>'+
   L.prose('Open by saying what concerns started this, where the change effort stands now, what the organization needs from this group right now, and how this session will run.')+
   L.prose('The key is the <b>whole</b> story, weaknesses and failures included. Don’t hide bad news to spare people anxiety; anxiety is normal and best handled in daylight. Keep it short and informal, more from the heart than the head. That is a '+L.g('level-field','level playing field')+'.')+
   L.note('<b>Skip the blessing.</b> A sponsor who shows up, says they are committed, then leaves sends the opposite message. Block calls it regal and patronizing to those who stay.','alert'));
  L.done();}},
{part:1,src:'Chapter 17 · Open with Transparent Purpose and a Level Playing Field',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Lena offers: “I’ll open with five upbeat minutes on why this matters, then I have to dash.” What should Jordan suggest?</h1>');
  L.mc(L.card,['Accept: a VP opening shows the floor it matters','Ask Lena to stay for all of it, or skip the opening','Ask Lena to send a recorded video message instead'],1,
   'A sponsor who blesses the session and leaves demeans it. If Lena can’t be part of the whole thing, no motivational opening is needed.',
   'Whether live or on video, a pep talk from someone who won’t take part is exactly what Block says isn’t needed. Lena should stay, or not open it.');}},
{part:1,src:'Chapter 17 · Renegotiate Expectations About Participation',run(L){
  L.h(L.kick('learn','Way 2 · Renegotiate participation')+'<h1 class="q">Break the deal where the front talks and the room watches</h1>'+
   L.prose('Most changes begin with someone at the front presenting goals, strategy and measures, sometimes for hours. When people look confused, the habit is to say it again, louder.')+
   L.prose('Participants play along. We arrive expecting something to happen <i>to</i> us, and the evaluation forms only ask how well the leaders did. Block recalls a bar band that introduced themselves, then named the crowd as “the audience”, giving them a job in the performance too.')+
   L.lanes([['alert','The passive contract','Leaders present, participants consume and rate the show.',3],
            ['people','Renegotiated early','Participation is the point. Expect more questions, some irritation, side conversations: signs of life.',2]]));
  L.done();}},
{part:1,src:'Chapter 17 · Rearrange the Room',run(L){
  L.h(L.kick('learn','Way 3 · Rearrange the room')+'<h1 class="q">The chairs announce your intentions</h1>'+
   L.prose('A circle, a round table if you need tables, no clear front or podium: from the first minute, that says participation among peers matters.')+
   L.prose('Why fuss over chairs? Because these small acts carry the message about the culture you have in mind. Change the room and how you inhabit it, and you can start to change the institution the same way.')+
   L.note('<b>But there is no right layout.</b> Rows, circles, a stage: all can work. What matters is that everyone is engaged in adapting the structure to the task at hand.','home'));
  L.done();}},
{part:1,src:'Chapter 17 · Rearrange the Room',pts:1,
 solve:async L=>{const c=L.$('#pp').children;for(let i=0;i<c.length;i++)c[i].click();},
 run(L){
  const P=[['list','Rows facing a screen','Marcus at the front, supervisors in row one, packers behind.','Says: “The front talks, you listen.” Questions come only from the brave.'],
    ['cycle','One big circle','Thirty chairs in a ring in the training hall, no front.','Says: “Everyone here is a peer.” It feels strange at first; more people speak.'],
    ['people','Crew tables','Mixed tables of packers, a driver and a supervisor.','Says: “Talk across your usual lines.” Good for working on a shared question.'],
    ['compass','The group adjusts it','Jordan explains the task; people move chairs as the work changes.','Says: “You shape how we work.” The structure follows the task, and people own it.']];
  const seen=new Set();
  L.h(L.kick('pr','Toggle and compare')+'<h1 class="q">Jordan sketches four layouts for the day-shift kickoff. Try each one and see what it says.</h1><div id="pp"></div>'+
   '<div style="background:var(--soft);border-radius:16px;padding:14px;margin:8px 0 6px;min-height:110px"><div class="small" id="pw">Choose a layout above.</div><div id="pr" style="margin-top:8px"></div></div><div id="pq"></div>');
  P.forEach((x,j)=>{const b=document.createElement('button');b.className='chip';b.innerHTML=L.ic(x[0])+x[1];
    b.onclick=()=>{[...L.$('#pp').children].forEach(y=>y.classList.remove('sel'));b.classList.add('sel');seen.add(j);
      L.$('#pw').innerHTML='<b>The room:</b> '+x[2];L.$('#pr').innerHTML='<b>What it telegraphs:</b> '+x[3];
      if(seen.size===4&&!L.$('#pq').innerHTML){const q=L.$('#pq');q.innerHTML='<h2 class="sub">According to Block, what matters most about the room?</h2>';
        L.mc(q,['Always seat people in a circle with no front','That people adapt the structure to the task'],1,
         'Right. Any layout can work. The shift happens when people know they can reshape the structure to fit their purpose.',
         'A circle sends a strong signal, but Block says there is no single right layout. What matters is people adapting the structure to the task.');}};
    L.$('#pp').appendChild(b);});}},
{part:1,src:'Chapter 17 · Open with Transparent Purpose and a Level Playing Field',pts:1,run(L){
  L.h(L.kick('pr','Put it in order')+'<h1 class="q">Marcus opens the kickoff. Arrange the four parts of a transparent opening.</h1>');
  L.order(L.card,[
   'The concerns that started this: complaints about damage doubled',
   'Where we are now: the pilot, and the old report that went nowhere',
   'What we need from this group today',
   'How the next two hours will run'],
   'Why it started, where it stands (failures included), what is needed now, then the structure. Short, and from the heart.');}},

/* ---------- PART 3: DOUBT AND CREATION ---------- */
{part:2,src:'Chapter 17 · Create a Platform for Openness and Doubt',run(L){
  L.h(L.kick('learn','Way 4 · A platform for openness and doubt')+'<h1 class="q">Doubt said in public builds more faith than any pep talk</h1>'+
   L.prose('People already voice doubts at work, just in private: at the coffee machine, over lunch. If honest talk stays private, the public conversation feels unreal and discouraging.')+
   L.quote('If we cannot say no, our yes has no meaning.','Peter Block, chapter 17')+
   L.prose('The engineer in us wants to answer every doubt. In human systems many doubts stay unanswered, and that’s fine: <b>the expression of doubt counts, not its resolution</b>. Giving the most alienated people a platform builds commitment in everyone watching.')+
   '<p class="small">Management reassurance doesn’t help: everyone knows reassuring is management’s job. Trust comes from whether leaders tell the truth, including about failure.</p>');
  L.done();}},
{part:2,src:'Chapter 17 · Create a Platform for Openness and Doubt',run(L){
  L.h(L.kick('ex','Copperleaf')+'<h1 class="q">A doubt in front of everyone</h1>');
  L.beats(L.card,[
   ['The doubt','At the kickoff, a day-shift packer says: “We’ve seen three programs like this die. Why is this one different?”'],
   ['The reflex','Marcus starts to list reasons it will work this time. Jordan catches their eye.'],
   ['Jordan’s move','“That’s a fair doubt. Who else has seen programs come and go?” Half the room raises a hand.'],
   ['The truth','Marcus says it plainly: “The last report died on my desk. And I’ve been pushing speed over care.”'],
   ['The effect','The doubt isn’t solved. But the room goes quiet in a different way, and the next comments are honest ones.']],
   'Acknowledge doubt and make room for cynicism without being stopped by it. The truth told in public is what earns trust.');}},
{part:2,src:'Chapter 17 · Create a Platform for Openness and Doubt',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">A supervisor says: “The scheduling tool will crash on the first busy Monday.” What fits a platform for doubt?</h1>');
  L.mc(L.card,['Thank them, and ask who else shares the worry','Show the vendor’s uptime figures to settle it','Take it offline so it doesn’t spread to others'],0,
   'The point is to let doubt be voiced in public. Inviting others to share it builds faith.',
   'Rushing to settle the doubt or moving it offline both shut down the public conversation. Expressing doubt is what counts, not resolving it.');}},
{part:2,src:'Chapter 17 · Ask, “What Do We Want to Create Together?”',run(L){
  L.h(L.kick('learn','Way 5 · “What do we want to create together?”')+'<h1 class="q">Two hard words in one question</h1>'+
   L.tiers([['pencil','Create','The risky part. Saying yes means you stop reacting to what you were handed and start defining a future you’ll be responsible for. First answers are often dull; the work is a future unique to this group.','A form of freedom'],
            ['people','Together','Not what each unit can do alone, but what we can create together that none of us can alone. That means crossing boundaries and maybe giving up territory.','The harder part',true,'Watch for this']])+
   '<p class="small" style="margin-top:10px">Block notes that groups asked this usually come back with a list of things each group will do on its own.</p>');
  L.done();}},
{part:2,src:'Chapter 17 · Ask, “What Do We Want to Create Together?”',pts:5,run(L){
  L.h(L.kick('pr','Together or alone?')+'<h1 class="q">Day shift, night shift, drivers and customer service answer “What do we want to create together?” Sort their ideas.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Truly together','Each group alone'],[
   ['Day shift will wrap glass tables in double foam',1,'A good step, but one group acting on its own.'],
   ['Day and night shift hold one joint load check at shift change',0,'Both shifts cross a boundary and share a routine.'],
   ['Drivers will report damage within an hour',1,'Useful, but drivers alone.'],
   ['Packers and drivers agree one loading layout and share the dock',0,'Two groups give up some territory to make something new.'],
   ['Customer service shares complaint stories with packers every week',0,'Crosses a line that has never been crossed.']],
   'Together means something no group could create alone. A list of separate good intentions isn’t that yet.');}},
{part:2,src:'Chapter 17 · Create a New Conversation',run(L){
  L.h(L.kick('learn','Way 6 · Create a new conversation')+'<h1 class="q">A change in action follows a change in the conversation</h1>'+
   L.prose('Old conversations lead to old actions. The familiar way of naming a problem is a position we know we can defend, so it feels safe and keeps us in control. That is an '+L.g('old-conversation','old conversation')+'.')+
   L.lanes([['clock','Old','Safe, defensible, stale. Its staleness breeds cynicism and drains energy.',3],
            ['bulb','New','A task-related talk people haven’t had before. Positions they can’t yet defend. Optimism appears when we surprise ourselves.',2]])+
   L.prose('Each time a group changes its conversation, culture changes in that moment.'));
  L.done();}},
{part:2,src:'Chapter 17 · Create a New Conversation',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Old or new conversation?',['Old conversation','New conversation'],[
   ['“Same as ever: day shift blames night shift’s loading.”',0,'A familiar blame people can defend forever.'],
   ['“What does each of us do that makes a scratch more likely?”',1,'A question nobody here has asked before.'],
   ['“We just need head office to give us more people.”',0,'The safe, standard way of naming the problem.'],
   ['“Maybe speed was never what customers wanted from us.”',1,'A position the speaker can’t yet defend. New territory.'],
   ['“Let’s go through last year’s figures one more time.”',0,'Rehashing the familiar keeps everyone safe and stuck.']]);}},

/* ---------- PART 4: CHOOSE AND CLOSE ---------- */
{part:3,src:'Chapter 17 · Choose Commitment and Accountability',run(L){
  L.h(L.kick('learn','Way 7 · Choose commitment and accountability')+'<h1 class="q">Accountability can be chosen, not bought</h1>'+
   L.prose('We try to legislate accountability, “manage” it, or buy it with incentives. Block calls these low-faith strategies: the more rules, the more loopholes, and the more rules after that. A crisis shows people will choose accountability; the challenge is finding that will without one.')+
   L.list([['people','Peers first, boss next','We learn to manage bosses (“thanks for the feedback”). Peers see us clearly, live with our mistakes, and are harder to fool. They also say whether our promises are enough for the whole.'],
           ['check','Commit without barter','A real commitment doesn’t depend on what someone else does. If it does, it’s a deal that can be withdrawn: '+L.g('barter','barter')+', not a promise.']],2)+
   '<p class="small">Contracts still have their place. A personal commitment is simply a different thing.</p>');
  L.done();}},
{part:3,src:'Chapter 17 · Peer Accountability',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">At the end of the kickoff, packers are ready to make promises about the pack check. Who should hear them first?</h1>');
  L.mc(L.card,['Marcus, who can sign them off','Jordan, who can track progress','Their fellow packers, in the room'],2,
   'That’s '+L.g('peer-accountability','peer accountability')+': peers live with the results, are harder to fool, and can say whether the promises are enough.',
   'Promises made to a boss or a consultant are easy to manage around. Block says to be accountable to peers first; they live with your work.');}},
{part:3,src:'Chapter 17 · Commitment Without Barter',pts:5,run(L){
  L.h(L.kick('pr','Promise or barter?')+'<h1 class="q">Sort what people say as the kickoff closes.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Real commitment','Barter'],[
   ['“I’ll do the pack check on every load, whatever the others do.”',0,'It depends on nobody else. That is a promise.'],
   ['“I’ll do the check if Marcus stops moving us mid-shift.”',1,'Conditional on Marcus. A fair request, but a deal, not a commitment.'],
   ['Marcus: “I’ll keep the rota fixed for a month, whether or not the numbers move.”',0,'Marcus commits without asking anything back.'],
   ['“We’ll hit the target once there’s a bonus for it.”',1,'Commitment bought with an incentive is barter.'],
   ['“I’ll join the huddle once night shift has proved it works.”',1,'Waiting on someone else’s action makes it conditional.']],
   'Barter can be withdrawn when the other side doesn’t deliver. A free commitment makes the change ours, so setbacks don’t turn into cynicism.');}},
{part:3,src:'Chapter 17 · Focus on Gifts',run(L){
  L.h(L.kick('learn','Way 8 · Focus on gifts')+'<h1 class="q">End by naming what people brought</h1>'+
   L.prose('Close each meeting by acknowledging the effort and care in the room: the gifts and value each person brought.')+
   L.prose('We live in a world more interested in our weaknesses. Block’s point: if negative feedback were so useful, we would have it together by now. Focusing on weaknesses mostly breeds self-doubt, and makes people easier to control.')+
   L.note('Talking about gifts feels awkward. Do it anyway: implementation moves faster when people build on their strengths, and that holds for organizations too.','star'));
  L.done();}},
{part:3,src:'Chapter 17 · The Point',run(L){
  L.h(L.kick('learn','The point')+'<h1 class="q">People commit through feeling, connection and choice</h1>'+
   L.list([['Emotion','People decide to support a change through feelings, trust and hope, not logic alone.'],
           ['Relatedness','The depth of connection to those around them may matter more than how right the decision is.'],
           ['Choice','Results come when members of a system choose a direction together. Membership matters more than leadership.'],
           ['Real accountability','Caring for the whole institution first, your unit and yourself second. People choose this when they feel attached and have shaped the process.']],4)+
   L.prose('A chart of who decides and who advises doesn’t shift power; it restrains it. Power has to be redistributed in <b>how we live</b> together, not only in how we decide.'));
  L.done();}},
{part:3,src:'Chapter 17 · The Point',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Tap each piece until the sentence says what the elements of engagement are for.</h1>');
  L.sentence(L.card,[['To build commitment,','To build compliance,'],['explain the decision more clearly','create connection and offer real choice','set clearer decision rules'],['in how people work together every day','in the leader’s vision statement']],[0,1,0],
   [['Compliance is what installation gets. Engagement aims at internal commitment.'],['Clearer explanation is the presenter’s habit; it doesn’t create choice.','A decision chart restrains power instead of shifting it.'],['A vision from the top is leadership by lamination.']],
   'To build commitment, create connection and offer real choice in how people work together every day.');}},
{part:3,src:'Chapter 17 · Checklist #10: Reviewing an Implementation Event',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'After the kickoff, Jordan reviews it. Which way to engage does each note test?',['Platform for doubt','Create together','Commitment','Focus on gifts','Rearrange the room'],[
   ['“Did anyone question the plan in front of everyone?”',0,'Public doubts are the platform for openness.'],
   ['“Did the shifts agree anything none could do alone?”',1,'That is the “together” in “What do we want to create together?”'],
   ['“What promises did people make, and were they enough?”',2,'Choosing commitment and accountability.'],
   ['“Did we end by naming what each person brought?”',3,'Closing with gifts.'],
   ['“Did moving the chairs change who spoke?”',4,'The room itself is part of the design.']]);}}
  ]
});
</script>
</body>
</html>
