<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Techniques Are Not Enough</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0002', title:'Techniques are not enough', minutes:20, icon:'scale',
  goals:['Notice the relationship level of a meeting, not only the content','Tell the expert, pair-of-hands and collaborative roles apart, and see the cost of each','Involve a client step by step so responsibility stays 50/50'],
  parts:['Two levels','Assumptions and goals','Three roles','Step by step'],
  read:'Read chapter 2 of the book for the full IT and financial-services examples and Checklist 1 on balancing responsibility.',
  glossary:{
    'content-level':'Content level: the rational, explicit part of a discussion, about the technical or business problem itself.',
    'valid-data':'Valid data: facts everyone accepts, plus personal data, meaning how people feel about what is happening to them. Both count as facts.',
    'internal-commitment':'Internal commitment: people putting in real effort because they see the work serves what they want, not because they were ordered to.'
  },
  cheatsheet:[
    'Every meeting has two levels: the <b>content</b> and the <b>relationship</b>. Give them equal attention.',
    'Four relationship elements are always at work: <b>responsibility</b> (aim for 50/50), <b>feelings</b>, <b>trust</b> and <b>your own needs</b>.',
    'How you feel working with a client is likely how their own people feel. Treat it as data.',
    'Three assumptions: problem solving needs <b>valid data</b>, good decisions need <b>free and open choice</b>, action needs <b>internal commitment</b>.',
    'Goals: a collaborative relationship; problems solved so they <b>stay solved</b>; attention to both the business problem and the people side.',
    '<b>Expert</b>: you decide, client stays passive. <b>Pair of hands</b>: client decides, you carry it out. <b>Collaborative</b>: you share it 50/50.',
    'Collaborate on <b>how the work is done</b>, not on your technical expertise.',
    'Use every step, from defining the problem to deciding on action, to involve the client, even when doing it alone would be faster.'
  ],
  steps:[
/* ---------- PART 1: TWO LEVELS ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Marcus explains the delivery-damage numbers to Jordan, while checking their phone and cutting Jordan off twice. What is worth Jordan’s attention?</h1>');
  L.mc(L.card,['Only the numbers, since that’s the topic','The numbers and how the meeting feels'],1,
   'The numbers matter, but so does what is happening between the two of them. This lesson is about that second level.',
   'The numbers are only half of it. How Marcus is acting toward Jordan is information too. This lesson is about that second level.');}},
{part:0,src:'Chapter 2 · Beyond content',run(L){
  L.h(L.kick('learn','Two levels')+'<h1 class="q">Every consulting conversation runs on two levels at once</h1>'+
   L.lanes([['list','Content','The '+L.g('content-level','content level')+': the problem itself. Training needs, decision making, a system, financial controls.',3],
            ['chat','Relationship','What you and the client feel about each other: acceptance or resistance, high or low tension, support or confrontation.',2]])+
   L.prose('Most of us are comfortable on the content level. We arrive with our expertise and talk about problems we know. The book asks for <b>equal attention</b> to the relationship.')+
   L.flow([['eye','1 · Value it','Treat feelings as real information.'],['chat','2 · Say it','Get comfortable putting the relationship into words.'],['shield','3 · Say it well','Do it without making the client defensive.']]));
  L.done();}},
{part:0,src:'Chapter 2 · Beyond content',run(L){
  L.h(L.kick('learn','Four elements, always at work')+'<h1 class="q">Tap each card to see what to watch on the relationship level</h1>');
  L.flips(L.card,[
   ['Responsibility','It should be balanced, 50/50. Clients often expect you to take the problem and hand back a solution. Your job is to act out the 50/50.'],
   ['Feelings','Is the client owning their feelings, or talking like an observer of their own company? And what are <i>you</i> feeling about them?'],
   ['Trust','Clients often see a consultant as someone to watch out for. Ask what doubts they have. Distrust put into words builds trust.'],
   ['Your own needs','You have a right to them: a client, acceptance, access to people, the manager’s support. Pretending to have no needs is a trap.']],
   'Skill in consulting is not only delivering a program. It’s also being able to name these four issues out loud.');}},
{part:0,src:'Chapter 2 · Beyond content',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">Jordan’s first meeting with Marcus, seen through the four elements</h1>');
  L.beats(L.card,[
   ['Responsibility','Marcus asks Jordan to also send the announcement about the training to all DC staff. Jordan could write it faster, but suggests Marcus send it. That shows the DC that Marcus owns at least half of the project.'],
   ['Feelings','Marcus says “the packers are careless” as if watching from outside. Jordan also notices they themselves feel rushed and talked over. The book says the people in Marcus’s organization probably feel the same way.'],
   ['Trust','Jordan asks: “What doubts do you have about working with Business Improvement?” Marcus mentions the outside firm’s thick report that changed nothing.'],
   ['Own needs','Jordan says plainly that they need to talk to packers and supervisors, and need Marcus’s support when people push back.']],
   'None of this is about packing technique. All of it decides whether the project works.');}},
{part:0,src:'Chapter 2 · Responsibility',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Marcus says: “You handle all the scheduling and the e-mails about the program. I’m too busy.” What does the book suggest?</h1>');
  L.mc(L.card,['Agree, since Jordan is better at it','Ask Marcus to do the communicating'],1,
   'Not because only Marcus can do it, but because it shows the DC that Marcus is taking at least half of the responsibility.',
   'Jordan might well do it better. The book still says the client should do it, because it visibly shows they own at least half of the program.');}},
{part:0,src:'Chapter 2 · Beyond content',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which element is at play?',['Responsibility','Feelings','Trust','Own needs'],[
   ['Marcus expects Jordan to diagnose and fix the damage problem while Marcus waits for results.',0,'The client is handing over the whole job. Responsibility is out of balance.'],
   ['Jordan notices they feel nervous and controlled every time Marcus speaks.',1,'Jordan’s own feelings are data on how Marcus manages.'],
   ['Marcus asks whether what packers tell Jordan will end up with Lena, their boss.',2,'Marcus is checking whether Jordan can be trusted with confidential information.'],
   ['Jordan realizes they need to visit the night shift and must ask Marcus for that.',3,'Access to people is a legitimate consultant need.'],
   ['Marcus keeps saying “people around here feel…” but never says how they feel themselves.',1,'Marcus talks like an observer instead of owning their own feelings.']]);}},

/* ---------- PART 2: ASSUMPTIONS AND GOALS ---------- */
{part:1,src:'Chapter 2 · The consultant’s assumptions',run(L){
  L.h(L.kick('learn','The consultant’s assumptions')+'<h1 class="q">Act the way you advise clients to act</h1>'+
   L.prose('Your beliefs about good management sneak into every recommendation. So your own behavior has to match them. If you urge a client to be collaborative while keeping tight control of your project, you undermine yourself.')+
   L.prose('The book’s approach rests on three assumptions:')+
   L.list([['eye','Problem solving needs valid data','Facts everyone accepts, <i>and</i> how people feel. If people feel they won’t get a fair deal, that is a fact, and it shapes what they do.'],
     ['scale','Good decisions need free and open choice','People back decisions they could influence. Without any control they get cautious, hold back information and protect themselves.'],
     ['flame','Action needs internal commitment','Order people and they comply while you watch. To get real effort, they must see how it serves what they want.']],1));
  L.done();}},
{part:1,src:'Chapter 2 · The consultant’s assumptions',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">A day-shift packer tells Jordan: “Whatever we say, we’ll get blamed anyway.” Marcus says that’s just an opinion, not data. Who is right, according to the book?</h1>');
  L.mc(L.card,['Marcus: only measurable facts count','Jordan, if they treat it as valid data'],1,
   'How people feel is a fact too, and it will shape how they act. It is part of '+L.g('valid-data','valid data')+'.',
   'The book counts personal feelings as facts. If packers expect blame, that belief will affect what they do, so ignoring it throws away crucial data.');}},
{part:1,src:'Chapter 2 · The consultant’s goals',run(L){
  L.h(L.kick('learn','The consultant’s goals')+'<h1 class="q">Three goals for every job, even if you can’t always reach them</h1>'+
   L.tiers([['people','A collaborative relationship','It uses everyone’s resources and spreads responsibility. And you are always a model: how you act says more than your words.'],
            ['cycle','Solve problems so they stay solved','Fix today’s problem <i>and</i> help the manager learn to handle the next one themselves.','',true,'Key'],
            ['layers','Attention to both levels','The technical or business problem and how people act around it. As an outsider with nothing to win or lose, you can raise the people side.']])+
   L.note('One more aim runs under all three: build the client’s '+L.g('internal-commitment','internal commitment')+'. You can’t order them to act, so your impact depends on it. Clear arguments help, but they are not enough.','target'));
  L.done();}},
{part:1,src:'Chapter 2 · Goal 2: Solve problems so they stay solved',run(L){
  L.h(L.kick('ex','The book’s example, then Copperleaf')+'<h1 class="q">Fixing it today versus fixing it for good</h1>');
  L.beats(L.card,[
   ['The book’s case','Employees keep arriving late. Quick fixes: post the boss at the door with a notebook, do room checks, issue a policy.'],
   ['What that misses','Lateness may drop, but the managers learned nothing. Lateness might be a symptom of discontent or of weak first-line supervision.'],
   ['The deeper help','Work with the managers on <i>how they handle</i> problems like this, and on not handing off problems that are theirs to face.'],
   ['At Copperleaf','Marcus wants a course for “careless” packers. Even if damage drops for a while, Marcus may not learn to ask what the damage is a symptom of.'],
   ['Jordan’s aim','Help solve the damage problem in a way that leaves Marcus better able to handle the next one without calling Jordan.']],
   'The book’s second goal: solve problems so they <b>stay</b> solved, by building the manager’s own skill.');}},
{part:1,src:'Chapter 2 · The consultant’s goals',pts:5,run(L){
  L.h(L.kick('pr','Today or for good?')+'<h1 class="q">Sort each plan for the damage problem.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Fixes only today’s problem','Helps it stay solved'],[
   ['Jordan writes new packing rules and Marcus posts them',0,'The rules may help, but Marcus learns nothing about finding causes.'],
   ['Marcus and Jordan look together at what the damage might be a symptom of',1,'Marcus builds the skill of looking past symptoms.'],
   ['Supervisors are told to stand at the dock and watch the packers',0,'Like the boss at the door with a notebook. It treats the symptom.'],
   ['Marcus helps choose how to gather data on the problem',1,'Taking part in the method teaches Marcus how to tackle the next problem.'],
   ['Jordan sends Marcus a finished list of who needs retraining',0,'The decision is made for Marcus, so the skill stays with Jordan.']],
   'Plans that leave the skill with Marcus are the ones that keep the problem solved.');}},
{part:1,src:'Chapter 2 · Developing client commitment',pts:1,run(L){
  L.h(L.kick('pr','The shelf report')+'<h1 class="q">Two years ago an outside firm wrote a thick, accurate report on the DC. Marcus agreed with every page. Nothing changed. What does the book say usually explains this?</h1>');
  L.mc(L.card,['The analysis in it must have been wrong','The process lost the managers somewhere','Marcus didn’t have budget to act on it'],1,
   'When a costly, relevant study ends up on a shelf, the book says the consulting process usually lost the managers who had to decide to use it.',
   'The report could be accurate and affordable and still sit there. The book says it usually means the process lost the managers’ commitment along the way.');}},

/* ---------- PART 3: THREE ROLES ---------- */
{part:2,src:'Chapter 2 · Roles consultants choose',run(L){
  L.h(L.kick('learn','Three roles')+'<h1 class="q">Three ways a consultant can work with a manager</h1>'+
   L.prose('The book borrows these roles from Ed Schein. Which one fits depends on the manager’s style, the task and your own preference.')+
   L.tiers([['star',L.g('expert-role','Expert'),'The manager hands the problem over and stays inactive. You decide, gather data, act. The manager judges afterwards.','“You’re the expert, fix it.”'],
            ['pointer',L.g('pair-of-hands','Pair of hands'),'The manager has already diagnosed it and made the plan. You carry it out without questioning it.','“Here’s the outline. Get it done.”'],
            ['people',L.g('collaborative','Collaborative'),'You join your expertise with the manager’s knowledge of the organization. Shared decisions, shared data, shared results.','“Let’s work this out together.”',true,'The aim']])+
   '<p class="small" style="margin-top:10px">Sometimes the expert or pair-of-hands role is right, or can’t be avoided. The point is to choose on purpose.</p>');
  L.done();}},
{part:2,src:'Chapter 2 · Roles consultants choose',pts:1,
 solve:async L=>{[...L.$('#rc').children].forEach(b=>b.click());},
 run(L){
  const R=['Expert','Pair of hands','Collaborative'],
   F=['Who decides how to proceed','Who picks how to gather data','When they disagree','What Marcus learns'],
   V=[['Jordan, by expert judgment','Jordan','Rare: hard for Marcus to challenge the expert','Nothing much. Only today’s problem is solved'],
      ['Marcus. Jordan may suggest','Marcus. Jordan just collects','Jordan avoids it, or it looks like defiance','Nothing new. Marcus’s plan is carried out'],
      ['Both, together','Both, together','Expected, and a source of new ideas','How to solve the next problem themselves']];
  const seen=new Set();
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Same request from Marcus, three different Jordans. Tap each role and watch what changes.</h1><div id="rc"></div>'+
   '<div style="background:var(--soft);border-radius:16px;padding:14px;margin:8px 0 6px;min-height:150px" id="rv"><div class="small">Choose a role above.</div></div><div id="rq"></div>');
  R.forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=n;b.onclick=()=>{[...L.$('#rc').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(j);
    L.$('#rv').innerHTML=F.map((f,k)=>'<div style="margin-bottom:8px"><div class="small">'+f+'</div><b>'+V[j][k]+'</b></div>').join('');
    if(seen.size===3&&!L.$('#rq').innerHTML){const q=L.$('#rq');q.innerHTML='<h2 class="sub">In which role does the damage problem most likely stay solved?</h2>';
      L.mc(q,['Expert','Collaborative','Pair of hands'],1,'Only in the collaborative role does Marcus come away able to handle the next problem. That is the book’s goal.','In the expert and pair-of-hands roles Marcus learns little. The collaborative role builds Marcus’s own skill, so the problem stays solved.');}};L.$('#rc').appendChild(b);});}},
{part:2,src:'Chapter 2 · Pair-of-hands role',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Marcus hands Jordan a page: “I’ve worked out what’s wrong and what to do. Just get it done by Friday.” Which role is Marcus asking for?</h1>');
  L.mc(L.card,['Expert','Pair of hands','Collaborative'],1,
   'Marcus did the diagnosis and the plan and keeps control. Jordan is an extra pair of hands.',
   'In the expert role Jordan would decide. In the collaborative role they would decide together. Here Marcus keeps full control, so it’s pair of hands.');}},
{part:2,src:'Chapter 2 · Problems with each role',run(L){
  L.h(L.kick('learn','Each role has a cost')+'<h1 class="q">What goes wrong in each role</h1>'+
   L.list([['star','Expert','Most problems have a human side. If people are afraid, they hide or bend the facts, so your diagnosis can be wrong. And outside studies rarely win real ownership.'],
     ['pointer','Pair of hands','You depend on the manager’s diagnosis. If it’s wrong, the plan fails and you are a handy scapegoat. Ask to check their diagnosis and they may feel their authority is being questioned.'],
     ['people','Collaborative','Managers who want an expert may read it as foot-dragging. Managers who want a pair of hands may read it as insubordination. And it takes more time.']],4));
  L.done();}},
{part:2,src:'Chapter 2 · Roles consultants choose',pts:6,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which role is Jordan in?',['Expert','Pair of hands','Collaborative'],[
   ['Jordan collects only the data Marcus told them to, the way Marcus told them to.',1,'The manager picks the methods; the consultant just collects.'],
   ['Marcus and Jordan disagree about the cause, and both treat it as a useful lead.',2,'Disagreement is expected and seen as a source of new ideas.'],
   ['Marcus is out of the loop on details, and Jordan reports findings when done.',0,'The manager stays inactive and judges the result afterwards.'],
   ['Jordan keeps quiet about doubts on Marcus’s plan, to avoid looking defiant.',1,'Avoiding disagreement to protect the manager’s authority is a pair-of-hands clue.'],
   ['Before any work starts, they agree on what each of them expects.',2,'Agreeing on mutual expectations first is how collaboration starts.'],
   ['Marcus tries to question Jordan’s method, and Jordan sees it as interference.',0,'In the expert role, technical control rests with the consultant.']]);}},
{part:2,src:'Chapter 2 · Collaboration and the fear of holding hands',run(L){
  L.h(L.kick('learn','The fear of holding hands')+'<h1 class="q">Collaborating doesn’t mean hiding your expertise</h1>'+
   L.prose('Some consultants worry that collaborating means pretending the client knows as much as they do. It doesn’t. Passing on expertise is the core of any consulting job.')+
   L.prose('The line the book draws: collaborate on <b>how the consulting is carried out</b>, not on the technical content.')+
   L.lanes([['people','Collaborate on','What the client wants · how to tell the organization · who takes part in discovery · what data to gather · what the results mean · how to make the change',2],
            ['star','Keep as your expertise','Your technical field, such as training design, questionnaire design, packaging design, systems analysis or pricing',3]])+
   '<p class="small" style="margin-top:10px">The more the process is shared, the better the odds the work survives after you leave.</p>');
  L.done();}},
{part:2,src:'Chapter 2 · Collaboration and the fear of holding hands',pts:5,run(L){
  L.h(L.kick('pr','Collaborate or lead?')+'<h1 class="q">For the damage project, sort each item.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Decide with Marcus','Jordan’s expertise'],[
   ['Who on the DC floor takes part in discovery',0,'Who is involved is part of how the consultation runs, so it is shared.'],
   ['How to build a valid damage-rate measure',1,'Data analysis is Jordan’s technical field.'],
   ['What the findings mean for the DC',0,'Interpreting results is a shared step.'],
   ['How to tell DC staff about the project',0,'Informing the organization is a shared step, and the book wants the client to own it.'],
   ['How to map the packing process in detail',1,'Process mapping is Jordan’s expertise. No need to downplay it.']],
   'Jordan keeps their expertise and shares the process. That’s what collaboration means here.');}},

/* ---------- PART 4: STEP BY STEP ---------- */
{part:3,src:'Chapter 2 · Staging the client’s involvement, step by step',run(L){
  L.h(L.kick('learn','Twelve chances to involve the client')+'<h1 class="q">Every step before action is a chance to make 50/50 real</h1>'+
   L.list([['Define the initial problem','Ask the client’s view, then add your own 50%.'],
     ['Decide whether to proceed','Make it a joint decision. Negotiate terms that set it up to fail.'],
     ['Select what to study','Ask the client what to look for.'],
     ['Decide who is involved','Build a joint team instead of doing it all yourself.'],
     ['Select the method','Ask how the client thinks data should be gathered.'],
     ['Do discovery','Have the client gather some of it with you.'],
     ['Make sense of the data (steps 7–9)','Invite the client in to sort and interpret it.'],
     ['Provide the results','Let the client present part of the findings.'],
     ['Make recommendations','Ask what the client would do now.'],
     ['Decide on actions','Ask to be in the room when they decide.']],2));
  L.done();}},
{part:3,src:'Chapter 2 · Staging the client’s involvement, step by step',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">Jordan stages Marcus’s involvement</h1>');
  L.beats(L.card,[
   ['Define the problem','Marcus: “The packers are careless.” Jordan: “I’ll look at packing. I also want to look at how the shifts are scheduled and supervised.” Jordan adds their 50%.'],
   ['Decide whether to proceed','Marcus wants the course run next month. Jordan says that timeline won’t let them do it well, and asks to agree on it together.'],
   ['Who is involved','Jordan asks for one day-shift supervisor to work on the project with them. Slower, but it builds commitment.'],
   ['Do discovery','The supervisor joins some interviews. People may hold back with a boss there, but the right people hear what is said. Jordan can go back alone if needed.'],
   ['Provide the results','In the feedback meeting Marcus presents part of the findings. Reporting bad news yourself makes you less defensive.'],
   ['Decide on actions','Marcus wants to “think it over” alone. Jordan asks to be in that meeting.']],
   'Each step trades a bit of Jordan’s speed for more of Marcus’s ownership.');}},
{part:3,src:'Chapter 2 · Step 1: Define the initial problem',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">At step 1 Marcus states the problem as “careless packers.” Jordan suspects there is more to it. What fits the book?</h1>');
  L.mc(L.card,['Add their own view of possible causes now','Accept it now and raise causes later on'],0,
   'It isn’t only up to the client to state the problem. Jordan can add their 50%, even this early.',
   'Waiting means the project starts on Marcus’s definition alone. The book says to add your 50% even at the first step.');}},
{part:3,src:'Chapter 2 · Staging the client’s involvement, step by step',pts:1,run(L){
  L.h(L.kick('pr','Put them in order')+'<h1 class="q">Tap these moments from the damage project in the order they happen.</h1>');
  L.order(L.card,['Marcus and Jordan state the problem','They agree whether to go ahead','They pick a supervisor for the team','The supervisor helps run interviews','Marcus presents part of the findings','Jordan joins the decision meeting'],
   'Define, decide to proceed, choose who’s involved, discover, provide results, decide on action. Each one is a chance to share the work.');}},
{part:3,src:'Chapter 2 · Steps 7 through 9: Funneling the data and making sense of it',pts:1,run(L){
  L.h(L.kick('pr','A real decision')+'<h1 class="q">Jordan thinks: “Marcus won’t understand the statistics. I’ll sort through the data alone, it’s faster.” What would the book say?</h1>');
  L.mc(L.card,['Fine: technical steps are the expert’s job','Fine: it saves Marcus time on detail','Careful: that’s a favorite excuse to exclude'],2,
   'On a truly technical step you may have to work alone. But the book warns that “the client lacks the background” is our favorite excuse for leaving them out.',
   'Sometimes working alone can’t be avoided. But the book warns that the client’s lack of background is a favorite excuse for excluding them. Making sense of the data is meant to be shared.');}},
{part:3,src:'Chapter 2 · Staging the client’s involvement, step by step',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Tap each piece until the sentence sums up this lesson.</h1>');
  L.sentence(L.card,[['At every step,','Only at the end,'],['Jordan involves Marcus','Jordan takes over'],['so responsibility stays 50/50,','so the work goes faster,'],['even though it','because it'],['takes more time.','saves effort.']],[0,0,0,0,0],
   [['The book sees every step before action as a chance, not only the last one.'],['Taking over is the expert or surrogate move, not collaboration.'],['Speed is what Jordan gives up, not what they gain.'],['Involving the client doesn’t save time. It costs some.'],['Involving Marcus usually costs effort, it doesn’t save it.']],
   'Involving the client takes longer, and the book says it is worth it for real impact.');}}
  ]
});
</script>
</body>
</html>
