<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preparing for Feedback</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0015', title:'Preparing for feedback', minutes:19, icon:'pencil',
  goals:['Shrink a pile of discovery data to the few items worth showing the client','Avoid colluding and projecting, and plan both support and confrontation','Word the picture assertively and descriptively, as a fair witness'],
  parts:['A clear picture','Do’s and don’ts','Language','Your role'],
  read:'Read chapter 14 of the book for the full courtroom roles and the story of the client who thought they were going crazy.',
  glossary:{
    'collude':'Colluding: going along with the client in avoiding a hard subject or their own part in the problem.',
    'project':'Projecting: assuming the client feels what you feel, for example that they can’t bear news you would hate to hear.',
    'assertive':'Assertive: saying directly how you see things, without putting the other person down.',
    'fair-witness':'Fair witness: the consultant’s best role when giving feedback. No stake in the verdict, just a clear account of what was seen.'
  },
  cheatsheet:[
    'A <b>clear, simple picture</b> is about 70 percent of what you have to offer. With it, the client will have as many ideas as you.',
    'To condense: read everything once, put it aside, list the <b>four or five</b> things you remember. The rest goes in an appendix.',
    'Highlight items the client <b>controls</b>, that clearly <b>matter</b>, that have some <b>commitment</b> behind them, or that build on a <b>strength</b>.',
    '<b>Don’t collude</b>: keep the client’s own part in view, and name difficult relationships. <b>Don’t project</b> your discomfort onto the client.',
    '<b>Do support</b>: tell clients what they are doing that works. <b>Do confront</b>: report what is self-defeating, kindly.',
    'Be <b>assertive</b>, not aggressive (the “you dummy” test) or nonassertive. Descriptive, focused, specific, brief, simple.',
    'Describe <b>what is</b>, not what ought to be. Be a <b>fair witness</b>, not judge, jury, prosecutor or defendant.',
    'Support and confront in the same breath. A controlling manager is often anxious about control: reassure them they keep it.'
  ],
  steps:[
/* ---------- PART 1: A CLEAR PICTURE ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Jordan has sixty pages of discovery notes on damaged deliveries. Marcus will give them one hour. What should Jordan bring?</h1>');
  L.mc(L.card,['A few points that stood out most','Every finding, so nothing is missed'],0,
   'People can only take in so much. This lesson is about choosing those few points and saying them well.',
   'Everything at once buries the picture and invites endless questions. The book says to bring a few points and trust them.');}},
{part:0,src:'Chapter 14 · A Clear Picture May Be Enough',run(L){
  L.h(L.kick('learn','A clear picture may be enough')+'<h1 class="q">The picture matters more than perfect recommendations</h1>'+
   L.prose('Every manager wants recommendations, and consultants sweat over making them perfect. Block says to relax about that.')+
   L.prose('Why has the client run out of ideas? Because the picture of the situation they are working from is too narrow. Give them a <b>fresh, clear and simple picture</b> of why the problem exists, and they will come up with as many ideas as you.')+
   L.flow([['eye','Fresh picture','Why the problem really exists','about 70% of your contribution',1],['bulb','Client’s ideas','Now as many as yours','',2]])+
   L.note('What to put in the spotlight is your call, whatever the assignment. Treat that choice as one of the most valuable things you offer.','compass'));
  L.done();}},
{part:0,src:'Chapter 14 · Condensing the Data',run(L){
  L.h(L.kick('learn','Condensing the data')+'<h1 class="q">You always have more data than you can use</h1>'+
   L.prose('Deciding what to share is a high-anxiety moment. You can sort and code the data, but picking what is important is still a <b>judgment</b>. That judgment is what the client pays for. Trust your intuition rather than calling it bias. As an internal consultant you know the people and how things work, so use that.')+
   L.list([['book','Read it all once','Notes, reports, meeting summaries.'],
     ['x','Put it aside','Close the folder.'],
     ['pencil','Blank sheet','List what you think matters. Usually four or five items.'],
     ['layers','The rest','Goes in an appendix, not the picture.']],1)+
   '<p class="small" style="margin-top:10px">Block’s reasoning: what stands out to you is what you want to stand out to the client.</p>');
  L.done();}},
{part:0,src:'Chapter 14 · Condensing the Data',run(L){
  L.h(L.kick('ex','Copperleaf')+'<h1 class="q">Jordan’s blank sheet</h1>');
  L.beats(L.card,[
   ['The pile','Sixty pages: interviews on both shifts, complaint records, loading times, notes from the floor pilot.'],
   ['Read once','Jordan reads it all on a Friday afternoon, then closes the folder.'],
   ['Monday','On a blank sheet Jordan writes what they remember: day shift is pushed hard on loading speed; complaint data never reaches the floor; schedules get changed at short notice; Kofi’s crew runs a two-minute pack-check huddle.'],
   ['Left out','A forklift battery issue, a canteen gripe, a chart of damage by day of the week. Interesting, but none made the list.'],
   ['The plan','Four items become the picture. The forklift note and the chart go in an appendix.']],
   'Jordan didn’t rank sixty pages. They trusted what stuck, which is what they want to stick with Marcus.');}},
{part:0,src:'Chapter 14 · Condensing the Data',run(L){
  L.h(L.kick('learn','What to highlight')+'<h1 class="q">Four tests for an item worth showing</h1>'+
   L.prose('When choosing what to put in front of the client, Block prefers items that:')+
   L.list([['person','The client controls','Something the client can actually change.'],
     ['star','Clearly matter','Important to the organization, not a curiosity.'],
     ['flame','Have some commitment','Someone in the client’s organization already wants to work on it.'],
     ['leaf','Build on a strength','Something already working, or a possibility already being discussed.']],2));
  L.done();}},
{part:0,src:'Chapter 14 · Condensing the Data',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Which finding best fits the tests for Marcus’s picture?</h1>');
  L.mc(L.card,['The courier’s vans have harsh suspension','Supervisors never see complaint numbers','The canteen closes too early for night shift'],1,
   'Marcus controls who sees the data, it clearly matters for damage, and supervisors have already asked about it.',
   'The courier’s vans are outside Marcus’s control, and the canteen doesn’t matter for damage. Complaint data passes every test.');}},
{part:0,src:'Chapter 14 · Condensing the Data',pts:5,run(L){
  L.h(L.kick('pr','Picture or appendix?')+'<h1 class="q">Sort these findings for Jordan’s feedback to Marcus.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['In the picture','In the appendix'],[
   ['Day shift is pushed hard on loading speed',0,'Marcus sets that pressure, and it clearly matters for damage.'],
   ['The van supplier switched tire brands',1,'Marcus can’t change it, so it would only point away from what Marcus can do.'],
   ['Kofi’s crew runs a two-minute pack-check huddle',0,'A strength that already works. Build on it.'],
   ['One packer prefers music to podcasts on shift',1,'True, but it doesn’t matter to the damage problem.'],
   ['Two supervisors already asked to see complaint data',0,'There is commitment behind it, and Marcus controls it.']],
   'The picture holds the few items Marcus controls, that matter, that someone cares about, or that build on a strength.');}},
{part:0,src:'Chapter 14 · Condensing the Data',pts:1,run(L){
  L.h(L.kick('pr','Put it in order')+'<h1 class="q">Arrange how Jordan condenses the data.</h1>');
  L.order(L.card,[
   'Read all the notes and reports once',
   'Put them all out of sight',
   'List the four or five items you remember',
   'Check the list against the four tests',
   'Move everything else to an appendix'],
   'Read once, put it away, trust what you remember, check it, and keep the rest out of the picture.');}},

/* ---------- PART 2: DO’S AND DON’TS ---------- */
{part:1,src:'Chapter 14 · Some Do’s and Don’ts',run(L){
  L.h(L.kick('learn','Some do’s and don’ts')+'<h1 class="q">Four rules as you decide what to say</h1>');
  L.flips(L.card,[
   ['Don’t collude','Don’t join the client in avoiding hard subjects. Two common ways: explaining the problem by causes outside the client’s control, and playing down difficult relationships.'],
   ['Don’t project','Projecting means putting your own feelings onto the client. If you’d hate to hear it, you assume they would too. Clients have a right to all the data. Say it, then ask how they feel.'],
   ['Do support','Include what confirms the client’s view and what they do that works. Clients may say they only want problems. Don’t believe it.'],
   ['Do confront','Report what is self-defeating, even about the client’s own style. Say it kindly. If you avoid tension, the client doesn’t need you: they already know how to do that.']],
   'Two don’ts that protect the client from comfort, and two do’s that give the client both strength and truth.');}},
{part:1,src:'Chapter 14 · Don’t Collude',run(L){
  L.h(L.kick('ex','Copperleaf')+'<h1 class="q">Jordan catches two ways of colluding in their first draft</h1>');
  L.beats(L.card,[
   ['First draft','The draft explains damage by Lena’s demands, the courier and head office. All true, and all outside Marcus’s hands.'],
   ['The cost','That is '+L.g('collude','colluding')+'. It would ease Marcus’s discomfort today, and leave Marcus feeling helpless tomorrow.'],
   ['Rewrite','Jordan keeps one line on Lena’s pressure and the courier, then puts the focus on what happens inside the DC.'],
   ['The relationship','In interviews, Marcus mentioned Lena only in passing. Yet the worry that Lena will blame Marcus’s team runs through everything.'],
   ['Where to say it','Marcus plans to forward the written report to Lena. So Jordan leaves the Lena point out of the document and plans to raise it face to face.']],
   'Acknowledge others’ part, keep the focus on the client’s part, and never skip a hard relationship. If the report travels, say it in person.');}},
{part:1,src:'Chapter 14 · Don’t Project',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Jordan would hate to learn their own team found them hard to approach. So they plan to drop the finding that supervisors avoid bringing problems to Marcus. What is Jordan doing?</h1>');
  L.mc(L.card,['Confronting Marcus','Supporting Marcus','Projecting onto Marcus'],2,
   'That’s '+L.g('project','projecting')+': Jordan is assuming Marcus can’t take what Jordan couldn’t. Marcus has a right to the data. Say it plainly, then ask how it lands.',
   'Leaving it out is neither support nor confrontation. Jordan is putting their own feelings onto Marcus: that’s projecting.');}},
{part:1,src:'Chapter 14 · Don’t Collude',pts:1,
 solve:async L=>{const g=L.$('#dd').children;g[0].click();g[1].click();},
 run(L){
  const D=[['Draft A','“Damage rose because Lena demands speed, the courier handles items roughly and head office keeps the data.”',['Wait for Lena to ease off','Hope the courier improves','Ask head office for numbers']],
           ['Draft B','“Lena’s pressure is real. Inside the DC, the push on speed, short-notice schedule changes and complaint data that never reaches the floor all feed the damage.”',['Ease the speed push on day shift','Give notice before schedule changes','Share complaint numbers on the floor','Learn from Kofi’s huddle']]];
  const seen=new Set();
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Pick each draft of Jordan’s picture and see what Marcus could do next.</h1><div id="dd"></div>'+
   '<div style="background:var(--soft);border-radius:16px;padding:14px;margin:8px 0 6px;min-height:130px"><div class="small" id="dt" style="margin-bottom:8px">Choose a draft above.</div><div id="da"></div></div><div id="dq"></div>');
  D.forEach((d,j)=>{const b=document.createElement('button');b.className='chip';b.innerHTML=L.ic('pencil')+d[0];b.onclick=()=>{[...L.$('#dd').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(j);
    L.$('#dt').innerHTML=d[1]+'<br><b>What Marcus could do next:</b>';
    L.$('#da').innerHTML=d[2].map(a=>'<span class="chip static'+(j?' ok':'')+'" style="'+(j?'':'opacity:.5')+'">'+(j?L.ic('check'):L.ic('lock'))+a+'</span>').join('');
    if(seen.size===2&&!L.$('#dq').innerHTML){const q=L.$('#dq');q.innerHTML='<h2 class="sub">Which draft colludes with Marcus?</h2>';
      L.mc(q,['Draft A','Draft B'],0,'Every cause in Draft A sits outside Marcus’s control, so every next step means waiting on someone else. Comforting, and helpless.','Draft B names Lena’s part too, but keeps the focus on what Marcus controls. Draft A colludes: it leaves Marcus nothing to do.');}};
    L.$('#dd').appendChild(b);});}},
{part:1,src:'Chapter 14 · Some Do’s and Don’ts',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which do or don’t is this?',['Colluding','Projecting','Supporting','Confronting'],[
   ['Jordan tells Marcus the damage really is serious and their worry about it is well founded.',2,'Confirming what the client sees correctly is support.'],
   ['Jordan agrees with Marcus that it’s mainly a courier problem, to keep the meeting calm.',0,'Blaming an outside cause takes the solution out of Marcus’s hands.'],
   ['Jordan tells Marcus, kindly, that their late schedule changes leave packers rushing.',3,'Reporting the client’s self-defeating habit, kindly, is confronting.'],
   ['Jordan softens a finding to mush because they’d feel crushed hearing it themselves.',1,'Jordan’s own feelings are being put onto Marcus.'],
   ['Marcus never mentions Lena, so Jordan leaves the Lena tension out entirely.',0,'Playing down a difficult relationship is the second kind of collusion.']]);}},

/* ---------- PART 3: LANGUAGE ---------- */
{part:2,src:'Chapter 14 · Language in Giving the Picture',run(L){
  L.h(L.kick('learn','Language in giving the picture')+'<h1 class="q">Assertive, not aggressive or nonassertive</h1>'+
   L.tiers([['alert','Aggressive','States your view in a way that puts the client down: incompetent, uncaring, in need of fixing. Creates resistance you didn’t need.'],
            ['chat','Assertive',L.g('assertive','Assertive')+' means stating directly how you see the problem, without implying the client is a bad manager or missed the obvious.','',true,'The goal'],
            ['lock','Nonassertive','Holds back. Leaves out how the situation is managed, the manager’s style or the politics, “to protect” them.']])+
   L.quote('If “you dummy” fits nicely at the end, the statement was aggressive.','Peter Block, chapter 14')+
   '<p class="small">Assertive and authentic sit very close together. Aim for both.</p>');
  L.done();}},
{part:2,src:'Chapter 14 · Language in Giving the Picture',run(L){
  L.h(L.kick('learn','Describe, don’t judge')+'<h1 class="q">The more you judge, the more they defend</h1>'+
   L.lanes([['check','Descriptive','The boss does about 80 percent of the talking in meetings.',2],
            ['x','Evaluative','The boss dominates and runs meetings badly.',4]])+
   L.list([['Descriptive','not judgmental. Drop words like weak, incompetent, controlling.'],['Focused','not global.'],['Specific','not stereotyped. “A decision-making problem” tells no one anything.'],['Brief','not lengthy. Most questions can be answered in a paragraph.'],['Simple','not complicated.']],2)+
   L.prose('And say <b>what is</b>, not what ought to be. Talking about what ought to be makes you sound like a judge, unless your contract is to prescribe.'));
  L.done();}},
{part:2,src:'Chapter 14 · Language in Giving the Picture',pts:1,run(L){
  L.h(L.kick('try','The “you dummy” test')+'<h1 class="q">Add “you dummy” to the end of each. Which statement is aggressive?</h1>');
  L.mc(L.card,['Schedules changed at short notice on six days last month.','Anyone could see these schedule changes would cause damage.','Packers say late changes leave them rushing the wrapping.'],1,
   '“Anyone could see…, you dummy” fits perfectly. It implies Marcus missed the obvious.',
   'That one is a plain description; “you dummy” sounds odd after it. The aggressive line is “Anyone could see…”, which implies Marcus missed the obvious.');}},
{part:2,src:'Chapter 14 · Language in Giving the Picture',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'How would you rate Jordan’s line?',['Assertive','Aggressive','Nonassertive'],[
   ['“Supervisors told me they hear about complaints only when a customer calls the store.”',0,'Direct, descriptive and no put-down.'],
   ['“Frankly, the DC is run in a pretty chaotic way.”',1,'It judges Marcus’s management. “You dummy” fits.'],
   ['Jordan leaves out the schedule overrides because it’s Marcus’s own habit.',2,'Skipping how the situation is managed protects no one.'],
   ['“Your style is the real problem here, if we’re honest.”',1,'It labels the manager instead of describing what happens.'],
   ['Jordan mentions only the courier and the packaging, nothing about Lena.',2,'Ignoring the politics is nonassertive.']]);}},
{part:2,src:'Chapter 14 · Language in Giving the Picture',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Tap each piece until Jordan’s line is descriptive, specific and brief.</h1>');
  L.sentence(L.card,[['Clearly the DC mismanages it:','Supervisors report that','Everyone knows that'],['shift schedules changed','planning is weak and','things get chaotic'],['at under an hour’s notice','far too often','because nobody plans'],['on six days last month.','and it has to stop.','as you would expect.']],[1,0,0,0],
   [['That judges before it describes.','A vague claim nobody can check.'],['“Weak” is a judging word.','Vague and evaluative.'],['Too vague. How often, exactly?','That blames instead of describing.'],['That is what ought to be, not what is.','That hints Marcus should have known.']],
   '“Supervisors report that shift schedules changed at under an hour’s notice on six days last month.” What is, said plainly.');}},

/* ---------- PART 4: YOUR ROLE ---------- */
{part:3,src:'Chapter 14 · Presenting the Picture . . . as Courtroom Drama',run(L){
  L.h(L.kick('learn','Presenting the picture as courtroom drama')+'<h1 class="q">Five roles you might play. Flip each card.</h1>');
  L.flips(L.card,[
   ['Judge','Interprets policy and decides penalties. People fear judges and avoid them.'],
   ['Jury','Decides alone whether the client was right or wrong. Remote and parental.'],
   ['Prosecutor','Goes for a conviction with a buttoned-up package of evidence. Creates distance; success looks like the consultant’s.'],
   ['Defendant','Feels on trial: rehearses, over-explains, promises more data. If the client treats you this way, it is their resistance.'],
   ['Witness','No stake in the verdict. Gives a clear, specific, accurate account of what was seen. The preferred role.']],
   'Only the last one serves you. Go into feedback as a '+L.g('fair-witness','fair witness')+'.');}},
{part:3,src:'Chapter 14 · Consultant as Witness',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Lena’s chief of staff asks Jordan to add a column rating each supervisor, “so HR can act on it.” What role would that put Jordan in?</h1>');
  L.mc(L.card,['Judge, deciding who gets penalized','Witness, giving an accurate account','Defendant, justifying the study'],0,
   'Rating people for penalties is the judge’s robe. Block warns internal consultants that the power it brings costs them clients’ trust.',
   'A witness describes what was seen without a stake in the verdict. Rating supervisors for HR is judging, and it would cost Jordan trust.');}},
{part:3,src:'Chapter 14 · Presenting the Picture . . . as Courtroom Drama',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which role is Jordan slipping into?',['Judge','Jury','Prosecutor','Defendant','Witness'],[
   ['Jordan builds forty slides of airtight statistics so Marcus can’t argue with any of it.',2,'A foolproof case for conviction puts distance between Jordan and Marcus.'],
   ['Jordan rehearses three times and brings backup files for every possible challenge.',3,'Coming in braced for trial is the defendant role.'],
   ['Jordan privately concludes Marcus is to blame and plans the report to show it.',1,'Deciding right and wrong alone is the jury’s stance.'],
   ['Jordan describes what was seen and heard on both shifts, and stops there.',4,'A clear, specific account with no stake in the verdict.'],
   ['Jordan hints they will mention Marcus’s handling of this to Lena at review time.',0,'Threatening a penalty is the judge’s role.']]);}},
{part:3,src:'Chapter 14 · Support and Confront',run(L){
  L.h(L.kick('learn','Support and confront')+'<h1 class="q">Do both, often in the same sentence</h1>'+
   L.prose('Only confronting raises tension and lowers the chance of action. People need support to have the strength to own a problem. Often, the more resistant the client, the more support they need.')+
   L.lanes([['people','Support','Acknowledge that you hear the client. It doesn’t mean you agree, only that you listened.',2],
            ['scale','Confront','Name the difference between how you see the situation and how the client does.',1]])+
   L.note('A very controlling manager may be anxious underneath: about losing control of themselves, or of the organization if they own up to problems. Give support. Let them know they will stay in control of the process.','shield'));
  L.done();}},
{part:3,src:'Chapter 14 · Support and Confront',pts:1,run(L){
  L.h(L.kick('pr','What would Jordan say?')+'<h1 class="q">Previewing the picture, Marcus snaps: “Skip the theory. Just tell me which packers to retrain.” Which reply both supports and confronts?</h1>');
  L.mc(L.card,['“Fine. I’ll pull together a list of packer names by Friday.”','“You want it fixed fast, and you’ll decide. My data points at schedules more than packers.”','“With respect, retraining the packers would completely miss the point here.”'],1,
   'It hears Marcus and reassures them they keep control (support), then names the difference in view (confront).',
   'Agreeing is collusion, and a flat “that misses the point” is confrontation without support. Do both: hear Marcus, reassure them about control, then name the difference.');}}
  ]
});
</script>
</body>
</html>
