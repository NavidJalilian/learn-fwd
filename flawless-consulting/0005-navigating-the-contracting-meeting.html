<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Navigating the Contracting Meeting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">

</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0005', title:'Navigating the contracting meeting', minutes:19, icon:'chat',
  goals:['Prepare for a contracting meeting with a few questions on the first call','Walk a client through the eight steps of the contracting meeting','Say your own wants simply, and offer only what you can deliver'],
  parts:['Before the meeting','Opening','Wants and offers','Closing'],
  read:'Read the first half of chapter 5 of the book for more example wording at each of the eight steps.',
  glossary:{
    'essential-want':'Essential want: something you must have from the client for the project to succeed. If you can’t get it, it is better not to go ahead.',
    'desirable-want':'Desirable want: something that would make the project better, but you can still succeed without it.',
    fogged:'Fogged expression: a want buried under long explanations, justifications or a hinting question, so the client can’t tell what you are asking for.'
  },
  cheatsheet:[
    '<b>Everything counts.</b> How the first meetings go predicts how the project will go. Notice and talk about it as it happens.',
    'On the first call ask: what to discuss, who the client is, who will attend, how much time, and whether we are deciding <i>how</i> or <i>whether</i>.',
    '<b>The client</b> = everyone who sets objectives, approves action, gets the report or is strongly affected. Meet each one you can.',
    'Eight steps: acknowledge, show you understand, client wants and offers, your wants and offers, agree, check control and commitment, give support, restate actions.',
    'Ask straight out: <b>“So, what do you want from me?”</b> Then ask about constraints and what the client can offer.',
    'Split your wants into <b>essential</b> (no deal without them) and <b>desirable</b>. Never give in on an essential.',
    'Say a want plainly, then be quiet. Two-sentence answer to questions, restate, be quiet again.',
    'Overstate what you need; understate the results you alone will deliver. Results are a joint promise.'
  ],
  steps:[
/* ---------- PART 1: BEFORE THE MEETING ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">In your first meeting with a new manager, they arrive late, check their phone throughout and cut you off twice. Does that say anything about the project ahead?</h1>');
  L.mc(L.card,['Probably not, everyone has a hectic day sometimes','Probably yes, it’s an early preview of the work'],1,
   'Block agrees. How the first meetings go is a good predictor of how the whole project will go.',
   'It could be a bad day, but Block’s view is that early meetings are an accurate preview of the project. Worth noticing, and worth talking about.');}},
{part:0,src:'Chapter 5 · The Contracting Meeting',run(L){
  L.h(L.kick('learn','Everything counts')+'<h1 class="q">The first meetings are a preview of the whole project</h1>'+
   L.prose('Block opens the chapter with a joke about a patient who asks a psychiatrist which chair to sit in. Whatever chair they pick, the psychiatrist shouts:')+
   L.quote('Aha! Everything counts!','punchline of the joke that opens chapter 5')+
   L.prose('Contracting is like that. Almost every event carries a message about what this client and this project will be like. The way you and the client deal with each other early on predicts how the project will go.')+
   L.note('So the key skill in contracting is to <b>notice the process</b> between you and the client (how you are dealing with each other) and to talk about it as it happens.','eye'));
  L.done();}},
{part:0,src:'Chapter 5 · The Contracting Meeting',run(L){
  L.h(L.kick('learn','The first call')+'<h1 class="q">Five questions to ask before you ever sit down</h1>'+
   L.prose('The meeting is usually set up by a call or an e-mail. Use it to find out what you are walking into:')+
   L.list([['chat','What do you want to discuss?','The topic, in the client’s words.'],
     ['person','Who is the client for this project?','And who asked for the meeting? That shows where responsibility sits.'],
     ['people','Who else will be there, in what roles?','So nobody important is a surprise.'],
     ['clock','How much time will we have?','“Half an hour” and “as long as we need” say different things about how much it matters.'],
     ['compass','Are we deciding how to start, or whether to do anything?','And will a proposal be needed?']],1)+
   '<p class="small" style="margin-top:10px">Asking these also signals that this is a 50/50 relationship: you are a responsible partner, not just a servant.</p>');
  L.done();}},
{part:0,src:'Chapter 5 · The Contracting Meeting',run(L){
  L.h(L.kick('ex','Jordan’s first call')+'<h1 class="q">Marcus calls Jordan about the damaged deliveries</h1>');
  L.beats(L.card,[
   ['The ask','Marcus: “My packers are careless. Design me a training course and run it next month. Can we meet?”'],
   ['Who asked?','Jordan asks how this came up. Marcus: “Lena told me to fix the complaints.” Someone above Marcus pushed this, so Marcus may feel pressure to act.'],
   ['Who and how long?','Just Marcus, for thirty minutes, between two shift meetings. A short slot is a small early clue about how much room this project will get.'],
   ['Which outcome?','Jordan asks: “Do you want to decide how to start, or whether a course is the right thing at all?” Marcus: “How to start. It’s decided.”'],
   ['What Jordan has','Before the meeting, Jordan already knows about pressure from Lena, a tight slot and a client who has picked the answer.']],
   'Five plain questions on the phone gave Jordan real data to prepare with, and told Marcus that Jordan is a partner, not an order-taker.');}},
{part:0,src:'Chapter 5 · The Contracting Meeting',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Why does it matter that the push for this project came from Lena, not from Marcus?</h1>');
  L.mc(L.card,['It shows the project has strong support from the top','It warns that Marcus may feel pushed into it','It means Jordan should report to Lena, not Marcus'],1,
   'When someone else suggests the meeting, Block calls that a warning flag: the manager may be acting under pressure.',
   'Block reads it the other way: when someone else suggested the meeting, the manager may feel pressured to go ahead. That is a warning flag about responsibility and commitment.');}},
{part:0,src:'Chapter 5 · Who Is the Client?',run(L){
  L.h(L.kick('learn','Who is the client?')+'<h1 class="q">Most projects have more than one client</h1>'+
   L.prose('The manager across the table is one '+L.g('client','client')+'. In general, the clients of a project are the people who:')+
   L.list([['Attend the first planning meeting',''],['Set the project’s objectives',''],['Approve any action taken',''],['Receive the report on your results',''],['Are strongly affected by the work','']],2)+
   L.note('A ground rule from chapter 4: you can’t contract with someone who is out of the room. Try to meet each person who started the project, even if they are very senior, to hear what they want from you.','people'));
  L.done();}},
{part:0,src:'Chapter 5 · Who Is the Client?',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Is this person a client of the deliveries project?',['A client','Not a client'],[
   ['Lena, who told Marcus to fix the complaints and will judge the result.',0,'Lena helped set the objective and will receive the results. They are a client, even if they never attend.'],
   ['The packers, whose daily work any change will hit.',0,'People strongly affected by the effort are clients too.'],
   ['A store manager in another city with no link to the DC.',1,'They don’t set objectives, approve action, receive results or feel the impact.'],
   ['Marcus, who called the meeting and will approve any plan.',0,'The line manager who starts the project is the most obvious client.'],
   ['The online shop’s web designer, who never touches deliveries.',1,'No part in setting, approving, receiving or being affected by this work.']]);}},

/* ---------- PART 2: OPENING ---------- */
{part:1,src:'Chapter 5 · Navigating the Contracting Meeting',run(L){
  L.h(L.kick('learn','The map of the meeting')+'<h1 class="q">Eight steps to a stable, balanced contract</h1>'+
   L.prose('Block lays out a sequence that ends either in an agreement to work together or an agreement not to. Following it makes sure you finish the business of contracting.')+
   L.tiers([['person','1–2 · Open','Make a personal acknowledgment. Show you understand the problem.',''],
            ['scale','3–4 · Exchange','The client’s wants and offers. Then your wants and offers.','',true,'The heart'],
            ['check','5 · Agree','Reach agreement, or get stuck (the next lesson).',''],
            ['shield','6–8 · Close','Ask about control and commitment. Give support. Restate who does what next.','']]));
  L.done();}},
{part:1,src:'Chapter 5 · Step 1: Make a Personal Acknowledgment',run(L){
  L.h(L.kick('learn','Step 1')+'<h1 class="q">Make a personal acknowledgment</h1>'+
   L.prose('Asking for help is hard in organizations, even for managers who want it. So the first job is to raise the comfort level between you.')+
   L.lanes([['x','Small talk','The weather, the game last night. Polite, but it says nothing about you or this meeting.',4],
            ['person','Personal statement','Say how you feel about being in this meeting today, and ask the client the same.',2]])+
   L.prose('For example: “I’ve never worked with the DC before. I’m glad you called.” Or: “Any concerns about working with me on this?”'));
  L.done();}},
{part:1,src:'Chapter 5 · Step 1: Make a Personal Acknowledgment',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Which opening line from Jordan is a personal acknowledgment?</h1>');
  L.mc(L.card,['“Busy week for the trucks, I bet. Did you see the game?”','“Let me start with our team’s training catalog.”','“Our history with the DC is bumpy. I’m glad to try again.”'],2,
   'It says how Jordan feels about this meeting with this client. Block’s own examples include one very like it.',
   'Small talk and jumping into the pitch both skip the personal part. Jordan should say how they feel about being here, like naming the bumpy history and being glad to restart.');}},
{part:1,src:'Chapter 5 · Step 2: Communicate Understanding of the Problem',run(L){
  L.h(L.kick('learn','Step 2')+'<h1 class="q">Answer three worries the client won’t say out loud</h1>'+
   L.prose('Clients are eager to describe the problem. Underneath, they often doubt you can help. That doubt comes out sideways: questions about your experience, your boss, your other work.')+
   L.flow([['star','“My situation is unique”','Name what really is different here.','acknowledge',1],
           ['layers','“It’s complicated”','Restate the problem in your own words.','restate',2],
           ['shield','“Can you even help?”','Reassure them, genuinely and tentatively.','reassure',3]])+
   L.prose('Use <b>short, simple sentences</b>. Don’t analyze the problem yet, and don’t sell. You don’t know the real problem yet; you are showing that you listened and that it seems workable.'));
  L.done();}},
{part:1,src:'Chapter 5 · Step 2: Communicate Understanding of the Problem',run(L){
  L.h(L.kick('ex','Jordan in the room')+'<h1 class="q">Marcus explains, Jordan responds in three moves</h1>');
  L.beats(L.card,[
   ['Marcus','“You don’t know this floor. Peak season, flat-pack and fragile glass on the same line, temp staff, Lena on my back. Nobody outside gets it.”'],
   ['Unique','Jordan: “Two things are unusual here: the pressure from above, and fragile and bulky goods on one line.”'],
   ['Restate','Jordan: “You’ve described a lot of breakages. What I hear is that you can’t trust the loads to arrive in one piece.” Marcus: “Exactly. How did you know?” It was just listening.'],
   ['Reassure','Jordan: “This is workable. It’s the kind of problem I’ve worked on, and I think I can help.” Not “I know the answer.” Jordan offers to help <i>find</i> a solution.'],
   ['What Jordan didn’t do','No ten-minute theory of root causes, no slides about Business Improvement. Short sentences, then on to specifics.']],
   'Acknowledge what is unique, restate the problem simply, reassure tentatively. Then move on.');}},
{part:1,src:'Chapter 5 · Step 2: Communicate Understanding of the Problem',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'What is Jordan doing here?',['Naming what’s unique','Restating the problem','Reassuring','Too much, too soon'],[
   ['“I can help you work this out. We’ve dealt with similar issues at the stores.”',2,'A genuine, tentative yes: Jordan can help find a solution, without claiming to know it.'],
   ['“Running two shifts with half the staff on temp contracts is unusual.”',0,'It puts into words what is genuinely different about this DC.'],
   ['“Underneath the breakages, what I hear is that you can’t predict which loads will go wrong.”',1,'Jordan says back the core of Marcus’s concern in their own short words.'],
   ['“The real cause is clearly your scheduling. Here’s my five-part model of why.”',3,'That is analysis before any discovery, and it may be wrong. Step 2 is about understanding, not diagnosis.'],
   ['“Our program has transformed every site that used it. You’ll love it.”',3,'That is selling. Block says to make a simple statement that it seems workable, and stop.']]);}},

/* ---------- PART 3: WANTS AND OFFERS ---------- */
{part:2,src:'Chapter 5 · Step 3. Client Wants and Offers',run(L){
  L.h(L.kick('learn','Step 3')+'<h1 class="q">Look the client in the eye and ask: “So, what do you want from me?”</h1>'+
   L.prose('Block calls this the heart of contracting. Ask it directly. Note the difference:')+
   L.lanes([['target','Wants from the project','Fewer failures, better cost control, more skilled supervisors.',3],
            ['person','Wants from <i>you</i>','A study, recommendations, a training program, personal advice, an evaluation of people.',2]])+
   L.prose('Then ask about <b>constraints</b> on how you work: “two weeks for a four-week job”, “don’t talk to hourly staff”, “don’t upset anybody”. How you proceed is often the hardest part to negotiate.')+
   L.prose('Finally, ask what the client <b>offers</b>: budget, their people’s time, and access to information.'));
  L.done();}},
{part:2,src:'Chapter 5 · Step 3. Client Wants and Offers',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Jordan asks what Marcus wants. Marcus says: “Fewer damaged deliveries, obviously.” What should Jordan ask next?</h1>');
  L.mc(L.card,['“And what do you want from me on this?”','“Shall I draft the course outline today?”','“How many damaged orders were there last month?”'],0,
   'Marcus named what they want from the project. Jordan still needs what Marcus wants from Jordan, and then the constraints and offers.',
   'Fewer damaged deliveries is what Marcus wants from the project, not from Jordan. Jumping to a course or to data skips the key question: “What do you want from me?”');}},
{part:2,src:'Chapter 5 · Step 4. Consultant Wants and Offers',run(L){
  L.h(L.kick('learn','Step 4')+'<h1 class="q">Now say what <i>you</i> want</h1>'+
   L.prose('Internal consultants find this hard: “We’re a service. Our job is to meet the client’s needs, not make demands.” Block calls that pure service attitude self-defeating. Your wants serve the project’s success, not your whims.')+
   L.tiers([['lock','Essential wants','The minimum. Without one, you are better off not starting. Examples: access to the key people, enough time, not having to evaluate individuals, access to records.','',true,'No deal without'],
            ['star','Desirable wants','Would make the project better, but you can live without them. Examples: someone from the client team to work with you, top management deeply involved.','']])+
   L.note('Under pressure, from hunger for a client or a boss who wants the client “in the fold”, we give in a little. Give in on an essential and the project is on shaky ground.','alert'));
  L.done();}},
{part:2,src:'Chapter 5 · Essential Wants; Desirable Wants',pts:6,run(L){
  L.h(L.kick('pr','Jordan’s want list')+'<h1 class="q">Jordan lists what they want from Marcus for the deliveries project. Sort each one.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Essential','Desirable'],[
   ['Access to the supervisors and packers involved in the damage',0,'Access to the key people who are part of the problem is on Block’s essential list.'],
   ['Not being asked to rate individual packers’ performance',0,'Block lists this agreement as a typical essential. Without it, people won’t talk openly.'],
   ['Marcus personally explaining the project to every shift',1,'It would help a lot, but Jordan could still succeed without it.'],
   ['Access to the damage reports and complaint records',0,'Access to the records you need is a typical essential.'],
   ['Marcus telling other site directors if it goes well',1,'Nice for Jordan’s reputation, but not needed for this project to work.'],
   ['A DC supervisor on the project team with Jordan',1,'Block lists someone from the client organization working with you as desirable.']],
   'Which wants are essential depends on the project, but Block’s rule is fixed: be honest, with neither greed nor self-sacrifice, and never trade an essential away.');}},
{part:2,src:'Chapter 5 · Essential Wants',pts:1,run(L){
  L.h(L.kick('pr','What would you do?')+'<h1 class="q">Mid-meeting, proposals are flying. Marcus suddenly offers: “Fine, but you only talk to the day-shift leads, not the packers.” Jordan isn’t sure. What should Jordan do?</h1>');
  L.mc(L.card,['Agree now and widen the access later, once trust exists','Push back hard until Marcus allows the packers in','Take a short break and check it against their essentials'],2,
   'Block suggests a three- or four-minute recess with one question: does this violate anything essential? If yes, say so plainly and keep looking for agreement.',
   'Agreeing and hoping risks giving up an essential. Pushing hard skips the thinking. Block’s advice: take a short recess and ask one question, “Does this break anything I consider essential?”');}},
{part:2,src:'Chapter 5 · Putting Wants into Words',pts:1,
 solve:async L=>{L.$('#tf').click();L.$('#ta').click();},
 run(L){
  const seen=new Set();
  const V={f:'“In our experience, change tends to last longer when there is visible reinforcement from leadership. Without it, learning can fade and the return on the time invested drops. That matters even more with temp staff turning over. Have you ever been to one of the floor sessions yourself?”',
           a:'“I’d like you to come to the first session with each shift.”'};
  L.h(L.kick('pr','Toggle and compare')+'<h1 class="q">Jordan wants Marcus to attend the first session with each shift. Hear it two ways.</h1>'+
   '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="chip" id="tf">'+L.ic('layers')+'Version A</button><button class="chip" id="ta">'+L.ic('chat')+'Version B</button></div>'+
   '<div style="background:var(--soft);border-radius:16px;padding:14px;margin:10px 0;min-height:110px" class="prose" id="tv"><span class="small">Tap a version.</span></div><div id="tq"></div>');
  const show=(k,b)=>{[L.$('#tf'),L.$('#ta')].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(k);L.$('#tv').innerHTML=V[k];
    if(seen.size===2&&!L.$('#tq').innerHTML){const q=L.$('#tq');q.innerHTML='<h2 class="sub">Which version gives Jordan the best chance of a clear answer?</h2>';
      L.mc(q,['Version A, because its reasons are spelled out','Version B, because the want is said plainly'],1,
       'Version A is a '+L.g('fogged','fogged')+' expression: true reasons, but the want is buried and ends in a hinting question. B is simple everyday language, so Marcus knows exactly what is asked.',
       'Every reason in A is true, but the want is buried under them and ends in a hinting question. Block says the plain statement is the more powerful one.');}};
  L.$('#tf').onclick=function(){show('f',this);};L.$('#ta').onclick=function(){show('a',this);};}},
{part:2,src:'Chapter 5 · Putting Wants into Words',pts:1,run(L){
  L.h(L.kick('pr','The skill, step by step')+'<h1 class="q">Put Block’s four moves for stating a want in order.</h1>');
  L.order(L.card,['State the want first, in simple everyday words','Be quiet and let the client react','If asked, give a two-sentence answer and restate the want','Be quiet and listen for a yes or no'],
   'Want first, reasons only if asked, and silence in between. You won’t always get a yes, but you will know where you stand.');}},
{part:2,src:'Chapter 5 · Consultant Offers (Step 4 Continued)',run(L){
  L.h(L.kick('learn','Step 4, continued')+'<h1 class="q">Offer only what you can control</h1>'+
   L.prose('Usually the consultant can promise a clear picture of what is happening, plus recommendations. Real improvements need the client to take their 50 percent, so they are a <b>joint</b> promise.')+
   L.lanes([['star','Magical offer','“The machine will be back in three days, and you’ll never have trouble with it again.”',4],
            ['check','Realistic offer','“The machine will be back in three days. After that, it’s up to you to keep it running.”',2]])+
   L.note('Two things to keep working on: state what you need clearly, even at the risk of <b>overstating</b> it; be cautious, even at the risk of <b>understating</b>, about the results you alone will deliver.','scale'));
  L.done();}},
{part:2,src:'Chapter 5 · Consultant Offers (Step 4 Continued)',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Marcus asks: “How soon will damage drop?” Tap each piece until Jordan’s offer is realistic.</h1>');
  L.sentence(L.card,[['“In four weeks I’ll give you','“In four weeks I’ll guarantee','“In four weeks Lena will see'],['a clear picture of what causes the damage and options to fix it.','a fifty percent drop in damaged deliveries.','a full new process running on every shift.'],['Making those changes stick is a job we do together.”','After that, the results are my responsibility.”','You won’t need to be involved at all.”']],[0,0,0],
   [['A guarantee promises results Jordan can’t control. That is the magical offer.','Promising what Lena will see sets up results Jordan doesn’t control.'],['A specific drop depends on what the DC does, not on Jordan alone.','Running a process on every shift is the DC’s work. Jordan can’t promise it.'],['Taking sole responsibility colludes with the wish to sit back and watch a miracle.','Leaving Marcus out breaks the 50/50 balance.']],
   'Jordan promises what they can control, a picture plus options, and names improvement as a joint job.');}},

/* ---------- PART 4: CLOSING ---------- */
{part:3,src:'Chapter 5 · Steps 5 to 8',run(L){
  L.h(L.kick('learn','Steps 5 to 8')+'<h1 class="q">Agreement isn’t the end of the meeting</h1>'+
   L.list([['check','5 · Reach agreement','Pause and enjoy it. Say you’re glad, and restate what you agreed.'],
     ['shield','6 · Ask about control and commitment','Weak contracts have two usual flaws: the client was quietly coerced, or later feels a loss of control. Ask: “Is this something you really want? Do you feel you have enough control over how it will go?”'],
     ['star','7 · Give support','Say something genuine and specific about what the client did well, like taking a risk or being clear about doubts.'],
     ['list','8 · Restate actions','Who does what next, in simple sentences.']],2)+
   '<p class="small" style="margin-top:10px">Ask step 6 with real interest, not a pleading tone. These are not hidden selling tricks.</p>');
  L.done();}},
{part:3,src:'Chapter 5 · Step 6: Ask for Feedback on Control and Commitment',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Jordan asks if Marcus really wants this project. Marcus admits: “Honestly? If Lena hadn’t pushed, I wouldn’t bother.” What now?</h1>');
  L.mc(L.card,['Withdraw, since a client who was pushed won’t commit','Thank Marcus and plan with the weak commitment in mind','Remind Marcus how much the project will help them'],1,
   'The point of asking is to know what you are up against, not to walk away. Naming the pressure can even raise Marcus’s commitment.',
   'Block says asking doesn’t mean pulling out, and it isn’t a cue to sell. Jordan now knows the contract is weaker, so they won’t overinvest or pretend it’s strong.');}},
{part:3,src:'Chapter 5 · Steps 5 to 8',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which closing step is Jordan on?',['5 · Agree','6 · Control and commitment','7 · Support','8 · Restate actions'],[
   ['“Do you feel you’ll have enough say in how the interviews run?”',1,'That tests whether Marcus feels in control.'],
   ['“I’ll be on the floor Tuesday at 6 a.m. You’ll tell both shifts why I’m there.”',3,'Who does what next, plainly stated.'],
   ['“So we start with interviews on both shifts. I’m really glad we agree.”',0,'Jordan pauses, says they’re pleased and restates the deal.'],
   ['“You were very open about Lena’s pressure. That will help a lot.”',2,'Genuine and specific: Marcus hears exactly what they did that was useful.'],
   ['“Is this a project you really want to see happen?”',1,'That tests commitment, the other half of step 6.']]);}},
{part:3,src:'Chapter 5 · Navigating the Contracting Meeting',pts:1,run(L){
  L.h(L.kick('pr','Putting it together')+'<h1 class="q">Put the eight steps of the contracting meeting in order.</h1>');
  L.order(L.card,['Make a personal acknowledgment','Communicate understanding of the problem','Client wants and offers','Consultant wants and offers','Reach agreement','Ask about control and commitment','Give support','Restate actions'],
   'Open personally, exchange wants and offers, agree, then three insurance steps to make the contract stable.');}}
  ]
});
</script>
</body>
</html>
