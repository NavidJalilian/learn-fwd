<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contracting Overview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0004', title:'Contracting overview', minutes:18, icon:'pencil',
  goals:['Explain why contracting is where a consultant has the most influence','Check a contract for free consent and a fair exchange on both sides','Use the elements and ground rules of contracting to spot a weak agreement'],
  parts:['Power with','Consent and consideration','What a contract covers','Ground rules'],
  read:'Read chapter 4 of the book for the example wording of each contract element and Checklist 2.',
  glossary:{
    'mutual-consent':'Mutual consent: both sides enter the agreement freely, by their own choice, not because they feel forced.',
    'valid-consideration':'Valid consideration: each side gets something of real value from the other. The consultant needs things too, not just the client.',
    'social-contract':'Social contract: an agreement made for clear communication about how you will work together, not for enforcement in court.',
    collusion:'Collusion: quietly agreeing, without saying so, to avoid a touchy subject, like control or the chances of success.'
  },
  cheatsheet:[
    'Aim for power <b>with</b> clients, not power <b>over</b> them. A pedestal is easy to topple.',
    '<b>Contracting</b> is your point of maximum leverage. A new contract is easier to set than an old one is to change.',
    'A contract is a <b>social contract</b>: an explicit agreement, written for clarity, not for court.',
    '<b>Mutual consent</b>: both enter freely. If they didn’t, later trouble is about the contract, not your work.',
    '<b>Valid consideration</b>: you need partnership, access, people’s time and room to innovate. “Don’t take my people’s time” is a warning sign.',
    'Always talk about control, vulnerability, your wants and the chances of success. Skipping them is <b>collusion</b>.',
    'Contract elements: boundaries, objectives, information, your role, product, client support, schedule, confidentiality, later feedback.',
    'Key ground rules: 50/50, all wants are legitimate, you can say no, contract for behavior not feelings, you can’t contract with someone not in the room.'
  ],
  steps:[
/* ---------- PART 1: POWER WITH ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">When is it easier to agree how two people will work together: on day one, or a year in, after habits have set?</h1>');
  L.mc(L.card,['A year in, once you know each other well','On day one, before habits have formed'],1,
   'Block makes the same point with a joke about marriage: setting a new agreement is much easier than reworking an old one.',
   'Knowing each other helps, but habits are hard to undo. Block’s point is that a new agreement is far easier to set than an old one is to change.');}},
{part:0,src:'Chapter 4 · Contracting Overview',run(L){
  L.h(L.kick('learn','What consultants secretly want')+'<h1 class="q">Power <i>over</i> the client, or power <i>with</i> them?</h1>'+
   L.prose('Ask consultants what they want to learn and the first answers are practical: how to set up a project, how to build trust. Underneath, Block says, many want to know how to get clients to do what they want.')+
   L.lanes([['alert','Power over','You on a pedestal, the client on the ground. Unstable: managers are rewarded for keeping control and know how to topple you.',4],
            ['people','Power with','Direct, useful influence while standing on the same level as the client.',2]])+
   L.note('Power over the client is a no-win position. Power with them is the realistic goal.','scale'));
  L.done();}},
{part:0,src:'Chapter 4 · Contracting: The Concept and the Skill',run(L){
  L.h(L.kick('learn','Why contracting matters so much')+'<h1 class="q">The start of a project is your point of maximum leverage</h1>'+
   L.quote('The contract sets the tone for the project.','Peter Block, chapter 4')+
   L.prose('Some chances to influence a project exist only at the start. Miss them in contracting and they may be gone for good.')+
   L.prose('A '+L.g('contract','contract')+' is simply an explicit agreement about what consultant and client expect from each other and how they will work together. It is usually spoken, sometimes written. Either way it is a '+L.g('social-contract','social contract')+': made for clear communication, not for enforcement.'));
  L.done();}},
{part:0,src:'Chapter 4 · Contracting: The Concept and the Skill',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Jordan thinks: “I’ll just start on the deliveries work with Marcus and sort out expectations as we go.” What does chapter 4 suggest?</h1>');
  L.mc(L.card,['Fine, expectations are easier to agree once work is underway','Settle them now, since changing an old deal is harder','Wait until Lena sets the expectations for both of them'],1,
   'Contracting is the point of maximum leverage. Some influence is lost for the life of the project if Jordan doesn’t use it now.',
   'The book says the opposite: chances for impact may be lost for good if they are not taken in contracting. Agree expectations with Marcus now.');}},

/* ---------- PART 2: CONSENT AND CONSIDERATION ---------- */
{part:1,src:'Chapter 4 · Mutual Consent',run(L){
  L.h(L.kick('learn','The first legal idea that fits')+'<h1 class="q">Mutual consent: both sides choose freely</h1>'+
   L.prose('Block keeps the word “contract” because two legal ideas apply to consulting. The first is '+L.g('mutual-consent','mutual consent')+': both sides enter by their own choice.')+
   L.prose('Many forces push people into projects they don’t want:')+
   L.list([['people','“Everybody is doing it”','A manager starts an employee survey because it’s the thing to do, not because they want one.'],
     ['alert','Internal “shoulds”','A support person believes they should never say no to a line manager.'],
     ['x','Direct pressure','Sometimes the push is simply an order.']],4)+
   L.note('Often you can’t get a fully free contract. That’s OK. But when the client is unhappy later, name the real problem: the <b>unbalanced contract</b>, not the quality of your work.','info'));
  L.done();}},
{part:1,src:'Chapter 4 · Mutual Consent',run(L){
  L.h(L.kick('ex','How it plays out at Copperleaf')+'<h1 class="q">Jordan, Renata and a contract nobody chose</h1>');
  L.beats(L.card,[
   ['The pressure','Renata, Jordan’s boss, tells the team: “We don’t turn down the DC. Whatever Marcus asks for, we do.”'],
   ['The request','Marcus asks for a packer training course, run next month. Jordan doubts training is the answer but feels they can’t say no.'],
   ['The deal','Jordan agrees. They now have an agreement about work, but not a solid contract: Jordan did not enter it freely.'],
   ['Two months later','Complaints haven’t dropped. Marcus says the course was badly designed.'],
   ['The real issue','The problem to name is the unbalanced start, not the slides. Jordan can say: “I agreed to this while doubting it would help. Let’s look at how we set it up.”']],
   'When a project goes sour, look first at how freely both sides entered it.');}},
{part:1,src:'Chapter 4 · Valid Consideration',run(L){
  L.h(L.kick('learn','The second legal idea that fits')+'<h1 class="q">Valid consideration: something of value flows both ways</h1>'+
   L.prose('Internal consultants focus on what they give: advice, analysis, reflection. For '+L.g('valid-consideration','valid consideration')+', the consultant must also <b>get</b> something. Appreciation is nice, but Block lists more tangible needs:')+
   L.list([['layers','Operational partnership','Influence on what happens, hearing about important events, respect for what you bring.'],
     ['lock','Access','Freedom to go after the people and data that seem relevant.'],
     ['clock','Time of line people','Usually the biggest cost of any change. “Don’t take up my people’s time” is a warning sign.'],
     ['bulb','Room to innovate','The chance to try something new, asked for openly, not slipped in.']],2)+
   '<p class="small" style="margin-top:10px">Underplay your own wants at the start and you weaken your leverage.</p>');
  L.done();}},
{part:1,src:'Chapter 4 · Valid Consideration',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Jordan tells Renata: “Honestly, all I need from Marcus is a thank-you at the end.” What is the problem?</h1>');
  L.mc(L.card,['Jordan is asking for too much from a busy manager','Nothing, thanks are the main reward of support work','Jordan is skipping the tangible things they need'],2,
   'Appreciation may matter emotionally, but a solid contract also needs access, people’s time, partnership and room to innovate.',
   'Block says appreciation is emotionally real, but not enough. Without tangible wants like access and people’s time, the exchange is lopsided and Jordan’s leverage drops.');}},
{part:1,src:'Chapter 4 · Valid Consideration',pts:1,
 solve:async L=>{const c=L.$('#cw').children;[0,1,2].forEach(i=>c[i].click());},
 run(L){
  const W=[['Access to the floor and the damage data',1],['Time with the shift supervisors',1],['A say in what happens with the findings',1],['A thank-you email at the end',0]];
  const on=new Set();
  L.h(L.kick('pr','Balance the scale')+'<h1 class="q">Jordan offers Marcus an analysis and a plan. Tap what Jordan should ask for in return until the contract balances.</h1>'+
   '<div class="meterrow"><div class="lb">Marcus gets</div><div class="meter"><div style="width:75%;background:var(--h1)"></div></div></div>'+
   '<div class="meterrow"><div class="lb">Jordan gets</div><div class="meter"><div id="jm" style="width:5%;background:var(--h3)"></div></div></div>'+
   '<div class="small" id="bs" style="margin:6px 0 10px">Lopsided: Jordan gets almost nothing.</div><div id="cw"></div><div id="cq"></div>');
  W.forEach((w,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=w[0];
    b.onclick=()=>{if(on.has(j)){on.delete(j);b.classList.remove('sel');}else{on.add(j);b.classList.add('sel');}
      const t=[...on].filter(x=>W[x][1]).length,v=[...on].some(x=>!W[x][1]);
      const m=L.$('#jm');m.style.width=(5+t*23+(v?3:0))+'%';m.style.background=t===3?'var(--ok-strong)':'var(--h3)';
      L.$('#bs').innerHTML=t===3?'<b>Balanced.</b> Both sides now give and get something real.':(v&&t===0?'A thank-you is nice, but it barely moves the scale.':'Getting closer. What else would Jordan need to do good work?');
      if(t===3&&!L.$('#cq').innerHTML){const q=L.$('#cq');q.innerHTML='<h2 class="sub">Marcus replies: “Sure, but don’t take up my supervisors’ time.” What does that tell Jordan?</h2>';
        L.mc(q,['The contract is uneven and needs another look','Marcus is being considerate of the supervisors'],0,
         'Block calls this a warning signal. People’s time is the biggest cost of any change, so the deal needs renegotiating.',
         'It may feel considerate, but Block calls it a warning sign: the line people’s time is the main cost of change. Without it the contract is uneven.');}};
    L.$('#cw').appendChild(b);});}},
{part:1,src:'Chapter 4 · Mutual Consent; Valid Consideration',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which part of the contract is weak?',['Consent','Consideration'],[
   ['Marcus agrees to the project only because every other site director has signed up for one.',0,'“Everybody is doing it” is a pressure, not a free choice.'],
   ['Jordan gets the go-ahead but is told the damage data is “not for outside the DC”.',1,'Access to information is something Jordan needs in return. Without it the exchange is lopsided.'],
   ['Jordan takes on the work because they believe support staff should never refuse a director.',0,'An internal “should” is coercion too. Jordan didn’t enter freely.'],
   ['Marcus wants a new method tried but says Jordan must “keep it standard, nothing new”.',1,'Room to innovate is one of the consultant’s legitimate wants. Ask for it openly.']]);}},

/* ---------- PART 3: WHAT A CONTRACT COVERS ---------- */
{part:2,src:'Chapter 4 · Contracting Skills',run(L){
  L.h(L.kick('learn','Contracting flawlessly')+'<h1 class="q">The same two questions, applied to contracting</h1>'+
   L.prose('To contract '+L.g('flawless','flawlessly')+' is to be authentic and finish the business of contracting: negotiate wants, cope with mixed motivation, surface concerns about exposure and control, make the contract clear to everyone involved, and give the client support.')+
   L.list([['person','Ask who the client is','Including the less visible parties.'],['chat','Say clearly what you want','And draw out what the client expects of you.'],['x','Say no or postpone','When you judge the project has less than a 50/50 chance.'],['eye','Probe for underlying concerns','About losing control, and about exposure and vulnerability.'],['alert','Talk about the meeting itself','When it isn’t going well, say so.']],1)+
   L.note('A contracting meeting can run smoothly without touching control, vulnerability, your wants or the chances of success. That is '+L.g('collusion','collusion')+'. Block says these talks are <b>always</b> necessary.','alert'));
  L.done();}},
{part:2,src:'Chapter 4 · Contracting Skills',pts:1,run(L){
  L.h(L.kick('pr','What would you do?')+'<h1 class="q">Jordan’s first meeting with Marcus was friendly and quick. They never discussed Marcus’s worry about looking bad to Lena. Jordan thinks: “I’ll raise it if it becomes necessary.” What should Jordan do?</h1>');
  L.mc(L.card,['Wait, since raising it now could spoil a good start','Raise it now, since that talk is always necessary','Mention it to Renata and let them handle Marcus'],1,
   'Skipping it is a quiet agreement to avoid a touchy subject. Block says talking about exposure and vulnerability is always necessary.',
   '“I’ll deal with it if necessary” is the rationalization Block warns about. It’s always necessary, and Jordan should raise it directly with Marcus.');}},
{part:2,src:'Chapter 4 · Elements of a Contract',run(L){
  L.h(L.kick('learn','The elements of a contract')+'<h1 class="q">Nine things most contracts should cover</h1>'+
   L.prose('Should you write it down? If you have the time, yes: for <b>clarity</b>, not enforcement. Writing forces you to be explicit, and it tests whether the contract is solid. Keep it brief and almost conversational.')+
   L.list([['Boundaries','What you will look at, and what you won’t.'],['Objectives','The improvements you expect, kept realistic.'],['Kind of information','The data, attitudes and roles you need access to.'],['Your role','How you want to work together, for example 50/50.'],['The product','What you will hand over, and how specific it will be.'],['Support from the client','What the client offers you. The heart of the contract for the consultant.'],['Time schedule','Start, check-ins, end.'],['Confidentiality','Who sees what.'],['Feedback to you later','Optional: hear about the impact months afterward.']],3));
  L.done();}},
{part:2,src:'Chapter 4 · Elements of a Contract',run(L){
  L.h(L.kick('ex','Jordan drafts a contract')+'<h1 class="q">A short letter to Marcus, one element at a time</h1>');
  L.beats(L.card,[
   ['Boundaries','“We’ll look at how furniture orders are packed and loaded at the DC. We won’t look at the delivery carriers.”'],
   ['Objectives','Block names four areas: solve a business problem, create a new possibility, teach the client to solve it next time, and improve how the problem is managed. Jordan writes: “Cut damaged deliveries, and help your supervisors run this kind of analysis themselves.”'],
   ['Information and role','“We’ll need damage reports and packing schedules, and to talk with supervisors on both shifts. We’ll share responsibility 50/50 for the findings and the plan.”'],
   ['The product','“A short list of key findings, with recommendations we develop together at a half-day meeting.” Block says unclear products are a major cause of client disappointment.'],
   ['Support from Marcus','“You’ll tell your teams why this project exists, and give each supervisor two hours for interviews.”'],
   ['Schedule and confidentiality','“Six weeks, with a check-in at week three. Findings go to you first. If Business Improvement must share results more widely, we’ll tell you first and invite you.”']],
   'A written contract makes Jordan say exactly what they will do and what they need, and it tests whether the agreement is solid.');}},
{part:2,src:'Chapter 4 · Elements of a Contract',pts:6,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which element is this line?',['Boundaries','Objectives','Product','Client support','Confidentiality'],[
   ['“We won’t look into the online shop’s returns process.”',0,'Saying what you won’t cover sets the boundaries.'],
   ['“Marcus will join the first interview day to introduce the project.”',3,'This is something the client offers Jordan. That is client support.'],
   ['“You’ll receive a ten-page written report with specific recommendations.”',2,'Format, length and specificity describe the product.'],
   ['“A second goal is that supervisors can run this analysis on their own.”',1,'Teaching the client to solve it next time is a learning objective.'],
   ['“Lena will see the results only after Marcus has reviewed them.”',4,'Who sees what, and when, is confidentiality.'],
   ['“The project should cut damaged deliveries by a third.”',1,'An expected improvement is an objective.']]);}},
{part:2,src:'Chapter 4 · Elements of a Contract',pts:1,run(L){
  L.h(L.kick('pr','Confidentiality inside a company')+'<h1 class="q">As an internal consultant, Jordan knows the findings must also go to Lena. What does the book suggest Jordan do?</h1>');
  L.mc(L.card,['Tell Marcus at the start who will get copies','Keep it quiet so Marcus stays open in the interviews','Promise Marcus the findings stay private anyway'],0,
   'Internal consultants may have no choice about sending a report up the line. What they can do is say so up front, which gives the client a choice about how to protect themselves.',
   'Hiding it or promising what Jordan can’t deliver will break trust later. Block’s advice: acknowledge up front who must get copies, so Marcus can decide how to protect themselves.');}},

/* ---------- PART 4: GROUND RULES ---------- */
{part:3,src:'Chapter 4 · Ground Rules for Contracting',run(L){
  L.h(L.kick('learn','Ground rules for contracting')+'<h1 class="q">Fourteen rules, in five groups. Tap each group.</h1>');
  L.flips(L.card,[
   ['Balance (rules 1–3)','Every relationship is 50/50. The contract should be freely entered. You can’t get something for nothing; both sides give, even boss and employee.'],
   ['Wants (rules 4–6)','All wants are legitimate; nobody can say “you shouldn’t want that”. You can say no to what others want, even clients. You won’t always get what you want, and you’ll survive.'],
   ['Limits (rules 7–9)','You can contract for behavior, not for someone to change their feelings. You can’t ask for what the other person doesn’t have, or promise what you can’t deliver.'],
   ['Who and when (rules 10, 13)','You can’t contract with someone who isn’t in the room, like the client’s boss; meet them directly. Contracts need specific deadlines or a duration.'],
   ['Keeping it alive (rules 11, 12, 14)','Write contracts down when you can; most break from neglect. They are always renegotiable; be glad when a client says so instead of just doing it. Good contracts need good faith and some luck.']],
   'Block learned these rules at a Gestalt psychology workshop and has used them ever since.');}},
{part:3,src:'Chapter 4 · Ground Rules for Contracting',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Jordan asks to interview the night shift too. Marcus snaps: “You shouldn’t even want that.” Which ground rule helps Jordan here?</h1>');
  L.mc(L.card,['You can’t get something for nothing','All wants are legitimate','Contracts need a deadline'],1,
   'Wanting is a birthright. Marcus can say no, but not that Jordan shouldn’t want it. Then they can negotiate.',
   'That rule is real, but the issue here is Marcus judging Jordan’s want. The rule is “all wants are legitimate”: Marcus may refuse, but can’t rule the want out.');}},
{part:3,src:'Chapter 4 · Ground Rules for Contracting',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which ground rule applies?',['Not in the room','Behavior, not feelings','You can say no','Renegotiable'],[
   ['Marcus says: “Lena is fine with whatever we agree. No need to talk to them.”',0,'Jordan can’t contract with Lena through Marcus. They need to meet Lena directly.'],
   ['Marcus wants Jordan to “make the packers actually care about the furniture”.',1,'Jordan can agree to actions, not to changing how people feel.'],
   ['Three weeks in, Marcus says they want to drop the interviews and just get a checklist.',3,'Social contracts are always renegotiable. Be glad Marcus said it out loud.'],
   ['Marcus asks Jordan to also redesign the DC’s whole shift pattern this month. Jordan has no time.',2,'Jordan may say no to what a client wants, even a director.'],
   ['Jordan wants Marcus to stop feeling annoyed about the project before work starts.',1,'Jordan can ask Marcus for specific actions, not for a change of feelings.']]);}},
{part:3,src:'Chapter 4 · Ground Rules for Contracting',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Marcus asks: “Can you make my packers care more?” Tap each piece until Jordan’s reply follows the ground rules.</h1>');
  L.sentence(L.card,[['“I can promise they’ll care more,','“I can’t promise how your packers feel,','“Their feelings are up to Renata,'],['but I can run a session with each shift,','and I’ll fix it alone so you don’t have to,','so I’ll wait for them to change first,'],['by the end of next month.”','whenever it feels right.”','for as long as it takes.”']],[1,0,0],
   [['That promises a change in feelings, which no one can contract for.','That passes the problem to someone not in the room.'],['Taking it all on means Marcus gives nothing back. Contracts are 50/50.','Waiting for feelings to change leaves nothing to agree on.'],['A contract needs a specific deadline or duration.','Open-ended means no deadline. Contracts need a set time.']],
   'Jordan contracts for behavior, not feelings, offers something specific, and sets a deadline. Three ground rules in one sentence.');}},
{part:3,src:'Chapter 4 · Ground Rules for Contracting',pts:1,run(L){
  L.h(L.kick('pr','Putting it together')+'<h1 class="q">Renata asks Jordan for a one-line test of whether the Marcus contract is solid. Which test fits this chapter best?</h1>');
  L.mc(L.card,['Marcus signed a detailed written agreement','Marcus has approved everything Jordan proposed','Both chose freely and both get something real'],2,
   'Mutual consent and valid consideration are the two legal ideas Block borrows. If both hold, the contract is on solid ground.',
   'A signature or an approval can still hide a coerced or one-sided deal. The test is mutual consent and valid consideration: both chose freely and both get something real.');}}
  ]
});
</script>
</body>
</html>
