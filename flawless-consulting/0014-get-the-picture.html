<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get the Picture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0014', title:'Get the picture', minutes:19, icon:'eye',
  goals:['Plan a discovery: strategy, people, fewer than twenty questions, the right methods','Gather data on how the problem is being managed, including how you are treated','Peel a problem through three layers down to what the client is doing'],
  parts:['Plan it','Methods and bias','How it’s managed','Three layers'],
  read:'Read chapter 13 of the book for the full list of dimensions to ask about and Checklists 5 and 6 for planning and reviewing a discovery meeting.',
  glossary:{
    'layers':'Three layers of analysis: the presenting problem, what others are doing to cause it, and what the client is doing to cause it.',
    'funnel':'Funneling: reducing everything you heard and saw to a few issues that focus energy.',
    'victim-stance':'Victim stance: seeing the problem as caused entirely by others, with no part of your own in it and no power to act.'
  },
  cheatsheet:[
    'The business of discovery: dig through <b>three layers</b>, read the management climate, handle resistance, pick a process that builds ownership, and reduce it all to a few issues with meaning.',
    'Ask <b>fewer than twenty</b> questions. Too much data overwhelms. Asking creates expectations of feedback.',
    'Six ways to find out: interview, survey, documents, observation, <b>your own experience</b>, whole-system discovery.',
    'Your hunch about the problem is <b>insight, not bias</b>. Use it, and keep listening for what you didn’t expect.',
    'Always look at <b>how the situation is being managed</b>. Two or three questions reveal most of it, and it is how your ideas will be managed too.',
    'Every question teaches. If an interview gives nothing, say so, and stop rather than go through the motions.',
    'Layers: the presenting problem, what others do, what <b>the client</b> does. Stuck? “Suppose you did know your role. What would it be?”',
    'How the client treats you is valid data about how they manage everyone.'
  ],
  steps:[
/* ---------- PART 1: PLAN IT ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Jordan drafts 60 interview questions for each of 30 people at the DC. What is the most likely result?</h1>');
  L.mc(L.card,['A clearer, more complete picture','A pile of data too big to use'],1,
   'Right. The book’s advice is to keep questions to fewer than twenty, because too much data overwhelms.',
   'More questions feel thorough, but 1,800 answers bury the picture. The book says to keep it to fewer than twenty questions.');}},
{part:0,src:'Chapter 13 · Get the Picture',run(L){
  L.h(L.kick('learn','The business of this phase')+'<h1 class="q">What discovery has to get done</h1>'+
   L.prose('Whether you chose a problem or possibility focus, and third-party or whole-system discovery, the phase has the same business:')+
   L.list([['Dig through three layers','The presenting problem, what others are doing, what the client is doing. For a possibility, define the organizing question instead.'],
     ['Read the climate','How the group is managed, so you know how action will be received.'],
     ['Handle resistance','When people hold back information or don’t fully engage.'],
     ['Pick a process that builds ownership','The discovery itself changes the organization.'],
     ['Reduce and give meaning','Cut it to a manageable number of issues, then give them language and order that leads to change.']],1));
  L.done();}},
{part:0,src:'Chapter 13 · The Steps in Getting the Picture',run(L){
  L.h(L.kick('learn','The steps in getting the picture')+'<h1 class="q">Fourteen steps, whether it’s six months or six minutes</h1>'+
   L.flow([['compass','Set up','1 Redecide to proceed · 2 Choose strategy · 3 Presenting problem · 4 Who is involved · 5 Dimensions','',1],
           ['eye','Gather','6 Methods · 7 Collect','',2],
           ['layers','Make sense','8 Funnel · 9 Summarize · 10 Meaning','',3],
           ['play','Act','11 Feedback meeting · 12 Recommend · 13 Decide · 14 Implement','',4]])+
   L.note('Step 1 is a joint decision with the client, driven by a wish to improve, not just to do research. Step 14 is the payoff: stay for it, even on your own time.','info'));
  L.done();}},
{part:0,src:'Chapter 13 · The Steps in Getting the Picture',run(L){
  L.h(L.kick('ex','Copperleaf')+'<h1 class="q">Jordan plans the damaged-deliveries discovery</h1>');
  L.beats(L.card,[
   ['Redecide','Jordan and Marcus agree again to go ahead, because they want fewer damaged deliveries, not a study for its own sake.'],
   ['Who is involved','Packers and supervisors from both shifts, two drivers and someone from customer service. More variety, richer picture.'],
   ['Fewer than twenty','Jordan cuts a long draft down to fourteen questions, including a few on how decisions and schedules get made.'],
   ['Collect','Jordan interviews until the answers start to repeat, then remembers that asking is itself a way of engaging people.'],
   ['Funnel','Dozens of pages become four issues. The aim is to focus energy, not to describe the universe.'],
   ['Feedback meeting','Jordan plans most of the time for discussion, not presentation, and a way to tell every interviewee the results.']],
   'Decide together, involve a wide mix, ask a few questions, then shrink what you learn to what can move people.');}},
{part:0,src:'Chapter 13 · The Steps in Getting the Picture',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Jordan plans to survey all 200 DC staff, with no plan to share the results. What does the book warn about?</h1>');
  L.mc(L.card,['Asking creates an expectation of change and feedback','Surveys of 200 people take too long to analyze'],0,
   'Asking people questions creates expectations that something will shift and that they’ll hear the results. Plan how they will find out.',
   'Time matters, but the book’s warning is different: asking people questions creates an expectation that they’ll hear back and that something will change.');}},
{part:0,src:'Chapter 13 · The Steps in Getting the Picture',pts:1,run(L){
  L.h(L.kick('pr','Put it in order')+'<h1 class="q">Arrange these steps of getting the picture.</h1>');
  L.order(L.card,[
   'Redecide with the client to proceed',
   'Select the discovery strategy',
   'Identify the presenting problem',
   'Decide who will be involved',
   'Collect data and observations',
   'Funnel it to a few issues'],
   'Decide together, choose problem or possibility and who leads, start from the presenting problem, pick the people, collect, then funnel.');}},

/* ---------- PART 2: METHODS AND BIAS ---------- */
{part:1,src:'Chapter 13 · Step 6: Select the Method(s) of Inquiry',run(L){
  L.h(L.kick('learn','Only a few ways to find out')+'<h1 class="q">Six methods, each with a trade-off</h1>'+
   L.tiers([['chat','Interview','One-on-one or in a group, structured or open. Where the relationship gets built.'],
            ['list','Survey','Good for large numbers. Slower to prepare, and numbers can be hard to interpret.'],
            ['book','Documents','Numbers, results, written messages. Costs only your time and looks objective.'],
            ['eye','Direct observation','Sit in on key events, look at the equipment. Maybe your only first-hand data.'],
            ['person','Your own experience','You are managed like everyone else. How you are treated is valid data.',true,'Often ignored'],
            ['people','Whole-system','Bring the stakeholders together. You facilitate more than you interview.']])+
   '<p class="small" style="margin-top:10px">Pick what fits the time, management’s motivation and the purpose of the work.</p>');
  L.done();}},
{part:1,src:'Chapter 13 · Step 6: Select the Method(s) of Inquiry',pts:6,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which method is Jordan using?',['Interview','Survey','Documents','Observation','Own experience','Whole-system'],[
   ['Jordan stands at the loading dock during the 6 a.m. rush and watches.',3,'Being there first-hand is direct observation.'],
   ['Jordan pulls six months of complaint records and loading times.',2,'Existing numbers and reports are document analysis.'],
   ['Marcus cancels Jordan twice and then gives them ten minutes in a hallway.',4,'How Jordan is treated is data on how Marcus manages.'],
   ['A short questionnaire goes to both shifts.',1,'Reaching many people with the same questions is a survey.'],
   ['Packers, drivers and supervisors map the damage problem together in one room.',5,'The stakeholders do the discovery together; Jordan facilitates.'],
   ['Jordan sits down with a day-shift supervisor for forty minutes.',0,'A face-to-face conversation is an interview.']]);}},
{part:1,src:'Chapter 13 · A Word About Bias',run(L){
  L.h(L.kick('learn','A word about bias')+'<h1 class="q">Your hunch is insight, not bias</h1>'+
   L.prose('Choosing what to look at already defines the problem a little. Block says not to worry about this. Especially as an internal consultant, you often have an idea of what is wrong before you start.')+
   L.lanes([['check','Do','Trust your hunch. It tells you where to spend discovery time. Pick dimensions of how the problem is managed that you’re comfortable with, and go.',2],
            ['eye','And also','Keep listening for issues you didn’t expect. If something new shows up, follow it.',3]]));
  L.done();}},
{part:1,src:'Chapter 13 · A Word About Bias',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Jordan suspects last-minute schedule changes matter, and worries that asking about them will bias the study. What does the book say?</h1>');
  L.mc(L.card,['Leave it out so the data stays neutral','Ask about it, and listen for other issues too','Ask only after every other question is done'],1,
   'Treat the hunch as insight: it shows where to look. Just keep listening for what you didn’t expect.',
   'The book says your sense of the problem is useful information, not bias to hide or delay. Use it, and keep listening for other issues.');}},

/* ---------- PART 3: HOW IT IS MANAGED ---------- */
{part:2,src:'Chapter 13 · Assessing How the Situation Is Being Managed',run(L){
  L.h(L.kick('learn','How the situation is being managed')+'<h1 class="q">Sample the questions Block suggests. Flip each card.</h1>');
  L.flips(L.card,[
   ['Objectives','How clear are the goals, and how much do people agree on them?'],
   ['Subgroups','Which groups support each other, which are in conflict, and who gets left out?'],
   ['Support','How is support shown? In many groups, silence means “I like what you do.”'],
   ['Evaluation','Do people know where they stand, and can they ask?'],
   ['Positive history','What made this place great? What are people proud of and want to keep?'],
   ['Decision making','How are decisions made, and what role does the boss play?'],
   ['Conflict','Is conflict confronted, smoothed over, forced or ignored?'],
   ['Going forward','How hopeful are people? What obstacles do they see to your ideas?']],
   'The book lists sixteen such areas, including power, status, norms, leadership, domination, diversity and attitudes to you. You won’t use them all.');}},
{part:2,src:'Chapter 13 · Assessing How the Situation Is Being Managed',run(L){
  L.h(L.kick('learn','Why bother?')+'<h1 class="q">How they manage this is how they’ll manage you</h1>'+
   L.prose('Scan the list and the relevant areas will stand out. Asking any two or three questions gives you data on many of the rest.')+
   L.flow([['eye','Now','How the group handles today’s problem','',1],['arrow','Next','Is how it will handle your recommendations','',3]])+
   L.prose('Use this data even if the client never asked for it. Managers rarely get an accurate read on how their group works, because everyone around them has a stake. You have less of one, so you can raise sensitive issues. That is your <b>unique</b> value.'));
  L.done();}},
{part:2,src:'Chapter 13 · Assessing How the Situation Is Being Managed',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which area does this answer tell Jordan about?',['Support','Evaluation','Decision making','Subgroups','Positive history'],[
   ['“If Marcus likes what you do, they leave you alone.”',0,'Support shown through silence, which the book names as common.'],
   ['“You only find out where you stand when something breaks.”',1,'Whether people know where they stand is evaluation.'],
   ['“Marcus decides the rota. We hear about it at shift change.”',2,'How decisions get made, and the boss’s role in them.'],
   ['“Day shift thinks the night crew has it easy.”',3,'The relationship between groups that must work together.'],
   ['“We used to be the fastest DC in the region, and proud of it.”',4,'Stories of what made the place great.']]);}},
{part:2,src:'Chapter 13 · The Discovery Interview',run(L){
  L.h(L.kick('ex','Copperleaf')+'<h1 class="q">Two interviews, two lessons</h1>');
  L.beats(L.card,[
   ['A joint learning event','Jordan asks a day-shift supervisor: “How do you hear about customer complaints?” The supervisor pauses. “I don’t, really.”'],
   ['The question teaches','Just asking shows what Jordan thinks matters. The supervisor leaves thinking about it. Discovery is already changing the DC.'],
   ['A hard interview','A packer answers everything with “fine” and “dunno”. Jordan names it: “You seem reluctant to talk about this.” Then waits.'],
   ['Still nothing','Jordan says plainly: “I’m not getting what I need, and I don’t want to waste your time.”'],
   ['Stop','Jordan ends the interview. The packer later tells Kofi that Jordan “didn’t fake it”.']],
   'Every question tells people what matters. When an interview is empty, say so and stop; going through the motions costs trust.');}},
{part:2,src:'Chapter 13 · The Discovery Interview',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Jordan named the resistance, waited, and said they weren’t getting what they need. The interview is still empty. What next?</h1>');
  L.mc(L.card,['Finish all the questions anyway, politely','Ask the packer’s supervisor to step in','End the interview, at least for now'],2,
   'You build more trust by stopping than by going mechanically through questions while both of you know nothing is happening.',
   'Pressing on fakes a conversation, and bringing in a supervisor adds pressure. The book says to stop: that builds more trust.');}},

/* ---------- PART 4: THREE LAYERS ---------- */
{part:3,src:'Chapter 13 · Levels of Analysis',run(L){
  L.h(L.kick('learn','Three layers of analysis')+'<h1 class="q">Problems have layers, like an onion</h1>'+
   L.prose('The '+L.g('presenting-problem','presenting problem')+' is usually stated in a way that feels hopeless. If it didn’t, it would already be solved. Take it at face value and you get stuck.')+
   L.tiers([['box','Top layer','The technical or business problem.','“What problem are you experiencing?”'],
            ['people','Second layer','What others are doing to cause or keep the problem.','“What are other people or groups doing that keeps this going?”'],
            ['person','Third layer','What the client is doing, on purpose or by not paying attention.','“What is your role in sustaining all of this?”',true,'Most actionable']])+
   '<p class="small" style="margin-top:10px">The deeper you go, the closer you get to causes the person can act on.</p>');
  L.done();}},
{part:3,src:'Chapter 13 · Levels of Analysis',pts:1,
 solve:async L=>{for(let i=0;i<3;i++){const b=L.$('#nx');if(b)b.click();}},
 run(L){
  const R=[['Top layer','“Complaints about damaged deliveries have doubled.”'],
           ['Second layer','“My packers are careless, and the supervisors don’t enforce anything.”'],
           ['Third layer','“What am I doing? Nothing. Finding that out is your job.”']];
  let lv=0;
  L.h(L.kick('pr','Peel the onion')+'<h1 class="q">Jordan is interviewing Marcus. Ask for the next layer each time.</h1><div class="ladder" id="ld"></div><button class="btn pri" id="nx">'+L.ic('down')+'Ask the next layer</button><div id="hq"></div>');
  const draw=()=>{L.$('#ld').innerHTML=R.slice(0,lv).map((x,j)=>(j?'<div class="conn"></div>':'')+'<div class="rung'+(j===lv-1?' cur':'')+'"><small>'+x[0]+'</small>'+x[1]+'</div>').join('');};
  L.$('#nx').onclick=function(){lv++;draw();if(lv>=3){this.remove();const q=L.$('#hq');
    q.innerHTML='<h2 class="sub">Marcus deflects. What should Jordan ask now?</h2>';
    L.mc(q,['“Suppose you did know your role. What would it be?”','“Fine. Let’s go back to what the packers are doing.”','“Well, you do override the schedules quite a lot.”'],0,
     'Marcus: “I suppose… I push hard on loading speed, and I move people around at short notice.” Now there is something Marcus can act on.',
     'Going back to the packers drops the third layer, and jumping to your own view takes it from Marcus. The book’s question: “Suppose you did know…”');}};}},
{part:3,src:'Chapter 13 · Levels of Analysis',run(L){
  L.h(L.kick('learn','Victims or players')+'<h1 class="q">The real search is for unused power to act</h1>'+
   L.prose('When someone says “I don’t know what I’m doing to cause this”, be a little skeptical. People usually have some idea; they’re reluctant to say it.')+
   L.prose('If they truly don’t see themselves as part of it, that is data too. A '+L.g('victim-stance','victim stance')+' may be a pattern in how the group is managed, and it drains the energy available to act on your ideas.')+
   L.note('The goal is a statement of the problem someone can <b>do something about</b>, not research about organizations. Going deeper is a search for unused resources to solve it.','compass'));
  L.done();}},
{part:3,src:'Chapter 13 · Levels of Analysis',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which layer is this?',['Top layer','Second layer','Third layer'],[
   ['A supervisor: “Loading takes too long and items get scratched.”',0,'A business problem, stated in organizational terms.'],
   ['A supervisor: “Head office never sends us the complaint numbers.”',1,'What another group is doing to keep the problem going.'],
   ['Marcus: “When I pull people to another dock at short notice, the packing gets rushed.”',2,'Marcus names their own part in it.'],
   ['A driver: “The packers wrap things too loosely.”',1,'Blaming another group is the second layer.'],
   ['A supervisor: “I stopped raising damage in huddles because nothing changed.”',2,'The speaker’s own contribution, by not giving it attention.']]);}},
{part:3,src:'Chapter 13 · Your Experience as Data',run(L){
  L.h(L.kick('learn','Your experience as data')+'<h1 class="q">Notice how the client manages you</h1>'+
   L.prose('The client manages you the same way they manage other people and resources. To understand their style, watch how you’re treated.')+
   L.list([['Control','Do you feel controlled, listened to, supported?'],['Respect','Are you treated with respect or disdain?'],['Decisions','Are decisions with you shared, or one-way?'],['Options','Is the client open to options, or always on one track?']],2)+
   L.prose('These observations are valid data. Noticing them early tells you where to look in how the problem is being managed.'));
  L.done();}},
{part:3,src:'Chapter 13 · Your Experience as Data',pts:1,run(L){
  L.h(L.kick('pr','What would you do?')+'<h1 class="q">Marcus has moved Jordan’s interview slot three times this week, each at an hour’s notice. How should Jordan treat this?</h1>');
  L.mc(L.card,['As noise: Marcus is just a busy director','As a personal slight to raise right away','As data: it may mirror how the floor is managed'],2,
   'It matches the supervisors’ story of schedules overridden at short notice. How Marcus treats Jordan is valid data about how Marcus manages.',
   'It isn’t noise, and it isn’t personal. How the client treats you is valid data, and it echoes the supervisors’ schedules being overridden.');}},
{part:3,src:'Chapter 13 · Levels of Analysis',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Tap each piece until it becomes a third-layer question for Marcus.</h1>');
  L.sentence(L.card,[['What are the packers doing','What are you doing','What is head office doing'],['in how you manage the floor','in the new training plan'],['that might keep the damage going?','that the report got wrong?']],[1,0,0],
   [['That asks about others: the second layer.','That also points at others: the second layer.'],['A training plan is a solution, not Marcus’s way of managing.'],['That invites a debate about the report, not a look at Marcus’s part.']],
   '“What are you doing in how you manage the floor that might keep the damage going?” That is the third layer.');}},
{part:3,src:'Chapter 13 · Checklist #5: Planning a Discovery Meeting',pts:4,run(L){
  L.h(L.kick('pr','Support or confront?')+'<h1 class="q">Checklist 5 asks how you can support and confront in a discovery meeting. Sort Jordan’s moves.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Support','Confront'],[
   ['“Thanks for being this candid with me.”',0,'Thanking the client for candor is a supporting statement.'],
   ['“You keep answering before I finish the question.”',1,'Naming that the client controls the discussion too much is confronting.'],
   ['“Many DCs struggle with this. It’s a hard one.”',0,'Acknowledging the difficulty and describing similar cases supports.'],
   ['“You’ve said twice the damage is minor. The numbers say otherwise.”',1,'Naming that the client plays down the problem is confronting.']],
   'A good discovery meeting does both: support the client, and confront what gets in the way of good data.');}}
  ]
});
</script>
</body>
</html>
