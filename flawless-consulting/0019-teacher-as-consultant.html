<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Teacher as Consultant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0019', title:'Teacher as consultant', minutes:19, icon:'book',
  goals:['Tell a “teacher as knower” stance from a consultant’s stance toward learners','Recontract with a group that didn’t choose to be there, starting with power with, not power over','Run a room where honesty, failure and not knowing are safe, and learners define success'],
  parts:['Knower or consultant','A new contract','An honest room','The choice'],
  read:'Read chapter 18 of the book for Ward Mailliard’s story in his own words, including Sandy’s year and the Washington, D.C. trip.',
  glossary:{
    'consultant-stance':'Consultant’s stance (in teaching): treating learners as a system you are not part of, and putting your expertise at the service of their learning instead of driving it.',
    'social-contract':'Social contract: an agreement about how two sides will work together, made for clear communication rather than enforcement. In a classroom it is usually unspoken: who holds power and what teacher and students owe each other.',
    'team-lead-program':'Team-lead program: Jordan’s six-week program for newly promoted team leads from the stores, the DC and Eastgate.'
  },
  cheatsheet:[
    'Shift from <b>teacher as knower</b> to <b>consultant to learning</b>: the learners are a system you are not part of.',
    'The grades-equal-success deal works for a minority and runs on <b>fear</b>. Performance replaces learning.',
    'Start from <b>humanity and abundance</b>: people with gifts, not cases with deficiencies. Do discovery before you tell anyone anything.',
    '<b>Recontract</b>: make the plan with the group, not for it. Move from power over to <b>power with</b>, and build trust between learners.',
    'New contract: honesty over defense, <b>failure is an option</b>, gifts are the point, not knowing is safe.',
    'Grader and consultant at once? Put it on the table. Ask what they want of themselves and of you, and how they’ll know they succeeded.',
    'Most learning comes from <b>speaking and doing</b>. Give up some content so people can learn.',
    'Even when attendance is required, <b>choice exists</b>. Ask what you are conserving: trust and cooperation, or fear and competition.'
  ],
  steps:[
/* ---------- PART 1: KNOWER OR CONSULTANT ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Renata asks Jordan to run a six-week program for newly promoted team leads. Each lead was told to attend by their manager. How will most of them show up in week one?</h1>');
  L.mc(L.card,['Keen, since the program is a perk','Polite, guarded, doing the minimum'],1,
   'People who didn’t choose to be in a room tend to comply and hold back. This chapter is about a teacher who faced exactly that, and what he did about it.',
   'Being sent is not the same as choosing. People who didn’t choose to come usually comply politely and hold back. This chapter is about a teacher who faced exactly that.');}},
{part:0,src:'Chapter 18 · The Story',run(L){
  L.h(L.kick('learn','A teacher reads this book')+'<h1 class="q">Ward Mailliard stopped acting as the one who knows</h1>'+
   L.prose('Ward Mailliard is a high school teacher. After reading this book, he decided that trying harder at the usual things (curriculum, consequences, measurement) wouldn’t change much. He had to look at himself and at the <b>contract</b> between him and his students.')+
   L.flow([['person','Teacher as knower','Has the knowledge, sets the plan, judges the result','information flows one way'],['people','Consultant to learning','Learns about the students first, then serves their learning','power is shared']])+
   L.prose('He took the book’s definition of consulting: any action you take with a system you are not part of. Teenagers, he noticed, have their own culture, rules and language. The teacher is outside it. So he took a '+L.g('consultant-stance','consultant’s stance')+' toward them.')+
   '<p class="small">Block tells Ward’s story to tie the whole book together: contracting, discovery, resistance, gifts and engagement, all in one classroom.</p>');
  L.done();}},
{part:0,src:'Chapter 18 · Assumptions About Motivating Students',run(L){
  L.h(L.kick('learn','The deal behind the old way')+'<h1 class="q">The grades equation, and what it costs</h1>'+
   L.prose('The usual classroom runs on a simple promise:')+
   L.flow([['star','Grades','',''],['trend','Performance','',''],['arrow','Advancement','',''],['shield','Security','','']])+
   L.prose('It’s a reasonable theory, but it works for only a <b>minority</b> of students. When it fails, someone gets blamed: the student, the family or the teacher. And because teenagers have plenty of distractions and few levers anyone can pull, teachers are left holding the last tools of authority: grades, threats and shame. The relationship runs on <b>fear</b>.')+
   L.note('The result, Ward says: <b>performance replaces learning</b>. Teachers become entertainers or disciplinarians, or quietly lower expectations. Students lose the pleasure of learning, teachers lose the joy of teaching.','alert'));
  L.done();}},
{part:0,src:'Chapter 18 · Assumptions About Motivating Students',run(L){
  L.h(L.kick('ex','Copperleaf')+'<h1 class="q">Renata’s brief for the team-lead program looks familiar</h1>');
  L.beats(L.card,[
   ['The brief','Renata hands Jordan a 30-slide deck of “learning points”, a quiz for the last day, and a form: Jordan must rate each lead “ready” or “not ready” for their manager.'],
   ['The cohort','Fourteen new '+L.g('team-lead-program','team leads')+' from the stores, the DC and Eastgate. Among them: Sam Reyes (DC day shift), Mei Tan (a store lead), Ines Ruiz (online customer service) and Theo Grant (Eastgate).'],
   ['The equation','Jordan sees Ward’s deal in a new form: sit through the slides, pass the quiz, get “ready” from Jordan, keep the new role.'],
   ['The risk','That deal makes Jordan the judge and the leads an audience. They’ll learn to look ready, not to lead.'],
   ['The question','Jordan wonders: what if I stopped thinking of myself as the teacher and became a consultant to their learning?']],
   'The grades equation isn’t only a school thing. Any program built on “sit, absorb, get rated” makes performance the point.');}},
{part:0,src:'Chapter 18 · The Reality',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Which question shows Jordan taking a consultant’s stance toward the leads?</h1>');
  L.mc(L.card,['How do I get the leads to absorb this content?','What could I learn from the leads that helps me?'],1,
   'That’s Ward’s shift: from teacher as knower to teacher as learner. Jordan first learns about the system before serving it.',
   'Asking how to get content into people keeps Jordan as the knower and the leads as receivers. Ward’s shift starts with what the teacher can learn from the learners.');}},
{part:0,src:'Chapter 18 · Taking a Consultant’s Stance',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Knower or consultant?',['Teacher as knower','Consultant to learning'],[
   ['Jordan finalizes all six weeks of agenda before meeting a single lead.',0,'The plan is made for the group, not with it. The teacher drives.'],
   ['Jordan spends week one asking leads what makes their first months hard.',1,'Discovery first: learn about the system before offering expertise.'],
   ['Jordan judges the program by how many leads pass the final quiz.',0,'That makes performance the point, the core of the grades equation.'],
   ['Jordan asks the leads how they will know the six weeks were worth it.',1,'The learners help define success. That’s contracting, not telling.'],
   ['When Sam pushes back on a slide, Jordan repeats the point more firmly.',0,'Pushing harder treats Sam as a receiver. A consultant would get curious about the pushback.']]);}},

/* ---------- PART 2: A NEW CONTRACT ---------- */
{part:1,src:'Chapter 18 · Context of Humanity and Abundance',run(L){
  L.h(L.kick('learn','Start from a new context')+'<h1 class="q">People with gifts, not cases to fix</h1>'+
   L.lanes([['alert','Old context','Students with deficiencies and needs. Labels lead: the slow reader, the disruptive one.',4],
            ['star','New context','Human beings, each with gifts in abundance, even when facing real challenges.',2]])+
   L.prose('From that context, Ward couldn’t walk in and start telling students what to do. First he did <b>discovery</b>, just as a consultant would: ask about their goals, intentions and challenges, and see how they were managing the problem of learning.')+
   L.prose('This doesn’t throw out expertise. Ward still knew his subject (technical skills) and how to relate to people (interpersonal skills). What changed was the third set: <b>consulting skills</b>.'));
  L.done();}},
{part:1,src:'Chapter 18 · Renegotiating the Social Contract',run(L){
  L.h(L.kick('learn','Renegotiate the contract')+'<h1 class="q">In most classrooms the contract is never discussed</h1>'+
   L.prose('The '+L.g('social-contract','social contract')+' in a traditional class is implicit, fear-based and one-sided. Many students aren’t there by choice, and without choice, accountability and enthusiasm are hard to come by.')+
   L.list([['pencil','Plan with them, not for them','Instead of arriving with a finished plan, make the plan with the class and explore the contracting questions first.'],
     ['scale','Power with, not power over','Ward moved from “How do I have power over my students?” to “How do I have power with them?” When he asked, he found caring under the mask of indifference.'],
     ['people','Trust between learners','When the teacher holds all the power, students who show they care pay a social price. Ward contracted for how students treat each other, not just for how they treat him.']],1));
  L.done();}},
{part:1,src:'Chapter 18 · Consultant Building Trust',run(L){
  L.h(L.kick('ex','Two moments from Ward’s class')+'<h1 class="q">How a consultant builds trust in a room</h1>');
  L.beats(L.card,[
   ['A hurtful comment','A student is hurt by negative comments from classmates. Ward stops the class and asks her permission to use the moment for learning. She gives a tentative yes.'],
   ['Just listen','She says how it felt: it shut her down. The students who made the comments are asked only to listen, not defend. Something shifts. Later both sides talk.'],
   ['No book, again','Another day, Margaret arrives without her book, maybe for the fourth time. Ward could see a “student without a book.” He sees a story waiting to be told.'],
   ['The story','He asks what’s going on. Her parents are in a hard divorce; she left the book at her dad’s house after a fight. Ward lets the book go.'],
   ['The trade','He gives up punishment for the sake of connection. He gains influence by acting like a consultant, not a parent.']],
   'In both moments Ward acted as a third party in discovery mode: not expert, not judge. He got interested instead of making someone wrong.');}},
{part:1,src:'Chapter 18 · Focusing on Trust Between Students',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">In week two, Ines jokes that “store leads just stack cushions all day.” Mei, a store lead, goes quiet. What does Jordan do?</h1>');
  L.mc(L.card,['Keep the pace and talk to Ines privately later','With Mei’s OK, let Mei say how it landed','Remind the whole group of the respect rule'],1,
   'That’s Ward’s move: ask permission, let the person who was hurt speak, and ask the others just to listen. It turns the moment into learning about how the group treats each other.',
   'Handling it later, or quoting a rule, keeps Jordan as the referee. Ward paused, asked permission, and let the hurt person speak while others just listened. That builds trust between learners.');}},
{part:1,src:'Chapter 18 · Conserving Trust and Relatedness',pts:1,
 solve:async L=>{L.$('#la').click();L.$('#lb').click();},
 run(L){
  const seen=new Set();
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Week three. Sam Reyes arrives without the pre-work, again. Look at Sam through each lens.</h1>'+
   L.lanes([['x','“Lead without pre-work”','Jordan reminds Sam the pre-work is required.<div class="res" id="ra"></div>',4],
            ['chat','“A story waiting to be told”','Jordan asks Sam what got in the way.<div class="res" id="rb"></div>',2]])+
   '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px"><button class="btn" id="la">'+L.ic('x')+'First lens</button><button class="btn" id="lb">'+L.ic('chat')+'Second lens</button></div><div id="hq"></div>');
  const next=()=>{if(seen.size<2||L.$('#hq').innerHTML)return;const q=L.$('#hq');
    q.innerHTML='<h2 class="sub">What did the second lens give Jordan that the first didn’t?</h2>';
    L.mc(q,['Real information about Sam’s situation','A firmer rule for the next cohort'],0,
     'Getting interested instead of making Sam wrong produced data Jordan can use, and a relationship Sam can trust.',
     'The second lens didn’t make any rule. It produced real information (Sam was covering extra shifts at short notice) and a relationship. That’s what Ward gained with Margaret.');};
  L.$('#la').onclick=function(){this.disabled=true;seen.add(0);L.$('#ra').innerHTML='<span style="color:var(--no)">Sam says “sorry, won’t happen again,” and goes quiet for the rest of the session.</span>';next();};
  L.$('#lb').onclick=function(){this.disabled=true;seen.add(1);L.$('#rb').innerHTML='<span style="color:var(--ok)">Sam explains they covered two extra shifts this week at short notice. The group starts swapping ideas on handling last-minute changes.</span>';next();};}},
{part:1,src:'Chapter 18 · Renegotiating the Social Contract',pts:6,run(L){
  L.h(L.kick('pr','Old deal or new deal?')+'<h1 class="q">Sort each of Jordan’s possible moves.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Old contract','New contract'],[
   ['Hand out the six-week agenda on day one, finished',0,'The plan is made for the group, not with it.'],
   ['Spend the first session asking what leads want from the program',1,'Exploring the contracting questions first is Ward’s move.'],
   ['Tell the leads the “ready” rating depends on attendance',0,'That uses the rating as a lever of control: power over.'],
   ['Ask the leads how they want to treat each other in the room',1,'Ward contracted for trust between learners, not only with the teacher.'],
   ['Ask what the leads want from Jordan, and what Jordan wants from them',1,'An exchange of wants is the heart of any contract in this book.'],
   ['Keep cold-calling the quiet ones to keep everyone alert',0,'That keeps attention through pressure, the fear-based deal.']],
   'The new contract is made together, shares power and covers how learners treat each other. The old one is handed down and held in place by ratings.');}},

/* ---------- PART 3: AN HONEST ROOM ---------- */
{part:2,src:'Chapter 18 · The New Contract',run(L){
  L.h(L.kick('learn','Elements of Ward’s new contract')+'<h1 class="q">Make it safe to tell the truth, to fail and to not know</h1>'+
   L.list([['eye','Honesty over defense','If you ask who read the homework and 60 percent didn’t, do you want to hear it? Meet unwelcome truths with curiosity, not criticism, or you teach people to lie.'],
     ['leaf','Failure is an option; gifts are the point','Failure, resistance and being wrong are okay: they’re where learning starts. No reprisals. Look for the gift in every student, even if it takes reframing.'],
     ['bulb','Not knowing','The usual cost of not knowing is shame for the student and disappointment for the teacher. That disappointment means holding on to who we want them to be, not seeing who they are.']],2)+
   '<p class="small" style="margin-top:10px">Ward remembered the book’s view of resistance: a sign something important is going on, not a problem to overcome.</p>');
  L.done();}},
{part:2,src:'Chapter 18 · Failure Is an Option; Gifts Are the Point',run(L){
  L.h(L.kick('ex','Sandy’s year')+'<h1 class="q">From “delayed processor” to deep processor</h1>');
  L.beats(L.card,[
   ['The label','Sandy is dyslexic and afraid of going out. Asked about herself, those are the first things she says. Professionals call her a “delayed processor.”'],
   ['The reframe','Ward decides she is a deep processor: she holds depth over speed. Then he sees her sketching and knows she’s an artist. He stops naming her for what she can’t do.'],
   ['The test','Sandy is scared of the week-long class trip and considers not going. Together, with her parents, they agree on a plan: whenever the fear shows up, she volunteers to go first.'],
   ['The gift','Courage becomes another of her gifts. Failing is okay, speaking slowly is okay, she works at her own pace.'],
   ['Graduation','Each senior gives a three-minute speech about the year. Sandy’s is the only one that gets a standing ovation.']],
   'Ward didn’t ignore Sandy’s challenges. He chose to build on what she could do, and made failure safe enough for her to try.');}},
{part:2,src:'Chapter 18 · Conserving Honesty Versus Defense',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Jordan asks, “Who did the reading?” Every hand goes up, but the discussion shows few did. What would Ward do?</h1>');
  L.mc(L.card,['Get curious about why saying no felt unsafe','Add a short quiz to check the reading next week','Praise those who read to motivate the rest'],0,
   'The hands went up because the room taught people that the honest answer costs them. Curiosity, not criticism, is how you make honesty safe.',
   'A quiz or selective praise adds pressure, which teaches people to look compliant. Ward asks what the room is teaching people about honesty, and meets the truth with curiosity.');}},
{part:2,src:'Chapter 18 · How to Deal with Functions of Umpire (Grader) and Consultant (Facilitator) at the Same Time',run(L){
  L.h(L.kick('learn','Grader and consultant at once')+'<h1 class="q">You can’t drop the grade, so put it on the table</h1>'+
   L.prose('A teacher must still grade. Ward’s answer to the umpire-and-consultant paradox: make it a <b>community conversation</b>. Teacher and students contract together on how to meet the outside requirement without letting it run the class.')+
   L.lanes([['people','Ask the learners','What do you want from this class? What do you want of yourselves? How will you know you succeeded?',2],
            ['person','Ask about you','What do you want from me? How can I support what you’re trying to do?',3]])+
   L.prose('Even single assignments change. Instead of “What do you remember?” ask “What struck you? What challenged you? What value did this have for you?”'));
  L.done();}},
{part:2,src:'Chapter 18 · Conserving Learning Methods Versus Teaching Methods',pts:1,run(L){
  L.h(L.kick('learn','Learning methods, not teaching methods')+'<h1 class="q">Most learning comes from speaking and doing</h1>'+
   L.flow([['eye','Listen, read, see','where most class time goes','',3],['chat','Speak, do','where most learning happens','',2]])+
   L.prose('One of Ward’s students put it bluntly: in small groups with peers they learned; when the teacher talked, they didn’t listen. If nobody is listening, why speak? So a teacher may have to <b>give up some content</b> to gain real engagement.')+
   '<div id="lq"><h2 class="sub">Jordan has 30 slides for a 90-minute session. What does this idea suggest?</h2></div>');
  L.mc(L.$('#lq'),['Present all 30 slides, but at a faster pace','Cut slides to make room for leads to practice'],1,
   'Fewer slides, more speaking and doing. Giving up content is the price of learning that sticks.',
   'Faster slides means more listening, the weakest way to learn. Cut content so the leads can speak and practice.');}},
{part:2,src:'Chapter 18 · Failure Is an Option; Gifts Are the Point',pts:1,run(L){
  L.h(L.kick('pr','Reframe it')+'<h1 class="q">Mei Tan rarely speaks first in the group. Tap each piece until the sentence sees Mei the way Ward saw Sandy.</h1>');
  L.sentence(L.card,[['a slow responder','a careful thinker','a weak speaker'],['who must speed up','who needs coaching','who holds depth'],['so Jordan asks what Mei can already do','so Jordan lists what Mei is missing','so Jordan sets Mei a target']],[1,2,0],
   [['“Slow responder” names a deficiency, like “delayed processor.”','“Weak speaker” is a label for what Mei can’t do.'],['That keeps the focus on fixing Mei.','Coaching what? It still starts from a gap.'],['Listing gaps is the old context: deficiencies, not gifts.','A target keeps Mei performing, not learning.']],
   'That’s Sandy’s reframe: name the gift, then build from what the person can already do.');}},
{part:2,src:'Chapter 18 · The New Contract',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which part of the new contract?',['Honesty over defense','Failure is okay','Not knowing is safe','Learning methods'],[
   ['Jordan says: “If the role-play falls apart, good. That’s where we learn.”',1,'Permission to fail, with no reprisals.'],
   ['Sam admits they don’t know how to run a shift huddle. Jordan says, “Nor did I, at first,” and the group works it out.',2,'No shame for the learner, no disappointment from Jordan.'],
   ['Jordan swaps a 20-minute talk for pairs practicing a hard conversation.',3,'Speaking and doing over listening.'],
   ['Ines says the pre-work felt pointless. Jordan asks what would have been useful.',0,'Curiosity, not criticism, when hearing what you didn’t want to hear.'],
   ['Theo hasn’t tried the new scheduling tool yet and says so. Jordan thanks Theo for the honesty and asks what got in the way.',0,'Making the truth cheap to tell is how you stop teaching people to lie.']]);}},

/* ---------- PART 4: THE CHOICE ---------- */
{part:3,src:'Chapter 18 · The Trip to Washington, D.C.',run(L){
  L.h(L.kick('learn','The core project')+'<h1 class="q">Ward hands the class trip to the students</h1>'+
   L.prose('For almost twenty years Ward had led a class trip to Washington, D.C., where students interview leaders of government and non-governmental organizations. It went well, and his old story was that it worked because <i>he</i> managed it well.')+
   L.prose('He wanted more commitment. So he asked: what if the students defined success, set the goals and designed the trip, and he became a <b>consultant to their project</b>? He used the contracting chapters of this book as his guide:')+
   L.list([['check','Mutual consent','Agreement both sides freely give.'],['person','Personal acknowledgment','Recognizing each person at the start.'],['scale','Exchange of wants','Students and teacher each say what they want.'],['shield','Control and vulnerability','Testing how each side feels about both.'],['target','A shared product','Agreeing together what the outcome is.']],1));
  L.done();}},
{part:3,src:'Chapter 18 · The Trip to Washington, D.C.',run(L){
  L.h(L.kick('ex','What happened')+'<h1 class="q">Given a choice, the students chose more</h1>');
  L.beats(L.card,[
   ['Their goals','Though none had been to Washington, the students named everything Ward knew to be important from two decades of trips. The vision was already in them; he only had to ask.'],
   ['Ward’s honesty','He told them this way of working was new to him and he’d be learning alongside them. He let himself be “caught learning.” It felt, he said, like being peeled.'],
   ['Getting stuck','Sometimes the process stalled and Ward didn’t have the answer. He brought in an experienced consultant friend, and Block joined by phone to take questions.'],
   ['Losing center stage','Ward was often not the center of the learning. That felt like a loss of control and more vulnerability.'],
   ['The answer','At the school assembly afterward, someone asked what having a choice had done. The students said that because they chose, they engaged even when unsure, took responsibility and were more present.']],
   'Giving up control made Ward vulnerable, and that is what built trust. Without some mutuality, learners stay reluctant performers.');}},
{part:3,src:'Chapter 18 · The Trip to Washington, D.C.',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Jordan has never run a program the leads design themselves. In week one, Mei asks, “Have you done it this way before?” What should Jordan say?</h1>');
  L.mc(L.card,['“Many times. Trust the process and it will work.”','“No. It’s new to me, and I’ll be learning with you.”'],1,
   'That’s Ward being “caught learning.” Honesty about not knowing makes Jordan vulnerable, and that’s what builds trust.',
   'Claiming experience Jordan doesn’t have is nonauthentic, and it puts Jordan back in the expert seat. Ward told students plainly the approach was new to him.');}},
{part:3,src:'Chapter 18 · The Choice in the Matter',run(L){
  L.h(L.kick('learn','The choice in the matter')+'<h1 class="q">Even when attendance is required, choice exists</h1>'+
   L.prose('A workplace consultant knows the client can say no. A teacher tends to forget that students can too. Under pressure to cover content, teachers act as if nobody has a choice, and fall back on threats about grades, college and future earnings.')+
   L.prose('The cost: the things that make an educated life worth living, such as citizenship, discernment, passion and surprise, get sacrificed for a promise of future security.')+
   L.quote('What am I conserving in my manner of living?','Ward Mailliard, quoted in chapter 18')+
   L.lanes([['leaf','Conserving','Trust, intimacy and cooperation',2],['alert','Or conserving','Fear, isolation and competition',4]])+
   '<p class="small" style="margin-top:10px">Block says these same questions sit at the core of how we consult to anyone.</p>');
  L.done();}},
{part:3,src:'Chapter 18 · The Choice in the Matter',pts:6,run(L){
  L.h(L.kick('pr','What is Jordan conserving?')+'<h1 class="q">Sort each move in the team-lead program.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Trust and cooperation','Fear and competition'],[
   ['Posting a ranking of quiz scores on the wall',1,'Ranking leads against each other breeds competition and isolation.'],
   ['Pairing leads to coach each other between sessions',0,'It builds relationships and shared learning.'],
   ['Warning that a “not ready” rating will reach their manager',1,'That’s the threat-based lever: comply or else.'],
   ['Asking each lead what they want of themselves in six weeks',0,'It treats them as people with a choice.'],
   ['Letting the group decide how the last session will run',0,'Shared power over the work, like Ward’s trip.'],
   ['Singling out the lead who missed a session, in front of all',1,'Public shame keeps people safe by keeping them quiet.']],
   'Every small design choice conserves something. Ward’s question helps Jordan notice which.');}},
{part:3,src:'Chapter 18 · How to Deal with Functions of Umpire (Grader) and Consultant (Facilitator) at the Same Time',pts:1,run(L){
  L.h(L.kick('pr','Jordan’s decision')+'<h1 class="q">Renata still needs a “ready” or “not ready” for each lead. Jordan doesn’t want the rating to run the room. What should Jordan do?</h1><div id="hq"></div>');
  L.mc(L.$('#hq'),['Fill in the ratings quietly and never mention them','Raise the rating with the leads and contract on it','Refuse to give ratings and tell Renata it’s unfair'],1,
   'That’s Ward’s answer to grader-and-consultant: put the outside requirement on the table and decide together how to meet it without letting it dominate.',
   'Hiding the rating keeps power secret, and refusing ignores a real requirement from Renata, who is Jordan’s client too. Ward made grading a community conversation.');}}
  ]
});
</script>
</body>
</html>
