<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>When Contracting Gets Stuck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0006', title:'When contracting gets stuck', minutes:19, icon:'compass',
  goals:['Notice early that a contracting meeting is stuck','Get unstuck by changing wants and offers, then talking about the meeting itself','Say no, or shrink a project, when agreement isn’t possible, and sell your services the same way you contract'],
  parts:['Knowing you’re stuck','Getting unstuck','Saying no','Selling and closing'],
  read:'Read the second half of chapter 5 of the book for Checklists 3 and 4 and Block’s own story about selling without charisma.',
  glossary:{
    impasse:'Impasse: a point in a discussion where neither side will move, so the talk goes round in circles.',
    'org-code':'Organizational code: polite phrases people use instead of saying what they mean, like “I’ll get back to you” for “I don’t want to do this”.',
    'mini-consultation':'Mini-consultation: a short live demonstration, about twenty minutes, where the consultant works on a real problem of the manager’s so they can feel what working together would be like.'
  },
  cheatsheet:[
    'Signs you’re stuck: <b>third</b> explanation (yours or theirs), yawns and low energy, body language that says “no” while words say “yes”.',
    'Learn the <b>code</b>: “I don’t understand it” often means “I don’t like it”; “I’ll get back to you” often means “I don’t want to”.',
    'Stuck path: think or recess → new wants and offers → if stuck again, talk about <b>how the meeting is going</b> → rediscuss → end it or shrink it.',
    'Most stuck contracting is about trust, control or feeling misunderstood, not the project details. Say <b>“I think we are stuck.”</b>',
    'Saying no avoids failure and wasted effort. If you can’t say no: postpone, shrink the scope, and tell your boss it starts on shaky ground.',
    'Selling: name the problem, check it, state your want, admit it’s a sales call. Remove obstacles; don’t add pressure.',
    '“No time” or “no money” usually means “no motivation”. Don’t collude; find the real reason.',
    'Close by asking how you’ll measure success, and leave twenty minutes for reservations about the meeting and about you.'
  ],
  steps:[
/* ---------- PART 1: KNOWING YOU'RE STUCK ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">You’ve explained your idea to a manager three times, each time more clearly. They still say, “I just don’t quite see it.” What is most likely going on?</h1>');
  L.mc(L.card,['They understand you, but they don’t agree','You still haven’t found the right words'],0,
   'Block’s view exactly. By the third try, the problem isn’t clarity. It’s disagreement.',
   'A fourth, clearer explanation rarely helps. Block says that by the third try, the problem is lack of agreement, not lack of clarity.');}},
{part:0,src:'Chapter 5 · Knowing When You Are Stuck',run(L){
  L.h(L.kick('learn','Two jobs when you’re stuck')+'<h1 class="q">First, know you’re stuck. Then do something about it.</h1>'+
   L.prose('It’s easy to think you’re having a reasonable discussion of pros and cons when you have actually hit an '+L.g('impasse','impasse')+'. Block gives four clear signals:')+
   L.list([['chat','You explain for the third time','Each try uses clearer words. By the third, admit it: you’re stuck.'],
     ['cycle','The client explains for the third time','“Let me put it another way…” They think you don’t understand. You do; you just don’t agree.'],
     ['clock','Your body slows down','Swallowed yawns, aching shoulders, glancing at your watch. Boredom and tiredness are often irritation you are holding back.'],
     ['eye','Your eyes see a different story','The client leans back, pushes away with their hands, while their words sound keen.']],3)+
   '<p class="small" style="margin-top:10px">If you were making progress, your energy would be rising. Falling energy usually means you aren’t getting what you want.</p>');
  L.done();}},
{part:0,src:'Chapter 5 · Knowing When You Are Stuck',run(L){
  L.h(L.kick('learn','The organizational code')+'<h1 class="q">People rarely say “no” out loud</h1>'+
   L.prose('Much of what is said at work is in '+L.g('org-code','code')+'. Block lists several translations. Two of them:')+
   L.lanes([['chat','What they say','“I don’t understand it.”<br><br>“I’ll get back to you.”',3],
            ['eye','What they often mean','I don’t like it.<br><br>I don’t want to do it.',4]])+
   L.prose('When you think “they just don’t understand me,” the truth is often that they do understand and they don’t agree. So don’t explain a fourth and fifth time. Admit to yourself that you are stuck.')+
   L.note('Silence can be code too. It may mean “I don’t understand a word you are saying.”','info'));
  L.done();}},
{part:0,src:'Chapter 5 · Knowing When You Are Stuck',run(L){
  L.h(L.kick('ex','Back in the room with Marcus')+'<h1 class="q">The deliveries meeting hits a wall</h1>');
  L.beats(L.card,[
   ['Jordan’s want','Jordan asks to interview packers on both shifts before designing anything. Marcus frowns: “Why? I told you, they’re careless.”'],
   ['Round two','Jordan explains again, with an example from a store project. Marcus: “Let me put it another way. The problem is the people.”'],
   ['Round three','Jordan tries a third, clearer version. Marcus leans back, arms folded: “I’m all for it in principle. I’ll talk it over with my supervisors.”'],
   ['Jordan notices','Jordan catches themselves turning a yawn into a smile. Third explanation, Marcus re-explaining, a body pulling back, and “I’ll talk it over” in code.'],
   ['The admission','Jordan says to themselves: “This isn’t about clarity. We’re stuck.” That admission, Block says, is the hardest part.']],
   'Every one of Block’s signals showed up. Seeing them is the first job; doing something is the second.');}},
{part:0,src:'Chapter 5 · Knowing When You Are Stuck',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Marcus says, “I’ll talk it over with my supervisors.” In Block’s code, what does it most likely mean?</h1>');
  L.mc(L.card,['I like it, but I need my team’s input first','I don’t want to do this','I need you to explain it more simply'],1,
   'Block lists “let me talk it over with my staff” as a common way of saying “I don’t want to do it.”',
   'It sounds like careful consulting of the team, but Block lists it as code for “I don’t want to do it.” Treat it as a sign you’re stuck.');}},
{part:0,src:'Chapter 5 · Knowing When You Are Stuck',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Stuck, or making progress?',['Probably stuck','Probably progress'],[
   ['Jordan notices they are rephrasing the same reason for the third time.',0,'Third explanation is Block’s first, clearest signal.'],
   ['Marcus leans in, asks how the interviews would work and starts naming people to talk to.',1,'Moving into the discussion and getting specific are signs of support.'],
   ['Marcus says, “Let’s get more data before we decide anything.”',0,'Block lists “let’s get more data” as code for “I don’t want to do it.”'],
   ['Jordan’s energy is rising and both are building on each other’s ideas.',1,'Rising energy is what progress feels like. Falling energy is the warning sign.']]);}},
{part:0,src:'Chapter 5 · Knowing When You Are Stuck',pts:1,run(L){
  L.h(L.kick('pr','What would you say?')+'<h1 class="q">Marcus says “I’m really keen on this,” but each time interviews come up they push their chair back and fold their arms. What should Jordan say?</h1>');
  L.mc(L.card,['“Every time I say interviews, you back away. Why?”','“Great, then let’s lock in the interview dates now.”','“What’s your reaction to what we’ve been discussing?”'],2,
   'An open question invites Marcus to put the doubts into words, without Jordan guessing at motives.',
   'Trust the body as a signal, but don’t comment on it. Guessing someone’s motives makes them defensive, and ignoring it leaves a double message. Ask an open question instead.');}},

/* ---------- PART 2: GETTING UNSTUCK ---------- */
{part:1,src:'Chapter 5 · Step 5-S. Stuck on Wants and Offers',run(L){
  L.h(L.kick('learn','The stuck path')+'<h1 class="q">Steps 5-S to 11-S (S for stuck)</h1>'+
   L.tiers([['clock','6-S · Think or recess','Step back mentally and watch the meeting. Or adjourn: “We seem hung up on this. I’d like time to think.”',''],
            ['scale','7-S · New wants and offers','If the gap seems negotiable, change what you ask for or what you offer. Always worth one try.',''],
            ['alert','8-S · Stuck again','Two passes failed. Maybe the relationship, not the project, is the problem.',''],
            ['chat','9-S · Process the discussion','Set the project aside and talk about how the meeting is going.','',true,'Most powerful'],
            ['cycle','10-S · Rediscuss wants and offers','Usually unclogs things and takes you back to step 5, reach agreement.',''],
            ['x','11-S · End it or shrink it','If still stuck, stop the contracting or keep your investment small.','']]));
  L.done();}},
{part:1,src:'Chapter 5 · Step 7-S: New Wants and Offers',run(L){
  L.h(L.kick('ex','Step 7-S at Copperleaf')+'<h1 class="q">Four weeks or eight?</h1>');
  L.beats(L.card,[
   ['The impasse','Marcus wants the work done in four weeks, before peak season. Jordan thinks it needs eight. Both have good reasons.'],
   ['Recess','Jordan asks for a few minutes and thinks: is there a different want that still meets the goal?'],
   ['Changed offer','One option: “I’ll get it done in four weeks.” Jordan simply gives way on time.'],
   ['Changed wants','Or: “I can do it in four weeks if you lend me two supervisors and accept a short report in outline form.”'],
   ['Result','Marcus can say yes to a concrete trade. If not, they are stuck again, and it’s time to shift gears.']],
   'Block uses the same kind of example: change what you offer, or change what you ask for in return. It’s always worth one try.');}},
{part:1,src:'Chapter 5 · Step 7-S: New Wants and Offers',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Which of Jordan’s lines changes what Jordan <i>wants</i> from Marcus?</h1>');
  L.mc(L.card,['“Four weeks works if your supervisors join the interviews.”','“Fine. I’ll finish it in four weeks instead of eight.”','“Let me explain once more why eight weeks matters.”'],0,
   'Jordan accepts the deadline but asks for something new in return. That is a new want.',
   'Agreeing to four weeks only changes Jordan’s offer, and explaining again is a sign of being stuck. Asking for supervisors’ help in return is a new want.');}},
{part:1,src:'Chapter 5 · Step 9-S: Process How We Are Handling This Discussion',run(L){
  L.h(L.kick('learn','Step 9-S')+'<h1 class="q">Stop talking about the project. Talk about the meeting.</h1>'+
   L.prose('Managers decide based on how they feel about the people involved. Do they trust you, your department? So when you’re stuck again, a different conversation is needed. Two ways in:')+
   L.quote('I think we are stuck.','Peter Block’s suggested words for step 9-S')+
   L.prose('That plain statement is probably the most powerful thing you can do. Or ask an open question: “How do you feel we’re doing at reaching agreement?” Stick with it, and you’ll hear the real worry:')+
   L.list([['Keeping control of the project',''],['How stubborn you seem',''],['Feeling misunderstood',''],['Your group’s reputation',''],['Vague benefits, or your jargon','']],1)+
   '<p class="small" style="margin-top:10px">Most stuck contracting comes from concerns like these, not from the details of the project.</p>');
  L.done();}},
{part:1,src:'Chapter 5 · When You Get Stuck',pts:1,
 solve:async L=>{for(let i=0;i<5;i++){const c=L.$('#sp');if(!c)break;const b=c.querySelector('[data-r="1"]');if(!b)break;b.click();}},
 run(L){
  const S=[
   ['Marcus re-explains “careless people” for the third time. Jordan has rephrased twice.',['Explain it a fourth way','Mentally step back and think','Give in and design the course'],1,'Admit you’re stuck, then step back. A fourth explanation won’t help.'],
   ['After thinking, Jordan sees a trade that might work.',['Offer new wants and offers','Adjourn and never come back','Ask Renata to call Marcus'],0,'If the gap seems negotiable, try a new combination of wants and offers.'],
   ['Marcus turns down the new offer too. Still stuck.',['Make a third offer, then a fourth','Say: “I think we are stuck.”','Wrap up and e-mail a proposal'],1,'Two passes failed. Shift to talking about how the meeting is going.'],
   ['Marcus admits: “Honestly, I don’t want head office telling Lena my floor is a mess.” They talk it through.',['Return to the project details','Keep discussing feelings all day','End the meeting on a high'],0,'With the real worry in the open, go back to wants and offers. It usually unclogs.'],
   ['Despite all that, they still can’t agree on interviewing packers, an essential for Jordan.',['Accept the course to keep the peace','Keep meeting weekly until Marcus agrees','Suggest not starting, or a much smaller job'],2,'All projects were not meant to be. End the contracting or minimize your investment.']];
  let k=0,clean=true;
  L.h(L.kick('pr','Walk the stuck path')+'<h1 class="q">Guide Jordan through the stuck meeting, one move at a time.</h1><div class="small" id="sk">Move 1 of 5</div><div class="rung cur" id="ss" style="margin:8px 0"></div><div id="sp"></div><div id="sf"></div>');
  const draw=()=>{L.$('#sk').textContent='Move '+(k+1)+' of '+S.length;L.$('#ss').innerHTML=S[k][0];const p=L.$('#sp');p.innerHTML='';
    S[k][1].forEach((o,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=o;if(j===S[k][2])b.dataset.r='1';
      b.onclick=()=>{if(j!==S[k][2]){clean=false;b.classList.add('sel');L.fb(L.$('#sf'),'<b>Not that.</b> Think about where Jordan is on the stuck path.','no');return;}
        L.$('#sf').innerHTML='';k++;
        if(k<S.length)draw();
        else{L.$('#sp').innerHTML='';L.$('#ss').innerHTML='Done: think, new offer, “I think we are stuck,” rediscuss, and finally end or shrink.';L.award(clean);
          L.sheet(clean?'ok':'info',clean?'Flawless path':'You got there','Each move follows Block’s stuck steps. Notice that saying “I think we are stuck” came only after a new offer had failed, and ending the contracting came only after talking about the meeting itself.');L.done();}};
      p.appendChild(b);});};
  draw();}},
{part:1,src:'Chapter 5 · Step 9-S: Process How We Are Handling This Discussion',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Jordan and Marcus are stuck for the second time. Tap each piece until Jordan shifts the talk to the meeting itself.</h1>');
  L.sentence(L.card,[['“I think we are stuck.','“You don’t seem to follow me.','“Let me show you the numbers again.'],['How do you feel we’re doing at agreeing on this?”','Why do you keep folding your arms?”','Can we decide by Friday instead?”']],[0,0],
   [['That blames Marcus for not understanding, which Block warns is rarely the issue.','That is another pass at the content, not a talk about the meeting.'],['Commenting on body language reads as guessing their motives and makes people defensive.','Pushing for a deadline skips the real reason you’re stuck.']],
   'A plain statement of the impasse plus an open question about how it’s going. That is step 9-S.');}},
{part:1,src:'Chapter 5 · Step 9-S: Process How We Are Handling This Discussion',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'What is Marcus really worried about?',['Keeping control','Feeling misunderstood','Your group’s reputation','Vague benefits'],[
   ['“Last time consultants came in, they wrote a thick report and nothing changed.”',2,'Past experience with Jordan’s kind of group colors how Marcus sees Jordan.'],
   ['“If your people are on my floor, who decides what changes?”',0,'Marcus fears losing say over how things run.'],
   ['“You keep talking about root causes. I still don’t see what I’d actually get.”',3,'The payoff sounds fuzzy to Marcus. Jargon makes it worse.'],
   ['“You haven’t worked a peak-season night. You don’t get what it’s like here.”',1,'Marcus feels nobody understands their situation.']]);}},

/* ---------- PART 3: SAYING NO ---------- */
{part:2,src:'Chapter 5 · The Problem with Saying No',run(L){
  L.h(L.kick('learn','The problem with saying no')+'<h1 class="q">Sometimes the best contract is no contract</h1>'+
   L.prose('Internal consultants feel that refusing a line manager is a huge risk. Block says it is in both sides’ interest to refuse projects with no reasonable chance of success.')+
   L.list([['shield','It avoids failure and waste','Not pickiness or a wish for exotic work.'],
     ['people','It models healthy limits','You treat the client the way you’d want them to treat their own people.'],
     ['scale','It gives “yes” its meaning','If you can never say no, your yes stops meaning commitment.']],2)+
   L.note('Lose one client by saying no and you’ve lost one. Go ahead and fail, and that client tells five other managers. Now you’re in trouble with six.','alert'));
  L.done();}},
{part:2,src:'Chapter 5 · The Problem with Saying No',run(L){
  L.h(L.kick('ex','When Jordan can’t say no')+'<h1 class="q">Renata says, “We don’t turn down the DC.” Now what?</h1>');
  L.beats(L.card,[
   ['The bind','Jordan and Marcus can’t agree on access to the packers, an essential. Jordan’s boss, Renata, has made clear the team doesn’t refuse the DC.'],
   ['Option 1 · Postpone','Block’s easiest way to limit losses: “I’m willing to do it, but let’s start after peak season.” Things may change by then.'],
   ['Option 2 · Shrink it','If it can’t wait, narrow the goals, lower the visibility and cut the time Jordan puts in.'],
   ['Be honest upward','Jordan tells Renata plainly: “This starts on shaky ground. I’d rather not, but I’ll do a small, low-key version.”'],
   ['Be honest inward','Above all, Jordan is honest with themselves about the project’s limits, so they don’t pretend it’s strong.']],
   'If you can’t say no, you can still minimize your investment and be clear with everyone that the contract is weak.');}},
{part:2,src:'Chapter 5 · The Problem with Saying No',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Why does Block say it’s worth risking a client’s anger by declining a project that is likely to fail?</h1>');
  L.mc(L.card,['A failed project spreads, souring several managers','Consultants deserve interesting work, not dull jobs','Saying no makes clients respect you more'],0,
   'One angry client is one loss. A visible failure reaches the client’s peers too.',
   'Block says the reason is not about interesting work or winning respect. It’s about avoiding failure: a failed project hurts your standing with many managers, not one.');}},
{part:2,src:'Chapter 5 · The Problem with Saying No',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Is Jordan following Block’s advice?',['Yes','No'],[
   ['Stuck on an essential, Jordan says: “Perhaps now isn’t a good time for this work.”',0,'That is step 11-S in Jordan’s own words.'],
   ['Unable to refuse, Jordan quietly takes on the full project and tells Renata it’s going great.',1,'Block says be clear with your boss that the project starts on shaky ground.'],
   ['Jordan agrees to a narrow, low-key pilot on one shift instead of the whole DC.',0,'Shrinking scope and visibility keeps losses small when you can’t say no.'],
   ['Jordan says yes to every request because refusing feels disloyal.',1,'If you can never say no, your yes loses its meaning.']]);}},

/* ---------- PART 4: SELLING AND CLOSING ---------- */
{part:3,src:'Chapter 5 · Selling Your Services: Good Selling Is Good Contracting',run(L){
  L.h(L.kick('learn','Selling is contracting')+'<h1 class="q">When you knock on the client’s door</h1>'+
   L.prose('Internal consultants are often told a group <i>ought</i> to use their services. The skills are the same as in contracting, with two shifts:')+
   L.lanes([['arrow','Reverse the order of wants','Name the problem you think the client has and check it with them. Then state what you want, and admit it’s a sales call. “I only want to help” is half the story.',2],
            ['shield','Remove obstacles, don’t light fires','If the need is real, the client partly wants to say yes. Find what blocks them: distrust of your group, fear of losing control or of exposure, bad past experience.',3]])+
   L.prose('Charisma and a big pitch just add fuel to resistance. Help the client say their doubts out loud; the more authentic you are, the faster it fades.'));
  L.done();}},
{part:3,src:'Chapter 5 · Selling Your Services: Good Selling Is Good Contracting',run(L){
  L.h(L.kick('ex','Jordan sells the scheduling tool')+'<h1 class="q">Renata’s team must roll out a new shift-scheduling tool. Marcus has refused it twice.</h1>');
  L.beats(L.card,[
   ['Name the problem','Jordan: “Building shift schedules by hand seems to eat a lot of your supervisors’ time.” Then checks: “Is that a real problem for you?” Marcus: “Some weeks, yes.”'],
   ['State the want','“I’d like the DC to try the new scheduling tool. And to be straight, my team is measured on sites that adopt it. This is partly a sales call.”'],
   ['Hear the obstacle','Marcus: “Last time your group rolled out a system, it ate my supervisors’ time for a month.” Jordan doesn’t argue. “Tell me more about that.”'],
   ['Let it out','The more Marcus says about the bad experience, the more they can look at this tool on its own merits.'],
   ['If it’s still no','Jordan backs off and asks whether the need and the offer are right. A good relationship beats a forced sale.']],
   'Same contracting steps, wants in reverse order, and resistance drawn out instead of argued away.');}},
{part:3,src:'Chapter 5 · A Comment on Time and Money',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Marcus says: “Love the idea, but we just don’t have the budget or the time this year.” How should Jordan read it?</h1>');
  L.mc(L.card,['As a fair limit to accept, and try again next year','As a real constraint to solve with a cheaper version','As a likely sign Marcus doesn’t want to do it'],2,
   'Block never takes time and money at face value. Managers find time and money for what they want. Agreeing would be collusion; look for the real reason.',
   'Block says time and money are almost always a mask. Managers fund what they want. Accepting the excuse, or shrinking the price, colludes with avoiding the real reason.');}},
{part:3,src:'Chapter 5 · Selling Your Services: Good Selling Is Good Contracting',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Selling the scheduling tool: do or don’t?',['Do','Don’t'],[
   ['Bring an upbeat, high-energy pitch Jordan wouldn’t use if Marcus had called them.',1,'Don’t be any different when selling than when the client calls you in.'],
   ['Ask Marcus what reservations they have about Jordan and the tool.',0,'Help the client put doubts about you and your product into words.'],
   ['Answer every objection with more benefits for the company.',1,'More explanations and pleas only add fuel to the resistance.'],
   ['Say openly that Jordan is there to sell and hopes Marcus will buy.',0,'Admit you’re there to sell. Everyone knows it anyway.'],
   ['Follow the usual contracting steps, wants in reverse order.',0,'Selling is good contracting. Same sequence, authentic throughout.']]);}},
{part:3,src:'Chapter 5 · The Meeting as a Model of How You Work; Closing the Contracting Meeting',run(L){
  L.h(L.kick('learn','How you run the meeting is the sample')+'<h1 class="q">Show how you work, then close well</h1>'+
   L.prose('Managers learn more from watching consultants than from listening to them. The contracting meeting is a small version of the whole project: collecting information, testing ideas, giving feedback, planning together.')+
   L.prose('If a manager still can’t picture it, offer a '+L.g('mini-consultation','mini-consultation')+': twenty minutes on a problem they choose, then talk about how it felt.')+
   L.list([['target','Ask how you’ll measure success','Even if it can’t be fully answered, it clarifies expectations.'],
     ['clock','Leave twenty minutes for reservations','“How do you feel about the meeting, and about me and my approach? Any reservations?” It may take two minutes. If it opens new issues, better now.'],
     ['list','Review afterward','Block’s Checklist 4 asks what reservations came up, which you put into words, and whether you skipped any steps.']],2));
  L.done();}},
{part:3,src:'Chapter 5 · Closing the Contracting Meeting',pts:1,run(L){
  L.h(L.kick('pr','What would you do?')+'<h1 class="q">Jordan and Marcus finally agree on a small pilot. Twenty minutes are left on the clock. What should Jordan use them for?</h1>');
  L.mc(L.card,['Ask how they feel about the meeting and Jordan','Start drafting the pilot plan together right away','Wrap up early to show respect for Marcus’s time'],0,
   'Block says no contracting meeting should end without asking for reservations about the project, the meeting and you. Leave twenty minutes in case something comes up.',
   'Planning and finishing early both skip the last check. Block says to leave twenty minutes for reservations about the meeting and about you.');}},
{part:3,src:'Chapter 5 · Contracting Checkpoint',pts:1,run(L){
  L.h(L.kick('pr','Putting it together')+'<h1 class="q">Order Jordan’s moves in a contracting meeting that gets stuck and then recovers.</h1>');
  L.order(L.card,['Notice the third explanation and admit being stuck','Recess and think of a new trade','Offer new wants and offers','Say “I think we are stuck” and ask how it’s going','Rediscuss wants and offers, then agree','Ask for reservations about the meeting and about Jordan'],
   'Know you’re stuck, try a new trade, talk about the meeting itself, go back to the specifics, then close by surfacing reservations.');}}
  ]
});
</script>
</body>
</html>
