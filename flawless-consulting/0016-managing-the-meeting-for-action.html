<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Managing the Meeting for Action</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0016', title:'Managing the meeting for action', minutes:20, icon:'clock',
  goals:['Plan a feedback meeting that ends in a decision, not just a presentation','Run the ten steps with the right split of time, including the halfway question','Handle resistance and a divided group in the room, as it happens'],
  parts:['The business','The picture','Ten steps','In the room'],
  read:'Read chapter 15 of the book for the full step-by-step timings and Checklists 7 and 8 for planning and reviewing a meeting for action.',
  glossary:{
    'meeting-for-action':'Meeting for action: the feedback meeting where you present the picture and recommendations, aiming for the client to decide what to do.',
    'halfway-question':'Halfway question: asking the client “Are you getting what you want from this meeting?” at the midpoint, while there is still time to recover.',
    'here-and-now':'Here and now: what is happening between you and the client in the meeting itself, as opposed to the topic being discussed.'
  },
  cheatsheet:[
    'The '+'<b>meeting for action</b> is the start of implementation, not the end of discovery. Its heart is deciding what to do.',
    'Business of this phase: keep the picture simple, include how it is being managed, run the meeting, stay in the here and now, don’t take it personally.',
    'Four kinds of data: the technical or business problem, what is working, how it is being managed, recommendations. Fewer than ten issues.',
    'Time split: contract and agenda 5%, picture and recommendations 15%, <b>client reactions 30%</b>, halfway question 10%, <b>decision 30%</b>, close 10%.',
    'Be done presenting by 20% of the meeting. Keep reactions to the picture apart from reactions to the recommendations.',
    'Ask “Are you getting what you want?” <b>halfway</b>, not at the end. Ask to be present when the decision is made.',
    'Close: test control and commitment, ask for what you want, and give support.',
    'Stuck? Put what is happening into words. Resistance means you are on target. In a group: ask each person, invest where the power is, distrust a quick yes.'
  ],
  steps:[
/* ---------- PART 1: THE BUSINESS ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Jordan has one hour with Marcus to share what discovery found. Jordan plans 45 minutes of findings, then questions. What is the likely result?</h1>');
  L.mc(L.card,['Marcus leaves informed, with nothing decided','Marcus leaves with a clear plan of action'],0,
   'Findings are fascinating, so they swallow the hour. This lesson is about structuring the meeting so a decision gets made while you are in the room.',
   'With 45 minutes of findings, the discussion of what to do gets squeezed or happens later without Jordan. Nothing is decided in the room.');}},
{part:0,src:'Chapter 15 · Managing the Meeting for Action',run(L){
  L.h(L.kick('learn','A beginning, not an ending')+'<h1 class="q">The point of the meeting is action</h1>'+
   L.prose('You present a picture and recommendations hoping to trigger action: a decision, more discovery, or learning. It is a moment of high anxiety for client and consultant alike, and also an exciting one.')+
   L.flow([['eye','Discovery','The picture you found','',1],['chat','The '+L.g('meeting-for-action','meeting for action'),'Picture, reactions, decision','',3],['play','Implementation','The change begins','',2]])+
   L.prose('Even if most of the meeting goes on understanding the problem, its heart is <b>what to do about it</b>. Treat it as a chance to get action, not just a chance to present data.'));
  L.done();}},
{part:0,src:'Chapter 15 · Managing the Meeting for Action',run(L){
  L.h(L.kick('learn','The business of this phase')+'<h1 class="q">Five things this meeting has to get done</h1>'+
   L.list([['Keep the picture in focus','Simple, everyday language: accurate, specific, not punishing.'],
     ['Present personal and organizational data','Include how the situation is being managed.'],
     ['Manage the meeting','Control and structure it. Keep it moving toward what will be done.'],
     ['Stay in the here and now','Deal with resistance and with movement as they happen. Miss it now and you may get no second chance.'],
     ['Don’t take it personally','This phase draws the most resistance. Take things personally after 6 p.m. if you must; during the day, stay on the client’s struggle with reality.']],1)+
   '<p class="small" style="margin-top:10px">That is the business. The other half of flawless consulting here is the usual one: say what you are experiencing as the meeting goes on.</p>');
  L.done();}},
{part:0,src:'Chapter 15 · Managing the Meeting for Action',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Midway through, Marcus says: “Head-office people never get how a DC works.” What should Jordan keep in mind?</h1>');
  L.mc(L.card,['Jordan must prove they understand the DC','It’s about facing hard data, not about Jordan','Marcus has stopped trusting the whole project'],1,
   'Marcus is reacting to the pain of facing the picture. Jordan stays focused on that struggle, not on defending themselves.',
   'This phase draws the most resistance, and it isn’t aimed at the consultant. Defending or despairing misses that: stay on Marcus’s struggle with the data.');}},
{part:0,src:'Chapter 15 · Managing the Meeting for Action',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which piece of the business is Jordan missing?',['Simple picture','How it’s managed','Manage the meeting','Here and now','Not personal'],[
   ['Jordan’s summary talks about “cross-functional throughput misalignment.”',0,'Use everyday words Marcus would use.'],
   ['The picture covers wrapping technique and nothing about Marcus’s schedule overrides.',1,'Leave out how it is managed and you leave out what Marcus can change.'],
   ['Marcus and Jordan spend forty minutes on one odd dip in a chart.',2,'Jordan has to keep the meeting moving toward what will be done.'],
   ['Marcus goes quiet and folds their arms at the overrides point. Jordan moves on.',3,'That was resistance in the moment. Name it before it hardens.'],
   ['After a sharp comment, Jordan spends the evening rewriting the report to win the argument.',4,'The comment was about Marcus’s struggle, not about Jordan.']]);}},

/* ---------- PART 2: THE PICTURE ---------- */
{part:1,src:'Chapter 15 · How to Present the Picture',run(L){
  L.h(L.kick('learn','How to present the picture')+'<h1 class="q">Fall in love with your data, but don’t tell everyone</h1>'+
   L.prose('Most presentations are too long and too intricate. The longer and more complex yours is, the more you invite endless questions about method. There are only four kinds of data to present:')+
   L.tiers([['box','The technical or business problem','What is going wrong, in business terms.'],
            ['leaf','What is working','And what the possibilities are.'],
            ['people','How the situation is being managed','The '+L.g('how-managed','people side')+': style, pressure, politics.'],
            ['arrow','Recommendations','What you suggest doing.']])+
   L.note('Keep it to <b>fewer than ten issues</b>, ideally fewer. The report doesn’t need every answer. Leave the client a role in the analysis. We want action, not research.','target'));
  L.done();}},
{part:1,src:'Chapter 15 · How to Present the Picture',run(L){
  L.h(L.kick('ex','Copperleaf')+'<h1 class="q">Jordan’s four kinds of data on one page</h1>');
  L.beats(L.card,[
   ['The problem','Complaints about damaged deliveries have doubled in six months.'],
   ['What is working','Kofi’s night shift, which has the fewest damaged orders, runs a two-minute pack-check huddle. The day-shift volunteers in the floor pilot now track their own damage numbers.'],
   ['How it is managed','Day shift is pushed hard on loading speed. Schedules are changed at short notice. Complaint data never reaches the floor.'],
   ['Recommendations','Share complaint numbers with both shifts every week. Give notice before schedule changes except in real emergencies. Widen the pilot, still by invitation.'],
   ['Left open','Jordan doesn’t say how to spread the huddle. They plan to ask Marcus and the supervisors to work that out.']],
   'One page, four headings, three recommendations, and a gap left on purpose for the client to fill.');}},
{part:1,src:'Chapter 15 · How to Present the Picture',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Jordan’s first draft has fifteen issues and thirty polished slides. What does the book suggest?</h1>');
  L.mc(L.card,['Keep all fifteen; Marcus can skim the slides','Cut to a few issues and drop the formality','Send the slides ahead so the meeting is shorter'],1,
   'Fewer than ten issues, ideally fewer, and no perfect package. A polished deck puts distance between Marcus and the data.',
   'Skimming or pre-reading still overloads Marcus, and slides make the data look set in concrete. Cut to a few issues and keep it informal.');}},
{part:1,src:'Chapter 15 · How to Present the Picture',pts:5,run(L){
  L.h(L.kick('pr','Four kinds of data')+'<h1 class="q">Sort these into Jordan’s four headings.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['The problem','What works','How managed','Recommend'],[
   ['Scratched and broken furniture deliveries have doubled',0,'That is the business problem in plain terms.'],
   ['Night shift’s pack-check huddle, with the fewest damaged orders',1,'Something already working that day shift can learn from.'],
   ['Supervisors’ schedules get overridden at short notice',2,'This is about how the DC is being run.'],
   ['Post complaint numbers for both shifts every week',3,'A suggested action for Marcus to decide on.'],
   ['Nobody on the floor ever sees the complaint data',2,'How information flows is part of how it is managed.']],
   'Problem, what works, how it is managed, recommendations. Four short headings carry the whole picture.');}},

/* ---------- PART 3: TEN STEPS ---------- */
{part:2,src:'Chapter 15 · The Meeting for Action, Step by Step',run(L){
  L.h(L.kick('learn','The ten steps')+'<h1 class="q">Keep them in order, and don’t skip any</h1>'+
   L.tiers([['list','1–2 · Restate the contract, state the agenda','5% · minutes 0–3'],
            ['eye','3–4 · Present the picture and recommendations','15% · to minute 12'],
            ['chat','5 · Ask for client reactions','30% · to minute 30','',true,'The heart'],
            ['clock','6 · “Are you getting what you want?”','10% · to minute 36'],
            ['target','7 · Decision to proceed','30% · to minute 54'],
            ['check','8–10 · Test control and commitment, ask yourself if you got what you wanted, give support','10% · to minute 60']])+
   '<p class="small" style="margin-top:10px">Times are for a 60-minute meeting. You control the flow: the client is busy working through resistance, and your structure shows them how to run such a meeting.</p>');
  L.done();}},
{part:2,src:'Chapter 15 · The Meeting for Action, Step by Step',pts:1,
 solve:async L=>{L.$('#ln').children[1].click();},
 run(L){
  const S=[['Contract and agenda',5],['Picture and recommendations',15],['Client reactions',30],['Halfway question',10],['Decision to proceed',30],['Close',10]];
  const T=[60,120,240],TN=['1 hour','2 hours','4 hours'],C=['var(--h1)','var(--h2)','var(--ok)','var(--h3)','var(--pri)','var(--h4)'];
  L.h(L.kick('pr','Scale the meeting')+'<h1 class="q">Pick a meeting length and see where each step lands.</h1><div id="ln"></div>'+
   '<div style="background:var(--soft);border-radius:16px;padding:14px;margin:8px 0 6px;min-height:150px"><div style="display:flex;height:16px;border-radius:99px;overflow:hidden;margin-bottom:10px">'+S.map((s,j)=>'<div style="width:'+s[1]+'%;background:'+C[j]+'"></div>').join('')+'</div><div id="tt" class="small">Choose a length above.</div></div><div id="tq"></div>');
  T.forEach((t,j)=>{const b=document.createElement('button');b.className='chip';b.innerHTML=L.ic('clock')+TN[j];b.onclick=()=>{[...L.$('#ln').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');
    let c=0;L.$('#tt').innerHTML=S.map((s,k)=>{const a=c;c+=s[1];return '<div style="display:flex;justify-content:space-between;gap:8px;padding:3px 0"><span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:'+C[k]+';margin-right:6px"></span>'+s[0]+'</span><b>min '+Math.round(a*t/100)+'–'+Math.round(c*t/100)+'</b></div>';}).join('');
    if(!L.$('#tq').innerHTML){const q=L.$('#tq');q.innerHTML='<h2 class="sub">Marcus books two hours with Jordan instead of one. By which minute should Jordan be done presenting?</h2>';
      L.mc(q,['Minute 24','Minute 60','Minute 90'],0,'Picture and recommendations end at 20 percent of the meeting. In two hours that is minute 24, leaving the rest for reactions and a decision.','Presenting ends at 20 percent of the meeting, however long it is. In two hours that is minute 24. Minute 60 is when to ask the halfway question.');}};
    L.$('#ln').appendChild(b);});}},
{part:2,src:'Chapter 15 · Steps 3 and 4: Present the Picture and Present Recommendations',run(L){
  L.h(L.kick('learn','Steps 1 to 4')+'<h1 class="q">Short opening, short picture</h1>'+
   L.list([['Restate the contract','What the client asked for, what you promised, and what you didn’t look at. Skip the project history.'],
     ['State the agenda','How you want the meeting to run, including the halfway check and time for action. Don’t announce you’re in charge; just act that way.'],
     ['Picture, then recommendations','Get reactions to the picture separately. If resistance is going to hit something, better your analysis than your recommendations.'],
     ['Keep it informal','A polished slide deck puts distance between the client and the data. Presenting a perfect package is a mistake.']],3)+
   L.prose('The biggest mistake is using the whole meeting to report data. How the client reacts matters more to action than the data itself.'));
  L.done();}},
{part:2,src:'Chapter 15 · Steps 1 and 2: Restate the Original Contract; State the Agenda/Structure of the Meeting',run(L){
  L.h(L.kick('ex','Copperleaf')+'<h1 class="q">Jordan’s first twelve minutes with Marcus</h1>');
  L.beats(L.card,[
   ['Minute 1 · Contract','“You asked me to find out why damaged deliveries doubled and come back with recommendations. This covers the DC only; I didn’t look at Eastgate.”'],
   ['Minute 2 · Agenda','“I’ll give you the picture, then a few recommendations. I’d like your reactions to each. Halfway, I’ll check you’re getting what you want. The last part is for deciding what to do.”'],
   ['Minute 5 · The rush','Marcus: “Skip ahead. What do I do?” Jordan: “We’ll get there in a few minutes. First I want your reaction to what I found.”'],
   ['Minute 9 · Recommendations','Three, on one page. No slides.'],
   ['Minute 12 · Stop','Jordan stops talking and asks: “What’s your reaction to this?”']],
   'Contract, agenda, picture, recommendations, and then silence. Everything after minute 12 belongs to Marcus’s reactions and the decision.');}},
{part:2,src:'Chapter 15 · Step 5: Ask for Client Reactions',run(L){
  L.h(L.kick('learn','Steps 5 and 6')+'<h1 class="q">The heart of the meeting, and an insurance question</h1>'+
   L.prose('<b>Step 5, client reactions</b>, decides how much commitment exists when you leave. Get reservations out now; held back, they surface at the decision or after you’ve gone. If a part touches a sensitive issue, like the client’s own management, ask about it directly.')+
   L.lanes([['flame','Tension','Some is useful. None means nobody cares; too much freezes everyone. Aim for moderate.',4],
            ['shield','Your stance','Don’t get defensive; the reactions aren’t against you. And don’t cave: you had good reasons.',2]])+
   L.prose('<b>Step 6</b> is the '+L.g('halfway-question','halfway question')+': “Are you getting what you want from this meeting?” Asked near the end, it comes too late to recover. Asked halfway, you still can.'));
  L.done();}},
{part:2,src:'Chapter 15 · Step 5: Ask for Client Reactions',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">At minute 14, Marcus has said nothing about the schedule-overrides point. What should Jordan do?</h1>');
  L.mc(L.card,['Ask how Marcus feels about that part of the picture','Move on, since Marcus raised no objection to it','Explain the overrides point again more carefully'],0,
   'Move toward the tension. Ask directly about the sensitive part so the reservations come out now, not later.',
   'Silence isn’t agreement, and more explaining isn’t a reaction. Ask Marcus directly how they feel about that part; held-back reservations come out later at a worse time.');}},
{part:2,src:'Chapter 15 · Step 7: Decision to Proceed',run(L){
  L.h(L.kick('learn','Steps 7 to 10')+'<h1 class="q">Be in the room when they decide</h1>'+
   L.prose('Raise <b>what to do next</b> early enough that you take part. A decision made without you is less likely to face the hard realities, especially the client’s own role.')+
   L.list([['Client’s control','Keep the talk on what the client can change.'],['The essentials','Keep raising the sensitive parts: a hard relationship, a poor performer, politics.'],['Every voice','Make sure each person’s view is heard.'],['The manager chooses','Support their right to decide, with minimal pressure from anyone, you included.']],2)+
   L.note('<b>Close (8–10):</b> ask how the client feels about the control they will have, and whether the solution really makes sense to them. Ask for what you want: feedback, a word to your boss, a next contract. Then give support.','check'));
  L.done();}},
{part:2,src:'Chapter 15 · Step 7: Decision to Proceed',pts:1,run(L){
  L.h(L.kick('pr','What would Jordan say?')+'<h1 class="q">At minute 40, Marcus says: “Good stuff. I’ll talk it over with the supervisors next week and let you know.” What should Jordan do?</h1>');
  L.mc(L.card,['Agree, and offer to send a written summary','Ask to be there when the decision is made','Press Marcus to decide before the hour is up'],1,
   'Excluding the consultant from the decision is a way to keep control, another form of resistance. Ask to be present, ideally something agreed in the original contract.',
   'A summary leaves Jordan out of the real decision, and pressing takes the choice from Marcus. Ask to be present when they decide.');}},
{part:2,src:'Chapter 15 · The Meeting for Action, Step by Step',pts:1,run(L){
  L.h(L.kick('pr','Put it in order')+'<h1 class="q">Arrange these steps of the meeting for action.</h1>');
  L.order(L.card,[
   'Restate the original contract',
   'Present the picture',
   'Ask for client reactions',
   'Ask “Are you getting what you want?”',
   'Discuss the decision to proceed',
   'Test control and commitment',
   'Give support'],
   'Contract, picture, reactions, the halfway question, the decision, then a close that tests commitment and ends with support.');}},

/* ---------- PART 4: IN THE ROOM ---------- */
{part:3,src:'Chapter 15 · Resistance in the Meeting',run(L){
  L.h(L.kick('learn','Resistance in the meeting')+'<h1 class="q">The meeting replays the organization’s problems</h1>'+
   L.prose('The way a group handles your picture is how it handles everything: retreating into detail, postponing, denying. Watching the '+L.g('here-and-now','here and now')+' matters more than the content. Signs you are stuck:')+
   L.list([['shield','Defending the data','Against the people who are meant to learn from it.'],
     ['flame','Supplying the energy','For next steps in a group you don’t belong to.'],
     ['bulb','Expected to know it all','Including solutions to complex problems in three minutes.']],4)+
   L.prose('The way out: <b>put what is happening into words, as it happens</b>. Resistance to your next steps means you are on target, so move toward it. And voice your own feelings, confused or excited, as part of the meeting.'));
  L.done();}},
{part:3,src:'Chapter 15 · Resistance in the Meeting',pts:1,run(L){
  L.h(L.kick('pr','What would Jordan say?')+'<h1 class="q">For the fourth time, Marcus questions how the complaint numbers were counted. Jordan has answered twice. What now?</h1>');
  L.mc(L.card,['“Let me walk you through the method once more.”','“I’ll recheck every number and come back next week.”','“I notice I keep defending the data instead of us using it.”'],2,
   'Putting the stuck place into words, as it happens, is the way out. Then Jordan waits for Marcus to respond.',
   'A third explanation or more data plays the defendant. After two good-faith answers, name what’s happening: Jordan is defending data Marcus is meant to learn from.');}},
{part:3,src:'Chapter 15 · When Group Members Are at Odds Among Themselves',run(L){
  L.h(L.kick('learn','When group members are at odds')+'<h1 class="q">Don’t let it become the group versus you</h1>'+
   L.prose('A group that works together poorly may take its differences out on the consultant, an easy target when they can’t confront each other.')+
   L.list([['people','Treat them as individuals','Ask each person, one by one, what they want from the meeting. If they aren’t listening to each other, ask someone by name to react to another.'],
     ['scale','Don’t overinvest in the loudest','Give their questions two good-faith answers. Then put your energy where the power is: “We’ve heard several questions from one side. How do you see it?”'],
     ['alert','Beware a quick yes','Fast compliance is often how a group avoids conflict. Be suspicious of it.']],1)+
   '<p class="small" style="margin-top:10px">And give support throughout. People under stress need support, not more confrontation.</p>');
  L.done();}},
{part:3,src:'Chapter 15 · When Group Members Are at Odds Among Themselves',pts:4,run(L){
  L.h(L.kick('pr','Supervisors’ meeting')+'<h1 class="q">Marcus asks Jordan to take the picture to the supervisors’ meeting: Marcus, Kofi and the day-shift supervisors. Pick Jordan’s move.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Ask each person','Turn to the power','Probe the quick yes'],[
   ['At the start, everyone acts as if they all see the damage problem the same way.',0,'Asking each person what they want surfaces the differences.'],
   ['Tess, a day-shift supervisor, asks a fourth sharp question about method. Jordan has answered twice.',1,'Two good-faith answers are enough. Turn to Marcus, whose view will sway the room.'],
   ['Within a minute, all the day-shift supervisors agree to run huddles “no problem.”',2,'Fast compliance often hides conflict. Ask what would get in the way.'],
   ['The day-shift supervisors keep firing questions at Jordan, never at Kofi.',0,'Ask them by name to respond to Kofi, putting the focus back on the group.']],
   'Treat the group as individuals, invest where the power is, and don’t trust a yes that came too easily.');}},
{part:3,src:'Chapter 15 · Modeling the Meeting',run(L){
  L.h(L.kick('learn','Modeling the meeting')+'<h1 class="q">How you run it teaches more than what you say</h1>'+
   L.prose('Managers learn most from experiencing how you handle these moments. If you want Marcus to be direct and open with the supervisors, Jordan has to be direct and open with Marcus first.')+
   L.list([['check','Confront with all relevant data','Even what wasn’t in the original assignment.'],
     ['star','Name the possibility','As well as the problem.'],
     ['pencil','Describe, don’t evaluate','Including about the client’s own behavior.'],
     ['target','Be there for the decision','And structure the meeting to get reactions and a choice of next steps.']],3));
  L.done();}},
{part:3,src:'Chapter 15 · Checklist #8: Reviewing the Meeting',pts:1,run(L){
  L.h(L.kick('pr','Review the meeting')+'<h1 class="q">Afterward, Jordan notes that Marcus moved the meeting twice and cut the agenda at the last minute. Checklist 8 asks what this connects to. Which link fits?</h1>');
  L.mc(L.card,['It shows Marcus doesn’t value Business Improvement','It mirrors supervisors’ schedules overridden at short notice','It’s noise, since the meeting still ended in a decision'],1,
   'How the meeting was managed echoes how the business problem is managed. That link is worth raising with Marcus.',
   'It isn’t a verdict on Jordan’s team, and it isn’t noise. Checklist 8 asks how the meeting’s management connects to how the problem is managed: here, short-notice changes.');}}
  ]
});
</script>
</body>
</html>
