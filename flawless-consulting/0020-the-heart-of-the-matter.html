<title>The Heart of the Matter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">

<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0020', title:'The heart of the matter', minutes:20, icon:'compass',
  goals:['Design a session for learning, not teaching, as a learning architect','Hold a polarity open and swap “how” questions for deeper ones','Use tension, gifts and the present moment, and go first yourself'],
  parts:['Learning architect','Struggle and questions','Tension and gifts','Go first'],
  read:'Read chapter 19 of the book, the closing chapter, for Block’s ten grounding ideas in full, including the full list of “how” questions and the questions that go beyond them.',
  glossary:{
    'learning-architect':'Learning architect: a consultant who designs the social setting (who meets, how, around what questions) so that insight, resolution of differences and change can happen.',
    'polarity':'Polarity: two opposite views that are both true, like “we need central control” and “we need local choice.”',
    'team-lead-program':'Team-lead program: Jordan’s six-week program for newly promoted team leads from the stores, the DC and Eastgate.',
    'how-question':'“How” question: a question about method or steps (how long, how do we get them to change, how do we measure it) that skips why, and whether, the work is worth doing.'
  },
  cheatsheet:[
    'Consulting is a <b>relationship business</b>. The relationship is the channel your expertise flows through.',
    'Be a <b>learning architect</b>: choose learning over teaching. Whoever builds the session learns the most, so let clients build.',
    'Value struggle over prescription, questions over answers, tension over comfort, capacities over deficiencies.',
    'In a <b>polarity</b>, don’t pick a side or split the difference. Explore the truth in both before acting.',
    '“How” questions are warning signs. Ask <b>why and where</b>: what’s the point, what has to die, what would happen if we did nothing?',
    '<b>Tension is the key</b>: name it and discuss it. Retreating to action lists drains the energy for change.',
    'Look for gifts, not gaps. We are responsible for one another’s learning. Culture changes <b>in this meeting</b>, not later.',
    'If change is so wonderful, <b>go first</b>. In the end your authenticity and connection are your method.'
  ],
  steps:[
/* ---------- PART 1: LEARNING ARCHITECT ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Jordan spent three weeks building a polished training session on shift handovers. Twenty supervisors attended for an hour. Who probably learned the most?</h1>');
  L.mc(L.card,['Jordan, who built the session','The supervisors who attended'],0,
   'Building it forced Jordan to wrestle with the subject. Attendees mostly absorbed. Block says the real learner in most training is the trainer.',
   'The supervisors sat and absorbed for an hour. Jordan wrestled with the subject for three weeks. Block says the real learner in most training is the trainer.');}},
{part:0,src:'Chapter 19 · The Heart of the Matter',run(L){
  L.h(L.kick('learn','The last chapter')+'<h1 class="q">Consulting is a relationship business</h1>'+
   L.prose('However technical the project, its success will come to hinge on the quality of your relationship with the client. That relationship is the <b>channel your expertise flows through</b>.')+
   L.prose('Block closes the book with the ideas he returns to when he is lost. Each one is as much about the heart as the head, and each one runs against conventional wisdom. That, he says, is what makes them useful.')+
   L.note('Your job is to be a '+L.g('learning-architect','learning architect')+': design the social settings (who meets, how, around what) that lead to insight, resolution of differences and change.','compass'));
  L.done();}},
{part:0,src:'Chapter 19 · Choosing Learning over Teaching',run(L){
  L.h(L.kick('learn','Idea 1 · Choose learning over teaching')+'<h1 class="q">In most training, the trainer is the real learner</h1>'+
   L.prose('Most classrooms and consulting projects run “all eyes front”: the one in charge sets the agenda, the method and the outcome. It feels predictable and in control.')+
   L.list([['person','We want to be central','Consultants like controlling what is presented and what is learned.'],
     ['people','Learners want it too','Invite clients to set the agenda and they often hand the floor straight back. Both sides keep the consultant central.'],
     ['pencil','The learning is in the making','Building the lesson, the slides or the course is where the struggle, and the learning, happens.']],3)+
   '<p class="small" style="margin-top:10px">Block’s read on all the talk about measuring training: it’s anxiety about whether the training matters.</p>');
  L.done();}},
{part:0,src:'Chapter 19 · Learning as a Social Adventure',run(L){
  L.h(L.kick('learn','Idea 2 · Learning as a social adventure')+'<h1 class="q">Packaged answers don’t cure a control problem</h1>'+
   L.prose('Learning needs surprise, discovery and not knowing. Allow risk in the room, offer caring confrontation and strong support, and affirm what each person knows.')+
   L.prose('Packaged training is faster, tidier and easier to sell. But if a client’s problem is high-control, predetermined thinking, you can’t fix it with high-control, predetermined answers. That needs a slower, more demanding approach that values:')+
   L.tiers([['flame','Struggle','over prescription'],['bulb','Questions','over answers'],['alert','Tension','over comfort'],['star','Capacities','over needs and deficiencies']]));
  L.done();}},
{part:0,src:'Chapter 19 · Learning as a Social Adventure',run(L){
  L.h(L.kick('ex','Copperleaf')+'<h1 class="q">Renata wants the team-lead program turned into a package</h1>');
  L.beats(L.card,[
   ['The success','Jordan’s six-week '+L.g('team-lead-program','team-lead program')+' went well. The leads set their own goals and built much of the agenda.'],
   ['The request','Renata asks Jordan to turn it into an online module with a quiz, so all 40 stores can run it without Jordan.'],
   ['Jordan notices','The learning came from the leads building the agenda. A finished module would hand future leads the answers, and keep the building for Jordan.'],
   ['The offer','Jordan proposes a short starter kit instead: the opening contracting questions, and a guide for each new cohort to design its own six weeks.'],
   ['The trade-off','Jordan is honest with Renata: it’s slower and less predictable than a module, and harder to count.']],
   'Packaging makes ideas easy to sell and spread. Designing for learning means leaving the struggle with the learners.');}},
{part:0,src:'Chapter 19 · Choosing Learning over Teaching',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Jordan is planning a half-day on handling late trucks with DC supervisors. Which design chooses learning over teaching?</h1>');
  L.mc(L.card,['Jordan presents a best-practice model, then a quiz','Supervisors map their own late-truck story together','Jordan shows a video of the right way to do it'],1,
   'The supervisors do the building and the struggling, so they do the learning.',
   'A model with a quiz, or a video of the right way, keeps Jordan central and the supervisors absorbing. Let them build the picture themselves.');}},
{part:0,src:'Chapter 19 · Choosing Learning over Teaching',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Designed for learning or for teaching?',['For learning','For teaching'],[
   ['A slide deck with the five key learning points headlined up front',1,'Promising a right way with predictable outcomes is teaching.'],
   ['Leads work out in pairs what “ready to lead” would mean for them',0,'They create the ideas, so they do the learning.'],
   ['An e-learning module everyone completes in 20 minutes',1,'Fast and countable, but the learning stayed with whoever built it.'],
   ['Jordan opens with a question nobody, including Jordan, can answer yet',0,'Not knowing and surprise are what create learning.'],
   ['A role-play with a script showing exactly what to say',1,'Modeling the right answer invites imitation, not learning.']]);}},

/* ---------- PART 2: STRUGGLE AND QUESTIONS ---------- */
{part:1,src:'Chapter 19 · The Struggle Is the Solution',run(L){
  L.h(L.kick('learn','Idea 3 · The struggle is the solution')+'<h1 class="q">Most hard problems have two true sides</h1>'+
   L.prose('Persistent problems rarely have one right answer. They’re '+L.g('polarity','polarities')+': two opposite views that are both true.')+
   L.flow([['shield','We need control','','',4],['scale','and','','',1],['people','We need local choice','','',2]],false)+
   L.prose('Choosing one side loses the other’s ideas. So does settling on a middle ground. The consultant’s task is to explore <b>both poles</b>, hold off the quick answer, and make sure the complexity is faced before action is chosen.')+
   '<p class="small">Whatever you choose, you pay a price. So see the struggle as the path, and resist the pull of certainty and speed.</p>');
  L.done();}},
{part:1,src:'Chapter 19 · The Struggle Is the Solution',pts:1,
 solve:async L=>{const c=L.$('#pc').children;for(const b of c)b.click();},
 run(L){
  const O=[['Pick the standard','One checklist everywhere would be consistent, but Kofi’s crew could lose the huddle they built, and crews would stop thinking for themselves.','no'],
           ['Pick local choice','Every crew doing its own thing keeps ownership high, but good ideas may not spread, and Lena’s real concern goes unheard.','no'],
           ['Split the difference','“Half the checklist is required” would leave nobody happy, and the best ideas from both sides would get watered down.','no'],
           ['Explore both sides','The group asks what each side is right about before deciding. Any choice still has a price, but now it is made with both truths in view.','ok']];
  const seen=new Set();
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Lena wants one laminated pack-check list for all 40 stores. Crews want their own. Try each response and see what it costs.</h1><div id="pc" style="display:flex;flex-wrap:wrap;gap:8px"></div>'+
   '<div style="background:var(--soft);border-radius:16px;padding:14px;margin:12px 0 6px;min-height:90px"><div class="small" id="pr">Pick a response above.</div></div><div id="hq"></div>');
  O.forEach((o,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=o[0];
    b.onclick=()=>{[...L.$('#pc').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(j);
      L.$('#pr').innerHTML='<span style="color:var(--'+o[2]+')">'+o[1]+'</span>';
      if(seen.size===4&&!L.$('#hq').innerHTML){const q=L.$('#hq');q.innerHTML='<h2 class="sub">What was Jordan’s real job here?</h2>';
        L.mc(q,['Find the right answer for Lena','Help the group explore both sides'],1,
         'Block’s point exactly: evoke the exploration of the polarity, and let the resolution come from the struggle.',
         'There was no single right answer to find. Jordan’s job was to keep both truths on the table until the group found a resolution.');}};
    L.$('#pc').appendChild(b);});}},
{part:1,src:'Chapter 19 · The Question Is More Important Than the Answer',run(L){
  L.h(L.kick('learn','Idea 4 · The question matters more than the answer')+'<h1 class="q">“How” questions are warning signs</h1>'+
   L.prose('The way you ask the question drives the answer you get. The most common wrong question is '+L.g('how-question','“how?”')+' It jumps to method and skips why, or whether, the thing is worth doing. Tap each one.'));
  L.flips(L.card,[
   ['How long will it take?','We want to make good time, wherever we’re going.'],
   ['How do we get them to change?','The top blames the bottom, the bottom blames the top, and both blame the middle.'],
   ['What are the steps?','As if life reduces to a plan with milestones.'],
   ['How do we measure it?','As if what can’t be measured has no value.'],
   ['How do we communicate this?','Often a way to dodge questions of will, courage and commitment.'],
   ['Where has this worked?','A wish for safety. Then we say our situation is unique.']],
   'These questions appeal because they ask so little: they make the problem about skills and about people not in the room.');}},
{part:1,src:'Chapter 19 · Beyond How',run(L){
  L.h(L.kick('learn','Idea 5 · Beyond how')+'<h1 class="q">Ask why and where before how</h1>'+
   L.prose('“How” keeps you trying harder at what you already do. Questions that change thinking are harder to answer. Some of Block’s examples:')+
   L.list([['target','What is the point of what we are doing?','Who are we here to serve?'],
     ['leaf','What has to die before something new can start?','Change has a price.'],
     ['clock','What would happen if we did nothing?','Maybe just get better at what we do now.'],
     ['star','What strengths are we not using fully?','Stop fixing weaknesses; see what’s possible.']],2)+
   L.note('These are questions for the <b>client</b> to wrestle with, top to bottom. They aren’t for the consultant to answer. At some point you do ask “how?”, just not first.','chat'));
  L.done();}},
{part:1,src:'Chapter 19 · Beyond How',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Marcus asks Jordan, “How do we get the day shift to care about damage?” Which reply takes the question beyond how?</h1>');
  L.mc(L.card,['“What would a good roll-out plan look like?”','“How will we measure that they care?”','“What does the day shift see as the point of the work?”'],2,
   'It moves from method to meaning, and Marcus has to wrestle with it, not Jordan.',
   'A roll-out plan and a measure are both still “how” questions. They assume the answer is a technique. Ask about the point of the work.');}},
{part:1,src:'Chapter 19 · The Question Is More Important Than the Answer',pts:6,run(L){
  L.h(L.kick('pr','Warning sign or deeper question?')+'<h1 class="q">Sort what people at Copperleaf are asking.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['“How” warning sign','Beyond how'],[
   ['Lena: “What are other retailers doing about damage?”',0,'A wish to go second. Next comes “but we’re unique.”'],
   ['Renata: “Who is the team-lead program really for?”',1,'It asks about purpose and who we serve.'],
   ['Marcus: “How do we communicate the new rules to the floor?”',0,'Calling it a communication problem dodges real conflict.'],
   ['A lead: “What would happen if we changed nothing?”',1,'It tests whether change is needed at all.'],
   ['Lena: “How fast can we have this fixed?”',0,'Speed before direction.'],
   ['Kofi: “What do our crews do well that nobody uses?”',1,'It looks for untapped strengths.']],
   'Warning-sign questions ask little and put the problem on others. Deeper ones ask about purpose, price and strengths.');}},

/* ---------- PART 3: TENSION AND GIFTS ---------- */
{part:2,src:'Chapter 19 · Insight Resides in Moments of Tension',run(L){
  L.h(L.kick('learn','Idea 6 · Insight lives in moments of tension')+'<h1 class="q">The urge to “get practical” is often a defense</h1>'+
   L.prose('Deep questions and long reflection create tension, and people will call you impractical. The instinct is to retreat to action plans and lists. Everyone relaxes.')+
   L.prose('Block admits many of his own mistakes came from doing exactly that. The changes that followed were disappointing: weak follow-through, fading hope, just more action items.')+
   L.flow([['alert','Tension shows up','points to doubt or resistance'],['chat','Name it, discuss it','courage, not more structure'],['bulb','Insight follows','decisions of a different kind']]));
  L.done();}},
{part:2,src:'Chapter 19 · Insight Resides in Moments of Tension',run(L){
  L.h(L.kick('ex','Block’s own mistake')+'<h1 class="q">Eleven agencies meet to cooperate</h1>');
  L.beats(L.card,[
   ['The plan','Block facilitates eleven agencies who have come together to cooperate better. He planned plenty of open dialogue about their differences.'],
   ['The pressure','Halfway through, momentum builds for action. His co-planners huddle with him. He gives in and drops the planned dialogue.'],
   ['The task','Each agency’s own team gets an hour to propose what the whole group could do together that no one could do alone.'],
   ['The result','Every team reports only what <i>its own</i> agency could do. Nobody crosses boundaries or gives up a position.'],
   ['The lesson','The rush to action was a defense against the harder talk about what kept them apart. Block had colluded out of his own anxiety to be useful. Next morning, the moment was gone.']],
   'If you see tension as energy and go toward it, insight follows. Manage around it and you can lose the day.');}},
{part:2,src:'Chapter 19 · Insight Resides in Moments of Tension',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">At the last team-lead session, store and DC leads start trading blame over damaged deliveries. Someone says, “Let’s just list actions.” Everyone nods. What does Jordan do?</h1>');
  L.mc(L.card,['Agree, and capture the action list on the board','Name the tension and give it time to be heard','Split them into store and DC groups to cool down'],1,
   'The friction points to what really keeps stores and the DC apart. Naming it is where insight starts.',
   'A quick list relaxes everyone but skips what keeps the two groups apart. Splitting them into home teams is Block’s eleven-agency mistake. Name the tension.');}},
{part:2,src:'Chapter 19 · Capacities Bear More Fruit Than Deficiencies',run(L){
  L.h(L.kick('learn','Idea 7 · Capacities bear more fruit than deficiencies')+'<h1 class="q">Focusing on what’s missing keeps the expert in charge</h1>'+
   L.prose('Block once thought his job was to find what was missing. Now he looks for gifts and capacities. His reasons:')+
   L.list([['trend','Diminishing returns','We’ve already harvested what the deficiency field can yield.'],
     ['people','Citizens, not consumers','Community writer John McKnight argues that a focus on needs turns people with power into consumers with weaknesses. The provider benefits.'],
     ['shield','Needs talk is a power move','Whoever defines the needs is in charge. It puts others below us, and keeps us needed.']],1)+
   '<p class="small" style="margin-top:10px">Better to be present by choice than by need, and to affirm the best in what you see.</p>');
  L.done();}},
{part:2,src:'Chapter 19 · We Are Responsible for One Another’s Learning',run(L){
  L.h(L.kick('learn','Idea 8 · We are responsible for one another’s learning')+'<h1 class="q">Competition breeds isolation, and isolation blocks learning</h1>'+
   L.prose('From school onward, one person’s A needs another person’s D. Imagine a boss rating everyone outstanding: they would have a problem.')+
   L.prose('This isn’t a moral case against competition. It’s about learning: learning needs risk and not knowing, and that won’t happen if others are strangers with their own problems.')+
   L.note('If you work in a system that breathes competition, you may not change it. At a minimum, <b>refuse to reinforce it</b>.','people'));
  L.done();}},
{part:2,src:'Chapter 19 · Capacities Bear More Fruit Than Deficiencies',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which idea is Jordan using?',['Tension','Capacities','One another’s learning'],[
   ['Jordan scraps the “top performer” award and has each lead coach a peer.',2,'Jordan refuses to reinforce competition in the room.'],
   ['Marcus asks for a list of every supervisor’s weak spots. Jordan offers to map what each shift does well.',1,'Gifts, not gaps, and no one gets put below the consultant.'],
   ['When the room goes quiet after Lena’s visit, Jordan says, “Something just shifted. What happened?”',0,'Naming the tension instead of moving on.'],
   ['Jordan asks the leads to help each other prepare, not just themselves.',2,'Everyone in the room is responsible for everyone’s learning.'],
   ['Two leads keep circling the same disagreement. Jordan asks the group to stay with it ten more minutes.',0,'Courage, not structure. Stay in the hard area.']]);}},

/* ---------- PART 4: GO FIRST ---------- */
{part:3,src:'Chapter 19 · Culture Changes in the Moment',run(L){
  L.h(L.kick('learn','Idea 9 · Culture changes in the moment')+'<h1 class="q">The next hour is the action plan</h1>'+
   L.prose('In every session someone asks whether anything will be different afterward. Block’s answer: if you want change, don’t wait until you leave the room. If today isn’t different, why hope for tomorrow?')+
   L.list([['eye','The moment is data','How this meeting runs shows the culture, like the universe in a grain of sand.'],
     ['clock','Begin now','Want trust or cooperation? Start in this hour. What you do together counts, not what you say.'],
     ['people','The wrong people are never here','Change can’t include people who aren’t in the room. So why focus on them?']],4)+
   '<p class="small" style="margin-top:10px">Block adds that living in the moment means letting go of past guilt and resentment. Organizations leave little room for forgiveness.</p>');
  L.done();}},
{part:3,src:'Chapter 19 · If Change Is So Wonderful, Why Don’t You Go First?',run(L){
  L.h(L.kick('learn','Idea 10 · If change is so wonderful, go first')+'<h1 class="q">We colonize each other by defining others as the problem</h1>'+
   L.lanes([['person','At the top','Success makes leaders feel like a finished product. They take a stance of certainty and dispense change to others.',3],
            ['people','At the bottom','Employees create bosses too. Wanting high-control bosses lets them feel entitled: something is owed to them, and they aren’t the problem.',4]])+
   L.prose('Great leaders, Block notes, touched others through presence and humility more than position. Whoever wants the change is the one to <b>blink first</b>, and that includes the consultant.'));
  L.done();}},
{part:3,src:'Chapter 19 · Culture Changes in the Moment',run(L){
  L.h(L.kick('ex','Copperleaf')+'<h1 class="q">The last session of the team-lead program</h1>');
  L.beats(L.card,[
   ['The question','Sam asks, “Have our managers been through this? If they haven’t, what’s the point of us changing?”'],
   ['The pattern','Jordan recognizes it: whoever is in the room always says the people who need it are somewhere else.'],
   ['The move','Jordan asks instead: “What could be different in this room, in the next hour?” The leads agree to end with honest feedback to each other, which they had avoided all six weeks.'],
   ['Going first','Jordan starts. They name their own habit: saying “sure, I’ll do it” too fast, then resenting the load.'],
   ['The room','After Jordan’s admission, the leads’ feedback gets more honest. Ines thanks Theo for something they never said out loud.']],
   'Change can’t wait for people who aren’t here. It starts in this meeting, and the person asking for it goes first.');}},
{part:3,src:'Chapter 19 · If Change Is So Wonderful, Why Don’t You Go First?',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Lena tells Jordan, “The supervisors need to own their damage numbers.” Lena hasn’t looked at the numbers in months. What fits Block’s idea?</h1>');
  L.mc(L.card,['Invite Lena to show ownership first, in the next review','Build a better report so supervisors can’t ignore it'],0,
   'If change is so wonderful, the one asking for it goes first. Lena modeling ownership makes the request credible.',
   'A better report still defines the supervisors as the problem. Block’s idea: the person who wants the change goes first, here Lena.');}},
{part:3,src:'Chapter 19 · The Final Question Is One of Faith',run(L){
  L.h(L.kick('learn','The final question is one of faith')+'<h1 class="q">You don’t have to drive change. You join it.</h1>'+
   L.prose('All ten ideas trust that learning has its own energy. Life provides the disturbance; we don’t have to induce change or steer it. The consultant is as much a learner as any client, and is often more changed by the work.')+
   L.prose('In the end, your <b>authenticity</b>, the way you manage yourself and your connection to clients are your method, your marketing and the fruit of your work.')+
   L.quote('It will be enough if we simply show up.','Peter Block, chapter 19')+
   '<p class="small">That, Block says, takes an act of faith. It may be the heart of the matter.</p>');
  L.done();}},
{part:3,src:'Chapter 19 · The Heart of the Matter',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Jordan’s last week: which idea is at work?',['Learning over teaching','Struggle is the solution','Beyond how','Culture changes now','Go first'],[
   ['Marcus wants speed and supervisors want time. Jordan asks what each side is right about.',1,'Two true poles. Explore both before choosing.'],
   ['Jordan asks Kofi’s crew to teach the huddle themselves instead of writing it up.',0,'Those who build it do the learning.'],
   ['In a planning meeting, Jordan suggests the team start being candid with each other right now, not “from next quarter”.',3,'The future starts in this meeting.'],
   ['Renata asks how to roll the program out faster. Jordan asks who it’s really for.',2,'From method to purpose.'],
   ['Jordan asks Renata for feedback on their own work before giving any to the leads.',4,'The one asking for change goes first.']]);}}
  ]
});
</script>
</body>
</html>
