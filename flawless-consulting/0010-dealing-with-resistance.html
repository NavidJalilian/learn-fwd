<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dealing With Resistance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0010', title:'Dealing with resistance', minutes:18, icon:'chat',
  goals:['Explain why you let resistance blow over instead of fighting it','Use the three steps: pick up the cues, name the resistance, be quiet','Handle repeated questions and stone-hard clients without taking it personally'],
  parts:['Don’t fight it','Pick up the cues','Name it, then hush','Hard cases'],
  read:'Read chapter 9 of the book for the full table of naming statements and the complete list for consulting with a stone.',
  glossary:{
    'naming':'Naming the resistance: describing, in neutral everyday words, the form the client’s resistance is taking, so they can say their concern directly.',
    'good-faith':'Good-faith response: a real, honest answer to the content of a client’s question. Block suggests giving two before treating the question as resistance.',
    'stone':'Stone: Block’s word for a client who stays closed, critical and unresponsive even when you consult well.'
  },
  cheatsheet:[
    'You can’t talk people out of feelings. Let resistance <b>blow itself out like a storm</b>; fighting it keeps it alive.',
    'Ask the client to be authentic, and be authentic yourself. That is the whole strategy.',
    '<b>Step 1, pick up the cues:</b> trust what you see over what you hear, read your own boredom or irritation, listen for repetition and phrases like “You have to understand…”.',
    '<b>Step 2, name it</b> in neutral, everyday words, as you would to a close friend. If that fails, say how you feel about the discussion.',
    '<b>Step 3, be quiet.</b> Don’t pile on reasons. Live with the tension and let the client answer.',
    'Don’t take it personally (do that after six in the evening). If you truly made a mistake, own it: that isn’t resistance.',
    'Give <b>two good-faith answers</b> to a question. The third time, name the reluctance behind it.',
    'With a <b>stone</b>: seek understanding, not agreement or approval; expect no 50/50; give support; keep your investment small.'
  ],
  steps:[
/* ---------- PART 1: DON'T FIGHT IT ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">A friend is nervous about a job interview. You list five reasons they shouldn’t be. How do they most likely feel afterwards?</h1>');
  L.mc(L.card,['Still nervous, and now a bit unheard','Calm, because your reasons were good'],0,
   'Right. Good reasons rarely dissolve a feeling. Usually the feeling eases once it has been said and heard.',
   'Reasons don’t usually reach feelings. Most people end up still nervous, and also feeling unheard.');}},
{part:0,src:'Chapter 9 · Dealing with Resistance',run(L){
  L.h(L.kick('learn','Don’t overcome it')+'<h1 class="q">Resistance isn’t an opponent to wrestle down</h1>'+
   L.prose('People talk about “overcoming resistance”, as if a clever argument could win. But resistance is emotional, and you can’t talk people out of what they feel.')+
   L.prose('Block’s strategy: help the resistance <b>blow itself out, like a storm</b>. Feelings pass and change once they are said directly.')+
   L.flow([['chat','Ask','Invite the client to put their concern into words'],['person','Model','Be '+L.g('authentic','authentic')+' yourself'],['leaf','Let it pass','The storm runs its course']])+
   L.note('Fight it and you make it stronger. Defending your method for the twentieth minute only makes the client hunt harder for holes.','alert'));
  L.done();}},
{part:0,src:'Chapter 9 · Dealing with Resistance',pts:1,
 solve:async L=>{L.$('#pb').click();L.$('#gw').click();},
 run(L){
  const R={pb:['Push back','Jordan defends the survey method again, with references and past projects.',90,20,'Stuck in the middle. Both sides strain, and Marcus is now more set on finding holes.','var(--no)'],
           gw:['Give way','Jordan asks: “What worries you most about the method?” and lets Marcus go on.',25,80,'Marcus’s concern runs out of push and drops: “The method’s fine. My real worry is Lena.”','var(--ok)']};
  const seen=new Set();
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Block’s palms exercise: press your hands together. One is the client’s resistance, one is your response. Try both responses.</h1>'+
   '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="chip" id="pb">'+L.ic('x')+'Push back</button><button class="chip" id="gw">'+L.ic('leaf')+'Give way</button></div>'+
   '<div style="background:var(--soft);border-radius:16px;padding:14px;margin:10px 0 6px"><div class="small" id="ds">Choose a response above.</div>'+
   '<div class="meterrow"><div class="lb">Tension</div><div class="meter"><div id="mt" style="width:0%;background:var(--no)"></div></div></div>'+
   '<div class="meterrow"><div class="lb">Energy left</div><div class="meter"><div id="me" style="width:0%;background:var(--ok)"></div></div></div><div class="res" id="rs"></div></div><div id="pq"></div>');
  const show=(k)=>{seen.add(k);const r=R[k];L.$('#pb').classList.toggle('sel',k==='pb');L.$('#gw').classList.toggle('sel',k==='gw');
    L.$('#ds').innerHTML='<b>'+r[0]+':</b> '+r[1];L.$('#mt').style.width=r[2]+'%';L.$('#me').style.width=r[3]+'%';L.$('#rs').innerHTML='<span style="color:'+r[5]+'">'+r[4]+'</span>';
    if(seen.size===2&&!L.$('#pq').innerHTML){const q=L.$('#pq');q.innerHTML='<h2 class="sub">Why does giving way work?</h2>';
      L.mc(q,['Clients respect consultants who back down','Feelings pass once they are fully expressed','It saves time by skipping the method talk'],1,
       'Yes. Contacted but not opposed, the resistance goes as far as it can and drops of its own weight. Then the real concern comes out.',
       'It isn’t about backing down or saving time. Feelings pass once they are expressed, and then the client’s real reservation can be heard.');}};
  L.$('#pb').onclick=()=>show('pb');L.$('#gw').onclick=()=>show('gw');}},
{part:0,src:'Chapter 9 · Dealing with Resistance',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Marcus has questioned Jordan’s survey method for fifteen minutes. What is Block’s alternative to defending it?</h1>');
  L.mc(L.card,['Cite more studies that used the same method','Offer to redo the survey a different way','Ask Marcus more about their concerns'],2,
   'Right. Getting the client to talk about their concerns helps the storm pass. Defending keeps it alive.',
   'Citing studies keeps the storm going, and redoing the survey treats a feeling as a method problem. Asking about the concern lets it pass.');}},

/* ---------- PART 2: PICK UP THE CUES ---------- */
{part:1,src:'Chapter 9 · Three Steps for Handling Resistance',run(L){
  L.h(L.kick('learn','Three steps for handling resistance')+'<h1 class="q">Notice it, name it, then stop talking</h1>'+
   L.flow([['eye','1 · Pick up the cues','Notice what is happening and describe it to yourself','',1],
           ['chat','2 · Name it','Say the form it takes, in neutral, non-punishing words','',2],
           ['clock','3 · Be quiet','Let the client respond','',3]])+
   L.prose('Noticing and naming are separate skills. Block credits a friend with showing him that picking up the cues is its own step. Many people jump to naming before they really see what is going on.'));
  L.done();}},
{part:1,src:'Chapter 9 · Step 1: Pick Up the Cues',run(L){
  L.h(L.kick('learn','Step 1: pick up the cues')+'<h1 class="q">Three places to look</h1>'+
   L.prose('Technical training (engineering, accounting, data) points your attention at facts. Resistance lives on the emotional level, so you have to look for it on purpose.')+
   L.list([['eye','Trust what you see more than what you hear','Body language: leaning away, arms knotted, a pointing finger, head shaking each time you speak.'],
     ['flame','Listen to yourself','Your body is a thermometer. Feeling uneasy, bored or irritated is a cue. Real issues are never boring.'],
     ['cycle','Listen for repetition and telltale phrases','The same idea or question for the third time. Phrases like “You have to understand…” or “Let me explain something to you.”']],1));
  L.done();}},
{part:1,src:'Chapter 9 · Step 1: Pick Up the Cues',run(L){
  L.h(L.kick('ex','At Copperleaf')+'<h1 class="q">Jordan learns to read the room</h1>');
  L.beats(L.card,[
   ['The words','Jordan walks Marcus through the pilot plan. Marcus says, “Sounds good, carry on.”'],
   ['What Jordan sees','Marcus has turned their chair half toward the window, arms folded, and glances at their phone each time interviews come up.'],
   ['What Jordan feels','Jordan notices they are bored, and a bit irritated, in a meeting about their own project.'],
   ['What Jordan hears','Marcus asks, for the third time, how long each interview will take. Then: “Let me explain something to you about this floor.”'],
   ['The read','The words say yes. Everything else says Marcus is uneasy. Jordan describes it to themselves before saying anything: “Marcus agrees out loud and pulls away in every other way.”']],
   'Words were the weakest signal in the room. Body language, Jordan’s own boredom and the repeated question all pointed the same way.');}},
{part:1,src:'Chapter 9 · Listen to Yourself',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Halfway through a meeting about the pilot, Jordan catches themselves yawning while Marcus talks. What should Jordan take from it?</h1>');
  L.mc(L.card,['A cue that resistance may be present','Proof that Jordan needs more sleep','A sign the meeting is going smoothly'],0,
   'Yes. Boredom is a red flag. When a conversation faces real issues, it is never boring.',
   'Block treats your own boredom or irritation as a cue, not as tiredness or calm. Real issues are never boring.');}},
{part:1,src:'Chapter 9 · Step 1: Pick Up the Cues',pts:6,run(L){
  L.h(L.kick('pr','Where is the cue?')+'<h1 class="q">Sort each cue Jordan picks up by where it comes from.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['What Jordan sees','What Jordan feels','What Jordan hears'],[
   ['Marcus shakes their head every time Jordan mentions the packers.',0,'Nonverbal signals: trust what you see over what you hear.'],
   ['Jordan feels a knot of unease as the pilot dates come up.',1,'Your own unease can be the first sign that resistance is on its way.'],
   ['“You have to understand that the DC is not a store.”',2,'A telltale phrase: the client feels unheard and treats you as about to make a mistake.'],
   ['Jordan is irritated and wants the meeting to end.',1,'Irritation is a red flag, a message to start putting words on what is going on.'],
   ['Marcus asks, for the third time, who will see the interview notes.',2,'Repetition: the first two answers didn’t settle the concern underneath.'],
   ['Marcus leans far back from the table whenever interviews come up.',0,'Moving away from you is a body-language cue.']],
   'Three sources, one goal: notice the resistance before you try to name it.');}},

/* ---------- PART 3: NAME IT, THEN HUSH ---------- */
{part:2,src:'Chapter 9 · Step 2: Name the Resistance',run(L){
  L.h(L.kick('learn','Step 2: name the resistance')+'<h1 class="q">Describe the form it takes, in plain words</h1>'+
   L.prose(L.g('naming','Naming the resistance')+' means saying out loud what the client is doing, in a way that invites them to say their real reservation directly.')+
   L.lanes([['x','Punishing','“You’re being defensive.” “Why won’t you commit?” Labels a person and puts them on trial.',4],
            ['check','Neutral','“You’re giving me very short answers.” Describes what is happening, with no verdict.',2]])+
   L.note('Block’s hint: think of what you would say to a close friend or partner, and say that. Keep it simple and direct.','bulb'));
  L.done();}},
{part:2,src:'Chapter 9 · Step 2: Name the Resistance',run(L){
  L.h(L.kick('learn','Naming in action')+'<h1 class="q">Tap each form of resistance to see a neutral way to name it</h1>');
  L.flips(L.card,[
   ['Avoiding responsibility','“You don’t seem to see yourself as part of this problem.”'],
   ['Flooding you with detail','“This is more detail than I need right now.”'],
   ['Changing the subject','“We keep moving on to a new topic.”'],
   ['Compliance','“You agree to everything I suggest, and I can’t tell how you really feel.”'],
   ['Silence','“You’ve been very quiet, and I don’t know how to read it.”'],
   ['Methodology','“You have many questions about my methods. Do you doubt the results?”'],
   ['Intellectualizing','“Each time we get close to deciding, we go back to theories about why.”'],
   ['Attack','“You’re questioning a lot of what I do. You seem angry about something.”']],
   'Each one describes behavior and stops. No diagnosis, no blame. Most of the time, clients answer with a more direct statement of what they feel.');}},
{part:2,src:'Chapter 9 · Step 2: Name the Resistance',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Marcus answers every question with a twenty-minute history of the DC. Which naming fits Block’s advice?</h1>');
  L.mc(L.card,['“You’re dodging my questions on purpose.”','“You’re giving me more detail than I need.”','“Could we please try to stay on topic?”'],1,
   'Yes. It describes what is happening, neutrally, and leaves room for Marcus to say what is really on their mind.',
   '“Dodging on purpose” accuses Marcus, and “stay on topic” is a request that skips the resistance. A neutral naming just describes it.');}},
{part:2,src:'Chapter 9 · Step 2: Name the Resistance',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Neutral or punishing?',['Neutral naming','Punishing'],[
   ['“You keep going back to the carriers whenever we talk about the floor.”',0,'It describes a pattern without judging it.'],
   ['“You obviously don’t want to fix this.”',1,'It reads Marcus’s mind and passes a verdict. Expect more resistance.'],
   ['“You look as if you have other things on your mind today.”',0,'A plain description of low energy, the way you’d say it to a friend.'],
   ['“Your attitude is the real problem here.”',1,'It attacks the person. Block asks for neutral, non-punishing language.'],
   ['“I can’t tell what you really think about the pilot.”',0,'It names compliance or silence gently and invites a direct answer.']]);}},
{part:2,src:'Chapter 9 · A Hint for Finding the Right Words',run(L){
  L.h(L.kick('learn','When naming doesn’t help')+'<h1 class="q">Put your own feeling into words</h1>'+
   L.prose('Sometimes naming the client’s resistance gets nowhere. Another option is to say how <b>you</b> feel about the discussion, since resistance can leave you feeling frustrated, stupid or unimportant.')+
   L.list([['chat','For example','“I’m getting very frustrated with this conversation.”'],
     ['chat','Or','“My comments seem to be treated as if they don’t matter.”']],1)+
   L.prose('It is riskier. The client may answer, “So what?” But it is authentic, and authenticity tends to invite the same back. Sometimes the client stops and asks why, and the real talk begins.'));
  L.done();}},
{part:2,src:'Chapter 9 · Step 3: Be Quiet, Let the Client Respond',run(L){
  L.h(L.kick('learn','Step 3: be quiet')+'<h1 class="q">The hardest part is to stop talking</h1>'+
   L.prose('After naming the resistance, we tend to keep going: “You seem to have little energy for this. Let me give you four reasons it matters…” The first sentence was good. The rest takes the client off the hook.')+
   L.quote('Live with the tension.','Peter Block, chapter 9')+
   L.prose('We keep talking to ease our own discomfort. Make the statement, then stay silent and let the client answer.'));
  L.done();}},
{part:2,src:'Chapter 9 · Step 3: Be Quiet, Let the Client Respond',pts:1,
 solve:async L=>{L.$('#qt').click();},
 run(L){
  const S=['“Marcus, you seem to have very little energy for this pilot.”','“Let me give you four reasons it really matters…”','“First, Lena is watching the numbers. Second, the customers…”'];
  let lv=0,first=true;
  L.h(L.kick('pr','Stop at the right moment')+'<h1 class="q">Jordan has noticed Marcus’s low energy. Build Jordan’s turn: keep talking, or go quiet when it’s time.</h1>'+
   '<div class="ladder" id="ld"></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn" id="kt">Keep talking '+L.ic('down')+'</button><button class="btn pri" id="qt">'+L.ic('clock')+'Go quiet</button></div><div id="lf"></div>');
  const draw=()=>{L.$('#ld').innerHTML=S.slice(0,lv+1).map((x,j)=>(j?'<div class="conn"></div>':'')+'<div class="rung'+(j===lv?' cur':'')+'">'+x+'</div>').join('');L.$('#kt').hidden=lv>=S.length-1;};draw();
  L.$('#kt').onclick=()=>{lv=Math.min(lv+1,S.length-1);draw();};
  L.$('#qt').onclick=()=>{L.$('#kt').remove();L.$('#qt').remove();
    if(lv===0){if(first)L.award(true);L.sheet('ok','Then the silence works','A long pause. Then Marcus: “Honestly? Whatever the pilot shows, I think Lena will pin it on my team.” The naming did its job, because Jordan left room for the answer.');}
    else{if(first)L.award(false);L.sheet('no','Jordan talked past the moment','The first sentence named the resistance. Everything after it argued, and let Marcus off the hook. Block’s step 3: name it, then go quiet.');}
    L.done();};}},
{part:2,src:'Chapter 9 · Step 2: Name the Resistance',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Every time a decision gets close, Marcus starts theorizing about “kids these days”. Tap each piece to build Jordan’s naming.</h1>');
  L.sentence(L.card,[['“Each time we get close to deciding,','“You always do this:'],['you avoid the real issue on purpose.”','you go back to theories about why it happens.”'],['Then Jordan explains why theories waste time.','Then Jordan waits for Marcus to answer.']],[0,1,1],
   [['“You always do this” is a charge, not a description.'],['Saying it is on purpose blames Marcus and invites a fight.'],['Explaining takes Marcus off the hook. Step 3 is to be quiet.']],
   'Neutral words for the form the resistance takes, then silence. Steps 2 and 3 together.');}},

/* ---------- PART 4: HARD CASES ---------- */
{part:3,src:'Chapter 9 · Don’t Take It Personally',run(L){
  L.h(L.kick('learn','Don’t take it personally')+'<h1 class="q">The client’s behavior is not a verdict on you</h1>'+
   L.prose('In one of Block’s workshops, engineers listed eight to ten weaknesses in no time. Their lists of strengths averaged two items and took twice as long. That habit of self-criticism pulls attention away from the client, where the resistance belongs.')+
   L.list([['clock','Do it after six','If you must take it personally, do it on your own time in the evening, not in the room.'],
     ['check','Own real mistakes','If you really did poor work and the client says so, own it and fix it. That’s not resistance.'],
     ['target','It means you’re close','Resistance shows you touched something that matters.'],
     ['chat','Questions hide statements','Try to get the statement behind the question said out loud.']],2));
  L.done();}},
{part:3,src:'Chapter 9 · Good-Faith Responses',run(L){
  L.h(L.kick('learn','Good-faith responses')+'<h1 class="q">Answer twice. The third time, name it.</h1>'+
   L.prose('Most questions about your method carry the client’s discomfort. Still, answer the content honestly: that is a '+L.g('good-faith','good-faith response')+'.')+
   L.flow([['check','1st ask','Answer the content'],['check','2nd ask','Answer it again'],['chat','3rd ask','Name the reluctance to commit']])+
   L.prose('On the third ask, stop answering the content. Say that perhaps what the client feels is some reluctance to commit to the problem or the process. Don’t treat a commitment problem as a procedure problem.'));
  L.done();}},
{part:3,src:'Chapter 9 · Good-Faith Responses',pts:1,run(L){
  L.h(L.kick('pr','Put it in order')+'<h1 class="q">Marcus keeps asking how the packers for the interviews were picked. Put Jordan’s moves in order.</h1>');
  L.order(L.card,['Explain honestly how the packers were chosen','Explain it once more, in other words','Say Marcus may feel some reluctance to commit to this','Stop talking and let Marcus respond'],
   'Two good-faith answers, then name the resistance, then be quiet. The question has become a statement in disguise.');}},
{part:3,src:'Chapter 9 · Don’t Take It Personally',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'What should Jordan do?',['Answer the content','Name the resistance','Own the mistake'],[
   ['Marcus asks, for the first time, why night shift is in the survey.',0,'A first question deserves an honest, good-faith answer.'],
   ['Marcus asks the same question about sample size for the third time.',1,'Two good-faith answers are done. Now name the reluctance behind it.'],
   ['Marcus points out that Jordan’s chart counts every return twice. Jordan checks: it does.',2,'That is a real error, not resistance. Own it and fix it.'],
   ['Marcus, red-faced: “Head office has no idea what we do here!” for the fourth time.',1,'Name the anger neutrally, then stay quiet. It isn’t about Jordan.']]);}},
{part:3,src:'Chapter 9 · Consulting with a Stone',run(L){
  L.h(L.kick('learn','Consulting with a stone')+'<h1 class="q">Sometimes you consult flawlessly and still get nowhere</h1>'+
   L.prose('In one of Block’s workshops, a team came back from a real client who was withholding and told them they were doing a lousy job. Out of that despair came a list of ways to consult with a '+L.g('stone','stone')+'. Some of them:')+
   L.list([['Don’t look for approval or warmth','And don’t expect 50/50: stones put it all on you.'],
     ['Ask for understanding, not agreement','Let them control much of the procedure. Explain less: justifying makes it worse.'],
     ['Give support, show confidence','Remember the anxiety is about losing control. Look for comic relief.'],
     ['Keep moving','Hope they learn later, after you’re gone. Avoid stones when you can.']],3)+
   L.note('Real stones are rare. A hard surface often hides a soft inside, and clear support can soften it. If not, keep your investment small, skip the heroics, and try not to turn into a stone yourself.','info'));
  L.done();}},
{part:3,src:'Chapter 9 · Consulting with a Stone',pts:6,run(L){
  L.h(L.kick('pr','Stone tactics')+'<h1 class="q">A new regional director joins the scheduling-tool rollout and shoots down everything. Sort Jordan’s ideas.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Fits Block’s list','Works against it'],[
   ['Ask the director to understand the plan, without pushing for agreement.',0,'Understanding is a fair ask. Agreement may never come.'],
   ['Build a longer deck that justifies every number.',1,'Elaborating and justifying the data just makes it worse with a stone.'],
   ['Let the director decide how the rollout meetings are run.',0,'Giving a stone control over procedure eases their worry about losing control.'],
   ['Wait for the director to share the work 50/50.',1,'Stones dump the responsibility on you. Don’t expect a fair split.'],
   ['Ask the director how they feel about the change.',1,'With a stone, asking for feelings (or sharing yours) tends not to help.'],
   ['Keep showing support and quiet confidence.',0,'Clear support is what sometimes softens a stone.']],
   'With a stone, lower your expectations, not your standards: support, understanding, and a small investment.');}}
  ]
});
</script>
</body>
</html>
