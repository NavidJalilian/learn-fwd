<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Internal Consultant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0008', title:'The internal consultant', minutes:17, icon:'layers',
  goals:['Explain why consulting from inside a company carries more risk','Map a triangular or rectangular contract and explore every side of it','Contract with your own boss, starting with an exchange of wants'],
  parts:['Riskier inside','Triangles and rectangles','Your boss’s norms','Contract with your boss'],
  read:'Read chapter 7 of the book for the full lists of norms and wants the internal consultants gave.',
  glossary:{
    mandate:'Mandate: an order from above that a change must happen, whether or not the client chose it.',
    'triangular-contract':'Triangular contract: a contract with three parties: the consultant, the client and the consultant’s own boss, who has goals of their own.',
    'rectangular-contract':'Rectangular contract: a contract with four parties: the consultant, the client and both of their bosses. It often starts with a deal between the two bosses.',
    'soft-contract':'Soft contract: a vague agreement where the consultant gives in too easily and doesn’t say what they need.'
  },
  cheatsheet:[
    'Internal consultants have a <b>boss</b>, <b>department goals</b>, a <b>small pool of clients</b> and a <b>known status</b>. That makes contracting riskier.',
    'Much internal work runs by <b>mandate</b>, not choice. You can’t always stop it, but you can make its costs explicit and still question it.',
    'Too cautious and you become a pair of hands. Ignore the constraints and you look immature and disloyal. Aim to consult flawlessly.',
    'You are always in at least a <b>triangle</b>: you, the client and your boss. Often a <b>rectangle</b>: add the client’s boss.',
    'Meet each party if you can, and explore every side before discovery begins.',
    'Many problems with clients are really problems with your own boss.',
    'Unclear contract with your boss leads to <b>soft contracts</b> with clients: giving in too easily, not backing away, pushing your department’s line too hard.',
    'Swap want-lists with your boss and agree a balance between the department’s commitments and your clients’ needs.'
  ],
  steps:[
/* ---------- PART 1: RISKIER INSIDE ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Who is it harder to give blunt feedback to?</h1>');
  L.mc(L.card,['A client you will never work with again','A director you’ll need again next year'],1,
   'Right. When your future depends on the people you advise, honesty feels riskier. That is the internal consultant’s daily life.',
   'A one-off client can’t hurt your next year. The director down the hall can, and that is what makes internal consulting feel riskier.');}},
{part:0,src:'Chapter 7 · The Internal Consultant',run(L){
  L.h(L.kick('learn','“Easy for you to say”')+'<h1 class="q">Internal consultants live inside the place they advise</h1>'+
   L.prose('In Block’s workshops, internal consultants listen to talks on saying no and confronting managers. Then someone at the back says: that is easy for you, an outsider. If a manager gets mad at us, we are in trouble.')+
   L.prose('Block used to argue that the issues are the same. Now he agrees there are real differences. An internal consultant sits inside the hierarchy and its politics at every moment.')+
   L.lanes([['person','A boss','Someone you must satisfy, at least to some extent.',3],['target','Department goals','A process or procedure your group wants the sites to adopt.',1]]));
  L.done();}},
{part:0,src:'Chapter 7 · Important Differences Between Internal and External Consultants',run(L){
  L.h(L.kick('learn','Six pressures outsiders feel less')+'<h1 class="q">What having a boss and department goals does to you</h1>'+
   L.list([['Not just the client’s wants','You bring procedures to adopt that may clash with the manager’s own style.'],
     ['Measured on adoption','You may be judged on how many managers take up your group’s programs.'],
     ['Convert an adversary','A manager has refused your department for years, and it’s your job to win them over.'],
     ['A small pool of clients','One angry key manager can be a disaster. Word travels, and demand for you can vanish.'],
     ['A known status','Everyone knows your level, which can limit your access to senior people.'],
     ['Prophet in your own land','Managers see you as caught in the same madness they are, so they are slower to trust you. Block says this is overplayed, but partly true.']],4));
  L.done();}},
{part:0,src:'Chapter 7 · Important Differences Between Internal and External Consultants',run(L){
  L.h(L.kick('learn','Operating by mandate')+'<h1 class="q">You often work by order, not by choice</h1>'+
   L.prose('Internal consultants often work by '+L.g('mandate','mandate')+'. That makes internal contracting higher-risk. Block’s answer: in the end, you can make the <b>costs</b> of a mandated change explicit. Not having the final decision is no reason to stop questioning the project.')+
   L.lanes([['shield','Too cautious','Never push back, never give hard feedback. In the long run you get used only as a '+L.g('pair-of-hands','pair of hands')+'.',2],
            ['flame','Ignore the constraints','Act as if there were no politics. You may be called immature, disloyal, “not sensitive to how we operate”.',4]])+
   L.note('Block’s way between the two: consult '+L.g('flawless','flawlessly')+'. Take higher risk for higher payoff, and keep the client’s respect.','scale'));
  L.done();}},
{part:0,src:'Chapter 7 · Important Differences Between Internal and External Consultants',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">The scheduling tool must go to every site; Jordan can’t stop it. What can Jordan still do, according to Block?</h1>');
  L.mc(L.card,['Make the costs of forcing it on the DC explicit','Stay quiet, since the decision is already made','Quietly let the DC fall behind the deadline'],0,
   'Not having the final decision is no reason to avoid questioning the project. Naming the costs is what an internal consultant can always do.',
   'Silence makes Jordan a pair of hands, and quiet sabotage is neither authentic nor loyal. Block’s answer: make the costs of the mandate explicit.');}},
{part:0,src:'Chapter 7 · Important Differences Between Internal and External Consultants',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which internal pressure is this?',['Measured on adoption','Convert an adversary','Small client pool','Known status','Prophet in own land'],[
   ['Renata’s team bonus depends on how many sites use the scheduling tool by year end.',0,'The department is judged on adoption, so the pressure to sell is high.'],
   ['Marcus has turned down Business Improvement twice. Renata tells Jordan: “You’re the one who can bring them round.”',1,'Winning over a long-time refuser is the classic internal assignment.'],
   ['After one tense project, two store managers quietly stop asking Jordan for help.',2,'Inside one company, word travels and the client pool is small.'],
   ['Jordan asks to see Lena directly and is told to “go through Marcus”.',3,'Everyone knows Jordan’s level, which limits their access to senior people.'],
   ['Marcus says: “You head-office types live in the same mess we do. What can you see that I can’t?”',4,'Marcus sees Jordan as caught in the same forces, so trust comes slowly.']]);}},
{part:0,src:'Chapter 7 · Important Differences Between Internal and External Consultants',pts:1,
 solve:async L=>{const c=L.$('#pp').children;for(const b of c)b.click();},
 run(L){
  const P=[['shield','Play it safe','Jordan never says no to Marcus and never gives hard feedback.','Six months on, Marcus uses Jordan to fill in forms and chase data. Jordan has become a pair of hands.'],
    ['flame','Ignore the constraints','Jordan argues with Marcus in front of their team and scoffs at “how we do things here”.','Six months on, Jordan is seen as immature and disloyal, and other directors hear about it.'],
    ['scale','Consult flawlessly','Jordan says what they want, names the costs of the mandate and is honest about their doubts.','This is the path Block offers: higher risk and higher payoff, while keeping Marcus’s respect.']];
  const seen=new Set();
  L.h(L.kick('pr','Toggle and compare')+'<h1 class="q">Jordan has to carry the scheduling tool to Marcus. Try each way of working and see where it leads.</h1><div id="pp"></div>'+
   '<div style="background:var(--soft);border-radius:16px;padding:14px;margin:8px 0 6px;min-height:110px"><div class="small" id="pw">Choose a path above.</div><div id="pr" style="margin-top:8px"></div></div><div id="pq"></div>');
  P.forEach((x,j)=>{const b=document.createElement('button');b.className='chip';b.innerHTML=L.ic(x[0])+x[1];
    b.onclick=()=>{[...L.$('#pp').children].forEach(y=>y.classList.remove('sel'));b.classList.add('sel');seen.add(j);
      L.$('#pw').innerHTML='<b>What Jordan does:</b> '+x[2];L.$('#pr').innerHTML='<b>Where it leads:</b> '+x[3];
      if(seen.size===3&&!L.$('#pq').innerHTML){const q=L.$('#pq');q.innerHTML='<h2 class="sub">Which path does the book offer internal consultants?</h2>';
        L.mc(q,['Play it safe with every client','Consult flawlessly and name the costs','Ignore how the company operates'],1,
         'Block’s approach lets internal consultants take higher risks for a higher payoff and still be respected.',
         'Both extremes fail: caution turns Jordan into a pair of hands, and ignoring the constraints makes them look disloyal. Consult flawlessly.');}};
    L.$('#pp').appendChild(b);});}},

/* ---------- PART 2: TRIANGLES AND RECTANGLES ---------- */
{part:1,src:'Chapter 7 · Triangles and Rectangles',run(L){
  L.h(L.kick('learn','The triangle')+'<h1 class="q">There is always a third party: your own boss</h1>'+
   L.prose('The meeting with the line manager is only the start of contracting. Every support group has priority projects and beliefs about how to work with clients. Its consultants must serve the client <i>and</i> deliver on their own department’s commitments.')+
   L.flow([['person','You','The consultant','',1],['home','The client','The line manager','',2],['layers','Your boss','With department goals','',3]],false)+
   L.prose('So an internal consultant is always in at least a '+L.g('triangular-contract','triangular contract')+'. Your boss is part of the deal, whether or not they are in the room.'));
  L.done();}},
{part:1,src:'Chapter 7 · Triangles and Rectangles',run(L){
  L.h(L.kick('learn','The rectangle')+'<h1 class="q">When the two bosses made the deal first</h1>'+
   L.prose('Sometimes the contract is a '+L.g('rectangular-contract','rectangle')+' or even a pentagon. A rectangle can begin with a general understanding between your boss and the client’s boss.')+
   L.prose('Then you and the client show up to work together, though neither of you really chose it, with a commitment already made. That makes contracting take longer.')+
   L.list([['people','Meet each party','Clarify expectations with every corner, if you can.'],['eye','If you can’t','At least know what you are up against. Don’t treat contracting as simple.'],['compass','Before discovery','Explore every side of the triangle or rectangle first.']],2));
  L.done();}},
{part:1,src:'Chapter 7 · Triangles and Rectangles',run(L){
  L.h(L.kick('ex','How it plays out at Copperleaf')+'<h1 class="q">Jordan’s rectangle around the scheduling tool</h1>');
  L.beats(L.card,[
   ['The bosses’ deal','At an operations leadership meeting, Renata and Lena agree every site goes onto the scheduling tool this year, including the DC.'],
   ['Two people who didn’t choose','Jordan is told to deliver it. Marcus is told to accept it. Neither chose this project, yet both have to start.'],
   ['Corner 1 · Renata','Jordan asks what success means for the department. Renata: the DC counts as adopted once one shift is live and using it.'],
   ['Corner 2 · Lena','Jordan asks for 20 minutes with Lena. Lena’s real need is fewer last-minute staffing gaps, not the tool for its own sake.'],
   ['Corner 3 · Marcus','Jordan tells Marcus what Renata and Lena said. For the first time, Marcus sees what is fixed and what is open to negotiation.']],
   'Exploring each side first stretched the contracting phase, but Jordan started with no hidden expectations.');}},
{part:1,src:'Chapter 7 · Triangles and Rectangles',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Jordan has met Marcus about the tool but not yet Renata or Lena. When should those sides be explored?</h1>');
  L.mc(L.card,['Once the tool is already running at the DC','Only if Marcus raises a complaint','Before discovery begins'],2,
   'Block: each side of the triangle or rectangle needs to be explored before the discovery process begins.',
   'Waiting means working with hidden expectations. Block says to explore every side of the contract before discovery begins.');}},
{part:1,src:'Chapter 7 · Triangles and Rectangles',pts:5,run(L){
  L.h(L.kick('pr','Map the corners')+'<h1 class="q">Whose expectation is each one? Sort them onto the rectangle.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Renata','Marcus','Lena'],[
   ['Count the DC as an adopted site this year',0,'Adoption is how Renata’s department is measured.'],
   ['Supervisors keep the final say on every schedule',1,'Marcus wants to keep control on their own floor.'],
   ['Fewer last-minute staffing gaps across the company',2,'Lena, the client’s boss, cares about the business result.'],
   ['A quarterly report on how many sites use the tool',0,'Reports on adoption serve Jordan’s own department.'],
   ['No extra time off the floor for packers',1,'Marcus guards their people’s time.']],
   'Each corner wants something different. Jordan can only balance them if they know all of them.');}},
{part:1,src:'Chapter 7 · Your Boss’s Expectations',pts:1,run(L){
  L.h(L.kick('pr','What would you do?')+'<h1 class="q">Jordan raises the scheduling tool in every deliveries meeting. Marcus snaps: “Is that all you’re here for?” What is most likely underneath?</h1>');
  L.mc(L.card,['Marcus simply dislikes new technology','An unclear contract between Jordan and Renata','Jordan needs better slides on the tool'],1,
   'Block notes that many problems between internal consultants and clients are symptoms of problems with their own boss. Jordan is pushing Renata’s priority past what is reasonable.',
   'It may look like Marcus or the slides, but Block says many client problems are really problems with your own boss. Jordan is pushing Renata’s goal too hard because their deal with Renata is unclear.');}},

/* ---------- PART 3: YOUR BOSS'S NORMS ---------- */
{part:2,src:'Chapter 7 · Your Boss’s Expectations',run(L){
  L.h(L.kick('learn','Unwritten rules from above')+'<h1 class="q">Expectations no consultant could meet</h1>'+
   L.prose('Block asked a group of engineering consultants what their organization told them about how to work. Their answers, paraphrased, include:')+
   L.list([['target','No matter what, get the job done',''],['people','Every client can be reached',''],['x','Never admit a mistake to a client',''],['chat','Don’t upset or antagonize the client',''],['trend','Convince the client; sell the company way',''],['cycle','Keep contracts very, very flexible','']],3)+
   L.note('No single boss says all of these. Together they show the bind a consultant is in when the contract with their own boss isn’t clear and explicit.','info'));
  L.done();}},
{part:2,src:'Chapter 7 · Contracts with Your Boss',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">If Jordan’s contract with Renata stays unclear, what does Block expect to happen with clients?</h1>');
  L.mc(L.card,['Jordan gets clearer, firmer contracts','Jordan slips into soft contracts','Clients stop noticing Jordan’s boss'],1,
   'Unclear with the boss means '+'soft contracts with clients: giving in too easily, not backing away from long shots, and pushing the department’s priorities too hard.',
   'Block says the opposite: an unclear contract with your boss leads to soft contracts with clients, giving in too easily and pushing your department’s priorities too far.');}},
{part:2,src:'Chapter 7 · Your Boss’s Expectations',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which unwritten rule is driving Jordan?',['Every client can be reached','Never admit a mistake','Don’t upset the client','Sell the company way'],[
   ['Jordan’s interview plan clashed with the DC’s busiest day. They blame the calendar instead of saying “I got that wrong.”',1,'Owning a mistake is authentic. The unwritten rule pushes Jordan to cover it.'],
   ['After Marcus’s third refusal, Jordan books a fourth pitch without asking whether it has any chance.',0,'Not every client can be reached. A project with little chance of success may need a no.'],
   ['Jordan keeps steering the deliveries talk back to the scheduling tool.',3,'Pushing the department’s product past what is reasonable distances Jordan from the client.'],
   ['Jordan disagrees with Marcus’s plan but says nothing, so the meeting stays pleasant.',2,'Keeping things smooth avoids the hard feedback the client may need.']]);}},

/* ---------- PART 4: CONTRACT WITH YOUR BOSS ---------- */
{part:3,src:'Chapter 7 · Contracts with Your Boss',run(L){
  L.h(L.kick('learn','Wants go up as well as out')+'<h1 class="q">What consultants want from their boss looks a lot like what they want from clients</h1>'+
   L.lanes([['layers','From the boss','A clear job before being sent out. Access to the boss. Help with the political side. Not being overcommitted. Freedom to negotiate each contract. Little bias about the outcome.',3],
            ['home','From the client','A clear job. Access to the real client and the data. Working the problem together. Commitment. Shared blame and glory. Openness and feedback. No bias about the outcome.',2]])+
   L.prose('The clearer your agreement with your boss, the better you can respond to clients. Without it, you drift into '+L.g('soft-contract','soft contracts')+'.'));
  L.done();}},
{part:3,src:'Chapter 7 · Try This Exercise',run(L){
  L.h(L.kick('ex','Block’s exercise, at Copperleaf')+'<h1 class="q">Jordan and Renata swap want-lists</h1>');
  L.beats(L.card,[
   ['Jordan’s list','A clear brief before each site. Help with the politics around Marcus and Lena. Freedom to shape each site’s contract. No fixed answer about how the DC rollout must look.'],
   ['Renata’s list','The DC counted as adopted this year. Early warning when a site is stuck. No promises to sites the team can’t keep.'],
   ['The swap','They exchange lists and meet. Renata is surprised Jordan felt they could never say no to a director.'],
   ['The deal','The DC rollout may start small and late, as long as one shift is live this year. Jordan flags trouble within a week. Renata joins the next Lena meeting.']],
   'The aim is a reasonable balance between what the department owes the company and what Jordan needs to serve clients well.');}},
{part:3,src:'Chapter 7 · Try This Exercise',pts:1,run(L){
  L.h(L.kick('pr','Put it in order')+'<h1 class="q">Arrange Block’s exercise for contracting with your boss.</h1>');
  L.order(L.card,['List the key wants you have of your boss','Ask your boss to list their wants of you','Exchange the two lists','Meet and agree a balanced contract'],
   'Wants first, on both sides, then the exchange and a balanced agreement, just like contracting with a client.');}},
{part:3,src:'Chapter 7 · Contracts with Your Boss',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Renata says: “Your job is to get Marcus on board, whatever it takes.” Tap each piece to build Jordan’s reply.</h1>');
  L.sentence(L.card,[
   ['“I’ll do whatever it takes,','“I can’t promise Marcus will adopt it,','“That’s really Lena’s call, not ours,'],
   ['but I can make the costs of forcing it clear,','so let’s just drop the DC from the list,','so I’ll keep my doubts to myself,'],
   ['and I’ll report back once it’s done.”','and Marcus can sort it out with Lena.”','and I’d like us to agree what counts as success.”']],[1,0,2],
   [['That accepts the unrealistic norm “every client can be reached”.','That passes the problem to someone not in the room.'],
    ['Jordan can question the mandate, but can’t cancel it on their own.','Hiding doubts leads straight to a soft contract.'],
    ['Reporting back only at the end leaves the contract with Renata unclear.','That hands the problem to Marcus and Lena instead of Jordan contracting with Renata.']],
   'Jordan is honest about what they can promise, names the costs of the mandate and asks Renata for a clear contract.');}},
{part:3,src:'Chapter 7 · Try This Exercise',pts:1,run(L){
  L.h(L.kick('pr','Putting it together')+'<h1 class="q">Jordan and Renata swap lists, but the meeting goes badly. Renata gets defensive. What does Block suggest Jordan is facing?</h1>');
  L.mc(L.card,['Proof that bosses can’t be contracted with','A sign Jordan asked for too much','Resistance, the topic of the next lessons'],2,
   'Block closes the chapter by saying that if the talk with your boss goes badly, you are ready for the chapters on resistance.',
   'Block doesn’t say to give up or to want less. If the talk goes badly, you are meeting resistance, which the next two chapters cover.');}}
  ]
});
</script>
</body>
</html>
