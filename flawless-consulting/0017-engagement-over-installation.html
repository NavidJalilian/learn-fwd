<!doctype html>
<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Engagement Over Installation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0017', title:'Engagement over installation', minutes:18, icon:'people',
  goals:['Tell an installation plan from an engagement plan at a glance','Explain why a decision at the top doesn’t get a change done','Spot the four ways vision, standards and measures get misused'],
  parts:['Not rational','Deciding isn’t doing','Limits','Betting on it'],
  read:'Read chapter 16 of the book for Block’s full account of the limits of installation and his story of four hundred vision statements.',
  glossary:{
    'installation':'Installation: treating change as something you can engineer and roll out onto people, using a vision, standards, measures and a defined set of steps.',
    'lamination':'Leadership by lamination: believing change grows from the top’s vision, written once, made permanent and handed down for others to follow.',
    'cosmetic-change':'Cosmetic change: the talk about a change is perfect, but people’s day-to-day work stays the same.',
    'compliance':'Compliance: doing what is required because you must, without choosing it or caring whether it works.'
  },
  cheatsheet:[
    'Implementation is <b>not a rational process</b>. Knowing what to do and getting it done are two different worlds.',
    '<b>Installation</b> = vision, standards, measures and steps, rolled out like a blueprint. <b>Engagement</b> = bringing people together to create and plan how to make it work.',
    'Two aspects of implementation: your <b>technical work</b>, and <b>building commitment</b> among the people who live with the change.',
    'Implementation starts when the people who do the work decide to make real changes or just go through the motions. <b>The boss deciding doesn’t get it done.</b>',
    'Vision, standards and measures are fine. Misused as tools of control, they buy <b>compliance</b>, not accountability.',
    'Four traps: leadership by <b>lamination</b>, “higher standards, and this time we mean it”, <b>people need fixing</b>, “if we can’t measure it, it doesn’t matter”.',
    'Don’t plan with the client how to change people outside the room. Keep measures in the hands of <b>those doing the work</b>.',
    'When pressure fails, don’t push harder. Bet on <b>engagement and dialogue</b>.'
  ],
  steps:[
/* ---------- PART 1: NOT RATIONAL ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Two years ago an outside firm gave Marcus a thick report on the DC. Marcus agreed with every page. Nothing changed. What is the likeliest reason?</h1>');
  L.mc(L.card,['The report’s recommendations were wrong','Agreeing in an office didn’t move the floor'],1,
   'The ideas may well have been right. Nobody on the floor ever chose to act on them. This lesson is about that gap.',
   'Maybe, but Marcus agreed with every page, so it probably wasn’t the content. Agreement in an office didn’t change how anyone on the floor worked.');}},
{part:0,src:'Chapter 16 · Implementation',run(L){
  L.h(L.kick('learn','The point of it all')+'<h1 class="q">Knowing what to do and getting it done are two different worlds</h1>'+
   L.prose('Implementation is the point of a consultation: the fruit of contracting, discovery and feedback. Yet Block has watched many projects do all of that well and still produce few real results.')+
   L.flow([['eye','Discovery','Knowing <b>what</b> to do','',1],['play','Implementation','Finding the way to <b>do</b> it','',3]])+
   L.prose('His diagnosis: we treat implementation as a <b>rational</b> process. Make a plan, list the steps, set milestones, and it will happen. Consultants give too much attention to analysis and recommendations, and too little to turning answers into action.'));
  L.done();}},
{part:0,src:'Chapter 16 · Choosing Engagement over Installation',run(L){
  L.h(L.kick('learn','Two ways to bring change')+'<h1 class="q">You can’t install change in a living system</h1>'+
   L.lanes([['box','Installation','Clear goals, a defined set of steps, objectives and measures. A blueprint for others to follow. The engineering mind: great for machines, incomplete for people.',3],
            ['people','Engagement','Bringing people together to create and plan how to make something work. The mind of a social architect and the skills of a community organizer.',2]])+
   L.prose('Every change has a <b>tangible</b> side (methods, structure) and an <b>intangible</b> side (relationships, faith and commitment). '+L.g('installation','Installation')+' only reaches the first. Block offers '+L.g('engagement','engagement')+' as the alternative, or at least as an addition.')+
   '<p class="small">He points back to positive deviance and whole-system work: both bet on people gathering and finding their own answers.</p>');
  L.done();}},
{part:0,src:'Chapter 16 · Choosing Engagement over Installation',run(L){
  L.h(L.kick('ex','Copperleaf')+'<h1 class="q">Marcus is ready to act. Here is the plan Marcus sketches.</h1>');
  L.beats(L.card,[
   ['The decision','The feedback meeting is over. Marcus accepts the picture and wants damaged deliveries down, fast.'],
   ['Step 1','A memo to all packers: “New packing standard, effective Monday.”'],
   ['Step 2','A damage target for every packer, checked by head office each week.'],
   ['Step 3','Lena’s idea: Kofi’s huddle printed on a laminated card for every shift.'],
   ['Step 4','A training course for day shift, run by Jordan.'],
   ['Jordan notices','Every step is something done <i>to</i> the floor. Nobody who packs a sofa gets a say in any of it.']],
   'Marcus’s plan is pure installation: standards, measures and a blueprint handed down. It feels decisive, and it skips the people who must make it work.');}},
{part:0,src:'Chapter 16 · Choosing Engagement over Installation',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Which of these steps is engagement rather than installation?</h1>');
  L.mc(L.card,['Post the new packing standard on every dock','Email each packer their weekly damage score','Ask day-shift packers to design their own pack check'],2,
   'The people who do the work create and plan how to make it work. That is engagement.',
   'Posting a standard and sending scores are both handed down from above. Only the third gives the people doing the work a hand in creating the change.');}},
{part:0,src:'Chapter 16 · Choosing Engagement over Installation',pts:6,run(L){
  L.h(L.kick('pr','Sort the moves')+'<h1 class="q">Jordan lists ideas for the damage work. Which are installation, and which are engagement?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Installation','Engagement'],[
   ['A five-step rollout plan written by Jordan and Marcus alone',0,'A blueprint for others to follow, made without them.'],
   ['Day-shift volunteers and Kofi’s crew compare how they pack, side by side',1,'People come together and find their own answers.'],
   ['A poster of Marcus’s new vision for the DC',0,'The top’s vision, handed down.'],
   ['Packers and drivers decide together what a “safe load” looks like',1,'The people who live with it plan how to make it work.'],
   ['A bonus for any shift that hits zero damage',0,'An inducement: trying to buy the behavior into existence.'],
   ['Supervisors and packers review the complaint data together each week',1,'A shared conversation, with the data in the hands of the people doing the work.']],
   'Installation hands a plan to people. Engagement brings them together to create it.');}},

/* ---------- PART 2: DECIDING ISN'T DOING ---------- */
{part:1,src:'Chapter 16 · Choosing Engagement over Installation',run(L){
  L.h(L.kick('learn','Two aspects of implementation')+'<h1 class="q">Your expertise is only half the job now</h1>'+
   L.tiers([['pencil','The technical work','What you trained for. A financial analyst brings in controls; an IT specialist redesigns software; a training manager starts the course.','Jordan: redesign the packing steps'],
            ['people','Building commitment','Getting real support for the change among the people who have to live with it, in a system where you are only a guest.','Jordan: help the floor choose to change',true,'Often skipped']])+
   L.note('Implementation doesn’t actually begin until the people who do the work decide whether to make <b>real changes</b> or just <b>go through the motions</b>.','alert'));
  L.done();}},
{part:1,src:'Chapter 16 · Deciding Doesn’t Get It Done',run(L){
  L.h(L.kick('learn','Deciding doesn’t get it done')+'<h1 class="q">The boss making up their mind is not the same as action</h1>'+
   L.prose('Too many projects end in '+L.g('cosmetic-change','cosmetic change')+': the talk is perfect, but people’s working day doesn’t match the promise. Block says consultants collude with this when they believe new behavior can be defined, driven, bought or measured into existence.')+
   L.prose('One root cause is our faith in <b>executive decisiveness</b>: once the boss decides, action will follow. It rarely does. No one person makes a product or runs a business.')+
   L.lanes([['person','Managers','Know this already. They see every day that their best intentions often don’t change how work gets done.',2],
            ['alert','Consultants','Struggle to accept it, and complain that managers lack the will to follow through on our recommendations.',3]])+
   L.prose('Change in human systems depends far more on the <b>consent of the governed</b> than on the will of those in charge.'));
  L.done();}},
{part:1,src:'Chapter 16 · Deciding Doesn’t Get It Done',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">The scheduling-tool trial stalls on day shift. Jordan tells Renata: “Marcus just needs the backbone to enforce it.” What would Block say?</h1>');
  L.mc(L.card,['Jordan is right: decisiveness is the missing piece','The floor’s consent matters more than Marcus’s will'],1,
   'Block calls the faith in leaders’ decisiveness a magical belief. Change depends on whether the people doing the work choose it.',
   'That is exactly the consultants’ complaint Block criticizes. More decisiveness won’t help; the people doing the work have to choose the change.');}},
{part:1,src:'Chapter 16 · Choosing Engagement over Installation',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which aspect of implementation is this?',['Technical work','Building commitment'],[
   ['Jordan maps the packing steps and finds where sofas get scratched.',0,'Using process expertise on the work itself.'],
   ['Jordan asks the day-shift crew what would make a pack check worth doing for them.',1,'Helping the people who do the work choose the change.'],
   ['Jordan sets up the shift templates in the new scheduling tool.',0,'Configuring the tool is the technical side.'],
   ['Jordan invites supervisors to say openly what worries them about the tool.',1,'Building real support, not just setting up the system.'],
   ['Jordan redesigns the wrapping layout for glass tables.',0,'Technical expertise applied to the product.']]);}},

/* ---------- PART 3: LIMITS OF INSTALLATION ---------- */
{part:2,src:'Chapter 16 · The Limits of Installation',run(L){
  L.h(L.kick('learn','The limits of installation')+'<h1 class="q">The tools are fine. Using them to control people isn’t.</h1>'+
   L.flow([['eye','Vision','Say where we’re going','',1],['target','Standards','Say what’s expected','',2],['trend','Measures','Say how we’ll track it','',3]])+
   L.prose('All three are normal parts of working life. The trouble starts when they are created centrally and used to keep control and make the world predictable. Then they become quiet forms of coercion.')+
   L.prose('People lose the chance to <b>choose</b> accountability by designing their own answers. We invite their '+L.g('compliance','compliance')+' instead. Block names four ways this happens; the next screens take them one by one.'));
  L.done();}},
{part:2,src:'Chapter 16 · Leadership by Lamination',run(L){
  L.h(L.kick('learn','Trap 1 · Leadership by lamination')+'<h1 class="q">A vision on a wallet card has already stopped living</h1>'+
   L.prose('Block admits he helped cause this one. A chapter he wrote on vision became popular, and hundreds of organizations sent him their vision statements, many laminated into wallet cards. Reading them, he found they all said much the same thing.')+
   L.list([['Only the top’s vision counts','Lamination declares that top management’s vision is the one everyone else must live by. Usually a consultant wrote it anyway.'],
           ['It is meant to last forever','A laminated vision can’t change. But a vision should stay alive and open, worked out by each unit.']],3)+
   L.quote('Vision is more a dialogue than a declaration.','Peter Block, chapter 16')+
   L.prose('His conclusion: the <b>act of creating</b> a vision matters more than its content. If a group needs one, help them make their own.'));
  L.done();}},
{part:2,src:'Chapter 16 · Leadership by Lamination',pts:1,
 solve:async L=>{const c=L.$('#pp').children;for(let i=0;i<c.length;i++)c[i].click();},
 run(L){
  const P=[['layers','Laminate it','Kofi’s huddle goes onto a card, signed by Lena, sent to every shift and all 40 stores.','Crews tape it up and tick the boxes. Two months on it is a ritual nobody thinks about, and the damage numbers barely move.'],
    ['play','Film it','Lena records a video explaining why the huddle matters and how to run it.','People watch, nod and feel vaguely flat. It sounds like every other message from head office.'],
    ['people','Let crews make it','Each crew watches Kofi’s team, then designs its own start-of-shift check and changes it as it learns.','Day-shift volunteers argue, try things, drop what fails. Their check looks a bit different from Kofi’s, and they own it.']];
  const seen=new Set();
  L.h(L.kick('pr','Toggle and compare')+'<h1 class="q">Lena wants Kofi’s huddle everywhere. Try each way of spreading it and see where it leads.</h1><div id="pp"></div>'+
   '<div style="background:var(--soft);border-radius:16px;padding:14px;margin:8px 0 6px;min-height:110px"><div class="small" id="pw">Choose a way above.</div><div id="pr" style="margin-top:8px"></div></div><div id="pq"></div>');
  P.forEach((x,j)=>{const b=document.createElement('button');b.className='chip';b.innerHTML=L.ic(x[0])+x[1];
    b.onclick=()=>{[...L.$('#pp').children].forEach(y=>y.classList.remove('sel'));b.classList.add('sel');seen.add(j);
      L.$('#pw').innerHTML='<b>What happens:</b> '+x[2];L.$('#pr').innerHTML='<b>Where it leads:</b> '+x[3];
      if(seen.size===3&&!L.$('#pq').innerHTML){const q=L.$('#pq');q.innerHTML='<h2 class="sub">Why does the third way take hold when the others don’t?</h2>';
        L.mc(q,['Its checklist is better written than Lena’s card','The crews created it, so it stays alive and theirs'],1,
         'Block’s point exactly: the act of creating matters more than the content. A laminated card can’t grow; a crew’s own check can.',
         'The content may even be worse. What matters is who made it: the crews created it, so they own it and can keep changing it.');}};
    L.$('#pp').appendChild(b);});}},
{part:2,src:'Chapter 16 · We Need Higher Standards, and This Time We Mean Business',run(L){
  L.h(L.kick('learn','Trap 2 · “Higher standards, and this time we mean business”')+'<h1 class="q">Expectations show faith. Imposed standards show disappointment.</h1>'+
   L.lanes([['star','High expectations','A boss who expects a team to do well is expressing faith and hope in them. It feels like support, and it often comes true.',2],
            ['alert','Standard setting','Raising the bar to wake people up assumes they won’t set high standards themselves. It comes from disappointment and demand.',3]])+
   L.prose('Standard setting is meant to raise accountability. Mostly it creates compliance: more bureaucracy, more caution, people working to rule, less flexibility. And it builds as much resistance as it was meant to overcome.')+
   '<p class="small">Bosses still have a fair role in saying what outcomes each unit must deliver. The trap is using new standards as the tactic for starting a change.</p>');
  L.done();}},
{part:2,src:'Chapter 16 · People Need Fixing',run(L){
  L.h(L.kick('learn','Trap 3 · People need fixing')+'<h1 class="q">Don’t plan in a huddle with your client how to change everyone else</h1>'+
   L.prose('After contracting and discovery with a manager, it is tempting to take their side and adopt their usual way of making things happen. Block warns this is seductive for consultants.')+
   L.prose('If you plan with the boss how to change the people below them, you have accepted that the employees need to change and the managers are fine. That costs you your legitimacy.')+
   L.note('<b>Instead:</b> stay with the gifts and capacities of the people in the room and what they can do about their <i>own</i> actions. If managers believe in higher standards, let them set those for themselves and live by them for a while.','compass'));
  L.done();}},
{part:2,src:'Chapter 16 · People Need Fixing',run(L){
  L.h(L.kick('ex','Copperleaf')+'<h1 class="q">Marcus invites Jordan into a huddle</h1>');
  L.beats(L.card,[
   ['The offer','Marcus closes the door. “You and I know the packers are the problem. Let’s design their retraining and a zero-damage standard.”'],
   ['The pull','Jordan feels the tug. After weeks of work, it’s pleasant to be on the director’s side.'],
   ['The catch','The plan aims at people who aren’t in the room. It also skips what discovery found: rushed loading and schedules changed at short notice.'],
   ['Jordan’s move','“I’d rather not plan changes for the packers without them. What would you change in how <i>you</i> run the floor first?”'],
   ['Marcus','A long pause. “I could stop moving people between docks mid-shift. For a month, anyway.”']],
   'Change starts with what the people in the room can do about their own actions. Living it beats preaching it.');}},
{part:2,src:'Chapter 16 · If We Can’t Measure It, It Doesn’t Matter',run(L){
  L.h(L.kick('learn','Trap 4 · “If we can’t measure it, it doesn’t matter”')+'<h1 class="q">Measurement is useful. It isn’t a god.</h1>'+
   L.lanes([['check','Solid ground','Common accounting, product quality, customer service. Measures the whole business really needs and can use.',2],
            ['alert','Soft ground','Imposed measures of how people work together or the human side of work. Each one leaves more untested than it covers.',3]])+
   L.prose('Everyone wants feedback on how they’re doing. But feedback doesn’t <i>create</i> the doing. Believing it does treats people like machines.')+
   L.prose('Measures lose value when the people who judge are separate from the people who do the work. The quality movement learned this: keep measuring tools <b>under the control of those doing the work</b>.'));
  L.done();}},
{part:2,src:'Chapter 16 · If We Can’t Measure It, It Doesn’t Matter',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Marcus wants head office to rank every packer by damage rate and post the list each Monday. What fits the book?</h1>');
  L.mc(L.card,['Let the crews track and review their own damage numbers','Post the list, but leave the names off it','Rank the supervisors instead of the packers'],0,
   'Measures work best in the hands of the people doing the work. The pilot crews already track their own numbers.',
   'Hiding names or ranking supervisors still keeps judging apart from doing. Block’s lesson from the quality movement: put the measures in the hands of those doing the work.');}},
{part:2,src:'Chapter 16 · The Limits of Installation',pts:6,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Spot the trap',['Leadership by lamination','Higher standards','People need fixing','Measurement as a god'],[
   ['Lena asks Jordan to write the DC a vision statement for Marcus to sign.',0,'The top’s vision, written by a consultant, handed down.'],
   ['Renata: “Raise the bar. Zero damage, and this time we mean it.”',1,'Standard setting born of disappointment, not faith.'],
   ['Marcus and Jordan plan the supervisors’ behavior change over lunch.',2,'Planning, in a huddle with the client, a change for people outside it.'],
   ['Lena wants a “teamwork score” for every shift, filled in by head office.',3,'An imposed measure of the human side of work, judged by outsiders.'],
   ['The scheduling tool comes with a signed card: “Our scheduling vision”.',0,'A fixed, laminated vision from the top.'],
   ['“If the huddle can’t be scored weekly, it doesn’t count.”',3,'Treating what can’t be measured as if it doesn’t exist.']]);}},

/* ---------- PART 4: BETTING ON ENGAGEMENT ---------- */
{part:3,src:'Chapter 16 · Betting on Engagement',run(L){
  L.h(L.kick('learn','Betting on engagement')+'<h1 class="q">When pressure fails, the instinct is more pressure</h1>'+
   L.prose('None of this is against vision, standards or measurement. Block’s point is that we abuse them as instruments of control. Then, when they don’t create real change, we <b>try harder</b> instead of trying something else.')+
   L.flow([['target','Push','More rules, targets, persuasion','',3],['shield','Push back','The system builds its own immune response','',4],['cycle','Push harder','The bureaucracy we wanted less of grows','',3]])+
   L.prose('A social system is a living system. Engineering and economic tools don’t build commitment. What we undervalue is the power of <b>engagement and dialogue</b>, which the next lesson turns into practical steps.'));
  L.done();}},
{part:3,src:'Chapter 16 · Betting on Engagement',pts:1,run(L){
  L.h(L.kick('pr','What would you do?')+'<h1 class="q">Two weeks into the scheduling-tool trial, the day-shift team logs in but keeps paper rotas on the side. Renata wants daily usage targets. What should Jordan suggest?</h1>');
  L.mc(L.card,['Agree, and add a weekly usage report for Lena','Ask Lena to remind the team the tool is required','Gather the team to talk through what isn’t working'],2,
   'They’re going through the motions. More pressure would just grow the workaround. Bringing them together to shape how they use it is the bet on engagement.',
   'Targets and reminders are trying harder with the same tools, and Block says that builds its own immune response. The team needs to be engaged, not pushed.');}},
{part:3,src:'Chapter 16 · Choosing Engagement over Installation',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Tap each piece until the sentence says what Block says about implementation.</h1>');
  L.sentence(L.card,[['Implementation begins when','Implementation ends when'],['the director','the consultant','the people who do the work'],['decide to make real changes','approve the final plan']],[0,2,0],
   [['It doesn’t end there: that is the moment it actually starts.'],['The director’s decision doesn’t get it done.','The consultant is only a guest in the system.'],['Approving a plan is the decision that doesn’t get it done.']],
   'Implementation begins when the people who do the work decide to make real changes, rather than go through the motions.');}}
  ]
});
</script>
</body>
</html>
