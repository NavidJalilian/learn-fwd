<title>Understanding Resistance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<body>
<script src="../assets/course.js"></script>

<script>
Course.lesson({
  id:'0009', title:'Understanding resistance', minutes:19, icon:'shield',
  goals:['Explain why resistance is emotional, natural and a sign you are on target','Recognize the common faces of resistance and when to start suspecting one','See the control and vulnerability concerns under it, and tell real resistance from a plain “no”'],
  parts:['What it is','Its faces','What lies beneath','Fears and myths'],
  read:'Read chapter 8 of the book for all fourteen faces of resistance and the full fear-and-wish tables.',
  glossary:{
    'difficult-reality':'Difficult reality: the painful fact a client has trouble facing, like a weak performer, an unhappy team or their own management style.',
    'flight-into-health':'Flight into health: as the time to act gets close, the client suddenly says the problem is getting better by itself.',
    'approach-avoidance':'Approach–avoidance: wanting help and wanting to avoid it at the same time. Both feelings are real.',
    'hidden-bargain':'Hidden bargain: taking on a bad job now on the unspoken hope of being rewarded later.'
  },
  cheatsheet:[
    '<b>Resistance</b> is an emotional reaction to being helped and to facing a hard problem. It is natural, predictable and needed for learning.',
    'More logic, said louder, does not move it. Resistance usually means you are <b>on target</b>.',
    'It wears many faces: more detail, flooding, time, impracticality, “I’m not surprised”, attack, confusion, silence, theories, moralizing, compliance, methods, flight into health, pressing for solutions.',
    'Most faces have a legitimate version. Suspect resistance when you feel <b>impatient, bored or repeat yourself</b>, or when method questions run past ten minutes.',
    'Clients resist a <b>difficult reality</b>, not you. Underneath sit two concerns: <b>control</b> and <b>vulnerability</b>.',
    'Saying a concern directly is not resistance. A direct “no” is the client’s right, and the process was still flawless.',
    'Client fears (helplessness, alienation, confusion) mirror consultant fears. Help the client put them into words.',
    'There are no ogres and no angels. And drop the heroics: they lead to bad contracts and hidden bargains.'
  ],
  steps:[
/* ---------- PART 1: WHAT IT IS ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">You show a friend a clear, sensible plan to fix their messy finances. They keep finding reasons it won’t work. What usually helps more?</h1>');
  L.mc(L.card,['Repeat the plan with more facts, more firmly','Ask what about the plan worries them'],1,
   'Right. Their objections are probably about feelings, not facts. More facts rarely touch feelings. This lesson is about why.',
   'More facts, said more firmly, usually make people dig in. Their pushback is likely about how the plan makes them feel. Asking about the worry reaches it.');}},
{part:0,src:'Chapter 8 · Understanding Resistance',run(L){
  L.h(L.kick('learn','What resistance is')+'<h1 class="q">The hardest part of consulting isn’t the logic</h1>'+
   L.prose('We tend to believe that if we present ideas clearly and mean well, clients will follow them. Then clients push back anyway. We start to see them as stubborn and irrational, and we argue louder.')+
   L.prose('Block’s key point: '+L.g('resistance','resistance')+' is an <b>emotional</b> reaction going on inside the client. It is not about the logic of the conversation. Clients react against <b>being helped</b> and against <b>facing hard problems</b>.')+
   L.flow([['alert','Predictable','It will come, so plan for it'],['leaf','Natural','Nothing is broken'],['bulb','Needed','Clients learn after the feelings come out']]));
  L.done();}},
{part:0,src:'Chapter 8 · Understanding Resistance',run(L){
  L.h(L.kick('learn','The skill')+'<h1 class="q">Four things a consultant learns to do</h1>'+
   L.list([['eye','Spot it','Notice when resistance is happening, even when it hides.'],
     ['target','See it as a good sign','It is natural, and it tells you that you have touched something that matters.'],
     ['chat','Help it come out','Support the client in saying their concerns directly.'],
     ['shield','Don’t take it personally','It is not an attack on you or your competence.']],1)+
   L.note('Wishing resistance would go away is itself an obstacle. The client needs to voice those feelings before they can really use your help.','info'));
  L.done();}},
{part:0,src:'Chapter 8 · Understanding Resistance',run(L){
  L.h(L.kick('ex','At Copperleaf')+'<h1 class="q">Jordan meets the first wall</h1>');
  L.beats(L.card,[
   ['The meeting','Jordan brings Marcus the first summary of the complaint data for the damaged-deliveries project. It is clear and well made.'],
   ['The pushback','Marcus picks at it. Which months? Which carriers? Are returns counted twice? Jordan answers every question well.'],
   ['Jordan’s move','Jordan goes back to the desk and builds an even thicker pack of backup numbers for next time, sure that more proof will win Marcus over.'],
   ['What Block would see','The questions are probably not about the numbers. Marcus is reacting to having to face a hard problem on their own patch. Louder logic won’t reach that.']],
   'When a client keeps pushing back on solid work, look for the feeling behind it. Another layer of data is the usual mistake.');}},
{part:0,src:'Chapter 8 · Understanding Resistance',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Marcus pushes back hard on Jordan’s complaint summary. How should Jordan read that, in Block’s view?</h1>');
  L.mc(L.card,['As proof the summary is not good enough yet','As a sign Jordan has touched something real'],1,
   'Yes. Resistance is natural, and it often means you are on target.',
   'The summary may be fine. Block treats resistance as an emotional reaction to facing a hard problem, and a sign you are on target.');}},

/* ---------- PART 2: ITS FACES ---------- */
{part:1,src:'Chapter 8 · The Faces of Resistance',run(L){
  L.h(L.kick('learn','The faces of resistance')+'<h1 class="q">Resistance rarely says its own name</h1>'+
   L.prose('Block lists fourteen common forms. Many look reasonable on the surface, and some have a real version too. The trick is the <b>tell</b>: the moment it stops being a fair request.')+
   L.list([['Give me more detail','Endless requests for finer data. Suspect it when you grow impatient, even though you can answer.'],
     ['Flooding you with detail','A long history you understand less and less. Suspect it when you get bored or lost.'],
     ['Time','“Love to, but not now.” Constant interruptions. Wanting it, yet unable to start for many months.'],
     ['Impracticality','“This is the real world.” Suspect it when the stress on being practical is intense.'],
     ['Confusion','Fair at first. Suspect it after you have explained clearly two or three times: it may be a hard-to-say “no”.']],2));
  L.done();}},
{part:1,src:'Chapter 8 · The Faces of Resistance',run(L){
  L.h(L.kick('learn','More faces')+'<h1 class="q">Tap each card to see how it shows up</h1>');
  L.flips(L.card,[
   ['“I’m not surprised”','Whatever you find, the client already knew. Really a wish to stay in control. It can deflate you; don’t take it as a verdict on your work.'],
   ['Attack','Anger, a red face, a pointing finger. We tend to withdraw or hit back, which means we took it personally.'],
   ['Silence','“Keep going, I’ll speak up if I disagree.” Few signs of life. The reaction is being held back.'],
   ['Intellectualizing','Theory after theory about why things are as they are, often at a tense moment. Bring the talk back to action.'],
   ['Moralizing','“Those people”, “they should”, “they need to understand”. Often they do understand; they just disagree.'],
   ['Compliance','Total agreement with low energy and no reservations. Hard to see, because it feels like what you wanted.'],
   ['Methodology','Questions about your methods. Fair for about ten minutes; after that, suspect a delay.'],
   ['Flight into health','Just before action, the problem seems to be getting better by itself.'],
   ['Pressing for solutions','“Don’t give me problems, give me solutions.” Tempting, because you want solutions too.']],
   'Every face has the same thing behind it: a concern the client is not saying directly.');}},
{part:1,src:'Chapter 8 · Silence',run(L){
  L.h(L.kick('learn','The toughest face')+'<h1 class="q">Why a quiet meeting is not a good meeting</h1>'+
   L.quote('Silence never means consent.','Peter Block, chapter 8')+
   L.prose('If the work matters to the organization, it is not natural for a client to have no reaction. Silence means the reaction is blocked. For some people it is even a way of fighting.')+
   L.note('After a “smooth” meeting, ask yourself: did the client show real support, real enthusiasm, or get personally involved? If there were few signs of life, the smoothness may have been the resistance.','eye'));
  L.done();}},
{part:1,src:'Chapter 8 · Time',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">In December, Marcus says the pilot is “a great idea, truly” but can’t start until the third quarter of next year. Which face is this most likely?</h1>');
  L.mc(L.card,['Flight into health','Time','Compliance'],1,
   'Yes. Wanting the project yet pushing the start many months out is Block’s classic sign of the time face.',
   'Marcus hasn’t said the problem is fading (flight into health), and isn’t simply agreeing to everything (compliance). Wanting it but not now is the time face.');}},
{part:1,src:'Chapter 8 · The Faces of Resistance',pts:6,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Name the face',['Moralizing','Intellectualizing','Flight into health','Compliance','Pressing for solutions','I’m not surprised'],[
   ['Marcus: “My packers need to understand that a sofa isn’t a sack of potatoes. Those people just don’t care.”',0,'“Those people” and “need to understand” are the tells. They put Marcus on a pedestal above the floor.'],
   ['Just as they reach a decision, Marcus muses: “I wonder if it’s generational. Or maybe it’s the new carriers’ culture.”',1,'Spinning theories at a tense moment takes the pain out. Jordan’s job is to steer back to action.'],
   ['A week before the pilot: “Complaints dipped this month. Maybe it’s sorting itself out.”',2,'One good month, right before having to act. Nothing has changed in how the DC works.'],
   ['A day-shift supervisor, flatly: “Sure. Whatever you think. What do I do first?”',3,'No reservations at all and low energy. Real agreement usually has some energy and some doubts in it.'],
   ['Marcus: “Skip the problem talk. Just tell me what to change by Friday.”',4,'Rushing to answers keeps Marcus from learning what drives the problem, and keeps them dependent on Jordan.'],
   ['Jordan shows complaints have doubled. Marcus shrugs: “Doesn’t surprise me one bit.”',5,'Not being surprised protects the feeling of being in control. It also quietly shrinks Jordan’s work.']]);}},
{part:1,src:'Chapter 8 · Methodology',pts:1,
 solve:async L=>{L.$('#nx').click();L.$('#nx').click();L.$('#nx').click();L.$('#st').click();},
 run(L){
  const Q=[[2,'“How many packers filled in the survey?”'],[5,'“Why split day shift and night shift?”'],[8,'“Who wrote the survey questions?”'],[12,'“Is this even statistically significant? Shouldn’t we hire a firm?”'],[16,'“What if the packers who answered all have a grudge?”']];
  let lv=0,first=true;
  L.h(L.kick('pr','Watch the clock')+'<h1 class="q">Jordan shares a short packer survey. Marcus starts asking about the method. Play the meeting and press the button at the first question Jordan should start to treat as resistance.</h1>'+
   '<div style="display:flex;align-items:center;justify-content:space-between;margin:6px 0"><div><div class="small">Meeting clock</div><div class="week" id="wk">Minute 2</div></div></div>'+
   '<div class="ladder" id="ld"></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn" id="nx">Next question '+L.ic('down')+'</button><button class="btn pri" id="st">'+L.ic('alert')+'Suspect resistance now</button></div><div id="lf"></div>');
  const draw=()=>{L.$('#ld').innerHTML=Q.slice(0,lv+1).map((x,j)=>(j?'<div class="conn"></div>':'')+'<div class="rung'+(j===lv?' cur':'')+'"><small>minute '+x[0]+'</small>'+x[1]+'</div>').join('');L.$('#wk').textContent='Minute '+Q[lv][0];L.$('#nx').hidden=lv>=Q.length-1;};draw();
  L.$('#nx').onclick=()=>{lv=Math.min(lv+1,Q.length-1);L.$('#lf').innerHTML='';draw();};
  L.$('#st').onclick=()=>{L.$('#lf').innerHTML='';
    if(lv===3){if(first)L.award(true);L.sheet('ok','Right on the mark','Block gives method questions about ten minutes. That’s enough time to show the work is credible. Past that, repeated method questions start to delay the real talk about the problem.');L.done();}
    else if(lv<3){if(first)L.award(false);first=false;L.fb(L.$('#lf'),'<b>Too early.</b> In the first ten minutes, method questions are a fair need for information. Let the meeting run on.','no');}
    else{if(first)L.award(false);first=false;L.sheet('info','A little late','The question at minute 12 was already past Block’s ten-minute mark. From there, method questions are more likely delay than a need for information.');L.done();}};}},
{part:1,src:'Chapter 8 · Compliance',pts:4,run(L){
  L.h(L.kick('pr','Fair request or resistance?')+'<h1 class="q">Sort each moment. Look for the tell, not the topic.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Likely fair','Likely resistance'],[
   ['Marcus asks two questions about how the survey was run, early in the meeting.',0,'The first ten minutes of method questions are a fair need to trust the work.'],
   ['After Jordan explains the pilot clearly three times, Marcus still says they don’t follow.',1,'Confusion after repeated clear explanations may be a “no” that is hard to say.'],
   ['Marcus agrees warmly, asks sharp questions and names two worries about the pilot.',0,'Energy, understanding and some reservations: this is real agreement.'],
   ['Marcus nods through every slide, raises nothing, and says, “Fine, just do it.”',1,'Low-energy agreement with no reservations is the compliance face.']],
   'The same behavior can be fair or resistant. Watch for the tells: your own impatience, repetition, low energy, and the time on the clock.');}},

/* ---------- PART 3: WHAT LIES BENEATH ---------- */
{part:2,src:'Chapter 8 · What Are Clients Resisting When They Are Resisting Us?',run(L){
  L.h(L.kick('learn','It isn’t about you')+'<h1 class="q">Clients resist a hard reality, not the consultant</h1>'+
   L.prose('You are the one in the room, so it feels aimed at you. It isn’t. The client is defending against a '+L.g('difficult-reality','difficult reality')+': a hard choice, an unpopular action, a fact they have been avoiding.')+
   L.list([['person','Someone isn’t performing','and may need to be told, or let go.'],
     ['people','The team is unhappy','and the manager would rather not bring it to the surface.'],
     ['trend','The boss is part of the problem','and confronting the boss feels too risky.'],
     ['scale','The manager’s own style is hurting','and they don’t want to change it.']],3)+
   L.prose('Underneath, managers are defending their own <b>competence</b>. That is natural, even worth defending.'));
  L.done();}},
{part:2,src:'Chapter 8 · What Are Clients Resisting When They Are Resisting Us?',run(L){
  L.h(L.kick('learn','Two things at once')+'<h1 class="q">Discomfort, said sideways</h1>'+
   L.flow([['flame','Discomfort','The client feels uneasy about a hard reality'],['arrow','Said indirectly','“Not enough data”, “no time”, “those people”…','this is the resistance']])+
   L.prose('Imagine Marcus saying plainly, “I’m worried I’m losing control of the floor.” Jordan wouldn’t feel attacked. Jordan would feel like helping.')+
   L.note('A direct statement of a concern is <b>not</b> resistance. Resistance is only the <i>indirect</i> expression of it.','chat'));
  L.done();}},
{part:2,src:'Chapter 8 · Underlying Concerns',run(L){
  L.h(L.kick('learn','Underlying concerns')+'<h1 class="q">Block’s bet: it’s about control or vulnerability</h1>'+
   L.lanes([['lock','Control','Control is the currency of organizations. Do well and you get more of it, not much more money. Many managers keep control even when it costs performance.',1],
            ['shield','Vulnerability','Organizations are competitive and political. Managers must stay ahead of peers, in favor with the boss and loyal to their team. Your project may upset that balance.',3]])+
   L.prose('If your proposal triggers no resistance at all, Block suggests it probably doesn’t threaten the manager’s control or security.'));
  L.done();}},
{part:2,src:'Chapter 8 · Vulnerability',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">The research group that “didn’t mind”</h1>');
  L.beats(L.card,[
   ['The job','Block’s team is asked to help restructure a research and development department. The VP senses overlap and waste.'],
   ['The resistance','Most of it comes from the exploratory research group. They arrive late, question the methods, fall silent, then say “whatever you think is fine”.'],
   ['The surface','It looks like a fight about technique and structure.'],
   ['Underneath','They hold high status, independence and a free hand with resources. They fear losing that place in the political system.'],
   ['The turn','Their worry had some merit. Once they said it directly, a compromise with the VP and the product groups became possible.']],
   'Several faces at once, one concern underneath: vulnerability. Said directly, it could be worked with.');}},
{part:2,src:'Chapter 8 · Underlying Concerns',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Jordan suggests packers see the complaint data each week. Marcus says: “I decide what goes on the floor.” Which concern is most likely underneath?</h1>');
  L.mc(L.card,['Losing control','Doubt about the data','Too little time'],0,
   'Right. Who decides what the floor sees is about control. Block’s first guess when resistance appears.',
   'Marcus didn’t question the numbers or the calendar. “I decide” is about control, Block’s first guess when resistance appears.');}},
{part:2,src:'Chapter 8 · Sometimes It Is Not Resistance',run(L){
  L.h(L.kick('learn','Sometimes it is not resistance')+'<h1 class="q">A plain “no” is the client’s right</h1>'+
   L.prose('Don’t read every objection as hidden anxiety. If a manager says straight out, “I don’t believe in this and won’t start it,” nothing is being blamed on you. They are taking responsibility for their own unit.')+
   L.lanes([['x','Resistance','Concern said sideways, with blame pushed onto the consultant or the method.',4],
            ['check','Not resistance','A direct choice, owned by the client, even if you think it is the wrong one.',2]])+
   L.prose('You are paid to consult, not to manage. If the project dies after an honest “no”, you may be disappointed, but the process was flawless.'));
  L.done();}},
{part:2,src:'Chapter 8 · Sometimes It Is Not Resistance',pts:5,run(L){
  L.h(L.kick('pr','Which is which?')+'<h1 class="q">Sort what each person tells Jordan.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Resistance','Not resistance'],[
   ['Marcus: “Honestly, I’m in too exposed a spot with Lena to start this now.”',1,'A vulnerable feeling, said directly. Jordan knows exactly where they stand.'],
   ['Marcus: “Your survey sample is too small to mean anything,” for the fourth time.',0,'Blaming the method, again and again, points away from Marcus’s own concern.'],
   ['A store manager: “I don’t want the pilot here. I think it’s the wrong fix.”',1,'A clear, owned choice. It is their right, even if Jordan disagrees.'],
   ['Marcus: “Fine with me, I’ll speak up if I see a problem,” then no reaction all meeting.',0,'Silence and low-energy agreement: the reaction is being held back.'],
   ['Marcus: “I worry this makes my supervisors look bad in front of Lena.”',1,'A concern said directly is not resistance. Now Jordan can work with it.']],
   'The test is not the content. It is whether the concern is said directly and owned, or pushed sideways onto the consultant.');}},
{part:2,src:'Chapter 8 · What Are Clients Resisting When They Are Resisting Us?',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Tap each piece until it describes what is happening when Marcus picks at Jordan’s work.</h1>');
  L.sentence(L.card,[['Marcus is defending against','Marcus is attacking'],['Jordan’s competence','a difficult reality'],['out of worry about','because of doubts about'],['the survey method','losing control or looking exposed'],['and saying it indirectly.','and saying it directly.']],[0,1,0,1,0],
   [['It feels like an attack, but Block says the target is not the consultant.'],['The resistance is not aimed at Jordan’s skills.'],['The method is what Marcus talks about, not what Marcus worries about.'],['The method is the surface. Underneath sit control and vulnerability.'],['Said directly, it would not be resistance at all.']],
   'That is Block’s picture: discomfort with a hard reality, rooted in control or vulnerability, expressed indirectly.');}},

/* ---------- PART 4: FEARS AND MYTHS ---------- */
{part:3,src:'Chapter 8 · The Fear and the Wish',pts:1,
 solve:async L=>{L.$('#tf').click();L.$('#tw').click();},
 run(L){
  const F=[['Helplessness','“Nothing I do changes anything.”','“I’ll have no impact.”'],['Alienation','“I don’t belong here.”','“We’ll stay strangers.”'],['Confusion','“Too much information. I can’t see clearly.”','“Too little information. They won’t tell me.”']],
        W=[['Choice','Has the power to act. An actor, not a victim.','High impact, clear payoff.'],['Engagement','Moves toward the hard reality.','Can be authentic, no role-playing.'],['Clarity','Choices are clear; the mass of data is simple.','Has the full picture.']];
  const seen=new Set();
  L.h(L.kick('ex','Toggle and compare')+'<h1 class="q">Client and consultant feel mirror images. Flip between the fear and the wish.</h1>'+
   '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="chip" id="tf">'+L.ic('alert')+'The fear</button><button class="chip" id="tw">'+L.ic('star')+'The wish</button></div><div id="tb" style="margin-top:10px"><p class="small">Choose one above.</p></div><div id="tq"></div>');
  const show=(k)=>{seen.add(k);L.$('#tf').classList.toggle('sel',k===0);L.$('#tw').classList.toggle('sel',k===1);
    L.$('#tb').innerHTML=(k?W:F).map(r=>'<div style="background:var(--soft);border-radius:14px;padding:10px 12px;margin:6px 0"><b>'+r[0]+'</b><div class="small" style="margin-top:4px">Client (Marcus): '+r[1]+'</div><div class="small">Consultant (Jordan): '+r[2]+'</div></div>').join('');
    if(seen.size===2&&!L.$('#tq').innerHTML){const q=L.$('#tq');q.innerHTML='<h2 class="sub">What helps Marcus move from the fear to the wish?</h2>';
      L.mc(q,['Reassure Marcus it will all work out','Give Marcus a cleaner pack of data','Help Marcus put the fear into words'],2,
       'Yes. Said indirectly, these fears become resistance. The way out is to help the client say them directly.',
       'Reassurance and more data skip the feeling. Block’s way out is to help the client express the fear directly, in words.');}};
  L.$('#tf').onclick=()=>show(0);L.$('#tw').onclick=()=>show(1);}},
{part:3,src:'Chapter 8 · Being Dependent, Asking for Help',run(L){
  L.h(L.kick('learn','Why being a client is hard')+'<h1 class="q">Mixed feelings are built into asking for help</h1>'+
   L.list([['person','Asking feels weak','Competitive workplaces, and our culture, say solve it yourself. Being a client goes against that.'],
     ['cycle','Feeling beyond help','After failed tries, a manager may quietly believe it can’t be fixed. Bring that feeling into the open; hope usually rises.'],
     ['scale','Confirmation, not change','We want a solution and to hear we did everything right. This '+L.g('approach-avoidance','approach–avoidance')+' is not rational, and doesn’t need to be.'],
     ['lock','The known pain','Today’s problem is at least predictable. Your fix leads into the unknown.']],2)+
   '<p class="small" style="margin-top:10px">Organizations in serious trouble are often the hardest clients: they need change most and can least afford one more risk.</p>');
  L.done();}},
{part:3,src:'Chapter 8 · Being Dependent, Asking for Help',pts:1,run(L){
  L.h(L.kick('pr','What’s really going on?')+'<h1 class="q">Marcus sighs: “We’ve tried posters, fines, retraining. Packers are packers. It’s just the cost of the business.” What should Jordan do first?</h1>');
  L.mc(L.card,['Show a new plan that beats all the old ones','Gently raise that Marcus sounds like it can’t be fixed','Agree that some damage is just part of retail'],1,
   'Right. Feeling beyond help blocks any technical fix. Bringing it into awareness is the first task, and hope usually rises.',
   'A shiny plan won’t land while Marcus has no energy to try it, and agreeing feeds the futility. Block says to bring the feeling of being beyond help into the open first.');}},
{part:3,src:'Chapter 8 · Ogres and Angels',run(L){
  L.h(L.kick('learn','Ogres, angels and heroics')+'<h1 class="q">Three myths that cloud a consultant’s view</h1>'+
   L.tiers([['flame','Ogres don’t exist','Every support team names a feared manager. Up close, the “ogre” worries about the ogres in their own life: losing control, getting hurt. The fiercer they seem, the more support they need.'],
            ['star','Angels don’t exist','The manager who says yes to everything also has doubts and dodges hard issues. They just find “no” hard to say. Help that side come out.'],
            ['shield','Heroics don’t pay','Wanting to beat every obstacle leads to bad contracts, often with a '+L.g('hidden-bargain','hidden bargain')+'. Resist shaky contracts: if a flat no is too hard, offer “later”, and failing that, promise little.','',true,'Your own resistance']]));
  L.done();}},
{part:3,src:'Chapter 8 · Ogres and Angels',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which myth is at work?',['Ogre','Angel','Heroics'],[
   ['Jordan’s teammates warn: “Marcus eats consultants for breakfast. Good luck.”',0,'Behind the bluster, Marcus has the same worries as any manager: control and exposure.'],
   ['A store manager has said yes to every Business Improvement idea for years, with no questions.',1,'No one has zero doubts. That manager’s reservations just never get said.'],
   ['Jordan takes on Eastgate on top of everything, thinking: “Renata will remember this at review time.”',2,'An unspoken trade of a bad job now for rewards later is a hidden bargain.'],
   ['Jordan agrees to an impossible deadline because a “real consultant” should manage anything.',2,'The heroic self-image is the consultant’s own resistance to facing a hard project.']]);}},
