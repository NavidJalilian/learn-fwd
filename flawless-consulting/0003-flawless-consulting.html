<!doctype html>
<html lang="en">

<meta charset="utf-8">

<title>Flawless Consulting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">

</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0003', title:'Flawless consulting', minutes:19, icon:'check',
  goals:['Ask the two questions that keep any consultation flawless','Say out loud what you are experiencing with a client, plainly and without tricks','Tell what you are accountable for from what belongs to the client'],
  parts:['Two questions','Being authentic','Each phase’s business','Results and failure'],
  read:'Read chapter 3 of the book for all four audit dialogues and the full list of each phase’s requirements.',
  glossary:{
    'task-requirements':'Task requirements: the business each consulting phase must finish before you move on, like negotiating wants in contracting.',
    'unfinished-business':'Unfinished business: a phase requirement you skipped. It comes back later, usually in an indirect, disguised form.',
    'right-to-fail':'Right to fail: a manager’s right to decide not to act on a problem, even when the consultant thinks they should.'
  },
  cheatsheet:[
    '<b>Flawless consulting</b> = two questions only: Am I being authentic right now? Am I finishing the business of this phase?',
    '<b>Authentic</b> = put into plain words what you are experiencing with the client. No clever selling.',
    'Clever or manipulative moves lower <b>trust</b>, and lower trust means lower leverage and lower commitment.',
    'A good authentic statement names what the client is doing, how you experience it, and what you want.',
    'Each phase has <b>task requirements</b>. Skip one and it comes back later, usually indirectly.',
    'Bend over at the start and the client will expect you to stay bent over.',
    'You are <b>not</b> responsible for what the client does with your work. You <b>are</b> accountable for how you work with them.',
    'Managers have a <b>right to fail</b>. Don’t make rescuing their unit your personal goal.'
  ],
  steps:[
/* ---------- PART 1: TWO QUESTIONS ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Jordan is pitching help to Marcus and can tell Marcus is only half listening. Which move is more likely to build Marcus’s trust?</h1>');
  L.mc(L.card,['Add more slides and savings figures to win them over','Say plainly that Marcus seems distracted, and ask why'],1,
   'Naming what is happening in the room is simple and honest. This lesson shows why it beats trying to be clever.',
   'More selling usually feels like pressure. Managers notice when they are being worked on, and they trust you a little less. Naming what you see is simpler and builds trust.');}},
{part:0,src:'Chapter 3 · Flawless Consulting',run(L){
  L.h(L.kick('learn','The whole idea in one screen')+'<h1 class="q">Consulting can be done without error, and simply</h1>'+
   L.prose('Consulting can feel vague and complicated. Block’s claim is that you can keep it simple by watching only <b>two things</b>. Whenever you are with a client, ask yourself:')+
   L.flow([['chat','Question 1','Am I being '+L.g('authentic','authentic')+' with this person now?','how you behave'],['check','Question 2','Am I completing the business of the phase I am in?','what the work needs']],false)+
   L.prose('That is all '+L.g('flawless','flawless consulting')+' means. Not “the client did what I recommended.” Not “the project was a success.” Two questions you can always answer about yourself.'));
  L.done();}},
{part:0,src:'Chapter 3 · Flawless Consulting',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Jordan writes the two questions on a sticky note before meeting Marcus. Which one does <i>not</i> belong?</h1>');
  L.mc(L.card,['Am I being authentic with Marcus right now?','Am I getting Marcus to accept my plan?','Am I finishing the business of this phase?'],1,
   'Getting the client to accept your plan isn’t one of the two questions. You can’t control that. You can control how authentic you are and whether you finish each phase.',
   'That one is on the note. The odd one out is “getting Marcus to accept my plan”, which depends on Marcus, not on Jordan.');}},

/* ---------- PART 2: BEING AUTHENTIC ---------- */
{part:1,src:'Chapter 3 · Being Authentic',run(L){
  L.h(L.kick('learn','Why clever doesn’t work')+'<h1 class="q">The client’s real question is “Can I trust this person?”</h1>'+
   L.prose('Consultants often agonize over how to pitch: projected savings, quick fixes for people problems, a reassuring nod that the client has done everything right. Block admits he has done it himself.')+
   L.prose('But clients rarely decide on purely rational grounds. Underneath, they are asking: <i>Will this person hurt me or con me? Can they help and still respect my position?</i> When you lay it on thick, they notice.')+
   L.flow([['alert','Clever or pushy','The client feels maneuvered','',3],['down','Lower trust','','',4],['down','Less leverage','and less commitment','',4]])+
   L.note('Turn it around: <b>authentic behavior</b> raises trust, which raises leverage (your influence) and the client’s commitment.','bulb'));
  L.done();}},
{part:1,src:'Chapter 3 · Being Authentic',run(L){
  L.h(L.kick('learn','What “authentic” means')+'<h1 class="q">Put into words what you are experiencing, as it happens</h1>'+
   L.quote('Am I being authentic with this person now?','Peter Block, chapter 3')+
   L.prose('Being authentic is not about being nice or tough. It is literally saying what you notice and feel in the meeting, about the meeting. That makes it very simple: you don’t need a script.')+
   L.list([['eye','Notice','What is the client doing right now? (Rushing you, keeping you out, burying you in detail.)'],
     ['person','Name your experience','How does it land on you? (Small, shut out, bored, like a police officer.)'],
     ['chat','Say it, and say what you want','Put it in plain words, and ask for what would help.']],2));
  L.done();}},
{part:1,src:'Chapter 3 · Being Authentic',run(L){
  L.h(L.kick('ex','Four moments from the book')+'<h1 class="q">Block gives four audit situations. Tap each to see the authentic reply.</h1>');
  L.flips(L.card,[
   ['“It won’t take long, don’t bother my people”','The consultant feels small, an interruption. Not authentic: lecture about how important audits are. Authentic: “You’re treating this as trivial. If it’s an interruption, maybe we should change the timing. I’d like you to take it more seriously.”'],
   ['“Tell me who is incompetent, with names”','The consultant feels like a police officer. Not authentic: describe what the report will cover. Authentic: “I feel cast as a judge. I’d rather be a mirror, so you and your people can decide what to do.”'],
   ['A thirty-year history lesson','The consultant feels bored and drained. Not authentic: sit silently and hope it ends. Authentic: “That’s a lot of detail and I’m losing the thread. What is the key problem now?”'],
   ['“Just send the report, we’ll decide later”','The consultant feels shut out of the real action. Not authentic: hint that the report may miss things. Authentic: “You’re excluding me from deciding what to do. I’d like to be in that meeting.”']],
   'In every case the client is keeping the consultant at a distance. The authentic reply talks about the relationship itself, not the procedure.');}},
{part:1,src:'Chapter 3 · Being Authentic',run(L){
  L.h(L.kick('learn','Why the authentic reply works')+'<h1 class="q">Each client line is a quiet push away</h1>'+
   L.prose('In all four moments the client is keeping the consultant distant. Block calls this a subtle form of '+L.g('resistance','resistance')+' to being helped.')+
   L.lanes([['x','Not authentic','Answers indirectly and impersonally. Treats the issue as a procedure. Lets the client stay distant.',4],
            ['check','Authentic','Talks about what is happening between the two of you. Makes the client take your role and wants seriously.',2]])+
   L.prose('Short, direct statements about the relationship put it back in <b>balance</b>. Total client control and total consultant control both lower commitment.'));
  L.done();}},
{part:1,src:'Chapter 3 · Being Authentic',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Marcus says: “Run the training next month. Don’t pull my supervisors off the floor, they’re busy.” Jordan feels like a side errand. Which reply is authentic?</h1>');
  L.mc(L.card,['“Training like this is company policy and HR tracks it.”','“Sure, I’ll keep it light and stay out of the way.”','“I feel like a side task here. I’d like your supervisors involved.”'],2,
   'Jordan names how the request lands on them and says what they want. Plain, direct, about the relationship.',
   'That reply dodges the relationship. Leaning on policy is impersonal, and agreeing to stay out of the way just lets Marcus keep Jordan distant. The authentic one names Jordan’s experience and want.');}},
{part:1,src:'Chapter 3 · Being Authentic',pts:1,
 solve:async L=>{const c=L.$('#rs').children;c[0].click();c[1].click();},
 run(L){
  const R=[
   ['Indirect reply','“My report will cover how the DC is managed. Any action on people will be up to you.”',[70,45,40],'Lena nods and plans to read the names between the lines. Nothing about the request has been discussed.'],
   ['Authentic reply','“I feel like I’m being asked to police your supervisors. I’d rather hold up a mirror, so Marcus and the team can decide what to change.”',[85,75,75],'Lena is surprised, then asks what “a mirror” would look like. The real question is now on the table.']];
  const seen=new Set();
  L.h(L.kick('pr','Toggle and compare')+'<h1 class="q">Lena Park, the VP, privately asks Jordan for a list of “weak” DC supervisors, with names. Try both replies and watch what happens.</h1><div id="rs"></div>'+
   '<div style="background:var(--soft);border-radius:16px;padding:14px;margin:8px 0 6px"><div class="small" id="rq" style="margin-bottom:8px">Choose a reply above.</div>'+
   ['Trust','Leverage','Commitment'].map((n,j)=>'<div class="meterrow"><div class="lb">'+n+'</div><div class="meter"><div id="rm'+j+'" style="width:0%;background:var(--h2)"></div></div></div>').join('')+
   '<div class="small" id="ro" style="margin-top:8px"></div></div><div id="rh"></div>');
  R.forEach((r,j)=>{const b=document.createElement('button');b.className='chip';b.innerHTML=L.ic(j?'chat':'list')+r[0];
    b.onclick=()=>{[...L.$('#rs').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(j);
      L.$('#rq').innerHTML='<i>'+r[1]+'</i>';r[2].forEach((v,k)=>{const m=L.$('#rm'+k);m.style.width=(j?v:v-35)+'%';m.style.background=j?'var(--ok-strong)':'var(--h3)';});
      L.$('#ro').textContent=r[3];
      if(seen.size===2&&!L.$('#rh').innerHTML){const q=L.$('#rh');q.innerHTML='<h2 class="sub">What made the second reply work?</h2>';
        L.mc(q,['It named how the request felt and what Jordan wanted instead','It quoted the rules on employee privacy and confidentiality'],0,
         'Jordan put their own experience into words (“police”) and offered a different role. That is what Block means by authentic, and it mirrors one of his audit examples.',
         'Rules are a procedural answer. The second reply worked because Jordan said what they were experiencing and what they wanted instead.');}};
    L.$('#rs').appendChild(b);});}},
{part:1,src:'Chapter 3 · Being Authentic',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Authentic or not?',['Authentic','Not authentic'],[
   ['Marcus keeps checking their phone. Jordan says: “You seem pulled in other directions. Is now a bad time?”',0,'Jordan names what is happening right now, plainly.'],
   ['Marcus starts a long story about the DC’s history. Jordan stays silent for twenty minutes, hoping it ends.',1,'Silence hides Jordan’s boredom. Saying “I’m losing the thread, what is the key problem now?” would be authentic.'],
   ['Marcus asks for “just the report”. Jordan replies: “There may be details the report can’t capture.”',1,'That hints instead of saying it. Authentic: “You’re leaving me out of the decision. I’d like to be in that meeting.”'],
   ['Jordan feels pushed. They say: “I feel rushed into this. Can we slow down and check you really want it?”',0,'Jordan says what they feel and what they want. Simple and direct.'],
   ['Jordan promises Marcus that the training will cut complaints by half within a month.',1,'That is laying it on thick to win the project. Marcus will sense it, and trust drops.']]);}},
{part:1,src:'Chapter 3 · Being Authentic',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Marcus has spent the meeting explaining why the DC was set up the way it was in 2009. Tap each piece until Jordan’s reply is authentic.</h1>');
  L.sentence(L.card,[['“The history is fascinating,','“You’re giving me a lot of detail,','“History matters to any study,'],['and I’m losing the thread.','and I’ll take notes on all of it.','and my method needs all of it.'],['Let’s keep going.”','I’ll write it up later.”','What’s the key problem now?”']],[1,0,2],
   [['Flattery hides what Jordan is really feeling.','A general claim about studies is impersonal. Name what Marcus is doing now.'],['Taking notes quietly hides Jordan’s boredom.','Blaming the method is procedural, not about the two of them.'],['That keeps the meeting stuck in the past.','Postponing doesn’t say what Jordan wants now.']],
   'It names what Marcus is doing, how Jordan experiences it, and what Jordan wants. That is the shape of an authentic statement.');}},

/* ---------- PART 3: EACH PHASE'S BUSINESS ---------- */
{part:2,src:'Chapter 3 · Completing the Requirements of Each Phase',run(L){
  L.h(L.kick('learn','The second question')+'<h1 class="q">Every phase has business that must be finished</h1>'+
   L.prose('The '+L.g('phases','five phases')+' run from <b>Entry and contracting</b> through <b>Discovery and dialogue</b>, <b>Analysis and the decision to act</b>, <b>Engagement and implementation</b>, to <b>Extension, recycle or termination</b>. Each has '+L.g('task-requirements','task requirements')+' you finish before moving on. Contracting has four:')+
   L.list([['Negotiate wants','Both sides say what they want and what they offer. Consultants tend to understate their wants; clients understate their offers.'],
     ['Cope with mixed motivation','Clients always ask for help with some ambivalence: one hand beckons, the other says stop. Get it said early.'],
     ['Surface concerns about exposure and control','Questions about cost or credentials often hide two fears: Will I look foolish? Will I lose control?'],
     ['Know how many clients you have','If the client’s boss or your own boss shaped the project, bring them into the contract (a triangle, or a rectangle).']],1));
  L.done();}},
{part:2,src:'Chapter 3 · Completing the Requirements of Each Phase',run(L){
  L.h(L.kick('learn','The other phases, in brief')+'<h1 class="q">A taste of what later lessons cover in depth</h1>'+
   L.tiers([['eye','Discovery','Name the layers under the first problem statement. Understand the politics. Notice when people hold back information. Treat interviews as joint learning, not neutral fact-finding.'],
     ['target','Feedback and the decision to act','Narrow the data to a few items the client controls. Include data on management style and politics. Run the meeting toward a decision. Notice how the client handles the feedback itself. Don’t take reactions personally.'],
     ['people','Engagement and implementation','Bet on engagement over mandate. More participation than presentation. Air doubts early and in public. Offer real choice. Change the conversation. Pay attention to the room.']])+
   '<p class="small" style="margin-top:10px">The book uses slightly different names for the middle phases in this chapter. This course uses the standard names from chapter 1.</p>');
  L.done();}},
{part:2,src:'Chapter 3 · Completing the Requirements of Each Phase',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Jordan agreed to the deliveries project without ever asking Marcus, point-blank, how much they want to go ahead. Which contracting task did Jordan skip?</h1>');
  L.mc(L.card,['Knowing how many clients there are','Surfacing worries about exposure','Coping with mixed motivation'],2,
   'Asking directly about the client’s wish to proceed is how you bring mixed motivation into the open. Find out late and it may be too late to fix.',
   'That task matters too, but the gap here is about Marcus’s willingness to go ahead. That’s mixed motivation.');}},
{part:2,src:'Chapter 3 · Completing the Requirements of Each Phase',pts:6,run(L){
  L.h(L.kick('pr','Which phase’s business?')+'<h1 class="q">Sort each piece of Jordan’s work into the phase it belongs to.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Contracting','Discovery','Feedback','Engagement'],[
   ['Ask Marcus what they want from Jordan, and say what Jordan wants back',0,'Exchanging wants and offers is the first job of contracting.'],
   ['Notice that supervisors give short, guarded answers in interviews',1,'Resistance to sharing information shows up during data collection.'],
   ['Cut thirty findings down to four that Marcus can act on',2,'Funneling the data to what the client controls is feedback work.'],
   ['Bring Lena into the agreement, since they pushed Marcus into this project',0,'Getting the client’s boss into the contract (a triangle) is a contracting task.'],
   ['Hold the kickoff in a circle, not a lecture hall',3,'Paying attention to the room is part of engagement.'],
   ['Point out that Marcus is handling the report the way they handle schedules',2,'Watching how the client manages the feedback itself belongs to the feedback phase.']],
   'Each phase has its own business. Skipping one doesn’t make it go away, as the next screens show.');}},
{part:2,src:'Chapter 3 · Completing the Requirements of Each Phase',run(L){
  L.h(L.kick('ex','How skipped business comes back')+'<h1 class="q">A possible future for Jordan, if they rush contracting</h1>');
  L.beats(L.card,[
   ['Contracting','Jordan is eager to start. They never ask Marcus to tell the supervisors about the project. They never ask whether Marcus feels pushed into it by Lena.'],
   ['Discovery','Jordan arrives on the floor to interview supervisors. Nobody knows why Jordan is there. Answers are short and guarded. Jordan feels undercut.'],
   ['Feedback','Marcus questions every number in Jordan’s report, again and again.'],
   ['What is really going on','The endless questions are not about the data. They come from Marcus’s unspoken feeling of being pushed at the start.'],
   ['The cost','Reworking that feeling now is far harder than naming it in the first meeting would have been.']],
   'Block calls this '+L.g('unfinished-business','unfinished business')+'. It always comes out somewhere, and usually indirectly.');}},
{part:2,src:'Chapter 3 · Completing the Requirements of Each Phase',run(L){
  L.h(L.kick('learn','Don’t bend over at the start')+'<h1 class="q">The image you set early is the one you keep</h1>'+
   L.prose('Because we want the project to start, we tend to play down early doubts and skepticism. We hope the client will get hooked once the work begins and learn to trust us.')+
   L.prose('It rarely works. If you bend over at the start, the client sees you as someone who works bent over. If you avoid issues at the start, they see you as someone who avoids issues. That image is hard to change, especially if the client likes it.')+
   L.note('The same is true for wants. Most of us ask what the client wants. Fewer of us say clearly what <b>we</b> want and what the client will <b>offer</b>. Wants skipped early are much harder to recover later.','alert'));
  L.done();}},
{part:2,src:'Chapter 3 · Completing the Requirements of Each Phase',pts:1,run(L){
  L.h(L.kick('pr','What would you do?')+'<h1 class="q">In the first meeting Marcus says, “Fine, do the project, I guess.” It sounds flat. Jordan is tempted to start anyway and win Marcus over later. What should Jordan do?</h1>');
  L.mc(L.card,['Start the work and let good results win Marcus over','Name the flat tone and ask how much Marcus wants this','Ask Lena to tell Marcus the project is a priority'],1,
   'Getting mixed motivation said out loud now is part of contracting. If it stays unspoken, it will come back later in a harder form.',
   'That avoids the issue, and the doubt will come back later, usually indirectly. The contracting task is to bring Marcus’s mixed motivation into the open now.');}},

/* ---------- PART 4: RESULTS AND FAILURE ---------- */
{part:3,src:'Chapter 3 · Results',run(L){
  L.h(L.kick('learn','Whose results are they?')+'<h1 class="q">A consultant controls only their own time and resources</h1>'+
   L.prose('That is what makes you a '+L.g('consultant','consultant')+' and not a manager. The '+L.g('line-manager','line manager')+' is paid to decide what gets implemented. If they take your report and do nothing, that is their right.')+
   L.lanes([['person','Jordan owns','Their own time, their own support resources, and how they work with Marcus.',2],
            ['home','Marcus owns','What the DC actually does with the findings, and whether it changes.',1]])+
   L.prose('If you want to be responsible for implementing your recommendations, Block’s advice is blunt: become a line manager.'));
  L.done();}},
{part:3,src:'Chapter 3 · Results',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Jordan is tempted to just write and run a new packing checklist at the DC themselves, “because it’s faster”. What is the main risk the book warns about?</h1>');
  L.mc(L.card,['Marcus is let off the hook and learns little','The process will be technically weaker','Renata will lose credit for the work'],0,
   'When the consultant takes over, the problem may get solved today, but the manager learns nothing. Later Jordan is either called back again and again, or blamed when the system breaks.',
   'The book’s worry isn’t quality or credit. Taking over lets Marcus off the hook, so they learn little and either depend on Jordan or blame Jordan’s “faulty system” later.');}},
{part:3,src:'Chapter 3 · Accountability',run(L){
  L.h(L.kick('ex','The furnace')+'<h1 class="q">Block’s picture of the deepest frustration in consulting</h1>');
  L.beats(L.card,[
   ['The call','An engineer is called in to fix a furnace at a plant.'],
   ['The work','They make sound recommendations so it will run perfectly for years.'],
   ['The catch','The engineer doesn’t operate the furnace. The plant’s people do, and they decide what to follow.'],
   ['The frustration','You know your advice is right, but you are not responsible for how the furnace is run. Coaching a manager is the same: they choose what to act on.'],
   ['What’s left','Work with the client in a way that makes it <b>more likely</b> they will take the advice and learn to run the furnace differently.']],
   'You can’t control the result. You can control how you work, and that is what you should be held accountable for.');}},
{part:3,src:'Chapter 3 · Accountability',run(L){
  L.h(L.kick('learn','What you are accountable for')+'<h1 class="q">Four things that make a consultation flawless</h1>'+
   L.prose('Not caring about results is not the point; you want your work used every time. But you can only be held to what you control. Block says you have consulted flawlessly if you:')+
   L.list([['book','Know your area of expertise','Taken as a given.'],['chat','Behave authentically','Say what you are experiencing.'],['check','Finish the business of each phase','No skipped requirements.'],['tree','Build the client’s capacity','So they can solve the next problem themselves.']],2)+
   L.prose('That holds even if nothing changes, the project dies in contracting, or you are let go the day you present. Not a happy outcome, but a competent one.')+
   L.note('Fire a consultant for weak contracting or for waiting until feedback to raise low motivation. Reward one for declining a project the signs said would fail.','scale'));
  L.done();}},
{part:3,src:'Chapter 3 · Accountability',pts:6,run(L){
  L.h(L.kick('pr','Fair to judge Jordan on?')+'<h1 class="q">Renata is writing Jordan’s yearly review. Sort what is fair to hold Jordan accountable for.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Hold Jordan to it','Not Jordan’s to own'],[
   ['Whether Jordan raised Marcus’s low motivation in contracting, not in feedback',0,'Finishing the business of contracting is fully in Jordan’s hands.'],
   ['Whether damaged deliveries actually fell this year',1,'Marcus and the DC run the operation. Jordan can only make success more likely.'],
   ['Whether Jordan told Lena plainly they didn’t want to police supervisors',0,'Being authentic is something Jordan controls.'],
   ['Whether Marcus followed the recommendations',1,'Acting on the advice is the line manager’s choice, and their right.'],
   ['Whether Marcus’s team could run the next fix without Jordan',0,'Building the client’s capacity is part of how Jordan works.'],
   ['Whether Jordan could prove the savings came from their work',1,'Block warns that needing credit comes from our own anxiety. Clients know what we contributed.']],
   'Judge a consultant on how they work: authenticity, finished phases, and building capacity. Not on what the client chooses to do.');}},
{part:3,src:'Chapter 3 · The Right to Fail',run(L){
  L.h(L.kick('learn','The right to fail')+'<h1 class="q">No consultant can guarantee results</h1>'+
   L.list([['eye','Help often works in private','Managers find it hard to accept help in public. Your work may affect them deeply and you may never know. Pushing them to show you helped can block their learning.'],
     ['shield','Managers have a '+L.g('right-to-fail','right to fail'),'They may choose to avoid a problem, keep loose controls, or suffer. As a consultant you are usually too far from the center of their world to change that.'],
     ['home','Hardest for internal consultants','You care about the company and see a unit going downhill. The mistake is making its rescue your personal goal. That belongs to its manager.']],3)+
   L.prose('Your job: give information as simply, directly and assertively as you can, and finish each phase. That is within anyone’s reach to do perfectly.'));
  L.done();}},
{part:3,src:'Chapter 3 · The Right to Fail',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Is Jordan on track?',['On track','Off track'],[
   ['Marcus hears the findings and decides to change nothing for now. Jordan accepts it, and notes they named the risks plainly.',0,'Marcus has a right to fail. Jordan did the job: clear information, every phase finished.'],
   ['Jordan makes “turning the DC around this year” their personal goal and starts working weekends on it.',1,'Rescuing the unit belongs to its manager. Taking it on leads to errors and despair.'],
   ['Jordan keeps pressing Marcus to say, in front of the team, that Jordan’s ideas helped.',1,'Pushing for public credit can block the learning you want. Help often works in private.'],
   ['Jordan declines a second project Marcus says is “essential”, because every other sign says Marcus won’t back it.',0,'Block says to reward exactly this kind of choice.']]);}}
  ]
});
</script>
</body>
</html>
