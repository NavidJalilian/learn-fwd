<title>Discovering Gifts, Capacities and Possibilities</title>

<body>
<script src="../assets/course.js"></script>

<script>
Course.lesson({
  id:'0013', title:'Discovering gifts, capacities and possibilities', minutes:19, icon:'leaf',
  goals:['Say when a gift-based focus beats a problem focus','Run discovery the positive-deviance way: find, invite, practice, self-measure','Recognize partnership in action, and why copying the technique alone fails'],
  parts:['Beyond problems','Positive deviance','For consultants','Partnership'],
  read:'Read chapter 12 of the book for the full positive-deviance story and Paul Uhlig’s own account of collaborative rounds.',
  glossary:{
    'gift-based':'Gift-based approach: discovery that looks at what is working, what people want to keep and what they long to create, instead of only at what is broken.',
    'positive-deviance':'Positive deviance: finding the people who, with the same resources as everyone else, have already solved the problem, then letting the community learn from them.',
    intractable:'Intractable problem: a problem that has been attacked again and again with the usual fixes and still won’t go away.',
    partnership:'Partnership: influence built as equals, the opposite of “parenting” people. It rests on contracting well, listening, and leaving the answers with the client.'
  },
  cheatsheet:[
    'Calling something a <b>problem</b> signals that someone needs fixing. People hear it as “I am the problem.”',
    'A problem focus also looks backward, slides into selling a “burning platform”, and speaks to the head more than the heart.',
    'Reach for a <b>gift-based</b> focus when the usual fixes have been tried again and again and the problem stays.',
    '<b>Positive deviance</b>: find the successful exceptions, work by invitation, observe (deviants don’t know what they know), let the community teach and practice, let them measure themselves.',
    'Knowing does not lead to doing. Practicing what works beats hearing about it.',
    'For you: contract to engage people, build on what already exists, work by invitation, be an equal learner.',
    '<b>Partnership</b> = contract well, inquire by listening, and leave the answers with the client.',
    'Copying a technique without the relationships behind it fails. The change is relational, not technical.'
  ],
  steps:[
/* ---------- PART 1: BEYOND PROBLEMS ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">You pack orders at the DC. A head-office memo says: “New program to fix the careless-packing problem.” How do you most likely feel?</h1>');
  L.mc(L.card,['Like I am the thing being fixed','Keen to help with the program'],0,
   'Most people would. Naming a problem points at someone who needs fixing, even when nobody means it. That is where this chapter starts.',
   'Some might, but most people hear “careless” as an accusation. Naming a problem points at someone who needs fixing. That is where this chapter starts.');}},
{part:0,src:'Chapter 12 · Discovering Gifts, Capacities, and Possibilities',run(L){
  L.h(L.kick('learn','A newer way to discover')+'<h1 class="q">Look at what works, not only at what is broken</h1>'+
   L.prose('Since the second edition, Block says, the most interesting new idea in discovery is to look at a system’s <b>gifts, capacities and possibilities</b>. It sits beside problem solving, and sometimes replaces it.')+
   L.prose('It goes by many names: asset-based community development, positive deviance, positive psychology, appreciative inquiry, future search. They share one premise. Looking at three things builds commitment to a change:')+
   L.flow([['book','The past','What do we want to keep?','',1],['check','The present','What is working now?','',2],['star','The future','What do we long to create?','',3]],false)+
   L.prose('Together these make up a '+L.g('gift-based','gift-based approach')+'.'));
  L.done();}},
{part:0,src:'Chapter 12 · Discovering Gifts, Capacities, and Possibilities',run(L){
  L.h(L.kick('learn','The limits of a problem focus')+'<h1 class="q">Four things a problem focus does to people</h1>'+
   L.list([['alert','Someone needs fixing','As soon as you call it a problem, people suspect they are what’s wrong, however careful you are.'],
     ['clock','It looks backward','It asks for the history of the problem and its causes, hoping that explains a better future. Often it doesn’t.'],
     ['flame','It slides into selling','It is easy to dramatize a “burning platform” to create urgency. Selling triggers as much defense as commitment.'],
     ['scale','It speaks to the head','Its logic is its strength, but reason alone struggles to engage people’s hearts.']],1)+
   L.note('These are not arguments against problem solving. They are reasons to sometimes focus on possibility and capacity instead.','info'));
  L.done();}},
{part:0,src:'Chapter 12 · Discovering Gifts, Capacities, and Possibilities',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Lena wants a kick-off slide: “Complaints doubled. The DC is on fire.” Which limit of a problem focus is Lena running into?</h1>');
  L.mc(L.card,['It speaks only to people’s heads','It slides into selling urgency','It looks backward at causes'],1,
   'A “the DC is on fire” slide is a burning platform. The book warns that selling urgency like this triggers as much defense as commitment.',
   'Look at what the slide does: it dramatizes a crisis to push people to change. That is selling a burning platform, and selling triggers defense.');}},
{part:0,src:'Chapter 12 · When All Else Fails',run(L){
  L.h(L.kick('learn','When all else fails')+'<h1 class="q">The clearest signal: the usual fixes keep failing</h1>'+
   L.prose('A possibility focus makes most sense for '+L.g('intractable','intractable')+' problems: long-term low morale, poor market results, quality problems that never go away. More programs and more funding have been tried, and little changed.')+
   L.prose('These problems usually need a shift in the <b>social system</b>: culture, norms, habits. Technical fixes do poorly there. Block uses school reform as his example: sensible fixes, tried for years, mostly aimed at what is wrong.')+
   L.lanes([['x','Deficit language','“Problem employees”, “low performers”, “kids at risk”. How do we get them back on board?',4],
            ['star','Gift language','What do they love to do? What are they good at? What gifts aren’t being used?',2]]));
  L.done();}},
{part:0,src:'Chapter 12 · When All Else Fails',run(L){
  L.h(L.kick('ex','Copperleaf')+'<h1 class="q">Damaged deliveries: a problem that has been “fixed” before</h1>');
  L.beats(L.card,[
   ['The history','Two years ago an outside firm wrote a thick report on the DC. Marcus agreed with every page. Nothing changed.'],
   ['The new request','Complaints have doubled. Marcus’s fix: training for “careless packers”. The language already names who needs fixing.'],
   ['What discovery found','Day-shift supervisors are pushed hard on loading speed. Nobody on the floor sees the complaint data. Schedules get overridden at short notice.'],
   ['The exception','One shift doesn’t fit the pattern. Kofi’s night shift, with the same trucks and the same products, has the fewest damaged orders.'],
   ['The new question','Jordan stops asking only “Why are packers careless?” and adds: “What is Kofi’s shift doing that works?”']],
   'When the usual fix has been tried and the problem stays, look for the gifts already in the system.');}},
{part:0,src:'Chapter 12 · When All Else Fails',pts:6,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Problem lens or possibility lens?',['Problem lens','Possibility lens'],[
   ['“Why do day-shift packers keep breaking things?”',0,'It starts from what is wrong and who is doing it.'],
   ['“Which shift ships the fewest damaged orders, and how?”',1,'It looks for what is already working.'],
   ['“What do packers take pride in and want to keep?”',1,'It asks what in the past is worth preserving.'],
   ['“Who are our low performers on the loading dock?”',0,'“Low performers” is deficit language: it looks for people to fix.'],
   ['“What would a damage-free week look like if we built it together?”',1,'It asks what the group longs to create.'],
   ['“What caused complaints to double since spring?”',0,'Tracing causes from the past is classic problem analysis.']]);}},

/* ---------- PART 2: POSITIVE DEVIANCE ---------- */
{part:1,src:'Chapter 12 · The Power of Positive Deviance',run(L){
  L.h(L.kick('learn','Positive deviance')+'<h1 class="q">Somebody has already solved it</h1>'+
   L.prose(L.g('positive-deviance','Positive deviance')+' was developed by Monique and Jerry Sternin, with Richard Pascale. They used it on problems that usual methods barely touched: undernourished children in villages in Vietnam, and dangerous infections in hospitals.')+
   L.prose('They saw that studying the problem itself gave weak results. Workshops, funding and best practices from elsewhere had not changed the daily habits behind it.')+
   L.note('Their premise: at least one person in the community, with the <b>same resources</b> as everyone else, has already solved the problem. So they asked: are there any healthy children in this village?','bulb'));
  L.done();}},
{part:1,src:'Chapter 12 · The Power of Positive Deviance',run(L){
  L.h(L.kick('learn','How the Sternins work')+'<h1 class="q">Five moves, none of them “tell people the answer”</h1>'+
   L.list([['eye','Find the exceptions','Focus on the successful exceptions, not the failing norm.'],
     ['people','Work by invitation','Invite everyone who cares to a meeting. Explain the process. Work only with those who come back the next day. No mandates.'],
     ['compass','Observe the deviants','Volunteers look for people who went against the norm. Watch them, don’t just interview them: they usually don’t know what they know.'],
     ['cycle','Let the community teach','Members decide the approach and help each other practice it. Practicing beats hearing.'],
     ['target','Let them measure','Community members track progress themselves, instead of an outside evaluator.']],2));
  L.done();}},
{part:1,src:'Chapter 12 · The Power of Positive Deviance',run(L){
  L.h(L.kick('ex','The village story, briefly')+'<h1 class="q">The moment most change efforts fail</h1>');
  L.beats(L.card,[
   ['Found','Volunteers find a few healthy children in poor families and see what their caretakers do differently.'],
   ['The trap','Now the answer is known. The reflex is to spread the word: teach, tell, educate. The Sternins saw that past failures happened right here.'],
   ['Why','Change efforts act as if once people <i>know</i> something, they will <i>do</i> it. They usually don’t.'],
   ['Instead','Mothers brought their children to a neighbor’s house each day and, with a health volunteer, cooked and fed them an extra nourishing meal together.'],
   ['Measured','Each health volunteer kept a booklet tracking every child’s weight. Within months almost everyone had a child, relative or neighbor’s child in the program.']],
   'Knowing is not doing. People change by practicing what works with neighbors, and by measuring it themselves.');}},
{part:1,src:'Chapter 12 · The Power of Positive Deviance',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Jordan wants to try positive deviance on damaged deliveries. Which question should Jordan start with?</h1>');
  L.mc(L.card,['What do other retailers count as best practice?','Which packers cause the most damage each week?','Who ships with few damages, using the same resources?'],2,
   'That is the Sternins’ question: find the successful exceptions working with the same trucks, products and staffing.',
   'Best practices from elsewhere and the worst packers are what the usual approach studies. Positive deviance looks for successful exceptions inside, with the same resources.');}},
{part:1,src:'Chapter 12 · The Power of Positive Deviance',pts:1,
 solve:async L=>{L.$('#ask').click();L.$('#watch').click();},
 run(L){
  const seen=new Set();
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Jordan wants to learn what Kofi’s night shift does. Try both ways.</h1>'+
   L.lanes([['chat','Ask Kofi','A ten-minute interview in the break room.<div class="res" id="ra"></div>',1],
            ['eye','Watch the shift start','Jordan arrives before the shift and just watches.<div class="res" id="rb"></div>',2]])+
   '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px"><button class="btn" id="ask">'+L.ic('chat')+'Ask</button><button class="btn" id="watch">'+L.ic('eye')+'Watch</button></div><div id="hq"></div>');
  const next=()=>{if(seen.size<2||L.$('#hq').innerHTML)return;const q=L.$('#hq');
    q.innerHTML='<h2 class="sub">Why did watching show what asking missed?</h2>';
    L.mc(q,['Kofi wanted to keep the method secret','Kofi doesn’t see the huddle as special'],1,
     'Positive deviants usually don’t know what they know. That is why the Sternins observe instead of only interviewing.',
     'Nothing suggests Kofi was hiding anything. Kofi simply doesn’t see the huddle as special: deviants usually don’t know what they know.');};
  L.$('#ask').onclick=function(){this.disabled=true;seen.add(0);L.$('#ra').innerHTML='<span style="color:var(--no)">Kofi: “Nothing special. We just pack carefully, I guess.”</span>';next();};
  L.$('#watch').onclick=function(){this.disabled=true;seen.add(1);L.$('#rb').innerHTML='<span style="color:var(--ok)">The crew gathers for a two-minute pack check before the first truck. Nobody asked them to.</span>';next();};}},
{part:1,src:'Chapter 12 · The Power of Positive Deviance',pts:1,run(L){
  L.h(L.kick('pr','Put it in order')+'<h1 class="q">Arrange the positive-deviance process as Jordan would run it at the DC.</h1>');
  L.order(L.card,[
   'Open meeting for anyone who cares about damage',
   'Work with those who come back the next day',
   'Volunteers watch for people beating the norm',
   'Floor members practice the method together',
   'Floor members track their own damage numbers'],
   'Invite, work with the willing, observe, practice, self-measure. Telling people the answer is not on the list.');}},
{part:1,src:'Chapter 12 · The Power of Positive Deviance',pts:6,run(L){
  L.h(L.kick('pr','Sternin-style or not?')+'<h1 class="q">Which of these moves fit positive deviance?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Fits','Doesn’t fit'],[
   ['Day-shift packers spend shifts packing alongside Kofi’s crew',0,'Practicing what works beats hearing about it.'],
   ['Jordan e-mails all packers a memo on “the night-shift method”',1,'That is telling. Knowing rarely turns into doing.'],
   ['Packers chart their own damage numbers on a board',0,'The community measures its own progress.'],
   ['Marcus orders every supervisor to attend the sessions',1,'The Sternins work strictly by invitation. No mandates.'],
   ['An outside auditor is hired to judge the results',1,'The Sternins let community members measure, not a third party.'],
   ['Jordan opens a meeting to anyone and continues with those who return',0,'That is the two-meeting invitation the Sternins use.']],
   'Find, invite, observe, practice and self-measure. Telling, ordering and outside judging are the old habits.');}},

/* ---------- PART 3: FOR CONSULTANTS ---------- */
{part:2,src:'Chapter 12 · The Implications of Positive Deviance for Consulting',run(L){
  L.h(L.kick('learn','What this means for you')+'<h1 class="q">Stop being the one with the answer</h1>'+
   L.tiers([['pencil','Contract for it','From the start, agree to engage people in the system to find solutions. Treat the engagement as being as important as the solution.','and choose an approach the people there can measure and run themselves'],
            ['eye','Build on what exists','Look for solutions already in the system, even if they are rare and unknown. The Sternins call such gifts invisible in plain sight.','your choice, even when the client is problem focused',true,'Most often skipped']])+
   L.prose('This reduces the client’s dependence on you. Most clients start problem focused; you can still contract to discover what is working and who has figured something out.'));
  L.done();}},
{part:2,src:'Chapter 12 · The Implications of Positive Deviance for Consulting',run(L){
  L.h(L.kick('learn','Invitation and partnership')+'<h1 class="q">Fewer people who want to be there beat many who must</h1>'+
   L.lanes([['people','Work by invitation','Even when leaders could mandate the process, a smaller group that shows interest beats well-placed people who come out of obligation.',2],
            ['chat','Be an equal learner','The Sternins listen endlessly, offer no solutions beyond principles, and stay learners as well as teachers.',3]])+
   L.prose('Both point to the same stance: a true partnership with the people you mean to serve.'));
  L.done();}},
{part:2,src:'Chapter 12 · The Implications of Positive Deviance for Consulting',run(L){
  L.h(L.kick('ex','Copperleaf')+'<h1 class="q">Jordan recontracts with Marcus</h1>');
  L.beats(L.card,[
   ['Marcus','“Fine, the night shift is good. Write up what they do and make the day shift follow it.”'],
   ['Jordan names a want','“I’d like the floor to find and test the fix themselves. The way they get involved matters as much as the fix.”'],
   ['Jordan offers','“I’ll set up an open session. Whoever comes back for a second one works with Kofi’s crew on the floor.”'],
   ['Marcus pushes','“Why not just make all twelve day-shift packers go?”'],
   ['Jordan holds','“Six who want to be there will do more than twelve who were sent. And they’ll track their own damage numbers, so you see results.”']],
   'Jordan contracts for engagement, builds on the gift already in the DC, and works by invitation.');}},
{part:2,src:'Chapter 12 · The Implications of Positive Deviance for Consulting',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Renata hears about the pilot: “Get Lena to order every shift into it. It’ll go faster.” What fits the book?</h1>');
  L.mc(L.card,['Accept it: an order from Lena reaches everyone','Keep the invitation and start with the willing','Drop the pilot until Lena sponsors it'],1,
   'Even with leaders who could mandate it, the book prefers a smaller group acting out of interest over people acting out of obligation.',
   'An order brings people out of obligation, and waiting for a sponsor stalls the work. The book says to work by invitation with those who show interest.');}},
{part:2,src:'Chapter 12 · The Implications of Positive Deviance for Consulting',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which implication is Jordan applying?',['Contract for engagement','Build on what exists','Work by invitation','Be an equal learner'],[
   ['In the first meeting Jordan agrees with Marcus that the floor will design and measure the fix.',0,'Contracting from the start to engage people, not just deliver an answer.'],
   ['Jordan asks Eastgate who already ships large items with almost no damage.',1,'Looking for solutions already present in the system.'],
   ['Jordan posts an open note in the break room and works with the four packers who reply.',2,'Interest, not obligation, decides who takes part.'],
   ['At the floor session Jordan mostly listens and asks Kofi’s crew to teach Jordan too.',3,'Listening and learning alongside, offering principles, not solutions.']]);}},

/* ---------- PART 4: PARTNERSHIP ---------- */
{part:3,src:'Chapter 12 · An Example of What Is Working',run(L){
  L.h(L.kick('learn','Partnership, not parenting')+'<h1 class="q">The core of the whole method in three parts</h1>'+
   L.prose('Block says the book’s core message is that influence comes from '+L.g('partnership','partnership')+', not from a parenting stance toward people. Partnership has three elements:')+
   L.list([['pencil','Contract well','Be clear about your own wants and the wants of others.'],
     ['chat','Inquire by listening','Be willing to discover through listening, not only through your expertise.'],
     ['compass','Answers stay with the client','The answers, and the decision to act, rest with those who came with the question, however much you know.']],3));
  L.done();}},
{part:3,src:'Chapter 12 · Health Care Reform in Action',run(L){
  L.h(L.kick('ex','A surgeon’s story, briefly')+'<h1 class="q">Paul Uhlig and “Don’t you people talk to each other?”</h1>');
  L.beats(L.card,[
   ['The question','Patients and families of a cardiac surgery team kept asking whether the staff talked to each other. They did, constantly, yet everyone felt they weren’t on the same page.'],
   ['Recontract','Uhlig, the surgeon, and his team set out to make that question go away. They began weekly meetings open to anyone involved in these patients’ care.'],
   ['Bedside rounds','Prompted by a social worker and a nurse practitioner, they started daily rounds with patients and families, at 8:45, the “least impossible” time.'],
   ['Open, not perfect','Showing their real doubts made patients trust them more. They agreed to use ordinary language and talk to the patient, not about them.'],
   ['Results','Recovery was faster, and deaths and complications fell by half.']],
   L.quote('You treated us like ordinary people, and that made all the difference.','a patient, in the book’s account of Uhlig’s team'));}},
{part:3,src:'Chapter 12 · Success Carries Its Own Set of Challenges',run(L){
  L.h(L.kick('learn','The part people missed')+'<h1 class="q">It was a relational achievement, not a technical one</h1>'+
   L.prose('After a national safety award, Uhlig visited many hospitals proud of their “team rounds”. Usually doctors talked in the middle, others answered when pointed at, and the patient was talked about, not with.')+
   L.prose('Even his own team’s article described the techniques and missed the point: <b>their working relationships had changed</b>. Copies that took the technique failed; the few that worked had got the relationships right.')+
   L.note('Then Uhlig lost his job. The system valued control and status over results. He treated that as data about how hard culture change is. Block says dealing with this is as much part of the work as contracting, discovery and feedback.','alert'));
  L.done();}},
{part:3,src:'Chapter 12 · Success Carries Its Own Set of Challenges',pts:1,run(L){
  L.h(L.kick('pr','What would you do?')+'<h1 class="q">The night-shift huddle works. Lena wants it on a laminated checklist sent to all 40 stores by Friday. What does Uhlig’s story warn Jordan?</h1>');
  L.mc(L.card,['The checklist wording needs a careful test first','The stores are too different from a DC to copy it','The steps travel; the relationships behind them may not'],2,
   'Uhlig’s copycats had the technique and missed the relationships. The huddle works because of how Kofi’s crew works together.',
   'Wording and site differences aren’t the lesson. Uhlig’s copycats failed because they copied the technique and missed the relationships behind it.');}},
{part:3,src:'Chapter 12 · An Example of What Is Working',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Tap each piece until the sentence describes Jordan working in partnership.</h1>');
  L.sentence(L.card,[['Jordan hides their wants','Jordan states their wants'],['and diagnoses the floor alone','and listens to the floor'],['and keeps the answers for the report','and leaves the answers with the DC team']],[1,1,1],
   [['Partnership starts with being clear about your own wants, not hiding them.'],['Partnership means inquiring by listening, not diagnosing from outside.'],['The answers and the decision to act stay with the client.']],
   'Contract well, inquire by listening, and leave the answers with the client: the three elements of partnership.');}},
{part:3,src:'Chapter 12 · An Example of What Is Working',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Partnership or parenting?',['Partnership','Parenting'],[
   ['Jordan tells the day shift: “Here is what you are doing wrong, and here is the fix.”',1,'Telling people what is wrong with them and handing over the fix is the parenting stance.'],
   ['Jordan asks the packers what would make a damage-free week possible.',0,'Inquiring by listening, and the answer stays with them.'],
   ['Jordan says to Marcus: “I want the floor to own this. What do you want from it?”',0,'Clear about both sets of wants: contracting well.'],
   ['Jordan writes a polished report and asks Marcus only to sign off.',1,'The answers stay with Jordan, and Marcus becomes passive.'],
   ['Jordan admits to Kofi’s crew: “I don’t know why your shift works. Can you show me?”',0,'Not knowing and learning together, as Uhlig’s team found, builds trust.']]);}}
  ]
});
</script>

</html>
