<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prioritizing Opportunities, Not Solutions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
/* small opportunity tree: node = [label, children[], borderColor?] */
const TR=(n,d)=>{d=d||0;return '<div style="'+(d?'margin-left:8px;padding-left:10px;border-left:2px solid var(--line2);':'')+'padding-top:6px">'+
  '<div style="display:inline-block;max-width:100%;border:2px solid '+(n[2]||'var(--line)')+';background:var(--card);border-radius:12px;padding:6px 11px;font-size:14px;font-weight:500;line-height:1.35">'+n[0]+'</div>'+
  (n[1]||[]).map(c=>TR(c,d+1)).join('')+'</div>';};
const TREE=n=>'<div style="background:var(--soft);border-radius:16px;padding:8px 12px 12px;margin:12px 0">'+TR(n)+'</div>';

Course.lesson({
  id:'0007', title:'Prioritizing opportunities, not solutions', minutes:20, icon:'compass',
  goals:['Walk down the tree to one target opportunity','Compare sibling opportunities through four lenses','Make the call quickly, and change it when you learn more'],
  parts:['One at a time','Walk the tree','Four lenses','Decide and move'],
  read:'Read chapter 7 of the book for the research on reversible decisions and more on each lens.',
  glossary:{
    'build-trap':'Build trap: measuring success by what you ship instead of by the outcomes it produces.',
    'leaf':'Leaf opportunity: an opportunity on the tree that has no children (yet).',
    'table-stakes':'Table stakes: something customers expect from every option. Missing it can sink sales.',
    'differentiator':'Differentiator: something that sets you apart from competitors and can win new customers.',
    'confirmation-bias':'Confirmation bias: noticing mostly the evidence that supports what you already believe.',
    'opportunity-cost':'Opportunity cost: what you give up by not choosing one of the other options.',
    'two-way':'Two-way door decision: a decision you can easily undo if you don’t like what you find.'
  },
  cheatsheet:[
    'Product strategy happens in the <b>opportunity space</b>, not in the feature list. Avoid the build trap.',
    'Work on <b>one target opportunity at a time</b>: value ships sooner, and you can compare several solutions for it.',
    'Compare <b>siblings</b> against each other. Never ask “should we do this one?” on its own.',
    'Walk down: pick the best top-level branch, ignore the rest, compare its children, repeat until you reach a <b>leaf</b>.',
    'Four lenses: <b>sizing</b> (how many, how often), <b>market</b>, <b>company</b>, <b>customer</b> (important but badly served).',
    '<b>Don’t score and stack-rank.</b> Debate the lenses, accept there may be no clear winner, leave room for doubt.',
    'Choosing a target is a <b>two-way door</b>: time-box it to hours or a day or two, decide, and turn around if you learn otherwise.',
    'Traps: waiting for more data, leaning on one lens, working backwards from a favorite.'
  ],
  steps:[
/* ---------- PART 1: ONE AT A TIME ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Fernway’s trio has three customer problems to work on. Which way gets something useful to customers sooner?</h1>');
  L.mc(L.card,['Work on all three at the same time','Finish one, then start the next'],1,
   'Finishing one first means customers get that fix early, instead of waiting for all three to land at once.',
   'Spreading across all three means nothing is done until everything is done. Finishing one first gets a fix to customers sooner.');}},
{part:0,src:'Chapter 7 · opening story',run(L){
  L.h(L.kick('learn','The build trap')+'<h1 class="q">Strategy isn’t a list of features</h1>'+
   L.quote('You are never one feature away from success.','Teresa Torres, closing a talk at Mind the Product')+
   L.prose('Most teams talk in features: roadmaps, backlogs, release plans. Melissa Perri calls this the '+L.g('build-trap','build trap')+': judging success by what you ship. Customers don’t care about most releases. They care about their needs being met.')+
   L.prose('So the book argues that product strategy happens in the <b>opportunity space</b>. It comes from choices about which outcome to pursue, which customers to serve and which opportunities to address. Many teams skip those choices, jump to ranking features and end up chasing competitors.')+
   L.note('With the opportunity tree from the last lesson, the trio is ready to make those choices.','tree'));
  L.done();}},
{part:0,src:'Chapter 7 · Focus on One Target Opportunity at a Time',run(L){
  L.h(L.kick('learn','One target at a time')+'<h1 class="q">Why pick just one opportunity?</h1>'+
   L.list([['cycle','Value over time','Solve one, ship it, move on. Spread across many, and you’re back to delivering too much, too late, all at once.'],
     ['scale','Room to compare solutions','With one target, the trio can explore several solutions for it and compare them. That’s the next lesson.'],
     ['layers','Less work in progress','A research review on kanban (a method that limits work in progress) found better quality, steadier delivery and fewer customer complaints. Limiting work in progress was a key reason.']],2)+
   L.prose('The one you pick is your <b>target opportunity</b>. To choose it, you don’t have to assess every note on the tree. The tree’s structure does much of the work.'));
  L.done();}},
{part:0,src:'Chapter 7 · Focus on One Target Opportunity at a Time',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Priya suggests tackling “recipes take too long,” “ingredients go bad” and “bored of recipes” all this month. What does the book suggest instead?</h1>');
  L.mc(L.card,['Pick one target and solve it first','Do all three, just at a slower pace','Let customers vote on all three'],0,
   'One target at a time: ship value sooner, and compare several solutions for that one need.',
   'A slower pace across three is still spreading thin, and a vote doesn’t fix that. Pick one target, solve it, then move on.');}},
{part:0,src:'Chapter 7 · Focus on One Target Opportunity at a Time',pts:1,
 solve:async L=>{L.$('#po').children[1].click();L.$('#go6').click();},
 run(L){
  let p=null;const N=['Team Spread','Team Focus','Same week'];
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">Team Spread works on three opportunities at once. Team Focus does one at a time. Who gets value to customers first?</h1><div id="po"></div>'+
   '<div id="race" hidden><div style="display:flex;align-items:center;justify-content:space-between;margin-top:6px;gap:8px;flex-wrap:wrap"><div><div class="small">Simulated time</div><div class="week" id="wk">Week 0</div></div><button class="btn pri" id="go6">'+L.ic('play')+'Run 6 weeks</button></div>'+
   '<div class="meterrow"><div class="lb">Spread: value shipped</div><div class="meter"><div id="ma" style="background:var(--h3)"></div></div></div>'+
   '<div class="meterrow"><div class="lb">Focus: value shipped</div><div class="meter"><div id="mb" style="background:var(--ok-strong)"></div></div></div>'+
   '<p class="small">A simple illustration, not real data.</p></div>');
  N.slice(0,3).forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=n;b.onclick=()=>{if(p!==null)return;p=j;b.classList.add('sel');L.$('#race').hidden=false;};L.$('#po').appendChild(b);});
  L.$('#go6').onclick=function(){this.remove();let w=0;
    const t=setInterval(()=>{w++;const wk=L.$('#wk');if(!wk){clearInterval(t);return;}wk.textContent='Week '+w;
      const a=L.$('#ma'),b=L.$('#mb');if(a)a.style.width=(w>=6?100:0)+'%';if(b)b.style.width=Math.floor(w/2)*33.4+'%';
      if(w>=6){clearInterval(t);L.award(p===1);
        L.sheet(p===1?'ok':'no',p===1?'You called it!':'Team Focus shipped first','Both finish all three by week 6. But Team Focus had something useful in customers’ hands by week 2. Team Spread delivered nothing until the very end: too much, too late, all at once.');L.done();}},350);};}},

/* ---------- PART 2: WALK THE TREE ---------- */
{part:1,src:'Chapter 7 · Using the Tree to Aid Decision Making',run(L){
  L.h(L.kick('learn','Compare, don’t ask “whether”')+'<h1 class="q">Judge opportunities against each other, never alone</h1>'+
   L.prose('“Should we work on this opportunity?” sounds sensible. But it’s a <i>whether-or-not</i> question, and those lead to poor decisions.')+
   L.lanes([['x','Whether or not','Invites '+L.g('confirmation-bias','confirmation bias')+', and hides the '+L.g('opportunity-cost','opportunity cost')+' of what you’re not choosing.',4],
            ['scale','Compare and contrast','Put a set of siblings side by side and ask which matters most right now.',2]])+
   L.prose('Start at the top: compare the top-level opportunities on your tree against each other.'));
  L.done();}},
{part:1,src:'Chapter 7 · Using the Tree to Aid Decision Making',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">The Fernway trio walks down its tree</h1>');
  L.beats(L.card,[
   ['Level 1','They compare the four top branches: <i>Choosing meals, Unpacking the box, Deciding tonight’s meal, Cooking it.</i> They pick <b>Cooking it</b>.'],
   ['Set the rest aside','Their tree is well structured, so the best next opportunity lives under the branch they chose. They can ignore the other three for now.'],
   ['Level 2','They compare the children of Cooking it: <i>Recipes take too long on weeknights, Recipes need tools I don’t own, I lose my place in the steps.</i> They pick <b>Recipes take too long on weeknights</b>.'],
   ['Level 3','That one has children too: <i>Chopping takes ages, I have to read the whole recipe first.</i> They compare again and pick <b>Chopping takes ages</b>.'],
   ['A leaf','“Chopping takes ages” has no children. It’s a '+L.g('leaf','leaf')+', so it becomes their <b>target opportunity</b>. A leaf isn’t necessarily easy. It just has no known sub-opportunities yet.']],
   'Three small comparisons instead of ranking every note on the tree. Always end on a leaf, so you can deliver value one small piece at a time.');}},
{part:1,src:'Chapter 7 · Using the Tree to Aid Decision Making',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">The trio chose the branch “Deciding tonight’s meal.” Under it, they picked “I forget what’s left in the fridge,” which has two children. What next?</h1>');
  L.mc(L.card,['Start designing a fix for the parent','Go back and rank every note on the tree','Compare its two children and pick one'],2,
   'Keep walking down until you reach a leaf. The two children are siblings, so compare them against each other.',
   'It still has children, so it’s not a leaf yet, and there’s no need to reassess the whole tree. Compare the two children and keep going down.');}},
{part:1,src:'Chapter 7 · Using the Tree to Aid Decision Making',pts:1,run(L){
  L.h(L.kick('pr','Put in order')+'<h1 class="q">Tap the steps for choosing a target opportunity, in order.</h1>');
  L.order(L.card,['Compare the top-level opportunities','Set the other branches aside','Compare the chosen one’s children','Repeat until there are no children','Make that leaf your target'],
   'Each decision shrinks the tree you still have to look at. That’s the power of the structure.');}},
{part:1,src:'Chapter 7 · Using the Tree to Aid Decision Making',pts:1,run(L){
  L.h(L.kick('pr','Pick a valid target')+'<h1 class="q">Which of these could be the trio’s target opportunity?</h1>'+
   TREE(['Cooking it',[['Recipes take too long on weeknights',[['Chopping takes ages'],['I have to read the whole recipe first']]],['Recipes need tools I don’t own']],'var(--h1)'])+'<div id="hq"></div>');
  L.mc(L.$('#hq'),['Cooking it','I have to read the whole recipe first','Recipes take too long on weeknights'],1,
   'It has no children, so it’s a leaf. (“Chopping takes ages” and “Recipes need tools I don’t own” are leaves too.)',
   '“Cooking it” is a whole branch, and “Recipes take too long” still has children. Keep going down to a leaf, like “I have to read the whole recipe first.”');}},

/* ---------- PART 3: FOUR LENSES ---------- */
{part:2,src:'Chapter 7 · Assessing a Set of Opportunities',run(L){
  L.h(L.kick('learn','Four lenses')+'<h1 class="q">How do you compare a set of siblings?</h1>'+
   L.prose('The book suggests four sets of factors. Think of each as a lens: a different way of seeing impact. Tap each card.'));
  L.flips(L.card,[
   ['Opportunity sizing','How many customers does it affect, and how often? Rough estimates are fine.'],
   ['Market factors','Is it '+L.g('table-stakes','table stakes')+' or a '+L.g('differentiator','differentiator')+'? Which outside trends could help or hurt?'],
   ['Company factors','Does it fit the vision, mission and strategy of the company, your group and your team? Does it clash with values? What are your strengths?'],
   ['Customer factors','How important is it to customers, and how happy are they with how they solve it today?']],
   'Favor opportunities that matter a lot to customers and are badly served today. And use all four lenses, not just your favorite.');}},
{part:2,src:'Chapter 7 · Assessing a Set of Opportunities',run(L){
  L.h(L.kick('learn','Sizing, done lightly')+'<h1 class="q">How many, and how often, are different questions</h1>'+
   L.prose('Don’t size each opportunity precisely. That turns into endless data gathering. Instead, size a <b>set of siblings against each other</b>, roughly, using what you have: usage data, support tickets, quick surveys or your interview snapshots.')+
   L.lanes([['people','Many, now and then','“I can’t pause my plan for the holidays.” Nearly every customer, but only a few times a year.',1],
            ['clock','Some, all the time','“Recipes take too long on weeknights.” Fewer customers, but every single weeknight.',2]])+
   L.prose('Addressing each one would have a different impact. Count both.'));
  L.done();}},
{part:2,src:'Chapter 7 · Assessing a Set of Opportunities',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Priya wants to survey 2,000 customers to measure exactly how many face each of three sibling opportunities. Marco says tickets and interview snapshots are enough. Who’s closer to the book?</h1>');
  L.mc(L.card,['Marco: a rough comparison is enough','Priya: exact numbers prevent mistakes'],0,
   'You only need to know which sibling affects more customers, more often. Rough estimates from data you already have will do.',
   'Precise sizing can turn into a never-ending data hunt. You only need a rough comparison between siblings, and tickets and snapshots give you that.');}},
{part:2,src:'Chapter 7 · Assessing a Set of Opportunities',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">Comparing three siblings under “Cooking it”</h1>');
  L.beats(L.card,[
   ['The set','<b>A:</b> Recipes take too long on weeknights. <b>B:</b> Recipes need tools I don’t own. <b>C:</b> I lose my place in the steps.'],
   ['Sizing','A shows up in most interview snapshots, every weeknight. B comes up for a few people, now and then. C affects many, but it’s a small annoyance.'],
   ['Market','Rival meal kits advertise quick meals, so A looks close to table stakes. Nobody competes on B or C.'],
   ['Company','In this example, Fernway’s mission is home cooking for busy households. A fits it best, and Fernway’s recipe writers already know how to write short recipes: a strength.'],
   ['Customer','A matters a lot, and customers are unhappy with how they cope today: ordering takeout. C matters less, and people manage by scrolling back.'],
   ['Decide','This time A leads through every lens. Often the lenses disagree. Then the trio debates and makes the best call for now.']],
   'Each lens shows impact from a different angle. Use them to fuel the conversation, not to calculate an answer.');}},
{part:2,src:'Chapter 7 · Assessing a Set of Opportunities',pts:6,run(L){
  L.h(L.kick('pr','Which lens?')+'<h1 class="q">The trio gathers evidence. Which lens does each piece belong to?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Sizing','Market','Company','Customer'],[
   ['Support tickets about wilting herbs come from about 1 in 10 customers each week.',0,'How many customers, how often: that’s sizing.'],
   ['Every rival meal kit now offers a vegetarian plan.',1,'Something every competitor has may be table stakes: a market factor.'],
   ['Fernway’s leadership made “less food waste” a goal for the year.',2,'Fit with the company’s strategy is a company factor.'],
   ['Customers say quick meals matter a lot, and takeout is a poor fix.',3,'Important, and badly served today: a strong customer factor.'],
   ['More people are cooking at home to save money this year.',1,'An outside trend is a market factor.'],
   ['Dev’s team already built a strong reminder system.',2,'Strengths and weaknesses of the company or team are company factors.']],
   'Sizing: how many, how often. Market: competitors and trends. Company: strategy, values, politics, strengths. Customer: importance and satisfaction.');}},
{part:2,src:'Chapter 7 · Assessing a Set of Opportunities',pts:1,run(L){
  L.h(L.kick('pr','Read the sizing')+'<h1 class="q">Opportunity A affects nearly every customer, once a year at renewal. Opportunity B affects a third of customers, every week. What should the trio take from this?</h1>');
  L.mc(L.card,['A wins, since it touches everyone','Weigh how often, not just how many','B wins, since weekly beats yearly'],1,
   'How many and how often are different, and each opportunity would have a different impact. Sizing is also just one lens: check the other three too.',
   'Neither number settles it alone. A touches more people, B hits more often. Weigh both, then look through the other three lenses.');}},

/* ---------- PART 4: DECIDE AND MOVE ---------- */
{part:3,src:'Chapter 7 · Embrace the Messiness',run(L){
  L.h(L.kick('learn','Embrace the messiness')+'<h1 class="q">Don’t turn it into a math formula</h1>'+
   L.lanes([['x','Tempting','Give each opportunity 1–3 points per lens, add them up, rank by total.',4],
            ['chat','Better','Compare siblings side by side through each lens. Debate. Decide for now.',2]])+
   L.prose('You’re making <b>relative</b> judgments between siblings, not absolute ones. Scoring takes a lot of work, is full of guesses, and doesn’t lead to a better decision.')+
   L.prose('Worse, a formula makes a messy problem look like it has one right answer, so people stop thinking and follow the numbers. If there’s no clear winner, that’s fine. Leave room for doubt, and you’ll be readier to change course if you picked wrong.'));
  L.done();}},
{part:3,src:'Chapter 7 · Embrace the Messiness',pts:1,
 solve:async L=>{L.$('#tw').click();},
 run(L){
  const R=[['Sizing',3,2],['Market',2,1],['Company',2,3],['Customer',2,2]];
  const draw=()=>{let ta=0,tb=0;L.$('#tb').innerHTML='<tr><th style="text-align:left;padding:6px 4px">Lens</th><th style="padding:6px 4px">A · Too long</th><th style="padding:6px 4px">B · Lose my place</th></tr>'+
    R.map(r=>{ta+=r[1];tb+=r[2];return '<tr><td style="padding:6px 4px">'+r[0]+'</td><td style="text-align:center">'+r[1]+'</td><td style="text-align:center'+(r[3]?';color:var(--no);font-weight:700':'')+'">'+r[2]+'</td></tr>';}).join('')+
    '<tr style="border-top:2px solid var(--line2);font-weight:700"><td style="padding:6px 4px">Total</td><td style="text-align:center'+(ta>tb?';color:var(--ok)':'')+'">'+ta+'</td><td style="text-align:center'+(tb>ta?';color:var(--ok)':'')+'">'+tb+'</td></tr>';};
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Marco scored two siblings, 1 to 3 per lens. Now change one guess and watch the ranking.</h1>'+
   '<div style="background:var(--soft);border-radius:16px;padding:10px 12px;margin:10px 0"><table id="tb" style="width:100%;border-collapse:collapse;font-size:14.5px"></table></div>'+
   '<div id="why" class="small" style="min-height:20px;margin-bottom:10px"></div><button class="btn pri" id="tw">'+L.ic('pencil')+'Change one guess</button><div id="hq"></div>');
  draw();
  L.$('#tw').onclick=function(){this.remove();R[1][2]=3;R[1][3]=1;draw();
    L.$('#why').innerHTML='Marco hears a rival <i>might</i> launch step-by-step cooking mode, and bumps B’s market score from 1 to 3. Now B wins.';
    const q=L.$('#hq');q.innerHTML='<h2 class="sub">What does this show about scoring?</h2>';
    L.mc(q,['The scores need finer steps, like 1 to 10','Each score is a guess that looks like a fact','The market lens should count for double'],1,
     'One rumor flipped the ranking. The total looked precise, but it was built from guesses. That’s why the book says to compare and debate instead of scoring.',
     'Finer scales and weights just add more guesses. The point: the total looked precise, but one rumor flipped it. Compare and debate instead of scoring.');};}},
{part:3,src:'Chapter 7 · Two-Way Door Decisions',run(L){
  L.h(L.kick('learn','Two-way doors')+'<h1 class="q">Most discovery decisions can be undone</h1>'+
   L.prose('In a 2015 letter to shareholders, Jeff Bezos split decisions into two kinds. The book pictures them as doors.')+
   L.lanes([['lock','One-way door','Hard to undo. Once through, you can’t come back. Be slow, careful and data-driven.',4],
            ['cycle','Two-way door','Easy to undo. If you don’t like what you see, walk back. Move fast: acting teaches more than imagining.',2]])+
   L.prose('Choosing a target opportunity is a '+L.g('two-way','two-way door')+'. You’re committing the next few days or weeks to exploring it, not promising to build anything. If it turns out harder or less important than you thought, choose another.')+
   L.note('Research by Lottie Bullens and colleagues: people who saw a choice as reversible kept judging it critically afterward. Those who saw it as final noticed only its upsides.','flask'));
  L.done();}},
{part:3,src:'Chapter 7 · Two-Way Door Decisions',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Which of these is a one-way door for Fernway, where slow and careful is right?</h1>');
  L.mc(L.card,['Picking next month’s target opportunity','Testing a quick-recipe idea with 5 customers','Signing a 3-year contract with a supplier'],2,
   'A long contract is hard to undo, so it deserves slow, careful thought. Choosing what to explore next is easy to reverse.',
   'Picking a target and running a small test are both easy to undo: two-way doors. A 3-year contract is the one you can’t walk back through.');}},
{part:3,src:'Chapter 7 · Avoid These Common Anti-Patterns',pts:6,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Spot the trap',['Waiting for more data','Leaning on one lens','Working backwards','Scoring and ranking'],[
   ['“Let’s wait for next month’s survey before we choose a target.”',0,'There’s always one more report. Time-box the decision and move on.'],
   ['“Sizing says A affects the most people. We don’t need the other lenses.”',1,'Each lens shows something different. Use all four.'],
   ['Priya already wants quick recipes, and reads every lens as proof for them.',2,'The lenses are for exploring, not for justifying a decision already made.'],
   ['Marco gives each opportunity 1–3 points per lens and picks the highest total.',3,'A formula hides the guesses and stops the thinking. Compare and debate.'],
   ['The trio picks a popular need that leadership will never support.',1,'They skipped company factors. Many teams forget that lens.'],
   ['The trio asks one more stakeholder, then one more, then one more.',0,'Good intent, but it’s analysis paralysis. Decide with what you know today.']]);}},
{part:3,src:'Chapter 7 · Avoid These Common Anti-Patterns',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">The trio keeps putting off its choice. Tap each piece until the plan matches the book’s advice.</h1>');
  L.sentence(L.card,[['Time-box the choice to','Keep gathering data for'],['a day or two,','a full quarter,'],['then decide on what we know','then wait for one more report'],['and revisit if we learn more.','and never reopen it.']],[0,0,0,0],
   [['Open-ended data gathering is how analysis paralysis starts.'],['Far too long. The book suggests an hour or two, or at most a day or two.'],['There will always be one more report. Decide with what you know today.'],['It’s a two-way door. If new data says you chose badly, turn around.']],
   'Time-box, decide, and stay ready to course-correct. You’ll learn more from acting than from waiting.');}},
{part:3,src:'Chapter 7 · Two-Way Door Decisions',pts:1,run(L){
  L.h(L.kick('pr','Two weeks later')+'<h1 class="q">The trio has been exploring “Chopping takes ages.” They learn most customers already buy pre-chopped vegetables and are happy with that. What now?</h1>');
  L.mc(L.card,['Turn around and choose another target','Keep going, since they committed to it','Score the whole tree again from scratch'],0,
   'Customers are satisfied with how they solve it today, so it matters less than it looked. It was a two-way door: walk back and pick again.',
   'Choosing a target was never a promise to build. And there’s no need to score anything. They learned customers are satisfied today, so they walk back through the door and pick another sibling.');}}
  ]
});
</script>
</body>
</html>
