<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapping the Opportunity Space</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
/* small opportunity tree: node = [label, children[], borderColor?] */
const TR=(n,d)=>{d=d||0;return '<div style="'+(d?'margin-left:8px;padding-left:10px;border-left:2px solid var(--line2);':'')+'padding-top:6px">'+
  '<div style="display:inline-block;max-width:100%;border:2px solid '+(n[2]||'var(--line)')+';background:var(--card);border-radius:12px;padding:6px 11px;font-size:14px;font-weight:500;line-height:1.35">'+n[0]+'</div>'+
  (n[1]||[]).map(c=>TR(c,d+1)).join('')+'</div>';};
const TREE=n=>'<div style="background:var(--soft);border-radius:16px;padding:8px 12px 12px;margin:12px 0">'+TR(n)+'</div>';

Course.lesson({
  id:'0006', title:'Mapping the opportunity space', minutes:20, icon:'tree',
  goals:['Turn a pile of interview notes into an opportunity tree','Tell parents, children and siblings apart','Spot and fix six common mapping mistakes'],
  parts:['Why map it','Trees, not lists','Building it','Traps'],
  read:'Read chapter 6 of the book for the full Seera Group story and the streaming-service tree, drawn out.',
  glossary:{
    'ill-structured':'Ill-structured problem: a problem with no single right answer and no clear steps to reach one.',
    'opp-backlog':'Opportunity backlog: a ranked list of customer needs, kept the same way as a feature backlog.',
    'sibling':'Sibling opportunities: needs that share the same parent but can each be addressed on their own.'
  },
  cheatsheet:[
    'Every customer story holds many gaps. Map only the <b>opportunities that could drive your outcome</b>.',
    'A flat list hides how needs relate. A <b>tree</b> shows parents, their children (one part of the parent) and siblings (distinct parts of the same parent).',
    'Break big, vague needs into smaller children: problems become <b>solvable</b>, and you can ship value <b>bit by bit</b>.',
    'Top branches = <b>distinct moments</b> in the customer’s experience, taken from your experience map or your interview drawings.',
    'Add a note only if it’s a <b>need, not a solution</b>, it came up in <b>more than one interview</b>, and it could <b>drive the outcome</b>.',
    'Per branch: group similar notes, merge duplicates, add parents, ladder up to the moment. Then the next branch.',
    '<b>Just enough</b> structure. Revisit and reshape it as you learn.',
    'Traps: company’s view, vertical stacks, two parents, vague themes, solutions in disguise, feelings instead of causes.'
  ],
  steps:[
/* ---------- PART 1: WHY MAP IT ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">After ten customer interviews, Fernway’s trio has 60 sticky notes of customer needs. What should they do first?</h1>');
  L.mc(L.card,['Fix the need they heard most recently','Lay them all out and sort them first'],1,
   'Right. Before you can pick the best need to work on, you have to see them all together. This lesson shows how to sort them.',
   'The most recent need is just the loudest in memory, not the most important. Lay them all out first, then you can compare. This lesson shows how.');}},
{part:0,src:'Chapter 6 · The Power of Opportunity Mapping',run(L){
  L.h(L.kick('learn','Why map at all?')+'<h1 class="q">Every customer story is full of gaps</h1>'+
   L.prose('In interviews, customers describe gaps between what they expected and what actually happened. Each gap is an '+L.g('opportunity','opportunity')+'. One story can hold dozens. You could work your whole career and never fill them all. That’s why digital products are never finished.')+
   L.flow([['chat','Stories','from interviews'],['layers','Dozens of needs','pains, needs, desires'],['target','The ones that matter','could drive the outcome']])+
   L.prose('Teams that care about customers want to fix every pain they hear. But the job is narrower: address the opportunities that drive <b>your outcome</b>. That’s how you help customers <i>and</i> the business.')+
   L.note('Finding the best path to an outcome is an '+L.g('ill-structured','ill-structured problem')+'. Mapping the opportunities gives it a structure before you try to solve it.','map'));
  L.done();}},
{part:0,src:'Chapter 6 · opening story, summarized',run(L){
  L.h(L.kick('ex','A real story from the book')+'<h1 class="q">A travel company maps its way into a new market in a few weeks</h1>');
  L.beats(L.card,[
   ['The shock','March 2020. Most customers of Seera Group, a travel company, live in Saudi Arabia. Borders close and hotel bookings drop off overnight.'],
   ['The signal','Ahmed Guijou’s team notices some customers booking <i>Istrahas</i> instead: large local properties with a pool and barbecue, rented for the day to meet family and friends. Earlier interviews had already turned these up.'],
   ['The flood','They have few Istrahas on offer, so they start interviewing hosts and guests. They hear countless needs on both sides.'],
   ['The map','Instead of drowning, they map each group’s needs on its own tree. For a few weeks they collect and group similar needs until patterns appear. The structure keeps changing with each interview.'],
   ['The payoff','They step back: where do host and guest needs overlap? Where are competitors strong, and where are the gaps? What are we already good at? Within weeks they have a new market and a strategy for it.']],
   'Mapping turned a flood of needs into a picture the team could make decisions from.');}},
{part:0,src:'Chapter 6 · The Power of Opportunity Mapping',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Sam tells Dev they wish every recipe came with a wine pairing. Sam clearly means it. What decides if it belongs on Fernway’s map?</h1>');
  L.mc(L.card,['Whether it could get more meals cooked','Whether it is a genuine customer need','Whether a rival app already offers it'],0,
   'Fernway’s outcome is more delivered meals cooked. Real needs are endless, so only the ones that could move the outcome go on this map.',
   'Being a real need is required, but it’s not enough: real needs are endless. And rivals aren’t the test here. The question is whether addressing it could drive more meals cooked.');}},
{part:0,src:'Chapter 6 · The Power of Opportunity Mapping',pts:4,run(L){
  L.h(L.kick('pr','On the map or not?')+'<h1 class="q">Fernway’s outcome is more delivered meals cooked each week. Which of these real needs could drive it?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Could drive it','Not really'],[
   ['“I don’t know what to cook first when the box arrives.”',0,'Knowing what to cook first means fewer meals left to spoil.'],
   ['“I want to pay with a different card.”',1,'A real billing need, but it doesn’t change whether meals get cooked.'],
   ['“After a late shift I’m too tired to cook.”',0,'Maya’s problem leads straight to uncooked meals.'],
   ['“I want to send a gift box to my sister.”',1,'It might bring new sign-ups, but it doesn’t get delivered meals cooked.']],
   'All four are real needs. Only the ones linked to the outcome go on this team’s map.');}},

/* ---------- PART 2: TREES, NOT LISTS ---------- */
{part:1,src:'Chapter 6 · Taming Opportunity Backlogs',run(L){
  L.h(L.kick('learn','Why a ranked list breaks down')+'<h1 class="q">Opportunities come in different shapes and sizes</h1>'+
   L.prose('Some teams keep an '+L.g('opp-backlog','opportunity backlog')+': a ranked list of customer needs, like a feature backlog. That beats working on one need at a time. But try ranking these Fernway notes:')+
   L.list([['layers','One hides inside another','“Ingredients go bad” and “The herbs wilt in two days.” Wilting herbs is one reason food goes bad, but not the only one.'],
     ['scale','Alike, but not the same','“I can’t cook after a night shift” and “I can’t cook after a late office day.” One need? Maybe. But the details of each evening differ.'],
     ['compass','Big next to small','“I don’t know if I’ll like this recipe” feels huge. “How spicy is this?” feels small. Always pick the easy one? Then when do the hard ones get done?']],1)+
   L.prose('A flat list can’t show how needs relate. A tree can.'));
  L.done();}},
{part:1,src:'Chapter 6 · The Power of Trees',run(L){
  L.h(L.kick('learn','Two relationships')+'<h1 class="q">Parents, children and siblings</h1>'+
   L.prose('<b>Parent and child:</b> a child is one part of its parent. It’s <i>one</i> reason for the parent, not the only reason.')+
   L.prose('<b>Siblings:</b> children of the same parent. They’re alike, but distinct: you can address one without touching the others. Each one fixes <i>part</i> of the parent.')+
   TREE(['Ingredients go bad before I get to them',[['The herbs wilt in two days'],['I forget the fish has to be cooked first'],['I lose track of what’s still in the fridge']],'var(--h1)'])+
   '<p class="small">Fixing the wilting herbs fixes part of the parent, and leaves the fish problem untouched. That’s what makes them siblings.</p>');
  L.done();}},
{part:1,src:'Chapter 6 · The Power of Trees',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">Breaking a huge problem into small ones</h1>');
  L.beats(L.card,[
   ['The big one','Many Fernway customers say: <b>“I don’t know if I’ll like this recipe.”</b> It sounds impossible to fix. “Like” means something different to everyone.'],
   ['Dig in','In interviews, the trio asks how people decide today. The answers differ from person to person.'],
   ['Children appear','Sam judges by cuisine. Ana and Joe check for an ingredient they won’t eat. Maya checks how long it takes. Each way becomes a child: <i>Is this a cuisine I enjoy? Does it have something we won’t eat? Will it take too long tonight?</i>'],
   ['Benefit 1','A problem that looked unsolvable becomes a set of problems the team can actually solve.'],
   ['Benefit 2','They can ship value <b>bit by bit</b>: solve one child completely, then the next. Over time, enough children are solved that the parent is solved too.'],
   ['Bonus','The tree will also make choosing what to work on much faster. That’s the next lesson.']],
   'Big, vague needs become a parent. The different ways people experience it become its children.');}},
{part:1,src:'Chapter 6 · The Power of Trees',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">“I get bored of the same kinds of recipes” and “Every week shows the same three cuisines.” How are they related?</h1>');
  L.mc(L.card,['They are siblings','The same need, reworded','Parent and child'],2,
   'Seeing the same cuisines is one reason for boredom, but not the only one. Recipes could also all use the same cooking methods. So boredom is the parent.',
   'Seeing the same three cuisines is <i>one reason</i> for boredom, not the whole thing. One part of a bigger need = a child of that parent.');}},
{part:1,src:'Chapter 6 · The Power of Trees',pts:1,
 solve:async L=>{for(let i=0;i<3;i++)L.$('#ask').click();},
 run(L){
  const K=[['Maya','“I pick my meals, then my shifts change.”','I pick meals without knowing what my week looks like'],
           ['Sam','“I scroll through 60 recipes to pick four.”','There are too many recipes to scroll through'],
           ['Ana and Joe','“We check every meal for an extra charge.”','I can’t tell which meals cost extra']];
  let k=0;
  L.h(L.kick('pr','See it happen')+'<h1 class="q">“Choosing meals each week is a chore.” Hear from customers and watch the big problem split.</h1>'+
   '<div id="tv"></div><div class="meterrow"><div class="lb">How easy to act on</div><div class="meter"><div id="mt" style="background:var(--ok-strong);width:10%"></div></div></div>'+
   '<div id="said" class="small" style="min-height:22px;margin:4px 0 10px"></div><button class="btn pri" id="ask">'+L.ic('chat')+'Hear from a customer</button><div id="hq"></div>');
  const draw=()=>{L.$('#tv').innerHTML=TREE(['Choosing meals each week is a chore',K.slice(0,k).map(x=>[x[2],[],'var(--ok-line)']),'var(--h1)']);};draw();
  L.$('#ask').onclick=function(){const x=K[k];k++;draw();L.$('#mt').style.width=[10,40,70,95][k]+'%';L.$('#said').innerHTML='<b>'+x[0]+':</b> '+x[1];
    if(k===K.length){this.remove();const q=L.$('#hq');
      q.innerHTML='<h2 class="sub">Dev says flagging meals that cost extra is quick to build, and most customers mentioned it. What should the trio do?</h2>';
      L.mc(q,['Solve that small child now, then the next','Wait until the whole parent can be solved','Merge the three children back into one'],0,
       'Exactly how the book says to deliver value over time: a small, fairly easy child that many customers care about. It doesn’t fix the whole chore, but it fixes one part completely.',
       'Waiting for a full fix delays all value, and merging undoes the useful split. Solve one small child completely, ship it, then move to the next.');}};}},
{part:1,src:'Chapter 6 · The Power of Trees',pts:5,run(L){
  L.h(L.kick('pr','Name the relationship')+'<h1 class="q">For each pair of notes, how are they related?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Parent → child','Siblings','Same need'],[
   ['“I can’t cook after a night shift” · “I can’t cook after a late office day”',1,'Alike, but different situations. Both sit under a parent like “I can’t cook on long workdays.”'],
   ['“Weeknight cooking takes too long” · “Chopping vegetables takes ages”',0,'Chopping is one reason cooking takes long, not the only one.'],
   ['“The portions are too big for one” · “There’s too much food for just me”',2,'Two wordings of one need. Merge them.'],
   ['“The herbs wilt in two days” · “I forget the fish has to be cooked first”',1,'Two distinct reasons ingredients go bad. Fix one, the other remains.'],
   ['“Unpacking the box is a hassle” · “I have to sort ingredients into meal bags”',0,'Sorting is one part of the unpacking hassle.']],
   'Parent → child: one part of a bigger need. Siblings: distinct parts of the same parent. Same need: merge into one note.');}},

/* ---------- PART 3: BUILDING IT ---------- */
{part:2,src:'Chapter 6 · Identifying Distinct Branches',run(L){
  L.h(L.kick('learn','Start with distinct branches')+'<h1 class="q">The top of the tree: key moments in the customer’s experience</h1>'+
   L.prose('Each opportunity should be distinct from every other one. If they overlap, you can’t work on one at a time. Everything gets tangled together.')+
   L.prose('The trick: make the top branches <b>distinct moments in time</b>. For Fernway:')+
   L.flow([['list','Choosing meals','in the app'],['box','Unpacking the box','delivery day'],['cal','Deciding tonight’s meal','each evening'],['bowl','Cooking it','in the kitchen']])+
   L.prose('Where do the moments come from? Either the steps of your experience map, or the moments that keep showing up in your interview drawings, stitched together. Either way, <b>no overlap</b> between moments.'));
  L.done();}},
{part:2,src:'Chapter 6 · Take an Inventory of the Opportunity Space',run(L){
  L.h(L.kick('learn','Take an inventory')+'<h1 class="q">Three questions before a note goes on the tree</h1>'+
   L.prose('Go through your interview snapshots. Don’t add every need you find. Ask:')+
   L.list([['Is it a need, not a solution?','It should be a need, pain or desire from the customer’s side.'],
     ['Did we hear it more than once?','Something unique to one customer can wait.'],
     ['Could it drive our outcome?','If not, it’s not for this tree.']],3)+
   L.prose('Three yeses? Put it under the moment where it happens. If it could live under two moments, it’s too broad. Make it more specific, or split it into one note per moment.')+
   L.note('“The app is hard to use” fits everywhere, so it fits nowhere. Split it: “I can’t find where to swap a meal” (choosing) and “I lose my place in the recipe” (cooking).','pencil'));
  L.done();}},
{part:2,src:'Chapter 6 · Add Structure to Each Branch',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">The trio structures the “Choosing meals” branch</h1>');
  L.beats(L.card,[
   ['Collect','Notes filed under this moment: “I get bored of the same kinds of recipes,” “Every week’s menu looks the same,” “I keep seeing the same three cuisines,” “My shifts change after I’ve picked,” “I don’t know which weeks I’ll be away.”'],
   ['Merge','“Bored of the same recipes” and “Every week looks the same” say the same thing. They merge them into one note.'],
   ['Siblings','“My shifts change” and “I don’t know which weeks I’ll be away” are alike but distinct. They need a parent: “I pick meals without knowing what my week looks like.” Maya actually said it. If nobody had, adding it anyway is fine, since the siblings imply it.'],
   ['Mini-trees','Now there are two mini-trees: boredom (with “same three cuisines” as its child) and planning. Do their parents share a parent? Here, both ladder straight up to the moment “Choosing meals.”'],
   ['Repeat','Then the same steps for “Unpacking the box,” and so on, one branch at a time.']],
   'Group similar notes. Merge duplicates. Give siblings a parent. Keep grouping until everything ladders up to the moment.');}},
{part:2,src:'Chapter 6 · Take an Inventory of the Opportunity Space',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Marco’s note “Ingredients go bad before I get to them” could go under “Unpacking the box” or under “Deciding tonight’s meal.” What should Marco do?</h1>');
  L.mc(L.card,['Put the same note under both branches','Split it into one specific note per moment','Make a new top branch just for this note'],1,
   'A note that fits two moments is too broad. For example: “I don’t know which ingredients spoil first” (unpacking) and “I forget what’s left in the fridge” (deciding).',
   'Branches must not overlap, and the top level is for moments, not needs. A note that fits two moments is too broad: split it into one specific note per moment.');}},
{part:2,src:'Chapter 6 · Take an Inventory of the Opportunity Space',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Add it to the tree?',['Add it','Reframe it first','Leave it off for now'],[
   ['Four customers, Maya among them, say their kids won’t eat spicy food, so those meals sit uncooked.',0,'A need, heard several times, and it blocks meals from being cooked. All three yeses.'],
   ['Several customers ask for “a button that syncs with my calendar.”',1,'That’s a solution. Find the need underneath it, such as not knowing your week when you pick meals.'],
   ['One customer, once, mentions wanting recipes for their air fryer.',2,'Heard in only one interview. If it comes up again, revisit it.'],
   ['Many customers say changing their delivery address is slow.',2,'Real and common, but it doesn’t drive meals cooked. It’s not for this tree.'],
   ['Several customers say “the app is confusing.”',1,'Too broad: it could live under every branch. Ask where in the story it showed up, and write one note per moment.']]);}},
{part:2,src:'Chapter 6 · Add Structure to Each Branch',pts:1,run(L){
  L.h(L.kick('pr','Put in order')+'<h1 class="q">Fernway is building its first tree. Tap the steps in the order the book suggests.</h1>');
  L.order(L.card,['Name the distinct moments','Review interview snapshots','File each note under its moment','Group similar notes in one branch','Add parents up to the moment','Repeat for the next branch'],
   'Branches first, then the inventory, then structure inside one branch at a time.',
   ['top branches','inventory','placing','grouping','laddering up','next']);}},

/* ---------- PART 4: TRAPS ---------- */
{part:3,src:'Chapter 6 · Just Enough Structure',run(L){
  L.h(L.kick('learn','Just enough structure')+'<h1 class="q">Not too quick, not too perfect</h1>'+
   L.prose('Opportunity mapping looks simple, but it takes real thinking. Is each note framed well? Do you know what it means? Could it drive the outcome?')+
   L.lanes([['clock','Too quick','A first tree done in 30 minutes? You’re probably not thinking hard enough.',4],
            ['cycle','Too perfect','Hours spent polishing the perfect tree? Also a mistake.',3]])+
   L.quote('Structure is complicated. It gets done, undone, and redone.','Barbara Tversky, quoted at the start of chapter 6')+
   L.prose('Aim for enough structure to see the big picture, not so much that the detail buries you. Then keep revisiting: notes get reworded, simple ones split into many. That’s normal.'));
  L.done();}},
{part:3,src:'Chapter 6 · Avoid Common Anti-Patterns',run(L){
  L.h(L.kick('learn','Six common traps')+'<h1 class="q">Check your first draft for these</h1>'+
   L.list([['Company’s point of view','No customer says “I wish I had more meal-kit subscriptions.” Ask: did we hear this, or are we wishing we had?'],
     ['Vertical stacks','A parent with one child, which has one child. Either they say the same thing (merge them), or siblings are missing (find them).'],
     ['Two parents','If the top branches are distinct moments, no note should need two parents. It’s too broad: one note per moment.'],
     ['Not specific','Themes and moods like “make it easy” aren’t opportunities. “Swapping a meal takes too many taps” is.'],
     ['Solutions in disguise','Test: is there more than one way to address it? If only one fix fits, it’s a solution request.'],
     ['Feelings, not causes','“I’m stressed” points to an opportunity nearby. You can’t fix a feeling, so capture what causes it.']],4));
  L.done();}},
{part:3,src:'Chapter 6 · Avoid Common Anti-Patterns',pts:6,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Spot the trap',['Company’s point of view','Not specific enough','Solution in disguise','A feeling, not a cause','Too broad: two parents'],[
   ['“Customers want to upgrade to the family plan.”',0,'That’s Fernway’s wish. Would a customer ever say it? Look for what they actually said.'],
   ['“Cooking should feel easier.”',1,'A theme, not a need. Where exactly is it hard? “Recipes take too long on weeknights” is specific.'],
   ['“I wish I could skip a week with one tap.”',2,'Only one fix fits this. Ask what’s underneath, such as “skipping a week takes too many steps.”'],
   ['“I feel stressed every Sunday night.”',3,'A signpost. Dig for the cause: maybe picking meals before knowing the week ahead.'],
   ['“I waste ingredients” sits under both “Unpacking the box” and “Cooking it.”',4,'Make it specific to each moment: one note per moment where the waste happens.'],
   ['“Users need more reasons to open the app.”',0,'That’s what the company wants. No customer wants more reasons to open an app.']]);}},
{part:3,src:'Chapter 6 · Avoid Common Anti-Patterns',pts:1,run(L){
  L.h(L.kick('pr','Fix the stack')+'<h1 class="q">Marco’s draft has a vertical stack. Each note only partly explains the one above it. What should Marco do?</h1>'+
   TREE(['Weeknights are hard for cooking',[['Recipes take too long on weeknights',[['Prep takes too long',[['Chopping takes ages']]]]]],'var(--h1)'])+'<div id="hq"></div>');
  L.mc(L.$('#hq'),['Merge all four into one opportunity','Delete the bottom two notes','Find the missing siblings at each level'],2,
   'Since each child only partly explains its parent, siblings are missing. What else makes prep slow, besides chopping? If unsure, explore it in upcoming interviews.',
   'Merging fits when every note says the same thing in different words. Here each one only partly explains the parent, so siblings are missing. Find them, or explore in upcoming interviews.');}},
{part:3,src:'Chapter 6 · Avoid Common Anti-Patterns',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Maya says: “Just sync it with my shift calendar!” Tap each piece until it’s a real opportunity.</h1>');
  L.sentence(L.card,[['I want calendar sync','Fernway needs my shifts','I pick my meals'],['before I know','right after I check'],['which nights I’ll be cooking','what the box will cost']],[2,0,0],
   [['That’s one solution, and only one fix fits it. It’s a solution in disguise.','That’s the company’s side, not Maya’s.'],['If Maya had already checked, there’d be no problem. The pain is choosing blind.'],['Maya’s pain is about Maya’s schedule, not the price.']],
   'Now many solutions could fit: calendar sync, easy meal swaps, flexible delivery days. An opportunity should have more than one possible solution.');}}
  ]
});
</script>
</body>
</html>
