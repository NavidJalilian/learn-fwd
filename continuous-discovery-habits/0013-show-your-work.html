<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Show Your Work</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0013', title:'Show your work', minutes:19, icon:'eye',
  goals:['Explain why leading with a roadmap starts an opinion battle','Walk a stakeholder down your tree, from outcome to tests','Handle a stakeholder’s idea without shooting it down'],
  parts:['Don’t lead with answers','Walk the tree','Right detail','Their ideas'],
  read:'Read chapter 13 of the book for the full Airship story and the CEO-sized summary.',
  glossary:{
    'stakeholder':'Stakeholder: someone outside the trio who has a say in, or is affected by, what the team builds, like sales, marketing or the CEO.',
    'hippo':'HiPPO: the Highest Paid Person’s Opinion, which tends to win any argument about what to build.',
    'curse-knowledge':'Curse of knowledge: once you know something, it’s hard to remember what it was like not to know it.',
    'target-opp':'Target opportunity: the one customer need the team chose to work on next.',
    'idea-backlog':'Idea backlog: a list of ideas to consider later. Not the same as the list of work the engineers will build.'
  },
  cheatsheet:[
    'Leading with your roadmap invites an <b>opinion battle</b>, and the most senior opinion (the HiPPO) usually wins.',
    '<b>Show your work</b>: walk stakeholders down the tree, from the outcome to the opportunities, your choices, the solutions, assumptions and tests.',
    'At each step, <b>ask</b>: did we miss anything? Would you have decided differently? Capture what they add.',
    'Make sure they truly understand the <b>target opportunity</b> before you show any solution.',
    'Share along the way, not just at the end. Present <b>options</b> and choose together, so they co-create with you.',
    'Be a <b>smart filter</b>: tailor the detail to each person, but even a busy CEO gets outcome, top opportunities, the pick, the solution and a test result.',
    'Don’t shoot down their ideas. Show where the idea fits on the tree, or map its assumptions together.',
    'Skip the ideological battle. Focus on the decision at hand and choose your battles.'
  ],
  steps:[
/* ---------- PART 1: DON'T LEAD WITH ANSWERS ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Priya shows the CEO a finished feature roadmap. The CEO says, “I’d build a wine-pairing feature first.” If it comes down to Priya’s opinion versus the CEO’s, who usually wins?</h1>');
  L.mc(L.card,['Whoever has the better idea','The CEO, as the more senior person'],1,
   'When the talk is about which features to build, it’s opinion against opinion, and rank tends to win. This lesson shows how to avoid that fight.',
   'In theory the better idea wins. In practice, when it’s opinion against opinion, the more senior person usually does. This lesson shows a better way.');}},
{part:0,src:'Chapter 13 · opening story',run(L){
  L.h(L.kick('ex','A real story from the book')+'<h1 class="q">Great discovery nearly wasted: a sales team says no</h1>');
  L.beats(L.card,[
   ['The ask','At Airship, a marketing-software company, sales prospects kept asking for a <b>journey builder</b>: a tool to plan a series of messages over time. Rivals had one.'],
   ['The discovery','Lisa Orr’s team interviewed customers who used rivals’ builders. They were so complex that many marketers couldn’t get started, and the ones who did made messy, repeated journeys.'],
   ['The solution','The team mapped the opportunities, tested ideas quickly, and found a different, simpler solution. A chance to stand out, not just catch up.'],
   ['The roadblock','When they shared it, the sales team pushed back. They wanted to sell what prospects asked for: a copy of the rivals’ tool.'],
   ['The rescue','Leadership allowed a one-month beta with a few customers. Customers used it, sales came round, and the product launched with great success.']],
   'Good discovery can go to waste if '+L.g('stakeholder','stakeholders')+' aren’t on board. You have to bring them along.');}},
{part:0,src:'Chapter 13 · Don’t Jump Straight to Your Conclusions',run(L){
  L.h(L.kick('learn','Why conclusions backfire')+'<h1 class="q">A roadmap invites an opinion battle you can’t win</h1>'+
   L.prose('Before a stakeholder meeting, we tend to prepare our <b>conclusions</b>: the roadmap, the release plan, the backlog. Often that’s exactly what stakeholders ask for.')+
   L.prose('But everyone has opinions about features. Start with solutions, and stakeholders answer with their own preferences, which aren’t based on discovery. Now it’s your opinion against theirs. If they’re more senior, theirs wins. That’s the '+L.g('hippo','HiPPO')+'.')+
   L.lanes([['map','Show conclusions','“Here’s our roadmap.” The talk turns to which features each person likes.',1],
            ['tree','Show your work','“Here’s how we got here.” The talk turns to customers and evidence.',2]])+
   '<p class="small" style="margin-top:10px">The book notes that many trios complain about the HiPPO without seeing their own part in creating the fight.</p>');
  L.done();}},
{part:0,src:'Chapter 13 · Don’t Jump Straight to Your Conclusions',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Why does opening with the roadmap tend to hand the decision to the most senior person?</h1>');
  L.mc(L.card,['It turns the talk into opinions about features','Roadmaps are always too long to read in a meeting','Senior people have usually seen the roadmap before'],0,
   'A roadmap is a conclusion without the journey. Everyone has a preference about features, so it becomes opinion against opinion.',
   'Length and timing aren’t the issue. A roadmap skips the journey, so everyone answers with feature preferences, and rank decides.');}},
{part:0,src:'Chapter 13 · Slow Down and Show Your Work',pts:1,
 solve:async L=>{const g=L.$('#op').children;g[0].click();g[1].click();},
 run(L){
  const O=[['Open with the roadmap','“Q3: pre-chopped ingredients, then a Sunday batch-chop guide, then fewer-chop recipes.”','CEO: “Why not wine pairings? Customers love wine.” Twenty minutes of debate about features. The CEO’s pick goes on the list.'],
           ['Open with the outcome','“Our goal is more meals cooked each week. Has anything changed since we agreed on it?” Then the tree, step by step.','CEO: “Still the goal.” By the time Priya reaches “Chopping takes ages” and Maya’s story, the CEO asks which idea tested best.']];const seen=new Set();
  L.h(L.kick('pr','Toggle and compare')+'<h1 class="q">Same meeting, same CEO, two openings. Try both.</h1><div id="op"></div>'+
   '<div style="background:var(--soft);border-radius:16px;padding:14px;margin:8px 0 6px;min-height:130px"><div class="small" id="said">Choose an opening above.</div><div id="resp" style="margin-top:10px"></div></div><div id="oq"></div>');
  O.forEach((o,j)=>{const b=document.createElement('button');b.className='chip';b.innerHTML=L.ic(j?'tree':'map')+o[0];b.onclick=()=>{[...L.$('#op').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(j);
    L.$('#said').innerHTML='<b>Priya:</b> '+o[1];L.$('#resp').innerHTML='<span style="color:'+(j?'var(--ok)':'var(--no)')+'">'+o[2]+'</span>';
    if(seen.size===2&&!L.$('#oq').innerHTML){const q=L.$('#oq');q.innerHTML='<h2 class="sub">Why did the second opening go better?</h2>';
      L.mc(q,['The CEO happened to be in a better mood','It set the context before any solution came up'],1,
       'Starting at the outcome and walking down the tree framed the talk around customers. By the time solutions came up, the CEO was judging them against Maya’s need.',
       'Mood has nothing to do with it. Starting with the outcome set the context, so solutions were judged against the customer need, not personal taste.');}};L.$('#op').appendChild(b);});}},

/* ---------- PART 2: WALK THE TREE ---------- */
{part:1,src:'Chapter 13 · Slow Down and Show Your Work',run(L){
  L.h(L.kick('learn','How to show your work')+'<h1 class="q">Walk them down your tree, and ask at every step</h1>'+
   L.list([['target','The outcome','Remind them of it. Ask if anything has changed. This sets the scope.'],
     ['map','The opportunity space','Show the top-level opportunities. Go deeper only where they ask. Did we miss any?'],
     ['compass','How you chose','Walk through each decision on the tree. Would they have chosen differently?'],
     ['people','The '+L.g('target-opp','target opportunity'),'Use interview snapshots so they feel the customer’s need. Answer every question.'],
     ['bulb','The solutions','Show all your ideas, then your three. Any ideas of their own? Would they pick a different three?'],
     ['flask','Assumptions and tests','Share story maps, assumption lists and maps, and tests or test plans. Ask them to add to each.']],2)+
   '<p class="small" style="margin-top:10px">Then repeat, again and again. Capture what they add: you can check new opportunities in future interviews.</p>');
  L.done();}},
{part:1,src:'Chapter 13 · Slow Down and Show Your Work',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">Priya walks the head of product down Fernway’s tree</h1>');
  L.beats(L.card,[
   ['Outcome','“We’re still aiming for more meals cooked each week. Anything changed?” The head of product says the baby-food box launches soon, but the goal stands.'],
   ['Opportunities','Priya shows four moments: choosing meals, unpacking, deciding tonight’s meal, cooking it. The head of product adds a need they’ve heard: “Kids reject new recipes.” Priya writes it down to check in interviews.'],
   ['Choices','Priya explains why the trio went down “Cooking it” to “Recipes take too long,” then to “Chopping takes ages.” Would the head of product have chosen differently? No.'],
   ['The target','Priya shares Maya’s snapshot and quote, “Shift days eat my dinner plans.” The head of product asks two questions. Only now do solutions come up.'],
   ['Solutions','Pre-chopped ingredients, fewer-chop recipes, a Sunday batch-chop guide. The head of product suggests buying pre-cut vegetables from a local supplier. Priya considers adding it to the set.']],
   'Each step ends with a question. The stakeholder isn’t judging a finished plan. They’re helping build it.');}},
{part:1,src:'Chapter 13 · Slow Down and Show Your Work',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Why does the book call explaining the target opportunity a critical step, before any solution?</h1>');
  L.mc(L.card,['It shortens the meeting by skipping the debate','It gives stakeholders a basis for judging ideas','It proves the trio did enough interviews'],1,
   'Once they understand the customer need, solutions get judged against it, not against personal taste.',
   'The point isn’t speed or proof of effort. Understanding the need gives everyone a shared basis for judging solutions, which moves the talk away from opinions.');}},
{part:1,src:'Chapter 13 · Slow Down and Show Your Work',pts:1,run(L){
  L.h(L.kick('pr','Put it in order')+'<h1 class="q">Marco is showing the trio’s work to the head of marketing. Put Marco’s walk-through in order.</h1>');
  L.order(L.card,['Confirm the outcome still stands','Show the top-level opportunities','Explain how they chose the target','Make the target need vivid','Show the ideas and the chosen three','Share assumptions and test results'],
   'From the top of the tree down: the outcome sets the scope, the opportunities and choices set the context, and only then come solutions and tests.');}},
{part:1,src:'Chapter 13 · Slow Down and Show Your Work',pts:6,run(L){
  L.h(L.kick('pr','Which question, when?')+'<h1 class="q">Sort each question Priya asks by the part of the tree being shown.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Outcome & needs','Solutions','Assumptions & tests'],[
   ['“Has anything changed since we agreed on this goal?”',0,'This starts the walk and sets the scope.'],
   ['“Did we miss any customer needs you’ve heard about?”',0,'Stakeholders may know opportunities the trio missed.'],
   ['“Do you have ideas of your own for this need?”',1,'Ask for their ideas before showing your three.'],
   ['“Would you have picked a different set of three?”',1,'Stay open: their ideas can make your set more diverse.'],
   ['“What else must be true for this idea to work?”',2,'Their expertise helps catch blind spots in your assumption list.'],
   ['“How would you have ranked these risks?”',2,'Ask if they’d prioritize the assumptions differently, then adjust.']],
   'Every step of the walk ends with an invitation. That’s how showing turns into co-creating.');}},

/* ---------- PART 3: RIGHT DETAIL ---------- */
{part:2,src:'Chapter 13 · Generate and Evaluate Options',run(L){
  L.h(L.kick('learn','Options, not answers')+'<h1 class="q">Invite stakeholders to choose the path with you</h1>'+
   L.prose('A roadmap says: <i>here is the path</i>. Showing your work says: <i>here are the paths we could take; help us choose</i>. You’re generating and evaluating <b>options</b> together.')+
   L.flow([['map','Tree, maps, story maps','your visuals'],['compass','Possible paths','options'],['people','Chosen together','buy-in']])+
   L.prose('And it isn’t a one-time show. Share along the way, not just at the end. Some stakeholders want details every week, others the highlights each month. Adapt to them. Even when they ask for outputs, show the work behind them.'));
  L.done();}},
{part:2,src:'Chapter 13 · Common Anti-Patterns',run(L){
  L.h(L.kick('learn','Two opposite mistakes')+'<h1 class="q">Too little showing, or too much</h1>'+
   L.list([['eye','Telling instead of showing','You’re proud and excited, so you rush to your conclusions. Blame the '+L.g('curse-knowledge','curse of knowledge')+': your roadmap feels obvious to you, but not to them. Slow down, start at the beginning, and give them time to reach the same conclusion.'],
     ['layers','Drowning them in detail','Weekly interviews and tests produce more than a busy person can take in. Be a <b>smart filter</b>: what does this person need to know?']],3)+
   L.note('Less detail still means showing your work. Even for the CEO: the outcome, the top two or three opportunities, why you chose one, your top solution, and one or two test results.','info'));
  L.done();}},
{part:2,src:'Chapter 13 · Common Anti-Patterns',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Dev can’t see why the head of sales doesn’t get it: “Pre-chopped is obviously right!” What is going on?</h1>');
  L.mc(L.card,['The head of sales isn’t paying attention','Dev has the curse of knowledge','Pre-chopped is probably a weak idea'],1,
   'After weeks of tests, the answer feels obvious to Dev. The head of sales hasn’t seen that journey. Walk them through it.',
   'It’s not about attention or the idea itself. Dev knows so much that the conclusion feels obvious, and forgets the head of sales never saw the work.');}},
{part:2,src:'Chapter 13 · Common Anti-Patterns',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Good update or trap?',['Good update','Telling, not showing','Too much detail'],[
   ['To the CEO: “Goal: meals cooked. Top needs: time, spoilage, planning. We chose time because… Pre-chopped tested best.”',0,'Short, but it still shows the path from outcome to evidence.'],
   ['To the head of marketing: “Here’s our Q3 roadmap. Any questions?”',1,'A bare conclusion. It invites a debate about features.'],
   ['To the CEO: forty interview recordings and every test spreadsheet.',2,'A busy CEO needs the highlights, not everything.'],
   ['To the head of product, who loves the detail: a weekly walk through what changed on the tree.',0,'This stakeholder wants weekly detail, so that’s the right fit.'],
   ['To sales: “Trust us, we tested it. Pre-chopped is the answer.”',1,'Telling them the answer skips the journey that would convince them.']]);}},
{part:2,src:'Chapter 13 · Common Anti-Patterns',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">The CEO has two minutes. Tap each piece to build Priya’s update.</h1>');
  L.sentence(L.card,[['Start with the outcome,','Start with the launch date,','Start with the roadmap,'],['then the top three needs,','then every interview note,'],['why we chose one,','who pushed for which feature,'],['and our best test result.','and all thirty test results.']],[0,0,0,0],
   [['A launch date is an output. Start with the goal you’re driving.','The roadmap is the conclusion. Start with the goal instead.'],['Too much for a CEO. Highlight just the top two or three opportunities.'],['That turns it into a debate about people. Explain the reasoning behind your choice.'],['Pick one or two results that support the decision. Thirty is overwhelming.']],
   'Short, but it still shows the work: outcome, opportunities, the choice and the evidence.');}},

/* ---------- PART 4: THEIR IDEAS ---------- */
{part:3,src:'Chapter 13 · Common Anti-Patterns',run(L){
  L.h(L.kick('learn','When a stakeholder brings an idea')+'<h1 class="q">Don’t shoot it down. Find where it fits.</h1>'+
   L.prose('Each test you run becomes a building block, so you can judge new ideas fast. Stakeholders don’t share those blocks. Telling them why their idea won’t work is the fastest way to discourage them.')+
   L.tiers([['target','A different outcome?','It may suit their goal, just not yours right now. Say so.','',false],
            ['map','A different opportunity?','“That idea has promise. We’ll consider it when we address that need.” Add it to your tree or '+L.g('idea-backlog','idea backlog')+'.','',false],
            ['people','Your target opportunity?','Consider it seriously. If it rests on a shaky assumption, story map it <b>together</b>, list assumptions together, then share what your tests found.','',true,'Let them decide']]));
  L.done();}},
{part:3,src:'Chapter 13 · Common Anti-Patterns',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">The CEO suggests a knife-skills video for “Chopping takes ages”</h1>');
  L.beats(L.card,[
   ['The idea','The CEO: “Let’s teach people to chop faster with a video.” Dev’s first thought: nobody will watch it. Dev stays quiet.'],
   ['Where it fits','It aims at the trio’s own target, “Chopping takes ages,” so it deserves a real look.'],
   ['Map it together','Priya and the CEO sketch the steps: get the video, find time to watch, practice, chop faster at dinner.'],
   ['Assumptions together','The CEO spots one: “People will watch a video before a weeknight meal.” Priya shares what they learned: on weeknights, customers like Maya cook between other jobs and skip extras.'],
   ['The CEO’s call','The CEO concludes the video is better as an extra for weekends. No argument needed.']],
   'Same conclusion Dev had, but the CEO reached it themself, and trusts it.');}},
{part:3,src:'Chapter 13 · Common Anti-Patterns',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">The head of marketing pitches wine pairings again. It doesn’t touch the trio’s target, “Chopping takes ages.” What should Priya say?</h1>');
  L.mc(L.card,['“Wine pairings won’t help cook meals, so no.”','“Let’s drop our target and test wine pairings.”','“Promising. We’ll consider it for that need later.”'],2,
   'It may fit another opportunity, or another outcome. Capture it on the tree or in the idea backlog, without a fight.',
   'Shooting it down discourages them, and dropping the target throws away your discovery. Note where the idea fits and capture it for later.');}},
{part:3,src:'Chapter 13 · Common Anti-Patterns',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Where does the idea fit?',['A different outcome','A different opportunity','Our target opportunity'],[
   ['Head of sales: “A referral discount would bring in new sign-ups.”',0,'Sign-ups are a different goal from meals cooked. It might fit their outcome, not yours right now.'],
   ['Head of product: “Sell pre-cut vegetables in bigger bags.”',2,'It speaks to “Chopping takes ages.” Consider it, and map its assumptions together if needed.'],
   ['Head of marketing: “Add a weekly mystery cuisine to fight boredom.”',1,'It addresses “I get bored of the same kinds of recipes.” Capture it for when you take on that need.'],
   ['Support lead: “A freezer guide so food doesn’t spoil.”',1,'That’s about “Ingredients go bad.” A good idea for a different branch.']]);}},
{part:3,src:'Chapter 13 · Common Anti-Patterns',run(L){
  L.h(L.kick('learn','The last trap')+'<h1 class="q">Don’t fight the war. Make the decision.</h1>'+
   L.prose('However good your discovery, a senior stakeholder will sometimes tell you to do it their way. That’s their right. What you control is your response.')+
   L.note('If you hear yourself say, “This is the way it’s supposed to be done,” take a breath and step away.','alert')+
   L.prose('You won’t change someone’s worldview in one meeting, and telling them they’re doing it wrong won’t help. Instead, focus on the <b>decision at hand</b> and the best result you can get with what you have. Show the benefits of discovery where you can. Choose your battles.'));
  L.done();}},
{part:3,src:'Chapter 13 · Common Anti-Patterns',pts:1,run(L){
  L.h(L.kick('pr','Final check')+'<h1 class="q">The CEO insists on launching wine pairings this quarter, untested. Marco is furious. What’s the best move for the trio?</h1>');
  L.mc(L.card,['Make this launch as good as possible, and show discovery’s value elsewhere','Explain in the meeting that this isn’t how discovery is supposed to work','Refuse to build it until the CEO agrees to run tests first'],0,
   'Focus on the decision at hand: do the best you can with it, and keep showing the benefits of working this way where you can.',
   'An argument about the “right way” won’t change the CEO’s mind in one meeting, and refusing makes it a battle you can’t win. Focus on the decision at hand.');}}
  ]
});
</script>
</body>
</html>
