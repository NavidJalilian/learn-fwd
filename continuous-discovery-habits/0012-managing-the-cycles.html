<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Managing the Cycles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0012', title:'Managing the cycles', minutes:19, icon:'cycle',
  goals:['Loop back to an earlier habit when a test surprises you','Tell an opportunity for now from one for later','Avoid the four traps that stall discovery'],
  parts:['Loop back','Now or later','Dig and keep going','Traps'],
  read:'Read chapter 12 of the book for the four team stories in full.',
  glossary:{
    'target-opp':'Target opportunity: the one customer need the team chose to work on next.',
    'sub-opp':'Sub-opportunity: a smaller, more specific need that sits under a bigger one on the tree.',
    'value-prop':'Value proposition: the main reason customers choose a company over its rivals.',
    'quick-win':'Quick win: a change that delivers some value right away, with little effort.'
  },
  cheatsheet:[
    'Discovery is a <b>winding loop</b>, not a straight line. Most of the work is noticing surprises and looping back to an earlier habit.',
    'A failed round of tests is cheap. The fruit of discovery is often the time saved by <b>not</b> building something.',
    'Weekly interviews and a living tree mean a dropped opportunity doesn’t send you back to zero.',
    'Some opportunities fit <b>now</b>; some need more investment and belong <b>later</b>. Work a short-term one while you lay groundwork for the hard one.',
    'When a customer need clashes with a business need, ask how to <b>reconcile</b> them instead of giving up on either.',
    '<b>Small changes add up.</b> Solving sub-opportunities one at a time is how parent opportunities, and outcomes, get solved.',
    'Traps: overcommitting to an opportunity, avoiding hard ones, shallow conclusions, giving up too early.'
  ],
  steps:[
/* ---------- PART 1: LOOP BACK ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">A team spends one week testing ideas for a customer need. The tests show customers don’t want help with it. Was the week wasted?</h1>');
  L.mc(L.card,['Yes, a full week went into nothing useful','No, it may have saved months of building'],1,
   'One week of tests is cheap next to months spent building the wrong feature. This lesson is about handling surprises like this one.',
   'The tests produced a clear answer: don’t build this now. Finding that out in one week, not after months of building, is a win.');}},
{part:0,src:'Chapter 12 · opening',run(L){
  L.h(L.kick('learn','A loop, not a line')+'<h1 class="q">The habits look like a straight line. Real discovery isn’t.</h1>'+
   L.prose('So far the course went step by step: set an outcome, interview, map the opportunities, pick one, generate ideas, find assumptions, test them, measure impact. It’s tempting to think following the steps in order produces a product customers love.')+
   L.flow([['target','Outcome','',''],['map','Opportunities','',''],['bulb','Solutions','',''],['flask','Tests','','']])+
   L.prose('In practice the path twists. A test surprises you, and you have to stop and <b>loop back</b> to an earlier step. The book says most of discovery isn’t following the process. It’s <b>managing the cycles</b>: noticing the surprise and choosing where to go back to.')+
   L.note('The same habits that got you into the surprise are the ones that get you out.','cycle'));
  L.done();}},
{part:0,src:'Chapter 12 · Simply Business: Not All Opportunities Need Solutions',run(L){
  L.h(L.kick('ex','A real story from the book')+'<h1 class="q">An insurance company learns a top pain point isn’t theirs to solve</h1>');
  L.beats(L.card,[
   ['The need','A product team at Simply Business, a UK insurer for small businesses, kept hearing the same pain in interviews: <b>clients pay late</b>. Market research and government data agreed.'],
   ['The pick','Choosing it as the '+L.g('target-opp','target opportunity')+' felt obvious. They chose three different ideas: articles on preventing late payments, discounts for paying early, and a service that collects payments for you.'],
   ['The tests','Within a week they had three quick tests running: articles placed on the account page, and short summaries of the other two ideas shown to small-business owners in usability tests.'],
   ['The surprise','Few people read the articles. In the videos, most people didn’t understand the other two offers, and most said they didn’t want an outside company involved. Chasing their own clients felt personal.'],
   ['The loop back','The need was real, but not one they could address any time soon. Because they interviewed every week and kept their tree up to date, they picked a new target the next day and used interviews already on the calendar to learn about it.']],
   'All the data pointed one way. The tests showed another. The team lost one week, not months, and moved on quickly.');}},
{part:0,src:'Chapter 12 · Simply Business: Not All Opportunities Need Solutions',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Why could Simply Business switch to a new opportunity so fast?</h1>');
  L.mc(L.card,['Their market research had already ranked the next need','They kept interviewing weekly and their tree kept growing','Leadership had given them a backup goal for the quarter'],1,
   'Their tree evolved as they tested, and their interviews were already booked, so a new target didn’t mean starting from scratch.',
   'Research and leadership weren’t what saved them. Weekly interviews and a tree that kept growing meant the next opportunity was already visible.');}},
{part:0,src:'Chapter 12 · Simply Business: Not All Opportunities Need Solutions',pts:1,
 solve:async L=>{L.$('#kill').click();},
 run(L){
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Two Fernway-style teams both target “Recipes need tools I don’t own.” On Tuesday the tests say: customers don’t want help with this. Press the button.</h1>'+
   L.lanes([['cal','Team Weekly','Interviews every week. Tree updated as they test.<div class="res" id="la"></div>',2],
            ['clock','Team Big Study','One big research study a year. Tree drawn once.<div class="res" id="lb"></div>',1]])+
   '<button class="btn pri" id="kill" style="margin-top:14px">'+L.ic('x')+'Drop the opportunity</button><div id="hq"></div>');
  L.$('#kill').onclick=function(){this.remove();
    L.$('#la').innerHTML='<span style="color:var(--ok)">Wed: picks the next opportunity from the tree. Thu: asks about it in interviews already booked.</span>';
    L.$('#lb').innerHTML='<span style="color:var(--no)">Back to square one. Needs weeks to recruit people and plan new research.</span>';
    const q=L.$('#hq');q.innerHTML='<h2 class="sub">What made the difference?</h2>';
    L.mc(q,['A habit that keeps learning going all the time','A smarter choice of the first opportunity'],0,
     'Both teams picked the same opportunity and both were surprised. Only the team with a weekly habit could change course in days.',
     'Both teams picked the same opportunity, and both got the same surprise. What differed was the weekly habit that kept learning going.');};}},
{part:0,src:'Chapter 12 · Simply Business: Not All Opportunities Need Solutions',pts:1,run(L){
  L.h(L.kick('pr','Put it in order')+'<h1 class="q">Fernway’s tests show customers don’t want help with missing kitchen tools. Put the trio’s next moves in order.</h1>');
  L.order(L.card,['Look honestly at the test results','Agree this need isn’t the one for right now','Choose a new target on the tree','Ask about it in this week’s interviews'],
   'Notice the surprise, accept it, loop back to choosing an opportunity, and use your ongoing interviews to learn about the new one.',['1','2','3','4']);}},

/* ---------- PART 2: NOW OR LATER ---------- */
{part:1,src:'Chapter 12 · CarMax: The Importance of Now, Next, Future',run(L){
  L.h(L.kick('ex','A real story from the book')+'<h1 class="q">A car retailer finds an opportunity it can’t fully solve yet</h1>');
  L.beats(L.card,[
   ['The need','CarMax’s team chose the target: <i>“I want to feel confident that this car is in good condition.”</i> Rivals had started marking every ding and scratch on their cars’ photos.'],
   ['The twist','CarMax repairs most of those dings before selling. That repair work is its '+L.g('value-prop','value proposition')+'. Copying rivals would show nothing, and would buyers get why?'],
   ['Test one','Do looks really matter? They showed two versions of the same car: one with small flaws and $1,000 cheaper, one repaired and $1,000 more. People would pay more for the repaired car.'],
   ['Test two','The quick route: text on the photos about CarMax’s general repair process. It built some trust, but after several tries it never hit the high bar they’d set. Buyers wanted details on <b>that specific car</b>.'],
   ['The call','Car-by-car details needed a big effort from several teams. So they pushed the opportunity to the future, chose a new short-term target, and kept making the case. Today they show which parts were replaced on each car.']],
   'Some opportunities fit right now. Others need more investment. Work a near-term one while you lay the groundwork for the harder one.');}},
{part:1,src:'Chapter 12 · CarMax: The Importance of Now, Next, Future',run(L){
  L.h(L.kick('learn','Now, next, future')+'<h1 class="q">Timing is part of choosing an opportunity</h1>'+
   L.prose('It’s easy to assume you’ll work through every opportunity on your tree in time. But some fit <b>right now</b>, and some only fit <b>later</b>, once bigger investments are in place.')+
   L.lanes([['check','Fits now','Your trio can make real progress on it with what you have today.',2],
            ['clock','Fits later','Truly solving it needs a big effort, often from several teams.',3]])+
   L.prose('The book praises CarMax for doing both: they made short-term progress on a new target <i>and</i> laid groundwork for the hard one. Many teams avoid hard problems and stick to '+L.g('quick-win','quick wins')+'. Balance the two instead.'));
  L.done();}},
{part:1,src:'Chapter 12 · CarMax: The Importance of Now, Next, Future',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">CarMax’s general message helped, but buyers wanted car-by-car details. What did the team do?</h1>');
  L.mc(L.card,['Kept tweaking the photo text until it passed','Dropped the need and never returned to it','Took a new target and built the case for later'],2,
   'They chose a new short-term target and kept making the case for car-specific solutions, which they later built.',
   'They neither kept tweaking nor gave up for good. They picked a new short-term target and built the case for the bigger, car-specific work.');}},
{part:1,src:'Chapter 12 · CarMax: The Importance of Now, Next, Future',pts:5,run(L){
  L.h(L.kick('pr','Now or later?')+'<h1 class="q">Fernway targets “Ingredients go bad before I get to them.” Sort each idea: can the trio do it now, or does it need a bigger effort?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Fits now','Fits later'],[
   ['Spoilage reminders that say which ingredient to cook first',0,'Dev can build reminders in the app. The trio controls it.'],
   ['A second delivery each week, so food arrives fresher',1,'That needs new delivery routes and the logistics team. A bigger effort.'],
   ['Reordering recipes so meals with fresh fish come first',0,'Recipe order is product work the trio can change this week.'],
   ['New packaging that keeps herbs fresh for ten days',1,'Packaging needs suppliers, testing and money. It belongs later.'],
   ['A “cook these first” label on the in-app menu',0,'A small change in the app. The trio can test it right away.']],
   'Work the “now” ideas to make progress this quarter, and start building the case for the “later” ones with other teams.');}},
{part:1,src:'Chapter 12 · Avoid These Common Anti-Patterns',pts:1,run(L){
  L.h(L.kick('pr','What next?')+'<h1 class="q">After three rounds, Fernway’s spoilage reminders help a little but never reach the bar the trio set. Ana and Joe say what they really need is food that stays fresh longer. What should Priya do?</h1>');
  L.mc(L.card,['Run a fourth and fifth round of reminder tests','Pick a new near-term target and raise packaging with ops','Tell the team spoilage is not a real need after all'],1,
   'Like CarMax, they’ve done what they can for now. Choose a new target for this quarter and start the case for the bigger fix.',
   'More reminder rounds is overcommitting, and calling the need fake ignores what Ana and Joe said. Move to a near-term target and lay groundwork for the hard fix.');}},

/* ---------- PART 3: DIG AND KEEP GOING ---------- */
{part:2,src:'Chapter 12 · FCSAmerica: Balancing Customer Value With Business Needs',run(L){
  L.h(L.kick('ex','A real story from the book')+'<h1 class="q">A farm lender digs past a shallow answer</h1>');
  L.beats(L.card,[
   ['The goal','Farm Credit Services of America lends large sums to farmers and ranchers. Carl Horne’s team was asked to get customers engaging digitally, through the website.'],
   ['The worry','Customers said they valued their trusted loan officer. Would they really trade that relationship for a website?'],
   ['The clue','Interviews showed many already researched online how much land they could afford. That gave an opportunity: <i>“What can I afford?”</i>'],
   ['The test','They built an online calculator and offered live chat next to it. Customers closed the browser rather than chat. Changing words and pictures didn’t help.'],
   ['The insight','The human touch mattered later in the process, not at this early step. This need could be solved online. The calculator grew into a program where farmers apply for loans online.']],
   'They didn’t drop their digital goal when customers praised the phone. They found the moment where customers <i>did</i> want to go digital.');}},
{part:2,src:'Chapter 12 · Avoid These Common Anti-Patterns',run(L){
  L.h(L.kick('learn','Don’t stop at the first answer')+'<h1 class="q">A shallow learning can kill a good strategy</h1>'+
   L.prose('Hearing “customers love their loan officer,” Carl’s team could have quit going digital. That would have been a fast conclusion from a <b>shallow learning</b>: true, but only part of the story.')+
   L.prose('Instead they asked a harder question:')+
   L.note('<b>How can we reconcile what the business needs with what customers need?</b>','scale')+
   L.prose('Customers did value the relationship. They were <i>also</i> happy to research on their own. Teasing out that nuance let the team serve both sides. Discovery needs this kind of critical thinking.'));
  L.done();}},
{part:2,src:'Chapter 12 · Avoid These Common Anti-Patterns',pts:1,run(L){
  L.h(L.kick('pr','Apply it')+'<h1 class="q">Fernway wants fewer support calls, so customers change deliveries in the app. But Maya says they love Fernway’s friendly support team. What’s the deeper question?</h1>');
  L.mc(L.card,['When would Maya rather use the app than call us?','How do we make support calls harder to place?','Should we drop the self-service goal for good?'],0,
   'Look for the moments where self-service is what Maya wants (maybe skipping a week) and keep people for the moments that need them.',
   'Pushing customers away from support ignores their need, and dropping the goal ignores the business. Find the moments where self-service is what customers want.');}},
{part:2,src:'Chapter 12 · Snagajob: Iterating Through Small Opportunities for Big Impact',run(L){
  L.h(L.kick('ex','A real story from the book')+'<h1 class="q">A jobs marketplace chips away at a “big, hairy problem”</h1>');
  L.beats(L.card,[
   ['The surprise','Working on customer satisfaction, Amy and Jenn at Snagajob, an hourly-jobs site, found a new need from hiring managers: <i>“I can’t get in touch with my candidates.”</i> About one in ten candidates picked up the phone.'],
   ['Get close','To understand it, they offered to be free hiring assistants for local shops and restaurants, often for a month at a time.'],
   ['Step one','Calling simply didn’t work. Candidates were mobile-first and preferred texts. Texting first raised replies right away.'],
   ['Step two','Managers didn’t want to text from personal phones, so they found phone-friendly tools: text a link to a short form with follow-up questions.'],
   ['And on','Once managers could reach candidates, scheduling interviews was the next problem. After that came no-shows. They took them one at a time.']],
   'No single fix did it. Working across the tree, one small opportunity at a time, is what moved their outcome.');}},
{part:2,src:'Chapter 12 · Snagajob: Iterating Through Small Opportunities for Big Impact',pts:1,
 solve:async L=>{L.$('#pp').children[0].click();for(let i=0;i<3;i++)L.$('#fix').click();},
 run(L){
  const S=[['Chopping takes ages',9],['I can’t tell which recipes are quick',8],['Cleanup takes too long',10]];let p=null,n=0;
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">Fernway tackles the '+L.g('sub-opp','sub-opportunities')+' of “Recipes take too long on weeknights,” one at a time. What will the first fix alone do to meals cooked?</h1><div id="pp"></div>'+
   '<div id="sim" hidden><div class="meterrow"><div class="lb">Meals cooked</div><div class="meter"><div id="mm" style="background:var(--ok-strong);width:0%"></div></div></div><div id="done"></div>'+
   '<button class="btn pri" id="fix" style="margin-top:10px">'+L.ic('check')+'Solve the next one</button></div>');
  ['A small bump','A big jump'].forEach((t,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=t;b.onclick=()=>{if(p!==null)return;p=j;b.classList.add('sel');L.$('#sim').hidden=false;};L.$('#pp').appendChild(b);});
  L.$('#fix').onclick=function(){if(n>=S.length)return;const tot=S.slice(0,n+1).reduce((a,x)=>a+x[1],0);L.$('#mm').style.width=Math.round(tot*2.6)+'%';
    L.$('#done').innerHTML+='<span class="chip static ok">'+L.ic('check')+S[n][0]+' · +'+S[n][1]+'%</span>';n++;
    if(n===S.length){this.remove();L.award(p===0);
      L.sheet(p===0?'ok':'no',p===0?'You called it':'Each fix was small','No single change made the jump. Solving the sub-opportunities one by one is what solved the parent, “Recipes take too long,” and moved the outcome. Don’t expect a big step from every change.');L.done();}};}},

/* ---------- PART 4: TRAPS ---------- */
{part:3,src:'Chapter 12 · Avoid These Common Anti-Patterns',run(L){
  L.h(L.kick('learn','Four traps')+'<h1 class="q">Where teams go wrong while managing the cycles</h1>'+
   L.list([['Overcommitting to an opportunity','Some important needs aren’t right for you right now. Quick tests show the fit fast. Let go, and come back later if it makes sense.'],
     ['Avoiding hard opportunities','Quick testing and small releases don’t mean only easy solutions. Find a quick test of a hard idea, like a rough version you can fake in days.'],
     ['Shallow conclusions','Don’t drop a strategy on the first thing customers say. Dig for the nuance, and reconcile business and customer needs.'],
     ['Giving up too early','Most changes don’t make a big jump. It often takes a series of them to move the outcome.']],4));
  L.done();}},
{part:3,src:'Chapter 12 · Avoid These Common Anti-Patterns',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Spot the trap',['Overcommitting','Avoiding hard ones','Shallow conclusion','Giving up too early'],[
   ['After two failed rounds on missing kitchen tools, Marco wants a third and fourth round “to be sure.”',0,'The tests already showed this isn’t the need for now. Pick another target.'],
   ['Dev says: “Personalized portions would take months. Let’s only ship small tweaks forever.”',1,'Look for a quick test of the hard idea instead of ruling it out.'],
   ['One customer says they hate apps, so the team plans to drop the in-app planner idea entirely.',2,'One comment is a shallow learning. Ask when customers <i>do</i> want to use the app.'],
   ['The “cook first” label moved meals cooked by 1%, so Priya’s boss wants to abandon the outcome.',3,'Small gains add up. It usually takes a series of changes to move the outcome.'],
   ['The team keeps polishing spoilage reminders, even though customers said they need fresher food.',0,'They’re holding on to an opportunity they can’t fully address right now.']]);}},
{part:3,src:'Chapter 12 · Avoid These Common Anti-Patterns',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Tap each piece until the sentence sums up how to manage the cycles.</h1>');
  L.sentence(L.card,[['When a test surprises us,','When a test confirms our idea,'],['we stop and loop back','we push forward faster','we start a big study'],['to an earlier habit,','to the delivery plan,'],['and small changes add up.','and one launch fixes it.']],[0,0,0,0],
   [['Confirmation is welcome, but the loop is about surprises.'],['Charging ahead ignores what you just learned.','A big study is slow. Use the habits you already run weekly.'],['The delivery plan isn’t where answers come from. Go back to an earlier discovery habit.'],['One launch rarely moves an outcome. A series of small changes does.']],
   'Surprises are normal. Loop back, use the same habits to find your way, and give small changes time to add up.');}},
{part:3,src:'Chapter 12 · Simply Business: Not All Opportunities Need Solutions',pts:1,run(L){
  L.h(L.kick('pr','Final check')+'<h1 class="q">At the quarter review, Priya reports that the trio dropped two opportunities after a week of tests each. The head of product asks if that was wasted time. What’s the best answer?</h1>');
  L.mc(L.card,['Yes, we should research longer before choosing','No, we avoided building two wrong features','Partly, since one more week might have saved them'],1,
   'The book says such course corrections should be celebrated: much of discovery’s value is the time saved by <i>not</i> building something.',
   'Longer research up front wouldn’t have shown what the tests did, and more weeks would be overcommitting. Two weeks spent to avoid two wrong builds is a good trade.');}}
  ]
});
</script>
</body>
</html>
