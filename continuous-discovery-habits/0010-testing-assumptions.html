<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Testing Assumptions, Not Ideas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0010', title:'Testing assumptions, not ideas', minutes:20, icon:'flask',
  goals:['Design a small test that simulates one moment and watches what people do','Write success criteria the whole trio will read the same way','Decide what to do after a test passes or fails'],
  parts:['Simulate','Success criteria','Start small','Tools and traps'],
  read:'Read chapter 10 of the book for the full streaming-sports example and more on false positives and negatives.',
  glossary:{
    'confirmation-bias':'Confirmation bias: noticing the evidence that supports what you already believe and missing the evidence against it.',
    'escalation':'Escalation of commitment: the more time you put into an idea, the harder it gets to let it go, even when it has flaws.',
    'assumption-map':'Assumption map: a chart that places each assumption by how important it is and how much evidence you have. Known on the left, unknown on the right.',
    'success-criteria':'Success criteria: the numbers, agreed before the test, that say what result counts as a pass.',
    'false-positive':'False positive: a test says your assumption is true when it isn’t.',
    'false-negative':'False negative: a test says your assumption is false when it’s actually true.',
    'triangulation':'Triangulation: checking one question with several different research methods instead of trusting a single result.',
    'smoke-test':'Smoke-screen test: offering something that doesn’t exist yet (say, a “coming soon” option) in the real product to see who shows interest.',
    'unmoderated':'Unmoderated test: participants do the tasks on their own time with an online tool, and you watch the recordings later.'
  },
  cheatsheet:[
    'Test <b>assumptions from a set of ideas</b>, not one idea at a time. A shared assumption tests several ideas at once.',
    'A strong test <b>simulates one moment</b> and <b>watches what people do</b>. Simulate no more than you need.',
    'Before any results, agree on <b>two numbers</b>: how many people, and how many must act. “At least 4 of 10,” never “some” or “40%.”',
    'Choose the <b>smallest test the whole team will act on</b>. If the simulation is flawed, fix it or shift the bar.',
    '<b>Start small</b> (a day or two) and grow the test only after an early signal. Stop when enough risk is gone or building is cheaper than testing.',
    'Small tests produce false positives and negatives, but they’re <b>cheap</b>: later tests catch them, and ideas are plentiful.',
    'You’re not seeking truth. You’re <b>reducing risk</b>. Tools: unmoderated tests, one-question surveys, your own data.',
    'Traps: over-complex simulations, percentages, missing criteria, the wrong audience, not testing the best case first.'
  ],
  steps:[
/* ---------- PART 1: SIMULATE ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">The trio has three ideas but loves one of them. They decide to test only the favorite. What’s most likely to happen?</h1>');
  L.mc(L.card,['They’ll learn the most about the best idea','They’ll mostly notice the good news about it'],1,
   'When we test one favorite idea, we see what we hoped to see. This lesson shows how to test so that doesn’t happen.',
   'They’d learn a lot about one idea, but not fairly. People tend to spot the evidence that supports their favorite and miss the rest. This lesson shows a better way.');}},
{part:0,src:'Chapter 10 · Working With Sets of Ideas',run(L){
  L.h(L.kick('learn','Test a set, not a favorite')+'<h1 class="q">Keep comparing ideas while you test</h1>'+
   L.prose('Fernway’s trio is working on the opportunity “Chopping takes ages.” They have three ideas: <b>fewer-chop recipes</b>, <b>pre-chopped ingredients</b> in the box, and a <b>Sunday batch-chop guide</b>.')+
   L.prose('It’s tempting to test only the best-looking one. The book warns against two traps from the last chapter:')+
   L.list([['eye','Confirmation bias','Test one idea and you’ll notice the '+L.g('confirmation-bias','evidence that supports it')+', and miss the evidence against it.'],
     ['flame','Escalation of commitment','The more time you put into one idea, the more '+L.g('escalation','you’re all-in')+', flaws and all.']],2)+
   L.note('So the trio tests <b>assumptions from all three ideas</b>, side by side. They’re looking for a clear front-runner.','scale'));
  L.done();}},
{part:0,src:'Chapter 10 · Simulate an Experience, Evaluate Behavior',run(L){
  L.h(L.kick('learn','What a strong test does')+'<h1 class="q">Simulate a moment, then watch what people do</h1>'+
   L.prose('The aim of a test is to collect evidence that moves an '+L.g('assumption','assumption')+' from “unknown” toward “known” on the '+L.g('assumption-map','assumption map')+'. Just like in interviews, what people <i>do</i> is more reliable than what they say they’d do.')+
   L.flow([['pencil','1 · Assumption','What must be true?'],['play','2 · Simulate','Recreate the one moment where it matters'],['eye','3 · Evaluate','Count who acts the way the assumption predicts']])+
   L.prose('A strong test gives people a chance to behave in line with your assumption <i>or not</i>. Simulate only as much as you need. Small simulations let you run many tests quickly.'));
  L.done();}},
{part:0,src:'Chapter 10 · Simulate an Experience, Evaluate Behavior',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">Fernway designs a test for pre-chopped ingredients</h1>');
  L.beats(L.card,[
   ['The assumption','For pre-chopped ingredients to work, customers must <b>choose</b> pre-chopped meals when they pick their week.'],
   ['The moment','When does that choice happen? When customers pick next week’s meals in the app. That’s the moment to simulate.'],
   ['The simulation','Marco mocks up the weekly menu. Some meals carry a “pre-chopped” tag. Participants get one task: “Pick your meals for next week.”'],
   ['The behavior','The trio won’t ask “Do you like it?” They’ll count who actually <b>picks</b> a pre-chopped meal.'],
   ['Just enough','No kitchen changes, no real boxes. Only the one moment the assumption needs, so the test takes a day or two.']],
   'Find the moment where the assumption matters, rebuild just that moment, and watch what people choose.');}},
{part:0,src:'Chapter 10 · Simulate an Experience, Evaluate Behavior',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Which is the better test of “Customers will choose fewer-chop recipes”?</h1>');
  L.mc(L.card,['Ask customers if they would like fewer-chop recipes','Count who opens the app on Sunday evening','Show a mock menu with fewer-chop recipes and ask them to pick'],2,
   'It recreates the moment of choosing and lets people pick fewer-chop recipes, or not. Their behavior is the evidence.',
   'Asking what they’d like collects opinions about the future, which aren’t reliable. Counting app opens says nothing about fewer-chop recipes. Simulate the choice and watch it.');}},
{part:0,src:'Chapter 10 · Simulate an Experience, Evaluate Behavior',pts:5,run(L){
  L.h(L.kick('pr','Shared assumptions')+'<h1 class="q">Which ideas depend on each assumption? Ideas often share assumptions.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['All three','Fewer-chop recipes','Pre-chopped','Batch-chop guide'],[
   ['Customers want to spend less time chopping on weeknights.',0,'This sits under the opportunity itself. If it’s false, the whole set of ideas falls.'],
   ['Pre-cut vegetables stay fresh until cook day.',2,'Only the pre-chopped idea ships cut vegetables.'],
   ['Customers have 20 free minutes on Sunday.',3,'Only the Sunday batch-chop guide asks for Sunday time.'],
   ['Fewer-chop recipes still taste good enough.',1,'This is about the recipes themselves, so it belongs to fewer-chop recipes only.'],
   ['Customers will pay a bit more for pre-cut vegetables.',2,'Someone has to do the chopping. Only pre-chopped ingredients add that cost.']],
   'Test the shared assumption once and you learn about all three ideas. That’s one reason testing assumptions is faster than testing whole ideas.');}},

/* ---------- PART 2: SUCCESS CRITERIA ---------- */
{part:1,src:'Chapter 10 · Simulate an Experience, Evaluate Behavior',run(L){
  L.h(L.kick('learn','Define success up front')+'<h1 class="q">“Some people” is not a result</h1>'+
   L.prose('Once you know the moment, ask: <i>if the assumption is true, what would people do?</i> Then turn the answer into '+L.g('success-criteria','success criteria')+' with two numbers.')+
   L.flow([['people','How many people','you’ll test with','e.g. 10 customers',2],['check','How many must act','the way you expect','e.g. at least 4',3]])+
   L.note('<b>Agree on both before you see any results.</b> That way the trio reads the result the same way, and it guards against '+L.g('confirmation-bias','confirmation bias')+': after the fact, our brains hunt for evidence that the assumption passed.','lock'));
  L.done();}},
{part:1,src:'Chapter 10 · Simulate an Experience, Evaluate Behavior',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">How the trio picks the numbers</h1>');
  L.beats(L.card,[
   ['No formula','How many testers, and how many must pick a pre-chopped meal? The book says it’s a judgment call the team negotiates.'],
   ['The balance','As few people as possible, because it’s faster. But enough that everyone will act on the result. They aren’t proving it true, only making it less risky.'],
   ['Priya','“Let’s test with 10 customers. If at least 4 pick a pre-chopped meal, I’d call this more known.”'],
   ['Dev spots a flaw','The mock menu shows 8 meals, but the real one shows 20. With fewer choices, pre-chopped meals stand out more than they would for real.'],
   ['The fix','Either change the mock or raise the bar. They show all 20 meals and keep “at least 4 of 10.”']],
   'Agree on the smallest test whose result the whole trio will act on. If the simulation is imperfect, fix it or move the bar.');}},
{part:1,src:'Chapter 10 · Simulate an Experience, Evaluate Behavior',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Which success criterion is written the way the book recommends?</h1>');
  L.mc(L.card,['At least 4 of 10 customers pick a fewer-chop recipe','40% of customers pick a fewer-chop recipe','Some customers seem keen on fewer-chop recipes'],0,
   'It names how many people you’ll test and how many must act. Nobody can read it two ways.',
   'A percentage hides how many people you’ll test, and “some” means different things to different people. Name both numbers: at least 4 of 10.');}},
{part:1,src:'Chapter 10 · Simulate an Experience, Evaluate Behavior',pts:1,
 solve:async L=>{L.$('#run').click();},
 run(L){
  L.h(L.kick('pr','See it happen')+'<h1 class="q">The trio agreed that “some customers” should pick pre-chopped. They never said how many. Run the test.</h1>'+
   L.lanes([['person','Priya thinks','“Some” means 5 out of 10.<div class="res" id="ra"></div>',1],
            ['person','Marco thinks','“Some” means 20 out of 100.<div class="res" id="rb"></div>',2]])+
   '<button class="btn pri" id="run" style="margin-top:14px">'+L.ic('play')+'Run the test with 10 customers</button><div id="rq"></div>');
  L.$('#run').onclick=function(){this.remove();
    L.$('#ra').innerHTML='<b>3 of 10 picked it.</b> <span style="color:var(--no)">Priya: “It failed.”</span>';
    L.$('#rb').innerHTML='<b>3 of 10 picked it.</b> <span style="color:var(--ok)">Marco: “It passed!”</span>';
    const q=L.$('#rq');q.innerHTML='<h2 class="sub">What did the trio learn from this test?</h2>';
    L.mc(q,['Not much: they disagree on what it means','Pre-chopped meals are probably a winner'],0,
     'Same data, two readings. With no numbers agreed up front, the test was wasted. “At least 4 of 10” would have settled it before anyone saw the result.',
     'Marco reads it as a win, but Priya reads it as a loss. When the team disagrees on what the result means, the test taught them nothing. Agree on the numbers first.');};}},
{part:1,src:'Chapter 10 · Simulate an Experience, Evaluate Behavior',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Tap each piece until this is a success criterion the whole trio will read the same way.</h1>');
  L.sentence(L.card,[['Of some customers,','Of 10 customers,'],['40%','most','at least 4'],['say they like the idea.','pick a pre-chopped meal.']],[1,2,1],
   [['“Some” hides how many people you’ll test with. Name the number.'],['A percentage sounds exact, but with 10 people, is 3 a fail or a reason to test more? Use a count.','“Most” is vague. One person’s “most” is another’s “half.”'],['Saying isn’t doing. Count a behavior, like picking a meal.']],
   'Two numbers and one behavior: how many people, how many must act, and what they must do.');}},
{part:1,src:'Chapter 10 · Simulate an Experience, Evaluate Behavior',pts:1,run(L){
  L.h(L.kick('pr','Flawed simulation')+'<h1 class="q">In Marco’s mock menu, pre-chopped meals cost the same as the rest. In real life they’d cost a little more. What should the trio do?</h1>');
  L.mc(L.card,['Lower the bar, since no mock is ever perfect','Ignore it, because small tests are rough anyway','Add the price to the mock, or raise the bar'],2,
   'The flaw makes pre-chopped look better than it would for real. So either fix the mock or ask for a stronger result.',
   'The free price tilts the test in favor of pre-chopped, so a pass would mean less. Correct for it: show the price, or raise the bar. Lowering the bar would make things worse.');}},
{part:1,src:'Chapter 10 · Simulate an Experience, Evaluate Behavior',pts:1,run(L){
  L.h(L.kick('pr','Put in order')+'<h1 class="q">Put the steps for designing the Sunday batch-chop guide test in order.</h1>');
  L.order(L.card,['Pick the riskiest assumption','Find the moment to simulate','Agree how many people and how many must act','Recruit people who have the need','Compare the results with the agreed numbers'],
   'The numbers come <b>before</b> any data. Then you recruit and run the test, and the results are read against what you already agreed.');}},

/* ---------- PART 3: START SMALL ---------- */
{part:2,src:'Chapter 10 · Early Signals vs. Large-Scale Experiments',run(L){
  L.h(L.kick('learn','Early signals first')+'<h1 class="q">Start small, and grow the test only when it earns it</h1>'+
   L.prose('Someone will always ask: “How can we trust 10 people?” It’s tempting to survey hundreds of customers or launch a full A/B test (showing two versions to different users) to win people over. But that takes far longer.')+
   L.prose('The book says to look for an <b>early signal</b> first. You can learn a surprising amount from a handful of customers. Most of the learning comes from tests that <b>fail</b>, and small tests fail sooner.')+
   L.quote('Good tests kill flawed theories; we remain alive to guess again.','Karl Popper, quoted at the start of chapter 10')+
   L.note('Stop testing when enough risk is gone, or when the next test would cost so much that it makes more sense to just build the idea.','check'));
  L.done();}},
{part:2,src:'Chapter 10 · Early Signals vs. Large-Scale Experiments',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">The pre-chopped test, round by round</h1>');
  L.beats(L.card,[
   ['Round 1 · a day or two','10 customers pick meals from the mock menu. 5 of them choose a pre-chopped meal. The bar was 4, so it passes.'],
   ['Now what?','The assumption is <i>more known</i>, not proven. Is it still the riskiest one? Pre-chopping means new work in Fernway’s kitchens, a big cost. So yes, and the risk is still too high.'],
   ['Round 2 · about two weeks','Dev adds a “Pre-chopped, coming soon” option to the real menu. Tapping it asks for a thumbs-up or thumbs-down. Bar: at least 100 thumbs-up from 500 customers. This is a '+L.g('smoke-test','smoke-screen test')+'.'],
   ['Why not start here?','Round 2 needs a week of building, maybe approvals, maybe a wait for the next release. That’s only worth it after round 1 gave an early signal.'],
   ['When to stop','Once enough risk is gone, or when the next test would cost about as much as building the real thing.']],
   'Each round gets bigger and more reliable, but only after the last one says it’s worth it.');}},
{part:2,src:'Chapter 10 · Early Signals vs. Large-Scale Experiments',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Before testing the Sunday batch-chop guide at all, Dev wants to survey 800 customers “so nobody can doubt the data.” What does the book suggest?</h1>');
  L.mc(L.card,['Run a quick small test first, then grow it if it passes','Survey the 800, since only big samples are reliable'],0,
   'A day-or-two test gives an early signal. If it fails, they’ve saved weeks. If it passes, a bigger test is now worth the cost.',
   'Big tests cost time, and most of what you learn comes from failures. Find out cheaply first whether the batch-chop guide is even on the right track.');}},
{part:2,src:'Chapter 10 · Early Signals vs. Large-Scale Experiments',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'What should the trio do next?',['Run a bigger test of it','Test another assumption','Rework the idea','Stop testing and build'],[
   ['Fewer-chop recipes pass their first small test, and “Customers will choose them” is still the riskiest assumption. The trio isn’t comfortable with that risk yet.',0,'Still the riskiest and still too risky: design the next-level test of the same assumption.'],
   ['Pre-chopped passes the mock-menu test. Now “pre-cut vegetables stay fresh until cook day” looks riskier.',1,'When another assumption becomes the riskiest, switch to testing that one.'],
   ['In a prototype test, customers get lost halfway through the Sunday batch-chop guide.',2,'This assumption is about the solution, not the need. Teams usually design around a failed solution assumption.'],
   ['Evidence for the Sunday batch-chop guide is strong, and the next test would take as long as building the feature.',3,'Enough risk is gone and more testing costs as much as building. Time to build it.']]);}},
{part:2,src:'Chapter 10 · Understanding False Positives and False Negatives',run(L){
  L.h(L.kick('learn','When small tests get it wrong')+'<h1 class="q">Small tests make mistakes. Tap each card to see why that’s OK.</h1>');
  L.flips(L.card,[
   ['False negative','The test says the assumption is false, but across all your customers it’s true. Example: by bad luck, all 10 testers love chopping.'],
   ['Why it’s cheap','You rarely drop an opportunity after one failed test. Rerunning a small test costs a day or two. And ideas are plentiful, so losing one by mistake isn’t a disaster.'],
   ['False positive','The test says the assumption is true, but it isn’t. It sounds scarier, but the next, bigger test usually catches it before anything gets built.'],
   ['Lowering the odds','Recruit for variety: different households, regions and cooking habits. And use '+L.g('triangulation','triangulation')+': check one assumption with a few different methods.']],
   'Small tests make errors, but cheap ones. Building the wrong thing is the expensive mistake.');}},
{part:2,src:'Chapter 10 · A Quick Word on Science',run(L){
  L.h(L.kick('learn','We are not scientists')+'<h1 class="q">The goal is less risk, not the truth</h1>'+
   L.lanes([['book','Scientists','Seek truths about the world. Truth emerges over decades, as many researchers repeat each other’s studies.',3],
            ['bowl','Product teams','Try to improve customers’ lives. They launch, see how customers respond, and adjust, in weeks rather than years.',2]])+
   L.prose('So the trio thinks carefully about its methods, but doesn’t claim to “validate” anything. A test result is evidence for or against a view, not a truth. The book’s rule: do just enough research to cut the risk your company can’t bear, and no more.'));
  L.done();}},
{part:2,src:'Chapter 10 · Understanding False Positives and False Negatives',pts:4,run(L){
  L.h(L.kick('pr','Name the error')+'<h1 class="q">For each story, was the first small test a false positive, a false negative, or neither?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['False positive','False negative','Neither'],[
   ['Only 1 of 10 testers picks pre-chopped. It turns out all 10 love chopping, and across all customers many would pick it.',1,'The test said “false,” but for the wider customer base it’s true.'],
   ['6 of 10 pick fewer-chop recipes in the mock. In the bigger real-app test, almost nobody does.',0,'The small test said “true,” and the bigger test caught that it wasn’t.'],
   ['5 of 10 pick pre-chopped in the mock, and the smoke-screen test shows strong interest too.',2,'Both tests agree. Nothing suggests the first result was wrong.'],
   ['The batch-chop guide fails one small test, yet a survey and app data both show customers chopping ahead on Sundays.',1,'Several other methods disagree with the one failed test. That points to a false negative.']],
   'The next round of testing, and a mix of methods, is what exposes these errors.');}},

/* ---------- PART 4: TOOLS AND TRAPS ---------- */
{part:3,src:'Chapter 10 · Running Assumption Tests',run(L){
  L.h(L.kick('learn','Three everyday tools')+'<h1 class="q">How to run many small tests a week</h1>'+
   L.list([['eye','Unmoderated tests','Post a prototype and a task online. People do it on their own time, and you watch the videos the next day. Screen for the right participants and for variety.'],
     ['chat','One-question surveys','Ask about a specific recent time (“last week”), never about the future. To simulate a moment, ask the real question and count who answers versus who skips.'],
     ['layers','Your own data','Your app may already know. Before you dig in, agree how many records you’ll look at and what counts as a pass.']],2)+
   L.prose('Most assumptions can be tested with these three. Keep the simple pattern in mind: assumption, simulate, evaluate.'));
  L.done();}},
{part:3,src:'Chapter 10 · Running Assumption Tests',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">The trio wants a one-question survey for “Customers chop vegetables most weeknights.” Which question should they send?</h1>');
  L.mc(L.card,['Do you usually chop vegetables on weeknights?','How many times did you chop vegetables last week?','Would you chop less if we pre-chopped for you?'],1,
   'It asks about a specific, recent stretch of time, so the answers reflect what people really did.',
   '“Usually” invites people to describe their ideal self, and “would you” asks about the future. Both give unreliable answers. Ask about last week.');}},
{part:3,src:'Chapter 10 · Avoid These Common Anti-Patterns',run(L){
  L.h(L.kick('learn','Five common traps')+'<h1 class="q">What goes wrong when teams rush their tests</h1>'+
   L.list([['Over-complex simulations','Weeks spent on the perfect prototype. A first test should take a day or two, a week at most.'],
     ['Percentages instead of counts','“70%” hides how many people you’ll test. Write “7 of 10.”'],
     ['Missing criteria','Some tests need several numbers. For an email: how many get it, how long they have, and whether success means opening or clicking.'],
     ['The wrong audience','Test with people who have the need. Recruit for variety, not just whoever is easiest to reach or loudest.'],
     ['Not testing the best case first','Start with the audience most likely to pass. If it fails even there, the result is clear.']],4));
  L.done();}},
{part:3,src:'Chapter 10 · Avoid These Common Anti-Patterns',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Spot the trap',['Over-complex simulation','Percentages, not counts','Missing criteria','The wrong audience','Not the best case first'],[
   ['Marco spends three weeks building a fully working pre-chopped checkout for the very first test.',0,'A first test needs a quick signal. A mock menu would do in a day or two.'],
   ['The criterion reads: “60% of testers pick a fewer-chop recipe.”',1,'With 10 testers, is 5 a fail or a reason to test more? Write a count, like “6 of 10.”'],
   ['They email 200 customers a Sunday batch-chop tip, but never agreed whether success means opening the email or clicking the link.',2,'An email test needs more than one number: who gets it, how long they have, and which action counts.'],
   ['To test fewer-chop recipes, they recruit Sam, who loves spending an hour cooking, and friends like Sam.',3,'Sam doesn’t have the need “chopping takes ages.” Recruit people who do, with variety.'],
   ['Round one goes to the most price-sensitive customers, “to make the test extra tough.”',4,'Start with the audience most likely to pass. A tough crowd makes a failure easy to argue away.']]);}},
{part:3,src:'Chapter 10 · Avoid These Common Anti-Patterns',pts:1,run(L){
  L.h(L.kick('pr','Read the result')+'<h1 class="q">The trio tests pre-chopped with customers like Maya, who say chopping takes ages most of all. Only 1 of 10 picks a pre-chopped meal. What does this tell them?</h1>');
  L.mc(L.card,['Retest with a tougher audience to be sure','A fairly clear signal: rethink pre-chopped','The test was set up wrong, so ignore it'],1,
   'They tested the best case and it still failed, so nobody can blame the audience. Time to rethink the idea or design around the failed assumption.',
   'This was already the audience most likely to pass. Failing here is the clearest signal a small test can give. A tougher crowd would only fail harder.');}}
  ]
});
</script>
</body>
</html>
