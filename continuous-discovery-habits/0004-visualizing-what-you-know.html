<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visualizing What You Know</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0004', title:'Visualizing what you know', minutes:18, icon:'map',
  goals:['Set the scope of an experience map from your outcome','Explain why each trio member draws alone before sharing','Merge three maps into one shared map, step by step'],
  parts:['Map first','Draw alone','Merge','Traps'],
  read:'Read chapter 4 of the book for the full application-process story and the streaming-video map.',
  glossary:{
    'experience-map':'Experience map: a simple drawing of what your customer goes through today, as the customer sees it.',
    groupthink:'Groupthink: when a group does worse than its members could, because of how the group behaves together.',
    node:'Node: one moment, action or event on an experience map, like “box arrives.”',
    link:'Link: an arrow between two nodes that shows how people move from one to the next, including loops back.'
  },
  cheatsheet:[
    'Before exploring opportunities, take stock of what you <b>already know</b>: draw an experience map of the customer’s world today.',
    '<b>Scope comes from your outcome.</b> Narrow is fine for tuning; open-ended outcomes need a wider scope. There’s no single right one, so agree on it as a team.',
    '<b>Draw alone first</b> to avoid groupthink. Then share.',
    '<b>Draw, don’t write.</b> Boxes, arrows, stick figures. Draw the customer’s experience, not your screens.',
    'When sharing: ask questions, look for the <b>differences</b>, and don’t defend your own drawing.',
    'Merge: nodes and links → one big map → collapse like nodes → draw links, including loops and give-ups → add thinking, feeling, doing.',
    'Traps: endless debate, words instead of pictures, treating the map as true, never updating it.'
  ],
  steps:[
/* ---------- PART 1: MAP FIRST ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">On the phone, you and a friend agree to “meet at the station.” You end up at different exits. What would have prevented it?</h1>');
  L.mc(L.card,['Talking it through for a few minutes longer','A quick sketch of the exact meeting spot'],1,
   'Words let two people <i>think</i> they agree when they don’t. A drawing forces you to be specific. That idea runs through this whole lesson.',
   'You both already felt sure you agreed. More talk rarely shows the gap. A sketch forces you to be specific, so the gap shows up at once.');}},
{part:0,src:'Chapter 4 · opening',run(L){
  L.h(L.kick('learn','Take stock before you explore')+'<h1 class="q">The opportunity space has no edges, so start with what you already know</h1>'+
   L.prose('With its outcome set, Fernway’s '+L.g('trio','trio')+' wants to find '+L.g('opportunity','opportunities')+'. But customer needs are endless. Dive in blind and you get lost.')+
   L.prose('So first, take an inventory of what the team already knows. The book’s tool for this is an '+L.g('experience-map','experience map')+': a drawing of what customers go through <i>today</i>.')+
   L.flow([['target','Outcome','More meals get cooked','sets the focus'],['map','Experience map','What we think happens today','hunches, not facts'],['chat','Interviews','Check the map with customers','next lesson']])+
   '<p class="small" style="margin-top:10px">This matters most in a trio, where each person knows different things.</p>');
  L.done();}},
{part:0,src:'Chapter 4 · opening story, summarized',run(L){
  L.h(L.kick('ex','A real story from the book')+'<h1 class="q">A new trio maps a long application form, one person at a time</h1>');
  L.beats(L.card,[
   ['The goal','A newly formed trio must get more customers to <b>submit a long application</b>. Many start it and never finish.'],
   ['Alone first','Each person draws their own map of what stops customers. It feels awkward: each one is missing something.'],
   ['Product manager','Knows the <b>known problems</b>: the complaints that reach the call center and support tickets.'],
   ['Designer','New to the company, so misses a few steps. But sees it as an outsider and captures the customer’s <b>confusion and insecurity</b>.'],
   ['Engineer','Gets the process exactly right and shows <b>how one step feeds the next</b>, so a mistake early can derail the customer later.'],
   ['Merged','Together they build one shared map, richer than any single one. They know it holds <b>hunches, not truth</b>, but it shows what to check in interviews.']],
   'Three partial views made one rich map. Each person saw something the others missed.');}},
{part:0,src:'Chapter 4 · opening story',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">What did the trio’s shared map give them?</h1>');
  L.mc(L.card,['A starting point of hunches to check','Proof of why customers quit the form','The best of the three individual maps'],0,
   'Right. It made clear what they thought they knew, what was still open, and what to check in their next interviews.',
   'It wasn’t proof: they knew it held hunches. And it wasn’t one person’s map: it combined all three. It was a clear starting point to check with customers.');}},
{part:0,src:'Chapter 4 · Set the scope of your experience map',run(L){
  L.h(L.kick('learn','Set the scope')+'<h1 class="q">Your outcome decides how much of the customer’s world to draw</h1>'+
   L.prose('Try to draw <i>everything</i> about your customers and you’ll drown. Start from your outcome and turn it into one question the map answers.')+
   L.tiers([['eye','Too broad','“How do customers entertain themselves?” Now you’re mapping concerts, books and games.','Right only if you’re exploring nearby markets'],
            ['target','Focused, with room','“How do customers entertain themselves with video?”','The book’s example for a streaming service',true,'Good start'],
            ['lock','Too narrow','“How do they entertain themselves using our service?”','Rules out ideas from rival apps, YouTube or cable']])+
   L.prose('<b>Tuning something specific</b>, like getting more forms submitted? A narrow scope is fine. <b>Open-ended outcome?</b> Go wider.')+
   L.note('There’s no single right scope. What matters is that the team talks it through and agrees.','chat'));
  L.done();}},
{part:0,src:'Chapter 4 · Set the scope of your experience map',pts:1,
 solve:async L=>{const g=L.$('#sc').children;g[0].click();g[1].click();g[2].click();},
 run(L){
  const IT=['Picking meals in the app','Box arrives at the door','Ingredients wait in the fridge','Cooking on a busy weeknight','Ordering takeout instead','Lunch at the office','Weekend trips to restaurants'];
  const SC=[['How do customers use the Fernway app?',[0]],['How do customers get dinner made on weeknights?',[0,1,2,3,4]],['How do people eat, all day, every day?',[0,1,2,3,4,5,6]]];const seen=new Set();
  L.h(L.kick('pr','Toggle and compare')+'<h1 class="q">Fernway’s outcome is “more meals get cooked.” Try each scope and see what lands inside the map.</h1><div id="sc"></div>'+
   '<div style="background:var(--soft);border-radius:16px;padding:14px;margin:8px 0 6px;min-height:120px"><div class="small" id="sn" style="margin-bottom:8px">Choose a scope above.</div><div id="si"></div></div><div id="sq"></div>');
  SC.forEach((s,j)=>{const b=document.createElement('button');b.className='chip';b.innerHTML=L.ic('map')+s[0];b.onclick=()=>{[...L.$('#sc').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(j);
    L.$('#si').innerHTML=IT.map((d,x)=>{const on=s[1].includes(x);return '<span class="chip static'+(on?' ok':'')+'" style="'+(on?'':'opacity:.35')+'">'+(on?L.ic('check'):L.ic('x'))+d+'</span>';}).join('');
    L.$('#sn').innerHTML='<b>'+s[1].length+' of '+IT.length+'</b> moments are inside this map';
    if(seen.size===3&&!L.$('#sq').innerHTML){const q=L.$('#sq');q.innerHTML='<h2 class="sub">Which scope gives the trio room to explore while staying on “meals cooked”?</h2>';
      L.mc(q,['Use the Fernway app','Dinner on weeknights','Eating, all day'],1,
       'It takes in the fridge, the busy evening and the takeout menu, where meals really get lost, without wandering off to office lunches.',
       'The app-only scope misses the kitchen, where meals go uncooked. The all-day scope pulls in lunches and restaurants that have little to do with cooking a box.');}};L.$('#sc').appendChild(b);});}},
{part:0,src:'Chapter 4 · Set the scope of your experience map',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Judge the scope',['Too narrow','Too broad','Workable'],[
   ['Outcome: more meals get cooked. Scope: “How do customers move through our recipe screen?”',0,'It only covers Fernway’s own screen and skips the fridge and the busy evening, where meals actually go uncooked.'],
   ['Outcome: more meals get cooked. Scope: “How do people spend their free time?”',1,'Free time takes in hobbies, friends and TV. That’s far beyond cooking a delivered box.'],
   ['Outcome: more new customers finish sign-up. Scope: “What stops people finishing sign-up today?”',2,'This outcome tunes one specific process, so a narrow scope is fine, just like the book’s application story.'],
   ['Outcome: more meals get cooked. Scope: “How do customers decide what to cook each night?”',2,'It stays close to cooking but still includes life outside the app.'],
   ['Outcome: more meals get cooked. Scope: “How do people use our reminder emails?”',0,'It’s tied to one feature. It rules out everything else that gets a meal cooked or not.']]);}},

/* ---------- PART 2: DRAW ALONE ---------- */
{part:1,src:'Chapter 4 · Start individually to avoid groupthink',run(L){
  L.h(L.kick('learn','Start alone')+'<h1 class="q">Each person draws their own map before the trio meets</h1>'+
   L.prose('Groups often do worse than their members could. The book calls this '+L.g('groupthink','groupthink')+' and points to a few reasons:')+
   L.list([['people','Uneven effort','Some members put in more work than others.'],
     ['lock','Quiet voices','Some people hesitate to speak up, or never do.'],
     ['down','The lowest level','Groups tend to perform at the level of their least capable member.']],2)+
   L.prose('So Priya, Marco and Dev each map what they know <b>on their own</b> first. It will feel slow, like doing the same work three times. That’s the point: you want three different views.'));
  L.done();}},
{part:1,src:'Chapter 4 · Experience maps are visual, not verbal',run(L){
  L.h(L.kick('learn','Draw, don’t describe')+'<h1 class="q">A picture forces you to be specific</h1>'+
   L.prose('Language is vague. Two people can talk for an hour, <i>feel</i> they agree, and walk away with different pictures. You can’t draw something until you know exactly what it is, so drawing shows the gaps in your thinking.')+
   L.prose('You don’t need to draw well. Boxes, arrows, stick figures and squiggles are fine.')+
   L.lanes([['x','Don’t draw','Your product’s screens, one after another: login, menu, checkout.',4],
            ['check','Do draw','The customer’s experience as they see it: where they get stuck, what goes wrong, where they give up.',2]]));
  L.done();}},
{part:1,src:'Chapter 4 · Experience maps are visual, not verbal',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Marco opens a design tool and starts laying out every screen of Fernway’s app, from login to checkout. What should Marco draw instead?</h1>');
  L.mc(L.card,['A tidier version of the same screens, with notes','A written summary of what customers want','The customer’s week as they live it, in and out of the app'],2,
   'The map is about the customer’s experience: picking meals, the box arriving, the busy evening, the takeout menu.',
   'Screens show your product, not the customer’s experience, and a written summary falls back on vague words. Draw the customer’s week as they live it.');}},
{part:1,src:'Chapter 4 · Experience maps are visual, not verbal',pts:5,run(L){
  L.h(L.kick('pr','Customer or screens?')+'<h1 class="q">Dev drafts nodes for a map. Which describe the customer’s experience, and which are just screen flow?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Customer experience','Screen flow'],[
   ['Maya gets home from a shift and finds the box on the porch',0,'A real moment in the customer’s day, outside the app.'],
   ['Settings → Notifications → toggle reminders on',1,'That’s a path through screens. It says nothing about the customer’s day.'],
   ['Ana and Joe ask each other what they feel like eating',0,'Who they decide with, and how, is part of their experience.'],
   ['Recipe page scrolls down to the ingredients list',1,'Screen detail. Map what the customer is trying to do, not how the page scrolls.'],
   ['Sam orders pizza because nothing is ready at 8 pm',0,'A moment where a meal goes uncooked. Exactly what the map should show.']],
   'Draw the moments of the customer’s life, including where they give up. Screen detail can wait.');}},
{part:1,src:'Chapter 4 · Explore the diverse perspectives on your team',run(L){
  L.h(L.kick('learn','Share your drawings')+'<h1 class="q">When you look at a teammate’s map, be curious, not right</h1>'+
   L.list([['eye','Listening','Ask questions until you fully understand their view. Give them time to explain what they think and why.'],
     ['compass','Look for differences','Don’t judge what they got right or wrong. Pay attention to where their map differs from yours.'],
     ['chat','Sharing yours','Don’t argue for your drawing. Explain your view, answer questions and clarify.']],3)+
   L.prose('Everyone’s map adds something. The shared map is stronger because it draws on all of them.'));
  L.done();}},
{part:1,src:'Chapter 4 · Explore the diverse perspectives on your team',run(L){
  L.h(L.kick('ex','Fernway’s three maps')+'<h1 class="q">Priya, Marco and Dev each drew alone. Tap each map to see what it caught.</h1>');
  L.flips(L.card,[
   ['Priya’s map','Strong on known problems: the complaints support hears about spoiled ingredients and skipped deliveries.'],
   ['Marco’s map','Skips a step or two, but captures feelings: the guilt of throwing food away, the dread of a long recipe after work.'],
   ['Dev’s map','Shows how steps connect: meals picked on Sunday decide what’s in the fridge on a tiring Thursday.']],
   'Like the trio in the book, each view caught something the others missed. Next, they combine them.');}},
{part:1,src:'Chapter 4 · Explore the diverse perspectives on your team',pts:1,run(L){
  L.h(L.kick('pr','Your call')+'<h1 class="q">Dev’s map shows customers cooking most meals on Sunday. Priya is sure that’s wrong. What should Priya do?</h1>');
  L.mc(L.card,['Point out the mistake so they save time','Ask Dev what led to drawing it that way','Say nothing and push Priya’s version later'],1,
   'Curiosity first. Dev may know something Priya doesn’t, and the difference itself is worth noting.',
   'Judging or quietly overriding Dev’s view throws away what Dev knows. The book says to ask questions and pay attention to differences.');}},

/* ---------- PART 3: MERGE ---------- */
{part:2,src:'Chapter 4 · Co-create a shared experience map',run(L){
  L.h(L.kick('learn','Build one map together')+'<h1 class="q">Combine all three maps. Don’t just pick the best one.</h1>'+
   L.prose('First, a shared language. A '+L.g('node','node')+' is one moment, action or event. A '+L.g('link','link')+' is an arrow that connects nodes.')+
   L.list([['Turn each map into nodes and links','Break every drawing into its moments and arrows.'],
     ['Put all the nodes on one new map','Every node from every map goes in.'],
     ['Collapse similar nodes','Merge true duplicates, but don’t generalize so much that key detail disappears.'],
     ['Draw the links','Not just the happy path: show redos, loops and where people give up.'],
     ['Add context','At each step, what is the customer thinking, feeling and doing? Show it visually.']],1));
  L.done();}},
{part:2,src:'Chapter 4 · Co-create a shared experience map',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">Fernway’s trio merges their maps</h1>');
  L.beats(L.card,[
   ['Nodes and links','Each person breaks their sketch into moments and arrows. Priya has 6 nodes, Marco 5, Dev 7.'],
   ['One big map','All 18 nodes go onto one large sheet, roughly in time order.'],
   ['Collapse','Priya’s “box arrives” and Dev’s “delivery left at door” are the same moment, so they become one node. But “cooks a 20-minute meal” and “cooks a 50-minute meal” stay apart: merging them into “cooks” would hide the time problem.'],
   ['Links','They add a loop: <i>opens fridge → nothing quick → orders takeout → ingredients go bad → thrown away</i>.'],
   ['Context','At “opens fridge on Thursday,” they sketch a tired face after a 12-hour shift and the thought: “nothing in here is quick.”']],
   'A merged map, not a winning map. And the give-up loops are where opportunities hide.');}},
{part:2,src:'Chapter 4 · Co-create a shared experience map',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">A draft map runs in one straight line: pick meals → box arrives → cook → eat. What do its links still need?</h1>');
  L.mc(L.card,['A date for when each step usually happens','The app screen where each step takes place','The places people loop back or give up'],2,
   'The happy path hides the problems. Redos, loops and give-ups are where meals go uncooked.',
   'Dates and screens don’t show where things go wrong. The book says to draw the loops, the redos and the places people give up.');}},
{part:2,src:'Chapter 4 · Co-create a shared experience map',pts:1,run(L){
  L.h(L.kick('pr','Put it in order')+'<h1 class="q">Tap the steps for building a shared map, in order.</h1>');
  L.order(L.card,['Turn each map into nodes and links','Put every node on one new map','Collapse similar nodes','Draw the links between nodes','Add thinking, feeling and doing'],
   'Break down, combine, tidy, connect, then bring it to life with context.');}},
{part:2,src:'Chapter 4 · Co-create a shared experience map',pts:4,run(L){
  L.h(L.kick('pr','Collapse or keep?')+'<h1 class="q">Pairs of nodes from different maps. Merge them, or keep both?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Collapse into one','Keep separate'],[
   ['“Picks meals in the app” and “chooses this week’s recipes”',0,'Same moment, different words. One node is enough.'],
   ['“Cooks on a calm Sunday” and “cooks after a night shift”',1,'Merging them into “cooks” would lose the detail that matters: how tired and rushed the customer is.'],
   ['“Gives up and orders takeout” and “cooks the meal”',1,'These are different paths. The give-up path is exactly what the map needs to show.'],
   ['“Box arrives” and “delivery left at the door”',0,'Two names for one event. Collapse them.']],
   'Collapse true duplicates, but don’t generalize so much that you lose key detail.');}},

/* ---------- PART 4: TRAPS ---------- */
{part:3,src:'Chapter 4 · Avoid common anti-patterns',run(L){
  L.h(L.kick('learn','Four common traps')+'<h1 class="q">Where teams go wrong with experience maps</h1>'+
   L.list([['Endless debate','Arguing over small details? Draw your versions instead. Often you already agree, or the drawing shows exactly where you don’t.'],
     ['Words instead of pictures','Feeling shy about drawing, teams slip back into sentences. Use boxes and arrows; drawing shows patterns words hide.'],
     ['Treating the map as true','It’s a first draft of what you <i>think</i> you know. Interviews and tests will check it.'],
     ['Never updating it','Keep refining it as you learn. Otherwise each person takes different things from the same interview and your views drift apart.']],4));
  L.done();}},
{part:3,src:'Chapter 4 · Avoid common anti-patterns',pts:1,
 solve:async L=>{L.$('#dr').click();},
 run(L){
  const P=['Picks meals Sunday','Box arrives','Cooks on weeknights'],D=['Picks meals Sunday','Box arrives','Checks shift schedule','Cooks on weeknights'];
  const row=(a,hi)=>a.map(x=>'<span class="chip static'+(x===hi?' ok':'')+'">'+(x===hi?L.ic('star'):'')+x+'</span>').join('<span style="color:var(--muted);margin-right:6px">→</span>');
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Priya and Dev have argued for 20 minutes about whether customers “plan their week.” Make them draw it.</h1>'+
   L.note('Priya: “Customers plan ahead!” Dev: “No, they plan around their shifts!”','chat')+
   '<button class="btn pri" id="dr" style="margin-top:14px">'+L.ic('pencil')+'Draw it instead</button><div id="dm"></div><div id="dq"></div>');
  L.$('#dr').onclick=function(){this.remove();
    L.$('#dm').innerHTML='<h2 class="sub">Priya’s sketch</h2><div>'+row(P)+'</div><h2 class="sub">Dev’s sketch</h2><div>'+row(D,'Checks shift schedule')+'</div>';
    const q=L.$('#dq');q.innerHTML='<h2 class="sub">What did drawing show?</h2>';
    L.mc(q,['They agree, except for one step to check','Dev’s map was right and Priya’s was wrong','Drawing just slowed the decision down'],0,
     'They agreed on almost everything. The real question is one node: do customers check their shifts before cooking? That’s something to ask in interviews.',
     'Neither map is proven, and drawing took seconds after 20 minutes of talk. It showed they mostly agreed and pinpointed the one step they disagree on.');};}},
{part:3,src:'Chapter 4 · Avoid common anti-patterns',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Spot the trap',['Endless debate','Words, not pictures','Map treated as true','Map never updated'],[
   ['Priya writes three paragraphs about the customer’s week and sends them round as “our map.”',1,'Paragraphs are vague. Boxes and arrows would force the specifics and show the gaps.'],
   ['Dev says, “The map shows people pick meals on Sunday, so let’s build a Sunday reminder.” No customer has confirmed it.',2,'The map is a draft of hunches. Check it in interviews before building on it.'],
   ['Four months on, the map hasn’t changed, and Priya and Marco describe customers differently after the same interviews.',3,'Without refining the map together, each person’s view drifts. Keep it shared and current.'],
   ['Marco and Dev spend a whole meeting arguing about whether customers cook on Mondays.',0,'Draw both versions. It will show whether they really disagree, and exactly where.']]);}}
  ]
});
</script>
</body>
</html>
