<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What Is Continuous Discovery?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0001', title:'What is continuous discovery?', minutes:18, icon:'compass',
  goals:['Tell discovery work from delivery work','Explain how product teams got to continuous discovery','Check any team against the four-part definition'],
  parts:['Two kinds of work','How we got here','The trio','The definition'],
  read:'Read chapter 1 of the book for the full history and the six mindsets in the author’s words.',
  glossary:{
    agile:'Agile: a set of software principles written in 2001: short cycles, frequent customer feedback, a steady pace, flexibility and simplicity.',
    instrument:'Instrumenting: adding code that records how people use a product, so the team can measure it.',
    cocreate:'Co-creating: shaping ideas together with customers from the start, instead of only checking a finished idea with them at the end.',
    touchpoint:'Customer touchpoint: any time the team talks with, watches or tests something with a real customer.'
  },
  cheatsheet:[
    '<b>Discovery</b> = deciding what to build. <b>Delivery</b> = building and shipping it. Most companies over-invest in delivery.',
    'A digital product is never done, so discovery never ends: markets, needs and technology keep changing.',
    'History: leaders decided once a year → Agile shortened cycles → better measurement showed we still built the wrong things → teams now decide with customers, often.',
    'Three shifts: <b>who</b> decides (the whole team), <b>how</b> (co-create with customers), <b>how often</b> (discovery as fast as delivery).',
    'The <b>product trio</b>: product manager (viable for the business), designer (easy and delightful), engineer (reliable and works). Add people only if worth the slower decisions.',
    'Six mindsets: outcome-oriented, customer-centric, collaborative, visual, experimental, continuous.',
    'Definition: <b>at least weekly</b> customer touchpoints, <b>by the team building the product</b>, running <b>small research activities</b>, <b>in pursuit of a desired outcome</b>.'
  ],
  steps:[
/* ---------- PART 1: TWO KINDS OF WORK ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Last year Fernway’s app team shipped every promised feature, on time and on budget. Cancellations still went up. Was it a good year?</h1>');
  L.mc(L.card,['Yes, the team kept every promise it made','Not clearly, they may have built the wrong things'],1,
   'Shipping on time says nothing about whether the features helped anyone. This lesson is about the work that decides <i>what</i> to build.',
   'Keeping promises is good, but cancellations went up. On time and on budget doesn’t tell you if you built the right things.');}},
{part:0,src:'Chapter 1 · The what and why of continuous discovery',run(L){
  L.h(L.kick('learn','Two kinds of work')+'<h1 class="q">Deciding what to build is different work from building it</h1>'+
   L.prose('Every product team does two kinds of work. The book calls them '+L.g('discovery','discovery')+' and '+L.g('delivery','delivery')+'.')+
   L.flow([['compass','Discovery','Deciding what to build','Is it the right thing?',2],['box','Delivery','Building and shipping it','Is it built right, on time?',3]])+
   L.prose('The two overlap and weave together, but they need different skills. Many companies watch delivery closely: did you ship what you promised, on time and on budget? They spend far less effort checking whether it was the right thing to build. The book sets out to fix that imbalance.'));
  L.done();}},
{part:0,src:'Chapter 1 · The what and why of continuous discovery',run(L){
  L.h(L.kick('ex','Meet Fernway')+'<h1 class="q">A meal-kit app that’s great at delivery</h1>');
  L.beats(L.card,[
   ['The app','<b>Fernway</b> sends customers a weekly box of ingredients and recipes. Customers choose their meals in the app.'],
   ['The team','Three people lead the app: <b>Priya</b> (product manager), <b>Marco</b> (designer) and <b>Dev</b> (software engineer).'],
   ['Last year','Leaders handed them a list of features. They shipped all of it on schedule. Their dashboard was all green.'],
   ['The problem','Nobody checked if customers used the features or cooked more. Many didn’t, and some cancelled.'],
   ['The lesson','Priya, Marco and Dev were measured on delivery only. Nobody owned discovery: finding out what customers actually needed.'],
   ['And next year?','Customers’ lives change, rival apps appear, new technology arrives. A digital product is never done, so discovery can’t be a one-time job.']],
   'Discovery isn’t a phase you finish. As long as the product lives, the team keeps finding out what to build next.');}},
{part:0,src:'Chapter 1 · The what and why of continuous discovery',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Which of these is discovery work?</h1>');
  L.mc(L.card,['Dev fixes a bug in the payment code','Marco asks Maya about planning the week','Priya schedules this week’s app release'],1,
   'Learning how Maya plans the week helps decide what to build. That’s discovery.',
   'Fixing code and scheduling a release are about building and shipping: delivery. Asking Maya about planning the week helps decide what to build.');}},
{part:0,src:'Chapter 1 · The what and why of continuous discovery',pts:5,run(L){
  L.h(L.kick('pr','Sort the week')+'<h1 class="q">Here’s a week of work at Fernway. Is each task discovery or delivery?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Discovery','Delivery'],[
   ['Watch Sam try to find a new cuisine in the app',0,'Watching a customer tells the team what to build next.'],
   ['Write the code for the new recipe filter',1,'Writing code builds the thing. That’s delivery.'],
   ['Test whether Ana and Joe would use a budget meal plan',0,'Testing if an idea will work, before building it, is discovery.'],
   ['Release the new version of the app to the store',1,'Shipping is the end of delivery.'],
   ['Compare three ideas for helping shift workers plan',0,'Choosing between ideas is deciding what to build.']],
   'Both kinds matter. The book’s point is that discovery deserves as much care as delivery.');}},

/* ---------- PART 2: HOW WE GOT HERE ---------- */
{part:1,src:'Chapter 1 · The evolution of modern product discovery',run(L){
  L.h(L.kick('ex','A short history')+'<h1 class="q">How product discovery changed over about 30 years</h1>');
  L.beats(L.card,[
   ['The old way','Business leaders decided what to build, once a year, during budgeting. Engineering teams got fixed projects with deadlines. Work ran late and over budget, and teams often learned only after launch that customers didn’t care.'],
   ['2001 · Agile','Fed-up engineers wrote the '+L.g('agile','Agile')+' manifesto. They wanted smaller cycles, more customer feedback, and less wasted building.'],
   ['Agile’s struggles','Leaders still clung to their own ideas. The rest of the company still budgeted yearly. Teams were still judged on what they shipped, not on whether it helped anyone.'],
   ['Real progress','Releases sped up from yearly to monthly to weekly or daily. Teams got better at '+L.g('instrument','instrumenting')+' products, usability testing, and starting small.'],
   ['A hard lesson','Better measurement showed the painful truth: features nobody used, redesigns that moved no numbers. So teams began to question <i>how</i> they decided what to build.'],
   ['Today','Many teams talk to customers often, test their ideas, and build <i>with</i> customers on a continuous rhythm.']],
   'Delivery got fast long before discovery did. Continuous discovery is the catch-up.');}},
{part:1,src:'Chapter 1 · The evolution of modern product discovery',run(L){
  L.h(L.kick('learn','The four Agile ideas')+'<h1 class="q">Four principles that run through this whole book</h1>'+
   L.prose('The Agile authors saw projects that were too big and teams that built the wrong things for too long. They pushed for:')+
   L.list([['cycle','Short cycles','Work in small cycles with frequent customer feedback, so you learn sooner.'],
     ['clock','A pace you can keep','Work at a steady pace you could keep up forever, not a frantic rush from deadline to deadline.'],
     ['compass','Flexibility','Be able to change course quickly when customers tell you something new.'],
     ['leaf','Simplicity','Much of what gets built is never used. Build as little as you can.']],1)+
   '<p class="small" style="margin-top:10px">The book says you’ll see all four in the habits ahead.</p>');
  L.done();}},
{part:1,src:'Chapter 1 · The evolution of modern product discovery',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Dev suggests launching the recipe filter with just two options, since most extras never get used. Which Agile idea is Dev applying?</h1>');
  L.mc(L.card,['A pace you can keep','Flexibility','Simplicity'],2,
   'Building only what’s needed, because so much of what gets built is never used, is simplicity.',
   'Dev’s point is about building less, because extras often go unused. That’s simplicity.');}},
{part:1,src:'Chapter 1 · The evolution of modern product discovery',pts:1,run(L){
  L.h(L.kick('pr','Put it in order')+'<h1 class="q">Tap the stages of product discovery in the order they happened.</h1>');
  L.order(L.card,['Leaders pick projects once a year','Agile manifesto calls for short cycles','Faster releases and better measurement','Data shows many features go unused','Teams discover with customers every week'],
   'Each step fixed part of the last one. Measuring better is what finally showed teams how often they built the wrong things.');}},
{part:1,src:'Chapter 1 · The evolution of modern product discovery',run(L){
  L.h(L.kick('learn','Three shifts')+'<h1 class="q">Once teams saw the problem, three things started to change</h1>'+
   L.tiers([['people','Who decides','From business stakeholders, to product managers, and then to the whole product team.','Fernway: Priya, Marco and Dev decide together'],
            ['chat','How they decide','From guessing in meeting rooms to involving customers throughout. Not just checking an idea at the end, but '+L.g('cocreate','co-creating')+' from the start.','Fernway: Maya shapes the shift-planning idea early',true,'Biggest change'],
            ['cycle','How often','As delivery cycles got shorter, discovery cycles got shorter too.','Fernway: learn something every week, not every year']])+
   L.prose('Co-creating mixes two kinds of knowledge: the team knows what’s technically possible, and customers know their own needs, pain points and desires.'));
  L.done();}},
{part:1,src:'Chapter 1 · The evolution of modern product discovery',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Old habit or new?',['Old way of deciding','Continuous discovery'],[
   ['The head of sales picks next year’s features in the annual budget meeting.',0,'Leaders deciding once a year is the oldest pattern in the story.'],
   ['Marco sketches three rough ideas with Maya before anyone writes code.',1,'Working on ideas with a customer from the start is co-creating.'],
   ['The trio builds the meal planner for six months, then shows it to customers.',0,'Showing customers only at the end means learning too late, the problem Agile tried to fix.'],
   ['Priya, Marco and Dev review what they learned from customers every week.',1,'A weekly rhythm, owned by the whole team, is the new way.']]);}},

/* ---------- PART 3: THE TRIO ---------- */
{part:2,src:'Chapter 1 · Who this book is for',run(L){
  L.h(L.kick('learn','The product trio')+'<h1 class="q">Three roles, one shared job</h1>'+
   L.prose('The book is written for a '+L.g('trio','product trio')+': a product manager, a designer and a software engineer doing discovery together.')+
   L.list([['trend','Product manager · Priya','Brings the business view: will this work for the business, so it can keep serving customers?'],
     ['eye','Designer · Marco','Makes sure customers understand how to use the product, and enjoy using it.'],
     ['shield','Engineer · Dev','Makes sure the product is reliable, stable and does what it promises.']],2)+
   L.note('All three share one job: create value for customers in a way that also creates value for the business.','people'));
  L.done();}},
{part:2,src:'Chapter 1 · Who this book is for',pts:1,run(L){
  L.h(L.kick('try','A trio or a crowd?')+'<h1 class="q">Fernway’s data analyst and the support lead also want to join every discovery decision. What does the book say to weigh?</h1>');
  L.mc(L.card,['More views help, but decisions get slower','Only three people are ever allowed in','Analysts and support staff slow teams down'],0,
   'Right. Your “trio” can be a quartet or a quintet. Every extra person also adds time to each decision, so balance speed with inclusion.',
   'The book welcomes a fourth or fifth member when it makes sense. The cost is speed: more people, slower decisions. Weigh the two.');}},
{part:2,src:'Chapter 1 · The prerequisite mindsets',run(L){
  L.h(L.kick('learn','Six mindsets')+'<h1 class="q">The habits only work with the right mindset. Tap each card.</h1>');
  L.flips(L.card,[
   ['1 · Outcome-oriented','Judge success by the value your work creates for customers and the business, not by the code you shipped.'],
   ['2 · Customer-centric','Put customer needs on par with business needs. Business exists to serve a customer.'],
   ['3 · Collaborative','Decide as a team, using each person’s expertise, instead of passing work down a line.'],
   ['4 · Visual','Draw and map what you know. People are strong spatial thinkers.'],
   ['5 · Experimental','Think like a scientist: name your assumptions and gather evidence.'],
   ['6 · Continuous','Do discovery all the time, not only at the start of a project.']],
   'Tools and frameworks don’t help much if the mindset stays the same. These six come first.');}},
{part:2,src:'Chapter 1 · The prerequisite mindsets',pts:6,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which mindset is missing?',['Outcome-oriented','Customer-centric','Collaborative','Visual','Experimental','Continuous'],[
   ['Priya decides, then hands it to Marco to design, who hands it to Dev to code.',2,'Passing work down a line is the siloed model. Collaborative teams decide together.'],
   ['The team throws a party for shipping 12 features, without checking if anyone cooks more.',0,'Counting features shipped is output thinking. Success is the change it made.'],
   ['Fernway runs one big research project in January, then stops talking to customers.',5,'Discovery done once, at the start, is the project mindset.'],
   ['Dev is sure freezer meals will be a hit, so the trio skips gathering any evidence.',4,'A scientist would spot the assumption and test it first.'],
   ['The trio argues for an hour, and nobody draws or maps what they know.',3,'Sketching their options would let them think spatially and see the same picture.'],
   ['To hit a sales target, the team quietly hides the “skip a week” button.',1,'This serves the business at the customer’s cost. Customer needs should sit on par with business needs.']]);}},

/* ---------- PART 4: THE DEFINITION ---------- */
{part:3,src:'Chapter 1 · A working definition of continuous discovery',run(L){
  L.h(L.kick('learn','The working definition')+'<h1 class="q">Four parts, all required</h1>'+
   L.prose('Customer interviews, usability tests and A/B tests are common. What’s rare is doing them in a structured way the team can keep up week after week. So the book defines continuous discovery as:')+
   L.list([['cal','At least weekly','At a minimum, weekly '+L.g('touchpoint','touchpoints')+' with customers.'],
     ['people','By the team building it','The trio does the research itself, not an outside agency.'],
     ['flask','Small research activities','Small, quick studies that fit into a normal week.'],
     ['target','In pursuit of an outcome','Every touchpoint serves a clear goal, not research for its own sake.']],3)+
   '<p class="small" style="margin-top:10px">Why weekly? The team makes decisions every day. Talk to customers only monthly, and you make a month’s worth of decisions without them.</p>');
  L.done();}},
{part:3,src:'Chapter 1 · A working definition of continuous discovery',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">Does Fernway’s current research meet the definition?</h1>');
  L.beats(L.card,[
   ['Today','Each spring, a research agency interviews 40 Fernway customers. Two months later it sends a 60-page report.'],
   ['Check 1 · Weekly?','No. Once a year leaves eleven months of decisions with no fresh customer input.'],
   ['Check 2 · By the team?','No. The agency talks to customers. Priya, Marco and Dev only read about them.'],
   ['Check 3 · Small?','No. It’s one huge study. Answers to this week’s questions arrive months too late.'],
   ['Check 4 · For an outcome?','Partly. The study asks broad questions, not ones tied to a goal the team owns.'],
   ['The new plan','The trio books one customer conversation a week and runs a small test or two, all aimed at getting more delivered meals cooked. (Lesson 3 shows how they set that goal.)']],
   'Run all four checks. Missing even one means the team isn’t doing continuous discovery yet.');}},
{part:3,src:'Chapter 1 · A working definition of continuous discovery',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Which of these teams meets all four parts of the definition?</h1>');
  L.mc(L.card,['An agency interviews customers weekly and sends the trio notes','The trio chats with a customer weekly, with no goal in mind','The trio runs a small study weekly, aimed at the team’s outcome'],2,
   'Weekly, by the team, small, and in pursuit of an outcome. All four parts.',
   'The agency team fails “by the team building the product.” Chatting with no goal fails “in pursuit of an outcome.” Only the third meets all four.');}},
{part:3,src:'Chapter 1 · A working definition of continuous discovery',pts:1,
 solve:async L=>{const c=L.$('#cad').children;c[0].click();c[1].click();},
 run(L){
  const MODES=[['Once a month',[0]],['Every week',[0,1,2,3]]];const seen=new Set();
  L.h(L.kick('pr','See it happen')+'<h1 class="q">The trio makes product decisions every working day. Pick how often they talk to customers, and watch which days are informed.</h1><div id="cad"></div>'+
   '<div style="background:var(--soft);border-radius:16px;padding:14px;margin:8px 0 6px"><div class="small" id="cs" style="margin-bottom:8px">Choose a rhythm above.</div><div id="grid"></div>'+
   '<div class="small" style="margin-top:6px">'+L.ic('chat')+' = customer conversation · green = decided with input from that week</div></div><div id="cq"></div>');
  const draw=j=>{const t=MODES[j][1];let g=0;
    L.$('#grid').innerHTML=[0,1,2,3].map(w=>'<div style="display:flex;align-items:center;gap:6px;margin:4px 0"><span class="small" style="width:56px">Week '+(w+1)+'</span>'+
      [0,1,2,3,4].map(d=>{const on=t.includes(w);if(on)g++;return '<span style="width:30px;height:30px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;background:'+(on?'var(--ok-bg)':'var(--card)')+';border:2px solid '+(on?'var(--ok-line)':'var(--line)')+'">'+(on&&d===0?L.ic('chat'):'')+'</span>';}).join('')+'</div>').join('');
    L.$('#cs').innerHTML='<b>'+g+' of 20</b> decision days had fresh customer input';};
  MODES.forEach((m,j)=>{const b=document.createElement('button');b.className='chip';b.innerHTML=L.ic('cal')+m[0];b.onclick=()=>{[...L.$('#cad').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(j);draw(j);
    if(seen.size===2&&!L.$('#cq').innerHTML){const q=L.$('#cq');q.innerHTML='<h2 class="sub">Priya says, “Monthly is plenty, we learn a lot each time.” What’s the real cost?</h2>';
      L.mc(q,['Three weeks of decisions with no customer input','Monthly talks take more time to prepare'],0,
       'Right. The team decides every day. Between monthly talks, those choices rest on guesses. That’s why the book sets weekly as the minimum.',
       'Prep time isn’t the issue. The team decides every day, so monthly talks leave weeks of decisions made without customers.');}};L.$('#cad').appendChild(b);});}},
{part:3,src:'Chapter 1 · A working definition of continuous discovery',pts:4,run(L){
  L.h(L.kick('pr','What’s missing?')+'<h1 class="q">Each plan breaks one part of the definition. Which one?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Weekly','By the team','Small','Outcome'],[
   ['Every week, a contractor interviews Fernway customers and emails Priya a summary.',1,'The contractor hears the customers, not the trio. The people building the product must do it.'],
   ['The trio interviews a customer every other month.',0,'Every other month leaves weeks of daily decisions without customer input.'],
   ['The trio talks to customers weekly, but nobody can say what goal it serves.',3,'Research for its own sake. Each touchpoint should serve a desired outcome.'],
   ['Each week the trio feeds one giant study whose results arrive in six months.',2,'Six months is too slow for daily questions. Small activities give fast answers.']],
   'All four parts work together: often, by the team, small, and aimed at an outcome.');}},
{part:3,src:'Chapter 1 · A working definition of continuous discovery',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Tap each piece until Fernway’s new team rule matches the definition.</h1>');
  L.sentence(L.card,[['At most','At a minimum'],['monthly','weekly','yearly'],['an agency','the trio','leadership'],['runs one big study','runs small research activities'],['for research’s sake','to get more meals cooked']],[1,1,1,1,1],
   [['“At most” sets a ceiling. The definition sets a floor: weekly is the minimum.'],['Monthly leaves weeks of decisions without input.','Yearly is far too slow for daily decisions.'],['An agency isn’t the team building the product.','Leadership isn’t the team building the product.'],['One big study gives slow answers. Keep activities small.'],['Research for its own sake has no direction. Aim at the outcome.']],
   'At a minimum weekly, the trio runs small research activities to get more meals cooked. All four parts, in one rule.');}},
{part:3,src:'Chapter 1 · A working definition of continuous discovery',pts:1,run(L){
  L.h(L.kick('pr','Final check')+'<h1 class="q">Dev says: “We already run A/B tests and the odd interview, so we do continuous discovery.” Is Dev right?</h1>');
  L.mc(L.card,['Yes, those are the right activities','Not yet, it needs a steady weekly habit','No, A/B tests don’t count as discovery'],1,
   'The activities are fine. What’s missing is the structure: a weekly rhythm, run by the trio, aimed at an outcome.',
   'A/B tests and interviews are useful discovery tools. The book’s point is that doing them now and then isn’t enough: it must be a sustainable weekly habit, aimed at an outcome.');}}
  ]
});
</script>
</body>
</html>
