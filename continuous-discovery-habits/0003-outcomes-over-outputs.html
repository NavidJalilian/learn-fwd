<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outcomes Over Outputs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0003', title:'Outcomes over outputs', minutes:20, icon:'target',
  goals:['Tell an output from an outcome, instantly','Turn “grow revenue” into a goal a team can own','Spot the five traps teams fall into'],
  parts:['Why outcomes','Three kinds','Setting it','Traps'],
  read:'Read chapter 3 of the book for the full dog-food story and the research.',
  cheatsheet:[
    '<b>Output</b> = what you build. <b>Outcome</b> = what people do differently because of it.',
    '<b>Business outcomes</b> lag and are shared. <b>Product outcomes</b> lead, and the team can move them alone.',
    'Business to product outcome: find the customer behavior that drives it, then check <b>behavior, control, speed</b>.',
    '<b>Traction metrics</b> only for newer teams, or for tuning a feature customers already want.',
    'Set the outcome <b>together</b>: the leader brings context, the trio brings customer knowledge. Nobody brings the solution.',
    'New outcome? <b>Learning goal first</b>, number later.',
    'Traps: too many outcomes, switching often, goals per person, outputs in disguise, no health metric.'
  ],
  steps:[
/* ---------- PART 1: WHY OUTCOMES ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Fernway’s CEO says “grow revenue.” The team ships a quick-recipe filter. One week later, revenue hasn’t moved. Did the filter fail?</h1>');
  L.mc(L.card,['Yes, the filter clearly failed','It’s too early to tell yet'],1,
   'Revenue moves slowly, so one week tells you almost nothing. This lesson is about choosing a number that gives you an answer sooner.');}},
{part:0,src:'Chapter 3 · opening quote',run(L){
  L.h(L.kick('learn','Outputs and outcomes')+'<h1 class="q">Two words this whole book depends on</h1>'+
   L.prose('An <b>output</b> is something your team builds: a feature, a screen, an app. An <b>outcome</b> is what changes because of it, meaning what people start doing differently.')+
   L.quote('An outcome is a change in human behavior that drives business results.','Josh Seiden, quoted at the start of chapter 3')+
   L.flow([['box','Output','Quick-recipe filter','what we build'],['people','Outcome','More meals get cooked','what people do'],['trend','Result','Fewer cancellations','what the company gets']])+
   L.prose('Shipping the filter proves nothing. It’s a <i>bet</i> that people will cook more. Only the outcome tells you if the bet paid off.'));
  L.done();}},
{part:0,src:'Chapter 3 · Why outcomes?',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Which one is an output?</h1>');
  L.mc(L.card,['Launch a new weekly meal planner','More customers plan their week'],0,
   'A meal planner is something you build. “More customers plan their week” is the change you hope it causes.',
   'The meal planner is the thing you build (the output). Customers planning more is the change you hope for (the outcome).');}},
{part:0,src:'Chapter 3 · Why outcomes?',run(L){
  L.h(L.kick('learn','Why manage by outcomes?')+'<h1 class="q">What you hand a team changes how it works</h1>'+
   L.prose('Most teams get a <b>roadmap</b>: a list of features with deadlines. The book argues for handing them an <b>outcome</b> instead. That brings three benefits:')+
   L.list([['people','Freedom to choose','The team picks the solution. They know the customers and the technology best.'],
     ['cycle','Room for doubt','A roadmap pretends we already know which features will work. An outcome admits we don’t, so the team can switch ideas when one fails.'],
     ['target','A way to keep score','Everyone knows what success means, so they can judge each experiment and choose which problems to work on.']],1)+
   '<p class="small" style="margin-top:10px">Without a clear outcome, the book warns, discovery can drag on with no end.</p>');
  L.done();}},
{part:0,src:'Chapter 3 · Why outcomes?',pts:1,
 solve:async L=>{L.$('#flop').click();},
 run(L){
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Both teams start with the same idea: quick recipes. Press the button and watch what happens when it flops.</h1>'+
   L.lanes([['map','Team Roadmap','Told: “Ship quick recipes, a meal planner and a recipe filter by June.”<div class="res" id="la"></div>',1],
            ['target','Team Outcome','Told: “Get more delivered meals cooked.”<div class="res" id="lb"></div>',2]])+
   '<button class="btn pri" id="flop" style="margin-top:14px">'+L.ic('play')+'Quick recipes flop</button><div id="hq"></div>');
  L.$('#flop').onclick=function(){this.remove();
    L.$('#la').innerHTML='<span style="color:var(--no)">Still has to ship the planner and the filter by June, whether they help or not.</span>';
    L.$('#lb').innerHTML='<span style="color:var(--ok)">Drops the idea and tries spoilage reminders next.</span>';
    const q=L.$('#hq');q.innerHTML='<h2 class="sub">Which benefit did Team Outcome just use?</h2>';
    L.mc(q,['Room for doubt','A way to keep score'],0,
     'Their goal never promised quick recipes would work, so dropping the idea cost them nothing.',
     'Keeping score told them the idea flopped. Being free to drop it and try something else is <i>room for doubt</i>.');};}},

/* ---------- PART 2: THREE KINDS ---------- */
{part:1,src:'Chapter 3 · opening story, summarized',run(L){
  L.h(L.kick('ex','A real story from the book')+'<h1 class="q">A dog-food company learns that a good outcome isn’t as simple as it sounds</h1>');
  L.beats(L.card,[
   ['The goal','A product team at a dog-food subscription company is told to improve <b>customer retention</b>, measured at 90 days.'],
   ['The problem','To see if an idea worked they must wait <b>90 days</b>. They cut it to 30. Still too slow. They cut it to 5 days.'],
   ['The doubt','Now it’s fast, but they’re unsure 5-day retention predicts the long-term number. Fast, but maybe meaningless.'],
   ['The discovery','They talk to customers and find two reasons people leave: some don’t see why tailor-made food is worth it, and some dogs don’t like the food.'],
   ['The fix','That gives two numbers they can move and measure <b>right away</b>: how many customers see the value, and how many dogs like the food. If these go up, retention should follow.']],
   'The number the business cared about was too slow to steer by. The team needed a faster number that <i>predicts</i> it.');}},
{part:1,src:'Chapter 3 · types of outcomes',pts:1,
 solve:async L=>{L.$('#po').children[0].click();L.$('#ship').click();},
 run(L){
  let p=null;const N=['Meals cooked','Cancellations falling','Revenue'],C=['var(--ok-strong)','var(--h2)','var(--h3)'];
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">Fernway ships a fix that actually works. Which number moves first?</h1><div id="po"></div>'+
   '<div id="race" hidden><div style="display:flex;align-items:center;justify-content:space-between;margin-top:6px"><div><div class="small">Simulated time</div><div class="week" id="wk">Week 0</div></div><button class="btn pri" id="ship">'+L.ic('play')+'Run 12 weeks</button></div>'+
   N.map((n,j)=>'<div class="meterrow"><div class="lb">'+n+'</div><div class="meter"><div id="m'+j+'" style="background:'+C[j]+'"></div></div></div>').join('')+'</div>');
  N.forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=n;b.onclick=()=>{if(p!==null)return;p=j;b.classList.add('sel');L.$('#race').hidden=false;};L.$('#po').appendChild(b);});
  L.$('#ship').onclick=function(){this.remove();let w=0;const R=[[1,3],[4,8],[8,12]];
    const t=setInterval(()=>{w++;const wk=L.$('#wk');if(!wk){clearInterval(t);return;}wk.textContent='Week '+w;R.forEach((r,j)=>{const el=L.$('#m'+j);if(el)el.style.width=Math.round(Math.max(0,Math.min(1,(w-r[0]+1)/(r[1]-r[0]+1)))*100)+'%';});
      if(w>=12){clearInterval(t);L.award(p===0);
        L.sheet(p===0?'ok':'no',p===0?'You called it!':'Meals cooked moved first','It’s a '+L.g('leading','leading indicator')+': it moves early and predicts the rest. Revenue is '+L.g('lagging','lagging')+'. By the time it moves, customers have already left. The book says to give teams the leading number.');L.done();}},200);};}},
{part:1,src:'Chapter 3 · Exploring different types of outcomes',run(L){
  L.h(L.kick('learn','Three kinds of outcome')+'<h1 class="q">Not all outcomes are equally useful to a team</h1>'+
   L.prose('The book separates three kinds of measure. Each is narrower than the one above it.')+
   L.tiers([['trend','Business outcome','How the business is doing: revenue, costs, market share. Usually <b>lagging</b>, and many teams affect it.','Fernway: grow subscription revenue'],
            ['people','Product outcome','What customers do in the product that drives the business. <b>Leading</b>, and the product team can move it alone.','Fernway: more delivered meals get cooked',true,'Best for teams'],
            ['pointer','Traction metric','How much people use <b>one specific feature</b>.','Fernway: more people use the recipe filter']])+
   '<p class="small" style="margin-top:10px">The next screens show why the other two fall short.</p>');
  L.done();}},
{part:1,src:'Chapter 3 · business outcomes to product outcomes',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">Turning “grow revenue” into a product outcome, step by step</h1>');
  L.beats(L.card,[
   ['Start','The CEO says: <b>grow revenue</b>. That’s a business outcome: slow, and shared by every team.'],
   ['Ask','<i>What customer behavior drives revenue at Fernway?</i> Customers who keep subscribing, and they keep subscribing when they actually <b>cook</b> what arrives.'],
   ['Draft','Candidate: <b>“More delivered meals get cooked each week.”</b>'],
   ['Check 1 · Behavior','Is it something customers <i>do</i>? Yes, cooking is a behavior.'],
   ['Check 2 · Control','Can the product team move it without sales or marketing? Yes, through recipes, reminders, portions and timing.'],
   ['Check 3 · Speed','Can you read it weekly, and is it free of any one feature? Yes and yes. It’s a product outcome.']],
   'Start from the business goal, ask which customer behavior drives it, then run the three checks: behavior, control, speed.');}},
{part:1,src:'Chapter 3 · types of outcomes',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Which of these is a product outcome?</h1>');
  L.mc(L.card,['Increase yearly subscription revenue','More customers cook within two days','More customers use the portion slider'],1,
   'It’s a customer behavior, it moves quickly, and it isn’t tied to one feature.',
   'Revenue is a business outcome. The portion slider is one feature, so it’s a traction metric. Cooking within two days is the product outcome.');}},
{part:1,src:'Chapter 3 · product vs business outcomes',run(L){
  L.h(L.kick('learn','Why not give the team the business outcome?')+'<h1 class="q">Shared goals make it easy to blame someone else</h1>'+
   L.prose('Business outcomes usually depend on many teams. Customers might cancel because of the product, a confusing price, or slow support replies.')+
   L.flow([['box','Product','Meals cooked','',2],['trend','Marketing','Clear pricing','',3],['clock','Support','Fast replies','',4]],false)+
   L.prose('If all three share one goal like “keep customers 90 days,” each can point at the others. The fix: <b>give each team the number it controls.</b> Together they still add up to retention. For the '+L.g('trio','product trio')+', that’s a product outcome.'));
  L.done();}},
{part:1,src:'Chapter 3 · product vs business outcomes',pts:4,run(L){
  L.h(L.kick('pr','Who can fix what?')+'<h1 class="q">Fernway customers cancel for four reasons. Which team could fix each one?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Product','Marketing','Support'],[
   ['Meals spoil before customers get to cook them',0,'The product team can change recipes, reminders and portions.'],
   ['The price jumps by surprise after the free trial',1,'Pricing messages belong to marketing.'],
   ['Support takes two days to reply to emails',2,'Reply times belong to customer support.'],
   ['Recipes take too long for a weeknight',0,'Recipe design lives in the product.']],
   'Each team gets its own number. Together they drive retention, and nobody can hide behind anyone else.');}},
{part:1,src:'Chapter 3 · product outcomes vs traction metrics',run(L){
  L.h(L.kick('learn','The traction-metric trap')+'<h1 class="q">A goal that names a feature has already picked the answer</h1>'+
   L.prose('“More people use the recipe filter” looks like an outcome, since it’s a number. But it quietly assumes the filter is the right solution. If customers don’t want it, the team is stuck.')+
   L.prose('So a traction metric is really an '+L.g('output','output')+' in disguise. The book allows it in only two cases:')+
   L.list([['A newer team','Tuning one feature is a safe way to learn discovery before taking on open problems.'],
           ['Tuning a feature customers already want','You know people use it and it just needs to work better. That’s tuning, not finding new ideas.']],2));
  L.done();}},
{part:1,src:'Chapter 3 · product outcomes vs traction metrics',pts:1,
 solve:async L=>{const g=L.$('#gg').children;g[0].click();g[1].click();},
 run(L){
  const ID=['Quick weeknight recipes','Spoilage reminders','Plan meals around shifts','Freezer-friendly meals','Redesign the recipe filter'],GL=[[0,1,2,3,4],[4]],GN=['More meals get cooked','More recipe-filter use'];const seen=new Set();
  L.h(L.kick('pr','See the trap')+'<h1 class="q">Pick a goal and see which ideas could move it. Try both.</h1><div id="gg"></div>'+
   '<div style="background:var(--soft);border-radius:16px;padding:14px;margin:8px 0 6px;min-height:120px"><div class="small" id="ic" style="margin-bottom:8px">Choose a goal above.</div><div id="ii"></div></div><div id="gq"></div>');
  GN.forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.innerHTML=L.ic('target')+n;b.onclick=()=>{[...L.$('#gg').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(j);
    L.$('#ii').innerHTML=ID.map((d,x)=>'<span class="chip static'+(GL[j].includes(x)?' ok':'')+'" style="'+(GL[j].includes(x)?'':'opacity:.35')+'">'+(GL[j].includes(x)?L.ic('check'):L.ic('lock'))+d+'</span>').join('');
    L.$('#ic').innerHTML='<b>'+GL[j].length+' of 5</b> ideas could move this goal';
    if(seen.size===2&&!L.$('#gq').innerHTML){const q=L.$('#gq');q.innerHTML='<h2 class="sub">Which goal should Fernway’s senior team get?</h2>';
      L.mc(q,GN,0,'Five ideas against one. The product outcome leaves the team room to find what really works.','Only one idea fits that goal. If customers don’t want the filter, the team has nowhere to go.');}};L.$('#gg').appendChild(b);});}},
{part:1,src:'Chapter 3 · when traction metrics are fine',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Is a traction metric OK here?',['A traction metric is fine','Give a product outcome'],[
   ['A brand-new team, still learning discovery, is asked to improve the existing recipe filter.',0,'Tuning one feature is a good training ground for a newer team.'],
   ['A senior team is told to “get people using the new meal planner.” No customer has asked for it.',1,'Nobody knows customers want the planner yet. That’s open discovery, so it needs a product outcome.'],
   ['Customers use the filter every day, but its results are poor. The team is asked to tune it.',0,'We already know customers want it. This is tuning, not discovery.'],
   ['An experienced team is asked to find new ways to cut food waste.',1,'“Find new ways” is discovery. Give them room with a product outcome.']]);}},
{part:1,src:'Chapter 3 · types of outcomes',pts:6,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Mixed review',['Output','Traction metric','Product outcome','Business outcome'],[
   ['“Launch a calendar sync for shift workers.”',0,'It’s a thing to build, and says nothing about what changes.'],
   ['“Grow subscription revenue 20% this year.”',3,'Revenue measures the business, and it lags.'],
   ['“Fewer delivered kits are thrown away uncooked.”',2,'It’s customer behavior the product team can influence directly.'],
   ['“More customers use the recipe filter.”',1,'It counts use of one feature.'],
   ['“Reduce cancellations in the first 90 days.”',3,'Retention is a business result, and 90 days is slow to read.'],
   ['“Increase the number of recipe reviews.”',1,'It counts use of the review feature, not a change that matters to the business.']]);}},

/* ---------- PART 3: SETTING IT ---------- */
{part:2,src:'Chapter 3 · a two-way negotiation',run(L){
  L.h(L.kick('learn','Who sets the outcome?')+'<h1 class="q">The outcome is agreed together, not handed down</h1>'+
   L.prose('The book calls it a <b>two-way negotiation</b> between the product leader (say, the head of product) and the product trio.')+
   L.lanes([['trend','The leader brings','What matters most to the business right now, and which customers or regions to focus on.',3],
            ['people','The trio brings','Knowledge of customers and technology, and an honest estimate of how far the number can move, usually in one quarter.',2]])+
   L.note('<b>Nobody brings the solution.</b> Which features to build comes out of discovery later.','lock')+
   '<p class="prose" style="margin-top:16px">Want a bigger result? Then both sides accept bigger bets and more risk, or the team gets more people or fewer other tasks.</p>'+
   '<p class="small">The book cites research: teams that help set their own goals take more initiative and perform better.</p>');
  L.done();}},
{part:2,src:'Chapter 3 · a two-way negotiation',pts:5,run(L){
  L.h(L.kick('pr','Who brings what?')+'<h1 class="q">Sort each item. Careful, one belongs to nobody.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Leader','Trio','Neither'],[
   ['What matters most to the business right now',0,'The leader sees across the whole business.'],
   ['Which customer group to focus on',0,'The leader can narrow the focus for strategic reasons, as long as it stays an outcome.'],
   ['What customers need and what the tech allows',1,'The trio knows customers and technology best.'],
   ['How far the number can move this quarter',1,'The trio estimates this, and the two sides negotiate it.'],
   ['Which features the team will build',2,'Nobody decides this up front. The solution comes out of discovery.']],
   'The leader brings business context, the trio brings customer knowledge, and the solution is found later.');}},
{part:2,src:'Chapter 3 · Do you need S.M.A.R.T. goals?',pts:1,run(L){
  L.h(L.kick('learn','Learning goal first, number later')+'<h1 class="q">Should every goal have a hard number?</h1>'+
   L.prose('Common advice says yes: make goals specific and measurable. Research shows hard, specific goals help on <i>simple</i> tasks.')+
   L.prose('But on <i>complex</i> work like product discovery, a hard number can hurt a team that doesn’t yet know <i>how</i> to reach it. Starting with a <b>learning goal</b> worked better. The number came later.')+
   L.flow([['bulb','1 · Learning goal','Find out what stops people cooking','when the outcome is new'],['target','2 · Performance goal','Raise meals cooked 15% this quarter','once you know what works']])+
   '<div id="lq"><h2 class="sub">Fernway’s team is new to “meals cooked.” Which goal comes first?</h2></div>');
  L.mc(L.$('#lq'),['Raise meals cooked by 25% this quarter','Find out what stops people from cooking'],1,
   'They don’t know what drives it yet, so they learn first.',
   'They don’t know what drives it yet. Learning goal first, number later.');}},
{part:2,src:'Chapter 3 · types of outcomes',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Tap each piece to change it until the sentence is a product outcome Fernway’s team can own.</h1>');
  L.sentence(L.card,[['Fewer','More'],['recipe-filter clicks','dollars of revenue','delivered meals'],['get clicked','get earned','get cooked'],['this year','each week']],[1,2,2,1],
   [['Fewer meals cooked is the opposite of what you want.'],['Filter clicks count one feature, so that’s a traction metric.','Revenue is a business outcome, not a product outcome.'],['Clicking isn’t the behavior that matters here.','Earning is the business side, not the customer’s.'],['A year is too slow to steer by. Pick something you can see weekly.']],
   'It passes all three checks from the worked example: it’s a behavior, the team controls it, and you can read it weekly.');}},

/* ---------- PART 4: TRAPS ---------- */
{part:3,src:'Chapter 3 · common anti-patterns',run(L){
  L.h(L.kick('learn','Five common traps')+'<h1 class="q">Even teams that “get” outcomes fall into these</h1>'+
   L.list([['Too many outcomes at once','Spread across several goals, the team makes a little progress on each and real progress on none. Pick one.'],
     ['Switching outcomes often','Learning what moves a number takes time. Jump every quarter and you never get the payoff. Stay a few quarters.'],
     ['Separate goals per person','The PM, designer and engineer each get their own target and pull three ways. Give the trio one shared outcome.'],
     ['An output posing as an outcome','“Launch the Android app” is a thing to build. Make sure the goal is a number, then ask what it changes.'],
     ['No health metric','Chasing one number can cause harm elsewhere. Watch a '+L.g('health','health metric')+' alongside it.']],4));
  L.done();}},
{part:3,src:'Chapter 3 · common anti-patterns',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Spot the trap',['Too many outcomes at once','Switching outcomes often','Separate goals per person','An output posing as outcome','No health metric watched'],[
   ['This quarter the trio chases retention, sign-ups, reviews and referrals all at once.',0,'Four goals means a little progress on each and real progress on none.'],
   ['Q1: meals cooked. Q2: referrals. Q3: back to meals cooked after a complaint spike.',1,'Every switch restarts the learning. Stick with one for a few quarters.'],
   ['The PM owns revenue, the designer owns usability scores, the engineer owns page speed.',2,'The trio gets pulled three ways. Set one team outcome instead.'],
   ['“Our outcome for Q2: launch the Android app.”',3,'That’s a thing to build. Ask what it should change, such as mobile meals cooked.'],
   ['Meals cooked went up, and nobody noticed that cancellations doubled.',4,'A health metric would have caught the damage.']]);}},
{part:3,src:'Chapter 3 · choosing an output as an outcome',pts:1,
 solve:async L=>{L.$('#sw').click();L.$('#sw').click();L.$('#st').click();},
 run(L){
  const L_=[['Launch a recipe rating feature','output'],['More recipe ratings get written','traction metric'],['More meal choices are made on recipes that show ratings','product outcome'],['More delivered meals get cooked','product outcome'],['Fewer customers cancel','business outcome']];
  let lv=0,first=true;
  L.h(L.kick('pr','Keep asking “so what?”')+L.note('The book’s fix for trap 4 is to question the impact. One team’s goal was “more course reviews,” but reviews could pile up on courses nobody looks at. A better goal counted <i>course views that show reviews</i>.','book')+
   '<h1 class="q" style="margin-top:16px">Your turn. Keep asking “so what?” and stop at the first product outcome.</h1><div class="ladder" id="ld"></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="sw">So what? '+L.ic('down')+'</button><button class="btn pri" id="st">'+L.ic('check')+'Stop here</button></div><div id="lf"></div>');
  const draw=()=>{L.$('#ld').innerHTML=L_.slice(0,lv+1).map((x,j)=>(j?'<div class="conn"></div>':'')+'<div class="rung'+(j===lv?' cur':'')+'">'+(j<lv?'<small>'+x[1]+'</small>':'')+x[0]+'</div>').join('');L.$('#sw').hidden=lv>=L_.length-1;};draw();
  L.$('#sw').onclick=()=>{lv=Math.min(lv+1,L_.length-1);L.$('#lf').innerHTML='';draw();};
  L.$('#st').onclick=()=>{L.$('#lf').innerHTML='';const k=L_[lv][1];
    if(lv===2||lv===3){if(first)L.award(true);
      L.sheet(lv===2?'ok':'info',lv===2?'Right where it should be':'A product outcome, but you passed one',lv===2?'Just like the course reviews, more ratings mean nothing if nobody sees them when choosing. Ratings that shape real choices are the outcome.':'The level above was the first product outcome. Both work, but the closer one links more clearly to your idea.');L.done();}
    else{if(first)L.award(false);first=false;L.fb(L.$('#lf'),lv<2?'<b>Not yet.</b> “'+L_[lv][0]+'” is a '+k+'. Ask “so what?” again.':'<b>Too far.</b> That’s a business outcome: slow, and shared with other teams. Start again and stop sooner.','no');
      if(lv===4){lv=0;setTimeout(()=>{if(L.$('#ld'))draw();},1400);}}};}},
{part:3,src:'Chapter 3 · one outcome above all else',pts:1,run(L){
  L.h(L.kick('pr','Health check')+'<h1 class="q">To get more meals cooked, Fernway starts sending three push reminders a day. What else should the team watch?</h1><div id="hq"></div>');
  L.mc(L.$('#hq'),['How many reminders get sent each day','Opt-outs from reminders and cancellations','How many recipes are in the catalog'],1,
   'Those are health metrics. The goal becomes “more meals cooked <i>without</i> annoying people into leaving.”',
   'Look for the harm, not the effort. Opt-outs and cancellations show whether chasing meals cooked is hurting something else.');}}
  ]
});
</script>
</body>
</html>
