<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supercharged Ideation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0008', title:'Supercharged ideation', minutes:19, icon:'bulb',
  goals:['Explain why your first idea is rarely your best one','Run ideation as “alone, share, alone again” instead of a group brainstorm','Narrow 15 to 20 ideas down to three with dot voting'],
  parts:['Quantity first','Alone, then together','Getting unstuck','Choosing three'],
  read:'Read chapter 8 of the book for the research behind brainstorming and more tips for getting unstuck.',
  glossary:{
    'target-opp':'Target opportunity: the one customer need the team chose to work on next.',
    'production-blocking':'Production blocking: losing your own idea because someone else spoke first.',
    'incubation':'Incubation: your brain keeps working on a problem after you stop thinking about it.',
    'analogous':'Analogous product: a product from any industry that solves a similar problem to yours.',
    'dot-vote':'Dot voting: each person gets a few votes to place on ideas; the ideas with the most votes move on.'
  },
  cheatsheet:[
    '<b>Your first idea is rarely your best.</b> More ideas lead to more varied and more original ones, and the most original tend to come late.',
    'Push hard only on <b>strategic</b> opportunities. Routine flows, like “forgot password,” don’t need reinventing.',
    'People working <b>alone</b> beat brainstorming groups. Groups lose out to loafing, conformity, production blocking and the weakest member.',
    'Group brainstorming <i>feels</i> better because nobody gets stuck: the <b>illusion of group productivity</b>.',
    'The method: review the target, <b>ideate alone, share, ideate alone again</b>. Repeat until you have 15 to 20 ideas.',
    'Stuck? Take breaks, sleep on it, look at <b>analogous products</b>, think about <b>extreme users</b>, allow wild ideas.',
    'Evaluate as a group: drop ideas that miss the target, then <b>dot-vote</b> down to three, each with a strong advocate.',
    'Traps: no diverse voices, variations of one idea, a single session, picking ideas that miss the target.'
  ],
  steps:[
/* ---------- PART 1: QUANTITY FIRST ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Fernway’s trio picked its '+L.g('target-opp','target opportunity')+': “Chopping takes ages,” which sits under “Recipes take too long on weeknights.” Priya instantly thinks: use fewer vegetables! How likely is that first idea to be the best one?</h1>');
  L.mc(L.card,['Quite likely, since it came to Priya so quickly','Not very likely, since it was only the first'],1,
   'Our brains love to close the loop and jump to an answer. This lesson is about keeping the loop open longer.',
   'Coming quickly doesn’t make an idea good. Research on creativity says first ideas are rarely the best ones.');}},
{part:0,src:'Chapter 8 · Quantity Leads to Quality',run(L){
  L.h(L.kick('learn','Quantity leads to quality')+'<h1 class="q">The more ideas you have, the better they get</h1>'+
   L.prose('When we hear a problem, our brain jumps to a solution. That’s human nature. But creativity research says our first idea is rarely our best.')+
   L.quote('Creative teams know that quantity is the best predictor of quality.','Leigh Thompson, quoted at the start of chapter 8')+
   L.flow([['layers','Fluency','How many ideas'],['compass','Flexibility','How different they are'],['star','Originality','How new they are']],false)+
   L.prose('Researchers judge creativity on these three measures, and they move together: as the <b>number</b> of ideas grows, so do their <b>variety</b> and <b>originality</b>. The most original ideas tend to show up near the <i>end</i> of a session.'));
  L.done();}},
{part:0,src:'Chapter 8 · Quantity Leads to Quality',run(L){
  L.h(L.kick('learn','Too many ideas, too few per need')+'<h1 class="q">A full backlog doesn’t mean you’ve pushed hard enough</h1>'+
   L.prose('Most teams drown in ideas: long backlogs, customer requests, a never-ending roadmap. But map each one onto the opportunities on your tree, and most needs end up with only <b>one or two</b> ideas. Those are usually first ideas.')+
   L.lanes([['lock','No need to reinvent','Routine flows like “forgot password.” A standard solution is fine (you should still test it).',4],
            ['flame','Worth a real push','Strategic opportunities where you want to stand out from competitors. Generate many ideas here.',2]])+
   '<p class="small" style="margin-top:10px">So the goal isn’t “more ideas everywhere.” It’s more ideas for the opportunity you chose to work on.</p>');
  L.done();}},
{part:0,src:'Chapter 8 · Quantity Leads to Quality',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Dev maps Fernway’s 40-item backlog onto the tree. “Chopping takes ages” has two ideas under it. What does that tell the trio?</h1>');
  L.mc(L.card,['They likely have only first ideas for it so far','They already have more than enough ideas for it'],0,
   'Two ideas for one need is typical, and both are probably first, obvious ideas. A strategic need like this one deserves many more.',
   'A long backlog can hide the fact that each need has only one or two first ideas. This one needs many more before choosing.');}},
{part:0,src:'Chapter 8 · Quantity Leads to Quality',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Worth a big ideation push?',['Push for many ideas','A standard fix is fine'],[
   ['Customers can’t reset their password.',1,'A well-known flow. Use the standard solution, and still test it.'],
   ['Chopping takes ages for busy parents like Maya on weeknights.',0,'This is core to Fernway’s outcome and a chance to stand out. Push for many ideas.'],
   ['Customers want to change their delivery address.',1,'Routine account work. No need to reinvent it.'],
   ['Sam is bored of the same kinds of recipes.',0,'A strategic need where a fresh solution could set Fernway apart.']]);}},
{part:0,src:'Chapter 8 · Quantity Leads to Quality',pts:1,
 solve:async L=>{L.$('#po').children[2].click();L.$('#go8').click();},
 run(L){
  let p=null;
  const ID=[['Use fewer vegetables',1],['Bigger, rougher chop sizes',1],['A “low-chop” recipe tag',1],['Knife-skills video tips',2],['A chopper gadget in the box',2],['Pre-chopped vegetables',2],['Recipes built on no-chop ingredients',3],['A Sunday batch-chop guide',3],['Herbs sent as ready-made pastes',3],['Chop once, cook three meals',4],['Kids’ chopping jobs built into recipes',4],['A neighbor chopping swap',4]];
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">The trio lists ideas for “Chopping takes ages.” Where in the list will the most original ideas show up?</h1><div id="po"></div>'+
   '<div id="run" hidden><button class="btn pri" id="go8" style="margin:8px 0">'+L.ic('play')+'Generate 12 ideas</button><div id="il"></div></div>');
  ['Near the start','In the middle','Near the end'].forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=n;b.onclick=()=>{if(p!==null)return;p=j;b.classList.add('sel');L.$('#run').hidden=false;};L.$('#po').appendChild(b);});
  L.$('#go8').onclick=function(){this.remove();let i=0;
    const t=setInterval(()=>{const il=L.$('#il');if(!il){clearInterval(t);return;}const d=ID[i];
      il.insertAdjacentHTML('beforeend','<div class="meterrow"><div class="lb">'+(i+1)+'. '+d[0]+'</div><div class="meter"><div style="width:'+d[1]*25+'%;background:var(--h'+d[1]+')"></div></div></div>');i++;
      if(i>=ID.length){clearInterval(t);L.award(p===2);
        L.sheet(p===2?'ok':'no',p===2?'You called it!':'They came near the end','The bars show how original each idea is. The first few are the obvious ones. Variety and originality grew as the list grew, just like the research says. Stop early and you never reach them.');L.done();}},200);};}},

/* ---------- PART 2: ALONE, THEN TOGETHER ---------- */
{part:1,src:'Chapter 8 · The Problem With Brainstorming',run(L){
  L.h(L.kick('learn','Where brainstorming came from')+'<h1 class="q">Four rules from 1953 that teams still use</h1>'+
   L.prose('Alex Osborn, an advertising executive, made brainstorming popular in his 1953 book <i>Applied Imagination</i>. He asked groups to meet face to face and follow four rules:')+
   L.list([['Go for quantity','Generate as many ideas as you can.'],
     ['Defer judgment','Keep coming up with ideas separate from judging them.'],
     ['Welcome unusual ideas','Odd ideas are allowed, even encouraged.'],
     ['Combine and improve','Build on each other’s ideas.']],1)+
   '<p class="small" style="margin-top:10px">The rules are sound. The problem, as researchers found, is doing it all <b>as a group</b>.</p>');
  L.done();}},
{part:1,src:'Chapter 8 · The Problem With Brainstorming',run(L){
  L.h(L.kick('ex','What the research found')+'<h1 class="q">Decades of studies put brainstorming groups to the test</h1>');
  L.beats(L.card,[
   ['The setup','Researchers compared a brainstorming group with the same number of people coming up with ideas <b>alone</b>.'],
   ['The result','Study after study, the people working alone won. They came up with <b>more</b> ideas, <b>more varied</b> ideas and <b>more original</b> ideas.'],
   ['The puzzle','So why do so many people swear by group brainstorming? Groups rated their own work highly and enjoyed it.'],
   ['The answer','In a group, other people’s ideas help you when you get stuck. You spend less time stuck, so it <i>feels</i> more productive. Researchers call this the <b>illusion of group productivity</b>.']],
   'Working alone is harder but produces better ideas. Group brainstorming feels easier, so we mistake comfort for results.');}},
{part:1,src:'Chapter 8 · The Problem With Brainstorming',run(L){
  L.h(L.kick('learn','Why groups do worse')+'<h1 class="q">Four things drag a brainstorming group down</h1>'+
   L.list([['people','Social loafing','People work less hard in a group. Others will carry it.'],
     ['layers','Conformity','Early ideas set the tone. Ideas end up cautious and alike, and people hold back ideas they fear others will judge.'],
     ['chat',L.g('production-blocking','Production blocking'),'You’re about to speak, someone jumps in, and your idea is gone.'],
     ['down','Downward norm setting','The group sinks to the level of its weakest member instead of rising to its strongest.']],3));
  L.done();}},
{part:1,src:'Chapter 8 · The Problem With Brainstorming',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">In a team brainstorm, Marco is about to share an idea when Dev starts talking. A minute later, Marco can’t remember it. What happened?</h1>');
  L.mc(L.card,['Social loafing','Production blocking','Downward norm setting'],1,
   'Someone else spoke first and Marco lost an idea. That’s production blocking.',
   'Marco wasn’t slacking or held back by a weak member. Marco lost the idea because Dev spoke first: production blocking.');}},
{part:1,src:'Chapter 8 · The Problem With Brainstorming',run(L){
  L.h(L.kick('learn','The best of both')+'<h1 class="q">Come up with ideas alone, but share them with the group</h1>'+
   L.prose('Can you get the group’s help with getting unstuck <i>and</i> the better ideas from working alone? Yes. Researchers Runa Korde and Paul Paulus found that switching between the two works.')+
   L.flow([['person','Alone','Write your own ideas'],['people','Share','Hear everyone’s ideas'],['person','Alone again','Write new ideas, inspired by theirs']])+
   L.prose('People never came up with ideas <i>as a group</i>. But hearing others’ ideas inspired better ideas in the next solo round. The method later in this lesson uses exactly this pattern.'));
  L.done();}},
{part:1,src:'Chapter 8 · The Problem With Brainstorming',pts:4,run(L){
  L.h(L.kick('pr','Name the drag')+'<h1 class="q">Fernway runs one big group brainstorm. Which problem shows up in each moment?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Social loafing','Conformity','Production blocking','Downward norm'],[
   ['Priya’s first idea is “fewer vegetables.” Every idea after it is a small tweak on fewer vegetables.',1,'The early idea set the tone, and later ideas stayed close to it.'],
   ['A support agent stays quiet all session, figuring the trio will come up with the ideas anyway.',0,'Relying on others to do the work is social loafing.'],
   ['Dev keeps losing ideas because three people are talking at once.',2,'Ideas get lost in the rush of others speaking: production blocking.'],
   ['One person contributes very little, and soon the whole room slows down to match.',3,'The group drops to the level of its weakest member.']],
   'Each problem disappears when people come up with ideas alone first, then share.');}},

/* ---------- PART 3: GETTING UNSTUCK ---------- */
{part:2,src:'Chapter 8 · Getting Unstuck',run(L){
  L.h(L.kick('learn','Getting unstuck')+'<h1 class="q">Everyone gets stuck. Here’s what helps.</h1>'+
   L.prose('Working alone, you <i>will</i> run dry. That doesn’t mean you aren’t creative. The book insists everyone is, and that nobody is better placed to solve your customers’ problems than your team.')+
   L.list([['clock','Spread it out','Short bursts between meetings, a walk after lunch, different times of day. Don’t sit for an hour.'],
     ['cycle','Sleep on it',L.g('incubation','Incubation')+': your brain keeps working in the background. Fresh ideas often come the next day.'],
     ['compass','Look at analogous products','Start with competitors, then look wider: who else, in any industry, solves a similar problem?'],
     ['people','Think of extreme users','Power users, first-timers, people with disabilities, people in remote places, the young, the old.'],
     ['star','Allow wild ideas','Pretend you have a magic wand. Wild ideas are rarely built, but they can improve the practical ones.']],2));
  L.done();}},
{part:2,src:'Chapter 8 · Getting Unstuck',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">Marco is stuck at six ideas for “Chopping takes ages”</h1>');
  L.beats(L.card,[
   ['Competitors','Marco first checks other meal-kit apps. Most tag some recipes as easy. That gives one idea: a “low-chop” recipe tag.'],
   ['Look wider','Who else must get lots of chopping done fast? A busy restaurant kitchen preps vegetables before the rush. Idea: ingredients arrive <b>pre-chopped</b>.'],
   ['Extreme users','Maya cooking after a 12-hour shift. A first-time cook. Someone cooking one-handed. Idea: a <b>chopper gadget</b> in the box.'],
   ['A wild idea','Magic wand: the vegetables chop themselves. Not buildable, but it sparks a practical one: <b>recipes built on no-chop ingredients</b> like cherry tomatoes and baby spinach.'],
   ['Sleep on it','The next morning, Marco adds two more: a <b>Sunday batch-chop guide</b> and herbs sent as ready-made pastes.']],
   'Each tactic opened a new direction instead of another version of the same idea.');}},
{part:2,src:'Chapter 8 · Getting Unstuck',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Dev has only looked at other meal-kit apps and feels out of ideas. What should Dev try next?</h1>');
  L.mc(L.card,['Ask what other industries have solved a similar problem','Study the same meal-kit apps more closely for details'],0,
   'Competitors are a start, but the book says to look wider. Analogous problems in unrelated industries often spark the most varied ideas.',
   'Digging deeper into the same competitors keeps Dev in the same place. Look at other industries that solve a similar problem.');}},
{part:2,src:'Chapter 8 · Getting Unstuck',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which tactic is this?',['Spread it out','Sleep on it','Analogous product','Extreme users','Wild idea'],[
   ['Priya asks: how do salad bars keep up with chopping for a lunch rush?',2,'An unrelated industry solving a similar problem: an '+L.g('analogous','analogous product')+'.'],
   ['Marco gives up for the day. At breakfast, two new ideas come to Marco.',1,'Marco’s brain kept working overnight. That’s incubation.'],
   ['Dev asks: what would someone who has never cooked before need?',3,'First-time users are one kind of extreme user.'],
   ['Sam’s interview inspires Priya to imagine a robot that chops while you set the table.',4,'Not buildable, but wild ideas can improve practical ones.'],
   ['Instead of an hour-long session, Marco jots ideas in the ten minutes between meetings.',0,'Short bursts at different times and places keep ideas coming.']]);}},

/* ---------- PART 4: CHOOSING THREE ---------- */
{part:3,src:'Chapter 8 · Putting It All Into Practice',run(L){
  L.h(L.kick('learn','The method')+'<h1 class="q">Four steps to 15–20 ideas</h1>'+
   L.list([['target','Review the target opportunity','Make sure everyone understands it and its context, and that it’s a small, distinct need.'],
     ['person','Come up with ideas alone','Write down as many as you can. Stuck? Take a break, then look at competitors and analogous products.'],
     ['chat','Share across the team','Face to face or in a chat channel. Describe each idea, take questions, build on each other’s ideas.'],
     ['cycle','Repeat steps 2 and 3','Hearing others’ ideas inspires new ones, so don’t skip going back to solo work. Stop at 15 to 20 ideas.']],1)+
   '<p class="small" style="margin-top:10px">Ideation is best done with the <b>whole team</b>, not just the trio. You can also invite stakeholders who bring a different view.</p>');
  L.done();}},
{part:3,src:'Chapter 8 · Putting It All Into Practice',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">Fernway’s week of ideation</h1>');
  L.beats(L.card,[
   ['Monday','Priya shares the target opportunity with the team, plus what Maya and Ana told them about chopping on weeknights.'],
   ['Tuesday','Everyone writes ideas alone. Marco has 6, Dev 4, Priya 5, and a support agent 3.'],
   ['Wednesday','Each person posts their ideas in the team chat and explains them. Questions and riffs follow.'],
   ['Thursday','Back to solo work. Dev reads Marco’s no-chop recipes idea and thinks of a chopper gadget in the box. New ideas pile up.'],
   ['Friday','After removing duplicates, the team has <b>19 distinct ideas</b>. Time to choose.']],
   'Alone, share, alone again, spread over several days, not crammed into one meeting.');}},
{part:3,src:'Chapter 8 · Putting It All Into Practice',pts:1,run(L){
  L.h(L.kick('try','Put in order')+'<h1 class="q">Tap the steps in the order the book suggests.</h1>');
  L.order(L.card,['Review the target opportunity','Come up with ideas alone','Share ideas across the team','Come up with more ideas alone','Dot-vote down to three'],
   'Solo work comes before sharing, and you go back to solo work after sharing. Choosing comes only once you have 15 to 20 ideas.');}},
{part:3,src:'Chapter 8 · Evaluating Your Ideas',run(L){
  L.h(L.kick('learn','From many ideas to three')+'<h1 class="q">Come up with ideas alone, but judge them together</h1>'+
   L.prose('Research shows we’re better at <i>generating</i> ideas alone but better at <i>evaluating</i> them as a group, which brings a wider range of experience.')+
   L.list([['Weed out','For each idea ask: does it address the target opportunity? A partial fix is fine. Remove the ones that don’t.'],
     ['Dot-vote','Each person gets <b>three votes</b> to place however they like. Vote only on how well the idea addresses the target, not on coolness or difficulty.'],
     ['Repeat if needed','No clear winners? Each person briefly pitches the ideas they voted for, then vote again. Set aside clear winners until you have three.'],
     ['Check the set','Everyone should be excited by at least one idea, and each idea needs a strong advocate. If not, vote again.']],2)+
   L.note('Stop at <b>three</b>, not one. The next lessons test them side by side to find the best.','layers'));
  L.done();}},
{part:3,src:'Chapter 8 · Evaluating Your Ideas',pts:1,
 solve:async L=>{const c=L.$('#dv').children;c[1].click();c[4].click();c[6].click();L.$('#cv').click();},
 run(L){
  const ID=[['Pre-chopped ingredients',1,5],['Wine pairings for each meal',0,0],['Fewer-chop recipes',1,4],['Sunday batch-chop guide',1,3],['A refer-a-friend discount',0,0],['A chopper gadget in the box',1,2],['A prettier box design',0,0],['Knife-skills video tips',1,1]];
  const off=new Set();
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Before voting, tap every idea that doesn’t address “Chopping takes ages.” Then run the vote.</h1><div id="dv"></div>'+
   '<button class="btn pri" id="cv" style="margin-top:12px">'+L.ic('check')+'Remove and vote</button><div id="vr"></div>');
  ID.forEach((d,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=d[0];b.onclick=()=>{if(L.$('#cv')===null)return;if(off.has(j)){off.delete(j);b.classList.remove('sel');b.style.textDecoration='';}else{off.add(j);b.classList.add('sel');b.style.textDecoration='line-through';}};L.$('#dv').appendChild(b);});
  L.$('#cv').onclick=function(){this.remove();const wrong=ID.map((d,j)=>j).filter(j=>(ID[j][1]===0)!==off.has(j));const ok=wrong.length===0;
    const keep=ID.filter(d=>d[1]===1).sort((a,b)=>b[2]-a[2]);
    L.$('#dv').innerHTML=ID.map(d=>'<span class="chip static'+(d[1]?' ok':'')+'" style="'+(d[1]?'':'opacity:.35;text-decoration:line-through')+'">'+(d[1]?L.ic('check'):L.ic('x'))+d[0]+'</span>').join('');
    L.$('#vr').innerHTML='<h2 class="sub">Five people, three votes each</h2>'+keep.map((d,k)=>'<div class="meterrow"><div class="lb">'+(k<3?'<b>'+d[0]+'</b>':d[0])+' · '+d[2]+'</div><div class="meter"><div style="width:'+d[2]*20+'%;background:'+(k<3?'var(--ok-strong)':'var(--h3)')+'"></div></div></div>').join('');
    L.award(ok);
    L.sheet(ok?'ok':'no',ok?'Clean set, clear top three':'Not quite','Wine pairings, a referral discount and a nicer box might be fine some day, but none cuts chopping time. With them gone, the vote gives three ideas to compare: pre-chopped ingredients, fewer-chop recipes and a Sunday batch-chop guide.');L.done();};}},
{part:3,src:'Chapter 8 · Evaluating Your Ideas',pts:1,run(L){
  L.h(L.kick('pr','What next?')+'<h1 class="q">After voting, Fernway has its three ideas. In a quick poll, Dev isn’t excited about any of them. What should the team do?</h1>');
  L.mc(L.card,['Go ahead, since most of the team is happy','Revisit the set and dot-vote again','Let Dev swap in a personal favorite idea'],1,
   'Everyone should be excited by at least one idea. If not, the book says to revisit the set and vote again.',
   'Each person should be excited about at least one idea, and each idea needs an advocate. Neither ignoring Dev nor letting Dev override the vote does that. Revisit and vote again.');}},
{part:3,src:'Chapter 8 · Avoid These Common Anti-Patterns',run(L){
  L.h(L.kick('learn','Four common traps')+'<h1 class="q">Watch for these when you come up with ideas</h1>'+
   L.list([['No diverse perspectives','Ideation is for the whole team, not only the trio. Invite people with different views, and give them the target opportunity and customer context.'],
     ['Variations of the same idea','Lions, tigers, pumas, cheetahs: riffing helps the count but not the variety. Deliberately look for <i>different kinds</i> of ideas.'],
     ['Ideating in one session','One brainstorm meeting is the norm, but not the most effective. Give it time so incubation can work.'],
     ['Picking ideas that miss the target','A shiny idea for “some day” undoes the choice you made last lesson. Remove off-target ideas before voting.']],4));
  L.done();}},
{part:3,src:'Chapter 8 · Avoid These Common Anti-Patterns',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Spot the trap',['No diverse perspectives','Variations of one idea','Ideating in one session','Picking off-target ideas'],[
   ['Fernway books one two-hour meeting on Friday to “get all the ideas out.”',2,'Spread ideation over days, so people can take breaks and sleep on it.'],
   ['The final three are pre-chopped onions, pre-chopped carrots and pre-chopped peppers.',1,'These are one idea in three sizes. You want categorically different options to compare.'],
   ['Only Priya, Marco and Dev come up with ideas. Nobody from support or the kitchen is asked.',0,'Ideation works best with the whole team and people who bring a different view.'],
   ['A recipe-sharing social feed wins the vote, though it won’t cut any chopping time.',3,'Exciting or not, it doesn’t address the target opportunity, so it should have been removed before voting.']]);}}
  ]
});
</script>
</body>
</html>
