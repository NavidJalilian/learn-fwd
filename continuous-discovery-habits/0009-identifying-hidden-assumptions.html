<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Identifying Hidden Assumptions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0009', title:'Identifying hidden assumptions', minutes:20, icon:'eye',
  goals:['Explain why teams test assumptions instead of whole ideas','Surface assumptions in all five categories with four methods','Map assumptions to find the few “leap of faith” ones to test first'],
  parts:['Be ready to be wrong','Five kinds','Finding them','The risky few'],
  read:'Read chapter 9 of the book for the full streaming-service story map and its 20 assumptions.',
  glossary:{
    'confirmation-bias':'Confirmation bias: noticing and remembering evidence that agrees with us, and missing evidence that doesn’t.',
    'escalation':'Escalation of commitment: the more we invest in an idea, the more attached to it we get.',
    'story-map':'Story map: the steps each person (or system) takes, in order, for someone to get value from a solution.',
    'pre-mortem':'Pre-mortem: imagining a project has already failed and asking what went wrong.',
    'leap-of-faith':'Leap-of-faith assumption: an assumption that is very important to the idea and has little evidence behind it.'
  },
  cheatsheet:[
    'We fall in love with ideas: <b>confirmation bias</b> and <b>escalation of commitment</b>. Be prepared to be wrong.',
    'Test <b>assumptions</b>, not whole ideas. It’s faster, so you can compare three ideas and stay less attached.',
    'Five kinds: <b>desirability</b> (want it?), <b>viability</b> (should we?), <b>feasibility</b> (can we?), <b>usability</b> (can they use it?), <b>ethical</b> (any harm?).',
    '<b>Story map</b>: assume it exists, name the actors, lay out each step. Every step a person takes hides desirability, usability and feasibility assumptions.',
    '<b>Pre-mortem</b>: “It launched and failed. What went wrong?” Say it <i>did</i> fail, not that it might.',
    '<b>Walk the lines</b> of the tree for viability; ask “<b>what’s the potential harm?</b>” for ethics. Use whichever method covers your blind spot.',
    '<b>Assumption map</b>: importance up, weak evidence right. Test the 2–3 in the top-right corner first. Go fast.',
    'Write many (20–30), phrase them so they must be <b>true</b>, make them <b>specific</b>, cover <b>every category</b>.'
  ],
  steps:[
/* ---------- PART 1: BE READY TO BE WRONG ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Marco loves the “pre-chopped ingredients” idea and has already pitched it to the CEO twice. How likely is Marco to notice evidence against it?</h1>');
  L.mc(L.card,['More likely than before, since Marco knows it well','Less likely than before, since Marco is invested in it'],1,
   'The more we defend an idea, the harder it gets to see its flaws. This lesson is about seeing them anyway.',
   'Knowing an idea well doesn’t make us see its flaws. The more we’ve defended it, the more we tend to look away from bad news.');}},
{part:0,src:'Chapter 9 · opening story, summarized',run(L){
  L.h(L.kick('ex','A real story from the book')+'<h1 class="q">A city builds the wrong building, with the best of intentions</h1>');
  L.beats(L.card,[
   ['The goal','Portland, Oregon, wanted to help families pushed out of a historically Black neighborhood return to it.'],
   ['The plan','The city gave a developer tax breaks to build condos sold below market price, only to those displaced families.'],
   ['The result','Years later, most units were still unsold. In the end the developer sold them on the open market.'],
   ['The reason','The building was mostly one- and two-bedroom units. Most of the displaced families had <b>four or more</b> people.'],
   ['The lesson','The city and developer <b>assumed</b> they knew what families needed and never tested it. Millions were spent on the wrong product.']],
   'Every team has built the wrong thing at some point. The cause is usually an assumption nobody checked.');}},
{part:0,src:'Chapter 9 · Be Prepared to Be Wrong',run(L){
  L.h(L.kick('learn','Two biases')+'<h1 class="q">Why smart teams fall in love with bad ideas</h1>'+
   L.lanes([['eye','Confirmation bias','We look for, notice and remember evidence that agrees with us, and forget what doesn’t. The city heard the praise and missed the warnings.',2],
            ['trend','Escalation of commitment','The more we invest in an idea, the more committed we become. The city kept exploring one idea, and only that one.',3]])+
   L.prose('Product teams are especially prone to both. We fall in love with our ideas, defend them to stakeholders, and look for reasons they <i>will</i> work instead of reasons they won’t. So we end up overconfident.')+
   L.note('The book’s advice, borrowed from Chip and Dan Heath: <b>be prepared to be wrong.</b> Comparing three ideas at once, as you did last lesson, is one way.','compass'));
  L.done();}},
{part:0,src:'Chapter 9 · Be Prepared to Be Wrong',run(L){
  L.h(L.kick('learn','Test assumptions, not ideas')+'<h1 class="q">You can’t build three ideas just to see which wins</h1>'+
   L.prose('Building all three ideas and A/B testing them would take far too long. Instead, list the '+L.g('assumption','assumptions')+' each idea depends on and test those.')+
   L.flow([['box','Idea','Pre-chopped ingredients','slow to test whole'],['list','Assumptions','Chopped vegetables stay fresh for days…','fast to test, one by one']])+
   L.list([['clock','Faster','Teams that test assumptions can run many small tests a week, not one big one.'],
     ['scale','Fairer','You look for evidence both for and against each assumption.'],
     ['shield','Less attached','The less time you sink into an idea, the less likely you are to fall in love with it.']],1)+
   '<p class="small" style="margin-top:10px">The hard part is <b>seeing</b> your assumptions. The rest of this lesson is about that.</p>');
  L.done();}},
{part:0,src:'Chapter 9 · Be Prepared to Be Wrong',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Priya rereads the interview notes about pre-chopping. Priya remembers every customer who loved it, but has forgotten the two who said they don’t trust pre-cut food. Which bias is this?</h1>');
  L.mc(L.card,['Escalation of commitment','Confirmation bias'],1,
   'Priya kept the evidence that agrees and lost the evidence that doesn’t.',
   'Escalation is about growing more committed as you invest more. Remembering only the agreeing evidence is confirmation bias.');}},
{part:0,src:'Chapter 9 · Be Prepared to Be Wrong',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which bias is at work?',['Confirmation bias','Escalation of commitment'],[
   ['Dev has spent three weeks on a prototype of the chopper gadget. Now Dev argues it must ship, whatever the test says.',1,'Three weeks invested makes it harder to let go.'],
   ['Marco shares Sam’s quote praising fewer-chop recipes in the team chat, but not Ana’s doubt about them.',0,'Marco passed on the agreeing evidence and skipped the rest.'],
   ['After pitching the Sunday batch-chop guide to the CEO, Priya feels unable to back away from it.',1,'Defending an idea to stakeholders deepens commitment.'],
   ['The team searches reviews for proof that customers want pre-chopped food, and stops once they find some.',0,'They only went looking for confirming evidence.']]);}},

/* ---------- PART 2: FIVE KINDS ---------- */
{part:1,src:'Chapter 9 · Types of Assumptions',run(L){
  L.h(L.kick('learn','Five kinds of assumption')+'<h1 class="q">Each kind asks a different question about your idea</h1>'+
   L.list([['people','Desirability · Does anyone want it?','Customers will get value from it, are willing to do what we need, and trust us.'],
     ['trend','Viability · Should we build it?','It creates more value for the business than it costs to build, run and maintain.'],
     ['box','Feasibility · Can we build it?','It’s technically possible, and the business allows it: legal, security, culture, regulations.'],
     ['pointer','Usability · Can they use it?','Customers can find it, understand it, do what it asks, and it’s accessible.'],
     ['shield','Ethical · Could it cause harm?','What data we collect and how we use it, and any other harm. The book says most teams neglect this one.']],2));
  L.done();}},
{part:1,src:'Chapter 9 · Types of Assumptions',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">“Customers will understand the pre-chopped toggle on each recipe.” What kind of assumption is this?</h1>');
  L.mc(L.card,['Desirability','Feasibility','Usability'],2,
   'It’s about whether customers can understand and use the toggle, which is usability.',
   'It isn’t about wanting it or building it. It’s about whether customers understand how to use it: usability.');}},
{part:1,src:'Chapter 9 · Types of Assumptions',pts:6,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Name the kind',['Desirability','Viability','Feasibility','Usability','Ethical'],[
   ['Busy parents like Maya want vegetables chopped for them on weeknights.',0,'It’s about whether customers want it.'],
   ['Fernway’s kitchen can chop and pack vegetables in time for each delivery.',2,'Can we actually do it? That’s feasibility.'],
   ['The extra charge for pre-chopping covers the cost of the chopping.',1,'Does it pay off for the business? That’s viability.'],
   ['Customers can tell which bag of chopped vegetables goes with which recipe.',3,'Can they use it correctly? That’s usability.'],
   ['Extra plastic bags for chopped vegetables won’t upset customers or harm the environment.',4,'It asks whether the idea could cause harm.'],
   ['Food-safety rules allow Fernway to ship vegetables already cut.',2,'Feasibility includes what regulations allow, not only the tech.']]);}},
{part:1,src:'Chapter 9 · Avoid These Common Anti-Patterns',pts:1,run(L){
  L.h(L.kick('pr','Usable or wanted?')+'<h1 class="q">In a test, five customers follow the Sunday batch-chop guide with no trouble at all. Dev says: “Great, so customers want it.” Is Dev right?</h1>');
  L.mc(L.card,['Yes, an easy-to-use guide shows they want it','No, easy to use doesn’t mean anyone wants it','Yes, as long as all five finished the guide'],1,
   'The test checked usability. Whether customers want to spend Sunday chopping is a separate desirability assumption. The book warns teams often mix the two up.',
   'Being able to use something says nothing about wanting it. Desirability and usability are different kinds of assumption, and need separate evidence.');}},

/* ---------- PART 3: FINDING THEM ---------- */
{part:2,src:'Chapter 9 · Story Map to Get Clarity',run(L){
  L.h(L.kick('learn','Method 1 · Story mapping')+'<h1 class="q">Get specific about how the idea works</h1>'+
   L.prose('A sticky note that says “pre-chopped ingredients” means something slightly different to Priya, Marco and Dev. Each is making their own assumptions. A '+L.g('story-map','story map')+' gets everyone on the same picture.')+
   L.list([['Assume it already exists','You’re mapping how people get value from it, not how to build it.'],
     ['Name the key actors','Everyone (and every system) that must act for it to work.'],
     ['Map each actor’s steps','Be specific about what each one has to do.'],
     ['Lay the steps out in order','Left to right over time. If there are many paths, map the successful one.']],3)+
   '<p class="small" style="margin-top:10px">Map your best version based on what you know today. You’ll refine it as you test.</p>');
  L.done();}},
{part:2,src:'Chapter 9 · Story Map to Get Clarity',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">The trio story maps “pre-chopped ingredients”</h1>');
  L.beats(L.card,[
   ['Target','The idea answers “Chopping takes ages,” which sits under “Recipes take too long on weeknights.”'],
   ['Actors','Who must act for Maya to get value? <b>Maya</b>, the <b>Fernway app</b> and <b>Fernway’s kitchen</b>, which chops and packs.'],
   ['Step 1','Maya opens the app to choose this week’s meals.'],
   ['Step 2','The app shows a pre-chopped option on weeknight recipes, and Maya adds it to two meals.'],
   ['Step 3','The kitchen chops and packs the vegetables for Maya’s box.'],
   ['Step 4','The box arrives with vegetables ready to use.'],
   ['Step 5','On Tuesday after a shift, Maya cooks dinner without chopping anything.']],
   'Five simple steps, and the trio now agrees on what the idea means. Next, each step gets mined for assumptions.');}},
{part:2,src:'Chapter 9 · Story Map to Get Clarity',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Dev’s story map for the chopper gadget starts: “Find a supplier. Sign a contract. Design the packaging.” What’s wrong?</h1>');
  L.mc(L.card,['It maps building the idea, not using it','It should list fewer actors per step'],0,
   'A story map assumes the idea already exists and maps what people do to get value from it.',
   'The number of actors isn’t the issue. Dev mapped how to get the gadget made. Assume it exists and map what customers do with it.');}},
{part:2,src:'Chapter 9 · Use Your Story Maps to Generate Assumptions',pts:1,
 solve:async L=>{[...L.$('#sm').children].forEach(b=>b.click());},
 run(L){
  const S=[['Maya opens the app to pick meals',['D · Maya wants to skip chopping on weeknights','U · Maya notices the pre-chopped option','F · The app can show which recipes offer it']],
    ['Maya adds pre-chopped to two meals',['D · Maya will pay a little extra for it','U · Maya understands what the option includes']],
    ['The kitchen chops and packs',['F · The kitchen can chop in time for delivery','F · Chopped vegetables stay fresh in the box']],
    ['The box arrives, ready to use',['D · Maya trusts that pre-cut food is fresh','U · Maya can tell which bag goes with which recipe']],
    ['Maya cooks without chopping',['D · Maya cooks it on a weeknight','U · Maya can follow the recipe without the chopping steps','F · The pieces are cut the size the recipe needs']]];
  let n=0;const seen=new Set();
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Tap each step of the story map to reveal the assumptions hiding in it.</h1><div id="sm"></div>'+
   '<div class="small" style="margin:10px 0 6px"><b id="ct">0</b> assumptions found</div><div id="al"></div><div id="sq"></div>');
  S.forEach((s,j)=>{const b=document.createElement('button');b.className='chip';b.innerHTML=L.ic('play')+(j+1)+'. '+s[0];b.onclick=()=>{if(seen.has(j))return;seen.add(j);b.classList.add('sel');n+=s[1].length;L.$('#ct').textContent=n;
    L.$('#al').insertAdjacentHTML('beforeend',s[1].map(a=>'<span class="chip static ok">'+a+'</span>').join(''));
    if(seen.size===S.length){const q=L.$('#sq');q.innerHTML='<h2 class="sub">'+n+' assumptions from 5 steps. Whenever Maya has to do something, which three kinds are you assuming?</h2>';
      L.mc(q,['Viability, ethical, usability','Feasibility, viability, ethical','Desirability, usability, feasibility'],2,
       'Every action means assuming Maya wants to (desirability), is able to (usability), and that you can support it (feasibility). The book’s own five-step map produced 20.',
       'Look at the letters: D, U and F. Each step a person takes assumes they want to, can, and that you can build what supports it. Viability and ethics need other methods.');}};L.$('#sm').appendChild(b);});}},
{part:2,src:'Chapter 9 · Conduct a Pre-Mortem; Walk the Lines; Explore Potential Harm',run(L){
  L.h(L.kick('learn','Three more methods')+'<h1 class="q">Other ways to see what you’re assuming</h1>'+
   L.list([['alert','Pre-mortem','Imagine it’s six months later, the idea launched, and it <b>failed</b>. What went wrong? Research found this works only when you treat the failure as certain, not just possible.'],
     ['tree','Walk the lines of your tree','Finish two sentences: “This solution will address the opportunity because…” and “Addressing the opportunity will drive the outcome because…”. Each “because” is an assumption. Good for viability.'],
     ['shield','Explore potential harm','Ask “What’s the potential harm?” What data do we collect, and would customers be OK if they fully understood how we use it? Who gets left out?']],1)+
   L.note('Try the front-page test: if a news site printed your internal plans for this idea, would that be a good thing?','book')+
   '<p class="small" style="margin-top:10px">You don’t need every method every time. Use the ones that cover your team’s blind spots.</p>');
  L.done();}},
{part:2,src:'Chapter 9 · Conduct a Pre-Mortem',pts:1,run(L){
  L.h(L.kick('pr','Run a pre-mortem')+'<h1 class="q">Priya wants to run a pre-mortem on the Sunday batch-chop guide. Which question should Priya ask the team?</h1>');
  L.mc(L.card,['“What could possibly go wrong with the batch-chop guide?”','“It’s six months on and the guide failed. Why?”','“How sure are we that the batch-chop guide will succeed?”'],1,
   'Treating the failure as certain is what makes a pre-mortem work. It produces better explanations, and each one exposes an assumption.',
   'The research the book cites found the method works only when the failure is stated as certain. “Could go wrong” and “how sure” keep it hypothetical.');}},
{part:2,src:'Chapter 9 · Mix and Match the Methods',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which method fits best?',['Story map','Pre-mortem','Walk the lines','Explore potential harm'],[
   ['Priya, Marco and Dev each picture the chopper gadget working in a different way.',0,'A story map gets everyone to agree on how the idea works.'],
   ['The team always forgets to ask whether an idea will pay off for the business.',2,'Walking from solution to outcome to business outcome surfaces viability assumptions.'],
   ['The shift-calendar idea would read customers’ work calendars, and nobody has asked what that means.',3,'Data use is a classic ethical blind spot. Ask what harm it could do.'],
   ['The team is very confident about fewer-chop recipes and can’t think how they would fail.',1,'Imagine they did fail, and ask why.']]);}},
{part:2,src:'Chapter 9 · Walk the Lines of Your Opportunity Solution Tree',pts:1,run(L){
  L.h(L.kick('pr','Walk the lines')+'<h1 class="q">Dev completes: “Addressing ‘Chopping takes ages’ will drive more meals cooked because…” Which ending is a useful assumption?</h1>');
  L.mc(L.card,['“…Fernway’s engineers have the skills to build it.”','“…chopping is a main reason customers skip cooking a meal.”','“…the pre-chopped option will look great in the app.”'],1,
   'That’s the link between the opportunity and the outcome. If chopping isn’t a real reason meals go uncooked, the whole branch is weak. It’s an assumption worth capturing.',
   'Engineering skill and looks don’t explain why solving this need would get more meals cooked. The useful assumption links the opportunity to the outcome.');}},

/* ---------- PART 4: THE RISKY FEW ---------- */
{part:3,src:'Chapter 9 · Prioritizing Assumptions',run(L){
  L.h(L.kick('learn','Assumption mapping')+'<h1 class="q">Find the few assumptions worth testing first</h1>'+
   L.prose('Assumptions aren’t bad. If you’ve done your interviewing and mapping, most will be true enough, and you won’t test them. You list many so the risky ones can’t hide.')+
   L.prose('Then place each one on a grid, an exercise from David J. Bland:')+
   L.lanes([['arrow','Across: evidence','Strong evidence it’s true goes left. Little or no evidence goes right.',2],
            ['trend','Up: importance','If it’s false, how hard is it to work around? Hard to work around goes higher.',3]])+
   L.prose('Place them <b>relative to each other</b> and go fast, about ten minutes per idea. Then test the two or three in the top-right corner: the '+L.g('leap-of-faith','“leap of faith” assumptions')+'. Do this for each of your three ideas.'));
  L.done();}},
{part:3,src:'Chapter 9 · Prioritizing Assumptions',pts:1,
 solve:async L=>{L.$('#d1').click();},
 run(L){
  const A=[['Maya wants pre-chopped vegetables on weeknights',.22,.78],['Chopped vegetables stay fresh for four days in the box',.85,.86],['Customers can tell which bag goes with which recipe',.72,.22],['The app can show which recipes offer pre-chopping',.15,.3],['Customers will pay a little extra for it',.6,.58]];
  L.h(L.kick('pr','Read the map')+'<h1 class="q">Here is the trio’s assumption map for pre-chopped ingredients. Tap the one to test first.</h1>'+
   '<div class="small">↑ more important</div><div id="am" style="position:relative;height:230px;background:var(--soft);border-radius:16px;margin:4px 0;border:1px solid var(--line)"><div style="position:absolute;left:50%;top:8px;bottom:8px;border-left:1px dashed var(--line2)"></div><div style="position:absolute;top:50%;left:8px;right:8px;border-top:1px dashed var(--line2)"></div></div>'+
   '<div class="small" style="display:flex;justify-content:space-between"><span>← strong evidence</span><span>weak evidence →</span></div>'+
   '<div id="lg" style="margin-top:10px"></div><div id="mf"></div>');
  let done=false;
  A.forEach((a,j)=>{const b=document.createElement('button');b.id='d'+j;b.textContent=j+1;
    b.style.cssText='position:absolute;width:34px;height:34px;border-radius:50%;border:2px solid var(--pri);background:var(--card);color:var(--ink);font:600 15px var(--sans);cursor:pointer;left:calc('+a[1]*100+'% - 17px);top:calc('+(1-a[2])*100+'% - 17px)';
    b.onclick=()=>{if(done)return;done=true;const ok=j===1;b.style.background=ok?'var(--ok-bg)':'var(--no-bg)';L.$('#d1').style.background='var(--ok-bg)';L.award(ok);
      L.sheet(ok?'ok':'no',ok?'That’s the leap of faith':'Look top-right','Number 2 is the most important and has the least evidence. If chopped vegetables spoil, the whole idea fails, and nobody has checked. Number 5 might come next. Number 1 already has interview evidence, and number 3 is easy to work around with labels.');L.done();};
    L.$('#am').appendChild(b);});
  L.$('#lg').innerHTML=A.map((a,j)=>'<div class="small" style="margin:3px 0"><b>'+(j+1)+'.</b> '+a[0]+'</div>').join('');}},
{part:3,src:'Chapter 9 · Avoid These Common Anti-Patterns',run(L){
  L.h(L.kick('learn','Four common traps')+'<h1 class="q">Check your assumption list for these</h1>'+
   L.list([['Too few assumptions','Teams badly underestimate how many there are. The author often lists 20–30 for a simple idea. You can’t map a risk you never wrote down.'],
     ['Phrased so they must be false','“Customers won’t remember their password” is backwards. Write what must be <b>true</b>: “Customers will remember their password.” It’s easier to test.'],
     ['Not specific enough','“Customers will have time” to do what? Name the exact action, the customer and the situation.'],
     ['Favoring one category','Teams lean on one or two kinds and miss the rest, very often ethical. Use all five as a checklist.']],4));
  L.done();}},
{part:3,src:'Chapter 9 · Avoid These Common Anti-Patterns',pts:1,run(L){
  L.h(L.kick('pr','Fix the assumption')+'<h1 class="q">For pre-chopped ingredients, Marco wrote: “Customers won’t have time.” Tap each piece until it’s phrased to be true and specific.</h1>');
  L.sentence(L.card,[['Customers','Our kitchen'],['won’t','will'],['have time','cook the pre-chopped meals'],['within three days of delivery','at some point']],[0,1,1,0],
   [['The assumption is about what customers do, not the kitchen.'],['Phrase it so you need it to be true. “Won’t” is the devil’s-advocate version.'],['“Have time” for what? Name the exact action.'],['“At some point” is too vague to test. Give a time frame.']],
   'Positive and specific: now the team knows exactly what must be true, and what to measure in a test.');}},
{part:3,src:'Chapter 9 · Avoid These Common Anti-Patterns',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Spot the trap',['Too few assumptions','Phrased to be false','Not specific enough','Favoring one category'],[
   ['The trio lists four assumptions for fewer-chop recipes and moves straight to the map.',0,'Simple ideas often hide 20–30. Keep going so the risky ones surface.'],
   ['“Customers will know what to do.”',2,'Know what to do where, and when? Name the exact action.'],
   ['“Maya won’t trust pre-cut vegetables.”',1,'Flip it: “Maya will trust pre-cut vegetables.” That’s what must be true.'],
   ['Every assumption on the list is about whether the app screens are easy to use.',3,'All usability. Desirability, viability, feasibility and ethics are missing.']]);}}
  ]
});
</script>
</body>
</html>
