<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Opportunity Solution Tree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0002', title:'The opportunity solution tree', minutes:20, icon:'tree',
  goals:['Explain why business goals must be reached through customer needs','Tell opportunities from solutions and place both on a tree','Use the tree to make better decisions and pick your next step'],
  parts:['Business and customer','Framing','The tree','Using the tree'],
  read:'Read chapter 2 of the book for the full Wells Fargo story and all seven benefits of the tree.',
  glossary:{
    illstructured:'Ill-structured problem: a problem with many possible solutions and no single right answer, only better or worse ones.',
    oppspace:'Opportunity space: all the customer needs, pain points and desires that, if addressed, could drive your outcome.',
    framing:'Framing: how you describe a problem. It shapes which solutions you think of.',
    wornot:'“Whether or not” decision: judging one option alone (“Should we do this?”) instead of comparing it with others.',
    confirm:'Confirmation bias: noticing only the evidence that supports what you already believe.'
  },
  cheatsheet:[
    'Chasing a business outcome without caring for customers leads to shortcuts, or worse (Wells Fargo). Serving customers is <b>how</b> you earn the business result.',
    'Reaching an outcome is an <b>ill-structured problem</b>: many solutions, only better or worse ones. How you <b>frame</b> it shapes what you build, so try several framings.',
    '<b>Opportunities</b> = customer needs, pain points and desires. Not “problems”, because products also serve desires.',
    'The tree: <b>outcome</b> → <b>opportunities</b> → <b>solutions</b> → <b>assumption tests</b>. Don’t skip from outcome straight to ideas.',
    'Break big opportunities into smaller ones and solve one at a time, so you deliver value every cycle.',
    'Swap “whether or not” for <b>compare and contrast</b>: “Which of these matters most?” and “What else could we build?”',
    'When an idea fails, ask “What did we misunderstand about the customer?” and fix the tree before the next idea.',
    'The tree’s shape tells you what to do next, and it lets you <b>show your work</b> to stakeholders.'
  ],
  steps:[
/* ---------- PART 1: BUSINESS AND CUSTOMER ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Fernway wants fewer cancellations. Someone suggests hiding the cancel button deep in settings. Good idea for the long run?</h1>');
  L.mc(L.card,['No, it works against the customers','Yes, fewer people will find it'],0,
   'It might cut cancellations this month, but it makes customers resent Fernway. This lesson is about reaching business goals <i>by</i> serving customers.',
   'The number might dip for a while, but customers feel trapped and leave angry. A goal reached against customers doesn’t last.');}},
{part:0,src:'Chapter 2 · opening story, summarized',run(L){
  L.h(L.kick('ex','A real story from the book')+'<h1 class="q">What happens when a goal ignores the customer</h1>');
  L.beats(L.card,[
   ['The goal','For years, the US bank Wells Fargo pushed to grow the average number of accounts each customer held.'],
   ['The pressure','Bankers got sales quotas they couldn’t reach, tied to big bonuses.'],
   ['The cheating','Many bankers opened checking, savings and credit-card accounts in customers’ names, without asking them.'],
   ['The cost','In 2016 it came out. The bank was fined $185 million and faced lawsuits costing billions.'],
   ['The lesson','Starting with an outcome was right. Chasing it without caring for customers was the mistake.']],
   'An outcome mindset needs a customer-centric mindset next to it. Otherwise the goal invites shortcuts.');}},
{part:0,src:'Chapter 2 · A common framework for continuous discovery',run(L){
  L.h(L.kick('learn','Business needs vs customer needs')+'<h1 class="q">The tension is everywhere, but it doesn’t have to be</h1>'+
   L.prose('You see it daily: a pile of ads before a news article, a game you can’t stream in your region, a hotel fee hidden until checkout. Each time, the business put its own need first.')+
   L.quote('Managers must convert society’s needs into opportunities for profitable business.','Peter Drucker, quoted at the start of chapter 2')+
   L.prose('Businesses must make a profit to survive. But Drucker’s point is that serving customers is <i>how</i> you make it. The two needs line up instead of fighting.')+
   L.note('A trio given an outcome has a choice: learn what customers really need, or take shortcuts at their expense. This chapter’s framework helps them make the first choice.','compass'));
  L.done();}},
{part:0,src:'Chapter 2 · Begin with the end in mind',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Fernway’s trio is asked to reduce cancellations. Which path fits the book?</h1>');
  L.mc(L.card,['Add a fee for cancelling in the first month','Learn why customers cancel and address it','Make the cancel flow six screens long'],1,
   'Serving the customer’s real needs is how you reach the business goal and keep it.',
   'A fee and a long cancel flow push the number by working against customers. The book’s path is to find what customers need and serve it.');}},
{part:0,src:'Chapter 2 · Begin with the end in mind',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Customer value, or a shortcut?',['Good for both','A shortcut'],[
   ['Auto-add a pricey dessert to every box unless customers opt out.',1,'It grows revenue by counting on people not noticing. That’s value taken from customers.'],
   ['Remind customers which ingredients will spoil first.',0,'Customers waste less food, and cooking more keeps them subscribed.'],
   ['Show the full weekly price, including delivery, before checkout.',0,'Clear prices build trust. Hidden fees are the hotel-fee trap.'],
   ['Bury the “skip a week” option so people pay for boxes they don’t want.',1,'It squeezes money now and drives angry cancellations later.']]);}},

/* ---------- PART 2: FRAMING ---------- */
{part:1,src:'Chapter 2 · The challenge of driving outcomes',run(L){
  L.h(L.kick('learn','A problem with many answers')+'<h1 class="q">There’s no single right way to reach an outcome</h1>'+
   L.prose('Finding the best path to an outcome is what researchers call an '+L.g('illstructured','ill-structured problem')+'. It has many possible solutions. None is right or wrong, only better or worse.')+
   L.prose('With problems like this, much of the work is <b>'+L.g('framing','framing')+'</b> the problem, because the framing shapes the solutions you’ll find.')+
   L.lanes([['alert','Wells Fargo’s framing','“Grow customer accounts at all costs.” This opened the door to cheating.',4],
            ['people','A customer-centric framing','“Create customers who <i>want</i> to open more accounts.” Bankers would have had less reason to cheat.',2]])+
   '<p class="small" style="margin-top:10px">The book also cites research suggesting that good problem-solvers try out many framings, not just one.</p>');
  L.done();}},
{part:1,src:'Chapter 2 · The challenge of driving outcomes',run(L){
  L.h(L.kick('learn','Opportunities')+'<h1 class="q">The book’s word for what customers need</h1>'+
   L.prose('The book calls customer needs, pain points and desires <b>'+L.g('opportunity','opportunities')+'</b>: chances to make a positive difference in customers’ lives.')+
   L.list([['target','Need','“I pick meals without knowing what my week looks like.”'],
     ['alert','Pain point','“Ingredients go bad before I get to them.”'],
     ['star','Desire','“I get bored of the same kinds of recipes.”']],1)+
   L.prose('Why not just say “problems”? Many good products don’t fix anything. Ice cream or a theme park meet a <i>desire</i>. “Opportunity” covers all three. Together they make up the '+L.g('oppspace','opportunity space')+'.'));
  L.done();}},
{part:1,src:'Chapter 2 · The challenge of driving outcomes',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Which of these is an opportunity, not a solution?</h1>');
  L.mc(L.card,['Add a 20-minute recipe filter','Send a text when food will spoil','“Recipes take too long on weeknights”'],2,
   'It’s a pain point in the customer’s own words. The other two are things Fernway could build.',
   'A filter and a text are solutions, things to build. “Recipes take too long on weeknights” is the customer’s pain point: an opportunity.');}},
{part:1,src:'Chapter 2 · The challenge of driving outcomes',pts:6,run(L){
  L.h(L.kick('pr','Opportunity or solution?')+'<h1 class="q">Fernway’s whiteboard is a mix. Sort each sticky note.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Opportunity','Solution'],[
   ['“I feel guilty throwing food (and money) away.”',0,'A feeling in the customer’s words: an opportunity.'],
   ['Freezer-friendly meals',1,'A thing Fernway could make: a solution.'],
   ['“I get bored of the same kinds of recipes.”',0,'A desire for variety: an opportunity.'],
   ['Plan meals around a shift calendar',1,'A feature idea: a solution.'],
   ['A cuisine-of-the-week recipe filter',1,'Something to build: a solution.'],
   ['“My kids won’t eat anything too spicy.”',0,'A need, in the customer’s own words: an opportunity.']],
   'Opportunities describe the customer’s world. Solutions describe what you might build. Keep them apart.');}},
{part:1,src:'Chapter 2 · The challenge of driving outcomes',pts:1,
 solve:async L=>{const c=L.$('#fr').children;c[0].click();c[1].click();c[2].click();},
 run(L){
  const F=[['Recipes take too long on weeknights',['Quick weeknight recipes','Prep steps you can do ahead','Show cooking time up front']],
           ['Ingredients go bad before I get to them',['Spoilage reminders','Freezer-friendly meals','Cook-first labels on the box']],
           ['I pick meals without knowing my week',['Plan meals around a shift calendar','A “busy night” meal tag','Swap meals after choosing']]];const seen=new Set();
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Fernway wants more delivered meals cooked. Tap each way of framing the problem and see which ideas it brings up.</h1><div id="fr"></div>'+
   '<div style="background:var(--soft);border-radius:16px;padding:14px;margin:8px 0 6px;min-height:110px"><div class="small" id="fc" style="margin-bottom:8px">Choose a framing above.</div><div id="fi"></div></div><div id="fq"></div>');
  F.forEach((f,j)=>{const b=document.createElement('button');b.className='chip';b.innerHTML=L.ic('target')+f[0];b.onclick=()=>{[...L.$('#fr').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(j);
    L.$('#fc').innerHTML='Framed this way, the trio thinks of:';
    L.$('#fi').innerHTML=f[1].map(d=>'<span class="chip static ok">'+L.ic('bulb')+d+'</span>').join('');
    if(seen.size===3&&!L.$('#fq').innerHTML){const q=L.$('#fq');q.innerHTML='<h2 class="sub">Nine different ideas, one goal. Why try several framings?</h2>';
      L.mc(q,['The first framing is usually the wrong one','Each framing opens up different solutions'],1,
       'Right. How you frame the problem shapes what you build. Trying several shows you more of the solution space.',
       'The first framing isn’t necessarily wrong. The point is that each framing leads to different solutions, so trying several shows you more options.');}};L.$('#fr').appendChild(b);});}},

/* ---------- PART 3: THE TREE ---------- */
{part:2,src:'Chapter 2 · The underlying structure of discovery',run(L){
  L.h(L.kick('learn','The structure behind discovery')+'<h1 class="q">“How do we know what to do next?”</h1>'+
   L.prose('In 2016, a trio the author was coaching asked that question. They knew many discovery tactics but not when to use each. Thinking it over, she found a structure underneath:')+
   L.flow([['target','Outcome','sets the scope','',3],['people','Opportunities','frame the problem','',2],['bulb','Solutions','address them','',1]])+
   L.prose('Two steps matter most: <b>mapping</b> the opportunity space, and <b>choosing</b> which opportunities to pursue. Many trios skip both. They get an outcome and jump straight to brainstorming ideas.'));
  L.done();}},
{part:2,src:'Chapter 2 · The underlying structure of discovery',run(L){
  L.h(L.kick('learn','The opportunity solution tree')+'<h1 class="q">One picture of every path to your outcome</h1>'+
   L.prose('The book suggests drawing that structure as an '+L.g('ost','opportunity solution tree')+'. Read it from the top down:')+
   L.tiers([['target','Outcome (the root)','The business need: how the team creates value for the business.','Fernway: more delivered meals get cooked'],
            ['people','Opportunities','Customer needs, pain points and desires that, if addressed, would drive the outcome.','“Ingredients go bad before I get to them”',true,'The framing'],
            ['bulb','Solutions','The ideas you’re exploring for a chosen opportunity.','Spoilage reminders · freezer-friendly meals'],
            ['flask','Assumption tests','How you check which solutions will really work.','Will people open a reminder text?']])+
   '<p class="small" style="margin-top:10px">Fernway’s outcome is a preview. Lesson 3 shows how the trio sets it.</p>');
  L.done();}},
{part:2,src:'Chapter 2 · OSTs help product trios adopt a continuous mindset',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">Breaking a big opportunity into bites</h1>');
  L.beats(L.card,[
   ['Too big','“Recipes take too long on weeknights” is huge. Solving it in one go would be a months-long project.'],
   ['Go down a level','Under it, the trio adds smaller opportunities: “Chopping takes ages”, “I can’t tell which recipes are quick”, “Cleanup takes too long”.'],
   ['Pick one','They start with “I can’t tell which recipes are quick.” It’s small enough to work on now.'],
   ['Ship value','A small fix, like showing cooking time up front, can reach customers within a sprint, a short work cycle.'],
   ['Repeat','Next sprint, the next small opportunity. Over time, these small wins add up to solving the big one.']],
   'Opportunities get smaller as you go down the tree. Solving small ones, one at a time, is how a continuous team delivers value every cycle.');}},
{part:2,src:'Chapter 2 · The underlying structure of discovery',pts:1,run(L){
  L.h(L.kick('try','Build a branch')+'<h1 class="q">Tap these into place, from the root of the tree down.</h1>');
  L.order(L.card,['More delivered meals get cooked','“Ingredients go bad before I get to them”','Spoilage reminders','Will people open a reminder text?'],
   'Outcome, then the opportunity that drives it, then a solution for that opportunity, then a test of that solution.',['Outcome','Opportunity','Solution','Assumption test']);}},
{part:2,src:'Chapter 2 · The underlying structure of discovery',pts:6,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Where on the tree?',['Outcome','Opportunity','Solution','Assumption test'],[
   ['Quick weeknight recipes',2,'It’s something Fernway could build: a solution.'],
   ['“Our budget is tight, so every wasted meal hurts.” (Ana and Joe)',1,'A pain point in the customer’s words: an opportunity.'],
   ['Check whether shift workers would link their work calendar',3,'It checks whether a solution can work: an assumption test.'],
   ['More delivered meals get cooked each week',0,'The goal at the root of Fernway’s tree.'],
   ['“I want to cook a cuisine I’ve never tried.” (Sam)',1,'A desire: an opportunity.'],
   ['A recipe filter for new cuisines',2,'A feature to build: a solution.']]);}},

/* ---------- PART 4: USING THE TREE ---------- */
{part:3,src:'Chapter 2 · The underlying structure of discovery',run(L){
  L.h(L.kick('learn','Why draw a tree?')+'<h1 class="q">The book lists seven benefits</h1>'+
   L.list([['scale','Resolves the tension','Only opportunities that could drive the outcome make the tree, so customer value and business value line up.'],
     ['people','Shared understanding','The trio sees the same picture instead of each person jumping to a favorite fix.'],
     ['cycle','A continuous mindset','Big opportunities break into small ones you can solve one at a time.'],
     ['compass','Better decisions','You see options side by side, so you compare instead of saying yes or no to one.'],
     ['flask','Faster learning','When an idea fails, you can see what you misunderstood and fix it.'],
     ['map','Knowing what’s next','The shape of the tree points to the next step.'],
     ['chat','Easier stakeholder talks','You show your thinking, not just your conclusions.']],2));
  L.done();}},
{part:3,src:'Chapter 2 · OSTs unlock better decision-making',run(L){
  L.h(L.kick('learn','Compare and contrast')+'<h1 class="q">Stop asking “Should we do this?”</h1>'+
   L.prose('The book draws on <i>Decisive</i> by Chip and Dan Heath, which names four villains of decision-making: looking too narrowly, '+L.g('confirm','confirmation bias')+', short-term emotions (like falling for your own idea) and overconfidence.')+
   L.prose('The tactic the book relies on most: avoid '+L.g('wornot','“whether or not” decisions')+'. Compare your options instead.')+
   L.lanes([['x','Whether or not','“Should we stop everything and build this feature?”',4],
            ['scale','Compare and contrast','“Which of these needs matters most right now?” “What else could we build?”',2]])+
   L.note('Good discovery lowers the chance of failure, but never removes it. And most discovery decisions can be reversed, so decide, test, and adjust instead of stalling.','info'));
  L.done();}},
{part:3,src:'Chapter 2 · OSTs unlock better decision-making',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">The head of marketing asks the trio to build a pet idea: wine pairings for every recipe. What should Priya ask?</h1>');
  L.mc(L.card,['Should we stop everything to build wine pairings?','Which of our options best gets more meals cooked?','How quickly could Dev build wine pairings?'],1,
   'That puts wine pairings next to the other options on the tree, so the team compares instead of saying yes or no.',
   'Asking whether to build it, or how fast, still judges wine pairings alone. A compare-and-contrast question sets it beside the other options.');}},
{part:3,src:'Chapter 2 · OSTs unlock faster learning cycles',run(L){
  L.h(L.kick('learn','Problem and solution grow together')+'<h1 class="q">Don’t split “the problem” from “the solution”</h1>'+
   L.prose('Some companies say the product manager owns the problem and the designer and engineer own the solution. The book disagrees. Research on expert designers found the best ones develop the problem and the solution <i>together</i>: each solution teaches them more about the problem.')+
   L.prose('So when a test shows an idea won’t work, don’t just grab the next one. First ask:')+
   L.note('<b>“I thought this would work. It didn’t. What did I misunderstand about my customer?”</b> Then update the opportunity space before choosing new ideas.','bulb')+
   L.prose('Skip that step, and the next idea is just another guess. The whole trio owns both the problem and the solution.'));
  L.done();}},
{part:3,src:'Chapter 2 · OSTs unlock faster learning cycles',pts:1,
 solve:async L=>{L.$('#flop').click();},
 run(L){
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Two trios test spoilage reminders. Press the button to see how each reacts when the test fails.</h1>'+
   L.lanes([['arrow','Trio A','Plan: try ideas from the list until one works.<div class="res" id="la"></div>',4],
            ['tree','Trio B','Plan: learn from each result and update the tree.<div class="res" id="lb"></div>',2]])+
   '<button class="btn pri" id="flop" style="margin-top:14px">'+L.ic('play')+'Reminders flop</button><div id="fq"></div>');
  L.$('#flop').onclick=function(){this.remove();
    L.$('#la').innerHTML='<span style="color:var(--no)">Jumps to freezer meals. No new insight, just the next guess.</span>';
    L.$('#lb').innerHTML='<span style="color:var(--ok)">Talks to Maya: food spoils in long-shift weeks, when no reminder helps. They add “My weeks vary a lot” to the tree.</span>';
    const q=L.$('#fq');q.innerHTML='<h2 class="sub">What did Trio B do that Trio A skipped?</h2>';
    L.mc(q,['Revised their picture of the customer','Ran a bigger, more careful test'],0,
     'They asked what they misunderstood, and fixed the opportunity space. Their next ideas will fit Maya’s real life.',
     'Test size wasn’t the difference. Trio B asked what they misunderstood about the customer and updated the tree before moving on.');};}},
{part:3,src:'Chapter 2 · OSTs build confidence in knowing what to do next',run(L){
  L.h(L.kick('learn','Read the shape')+'<h1 class="q">The tree tells you what to do next</h1>'+
   L.list([['chat','Opportunity space too shallow?','You don’t know customers well yet. Do more interviews.'],
     ['target','Opportunity space sprawling?','Too much at once. Narrow your focus.'],
     ['bulb','Too few solutions for your target?','Hold an ideation session to come up with more.'],
     ['flask','Too few tests running?','Ramp up your assumption testing.']],3)+
   L.prose('The best teams work both ways: top-down from the outcome, and bottom-up, letting test results reshape the opportunities above them. They keep interviewing and keep the whole tree up to date.'));
  L.done();}},
{part:3,src:'Chapter 2 · OSTs build confidence in knowing what to do next',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'What should the trio do next?',['Interview more','Narrow the focus','Generate more ideas','Test more'],[
   ['Fernway’s tree has just two vague opportunities under the outcome.',0,'A shallow opportunity space means the trio doesn’t know customers well enough yet.'],
   ['The tree has 40 opportunities, and the trio is working on eight of them.',1,'A sprawling space is a sign to pick a target and focus.'],
   ['The target opportunity has only one solution under it: spoilage reminders.',2,'With one idea you can’t compare and contrast. Hold an ideation session.'],
   ['Three promising solutions sit on the tree, but nothing is being tested.',3,'Run assumption tests across the set so you don’t overcommit to one.']]);}},
{part:3,src:'Chapter 2 · OSTs unlock simpler stakeholder management',run(L){
  L.h(L.kick('learn','Show your work')+'<h1 class="q">Bring stakeholders along without drowning them</h1>'+
   L.prose('Leaders often find it hard to stop dictating features. So a trio has to explain its decisions as well as make them. Trios tend to make one of two mistakes:')+
   L.lanes([['layers','Too much','Whole interview recordings and pages of raw notes. Stakeholders are asked to do the discovery work.',4],
            ['x','Too little','Only conclusions, with the research picked to support them. Stakeholders can’t really judge.',4]])+
   L.prose('The tree fixes both. Walk them through it: the outcome, what you’ve learned about customers, the solutions you’re weighing and the tests you’re running. They see your thinking and can add what you don’t know.'));
  L.done();}},
{part:3,src:'Chapter 2 · OSTs unlock simpler stakeholder management',pts:1,run(L){
  L.h(L.kick('pr','Final check')+'<h1 class="q">Priya has 15 minutes with Fernway’s head of product to share a month of discovery. What should Priya bring?</h1>');
  L.mc(L.card,['All 12 interview recordings and all the notes','One slide: “We should build freezer meals”','The tree, from outcome down to current tests'],2,
   'The tree shows the big picture and the key choices, and leaves room for useful feedback.',
   'Recordings and raw notes are too much: the leader would have to do the discovery. One conclusion slide is too little: it hides the thinking. Walk through the tree.');}}
  ]
});
</script>
</body>
</html>
