<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Measuring Impact</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0011', title:'Measuring impact', minutes:18, icon:'trend',
  goals:['Track only what your tests need, and know when to count people or actions','Measure your real outcome, even when it’s hard to see','Check that your product outcome really drives the business outcome'],
  parts:['Beyond the test','Count what matters','Measure the outcome','Traps'],
  read:'Read chapter 11 of the book for the full AfterCollege story and the streaming-sports example.',
  glossary:{
    'instrument':'Instrumenting: adding tracking to your product so it records what people do.',
    'live-prototype':'Live prototype: a rough but working version of an idea that real customers use inside the real product.',
    'split':'Splitting traffic: showing a new version to only some users, so you can compare them with users of the old one.',
    'gaming':'Gaming a number: pushing it up without creating any real value for customers.',
    'walk-lines':'Walking the lines: tracing a solution up the opportunity solution tree to check it drives the outcome, not just that customers like it.'
  },
  cheatsheet:[
    'A passed assumption test isn’t the finish line. Always ask: did it move the <b>outcome</b>?',
    '<b>Discovery feeds delivery, and delivery feeds discovery.</b> You are never done with discovery.',
    '<b>Don’t measure everything.</b> Start with what this week’s tests need, and grow from there.',
    'Ask: is one person doing many actions worth as much as many people doing one? If you need many people, <b>count people</b>. If not, <b>count actions</b>.',
    '<b>Measure hard things.</b> Easy numbers are easy to game. Chip away until you can see the real outcome.',
    'Test a big solution’s impact with a <b>small slice</b> of it first, using real data.',
    'The link from product outcome to business outcome is a <b>theory</b>. Keep checking it.',
    'Traps: measuring everything, forgetting to walk the tree, never testing the outcome link.'
  ],
  steps:[
/* ---------- PART 1: BEYOND THE TEST ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Fernway tries a pre-chopped option with a small group, and lots of customers add it to their meals. Is the trio done?</h1>');
  L.mc(L.card,['Not yet: did more meals actually get cooked?','Yes: customers clearly want pre-chopped'],0,
   'Customers wanting something is a good start. The trio’s goal is more meals cooked, so that’s what they still need to see.',
   'Wanting it is only half the story. The trio’s outcome is more meals cooked. This lesson is about measuring that, not just the test.');}},
{part:0,src:'Chapter 11 · opening story, summarized',run(L){
  L.h(L.kick('ex','A real story from the book')+'<h1 class="q">AfterCollege stops asking students questions they can’t answer</h1>');
  L.beats(L.card,[
   ['The problem','Teresa Torres joins AfterCollege, a job site for new graduates. In interviews, students say they can’t answer the usual job-board questions: what type of job, and where. Most have no idea yet.'],
   ['The idea','Ask easier questions instead: where you study, what, and when you graduate. Then recommend jobs from that.'],
   ['A crude prototype','No smart algorithm yet. The team writes a saved search by hand for each subject and sends a small share of visitors to the new page. It’s live in a few days.'],
   ['The result','On the old page, 36% of visitors start a search. On the new one, 83% do. Searchers view and apply a bit less often, but far more people search, so overall it does better.'],
   ['The open question','Their real goal is more students <b>getting jobs</b>, not more searches. So they keep '+L.g('split','splitting traffic')+' until they know the new page helps students get hired.']],
   'A test can succeed while the outcome is still unknown. Keep measuring until you see the outcome move.');}},
{part:0,src:'Chapter 11 · opening story',run(L){
  L.h(L.kick('learn','Two lessons from the story')+'<h1 class="q">Successful tests aren’t the goal. The outcome is.</h1>'+
   L.list([['target','Stay focused on the outcome','Plenty of ideas succeed in some way. Measure what your assumption tests need <i>and</i> what shows impact on your '+L.g('outcome','outcome')+'.'],
     ['cycle','Discovery never ends','AfterCollege’s '+L.g('discovery','discovery')+' required real '+L.g('delivery','delivery')+': a working page that real users could use. Measuring that delivery led to more discovery.']],2)+
   L.flow([['flask','Discovery','tests ideas, then ships a small working version'],['box','Delivery','puts it in front of real users, with tracking'],['cycle','More discovery','what you measure raises new questions']])+
   L.prose('As tests grow, they move into the real product with real users and real data. That’s where delivery begins. So the book says the two aren’t separate phases: each feeds the other.'));
  L.done();}},
{part:0,src:'Chapter 11 · opening story',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Why didn’t AfterCollege switch all visitors to the new page right away?</h1>');
  L.mc(L.card,['The prototype was too rough to show to everyone','More searches meant the test had actually failed','They didn’t yet know if more students got jobs'],2,
   'Search starts were up, but the outcome was students getting hired. Views and applications don’t always lead to hires, so they kept comparing.',
   'The rough prototype was already beating the polished page, and more searches was good news. The missing piece was the outcome: were more students getting jobs?');}},
{part:0,src:'Chapter 11 · opening story',pts:1,run(L){
  L.h(L.kick('pr','Apply it')+'<h1 class="q">Fernway’s pre-chopped '+L.g('live-prototype','live prototype')+' is beating the normal menu. Marco asks: “When are we done with discovery, so we can hand this to delivery?”</h1>');
  L.mc(L.card,['Once the prototype beats the normal menu','Never: what delivery measures feeds discovery','As soon as every assumption has been tested'],1,
   'The book’s answer: you’re never done. Shipping with good tracking turns delivery into a source of new discovery.',
   'There’s always more to learn. The live prototype is already delivery, and what it measures will raise new questions. Discovery and delivery feed each other.');}},

/* ---------- PART 2: COUNT WHAT MATTERS ---------- */
{part:1,src:'Chapter 11 · Don’t Measure Everything',run(L){
  L.h(L.kick('learn','Don’t measure everything')+'<h1 class="q">Start with what this week’s tests need</h1>'+
   L.prose('When teams start to '+L.g('instrument','instrument')+' their product, they often try to plan tracking for everything up front. The book calls that a waste of time.')+
   L.list([['clock','It stalls you','Weeks go into debating which events to track, what to name them and who owns what.'],
     ['alert','You’ll get it wrong anyway','A number turns out to mean something else. A bug fires an event ten times too often. It happens to everyone.']],4)+
   L.note('<b>Instead:</b> start small. Track what you need to judge this week’s assumption tests, and learn your way to better tracking.','leaf'));
  L.done();}},
{part:1,src:'Chapter 11 · Instrument Your Evaluation Criteria',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">What AfterCollege actually tracked</h1>');
  L.beats(L.card,[
   ['Assumptions','Students will start more searches with easier questions. They’ll view the jobs we recommend. They’ll apply to them.'],
   ['Criteria','Out of 500 visitors: at least 250 start a search (the old page got 180). At least 63 view a job, and at least 7 apply. Those last two were set <i>below</i> the old page, since the hand-made searches were rough and would improve.'],
   ['What they tracked','Just four counts: people who visited the page, started a search, viewed at least one job, and applied to at least one job.'],
   ['Notice','They counted <b>people</b> who took an action, not the number of actions. And they didn’t track every click on every page.']],
   'Turn each success criterion into a count, and track only those counts to start.');}},
{part:1,src:'Chapter 11 · Instrument Your Evaluation Criteria',run(L){
  L.h(L.kick('learn','People or actions?')+'<h1 class="q">One question tells you what to count</h1>'+
   L.prose('Ask: <i>if one person did many actions, would that create as much value as many people doing one action each?</i>')+
   L.lanes([['people','Count people','When you need <b>many people</b> to act. AfterCollege needed many students to trust the new page, so it counted students who searched.',2],
            ['pointer','Count actions','When it doesn’t matter <b>who</b> acts. To judge how relevant results were, AfterCollege counted job views and how many views came before an application.',3]])+
   L.prose('Counting people shows how many succeed. Counting actions shows how hard each one had to work to get there.'));
  L.done();}},
{part:1,src:'Chapter 11 · Instrument Your Evaluation Criteria',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Fernway wants to know if <i>many</i> customers find the new weekly planner useful. One customer opening it 50 times isn’t the same as 50 customers opening it once. What should they count?</h1>');
  L.mc(L.card,['The number of times the planner is opened','The number of customers who open the planner'],1,
   'They need many people to find it useful, so they count people. One heavy user can’t stand in for fifty.',
   'Counting opens lets one heavy user look like fifty happy customers. When you need many people, count people.');}},
{part:1,src:'Chapter 11 · Instrument Your Evaluation Criteria',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'People or actions?',['Count people','Count actions'],[
   ['Will customers trust pre-chopped meals enough to add one?',0,'You need many customers to trust it. One keen fan adding twenty meals doesn’t show that.'],
   ['How many recipes does a customer scroll past before picking one?',1,'This measures how hard each customer works to find a meal, so count the actions.'],
   ['Do enough households use the Sunday batch-chop guide?',0,'“Enough households” means many people. Count customers, not uses.'],
   ['How many times does someone tap “swap meal” before they’re happy with their week?',1,'This is about effort per customer. Count the taps.'],
   ['How many meal photos get shared in total, when one keen sharer helps as much as many?',1,'If it doesn’t matter who does it, count the actions.']]);}},
{part:1,src:'Chapter 11 · Instrument Your Evaluation Criteria',pts:5,run(L){
  L.h(L.kick('pr','Track it or skip it?')+'<h1 class="q">The pre-chopped option is going live for 500 customers. The criteria: at least 100 add it to a meal, and at least 60 of those order it again next week. What should Dev track this week?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Track now','Skip for now'],[
   ['Customers who see the pre-chopped option',0,'This is the “out of 500” in the criteria. Without it, the other counts mean nothing.'],
   ['Every tap and scroll on every screen of the app',1,'That’s measuring everything. It stalls the team and isn’t needed for this test.'],
   ['Customers who add pre-chopped to at least one meal',0,'It’s the first criterion, counted in people.'],
   ['How long each customer looks at each meal photo',1,'Interesting, maybe, but no criterion depends on it.'],
   ['Customers who order pre-chopped again the next week',0,'It’s the second criterion. Track it now.']],
   'Each criterion becomes one count. Anything else can wait until a test needs it.');}},

/* ---------- PART 3: MEASURE THE OUTCOME ---------- */
{part:2,src:'Chapter 11 · Measure Impact on Your Desired Outcome',run(L){
  L.h(L.kick('learn','Measure hard things')+'<h1 class="q">Your outcome may happen where you can’t see it</h1>'+
   L.prose('AfterCollege’s outcome was students getting jobs. But interviews, offers and hires all happened outside the site. Some in the company said: just count job applications.')+
   L.prose('The team refused. Applications are easy to '+L.g('gaming','game')+': you can push students to apply to lots of jobs without helping anyone get hired. So 21 days after each application, they emailed the student: <i>What happened?</i> Each of the four answers got something useful back, like interview tips or advice on an offer.')+
   L.flow([['chat','At launch','5% of applications got a reply','',4],['cycle','Later','14%','',3],['trend','By the time she left','37%: a real view of hires','',2]])+
   L.quote('Your delusions, no matter how convincing, will wither under the harsh light of data.','Alistair Croll and Benjamin Yoskovitz, quoted at the start of chapter 11'));
  L.done();}},
{part:2,src:'Chapter 11 · Measure Impact on Your Desired Outcome',pts:1,
 solve:async L=>{L.$('#pop').click();},
 run(L){
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Cooking happens in customers’ kitchens, not in the app. Someone suggests tracking “recipes opened” instead. Add a pop-up and watch both numbers.</h1>'+
   '<div style="background:var(--soft);border-radius:16px;padding:14px;margin:6px 0 10px">'+
   '<div class="meterrow"><div class="lb">Recipes opened</div><div class="meter"><div id="m0" style="background:var(--h3);width:40%;transition:width .8s"></div></div></div>'+
   '<div class="meterrow"><div class="lb">Meals cooked</div><div class="meter"><div id="m1" style="background:var(--ok-strong);width:50%;transition:width .8s"></div></div></div>'+
   '<p class="small" id="mc" style="margin-top:8px">Before the pop-up.</p></div>'+
   '<button class="btn pri" id="pop">'+L.ic('play')+'Add a “5 more recipes you’ll love!” pop-up</button><div id="pq"></div>');
  L.$('#pop').onclick=function(){this.remove();L.$('#m0').style.width='88%';
    L.$('#mc').innerHTML='<b>After the pop-up:</b> recipes opened more than doubled. Meals cooked didn’t move at all.';
    const q=L.$('#pq');q.innerHTML='<h2 class="sub">Which number should the trio judge their work by?</h2>';
    L.mc(q,['Recipes opened, since it’s easy to track','Meals cooked, even though it’s harder'],1,
     'One pop-up inflated recipes opened without helping anyone cook. That’s an easy number being gamed. Measure the outcome, even if it takes work.',
     'Recipes opened jumped while nobody cooked more. An easy number can be pushed up with no real value. Keep the harder, honest one: meals cooked.');};}},
{part:2,src:'Chapter 11 · Measure Impact on Your Desired Outcome',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">Fernway finds a way to see meals cooked</h1>');
  L.beats(L.card,[
   ['The gap','Fernway can see a box delivered, but not whether each meal got cooked. That happens off the app.'],
   ['The check-in','Two days after delivery, the app asks: “What happened to Monday’s meal?” Like AfterCollege’s email, each answer gives the customer something back.'],
   ['The answers','<b>Cooked it</b>: rate the recipe. <b>Not yet</b>: see its cook-by date and a faster way to make it. <b>It went to waste</b>: pick a reason in one tap.'],
   ['Rough at first','Only a few customers reply at first. The trio keeps adjusting the timing and wording, and replies slowly climb.'],
   ['Good enough to steer by','Not perfect, but now the trio can follow meals cooked week by week, and see whether pre-chopped moves it.']],
   'Don’t pick an easier number just because the real outcome is hard to see. Chip away at measuring it.');}},
{part:2,src:'Chapter 11 · Measure Impact on Your Desired Outcome',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">In its first week, only 6% of customers answer the “What happened to Monday’s meal?” check-in. What should the trio do?</h1>');
  L.mc(L.card,['Drop it, since the data is too thin','Keep improving it to raise replies','Count recipe views instead of cooking'],1,
   'AfterCollege started at 5% and kept iterating to 37%. A partial view of the outcome beats a precise view of the wrong number.',
   'Dropping it or switching to an easy number means giving up on the outcome. AfterCollege started at 5% and kept improving its email. Keep chipping away.');}},
{part:2,src:'Chapter 11 · Revisiting Different Types of Outcomes',run(L){
  L.h(L.kick('learn','Product outcome to business outcome')+'<h1 class="q">The link between them is a theory, so test it</h1>'+
   L.prose('Back in lesson 3, the trio picked a product outcome, more meals cooked, because they believed it drives the business outcome, fewer cancellations. That belief still needs checking.')+
   L.flow([['box','Solution','Pre-chopped ingredients','tested in assumption tests',4],['people','Product outcome','More meals cooked','moves within weeks',2],['trend','Business outcome','Fewer cancellations','moves slowly',3]])+
   L.prose('You don’t need the full solution to test impact. The book’s streaming example: before signing deals for all sports, stream <b>one</b> game and see if those viewers watch more overall.')+
   L.note('If, over time, the product outcome rises but the business outcome doesn’t, the team needs a new product outcome that <i>does</i> drive it.','alert'));
  L.done();}},
{part:2,src:'Chapter 11 · Revisiting Different Types of Outcomes',pts:1,run(L){
  L.h(L.kick('pr','Test it small')+'<h1 class="q">Planning meals around a shift calendar would need links to many calendar apps. How can the trio see if it lifts meals cooked first?</h1>');
  L.mc(L.card,['Build links to every calendar app, then measure','Let 30 shift workers type in shifts for a month','Ask shift workers if a calendar link would help'],1,
   'Like streaming one game, a small real slice shows whether meals cooked goes up, before the big build.',
   'Building everything first is the slow, costly path, and asking about the future gives unreliable answers. Try a small real version and measure meals cooked.');}},
{part:2,src:'Chapter 11 · Revisiting Different Types of Outcomes',pts:1,run(L){
  L.h(L.kick('pr','Read the link')+'<h1 class="q">Two quarters later, meals cooked is up 20%. Cancellations haven’t budged. What should Priya’s trio do?</h1>');
  L.mc(L.card,['Look for a product outcome that drives retention','Keep going, since meals cooked is the number they own','Switch to a traction metric for pre-chopped'],0,
   'The theory that more cooking means fewer cancellations isn’t holding up. A product outcome is only useful if it moves the business outcome.',
   'Owning a number isn’t enough if it doesn’t drive the business. And a traction metric would narrow things further. Find a product outcome that does move cancellations.');}},

/* ---------- PART 4: TRAPS ---------- */
{part:3,src:'Chapter 11 · Avoid These Common Anti-Patterns',run(L){
  L.h(L.kick('learn','Three common traps')+'<h1 class="q">Where measuring impact goes wrong</h1>'+
   L.list([['Trying to measure everything','Turning tracking into one huge up-front project. Start with this week’s tests, then the product outcome, then its link to the business outcome.'],
     ['Forgetting to walk the tree','A solution customers love can still fail the business. '+L.g('walk-lines','Walk the lines')+' of your opportunity solution tree: does it drive the outcome? Customers wanting it isn’t enough. It must work for the business too.'],
     ['Never testing the outcome link','Driving the product outcome isn’t the end. Keep checking that it moves the business outcome.']],4));
  L.done();}},
{part:3,src:'Chapter 11 · Avoid These Common Anti-Patterns',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Spot the trap',['Measuring everything','Forgot to walk the tree','Untested outcome link','No trap here'],[
   ['Dev wants to spend the quarter designing a tracking plan for every screen before any more tests.',0,'One huge up-front plan stalls the team. Track what this week’s tests need.'],
   ['Customers rave about the Sunday batch-chop guide. The trio celebrates its usage and never checks meals cooked.',1,'Loving a feature isn’t the goal. Trace it back up the tree to the outcome.'],
   ['For a year, meals cooked has climbed every quarter. Nobody has looked at cancellations.',2,'The link from meals cooked to retention is a theory. Check it.'],
   ['The trio tracks only the three counts this week’s fewer-chop recipe test needs.',3,'That’s the right way to start: small and tied to the criteria.'],
   ['Pre-chopped meals get great ratings, but every box now loses money, and nobody noticed.',1,'Desirable isn’t enough; it must be viable too. Walking the lines would have caught it.']]);}},
{part:3,src:'Chapter 11 · Avoid These Common Anti-Patterns',pts:1,run(L){
  L.h(L.kick('pr','Put in order')+'<h1 class="q">Put Fernway’s measuring work in the order the book suggests building it up.</h1>');
  L.order(L.card,['Agree on success criteria for this week’s tests','Track just the counts those criteria need','Measure the effect on meals cooked','Check that more cooking means fewer cancellations'],
   'Start small with this week’s tests, then measure the product outcome, then strengthen its link to the business outcome.');}},
{part:3,src:'Chapter 11 · Avoid These Common Anti-Patterns',pts:1,run(L){
  L.h(L.kick('pr','Final check')+'<h1 class="q">The head of marketing says: “Customers rate pre-chopped 4.8 out of 5. Roll it out to everyone!” What should Priya check first?</h1>');
  L.mc(L.card,['Whether its ratings stay above 4.5 next month','Whether it lifts meals cooked and covers its cost','Whether other meal-kit apps offer it already'],1,
   'That’s walking the lines: does the solution drive the outcome, and does it work for the business? High ratings only show customers like it.',
   'Ratings and competitors don’t tell you about impact. Walk the lines: does pre-chopped drive meals cooked, and can Fernway afford it?');}}
  ]
});
</script>
</body>
</html>
