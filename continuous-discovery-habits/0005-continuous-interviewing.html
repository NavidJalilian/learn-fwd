<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">

<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0005', title:'Continuous interviewing', minutes:22, icon:'chat',
  goals:['Turn what you want to learn into a story-based interview question','Dig a full, specific story out of a short answer','Keep a weekly interview habit going with snapshots and automatic recruiting'],
  parts:['Why stories','Asking well','Snapshots','Every week'],
  read:'Read chapter 5 of the book for the visual-voicemail story, the split-brain research and a sample interview snapshot.',
  glossary:{
    'cognitive-bias':'Cognitive bias: a common, built-in pattern of mental error that comes from how our brains process information.',
    'research-q':'Research question: what your team wants to learn. You don’t ask it out loud.',
    'interview-q':'Interview question: what you actually ask the customer, usually “Tell me about the last time…”',
    'experience-map':'Experience map: a simple drawing of what your customer goes through today, as the customer sees it.',
    snapshot:'Interview snapshot: a one-page summary of a single interview, made right after it.'
  },
  cheatsheet:[
    'Interviews are for <b>discovering opportunities</b>, not for asking customers what to build.',
    'People are poor reporters of their own behavior. <b>Ask for a specific story</b>: “Tell me about the last time…”',
    'Keep <b>research questions</b> (what you want to learn) apart from <b>interview questions</b> (what you ask).',
    '<b>Excavate the story</b>: reset the 50/50 norm, walk the timeline, ask who helped and what got in the way, and pull “I usually…” back to this one time.',
    'Let the customer lead. A dud interview is fine: another one is coming next week.',
    '<b>Synthesize as you go</b> with a one-page snapshot: image, quote, quick facts, opportunities (needs, not features), insights and a drawing of their story.',
    'Interview <b>every week, as a trio</b>, and automate recruiting so an interview is booked without effort.'
  ],
  steps:[
/* ---------- PART 1: WHY STORIES ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">You ask a friend who exercises, “How many times a week do you go to the gym?” Then you check their gym app’s log. What usually happens?</h1>');
  L.mc(L.card,['Their guess matches the log closely','They guess higher than the log shows'],1,
   'People who work out tend to overestimate how often they do. Nobody is lying: we’re just bad at reporting our own habits. That’s a big problem for customer interviews.',
   'Research shows active adults tend to overestimate how often they work out. We’re bad at reporting our own habits, which is a big problem for customer interviews.');}},
{part:0,src:'Chapter 5 · opening',run(L){
  L.h(L.kick('learn','What interviews are for')+'<h1 class="q">Don’t ask customers what to build. Find out what they need.</h1>'+
   L.prose('Steve Jobs argued that people don’t know what they want until you show it to them. The book agrees: customers aren’t the inventors. We are.')+
   L.prose('But that’s no reason to stop talking to them. The point of an interview is to <b>discover and explore '+L.g('opportunity','opportunities')+'</b>: needs, pain points and desires.')+
   L.lanes([['x','Not this','“What should we build for you?”',4],['check','This','“What’s hard, annoying or missing in your life right now?”',2]])+
   L.note('<b>Visual voicemail</b>, an early iPhone feature, is the book’s example. Old voicemail made you dial in and hear messages one by one. It was tedious, but people were so used to it they didn’t notice. Nobody would have asked for the fix, yet the need was real.','book'));
  L.done();}},
{part:0,src:'Chapter 5 · The challenges with asking people what they need',run(L){
  L.h(L.kick('ex','A real story from the book')+'<h1 class="q">The jeans question: two answers from the same person</h1>');
  L.beats(L.card,[
   ['Direct question','At a workshop, the author asks a woman what matters most when she buys jeans. She answers at once: <b>fit</b>.'],
   ['Story question','Then: tell me about the last time you bought jeans. She bought them <b>on Amazon</b>.'],
   ['The gap','How did she know they’d fit? She didn’t. They were a <b>brand she liked</b>, and they were <b>on sale</b>.'],
   ['What it shows','Her first answer was how she <i>thinks</i> she buys jeans. The story showed how she <i>actually</i> did. She wasn’t lying. People just don’t understand their own behavior very well.']],
   'The author has asked these two questions countless times. The reasons change, but there’s always a gap between the two answers.');}},
{part:0,src:'Chapter 5 · The challenges with asking people what they need',run(L){
  L.h(L.kick('learn','Why direct questions mislead')+'<h1 class="q">Our brains give confident answers that aren’t true</h1>'+
   L.prose('A direct question asks people to recall facts with no context. That invites '+L.g('cognitive-bias','cognitive biases')+':')+
   L.list([['clock','How often','We misjudge how often we do things.'],
     ['person','Who we want to be','Answers reflect our sense of who we are more than what we do.'],
     ['bulb','Neat reasons','We make up reasons that sound right but aren’t grounded in what happened.']],3)+
   L.prose('In Michael Gazzaniga’s studies of split-brain patients, people confidently made up reasons for choices whose cause they couldn’t know. Later studies showed we all do this.')+
   L.quote('A remarkable aspect of your mental life is that you are rarely stumped.','Daniel Kahneman, quoted in chapter 5')+
   '<p class="small" style="margin-top:10px">The author learned this the hard way. Recruiters all said they wanted to hire people who already had jobs. The author’s team built a tool for that, and it flopped: recruiters are judged on speed, so they kept hiring people who were job hunting.</p>');
  L.done();}},
{part:0,src:'Chapter 5 · Distinguish research questions from interview questions',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Which question will show Fernway’s trio what Ana and Joe <i>actually</i> do?</h1>');
  L.mc(L.card,['How often do you cook your Fernway meals?','Tell me about the last time you cooked one.','What do you look for in a weeknight recipe?'],1,
   'A specific, recent story shows real behavior. The other two ask Ana and Joe to generalize, which invites guesses.',
   '“How often” asks them to estimate, which we do badly. “What do you look for” asks for a general rule, which brings out their ideal selves. Ask for the last time.');}},
{part:0,src:'Chapter 5 · The challenges with asking people what they need',pts:1,
 solve:async L=>{const g=L.$('#ax').children;g[0].click();g[1].click();},
 run(L){
  const A=[['Ask directly','“What do you look for in a recipe?”','“Something new. I love trying cuisines I’ve never cooked.”'],
           ['Ask for a story','“Tell me about the last time you cooked a Fernway meal.”','“Tuesday. Work calls ran until 7:30, so I grabbed the 20-minute stir-fry. The Ethiopian stew I was excited about takes an hour. It’s still in the fridge.”']];const seen=new Set();
  L.h(L.kick('pr','Toggle and compare')+'<h1 class="q">Marco interviews Sam two ways. Try both and compare what you learn.</h1><div id="ax"></div>'+
   '<div style="background:var(--soft);border-radius:16px;padding:14px;margin:8px 0 6px;min-height:110px" id="aa"><div class="small">Choose a way to ask above.</div></div><div id="aq"></div>');
  A.forEach((a,j)=>{const b=document.createElement('button');b.className='chip';b.innerHTML=L.ic(j?'book':'chat')+a[0];b.onclick=()=>{[...L.$('#ax').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(j);
    L.$('#aa').innerHTML='<div class="small"><b>Marco:</b> '+a[1]+'</div><p class="prose" style="margin:8px 0 0"><b>Sam:</b> '+a[2]+'</p>';
    if(seen.size===2&&!L.$('#aq').innerHTML){const q=L.$('#aq');q.innerHTML='<h2 class="sub">Which opportunity should the trio note from Sam?</h2>';
      L.mc(q,['Recipes take too long on weeknights','I want more new cuisines to try'],0,
       'The story shows the adventurous stew went uncooked because it took an hour on a busy night. That’s what actually got in the way.',
       'Sam may really love new cuisines, but that’s Sam’s ideal self talking. Sam’s story shows the stew sat uncooked because it took too long on a weeknight.');}};L.$('#ax').appendChild(b);});}},

/* ---------- PART 2: ASKING WELL ---------- */
{part:1,src:'Chapter 5 · Distinguish research questions from interview questions',run(L){
  L.h(L.kick('learn','Two kinds of question')+'<h1 class="q">What you want to learn is not what you ask</h1>'+
   L.lanes([['compass','Research question','What the team wants to learn. You could list hundreds. You don’t ask them out loud.',3],
            ['chat','Interview question','What you actually ask: one or two prompts that draw out a story. “Tell me about the last time…”',2]])+
   L.prose('In every interview, the main '+L.g('research-q','research question')+' is: <b>which needs, pain points and desires matter most to this customer?</b> Let the customer set the direction. What matters to them beats what you hoped to learn.')+
   L.prose('No need for a multi-page question list. You’ll talk to another customer next week, so focus on what you need to learn now.'));
  L.done();}},
{part:1,src:'Chapter 5 · Distinguish research questions from interview questions',run(L){
  L.h(L.kick('learn','How wide a story?')+'<h1 class="q">The scope of your story question decides what you hear about</h1>'+
   L.tiers([['box','Narrow','“Tell me about the last time you cooked a Fernway meal.”','Helps you improve the product you have'],
            ['home','Broader','“…the last time you made dinner at home.”','Also brings out rivals: grocery runs, other meal kits'],
            ['compass','Broadest','“…the last time you had dinner.”','Shows what you really compete with, like takeout, and maybe new markets']])+
   L.prose('Pick the width you need right now. It should match the scope you chose for your '+L.g('experience-map','experience map')+' in the last lesson.'));
  L.done();}},
{part:1,src:'Chapter 5 · Distinguish research questions from interview questions',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Priya’s research question: “Why do delivered meals go uncooked?” What should Priya ask Ana?</h1>');
  L.mc(L.card,['Why don’t you cook all of your meals?','Would spoilage reminders help you cook more?','Tell me about the last time a meal went uncooked.'],2,
   'It turns the research question into a request for one real story.',
   '“Why don’t you…” asks Ana to explain their own behavior, which invites neat but unreliable reasons. Asking about reminders asks Ana to judge a solution. Ask for a specific story.');}},
{part:1,src:'Chapter 5 · Distinguish research questions from interview questions',pts:6,run(L){
  L.h(L.kick('pr','Sort the questions')+'<h1 class="q">The trio drafts questions. Which is which?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Research question','Interview question','Don’t ask this'],[
   ['What stops customers from cooking on weeknights?',0,'A good thing to <i>learn</i>, but ask it directly and you get guesses.'],
   ['Tell me about the last time you cooked on a weeknight.',1,'A story question about one real time.'],
   ['How often do you throw food away?',2,'People are bad at estimating how often they do things. Ask for the last time instead.'],
   ['Do customers care more about price or time?',0,'Something the team wants to learn, found through stories, not asked out loud.'],
   ['Tell me about the last time something in your box went bad.',1,'A specific story that will show what really happened.'],
   ['Would you use a meal-planning calendar?',2,'This asks the customer to predict and design, which brings out the ideal self.']],
   'Research questions guide you. Interview questions ask for stories. Direct and “would you” questions get unreliable answers.');}},
{part:1,src:'Chapter 5 · Excavate the story',run(L){
  L.h(L.kick('learn','Excavate the story')+'<h1 class="q">A first answer is one sentence. Your job is to dig out the whole story.</h1>'+
   L.prose('In normal conversation, people talk about half the time each: ask a short question, get a short answer. So reset that. Tell the customer you want the <b>full story, every detail</b>, and that you’ll ask about gaps at the end.')+
   L.list([['clock','Walk the timeline','“What happened first?” “What happened next?” “What happened before that?”'],
     ['map','Set the scene','“Where were you?” Use your experience map to notice steps they skipped.'],
     ['people','Ask about others and obstacles','“Who was with you?” “What got in the way?” “How did you get past it?” “Did anyone help?”'],
     ['arrow','Pull back to this time','When they say “I usually…”, ask: “In this specific time, did that happen?”']],2));
  L.done();}},
{part:1,src:'Chapter 5 · Excavate the story',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">Priya interviews Maya, the nurse with two kids</h1>');
  L.beats(L.card,[
   ['Ask','Priya: “Tell me about the last time you cooked a Fernway meal.” Maya: “Thursday. I made the chicken.”'],
   ['Reset','Priya says they’d love the whole story, every detail, and will ask about anything missing at the end.'],
   ['Set the scene','“Where were you when it started?” Maya was driving home from a 12-hour shift, wondering what was in the fridge.'],
   ['Keep going','“What happened next?” The recipe said 40 minutes. The kids were hungry. Maya almost ordered pizza.'],
   ['A generalization','Maya: “I usually give up on shift days.” Priya: “On this Thursday, did you?”'],
   ['The detail','“No. My sister was over and started chopping.” Someone helped, and a general answer would have hidden that.']],
   'A one-line answer became a real moment, a real obstacle and a helper, all from one specific Thursday.');}},
{part:1,src:'Chapter 5 · Excavate the story',pts:6,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Good follow-up?',['Keeps the story going','Pulls away from it'],[
   ['“What happened next?”',0,'A timeline prompt. It moves the story forward.'],
   ['“Do you usually cook on weekends?”',1,'It asks for a habit in general, not this one time.'],
   ['“Who was with you?”',0,'Stories have other people in them. They often help or get in the way.'],
   ['“Would a 15-minute recipe option help?”',1,'It asks the customer to judge a solution. You’re there to find needs.'],
   ['“In this specific time, did that happen?”',0,'It gently pulls a generalization back to the real story.'],
   ['“Why do people like you skip meals?”',1,'It invites a neat theory, not what actually happened.']]);}},
{part:1,src:'Chapter 5 · You won’t always get what you want',pts:1,run(L){
  L.h(L.kick('learn','Let the customer lead')+'<h1 class="q">You won’t always get the story you wanted, and that’s fine</h1>'+
   L.prose('The golden rule: let the customer talk about what they care about most. You still steer in two ways: by <b>which story you ask for</b> (“the last time you cooked” or “the last time you cooked after a shift”), and by <b>which parts you dig into</b>.')+
   L.prose('Some people won’t play along. They give one-line answers, pitch feature ideas or complain about the product. Take what they offer and don’t force it.')+
   '<div id="lq"><h2 class="sub">Joe spends the call complaining about the price and never tells a cooking story. What should Dev do?</h2></div>');
  L.mc(L.$('#lq'),['Keep repeating the cooking question until Joe answers','Note what Joe shares; another interview comes next week','End the call early and leave Joe out of the notes'],1,
   'Respect what Joe cares about and capture it. When you interview every week, one dud doesn’t matter.',
   'Forcing it ignores what Joe cares about, and leaving Joe out wastes what Joe did share. Capture it and move on: another interview is coming next week.');}},

/* ---------- PART 3: SNAPSHOTS ---------- */
{part:2,src:'Chapter 5 · Synthesize as you go',run(L){
  const chip=(t,ok)=>'<span class="chip static'+(ok?' ok':'')+'" style="font-size:13.5px">'+t+'</span>';
  L.h(L.kick('learn','The interview snapshot')+'<h1 class="q">After each interview, fill in one page</h1>'+
   L.prose('After a handful of interviews, they blur together. An '+L.g('snapshot','interview snapshot')+' captures one interview on one page, right after it happens. Here’s Priya’s for Maya:')+
   '<div style="border:2px solid var(--line);border-radius:16px;padding:14px;background:var(--card);margin:6px 0 10px">'+
    '<div style="display:flex;gap:12px;align-items:center;margin-bottom:10px"><div style="flex:none;width:48px;height:48px;border-radius:50%;background:var(--h2-bg);color:var(--h2);display:flex;align-items:center;justify-content:center">'+L.ic('person')+'</div>'+
    '<div><b>Maya</b><div class="small" style="font-style:italic">“Shift days eat my dinner plans.”</div></div></div>'+
    '<div class="small"><b>Quick facts</b> · nurse, two kids, works shifts · 4 meals a week · customer for a year</div>'+
    '<div class="small" style="margin:10px 0 4px"><b>Opportunities</b></div>'+chip('Recipes take too long on weeknights',true)+chip('I pick meals without knowing what my week looks like',true)+
    '<div class="small" style="margin:6px 0 4px"><b>Insights</b></div><div class="small">Maya’s sister often helps on shift days.</div>'+
    '<div class="small" style="margin:10px 0 4px"><b>Maya’s story</b></div>'+chip('Drives home')+'→ '+chip('Opens fridge')+'→ '+chip('40-min recipe')+'→ '+chip('Sister chops')+'→ '+chip('Cooks')+
   '</div>'+
   '<p class="small">The photo (taken with permission or, if data must be anonymous, any image that reminds you of the story) and the quote unlock your memory. Quick facts show how this customer compares with others.</p>');
  L.done();}},
{part:2,src:'Chapter 5 · Synthesize as you go',run(L){
  L.h(L.kick('learn','Needs, not features')+'<h1 class="q">When a customer asks for a feature, dig for the need behind it</h1>'+
   L.prose('Ask: <b>“If you had that, what would that do for you?”</b> In the book, a viewer wishes they could just <i>say</i> a movie’s name. The need underneath: not wanting to type a long title. That could be met by voice search, or by filling in titles as they type.')+
   L.flow([['chat','Request','“Add a swap-for-something-faster button”','Sam'],['bulb','Ask','“What would that do for you?”'],['target','Need','“Recipes take too long on weeknights”','opens up more ideas']])+
   L.prose('Write opportunities in the <b>customer’s words</b>. Also note <b>insights</b>: interesting things that aren’t a need yet. Capture everything, even if it seems unique to one person. It often turns into a pattern.'));
  L.done();}},
{part:2,src:'Chapter 5 · Synthesize as you go',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Joe says, “You should add a filter for cheaper meals.” What should Marco do next?</h1>');
  L.mc(L.card,['Ask what a cheaper-meals filter would do for Joe','Write “cheaper-meals filter” down as an opportunity','Tell Joe that a filter is already on the roadmap'],0,
   'The answer reveals the need, and a need opens up more than one possible solution.',
   'A filter is a solution, not an opportunity, and talking about the roadmap ends the discovery. Ask what it would do for Joe to find the need.');}},
{part:2,src:'Chapter 5 · Synthesize as you go',pts:5,run(L){
  L.h(L.kick('pr','Fill in the snapshot')+'<h1 class="q">Things Dev heard from Ana and Joe. Where does each go?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Quick facts','Opportunity','Insight','Dig for the need'],[
   ['A couple on a tight budget, 3 meals a week, customers for 5 months',0,'Who they are, so you can compare them with other customers.'],
   ['“We feel guilty throwing food, and money, away.”',1,'A pain point, in their words.'],
   ['They split each dinner into two lunches for the next day',2,'An interesting behavior, but not clearly a need yet. Capture it anyway.'],
   ['“Can you add a button to skip a week?”',3,'That’s a feature. Ask what skipping would do for them.'],
   ['“Ingredients go bad before we get to them.”',1,'A need, in the customer’s own words.']],
   'Facts give context, opportunities are needs in their words, insights wait for a pattern, and feature requests need one more question.');}},
{part:2,src:'Chapter 5 · Draw the stories you collect',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Tap each piece until the sentence describes the snapshot habit.</h1>');
  L.sentence(L.card,[['After a batch of 12 interviews','Right after each interview'],['fill in a one-page snapshot','send round the full recording'],['listing the features they asked for','framing needs in their own words'],['and a drawing of their story.','and a summary of our product.']],[1,0,1,0],
   [['Waiting for a batch means stopping to synthesize. With weekly interviews there’s no natural stop, so synthesize as you go.'],
    ['Colleagues don’t have time to watch your recordings. A one-pager is quick to share and to remember.'],
    ['Features close off options. Ask what the feature would do for them and capture that need.'],
    ['Draw their story, not your product. Its nodes and links help you remember it and spot patterns later.']],
   'That’s the snapshot habit. The drawing matters too: next lesson uses these story maps to find patterns across customers.');}},

/* ---------- PART 4: EVERY WEEK ---------- */
{part:3,src:'Chapter 5 · Interview every week',run(L){
  L.h(L.kick('learn','Interview every week')+'<h1 class="q">Don’t stop interviewing once you’ve picked a problem</h1>'+
   L.prose('Customer needs change, competitors move and your product evolves. The opportunity space is never finished.')+
   L.prose('It’s tempting to stop once you’ve picked an opportunity to work on. But if it turns out to be the wrong one, you have to restart interviewing from scratch.')+
   L.note('Raya Raycheva, a researcher at the London insurer Simply Business, describes dropping an opportunity on a Tuesday, choosing a new one on Wednesday, and learning about it in interviews already booked for Thursday.','book')+
   L.prose('A habit is easier to keep than to restart. So talk to <b>at least one customer every week</b>.'));
  L.done();}},
{part:3,src:'Chapter 5 · Interview every week',pts:1,
 solve:async L=>{L.$('#pv').click();},
 run(L){
  L.h(L.kick('try','See it happen')+'<h1 class="q">On Tuesday, two Fernway teams learn their chosen opportunity doesn’t matter much to customers. Press the button.</h1>'+
   L.lanes([['cycle','Team Weekly','Interviews one customer every week.<div class="res" id="wa"></div>',2],
            ['cal','Team Occasional','Interviews only when it needs answers.<div class="res" id="wb"></div>',4]])+
   '<button class="btn pri" id="pv" style="margin-top:14px">'+L.ic('play')+'Drop the opportunity</button><div id="pq"></div>');
  L.$('#pv').onclick=function(){this.remove();
    L.$('#wa').innerHTML='<span style="color:var(--ok)"><b>Wed:</b> picks a new opportunity. <b>Thu:</b> learns about it in an interview that was already booked.</span>';
    L.$('#wb').innerHTML='<span style="color:var(--no)"><b>Wed:</b> picks a new opportunity. <b>Thu:</b> starts finding people to talk to, from scratch.</span>';
    const q=L.$('#pq');q.innerHTML='<h2 class="sub">What gave Team Weekly its head start?</h2>';
    L.mc(q,['They chose a better new opportunity','They talked to more people at once','Their interviews were already booked'],2,
     'Because interviewing never stopped, the next conversation was already on the calendar.',
     'Both teams picked a new opportunity on the same day. The difference is that Team Weekly’s interviews were already booked, so learning never paused.');};}},
{part:3,src:'Chapter 5 · Automate the recruiting process',run(L){
  L.h(L.kick('learn','Automate recruiting')+'<h1 class="q">The goal: wake up Monday with an interview already booked</h1>'+
   L.prose('Finding people is the hardest part. And bad weeks happen: a release goes wrong, someone is sick. Automation keeps the habit alive anyway.')+
   L.list([['pointer','Ask inside the product','A one-line offer, like 20 minutes for $20. Busy product: ask for a phone number. Quieter one: link to a booking tool. No product yet: ads to a landing page.'],
     ['people','Ask customer-facing colleagues','Start by joining the last five minutes of their calls. Then give them triggers, like “someone calls to cancel,” and a short script.'],
     ['star','Set up a customer advisory board','For hard-to-reach or small markets. Members do a monthly one-on-one. Mix in another method so you don’t design for a small group.']],1));
  L.done();}},
{part:3,src:'Chapter 5 · Automate the recruiting process',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Pick the recruiting method',['In-product ask or landing page','Customer-facing colleagues','Customer advisory board'],[
   ['Thousands of customers open Fernway’s app every day to pick meals.',0,'High traffic: turn the ask on for a few minutes and collect phone numbers.'],
   ['Support talks to several customers a day who call to cancel. The trio wants their stories.',1,'Set a trigger (“customer calls to cancel”) and give support a script to book a talk.'],
   ['Fernway pilots kits for hospital kitchens. There are only a dozen head chefs, all very busy.',2,'A small, hard-to-reach market. Invite them to a board with a monthly one-on-one.'],
   ['Fernway plans a baby-food box. It has no customers yet.',0,'No product to ask in, so use ads to send people to a landing page that books interviews.']]);}},
{part:3,src:'Chapter 5 · Interview together, act together',run(L){
  L.h(L.kick('ex','Interview as a trio')+'<h1 class="q">Three people hear three different things in one story</h1>'+
   L.prose('Don’t make one person the “voice of the customer.” They can end every debate with “this is what customers want,” and nobody can answer back. Interviews can be as short as five minutes, so everyone can join.')+
   L.note('Maya: “Sunday night I picked five meals on my phone while helping with homework. The box sat on the porch until my shift ended. By Thursday the fish smelled off, and every suggested recipe took 45 minutes.”','chat')+
   '<h2 class="sub">Tap each person to see what they picked up.</h2>');
  L.flips(L.card,[
   ['Priya (product)','“Every suggested recipe took 45 minutes.” Maybe the menu doesn’t fit shift workers.'],
