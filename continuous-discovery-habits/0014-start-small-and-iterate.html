<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Start Small, and Iterate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0014', title:'Start small, and iterate', minutes:19, icon:'leaf',
  goals:['Start discovery habits in a company that doesn’t work this way','Work backward from a feature request to a first tree','Use retrospectives to make next week better than last'],
  parts:['Your agency','Trio and customers','Work backward','Keep improving'],
  read:'Read chapters 14 and 15 of the book for the author’s own early-career story and where to go next.',
  glossary:{
    'agency':'Agency: your power to choose how you do your own work, whatever the rest of the company does.',
    'keystone':'Keystone habit: one habit that, once you have it, makes other good habits easier to adopt.',
    'feature-team':'Feature team: a team that is told which features to build, instead of being given an outcome.',
    'impact-review':'Impact review: a look back after a release, comparing the impact a feature was expected to have with the impact it actually had.',
    'retro':'Retrospective: a regular meeting where a team looks back at how it worked and decides what to improve.'
  },
  cheatsheet:[
    'You have more <b>agency</b> than you think. Don’t wait for permission or try to change the company. Change how <i>you</i> work, starting small.',
    '<b>Build your trio</b>: include product, design and engineering in as many decisions as you can. Start with a small ask.',
    '<b>Weekly customer interviews</b> are the keystone habit. If you start with one habit, start there, even with one person who is like your customers.',
    'Told what to build? <b>Work backward</b>: what would it do for customers (opportunity) and for the business (outcome)?',
    'Agree the expected impact, measure it, and hold <b>impact reviews</b>. When a feature falls short, gently suggest how discovery could have caught it.',
    'In retros ask: <b>what surprised us?</b> Then, for each surprise: <b>how could we have learned it sooner?</b>',
    'Traps: “that will never work here,” being the annoying champion of the one right way, and waiting for permission.',
    'If next week looks better than last week, you’re on the right track.'
  ],
  steps:[
/* ---------- PART 1: YOUR AGENCY ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Your company decides features in a spreadsheet of requests from the top. You’d like to work the way this course teaches. What’s the better first move?</h1>');
  L.mc(L.card,['Change one small thing in your own work this week','Wait until leadership approves a new process'],0,
   'You control how you do your own work. Start there, small, and build from it. That’s this whole lesson.',
   'Waiting can take forever. You already control how you do your own work, so you can start small this week.');}},
{part:0,src:'Chapter 14 · opening story',run(L){
  L.h(L.kick('ex','The author’s own story')+'<h1 class="q">A first design, a harsh client, and a guiding principle</h1>');
  L.beats(L.card,[
   ['1999','At 22, Teresa Torres took her first job, designing online communities for academic researchers. Her first task: navigation for a client’s long list of feature requests.'],
   ['The meeting','After three days of work, she presented. Someone at the client called it horrible and described what they had asked for weeks before she joined.'],
   ['The realization','She had no idea who the client was, what they wanted, or who the end-users were. She had been throwing designs over the wall.'],
   ['The bounce back','Right on that call, she invited the unhappy client to work with her on the next version. After that she joined client meetings early, went to their conferences, read the product’s forums and built feedback into the product.'],
   ['The principle','Her company didn’t work that way, and later employers rarely did either. She kept one guiding rule: to do good work, get close to the customer.']],
   'She never had leadership support for discovery. She changed how she did her own work, and that was enough to get results.');}},
{part:0,src:'Chapter 14 · opening story',run(L){
  L.h(L.kick('learn','You have more agency than you think')+'<h1 class="q">Start small. Iterate from there.</h1>'+
   L.prose('“This sounds great, but my company doesn’t work this way.” The book expects that reaction. Its answer is '+L.g('agency','agency')+': you can shape how <i>you</i> do your own work.')+
   L.lanes([['x','Not your job','Changing how the whole company works. Worrying about what other people do.',1],
            ['check','Your job','Doing your own work your way, starting with one small step, and building on it.',2]])+
   L.note('The measure of progress is simple: <b>make next week look better than last week.</b> Then repeat.','cycle'));
  L.done();}},
{part:0,src:'Chapter 14 · opening story',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">What did the author rely on to do discovery at companies that didn’t support it?</h1>');
  L.mc(L.card,['A boss who backed modern product work','Changing how she did her own work','Convincing the company to adopt a process'],1,
   'She rarely had senior support and didn’t try to change the companies. She changed her own work, step by step.',
   'The book says she rarely had leadership support and didn’t try to change how the companies worked. She focused on her own work.');}},

/* ---------- PART 2: TRIO AND CUSTOMERS ---------- */
{part:1,src:'Chapter 14 · Build Your Trio',run(L){
  L.h(L.kick('learn','Build your trio')+'<h1 class="q">Don’t work alone, even if the org chart says you do</h1>'+
   L.prose('These habits are built for a '+L.g('trio','product trio')+'. Even if your company doesn’t staff teams that way, you can build the relationships yourself.')+
   L.list([['people','Find partners','A product manager can find a designer and an engineer, consult them on key decisions, and decide together what to build.'],
     ['pointer','Ask small','Don’t ask for help with every decision. Ask for input on one small decision. If they’re not interested, find someone who is.'],
     ['eye','No designers?','Look for someone design-minded: good at making complex things simple, close to customers, and full of empathy for them.'],
     ['cycle','Expect change','If teammates change from project to project, the trio can change with them. That’s fine.']],2)+
   '<p class="small" style="margin-top:10px">The guiding question: how can all three disciplines take part in as many discovery decisions as possible?</p>');
  L.done();}},
{part:1,src:'Chapter 14 · Build Your Trio',pts:1,run(L){
  L.h(L.kick('pr','Apply it')+'<h1 class="q">Fernway’s hospital-kitchen pilot runs as a '+L.g('feature-team','feature team')+'. Its product manager, Tomás, has no designer. Who should Tomás ask first?</h1>');
  L.mc(L.card,['The most senior engineer, to own all the design work','Nobody yet, until a designer gets hired next year','A support agent who explains things simply to cooks'],2,
   'Design-minded people simplify complex ideas, know customers firsthand and care about their problems. Ask for help on one small decision first.',
   'Waiting a year means no progress, and handing someone all of design is a big ask. Look for a design-minded person and start with one small decision.');}},
{part:1,src:'Chapter 14 · Start Talking to Customers',run(L){
  L.h(L.kick('learn','The keystone habit')+'<h1 class="q">If you start with just one habit, start with interviews</h1>'+
   L.quote('Keystone habits start a process that, over time, transforms everything.','Charles Duhigg, quoted in chapter 14')+
   L.prose('A '+L.g('keystone','keystone habit')+' makes other habits easier. For many people, regular exercise makes it easier to eat well and have energy. It doesn’t <i>force</i> the rest; it helps them along.')+
   L.prose('The author sees the same with <b>weekly customer interviews</b>. Teams that talk to customers every week also start prototyping and testing more, doubt what they think they know, and link what they learn to what they decide.'));
  L.done();}},
{part:1,src:'Chapter 14 · Start Talking to Customers',pts:1,
 solve:async L=>{L.$('#kp').children[0].click();L.$('#go4').click();},
 run(L){
  const H=['Weekly customer interviews','Mapping opportunities','Testing assumptions'],R=[['Weekly customer interviews',1],['Doubting what we “know”',3],['Testing assumptions',5],['Linking learning to decisions',7]];let p=null;
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">Tomás’s pilot team can start only one habit. Which one will make the others easier?</h1><div id="kp"></div>'+
   '<div id="ks" hidden><div style="display:flex;align-items:center;justify-content:space-between;margin-top:6px"><div><div class="small">Simulated time</div><div class="week" id="kw">Week 0</div></div><button class="btn pri" id="go4">'+L.ic('play')+'Run 8 weeks</button></div><div id="kh" style="margin-top:8px"></div></div>');
  H.forEach((h,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=h;b.onclick=()=>{if(p!==null)return;p=j;b.classList.add('sel');L.$('#ks').hidden=false;
    L.$('#kh').innerHTML=R.map((r,x)=>'<span class="chip static" id="kr'+x+'" style="opacity:.35">'+L.ic('lock')+r[0]+'</span>').join('');};L.$('#kp').appendChild(b);});
  L.$('#go4').onclick=function(){this.remove();let w=0;
    const t=setInterval(()=>{w++;const kw=L.$('#kw');if(!kw){clearInterval(t);return;}kw.textContent='Week '+w;
      R.forEach((r,x)=>{const el=L.$('#kr'+x);if(el&&w>=r[1]&&el.style.opacity!=='1'){el.style.opacity='1';el.classList.add('ok');el.innerHTML=L.ic('check')+r[0];}});
      if(w>=8){clearInterval(t);L.award(p===0);
        L.sheet(p===0?'ok':'no',p===0?'You called it':'Interviews come first','In the author’s experience, weekly interviews are the keystone habit. Talking to customers every week pulls the other habits along: more doubt, more testing, better decisions.');L.done();}},300);};}},
{part:1,src:'Chapter 14 · Start Talking to Customers',pts:1,run(L){
  L.h(L.kick('pr','Put it in order')+'<h1 class="q">Tomás’s team has never spoken to a hospital cook. Sales guards those contacts. Put the path to weekly interviews in order, from first step to last.</h1>');
  L.order(L.card,['Talk to a friend who cooks for a school','Find one real hospital cook to talk to','Ask each cook to introduce another','Talk to a hospital cook every week'],
   'If you can’t reach customers, start with someone like them. Then find one real customer, use each talk to get the next introduction, and build up to weekly.');}},

/* ---------- PART 3: WORK BACKWARD ---------- */
{part:2,src:'Chapter 14 · Work Backward',run(L){
  L.h(L.kick('learn','Work backward')+'<h1 class="q">Told what to build? Ask what it’s for.</h1>'+
   L.prose('Many teams aren’t allowed to do discovery. Stakeholders hand them features. You can still build the habits, by working <b>backward</b> from the solution with two questions:')+
   L.flow([['box','The feature','what you were asked to build'],['people','Implied opportunity','“If customers had this, what would it do for them?”'],['target','Implied outcome','“What value would it create for the business?” Refine to a metric.']])+
   L.prose('Even a rough guess at the customer need helps you build a better solution. And with those two answers, you’ve drawn your first small '+L.g('ost','opportunity solution tree')+'.'));
  L.done();}},
{part:2,src:'Chapter 14 · Work Backward',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">Tomás is told to build a “bulk reorder” button for hospital kitchens</h1>');
  L.beats(L.card,[
   ['Backward to the need','Tomás asks a cook what the button would do for them. The cook says they re-enter the same order every week. Implied opportunity: <i>“Reordering the same items takes too long.”</i>'],
   ['Backward to the outcome','What would it do for Fernway? Refined to a number: more kitchens place their weekly order on time, without calling sales.'],
   ['Map and doubt','The team story maps the button and lists assumptions, like “cooks order the same items every week.” They can’t test much yet, but now they notice evidence for and against.'],
   ['Agree the impact','Tomás asks the stakeholder what impact they expect, writes it down, and makes sure the release can measure it.'],
   ['The review','After launch, on-time orders rise less than expected. Tomás asks: “Is this the need we were trying to solve? Could we try other ideas for it, together?” A new mini-branch of the tree is born.']],
   'No permission needed: two questions, a story map, a written expectation and an honest look back.');}},
{part:2,src:'Chapter 14 · Work Backward',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Which question uncovers the implied outcome behind a feature request?</h1>');
  L.mc(L.card,['“What would this feature do for our customers?”','“What would this feature do for our business?”','“How soon can this feature be shipped to users?”'],1,
   'The business value, refined into a metric, is the outcome. The customer question uncovers the opportunity.',
   'The customer question reveals the opportunity, and timing is a delivery question. Ask what value it creates for the business, then refine it to a metric.');}},
{part:2,src:'Chapter 14 · Work Backward',run(L){
  L.h(L.kick('learn','The best moment to speak up')+'<h1 class="q">When a feature falls short, propose, don’t preach</h1>'+
   L.prose('Hold '+L.g('impact-review','impact reviews')+' after releases: remind stakeholders what impact they expected, and show what actually happened. The book says it will fall short, inevitably.')+
   L.prose('That moment is the <b>best time to advocate for discovery</b>. Gently suggest how the gap could have been found earlier, and share what you’re learning in interviews.')+
   L.lanes([['check','Do','Be a collaborative problem solver. Read the room. If they push back, let up.',2],
            ['x','Don’t','Sound like a know-it-all or say “I told you so.”',1]])+
   '<p class="small" style="margin-top:10px">People are often surprisingly open to small changes when things haven’t gone as expected.</p>');
  L.done();}},
{part:2,src:'Chapter 14 · Work Backward',pts:1,run(L){
  L.h(L.kick('pr','What would you say?')+'<h1 class="q">The bulk-reorder button barely moved on-time orders. In the review, the stakeholder looks disappointed. What should Tomás say?</h1>');
  L.mc(L.card,['“If we’d tested this first, we’d have seen it coming.”','“Let’s move on to the next request on the list.”','“Was slow reordering the need? Let’s try ideas for it.”'],2,
   'It names the implied opportunity and invites the stakeholder to look for other solutions together. That’s a collaborative problem solver.',
   'The first sounds like “I told you so,” and the second throws away the lesson. Ask about the customer need and offer to explore other ideas together.');}},
{part:2,src:'Chapter 14 · Work Backward',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Working backward from “add allergy labels to every kit”',['Implied opportunity','Implied outcome','Hidden assumption'],[
   ['“I have to check every ingredient for my patients’ allergies.”',0,'That’s the customer need the labels would address.'],
   ['More kitchens order kits without calling to ask about ingredients.',1,'It’s a measurable change in behavior that the business values.'],
   ['Cooks will read the label before they start cooking.',2,'Something that must be true for the labels to work. Worth testing.'],
   ['“I worry about getting a patient’s meal wrong.”',0,'A customer pain point, in the customer’s words.'],
   ['The supplier can list every ingredient reliably.',2,'A feasibility assumption: if it’s false, the labels can’t be trusted.']]);}},

/* ---------- PART 4: KEEP IMPROVING ---------- */
{part:3,src:'Chapter 14 · Use Your Retrospectives to Reflect and Improve',run(L){
  L.h(L.kick('learn','Reflect as a trio')+'<h1 class="q">Two questions that improve your discovery</h1>'+
   L.prose('Meet regularly as a trio to look back on how discovery is going. If you already hold '+L.g('retro','retrospectives')+', add two questions:')+
   L.flow([['alert','1 · What surprised us?','A release that missed, a new interview insight, a feasibility hurdle. Make a list.'],['clock','2 · How could we have learned it sooner?','Ask this for each surprise on the list.']])+
   L.prose('The answers point at what to fix: a missed or untested assumption, a misread customer need, a story map that needs another look. And be kind to yourselves. Even great teams get surprised. That’s how you improve.'));
  L.done();}},
{part:3,src:'Chapter 14 · Use Your Retrospectives to Reflect and Improve',pts:4,run(L){
  L.h(L.kick('pr','Learn it sooner')+'<h1 class="q">Fernway’s trio lists this sprint’s surprises. For each one, where should they look to learn it sooner next time?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Our assumptions','Our customer research','Our story maps'],[
   ['The “cook first” label shipped, but meals cooked barely moved.',0,'Was there a faulty assumption they never found, or never chose to test?'],
   ['An interview showed Sam often cooks for friends, which nobody knew.',1,'Did they misread a need, or find a new part of the experience?'],
   ['Dev found the app can’t reorder recipes the way the design assumed.',2,'Misunderstood requirements often show up in the story map.'],
   ['Maya said the reminders came at the start of a shift, when Maya can’t cook.',1,'A need they misunderstood. More interviews about Maya’s week could have caught it.']],
   'Each surprise points to a habit to strengthen. That’s how next week gets better than last week.');}},
{part:3,src:'Chapter 14 · Avoid These Common Anti-Patterns',run(L){
  L.h(L.kick('learn','Three traps when starting out')+'<h1 class="q">Too negative, too strict, or too patient</h1>'+
   L.list([['“That will never work here”','Every company is unique, but the author has seen these habits work across many industries and sizes. Adapt them. Ask what you <i>can</i> do.'],
     ['The annoying champion','There is no one right way to do discovery. The habits are templates, not recipes. Don’t let perfect be the enemy of good.'],
     ['Waiting for permission','Not allowed to talk to customers? Talk to people you know who are like them. A bank’s team has friends with bank accounts. Start there.']],4));
  L.done();}},
{part:3,src:'Chapter 14 · Avoid These Common Anti-Patterns',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Spot the trap',['That will never work here','The annoying champion','Waiting for permission'],[
   ['Tomás: “Hospitals are different. These habits are for app companies.”',0,'Every org is unique, but the habits can be adapted. Ask what you can do.'],
   ['Marco tells another team their interview notes are “wrong” because they skipped a snapshot.',1,'There’s no one right way. Templates are a start, not a rulebook.'],
   ['A new Fernway team won’t speak to customers until legal writes a policy, though most of them buy meal kits.',2,'They can start with people like their customers, including themselves and their friends.'],
   ['Dev refuses to test anything until the team has a perfect assumption map.',1,'Don’t let perfect be the enemy of good. Better than last week is enough.']]);}},
{part:3,src:'Chapter 15 · What’s Next?',run(L){
  L.h(L.kick('learn','What’s next')+'<h1 class="q">The end of the book, not the end of the habits</h1>'+
   L.prose('The final chapter points readers to ways to keep practicing with others: the author’s newsletter, a member community, live classes, deep-dive courses and coaching.')+
   L.prose('Whatever you choose, the loop you’ve learned stays the same:')+
   L.tiers([['target','Set an outcome','A behavior the team can move, agreed together.',''],
            ['chat','Talk to customers weekly','The keystone habit. Map what you hear.',''],
            ['map','Choose one opportunity','Compare siblings and pick a target.',''],
            ['flask','Ideas, assumptions, tests','Three ideas, quick tests, measured impact.',''],
            ['eye','Show your work, then repeat','Bring stakeholders along. Make next week better than last.','',true]]));
  L.done();}},
{part:3,src:'Chapter 14 · Avoid These Common Anti-Patterns',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Tomás writes a plan for next week. Tap each piece until it follows the book.</h1>');
  L.sentence(L.card,[['Without waiting for approval,','Once leadership agrees,'],['I’ll talk to one person like our customers,','I’ll launch a full research program,'],['ask a support agent to weigh in on one decision,','ask for a full-time designer,'],['and aim for a better week than last.','and aim for the perfect process.']],[0,0,0,0],
   [['Waiting for permission is a trap. Start with what you control.'],['Start small. One conversation is a real step.'],['Start with a small ask of someone design-minded.'],['Perfect is the enemy of good. Better than last week is the goal.']],
   'Small, within Tomás’s control, and repeatable. That’s how the habits start, and how they grow.');}},
{part:3,src:'Chapter 14 · Start Talking to Customers',pts:1,run(L){
  L.h(L.kick('pr','Final check')+'<h1 class="q">A friend at another company asks you: “If we change one thing first, what should it be?” Based on the book, what do you say?</h1>');
  L.mc(L.card,['Draw an opportunity solution tree for the whole product','Start talking to a customer every week, even one','Get leadership to replace the roadmap with outcomes'],1,
   'Weekly interviews are the keystone habit, and the book’s answer for where to start, whatever your situation.',
   'Those are worthwhile, but the book names one place to start: talking to customers every week. It makes the other habits easier.');}}
  ]
});
</script>
</body>
</html>
