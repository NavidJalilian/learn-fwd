const KS_A='0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';
const ksK=v=>v<10?'d':v<36?'l':'u';
const ksB62=n=>{n=BigInt(n);let s='';do{s=KS_A[Number(n%62n)]+s;n/=62n;}while(n>0n);return s;};
const ksN=n=>BigInt(n).toLocaleString('en-US');
const ksBig=x=>{if(x<1e6)return Math.round(x).toLocaleString('en-US');for(const [v,w] of [[1e12,'trillion'],[1e9,'billion'],[1e6,'million']])if(x>=v){const q=x/v;return (q>=100?Math.round(q):q.toFixed(1).replace(/\.0$/,''))+' '+w;}};
const ksCh=(v,cls)=>'<span class="ks-ch '+ksK(v)+(cls?' '+cls:'')+'">'+KS_A[v]+'</span>';
const ksWhy=v=>v<10?'Digits 0–9 stay as they are, so '+v+' is <b>'+v+'</b>.':v<36?'a stands for 10, so '+v+' is <b>'+KS_A[v]+'</b>.':'A stands for 36, so '+v+' is <b>'+KS_A[v]+'</b>.';
const KS_KEY='<div class="ks-key"><b class="d">0–9</b> = 0 to 9 · <b class="l">a–z</b> = 10 to 35 · <b class="u">A–Z</b> = 36 to 61</div>';
const ksStrip=()=>'<div class="ks-strip" aria-hidden="true">'+[...KS_A].map((c,v)=>'<span class="ks-ch '+ksK(v)+'" data-v="'+v+'">'+c+'</span>').join('')+'</div>'+KS_KEY;
const KS_MAXID=62n**8n-1n;

/* the length ladder: one row per code length n = 1…8; bar = log scale, dashed line = links needed */
function ksLad(need,cur,o){o=o||{};const M=Math.log(Math.pow(62,8));let h='';
  for(let n=1;n<=8;n++){const c=Math.pow(62,n),fit=!o.blind&&c>=need,tg=o.tap?'button':'div';
    h+='<'+tg+' class="r'+(fit?' fit':'')+(n===cur?' cur':'')+(o.pick===n?' pick':'')+'" data-n="'+n+'"'+(o.tap?' aria-label="'+n+' characters: '+ksBig(c)+' codes"':'')+'><span><b>'+n+'</b> char'+(n>1?'s':'')+'</span><span class="t"><i style="width:'+(n/8*100).toFixed(1)+'%"></i>'+(o.blind?'':'<b style="left:'+(Math.log(need)/M*100).toFixed(1)+'%"></b>')+'</span><span class="v">'+ksBig(c)+'</span></'+tg+'>';}
  return '<div class="ks-lad">'+(o.blind?'':'<div class="lg">Each extra character multiplies the codes by 62. Dashed line: links needed, <b>'+ksBig(need)+'</b>. Green: enough room.</div>')+h+'</div>';}

/* the base-62 encoder: divide by 62, remainders become characters, the code builds right to left */
function ksEnc(host,o){o=o||{};
  host.insertAdjacentHTML('beforeend','<div class="ks-enc">'+
   '<label class="ks-idl">Link ID <input type="text" inputmode="numeric" autocomplete="off" aria-label="Link ID to encode"></label>'+
   (o.presets?'<div class="ks-row ks-pre">'+o.presets.map((p,j)=>'<button class="chip" data-p="'+j+'">'+p[0]+'</button>').join('')+'</div>':'')+
   '<div class="ks-row"><button class="btn" data-a="step">÷ 62 once</button><button class="btn pri" data-a="all">'+(o.ic||'')+'Divide to the end</button></div>'+
   '<div class="ks-code" aria-live="polite"><span class="dom"></span><span class="cd" style="display:flex;gap:3px"></span><span class="len"></span></div>'+
   '<p class="small ks-msg" aria-live="polite" style="margin:0 0 6px;min-height:1.2em"></p>'+(o.need?'<div class="ks-ladw"></div>':'')+
   '<div class="ks-divs"></div>'+(o.strip?ksStrip():'')+'</div>');
  const el=host.lastElementChild,q=s=>el.querySelector(s),inp=q('input');
  const S={id:0n,cur:0n,code:'',fin:false,ok:true,dom:'kbird.link/',busy:false};
  function drawCode(fresh){q('.dom').textContent=S.dom;
    q('.cd').innerHTML=S.code?[...S.code].map((c,j)=>ksCh(KS_A.indexOf(c),fresh&&j===0?'new':'')).join(''):'<span class="ks-ch q">?</span>';
    q('.len').textContent=S.fin?S.code.length+' char'+(S.code.length>1?'s':''):'';
    if(o.need)q('.ks-ladw').innerHTML=ksLad(o.need(),S.fin?S.code.length:0);}
  function reset(v,dom){S.dom=dom||'kbird.link/';S.busy=false;
    const t=String(v).replace(/[,\s]/g,'');inp.value=/^\d+$/.test(t)?BigInt(t).toLocaleString('en-US'):String(v);
    S.ok=/^\d+$/.test(t)&&BigInt(t)<=KS_MAXID;S.id=S.ok?BigInt(t):0n;S.cur=S.id;S.code='';S.fin=false;
    q('.ks-divs').innerHTML='';q('.ks-msg').innerHTML=S.ok?'':'Type a whole number up to 218 trillion (8 characters at most).';
    el.querySelectorAll('.ks-strip span.on').forEach(x=>x.classList.remove('on'));
    el.querySelectorAll('[data-a]').forEach(b=>b.disabled=!S.ok);drawCode(false);}
  function step(quiet){if(S.fin||!S.ok)return;const r=Number(S.cur%62n),nx=S.cur/62n;
    q('.ks-divs').insertAdjacentHTML('beforeend','<div class="ks-dv"><span class="eq">'+ksN(S.cur)+' ÷ 62 = '+ksN(nx)+' r <b>'+r+'</b></span><span class="ar">→</span>'+ksCh(r)+'</div>');
    S.code=KS_A[r]+S.code;S.cur=nx;
    el.querySelectorAll('.ks-strip span').forEach(x=>x.classList.toggle('on',+x.dataset.v===r));
    if(!quiet)q('.ks-msg').innerHTML='Remainder '+r+'. '+ksWhy(r)+' It goes on the <b>left</b> of the code.';
    if(nx===0n){S.fin=true;el.querySelectorAll('[data-a]').forEach(b=>b.disabled=true);
      q('.ks-divs').insertAdjacentHTML('beforeend','<div class="ks-dv fin">Reached 0, so stop. Read the characters from the bottom up: <b style="color:var(--ink)">'+S.code+'</b></div>');}
    drawCode(true);if(S.fin&&o.onDone)o.onDone(S);}
  function all(){if(S.busy||S.fin||!S.ok)return;S.busy=true;
    const t=()=>{if(!el.isConnected||!S.busy)return;step();if(!S.fin)setTimeout(t,220);else S.busy=false;};t();}
  inp.addEventListener('input',()=>{const t=inp.value.replace(/[,\s]/g,'');reset(t);inp.value=t;if(o.onType)o.onType();});
  inp.addEventListener('blur',()=>{if(S.ok&&!S.code)inp.value=ksN(S.id);});
  q('[data-a="step"]').onclick=()=>{S.busy=false;step();};
  q('[data-a="all"]').onclick=all;
  if(o.presets)el.querySelectorAll('.ks-pre .chip').forEach(b=>b.onclick=()=>{const p=o.presets[+b.dataset.p];
    el.querySelectorAll('.ks-pre .chip').forEach(x=>x.classList.toggle('sel',x===b));
    reset(p[1],p[3]);while(!S.fin)step(true);q('.ks-msg').innerHTML=p[2];if(o.onPreset)o.onPreset(+b.dataset.p,S);});
  reset(o.start!=null?o.start:11157,o.dom);
  return {S,el,reset,step,all,redraw:()=>drawCode(false)};}

/* the click log: the same short link under 301 and under 302, with Rafi's browser caches */
function ksClkSvg(t){
  return '<svg class="ks-svg" viewBox="0 0 150 198" role="img" aria-label="'+t+' redirect: browser, kbird.link server, Mae’s project">'+
   '<rect class="bx b" x="3" y="3" width="144" height="56" rx="10"/><text x="11" y="20" font-size="12" font-weight="700" fill="var(--ink)">Rafi’s browsers</text>'+
   '<text class="cl" x="11" y="37" font-size="11.5" fill="var(--muted)">Laptop: empty</text><text class="cp" x="11" y="52" font-size="11.5" fill="var(--muted)">Phone: empty</text>'+
   '<path class="ln a" d="M40 59 V82"/><path class="tip a" d="M34 80 L46 80 L40 88 Z"/>'+
   '<rect class="bx s" x="3" y="89" width="104" height="44" rx="10"/><text x="11" y="106" font-size="12" font-weight="700" fill="var(--ink)">kbird.link</text><text class="hs" x="11" y="124" font-size="12" fill="var(--ink)">hits: 0</text>'+
   '<path class="ln a" d="M40 133 V146"/><path class="tip a" d="M34 145 L46 145 L40 153 Z"/>'+
   '<path class="ln b" d="M128 59 V146" stroke-dasharray="5 4"/><path class="tip b" d="M122 145 L134 145 L128 153 Z"/>'+
   '<text x="139" y="84" font-size="11" fill="var(--muted)" transform="rotate(90 139 84)">cache</text>'+
   '<rect class="bx d" x="3" y="154" width="144" height="41" rx="10"/><text x="11" y="171" font-size="12" font-weight="700" fill="var(--ink)">kitebird.com</text><text x="11" y="187" font-size="11.5" fill="var(--muted)">Mae’s cardigan project</text></svg>';}
function ksClk(host,o){o=o||{};
  host.insertAdjacentHTML('beforeend','<div class="ks-clk"><div class="ks-cols">'+['301','302'].map(t=>'<div class="ks-col" data-t="'+t+'"><div class="hd" style="color:var(--'+(t==='301'?'h2':'h3')+')">'+(t==='301'?'301 · permanent':'302 · temporary')+'</div>'+ksClkSvg(t)+
     '<div class="ro">Counted <b class="c">0</b> of <span class="m">0</span> clicks</div></div>').join('')+'</div>'+
   (o.controls?'<div class="ks-row" style="margin-top:12px"><button class="btn pri" data-a="click">'+o.ic+'Rafi clicks the link</button><button class="btn" data-a="clear">Clear cache</button></div>'+
     '<div class="ks-row"><span class="small">Clicking from</span><button class="chip sel" data-d="laptop">Laptop</button><button class="chip" data-d="phone">Phone</button></div>':'')+
   '</div>');
  const el=host.lastElementChild,S={n:0,dev:'laptop',c:{'301':{laptop:false,phone:false,h:0},'302':{laptop:false,phone:false,h:0}}};
  function draw(){['301','302'].forEach(t=>{const col=el.querySelector('.ks-col[data-t="'+t+'"]'),c=S.c[t];
    col.querySelector('.c').textContent=c.h;col.querySelector('.m').textContent=S.n;
    col.querySelector('.hs').textContent='hits: '+c.h;
    const cl=col.querySelector('.cl'),cp=col.querySelector('.cp');
    cl.textContent='Laptop: '+(c.laptop?'cached ✓':'empty');cl.setAttribute('fill',c.laptop?'var(--ok)':'var(--muted)');
    cp.textContent='Phone: '+(c.phone?'cached ✓':'empty');cp.setAttribute('fill',c.phone?'var(--ok)':'var(--muted)');});}
  function flash(col,cls){col.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));void col.offsetWidth;
    col.querySelectorAll(cls).forEach(x=>x.classList.add('on'));setTimeout(()=>{if(col.isConnected)col.querySelectorAll(cls).forEach(x=>x.classList.remove('on'));},320);}
  const api={S,el,
    click(){S.n++;['301','302'].forEach(t=>{const c=S.c[t],col=el.querySelector('.ks-col[data-t="'+t+'"]');
        if(t==='301'&&c[S.dev])flash(col,'.b,.bx.b,.bx.d');else{c.h++;if(t==='301')c[S.dev]=true;flash(col,'.a,.bx.b,.bx.s,.bx.d');}});
      draw();if(o.change)o.change('click');},
    dev(d){S.dev=d;el.querySelectorAll('[data-d]').forEach(b=>b.classList.toggle('sel',b.dataset.d===d));if(o.change)o.change('dev');},
    clear(){['301','302'].forEach(t=>{S.c[t].laptop=false;S.c[t].phone=false;});draw();if(o.change)o.change('clear');},
    reset(){S.n=0;S.c={'301':{laptop:false,phone:false,h:0},'302':{laptop:false,phone:false,h:0}};api.dev('laptop');draw();}};
  if(o.controls){el.querySelector('[data-a="click"]').onclick=api.click;el.querySelector('[data-a="clear"]').onclick=api.clear;
    el.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>api.dev(b.dataset.d));}
  draw();return api;}
/* play a list of actions on the click log, one every ms; returns a promise */
function ksPlay(api,acts,ms){return new Promise(res=>{let k=0;const t=()=>{if(!api.el.isConnected)return res();if(k>=acts.length)return res();const a=acts[k++];
  if(a==='L')api.dev('laptop');else if(a==='P')api.dev('phone');else if(a==='X')api.clear();else api.click();setTimeout(t,a==='c'?ms:20);};t();});}

/* CRC32 (the real one), for the hash board */
const KS_T=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function ksCrc(s){let c=0xFFFFFFFF;for(const b of new TextEncoder().encode(s))c=KS_T[(c^b)&255]^(c>>>8);return ((c^0xFFFFFFFF)>>>0).toString(16).padStart(8,'0');}
const KS_LINKS=[['Mae','kitebird.com/mae/cardigan'],['Rafi','kitebird.com/rafi/walnut-bowl'],['Yusuf','kitebird.com/yusuf/bowl-turning'],['Mira','kitebird.com/mira/star-quilt'],['Cleo','kitebird.com/cleo/spoon'],['Dev','kitebird.com/dev/ship-model']];

/* the redirect path: click → load balancer → web server → cache → database */
function ksRedSvg(){const B=(k,y,t,s)=>'<rect class="bx '+k+'" x="4" y="'+y+'" width="178" height="36" rx="10"/><text x="16" y="'+(y+15)+'" font-size="12.5" font-weight="700" fill="var(--ink)">'+t+'</text><text x="16" y="'+(y+29)+'" font-size="11" fill="var(--muted)">'+s+'</text>';
  const A=(k,y)=>'<path class="ln '+k+'" d="M93 '+y+' V'+(y+10)+'"/><path class="tip '+k+'" d="M87 '+(y+9)+' L99 '+(y+9)+' L93 '+(y+16)+' Z"/>';
  return '<svg class="ks-svg" viewBox="0 0 320 258" role="img" aria-label="Redirect path: click, load balancer, web server, cache, database">'+
   B('k0',2,'Click','a short link, e.g. kbird.link/…')+A('a0',38)+B('k1',56,'Load balancer','picks a web server')+A('a1',92)+
   B('k2',110,'Web server','asks the cache first')+A('a2',146)+B('k3',164,'Cache','popular pairs, in memory')+
   A('a3',200)+
   '<rect class="bx k4" x="4" y="218" width="178" height="36" rx="10"/><text x="16" y="233" font-size="12.5" font-weight="700" fill="var(--ink)">Database</text><text x="16" y="247" font-size="11" fill="var(--muted)">every stored pair</text>'+
   '<text class="o3" x="194" y="179" font-size="12" fill="var(--muted)"></text><text class="o3b" x="194" y="194" font-size="12" fill="var(--muted)"></text>'+
   '<text class="o4" x="194" y="233" font-size="12" fill="var(--muted)"></text><text class="o4b" x="194" y="248" font-size="12" fill="var(--muted)"></text></svg>';}

  const T=(k,x,y)=>'<path class="tip '+k+'" d="M'+(x-6)+' '+(y-8)+' L'+(x+6)+' '+(y-8)+' L'+x+' '+y+' Z"/>';
  return '<svg class="ks-svg" viewBox="0 0 320 292" role="img" aria-label="Shortening flow: is the long URL in the database? Yes: return the stored short URL. No: new ID, base 62, save.">'+
   '<rect class="bx n1" x="85" y="2" width="150" height="32" rx="10"/><text x="160" y="23" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink)">Long URL in</text>'+
   '<path class="ln e1" d="M160 34 V44"/>'+T('e1',160,50)+
   '<path class="bx n2" d="M160 50 L250 78 L160 106 L70 78 Z"/><text x="160" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">In the database?</text>'+
   '<path class="ln eN" d="M70 78 H40 V112"/>'+T('eN',40,120)+'<text x="48" y="70" font-size="12" font-weight="700" fill="var(--no)">No</text>'+
   '<path class="ln eY" d="M250 78 H280 V112"/>'+T('eY',280,120)+'<text x="252" y="70" font-size="12" font-weight="700" fill="var(--ok)">Yes</text>'+
   R('n3',4,120,'New ID from the','ID generator')+'<path class="ln e3" d="M77 160 V176"/>'+T('e3',77,184)+
   R('n4',4,184,'Base 62 →','short code')+'<path class="ln e4" d="M77 224 V240"/>'+T('e4',77,248)+
   R('n5',4,248,'Save a new row:','ID, short, long')+

Course.lesson({
  id:'0002', title:'Design a URL shortener', minutes:20, icon:'arrow',
  goals:['Scope a URL shortener and size it with quick sums','Turn a unique ID into a short code with base 62, and pick the code length from the numbers','Choose 301 or 302, and walk through the shortening and redirect flows'],
  parts:['Scope it','Redirects','Short codes','The flows'],
  read:'Read chapter 8 of the book for its figures and tables: the redirect diagrams, code length vs. capacity, and the hash-vs-base-62 comparison.',
  glossary:{
    redirect:'Redirect: a reply that tells the browser “what you want is at this other address”, so it goes there automatically.',
    hash:'Hash function: a recipe that turns any input, like a long URL, into a fixed-looking jumble of characters. The same input always gives the same output.',
    bloom:'Bloom filter: a compact, memory-saving way to check whether an item is already in a set. It answers by probability rather than with certainty, which is why it is so fast and small.',
    base62:'Base 62: writing numbers with 62 different digits (0–9, a–z, A–Z) instead of the usual 10, so big numbers get short.'
  },
  cheatsheet:[
    'Scope: <b>100 million new URLs a day</b>, as short as possible, 0–9 a–z A–Z, no edits or deletes.',
    'Estimates: ~<b>1,160 writes/s</b>, ~<b>11,600 reads/s</b> (10:1), <b>365 billion</b> records over 10 years.',
    'Two APIs: <b>POST</b> the long URL to shorten, <b>GET</b> the short URL to redirect.',
    '<b>301</b>: the browser caches it, so only the first click reaches you: less load. <b>302</b>: every click comes back: better analytics.',
    'A short code is a <b>unique ID written in base 62</b>: divide by 62, remainders become characters, read bottom up. 11157 → 2TX.',
    'Length: smallest n with 62ⁿ ≥ records. 62⁶ ≈ 56.8 billion is too few, 62⁷ ≈ 3.5 trillion fits: <b>7 characters</b>.',
    '<b>Hash + collision</b>: fixed length, but cut hashes clash; retry with an extra string, a bloom filter speeds the check. <b>Base 62</b>: no clashes, but needs an ID generator, grows, and counting IDs can be guessed.',
    'Shorten: already stored? Return it. Else new ID → base 62 → save. Redirect: cache, then database. Wrap-up: rate limiter, stateless web tier, DB replication and sharding, analytics.'
  ],
  steps:[
/* ---------- PART 1: SCOPE IT ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Dario wants a short link, like kbird.link/aMoY42, that leads back to Mae’s cardigan project on Kitebird. What must Kitebird store for that to work?</h1>');
  L.mc(L.card,['Each short code paired with its long URL','Only the short code, and nothing else','Only how many times each link was clicked'],0,
   'A short link is only useful if you can look up where it goes. That pair is the heart of the whole design.',
   'Without the long URL, a click on the short link has nowhere to go. The service must store each short code with its long URL.');}},

{part:0,src:'Chapter 8 · Step 1 - Understand the problem and establish design scope',
 solve:async L=>{L.$$('.ks-qa').forEach(b=>b.click());},
 run(L){
  const QA=[['Can you give an example?','A long URL full of parameters goes in. A short alias on tinyurl.com comes out. Clicking the alias takes you to the original.'],
    ['How much traffic?','<b>100 million</b> new URLs a day.'],
    ['How short must it be?','<b>As short as possible.</b>'],
    ['Which characters are allowed?','Digits <b>0–9</b> and letters <b>a–z</b> and <b>A–Z</b>.'],
    ['Can links be deleted or edited?','<b>No.</b> To keep it simple, short URLs never change.']];
  L.h(L.kick('learn','The book’s interview')+'<h1 class="q">Design a tinyurl-style service. Ask the interviewer your five questions.</h1>'+
   '<p class="small">Tap each question to hear the answer. Three of the answers will shape the short codes later.</p><div id="qa"></div><div id="qax"></div>');
  const seen=new Set();
  QA.forEach((x,j)=>{const b=document.createElement('button');b.className='ks-qa';b.innerHTML='“'+x[0]+'”';
    b.onclick=()=>{if(seen.has(j))return;seen.add(j);b.classList.add('open');b.innerHTML='“'+x[0]+'”<small>'+x[1]+'</small>';
      if(seen.size===QA.length){L.$('#qax').innerHTML=L.note('Three use cases follow: <b>shortening</b> (long in, short out), <b>redirecting</b> (short in, sent on to the long one), and high availability, scalability and fault tolerance. The volume and the character set will fix how long a code must be.','list');L.done();}};
    L.$('#qa').appendChild(b);});}},

{part:0,src:'Chapter 8 · Back of the envelope estimation',run(L){
  L.h(L.kick('learn','The napkin math')+'<h1 class="q">Four sums, said out loud</h1>'+
   L.tiers([['pencil','Writes','100 million ÷ 24 ÷ 3,600 ≈ <b>1,160 a second</b>.'],
     ['eye','Reads','Assume 10 reads for every write: <b>11,600 a second</b>.'],
     ['cal','Records','Over 10 years: 100 million × 365 × 10 = <b>365 billion</b>.','Keep this one. It decides the code length.',true,'Key'],
     ['box','Storage','At about 100 bytes per URL, the book writes 365 TB.','A careful recount gives 36.5 TB: the 10 years are already inside the 365 billion records.']])+
   '<p class="small" style="margin-top:10px">The book stresses walking the interviewer through each '+L.g('estimate','assumption and sum')+' so you both agree on the numbers.</p>');
  L.done();}},

{part:0,src:'Chapter 8 · Back of the envelope estimation',run(L){
  L.h(L.kick('ex','Kitebird design review')+'<h1 class="q">kbird.link: same method, Kitebird’s numbers</h1>');
  L.beats(L.card,[
   ['The ask','Dario wants short links for sharing Kitebird projects on other social apps, plus click counts for marketing campaigns.'],
   ['Scope','Tamsin: “How big?” Dario: about <b>5 million</b> new short links a day, each clicked about <b>20 times</b> (Kitebird’s numbers are illustrative). Same characters as the book; links never change.'],
   ['Writes and reads','5 million ÷ 24 ÷ 3,600 ≈ <b>58 writes a second</b>. 20 clicks each: 58 × 20 ≈ <b>1,160 reads a second</b>.'],
   ['Records','5 million × 365 × 10 ≈ <b>18 billion</b> links over 10 years.'],
   ['Storage','18 billion × 100 bytes ≈ <b>1.8 TB</b>. Tamsin: “Good. Now we know what we’re sizing.”']],
   'The book’s four sums with Kitebird’s inputs. Remember the 18 billion: you’ll size kbird.link’s codes from it.');}},

{part:0,src:'Chapter 8 · Back of the envelope estimation',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Dario now expects each kbird.link to be clicked 50 times, not 20. Writes stay at 58 a second. About how many reads a second?</h1>');

/* ---------- PART 2: REDIRECTS ---------- */
{part:1,src:'Chapter 8 · API Endpoints',pts:1,run(L){
  L.h(L.kick('learn','The high-level design')+'<h1 class="q">Two doors in: shorten and redirect</h1>'+
   L.list([['POST api/v1/data/shorten','Send the long URL as {longUrl: …}. You get back the short URL.'],
     ['GET api/v1/<i>shortUrl</i>','Ask for a short URL. You get back the long URL, used for an HTTP '+L.g('redirect','redirect')+'.']],1)+
   '<p class="small">The simplest redirect: a hash table of ⟨shortURL, longURL⟩ pairs. To make codes, the book wants a '+L.g('hash','hash function')+' that maps each long URL to one short value, and each short value back to its long URL.</p>'+
   '<div id="lq"><h2 class="sub">Mae taps “Share” on their cardigan project. Which call does the app make?</h2></div>');
  L.mc(L.$('#lq'),['GET api/v1/shortUrl','POST api/v1/data/shorten'],1,
   'Making a new short link sends the long URL with POST.',
   'GET is for following a short link. Making a new one sends the long URL with POST.');}},

{part:1,src:'Chapter 8 · URL redirecting',run(L){
  L.h(L.kick('learn','301 vs 302')+'<h1 class="q">Two kinds of redirect, one big difference</h1>'+
   L.lanes([['lock','301 redirect','“Moved permanently.” The browser <b>caches</b> the answer. Later clicks on the same short URL go straight to the long URL.<div class="res">Pick it to reduce server load.</div>',2],
            ['cycle','302 redirect','“Moved temporarily.” <b>Every</b> click goes to the shortener first, which sends the browser on.<div class="res">Pick it when analytics matter: click rate and click source.</div>',3]])+
   '<p class="small">Next you’ll click a link yourself and watch both happen side by side.</p>');
  L.done();}},

{part:1,src:'Chapter 8 · URL redirecting',
 solve:async L=>{L.$('[data-a="click"]').click();L.$('[data-a="click"]').click();L.$('[data-a="click"]').click();},
 run(L){
  L.h(L.kick('learn','Explore · the click log')+'<h1 class="q">Rafi opens Mae’s short link. Click it a few times and watch both servers.</h1>'+
   '<p class="small">Left: kbird.link answers with a 301. Right: with a 302. Watch the hit counters and the browser cache.</p><div id="ck"></div>');
  let fin=false;
  const api=ksClk(L.$('#ck'),{controls:true,ic:L.ic('pointer'),change(k){
    if(!fin&&k==='click'&&api.S.n>=3){fin=true;L.sheet('info','The 301 server went quiet','After the first click, the browser cached the 301 answer and stopped asking kbird.link. Under 302, every click came back, so every click could be counted. Try the phone or clearing the cache too.');L.done();}}});}},

{part:1,src:'Chapter 8 · URL redirecting',pts:1,
 solve:async L=>{L.$('#po').children[0].click();L.$('#run').click();await L.sleep(2600);},
 run(L){
  let p=null;const O=['1','2','10'];
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">Fresh start. Rafi clicks Mae’s link 10 times on the laptop. Under the <b>301</b>, how many requests reach kbird.link?</h1><div id="po" class="ks-row"></div>'+
   '<button class="btn pri" id="run" hidden>'+L.ic('play')+'Click 10 times</button><div id="ck"></div>');
  const api=ksClk(L.$('#ck'),{});
  O.forEach((o,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=o;b.onclick=()=>{if(p!==null)return;p=j;b.classList.add('sel');L.$('#run').hidden=false;};L.$('#po').appendChild(b);});
  L.$('#run').onclick=async function(){this.remove();await ksPlay(api,Array(10).fill('c'),210);if(!api.el.isConnected)return;
    L.award(p===0);L.sheet(p===0?'ok':'no',p===0?'Just one':'Only one reached kbird.link','The first 301 told the browser the move was permanent, so it cached the answer and went straight to kitebird.com for clicks 2 to 10. The 302 server saw all 10, so marketing could count all 10.');L.done();};}},

{part:1,src:'Chapter 8 · URL redirecting',run(L){
  L.h(L.kick('ex','Kitebird design review')+'<h1 class="q">Dario and Hana disagree. You settle it.</h1>');
  L.beats(L.card,[
   ['Dario','“Marketing needs clicks per campaign: the spring knit-along, the woodturning giveaway. Every click.”'],
   ['Hana','“With a 301 the browser remembers the answer and stops asking us. Fewer requests, smaller bill.”'],
   ['You','You name the trade-off from the click log: a 301 cuts load, but repeat clicks never reach kbird.link, so they can’t be counted. A 302 sends every click through, so each one counts.'],
   ['Decision','Click counts are why Dario asked for kbird.link, so Tamsin picks <b>302</b>. Hana asks to revisit it if load ever becomes the problem.']],
   'Name the priority first. Less load points to 301; analytics points to 302.');}},

{part:1,src:'Chapter 8 · URL redirecting',
 solve:async L=>{L.$('#pz').children[0].click();await L.sleep(2300);L.$('#pz').children[1].click();await L.sleep(1600);},
 run(L){
  const P=[['10 clicks, one laptop',Array(10).fill('c')],['5 on laptop, 5 on phone',['L','c','c','c','c','c','P','c','c','c','c','c']],['Cache cleared after click 5',['c','c','c','c','c','X','c','c','c','c','c']]];
  L.h(L.kick('pr','Edge cases · where 301 counting breaks')+'<h1 class="q">Run each scenario. When does the 301 server see Rafi again?</h1>'+
   '<p class="small">Scenarios are illustrative. Each one starts from empty caches.</p><div id="pz" class="ks-row"></div><div id="ck"></div><div id="pzr"></div>');
  const api=ksClk(L.$('#ck'),{});const tried=new Set();let busy=false,fin=false;
  P.forEach((x,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=x[0];
    b.onclick=async()=>{if(busy)return;busy=true;L.$$('#pz .chip').forEach(c=>c.classList.toggle('sel',c===b));api.reset();await ksPlay(api,x[1],130);busy=false;if(!api.el.isConnected)return;
      tried.add(j);const h=api.S.c['301'].h;
      L.$('#pzr').innerHTML='<div class="ks-box">301 counted <b>'+h+'</b> of Rafi’s <b>'+api.S.n+'</b> clicks; 302 counted all <b>'+api.S.n+'</b>. '+(j===0?'One browser asks once, then remembers.':j===1?'Each browser has its own cache, so each one asks once.':'A cleared cache forgets the answer, so the browser asks again.')+'</div>';
      if(!fin&&tried.size>=2){fin=true;L.sheet('info','The limit of a 301','A 301 server only hears from a browser that hasn’t cached the answer yet: a new browser, or one whose cache was cleared. So 301 click counts are really “first visits per browser”. If every click must be counted, the book’s choice is 302.'+
        '<div style="margin-top:8px"><b>Beyond the book:</b> many real shorteners use 301 and still count clicks in other ways, so treat this trade-off as an interview simplification.</div>');L.done();}};
    L.$('#pz').appendChild(b);});}},

{part:1,src:'Chapter 8 · URL redirecting',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'301 or 302?',['301 redirect','302 redirect'],[
   ['Marketing needs click counts for each spring knit-along campaign link.',1,'Counting clicks means every click must reach you: 302.'],
   ['A permanent link printed in a Kitebird booklet. The redirect servers are strained and nobody reads its stats.',0,'Load matters and analytics don’t: let browsers cache it with a 301.'],
   ['Dario wants to know which app each click comes from.',1,'The source of a click is analytics, so every click must come through: 302.'],
   ['Hana’s goal this quarter: cut traffic to the redirect servers.',0,'A 301 lets browsers skip the shortener after the first click.']]);}},

/* ---------- PART 3: SHORT CODES ---------- */
{part:2,src:'Chapter 8 · Data model',run(L){
  L.h(L.kick('learn','The deep dive')+'<h1 class="q">A short code is just a number, written with 62 digits</h1>'+
   L.prose('A hash table in memory is a fine start, but memory is limited and expensive. The book stores the pairs in a <b>relational database</b> table:')+
   '<table class="ks-tbl"><tr><th style="width:30%">id</th><th style="width:25%">shortURL</th><th>longURL</th></tr><tr><td>11157</td><td><b>2TX</b></td><td>https://…</td></tr></table>'+
   L.prose('A code may use 10 + 26 + 26 = <b>62 characters</b>. '+L.g('base62','Base 62')+' treats them as 62 digits, so every unique ID has exactly one short spelling:')+
   ksStrip()+
   '<p class="small">The book weighs two ways to make codes: <b>hash + collision resolution</b>, and <b>base 62 conversion</b>, the one it picks. You’ll try base 62 first.</p>');
  L.done();}},

{part:2,src:'Chapter 8 · Base 62 conversion',
 solve:async L=>{L.$('[data-a="all"]').click();await L.sleep(1000);},
 run(L){
  L.h(L.kick('learn','Explore · the encoder')+'<h1 class="q">Turn ID 11157 into a code. Divide by 62 and watch each remainder become a character.</h1>'+
   '<p class="small">Tap “÷ 62 once” a few times. Then type any ID you like.</p><div id="en"></div>');
  let fin=false;
  ksEnc(L.$('#en'),{ic:L.ic('play'),strip:true,start:11157,onDone(S){if(fin)return;fin=true;
    L.sheet('info','Divide, keep the remainder, repeat','Each division peels off one base-62 digit, the smallest first, so the code builds <b>right to left</b>. Stop at 0. The book’s example: 11157 = 2 × 62² + 55 × 62 + 59, so [2, 55, 59] → <b>2TX</b>.');L.done();}});}},

{part:2,src:'Chapter 8 · Base 62 conversion',pts:1,
 solve:async L=>{L.$('#po').children[0].click();L.$('#en [data-a="all"]').click();await L.sleep(800);},
 run(L){
  let p=null,graded=false;const O=['10','Z','zz'];
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">What is the ID 62 written in base 62?</h1><div id="po" class="ks-row"></div><div id="en" hidden></div>');
  const E=ksEnc(L.$('#en'),{ic:L.ic('play'),start:62,onDone(S){if(graded||S.id!==62n||p===null)return;graded=true;L.award(p===0);
    L.sheet(p===0?'ok':'no',p===0?'Ten, in base 62':'It’s “10”','62 ÷ 62 = 1 remainder 0, then 1 ÷ 62 = 0 remainder 1. Read bottom up: <b>10</b>. One 62 and nothing left over, just as ten is “10” in everyday numbers. Z is 61, the biggest single digit.');L.done();}});
  E.el.querySelector('input').readOnly=true;
  O.forEach((o,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=o;b.onclick=()=>{if(p!==null)return;p=j;b.classList.add('sel');L.$('#en').hidden=false;};L.$('#po').appendChild(b);});}},

{part:2,src:'Chapter 8 · Hash value length',
 solve:async L=>{for(const j of [0,2,5])L.$$('#en .ks-pre .chip')[j].click();},
 run(L){
  const PR=[['11157 (book)',11157,'The book’s example: [2, 55, 59] → <b>2TX</b>. Three characters, so it sits on rung 3.','tinyurl.com/'],
    ['2009215674938 (book)','2009215674938','The book’s flow example. A 13-digit ID becomes just 7 characters: <b>zn9edcu</b>.','tinyurl.com/'],
    ['Link no. 365 billion','365000000000','The 365-billionth link needs <b>7</b> characters. Rung 6 stops at 56.8 billion codes, so 6 is too short for the book’s volume.'],
    ['Biggest 7 chars',String(62n**7n-1n),'<b>ZZZZZZZ</b> is 3,521,614,606,207: the last 7-character code, about 3.5 trillion codes in all.'],
    ['One more',String(62n**7n),'One past ZZZZZZZ is <b>10000000</b>: the code grows to 8 characters. Base 62 codes get longer as IDs grow.'],
    ['Next ID: 11158',11158,'11157 was 2TX; 11158 is <b>2TY</b>. If IDs go up by 1, anyone can guess the next short URL. The book flags that as a security concern.','tinyurl.com/']];
  L.h(L.kick('learn','Edge cases · the length ladder')+'<h1 class="q">How long must a code be? Find the smallest n where 62ⁿ ≥ 365 billion.</h1>'+
   '<p class="small">Try at least three presets. The ladder lights the code’s length.</p><div id="en"></div>');
  const tried=new Set();let fin=false;
  ksEnc(L.$('#en'),{ic:L.ic('play'),presets:PR,start:11157,dom:'tinyurl.com/',need:()=>365e9,onPreset(j){tried.add(j);
    if(!fin&&tried.size>=3){fin=true;L.sheet('info','Length comes from capacity','62⁶ ≈ 56.8 billion is too few for 365 billion records; 62⁷ ≈ 3.5 trillion is more than enough. So the book’s codes are <b>7 characters</b>. Two limits to remember: base 62 codes <b>grow</b> once IDs pass a rung, and IDs that count up make the next code <b>guessable</b>.'+
      '<div style="margin-top:8px"><b>Beyond the book:</b> the usual fix for guessable codes is to scramble the ID before converting it.</div>');L.done();}}});}},

{part:2,src:'Chapter 8 · Base 62 conversion',pts:2,
 solve:async L=>{L.$('#ld button[data-n="6"]').click();for(const c of 'cAr6'.split('').reverse()){L.$('#pad button[data-c="'+c+'"]').click();}},
 run(L){
  const ID=3000000;let cur=BigInt(ID),code='',miss=false,aDone=false,first=true;
  L.h(L.kick('pr','Challenge')+'<h1 class="q">Size kbird.link’s codes, then encode a link by hand.</h1>'+
   '<h2 class="sub">1 · kbird.link expects about <b>18 billion</b> links in 10 years. Tap the shortest code length that covers them.</h2><div id="ld"></div><div id="lf"></div><div id="pb"></div>');
  const drawLad=pk=>{L.$('#ld').innerHTML=ksLad(18e9,0,{tap:true,blind:!aDone,pick:pk});L.$$('#ld button').forEach(b=>b.onclick=()=>pickN(+b.dataset.n));};
  function pickN(n){if(aDone)return;L.$('#lf').innerHTML='';
    if(n===6){if(first)L.award(true);first=false;aDone=true;drawLad(6);L.fb(L.$('#lf'),'<b>6 characters.</b> 62⁶ ≈ 56.8 billion covers 18 billion; 62⁵ ≈ 916 million doesn’t. Kitebird’s smaller volume needs one character fewer than the book’s 7.','ok');partB();}
    else{if(first)L.award(false);first=false;drawLad(n);L.fb(L.$('#lf'),n<6?'<b>Too short.</b> '+ksBig(Math.pow(62,n))+' codes can’t hold 18 billion links.':'<b>It fits, but it’s longer than needed.</b> The requirement is “as short as possible”. Try a shorter one.','no');}}
  drawLad(0);
  function partB(){
    L.$('#pb').innerHTML='<h2 class="sub">2 · A test link has ID <b>3,000,000</b>. The divisions are done for you. Tap the character for each remainder.</h2>'+
     '<div class="ks-code"><span class="dom">kbird.link/</span><span class="cd" id="cd" style="display:flex;gap:3px"></span></div><div class="ks-divs" id="dv"></div><div class="ks-pad" id="pad"></div>'+KS_KEY+'<div id="pf"></div>';
    [...KS_A].forEach((c,v)=>{const b=document.createElement('button');b.className='ks-ch '+ksK(v);b.textContent=c;b.dataset.c=c;b.setAttribute('aria-label','character '+c);b.onclick=()=>tap(c,b);L.$('#pad').appendChild(b);});
    row();}
  function row(){const r=Number(cur%62n),nx=cur/62n;
    L.$('#dv').insertAdjacentHTML('beforeend','<div class="ks-dv"><span class="eq">'+ksN(cur)+' ÷ 62 = '+ksN(nx)+' r <b>'+r+'</b></span><span class="ar">→</span><span class="ks-ch q" id="slot">?</span></div>');
    L.$('#cd').innerHTML='<span class="ks-ch q">?</span>'+[...code].map(c=>ksCh(KS_A.indexOf(c))).join('');}
  function tap(c,b){if(cur===0n)return;const r=Number(cur%62n);L.$('#pf').innerHTML='';
    if(KS_A[r]!==c){miss=true;L.shake(b);L.fb(L.$('#pf'),'<b>'+c+'</b> stands for '+KS_A.indexOf(c)+', not '+r+'. '+(r<10?'Digits 0–9 stay as they are.':r<36?'Count from a = 10.':'Count from A = 36.'),'no');return;}
    const s=L.$('#slot');s.outerHTML=ksCh(r);code=c+code;cur=cur/62n;
    if(cur>0n){row();return;}
    L.$('#cd').innerHTML=[...code].map((x,j)=>ksCh(KS_A.indexOf(x),j===0?'new':'')).join('');
    L.award(!miss);L.sheet(miss?'info':'ok',miss?'Encoded: '+code:'Spot on: '+code,'Remainders 6, 27, 36, 12 become 6, r, A, c. Read bottom up: <b>cAr6</b>. Check: 12 × 62³ + 36 × 62² + 27 × 62 + 6 = 3,000,000.');L.done();}}},

{part:2,src:'Chapter 8 · Hash + collision resolution',
 solve:async L=>{for(let k=0;k<4;k++)L.$('#hn').click();},
 run(L){
  L.h(L.kick('learn','Approach 1 · hash + collision resolution')+'<h1 class="q">Hash each link, cut it short, and watch for clashes</h1>'+
   '<p class="small">A well-known '+L.g('hash','hash function')+' like CRC32 gives 8 characters, already too long. So the book keeps the first 7. To make clashes visible here, this board keeps just <b>1</b> character: 16 slots (illustrative).</p>'+
   '<div class="ks-grid" id="gd"></div><div class="ks-box" id="hp">Next: <span class="ks-mono">'+KS_LINKS[0][1]+'</span></div>'+
   '<div class="ks-row"><button class="btn pri" id="hn">Hash the next link</button><button class="btn" id="hr">Start over</button></div>'+
   '<label class="ks-tg"><input type="checkbox" id="bf"><span>Put a '+L.g('bloom','bloom filter')+' in front: it answers “is it taken?” first</span></label>'+
   '<div class="ks-cnt"><span>Database lookups <b id="dq">0</b></span><span>Collisions <b id="cc">0</b></span></div>');
  let idx,suf,slots,dq,cc,fin=false;
  function reset(){idx=0;suf='';slots={};dq=0;cc=0;draw();L.$('#hp').innerHTML='Next: <span class="ks-mono">'+KS_LINKS[0][1]+'</span>';L.$('#hn').textContent='Hash the next link';L.$('#hn').disabled=false;}
  function draw(hit,cls){L.$('#gd').innerHTML=[...'0123456789abcdef'].map(c=>'<div class="'+(slots[c]?'full':'')+(c===hit?' '+cls:'')+'"><i>'+c+'</i>'+(slots[c]||'')+'</div>').join('');L.$('#dq').textContent=dq;L.$('#cc').textContent=cc;}
  L.$('#hn').onclick=()=>{if(idx>=KS_LINKS.length)return;const [who,u]=KS_LINKS[idx],s=u+suf,h=ksCrc(s),c=h[0],taken=slots[c],bloom=L.$('#bf').checked;
    let m='<span class="ks-mono">'+s+'</span><br>CRC32 → <span class="ks-mono">'+h+'</span> (8 characters). Keep the first: <b class="ks-mono">'+c+'</b>.<br>';
    if(bloom&&!taken)m+='Bloom filter: <b>not in the set</b>, so no database lookup needed. ';
    else{dq++;m+=(bloom?'Bloom filter: <b>maybe taken</b>, so ask the database. ':'')+'Database lookup: '+(taken?'<b style="color:var(--no)">taken by '+taken+'’s link</b>. ':'free. ');}
    if(taken){cc++;draw(c,'clash');m+='<b>Collision!</b> Append a fixed extra string (“~kb” here) and hash again.';L.$('#hp').innerHTML=m;suf+='~kb';L.$('#hn').textContent='Append ~kb and hash again';return;}
    const retried=suf!=='';slots[c]=who;idx++;suf='';draw(c,'newp');
    m+='Saved in slot '+c+'.'+(idx<KS_LINKS.length?'<br>Next: <span class="ks-mono">'+KS_LINKS[idx][1]+'</span>':' All links placed.');
    L.$('#hp').innerHTML=m;L.$('#hn').textContent='Hash the next link';if(idx>=KS_LINKS.length)L.$('#hn').disabled=true;
    if(retried&&!fin){fin=true;L.sheet('info','Clash resolved, at a price','Cutting a hash short lets two different links share a code. The fix: append a fixed string and hash again until the code is free. But that means checking the database on <b>every</b> request, which is expensive. Start over with the bloom filter on and compare the lookups: a fast in-memory check only sends “maybe taken” to the database. (Here the filter is always right; a real one answers by probability.)');L.done();}};
  L.$('#hr').onclick=reset;reset();}},

{part:2,src:'Chapter 8 · Comparison of the two approaches',pts:6,run(L){
  L.h(L.kick('pr','Compare the two')+'<h1 class="q">You’ve used both. Which approach does each line describe?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Hash + collision','Base 62'],[
   ['The code is always the same length',0,'Hash, then cut to 7 characters: fixed length.'],
   ['The code gets longer as IDs grow',1,'Bigger numbers need more base 62 digits, like ZZZZZZZ → 10000000.'],
   ['Needs a unique ID generator',1,'Base 62 converts an ID, so something must hand out unique IDs.'],
   ['Clashes can happen and must be resolved',0,'Cutting a hash short lets two URLs share a code.'],
   ['Clashes are impossible',1,'Unique IDs give unique codes.'],
   ['The next code can be guessed if IDs go up by 1',1,'Counting IDs make neighbouring codes predictable: 2TX, 2TY.']],
   'Hash + collision: fixed length and no ID generator, but clashes to check. Base 62: no clashes, but it needs an ID generator, grows and can be guessed. The book’s design uses base 62.');}},

{part:3,src:'Chapter 8 · URL shortening deep dive',
 solve:async L=>{L.$('#fb0').click();await L.sleep(1900);L.$('#fb1').click();await L.sleep(1200);},
 run(L){
  const U=[['Mae shares the cardigan','kitebird.com/mae/cardigan'],['Mae shares it again','kitebird.com/mae/cardigan'],['Rafi shares the walnut bowl','kitebird.com/rafi/walnut-bowl']];
  L.h(L.kick('learn','The shortening flow')+'<h1 class="q">Run links through kbird.link’s shortening flow</h1>'+
   '<p class="small">Try a new link, then the same link again. New IDs come from kbird.link’s own link-ID generator, which counts up (ID values illustrative).</p>'+
   '<div class="ks-row" id="fbs"></div>'+ksShortSvg()+'<div class="ks-box" id="fr" aria-live="polite">Pick a link to shorten.</div>'+
   '<table class="ks-tbl" id="tb"><tr><th style="width:31%">id</th><th style="width:31%">shortURL</th><th>longURL</th></tr></table>');
  const rows=[];let next=9876543210n,busy=false,did={n:false,r:false},fin=false;
  const svg=L.card.querySelector('svg.ks-svg');
  const lit=ks=>{svg.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));ks.forEach(k=>svg.querySelectorAll('.'+k).forEach(x=>x.classList.add('on')));};
  const drawT=hl=>{L.$('#tb').innerHTML='<tr><th style="width:31%">id</th><th style="width:31%">shortURL</th><th>longURL</th></tr>'+rows.map((r,j)=>'<tr class="'+(j===hl[0]?hl[1]:'')+'"><td>'+ksN(r[0])+'</td><td><b>'+r[1]+'</b></td><td>'+r[2]+'</td></tr>').join('');};
  U.forEach((u,j)=>{const b=document.createElement('button');b.className='chip';b.id='fb'+j;b.textContent=u[0];b.onclick=()=>run(u[1]);L.$('#fbs').appendChild(b);});
  function run(url){if(busy)return;busy=true;const ex=rows.findIndex(r=>r[2]===url);
    const seq=ex>=0?[['n1','Long URL in: '+url],['n1','e1','n2','Is it in the database? <b>Yes</b>.'],['n1','e1','n2','eY','n6','Return the stored code <b>'+rows[ex][1]+'</b>. No new ID, no new row.']]
      :[['n1','Long URL in: '+url],['n1','e1','n2','Is it in the database? <b>No</b>, it’s new.'],['n1','e1','n2','eN','n3','The ID generator hands out <b>'+ksN(next)+'</b>.'],['n1','e1','n2','eN','n3','e3','n4','Base 62: '+ksN(next)+' → <b>'+ksB62(next)+'</b>.'],['n1','e1','n2','eN','n3','e3','n4','e4','n5','Save the row. Short link: <b>kbird.link/'+ksB62(next)+'</b>.']];
    let k=0;const t=()=>{if(!svg.isConnected)return;const s=seq[k];lit(s.slice(0,-1));L.$('#fr').innerHTML=s[s.length-1];k++;
      if(k<seq.length){setTimeout(t,330);return;}
      if(ex>=0){did.r=true;drawT([ex,'hit']);}else{rows.push([next,ksB62(next),url]);next++;did.n=true;drawT([rows.length-1,'new']);}
      busy=false;
      if(!fin&&did.n&&did.r){fin=true;L.sheet('info','Check first, then make a new code','The book’s six steps: long URL in; is it already in the database? If yes, return its short URL. If not, get a new unique ID, convert it with base 62, and save ID, short URL and long URL. The book’s example: ID 2009215674938 → zn9edcu. The book reuses the chapter 7 unique ID generator here.'+'<div style="margin-top:8px"><b>Kitebird’s choice (beyond the book):</b> kbird.link uses its own counting link-ID generator instead of Kite IDs. A 64-bit Kite ID would make codes too long: about 10 characters today, up to 11 for a full 64-bit ID. Counting IDs give 6-character codes for about 18 billion links.</div>');L.done();}};
    t();}}},

{part:3,src:'Chapter 8 · URL redirecting deep dive',pts:3,
 solve:async L=>{for(let k=0;k<3;k++){L.$('#ro').children[[1,0,2][k]].click();await L.sleep(1500);const n=L.$('#rn');if(n)n.click();}},
 run(L){
  const C=[['A two-year-old link to Rafi’s walnut bowl. Rarely clicked, not in the cache.',1,['k0','a0','k1','a1','k2','a2','k3','a3','k4'],'Cache miss, so the web server fetches the long URL from the database and returns it.'],
    ['Yusuf’s new woodturning video link, clicked 30,000 times this hour (illustrative).',0,['k0','a0','k1','a1','k2','a2','k3'],'A hot link’s pair sits in the cache, so the long URL comes straight back. The database isn’t touched.'],
    ['Someone types kbird.link/zzzzzz by hand. It’s in neither the cache nor the database.',2,['k0','a0','k1','a1','k2','a2','k3','a3','k4'],'Not cached, not stored: most likely an invalid short URL.']];
  const OPT=['The cache answers','The database answers','It’s an invalid link'];
  L.h(L.kick('pr','Predict the path')+'<h1 class="q">There are far more reads than writes, so the book checks a '+L.g('cache','cache')+' first. Where does each click get its answer?</h1>'+
   '<div class="ks-box" id="rc"></div><div class="ks-row" id="ro"></div>'+ksRedSvg()+'<div id="rf"></div>');
  const svg=L.card.querySelector('svg.ks-svg');let j=0,n=0,lock=false;
  function show(){const c=C[j];L.$('#rc').innerHTML='<b>Click '+(j+1)+' of 3.</b> '+c[0];L.$('#rf').innerHTML='';
    svg.querySelectorAll('.on,.okb,.nob').forEach(x=>x.classList.remove('on','okb','nob'));['o3','o3b','o4','o4b'].forEach(k=>svg.querySelector('.'+k).textContent='');
    L.$('#ro').innerHTML='';OPT.forEach((o,q)=>{const b=document.createElement('button');b.className='chip';b.textContent=o;b.onclick=()=>pick(q,b);L.$('#ro').appendChild(b);});}
  function pick(q,b){if(lock)return;lock=true;b.classList.add('sel');const c=C[j],ok=q===c[1];if(ok)n++;L.award(ok);
    let k=0;const t=()=>{if(!svg.isConnected)return;svg.querySelectorAll('.'+c[2][k]).forEach(x=>x.classList.add('on'));k++;
      if(k<c[2].length){setTimeout(t,130);return;}
      const end=svg.querySelector('.bx.'+c[2][c[2].length-1]);end.classList.remove('on');end.classList.add(c[1]===2?'nob':'okb');
      const o=c[1]===0?['o3','o3b']:['o4','o4b'];svg.querySelector('.'+o[0]).textContent=c[1]===2?'✗ not found:':'✓ found: long';svg.querySelector('.'+o[1]).textContent=c[1]===2?'invalid link':'URL back to user';
      if(c[1]>=1){svg.querySelector('.o3').textContent='✗ not cached';}
      L.fb(L.$('#rf'),(ok?'<b>Right.</b> ':'<b>It’s “'+OPT[c[1]]+'”.</b> ')+c[3],ok?'ok':'no');
      if(j<C.length-1){L.$('#rf').insertAdjacentHTML('beforeend','<button class="btn pri" id="rn" style="margin-top:8px">Next click</button>');L.$('#rn').onclick=()=>{j++;lock=false;show();};}
      else{L.sheet(n===3?'ok':'info',n+' of 3 right','The redirect flow: a click reaches the '+L.g('load-balancer','load balancer')+', which forwards it to a web server. The cache answers if it holds the pair; otherwise the database does. If neither has it, the user likely entered an invalid short URL.');L.done();}};
    t();}
  show();}},

{part:3,src:'Chapter 8 · Step 4 - Wrap up',run(L){
  L.h(L.kick('learn','If time remains')+'<h1 class="q">Talking points for the last few minutes</h1>'+
   L.list([['shield','Rate limiter','Stops abusers who flood the service with shortening requests, filtering by IP address or other rules.'],
     ['layers','Scale the web tier','The web servers are '+L.g('stateless','stateless')+', so you add or remove them freely.'],
     ['box','Scale the database',L.g('replication','Replication')+' and '+L.g('sharding','sharding')+'.'],
     ['trend','Analytics','Answer questions like how many people click a link, and when.'],
     ['check','Availability, consistency, reliability','The core of any large system’s success.']],3));
  L.done();}},

{part:3,src:'Chapter 8 · Step 4 - Wrap up',pts:4,run(L){
  L.h('<div id="qk"></div>');

   ['A bot submits 50,000 new links a minute from one IP address.',0,'Filter abusive requests by IP address with a rate limiter.'],
   ['A knit-along launch triples traffic and the web servers are maxed out.',1,'The web tier is stateless, so just add servers.'],
   ['The links table has outgrown one database server.',2,'Split it across databases (sharding) and keep copies (replication).'],
   ['Dario asks how many people clicked the giveaway link, and when.',3,'That’s analytics.']]);}}
  ]
});
