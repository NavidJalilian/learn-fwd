<script>
/* =====================================================================
   Lesson 0003 only. Hands-on models used across the lesson:
   1. Frontier – a clock-driven URL frontier: front queues (priority),
      back queues (one host each), workers with a delay, site load meters.
   2. Ring     – the crawl loop: 11 parts on a ring, a page token travels it.
   Smaller ones: napkin-math dials, BFS vs DFS graph, URL-length trap chart.
   ===================================================================== */
const NS='http://www.w3.org/2000/svg';
const HOST={M:['knitbymae','k1'],Q:['quiltnook','k2'],S:['sewlab','k3'],G:['quiltguild','k4'],Y:['yarnloft','k4'],T:['stitchery','k5'],B:['bobbinbox','k6']};
const CAP=4,TO=2;
function rnd(seed){let s=seed;return()=>{s=(s*16807)%2147483647;return s/2147483647;};}
async function waitFor(L,f,n){for(let i=0;i<(n||400)&&!f();i++)await L.sleep(30);}
function setR(L,id,v){const e=L.$('#'+id);e.value=v;e.dispatchEvent(new Event('input',{bubbles:true}));}
function rng(id,label,min,max,val,step){return '<label class="rg"><span>'+label+'</span><input type="range" id="'+id+'" min="'+min+'" max="'+max+'" step="'+(step||1)+'" value="'+val+'"><b id="'+id+'-v"></b></label>';}
function tog(id,label,on){return '<button class="chip'+(on?' sel':'')+'" id="'+id+'" aria-pressed="'+on+'">'+label+': <b>'+(on?'on':'off')+'</b></button>';}
function setTog(b,on){b.classList.toggle('sel',on);b.setAttribute('aria-pressed',on);b.querySelector('b').textContent=on?'on':'off';}
function tasks(id,items){return '<ul class="tasks" id="'+id+'">'+items.map((t,k)=>'<li data-k="'+k+'"><span class="bx"></span><span>'+t+'</span></li>').join('')+'</ul>';}
function tickT(L,id,k){const li=L.$('#'+id+' li[data-k="'+k+'"]');if(li&&!li.classList.contains('done')){li.classList.add('done');li.querySelector('.bx').innerHTML=L.ic('check');}}
function allT(L,id){return [...L.$$('#'+id+' li')].every(li=>li.classList.contains('done'));}

/* ---------- 1. URL frontier: the simulation core (no DOM) ---------- */
function core(o){
  const st={t:0,f:[[],[]],w:[],hits:{},peak:{},got:{},total:0,stars:0,starsDone:0,lastStar:null,timedOut:0,skipped:0,bad:0,pending:[],r:rnd(11)};
  for(const h of o.hosts){st.hits[h]=[];st.peak[h]=0;st.got[h]=0;}
  for(let k=0;k<o.lanes;k++)st.w.push({host:null,q:[],busy:null,wait:0});
  const add=u=>{if(o.exclude&&u.h===o.exclude)return;(o.prio&&u.star?st.f[0]:st.f[1]).push(u);};
  o.urls.forEach(s=>{const u={h:s[0],star:s.includes('*'),slow:s.includes('!'),dr:s.includes('d')};if(u.star)st.stars++;add(u);});
  const pick=()=>{const a=st.f[0].length,b=st.f[1].length;if(!a&&!b)return -1;if(!a)return 1;if(!b)return 0;return st.r()<.75?0:1;};
  function laneFor(h){const l=st.w.find(x=>x.host===h);if(l)return l.q.length<CAP?l:null;return st.w.find(x=>x.host===null)||null;}
  function route(){for(let m=0;m<8;m++){const qi=pick();if(qi<0)return;let ok=false;
    for(const k of [qi,1-qi]){const Q=st.f[k];for(let j=0;j<Q.length;j++){const l=laneFor(Q[j].h);if(l){const u=Q.splice(j,1)[0];l.host=u.h;l.q.push(u);ok=true;break;}}if(ok)break;}
    if(!ok)return;}}
  function start(w,u){w.busy={u,age:0};st.hits[u.h][st.t]=(st.hits[u.h][st.t]||0)+1;if(u.dr)st.bad++;}
  function next(w){for(;;){let u;if(o.polite)u=w.q.shift();else{const qi=pick();if(qi<0)return null;u=st.f[qi].shift();}
    if(!u)return null;if(o.robots&&u.dr){st.skipped++;continue;}return u;}}
  function starts(){for(const w of st.w){if(w.busy)continue;if(o.polite&&w.wait>0){w.wait--;continue;}const u=next(w);if(u)start(w,u);}
    if(o.polite)for(const w of st.w)if(!w.busy&&!w.q.length&&!w.wait)w.host=null;}
  function finish(){for(const w of st.w){if(!w.busy)continue;w.busy.age++;const u=w.busy.u;
    if(u.slow){if(o.timeout&&w.busy.age>=TO){st.timedOut++;w.busy=null;w.wait=o.polite?o.delay:0;}continue;}
    w.busy=null;w.wait=o.polite?o.delay:0;st.got[u.h]++;st.total++;
    if(u.star){st.starsDone++;st.lastStar=st.t;}
    if(u.h==='G')st.pending.push({h:'G',star:false,slow:false,dr:false});}}
  function stats(){for(const h of o.hosts){const v=(st.hits[h][st.t]||0)+(st.hits[h][st.t-1]||0);if(v>st.peak[h])st.peak[h]=v;}}
  return {st,
    first(){if(o.polite)route();starts();stats();},
    tick(){st.t++;const p=st.pending;st.pending=[];p.forEach(add);finish();if(o.polite)route();starts();stats();},
    idle:()=>!st.f[0].length&&!st.f[1].length&&!st.pending.length&&st.w.every(w=>!w.busy&&!w.q.length),
    win:h=>(st.hits[h][st.t]||0)+(st.hits[h][st.t-1]||0)};
}

/* ---------- 1b. URL frontier: the board ---------- */
function Frontier(L,host,o){
  o=Object.assign({id:'fr',hosts:'MQS',urls:[],polite:false,prio:false,delay:0,lanes:4,timeout:false,robots:false,exclude:null,maxT:16,ms:200,show:{},foot:'.'},o);
  const ID=o.id;
  host.insertAdjacentHTML('beforeend','<div class="fr" id="'+ID+'"><div class="frhd" id="'+ID+'-hd" aria-live="polite"></div><div id="'+ID+'-body"></div>'+
    '<div class="frsec">Load on each site <span>· requests in the last 2 s</span></div><div id="'+ID+'-ld"></div>'+
    '<div class="frfoot">1 tick = 1 s; each download takes 1 s. Red dashed line: at most 1 request per 2 s per site. All three are <span class="ill">illustrative</span>'+o.foot+'</div></div>');
  const el=host.querySelector('#'+ID),$=s=>el.querySelector(s);
  const F={o,busy:false,alive:()=>el.isConnected};
  let c=null;
  const tok=u=>'<i class="tk '+HOST[u.h][1]+(u.dr?' dr':'')+(u.slow?' sl':'')+'" title="'+HOST[u.h][0]+'">'+u.h+(u.star?'★':'')+'</i>';
  const toks=a=>a.length?a.slice(0,6).map(tok).join('')+(a.length>6?'<span class="more">+'+(a.length-6)+'</span>':''):'<span class="emp">empty</span>';
  const row=(lab,inner,after)=>'<div class="qr"><span class="ql">'+lab+'</span><span class="tq">'+inner+'</span>'+(after||'')+'</div>';
  function wk(w,k,wide){const nm='W'+(k+1);
    if(w.busy){const u=w.busy.u;if(u.slow&&w.busy.age>=1)return '<span class="wk stuck">'+nm+(wide?' '+u.h:'')+' …</span>';
      return '<span class="wk busy '+HOST[u.h][1]+'">'+nm+(wide?' → '+u.h:' ↓')+'</span>';}
    if(w.wait>0)return '<span class="wk">'+nm+' ⏱</span>';
    return '<span class="wk">'+nm+'</span>';}
  function draw(){if(!F.alive())return;const s=c.st;
    let hd='<span>t = <b>'+s.t+' s</b></span><span>fetched <b>'+s.total+'</b></span><span><b>'+(s.t?(s.total/s.t).toFixed(1):'0.0')+'</b> pages/s</span>';
    if(s.stars)hd+='<span>★ important done <b>'+s.starsDone+'/'+s.stars+'</b></span>';
    if(o.show.slow)hd+='<span>timed out <b>'+s.timedOut+'</b></span>';
    if(o.show.robots)hd+='<span>/drafts/ fetched <b>'+s.bad+'</b></span><span>skipped <b>'+s.skipped+'</b></span>';
    if(o.show.trap)hd+='<span>quiltguild pages <b>'+s.got.G+'</b></span>';
    $('#'+ID+'-hd').innerHTML=hd;
    let b='<div class="frsec">'+(o.prio?'Front queues <span>· the prioritizer ranks each URL</span>':'Front <span>· one FIFO queue</span>')+'</div>';
    b+=o.prio?row('f1 · high',toks(s.f[0]))+row('f2 · low',toks(s.f[1])):row('FIFO',toks(s.f[1]));
    if(o.polite){b+='<div class="frsec">Back queues <span>· one site each → its worker</span></div>';
      s.w.forEach((w,k)=>{b+=row('b'+(k+1)+' '+(w.host?HOST[w.host][0]:'· free'),toks(w.q),wk(w,k));});}
    else b+='<div class="frsec">No back queues <span>· each worker takes the next URL</span></div><div class="wrow">'+s.w.map((w,k)=>wk(w,k,true)).join('')+'</div>';
    $('#'+ID+'-body').innerHTML=b;
    $('#'+ID+'-ld').innerHTML=[...o.hosts].map(h=>{const v=c.win(h),pk=s.peak[h];
      return '<div class="ld"><span class="ln">'+HOST[h][0]+'</span><span class="lb2"><i style="width:'+Math.min(100,v/8*100)+'%;background:var(--'+(v>1?'no-strong':'ok-strong')+')"></i><span class="lim"></span></span><b>'+v+'</b><span class="pk'+(pk>1?' over':'')+'">peak '+pk+'</span></div>';}).join('');
  }
  F.reset=()=>{c=core(o);draw();};
  F.run=async()=>{if(F.busy)return null;F.busy=true;c=core(o);c.first();draw();
    while(!c.idle()&&c.st.t<o.maxT){await L.sleep(o.ms);if(!F.alive()){F.busy=false;return null;}c.tick();draw();}
    F.busy=false;const s=c.st;
    return {t:s.t,total:s.total,peaks:s.peak,peak:Math.max(...[...o.hosts].map(h=>s.peak[h])),lastStar:s.lastStar,starsDone:s.starsDone,stars:s.stars,idle:c.idle(),got:s.got,bad:s.bad,skipped:s.skipped,timedOut:s.timedOut};};
  F.reset();
  return F;
}

/* ---------- 2. The crawl loop ring ---------- */
const RING=[
 ['fr',['URL','Frontier'],'URL Frontier','Steps 1, 2 and 11','Stores the URLs still to be downloaded. Crawlers split their state into “to be downloaded” and “already downloaded”; this is the first half. Think of it as a first-in-first-out queue for now. Part 3 opens it up.'],
 ['dl',['HTML','Downloader'],'HTML Downloader','Steps 2–3','Downloads the web pages whose URLs the frontier hands it.'],
 ['pa',['Content','Parser'],'Content Parser','Step 4','Parses and validates each page, because malformed pages cause problems and waste storage. It’s a separate part: parsing inside the crawl servers would slow the crawl down.'],
 ['cs',['Content','Seen?'],'“Content Seen?”','Steps 5–6','About 29% of web pages are duplicate content. Comparing pages character by character is slow, so it compares their '+'hash values. Already stored? The page is discarded.'],
 ['ex',['URL','Extractor'],'URL Extractor','Step 7','Pulls the links out of a page and turns relative paths (like /patterns/socks) into full URLs.'],
 ['fi',['URL','Filter'],'URL Filter','Step 8','Drops certain content types, file extensions, error links and URLs on blacklisted sites.'],
 ['us',['URL','Seen?'],'“URL Seen?”','Steps 9–10','Remembers URLs already visited or already waiting in the frontier, so none is added twice. That avoids extra server load and endless loops. Usually built with a bloom filter or a hash table.'],
 ['sd',['Seed','URLs'],'Seed URLs','Step 1','Where the crawl starts. For one university’s site: its domain. For the whole web, split the URL space, by country or by topic (shopping, sports, health). There’s no perfect answer, so think out loud.'],
 ['dn',['DNS','Resolver'],'DNS Resolver','Step 3','Turns a URL’s host name into an IP address, so the downloader can connect.'],
 ['ct',['Content','Storage'],'Content Storage','Beside step 6','Holds the HTML. Most of it on disk, because there’s too much for memory; popular content in memory, to cut delay.'],
 ['ut',['URL','Storage'],'URL Storage','Beside step 10','Keeps the URLs already visited.']];
const RK={};RING.forEach((r,k)=>RK[r[0]]=k);
function Ring(L,host,id,onTap){
  const W=320,H=300,rx=112,ry=120,cx=160,cy=165;
  const th=k=>(-90+k*360/7)*Math.PI/180;
  const HP={7:[42,24],8:[196,140],9:[180,216],10:[110,140]};
  const pos=k=>k<7?[cx+rx*Math.cos(th(k)),cy+ry*Math.sin(th(k))]:HP[k];
  let bg='<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+rx+'" ry="'+ry+'" style="fill:none;stroke:var(--line2);stroke-width:2;stroke-dasharray:5 5"/>';
  for(let k=0;k<7;k++){const t=th(k+.5),x=cx+rx*Math.cos(t),y=cy+ry*Math.sin(t),a=Math.atan2(ry*Math.cos(t),-rx*Math.sin(t))*180/Math.PI;
    bg+='<path d="M-5 -5 L6 0 L-5 5 Z" transform="translate('+x.toFixed(1)+' '+y.toFixed(1)+') rotate('+a.toFixed(1)+')" style="fill:var(--muted)"/>';}
  [[7,0],[8,1],[9,3],[10,6]].forEach(([a,b])=>{const p=pos(a),q=pos(b);bg+='<line x1="'+p[0]+'" y1="'+p[1]+'" x2="'+q[0].toFixed(1)+'" y2="'+q[1].toFixed(1)+'" style="stroke:var(--line2);stroke-width:2;stroke-dasharray:2 4"/>';});
  const btns=RING.map((r,k)=>{const p=pos(k),w=k<7?90:(k===7?76:84),h=40;
    return '<button class="rs'+(k>=7?' hp':'')+'" id="'+id+'-'+r[0]+'" data-k="'+k+'" aria-label="'+r[2].replace(/[“”]/g,'')+'" style="left:'+((p[0]-w/2)/W*100).toFixed(2)+'%;top:'+((p[1]-h/2)/H*100).toFixed(2)+'%;width:'+(w/W*100).toFixed(2)+'%;height:'+(h/H*100).toFixed(2)+'%">'+r[1].join('<br>')+'</button>';}).join('');
  host.insertAdjacentHTML('beforeend','<div class="ringw" id="'+id+'"><svg viewBox="0 0 320 300" aria-hidden="true">'+bg+'</svg>'+btns+'<svg class="rfx" viewBox="0 0 320 300" aria-hidden="true"><g id="'+id+'-fx"></g></svg></div>');
  host.querySelectorAll('#'+id+' .rs').forEach(b=>b.onclick=()=>onTap&&onTap(+b.dataset.k,b));
  const OX=40,OY=-18;let tok=null,cur=null;
  const place=(x,y)=>{if(tok)tok.setAttribute('transform','translate('+x.toFixed(1)+' '+y.toFixed(1)+')');};
  const R={
    b:k=>L.$('#'+id+'-'+RING[k][0]),
    cls(k,c,on){const b=R.b(k);if(b)b.classList.toggle(c,on!==false);},
    clear(c){host.querySelectorAll('#'+id+' .rs').forEach(b=>b.classList.remove(c));},
    put(k,label){const g=L.$('#'+id+'-fx');if(!g)return;g.innerHTML='';tok=document.createElementNS(NS,'g');
      tok.innerHTML='<circle r="12" style="fill:var(--pri);stroke:var(--card);stroke-width:2"/><text y="4" style="font:700 11px var(--sans);fill:var(--pri-ink);text-anchor:middle"></text>';
      g.appendChild(tok);R.label(label);cur=k;const p=pos(k);place(p[0]+OX,p[1]+OY);},
    label(t){if(tok)tok.querySelector('text').textContent=t;},
    hide(){const g=L.$('#'+id+'-fx');if(g)g.innerHTML='';tok=null;},
    x(k){const g=L.$('#'+id+'-fx');if(!g)return;const p=pos(k),x=p[0]+OX,y=p[1]+OY;R.hide();
      g.innerHTML='<g transform="translate('+x+' '+y+')"><circle r="12" style="fill:var(--no-strong);stroke:var(--card);stroke-width:2"/><path d="M-5 -5l10 10m0 -10l-10 10" style="stroke:var(--card);stroke-width:2.6;stroke-linecap:round"/></g>';},
    go(b,ms){return new Promise(res=>{if(!tok||!tok.isConnected){res(false);return;}
      const a=cur,t0=performance.now();ms=ms||420;
      let pa,pb;if(a===7){pa=pos(7);pb=pos(b);}
      let ta=th(a),tb=th(b);if(a<7&&tb<=ta)tb+=2*Math.PI;
      (function step(){if(!tok||!tok.isConnected){res(false);return;}
        const p=Math.min(1,(performance.now()-t0)/ms),e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
        if(a===7)place(pa[0]+(pb[0]-pa[0])*e+OX,pa[1]+(pb[1]-pa[1])*e+OY);
        else{const t=ta+(tb-ta)*e;place(cx+rx*Math.cos(t)+OX,cy+ry*Math.sin(t)+OY);}
        if(p<1){setTimeout(step,16);return;}cur=b;res(true);})();});}
  };
  return R;
}

/* ---------- 3. Napkin-math dials ---------- */
const CP=[1e7,3e7,1e8,3e8,1e9,3e9,1e10],CPL=['10 million','30 million','100 million','300 million','1 billion','3 billion','10 billion'];
const CS=[100,250,500,1000],CSL=['100 KB','250 KB','500 KB','1 MB'];
const fmtB=b=>b>=1e18?+(b/1e18).toFixed(1)+' EB':b>=1e15?+(b/1e15).toFixed(1)+' PB':b>=1e12?+(b/1e12).toFixed(1)+' TB':+(b/1e9).toFixed(1)+' GB';
const approx=n=>{if(n<100)return Math.round(n);const p=Math.pow(10,Math.floor(Math.log10(n)));return Math.round(n/p)*p;};
const nf=n=>n.toLocaleString('en-US');
function Calc(L,host,o){
  const ID=o.id;
  host.insertAdjacentHTML('beforeend',rng(ID+'p','Pages a month',0,6,o.p)+rng(ID+'s','Page size',0,3,o.s)+rng(ID+'y','Years kept',1,10,o.y)+
   '<div class="ctiles"><div id="'+ID+'t1">Pages a second<b></b></div><div id="'+ID+'t2">Peak (2 ×)<b></b></div><div id="'+ID+'t3">Storage a month<b></b></div><div id="'+ID+'t4">Storage in total<b></b></div></div><div class="math" id="'+ID+'m"></div>');
  function upd(){const p=+L.$('#'+ID+'p').value,s=+L.$('#'+ID+'s').value,y=+L.$('#'+ID+'y').value;
    L.$('#'+ID+'p-v').textContent=CPL[p];L.$('#'+ID+'s-v').textContent=CSL[s];L.$('#'+ID+'y-v').textContent=y+(y===1?' year':' years');
    const q=CP[p]/2592000,a=approx(q),mo=CP[p]*CS[s]*1e3;
    L.$('#'+ID+'t1 b').textContent='≈ '+nf(a);L.$('#'+ID+'t2 b').textContent='≈ '+nf(2*a);
    L.$('#'+ID+'t3 b').textContent=fmtB(mo);L.$('#'+ID+'t4 b').textContent=fmtB(mo*12*y);
    L.$('#'+ID+'m').innerHTML=nf(CP[p])+' ÷ 30 days ÷ 24 h ÷ 3,600 s = <b>'+nf(Math.round(q*10)/10)+'</b> a second<br>'+CPL[p]+' × '+CSL[s]+' = <b>'+fmtB(mo)+'</b> a month; × 12 × '+y+' = <b>'+fmtB(mo*12*y)+'</b>';
    o.on&&o.on({p,s,y});}
  ['p','s','y'].forEach(k=>L.$('#'+ID+k).oninput=upd);upd();
}

  id:'0003', title:'Design a web crawler', minutes:22, icon:'compass',
  goals:['Scope a crawler and size it in pages a second and storage','Trace a page through the 11-step crawl workflow','Keep a crawler polite, fast, sturdy and out of traps'],
  parts:['Scope it','The big picture','URL frontier','Downloader and traps'],
  read:'Read chapter 9 of the book for its diagrams: the full crawler design, the numbered workflow and the URL frontier’s queues.',
  glossary:{
    crawler:'Web crawler (also robot or spider): a program that downloads web pages, finds the links on them, and follows those links to more pages.',
    dns:'DNS (Domain Name System): the internet’s phone book. It turns a name like knitbymae.example into the numeric IP address a computer needs to connect.',
    fifo:'FIFO queue (first in, first out): a waiting line where items leave in the order they arrived.',
    bfs:'Breadth-first search (BFS): visit everything one link away first, then everything two links away, and so on. Depth-first search (DFS) instead follows one chain of links as deep as it goes before backing up.',
    bloom:'Bloom filter: a compact, memory-saving way to check whether an item is already in a set. It answers by probability rather than with certainty, which is why it is so fast and small.',
    robots:'robots.txt: a small file a website publishes to tell crawlers which pages they may and may not download.',
    'spider-trap':'Spider trap: a page or site that makes a crawler loop forever, for example links that keep generating new URLs.',
    hash:'Hash: a short fingerprint computed from a page’s content. Identical pages give identical hashes, so comparing hashes is far faster than comparing whole pages.',
    frontier:'URL frontier: the part of a crawler that stores the URLs still to download and decides which one comes next: front queues for priority, back queues for politeness.'
  },
  cheatsheet:[
    'Basic loop: <b>download</b> pages, <b>extract</b> their links, <b>add</b> the new links, repeat.',
    'Scope: search indexing, 1 billion HTML pages a month, keep 5 years, skip duplicates: ≈ <b>400 pages/s</b> (peak 800), <b>500 TB a month</b>, <b>30 PB</b> in 5 years.',
    'Traits of a good crawler: <b>scalability, robustness, politeness, extensibility</b>.',
    'The loop: seed URLs → URL frontier → HTML downloader (+ DNS resolver) → content parser → “Content Seen?” → URL extractor → URL filter → “URL Seen?” → back to the frontier.',
    '<b>BFS, not DFS.</b> URL frontier: <b>front queues</b> for priority, <b>back queues</b> for politeness (one host per queue, one page at a time, a delay between downloads), plus recrawls for freshness.',
    'Downloader: obey and cache <b>robots.txt</b>; speed up with a distributed crawl, a DNS cache, locality and short timeouts.',
    'Robustness: consistent hashing, saved crawl state, exception handling, data validation. Extensibility: plug-in modules.',
    'Problem content: duplicates (hashes), spider traps (max URL length, then a person checks and excludes or filters), data noise.'
  ],

    return '<g id="g11-'+k+'"><circle cx="'+n[1]+'" cy="'+n[2]+'" r="13" style="fill:var(--'+col+'-bg);stroke:var(--'+col+');stroke-width:2"/><text x="'+n[1]+'" y="'+(n[2]+4)+'" style="font:700 11px var(--sans);fill:var(--pri-ink);text-anchor:middle"></text>'+
     '<text x="'+n[1]+'" y="'+(n[2]+27)+'" style="font:500 11px var(--sans);fill:var(--ink);text-anchor:middle">'+n[0]+'</text></g>';}).join('');
  L.h(L.kick('ex','See it happen')+'<h1 class="q">Crawling walks a graph: pages are nodes, links are edges. Walk out from Mae’s home page both ways, 8 downloads each.</h1>'+
   '<svg class="gsvg" viewBox="0 0 300 232" role="img" aria-label="Link graph from Mae’s home page. One branch is quiltguild’s events calendar, a chain of month pages that never ends.">'+ed+nodes+'</svg>'+
   '<div class="ctl"><button class="btn pri" id="g11b">'+L.ic('layers')+'Breadth first (BFS)</button><button class="btn" id="g11d">'+L.ic('down')+'Depth first (DFS)</button></div>'+
   '<div class="gread" id="g11r">Colours = sites: knitbymae, quiltnook, sewlab, and quiltguild (pink), whose events calendar links month to month. ★ = a pattern page.</div><div class="cmp" id="g11c"></div>');
  function order(kind){const out=[],list=['r'];while(list.length&&out.length<8){const k=kind==='b'?list.shift():list.pop();out.push(k);const ks=KIDS[k].slice();if(kind==='d')ks.reverse();list.push(...ks);}return {out,left:list};}
  function paint(seq){Object.keys(N).forEach(k=>{const g=L.$('#g11-'+k);if(!g)return;const j=seq.indexOf(k),c=g.querySelector('circle'),t=g.querySelector('text');
    if(!c.dataset.f){c.dataset.f=c.style.fill;c.dataset.s=c.style.stroke;}
    if(j>=0){c.style.fill='var(--pri)';c.style.stroke='var(--pri)';t.textContent=j+1;}else{c.style.fill=c.dataset.f;c.style.stroke=c.dataset.s;t.textContent='';}});}
  async function go(kind){if(S.busy)return;S.busy=true;L.$('#g11b').disabled=L.$('#g11d').disabled=true;
    const {out}=order(kind),nm=kind==='b'?'BFS · FIFO queue':'DFS · stack';
    for(let j=1;j<=out.length;j++){paint(out.slice(0,j));const nx=order(kind);
      L.$('#g11r').innerHTML='<b>'+nm+'</b> · download '+j+' of 8: '+N[out[j-1]][0];await L.sleep(260);if(!L.$('#g11r'))return;}
    const pats=out.filter(k=>PAT.has(k)).length,deep=Math.max(...out.map(k=>DEP[k]));
    S.done[kind]={pats,deep};S.busy=false;L.$('#g11b').disabled=L.$('#g11d').disabled=false;
    L.$('#g11r').innerHTML='<b>'+nm+'</b>: 8 downloads, <b>'+pats+'</b> pattern page'+(pats===1?'':'s')+' found, '+deep+' link'+(deep===1?'':'s')+' deep.';
    L.$('#g11c').innerHTML=['b','d'].filter(x=>S.done[x]).map(x=>'<div><b>'+(x==='b'?'BFS':'DFS')+'</b>'+S.done[x].pats+' pattern pages<br>'+S.done[x].deep+' links deep</div>').join('');
    if(S.done.b&&S.done.d&&!S.fin){S.fin=true;
      L.sheet('info','Why crawlers use BFS','Depth-first search can go very deep: here it fell down quiltguild’s calendar and found no patterns. Crawlers use '+L.g('bfs','breadth-first search')+' with a '+L.g('fifo','FIFO queue')+'. But plain BFS has two problems. <b>Impolite:</b> most links on a page point back to the same host, so parallel downloads flood it. <b>No priority:</b> every URL is treated alike. The URL frontier fixes both.');L.done();}}
  L.$('#g11b').onclick=()=>go('b');L.$('#g11d').onclick=()=>go('d');}},
{part:2,src:'Chapter 9 · DFS vs BFS',pts:1,

{part:2,src:'Chapter 9 · Politeness',run(L){
  L.h(L.kick('learn','Politeness')+'<h1 class="q">Back queues: one site, one queue, one worker</h1>'+
   L.prose('The general idea: download <b>one page at a time from each host</b>, with a delay between downloads. Too many requests in a short time is impolite, and can even look like a denial-of-service attack. The book’s design:')+
   L.list([['Queue router','Puts each URL in the queue for its host, so every queue holds one host only.'],
     ['Mapping table','Records which host goes to which queue.'],
     ['FIFO queues b1 … bn','One queue per host.'],
     ['Queue selector','Ties each worker thread to one queue.'],
     ['Worker threads','Each downloads from its host one page at a time, with a delay between downloads.']],2)+
   L.note('On the next board, the labels “b1 knitbymae”, “b2 quiltnook” are the mapping table.','info'));
  L.done();}},
{part:2,src:'Chapter 9 · Politeness',

 run(L){

{part:2,src:'Chapter 9 · Priority',run(L){
  L.h(L.kick('learn','Priority')+'<h1 class="q">Front queues: important pages first</h1>'+
   L.prose('A random forum post about Apple products matters less than Apple’s home page, though both contain “Apple”. So a <b>prioritizer</b> scores each URL by usefulness: PageRank, website traffic, update frequency and so on.')+
   L.list([['Prioritizer','Takes URLs in and computes their priority.'],['Queues f1 … fn','Each has an assigned priority.'],['Queue selector','Picks a queue at random, with a bias toward higher priority.']],3)+
   L.flow([['star','Front queues','manage priority'],['people','Back queues','manage politeness'],['down','Workers','download pages']])+
   '<p class="small">Together, the two layers make the '+L.g('frontier','URL frontier')+'.</p>');
  L.done();}},
{part:2,src:'Chapter 9 · Priority',
 solve:async L=>{L.f16.o.ms=10;L.$('#f16r').click();await waitFor(L,()=>!L.f16.busy);L.$('#t16q').click();L.$('#f16r').click();await waitFor(L,()=>allT(L,'k16'));},
 run(L){
  const res={};

{part:2,src:'Chapter 9 · Freshness',run(L){
  L.h(L.kick('ex','Keeping it current')+'<h1 class="q">Freshness, and where the frontier lives</h1>');
  L.beats(L.card,[
   ['The problem','Pages are added, deleted and edited all the time, so a crawler must recrawl pages it already has. Recrawling every URL is slow and costly.'],
   ['Two strategies','Recrawl based on each page’s <b>update history</b>, and recrawl <b>important pages first and more often</b>. Mae posts a new pattern every week, so knitbymae.example comes round often; a site unchanged for years, rarely.'],
   ['Storage','A real search crawl’s frontier can hold hundreds of millions of URLs. All in memory is neither durable nor scalable; all on disk is too slow. The book’s hybrid: most URLs on disk, with <b>memory buffers</b> for adding and removing, written to disk now and then.']],
   'The frontier balances priority (front queues), politeness (back queues) and freshness (recrawls), with its storage split between disk and memory.');}},
{part:2,src:'Chapter 9 · URL frontier',
 solve:async L=>{for(let k=0;k<4;k++){L.$('#e18p'+k).click();await L.sleep(20);L.f18.o.ms=8;await waitFor(L,()=>L.$('#e18fx')&&!L.$('#e18fx').disabled);L.f18.o.ms=8;L.$('#e18fx').click();await L.sleep(20);await waitFor(L,()=>L.$('#e18p'+k).classList.contains('ok'));}},
 run(L){
  const P=[
   {nm:'One site floods it',hosts:'MQS',urls:'MMMMMMMMMMMMQQSS'.split(''),base:{polite:false},fix:{polite:true},fixNm:'back queues on',show:{},
    bad:r=>'With no back queues, knitbymae.example took <b>'+r.peaks.M+' requests in 2 s</b>.',
    good:r=>'With back queues it never got more than '+r.peaks.M+'. <b>The limit:</b> once quiltnook and sewlab were done, three workers sat idle and Mae’s pages trickled in one every 2 s. When one site fills the frontier, politeness makes the crawl slow.'},
   {nm:'A server never answers',hosts:'MQS',urls:['M','M','M','Q','Q','Q','S!','S','S','S'],base:{polite:true},fix:{timeout:true},fixNm:'short timeout (2 s)',show:{slow:true},
    bad:r=>'sewlab.example’s /classes page (dashed) never answered. Its worker waited the whole time, so sewlab’s other pages were never fetched: <b>'+r.got.S+' of 3</b>.',
    good:r=>'After 2 s with no answer, the worker gave up and fetched sewlab’s other <b>'+r.got.S+'</b> pages. The book’s rule: set a maximal wait time, then crawl other pages.'},
   {nm:'robots.txt says “not /drafts/”',hosts:'MQ',urls:['M','Md','M','Md','M','Md','Q','Q'],base:{polite:true},fix:{robots:true},fixNm:'check robots.txt first',show:{robots:true},
    bad:r=>'Mae’s '+L.g('robots','robots.txt')+' asks crawlers to stay out of /drafts/ (red dashed), but Pattern Finder never read it: <b>'+r.bad+' draft pages fetched</b>.',
    good:r=>'Pattern Finder read robots.txt before crawling the site, cached it, and skipped <b>'+r.skipped+'</b> draft pages. Back queues alone can’t do this: they control how often, not what.'},
   {nm:'A spider trap',hosts:'GMQ',urls:['G','M','M','M','Q','Q','Q'],base:{polite:true},fix:{exclude:'G'},fixNm:'exclude quiltguild (after a person checks)',show:{trap:true},
    bad:r=>'Every quiltguild calendar page links to the next month, so its queue never empties: <b>'+r.got.G+' pages</b> by the end of the run, and still going. Back queues kept the other sites polite, but one worker is stuck in the trap forever.',
    good:r=>'A person spotted quiltguild’s endless page count, confirmed the trap and excluded the site at the URL filter. Now the crawl finishes. You’ll tune trap defences yourself in part 4.'}];
  let cur=-1;
  L.h(L.kick('pr','Edge cases')+'<h1 class="q">Break the frontier four ways. Each case runs once as it is, then once with its fix.</h1>'+
   '<div class="ctl" id="e18c">'+P.map((p,k)=>'<button class="chip" id="e18p'+k+'">'+p.nm+'</button>').join('')+'</div>'+
   '<div id="e18f"></div><div id="e18x"></div><div id="e18h"></div>');
  async function load(k){if(L.f18&&L.f18.busy)return;cur=k;const p=P[k];
    P.forEach((_,j)=>L.$('#e18p'+j).classList.toggle('sel',j===k));
    L.$('#e18h').innerHTML='';L.$('#e18x').innerHTML='<div class="ctl"><button class="btn pri" id="e18fx" disabled>'+L.ic('shield')+'Run again with '+p.fixNm+'</button></div>';
    L.$('#e18f').innerHTML='';const F=L.f18=Frontier(L,L.$('#e18f'),Object.assign({id:'f18',hosts:p.hosts,urls:p.urls,lanes:4,delay:1,maxT:12,ms:170,show:p.show,foot:'; delay 1 s.'},p.base));
    const r=await F.run();if(!r||cur!==k)return;
    L.$('#e18h').innerHTML='<div class="fb no">'+p.bad(r)+'</div>';L.$('#e18fx').disabled=false;
    L.$('#e18fx').onclick=async function(){if(F.busy)return;this.disabled=true;Object.assign(F.o,p.fix);const r2=await F.run();if(!r2||cur!==k)return;
      L.$('#e18h').insertAdjacentHTML('beforeend','<div class="fb ok">'+p.good(r2)+'</div>');L.$('#e18p'+k).classList.add('ok');
      if(P.every((_,j)=>L.$('#e18p'+j).classList.contains('ok'))&&!L.$('#e18ok')){L.card.insertAdjacentHTML('beforeend','<span id="e18ok"></span>');
        L.sheet('info','Where the frontier stops protecting you','Back queues fix <b>how often</b> you hit a site. They don’t fix a site that never answers (that needs a timeout), pages a site asked you not to fetch (robots.txt) or a site that never ends (trap defences). And when one site dominates, politeness costs speed.');L.done();}};}
  P.forEach((_,k)=>L.$('#e18p'+k).onclick=()=>load(k));}},
{part:2,src:'Chapter 9 · URL frontier',pts:1,
 solve:async L=>{L.f19.o.ms=5;L.$('#t19p').click();L.$('#t19q').click();setR(L,'w19',6);setR(L,'d19',1);L.$('#f19r').click();await waitFor(L,()=>L.$('#f19ok'),600);},
 run(L){
  let first=true;
  const urls=[];for(const h of 'MQSYTB'){for(let i=0;i<7;i++)urls.push(h);urls.push(h+'*');}
  L.h(L.kick('pr','Challenge')+'<h1 class="q">Tamsin’s challenge: six makers’ sites, 8 pages each, and each site’s ★ important page arrives last. Set up the frontier to pass all three checks.</h1>'+
   '<div class="ctl">'+tog('t19p','Back queues',false)+tog('t19q','Priority',false)+'</div>'+rng('w19','Workers',1,8,2)+rng('d19','Delay per site',0,3,0)+
   tasks('k19',['No site gets more than 1 request in any 2 s','All 6 ★ pages fetched by t = 6 s','All 48 pages fetched by t = 20 s'])+
   '<p class="small" style="margin:4px 0 0">Targets are <span class="ill">illustrative</span>. With back queues on, each worker has its own back queue.</p>'+
   '<div class="ctl"><button class="btn pri" id="f19r">'+L.ic('play')+'Run the crawl</button></div><div id="f19"></div>');
  const F=L.f19=Frontier(L,L.$('#f19'),{id:'f19',hosts:'MQSYTB',urls,polite:false,prio:false,delay:0,lanes:2,maxT:26,ms:150});
  const sync=()=>{F.o.lanes=+L.$('#w19').value;F.o.delay=+L.$('#d19').value;L.$('#w19-v').textContent=F.o.lanes;L.$('#d19-v').textContent=F.o.delay+' s';F.reset();
    L.$$('#k19 li').forEach(li=>{li.classList.remove('done','bad');li.querySelector('.bx').innerHTML='';});};
  L.$('#w19').oninput=L.$('#d19').oninput=()=>{if(!F.busy)sync();};
  L.$('#t19p').onclick=function(){if(F.busy)return;F.o.polite=!F.o.polite;setTog(this,F.o.polite);sync();};
  L.$('#t19q').onclick=function(){if(F.busy)return;F.o.prio=!F.o.prio;setTog(this,F.o.prio);sync();};
  sync();
  L.$('#f19r').onclick=async()=>{if(F.busy)return;sync();const r=await F.run();if(!r)return;
    const ok=[r.peak<=1,r.starsDone===6&&r.lastStar<=6,r.total===48&&r.t<=20];
    ok.forEach((v,k)=>{const li=L.$('#k19 li[data-k="'+k+'"]');li.classList.add(v?'done':'bad');li.querySelector('.bx').innerHTML=v?L.ic('check'):'';});
    const pass=ok.every(Boolean);if(first){first=false;L.award(pass);}
    if(pass){L.card.insertAdjacentHTML('beforeend','<span id="f19ok"></span>');
      L.sheet('ok','All three checks pass','Back queues plus a 1 s delay kept every site polite. One worker per site ('+F.o.lanes+') kept six sites crawling in parallel, and priority let the ★ pages jump the line. A 2 s delay is politer but misses 20 s; with 5 workers, one site waits for a free queue.');L.done();}
    else{const h=[];if(!ok[0])h.push('a site went over the line: turn on back queues and add a delay');if(!ok[1])h.push('the ★ pages came late: let the prioritizer rank them');if(!ok[2])h.push('the crawl was too slow: give every site its own worker, and don’t make the delay longer than you need');
      L.sheet('no','Not yet','Fix this: '+h.join('; ')+'. Change the settings and run again.');}};}},

{part:3,src:'Chapter 9 · HTML Downloader',run(L){
  L.h(L.kick('learn','The downloader')+'<h1 class="q">Ask first, then go fast</h1>'+
   L.prose(L.g('robots','robots.txt')+', the Robots Exclusion Protocol, is how a website tells crawlers which pages they may download. Check it before crawling a site and follow its rules. Cache it and refresh it now and then, so you don’t download it for every page. Mae’s might say:')+
   '<div class="robots">User-agent: *\nDisallow: /drafts/</div>'+
   L.list([['Distributed crawl','Spread jobs over many servers, each running many threads and each responsible for part of the URL space.'],
     ['Cache DNS','A '+L.g('dns','DNS')+' lookup takes 10 to 200 ms and can block other threads while it runs. Keep your own name-to-IP cache, refreshed by scheduled jobs.'],
     ['Locality','Put crawl servers near the websites they fetch, so downloads are faster.'],
     ['Short timeout','If a host doesn’t answer within a set time, stop and crawl other pages.']],1)+
   L.note('<b>Beyond the book:</b> robots.txt is a convention. Polite crawlers obey it, but it doesn’t lock anything.','info'));
  L.done();}},
{part:3,src:'Chapter 9 · Robustness',pts:1,run(L){
  L.h(L.kick('learn','Robustness and extensibility')+'<h1 class="q">Survive failures, and grow by plugging in</h1>'+
   L.lanes([['shield','Robustness','<b>'+L.g('consistent-hashing','Consistent hashing')+'</b> spreads load across downloaders and lets you add or remove one. <b>Save crawl state and data</b> so a disrupted crawl restarts easily. <b>Handle exceptions</b> without crashing. <b>Validate data</b> to prevent errors.',2],
            ['box','Extensibility','New content types plug in as modules. The book’s examples: a <b>PNG Downloader</b> module for images, and a <b>Web Monitor</b> module that watches for copyright and trademark infringement.',3]])+
   '<div id="lq"><h2 class="sub">A Pattern Finder downloader crashes mid-crawl. Obi wants it back where it stopped. What makes that possible?</h2></div>');
  L.mc(L.$('#lq'),['A new PNG Downloader module','Saved crawl state and data'],1,
   'Crawl state and data written to storage are reloaded to restart the crawl.',
   'A module adds a content type; it doesn’t help with a crash. Saved crawl state and data let the crawl restart.');}},
{part:3,src:'Chapter 9 · Detect and avoid problematic content',run(L){
  L.h(L.kick('learn','Problem content')+'<h1 class="q">Duplicates, traps and noise</h1>'+
   L.list([['Redundant content','Nearly 30% of pages are duplicates. Hashes or checksums detect them.'],
     ['Spider traps','A '+L.g('spider-trap','spider trap')+' keeps a crawler looping forever, like an endlessly deep path: /foo/bar/foo/bar/… A maximum URL length helps, but no single fix catches every trap. Trap sites stand out by having an unusually large number of pages; a person can verify one, then exclude the site or add a custom URL filter.'],
     ['Data noise','Ads, code snippets and spam URLs add little or no value. Exclude them where you can.']],4));

{part:3,src:'Chapter 9 · Spider traps',pts:1,
 solve:async L=>{setR(L,'t23c',90);L.$('#t23x-G').click();L.$('#t23go').click();await waitFor(L,()=>L.$('#t23ok'));},
 run(L){
  const REAL=['knitbymae.example/patterns/socks/toe-up-socks-afterthought-heel','quiltnook.example/patterns/free/star-block-quilt-with-cutting-chart-and-fabric-list','sewlab.example/patterns/apron'];
  const TRAP=[];for(let k=0;k<10;k++)TRAP.push('sewlab.example/tips/tools'+'/tips/tools'.repeat(k));
  const CAL='quiltguild.example/events/2027/01';
  const SITES=[['M','knitbymae.example',42],['Q','quiltnook.example',55],['S','sewlab.example',31],['G','quiltguild.example',4800]];
  const ex={};let first=true;
  const maxReal=Math.max(...REAL.map(u=>u.length));
  L.h(L.kick('pr','Challenge')+'<h1 class="q">Lior’s trap hunt: after an hour, two of Pattern Finder’s four sites are traps. Stop both without losing a single real pattern page.</h1>'+
   rng('t23c','Max URL length',30,200,200,5)+
   '<svg class="gsvg" id="t23s" viewBox="0 0 300 254" role="img" aria-label="URL lengths: three real pattern pages, sewlab’s growing trap URLs, and quiltguild’s calendar URLs, against the length cap."></svg>'+
   '<div class="gread" id="t23r"></div>'+
   '<div class="sitet"><div class="small" style="font-weight:600">Pages found per site after an hour</div>'+SITES.map(s=>'<div class="srow"><span class="tk '+HOST[s[0]][1]+'">'+s[0]+'</span><span class="sn">'+s[1]+'</span><span class="sc'+(s[2]>1000?' big':'')+'" id="t23n-'+s[0]+'"></span><button class="chip" id="t23x-'+s[0]+'" aria-pressed="false">Exclude</button></div>').join('')+'</div>'+
   '<p class="small" style="margin:6px 0 0">Page counts are <span class="ill">illustrative</span>.</p>'+
   '<div class="ctl"><button class="btn pri" id="t23go">'+L.ic('check')+'Check my defences</button></div>');
  const X=n=>4+Math.min(n,200)/200*290;
  function draw(){const cap=+L.$('#t23c').value,on=cap<200;L.$('#t23c-v').textContent=on?cap+' chars':'no cap';
    let s='',y=12;const segs=[];let y0=0;const grp=(t)=>{if(y0)segs.push([y0,y-12]);s+='<text x="4" y="'+y+'" style="font:600 11px var(--sans);fill:var(--muted)">'+t+'</text>';y+=6;y0=y-2;};
    const bar=(len,col,cut,txt)=>{s+='<rect x="4" y="'+y+'" width="'+(X(len)-4).toFixed(1)+'" height="8" rx="3" style="fill:var(--'+(cut?'line2':col)+')'+(cut?';opacity:.7':'')+'"/>';if(txt)s+='<text x="'+(X(len)+4)+'" y="'+(y+8)+'" style="font:600 11px var(--sans);fill:var(--'+(cut?'no':'muted')+')">'+txt+'</text>';y+=11;};
    grp('Real pattern pages (longest: '+maxReal+' chars)');REAL.forEach(u=>{const cut=(on&&u.length>cap)||ex[u[0]==='k'?'M':u[0]==='q'?'Q':'S'];bar(u.length,'ok-strong',cut,cut?'lost':'');});y+=16;
    grp('sewlab: broken link adds /tips/tools each page');TRAP.forEach((u,k)=>{const cut=(on&&u.length>cap)||ex.S;bar(u.length,'h3',cut,k===9?(on||ex.S?'':'… forever'):'');});y+=16;
    grp('quiltguild: calendar, next month forever');for(let k=0;k<4;k++)bar(CAL.length,'h4',ex.G,k===3?(ex.G?'excluded':'… 4,800 and counting'):'');
    segs.push([y0,y+1]);if(on)s=segs.map(g=>'<line x1="'+X(cap)+'" y1="'+g[0]+'" x2="'+X(cap)+'" y2="'+g[1]+'" style="stroke:var(--no);stroke-width:2;stroke-dasharray:4 3"/>').join('')+s;
    L.$('#t23s').innerHTML=s;
    const lost=REAL.filter(u=>on&&u.length>cap).length,trapN=ex.S?0:on?TRAP.filter(u=>u.length<=cap).length:null;
    L.$('#t23r').innerHTML='Real pages lost to the cap: <b>'+lost+'</b><br>sewlab trap pages crawled: <b>'+(ex.S?'none (site excluded)':trapN===null?'endless':trapN+', then the cap stops it')+'</b><br>quiltguild: <b>'+(ex.G?'excluded':(on?'cap doesn’t touch it (33 chars)':'endless'))+'</b>';
    SITES.forEach(t=>{L.$('#t23n-'+t[0]).textContent=ex[t[0]]?'excluded':nf(t[2])+(t[0]==='S'?' + trap':'');});}
  L.$('#t23c').oninput=draw;
  SITES.forEach(t=>{L.$('#t23x-'+t[0]).onclick=function(){ex[t[0]]=!ex[t[0]];this.classList.toggle('sel',ex[t[0]]);this.setAttribute('aria-pressed',ex[t[0]]);this.textContent=ex[t[0]]?'Excluded':'Exclude';draw();};});
  draw();
  L.$('#t23go').onclick=()=>{const cap=+L.$('#t23c').value,on=cap<200,lost=REAL.filter(u=>on&&u.length>cap).length,goodEx=['M','Q','S'].filter(h=>ex[h]);
    const pass=on&&!lost&&!goodEx.length&&ex.G;if(first){first=false;L.award(pass);}
    if(pass){if(!L.$('#t23ok'))L.card.insertAdjacentHTML('beforeend','<span id="t23ok"></span>');
      L.sheet('ok','Both traps stopped','A cap of '+cap+' characters ends sewlab’s endlessly deep path after a few pages and keeps every real page (the longest is '+maxReal+'). The calendar’s URLs never get longer, so no cap catches it; its unusually large page count gave it away, and a person excluded it. No single fix catches every trap.');L.done();return;}
    const h=[];if(!on)h.push('With no length cap, sewlab’s path grows forever.');if(lost)h.push('A cap of '+cap+' cuts '+lost+' real pattern page'+(lost>1?'s':'')+': the longest real URL is '+maxReal+' characters.');
    if(goodEx.length)h.push('Excluding '+goodEx.map(k=>HOST[k][0]).join(' and ')+' throws away real patterns. Exclude only a site a person confirmed is a trap.');
    if(!ex.G)h.push('quiltguild’s calendar URLs stay 33 characters long, so no cap catches them. Its page count is the giveaway.');
    L.sheet('no','Not yet',h.join(' ')+' Adjust and check again.');};}},
{part:3,src:'Chapter 9 · Step 4 - Wrap up',run(L){
  L.h(L.kick('learn','If time remains')+'<h1 class="q">Talking points the book leaves for the end</h1>'+
   L.list([['play','Server-side rendering','Many sites build links on the fly with JavaScript or AJAX. Render the page first (also called dynamic rendering), then parse it, or those links stay hidden.'],
     ['x','Filter out unwanted pages','Storage and crawl capacity are limited, so an anti-spam component weeds out low-quality and spam pages.'],
     ['box','Database replication and sharding','To make the data layer available, scalable and reliable.'],
     ['layers','Horizontal scaling','A large crawl needs hundreds or thousands of download servers. The key is keeping them '+L.g('stateless','stateless')+'.'],
     ['trend','Availability, consistency, reliability and analytics','Core to any large system; collecting and analysing data helps fine-tune it.']],3));
  L.done();}},
{part:3,src:'Chapter 9 · Step 3 - Design deep dive',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which fix fits?',['Cache DNS lookups','Set a short timeout','Obey robots.txt','Cap the URL length','Render the page first'],[
   ['Threads sit idle waiting on name lookups for the same hosts, again and again.',0,'Keep a name-to-IP cache so threads stop waiting on DNS.'],
   ['One site never answers, and a worker waits on it forever.',1,'Give up after a set time and crawl other pages.'],
   ['A maker’s site asks crawlers to stay out of its /drafts/ folder.',2,'That request lives in robots.txt, which a polite crawler checks first.'],
   ['Links like /patterns/a/b/a/b/a/b/… keep getting longer.',3,'An endlessly deep path is exactly what a maximum URL length catches.'],
   ['A pattern shop builds its links with JavaScript, and the parser finds none.',4,'Server-side rendering runs the scripts first, so the links appear.']]);}}
  ]
});
