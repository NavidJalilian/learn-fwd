<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Art of Listening</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0009', title:'The art of listening', minutes:20, icon:'eye',
  goals:['Explain why a client must <i>feel</i> listened to before your advice will land','Avoid the two common mistakes: listening only for facts, and listening too passively','Let the client set the story, open meetings with a shared agenda, and spot poor listening habits'],
  parts:['Earning the right','Two mistakes','The story','Habits'],
  read:'Read chapter 11 of the book for Jim Copeland’s full story and the complete lists of what good listeners do and don’t do.',
  glossary:{
   'acknowledgment':'Acknowledgment: the small signals (a word, a nod, a tone of voice) that tell a speaker they are being heard and understood.',
   'agenda-setting':'Agenda-setting discussion: a short talk at the start of a meeting about what it should cover, so the plan is shared rather than owned by one side.'
  },
  cheatsheet:[
    'Listening <b>earns the right</b> to advise. Skip it and your answer sounds arrogant, however correct it is.',
    'It’s not enough to listen. The client must <b>feel</b> listened to: respected, understood and involved.',
    'Mistake 1, <b>overly rational</b>: hearing only the facts. Even “just the facts” clients want someone who cares about them.',
    'Mistake 2, <b>overly passive</b>: a flat “mm-hmm”. If the message carries feeling, your acknowledgment must too.',
    'Let the client <b>set the sequence</b>. Don’t interrupt, rearrange or force your own list onto their story.',
    'Three ways to listen: <b>reflective</b> (play it back), <b>supportive</b> (show empathy), <b>for possibility</b> (ask what they’ve thought of doing).',
    'Open every meeting by <b>discussing the agenda</b>, even for a minute, so it belongs to both of you.',
    'Don’t interrupt, match their story with yours, judge, or rush to solve.'
  ],
  steps:[
/* ---------- PART 1: EARNING THE RIGHT ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">You tell a colleague your project is in trouble. They say “mm-hmm” while typing an email, then offer a fix. How do you feel about the fix?</h1>');
  L.mc(L.card,['Doubtful: they didn’t really hear the problem','Grateful: a quick answer saves me time'],0,
   'Even if the fix is right, you doubt it, because you don’t believe they understood. This lesson is about earning that belief first.',
   'Most people feel brushed off, and they doubt advice from someone who wasn’t really listening. A correct answer isn’t enough on its own.');}},
{part:0,src:'Chapter 11 · The Art of Listening',run(L){
  L.h(L.kick('learn','Why listening comes first')+'<h1 class="q">You have to earn the right to advise</h1>'+
   L.prose('The book opens with a CEO praising his lawyer for one thing above all: listening better than anyone else. The authors say every effective '+L.g('trusted-advisor','trusted advisor')+' they know is a very good listener.')+
   L.flow([['pointer','1 · Engage','',''],['eye','2 · Listen','you are here','',2],['bulb','3 · Frame','','']])+
   L.prose('Listening is the second of the '+L.g('five-stages','five stages')+'. It is how you '+L.g('earn-the-right','earn the right')+' to comment on the client’s problems. Listening alone won’t make you a trusted advisor, but you can’t become one without it.')+
   L.note('Two warnings from the book: you must <b>be seen</b> to listen, not just listen. And jumping straight to the answer before earning the right usually comes across as <b>arrogance</b>.','alert'));
  L.done();}},
{part:0,src:'Chapter 11 · Listening: Earning the Right',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">How five minutes of listening started a relationship that lasted years</h1>');
  L.beats(L.card,[
   ['The setting','Jim Copeland, later CEO of Deloitte & Touche, meets the CEO of a client his firm inherited in a merger. The CEO is angry about having to “train” a whole new accounting firm.'],
   ['The attack','The CEO comes in strong, wanting to show who’s in charge. Copeland doesn’t fight it.'],
   ['The move','Instead he keeps asking the CEO to tell him more: about the problem, how it happened, what is going on. He wants to know why the CEO is upset and what it would take to fix things.'],
   ['The result','That listening earns Copeland the right to everything that follows: showing his firm’s quality, solving problems, offering other services.'],
   ['Years later','At the end of a big pitch, the CEO turns to Copeland and asks if <i>he personally</i> thinks the CEO should do it. He trusts Copeland to say no if no were the honest answer.']],
   'Copeland didn’t win the CEO over with credentials. He won him over by being there for him and finding out what was really going on.');}},
{part:0,src:'Chapter 11 · Listening: Earning the Right',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Dana calls Noor, upset that Felix wants the closures done “by Friday.” What earns Noor the right to advise?</h1>');
  L.mc(L.card,['Quoting the exact legal timeline for consultation','Asking Dana what happened and what worries them','Reassuring Dana that Larkmoor has done this before'],1,
   'Like Copeland, Noor first finds out what’s going on and why Dana is upset. The legal timeline will matter, after Dana feels heard.',
   'The timeline and the track record may both be true, but they come before Dana feels heard. Asking what happened and what worries Dana is what earns the right.');}},
{part:0,src:'Chapter 11 · Listening: Earning the Right',run(L){
  L.h(L.kick('learn','Being listened to')+'<h1 class="q">Why does feeling heard matter so much?</h1>'+
   L.prose('It isn’t only so you get the facts right. The book says our wish to be heard comes from deeper needs:')+
   L.list([['star','Respect','The client wants to be taken seriously as a capable person.'],
     ['people','Empathy','The client wants you to understand how this feels, not just what happened.'],
     ['pointer','Involvement','The client wants to stay part of the thinking, not be handed a verdict.']],1)+
   L.prose('So a trusted advisor always protects the client’s self-esteem. One way: start with what you genuinely like about the client’s idea, then ask for help seeing how it gets you both to the goal. The client feels respected, and you can still talk frankly about the idea.'));
  L.done();}},
{part:0,src:'Chapter 11 · Listening: Earning the Right',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Dana suggests closing the shops in stages over a year. Noor sees problems with it. Tap each piece to build a reply that protects Dana’s self-esteem.</h1>');
  L.sentence(L.card,[['That won’t work, because','What I like about it is','Legally speaking,'],['staff get time to plan','it’s too slow for Felix','the dates are flexible'],['so let’s drop it.','so I’ll draft it as is.','so help me see how it fits Felix’s deadline.']],[1,0,2],
   [['Leading with “won’t work” tells Dana their idea is wrong before you’ve even explored it.','Starting with the law skips straight past Dana’s idea.'],['That’s a criticism, not something you like about the idea.','That’s a legal note, not what’s good about Dana’s thinking.'],['Dropping it ends the talk and leaves Dana out.','Drafting it as is avoids the real question, so Dana never hears your concern.']],
   'Noor names what’s genuinely good, then invites Dana to work through the problem together. Dana feels respected, and the hard question (Felix’s deadline) is still on the table.');}},

/* ---------- PART 2: TWO MISTAKES ---------- */
{part:1,src:'Chapter 11 · Overly Rational Listening',run(L){
  L.h(L.kick('learn','Mistake 1')+'<h1 class="q">Overly rational listening: hearing only the facts</h1>'+
   L.prose('“Earning the right” can sound like a rational process, like sending a CV to get an interview. The book says those formal steps only imitate the real thing. Listening to earn the right is <b>emotional as well as rational</b>.')+
   L.lanes([['list','What the client says','“I want results and answers. Skip the soft listening stuff.”',3],
            ['eye','What the client also wants','To look someone in the eye and know they care, and won’t let anything slide that’s wrong for them.',2]])+
   L.prose('The authors ask: is that really soft? Their answer is no. Nearly every client wants that, even the ones who say they don’t.'));
  L.done();}},
{part:1,src:'Chapter 11 · Overly Rational Listening',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Felix tells Noor: “Spare me the listening. Just tell me if this plan is legal.” What does the book suggest Felix also wants?</h1>');
  L.mc(L.card,['Only the yes or no, and nothing else','Someone Felix can trust to say if it’s wrong for Corran','A longer written report with all the detail'],1,
   'Even “just the facts” clients want to know you care and won’t let things slide that are wrong for them. Noor can be brief and still show that.',
   'The book’s point is that hard-headed clients still want someone who cares about them. That doesn’t mean more words or only the verdict. It means someone who won’t let anything wrong for them slide.');}},
{part:1,src:'Chapter 11 · Overly Passive Listening',run(L){
  L.h(L.kick('learn','Mistake 2')+'<h1 class="q">Overly passive listening: the blank “mm-hmm”</h1>'+
   L.prose('Good listening is <b>active</b>. In a conversation we need regular '+L.g('acknowledgment','acknowledgment')+' that we’re being heard. Without it, we either demand it or stop talking.')+
   L.prose('What kind of acknowledgment? It depends on the message:')+
   L.tiers([['book','Purely rational message','A senior lawyer explaining fine points to an associate. A nod and an occasional “mm-hmm” is enough.'],
            ['flame','Any emotional flavor (most messages)','Your words and tone need some feeling too. A flat “mm-hmm” says only the facts matter.','',true,'Most common']])+
   L.prose('A client who says “we handle 300,000 transactions a day” has a feeling about that number: pride, boredom, embarrassment. The book says this emotional data is just as valid as the rational data.'));
  L.done();}},
{part:1,src:'Chapter 11 · Overly Passive Listening',pts:1,
 solve:async L=>{const c=L.$('#rp').children;c[0].click();c[1].click();c[2].click();},
 run(L){
  const R=[['“Mm-hmm.”','Dana’s voice goes flat. “Anyway. Can you send the letters?” The conversation ends there.','no'],
           ['“Is the list based on the selection rules you sent?”','Dana answers the question, briefly. Accurate, but Dana still feels alone with it.','info'],
           ['“Three weeks with that list. That must weigh on you.”','Dana exhales. “It does. Some of them I hired myself.” Then Dana tells Noor about Gail.','ok']];
  const seen=new Set();
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Dana says: “I’ve had sixty names on a spreadsheet for three weeks.” Try each reply and watch how Dana responds.</h1><div id="rp"></div><div id="rr" style="background:var(--soft);border-radius:16px;padding:14px;margin:8px 0 6px;min-height:90px"><span class="small">Pick a reply above.</span></div><div id="rq"></div>');
  R.forEach((r,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=r[0];b.onclick=()=>{[...L.$('#rp').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(j);
    L.$('#rr').innerHTML='<b>'+r[0]+'</b><br><span style="color:var(--'+(r[2]==='ok'?'ok':r[2]==='no'?'no':'ink')+')">'+r[1]+'</span>';
    if(seen.size===3&&!L.$('#rq').innerHTML){const q=L.$('#rq');q.innerHTML='<h2 class="sub">Why did the third reply open Dana up?</h2>';
      L.mc(q,['It acknowledged the feeling behind the fact','It asked a sharper legal question'],0,
       'Dana’s message carried feeling. Matching it told Dana that Noor was really listening, and more of the story came out.',
       'The second reply was the legal question, and it got a short answer. The third worked because it acknowledged how the fact feels.');}};L.$('#rp').appendChild(b);});}},
{part:1,src:'Chapter 11 · Overly Passive Listening',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Is a nod and “mm-hmm” enough here?',['A nod is enough','Acknowledge the feeling'],[
   ['Ines walks Noor through the steps of a consultation timeline.',0,'A purely rational message between colleagues. A nod tells Ines to keep going.'],
   ['Dana says Felix copied the board on an email criticizing Dana’s plan.',1,'That carries embarrassment and worry. A flat “mm-hmm” would say it doesn’t matter.'],
   ['Gail mentions, voice tight, having opened the Harbor Street shop years ago.',1,'The tone tells you this is personal. Acknowledge it.'],
   ['Corran’s payroll manager reads out the notice periods for each contract type.',0,'Plain facts, no emotional flavor. A nod is fine.']]);}},
{part:1,src:'Chapter 11 · Overly Passive Listening',pts:1,run(L){
  L.h(L.kick('pr','When a reaction is essential')+'<h1 class="q">Felix tells Noor that a former manager has taken Corran’s recipes to a rival bakery. Which reply fits?</h1>');
  L.mc(L.card,['“Mm-hmm. Do you have a copy of the contract?”','“Okay. These cases are quite common, actually.”','“You must be furious. There’s no instant fix, but let’s look.”'],2,
   'The book says some moments demand a real reaction, not just “mm-hmm”. Name the feeling, be honest that there’s no magic button, then get to work.',
   'The contract will matter, and the case may be common, but Felix just felt betrayed. A reply that skips that tells Felix only the facts count. Name the feeling first.');}},

/* ---------- PART 3: THE STORY ---------- */
{part:2,src:'Chapter 11 · Listening to the Sequence',run(L){
  L.h(L.kick('learn','Listen to the sequence')+'<h1 class="q">Let the speaker tell the story their way</h1>'+
   L.prose('Listening takes discipline. The authors’ informal quizzes suggest most business people can focus for only <b>30 to 60 seconds</b> before an unrelated thought pops up.')+
   L.flow([['play','Beginning','setup'],['flame','Middle','tension'],['check','End','resolution']])+
   L.prose('When we talk, we tell some version of a story. If the listener interrupts, rearranges it or imposes their own storyline, the meaning gets lost. Jumping to conclusions and getting things out of order are all forms of not “getting it.”')+
   L.note('If you impose your own structure, you hear your own meaning laid over the speaker’s, not theirs.','info'));
  L.done();}},
{part:2,src:'Chapter 11 · Listening to the Sequence',run(L){
  L.h(L.kick('ex','Two examples')+'<h1 class="q">What forcing your own structure costs you</h1>');
  L.beats(L.card,[
   ['An old joke','The book retells a joke about a lawyer cross-examining a coroner with a script of yes/no questions: no pulse checked, no heartbeat checked. The lawyer goes for the kill, and the coroner’s answer makes the lawyer look foolish. The script never asked the one thing that mattered.'],
   ['The “top three” trap','Ask a client for their “top three issues” and you’ll get three. You may miss that one barely matters, and that left to themselves they’d only have named two.'],
   ['At Corran','Noor opens with a checklist: dates, headcount, contracts, notice. Dana answers each one. Noor leaves with clean notes.'],
   ['What was missed','Dana never got to tell the story in their own order, which would have started with Gail threatening to go to the local paper.']],
   'Let the speaker set the structure, and stay with it until they’re satisfied you’ve understood. The same goes for job interviews, fact-finding and especially sales meetings.');}},
{part:2,src:'Chapter 11 · Listening to the Sequence',run(L){
  L.h(L.kick('learn','Three ways to listen')+'<h1 class="q">Play it back, support, then open possibilities</h1>'+
   L.prose('The book borrows three kinds of listening from the Ariel Group, a theater-based training firm:')+
   L.list([['eye','Reflective listening','Shows you’ve understood the message and the feelings tied to it. “So, if I’ve got this right…”'],
     ['people','Supportive listening','Shows empathy: you see why they feel this way and you’ll help them feel at ease with it. “That sounds really hard.”'],
     ['bulb','Listening for possibility','Shows insight, hinting that a path forward may exist. “What have you thought about doing?”']],2));
  L.done();}},
{part:2,src:'Chapter 11 · Listening to the Sequence',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Noor says to Dana: “It sounds like you’re stuck between Felix’s deadline and Gail’s staff.” Which kind of listening is this?</h1>');
  L.mc(L.card,['Supportive listening','Listening for possibility','Reflective listening'],2,
   'Noor plays the message back so Dana knows it landed. That’s reflective listening.',
   'Noor isn’t mainly showing empathy or asking about a way forward. They’re playing back what they heard: reflective listening.');}},
{part:2,src:'Chapter 11 · Listening to the Sequence',pts:1,run(L){
  L.h(L.kick('pr','Put in order')+'<h1 class="q">Gail tells Noor the closures will wreck morale in the town. Put Noor’s replies in the order the three kinds of listening are listed.</h1>');
  L.order(L.card,['“So your worry is less the law and more how the town will see this.”','“After twenty years building those shops, this must be painful.”','“What do you think would make it easier for the staff?”'],
   'Play it back first, then show empathy, then invite Gail to think about what could help. Gail feels understood before being asked to look forward.',['Reflective','Supportive','Possibility']);}},
{part:2,src:'Chapter 11 · Listening to the Sequence',pts:1,run(L){
  L.h(L.kick('pr','First meeting')+'<h1 class="q">Noor meets Sasha Moreno, Brightwell’s COO, for the first time. Which opening question best lets Sasha set the story?</h1>');
  L.mc(L.card,['“What are your top three employment law issues?”','“What led you to look for a new law firm?”','“Would you like our standard onboarding plan?”'],1,
   'An open question lets Sasha tell the story in their own order, including the bad experience with the last firm.',
   'A “top three” question forces Sasha into Noor’s structure, and a ready-made plan answers a question Sasha never asked. An open question lets Sasha tell the story their way.');}},

/* ---------- PART 4: HABITS ---------- */
{part:3,src:'Chapter 11 · The Agenda-Setting Discussion',run(L){
  L.h(L.kick('learn','The agenda-setting discussion')+'<h1 class="q">A one-minute habit that makes the meeting shared</h1>'+
   L.prose('An agenda is your view, in advance, of what a meeting should cover. The book calls agenda-setting simple, socially safe and very powerful, a formal tool for listening.')+
   L.lanes([['lock','Agenda you own','Presented, fixed, defended. It creates a “me versus you” feel.',3],
            ['people','Agenda you share','Proposed, then discussed: “I thought we’d cover X and Y, and a little on Z. How does that sound?”',2]])+
   L.prose('Never present an agenda without discussing it, even for sixty seconds. Asking “What else should we cover today?” lets the client tell you what is really on their mind. It works for formal written agendas and for a quick one-to-one chat alike.'));
  L.done();}},
{part:3,src:'Chapter 11 · The Agenda-Setting Discussion',pts:1,run(L){
  L.h(L.kick('pr','Open the meeting')+'<h1 class="q">Noor has a meeting with Dana and Felix about the closure timeline. How should Noor open it?</h1>');
  L.mc(L.card,['“I’ve set out five points we need to cover. Let’s go.”','“Let’s skip the agenda and get straight to the dates.”','“I suggest the timeline, then Gail. What else should we cover?”'],2,
   'Proposing an agenda and inviting changes signals that the meeting belongs to everyone, and may surface what Felix really cares about.',
   'A fixed agenda sets up “me versus you”, and skipping it throws away a powerful listening tool. Propose, then ask what else to cover.');}},
{part:3,src:'Chapter 11 · What Good Listeners Do',run(L){
  L.h(L.kick('learn','What good listeners do')+'<h1 class="q">The book’s long list, grouped into four habits</h1>'+
   L.prose('Tap each card. These are a selection from the book’s lists of what good listeners do and don’t do.'));
  L.flips(L.card,[
   ['Draw it out','Probe for clarification, keep asking for detail, ask “How do you feel about that?”, ask what they’ve considered before sharing your own ideas.'],
   ['Hear what isn’t said','Listen for unvoiced emotions and hidden assumptions. Notice when words and body language don’t match. Listen for what’s different, not what’s familiar.'],
   ['Give them room','Let them tell it their way and get it out of their system. Take every worry seriously; never say “you shouldn’t worry about that.”'],
   ['Show you’re there','Remove distractions, look at (not stare at) them, nod, stay still, and summarize well. Make it feel as if they matter most and you have all the time in the world.']],
   'And what they <b>don’t</b> do: interrupt, respond too soon, match the client’s story with their own, editorialize midstream, judge, rush to solve, or take calls during the meeting.');}},
{part:3,src:'Chapter 11 · What Good Listeners Do',pts:6,run(L){
  L.h(L.kick('pr','Good habit or bad?')+'<h1 class="q">These things happened in Larkmoor meetings this week. Sort them.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Good listening','Poor listening'],[
   ['Ines tells a client, “Oh, the same thing happened at my last firm…”',1,'That’s matching the client’s story with your own. The focus shifts to Ines.'],
   ['Noor asks Dana, “How do you feel about Gail’s reaction?”',0,'Asking how the client feels is on the book’s list of what good listeners do.'],
   ['Noor glances at a phone alert while Felix is mid-sentence.',1,'Distractions during a client meeting tell the client they aren’t what matters.'],
   ['Tomasz notices Dana says “fine” while gripping the table, and asks about it.',0,'Spotting a mismatch between words and body language is good listening.'],
   ['Halfway through, Ines says, “Well, that option’s a nonstarter.”',1,'Editorializing midstream cuts off the client’s story.'],
   ['Noor ends with, “Let me check I’ve got the whole picture…”',0,'Summarizing well shows the client they were heard.']],
   'Good listening keeps the focus on the client. Poor listening pulls it back to you: your story, your judgment, your phone.');}},
{part:3,src:'Chapter 11 · What Good Listeners Do',pts:1,run(L){
  L.h(L.kick('pr','Put it together')+'<h1 class="q">Dana finally says: “Honestly, I’m worried Felix will pin this on me if it goes wrong.” What should Noor do next?</h1>');
  L.mc(L.card,['Reassure Dana: “Felix won’t blame you, don’t worry.”','Take it seriously and ask Dana to say more about it','Move on to the dates, since that’s what Noor can fix'],1,
   'Taking the worry seriously and keeping Dana talking is what good listeners do. It may also be the real issue behind the paperwork.',
   'Telling Dana not to worry dismisses the fear, which the book warns against. Moving on to the dates skips the most important thing Dana has said. Take it seriously and ask for more.');}}
  ]
});
</script>
</body>
</html>
