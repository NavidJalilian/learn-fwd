<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What’s So Hard?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0012', title:'What’s so hard about all this?', minutes:20, icon:'alert',
  goals:['Answer the common objections to working as a trusted advisor','Catch yourself rushing to action, and know why you do it','See the fears behind “too risky” and manage your own emotions in the moment'],
  parts:['Objections','Rushing ahead','Risk','Your emotions'],
  read:'Read chapter 15 of the book for all fourteen objections with the authors’ replies, and the full lists of fears and emotions to manage.',
  glossary:{
   'exclusive-professionalism':'Exclusive professionalism: the narrow belief that a professional must always have the answer and hide any gaps, which keeps the client at a distance. Its opposite, inclusive professionalism, brings the client in.',
   'emotional-intelligence':'Emotional intelligence: noticing and reading emotions in yourself and others, and acting on that reading instead of being driven by the emotion itself.'
  },
  cheatsheet:[
    'Most objections are true but incomplete. Yes, it’s risky; yes, it’s hard. That’s why doing it sets you apart.',
    'Trust doesn’t discount expertise. Without trust, expertise never gets through.',
    'Take a <b>preliminary</b> position and label it so. If new facts prove you wrong, change your view: clinging is self-orientation.',
    'The most common mistake of all: <b>jumping to action</b> before the earlier stages are done.',
    'Four reasons we rush: focus on ourselves, believing we sell only content, wanting something tangible, seeking validation.',
    'Risk is part of trust, not its enemy. “Too risky” usually means a personal risk to credibility or intimacy.',
    'Not doing a right thing is a worse risk than doing a wrong thing.',
    'Manage your own emotions: ask what you’re trying to achieve right now, and watch for the urge to take credit, fill silence, list credentials or hedge.'
  ],
  steps:[
/* ---------- PART 1: OBJECTIONS ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Most advice in this course is simple: listen, ask, say what you see. So why are trusted advisors still rare?</h1>');
  L.mc(L.card,['The ideas are too complex for most people','Doing it feels risky and fights old habits'],1,
   'Knowing what to do is easy. Doing it, when it feels risky and goes against years of habit, is the hard part. That’s this lesson.',
   'The ideas aren’t complex. What’s hard is acting on them when it feels risky and cuts against habit. That’s this lesson.');}},
{part:0,src:'Chapter 15 · What’s So Hard About All This?',run(L){
  L.h(L.kick('learn','Objections about you')+'<h1 class="q">The book hears fourteen objections. Many are about how it feels.</h1>'+
   L.prose('The authors often agree with the objection, then add what it misses. Tap each card.'));
  L.flips(L.card,[
   ['“The emotional stuff feels risky and flaky.”','True, it is risky, so balance and practice matter. But because few people do it, it’s a chance to stand out. Risk is how intimacy is built.'],
   ['“I can’t help acting sure of myself. I fear looking ignorant.”','A normal fear, but one you can recognize and rise above. Pure assertiveness makes you look <i>more</i> uninformed. This is '+L.g('emotional-intelligence','emotional intelligence')+'.'],
   ['“It’s hard to shut up and listen first.”','Yes, the habit runs deep, even for the authors. Rob holds his pen in his “wrong” hand and must switch it before he can jump in.'],
   ['“Some things are too personal to say.”','It takes courage. But not speaking up can be worse. Advisors overrate the risk of acting and underrate the risk of not acting.'],
   ['“It’s too close to prying.”','Usually the worry is about how <i>we</i> will feel. Said with respect, most people welcome it, or just say “no, thank you”.'],
   ['“It’s hard to be this humble.”','Being humble is not the same as being weak. You can serve a client without groveling.']],
   'Notice the pattern: each objection is about the advisor’s own discomfort, not about what the client needs.');}},
{part:0,src:'Chapter 15 · What’s So Hard About All This?',run(L){
  L.h(L.kick('learn','Objections about the work')+'<h1 class="q">Others say it doesn’t fit how professional work is done</h1>'+
   L.list([['book','“Our expertise is what matters.”','Trust doesn’t discount expertise; it lets expertise work. Without trust, no content gets through. Great firms are built on this.'],
     ['clock','“It’s too slow for my budget.”','Clients value counseling done with them, in the room. And it’s the best source of future work. Would you rather counsel clients or write proposals?'],
     ['scale','“It sounds moralistic.”','Judge it on results, not morals. Does it work in your own experience?'],
     ['pencil','“I can’t take a position until I’m sure.”','Take a <i>preliminary</i> one and say so. Refusing to take any position is the real risk.'],
     ['cycle','“If I change my view, I lose credibility.”','Clinging to a wrong view hurts credibility far more. It’s self-orientation: it’s about you, not the facts.']],2));
  L.done();}},
{part:0,src:'Chapter 15 · What’s So Hard About All This?',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">Over coffee, Noor and Ines bring Tomasz their doubts</h1>');
  L.beats(L.card,[
   ['Ines','“If I tell Dana my first thought on the selection rules and it’s wrong, I look like an amateur.”'],
   ['Tomasz','“Then call it a first thought. ‘Here’s a starting hypothesis, let’s test it.’ You’ll look thoughtful every time, and right most of the time.”'],
   ['Noor','“Last month I told Felix the closures needed 30 days. Now I think the site needs longer. If I change, Felix will doubt me.”'],
   ['Tomasz','“Felix will doubt you more if you defend the wrong number. Admitting it just shows you’re human.”'],
   ['Noor','“And Dana only ever calls about contracts. I don’t think they want more from me.”'],
   ['Tomasz','“Have you asked? Say it once, plainly: ‘I sense you want me on the contracts only. Is that right?’ Then do what Dana says.”']],
   'Each doubt is about protecting the advisor. Each answer puts the client back at the center.');}},
{part:0,src:'Chapter 15 · What’s So Hard About All This?',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Dana answers Noor: “Honestly? Yes, just the contracts.” Months pass and nothing changes. What does the book suggest?</h1>');
  L.mc(L.card,['Keep pushing until Dana opens up','Deliver what Dana asked; invest elsewhere','Drop Corran as a client altogether'],1,
   'Noor got a clear answer, so Noor delivers on it. If it will never change, the effort to become a trusted advisor is better spent with other clients.',
   'The book says to listen to the answer and deliver on it. Pushing ignores what Dana said; dropping Corran goes far beyond it. Invest the trust effort elsewhere.');}},
{part:0,src:'Chapter 15 · What’s So Hard About All This?',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which reply fits the objection?',['Label it a first view','Admit the change','Trust lets skill work','Counseling pays','Name it with respect'],[
   ['Ines: “Clients pay for our legal knowledge, not for chats about feelings.”',2,'Without trust, the knowledge never lands. Trust is what makes expertise effective.'],
   ['Noor: “I said the policy was fine. New facts say it isn’t, but I can’t back down now.”',1,'Clinging to a wrong view hurts credibility more than admitting it.'],
   ['Ines: “I won’t say what I think until I’ve checked every case.”',0,'A preliminary position, labeled as such, lets you think with the client.'],
   ['Noor: “Asking Dana how they’re coping would be prying.”',4,'Said with respect, most people welcome it, or say “no, thank you”.'],
   ['Ines: “Long talks with Dana aren’t billable. We can’t afford them.”',3,'Clients value counseling done with them, and it builds future work.']]);}},

/* ---------- PART 2: RUSHING AHEAD ---------- */
{part:1,src:'Chapter 15 · Why We All Rush to Action Too Soon',run(L){
  L.h(L.kick('learn','The most common mistake')+'<h1 class="q">Jumping to action before the earlier stages are done</h1>'+
   L.prose('The book names one mistake that is more common than all the others put together: pushing for action before you’ve engaged, listened, framed and envisioned.')+
   L.note('Picture a systems consultant meeting a new client. They nod along, spot the problem early, ask one clinching question, then pitch their in-house fix. The client backs off. Even if the answer is 100% right, they haven’t '+L.g('earn-the-right','earned the right')+' to discuss it yet.','book')+
   L.prose('The interesting question isn’t <i>that</i> we do it. It’s <i>why</i>.'));
  L.done();}},
{part:1,src:'Chapter 15 · Why We All Rush to Action Too Soon',run(L){
  L.h(L.kick('learn','Four reasons we rush')+'<h1 class="q">What pulls advisors toward action too soon</h1>'+
   L.list([['person','Focus on ourselves','Action feels like it’s about us: our answers, our know-how. (In the book’s classes, nearly everyone rated themselves more trustworthy than their colleagues.)'],
     ['book','Believing we sell only content','Clients praise our technical mastery, so we rush to what looks like content.'],
     ['box','Wanting something tangible','Problem solvers hate a vacuum. We fill silences with ideas and ask closed questions. Action steps feel solid.'],
     ['star','Seeking validation','Professionals are often slightly insecure. The client’s reaction to our action is when we finally feel sure it’s OK.']],1)+
   '<p class="small" style="margin-top:10px">The book says these pulls are nearly hard-wired. Only conscious self-control and practice build new habits.</p>');
  L.done();}},
{part:1,src:'Chapter 15 · What’s So Hard About All This?',pts:1,
 solve:async L=>{for(let i=0;i<3;i++)L.$('#more').click();L.$('#ans').click();},
 run(L){
  const S=['“We need to close the Eastfield shop. I just need the notice letters.”','“The staff there have been with us for years. Some started with Felix’s father.”','“Gail is threatening to go to the local paper if we do it badly.”','“…and honestly, Felix has said this one is on me.”'];
  let n=1,done=false;
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Dana calls Noor. Noor already knows how to draft the letters. When will Noor give their answer?</h1>'+
   '<div style="background:var(--soft);border-radius:16px;padding:14px;margin:8px 0" id="said"></div>'+
   '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="more">'+L.ic('eye')+'Let Dana keep talking</button><button class="btn pri" id="ans">'+L.ic('pencil')+'Give the answer now</button></div><div id="fb"></div>');
  const draw=()=>{L.$('#said').innerHTML=S.slice(0,n).map(s=>'<p style="margin:0 0 8px">'+s+'</p>').join('');L.$('#more').hidden=n>=S.length;};draw();
  L.$('#more').onclick=()=>{if(done)return;n=Math.min(n+1,S.length);draw();};
  L.$('#ans').onclick=()=>{if(done)return;done=true;L.$('#more').hidden=true;L.$('#ans').hidden=true;const ok=n>=S.length;L.award(ok);
    L.sheet(ok?'ok':'no',ok?'You waited for the real issue':'Noor answered the wrong question',
     ok?'The letters were never the whole story. Dana’s real worry is Gail, the town and Felix’s blame. Waiting let Noor hear it. Like Rob switching his pen, you held back long enough to listen.'
       :'The letters were only the first thing Dana said. Still to come: '+S.slice(n).join(' ')+' Answering early felt helpful, but it skipped the real problem.');
    L.done();};}},
{part:1,src:'Chapter 15 · The Desire for Tangibility',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">In an open-ended talk with Dana, Ines gets restless and says: “Shall I just start drafting the letters? At least that’s something concrete.” Which reason is pulling Ines?</h1>');
  L.mc(L.card,['Seeking validation','Wanting something tangible','Believing we sell only content'],1,
   'The uncertainty is uncomfortable, and drafting feels solid. That’s the desire for tangibility.',
   'Ines isn’t chasing praise or defending expertise here. The open-ended talk feels uncomfortable, and something concrete feels safer: the desire for tangibility.');}},
{part:1,src:'Chapter 15 · Why We All Rush to Action Too Soon',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Why the rush?',['Focus on ourselves','Selling only content','Wanting the tangible','Seeking validation'],[
   ['Noor jumps in with a solution because it shows off what Noor knows best.',0,'Action feels like it’s about us and our answers.'],
   ['Felix once praised Noor’s “sharp contract work”, so Noor sticks to clauses.',1,'Clients praise technical mastery, which feeds the belief that content is all we sell.'],
   ['A silence falls; Ines fills it with a theory and a yes-or-no question.',2,'Problem solvers dislike a vacuum and reach for something solid.'],
   ['Ines pushes for a decision so Dana will say “great work”.',3,'The client’s reaction to action is where professionals look for reassurance.']]);}},

/* ---------- PART 3: RISK ---------- */
{part:2,src:'Chapter 15 · Risk',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">Rebecca plays it safe, and loses</h1>');
  L.beats(L.card,[
   ['The project','Rebecca, a management consultant, finished a project that went well. She liked the client, but didn’t stay in touch.'],
   ['A year later','The client called, a little hurt: why didn’t you ever call? I could have used your help several times.'],
   ['Her reason','Rebecca had thought calling was too risky. It might look presumptuous. If the client needed her, they’d call.'],
   ['The cost','The book calls it a shame for everyone: the client missed help they wanted, and Rebecca missed the chance to give it.']],
   'What felt like the safe choice was the costly one. The book says “too risky” is the most common reason people don’t build trust.');}},
{part:2,src:'Chapter 15 · Risk',run(L){
  L.h(L.kick('learn','Risk is part of trust')+'<h1 class="q">The steps that build trust are the ones that feel risky</h1>'+
   L.prose('Taking a point of view, naming a hard issue, playing back a client’s feelings, holding off on action: these build trust, and these are what people call “too risky”.')+
   L.quote('Taking a risk is precisely how you build trust.','Maister, Green and Galford, chapter 15')+
   L.prose('Look closer and the “business risk” is usually <b>personal</b> risk, of two kinds:')+
   L.lanes([['shield','Credibility risk','A narrow idea of professionalism: you must have the answers and hide any gaps. The book calls it '+L.g('exclusive-professionalism','exclusive professionalism')+'.',3],
            ['chat','Intimacy risk','The mistaken idea that clients only want logic. Yet the book says buying is almost always emotional.',2]]));
  L.done();}},
{part:2,src:'Chapter 15 · Risk',run(L){
  L.h(L.kick('learn','Two kinds of risk, and the fears behind them')+'<h1 class="q">Not doing a right thing is the worse risk</h1>'+
   L.lanes([['x','Doing a wrong thing','A mistake you can learn from and be forgiven for.',3],['lock','Not doing a right thing','Often a long stretch of willful avoidance. More harmful, and a sign of low courage.',1]])+
   L.prose('Most people fear only the first kind, so they slip into the second. Under it all sit fears like these:')+
   '<div style="display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px">'+['Not having the answer','Not getting it quickly','Having the wrong answer','A social blunder','Looking confused','Not knowing what to say','Missing information','Showing ignorance','Misdiagnosing'].map(x=>'<span class="chip static">'+x+'</span>').join('')+'</div>'+
   L.prose('The good news: when you take a personal risk, the other person usually returns it, and intimacy grows.'));
  L.done();}},
{part:2,src:'Chapter 15 · Risk',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">The closures are done. Noor thinks about calling Dana to ask how things settled in town, but decides: “If Dana needs me, Dana will call.” Which risk is Noor running?</h1>');
  L.mc(L.card,['Not doing a right thing','Doing a wrong thing'],0,
   'Like Rebecca, Noor avoids a small risk and takes a bigger one: a relationship that quietly fades.',
   'Calling wouldn’t be a wrong thing. Not calling, like Rebecca, is the more harmful risk: not doing a right thing.');}},
{part:2,src:'Chapter 15 · Risk',pts:5,run(L){
  L.h(L.kick('pr','Which risk is it really?')+'<h1 class="q">Sort each worry. Is it really about credibility or about intimacy?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Credibility risk','Intimacy risk'],[
   ['Ines: “If I say I don’t know the visa rules, Felix will think I’m junior.”',0,'Hiding a gap to look professional is the narrow view of credibility.'],
   ['Noor: “Asking Dana how the closures feel would be unprofessional.”',1,'It assumes the client only wants the rational side.'],
   ['Noor: “I can’t share a first view until it’s airtight.”',0,'It assumes a professional must always have the finished answer.'],
   ['Ines: “Clients pick firms on price and skill, not on feelings.”',1,'Buying is an emotional act, especially for complex services.'],
   ['Noor: “Pointing out Gail’s grip on Felix is too personal to raise.”',1,'Fear of moving past pure logic into the personal is intimacy risk.']],
   'Both kinds are personal risks dressed up as business risks. Naming which one you feel helps you move past it.');}},

/* ---------- PART 4: YOUR EMOTIONS ---------- */
{part:3,src:'Chapter 15 · Managing Your Own Emotions',run(L){
  L.h(L.kick('learn','Managing your own emotions')+'<h1 class="q">The higher the stakes, the harder it is to ask a simple question</h1>'+
   L.prose('The book’s example: in a meeting, someone mentions a project by a code name and everyone laughs. You don’t know it. You stay quiet, hoping to pick it up. Then it comes up again, and now asking feels even worse. Meanwhile your mind is on your worry, not the meeting.')+
   L.prose('We all know the fix: “At the risk of sounding slow, can someone fill me in?” But when stakes are high, emotions overrule our heads.')+
   L.note('Pause and ask yourself: <b>What am I trying to achieve right now? What should I say, and how?</b> The root problem is self-centered fear: fear of losing what we have, or not getting what we want.','compass'));
  L.done();}},
{part:3,src:'Chapter 15 · Managing Your Own Emotions',pts:1,run(L){
  L.h(L.kick('pr','Your call')+'<h1 class="q">At Corran’s board meeting, Felix mentions “the Millbrook mess” and people laugh. Noor has no idea what it is. What should Noor do?</h1>');
  L.mc(L.card,['Stay quiet and pick it up from context','Ask Dana about it quietly after the meeting','Ask now, lightly, what Millbrook refers to'],2,
   'One light question now costs little. Each time the term comes back, asking gets harder and Noor’s attention drifts further from the room.',
   'Waiting feels safer, but the book’s point is that the cost grows: the term comes back, asking gets harder, and Noor stops listening while worrying.');}},
{part:3,src:'Chapter 15 · Managing Your Own Emotions',run(L){
  L.h(L.kick('learn','Six urges to watch')+'<h1 class="q">Emotions and desires a trusted advisor learns to control</h1>'+
   L.list([['Taking credit','Wanting, even needing, an idea to be seen as yours.'],
     ['Filling airtime','Rushing to fill any silence with content.'],
     ['Listing credentials','Feeding insecurity by getting all your qualifications on the table.'],
     ['Capping the problem','Boxing it in early so you can solve it later, without pressure.'],
     ['Hedging','Softening every answer in case you’re wrong.'],
     ['Telling your version','Jumping in too soon with your own take on the client’s story.']],4)+
   '<p class="small" style="margin-top:10px">Each one pulls your attention back onto yourself, and away from the client.</p>');
  L.done();}},
{part:3,src:'Chapter 15 · Managing Your Own Emotions',pts:6,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Spot the urge',['Taking credit','Filling airtime','Listing credentials','Capping the problem','Hedging','Telling your version'],[
   ['Meeting Sasha at Brightwell, Noor opens with twelve years of cases and two awards.',2,'Leading with qualifications feeds insecurity, not the client.'],
   ['Dana goes quiet for a moment. Noor quickly fills it with three points on case law.',1,'The silence may have been Dana thinking. Let it be.'],
   ['Dana starts describing Gail. Noor cuts in: “I had a regional manager just like that once…”',5,'Jumping in with your own version too soon pulls focus to you.'],
   ['Noor adds “but it depends” and “possibly” to every sentence of the advice.',4,'Hedging in case you’re wrong protects you, not the client.'],
   ['Felix adopts Dana’s idea. Noor reminds the room it was first in Noor’s memo.',0,'Needing credit puts your ego ahead of the client’s win.'],
   ['Noor says: “Let’s treat it as just a paperwork issue for now and look at the rest later.”',3,'Boxing the problem in early eases pressure on you, not the client.']]);}},
{part:3,src:'Chapter 15 · Managing Your Own Emotions',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Back in the board meeting, “Millbrook” comes up a second time. Tap each piece until Noor’s question is calm and client-focused.</h1>');
  L.sentence(L.card,[['“As an employment lawyer of twelve years,','“I may be the only one who doesn’t know,'],['but could someone tell me','I assume'],['Millbrook was a dispute, right?','what Millbrook was?'],['It may matter for the closures.”','I’ve seen many like it.”']],[1,0,1,0],
   [['Leading with credentials feeds insecurity and doesn’t help anyone answer.'],['Assuming hides the gap instead of closing it.'],['A guess dressed as a question still avoids admitting the gap.'],['That turns the moment back to Noor’s experience.']],
   'Owning the gap lightly, asking plainly and linking it to the client’s issue: low ego, high focus on Corran.');}}
  ]
});
</script>
</body>
</html>
