<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Columbo and Getting Hired</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0014', title:'The Columbo approach and getting hired', minutes:20, icon:'eye',
  goals:['Set a client at ease by stripping away the trappings of expertise, Columbo-style','Explain why selling and serving are two sides of the same coin','Win work by starting to serve, not by talking about serving'],
  parts:['Columbo','Why it’s hard','Sales and service','Getting hired'],
  read:'Read chapters 17 and 18 of the book for the full Columbo portrait and the Dalton case.',
  glossary:{
   'trappings':'Trappings: the visible signs of expert status, such as framed degrees, jargon, uniforms and status symbols. They can make a client feel their fate is in someone else’s hands.',
   'beauty-contest':'Beauty contest: when a client makes several firms compete with formal pitches and proposals, even firms it already uses.'
  },
  cheatsheet:[
    'Columbo’s key is <b>style, not method</b>. He removes people’s preconceptions about him, and they relax and talk openly.',
    'Clients often feel “you expert, me dummy”, feel something is at stake, and face your <b>trappings</b>. All three put them on guard.',
    'Never act incompetent. Be humble, informal and curious; praise the client’s intelligence; play down your own importance.',
    'The biggest barrier is <b>us</b>: our love of status and our belief that success is only technical mastery.',
    'Dalton: splitting selling from delivery won clients but kept few. There must be some way to <b>link spotting opportunities with excellent delivery</b>.',
    'Selling well is serving (showing you can be trusted). Serving well is selling (delighted clients rehire and refer).',
    'Getting hired: don’t talk about serving, <b>start serving</b>. Let the client feel what working together is like.',
    'Pointing out risks and opportunities is a professional duty. Call it <b>contributing ideas</b>, and don’t hoard your point of view.'
  ],
  steps:[
/* ---------- PART 1: COLUMBO ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">You have an embarrassing health worry. Which doctor are you more likely to tell everything to?</h1>');
  L.mc(L.card,['One who sits beside you, chats, and asks curious questions','One behind a big desk, under framed diplomas, using jargon'],0,
   'Most people open up to the doctor who seems human and interested. This lesson is about how advisors can create that same ease.',
   'The diplomas prove expertise, but they also put you on guard. Most people tell more to the doctor who seems human and curious. That’s this lesson’s first idea.');}},
{part:0,src:'Chapter 17 · The Lieutenant Columbo Approach',run(L){
  L.h(L.kick('learn','Meet Lieutenant Columbo')+'<h1 class="q">A detective who looks like the least threatening person in the room</h1>'+
   L.prose('Columbo was a TV homicide detective played by Peter Falk. The viewer knows the culprit from the start. The fun is watching Columbo get to the truth.')+
   L.prose('He wears a rumpled raincoat, drives an old car, looks puzzled and seems dazzled by the clever suspect. The suspect relaxes, lets their guard down, and slips.')+
   L.lanes([['eye','What it is','A <b>style</b>, carefully chosen. Columbo ignores official police method and works by instinct and situation.',2],
            ['x','What it isn’t','The authors are clear: don’t <b>act incompetent</b>. The lesson lies one level below the surface.',3]]));
  L.done();}},
{part:0,src:'Chapter 17 · The Lieutenant Columbo Approach',run(L){
  L.h(L.kick('learn','What sits below the surface')+'<h1 class="q">Three things put a client on guard before you say a word</h1>'+
   L.tiers([['person','“You expert, me dummy”','The client knows less than you. That can stir resentment, awe, jealousy, competition or a wish to be liked.'],
            ['alert','Something at stake','The client brings a problem: costs to avoid, gains to win. It feels critical.'],
            ['star','The '+L.g('trappings','trappings'),'Framed degrees, uniforms, gadgets: signs that the client’s fate is in someone else’s hands.']])+
   L.prose('Columbo punctures all three. He praises the other person’s intelligence, wears the anti-uniform, makes small talk and plays down his own abilities. Then people talk openly: they describe things as they see them, and offer information instead of holding it back.'));
  L.done();}},
{part:0,src:'Chapter 17 · The Lieutenant Columbo Approach',run(L){
  L.h(L.kick('ex','Columbo at Larkmoor')+'<h1 class="q">Tomasz meets Brightwell’s clinic managers before the pitch</h1>');
  L.beats(L.card,[
   ['The setting','Sasha lets each firm meet three clinic managers before the final pitch. The other firms book a boardroom. Tomasz asks to visit a clinic instead.'],
   ['The opening','No slides, no list of awards. Tomasz says: “I’ve never worked inside a physio clinic. How does a normal Monday go here?”'],
   ['The curiosity','Tomasz asks how rotas work, then one more question about the part-time therapists. The managers start explaining, then complaining.'],
   ['What surfaces','The managers admit nobody is sure which therapists count as employees and which as self-employed. The last firm never asked.'],
   ['Why it worked','Tomasz didn’t pretend ignorance of the law. Tomasz dropped the expert act, so the managers stopped performing and said what was really going on.']],
   'Humble, informal and curious is not the same as incompetent. The aim is to remove what puts the client on guard.');}},
{part:0,src:'Chapter 17 · The Lieutenant Columbo Approach',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">According to the book, what is Columbo’s real genius?</h1>');
  L.mc(L.card,['Seeming incompetent so others underestimate him','Following a rigorous method more closely than others','Removing people’s preconceptions so they feel at ease'],2,
   'He neutralizes what people expect of him. Once at ease, they talk honestly. That’s the part advisors should copy.',
   'The book says his key is style, not method, and it rejects acting incompetent. His genius is removing preconceptions so the other person relaxes.');}},
{part:0,src:'Chapter 17 · The Lieutenant Columbo Approach',pts:1,
 solve:async L=>{const c=L.$('#pl').children;[0,2,4].forEach(i=>c[i].click());L.$('#ck').click();},
 run(L){
  const P=[['Open with Larkmoor’s rankings and awards',1],['Ask how Brightwell’s clinics run day to day',0],['Meet in the boardroom under the framed certificates',1],['Mention what impressed Noor about Brightwell’s growth',0],['Explain the law in full legal terms to show depth',1],['Say Noor is still learning how clinics work',0]];
  const kept=P.map(()=>true);let first=true;
  L.h(L.kick('pr','Strip the trappings')+'<h1 class="q">Here is a draft plan for Noor’s next meeting with Sasha. Tap to drop anything that would put Sasha on guard, and watch Sasha’s openness.</h1><div id="pl"></div>'+
   '<div class="meterrow" style="margin-top:12px"><div class="lb">Sasha’s openness</div><div class="meter"><div id="om" style="background:var(--ok-strong)"></div></div></div>'+
   '<button class="btn pri" id="ck" style="margin-top:12px">'+L.ic('check')+'Check the plan</button><div id="pf"></div>');
  const draw=()=>{let o=10;P.forEach((p,j)=>{if(p[1]===0&&kept[j])o+=15;if(p[1]===1&&!kept[j])o+=15;});L.$('#om').style.width=o+'%';};
  P.forEach((p,j)=>{const b=document.createElement('button');b.className='chip sel';b.textContent=p[0];
    b.onclick=()=>{kept[j]=!kept[j];b.classList.toggle('sel',kept[j]);b.style.opacity=kept[j]?'':'.45';b.style.textDecoration=kept[j]?'':'line-through';L.$('#pf').innerHTML='';draw();};L.$('#pl').appendChild(b);});
  draw();
  L.$('#ck').onclick=()=>{const ok=P.every((p,j)=>kept[j]===(p[1]===0));
    if(ok){if(first)L.award(true);L.sheet(first?'ok':'info',first?'Sasha can relax':'Got it now','Rankings, the certificate room and heavy jargon all signal “you expert, me dummy”. Curiosity, sincere appreciation and honest humility remove that, and none of them means acting incompetent.');L.$('#ck').remove();L.done();}
    else{if(first)L.award(false);first=false;const wrong=P.filter((p,j)=>kept[j]!==(p[1]===0)).length;
      L.fb(L.$('#pf'),'<b>Not yet: '+wrong+' item'+(wrong>1?'s are':' is')+' off.</b> Drop the trappings of status. Keep anything curious, appreciative or humble.','no');}};}},

/* ---------- PART 2: WHY IT'S HARD ---------- */
{part:1,src:'Chapter 17 · The Lieutenant Columbo Approach',run(L){
  L.h(L.kick('learn','Why it’s hard to be Columbo')+'<h1 class="q">The obstacles are inside the advisor</h1>'+
   L.list([['star','We love the trappings','Degrees and status signal success. We worked hard for them, so a little display feels earned. But those are exactly what put the client on guard.'],
     ['book','We think it’s all technical mastery','So we nod wisely, slip in learned asides (professional name-dropping) and wait to hand down the Answer. Many clients play along, until they meet something better.']],3)+
   L.quote('We have found the enemy, and it is us.','Pogo’s line, as the authors use it in chapter 17')+
   L.prose('Columbo puts his ego at the service of the person in front of him. He isn’t a trickster; he strips illusions away.'));
  L.done();}},
{part:1,src:'Chapter 17 · The Lieutenant Columbo Approach',run(L){
  L.h(L.kick('ex','Anti-Columbo')+'<h1 class="q">Noor’s follow-up call with Sasha, before Tomasz’s visit</h1>');
  L.beats(L.card,[
   ['The setup','Noor joins the call from Larkmoor’s boardroom, the framed awards in the background on camera.'],
   ['The talk','Noor mentions two big tribunal wins, cites a recent case by name, and nods wisely while Sasha talks.'],
   ['The Answer','Before Sasha finishes, Noor delivers a polished view on contracts. It’s correct. Sasha says “thank you” and little else.'],
   ['Tomasz’s debrief','“You were right about the law. But what did Sasha tell you that you didn’t know before?” Noor can’t name anything.'],
   ['The lesson','Every display of status made Sasha more guarded. Noor’s need to look expert got in the way of finding out what Brightwell needed.']],
   'Being right isn’t the barrier. Needing to <i>look</i> right is.');}},
{part:1,src:'Chapter 17 · The Lieutenant Columbo Approach',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">What does the book name as the biggest barrier to working Columbo-style?</h1>');
  L.mc(L.card,['Our own need for status and image','Clients who demand impressive credentials','Not knowing enough about the client’s field'],0,
   'The enemy is us: our love of the trappings and our belief that only technical mastery counts.',
   'Clients may play the expert game too, but the book puts the main barrier inside the advisor: the need for ego gratification and status.');}},
{part:1,src:'Chapter 17 · The Lieutenant Columbo Approach',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Columbo, anti-Columbo, or missing the point?',['Columbo style','Anti-Columbo','Fake incompetence'],[
   ['Ines tells a Brightwell manager, “I’m no expert on employment law, really.”',2,'Ines is an employment lawyer. Pretending otherwise misleads the client. The book rejects acting incompetent.'],
   ['Noor drops the legal jargon and asks Dana to explain how shop rotas really work.',0,'Informal, curious and humble: the client starts telling Noor how things really are.'],
   ['Ines quotes three case names in a first meeting to show Ines has done the reading.',1,'That’s the professional name-dropping the book warns about. It puts the client on guard.'],
   ['Tomasz tells Felix, “You know this business far better than I ever will.”',0,'Sincere praise of the client’s knowledge, and playing down one’s own importance.'],
   ['Noor waits silently for Sasha to finish, then delivers the definitive Answer.',1,'Listening with your nose high, then handing down the Answer, is the anti-Columbo pattern.']]);}},

/* ---------- PART 3: SALES AND SERVICE ---------- */
{part:2,src:'Chapter 18 · The Role of Trust in Getting Hired',run(L){
  L.h(L.kick('ex','A case from the book')+'<h1 class="q">Dalton: a superb sales machine that kept losing clients</h1>');
  L.beats(L.card,[
   ['The model','Dalton (a disguised consulting firm) split new-client work into four specialist units: finding leads, closing deals, diagnosing problems, delivering the work.'],
   ['The success','It worked very well for years, and showed the client doesn’t always need the person who sold the work to do it.'],
   ['The gap','The delivery team saw its job as on time, on budget. Selling was another unit’s job, and spotting further chances to help wasn’t part of their idea of professionalism.'],
   ['The clients','When clients did think about more work, they turned to the delivery team they saw every day. That team saw selling as a distraction.'],
   ['The end','Retention stayed low. New clients kept growth up for a while. When demand fell and good new clients ran out, Dalton declined fast.']],
   'Sales and service don’t have to sit in the same person. But something has to connect them.');}},
{part:2,src:'Chapter 18 · Integrating Sales and Service',run(L){
  L.h(L.kick('learn','Two sides of one coin')+'<h1 class="q">Try to separate selling from serving, and the line blurs</h1>'+
   L.prose('The book doesn’t blame Dalton for specializing. Its point: there must be <i>some</i> way to combine always looking for new ways to help with excellent delivery of the work already agreed.')+
   L.lanes([['pointer','How do you sell?','By <b>showing</b>, not claiming, that you have something to offer and can be trusted. Those are serving actions.',2],
            ['check','How do you serve?','By helping so well the client is delighted, hires you again and tells others. That is selling.',3]])+
   L.note('The coin itself is acting like a '+L.g('trusted-advisor','trusted advisor')+' and a caring professional.','cycle'));
  L.done();}},
{part:2,src:'Chapter 18 · The Role of Trust in Getting Hired',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">What really drove Dalton’s low client retention?</h1>');
  L.mc(L.card,['Its specialist units did poor work for clients','Nothing linked delivery with spotting new needs','Clients wanted the seller to do the work'],1,
   'Each unit was competent. But the team clients knew best didn’t see new opportunities as its job, and nothing linked the two.',
   'The book says the units were professional and that clients don’t insist on the seller doing the work. The missing piece was a link between delivery and spotting new ways to help.');}},
{part:2,src:'Chapter 18 · Integrating Sales and Service',pts:1,run(L){
  L.h(L.kick('pr','What should Larkmoor do?')+'<h1 class="q">Larkmoor’s managing partner proposes a new “business development team” to win clients, so partners like Noor can “just do the law”. Tomasz is asked for a view. Which fits the book?</h1>');
  L.mc(L.card,['Fine, as long as partners also keep spotting new needs','Good idea: partners should leave selling to specialists','Bad idea: only the person who sells should deliver'],0,
   'Specialists can help. The Dalton lesson is that the people clients see every day must still look out for new ways to help, with a clear link back.',
   'The book doesn’t ban specialists, and it says clients don’t insist on the seller doing the work. The danger is partners who stop noticing new needs. That’s what sank Dalton.');}},
{part:2,src:'Chapter 18 · Selling as Service',run(L){
  L.h(L.kick('learn','Selling as service')+'<h1 class="q">Pointing out opportunities is part of the job</h1>'+
   L.flow([['alert','A risk ahead','You’d warn the client. That’s a professional duty.','',3],['bulb','An opportunity','The same duty applies to a real chance to improve.','',2],['check','Contribute ideas','Some call it selling. The book calls it contributing ideas.','',1]])+
   L.prose('Every client, at any moment, has many chances to improve. Yet advisors rarely point them out. The book goes as far as calling that, to some extent, unprofessional.')+
   L.prose('The test is the same as always: <b>is this in the client’s best interest?</b> Noticing a real opportunity and helping the client see its value is service, whatever others call it.'));
  L.done();}},
{part:2,src:'Chapter 18 · Selling as Service',pts:5,run(L){
  L.h(L.kick('pr','Contributing or pushing?')+'<h1 class="q">Noor has ideas for Corran. Which ones are contributing ideas, and which are pushing what Larkmoor has?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Contributing ideas','Pushing our services'],[
   ['Flag that hiring bakers abroad will need visa sponsorship rules checked early',0,'A real risk in Corran’s own plan. Pointing it out is a professional duty.'],
   ['Send Dana the brochure listing all of Larkmoor’s services',1,'That starts from what Larkmoor sells, not from anything Corran needs.'],
   ['Mention that the night-shift rules in Owen’s unit may break working-time law',0,'A real problem Noor noticed. Raising it serves Corran.'],
   ['Suggest an annual retainer because Larkmoor wants steadier income',1,'The reason is Larkmoor’s interest, not Corran’s. That’s self-orientation.'],
   ['Point out that a new holiday-pay ruling affects Corran’s seasonal staff',0,'A change that matters to Corran. Telling them is contributing an idea.']],
   'Same act, different motive. If it starts from the client’s real situation and best interest, it’s service.');}},

/* ---------- PART 4: GETTING HIRED ---------- */
{part:3,src:'Chapter 18 · Service as Selling',run(L){
  L.h(L.kick('learn','Service as selling')+'<h1 class="q">Don’t ask “how do I sell?” Ask “how do I get hired?”</h1>'+
   L.prose('Many advisors dislike overt selling and hope good work speaks for itself. It doesn’t always. The book reframes the task: not pushing what you have, but <b>getting this person to put their trust in you</b>.')+
   L.prose('Picture a '+L.g('beauty-contest','beauty contest')+': several firms, each with up to three hours for a final presentation. You could polish a standard pitch. Or you could <b>get to work right away</b>, and treat those hours as the first three hours of the project.')+
   L.note('Why? Professional services are expensive, intangible and vague. The firm that wins is the one that shows the buyer what being in a relationship together feels like.','bulb'));
  L.done();}},
{part:3,src:'Chapter 18 · Service as Selling',run(L){
  L.h(L.kick('learn','The risks a buyer feels')+'<h1 class="q">Working together for real lowers every risk at once</h1>'+
   L.prose('Even experienced buyers of professional services feel several risks at once:')+
   L.list([['scale','Financial','Will this cost more than it’s worth?'],['flame','Emotional','Will this be stressful or upsetting?'],['clock','Lost time','Will this waste weeks?'],['person','Embarrassment and career','What if I pick wrong, and it’s on me?']],3)+
   L.prose('Showing what working together feels like reduces all of these. It’s also why the advisor who already has the relationship has the edge: clients prefer the devil they know.'));
  L.done();}},
{part:3,src:'Chapter 18 · Service as Selling',run(L){
  L.h(L.kick('ex','The Brightwell pitch')+'<h1 class="q">Larkmoor uses its three hours as the first three hours of the work</h1>');
  L.beats(L.card,[
   ['The brief','Sasha gives each of three firms three hours for a final presentation. The other two bring polished slide decks.'],
   ['The choice','Tomasz and Noor bring no deck. They bring the real issue the clinic managers raised: which therapists count as employees.'],
   ['The work','They spend the session working on it with Sasha: sorting real roles, testing two contract options, and sketching what each would mean for fees.'],
   ['Giving it away','Ines worries they are “giving away” advice before being paid. Tomasz: “If our view on this one question is all we have, we shouldn’t win.”'],
   ['The close','Sasha, true to form, says “I’ll get back to you.” Noor leaves a one-page summary. Sasha now knows what working with Larkmoor feels like.']],
   'Don’t talk about serving. Serve. A sample of the relationship lowers the buyer’s risks more than any slide.');}},
{part:3,src:'Chapter 18 · Service as Selling',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Why does the book favor starting the work during a pitch, rather than a polished presentation?</h1>');
  L.mc(L.card,['It lets the buyer feel what working together is like','It saves the firm time on preparing a pitch','It proves the firm has the most expert people'],0,
   'Clients would rather buy from a sample. Feeling the relationship firsthand lowers their financial, emotional and career risks.',
   'It isn’t about saving effort or showing off credentials. Clients buying something intangible want a sample of what working together will feel like.');}},
{part:3,src:'Chapter 18 · Service as Selling',pts:1,run(L){
  L.h(L.kick('pr','What should Noor say?')+'<h1 class="q">While preparing the pitch, Ines says: “Let’s not share our view on the employee question. If we give it away, why would they pay us?” What fits the book?</h1>');
  L.mc(L.card,['“Agreed. Hint that we have a view, then hold it back.”','“Let’s share a general overview, not our actual view.”','“Share it. Hoarding our view costs us work and trust.”'],2,
   'The book calls it self-delusion to think you sell a limited stock of knowledge. Refusing to take a point of view loses both the work and the relationship.',
   'Holding back the view out of fear of “giving away the goods” is exactly what the book warns against. Clients want to sample the real thing before buying.');}},
{part:3,src:'Chapter 18 · Service as Selling',pts:1,run(L){
  L.h(L.kick('pr','Build the plan')+'<h1 class="q">Tap each piece until this is the book’s way to win the Brightwell work.</h1>');
  L.sentence(L.card,[['Use the three hours to','Use five minutes to','Use the first hour to'],['present our awards,','start the real work,','compare our fees,'],['so Sasha can','so Larkmoor can'],['see our credentials.','feel what working together is like.','skip the proposal.']],[0,1,0,1],
   [['A five-minute demo leaves the session mostly talk. The book uses the whole time as real work.','The book uses the whole session as the start of the project, not just one hour.'],['Awards are trappings. They tell, rather than show.','Fees matter, but comparing them doesn’t show what the relationship feels like.'],['The point is what the client experiences, not what the firm gets.'],['Credentials are claims. The book wants the client to feel the relationship.','Skipping steps isn’t the aim. Lowering the client’s risk is.']],
   'Start serving, so the client can sample the relationship. That lowers every risk the buyer feels.');}}
  ]
});
</script>
</body>
</html>
