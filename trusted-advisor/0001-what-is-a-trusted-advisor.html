<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What Is a Trusted Advisor?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0001', title:'What is a trusted advisor?', minutes:18, icon:'scale',
  goals:['Explain why expertise alone no longer earns a client’s trust','Place a client relationship on the four levels','Spot the attitudes that set trusted advisors apart'],
  parts:['Why trust','What it brings','Four levels','The mindset'],
  read:'Read the Introduction and chapters 1–2 of the book for the full lists and the pinnacle stories.',
  glossary:{
   'beauty-contest':'Beauty contest: when a client makes several firms compete with formal pitches and proposals, even firms it already uses.',
   'pinnacle':'Pinnacle: the top level of a client relationship, where almost any issue, business or personal, can be discussed.'
  },
  cheatsheet:[
   'Expertise is essential but <b>not enough</b>. You only get to advise once a client trusts you enough to share the problem.',
   'Trust used to be assumed. Now it must be <b>earned and kept</b>, all career long.',
   'The more clients trust you, the more they call you early, share information, pay without fuss, forgive mistakes and refer you.',
   'Four levels: <b>service-based → needs-based → relationship-based → trust-based</b>, set by breadth of business issues and depth of personal relationship.',
   'Working at levels 1–2 is not wrong. The skill is <b>shifting up quickly</b> when the moment calls for it.',
   'Trusted advisors focus on the client, not themselves, and value the <b>relationship more than the current deal</b>.',
   'Rewards: repeat work, referrals, fewer proposals and reports, and being yourself with the client.',
   'You probably think you’re more trustworthy than your clients do. <b>There is work to do.</b>'
  ],
  steps:[
/* ---------- PART 1: WHY TRUST ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Dana, Head of People at a bakery chain, calls their lawyer Noor only when a contract needs signing off. What would make Dana call Noor earlier, while problems are still forming?</h1>');
  L.mc(L.card,['A longer list of Noor’s legal credentials','Dana trusting Noor more as a person'],1,
   'Dana already knows Noor is skilled. What’s missing is trust. This whole course is about how to earn it.',
   'Dana already knows Noor is skilled, and still calls late. Credentials don’t open the door. Trust does, and this course is about earning it.');}},
{part:0,src:'Introduction',run(L){
  L.h(L.kick('learn','Meet Noor')+'<h1 class="q">Being good at the work is not the same as being trusted</h1>'+
   L.prose('<b>Noor Haddad</b> is a partner at <b>Larkmoor Law</b>, a made-up 40-person employment law firm. Noor is technically excellent. Yet Corran Bakeries, a client for six years, uses Noor like a vendor: one contract here, one dispute there.')+
   L.prose('The book’s authors say they learned this the hard way. Mastery of your field is essential, but you don’t get to use your advice until someone trusts you enough to share their real problems with you. Nobody teaches that part.')+
   L.note('Noor’s wish list matches what professionals most often ask the authors: see clients more often, get introduced to others in the client’s company, sell other services, avoid being boxed in as a specialist, and get clients less focused on price. Each one needs the client to <i>do something for you</i>. That takes trust.','list'));
  L.done();}},
{part:0,src:'Introduction',run(L){
  L.h(L.kick('learn','Trust is scarce')+'<h1 class="q">Clients used to trust professionals by default. Not anymore.</h1>'+
   L.flow([['clock','Then','Trust came with the job title. A handshake was enough.','assumed',3],['shield','Now','Trust has to be earned, and then kept, all career long.','earned',2]])+
   L.prose('The book points to signs that trust is in short supply:')+
   L.list([['eye','Bills under the microscope','Clients challenge expenses, staffing and how long each task took.'],
     ['lock','Left out early','Professionals are kept out of the first discussions because clients see their role too narrowly.'],
     ['star','Pitch again','Even long-standing suppliers must compete in '+L.g('beauty-contest','beauty contests')+' for new work.'],
     ['list','Report everything','Clients demand detailed activity reports so they can monitor the professional.']],1));
  L.done();}},
{part:0,src:'Introduction',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Noor would love Dana to introduce them to Felix, Corran’s CEO. What does that depend on most?</h1>');
  L.mc(L.card,['Dana trusting Noor enough to vouch for them','Noor sending Dana a list of recent big wins'],0,
   'An introduction asks Dana to do something for Noor, and to put their own name behind Noor. People do that for someone they trust.',
   'A list of wins talks about Noor, not Dana. An introduction asks Dana to risk their own name, and people only do that for someone they trust.');}},
{part:0,src:'Introduction',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Low trust or high trust?',['Sign of low trust','Sign of high trust'],[
   ['Brightwell Clinics asks three firms for 40-page proposals with full team bios.',0,'That’s a beauty contest: the client wants proof on paper before trusting anyone.'],
   ['Dana phones Noor while the shop closures are still only an idea.',1,'Being brought in early is one of the clearest signs of trust.'],
   ['Corran’s finance team asks for an hour-by-hour log of every task.',0,'Detailed reporting so the client can monitor you is a sign trust is missing.'],
   ['Felix plans the closures alone and invites Larkmoor only to sign the letters.',0,'Being left out of early discussions means the client sees your role narrowly.'],
   ['Dana pays a bill that ran slightly over, with a short thank-you.',1,'Paying without question is one of the benefits of trust.']]);}},

/* ---------- PART 2: WHAT IT BRINGS ---------- */
{part:1,src:'Chapter 1 · A Sneak Preview',run(L){
  L.h(L.kick('learn','What trust gets you')+'<h1 class="q">The more a client trusts you, the more they…</h1>'+
   L.prose('Chapter 1 opens with a long list. Here are the items that matter most in day-to-day work:')+
   L.list([['clock','Call you early','They involve you when an issue first forms, maybe even call you first.'],
     ['chat','Share more','They tell you things that help you help them.'],
     ['check','Act on your advice','They accept your recommendations and bring you harder, more strategic issues.'],
     ['shield','Cut you slack','They pay bills without question, give you the benefit of the doubt and forgive mistakes.'],
     ['people','Stand up for you','They protect you, even inside their own company, warn you of dangers and refer you to others.']],2)+
   '<p class="small" style="margin-top:10px">The book adds that even the early benefits of starting to earn trust come quickly, long before you reach the top.</p>');
  L.done();}},
{part:1,src:'Chapter 1 · A Sneak Preview',pts:1,
 solve:async L=>{const b=L.$('#tg').children;b[0].click();b[1].click();},
 run(L){
  const EV=['Noor’s bill runs a little over the estimate.','Noor makes a small mistake in a letter.','Felix starts talking about closing shops.','Gail, a regional manager, complains to Felix about Noor.'];
  const R=[['Dana questions every line and asks for a time report.','Dana hears about it from Felix and escalates it.','Dana calls Noor once the plan is final, for the paperwork.','Dana stays out of it. Noor hears nothing.'],
           ['Dana pays it without a fuss.','Dana gives Noor the benefit of the doubt, and forgives it.','Dana calls Noor first, while the idea is still forming.','Dana warns Noor and defends them to Felix.']];
  const seen=new Set();
  L.h(L.kick('pr','Toggle and compare')+'<h1 class="q">Same Noor, same skill, same events. Switch Dana’s trust in Noor and watch how Dana reacts.</h1><div id="tg"></div>'+
   '<div id="ev" style="margin:10px 0"></div><div id="tq"></div>');
  ['Low trust','High trust'].forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.innerHTML=L.ic(j?'shield':'alert')+n;b.onclick=()=>{[...L.$('#tg').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(j);
    L.$('#ev').innerHTML=EV.map((e,k)=>'<div style="background:var(--soft);border-radius:14px;padding:10px 12px;margin:8px 0"><div class="small">'+e+'</div><div style="color:var(--'+(j?'ok':'no')+');margin-top:4px">'+R[j][k]+'</div></div>').join('');
    if(seen.size===2&&!L.$('#tq').innerHTML){const q=L.$('#tq');q.innerHTML='<h2 class="sub">Noor’s legal skill was identical both times. So what made the difference?</h2>';
      L.mc(q,['Noor’s technical skill','Dana’s trust in Noor','Corran’s budget that year'],1,
       'Exactly. Skill was constant. Trust changed what Dana was willing to do for Noor.',
       'Nothing about the skill or the budget changed between the two views. Only Dana’s trust did, and it changed everything Dana did.');}};L.$('#tg').appendChild(b);});}},
{part:1,src:'Chapter 1 · A Sneak Preview',run(L){
  L.h(L.kick('learn','What trusted advisors are like')+'<h1 class="q">Think of someone you trust for advice. The book’s list probably matches yours. Tap each card.</h1>');
  L.flips(L.card,[
   ['They get us','They seem to understand us, effortlessly, and they remember what we told them.'],
   ['They tell the truth','They don’t pull their punches, but they criticize gently.'],
   ['It’s our decision','They give options, explain them, recommend one, and let us choose. They don’t force things on us.'],
   ['They show their reasoning','They help us think, not just hand us a conclusion, and they challenge our false assumptions.'],
   ['They stay calm','They don’t panic, and they help us separate logic from emotion.'],
   ['They’re in it for the long haul','The relationship matters more to them than today’s issue. They act like a real person, not someone in a role.']],
   'The book’s point: your clients would write much the same list. To be their trusted advisor, you have to pass as many of these tests as you can, <i>as they see it</i>, not as you see yourself.');}},
{part:1,src:'Chapter 1 · A Sneak Preview',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Dana asks Noor: “Should we close two shops or three?” Which response fits the traits you just saw?</h1>');
  L.mc(L.card,['Name the answer and start drafting the papers','Say it’s a business call, not a legal one','Explain the options, recommend one, let Dana pick'],2,
   'Options, explanation, a recommendation, and Dana keeps the decision. That’s how trusted advisors give advice.',
   'Trusted advisors neither take over the decision nor duck it. They give options, explain them, recommend one, and let the client choose.');}},
{part:1,src:'Chapter 1 · A Sneak Preview',pts:6,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Trusted-advisor move?',['Yes, it fits','No, it misses'],[
   ['Gail threatens to go to the local paper. Dana panics. Noor stays calm and helps Dana sort facts from fears.',0,'Staying calm and separating logic from emotion are classic traits.'],
   ['Noor sees a legal risk in the closure timeline but tells Dana it all looks fine, to keep the mood good.',1,'Trusted advisors don’t pull their punches. Dana needs the truth, told gently.'],
   ['Noor emails Dana only the conclusion: “Do option B.” No reasons.',1,'Give reasoning that helps the client think, not just conclusions.'],
   ['Noor remembers Dana mentioned the board meets in March, and plans around it.',0,'Remembering what the client said shows you were really listening.'],
   ['On every call Noor speaks like a formal memo and never like a person.',1,'Trusted advisors act like a real person, not someone playing a role.'],
   ['Noor asks why Dana is sure all 60 staff will want to leave rather than move to another shop.',0,'Gently challenging a false assumption is something trusted advisors do.']]);}},

/* ---------- PART 3: FOUR LEVELS ---------- */
{part:2,src:'Chapter 2 · What Is a Trusted Advisor?',run(L){
  L.h(L.kick('learn','Four levels')+'<h1 class="q">Nobody starts as a trusted advisor. Relationships climb through four levels.</h1>'+
   L.tiers([['box','1 · Service-based','A vendor doing one specific, one-off task with technical skill. Excellent, but narrow.','Noor checks a Corran contract'],
     ['bulb','2 · Needs-based','The client sees you can solve broader problems, and calls you earlier, while the problem is still being defined.','Dana asks how to handle a tricky staff issue'],
     ['compass','3 · Relationship-based','A valuable resource. You’re consulted on wider strategy, put issues in context and raise them before being asked.','Noor flags a risk Dana hadn’t seen'],
     ['star','4 · Trust-based','The '+L.g('pinnacle','pinnacle')+'. Almost any issue, business or personal, is open. You’re the first call in a crisis, a change, a win or a loss.','Dana calls Noor first',true,'The goal']])+
   '<p class="small" style="margin-top:10px">The book first describes the levels (vendor, problem solver, valuable resource, trusted advisor), then names them as four types of relationship.</p>');
  L.done();}},
{part:2,src:'Chapter 2 · What Is a Trusted Advisor?',run(L){
  L.h(L.kick('learn','Two things move you up')+'<h1 class="q">Level depends on how wide the issues are and how deep the personal side goes</h1>'+
   L.lanes([['layers','Breadth of business issues','How many kinds of business issue the client brings you: one contract, or the whole company’s direction.',1],
            ['people','Depth of personal relationship','How far the client lets you into their <i>personal</i> relationship to the issues and to the business.',2]])+
   L.prose('Marketing people talk about three types of relationship: service-based, needs-based and relationship-based. The book adds a fourth, <b>trust-based</b>. What sets it apart is the human side: the relationship between two individuals.')+
   L.note('<b>Levels 1 and 2 are not wrong.</b> Most professional work happens there. The skill is being able to shift comfortably and quickly to a higher level when the moment needs it.','info'));
  L.done();}},
{part:2,src:'Chapter 2 · What Is a Trusted Advisor?',run(L){
  L.h(L.kick('ex','How Noor could climb')+'<h1 class="q">One client, four levels: what Noor’s work with Dana could look like at each</h1>');
  L.beats(L.card,[
   ['Level 1','Dana emails: “Please check these 60 redundancy letters by Friday.” Noor checks them, well and on time. Narrow issue, no personal side.'],
   ['Level 2','Dana calls before the letters exist: “How should we handle staff who might move to another shop?” Broader, and earlier.'],
   ['Level 3','Noor raises, unasked, how the closures could hurt Corran’s reputation in a small town where it also hires. Noor puts the issue in context.'],
   ['Level 4','Felix hints Dana will carry the blame if the closures go badly. Dana’s first call is to Noor, and they talk about Dana’s own position too.']],
   'Each step widens the issues Dana brings and deepens how personal the conversation can get. Level 4 needs both.');}},
{part:2,src:'Chapter 2 · What Is a Trusted Advisor?',pts:1,run(L){
  L.h(L.kick('try','Put them in order')+'<h1 class="q">Tap the four relationship types from narrowest and least personal to broadest and most personal.</h1>');
  L.order(L.card,['Service-based','Needs-based','Relationship-based','Trust-based'],
   'Service-based, needs-based, relationship-based, then trust-based: wider issues and a deeper personal relationship at each step.',
   ['narrow, impersonal','','','broad, personal']);}},
{part:2,src:'Chapter 2 · What Is a Trusted Advisor?',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which level is this?',['Service-based','Needs-based','Relationship-based','Trust-based'],[
   ['Corran’s payroll lead, who rarely deals with Noor, sends a supplier contract: “Just check clause 7.”',0,'One narrow task, done for technical skill. A vendor relationship.'],
   ['Noor points out, unasked, that the closures may affect Corran’s plan to hire bakers from abroad.',2,'Noor offers advice before being asked and puts the issue in the wider business context.'],
   ['Dana rings Noor late one evening, upset, to think through whether to stay at Corran.',3,'A personal issue, raised first with Noor. That’s the top level.'],
   ['Dana asks Noor to help work out why staff in two shops keep quitting, before deciding what to do.',1,'A broader problem, brought in while it’s still being defined.']]);}},
{part:2,src:'Chapter 2 · What Is a Trusted Advisor?',pts:1,run(L){
  L.h(L.kick('pr','Your call')+'<h1 class="q">Dana needs one standard contract checked by tomorrow. Nothing else. Noor wants to be a trusted advisor. What should Noor do?</h1>');
  L.mc(L.card,['Check it well and fast, and stay open to more','Push for a meeting about Corran’s wider strategy','Pass it to a junior, since it’s low-level work'],0,
   'Level 1 work is not wrong. Doing it well builds the record, and Noor stays ready to move up when Dana needs more.',
   'The book says most work happens at levels 1 and 2, and that’s fine. Forcing a bigger conversation, or treating the task as beneath you, both miss what Dana needs today.');}},

/* ---------- PART 4: THE MINDSET ---------- */
{part:3,src:'Chapter 2 · Characteristics of Successful Trusted Advisors',run(L){
  L.h(L.kick('learn','What trusted advisors believe')+'<h1 class="q">Success comes to those who don’t make it their main goal</h1>'+
   L.prose('The way to be a great advisor, the book says, is to care about your client. Of its ten attributes of trusted advisors, these matter most:')+
   L.list([['eye','Focus on the client, not themselves','Enough self-confidence to listen without pre-judging, curiosity to ask without assuming the answer, and ego strength to put their own ego aside.'],
     ['person','See a person, not a role','Dana is a person with worries, not just “the Head of People”.'],
     ['shield','Value the relationship over the deal','They put keeping the relationship ahead of the current transaction, and often invest before it earns anything.'],
     ['compass','Do the next right thing','They focus on doing the right thing now, rather than chasing a set outcome.'],
     ['flame','Compete to serve','Their drive is aimed at finding new ways to help the client, not at beating rivals.']],3));
  L.done();}},
{part:3,src:'Chapter 2 · Pinnacle Relationships',run(L){
  L.h(L.kick('ex','Stories from the book')+'<h1 class="q">What the pinnacle looks like</h1>');
  L.beats(L.card,[
   ['The agent','A sports agent knew how his star client felt about money and fees. Twice he cut or waived a fee <b>without being asked</b>, because he knew the client wanted it. He believed this is part of why they kept working together.'],
   ['The consultant','A consultant described believing in clients while seeing their flaws: supporting their strengths, helping with their weaknesses, even putting his own credibility on the line for them.'],
   ['The lawyer','A law-firm chair tells of a CEO client who came straight from hospital with his wife. He was terminally ill and asked her to help them both through everything ahead. The legal work was the easy part.'],
   ['The lesson','Not everyone will aim that deep. But the only limits on how far trust can go are the ones the advisor and client set.']],
   'In every story the advisor put the relationship ahead of the current deal, and the client noticed.');}},
{part:3,src:'Chapter 2 · Characteristics of Successful Trusted Advisors',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">During the closures, Noor sees that Corran’s own HR team could draft the standard letters. That would cut Larkmoor’s fee by a third. What would a trusted advisor do?</h1>');
  L.mc(L.card,['Say nothing, since the letters are paid work','Tell Dana, even though the fee will drop','Mention it only if Dana asks about costs'],1,
   'Trusted advisors value the relationship over the current deal. Dana will remember who saved them money.',
   'Keeping quiet protects this month’s fee at the cost of the relationship. Trusted advisors put the relationship first, as the agent did when he cut his fee unasked.');}},
{part:3,src:'Chapter 2 · The Benefits of Being a Trusted Advisor',run(L){
  L.h(L.kick('learn','What the advisor gets')+'<h1 class="q">Trust pays, and it makes the work better</h1>'+
   L.prose('The commercial side is plain: trust brings <b>repeat work</b> from the same client and <b>new work through referrals</b>. It also cuts the busywork of proposals, presentations and activity reports. The book contrasts two (disguised) TV producers:')+
   L.lanes([['star','Thomas','Trusted by a few TV executives. Sells a new show with a two- or three-page note. If they want more, they ask.',2],
            ['list','Atkins','No trusted relationships. Writes huge, polished proposals with budgets and bios. Wins a fraction, makes fewer shows, earns less.',4]])+
   L.prose('Trust also lets you spend your best skills (listening, reasoning, solving, imagining) on things that matter. And, the book says, one of the biggest rewards: both people can simply be who they are, with no posturing.'));
  L.done();}},
{part:3,src:'Chapter 2 · The Benefits of Being a Trusted Advisor',pts:5,run(L){
  L.h(L.kick('pr','Which reward?')+'<h1 class="q">A year on, Noor sees these changes with Corran. Sort each into the reward of trust it shows.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['More work','Less busywork','Being yourself'],[
   ['Dana recommends Noor to a friend who runs HR at a hotel group.',0,'A referral: new work through an existing client.'],
   ['Dana sends Noor the next three disputes without asking other firms.',0,'Repeat business from the same client.'],
   ['Dana approves the next project from a one-page note, no formal proposal.',1,'Like Thomas the producer: no heavy proposal needed.'],
   ['Corran stops asking for weekly activity reports.',1,'Fewer reports to prove you’re working.'],
   ['Noor can say “I’m not sure yet” to Dana without worrying how it looks.',2,'No posturing: both people can be who they are.']],
   'Trust brings more work, less busywork and a more honest working life.');}},
{part:3,src:'Chapter 2 · Getting Started',pts:1,run(L){
  L.h(L.kick('learn','Getting started')+'<h1 class="q">You probably trust yourself more than your clients do</h1>'+
   L.prose('The book cites a study of graduate students and their faculty advisors. Each group rated itself <b>more trustworthy</b> than the other group rated it, and expected the other side to agree. They didn’t.')+
   L.prose('The lesson: many people think they are better at winning trust than they are. Start by being honest about where you stand.')+
   '<div id="sq"><h2 class="sub">Noor would rate their own trustworthiness with Dana 9 out of 10. What does the study suggest?</h2></div>');
  L.mc(L.$('#sq'),['Dana likely trusts Noor more than Noor thinks','Dana likely sees Noor exactly as Noor does','Dana likely sees Noor as less trustworthy than that'],2,
   'Right. Expect a gap, and work to close it. That’s what the rest of this course is for.',
   'In the study, each side overrated how trustworthy the other found them. Noor should expect Dana’s rating to be lower, and work to close the gap.');}}
  ]
});
</script>
</body>
</html>
