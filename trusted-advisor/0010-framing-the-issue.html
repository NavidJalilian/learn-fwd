<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Framing the Issue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0010', title:'Framing the issue', minutes:20, icon:'bulb',
  goals:['Explain what framing is and why it is usually the hardest of the five stages','Tell rational framing from emotional framing, and know when a problem needs the second','Raise an “unsayable” issue with naming and claiming, using caveats and without blame'],
  parts:['What framing is','Rational','Emotional','Naming it'],
  read:'Read chapter 12 of the book for the full dialogue with Fred, Joe’s lost sale, Ellen’s story and the book’s list of caveats.',
  glossary:{
   'rational-framing':'Rational framing: boiling a complex problem down to a few key variables, with a list, a diagram, a process or a model.',
   'emotional-framing':'Emotional framing: bringing hidden feelings or politics into the open when they, not a missing idea, are what keeps a problem stuck.',
   'naming-and-claiming':'Naming and claiming: saying the “unsayable” by (1) acknowledging it is hard to raise, (2) taking responsibility for raising it, (3) stating it directly.',
   'elephant':'Elephant in the parlor: something everyone knows is true but nobody will say out loud.',
   'caveat':'Caveat: a short warning you put before a hard statement, such as “I may have this wrong, but…”, that takes responsibility for raising it.'
  },
  cheatsheet:[
    '<b>Framing</b> turns the client’s tangle of issues and feelings into a clear problem statement that gives a fresh way to see it. A good one is more than halfway to the solution.',
    'It is usually the hardest stage: rational and emotional at once, and often done mid-conversation.',
    '<b>Rational framing</b> boils things down to a few variables. It’s our comfort zone, but only a middle step: without engaging and listening, it falls on deaf ears.',
    'The skill isn’t inventing a new model. It’s helping this client see why a model is relevant to them.',
    '<b>Emotional framing</b> unblocks discussions stuck on feelings or politics. It takes courage, and it’s about the client’s emotions, not yours.',
    '<b>Naming and claiming</b>: say it’s hard to raise, take responsibility for raising it, then say it directly.',
    'Strip out <b>blame</b>. It is a form of self-orientation and gets in the way of a problem anyone can act on.',
    'More risk? Add more <b>caveats</b>, until you slightly overcompensate. Then say what needs saying.'
  ],
  steps:[
/* ---------- PART 1: WHAT FRAMING IS ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">A friend talks for ten minutes about money, their boss and a job offer. Which reply helps them most?</h1>');
  L.mc(L.card,['“You should take the offer, it pays more.”','“It sounds like the real question is whether you trust your boss.”'],1,
   'Before any answer, a clear one-line statement of the real problem helps most. That is framing, the subject of this lesson.',
   'Jumping to an answer may solve the wrong problem. Helping your friend see what the real question is often helps more than any advice.');}},
{part:0,src:'Chapter 12 · Framing the Issue',run(L){
  L.h(L.kick('learn','What framing is')+'<h1 class="q">Turning a tangle into a clear problem</h1>'+
   L.prose(L.g('framing','Framing')+' is the third of the '+L.g('five-stages','five stages')+'. You take the client’s complex issues, <i>and their emotions</i>, and crystallize them into a problem statement that gives a fresh way of thinking about it.')+
   L.flow([['layers','The tangle','dates, staff, Felix, Gail, the town'],['bulb','The frame','one clear statement of the real problem'],['target','The way forward','more than halfway to a solution']])+
   L.prose('The book says an accurate problem statement is often more than halfway to the solution. The heart of the issue is usually something <b>hidden, critical or fundamental</b>, and it usually has an emotional side as well as a rational one.'));
  L.done();}},
{part:0,src:'Chapter 12 · Framing the Issue',run(L){
  L.h(L.kick('learn','Why it’s the hardest stage')+'<h1 class="q">Two kinds of framing, and why both are hard</h1>'+
   L.lanes([['list','Rational framing','Distilling the facts down to a few key variables. Advisors are trained for this.',2],
            ['flame','Emotional framing','Surfacing the hidden feelings or politics that keep a problem stuck. Few advisors are trained for this.',3]])+
   L.prose('The book calls framing usually the hardest of the five stages, and often the most rewarding. Why? It mixes the rational and the emotional so tightly they can’t be separated, and you often have to do it on the spot, in the middle of a conversation.'));
  L.done();}},
{part:0,src:'Chapter 12 · Framing the Issue',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Which of these is Noor <i>framing</i> the issue for Dana?</h1>');
  L.mc(L.card,['“Here’s the redundancy letter template we use.”','“Tell me more about how Gail reacted.”','“The paperwork is easy; the real risk is losing the town’s trust.”'],2,
   'Noor turns Dana’s many worries into one clear, fresh statement of the real problem. That’s framing.',
   'The template is a solution, and asking about Gail is listening. Framing names the real problem in a new way: the town’s trust, not the paperwork.');}},

/* ---------- PART 2: RATIONAL ---------- */
{part:1,src:'Chapter 12 · Rational Framing',run(L){
  L.h(L.kick('learn','Rational framing')+'<h1 class="q">Boil it down to a few key variables</h1>'+
   L.prose(L.g('rational-framing','Rational framing')+' is the advisor’s comfort zone. Lawyers do it all the time: is this a contract issue or a discrimination issue, which rules apply? The book’s example is the famous question of what a president knew, and when.')+
   L.list([['list','A list','The three things that decide the outcome.'],['map','A diagram','Who affects whom, and how.'],['cycle','A process or model','The steps, in order.']],1)+
   L.prose('Why does it work? The human mind can only hold a few things at once. Faced with too much, we go round in circles until someone simplifies the problem. Then progress can start.'));
  L.done();}},
{part:1,src:'Chapter 12 · Rational Framing',run(L){
  L.h(L.kick('learn','Two warnings')+'<h1 class="q">Brilliant framing can still fall flat</h1>'+
   L.tiers([['alert','It’s only a middle step','Rational framing looks like the core of the job, so it’s easy to forget it comes third. Even the sharpest insight falls on deaf ears if you haven’t first earned the right by engaging and listening.','',true,'Most common'],
            ['book','You don’t need a proprietary model','Firms worry about owning their own models. The book says this is misplaced: there are few great truths. The skill is helping <i>this</i> client, with <i>this</i> problem, see why an old (or new) idea is relevant.']]));
  L.done();}},
{part:1,src:'Chapter 12 · Rational Framing',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">Noor frames the site closures, rationally</h1>');
  L.beats(L.card,[
   ['The tangle','After two calls, Dana has mentioned the 30-day consultation, the 60 jobs, selection rules, Felix’s deadline, Gail, the rival bakery that closed, and the local paper.'],
   ['Earned first','Noor has already listened, so Dana is ready to hear a view. Noor doesn’t reach for a clever firm model.'],
   ['The frame','Noor takes a pen and draws three boxes: <b>a fair process</b>, <b>Gail on side</b>, <b>Corran’s name in town</b>. “Everything you’ve told me fits in one of these.”'],
   ['The effect','Dana stops circling. “The first box is yours. The other two are mine, and I’ve been ignoring them.”']],
   'A simple drawing cut a long list to three variables. That only worked because Noor had earned the right first.');}},
{part:1,src:'Chapter 12 · Rational Framing',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">At a first meeting, before Sasha has said much, Noor presents Larkmoor’s neat “four risks of growth” model for Brightwell. What will likely happen?</h1>');
  L.mc(L.card,['It falls flat: Noor hasn’t earned the right yet','It impresses Sasha because it’s proprietary','It works, since rational framing is the core skill'],0,
   'Framing is a middle step. Without engaging and listening first, even a sharp model falls on deaf ears.',
   'Owning the model isn’t what matters, and rational framing isn’t the whole job. Noor skipped engaging and listening, so Sasha isn’t ready to hear it.');}},
{part:1,src:'Chapter 12 · Rational Framing',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Good rational framing, or not?',['Good framing','Not yet'],[
   ['Noor sums up Dana’s twelve worries as three key questions, after a long listening call.',0,'Distilling to a few variables, after earning the right. Textbook.'],
   ['Ines spends a week designing a new branded model before meeting the client.',1,'Inventing a proprietary model misses the point: show the client why an idea is relevant to them.'],
   ['Tomasz uses a well-known checklist and shows Felix how it fits Corran.',0,'An old idea, made relevant to this client and this problem. That’s the skill.'],
   ['Noor opens a first call with Owen Pike by presenting a diagram of Owen’s risks.',1,'Owen hasn’t been engaged or listened to yet, so the diagram will fall on deaf ears.']]);}},

/* ---------- PART 3: EMOTIONAL ---------- */
{part:2,src:'Chapter 12 · Emotional Framing',run(L){
  L.h(L.kick('learn','Emotional framing')+'<h1 class="q">When the problem is feelings, not facts</h1>'+
   L.prose('Sometimes a discussion gets stuck. Ideas stop flowing, people go quiet or whisper. No clever insight will fix it, because the cause is mainly <b>emotional or political</b>.')+
   L.prose(L.g('emotional-framing','Emotional framing')+' breaks the logjam by bringing the hidden issue into the open. The book is clear that solving a client’s problem means dealing with the real emotions around any big decision, not just the technical side.')+
   L.note('It takes courage: you take a personal risk. But it’s easier than it looks once you remember it’s about the <b>client’s</b> emotions, not yours. You only have to deal with theirs.','shield'));
  L.done();}},
{part:2,src:'Chapter 12 · Emotional Framing',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">David and the partner nobody wanted to confront</h1>');
  L.beats(L.card,[
   ['The meeting','David is helping a professional firm’s executive committee set new standards for all partners. Everyone agrees a standard means nothing if it isn’t enforced.'],
   ['The signals','On the surface all is well. But people shift in their seats and whisper. David senses something is going on.'],
   ['Naming it','He asks Fred, one of the whisperers, if there’s a complication he doesn’t know about. Fred admits it: enforcing this means confronting their most powerful partner.'],
   ['The real issue','Who will do it? Fred says the managing partner, Tom. Tom agrees, but only if the whole committee backs him. Fred points out Tom has never done such a thing.'],
   ['The reframe','David says none of them have, and that’s the point. The question isn’t whether the plan is good; it’s whether they have the courage to see it through.']],
   'Earlier in his career, David says, he wouldn’t have dared raise it. It would have stayed in hallway gossip, and the firm would have made no progress.');}},
{part:2,src:'Chapter 12 · Emotional Framing',pts:1,
 solve:async L=>{L.$('#jc').children[1].click();L.$('#jr').click();},
 run(L){
  let p=null;const C=['Lighten the mood: “No problem, outplacement will handle them.”','Pause and stay with the sadness: “This is weighing on you.”'];
  L.h(L.kick('pr','Predict, then see')+'<h1 class="q">Joe, a friend of the authors, is close to winning a big restructuring job. Near the end of the meeting, the CEO leans back and asks, sadly:</h1>'+
   L.quote('Joe, what are we gonna do about all those people?','the CEO, in a story from chapter 12')+
   '<h2 class="sub">Thousands of jobs will go. What should Joe do?</h2><div id="jc"></div><div id="jo"></div>');
  C.forEach((c,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=c;b.onclick=()=>{if(p!==null)return;p=j;b.classList.add('sel');
    L.$('#jo').innerHTML='<button class="btn pri" id="jr" style="margin-top:12px">'+L.ic('play')+'See what Joe did</button>';
    L.$('#jr').onclick=function(){this.remove();L.award(p===1);
      L.sheet(p===1?'ok':'no',p===1?'Yes, and Joe wishes he had':'That’s what Joe did, and he regrets it',
       'Joe chose the joke. He covered up the CEO’s sadness, and knew at once it was wrong. The meeting ended without a decision, the next one never happened, and the restructuring came years later with two to three times the job losses. Joe holds himself partly responsible: he lacked the courage to help the CEO face the emotion when it surfaced.');
      L.done();};};L.$('#jc').appendChild(b);});}},
{part:2,src:'Chapter 12 · Ellen’s Story',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">Ellen and the red-faced controller</h1>');
  L.beats(L.card,[
   ['The moment','Ellen, an accounting partner, is giving bad news to a client’s controller. His face goes red and his knuckles go white.'],
   ['The fear','Her mind races: get out of here, there goes the account.'],
   ['The choice','Instead she pauses, takes a breath, simply tells him he looks angry, and waits in silence.'],
   ['The truth','He shouts that he isn’t, then admits he is: angry at his own people, embarrassed that she had to bring it to him, and glad she did.'],
   ['The payoff','Ellen learns the truth and drops her fears. The client lets off steam, puts the real problem into words, and the two move toward a solution together.']],
   'Ellen focused on her client’s mind, not her own. She treated his red face and clenched fists as <b>facts about him</b>, not as judgments about her.');}},
{part:2,src:'Chapter 12 · Ellen’s Story',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">What made Ellen’s move work?</h1>');
  L.mc(L.card,['She softened the bad news so he wouldn’t get upset','She had been right about the numbers all along','She treated his signals as facts about him, and said so'],2,
   'The book stresses it wasn’t about being right. Ellen made a simple observation about her client, not herself, and waited.',
   'The book says the point isn’t that Ellen was right, and she didn’t soften anything. She named what she saw in him and let him respond.');}},
{part:2,src:'Chapter 12 · Emotional Framing',pts:1,run(L){
  L.h(L.kick('pr','Your turn')+'<h1 class="q">Noor explains the consultation rules. Felix’s jaw tightens and Felix stops looking at Noor. What should Noor do?</h1>');
  L.mc(L.card,['Note that Felix seems frustrated, then wait in silence','Speed up to get the bad part over with quickly','Add more legal detail to show it’s not Noor’s fault'],0,
   'Like Ellen, Noor treats the signals as facts about Felix, names them simply, and lets Felix say what’s really going on.',
   'Rushing is Ellen’s temptation, running from her own fear. Piling on detail to defend yourself is about you, not the client. Name what you see in Felix, then wait.');}},

/* ---------- PART 4: NAMING IT ---------- */
{part:3,src:'Chapter 12 · Naming and Claiming',run(L){
  L.h(L.kick('learn','Naming and claiming')+'<h1 class="q">A technique for saying the “unsayable”</h1>'+
   L.prose(L.g('naming-and-claiming','Naming and claiming')+' is the book’s tool for emotional framing. It has three parts:')+
   L.list([['Acknowledge the difficulty','Say that this is hard to raise.'],['Take responsibility','Own the fact that you are the one raising it.'],['State it directly','Then say the issue itself, plainly.']],3)+
   L.prose('It’s made for the '+L.g('elephant','elephant in the parlor')+': the thing everyone knows but nobody says, where the awkwardness of staying silent has grown bigger than the original problem. Only emotional framing can deal with it.'));
  L.done();}},
{part:3,src:'Chapter 12 · Naming and Claiming',pts:1,run(L){
  L.h(L.kick('try','Put in order')+'<h1 class="q">Everyone at Corran knows Gail goes around Dana straight to Felix. Nobody says it. Put Noor’s words in the naming-and-claiming order.</h1>');
  L.order(L.card,['“This is awkward to bring up, and I’ve hesitated.”','“That’s on me, and I may have it wrong.”','“Gail’s decisions are reaching Felix without going through Dana.”'],
   'Acknowledge the difficulty, take responsibility, then state it directly. The first two parts make the third safe to hear.',['Acknowledge','Claim','State']);}},
{part:3,src:'Chapter 12 · Framing and Blaming',run(L){
  L.h(L.kick('learn','Framing and blaming')+'<h1 class="q">First attempts at framing are usually full of blame</h1>'+
   L.prose('Clients often frame problems like this: “Marketing won’t listen to me.” “We need better training.” “It won’t work unless the CEO backs it.” Each one points at someone else.')+
   L.prose('The book says blame gets in the way of framing, and of advising in general. Even when blame is “justified,” it is useless at best. It protects the ego of the one doing the blaming, which makes it another form of '+L.g('self-orientation','self-orientation')+'.')+
   L.note('The goal is a <b>blame-free problem statement</b> the client can own, act on and move past. The shift is from defending yourself to taking responsibility.','scale'));
  L.done();}},
{part:3,src:'Chapter 12 · Framing and Blaming',pts:6,run(L){
  L.h(L.kick('pr','Blame or frame?')+'<h1 class="q">Sort these problem statements from the Corran closures.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Blames someone','Blame-free frame'],[
   ['“Gail is sabotaging the plan.”',0,'It names a villain, so the only “fix” is Gail changing.'],
   ['“We haven’t found a role for Gail in shaping the closures.”',1,'It describes a gap anyone can act on, Gail included.'],
   ['“Felix never gives us enough time.”',0,'It shifts the problem onto Felix and protects the speaker.'],
   ['“The timeline and a fair consultation pull against each other.”',1,'It names the tension without a culprit, so everyone can work on it.'],
   ['“Ines’s research caused the invoice problem.”',0,'Even if true, blame wastes energy that could go into fixing it.'],
   ['“We never agreed what was in scope for that bill.”',1,'It owns a shared gap that both sides can close next time.']],
   'Blame protects someone’s ego. A blame-free frame turns the same facts into a problem everyone can own and solve.');}},
{part:3,src:'Chapter 12 · How to Implement Emotional Framing',run(L){
  L.h(L.kick('learn','How to do it')+'<h1 class="q">Use caveats to take the risk out</h1>'+
   L.prose('People often say, “My situation is different, there’s a lot at stake.” The book agrees it’s not play, which is exactly why it matters. Oddly, taking responsibility with naming and claiming actually <b>lowers</b> your personal risk.')+
   L.prose('The trick is '+L.g('caveat','caveats')+': short phrases that say the issue is hard to raise and that you own raising it. In the spirit of the book’s list:')+
   L.flow([['info','“I may have missed something, but…”',''],['info','“I’m not sure how to put this…”',''],['info','“This might be off point, but…”','']],false)+
   L.prose('The rule: <b>more risk, more caveats</b>. String them together until you’ve slightly overcompensated for the risk. Then say what needs saying. (The book notes these are all lines TV detective Columbo would use.)'));
  L.done();}},
{part:3,src:'Chapter 12 · How to Implement Emotional Framing',pts:1,
 solve:async L=>{const c=L.$('#cv').children;c[0].click();c[1].click();c[2].click();L.$('#say').click();},
 run(L){
  const CV=['“I may have misread things, but…”','“I’m not sure how to say this, so bear with me…”','“I could be out of line raising this…”','“You’ve probably seen this already, but…”'];
  const RISK=3;let n=0,first=true;
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Noor needs to tell Felix, with Dana present, that Felix overruling Dana in front of staff is making the closures harder. High risk. Add caveats, then say it.</h1>'+
   '<div class="meterrow"><div class="lb">Risk</div><div class="meter"><div style="width:65%;background:var(--no)"></div></div></div>'+
   '<div class="meterrow"><div class="lb">Cushion</div><div class="meter"><div id="cm" style="width:0%;background:var(--ok-strong)"></div></div></div>'+
   '<div id="cv" style="margin-top:10px"></div><div id="said" class="small" style="margin:8px 0;min-height:20px"></div>'+
   '<button class="btn pri" id="say">'+L.ic('chat')+'Say it</button><div id="sf"></div>');
  const draw=()=>{L.$('#cm').style.width=(n*25)+'%';};
  CV.forEach(c=>{const b=document.createElement('button');b.className='chip';b.textContent=c;b.onclick=()=>{if(b.classList.contains('sel'))return;b.classList.add('sel');n++;draw();L.$('#said').textContent=n+' caveat'+(n>1?'s':'')+' added';};L.$('#cv').appendChild(b);});
  L.$('#say').onclick=()=>{L.$('#sf').innerHTML='';
    if(n>=RISK){if(first)L.award(true);first=false;L.$('#say').remove();
      L.sheet('ok','Felix hears it','With the cushion just above the risk bar, Noor says it plainly: “Overruling Dana in front of staff is making the closures harder.” Felix bristles, then asks what Noor would do. The caveats didn’t water the message down; they made it safe to hear.');L.done();}
    else{if(first)L.award(false);first=false;L.fb(L.$('#sf'),'<b>Too bare.</b> With '+n+' caveat'+(n===1?'':'s')+', the cushion is below the risk. Felix is likely to hear an attack. Add more, then try again.','no');}};}},
{part:3,src:'Chapter 12 · Naming and Claiming',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which part of naming and claiming is missing?',['Acknowledge the difficulty','Take responsibility','State it directly'],[
   ['“This is hard to say, and it’s my call to raise it. I just feel there’s… something with the team?”',2,'Two good caveats, then no clear statement. Say the issue plainly.'],
   ['“I’ll own raising this. Dana isn’t being consulted on decisions about their own team.”',0,'Responsibility and a clear statement, but no word that it’s hard to raise. Add that first.'],
   ['“This is awkward. But everyone thinks Gail is running this, not Dana.”',1,'“Everyone thinks” hides behind others. Take responsibility: “I may be wrong, but I see…”'],
   ['“I don’t know how to put this. Felix, the deadline is scaring staff into quitting early.”',1,'It acknowledges difficulty and states the issue, but Noor never owns raising it.']]);}}
  ]
});
</script>
</body>
</html>
