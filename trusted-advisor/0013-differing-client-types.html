<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">

<body>

<script>
Course.lesson({
  id:'0013', title:'Differing client types', minutes:20, icon:'people',
  goals:['Prepare for what is different about this client before you walk in','Read a client’s motivation, personality and organization, and adapt to them','Recognize the book’s difficult client types and respond to each one well'],
  parts:['Prepare','Read the client','Trust fit','Difficult types'],
  read:'Read chapter 16 of the book for all nine difficult client types and the sample reply the authors suggest for each.',
  glossary:{
   'archetype':'Archetype: a broad pattern of behavior used as a thinking aid. Real clients are always more complicated than the pattern.',
   'naming-and-claiming':'Naming and claiming: saying the “unsayable” by (1) acknowledging it is hard to raise, (2) taking responsibility for raising it, (3) stating it directly.'
  },
  cheatsheet:[
    'Clients are not all alike. Before each meeting, work out <b>what is different about this client</b>, and about you in this situation.',
    'Ask delicate questions <b>in advance</b>: topics to avoid, where views are divided, where resistance will come from, what else is already under way.',
    'Read every client on three things: <b>motivation</b>, <b>personality</b>, and <b>the state of their organization</b>. Then adapt your style to how they like to be dealt with.',
    'Four motivations: the need to <b>excel</b>, to <b>act</b>, to <b>understand</b> before deciding, or to <b>drive consensus</b>.',
    'Find something you can <b>truly like</b> in the client. If you can’t, that’s a big hint they may not be the right client for you.',
    'Clients weight the trust equation differently. Many start with credibility and reliability; if they don’t move on to intimacy and self-orientation, <b>you lead</b>.',
    'The nine difficult types are <b>archetypes</b>, not boxes. Each one has a fitting response: clarify and confirm, anticipate, offer hypotheses, ask to hear more, and so on.'
  ],
  steps:[
/* ---------- PART 1: PREPARE ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">A trainer has given the same workshop at five companies, and it went well every time. Company six books it. How much new preparation does the trainer need?</h1>');
  L.mc(L.card,['None: the workshop is proven, so just repeat it','Some: find out what is different about company six'],1,
   'A proven workshop can still crash if this room is different. This lesson is about preparing for the client in front of you, not the average one.',
   'Five good runs prove the material, not the room. Company six may have tensions the others didn’t. The book’s first rule is to find out what’s different.');}},
{part:0,src:'Chapter 16 · Differing Client Types',run(L){
  L.h(L.kick('learn','Clients are not all alike')+'<h1 class="q">The danger: assuming every client is the same</h1>'+
   L.prose('The authors warn that it’s tempting to generalize about clients, and that doing so is wrong. Clients differ a lot, so you need to recognize the type in front of you and adjust.')+
   L.prose('Their first guiding principle: <b>work out in advance what is different about this client</b>, and what might be different about <i>you</i> in this situation.')+
   L.lanes([['star','Your best clients','Where were you most successful? Take one lesson from that with you.',2],
            ['alert','Your worst clients','Where were you least successful? Take one lesson from that too.',3]])+
   '<p class="small" style="margin-top:10px">The book says to carry at least one lesson from each with you every time you visit a client.</p>');
  L.done();}},
{part:0,src:'Chapter 16 · Differing Client Types',run(L){
  L.h(L.kick('ex','Two stories from the book')+'<h1 class="q">Two experienced advisors walk into rooms they didn’t understand</h1>');
  L.beats(L.card,[
   ['Rob’s invitation','A founding partner of a consulting firm invites Rob to speak at the firm’s offsite on giving advice to clients. Rob prepares a lively 90-minute session.'],
   ['What nobody said','The other two founders don’t know why Rob is there, and the firm is deeply split on how to present itself to clients. Nobody briefs Rob. The host introduces him briefly and leaves.'],
   ['The crash','Five minutes in, a founder challenges the whole premise of the session. The debate eats most of the hour, and Rob’s session never gets going.'],
   ['David’s retreat','David facilitates a client’s annual retreat for the third year running. He assumes he knows the group. This year it is divided, nobody tells him, and the meeting is a disaster.'],
   ['The real lesson','David’s first instinct is to blame the client for not briefing him. He then sees it was <b>his</b> professional job to find out beforehand, even at the risk of seeming pushy.']],
   'Trusted advisors don’t assign blame. They take responsibility for the process, which means asking delicate questions <b>before</b> the meeting.');}},
{part:0,src:'Chapter 16 · Differing Client Types',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Which question did the book say David should have asked his contact before the retreat?</h1>');
  L.mc(L.card,['How long should my opening talk be this year?','On which topics are your colleagues sharply divided?','Would you like the same format as last year?'],1,
   'That question surfaces the split that wrecked the retreat. The book’s other delicate questions: topics to avoid, where resistance will come from, and what else is already under way.',
   'Format and timing are routine questions. The book’s point is to ask the <i>delicate</i> ones: where views are divided, what to avoid, where resistance lies, and what else is going on.');}},
{part:0,src:'Chapter 16 · Differing Client Types',pts:1,
 solve:async L=>{L.$('#ba').click();L.$('#bb').click();},
 run(L){
  const seen=new Set();
  L.h(L.kick('pr','Toggle and compare')+'<h1 class="q">Dana asks Noor to run a one-hour session on Corran’s new grievance process at the annual shop managers’ day. Noor has run it at two other clients. Try both versions.</h1>'+
   '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="ba">'+L.ic('play')+'Noor walks in as usual</button><button class="btn" id="bb">'+L.ic('chat')+'Noor calls Dana first</button></div>'+
   '<div class="res" id="out" style="background:var(--soft);border-radius:16px;padding:14px;margin:12px 0;min-height:90px"><span class="small">Pick a version above.</span></div><div id="cq"></div>');
  const V={ba:'<b>Walks in as usual.</b> Ten minutes in, Gail and two regional managers argue that the new process shouldn’t exist at all. The closures come up, tempers rise, and the hour becomes a debate. Noor leaves thinking “Dana should have warned me.”',
           bb:'<b>Calls Dana first</b> and asks: Is anything too delicate for a big room? Where are views divided? Where will resistance come from? Is anything else under way that touches this? Dana mentions Gail opposes the process and the closures are still raw. Noor meets Gail beforehand and keeps the closures out of the room.'};
  ['ba','bb'].forEach(id=>{L.$('#'+id).onclick=()=>{seen.add(id);L.$('#out').innerHTML=V[id];
    if(seen.size===2&&!L.$('#cq').innerHTML){const q=L.$('#cq');q.innerHTML='<h2 class="sub">In the first version, whose job was it to find out about Gail?</h2>';
      L.mc(q,['Dana’s: the client should brief the advisor','Noor’s: the advisor should seek it out'],1,
       'Just like David, Noor owns the success of the session. Asking delicate questions in advance is part of the job.',
       'It feels fair to blame Dana, which is exactly David’s first instinct in the book. The book says finding out beforehand is the advisor’s professional obligation.');}};});}},

/* ---------- PART 2: READ THE CLIENT ---------- */
{part:1,src:'Chapter 16 · Differing Client Types',run(L){
  L.h(L.kick('learn','Three questions about every client')+'<h1 class="q">Read the person before you choose your approach</h1>'+
   L.prose('The book’s second principle: as you look at a client, make yourself answer three questions.')+
   L.flow([['flame','Motivation','What drives this person most?','',1],['person','Personality','Reflective or fast-moving?','',2],['layers','Organization','How does its state shape their view?','',3]])+
   L.prose('Then ask the question that matters: <b>how do I adapt my style to deal with this person the way they like to be dealt with?</b>'));
  L.done();}},
{part:1,src:'Chapter 16 · Differing Client Types',run(L){
  L.h(L.kick('learn','Motivation, personality, organization')+'<h1 class="q">What to look for in each</h1>'+
   L.list([['flame','Four motivations','Which comes first for this client: the need to <b>excel</b>, to <b>act</b> and get results, to <b>understand</b> and analyze before deciding, or to <b>drive consensus</b>? Aim your conversation at that outcome.'],
     ['person','Personality','Some people are reflective; others enjoy fast exchanges. Sometimes you can play off a colleague; sometimes you adjust yourself. Adjust, but don’t fake it: find the real part of you that can empathize here.'],
     ['layers','Organization','People change with their setting. An optimist can turn cautious in a new company, or seem to change personality with a new role.']],1));
  L.done();}},
{part:1,src:'Chapter 16 · Differing Client Types',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">Noor reads Dana with the three questions</h1>');
  L.beats(L.card,[
   ['Motivation','Dana rarely acts alone. Felix, the board and regional managers like Gail all need to be on board. Dana’s first need is to <b>drive consensus</b>.'],
   ['Personality','Practical and stretched thin. Dana likes short calls before 9 am, not long meetings.'],
   ['Organization','The board is pushing on costs and Felix is impatient. That makes Dana guarded: a mistake would land on Dana.'],
   ['Adapt','Noor stops sending long memos. Instead: a short early call, two or three options Dana can take to Felix and Gail, and a note on who might object to each.']],
   'Same law, different delivery. Noor shapes the advice around how Dana works and what Dana needs.');}},
{part:1,src:'Chapter 16 · Differing Client Types',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Sasha, Brightwell’s COO, asks for data on every option and says: “I won’t decide until I see how the numbers compare.” Which motivation comes first for Sasha?</h1>');
  L.mc(L.card,['The need to take action and get results','The need to drive consensus in the team','The need to understand and analyze first'],2,
   'Sasha wants to analyze before deciding. So Noor should bring comparisons and evidence, not a push to sign.',
   'Sasha isn’t rushing to act or polling colleagues. Wanting to see how the numbers compare before deciding is the need to understand and analyze.');}},
{part:1,src:'Chapter 16 · Differing Client Types',pts:5,run(L){
  L.h(L.kick('pr','Whose motivation?')+'<h1 class="q">Sort each client remark by the motivation that seems to come first.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Excel','Act','Understand','Consensus'],[
   ['Felix: “Skip the background. What do we do on Monday?”',1,'Felix wants action and results now.'],
   ['Sasha: “Walk me through how you reached that view.”',2,'Sasha wants to follow the reasoning before deciding.'],
   ['Dana: “I need Gail and finance comfortable before this goes up.”',3,'Dana is building agreement across the organization.'],
   ['Owen: “I want our wholesale contracts to be the best in the industry.”',0,'Owen is driven to excel, so talk about what “best” would look like.'],
   ['Dana: “Can you join a call with the regional managers first?”',3,'Bringing the managers along before deciding is consensus-building.']],
   'Once you know which comes first, aim the conversation at that outcome: excellence, action, analysis or agreement.');}},
{part:1,src:'Chapter 16 · Differing Client Types',run(L){
  L.h(L.kick('learn','Find what you like')+'<h1 class="q">Look for a real reason to like this client as a person</h1>'+
   L.prose('The fourth principle: find something special, fun, meaningful or engaging about the client that you can relate to. You don’t have to like everything about them. One real thing to focus on makes it easier to behave well.')+
   L.note('<b>If nothing comes to mind,</b> the book reads that as a big hint that this probably isn’t the right client for you, and that no amount of adjusting your personality will fix it.','alert')+
   '<p class="prose" style="margin-top:16px">The authors stress this isn’t stereotyping. It points you to the clients you are most likely to connect with and be a trusted advisor to.</p>');
  L.done();}},
{part:1,src:'Chapter 16 · Differing Client Types',pts:1,run(L){
  L.h(L.kick('pr','What should Noor do?')+'<h1 class="q">Noor finds Felix curt and cold, and dreads their monthly call. What does the book suggest Noor do first?</h1>');
  L.mc(L.card,['Act warmer on the calls and hope Felix warms up too','Look for one real thing to like, such as Felix’s pride in the shops','Ask Tomasz to take over the Felix calls straight away'],1,
   'One genuine point of connection makes it easier to behave well with Felix. Only if Noor finds nothing is it a sign the fit is wrong.',
   'Faking warmth isn’t the book’s advice, and handing Felix over skips the first step. The book says to find something you can truly like; only if nothing comes is it a hint the fit is wrong.');}},

/* ---------- PART 3: TRUST FIT ---------- */
{part:2,src:'Chapter 16 · Differing Client Types',run(L){
  L.h(L.kick('learn','Use the trust equation')+'<h1 class="q">Clients weight the four factors differently</h1>'+
   L.prose('The fifth principle: use the '+L.g('trust-equation','trust equation')+'. Not every client gives each factor the same weight.')+
   L.flow([['shield','Entry factors','Many clients first check '+L.g('credibility','credibility')+' and '+L.g('reliability','reliability')+'.','',2],['chat','Then the rest','Only after that do they deal with '+L.g('intimacy','intimacy')+' and '+L.g('self-orientation','self-orientation')+'.','',3]])+
   L.prose('For some clients the first phase lasts much longer. Clients at ease with intimacy and self-orientation will signal it early. The others may never lead the way there, but they still need to go. <b>You do the leading.</b>'));
  L.done();}},
{part:2,src:'Chapter 16 · Differing Client Types',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">Noor asks the book’s four questions about Sasha</h1>');
  L.beats(L.card,[
   ['Credibility','How much does Sasha value Larkmoor for clear, unbiased opinions? <b>A lot.</b> Sasha asks for sample advice and checks every claim.'],
   ['Reliability','How much does Sasha value a track record of doing what was promised? <b>A lot, but there is none yet.</b> The last firm’s surprise bills still sting.'],
   ['Intimacy','How much does Sasha value being able to say anything without embarrassment? <b>Not shown yet.</b> Sasha keeps to facts and fees.'],
   ['Self-orientation','How much does Sasha value knowing Larkmoor is on Brightwell’s side? <b>Hidden, but huge.</b> It’s the reason the last firm was dropped.'],
   ['Plan','Noor meets the credibility and reliability tests first. Then, rather than waiting, Noor gently raises the real worry: “After your last firm, what would make you feel we’re on your side?”']],
   'Sasha won’t lead the way to intimacy and self-orientation. That doesn’t mean Sasha doesn’t need to go there. Noor leads.');}},
{part:2,src:'Chapter 16 · Differing Client Types',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Sasha has spent three meetings on credentials, fees and references, and never mentions the bad experience with the last firm. What should Noor take from that?</h1>');
  L.mc(L.card,['Sasha doesn’t care about trust beyond credentials','Sasha may need Noor to lead toward deeper topics','Noor should push for a personal talk at once'],1,
   'Some clients stay in the credibility and reliability phase longer. They still need to get to intimacy and self-orientation; the advisor leads them there.',
   'Staying on credentials doesn’t mean the deeper factors don’t matter, and forcing it early skips the entry factors. The book says to meet those first, then lead the way.');}},
{part:2,src:'Chapter 16 · Differing Client Types',pts:4,run(L){
  L.h(L.kick('pr','Which factor are they weighing?')+'<h1 class="q">Each client is testing one part of the trust equation. Which one?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Credibility','Reliability','Intimacy','Self-orientation'],[
   ['Sasha asks Noor to explain a recent tribunal ruling in plain words.',0,'Sasha is testing whether Noor’s opinions are clear and sound.'],
   ['Dana says, “You always call back before nine, like you said you would.”',1,'Dana values the track record of promises kept.'],
   ['Dana admits fearing Felix will blame them if the closures go badly.',2,'Dana feels safe sharing a personal worry. That’s intimacy.'],
   ['Sasha asks whether Larkmoor earns more if Brightwell picks the longer option.',3,'Sasha is checking whose interests Noor is serving.']],
   'Knowing which factor a client is weighing tells you what to show next, and where you may need to lead.');}},
{part:2,src:'Chapter 16 · Differing Client Types',run(L){
  L.h(L.kick('learn','The five stages differ too')+'<h1 class="q">Clients also lean on different stages of trust building</h1>'+
   L.prose('The same goes for the '+L.g('five-stages','five stages')+'. A few patterns the book describes:')+
   L.list([['person','Want to be understood','Clients who prize being understood may let you move fast through the later steps.'],
     ['chat','Rich communicators','Clients who simply enjoy deep listening: get to the real issues quickly. It’s low risk and they’ll appreciate it.'],
     ['scale','Highly rational','They lean on '+L.g('framing','framing')+': hypotheses, points of view, a whiteboard. Emotional framing fits a <i>situation</i> more than a person; do it in private, with care.'],
     ['eye','Skeptics and creatives','Structured '+L.g('envisioning','envisioning')+' helps both: it firms up benefits for skeptics, and frees creative types to imagine.'],
     ['alert','Jump to action','The book discourages it. Action should grow out of the earlier stages.']],2));
  L.done();}},
{part:2,src:'Chapter 16 · Differing Client Types',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'What fits this client right now?',['Get to real issues fast','Rational framing','Emotional framing, in private','Slow down the rush to act'],[
   ['Owen wants a night-shift action plan on day one, before anyone has looked at the problem.',3,'The book discourages jumping to action. Action should grow out of listening, framing and envisioning.'],
   ['Sasha likes hypotheses and asks Noor to lay out a point of view on a whiteboard.',1,'Highly rational clients lean on framing with hypotheses and points of view.'],
   ['Dana is upset and embarrassed after Felix criticized them in front of the board.',2,'Emotional framing fits this moment. Do it one-to-one and with care.'],
   ['A Brightwell clinic lead loves long, open conversations and says exactly what they think.',0,'Rich communicators appreciate it when you get to the real issues quickly.']]);}},

/* ---------- PART 4: DIFFICULT TYPES ---------- */
{part:3,src:'Chapter 16 · Some Difficult Client Types, and How to Respond',run(L){
  L.h(L.kick('learn','Nine difficult client types')+'<h1 class="q">Patterns to recognize, not boxes to put people in</h1>'+
   L.prose('The book offers nine '+L.g('archetype','archetypes')+' of difficult client behavior. Tap each to see what’s going on and how to respond.'));
  L.flips(L.card,[
   ['“Just the Facts, Ma’am”','Blunt, “don’t sell me.” Often a plea to be understood, sometimes a fear of being wronged. <b>Clarify and confirm</b> in their language.'],
   ['“I’ll Get Back to You”','Nervous about deciding on the spot. <b>Anticipate</b> it: make it easy to take away, think over and confide in you.'],
   ['“You’re the Expert, Dummy”','Wants to dominate: “just give me the answer.” Don’t call the bluff. Offer <b>several hypotheses</b> and ask to explore a bit more.'],
   ['“Let Me Handle That”','Keeps you away from the politics: a sign they don’t trust you, or anyone. <b>Earn the right</b>; ask to hear more; maybe name job security privately.'],
   ['“Let’s Go Through This Again”','Lives in the details, often to stay in control. <b>Frame via alternatives</b> so the big picture feels controllable.'],
   ['“You Don’t Understand”','Wants to feel special. Don’t argue. <b>Agree and ask</b> them to help you learn what’s different here.'],
   ['“My Enemy’s Enemy Is My Friend”','Loves politics. Don’t criticize it: <b>treat politics as content</b>, discussed openly, in private, with an agenda.'],
   ['“Just Like, You Know, Come On”','Not strong with words. <b>Write something up</b> with options they can rank. More open questions won’t help.'],
   ['“Oh, By the Way”','You keep being left out. Probably a label, not dislike. Ask for a <b>private meeting</b> and use naming and claiming.']],
   'Each type has a fitting move. The next screens put them to work at Larkmoor.');}},
{part:3,src:'Chapter 16 · Some Difficult Client Types, and How to Respond',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">Felix plays “Just the Facts, Ma’am”</h1>');
  L.beats(L.card,[
   ['Felix','“Give me facts, not a pitch. Why does this cost so much? I run this company.”'],
   ['Old Noor','Defends the fee line by line and lists Larkmoor’s credentials. Felix gets shorter and colder.'],
   ['What’s really going on','The book says not to be fooled by the content. This is a plea to be understood, and it may hide a fear of being wrong or overcharged.'],
   ['Clarify and confirm','Noor: “Understood. You want no small talk, a straight answer, and something useful every time we speak. Is that right?”'],
   ['Then live it','Felix says yes. Noor keeps every call short and to the point, and checks again now and then that it still works for Felix.']],
   'Speak the client’s language, not yours. Confirm what they value, then behave that way.');}},
{part:3,src:'Chapter 16 · Some Difficult Client Types, and How to Respond',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">At the end of a good meeting Sasha says: “This sounds fine, but I can’t promise anything. I need to think and talk to our CEO.” What fits best?</h1>');
  L.mc(L.card,['Press gently for a yes before Sasha leaves the room','Offer a free extra session to win Sasha over today','Hand over a one-page summary and say it’s fine to take time'],2,
   'That’s the “I’ll Get Back to You” client. Plan for it, make it easy to take away and discuss, and let Sasha know they can come to you in confidence.',
   'This client is cautious and dislikes deciding on the spot. Pushing or sweetening the deal adds pressure. The book says to anticipate it and make it easy.');}},
{part:3,src:'Chapter 16 · Some Difficult Client Types, and How to Respond',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Best response?',['Agree, ask them to teach you','Offer a few hypotheses','Write up options to rank','Treat politics as content','Frame via alternatives'],[
   ['A Brightwell clinic manager: “You lawyers don’t get physio clinics. You’re not from our world.”',0,'The “You Don’t Understand” client wants to feel special. Don’t argue; ask them to help you see what’s different.'],
   ['Felix, after a rough board meeting: “I can’t keep educating you. You’re the expert. What’s the answer?”',1,'The “You’re the Expert, Dummy” client. Don’t call the bluff; give value as several hypotheses and ask to explore a little more.'],
   ['Owen: “Just, you know, make the night-shift thing work. Write up what I said.”',2,'The “Just Like, You Know, Come On” client. Take a stab at a draft with options Owen can rank. More open questions won’t help.'],
   ['Gail: “What does Dana really think? And don’t mention this to Felix.”',3,'The “My Enemy’s Enemy” client. Don’t criticize it. Discuss the politics openly, in private, with an agenda and pros and cons.'],
   ['Dana, on draft five of the grievance policy: “The nuances are what kill you.”',4,'The “Let’s Go Through This Again” client. Ask how to split time between big picture and detail, so the big picture feels controllable.']]);}},
{part:3,src:'Chapter 16 · Some Difficult Client Types, and How to Respond',pts:1,run(L){
  L.h(L.kick('pr','What should Noor say?')+'<h1 class="q">Dana: “Your plan for Gail is good, but you don’t know the politics. Gail would chew you up. Give it to me and I’ll handle Gail.” Noor’s best first reply?</h1>');
  L.mc(L.card,['“I really think I should be in that room with Gail.”','“Fine, it’s your call. Here is the plan for you to use.”','“I see some of that. Could you tell me more about it?”'],2,
   'This is the “Let Me Handle That” client, a sign Dana doesn’t fully trust Noor yet. Ask to hear more and keep earning the right. If it persists, a private naming-and-claiming talk may help.',
   'Insisting fights Dana’s distrust head-on, and handing it over gives up without learning why. The book suggests asking to hear more, then using the trust skills to earn the right.');}},
{part:3,src:'Chapter 16 · Some Difficult Client Types, and How to Respond',pts:1,run(L){
  L.h(L.kick('pr','Build the reply')+'<h1 class="q">Dana: “Oh, by the way, we met the overseas recruiters last week. I should have invited you.” It’s the fifth time Noor has been left out. Tap each piece until the plan is right.</h1>');
  L.sentence(L.card,[['Ask Dana for','Ask Felix for','Ask Rafa for'],['a private meeting,','a word at the board meeting,','a fee discount,'],['assume Dana dislikes Noor,','assume Noor is being labeled,'],['and say Larkmoor is great at immigration work.','and say Noor is missing data needed to help.']],[0,0,1,1],
   [['Going over Dana’s head to Felix would damage trust badly.','Rafa can’t fix how Dana sees Noor. This is Noor’s conversation with Dana.'],['A public setting would embarrass Dana. The book says to ask for a private meeting.','A discount has nothing to do with being left out.'],['The book says to assume a label first, here “only the contracts lawyer”. If Dana disliked Noor, Dana would likely say so.'],['Phrases like “we’re great at” are exactly what to cut. This client doesn’t care what Larkmoor wants yet.']],
   'Private meeting, assume a label, then name and claim: “This is awkward for me too, but what would I need to do to be in the loop?”');}}
  ]
});
</script>
</body>
</html>
