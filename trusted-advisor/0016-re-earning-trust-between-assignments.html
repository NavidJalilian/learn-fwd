<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Re-earning Trust Between Assignments</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0016', title:'Re-earning trust between assignments', minutes:20, icon:'cycle',
  goals:['Explain what clients complain about, and what they want, between pieces of work','Stay in touch in ways that are useful, not salesy or social','Build a firm-wide relationship by managing it, not carrying it alone'],
  parts:['What clients say','What clients want','Stay in touch','The whole firm'],
  read:'Read chapter 20 of the book for the full list of client suggestions and the role of the relationship manager.',
  glossary:{
   'on-spec':'On spec: unpaid early work in a new area, done before anyone asks, to show the client what you could do for them.',
   'relationship-manager':'Relationship manager: the person in a professional firm responsible for the firm’s whole relationship with one key client, bringing in colleagues from other specialties.',
   'institutional-relationship':'Institutional relationship: a relationship between a whole firm and a client organization, built from many personal relationships held to the same standard.'
  },
  cheatsheet:[
    'Client complaints: <b>only selling</b>, taken for granted, generic issues, and being “romanced” instead of helped.',
    'Clients want you to <b>keep earning</b> their future business with your own unbilled time, not a sales pitch.',
    'Write a relationship plan, not a sales plan. Clients can tell the difference.',
    'What they want: impact on their business, work on spec, help thinking, a view of their future, your analysis of their data.',
    'Stay in touch without a live project. Calling only when you want something destroys trust. It’s never too late.',
    'Trust is personal, but a firm can build an <b>institutional relationship</b>: many contacts, one consistent standard.',
    'A relationship manager <b>manages</b> the relationship: brings colleagues in, coaches the team, acts as the client’s advocate.',
    'It’s an investment: set aside unbilled time and judge it over the long term.'
  ],
  steps:[
/* ---------- PART 1: WHAT CLIENTS SAY ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">One garage contacts you only with special offers. Another emails once to warn that a part on your model is often faulty. Which garage do you trust more?</h1>');
  L.mc(L.card,['The one that warned you about the part','The one that sends you special offers'],0,
   'The warning cost them time and earned them nothing that day. That’s exactly why it builds trust. This lesson is about staying useful between jobs.',
   'Offers are about what the garage wants to sell. The warning was about your car. Most people trust the garage that was useful with nothing to sell, and that’s this lesson.');}},
{part:0,src:'Chapter 20 · Re-earning Trust Away from the Current Assignment',run(L){
  L.h(L.kick('learn','What clients complain about')+'<h1 class="q">David asked clients about their advisors. The same four complaints kept coming up.</h1>'+
   L.tiers([['trend','They only want to sell','They want to sell their services, not solve our problems.'],
            ['clock','We’re taken for granted','They never call to ask how our business is doing. We see them when they want to sell something.'],
            ['list','Generic issues','They bring the issues every company faces. We want to hear about our own chances and challenges.'],
            ['star','Don’t romance us','We get plenty of fancy dinners and sports invitations. Be useful to us, not our friend.']])+
   L.prose('The conclusion: clients want you to <b>keep earning</b> their future business. They don’t want a sales pitch. They want you to invest your own unbilled time in the relationship.'));
  L.done();}},
{part:0,src:'Chapter 20 · Re-earning Trust Away from the Current Assignment',run(L){
  L.h(L.kick('ex','Larkmoor asks its clients')+'<h1 class="q">Tomasz interviews Dana about working with Larkmoor</h1>');
  L.beats(L.card,[
   ['The setup','Larkmoor’s leaders want to know how key clients see the firm. Tomasz, not Noor, interviews Dana, so Dana can speak freely.'],
   ['Dana on contact','“Between jobs, we hear from you when there’s a new service to buy. Nobody asks how the shops are doing.”'],
   ['Dana on content','“The newsletter is fine, but it’s the same one every client gets. I want to hear about bakeries, about us.”'],
   ['Dana on hospitality','“The box at the football was kind. I didn’t go. I don’t need a night out; I need fewer surprises.”'],
   ['What it adds up to','Noor reads the notes and winces. Larkmoor’s “Corran plan” is a list of services to offer. It is a sales plan, and Dana can tell.']],
   'Every complaint has the same root: contact that serves the firm, not the client.');}},
{part:0,src:'Chapter 20 · Re-earning Trust Away from the Current Assignment',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">From all these complaints, what does the book conclude clients want between assignments?</h1>');
  L.mc(L.card,['More invitations to firm events and dinners','A clearer menu of the firm’s other services','Advisors who keep earning the next piece of work'],2,
   'Clients don’t want a pitch or a night out. They want you to keep earning their business, with your own unbilled time.',
   'The complaints reject both selling and “romancing”. The book’s conclusion is that clients want you to keep earning their future business.');}},
{part:0,src:'Chapter 20 · Re-earning Trust Away from the Current Assignment',pts:6,run(L){
  L.h(L.kick('pr','Relationship plan or sales plan?')+'<h1 class="q">Noor rewrites Larkmoor’s “Corran plan”. Sort each line.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Relationship plan','Sales plan'],[
   ['Ask Dana each quarter how the shops and staff are doing',0,'Interest in the client’s business, with nothing to sell. The opposite of being taken for granted.'],
   ['Target: two new matters from Corran by year end',1,'That’s a fee target. It starts from what Larkmoor wants.'],
   ['Send Dana a note on how a new ruling affects bakery shift work',0,'Specific to Corran’s business, not a generic issue.'],
   ['Offer Felix seats at the next football match',1,'That’s “romancing”. The book’s clients said they get plenty of that.'],
   ['Present Larkmoor’s full service brochure at the next meeting',1,'Leading with what you sell is the top client complaint.'],
   ['Spend a morning learning how Corran’s production site works',0,'Unbilled time invested in understanding the client. That’s what clients asked for.']],
   'A relationship plan starts from the client’s business. A sales plan starts from the firm’s targets. Clients see the difference at once.');}},

/* ---------- PART 2: WHAT CLIENTS WANT ---------- */
{part:1,src:'Chapter 20 · What Clients Want',run(L){
  L.h(L.kick('learn','What clients ask for')+'<h1 class="q">Know our business deeply, and bring us ideas</h1>'+
   L.list([['target','Make an impact','Make a difference to our business; don’t just be visible.'],
     ['bulb','Work on spec and help us think','Invest time in early work in new areas ('+L.g('on-spec','on spec')+'). Help us think and form strategy. Tell us where our business is heading.'],
     ['flask','Use our data','Jump on new information. Ask for our data and give us an extra level of analysis.'],
     ['people','Get close to how we work','Join our brainstorms and offsite meetings. Sit in on our meetings.'],
     ['scale','Show us the outside world','How do we compare to others? Why are our competitors doing what they’re doing?']],1)+
   L.prose('The common thread: serious effort to know the client’s business, and offering ideas without being asked. Some happens back at the office. Much needs more <b>unpaid</b> contact, in settings where both sides can discuss and explore.'));
  L.done();}},
{part:1,src:'Chapter 20 · What Clients Want',run(L){
  L.h(L.kick('learn','Partner, not friend')+'<h1 class="q">The good news hidden in the complaints</h1>'+
   L.quote('Clients want a business partner, not a false friend.','Maister, Green and Galford, chapter 20')+
   L.lanes([['star','False friend','Dinners, tickets and charm, with the next sale in mind. Clients say they already have plenty.',3],
            ['people','Business partner','Time spent on their real issues: their numbers, their market, their plans.',2]])+
   L.prose('And the good news: clients clearly <b>do</b> want new ideas from you, and they <b>want</b> a relationship. The door is open, as long as you walk in to be useful.'));
  L.done();}},
{part:1,src:'Chapter 20 · What Clients Want',pts:1,
 solve:async L=>{const c=L.$('#bd').children;[0,1,2,3].forEach(i=>c[i].click());L.$('#rx').click();},
 run(L){
  const I=[['Analyze the staff turnover figures Dana mentioned',4,1,'Dana: “Nobody has ever done that with our own numbers.”'],
           ['Sit in on a Corran shop managers’ meeting',3,1,'Dana: “You saw how it really works. That’s rare.”'],
           ['Brief Dana on why the rival bakery is hiring abroad',2,1,'Dana: “That answers the question Felix keeps asking me.”'],
           ['Join a brainstorm on next year’s staffing plans',3,1,'Dana: “Good to think this through with someone outside.”'],
           ['Seats in Larkmoor’s box at the football',3,0,'Dana: “Kind, but I won’t go.” Romancing, not helping.'],
           ['Add Corran to the monthly firm newsletter',1,0,'Dana: “Same as everyone gets.” Generic, not specific.'],
           ['A lunch to pitch Larkmoor’s new HR training',2,0,'Dana: “So that’s why you called.” Selling, not solving.']];
  const on=I.map(()=>false);let first=true;
  const hrs=()=>I.reduce((a,x,j)=>a+(on[j]?x[1]:0),0);
  L.h(L.kick('pr','Spend the hours')+'<h1 class="q">Noor has 12 unbilled hours for Corran next quarter. Choose how to spend them, then see how Dana reacts.</h1><div id="bd"></div>'+
   '<div class="meterrow" style="margin-top:12px"><div class="lb" id="hl">0 of 12 hours</div><div class="meter"><div id="hm" style="width:0;background:var(--h2)"></div></div></div>'+
   '<button class="btn pri" id="rx" style="margin-top:12px">'+L.ic('play')+'See Dana’s reaction</button><div id="rf"></div>');
  const draw=()=>{const h=hrs();L.$('#hl').textContent=h+' of 12 hours';L.$('#hm').style.width=Math.round(h/12*100)+'%';};
  I.forEach((x,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=x[0]+' · '+x[1]+'h';
    b.onclick=()=>{L.$('#rf').innerHTML='';if(!on[j]&&hrs()+x[1]>12){L.fb(L.$('#rf'),'<b>Over budget.</b> Drop something first.','no');return;}
      on[j]=!on[j];b.classList.toggle('sel',on[j]);draw();};L.$('#bd').appendChild(b);});
  draw();
  L.$('#rx').onclick=()=>{const ch=I.filter((x,j)=>on[j]);if(!ch.length){L.fb(L.$('#rf'),'Choose at least one thing first.','no');return;}
    const bad=ch.filter(x=>!x[2]).length,good=ch.length-bad,ok=bad===0&&good>=3;
    const list=ch.map(x=>'<div class="small" style="margin:4px 0">'+L.ic(x[2]?'check':'x')+' '+x[3]+'</div>').join('');
    if(ok){if(first)L.award(true);L.sheet(first?'ok':'info',first?'Dana feels it':'That’s the mix','Every hour went on Corran’s own business: its data, its meetings, its competitors, its plans. That’s what clients told David they wanted.'+list);L.$('#rx').remove();L.done();}
    else{if(first)L.award(false);first=false;L.fb(L.$('#rf'),'<b>Not yet.</b> '+(bad?'Some hours went on selling, romancing or generic contact. ':'Use more of the budget on Corran’s own business. ')+'Change your picks and try again.'+list,'no');}};}},
{part:1,src:'Chapter 20 · What Clients Want',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Which of Noor’s ideas best fits “make an impact on our business, don’t just be visible”?</h1>');
  L.mc(L.card,['Show up at every Corran event and shake hands','Work out why Corran’s night shifts lose staff','Send Dana a short note each month to stay in mind'],1,
   'Working on a real problem in Corran’s business makes a difference. Being seen around doesn’t, on its own.',
   'Turning up and keeping in mind are about being visible. Clients asked for impact: something that actually changes things for their business.');}},
{part:1,src:'Chapter 20 · What Clients Want',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Business partner or false friend?',['Business partner','False friend'],[
   ['Noor asks Dana for Corran’s absence figures, unprompted, and spots a pattern in two shops.',0,'Asking for the client’s data and adding analysis is high on the client wish list.'],
   ['Larkmoor sends Felix a hamper and a card at New Year, and nothing else all year.',1,'Pleasant, but it’s charm, not usefulness.'],
   ['Noor tells Felix how other food chains handle staff shortages, and how Corran compares.',0,'Clients asked to see how they compare to others, inside and outside their industry.'],
   ['Ines invites Dana to a wine tasting to “keep the relationship warm”.',1,'Romancing. Dana has said a night out isn’t what Corran needs.'],
   ['Noor drafts, unpaid, a rough outline of what Corran’s staffing could look like in five years.',0,'Leading their thinking about the future, on spec. Exactly what clients asked for.']]);}},

/* ---------- PART 3: STAY IN TOUCH ---------- */
{part:2,src:'Chapter 20 · Stay in Touch',run(L){
  L.h(L.kick('learn','Stay in touch')+'<h1 class="q">The project ends. The relationship doesn’t have to.</h1>'+
   L.prose('Many advisors feel they’re imposing if they call when there’s no live project. Remember Rebecca from lesson 12, who never called her happy client again.')+
   L.flow([['x','Only call to ask','Nothing destroys trust faster than calling only when you want something.','',3],['cycle','Check in regularly','Great advisors stay in contact even with no work underway.','',2],['clock','Never too late','Harder as time passes, but you can always reconnect.','',1]])+
   L.prose('The impact of your work goes on long after you leave. As long as you keep checking in, the book says, the project is never really over.'));
  L.done();}},
{part:2,src:'Chapter 20 · Stay in Touch',run(L){
  L.h(L.kick('ex','A relationship gone quiet')+'<h1 class="q">Noor and a client from three years ago</h1>');
  L.beats(L.card,[
   ['The past','Three years ago Noor did a big restructuring job for Marta, HR lead at Ashgrove Dairy. It went well. Then Noor never called again.'],
   ['The doubt','Noor thinks: “It’s been too long. Calling now will look like I want work.”'],
   ['Tomasz','“Harder, yes. Too late, never. Call with something useful to Ashgrove, not to Larkmoor.”'],
   ['The call','Noor calls about the new holiday-pay ruling, which affects dairies with seasonal staff. No pitch, no ask.'],
   ['The result','Marta: “I wondered what happened to you.” They book a coffee. No new work yet, but the door is open again.']],
   'It’s never too late to reconnect, and the way back in is the same as staying in: be useful.');}},
{part:2,src:'Chapter 20 · Stay in Touch',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">After the Brightwell review ends, Ines says: “If Sasha needs us, Sasha will call. Let’s not bother them.” What does the book say?</h1>');
  L.mc(L.card,['Right: calling without a project looks pushy','Keep in touch, even with no work underway','Wait a year, then call to ask for new work'],1,
   'Great advisors stay in regular contact between projects. Waiting, then calling only to ask for work, is what destroys trust.',
   'The book says the instinct not to impose is mistaken, and that calling only when you want something destroys trust. Stay in touch regularly.');}},
{part:2,src:'Chapter 20 · Stay in Touch',pts:1,run(L){
  L.h(L.kick('pr','Build the check-in')+'<h1 class="q">The closures are long done and Corran has gone quiet. Tap each piece until this is a check-in Dana would welcome.</h1>');
  L.sentence(L.card,[['Hi Dana, it’s been a while, so','Hi Dana, I’m writing because'],['I saw a rival is hiring bakers abroad','Larkmoor has a new HR training package','we’d love to host you at the football'],['and wanted to tell you all about it.','and wondered what it means for Corran.'],['Happy to talk it through, no charge.','Shall I send over a quote?']],[1,0,1,0],
   [['“It’s been a while” makes the call about the gap, not about anything useful to Dana.'],['A new package is selling, the top client complaint.','That’s romancing. Dana has said a night out isn’t needed.'],['Telling Dana all about it makes it a pitch. Asking what it means for Corran keeps it about them.'],['A quote turns a useful check-in into a sale.']],
   'Specific to Corran, about Corran, with nothing to buy. That’s staying in touch the way clients asked for.');}},

/* ---------- PART 4: THE WHOLE FIRM ---------- */
{part:3,src:'Chapter 20 · Creating Institutional Relationships',run(L){
  L.h(L.kick('learn','Can a firm be trusted?')+'<h1 class="q">Trust is personal, but a firm-wide relationship is still possible</h1>'+
   L.prose('Big firms often want an '+L.g('institutional-relationship','institutional relationship')+' with a big client. The book says trust is personal, not institutional, but that doesn’t make the goal impossible. It just takes more than one partner charming a few top people.')+
   L.list([['people','Many people','Everyone who serves the client shapes the relationship, so you need many contacts.'],
     ['scale','One standard','If each person behaves differently, there’s no firm-wide reputation. Everyone must be reliable to the same standard.'],
     ['eye','Juniors see first','The client’s CEO and head office are often among the last to hear of new issues. Junior and field staff know first, and the firm’s juniors who work with them are best placed to spot new needs.']],2));
  L.done();}},
{part:3,src:'Chapter 20 · Creating Institutional Relationships',run(L){
  L.h(L.kick('learn','The relationship manager')+'<h1 class="q">Manage the relationship. Don’t try to carry it alone.</h1>'+
   L.prose('Many firms name a '+L.g('relationship-manager','relationship manager')+' for each key client. Done well, this person acts as the <b>client’s representative inside the firm</b>, even the client’s advocate, making sure the firm’s resources go to the client’s problems.')+
   L.lanes([['x','Less effective','Sees the role as selling more fees. Tries to build every trusted relationship personally.',3],
            ['check','More effective','Focuses on the long-term relationship. Creates chances for colleagues to meet other client people and build their own trust.',2]])+
   L.note('Two ways the book suggests: offer free internal seminars at the client, or send a colleague to a client’s internal meeting at no charge. Both are low-stress, non-selling settings.','people'));
  L.done();}},
{part:3,src:'Chapter 20 · Creating Institutional Relationships',run(L){
  L.h(L.kick('ex','Noor takes on Corran')+'<h1 class="q">Larkmoor names Noor relationship manager for Corran</h1>');
  L.beats(L.card,[
   ['First instinct','Noor plans to be Corran’s only contact: every call, every email, every meeting. “That way nothing slips.”'],
   ['Tomasz','“Then Corran trusts you, not Larkmoor. And you’ll only ever hear what Dana and Felix hear.”'],
   ['A new plan','Noor brings Ines to run part of the free grievance session at the shop managers’ day, and to stay for lunch with the managers.'],
   ['What Ines hears','Two shop managers tell Ines that bakers are quietly leaving for the rival that pays night-shift extras. Head office hasn’t noticed yet.'],
   ['The payoff','Ines raises it with Noor, who brings it to Dana as a real, specific issue. Ines now has relationships of their own at Corran.']],
   'The relationship manager’s job is to open doors for the team. Juniors in the field often hear first.');}},
{part:3,src:'Chapter 20 · Creating Institutional Relationships',run(L){
  L.h(L.kick('learn','Coach the team, fund the effort')+'<h1 class="q">A relationship manager spends real time on their own colleagues</h1>'+
   L.list([['flame','Give the work meaning','Help the team see the challenge and drama in this client’s problems. Busy people lose sight of it.'],
     ['star','Make them look good','Give team members visible client exposure, even at the cost of your own ego, so they build their own relationships.'],
     ['check','Serve them first','Help colleagues before you need them. Serve the team well and the team will serve the client.'],
     ['book','Keep them informed','Have someone summarize and circulate news and reports on the client’s industry, so everyone stays up to date.']],4)+
   L.prose('All this is an <b>investment</b>. Firms must set aside unbilled time and judge it over a longer period than their usual fee targets allow. The book argues it pays: clients want it, and it grows the firm.'));
  L.done();}},
{part:3,src:'Chapter 20 · Creating Institutional Relationships',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">At Corran, who is likely to hear about a new staffing problem first?</h1>');
  L.mc(L.card,['Shop managers and the juniors who work with them','Felix, since everything reaches the CEO','Noor, as the relationship manager'],0,
   'The book says the client’s CEO and head office are often among the last to know. Field staff, and the firm’s juniors who deal with them, hear first.',
   'The book says the opposite of the obvious: CEOs and head office often learn last. Field staff and the firm’s juniors who work with them hear first.');}},
{part:3,src:'Chapter 20 · Creating Institutional Relationships',pts:6,run(L){
  L.h(L.kick('pr','Managing or missing the point?')+'<h1 class="q">How is Noor doing as Corran’s relationship manager? Sort each move.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Good relationship managing','Missing the point'],[
   ['Noor offers to send a Larkmoor colleague to Corran’s internal HR meeting, free',0,'A non-selling way for new people to meet and start new relationships.'],
   ['Noor judges success by how many new fees Corran brings in this year',1,'Relationship managers focused on fees are less well accepted by clients, and less effective.'],
   ['Noor lets Ines present the findings to Felix, and makes sure Felix knows it was Ines’s work',0,'Making the team look good, even at a cost to your own ego.'],
   ['Noor insists all Corran contact goes through Noor alone',1,'Trying to build the relationship alone is, the book says, usually a mistake.'],
   ['Noor pushes Larkmoor to fix Corran’s billing problem, even though it costs the firm',0,'Acting as the client’s advocate inside the firm. If the client’s needs are met, the firm benefits.'],
   ['Each Larkmoor lawyer serves Corran in their own style, to their own standards',1,'A firm-wide reputation needs one consistent standard of service.']],
   'Manage, don’t carry it alone. Advocate for the client, build up the team, and keep one standard.');}},
{part:3,src:'Chapter 20 · Creating Institutional Relationships',pts:1,run(L){
  L.h(L.kick('pr','What should Tomasz say?')+'<h1 class="q">Larkmoor’s managing partner wants Noor’s Corran work to show a fee increase within six months, or the unbilled hours stop. What fits the book?</h1>');
  L.mc(L.card,['Agree, since unbilled time must pay back quickly','Cut the unbilled hours and just do excellent paid work','Treat it as an investment, judged over a longer period'],2,
   'The book says relationship management needs real unbilled budgets and a longer view than usual fee systems allow.',
   'The book calls relationship management an investment that needs unbilled time and a longer-term view than the usual fee targets. Six months of pressure for fees turns it back into selling.');}}
  ]
});
</script>
</body>
</html>
