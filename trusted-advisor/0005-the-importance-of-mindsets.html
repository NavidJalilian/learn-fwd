<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Importance of Mindsets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0005', title:'The importance of mindsets', minutes:18, icon:'compass',
  goals:['Notice when your attention drifts from the client to yourself','Tell self-confidence from ego strength, and use both','Ask curious questions and work with clients as fellow professionals'],
  parts:['Focus on them','What gets in the way','Confidence and ego','Curiosity'],
  read:'Read chapter 6 of the book for Tim’s meeting, Joe Sherman’s calm advisor and the full case for inclusive professionalism.',
  glossary:{
   'ego-strength':'Ego strength: being able to focus on the work with the client instead of on who gets the credit or the blame.',
   'inclusive-professionalism':'Inclusive professionalism: treating professionalism as something you share with the client, working with them, rather than something that sets you apart from them.'
  },
  cheatsheet:[
    'Skills are not enough. A trusted advisor also needs five <b>mindsets</b>: focus on the other person, self-confidence, ego strength, curiosity, inclusive professionalism.',
    '<b>Focus on the other person</b>: help them get what they want, and you get more of what you want.',
    'Two blocks: believing <b>technical skill is enough</b>, and a busy head full of “how do I look?” thoughts. Under those thoughts there is usually <b>fear</b>.',
    'The move from <b>technician to advisor</b> needs new skills: clients want their problem <i>understood</i>, emotions and politics included, before it is solved.',
    '<b>Self-confidence</b>: trust that you will still find the answer after you listen. Don’t rush to it.',
    '<b>Ego strength</b>: forget credit and blame. Taking <i>all</i> the responsibility is self-focus too.',
    '<b>Curiosity</b>: focus on what you don’t know. The answer gets better as the questions reshape the problem.',
    '<b>Inclusive professionalism</b>: align with the client and share responsibility. Avoid “us versus them” habits.'
  ],
  steps:[
/* ---------- PART 1: FOCUS ON THEM ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">You meet two new people at a dinner. One spends the evening telling you about their work. The other asks about you and listens. A week later, who do you call for help with a problem?</h1>');
  L.mc(L.card,['The one who talked about their work','The one who asked about you'],1,
   'Most of us trust the person who paid attention to us. This lesson is about the inner habits that make that easy, or hard.',
   'Impressive stories are easy to forget. People turn to the one who paid attention to them. This lesson is about the inner habits behind that.');}},
{part:0,src:'Chapter 6 · The Importance of Mindsets',run(L){
  L.h(L.kick('learn','Skills need mindsets')+'<h1 class="q">The last lessons were about skills. This one is about what goes on inside your head.</h1>'+
   L.prose('Earning trust, giving advice and building relationships are skills. The book says skills alone won’t do it. You also need the right <b>mindsets</b>: habits of attitude that shape what you notice and how you act.')+
   L.list([['people','Focus on the other person','Your attention is on them, not on you.'],
     ['shield','Self-confidence','Enough calm to listen before you solve.'],
     ['scale','Ego strength','Not caring who gets the credit or the blame.'],
     ['eye','Curiosity','Wanting to know what you don’t know yet.'],
     ['layers','Inclusive professionalism','Working with the client, not above them.']],1));
  L.done();}},
{part:0,src:'Chapter 6 · Focus on the Other Person',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">A newspaper boss who led by watching faces</h1>');
  L.beats(L.card,[
   ['The meeting','Charlie watched Tim White, a newspaper publisher, run an offsite meeting with his dozen managers.'],
   ['What Tim did','He hardly gave opinions or made technical points. Mostly he looked around the table, reading faces.'],
   ['What Tim said','Things like “Joe, you don’t agree with that, do you?” He named what people seemed to feel.'],
   ['The result','Decisions got made, and everyone felt consulted and that the process was fair. Tim had strong views and real expertise. He simply spent his attention on other people.'],
   ['Why it matters','The book says staying focused on others, amid all the distractions, is the hard part. It depends less on business tools than on your own psychology.']],
   L.quote('High-content results almost entirely through low-content leadership.','The authors, on Tim White'));}},
{part:0,src:'Chapter 6 · Focus on the Other Person',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Noor joins a Corran meeting about the closures. Gail, the regional manager, sits with folded arms and says nothing. What would Tim do?</h1>');
  L.mc(L.card,['Restate the legal deadlines more firmly','Say “Gail, you have doubts about this, don’t you?”'],1,
   'Tim spent his attention on reading people and naming what they seemed to feel. Gail’s silence is the most important thing in the room.',
   'More facts won’t reach Gail. Tim’s move is to notice what someone feels and invite it out: “Gail, you have doubts, don’t you?”');}},

/* ---------- PART 2: WHAT GETS IN THE WAY ---------- */
{part:1,src:'Chapter 6 · Impediments to Being Client-Focused',run(L){
  L.h(L.kick('learn','Two big blocks')+'<h1 class="q">Why is it so hard to keep your attention on the client?</h1>'+
   L.prose('<b>Block 1: believing technical skill is enough.</b> The book calls this the main obstacle. It’s odd, since serving clients depends so much on people skills. One CEO the book quotes put it simply: you can train people in content more easily than in working together.')+
   L.prose('<b>Block 2: a busy head.</b> While the client talks, our own thoughts take over:')+
   L.flow([['pencil','Solving','“How will I fix this?”'],['chat','Planning','“What do I say next?”'],['star','Looking good','“How do I seem expert?”']],false)+
   L.note('Strip those thoughts back and you usually find <b>fear</b>: of embarrassment, of failing, of looking ignorant, of losing your reputation or security.','alert'));
  L.done();}},
{part:1,src:'Chapter 6 · Impediments to Being Client-Focused',run(L){
  L.h(L.kick('learn','From technician to advisor')+'<h1 class="q">The habits that made you successful can start holding you back</h1>'+
   L.prose('Professionals tend to be high achievers who beat their fears with skill and hard work. Early in a career, that’s exactly what gets rewarded. Then the job changes.')+
   L.lanes([['box','As a technician','You provide research, analysis and recommendations. Most of it happens <i>away</i> from the client.',3],
            ['people','As an advisor','You work <i>with</i> the client, in person, to help them see things anew or make a decision.',2]])+
   L.prose('This needs new skills and new mindsets. Many find it unsettling that the client first wants the problem <b>understood</b>, with all its emotions and politics, before it gets solved. Some never get past this, and the old fears come back.'));
  L.done();}},
{part:1,src:'Chapter 6 · Impediments to Being Client-Focused',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">Charlie’s first call with a new CEO</h1>');
  L.beats(L.card,[
   ['Before the call','Charlie was referred to a new client. Preparing for the first call with the CEO, he spent a lot of time worrying about how he would come across.'],
   ['After the call','The consultant who referred him had spoken with the CEO. The CEO’s questions to her were: did Charlie like the project, and did Charlie like <i>him</i>?'],
   ['The point','Both of them were thinking about themselves. Charlie was focused on Charlie; the CEO was focused on the CEO.']],
   'We are all overfocused on ourselves, even people who teach this. The book calls learning to focus on others a lifelong project, not a single decision.');}},
{part:1,src:'Chapter 6 · Impediments to Being Client-Focused',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">While Dana talks, Noor keeps thinking, “I must not look like I missed something.” What does the chapter say usually lies under thoughts like this?</h1>');
  L.mc(L.card,['Some form of fear, such as looking ignorant','Not enough preparation before the meeting'],0,
   'Right. Thoughts about looking expert or not slipping up usually grow from fear: of embarrassment, failure or looking incompetent.',
   'Preparation isn’t the issue here. The book says these thoughts usually grow from fear: of embarrassment, failure or looking incompetent.');}},
{part:1,src:'Chapter 6 · Impediments to Being Client-Focused',pts:1,
 solve:async L=>{const c=L.$('#mode').children;c[0].click();c[1].click();},
 run(L){
  const D=['We need the letters for all 60 staff by the 14th.','Felix wants this done quickly and quietly.','Honestly, if it goes wrong, I’m the one Felix will blame.','And Gail is telling the shop managers it’s a mistake.'];
  const T=[null,'How do I sound expert on this?','What will I say when Dana stops?','Will the fee estimate hold?'];
  const seen=new Set();
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Dana calls Noor about the closures. Switch Noor’s head between the two modes and read what gets through.</h1><div id="mode"></div>'+
   '<div style="background:var(--soft);border-radius:16px;padding:14px;margin:8px 0 6px;min-height:150px" id="talk"><div class="small">Choose a mode above.</div></div><div id="aq"></div>');
  const draw=j=>{L.$('#talk').innerHTML='<div class="small" style="margin-bottom:8px">Dana says…</div>'+D.map((d,x)=>{const hide=j===0&&T[x];
      return '<div style="margin:0 0 10px">'+(hide?'<div class="small" style="color:var(--no)">'+L.ic('alert')+' Noor thinks: “'+T[x]+'”</div>':'')+'<div style="'+(hide?'opacity:.25;text-decoration:line-through':'')+'">“'+d+'”</div></div>';}).join('')+
      '<div class="small"><b>'+(j===0?'1 of 4':'4 of 4')+'</b> sentences actually reached Noor</div>';};
  ['Busy head','Mind on Dana'].forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.innerHTML=L.ic(j?'people':'alert')+n;
    b.onclick=()=>{[...L.$('#mode').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(j);draw(j);
      if(seen.size===2&&!L.$('#aq').innerHTML){const q=L.$('#aq');q.innerHTML='<h2 class="sub">What did busy-head Noor miss that matters most?</h2>';
        L.mc(q,['The deadline for the 60 letters','Dana’s fear of being blamed'],1,
         'The deadline got through either way. Dana’s fear of Felix is the real issue, and only a quiet mind catches it.',
         'The deadline was the one thing that got through. What Noor missed was Dana’s fear of Felix, the real issue underneath.');}};
    L.$('#mode').appendChild(b);});}},
{part:1,src:'Chapter 6 · Impediments to Being Client-Focused',pts:6,run(L){
  L.h(L.kick('pr','Whose side is that thought on?')+'<h1 class="q">Sort what goes through Noor’s head in meetings at Corran.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['On Dana','On Noor'],[
   ['“How can I show I know this law cold?”',1,'Wanting to seem expert puts the attention on Noor.'],
   ['“What is Dana worried about but hasn’t said?”',0,'That’s attention on Dana’s unspoken concerns.'],
   ['“I need my answer ready the moment Dana stops.”',1,'Planning your reply means you stop hearing the client.'],
   ['“Who else at Corran does this land on?”',0,'That’s curiosity about Dana’s world and its politics.'],
   ['“Will they think I’m too junior for Felix?”',1,'Worrying about your image is a classic form of fear.'],
   ['“What would a good outcome look like for Dana?”',0,'That keeps the focus on what Dana wants to achieve.']],
   'Every thought on the right takes attention away from Dana. The fix isn’t more knowledge; it’s noticing the drift and coming back.');}},

/* ---------- PART 3: CONFIDENCE AND EGO ---------- */
{part:2,src:'Chapter 6 · Self-Confidence',run(L){
  L.h(L.kick('learn','Self-confidence')+'<h1 class="q">It takes confidence <i>not</i> to give the answer yet</h1>'+
   L.prose('Insecurity, the opposite of self-confidence, causes many trust problems. The most common one: jumping too soon to the answer.')+
   L.prose('Clients want to be understood before they are ready for advice. We know that. But waiting takes confidence: believing that after you listen and think together, you will <b>still have the time and talent</b> to find the technical answer.')+
   L.note('You don’t need huge confidence. Just enough to spend your limited attention on listening, instead of using it all on solving right away.','shield'));
  L.done();}},
{part:2,src:'Chapter 6 · Ego Strength',run(L){
  L.h(L.kick('learn','Ego strength')+'<h1 class="q">Ego strength is not the same as self-confidence</h1>'+
   L.prose(L.g('ego-strength','Ego strength')+' means focusing on the work with the client, not on who gets the <b>credit</b> or the <b>blame</b>. It can go wrong in three ways and right in one:')+
   L.tiers([['star','Grabbing credit','Wanting your name on every win.','self-focused'],
            ['alert','Blaming others','Pointing at people or circumstances. The book calls this a fast route to failing as an advisor.','self-focused'],
            ['flame','Taking all the blame','Feeling responsible for everything. A psychologist found consultants so prone to this they’d blame themselves if rain spoiled the company picnic.','self-focused too'],
            ['scale','Ego strength','Taking real responsibility, then putting your attention on the matter at hand.','client-focused',true,'The aim']]));
  L.done();}},
{part:2,src:'Chapter 6 · Ego Strength',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">The advisor who stayed calm in a shouting match</h1>');
  L.beats(L.card,[
   ['The clash','Joe Sherman, an investment firm’s managing director, had a bitter ethical dispute with someone. He brought his advisor to the showdown.'],
   ['Joe','Joe was so emotionally caught up he could barely contain his anger.'],
   ['The advisor','The advisor just listened to the other person’s tirades. Calm and direct, they didn’t join in the venom, and steered the talk where it needed to go.'],
   ['Afterward','From then on, Joe gave that advisor all of his business and personal matters.']],
   'With no need to win, look good or hit back, the advisor could focus on what Joe needed. That is ego strength.');}},
{part:2,src:'Chapter 6 · Self-Confidence',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Dana mentions Gail’s resistance. Within ten seconds, Ines starts explaining the legal options. Which mindset is Ines short of?</h1>');
  L.mc(L.card,['Self-confidence','Ego strength','Inclusive professionalism'],0,
   'Rushing to the answer is the classic sign of insecurity. Confidence means trusting the answer will still be there after listening.',
   'This is about timing, not credit or the client relationship. Rushing to the answer is the book’s main example of low self-confidence.');}},
{part:2,src:'Chapter 6 · Ego Strength',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which mindset is missing?',['Self-confidence','Ego strength','Focus on the other person'],[
   ['A redundancy letter went out with a typo. Noor emails Dana three long apologies and loses sleep over it for a week.',1,'Taking all the responsibility is still about Noor, not about fixing things for Dana.'],
   ['Felix praises the closure plan. Ines quickly points out it was mostly Ines’s idea.',1,'Chasing credit pulls attention onto Ines.'],
   ['Before Dana has finished describing the problem, Noor offers a full solution.',0,'Noor doesn’t trust the answer will still come after listening.'],
   ['Gail snaps at Noor in a meeting. Noor snaps back and the talk derails.',1,'Joe Sherman’s advisor didn’t join in the venom. Ego strength keeps you on the matter at hand.'],
   ['On a call, Noor spends the time thinking about how they sound, not about what Dana says.',2,'Attention has drifted from Dana to Noor’s own image.']]);}},

/* ---------- PART 4: CURIOSITY AND INCLUSION ---------- */
{part:3,src:'Chapter 6 · Curiosity',run(L){
  L.h(L.kick('learn','Curiosity')+'<h1 class="q">Focus on what you <i>don’t</i> know</h1>'+
   L.prose('You '+L.g('earn-the-right','earn the right')+' to solve a client’s problem by listening well. Good listening is driven by <b>curiosity</b>: wanting to know, and asking question after question.')+
   L.flow([['eye','“What’s behind that?”'],['bulb','“Why is this the case?”'],['layers','“How does this fit in?”']],false)+
   L.prose('As you keep asking, the problem itself changes shape. Patterns appear, positions soften, new angles show up. The book’s point: the “right answer” at the start is never as right as the one that grows out of the questions.'));
  L.done();}},
{part:3,src:'Chapter 6 · Curiosity',pts:1,
 solve:async L=>{for(let i=0;i<3;i++)L.$('#ask').click();},
 run(L){
  const Q=['“What’s behind that?”','“Why is this the case?”','“How does this fit in?”'];
  const R=[['Start','Dana needs redundancy letters for 60 staff.'],
           ['What’s behind it','Felix wants it fast and quiet, and Dana fears the blame if it goes wrong.'],
           ['Why now','The board is pushing on costs, and Gail is telling shop managers the plan is a mistake.'],
           ['How it fits','A rival bakery in town closed last year. How Corran handles this shapes its name locally and the morale of everyone who stays.']];
  let lv=0;
  L.h(L.kick('pr','Watch the problem grow')+'<h1 class="q">Noor’s first answer: “Send the letters.” Ask Dana the book’s three questions and watch the problem change.</h1><div class="ladder" id="ld"></div>'+
   '<button class="btn pri" id="ask">'+L.ic('chat')+'Ask '+Q[0]+'</button><div id="cq"></div>');
  const draw=()=>{L.$('#ld').innerHTML=R.slice(0,lv+1).map((x,j)=>(j?'<div class="conn"></div>':'')+'<div class="rung'+(j===lv?' cur':'')+'"><small>'+x[0]+'</small>'+x[1]+'</div>').join('');};draw();
  L.$('#ask').onclick=function(){lv++;draw();
    if(lv<3){this.innerHTML=L.ic('chat')+'Ask '+Q[lv];return;}
    this.remove();const q=L.$('#cq');q.innerHTML='<h2 class="sub">Is “send the letters” still the whole answer?</h2>';
    L.mc(q,['Yes, the letters were the real job','No, the job is bigger than the letters'],1,
     'The letters still matter, but the real job now includes Dana’s position, Gail and Corran’s name in town. The answer got better as the questions reshaped it.',
     'The letters are part of it, but the questions showed much more: Dana’s fear, Gail’s resistance, Corran’s name in town. The first answer is never the best one.');};}},
{part:3,src:'Chapter 6 · Inclusive Professionalism',run(L){
  L.h(L.kick('learn','Inclusive professionalism')+'<h1 class="q">Professionalism you share with the client</h1>'+
   L.prose('Many professionals see professionalism as what sets them <i>apart</i> from clients: “business people” over there, “professionals” over here. The book calls this wrong and self-defeating. Real professionalism means lining up <i>with</i> clients to improve their situation.')+
   L.lanes([['lock','Exclusive','The advisor solves the problem. The advisor controls the meetings and the relationship. “Us versus them.”',3],
            ['people','Inclusive','The advisor helps the client solve it. Both share the relationship and the responsibility. Each side’s talents count.',2]])+
   L.prose('The book notes that many firms <i>say</i> they work this way, but some keep their methods hidden or limit which work clients may see. Those habits start the relationship as if the two sides were opponents.'));
  L.done();}},
{part:3,src:'Chapter 6 · Inclusive Professionalism',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Dana asks to see Larkmoor’s working draft of the closure plan so Corran’s HR team can add to it. Ines suggests saying no, “so we stay in control.” What fits inclusive professionalism?</h1>');
  L.mc(L.card,['Keep the draft in-house until it’s finished','Share it and work on it with Corran’s team'],1,
   'Dana’s team knows Corran better than anyone. Working on the draft together uses both sides’ skills and shares the responsibility.',
   'Holding the draft back to “stay in control” is the “us versus them” habit the book warns about. Dana’s team brings knowledge Larkmoor lacks.');}},
{part:3,src:'Chapter 6 · Inclusive Professionalism',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Tap each piece until the sentence describes inclusive professionalism.</h1>');
  L.sentence(L.card,[['Advisor and client','The advisor alone'],['share responsibility for','takes control of'],['improving the client’s situation.','the meetings and the answer.']],[0,0,0],
   [['Keeping it to the advisor alone is the exclusive habit.'],['Controlling the relationship is the exclusive habit. Inclusive means sharing it.'],['Owning the meetings and the answer is what the exclusive view cares about.']],
   'Both sides bring their skills, share the responsibility, and the advisor helps rather than takes over.');}},
{part:3,src:'Chapter 6 · The Importance of Mindsets',pts:6,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Name the mindset',['Focus on the other','Self-confidence','Ego strength','Curiosity','Inclusive professionalism'],[
   ['Felix credits Dana for a smooth consultation. Noor did much of the work and lets it stand.',2,'Not needing the credit is ego strength.'],
   ['Noor asks Gail, “Why do you think this shop matters so much to the town?”',3,'Asking about what you don’t yet know is curiosity.'],
   ['Noor invites Dana’s team to draft the staff FAQ alongside Larkmoor.',4,'Working jointly, sharing responsibility, is inclusive professionalism.'],
   ['Dana goes quiet when Felix is mentioned. Noor notices and asks how Felix is taking it.',0,'Reading Dana and naming the feeling keeps the focus on Dana.'],
   ['Noor lets Dana finish, trusting the legal answer will still be there afterward.',1,'Waiting before solving takes self-confidence.'],
   ['Noor drops the idea that the plan must be “Larkmoor’s answer” and builds it with Corran.',4,'Helping the client solve it, rather than solving it for them, is inclusive.']]);}}
  ]
});
</script>
</body>
</html>
