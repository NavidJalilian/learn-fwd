<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Earning Trust</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0002', title:'Earning trust', minutes:18, icon:'shield',
  goals:['Earn trust by giving first, instead of asking for it','Keep self-interest in check when a hard question comes','Use the six characteristics of trust to read a relationship'],
  parts:['Give to get','Self-interest','Moments of truth','How trust works'],
  read:'Read chapter 3 of the book for the full sandpaper and courthouse stories.',
  glossary:{
   'give-to-get':'Give to get: earning trust by offering real help and evidence of care first, before you have been hired or paid.',
   'moment-of-truth':'Moment of truth: a short moment when a client shows a hidden concern, and you can either notice it and speak up, or miss it.'
  },
  cheatsheet:[
   'Saying “trust me” raises defenses. Trust must be <b>earned and deserved</b>: give evidence first.',
   '<b>Give to get</b>: share useful help freely, before you’re hired. Small caring gestures add up over time.',
   'Keep <b>self-interest in check</b>. A truthful “no” can win more trust than a fudged “sort of”.',
   'Trust can be won or lost <b>very fast</b> in a single answer.',
   'Watch for moments when the client draws back the curtain. <b>Notice, name what you see, speak truthfully</b>, and know when not to bother them.',
   'Trust <b>grows</b>, is <b>rational and emotional</b>, is <b>two-way</b>, is about <b>perceived risk</b>, is <b>different</b> for client and advisor, and is <b>personal</b>.',
   'Clients trust people, not firms. Show that their interests matter as much to you as your own.'
  ],
  steps:[
/* ---------- PART 1: GIVE TO GET ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">You need an accountant. One spends the first call on their firm’s history and fees. The other asks what you already know, then emails you a free checklist. Who do you call back?</h1>');
  L.mc(L.card,['The one with the long history','The one who sent the checklist'],1,
   'Most people would. The second one gave you something useful before asking for anything. That’s how trust is earned.',
   'History and fees are about the firm. The checklist is about <i>you</i>. Giving help first is how this chapter says trust is earned.');}},
{part:0,src:'Chapter 3 · How to Win Trust',run(L){
  L.h(L.kick('learn','Trust is earned, not claimed')+'<h1 class="q">Hiring a professional is an act of faith</h1>'+
   L.prose('When you hire a lawyer, an accountant or a mechanic, you hand your affairs to someone else. You can check their background, but in the end you must trust them. What you want is someone who understands your interests, won’t put their own first, and cares.')+
   L.prose('So how do you get someone to trust you? Not by saying “trust me”. That just makes people raise their guard.')+
   L.flow([['x','Ask for trust','“Trust me, we’re the best.”','raises defenses',4],['pencil','Give evidence','Do something useful for them first.','earns trust',2]])+
   L.note('The book’s rule: trust must be <b>earned and deserved</b>. You have to '+L.g('give-to-get','give in order to get')+'.','check'));
  L.done();}},
{part:0,src:'Chapter 3 · How to Win Trust',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">How one lawyer won David’s business before being hired</h1>');
  L.beats(L.card,[
   ['The need','David (one of the authors) had to hire a lawyer to handle a relative’s will.'],
   ['The first lawyers','They told him when their firm was founded, how many offices it had and what they charged. The more they talked about themselves, the less interested they seemed in his problem.'],
   ['The question','Then one lawyer began by asking how much David already knew about the process. The honest answer: nothing at all.'],
   ['The gift','The lawyer sent a free outline: what to do now, what could wait, and the phone numbers of every government office to notify, even though that wasn’t legal work or paid.'],
   ['The result','He got the job. He showed he knew what mattered to David, and was generous with his knowledge.']],
   'Being generous with useful knowledge, before you’re hired, proves you’re willing to earn the business.');}},
{part:0,src:'Chapter 3 · How to Win Trust',run(L){
  L.h(L.kick('learn','Small gestures add up')+'<h1 class="q">The dentist who always called</h1>'+
   L.prose('David’s dentist, Andrew, recommended extra work early on. David wondered: is it needed, or is he just selling? But after <i>every</i> visit, Andrew phoned that evening to ask if David or his wife was in pain or needed a prescription.')+
   L.flow([['chat','Visit 1','A call that evening','“Is this a sales trick?”',4],['cycle','Visit after visit','Always the same call','doubt fades',3],['shield','Today','They usually accept his advice','trust',2]])+
   L.prose('At first they were cynical. Was he really caring, or acting as if he cared? Over time the small gestures kept coming, and they came to believe he was sincere.'));
  L.done();}},
{part:0,src:'Chapter 3 · How to Win Trust',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Dana asks Noor for a quote on the redundancy paperwork for Corran’s closures. Which reply best earns trust?</h1>');
  L.mc(L.card,['Send a free one-page outline of the steps and deadlines','Send Larkmoor’s brochure and its full rate card','Ask Dana to sign an engagement letter before talking'],0,
   'Like the lawyer in David’s story: useful help, given freely, before being hired.',
   'Brochures and paperwork are about Larkmoor. A free outline of what Dana must do is about Dana. That’s giving to get.');}},
{part:0,src:'Chapter 3 · How to Win Trust',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Earning trust or asking for it?',['Gives evidence','Just asks for trust'],[
   ['Noor tells Dana: “Trust me, we’ve done hundreds of these.”',1,'Saying “trust me” gives no evidence and puts people on guard.'],
   ['Noor sends a list of every office Corran must notify, even ones with no legal work in them.',0,'Useful help beyond the paid work, like the outline in David’s story.'],
   ['The evening after a tense staff meeting, Noor calls Dana to ask how it went.',0,'A small, caring gesture. Repeated, these add up, like Andrew’s calls.'],
   ['Noor’s first meeting with a new client opens with Larkmoor’s founding year and office count.',1,'That’s what the first lawyers did to David. It’s about the firm, not the client.'],
   ['Noor shares a draft timeline for free, before Corran agrees to any fees.',0,'Giving before getting is exactly how trust is earned.']]);}},

/* ---------- PART 2: SELF-INTEREST ---------- */
{part:1,src:'Chapter 3 · Charlie and the Sandpaper',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">Charlie and the sandpaper</h1>');
  L.beats(L.card,[
   ['The setup','Charlie (another author), newly promoted at a consulting firm, brings a senior partner to meet a promising prospect: a maker of abrasives.'],
   ['The question','The client asks what experience the firm has with marketing studies for <i>industrial consumables</i>.'],
   ['The panic','Charlie realises the client means sandpaper. His firm has never done such a study. He gets ready to dodge: something vague about having studied products that are sort of similar.'],
   ['The partner','Before Charlie can speak, the senior partner simply says they have none he can think of. He pauses, then asks what else would be useful to talk about.'],
   ['The result','The client, unbothered, asks about related experience. The firm wins the work.']],
   'Charlie’s fudge would have shown he’d bend his credentials to win. The partner’s answer said: I’ll tell you the truth, even if it costs me your business.');}},
{part:1,src:'Chapter 3 · Charlie and the Sandpaper',run(L){
  L.h(L.kick('learn','Two lessons from one answer')+'<h1 class="q">Trust depends on keeping your own interest in check</h1>'+
   L.list([['shield','Keep self-interest in check','The moment you put winning ahead of the client’s need for the truth, they can see it. That’s high '+L.g('self-orientation','self-orientation')+'.'],
     ['clock','Trust moves fast','A single answer can win trust, or lose it, in seconds.']],2)+
   L.prose('At Larkmoor, Noor’s mentor is <b>Tomasz Bell</b>, a calm senior partner who is comfortable saying “I don’t know”. Tomasz often plays the role of Charlie’s senior partner. Noor, proud of being expert, is more like Charlie on that day.'));
  L.done();}},
{part:1,src:'Chapter 3 · Charlie and the Sandpaper',pts:1,
 solve:async L=>{L.$('#ans').children[1].click();},
 run(L){
  const A=[['“Not exactly, but we’ve handled lots of closures, some very similar.”','I’ll bend the truth a little to keep your work.'],
           ['“No, we haven’t. Knowing that, what else would be useful to talk about?”','I’ll tell you the truth, even if it costs me.']];
  L.h(L.kick('try','Your turn')+'<h1 class="q">In a review meeting Dana asks: “Have you handled a closure where the local press got involved?” Larkmoor hasn’t. Tomasz is watching. What should Noor say?</h1><div id="ans" class="opts"></div><div id="sub"></div>');
  A.forEach((a,j)=>{const b=document.createElement('button');b.className='chip';b.style.cssText='text-align:left;white-space:normal;display:block;width:100%;margin:6px 0';b.textContent=a[0];
    b.onclick=()=>{if(L.$('#sub').innerHTML)return;b.classList.add('sel');
      L.$('#sub').innerHTML='<h2 class="sub">What Dana hears underneath</h2>'+A.map((x,k)=>'<div style="background:var(--soft);border-radius:14px;padding:10px 12px;margin:8px 0"><div class="small">'+(k?'The straight answer':'The fudge')+'</div><div style="color:var(--'+(k?'ok':'no')+');margin-top:4px">“'+x[1]+'”</div></div>').join('');
      L.award(j===1);
      L.sheet(j===1?'ok':'no',j===1?'That’s Tomasz’s answer':'That’s Charlie’s near-miss',j===1?'Admitting the gap, then turning back to what Dana needs, shows Noor puts Dana’s interest ahead of winning.':'Dana would hear that Noor will stretch the truth to keep the work. Who would trust that? The straight answer costs less than it seems.');L.done();};
    L.$('#ans').appendChild(b);});}},
{part:1,src:'Chapter 3 · Charlie and the Sandpaper',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Whose interest comes first?',['Client first','Self-interest showing'],[
   ['Noor suggests a bigger policy review than Corran needs, because the team has spare hours.',1,'The advice serves Larkmoor’s timesheet, not Dana’s problem.'],
   ['Noor tells Dana about a missed deadline before Dana notices.',0,'Telling the truth when it costs you something keeps self-interest in check.'],
   ['Asked about a case type Larkmoor rarely handles, Noor calls a loosely related case “basically the same”.',1,'That’s the fudge Charlie nearly made: stretching credentials to win.'],
   ['Noor spends the first half of a meeting on Larkmoor’s awards.',1,'Talking about yourself shows where your attention is.'],
   ['Unsure of an answer, Noor says “I don’t know yet, I’ll find out by Thursday”.',0,'Honest about the gap, and focused on getting Dana what they need.']]);}},

/* ---------- PART 3: MOMENTS OF TRUTH ---------- */
{part:2,src:'Chapter 3 · A Lawyer’s Moment of Truth',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">A lawyer’s moment of truth on the courthouse steps</h1>');
  L.beats(L.card,[
   ['The case','A property developer hired litigator Peter Biagetti to sue his own mother, a partner in the family property business.'],
   ['The moment','On the courthouse steps before the first hearing, the client hesitated. Biagetti saw a man wrestling with family pride, success and love for his mother. The lawsuit could settle only one small issue.'],
   ['The words','Biagetti said, in effect, that he found it hard to imagine how it must feel to take your own mother to court, and that few sons could go through with it.'],
   ['The turn','The client could have told him to mind his own business. Instead he stopped, dropped the fight and settled on the steps.'],
   ['The payoff','He then sent the firm more work, and in time all of his business and family legal needs.']],
   'Biagetti gave up the fees of a long trial. In return he became the lawyer this client trusted with everything.');}},
{part:2,src:'Chapter 3 · A Lawyer’s Moment of Truth',run(L){
  L.h(L.kick('learn','When the curtain opens')+'<h1 class="q">The client briefly draws back a curtain. Will you look through the window?</h1>'+
   L.prose('This is how trusted advisor relationships often begin: a '+L.g('moment-of-truth','moment of truth')+'. The book says another lawyer might have missed it, or stayed quiet to keep the trial fees.')+
   L.list([['eye','Observe','Notice what the client’s words and body show, not only the task in front of you.'],
     ['chat','Speak truthfully','Name what you see, plainly and with care.'],
     ['people','Have some affinity','It works when there is real personal connection, as Biagetti had with his client.']],1)+
   L.note('<b>Timing is everything.</b> Clients are busy. One client praised a lawyer for knowing exactly when to bother them and when to leave them alone.','clock'));
  L.done();}},
{part:2,src:'Chapter 3 · A Lawyer’s Moment of Truth',pts:1,run(L){
  L.h(L.kick('try','Spot the moment')+'<h1 class="q">Going through the closure letters, Dana goes quiet every time Gail, the regional manager fighting the plan, is mentioned. What should Noor do?</h1>');
  L.mc(L.card,['Stick to the letters, since feelings aren’t legal work','Say it must be hard to push this through against Gail','Suggest a full-day workshop on managing change'],1,
   'That’s Biagetti’s move: notice, then name what you see with care. Dana can take it up or not.',
   'The task is the letters, but the real issue just showed itself. Noor should notice it and name it simply, not ignore it or jump to selling more work.');}},
{part:2,src:'Chapter 3 · A Lawyer’s Moment of Truth',pts:1,run(L){
  L.h(L.kick('pr','Find the words')+'<h1 class="q">Build what Noor says to Dana. Tap each piece until it names what Dana might be feeling.</h1>');
  L.sentence(L.card,[['I can’t imagine how it feels','You really shouldn’t worry','Legally, it makes no difference'],['to fill in sixty forms','to cut jobs in a town where you know people','to read our latest invoice'],['. Is that weighing on you?','. Anyway, back to clause 4.']],[0,1,0],
   [['Telling Dana not to worry dismisses the feeling instead of naming it.','True, perhaps, but it ignores what Dana is showing.'],['The forms aren’t what’s hard. Name the real issue.','That puts Larkmoor in the middle. Keep it about Dana.'],['Rushing back to the task closes the window Dana just opened.']],
   'Like Biagetti, Noor names the difficulty with care and leaves the door open. Dana decides whether to walk through it.');}},
{part:2,src:'Chapter 3 · A Lawyer’s Moment of Truth',pts:1,run(L){
  L.h(L.kick('pr','Your call')+'<h1 class="q">It’s the week Corran tells staff about the closures. Dana is swamped. Noor has a small question about next year’s contract template, plus a 12-page update. What should Noor do?</h1>');
  L.mc(L.card,['Send both now so nothing gets forgotten','Call Dana daily to see how they are coping','Hold both until the announcements are over'],2,
   'Knowing when <i>not</i> to bother a busy client is part of earning trust.',
   'Neither the template question nor the long update is urgent. A trusted advisor knows when to leave a busy client alone.');}},

/* ---------- PART 4: HOW TRUST WORKS ---------- */
{part:3,src:'Chapter 3 · Some Insights on Trust',run(L){
  L.h(L.kick('learn','Six characteristics of trust · 1 to 3')+'<h1 class="q">What trust is like, part one</h1>'+
   L.list([['trend','It grows, rather than just appears','We decide fast that we like someone, or don’t trust them. But we rarely say “I trust her” at once. We say “she seems like someone I could trust.” Trust comes from experiences that add up. There is no quick fix.'],
     ['scale','It’s rational and emotional','Clients judge your expertise, and an expert with no real content is soon dropped. But they also value your support, dedication and courage. Skill is essential, yet not enough.'],
     ['people','It’s a two-way relationship','You can love or respect someone who ignores you. Not trust. The client must take part too, so you can’t force it, and you may need to choose whom to build it with.']],1));
  L.done();}},
{part:3,src:'Chapter 3 · Some Insights on Trust',run(L){
  L.h(L.kick('learn','Six characteristics of trust · 4 to 6')+'<h1 class="q">What trust is like, part two</h1>'+
   L.list([['alert','It’s about perceived risk','To trust you, the client must believe you <i>could</i> let them down but won’t. Building trust means taking personal risks too. If you’re never a little scared, you’re probably not building it.'],
     ['cycle','It’s different for client and advisor','One person trusts, the other is trusted, like dance partners where one leads. And if you can’t trust others, you probably can’t be trusted.'],
     ['person','It’s personal','We trust people, not firms. A brand may get you on the shortlist. Only a person keeps you there.']],3)+
   L.quote('It’s business; it is personal.','The authors, turning around a line from The Godfather'));
  L.done();}},
{part:3,src:'Chapter 3 · Trust Grows',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">After one great meeting, Dana says Noor “seems like someone I could come to trust.” Noor expects Dana to bring them every issue from now on. What does the book say?</h1>');
  L.mc(L.card,['Right, trust can form in one strong meeting','No, trust builds from experiences over time','Right, as long as Noor keeps the fees low'],1,
   'Dana’s words say it: “could come to trust”. Trust is withheld pending more evidence.',
   'Apart from a rare powerful experience, trust doesn’t appear in one go. It grows as experiences add up, and fees aren’t what builds it.');}},
{part:3,src:'Chapter 3 · Trust Is both Rational and Emotional',pts:4,run(L){
  L.h(L.kick('pr','Rational or emotional?')+'<h1 class="q">The book suggests sorting what we value in advisors. Sort these things Dana values in Noor.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Rational (expertise)','Emotional (support)'],[
   ['Spots a legal flaw in the closure timeline',0,'That’s technical skill applied to the problem.'],
   ['Stays calm when Dana panics about the press',1,'Calm support is an emotional reason to trust.'],
   ['Explains which consultation rules apply',0,'Expert knowledge, the rational side.'],
   ['Is clearly on Dana’s side when Felix is angry',1,'Dedication to the client’s interests is emotional.']],
   'Both halves matter. Expertise is essential, but the book says many professionals overlook the emotional half.');}},
{part:3,src:'Chapter 3 · Some Insights on Trust',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which characteristic of trust?',['It grows','It’s two-way','It’s about risk','It’s personal'],[
   ['Dana trusts Noor. But when another Larkmoor partner calls about a new matter, Dana is wary.',3,'People trust people, not institutions. Dana’s trust in Noor doesn’t pass to the firm.'],
   ['Noor does everything right, but Gail won’t engage with Noor at all.',1,'Trust needs both sides. You can’t create it alone.'],
   ['Six years of small promises kept, and Dana finally calls Noor first.',0,'Trust builds from experiences adding up over time.'],
   ['Dana needed real trust in Noor only once the closures put Dana’s own job on the line.',2,'Trust matters where there is real perceived risk.'],
   ['Noor feels nervous telling Dana a hard truth. Tomasz says that nervousness is the point.',2,'Building trust means taking personal risks. A little fear is a sign you’re taking one.']]);}},
{part:3,src:'Chapter 3 · Trust Is Different for the Client and the Advisor',pts:1,run(L){
  L.h(L.kick('pr','Your call')+'<h1 class="q">Noor never lets a colleague touch Corran work and never relies on Dana’s judgment about Corran’s people. What does this chapter suggest?</h1>');
  L.mc(L.card,['It protects Corran, so it builds Dana’s trust','Only clients trust, so it makes no difference','It may be a sign Noor struggles to be trusted'],2,
   'The book says that if you can’t trust others, you probably can’t be trusted. Being able to trust is a necessary first step.',
   'The book links the two: being able to trust others is a necessary (though not enough) condition for being trustworthy yourself.');}}
  ]
});
</script>
</body>
</html>
