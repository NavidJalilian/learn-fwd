<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sincerity or Technique?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0006', title:'Sincerity or technique?', minutes:18, icon:'scale',
  goals:['Explain why a deliberate technique can still be sincere','Spot the “now and then” tactics that get found out','Choose what to do when you just can’t connect with a client'],
  parts:['Technique or caring','Act your way in','No chemistry','Client or friend'],
  read:'Read chapter 7 of the book for Jim’s class, Rob and Arnold, and the full argument about the four options.',
  cheatsheet:[
    '<b>Technique and sincerity aren’t opposites.</b> A planned, visible effort can be the clearest sign that you care.',
    'If you care, <b>practice the behaviors that show it</b>. If you only go through the motions, you’ll be found out.',
    'Clients can’t see your intentions, only your <b>behaviors</b>: attention, interest, preparation, listening.',
    'Actions can change attitudes. Work from <b>both ends</b>: caring inside, caring behaviors outside.',
    '<b>Occasional</b> tactics that don’t match how you normally act backfire. <b>Consistent</b> ones become the real thing.',
    'Can’t connect? Don’t serve at arm’s length. <b>Keep trying</b> for a while, then <b>pass to a colleague</b>, or <b>resign</b>.',
    'Junior? Check your motives, keep it in perspective, then raise it with the senior person.',
    'Clients don’t need to be friends, but you do have to <b>care</b>. Be sociable, bet on the <b>long term</b>, and don’t bail when it gets hard.'
  ],
  steps:[
/* ---------- PART 1: TECHNIQUE OR CARING ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">A friend never forgets your birthday. You find out they keep every friend’s birthday in a calendar with reminders. Does that make their wishes fake?</h1>');
  L.mc(L.card,['Yes, a reminder makes it mechanical','No, setting it up shows they care'],1,
   'Most people feel the effort is the point. This lesson asks the same question about clients: can a planned technique be sincere?',
   'Most people feel the opposite: bothering to set it up is a sign of caring. This lesson asks the same question about clients.');}},
{part:0,src:'Chapter 7 · Sincerity or Technique?',run(L){
  L.h(L.kick('learn','The question')+'<h1 class="q">Is trust about the right tactics, or about really caring?</h1>'+
   L.prose('The earlier lessons gave lots of actions and words that build trust. People in the authors’ workshops then ask: do these only work if you actually like the client? And is it wrong to use them if you don’t?')+
   L.lanes([['list','Technique','Things you do on purpose: prepare, remember details, ask questions, listen.',3],
            ['people','Sincerity','What you feel inside: interest in the client and care for them.',2]])+
   L.prose('The book’s answer: you can use techniques without being manipulative. It calls “sincere versus manipulative” a <b>needlessly loaded</b> choice. A story shows why.'));
  L.done();}},
{part:0,src:'Chapter 7 · Sincerity or Technique?',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">Jim and the forty-five names</h1>');
  L.beats(L.card,[
   ['Who','Jim, a friend of the authors, turned a company around and now teaches a course at a business school, for little pay he doesn’t need.'],
   ['The promise','On day one he photographs every student and promises that by next class he’ll know each one’s face, name, college and company.'],
   ['The work','He isn’t naturally good with names. He spends the week drilling all 45 with flash cards.'],
   ['The result','Everyone turns up to see if he can do it. He does. Nobody drops out or skips class all semester.'],
   ['Sincere or manipulative?','It’s planned, and the students can see it’s a technique. But why else would a busy person spend hours of their own time on it? It’s clearly sincere too.']],
   'A deliberate technique and real caring can be the same act. The technique is how the caring shows.');}},
{part:0,src:'Chapter 7 · Sincerity or Technique?',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Before every call, Noor rereads a page of notes on Dana: Corran’s latest news, Gail’s worries, what Dana said last time. Ines says that’s “a bit calculated.” What would the book say?</h1>');
  L.mc(L.card,['It’s planned, and it’s sincere too','It’s calculated, so it’s not sincere'],0,
   'Like Jim’s flash cards, Noor’s notes are a visible technique. The effort itself shows Noor cares about Dana.',
   'The book calls that a needlessly loaded choice. Like Jim’s flash cards, Noor’s notes are a technique <i>and</i> a sign of caring.');}},

/* ---------- PART 2: ACT YOUR WAY IN ---------- */
{part:1,src:'Chapter 7 · Sincerity or Technique?',run(L){
  L.h(L.kick('learn','The simple advice')+'<h1 class="q">Clients can only see what you do</h1>'+
   L.prose('The book’s advice is short. <b>If you care</b> about a client, practice the behaviors that show it. <b>If you only go through the motions</b>, you’ll be found out and you’ll fail.')+
   L.prose('Why behaviors? We think of sincerity as something inside. But a client has no window into your intentions. They judge from what they can observe:')+
   L.flow([['eye','Behaviors','attention, interest, preparation, real listening','what the client sees'],['bulb','Inference','“They really care about this.”','what the client concludes']]));
  L.done();}},
{part:1,src:'Chapter 7 · Sincerity or Technique?',run(L){
  L.h(L.kick('learn','Both directions work')+'<h1 class="q">Do you need to care first, or act first? Yes.</h1>'+
   L.prose('There’s an old debate: do you change people’s actions by changing their attitudes, or the other way round? The book says it works both ways, and that changing what you <i>do</i> is often easier and faster than changing how you feel.')+
   L.lanes([['people','Inside out','Start by caring. You open up to where the client wants to go, and your skills land on fertile ground.',2],
            ['pencil','Outside in','Start with new behaviors. They bring new information and fresh attention to the client, and the caring can follow.',1]])+
   L.note('The book’s advice: work from both ends toward the middle.','cycle'));
  L.done();}},
{part:1,src:'Chapter 7 · Sincerity or Technique?',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Noor finds Felix cold and hasn’t warmed to Felix yet. Should Noor still prepare carefully, ask about Felix’s goals and listen hard?</h1>');
  L.mc(L.card,['Yes, acting that way can help the caring come','No, not until Noor genuinely feels it'],0,
   'Changing actions is often easier than changing feelings, and the actions can bring the attitude with them.',
   'Waiting for the feeling can take a long time. The book says changing what you do first is often easier, and the caring can follow.');}},
{part:1,src:'Chapter 7 · Sincerity or Technique?',pts:1,
 solve:async L=>{const c=L.$('#mode').children;c[0].click();c[1].click();},
 run(L){
  const M=[{w:['Curt email: “Draft attached.”','Curt email: “See comments.”','Sudden call: “How are you, Dana? How’s the family?”','Next day: the over-estimate invoice arrives'],t:[30,28,22,10],r:'Dana thinks: “Ah. That’s why Ines was so friendly.”',c:'var(--no)'},
           {w:['Asks how the consultation meetings are going','Reads up on Corran before the call','Follows up on Gail, as Dana mentioned','Calls ahead to warn the invoice will run over'],t:[30,42,55,68],r:'Dana thinks: “Ines is on my side.” And Ines notices they’ve started to care how Dana’s week goes.',c:'var(--ok-strong)'}];
  const seen=new Set();
  L.h(L.kick('pr','See it happen')+'<h1 class="q">After the invoice dispute, Ines tries the caring behaviors. Compare two ways of doing it over four weeks.</h1><div id="mode"></div>'+
   '<div style="background:var(--soft);border-radius:16px;padding:14px;margin:8px 0 6px;min-height:150px" id="wk"><div class="small">Choose a version above.</div></div><div id="vq"></div>');
  ['Now and then','Every time'].forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.innerHTML=L.ic(j?'cycle':'clock')+n;
    b.onclick=()=>{[...L.$('#mode').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(j);const m=M[j];
      L.$('#wk').innerHTML=m.w.map((x,k)=>'<div class="meterrow"><div class="lb">Week '+(k+1)+'<div class="small" style="font-weight:400">'+x+'</div></div><div class="meter"><div style="width:'+m.t[k]+'%;background:'+m.c+'"></div></div></div>').join('')+
        '<div class="small" style="margin-top:8px"><b>Dana’s trust in Ines.</b> '+m.r+'</div>';
      if(seen.size===2&&!L.$('#vq').innerHTML){const q=L.$('#vq');q.innerHTML='<h2 class="sub">Why did “now and then” backfire?</h2>';
        L.mc(q,['Asking about family is too personal for a client','It didn’t match how Ines normally behaves'],1,
         'One warm call amid curt emails looks like a tactic, and it’s worse than nothing. Done every time, the same behaviors become real.',
         'Asking about someone’s family isn’t the problem. A one-off warm call amid curt emails looks phony, so it backfires. Consistency is what counts.');}};
    L.$('#mode').appendChild(b);});}},
{part:1,src:'Chapter 7 · Sincerity or Technique?',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Will it build trust or backfire?',['Builds trust','Backfires'],[
   ['Noor sends Dana a short note after every big meeting, summing up what was agreed.',0,'It’s consistent, so Dana learns it’s simply how Noor works.'],
   ['Ines is brisk for months, then suddenly gushes praise the day before asking Dana for more work.',1,'A one-off that clashes with normal behavior gets seen as a tactic.'],
   ['Noor didn’t warm to Felix at first, but has prepared carefully for every meeting for a year.',0,'Kept up for good, the behavior is indistinguishable from the real thing, and the caring often follows.'],
   ['Tomasz learns the names of Corran’s shop managers before each visit, every time.',0,'Like Jim’s flash cards: planned, visible and clearly caring.'],
   ['Noor uses an “I hear you” line in one tense meeting, then goes back to interrupting.',1,'An occasional tactic that doesn’t fit your usual style looks phony and backfires.']]);}},

/* ---------- PART 3: NO CHEMISTRY ---------- */
{part:2,src:'Chapter 7 · What If You Don’t Care for Them?',run(L){
  L.h(L.kick('learn','When you just can’t connect')+'<h1 class="q">Four options, none of them pleasant</h1>'+
   L.prose('Sometimes, even after trying hard, you can’t feel for a client. The book lists four options and gives a verdict on each:')+
   L.tiers([['x','1 · Keep serving, don’t build the relationship','Everyone loses: you miss the benefits of trust and the work feels empty. Drop this one.','never'],
            ['cycle','2 · Keep serving, use the techniques without feeling','Worth trying for a while; you can often find a connection. But not for a whole career.','for a while'],
            ['people','3 · Pass the client to a colleague','Chemistry is personal. Someone you can’t connect with may be a dream client for a colleague.','consider seriously',true,'Often best'],
            ['arrow','4 · Resign the account','The last step, but sometimes necessary. Clients can see you aren’t engaged, and that hurts your reputation for longer than lost fees.','last resort']])+
   L.quote('Reputation before revenue!','The authors, on resigning a client'));
  L.done();}},
{part:2,src:'Chapter 7 · What If You Don’t Care for Them?',run(L){
  L.h(L.kick('learn','Why some fits fail')+'<h1 class="q">A bad fit is common, mutual, and not a personal failure</h1>'+
   L.prose('David reports a common survey finding: professionals typically really like their clients only <b>20 to 30 percent</b> of the time. The rest are mostly tolerated.')+
   L.prose('Few people can relate to everyone. And the people you dislike aren’t always the ones who dislike you, so the number of good matches is smaller still. Some relationships just won’t work.')+
   L.note('In relationships there is no win-lose. It’s <b>win-win or lose-lose</b>: if the fit fails for one side, it fails for both. Saying so honestly is often the quickest and kindest way out.','scale')+
   '<p class="small" style="margin-top:12px">The book adds a warning: if you keep running into clients you can’t stand, the common factor may be you. A lack of chemistry may be as much your fault as theirs.</p>');
  L.done();}},
{part:2,src:'Chapter 7 · What If You Don’t Care for Them?',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">Ines can’t stand Felix. As a junior, what can Ines do?</h1>');
  L.beats(L.card,[
   ['The problem','Felix is curt with Ines in every meeting. Ines dreads the closures work and wishes someone else had it. Resigning or handing over isn’t Ines’s call.'],
   ['1 · Check your motives','Has Ines really tried everything to relate to Felix? Is Felix the problem, or is Ines dodging some other unpleasant part of the job? Does Felix even feel the same?'],
   ['2 · Keep it in perspective','Nothing here threatens anyone’s life, career or the client. The closures end in about two months. It may not be worth the energy to fix.'],
   ['3 · Raise it with the senior person','If it’s real and serious, Ines should tell Noor directly. If Noor shows Ines is wrong, Ines gets peace of mind. If Ines is right, Noor can protect the service to Corran.']],
   'The book’s three steps for a junior: check your motives, put it in perspective, then raise it with the senior person on the work.');}},
{part:2,src:'Chapter 7 · What If You Don’t Care for Them?',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">For a year, Noor has honestly tried to connect with Victor, HR director at a hotel group Larkmoor serves. It isn’t working. Victor and Tomasz get on well. What’s Noor’s best move?</h1>');
  L.mc(L.card,['Keep serving Victor but stop trying to connect','Keep faking warmth for as long as Victor stays','Suggest Tomasz takes over as Victor’s partner'],2,
   'Noor has really tried, and chemistry is personal. Victor may be a great client for Tomasz.',
   'Serving at arm’s length makes everyone lose, and faking it forever isn’t a life. After real effort, passing to a colleague who connects is the book’s answer.');}},
{part:2,src:'Chapter 7 · What If You Don’t Care for Them?',pts:4,run(L){
  L.h(L.kick('pr','What would the book advise?')+'<h1 class="q">Pick the best option for each Larkmoor situation.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Keep trying','Hand over','Resign'],[
   ['Rafa has met a new client twice and finds them stiff. Rafa hasn’t really tried yet.',0,'It’s early. Option 2 is worth trying for a while; a connection often appears.'],
   ['After two years of real effort, Noor and a client still clash. Ines gets on with them brilliantly.',1,'Chemistry is personal. Someone else may click where Noor can’t.'],
   ['Nobody at Larkmoor can connect with a client after real effort, and the client can tell. The fees are big.',2,'Staying hurts the firm’s reputation longer than the lost fees. Reputation before revenue.'],
   ['Noor finds Felix curt but has only had three meetings.',0,'Too soon to give up. Keep the caring behaviors going and see if the connection grows.']],
   'Serving without trying to connect is never on the list. Try first, hand over if someone else clicks, and resign only as a last step.');}},

/* ---------- PART 4: CLIENT OR FRIEND ---------- */
{part:3,src:'Chapter 7 · Client or Friend?',run(L){
  L.h(L.kick('learn','Client or friend?')+'<h1 class="q">You don’t have to be friends. You do have to care.</h1>'+
   L.prose('You can be interested in someone without being their friend. Treat clients as individual people, not as job titles. But don’t pretend to be close: clients quickly see through “friendships” built on long chats about golf or football.')+
   L.prose('Is getting close unprofessional? The book says the opposite: it’s unprofessional <i>not</i> to show interest in your client. Showing interest doesn’t mean prying into private matters.')+
   L.lanes([['x','Not needed','Socializing: golf, dinners, nights at the opera.',3],
            ['check','Needed','Being sociable: a window into who the client is, and their needs, hopes and fears.',2]])+
   '<p class="small" style="margin-top:12px">Do you really have to care? To be a '+L.g('trusted-advisor','trusted advisor')+', yes. To be merely a vendor, no.</p>');
  L.done();}},
{part:3,src:'Chapter 7 · Client or Friend?',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">When the feeling goes, the tactics fade</h1>');
  L.beats(L.card,[
   ['The relationship','Rob built a strong relationship with Arnold, a demanding director at a major firm.'],
   ['The change','Arnold left. Rob liked the people who replaced Arnold, kept trying hard and kept doing good work. He even got more work.'],
   ['The slide','But his heart wasn’t in it the same way. He thought he was acting as before, yet the relationship slowly weakened.']],
   'Without real feeling, the techniques lose their power. It happened to someone who teaches them.');}},
{part:3,src:'Chapter 7 · Client or Friend?',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Noor wants to grow closer to Dana. Ines suggests booking tickets to a big match and taking Dana along. What matters more, according to the book?</h1>');
  L.mc(L.card,['Being sociable: asking about Dana’s hopes and fears','Socializing: tickets, dinners and nights out'],0,
   'Socializing is optional. Being sociable, interested in Dana as a person, is what opens the window.',
   'The book says trust isn’t about golf or dinners. Being sociable, showing interest in Dana’s needs, hopes and fears, is what counts.');}},
{part:3,src:'Chapter 7 · It’s the Journey, Not the Destination',run(L){
  L.h(L.kick('learn','It’s the journey')+'<h1 class="q">People can tell why you’re interested in them</h1>'+
   L.prose('In romance, we quickly sense whether someone likes <i>us</i> or wants something from us, and we react badly to the second. The book says buyers are just as sharp. Most sellers are too caught up in their own concerns to show real care, so the rare ones who do stand out.')+
   L.flow([['clock','Bet on the long term','Trust pays off over years, not deals.'],['cycle','Expect rough patches','All relationships go in cycles.'],['shield','Don’t bail out','Trusted advisors stay when times get tough.']],false)+
   L.prose('Clients don’t want to be a means to your end. They want someone who cares enough to travel with them.'));
  L.done();}},
{part:3,src:'Chapter 7 · It’s the Journey, Not the Destination',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Tap each piece until the sentence matches the book’s view of earning trust.</h1>');
  L.sentence(L.card,[['bet on','skip'],['the long-term relationship','this quarter’s fees','the next deal'],['and stay','and step back'],['when times get tough.','once the work is done.']],[0,0,0,0],
   [['Skipping the relationship is the vendor’s path.'],['Short-term fees are a destination, not the journey.','One deal at a time is exactly what clients sense and dislike.'],['Stepping back is bailing out.'],['Trusted advisors are tested in the hard times, not after the work.']],
   'To earn trust, bet on the long-term relationship and stay when times get tough.');}},
{part:3,src:'Chapter 7 · Sincerity or Technique?',pts:6,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'True to the chapter?',['True','False'],[
   ['Using a deliberate technique means you can’t be sincere.',1,'Jim’s flash cards were a technique and plainly sincere.'],
   ['Clients judge your sincerity from your behaviors.',0,'They can’t see intentions, only attention, interest, preparation and listening.'],
   ['If you can’t connect, serving the client at arm’s length is the safe choice.',1,'The book says option 1 makes everyone a loser and should be dropped.'],
   ['Changing your actions first can change how you feel.',0,'Often it’s easier than changing your feelings first.'],
   ['To be a trusted advisor, you must make each client a friend.',1,'Be interested and sociable. Friendship isn’t required.'],
   ['A bad fit with a client is usually bad for both sides.',0,'There’s no win-lose: only win-win or lose-lose.']]);}}
  ]
});
</script>
</body>
</html>
