<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Five Stages of Trust</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0008', title:'The five stages of trust, and engagement', minutes:20, icon:'layers',
  goals:['Name the five stages of trust building and what each one gives the client','Tell when a client is truly engaged, and which half is missing when they aren’t','Open a conversation that engages a new client or re-engages an old one'],
  parts:['Five stages','Engagement','New clients','Existing clients'],
  read:'Read chapters 9 and 10 of the book for the stage-by-stage language and more sample openings for existing clients.',
  glossary:{
   'urgent-important':'Urgent vs important: urgent topics need attention now; important topics matter more over time but can wait. The book uses the difference to plan short client conversations.'
  },
  cheatsheet:[
    'The <b>five stages</b>: engage, listen, frame, envision, commit. No one stage is “the key”; all are essential.',
    'Each stage has its own language: <b>interest and concern</b>, <b>understanding and empathy</b>, <b>perspective and candor</b>, <b>possibility</b>, <b>joint exploration</b>.',
    '<b>Engagement</b> needs both halves: an issue worth talking about <i>and</i> a person worth talking to about it.',
    'Listening doesn’t come first. Clients open up only after something tells them you’re worth it.',
    'New clients: research the company and the person, bring 2–3 <b>topics</b> (not questions), show you understand their <b>wants</b>, visibly customize.',
    'Treat a new client as a <i>new</i> friend, not an old one. If you can’t add value yet, postpone the meeting.',
    'Existing clients: bring something specific about their competitors, career, a concern they raised, or “something you said”.',
    'Short on time? Agenda, <b>urgent first</b>, end with the important. More time? Important first, save five minutes for the urgent.'
  ],
  steps:[
/* ---------- PART 1: FIVE STAGES ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">At a conference, a lawyer you’ve never met says: “So, what are your biggest problems at work?” How likely are you to open up?</h1>');
  L.mc(L.card,['Not very: they haven’t given me a reason to','Very: they asked, so they must want to help'],0,
   'Being asked isn’t enough. You open up to someone only once you believe they’re worth talking to about that issue. That first step is what this lesson is about.',
   'Most people give a polite, vague answer. A question alone doesn’t earn an honest reply. Something has to come first, and the book calls it engagement.');}},
{part:0,src:'Chapter 9 · The Development of Trust',run(L){
  L.h(L.kick('learn','The five stages')+'<h1 class="q">A trusted relationship grows through five steps</h1>'+
   L.prose('The book lays out the '+L.g('five-stages','five stages of trust building')+'. At each one, the client comes to feel something new.')+
   L.tiers([['pointer','1 · Engage','The client feels there is an issue worth talking about, and that you are worth talking to about it.'],
            ['eye','2 · Listen','The client comes to believe you understand them. This '+L.g('earn-the-right','earns you the right')+' to explore ideas together.'],
            ['bulb','3 · Frame','You help the client see the heart of their problem clearly. Usually where they first <i>notice</i> the value you add.'],
            ['star','4 · Envision','Before solving anything, you picture together what the end result should look like.'],
            ['check','5 · Commit','The client understands what it will really take, and finds the will to do it.']])+
   '<p class="small" style="margin-top:10px">Framing, envisioning and commitment each get their own later lesson. Here we look at the whole path, then at the first step.</p>');
  L.done();}},
{part:0,src:'Chapter 9 · Another Look',run(L){
  L.h(L.kick('learn','How each stage sounds')+'<h1 class="q">Each stage has its own language and needs its own skill</h1>'+
   L.prose('Tap each card to see the kind of language a stage uses, a sample line from Noor, and the skill it calls for.'));
  L.flips(L.card,[
   ['Engage','<b>Language:</b> interest and concern.<br>“I’ve been reading about bakery chains hiring abroad, and…”<br><b>Skill:</b> being noticed, credibly.'],
   ['Listen','<b>Language:</b> understanding and empathy.<br>“Say more about how Gail took the news.”<br><b>Skill:</b> really understanding another person.'],
   ['Frame','<b>Language:</b> perspective and candor.<br>“I’m hearing two separate problems here…”<br><b>Skill:</b> creative insight and emotional courage.'],
   ['Envision','<b>Language:</b> possibility.<br>“Picture the town a year from now, if this went well…”<br><b>Skill:</b> collaboration and creativity.'],
   ['Commit','<b>Language:</b> joint exploration.<br>“What would each of us need to do to make that happen?”<br><b>Skill:</b> building enthusiasm, or calming too much of it.']],
   'Notice that the language shifts from <i>your</i> interest, to the client’s feelings, to shared work.');}},
{part:0,src:'Chapter 9 · The Development of Trust',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">The five stages in Noor’s work on the site closures</h1>');
  L.beats(L.card,[
   ['Engage','Dana calls for redundancy paperwork. Noor mentions how the rival bakery’s closure hurt its name in town. Dana pauses: maybe there’s more to talk about, and Noor is someone to talk to.'],
   ['Listen','Noor asks what worries Dana most, and plays it back. Dana feels understood, and mentions Felix and Gail.'],
   ['Frame','Noor puts it plainly: “The legal steps are the easy part. The real risk is how this lands with staff and the town.” Dana sees the problem differently.'],
   ['Envision','Together they picture success: a fair process, Gail on board, and no damage to Corran’s name in town. They hold off on picking a plan.'],
   ['Commit','Noor is frank about what it will take: hard conversations with Gail, time from Felix. Dana decides it’s worth it and they agree who does what.']],
   'Each stage builds trust a little more, and the client gets something at every step.');}},
{part:0,src:'Chapter 9 · Another Look',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Noor says to Dana: “Imagine six months from now, the closures are done and the staff still speak well of Corran.” Which stage is this?</h1>');
  L.mc(L.card,['Frame','Listen','Envision'],2,
   'That’s the language of possibility: picturing the end result before choosing how to get there.',
   'Noor isn’t defining the problem or drawing Dana out. They are picturing the future: envisioning, the language of possibility.');}},
{part:0,src:'Chapter 9 · Another Look',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which stage does this line belong to?',['Engage','Listen','Frame','Envision','Commit'],[
   ['“That sounds exhausting. What happened after Felix said that?”',1,'Understanding and empathy: drawing the client out.'],
   ['“What would it take, from you and from us, to get this done by spring?”',4,'Joint exploration of what each side will do is commitment.'],
   ['“I see three themes here: the law, Gail, and the town’s view of Corran.”',2,'Offering perspective that organizes the issue is framing.'],
   ['“I’ve been looking at how other bakery chains handle seasonal staff, and…”',0,'Interest and concern, brought to the client, opens engagement.'],
   ['“Wouldn’t it be good if staff saw the new shift rules as fairer, not stricter?”',3,'Picturing a better future is the language of possibility: envisioning.']]);}},
{part:0,src:'Chapter 9 · Skills Required',pts:1,run(L){
  L.h(L.kick('pr','Is there a key step?')+'<h1 class="q">Noor tells Tomasz: “Framing is my strength and it’s where clients see value. I’ll put my effort there and go lighter on the rest.” What should Tomasz say?</h1>');
  L.mc(L.card,['Agreed, framing is where the most trust is built','All five are essential; none is the key step','Better to focus on listening, the true key step'],1,
   'The book notes that firms tend to call their own strength the key step. Its view: no single step is key, and which moment matters most depends on the issue and the advisor.',
   'Picking one “key” step is exactly the habit the book warns against: people lead with their strengths. No step is key; all five are essential.');}},

/* ---------- PART 2: ENGAGEMENT ---------- */
{part:1,src:'Chapter 10 · Engagement',run(L){
  L.h(L.kick('learn','Engagement comes first')+'<h1 class="q">Before listening, the client must decide you’re worth it</h1>'+
   L.prose('Many advisors think trust starts with listening. The book disagrees. Before a client talks about a need, there has to be a first connection. That is '+L.g('engagement','engagement')+'.')+
   L.flow([['alert','An issue','worth talking about','',3],['person','A person','worth talking to about it','',2]],false)+
   L.prose('You need <b>both</b>. And for the client it is a real decision: raising an issue takes emotional energy and personal risk, so they only do it if they expect something good to come of it.')+
   L.note('The book tells of a finance director tired of advisors who showed up only to ask about his problems and listen, with nothing useful to offer.','book'));
  L.done();}},
{part:1,src:'Chapter 9 · Engage',pts:1,
 solve:async L=>{L.$('#t0').click();L.$('#t1').click();},
 run(L){
  let a=0,b=0;const seen=new Set(['00']);
  const R={'00':['x','Dana is polite, checks the clock, and the call ends. Nothing is said.'],
    '10':['x','Dana agrees overseas hiring is a big deal, then says: “I’ll ask our recruitment agency about it.”'],
    '01':['x','Dana enjoys chatting with Noor, but doesn’t see the visa rules as a real problem yet. The talk drifts.'],
    '11':['check','Dana leans in: “Actually, could we talk this through properly next week?”']};
  L.h(L.kick('pr','Toggle and compare')+'<h1 class="q">Noor raises Corran’s plan to hire bakers from abroad. Switch each half of engagement on and off and watch how Dana reacts.</h1>'+
   '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="chip" id="t0">'+L.ic('alert')+'Issue worth talking about</button><button class="chip" id="t1">'+L.ic('person')+'Noor worth talking to</button></div>'+
   '<div style="background:var(--soft);border-radius:16px;padding:14px;margin:10px 0" id="out"></div><div id="eq"></div>');
  const draw=()=>{const k=''+a+b,r=R[k];L.$('#t0').classList.toggle('sel',!!a);L.$('#t1').classList.toggle('sel',!!b);
    L.$('#out').innerHTML='<div style="display:flex;gap:8px;align-items:flex-start">'+L.ic(r[0])+'<div>'+r[1]+'</div></div>';seen.add(k);
    if(seen.size>=3&&!L.$('#eq').innerHTML){const q=L.$('#eq');q.innerHTML='<h2 class="sub">When does Dana truly engage?</h2>';
      L.mc(q,['When the issue feels important to Dana','Only when both halves are there at once','When Dana likes and respects Noor'],1,
       'Either half alone gives you politeness, not engagement. Dana needs a real issue <i>and</i> to see Noor as the right person for it.',
       'One half alone isn’t enough. With only the issue, Dana takes it elsewhere; with only the person, the talk drifts. Engagement needs both.');}};
  L.$('#t0').onclick=()=>{a=1-a;draw();};L.$('#t1').onclick=()=>{b=1-b;draw();};draw();}},
{part:1,src:'Chapter 9 · Engage',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Felix tells Noor: “Yes, the overseas hiring is a big headache. I’m sure the agency will sort it.” Which half of engagement is missing?</h1>');
  L.mc(L.card,['Noor isn’t seen as the person to talk to','The issue isn’t seen as worth talking about'],0,
   'Felix accepts the issue matters but doesn’t see Noor as the person for it. The book notes even long-standing clients can feel this way about new issues.',
   'Felix clearly thinks the issue matters: “a big headache”. What’s missing is seeing Noor as the right person to discuss it with.');}},

/* ---------- PART 3: NEW CLIENTS ---------- */
{part:2,src:'Chapter 10 · Engaging with New Clients',run(L){
  L.h(L.kick('learn','Enter the client’s world')+'<h1 class="q">Show the client you are visibly trying to fit them</h1>'+
   L.prose('With a new client, doing something a little different, <b>customized to this client</b>, is powerful. Not as a sales trick, but because it signals: these people aren’t like the others; they are working to earn my attention.')+
   L.list([['Visibly customize','Use the client’s own formats, or weave their products into how you present.'],
           ['Bring a point of view','One consulting firm studied each target’s industry first, then offered to share its insights for free, admitting the client knew the business better.'],
           ['Show you understand their wants','Not their needs: their wants. And you don’t have to deliver yet, only show you understand.']],1)+
   L.prose('Why does it work? Because it’s rare. Most advisors are busy with their own lines, slides and appearance, all focused on themselves. A clear, client-focused view stands out.'));
  L.done();}},
{part:2,src:'Chapter 10 · Engaging New Clients',run(L){
  L.h(L.kick('learn','Before the first meeting')+'<h1 class="q">You can make your own luck with a new client</h1>'+
   L.list([['eye','Research everything','Search the company and the person (a search, not snooping). Then ask around: who knows someone who has worked with them?'],
     ['list','Bring 2–3 topics','Topics, not questions. Avoid stale ones. A view on competitors or rivals is almost always of interest.'],
     ['star','Have something of interest','Drop hints about relevant work, without name-dropping. It must interest <i>them</i>.'],
     ['people','A new friend, not an old one','Pure content makes you look like a technician. But pretending to be overly familiar is worse.'],
     ['clock','No value? Postpone','A meeting alone isn’t enough. Wait until you can add value.']],2));
  L.done();}},
{part:2,src:'Chapter 10 · Engaging New Clients',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">Noor prepares for a first meeting with Sasha at Brightwell</h1>');
  L.beats(L.card,[
   ['Research','Noor reads Brightwell’s site, news of its new clinics and Sasha’s profile. Tomasz knows a physio who once worked with Sasha.'],
   ['What Sasha wants','The physio mentions Sasha’s frustration: the last firm sent surprise bills and generic advice. Sasha wants predictable costs and advice that fits clinics.'],
   ['Topics, not questions','Noor picks two: how fast-growing clinic chains handle contractor versus employee status for physios, and how to cost legal work up front.'],
   ['Customize','Noor’s one-page summary uses Brightwell’s own clinic names, and opens with Sasha’s wants, not Larkmoor’s history.'],
   ['Tone','Friendly but not chummy: Sasha is a new acquaintance, and Sasha never decides on the spot.']],
   'Noor engages by showing understanding of what Sasha <i>wants</i>, before offering anything.');}},
{part:2,src:'Chapter 10 · Engaging with New Clients',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Which opening line is most likely to engage Sasha?</h1>');
  L.mc(L.card,['“Tell me, what are Brightwell’s biggest legal problems right now?”','“I gather predictable fees matter to you. Can I share how we’d handle that?”','“Larkmoor has twenty years of experience with healthcare employers.”'],1,
   'It shows Noor understands what Sasha wants, and offers something of value. That’s engagement.',
   'Asking about problems brings nothing to the meeting, and reciting experience is about Larkmoor. Showing you understand Sasha’s wants is what engages.');}},
{part:2,src:'Chapter 10 · Engaging New Clients',pts:6,run(L){
  L.h(L.kick('pr','Helps or hurts?')+'<h1 class="q">Sort Noor’s plans for engaging Sasha.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Helps engage','Hurts engagement'],[
   ['Prepare a point of view on how rival clinic chains handle physio contracts.',0,'A view on competitors is almost always of interest.'],
   ['Open with a list of Larkmoor’s biggest healthcare clients.',1,'Name-dropping is about Larkmoor, not Sasha.'],
   ['Greet Sasha like an old pal and use first-name jokes right away.',1,'Pretending to be overly familiar is worse than being formal. Treat them as a new friend.'],
   ['Present the summary in the format Brightwell uses for its own reports.',0,'Visibly customizing shows Larkmoor is trying to earn Sasha’s attention.'],
   ['Keep the meeting purely to legal facts and fee rates.',1,'Purely transactional talk gets you pegged as a technician, not an advisor.'],
   ['Ask a mutual contact what Sasha cares about most.',0,'Second-stage research through people who know them is an easy win.']],
   'Engaging a new client is about them: their wants, their world, their format.');}},
{part:2,src:'Chapter 10 · Engaging New Clients',pts:1,run(L){
  L.h(L.kick('pr','Meeting tomorrow')+'<h1 class="q">Sasha offers a slot tomorrow. Noor hasn’t yet found anything useful to say about Brightwell. What does the book suggest?</h1>');
  L.mc(L.card,['Go anyway; any meeting is better than none','Postpone until there is real value to bring','Go, and spend the time asking about problems'],1,
   'The book is direct: a meeting alone isn’t enough. If you can’t add value, wait until you can.',
   'An empty meeting, or one spent only asking about problems, is just what busy clients complain about. Postpone until you can add value.');}},

/* ---------- PART 4: EXISTING CLIENTS ---------- */
{part:3,src:'Chapter 10 · (Re-)Engaging with Existing Clients',run(L){
  L.h(L.kick('learn','Re-engaging existing clients')+'<h1 class="q">Old clients will hear you out. That isn’t the same as opening up</h1>'+
   L.prose('Existing clients give you an audience: they listen and nod. But they don’t always engage. To get them to open up, you still need something new and interesting, ideally drawn from what you learned on earlier work.')+
   L.list([['trend','Competitors','Concern about what a rival is doing.'],
     ['person','Their career','An understanding of a challenge facing this person, such as succession.'],
     ['alert','A concern they raised','An idea on a management issue they mentioned before.'],
     ['cycle','Continuity','“I’ve been thinking about something you said last month.”']],3)+
   '<p class="small" style="margin-top:10px">Early in a relationship you haven’t earned the right to talk about someone’s career. Later, you can.</p>');
  L.done();}},
{part:3,src:'Chapter 10 · (Re-)Engaging with Existing Clients',run(L){
  L.h(L.kick('learn','Timing')+'<h1 class="q">The right topic, at the right time</h1>'+
   L.prose('Time with clients is limited. Choose badly and you get even less. The book borrows the difference between '+L.g('urgent-important','urgent and important')+' and gives two rules of thumb. First, always check how much time the client has.')+
   L.lanes([['clock','Five minutes','Lay out the agenda. Start with the <b>urgent</b>, end with the <b>important</b>, even if just a thought to come back to.',4],
            ['cal','More time','Start with the <b>important</b>. Save five minutes at the end for the <b>urgent</b>.',2]])+
   L.note('Second rule: don’t hold back from raising a topic, even if you can’t cover it all. Showing you care, even briefly, can pay off years later.','info'));
  L.done();}},
{part:3,src:'Chapter 10 · (Re-)Engaging with Existing Clients',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">Months after the closures, Corran has gone quiet</h1>');
  L.beats(L.card,[
   ['The gap','The closures went well. Since then, no new work from Corran for four months. Dana is friendly on email, but that’s all.'],
   ['Not this','Noor drafts a note: “Just checking in, let us know if you need anything!” Dana would nod, and nothing would happen.'],
   ['Something specific','Noor recalls Dana mentioning that skilled bakers are hard to find, and reads that Corran’s competitor is recruiting abroad.'],
   ['The message','“Dana, I’ve kept thinking about what you said about the baker shortage. A rival seems to be hiring overseas. I haven’t worked it all out, but a few ideas came to mind. Want to talk it over? No charge.”'],
   ['A way out','Noor adds that Dana should say if the timing is wrong. Dana replies within an hour.']],
   'Continuity, a competitor, a concern Dana raised, and no charge: something specific, not a generic check-in.');}},
{part:3,src:'Chapter 10 · (Re-)Engaging with Existing Clients',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Noor bumps into Dana in Corran’s corridor; Dana has five minutes. Noor has an urgent consultation deadline and a bigger idea about overseas hiring. What’s the best order?</h1>');
  L.mc(L.card,['The big idea first, since it matters more in the end','Only the deadline; leave the idea for another day','Agenda, the deadline first, then a line on the idea'],2,
   'With little time, start with the urgent and end with the important, even as just a thought to come back to.',
   'With five minutes, start with the urgent. But don’t drop the important topic: the book says to raise it, even briefly.');}},
{part:3,src:'Chapter 10 · (Re-)Engaging with Existing Clients',pts:1,run(L){
  L.h(L.kick('pr','Build the message')+'<h1 class="q">Noor wants to re-engage Felix after a quiet spell. Tap each part until the message would engage.</h1>');
  L.sentence(L.card,[['“Felix, just checking in:','“Felix, at our last meeting','“Felix, as your law firm,'],['you were worried about','we’d love to tell you about','you might need'],['night-shift rules in the new wholesale unit.','our new employment services.','help this year.'],['Shall I share some thoughts?”','Call us any time!”']],[1,0,0,0],
   [['A check-in carries nothing new or specific.','Starting with your role makes it about you.'],['That turns the message into a pitch.','Too vague to show you remember anything.'],['A sales pitch, not something about Felix’s world.','Generic. It shows no knowledge of Corran.'],['An open “call us” puts the work back on Felix and offers nothing.']],
   'It builds continuity on something Felix said, is specific to Corran, and offers ideas without a pitch.');}},
{part:3,src:'Chapter 10',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Mixed review: good engagement move?',['Good move','Poor move'],[
   ['Rafa plans to meet Owen Pike, a stranger, and to open by asking about Owen’s career worries.',1,'Career topics are for later, once the right is earned. Early on, bring content and a point of view.'],
   ['Noor sends Dana a short note on a rival’s new staffing plan, with an offer to discuss it, free.',0,'Concern about competitors, offered at no charge, gives Dana something to engage with.'],
   ['Ines books a call with Sasha with no agenda, “just to touch base”.',1,'A meeting with no value is what busy clients resent. Wait until you can add value.'],
   ['With an hour to spare, Noor starts with the important topic and keeps five minutes for the urgent one.',0,'That’s the book’s rule when you have more time.'],
   ['Noor holds back an idea because there isn’t time to explain it fully.',1,'Don’t hold back. Even a brief mention shows you care.']]);}}
  ]
});
</script>
</body>
</html>
