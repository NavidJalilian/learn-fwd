<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Quick-Impact List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0018', title:'The quick-impact list', minutes:18, icon:'flame',
  goals:['Use the book’s fastest trust builders in your next client conversation','Pick the right quick-impact move for a real moment','Steady your own mind before a hard meeting'],
  parts:['Listen and feel','Share and risk','Give more','Your own mind'],
  read:'Read chapter 22 of the book for the full list of sayings, tips and reminders.',
  glossary:{
   'paraphrase':'Paraphrase: saying back, in your own words, what the other person just told you.',
   'shared-agenda':'Shared agenda: opening a meeting with your idea of what to cover, then sincerely asking the client what they would add.',
   'open-ended':'Open-ended question: a question that can’t be answered yes or no, so the speaker chooses what matters and how to frame it.'
  },
  cheatsheet:[
    '<b>Listen to everything</b>: paraphrase until they say “Yes, that’s exactly it.”',
    '<b>Empathize for real</b>: you don’t have to agree, just understand. When you think “they’re wrong”, ask why they believe it.',
    '<b>Note what they’re feeling</b>: one honest observation, a few words. Less risky than it feels.',
    'Open with a <b>shared agenda</b>. Float a <b>point of view</b> even if you’re not sure. Take a <b>personal risk</b>.',
    'Ask about a <b>related area</b> and ask <b>open-ended</b> questions: both show you care.',
    '<b>Give away ideas</b> (expertise only grows with use) and <b>return calls unbelievably fast</b>.',
    '<b>Relax your mind</b>: before a hard meeting, focus on one saying, such as “What am I afraid of here?”',
    'Deliver exactly what you promised. And the final suggestion: call your client, now.'
  ],
  steps:[
/* ---------- PART 1: LISTEN AND FEEL ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">You tell a colleague your big meeting went badly. Which reply makes you trust them more?</h1>');
  L.mc(L.card,['“Here’s what you should do next time.”','“So you felt blindsided in there? What happened?”'],1,
   'Being heard first makes advice easier to take later. This lesson is the book’s list of quick moves like that one.',
   'Advice can wait. Most people trust the colleague who first shows they heard. That’s the first item on this lesson’s list.');}},
{part:0,src:'Chapter 22 · The Quick-Impact List to Gain Trust',run(L){
  L.h(L.kick('learn','Two quick wins to start')+'<h1 class="q">What builds trust fastest?</h1>'+
   L.prose('The authors are often asked for the highest-impact, fastest-payback ways to build trust. Their last chapter is that list: eleven actions, plus tips and reminders. The first two are about hearing the client.')+
   L.tiers([['eye','1 · Listen to everything','Force yourself to '+L.g('paraphrase','paraphrase')+'. If the client doesn’t reply “Yes, that’s exactly what I’m saying,” you haven’t listened yet.'],
            ['people','2 · Empathize (for real)','Being heard isn’t the same as being understood. You don’t have to agree, only understand, and say that you do.']])+
   L.note('When you catch yourself thinking “this person is an idiot”, ask instead: <i>why do they believe this? What happened to make them think this way?</i>','bulb'));
  L.done();}},
{part:0,src:'Chapter 22 · 2. Empathize (for real)',run(L){
  L.h(L.kick('ex','Noor and Felix')+'<h1 class="q">Noor works hard to understand someone they disagree with</h1>');
  L.beats(L.card,[
   ['The moment','On their monthly call, Felix says: “The overseas hiring is just paperwork. Lawyers slow everything down.” Noor’s first thought: <i>that’s plainly wrong</i>.'],
   ['The switch','Noor asks themself why Felix believes it, then asks Felix: “What’s made legal steps feel slow?” Felix talks about a rival bakery that already has its new bakers in place.'],
   ['Listen','Noor paraphrases: “So every week of legal work feels like a week your rival gets ahead?” Felix: “Yes. Exactly that.”'],
   ['Understand and acknowledge','Noor says: “That makes sense. If I watched a competitor move faster, I’d feel the same pressure.”'],
   ['Earned the right','Only now does Noor disagree: skipping the sponsorship checks could stop the whole plan. Felix, for once, listens.']],
   'Listen, understand, and acknowledge that you understand. Someone who empathizes with us earns the right to disagree and still keep our respect.');}},
{part:0,src:'Chapter 22 · 1. Listen to everything',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">How does Noor know they’ve really listened to Sasha, by the book’s test?</h1>');
  L.mc(L.card,['Noor took full notes of everything Sasha said','Sasha hears Noor’s summary and says “Yes, that’s it”','Noor stayed silent until Sasha stopped talking'],1,
   'The test is on the speaker’s side: when your paraphrase gets “That’s exactly what I’m saying,” you’ve listened.',
   'Notes and silence happen on Noor’s side. The book’s test is the speaker confirming your paraphrase: “Yes, that’s exactly it.”');}},
{part:0,src:'Chapter 22 · 3. Note what they’re feeling',run(L){
  L.h(L.kick('learn','3 · Note what they’re feeling')+'<h1 class="q">A moment’s work, an instant payback</h1>'+
   L.prose('This one is purely emotional. It feels risky, but the book says the risk is far smaller than we think. All it takes is a valid observation and a few words from the heart: “You look excited today. What’s going on?”')+
   L.prose('The book cites Salacuse: a good advisor watches three things in every conversation. The authors add feelings to each.')+
   L.flow([['person','The client','their words, actions and feelings','',2],['chat','You','your own words, actions and feelings','',3],['eye','Their reaction','how the client reacts to you','',4]],false)+
   '<p class="small" style="margin-top:10px">Strongest: naming a feeling about the other person, or your own, with care. Noticing a third party’s feelings works too, a little less.</p>');
  L.done();}},
{part:0,src:'Chapter 22 · 3. Note what they’re feeling',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which of the three is Noor noticing?',['The client','Noor’s own','The reaction to Noor'],[
   ['Dana’s voice goes flat whenever the board comes up.',0,'That’s Dana’s own words and feelings.'],
   ['Noor realizes they’ve talked for five minutes straight.',1,'That’s Noor watching their own words and actions.'],
   ['Right after Noor suggests a new approach, Dana goes quiet.',2,'Dana’s silence is a reaction to what Noor just said.'],
   ['Noor feels irritation rising at Felix’s curt tone.',1,'That’s Noor’s own feeling, worth noticing before it leaks out.']]);}},

/* ---------- PART 2: SHARE AND RISK ---------- */
{part:1,src:'Chapter 22 · The Quick-Impact List to Gain Trust',run(L){
  L.h(L.kick('learn','Three moves that put something on the table')+'<h1 class="q">Share the agenda, a view, and a bit of yourself</h1>'+
   L.tiers([['list','4 · Build that shared agenda','The easiest item. Start every meeting or call with your idea of an agenda, then sincerely ask the client to add to it. You get data at once, you show a “we, not me” attitude, and you get buy-in.','',true,'Easiest'],
            ['compass','5 · Take a point of view','Even when you’re not sure. A view stirs reactions and makes the issues clearer. Soften it: “Let me float a trial balloon here…”'],
            ['shield','6 · Take a personal risk','Put a piece of yourself out there. That is what '+L.g('intimacy','intimacy')+' is. It doesn’t have to be private, just personal. It may not be returned, but it’s worth trying.']]));
  L.done();}},
{part:1,src:'Chapter 22 · 4. Build that shared agenda',pts:1,
 solve:async L=>{const c=L.$('#ag').children;c[0].click();c[1].click();},
 run(L){
  const V=[['Noor’s agenda','Noor opens: “Today I’ll cover progress on the employee review, then next steps.” Sasha nods and says little. On the way out, Sasha mentions the clinic managers are anxious about what the review means for their teams. Too late to discuss.','no'],
           ['Shared agenda','Noor opens: “I’d suggest progress on the review, then next steps. What would you add?” Sasha adds: the clinic managers are anxious, and rumors are reaching therapists. They spend half the meeting on it, and Sasha talks more openly than ever.','ok']];
  const seen=new Set();
  L.h(L.kick('pr','Toggle and compare')+'<h1 class="q">Noor meets Sasha about the Brightwell review. Try both openings.</h1><div id="ag"></div>'+
   '<div id="av" style="background:var(--soft);border-radius:16px;padding:14px;margin:8px 0 6px;min-height:110px"><span class="small">Pick an opening above.</span></div><div id="aq"></div>');
  V.forEach((v,j)=>{const b=document.createElement('button');b.className='chip';b.innerHTML=L.ic(j?'people':'person')+v[0];
    b.onclick=()=>{[...L.$('#ag').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(j);
      L.$('#av').innerHTML='<p class="prose" style="margin:0;color:var(--'+v[2]+')">'+v[1]+'</p>';
      if(seen.size===2&&!L.$('#aq').innerHTML){const q=L.$('#aq');q.innerHTML='<h2 class="sub">What did the shared agenda give Noor right away?</h2>';
        L.mc(q,['A tighter meeting that stayed on Noor’s topics','Immediate data on what really worries Sasha'],1,
         'Asking “what would you add?” surfaced the managers’ anxiety while there was still time to deal with it. It also showed “we, not me”.',
         'The meeting didn’t stay on Noor’s topics, and that was the point. The book says a shared agenda gives you immediate data.');}};
    L.$('#ag').appendChild(b);});}},
{part:1,src:'Chapter 22 · 5. Take a point of view, for goodness’ sake!',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Sasha asks: “Should we make the self-employed therapists employees?” Noor isn’t sure yet. What does the book suggest?</h1>');
  L.mc(L.card,['Say it’s too early to hold any view at all','Give a firm answer so Noor looks confident','Float a view: “Probably not where we’ll land, but I lean…”'],2,
   'A point of view, even a tentative or wrong one, helps Sasha think. The framing phrase makes it safe to float.',
   'Silence gives Sasha nothing to react to, and false certainty is a risk of its own. The book says to float a view with a soft framing phrase.');}},
{part:1,src:'Chapter 22 · The Quick-Impact List to Gain Trust',pts:5,run(L){
  L.h(L.kick('pr','Name the move')+'<h1 class="q">Sort Noor’s moves this week.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Shared agenda','Point of view','Personal risk'],[
   ['Noor opens the Felix call: “Here’s what I’d like to cover. What would you add?”',0,'Proposing an agenda, then inviting the client’s items.'],
   ['“This probably isn’t where we’ll end up, but I’d hire in two waves.”',1,'A tentative view, softened by a framing phrase.'],
   ['Noor tells Dana about a case Noor once handled badly, and what it taught them',2,'Revealing something personal raises the level of intimacy.'],
   ['Noor lists three topics for Sasha’s clinic managers and asks for theirs',0,'A shared agenda works in groups too.'],
   ['Noor admits to Owen: “I’m honestly nervous about getting this right for you.”',2,'Owning a feeling puts a piece of Noor out there.']],
   'All three put something on the table first: the meeting plan, a view, or a piece of yourself.');}},

/* ---------- PART 3: GIVE MORE ---------- */
{part:2,src:'Chapter 22 · 7. Ask about a related area',run(L){
  L.h(L.kick('learn','Curiosity beyond the job')+'<h1 class="q">Look past the assignment, and ask well</h1>'+
   L.lanes([['compass','7 · Ask about a related area','Specialists focus on the job at hand. The book says that risks failing a professional duty: to notice chances to help. Advisors who notice things outside their field make an impression: they care, because they do.',2],
            ['chat','8 · Ask great questions',L.g('open-ended','Open-ended')+' questions stop you prejudging the answer. The speaker sets the frame: what matters, what came first, what caused what. That carries respect.',3]])+
   L.prose('A good sign: if your curiosity about the client’s business has grown a lot, you care. Asking those questions will come across that way.'));
  L.done();}},
{part:2,src:'Chapter 22 · 9. Give away ideas',run(L){
  L.h(L.kick('learn','Generous and fast')+'<h1 class="q">Give ideas freely, and call back sooner than anyone expects</h1>'+
   L.prose('<b>9 · Give away ideas.</b> The book cites David Nadler, a consulting CEO, who answers clients with three to five ideas, introduced as possibly wild or off the mark. Many advisors fear “giving away the store”. The book disagrees: expertise isn’t a fixed stock.')+
   L.quote('You destroy it only by not giving it away.','The authors, on expertise and love')+
   L.prose('<b>10 · Return calls unbelievably fast.</b> Stephanie Wethered, a pastor the book quotes earlier, tries to return calls within ten minutes. She calls it the most trust-building thing she does: no one expects it, and it shows how much she values the person.'));
  L.done();}},
{part:2,src:'Chapter 22 · The Quick-Impact List to Gain Trust',run(L){
  L.h(L.kick('ex','A Tuesday with Owen')+'<h1 class="q">Four quick-impact items in one short call</h1>');
  L.beats(L.card,[
   ['Fast','Owen leaves a message at 10:02 about the night shifts. Noor rings back at 10:09. Owen is surprised: “That was quick.”'],
   ['Great question','Noor asks: “What’s been on your mind about the night shifts?” Owen talks for ten minutes, including things Noor would never have guessed.'],
   ['Give away ideas','Noor offers three rough ideas for the rotas: “These may be off the mark, but let’s think about…” No meter running.'],
   ['Related area','Noor asks how the new supermarket deliveries are changing staffing. Owen pauses: “Nobody’s asked me that.”'],
   ['The effect','Owen ends the call by asking Noor to look at the wholesale contracts too. Noor didn’t pitch anything.']],
   'Speed shows Owen is valued, open questions let Owen set the frame, free ideas show Noor’s worth, and curiosity shows care.');}},
{part:2,src:'Chapter 22 · 8. Ask great questions',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Which question to Owen is open-ended?</h1>');
  L.mc(L.card,['“Are the night shifts causing you problems?”','“Is it the overtime rules that worry you most?”','“How did the night rota end up the way it is?”'],2,
   'It can’t be answered yes or no, and it lets Owen decide what matters and in what order.',
   'Those can be answered yes or no, and the second already picks the problem for Owen. “How did…” lets Owen set the frame.');}},
{part:2,src:'Chapter 22 · 8. Ask great questions',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Open or closed?',['Open-ended','Closed or leading'],[
   ['“What matters most to you in this review?”',0,'Sasha chooses what matters.'],
   ['“You’d agree the rota is the real issue, right?”',1,'It leads Owen to Noor’s answer, prejudging what Noor hears.'],
   ['“Did the clinic managers complain?”',1,'Yes or no, and it forces the answer into Noor’s category.'],
   ['“Walk me through how hiring works at a new clinic.”',0,'Sasha sets the order and the emphasis.']]);}},
{part:2,src:'Chapter 22 · 9. Give away ideas',pts:1,run(L){
  L.h(L.kick('pr','Coach Ines')+'<h1 class="q">Ines worries: “If Noor keeps giving Owen ideas for free, why would Corran ever pay us?” What fits the book?</h1>');
  L.mc(L.card,['Hold ideas back until Owen signs a new engagement letter','Share only the ideas already in Larkmoor’s public guides','Share freely: expertise isn’t a fixed store, and it grows with use'],2,
   'The book says the store isn’t limited. What clients value is your ability to redefine problems, and it only gets better with practice.',
   'Both options treat expertise as a limited store to protect. The book says it’s unlimited, and destroyed only by not giving it away.');}},

/* ---------- PART 4: YOUR OWN MIND ---------- */
{part:3,src:'Chapter 22 · 11. Relax your mind',run(L){
  L.h(L.kick('learn','11 · Relax your mind')+'<h1 class="q">Clear your head before a hard meeting</h1>'+
   L.prose('Before a stressful meeting, spend a little time focused on one piece of wisdom. It might be a minute at bedtime, a few minutes writing about it, or talking it through aloud in the car before the call.')+
   L.prose('The book offers a list of sayings built on its key ideas. Think about <b>only one at a time</b>. A few of them, in short:')+
   L.list([['target','It’s about the client','Who am I really thinking about right now?'],
     ['alert','What am I afraid of here?','Fear is often what drives the wrong move.'],
     ['compass','The first problem is rarely the real one','What the client says first is a starting point.'],
     ['scale','Blame traps, responsibility frees','Assigning blame will trap you; taking responsibility gives you power.'],
     ['bulb','A point of view isn’t forever','Voicing a view doesn’t commit you for life.']],1));
  L.done();}},
{part:3,src:'Chapter 22 · 11. Relax your mind',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Pick Noor’s saying for the moment',['What am I afraid of here?','Responsibility, not blame','The first problem isn’t the real one','A view isn’t forever'],[
   ['Before the Felix call, Noor’s pulse races and Noor wants to postpone it.',0,'Naming the fear is the first step to acting despite it.'],
   ['A Corran deadline slips. Noor starts an email explaining it was Ines’s fault.',1,'Blame traps Noor; owning it gives Noor something to do.'],
   ['Sasha asks only for a template contract. Noor is about to just send it.',2,'The request may hide a bigger issue worth a question first.'],
   ['Noor has a hunch about Owen’s rota but won’t say it in case it’s wrong.',3,'Floating a view doesn’t lock Noor in. It helps Owen think.']]);}},
{part:3,src:'Chapter 22 · Top Things to Remind Yourself',run(L){
  L.h(L.kick('learn','More tips and reminders')+'<h1 class="q">Small habits to carry into every meeting</h1>'+
   L.list([['Deliver exactly','Make a commitment and deliver it: not over, not under. Just deliver.'],
     ['Don’t answer the first time','Ask for clarification first. The question asked isn’t always the right one to answer.'],
     ['Stop proving yourself','You don’t have to prove yourself every ten seconds. You have a right to be in the room.'],
     ['Conversation, not argument','Trying to win an argument? Turn it back into a conversation.'],
     ['Define the problem','More value comes from defining the problem than from answering it.']],2)+
   L.note('<b>Two final suggestions.</b> Call your client, now. And tell your partner how much they’re appreciated, today.','star'));
  L.done();}},
{part:3,src:'Chapter 22 · The Quick-Impact List to Gain Trust',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Mixed review',['Listen to everything','Note what they’re feeling','Take a point of view','Give away ideas','Return calls fast'],[
   ['Noor tells Dana: “You sound worn out today. Is the board on you again?”',1,'One honest observation about a feeling, a few words.'],
   ['Owen leaves a message at 3:10; Noor rings back at 3:18.',4,'No one expects it, and it shows Owen is valued.'],
   ['“Let me float a trial balloon: hire the overseas bakers in two waves.”',2,'A tentative view with a soft framing phrase.'],
   ['Noor repeats Sasha’s worry back until Sasha says “Exactly.”',0,'Paraphrasing until the speaker confirms it.'],
   ['On a call, Noor offers Owen four rough ideas for the night rota.',3,'Several ideas, given freely, framed as possibly off the mark.']]);}},
{part:3,src:'Chapter 22 · Two Final Suggestions',pts:1,run(L){
  L.h(L.kick('pr','The last decision')+'<h1 class="q">It’s Friday afternoon. Noor has just finished this list and hasn’t spoken to Dana in three weeks. What does the book suggest?</h1>');
  L.mc(L.card,['Note a call with Dana for next month’s plan','Send Dana a link to Larkmoor’s newsletter','Call Dana now'],2,
   'The book’s final suggestion is simple: call your client, now. Trust grows through action, not plans.',
   'A plan or a newsletter keeps the trust-building for later. The book ends with one direct suggestion: call your client, now.');}}
  ]
});
</script>
</body>
</html>
