<title>The Case of Cross-Selling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">

</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0017', title:'The case of cross-selling', minutes:20, icon:'people',
  goals:['Tell the three kinds of cross-selling apart: Expand, Broaden and Diversify','Spot why “just introduce us” draws trust down, and what to do instead','Raise the awkward, unspoken issues of a cross-sell openly'],
  parts:['Strangers','Expand','Broaden and Diversify','The hidden relationship'],
  read:'Read chapter 21 of the book for Amy’s full scripts and the trust scoring of each scenario.',
  glossary:{
   'expand':'Expand: cross-selling a new service to a client person you already serve. The new player is your firm’s expert.',
   'broaden':'Broaden: cross-selling a service you already provide to a new person in the client organization.',
   'diversify':'Diversify: cross-selling a new service to a new person in the client organization. Both sides bring someone new.',
   'internal-sale':'Internal sale: persuading your own colleague, the expert, that a cross-selling lead is worth their time.',
   'naming-and-claiming':'Naming and claiming: saying the “unsayable” by (1) acknowledging it is hard to raise, (2) taking responsibility for raising it, (3) stating it directly.'
  },
  cheatsheet:[
    'Cross-selling is about <b>new relationships</b>. Trust is personal; a firm’s relationship can’t pass it on.',
    '<b>Expand</b> = new service, same client person. <b>Broaden</b> = same service, new client person. <b>Diversify</b> = new service, new person.',
    '“Passing the business card” or “I just need an intro” asks a favor and offers little back. Trust drops, often below a new-client level.',
    'Win the <b>internal sale</b> first: spend a little extra time briefing your expert about the client.',
    'In Broaden, the existing client must be on the selling team. Give honest reasons that serve them, and only say what you believe.',
    'Diversify: do the internal sales first, iterate, and hold the full meeting only when there’s no good reason left to wait.',
    'The bigger issue is <b>your own</b> trust, not the expert’s. “They’re great, I’ve known them for years” draws trust down.',
    'Name and claim the unspoken worries; use the trust equation as a checklist; invest your own time first.'
  ],
  steps:[
/* ---------- PART 1: STRANGERS ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Your accountant, whom you’ve trusted for years, hands you a card: “My colleague does financial planning. You should call them.” How do you feel?</h1>');
  L.mc(L.card,['Ready to trust the colleague as much as the accountant','A bit put on the spot, and unsure about the colleague'],1,
   'Most people feel a little cornered. You trust the accountant, not a stranger with a card. This lesson is about why, and what to do instead.',
   'Trust in the accountant doesn’t pour straight into a stranger. Most people feel put on the spot. That’s this lesson’s first idea.');}},
{part:0,src:'Chapter 21 · The Case of Cross-Selling',run(L){
  L.h(L.kick('learn','What cross-selling really is')+'<h1 class="q">Selling inside a client you already have means meeting strangers</h1>'+
   L.prose('<b>'+L.g('cross-selling','Cross-selling')+'</b> means selling within an organization that is already a client. It always brings in someone new: a new person on the client side, a new expert from your firm, or both.')+
   L.quote('Cross-selling is as much about strangers as it is about relationships.','The authors, chapter 21')+
   L.prose('Many firms assume the client’s trust in “the firm” will carry over to a colleague. The book says it can’t. <b>Trust is personal</b>, and it doesn’t transfer easily. Deep trust in you helps the client take your word about a colleague, but it’s rarely enough.')+
   L.note('The book compares it to meeting your future in-laws: they’ll probably like you, but don’t take it for granted. More than one relationship is at stake.','people'));
  L.done();}},
{part:0,src:'Chapter 21 · Types of Cross-Selling',run(L){
  L.h(L.kick('learn','Three types')+'<h1 class="q">Who is new in the room?</h1>'+
   L.prose('The book adapts an old map of old and new customers against old and new products. It names three cross-selling types:')+
   L.tiers([['arrow',L.g('expand','Expand'),'A <b>new service</b> to a client person you already serve. The new player is your firm’s expert.','Rafa’s immigration work, offered to Dana'],
            ['people',L.g('broaden','Broaden'),'The <b>same service</b> to a <b>new person</b> in the client, perhaps another division. The new player is on the client side.','Noor’s employment work, offered to Owen'],
            ['layers',L.g('diversify','Diversify'),'A <b>new service</b> to a <b>new person</b>. Two new players, one from each side.','Rafa’s immigration work, offered to Owen']])+
   '<p class="small" style="margin-top:10px">The more strangers involved, the lower the starting trust.</p>');
  L.done();}},
{part:0,src:'Chapter 21 · Types of Cross-Selling',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Rafa wants to help Corran hire bakers from abroad, and wants Noor to pitch it to Dana. Which type is this?</h1>');
  L.mc(L.card,['Broaden','Diversify','Expand'],2,
   'Dana is Noor’s existing client person; the service, immigration, is new. New service, same person: Expand.',
   'Dana already knows Noor, so the client person isn’t new. Only the service is new. That’s Expand.');}},
{part:0,src:'Chapter 21 · Types of Cross-Selling',pts:5,run(L){
  L.h(L.kick('pr','Name the type')+'<h1 class="q">Larkmoor sees five openings at its clients. Sort each one.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Expand','Broaden','Diversify'],[
   ['Noor offers Owen the same contract review Noor does for Dana',1,'Same service, new client person: Broaden.'],
   ['Rafa’s immigration advice for Owen’s night production line',2,'New service and a new client person: Diversify.'],
   ['Larkmoor’s pensions expert offered to Dana, whom Noor serves',0,'Dana already works with Noor; only the service is new: Expand.'],
   ['Noor’s Brightwell review offered to Brightwell’s finance director',1,'Same service, a new person at an existing client: Broaden.'],
   ['Larkmoor’s data-privacy partner pitched to Felix, who has never hired Noor',2,'Felix isn’t the client person Noor serves, and the service is new: Diversify.']],
   'Ask two questions: is the service new, and is the client person new? One “yes” to the service is Expand, one to the person is Broaden, two is Diversify.');}},

/* ---------- PART 2: EXPAND ---------- */
{part:1,src:'Chapter 21 · Type 1 (Expand)',run(L){
  L.h(L.kick('ex','The book’s Amy and Curt, at Larkmoor')+'<h1 class="q">Noor “passes the business card” to Dana</h1>');
  L.beats(L.card,[
   ['The book’s case','Amy wants her client Curt to meet her colleague Barbara, an expert in a new area. Curt thinks of Amy’s firm only as people who do what they already do for him.'],
   ['At Larkmoor','Rafa tells Noor: “Just get me in front of Dana.” On a call about contracts, Noor says Corran’s overseas plan is important, Larkmoor has expertise, and adds: “Here are Rafa’s details. Rafa can call you, or you can call Rafa.”'],
   ['What Dana thinks','Dana knows Larkmoor as “the contracts people” and doesn’t know Rafa. Dana feels cornered: asked for something, with nothing offered back.'],
   ['What happens to trust','The book says trust must <b>grow</b> during a sale. Here it is drawn down. To Dana, Noor suddenly sounds like a salesperson asking a favor.'],
   ['The ending','Dana has no graceful way to say no, so Dana quietly buries the request. Noor is left wondering what happened.']],
   'A warm relationship doesn’t make a cold pitch warm. Asking a favor while offering little back spends the trust you built.');}},
{part:1,src:'Chapter 21 · Type 1 (Expand)',pts:1,
 solve:async L=>{L.$('#po').children[2].click();L.$('#pass').click();},
 run(L){
  let p=null;const O=['Stays near 5','Drops, but stays above 1.25','Drops below 1.25'];
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">Dana’s trust in Noor scores about 5, the book’s figure for an existing client. A brand-new client scores 1.25. Where does Dana’s trust land after Noor passes the card?</h1><div id="po"></div>'+
   '<div id="tw" hidden><div style="position:relative;height:26px;background:var(--soft2);border-radius:13px;margin:16px 0 4px;overflow:hidden"><div id="tm" style="height:100%;width:83%;background:var(--ok-strong);border-radius:13px;transition:width 2s ease,background 2s ease"></div><div style="position:absolute;top:0;bottom:0;left:21%;border-left:2px dashed var(--muted)"></div></div>'+
   '<div class="small" style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px"><span>0</span><span>new client 1.25 (dashed)</span><span>existing 5</span></div>'+
   '<button class="btn pri" id="pass" style="margin-top:12px">'+L.ic('play')+'Noor passes the card</button></div>');
  O.forEach((o,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=o;b.onclick=()=>{if(p!==null)return;p=j;b.classList.add('sel');L.$('#tw').hidden=false;};L.$('#po').appendChild(b);});
  L.$('#pass').onclick=function(){this.remove();const m=L.$('#tm');m.style.width='15%';m.style.background='var(--no)';
    setTimeout(()=>{if(!L.$('#tm'))return;L.award(p===2);
      L.sheet(p===2?'ok':'no',p===2?'You called it':'It drops below 1.25','The book scores this scenario <b>lower than a brand-new client</b>. Dana is used to high trust with Noor, and suddenly feels like a customer at a used-car lot. The book adds: if your own estimates differ, plug in your own numbers.');L.done();},2100);};}},
{part:1,src:'Chapter 21 · Type 1 (Expand)',run(L){
  L.h(L.kick('learn','The internal sale')+'<h1 class="q">Before Dana, Noor has to win over Rafa</h1>'+
   L.prose('The book points to a second relationship: between the advisor and the expert colleague. It calls persuading the colleague the <b>'+L.g('internal-sale','internal sale')+'</b>. The expert has real reasons to hold back:')+
   L.list([['Less credit','In many firms, the expert gets less credit for serving someone else’s client than for bringing in their own.'],
     ['Precious time','Has the advisor really checked this client out, or is it a time sink?'],
     ['Risk of embarrassment','The advisor may have misread the problem, promised too much, or quoted too low a price.'],
     ['Nothing said out loud','As colleagues, neither can openly admit self-interest. That limits what they say.']],3)+
   L.note('<b>The fix:</b> spend a little more time than usual briefing the expert about the client, enough to be a small sacrifice. That shows the issue is real, that you have their interests at heart, and that they aren’t being set up.','clock'));
  L.done();}},
{part:1,src:'Chapter 21 · Type 1 (Expand)',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Noor wants Rafa to trust that Corran’s overseas plan is a real, solid lead. What should Noor do first?</h1>');
  L.mc(L.card,['Forward Rafa the old Corran contracts and let Rafa read up','Promise Rafa that Dana is eager and the fee will be large','Spend an extra hour walking Rafa through Corran and the issue'],2,
   'Giving up a little of Noor’s own time builds credibility and intimacy with Rafa, and lets Rafa judge the lead for themself.',
   'Promises and a pile of documents ask Rafa to do the work or take Noor’s word. The book’s fix is Noor investing time in briefing Rafa.');}},
{part:1,src:'Chapter 21 · Type 1 (Expand)',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'What is Rafa worried about?',['Less credit','Precious time','Embarrassment','Unspoken self-interest'],[
   ['“If I land Corran, the books will show it as Noor’s client anyway.”',0,'Serving a colleague’s client often earns the expert less credit.'],
   ['“Has Noor actually checked that Corran is serious? I can’t chase every hunch.”',1,'The expert fears a time sink if the client wasn’t qualified.'],
   ['“What if Noor already told Dana a fixed price for visas?”',2,'The advisor may have poisoned the job before it starts.'],
   ['Rafa and Noor both want the fees, but each talks only about “helping the client”.',3,'As colleagues, neither can admit self-interest openly, which limits the conversation.']]);}},

/* ---------- PART 3: BROADEN AND DIVERSIFY ---------- */
{part:2,src:'Chapter 21 · Type 2 (Broaden)',run(L){
  L.h(L.kick('ex','“I just need an intro”')+'<h1 class="q">Noor asks Dana to open the door to Owen</h1>');
  L.beats(L.card,[
   ['The setup','Owen runs Corran’s new wholesale division and has night-shift rules to sort out. Noor could do the same contract work for Owen that Noor does for Dana. That’s Broaden.'],
   ['The ask','Noor says: “The closures work went well. Owen’s team could use the same help. Could you introduce us? No presentation, just a good word. We’ll take it from there.”'],
   ['How Dana sees it','Dana is asked to vouch for Larkmoor to a colleague, and to judge that colleague’s needs. If it goes badly, Dana looks bad. There’s no clear upside.'],
   ['The result','Dana feels taken for granted. The book scores this higher than Expand, but still far below the existing relationship, close to a new client.'],
   ['The lesson','Another relationship is at stake too: Dana and Owen. In Broaden, the existing client must be on the selling team.']],
   'Withdrawals, not deposits. An intro sounds small to you, but it’s a real risk for the client who gives it.');}},
{part:2,src:'Chapter 21 · Type 2 (Broaden)',run(L){
  L.h(L.kick('learn','Bring the client onto the selling team')+'<h1 class="q">Answer “what’s in it for me?” honestly</h1>'+
   L.prose('Dana is the most objective voice and the closest in interest to Owen. Leaving Dana out would send a bad signal. So Noor must show how the interests are intertwined. The book lists reasons like these:')+
   L.list([['book','What Larkmoor already knows','Knowledge from Dana’s work makes Larkmoor better for Owen.'],
     ['star','It reflects on Dana','Good work for Owen reflects well on Dana.'],
     ['people','Shared issues go smoothly','Issues between Owen’s unit and Dana are handled with knowledge of both.'],
     ['bulb','Two-way insight','Work for Owen may shed light on Dana’s own work, and there may be savings of scale.']],2)+
   L.note('<b>Belief matters more than wording.</b> Noor must believe the cross-sell is good for Corran, and that staying silent would be unprofessional. If it isn’t true, don’t say it.','scale'));
  L.done();}},
{part:2,src:'Chapter 21 · Type 2 (Broaden)',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Why does the book say Dana should be part of selling to Owen, not just the door-opener?</h1>');
  L.mc(L.card,['Dana is the most objective voice, with interests close to Owen’s','Dana owes Larkmoor a favor after six years of good work','Dana can sign Owen’s engagement letter on Owen’s behalf'],0,
   'Dana knows the work and shares Corran’s interests. Leaving Dana out would also send a negative signal.',
   'It isn’t about favors or authority. Dana is the most objective voice, with interests in line with Owen’s, and leaving Dana out would look bad.');}},
{part:2,src:'Chapter 21 · Type 2 (Broaden)',pts:5,run(L){
  L.h(L.kick('pr','Honest reason or not?')+'<h1 class="q">Noor drafts reasons to give Dana. Which would serve Dana, and which only serve Larkmoor?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Serves Dana','Only Larkmoor'],[
   ['Larkmoor already knows Corran’s contracts, so Owen’s work starts faster',0,'Prior client knowledge makes the work better for Corran.'],
   ['Larkmoor wants to grow Corran fees this year',1,'True, but it’s Larkmoor’s interest. Leading with it raises self-orientation.'],
   ['Good night-shift rules in Owen’s unit will reflect well on Dana',0,'A good result for Owen reflects well on Dana.'],
   ['After six years, Dana surely owes Noor a good word',1,'That treats Dana’s trust as a debt to collect. It’s a withdrawal.'],
   ['Owen’s night-shift rules may reveal gaps in Dana’s own policies',0,'Work for one part of a client can give insight into another.']],
   'Lead with what’s genuinely good for Corran. If Noor doesn’t believe a reason, Dana won’t either.');}},
{part:2,src:'Chapter 21 · Type 3 (Diversify)',run(L){
  L.h(L.kick('learn','Diversify: the hardest case')+'<h1 class="q">Rafa’s immigration work, for Owen</h1>'+
   L.prose('If the sale happens, the relationship will be between Rafa and Owen. But four other relationships are in play: Noor and Dana, Noor and Rafa, Dana and Rafa, and Dana and Owen. Trust starts lower than in either earlier case.')+
   L.flow([['people','Internal sale first','Talk to Rafa, the expert',''],['chat','Then the client','Learn more from Dana; dare to define the problem',''],['cycle','Iterate','Repeat until no good reason to wait','']])+
   L.prose('The full meeting goes smoothly only when everyone can see five things: all parties invested serious time, the problem is well understood, the expertise is real and known, everyone’s interest is genuine, and everyone knows everyone.'));
  L.done();}},
{part:2,src:'Chapter 21 · Type 3 (Diversify)',pts:1,run(L){
  L.h(L.kick('pr','Put it in order')+'<h1 class="q">Plan the Diversify sale of Rafa’s work to Owen. Tap the steps in the order the book suggests.</h1>');
  L.order(L.card,['Brief Rafa on Corran and the overseas hiring idea','Ask Dana more and help define the problem','Take what Noor learned back to Rafa','Repeat until no good reason to wait remains','Hold the full meeting with Dana, Owen and Rafa'],
   'Internal sales first, then the client, then iterate. The full meeting comes last, once all five signs are in place.');}},
{part:2,src:'Chapter 21 · Type 3 (Diversify)',pts:1,run(L){
  L.h(L.kick('pr','Ready yet?')+'<h1 class="q">Noor has briefed Rafa twice and talked with Dana once. Dana still isn’t sure Owen sees a problem. Should Noor book the four-person meeting?</h1>');
  L.mc(L.card,['Yes: the meeting itself will reveal what Owen thinks','Not yet: there’s still a good reason to wait','Yes: two briefings is the usual number needed'],1,
   'The problem isn’t well understood yet. The book’s rule of thumb: meet when you can’t think of a good reason not to.',
   'There’s no set number of rounds, and the meeting isn’t the place to discover the problem. While the problem is unclear, there’s still a good reason to wait.');}},

/* ---------- PART 4: THE HIDDEN RELATIONSHIP ---------- */
{part:3,src:'Chapter 21 · A Final (Hidden) Relationship',run(L){
  L.h(L.kick('learn','The hidden relationship')+'<h1 class="q">Whatever happens, Noor and Dana’s relationship changes</h1>'+
   L.prose('A cross-sell asks the original client to believe a lot. Among the book’s list, Dana must believe:')+
   L.list([['check','Rafa really is an expert','and Noor knows enough to judge that.'],
     ['check','The issue is real','Noor knows Corran’s business well enough to say so.'],
     ['check','Noor cares about Dana too','not only about Larkmoor’s fees.'],
     ['check','The old relationship still holds','a new business ask doesn’t cancel the personal side.']],1)+
   L.prose('People in Noor’s position usually try to build credibility for the expert. But the book says the bigger issue is <b>Noor’s own</b> credibility, intimacy and self-orientation. Noor doesn’t need to become an immigration expert, just learn enough to say the issue is worth Dana’s time.'));
  L.done();}},
{part:3,src:'Chapter 21 · A Final (Hidden) Relationship',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Dana asks Noor: “Why should I talk to Rafa?” Which answer builds the most trust?</h1>');
  L.mc(L.card,['“Rafa’s brilliant. I’ve known Rafa for ten years.”','“I’ve looked at your sponsorship rules; they’re worth a specialist’s hour.”','“I can’t judge immigration, so I’ll leave all of that to Rafa.”'],1,
   'Noor shows they did the homework on Corran’s issue. That builds Noor’s own credibility, which is what Dana is really weighing.',
   'Vague praise for Rafa only draws trust down, and stepping back entirely leaves Dana with a stranger. Noor needs to know enough to say the issue is worth Dana’s time.');}},
{part:3,src:'Chapter 21 · Handling the Tricky Emotions in Cross-Selling',run(L){
  L.h(L.kick('learn','Handling the tricky emotions')+'<h1 class="q">Say the unspoken out loud</h1>'+
   L.prose('The firm’s relationship can help, but only once the personal relationships are built, or rebuilt, as if they were brand new. The key is to openly acknowledge what nobody is saying. That’s the skill of '+L.g('naming-and-claiming','naming and claiming')+'.')+
   L.lanes([['chat','Lines like these','“If I were you, I’d worry about bringing in someone new.”<br>“You know me from contracts, so you wouldn’t see me as an expert here.”<br>“I don’t take referrals blindly, so I don’t expect you to.”',2],
            ['list','A checklist','Raise what touches the '+L.g('trust-equation','trust equation')+': credibility, reliability, intimacy, and how self-oriented you might look.',3]])+
   L.note('Investing your own time <b>before</b> any selling is the strongest signal of all. It shows a shared agenda and that you’re not only thinking of yourself.','clock'));
  L.done();}},
{part:3,src:'Chapter 21 · Handling the Tricky Emotions in Cross-Selling',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Tap each piece until Noor names and claims the awkward issue with Dana.</h1>');
  L.sentence(L.card,[['This may feel awkward to hear,','You’ll love this news,'],['and it’s on me to raise it:','and Rafa asked me to say:','and you probably guessed it:'],['you may wonder if I’m just selling Rafa’s services.','some people might have small concerns.']],[0,0,0],
   [['Cheerful framing skips the difficulty. Naming and claiming starts by admitting the issue is awkward.'],['Hiding behind Rafa dodges responsibility. Noor has to claim it.','Putting it on Dana dodges responsibility for raising it.'],['A vague hint isn’t direct. State the worry plainly.']],
   'Acknowledge the difficulty, take responsibility for raising it, then state the issue directly. Dana’s unspoken worry is now on the table.');}},
{part:3,src:'Chapter 21 · A Final (Hidden) Relationship',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Deposit or withdrawal?',['Builds trust','Draws trust down'],[
   ['Noor tells Dana: “Rafa’s great, honestly. Trust me on this one.”',1,'A purely personal assurance spends Noor’s credibility instead of building it.'],
   ['Before raising anything with Dana, Noor spends an extra hour briefing Rafa.',0,'Investing time first wins the internal sale and shows Noor is serious.'],
   ['“All I need is the intro to Owen. We’ll take it from there.”',1,'It asks a favor and offers Dana nothing back.'],
   ['“I never take a referral blindly, so I don’t expect you to either.”',0,'Naming the unspoken doubt lowers the pressure on Dana.'],
   ['Noor reads up on visa sponsorship until Noor can explain why it’s worth an expert’s hour.',0,'Noor doesn’t need Rafa’s expertise, just enough to vouch that the issue is real.']]);}},
{part:3,src:'Chapter 21 · The Case of Cross-Selling',pts:1,run(L){
  L.h(L.kick('pr','Wrap-up')+'<h1 class="q">At a partners’ meeting, Ines says: “Corran trusts Larkmoor. Any of our partners can just walk in.” What should Noor say?</h1>');
  L.mc(L.card,['“True, as long as the partner mentions our six years at Corran.”','“Only if the partner brings a strong case study to the first meeting.”','“Corran trusts people, not the firm. Each new relationship starts fresh.”'],2,
   'Trust is personal and doesn’t transfer through the firm. Each new relationship needs to be built, with care, almost from scratch.',
   'Neither history nor a case study passes trust along. The book is clear: an institution can’t transmit trust. Each new relationship starts almost fresh.');}}
  ]
});
</script>
</body>
</html>
