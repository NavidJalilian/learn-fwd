<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">

<body>
<script src="../assets/course.js"></script>

<script>
Course.lesson({
  id:'0015', title:'Building trust on the current assignment', minutes:20, icon:'check',
  goals:['Make the client feel the value of your work, not just receive it','Use small, frequent gestures and kept promises to build trust while the work runs','Spot and avoid the five fastest ways to destroy trust on an assignment'],
  parts:['Felt value','Small tactics','During the work','Trust destroyers'],
  read:'Read chapter 19 of the book for the full lists of tactics and the five trust destroyers.',
  glossary:{
   'perceived-value':'Perceived value: how valuable the client feels your service is. It depends on how the work is experienced, not only on the quality of the result.',
   'honeymoon':'Honeymoon period: the short spell after you are hired when the client feels relief that someone competent is on the problem, before they start to wonder if the work is on track.',
   'barrier-busters':'Barrier busters: things built into your work, or into how it is introduced, that help win over the people in the client’s organization who may be a tough sell.'
  },
  cheatsheet:[
    'Nine things raise a client’s <b>perceived value</b>: understanding, control, progress, access, responsiveness, reliability, appreciation, importance, respect.',
    'Respect isn’t enough; the client must <b>experience</b> it. For example, ask their opinion regularly.',
    'Small gestures, used often: involve the client, make reports easy to pass on, help them use what you deliver, run better meetings, be reachable.',
    'Don’t vanish and return with a masterpiece. Keep them updated, share the hard parts, build their input in visibly.',
    'The honeymoon is short. Deliver a <b>small, fast result</b>, and make and keep many small promises.',
    'Expect the client’s mind to change as their situation changes. No surprises, no dazzling reveals.',
    'Missed a promise? Say so early, own it, never call the deadline unrealistic after the fact.',
    'Top five destroyers: leaking confidences, missing unhappiness, going around the client, never-in-doubt arrogance, blowing their deadline.'
  ],
  steps:[
/* ---------- PART 1: FELT VALUE ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Two builders redo your kitchen equally well. One texts you each Friday with progress and asks your view on the tiles. The other vanishes until the end. Who would you hire again?</h1>');
  L.mc(L.card,['The one who vanished and just got on with it','The one who kept you informed and asked you'],1,
   'Same result, different experience. This lesson is about how the way the work feels to the client builds trust while the work is still running.',
   'The finished kitchens are the same. But most people trust the builder who kept them informed and asked their view. How the work <i>feels</i> matters, and that’s this lesson.');}},
{part:0,src:'Chapter 19 · Building Trust on the Current Assignment',run(L){
  L.h(L.kick('learn','What clients value')+'<h1 class="q">Nine things raise how valuable your work feels</h1>'+
   L.prose('In an earlier book, David listed what raises a client’s '+L.g('perceived-value','perceived value')+' of a service. Done well, each one also builds the client’s trust in you.')+
   '<div style="display:flex;flex-wrap:wrap;gap:6px;margin:10px 0">'+['Understanding','Sense of control','Sense of progress','Access and availability','Responsiveness','Reliability','Appreciation','Sense of importance','Respect'].map(x=>'<span class="chip static ok">'+x+'</span>').join('')+'</div>'+
   L.note('The catch: it isn’t enough to <b>actually</b> respect the client. They must <b>experience</b> your respect. One simple way the book gives: ask for their opinion, regularly.','eye'));
  L.done();}},
{part:0,src:'Chapter 19 · Building Trust on the Current Assignment',run(L){
  L.h(L.kick('ex','The Brightwell review begins')+'<h1 class="q">Larkmoor won the Brightwell work. Three weeks in, Sasha is uneasy.</h1>');
  L.beats(L.card,[
   ['The job','Larkmoor is reviewing which of Brightwell’s therapists count as employees and which as self-employed. Noor leads; Ines does much of the contract reading.'],
   ['The work','The work is good. Noor and Ines have read every contract and spotted real problems in two clinics.'],
   ['The silence','Sasha hasn’t heard from them since the kickoff. Noor chose which clinics to start with without asking. Sasha emails: “Is anything happening?”'],
   ['Tomasz’s view','“Sasha can’t see the work, so for Sasha it doesn’t exist yet. No sense of progress, no sense of control.”'],
   ['The change','Noor sends a short Friday update, asks Sasha which clinics matter most next, and thanks Sasha’s team for gathering the files so fast.']],
   'Good work that the client can’t see or shape feels like less value, and builds less trust.');}},
{part:0,src:'Chapter 19 · Building Trust on the Current Assignment',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Noor genuinely respects Sasha’s judgment, but has never once asked for it. What does the book say is missing?</h1>');
  L.mc(L.card,['A formal statement of respect in the engagement letter','Sasha experiencing the respect, for example by being asked','Nothing, since real respect is what counts'],1,
   'Respect only builds trust if the client feels it. Asking for their opinion, regularly, is one way the book gives.',
   'The book says actual respect is not enough on its own. The client must experience it, and asking their opinion regularly is one simple way.');}},
{part:0,src:'Chapter 19 · Building Trust on the Current Assignment',pts:5,run(L){
  L.h(L.kick('pr','Which value is at stake?')+'<h1 class="q">Each moment on the Brightwell review raises or hurts one of the nine values. Which one?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Sense of progress','Sense of control','Access','Appreciation'],[
   ['A month in, Sasha has no idea how far through the contracts Larkmoor has got.',0,'Sasha can’t see movement. A short status note would fix it.'],
   ['Noor offers Sasha two ways to stage the review and lets Sasha choose.',1,'Choosing gives Sasha a say in how the work runs.'],
   ['Sasha calls twice; Noor’s assistant doesn’t know where Noor is or when they’ll be back.',2,'Sasha can’t reach anyone who knows. That hurts access and availability.'],
   ['Sasha’s team gathered 200 contracts in two days, and nobody at Larkmoor said thank you.',3,'Their effort went unnoticed. A simple thank-you shows appreciation.'],
   ['Ines tells Sasha what the team will check next week, and why.',1,'Knowing what’s coming, and why, gives the client a sense of control.']],
   'The same good work can feel valuable or not. These nine values are how clients judge it from the inside.');}},

/* ---------- PART 2: SMALL TACTICS ---------- */
{part:1,src:'Chapter 19 · Building Trust on the Current Assignment',run(L){
  L.h(L.kick('learn','Five kinds of small gesture')+'<h1 class="q">Tactics that make the client’s life easier</h1>'+
   L.list([['people','Involve the client','Brainstorm together, give them tasks, offer options and let them choose, tell them what happens next and why.'],
     ['pencil','Make reports easy to pass on','Ask how they want it laid out, add a summary they can use inside their firm without changes, have an outsider check it reads well.'],
     ['compass','Help them use what you deliver','Coach them on dealing with colleagues, share your reasoning, advise on how to present results internally.'],
     ['cal','Make meetings worth it','Agree the agenda and goals first, send papers ahead, research who’s coming, set next steps for both sides, send a summary fast.'],
     ['pointer','Be reachable','Warn ahead when you’ll be away, make sure your assistant knows the clients, get clients comfortable with your juniors.']],2)+
   '<p class="small" style="margin-top:10px">The book admits these are small gestures and not all fit every case. Used often, they show you’re trying to meet the client’s needs on both content and process.</p>');
  L.done();}},
{part:1,src:'Chapter 19 · Building Trust on the Current Assignment',run(L){
  L.h(L.kick('ex','The first findings report')+'<h1 class="q">Noor’s 30-page memo, and what happened to it</h1>');
  L.beats(L.card,[
   ['Draft one','Noor writes a careful 30-page memo on the first four clinics. It is accurate and full of legal terms.'],
   ['Tomasz asks','“What will Sasha do with this?” Sasha has to explain it to the clinic managers, some of whom will be upset.'],
   ['Ask first','Noor asks Sasha how the findings should look. Sasha wants one page per clinic and a single summary for the managers.'],
   ['Test it','Larkmoor’s office manager, who knows nothing about the case, reads the summary. Two paragraphs confuse them, so Noor rewrites them.'],
   ['Help use it','Noor talks Sasha through which managers will push back and how to open the conversation with them.']],
   'The memo wasn’t wrong. It just wasn’t built for the client to <i>use</i>. A report the client can pass on unchanged is worth more.');}},
{part:1,src:'Chapter 19 · Building Trust on the Current Assignment',pts:1,
 solve:async L=>{const c=L.$('#mv').children;c[0].click();c[1].click();},
 run(L){
  const V=[['Noor’s old way',['Papers handed out at the start','40 minutes of Noor presenting slides','5 rushed minutes of questions','Ends with “we’ll be in touch”','Nothing in writing afterwards'],'var(--no)',10],
           ['The book’s way',['Agenda and goals agreed the week before','Papers sent two days ahead; attendees researched','45 minutes of real discussion','Next steps agreed for both sides','Summary sent next morning; a call to check goals were met'],'var(--ok-strong)',80]];
  const seen=new Set();
  L.h(L.kick('pr','Toggle and compare')+'<h1 class="q">Noor meets Sasha and three clinic managers to discuss the findings. Try both versions of the meeting.</h1><div id="mv"></div>'+
   '<div style="background:var(--soft);border-radius:16px;padding:14px;margin:8px 0 6px;min-height:150px"><div class="small" id="mc" style="margin-bottom:8px">Choose a version above.</div><div id="ml"></div>'+
   '<div class="meterrow" style="margin-top:10px"><div class="lb">Meeting time spent discussing</div><div class="meter"><div id="mm" style="width:0"></div></div></div></div><div id="mq"></div>');
  V.forEach((v,j)=>{const b=document.createElement('button');b.className='chip';b.innerHTML=L.ic(j?'check':'clock')+v[0];
    b.onclick=()=>{[...L.$('#mv').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(j);
      L.$('#mc').innerHTML='<b>'+v[0]+'</b>';
      L.$('#ml').innerHTML=v[1].map(x=>'<div class="small" style="margin:4px 0">'+L.ic(j?'check':'x')+' '+x+'</div>').join('');
      const m=L.$('#mm');m.style.background=v[2];m.style.width=v[3]+'%';
      if(seen.size===2&&!L.$('#mq').innerHTML){const q=L.$('#mq');q.innerHTML='<h2 class="sub">Which change freed the meeting for discussion?</h2>';
        L.mc(q,['Researching the attendees in advance','Sending the papers ahead of time','Sending a summary the next morning'],1,
         'With the papers read beforehand, the meeting is for talking, not presenting. The book says exactly that.',
         'That helps too, but it doesn’t free meeting time. Sending papers in advance is what saves the meeting for discussion instead of presentation.');}};
    L.$('#mv').appendChild(b);});}},
{part:1,src:'Chapter 19 · Building Trust on the Current Assignment',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Sasha must present Larkmoor’s findings to Brightwell’s board next week. Which gesture helps Sasha most?</h1>');
  L.mc(L.card,['A summary Sasha can use internally without changes','A full copy of every contract Larkmoor reviewed','A list of the legal cases behind each finding'],0,
   'A summary the client can pass on unchanged makes your work easy to use, and makes the client look good inside their firm.',
   'Detail has its place, but Sasha needs something to hand the board as it is. The book suggests a summary the client can use internally without changes.');}},
{part:1,src:'Chapter 19 · Building Trust on the Current Assignment',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which kind of gesture is this?',['Involve the client','Easy-to-pass-on report','Help them use it','Better meeting','Be reachable'],[
   ['Noor asks Sasha’s team to list the therapists they think are borderline cases.',0,'Giving the client a task makes them part of the work, not an audience.'],
   ['Before a two-day trial, Noor tells Sasha and names Ines as the contact who knows the file.',4,'Warning ahead and getting the client comfortable with a junior keeps you reachable.'],
   ['Noor advises Sasha on which clinic manager to tell first, and how.',2,'Advice on the politics of sharing results helps the client use what you deliver.'],
   ['Ines checks who is coming to Thursday’s meeting and reads up on each of them.',3,'Researching attendees in advance is one of the book’s meeting tactics.'],
   ['Noor asks Sasha whether the board prefers tables or a short written note.',1,'Letting the client set the format makes the report easier to pass on.']]);}},

/* ---------- PART 3: DURING THE WORK ---------- */
{part:2,src:'Chapter 19 · Building Trust During the Engagement Process',run(L){
  L.h(L.kick('learn','Don’t vanish')+'<h1 class="q">Serving a client isn’t going away and coming back with a masterpiece</h1>'+
   L.lanes([['x','Not this','Disappear, do the work, return with a polished product, and wait for praise.',3],
            ['check','This','Keep them up to date, ask questions that show the work is real, and build their input <b>visibly</b> into what you deliver.',2]])+
   L.prose('Building trust also doesn’t mean pretending it’s all easy. Tell the client about the thorniest parts of the job. Not to complain, but to ask: <i>was this your impression too?</i>')+
   L.prose('And if your conclusions will surprise them, don’t save them for a dramatic reveal. A client who feels ambushed, especially in front of others, is angry even when the news is good.'));
  L.done();}},
{part:2,src:'Chapter 19 · Building Trust During the Engagement Process',run(L){
  L.h(L.kick('ex','Habits on the Brightwell review')+'<h1 class="q">Tap each card to see a habit from the book in action</h1>');
  L.flips(L.card,[
   ['See the bigger picture','Noor tells Sasha, once, how the review connects to Brightwell’s plan to open more clinics. Framing, credibility and a glimpse of what could be.'],
   ['Check in as a person','Noor pauses the work to ask what else Sasha is worried about this quarter. Stopping the urgent work for the person builds intimacy.'],
   ['Find the tough sells','Noor asks who at Brightwell will resist the findings, and builds '+L.g('barrier-busters','barrier busters')+' into the rollout. A “we, not me” approach.'],
   ['Learn the names','Ines learns the names of Brightwell’s office staff early. It shows care, and makes Larkmoor at home in the client’s world.'],
   ['Reread your notes','Noor finds an issue Sasha raised in week one, a manager’s pay complaint, and goes back to it. It shows Noor listened.'],
   ['When in doubt, share','Noor sends Sasha an article on a related tribunal ruling and lets Sasha judge if it matters. More communication, not less.']],
   'None of these is big. Together they keep the client inside the work and show you’re still listening.');}},
{part:2,src:'Chapter 19 · Building Trust During the Engagement Process',run(L){
  L.h(L.kick('learn','The honeymoon is short')+'<h1 class="q">Relief turns into doubt, fast</h1>'+
   L.flow([['star','Relief','Someone competent is on it.','the '+L.g('honeymoon','honeymoon'),2],['alert','Doubt','Are they giving it time? Will this work?','comes quickly',3],['check','Proof','A small, fast result shows the effort.','make it happen',1]])+
   L.prose('Trust rests on respect, and respect comes from seeing performance. So find a <b>small, fast result</b>. If the work can’t give one, even a brief status update shows you’re making real efforts.')+
   L.prose('Also make <b>many small promises, and keep them</b>: “I’ll call you at noon,” “I’ll send that article.” '+L.g('reliability','Reliability')+' grows from repeated experiences, not from time passing.')+
   L.note('And expect the client’s mind to change. Their situation will move during the work, so the goal set at the start may be wrong by the end.','cycle'));
  L.done();}},
{part:2,src:'Chapter 19 · Building Trust During the Engagement Process',pts:1,
 solve:async L=>{L.$('#pp').children[1].click();L.$('#go').click();},
 run(L){
  let p=null;const N=['Big reveal at week 8','Small wins every week'];
  const A=[85,72,60,50,42,36,32,40],B=[85,80,82,84,86,88,90,92];
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">Two ways to run the 8-week review. Both end with the same final report. Which keeps Sasha’s confidence higher by week 8?</h1><div id="pp"></div>'+
   '<div id="sim" hidden><div style="display:flex;align-items:center;justify-content:space-between;margin-top:6px"><div><div class="small">Simulated time</div><div class="week" id="wk">Week 0</div></div><button class="btn pri" id="go">'+L.ic('play')+'Run 8 weeks</button></div>'+
   N.map((n,j)=>'<div class="meterrow"><div class="lb">'+n+'</div><div class="meter"><div id="s'+j+'" style="width:0;background:'+(j?'var(--ok-strong)':'var(--h3)')+'"></div></div></div>').join('')+'<div class="small" id="ev" style="margin-top:8px"></div></div>');
  N.forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=n;b.onclick=()=>{if(p!==null)return;p=j;b.classList.add('sel');L.$('#sim').hidden=false;};L.$('#pp').appendChild(b);});
  const EV=['Kickoff: Sasha is relieved.','Week 1: Plan B sends two clinic findings; Plan A goes quiet.','Week 2: Plan B keeps a promised noon call.','Week 3: Plan A, silence. Sasha wonders if anyone is working.','Week 4: Plan B shares the hardest problem and asks Sasha’s view.','Week 5: Plan A, still nothing to see.','Week 6: Plan B sends a status note before Sasha asks.','Week 7: Plan A’s doubts harden.','Week 8: same final report for both. Plan A’s surprises land badly.'];
  L.$('#go').onclick=function(){this.remove();let w=0;L.$('#ev').textContent=EV[0];
    const t=setInterval(()=>{w++;const wk=L.$('#wk');if(!wk){clearInterval(t);return;}wk.textContent='Week '+w;
      [A,B].forEach((s,j)=>{const el=L.$('#s'+j);if(el)el.style.width=s[w-1]+'%';});const ev=L.$('#ev');if(ev)ev.textContent=EV[w];
      if(w>=8){clearInterval(t);L.award(p===1);
        L.sheet(p===1?'ok':'no',p===1?'You called it':'Small wins kept trust higher','The honeymoon fades fast. Plan B fed Sasha a steady flow of small results and kept promises, so confidence rose. Plan A asked Sasha to wait in silence, then surprised them. Same report, very different trust.');L.done();}},280);};}},
{part:2,src:'Chapter 19 · Building Trust During the Engagement Process',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Halfway through, Brightwell decides to move some self-employed therapists onto employment contracts. The review’s original goal no longer fits. What does the book say?</h1>');
  L.mc(L.card,['Hold Brightwell to the scope everyone agreed at the start','Expect it: as the situation changes, the goal can change','Treat it as a sign Brightwell doesn’t trust Larkmoor'],1,
   'The book says to expect the client’s mind to change. A goal right at the start can be wrong by the end. Not expecting it leads to conflict.',
   'The book warns that if you don’t expect clients to change their minds, you’ll end up in conflict. Changing goals are normal as the client’s situation moves.');}},
{part:2,src:'Chapter 19 · Building Trust During the Engagement Process',pts:6,run(L){
  L.h(L.kick('pr','Builds or erodes?')+'<h1 class="q">Six moments from the Brightwell review. Does each build trust or erode it?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Builds trust','Erodes trust'],[
   ['To impress Sasha, Ines promises the full draft “by tomorrow”, knowing it will take three days.',1,'Promising more than you can deliver to make a good impression is exactly the trap. Clients remember broken promises.'],
   ['Noor emails “I’ll call you at noon” and calls at noon.',0,'A small promise, kept. Reliability grows from many experiences like this.'],
   ['Noor saves a surprising finding to unveil at Brightwell’s board meeting.',1,'No dazzling reveals. A client surprised in a semipublic meeting is angry, even if the news is good.'],
   ['Noor tells Sasha the patchy pay records are the hardest part, and asks if Sasha saw it that way too.',0,'Sharing the thorny parts, not to complain but to check, builds trust.'],
   ['Noor drafts a free follow-on plan for what Brightwell should do after the review.',0,'The book suggests this, even if you won’t do the follow-on work. Clients often call you for it.'],
   ['In week two, Noor asks Sasha about the next piece of work Larkmoor could do.',1,'Too soon. The book says eager is fine, aggressive is not.']],
   'Small, frequent, honest actions build trust. Overpromising, surprising and pushing erode it.');}},
{part:2,src:'Chapter 19 · Building Trust During the Engagement Process',pts:1,run(L){
  L.h(L.kick('pr','What should Noor do?')+'<h1 class="q">Brightwell sent its pay records late, so the report will miss the date Larkmoor promised. Ines suggests telling Sasha the original date “was always a bit unrealistic”. What fits the book?</h1>');
  L.mc(L.card,['Agree, since the date really was tight from the start','Say nothing and send it as soon as it’s ready','Tell Sasha now, own the miss, and give a firm new date'],2,
   'The book is clear: suggesting the deadline was unrealistic wrecks your credibility, and “it wasn’t our fault” sounds like dodging. Warn early and take responsibility.',
   'Calling the deadline unrealistic after the fact destroys credibility, and silence means a late, unwarned delivery. Tell Sasha early and take responsibility.');}},

/* ---------- PART 4: TRUST DESTROYERS ---------- */
{part:3,src:'Chapter 19 · Building Trust During the Engagement Process',run(L){
  L.h(L.kick('learn','The top five trust destroyers')+'<h1 class="q">What wrecks trust on an assignment fastest</h1>'+
   L.list([['lock','Breaking a confidence','Passing on secrets to look “in the know”. People forgive not knowing; they don’t forgive misused information.'],
     ['eye','Missing the client’s unease','Not sensing that the client has doubts or is unhappy about some part of your work.'],
     ['arrow','Going around the client','Going behind their back to get something done, even something important. People always find out.'],
     ['alert','Never in doubt','Acting as if you’re sometimes wrong but never unsure. It alienates the wider client organization fast.'],
     ['clock','Blowing their deadline','Even an arbitrary deadline is theirs. Ask for more time or argue it, and if you’ll still be late, warn them first.']],3)+
   L.quote('Eager is good. Aggressive is not.','Maister, Green and Galford, chapter 19, on asking for more work'));
  L.done();}},
{part:3,src:'Chapter 19 · Building Trust During the Engagement Process',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">Charlie and Rob lose a client over a format</h1>');
  L.beats(L.card,[
   ['The job','Years ago, Charlie and Rob did a small, tight-deadline job for a major investment bank, at a very busy time for everyone.'],
   ['The concern','The key client was unhappy, not with the content, but with the format of the final product.'],
   ['The response','Charlie and Rob pointed out the content was right, and tried to make light of it being “only” the format.'],
   ['The verdict','The client decided that if the format wasn’t acceptable, neither was the content. The relationship went no further.'],
   ['The lesson','They told themselves afterwards the client was impatient and imperious. But they had missed, and brushed off, the client’s unease.']],
   'If the client is uneasy about any part of your work, that part matters, however small it looks to you.');}},
{part:3,src:'Chapter 19 · Building Trust During the Engagement Process',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Sasha says the clinic summaries are “fine on substance, but our managers won’t read this layout.” What should Noor do?</h1>');
  L.mc(L.card,['Reassure Sasha that the legal content is what matters','Explain why the layout follows legal best practice','Ask what layout would work, and redo it quickly'],2,
   'This is Charlie and Rob’s story. Take the format concern as seriously as the content, because the client does.',
   'Brushing off a “mere” format concern is how Charlie and Rob lost their client. Take it seriously and fix it.');}},
{part:3,src:'Chapter 19 · Building Trust During the Engagement Process',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Name the trust destroyer',['Breaking a confidence','Missing their unease','Going around them','Never in doubt','Blowing their deadline'],[
   ['To show how close Larkmoor is to Corran, Ines tells Sasha what Dana said privately about Felix.',0,'Misusing information to look “in the know” is the one people don’t forgive.'],
   ['Sasha won’t approve a letter, so Noor sends it straight to the clinic managers anyway.',2,'Even for a good reason, going around the client is never worth it. They find out.'],
   ['Ines tells a room of clinic managers that their contracts are “obviously unlawful”, and won’t hear otherwise.',3,'Sometimes wrong, never in doubt. It turns the wider organization against you.'],
   ['Dana’s replies get shorter each week. Noor assumes Dana is just busy.',1,'Short replies can signal doubt or unhappiness. Noticing that, and asking, is the job.'],
   ['Brightwell wanted the summary before Monday’s board. Noor sends it Tuesday, with no warning.',4,'It’s their deadline. An angry but forewarned client is far easier than an angry, surprised one.']]);}},
{part:3,src:'Chapter 19 · Building Trust During the Engagement Process',pts:1,run(L){
  L.h(L.kick('pr','Build the message')+'<h1 class="q">The board summary will be two days late. Tap each piece until this is the message the book would have Noor send.</h1>');
  L.sentence(L.card,[['Tell Sasha today','Tell Sasha on the due date','Tell Sasha once it’s sent'],['that the deadline was ambitious,','that the summary will be two days late,'],['take responsibility for it,','explain it wasn’t our fault,'],['and hope Sasha understands.','and offer a firm new date.']],[0,1,0,1],
   [['Waiting until the due date gives Sasha no time to adjust plans for the board.','After the fact is the worst case: angry and not forewarned.'],['Calling the deadline ambitious suggests it was unrealistic. That destroys credibility.'],['“Not our fault” sounds like dodging responsibility, even if it’s partly true.'],['Hoping isn’t a plan. Give Sasha something reliable to work with.']],
