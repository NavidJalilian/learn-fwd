<title>Envisioning and Commitment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">

</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0011', title:'Envisioning and commitment', minutes:20, icon:'star',
  goals:['Picture success with a client before jumping to a solution','Turn “yes, we should” into real, joint commitment','Set expectations up front and unblock a client who stalls'],
  parts:['Envision','Hold the bell','Commit','Make it stick'],
  read:'Read chapters 13 and 14 of the book for Mark’s full conversation with his CEO client and the complete list for managing expectations.',
  glossary:{
   'action-language':'Action language: words that jump to doing, such as “why don’t we…?” or “what can we do?”. Envisioning swaps them for descriptive words such as “how would things be if…?”.',
   'managing-expectations':'Managing expectations: agreeing up front what you and the client will and won’t do, how you’ll work together and how success will be judged.',
   'joint-commitment':'Joint commitment: a commitment that is two-sided and personal, where the advisor adds something only they could add, not just a share of the to-do list.'
  },
  cheatsheet:[
    '<b>Envision</b> before solving: what are we really aiming for, what will it look like once we’re there, how will we know we’ve arrived?',
    'Envisioning is the most neglected stage. It isn’t strictly needed, but it often adds the most value.',
    'Swap “why don’t we…?” for “how would things be if…?”. Talk about benefits, end states and outcomes.',
    'When the client asks “what can we do?”, resist the bell: “We’ll get there. First, where do we want to go?”',
    '<b>Commitment</b> is not closing the sale. It is the client understanding what it will take and being willing to do it.',
    'Test resolve: what gets in the way, who needs to know, who does what, when we check in. Be frank about risks up front.',
    '<b>Manage expectations</b>: what we will and won’t do, what the client will and won’t do, boundaries, reports, milestones, how success is measured.',
    'Stalled commitment? Back up a step or two. If it’s fear, name it; if it’s complacency, raise the tension. Make it joint and personal.'
  ],
  steps:[
/* ---------- PART 1: ENVISION ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">You hire a builder to redo your kitchen. Before talking tiles or taps, they ask: “A year from now, how do you want to be using this room?” Is that a waste of your time?</h1>');
  L.mc(L.card,['No, it shapes every choice that follows','Yes, they should just quote for the job'],0,
   'A clear picture of the end result tells you both what “done well” means. This lesson is about doing the same with clients.',
   'Without a picture of the end result, the builder may do a perfect job on the wrong kitchen. Picturing success first is what this lesson is about.');}},
{part:0,src:'Chapter 13 · Envisioning an Alternate Reality',run(L){
  L.h(L.kick('learn','The fourth stage')+'<h1 class="q">Before solving, picture where you’re going</h1>'+
   L.prose(L.g('envisioning','Envisioning')+' comes after engaging, listening and framing. The problem is now clear. Advisor and client then imagine <b>together</b> what the end result could look like, around three questions:')+
   L.list([['target','What are we really aiming for?','Out of all the futures the client could aim at, pick the one that matters.'],
     ['eye','What will it look like once we’re there?','Describe it in concrete detail, as if it already happened.'],
     ['check','How will we know we’ve arrived?','Agree on the signs of success.']],2)+
   L.prose('The book calls envisioning the stage <b>most often skipped</b>. Many sales methods go straight from the problem to the solution. Talking about benefits comes close, but it isn’t the same thing.'));
  L.done();}},
{part:0,src:'Chapter 13 · Envisioning an Alternate Reality',run(L){
  L.h(L.kick('learn','Why it works')+'<h1 class="q">A shared picture turns a scary problem into a goal worth chasing</h1>'+
   L.prose('Most problem solving feels technical and high-risk. Envisioning moves people into a freer, more creative frame of mind. The book says it isn’t strictly necessary, but it can often add the most value of any stage.')+
   L.note('A consulting firm, United Research, built its sales process around this. It asked large numbers of client staff: could things be different here, and better? How? What would have to change? As people described that better world in detail, change stopped feeling abstract and scary.','book')+
   L.flow([['alert','The problem','abstract and scary','',3],['eye','The picture','described in detail','',2],['star','The result','“Let’s go for it” and “We can do this”','',1]])+
   L.prose('The same thing can happen between two people. Focusing on a future you both like, free of today’s problems, breaks down barriers.'));
  L.done();}},
{part:0,src:'Chapter 13 · Envisioning an Alternate Reality',run(L){
  L.h(L.kick('learn','Let grammar guide you')+'<h1 class="q">Envisioning has its own way of speaking</h1>'+
   L.lanes([['play','Action language','“Why don’t we…?”<br>“What can we do?”<br>“Let’s draft the letters.”',3],
            ['eye','Envisioning language','“How would things be if…?”<br>“What would staff be saying?”<br>“What would tell us it worked?”',2]])+
   L.prose('The book’s tip: at this stage, use <b>descriptive</b> sentences. Ask about benefits, end states and outcomes, not about steps. Steps come next, in commitment.'));
  L.done();}},
{part:0,src:'Chapter 13 · Envisioning an Alternate Reality',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Noor and Dana have framed the site closures. Which line from Noor is envisioning?</h1>');
  L.mc(L.card,['“Why don’t we start the 30-day consultation on Monday?”','“Let’s split the letters between your team and ours.”','“If this went well, what would staff say about Corran?”'],2,
   'It describes an end state and invites Dana to picture it. That’s the language of possibility.',
   'Starting the consultation and splitting the letters are both action steps. Envisioning describes where you want to end up before you pick steps.');}},
{part:0,src:'Chapter 13 · Envisioning an Alternate Reality',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Action or envisioning?',['Action language','Envisioning language'],[
   ['“Why don’t we brief Gail before the staff meeting?”',0,'“Why don’t we…” jumps straight to a step.'],
   ['“How would things be if Gail backed the plan in public?”',1,'It pictures an end state, the book’s grammar for this stage.'],
   ['“A year from now, what would tell you this went well?”',1,'It asks how you’ll know you got there.'],
   ['“I’ll send a timeline for the letters by Friday.”',0,'A useful promise, but it’s about doing, not picturing.'],
   ['“What would the town be saying about Corran by summer?”',1,'It describes a future outcome, not a task.']]);}},

/* ---------- PART 2: HOLD THE BELL ---------- */
{part:1,src:'Chapter 13 · An Illustration',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">Mark, a frustrated consultant, learns to envision with his client</h1>');
  L.beats(L.card,[
   ['The deal','Mark, already busy, takes on a risky project for a client’s CEO, Albert. Albert promises personal interest and access when needed.'],
   ['It slides','Mark’s main contact has personal troubles and hands him to a well-meaning but ineffective executive. Albert gets less available. The pressure for results doesn’t drop.'],
   ['First framing','Mark’s view: the client is being unfair and isn’t keeping his side of the bargain. Natural, says the book, but all about Mark, full of guesses about motives, and judging.'],
   ['Reframed','Working with Charlie, Mark tries the client’s side: things got busy, Albert can’t give the time he hoped, and Mark may deliver less than promised. Neither is happy.'],
   ['Envisioning','Mark asks Albert to pause before either of them commits to more. What are they trying to achieve, and how will they know they got it right?'],
   ['The picture','Together they describe a better way of working: raising issues early, not taking delays personally, trusting each other. Mark gets the cooperation he needed.']],
   'Mark didn’t win by arguing the facts. He won by getting Albert to picture the benefits of a better future.');}},
{part:1,src:'Chapter 13 · An Illustration',pts:1,run(L){
  L.h(L.kick('pr','Put it in order')+'<h1 class="q">Noor is annoyed: Dana keeps changing what Dana wants in the closure letters. Put Noor’s thinking in the order Mark’s story suggests, from first reaction to the conversation with Dana.</h1>');
  L.order(L.card,['“Dana keeps moving the goalposts on me.”','“I’m frustrated because the changes risk the deadline.”','“Felix and Gail keep pushing Dana, and we’re both stuck.”','“Can we agree what a good result looks like first?”'],
   'From blaming, to self-focus, to seeing both sides, and only then envisioning together. That’s Mark’s path.',['First reaction','Less blame','Both sides','Talk to Dana']);}},
{part:1,src:'Chapter 13 · Summary',run(L){
  L.h(L.kick('learn','Resist the bell')+'<h1 class="q">“So what can we do?” is the moment most advisors skip ahead</h1>'+
   L.prose('Once the problem is defined, the client often asks what to do about it. For many advisors those words ring like a bell: our image of ourselves as technical experts is on the line, so we answer at once.')+
   L.quote('What are we trying to accomplish? How will we know when we’ve got it right?','Mark to Albert, chapter 13')+
   L.prose('The better reply is: we’ll get there, but first let’s talk about where we want to go. After that talk, both sides know what’s at stake, have signed up for the benefits, and have sketched what a solution must do. <b>Then</b> you’re ready to talk about what to do.'));
  L.done();}},
{part:1,src:'Chapter 13 · Summary',pts:1,
 solve:async L=>{L.$('#r0').click();L.$('#r1').click();},
 run(L){
  const seen=new Set();
  const R=[['x','Dana takes notes and says: “Fine, send me the plan.” Two weeks later, Dana and Gail are arguing about who goes first, and Felix asks what the plan is <i>for</i>.'],
           ['check','Dana talks for ten minutes: a fair process, Gail onside, no ugly headlines in town, Felix trusting Dana’s judgment. Noor writes it down. Now any plan can be checked against it.']];
  L.h(L.kick('pr','Toggle and compare')+'<h1 class="q">Dana asks: “Right, so what do we do?” Try each reply from Noor and see where it leads.</h1>'+
   '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="chip" id="r0">'+L.ic('play')+'“Here’s the plan…”</button><button class="chip" id="r1">'+L.ic('eye')+'“First, what does good look like?”</button></div>'+
   '<div style="background:var(--soft);border-radius:16px;padding:14px;margin:10px 0;min-height:70px" id="out"><span class="small">Pick a reply above.</span></div><div id="bq"></div>');
  [0,1].forEach(j=>{L.$('#r'+j).onclick=()=>{[0,1].forEach(x=>L.$('#r'+x).classList.toggle('sel',x===j));seen.add(j);
    L.$('#out').innerHTML='<div style="display:flex;gap:8px;align-items:flex-start">'+L.ic(R[j][0])+'<div>'+R[j][1]+'</div></div>';
    if(seen.size===2&&!L.$('#bq').innerHTML){const q=L.$('#bq');q.innerHTML='<h2 class="sub">What did the second reply give Noor and Dana?</h2>';
      L.mc(q,['A quicker route to signing the work off','A shared target that any plan can be tested on'],1,
       'Both now know what’s at stake and what a solution must achieve. That primes the talk about what to do.',
       'It actually took longer. What it bought was a shared picture of success, so later choices have something to be measured against.');}};});}},
{part:1,src:'Chapter 13 · Summary',pts:1,run(L){
  L.h(L.kick('pr','Your call')+'<h1 class="q">In a short meeting, Felix cuts in: “Skip the theory. What’s the plan for the closures?” What should Noor do?</h1>');
  L.mc(L.card,['Give Felix the full plan now, since Felix is CEO','Say a plan is coming and move the topic on','Agree, then ask what a good outcome means to Felix'],2,
   'Noor respects Felix’s pace but still holds the bell: one quick question about the destination makes the plan Felix’s, not just Noor’s.',
   'Jumping to the plan answers the bell. Changing the subject ignores Felix. A short “we’ll get there, but what does success look like for you?” keeps both pace and purpose.');}},

/* ---------- PART 3: COMMIT ---------- */
{part:2,src:'Chapter 14 · Commitment',run(L){
  L.h(L.kick('learn','What commitment means')+'<h1 class="q">Commitment is not closing the sale</h1>'+
   L.prose('In this book, '+L.g('commitment','commitment')+' is not signing a contract. It is the last stage of trust building: the client understands what it will take to solve the problem and is willing to do it.')+
   L.lanes([['check','Doing','A promise to do something later.',4],['flame','Being','Feeling bound to it, and moved to act.',2]])+
   L.prose('Dictionaries give both meanings. The book means the second: personal and emotional. Without it, advice is just an opinion. The advisor says “you should do this”, the client says “yes, thanks!”, and nothing happens.'));
  L.done();}},
{part:2,src:'Chapter 14 · Commitment',run(L){
  L.h(L.kick('learn','Test the resolve')+'<h1 class="q">Walk the client through what it will really take</h1>'+
   L.prose('With the problem framed and the vision clear, the book suggests a series of conversations:')+
   L.list([['alert','What will get in the way?','And what will we do about it?'],
     ['people','Who needs to know, and who does what?','Bring the right people into the loop.'],
     ['cal','What do we need, and by when?','Information, check-ins, key deadlines.']],1)+
   L.prose('This isn’t just your work plan. The client must see the messy details, the hard parts and any <b>new behavior</b> asked of them. You might even play devil’s advocate and argue <i>against</i> doing it.')+
   L.note('Hiding risks backfires. If a problem you could have foreseen shows up later, the client may feel you weren’t open with them. And if the client won’t act, your advice fails, even if all your work was right.','shield'));
  L.done();}},
{part:2,src:'Chapter 14 · Commitment',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">Noor tests Dana’s resolve on the closures</h1>');
  L.beats(L.card,[
   ['In the way','Noor: “What could stop this?” Dana: “Gail. And the clock: letters by the 14th.” They plan a private meeting with Gail before staff hear anything.'],
   ['In the loop','Felix must sign off on the selection rules. Noor asks who else must hear early. Dana adds the payroll lead.'],
   ['New behavior','Noor is frank: “This plan needs you to tell Gail face to face, not by email. That will be uncomfortable.”'],
   ['Devil’s advocate','“Let me argue against it. You could just let managers pick, as first planned. It’s quicker. Why not?” Dana answers with the vision they built: fairness, the town, Felix’s trust.'],
   ['Who, what, when','They agree: Dana meets Gail Tuesday; Noor drafts the consultation plan by Thursday; both check in Friday.']],
   'Dana didn’t just agree. Dana argued for the plan, knowing what it will cost. That’s commitment.');}},
{part:2,src:'Chapter 14 · Commitment',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Ines tells Dana: “Don’t worry about a thing. It’s no problem, leave it all to us!” How might Dana hear it?</h1>');
  L.mc(L.card,['As arrogance, or as if something is hidden','As calm confidence that builds trust'],0,
   'The book warns that this “no problem” air is meant to sound confident but often reads as arrogance or secrecy. Being open about risks builds more trust.',
   'That’s the intent, but the book says it often lands as arrogance or secrecy: “what are they hiding?” Candor about the hard parts builds more trust.');}},
{part:2,src:'Chapter 14 · Commitment',run(L){
  L.h(L.kick('learn','Why and how much clients commit')+'<h1 class="q">Pain drives most commitment, and clients rarely commit to everything</h1>'+
   L.lanes([['flame','Pain or energy','The client feels strongly about a problem. The book guesses this drives about 80% of commitment.',3],
            ['star','Inspiration','The client is captivated by something new and appealing. Less common.',2]])+
   L.prose('So ask yourself: am I offering pain relief or inspiration, and how?')+
   L.prose('Clients also tend to commit to <b>a little less</b> than they could. That’s self-protection: they want room to move when the unexpected happens. Rather than feel let down, be glad they’ve chosen to start down the path with you.'));
  L.done();}},
{part:2,src:'Chapter 14 · Commitment',pts:4,run(L){
  L.h(L.kick('pr','Real or not?')+'<h1 class="q">Sort what each Corran person says: real commitment, or just agreement?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Real commitment','Just agreement'],[
   ['Dana: “You’re right, we must do this. Maybe after the busy season.”',1,'Agreement in principle with no time, owner or resources. The book says this is very common.'],
   ['Dana: “I’ll tell Gail myself on Tuesday, even though I dread it.”',0,'Dana knows the hard part and takes it on, with a date.'],
   ['Felix: “Sounds sensible. Send it over and we’ll see.”',1,'Polite, but no sign Felix grasps what it will take.'],
   ['Dana: “We’ll do the two shops now and the site in spring.”',0,'Less than everything, but a real start. The book says to welcome that.']],
   'Commitment means owning the hard parts. Doing less than all of it is normal; doing none of it is just agreement.');}},

/* ---------- PART 4: MAKE IT STICK ---------- */
{part:3,src:'Chapter 14 · Managing Expectations',run(L){
  L.h(L.kick('learn','Managing expectations')+'<h1 class="q">Agree up front what will and won’t happen</h1>'+
   L.prose(L.g('managing-expectations','Managing expectations')+' is central to commitment. Done well, it shows you know this kind of problem and can see the pitfalls coming. The book’s list boils down to:')+
   L.list([['Who does what','What we will and won’t do, and what the client will and won’t do.'],
     ['Boundaries','The limits of our analysis, and any areas or people the client wants us to stay away from.'],
     ['Ways of working','Working arrangements, how and how often we talk, who gets which reports, how often, and how they’ll be used.'],
     ['Progress and success','Milestones and reviews, and how success is measured during and at the end.']],2)+
   L.prose('These look like small details. They aren’t: they show the client you’re serving them the way they want, and they show exactly what the client is signing up for.'));
  L.done();}},
{part:3,src:'Chapter 14 · Managing Expectations',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which expectation, set up front, would have prevented this?',['What we will and won’t do','Areas or people to avoid','Who gets which reports','How success is measured'],[
   ['Corran’s bill runs over the estimate because Ines added research Dana never asked for.',0,'Agreeing what Larkmoor will and won’t do sets the scope, so extra work gets discussed first.'],
   ['Noor phones a shop manager directly, and Dana is upset: that manager wasn’t to hear yet.',1,'Asking early who not to speak with avoids stepping on hidden politics.'],
   ['Felix learns about a delay from the board, not from Dana, because only Dana got the update.',2,'Deciding who receives which reports keeps the right people informed.'],
   ['At the end, Noor thinks it went well. Dana thinks it failed: two staff complained publicly.',3,'Agreeing how success is judged means nobody grades the work against a different test.']]);}},
{part:3,src:'Chapter 14 · Managing Expectations',pts:1,run(L){
  L.h(L.kick('pr','Your call')+'<h1 class="q">Brightwell asks if Larkmoor can rewrite every clinic contract in two weeks. Noor knows it would take six. What does the book advise?</h1>');
  L.mc(L.card,['Say yes to win the work, then add staff later','Say no and let a rival firm take the job','Tell the exact truth, and offer a quick version'],2,
   'The book is blunt: always tell the exact truth about what you can deliver and when. Offering a thorough and a quicker version gives the client a real choice.',
   'Saying yes to work you can only finish with great pain isn’t worth it, says the book. But a flat no isn’t the only honest answer: offer what you can do and when.');}},
{part:3,src:'Chapter 14 · Resistance to Commitment',run(L){
  L.h(L.kick('learn','When the client stalls')+'<h1 class="q">Resistance usually means an earlier step was rushed</h1>'+
   L.note('Charlie’s client had 700 stores. Every strategy talk stalled on some store that didn’t fit. Even a simple three-type grouping got little buy-in, until the team ran a profit statement for each type. The results were startlingly different, and suddenly commitment came. The client had needed more envisioning, in terms it already knew.','book')+
   L.list([['arrow','Back up a step or two','If commitment is in doubt, go back to envisioning, or even framing.'],
     ['alert','Fear? Name it','Facing a fear starts by saying it out loud, with care.'],
     ['flame','Complacency? Raise the tension','Spend some of the trust you’ve built to help the client feel why it matters now.'],
     ['check','Use who, what, when','It connects the pleasant picture of the future to the details of today.']],3));
  L.done();}},
{part:3,src:'Chapter 14 · Resistance to Commitment',pts:3,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Dana is stalling. What should Noor do?',['Back up a step','Name the fear','Raise the tension'],[
   ['Dana can’t say what the closures should achieve beyond “get them done”. Every plan feels wrong.',0,'There’s no shared picture yet. Go back to envisioning before pushing for action.'],
   ['Dana keeps moving the meeting with Gail and goes quiet whenever Gail comes up.',1,'It looks like fear. Saying it gently is the first step to facing it.'],
   ['Dana says: “The letters can wait. Nobody’s chasing us.” The 14th is close.',2,'That’s complacency. Noor can spend some trust to make the urgency felt.']]);}},
{part:3,src:'Chapter 14 · Joint Commitment',run(L){
  L.h(L.kick('learn','Joint commitment')+'<h1 class="q">Shared tasks are not the same as a shared commitment</h1>'+
   L.prose('The book compares two endings to a client meeting. In both, everyone leaves with a task and a deadline. In the first, the advisor just takes a piece of the work and offers some extra material. Anyone could have done it.')+
   L.prose('In the second, the advisor links the work to a colleague’s expertise, connects the client’s team to work elsewhere, and reminds the client of a personal goal they’d agreed on, like delegating more.')+
   L.lanes([['list','Parallel','Who, what, when. Useful, but the advisor is replaceable.',3],['people','Joint','Two-sided and personal. The advisor plays a role no one else could.',2]]));
  L.done();}},
{part:3,src:'Chapter 14 · Joint Commitment',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Dana wraps up: “So I meet Gail, you draft the plan, we review Friday.” Tap each piece until Noor’s reply makes it a joint commitment.</h1>');
  L.sentence(L.card,[['“Sounds good.','“Great, and I’d like'],['I’ll send it Thursday.','Tomasz to check the plan; they’ve run three closures.'],['And you did say','Also, my team can'],['you want Felix to see you lead this. Want to present it to the board?”','take the board update off your hands.”']],[1,1,0,0],
   [['That just accepts the task list. Nothing personal is added.'],['A deadline alone keeps it parallel: anyone could promise that.'],['Taking more work off Dana is helpful, but it skips Dana’s own goal.'],['Doing it for Dana is kind, but it misses the personal goal Dana named.']],
   'Noor brings in a colleague’s experience and ties the work to Dana’s own growth. That’s two-sided and personal: a role no other lawyer would play.');}}
  ]
});
</script>
</body>
</html>
