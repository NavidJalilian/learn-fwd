<title>The Rules of Romance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">

<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0004', title:'The rules of romance: building relationships', minutes:20, icon:'people',
  goals:['Make the first move and show, not claim, what you bring','Hold back advice until it’s wanted and you’ve earned the right','Talk plainly, ask for help, and show real interest and appreciation'],
  parts:['Go first, show','Hold the advice','Talk straight','The person'],
  read:'Read chapter 5 of the book for Kathy’s Egyptian dinner and the other stories behind each rule.',
  glossary:{
   'go-first':'Go first: make the first investment in a relationship, giving before you ask, and accepting the risk of rejection.',
   'falsi-cortesi':'Falsi cortesi: an Italian phrase the book uses for the “fake courteous”, people whose praise is not rooted in truth.'
  },
  cheatsheet:[
    'Build client relationships the way you build personal ones: find <b>common ground</b>, not distance.',
    '<b>Go first</b>: give before you get. It feels risky because it is.',
    '<b>Illustrate, don’t tell.</b> Before a meeting, pick 2–3 things the client should believe about you and plan how to <i>show</i> them.',
    'Listen for <b>what’s different</b> about this client. Any sentence starting “What clients want is…” is wrong.',
    'Check your <b>advice is wanted</b>; often they want a sympathetic ear. <b>Earn the right</b>: understand the situation, the feelings, and show you understand both.',
    '<b>Keep asking</b> gentle follow-ups when clients hint. <b>Say what you mean</b>: estimate or deadline? What exactly do you need?',
    '<b>Ask for help</b>: requests win goodwill, demands breed resentment. Don’t act all-knowing.',
    'Show <b>interest</b> (and remember the answers), give <b>specific, true compliments</b>, and <b>show appreciation</b> for the client.'
  ],
  steps:[
/* ---------- PART 1: GO FIRST, SHOW ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">A friend sits down after a rotten day at work and starts describing it. You jump in: “Here’s what you should do.” They push back, you suggest something else, and soon you’re both irritated. Why?</h1>');
  L.mc(L.card,['They wanted to be heard, not fixed','Your suggestions were not good enough'],0,
   'Most of us have been on both sides of this. The book uses exactly this kind of home-life moment to teach client relationships.',
   'Even great suggestions would have failed. Your friend wanted a sympathetic ear first. This lesson borrows lessons like that from personal life.');}},
{part:0,src:'Chapter 5 · The Rules of Romance',run(L){
  L.h(L.kick('learn','The third skill')+'<h1 class="q">Client relationships work like personal ones</h1>'+
   L.prose('After earning trust and giving advice, the book turns to the third skill: <b>building relationships</b>.')+
   L.prose('Many professionals think of being “professional” as standing apart from the client. But relationships grow on <b>common ground</b>. So the book looks for lessons in how we build close relationships in personal life, even romance.')+
   L.tiers([['flame','Go first, show','Go first · Illustrate, don’t tell'],
            ['eye','Hold the advice','Listen for what’s different · Be sure your advice is being sought · Earn the right to offer advice'],
            ['chat','Talk straight','Keep asking · Say what you mean · When you need help, ask for it'],
            ['person','The person','Show an interest in the person · Use compliments, not flattery · Show appreciation']])+
   '<p class="small" style="margin-top:10px">Eleven rules in all. We take them in the book’s order, in four groups.</p>');
  L.done();}},
{part:0,src:'Chapter 5 · Go First',run(L){
  L.h(L.kick('learn','Go first')+'<h1 class="q">To earn a relationship, make the first investment</h1>'+
   L.prose('You give a favor to earn a favor. The client has to <i>see</i> you investing first. That feels risky, because you might be rejected, much like asking someone out in high school.')+
   L.note('<b>Kathy’s dinner.</b> Early in their relationship, David mentioned a work trip to Egypt. Kathy wanted to come, but asking would have been too much, too soon. So she invited him to dinner and served an Egyptian meal, with music and travel guides on the table. She never mentioned the trip. They went together.','book')+
   L.prose('Her unspoken message: I’m willing to work to deserve your goodwill, and I’ll be fun to be with. She '+L.g('go-first','went first')+'.'));
  L.done();}},
{part:0,src:'Chapter 5 · Illustrate, Don’t Tell',run(L){
  L.h(L.kick('learn','Illustrate, don’t tell')+'<h1 class="q">What you claim about yourself is heard with doubt</h1>'+
   L.prose('To make anyone believe something about you, <b>demonstrate</b> it. Claims about you or your firm are met with skepticism, if they are heard at all. Kathy didn’t argue her case; she showed it.')+
   L.lanes([['x','Tell','“We really understand the bakery sector.”',4],['check','Show','A question that proves you did your homework on Corran’s business.',2]])+
   L.list([['Before every meeting','Pick the two or three things you want the client to believe about you by the end.'],
           ['Plan the proof','Work out in advance how you will show each one. Don’t wing it.'],
           ['Keep it a pattern','Clever one-off gestures look insincere unless they fit a steady pattern of behavior.']],1));
  L.done();}},
{part:0,src:'Chapter 5 · Illustrate, Don’t Tell',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">Noor prepares to meet Felix, Corran’s CEO, for the first time</h1>');
  L.beats(L.card,[
   ['The aim','Noor picks two things Felix should believe by the end: Noor understands Corran’s business, and Noor won’t waste Felix’s time.'],
   ['Not this','Noor drops the opening slide on Larkmoor’s awards and years in practice. Felix would hear that as a sales pitch.'],
   ['Show the homework','Noor opens with: “I read that you’re expanding into wholesale with Owen Pike’s team. What I don’t know is how that changes your staffing plans.”'],
   ['Show respect for time','Noor brings a one-page summary and stops on time.'],
   ['A small gesture later','Two weeks on, a random Tuesday, Noor sends Dana a note: “Saw this article on night-shift rules for bakers. Nothing for us to do, just thought it might interest you.”']],
   'Every step shows instead of tells. The random-day note shows care, thinking in the client’s terms, and being a source of ideas.');}},
{part:0,src:'Chapter 5 · Illustrate, Don’t Tell',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Noor wants Dana to believe that Noor listens carefully. Which move <i>shows</i> it?</h1>');
  L.mc(L.card,['Telling Dana: “I always listen closely to clients.”','Adding “client-focused listening” to Larkmoor’s website','Opening by recapping Dana’s three worries from last time'],2,
   'Recapping Dana’s own words is proof. The other two are claims, and claims get met with doubt.',
   'That’s a claim, and claims are heard skeptically. Recapping what Dana said last time is proof that Noor listened.');}},
{part:0,src:'Chapter 5 · Illustrate, Don’t Tell',pts:5,run(L){
  L.h(L.kick('pr','Show or tell?')+'<h1 class="q">Sort each move Larkmoor makes with Corran.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Show','Tell'],[
   ['Noor’s proposal says “we are reliable and responsive.”',1,'A claim. Reliability is shown by doing what you said, again and again.'],
   ['Noor sends the draft letters a day before the promised date.',0,'Keeping a promise demonstrates you can be trusted to keep your word.'],
   ['Noor asks about the town’s reaction to last year’s closure of a rival bakery.',0,'The question proves Noor understands the unique side of Corran’s situation.'],
   ['Noor tells Felix that Larkmoor handles many restructurings.',1,'A claim about experience. A sharp question about one would show it.'],
   ['Unasked, Noor shares a template Dana could use for staff Q&amp;As.',0,'Starting to contribute is the best way to show you have something to contribute.']],
   'If you catch yourself describing a quality, ask: how could I show it instead?');}},

/* ---------- PART 2: HOLD THE ADVICE ---------- */
{part:1,src:'Chapter 5 · Listen for What’s Different, Not for What’s Familiar',run(L){
  L.h(L.kick('learn','Listen for what’s different')+'<h1 class="q">Treat the client as a person, not a type</h1>'+
   L.prose('Our habit is to listen for what we <i>recognize</i>, so we can reach for our usual words and tools. It’s efficient, and it often fails.')+
   L.prose('Trust grows when the client feels treated as an individual. So while listening, ask yourself: <b>What makes this person different from any client I’ve served? What does that mean for what I say and do?</b>')+
   L.note('The book calls any sentence that begins “What clients want is…” one of the most dangerous there is. However you finish it, you’ll be wrong. Clients want to be treated as unique.','alert'));
  L.done();}},
{part:1,src:'Chapter 5 · Be Sure Your Advice is Being Sought',run(L){
  L.h(L.kick('learn','Be sure your advice is being sought')+'<h1 class="q">Clients don’t always want advice</h1>'+
   L.prose('The book describes two successful professionals, married to each other. When one comes home stressed, the other leaps into solution mode. Each fix meets a “that won’t work because…”, and soon it’s a heated argument.')+
   L.flow([['alert','The trap','“Here’s what you should do”','well meant'],['flame','The result','Resentment','they didn’t want advice'],['people','What they wanted','A sympathetic ear','support, a chance to think aloud']])+
   L.prose('Clients are the same. Everyone wants affirmation, support, approval and appreciation. Offer those <i>with</i> your advice, and resist saying early on: “I know how to solve your problem.”'));
  L.done();}},
{part:1,src:'Chapter 5 · Be Sure Your Advice is Being Sought',pts:1,
 solve:async L=>{L.$('#fx').click();L.$('#ls').click();},
 run(L){
  const seen=new Set();
  const A=[['Dana','“Gail just told the shop managers the closures are a mistake. I’m so tired of this.”'],['Noor','“Easy. Send Gail a formal letter about messaging.”'],['Dana','“I can’t. Gail has twenty years here and Felix’s ear.”'],['Noor','“Then get Felix to overrule Gail.”'],['Dana','“You don’t get it. Forget it, I’ll deal with it.”']];
  const B=[['Dana','“Gail just told the shop managers the closures are a mistake. I’m so tired of this.”'],['Noor','“That sounds exhausting, after all the work you’ve put in. What happened?”'],['Dana','“It’s that Gail’s respected. Twenty years here. And I’m the one who’ll get blamed.”'],['Noor','“So it’s partly about Felix, too. Do you want ideas, or just to talk it through?”'],['Dana','“Talk first. Then yes, I’d love your thoughts.”']];
  const draw=(id,rows,col)=>{L.$(id).innerHTML=rows.map(r=>'<div style="margin:4px 0"><b>'+r[0]+':</b> '+r[1]+'</div>').join('')+'<div style="margin-top:6px;color:var(--'+col+')"><b>'+(col==='no'?'Tension rising. No advice accepted.':'Dana opens up, and asks for advice.')+'</b></div>';};
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Dana calls Noor, clearly stressed. Play both versions of the call.</h1>'+
   L.lanes([['alert','Solution mode','<div class="res" id="ra">Not played yet.</div>',4],['eye','Listen first','<div class="res" id="rb">Not played yet.</div>',2]])+
   '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px"><button class="btn" id="fx">'+L.ic('play')+'Play solution mode</button><button class="btn" id="ls">'+L.ic('play')+'Play listen first</button></div><div id="hq"></div>');
  const ask=()=>{if(seen.size<2||L.$('#hq').innerHTML)return;const q=L.$('#hq');q.innerHTML='<h2 class="sub">In the second call, what did Noor do before offering any advice?</h2>';
    L.mc(q,['Offered a stronger legal fix for Gail','Gave support and checked if advice was wanted'],1,
     'Noor gave Dana a sympathetic ear, then asked whether Dana wanted ideas. Advice offered after that gets listened to.',
     'Noor offered no fix at all at first. Noor listened, showed support, and asked whether advice was wanted.');};
  L.$('#fx').onclick=function(){this.disabled=true;seen.add(0);draw('#ra',A,'no');ask();};
  L.$('#ls').onclick=function(){this.disabled=true;seen.add(1);draw('#rb',B,'ok');ask();};}},
{part:1,src:'Chapter 5 · Earn the Right to Offer Advice',run(L){
  L.h(L.kick('learn','Earn the right to offer advice')+'<h1 class="q">Relationships have a sequence</h1>'+
   L.prose('In romance, some things are fine in year five but not on a first date. Business works the same way. The most common mistake is rushing to give answers. Often the client goes along, since both think the job is just expertise.')+
   L.prose('But nobody takes answers seriously from someone who hasn’t '+L.g('earn-the-right','earned the right')+' to give them. Earning it has three parts:')+
   L.flow([['eye','1','Understand the client’s situation'],['people','2','Understand how the client feels about it'],['check','3','Convince the client you understand both']]));
  L.done();}},
{part:1,src:'Chapter 5 · Earn the Right to Offer Advice',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Noor knows the closure timeline and the legal steps in detail, and has heard Dana’s fears about Felix. What still has to happen before Noor has earned the right to advise?</h1>');
  L.mc(L.card,['Noor needs to research the law a bit more deeply','Dana needs to be convinced Noor understands both','Noor needs a formal request in writing from Felix'],1,
   'Understanding the situation and the feelings isn’t enough on its own. Dana has to <i>feel</i> understood, for example when Noor plays both back.',
   'Noor already has steps 1 and 2. The missing step is 3: convincing Dana that Noor understands both the facts and the feelings.');}},
{part:1,src:'Chapter 5 · Earn the Right to Offer Advice',pts:1,run(L){
  L.h(L.kick('pr','Put it in order')+'<h1 class="q">Owen Pike, who runs Corran’s new wholesale division, mentions a staffing headache. Order Noor’s moves.</h1>');
  L.order(L.card,['Ask Owen what is happening with the staffing','Ask how Owen feels about it','Play back the facts and the feelings to Owen','Offer a suggestion, if Owen wants one'],
   'Situation, feelings, proof that you understand both. Only then has Noor earned the right, and even then, check the advice is wanted.');}},

/* ---------- PART 3: TALK STRAIGHT ---------- */
{part:2,src:'Chapter 5 · Keep Asking',run(L){
  L.h(L.kick('learn','Keep asking')+'<h1 class="q">People hint. Your job is to clarify, gently.</h1>'+
   L.prose('“Would you like Chinese food tonight?” is often not a question. It may be a request, or even an instruction. Clients hint the same way.')+
   L.prose('Take “I’m not sure that will work.” It could mean any of these:')+
   L.list([['“I don’t like the idea.”',''],['“I like it, but I can’t sell it to my colleagues.”',''],['“It could work, just not in this form.”',''],['“Drop it now, or you’ll annoy me.”','']],4)+
   L.note('A stark “Why not?” can sound like a challenge. Try: “I can see ways that might not work here. Would you say more? What makes you uneasy about it?”','chat'));
  L.done();}},
{part:2,src:'Chapter 5 · Say What You Mean',run(L){
  L.h(L.kick('ex','The invoice dispute')+'<h1 class="q">Advisors hint too. Here’s what it costs.</h1>');
  L.beats(L.card,[
   ['The bill','Dana pushes back on Larkmoor’s invoice: it’s well over “the figure you gave me”. Ines added research Dana never asked for.'],
   ['The mismatch','Noor: “That was an estimate, not a fixed price.” Dana: “That’s not what I heard. Why didn’t you say so?”'],
   ['The lesson','The most common breakdown, and a big source of lost trust, is a misunderstanding about what was said. Never assume the other person can read your mind.'],
   ['Next time, ask plainly','Corran’s shop managers are slow to send staff records. Instead of hinting (“we’re having a little trouble getting data”), Noor asks: “Would you tell the managers this is urgent? If we work around them, it adds delay and cost. How would you like us to proceed?”'],
   ['Not a pushover','Saying what you mean isn’t doing whatever the client wants. That’s sycophancy. A trusted advisor tells the bad news with the good, with tact.']],
   'Say clearly what you think and what you need. Hints fail.');}},
{part:2,src:'Chapter 5 · When You Need Help, Ask for It',run(L){
  L.h(L.kick('learn','When you need help, ask for it')+'<h1 class="q">Looking all-knowing makes people doubt you</h1>'+
   L.prose('Many professionals think they must look like total masters to be trusted. The opposite is true. Someone who claims to have every answer invites the thought: “Who are they kidding?”')+
   L.lanes([['x','Less trusted','“Don’t worry, I have all the answers.”',4],['check','More trusted','“I’m not completely sure how to deal with this. Can I talk it over with you?”',2]])+
   L.prose('Asking keeps the focus on the client’s issue, not on how you look, and invites joint problem solving. How you ask matters: Kathy once turned a list of dinner-party chores into a request for David’s “advice”, and he happily volunteered.')+
   '<p class="small">The book, citing Cialdini’s <i>Influence</i>: demands breed resentment, requests for help win goodwill. We warm to people we have helped, so proving how much you’ve done for a client can backfire.</p>');
  L.done();}},
{part:2,src:'Chapter 5 · Keep Asking',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which rule does Noor need?',['Keep asking','Say what you mean','Ask for help'],[
   ['Dana says, “Hmm, I’m not sure the board will go for that.” Noor isn’t sure what Dana means.',0,'It’s a hint with many possible meanings. A gentle follow-up question clarifies it.'],
   ['Noor told Dana the letters would be ready “around Friday”. Dana heard a firm promise.',1,'Estimate or deadline? Say exactly which, up front.'],
   ['Noor can’t see how to keep the shop staff calm before the announcement and wants to look in control.',2,'Faking mastery backfires. Ask Dana to think it through together.'],
   ['Felix says, “Interesting idea,” and moves on quickly.',0,'“Interesting” could mean anything. Ask what Felix makes of it.'],
   ['Noor needs Felix to approve the consultation budget, but keeps mentioning “some budget pressure”.',1,'That’s a hint. Make a clear, polite request and explain why.']]);}},

/* ---------- PART 4: THE PERSON ---------- */
{part:3,src:'Chapter 5 · Show an Interest in the Person',run(L){
  L.h(L.kick('learn','The last three rules')+'<h1 class="q">Interest, compliments, appreciation. Tap each card.</h1>');
  L.flips(L.card,[
   ['Show an interest in the person','When they say “I think this”, don’t reply “I think that.” Ask why they think it. Then <b>remember the answers</b>; notes reviewed before the next meeting help. Being polite and being interested look different.'],
   ['Use compliments, not flattery','Compliments must be true and specific. “You look nice” has no credibility. Best is praise backed by what you’ve seen or heard. The book calls fake praisers the '+'<i>falsi cortesi</i>.'],
   ['Show appreciation','Few things hurt a relationship more than feeling taken for granted. Clients rarely thank professionals openly, yet they expect professionals to show appreciation for having them as clients.']],
   'Each one shows the client you see them as a person, not a file. None works if it’s faked.');}},
{part:3,src:'Chapter 5 · Use Compliments, Not Flattery',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Noor wants to compliment Dana after a hard week. Which one is a compliment, not flattery?</h1>');
  L.mc(L.card,['“You’re honestly the best HR leader I know.”','“Three shop managers told me your briefing calmed them.”','“You always handle everything so brilliantly.”'],1,
   'It’s specific and rooted in something Noor actually heard. That gives it credibility.',
   'Sweeping praise sounds like puffery. A compliment needs to be specific and true, like what the managers actually said.');}},
{part:3,src:'Chapter 5 · Show an Interest in the Person',pts:1,run(L){
  L.h(L.kick('pr','Fit the moment')+'<h1 class="q">At lunch, Felix says: “I think lawyers mostly slow businesses down.” What should Noor say next?</h1>');
  L.mc(L.card,['“What experiences led you to that view?”','“I’d argue good lawyers speed things up.”','“That’s fair. Shall we look at the agenda?”'],0,
   'Asking why shows real interest and tells Noor what influences Felix. Noor can only find the right words once they know that.',
   'Answering “I think this” with “I think that” starts a debate, and changing the subject wastes the moment. Ask why Felix thinks it.');}},
{part:3,src:'Chapter 5 · Show Appreciation',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">The closures are done. Tap each piece until Noor’s message to Dana shows real appreciation.</h1>');
  L.sentence(L.card,[['Thanks for choosing us.','Thank you for trusting us with this.'],['You were brave to','We earned our fee when we'],['tell staff face to face,','sent the forms on time,'],['and I learned a lot from you.','so please send more work.']],[1,0,0,0],
   [['Generic. It could go to any client about any job.'],['That’s Noor praising Noor. Appreciation points at the client.'],['That’s about Larkmoor’s work, not what Dana did.'],['Asking for more work turns thanks into a sales pitch.']],
   'Specific, true and about Dana. Not a sales line, and not a reminder of how much Larkmoor did.');}},
{part:3,src:'Chapter 5 · The Rules of Romance',pts:6,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Mixed review',['Go first','Illustrate, don’t tell','Be sure advice is sought','Earn the right','Show appreciation'],[
   ['Rafa, Larkmoor’s immigration partner, wants to open with a slide titled “Why we are the best immigration team”.',1,'That’s a claim. Show expertise with a sharp question about Corran’s overseas hiring plan.'],
   ['Before any work is on the table, Noor offers Owen Pike a free half-hour on hiring rules for wholesale drivers.',0,'Noor invests in the relationship first, accepting it may not pay off.'],
   ['Dana vents about a tough board meeting. Noor starts listing fixes.',2,'Dana may want a sympathetic ear. Check before advising.'],
   ['Ten minutes into their first meeting, Noor tells Felix exactly what is wrong with Corran’s HR policies.',3,'Noor hasn’t yet shown understanding of Felix’s situation and feelings, so the answers won’t be taken seriously.'],
   ['Six years of work from Corran, and Noor has never once thanked Dana for it.',4,'Clients expect professionals to appreciate having them as clients.'],
   ['Noor wants Owen to believe Larkmoor knows wholesale, so Noor asks a pointed question about Owen’s early-morning delivery shifts.',1,'The question proves the homework. No claim needed.']]);}}
  ]
});
</script>
</body>
</html>
