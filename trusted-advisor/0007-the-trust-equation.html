<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Trust Equation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0007', title:'The trust equation', minutes:20, icon:'scale',
  goals:['Name the four parts of trust and the realm each one covers','Spot what helps or hurts credibility, reliability, intimacy and self-orientation','Explain why a new client’s trust starts so much lower than an old client’s'],
  parts:['The equation','Words and actions','Feelings and motives','The economics'],
  read:'Read chapter 8 of the book for the full tip lists under each part of the equation and the surgeon story.',
  glossary:{
   'trust-realms':'Trust realms: the area of life each part of the equation covers. Credibility = words, reliability = actions, intimacy = emotions, self-orientation = motives.'
  },
  cheatsheet:[
    '<b>T = (C + R + I) ÷ S</b>: credibility, reliability and intimacy on top, self-orientation underneath. A way of thinking, not a science.',
    'Realms: credibility = <b>words</b>, reliability = <b>actions</b>, intimacy = <b>emotions</b>, self-orientation = <b>motives</b>.',
    '<b>Credibility</b> = expertise plus presence. Accuracy makes you “believable”; completeness makes you “honest”. Say “I don’t know” fast.',
    '<b>Reliability</b> = promises kept again and again, done the way the <i>client</i> likes. Make small promises and keep them quietly.',
    '<b>Intimacy</b> is the most common failure. It is closeness about the issue at hand, built by taking a small risk first and giving the client a way out.',
    '<b>Self-orientation</b> is anything that keeps your attention on you: money, looking clever, being right, filling silences, rushing to the answer.',
    'Intimacy and low self-orientation are rare, so they are what set you apart.',
    'Book’s numbers: new client (5+3+2)/8 = <b>1.25</b>, existing client (7+8+5)/4 = <b>5</b>. New business costs 4 to 7 times more to win.'
  ],
  steps:[
/* ---------- PART 1: THE EQUATION ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Noor’s work for Corran is accurate and always on time. Yet Dana still calls Noor only when a contract needs signing. What’s the most likely reason?</h1>');
  L.mc(L.card,['Trust needs more than being right and on time','Dana needs to see more of Noor’s expertise'],0,
   'Being right and on time matters, but it is only part of trust. This lesson breaks trust into four parts.',
   'Dana already knows Noor is expert. More proof of skill won’t change much. Trust has other parts, and this lesson names them.');}},
{part:0,src:'Chapter 8 · The Trust Equation',run(L){
  L.h(L.kick('learn','The trust equation')+'<h1 class="q">Trust has four parts, and one of them divides the rest</h1>'+
   '<div style="background:var(--soft);border-radius:16px;padding:16px;text-align:center;margin:6px 0 12px"><div style="font-size:22px;font-weight:700;letter-spacing:.5px">T = (C + R + I) ÷ S</div><div class="small" style="margin-top:6px">trustworthiness = (credibility + reliability + intimacy) ÷ self-orientation</div></div>'+
   L.prose('The book offers the '+L.g('trust-equation','trust equation')+' as a framework for thinking, not a scientific result. Each part covers a different area of life, which the book calls a '+L.g('trust-realms','realm')+':')+
   L.list([['chat','Credibility · words','Can I believe what you say?'],['check','Reliability · actions','Can I count on what you do?'],['people','Intimacy · emotions','Do I feel safe raising hard things with you?'],['eye','Self-orientation · motives','Whose interests are you really serving?']],1)+
   L.prose('The first three go up to raise trust. Self-orientation sits underneath, so the more you focus on yourself, the more it drags everything down.'));
  L.done();}},
{part:0,src:'Chapter 8 · The Trust Equation',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">A world-famous surgeon and two stunned parents</h1>');
  L.beats(L.card,[
   ['The case','Rob’s three-year-old daughter needed complex surgery. She was sent to a surgeon so famous that a book had been written about his work.'],
   ['Strong on two parts','On credibility and reliability, few people anywhere could match him.'],
   ['Weak on one','After six hours of surgery he came out and told the anxious parents that “he” was fine. They had a daughter. He shrugged, corrected himself, called it an interesting case, and walked off.'],
   ['Did he get away with it?','Yes. He was world-famous, so his skill made up for the rest.'],
   ['The lesson','You can win trust while weak on one part only if you are truly superb, not just good, on the others. Most of us are not world-famous.']],
   'To win trust you need to do well on all four parts, in the <i>client’s</i> eyes.');}},
{part:0,src:'Chapter 8 · The Trust Equation',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Dana thinks: “Noor knows the law, but I suspect Noor mainly wants more billable hours.” Which part of trust is hurting?</h1>');
  L.mc(L.card,['Credibility, the realm of words','Self-orientation, the realm of motives','Reliability, the realm of actions'],1,
   'Dana doubts Noor’s motives, not Noor’s knowledge. That is self-orientation, and it pulls the whole equation down.',
   'Dana trusts Noor’s knowledge and work. The doubt is about <i>why</i> Noor does it: motives, which is self-orientation.');}},
{part:0,src:'Chapter 8 · The Trust Equation',pts:5,run(L){
  L.h(L.kick('pr','Which part?')+'<h1 class="q">Five things Corran people say about Larkmoor. Which part of trust does each one touch?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Credibility','Reliability','Intimacy','Self-orient.'],[
   ['“When Noor says the consultation must last 30 days, I don’t double-check.”',0,'Believing what someone says is credibility, the realm of words.'],
   ['“If Noor promises a draft by Friday, it arrives by Friday.”',1,'Promises turning into action, again and again, is reliability.'],
   ['“I could tell Noor that I’m worried Felix will blame me.”',2,'Feeling safe to raise a personal worry about the issue is intimacy.'],
   ['“Every meeting with Ines turns into a pitch for more work.”',3,'Seeming to be in it for yourself is self-orientation, the realm of motives.'],
   ['“Noor always sends the papers the day before, the way I like.”',1,'Doing things in the way the client prefers is the emotional side of reliability.']],
   'Every remark lands in one realm: words, actions, emotions or motives.');}},
{part:0,src:'Chapter 8 · The Trust Equation',pts:1,
 solve:async L=>{L.$('#po').children[1].click();L.$('#run').click();},
 run(L){
  let p=null;const O=['Raise credibility from 8 to 10','Cut self-orientation from 6 to 4'];
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">Dana rates Noor: credibility 8, reliability 8, intimacy 2, self-orientation 6. Noor can improve one thing by 2 points. Which raises trust more?</h1><div id="po"></div>'+
   '<div id="rc" hidden><button class="btn pri" id="run" style="margin-top:8px">'+L.ic('play')+'Work it out</button>'+
   '<div class="meterrow"><div class="lb">Today</div><div class="meter"><div id="m0" style="background:var(--h3)"></div></div></div>'+
   '<div class="meterrow"><div class="lb">More C</div><div class="meter"><div id="m1" style="background:var(--h2)"></div></div></div>'+
   '<div class="meterrow"><div class="lb">Less S</div><div class="meter"><div id="m2" style="background:var(--ok-strong)"></div></div></div><div class="small" id="sum"></div></div>');
  O.forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=n;b.onclick=()=>{if(p!==null)return;p=j;b.classList.add('sel');L.$('#rc').hidden=false;};L.$('#po').appendChild(b);});
  L.$('#run').onclick=function(){this.remove();const V=[3,20/6,4.5];
    V.forEach((v,j)=>{const el=L.$('#m'+j);if(el)el.style.width=Math.round(v/5*100)+'%';});
    L.$('#sum').innerHTML='Today: 18 ÷ 6 = <b>3.0</b> · More credibility: 20 ÷ 6 = <b>3.3</b> · Less self-orientation: 18 ÷ 4 = <b>4.5</b>';
    L.award(p===1);
    L.sheet(p===1?'ok':'no',p===1?'You called it':'Less self-orientation wins','Self-orientation divides everything else, so lowering it lifts the whole score. Noor is already strong on credibility; more of it adds little. Remember the numbers are only a way of thinking, not a measurement.');L.done();};}},

/* ---------- PART 2: WORDS AND ACTIONS ---------- */
{part:1,src:'Chapter 8 · Credibility',run(L){
  L.h(L.kick('learn','Credibility')+'<h1 class="q">The part most professionals already do well</h1>'+
   L.prose('Credibility is the part of trust that is achieved most often, because professionals focus on their expertise. That also means your competitors probably do it well too.')+
   L.prose('It is not just knowing your subject. It is expertise plus <b>presence</b>: how you look, act, react and talk about your subject. And it has two sides:')+
   L.lanes([['check','Accuracy','Mostly rational. Clients check facts, logic and references. If you are accurate, they call you <b>believable</b>. This is judged fairly fast.',2],
            ['eye','Completeness','Mostly emotional. Are you telling the whole story? If so, they call you <b>honest</b>. This takes longer to judge.',3]]));
  L.done();}},
{part:1,src:'Chapter 8 · Credibility',run(L){
  L.h(L.kick('learn','The side we neglect')+'<h1 class="q">Sellers lead with logic; buyers decide with feelings</h1>'+
   L.prose('Most professionals sell on technical skill, but most clients buy on emotion. So we polish our facts and list our credentials, and neglect the emotional side: showing we are honest and leaving nothing out.')+
   L.prose('The best professionals do two things here: they <b>anticipate needs</b>, and they <b>speak about needs the client hasn’t said out loud</b>. They offer the insight gently, not as a claim.')+
   L.note('A gentle way in: “In your seat, I’d probably be asking myself about X. Is that on your mind at all?”','chat')+
   L.list([['Never exaggerate','Not even a little. Avoid lines that sound like spin, such as promising your “top team”.'],
           ['Say “I don’t know”','Quickly and directly, when you don’t.'],
           ['Don’t show off','Clients already assume you know your subject. They rarely want to test you.']],2));
  L.done();}},
{part:1,src:'Chapter 8 · Credibility',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">Noor meets Dana about the site closures, twice</h1>');
  L.beats(L.card,[
   ['Take one','Noor opens with Larkmoor’s record: “We’ve handled dozens of closures. Our top team will be on yours.” Dana nods politely and asks for the paperwork.'],
   ['What went wrong','All rational credibility. “Our top team” even sounds like spin: who are the others?'],
   ['Take two','Noor did homework first: the rival bakery in town that closed last year. Noor asks how staff and the town reacted to it.'],
   ['The unspoken need','Then gently: “In your seat, I’d probably be asking how Felix will judge this if it goes badly. Is that on your mind at all?”'],
   ['A hard question','Dana asks whether a part-time baker counts toward the numbers. Noor isn’t sure: “I don’t know. I’ll check and tell you by tomorrow.”']],
   'Take two builds the emotional side of credibility: anticipating needs, naming the unsaid, and an honest “I don’t know”.');}},
{part:1,src:'Chapter 8 · Credibility',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Ines is asked a question about overseas hiring rules and isn’t sure of the answer. What helps credibility most?</h1>');
  L.mc(L.card,['Give a confident guess so as not to look weak','Change the subject to an area Ines knows well','Say plainly that they don’t know, and offer to find out'],2,
   'The book is direct: when you don’t know, say so, quickly. It also makes you sound honest about the rest.',
   'Guessing or dodging risks being caught out, and clients notice. Saying “I don’t know” quickly builds the honest side of credibility.');}},
{part:1,src:'Chapter 8 · Reliability',run(L){
  L.h(L.kick('learn','Reliability')+'<h1 class="q">The only part of trust that is about action</h1>'+
   L.prose('Reliability is whether clients can count on you to behave consistently. It depends on <b>how often</b> they have dealt with you: five dealings in six months tell them more than one dealing a year ago. Reports from other clients can stand in for a while, but the client’s own experience soon replaces them.')+
   L.lanes([['check','Rational side','Promises turning into actions, again and again. On time, to the standard agreed, calls returned, meetings kept.',2],
            ['people','Emotional side','Expectations met, again and again. Things done the way the client likes: their terms, formats, hours and habits.',3]])+
   L.note('Consistency alone is not enough. It has to be consistent with the <b>client’s</b> preferences, not just yours. The book thinks the emotional side offers the most room to improve.','info'));
  L.done();}},
{part:1,src:'Chapter 8 · Reliability',pts:6,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which side of reliability?',['Promises kept (rational)','Client’s way (emotional)'],[
   ['Noor promised the redundancy letters by Monday and sends them Monday morning.',0,'A promise turned into action, on time.'],
   ['Corran says “colleagues”, never “staff”. Noor’s letters use “colleagues” too.',1,'Using the client’s own terms fits how they like things done.'],
   ['Dana prefers short calls before 9 am, so Noor schedules them then.',1,'Matching the client’s hours and habits is emotional reliability.'],
   ['Noor said they would call back within the hour, and does.',0,'A small promise kept builds the rational side.'],
   ['Noor formats the board summary the way Corran’s board papers always look.',1,'Familiar format, chosen for the client’s comfort.'],
   ['Ines delivers the research memo on the agreed date, to the agreed scope.',0,'On time and to the agreed standard: promises linked to action.']]);}},
{part:1,src:'Chapter 8 · Reliability',pts:1,run(L){
  L.h(L.kick('pr','A slipping deadline')+'<h1 class="q">On Tuesday, Ines realizes the consultation memo promised to Dana for Friday will be three days late. What should Ines do?</h1>');
  L.mc(L.card,['Tell Dana today and give a new date','Work all weekend and hope Dana won’t mind','Wait until Friday in case it gets done after all'],0,
   'The book says to announce a change to a committed date as soon as it changes. Surprises damage reliability more than honest delays.',
   'Hoping or waiting turns a delay into a surprise. The book’s rule: tell the client about a changed date the moment it changes.');}},

/* ---------- PART 3: FEELINGS AND MOTIVES ---------- */
{part:2,src:'Chapter 8 · Intimacy',run(L){
  L.h(L.kick('learn','Intimacy')+'<h1 class="q">The most common way trust fails</h1>'+
   L.prose('Credibility and reliability are common. Intimacy and low self-orientation are rare, so they are what really set advisors apart. And the most common failure is a <b>lack of intimacy</b>: some professionals keep a cool distance on purpose.')+
   L.prose('In the book’s sense, '+L.g('intimacy','intimacy')+' does not mean sharing private lives. It means emotional closeness about the <b>issue at hand</b>. The more intimacy, the fewer topics are off-limits.')+
   L.note('Business is personal. Hiring, firing, reorganizing and closing sites affect many lives and go well beyond logic. That is Noor’s daily work.','people')+
   L.quote('Intimacy is more about who we are than any other aspect of trust.','Maister, Green and Galford, chapter 8'));
  L.done();}},
{part:2,src:'Chapter 8 · Intimacy',run(L){
  L.h(L.kick('learn','A dance of rising risk')+'<h1 class="q">One person offers a little; the other responds, or doesn’t</h1>'+
   L.flow([['pointer','You offer','Share a bit of what you see, think or feel'],['people','They respond','Intimacy deepens'],['shield','Or they decline','Notice the line and respect it']])+
   L.list([['You go first','Waiting for the client to open up is a useless debate. You only control your own moves.'],
           ['Leave a way out','Ask in a way that lets the client decline without losing face. Right topic, right time, right words.'],
           ['Practice the words','You can’t rehearse spontaneity, but you can write two or three ways to ask a hard question.'],
           ['Don’t overrate the risk','Often what is at risk is your comfort, not the business.']],3)+
   '<p class="small" style="margin-top:10px">Too much, too soon backfires. But intimacy need not take the longest: done well, it can be the part that depends least on time.</p>');
  L.done();}},
{part:2,src:'Chapter 8 · Intimacy',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">Noor takes the first small risk with Dana</h1>');
  L.beats(L.card,[
   ['The moment','The closure plan is drafted. Dana seems tense and keeps checking their phone.'],
   ['Noor offers something','“I’ll be honest, closures are the part of my job I find hardest. Sixty people is a lot. How is this landing for you, if you want to say? Happy to stick to the paperwork if not.”'],
   ['The way out','The last line gives Dana an easy, face-saving way to decline.'],
   ['Dana responds','Dana admits feeling exposed: Gail is resisting, and Felix will look for someone to blame if it goes wrong.'],
   ['What Noor does','Noor doesn’t try to fix the feeling. Noor acknowledges it is hard and lets Dana keep talking. The real issues are now on the table.']],
   'The book tells a similar story: Rob simply let a sidelined executive vent and acknowledged the discomfort. You don’t have to solve the client’s emotions, only make it safe to show them.');}},
{part:2,src:'Chapter 8 · Intimacy',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Noor wants to ask Dana about tension with Gail. Which question best fits the book’s advice?</h1>');
  L.mc(L.card,['“How is it really going with Gail? Tell me everything.”','“So, what’s the problem between you and Gail?”','“Gail may be a factor here. Is that worth discussing, or not today?”'],2,
   'It raises the topic and gives Dana an easy way not to answer. That makes the risk safe for both sides.',
   'That pushes Dana to answer with no face-saving way out. The book says to give the client an easy way to decline.');}},
{part:2,src:'Chapter 8 · Self-Orientation',run(L){
  L.h(L.kick('learn','Self-orientation')+'<h1 class="q">Nothing destroys trust faster than seeming to serve yourself</h1>'+
   L.prose('The obvious form is greed: being in it for the money. But '+L.g('self-orientation','self-orientation')+' is broader. It is <b>anything</b> that keeps your focus on you instead of the client.')+
   L.tiers([['alert','What drives it','Selfishness, self-consciousness, wanting to look clever or on top of things, a long to-do list, wanting to win, to be right, to be seen to add value, fear of not knowing.'],
            ['eye','How clients spot it','Relating their stories to yourself, finishing their sentences, filling silences, dodging direct questions, name-dropping, reciting credentials, answering too fast, wanting the last word.'],
            ['check','How to show it’s low','Let the client fill silences, ask open questions, define the problem before guessing the answer, summarize what you heard, say “I don’t know”, take responsibility when communication fails.','',true]]));
  L.done();}},
{part:2,src:'Chapter 8 · Self-Orientation',pts:6,run(L){
  L.h(L.kick('pr','High or low?')+'<h1 class="q">Sort what Noor and Ines do in meetings with Corran.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Shows high self-orientation','Shows low self-orientation'],[
   ['Dana pauses to think. Ines quickly fills the silence with another point.',0,'Filling empty space puts the focus on Ines. Let the client fill it.'],
   ['Noor asks: “What’s behind the timing of these closures?”',1,'An open question about what lies behind an issue keeps the focus on the client.'],
   ['Ines mentions two big-name clients Larkmoor works for.',0,'Name-dropping is a classic sign of self-orientation.'],
   ['Noor sums up: “So the real worry is the town’s reaction, not the law?”',1,'Reflective listening checks you heard what was meant.'],
   ['Ten minutes in, Noor proposes the solution before Dana finishes explaining.',0,'Answering too fast, before hearing the client’s view of the problem, is a sign of self-orientation.'],
   ['After a mix-up, Noor says: “I wasn’t clear enough, that’s on me.”',1,'Taking most of the responsibility for failed communication shows low self-orientation.']],
   'Signs of high self-orientation are about <i>you</i>: looking clever, being quick, being impressive. Low self-orientation keeps the spotlight on the client.');}},
{part:2,src:'Chapter 8 · Self-Orientation',pts:1,run(L){
  L.h(L.kick('pr','Build the reply')+'<h1 class="q">Felix interrupts five minutes in: “Just tell me what to do.” Tap each part until Noor’s reply keeps self-orientation low.</h1>');
  L.sentence(L.card,[['Simple:','I will,'],['as soon as I understand','close two shops and'],['the rest is detail.','what success looks like for you.']],[1,0,1],
   [['Jumping straight in skips understanding the problem.'],['That gives the answer before hearing the client. The book says to resist, with confidence, an early invitation to solve.'],['“The rest is detail” waves away the client’s concerns.']],
   'Noor stays confident but stays in the listening and problem-defining phase, trusting that they can add value <i>after</i> listening.');}},

/* ---------- PART 4: THE ECONOMICS ---------- */
{part:3,src:'Chapter 8 · Trust and Relationship Economics',run(L){
  L.h(L.kick('learn','Trust pays')+'<h1 class="q">Why new clients cost so much more</h1>'+
   L.prose('The book gives sample scores out of 10 for a new client and a reasonably good existing one. Your own guesses may differ; the point is the pattern.')+
   L.lanes([['person','New client','C 5 (reputation) · R 3 (no track record) · I 2 (takes time) · S 8<br><b>(5+3+2) ÷ 8 = 1.25</b>',4],
            ['people','Existing client','C 7 · R 8 · I 5 · S 4<br><b>(7+8+5) ÷ 4 = 5</b>',2]])+
   L.prose('Why is self-orientation 8 for a new client? Past experience teaches clients to assume a professional is mostly looking after their own interests. Low self-orientation is rarely assumed at the start.')+
   L.note('The ratio here is 4. The authors find that winning new-client business costs 4 to 7 times as much as winning the same business from an existing client. High-retention relationships are high-trust relationships.','trend'));
  L.done();}},
{part:3,src:'Chapter 8 · Trust and Relationship Economics',run(L){
  L.h(L.kick('ex','Meet a new client')+'<h1 class="q">Brightwell Clinics, and a COO who is slow to trust</h1>');
  L.beats(L.card,[
   ['The prospect','Brightwell Clinics, a fast-growing chain of physiotherapy clinics, is choosing a new employment law firm. Its last firm sent surprise bills and generic advice.'],
   ['The person','Sasha Moreno, Brightwell’s COO, is comparing Larkmoor with two other firms. Sasha is cautious and analytical, and wants proof before opening up.'],
   ['Tomasz’s estimate','Tomasz guesses Sasha’s view of Larkmoor: credibility 5 from reputation, reliability 3, intimacy 2, and self-orientation 8, because the last firm burned them.'],
   ['The score','(5 + 3 + 2) ÷ 8 = 1.25. Dana at Corran, after six years, is far higher.'],
   ['Tomasz’s point','“Winning Brightwell will take far more effort than growing Corran. Both matter, but let’s not neglect Dana while we chase Sasha.”']],
   'The same firm, the same skills, very different trust. A new client starts low mainly because they assume you are in it for yourself.');}},
{part:3,src:'Chapter 8 · Trust and Relationship Economics',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">In the book’s numbers, which part of trust most holds a new client’s score down?</h1>');
  L.mc(L.card,['Low credibility, since nobody knows your work yet','High self-orientation, which clients assume at the start'],1,
   'Self-orientation 8 divides the whole top line. Clients start by assuming you are mainly looking after yourself.',
   'Credibility starts at a middling 5, from reputation. The big drag is self-orientation at 8, which divides everything else.');}},
{part:3,src:'Chapter 8 · Trust and Relationship Economics',pts:1,run(L){
  L.h(L.kick('pr','First meeting')+'<h1 class="q">Noor gets a first meeting with Sasha. Given where Sasha’s trust starts, what should Noor focus on?</h1>');
  L.mc(L.card,['A full list of Larkmoor’s awards and big-name clients','Asking about Brightwell’s problems before offering answers','A firm proposal and price before the meeting ends'],1,
   'Sasha’s biggest doubt is Larkmoor’s motives. Keeping the focus on Brightwell’s problems is how Noor shows low self-orientation.',
   'Credentials and name-dropping are signs of self-orientation, and rushing to a proposal says “I want the deal”. Sasha already assumes that. Focus on Brightwell instead.');}},
{part:3,src:'Chapter 8',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Mixed review: which part needs work?',['Credibility','Reliability','Intimacy','Self-orientation'],[
   ['Noor tells Sasha “our reports never end up gathering dust”. Sasha wonders what that implies.',0,'A line that sounds like spin makes the words harder to believe.'],
   ['Dana has to chase Larkmoor twice to get a call back.',1,'Calls returned slowly break the link between promise and action.'],
   ['Dana has never mentioned the pressure from Felix, though it shapes every decision.',2,'A key topic is off-limits. Intimacy is about which subjects can be raised.'],
   ['Noor keeps steering Corran meetings toward an HR policy review Larkmoor could sell.',3,'Pushing your own agenda shows the motive is your gain.'],
   ['Ines quotes three cases from memory but leaves out the one that goes against Corran.',0,'Leaving things out damages the “honest” side of credibility: completeness.']]);}}
  ]
});
</script>
</body>
</html>
