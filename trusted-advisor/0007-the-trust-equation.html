const TQK=[['c','C','Credibility','words','h1'],['r','R','Reliability','actions','h2'],['i','I','Intimacy','emotions','h3'],['s','S','Self-orientation','motives','h4']];
const TQN={c:'credibility',r:'reliability',i:'intimacy',s:'self-orientation'};
const tqT=v=>(v.c+v.r+v.i)/v.s;
const tqF=x=>{let s=x.toFixed(2);if(s.endsWith('0'))s=s.slice(0,-1);return s;};
function tqGauge(cp){
  const P=(v,r)=>{const a=Math.PI*(1-v/10);return [150+r*Math.cos(a),140-r*Math.sin(a)];};
  let t='';if(!cp)for(let k=0;k<=10;k+=2){const p=P(k,93);t+='<text x="'+p[0].toFixed(1)+'" y="'+(p[1]+4).toFixed(1)+'" text-anchor="middle" font-size="11" fill="var(--muted)">'+k+'</text>';}
  const mk=(v,lab)=>{const p=P(v,115),q=P(v,cp?84:133);return '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="'+(cp?7:5)+'" fill="var(--card)" stroke="var(--ink)" stroke-width="2"/><text x="'+q[0].toFixed(1)+'" y="'+(q[1]+(cp?6:4)).toFixed(1)+'" text-anchor="middle" font-size="'+(cp?17:11.5)+'" font-weight="700" fill="var(--ink)">'+lab+'</text>';};
  return '<svg class="tq-g'+(cp?' cp':'')+'" viewBox="0 -8 300 202" role="img" aria-label="Trust gauge, 0 to 10"><path d="M35 140 A115 115 0 0 1 265 140" fill="none" stroke="var(--soft2)" stroke-width="16" stroke-linecap="round"/>'+
   '<path class="tq-arc" d="M35 140 A115 115 0 0 1 265 140" fill="none" stroke="var(--pri)" stroke-width="16" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" style="transition:stroke-dashoffset .45s"/>'+t+mk(1.25,'1.25')+mk(5,'5')+
   '<g class="tq-nd" style="transform-origin:150px 140px;transform:rotate(-90deg);transition:transform .45s"><line x1="150" y1="140" x2="150" y2="58" stroke="var(--ink)" stroke-width="3.5" stroke-linecap="round"/></g><circle cx="150" cy="140" r="7" fill="var(--ink)"/>'+
   '<text class="tq-gv" x="150" y="186" text-anchor="middle" font-size="'+(cp?40:28)+'" font-weight="700" fill="var(--ink)">T = 0</text></svg>';}
function tqSetGauge(root,v){const c=Math.min(Math.max(v,0),10);root.querySelector('.tq-arc').style.strokeDashoffset=String(100-c*10);root.querySelector('.tq-nd').style.transform='rotate('+(-90+18*c)+'deg)';root.querySelector('.tq-gv').textContent='T = '+tqF(v)+(v>10?' (off the dial)':'');}
function tqTile(k,tap,big,small){return '<'+(tap?'button':'div')+' class="tq-t '+k+'" data-k="'+k+'"'+(tap?' aria-label="'+TQN[k]+'"':'')+'><span>'+small+'</span><b>'+big+'</b><i class="tq-d"></i></'+(tap?'button':'div')+'>';}
function tqFrac(tap,letters){const T=(k)=>tqTile(k,tap,letters?k.toUpperCase():'',letters?'tap':k.toUpperCase());
  return '<div class="tq-fr"><div class="tq-row">'+T('c')+'<span class="tq-op">+</span>'+T('r')+'<span class="tq-op">+</span>'+T('i')+'</div><div class="tq-bar"></div>'+T('s')+'</div>';}
/* the dial: gauge + live fraction (+ optional sliders). o: {sliders, tap, legend, change(k)} */
function tqDial(host,v0,o){o=o||{};const v=Object.assign({},v0);
  const sl=K=>'<label class="tq-sl"><div class="tq-slh"><span style="color:var(--'+K[4]+')"><b>'+K[1]+'</b> '+K[2]+' · '+K[3]+'</span><span><b class="tq-sv">'+v[K[0]]+'</b> <small class="tq-nx"></small></span></div><input type="range" min="1" max="10" step="1" value="'+v[K[0]]+'" data-k="'+K[0]+'" aria-label="'+K[2]+', 1 to 10" style="accent-color:var(--'+K[4]+')"></label>';
  const G=tqGauge(o.cp)+(o.legend===false?'':'<div class="tq-leg">Markers: the book’s <b>new client 1.25</b> and <b>existing client 5</b></div>'),F=tqFrac(!!o.tap);
  host.insertAdjacentHTML('beforeend','<div class="tq-dial">'+(o.fracFirst?F+G:G+F)+'<p class="tq-ro" aria-live="polite"></p>'+(o.sliders?TQK.map(sl).join(''):'')+'</div>');
  const el=host.lastElementChild;
  const api={v,el,
    set(nv,flash){for(const k in nv){if(nv[k]===v[k])continue;const d=nv[k]-v[k];v[k]=nv[k];
        if(flash){const t=el.querySelector('.tq-t.'+k+' .tq-d');t.textContent=(d>0?'+':'−')+Math.abs(d);t.classList.remove('on');void t.offsetWidth;t.classList.add('on');}}
      draw();},
    t:()=>tqT(v)};
  function draw(){
    TQK.forEach(K=>{const k=K[0];el.querySelector('.tq-t.'+k+' b').textContent=v[k];
      const inp=el.querySelector('input[data-k="'+k+'"]');if(inp){if(+inp.value!==v[k])inp.value=v[k];
        const lab=inp.parentNode;lab.querySelector('.tq-sv').textContent=v[k];
        const sum=v.c+v.r+v.i;let nx;
        if(k==='s')nx=v.s<=1?'at the bottom':'1 lower → +'+(sum/(v.s-1)-sum/v.s).toFixed(2);
        else nx=v[k]>=10?'at the top':'1 higher → +'+(1/v.s).toFixed(2);
        lab.querySelector('.tq-nx').textContent='('+nx+')';}});
    el.querySelector('.tq-ro').innerHTML='Trust = ('+v.c+' + '+v.r+' + '+v.i+') ÷ '+v.s+' = <b style="color:var(--ink)">'+tqF(tqT(v))+'</b>';
    tqSetGauge(el,tqT(v));}
  el.querySelectorAll('input[data-k]').forEach(inp=>inp.addEventListener('input',()=>{const k=inp.dataset.k;v[k]=+inp.value;draw();if(o.change)o.change(k);}));
  if(o.tap)el.querySelectorAll('.tq-t').forEach(b=>b.onclick=()=>o.tap(b.dataset.k,b));
  requestAnimationFrame(()=>draw());draw();
  return api;}
const tqSlide=(L,k,val)=>{const s=L.$('input[data-k="'+k+'"]');s.value=val;s.dispatchEvent(new Event('input',{bubbles:true}));};

  id:'0007', title:'The trust equation', minutes:20, icon:'scale',
  goals:['Explain why self-orientation, underneath, moves trust more than anything on top','Spot which part of trust a behavior helps or hurts: credibility, reliability, intimacy or self-orientation','Use the equation, and its limits, to see why a new client starts so much lower than an old one'],
  parts:['The equation','Words and actions','Feelings and motives','Limits and payoff'],
  read:'Read chapter 8 of the book for the full tip lists under each part of the equation, the surgeon story and the lunch with Mary Doyle.',
  glossary:{
   'trust-realms':'Trust realms: the area of life each part of the equation covers. Credibility = words, reliability = actions, intimacy = emotions, self-orientation = motives.'
  },
  cheatsheet:[
    '<b>T = (C + R + I) ÷ S</b>: credibility, reliability and intimacy add up on top; self-orientation divides them. A framework for thinking, not a scientific result.',
    'Realms: credibility = <b>words</b>, reliability = <b>actions</b>, intimacy = <b>emotions</b>, self-orientation = <b>motives</b>.',
    'One point off self-orientation lifts trust far more than one point on top, because it divides everything.',
    '<b>Credibility</b> = expertise plus presence. Accuracy makes you “believable”, completeness makes you “honest”. Never exaggerate; say “I don’t know” fast.',
    '<b>Reliability</b> = promises kept again and again, done the way the <i>client</i> likes. Announce a changed date as soon as it changes.',
    '<b>Intimacy</b> is the most common failure. Go first with a small risk, give the client a way out, and don’t try to fix their feelings.',
    '<b>Self-orientation</b> is anything that keeps the focus on you: money, looking clever, being right, filling silences, answering too fast.',
    'Limits: the sum can hide a weak part, so do well on all four in the client’s eyes. Book’s numbers: new client <b>1.25</b>, existing <b>5</b>; new business costs 4 to 7 times more.'
  ],

{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Noor’s work for Corran is accurate and always on time. Yet Dana still calls Noor only when a contract needs signing. What’s the most likely reason?</h1>');
  L.mc(L.card,['Trust needs more than being right and on time','Dana needs to see more of Noor’s expertise'],0,
   'Being right and on time matters, but it is only part of trust. The book’s authors hear this puzzle a lot: “My client knows I’m credible and reliable, so why no trust?”',
   'Dana already knows Noor is expert. More proof of skill won’t change much. Trust has other parts, and this lesson names them.');}},

{part:0,src:'Chapter 8 · The Trust Equation',
 solve:async L=>{L.$$('#eqh .tq-t').forEach(b=>b.click());},
 run(L){
  L.h(L.kick('learn','The trust equation')+'<h1 class="q">Trust has four parts, and one of them divides the rest</h1>'+

   '<div id="eqh">'+tqFrac(true,true)+'</div><div id="eqx"></div>');
  const INFO={c:['Credibility · words','Can I believe what you say?'],r:['Reliability · actions','Can I count on what you do?'],i:['Intimacy · emotions','Do I feel safe raising hard things with you?'],s:['Self-orientation · motives','Whose interests are you really serving?']};

    if(seen.size===4){L.$('#eqx').insertAdjacentHTML('beforeend',L.note('The top three <b>add up</b>. Self-orientation sits <b>underneath</b> and divides them all. Most professionals focus on credibility and reliability, then wonder why the client still holds back.','scale'));L.done();}});}},

{part:0,src:'Chapter 8 · The Trust Equation',pts:1,
 solve:async L=>{L.$('#po').children[2].click();L.$('#play').click();},
 run(L){

   '<button class="btn pri" id="play" hidden>'+L.ic('play')+'Play all three</button><div class="tq-res" id="pres"></div>');

  O.forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=n;b.onclick=()=>{if(p!==null)return;p=j;b.classList.add('sel');L.$('#play').hidden=false;};L.$('#po').appendChild(b);});
  const RUN=[['More C',{c:10},'var(--h1)'],['More I',{i:4},'var(--h3)'],['Less S',{s:4},'var(--h4)']];

      const r=RUN[j];d.set({c:8,r:8,i:2,s:6});d.set(r[1],true);const t=d.t();

{part:0,src:'Chapter 8 · The Trust Equation',run(L){

{part:0,src:'Chapter 8 · The Trust Equation',pts:6,
 solve:async L=>{for(let j=0;j<TQ_TAG.length;j++){L.$('#th .tq-t.'+TQ_TAG[j][1]).click();const n=L.$('#tgn');if(n)n.click();}},
 run(L){

   '<div id="tc"></div><div id="th"></div><div id="tf"></div>');
  let j=0,ans=false,n=0;
  const d=tqDial(L.$('#th'),{c:8,r:8,i:2,s:6},{legend:false,cp:true,fracFirst:true,tap(k,b){if(ans)return;ans=true;const it=TQ_TAG[j],ok=k===it[1];n+=ok?1:0;L.award(ok);
    b.classList.add(ok?'hit':'miss');if(!ok)L.$('#th .tq-t.'+it[1]).classList.add('hit');
    const before=d.t(),nv={};nv[it[1]]=d.v[it[1]]+it[2];d.set(nv,true);const after=d.t();
    const last=j===TQ_TAG.length-1;
    L.fb(L.$('#tf'),(ok?'<b>Yes.</b> ':'<b>It moves '+TQN[it[1]]+'.</b> ')+it[3]+' Trust '+tqF(before)+' → <b>'+tqF(after)+'</b>.',ok?'ok':'no');
    if(!last)L.$('#tf').insertAdjacentHTML('beforeend','<button class="btn pri" id="tgn" style="margin-top:10px">'+L.ic('arrow')+'Next</button>');
    if(!last)L.$('#tgn').onclick=()=>{j++;show();};
    else{L.sheet(n===TQ_TAG.length?'ok':'info',n+' of '+TQ_TAG.length+' right','Look at the jumps: each self-orientation point moved trust about three times as far as a point on top. Every remark lands in one realm: words, actions, emotions or motives.');L.done();}}});
  function show(){ans=false;L.$('#tf').innerHTML='';L.$$('#th .tq-t').forEach(t=>t.classList.remove('hit','miss'));
    L.$('#tc').innerHTML='<div class="tq-bub"><b>'+(j+1)+' OF '+TQ_TAG.length+'</b>'+TQ_TAG[j][0]+'</div>';}
  show();}},

/* ---------- PART 2: WORDS AND ACTIONS ---------- */
{part:1,src:'Chapter 8 · Credibility',run(L){
  L.h(L.kick('learn','Credibility')+'<h1 class="q">The part most professionals already do well</h1>'+
   L.prose('Credibility is the part of trust achieved most often, because professionals focus on their expertise. So your competitors probably do it well too.')+
   L.prose('It is expertise plus <b>presence</b>: how you look, act, react and talk about your subject. It has two sides:')+
   L.lanes([['check','Accuracy','Mostly rational. Clients check facts, logic and references. Accurate people seem <b>believable</b>. Judged fairly fast.',2],
            ['eye','Completeness','Mostly emotional. Are you telling the whole story? Then you seem <b>honest</b>. This takes longer to judge.',3]]));
  L.done();}},
{part:1,src:'Chapter 8 · Credibility',run(L){
  L.h(L.kick('learn','The side we neglect')+'<h1 class="q">Sellers lead with logic; buyers decide with feelings</h1>'+
   L.prose('Most professionals sell on technical skill, but most clients buy on emotion. So we polish facts and list credentials, and neglect the honest side.')+
   L.prose('The best do two things: they <b>anticipate needs</b>, and they <b>name needs the client hasn’t said</b>, offered gently, not asserted.')+
   L.list([['Never exaggerate','Not even a little. Avoid lines that sound like spin, such as promising your “best people”.'],
           ['Say “I don’t know”','Quickly and directly, when you don’t.'],
           ['Don’t show off','Clients already assume you know your subject. They rarely want to test you.']],2));
  L.done();}},
{part:1,src:'Chapter 8 · Credibility',pts:1,
 solve:async L=>{TQ_SLOTS.forEach((s,j)=>L.$('#sl'+j).children[s.best].click());L.$('#ochk').click();},
 run(L){
  L.h(L.kick('pr','Build Noor’s words')+'<h1 class="q">Noor’s first call with Dana about the closures. Pick each line and watch how Dana reads Noor.</h1>'+
   '<div class="tq-sticky"><div class="small" style="font-weight:600">How Dana reads Noor</div><div class="tq-meter"><span>Believable<br><small class="small">accuracy</small></span><div class="bar"><i id="mb" style="background:var(--h2)"></i></div><b id="mbv"></b></div>'+
   '<div class="tq-meter"><span>Honest<br><small class="small">completeness</small></span><div class="bar"><i id="mh" style="background:var(--h3)"></i></div><b id="mhv"></b></div></div>'+
   '<div id="slots"></div><div class="tq-bub me" id="say"><b>NOOR SAYS</b><span></span></div>'+
   '<button class="btn pri" id="ochk" disabled style="margin-top:8px">'+L.ic('check')+'Check with Dana</button><div id="of"></div>');
  const pick=TQ_SLOTS.map(()=>null);let first=true,doneS=false;
  TQ_SLOTS.forEach((s,j)=>{L.$('#slots').insertAdjacentHTML('beforeend','<div class="tq-slot">'+s.lab.toUpperCase()+'</div><div id="sl'+j+'"></div>');
    s.opts.forEach((o,q)=>{const b=document.createElement('button');b.className='chip';b.textContent=o[0];b.onclick=()=>{if(doneS)return;pick[j]=q;[...L.$('#sl'+j).children].forEach((x,z)=>x.classList.toggle('sel',z===q));draw();};L.$('#sl'+j).appendChild(b);});});
  function draw(){let b=2,h=2;pick.forEach((q,j)=>{if(q===null)return;const e=TQ_SLOTS[j].opts[q][1];b+=e.b||0;h+=e.h||0;});
    b=Math.max(0,Math.min(5,b));h=Math.max(0,Math.min(5,h));
    L.$('#mb').style.width=b*20+'%';L.$('#mh').style.width=h*20+'%';L.$('#mbv').textContent=b+'/5';L.$('#mhv').textContent=h+'/5';
    L.$('#say span').innerHTML=pick.map((q,j)=>q===null?'…':TQ_SLOTS[j].opts[q][0]).join(' ');
    L.$('#ochk').disabled=pick.includes(null);}
  draw();
  L.$('#ochk').onclick=()=>{const ok=pick.every((q,j)=>q===TQ_SLOTS[j].best);L.$('#of').innerHTML='';
    const notes=pick.map((q,j)=>'<li>'+(q===TQ_SLOTS[j].best?'✓ ':'✗ ')+TQ_SLOTS[j].opts[q][2]+'</li>').join('');
    if(first){L.award(ok);first=false;}
    if(ok){doneS=true;L.$('#ochk').disabled=true;L.sheet('ok','Believable and honest','<ul style="margin:4px 0 0;padding-left:18px">'+notes+'</ul>');L.done();}
    else L.fb(L.$('#of'),'<b>Dana isn’t convinced yet.</b><ul style="margin:6px 0 0;padding-left:18px">'+notes+'</ul>Change the ✗ lines and check again.','no');};}},
{part:1,src:'Chapter 8 · Reliability',run(L){
  L.h(L.kick('learn','Reliability')+'<h1 class="q">The only part of trust that is about action</h1>'+
   L.prose('Reliability links words and deeds. It depends on <b>how often</b> clients deal with you: five dealings in six months say more than one dealing a year ago. Other clients’ reports can stand in, but only until the client’s own experience replaces them.')+
   L.lanes([['check','Rational side','Promises turning into actions, again and again. On time, on spec, calls returned, meetings kept.',2],
            ['people','Emotional side','Expectations met, again and again. Things done the way the client likes: their terms, formats, hours and habits.',3]])+
   L.note('Consistency alone isn’t enough. It must fit the <b>client’s</b> preferences, not just yours. The book sees the biggest room to improve on the emotional side.','info'));
  L.done();}},
{part:1,src:'Chapter 8 · Reliability',pts:6,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which side of reliability?',['Promises kept (rational)','Client’s way (emotional)'],[
   ['Noor promised the redundancy letters by Monday and sends them Monday morning.',0,'A promise turned into action, on time.'],
   ['Corran says “colleagues”, never “staff”. Noor’s letters use “colleagues” too.',1,'Using the client’s own terms fits how they like things done.'],
   ['Dana prefers short calls before 9 am, so Noor schedules them then.',1,'Matching the client’s hours and habits is emotional reliability.'],
   ['Noor said they would call back within the hour, and does.',0,'A small promise kept builds the rational side.'],
   ['Noor formats the board summary the way Corran’s board papers always look.',1,'A familiar format, chosen for the client’s comfort.'],

{part:1,src:'Chapter 8 · Reliability',pts:1,run(L){
  L.h(L.kick('pr','A slipping deadline')+'<h1 class="q">On Tuesday, Ines realizes the consultation memo promised to Dana for Friday will be three days late. What should Ines do?</h1>');
  L.mc(L.card,['Work all weekend and hope Dana won’t mind','Tell Dana today and give a new date','Wait until Friday in case it gets done after all'],1,
   'The book says to announce a change to a committed date as soon as it changes. Surprises damage reliability more than honest delays.',
   'Hoping or waiting turns a delay into a surprise. The book’s rule: tell the client about a changed date the moment it changes.');}},

/* ---------- PART 3: FEELINGS AND MOTIVES ---------- */
{part:2,src:'Chapter 8 · Intimacy',run(L){
  L.h(L.kick('learn','Intimacy')+'<h1 class="q">The most common way trust fails</h1>'+
   L.prose('Credibility and reliability are common. Intimacy and low self-orientation are rare, so they are what set advisors apart. The most common failure is a <b>lack of intimacy</b>: some professionals keep a cool distance on purpose.')+
   L.prose(L.g('intimacy','Intimacy')+' here doesn’t mean sharing private lives. It means emotional closeness about the <b>issue at hand</b>. The more intimacy, the fewer topics are off-limits.')+
   L.note('Business is personal. Hiring, firing, reorganizing and closing sites touch many lives and go well beyond logic. That is Noor’s daily work.','people')+
   L.quote('Intimacy is more about who we are than any other aspect of trust.','Maister, Green and Galford, chapter 8'));
  L.done();}},
{part:2,src:'Chapter 8 · Intimacy',run(L){
  L.h(L.kick('learn','A dance of rising risk')+'<h1 class="q">One person offers a little; the other responds, or draws a line</h1>'+
   L.flow([['pointer','You offer','A bit of what you see, think or feel'],['people','They respond','Intimacy deepens'],['shield','Or decline','Notice the line, respect it']])+
   L.list([['You go first','Waiting for the client to open up is a useless debate. You only control your own moves.'],
           ['Leave a way out','Ask so the client can decline without losing face. Right topic, right time, right words.'],
           ['Practice the words','You can’t rehearse spontaneity, but you can write two or three ways to ask a hard question.'],
           ['Don’t overrate the risk','Often what’s at risk is your comfort, not the business.']],3)+
   '<p class="small" style="margin-top:10px">Too much, too soon backfires. But done well, intimacy is the part that depends least on time.</p>');
  L.done();}},
{part:2,src:'Chapter 8 · Intimacy',pts:1,
 solve:async L=>{for(let j=0;j<TQ_RING.length;j++){const q=TQ_RING[j].opts.findIndex(o=>o[1]==='in');L.$('#rop').children[q].click();const n=L.$('#rnx');if(n)n.click();}},
 run(L){
  L.h(L.kick('pr','The dance with Dana')+'<h1 class="q">Help Noor reach the topic Dana is really worried about, one ring at a time.</h1>'+
   '<svg id="rg" viewBox="0 0 310 170" style="width:100%;max-width:320px;display:block;margin:0 auto" role="img" aria-label="Rings of topics, from the paperwork outside to Dana’s fear at the center"></svg>'+
   '<p class="small" id="rst" style="text-align:center;margin:2px 0 4px"></p><div id="rsay"></div><div id="rop"></div><div id="rfb"></div>');
  const R=[150,116,82,44];let depth=0,step=0,clean=true,line=-1,over=false;
  function drawRings(){let s='';R.forEach((r,j)=>{const open=j<=depth,ln=j===line;
      s+='<path d="M'+(155-r)+' 162 A'+r+' '+r+' 0 0 1 '+(155+r)+' 162 Z" fill="var('+(open?'--h3-bg':'--soft')+')" stroke="var('+(ln?'--no-strong':open?'--h3':'--line2')+')" stroke-width="'+(ln?3:1.5)+'"'+(ln?' stroke-dasharray="6 5"':'')+'/>';});
    R.forEach((r,j)=>{const open=j<=depth,col=open?'var(--h3)':'var(--muted)';
      if(j<3){const y=162-R[j+1]-7;s+='<text x="155" y="'+y+'" text-anchor="middle" font-size="12" font-weight="'+(open?700:500)+'" fill="'+col+'">'+TQ_RINGLAB[j]+'</text>';}
      else s+='<text x="155" y="141" text-anchor="middle" font-size="11.5" font-weight="700" fill="'+col+'">Dana’s</text><text x="155" y="155" text-anchor="middle" font-size="11.5" font-weight="700" fill="'+col+'">fear</text>';});
    L.$('#rg').innerHTML=s;
    L.$('#rst').textContent='Open topics: '+(depth+1)+' of 4'+(line>=0?' · Dana drew a line':'');}
  function show(){line=-1;drawRings();const st=TQ_RING[step];
    L.$('#rsay').innerHTML='<div class="tq-bub"><b>DANA</b>'+st.say+'</div>';L.$('#rop').innerHTML='';L.$('#rfb').innerHTML='';
    st.opts.forEach((o,q)=>{const b=document.createElement('button');b.className='opt';b.textContent=o[0];b.onclick=()=>pick(q,b);L.$('#rop').appendChild(b);});}
  function pick(q,b){if(over||b.getAttribute('aria-disabled'))return;const o=TQ_RING[step].opts[q];L.$('#rfb').innerHTML='';
    if(o[1]==='in'){depth++;line=-1;b.classList.add('ok');drawRings();
      if(step===TQ_RING.length-1){over=true;L.award(clean);
        L.sheet(clean?'ok':'info',clean?'All four rings open':'You got there','<div style="margin-bottom:6px">'+o[2]+'</div>Each ring opened only after Noor took a small risk <i>and</i> left Dana a way out. You don’t have to solve the client’s emotions, only make it safe to show them. In the book, Rob simply let a sidelined executive vent and named the discomfort; that was enough.');L.done();return;}
      L.fb(L.$('#rfb'),o[2],'ok');const nx=document.createElement('button');nx.className='btn pri';nx.style.marginTop='10px';nx.innerHTML=L.ic('arrow')+'Next moment';nx.id='rnx';
      nx.onclick=()=>{step++;show();};L.$('#rfb').appendChild(nx);[...L.$('#rop').children].forEach(x=>x.setAttribute('aria-disabled','true'));}
    else{clean=false;b.classList.add('no');b.setAttribute('aria-disabled','true');if(o[1]==='far'){line=depth+1;drawRings();}
      L.fb(L.$('#rfb'),o[2]+' Try another move.','no');}}
  show();}},
{part:2,src:'Chapter 8 · Self-Orientation',run(L){
  L.h(L.kick('learn','Self-orientation')+'<h1 class="q">Nothing destroys trust faster than seeming to serve yourself</h1>'+
   L.prose('The obvious form is greed. But '+L.g('self-orientation','self-orientation')+' is <b>anything</b> that keeps your focus on you instead of the client.')+
   L.tiers([['alert','What drives it','Self-consciousness, wanting to look clever or on top of things, a long to-do list, wanting to win, to be right, to be seen adding value, fear of not knowing.'],
            ['eye','How clients spot it','Relating their stories to yourself, finishing their sentences, filling silences, dodging direct questions, name-dropping, reciting credentials, answering too fast.'],
            ['check','How to show it’s low','Let the client fill silences, ask what’s behind an issue, define the problem before guessing the answer, summarize what you heard, say “I don’t know”, take the blame when communication fails.','',true]]));
  L.done();}},
{part:2,src:'Chapter 8 · Self-Orientation',pts:1,
 solve:async L=>{L.$$('#tk button.tq-ln').forEach(b=>{if(b.dataset.bad==='1')b.click();});L.$('#tkc').click();},
 run(L){

    el.innerHTML='<b>'+t[0].toUpperCase()+'</b>'+t[1];if(!isD){el.dataset.bad=String(t[2]);el.setAttribute('aria-pressed','false');

      L.sheet('ok','Four signs in five minutes','Each one tells Dana the meeting is about Larkmoor, not Corran. Notice that Noor did some of them too: self-orientation isn’t greed, it’s anything that pulls the focus onto you.');L.done();}
    else L.fb(L.$('#tkf'),'Not yet: you found '+found+' of 4 signs'+(wrong?', and marked '+wrong+' line'+(wrong>1?'s':'')+' that actually keep the focus on Dana':'')+'. Look for finishing sentences, relating it to yourself, name-dropping and answering too fast.','no');};}},
{part:2,src:'Chapter 8 · Self-Orientation',pts:1,run(L){
  L.h(L.kick('pr','Build the reply')+'<h1 class="q">Felix interrupts five minutes in: “Just tell me what to do.” Tap each part until Noor’s reply keeps self-orientation low.</h1>');
  L.sentence(L.card,[['Simple:','I will,'],['as soon as I understand','close two shops and'],['the rest is detail.','what success looks like for you.']],[1,0,1],
   [['Jumping straight in skips understanding the problem.'],['That gives the answer before hearing the client. The book says to resist, with confidence, an early invitation to solve.'],['“The rest is detail” waves away the client’s concerns.']],
   'Noor stays confident but stays in the listening and problem-defining phase, trusting that they can add value <i>after</i> listening.');}},

{part:3,src:'Chapter 8 · Trust and Relationship Economics',run(L){
  L.h(L.kick('learn','Trust pays')+'<h1 class="q">Why new clients cost so much more</h1>'+
   L.prose('The book gives sample scores out of 10 for a new client and a reasonably good existing one. Substitute your own guesses; the pattern is the point.')+
   L.lanes([['person','New client','C 5 (reputation) · R 3 (no track record) · I 2 (takes time) · S 8<br><b>(5+3+2) ÷ 8 = 1.25</b>',4],
            ['people','Existing client','C 7 · R 8 · I 5 · S 4<br><b>(7+8+5) ÷ 4 = 5</b>',2]])+
   L.note('A ratio of 4. The authors find that winning business from a new client costs 4 to 7 times as much as winning the same business from an existing one. High-retention relationships are high-trust relationships.','trend'));
  L.done();}},
{part:3,src:'Chapter 8 · Trust and Relationship Economics',run(L){
  L.h(L.kick('ex','Meet a new client')+'<h1 class="q">Brightwell Clinics, and a COO who is slow to trust</h1>');
  L.beats(L.card,[
   ['The prospect','Brightwell Clinics, a fast-growing chain of physiotherapy clinics, is choosing a new employment law firm. Its last firm sent surprise bills and generic advice.'],
   ['The person','Sasha Moreno, Brightwell’s COO, is comparing Larkmoor with two other firms. Sasha is cautious and analytical, and wants proof before opening up.'],
   ['Tomasz’s estimate','Credibility 5 from reputation, reliability 3, intimacy 2, and self-orientation 8, because the last firm burned them. (5 + 3 + 2) ÷ 8 = 1.25.'],
   ['Tomasz’s point','“Winning Brightwell will take far more effort than growing Corran. Both matter, but let’s not neglect Dana while we chase Sasha.”']],
   'Same firm, same skills, very different trust. A new client starts low mainly because they assume you’re in it for yourself.');}},
{part:3,src:'Chapter 8 · The Trust Equation',
 solve:async L=>{const c=L.$('#pre').children;for(let j=0;j<4;j++)c[j].click();},
 run(L){
  L.h(L.kick('learn','Edge cases · where the equation breaks')+'<h1 class="q">Load the extreme cases. Tap at least four.</h1><div id="pre" class="tq-chips sm"></div><div id="pcap"></div><div id="peh"></div>');
  const tried=new Set();
  const d=tqDial(L.$('#peh'),{c:5,r:5,i:5,s:5},{sliders:true,cp:true,legend:false});
  d.el.insertBefore(L.$('#pcap'),d.el.querySelector('.tq-sl'));
  TQ_PRESETS.forEach((p,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=p[0];
    b.onclick=()=>{L.$$('#pre .chip').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');d.set(p[1],true);
      L.$('#pcap').innerHTML='<div class="fb info" style="margin:4px 0 6px">'+p[2]+'</div>';tried.add(j);
      if(tried.size===4){L.sheet('info','Three limits to remember','<b>1.</b> The top line is a sum, so a strength can hide a weak part on paper. The book asks for all four. <b>2.</b> Only the <i>client’s</i> view counts, not your own rating. <b>3.</b> It’s a framework, not a measurement: use it to ask “which part is weak?”, not to compute trust.');L.done();}};
    L.$('#pre').appendChild(b);});}},
{part:3,src:'Chapter 8 · Trust and Relationship Economics',pts:1,
 solve:async L=>{tqSlide(L,'s',4);L.$('#cchk').click();},
 run(L){
  const base={c:5,r:3,i:2,s:8};
  L.h(L.kick('pr','Challenge')+'<h1 class="q">Double Sasha’s trust, from 1.25 to 2.5 or more, by changing just one slider.</h1>'+
   '<p class="small">Moving a second slider puts the first one back to Tomasz’s estimate.</p><div id="ch"></div><p class="small" id="cst"></p>'+
   '<button class="btn pri" id="cchk">'+L.ic('target')+'Check</button><div id="cf"></div>');
  let first=true,fin=false;
  const d=tqDial(L.$('#ch'),base,{sliders:true,change(k){const nv={};TQK.forEach(K=>{if(K[0]!==k)nv[K[0]]=base[K[0]];});d.set(nv);stat();}});
  function stat(){const ch=TQK.filter(K=>d.v[K[0]]!==base[K[0]]).map(K=>K[2].toLowerCase());L.$('#cst').textContent='Changed: '+(ch.length?ch.join(', '):'nothing yet')+' · trust '+tqF(d.t());}
  stat();
  L.$('#cchk').onclick=()=>{if(fin)return;const t=d.t(),ok=t>=2.5-1e-9;if(first){L.award(ok);first=false;}L.$('#cf').innerHTML='';
    if(ok){fin=true;L.sheet('ok','Only self-orientation can do it','Even credibility at a perfect 10 gives (10 + 3 + 2) ÷ 8 = 1.9. Self-orientation at 4 gives 10 ÷ 4 = <b>2.5</b>. That’s why new clients are so costly: they start out assuming you’re mainly in it for yourself, and only showing otherwise moves them far.');L.done();}
    else L.fb(L.$('#cf'),'Trust is '+tqF(t)+'. Push a top slider all the way to 10 and see how far it gets you, then try the one underneath.','no');};}},
{part:3,src:'Chapter 8 · Trust and Relationship Economics',pts:1,run(L){
  L.h(L.kick('pr','First meeting')+'<h1 class="q">Noor will meet Sasha for the first time. Given where Sasha’s trust starts, what should Noor focus on?</h1>');
  L.mc(L.card,['A full list of Larkmoor’s awards and big-name clients','A firm proposal and price before the meeting ends','Asking about Brightwell’s problems before offering answers'],2,
   'Sasha’s biggest doubt is Larkmoor’s motives. Keeping the focus on Brightwell’s problems is how Noor shows low self-orientation.',
   'Credentials and name-dropping are signs of self-orientation, and rushing to a proposal says “I want the deal”. Sasha already assumes that. Focus on Brightwell instead.');}},
{part:3,src:'Chapter 8',pts:4,
 solve:async L=>{for(let j=0;j<TQ_MEET.length;j++){const q=TQ_MEET[j].opts.findIndex(o=>o[4]===1);L.$('#mop').children[q].click();const n=L.$('#mnx');if(n)n.click();}},
 run(L){
  L.h(L.kick('pr','Final challenge · a call with Dana')+'<h1 class="q">Four moments in one call. Each choice moves a part of the equation. Can Noor end at 5 or higher?</h1>'+
   '<div id="mctx"></div><div id="mop"></div><div id="mh"></div><div id="mfb"></div>');
  const d=tqDial(L.$('#mh'),{c:8,r:8,i:2,s:6},{cp:true});let j=0,ans=false,n=0;
  function show(){ans=false;const m=TQ_MEET[j];L.$('#mfb').innerHTML='';
    L.$('#mctx').innerHTML='<div class="tq-bub"><b>MOMENT '+(j+1)+' OF '+TQ_MEET.length+'</b>'+m.ctx+'</div>';L.$('#mop').innerHTML='';
    m.opts.forEach((o,q)=>{const b=document.createElement('button');b.className='opt';b.textContent=o[0];b.onclick=()=>pick(q,b);L.$('#mop').appendChild(b);});}
  function pick(q,b){if(ans)return;ans=true;const o=TQ_MEET[j].opts[q],ok=o[4]===1;n+=ok?1:0;L.award(ok);
    [...L.$('#mop').children].forEach((x,z)=>{x.setAttribute('aria-disabled','true');if(z!==q)x.style.display='none';});b.classList.add(ok?'ok':'no');
    const nv={};for(const k in o[1])nv[k]=Math.max(1,Math.min(10,d.v[k]+o[1][k]));d.set(nv,true);
    L.$('#mfb').innerHTML='<div class="tq-bub"><b>WHAT HAPPENS</b>'+o[2]+'</div>';L.fb(L.$('#mfb'),o[3]+(ok?'':' Best move: '+TQ_MEET[j].opts.find(x=>x[4]===1)[0]),ok?'ok':'no');
    if(j<TQ_MEET.length-1){L.$('#mfb').insertAdjacentHTML('beforeend','<button class="btn pri" id="mnx" style="margin-top:10px">'+L.ic('arrow')+'Next moment</button>');L.$('#mnx').onclick=()=>{j++;show();};}
    else{const t=d.t();L.sheet(t>=5?'ok':'info','Trust ends at '+tqF(t),(t>=5?'Noor reached the book’s “reasonably good existing client” level. ':'Short of 5, the book’s “reasonably good existing client” level. ')+'Look at which moves did the most: the ones that lowered self-orientation. These scores are illustrative; the habits are the point.');L.done();}}
  show();}},
{part:3,src:'Chapter 8',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Mixed review: which part needs work?',['Credibility','Reliability','Intimacy','Self-orientation'],[
   ['Noor tells Sasha “our reports never end up gathering dust”. Sasha wonders what that implies.',0,'A line that sounds like spin makes the words harder to believe.'],
   ['Dana has to chase Larkmoor twice to get a call back.',1,'Calls returned slowly break the link between promise and action.'],
   ['Dana has never mentioned the pressure from Felix, though it shapes every decision.',2,'A key topic is off-limits. Intimacy is about which subjects can be raised.'],
   ['Noor keeps steering Corran meetings toward an HR policy review Larkmoor could sell.',3,'Pushing your own agenda suggests the motive is your gain.'],
   ['Ines quotes three cases from memory but leaves out the one that goes against Corran.',0,'Leaving things out damages the “honest” side of credibility: completeness.']]);}}
  ]
});
