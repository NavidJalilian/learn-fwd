<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How to Give Advice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0003', title:'How to give advice', minutes:20, icon:'chat',
  goals:['Give hard advice in a way the client thanks you for','Turn “you must” into questions and options that keep the talk alive','Guide a client, or a whole room, to their own decision'],
  parts:['Right isn’t enough','The right words','Teach, don’t tell','Politics and style'],
  read:'Read chapter 4 of the book for David’s firing story and the full list of Socratic questions.',
  glossary:{
   'socratic':'Socratic teaching: guiding someone to an answer with a series of questions, so they reason their way there instead of being told.',
   'advice-process':'Advice process: give options, educate about the options, give a recommendation, then let the client choose.'
  },
  cheatsheet:[
    'Your job is to be <b>helpful</b>, not just <b>right</b>. Advice is an emotional duet, not a logic exercise.',
    'Clients feel <b>personal risk</b>, see you as <b>adding complications</b>, and feel a <b>loss of control</b>. They want reassurance.',
    'Advise as if talking to <b>Mom or Dad</b>, never to a child: respectful, softened critique, but still get the point across.',
    '<b>Turn assertions into questions.</b> “You’ve got to do X” leaves nowhere to go; “Let’s go through the options” keeps the talk alive.',
    'Check understanding by taking the blame: “Have <b>I</b> made myself clear?” Rehearse tricky talks with a colleague.',
    'Teach like a teacher: understand <b>point A</b> first, then walk the client step by step to point B with questions.',
    'Advice process: <b>options → educate → recommend → let them choose</b>. “If this were my business, I would do X.”',
    'Groups: <b>call each attendee before the meeting</b>, summarize decisions after. And fit your style to each client.'
  ],
  steps:[
/* ---------- PART 1: RIGHT ISN'T ENOUGH ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Noor spots that Corran’s plan for choosing which staff lose their jobs is legally risky. In the meeting, Noor tells Dana: “This is wrong. You should have scored people on clear criteria.” Dana goes quiet, then asks another firm for a second opinion. What went wrong?</h1>');
  L.mc(L.card,['Noor’s legal view must have been mistaken','Noor was right, but the advice didn’t help'],1,
   'Noor’s analysis was correct. But Dana felt criticized, so the advice didn’t land. This lesson is about the gap between being right and being helpful.',
   'Nothing suggests Noor was wrong on the law. The problem was how it landed: Dana felt blamed, and right advice that isn’t accepted doesn’t help anyone.');}},
{part:0,src:'Chapter 4 · How to Give Advice',run(L){
  L.h(L.kick('learn','Being right isn’t enough')+'<h1 class="q">Advice is an emotional duet, not a logic exercise</h1>'+
   L.prose('Early in his career, David told a firm’s leaders exactly what they were getting wrong. He was correct, and they knew it. They fired him anyway, for being disruptive.')+
   L.prose('His lesson: an advisor’s job is not to be <b>right</b> but to be <b>helpful</b>. Proving someone wrong may feel good, but it gets nothing done.')+
   L.flow([['pencil','Every suggestion','“Here’s how to improve”','implies a critique'],['person','Of the person','who hired you','they often own the problem'],['alert','So tread carefully','emotions and politics','are part of the job']])+
   L.prose('That’s Noor’s trap. Dana wrote Corran’s current selection policy. Calling it “wrong” is calling Dana wrong.'));
  L.done();}},
{part:0,src:'Chapter 4 · The Client’s Perspective',run(L){
  L.h(L.kick('learn','The client’s perspective')+'<h1 class="q">What a client feels when they bring you in. Tap each card.</h1>');
  L.flips(L.card,[
   ['Personal risk','The person who hired you is the one blamed if it goes wrong: their reputation, bonus, even their career.'],
   ['You add complications','Spotting problems the client can’t see is your craft. Without tact, it looks like you are <i>creating</i> problems.'],
   ['Loss of control','Usually in charge, now they depend on an expert with jargon and costly, mysterious work. That feels bad.'],
   ['What they want','Someone who takes away worries and hassles, calms their fears and inspires confidence.']],
   'Clients come to you anxious. The book says these people skills are central to the job, yet nobody teaches them in professional training.');}},
{part:0,src:'Chapter 4 · The Client’s Perspective',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Dana snaps: “I just need the redundancy paperwork. Please don’t turn this into a bigger project.” What is most likely behind this?</h1>');
  L.mc(L.card,['Dana doesn’t care if the closures go well','Dana feels at risk and fears more problems'],1,
   'Dana chose Larkmoor and will carry the blame with Felix if this goes badly. Every new issue Noor raises feels like an added worry.',
   'Dana cares a lot. The sharp tone is anxiety: Dana carries the risk, and new issues feel like complications, not help.');}},
{part:0,src:'Chapter 4 · The Client’s Perspective',pts:4,run(L){
  L.h(L.kick('pr','Read the feeling')+'<h1 class="q">Corran clients say these things. Which feeling is speaking?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Personal risk','Complications','Loss of control'],[
   ['“If this tribunal claim goes badly, Felix will ask who picked the lawyers.”',0,'The worry is about blame landing on them personally.'],
   ['“Every time we talk, you find three new things to worry about.”',1,'Noor’s insights are being heard as extra problems.'],
   ['“I don’t even know what your team is doing this week, or what it costs.”',2,'Unexplained, costly work makes the client feel dependent.'],
   ['“I’m the Head of People, but on this I feel like I’m in the dark.”',2,'A person used to authority suddenly depends on an outsider.']],
   'Name the feeling first. Then you can reassure the right worry instead of just repeating your analysis.');}},

/* ---------- PART 2: THE RIGHT WORDS ---------- */
{part:1,src:'Chapter 4 · A Chat with Mom or Dad',run(L){
  L.h(L.kick('learn','A chat with Mom or Dad')+'<h1 class="q">Talk to clients as you would to a parent, not a child</h1>'+
   L.prose('Experts often feel they’re explaining things to a child. The client is untrained in your field, and you’ve seen the problem many times. That’s how you end up sounding patronizing.')+
   L.lanes([['x','As if to a child','“Just accept it. I’m the expert.” Conclusions, no reasons.',4],
            ['check','As if to Mom or Dad','Respect, careful words, critique softened. A dialogue that helps them see it anew.',2]])+
   L.prose('This is not dodging the issue. You still have to get the point across. But expect '+'<b>defensiveness</b>: the book says it is <i>always</i> present. Show you are trying to help, not to criticize.'));
  L.done();}},
{part:1,src:'Chapter 4 · Finding the Right Words',run(L){
  L.h(L.kick('learn','Finding the right words')+'<h1 class="q">The same thought can be said hard or soft</h1>'+
   L.prose('“You’ve got to do X” invites resistance, even when it’s right. Nobody likes being told they <i>must</i>. If the client says “No, I don’t,” you have nowhere to go, and you’re now on opposite sides.')+
   L.list([['Hard: “What are your problems?”','Soft: “What would you most like to improve?”'],
           ['Hard: “This is the best solution.”','Soft: “Other clients usually do X, for these reasons. Does that apply here?”'],
           ['Hard: “You’ve got to do X.”','Soft: “Let’s go through the options together. Can you think of others?”']],3)+
   L.note('Rule of thumb: <b>turn assertions into questions.</b> The exact words matter less than finding ones that work for you.','bulb'));
  L.done();}},
{part:1,src:'Chapter 4 · Finding the Right Words',pts:1,
 solve:async L=>{L.$('#hd').click();L.$('#sf').click();},
 run(L){
  const seen=new Set();
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Noor needs Dana to change how staff are picked for redundancy. Try both openings and watch Dana’s reply.</h1>'+
   L.lanes([['alert','Hard','<div class="res" id="ra">Not said yet.</div>',4],['chat','Soft','<div class="res" id="rb">Not said yet.</div>',2]])+
   '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px"><button class="btn" id="hd">'+L.ic('play')+'Say it hard</button><button class="btn" id="sf">'+L.ic('play')+'Say it soft</button></div><div id="hq"></div>');
  const ask=()=>{if(seen.size<2||L.$('#hq').innerHTML)return;const q=L.$('#hq');q.innerHTML='<h2 class="sub">Why is Noor still in the game after the soft version?</h2>';
    L.mc(q,['Dana is now choosing between options with Noor','Noor sounded more confident about the law'],0,
     'Dana can say no to one option and the talk carries on. With “you have to,” a “no” ends it.',
     'Noor said nothing more certain. The difference is that Dana is weighing options, so a “no” to one option doesn’t end the conversation.');};
  L.$('#hd').onclick=function(){this.disabled=true;seen.add(0);
    L.$('#ra').innerHTML='<b>Noor:</b> “You have to switch to scored criteria.”<br><span style="color:var(--no)"><b>Dana:</b> “No, we don’t. Our managers know their people.” Argument begins.</span>';ask();};
  L.$('#sf').onclick=function(){this.disabled=true;seen.add(1);
    L.$('#rb').innerHTML='<b>Noor:</b> “Let’s look at the options for choosing who goes. I see three. Can you think of others?”<br><span style="color:var(--ok)"><b>Dana:</b> “Hmm. Manager judgment is quickest, but what are the other two?”</span>';ask();};}},
{part:1,src:'Chapter 4 · Finding the Right Words',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">How David learned to check for understanding</h1>');
  L.beats(L.card,[
   ['The habit','Teaching statistics, David kept pausing to ask: “Did everyone understand that?” Silence. He assumed all was well.'],
   ['The shock','At exam time, everybody failed.'],
   ['The diagnosis','A colleague said his attitude was fine but his skill was weak. Saying “no” meant students had to admit they were slow.'],
   ['The fix','Ask “Have <b>I</b> made myself clear?” or “Shall we stay on this point or move on?” Now saying “no” blames the teacher, not the student.'],
   ['The habit to build','We don’t always know how we come across. Rehearse a client talk with a colleague playing the client; they will spot phrases that sound pompous or unclear.']],
   'The advisor takes responsibility for making sure both sides understand each other.');}},
{part:1,src:'Chapter 4 · Finding the Right Words',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Noor has just explained redundancy consultation rules to Dana. Which check makes it easiest for Dana to admit confusion?</h1>');
  L.mc(L.card,['“Was that clear to you, Dana?”','“Is that all making sense to you?”','“Have I explained that clearly enough?”'],2,
   'Noor takes the blame for any gap, so Dana can say “not quite” without looking slow.',
   'Both of those put the burden on Dana to admit not following. “Have I explained that clearly?” puts it on Noor.');}},
{part:1,src:'Chapter 4 · Finding the Right Words',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Hard or soft?',['Hard phrasing','Soft phrasing'],[
   ['“You need to consult staff for 30 days. That’s the law.”',0,'True, but a flat order. Try: “Here’s what the law asks of us. How does that fit your timeline?”'],
   ['“Most employers in your position consult early. Do you think that reasoning applies here?”',1,'It shares a view as a question and invites Dana’s judgment.'],
   ['“What’s going wrong with your HR process?”',0,'Sounds like an accusation. Try: “What part of the process most needs improving?”'],
   ['“Before we settle on that, shall we think through how the shop staff might react?”',1,'It respects Dana’s decision while raising an implication.'],
   ['“I’m the expert here. Trust me on this one.”',0,'Exactly the “explaining to a child” tone. It gives a conclusion with no reasons.']]);}},
{part:1,src:'Chapter 4 · Finding the Right Words',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Tap each piece until Noor’s line to Dana sounds like advice to a parent, not orders to a child.</h1>');
  L.sentence(L.card,[['You have to','Let’s go through'],['the one fix I see,','the options I see,'],['then I’ll tell you','then you tell me'],['what to do.','what fits Corran.']],[1,1,1,1],
   [['An order. If Dana says “no,” there’s nowhere left to go.'],['One fix means the answer is already chosen. Offer options.'],['That keeps Noor in charge. Hand the choice back to Dana.'],['That frames Noor as the one who decides. Point to Corran’s needs.']],
   'Options, shared reasoning and Dana’s choice. If Dana dislikes one option, the conversation stays alive.');}},

/* ---------- PART 3: TEACH, DON'T TELL ---------- */
{part:2,src:'Chapter 4 · A Teacher’s Skills',run(L){
  L.h(L.kick('learn','A teacher’s skills')+'<h1 class="q">Advice is like teaching: move the client from point A to point B</h1>'+
   L.prose('Standing up and announcing “B is the right answer!” is poor teaching. Good teachers need two skills.')+
   L.flow([['eye','Point A','Where the client is now','what they believe, and why'],['chat','The journey','Step-by-step questions','reasoning together'],['target','Point B','“On reflection, B is better”','“OK, that’s what we’ll do!”']])+
   L.list([['Understand point A','Only by lots of questioning and listening, holding your own reactions until later.'],
           ['Build the reasoning','Don’t jump to B. Lead a journey of discovery so the client gets there.']],2)+
   L.prose('This is '+L.g('socratic','Socratic teaching')+'. It takes patience: the urge to shout “the answer is obviously B!” is strong. That answer would be intellectually correct and a complete failure as advice.'));
  L.done();}},
{part:2,src:'Chapter 4 · A Teacher’s Skills',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">Noor walks Dana from “managers pick” to “score everyone”</h1>');
  L.beats(L.card,[
   ['Point A','Noor first asks how Dana plans to choose who goes, and why. Dana: “Managers know who the weaker bakers are. It’s quick.” Noor just listens.'],
   ['Why the problem?','“Why do you think we need a selection method at all here?” Dana: “To be fair, and to avoid claims.”'],
   ['Options','“What options do we have?” Together they list manager judgment, last-in-first-out, and scored criteria.'],
   ['Reactions','“How do you think staff in a small town would react to each?” Dana: “Badly, if it looks like favoritism.”'],
   ['Others’ difficulties','“Other employers who used manager judgment have faced claims of bias. What could prevent that?”'],
   ['Point B','Dana: “On reflection, scoring everyone on clear criteria is safer.” Noor: “OK, that’s what we’ll do.”']],
   'Same answer Noor had in the warm-up. But this time it’s Dana’s conclusion, so Dana will defend it to Felix.');}},
{part:2,src:'Chapter 4 · A Teacher’s Skills',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Which line from Noor is a Socratic question, not an answer in disguise?</h1>');
  L.mc(L.card,['“Don’t you agree scoring is plainly better?”','“What benefits might come if we scored everyone?”','“Scoring is best, so shall we just go with it?”'],1,
   'It opens the reasoning and lets Dana find the benefits.',
   'That one ends in a question mark but is really an assertion. A Socratic question lets Dana do the reasoning.');}},
{part:2,src:'Chapter 4 · A Teacher’s Skills',pts:1,run(L){
  L.h(L.kick('pr','Put it in order')+'<h1 class="q">Gail, a regional manager, wants to keep a loss-making shop open. Dana asks Noor to help Gail see the options. Put Noor’s steps in order.</h1>');
  L.order(L.card,['Ask what Gail believes about the shop, and why','Ask what options there are','Explore how staff and customers would react','Raise problems others have met, and ask how to avoid them','Gail reaches a view; Noor agrees to act on it'],
   'Point A first, by listening. Then a step-by-step journey. The conclusion comes from Gail, not from Noor.',['Point A','','','','Point B']);}},

/* ---------- PART 4: POLITICS AND STYLE ---------- */
{part:3,src:'Chapter 4 · Dealing with Client Politics',run(L){
  L.h(L.kick('learn','Dealing with client politics')+'<h1 class="q">Help the client feel it was their decision</h1>'+
   L.prose('This needs you to put your own ego aside. If you take a firm stand too early, the client may stop seeing you as a guide. The book offers a simple '+L.g('advice-process','process')+':')+
   L.flow([['list','1 · Options','what’s possible'],['book','2 · Educate','pros, cons, risks, costs'],['star','3 · Recommend','your view'],['check','4 · Let them choose','their call']])+
   L.prose('If the client asks you to choose, that’s their choice too. A tactful reply: “If this were my business, I would do X.”')+
   '<p class="small">In extreme cases the client picks a path you can’t live with. Withdrawing is painful, but better than forcing your view on them.</p>');
  L.done();}},
{part:3,src:'Chapter 4 · Dealing with Client Politics',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Noor has laid out three closure timelines and their pros and cons. Dana says: “Honestly, I can’t decide. What would you do?” What fits the book’s process?</h1>');
  L.mc(L.card,['“If this were my business, I’d phase the closures.”','“That’s not my place. You’ll need to decide.”','“Let’s list the pros and cons a second time.”'],0,
   'Dana asked Noor to choose, and that is Dana’s right. Noor gives a clear recommendation while still respecting it as Dana’s decision.',
   'Step 3 is to give a recommendation. Refusing or repeating leaves Dana stuck. Noor can say “If this were my business, I would…”');}},
{part:3,src:'Chapter 4 · Dealing with Client Politics',run(L){
  L.h(L.kick('learn','When there’s a room full of people')+'<h1 class="q">Client politics are unavoidable</h1>'+
   L.prose('You rarely have just one client. Even a CEO involves the finance chief or the general counsel, and each speaks for a different group. Handling all of that live, in one meeting, is beyond most advisors.')+
   L.list([['chat','Before: call each person','Find out who will be there. Call them one at a time and ask about their view, concerns and goals.'],
           ['people','During: build consensus','Bring out the different views and clarify them. You’ll make far more progress.'],
           ['pencil','After: summarize','People leave the same meeting with different ideas of what was decided. A short summary reduces doubt.']],1)+
   L.prose('Conflicting agendas may be the client’s fault. But unless you handle them, your advice won’t be acted on.'));
  L.done();}},
{part:3,src:'Chapter 4 · Dealing with Client Politics',pts:1,run(L){
  L.h(L.kick('pr','What next?')+'<h1 class="q">On Thursday, Felix, Dana, Gail and the finance director meet to decide the closure plan. Noor is invited. It’s Monday. What should Noor do?</h1>');
  L.mc(L.card,['Polish the slides so the answer is clear','Call each attendee to hear their concerns','Ask Dana to persuade the others first'],1,
   'Calling each person first means Noor walks in knowing Gail’s worries, the finance view and Felix’s goals, and can steer the room toward agreement.',
   'Slides and proxies don’t surface each person’s agenda. The book’s advice: call each attendee one at a time beforehand.');}},
{part:3,src:'Chapter 4 · Customizing Your Approach',run(L){
  L.h(L.kick('learn','Customizing your approach')+'<h1 class="q">One style does not fit every client</h1>'+
   L.prose('Advice giving is an art, not a science. Applying any tip to every client without thinking would be a big mistake. The skill is to design a way of working that fits <i>this</i> client.')+
   L.lanes([['person','Dana','Anxious and stretched. Responds to options, reassurance and talking it through.',2],
            ['flame','Felix, Corran’s CEO','Impatient, no patience for questions: “Skip the theory, give me your view.” So Noor gives a view.',3]])+
   L.note('What you must never do: insist on one consulting style and tell clients to adapt to you. The book calls that the truly arrogant move. The burden is on you to read each client quickly and flex.','alert'));
  L.done();}},
{part:3,src:'Chapter 4 · Customizing Your Approach',pts:1,run(L){
  L.h(L.kick('pr','Fit the client')+'<h1 class="q">Noor meets Felix for the first time. Felix cuts in: “Skip the options. What do you think we should do?” What should Noor do?</h1>');
  L.mc(L.card,['Keep asking questions, since that is best practice','Explain that good advice needs Felix to reason first','Give a direct view with brief reasons, as Felix asked'],2,
   'Felix has shown how Felix likes to work. Fitting that style is part of the job, and Noor can still give the reasons behind the view.',
   'Pushing a method Felix has just rejected makes clients fit Noor’s style. Noor should flex: a clear view, with short reasons.');}},
{part:3,src:'Chapter 4 · How to Give Advice',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which idea fits?',['Mom or Dad tone','Socratic questions','Call attendees first','Fit the client’s style'],[
   ['Ines, a second-year associate working with Noor, drafts an email to Dana: “Your policy is out of date and must be rewritten.” Noor asks Ines to rework it.',0,'The critique is right but the tone is talking down. Respect, and soften the implied critique.'],
   ['Gail is sure keeping every shop open is best. Noor wants Gail to see the costs without being told.',1,'Start where Gail is, then lead with questions so Gail reaches the conclusion.'],
   ['Next week, five Corran managers will meet to agree the consultation plan.',2,'Talk to each one beforehand so the meeting can build agreement.'],
   ['A new client, a busy founder, says: “One page, your bottom line, no lectures.”',3,'That founder has told Noor how they like advice. Fit it.'],
   ['Dana keeps saying “I just don’t see why” about a legal step. Noor wants Dana to reason it through.',1,'Questions like “Why do you think we have this problem?” build the reasoning step by step.']]);}}
  ]
});
</script>
</body>
</html>
