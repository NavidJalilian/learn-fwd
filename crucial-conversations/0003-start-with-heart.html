<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Start With Heart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0003', title:'Start with heart', minutes:19, icon:'compass',
  goals:['Catch the moment your motive drifts to winning, punishing or keeping the peace','Ask the four questions that bring you back to what you really want','Turn a Fool’s Choice into an “and” question'],
  parts:['Me first','Motives drift','What I want','Find the and'],
  read:'Read chapter 3 of the book for the full stories of Greta’s office and the two sisters.',
  glossary:{
   'start-heart':'Start with Heart: the first dialogue principle. Begin a tough talk with the right motives, and keep them, no matter what happens.',
   'and-question':'And-question: a question that joins what you want with what you don’t want, such as “How can I be honest and keep the friendship?”'
  },
  cheatsheet:[
   '<b>Work on me first, us second.</b> The only person you can reliably change is you.',
   'Under pressure our <b>motives</b> drift, usually without us noticing: to <b>winning</b>, <b>punishing</b> or <b>keeping the peace</b>.',
   'Check yourself: <b>“What does my behavior say I want?”</b>',
   'Then ask: what do I really want <b>for me</b>, <b>for others</b>, <b>for the relationship</b>? How would I behave if I wanted that?',
   'These questions point you back to your goal and help your thinking brain take over from fight or flight.',
   'The <b>Fool’s Choice</b> says you must pick honesty or the relationship. Refuse it.',
   'Search for the <b>and</b>: what I want + what I don’t want → “How can I … and … ?”',
   'Doubt it’s possible? Ask if you know <i>anyone</i> who speaks up and keeps relationships. There usually is.'
  ],
  steps:[
/* ---------- PART 1: ME FIRST ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Jordan and Kit both need Maplewood’s only free X-ray table. They argue for twenty minutes about who needs it more. What went wrong?</h1>');
  L.mc(L.card,['One of them simply had the weaker case','The fight ate the time they both wanted'],1,
   'Both could have finished their X-rays in the time it took to argue. They said they wanted the table, then acted in a way that kept them from it.',
   'Whoever was “right” hardly matters. Both said they wanted the table, then spent twenty minutes making sure neither could use it.');}},
{part:0,src:'Chapter 3 · How to Stay Focused on What You Really Want',run(L){
  L.h(L.kick('learn','The first principle')+'<h1 class="q">Dialogue starts inside your own head</h1>'+
   L.prose('The book’s seven skills for dialogue begin with '+L.g('start-heart','Start with Heart')+'. “Heart” here means your motives: what you are really trying to get out of the talk.')+
   L.prose('Why start there? When a talk turns '+L.g('crucial','crucial')+', we fall back on the habits we grew up with: debating, the silent treatment, quiet manipulation. If your own motives go wrong, your words will follow.')+
   L.note('Skilled people begin tough talks with the right motives and <b>stay focused on them</b>, whatever the other person does.','compass'));
  L.done();}},
{part:0,src:'Chapter 3 · Work on Me First, Us Second',run(L){
  L.h(L.kick('ex','A story from the book, retold')+'<h1 class="q">Two sisters, one bathroom</h1>');
  L.beats(L.card,[
   ['The setup','After a hot day at a theme park and a lot of soda, two young sisters rush into their hotel room. There is one bathroom.'],
   ['The fight','They push, call names and argue about who got there first and who needs it more. One calls their dad for help.'],
   ['The rule','Dad refuses to decide. They must work it out themselves. The only rule: no hitting.'],
   ['The cost','It takes them <b>twenty-five minutes</b>. Dad points out they could each have gone many times over in that time.'],
   ['The excuse','Asked why it took so long, each sister blames the other for being selfish.']],
   'Both said they wanted the bathroom, then acted in ways that kept it out of reach. The book’s point: our first problem isn’t that our <b>behavior</b> goes bad. It’s that our <b>motives</b> do, and we usually miss it.');}},
{part:0,src:'Chapter 3 · Don’t Look at Me!',run(L){
  L.h(L.kick('learn','Work on me first, us second')+'<h1 class="q">The only person you can reliably change is you</h1>'+
   L.prose('It’s tempting to think “if I could just fix <i>them</i>, everything would be fine.” But we’re rarely completely innocent. Most of the time we add something to the problem.')+
   L.lanes([['people','“Fix them”','Hand the book to a coworker with the useful parts underlined. Wait for them to change.',4],
            ['person','“Me first”','Ask what <i>I</i> am adding to the mess, and work on that. You are the one person you can keep shaping.',2]])+
   L.prose('There’s an irony here. The people who are already best at dialogue are the ones who keep working on themselves. The rich get richer.'));
  L.done();}},
{part:0,src:'Chapter 3 · Don’t Look at Me!',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Theo is fed up with Jordan’s sarcastic jokes about overtime. Which first step fits “me first, us second”?</h1>');
  L.mc(L.card,['Ask what Theo might be adding to the problem','Send Jordan an article on positive attitudes','Ask Dr. Alvarez to tell Jordan to stop it'],0,
   'Theo can’t control Jordan, but can look at their own part, such as never answering the overtime worry head-on.',
   'That still puts all the change on Jordan. “Me first” means Theo starts by looking at what Theo is adding to the problem.');}},
{part:0,src:'Chapter 3 · Don’t Look at Me!',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Me first, or fix them?',['Me first','Fix them'],[
   ['Kit thinks: “Dr. Alvarez is impossible to talk to. Nothing will change until they do.”',1,'All the change is placed on Dr. Alvarez. Kit has nothing left to work on.'],
   ['Jordan thinks: “My break-room jokes might be part of why nobody takes the overtime issue seriously.”',0,'Jordan is looking at their own part of the problem.'],
   ['Theo thinks: “I keep sending long emails instead of talking. What would happen if I just talked?”',0,'Theo names a habit of their own that they can change today.'],
   ['Dr. Alvarez thinks: “If my staff were tougher, we wouldn’t need these long meetings.”',1,'Wishing others were different leaves Dr. Alvarez with nothing to do.']]);}},

/* ---------- PART 2: MOTIVES DRIFT ---------- */
{part:1,src:'Chapter 3 · What Is She Acting Like She Wants?',run(L){
  L.h(L.kick('learn','Three ways motives drift')+'<h1 class="q">Under pressure, the goal quietly changes</h1>'+
   L.prose('We start a talk wanting to solve a problem. Then someone challenges us, adrenaline kicks in, and our goal switches to one of these, usually without us noticing:')+
   L.list([['star','Winning','We correct their facts, quibble over details and pick holes in their argument. Soon we just want to be right.'],
     ['flame','Punishing','As anger grows, we want the other person to hurt, or to look foolish.'],
     ['lock','Keeping the peace','We go quiet to avoid an awkward moment, and accept a sure bad result to dodge a possible uncomfortable talk.']],1)+
   '<p class="small" style="margin-top:10px">None of these adds anything to the '+L.g('pool','Pool of Shared Meaning')+'.</p>');
  L.done();}},
{part:1,src:'Chapter 3 · A Moment of Truth',run(L){
  L.h(L.kick('ex','A story from the book, retold')+'<h1 class="q">A CEO gets a very tough question</h1>');
  L.beats(L.card,[
   ['The campaign','Greta, a CEO, has pushed her managers for six months to cut costs. Little has happened, so she calls a meeting and asks for honest questions.'],
   ['The question','A nervous manager stands up: while everyone is told to save paper, Greta is having a second office built. Rumor says the furniture alone costs $150,000.'],
   ['The body','Greta turns red. Her jaw tightens, she grips the stand, and she raises a finger at the man like a weapon.'],
   ['The drift','She is no longer thinking about cutting costs. Her urge is to put this man in his place in front of everyone.'],
   ['The stakes','What she does next will shape how 200 managers see the cost-cutting push, and whether they see her as honest or a hypocrite.']],
   'In seconds Greta’s goal slid from “get costs cut” toward winning and punishing. Her body showed it before her words did.');}},
{part:1,src:'Chapter 3 · What Is She Acting Like She Wants?',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Kit raises a worry about staffing. Dr. Alvarez snaps back: “Wrong. It’s one vet moving, not two. Check your numbers.” Which motive is creeping in?</h1>');
  L.mc(L.card,['Keeping the peace','Punishing','Winning'],2,
   'Correcting facts and quibbling over details is how the slide into winning usually starts.',
   'Dr. Alvarez isn’t going quiet or trying to hurt Kit yet. Quibbling over the facts is the first step toward <b>winning</b>.');}},
{part:1,src:'Chapter 3 · What Is She Acting Like She Wants?',pts:1,
 solve:async L=>{for(let i=0;i<4;i++)L.$('#nx').click();},
 run(L){
  const R=[['“Good question. Let me pull up the staffing plan.”','Leans in, looks at Kit.',95],
           ['“Actually, it’s one and a half vets, not two. Get your facts straight.”','Jaw tightens.',70],
           ['“I’ve run this hospital for fifteen years. I think I know how to staff it.”','Arms cross, voice rises.',40],
           ['“If nobody has a <i>useful</i> question, let’s move on.”','Turns away from Kit.',8]];
  let i=0;
  L.h(L.kick('pr','See it happen')+'<h1 class="q">At the second-clinic meeting, Kit asks: “Who covers nights here when vets move across town?” Watch Dr. Alvarez’s replies one at a time.</h1>'+
   '<div class="meterrow"><div class="lb">Room for Kit to speak</div><div class="meter"><div id="mt" style="background:var(--ok-strong);width:100%"></div></div></div>'+
   '<div id="ln" style="margin:10px 0"></div><button class="btn pri" id="nx">'+L.ic('play')+'Next reply</button><div id="dq"></div>');
  L.$('#nx').onclick=function(){if(i>=R.length)return;const r=R[i];
    L.$('#ln').insertAdjacentHTML('beforeend','<div style="background:var(--soft);border-radius:14px;padding:10px 12px;margin-bottom:8px"><b>Reply '+(i+1)+'.</b> '+r[0]+'<div class="small">'+r[1]+'</div></div>');
    L.$('#mt').style.width=r[2]+'%';i++;
    if(i>=R.length){this.hidden=true;const q=L.$('#dq');q.innerHTML='<h2 class="sub">At which reply did the goal first slip away from solving the staffing problem?</h2>';
      L.mc(q,['Reply 2: fixing the numbers','Reply 3: pulling rank','Reply 4: shutting Kit down'],0,
       'Correcting details is where the slide starts. By reply 3 it’s about being right, and by reply 4 it’s punishing.',
       'By then the drift was well under way. It began at reply 2, when correcting the numbers mattered more than answering Kit.');}};}},
{part:1,src:'Chapter 3 · What Is She Acting Like She Wants?',pts:5,run(L){
  L.h(L.kick('pr','Name the motive')+'<h1 class="q">Which motive has taken over in each moment?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Winning','Punishing','Keeping the peace'],[
   ['In the overtime meeting, Theo nods along and says “we’ll look at it” to avoid a scene.',2,'Theo chooses a calm moment over solving the problem.'],
   ['Jordan digs up three old mistakes to prove Theo’s rota is worse than the old one.',0,'Stacking up proof to be right is winning.'],
   ['After the meeting, Dr. Alvarez leaves Jordan off the next training trip “to teach them a lesson.”',1,'Wanting someone to suffer is punishing.'],
   ['Kit stays quiet about a dosing worry because Dr. Alvarez seems stressed today.',2,'Kit trades a possible awkward talk for a possible bad result.'],
   ['Jordan makes a joke in front of everyone so Theo looks foolish.',1,'Making the other person look bad is punishing.']],
   'Winning, punishing and keeping the peace all feel reasonable in the moment. None of them adds meaning to the pool.');}},

/* ---------- PART 3: WHAT I REALLY WANT ---------- */
{part:2,src:'Chapter 3 · First, Focus on What You Really Want',run(L){
  L.h(L.kick('ex','How the story ended')+'<h1 class="q">Greta lowers the finger</h1>');
  L.beats(L.card,[
   ['The question','With hundreds of eyes on her, Greta asks herself one question: <b>“What do I really want here?”</b>'],
   ['The answer','She wants 200 managers to back the cost cuts. The biggest thing in the way is the belief that she’s a hypocrite.'],
   ['The switch','Now the man looks like an ally, not an enemy. He has handed her the best chance to deal with that belief in public.'],
   ['The reply','She thanks him for the risk, admits she hasn’t managed the office project as tightly as she asks of others, and sends someone to check the real cost.'],
   ['The result','An open discussion follows. The group agrees to cut the office costs in half or cancel the project.']],
   'One small mental move, asking a powerful question, turned Greta from a weapon into a curious partner.');}},
{part:2,src:'Chapter 3 · First, Focus on What You Really Want',run(L){
  L.h(L.kick('learn','The questions that bring you back')+'<h1 class="q">First notice, then ask what you really want</h1>'+
   L.prose('When you notice yourself sliding toward '+L.g('silence','silence')+' or '+L.g('violence','violence')+', step back and look at yourself like an outsider. Start with: <b>“What does my behavior say I want?”</b>')+
   L.list([['person','What do I really want for myself?',''],
     ['people','What do I really want for others?',''],
     ['chat','What do I really want for the relationship?',''],
     ['pointer','How would I behave if I really wanted these results?','']],2)+
   L.quote('When you name the game, you can stop playing it.','Chapter 3')+
   '<p class="small">Use them in the moment, or to prepare before a tough talk.</p>');
  L.done();}},
{part:2,src:'Chapter 3 · First, Focus on What You Really Want',run(L){
  L.h(L.kick('learn','Why these questions work')+'<h1 class="q">Two jobs in one question</h1>'+
   L.lanes([['compass','Find your bearings','The answer is your North Star. People baiting you, strong emotions and the habit of winning all pull you off course. The question points you back to your real goal.',1],
            ['bulb','Take charge of your body','A hard, complex question tells your brain this is a social problem, not a physical threat. Blood goes to the thinking parts, away from fight or flight.',3]])+
   L.prose('Our motives usually change without any conscious thought. Asking the question is how you make the choice conscious again.'));
  L.done();}},
{part:2,src:'Chapter 3 · First, Focus on What You Really Want',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Mid-argument, Jordan notices they are talking faster and making the point stronger than they really believe. What should Jordan ask first?</h1>');
  L.mc(L.card,['“How do I finish this point?”','“What does this say I want?”','“Why won’t Theo just listen?”'],1,
   'Jordan’s behavior is a clue. Pushing hard and overstating suggests the goal has slid to winning.',
   'That keeps Jordan in the game. First read the clue: “What does my behavior say I want right now?”');}},
{part:2,src:'Chapter 3 · Summary: Focus on What You Really Want',pts:1,run(L){
  L.h(L.kick('pr','Put it in order')+'<h1 class="q">Kit feels themselves going quiet in a meeting with Dr. Alvarez. Put Kit’s inner steps in order.</h1>');
  L.order(L.card,['Notice the slide toward silence','Ask what that behavior says about the motive','Ask what Kit really wants for self, others and relationship','Ask how Kit would act if they wanted that'],
   'Notice, read the motive, name what you really want, then choose the behavior that fits it.',['1','2','3','4']);}},
{part:2,src:'Chapter 3 · First, Focus on What You Really Want',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Theo is preparing to talk to Jordan about the overtime fight. Tap each piece until it shows what Theo <i>really</i> wants.</h1>');
  L.sentence(L.card,[['For me:'],['the overtime problem actually fixed','to be proven right about Jordan'],['For Jordan:'],['to feel the techs are heard','to admit the joke was out of line'],['For us:'],['to keep a polite distance','to work as partners again']],[0,0,0,0,0,1],
   [[],['Being proven right is winning, not a goal for the talk.'],[],['Wanting an admission is drifting toward winning. Think of what Jordan needs.'],[],['Distance avoids conflict but gives up the relationship.']],
   'Fixing the problem, Jordan feeling heard and a working partnership. Now Theo can ask: how would I behave if I really wanted all three?');}},

/* ---------- PART 4: FIND THE AND ---------- */
{part:3,src:'Chapter 3 · Second, Refuse the Fool’s Choice',run(L){
  L.h(L.kick('learn','Refuse the Fool’s Choice')+'<h1 class="q">Adrenaline shrinks your options to two</h1>'+
   L.prose('Under pressure we start to believe we must choose: get results <i>or</i> keep the relationship. Speak up and hurt someone, or stay quiet and stay safe. That’s the '+L.g('fools-choice','Fool’s Choice')+'.')+
   L.flow([['flame','Attack','Say it bluntly, damage the relationship','',4],['lock','Hide','Keep the peace, lose the result','',3]],false)+
   L.prose('People skilled at dialogue don’t accept either. They believe dialogue is always an option, and they give their brain a harder question: what do I want for myself, the other person, <b>and</b> the relationship?'));
  L.done();}},
{part:3,src:'Chapter 3 · Second, Refuse the Fool’s Choice',run(L){
  L.h(L.kick('ex','A story from the book, retold')+'<h1 class="q">The teacher who said what “everyone was thinking”</h1>');
  L.beats(L.card,[
   ['The meeting','A school staff meeting runs for hours. Royce, a chemistry teacher of thirty-three years, rambles about battles and acts out bayonet moves with a yardstick.'],
   ['The snap','Brent, the new teacher, is next. He slams the table and mocks Royce as a fossil in front of everyone.'],
   ['The defense','Faced with shocked colleagues, Brent says he is the only one brave enough to tell the truth.'],
   ['The trap','Brent saw only two options: put up with Royce in silence, or humiliate him in public. He picked the attack and called it honesty.']],
   'That’s the Fool’s Choice at work. Brent never asked if he could raise the problem <b>and</b> treat Royce with respect.');}},
{part:3,src:'Chapter 3 · Search for the Elusive And',run(L){
  L.h(L.kick('learn','Search for the and')+'<h1 class="q">Three steps to break a Fool’s Choice</h1>'+
   L.flow([['target','1 · What I want','Tell Dr. Alvarez honestly the staff can’t stretch to a second clinic yet','',1],
           ['x','2 · What I don’t want','Seem disloyal, or have a heated talk that changes nothing','',4],
           ['bulb','3 · The and-question','How can I be candid about the staffing <b>and</b> keep Dr. Alvarez’s trust?','',2]])+
   L.prose('Step 2 is the key. Ask: what bad thing am I afraid will happen if I stop pushing, or stop hiding? Then join it to what you want in one '+L.g('and-question','and-question')+'.')+
   L.note('When people face an and-question instead of a Fool’s Choice, they usually start to think, and often admit there may be a way to get both.','info'));
  L.done();}},
{part:3,src:'Chapter 3 · Search for the Elusive And',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Which one is an and-question that escapes the Fool’s Choice?</h1>');
  L.mc(L.card,['Should I tell Jordan about the overtime, or keep the peace?','How do I get Jordan to finally see the overtime my way?','How can I be frank with Jordan about overtime and not hurt trust?'],2,
   'It joins what Theo wants (candor) with what Theo doesn’t want (lost trust) in one question.',
   'An and-question doesn’t pick a side or aim to win. It joins what you want with what you don’t want: candor <i>and</i> trust.');}},
{part:3,src:'Chapter 3 · Search for the Elusive And',pts:1,run(L){
  L.h(L.kick('pr','Build the and-question')+'<h1 class="q">Jordan saw Dr. Alvarez skip the pre-surgery checklist. Build the question Jordan should ask themselves.</h1>');
  L.sentence(L.card,[['How can I'],['stay out of it','raise the skipped checklist','prove Dr. Alvarez wrong'],['with Dr. Alvarez'],['or','and'],['avoid them feeling attacked in front of others?','still get my point across?']],[0,1,0,1,0],
   [[],['Staying out of it gives up the result before trying.','Proving them wrong is winning, not what Jordan really wants.'],[],['“Or” sets up a Fool’s Choice. Look for both.'],[],['Getting the point across is what Jordan wants. The second half should be what Jordan doesn’t want.']],
   'What Jordan wants (raise the checklist) joined to what Jordan fears (an attacked, defensive boss). Now Jordan’s brain has a harder, better problem to solve.');}},
{part:3,src:'Chapter 3 · Second, Refuse the Fool’s Choice',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Fool’s Choice or search for the and?',['Fool’s Choice','Searching for the and'],[
   ['“If I tell Harriet Cole the real cost upfront, we’ll lose Harriet as a client.”',0,'It assumes honesty and the relationship can’t both survive.'],
   ['“How can I tell Kit the records are late and keep Kit’s confidence up?”',1,'It joins the honest message with what Theo doesn’t want to lose.'],
   ['“Either I push back on the second clinic or I keep my job.”',0,'Two options only, and both lose something.'],
   ['“Someone has to be the bad guy and tell Rosa. It may as well be me.”',0,'Like Brent, it assumes being blunt is the price of honesty.'],
   ['“Is there a way to talk about the rota with Theo and not sound bitter?”',1,'It asks for both: a candid talk and a good tone.']]);}},
{part:3,src:'Chapter 3 · Is This Really Possible?',pts:1,run(L){
  L.h(L.kick('pr','Is this really possible?')+'<h1 class="q">In the break room Jordan says: “Speaking up to Dr. Alvarez works in other places. Here you’d get eaten alive.” What’s the best reply?</h1>');
  L.mc(L.card,['“You’re right. Some places just aren’t safe for that.”','“Do you know anyone here who speaks up and still gets on with them?”','“Then let’s go over Dr. Alvarez’s head to the board.”'],1,
   'The book asks exactly this. There is usually someone. That person proves the Fool’s Choice is false, even here.',
   'That accepts the Fool’s Choice. The book’s test is to ask if you know <i>anyone</i> who manages to speak up and keep the relationship. There usually is.');}}
  ]
});
</script>
</body>
</html>
