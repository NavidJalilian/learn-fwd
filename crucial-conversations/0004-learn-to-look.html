<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learn To Look</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0004', title:'Learn to look', minutes:19, icon:'eye',
  goals:['Watch how a talk is going, not just what it’s about','Name the six forms of silence and violence when you see them','Read silence and violence as a sign that safety is at risk, including your own'],
  parts:['Two things to watch','Spot the turn','Silence and violence','Watch yourself'],
  read:'Read chapter 4 of the book and take its Style Under Stress test to see your own habits.',
  glossary:{
   'start-heart':'Start with Heart: the first dialogue principle. Begin a tough talk with the right motives, and keep them, no matter what happens.',
   'dual-processing':'Dual-processing: watching two things at once in a tough talk: the content (what you’re discussing) and the conditions (how people are acting and feeling).',
   'style-stress':'Style Under Stress: your own usual mix of silence and violence habits when a talk gets tough. The book has a self-test for it.',
   'self-monitor':'Vigilant self-monitor: someone who keeps watching what they are doing in a talk, and the effect it has on safety, and changes course if needed.'
  },
  cheatsheet:[
   'Watch <b>content</b> (what we’re discussing) <b>and conditions</b> (how people are acting). That’s dual-processing.',
   'The sooner you notice you’ve left dialogue, the easier and cheaper it is to get back.',
   'Know your early cues that a talk has turned crucial: <b>body</b>, <b>emotions</b> or <b>behavior</b>. Then step back, slow down, Start with Heart.',
   'People rarely get defensive because of <i>what</i> you say. They get defensive when they don’t feel <b>safe</b>.',
   '<b>Silence</b> = masking, avoiding, withdrawing. <b>Violence</b> = controlling, labeling, attacking.',
   'Read silence and violence as a <b>sign of fear</b>, not a reason to hit back. Be curious, not angry.',
   'Know your own <b>Style Under Stress</b>. Most people switch between silence and violence, and habits can change.'
  ],
  steps:[
/* ---------- PART 1: TWO THINGS TO WATCH ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">In a heated staff meeting, who is more likely to notice that half the room has gone quiet?</h1>');
  L.mc(L.card,['The person arguing their point the hardest','Someone paying attention to the room'],1,
   'The harder you argue, the more the topic swallows your attention. This lesson is about seeing the room while you talk.',
   'When you’re caught up in arguing, the topic swallows your attention. Someone watching the room sees much more.');}},
{part:0,src:'Chapter 4 · How to Notice When Safety Is at Risk',run(L){
  L.h(L.kick('ex','A story from the book, retold')+'<h1 class="q">The meeting you were in, but didn’t see</h1>');
  L.beats(L.card,[
   ['The meeting','You lead a talk with your team about product timelines. It slides into an hour-long argument, and everyone leaves annoyed.'],
   ['The blank','Walking down the hall, you can’t work out what happened. You remember pushing your view a bit too hard, and people staring at you.'],
   ['The replay','Two coworkers walking the other way replay it in detail: the boss pushed, everyone got defensive, and one of them overstated their own case too.'],
   ['The difference','Later a friend explains: you cared so much about the <b>content</b> that you were blind to the <b>conditions</b>, meaning how people were feeling and acting.']],
   'You were in the room the whole time and still missed what happened. Seeing it is a skill: you have to know what to look for.');}},
{part:0,src:'Chapter 4 · Watch for Conditions',run(L){
  L.h(L.kick('learn','Content and conditions')+'<h1 class="q">Watch the topic and the people at the same time</h1>'+
   L.lanes([['chat','Content','The topic: the overtime budget, the rota, the second clinic. <i>What</i> is being said.',1],
            ['eye','Conditions','How people respond: tone, faces, who pushes, who goes quiet. <i>Why</i> the talk is going the way it is.',2]])+
   L.prose('Watching both at once is called '+L.g('dual-processing','dual-processing')+'. It’s hard when stakes and emotions are high. The book compares it to fly fishing: a beginner can’t see the trout the expert points at, because they don’t know what to look for.')+
   L.note('Think of it as social first aid. The sooner you notice you’re not in '+L.g('dialogue','dialogue')+', the easier it is to get back and the less it costs.','alert'));
  L.done();}},
{part:0,src:'Chapter 4 · Watch for Conditions',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">In the second-clinic meeting, which of these is a <i>condition</i>, not content?</h1>');
  L.mc(L.card,['The plan calls for two more vets','Kit has stopped making eye contact','Rent across town is 20% higher'],1,
   'That’s how a person is responding, so it’s a condition. It tells you something about how the talk is going.',
   'That’s part of the topic, so it’s content. A condition is how people are acting, such as Kit going quiet.');}},
{part:0,src:'Chapter 4 · Watch for Conditions',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Content or condition?',['Content','Condition'],[
   ['Techs averaged 8 hours of overtime a week last month.',0,'That’s a fact about the topic.'],
   ['Jordan’s voice has gone flat and short.',1,'A change in how someone is speaking is a condition.'],
   ['Dr. Alvarez is talking over everyone else.',1,'How someone is behaving in the talk is a condition.'],
   ['The new rota adds a Saturday shift.',0,'That’s part of what is being discussed.'],
   ['Theo keeps steering back to the budget whenever stress comes up.',1,'Changing the subject is a sign of how Theo is handling the talk.']]);}},

/* ---------- PART 2: SPOT THE TURN ---------- */
{part:1,src:'Chapter 4 · Watch for Conditions',run(L){
  L.h(L.kick('learn','What to look for')+'<h1 class="q">Three things worth watching</h1>'+
   L.prose('So what do you actually look for while you talk? The book names three conditions:')+
   L.flow([['alert','The turn','The moment a talk becomes crucial','',1],['shield','Safety','Signs people don’t feel safe: silence or violence','',2],['person','You','Your own Style Under Stress','',3]])+
   L.prose('This part covers the first. The next two parts cover the others.'));
  L.done();}},
{part:1,src:'Chapter 4 · Learn to Spot Crucial Conversations',run(L){
  L.h(L.kick('learn','Spot the turn')+'<h1 class="q">Your early warning signals</h1>'+
   L.prose('A routine chat can turn crucial in seconds. Catch that moment, or catch it as you walk into a tough talk, before you get pulled into games. People notice it in different ways:')+
   L.tiers([['flame','Body','A tight stomach, dry eyes, a racing heart. Everyone’s signs differ.'],
            ['bulb','Emotions','You notice you’re scared, hurt or angry, and starting to react to it or bottle it up.'],
            ['eye','Behavior','You catch yourself raising your voice, pointing a finger or going very quiet. Only then do you realize how you feel.']])+
   L.note('Whatever your cue, treat it as a signal to <b>step back, slow down and '+L.g('start-heart','Start with Heart')+'</b>.','compass'));
  L.done();}},
{part:1,src:'Chapter 4 · Learn to Spot Crucial Conversations',run(L){
  L.h(L.kick('ex','At Maplewood')+'<h1 class="q">Jordan notices the turn</h1>');
  L.beats(L.card,[
   ['The scene','A dog is on the table. Dr. Alvarez, running late, says: “Let’s start, we can skip the rest of the checklist.” It’s the second time this month.'],
   ['Body','Jordan’s jaw locks and their shoulders go stiff.'],
   ['Emotion','Jordan feels a flash of fear for the dog, then anger.'],
   ['Behavior','Jordan notices they have stopped talking and are staring at the tray. That’s the habit: say nothing, grumble later.'],
   ['The pause','This time Jordan reads the cues: “This just turned crucial.” They take a breath and ask what they really want: a safe surgery and a working relationship with Dr. Alvarez.']],
   'The cues didn’t solve the problem. They gave Jordan a moment to step back instead of sliding into the old habit.');}},
{part:1,src:'Chapter 4 · Learn to Spot Crucial Conversations',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Kit only realizes a talk with Dr. Alvarez has gone wrong when they notice they’ve said “fine” three times in a row. What kind of cue is that?</h1>');
  L.mc(L.card,['An emotional cue','A body cue','A behavioral cue'],2,
   'Kit noticed what they were <i>doing</i>, which tipped them off to how they felt.',
   'Kit noticed their own actions (repeating “fine”), so it’s a behavioral cue.');}},
{part:1,src:'Chapter 4 · Learn to Spot Crucial Conversations',pts:5,run(L){
  L.h(L.kick('pr','Sort the cues')+'<h1 class="q">Each person noticed the turn a different way. Which kind of cue was it?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Body','Emotion','Behavior'],[
   ['Theo’s hands go cold when Jordan walks in with the overtime log.',0,'A physical change is a body cue.'],
   ['Dr. Alvarez hears themselves say “obviously” for the third time.',2,'Catching your own words is a behavioral cue.'],
   ['Kit realizes they feel small and a bit scared.',1,'Naming a feeling is an emotional cue.'],
   ['Jordan sees they’ve crossed their arms and turned away.',2,'Noticing your own actions is a behavioral cue.'],
   ['Theo feels hurt that nobody thanked them for the new rota.',1,'Hurt is an emotion.']],
   'Any of the three works. What matters is knowing <i>your</i> first cue, so you can step back early.');}},

/* ---------- PART 3: SILENCE AND VIOLENCE ---------- */
{part:2,src:'Chapter 4 · Learn to Look for Safety Problems',run(L){
  L.h(L.kick('learn','Look for safety problems')+'<h1 class="q">People get defensive when they feel unsafe, not because of what you said</h1>'+
   L.quote('When it’s safe, you can say anything.','Chapter 4')+
   L.prose('Fear kills the flow of meaning. Fear that your ideas won’t land makes you push; fear of being harmed makes you hide. Fight and flight come from the same feeling.')+
   L.prose('Think of tough feedback you once took well. Most likely you trusted that the person had your best interests at heart and you respected their opinion. You felt '+L.g('safety','safe')+', so you didn’t need to defend yourself.')+
   L.note('So the problem is usually not the message. It’s that the other person doesn’t feel safe hearing it.','shield'));
  L.done();}},
{part:2,src:'Chapter 4 · Don’t Let Safety Problems Lead You Astray',run(L){
  L.h(L.kick('learn','Don’t take the bait')+'<h1 class="q">Silence and violence are signs of fear</h1>'+
   L.prose('When people feel unsafe they act in annoying ways: they mock you, insult you, or bury you in arguments. The natural reaction is to treat it as an attack and hit back, or escape. Then you’re part of the problem.')+
   L.flow([['alert','They jab','A sarcastic jab or a sudden silence','',4],['eye','Recode it','“That’s a sign they don’t feel safe.”','',2],['shield','Respond','Do something to make it safer','',1]])+
   L.prose('The book calls this the pivot point for everything that follows. For now, just learn to look, and be <b>curious, not angry or frightened</b>. The next lesson covers how to make it safe.')+
   '<p class="small">Looking for safety problems also helps you: it gives your brain a new task, which keeps your thinking switched on when emotions narrow your vision.</p>');
  L.done();}},
{part:2,src:'Chapter 4 · Silence and Violence',run(L){
  L.h(L.kick('learn','Six forms to recognize')+'<h1 class="q">The common forms of silence and violence</h1>'+
   L.lanes([['lock',L.g('silence','Silence'),'Holding meaning <b>back</b> from the pool.<br><br><b>Masking:</b> hiding your real view with sarcasm or sugarcoating.<br><b>Avoiding:</b> talking, but steering around the real issue.<br><b>Withdrawing:</b> leaving the talk or the room.',3],
            ['flame',L.g('violence','Violence'),'Forcing meaning <b>into</b> the pool.<br><br><b>Controlling:</b> cutting people off, overstating, speaking in absolutes.<br><b>Labeling:</b> dismissing people or ideas with a stereotype.<br><b>Attacking:</b> belittling or threatening.',4]])+
   '<p class="small" style="margin-top:10px">Knowing the forms helps you spot safety problems early, like a trained eye spotting the trout.</p>');
  L.done();}},
{part:2,src:'Chapter 4 · Silence and Violence',run(L){
  L.h(L.kick('ex','What they say, what they mean')+'<h1 class="q">Tap each line from Maplewood to see the meaning underneath</h1>');
  L.flips(L.card,[
   ['Theo: “The new rota is, uh, a really interesting first draft.”','<b>Masking.</b> Meaning: I think it won’t work, but I won’t say so.'],
   ['Jordan: “Oh great, more overtime. Living the dream.”','<b>Masking</b> with sarcasm. Meaning: I’m angry and nobody is listening.'],
   ['Dr. Alvarez: “Every clinic in the region is expanding. It’s obvious.”','<b>Controlling.</b> An absolute claim used to end the debate.'],
   ['Jordan: “Typical management. They never get it.”','<b>Labeling.</b> Dismissing Theo by putting them in a box.'],
   ['Kit: “Sorry, I need to check on a patient.” (Leaves the meeting.)','<b>Withdrawing.</b> Exiting rather than staying in the hard talk.']],
   'Each line hides a real meaning that never made it into the pool. Spotting the form is your cue that safety is slipping.');}},
{part:2,src:'Chapter 4 · Silence and Violence',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Asked about the overtime numbers, Theo starts talking about the new coffee machine instead. Which form is that?</h1>');
  L.mc(L.card,['Avoiding','Withdrawing','Masking'],0,
   'Theo stays in the talk but steers around the real issue.',
   'Theo hasn’t left, and isn’t disguising a view with sarcasm. Steering away from the topic while still talking is <b>avoiding</b>.');}},
{part:2,src:'Chapter 4 · Silence and Violence',pts:6,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Name the form',['Masking','Avoiding','Withdrawing','Controlling','Labeling','Attacking'],[
   ['Dr. Alvarez cuts Kit off mid-sentence: “Let me stop you there.”',3,'Cutting people off to dominate the talk is controlling.'],
   ['Kit stops replying to Theo’s messages about the late records.',2,'Pulling out of the conversation altogether is withdrawing.'],
   ['Jordan to Theo: “Push that rota through and see what happens.”',5,'A vague threat is attacking.'],
   ['Theo tells Jordan their idea is “really brave” while planning to ignore it.',0,'Faint praise that hides a real view is masking.'],
   ['Dr. Alvarez: “Techs always complain about change.”',4,'Lumping people into a stereotype to dismiss them is labeling.'],
   ['Asked about the skipped checklist, Jordan chats about the new X-ray software.',1,'Talking while steering around the real issue is avoiding.']]);}},
{part:2,src:'Chapter 4 · Don’t Let Safety Problems Lead You Astray',pts:1,
 solve:async L=>{const g=L.$('#lz').children;g[0].click();g[1].click();},
 run(L){
  const LZ=[['x','Take it as an attack','Theo snaps back: “If you hate it here, nobody’s stopping you.” Jordan goes silent. The overtime issue stays buried, and both leave sure the other is the problem.','var(--no)'],
            ['eye','Read it as a safety sign','Theo thinks: “Jordan doesn’t feel safe raising this.” Theo gets curious instead of angry, and makes a note to ask Jordan what’s really going on.','var(--ok)']];const seen=new Set();
  L.h(L.kick('pr','Toggle and compare')+'<h1 class="q">In the team meeting Jordan jokes: “Overtime again? Maybe we should just move in.” Everyone laughs. Theo feels stung. Try both ways of seeing it.</h1><div id="lz"></div>'+
   '<div style="background:var(--soft);border-radius:16px;padding:14px;margin:8px 0 6px;min-height:96px" id="lo"><span class="small">Choose a lens above.</span></div><div id="lq"></div>');
  LZ.forEach((z,j)=>{const b=document.createElement('button');b.className='chip';b.innerHTML=L.ic(z[0])+z[1];b.onclick=()=>{[...L.$('#lz').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(j);
    L.$('#lo').innerHTML='<b style="color:'+z[3]+'">What happens next</b><p style="margin:6px 0 0">'+z[2]+'</p>';
    if(seen.size===2&&!L.$('#lq').innerHTML){const q=L.$('#lq');q.innerHTML='<h2 class="sub">What is Jordan’s joke, seen with the book’s eyes?</h2>';
      L.mc(q,['A sign Jordan doesn’t feel safe speaking plainly','Proof that Jordan is just a negative person'],0,
       'It’s masking: sarcasm instead of saying the real concern. Read it as fear, and you stay curious instead of hitting back.',
       'That’s the bait. The joke is masking, a form of silence, which signals Jordan doesn’t feel safe saying it straight.');}};L.$('#lz').appendChild(b);});}},

/* ---------- PART 4: WATCH YOURSELF ---------- */
{part:3,src:'Chapter 4 · Look for Your Style Under Stress',run(L){
  L.h(L.kick('learn','The hardest thing to watch')+'<h1 class="q">You’re on the wrong side of your own eyeballs</h1>'+
   L.prose('While you track the topic and everyone else, your own behavior slips out of view. Caught up in a cause, we bully, interrupt or sulk, and don’t notice.')+
   L.prose('The book’s example: someone shouts “I’m not angry!” with a vein bulging on their forehead. Or says “Nothing’s wrong” while staring wounded at the floor.')+
   L.note('The fix is to become a '+L.g('self-monitor','vigilant self-monitor')+': keep watching what you’re doing and the effect it has on safety, and change course if it’s hurting.','eye'));
  L.done();}},
{part:3,src:'Chapter 4 · Your Style Under Stress Test',run(L){
  L.h(L.kick('ex','At Maplewood')+'<h1 class="q">Dr. Alvarez looks at their own Style Under Stress</h1>');
  L.beats(L.card,[
   ['The test','After the second-clinic meeting, Dr. Alvarez takes the book’s '+L.g('style-stress','Style Under Stress')+' test, thinking about tough talks with their staff.'],
   ['The result','High on <b>controlling</b>: absolutes, cutting people off. But also high on <b>avoiding</b>: they never ask the staff directly what worries them.'],
   ['The surprise','Both? The book says that’s normal. Most people switch between holding back and pushing too hard.'],
   ['The meaning','The score measures behavior, not a fixed trait. Behavior can change with practice.'],
   ['The plan','Before the next meeting, Dr. Alvarez writes down what to watch for: “obviously,” interrupting, and not asking.']],
   'Knowing your own habits tells you exactly what to watch for when a talk turns tough, and which skills to practice most.');}},
{part:3,src:'Chapter 4 · What Your Score Means',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Theo’s Style Under Stress shows high masking and avoiding. What does that tell Theo?</h1>');
  L.mc(L.card,['Theo is simply a quiet type and can’t change','Which habits to watch for and work on','Theo should avoid tough talks altogether'],1,
   'The score is a measure of behavior, so it points to what Theo can watch for and practice.',
   'The book is clear that the score measures behavior, not a fixed trait. It shows Theo which habits to watch and which skills to practice.');}},
{part:3,src:'Chapter 4 · Become a Vigilant Self-Monitor',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Jordan is writing a self-monitor note before talking with Theo about overtime. Tap each piece until the note fits Learn to Look.</h1>');
  L.sentence(L.card,[['Under stress I tend to'],['stay calm and fair','get sarcastic and snap'],['so I will watch'],['what I do and its effect on safety','how wrong Theo’s numbers are'],['and if it’s going badly I will'],['step back and slow down','push harder to be heard']],[0,1,0,0,0,0],
   [[],['That’s not Jordan’s known habit. Start with the honest pattern.'],[],['That’s watching content only. Self-monitoring means watching yourself.'],[],['Pushing harder is the violence habit. Step back instead.']],
   'Honest about the habit, watching both behavior and its effect, and ready to step back. That’s a vigilant self-monitor.');}},
{part:3,src:'Chapter 4 · Summary: Learn to Look',pts:1,run(L){
  L.h(L.kick('pr','Put it together')+'<h1 class="q">Mid-meeting, Dr. Alvarez notices Kit has gone silent and their own voice is getting louder. What does Learn to Look say to do first?</h1>');
  L.mc(L.card,['Win the point quickly so the meeting can move on','Ask Kit straight out why they’re being so quiet','Step back: safety is slipping, on both sides'],2,
   'Kit’s silence and Dr. Alvarez’s rising voice are both signs that safety is at risk. Seeing that is the first step; making it safe comes next.',
   'Learn to Look comes first: Kit’s silence and the rising voice are both safety signals. Step out of the content before deciding what to do.');}}
  ]
});
</script>
</body>
</html>
