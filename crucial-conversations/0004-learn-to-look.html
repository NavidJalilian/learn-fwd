<style>
/* lesson-only styles: chat replay, safety lab, silence-violence spectrum */
.ll-chat{display:flex;flex-direction:column;gap:10px;margin:6px 0 12px}
.ll-row{display:flex;gap:8px;align-items:flex-start;animation:in .25s ease}
.ll-row.me{flex-direction:row-reverse}
.ll-av{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:11.5px;font-weight:700}
.ll-b{display:block;text-align:left;background:var(--soft);border:2px solid transparent;border-radius:4px 16px 16px 16px;padding:8px 12px;font-size:15px;line-height:1.45;min-width:0;max-width:calc(100% - 40px);color:var(--ink)}
.ll-row.me .ll-b{border-radius:16px 4px 16px 16px;background:var(--pri-bg)}
button.ll-b{border-color:var(--line);cursor:pointer}
button.ll-b.flag{border-color:var(--no-strong)}
.ll-b.ok{border-color:var(--ok-line)}.ll-b.no{border-color:var(--no-line)}
.ll-who{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:2px}
.ll-cond{display:flex;gap:6px;align-items:flex-start;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line2);font-size:13.5px;line-height:1.4;color:var(--h2);font-style:italic}
.ll-cond svg.i{width:16px;height:16px;margin-top:1px}
.ll-cond.in{color:var(--h3)}.ll-cond.bad{color:var(--no)}
.btn[hidden]{display:none}
.ll-tag{display:flex;width:max-content;max-width:100%;align-items:center;gap:4px;margin-top:6px;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px}
.ll-tag svg.i{width:13px;height:13px}
.ll-ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px}
.ll-read{background:var(--soft);border-radius:14px;padding:12px 14px;font-size:14.5px;line-height:1.5;margin-top:12px}
.ll-read b{font-weight:600}
.ll-read .ll-b{background:var(--card)}
.btn.ll-tog[aria-pressed=true]{border-color:var(--pri);background:var(--pri-bg);color:var(--pri-deep)}
.btn:disabled{opacity:.45;cursor:default}
.ll-tgs{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.ll-tgs .btn{justify-content:flex-start;text-align:left;width:100%}
.ll-lbl{font-size:12.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:12px 0 6px}
.ll-sh{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;font-weight:700;margin:6px 0 2px}
.ll-sh span{display:inline-flex;align-items:center;gap:4px}
.ll-sh svg.i{width:15px;height:15px}
.ll-spec{display:flex;flex-direction:column;gap:6px;margin:6px 0 4px}
.ll-sr{display:grid;grid-template-columns:1fr 4px 1fr;align-items:stretch;width:100%;min-height:42px;padding:0;background:var(--card);border:2px solid var(--line);border-radius:12px;overflow:hidden;color:var(--ink)}
.ll-sr .s{display:flex;align-items:center;gap:5px;padding:0 6px;font-size:13px;white-space:nowrap;font-weight:600;min-width:0}
.ll-sr .l{justify-content:flex-end}.ll-sr .r{justify-content:flex-start}
.ll-sr .mid{background:var(--h2)}
.ll-sr.dl{display:flex;align-items:center;justify-content:center;background:var(--h2-bg);color:var(--h2);font-size:13px;font-weight:700;border-color:var(--h2)}
.ll-sr.seen{border-color:var(--ok-line)}
.ll-sr.sel{border-color:var(--pri);background:var(--pri-bg)}
.ll-sr.ok{border-color:var(--ok-line);background:var(--ok-bg)}.ll-sr.no{border-color:var(--no-line);background:var(--no-bg)}
.ll-bar{display:inline-block;height:14px;border-radius:99px;flex:none;transition:width .25s}
.ll-cnt{display:inline-grid;place-items:center;min-width:16px;height:16px;border-radius:99px;background:var(--soft2);color:var(--muted);font-size:11px;margin-left:3px}
.ll-pr{border-bottom:1px solid var(--line);padding:10px 0}
.ll-pr .t{font-size:14.5px;line-height:1.45;margin-bottom:6px}
.ll-pr .chip{margin-bottom:0;padding:6px 11px;font-size:13.5px}
.ll-pool{display:block;width:100%;height:auto;margin:4px 0}
.ll-pool .lid{transition:transform .35s ease,opacity .35s}
.ll-pool .drop{transition:transform .35s ease}
.ll-meter{height:12px;background:var(--soft2);border-radius:99px;overflow:hidden;margin:6px 0}
.ll-meter div{height:100%;border-radius:99px;transition:width .3s}
</style>

<script>
/* ---------- lesson data and small renderers (used only in this lesson) ---------- */
const PPL={R:['Dr. Alvarez','RA','h4'],T:['Theo','TP','h2'],J:['Jordan','JO','h3'],K:['Kit','KM','h1']};
function bub(L,w,text,o){o=o||{};const p=PPL[w],tag=o.btn?'button':'div';
  return '<div class="ll-row'+(o.me?' me':'')+'"><div class="ll-av" aria-hidden="true" style="background:var(--'+p[2]+'-bg);color:var(--'+p[2]+')">'+p[1]+'</div>'+
   '<'+tag+(o.btn?' type="button"':'')+' class="ll-b'+(o.cls?' '+o.cls:'')+'"'+(o.id?' id="'+o.id+'"':'')+'><span class="ll-who">'+p[0]+(o.me?' (you)':'')+'</span>'+text+
   (o.cond?'<span class="ll-cond'+(o.ck?' '+o.ck:'')+'">'+L.ic(o.ci||'eye')+'<span>'+o.cond+'</span></span>':'')+(o.extra||'')+'</'+tag+'></div>';}
/* the Monday meeting about the December rota: [who, words, condition, form] */
const MEET=[
 ['T','Next item: the December rota. We’re one tech short, so I’ve added two late shifts a week.','Theo reads from their notes and doesn’t look up.',''],
 ['J','Two more? Great. Maybe we should just move in.','Everyone laughs. Jordan doesn’t smile.','Masking'],
 ['T','Ha. Anyway, good news: the coffee machine is fixed!','Theo goes red and turns the page fast.','Avoiding'],
 ['R','Look, every clinic is short-staffed. It’s obvious we cover the gap.','Dr. Alvarez’s voice rises. Kit had just opened their mouth to speak.','Controlling'],
 ['K','Sure. Sounds fine.','Kit stares at their notes, arms crossed.','Masking'],
 ['J','Typical. Management never asks the people doing the work.','Said to the table, not to Theo.','Labeling'],
 ['T','Let’s take this offline. I’ll send an email.','Theo is already gathering their papers.','Withdrawing']];
/* the six forms on the silence-violence spectrum: [name, side, level, definition, who, example, meaning] */
const FORMS=[
 ['Withdrawing',-1,3,'Pulling out of the talk altogether: leaving the conversation or the room.','K','“Sorry, I need to check on a patient.” (Leaves the meeting.)','I can’t stand one more minute of this.'],
 ['Avoiding',-1,2,'Steering clear of the touchy subject. You keep talking, just not about the real issue.','T','Asked about overtime: “Speaking of costs, should we order fewer gloves?”','If we talk about small savings, we won’t have to talk about staffing.'],
 ['Masking',-1,1,'Understating or only half-showing your real view: sarcasm, sugarcoating, hedging.','T','“The new rota is, uh, a really interesting first draft.”','I don’t think it will work, but I won’t say so.'],
 ['Dialogue',0,0,'Meaning flows freely: people say what they really think, with respect, and listen.','J','“I’m worried about overtime. Can we look at the numbers together?”','Exactly what it says.'],
 ['Controlling',1,1,'Forcing your view or dominating the talk: cutting in, overstating, absolutes, steering the subject, loaded questions.','R','“Every clinic in the region is expanding. It’s obvious.”','I’m not sure of the numbers, so I’ll sound certain.'],
 ['Labeling',1,2,'Sticking a label on people or ideas so you can dismiss them without arguing the point.','J','“Typical management. They never get it.”','If Theo is just “management,” I don’t have to explain anything.'],
 ['Attacking',1,3,'Moving from winning the point to making the person suffer: belittling or threatening.','J','“Honestly, Theo, a goldfish could run this rota better.”','I’ll make you feel small so I get my way.']];
function specHead(L){return '<div class="ll-sh"><span style="color:var(--h1)">'+L.ic('lock')+'Silence: holding back</span><span style="color:var(--h4)">Violence: forcing in'+L.ic('flame')+'</span></div>';}
function spec(pre,val,badge,cls){return '<div class="ll-spec">'+FORMS.map((f,k)=>{const extra=cls?cls(k):'';
  if(f[1]===0)return '<button type="button" class="ll-sr dl '+extra+'" id="'+pre+k+'">'+f[0]+(badge?badge(k):'')+'</button>';
  const col=f[1]<0?'h1':'h4',lv=val?val(k):f[2];
  const bar='<span class="ll-bar" style="width:'+Math.round(lv*10)+'px;background:var(--'+col+')"></span>',lab='<span style="color:var(--'+col+')">'+f[0]+(badge?badge(k):'')+'</span>';
  return '<button type="button" class="ll-sr '+extra+'" id="'+pre+k+'" aria-label="'+f[0]+'"><span class="s l">'+(f[1]<0?lab+bar:'')+'</span><span class="mid"></span><span class="s r">'+(f[1]>0?bar+lab:'')+'</span></button>';}).join('')+'</div>';}
/* the safety lab: same words, different safety */
const RJ=['You skipped the checklist again. That’s twice this month.','Can I raise something small? I noticed we didn’t finish the checklist today.','Nice work on Max’s knee today, by the way.'];
const WN=['Blunt','Gentle','A compliment'];
const RR={safe:['Ouch. You’re right, I rushed it. What did we skip?','It’s not small. You’re right. What did we skip?','Thanks, Jordan. That means a lot.'],
 motive:['So now you’re keeping score on me?','“Something small”? Just say what you’re getting at.','Is that a joke? What do you want?'],
 skill:['I’ve done hundreds of these, Jordan. It was fine.','It was fine. I’ve done hundreds of these.','Thanks. I’ve done hundreds of these, you know.']};
function safeLab(L,host,st,onChange){
  host.innerHTML='<div class="ll-lbl">How Jordan words it</div><div id="sw"></div>'+
   '<div class="ll-lbl">What Dr. Alvarez believes about Jordan</div><div class="ll-tgs"><button type="button" class="btn ll-tog" id="t1"></button><button type="button" class="btn ll-tog" id="t2"></button></div>'+
   '<div class="ll-chat" id="sc" aria-live="polite"></div>'+
   '<svg class="ll-pool" viewBox="0 0 300 122" role="img" aria-label="Pool of shared meaning"><ellipse cx="150" cy="86" rx="128" ry="18" fill="var(--h2-bg)" stroke="var(--h2)" stroke-width="2"/>'+
   '<text x="150" y="118" text-anchor="middle" font-size="12" fill="var(--muted)" font-family="Inter,sans-serif">Pool of shared meaning</text>'+
   '<g class="lid" id="lid"><rect x="26" y="60" width="248" height="10" rx="5" fill="var(--line2)"/><text x="28" y="52" font-size="12" font-weight="700" fill="var(--no)" font-family="Inter,sans-serif">Lid on</text></g>'+
   '<g class="drop" id="drop"><circle cx="150" cy="14" r="9" fill="var(--h3)"/><text x="165" y="18" font-size="12" font-weight="600" fill="var(--h3)" font-family="Inter,sans-serif">Jordan’s point</text></g></svg>'+
   '<div class="ll-read" id="sr" aria-live="polite"></div>';
  WN.forEach((n,j)=>{const b=document.createElement('button');b.type='button';b.className='chip';b.id='w'+j;b.textContent=n;b.onclick=()=>{if(lab.locked)return;st.w=j;draw();onChange&&onChange(st);};L.$('#sw').appendChild(b);});
  L.$('#t1').onclick=()=>{if(lab.locked)return;st.t1=!st.t1;draw();onChange&&onChange(st);};
  L.$('#t2').onclick=()=>{if(lab.locked)return;st.t2=!st.t2;draw();onChange&&onChange(st);};
  function draw(){
    WN.forEach((n,j)=>L.$('#w'+j).classList.toggle('sel',st.w===j));
    [['t1','Trusts Jordan has their best interests at heart'],['t2','Respects Jordan’s judgment']].forEach(([id,t])=>{const b=L.$('#'+id),on=st[id];b.setAttribute('aria-pressed',on);b.innerHTML=L.ic(on?'check':'x')+'<span>'+t+'</span>';b.disabled=!!lab.locked;});
    const k=st.t1&&st.t2?'safe':!st.t1?'motive':'skill',safe=k==='safe';
    L.$('#sc').innerHTML=bub(L,'J',RJ[st.w])+bub(L,'R',RR[k][st.w],{extra:'<span class="ll-tag" style="background:var(--'+(safe?'ok':'no')+'-bg);color:var(--'+(safe?'ok':'no')+')">'+L.ic(safe?'check':'shield')+(safe?'Listens':'Defends')+'</span>'});
    L.$('#lid').style.transform=safe?'translateX(-300px)':'none';L.$('#lid').style.opacity=safe?0:1;
    L.$('#drop').style.transform=safe?'translateY(72px)':'translateY(36px)';
    L.$('#sr').innerHTML=safe?'<b style="color:var(--ok)">Feels safe.</b> Dr. Alvarez trusts Jordan’s motives and respects their judgment, so the point gets into the pool, even if it stings.':
      k==='motive'?'<b style="color:var(--no)">Not safe.</b> Dr. Alvarez doubts Jordan’s motives, so the words are heard as an attack. The point bounces off the lid.':
      '<b style="color:var(--no)">Not safe.</b> Dr. Alvarez believes Jordan means well but doesn’t respect their judgment. The point still bounces off.';}
  const lab={locked:false,draw,lock(v){lab.locked=v;draw();}};draw();return lab;}

Course.lesson({
  id:'0004', title:'Learn to look', minutes:20, icon:'eye',
  goals:['Watch how a talk is going (the conditions), not just what it’s about','Catch the moment a talk turns crucial, and read silence and violence as signs that people feel unsafe','Name the six forms of silence and violence, including your own'],
  parts:['Content and conditions','Spot the turn','Silence and violence','Watch yourself'],
  read:'Read chapter 4 of the book and take its full Style Under Stress test. It also scores your dialogue skills, so you can see which later chapters will help you most.',
  glossary:{
   'start-heart':'Start with Heart: the first dialogue principle. Begin a tough talk with the right motives, and keep them, no matter what happens.',
   'dual-processing':'Dual-processing: watching two things at once in a tough talk: the content (what you’re discussing) and the conditions (how people are acting and feeling).',
   'style-stress':'Style Under Stress: your own usual mix of silence and violence habits when a talk gets tough. The book has a self-test for it.',
   'self-monitor':'Vigilant self-monitor: someone who keeps watching what they are doing in a talk, and the effect it has on safety, and changes course if needed.'
  },
  cheatsheet:[
   'Watch <b>content</b> (what we’re discussing) <b>and conditions</b> (how people are acting). That’s dual-processing.',
   'Catch the <b>turn</b> early. The sooner you notice you’ve left dialogue, the easier and cheaper it is to get back.',
   'Know your first cue: <b>body</b>, <b>emotions</b> or <b>behavior</b>. Treat it as a signal to step back, slow down and Start with Heart.',
   'People rarely get defensive because of <i>what</i> you say. They get defensive when they don’t feel <b>safe</b>. Better wording can’t fix an unsafe talk.',
   '<b>Silence</b> (holding back) = masking, avoiding, withdrawing. <b>Violence</b> (forcing in) = controlling, labeling, attacking.',
   'Read silence and violence as a <b>sign of fear</b>, not an attack. Be curious, not angry or frightened.',
   'Know your own <b>Style Under Stress</b>. Most people switch between both sides. It’s behavior, so it can change.'
  ],
  steps:[
/* ---------- PART 1: CONTENT AND CONDITIONS ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">In a heated staff meeting, who is more likely to notice that half the room has gone quiet?</h1>');
  L.mc(L.card,['The person arguing their point the hardest','Someone paying attention to the room'],1,
   'The harder you argue, the more the topic swallows your attention. This lesson is about seeing the room while you talk.',
   'When you’re caught up in arguing, the topic swallows your attention. Someone watching the room sees much more.');}},
{part:0,src:'Chapter 4 · How to Notice When Safety Is at Risk',run(L){
  L.h(L.kick('ex','A story from the book, retold')+'<h1 class="q">The meeting you were in, but didn’t see</h1>');
  L.beats(L.card,[
   ['The meeting','You lead a talk with your team about product timelines. It slides into an hour of bickering, and everyone leaves annoyed.'],
   ['The blank','Walking down the hall, you can’t work out what happened. You remember pushing your view a bit too hard, and people staring at you.'],
   ['The replay','Two coworkers walking the other way replay it in detail: the boss pushed, everyone got defensive, and one of them admits overstating their own case too.'],
   ['The difference','Later a friend explains: you cared so much about the <b>content</b> that you were blind to the <b>conditions</b>, meaning how people were feeling and acting.']],
   'You were in the room the whole time and still missed what happened. Seeing it is a skill: you have to know what to look for. Try it next.');}},
{part:0,src:'Chapter 4 · Watch for Conditions',
 solve:async L=>{for(let k=0;k<8;k++){const n=L.$('#nx');if(n&&!n.disabled)n.click();}L.$('#lens').click();},
 run(L){
  let shown=1,lens=false,fin=false;
  L.h(L.kick('ex','Replay the meeting')+'<h1 class="q">Monday’s team meeting at Maplewood. Step through it, then switch on the conditions lens.</h1>'+
   '<button type="button" class="btn ll-tog" id="lens" aria-pressed="false"></button>'+
   '<div class="ll-chat" id="ch" aria-live="polite" style="margin-top:12px"></div>'+
   '<div class="ll-ctl"><button type="button" class="btn pri" id="nx">'+L.ic('play')+'Next line</button><span class="small" id="cnt"></span></div>'+
   '<div class="ll-read" id="rd"></div>');
  function draw(){
    L.$('#lens').setAttribute('aria-pressed',lens);L.$('#lens').innerHTML=L.ic('eye')+'Conditions lens: <b>'+(lens?'on':'off')+'</b>';
    L.$('#ch').innerHTML=MEET.slice(0,shown).map(m=>bub(L,m[0],m[1],{cond:lens?m[2]:''})).join('');
    L.$('#cnt').textContent='Line '+shown+' of '+MEET.length;L.$('#nx').disabled=shown>=MEET.length;
    const seen=MEET.slice(0,shown).filter(m=>m[3]).length;
    L.$('#rd').innerHTML='<b>Content:</b> the December rota, two extra late shifts'+(shown>=3?', the coffee machine':'')+(shown>=7?', an email to follow':'')+'.<br>'+
     '<b>Conditions:</b> '+(lens?'<span style="color:var(--h2)">'+seen+' of '+shown+' lines show someone holding back or pushing.</span>':'<span style="color:var(--muted)">hidden. You’re only hearing the words.</span>');
    if(!fin&&lens&&shown>=MEET.length){fin=true;L.sheet('info','Same meeting, two views','Words only, it reads like a quick agreement: rota set, email to follow. With the lens on you see <i>why</i> nothing got settled: a joke with no smile, a red face, a raised voice, crossed arms, papers being gathered. Nobody said what they really thought.');L.done();}}
  L.$('#lens').onclick=()=>{lens=!lens;draw();};L.$('#nx').onclick=()=>{if(shown<MEET.length)shown++;draw();};draw();}},
{part:0,src:'Chapter 4 · Watch for Conditions',run(L){
  L.h(L.kick('learn','Content and conditions')+'<h1 class="q">Watch the topic and the people at the same time</h1>'+
   L.lanes([['chat','Content','The topic: the rota, the overtime, the second clinic. <i>What</i> is being said.',1],
            ['eye','Conditions','How people respond: tone, faces, who pushes, who goes quiet. <i>Why</i> the talk is going the way it is.',2]])+
   L.prose('Watching both at once is called '+L.g('dual-processing','dual-processing')+'. It’s hard when stakes and emotions run high. The book compares it to a first fly-fishing trip: you can’t see the trout the expert points at, because you don’t know what to look for.')+
   L.note('Think of it as social first aid. The sooner you notice you’re not in '+L.g('dialogue','dialogue')+', the easier it is to get back and the less it costs.','alert'));
  L.done();}},
{part:0,src:'Chapter 4 · Watch for Conditions',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Content or condition?',['Content','Condition'],[
   ['Techs averaged 8 hours of overtime a week last month.',0,'That’s a fact about the topic.'],
   ['Jordan’s voice has gone flat and short.',1,'A change in how someone is speaking is a condition.'],
   ['Dr. Alvarez is talking over everyone else.',1,'How someone is behaving in the talk is a condition.'],
   ['The new rota adds a Saturday shift.',0,'That’s part of what is being discussed.'],
   ['Theo keeps steering back to the budget whenever stress comes up.',1,'Changing the subject is a sign of how Theo is handling the talk.']]);}},

/* ---------- PART 2: SPOT THE TURN ---------- */
{part:1,src:'Chapter 4 · Learn to Spot Crucial Conversations',run(L){
  L.h(L.kick('learn','What to look for')+'<h1 class="q">Three things to watch, starting with the turn</h1>'+
   L.flow([['alert','The turn','When a talk becomes crucial','',1],['shield','Safety','Signs of silence or violence','',2],['person','You','Your own Style Under Stress','',3]])+
   L.prose('A routine chat can turn crucial in seconds. Catch that moment, or notice you’re about to walk into a tough talk, before you get pulled into games. People first notice it in different ways:')+
   L.tiers([['flame','Body','A tight stomach, dry eyes. Everyone’s signs differ.'],
            ['bulb','Emotions','You notice you’re scared, hurt or angry, and starting to act on it or bottle it up.'],
            ['eye','Behavior','You catch yourself raising your voice, pointing a finger or going very quiet. Only then do you realize how you feel.']])+
   L.note('Whatever your first cue, treat it as a signal to <b>step back, slow down and '+L.g('start-heart','Start with Heart')+'</b>.','compass'));
  L.done();}},
{part:1,src:'Chapter 4 · Learn to Spot Crucial Conversations',pts:1,
 solve:async L=>{for(let k=0;k<3;k++)L.$('#nx').click();L.$('#spot').click();},
 run(L){
  const S=[
   ['R','Morning! Who’s first?','',0],
   ['J','Max, the lab with the knee repair. He’s prepped.','',0],
   ['R','Good. We’re forty minutes behind, so let’s keep moving.','You feel a little rushed. Busy day, nothing new.',0],
   ['R','Let’s skip the rest of the checklist. I checked his bloods yesterday.','Your jaw locks. It’s the second time this month.',1],
   ['J','…Okay.','A flash of anger, then fear for Max. You’re staring at the tray.',2],
   ['R','Jordan? Clamp, please.','Your hands are unsteady. You still say nothing.',3],
   ['J','(Hands over the clamp in silence.)','The surgery goes ahead. The moment to speak has passed.',5],
   ['J','Later, to Theo: “Unbelievable. Rules are for other people, apparently.”','Now it’s a grudge, told to someone who can’t fix it.',7],
   ['T','Want me to send everyone a reminder email about checklists?','Still nobody has said a word to Dr. Alvarez.',9]];
  const TURN=3,WORD=c=>c===0?'nothing to fix':c<=2?'one calm sentence':c<=5?'an awkward talk to reopen':'a grudge to undo';
  let shown=1,called=-1;
  L.h(L.kick('pr','Catch the turn')+'<h1 class="q">You’re Jordan, in surgery prep with Dr. Alvarez. Tap <i>It just turned crucial</i> the moment you notice.</h1>'+
   '<div class="ll-chat" id="ch" aria-live="polite"></div>'+
   '<div class="ll-ctl"><button type="button" class="btn" id="nx">'+L.ic('play')+'Next line</button><button type="button" class="btn pri" id="spot">'+L.ic('alert')+'It just turned crucial</button></div>'+
   '<div class="ll-read" id="cost"><b>Cost to get back to dialogue:</b> <span style="color:var(--muted)">revealed after you call it.</span></div><div id="chart"></div>');
  function draw(){L.$('#ch').innerHTML=S.slice(0,shown).map((s,k)=>bub(L,s[0],s[1],{me:s[0]==='J',cond:s[2],ck:s[0]==='J'||s[0]==='R'?'in':'',ci:'person',cls:k===called?'flag':''})).join('');}
  function finish(at){if(called>=0)return;called=at;shown=S.length;draw();L.$('#nx').hidden=true;L.$('#spot').hidden=true;const ch=L.$('#ch');ch.parentNode.insertBefore(L.$('#cost'),ch);ch.parentNode.insertBefore(L.$('#chart'),ch);
    const ok=at===TURN||at===TURN+1;L.award(ok);
    const c=at<S.length?S[at][3]:10;
    L.$('#cost').innerHTML='<b>Cost to get back to dialogue:</b> '+(at<S.length?'at line '+(at+1)+', '+WORD(c):'you never called it, so it’s still unsaid')+'.';
    let g='<svg viewBox="0 0 300 128" class="ll-pool" role="img" aria-label="Cost to get back rises with every line after the turn">';
    S.forEach((s,k)=>{const x=10+k*32,h=s[3]*9,y=100-h,col=k===at?'var(--pri)':k>=TURN?'var(--h3)':'var(--line2)';
      g+='<rect x="'+x+'" y="'+(h?y:97)+'" width="24" height="'+(h||3)+'" rx="4" fill="'+col+'"/><text x="'+(x+12)+'" y="116" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="Inter,sans-serif">'+(k+1)+'</text>';
      if(k===at)g+='<text x="'+(x+12)+'" y="'+((h?y:97)-6)+'" text-anchor="middle" font-size="11" font-weight="700" fill="var(--pri)" font-family="Inter,sans-serif">You</text>';
      else if(k===TURN)g+='<text x="'+(x+12)+'" y="'+(y-6)+'" text-anchor="middle" font-size="11" font-weight="700" fill="var(--h3)" font-family="Inter,sans-serif">Turn</text>';});
    g+='<text x="10" y="12" font-size="11" fill="var(--muted)" font-family="Inter,sans-serif">Cost to get back, by line (gold = after the turn)</text></svg>';
    L.$('#chart').innerHTML=g;
    const why='Line 4 is the turn: Max’s safety is at stake, you and Dr. Alvarez disagree, and feelings jump. Your cues were all there: a locked jaw (body), anger and fear (emotions), staring at the tray (behavior).';
    if(ok)L.sheet('ok',at===TURN?'Right on time':'Early enough',why+' Caught here, one calm sentence before the first cut would do it. Look at the chart: every line you wait, the way back costs more.');
    else if(at<TURN)L.sheet('no','Too soon',
      'Running late is ordinary pressure, not yet a crucial conversation. '+why+' Look at the chart: from there, every line you wait costs more.');
    else L.sheet('no','Late',why+' By line '+Math.min(at+1,S.length)+', the moment has passed and it’s turning into a grudge. Look at the chart: every line you wait, the way back costs more.');
    L.done();}
  L.$('#nx').onclick=()=>{if(called>=0)return;if(shown<S.length){shown++;draw();}else finish(S.length);};
  L.$('#spot').onclick=()=>finish(shown-1);draw();}},
{part:1,src:'Chapter 4 · Learn to Spot Crucial Conversations',pts:5,run(L){
  L.h(L.kick('pr','Sort the cues')+'<h1 class="q">Each person noticed the turn a different way. Which kind of cue was it?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Body','Emotion','Behavior'],[
   ['Theo’s stomach tightens when Jordan walks in with the overtime log.',0,'A physical change is a body cue.'],
   ['Dr. Alvarez hears themselves say “obviously” for the third time.',2,'Catching your own words is a behavioral cue.'],
   ['Kit realizes they feel small and a bit scared.',1,'Naming a feeling is an emotional cue.'],
   ['Jordan sees they’ve crossed their arms and turned away.',2,'Noticing your own actions is a behavioral cue.'],
   ['Theo feels hurt that nobody thanked them for the new rota.',1,'Hurt is an emotion.']],
   'Any of the three works. What matters is knowing <i>your</i> first cue, so you can step back early.');}},

/* ---------- PART 3: SILENCE AND VIOLENCE ---------- */
{part:2,src:'Chapter 4 · Learn to Look for Safety Problems',run(L){
  L.h(L.kick('learn','Look for safety problems')+'<h1 class="q">Fear is what stops the flow</h1>'+
   L.quote('When it’s safe, you can say anything.','Chapter 4')+
   L.prose('Dialogue needs meaning to flow freely, and nothing blocks it like fear. Fear that your ideas won’t land makes you push. Fear of being hurt makes you hide.')+
   L.lanes([['flame','Fight','Forcing meaning <b>into</b> the pool: '+L.g('violence','violence')+'.',4],['lock','Flight','Holding meaning <b>back</b> from the pool: '+L.g('silence','silence')+'.',1]])+
   L.note('Both come from the same feeling. So the book makes a bold claim: people rarely get defensive at <i>what</i> you say. They get defensive when they stop feeling '+L.g('safety','safe')+'. Test that claim next.','shield'));
  L.done();}},
{part:2,src:'Chapter 4 · Learn to Look for Safety Problems',pts:1,
 solve:async L=>{L.$('#p1').click();L.$('#w0').click();L.$('#t1').click();L.$('#t2').click();},
 run(L){
  const st={w:0,t1:false,t2:false};let picked=false,fin=false;
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">Jordan raised the checklist bluntly and Dr. Alvarez got defensive. Jordan blames the wording. If Jordan says it gently, with nothing else changed, what happens?</h1>'+
   '<div id="pq"><button type="button" class="chip" id="p0">Dr. Alvarez listens</button><button type="button" class="chip" id="p1">Dr. Alvarez still defends</button></div><div id="pf"></div><div id="lab"></div>');
  const lab=safeLab(L,L.$('#lab'),st,s=>{if(picked&&!fin&&s.t1&&s.t2&&s.w===0){fin=true;
    L.sheet(ok?'ok':'no',ok?'You called it':'Not quite','Gentle words alone changed nothing. But with the same <i>blunt</i> words, Dr. Alvarez listened once they trusted Jordan’s motives and respected their judgment. The words weren’t the problem; the safety was.');L.done();}});
  lab.lock(true);let ok=false;
  ['p0','p1'].forEach((id,j)=>L.$('#'+id).onclick=()=>{if(picked)return;picked=true;ok=j===1;L.award(ok);
    L.$('#'+id).classList.add(ok?'ok':'no');if(!ok)L.$('#p1').classList.add('ok');
    st.w=1;lab.lock(false);
    L.fb(L.$('#pf'),(ok?'<b>Right.</b> The':'<b>Watch:</b> the')+' gentle version still bounces off. Now try the real lever: set the wording back to <b>Blunt</b> and switch on <b>both</b> beliefs.',ok?'info':'no');});}},
{part:2,src:'Chapter 4 · Learn to Look for Safety Problems',
 solve:async L=>{L.$('#pe0').click();L.$('#pe1').click();L.$('#pe2').click();},
 run(L){
  const st={w:1,t1:false,t2:false},seen=new Set();
  const PE=[['Kind words, no trust',{w:2,t1:false,t2:false},'Even a compliment gets read as a trick. When it isn’t safe, well-meant words are suspect: it’s as if the pool has a lid on it.'],
            ['Hard words, full trust',{w:0,t1:true,t2:true},'Dr. Alvarez doesn’t enjoy it, but takes it in. Think of tough feedback you once took well: you trusted the person’s motives and respected their view.'],
            ['Trust without respect',{w:1,t1:true,t2:false},'Good intentions aren’t enough on their own. If Dr. Alvarez doubts Jordan knows what they’re talking about, the point still bounces off.']];
  L.h(L.kick('pr','Find the limits')+'<h1 class="q">Push the safety lab to its extremes. Try all three cases.</h1>'+
   '<div id="pe"></div><div id="pn"></div><div id="lab"></div>');
  const lab=safeLab(L,L.$('#lab'),st);
  PE.forEach((p,j)=>{const b=document.createElement('button');b.type='button';b.className='chip';b.id='pe'+j;b.textContent=p[0];
    b.onclick=()=>{Object.assign(st,p[1]);lab.draw();seen.add(j);[...L.$('#pe').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');b.textContent=p[0]+' ✓';
      L.$('#pn').innerHTML='';L.fb(L.$('#pn'),'<b>'+p[0]+'.</b> '+p[2],'info');
      if(seen.size===3&&!L.$('#pe').dataset.done){L.$('#pe').dataset.done=1;L.sheet('info','Where wording stops helping','Wording can’t rescue a talk that isn’t safe, and harsh truths can land when it is. Safety lives in what the other person believes about you. Your first job is to <i>see</i> when it’s slipping; the next lesson shows how to restore it.');L.done();}};
    L.$('#pe').appendChild(b);});}},
{part:2,src:'Chapter 4 · Don’t Let Safety Problems Lead You Astray',run(L){
  L.h(L.kick('learn','Don’t take the bait')+'<h1 class="q">Silence and violence are signs of fear</h1>'+
   L.prose('People who feel unsafe act in annoying ways: they mock you, insult you or bury you in arguments. The natural reaction is to treat it as an attack and hit back, or escape. Then you’re part of the problem.')+
   L.flow([['alert','They jab','A sarcastic jab or a sudden silence','',4],['eye','Recode it','“That’s a sign they don’t feel safe.”','',2],['shield','Respond','Be curious, then make it safer','',1]])+
   L.note('The book calls this the pivot point for everything that follows. It helps you too: when emotions narrow your vision, giving your brain a new job (look for safety problems) keeps your thinking switched on.','bulb'));
  L.done();}},
{part:2,src:'Chapter 4 · Don’t Let Safety Problems Lead You Astray',pts:1,
 solve:async L=>{L.$('#ba0').click();L.$('#ba1').click();},
 run(L){
  const BR=[['x','Theo takes it as an attack',bub(L,'T','If it’s that bad here, nobody’s stopping you.',{cond:'Theo hits back. Jordan folds their arms and says nothing more.',ck:'bad'}),15,'The overtime problem stays buried. Both leave sure the other is the problem.'],
            ['eye','Theo reads it as a sign',bub(L,'T','Sounds like the late shifts are really wearing on the techs. I want to hear about it properly.',{cond:'Theo thinks first: “That’s sarcasm. Jordan doesn’t feel safe saying this straight.”',ck:'in',ci:'person'})+bub(L,'J','Honestly? It’s a lot. Can we talk after?'),70,'The real issue is on the table, and Theo stayed curious instead of angry.']];
  const seen=new Set();
  L.h(L.kick('pr','Toggle and compare')+'<h1 class="q">Back to Monday’s meeting. Jordan’s joke stings Theo. Try both ways Theo could see it.</h1>'+
   '<div class="ll-chat">'+bub(L,'T',MEET[0][1])+bub(L,'J',MEET[1][1],{cond:MEET[1][2]})+'</div>'+
   '<div id="bz"></div><div id="bo" aria-live="polite"><p class="small">Pick a reaction above to play it out.</p></div><div id="bq"></div>');
  BR.forEach((r,j)=>{const b=document.createElement('button');b.type='button';b.className='chip';b.id='ba'+j;b.innerHTML=L.ic(r[0])+r[1];
    b.onclick=()=>{[...L.$('#bz').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(j);
      L.$('#bo').innerHTML='<div class="ll-chat">'+r[2]+'</div><div class="small"><b>Shared meaning in the pool:</b> '+r[3]+'%</div><div class="ll-meter"><div style="width:'+r[3]+'%;background:var(--'+(j?'ok-strong':'no-strong')+')"></div></div><p class="small" style="margin:4px 0 0">'+r[4]+'</p>';
      if(seen.size===2&&!L.$('#bq').innerHTML){const q=L.$('#bq');q.innerHTML='<h2 class="sub">So what is Jordan’s joke, seen with the book’s eyes?</h2>';
        L.mc(q,['Proof that Jordan is just a negative person','A sign Jordan doesn’t feel safe speaking plainly'],1,
         'It’s masking: sarcasm instead of the real concern. Read it as fear and you stay curious instead of hitting back.',
         'That’s the bait. The joke is masking, a form of silence, which signals Jordan doesn’t feel safe saying it straight.');}};
    L.$('#bz').appendChild(b);});}},
{part:2,src:'Chapter 4 · Silence and Violence',
 solve:async L=>{for(let k=0;k<7;k++)L.$('#fs'+k).click();},
 run(L){
  const seen=new Set();let cur=-1,fin=false;
  L.h(L.kick('learn','Six forms to recognize')+'<h1 class="q">Tap each form on the spectrum to see it at Maplewood</h1>'+
   L.prose('Silence holds meaning <b>back</b> from the pool. Violence forces meaning <b>into</b> it. Each side runs from subtle games to open moves.')+
   '<div id="sp"></div><div id="fd" aria-live="polite"></div>');
  function draw(){L.$('#sp').innerHTML=specHead(L)+spec('fs',null,null,k=>(k===cur?'sel ':'')+(seen.has(k)&&k!==3?'seen':''));
    FORMS.forEach((f,k)=>L.$('#fs'+k).onclick=()=>{cur=k;seen.add(k);draw();show(k);});}
  function show(k){const f=FORMS[k],col=f[1]<0?'h1':f[1]>0?'h4':'h2';
    L.$('#fd').innerHTML='<div class="ll-read"><b style="color:var(--'+col+')">'+f[0]+(f[1]?' · '+(f[1]<0?'silence':'violence'):'')+'</b><br>'+f[3]+'<div class="ll-chat" style="margin:10px 0 6px">'+bub(L,f[4],f[5])+'</div><span class="small"><b>Meaning underneath:</b> '+f[6]+'</span></div>';
    const n=[...seen].filter(x=>x!==3).length;
    if(!fin&&n===6){fin=true;L.sheet('info','All six','Knowing the forms is like knowing what a trout looks like underwater: you spot safety problems as they start, while they’re still cheap to fix.');L.done();}}
  draw();}},
{part:2,src:'Chapter 4 · Silence and Violence',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Asked about the overtime numbers, Theo starts talking about the holiday party instead. Which form is that?</h1>');
  L.mc(L.card,['Withdrawing','Avoiding','Masking'],1,
   'Theo stays in the talk but steers around the real issue.',
   'Theo hasn’t left, and isn’t disguising a view with sarcasm. Steering away from the topic while still talking is <b>avoiding</b>.');}},
{part:2,src:'Chapter 4 · Silence and Violence',pts:7,
 solve:async L=>{const A=[4,0,6,3,2,5,1];for(let k=0;k<A.length;k++){L.$('#ps'+A[k]).click();await L.sleep(5);const g=document.getElementById('go');if(k<A.length-1)g.click();await L.sleep(5);}},
 run(L){
  const C=[
   ['R','(Cuts Kit off mid-sentence.) “Let me stop you there.”',4,'Cutting people off to dominate the talk is controlling.'],
   ['K','(Stops replying to Theo’s messages about the late records.)',0,'Pulling out of the conversation altogether is withdrawing.'],
   ['J','“Push that rota through and see what happens.”',6,'A vague threat is attacking: the goal has moved from winning to making someone suffer.'],
   ['J','“I’m worried about the checklist. Can we talk before the next surgery?”',3,'Direct and respectful. A tense topic isn’t silence or violence by itself; this is dialogue.'],
   ['T','(About Jordan’s plan, while planning to ignore it.) “Wow, that’s really brave.”',2,'Faint praise that hides a real view is masking.'],
   ['R','“Techs always complain about change.”',5,'Lumping people into a category to dismiss them is labeling.'],
   ['J','(Asked about the skipped checklist, chats about the new X-ray software.)',1,'Still talking, but steering around the real issue: avoiding.']];
  const cnt=FORMS.map(()=>0);let k=0,locked=false,mark={};
  L.h(L.kick('pr','Map the meeting')+'<h1 class="q">Place each line on the spectrum. Tap the row where it belongs.</h1><div id="cl"></div><div id="sp"></div>');
  function draw(){L.$('#cl').innerHTML='<p class="small" style="margin:0 0 4px">Line '+(k+1)+' of '+C.length+'</p><div class="ll-chat">'+bub(L,C[k][0],C[k][1])+'</div>';
    L.$('#sp').innerHTML=specHead(L)+spec('ps',null,j=>cnt[j]?' <span class="ll-cnt">'+cnt[j]+'</span>':'',j=>mark[j]||'');
    FORMS.forEach((f,j)=>L.$('#ps'+j).onclick=()=>pick(j));}
  function pick(j){if(locked)return;locked=true;const r=C[k][2],ok=j===r;cnt[r]++;mark={};mark[j]=ok?'ok':'no';if(!ok)mark[r]='ok';draw();L.award(ok);
    const last=k===C.length-1;
    L.sheet(ok?'ok':'no',ok?FORMS[r][0]:'It’s '+FORMS[r][0].toLowerCase(),C[k][3]+(last?' <b>Map complete.</b>':''),last?null:{label:'Next line',fn:()=>{k++;locked=false;mark={};L.clearSheet();draw();}});
    if(last)L.done();}
  draw();}},

/* ---------- PART 4: WATCH YOURSELF ---------- */
{part:3,src:'Chapter 4 · Look for Your Style Under Stress',
 solve:async L=>{for(let k=0;k<4;k++)L.$('#mr'+k).click();},
 run(L){
  const M=[['T','Before we lock the rota, can we hear from Kit?'],
   ['R','“Let’s not overthink it. It’s obvious we cover the gap.”','I’m being clear and decisive.','Talked over Kit. “Obvious” closed the debate.'],
   ['K','I just wondered if—'],
   ['R','“Kit, the short version, please.”','I’m saving everyone time.','Cut Kit off mid-sentence. Kit stops talking.'],
   ['T','Rosa, you seem upset.'],
   ['R','“I’m not upset! I’m being efficient!”','I’m perfectly calm.','Red face, raised voice, hand flat on the table.'],
   ['T','After the meeting: Everything okay?'],
   ['R','“Fine. Nothing’s wrong.”','I’ve moved on.','Short answer, eyes on the floor, office door closed.']];
  const fl=new Set();let fin=false;
  L.h(L.kick('learn','The hardest thing to watch')+'<h1 class="q">You’re on the wrong side of your own eyeballs</h1>'+
   L.prose('Dr. Alvarez’s lines show what it feels like <i>from inside</i>. Tap each one to see what the room saw.')+
   '<div class="ll-chat" id="mc"></div><div class="ll-read" id="mrd"></div>');
  function draw(){let r=0;L.$('#mc').innerHTML=M.map(m=>{if(m.length<3)return bub(L,m[0],m[1]);const id=r++,on=fl.has(id);
      return bub(L,'R',m[1],{btn:true,id:'mr'+id,cls:on?'no':'',cond:on?'<b>The room saw:</b> '+m[3]:'<b>From inside:</b> '+m[2]+' <span style="font-style:normal;color:var(--muted)">(tap)</span>',ck:on?'bad':'in',ci:on?'eye':'person'});}).join('');
    for(let j=0;j<4;j++)L.$('#mr'+j).onclick=()=>{fl.add(j);draw();};
    L.$('#mrd').innerHTML='<b>Effect on safety seen so far:</b> '+(fl.size?'<span style="color:var(--no)">'+'▼'.repeat(fl.size)+' down '+fl.size+' of 4 times</span>':'<span style="color:var(--muted)">nothing yet: from inside, it all feels fine.</span>');
    if(!fin&&fl.size===4){fin=true;L.sheet('info','Inside versus outside','From inside, every line felt reasonable, even “I’m not upset!” shouted at the table. Caught up in a cause, we bully, interrupt or sulk without seeing it. The fix is to become a '+L.g('self-monitor','vigilant self-monitor')+': watch what you’re doing and its effect on safety, and change course when it’s hurting.');L.done();}}
  draw();}},
{part:3,src:'Chapter 4 · Your Style Under Stress Test',run(L){
  L.h(L.kick('ex','At Maplewood')+'<h1 class="q">Dr. Alvarez looks at their own Style Under Stress</h1>');
  L.beats(L.card,[
   ['The test','After that meeting, Dr. Alvarez takes the book’s '+L.g('style-stress','Style Under Stress')+' test, thinking about one relationship: tough talks with their staff.'],
   ['The result','High on <b>controlling</b>: absolutes, cutting people off. But also high on <b>withdrawing</b>: “Nothing’s wrong,” then the office door closes.'],
   ['The surprise','Both sides? The book says that’s normal, and human. Most people switch between holding back and pushing too hard.'],
   ['The meaning','The score measures behavior, not a fixed trait. Behavior can change with practice.'],
   ['The plan','Before the next meeting, Dr. Alvarez writes down what to watch for: “obviously,” interrupting, and the closed door.']],
   'Knowing your own habits tells you exactly what to watch for when a talk turns tough.');}},
{part:3,src:'Chapter 4 · What Your Score Means',
 solve:async L=>{const v=[1,0,1,2,0,0];v.forEach((x,k)=>L.$('#rt'+k+'_'+x).click());},
 run(L){
  const R=[[2,'I hint, joke or sugarcoat instead of saying what I think.'],[1,'I keep talking, but steer clear of the real issue.'],[0,'I find a reason to leave, or stop replying.'],
           [4,'I push hard: talk over people, overstate, say “obviously.”'],[5,'I dismiss people with a label (“typical manager”).'],[6,'I get personal: belittle, or hint at threats.']];
  const val=R.map(()=>null),LV=['Rarely','Sometimes','Often'];let fin=false;
  L.h(L.kick('pr','Sketch your own')+'<h1 class="q">Pick one person you have tough talks with. When it gets tense with them, how often do you…</h1>'+
   '<div id="rows"></div><div class="ll-lbl">Your sketch on the spectrum</div><div id="pf"></div><div class="ll-read" id="prd"></div>'+
   '<p class="small">A quick sketch, not the book’s full test. Nothing you tap is saved or sent.</p>');
  L.$('#rows').innerHTML=R.map((r,k)=>'<div class="ll-pr"><div class="t"><b style="color:var(--'+(k<3?'h1':'h4')+')">'+FORMS[r[0]][0]+'.</b> '+r[1]+'</div><div role="group" aria-label="'+FORMS[r[0]][0]+'">'+LV.map((l,j)=>'<button type="button" class="chip" id="rt'+k+'_'+j+'">'+l+'</button>').join('')+'</div></div>').join('');
  R.forEach((r,k)=>LV.forEach((l,j)=>L.$('#rt'+k+'_'+j).onclick=()=>{val[k]=j;LV.forEach((x,q)=>L.$('#rt'+k+'_'+q).classList.toggle('sel',q===j));draw();}));
  function draw(){const byForm={};R.forEach((r,k)=>byForm[r[0]]=val[k]);
    L.$('#pf').innerHTML=specHead(L)+spec('pv',j=>byForm[j]==null?0:byForm[j]*1.5);
    const s=(val[0]||0)+(val[1]||0)+(val[2]||0),v=(val[3]||0)+(val[4]||0)+(val[5]||0),n=val.filter(x=>x!==null).length;
    const top=R.map((r,k)=>[FORMS[r[0]][0].toLowerCase(),val[k]||0]).filter(x=>x[1]===2).map(x=>x[0]);
    let msg;if(n<6)msg='Rated '+n+' of 6. Silence '+s+' · Violence '+v+'.';
    else if(s&&v)msg='<b>Both sides</b> (silence '+s+', violence '+v+'). That’s human: most people switch between holding back and pushing too hard.';
    else if(s)msg='<b>You lean to silence</b> (silence '+s+', violence 0). Your risk is that meaning never reaches the pool.';
    else if(v)msg='<b>You lean to violence</b> (silence 0, violence '+v+'). Your risk is that others stop adding to the pool.';
    else msg='<b>All “rarely”?</b> Maybe. Or maybe you’re on the wrong side of your eyeballs. Ask someone who knows you well how you come across.';
    if(n===6&&(s||v))msg+='<br><b>Your watch list:</b> '+(top.length?top.join(', '):R.map((r,k)=>[FORMS[r[0]][0].toLowerCase(),val[k]]).filter(x=>x[1]===1).map(x=>x[0]).join(', '))+'.';
    L.$('#prd').innerHTML=msg;
    if(!fin&&n===6){fin=true;L.sheet('info','Your Style Under Stress, sketched','This shows behavior, not who you are, and behavior can change. Walking into a touchy talk with this person, make a special effort to catch the habits on your watch list.');L.done();}}
  draw();}},
{part:3,src:'Chapter 4 · What Your Score Means',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Theo’s Style Under Stress shows high masking and avoiding. What does that tell Theo?</h1>');
  L.mc(L.card,['Theo is simply a quiet type and can’t change','Which habits to watch for and work on','Theo should avoid tough talks altogether'],1,
   'The score is a measure of behavior, so it points to what Theo can watch for and practice.',
   'The book is clear that the score measures behavior, not a fixed trait. It shows Theo which habits to watch and which skills to practice.');}},
{part:3,src:'Chapter 4 · Become a Vigilant Self-Monitor',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Jordan is writing a self-monitor note before talking with Theo about overtime. Tap each piece until the note fits Learn to Look.</h1>');
  L.sentence(L.card,[['Under stress I tend to'],['stay calm and fair','get sarcastic and snap'],['so I will watch'],['what I do and its effect on safety','how wrong Theo’s numbers are'],['and if it’s going badly I will'],['step back and slow down','push harder to be heard']],[0,1,0,0,0,0],
   [[],['That’s not Jordan’s known habit. Start with the honest pattern.'],[],['That’s watching content only. Self-monitoring means watching yourself.'],[],['Pushing harder is the violence habit. Step back instead.']],
   'Honest about the habit, watching both behavior and its effect, and ready to step back. That’s a vigilant self-monitor.');}},
{part:3,src:'Chapter 4 · Summary: Learn to Look',pts:2,
 solve:async L=>{for(let k=0;k<8;k++){const n=L.$('#nx');if(n&&!n.disabled)n.click();}[2,3,4,6,7].forEach(k=>L.$('#cf'+k).click());L.$('#chk').click();},
 run(L){
  const C=[
   ['R','Quick update: the lease for the second clinic arrives Friday.','','Routine news. Content only.'],
   ['K','What will staffing look like over there?','','A fair, direct question: dialogue.'],
   ['R','Staffing will sort itself out. Every clinic our size is expanding.','Controlling','Overstating and speaking in absolutes to close the question.'],
   ['J','Sure. And I’ll grow a second pair of hands.','Masking','Sarcasm instead of saying the worry plainly.'],
   ['T','Well! Has everyone tried the new coffee machine?','Avoiding','Your own move: steering away from the real issue. The hardest one to see.'],
   ['J','I think we need real numbers on tech hours before we sign.','','Direct, specific and respectful. Tense, but that’s dialogue.'],
   ['R','Jordan, you’re always the one who says no.','Labeling','Putting Jordan in a box (“the one who says no”) to dismiss the point.'],
   ['K','(Checks phone.) Sorry, I need to see a patient.','Withdrawing','Leaving the talk altogether.']];
  let shown=1,checked=false;const fl=new Set();
  L.h(L.kick('pr','Challenge')+'<h1 class="q">You’re Theo, in the second-clinic meeting. Flag every line where someone moves to silence or violence, <i>including you</i>. No false alarms.</h1>'+
   '<p class="small" style="margin:-8px 0 8px">Tap a line to flag it. Tap again to unflag.</p>'+
   '<div class="ll-chat" id="ch" aria-live="polite"></div>'+
   '<div class="ll-ctl"><button type="button" class="btn" id="nx">'+L.ic('play')+'Next line</button><button type="button" class="btn pri" id="chk" hidden>'+L.ic('check')+'Check my flags</button><span class="small" id="fc"></span></div><div id="cr"></div>');
  function draw(){L.$('#ch').innerHTML=C.slice(0,shown).map((c,k)=>{const f=fl.has(k);let extra='',cls=f?'flag':'';
      if(checked){const sig=!!c[2],good=f===sig;cls=good?'ok':'no';
        extra='<span class="ll-tag" style="background:var(--'+(good?'ok':'no')+'-bg);color:var(--'+(good?'ok':'no')+')">'+L.ic(good?'check':'x')+(sig?c[2]+(f?'':' · missed'):(f?'False alarm':'Dialogue'))+'</span><span class="ll-cond'+(good?'':' bad')+'">'+L.ic('info')+'<span>'+c[3]+'</span></span>';}
      else if(f)extra='<span class="ll-tag" style="background:var(--no-bg);color:var(--no)">'+L.ic('alert')+'Flagged</span>';
      return bub(L,c[0],c[1],{btn:!checked,id:'cf'+k,me:c[0]==='T',cls,extra});}).join('');
    if(!checked)C.slice(0,shown).forEach((c,k)=>L.$('#cf'+k).onclick=()=>{fl.has(k)?fl.delete(k):fl.add(k);draw();});
    L.$('#nx').hidden=shown>=C.length||checked;L.$('#chk').hidden=shown<C.length||checked;
    L.$('#fc').textContent=checked?'':fl.size+' flagged';}
  L.$('#nx').onclick=()=>{if(shown<C.length)shown++;draw();};
  L.$('#chk').onclick=()=>{if(checked)return;checked=true;
    const sig=C.map((c,k)=>c[2]?k:-1).filter(k=>k>=0),caught=sig.filter(k=>fl.has(k)).length,fa=[...fl].filter(k=>!C[k][2]).length,a=caught===sig.length,b=fa===0;
    L.award(a);L.award(b);draw();
    L.$('#cr').innerHTML='<div class="ll-read"><b>Caught:</b> '+caught+' of '+sig.length+' signals'+(fl.has(4)?'':' (you missed your own)')+' · <b>False alarms:</b> '+fa+'</div>';
    L.sheet(a&&b?'ok':'no',a&&b?'Sharp eyes':'Not all of them',(a&&b?'Every move to silence or violence, including your own coffee-machine dodge, and you left the honest lines alone. ':'Check the tags on each line. ')+'That’s Learn to Look: content and conditions, the turn, safety signals, and your own Style Under Stress. Spotting them is step one; the next lesson is about making it safe.');
    L.done();};
  draw();}}
  ]
});
</script>
