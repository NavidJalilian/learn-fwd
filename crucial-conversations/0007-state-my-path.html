<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>STATE My Path</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">

</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0007', title:'STATE my path', minutes:20, icon:'chat',
  goals:['Open a touchy talk with facts, then share your story as a story','Pass the Goldilocks test: not too soft, not too hard','Catch yourself pushing too hard when you’re sure you’re right'],
  parts:['Risky meaning','What to say','How to say it','Strong belief'],
  read:'Read chapter 7 of the book for the full motel-bill conversation and the list of debating tricks.',
  glossary:{
    tentative:'Talking tentatively: telling your story as a story, not as a hard fact, with words like “I’m beginning to wonder…” or “In my opinion…”.',
    goldilocks:'Goldilocks test: a check on how you word your story. Not so soft it sounds unimportant, not so hard it sounds like a verdict, but just right.',
    'dirty-tricks':'Debating tricks: moves we use when we’re sure we’re right, such as stacking the deck, appealing to authority or attacking the person.'
  },
  cheatsheet:[
    'Sharing risky meaning takes <b>confidence</b> (say it to the person who needs to hear it), <b>humility</b> (you may be wrong) and <b>skill</b>.',
    '<b>STATE:</b> Share your facts, Tell your story, Ask for others’ paths (the “what”), Talk tentatively, Encourage testing (the “how”).',
    '<b>Facts first.</b> They are the least controversial, most persuasive and least insulting way to begin. Starting with your story kills safety.',
    'Tell your story because facts alone rarely show why it matters. <b>Don’t pile it on</b>, and use Contrasting if safety drops.',
    '<b>Goldilocks test:</b> not too soft (“This is probably stupid, but…”), not too hard (a verdict), but a story with a question.',
    'The only limit to how strongly you state your view is how strongly you <b>invite others to challenge it</b>. Mean it.',
    'When you’re sure you’re right, you push, and others resist. <b>Catch yourself</b>: soften your approach, not your belief.'
  ],
  steps:[
/* ---------- PART 1: RISKY MEANING ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Jordan has finally decided to raise the skipped safety checks with Dr. Alvarez. Which opening line gives Jordan the best chance of being heard?</h1>');
  L.mc(L.card,['“You’re putting animals’ lives at risk.”','“Twice this month, surgery started before the checklist was done.”'],1,
   'Nobody can argue with what happened. The first line is a verdict, and Dr. Alvarez would fight it. This lesson shows how to build on that start.',
   'That line is a conclusion about Dr. Alvarez, and a hurtful one. They will defend themselves instead of listening. The second line only says what happened.');}},
{part:0,src:'Chapter 7 · Share Risky Meaning',run(L){
  L.h(L.kick('learn','Sharing risky meaning')+'<h1 class="q">Some things are hard to put into the pool</h1>'+
   L.prose('Arguing about a supply order is easy. Telling a person that something <i>they</i> do is a problem is much harder. The book sorts people into three groups:')+
   L.tiers([['x','The worst','Swing between dumping it bluntly (“Somebody has to be honest…”) and saying nothing at all.','blunt or silent'],
            ['alert','The good','Say part of it, but sugarcoat it so much the message gets lost.','understated'],
            ['star','The best','Say all of it, in a way that makes it safe for the other person to hear and to answer.','frank and respectful',true,'Aim here']])+
   L.prose('The blunt option is a '+L.g('fools-choice','Fool’s Choice')+' in disguise: be honest <i>or</i> be kind. The best refuse to choose.'));
  L.done();}},
{part:0,src:'Chapter 7 · Maintain Safety',run(L){
  L.h(L.kick('learn','Three ingredients')+'<h1 class="q">Confidence, humility and skill</h1>'+
   L.list([['eye','Confidence','Say it to the person who needs to hear it. The book’s Brian complains about his boss Fernando at home and at lunch. Everyone knows what Brian thinks, except Fernando.'],
     ['scale','Humility','You have something worth saying, but so do others. Your view is a starting point, not the final word, and new facts could change your mind.'],
     ['check','Skill','The know-how to be candid and keep it safe at the same time. That skill is what this chapter teaches, and it’s what makes the confidence possible.']],1));
  L.done();}},
{part:0,src:'Chapter 7 · Maintain Safety',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">For weeks Jordan has told Theo about the skipped checks, but never Dr. Alvarez. Which ingredient is Jordan short on?</h1>');
  L.mc(L.card,['Humility','Confidence','Skill'],1,
   'Like Brian and Fernando: everyone knows what Jordan thinks except the one person who needs to hear it. Confidence means taking it to that person.',
   'Jordan isn’t claiming to know everything, and hasn’t even tried the conversation yet. The gap is confidence: saying it to the person who needs to hear it.');}},
{part:0,src:'Chapter 7 · Good Night and Good-Bye!',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">Carole and the motel bill</h1>');
  L.beats(L.card,[
   ['The fact','Carole checks the credit card statement and finds a charge from a cheap motel about a mile from home.'],
   ['The story','Why would Bob stay at a motel so close to home, and without telling her? Then the conclusion hits: Bob is having an affair.'],
   ['The truth','He isn’t. But Carole doesn’t know that yet.'],
   ['The worst way','The moment Bob walks in, she opens with an accusation: “I can’t believe you’re doing this to me.” Bob has no idea what she means.'],
   ['The problem','All Carole really has is a line on a bill. She is acting out the worst story she could make up, not finding out the real one.']],
   'If she turns out to be right, there will be time for a confrontation later. First she needs dialogue. Later we replay this scene done well.');}},

/* ---------- PART 2: WHAT TO SAY ---------- */
{part:1,src:'Chapter 7 · STATE My Path',run(L){
  L.h(L.kick('learn','STATE my path')+'<h1 class="q">Five skills for saying the hard thing</h1>'+
   L.prose('First, work on yourself: Start with Heart, and question your story. Then use the five '+L.g('state','STATE')+' skills:')+
   L.lanes([['list','What to say','<b>S</b>hare your facts<br><b>T</b>ell your story<br><b>A</b>sk for others’ paths',2],
            ['chat','How to say it','<b>T</b>alk tentatively<br><b>E</b>ncourage testing',3]])+
   L.prose('The “what” skills walk the other person through your '+L.g('path','Path to Action')+' in the same order you travelled it: facts first, then your story.'));
  L.done();}},
{part:1,src:'Chapter 7 · Share Your Facts',run(L){
  L.h(L.kick('learn','Share your facts')+'<h1 class="q">Start where the path starts</h1>'+
   L.prose('Under stress we do the opposite: we lead with our story, because it’s what fills our head. That’s the worst place to begin. Facts are better on three counts:')+
   L.list([['shield','Least controversial','“Surgery started before the checklist was signed” is hard to dispute. “You can’t be trusted” invites a fight.'],
     ['scale','Most persuasive','Facts are what belief rests on. Without them, people make up reasons for what you said, and decide you’re foolish or unkind.'],
     ['people','Least insulting','A harsh conclusion as your first line can kill safety at once, and then you may never get to the facts.']],2)+
   L.note('Not sure what your facts are? Sort them from your conclusions <i>before</i> the conversation. That’s the homework.','pencil'));
  L.done();}},
{part:1,src:'Chapter 7 · Share Your Facts',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">Brian tries it two ways with Fernando</h1>');
  L.beats(L.card,[
   ['Story first','Brian opens: “You micromanage me, and it’s driving me nuts.” Fernando bristles at once. The talk is over before it starts.'],
   ['Facts first','Second try: “Since I started, you’ve asked to meet me twice a day, more than anyone else, and to see every idea before it goes into a project.”'],
   ['Then the story','“I’m not sure you mean this, but I’m beginning to wonder if you don’t trust me. Is that what’s going on?”'],
   ['Fernando’s side','He was only trying to avoid surprises. The last person in Brian’s job kept finishing projects that missed a key piece.']],
   'Facts earn you the right to share your story. And because Brian told it as a possible story, Fernando could answer it.');}},
{part:1,src:'Chapter 7 · Share Your Facts',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Theo wants to talk to Kit about the late records. Which is a fact Theo can open with?</h1>');
  L.mc(L.card,['“You don’t take the records seriously.”','“You’re letting the whole team down.”','“Eight of last week’s records closed after Friday.”'],2,
   'Kit can check it, and it doesn’t accuse Kit of anything. It’s a safe, persuasive start.',
   'That’s a conclusion about Kit, and Kit can argue with it. Open with something you could count or see: eight records closed late.');}},
{part:1,src:'Chapter 7 · Share Your Facts',pts:1,
 solve:async L=>{L.$('#say').click();},
 run(L){
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Two versions of Jordan’s first sentence to Dr. Alvarez. Press the button to see how each one lands.</h1>'+
   L.lanes([['book','Story first','“You keep cutting corners on safety.”<div class="res" id="ra"></div>',4],
            ['eye','Facts first','“On the 3rd and the 17th, surgery started before the checklist was signed.”<div class="res" id="rb"></div>',2]])+
   '<button class="btn pri" id="say" style="margin-top:14px">'+L.ic('play')+'Say it</button><div id="sq"></div>');
  L.$('#say').onclick=function(){this.remove();
    L.$('#ra').innerHTML='<span style="color:var(--no)">Dr. Alvarez hears an insult, defends their record and starts guessing at Jordan’s motives. The facts never come up.</span>';
    L.$('#rb').innerHTML='<span style="color:var(--ok)">Dr. Alvarez pauses: “The 17th was the emergency spay. Go on.” The door is open for Jordan’s story.</span>';
    const q=L.$('#sq');q.innerHTML='<h2 class="sub">Why did the story-first line backfire?</h2>';
    L.mc(q,['It gave no facts, so Dr. Alvarez filled the gap with a story about Jordan','It was too short to explain what Jordan really meant'],0,
     'With no facts to explain the conclusion, people invent reasons for it, and decide you’re foolish or hostile.',
     'Length wasn’t the issue. It led with a conclusion and no facts, so Dr. Alvarez made up a story about why Jordan said it.');};}},
{part:1,src:'Chapter 7 · Tell Your Story',run(L){
  L.h(L.kick('learn','Tell your story')+'<h1 class="q">Facts alone rarely say why it matters</h1>'+
   L.prose('If you only list facts, the other person may miss what worries you. In the book, someone points out company software in a colleague’s briefcase, and the colleague just chats about software. The worry only lands when they say: it looks like you’re taking it home. Is that right?')+
   L.list([['star','It takes confidence','If you’ve done the homework on your facts, you can see your story is a reasonable one, worth hearing.'],
     ['layers','Don’t pile it on','Problems left to simmer grow a heap of ugly conclusions. Share the one that matters, not the whole heap.'],
     ['alert','Watch for safety','If they turn defensive, step out and use Contrasting. But don’t apologize for your view: Contrasting stops them hearing <i>more</i> than you mean, not less.']],3));
  L.done();}},
{part:1,src:'Chapter 7 · Ask for Others’ Paths',run(L){
  L.h(L.kick('learn','Ask for others’ paths')+'<h1 class="q">Confidence shares, humility asks</h1>'+
   L.prose('Sharing your facts and story shows confidence. Asking for the other person’s view, and meaning it, shows humility.')+
   L.flow([['eye','Your facts','what you saw',2],['book','Your story','what you’re starting to think',3],['chat','Their path','their facts, story and feelings',1]])+
   L.prose('Ask yourself: is Dr. Alvarez really careless about safety? What does Kit think is going on? Then listen, and be ready to <b>change or drop your story</b> as new facts arrive. The goal is a fuller pool, not winning.'));
  L.done();}},
{part:1,src:'Chapter 7 · The “What” Skills',pts:6,run(L){
  L.h(L.kick('pr','Which skill?')+'<h1 class="q">Jordan drafts notes for the talk with Dr. Alvarez. Sort each line.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Share facts','Tell story','Ask their path'],[
   ['On the 3rd, the checklist was signed after the first incision.',0,'A dated event anyone in the room could confirm.'],
   ['I’m starting to worry we’ll miss something serious one day.',1,'That’s Jordan’s conclusion about what the facts mean.'],
   ['How do you see those two surgeries?',2,'It invites Dr. Alvarez to share their facts and story.'],
   ['Both times, we were running more than thirty minutes late.',0,'Observable and checkable.'],
   ['It seems the schedule is winning over the checklist.',1,'An interpretation, offered as Jordan’s view.'],
   ['Is there something about those days that I’m not seeing?',2,'It asks for what Jordan might be missing.']],
   'Facts, then story, then their path: the order Jordan travelled, then an open door.');}},

/* ---------- PART 3: HOW TO SAY IT ---------- */
{part:2,src:'Chapter 7 · Talk Tentatively',run(L){
  L.h(L.kick('learn','Talk tentatively')+'<h1 class="q">Tell your story as a story, not a fact</h1>'+
   L.prose(L.g('tentative','Talking tentatively')+' means your words show it’s your view. Some swaps the book suggests:')+
   L.lanes([['x','Instead of','“The fact is…”<br>“Everyone knows that…”<br>“It’s clear to me…”',4],
            ['check','Try','“In my opinion…”<br>“Three of the techs think…”<br>“I’m beginning to wonder if…”',2]])+
   L.prose('Why? The more forceful you sound, the more others resist. Absolute words cut your influence, and tentative ones open people up.')+
   L.note('It isn’t a trick. Your story really <i>is</i> an educated guess. Never fake doubt, and never fake more certainty than you have.','info'));
  L.done();}},
{part:2,src:'Chapter 7 · A “Good” Story—The Goldilocks Test',run(L){
  L.h(L.kick('learn','The Goldilocks test')+'<h1 class="q">Tentative, not wimpy</h1>'+
   L.prose('Some people worry so much about being pushy that they bury the message: “Call me crazy, but…” That’s another Fool’s Choice. Use the '+L.g('goldilocks','Goldilocks test')+':')+
   L.tiers([['down','Too soft','“This is probably nothing, and it’s likely my fault, but…”','sounds unimportant'],
            ['flame','Too hard','“Why do you think the rules don’t apply to you?”','a verdict, an attack'],
            ['check','Just right','“I’m starting to think the schedule is pushing the checklist aside. Is that what’s happening?”','a story plus a question',true,'Aim here']])+
   '<p class="small" style="margin-top:10px">Sound like someone sharing an opinion, not a nervous wreck and not a judge.</p>');
  L.done();}},
{part:2,src:'Chapter 7 · A “Good” Story—The Goldilocks Test',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Jordan wants to tell Theo how the overtime feels. Which line is “just right”?</h1>');
  L.mc(L.card,['“Sorry, I’m probably just being dramatic, but…”','“I’m starting to feel the techs’ hours don’t count. Am I missing something?”','“You obviously don’t care about the techs at all.”'],1,
   'It names Jordan’s story clearly and leaves room for Theo to answer.',
   'One line apologizes the message away (too soft); the other states a verdict about Theo (too hard). The middle one shares a story and asks.');}},
{part:2,src:'Chapter 7 · A “Good” Story—The Goldilocks Test',pts:6,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Goldilocks test',['Too soft','Too hard','Just right'],[
   ['Theo to Kit: “It’s probably my fault for asking, but… the records?”',0,'It apologizes before it says anything.'],
   ['Theo to Kit: “You clearly don’t care about the billing team.”',1,'A verdict about Kit’s character.'],
   ['Theo to Kit: “I’m wondering if the records feel low priority to you. Is that fair?”',2,'A clear story, offered as a story, with a question.'],
   ['Kit to Dr. Alvarez: “I don’t want to be a pain, it’s silly really…”',0,'The message is lost in the disclaimer.'],
   ['Jordan to Theo: “The rota change makes me think my input isn’t wanted. Is that right?”',2,'Honest about the story, open to being wrong.'],
   ['Dr. Alvarez to Jordan: “Everyone knows the checklist slows us down.”',1,'“Everyone knows” dresses up an opinion as a fact.']]);}},
{part:2,src:'Chapter 7 · Encourage Testing',run(L){
  L.h(L.kick('learn','Encourage testing')+'<h1 class="q">Make it safe to disagree with you</h1>'+
   L.prose('Some people think they must choose: speak their mind, or let others speak. The best do both. How strongly you can state your view is limited only by how strongly you invite people to challenge it.')+
   L.list([['chat','Invite opposing views','“Does anyone see it differently?” “What am I missing?”'],
     ['check','Mean it','“Nobody disagrees, do they?” is a threat, not an invitation. Your words and tone must say you want to hear them.'],
     ['cycle','Play devil’s advocate','If people stay quiet, argue against your own view: “What if the opposite is true?”'],
     ['clock','Keep going until your motive is obvious','Bosses especially. People who were punished for speaking before need more than one invitation.']],1));
  L.done();}},
{part:2,src:'Chapter 7 · Back to the Motel',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">The motel bill, done well</h1>');
  L.beats(L.card,[
   ['Share facts','Carole: she found a charge for about fifty dollars from the motel down the street on their card.'],
   ['Tell story, tentatively','It’s not the money. Her sister found out about an affair through a hotel bill. She doesn’t have anything to worry about, does she?'],
   ['Ask their path','What does Bob think is going on with the bill?'],
   ['Contrast and test','Bob has never given her a reason to doubt him, and she doesn’t really think he’s cheating. But would he mind checking right now, to put her mind at rest?'],
   ['The answer','They call. The restaurant they ate at earlier that month had the same owner, and used the same card machine as the motel.']],
   'No accusation, no threat. A suspicion got checked, and the relationship came out stronger.');}},
{part:2,src:'Chapter 7 · STATE My Path',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Tap each piece until Jordan’s message passes STATE and the Goldilocks test.</h1>');
  L.sentence(L.card,[
    ['“You keep skipping safety steps.”','“Twice this month, surgery started before the checklist was signed.”'],
    ['“This is probably silly, but”','“Clearly the schedule matters more to you, and”','“I’m starting to worry we’ll miss something, and”'],
    ['“nobody disagrees, right?”','“I’d really like to hear how you see it.”']],[1,2,1],
   [['That opens with a conclusion. Start with what happened.'],['Too soft: it tells Dr. Alvarez to ignore what follows.','Too hard: a verdict about Dr. Alvarez’s values.'],['That invitation sounds like a threat. Mean it.']],
   'Facts, then a tentative story, then a real invitation to push back.');}},

/* ---------- PART 4: STRONG BELIEF ---------- */
{part:3,src:'Chapter 7 · How Did We Get Like This?',run(L){
  L.h(L.kick('learn','When you’re sure you’re right')+'<h1 class="q">Strong belief turns into pushing</h1>'+
   L.prose('The second challenge isn’t touchy feedback. It’s arguing for something you believe in. The more you care and the surer you feel, the harder you push, and the harder others resist.')+
   L.flow([['book','The story','I’m right, they don’t know better, and fighting for the truth is my duty'],['flame','The tricks','I feel justified in using any debating move'],['x','The result','More resistance, worse decisions, bruised relationships']])+
   L.prose('Common '+L.g('dirty-tricks','debating tricks')+': <b>stacking the deck</b> (only the facts that help you), <b>exaggerating</b> (“everyone knows”), <b>appealing to authority</b>, <b>attacking the person</b>, <b>hasty generalizing</b> and <b>attacking a straw man</b> (a twisted version of their idea).'));
  L.done();}},
{part:3,src:'Chapter 7 · How Did We Get Like This?',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Dr. Alvarez argues for the second clinic. Which trick?',['Stacking the deck','Appeal to authority','Attacking the person','Hasty generalization','Straw man'],[
   ['Shows the team only the figures on new clients, and leaves out the staffing costs.',0,'Picking only the facts that support you.'],
   ['“Our accountant says it’s a go, so that settles it.”',1,'Using someone else’s rank to end the debate.'],
   ['“Jordan, you’re too negative to see an opportunity.”',2,'It goes after Jordan, not Jordan’s point.'],
   ['“My friend’s second clinic took off, so ours will too.”',3,'One case stretched into a rule.'],
   ['“So your plan is that we never grow and slowly go broke?”',4,'It twists the objection into something easy to knock down.']]);}},
{part:3,src:'Chapter 7 · How Do We Change?',run(L){
  L.h(L.kick('learn','How to change')+'<h1 class="q">Soften your approach, not your belief</h1>'+
   L.list([['target','Back off and Start with Heart','When you’re dying to convince people, ask what you really want for you, for them and for the relationship, and how you’d act if you did.'],
     ['eye','Learn to Look, at yourself','Notice when others resist: louder voices, overstated facts, or silence. Then check yourself. Am I leaning in, getting louder, giving monologues, using tricks?'],
     ['chat','Tone it down and ask','Open yourself to the idea that they hold a piece of the puzzle. Then ask for their view.']],2)+
   L.quote('Hold to your belief; merely soften your approach.','Chapter 7')+
   '<p class="small">Warning signs: you feel indignant, or you can’t understand why others don’t see something so obvious.</p>');
  L.done();}},
{part:3,src:'Chapter 7 · How Do We Change?',pts:1,run(L){
  L.h(L.kick('pr','Catch yourself')+'<h1 class="q">In the planning meeting, Dr. Alvarez has talked for ten minutes about the second clinic. Kit has gone quiet; Jordan’s arguments are getting louder. What should Dr. Alvarez do now?</h1>');
  L.mc(L.card,['Drop the idea of a second clinic, to keep the peace','Restate the case more clearly, so they finally see it','Stop, soften the language, and ask what they’re seeing'],2,
   'Resistance is the signal. Dr. Alvarez keeps the belief, softens the approach and asks for the missing pieces of the puzzle.',
   'Pushing harder only adds resistance, and dropping the idea is a Fool’s Choice. Dr. Alvarez can keep the belief and soften the approach: stop, then ask.');}},
{part:3,src:'Chapter 7 · Summary—STATE My Path',pts:1,run(L){
  L.h(L.kick('pr','Put it together')+'<h1 class="q">Theo is finally ready to talk with Kit about the late records. Put Theo’s moves in order.</h1>');
  L.order(L.card,['“Eight records from last week closed after Friday.”','“I’m beginning to think the records keep sliding behind patients.”','“What’s it like from your side?”','“If I’ve got this wrong, I really want to know.”'],
   'Share facts, tell the story tentatively, ask for their path, and encourage testing.',['Facts','Story','Ask','Test']);}}
  ]
});
</script>
</body>
</html>
