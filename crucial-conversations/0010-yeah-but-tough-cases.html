<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Yeah, But: Tough Cases</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">

</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0010', title:'Yeah, but: advice for tough cases', minutes:20, icon:'alert',
  goals:['Hold teammates to agreements and handle a team that defers to the boss','Talk about the pattern, not the latest excuse or surprise','Handle broken trust, low initiative and your own hot moments'],
  parts:['Team problems','Patterns','Trust','Hot moments'],
  read:'Read chapter 10 of the book for all seventeen cases, including harassment, touchy personal topics and the person who breaks every rule.',
  glossary:{
    'danger-point':'Danger Point: the trap that makes a tough case go wrong, which the book names before giving its solution.',
    'groundhog':'Groundhog Day trap: raising the same small problem again and again instead of the bigger one behind it, so nothing ever gets solved.'
  },
  cheatsheet:[
    'Each tough case has a <b>Danger Point</b> and a <b>Solution</b>, and the solution reuses the skills you already know.',
    '<b>Broken agreements:</b> in the best teams every member speaks up directly. Don’t wait for the boss.',
    '<b>Deference:</b> work on me first by asking a peer, not your reports. If it’s ghosts of past bosses, go public, reward risk takers and disagree with yourself.',
    '<b>Patterns:</b> after a promise is broken, the topic is the broken promise, not the latest slip. The right conversation calms your emotions.',
    '<b>Excuses and surprises:</b> get a commitment to solve the whole problem, and set a “no surprises” rule: finish as planned or tell me right away.',
    '<b>Trust</b> comes in degrees, by topic, and in two flavors: motive and ability. Deal with it around the issue, not the person.',
    '<b>Hot moments:</b> an agreed time-out is not silence. STATE early so stories don’t ferment, and if you say something awful, apologize, then STATE.'
  ],
  steps:[
/* ---------- PART 1: TEAM PROBLEMS ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Theo says: “The skills sound great, but Maplewood is different. Our people are too stubborn for any of this to work.” What’s the most useful first reply?</h1>');
  L.mc(L.card,['“Fair point, so let’s skip the hard talks”','“Which situation feels too hard? Let’s look at it”'],1,
   'Yes. The authors heard “yeah, but” so often they wrote a whole chapter of tough cases. Looking at the specific case is where help starts.',
   'Giving up is the Fool’s Choice again. The authors’ answer to “yeah, but” was to look closely at each tough case.');}},
{part:0,src:'Chapter 10 · Advice for Tough Cases',run(L){
  L.h(L.kick('learn','“Yeah, but…”')+'<h1 class="q">Seventeen tough cases, one shape</h1>'+
   L.prose('People often tell the authors their situation is harder than the book’s examples. So chapter 10 takes seventeen tough cases. For each, it names the <b>'+L.g('danger-point','Danger Point')+'</b> (the trap that makes it go wrong) and then the <b>Solution</b>.')+
   L.flow([['alert','Danger Point','what usually goes wrong'],['bulb','Solution','what to do instead'],['layers','Old skills','the principles you already know']])+
   L.prose('The book’s claim: the dialogue skills apply to almost any problem. This lesson picks the cases that fit Maplewood best. Notice how each solution reuses earlier skills.'));
  L.done();}},
{part:0,src:'Chapter 10 · Failure to Live Up to Agreements',run(L){
  L.h(L.kick('learn','Broken agreements')+'<h1 class="q">“We agree on changes, then people don’t do them”</h1>'+
   L.tiers([['x','Worst teams','Walk away from the problem.','ignore it'],
            ['person','Good teams','The boss eventually deals with it.','boss handles it'],
            ['people','Best teams','Every member holds the others to account. If they see an agreement broken, they speak up right away and directly.','peers speak up',true,'Aim here']])+
   L.prose('<b>Danger Point:</b> waiting for the boss to do what good teammates should do themselves. <b>Solution:</b> if a teammate isn’t doing what was agreed, it’s up to you to speak up.'));
  L.done();}},
{part:0,src:'Chapter 10 · Failure to Live Up to Agreements',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">The spending freeze that melted in a day</h1>');
  L.beats(L.card,[
   ['The agreement','At an off-site meeting, a group of executives agreed to stop all optional spending to free up cash during a short crunch.'],
   ['The next day','One executive rushed back and prepaid a consultant for six months of work that looked optional.'],
   ['The witness','A teammate watched it happen and said nothing. They decided holding people to account was the boss’s job.'],
   ['Too late','By the time the boss found out, the money was gone. Support for the plan faded, and the team ran short of cash.']],
   'That silent moment was <i>the</i> crucial conversation. Success depends less on perfect compliance than on teammates who speak up when someone slips back.');}},
{part:0,src:'Chapter 10 · Failure to Live Up to Agreements',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">After the overtime fight, the team agreed: no tech is asked to stay late without a day’s notice. Jordan hears Kit ask a tech to stay late with ten minutes’ warning. What fits the best teams?</h1>');
  L.mc(L.card,['Jordan reports it to Theo and lets Theo handle it','Jordan talks to Kit directly about the agreement'],1,
   'Yes. In the best teams, peers speak up directly and right away, and Jordan can use STATE to do it well.',
   'That’s the “good team” habit, and it’s what cost the executives their cash. In the best teams the peer who sees it speaks up.');}},
{part:0,src:'Chapter 10 · Deference to Authority',run(L){
  L.h(L.kick('learn','Deference to authority')+'<h1 class="q">“My people only tell me what they think I want to hear”</h1>'+
   L.prose('<b>Danger Point.</b> Leaders make one of two mistakes:')+
   L.list([['eye','Misdiagnosing the cause','Some leaders cause the fear but deny it: absolutes, subtle use of power. Others are doing fine but live with the <i>ghosts</i> of past bosses. First find out which, or both.'],
           ['x','Commanding it away','Telling people to stop deferring. “Okay, whatever you say, boss!” Say nothing and it goes on; say it and you may feed it.']],3)+
   L.prose('<b>Solution.</b> Work on me first: ask a <b>peer</b> who sees you in action for honest feedback, not your reports, who will whitewash it. If it’s ghosts, <b>go public</b>: name the problem in a meeting and ask for advice, thank people who disagree, play devil’s advocate, and leave the room if needed.'));
  L.done();}},
{part:0,src:'Chapter 10 · Deference to Authority',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Dr. Alvarez notices nobody pushes back on the second clinic. Does this move help or backfire?',['Helps','Backfires'],[
   ['Asking Dr. Kim, a fellow vet who sits in on Maplewood meetings, what Dr. Alvarez does that shuts people down.',0,'A peer who watches them in action can be honest. That’s working on me first.'],
   ['Announcing at staff meeting: “Stop agreeing with me just because I’m the boss.”',1,'That’s commanding it away. People may just agree with that, too.'],
   ['Thanking Jordan in front of everyone for raising a doubt about the plan.',0,'Rewarding risk takers makes disagreement feel safe.'],
   ['Asking each tech privately whether they’re scared of Dr. Alvarez.',1,'People who already defer will whitewash the answer. Ask a peer instead.'],
   ['Arguing against the clinic plan out loud when nobody else will.',0,'If you can’t get others to disagree, disagree with yourself. It shows every idea is open to question.']]);}},

/* ---------- PART 2: PATTERNS ---------- */
{part:1,src:'Chapter 10 · Shows a Pattern',run(L){
  L.h(L.kick('learn','Shows a pattern')+'<h1 class="q">“I keep having the same talk with the same person”</h1>'+
   L.prose('<b>Danger Point.</b> Someone is late a second time, then a third. You give another gentle reminder while an ugly story builds. Finally you snap over a small thing and look out of line. The book calls this the <b>'+L.g('groundhog','Groundhog Day')+'</b> trap: reliving the same small problem instead of the bigger one.')+
   L.flow([['clock','Instance','“You were late again.”','the first talk'],['alert','Pattern','“You promised and didn’t keep it.”','the next talk',2]])+
   L.prose('<b>Solution.</b> Learn to Look for patterns over time, then STATE your path about the pattern. Once someone has promised to do better, the topic is the broken commitment. It’s now about trust and respect. And when you hold the right conversation, your emotions calm down.'));
  L.done();}},
{part:1,src:'Chapter 10 · Shows a Pattern',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">The front desk opener was late twice and promised Theo it wouldn’t happen again. Today they’re late a third time. What should Theo talk about?</h1>');
  L.mc(L.card,['The promise that wasn’t kept','What time the front desk opens'],0,
   'Right. The start time is old news. The bigger issue now is a commitment that wasn’t kept.',
   'They already know the opening time. Repeating it is Groundhog Day. Talk about the broken promise.');}},
{part:1,src:'Chapter 10 · Shows a Pattern',pts:1,
 solve:async L=>{L.$('#ta').click();L.$('#tb').click();},
 run(L){
  const seen=new Set();
  const S=[['Kit, the Rex record is late. Please get it done today.','Kit says sorry and finishes it. Next week, another record is late. Theo’s frustration grows each round.',85,'var(--no)'],
           ['Kit, twice you promised to catch up on records, and both times it didn’t happen. Can we talk about that?','The talk is about trust, which is what really bothers Theo. Theo stays calm because the words fit the feeling.',30,'var(--ok)']];
  L.h(L.kick('pr','Toggle and compare')+'<h1 class="q">Kit’s records are late for the third time, after two promises. Try both of Theo’s openings and watch Theo’s emotions.</h1>'+
   '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="chip" id="ta">The latest record</button><button class="chip" id="tb">The pattern</button></div>'+
   '<div style="background:var(--soft);border-radius:16px;padding:14px;margin:10px 0;min-height:130px"><div id="tq" class="small">Pick an opening above.</div><div class="meterrow"><div class="lb">Theo’s emotions</div><div class="meter"><div id="em"></div></div></div><div id="tr" class="small"></div></div><div id="tz"></div>');
  const pick=(i,btn)=>{[L.$('#ta'),L.$('#tb')].forEach(b=>b.classList.remove('sel'));btn.classList.add('sel');seen.add(i);
    L.$('#tq').innerHTML='<b>Theo:</b> “'+S[i][0]+'”';L.$('#tr').innerHTML=S[i][1];const m=L.$('#em');m.style.width=S[i][2]+'%';m.style.background=S[i][3];
    if(seen.size===2&&!L.$('#tz').innerHTML){const q=L.$('#tz');q.innerHTML='<h2 class="sub">Why did Theo stay calmer with the second opening?</h2>';
      L.mc(q,['Kit cared more about that topic','Theo was finally naming what really bothered them'],1,
       'Yes. Talking about the latest slip when a pattern bothers you makes your emotions look out of proportion. The right conversation calms you.',
       'The book’s point is about Theo, not Kit: when you name what’s really eating you, the pattern, you can stay composed.');}};
  L.$('#ta').onclick=function(){pick(0,this);};L.$('#tb').onclick=function(){pick(1,this);};}},
{part:1,src:'Chapter 10 · Endless Excuses',run(L){
  L.h(L.kick('learn','Excuses and surprises')+'<h1 class="q">Two close cousins of the pattern problem</h1>'+
   L.lanes([['cycle','Endless excuses','Every slip comes with a new, plausible reason: the alarm broke, then the car, then a friend forgot. <b>Solution:</b> get a commitment to solve the <i>whole</i> problem, not just the stated cause: “Do whatever it takes to be here on time.” As excuses pile up, talk about the pattern, not the latest excuse.',1],
            ['alert','No warning','People run into problems and you find out too late, always with a good excuse. <b>Solution:</b> once a task is assigned there are two acceptable paths: finish as planned, or tell me right away. No surprises. The first surprise becomes the new topic: “We agreed you’d tell me. What happened?”',2]]));
  L.done();}},
{part:1,src:'Chapter 10 · Endless Excuses',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Kit says the records are late because the software crashed. Build Theo’s reply so it heads off every future excuse.</h1>');
  L.sentence(L.card,[['Fixing the software makes sense,','Okay, the software is the problem,'],['and do whatever else it takes','so just get IT to fix it'],['to close each record within a day of the visit.','to be a bit quicker.'],['Can I count on that from Monday?','Hopefully that helps.']],[0,0,0,0],
   [['That accepts the excuse as the whole story. The goal is the result, not one cause.'],['Fixing one cause leaves room for the next excuse. Ask for whatever it takes.'],['“A bit quicker” is vague. Name the result.'],['That asks for no commitment. Get a clear yes.']],
   'Theo accepts the fix but asks for the whole result, with a clear commitment. A new excuse next week won’t get Kit off the hook.');}},
{part:1,src:'Chapter 10 · No Warning',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Pick the book’s best move',['Talk about the pattern','Commit to the whole problem','Raise “no surprises”'],[
   ['Jordan learns on Friday that the lab samples never went out on Tuesday. The tech knew on Tuesday and said nothing.',2,'Finish as planned or tell me right away. The silence is now the topic.'],
   ['Kit says this week’s reminder list is late because the printer jammed. It’s the first time.',1,'Fine, fix the printer, and anything else in the way. Ask for the result.'],
   ['Kit’s records slipped again, after two promises, with a third new reason.',0,'Excuses piling up? Talk about the pattern, not the latest reason.'],
   ['A tech has been late three times, each after promising to improve.',0,'The broken commitment is the topic now, not the clock.']]);}},

/* ---------- PART 3: TRUST ---------- */
{part:2,src:'Chapter 10 · Failed Trust',run(L){
  L.h(L.kick('learn','Failed trust')+'<h1 class="q">“They let me down. Can I ever trust them again?”</h1>'+
   L.prose('<b>Danger Point.</b> We treat trust as all or nothing. In truth, trust comes <b>in degrees</b> and is <b>topic specific</b>. It also comes in two flavors:')+
   L.lanes([['target','Motive','Do they <i>want</i> to do it right? You might trust someone to give CPR because they truly want to help…',1],
            ['star','Ability','…and still not trust them to do it well, because they’ve never learned how.',2]])+
   L.prose('<b>Solution.</b> Deal with trust around the issue, not the person. Don’t set the bar too high: trust them in the moment, on this topic. Tentatively STATE your concerns. And don’t use mistrust as a club. A Villain Story that exaggerates it makes people act in ways that earn even less trust.'));
  L.done();}},
{part:2,src:'Chapter 10 · Failed Trust',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Kit missed the records deadline. Theo starts wondering whether Kit can be trusted with anything, even surgeries. What does the book suggest?</h1>');
  L.mc(L.card,['Keep doubts on records and talk about that issue','Watch Kit closely on everything until trust returns'],0,
   'Yes. Trust is by topic. Kit’s records are one issue; Kit’s surgical care is another. Letting doubt spread is a Villain Story in the making.',
   'That lets mistrust in one area bleed into Kit’s whole character, and can start a self-defeating cycle. Deal with the records issue itself.');}},
{part:2,src:'Chapter 10 · Failed Trust',pts:4,run(L){
  L.h(L.kick('pr','Motive or ability?')+'<h1 class="q">Which flavor of trust is in doubt in each case?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Motive','Ability'],[
   ['Kit truly wants to finish records but hasn’t learned the new software.',1,'The will is there. The skill isn’t yet.'],
   ['Jordan suspects a new tech skips dose checks because they don’t care.',0,'This doubts whether the tech wants to do it right.'],
   ['Theo wonders if Dr. Alvarez will really listen to the staff, or just wants to look open.',0,'This questions intent, not skill.'],
   ['Harriet Cole fears the front desk can’t explain a complex surgery bill clearly.',1,'Harriet doubts the staff’s know-how, not their goodwill.']],
   'Naming the flavor tells you what to talk about: intentions, or skills and support.');}},
{part:2,src:'Chapter 10 · Shows No Initiative',run(L){
  L.h(L.kick('learn','Shows no initiative')+'<h1 class="q">“They do what they’re asked, and not one bit more”</h1>'+
   L.prose('<b>Danger Point.</b> We talk easily about a <i>bad</i> behavior, but it’s hard to know what to say when someone simply isn’t excellent.')+
   L.list([['arrow','Raise the bar','Set new, higher expectations and say so plainly.'],
           ['layers','Talk about the pattern','Give specific times they hit a barrier and stopped after one try.'],
           ['bulb','Brainstorm together','What could they have done to be more persistent and creative?'],
           ['eye','Stop covering for it','Doing their follow-up yourself, or giving one task to two people “just in case”, acts out low expectations. Talk them out instead.']],2));
  L.done();}},
{part:2,src:'Chapter 10 · Shows No Initiative',pts:1,run(L){
  L.h(L.kick('pr','Apply it')+'<h1 class="q">The supplier didn’t answer one call, so a tech gave up on a drug order. Theo now quietly gives every order to two people. What should Theo do?</h1>');
  L.mc(L.card,['Keep doubling up so orders never fall through','Ask the supplier to call the tech back sooner','Raise the bar with the tech and agree on early updates'],2,
   'Yes. Doubling up acts out the low expectation. Theo should raise the bar, brainstorm what else the tech could try, and ask for early progress reports.',
   'That treats the symptom. The book says stop compensating: talk to the person, set a higher expectation and agree they’ll report early.');}},

/* ---------- PART 4: HOT MOMENTS ---------- */
{part:3,src:'Chapter 10 · I Need Time to Calm Down!',run(L){
  L.h(L.kick('learn','Hot moments')+'<h1 class="q">When you’re too angry, or already said too much</h1>'+
   L.lanes([['clock','I need time to calm down','“Never go to bed angry” is half right. Don’t leave serious problems unsolved, but you don’t have to keep talking while your body is ready for a fight. Agree to a time-out and pick it up, say, tomorrow. An agreed time-out is not silence; it’s healthy dialogue. But don’t tell <i>others</i> to calm down. It sounds patronizing.',1],
            ['chat','I said something horrible','Stories you sit on get worse. Use STATE early, before the story turns ugly. If it has built up, don’t talk while angry: set a calm time. And if you do say something awful, apologize. You can’t unsay it, but you can apologize, then STATE your path.',3]])+
   L.quote('Stories left unattended don’t get better with time—they ferment.','Patterson and coauthors, chapter 10'));
  L.done();}},
{part:3,src:'Chapter 10 · Regretting Saying Something Horrible',run(L){
  L.h(L.kick('ex','At Maplewood')+'<h1 class="q">Jordan, Theo and the words Jordan regrets</h1>');
  L.beats(L.card,[
   ['Weeks of silence','Techs keep being asked to stay late. Jordan jokes about it but never raises it with Theo, and the story “Theo doesn’t care about the techs” ferments.'],
   ['The blow-up','Another late request. Jordan snaps: “You don’t care about anyone but the budget.” Theo goes quiet.'],
   ['The time-out','Jordan feels their heart pounding and says: “I’m too wound up to do this well. Can we talk tomorrow at 9?” Theo agrees.'],
   ['The apology','Next morning Jordan starts: “I’m sorry for what I said yesterday. It was unfair.”'],
   ['STATE','Then the facts: “Techs stayed late eleven times this month. I’m starting to think tech hours come last. Is that how you see it?”']],
   'Time-out, apology, then STATE. Every step is a skill from earlier chapters.');}},
{part:3,src:'Chapter 10 · I Need Time to Calm Down!',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Healthy move or trap?',['Healthy move','Trap'],[
   ['Theo, shaking with anger: “Let’s stop here and pick it up at 4 once I’ve cooled off. Okay?”',0,'An agreed time-out is a healthy part of dialogue, not silence.'],
   ['Theo to an upset Jordan: “Take ten minutes, calm down, then come back.”',1,'Telling others to calm down comes off as patronizing. Retrace their path instead.'],
   ['Kit lets an annoyance with a coworker sit for months, hoping it fades.',1,'Stories you sit on ferment. Use STATE early.'],
   ['Jordan says something cruel, then apologizes before sharing the facts.',0,'Apologize, then STATE your path.'],
   ['Dr. Alvarez insists on finishing a heated talk tonight, whatever their state.',1,'Don’t leave problems unsolved, but forcing it while furious isn’t required, or wise.']]);}},
{part:3,src:'Chapter 10 · Advice for Tough Cases',pts:4,run(L){
  L.h(L.kick('pr','Same tools, new cases')+'<h1 class="q">Each tough-case solution reuses an earlier principle. Which one?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Learn to Look','Master My Stories','Make It Safe','STATE My Path'],[
   ['Watch behavior over time to spot a pattern, not just one event.',0,'Spotting patterns is part of Learn to Look.'],
   ['Owning that you put up with something too long, so you can see the other person as reasonable and decent.',1,'That’s telling the rest of the story.'],
   ['Apologizing after you said something horrible.',2,'Apologizing when appropriate is a Make It Safe skill.'],
   ['Describing the exact behaviors you saw, then asking “How do you see it?”',3,'Share your facts, then encourage testing: STATE.']],
   'No tough case needs brand-new tools. It needs the old ones, aimed carefully.');}}
  ]
});
</script>
</body>
</html>
