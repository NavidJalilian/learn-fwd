<title>Putting It All Together</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">

<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0011', title:'Putting it all together', minutes:18, icon:'compass',
  goals:['Use the two levers, Learn to Look and Make It Safe, when you forget everything else','Coach yourself through a crucial conversation with all seven principles','Carry the authors’ hardest-won lessons into your next tough talk'],
  parts:['Two levers','Prepare','All seven','Lessons learned'],
  read:'Read chapter 11 for the full estate conversation and the coaching table, and the Afterword for each author’s own stories.',
  glossary:{
    levers:'Two levers: the two principles that help most when you can’t recall any specific skill: Learn to Look (notice you’ve left dialogue) and Make It Safe (do something to restore safety).'
  },
  cheatsheet:[
    '<b>Lever 1, Learn to Look:</b> keep asking “Are we in dialogue, or playing games?” Saying “I think we’ve moved away from dialogue” helps everyone catch it.',
    '<b>Lever 2, Make It Safe:</b> once you see you’ve left dialogue, do <i>something</i> to make it safer. Nine times out of ten you’ll find something that helps.',
    '<b>Prepare</b> by walking the seven principles as questions: Start with Heart, Learn to Look, Make It Safe, Master My Stories, STATE My Path, Explore Others’ Paths, Move to Action.',
    'It’s not about communication. It’s about <b>results</b>: how you handle crucial moments shapes your leadership and your life.',
    'You don’t need to be perfect. <b>Pick one conversation and one idea</b>, and start now.',
    'We can do our worst even when it hardly matters. Strong emotions feel true and are often wrong.',
    'Crucial conversations belong to <b>whoever sees them first</b>, whatever their job title.',
    'You can’t force dialogue, but <b>persisting over many conversations</b> with respect and real Mutual Purpose almost always works.'
  ],
  steps:[
/* ---------- PART 1: TWO LEVERS ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Halfway through a tense talk, Jordan can’t remember what AMPP or STATE stand for. Is the conversation lost?</h1>');
  L.mc(L.card,['Not at all; noticing the trouble still helps','Yes; without the skills, it’s best to stop'],0,
   'Right. As you’ll see, just noticing you’ve left dialogue, then trying something, already helps a lot.',
   'The authors found the opposite: people who forgot the skills still improved by noticing they’d left dialogue and trying something.');}},
{part:0,src:'Chapter 11 · Two Levers',run(L){
  L.h(L.kick('learn','Lever 1: Learn to Look')+'<h1 class="q">The first lever: notice when you leave dialogue</h1>'+
   L.prose('The authors watched and interviewed people who had changed through these ideas. Some got better by picking one skill. Many got better through two <b>'+L.g('levers','levers')+'</b>: principles simple enough to use when everything else is forgotten.')+
   L.quote('Are we playing games or are we in dialogue?','Patterson and coauthors, chapter 11')+
   L.prose('People who keep asking this improve, even if they can’t recall a single skill. If you’re in silence or violence, it can’t be good, so you try something. Trying something beats doing nothing.')+
   L.note('Teams and families who learn together share words for it. A simple “I think we’ve moved away from dialogue” helps people catch themselves early.','chat'));
  L.done();}},
{part:0,src:'Chapter 11 · Two Levers',run(L){
  L.h(L.kick('learn','Lever 2: Make It Safe')+'<h1 class="q">The second lever: do something, anything, to make it safer</h1>'+
   L.prose('Lack of '+L.g('safety','safety')+' is the number one thing that stops the flow of meaning. So once you notice you’ve left dialogue, make it safer. The skills in this book are just a handful of common ways. If you simply see that your job is to make it safe, the authors say you’ll do something helpful nine times out of ten.')+
   L.flow([['eye','Notice','“We’ve left dialogue.”','Learn to Look',1],['shield','Restore','Ask a question, apologize, smile, take a short time-out','Make It Safe',2],['chat','Continue','Meaning flows again','dialogue',3]])+
   L.prose('Almost every skill in the book, from Contrasting to Priming, is a way to build safety.'));
  L.done();}},
{part:0,src:'Chapter 11 · Two Levers',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">In a staff meeting, Kit has gone quiet and is staring at the table. Theo can’t remember which skill fits. What do the two levers suggest?</h1>');
  L.mc(L.card,['Carry on, and check the book after the meeting','Notice it, then do something to make it safer'],1,
   'Yes. Theo sees Kit has left dialogue (Look) and tries something to restore safety, such as asking Kit’s view warmly (Safe).',
   'Waiting means Kit’s meaning never reaches the pool. The levers say: notice, then try something to make it safe now.');}},
{part:0,src:'Chapter 11 · Two Levers',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which lever is this?',['Learn to Look','Make It Safe'],[
   ['Dr. Alvarez says: “I think I’ve been pushing my idea on all of you.”',0,'Naming that you’ve drifted into violence is Learn to Look, out loud.'],
   ['Theo says: “I’m sorry, I cut you off. Please go on, Jordan.”',1,'An apology and an invitation restore safety.'],
   ['Jordan quietly asks themself: “Are we in dialogue, or are we just playing games?”',0,'That’s the core Learn to Look question.'],
   ['Kit suggests: “Can we take five minutes and come back to this?”',1,'A short time-out can bring safety back when things get dicey.']]);}},

/* ---------- PART 2: PREPARE ---------- */
{part:1,src:'Chapter 11 · How to Prepare for a Crucial Conversation',run(L){
  L.h(L.kick('learn','Coach yourself')+'<h1 class="q">Seven principles, seven questions</h1>'+
   L.prose('The book closes with a coaching table: each principle, its skills and questions to ask. It helps you find exactly where you’re stuck and which skill gets you unstuck. Here is a short version built from the earlier chapters.')+
   L.list([['Start with Heart','What do I really want for me, for them and for the relationship?'],
           ['Learn to Look','Are we sliding into silence or violence?'],
           ['Make It Safe','Is Mutual Purpose or Mutual Respect at risk?'],
           ['Master My Stories','What story am I telling? Is it a Victim, Villain or Helpless story?'],
           ['STATE My Path','Am I sharing facts first, tentatively, and inviting other views?'],
           ['Explore Others’ Paths','Am I curious about their view, using Ask, Mirror, Paraphrase, Prime?'],
           ['Move to Action','How will we decide? Who does what by when, and how will we follow up?']],1));
  L.done();}},
{part:1,src:'Chapter 11 · How to Prepare for a Crucial Conversation',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Jordan is preparing to raise the skipped safety check. One thought keeps looping: “Dr. Alvarez is reckless and doesn’t care about safety.” Which principle should Jordan coach themself with first?</h1>');
  L.mc(L.card,['Move to Action','Master My Stories','Explore Others’ Paths'],1,
   'Yes. “Reckless” and “doesn’t care” are story, not fact. A Villain Story like this will leak into how Jordan speaks.',
   'The loop is a story about Dr. Alvarez. Jordan needs to separate facts from that story first, which is Master My Stories.');}},
{part:1,src:'Chapter 11 · How to Prepare for a Crucial Conversation',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Where is Jordan stuck?',['Start with Heart','Make It Safe','Master My Stories','Move to Action'],[
   ['Jordan notices they mostly want to prove Dr. Alvarez wrong in front of the team.',0,'The motive has drifted toward winning. Ask: what do I really want?'],
   ['Dr. Alvarez hears Jordan’s concern as an attack on their skill and gets defensive.',1,'Mutual Respect is at risk. Step out, maybe use Contrasting, then step back in.'],
   ['Jordan has decided there’s nothing they can do because the vet is the boss.',2,'That’s a Helpless Story. Tell the rest of the story.'],
   ['The talk went well, but nobody agreed who would update the checklist.',3,'Finish clearly: who does what by when, with follow-up.']]);}},
{part:1,src:'Chapter 11 · How to Prepare for a Crucial Conversation',pts:3,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'And now?',['Learn to Look','STATE My Path','Explore Others’ Paths'],[
   ['Jordan opens with “You obviously don’t care about checklists,” before any facts.',1,'Start with facts, then a tentative story, then ask for their view.'],
   ['Dr. Alvarez goes quiet and gives one-word answers. Jordan doesn’t notice and keeps talking.',0,'Watch for signs of silence and violence in others, not just the content.'],
   ['Dr. Alvarez says, “We were slammed,” and Jordan instantly argues back.',2,'Get curious first. Ask, mirror or paraphrase to learn their path.']]);}},

/* ---------- PART 3: ALL SEVEN ---------- */
{part:2,src:'Chapter 11 · Let’s See How It All Works',run(L){
  L.h(L.kick('ex','The book’s extended case, part 1')+'<h1 class="q">You, your sister and the summerhouse</h1>');
  L.beats(L.card,[
   ['The setting','Your mother died a month ago. Now you and your sister must split the money and keepsakes. You cared for Mom almost alone for years and feel you should be paid back.'],
   ['A bad start','You open: sell the summer cottage to cover your care costs. Your sister fires back that you’re guilt-tripping her; she sent money every month.'],
   ['Start with Heart','You want fair repayment <i>and</i> a good relationship. You refuse the Fool’s Choice and look for a way to have both.'],
   ['Learn to Look','You see Mutual Purpose is missing: you’re both defending yourselves instead of discussing the estate.'],
   ['Make It Safe','You use Contrasting: you don’t want to start a fight or make her feel guilty; you do want to talk about the strain the care put on you.'],
   ['Master My Stories','Your story is “I deserve more because I did more.” You retrace it to find the facts behind it.'],
   ['STATE My Path','You share the facts: the money spent and the daily care instead of a nurse. You say you feel you did more, and ask if she sees it differently.'],
   ['Her reply','In a tense, giving-in voice: “Okay, fine. Just send me a bill.”']],
   'She said yes, but her tone says otherwise. What would you do next?');}},
{part:2,src:'Chapter 11 · Explore Others’ Paths',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Your sister just said, tensely, “Okay, fine. Just send me a bill.” What’s the best next move?</h1>');
  L.mc(L.card,['Take the yes and send the bill tonight','Point out her tone and ask what you’re missing','Repeat your facts so she sees you’re right'],1,
   'Yes. That’s Mirror, then Ask. You want her meaning in the pool too, because you also want to keep the relationship.',
   'A grudging yes isn’t real agreement, and repeating your case just pushes harder. Explore her path: mirror the tone and ask.');}},
{part:2,src:'Chapter 11 · Explore Others’ Paths',run(L){
  L.h(L.kick('ex','The book’s extended case, part 2')+'<h1 class="q">From a grudging yes to a plan</h1>');
  L.beats(L.card,[
   ['Mirror and Ask','You say her tone suggests the idea isn’t okay with her, and ask what you’re missing.'],
   ['Prime','She still holds back. You guess aloud: does she feel you’re ignoring what she contributed?'],
   ['Her path','She travelled for work, but she visited, sent money monthly and offered to pay for a nurse. Your request feels like it came out of nowhere.'],
   ['Paraphrase','You restate it: she did all she could and is surprised you want repayment. “Well, yes.”'],
   ['ABC','You <b>agree</b> she helped a lot and her visits cost money. You <b>build</b>: there were costs she didn’t know about, like a new medicine that cost twice as much and hospital bills insurance didn’t fully cover.'],
   ['Move to Action','She asks to go over the costs together. You agree to sit down tomorrow with your records and write up a plan for dividing the estate.']],
   'Every principle showed up once. None of it was magic; each step simply kept meaning flowing.');}},
{part:2,src:'Chapter 11 · Let’s See How It All Works',pts:1,run(L){
  L.h(L.kick('pr','Put it in order')+'<h1 class="q">Put the seven principles in the order they appeared in the summerhouse talk.</h1><div id="or"></div>');
  L.order(L.$('#or'),['Start with Heart','Learn to Look','Make It Safe','Master My Stories','STATE My Path','Explore Others’ Paths','Move to Action'],
   'That’s also the order of the book’s chapters. In a real talk you’ll jump around, but it’s a useful checklist for preparing.');}},
{part:2,src:'Chapter 11 · How to Prepare for a Crucial Conversation',pts:1,
 solve:async L=>{for(let r=0;r<4;r++){const b=L.$('#g'+r);if(b)b.click();}},
 run(L){
  const R=[
   ['Jordan prepares. What do they really want?',['Safe surgeries and a good working relationship with Dr. Alvarez','To make Dr. Alvarez admit they were wrong'],0,'Start with Heart: both goals, no Fool’s Choice.','That motive is winning. Dr. Alvarez will feel it and defend.'],
   ['Jordan opens the talk.',['“Twice this month surgery started before the full checklist. Can we talk about it?”','“You keep cutting corners on safety and putting animals at risk.”'],0,'Facts first: STATE My Path.','“Cutting corners” is a story. It shrinks the pool before it fills.'],
   ['Dr. Alvarez snaps: “We were slammed. I know what I’m doing.”',['“It sounds like the schedule left you no room. What was going on?”','“Being busy is no excuse for skipping it.”'],0,'Explore Others’ Paths: paraphrase and ask.','Arguing back pushes Dr. Alvarez into deeper violence.'],
   ['They agree the checklist matters. How do they finish?',['“Jordan will add a five-minute checklist slot to every surgery booking by Monday, and we’ll review it at Friday’s meeting.”','“Great, we’ll all try to be more careful from now on.”'],0,'Move to Action: who, what, when and follow-up.','“We’ll all try” names nobody and sets no date.']];
  let r=0,miss=false;
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Coach Jordan through the safety-check talk with Dr. Alvarez. Pick each line and watch the Pool of Shared Meaning.</h1>'+
   '<div class="meterrow"><div class="lb">Shared meaning</div><div class="meter"><div id="pm" style="width:10%;background:var(--ok-strong)"></div></div></div><div id="cs"></div><div id="cf"></div>');
  let lvl=10;
  const draw=()=>{const c=L.$('#cs');if(!c)return;if(r>=R.length){c.innerHTML='';return;}const x=R[r];const ord=r%2?[1,0]:[0,1];
    c.innerHTML='<h2 class="sub">'+(r+1)+' of 4 · '+x[0]+'</h2><div class="opts" style="display:flex;flex-direction:column;gap:8px">'+ord.map(k=>'<button class="btn" '+(k===x[2]?'id="g'+r+'"':'data-bad="1"')+' data-k="'+k+'">'+x[1][k]+'</button>').join('')+'</div>';
    [...c.querySelectorAll('button')].forEach(b=>b.onclick=()=>{const good=+b.dataset.k===x[2];
      if(good){lvl=Math.min(100,lvl+22);L.$('#pm').style.width=lvl+'%';L.$('#cf').innerHTML='<p class="small" style="color:var(--ok)">'+L.ic('check')+x[3]+'</p>';r++;
        if(r>=R.length){draw();L.award(!miss);L.sheet(miss?'info':'ok',miss?'Back on track':'A full pool','Heart, facts, curiosity and a clear finish. With the pool full, Jordan and Dr. Alvarez reached a decision both can stand behind.');L.done();}else draw();}
      else{miss=true;lvl=Math.max(5,lvl-10);L.$('#pm').style.width=lvl+'%';L.fb(L.$('#cf'),'<b>The pool shrinks.</b> '+x[4]+' Try the other line.','no');}});};
  draw();}},

/* ---------- PART 4: LESSONS LEARNED ---------- */
{part:3,src:'Chapter 11 · Conclusion—It’s Not About Communication, It’s About Results',run(L){
  L.h(L.kick('learn','It’s about results')+'<h1 class="q">The book was never really about communication</h1>'+
   L.prose('The authors say they set out to find <b>crucial moments</b>: times when what people do has an outsized effect on their organizations, relationships and lives. Again and again, those moments were emotionally and politically risky conversations.')+
   L.prose('So the quality of your leadership and your life depends on how you handle those moments. Their advice for the end of the book: pick a crucial conversation you could improve <b>now</b>, find the principle or skill that would help, and try it.')+
   L.note('You don’t need to be perfect, and halting progress is fine. Keep at it, and a little change can lead to a lot of progress.','leaf'));
  L.done();}},
{part:3,src:'Afterword · What I’ve Learned About Crucial Conversations in the Past Ten Years',run(L){
  L.h(L.kick('learn','Afterword')+'<h1 class="q">Ten years on, each author shares a lesson. Flip each card.</h1>');
  L.flips(L.card,[
   ['Al','Al argued with a parking attendant over three dollars and wasn’t very nice. Lesson: we can do our worst even when it hardly matters, so stay alert. And a reader in IT taught him that crucial conversations belong to the first person who sees them, whatever their job.'],
   ['Joseph','Joseph found himself furious at his son, sure a tirade was his duty. Asking what he really wanted and why a decent person would act that way changed his feelings in seconds. Lesson: strong emotions feel true in the moment but are usually wrong, and we can change them.'],
   ['Kerry','Many readers say the book helped even though they only skimmed it. Simply noticing “this is a crucial conversation” makes them bring their best. Lesson: it’s not all or nothing. Grab one idea and use it.'],
   ['Ron','The skills can’t force anyone into dialogue; others choose. But “conversations” is plural. Ron’s daughter only opened up after weeks of patient, respectful attempts. Lesson: persist over time, and people almost always join you.']],
   'Four authors, one message: stay alert, doubt your hot emotions, start small, and keep going.');}},
{part:3,src:'Afterword · Al',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Dr. Alvarez, calm in every surgery, loses their temper with a courier over a package five minutes late. Which author’s lesson fits?</h1>');
  L.mc(L.card,['Al: we can do our worst even when little is at stake','Ron: dialogue can’t be forced on someone else'],0,
   'Yes. There’s no cruise control. Low stakes don’t protect you, so watch for your early warning signs.',
   'The courier never refused dialogue. Dr. Alvarez blew up over something small, which is Al’s lesson.');}},
{part:3,src:'Afterword · What I’ve Learned About Crucial Conversations in the Past Ten Years',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which Afterword lesson applies?',['Hot emotions often mislead','It belongs to whoever sees it','Grab one idea and start','Persist over many talks'],[
   ['A front-desk worker notices clients are confused by bills, but thinks only the manager can raise it.',1,'Position doesn’t matter. The first person to see a crucial conversation owns it.'],
   ['Theo is certain Jordan is “just negative” and feels sure a sharp rebuke is deserved.',0,'That certainty is exactly when to doubt the feeling and check the story.'],
   ['Kit feels they must master every skill before ever raising the records problem.',2,'It’s not all or nothing. Pick one idea and use it in the next talk.'],
   ['Harriet Cole ignored Maplewood’s first two respectful calls about the bill.',3,'One talk is rarely the whole story. Keep showing respect and Mutual Purpose.']]);}},
{part:3,src:'Afterword · Ron',pts:1,run(L){
  L.h(L.kick('pr','Apply it')+'<h1 class="q">Harriet Cole opened up to Theo on the phone, but has since turned down two invitations to go through the overnight charges. What does Ron’s lesson suggest?</h1>');
  L.mc(L.card,['The skills failed, so stop calling Harriet','Find a firmer tactic that makes Harriet talk','Keep trying with respect and real goodwill'],2,
   'Yes. The skills don’t control others, but steady respect and Mutual Purpose over many conversations build safety, and people almost always come round.',
   'The skills aren’t a way to control or manipulate anyone, and one refusal isn’t the end. Ron’s advice is to persist with respect over time.');}},
{part:3,src:'Chapter 11 · Conclusion—It’s Not About Communication, It’s About Results',pts:1,run(L){
  L.h(L.kick('pr','Your next step')+'<h1 class="q">The course is over. What would the authors want you to do next?</h1>');
  L.mc(L.card,['Wait until every skill feels natural before trying','Re-read all eleven chapters, then decide','Pick one crucial conversation and one idea to try'],2,
   'Yes. Pick a real conversation, choose the principle that would help most and try it. Progress doesn’t need perfection.',
   'Waiting for mastery or another read-through delays the results. The authors say: pick a conversation you could improve now and try one idea.');}}
  ]
});
</script>
</body>
</html>
