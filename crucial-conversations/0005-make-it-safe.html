<html lang="en">

<title>Make It Safe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">

</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0005', title:'Make it safe', minutes:20, icon:'shield',
  goals:['Step out of a heated talk, rebuild safety, then step back in','Tell whether Mutual Purpose or Mutual Respect is at risk','Use an apology, Contrasting or CRIB to fix it'],
  parts:['Step out','Which condition','Apologize, contrast','CRIB'],
  read:'Read chapter 5 of the book for the full Yvonne and Jotham conversation and more Contrasting practice.',
  glossary:{
    contrasting:'Contrasting: a don’t/do statement. First say what you don’t mean (to clear up a misunderstanding), then what you do mean.',
    crib:'CRIB: four steps to create a Mutual Purpose: Commit to seek it, Recognize the purpose behind the strategy, Invent a Mutual Purpose, Brainstorm new strategies.',
    strategy:'Strategy: the specific thing someone asks for (“leave at six”). The purpose is why they want it (“enough rest to work safely”).'
  },
  cheatsheet:[
    'When someone goes to silence or violence, <b>step out</b> of the content, <b>make it safe</b>, then <b>step back in</b>. Don’t sugarcoat the message.',
    'Ask which condition is at risk. <b>Mutual Purpose</b> (entrance): do they believe I care about their goals and trust my motives? <b>Mutual Respect</b> (continuance): do they believe I respect them?',
    'Purpose at risk looks like debate, defensiveness, hidden agendas, accusations, circling back. Respect at risk looks like anger, pouting, name-calling, yelling, threats.',
    'To respect someone you struggle with, look for how you are <b>alike</b>, not how you differ.',
    '<b>Apologize</b> when you really did cause harm. It takes a change of heart: give up saving face and being right.',
    '<b>Contrasting</b> fixes a misunderstanding: “I don’t mean… I do mean…”. The <i>don’t</i> matters most. Use it as prevention or first aid. Never water down your point.',
    'Real cross-purposes? <b>CRIB</b>: Commit to seek Mutual Purpose, Recognize the purpose behind the strategy, Invent a Mutual Purpose, Brainstorm new strategies.',
    'Aim for progress, not perfection. Prepare before a crucial conversation.'
  ],
  steps:[
/* ---------- PART 1: STEP OUT ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">A friend tells you something hard about yourself, and somehow you don’t get defensive. What most likely made that possible?</h1>');
  L.mc(L.card,['They chose very gentle, careful words','You believed they were on your side'],1,
   'Right. You trusted their intent, so you could hear tough content. This lesson is about building that trust in the moment.',
   'Gentle words help a little, but people take hard news well mainly when they trust your intent. Kind words with a suspected motive still feel like an attack.');}},
{part:0,src:'Chapter 5 · Step Out. Make It Safe. Then Step Back In',run(L){
  L.h(L.kick('learn','Step out, make it safe, step back in')+'<h1 class="q">When safety drops, stop talking about the topic for a moment</h1>'+
   L.prose('In the last lesson you learned to spot when people slide into '+L.g('silence','silence')+' or '+L.g('violence','violence')+'. That’s a sign they don’t feel '+L.g('safety','safe')+'. The book compares how people respond:')+
   L.tiers([['x','The worst','Ignore the need for safety and say whatever is on their mind. Or decide the topic is hopeless and go quiet.','no safety at all'],
            ['alert','The good','See that safety is low, but water down or sugarcoat the message. The real problem never gets fixed.','safety, but no truth'],
            ['shield','The best','Step out of the content, rebuild safety, then step back in and talk about the real issue, with no faking.','safety and truth',true,'Do this']])+
   L.prose('Once safety is back, you can talk about almost anything.'));
  L.done();}},
{part:0,src:'Chapter 5 · opening story, summarized',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">Yvonne and Jotham try to talk about their love life</h1>');
  L.beats(L.card,[
   ['The pattern','A couple, Yvonne and Jotham, disagree about how often they’re intimate. For years they’ve acted it out instead of talking it out: Jotham pouts for days, Yvonne sometimes gives in and then resents it.'],
   ['The try','Yvonne picks a calm moment on the couch and asks to talk about the night before.'],
   ['The jab','Jotham answers with a sarcastic remark, then an angry complaint. Yvonne walks out.'],
   ['What she missed','She focused on <i>what</i> Jotham said. His sarcasm was a form of silence: a sign he didn’t feel safe enough to say his concern openly.'],
   ['The better move','Step out. Yvonne could ask to change gears, say she isn’t trying to make him feel guilty, and say she wants a solution that works for both of them.']],
   'Sarcasm and anger are signals. Answer the safety problem first, not the words.');}},
{part:0,src:'Chapter 5 · Step Out. Make It Safe. Then Step Back In',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Theo raises the overtime problem. Jordan rolls their eyes: “Oh great, another speech.” What would the best at dialogue do next?</h1>');
  L.mc(L.card,['Drop the subject and send an email later','Pause the topic and rebuild safety first','Soften it: “It’s really not a big deal”'],1,
   'Jordan’s jab is a sign of low safety. Step out, make it safe, then come back to overtime.',
   'Going quiet or watering the message down both leave the real problem unsolved. Step out, rebuild safety, then return to overtime.');}},
{part:0,src:'Chapter 5 · Step Out. Make It Safe. Then Step Back In',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Worst, good or best?',['The worst','The good','The best'],[
   ['Dr. Alvarez sees Kit go pale and keeps listing every mistake anyway.',0,'Ignoring the drop in safety and pushing on is the worst response.'],
   ['Theo wants to raise Jordan’s break-room jokes but opens with ten minutes of praise and only hints at the jokes.',1,'Theo sees safety is low but hides the message. The real issue never gets said.'],
   ['Jordan sees Theo tense up, says “I’m not here to attack you, I want to fix this together,” then names the issue.',2,'Step out, make it safe, step back in, with the real topic still on the table.'],
   ['Kit feels the room get tense and decides the topic can never be raised.',0,'Concluding the topic is unsafe and going silent is the worst response.']]);}},

/* ---------- PART 2: WHICH CONDITION ---------- */
{part:1,src:'Chapter 5 · Notice Which Condition Is at Risk',run(L){
  L.h(L.kick('learn','Two conditions of safety')+'<h1 class="q">First find out which one is at risk. Each needs a different fix.</h1>'+
   L.lanes([['target','Mutual Purpose','<b>The entrance condition.</b> Why talk at all? People must believe you care about their goals, and trust your motives.<p class="small">Signs it’s at risk: debate, defensiveness, hidden agendas, accusations, circling back to the same point.</p>',2],
            ['people','Mutual Respect','<b>The continuance condition.</b> Can we keep going? People must believe you respect them.<p class="small">Signs it’s at risk: emotions turn from fear to anger; pouting, name-calling, yelling, threats.</p>',3]])+
   L.quote('Respect is like air. As long as it’s present, nobody thinks about it.','Patterson, Grenny, McMillan and Switzler, chapter 5')+
   L.prose('Take it away and it’s all anyone can think about. The talk is no longer about the topic. It’s about defending dignity.'));
  L.done();}},
{part:1,src:'Chapter 5 · Mutual Purpose—the Entrance Condition',run(L){
  L.h(L.kick('learn','The “mutual” is real')+'<h1 class="q">Mutual Purpose is not a technique</h1>'+
   L.prose('If your real goal is to get your way, people will sense it, and safety will collapse. Before you start, check your motives with the Start with Heart questions: what do I want for me, for others, for the relationship?')+
   L.prose('Then <b>look for the mutuality</b>. The book’s example: a boss keeps breaking commitments. If you go in only to make your life easier, you’ll sound selfish. But if the broken promises cost the boss deadlines, money or output they care about, that’s a shared goal.')+
   L.note('Open with what they care about: “I have some ideas that could make the monthly report more reliable and cheaper. It’s a sensitive topic, but I think it will help.”','chat'));
  L.done();}},
{part:1,src:'Chapter 5 · Can You Respect People You Don’t Respect?',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">Two sides who couldn’t stand each other</h1>');
  L.beats(L.card,[
   ['The setup','A factory strike ends after six months. Workers come back under a contract worse than what they asked for. Everyone is furious.'],
   ['The exercise','One of the authors puts managers and union leaders in separate rooms. Each writes its goals for the company on big sheets of paper.'],
   ['The swap','The groups swap rooms and look for anything, even a scrap, they have in common.'],
   ['The surprise','The lists are almost the same: a profitable company, stable jobs, quality products, a good effect on the town.'],
   ['The shift','Each side sees its own petty tactics in the other’s. Their “sins” came more from their roles than their character. Respect returns, and so does dialogue.']],
   'You don’t have to like everything about someone. Look for how you’re <b>alike</b>, not how you differ, and respect gets easier.');}},
{part:1,src:'Chapter 5 · Notice Which Condition Is at Risk',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Dr. Alvarez proposes the second clinic. Theo keeps circling back: “But who will actually staff it?” They argue in loops. Which condition is most likely at risk?</h1>');
  L.mc(L.card,['Mutual Respect','Mutual Purpose'],1,
   'Debate and circling back are signs of Mutual Purpose at risk. Theo may doubt that Dr. Alvarez cares about the staff’s goals.',
   'Nobody is name-calling or yelling. Debate and circling back point to Mutual Purpose: Theo doubts the clinic plan serves the staff’s goals too.');}},
{part:1,src:'Chapter 5 · Watch for signs',pts:5,run(L){
  L.h(L.kick('pr','Read the signs')+'<h1 class="q">Which condition is at risk in each Maplewood moment?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Mutual Purpose','Mutual Respect'],[
   ['Kit suspects Theo’s “quick chat” is really about building a case to fire them.',0,'Kit doesn’t trust Theo’s motives. That’s purpose.'],
   ['Jordan snaps “I’ve done this twelve years, don’t talk down to me.”',1,'Jordan feels belittled and is defending their dignity.'],
   ['Dr. Alvarez and Theo argue the same staffing point for the third meeting in a row.',0,'Circling back to the same topic signals purpose at risk.'],
   ['After Theo’s sigh, Jordan stops talking and pouts for the rest of the meeting.',1,'Pouting after a sign of contempt points to respect.'],
   ['Theo wonders if Jordan’s rota idea is a hidden way to get the best shifts.',0,'Suspecting a hidden agenda is a purpose problem.']],
   'Purpose problems look like a fight over motives. Respect problems look like a fight over dignity.');}},
{part:1,src:'Chapter 5 · Mutual Respect—the Continuance Condition',pts:1,
 solve:async L=>{const b=L.$('#tg').children;b[0].click();b[1].click();},
 run(L){
  const V=[['Without the eye roll','<b>Jordan:</b> “Fine, here’s an idea: split the late shifts by week.”<br><b>Theo:</b> “Okay, let’s look at that.”<br><span class="small" style="color:var(--ok)">The talk stays on overtime.</span>'],
           ['With the eye roll','<b>Jordan:</b> “Fine, here’s an idea: split the late shifts by week.”<br><i>Theo glances at the ceiling.</i><br><b>Jordan:</b> “Oh, sorry, is my idea boring you?”<br><span class="small" style="color:var(--no)">The talk is now about Jordan’s dignity, not overtime.</span>']];
  const seen=new Set();
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Same meeting, same words. Theo privately thinks Jordan is “just negative.” Tap both versions.</h1><div id="tg"></div>'+
   '<div style="background:var(--soft);border-radius:16px;padding:14px;margin:8px 0;min-height:110px" id="sc"><span class="small">Choose a version above.</span></div><div id="tq"></div>');
  V.forEach((v,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=v[0];b.onclick=()=>{[...L.$('#tg').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(j);L.$('#sc').innerHTML=v[1];
    if(seen.size===2&&!L.$('#tq').innerHTML){const q=L.$('#tq');q.innerHTML='<h2 class="sub">What sank the second version?</h2>';
      L.mc(q,['Theo’s hidden disrespect leaked out','Jordan’s idea was not good enough','They had no shared goal at all'],0,
       'Respect is like air: one small gesture let Theo’s private opinion show, and the topic switched to defending dignity.',
       'The idea and the goal were the same in both versions. What changed was one eye roll, which let Theo’s hidden disrespect show.');}};L.$('#tg').appendChild(b);});}},

/* ---------- PART 3: APOLOGIZE, CONTRAST ---------- */
{part:2,src:'Chapter 5 · Apologize When Appropriate',run(L){
  L.h(L.kick('learn','Skill 1 · Apologize when appropriate')+'<h1 class="q">If you really did cause harm, start with a sincere apology</h1>'+
   L.prose('An apology sincerely expresses sorrow for your part in causing (or not preventing) pain or trouble for others.')+
   L.prose('It only works with a <b>change of heart</b>. You give up saving face, being right or winning, and focus on what you really want. That costs a little ego, but it buys back dialogue.')+
   L.flow([['chat','Apologize','for your part, sincerely'],['eye','Watch','did safety come back?'],['arrow','Return','explain, then fix the issue']]));
  L.done();}},
{part:2,src:'Chapter 5 · Contrast to Fix Misunderstanding',run(L){
  L.h(L.kick('learn','Skill 2 · Contrasting')+'<h1 class="q">When they misread your intent, don’t apologize. Contrast.</h1>'+
   L.prose('Often people feel disrespected or suspect a bad motive when you meant no harm. An apology would be fake here. Use '+L.g('contrasting','Contrasting')+', a don’t/do statement:')+
   L.lanes([['x','The don’t','Name the worry: what you <i>don’t</i> mean or intend. This part matters most, because it clears the misunderstanding.',4],
            ['check','The do','Then say what you <i>do</i> mean: your respect, your real purpose.',2]])+
   L.list([['Not taking it back','Contrasting doesn’t water down your point. It puts it in proportion, so it doesn’t hurt more than it should.'],
           ['Prevention or first aid','Use it before a remark you expect to sting, or after someone takes you wrong.']],1));
  L.done();}},
{part:2,src:'Chapter 5 · What to Do Once You Step Out',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">The team that pulled an all-nighter</h1>');
  L.beats(L.card,[
   ['The setup','A team works all night to show their new process to a visiting vice president. A crisis comes up: you skip the tour to save a key plan, and forget to tell them.'],
   ['The blow-up','You rush past them later. They’re furious: “We pulled an all-nighter and you didn’t even text.”'],
   ['The trap','Now <i>you</i> feel attacked, so you defend the choice. Both sides are fighting for respect.'],
   ['Apologize','You did cause harm by not calling. So: say you’re sorry you didn’t let them know, after all their work.'],
   ['Contrast','They also think you don’t value their work, which isn’t true. <b>Don’t:</b> you never meant to suggest their work didn’t matter. <b>Do:</b> you think it’s excellent.'],
   ['Step back in','Now explain what happened, and offer to bring the VP by tomorrow.']],
   'Apologize for what you did wrong. Contrast for what they misunderstood. Then return to the issue.');}},
{part:2,src:'Chapter 5 · Contrast to Fix Misunderstanding',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Theo tells Kit the records must be done faster. Kit looks crushed, as if Theo thinks Kit is a poor vet. What should Theo say?</h1>');
  L.mc(L.card,['“Honestly, the records aren’t a big deal.”','“I’m so sorry I brought it up at all.”','“I don’t doubt your vet work. The records just matter.”'],2,
   'That’s Contrasting: first the misunderstanding (the don’t), then the real point, which stays intact.',
   'Taking it back waters the message down, and an apology would be fake: Theo did nothing wrong. Contrasting clears up the misunderstanding and keeps the point.');}},
{part:2,src:'Chapter 5 · What to Do Once You Step Out',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Apologize or contrast?',['Apologize','Use Contrasting'],[
   ['Theo rearranged the tech rota that Jordan built for years, without asking Jordan first.',0,'Theo really did cause harm. Start with a sincere apology.'],
   ['Dr. Alvarez asks Jordan to double-check a dose. Jordan hears: “I don’t trust you.”',1,'Nothing wrong was done. Jordan misread the intent, so clarify it.'],
   ['Kit forgot to tell Jordan a surgery moved, and Jordan prepped the room for nothing.',0,'Kit’s slip caused real trouble. Apologize first.'],
   ['Theo is about to raise Jordan’s break-room jokes and expects Jordan to feel attacked.',1,'Contrasting works as prevention, before a remark you expect to sting.'],
   ['Jordan thinks Theo’s overtime survey is a trick to cut tech pay.',1,'A suspected bad motive with no real harm done calls for Contrasting.']]);}},
{part:2,src:'Chapter 5 · Contrast to Fix Misunderstanding',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Theo is about to raise Kit’s late records. Tap each piece to build a Contrasting statement that prevents a misunderstanding.</h1>');
  L.sentence(L.card,[['To be honest,','I don’t want you to think','Don’t take this wrong, but'],['I doubt your skill with animals.','the records are no big deal.'],['I think you’re a great vet,','I guess you’re doing okay,'],['and the records need to be done within a day.','so let’s just forget about the records.']],[1,0,0,0],
   [['That doesn’t name the misunderstanding you want to prevent.','That phrase warns of an attack without clearing up any worry.'],['That waters down the real point. The don’t should name Kit’s likely fear.'],['That faint praise won’t convince Kit of your respect.'],['Dropping the request takes back your point. Contrasting keeps it.']],
   'The don’t names Kit’s fear, the do confirms respect, and the real request stays fully in place.');}},

/* ---------- PART 4: CRIB ---------- */
{part:3,src:'Chapter 5 · Create a Mutual Purpose',run(L){
  L.h(L.kick('learn','Skill 3 · Create a Mutual Purpose')+'<h1 class="q">When you truly want different things, use CRIB</h1>'+
   L.prose('Sometimes there’s no misunderstanding: you really are at cross-purposes. The worst <b>compete</b> or <b>give in</b>. The good jump straight to <b>compromise</b>. The best use four steps, '+L.g('crib','CRIB')+':')+
   L.list([['Commit to seek Mutual Purpose','Say out loud that you’ll stay in the talk until you find something that works for both. Drop the belief that your option is the only good one.'],
     ['Recognize the purpose behind the strategy','Ask “Why do you want that?” What people demand is their '+L.g('strategy','strategy')+', not their real purpose.'],
     ['Invent a Mutual Purpose','Still at odds? Move to a higher or longer-term goal you both care about more.'],
     ['Brainstorm new strategies','With a shared purpose, look for new options that serve everyone.']],3));
  L.done();}},
{part:3,src:'Chapter 5 · Recognize the Purpose Behind the Strategy',run(L){
  L.h(L.kick('ex','A worked example from the book')+'<h1 class="q">Movie or stay home?</h1>');
  L.beats(L.card,[
   ['The impasse','One partner wants to go to a movie. The other wants to stay home. Movie, home, movie: they seem stuck.'],
   ['Ask why','“Why do you want to stay home?” “I’m tired of the hassle of the city.” So: peace and quiet.'],
   ['Ask back','“Why do you want a movie?” “To spend time with you away from the kids.”'],
   ['Spot the purposes','Peace and quiet, plus time together away from the kids. Those don’t clash. Only the strategies did.'],
   ['Brainstorm','Something quiet and away: how about a drive up the canyon?'],
   ['When purposes clash','If they truly can’t both be met, invent a higher one. A couple torn over a job move can agree the family comes before any career.']],
   'Strategies clash far more often than purposes. Ask “why” before you fight about “what.”');}},
{part:3,src:'Chapter 5 · Recognize the Purpose Behind the Strategy',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Jordan insists: “Techs leave at six, full stop.” Which reply recognizes the purpose behind that strategy?</h1>');
  L.mc(L.card,['“What would leaving at six give the techs?”','“Six is impossible on surgery days.”','“Fine, let’s meet halfway at seven.”'],0,
   'Asking why uncovers the real want, like rest or safety, which may have other solutions.',
   'Arguing or splitting the difference stays stuck on strategies. First ask why Jordan wants six.');}},
{part:3,src:'Chapter 5 · Create a Mutual Purpose',pts:1,run(L){
  L.h(L.kick('pr','Put CRIB in order')+'<h1 class="q">Theo and Jordan are deadlocked on overtime. Put Theo’s moves in CRIB order.</h1>');
  L.order(L.card,[
   '“We keep pushing at each other. I’ll stay in this until we find something that works for both of us.”',
   '“What would leaving on time give the techs? And here’s what I need: every animal seen before close.”',
   '“Could we agree that no animal and no tech should pay for our staffing gaps?”',
   '“So what could we try? A late rota, a shorter surgery list on Fridays, a relief tech?”'],
   'Commit, Recognize, Invent, Brainstorm. Each step builds the safety the next one needs.',['C','R','I','B']);}},
{part:3,src:'Chapter 5 · Recognize the Purpose Behind the Strategy',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Strategy or purpose?',['Strategy','Purpose'],[
   ['“Techs leave at six, no exceptions.”',0,'That’s a specific demand: a way to get something.'],
   ['Techs get enough rest to work safely.',1,'That’s why someone might ask to leave at six.'],
   ['“Open a second clinic next spring.”',0,'A specific plan. The purpose behind it might be serving more pets.'],
   ['Every animal on the list gets seen today.',1,'That’s the want behind keeping techs late.'],
   ['“Hire two more techs right now.”',0,'One way to get relief. Asking why might reveal other options.']]);}},
{part:3,src:'Chapter 5 · Invent a Mutual Purpose',pts:1,run(L){
  L.h(L.kick('pr','Invent a higher goal')+'<h1 class="q">Dr. Alvarez wants the second clinic to grow the practice. Jordan wants the team not to break. Asking why didn’t close the gap. Which shared purpose should they try?</h1>');
  L.mc(L.card,['Open it, but six months later than planned','A Maplewood that lasts, with care and staff intact','Let the staff vote and live with the result'],1,
   'That’s a higher, longer-term goal both care about more than their current positions. Now they can brainstorm.',
   'Delaying or voting are strategies, and a vote just makes winners and losers. Inventing a Mutual Purpose means finding a bigger goal both care about.');}},
{part:3,src:'Chapter 5 · But I Could Never Do That!',run(L){
  L.h(L.kick('learn','But I could never do that!')+'<h1 class="q">Aim for progress, not perfection</h1>'+
   L.prose('The book admits these scripts look easier on paper. But they come from watching skilled people in real talks, and you already do this on your best days.')+
   L.list([['clock','Slow down','When adrenaline rises, take a breath before you answer.'],
     ['pencil','Prepare','Before a crucial conversation, pick the one or two skills you’ll most likely need.'],
     ['trend','Small gains count','A little more clarity in a few high-stakes talks pays off a lot.']],2));
  L.done();}}
  ]
});
</script>
</body>
</html>
