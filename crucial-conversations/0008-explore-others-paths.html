<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explore Others’ Paths</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">

</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0008', title:'Explore others’ paths', minutes:20, icon:'eye',
  goals:['Stay curious and patient when someone clams up or blows up','Use Ask, Mirror, Paraphrase and Prime to help them retrace their path','Answer with Agree, Build and Compare instead of a debate'],
  parts:['Get ready','Retrace','AMPP','Your turn'],
  read:'Read chapter 8 of the book for the full conversation with Wendy and the shift-change meeting.',
  glossary:{
    mirror:'Mirroring: calmly describing how someone looks or sounds, especially when their tone doesn’t match their words.',
    prime:'Priming: offering your best guess at what someone is thinking or feeling, when nothing else has helped them open up.',
    abc:'ABC: how to share your view after listening: Agree where you agree, Build on what was left out, Compare when you differ.',
    'violent-agreement':'Violent agreement: people arguing hard while actually agreeing on almost everything that matters.'
  },
  cheatsheet:[
    'People clam up or blow up because they feel <b>unsafe</b>. You can’t force dialogue, but you can make it safer.',
    '<b>Start with Heart:</b> be sincere, be curious, stay curious (“why would a reasonable, rational, decent person say this?”), be patient.',
    'You join their Path to Action <b>already in progress</b>. Help them walk it back: from actions, to feelings, to story, to facts.',
    '<b>AMPP:</b> Ask (invite them), Mirror (calmly name the emotion you see), Paraphrase (their story, in your words), Prime (your best guess, when all else fails).',
    'Pushing too hard feels like prying. If they won’t open up, exit gracefully or <b>ask what they want</b> to happen.',
    '<b>Understanding isn’t agreeing.</b> You will get your turn later.',
    '<b>ABC:</b> Agree when you agree. Build when something’s missing. Compare when you differ: “I think I see it differently.”'
  ],
  steps:[
/* ---------- PART 1: GET READY ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Harriet Cole, a long-time client, shouts at the front desk about Biscuit’s surgery bill, then storms out. What is more likely to get Harriet talking again?</h1>');
  L.mc(L.card,['Finding out what’s really upsetting Harriet','Emailing Harriet the charges, line by line'],0,
   'Harriet’s anger has a source. Until you know what it is, more numbers may just feel like being told they’re wrong. This lesson is about finding that source.',
   'The charges may be correct, but Harriet isn’t ready to hear them. That anger has a source, and until you find it, more numbers can feel like a lecture.');}},
{part:0,src:'Chapter 8 · How to Listen When Others Blow Up or Clam Up',run(L){
  L.h(L.kick('learn','When they go to silence or violence')+'<h1 class="q">It’s their outburst. Why is it your job?</h1>'+
   L.prose('When someone clams up or blows up, it’s tempting to say: their feelings, their problem. But you’ll never solve anything together until everyone adds to the '+L.g('pool','pool')+'.')+
   L.prose('People go to '+L.g('silence','silence')+' or '+L.g('violence','violence')+' because they feel unsafe. They believe something bad will happen to them if they talk honestly with you. You can’t force them into dialogue, but you can make it <b>safer</b>.')+
   L.flow([['shield','Earlier tools','Apologize, Contrasting, find a Mutual Purpose',2],['eye','New tool','Explore their Path to Action: invite their facts, stories and even their ugly feelings',1]]));
  L.done();}},
{part:0,src:'Chapter 8 · Start with Heart—Get Ready to Listen',run(L){
  L.h(L.kick('learn','Get ready to listen')+'<h1 class="q">Four attitudes to bring</h1>'+
   L.list([['check','Be sincere','If you ask, be ready to hear the answer. “How are you?” as small talk tells people not to say anything real.'],
     ['bulb','Be curious','At the moment most people get furious, get curious. What’s behind this? Practice first when you’re not the target, say in a meeting.'],
     ['eye','Stay curious','When their story is unflattering to you, you’ll want to invent a bad motive for it. Instead ask: why would a reasonable, rational, decent person say this?'],
     ['clock','Be patient','Emotions fade more slowly than thoughts. Even once you agree, they may still sound heated. Give their feelings time to catch up.']],1));
  L.done();}},
{part:0,src:'Chapter 8 · Start with Heart—Get Ready to Listen',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">The patient who said “mostly”</h1>');
  L.beats(L.card,[
   ['The question','A patient is leaving a clinic, looking uneasy. The desk clerk asks if the procedure went all right.'],
   ['The hint','“Mostly,” she says. That word is a flag that something went wrong.'],
   ['Version 1: fake interest','The clerk says “Good. Next!” The question was never real.'],
   ['Version 2: curious','The clerk says it sounds like there was a problem, and asks if that’s right. She opens up: it hurt, and isn’t the doctor rather old?'],
   ['The danger','Now the clerk might snap, “How ungrateful!” and invent a bad motive. Staying curious means asking why a decent person would feel this way.']],
   'Her tone of voice and his made it safe, or unsafe, to say what she really thought.');}},
{part:0,src:'Chapter 8 · Start with Heart—Get Ready to Listen',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Theo finally reaches Harriet by phone and asks how Biscuit is recovering. “Fine. Mostly,” Harriet says, flatly. What should Theo say next?</h1>');
  L.mc(L.card,['“Glad to hear it! Now, about that bill…”','“Good. Call us if you need anything.”','“It sounds like something isn’t fine. Is that right?”'],2,
   'Theo picks up the hint and makes it safe to say more. That’s sincere, curious listening.',
   'Moving on treats the question as small talk. “Mostly” is a hint. Theo should pick it up and make it safe to say more.');}},

/* ---------- PART 2: RETRACE ---------- */
{part:1,src:'Chapter 8 · Encourage Others to Retrace Their Path',run(L){
  L.h(L.kick('learn','Joining in progress')+'<h1 class="q">Every sentence has a history</h1>'+
   L.prose('When someone blows up at you, they have already seen and heard things, told themselves a story and felt something. You arrive at the <b>end</b> of their '+L.g('path','Path to Action')+', like tuning into a mystery show halfway through.')+
   L.flow([['eye','Facts','missed'],['book','Story','missed'],['flame','Feel','missed'],['pointer','Act','where you join',4]])+
   L.prose('Missing the setup, and facing their worst behavior, we get defensive and build our own hasty path. To <b>break the cycle</b>, step out, make it safe, and help them walk their path backward: from feelings, to their story, to what they saw. That’s where the problem can actually be solved.'));
  L.done();}},
{part:1,src:'Chapter 8 · Encourage Others to Retrace Their Path',pts:1,
 solve:async L=>{for(let i=0;i<4;i++){const b=L.$('#rw');if(b)b.click();}},
 run(L){
  const P=[['pointer','Act','Shouts at the front desk, then stops answering calls and hints at a bad online review.'],
           ['flame','Feel','Embarrassed, betrayed and scared about money.'],
           ['book','Story','“They ran up the bill because they knew I’d pay anything for Biscuit.”'],
           ['eye','Facts','The estimate Harriet signed said about $1,800. The bill says $2,600, with two extra nights in the hospital Harriet didn’t expect.']];
  let n=1;
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Theo joins Harriet’s path at the end. Press rewind to walk it back toward the source.</h1>'+
   '<div class="ladder" id="hp"></div><button class="btn pri" id="rw">'+L.ic('cycle')+'Rewind one step</button><div id="hq"></div>');
  const draw=()=>{L.$('#hp').innerHTML=P.slice(0,n).map((x,j)=>(j?'<div class="conn"></div>':'')+'<div class="rung'+(j===n-1?' cur':'')+'"><small>'+L.ic(x[0])+' '+x[1]+'</small>'+x[2]+'</div>').join('');};draw();
  L.$('#rw').onclick=function(){n++;draw();if(n>=P.length){this.remove();
    const q=L.$('#hq');q.innerHTML='<h2 class="sub">Where can Theo and Harriet actually solve the problem?</h2>';
    L.mc(q,['At the facts and the story behind Harriet’s feelings','At Harriet’s threat to post a bad review'],0,
     'The review threat is just the action at the end. The fix lives at the source: the surprise extra nights and the story Harriet built on them.',
     'Arguing about the review fights the end of the path. The feelings came from the story, and the story came from the surprise charges. Solve it there.');}};}},
{part:1,src:'Chapter 8 · Inquiry Skills',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">What tells you it’s time to help someone retrace their path?</h1>');
  L.mc(L.card,['They are going quiet or getting heated','They have made a factual mistake','They have finished telling their story'],0,
   'Silence or violence is the cue. If you don’t get to the source of their feelings, you’ll live with the effects.',
   'A wrong fact or a finished story isn’t the signal. The cue is behavior: they’re moving to silence or violence, and clearly upset.');}},

/* ---------- PART 3: AMPP ---------- */
{part:2,src:'Chapter 8 · Ask, Mirror, Paraphrase, or Prime (AMPP)',run(L){
  L.h(L.kick('learn','Four listening tools')+'<h1 class="q">AMPP: Ask, Mirror, Paraphrase, Prime</h1>'+
   L.prose('The '+L.g('ampp','AMPP')+' tools make it safe to speak frankly. They work whether the person has clammed up or blown up.')+
   L.tiers([['chat','Ask','Simply invite them: “What’s going on?” “I’d really like to hear your view.”','to get things rolling'],
            ['eye','Mirror','Calmly describe what you see: “You say it’s fine, but you sound upset.”','to confirm feelings'],
            ['pencil','Paraphrase','Put their story in your own words, shorter: “So you feel…”','to acknowledge the story'],
            ['bulb','Prime','Offer your best guess at what they think or feel.','when you’re getting nowhere']]));
  L.done();}},
{part:2,src:'Chapter 8 · Mirror to Confirm Feelings',run(L){
  L.h(L.kick('learn','Ask and mirror')+'<h1 class="q">Start with what you can see</h1>'+
   L.prose('<b>Ask</b> first. Often a sincere invitation is all it takes: you stop filling the pool with your meaning and step back.')+
   L.prose('If that doesn’t work, '+L.g('mirror','mirror')+'. At this point all you have is their action and a hint of emotion, so reflect those. It helps most when their words and tone don’t match: “Don’t worry, I’m fine,” said while frowning and looking away.')+
   L.note('The safety comes from your <b>tone</b>, not from naming the feeling. Say it calmly, as if you’re fine with them feeling this way. Sound upset, and you confirm they should stay quiet.','alert'));
  L.done();}},
{part:2,src:'Chapter 8 · Paraphrase to Acknowledge the Story',run(L){
  L.h(L.kick('learn','Paraphrase, and don’t push too hard')+'<h1 class="q">When the story starts to come out</h1>'+
   L.prose('Once you get a clue to <i>why</i> they feel this way, <b>paraphrase</b>: restate it in your own words, usually shorter. Don’t parrot. Stay calm, and keep asking yourself how a reasonable, decent person could reach this view.')+
   L.lanes([['x','Parrot','“You said we ran up the bill because we knew you’d pay anything.”',4],
            ['check','Paraphrase','“So it feels like we took advantage of how much you love Biscuit?”',2]])+
   L.prose('If they’re still holding back after asking, mirroring and paraphrasing, more pressure starts to feel like prying. Back off: <b>exit gracefully</b>, or <b>ask what they’d like to see happen</b>. That turns their mind toward solving the problem.'));
  L.done();}},
{part:2,src:'Chapter 8 · Prime When You’re Getting Nowhere',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">Priming the pump at a shift-change meeting</h1>');
  L.beats(L.card,[
   ['The decision','A company must add an afternoon crew or close a work area. Day workers will now rotate onto afternoon shifts every two weeks.'],
   ['The silence','At the meeting, people sit fuming. Nobody speaks.'],
   ['Mirror','The manager says he can see they’re upset, and who wouldn’t be. Is there anything they can do? Nothing.'],
   ['Prime','He guesses out loud: are they thinking this is just about making money, and that the company doesn’t care about their lives?'],
   ['The pump flows','After a pause, someone says yes, that’s how it looks, and do they know how hard this will be? The discussion takes off.']],
   'Like an old hand pump, sometimes you pour some meaning in first. '+L.g('prime','Priming')+' is a risk you take in good faith, only when nothing else has worked.');}},
{part:2,src:'Chapter 8 · Exploring Wendy’s Path',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">A parent, a daughter and a slammed door</h1>');
  L.beats(L.card,[
   ['The blow-up','Wendy comes home from a date with a boy her parent fears. The parent hauls her inside and insults him. Wendy shouts and slams her door.'],
   ['Start with Heart','The parent asks what they really want: to understand her, to have a good relationship, and to see her make choices that make her happy.'],
   ['Apologize, ask','At her door: sorry for embarrassing her. She says the parent tries to control everything. “Can we talk about that?”'],
   ['Mirror','“It’s no big deal,” she says, angrily. “From the way you say that, it sounds like it is.”'],
   ['Paraphrase','“So you feel I don’t approve of you, and he’s one person who does?”'],
   ['Prime','A careful guess: maybe she isn’t feeling cared about or valued right now. A long silence, then the real worry comes out.']],
   'The parent didn’t win the argument at the door. They reached the source behind it.');}},
{part:2,src:'Chapter 8 · Ask, Mirror, Paraphrase, or Prime (AMPP)',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Harriet says, voice shaking: “No, really, it’s fine. Forget it.” Theo replies: “You say it’s fine, but you sound really upset.” Which skill is that?</h1>');
  L.mc(L.card,['Paraphrase','Mirror','Prime'],1,
   'Theo describes what they can hear, Harriet’s tone, because it doesn’t match Harriet’s words.',
   'Theo isn’t restating a story or guessing at one. They’re reflecting the emotion they can hear. That’s mirroring.');}},
{part:2,src:'Chapter 8 · Ask, Mirror, Paraphrase, or Prime (AMPP)',pts:6,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which AMPP skill?',['Ask','Mirror','Paraphrase','Prime'],[
   ['Theo to Harriet: “I’d really like to hear what upset you about the bill.”',0,'A simple, sincere invitation.'],
   ['Theo: “So the extra nights came as a shock, and nobody warned you?”',2,'Harriet’s story, in Theo’s words, shorter.'],
   ['Jordan to their teen, Ash, who stares at the plate: “You seem down tonight.”',1,'It calmly names the emotion Jordan can see.'],
   ['Theo, after a long silence: “Are you wondering if we padded the bill on purpose?”',3,'Theo’s best guess at what Harriet won’t say.'],
   ['Jordan to Kit after a tense surgery: “What’s on your mind? I’d really like to hear it.”',0,'A plain, sincere invitation to talk.'],
   ['Kit to Jordan: “You’re smiling, but your voice sounds tight.”',1,'Reflecting the gap between words and tone.']]);}},
{part:2,src:'Chapter 8 · Don’t push too hard',pts:1,run(L){
  L.h(L.kick('pr','What next?')+'<h1 class="q">Theo has asked, mirrored and paraphrased. Harriet is still upset, says little, and seems to want the call to end. What should Theo do?</h1>');
  L.mc(L.card,['Keep pressing until Harriet says what’s wrong','Ask what Harriet would like to happen next','Explain the charges so Harriet understands'],1,
   'Backing off shows respect. Asking what Harriet wants turns their mind toward solving the problem, and hints at what they think the cause is.',
   'Pressing feels like prying, and explaining the charges switches to Theo’s meaning. When someone won’t open up, back off: exit gracefully or ask what they want.');}},
{part:2,src:'Chapter 8 · But What If They’re Wrong?',run(L){
  L.h(L.kick('learn','But what if they’re wrong?')+'<h1 class="q">Listening calmly to a view you think is wrong feels risky</h1>'+
   L.prose('Harriet thinks Maplewood padded the bill. Theo knows it didn’t. Calmly exploring Harriet’s story can feel like admitting Harriet is right.')+
   L.quote('Understanding doesn’t equate with agreement.','Chapter 8')+
   L.prose('You’re trying to see <i>why</i> Harriet feels and acts this way, not to sign up to their conclusions. There will be plenty of time to share your own path once theirs is in the pool.'));
  L.done();}},

/* ---------- PART 4: YOUR TURN ---------- */
{part:3,src:'Chapter 8 · Remember Your ABCs',run(L){
  L.h(L.kick('learn','Remember your ABCs')+'<h1 class="q">Your turn to talk, without starting a debate</h1>'+
   L.prose('Many heated arguments are '+L.g('violent-agreement','violent agreement')+': people agree on almost everything but fight over the 5 to 10 percent they don’t. We’re trained from school to hunt for small errors. Skilled people hunt for agreement. Use '+L.g('abc','ABC')+':')+
   L.list([['check','Agree','If you agree, say so and move on. Don’t turn an agreement into an argument.'],
     ['layers','Build','If they’re right but left something out, agree first, then add: “Absolutely. And I also noticed…”, not “Wrong, you forgot…”'],
     ['scale','Compare','If you differ, don’t say they’re wrong. Say you see it differently, share your path with the STATE skills, then explore the difference together.']],2));
  L.done();}},
{part:3,src:'Chapter 8 · Remember Your ABCs',run(L){
  L.h(L.kick('ex','A Maplewood example')+'<h1 class="q">Harriet opens up, and Theo takes a turn</h1>');
  L.beats(L.card,[
   ['Harriet’s path','The estimate said about $1,800. The bill said $2,600. Nobody called about the extra nights. Harriet thinks Maplewood saw a frightened owner and took advantage.'],
   ['Agree','“You’re right that nobody called you about the extra nights. That should have happened.”'],
   ['Build','“And there’s something else you might not know: Biscuit stayed because his breathing wasn’t stable yet.”'],
   ['Compare','“Where I see it differently is the idea that we padded the bill. Can I walk you through the overnight charges, and you tell me what doesn’t look right?”']],
   'Agreement first, then the missing piece, then a tentative comparison with an invitation to test it.');}},
{part:3,src:'Chapter 8 · Remember Your ABCs',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Jordan says the overtime is wearing out the techs. Theo agrees, and also knows two techs have asked to cut their hours. What should Theo do?</h1>');
  L.mc(L.card,['Compare: “I see it a bit differently.”','Agree, then build: “Yes, and two techs…”','Agree, and leave it there'],1,
   'Jordan is right, just incomplete. Agree, then add the missing piece.',
   'Theo doesn’t disagree, so Compare would invent a debate. And stopping at “agree” leaves out something important. Agree, then build.');}},
{part:3,src:'Chapter 8 · Remember Your ABCs',pts:6,run(L){
  L.h(L.kick('pr','A, B or C?')+'<h1 class="q">Pick the right move for each moment.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Agree','Build','Compare'],[
   ['Harriet: “Biscuit needed surgery that night.” Theo thinks exactly the same.',0,'Full agreement. Say so and move on.'],
   ['Harriet: “The estimate was $1,800.” True, but it also said the cost could rise if Biscuit stayed longer.',1,'Harriet is right but left out a piece. Agree, then add it.'],
   ['Harriet: “You charged me for things you never did.” Theo’s records show every item was done.',2,'A real difference. Theo says they see it differently and shares their facts.'],
   ['Kit: “We need to finish records the same day.” Jordan fully agrees.',0,'No need to debate a point you share.'],
   ['Jordan: “The rota change ignored my input.” Theo agrees, and also knows the change came from a budget cut Jordan never heard about.',1,'Agree with Jordan’s point, then add the missing context.'],
   ['Dr. Alvarez: “The team is fully behind the second clinic.” Jordan has heard most techs are worried.',2,'Jordan differs, so compare paths, tentatively.']],
   'Agree when you agree, build when something’s missing, compare when you really differ.');}},
{part:3,src:'Chapter 8 · Compare',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Tap each piece until Theo’s reply to Harriet is a good Compare.</h1>');
  L.sentence(L.card,[
    ['“That’s just not true.”','“I think I see this differently.”'],
    ['“Let me describe how,”','“Here’s why you’re wrong,”'],
    ['“and then tell me what I’m missing.”','“and then we can drop it.”']],[1,0,0],
   [['That declares Harriet wrong before either side is heard. Suggest you differ instead.'],['That turns comparing into a verdict. Describe your view, don’t rule on theirs.'],['Shutting the topic down stops the comparison. Invite her to test your view.']],
   'Tentative but candid: name the difference, share your path, and invite Harriet to compare it with theirs.');}},
{part:3,src:'Chapter 8 · Summary—Explore Others’ Paths',pts:1,run(L){
  L.h(L.kick('pr','Put it together')+'<h1 class="q">At home, Jordan’s teen Ash has gone quiet at dinner for weeks. Put Jordan’s moves in a sensible order.</h1>');
  L.order(L.card,['Ask: “How are things going at school?”','Mirror: “You say it’s fine, but you seem really down.”','Paraphrase: “So the new class feels lonely?”','Prime: “Are you worried we’d be upset if you switched?”'],
   'Ask first, then mirror what you see, paraphrase what they share, and prime only when you’re getting nowhere.',['1','2','3','4']);}}
  ]
});
</script>
</body>
</html>
