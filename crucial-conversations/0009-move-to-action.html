<html lang="en">

<title>Move to Action</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">

</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0009', title:'Move to action', minutes:18, icon:'arrow',
  goals:['Keep dialogue from being mistaken for decision making','Pick Command, Consult, Vote or Consensus with four questions','Finish a crucial conversation with clear, followed-up assignments'],
  parts:['Two traps','Four methods','Choosing','Finish clearly'],
  read:'Read chapter 9 of the book for the full cruise and steam-car stories and the team exercise on decision making.',
  glossary:{
    'decide-how':'Decide how to decide: agreeing, before a decision is made, which method you’ll use and who will be involved.',
    command:'Command: a decision made without involving others, either because outside forces require it or because you hand it to someone you trust.',
    consult:'Consult: the decision makers invite others to influence them, then a small group makes the choice and informs everyone.',
    consensus:'Consensus: you talk until everyone honestly agrees to one decision, and then everyone supports it.'
  },
  cheatsheet:[
    '<b>Dialogue is not decision making.</b> Everyone shares meaning; that doesn’t mean everyone decides.',
    'The end of a crucial conversation is risky: watch for <b>violated expectations</b> and <b>inaction</b>.',
    '<b>Decide how to decide.</b> With clear authority, the leader picks the method. Without it, talk about who decides as part of the dialogue.',
    'Four methods, rising involvement: <b>Command, Consult, Vote, Consensus</b>. More involvement brings more commitment but less speed.',
    'Pick a method with four questions: <b>Who cares? Who knows? Who must agree? How many people is it worth involving?</b>',
    'Finish clearly: <b>Who does What by When</b>, and <b>how will you follow up</b>? There is no “we” in an assignment.',
    'Make deliverables concrete: use Contrasting and real samples. Write it all down, review it next time, and hold people to it with STATE.'
  ],
  steps:[
/* ---------- PART 1: TWO TRAPS ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">In a long meeting about the second clinic, Dr. Alvarez asked every staff member for their honest view. Does that mean the staff will all help make the final call?</h1>');
  L.mc(L.card,['Yes, asking for views means sharing the decision','Not necessarily, unless someone says so clearly'],1,
   'Right. Hearing everyone out is one thing; deciding is another. This lesson is about making that difference clear.',
   'That’s the hidden assumption that causes trouble. Sharing views and making the decision are two separate steps, and people need to be told which one they’re in.');}},
{part:0,src:'Chapter 9 · Dialogue Is Not Decision Making',run(L){
  L.h(L.kick('learn','Dialogue is not decision making')+'<h1 class="q">A full pool doesn’t decide anything by itself</h1>'+
   L.prose('The earlier skills all fill the '+L.g('pool','Pool of Shared Meaning')+'. But a full pool doesn’t tell you what to <i>do</i> with the meaning. The book says the two riskiest moments in a crucial conversation are the <b>start</b>, when you must create safety, and the <b>end</b>, when you turn the pool into decisions.')+
   L.prose('At the end, things go wrong in two ways:')+
   L.lanes([['alert','Violated expectations','People don’t know how the decision will be made. Someone decides alone, and others feel let down.',3],
            ['clock','Inaction','No decision gets made. Ideas fade away, or everyone waits for someone else to act.',4]]));
  L.done();}},
{part:0,src:'Chapter 9 · Dialogue Is Not Decision Making',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">Cara, Rene and the cruise</h1>');
  L.beats(L.card,[
   ['The talk','A week ago, Cara and Rene had a crucial conversation about their vacation. Both spoke candidly and respectfully.'],
   ['The conclusion','They agreed a cruise would suit them both.'],
   ['The surprise','Rene comes home with a brochure: he has booked a three-day cruise and paid a $500 deposit for a suite.'],
   ['The clash','Rene expects Cara to be thrilled. Cara is annoyed.'],
   ['Why','Cara agreed to a cruise <i>in principle</i>, not to this one. Rene thought any cruise would do and decided alone.']],
   'A good dialogue, then a violated expectation, because nobody said how the final choice would be made.');}},
{part:0,src:'Chapter 9 · Dialogue Is Not Decision Making',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">In March, the Maplewood team had a frank, useful talk about a better way to handle phone calls. It’s now June. Nothing has changed, and nobody knows who was meant to act. Which trap is this?</h1>');
  L.mc(L.card,['Inaction','Violated expectations'],0,
   'Yes. The ideas were good, but nobody decided or acted, so they faded away.',
   'Nobody was surprised by a decision. No decision got made at all. That’s inaction.');}},
{part:0,src:'Chapter 9 · Dialogue Is Not Decision Making',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which trap?',['Violated expectations','Inaction'],[
   ['After a team talk about new scrubs, Theo orders them in navy. Jordan thought the techs would pick the color.',0,'Jordan expected a say in the choice. Theo decided alone. That’s a violated expectation.'],
   ['Everyone agreed the surgery suite needs a better layout. Six months on, nobody has drawn one.',1,'Agreement, but no decision and no action. The idea just faded.'],
   ['Kit thought the group would vote on holiday cover. Dr. Alvarez announced the rota instead.',0,'Kit assumed one method, Dr. Alvarez used another. Nobody said which.'],
   ['After a great talk about client wait times, each person assumes someone else will act.',1,'Everyone waiting for everyone else is the classic inaction trap.']]);}},

/* ---------- PART 2: FOUR METHODS ---------- */
{part:1,src:'Chapter 9 · Decide How to Decide',run(L){
  L.h(L.kick('learn','Decide how to decide')+'<h1 class="q">Before you decide, agree how you’ll decide</h1>'+
   L.prose('Both traps go away if, before any decision, the people involved <b>'+L.g('decide-how','decide how to decide')+'</b>. Dialogue involves everyone. It doesn’t promise that everyone takes part in every decision. So say clearly how the decision will be made, who is involved and why.')+
   L.lanes([['shield','Authority is clear','A manager or parent picks the method. That’s part of their job. They may hand more decisions over as people earn it, but they choose which.',1],
            ['chat','Authority is unclear','Make “who decides?” part of the dialogue. Get everyone’s views on it into the pool, then jointly decide how to decide.',2]])+
   L.note('The book’s example: a parent and a teacher disagree about holding a child back a year. Bringing up lawyers early would kill safety. Talk about the child <i>and</i> about how the choice will be made.','book'));
  L.done();}},
{part:1,src:'Chapter 9 · The Four Methods of Decision Making',run(L){
  L.h(L.kick('learn','Four methods')+'<h1 class="q">Four ways to decide, from least to most involvement</h1>'+
   L.tiers([['pointer','Command','Decided without involving others: outside forces require it, or you hand it to someone you trust.','no involvement'],
            ['people','Consult','Decision makers invite others to influence them, then choose and inform everyone.','some involvement'],
            ['check','Vote','An agreed share of the group decides. Good for picking among several good options quickly.','more involvement'],
            ['scale','Consensus','Talk until everyone honestly agrees to one decision, then all support it.','full involvement']])+
   L.prose('More involvement brings more <b>commitment</b> but less <b>efficiency</b>. Skilled people pick the method that fits the situation.'));
  L.done();}},
{part:1,src:'Chapter 9 · The Four Methods of Decision Making',pts:1,
 solve:async L=>{[...L.$('#mm').children].forEach(b=>b.click());},
 run(L){
  const M=['Command','Consult','Vote','Consensus'],V=[[5,30,95],[40,60,70],[70,70,55],[100,100,20]],seen=new Set();
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Tap each method and watch the trade-off. Try all four.</h1><div id="mm"></div>'+
   ['Involvement','Commitment','Speed'].map((n,j)=>'<div class="meterrow"><div class="lb">'+n+'</div><div class="meter"><div id="v'+j+'" style="background:var(--h'+(j+2)+')"></div></div></div>').join('')+'<div id="mq"></div>');
  M.forEach((n,i)=>{const b=document.createElement('button');b.className='chip';b.textContent=n;b.onclick=()=>{[...L.$('#mm').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(i);
    V[i].forEach((v,j)=>{const el=L.$('#v'+j);if(el)el.style.width=v+'%';});
    if(seen.size===4&&!L.$('#mq').innerHTML){const q=L.$('#mq');q.innerHTML='<h2 class="sub">Dr. Alvarez wants the staff fully behind the second clinic, and time is short. What’s the honest trade-off?</h2>';
      L.mc(q,['Full support needs Consensus, which takes the most time','A quick Vote will give the same full support'],0,
       'Exactly. The more people truly agree, the slower it goes. Dr. Alvarez has to choose what matters more.',
       'A vote is faster, but the losing side may not support the result. The book says don’t vote when people won’t back whatever is decided.');}};L.$('#mm').appendChild(b);});}},
{part:1,src:'Chapter 9 · The Four Methods of Decision Making',run(L){
  L.h(L.kick('ex','Closer look')+'<h1 class="q">When each method fits. Flip each card.</h1>');
  L.flips(L.card,[
   ['Command','Two kinds. <b>Outside demands</b>: customers, laws or agencies leave no wiggle room, so your job is to decide how to make it work. Or <b>handing it over</b>: the stakes are low, or you fully trust someone to choose well.'],
   ['Consult','Gather ideas from experts, a sample group or anyone interested. Then decide and tell everyone. It gets ideas and support without bogging things down too much.'],
   ['Vote','Best when speed matters most and there are several decent options. People accept they may not get their first choice. Never use it when people won’t support whatever wins.'],
   ['Consensus','Can create great unity and strong decisions, or waste huge amounts of time. Use it only for high-stakes, complex issues, or when everyone absolutely must support the choice.']],
   'Strong teams and relationships hand many decisions to someone they trust. That counts as Command too.');}},
{part:1,src:'Chapter 9 · Command',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">The state vet board issues a new rule: every controlled drug must be logged twice a day. What kind of decision is this for Maplewood?</h1>');
  L.mc(L.card,['A Consult: ask the staff whether to do it','A Command: the job is to make it work'],1,
   'Right. Outside forces decided. Maplewood’s choice is only <i>how</i> to make the new logs work.',
   'There’s nothing to consult on about <i>whether</i>. The board decided. The team’s job is to figure out how to make it work.');}},
{part:1,src:'Chapter 9 · The Four Methods of Decision Making',pts:5,run(L){
  L.h(L.kick('pr','Match the method')+'<h1 class="q">Which method fits each Maplewood decision best?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Command','Consult','Vote','Consensus'],[
   ['Which brand of printer paper to buy. Nobody cares much, and Theo has it handled.',0,'Low stakes and a trusted person: hand it over.'],
   ['Dr. Alvarez is choosing a new X-ray machine and wants the techs’ input first.',1,'Dr. Alvarez keeps the decision but invites others to influence it.'],
   ['Three good dates for the staff party; everyone will come to whichever wins.',2,'Several decent options, speed matters, and people will support the result.'],
   ['Whether to change the clinic’s core values, which everyone must live by.',3,'High stakes, and everyone must truly support it.'],
   ['A new law caps how many hours techs may work in a row.',0,'An outside demand. The team decides how to make it work, not whether.']],
   'The more the decision matters to people, and the more their support matters, the more involvement it needs.');}},

/* ---------- PART 3: CHOOSING ---------- */
{part:2,src:'Chapter 9 · Four Important Questions',run(L){
  L.h(L.kick('learn','How to choose')+'<h1 class="q">Four questions pick the method for you</h1>'+
   L.list([['people','Who cares?','Who truly wants to be involved, and who will be affected? These are your candidates. Leave out people who don’t care.'],
           ['bulb','Who knows?','Who has the know-how for a good decision? Invite them. Try not to involve people who add no new information.'],
           ['shield','Who must agree?','Whose authority or influence will you need? Better to involve them than to surprise them and face open resistance.'],
           ['scale','How many people is it worth involving?','Involve the fewest people while still getting a good decision and enough support for it.']],1));
  L.done();}},
{part:2,src:'Chapter 9 · Four Important Questions',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">Theo works out how to decide on a new tech rota</h1>');
  L.beats(L.card,[
   ['The decision','After the schedule change went badly, Theo needs a new tech rota for next quarter.'],
   ['Who cares?','All six techs: the rota shapes their weeks. The front desk is affected a little.'],
   ['Who knows?','Jordan built the rota for years and knows every trap in it. Theo knows the budget.'],
   ['Who must agree?','Dr. Alvarez, who approves staffing costs. And the techs, who have to live with it.'],
   ['How many?','Six techs care a lot, so Theo involves them all. The front desk only needs to be told the result.'],
   ['The method','Theo says it up front: “Jordan and I will draft it, the techs will shape it, and we’ll aim for all of us to agree. Dr. Alvarez signs off on cost.”']],
   'Asking the four questions out loud turned a likely fight into a clear process everyone knew in advance.');}},
{part:2,src:'Chapter 9 · Four Important Questions',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Theo wants to add a receptionist who has never worked with the surgery team to the rota planning group. They add no new information and aren’t affected. What does the book suggest?</h1>');
  L.mc(L.card,['Include them, since more voices are always better','Leave them out, since they neither care nor know'],1,
   'Yes. Involve the fewest people who still give a good decision and enough support.',
   'More people cost time. The book says don’t involve people who don’t care or who add no new information.');}},
{part:2,src:'Chapter 9 · Four Important Questions',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which question is Dr. Alvarez asking?',['Who cares?','Who knows?','Who must agree?','How many to involve?'],[
   ['“The bank has to approve the loan, so I should bring them in early, not surprise them.”',2,'The bank’s authority is needed, so involve it rather than face resistance later.'],
   ['“Jordan has run three clinic moves before. I need that experience in the room.”',1,'Jordan brings expertise the decision needs.'],
   ['“The night staff will be hit hardest by the new hours. They should have a say.”',0,'The people most affected are candidates for involvement.'],
   ['“Will four of us be enough for a good choice, or do we need the whole team’s commitment?”',3,'Balancing the quality of the decision against the support it will get.']]);}},
{part:2,src:'Chapter 9 · Four Important Questions',pts:1,run(L){
  L.h(L.kick('pr','Apply it')+'<h1 class="q">The second clinic will change every person’s job. The techs must staff it, and Dr. Alvarez can’t run it if they quit. Most think it will stretch them past breaking point. Which method fits best?</h1>');
  L.mc(L.card,['Command: Dr. Alvarez decides and announces','Vote: let the majority decide quickly','Consult or Consensus: involve those who care and must agree'],2,
   'High stakes, many people who care, and staff whose support is essential. This calls for real involvement, and a clear statement up front of how the final call will be made.',
   'Many people care, the techs know the workload, and their support is a must. Command risks open resistance; a vote risks a losing side that won’t back it. More involvement fits.');}},

/* ---------- PART 4: FINISH CLEARLY ---------- */
{part:3,src:'Chapter 9 · Make Assignments—Put Decisions into Action',run(L){
  L.h(L.kick('learn','Make assignments')+'<h1 class="q">Four things every assignment needs</h1>'+
   L.list([['person','Who?','A real person’s name. There is no “we”: in assignments, “we” quietly means “not me”. If several share a task, name one as responsible.'],
           ['target','Does what?','The exact result. The fuzzier the expectation, the more likely the disappointment.'],
           ['cal','By when?','A real deadline, not “someday”. Without one, the task sinks to the bottom of the pile.'],
           ['cycle','How will you follow up?','Agree how and when: an email when done, a report at the next meeting, or progress checks tied to a final date.']],2)+
   L.quote('Goals without deadlines aren’t goals; they’re merely directions.','Patterson and coauthors, chapter 9'));
  L.done();}},
{part:3,src:'Chapter 9 · Does What?',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">The steam-powered car</h1>');
  L.beats(L.card,[
   ['The dream','Howard Hughes asked a team of engineers to build the world’s first steam-powered car, with almost no direction.'],
   ['Years later','They solved where to store all the water by running pipes all through the car’s body. It was basically a giant radiator.'],
   ['The question','Hughes asked what would happen in a crash. The answer: the passengers would be boiled.'],
   ['The end','Hughes had the car cut into small pieces. Years of work, gone.'],
   ['The lesson','Spell out the deliverable up front. Use Contrasting: name a common mistake as what you <i>don’t</i> want. Better still, show a sample or picture.']],
   'The authors learned this the hard way too: a set designer’s description sounded great, and the $25,000 result couldn’t be used.');}},
{part:3,src:'Chapter 9 · Make Assignments—Put Decisions into Action',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">At the end of a meeting about late records, Theo says: “Okay, so we’ll all try to get records in faster.” What’s the biggest problem?</h1>');
  L.mc(L.card,['It sounds too harsh on Kit','No named person and no deadline'],1,
   'Right. “We” means nobody in particular, and “faster” has no date. It’s a direction, not an assignment.',
   'It isn’t harsh at all. The trouble is that “we” names nobody and “faster” sets no date, so nothing is likely to change.');}},
{part:3,src:'Chapter 9 · Make Assignments—Put Decisions into Action',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Tap each piece until it’s a clear assignment for Kit’s late records.</h1>');
  L.sentence(L.card,[['We','Kit'],['will try to catch up on records','will close all 14 overdue records'],['soon','by Friday at 5 p.m.'],['and we’ll see how it goes.','and email Theo when the last is done.']],[1,1,1,1],
   [['“We” names nobody. Assign one person.'],['“Try to catch up” is fuzzy. Say the exact result.'],['“Soon” is not a deadline.'],['That’s no follow-up plan. Agree how you’ll check.']],
   'Who, does what, by when, and how you’ll follow up: all four are there.');}},
{part:3,src:'Chapter 9 · Make Assignments—Put Decisions into Action',pts:4,run(L){
  L.h(L.kick('pr','What’s missing?')+'<h1 class="q">Each assignment lacks one element. Which?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Who','What','When','Follow-up'],[
   ['“Jordan will redo the surgery checklist by the 15th and present it at staff meeting.” But nobody said what “redo” means.',1,'The deliverable is fuzzy. Contrast it, or show a sample of what good looks like.'],
   ['“Someone should call Harriet Cole back by noon and tell Theo how it went.”',0,'“Someone” is nobody. Name one person.'],
   ['“Kit will update the vaccine reminder list and email Theo when it’s done.”',2,'No date, so it can drift to the bottom of the pile.'],
   ['“Theo will get three quotes for new kennels by May 1.” Nobody agreed how anyone would hear about it.',3,'Agree how and when you’ll check, such as a quick report at the next meeting.']],
   'Who does What by When, and how you’ll Follow up. Miss any one and the work often stalls.');}},
{part:3,src:'Chapter 9 · Document Your Work',run(L){
  L.h(L.kick('learn','Document your work')+'<h1 class="q">Write it down, then hold people to it</h1>'+
   L.flow([['pencil','Record','Conclusions, decisions and who does what by when'],['book','Review','Revisit the notes at the next meeting'],['chat','Hold to account','When a promise slips, it’s time for dialogue']])+
   L.prose('Don’t trust memory after all the work of a crucial conversation. When someone misses a commitment, talk about it using the '+L.g('state','STATE')+' skills from chapter 7.')+
   L.prose('Holding people accountable raises their motivation and ability to deliver, and it builds a culture of integrity.'));
  L.done();}},
{part:3,src:'Chapter 9 · Document Your Work',pts:1,run(L){
  L.h(L.kick('pr','Apply it')+'<h1 class="q">Friday comes. Theo’s notes say Kit would close all 14 records. Six are still open, and Kit hasn’t emailed. What should Theo do?</h1>');
  L.mc(L.card,['Quietly close the records alone to avoid a scene','Hold a dialogue: share the facts, then ask Kit’s view','Post a reminder to the whole team about records'],1,
   'Yes. A missed promise is a cue for dialogue. Start with the facts (six open, no email), tell the story tentatively, and ask for Kit’s path.',
   'Covering for Kit or sending a vague group reminder skips accountability. The book says a broken commitment calls for dialogue with STATE.');}}
  ]
});
</script>
</body>
</html>
