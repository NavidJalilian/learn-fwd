<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Master My Stories</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0006', title:'Master my stories', minutes:20, icon:'book',
  goals:['Trace any strong feeling back to the story and the facts behind it','Spot Victim, Villain and Helpless stories, and the sellout that starts them','Tell the rest of the story with four questions'],
  parts:['Stories','Retrace','Clever stories','The rest'],
  read:'Read chapter 6 of the book for Maria’s full story and the list of everyday sellouts.',
  glossary:{
    'hot-words':'Hot words: words like “scowled” or “sarcastic” that sound like facts but carry a judgment. They belong to the story, not the facts.',
    sellout:'Sellout: a moment when you knowingly act against your own sense of what’s right, such as staying quiet when you know you should speak.',
    'useful-story':'Useful story: a more complete story that creates feelings leading to healthy action, such as dialogue.'
  },
  cheatsheet:[
    'Others don’t <b>make</b> you mad. Your <b>story</b> about what they did does. Master your emotions or be held hostage by them.',
    '<b>Path to Action:</b> See and hear → Tell a story → Feel → Act. The story is the step you can change.',
    '<b>Retrace backward:</b> notice your behavior (silence or violence?) → name your feelings precisely → analyze your story → get back to the facts.',
    'A fact is something you could <b>see or hear</b>. Watch for <b>hot words</b> like “scowled” or “sarcastic”: they are story.',
    '<b>Clever stories:</b> Victim (“not my fault”), Villain (“all your fault”), Helpless (“nothing I can do”). They let us feel good about behaving badly.',
    'Clever stories usually start <b>after a sellout</b>: we act against what we know is right, then justify it.',
    '<b>Tell the rest of the story:</b> Am I pretending not to notice my role? Why would a reasonable, rational, decent person do this? What do I really want? What would I do right now if I did?'
  ],
  steps:[
/* ---------- PART 1: STORIES ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Two techs get the same curt note from Dr. Alvarez: “See me about the Rex chart.” One is furious, the other shrugs. Why the difference?</h1>');
  L.mc(L.card,['They each explained the note to themselves differently','One of them is simply a more sensitive person'],0,
   'Same note, different explanations, different feelings. This lesson is about that hidden explanation.',
   'Maybe, but the same person can shrug one day and fume the next. What changes is how they explain the note to themselves.');}},
{part:0,src:'Chapter 6 · Emotions Don’t Just Happen',run(L){
  L.h(L.kick('learn','Emotions don’t just happen')+'<h1 class="q">Two bold claims</h1>'+
   L.list([['Nobody makes you mad','Feelings aren’t a fog that settles on you, and others don’t put them there. You create your own anger, fear or hurt.'],
           ['Master them or be their hostage','Once you feel something strong, you either act on the emotion, or it acts on you.']],1)+
   L.tiers([['x','The worst','Treat their feelings as the only right reaction, and let those feelings drive them without noticing.','hostage'],
            ['alert','The good','Choke the feelings down and fake calm. The feelings leak out anyway: a tight jaw, a sarcastic line, a key point never said.','suppressed'],
            ['bulb','The best','Think the feelings through, which often changes them. Then they can choose better behavior.','in charge',true,'Do this']]));
  L.done();}},
{part:0,src:'Chapter 6 · Maria’s Story',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">Maria, Louis and the presentation</h1>');
  L.beats(L.card,[
   ['The meeting','Maria and Louis are meant to present their ideas to the boss together. When Maria pauses, Louis takes over and covers almost every point. The boss turns to Maria, and there’s nothing left to say.'],
   ['Earlier','Louis had also discussed their ideas with the boss without her.'],
   ['Maria’s conclusion','Louis is downplaying her work because she’s the only woman on the team.'],
   ['What she does','Mostly says nothing, so she won’t look “oversensitive”. Now and then, a sarcastic jab.'],
   ['Louis’s side','He has no idea what’s wrong. He starts to resent her attitude. The tension grows.'],
   ['The trap','Maria thinks anyone would feel what she feels, and that Louis caused it. So she never questions it.']],
   'Maria’s feelings are running her. To change that, she has to find where they came from.');}},
{part:0,src:'Chapter 6 · Stories Create Feelings',run(L){
  L.h(L.kick('learn','The Path to Action')+'<h1 class="q">Between what happens and what you feel, you tell a story</h1>'+
   L.flow([['eye','See and hear','the facts'],['book','Tell a story','add meaning'],['flame','Feel','emotion'],['pointer','Act','what we do']])+
   L.prose('That’s the '+L.g('path','Path to Action')+'. The story guesses at <i>why</i> they did it, judges whether it’s good or bad, and decides <i>what</i> to do. It happens so fast you rarely notice.')+
   L.prose('Any set of facts fits many stories. Maria could just as well have guessed Louis didn’t know how much she cared, or was trying to feel valued.')+
   L.note('That’s the good news. You tell the story, so you can tell a different one, and your feelings change with it.','bulb'));
  L.done();}},
{part:0,src:'Chapter 6 · Stories Create Feelings',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Dr. Alvarez cuts Kit off mid-sentence. Kit feels small. What came between the interruption and the feeling?</h1>');
  L.mc(L.card,['Kit’s body reacting before any thought','Dr. Alvarez’s tone causing the hurt','Kit’s quick story about what it meant'],2,
   'Kit told a story, maybe “Dr. Alvarez thinks I’m slow”, and the feeling followed.',
   'Actions can’t create feelings directly. Kit told a quick story about the interruption, and the feeling came from that story.');}},
{part:0,src:'Chapter 6 · Our Stories',pts:1,
 solve:async L=>{const b=L.$('#st').children;b[0].click();b[1].click();b[2].click();},
 run(L){
  const S=[['“Jordan is just negative.”','Annoyed and defensive','Theo goes cold and avoids Jordan all week.'],
           ['“Jordan is worn out and worried.”','Concerned','Theo checks in with Jordan after the meeting.'],
           ['“Jordan is easing the tension.”','Relieved, a bit amused','Theo smiles and moves on with the agenda.']];
  const seen=new Set();
  L.h(L.kick('pr','See it happen')+'<h1 class="q">In a team meeting, Jordan says: “Overtime again? I’ll bring a sleeping bag.” Two techs laugh. Pick the story Theo tells and watch the rest of the path.</h1>'+
   '<div class="small" style="margin-bottom:6px">'+L.ic('eye')+' Fact: the same words, the same laughs.</div><div id="st"></div>'+
   '<div style="background:var(--soft);border-radius:16px;padding:14px;margin:8px 0;min-height:96px" id="pv"><span class="small">Choose a story above.</span></div><div id="sq"></div>');
  S.forEach((s,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=s[0];b.onclick=()=>{[...L.$('#st').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(j);
    L.$('#pv').innerHTML='<div>'+L.ic('flame')+' <b>Feel:</b> '+s[1]+'</div><div style="margin-top:6px">'+L.ic('pointer')+' <b>Act:</b> '+s[2]+'</div>';
    if(seen.size===3&&!L.$('#sq').innerHTML){const q=L.$('#sq');q.innerHTML='<h2 class="sub">The facts never changed. What did?</h2>';
      L.mc(q,['How loudly the techs laughed','The story Theo told about it','How Jordan felt that day'],1,
       'Same facts, three stories, three feelings, three actions. The story is where Theo has control.',
       'The facts stayed the same in all three. Only Theo’s story changed, and the feeling and action followed it.');}};L.$('#st').appendChild(b);});}},

/* ---------- PART 2: RETRACE ---------- */
{part:1,src:'Chapter 6 · Retrace Your Path',run(L){
  L.h(L.kick('learn','Retrace your path')+'<h1 class="q">Slow down by walking the path backward</h1>'+
   L.prose('You don’t need to question every move. But when you notice yourself sliding into silence or violence, stop and work back one step at a time:')+
   L.list([['Notice your behavior','Am I in some form of silence or violence? Be honest: picture how a camera crew filming you would describe it.'],
     ['Get in touch with your feelings','What emotions are driving this? Be precise. “Angry” is often really embarrassed, surprised or humiliated.'],
     ['Analyze your story','What story is creating these feelings? Is this the <i>only</i> right way to feel here?'],
     ['Get back to the facts','What evidence do I have for this story?']],2));
  L.done();}},
{part:1,src:'Chapter 6 · Get Back to the Facts',run(L){
  L.h(L.kick('learn','Facts versus stories')+'<h1 class="q">Could you see it or hear it?</h1>'+
   L.prose('Stories made in a flash start to <i>feel</i> like facts. The test for a real fact: could you see or hear it? Would any two people watching agree?')+
   L.lanes([['eye','Fact','Louis gave 95% of the presentation and answered all but one question.',2],
            ['book','Story','Louis doesn’t trust me.',4]])+
   L.prose('Watch for '+L.g('hot-words','hot words')+'. “She scowled” or “he was sarcastic” sounds like a fact but carries a judgment. Compare “her eyes narrowed and her lips tightened”. The calmer version leaves room for other explanations.'));
  L.done();}},
{part:1,src:'Chapter 6 · Skills for Mastering Our Stories',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">Theo retraces the path after the “sleeping bag” meeting</h1>');
  L.beats(L.card,[
   ['Behavior','Theo has drafted a long, icy email to Jordan about “team attitude”, and is dodging Jordan in the hallway. That’s masking and avoiding: silence.'],
   ['Feelings','“Annoyed” at first. Looking closer: embarrassed in front of the team, and worried the techs side with Jordan.'],
   ['Story','“Jordan is just negative and is turning the techs against me.”'],
   ['Facts','Jordan made one joke about overtime. Two techs laughed. Jordan has stayed late twice a week all month.'],
   ['Result','The facts don’t prove the story. They fit “Jordan is exhausted” just as well. Theo deletes the email.']],
   'Working backward turns a fast, hot story into something Theo can question.');}},
{part:1,src:'Chapter 6 · Get Back to the Facts',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Which of these is a fact, not a story?</h1>');
  L.mc(L.card,['Kit is careless with the records','Kit closed six records late this week','Kit doesn’t respect Theo’s deadlines'],1,
   'You could check it in the system, and anyone would agree. The other two are conclusions.',
   '“Careless” and “doesn’t respect” are judgments about Kit. A fact is something you could see or count: six late records.');}},
{part:1,src:'Chapter 6 · Spot the story by watching for hot words',pts:6,run(L){
  L.h(L.kick('pr','Fact or story?')+'<h1 class="q">Sort what Maplewood people say. Watch for hot words.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Fact','Story'],[
   ['Dr. Alvarez started surgery before the checklist was signed.',0,'You could see it happen. Any observer would agree.'],
   ['Dr. Alvarez is reckless with animals’ lives.',1,'“Reckless” is a judgment about the person.'],
   ['Theo glared at me when I asked about overtime.',1,'“Glared” is a hot word. It adds a meaning to a look.'],
   ['Theo changed the rota on Monday without asking me.',0,'That’s an observable event.'],
   ['Jordan rolled their eyes to mock me.',1,'“To mock me” guesses at Jordan’s motive.'],
   ['Kit said “I’ll catch up by Friday” twice and didn’t.',0,'You heard the promise and can check the records.']],
   'Facts can be seen or heard. Stories add motives and judgments, often hidden in hot words.');}},
{part:1,src:'Chapter 6 · Retrace Your Path',pts:1,run(L){
  L.h(L.kick('pr','Retrace it')+'<h1 class="q">Jordan just snapped at Theo in the hallway. Put Jordan’s retracing questions in order.</h1>');
  L.order(L.card,['Am I in some form of silence or violence?','What emotions are pushing me to act this way?','What story is creating these emotions?','What evidence do I have to support this story?'],
   'Behavior, feelings, story, facts: the Path to Action walked backward.',['Act','Feel','Story','See / hear']);}},

/* ---------- PART 3: CLEVER STORIES ---------- */
{part:2,src:'Chapter 6 · Watch for Three “Clever” Stories',run(L){
  L.h(L.kick('learn','Three clever stories')+'<h1 class="q">Stories that let us feel good about behaving badly</h1>'+
   L.prose('Some stories are accurate. Others are '+L.g('clever-stories','clever stories')+': they excuse our own silence or violence. They come in three shapes:')+
   L.tiers([['person','Victim · “It’s not my fault”','I’m the innocent one. I leave out anything I did, or didn’t do, that helped cause the problem.'],
            ['alert','Villain · “It’s all your fault”','They’re bad or stupid. I assume the worst motives, often with a label (“that bonehead”), which then excuses how I treat them.'],
            ['lock','Helpless · “There’s nothing else I can do”','I have no healthy option. Often grows from a Villain story and ends in a '+L.g('fools-choice','Fool’s Choice')+'.']])+
   L.note('Watch for the double standard: our own mistakes get a Victim story (good intentions), other people’s get a Villain story (bad motives).','scale'));
  L.done();}},
{part:2,src:'Chapter 6 · Why We Tell Clever Stories',run(L){
  L.h(L.kick('learn','Where clever stories start')+'<h1 class="q">First the sellout, then the story</h1>'+
   L.prose('Clever stories usually begin after a '+L.g('sellout','sellout')+': we knowingly do something against our own sense of what’s right. Then we either own up or justify it.')+
   L.prose('The book’s example: a car tries to merge in front of you. You think you should let it in, but you speed up. <i>Then</i> the story arrives: “What a jerk, cutting in like that.”')+
   L.flow([['x','Sellout','I don’t do what I know I should'],['book','Clever story','they’re the problem, not me'],['flame','Feeling','justified, even angry']])+
   '<p class="small" style="margin-top:10px">Sellouts are often tiny: not apologizing, saying yes when you mean no, not raising a concern, not telling people you’re late on a task.</p>');
  L.done();}},
{part:2,src:'Chapter 6 · Why We Tell Clever Stories',run(L){
  L.h(L.kick('ex','A Maplewood example')+'<h1 class="q">How Jordan’s safety-check story grew</h1>');
  L.beats(L.card,[
   ['The moment','Dr. Alvarez starts a surgery before the full pre-surgery checklist is done. Jordan knows they should speak up.'],
   ['The sellout','Jordan says nothing.'],
   ['The Villain story','Afterward: “Dr. Alvarez only cares about the schedule. Animals come second.”'],
   ['The Helpless story','“Even if I said something, a vet like that would never listen. So why bother?”'],
   ['The action','Jordan grumbles to Theo, and the same thing happens again two weeks later.']],
   'The stories didn’t come first. They arrived to justify Jordan’s silence. Now they keep it going.');}},
{part:2,src:'Chapter 6 · Watch for Three “Clever” Stories',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Kit thinks: “I couldn’t have finished the records. Theo keeps booking me solid.” Kit leaves out that they agreed to every extra booking. Which story is this?</h1>');
  L.mc(L.card,['A Villain story','A Helpless story','A Victim story'],2,
   'Kit plays the innocent sufferer and quietly leaves out their own role.',
   'Kit isn’t mainly blaming Theo’s character or saying nothing can change. The key move is leaving out Kit’s own part. That’s a Victim story.');}},
{part:2,src:'Chapter 6 · Watch for Three “Clever” Stories',pts:6,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which clever story?',['Victim','Villain','Helpless'],[
   ['Theo: “Jordan is just a negative person.”',1,'A label that turns Jordan into the bad guy.'],
   ['Jordan: “If I push back on overtime, I’ll get the worst shifts, so I keep quiet.”',2,'It claims no healthy option exists, which justifies silence.'],
   ['Dr. Alvarez: “I work harder than anyone here, and nobody appreciates it.”',0,'It paints Dr. Alvarez as the innocent sufferer.'],
   ['Jordan: “Theo doesn’t care about the techs at all.”',1,'It assumes the worst motive about Theo.'],
   ['Kit: “Dr. Alvarez would bite my head off, so I can’t say no.”',2,'It turns Dr. Alvarez into a fixed trait and leaves Kit powerless.'],
   ['Theo: “I did everything right with the rota, and still got blamed.”',0,'Theo leaves out not asking Jordan first.']]);}},
{part:2,src:'Chapter 6 · Why We Tell Clever Stories',pts:1,run(L){
  L.h(L.kick('pr','Find the sellout')+'<h1 class="q">Theo has started thinking “Kit just doesn’t take deadlines seriously.” Which earlier moment most likely started that story?</h1>');
  L.mc(L.card,['Kit closed a record two days late last month','Theo chose not to talk to Kit about it, again','Dr. Alvarez complained about a late bill'],1,
   'Theo knew they should talk to Kit and didn’t. The Villain story then justifies the silence.',
   'Late records are the facts, not the trigger for the story. Clever stories usually follow our own sellout: here, Theo choosing not to raise it.');}},

/* ---------- PART 4: THE REST OF THE STORY ---------- */
{part:3,src:'Chapter 6 · Tell the Rest of the Story',run(L){
  L.h(L.kick('learn','Tell the rest of the story')+'<h1 class="q">Clever stories are incomplete. Fill in what’s missing.</h1>'+
   L.prose('The goal is a '+L.g('useful-story','useful story')+': one that leads to healthy action. Each clever story has its own question:')+
   L.list([['person','Victim → actor','Am I pretending not to notice my role in the problem?'],
     ['people','Villain → human','Why would a reasonable, rational and decent person do this?'],
     ['target','Helpless → able','What do I really want for me, for others, for the relationship?'],
     ['arrow','Then act','What would I do right now if I really wanted these results?']],2)+
   L.note('The humanizing question doesn’t excuse bad behavior. It calms your own emotions long enough for dialogue, the only reliable way to learn their real motives.','info'));
  L.done();}},
{part:3,src:'Chapter 6 · Maria’s New Story',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">Maria tells the rest of the story</h1>');
  L.beats(L.card,[
   ['My role?','She felt she should ask Louis why she was left out of meetings with the boss, but didn’t. Her resentment grew.'],
   ['Reasonable person?','Louis cares a lot about good work. Maybe he doesn’t know she’s just as committed.'],
   ['What do I want?','A respectful working relationship, and credit for her work.'],
   ['What would I do?','Set up a meeting with Louis to talk about how they work together.'],
   ['What happened','Louis apologized. He’d wanted to warn the boss about touchy points, and he talks more when nervous. They split the next presentation in halves.']],
   'Once Maria owned her part and softened her story, a real conversation became possible.');}},
{part:3,src:'Chapter 6 · Tell the Rest of the Story',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Jordan’s story: “Theo doesn’t care about the techs.” Which question should Jordan ask first?</h1>');
  L.mc(L.card,['Am I pretending not to notice my role?','Why would a decent person do this?','What would I do right now?'],1,
   'It’s a Villain story, so the humanizing question fits: Theo may be squeezed by the budget and short of staff.',
   'That question helps too, but this is a Villain story about Theo. The humanizing question, “why would a reasonable, decent person do this?”, is the direct fix.');}},
{part:3,src:'Chapter 6 · Tell the Rest of the Story',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which question fills the gap?',['My role?','Reasonable person?','What do I want?'],[
   ['Dr. Alvarez: “Theo’s team never warns me about scheduling clashes.” Dr. Alvarez skipped the last two planning meetings.',0,'A Victim story. Dr. Alvarez is leaving out their own part.'],
   ['Theo: “Jordan only complains to stir up trouble.”',1,'A Villain story. Look for reasons a decent person might complain.'],
   ['Kit: “Either I lie to Dr. Alvarez or I lose my job.”',2,'A Helpless story built on a Fool’s Choice. Go back to what Kit really wants.'],
   ['Jordan: “I’m stuck covering for the new techs, and nobody notices.” Jordan has never told anyone.',0,'Jordan plays the victim but hasn’t said a word. That’s Jordan’s role.']]);}},
{part:3,src:'Chapter 6 · Tell the Rest of the Story',pts:1,run(L){
  L.h(L.kick('pr','Finish the path')+'<h1 class="q">Theo now sees their own role and a kinder reason for Jordan’s joke. Theo wants a team that’s rested and an honest relationship with Jordan. What would Theo do right now?</h1>');
  L.mc(L.card,['Send the email but soften the wording a bit','Wait and hope the overtime issue fades away','Ask Jordan to talk about overtime, in person'],2,
   'That’s what someone who really wanted both results would do: open a real dialogue.',
   'Softening the email is still masking, and waiting is avoiding. Both are silence. If Theo really wanted both results, they’d start a real conversation.');}}
  ]
});
</script>
</body>
</html>
