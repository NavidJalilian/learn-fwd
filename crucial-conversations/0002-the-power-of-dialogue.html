<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Power of Dialogue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0002', title:'The power of dialogue', minutes:18, icon:'people',
  goals:['Spot the Fool’s Choice and the question that refuses it','Explain how a bigger Pool of Shared Meaning leads to better decisions','Tell silence and violence apart from real dialogue'],
  parts:['The Fool’s Choice','The shared pool','Silence and violence','The road ahead'],
  read:'Read chapter 2 of the book for Kevin’s full story and the research on opinion leaders.',
  glossary:{
    'opinion-leader':'Opinion leader: someone whom many colleagues name as able to get things done. Not always a manager.',
    'synergy':'Synergy: when a group’s combined ideas produce a better answer than anyone brought on their own.'
  },
  cheatsheet:[
    'The <b>Fool’s Choice</b>: believing you must pick between telling the truth and keeping a friend.',
    'Refuse it by asking: <b>how can I be 100% honest and 100% respectful at the same time?</b>',
    '<b>Dialogue</b> = the free flow of meaning between two or more people.',
    'A bigger <b>Pool of Shared Meaning</b> gives <b>smarter decisions</b> and <b>stronger commitment</b> to act on them.',
    'A shallow pool lets smart people do collectively stupid things (the wrong-surgery story).',
    'It doesn’t mean every decision is a vote. Whoever decides, a fuller pool means a better choice.',
    '<b>Silence</b> holds meaning back (hints, sarcasm, saying nothing). <b>Violence</b> forces it in (discrediting, monologues, borrowing power).',
    'Dialogue skills are easy to spot and fairly easy to learn.'
  ],
  steps:[
/* ---------- PART 1: THE FOOL’S CHOICE ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">In a staff meeting, Dr. Rosa Alvarez, Maplewood’s owner, raises an eyebrow and then their voice when someone questions the second-clinic plan. What usually happens next?</h1>');
  L.mc(L.card,['People push back even harder','People quietly stop asking'],1,
   'When the most powerful person in the room bristles, most people go quiet. This lesson is about the rare people who don’t, and how they pull it off.',
   'Some people might, but most go quiet when the boss bristles. The book’s research found exactly that, and then studied the rare person who didn’t.');}},
{part:0,src:'Chapter 2 · The startling discovery',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">Kevin and the CEO</h1>');
  L.beats(L.card,[
   ['The search','The authors asked over 20,000 people to name the colleagues who could really get things done. A few names came up again and again: the clear '+L.g('opinion-leader','opinion leaders')+'.'],
   ['Kevin','One was Kevin, the only one of eight vice presidents named as highly influential. For days, watching him, nothing looked special.'],
   ['The meeting','The team was choosing where to move their offices. The CEO, Chris, pushed an unpopular choice. When people questioned it, Chris got a bit defensive: an eyebrow, a raised finger, a slightly raised voice. People stopped questioning.'],
   ['Kevin speaks','Kevin asked if he could check something with Chris. The room held its breath. Kevin calmly said Chris seemed to be breaking his own decision rules, nudging the move toward his hometown.'],
   ['The result','Chris paused, agreed he’d been forcing his opinion, and asked to start over. The team chose a far better location, and Chris appreciated the coaching.']],
   'Kevin didn’t see anything the others missed. Everyone saw it. Kevin was the only one who said it, with full candor and full respect.');}},
{part:0,src:'Chapter 2 · The startling discovery',run(L){
  L.h(L.kick('learn','The Fool’s Choice')+'<h1 class="q">Everyone else thought they had only two bad options</h1>'+
   L.lanes([['alert','Option 1','Speak up, and make the most powerful person in the company your enemy.',3],
            ['x','Option 2','Stay quiet, and accept a bad decision that might hurt the company.',2]])+
   L.prose('This is the '+L.g('fools-choice','Fool’s Choice')+': believing you must pick between telling the truth and keeping a friend. We learn it young. A child tells Grandma they don’t like her pie, sees her hurt face, and decides to watch out for moments when honesty and kindness clash.')+
   L.note('People like Kevin refuse the choice. Kevin’s question was: <b>how can I be 100% honest with Chris and, at the same time, 100% respectful?</b>','bulb'));
  L.done();}},
{part:0,src:'Chapter 2 · The startling discovery',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Which thought shows the Fool’s Choice at work?</h1>');
  L.mc(L.card,['“If I tell Rosa the plan is too risky, I’ll lose Rosa’s trust.”','“How can I tell Rosa the plan is risky and still show respect?”'],0,
   'It assumes only two outcomes: be honest and lose the relationship, or stay quiet and keep it.',
   'That second thought is Kevin’s question. It refuses the Fool’s Choice by looking for a way to be honest <i>and</i> respectful.');}},
{part:0,src:'Chapter 2 · Beyond the Fool’s Choice',pts:1,
 solve:async L=>{L.$('#oa').click();L.$('#ob').click();},
 run(L){
  const seen=new Set();
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Theo Park, the practice manager, thinks the second clinic will burn out the team. Try both of the “only” options Theo sees.</h1>'+
   '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="chip" id="oa">'+L.ic('alert')+'Say it bluntly</button><button class="chip" id="ob">'+L.ic('x')+'Say nothing</button></div>'+
   L.lanes([['alert','Bluntly','<div class="res" id="ra">Not tried yet.</div>',3],['x','Silently','<div class="res" id="rb">Not tried yet.</div>',2]])+'<div id="fq"></div>');
  const ask=()=>{if(seen.size<2||L.$('#fq').innerHTML)return;const q=L.$('#fq');q.innerHTML='<h2 class="sub">Both roads cost something. What would Kevin ask before speaking?</h2>';
    L.mc(q,['Which of these two options costs me less?','How can I be fully honest and fully respectful?'],1,
     'That’s the third road the Fool’s Choice hides. Theo doesn’t have to pick between honesty and the relationship.',
     'Picking the cheaper of two bad options is still the Fool’s Choice. Kevin looked for a way to be honest <i>and</i> respectful.');};
  L.$('#oa').onclick=function(){this.classList.add('sel');seen.add(0);L.$('#ra').innerHTML='<span style="color:var(--no)">“This plan will wreck us.” Rosa gets defensive, digs in, and stops asking Theo’s opinion.</span>';ask();};
  L.$('#ob').onclick=function(){this.classList.add('sel');seen.add(1);L.$('#rb').innerHTML='<span style="color:var(--no)">Rosa and Theo stay friendly. The clinic opens, the team is stretched thin, and two techs quit.</span>';ask();};}},
{part:0,src:'Chapter 2 · Beyond the Fool’s Choice',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Fool’s Choice or refusing it?',['Fool’s Choice','Refusing it'],[
   ['Kit thinks: “Either I tell Rosa the dosage looks wrong, or I stay on Rosa’s good side.”',0,'Kit sees only two options: honesty or the relationship.'],
   ['Jordan thinks: “I want Rosa to hear the safety concern, and I want Rosa to feel respected.”',1,'Jordan is after both at once. That’s Kevin’s mindset.'],
   ['Theo thinks: “Telling Jordan about the rota change will just start a fight, so I’ll email it.”',0,'Theo assumes honesty means a fight, so Theo dodges the talk.'],
   ['Rosa thinks: “How can I tell Theo the budget is a mess without making Theo feel attacked?”',1,'Rosa wants to be candid and kind at the same time.']]);}},

/* ---------- PART 2: THE SHARED POOL ---------- */
{part:1,src:'Chapter 2 · Dialogue',run(L){
  L.h(L.kick('learn','What Kevin achieved')+'<h1 class="q">Dialogue: getting all the relevant meaning out in the open</h1>'+
   L.prose('Skilled people find a way to get all the relevant information, from themselves and from others, into the open. The book calls this '+L.g('dialogue','dialogue')+': the free flow of meaning between two or more people.')+
   L.prose('Each of us walks in with our own <b>pool of meaning</b>: our opinions, feelings, theories and experiences. In a crucial conversation, those pools don’t match.')+
   L.flow([['person','Your pool','what you think and feel','',2],['chat','Dialogue','meaning flows both ways','',1],['layers','Shared pool','what everyone now knows','',4]])+
   L.prose('Skilled people make it safe for everyone to add to the '+L.g('pool','Pool of Shared Meaning')+', even ideas that seem wrong. They don’t agree with everything. They just make sure it all gets said.'));
  L.done();}},
{part:1,src:'Chapter 2 · Filling the Pool of Shared Meaning',pts:1,
 solve:async L=>{[...L.$('#pp').children].forEach(b=>b.click());},
 run(L){
  const P=[['Rosa','The north side of town has no vet at all.'],['Jordan','Techs already work about 8 hours of overtime a week.'],['Theo','Next year’s budget only covers hiring two new staff.'],['Kit','Many clients keep asking for evening appointments.']];let k=0;
  L.h(L.kick('pr','See it happen')+'<h1 class="q">In the second-clinic meeting, each person knows something the others don’t. Tap each one to add their meaning to the pool.</h1><div id="pp" style="display:flex;gap:8px;flex-wrap:wrap"></div>'+
   '<div style="background:var(--soft);border-radius:16px;padding:14px;margin:10px 0 6px;min-height:90px"><div class="small" style="margin-bottom:6px"><b>Shared pool</b></div><div id="pl" class="small">Empty. Only Rosa’s plan is on the table.</div></div>'+
   '<div class="meterrow"><div class="lb">How informed the decision is</div><div class="meter"><div id="mq" style="width:10%;background:var(--ok-strong)"></div></div></div><div id="pq"></div>');
  P.forEach(p=>{const b=document.createElement('button');b.className='chip';b.innerHTML=L.ic('person')+p[0];b.onclick=()=>{if(b.classList.contains('sel'))return;b.classList.add('sel');k++;
    if(k===1)L.$('#pl').innerHTML='';L.$('#pl').innerHTML+='<div style="margin:4px 0">'+L.ic('check')+'<b>'+p[0]+':</b> '+p[1]+'</div>';L.$('#mq').style.width=(10+k*22)+'%';
    if(k===4){const q=L.$('#pq');q.innerHTML='<h2 class="sub">Now that the pool is full, what is the group most likely to do?</h2>';
      L.mc(q,['Pick the plan exactly as Rosa first proposed it','Find an option nobody brought in alone','Drop the idea of growing altogether'],1,
       'Maybe a small evening-hours clinic first, staffed by the two new hires. Ideas build on each other, and the result beats any single starting idea. The book calls the shared pool the birthplace of '+L.g('synergy','synergy')+'.',
       'With all four facts in view, people start building on each other. The book says this often produces an option no one thought of at first.');}};L.$('#pp').appendChild(b);});}},
{part:1,src:'Chapter 2 · Filling the Pool of Shared Meaning',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">When the pool is dangerously shallow</h1>');
  L.beats(L.card,[
   ['The operation','A woman went into hospital to have her tonsils out. The surgical team removed part of her foot instead.'],
   ['The witnesses','At least seven people in the room wondered why the surgeon was working on the foot.'],
   ['The silence','None of them said anything. Each was afraid to speak up to the surgeon.'],
   ['The lesson','When people hold back meaning, individually smart people can do collectively stupid things.'],
   ['Beyond hospitals','The book notes this happens anywhere the boss is smart, confident and outspoken. People keep their views to themselves rather than risk angering someone powerful.']],
   'Maplewood has its own version: Jordan has watched Rosa skip the pre-surgery checklist twice and said nothing to Rosa.');}},
{part:1,src:'Chapter 2 · Filling the Pool of Shared Meaning',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Why did a skilled surgical team make such a terrible mistake?</h1>');
  L.mc(L.card,['Key doubts never made it into the shared pool','The team lacked the medical skill for the job'],0,
   'Seven people had the right doubt. It stayed in their heads, so the group acted as if no one had it.',
   'They were trained professionals, and seven of them sensed something was wrong. The doubt simply never got said out loud.');}},
{part:1,src:'Chapter 2 · Filling the Pool of Shared Meaning',run(L){
  L.h(L.kick('learn','The second payoff')+'<h1 class="q">A full pool also makes people act on the decision</h1>'+
   L.prose('A bigger pool gives <b>smarter decisions</b>. It also gives <b>stronger commitment</b>. People who saw all the reasons understand why the choice is best, so they act on it together. Kevin’s colleagues bought in because they understood, not just because they were in the room.')+
   L.prose('People who sat silently, or had an idea forced on them, rarely commit. They may say yes, then follow through halfheartedly, criticize quietly or resist.')+
   L.quote('He that complies against his will is of his own opinion still.','Samuel Butler, quoted in chapter 2')+
   L.note('This doesn’t mean every decision needs a vote, or that the boss can’t decide. Whoever makes the call, a fuller pool means a better choice and stronger conviction.','info'));
  L.done();}},
{part:1,src:'Chapter 2 · Filling the Pool of Shared Meaning',pts:1,run(L){
  L.h(L.kick('pr','Rosa pushes back')+'<h1 class="q">Theo suggests getting everyone’s views on the second clinic. Rosa snaps: “So now I need a staff vote to run my own clinic?” What’s the best reply, based on this chapter?</h1><div id="hq"></div>');
  L.mc(L.$('#hq'),['“Yes, a vote is the only fair way to decide.”','“No, you’d still decide. You’d just know more first.”','“No, but you should let the staff decide this one.”'],1,
   'The book is clear: the point isn’t consensus. Whoever decides, a fuller pool means a better choice and a team that actually follows through.',
   'The book says filling the pool doesn’t mean handing the decision to a vote or to the staff. Rosa can still decide; the point is to decide with all the meaning in view.');}},
{part:1,src:'Chapter 2 · Filling the Pool of Shared Meaning',pts:4,run(L){
  L.h(L.kick('pr','What did the pool change?')+'<h1 class="q">Sort each Maplewood outcome by which benefit of a full pool it shows.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Smarter decision','Stronger commitment'],[
   ['After hearing Theo’s budget numbers, Rosa delays the opening by six months.',0,'New information changed the choice itself.'],
   ['Jordan, who argued against the plan, helps train new techs because Jordan understands why it’s happening.',1,'Understanding the reasons turned a critic into a willing helper.'],
   ['Kit’s point about evening hours leads to a cheaper, smaller first step.',0,'Kit’s meaning improved the plan.'],
   ['Nobody grumbles in the break room after the meeting, because everyone was heard.',1,'People who were heard don’t quietly resist.']],
   'Both payoffs come from the same thing: getting all the meaning into the pool.');}},

/* ---------- PART 3: SILENCE AND VIOLENCE ---------- */
{part:2,src:'Chapter 2 · Filling the Pool of Shared Meaning',run(L){
  L.h(L.kick('learn','Two ways to wreck the pool')+'<h1 class="q">When we don’t know how to share meaning, we play costly games</h1>'+
   L.lanes([['lock','Silence','We <b>hold meaning back</b>. We don’t confront people in authority. We drop hints, use sarcasm or a look of disgust, play the martyr, or blame a whole team instead of the one person.',2],
            ['flame','Violence','We <b>force meaning in</b>. We act like we know everything, discredit others, borrow the boss’s power, give one-sided speeches or make hurtful comments.',3]])+
   L.prose(L.g('silence','Silence')+' and '+L.g('violence','violence')+' look opposite, but both shrink the shared pool. One keeps meaning out; the other pushes everyone else’s meaning out.'));
  L.done();}},
{part:2,src:'Chapter 2 · Filling the Pool of Shared Meaning',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">In the break room, Jordan says loudly, “Great, another clinic. Maybe we can sleep here too.” Is this silence or violence?</h1>');
  L.mc(L.card,['Violence, because it’s loud and sharp','Silence, because the real point is held back'],1,
   'Surprising but true: the book lists sarcasm under silence. Jordan hints at the concern but never puts it plainly to the person who decides.',
   'It sounds aggressive, but the book counts sarcasm and hints as silence. Jordan never says the concern plainly to Rosa, so the meaning stays out of the pool.');}},
{part:2,src:'Chapter 2 · Filling the Pool of Shared Meaning',pts:5,run(L){
  L.h(L.kick('pr','Sort the moves')+'<h1 class="q">Which way does each move push meaning?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Silence','Violence','Dialogue'],[
   ['Theo tells the whole team “some people” are leaving records late, hoping Kit gets the hint.',0,'Blaming a group instead of the one person is a way to avoid the real talk.'],
   ['Rosa says, “I’ve run this clinic for fifteen years. I think I know what works.”',1,'Using rank to shut down other views forces Rosa’s meaning in.'],
   ['Jordan tells Theo, “Kit doesn’t know what they’re doing,” to win an argument.',1,'Discrediting someone so their view won’t count is violence.'],
   ['Kit nods in the meeting, then rolls their eyes once Rosa looks away.',0,'A look of disgust instead of words keeps the meaning out.'],
   ['Theo says, “Here’s what I’m seeing in the budget. What am I missing?”',2,'Theo adds meaning and invites others to add theirs.']],
   'Silence keeps your meaning out. Violence pushes others’ meaning out. Dialogue lets it all in.');}},

/* ---------- PART 4: THE ROAD AHEAD ---------- */
{part:3,src:'Chapter 2 · Dialogue skills are learnable',run(L){
  L.h(L.kick('learn','The good news')+'<h1 class="q">Dialogue skills are easy to spot and fairly easy to learn</h1>'+
   L.prose('When you watch someone turn a doomed, heated talk into a healthy one, you notice. The usual reaction is a quiet “Wow.”')+
   L.prose('The authors spent years following people like Kevin, taking notes when talks turned crucial, then testing what they saw until they found the skills that explained the success. Then they taught those skills and watched results and relationships improve.')+
   L.tiers([['person','Part one: create the right conditions','Work on yourself first, watch for problems, examine your own thinking and catch trouble early, so dialogue becomes the easy path.'],
            ['chat','Part two: talk, listen and act together','Share delicate views, draw out people who go quiet, and turn talk into action.'],
            ['layers','Part three: put it all together','One model, an extended example and many tough cases to practice on.']]));
  L.done();}},
{part:3,src:'Chapter 2 · Beyond the Fool’s Choice',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Tap each piece to build the question Jordan should ask before raising the skipped checklist with Rosa.</h1>');
  L.sentence(L.card,[['How can I','Should I'],['be 100% honest with Rosa','hint at the problem to Rosa'],['and at the same time','or instead'],['100% respectful?','keep the peace?']],[0,0,0,0],
   [['“Should I” sets up a yes-or-no choice. Kevin’s question looks for a way.'],['Hinting is silence. Kevin aimed for full honesty.'],['“Or instead” brings back the Fool’s Choice.'],['Keeping the peace by holding back is the silent side of the Fool’s Choice.']],
   'That’s Kevin’s question, aimed at Maplewood’s safety problem. It refuses the Fool’s Choice before Jordan says a word.');}},
{part:3,src:'Chapter 2 · Dialogue',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Mixed review',['Fool’s Choice','Silence','Violence','Dialogue'],[
   ['Kit decides that pointing out Rosa’s dosage error would ruin their working relationship, so Kit keeps quiet.',0,'Kit believes honesty and the relationship can’t coexist. That belief is the Fool’s Choice.'],
   ['Jordan gives Theo the cold shoulder for a week, hoping Theo will notice the overtime problem.',1,'Freezing someone out holds meaning back. It’s silence.'],
   ['Rosa talks over Theo for ten minutes and ends with, “So we agree.”',2,'A one-sided speech forces Rosa’s view in. That’s violence.'],
   ['Jordan tells Rosa what they saw in surgery, then asks how Rosa sees it.',3,'Jordan shares meaning and invites Rosa’s. The pool grows.']]);}},
{part:3,src:'Chapter 2 · Summary',pts:1,run(L){
  L.h(L.kick('pr','Putting it together')+'<h1 class="q">The second-clinic decision is next week. What should Theo aim for in that meeting?</h1><div id="hq"></div>');
  L.mc(L.$('#hq'),['Get every concern into the open before Rosa decides','Let Rosa decide quickly so nobody feels uneasy','Collect concerns privately and email them to Rosa'],0,
   'A full pool gives Rosa a smarter decision and gives the team a reason to commit to it, whatever Rosa decides.',
   'Keeping things comfortable or passing concerns around by email both keep meaning out of the shared pool. Theo’s job is to help everything get said, openly, before the call is made.');}}
  ]
});
</script>
</body>
</html>
