  return {cards:[{i:'Tip-off',s:(r()<.5?'A':'B')+' wins the tip',w:1},{i:'Game',s:mid,w:1},{i:'Final',b:'21–'+(17+Math.floor(r()*3)),s:(a?'A':'B')+' wins',t:'up',w:1}],out:a?'a':'b',log:'champion '+(a?'A':'B')+' wins'};};}
function txWeek(){return r=>{const a=r()<.5,b=r()<.5,c=r()<.3;

/* the card table: deal the same bet as parallel worlds, tally each outcome */
function txTable(host,o){
  const counts={};o.rows.forEach(x=>counts[x[0]]=0);let r=txRng(o.seed||1),total=0,busy=false;
  const w=document.createElement('div');w.className='tx-wrap';
  w.innerHTML='<div class="tx-tab"><div class="tx-bet"><span>'+(o.label||'On the table')+'</span><b class="tx-bt">'+o.bet+'</b></div><div class="tx-cards">'+(o.backs?Array(o.backs).fill('<div class="tx-c back sm">?</div>').join(''):'')+'</div>'+(o.track?TX_TRACK:'')+
   '<p class="tx-log" aria-live="polite">'+(o.hint||'No worlds dealt yet.')+'</p><div class="tx-tal">'+o.rows.map(x=>'<div class="tx-tr" data-k="'+x[0]+'"><span style="color:var(--'+x[2]+')">'+x[1]+'</span><div class="tx-mk">'+txMarks(0,x[2])+'</div><b>0</b></div>').join('')+'</div>'+
   (o.note===false?'':'<p class="tx-ill">'+(o.note||'Card odds are illustrative.')+'</p>')+'</div>'+
   (o.deals?'<div class="tx-btns">'+o.deals.map((n,j)=>'<button class="btn'+(j===o.deals.length-1?' pri':'')+'" data-n="'+n+'">'+TX_DEAL+(o.dealText?o.dealText(n):(n===1?'Deal 1 world':'Deal '+n))+'</button>').join('')+'</div>':'');
  host.appendChild(w);
  const tok=w.querySelector('.tx-tok'),ownB=w.querySelector('.tx-own b');
  const moveTok=v=>{if(tok){tok.style.transform='translateX('+txX(v)+'px)';ownB.textContent='$'+v+'k';}};
  const tally=()=>o.rows.forEach(x=>{const row=w.querySelector('.tx-tr[data-k="'+x[0]+'"]');row.querySelector('.tx-mk').innerHTML=txMarks(counts[x[0]],x[2]);row.querySelector('b').textContent=counts[x[0]];});
  const log=t=>{w.querySelector('.tx-log').innerHTML=t;};
  function show(wd,anim,cb){const cs=w.querySelector('.tx-cards');cs.innerHTML='';moveTok(50);
    if(!anim){cs.innerHTML=wd.cards.map(c=>txCard(c)).join('');if(wd.path)moveTok(wd.path[wd.path.length-1]);if(cb)cb();return;}
    busy=true;let j=0;const gap=wd.cards.length>4?170:260;
    const step=()=>{if(!w.isConnected){busy=false;return;}
      if(j===wd.cards.length){busy=false;if(cb)cb();return;}
      cs.insertAdjacentHTML('beforeend',txCard(wd.cards[j],true));if(wd.path)moveTok(wd.path[j]);j++;setTimeout(step,gap);};
    step();}
  const api={counts,el:w,get total(){return total;},get busy(){return busy;},log,
    deal(n){if(busy)return false;let last;for(let j=0;j<n;j++){last=o.world(r);total++;counts[last.out]++;}
      if(n===1)show(last,true,()=>{tally();log('World '+total+': '+last.log);if(o.onDeal)o.onDeal(api,last);});
      else{show(last,false);tally();log('Worlds '+(total-n+1)+'–'+total+' dealt. Last one: '+last.log+'.');if(o.onDeal)o.onDeal(api,last);}
      return true;},
    preview(wd,anim,cb){show(wd,anim,cb);},
    bet(t){w.querySelector('.tx-bt').innerHTML=t;}};
  w.querySelectorAll('.tx-btns button').forEach(b=>b.onclick=()=>api.deal(+b.dataset.n));
  return api;}

   '<b>Rerun it many times.</b> How often does it go badly? An easy bet (champion vs filmmaker) or a hard bet (two champions)? A good result may have been luck.',

   '<b>Course application.</b> Reach for it when you can’t test for real, are choosing between futures, suspect a good result was luck, or need to know what you value or what’s fair. One-minute move: ask → picture it → change one variable → imagine 100 runs → adjust. Stalled? Do the research, change a different variable, or explore instead of concluding.'

{part:0,src:'Thought Experiment · Betting on Basketball',
 solve:async L=>{for(let j=0;j<6;j++)L.$('#cy-n').click();},
 run(L){
  const S=[['Ask a question','Who would win a one-on-one game?'],['Do background research','Who are these two? How tall, how fit, how skilled?'],['Form a hypothesis','The champion, easily.'],['Test it in your head','Picture the game in detail, many times over.'],['Analyze the outcomes','In how many games does the filmmaker win? Almost none.'],['Compare and adjust','The hypothesis holds. New question: what about two champions?']];
  const P=[[150,34],[218,73],[218,151],[150,190],[82,151],[82,73]];
  const LB=[['Ask',150,13,'middle'],['Research',240,77,'start'],['Hypothesis',218,184,'middle'],['Test in your head',150,225,'middle'],['Analyze',82,184,'middle'],['Compare',60,71,'end']];
  let k=0;
  const draw=()=>{let s='<svg class="tx-fig" viewBox="0 0 300 232" role="img" aria-label="The six steps of a thought experiment, in a loop"><circle cx="150" cy="112" r="78" fill="none" stroke="var(--line2)" stroke-width="3" stroke-dasharray="6 5"/>';
    if(k>=6)s+='<text x="150" y="106" text-anchor="middle" font-size="12" font-weight="700" fill="var(--pri)">Change one variable,</text><text x="150" y="122" text-anchor="middle" font-size="12" font-weight="700" fill="var(--pri)">go round again</text>';
    P.forEach((p,j)=>{const on=j<k;s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="16" fill="'+(on?'var(--pri)':'var(--card)')+'" stroke="'+(on?'var(--pri)':'var(--line2)')+'" stroke-width="2.5"/><text x="'+p[0]+'" y="'+(p[1]+5)+'" text-anchor="middle" font-size="14" font-weight="700" fill="'+(on?'var(--pri-ink)':'var(--muted)')+'">'+(j+1)+'</text>';
      const l=LB[j];s+='<text x="'+l[1]+'" y="'+l[2]+'" text-anchor="'+l[3]+'" font-size="12" font-weight="'+(on?700:500)+'" fill="'+(on?'var(--ink)':'var(--muted)')+'">'+l[0]+'</text>';
      if(j===5)s+='<text x="60" y="86" text-anchor="end" font-size="12" font-weight="'+(on?700:500)+'" fill="'+(on?'var(--ink)':'var(--muted)')+'">&amp; adjust</text>';});
    L.$('#cy-s').innerHTML=s+'</svg>';
    L.$('#cy-c').innerHTML=k===0?'<b>Rigor, not daydreaming</b>Tap through the steps with the basketball question.':'<b>Step '+k+' · '+S[k-1][0]+'</b>'+S[k-1][1];};
  L.h(L.kick('learn','Rigor, not daydreaming')+'<h1 class="q">Six steps, like a real experiment</h1><div id="cy-s"></div><div class="tx-cyc" id="cy-c" aria-live="polite"></div>'+
   '<div class="tx-btns"><button class="btn pri" id="cy-n">'+L.ic('arrow')+'Next step</button></div><div id="cy-x"></div>');
  draw();
  L.$('#cy-n').onclick=()=>{if(k>=6)return;k++;draw();
    if(k===6){L.$('#cy-n').remove();L.$('#cy-x').innerHTML='<p class="tx-cap">The book’s big advantage: there’s no limit to how often you can change a variable and rerun. Seeing the full spread of outcomes shows what you can influence and what to expect.</p>';L.done();}};}},

{part:1,src:'Thought Experiment · Reducing the Role of Chance',
 solve:async L=>{for(let j=0;j<3;j++)L.$('#mg-n').click();},
 run(L){
  const S=['$100,000 of stock: half your own cash, half a '+L.g('margin-loan','margin loan')+' from the broker.','A few years on, the stock has doubled to $200,000. You still owe $50,000, so yours is $150,000: <b>tripled</b>. Financial genius?','Rerun it. Nearly every stock has fallen 50% at some point. Say it falls first: $50,000 of stock, and you owe $50,000. Yours: <b>$0</b>.','The broker calls in the loan. Game over, even if the stock later doubles. From 1929 to 1932 the whole New York Stock Exchange fell about 90%.'];
  let k=0;const H=v=>Math.round(v*0.78)+'px';
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">The bet that tripled your money</h1>'+
   '<div class="tx-bars"><div class="tx-col" id="mg-c0"><div class="tx-seg own" style="height:'+H(50)+'">Yours<br>$50k</div><div class="tx-seg loan" style="height:'+H(50)+'">Borrowed<br>$50k</div><small><b>$100k</b>Day 1</small></div>'+
   '<div class="tx-col off" id="mg-c1"><div class="tx-seg own" style="height:'+H(150)+'">Yours<br>$150k</div><div class="tx-seg loan" style="height:'+H(50)+'">Borrowed<br>$50k</div><small><b>$200k</b>Doubled</small></div>'+
   '<div class="tx-col off" id="mg-c2"><div class="tx-seg zero">Yours $0</div><div class="tx-seg loan" style="height:'+H(50)+'">Borrowed<br>$50k</div><small><b>$50k</b>Fell 50%</small></div></div>'+
   '<p class="tx-cap" id="mg-t" aria-live="polite"></p><div class="tx-btns"><button class="btn pri" id="mg-n">'+L.ic('arrow')+'Next</button></div>'+
   '<p class="small" style="margin:8px 0 0">The book’s story is about thinking, not investment advice.</p>');
  const draw=()=>{L.$('#mg-t').innerHTML=S[k];if(k>=1)L.$('#mg-c1').classList.remove('off');if(k>=2)L.$('#mg-c2').classList.remove('off');};draw();
  L.$('#mg-n').onclick=()=>{if(k>=3)return;k++;draw();if(k===3){L.$('#mg-n').remove();L.sheet('info','Was it genius?','One world tripled. The thought experiment asks what else could have happened, and how often. Next, you’ll deal it.');L.done();}};}},

{part:1,src:'Thought Experiment · Reducing the Role of Chance',pts:1,
 solve:async L=>{L.$('#mp-o').children[2].click();L.$('#mp-go').click();},
 run(L){
  let p=null,fin=false;const O=['Almost none (under 5)','A few (5 to 15)','Lots (more than 25)'];
  L.h(L.kick('pr','Predict, then deal')+'<h1 class="q">Deal the tripling bet in 100 worlds. In how many does the broker call in the loan?</h1>'+
   '<div class="tx-chips" id="mp-o"></div><div id="mp-t"></div><div class="tx-btns"><button class="btn pri" id="mp-go" disabled>'+TX_DEAL+'Deal 100 worlds</button></div><div class="tx-res" id="mp-x"></div>');
  O.forEach((t,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=t;b.onclick=()=>{if(fin)return;p=j;[...L.$('#mp-o').children].forEach(x=>x.classList.toggle('sel',x===b));L.$('#mp-go').disabled=false;};L.$('#mp-o').appendChild(b);});
  const t=txTable(L.$('#mp-t'),{bet:'$100k of stock, half borrowed',seed:13,world:txMargin(),track:true,rows:TX_MROWS,hint:'Pick a prediction, then deal.',note:'Card odds are illustrative; the money arithmetic is the book’s.'});
  L.$('#mp-go').onclick=()=>{if(fin||p===null)return;fin=true;L.$('#mp-go').disabled=true;t.deal(100);
    const b=t.counts.b,right=b<5?0:b<=15?1:b>25?2:-1,ok=p===right;L.award(ok);
    L.$('#mp-go').parentNode.remove();
    L.fb(L.$('#mp-x'),'In <b>'+b+' of 100</b> worlds the stock fell 50% at some point and the broker called in the loan, even where it later rose. It tripled in '+t.counts.t+'. So the real tripling was a hard bet, like two champions. If luck did the work, the book says: work on your process to reduce the role of chance.','info');
    L.sheet(ok?'ok':'no',ok?'Lots of them':'More than you’d think','Out of the game in '+b+' of 100 worlds. A good result doesn’t prove a good decision.');L.done();txShow(L.$('#mp-t'));};}},

  L.$('#el-go').onclick=()=>{L.$('#el-s').classList.add('open');L.$('#el-go').remove();
    L.$('#el-c').innerHTML='Left: space, pulled up ever faster. Right: Earth. Einstein reasoned you can’t tell, and the idea grew into his theory of gravity. You can’t build it, but you can think it through, just like “if money were no object”.';L.done();};}},

{part:2,src:'Thought Experiment · Betting on Basketball',pts:1,
 solve:async L=>{for(const k of ['pay','trip','risk'])L.$('#fn-s .tx-p[data-k="'+k+'"]').click();L.$('#fn-q').children[1].click();},
 run(L){
  const PR=[{k:'pay',l:'Pay',no:'If money were no object',c:'Still unsure',w:'Without the 20% raise, Fieldnote still pulls: Ira likes the idea of building something new.',v:'Building something new'},
   {k:'trip',l:'Commute',no:'If distance were no object',c:'Take the Fieldnote job',w:'With no 90-minute trip and no move, Ira would say yes.',v:'Evenings at home with Remy',flip:1},
   {k:'risk',l:'Security',no:'If the risk were no object',c:'Still unsure',w:'Even if Fieldnote were sure to last, the long trip would still weigh on Ira.',v:'A safety net'},
   {k:'remy',l:'Remy’s worry',no:'If Remy were fully on board',c:'Still unsure',w:'Remy’s blessing helps, but Ira still pictures that trip twice a day.',v:'Deciding together with Remy'},
   {k:'cal',l:'Deadline',no:'If time were no object',c:'Still unsure',w:'More time would let Ira finish the switchover first. The trip is still there.',v:'Finishing the switchover'}];
  let asked=false,fin=false;
  L.h(L.kick('pr','Hands-on · if X were no object')+'<h1 class="q">Fieldnote offered Ira an operations job. Lift one prop at a time and watch what Ira would still choose.</h1>'+

   onLift(up,seen){if(asked||seen.length<3)return;asked=true;
    L.$('#fn-x').innerHTML='<h2 class="sub" style="margin:14px 0 6px">In this story, which variable drives Ira’s choice?</h2><div class="tx-chips" id="fn-q"></div><div id="fn-r"></div>';
    PR.forEach(p=>{const b=document.createElement('button');b.className='chip';b.textContent=p.l;b.onclick=()=>{if(fin)return;fin=true;const ok=p.k==='trip';b.classList.add(ok?'ok':'no');L.award(ok);
      L.fb(L.$('#fn-r'),'That’s how this made-up example is set up, not a rule from the book: in your own choice, any variable could matter. The book’s point: picturing impossible worlds shows what you value and where to put your energy.','info');
      L.sheet(ok?'ok':'no',ok?'The commute':'Lift the commute and look again','In Ira’s story, only lifting the commute flips the card to “take the job”.');L.done();txShow(L.$('#fn-s .tx-props'));};L.$('#fn-q').appendChild(b);});}});}},

{part:2,src:'Thought Experiment · Reducing the Role of Chance',pts:1,
 solve:async L=>{L.$('#ro-r').children[2].click();L.$('#ro-t [data-n="20"]').click();L.$('#ro-lock').click();},
 run(L){
  let rule=null,dealt=false,fin=false;
  L.h(L.kick('pr','Challenge · behind the veil')+'<h1 class="q">Rush jobs keep the team late. Pick a late-shift rule, then let the deal pick your seat.</h1>'+
   '<p class="small" style="margin:0 0 6px">Find a rule you’d accept whatever seat you get, then lock it in.</p><div class="tx-chips col" id="ro-r"></div><div id="ro-t"></div>'+
   '<div class="tx-btns"><button class="btn pri" id="ro-lock" disabled>'+L.ic('lock')+'Lock in this rule</button></div><div class="tx-res" id="ro-x"></div>');
  const mk=j=>{L.$('#ro-t').innerHTML='';txTable(L.$('#ro-t'),{label:'Your rule',bet:j===null?'Pick a rule above':TX_RULES[j].t.split(';')[0],seed:21+(j||0),backs:j===null?5:0,world:j===null?null:txSeat(TX_RULES[j]),
    rows:[['f','Seat treated fairly','ok'],['h','Seat hurt','no']],deals:j===null?null:[1,20],dealText:n=>n===1?'Deal my seat':'Deal 20 seats',hint:j===null?'Five seats, face down. You don’t know which is yours.':'Deal to see where you land.',note:'Seat outcomes are illustrative.',
    onDeal(){dealt=true;L.$('#ro-lock').disabled=false;}});};
  mk(null);
  TX_RULES.forEach((R,j)=>{const b=document.createElement('button');b.className='chip';b.textContent='ABCD'[j]+' · '+R.t;b.onclick=()=>{if(fin)return;rule=j;dealt=false;L.$('#ro-lock').disabled=true;[...L.$('#ro-r').children].forEach(x=>x.classList.toggle('sel',x===b));mk(j);};L.$('#ro-r').appendChild(b);});
  L.$('#ro-lock').onclick=()=>{if(fin||!dealt||rule===null)return;fin=true;const ok=rule===2;L.award(ok);
    const hurt=TX_RULES[rule].o.map((x,k)=>x[0]?null:TX_ROLES[k]).filter(Boolean);
    L.$('#ro-lock').parentNode.remove();
    L.fb(L.$('#ro-x'),(ok?'':'Under that rule, <b>'+hurt.join(' and ')+'</b> get'+(hurt.length>1?'':'s')+' hurt. ')+'Only the posted rota with notice and swaps treats every seat fairly here. Notice rule D: the rule that makes Ira look generous lands hardest on Ira.',ok?'ok':'no');
    L.sheet(ok?'ok':'no',ok?'Fair to every seat':'Some seat gets hurt',ok?'Whichever seat you’re dealt, this rule holds up.':'Behind the veil, that seat could be yours.');L.done();txShow(L.$('#ro-t'));};}},

{part:2,src:'Thought Experiment · Betting on Basketball',pts:5,run(L){

{part:3,src:'Supporting Idea · Necessity and Sufficiency',
 solve:async L=>{L.$('#pl-try').click();for(let j=1;j<4;j++)L.$('#pl-p'+j).click();L.$('#pl-try').click();},
 run(L){
  const P=['New system installed','Staff trained','Clean data moved over','Go-live plan agreed'],on=[true,false,false,false],LUCK=[1,0,1,1,1,0,1,1,0,1];
  let miss=false,all=false,fin=false,open=false,luck=1;
  L.h(L.kick('learn','Supporting idea · necessity and sufficiency')+'<h1 class="q">Set every pin. Does the switchover lock always open?</h1>'+
   '<p class="small" style="margin:0 0 4px">Each pin is something a smooth switchover needs. Ira controls pins 1–4. Try the lock with a pin missing, then with all four set.</p>'+
   '<div class="tx-lock" id="pl-svg"></div><p class="tx-own" id="pl-ro" aria-live="polite">Not tried yet.</p><div class="tx-tries" id="pl-tr"></div>'+
   '<div class="tx-pins" id="pl-ps"></div><div class="tx-btns"><button class="btn pri" id="pl-try">'+L.ic('lock')+'Try the lock 10 times</button></div><div id="pl-x"></div>');
  const draw=()=>{L.$('#pl-svg').innerHTML=txLockSvg(on,luck,open);
    L.$('#pl-ps').innerHTML=P.map((p,j)=>'<button class="tx-pin'+(on[j]?' on':'')+'" id="pl-p'+j+'" aria-pressed="'+on[j]+'"><span class="n">'+(j+1)+'</span>'+p+'<em>'+(on[j]?'set':'tap to set')+'</em></button>').join('')+
     '<div class="tx-pin luck"><span class="n">5</span>Luck: no surprise rush week, no outage<em>not Ira’s to set</em></div>';
    P.forEach((_,j)=>L.$('#pl-p'+j).onclick=()=>{on[j]=!on[j];open=false;draw();});};
  draw();
  L.$('#pl-try').onclick=()=>{const ok=on.every(x=>x),res=LUCK.map(l=>ok&&l===1),n=res.filter(Boolean).length;
    luck=LUCK[9];open=res[9];draw();L.$('#pl-tr').innerHTML=res.map(txMini).join('');
    const gone=P.map((p,j)=>on[j]?null:j+1).filter(Boolean);
    L.$('#pl-ro').innerHTML=ok?'<b>Opened '+n+' of 10.</b> Every pin Ira controls was set; luck fell wrong '+(10-n)+' times.':'<b>Opened 0 of 10.</b> Pin '+gone.join(', ')+' missing: the lock can’t open, however lucky Ira is.';
    if(ok)all=true;else miss=true;
    if(all&&miss&&!fin){fin=true;L.$('#pl-x').innerHTML='<p class="tx-cap">Without any one pin, it never opens: each is <b>'+L.g('necessity-sufficiency','necessary')+'</b>. With all four, it still sometimes stays shut: together they aren’t <b>sufficient</b>. The book: the gap is often luck or chance. Writing well is necessary to be published, but not enough to become J. K. Rowling.</p>';
      L.sheet('info','Necessary, not sufficient','You can do everything required and still not get the result. That’s why, the book says, there’s no recipe for huge success, and why success stories can mislead. Pin odds are illustrative.');L.done();}};}},

{part:3,src:'Supporting Idea · Necessity and Sufficiency',pts:1,run(L){
  L.h(L.kick('try','Finish the sentence')+'<h1 class="q">Tap each piece until the sentence about Ira’s switchover is true.</h1>');
  L.sentence(L.card,[['Skipping training is fine for','Training is necessary for','Training guarantees'],['a smooth switchover, but not enough on its own.','a smooth switchover, so nothing else matters.'],['The rest is down to effort alone.','The gap is often luck.','The gap is the software’s fault.']],[1,0,1],
   [['Take that pin away and the lock never opens: training is necessary.','Guaranteed would make it sufficient. Even with every pin set, the lock sometimes stays shut.'],
    ['Clean data, the plan and the system are needed too, and even all of them together aren’t a guarantee.'],
    ['Effort sets the pins Ira controls; it can’t set the luck pin.','The software is one necessary pin among several. The gap is what nobody controls.']],
   'Necessary, not sufficient. Ira can set every pin and still plan for a bad day: the gap between necessary and sufficient is often luck.');}},

{part:3,src:'Course application · built on Thought Experiment',pts:1,
 solve:async L=>{for(let j=0;j<4;j++){L.$('#mv-nx').click();await L.sleep(1000);}L.$('#mv-q').children[1].click();},
 run(L){
  const ST=['Ask','Picture it','Change one','100 runs','Adjust'];
  const CAP=['<b>1 · Ask a clear question.</b> “Would moving nearer Wynn make life better for all three of us?”',
   '<b>2 · Picture it in detail.</b> One normal week living near Wynn: a long train to work (about two hours, illustrative), Remy’s new school run, tea with Wynn.',
   '<b>3 · Change one variable.</b> “If the commute were no object”: lift just the commute and the week turns good. So the commute is the variable that matters.',
   '<b>4 · Imagine 100 runs.</b> Back to the real commute. About 4 weeks in 10 are hard (illustrative odds): not ruin, but a hard bet, like two champions.',
   '<b>5 · Compare and adjust.</b> The guess “worth it, even with a long commute” didn’t hold. What’s Ira’s better next question?'];
  let s=0,fin=false;
  L.h(L.kick('learn','How this course applies the book · one-minute move')+'<h1 class="q">Run the move on Ira’s big question</h1>'+
   L.note('How this course applies the book: a one-minute version of the book’s six steps, run on the card table.','compass')+
   '<div class="tx-steps" id="mv-st"></div><div id="mv-t"></div><p class="tx-cap" id="mv-c" aria-live="polite"></p><div class="tx-chips col" id="mv-q"></div>'+
   '<div class="tx-btns"><button class="btn pri" id="mv-nx">'+L.ic('arrow')+'Next step</button></div>');
  const t=txTable(L.$('#mv-t'),{label:'The question',bet:'Move nearer Wynn?',seed:31,world:txWeek(),rows:[['g','Good week','ok'],['h','Hard week','no']],hint:'Nothing pictured yet.',note:'Week odds are illustrative.',backs:3});
  const draw=()=>{L.$('#mv-st').innerHTML=ST.map((x,j)=>'<span class="'+(j<=s?'on':'')+'">'+(j+1)+'<br>'+x+'</span>').join('');L.$('#mv-c').innerHTML=CAP[s];};
  draw();
  L.$('#mv-nx').onclick=()=>{if(t.busy||s>=4)return;s++;draw();
    if(s===1){t.preview({cards:[{i:'Commute',s:'Train delayed, home at 9',t:'dn',w:1},{i:'Remy',s:'Long new school run',t:'dn',w:1},{i:'Wynn',s:'Tea with Wynn',t:'up',w:1}]},true,()=>t.log('One pictured week: a hard week.'));}
    if(s===2){t.bet('If the commute were no object');t.preview({cards:[{i:'Commute',s:'Work 10 minutes away',t:'up',w:1},{i:'Remy',s:'Long new school run',t:'dn',w:1},{i:'Wynn',s:'Tea with Wynn',t:'up',w:1}]},true,()=>t.log('Same week, commute lifted: a good week.'));}
    if(s===3){t.bet('Move nearer Wynn? (real commute)');t.deal(100);}
    if(s===4){L.$('#mv-nx').remove();
      ['Which removal company is cheapest?','What would keep Wynn safe without a move: handrails, an alarm, more visits?','How can Ira stop worrying about the commute?'].forEach((q,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=q;
        b.onclick=()=>{if(fin)return;fin=true;const ok=j===1;b.classList.add(ok?'ok':'no');L.award(ok);
          L.sheet(ok?'ok':'no',ok?'A sharper question':'That skips what the run showed',(ok?'':'The runs showed the commute makes the move a hard bet; ignoring it or jumping to removals throws that away. ')+'Adjusting means a new question that uses what you learned: keep Wynn safe and close in touch without the costly variable. Then run that one.');L.done();};L.$('#mv-q').appendChild(b);});}};}},

{part:3,src:'Thought Experiment · The Trolley Experiment',
 solve:async L=>{for(let j=0;j<3;j++){L.$('#lm-p').children[j].click();await L.sleep(1100);}},
 run(L){
  const seen=new Set();let fin=false;
  const PRE=[
   ['Lucky win',t=>{t.deal(100);t.preview({cards:[{i:'Y1',b:'+60%',s:'Boom',t:'up'},{i:'Y2',b:'+30%',s:'Good year',t:'up'}],path:[110,158]},false);t.log('Shown: the real world, which tripled.');
     return 'The real world tripled, so the bet felt smart. Rerun it: in <b>'+t.counts.b+' of 100</b> worlds it ended in a margin call. The book: rerunning shows how good the decision was, whatever the actual result.';},
    {bet:'$100k of stock, half borrowed',seed:5,world:txMargin(),track:true,rows:TX_MROWS},
    'Can’t tell luck from skill? Change a different variable (“what if it went 50% worse?”) and count how often you’d be out of the game.'],
   ['One game only',t=>{t.deal(1);return 'Two champions, one game: someone wins, but that settles nothing. The book: even a real one-off contest isn’t definitive. Judge the bet by the spread, not by one result.';},
    {bet:'Two champions, one game',seed:4,world:txBall(true),rows:[['a','Champion A wins','h1'],['b','Champion B wins','h4']]},
    'No clear answer? Don’t stare at one run. Rerun it many times, or change a different variable and see if that one tips it.'],
   ['Rerun history',t=>{t.deal(20);const w=t.counts.w,n=t.counts.n;
     return 'Refined question: did the shooting change Austria’s policy? Far-fetched worlds are set aside. In <b>'+w+' of '+(w+n)+'</b> realistic imagined worlds war comes anyway, so here the shooting looks weaker as “the” cause. A rough sense of how much it contributed, not a verdict.'+txCauseMeter(w,n);},
    {bet:'Princip doesn’t fire. Does war still come?',seed:12,world:txHistory(),rows:[['w','War comes anyway','no'],['n','No war in these years','ok'],['u','Far-fetched: set aside','muted']],note:'Imagined worlds, made up for illustration. Not history.'},
    'Can’t tell which worlds are realistic? That’s a research gap: read up first. Still scattered? Explore what could have happened instead of concluding.'],
   ['Daydream',t=>{t.log('No research, so there’s nothing real to deal.');return 'Skip the research and the cards stay blank: you’re only picturing what you hope. The book: a thought experiment needs the same rigor as a real one.';},
    {bet:'Life at Fieldnote',backs:3,world:null,rows:[['x','Nothing to count','muted']],note:'No research done.'},
    'Can’t picture it in detail? Do the research first: ask someone who does the job, or look up the real numbers. Then run it.'],
   ['Rough sense only',t=>{t.deal(100);const r=txRng(5),f=txMargin(TX_MDECK2);let y=0;for(let j=0;j<100;j++)if(f(r).out==='b')y++;
     return 'Same bet, two guesses about the cards: <b>'+t.counts.b+'</b> worlds out of the game with this deck, <b>'+y+'</b> if crashes were half as common. The count moves with your guesses: a rough, useful sense of the odds, not a definitive answer.';},
    {bet:'$100k of stock, half borrowed',seed:5,world:txMargin(),track:true,rows:TX_MROWS},
    'Results swing with your guesses? Find the one guess that swings it most and research that number. Still unsure? Take a small step you can undo, then look again.']];
  L.h(L.kick('learn','Limits · where it stops working')+'<h1 class="q">Five ways a thought experiment can mislead</h1>'+
   '<p class="small" style="margin:0 0 6px">Tap at least three presets. Each jumps the card table to an extreme case from the book, with a way out if you get stuck.</p><div class="tx-chips" id="lm-p"></div><div id="lm-t"><div class="tx-cn"><small>Pick a preset</small>The table will deal the extreme case for you.</div></div>');
  PRE.forEach((P,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=P[0];
    b.onclick=()=>{[...L.$('#lm-p').children].forEach(x=>x.classList.toggle('sel',x===b));const h=L.$('#lm-t');h.innerHTML='';
      const t=txTable(h,P[2]);const cap=P[1](t);h.insertAdjacentHTML('beforeend','<div class="tx-cn"><small>From the book · '+P[0]+'</small>'+cap+'</div>'+txStall(P[3]));
      seen.add(j);if(seen.size>=3&&!fin){fin=true;L.done();}};
    L.$('#lm-p').appendChild(b);});}},

{part:3,src:'Course application · built on Thought Experiment',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Rigorous or not?',['Rigorous thought experiment','Not rigorous yet'],[
   ['Ira pictures life at Fieldnote: a big desk, a great team, no bad days.',1,'No research, nothing changed, no reruns: just the best case. That’s a daydream.'],
   ['Ira lists what a normal Monday at Fieldnote involves, then replays it with the train 30 minutes late.',0,'Grounded in facts, with one variable changed. That’s the method.'],
   ['Remy works out the rent for each option, then imagines the next year in each flat many times: how often does money get tight?',0,'Research first, then many reruns, asking how often it goes badly. That’s the book’s method.'],
   ['Ira replays last year’s argument with Bram and decides it was all Bram’s fault.',1,'Rerunning the past to declare one cause is the risky use. Explore what could have gone differently instead.']]);}},

{part:3,src:'Course application · built on Thought Experiment',
 solve:async L=>{L.$('#yt-d').children[0].click();L.$('#yt-s .tx-p[data-k="time"]').click();},
 run(L){
  const PR=[{k:'pay',l:'Money',no:'If money were no object'},{k:'time',l:'Time',no:'If time were no object'},{k:'others',l:'What others think',no:'If no one else’s opinion mattered'},{k:'fear',l:'Fear of failing',no:'If you couldn’t fail'},{k:'trip',l:'Distance',no:'If distance were no object'}].map(p=>Object.assign(p,{c:'What would you still choose?',w:'Whatever stays the same is a clue to what you really value.'}));
  let d=null,up=null,fin=false;
  L.h(L.kick('try','Your turn · ungraded')+'<h1 class="q">Put one of your own choices on the stage</h1>'+
   L.note('How this course applies the book: the book’s “if money were no object” move, used on your week.','compass')+
   '<p class="small" style="margin:0 0 4px">1. What kind of choice is it?</p><div class="tx-chips" id="yt-d"></div><p class="small" style="margin:6px 0 4px">2. Lift one prop.</p><div id="yt-s"></div><div id="yt-x"></div>');
  Object.keys(TX_WORRY).forEach(x=>{const b=document.createElement('button');b.className='chip';b.textContent=x;b.onclick=()=>{d=x;TX_ME.kind=x;[...L.$('#yt-d').children].forEach(y=>y.classList.toggle('sel',y===b));go();};L.$('#yt-d').appendChild(b);});
  txStage(L.$('#yt-s'),{who:'You',plain:1,props:PR,base:['Lift a prop to start','Your choice, as it is','Everything on stage at once.'],onLift(u){up=u;go();}});
  function go(){if(!d||!up)return;const p=PR.find(x=>x.k===up);
    L.$('#yt-x').innerHTML='<div class="tx-cn"><small>Your thought experiment</small><b>'+p.no+'</b>, what would you still choose about <b>'+d.toLowerCase()+'</b>? Whatever stays the same is what you value. Next, you’ll rerun your real plan 100 times.</div><textarea class="tx-ta" aria-label="Your note" placeholder="Optional: jot your answer. It stays on this screen."></textarea>';
    if(!fin){fin=true;L.done();}}}},

{part:3,src:'Course application · built on Thought Experiment',
 solve:async L=>{L.$('#rr-go').click();await L.sleep(60);L.$('#rr-w .tx-plan').click();await L.sleep(60);L.$('#rr-go').click();},
 run(L){
  const LV=['Rare','Sometimes','Often'],PCT=[0.05,0.2,0.4];
  let kind=TX_ME.kind||'A job or project choice',lvl=[1,1,1],fix=-1,phase=0,before=null,t=null;
  L.h(L.kick('try','How this course applies the book · your turn')+'<h1 class="q">Rerun your own plan 100 times</h1>'+
   '<div class="tx-chips" id="rr-k"></div><p class="small" style="margin:2px 0 2px">How often might each of these go wrong? Your guess.</p><div class="tx-wrs" id="rr-w"></div>'+
   '<div id="rr-t"></div><div class="tx-btns"><button class="btn pri" id="rr-go">'+TX_DEAL+'Run my plan 100 times</button></div><div class="tx-res" id="rr-x"></div>');
  const W=()=>TX_WORRY[kind];
  const world=()=>r=>{const hit=W().map((_,j)=>r()<(j===fix?0.05:PCT[lvl[j]])),n=hit.filter(Boolean).length;
    return {cards:W().map((w,j)=>({i:w[1],s:hit[j]?w[2]:'Goes fine',t:hit[j]?'dn':'up',w:1})),out:n===0?'g':n===1?'b':'h',log:n===0?'it goes fine':n===1?'a bump, but fine':'it goes badly'};};
  const mkT=()=>{L.$('#rr-t').innerHTML='';t=txTable(L.$('#rr-t'),{label:'Your plan',bet:phase?'Same plan, one worry planned for':kind,seed:41+phase*7+lvl.join('').length+lvl[0]*3+lvl[1]*5+lvl[2]*7,world:world(),backs:3,
    rows:[['g','Goes fine','ok'],['b','A bump','h3'],['h','Goes badly','no']],hint:phase?'Changed one variable. Run it again.':'Nothing run yet.',note:'Goes badly = two or more go wrong. Odds are your guesses: a rough sense only.'});};
  const drawW=()=>{L.$('#rr-w').innerHTML=W().map((w,j)=>'<div class="tx-wr'+(j===fix?' fix':'')+'"><span>'+w[0]+(j===fix?' <small style="color:var(--ok)">· planned for</small>':'')+'</span>'+
    (phase===1&&fix<0?'<button class="tx-plan" data-j="'+j+'">Plan for it</button>':'<div class="tx-seg3" role="group" aria-label="How often: '+w[0]+'">'+LV.map((l,k)=>'<button data-j="'+j+'" data-k="'+k+'" class="'+((j===fix?0:lvl[j])===k?'sel':'')+'"'+(phase?' disabled':'')+'>'+l+'</button>').join('')+'</div>')+'</div>').join('');
    L.$$('#rr-w .tx-seg3 button').forEach(b=>b.onclick=()=>{if(phase)return;lvl[+b.dataset.j]=+b.dataset.k;drawW();mkT();});
    L.$$('#rr-w .tx-plan').forEach(b=>b.onclick=()=>{fix=+b.dataset.j;phase=2;drawW();mkT();L.$('#rr-go').disabled=false;L.$('#rr-x').innerHTML='';});};
  const kinds=()=>{L.$('#rr-k').innerHTML='';Object.keys(TX_WORRY).forEach(x=>{const b=document.createElement('button');b.className='chip'+(x===kind?' sel':'');b.textContent=x;
    b.onclick=()=>{if(phase)return;kind=x;lvl=[1,1,1];kinds();drawW();mkT();};L.$('#rr-k').appendChild(b);});};
  const bar=(lab,v,col)=>'<text x="0" y="'+lab[1]+'" font-size="12" font-weight="600" fill="var(--ink)">'+lab[0]+'</text><rect x="92" y="'+(lab[1]-11)+'" width="190" height="14" rx="4" fill="var(--soft2)"/><rect x="92" y="'+(lab[1]-11)+'" width="'+Math.max(3,v*1.9)+'" height="14" rx="4" fill="var(--'+col+')"/><text x="296" y="'+lab[1]+'" text-anchor="end" font-size="12" font-weight="700" fill="var(--ink)">'+v+'</text>';
  kinds();drawW();mkT();
  L.$('#rr-go').onclick=()=>{if(t.busy||phase===1||phase===3)return;t.deal(100);const h=t.counts.h;
    if(phase===0){before=h;phase=1;L.$('#rr-go').disabled=true;drawW();
      L.$('#rr-x').innerHTML='<div class="tx-cn"><small>'+(h<=5?'An easy bet':'A hard bet')+'</small>Your plan goes badly in <b>'+h+' of 100</b> runs. '+(h<=5?'Like the champion against the filmmaker: rarely goes wrong.':'Like two champions: it could easily go either way.')+' Now change one variable: tap <b>Plan for it</b> on the worry you could prepare for (a backup, a buffer, a trial run).</div>';
      txShow(L.$('#rr-w'));}
    else if(phase===2){phase=3;L.$('#rr-go').parentNode.remove();
      L.$('#rr-x').innerHTML='<svg class="tx-fig" viewBox="0 0 300 52" role="img" aria-label="Goes badly: '+before+' of 100 before, '+h+' after"><text x="0" y="12" font-size="11.5" font-weight="700" fill="var(--muted)">GOES BADLY, OUT OF 100</text>'+bar(['Before',30],before,'no')+bar(['After the fix',48],h,'ok')+'</svg>'+
       '<p class="tx-cap">Planning for one worry moved your plan from <b>'+before+'</b> to <b>'+h+'</b> bad runs out of 100. That’s the book’s point: rerunning shows what you can influence and what to expect. Decide, or change another variable and rerun.</p>';
      L.done();txShow(L.$('#rr-t'));}};}},

{part:3,src:'Course application · built on Thought Experiment',run(L){
  L.h(L.kick('learn','How this course applies the book · your decision map')+'<h1 class="q">Where thought experiment sits on your map</h1><p class="small" style="margin:0 0 6px">Solid: models you’ve met so far. Dashed: still to come. Each row runs from the model to try first.</p>'+
   '<div class="tx-map">'+TX_MAP.map(r=>{const lit=r[1].includes('Thought experiment');return '<div class="tx-mr'+(lit?' lit':'')+'"><b>'+r[0]+'</b><div class="tx-ms">'+r[1].map((m,j)=>(j?'<i>→</i>':'')+'<span class="'+(m==='Thought experiment'?'me':TX_DONE.includes(m)?'d':'')+'">'+m+'</span>').join('')+'</div></div>';}).join('')+'</div>'+
   '<p class="tx-cap">First stop for a big bet between uncertain options (the Fieldnote offer, the lease). Second stop when you’re stuck with “the way it’s done”. Small, easy-to-undo choices: run it for a minute, then act.</p>');
  L.done();}}
  ]
});
</script>
