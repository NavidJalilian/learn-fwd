const DM_MOD={
 map:{n:'The map is not the territory',ic:'map',l:'0002',short:'Map ≠ territory',
  alt:'A folded map over the real landscape; the map misses a tree that is really there.',
  trig:['A number, report, review or listing is driving the decision','The data and what people tell you disagree','The map is old, or someone else made it'],
  move:['Name the map.','Ask who made it, when, and why.','Ask what it leaves out.','Touch the territory: one quick real check (call, visit, try it), then update the map.'],
  lim:['Every map leaves things out, and a perfect one would be useless: don’t demand one.','You still need maps: use one inside the range where it’s known to work.','Can’t check it yourself? Choose a careful mapmaker who is open to changing it.']},
 circle:{n:'Circle of competence',ic:'target',l:'0003',short:'Circle of competence',
  alt:'A solid circle where the Lifer knows the ground, a fading edge, and a Stranger standing outside.',
  trig:['You’re deciding in an unfamiliar field: car repair, legal, medical, a new industry','You feel oddly sure after a little reading','An expert or salesperson is advising you'],
  move:['Ask: am I a Lifer or a Stranger here? Do I know what I don’t know?','If a Stranger: learn the basics, then ask a Lifer which things matter most, and why.','Ask what the adviser gains from your choice.','Hold off on big spending until you’ve checked.'],
  lim:['You can’t always stay inside your circle: some decisions outside it still have to be made.','A little learning breeds false confidence.','A circle shrinks unless you keep learning, check yourself honestly and get outside feedback.','Supporting idea: if nothing could prove a claim wrong, you can’t test it. A trend is not a law.']},
 first:{n:'First principles thinking',ic:'layers',l:'0004',short:'First principles',

  ,lim:['It’s slow at first, and you’ll often hit “I don’t know” fast: don’t give up or get defensive.','First principles aren’t eternal truths: they depend on the situation and change as you learn.','Stopping at “because I said so” means you found an assumption, not a principle.']},

  move:['Ask one clear question and picture it playing out in detail.','Change one thing at a time (“if money were no object”).','Run it 100 times in your head: how often does it go badly?','Easy bet or hard one? Adjust your plan.'],
  lim:['It needs rigor, not daydreaming.','Replaying the past is the riskiest use: history is chaotic, so explore what could have happened; don’t declare a cause.','It gives a rough sense, not a final answer.','Supporting idea: having what’s necessary isn’t enough to succeed; luck often fills the gap.']},

  move:['Write the immediate result.','Ask “And then what?” twice: for you, for others, for trust.','Keep only the most likely effects.','Ask: does this move me toward my goal, or away?'],
  lim:['It can’t predict the future: you only see likely effects from what you know.','Avoid the slippery slope: worry about every possible effect and you’ll never act.','Weigh the typical, most likely effects, case by case.']},

      ash.style.transform='scaleX('+(sec/60)+')';sp.style.transform='translateX('+(W*sec/60).toFixed(1)+'px)';
      sp.classList.toggle('on',sec>0&&(sec<60||ms>0));
      const say=()=>'About <b>'+Math.round(sec)+' s</b> of 60 · '+STN[sec<=10?0:sec<=50?1:2];
      const fin=()=>{sp.classList.toggle('on',sec>0&&sec<60);lamp.classList.toggle('on',sec>=60);ro.innerHTML=sec>=60?'<b>About a minute.</b> Now act; later, note what happened.':say();};
      if(ms){if(sec>=60)ro.innerHTML='Burning: Name it, Run it, Check it…';setTimeout(()=>{if(svg.isConnected)fin();},ms);}else fin();}};}

/* a decision run through the fuse, beat by beat (Name it → Run it → Check it) */
function dmRun(L,host,cfg){const id='dmr'+(++DM_ID);
  host.insertAdjacentHTML('beforeend','<div class="dm-run" id="'+id+'"><div class="fzh"></div><ol class="dm-trail"></ol><div class="dm-say" aria-live="polite"></div><div class="dm-opts"></div></div>');
  const root=host.querySelector('#'+id),fz=dmFuse(root.querySelector('.fzh')),say=root.querySelector('.dm-say'),ob=root.querySelector('.dm-opts'),trail=root.querySelector('.dm-trail');
  const STN=['Name it','Run it','Check it'],miss=[0,0,0];let bi=0;const api={fin:false,miss,root};
  function show(){const b=cfg.beats[bi];say.innerHTML='<b class="s'+b.st+'">'+STN[b.st]+' · step '+(bi+1)+' of '+cfg.beats.length+'</b>'+b.q;ob.innerHTML='';b.got=new Set();
    if(b.type==='line'){const box=dmPills(L,ob,(i,el)=>pick(i,el));[...box.children].forEach((el,i)=>{if(i===b.right)el.dataset.r='1';});}
    else b.opts.forEach((t,i)=>{const x=document.createElement('button');x.className='chip';x.innerHTML=t;if(b.type==='many'?b.right.includes(i):i===b.right)x.dataset.r='1';x.onclick=()=>pick(i,x);ob.appendChild(x);});}
  function pick(i,el){const b=cfg.beats[bi];if(api.fin||el.disabled||el.classList.contains('ok'))return;
    const ok=b.type==='many'?b.right.includes(i):i===b.right;
    if(!ok){miss[b.st]++;el.classList.add('no');L.shake(el);const h=say.querySelector('.hint');const t=(b.why&&b.why[i])||b.no;if(h)h.innerHTML=t;else say.insertAdjacentHTML('beforeend','<span class="hint">'+t+'</span>');return;}
    el.classList.add('ok');
    if(b.type==='many'){b.got.add(i);if(b.got.size<b.right.length)return;}
    ob.querySelectorAll('button').forEach(x=>x.disabled=true);
    trail.insertAdjacentHTML('beforeend','<li><b class="s'+b.st+'">'+b.sec+' s</b><span>'+b.log+'</span></li>');
    fz.to(b.sec,450);
    const last=bi===cfg.beats.length-1,stageEnd=last||cfg.beats[bi+1].st!==b.st;
    if(cfg.onStage&&stageEnd)cfg.onStage(b.st,miss[b.st]);
    bi++;
    if(!last)setTimeout(()=>{if(root.isConnected)show();},420);
    else{api.fin=true;setTimeout(()=>{if(!root.isConnected)return;ob.innerHTML='';say.innerHTML='<b style="color:var(--ok)">Act</b>'+cfg.act;if(cfg.onDone)cfg.onDone(miss);},460);}}
  show();return api;}
async function dmSolveRun(L,api){for(let g=0;g<80&&!api.fin;g++){const b=api.root.querySelector('.dm-opts [data-r="1"]:not(.ok):not(:disabled)');if(b)b.click();await L.sleep(b?60:110);}await L.sleep(520);}

{part:3,src:'Course application · built on Introduction · Mental Models and How to Use Them',
 solve:async L=>{for(const b of L.$$('#s16p .chip')){b.click();L.m.skip();await L.sleep(30);}},
 run(L){const seen=new Set();let fin=false;
  const PR=[
   ['Fits two lines','“Bram promised a client another rush job without asking production.”',m=>{m.focus([1,3]);m.flag('hanlon','q','Talk to Bram?');m.flag('second','q','Take the job?');},
    'Both lines fit. Pick the line for <b>what you’re deciding right now</b>: how to talk to Bram is line 2 (Hanlon first); whether the floor takes the job is line 4 (second-order first). One decision at a time.'],
   ['Too small to bother','“What to have for lunch.”',m=>{m.focus([]);m.flag([165,250],'act','Lunch: just act');},
    'No ride. The book: simple, well-defined problems don’t need many lenses, because you already know what matters. Lunch is so small and easy to undo that this course says: just act.'],
   ['Big, hard to undo','“The lease: renew at 12% more, move further out, or move nearer Wynn?”',m=>{m.ride(5,'big');},
    'A big bet with long-term effects: ride every station of line 6, from thought experiment to circle of competence, then write it down and come back to it after the result (the book’s journal advice).'],
   ['Wrong line','Ira runs Occam’s razor on Pella’s message: “Simplest story: Pella is angry with me.”',m=>{m.ride(0,'none',{onEnd(){m.flag('occam','stop','Strange answer');}});},
    'A forced or strange answer is a clue. The book warns that models fail when they’re wrong, or right but used where they don’t belong (the book’s hammer warning: with one tool, every problem looks like a job for it). Go back to the map: this is line 2. Lesson 12 is about this dead end.'],
   ['No line fits','Wynn’s birthday lunch and a switchover deadline land on the same Friday.',m=>{m.pick('thought');m.flag('thought','q','Nearest: try it');},
    'No line is a perfect fit. Try the nearest model (here, a thought experiment: what do you really value?), then note in your journal which model you tried and how it went. The book: over time you learn which situations suit which models.']];
  L.h(L.kick('ex','Edge cases and limits')+'<h1 class="q">Where does the map stop helping? Try each case.</h1>'+DM_APP+
   '<div class="dm-cards" id="s16p"></div><div class="dm-out" id="s16s" style="font-family:var(--serif);font-size:15.5px">Pick a case.</div><div id="s16m"></div><div class="dm-out" id="s16o" aria-live="polite"></div>');
  L.m=dmMap(L,L.$('#s16m'));
  PR.forEach((p,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=p[0];b.onclick=()=>{L.$$('#s16p .chip').forEach((x,q)=>x.classList.toggle('sel',q===j));
    L.$('#s16s').innerHTML=p[1];L.m.reset();p[2](L.m);L.$('#s16o').innerHTML=p[3];seen.add(j);
    if(!fin&&seen.size===PR.length){fin=true;L.sheet('info','A map, not a rulebook','Pick the line for what you’re deciding now. Skip the ride when it’s tiny. Ride it all when it’s big. Treat a strange answer as a wrong-line warning. When nothing fits, try the nearest model and note how it went.');L.done();}};L.$('#s16p').appendChild(b);});}},

{part:3,src:'Course application · built on every model chapter',pts:7,
 solve:async L=>{for(let d=0;d<7;d++){const w=DM_WEEK[d];L.$('#s18z [data-z="'+w[3]+'"]').click();L.$$('#s18p .dm-pill')[w[2]].click();L.m.skip();await L.sleep(40);const n=L.$('#s18n');if(!n.hidden)n.click();await L.sleep(20);}},
 run(L){let d=0,size=null,answered=false,right=0;
  L.h(L.kick('pr','Challenge · Ira’s week')+'<h1 class="q">Seven days, seven decisions. Size each one, then send it down its line.</h1>'+DM_APP+
   '<div class="dm-week" id="s18w">'+DM_WEEK.map(w=>'<span>'+w[0]+'</span>').join('')+'</div><div class="dm-tk" id="s18t"></div>'+
   '<span class="dm-lab">1 · Small or big?</span><div id="s18z"></div><span class="dm-lab">2 · Which line?</span><div id="s18p"></div><div id="s18m"></div>'+
   '<div class="dm-out" id="s18o" aria-live="polite">Your answer rides the map.</div><div class="dm-ctl"><button class="btn pri" id="s18n" hidden>'+L.ic('arrow')+'Next day</button></div>');
  const zb=dmSize(L.$('#s18z'),null,z=>{if(!answered)size=z;});
  const pb=dmPills(L,L.$('#s18p'),(li,b)=>{if(answered)return;if(!size){L.shake(zb);L.err('Pick small or big first');return;}L.err('');answered=true;
    const w=DM_WEEK[d],ok=li===w[2]&&size===w[3];if(ok)right++;L.award(ok);
    b.classList.add(li===w[2]?'ok':'no');if(li!==w[2])pb.children[w[2]].classList.add('ok');
    const zs=zb.querySelector('[data-z="'+size+'"]');zs.classList.remove('sel');zs.classList.add(size===w[3]?'ok':'no');if(size!==w[3])zb.querySelector('[data-z="'+w[3]+'"]').classList.add('ok');
    L.$$('#s18w span')[d].className=ok?'ok':'no';
    L.$('#s18o').innerHTML=(ok?'<b style="color:var(--ok)">Right line, right size.</b> ':'<b style="color:var(--no)">It’s line '+(w[2]+1)+', '+(w[3])+'.</b> ')+w[4];
    L.m.ride(li,size);dmScroll(L.m.svg);
    if(d===6){L.sheet(right===7?'ok':'info',right+' of 7 days','Four small decisions got one stop and a minute each. Three big ones rode the whole line into the journal. That’s the point of the map: most days, a minute is enough.');L.done();}
    else L.$('#s18n').hidden=false;});
  const show=()=>{answered=false;size=null;const w=DM_WEEK[d];L.$('#s18t').innerHTML='<b>'+w[0]+'</b><span>'+w[1]+'</span>';
    L.$$('#s18w span').forEach((s,q)=>{if(q===d)s.className='cur';});[...zb.children].forEach(x=>x.className='');[...pb.children].forEach(x=>x.classList.remove('ok','no','sel'));};
  L.$('#s18n').onclick=function(){this.hidden=true;d++;L.m.reset();L.$('#s18o').textContent='Your answer rides the map.';show();dmScroll(L.$('#s18w'));};
  L.m=dmMap(L,L.$('#s18m'));show();}},

{part:3,src:'Course application · built on every model chapter',
 solve:async L=>{const ex=['Whether to reply to a tense group chat','Whether to switch phone plans','Whether to take on a second project'];
   for(let j=0;j<3;j++){const t=L.$('#s19i');t.value=ex[j];t.dispatchEvent(new Event('input',{bubbles:true}));L.$('#s19z [data-z="'+(j===2?'big':'small')+'"]').click();L.$$('#s19p .dm-pill')[[1,3,5][j]].click();L.m.skip();await L.sleep(40);}},
 run(L){let n=0,size=null;const mine=[];
  L.h(L.kick('pr','Your turn · ungraded')+'<h1 class="q">Map your coming week: three decisions, each sized and sent down its line.</h1>'+DM_APP+
   '<label class="dm-lab" for="s19i" id="s19l">Decision 1 of 3</label><input class="dm-in" id="s19i" maxlength="90" placeholder="e.g. whether to fix the old laptop or buy a new one">'+
   '<span class="dm-lab">Small or big?</span><div id="s19z"></div><span class="dm-lab">Which line?</span><div id="s19p"></div><div id="s19m"></div><ol class="dm-mine" id="s19o"></ol>');
  const zb=dmSize(L.$('#s19z'),null,z=>{size=z;});
  dmPills(L,L.$('#s19p'),li=>{const v=L.$('#s19i').value.trim();if(n>=3)return;if(v.length<3){L.err('Write the decision first');L.$('#s19i').focus();return;}if(!size){L.shake(zb);L.err('Pick small or big');return;}L.err('');
    const S=dmStations(li);mine.push(v);n++;
    L.$('#s19o').insertAdjacentHTML('beforeend','<li>'+dmRi(li)+'<span><b>'+L.esc(v)+'</b><br>'+(size==='big'?'Big: ride '+S.map(k=>DM_MOD[k].short).join(' → ')+', then write it down.':'Small: '+DM_MOD[S[0]].n+', about a minute, then act.')+'</span></li>');
    L.m.ride(li,size);dmScroll(L.m.svg);
    if(n===1)L.done();
    if(n<3){L.$('#s19i').value='';L.$('#s19l').textContent='Decision '+(n+1)+' of 3';size=null;[...zb.children].forEach(x=>x.className='');}
    else{L.$('#s19i').disabled=true;L.sheet('info','Your week is on the map','For each small one: the first station, about a minute, then act. For a big one: ride the whole line and write it down. Next week, look back: which model did you use, and how did it go?');}});
  L.m=dmMap(L,L.$('#s19m'));}}
  ]
});
</script>
</body>
