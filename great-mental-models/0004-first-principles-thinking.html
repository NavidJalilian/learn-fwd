/* the drill core: a cross-section under a claim; each layer is bedrock (fact), loose fill (assumption), or unknown */
function fpCore(L,host,o){
  o=o||{};const specs=o.layers||[];let gen=0;
  const w=document.createElement('div');
  w.innerHTML='<div class="fp-core"><div class="fp-bit"></div><div class="fp-sky"><div class="fp-sign"><small></small><span class="fp-cl"></span></div></div><div class="fp-grass"></div><div class="fp-ls"></div></div>'+
   (o.tray?'<div class="fp-trl">'+(o.trayLabel||'Bricks: facts you can build on')+'</div><div class="fp-tray" data-empty="'+(o.trayEmpty||'Nothing yet. Test a layer to find bedrock.')+'"></div>':'');
  host.appendChild(w);
  const core=w.querySelector('.fp-core'),ls=w.querySelector('.fp-ls'),bit=w.querySelector('.fp-bit'),tray=w.querySelector('.fp-tray'),sign=w.querySelector('.fp-sign');
  const TAG={open:'Tap to test',rock:'Bedrock · fact',fill:'Loose fill · assumption',unk:'I don’t know · research',deep:'Too deep for this'};
  const LY=[];
  function mk(){const b=document.createElement(o.testable?'button':'div');b.className='fp-l hid';
    b.innerHTML='<span class="fp-lh"><em class="fp-tag"></em><span class="fp-q">·</span></span><span class="fp-la">&nbsp;</span>';
    ls.appendChild(b);const ly={el:b,spec:null,st:'hid',extra:''};LY.push(ly);
    if(o.testable)b.onclick=()=>{if(ly.st==='open')api.test(LY.indexOf(ly));};return ly;}
  function paint(ly){const s=ly.spec||{};ly.el.className='fp-l '+ly.st+(ly.extra?' '+ly.extra:'');
    if(ly.st==='hid'){ly.el.setAttribute('aria-hidden','true');return;}ly.el.removeAttribute('aria-hidden');
    ly.el.querySelector('.fp-q').textContent=s.q||'';ly.el.querySelector('.fp-la').innerHTML=s.a||'';
    let t=(s.tags&&s.tags[ly.st])||(ly.st==='q'?(s.tag||''):TAG[ly.st])||'';if(ly.st==='open'&&!o.testable)t='';
    ly.el.querySelector('.fp-tag').textContent=t;}
  function bitTo(){requestAnimationFrame(()=>{if(!w.isConnected)return;const cr=core.getBoundingClientRect();const last=LY.filter(l=>l.st!=='hid').pop();let h;
    if(last){const r=last.el.getBoundingClientRect();h=r.bottom-cr.top-20;}else{const g=core.querySelector('.fp-grass').getBoundingClientRect();h=g.bottom-cr.top-4;}
    bit.style.height=Math.max(24,h)+'px';});}
  function spin(){bit.classList.remove('spin');void bit.offsetWidth;bit.classList.add('spin');}
  function crumbs(el){const W=el.offsetWidth||280;for(let j=0;j<8;j++){const c=document.createElement('span');c.className='fp-crumb';c.style.left=(36+Math.random()*(W-60))+'px';c.style.top=(8+Math.random()*22)+'px';c.style.animationDelay=(Math.random()*.25)+'s';el.appendChild(c);setTimeout(()=>c.remove(),1100);}}
  const api={
    alive:()=>w.isConnected,
    drilled:()=>LY.filter(l=>l.st!=='hid').length,
    layers:LY,
    setClaim(t,sub,flash){w.querySelector('.fp-cl').textContent=t;sign.querySelector('small').textContent=sub||o.sub||'The claim';
      if(flash){sign.classList.remove('flash');void sign.offsetWidth;sign.classList.add('flash');}bitTo();},
    drill(spec,st){let ly=LY.find(l=>l.st==='hid');if(!ly)ly=mk();const i=LY.indexOf(ly);
      ly.spec=spec||specs[i]||{};ly.st=st||'open';paint(ly);spin();bitTo();return i;},
    put(i,spec,st){while(LY.length<=i)mk();const ly=LY[i];ly.spec=spec;ly.st=st;ly.extra='';paint(ly);bitTo();},
    set(i,st){const ly=LY[i];ly.st=st;ly.extra='';paint(ly);bitTo();},
    test(i){const ly=LY[i];if(!ly||ly.st!=='open')return;const k=ly.spec.k;
      if(k==='rock'){ly.st='rock';paint(ly);if(ly.spec.brick)api.brick(ly.spec.brick);}
      else if(k==='fill'){ly.st='fill';paint(ly);ly.el.classList.add('fp-shk');crumbs(ly.el);}
      else {ly.st=k||'unk';paint(ly);}
      bitTo();if(o.onTest)o.onTest(i,ly);},
    crack(i){const ly=LY[i],g=gen;ly.extra='crack';paint(ly);
      setTimeout(()=>{if(!w.isConnected||g!==gen)return;ly.extra='';ly.st='fill';paint(ly);ly.el.classList.add('fp-shk');crumbs(ly.el);},750);},
    brick(t,cls){if(!tray)return;const b=document.createElement('span');b.className='fp-brick'+(cls?' '+cls:'');b.textContent=t;tray.appendChild(b);},
    clearTray(){if(tray)tray.innerHTML='';},
    later(fn,ms){const g=gen;setTimeout(()=>{if(w.isConnected&&g===gen)fn();},ms);},
    reset(spec){gen++;ls.innerHTML='';LY.length=0;specs.length=0;(spec.layers||[]).forEach(s=>specs.push(s));
      for(let j=0;j<(spec.depth||specs.length);j++)mk();if(tray)tray.innerHTML='';api.setClaim(spec.claim,spec.sub);}
  };
  for(let j=0;j<(o.depth||specs.length);j++)mk();
  api.setClaim(o.claim||'…',o.sub);
  return api;}

/* the Lego house: 18 bricks that rearrange, break apart and rebuild */
const FP_HOUSE=[[88,160],[124,160],[160,160],[196,160],[88,146],[124,146],[160,146],[196,146],[88,132],[124,132],[160,132],[196,132],[106,118],[142,118],[178,118],[124,104],[160,104],[142,90]];
const FP_BRIDGE=[[16,112],[52,112],[88,112],[124,112],[160,112],[196,112],[232,112],[268,112],[52,126],[52,140],[52,154],[232,126],[232,140],[232,154],[124,98],[160,98],[142,84],[142,160]];
const FP_LCOL=k=>k===2?'h3':k<12?'h1':'h4';
function fpLego(){
  let s='<svg class="fp-svg" viewBox="0 52 320 134" role="img" aria-label="Eighteen Lego bricks: a house, then rearranged, broken apart, and rebuilt as a bridge with a car and a boat">'+
   '<rect id="lg-w" x="0" y="150" width="320" height="36" fill="var(--h1-bg)" style="opacity:0;transition:opacity .6s"/>'+
   '<line id="lg-g" x1="40" y1="175" x2="280" y2="175" stroke="var(--line2)" stroke-width="3" stroke-linecap="round" style="transition:opacity .4s"/>';
  FP_HOUSE.forEach((p,k)=>{const c='var(--'+FP_LCOL(k)+')';
    s+='<g class="fp-b" id="lg-b'+k+'" style="transform:translate('+p[0]+'px,'+p[1]+'px);transition-delay:'+(k*22)+'ms"><rect x="6" y="-4" width="8" height="5" rx="1" fill="'+c+'"/><rect x="22" y="-4" width="8" height="5" rx="1" fill="'+c+'"/><rect width="36" height="14" rx="2" fill="'+c+'" stroke="var(--card)" stroke-width="1"/></g>';});
  return s+'</svg>';}

function fpFmt(m){if(!m)return '0 min';const d=Math.floor(m/1440),h=Math.floor(m%1440/60),n=m%60;return [d?d+(d>1?' days':' day'):'',h?h+' h':'',n?n+' min':''].filter(Boolean).join(' ');}
function fpSocket(L,host,o){
  const S=o.slots||1;const w=document.createElement('div');
  w.innerHTML='<div class="fp-sock"><div class="fp-sh"><div><small>Principle</small><b>'+o.principle+'</b></div><span class="fp-lamp" aria-hidden="true"></span></div>'+
   '<div class="fp-slots">'+Array.from({length:S},(_,j)=>'<div class="fp-slot" data-s="'+j+'"></div>').join('')+'</div>'+
   '<div class="fp-chips">'+o.kinds.map((k,j)=>'<span class="fp-k" data-k="'+j+'">'+k+'</span>').join('')+'</div><div class="fp-stat" aria-live="polite"></div></div>'+
   '<div class="fp-trl">Tactics: tap one to plug it in'+(S>1?' (tap a plugged one to unplug it)':'')+'</div>'+
   '<div class="fp-carts">'+o.carts.map((c,j)=>'<button class="fp-cart" data-c="'+j+'" style="border-top-color:var(--'+(c.col||'h3')+')"><b>'+c.n+'</b><small>'+c.s+'</small></button>').join('')+'</div>';
  host.appendChild(w);
  let plugged=[],shown=Array(S).fill(null);
  const state=()=>{const caught=new Set();let t=0;plugged.forEach(j=>{o.carts[j].c.forEach(k=>caught.add(k));t+=o.carts[j].t||0;});
    return {caught,all:caught.size===o.kinds.length,none:caught.size===0,time:t,plugged:plugged.slice()};};
  function draw(){
    for(let s=0;s<S;s++){const j=plugged[s]===undefined?null:plugged[s];if(shown[s]===j)continue;shown[s]=j;const sl=w.querySelector('.fp-slot[data-s="'+s+'"]');
      if(j===null)sl.innerHTML=S>1?'Slot '+(s+1)+': empty':'Empty: plug in a tactic';
      else{const c=o.carts[j];sl.innerHTML='<button class="fp-cart" data-u="'+j+'" style="border-top-color:var(--'+(c.col||'h3')+')"><b>'+c.n+'</b>'+(o.time?'<small>'+fpFmt(c.t)+' per job</small>':'')+'</button>';
        sl.querySelector('button').onclick=()=>{if(S>1)tap(j);};}}
    const st=state();
    w.querySelectorAll('.fp-k').forEach(k=>k.classList.toggle('on',st.caught.has(+k.dataset.k)));
    w.querySelectorAll('.fp-carts .fp-cart').forEach(b=>b.classList.toggle('in',plugged.includes(+b.dataset.c)));
    const lamp=w.querySelector('.fp-lamp');lamp.className='fp-lamp'+(!plugged.length?'':st.all?' on':st.none?' off':' part');
    let msg=!plugged.length?'Nothing plugged in yet.':st.all?'<b style="color:var(--ok)">Principle met.</b>':st.none?'<b style="color:var(--no)">Principle not met.</b>':'<b style="color:var(--h3)">Partly met.</b> Misses: '+o.kinds.filter((_,k)=>!st.caught.has(k)).join(', ').toLowerCase()+'.';
    if(o.time&&plugged.length)msg+=' Time per job: <b>'+fpFmt(st.time)+'</b>.';
    w.querySelector('.fp-stat').innerHTML=msg;}
  function tap(j){if(api.locked)return;const at=plugged.indexOf(j);if(at>=0){if(S>1)plugged.splice(at,1);}else{if(plugged.length>=S)plugged.shift();plugged.push(j);}
    if(S>1){/* keep slots stable: re-render all */shown=Array(S).fill(-1);}draw();if(o.onChange)o.onChange(state(),j);}
  w.querySelectorAll('.fp-carts .fp-cart').forEach(b=>b.onclick=()=>tap(+b.dataset.c));
  const api={state,tap,locked:false,el:w};draw();return api;}

Course.lesson({
  id:'0004', title:'First principles thinking', minutes:20, icon:'layers',
  goals:['Dig under “that’s just how it’s done” with the Five Whys or Socratic questions, and tell a checkable fact from an assumption',
   'Rebuild a plan from the facts: principle first, then a tactic you can swap',
   'Run the one-minute move on an everyday decision, and know where digging stops helping'],
  parts:['Bricks, not houses','Drill to bedrock','Principles and tactics','Use it'],
  read:'Read the First Principles Thinking chapter for the full list of Socratic questions, the story of the ulcer bacterium and Temple Grandin’s reply about cattle chutes.',
  glossary:{
   'five-whys':'Five Whys: asking “why?” again and again about a claim until you reach a fact you can check (a first principle) or “it just is” (an assumption).',
   'socratic':'Socratic questioning: a disciplined set of questions (clarify, challenge assumptions, look for evidence, consider other views, examine consequences, question the question) that separates what you know from what you assume.',
   'shared-belief':'Shared belief: something that holds only because people agree on it, like money or a border. Unlike a law of nature, it can change.',
   'tactic':'Tactic: one particular way of meeting a principle. If you know the principle, you can swap the tactic.'
  },
  cheatsheet:[
   '<b>First principles</b>: separate what you know is true (a fact you can check) from what you’re assuming. Build only on the facts.',
   '<b>Dig one or two layers further</b> than most people do. Rearranging the Lego house improves it a little; breaking it into bricks lets you build something else.',
   '<b>Five Whys</b>: ask why until you reach a checkable fact (bedrock) or an answer that rests on authority or habit, like “because I said so” (an assumption). It’s about the claim, not your feelings.',
   '<b>Socratic questions</b>: clarify · challenge assumptions · look for evidence · consider other views · examine consequences · question the question.',
   '<b>Principle vs tactic</b>: the curved chute was a tactic; reducing stress was the principle. Know the principle and you can change the tactic.',
   '<b>Limits</b>: it slows you down at first and you’ll often hit “I don’t know” fast, so research instead of giving up or getting defensive. First principles depend on the situation and can change as you learn (the sterile stomach).',
   '<b>One-minute move</b> (how this course applies the book): write the claim → ask why up to five times → keep the facts, drop the assumptions → rebuild, principle first, then tactic.',
   '<b>Reach for it when</b> you hear “that’s just how it’s done”, every option is expensive or the same, or you’re copying a tactic without knowing why it works.'
  ],
  steps:[
/* ---------- PART 1: BRICKS, NOT HOUSES ---------- */

{part:1,src:'First Principles Thinking · Techniques for Establishing First Principles',

  const c=fpCore(L,L.$('#sc'),{claim:'We need a new car.',sub:'Remy’s claim',depth:6});let n=0;
  FP_SOC.forEach((s,j)=>{const b=document.createElement('button');b.className='chip';b.innerHTML='<b>'+(j+1)+'</b>&nbsp;'+s[0];
    b.onclick=()=>{if(b.disabled)return;b.disabled=true;b.className='chip static ok';n++;
      c.drill({q:s[1],a:s[2],tag:(j+1)+' · '+s[3]},'q');
      if(j===5)c.setClaim('How do we make our must-do trips reliably?','The better question',true);
      if(n===6){L.sheet('info','The question itself changed','The six steps make you explain, test and look for evidence instead of running on gut feeling and strong emotion. The last one swapped “which car?” for “which trips, and how?”. That opens options the first question hid.');L.done();}};
    L.$('#sq').appendChild(b);});
  L.$('#sc').insertAdjacentHTML('afterbegin','<p class="small" style="margin:0 0 2px">'+L.g('socratic','Socratic questioning')+' differs from an ordinary chat: it draws out first principles systematically. The book runs 1 to 6; here, tap in any order.</p>');}},

{part:1,src:'First Principles Thinking · Techniques for Establishing First Principles',pts:7,run(L){
  L.h(L.kick('pr','Bedrock, fill, or not yet?')+'<h1 class="q">Ira’s digging turns up these answers. Sort each one.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Bedrock: a fact to check','Loose fill: an assumption','Not known yet: research'],[
   ['The signed order says the banner is 3 m wide.',0,'You can look it up, and it could turn out false. That makes it bedrock.'],
   ['“Clients won’t accept a proof on screen. They never have.”',1,'“They never have” is habit, not a checked fact. Has anyone asked them?'],
   ['Pella: “Because I said so.”',1,'The book’s classic sign of an assumption: the whys end in authority, not in a fact.'],
   ['Nobody knows how many reprints last year came from errors.',2,'An honest “I don’t know”. Don’t stop or argue: look it up in the job records.'],
   ['The timetable says the bus to work takes 70 minutes.',0,'Checkable, so it’s bedrock for Ira’s transport plan.'],
   ['Remy: “Everyone our age has a car.”',1,'A shared belief, not a fact about Ira’s and Remy’s trips.'],
   ['Ira isn’t sure whether car-share cars are free on Sunday mornings.',2,'Not known yet, but quick to check. Research, then decide.']],
   'Bedrock can be checked and could be proven wrong. Fill rests on habit, authority or “everyone knows”. “Not known yet” is a to-do, not a dead end.');}},

{part:1,src:'First Principles Thinking · Techniques for Establishing First Principles',run(L){
  L.h(L.kick('learn','When the drill jams')+'<h1 class="q">You’ll hit “I don’t know” fast. That’s normal.</h1><div id="lj"></div>'+
   L.lanes([['x','Give up or get defensive','The assumption stays, and the mistakes it causes slow you down later.',4],
            ['check','Pause and research','Slower today. You find the principle you actually have to work with.',2]])+
   '<p class="small" style="margin-top:10px">The book is frank: both techniques slow you down at first, and after one or two questions you’ll often be lost.</p>');
  const c=fpCore(L,L.$('#lj'),{claim:'Every job needs a paper sign-off.',sub:'How it’s done',layers:[{q:'Why?',a:'Sign-off caught 31 jobs with errors last year.',k:'rock'},{q:'Why on paper, not on screen?',a:'I don’t know.',k:'unk'}],depth:3});

{part:1,src:'First Principles Thinking · Techniques for Establishing First Principles',pts:1,run(L){
  L.h(L.kick('pr','Ira’s next move')+'<h1 class="q">Pella, about the sign-off: “We asked why twice. By the second why, nobody knew. So paper stays.” What should Ira say?</h1>');
  L.mc(L.card,['“Fair enough. If nobody knows, it must be a first principle.”','“Not knowing is our cue to check the job records, not to stop.”','“Then nobody can defend it, so let’s scrap the check today.”'],1,
   'Hitting “I don’t know” after a question or two is what the book expects. Giving up or getting defensive keeps the assumption; looking for evidence finds the principle.',
   'Not knowing doesn’t make a step a first principle, and it doesn’t prove the step is useless either. It means: pause and look for evidence.');}},

{part:1,src:'First Principles Thinking · Using First Principles Thinking to Blow Past Inaccurate Assumptions',
 solve:async L=>{for(let j=0;j<3;j++){L.$('#st-n').click();await L.sleep(30);}await L.sleep(1000);},
 run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">The bedrock that cracked: what causes stomach ulcers</h1><div id="stc"></div>'+
   '<p class="fp-ro" id="st-r" aria-live="polite"></p><button class="btn pri" id="st-n">'+L.ic('arrow')+'<span></span></button>');
  const c=fpCore(L,L.$('#stc'),{claim:'Stomach ulcers come from stress.',sub:'What doctors long believed',
   layers:[{q:'Why not bacteria?',a:'Bacteria can’t live in stomach acid.',k:'rock',tags:{rock:'Treated as bedrock',fill:'Was an assumption'}},
           {q:'Then what causes most ulcers?',a:'A bacterium: <i>H. pylori</i>.',k:'rock',tags:{rock:'New bedrock'}}],depth:2});
  c.drill();c.set(0,'rock');
  const B=[['For decades','Acid kills germs, the thinking went, so the stomach must be sterile. With that “bedrock” in place, ulcer patients never got checked for germs.','New evidence'],
   ['New evidence','Pathologist Robin Warren found germs thriving exactly where none could live. The “bedrock” cracked: it was only ever an assumption.','Keep digging'],
   ['Keep digging','With gastroenterologist Barry Marshall, he found the same germ again and again. They spent years retesting every belief built on the old one.','Rebuild'],
   ['Rebuild','Experts resisted for decades, though old medical papers had noted the germ as early as 1875. Today antibiotics regularly treat ulcers well, and the pair shared a 2005 Nobel Prize.','']];
  let k=0;
  function show(){L.$('#st-r').innerHTML='<b>'+(k+1)+' of 4 · '+B[k][0]+'.</b> '+B[k][1];
    if(B[k][2])L.$('#st-n span').textContent=B[k][2];else{L.$('#st-n').remove();L.done();}}
  L.$('#st-n').onclick=()=>{if(k>=3)return;k++;
    if(k===1)c.crack(0);if(k===2){c.drill();c.set(1,'rock');}if(k===3)c.setClaim('Most ulcers come from a bacterium.','What we know now',true);show();};
  show();}},

{part:2,src:'First Principles Thinking · Incremental Innovation and Paradigm Shifts',

   '<p class="small" style="margin:0 0 4px">Grandin, an animal scientist, pioneered curved chutes. Later research found a plain straight chute sometimes worked just as well. Was the curve the point?</p><div id="gr"></div><div id="grq"></div>');
  const seen=new Set();let fin=false;
  fpSocket(L,L.$('#gr'),{principle:'Reduce stress to the animals',kinds:['Breeding','Weight','Immune systems'],
   carts:[{n:'Curved chute',s:'Cattle tend to head back the way they came, so a curve keeps them moving.',c:[0,1,2],col:'h2'},
          {n:'Straight chute, calm system',s:'Works too, when everything around it keeps the animals calm.',c:[0,1,2],col:'h1'},
          {n:'A chute on its own',s:'A chute only works as part of a low-stress system.',c:[],col:'h4'}],
   onChange(st,j){seen.add(j);if(!fin&&seen.size===3){fin=true;
     L.$('#grq').innerHTML=L.quote('If you know the principles, you can change the tactics.','Parrish and Beaubien, on Grandin’s reply');
     L.sheet('info','The curve was a tactic','Grandin’s answer: the curve was only ever a means. Her real rule is low stress: stress hurts how cattle fight illness, grow and breed. Keep the whole system calm and a straight chute can serve too.');L.done();}}});

{part:2,src:'First Principles Thinking · Incremental Innovation and Paradigm Shifts',pts:1,
 solve:async L=>{const b=L.$$('#sc2 .fp-carts .fp-cart');b[1].click();b[2].click();L.$('#sc2-go').click();},
 run(L){
  L.h(L.kick('pr','Challenge · swap the tactic')+'<h1 class="q">Keep the principle met, but get each job checked in under a day. Use up to two tactics.</h1><div id="sc2"></div>'+
   '<button class="btn pri" id="sc2-go">'+L.ic('target')+'Check</button><div id="sc2-f"></div>');
  let first=true,fin=false;
  const sk=fpSocket(L,L.$('#sc2'),{principle:'Catch mistakes before printing',kinds:['Wrong size','Typos','Old version of the file'],carts:FP_SIGNOFF,time:true,slots:2,
   onChange(){L.$('#sc2-f').innerHTML='';}});
  L.$('#sc2-go').onclick=()=>{if(fin)return;const st=sk.state();const ok=st.all&&st.time<1440;if(first){L.award(ok);first=false;}L.$('#sc2-f').innerHTML='';
    if(ok){fin=true;sk.locked=true;L.$('#sc2-go').remove();
      L.sheet('ok','Same principle, new tactic','All three mistakes are caught, in '+fpFmt(st.time)+' instead of 2 days. An on-screen proof plus a size check, or plus a second person, both work. Ira kept the reason for the step and changed how it’s done.');L.done();}

{part:2,src:'First Principles Thinking · Incremental Innovation and Paradigm Shifts',pts:1,
 solve:async L=>{['#hb-p0','#hb-p2','#hb-p4','#hb-r1','#hb-t1'].forEach(id=>L.$(id).click());L.$('#hb-go').click();},
 run(L){
  const PCS=[['Failed inspection: brakes, exhaust',1],['Everyone our age has a car',0],['Work: 3 days a week, bus 70 min',1],['Old cars just keep breaking',0],['Wynn: twice a month, 2 h away',1]];
  const PRS=[['Have a car like everyone our age',0,'That beam rests on a shared belief, not on Ira’s trips.'],['Make our must-do trips reliably',1,''],['Never deal with an old car again',0,'That beam rests on “old cars just keep breaking”: loose fill.']];
  const TCS=[['A new SUV on finance',0,'Nothing in the bedrock asks for an SUV; it only stands on “everyone our age has a car”.'],['Repair the old car',1],['A smaller used car',1],['Car share for Wynn, bus to work',1]];
  L.h(L.kick('pr','Challenge · rebuild from the bricks')+'<h1 class="q">Rebuild Ira’s transport plan: facts at the bottom, then the principle, then a tactic on top.</h1>'+
   '<div class="fp-house" id="hb-h"><div class="fp-roof" id="hb-roof">Tactic?</div><div class="fp-beam" id="hb-beam">Principle?</div><div class="fp-found" id="hb-f"></div></div>'+
   '<ul class="fp-chk" id="hb-c" aria-live="polite"></ul>'+
   '<div class="fp-hd">1 · FOUNDATION: tap the pieces from the drill core</div><div class="fp-ctl" id="hb-ps"></div>'+
   '<div class="fp-hd">2 · PRINCIPLE</div><div class="fp-ctl" id="hb-rs"></div>'+
   '<div class="fp-hd">3 · TACTIC (THE ROOF)</div><div class="fp-ctl" id="hb-ts"></div>'+
   '<button class="btn pri" id="hb-go" style="margin-top:6px">'+L.ic('layers')+'Build it</button><div id="hb-x"></div>');
  const on=new Set();let pr=null,tc=null,first=true,fin=false;
  PCS.forEach((p,j)=>{const b=document.createElement('button');b.className='chip';b.id='hb-p'+j;b.textContent=p[0];b.onclick=()=>{if(fin)return;on.has(j)?on.delete(j):on.add(j);draw(j);};L.$('#hb-ps').appendChild(b);});
  PRS.forEach((p,j)=>{const b=document.createElement('button');b.className='chip';b.id='hb-r'+j;b.textContent=p[0];b.onclick=()=>{if(fin)return;pr=j;draw();};L.$('#hb-rs').appendChild(b);});
  TCS.forEach((p,j)=>{const b=document.createElement('button');b.className='chip';b.id='hb-t'+j;b.textContent=p[0];b.onclick=()=>{if(fin)return;tc=j;draw();};L.$('#hb-ts').appendChild(b);});
  const checks=()=>[[PCS.every((p,j)=>!p[1]||on.has(j)),'Every bedrock brick is in the foundation'],[on.size>0&&PCS.every((p,j)=>p[1]||!on.has(j)),'No loose fill in the foundation'],
    [pr!==null&&PRS[pr][1]===1,'The principle stands on the facts'],[tc!==null&&TCS[tc][1]===1,'The tactic serves the principle']];
  function draw(added){
    const f=L.$('#hb-f');const want=PCS.map((p,j)=>j).filter(j=>on.has(j));
    [...f.children].forEach(x=>{if(!on.has(+x.dataset.j))x.remove();});
    want.forEach(j=>{if(!f.querySelector('[data-j="'+j+'"]')){const b=document.createElement('span');b.className='fp-brick'+(PCS[j][1]?'':' fl');b.dataset.j=j;b.textContent=PCS[j][0];f.appendChild(b);}});
    PCS.forEach((p,j)=>L.$('#hb-p'+j).classList.toggle('sel',on.has(j)));
    PRS.forEach((p,j)=>L.$('#hb-r'+j).classList.toggle('sel',pr===j));TCS.forEach((p,j)=>L.$('#hb-t'+j).classList.toggle('sel',tc===j));
    L.$('#hb-beam').textContent=pr===null?'Principle?':PRS[pr][0];L.$('#hb-beam').classList.toggle('set',pr!==null);
    L.$('#hb-roof').textContent=tc===null?'Tactic?':TCS[tc][0];L.$('#hb-roof').classList.toggle('set',tc!==null);
    L.$('#hb-c').innerHTML=checks().map(c=>'<li class="'+(c[0]?'y':'n')+'"><i>'+(c[0]?'✓':'○')+'</i>'+c[1]+'</li>').join('');
    L.$('#hb-x').innerHTML='';}
  L.$('#hb-go').onclick=()=>{if(fin)return;const cs=checks(),ok=cs.every(c=>c[0]);if(first){L.award(ok);first=false;}L.$('#hb-x').innerHTML='';
    if(ok){fin=true;L.$('#hb-h').classList.add('ok');L.$('#hb-go').remove();
      L.sheet('ok','It stands','Three tactics now stand on bedrock: repair, a smaller used car, or car share plus the bus. The dealer’s new car only stood on loose fill. Which of the three is best (cost, risk, Remy’s worries) is a job for the next models.');L.done();}
    else{const h=L.$('#hb-h');h.classList.add('fall');setTimeout(()=>{if(h.isConnected)h.classList.remove('fall');},650);
      const why=[];if(!cs[0][0])why.push('A bedrock brick is missing: every plan has to cover all the facts.');if(!cs[1][0])why.push('Loose fill is in the foundation. It crumbles under weight.');
      if(!cs[2][0])why.push(pr===null?'Pick a principle.':PRS[pr][2]);if(!cs[3][0])why.push(tc===null?'Pick a tactic.':TCS[tc][2]);
      L.fb(L.$('#hb-x'),'<b>The house wobbles.</b> '+why.join(' '),'no');}};
  draw();}},

/* ---------- PART 4: USE IT ---------- */
{part:3,src:'Course application · built on First Principles Thinking',pts:1,
 solve:async L=>{L.$('#om-a').click();for(let j=0;j<4;j++)L.$('#om-a').click();await L.sleep(30);for(let j=0;j<4;j++)L.$$('#om-core .fp-l')[j].click();await L.sleep(30);L.$('#om-r0').click();await L.sleep(20);L.$('#om-t0').click();},
 run(L){
  const LY=[{q:'Why an hour, every Monday?',a:'It’s always been an hour.',k:'fill'},
   {q:'Why do we meet at all?',a:'Last month the meeting caught two jobs booked on the same press.',k:'rock',brick:'Caught a press clash last month'},
   {q:'Why does everyone come?',a:'That’s how Pella set it up, years ago.',k:'fill'},
   {q:'What must it catch?',a:'Press clashes and blocked jobs, before the week starts. Only the press leads and Ira book presses.',k:'rock',brick:'Clashes, blocked jobs; press leads book'}];
  const PR=[['Spot press clashes and blocked jobs before the week starts',1],['Keep everyone in the room every Monday',0],['Meetings should last an hour',0]];
  const TC=[['15 minutes with the press leads, bookings board on screen','Principle met in a quarter of the time. Everyone else gets the board link.'],
   ['No meeting: the new system flags clashes','Only if it really does. That’s an “I don’t know” until someone checks.'],
   ['Keep the full hour with everyone','Allowed, and now you know what it’s for. But it costs everyone an hour for a job a few people do.']];
  L.h(L.kick('pr','One-minute move · how this course applies the book')+'<h1 class="q">Ira’s Monday meeting: an hour, everyone, every week. Run the move.</h1>'+
   '<p class="small" style="margin:0 0 4px">The four steps are this course’s routine, built only from the chapter’s Five Whys and its principle-vs-tactic idea. Ira’s details are made up.</p>'+
   '<div class="fp-steps" id="om-s"><span>1 Write the claim</span><span>2 Ask why</span><span>3 Keep facts</span><span>4 Rebuild</span></div>'+
   '<div class="fp-ctl" id="om-c"><button class="btn pri" id="om-a">'+L.ic('pencil')+'<span>Write the claim</span></button></div><div id="om-x"></div><div id="om-core"></div>');
  let step=0,tested=0,first=true;
  const c=fpCore(L,L.$('#om-core'),{claim:'…',sub:'Step 1: write it down',layers:LY,testable:true,tray:true,trayLabel:'Bricks to rebuild from',
   onTest(){tested++;if(tested===4){setStep(3);showPR();}}});
  function setStep(s){step=s;L.$$('#om-s span').forEach((x,j)=>{x.className=j<s?'dn':j===s?'on':'';});}
  L.$('#om-a').onclick=()=>{
    if(step===0){c.setClaim('Monday meeting: an hour, everyone, every week.','That’s how it’s done',true);setStep(1);L.$('#om-a span').textContent='Why?';return;}
    if(step===1){c.drill();if(c.drilled()>=4){setStep(2);L.$('#om-c').innerHTML='<span class="fp-ro" style="margin:0"><b>Step 3:</b> tap each layer to test it. Keep the facts; drop the assumptions.</span>';}}};
  function showPR(){L.$('#om-c').innerHTML='<span class="fp-ro" style="margin:0"><b>Step 4:</b> which principle do the facts point to?</span>';
    L.$('#om-x').innerHTML='<div class="fp-opts" id="om-rs"></div><div id="om-ts"></div><div id="om-f"></div>';
    PR.forEach((p,j)=>{const b=document.createElement('button');b.className='chip';b.id='om-r'+j;b.textContent=p[0];b.onclick=()=>pickPR(j);L.$('#om-rs').appendChild(b);});}
  function pickPR(j){if(!first)return;first=false;const ok=PR[j][1]===1;L.award(ok);
    L.$$('#om-rs .chip').forEach((b,q)=>{b.classList.add(PR[q][1]?'ok':q===j?'no':'static');b.disabled=true;});
    L.fb(L.$('#om-f'),ok?'<b>Yes.</b> Both bedrock bricks are about catching clashes early. Now pick a tactic.':'<b>Not quite.</b> That one rests on the crumbled fill. The bedrock points at catching press clashes early. Now pick a tactic.',ok?'ok':'no');
    L.$('#om-ts').innerHTML='<div class="fp-hd">TACTIC</div><div class="fp-opts" id="om-tt"></div>';
    TC.forEach((t,q)=>{const b=document.createElement('button');b.className='chip';b.id='om-t'+q;b.textContent=t[0];b.onclick=()=>{if(step>3)return;setStep(4);b.classList.add('sel');
      c.brick('Tactic: '+t[0],'tac');L.sheet(ok?'ok':'info','About a minute, start to finish','<b>'+t[0]+'.</b> '+t[1]+' The move: write the claim, ask why, keep the facts, then rebuild: principle first, tactic second.');L.done();};L.$('#om-tt').appendChild(b);});}}},

{part:3,src:'First Principles Thinking · Techniques for Establishing First Principles',
 solve:async L=>{for(let j=0;j<4;j++){L.$('#lm-'+j).click();await L.sleep(20);}},
 run(L){
  const PRE=[
   ['Stop at “because I said so”',{claim:'Proofs must go out on paper.',sub:'Pella’s rule',layers:[{q:'Why?',a:'Because I said so.',k:'fill',tags:{fill:'Assumption'}}]},c=>{c.drill();c.later(()=>c.test(0),350);},
    'If your whys end in an appeal to authority or “that’s just how it is”, you’ve hit an assumption resting on popular opinion, myth or dogma. Not a first principle.'],
   ['Lost after two whys',{claim:'Every job needs a paper sign-off.',sub:'How it’s done',layers:[{q:'Why?',a:'Sign-off caught 31 jobs with errors last year.',k:'rock'},{q:'Why on paper, not on screen?',a:'I don’t know.',k:'unk'}]},c=>{c.drill();c.drill();c.set(0,'rock');c.set(1,'unk');},
    'Normal. Both techniques slow you down at first, and you’ll often be lost after a question or two. Don’t give up or get defensive: research.'],
   ['Drill to the atoms',{claim:'We need a new car.',sub:'Remy’s claim',layers:[{q:'Which trips really need one?',a:'Work 3 days a week; Wynn twice a month.',k:'rock'},{q:'What is a car made of?',a:'Mostly steel.',k:'deep'},{q:'And steel?',a:'Iron and carbon atoms.',k:'deep'}]},c=>{c.drill();c.drill();c.drill();c.set(0,'rock');c.set(1,'deep');c.set(2,'deep');},
    'Deeper can open wholly new builds (melt a bike, forge a sword). But most of the value is a level or two below where most people stop. For Ira’s trips, steel and atoms add no new options.'],
   ['Bedrock depends on who digs',{claim:'Make the fridge use less energy.',sub:'Two different diggers',layers:[{q:'An appliance maker stops here',a:'The laws of thermodynamics.',k:'rock',tags:{rock:'Maker’s bedrock'}},{q:'A physicist digs further',a:'Entropy, beneath the second law.',k:'rock',tags:{rock:'Physicist’s bedrock'}}]},c=>{c.drill();c.drill();c.set(0,'rock');c.set(1,'rock');},
    'Philosophers from Plato to Descartes hunted for truths that never change. You don’t need those: first principles are the limits you work within in <i>this</i> situation. Different diggers hit different bedrock.'],
   ['Bedrock that cracks',{claim:'Stomach ulcers come from stress.',sub:'The old belief',layers:[{q:'Why not bacteria?',a:'Bacteria can’t live in stomach acid.',k:'rock',tags:{rock:'Treated as bedrock',fill:'Was an assumption'}}]},c=>{c.drill();c.set(0,'rock');c.later(()=>c.crack(0),350);},
    'The sterile stomach looked like bedrock for decades. What counts as a first principle shifts as knowledge grows, so keep yours open to new evidence.']];
  L.h(L.kick('ex','Limits · where digging stops helping')+'<h1 class="q">Load each case and watch what the drill finds.</h1>'+
   '<div class="fp-ctl fp-sm">'+PRE.map((p,j)=>'<button class="chip" id="lm-'+j+'">'+p[0]+'</button>').join('')+'</div>'+
   '<p class="small" style="margin:0" id="lm-n"></p><div id="lm-c"></div><div class="fb info" id="lm-r" style="margin-top:4px" aria-live="polite">Pick a case above.</div>');
  const seen=new Set();let fin=false;
  const c=fpCore(L,L.$('#lm-c'),{claim:'Pick a case',sub:'Edge cases',depth:2});
  const cnt=()=>{L.$('#lm-n').textContent='Cases tried: '+seen.size+' of 5';};cnt();
  PRE.forEach((p,j)=>L.$('#lm-'+j).onclick=()=>{PRE.forEach((_,q)=>L.$('#lm-'+q).classList.toggle('sel',q===j));c.reset(p[1]);p[2](c);seen.add(j);cnt();
    L.$('#lm-r').innerHTML='<b>'+p[0]+'.</b> '+p[3];
    if(!fin&&seen.size>=4){fin=true;L.sheet('info','Where digging stops helping','Authority (“because I said so”) marks an assumption, not a principle. “I don’t know” means research, not surrender. A level or two deeper is usually enough. And bedrock depends on the situation, and can crack when new evidence arrives.');L.done();}});}},

{part:3,src:'Course application · built on First Principles Thinking',
 solve:async L=>{const s=(id,v)=>{const e=L.$(id);e.value=v;e.dispatchEvent(new Event('input',{bubbles:true}));};s('#yt-c','Our weekly report has to be ten pages');s('#yt-w0','Because it has always been ten pages');L.$('#yt-k0 [data-v="fill"]').click();s('#yt-p','Tell the team what changed and what needs a decision');s('#yt-t','A one-page summary with a link to the detail');},
 run(L){
  const IDEAS=[['Work: a meeting','Our team meeting has to last an hour'],['Work: a report','The monthly report has to be ten pages'],['Work: an approval','Every refund needs my manager’s sign-off'],
   ['Home: a chore','We always do the big shop on Saturday'],['Home: a purchase','We need a new phone every two years'],['Home: a routine','The laundry has to happen on Sunday']];
  L.h(L.kick('pr','Your turn · not graded')+'<h1 class="q">Pick one “that’s just how it’s done” from your own week, at work or at home, and drill it.</h1><div id="yt-core"></div>'+
   '<div class="fp-ctl" id="yt-ideas"></div>'+
   '<label class="fp-lab">The claim<input class="fp-in" id="yt-c" placeholder="e.g. We always do the big shop on Saturday"></label>'+
   [0,1].map(j=>'<label class="fp-lab">Why? '+(j+1)+'<input class="fp-in" id="yt-w'+j+'" placeholder="'+(j?'Ask why again…':'Because…')+'"></label><div class="fp-ctl" id="yt-k'+j+'" style="margin-top:6px"><button class="chip" data-v="rock">Fact I can check</button><button class="chip" data-v="fill">Assumption</button><button class="chip" data-v="unk">Don’t know yet</button></div>').join('')+
   '<label class="fp-lab">The principle underneath<input class="fp-in" id="yt-p" placeholder="What is it really for?"></label>'+
   '<label class="fp-lab">One new tactic to try<input class="fp-in" id="yt-t" placeholder="Another way to meet the principle"></label>'+
   '<p class="fp-ro" id="yt-s" aria-live="polite" style="margin-top:8px"></p>');
  const c=fpCore(L,L.$('#yt-core'),{claim:'Your claim',sub:'Your “how it’s done”',depth:2,tray:true,trayLabel:'Your rebuild',trayEmpty:'Write a principle and a tactic below.'});
  const kind=[null,null];let fin=false;
  IDEAS.forEach(i=>{const b=document.createElement('button');b.className='chip';b.textContent=i[0];b.onclick=()=>{const e=L.$('#yt-c');e.value=i[1];e.dispatchEvent(new Event('input',{bubbles:true}));};L.$('#yt-ideas').appendChild(b);});
  function upd(){const cl=L.$('#yt-c').value.trim();c.setClaim(cl||'Your claim');
    [0,1].forEach(j=>{const v=L.$('#yt-w'+j).value.trim();if(v)c.put(j,{q:'Why? '+(j+1),a:v.replace(/</g,'&lt;'),tags:{open:''}},kind[j]||'open');else c.put(j,{},'hid');});
    const p=L.$('#yt-p').value.trim(),t=L.$('#yt-t').value.trim();
    const todo=[[cl,'write the claim'],[L.$('#yt-w0').value.trim(),'answer the first why'],[kind[0],'tag that answer'],[p,'name the principle underneath'],[t,'write one new tactic']].filter(x=>!x[0]).map(x=>x[1]);
    L.$('#yt-s').innerHTML=todo.length?'<b>Still to do:</b> '+todo.join(', ')+'. The rebuild is the point.':'<b>Rebuilt:</b> principle first, then a tactic.';
    if(!fin&&!todo.length){fin=true;
      L.sheet('info','Drilled and rebuilt','Put it in your decision journal: the claim, what crumbled, what held, the principle, and the tactic you’ll try. Any “don’t know yet” layer is your next bit of research.');L.done();}}
  function rebuild(){c.clearTray();const p=L.$('#yt-p').value.trim(),t=L.$('#yt-t').value.trim();if(p)c.brick('Principle: '+p);if(t)c.brick('Tactic: '+t,'tac');upd();}
  ['#yt-c','#yt-w0','#yt-w1'].forEach(id=>L.$(id).addEventListener('input',upd));
  ['#yt-p','#yt-t'].forEach(id=>L.$(id).addEventListener('input',rebuild));
  [0,1].forEach(j=>L.$$('#yt-k'+j+' .chip').forEach(b=>b.onclick=()=>{kind[j]=b.dataset.v;L.$$('#yt-k'+j+' .chip').forEach(x=>x.classList.toggle('sel',x===b));upd();}));
  upd();}},

{part:3,src:'Course application · built on First Principles Thinking',run(L){
  L.h(L.kick('learn','Your decision map · how this course applies the book')+'<h1 class="q">Where first principles sits on your map</h1>'+
   '<div class="fp-map" id="dm"></div>'+
   '<p class="small" style="margin:0 0 6px"><span class="fp-m on" style="width:18px;height:18px;vertical-align:-4px"></span> this lesson &nbsp; <span class="fp-m seen" style="width:18px;height:18px;vertical-align:-4px"></span> earlier lessons &nbsp; <span class="fp-m" style="width:18px;height:18px;vertical-align:-4px"></span> coming up. Tap a lit row.</p>'+
   L.note('<b>Dead end: only the usual answers come to mind?</b> Break the problem into bricks (or invert it, later in the course). <b>Reach for first principles</b> when you hear “that’s just how it’s done”, every option is expensive or the same, or you’re copying a tactic without knowing why it works.','compass'));
  FP_ROWS.forEach(r=>{const lit=r[1].includes('fp');const el=document.createElement(lit?'button':'div');el.className='fp-row'+(lit?' lit':'');
    el.innerHTML='<span class="fp-rl">'+r[0]+'</span><span class="fp-st">'+r[1].map((m,j)=>(j?'<span class="fp-sep">›</span>':'')+'<span class="fp-m'+(m==='fp'?' on':(m==='map'||m==='circ')?' seen':'')+'" title="'+FP_MODELS[m][1]+'" aria-label="'+FP_MODELS[m][1]+'">'+L.ic(FP_MODELS[m][0])+'</span>').join('')+'</span>';
    if(lit)el.onclick=()=>{if(el.querySelector('.fp-ex'))return;el.insertAdjacentHTML('beforeend','<span class="fp-ex">'+r[2]+'</span>');};
    L.$('#dm').appendChild(el);});
  L.done();}}
  ]
});
</script>
</body>
</html>
