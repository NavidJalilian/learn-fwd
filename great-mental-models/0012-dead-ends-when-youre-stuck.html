/* ---------- the models (exact names from CANON) ---------- */
const DE_M={map:['Map','map','The map is not the territory','checking a plan, report or number against what’s really happening'],

/* ---------- drawing the knots (viewBox 320 x 130; straight rope runs along y = 65) ---------- */
const DE_N=160;

 tangle:deSamp(s=>{const w=Math.pow(Math.sin(Math.PI*s),.6);return [24+272*s+38*w*Math.sin(2*Math.PI*6.5*s),65+44*w*Math.sin(2*Math.PI*9*s+.6)];}),

const dePts=a=>'M'+a.map(q=>q[0].toFixed(1)+' '+q[1].toFixed(1)).join('L');
/* drawn in short pieces, each with a halo, so crossings read as over and under */
function deRope(P,col,sw){let s='';for(let i=0;i<P.length-1;i+=8){const d=dePts(P.slice(i,Math.min(P.length,i+9)));
  s+='<path d="'+d+'" fill="none" stroke="var(--soft)" stroke-width="'+(sw+5)+'" stroke-linecap="butt" stroke-linejoin="round"/><path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="'+sw+'" stroke-linecap="round" stroke-linejoin="round"/>';}
  return s+'<path d="'+dePts(P)+'" fill="none" stroke="var(--card)" stroke-opacity=".5" stroke-width="1.4" stroke-dasharray="2 7" stroke-linecap="round"/>';}
function deQ(x0,y0,cx,cy,x1,y1){const a=[];for(let i=0;i<=24;i++){const u=i/24;a.push([(1-u)*(1-u)*x0+2*u*(1-u)*cx+u*u*x1,(1-u)*(1-u)*y0+2*u*(1-u)*cy+u*u*y1]);}return a;}

function deKnot(k,p,t,o){o=o||{};const big=!!o.big,sw=big?7:11,done=p>=.999,col=done?'var(--ok-strong)':t?'var(--no-strong)':'var(--h3)';
  let s='<rect width="320" height="130" rx="14" fill="var(--soft)"/>';
  if(DE_SH[k]){let P=deMix(DE_SH[k],p);if(t){const cx=k==='spiral'?190:160,f=1-.09*t;P=P.map(q=>[cx+(q[0]-cx)*f,q[1]]);}
    s+=deRope(P,col,sw);
    if(k==='wall'){const h=(1-p)*112;for(let r=0;r<8;r++){const y=10+r*14;if(y<122-h-.5)continue;const off=r%2?0:-8;
      for(let b=0;b<3;b++){const x=204+off+b*16,x0=Math.max(204,x),x1=Math.min(234,x+16);if(x1-x0>2)s+='<rect x="'+x0+'" y="'+y+'" width="'+(x1-x0)+'" height="14" fill="var(--soft2)" stroke="var(--muted)" stroke-width="1.2"/>';}}

  else if(k==='split'){const sp=1+.12*t,N=24,pl=[],rl=[];

    s+='<g opacity="'+(1-ls).toFixed(2)+'"><path d="M36 65H12M20 56l-9 9 9 9" fill="none" stroke="'+ac+'" stroke-width="'+((big?3:6)+t)+'" stroke-linecap="round" stroke-linejoin="round"/></g>';
    s+='<g opacity="'+(1-rs).toFixed(2)+'"><path d="M284 65H308M300 56l9 9-9 9" fill="none" stroke="'+ac+'" stroke-width="'+((big?3:6)+t)+'" stroke-linecap="round" stroke-linejoin="round"/></g>';
    if(big)s+='<text x="16" y="104" font-size="12" font-weight="700" fill="var(--ink)">'+nm[0]+'</text><text x="304" y="104" text-anchor="end" font-size="12" font-weight="700" fill="var(--ink)">'+nm[1]+'</text>';}

    s+='<path d="M160 101L160 74L'+ex.toFixed(1)+' '+ey.toFixed(1)+'" fill="none" stroke="'+(t?'var(--no-strong)':done?'var(--ok-strong)':'var(--muted)')+'" stroke-width="'+nw+'" stroke-linecap="round" stroke-linejoin="round"/>';
    const hx=Math.cos(a)*8,hy=Math.sin(a)*8;s+='<path d="M'+(ex-hx).toFixed(1)+' '+(ey-hy).toFixed(1)+'L'+(ex+hx).toFixed(1)+' '+(ey+hy).toFixed(1)+'" stroke="'+(t?'var(--no-strong)':done?'var(--ok-strong)':'var(--muted)')+'" stroke-width="'+nw+'" stroke-linecap="round"/>';

    s+='<g opacity="'+p.toFixed(2)+'"><circle cx="96" cy="52" r="18" fill="var(--pri-bg)" stroke="var(--pri)" stroke-width="4"/><path d="M109 65l15 15" stroke="var(--pri)" stroke-width="6" stroke-linecap="round"/>'+(big?'<text x="96" y="96" text-anchor="middle" font-size="11" font-weight="700" fill="var(--pri)">NEW LENS</text>':'')+'</g>';}
  if(t&&!done)s+='<text x="14" y="22" font-size="'+(big?11:20)+'" font-weight="700" fill="var(--no)">'+(big?'TIGHTER ':'')+'!'.repeat(t)+'</text>';
  if(done)s+='<circle cx="298" cy="'+(k==='pull'?22:20)+'" r="12" fill="var(--ok-strong)"/><path d="M292 '+(k==='pull'?22:20)+'l4 4 8-8" fill="none" stroke="var(--card)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';
  return s;}
function deAnim(el,from,to,draw,ms){return new Promise(res=>{const n=Math.max(1,Math.round((ms||480)/32));let i=0;

/* ---------- the knot board: apply a model; the right one unties it, a wrong one pulls it tighter ---------- */
function deBoard(L,host,o){o=o||{};let k=o.knot||'loop',p=0,t=0,step=0,done=false,busy=false,hide=!!o.hideName,cf={};
  const w=document.createElement('div');w.className='de-board';host.appendChild(w);
  w.innerHTML='<div class="de-bh"><b class="nm"></b><span class="sk"></span></div><svg class="de-svg" viewBox="0 0 320 130" role="img"></svg>'+
   '<div class="de-say mo"'+(o.moment===false?' hidden':'')+'><b class="k">IRA’S DEAD END</b><span></span></div>'+
   (o.chips===false?'':'<span class="de-lab">Apply a model</span><div class="de-models"></div>')+
   '<div class="de-msg" aria-live="polite"></div><div class="de-nx"></div>';
  const $=s=>w.querySelector(s),svg=$('svg');
  const K=()=>DE_K[k];
  function draw(){svg.innerHTML=deKnot(k,p,t,{big:true,names:cf.names,hammer:cf.hammer});
    svg.setAttribute('aria-label',(hide?'A knot':K().name)+(p>=.999?', untied':t?', pulled tighter':p>0?', loosening':', knotted'));}
  function head(){$('.nm').textContent=hide?'Which knot is this?':K().name;$('.sk').textContent=hide?'':K().stuck;}
  function msg(h,kind){const m=$('.de-msg');m.innerHTML='';if(h)L.fb(m,h,kind||'info');}
  function chips(){const box=$('.de-models');if(!box)return;box.innerHTML='';
    (o.models||DE_MO).forEach(m=>{const b=document.createElement('button');b.type='button';b.className='chip';b.dataset.m=m;b.setAttribute('aria-label','Apply '+DE_M[m][2]);
      b.innerHTML=L.ic(DE_M[m][1])+DE_M[m][0];b.onclick=()=>api.apply(m);box.appendChild(b);});}
  const api={wrap:w,get k(){return k;},get done(){return done;},get busy(){return busy;},get p(){return p;},
    set(nk,c){k=nk;cf=c||{};p=0;t=0;step=0;done=false;busy=false;head();const m=$('.mo span');if(m)m.innerHTML=cf.mo||K().mo;draw();msg('');$('.de-nx').innerHTML='';chips();},
    reveal(){hide=false;head();draw();},
    printNext(){const K0=K(),nx=cf.next||(typeof K0.next==='string'?K0.next:K0.next[api.last]);
      $('.de-nx').innerHTML='<div class="de-card"><span class="t">'+L.ic('arrow')+'NEXT STEP</span>'+nx+'</div>';},
    last:null,
    apply(m){if(done||busy)return Promise.resolve();const K0=K(),why=Object.assign({},K0.why,cf.why||{});
      const chip=$('.de-models [data-m="'+m+'"]');
      const ok=K0.any?K0.any.includes(m):K0.seq[step]===m;
      if(ok){busy=true;t=0;step++;api.last=m;const to=K0.any?1:step/K0.seq.length;done=to>=1;if(chip)chip.classList.add('ok');msg('');
        return deAnim(w,p,to,v=>{p=v;draw();}).then(()=>{busy=false;if(!w.isConnected)return;p=to;draw();msg(why[m],'ok');
          if(done){if(o.autoNext!==false)api.printNext();if(o.onDone)o.onDone(m,api);}else if(o.onStep)o.onStep(m,api);});}
      t=Math.min(3,t+1);draw();L.shake(svg);if(chip)chip.classList.add('no');
      let h;if(K0.seq&&K0.seq.includes(m))h=K0.seq.indexOf(m)<step?'<b>Already used.</b> '+DE_M[K0.seq[step]][2]+' comes next.':'<b>Not yet.</b> '+K0.order;
      else if(m==='lens')h='<b>Tighter.</b> Switching lens is for a model that feels forced. Try one that fits this knot first.';
      else h='<b>Tighter.</b> '+DE_M[m][2]+' is for '+DE_M[m][3]+'. This knot is a '+K0.name.toLowerCase()+': '+K0.stuck.toLowerCase()+'.';
      msg(h,'no');if(o.onWrong)o.onWrong(m,api);return Promise.resolve();}};
  api.set(k,o.cfg);return api;}

function deSignal(L,host,o){o=o||{};let l1=o.l1==null?null:o.l1,l2=o.l2==null?null:o.l2;
  const q1=o.q1||'Would more thinking remove the doubt that’s left?',q2=o.q2||'Could the worst likely outcome take Ira out of the game?';

    else s+='<rect x="104" y="24" width="206" height="80" rx="14" fill="var(--card)" stroke="var(--line2)" stroke-width="2" stroke-dasharray="5 4"/><text x="207" y="69" text-anchor="middle" font-size="14" font-weight="600" fill="var(--muted)">Set both lamps</text>';

  let p=0,t=0,busy=false;const used=new Set();
  const draw=()=>{L.$('#s6').innerHTML=deKnot('spiral',p,t,{big:true});};draw();
  L.$('#w6').innerHTML=W.map((x,j)=>'<div class="de-op" id="w6'+j+'"><i>'+(j+1)+'</i><div><b>'+x[1]+'</b><small></small></div></div>').join('');
  [['occam'],['prob'],['second'],['hanlon']].forEach(([m])=>{const b=document.createElement('button');b.type='button';b.className='chip';b.dataset.m=m;b.innerHTML=L.ic(DE_M[m][1])+DE_M[m][0];
    b.onclick=async()=>{if(busy||used.has(m))return;L.$('#f6').innerHTML='';const j=W.findIndex(x=>x[0]===m);
      if(j<0){t=Math.min(3,t+1);draw();L.shake(L.$('#s6'));b.classList.add('no');L.fb(L.$('#f6'),'<b>Tighter.</b> Nobody is acting against Ira here. Hanlon’s razor is for reading someone’s behavior.','no');return;}
      busy=true;used.add(m);t=0;b.classList.add('ok');const r=L.$('#w6'+j);r.classList.add('x');r.querySelector('small').textContent=W[j][2];
      await deAnim(L.$('#s6'),p,used.size/3,v=>{p=v;draw();});busy=false;
      if(used.size===3&&L.$('#n6')){L.$('#n6').innerHTML='<div class="de-card"><span class="t">'+L.ic('arrow')+'NEXT STEP</span>'+DE_K.spiral.next+'</div>';
        L.sheet('info','From worst case to a plan','Any one of these can break a spiral; together they turn worry into something Ira can do. The book offers Occam’s razor as a counter to health worry. It isn’t medical advice: the doctor is the Lifer here.');L.done();}};
    L.$('#m6').appendChild(b);});}},

{part:1,src:'Course application · built on Hanlon’s Razor and Second-Order Thinking',pts:1,
 solve:async L=>{L.$$('#p7 .chip')[1].click();L.$('#w7').click();await L.sleep(1700);},
 run(L){
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">Ira is sure Remy blocks every flat on purpose, and the lease is still undecided. Will Hanlon’s razor untie this?</h1>'+deApp(L)+
   '<svg class="de-svg" id="a7" viewBox="0 0 320 130" role="img" aria-label="Tug of war between Ira and Remy"></svg><p class="de-mini">The standoff</p>'+
   '<svg class="de-svg" id="b7" viewBox="0 0 320 130" role="img" aria-label="A tangled rope: the lease options"></svg><p class="de-mini">The lease: four options</p>'+
   '<div class="de-chips" id="p7"></div><div class="de-ctl"><button class="btn pri" id="w7" hidden>'+L.ic('play')+'Apply it and watch</button></div><p class="de-ro" id="r7"></p>');
  let pa=0,pick=null;const dA=()=>{L.$('#a7').innerHTML=deKnot('pull',pa,0,{big:true});};dA();L.$('#b7').innerHTML=deKnot('tangle',0,0,{big:true});
  const O=['Yes: once the standoff eases, everything’s untied','It eases the standoff, but the lease tangle stays','No: Hanlon’s razor only works at work'];
  O.forEach((x,j)=>{const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=x;b.onclick=()=>{if(b.disabled)return;pick=j;L.$$('#p7 .chip').forEach((c,q)=>c.classList.toggle('sel',q===j));L.$('#w7').hidden=false;};L.$('#p7').appendChild(b);});
  L.$('#w7').onclick=async function(){this.hidden=true;L.$$('#p7 .chip').forEach(c=>c.disabled=true);
    L.$('#r7').innerHTML='<b>Hanlon’s razor:</b> Remy is anxious about change, not scheming.';await deAnim(L.$('#a7'),0,.5,v=>{pa=v;dA();});await L.sleep(250);
    if(!L.$('#r7'))return;L.$('#r7').innerHTML='<b>Then second-order:</b> they’ll decide together again; trust matters more than this round.';await deAnim(L.$('#a7'),.5,1,v=>{pa=v;dA();});
    if(!L.$('#r7'))return;L.$('#r7').innerHTML='Standoff: <b>untied</b> · lease: <b>still tangled</b>';
    const ok=pick===1;L.award(ok);
    L.sheet(ok?'ok':'no',ok?'One knot at a time':'The tangle stays','Hanlon’s razor eased one rope; second-order thinking eased the other. But the lease is a separate knot: too many options. When two knots tangle together, untie one at a time, the standoff first, so Ira and Remy can face the lease together.');L.done();};}},

{part:1,src:'Course application · built on Inversion, Thought Experiment and Probabilistic Thinking',
 solve:async L=>{for(const m of ['inv','thought','prob'])await deTap(L,'#k8',m);},
 run(L){
  L.h(L.kick('ex','A tangle needs models in order')+'<h1 class="q">Now the lease, together. Shrink the list before you weigh it.</h1>'+deApp(L)+
   '<p class="small" style="margin:0 0 6px">Each model asks a question. Ira and Remy’s answers, in this made-up case, do the crossing off.</p><div id="o8"></div><div id="k8"></div>');
  const OP=[['A','Renew, at 12% more',''],['B','Move further out: cheaper, longer commute','prob'],['C','Move near Wynn, two hours from work','thought'],['D','Move toward Fieldnote','inv']];
  L.$('#o8').innerHTML=OP.map(x=>'<div class="de-op" id="o8'+x[0]+'"><i>'+x[0]+'</i><div><b>'+x[1]+'</b><small></small></div></div>').join('');
  const cross=m=>{const x=OP.find(q=>q[2]===m);if(!x)return;const r=L.$('#o8'+x[0]);r.classList.add('x');r.querySelector('small').textContent={inv:'Ira’s answer to inversion: a lease near a job not yet taken invites trouble',thought:'Ira’s run of a normal week: four hours of driving a day',prob:'Ira’s odds check: likely over budget, drains the savings buffer'}[m];};
  deBoard(L,L.$('#k8'),{knot:'tangle',moment:false,models:['occam','inv','thought','prob','hanlon'],
   onStep(m){cross(m);},
   onDone(m){cross(m);L.$('#o8A').classList.add('keep');L.$('#o8A small').textContent='What’s left after Ira’s answers';
     L.sheet('info','Cross off, run, then check the odds','The models don’t give the verdict; they give the questions. Inversion: what would guarantee trouble? Thought experiment: how does a normal week go? Probabilistic: could this take us out of the game? Ira’s answers turned four options into one choice.');L.done();}});}},

{part:1,src:'Course application · built on Circle of Competence · How Do You Operate Outside a Circle of Competence?',pts:1,run(L){
  L.h(L.kick('pr','The wall')+'<h1 class="q">Fieldnote’s offer includes share options. Ira has no idea how they work, and the answer is due in ten days. What gets Ira over the wall?</h1>'+deApp(L)+
   '<svg class="de-svg" viewBox="0 0 320 130" role="img" aria-label="A rope bunched up against a brick wall">'+deKnot('wall',0,0,{big:true})+'</svg>');
  L.mc(L.card,['Assume the options are worthless and decide on salary alone','Ask Fieldnote’s founder what they’ll be worth and go with it','Learn the basics, then ask an options holder what matters, and why','Keep reading articles alone until it all feels clear enough'],2,
   'A wall is a circle-of-competence problem. As a Stranger, Ira learns the basics, then asks a Lifer which variables matter and why. The founder is a Lifer too, but gains if Ira says yes: weigh their incentives.',
   'A wall is a circle-of-competence problem. Ira is a Stranger here: learn the basics, then ask a Lifer which variables matter and why. Guessing ignores the wall; the founder gains if Ira says yes; and a little solo reading breeds false confidence.');}},

{part:1,src:'Introduction · Mental Models and How to Use Them',
 solve:async L=>{L.$('#h10').click();await L.sleep(30);L.$('#s10').click();await L.sleep(650);},
 run(L){
  L.h(L.kick('learn','The bent nail · wrong tool')+'<h1 class="q">Ira keeps hitting their sleep problem with the same model. Hit it, then watch the nail.</h1>'+deApp(L)+
   '<svg class="de-svg" id="v10" viewBox="0 0 320 130" role="img"></svg>'+
   '<div id="f10"></div><div class="de-ctl"><button class="btn" id="h10">'+L.ic('leaf')+'Hit again: “it’s just the coffee”</button><button class="btn pri" id="s10" hidden>'+L.ic('compass')+'Switch lens</button></div><div id="c10" aria-live="polite"></div>');
  const F=[['A','Takes ages to fall asleep',1],['B','Wakes at 3 a.m., thinking',0],['C','Worse after late-work days',1]];
  let p=0,t=0,fin=false;
  const draw=()=>{L.$('#v10').innerHTML=deKnot('nail',p,t,{big:true,hammer:'Occam'});L.$('#v10').setAttribute('aria-label','A nail bent over by a hammer labelled Occam'+(t?', bent '+t+' times':''));};
  const facts=sw=>{L.$('#f10').innerHTML=F.map(f=>{const ok=sw||f[2];return '<div class="de-op'+(ok?' keep':'')+'"><i>'+f[0]+'</i><div><b style="text-decoration:none;color:var(--ink)">'+f[1]+'</b><small>'+(ok?(sw&&!f[2]?'✓ explained by the Wynn spiral, a second cause':'✓ explained by late coffee'):'✕ not explained by “just the coffee”')+'</small></div></div>';}).join('');};
  draw();facts(false);
  L.$('#h10').onclick=function(){if(fin)return;t=Math.min(3,t+1);draw();L.shake(L.$('#v10'));L.$('#s10').hidden=false;
    L.$('#c10').innerHTML='';L.fb(L.$('#c10'),t<3?'The nail bends further. Fact B still doesn’t fit.':'More force, same result. The answer feels forced.','no');};
  L.$('#s10').onclick=async function(){if(fin)return;fin=true;L.$('#h10').hidden=true;this.hidden=true;await deAnim(L.$('#v10'),0,1,v=>{p=v;t=0;draw();});if(!L.$('#c10'))return;facts(true);
    L.$('#c10').innerHTML=L.quote('To the man with only a hammer, everything starts looking like a nail.','an old adage the book cites')+
     L.prose('A model can be right and still not belong here. Ira’s sleep has two real causes; forcing one simple story is the wrong tool. Go back to the decision map and try another lens.');
    L.sheet('info','Right model, wrong situation','The book says models cause trouble when they’re wrong, or right but used where they don’t belong. Don’t throw Occam away: note in your journal why it didn’t fit here, so you know when to use it again.');L.done();};}},

{part:1,src:'Introduction · Mental Models and How to Use Them',pts:6,run(L){
  L.h(L.kick('pr','Right tool or wrong tool?')+'<h1 class="q">Sort Ira’s week: is the model a fit, or is it a bent nail?</h1>'+deApp(L));
  L.buckets(L.card,['A fit: keep going','Wrong tool: switch lens'],[
   [deRow('msg','Pella sends a terse late-night message. Ira reads it with Hanlon’s razor before replying.'),0,'A short message that reads harsh is Hanlon’s home ground. Assume a rushed manager, not an attack.'],
   [deRow('bill','A supplier overbills for the fourth time, after being told. Ira keeps saying “just a mistake”.'),1,'Hanlon’s razor assumes good faith unless the evidence is overwhelming. Four times after being told is overwhelming.'],
   [deRow('food','Ira spends twenty minutes on second-order thinking about which sandwich to buy.'),1,'Simple problems need few lenses. Models are not an excuse for a long decision process: just pick one.'],
   [deRow('dash','The dashboard says 95% on time; two clients complain. Ira goes to the loading dock to look.'),0,'Plan and reality disagree, so touch the territory. The map model fits.'],
   [deRow('past','Ira uses a thought experiment to decide, for certain, that staying at an old job would have made them rich.'),1,'Replaying the past is the riskiest use: history is chaotic. Use it to explore what might have happened, never to declare it.'],
   [deRow('ask','Out of their depth on share options, Ira asks someone who has held them which things matter and why.'),0,'Outside the circle, asking a Lifer which variables matter is exactly the move.']],
   'A model is the wrong tool when it’s right in general but doesn’t fit here: the evidence has piled up, the problem is too small, or the past is too chaotic to replay. Switch lens instead of hitting harder.');}},

{part:2,src:'Introduction · Keeping Your Feet on the Ground',
 solve:async L=>{L.$('#b12').click();await L.sleep(30);L.$('#b12').click();},
 run(L){
  L.h(L.kick('learn','Feet on the ground')+'<h1 class="q">A giant in Greek myth was unbeatable while touching the earth. Lift him.</h1>'+
   '<svg class="de-svg" viewBox="0 0 320 160" role="img" id="v12" aria-label="A giant standing on the ground, full strength">'+
   '<rect width="320" height="160" rx="14" fill="var(--soft)"/><rect x="0" y="132" width="320" height="28" fill="var(--ok-bg)"/><path d="M0 132H320" stroke="var(--ok-line)" stroke-width="2"/>'+
   '<g class="de-roots" id="r12"><path d="M116 134l-6 12M116 134l2 14M144 134l-4 13M144 134l6 12" stroke="var(--ok-strong)" stroke-width="2" stroke-linecap="round"/></g>'+
   '<g class="de-giant" id="g12"><path d="M122 100L116 132M138 100L144 132" stroke="var(--h4)" stroke-width="6" stroke-linecap="round"/><rect x="112" y="56" width="36" height="48" rx="12" fill="var(--h4-bg)" stroke="var(--h4)" stroke-width="2.5"/>'+
   '<path d="M112 66L94 86M148 66L166 86" stroke="var(--h4)" stroke-width="6" stroke-linecap="round"/><circle cx="130" cy="42" r="13" fill="var(--h4-bg)" stroke="var(--h4)" stroke-width="2.5"/></g>'+
   '<text x="263" y="22" text-anchor="middle" font-size="11" font-weight="700" fill="var(--muted)">STRENGTH</text><rect x="248" y="30" width="30" height="100" rx="6" fill="var(--soft2)"/>'+
   '<rect class="de-bar" id="s12" x="248" y="30" width="30" height="100" rx="6" fill="var(--ok-strong)" style="transform-origin:263px 130px"/></svg>'+
   '<p class="de-ro" id="r12t" aria-live="polite">Feet on the ground · strength <b>100%</b></p><div class="de-ctl"><button class="btn pri" id="b12">'+L.ic('arrow')+'Lift him off the ground</button></div><div id="c12"></div>');
  let up=false,lifted=false,fin=false;
  L.$('#b12').onclick=function(){up=!up;L.$('#g12').style.transform=up?'translateY(-34px)':'none';L.$('#r12').style.opacity=up?0:1;
    const bar=L.$('#s12');bar.style.transform=up?'scaleY(.12)':'none';bar.setAttribute('fill',up?'var(--no-strong)':'var(--ok-strong)');
    L.$('#v12').setAttribute('aria-label','A giant '+(up?'lifted off the ground, strength drained':'standing on the ground, full strength'));
    L.$('#r12t').innerHTML=up?'Off the ground · strength <b>12%</b>':'Feet on the ground · strength <b>100%</b>';
    this.innerHTML=up?L.ic('down')+'Put his feet back down':L.ic('arrow')+'Lift him off the ground';
    if(up&&!lifted){lifted=true;L.$('#c12').innerHTML=L.prose('That’s how Heracles beat him: lifted off the earth, the giant’s strength drained away.');}
    if(!up&&lifted&&!fin){fin=true;L.$('#c12').innerHTML=L.prose('Understanding is the same: cut off from reality, it stops helping you decide. Ira’s switchover plan, argued over for three weeks and never tried on the floor, is a lifted giant.');L.done();}};}},

{part:2,src:'Course application · built on the Introduction · Understanding Is Not Enough',
 solve:async L=>{const S=L.sg;S.lamp(1,true);S.lamp(2,false);S.lamp(1,false);S.lamp(2,true);},
 run(L){
  L.h(L.kick('learn','The act signal')+'<h1 class="q">Two lamps decide: keep thinking, act, or act small. Try every setting.</h1>'+
   L.note('How this course applies the book: built on keeping your feet on the ground, failing properly and the slippery-slope caution.','compass')+
   '<div id="g13"></div><p class="de-ro" id="r13">Signals seen: <b>0 of 3</b></p><div id="c13"></div>');
  const seen=new Set();let fin=false;
  L.sg=deSignal(L,L.$('#g13'),{onChange(S){if(!S.out)return;seen.add(S.out);L.$('#r13').innerHTML='Signals seen: <b>'+seen.size+' of 3</b>';
    if(!fin&&seen.size===3){fin=true;L.$('#c13').innerHTML=L.prose('If more thinking would clear the doubt, do that check. If it wouldn’t, act. And if the worst likely outcome could take you '+L.g('out-of-game','out of the game')+', act small: prepare, and take a step you can undo.');L.done();}}});}},

{part:2,src:'Probabilistic Thinking · Antifragility',pts:1,run(L){
  L.h(L.kick('pr','The act rule')+'<h1 class="q">Build the rule the signal follows.</h1>'+deApp(L));
  L.sentence(L.card,[
    ['Act when more thinking won’t clear the doubt that’s left,','Act only once every doubt is gone,','Act as soon as you feel ready,'],
    ['and the best outcome looks exciting enough.','and the worst likely outcome can’t take you out of the game.'],
    ['Start with one big step, then stick to it.','Start with a small step you can undo, then update.','Start by asking everyone else first.']],[0,1,1],
   [['Every doubt is never gone. Wait for that and you never act: the slippery slope the book warns about.','Feeling ready isn’t the test. Ask whether more thinking would actually clear the doubt.'],
    ['The upside doesn’t set the limit. The book’s rule is about the downside: never take a risk that takes you out of the game.'],
    ['A big step you can’t undo leaves no way back if it goes wrong. Start small, then update.','Others can help clear doubt, but asking can become another way of not acting. Take a small step and learn from it.']],
   'That’s the act rule. The book says trial and error carries information, so a small step you can undo teaches you something either way.');}},

{part:2,src:'Probabilistic Thinking · Antifragility',
 solve:async L=>{const S=L.sg;S.lamp(1,false);S.lamp(2,true);},
 run(L){
  L.h(L.kick('ex','Act small')+'<h1 class="q">Ira has weighed Fieldnote’s offer for a week, and is tempted to resign now “to have time to think”. Set the lamps.</h1>'+deApp(L)+
   '<div id="g15"></div><div id="h15" aria-live="polite"></div><div id="c15"></div>');
  let fin=false;
  L.sg=deSignal(L,L.$('#g15'),{onChange(S){if(fin||S.l1==null||S.l2==null)return;L.$('#h15').innerHTML='';
    if(S.l1){L.fb(L.$('#h15'),'Would another week of thinking really tell Ira whether start-up work fits? Only trying it will.','info');return;}
    if(!S.l2){L.fb(L.$('#h15'),'Resigning before anything is signed could leave Ira with no income. That’s the kind of loss lamp 2 is for.','info');return;}
    fin=true;S.locked=true;
    L.$('#c15').innerHTML='<div class="de-card"><span class="t">'+L.ic('arrow')+'NEXT STEP</span>Keep the job and the savings untouched. Spend one day at Fieldnote’s office, doing the 90-minute commute both ways. Then update.</div>'+
     L.prose('Thinking alone won’t settle it; a trial day will. But resigning first could take Ira out of the game, so the first step must be one Ira can undo.');
    L.sheet('info','Fail properly','The book’s two rules: never take a risk that takes you out of the game, and learn from what goes wrong. A small, reversible step follows both.');L.done();}});}},

{part:2,src:'Probabilistic Thinking · Antifragility',pts:3,
 solve:async L=>{for(let j=0;j<3;j++){const c=L.cs16[j];L.sg.lamp(1,c[1]);L.sg.lamp(2,c[2]);L.$('#c16').click();await L.sleep(20);if(j<2){document.querySelector('#go').click();await L.sleep(20);}}},
 run(L){
  const C=[['Ira has read about cutting coffee after 2 p.m. for a month. The plan: try it for two weeks and see if sleep improves.',false,false,'Another month of reading won’t show how Ira’s own sleep responds; two weeks of trying will. Nothing here can take Ira out of the game. Act.'],
   ['The mechanic quotes a big repair; the dealer pushes a new car. Ira hasn’t asked for a second quote, and one call this week would get it.',true,false,'One quick check would clear most of the doubt, so do it first. That’s thinking that pays. Keep thinking, for one call.'],
   ['After a 12-hour day, Ira wants to drive two hours to Wynn’s tonight to fit the handrails.',false,true,'The handrails are decided, so more thinking adds nothing. But driving two hours exhausted risks a crash, a loss you can’t come back from. Act small: order the rails tonight, ask Wynn’s neighbour to check in, and drive up rested at the weekend.']];
  L.cs16=C;
  L.h(L.kick('pr','Set the signal')+'<h1 class="q">Set both lamps for each of Ira’s cases.</h1>'+deApp(L)+'<p class="de-ro" id="n16"></p><div class="de-say" id="q16"></div><div id="g16"></div><div class="de-ctl"><button class="btn pri" id="c16">'+L.ic('check')+'Check</button></div>');
  let i=0,right=0;
  function show(){L.clearSheet();L.$('#g16').innerHTML='';L.sg=deSignal(L,L.$('#g16'),{});L.$('#n16').innerHTML='Case <b>'+(i+1)+' of 3</b>';L.$('#q16').innerHTML='<b class="k">IRA’S CASE</b>'+C[i][0];L.$('#c16').disabled=false;}
  L.$('#c16').onclick=function(){const S=L.sg;if(S.l1==null||S.l2==null){L.err('Set both lamps first');return;}L.err('');this.disabled=true;S.locked=true;
    const ok=S.l1===C[i][1]&&S.l2===C[i][2];L.award(ok);if(ok)right++;const want=C[i][1]?'think':C[i][2]?'small':'act';
    if(!ok)S.set(C[i][1],C[i][2]);
    const last=i===2;L.sheet(ok?'ok':'no',ok?DE_OUT[want][0].charAt(0)+DE_OUT[want][0].slice(1).toLowerCase():'It’s '+DE_OUT[want][0].toLowerCase(),C[i][3]+(last?' <b>'+right+' of 3 right.</b>':''),last?null:{label:'Next case',fn:()=>{i++;show();}});
    if(last)L.done();};
  show();}},

{part:2,src:'Second-Order Thinking · A Word of Caution',
 solve:async L=>{for(let j=0;j<5;j++)L.$('#b17').click();},
 run(L){
  L.h(L.kick('learn','Analysis paralysis')+'<h1 class="q">Both lamps say act: renew, for a shorter term. Ira keeps thinking anyway. Tap to think a few more days.</h1>'+deApp(L)+
   '<div id="g17"></div><svg class="de-svg" id="v17" viewBox="0 0 320 150" role="img"></svg><p class="de-ro" id="r17" aria-live="polite"></p>'+
   '<div class="de-ctl"><button class="btn pri" id="b17">'+L.ic('clock')+'Think three more days…</button></div><div id="c17"></div>');
  deSignal(L,L.$('#g17'),{l1:false,l2:false,locked:true});
  let d=0,fin=false;
  function draw(){const doubt=30-d*.1,exp=d>=14;let s='<rect width="320" height="150" rx="14" fill="var(--soft)"/><text x="12" y="18" font-size="11" font-weight="700" fill="var(--muted)">DAYS SPENT THINKING</text>';
    for(let j=0;j<15;j++){const x=12+j*20,on=j<d;s+='<rect x="'+x+'" y="26" width="17" height="22" rx="4" fill="var('+(on?'--pri-bg':'--card')+')" stroke="var('+(on?'--pri':'--line2')+')" stroke-width="1.5"/>';}
    s+='<path d="M'+(12+13*20+8.5)+' 50V60" stroke="var(--no)" stroke-width="2"/><text x="'+(12+13*20+14)+'" y="70" text-anchor="end" font-size="11" font-weight="700" fill="var(--no)">renewal offer ends</text>';
    s+='<text x="12" y="88" font-size="11" font-weight="700" fill="var(--muted)">DOUBT LEFT</text><rect x="12" y="94" width="296" height="14" rx="7" fill="var(--soft2)"/><rect x="12" y="94" width="'+(296*doubt/100).toFixed(1)+'" height="14" rx="7" fill="var(--h3)"/><text x="'+(20+296*doubt/100).toFixed(0)+'" y="105" font-size="11" font-weight="700" fill="var(--ink)">'+doubt.toFixed(0)+'%</text>';
    s+='<rect x="12" y="118" width="190" height="24" rx="8" fill="var('+(exp?'--no-bg':'--ok-bg')+')" stroke="var('+(exp?'--no-line':'--ok-line')+')" stroke-width="1.5"/><text x="22" y="134" font-size="12" font-weight="700" fill="var('+(exp?'--no':'--ok')+')"'+(exp?' text-decoration="line-through"':'')+'>Renew, shorter term</text>'+
      (exp?'<text x="212" y="134" font-size="12" font-weight="700" fill="var(--no)">offer expired</text>':'');
    L.$('#v17').innerHTML=s;L.$('#v17').setAttribute('aria-label','Day '+d+' of thinking; doubt left '+doubt.toFixed(0)+' percent; renewal offer '+(exp?'expired':'open'));
    L.$('#r17').innerHTML='Day <b>'+d+'</b> · doubt left <b>'+doubt.toFixed(0)+'%</b> · renewal offer <b>'+(exp?'expired':'open')+'</b>';}
  draw();
  L.$('#b17').onclick=function(){if(fin)return;d=Math.min(15,d+3);draw();
    if(d>=14){fin=true;this.parentNode.hidden=true;L.$('#c17').innerHTML=L.prose('Fifteen days of thinking cleared almost no doubt, and the best option expired. Now Ira must find a flat in a hurry.');
      L.sheet('info','The slippery slope','The book warns that looking ahead can slide into a '+L.g('slippery-slope','slippery slope')+' and analysis paralysis: if we worried about every possible effect, we’d never act. Weigh the most likely effects, then go.');L.done();}};}},

/* ---------- PART 4: LIMITS AND YOUR TURN ---------- */
{part:3,src:'Course application · built on the limits sections of every model',
 solve:async L=>{L.$$('#e18 .chip').forEach(b=>b.click());},
 run(L){
  const knot=(k,p,t,o)=>'<svg class="de-svg" viewBox="0 0 320 130" role="img" aria-label="'+DE_K[k].name+'">'+deKnot(k,p,t,Object.assign({big:true},o||{}))+'</svg>';
  const P=[
   ['Wrong tool',h=>{h.innerHTML=knot('nail',0,2,{hammer:'Hanlon'});},'The supplier has overbilled a fourth time, after being told. Ira keeps saying “just a mistake”. '+L.g('hanlons-razor','Hanlon’s razor')+' assumes good faith only until the evidence is overwhelming. Here it is: switch lens, and raise it formally.'],
   ['Analysis paralysis',h=>{deSignal(L,h,{l1:false,l2:false,locked:true});},'Both lamps say act, yet Ira is on day fifteen of thinking. Weighing every possible effect means never acting. Act on the most likely ones.'],
   ['Two knots at once',h=>{h.innerHTML='<div class="de-two"><svg class="de-svg" viewBox="0 0 320 130" role="img" aria-label="Tug of war">'+deKnot('pull',0,0)+'</svg><svg class="de-svg" viewBox="0 0 320 130" role="img" aria-label="Tangle">'+deKnot('tangle',0,0)+'</svg></div>';},'A standoff with Remy, tangled up with the lease. Untie one knot at a time, the standoff first, so you can face the tangle together.'],
   ['Nothing’s been tried',h=>{h.innerHTML=knot('loop',0,0);},'Three weeks of debating the new job board in meetings; nobody has tried it on the floor. You only learn whether you understand by acting. Try it with one team for a day.'],
   ['Ruinous step',h=>{deSignal(L,h,{l1:false,l2:true,locked:true});},'If the worst likely outcome could take you out of the game, don’t take that risk. Prepare, then take a step you can undo.']];
  L.h(L.kick('ex','Edge cases and limits')+'<h1 class="q">Where does the playbook stop helping on its own? Try each case.</h1>'+
   L.note('How this course applies the book’s own cautions.','compass')+'<div class="de-chips" id="e18"></div><div id="h18"></div><div id="f18"></div>');
  const seen=new Set();let fin=false;
  P.forEach((x,j)=>{const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=x[0];
    b.onclick=()=>{L.$$('#e18 .chip').forEach((c,q)=>c.classList.toggle('sel',q===j));L.$('#h18').innerHTML='';x[1](L.$('#h18'));L.$('#f18').innerHTML='';L.fb(L.$('#f18'),x[2],'info');seen.add(j);
      if(!fin&&seen.size===P.length){fin=true;L.sheet('info','Know where it stops','A knot can need a different tool, two knots can tangle, and thinking itself can become the dead end. The fix is the same each time: name what’s happening, then take the smallest real step.');L.done();}};
    L.$('#e18').appendChild(b);});
  L.$('#h18').innerHTML='<p class="de-ro">Pick a case.</p>';}},

{part:3,src:'Course application · built on every model’s chapter',pts:4,
 solve:async L=>{const R=L.dz;for(let j=0;j<R.length;j++){L.$('#t19 [data-k="'+R[j].k+'"]').click();await L.sleep(30);for(const m of R[j].ms)await deTap(L,'#k19',m);if(j<R.length-1){L.$('#n19').click();await L.sleep(30);}}},
 run(L){
  const R=[
   {k:'loop',ms:['first'],mo:'Pella wants to skip staff training to hit the switchover date. Ira can only think of “a full day off the floor” or “nothing at all”.'},
   {k:'wall',ms:['circle'],mo:'Ten days to answer Fieldnote. Ira still has no idea how share options work, or what to ask.'},
   {k:'pull',ms:['hanlon','second'],mo:'Ira is sure Bram promises rush jobs to make Ira look bad. They haven’t spoken in a week.',names:['Ira','Bram'],
    why:{hanlon:'Hanlon’s razor: Bram wants happy clients and doesn’t see what rush jobs cost production. No plot needed. One rope goes slack.',second:'Second-order thinking: Ira and Bram will work together for years. A feud costs them both. The other rope goes slack.'},
    next:'Ask Bram for ten minutes, show what one rush job costs the floor, and agree a quick check before promising.'},
   {k:'nail',ms:['lens'],mo:'The supplier overbilled again, the fourth time after being told. Ira keeps telling themself it’s just a mistake, and it feels forced.',hammer:'Hanlon',
    why:{lens:'Hanlon’s razor assumes good faith unless the evidence is overwhelming. Four overcharges after being told is overwhelming. Switch lens.'},
    next:'Send the four invoices to the supplier, ask for a refund, and check the next bill line by line.'}];
  L.dz=R;
  L.h(L.kick('pr','Challenge · four dead ends')+'<h1 class="q">Untie four of Ira’s dead ends with the fewest taps.</h1>'+deApp(L)+
   '<p class="de-ro" id="r19"></p><div class="de-say" id="q19"></div><span class="de-lab" id="l19">1 · Which knot?</span><div id="t19"></div><div id="f19" aria-live="polite"></div><div id="k19" hidden></div>'+
   '<div class="de-ctl"><button class="btn pri" id="n19" hidden>'+L.ic('arrow')+'Next dead end</button></div>');
  let i=0,taps=0,wr=0,named=false,clean=0;
  const ro=()=>{L.$('#r19').innerHTML='Dead end <b>'+(i+1)+' of 4</b> · taps <b>'+taps+'</b> (par 9) · clean <b>'+clean+'</b>';};
  const B=deBoard(L,L.$('#k19'),{knot:'loop',moment:false,
    onWrong(){taps++;wr++;ro();},onStep(){taps++;ro();},
    onDone(){taps++;const ok=wr===0;if(ok)clean++;L.award(ok);ro();
      if(i<R.length-1)L.$('#n19').hidden=false;
      else{L.sheet(clean===4?'ok':'info',clean+' of 4 untied clean','You used '+taps+' taps; par is 9. Name the knot, reach for the model made for it, and the dead end opens with the fewest moves.');L.done();}}});
  const T=deTiles(L,L.$('#t19'),{onPick(k,b){if(named)return;taps++;L.$('#f19').innerHTML='';
    if(k!==R[i].k){wr++;b.classList.add('no');L.shake(b);L.fb(L.$('#f19'),'Not that knot. This one is about '+DE_K[k].stuck.toLowerCase()+'. Read Ira’s moment again.','no');ro();return;}
    named=true;b.classList.add('ok');T.g.hidden=true;L.$('#l19').textContent='Knot: '+DE_K[k].name.toLowerCase()+' ✓ · now untie it';L.$('#k19').hidden=false;B.set(k,R[i]);ro();}});
  const load=()=>{named=false;wr=0;L.$('#q19').innerHTML='<b class="k">IRA’S DEAD END</b>'+R[i].mo;L.$('#k19').hidden=true;L.$('#n19').hidden=true;L.$('#f19').innerHTML='';L.$('#l19').textContent='1 · Which knot?';
    T.g.hidden=false;T.g.querySelectorAll('.de-tile').forEach(b=>b.classList.remove('ok','no'));ro();};
  L.$('#n19').onclick=()=>{i++;load();};load();}},

{part:3,src:'Course application · built on the Introduction · Time Invested Yields Enormous Benefits',
 solve:async L=>{L.$('#y20a').value='Choosing a new phone plan';L.$('#y20a').dispatchEvent(new Event('input',{bubbles:true}));L.$('#t20 [data-k="tangle"]').click();
   L.$('#y20b').value='Cross off the two with long contracts';L.$('#y20b').dispatchEvent(new Event('input',{bubbles:true}));L.sg.lamp(1,false);L.sg.lamp(2,false);L.$('#p20').click();},
 run(L){
  L.h(L.kick('pr','Your turn · ungraded')+'<h1 class="q">Name one place you’re stuck right now. Find its knot and your next step.</h1>'+
   L.note('How this course applies the book: the dead-end playbook on your own week.','compass')+
   '<label class="de-lab" for="y20a">Where I’m stuck</label><input class="de-in" id="y20a" maxlength="80" placeholder="e.g. which of three job offers to take">'+
   '<span class="de-lab">Its knot</span><div id="t20"></div><div class="de-say" id="h20" hidden></div>'+
   '<label class="de-lab" for="y20b">My next step (small, real)</label><input class="de-in" id="y20b" maxlength="80" placeholder="e.g. cross off the one that could go badly wrong">'+
   '<span class="de-lab">Then the act signal</span><div id="g20"></div>'+
   '<div class="de-ctl"><button class="btn pri" id="p20" disabled>'+L.ic('pencil')+'Print my next-step card</button></div><div id="o20"></div>');
  let k=null;const v=s=>L.$(s).value.trim();
  const chk=()=>{L.$('#p20').disabled=!(v('#y20a').length>1&&v('#y20b').length>1&&k&&L.sg.out);};
  const T=deTiles(L,L.$('#t20'),{onPick(x){k=x;T.sel(x);const h=L.$('#h20');h.hidden=false;h.innerHTML='<b class="k">'+DE_K[x].name.toUpperCase()+' · TRY</b>'+deRouteTxt(x)+'. <b>In a minute:</b> '+DE_K[x].mv;chk();}});
  L.sg=deSignal(L,L.$('#g20'),{q2:'Could the worst likely outcome take me out of the game?',onChange:chk});
  ['#y20a','#y20b'].forEach(s=>L.$(s).addEventListener('input',chk));
  L.$('#p20').onclick=()=>{const D=DE_OUT[L.sg.out];
    L.$('#o20').innerHTML='<div class="de-card"><span class="t">'+L.ic('arrow')+'MY NEXT STEP</span><b>'+L.esc(v('#y20a'))+'</b><br>Knot: '+DE_K[k].name.toLowerCase()+' → '+deRouteTxt(k)+'.<br>Next: '+L.esc(v('#y20b'))+'<br>Signal: <b>'+D[0].toLowerCase()+'</b> ('+D[1].toLowerCase()+').</div>';
    L.sheet('info','Write it down','Copy this into your decision journal. In a week, note what happened and which model helped. The book’s advice: early on, the process matters more than the outcome, and you get faster with practice.');L.done();};}},
