<script>
/* ===== Probabilistic thinking: this lesson's own curve with the out-of-the-game cliff, 10,000-square grid and regression strip ===== */
(function(){const st=document.createElement('style');st.textContent=`

/* ---------- seeded randomness and the t-shaped curve (bell when the tail slider is 0, fat-tailed at 1) ---------- */
function pbRng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function pbNrm(r){let u=0;while(!u)u=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*r());}
function pbGam(r,k){if(k<1)return pbGam(r,k+1)*Math.pow(r(),1/k);const d=k-1/3,c=1/Math.sqrt(9*d);for(;;){let x,v;do{x=pbNrm(r);v=1+c*x;}while(v<=0);v=v*v*v;const u=r();if(u<1-.0331*x*x*x*x)return d*v;if(Math.log(u)<.5*x*x+d*(1-v+Math.log(v)))return d*v;}}
const pbNu=f=>Math.exp(Math.log(40)+(Math.log(1.25)-Math.log(40))*f);
function pbDraw(r,f,m,c){const n=pbNu(f);const z=pbNrm(r);const g=2*pbGam(r,n/2);return Math.max(0,m+c*z/Math.sqrt(g/n));}
function pbLg(x){const C=[0.99999999999980993,676.5203681218851,-1259.1392167224028,771.32342877765313,-176.61502916214059,12.507343278686905,-0.13857109526572012,9.9843695780195716e-6,1.5056327351493116e-7];
  if(x<0.5)return Math.log(Math.PI/Math.sin(Math.PI*x))-pbLg(1-x);x-=1;let a=C[0];const t=x+7.5;for(let i=1;i<9;i++)a+=C[i]/(x+i);return .5*Math.log(2*Math.PI)+(x+.5)*Math.log(t)-t+Math.log(a);}
function pbPdf(x,f,m,c){const n=pbNu(f),z=(x-m)/c;return Math.exp(pbLg((n+1)/2)-pbLg(n/2))/Math.sqrt(n*Math.PI)/c*Math.pow(1+z*z/n,-(n+1)/2);}
function pbLater(el,ms,fn){setTimeout(()=>{if(el.isConnected)fn();},ms);}
const pbWait=ms=>new Promise(r=>setTimeout(r,ms));
function pbChips(host,labels,fn,cls){host.innerHTML='';return labels.map((t,j)=>{const b=document.createElement('button');b.className='chip';b.innerHTML=t;b.onclick=()=>fn(j,b);host.appendChild(b);return b;});}
function pbSel(btns,b){btns.forEach(x=>x.classList.toggle('sel',x===b));}

/* ---------- SIGNATURE 1: the curve with a prepared line and the out-of-the-game cliff ---------- */
function pbCurve(host,o){
  o=Object.assign({m:3,c:.8,max:12,fat:0,line:5.5,cliff:10,gap:null,fatSlider:false,lineSlider:null,drag:false,xlab:'How bad it gets (illustrative units)',lineLab:'Prepared',cliffLab:['Out of','the game'],safe:false,safeLab:['Prepared','for it'],hint:'No outcomes drawn yet.',seed:1,legend:['Within what you prepared for','Past it: painful','Out of the game']},o);
  const X0=16,X1=304,BY=134,TOP=30,peak=pbPdf(o.m,0,o.m,o.c),K=(BY-TOP)/peak;
  const sx=v=>X0+(X1-X0)*Math.max(0,Math.min(v,o.max))/o.max;
  let vals=[],seedN=0,busy=false,drag=false;
  const w=document.createElement('div');
  const tk=[];for(let v=0;v<=o.max;v+=2)tk.push(v);
  w.innerHTML='<svg class="pb-fig" viewBox="0 0 320 194" role="img" aria-label="A curve of possible outcomes, with a prepared line and an out-of-the-game zone on the right"'+(o.drag?' style="touch-action:none;cursor:ew-resize"':'')+'>'+
    '<rect class="pc-cl" y="26" height="'+(BY+20-26)+'" rx="5" stroke-width="1.5" stroke-dasharray="4 3"/>'+
    '<g class="pc-ar"></g><path class="pc-cu" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/>'+
    '<line x1="'+X0+'" y1="'+BY+'" x2="'+X1+'" y2="'+BY+'" stroke="var(--line2)" stroke-width="1.5"/>'+
    '<g class="pc-tk"></g>'+
    tk.map(v=>'<text x="'+sx(v)+'" y="'+(BY+34)+'" text-anchor="middle" font-size="11" fill="var(--muted)">'+v+'</text>').join('')+
    '<text x="160" y="'+(BY+52)+'" text-anchor="middle" font-size="11" fill="var(--muted)">'+o.xlab+'</text>'+
    '<g class="pc-cll"></g><text class="pc-off" y="'+(BY-6)+'" x="'+(X1+10)+'" text-anchor="end" font-size="11" font-weight="700" fill="var(--no)"></text>'+
    '<g class="pc-ln"></g></svg>'+
    (o.legend?'<div class="pb-leg"><span><i style="background:var(--ok)"></i>'+o.legend[0]+'</span><span><i style="background:var(--h3)"></i>'+o.legend[1]+'</span><span><i style="background:var(--no)"></i>'+o.legend[2]+'</span></div>':'')+
    (o.fatSlider?'<label class="pb-rg"><span>Tail shape</span><input type="range" min="0" max="100" step="1" value="'+Math.round(o.fat*100)+'" class="pc-fs" aria-label="Tail shape, from bell curve to fat tail"><b class="pc-fv"></b></label>':'')+
    (o.lineSlider?'<label class="pb-rg"><span>'+o.lineSlider.name+'</span><input type="range" min="'+o.lineSlider.min+'" max="'+o.lineSlider.max+'" step="'+o.lineSlider.step+'" value="'+o.line+'" class="pc-ls" aria-label="'+o.lineSlider.name+'"><b class="pc-lv"></b></label>':'')+
    '<p class="pb-ro" aria-live="polite"></p>';
  host.appendChild(w);
  const q=s=>w.querySelector(s),svg=q('svg');
  const cliffAt=()=>o.gap!=null?o.line+o.gap:o.cliff;
  const yv=v=>(BY-K*pbPdf(v,o.fat,o.m,o.c)).toFixed(1);
  const area=(a,b,fill,op)=>{a=Math.max(0,a);b=Math.min(o.max,b);if(b<=a)return '';let d='M'+sx(a).toFixed(1)+' '+BY;for(let v=a;v<b;v+=.04)d+=' L'+sx(v).toFixed(1)+' '+yv(v);d+=' L'+sx(b).toFixed(1)+' '+yv(b)+' L'+sx(b).toFixed(1)+' '+BY+' Z';return '<path d="'+d+'" fill="'+fill+'" opacity="'+(op||1)+'"/>';};
  function counts(){const cl=cliffAt();let past=0,cliff=0,off=0;vals.forEach(v=>{if(v>o.line)past++;if(cl!=null&&v>cl&&!o.safe)cliff++;if(v>o.max)off++;});return {n:vals.length,past,cliff,off};}
  function render(){
    const cl=cliffAt(),hasCl=cl!=null&&cl<o.max;
    let d='';for(let v=0;v<=o.max+1e-9;v+=.04)d+=(d?' L':'M')+sx(v).toFixed(1)+' '+yv(v);q('.pc-cu').setAttribute('d',d);
    q('.pc-ar').innerHTML=area(0,o.line,'var(--ok-bg)')+area(o.line,hasCl?cl:o.max,'var(--h3-bg)')+(hasCl?area(cl,o.max,o.safe?'var(--ok-bg)':'var(--no)',o.safe?1:.35):'');
    const r=q('.pc-cl');
    if(hasCl){r.setAttribute('x',sx(cl));r.setAttribute('width',X1+14-sx(cl));r.setAttribute('fill',o.safe?'var(--ok-bg)':'var(--no-bg)');r.setAttribute('stroke',o.safe?'var(--ok)':'var(--no)');r.style.display='';
      const lb=o.safe?o.safeLab:o.cliffLab,col=o.safe?'var(--ok)':'var(--no)',tx=Math.min(sx(cl)+5,X1-38);
      q('.pc-cll').innerHTML='<text x="'+tx+'" y="44" font-size="11" font-weight="700" fill="'+col+'">'+lb[0]+'</text><text x="'+tx+'" y="57" font-size="11" font-weight="700" fill="'+col+'">'+lb[1]+'</text>';}
    else{r.style.display='none';q('.pc-cll').innerHTML='';}
    const lx=sx(o.line),lab=(o.drag?'‹ ':'')+o.lineLab+(o.drag?' ›':''),lw=14+lab.length*6.3,hx=Math.max(2,Math.min(318-lw,lx-lw/2));
    q('.pc-ln').innerHTML='<line x1="'+lx+'" y1="22" x2="'+lx+'" y2="'+(BY+18)+'" stroke="var(--pri)" stroke-width="2.5"/><rect x="'+hx+'" y="3" width="'+lw+'" height="19" rx="9.5" fill="var(--pri)"/><text x="'+(hx+lw/2)+'" y="16.5" text-anchor="middle" font-size="11" font-weight="700" fill="var(--pri-ink)">'+lab+'</text>';
    let t='';vals.forEach(v=>{if(v>o.max)return;const x=sx(v).toFixed(1),inC=hasCl&&v>cl,col=v<=o.line?'var(--ok)':inC&&!o.safe?'var(--no)':'var(--h3)';
      t+='<line x1="'+x+'" y1="'+(BY+3)+'" x2="'+x+'" y2="'+(BY+(inC?20:15))+'" stroke="'+col+'" stroke-width="'+(inC?3:2)+'" stroke-linecap="round"/>';});
    q('.pc-tk').innerHTML=t;
    const c=counts();q('.pc-off').textContent=c.off?'+'+c.off+' off the chart →':'';
    q('.pb-ro').innerHTML=c.n?'Drawn '+c.n+': <b>'+c.past+'</b> past the line'+(hasCl&&!o.safe?', <b>'+c.cliff+'</b> in the cliff':'')+'.':o.hint;
    if(o.fatSlider)q('.pc-fv').textContent=o.fat<.25?'Bell: extremes capped':o.fat<.7?'Fatter tail':'Fat tail: no real cap';
    if(o.lineSlider)q('.pc-lv').textContent=o.lineSlider.fmt?o.lineSlider.fmt(o.line):o.line;
  }
  const api={o,el:w,get busy(){return busy;},counts,
    set(p){Object.assign(o,p);if('fat' in p||'m' in p)vals=[];render();},
    clear(){vals=[];render();},
    draw(n,seed){if(busy)return Promise.resolve(counts());busy=true;vals=[];const r=pbRng(seed!=null?seed:o.seed+(seedN++));const all=[];for(let i=0;i<n;i++)all.push(pbDraw(r,o.fat,o.m,o.c));
      const per=Math.min(45,1100/n);return new Promise(res=>{let i=0;const tick=()=>{if(!w.isConnected){busy=false;res(counts());return;}vals.push(all[i++]);render();if(i<n)setTimeout(tick,per);else{busy=false;res(counts());if(o.onDraw)o.onDraw(counts());}};tick();});}};
  if(o.fatSlider)q('.pc-fs').addEventListener('input',e=>{api.set({fat:+e.target.value/100});if(o.onFat)o.onFat(o.fat);});
  if(o.lineSlider)q('.pc-ls').addEventListener('input',e=>{o.line=+e.target.value;render();if(o.onLine)o.onLine(o.line);});
  if(o.drag){const toV=e=>{const b=svg.getBoundingClientRect(),x=(e.clientX-b.left)*320/b.width;const st=o.lineSlider?+o.lineSlider.step:.5,mn=o.lineSlider?+o.lineSlider.min:0,mx=o.lineSlider?+o.lineSlider.max:o.max;return Math.max(mn,Math.min(mx,Math.round((x-X0)/(X1-X0)*o.max/st)*st));};
    svg.addEventListener('pointerdown',e=>{const b=svg.getBoundingClientRect(),x=(e.clientX-b.left)*320/b.width;if(Math.abs(x-sx(o.line))>30)return;drag=true;svg.setPointerCapture(e.pointerId);});
    svg.addEventListener('pointermove',e=>{if(!drag)return;const v=toV(e);if(v!==o.line){o.line=v;if(o.lineSlider)q('.pc-ls').value=v;render();if(o.onLine)o.onLine(v);}});
    const up=()=>{drag=false;};svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);}
  render();return api;
}

/* ---------- SIGNATURE 2: the 10,000-square base-rate grid ---------- */
let PB_PERM=null;
function pbPerm(){if(PB_PERM)return PB_PERM;const r=pbRng(7),a=Array.from({length:10000},(_,i)=>i);for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return PB_PERM=a;}
const pbCss=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function pbGrid(host,cell){
  cell=cell||3;const W=100*cell,dpr=Math.max(1,window.devicePixelRatio||1);
  const c=document.createElement('canvas');c.className='pb-grid';c.width=Math.round(W*dpr);c.height=Math.round(W*dpr);c.style.maxWidth=W+'px';c.setAttribute('role','img');c.setAttribute('aria-label','A grid of 10,000 squares, one per person or item');host.appendChild(c);
  const x=c.getContext('2d');x.scale(dpr,dpr);
  function paint(k){const off=pbCss('--line'),on=pbCss('--no'),bg=pbCss('--card');x.fillStyle=bg;x.fillRect(0,0,W,W);
    const p=pbPerm(),mk=new Uint8Array(10000);for(let i=0;i<k;i++)mk[p[i]]=1;const s=cell*.76;
    x.fillStyle=off;for(let i=0;i<10000;i++)if(!mk[i])x.fillRect((i%100)*cell,Math.floor(i/100)*cell,s,s);
    x.fillStyle=on;for(let i=0;i<k;i++){const q=p[i];x.fillRect((q%100)*cell,Math.floor(q/100)*cell,s,s);}
    if(k&&k<=12){x.strokeStyle=on;x.lineWidth=2;for(let i=0;i<k;i++){const q=p[i];x.beginPath();x.arc((q%100)*cell+s/2,Math.floor(q/100)*cell+s/2,cell*3+4,0,7);x.stroke();}}}
  paint(0);return {paint,el:c};
}

/* ---------- small pictures reused by the limits screen ---------- */
function pbDots400(host,lost){const r=pbRng(41),idx=Array.from({length:400},(_,i)=>i);for(let i=399;i>0;i--){const j=Math.floor(r()*(i+1));const t=idx[i];idx[i]=idx[j];idx[j]=t;}
  const L=new Set(idx.slice(0,lost||0));let s='<svg class="pb-fig" viewBox="0 0 320 206" role="img" aria-label="400 dots, one per agent sent'+(lost?', '+lost+' marked as lost':'')+'">';
  for(let i=0;i<400;i++){const cx=12+(i%25)*12.3,cy=10+Math.floor(i/25)*12.3;s+='<circle class="pb-d" data-i="'+i+'" cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="4.4" fill="'+(L.has(i)?'var(--no)':lost?'var(--h2)':'var(--line2)')+'"/>';}
  host.innerHTML=s+'</svg>';return idx;}
function pbArrivals(host){const D=[-4,-1,1,2,4,6,8,9,12,14,17,20,22,26];const sx=v=>30+(v+20)*260/50;
  let s='<svg class="pb-fig" viewBox="0 0 320 120" role="img" aria-label="Fourteen trips where Ira left on time: one or two arrive a little early, most arrive late, several about 20 percent late">'+
   '<rect x="'+sx(-20)+'" y="22" width="'+(sx(0)-sx(-20))+'" height="56" rx="6" fill="var(--ok-bg)"/><rect x="'+sx(0)+'" y="22" width="'+(sx(30)-sx(0))+'" height="56" rx="6" fill="var(--no-bg)"/>'+
   '<line x1="'+sx(0)+'" y1="16" x2="'+sx(0)+'" y2="84" stroke="var(--ink)" stroke-width="2"/>'+
   '<text x="'+sx(-10)+'" y="16" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ok)">Early</text><text x="'+sx(15)+'" y="16" text-anchor="middle" font-size="11" font-weight="700" fill="var(--no)">Late</text>';
  D.forEach((v,j)=>{s+='<circle cx="'+sx(v).toFixed(1)+'" cy="'+(36+(j%3)*15)+'" r="6" fill="'+(v<0?'var(--ok)':'var(--no)')+'" opacity=".85"/>';});
  [[-20,'20% early'],[0,'on time'],[20,'20% late']].forEach(a=>{s+='<line x1="'+sx(a[0])+'" y1="80" x2="'+sx(a[0])+'" y2="86" stroke="var(--muted)"/><text x="'+sx(a[0])+'" y="100" text-anchor="middle" font-size="11" fill="var(--muted)">'+a[1]+'</text>';});
  host.innerHTML=s+'<text x="160" y="116" text-anchor="middle" font-size="11" fill="var(--muted)">Leaving on time: when do you arrive? (illustrative)</text></svg>';}
function pbStairs(host,tails){const bar=(x,h,c,l,n)=>'<rect x="'+x+'" y="'+(106-h)+'" width="56" height="'+h+'" rx="5" fill="'+c+'"/><text x="'+(x+28)+'" y="'+(100-h)+'" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">'+n+'</text><text x="'+(x+28)+'" y="122" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--ink)">'+l+'</text>';
  let s='<svg class="pb-fig" viewBox="0 0 320 '+(tails?224:130)+'" role="img" aria-label="Last year: 1,000 deaths from falls on stairs, 500 from terror attacks'+(tails?'. Below, the stairs curve is a narrow bell; the terror curve has a long fat tail':'')+'">'+
    '<text x="160" y="12" text-anchor="middle" font-size="11" fill="var(--muted)">Deaths last year, in one country (the book’s example)</text>'+
    bar(52,64,'var(--h2)','Stairs','1,000')+bar(212,32,'var(--h4)','Terror','500');
  if(tails){const bell=(x0)=>{let d='';for(let i=0;i<=60;i++){const v=i/60*6-3;d+=(d?' L':'M')+(x0+(v+3)*20).toFixed(1)+' '+(206-44*Math.exp(-v*v/.5)).toFixed(1);}return d;};
    const fat=(x0)=>{let d='';for(let i=0;i<=80;i++){const v=i/80*10-2;d+=(d?' L':'M')+(x0+(v+2)*11).toFixed(1)+' '+(206-36/(1+v*v*1.2)).toFixed(1);}return d;};
    s+='<line x1="10" y1="206" x2="310" y2="206" stroke="var(--line2)"/><path d="'+bell(20)+'" fill="none" stroke="var(--h2)" stroke-width="2.5"/><path d="'+fat(180)+'" fill="none" stroke="var(--h4)" stroke-width="2.5"/>'+
      '<text x="80" y="148" text-anchor="middle" font-size="11" font-weight="700" fill="var(--h2)">Like height: capped</text><text x="240" y="148" text-anchor="middle" font-size="11" font-weight="700" fill="var(--h4)">Like wealth: fat tail →</text>'+
      '<text x="80" y="220" text-anchor="middle" font-size="11" fill="var(--muted)">next year ≈ last year</text><text x="240" y="220" text-anchor="middle" font-size="11" fill="var(--muted)">one event can dwarf a decade</text>';}
  host.innerHTML=s+'</svg>';}
function pbBelief(host,k){const L=[9,7,5,2][k],T=['The 7:40 train gets Ira in by 9','Late on Monday','Late again on Wednesday','Timetable change announced'];
  let s='<svg class="pb-fig" viewBox="0 0 320 112" role="img" aria-label="Ira’s belief that the 7:40 train arrives in time: '+L+' mornings in 10'+(k===3?', replaced':'')+'"><rect x="4" y="4" width="312" height="104" rx="12" fill="var(--card)" stroke="'+(k===3?'var(--no)':'var(--pri)')+'" stroke-width="2"'+(k===3?' stroke-dasharray="5 4"':'')+'/>'+
    '<text x="16" y="24" font-size="11" font-weight="700" fill="var(--muted)">IRA’S PRIOR</text><text x="16" y="44" font-size="14" font-weight="700" fill="var(--ink)"'+(k===3?' text-decoration="line-through"':'')+'>'+T[0]+'</text>';
  for(let i=0;i<10;i++)s+='<circle cx="'+(30+i*29)+'" cy="68" r="10" fill="'+(i<L?'var(--ok)':'var(--soft2)')+'" stroke="'+(i<L?'var(--ok)':'var(--line2)')+'"/>';
  s+='<text x="16" y="98" font-size="12" fill="var(--ink)"><tspan font-weight="700">'+L+' mornings in 10</tspan> on time'+'</text>';

function pbScatter(host,o){const r=pbRng(17),P=Array.from({length:44},()=>[pbNrm(r),pbNrm(r)]);
  const w=document.createElement('div');w.innerHTML='<svg class="pb-fig" viewBox="0 0 320 214" role="img" aria-label="A scatter plot of 44 points"><rect x="36" y="8" width="276" height="170" rx="6" fill="var(--soft)"/><g class="ps-p"></g>'+
    '<text class="ps-x" x="174" y="196" text-anchor="middle" font-size="11.5" fill="var(--muted)"></text><text class="ps-y" transform="translate(24 93) rotate(-90)" text-anchor="middle" font-size="11.5" fill="var(--muted)"></text><text class="ps-t" x="174" y="211" text-anchor="middle" font-size="11" font-weight="700" fill="var(--h4)"></text></svg><p class="pb-ill">Course-drawn plot; strengths illustrative.</p><p class="pb-ro" aria-live="polite"></p>';
  host.appendChild(w);const q=s=>w.querySelector(s);
  function set(rho,xl,yl,extra,swap){const k=Math.sqrt(Math.max(0,1-rho*rho));let s='';P.forEach(p=>{let x=p[0],y=rho*p[0]+k*p[1];if(swap){const t=x;x=y;y=t;}const cx=174+Math.max(-2.7,Math.min(2.7,x))*48,cy=93-Math.max(-2.6,Math.min(2.6,y))*31;s+='<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="4.5" fill="var(--h1)" opacity=".75"/>';});
    q('.ps-p').innerHTML=s;q('.ps-x').textContent=xl;q('.ps-y').textContent=yl;q('.ps-t').textContent=extra||'';
    const a=Math.abs(rho),d=a<.15?'no pattern: few shared factors':a>.99?'perfect: one shared factor, a straight line':'weak to moderate: other factors at play';
    q('.pb-ro').innerHTML='Correlation <b>'+(rho>=0?'':'−')+a.toFixed(2)+'</b> · '+d+(rho<-.14?' (an inverse link)':'');}
  set(o&&o.rho||0,o&&o.xl||'Measure A',o&&o.yl||'Measure B');return {set};}

const PB_MAP=[
 ['Explaining why something happened',['Occam’s razor','Probabilistic thinking','The map is not the territory']],
 ['Someone’s behavior upset you',['Hanlon’s razor','The map is not the territory','Second-order thinking']],
 ['Deciding outside your expertise',['Circle of competence','The map is not the territory','First principles thinking']],
 ['A tempting quick fix or shortcut',['Second-order thinking','Inversion']],
 ['A goal with no clear path',['Inversion','First principles thinking','Second-order thinking']],
 ['Choosing between uncertain options',['Thought experiment','Probabilistic thinking','Second-order thinking','Inversion','Circle of competence']],
 ['Stuck with “the way it’s done”',['First principles thinking','Thought experiment']]];
const PB_DONE=['The map is not the territory','Circle of competence','First principles thinking','Thought experiment','Second-order thinking'];

Course.lesson({
  id:'0007', title:'Probabilistic thinking', minutes:20, icon:'trend',
  goals:['Start from the base rate before you react to a headline, a story or one result','Tell a capped, bell-curve risk from a fat-tailed one, and prepare so no outcome can take you out of the game','Pad your own hopeful estimates, and tell a real cause from things that just move together'],
  parts:['Odds and base rates','Fat tails','Estimates and causes','Move, limits, your week'],
  read:'Read the Probabilistic Thinking chapter and its supporting idea, Causation vs. Correlation, for the full Vera Atkins story, the insurance sidebar and the three correlation plots.',
  glossary:{
   'base-rate':'Base rate (or prior): what usually happens in situations like yours, from past information. You weigh new information against it.',
   'conditional-probability':'Conditional probability: the chance of something, given what happened before it. A choice is dependent when earlier events shrink the options.',
   'fat-tail':'Fat-tailed curve: a spread of outcomes with no real cap on the extremes, like wealth. In a bell curve, like height, the extremes are capped.',
   antifragile:'Antifragile: Nassim Taleb’s word for things that gain from shocks and disorder, up to a point, instead of being harmed by them.',
   'upside-optionality':'Upside optionality: putting yourself where good surprises can find you, when the worst case is that nothing happens.',
   'regression-mean':'Regression to the mean: an extreme result tends to be followed by a more ordinary one, with no cause needed.'
  },
  cheatsheet:[
   '<b>Almost nothing is 100% certain.</b> Estimate how likely each outcome is, then update as news arrives.',
   '<b>Check the conditions</b> before you trust a pattern: vanilla three times may only mean vanilla was what was left.',
   '<b>Base rate first.</b> A doubled tiny risk (1 → 2 in 10,000) can matter less than a steady climb (0.93% → 7.4%). Priors are estimates too: keep updating them.',
   '<b>Bell or fat tail?</b> Bell curves cap the extremes (height). Fat tails don’t (wealth): a small error about the extremes can leave you 10 or 100 times off.',
   '<b>Prepare, don’t predict.</b> Seek upside where the worst case is nothing. Fail properly: never take a risk that takes you out of the game, and learn from the misses.',
   '<b>Your estimates lean hopeful</b> (rarely 20% early, often 20% late), so pad them. And it only gets you into the ballpark, never certainty (Vera Atkins).',
   '<b>Moving together isn’t cause.</b> Look for a third factor, ask if the link runs backwards, and expect extremes to drift back to average anyway.',
   '<b>One-minute move</b> (course application): base rate → bell or fat tail? → pad the estimate → could it take me out of the game? → rough number, update later.'
  ],
  steps:[
/* ---------- PART 1: ODDS AND BASE RATES ---------- */
{part:0,src:'Warm-up',pts:1,run(L){

    if(rain)s+='<path d="M'+(x-5)+' 44l-2 6M'+(x+1)+' 44l-2 6M'+(x+7)+' 44l-2 6" stroke="var(--h2)" stroke-width="2" stroke-linecap="round"/>';

   'A 70% forecast expects dry weather on about 3 of every 10 such days. Almost nothing is 100% certain, so judge a forecast over many days, not one. That’s thinking in probabilities.');}},

{part:0,src:'Probabilistic Thinking · Conditional Probability',
 solve:async L=>{L.$('#ic-p').children[0].click();L.$('#ic-go').click();await L.sleep(2400);L.$('#ic-p').children[1].click();L.$('#ic-go').click();await L.sleep(2400);},
 run(L){
  const FL=[['Chocolate','var(--h3)'],['Strawberry','var(--h4)'],['Mint','var(--h2)'],['Vanilla','var(--h3-bg)']];
  const PL={first:[['Ira',2],['Pella',0],['Bram',1],['Floor lead',3]],last:[['Pella',0],['Bram',1],['Floor lead',2],['Ira',3]]};
  let pos='last',busy=false;const seen=new Set();let fin=false;
  L.h(L.kick('ex','Conditional probability')+'<h1 class="q">Ira ordered vanilla on the last three team outings. Favourite?</h1>'+
   '<p class="small" style="margin:0 0 4px">One scoop of each flavour is left. Put Ira first, then last, and run the queue each time.</p>'+
   '<div class="pb-chips" id="ic-p"></div><div id="ic-s"></div><p class="pb-ro" id="ic-r" aria-live="polite">Pick Ira’s place, then run the queue.</p>'+
   '<div class="pb-btns"><button class="btn pri" id="ic-go">'+L.ic('play')+'Run the queue</button></div>');
  function scene(order,served){let s='<svg class="pb-fig" viewBox="0 0 320 190" role="img" aria-label="Four tubs of ice cream and a queue of four people">';
    const taken={};order.slice(0,served).forEach(p=>taken[p[1]]=1);
    FL.forEach((f,j)=>{const x=20+j*75,gone=taken[j];s+='<circle cx="'+(x+28)+'" cy="28" r="15" fill="'+f[1]+'" stroke="var(--line2)" stroke-width="1.5" opacity="'+(gone?.15:1)+'"/><path d="M'+x+' 36h56l-5 34h-46z" fill="var(--card)" stroke="var(--line2)" stroke-width="2"/>'+
      '<text x="'+(x+28)+'" y="86" text-anchor="middle" font-size="11" font-weight="600" fill="'+(gone?'var(--faint)':'var(--ink)')+'"'+(gone?' text-decoration="line-through"':'')+'>'+f[0]+'</text>';});
    order.forEach((p,j)=>{const x=45+j*75,me=p[0]==='Ira',col=me?'var(--pri)':'var(--muted)',on=j===served-1;
      if(j<served)s+='<circle cx="'+x+'" cy="102" r="8" fill="'+FL[p[1]][1]+'" stroke="var(--line2)"/><path d="M'+(x-7)+' 106l7 14l7-14z" fill="var(--h3-bg)" stroke="var(--h3)" stroke-width="1.5"/>';
      s+='<circle cx="'+x+'" cy="138" r="8" fill="'+(me?'var(--pri-bg)':'var(--soft)')+'" stroke="'+col+'" stroke-width="2"/><path d="M'+x+' 147v14M'+x+' 161l-6 10M'+x+' 161l6 10M'+(x-9)+' 152h18" stroke="'+col+'" stroke-width="2.5" stroke-linecap="round" fill="none"/>'+
       '<text x="'+x+'" y="186" text-anchor="middle" font-size="11" font-weight="'+(on||me?'700':'500')+'" fill="'+(me?'var(--pri)':'var(--ink)')+'">'+(j+1)+'. '+p[0]+'</text>';});
    L.$('#ic-s').innerHTML=s+'</svg>';}
  const chips=pbChips(L.$('#ic-p'),['Ira first in line','Ira last in line'],(j,b)=>{if(busy)return;pos=j?'last':'first';pbSel(chips,b);scene(PL[pos],0);L.$('#ic-r').textContent='Run the queue to see what Ira gets.';});
  pbSel(chips,chips[1]);scene(PL.last,0);
  L.$('#ic-go').onclick=()=>{if(busy)return;busy=true;const o=PL[pos];let k=0;const card=L.$('#ic-s');
    const step=()=>{k++;scene(o,k);if(k<4)pbLater(card,520,step);else{busy=false;seen.add(pos);
      L.$('#ic-r').innerHTML=pos==='first'?'With all four flavours open, Ira picks <b>mint</b>. This pick is <b>independent</b>: it shows taste.':'Only <b>vanilla</b> is left when Ira’s turn comes. This pick is <b>dependent</b>: it shows what was left, not taste.';
      if(seen.size===2&&!fin){fin=true;L.sheet('info','Check the conditions first','Three vanillas looked like a favourite. But Ira was always last, so the choice was '+L.g('conditional-probability','conditional')+' on what the others left. Before you read a pattern from the past, look at the conditions around it.');L.done();}}};
    step();};}},

{part:0,src:'Probabilistic Thinking · Conditional Probability',
 solve:async L=>{for(let j=0;j<3;j++){L.$('#tt-s').querySelectorAll('.pb-tap')[j].dispatchEvent(new Event('click'));await L.sleep(20);}},
 run(L){
  const T=[['Bayesian thinking','Weigh new information against what you already know: the base rate.'],['Fat-tailed curves','Ask whether the extremes are capped, or whether anything can happen.'],['Asymmetries','Check your own estimates: they usually lean too hopeful.']];
  const seen=new Set();let fin=false;
  const g=(x,inner,j,lab)=>'<g class="pb-tap" tabindex="0" role="button" aria-label="'+lab+'" data-j="'+j+'"><rect x="'+x+'" y="6" width="98" height="112" rx="12" fill="var(--card)" stroke="var(--line2)" stroke-width="2" class="tt-b"/>'+inner+'<text x="'+(x+49)+'" y="108" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">'+lab.split(' ')[0]+'</text></g>';
  let grid='';for(let i=0;i<36;i++)grid+='<rect x="'+(22+(i%6)*11)+'" y="'+(20+Math.floor(i/6)*11)+'" width="8" height="8" rx="1.5" fill="'+(i===14?'var(--no)':'var(--line2)')+'"/>';
  const curve='<path d="M114 86 C130 86 136 30 150 30 C162 30 168 72 180 80 C192 86 200 84 206 85" fill="none" stroke="var(--h4)" stroke-width="2.5"/><rect x="190" y="22" width="14" height="66" fill="var(--no-bg)" stroke="var(--no)" stroke-dasharray="3 2"/>';
  const target='<circle cx="268" cy="54" r="30" fill="none" stroke="var(--line2)" stroke-width="2"/><circle cx="268" cy="54" r="17" fill="none" stroke="var(--line2)" stroke-width="2"/><circle cx="268" cy="54" r="4" fill="var(--ink)"/>'+[[284,62],[290,48],[287,70],[279,40],[294,58]].map(p=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3.5" fill="var(--h3)"/>').join('');
  L.h(L.kick('learn','Probability awareness')+'<h1 class="q">Your instincts were built for survival. Add three tools.</h1>'+
   '<svg id="tt-s" class="pb-fig" viewBox="0 0 320 124" role="img" aria-label="Three tools: a grid with one square lit, a curve with a long tail, and a target with hits all leaning to one side">'+g(4,grid,0,'Bayesian thinking')+g(111,curve,1,'Fat-tailed curves')+g(218,target,2,'Asymmetries')+'</svg>'+
   '<div class="pb-cn" id="tt-c"><small>Tap each picture</small>Each one is a tool you’ll use in this lesson.</div>'+
   '<p class="pb-cap">Our mental shortcuts evolved when life was about survival. Today’s choices sit in complex systems those shortcuts never met. So add probability awareness on purpose. It gets you into the ballpark.</p>');
  L.$('#tt-s').querySelectorAll('.pb-tap').forEach(el=>{const go=()=>{const j=+el.dataset.j;L.$('#tt-s').querySelectorAll('.tt-b').forEach((b,k)=>b.setAttribute('stroke',k===j?'var(--pri)':'var(--line2)'));
    L.$('#tt-c').innerHTML='<small>'+(j+1)+' of 3 · '+T[j][0]+'</small>'+T[j][1];seen.add(j);if(seen.size===3&&!fin){fin=true;L.done();}};
    el.addEventListener('click',go);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}});});}},

{part:0,src:'Probabilistic Thinking · Conditional Probability',
 solve:async L=>{L.$('#bg-v').children[1].click();await L.sleep(1300);L.$('#bg-st').children[1].click();await L.sleep(1300);},
 run(L){
  const S=[{h:'Violent stabbings on the rise',k:'Headline',a:1,b:2,x:'×2',ra:'Last year: <b>1 in 10,000</b> (0.01%)',rb:'Now: <b>2 in 10,000</b> (0.02%), and crime is at its lowest in decades.'},
           {h:'Diabetes diagnoses, 1958 → 2015',k:'Statistic',a:93,b:740,x:'×8',ra:'1958: <b>93 in 10,000</b> (0.93%)',rb:'2015: <b>740 in 10,000</b> (7.4%), after a steady climb, not a spike.'}];
  let s=0,view=0,fin=false;const seen=new Set();
  L.h(L.kick('learn','Bayesian thinking')+'<h1 class="q">Two scary numbers. Light up the base rate.</h1>'+
   '<div class="pb-chips" id="bg-st"></div><div class="pb-chips" id="bg-v"></div><div id="bg-h"></div><div id="bg-g"></div><p class="pb-ro" id="bg-r" aria-live="polite"></p>'+
   '<p class="pb-cap">When news arrives, weigh it against what you already know: the '+L.g('base-rate','base rate')+'. Thomas Bayes worked this out; his friend Richard Price shared the essay in 1763, after Bayes died.</p>');
  let grid=null;
  function draw(){const d=S[s];L.$('#bg-h').innerHTML='<div class="pb-head"><small>'+d.k+'</small>'+d.h+'</div>';const g=L.$('#bg-g');g.innerHTML='';
    if(view===0){const hb=(x,h,l,c)=>'<rect x="'+x+'" y="'+(150-h)+'" width="70" height="'+h+'" rx="6" fill="'+c+'"/><text x="'+(x+35)+'" y="170" text-anchor="middle" font-size="12" font-weight="600" fill="var(--ink)">'+l+'</text>';
      const hA=s?16:60,hB=s?128:120;g.innerHTML='<svg class="pb-fig" viewBox="0 0 320 180" role="img" aria-label="Headline view: before and after bars scaled so the change looks huge">'+hb(70,hA,'Before','var(--line2)')+hb(180,hB,'After','var(--no)')+
        '<text x="250" y="'+(150-hB+22)+'" font-size="26" font-weight="700" fill="var(--no)">'+d.x+'</text><text x="160" y="16" text-anchor="middle" font-size="11" fill="var(--muted)">Headline view: only the change, no base</text></svg>';
      L.$('#bg-r').innerHTML='In headline view, both just look alarming. Switch to the base-rate view.';}
    else{grid=pbGrid(g,2.7);grid.paint(d.a);L.$('#bg-r').innerHTML=d.ra;
      pbLater(g,900,()=>{grid.paint(d.b);L.$('#bg-r').innerHTML=d.ra+' → '+d.rb.replace(/^[^:]*: /,'');seen.add(s);
        if(seen.size===2&&!fin){fin=true;L.sheet('info','Which one deserves the worry?','Both numbers rose a lot. But the doubled stabbing risk is still 2 squares in 10,000, in the safest years on record. The diabetes climb filled 740 squares, steadily, for decades. Same kind of news, very different priors: that’s Bayesian thinking.');L.done();}});}}
  const sc=pbChips(L.$('#bg-st'),['Stabbings ×2','Diabetes climb'],(j,b)=>{s=j;pbSel(sc,b);draw();});
  const vc=pbChips(L.$('#bg-v'),[L.ic('alert')+'Headline',L.ic('layers')+'Base rate'],(j,b)=>{view=j;pbSel(vc,b);draw();});
  pbSel(sc,sc[0]);pbSel(vc,vc[0]);draw();}},

{part:0,src:'Probabilistic Thinking · Conditional Probability',
 solve:async L=>{for(let j=0;j<3;j++){L.$('#pr-n').click();await L.sleep(30);}},
 run(L){
  const EV=['','Late on Monday: a signal fault.','Late again on Wednesday.','Rail company: the timetable changes next month.'];let k=0;
  L.h(L.kick('learn','Priors get updated')+'<h1 class="q">A prior is an estimate, not a fact</h1>'+
   '<div id="pr-b"></div><p class="pb-ro" id="pr-e" aria-live="polite">Ira’s starting belief, from months of mornings.</p><div class="pb-btns"><button class="btn pri" id="pr-n">'+L.ic('info')+'New evidence arrives</button></div>'+
   '<p class="pb-ill">Mornings in 10 are illustrative</p>'+
   '<p class="pb-cap">A prior isn’t true or false: it’s a probability. New information that challenges it makes it less likely. Enough of it, and the prior gets replaced. Bayesian thinking is a constant cycle of checking what you think you know.</p>');
  pbBelief(L.$('#pr-b'),0);
  L.$('#pr-n').onclick=()=>{if(k>=3)return;k++;pbBelief(L.$('#pr-b'),k);L.$('#pr-e').textContent=EV[k];if(k===3){L.$('#pr-n').disabled=true;L.done();}};}},

{part:0,src:'Probabilistic Thinking · Conditional Probability',pts:1,
 solve:async L=>{L.$('#pp-o').children[1].click();await L.sleep(2300);},
 run(L){
  let fin=false;
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">Pella wants one number for Monday’s meeting. Which one should Ira bring?</h1>'+
   '<div class="pb-two"><div><div class="pb-head" style="font-size:14.5px;margin:0"><small>A</small>Misprints doubled this month!</div></div><div><div class="pb-head" style="font-size:14.5px;margin:0;border-left-color:var(--h3)"><small>B</small>Late orders up four quarters running</div></div></div>'+
   '<div class="pb-two" id="pp-g"><div id="pp-a"></div><div id="pp-b"></div></div><p class="pb-ill">Each grid = 10,000 sheets or orders. Figures illustrative.</p>'+
   '<div class="pb-chips col" id="pp-o"></div>');
  const ga=pbGrid(L.$('#pp-a'),1.5),gb=pbGrid(L.$('#pp-b'),1.5);
  L.$('#pp-a').insertAdjacentHTML('beforeend','<b id="pp-ra">?</b>');L.$('#pp-b').insertAdjacentHTML('beforeend','<b id="pp-rb">?</b>');
  const ops=pbChips(L.$('#pp-o'),['A: a doubling is the bigger alarm','B: the steady climb','Neither: both numbers are small'],(j,b)=>{if(fin)return;fin=true;pbSel(ops,b);const ok=j===1;b.classList.add(ok?'ok':'no');L.award(ok);
    const host=L.$('#pp-g');const A=[2,4],B=[100,200,350,500];

    pbLater(host,1700,()=>{L.$('#pp-ra').textContent='2 → 4 in 10,000';L.$('#pp-rb').textContent='100 → 500 in 10,000';
      L.sheet(ok?'ok':'no',ok?'B: the steady climb':'Look at the squares',(ok?'':j===0?'A doubled, but from 2 to 4 squares in 10,000. ':'Both started small, but B is not small any more. ')+'The misprints are a doubling of almost nothing. Late orders climbed steadily for a year, to 1 in 20. A steady climb is the worrying prior, like the book’s diabetes figures.');L.done();});});}},

/* ---------- PART 2: FAT TAILS ---------- */
{part:1,src:'Probabilistic Thinking · Orders of Magnitude',run(L){
  const bell=()=>{let d='';for(let i=0;i<=100;i++){const v=i/100*8-4;d+=(d?' L':'M')+(30+(v+4)*20).toFixed(1)+' '+(70-50*Math.exp(-v*v/1.1)).toFixed(1);}return d;};
  const fat=()=>{let d='';for(let i=0;i<=140;i++){const v=i/140*14-4;d+=(d?' L':'M')+(20+(v+4)*20.5).toFixed(1)+' '+(160-40/(1+v*v*.9)).toFixed(1);}return d;};
  L.h(L.kick('learn','Fat-tailed curves')+'<h1 class="q">Same wave in the middle. Look at the tails.</h1>'+
   '<svg class="pb-fig" viewBox="0 0 320 196" role="img" aria-label="Top: a bell curve of heights with fences at both ends. Bottom: a fat-tailed curve of wealth whose right tail runs off the chart, past 10, 100 and 10,000 times average">'+
   '<text x="8" y="14" font-size="11" font-weight="700" fill="var(--h2)">BELL CURVE · heights</text>'+
   '<line x1="14" y1="70" x2="306" y2="70" stroke="var(--line2)"/><path d="'+bell()+'" fill="var(--h2-bg)" stroke="var(--h2)" stroke-width="2.5"/>'+
   '<path d="M30 30v40M190 30v40" stroke="var(--ink)" stroke-width="2" stroke-dasharray="3 3"/><text x="200" y="40" font-size="11" fill="var(--ink)">cap: nobody is 10×</text><text x="200" y="53" font-size="11" fill="var(--ink)">average height</text>'+
   '<text x="8" y="104" font-size="11" font-weight="700" fill="var(--h4)">FAT TAIL · wealth</text>'+
   '<line x1="14" y1="160" x2="306" y2="160" stroke="var(--line2)"/><path d="'+fat()+'" fill="var(--h4-bg)" stroke="var(--h4)" stroke-width="2.5"/>'+
   '<path d="M296 150l10 4l-10 4" fill="var(--h4)"/>'+[[190,'10×'],[238,'100×'],[284,'10,000×']].map(a=>'<line x1="'+a[0]+'" y1="148" x2="'+a[0]+'" y2="164" stroke="var(--h4)" stroke-width="1.5"/><text x="'+a[0]+'" y="178" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink)">'+a[1]+'</text>').join('')+
   '<text x="300" y="193" text-anchor="end" font-size="11" fill="var(--muted)">wealth of people you may meet, × average</text></svg>'+
   '<p class="pb-cap">In a bell curve the extremes are capped. In a '+L.g('fat-tail','fat-tailed curve')+' there’s no real cap. Any one extreme is unlikely, but so many are possible that one will happen, and you can’t know when.</p>');
  L.done();}},

{part:1,src:'Probabilistic Thinking · Conditional Probability',
 solve:async L=>{const f=L.$('.pc-fs');f.value=100;f.dispatchEvent(new Event('input'));L.$('#cv-d').click();await L.sleep(1400);},
 run(L){

   '<p class="small" style="margin:0 0 4px">Draw 20 outcomes in the bell shape. Then slide the tail to fat and draw again. Drag the line to move what you prepared for.</p>'+

{part:1,src:'Probabilistic Thinking · Orders of Magnitude',pts:1,
 solve:async L=>{L.$('#pd-o').children[1].click();await L.sleep(1600);},
 run(L){
  let fin=false;
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">Ira pads the plan 10% past the worst case expected. In a fat tail, how many of 20 draws land past it?</h1>'+
   '<div id="pd-c"></div><div class="pb-chips col" id="pd-o"></div>');
  const cv=pbCurve(L.$('#pd-c'),{fat:1,line:5.5,cliff:10,lineLab:'Worst expected +10%',hint:'Predict first. Then the 20 draws drop in.'});
  const ops=pbChips(L.$('#pd-o'),['None: all 20 stay inside the padded line','A few land past it, and one can reach the cliff','About half land past it'],async(j,b)=>{if(fin)return;fin=true;pbSel(ops,b);
    const c=await cv.draw(20,22);const ok=j===1;b.classList.add(ok?'ok':'no');L.award(ok);
    L.sheet(ok?'ok':'no',ok?'A few, and one in the cliff':'Most looked ordinary, but…','This run: '+c.past+' of 20 went past the padded line and '+c.cliff+' landed in the cliff. In a fat tail, a small error about the extremes can leave you ten or a hundred times off, so a small pad can’t cover them. Don’t only pad: ask what could take you out of the game.');L.done();});}},

{part:1,src:'Probabilistic Thinking · Orders of Magnitude',
 solve:async L=>{L.$('#sv-t').click();},
 run(L){

{part:1,src:'Probabilistic Thinking · Antifragility',
 solve:async L=>{L.$('#af-s').click();await L.sleep(800);},
 run(L){
  const box=(x,id,lab,sub,col)=>'<g id="'+id+'" class="pb-shk"><rect x="'+x+'" y="34" width="80" height="62" rx="6" fill="var(--soft)" stroke="'+col+'" stroke-width="2.5"/><path d="M'+x+' 52h80M'+(x+40)+' 34v18" stroke="'+col+'" stroke-width="2"/><g class="af-x"></g></g>'+
    '<text x="'+(x+40)+'" y="116" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">'+lab+'</text><text x="'+(x+40)+'" y="131" text-anchor="middle" font-size="11" fill="var(--muted)">'+sub+'</text>';
  L.h(L.kick('learn','Antifragility')+'<h1 class="q">Prepare, don’t predict</h1>'+
   '<svg class="pb-fig" id="af-v" viewBox="0 0 320 140" role="img" aria-label="Three packages: one harmed by shaking, one neutral, one that gains from it">'+
    box(14,'af-0','Harmed','by shocks','var(--no)')+box(120,'af-1','Neutral','to shocks','var(--muted)')+box(226,'af-2','Helped','up to a point','var(--ok)')+'</svg>'+
   '<p class="pb-ro" id="af-r" aria-live="polite">The world is volatile. Shake it.</p><div class="pb-btns"><button class="btn pri" id="af-s">'+L.ic('cycle')+'Shake the world</button></div><div id="af-w"></div>');
  L.$('#af-s').onclick=()=>{['af-0','af-1','af-2'].forEach(id=>{const g=L.$('#'+id);g.classList.remove('pb-shake');void g.getBBox();g.classList.add('pb-shake');});
    pbLater(L.card,650,()=>{L.$('#af-0 .af-x').innerHTML='<path d="M30 40l12 16l-8 10l14 14l-6 12" fill="none" stroke="var(--no)" stroke-width="3" stroke-linejoin="round"/>';
      L.$('#af-2 .af-x').innerHTML='<circle cx="266" cy="74" r="13" fill="var(--ok)"/><path d="M266 67v14M259 74h14" stroke="var(--card)" stroke-width="3"/>';
      L.$('#af-r').innerHTML='Big, rare shocks (panics, crashes, wars) shape outcomes most, and no one can predict them. Don’t try to list every scenario in the tail. Be the '+L.g('antifragile','antifragile')+' package: placed to survive, or even gain. Two ways:';
      if(!L.$('#af-w').innerHTML){L.$('#af-w').innerHTML='<div class="pb-in">'+
        '<svg class="pb-fig" viewBox="0 0 320 132" role="img" aria-label="Left: a door out to a room of people; worst case, nothing happens. Right: a loop of try, miss, learn, kept on the safe side of a fence before the out-of-the-game cliff">'+
        '<text x="78" y="13" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ok)">SEEK THE UPSIDE</text>'+
        '<rect x="14" y="26" width="30" height="58" rx="3" fill="var(--soft)" stroke="var(--ink)" stroke-width="2"/><path d="M44 26l12 6v58l-12-6z" fill="var(--ok-bg)" stroke="var(--ink)" stroke-width="1.5"/>'+
        [[84,46],[110,38],[132,54],[100,70],[126,78]].map((p,j)=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="7" fill="'+(j===2?'var(--ok)':'var(--h2-bg)')+'" stroke="'+(j===2?'var(--ok)':'var(--h2)')+'" stroke-width="1.5"/>').join('')+
        '<path d="M60 58h14" stroke="var(--ok)" stroke-width="2.5" marker-end="none"/><path d="M70 53l6 5l-6 5" fill="none" stroke="var(--ok)" stroke-width="2.5"/>'+
        '<text x="78" y="104" text-anchor="middle" font-size="11" fill="var(--ink)">Worst case: nothing</text><text x="78" y="118" text-anchor="middle" font-size="11" fill="var(--ink)">happens</text>'+
        '<line x1="160" y1="8" x2="160" y2="124" stroke="var(--line)" stroke-width="1.5"/>'+
        '<text x="240" y="13" text-anchor="middle" font-size="11" font-weight="700" fill="var(--no)">FAIL PROPERLY</text>'+
        '<circle cx="224" cy="60" r="20" fill="none" stroke="var(--h3)" stroke-width="2.5"/><path d="M199 63l5-8l5 8M239 57l5 8l5-8" fill="none" stroke="var(--h3)" stroke-width="2.5" stroke-linejoin="round"/>'+
        '<text x="224" y="33" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">try</text><text x="250" y="64" font-size="11" font-weight="700" fill="var(--ink)">miss</text><text x="224" y="94" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">learn</text>'+
        '<path d="M282 26v64M290 26v64M278 40h16M278 72h16" stroke="var(--ink)" stroke-width="2"/><rect x="296" y="26" width="16" height="64" fill="var(--no-bg)" stroke="var(--no)" stroke-dasharray="3 2"/>'+
        '<text x="240" y="110" text-anchor="middle" font-size="11" fill="var(--ink)">Never out of the game;</text><text x="240" y="124" text-anchor="middle" font-size="11" fill="var(--ink)">learn from each miss</text></svg>'+
        '<p class="pb-cap">Left: go to the party; you’ll never meet those people at home (that’s '+L.g('upside-optionality','upside optionality')+'). Right: running a small business teaches through fast feedback that business school can’t. Trial and error carries information.</p></div>';}
      L.done();});};}},

{part:1,src:'Probabilistic Thinking · Antifragility',pts:1,
 solve:async L=>{const s=L.$('.pc-ls');s.value=6;s.dispatchEvent(new Event('input'));L.$('#fn-r').click();await L.sleep(2200);},
 run(L){
  let graded=false;
  L.h(L.kick('pr','Challenge')+'<h1 class="q">Make Fieldnote a risk Ira can survive</h1>'+
   '<p class="small" style="margin:0 0 4px">If the start-up folds, Ira could go months without pay, with a fat tail. Ira has 8 months of savings. Choose how many to keep untouched. Goal: none of 40 runs reaches the cliff, 3 months past your line.</p>'+
   '<div id="fn-c"></div><div class="pb-btns"><button class="btn pri" id="fn-r">'+L.ic('play')+'Lock in and run 40 times</button></div><p class="pb-ill">Illustrative shape and numbers</p>');
  const cv=pbCurve(L.$('#fn-c'),{m:2,c:.7,fat:1,line:2,gap:3,drag:true,lineLab:'Savings cover',lineSlider:{name:'Kept untouched',min:0,max:8,step:1,fmt:v=>v+' month'+(v===1?'':'s')},xlab:'Months without pay if Fieldnote folds',
    legend:['Savings cover it','Cut back hard, recover','Out of the game'],hint:'Ira’s first instinct: “a couple of months, tops.”'});
  L.$('#fn-r').onclick=async()=>{if(cv.busy)return;const line=cv.o.line;const c=await cv.draw(40,1107);if(!L.$('#fn-c'))return;
    const ok=c.cliff===0;if(!graded){graded=true;L.award(ok);L.$('#fn-r').innerHTML=L.ic('cycle')+'Try again (practice)';}
    L.sheet(ok?'ok':'no',ok?'Ira stays in the game':c.cliff+' run'+(c.cliff===1?'':'s')+' fell into the cliff',
      ok?'With '+line+' months untouched, no run reached the cliff, yet '+c.past+' still went past the line. Ira would struggle, cut back and recover. That’s failing properly: only ever temporarily. A fat tail can always throw a bigger draw. <i>How this course applies the book:</i> Ira could also skip bets that are hard to undo, like signing a long lease near Fieldnote before starting.'
        :'In a fat tail, “a couple of months” is the middle, not the edge. Keep more savings untouched and accept that some runs still go past the line. (In this illustrative run, about six months does it.) Move the line and run again.');L.done();};}},

{part:2,src:'Probabilistic Thinking · Antifragility',
 solve:async L=>{L.$('#as-n').click();await L.sleep(20);},
 run(L){

   '<p class="pb-cap" id="as-c">Do you ever set off on schedule and land 20% ahead of plan? Almost never. 20% behind? All the time. The misses aren’t random: they lean one way.</p>');

{part:2,src:'Probabilistic Thinking · Antifragility',pts:1,run(L){
  L.h(L.kick('try','Pad the estimate')+'<h1 class="q">The map app says Fieldnote’s office is 90 minutes away. How long should Ira plan for?</h1>'+
   '<svg class="pb-fig" viewBox="0 0 320 64" role="img" aria-label="A route from home to the Fieldnote office, labelled 90 minutes by the app"><circle cx="24" cy="32" r="12" fill="var(--pri-bg)" stroke="var(--pri)" stroke-width="2"/><path d="M18 33l6-6l6 6v7h-12z" fill="var(--pri)"/>'+
   '<path d="M40 32 C90 6 140 58 190 30 S260 40 282 32" fill="none" stroke="var(--line2)" stroke-width="4" stroke-dasharray="7 5"/><rect x="284" y="18" width="26" height="28" rx="3" fill="var(--h2-bg)" stroke="var(--h2)" stroke-width="2"/>'+
   '<rect x="122" y="2" width="76" height="20" rx="10" fill="var(--ink)"/><text x="160" y="16" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--card)">App: 90 min</text></svg>');
  L.mc(L.card,['Plan for 90: that’s what the app says','Plan for more than 90: misses lean late','Plan for under 90: some days will be quick'],1,

   'Travel-time misses are lopsided: you almost never arrive 20% early, but often 20% late. So the 90 minutes is closer to the best case. Plan for more.');}},

{part:2,src:'Probabilistic Thinking · The Spy World',
 solve:async L=>{for(let j=0;j<3;j++){L.$('#sp-n').click();await L.sleep(30);}},
 run(L){
  const C=['World War II. Vera Atkins helps run the French section of Britain’s Special Operations Executive. She chooses agents to send into occupied France.',
   '<b>Who goes?</b> She weighs factors: fluent French? Confident? Too tied to family? A problem-solver? Each becomes a rough estimate of a person’s chances, updated all the way to departure.',
   '<b>Where to?</b> Her intelligence is grainy photos, notes passed through many hands and hurried radio messages. She weighs each for relevance, quality and timeliness. Radio operators lasted about six weeks, on average.',
   '<b>The result:</b> of about 400 agents sent, about 100 were captured and killed. Careful estimates, constantly updated, still only get you into the ballpark. That’s no verdict on her skill: the method can’t promise success.'];
  let k=0;
  L.h(L.kick('ex','The spy world')+'<h1 class="q">Vera Atkins: good odds are still not certainty</h1>'+
   '<div class="pb-steps" id="sp-st"></div><div id="sp-d"></div><p class="pb-cap" id="sp-c" aria-live="polite"></p><div class="pb-btns"><button class="btn pri" id="sp-n">'+L.ic('arrow')+'Next</button></div>');
  let idx=pbDots400(L.$('#sp-d'),0);
  const draw=()=>{L.$('#sp-st').innerHTML=['Setting','Who goes','Where to','Result'].map((x,j)=>'<span class="'+(j<=k?'on':'')+'">'+x+'</span>').join('');L.$('#sp-c').innerHTML=C[k];};draw();
  L.$('#sp-n').onclick=()=>{if(k>=3)return;k++;draw();
    if(k===1)L.$('#sp-d').querySelectorAll('.pb-d').forEach(d=>d.setAttribute('fill','var(--h2)'));
    if(k===2)L.$('#sp-d').querySelectorAll('.pb-d').forEach((d,i)=>{if(i%7===3)d.setAttribute('opacity','.45');});
    if(k===3){pbDots400(L.$('#sp-d'),100);L.$('#sp-n').remove();
      L.$('#sp-d').insertAdjacentHTML('beforeend','<div class="pb-leg"><span><i style="background:var(--h2)"></i>the rest of the 400</span><span><i style="background:var(--no)"></i>captured and killed</span></div>');
      L.$('#sp-c').insertAdjacentHTML('afterend','<div class="pb-cn pb-in" style="border-left-color:var(--h3)"><small style="color:var(--h3)">Sidebar · insurers</small>Insurers work the same way: they can’t predict one person’s future, so they weigh the factors that matter and set a price that works on average.</div>');
      L.done();}};}},

{part:2,src:'Supporting Idea · Causation vs. Correlation',
 solve:async L=>{const p=L.$('#co-p').children;p[0].click();await L.sleep(20);p[1].click();await L.sleep(20);p[2].click();},
 run(L){
  const PR=[['Unrelated',0,'One measure','An unrelated measure','e.g. bottled water bought vs an unrelated national rate'],
    ['Height & weight',.62,'Height','Weight','Moderate: other factors at play'],
    ['°C & °F',1,'Temperature in °C','Temperature in °F','One shared factor: a straight line'],
    ['Drinking & grades',-.5,'Parents’ drinking','Kids’ grades','Inverse link: more of one, less of the other']];
  const seen=new Set();let fin=false;
  L.h(L.kick('learn','Supporting idea · correlation')+'<h1 class="q">Things that move together</h1>'+
   '<div class="pb-chips" id="co-p"></div><div id="co-s"></div>'+
   '<label class="pb-rg"><span>Correlation</span><input type="range" id="co-r" min="-100" max="100" step="5" value="0" aria-label="Correlation coefficient from minus 1 to 1"><b id="co-v">0.00</b></label>'+
   '<p class="pb-cap">Correlation runs from −1 to 1 and reflects how many factors two measures share. Most human things sit in between: height predicts weight, but other factors matter too. Tap the book’s three cases.</p>');
  const sc=pbScatter(L.$('#co-s'),{rho:0});
  const buck=r=>Math.abs(r)<.15?0:Math.abs(r)>.99?2:1;
  const chips=pbChips(L.$('#co-p'),PR.map(p=>p[0]),(j,b)=>{pbSel(chips,b);const p=PR[j];sc.set(p[1],p[2],p[3],p[4]);L.$('#co-r').value=p[1]*100;L.$('#co-v').textContent=p[1].toFixed(2);mark(p[1]);});
  L.$('#co-r').addEventListener('input',e=>{const r=+e.target.value/100;pbSel(chips,null);sc.set(r,'Measure A','Measure B');L.$('#co-v').textContent=r.toFixed(2);mark(r);});
  sc.set(0,PR[0][2],PR[0][3],PR[0][4]);
  function mark(r){seen.add(buck(r));if(seen.size===3&&!fin){fin=true;L.sheet('info','Even a strong link isn’t a cause','A perfect line (°C and °F) means one shared factor. A cloud means nothing shared. Most links sit in between, and none of them says which causes which, or whether either does. That’s '+L.g('causation-correlation','correlation vs causation')+'.');L.done();}}}},

{part:2,src:'Supporting Idea · Causation vs. Correlation',
 solve:async L=>{L.$('#fa-f').click();await L.sleep(30);},
 run(L){
  let flipped=false,fin=false;
  const A=['Parents drink more','Kids’ grades fall'];
  L.h(L.kick('learn','Supporting idea · flip the arrow')+'<h1 class="q">A study links parents’ drinking to kids’ poor grades. Which way does the arrow run?</h1>'+
   '<div id="fa-a"></div><div class="pb-btns"><button class="btn pri" id="fa-f">'+L.ic('cycle')+'Flip the arrow</button></div><div id="fa-s"></div>'+
   '<p class="pb-cap" id="fa-c">The tempting reading: drinking causes the poor grades. But the study only shows the two move together, in opposite directions.</p>');
  function arrow(){const rev=flipped,col=rev?'var(--h4)':'var(--no)';
    const box=(x,t,on)=>'<rect x="'+x+'" y="14" width="112" height="50" rx="10" fill="var(--card)" stroke="'+(on?col:'var(--line2)')+'" stroke-width="2"/>'+t.split(' ').reduce((a,w)=>{const l=a[a.length-1];if(l&&(l+' '+w).length<=12)a[a.length-1]=l+' '+w;else a.push(w);return a;},[]).map((ln,j,all)=>'<text x="'+(x+56)+'" y="'+(43+(j-(all.length-1)/2)*15)+'" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink)">'+ln+'</text>').join('');
    L.$('#fa-a').innerHTML='<svg class="pb-fig" viewBox="0 0 320 96" role="img" aria-label="'+(rev?'Arrow from kids’ grades to parents’ drinking: poor grades could push parents to drink':'Arrow from parents’ drinking to kids’ grades: drinking could hurt grades')+'">'+
      box(4,A[0],!rev)+box(204,A[1],rev)+
      (rev?'<path d="M200 39H128" stroke="'+col+'" stroke-width="4"/><path d="M134 30l-10 9l10 9" fill="none" stroke="'+col+'" stroke-width="4" stroke-linejoin="round"/>'
          :'<path d="M120 39H192" stroke="'+col+'" stroke-width="4"/><path d="M186 30l10 9l-10 9" fill="none" stroke="'+col+'" stroke-width="4" stroke-linejoin="round"/>')+
      '<text x="160" y="84" text-anchor="middle" font-size="11.5" font-weight="700" fill="'+col+'">'+(rev?'Poor grades push parents to drink?':'Drinking hurts grades?')+'</text></svg>';}
  arrow();
  const sc=pbScatter(L.$('#fa-s'),{rho:-.5});sc.set(-.5,'Parents’ drinking','Kids’ grades','Same study, read one way');
  L.$('#fa-f').onclick=()=>{flipped=!flipped;arrow();sc.set(-.5,flipped?'Kids’ grades':'Parents’ drinking',flipped?'Parents’ drinking':'Kids’ grades',flipped?'Same study, read the other way':'Same study, read one way',flipped);
    L.$('#fa-c').innerHTML=flipped?'Same dots, same −0.50. The data can’t tell you which way the arrow runs: poor grades could just as well push parents to drink. Before you act on a link, flip it and ask if the reverse fits too.':'Back to the first reading. Both stories fit the same dots, so the study alone can’t pick between them.';
    if(!fin){fin=true;L.done();}};}},

  const D=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],S=[74,52,73,49,70,78,76],G=[1,3];
  let s='<svg class="pb-fig" viewBox="0 0 320 132" role="img" aria-label="Ira’s week: sleep scores drop on Tuesday and Thursday, which are both gym days and late-work days">';

{part:2,src:'Supporting Idea · Causation vs. Correlation',pts:1,
 solve:async L=>{L.$('#rg-c').children[0].click();await L.sleep(900);L.$('#rg-q').children[1].click();},
 run(L){
  const W=[71,68,74,69,66,49],X=j=>34+j*38,Y=v=>178-(v-40)*3.1;let cure=null,fin=false;
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">Ira’s worst sleep week yet. Pick a cure for next week.</h1>'+
   '<div id="rg-v"></div><p class="pb-ill">Weekly sleep scores illustrative</p><div class="pb-chips" id="rg-c"></div><p class="pb-lab" id="rg-ql" hidden>What does next week’s jump show?</p><div class="pb-chips col" id="rg-q"></div>');
  function chart(n7,ghost){let s='<svg class="pb-fig" viewBox="0 0 320 206" role="img" aria-label="Weekly sleep scores for weeks 1 to 6, with week 6 the lowest'+(n7?', then week 7 bouncing back':'')+(ghost?', and dashed control lines from past worst weeks bouncing back the same way with no cure':'')+'">';
    [50,60,70,80].forEach(v=>{s+='<line x1="26" y1="'+Y(v)+'" x2="310" y2="'+Y(v)+'" stroke="var(--line)"/><text x="20" y="'+(Y(v)+4)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+v+'</text>';});
    const pts=W.slice();if(n7)pts.push(67);
    s+='<path d="'+pts.map((v,j)=>(j?'L':'M')+X(j)+' '+Y(v)).join(' ')+'" fill="none" stroke="var(--h1)" stroke-width="2.5"/>';
    if(ghost)s+='<path d="M'+X(5)+' '+Y(51)+' L'+X(6)+' '+Y(66)+'" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 4"/><path d="M'+X(5)+' '+Y(47)+' L'+X(6)+' '+Y(65)+'" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 4"/><path d="M30 12h22" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 4"/><text x="58" y="16" font-size="11" fill="var(--muted)">Ira’s own past worst weeks, no cure</text><text x="58" y="30" font-size="11" font-weight="700" fill="var(--h3)">a rough benchmark, not a true control</text>';
    pts.forEach((v,j)=>{s+='<circle cx="'+X(j)+'" cy="'+Y(v)+'" r="'+(j===5||j===6?6:4.5)+'" fill="'+(j===5?'var(--no)':j===6?'var(--ok)':'var(--h1)')+'"/>';});
    s+='<text x="'+X(5)+'" y="'+(Y(49)+20)+'" text-anchor="middle" font-size="11" font-weight="700" fill="var(--no)">worst: 49</text>';
    if(n7)s+='<text x="'+X(6)+'" y="'+(Y(67)-12)+'" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ok)">67</text><text x="'+X(6)+'" y="'+(Y(67)-25)+'" text-anchor="middle" font-size="11" fill="var(--ink)">'+cure+'</text>';
    [1,2,3,4,5,6,7].forEach(w=>{if(w<=pts.length||w===7)s+='<text x="'+X(w-1)+'" y="200" text-anchor="middle" font-size="11" fill="var(--muted)">wk '+w+'</text>';});
    L.$('#rg-v').innerHTML=s+'</svg>';}
  chart(false,false);
  const cs=pbChips(L.$('#rg-c'),['New pillow','No screens after 10','Change nothing'],(j,b)=>{if(cure)return;cure=['new pillow','no screens','no change'][j];pbSel(cs,b);
    pbLater(L.card,350,()=>{chart(true,false);L.$('#rg-ql').hidden=false;
      const qs=pbChips(L.$('#rg-q'),['The cure worked: the score jumped right after','Not much: a worst week tends to bounce back anyway','The app is broken: scores can’t jump that fast'],(k,qb)=>{if(fin)return;fin=true;const ok=k===1;qb.classList.add(ok?'ok':'no');L.award(ok);chart(true,true);
        L.sheet(ok?'ok':'no',ok?'Not much, yet':'Look at the dashed lines','Ira’s worst week was an extreme, and extremes drift back toward average on their own: '+L.g('regression-mean','regression to the mean')+'. The dashed lines bounce the same way with no cure. A cure only counts if it beats the bounce. Studies use a control group for that. For one person or team there’s rarely one: compare with your own past, peers or an average, and none is perfect. (The book’s example: an energy drink seems to help depressed children, who would improve anyway.)');L.done();});});});}},

{part:3,src:'Course application · built on Probabilistic Thinking',pts:1,
 solve:async L=>{for(let j=0;j<5;j++){L.$('#mv-n').click();await L.sleep(j===3?1300:60);}L.$('#mv-q').children[1].click();},
 run(L){
  const ST=['Base rate','Bell or fat?','Pad it','Out of game?','Rough number'];
  const CAP=['<b>The question:</b> will the switchover go live on the date? Ira’s plan line says “on time”.',
   '<b>1 · Base rate.</b> What usually happens? Past system changes at Harrow & Finch mostly ran a couple of weeks late. The curve sits right of Ira’s line.',
   '<b>2 · Bell or fat tail?</b> Most delays are capped at a few weeks. One outcome isn’t: losing the order history. That’s a cliff.',
   '<b>3 · Pad it.</b> Ira’s estimates lean hopeful, like everyone’s. Move the plan out to cover the usual delays.',
   '<b>4 · Out of the game?</b> Lost order history could cost the big clients. So prepare: keep paper tickets running for a week and back up the spreadsheets. Now even the extreme draw is survivable.',
   '<b>5 · Rough number, update later.</b> What does Ira tell Pella?'];
  let s=0,fin=false;
  L.h(L.kick('learn','One-minute move')+'<h1 class="q">Run the move on the switchover date</h1>'+
   L.note('How this course applies the book: five quick questions, built from the chapter, run on the curve.','compass')+
   '<div class="pb-steps" id="mv-st"></div><div id="mv-c"></div><p class="pb-cap" id="mv-t" aria-live="polite"></p><div class="pb-chips col" id="mv-q"></div><div class="pb-btns"><button class="btn pri" id="mv-n">'+L.ic('arrow')+'Next step</button></div>');
  const cv=pbCurve(L.$('#mv-c'),{m:2,c:.8,fat:0,line:.5,cliff:null,lineLab:'Ira’s plan',xlab:'How late or how bad it gets (illustrative)',legend:['Within the plan','Late, but survivable','Out of the game'],hint:'Curve = how the go-live could turn out.'});
  const draw=()=>{L.$('#mv-st').innerHTML=ST.map((x,j)=>'<span class="'+(j<s?'on':'')+'">'+(j+1)+'<br>'+x+'</span>').join('');L.$('#mv-t').innerHTML=CAP[s];};draw();
  L.$('#mv-n').onclick=()=>{if(s>=5||cv.busy)return;s++;draw();
    if(s===2)cv.set({fat:.8,cliff:9,cliffLab:['Order','history lost']});
    if(s===3)cv.set({line:4,lineLab:'Plan + padding'});
    if(s===4){cv.set({safe:true,safeLab:['Paper','backup']});cv.draw(20,66);}
    if(s===5){L.$('#mv-n').remove();
      const qs=pbChips(L.$('#mv-q'),['“We’ll go live on the date. Guaranteed.”','“About 70% likely within two weeks of the date, with a paper backup. I’ll update you weekly.”','“Nobody can know, so there’s no point estimating.”'],(j,b)=>{if(fin)return;fin=true;const ok=j===1;b.classList.add(ok?'ok':'no');L.award(ok);
        L.sheet(ok?'ok':'no',ok?'A rough number, and a promise to update':'Neither certainty nor shrugging',(ok?'':j===0?'Almost nothing is 100% certain, and a guarantee hides the cliff Ira just prepared for. ':'You can’t know for sure, but a rough estimate still beats none. ')+'The book’s probabilistic thinker is willing to admit they can’t be sure, name a rough figure from the evidence (its example is 63%), and then update it as news arrives.');L.done();});}};}},

{part:3,src:'Probabilistic Thinking · Conclusion',
 solve:async L=>{const p=L.$('#lm-p').children;for(let j=0;j<3;j++){p[j].click();await L.sleep(j===1?1300:40);}},
 run(L){
  const PRE=[
   ['Ballpark only',h=>pbDots400(h,100),'Even Vera Atkins’s careful, updated estimates lost about 100 of 400 agents. Probabilistic thinking gets you into the ballpark. It never guarantees success.'],
   ['Rare and huge',h=>{const cv=pbCurve(h,{fat:1,line:5.5,cliff:10,legend:null});cv.draw(20,22);},'Rare, extreme events can’t be predicted, not even by experts. You can only prepare, so the extreme draw can’t take you out of the game.'],
   ['Last year’s count',h=>pbStairs(h,true),'When the tail is fat, last year’s count is a weak prior. A small error about the extremes can leave you ten or a hundred times off.'],
   ['Your own odds',h=>pbArrivals(h),'Your estimates themselves can be wrong, and they usually err hopeful. Ask how good your odds about the odds are, and pad.'],
   ['Stale priors',h=>pbBelief(h,2),'A rough number is a snapshot. As news arrives, the odds change, so you must keep updating, even when it’s uncomfortable.'],
   ['Moving together',h=>pbScatter(h,{rho:.6,xl:'Gym days',yl:'Bad sleep'}).set(.6,'Gym days','Bad sleep','Hidden under both: late work'),'Things that move together don’t prove a cause, and extremes drift back to average by themselves. Look for a third factor, and flip the arrow. For one person or team there’s rarely a true control group: compare with peers, an average or your own past, knowing none is perfect.']];
  const seen=new Set();let fin=false;
  L.h(L.kick('learn','Limits')+'<h1 class="q">Six places probabilistic thinking runs out</h1>'+
   '<p class="small" style="margin:0 0 6px">Where it stops protecting you. Tap at least three: each jumps to an extreme case from the book.</p><div class="pb-chips" id="lm-p"></div><div id="lm-v"><div class="pb-cn"><small>Pick a case</small>The picture and the book’s limit appear here.</div></div>');
  const ch=pbChips(L.$('#lm-p'),PRE.map(p=>p[0]),(j,b)=>{pbSel(ch,b);const h=L.$('#lm-v');h.innerHTML='';const v=document.createElement('div');h.appendChild(v);PRE[j][1](v);
    h.insertAdjacentHTML('beforeend','<div class="pb-cn"><small>From the book · '+PRE[j][0]+'</small>'+PRE[j][2]+'</div>');seen.add(j);
    if(seen.size>=3&&!fin){fin=true;L.sheet('info','Use it, knowing its edges','Probabilistic thinking gives you rough, useful odds, never certainty. Prepare for what you can’t predict, distrust your own hopeful numbers, and keep updating.');L.done();}});}},

{part:3,src:'Course application · built on Probabilistic Thinking',pts:5,run(L){

{part:3,src:'Course application · built on Probabilistic Thinking',
 solve:async L=>{const n=L.$('#yt-n');n.value='40';n.dispatchEvent(new Event('input'));L.$('#yt-o').children[1].click();},
 run(L){
  const PAD=[10,25,50];let est=null,pad=null,fin=false;
  L.h(L.kick('try','Your turn · ungraded')+'<h1 class="q">Pad one estimate from your week</h1>'+
   L.note('How this course applies the book: the chapter’s asymmetry, used on your own numbers. The pad sizes are a starting point, not the book’s rule.','compass')+
   '<p class="pb-lab">1. An estimate you made this week (minutes, hours, days or money)</p><input class="pb-num" id="yt-n" type="number" min="1" inputmode="decimal" aria-label="Your estimate" placeholder="e.g. 40">'+
   '<p class="pb-lab">2. How often do estimates like this run over?</p><div class="pb-chips" id="yt-o"></div><div id="yt-b"></div><div id="yt-x"></div>');
  const os=pbChips(L.$('#yt-o'),['Rarely','Sometimes','Usually'],(j,b)=>{pad=PAD[j];pbSel(os,b);go();});
  L.$('#yt-n').addEventListener('input',e=>{const v=parseFloat(e.target.value);est=v>0?v:null;go();});
  function go(){if(est==null||pad==null)return;const tot=est*(1+pad/100),fmt=v=>Math.round(v*10)/10,w=220*est/tot;
    L.$('#yt-b').innerHTML='<svg class="pb-fig" viewBox="0 0 320 70" role="img" aria-label="Your estimate of '+fmt(est)+' padded by '+pad+' percent to '+fmt(tot)+'"><rect x="10" y="14" width="'+w.toFixed(1)+'" height="26" rx="6" fill="var(--pri)"/><rect x="'+(10+w).toFixed(1)+'" y="14" width="'+(220-w).toFixed(1)+'" height="26" rx="6" fill="var(--h3-bg)" stroke="var(--h3)" stroke-dasharray="4 3"/>'+
      '<text x="16" y="32" font-size="12" font-weight="700" fill="var(--pri-ink)">'+fmt(est)+'</text><text x="236" y="32" font-size="13" font-weight="700" fill="var(--ink)">Plan: '+fmt(tot)+'</text><text x="10" y="60" font-size="11" fill="var(--muted)">your estimate + '+pad+'% pad for hopeful misses</text></svg>';
    L.$('#yt-x').innerHTML='<div class="pb-cn"><small>Then ask</small>Could the worst case take you out of the game? If yes, prepare (a buffer, a backup) or skip that risk. Give it a rough number and update it as news arrives.</div><textarea class="pb-ta" aria-label="Your note" placeholder="Optional: what would you prepare? It stays on this screen."></textarea>';
    if(!fin){fin=true;L.done();}}}},

{part:3,src:'Course application · built on Probabilistic Thinking',run(L){
  const TR=[[['A headline or','one story scares','or excites you'],'news',[0,3]],[['You’re estimating','time, money','or odds'],'clock',[2,4]],[['A bad outcome','could be ruinous'],'cliff',[1,3]],[['The outcome is','uncertain'],'fork',[0,4]]];
  const EX=['Ira reads “falls at home rising among older people” and lies awake about Wynn. Start from what usually happens, then prepare (handrails, an alarm) rather than predict.',
   'Pella hears “two days, easy” for staff training; the app says 90 minutes to Fieldnote. Estimates lean hopeful: pad them.',
   'Spending all the savings on a deposit near Fieldnote. If the job folded, there’d be no buffer. Keep savings untouched.',
   'Will the switchover go live on the date? Nobody can know. Give Pella a rough number and update it weekly.'];
  const MV=[['Base','rate'],['Bell or','fat?'],['Pad','it'],['Out of','the game?'],['Rough','number']];
  const LM=['Ballpark only, never certainty','Rare extremes can’t be predicted: prepare','Your odds lean hopeful: pad, keep updating','Moving together isn’t cause: flip the arrow'];
  const icon=(k,x,y)=>k==='news'?'<rect x="'+x+'" y="'+y+'" width="22" height="26" rx="3" fill="var(--card)" stroke="var(--no)" stroke-width="2"/><path d="M'+(x+5)+' '+(y+7)+'h12M'+(x+5)+' '+(y+13)+'h12M'+(x+5)+' '+(y+19)+'h8" stroke="var(--no)" stroke-width="2"/>'
    :k==='clock'?'<circle cx="'+(x+11)+'" cy="'+(y+13)+'" r="11" fill="var(--card)" stroke="var(--h3)" stroke-width="2"/><path d="M'+(x+11)+' '+(y+6)+'v7l5 3" fill="none" stroke="var(--h3)" stroke-width="2" stroke-linecap="round"/>'
    :k==='cliff'?'<path d="M'+x+' '+(y+8)+'h12v18" fill="none" stroke="var(--ink)" stroke-width="2"/><rect x="'+(x+13)+'" y="'+(y+10)+'" width="11" height="16" fill="var(--no-bg)" stroke="var(--no)" stroke-dasharray="2 2"/>'
    :'<path d="M'+x+' '+(y+13)+'h8M'+(x+8)+' '+(y+13)+'L'+(x+22)+' '+(y+3)+'M'+(x+8)+' '+(y+13)+'L'+(x+22)+' '+(y+23)+'" fill="none" stroke="var(--h2)" stroke-width="2.5" stroke-linecap="round"/>';
  const mini=(j,x,y)=>j===0?Array.from({length:12},(_,i)=>'<rect x="'+(x+(i%4)*8)+'" y="'+(y+Math.floor(i/4)*8)+'" width="6" height="6" rx="1" fill="'+(i===6?'var(--no)':'var(--line2)')+'"/>').join('')
    :j===1?'<path d="M'+x+' '+(y+22)+'C'+(x+8)+' '+(y+22)+' '+(x+10)+' '+y+' '+(x+16)+' '+y+'S'+(x+24)+' '+(y+22)+' '+(x+32)+' '+(y+22)+'" fill="none" stroke="var(--h2)" stroke-width="2"/><path d="M'+(x+16)+' '+(y+4)+'C'+(x+22)+' '+(y+4)+' '+(x+24)+' '+(y+17)+' '+(x+36)+' '+(y+19)+'" fill="none" stroke="var(--h4)" stroke-width="2"/>'
    :j===2?'<rect x="'+x+'" y="'+(y+7)+'" width="20" height="10" rx="2" fill="var(--pri)"/><rect x="'+(x+20)+'" y="'+(y+7)+'" width="12" height="10" rx="2" fill="var(--h3-bg)" stroke="var(--h3)" stroke-dasharray="2 2"/>'
    :j===3?'<path d="M'+x+' '+(y+4)+'h18v20" fill="none" stroke="var(--ink)" stroke-width="2"/><rect x="'+(x+20)+'" y="'+(y+6)+'" width="12" height="18" fill="var(--no-bg)" stroke="var(--no)" stroke-dasharray="2 2"/>'
    :'<text x="'+(x+16)+'" y="'+(y+17)+'" text-anchor="middle" font-size="12" font-weight="700" fill="var(--pri)">~70%</text>';
  let s='<svg class="pb-fig" id="ck-v" viewBox="0 0 320 384" role="img" aria-label="Your card. Reach for it when a headline or one story scares or excites you, you are estimating time, money or odds, a bad outcome could be ruinous, or the outcome is uncertain. The one-minute move: base rate, bell or fat tail, pad it, out of the game, rough number. Where it stops: ballpark only; rare extremes can’t be predicted; your odds lean hopeful; moving together isn’t cause.">'+
    '<rect x="1" y="1" width="318" height="382" rx="14" fill="var(--card)" stroke="var(--pri)" stroke-width="2"/>'+
    '<text x="12" y="22" font-size="11" font-weight="700" fill="var(--muted)" letter-spacing=".4">1 · REACH FOR IT WHEN…</text>';
  TR.forEach((t,j)=>{const x=10+(j%2)*152,y=30+Math.floor(j/2)*68;
    s+='<g class="pb-tap ck-t" tabindex="0" role="button" data-j="'+j+'" aria-label="'+t[0].join(' ')+'"><rect class="ck-b" x="'+x+'" y="'+y+'" width="148" height="62" rx="10" fill="var(--soft)" stroke="var(--line2)" stroke-width="1.5"/>'+icon(t[1],x+7,y+18)+
      t[0].map((ln,i)=>'<text x="'+(x+38)+'" y="'+(y+(t[0].length===3?20:27)+i*14)+'" font-size="11" font-weight="600" fill="var(--ink)">'+ln+'</text>').join('')+'</g>';});
  s+='<text x="12" y="186" font-size="11" font-weight="700" fill="var(--muted)" letter-spacing=".4">2 · RUN THE ONE-MINUTE MOVE</text>';
  MV.forEach((m,j)=>{const x=10+j*61,cx=x+30;
    s+='<g class="ck-m"><rect class="ck-mb" x="'+x+'" y="194" width="58" height="96" rx="9" fill="var(--soft)" stroke="var(--line2)" stroke-width="1.5"/><circle cx="'+cx+'" cy="210" r="10" fill="var(--pri)"/><text x="'+cx+'" y="214" text-anchor="middle" font-size="11" font-weight="700" fill="var(--pri-ink)">'+(j+1)+'</text>'+
      mini(j,cx-16,226)+m.map((ln,i)=>'<text x="'+cx+'" y="'+(268+i*13)+'" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink)">'+ln+'</text>').join('')+'</g>';});
  s+='<text x="12" y="310" font-size="11" font-weight="700" fill="var(--muted)" letter-spacing=".4">3 · WHERE IT STOPS (FROM THE BOOK)</text>';
  LM.forEach((t,j)=>{const y=328+j*15;s+='<path d="M14 '+(y-7)+'l6 6M20 '+(y-7)+'l-6 6" stroke="var(--no)" stroke-width="2" stroke-linecap="round"/><text x="28" y="'+y+'" font-size="11" fill="var(--ink)">'+t+'</text>';});
  s+='</svg>';
  L.h(L.kick('learn','Take it with you')+'<h1 class="q">Your probabilistic thinking card</h1>'+
   '<p class="pb-lab" style="margin-top:0">How this course applies the book</p>'+s+
   '<div class="pb-cn" id="ck-x"><small>Tap a trigger</small>See it in an ordinary week; the steps it leans on light up.</div>'+
   '<div class="pb-cn" style="border-left-color:var(--h3)"><small style="color:var(--h3)">Stuck?</small>Spiralling on worst cases: go back to the base rate. Too many options: drop any that could take you out of the game.</div>'+
   '<p class="pb-cap">Small and easy to undo: run the move for a minute, then act. Big or hard to undo: walk the whole map row and write it down.</p>');
  L.$$('.ck-t').forEach(el=>{const go=()=>{const j=+el.dataset.j;
    L.$$('.ck-b').forEach((b,k)=>{b.setAttribute('stroke',k===j?'var(--pri)':'var(--line2)');b.setAttribute('stroke-width',k===j?'2.5':'1.5');});
    L.$$('.ck-mb').forEach((b,k)=>{const on=TR[j][2].includes(k);b.setAttribute('fill',on?'var(--pri-bg)':'var(--soft)');b.setAttribute('stroke',on?'var(--pri)':'var(--line2)');});
    L.$('#ck-x').innerHTML='<small>In Ira’s week</small>'+EX[j];};
    el.addEventListener('click',go);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}});});
  L.done();}}
  ]
});
</script>
</body>
</html>
