/* ---------- the ripple tank ---------- */
const SO_R=[30,62,94];
const SO_RH=['Right away','And then what?','And then what? Again'];
const soAng=(n,j)=>({1:[180],2:[150,210],3:[136,180,224],4:[124,160,200,236]}[Math.min(n,4)])[Math.min(j,3)];
const soFmt=n=>(n>0?'+':n<0?'−':'')+Math.abs(n);
const soDir=n=>n>0?'toward the goal':n<0?'away from the goal':'sideways: it evens out';
/* card: [text, weight (+ toward goal, − away), who, flag?]  flag: 'far' (far-fetched), 'unknown' (couldn’t know), 'luck' */
function soTank(L,host,o){
  o=o||{};let st=null,ring=0,mode='likely',arrowOn=!o.noArrow;const struck=new Set();
  const w=document.createElement('div');w.className='so-tank';host.appendChild(w);
  w.innerHTML='<div class="so-head"><span class="sc">Choice: <b>—</b></span><span class="sg">'+L.ic('target')+' Goal: <b>—</b></span></div>'+
   '<svg class="so-svg" viewBox="0 0 320 252" role="img" aria-label="Ripple tank: a choice dropped into a pond, rings of effects, and an arrow toward or away from the goal">'+
   '<rect x="0" y="0" width="320" height="252" rx="16" fill="var(--soft)"/>'+
   '<ellipse cx="160" cy="138" rx="150" ry="106" fill="var(--h2-bg)" stroke="var(--h2)" stroke-opacity=".35" stroke-width="1.5"/>'+
   '<path d="M160 4V34" stroke="var(--ink)" stroke-width="2"/><path d="M161 5 182 11 161 17Z" fill="var(--ok-strong)"/><text x="187" y="16" font-size="11" font-weight="700" fill="var(--ok)">GOAL</text>'+
   '<text x="312" y="40" text-anchor="end" font-size="11" font-weight="700" fill="var(--ok)">toward ↑</text>'+
   '<text x="312" y="244" text-anchor="end" font-size="11" font-weight="700" fill="var(--no)">away ↓</text>'+
   SO_R.map((r,j)=>'<circle class="so-ring" data-r="'+j+'" cx="160" cy="138" r="'+r+'"/>').join('')+
   '<g class="so-arr" opacity="0"><path d="M160 138V66" stroke="var(--pri)" stroke-width="6" stroke-linecap="round"/><path d="M146 72 160 50 174 72Z" fill="var(--pri)"/></g>'+
   '<g class="so-mk"></g>'+
   '<g class="so-stone" opacity="0"><circle cx="160" cy="138" r="12" fill="var(--ink)"/><circle cx="156" cy="134" r="3" fill="var(--card)" opacity=".35"/></g>'+
   '</svg><p class="so-ro" aria-live="polite">Drop a stone to start.</p><div class="so-ctl"></div><div class="so-cards"></div>';
  const $=s=>w.querySelector(s),ctl=$('.so-ctl');
  let chips=[],nextB=null,modeB=[];
  if(o.stones&&o.stones.length>1&&!o.noChips){ctl.insertAdjacentHTML('beforeend','<span class="lab">DROP A STONE</span>');
    o.stones.forEach((s,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=s.lab;b.onclick=()=>api.drop(s);ctl.appendChild(b);chips.push(b);});}
  if(!o.noNext){nextB=document.createElement('button');nextB.className='btn pri';nextB.innerHTML=L.ic('arrow')+'And then what?';nextB.disabled=true;nextB.onclick=()=>api.next();
    const row=document.createElement('div');row.className='so-ctl';row.appendChild(nextB);w.insertBefore(row,$('.so-cards'));}
  if(o.modes){const row=document.createElement('div');row.className='so-ctl';row.innerHTML='<span class="lab">WHICH EFFECTS?</span>';
    [['likely','Likely effects only'],['all','Every possible effect']].forEach(m=>{const b=document.createElement('button');b.className='chip'+(m[0]===mode?' sel':'');b.textContent=m[1];b.dataset.m=m[0];b.onclick=()=>api.setMode(m[0]);row.appendChild(b);modeB.push(b);});
    w.insertBefore(row,$('.so-cards'));}
  const live=(c,j,q)=>!struck.has(j+':'+q)&&c[3]!=='unknown';
  function net(){if(!st)return 0;let n=0;for(let j=0;j<ring;j++)(st.rings[j]||[]).forEach((c,q)=>{if(live(c,j,q))n+=c[1];});return n;}
  function cls(c,j,q){let k=c[3]==='unknown'?'un':c[3]==='luck'?'lk':c[1]>0?'up':c[1]<0?'dn':'nt';if(struck.has(j+':'+q))k+=' x';return k;}
  function badge(c,n){return c[3]==='unknown'?'?':c[3]==='luck'?'★':n;}
  function draw(){
    $('.sc b').textContent=st?st.lab:'—';$('.sg b').textContent=st?st.goal:'—';
    w.querySelectorAll('.so-ring').forEach((c,j)=>c.classList.toggle('on',!!st&&j<ring));
    $('.so-stone').setAttribute('opacity',st?1:0);
    let mk='',cards='',n=0;const tag=o.onCard?'button':'div';
    for(let j=0;j<ring&&st;j++){const list=st.rings[j]||[],wild=(mode==='all'&&st.wild&&st.wild[j])||[];
      if(list.length||wild.length)cards+='<div class="so-rh">'+SO_RH[j]+'</div>';
      list.forEach((c,q)=>{n++;const a=soAng(list.length,q)*Math.PI/180,r=SO_R[j],x=160+r*Math.cos(a),y=138+r*Math.sin(a),k=cls(c,j,q);
        const fill=k.startsWith('up')?'var(--ok-strong)':k.startsWith('dn')?'var(--no-strong)':k.startsWith('lk')?'var(--h3)':'var(--faint)';
        mk+='<g opacity="'+(struck.has(j+':'+q)?.35:1)+'"><circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="10" fill="'+fill+'" stroke="var(--card)" stroke-width="2"'+(c[3]==='unknown'?' stroke-dasharray="3 2"':'')+'/><text x="'+x.toFixed(1)+'" y="'+(y+4).toFixed(1)+'" text-anchor="middle" font-size="11" font-weight="700" fill="var(--card)">'+badge(c,n)+'</text></g>';
        cards+='<'+tag+' class="so-cd '+k+'" data-k="'+j+':'+q+'" data-f="'+(c[3]||'')+'"><i>'+badge(c,n)+'</i><span>'+c[0]+'</span><em>'+(c[2]||'')+'</em></'+tag+'>';});
      wild.forEach((c,q)=>{n++;const a=(-58+q*(116/Math.max(1,wild.length-1||1)))*Math.PI/180,r=SO_R[j]+(q%2?6:-6),x=160+r*Math.cos(a),y=138+r*Math.sin(a);
        mk+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="9" fill="var(--soft2)" stroke="var(--faint)" stroke-width="1.5" stroke-dasharray="3 2"/><text x="'+x.toFixed(1)+'" y="'+(y+4).toFixed(1)+'" text-anchor="middle" font-size="11" font-weight="700" fill="var(--muted)">?</text>';
        cards+='<div class="so-cd un"><i>?</i><span>'+c[0]+'</span><em>possible</em></div>';});}
    $('.so-mk').innerHTML=mk;$('.so-cards').innerHTML=cards;
    const nt=net(),ar=$('.so-arr');
    ar.setAttribute('opacity',st&&arrowOn?(mode==='all'?.2:1):0);
    ar.style.transform='rotate('+(90-Math.max(-3,Math.min(3,nt))*30)+'deg)';
    const ro=$('.so-ro');
    if(!st)ro.innerHTML='Drop a stone to start.';
    else if(mode==='all')ro.innerHTML='<b>Every possible effect.</b> Too many to weigh, so no decision.';
    else ro.innerHTML='Ring '+ring+' of '+st.rings.length+(arrowOn?' · net <b>'+soFmt(nt)+'</b>: <b>'+soDir(nt)+'</b>':'');
    if(nextB)nextB.disabled=!st||ring>=st.rings.length;
    chips.forEach((b,j)=>b.classList.toggle('sel',o.stones[j]===st));
    modeB.forEach(b=>b.classList.toggle('sel',b.dataset.m===mode));
    if(o.onCard)w.querySelectorAll('button.so-cd').forEach(b=>b.onclick=()=>{const [j,q]=b.dataset.k.split(':').map(Number);o.onCard(st.rings[j][q],j+':'+q,b);});
  }
  const api={wrap:w,struck,
    get ring(){return ring;},get stone(){return st;},get net(){return net();},get mode(){return mode;},
    drop(s){st=s;ring=1;struck.clear();if(!o.keepMode)mode='likely';draw();if(o.onChange)o.onChange('drop',api);},
    next(){if(!st||ring>=st.rings.length)return;ring++;draw();if(o.onChange)o.onChange('next',api);},
    show(n){ring=n;draw();},
    setMode(m){mode=m;draw();if(o.onChange)o.onChange('mode',api);},
    strike(k){struck.add(k);draw();},
    showArrow(){arrowOn=true;draw();},
    draw};
  if(o.auto)api.drop(o.stones[0]);else draw();
  return api;}

/* ---------- the decision-map strip (CANON “The decision map”; built lesson by lesson) ---------- */
const SO_M={map:['Map',2],circle:['Circle',3],first:['First principles',4],thought:['Thought exp.',5],second:['Second-order',6],prob:['Probabilistic',7],inv:['Inversion',8],occam:['Occam',9],hanlon:['Hanlon',10]};
const SO_ROWS=[['Why did this happen?',['occam','prob','map']],['Someone upset me',['hanlon','map','second']],['Outside my expertise',['circle','map','first']],['A tempting quick fix',['second','inv']],['A goal, no clear path',['inv','first','second']],['A big, uncertain bet',['thought','prob','second','inv','circle']],['“That’s how it’s done”',['first','thought']]];

Course.lesson({
  id:'0006', title:'Second-order thinking', minutes:20, icon:'arrow',
  goals:['Look past a choice’s immediate result by asking “And then what?” for you, for others and for trust',
         'Use the effects of the effects to protect long-term goals and trust, and to build arguments people accept',
         'Run the one-minute move on everyday choices, weighing only the likely effects, not every possible one'],
  parts:['And then what?','Ripples spread','The long game','Use it this week'],
  read:'Read the book’s Second-Order Thinking chapter for the full stories of Cleopatra’s choice in 48 BC and Mary Wollstonecraft’s argument, and for Garrett Hardin on the slippery slope.',
  glossary:{
   'first-order':'First-order thinking: looking only at the immediate result of a choice, the effect that solves today’s problem.',
   'slippery-slope':'Slippery slope: the belief that one step will set off an unstoppable chain of worse and worse effects. The book warns it leads to analysis paralysis.'
  },
  cheatsheet:[
   '<b>First-order</b> = the immediate result. <b>Second-order</b> = the effects of those effects. Ask: <b>“And then what?”</b>',
   'What fixes today’s problem can move you <b>away from your goal</b>: the chocolate bar’s crash, the cobra reward that bred more cobras. Missed until too late, that’s the <b>Law of Unintended Consequences</b>.',
   '<b>You can never merely do one thing.</b> The more connected things are, the further effects spread. Effects you can’t see yet are still piling up.',
   'The parade: once a few stand on tiptoe, everyone must. Nobody sees better, and all are worse off.',
   'Two uses: <b>long-term interests over quick gains</b> (trust only grows over repeated dealings) and <b>arguments</b> built on the good effects that follow.',
   'One-minute move (how this course applies the book): write the immediate result → “And then what?” twice (you, others, trust) → keep the likely effects → toward or away from the goal?',
   'Limits: it can’t predict the future. Avoid the slippery slope: weigh the typical, most likely effects, case by case. A good outcome doesn’t prove good thinking.'
  ],
  steps:[
/* ---------- PART 1: AND THEN WHAT? ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Pella wants to skip staff training so the new order system goes live on the date. Which question would you ask first?</h1>');
  L.mc(L.card,['Will skipping it get us live on the date?','What happens in the weeks after go-live?'],1,
   'The first question has an easy answer: yes. The second looks past the immediate result. This whole lesson is about asking it well.',
   'That one is easy: yes, skipping training gets you live on time. The more useful question is what happens next. This lesson is about asking it well.');}},

{part:0,src:'Second-Order Thinking · opening',
 solve:async L=>{L.$('#eb1').click();L.$('#eb2').click();},
 run(L){
  L.h(L.kick('learn','First order, second order')+'<h1 class="q">It’s 4 p.m. and Ira is flagging. Watch the energy line.</h1>'+
   '<svg class="so-svg" viewBox="0 0 320 190" role="img" aria-label="Ira’s energy from 3 to 7 p.m.: a slump, a spike after the chocolate bar, then a crash below the start">'+
   '<rect x="0" y="0" width="320" height="190" rx="14" fill="var(--soft)"/>'+
   '<text x="12" y="20" font-size="11" font-weight="700" fill="var(--muted)">ENERGY</text>'+
   '<path d="M28 96H308" stroke="var(--line2)" stroke-width="1.5" stroke-dasharray="4 4"/><text x="306" y="90" text-anchor="end" font-size="11" fill="var(--muted)">usual</text>'+

   '<path d="M32 98C60 104 80 116 100 120" fill="none" stroke="var(--ink)" stroke-width="3.5" stroke-linecap="round"/>'+
   '<text x="62" y="138" font-size="11" fill="var(--muted)">slump</text>'+
   '<path id="es1" class="so-path" d="M100 120C112 120 118 46 140 42S160 48 170 56" fill="none" stroke="var(--ok-strong)" stroke-width="3.5" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>'+
   '<text id="et1" x="140" y="30" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--ok)" opacity="0">1st order: craving gone</text>'+
   '<path id="es2" class="so-path" d="M170 56C188 70 196 140 222 146S270 140 304 136" fill="none" stroke="var(--no-strong)" stroke-width="3.5" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>'+
   '<text id="et2" x="262" y="118" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--no)" opacity="0">2nd order:</text><text id="et3" x="262" y="131" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--no)" opacity="0">the sugar crash</text>'+
   '</svg>'+
   '<div class="so-ctl"><button class="btn pri" id="eb1">'+L.ic('play')+'Eat the chocolate bar</button><button class="btn" id="eb2" hidden>'+L.ic('arrow')+'And then what?</button></div><div id="ecap"></div>');
  L.$('#eb1').onclick=function(){this.hidden=true;L.$('#es1').style.strokeDashoffset='0';L.$('#et1').setAttribute('opacity',1);L.$('#eb2').hidden=false;
    L.$('#ecap').innerHTML=L.prose(L.g('first-order','First-order thinking')+' stops here: it tastes good and the craving is gone. Problem solved?');};
  L.$('#eb2').onclick=function(){this.hidden=true;L.$('#es2').style.strokeDashoffset='0';['#et2','#et3'].forEach(s=>L.$(s).setAttribute('opacity',1));
    L.$('#ecap').innerHTML=L.prose(L.g('second-order','Second-order thinking')+' asks <b>“And then what?”</b> When the sugar high wears off, Ira crashes. What solves the immediate problem can take you further from your goal.');L.done();};}},

{part:0,src:'Second-Order Thinking · opening',
 solve:async L=>{const t=L.tank;t.drop(SO_COFFEE);t.next();t.next();t.drop(SO_CAR);t.next();t.next();},
 run(L){

{part:0,src:'Second-Order Thinking · opening',pts:1,
 solve:async L=>{L.$('#pp').children[2].click();L.$('#pw').click();},
 run(L){

   '<div class="so-chips" id="pp"></div><div class="so-ctl"><button class="btn pri" id="pw" hidden>'+L.ic('play')+'Drop it and watch</button></div><div id="ptk"></div>');
  let pick=null;const O=['Toward the goal','Sideways: it evens out','Away from the goal'];
  O.forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=n;b.onclick=()=>{if(b.disabled)return;pick=j;[...L.$('#pp').children].forEach((x,q)=>x.classList.toggle('sel',q===j));L.$('#pw').hidden=false;};L.$('#pp').appendChild(b);});

  L.$('#pw').onclick=function(){this.hidden=true;[...L.$('#pp').children].forEach(x=>x.disabled=true);const t=L.tank;t.drop(SO_TRAIN);
    const tick=(k)=>{if(!t.wrap.isConnected)return;if(k<2){t.next();setTimeout(()=>tick(k+1),k===0?800:500);return;}
      const ok=pick===2;L.award(ok);
      L.sheet(ok?'ok':'no',ok?'Away, as you said':'It swings away','Right away, the arrow pointed at the goal: Pella hits the date. After one “then what?”, it went sideways. After two, it pointed away: missing orders, overtime and more late orders for the two unhappy clients. The first-order win sat on top of a second-order loss.');L.done();};

/* ---------- PART 2: RIPPLES SPREAD ---------- */
{part:1,src:'Second-Order Thinking · opening',
 solve:async L=>{L.$('#wf').click();L.$('#wp').click();await L.sleep(1500);L.$('#wm').click();L.$('#wp').click();},
 run(L){
  const N=[['Pella',160,26],['Clients',258,66],['Floor team',66,66],['Bram',270,150],['Overtime',84,144],['Sleep',38,204],['Remy',148,204],['Wynn',250,206]];
  const FEW=[[-1,0],[-1,1],[-1,2]],MANY=FEW.concat([[1,3],[2,4],[4,5],[4,6],[6,7]]);
  L.h(L.kick('learn','A web, not a line')+'<h1 class="q">One choice at work. How far do its effects travel?</h1>'+
   '<svg class="so-svg" id="wsv" viewBox="0 0 320 226" role="img" aria-label="A web of Ira’s world with the choice to skip training at the centre"></svg>'+
   '<p class="so-ro" id="wro" aria-live="polite">Pick a web, then drop the stone.</p>'+
   '<div class="so-ctl"><button class="chip" id="wf">Few connections</button><button class="chip" id="wm">Many connections</button><button class="btn pri" id="wp" disabled>'+L.ic('play')+'Drop the stone</button></div>'+
   L.quote('You can never merely do one thing.','Garrett Hardin’s First Law of Ecology (1963), quoted in the book')+
   '<p class="small">The book: we live in a web of overlapping connections. The denser the web, the further a choice’s effects ripple, often where you aren’t looking.</p>');
  let edges=null;const tried=new Set();let busy=false;
  const P=k=>k<0?[160,114]:[N[k][1],N[k][2]];
  function draw(lit){let s='<rect width="320" height="226" rx="14" fill="var(--soft)"/>';
    (edges||[]).forEach(e=>{const a=P(e[0]),b=P(e[1]),on=lit&&lit.has(e[1])&&(e[0]<0||lit.has(e[0]));
      s+='<path class="so-th" d="M'+a[0]+' '+a[1]+'Q'+((a[0]+b[0])/2+8)+' '+((a[1]+b[1])/2+8)+' '+b[0]+' '+b[1]+'" fill="none" stroke="var('+(on?'--h2':'--line2')+')" stroke-width="'+(on?3:2)+'"/>';});
    N.forEach((n,k)=>{const on=lit&&lit.has(k),wd=n[0].length*6.6+16;
      s+='<rect class="so-wn" x="'+(n[1]-wd/2)+'" y="'+(n[2]-11)+'" width="'+wd+'" height="22" rx="11" fill="var('+(on?'--h2-bg':'--card')+')" stroke="var('+(on?'--h2':'--line2')+')" stroke-width="1.5"/><text x="'+n[1]+'" y="'+(n[2]+4)+'" text-anchor="middle" font-size="11.5" font-weight="'+(on?700:500)+'" fill="var('+(on?'--ink':'--muted')+')">'+n[0]+'</text>';});
    s+='<rect x="118" y="102" width="84" height="24" rx="12" fill="var(--ink)"/><text x="160" y="118" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--card)">Skip training</text>';
    L.$('#wsv').innerHTML=s;}
  draw();
  const setW=(m)=>{if(busy)return;edges=m==='f'?FEW:MANY;L.$('#wf').classList.toggle('sel',m==='f');L.$('#wm').classList.toggle('sel',m==='m');L.$('#wp').disabled=false;L.$('#wp').dataset.m=m;draw();L.$('#wro').textContent='Now drop the stone.';};
  L.$('#wf').onclick=()=>setW('f');L.$('#wm').onclick=()=>setW('m');
  L.$('#wp').onclick=()=>{if(busy||!edges)return;busy=true;const m=L.$('#wp').dataset.m;const lit=new Set();let wave=[-1],step=0;
    const go=()=>{if(!L.$('#wsv')||!L.$('#wsv').isConnected)return;const nx=[];
      edges.forEach(e=>{if(wave.includes(e[0])&&!lit.has(e[1])){nx.push(e[1]);}});
      if(!nx.length){busy=false;tried.add(m);L.$('#wro').innerHTML='Reached <b>'+lit.size+' of 8</b> in '+step+' ripple'+(step===1?'':'s')+'.'+(m==='f'?' Try the denser web.':'');
        if(tried.size===2){L.sheet('info','Denser webs carry effects further','With few connections, skipping training touched three parts of Ira’s world. With many, it reached all eight: overtime cut into sleep, time with Remy and visits to Wynn. Ira’s life is the dense kind.');L.done();}return;}
      nx.forEach(k=>lit.add(k));wave=nx;step++;draw(lit);L.$('#wro').innerHTML='Ripple '+step+': reached <b>'+lit.size+' of 8</b>';setTimeout(go,320);};
    go();};}},

{part:1,src:'Second-Order Thinking · opening',
 solve:async L=>{const t=L.tank;t.drop(SO_TIRES);t.next();t.drop(SO_MEDS);t.next();t.next();},
 run(L){
  L.h(L.kick('ex','Two stories from the book')+'<h1 class="q">Even good ideas send out ripples. Run both through the tank.</h1><div id="tk"></div><div id="tkn"></div>');
  const seen=new Set();let fin=false;
  L.tank=soTank(L,L.$('#tk'),{stones:[SO_TIRES,SO_MEDS],onChange(e,t){L.$('#tkn').innerHTML='';
    if(t.ring===t.stone.rings.length){seen.add(t.stone.lab);L.fb(L.$('#tkn'),t.stone.note,'info');}
    if(!fin&&seen.size===2){fin=true;L.sheet('info','You’ll deal with the ripples anyway','When the second level of effect isn’t weighed until it’s too late, people call the result the <b>Law of Unintended Consequences</b>. Consequences can’t be deleted to get you back to where you started. So the book says any thorough decision weighs the effects of the effects, before acting rather than after.');L.done();}}});}},

{part:1,src:'Second-Order Thinking · Prioritizing Long-Term Interests',
 solve:async L=>{const s=L.$('#dsl');s.value=30;s.dispatchEvent(new Event('input',{bubbles:true}));},
 run(L){
  L.h(L.kick('learn','Not visible ≠ not happening')+'<h1 class="q">Slide through a month of Ira’s late coffees. What can Ira see, and what piles up?</h1>'+
   '<svg class="so-svg" viewBox="0 0 320 214" role="img" aria-label="A pond seen from the side: the surface shows what Ira notices; the floor shows sleep lost piling up">'+
   '<rect width="320" height="214" rx="14" fill="var(--soft)"/>'+
   '<text x="12" y="18" font-size="11" font-weight="700" fill="var(--muted)">WHAT IRA NOTICES</text>'+
   '<text id="dsurf" x="160" y="40" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">Feels fine</text>'+
   '<rect x="8" y="52" width="304" height="128" fill="var(--h2-bg)"/><path d="M8 52q19-6 38 0t38 0 38 0 38 0 38 0 38 0 38 0 38 0" fill="none" stroke="var(--h2)" stroke-width="2"/>'+
   '<rect x="8" y="180" width="304" height="26" rx="4" fill="var(--soft2)"/>'+
   '<rect id="dsed" x="8" y="177" width="304" height="3" fill="var(--no-bg)" stroke="var(--no-line)" stroke-width="1.5"/>'+
   '<text id="dsedt" x="160" y="172" text-anchor="middle" font-size="12" font-weight="700" fill="var(--no)"></text>'+
   '<text x="12" y="198" font-size="11" font-weight="700" fill="var(--muted)">WHAT PILES UP UNDERNEATH</text>'+
   '</svg>'+
   '<label class="so-sl"><span class="h"><span>Days of late coffee</span><b id="dv">1</b></span><input type="range" id="dsl" min="1" max="30" step="1" value="1" aria-label="Days of late coffee, 1 to 30"></label>'+
   '<p class="so-ro" id="dro" aria-live="polite"></p><p class="small" style="margin:0">Ira’s figures are made up for the course (about 40 minutes of sleep lost a night).</p>');
  let fin=false;
  const SURF=[[1,'Feels fine','--ink'],[9,'Groggy mornings','--muted'],[16,'Dragging every afternoon','--no'],[23,'Needs a second coffee to cope','--no']];
  const upd=()=>{const d=+L.$('#dsl').value,h=Math.round(d*40/60*10)/10,px=Math.max(3,d*3);
    const s=SURF.filter(x=>d>=x[0]).pop();L.$('#dsurf').textContent='Day '+d+': '+s[1];L.$('#dsurf').setAttribute('fill','var('+s[2]+')');
    L.$('#dsed').setAttribute('y',180-px);L.$('#dsed').setAttribute('height',px);
    const t=L.$('#dsedt');t.textContent=d>1?h+' h of sleep lost':'';t.setAttribute('y',Math.min(172,180-px/2+4));
    L.$('#dv').textContent=d;L.$('#dro').innerHTML='Ira notices: <b>'+s[1].toLowerCase()+'</b> · underneath: <b>'+h+' hours</b> of sleep lost';
    if(!fin&&d>=21){fin=true;L.sheet('info','The pile grew before anything showed','For the first week, Ira notices nothing, yet hours of sleep are already gone. The book calls this the most dangerous short-term thinking: results that aren’t visible are still accumulating. Ask the candy question: is this what I want my life to look like in ten years?');L.done();}};
  L.$('#dsl').addEventListener('input',upd);upd();}},

{part:1,src:'Second-Order Thinking · Second-Order Problem',
 solve:async L=>{L.$$('.so-pp')[3].dispatchEvent(new MouseEvent('click',{bubbles:true}));},
 run(L){
  const N=7,X=j=>34+j*42;
  L.h(L.kick('learn','The parade problem')+'<h1 class="q">Tap anyone in the crowd to stand on tiptoe for a better view.</h1>'+
   '<svg class="so-svg" id="psv" viewBox="0 0 320 200" role="group" aria-label="A crowd behind a barrier watching a parade"><rect width="320" height="200" rx="14" fill="var(--soft)"/>'+
   '<rect x="0" y="0" width="320" height="52" rx="14" fill="var(--h4-bg)"/><path d="M8 194H312" stroke="var(--line2)" stroke-width="2"/>'+
   Array.from({length:N},(_,j)=>'<path class="so-lg" d="" stroke="var(--h1)" stroke-width="4" stroke-linecap="round"/>').join('')+
   '<g class="so-float"><rect x="0" y="14" width="78" height="28" rx="8" fill="var(--card)" stroke="var(--h4)" stroke-width="2"/><text x="39" y="32" text-anchor="middle" font-size="11" font-weight="700" fill="var(--h4)">PARADE</text><path d="M8 14V4l10 4-10 4M66 14V4l10 4-10 4" fill="var(--h4)" stroke="var(--h4)" stroke-width="1.5"/></g>'+
   '<rect x="6" y="57" width="308" height="5" rx="2.5" fill="var(--line2)"/>'+
   Array.from({length:N},(_,j)=>'<g class="so-pp" data-j="'+j+'" role="button" tabindex="0" aria-label="Person '+(j+1)+': stand on tiptoe"><rect class="so-hit" x="'+(X(j)-20)+'" y="74" width="40" height="122" rx="10" fill="transparent"/>'+
     '<circle class="so-bd" cx="'+X(j)+'" cy="86" r="8" fill="none"/><text class="so-bt" x="'+X(j)+'" y="90" text-anchor="middle" font-size="11" font-weight="700" fill="var(--card)"></text>'+
     '<rect x="'+(X(j)-14)+'" y="122" width="28" height="50" rx="11" fill="var(--h1-bg)" stroke="var(--h1)" stroke-width="2"/>'+
     '<circle cx="'+X(j)+'" cy="110" r="11" fill="var(--card)" stroke="var(--h1)" stroke-width="2"/></g>').join('')+
   '</svg>'+
   '<div class="so-ctl" style="font-size:12.5px;color:var(--muted);gap:12px"><span><b style="color:var(--pri)">▲</b> sees better</span><span><b style="color:var(--no-strong)">✕</b> blocked</span><span>no mark: same view as before</span></div>'+
   '<div class="so-meter"><span>See better than at the start</span><div class="bar"><i id="pm1" style="background:var(--pri)"></i></div><b id="pv1">0/7</b></div>'+
   '<div class="so-meter"><span>On tiptoe (effort)</span><div class="bar"><i id="pm2" style="background:var(--no-strong)"></i></div><b id="pv2">0/7</b></div>'+
   '<div class="so-ctl"><button class="btn" id="prs" hidden>'+L.ic('cycle')+'Everyone back down</button></div>');
  const up=Array(N).fill(false);let busy=false,fin=false;
  const stat=j=>{const h=up[j]?1:0,m=Math.max(j>0?(up[j-1]?1:0):0,j<N-1?(up[j+1]?1:0):0);return h>m?'b':h<m?'x':'s';};
  function draw(){let nb=0,nu=0;L.$$('.so-pp').forEach((g,j)=>{const s=stat(j);if(s==='b')nb++;if(up[j])nu++;
      g.style.transform=up[j]?'translateY(-14px)':'none';
      g.querySelector('.so-bd').setAttribute('fill',s==='b'?'var(--pri)':s==='x'?'var(--no-strong)':'none');
      const x=X(j),lg=L.$$('.so-lg')[j];lg.setAttribute('d',up[j]?'M'+(x-7)+' 156l-1 36M'+(x+7)+' 156l1 36':'M'+(x-7)+' 170l-2 22M'+(x+7)+' 170l2 22');
      g.querySelector('.so-bt').textContent=s==='b'?'▲':s==='x'?'✕':'';});
    L.$('#pm1').style.width=nb/N*100+'%';L.$('#pm2').style.width=nu/N*100+'%';L.$('#pv1').textContent=nb+'/7';L.$('#pv2').textContent=nu+'/7';}
  function tap(j){if(busy||up.some(Boolean))return;busy=true;up[j]=true;draw();
    const step=()=>{if(!L.$('#psv')||!L.$('#psv').isConnected)return;const bl=[];for(let k=0;k<N;k++)if(stat(k)==='x')bl.push(k);
      if(!bl.length){busy=false;L.$('#prs').hidden=false;
        if(!fin){fin=true;L.sheet('info','Everyone on tiptoe, nobody sees better','Warren Buffett, in the book, likens the second-order problem to this crowd. One person gains a view, which blocks the people beside them, so they rise too, until all are straining and the view is back where it started. Each step made sense; together, all are worse off.');L.done();}return;}
      bl.forEach(k=>up[k]=true);draw();setTimeout(step,300);};
    setTimeout(step,450);}
  L.$$('.so-pp').forEach((g,j)=>{g.addEventListener('click',()=>tap(j));g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tap(j);}});});
  L.$('#prs').onclick=()=>{if(busy)return;up.fill(false);draw();L.$('#prs').hidden=true;};
  draw();}},

{part:1,src:'Second-Order Thinking · Second-Order Problem',pts:1,run(L){
  L.h(L.kick('try','Spot the parade')+'<h1 class="q">At Harrow & Finch, a few people start marking every email “URGENT” so theirs get read first. Soon everyone does. What happens?</h1>');
  L.mc(L.card,['Urgent emails now get read faster than before','Only the first few people keep any advantage','Nothing stands out, and real emergencies get lost'],2,
   'That’s the parade: once everyone is on tiptoe, nobody sees better and all are worse off. The label stops meaning anything, and a real emergency looks like every other email.',
   'Once everyone copies the move, nobody’s email stands out, not even the first movers’. Like the parade crowd, all are on tiptoe and no one sees better, and real emergencies get buried.');}},

/* ---------- PART 3: THE LONG GAME ---------- */
{part:2,src:'Second-Order Thinking · Second-Order Problem',run(L){
  L.h(L.kick('learn','Two places it pays off')+'<h1 class="q">The book names two uses for second-order thinking</h1>'+
   '<svg class="so-svg" viewBox="0 0 320 168" role="img" aria-label="Left: a quick win that sinks over time beside a slow start that climbs. Right: a speech bubble sending out rings of effects.">'+
   '<rect x="0" y="0" width="156" height="168" rx="14" fill="var(--soft)"/><rect x="164" y="0" width="156" height="168" rx="14" fill="var(--soft)"/>'+
   '<text x="78" y="20" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--ink)">1 · The long game</text>'+
   '<path d="M12 96H146" stroke="var(--line2)" stroke-dasharray="4 4"/><text x="146" y="160" text-anchor="end" font-size="11" fill="var(--muted)">time →</text>'+
   '<path d="M14 96C30 60 44 56 58 66S110 128 144 136" fill="none" stroke="var(--no-strong)" stroke-width="3.5" stroke-linecap="round"/>'+
   '<path d="M14 96C30 112 46 118 64 108S112 52 144 40" fill="none" stroke="var(--ok-strong)" stroke-width="3.5" stroke-linecap="round"/>'+
   '<text x="22" y="52" font-size="11" font-weight="700" fill="var(--no)">quick win</text><text x="142" y="32" text-anchor="end" font-size="11" font-weight="700" fill="var(--ok)">long game</text>'+
   '<text x="242" y="20" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--ink)">2 · Arguments</text>'+
   '<circle cx="242" cy="86" r="30" fill="none" stroke="var(--h2)" stroke-width="2" opacity=".8"/><circle cx="242" cy="86" r="44" fill="none" stroke="var(--h2)" stroke-width="2" opacity=".5"/><circle cx="242" cy="86" r="58" fill="none" stroke="var(--h2)" stroke-width="2" opacity=".25"/>'+
   '<rect x="218" y="72" width="48" height="26" rx="10" fill="var(--card)" stroke="var(--ink)" stroke-width="2"/><path d="M228 98l-4 10 12-10" fill="var(--card)" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/><path d="M227 82h30M227 89h20" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/>'+
   '<text x="242" y="160" text-anchor="middle" font-size="11" font-weight="700" fill="var(--h2)">show what follows</text>'+
   '</svg>'+
   '<div class="so-2c"><p><b>1 · LONG GAME</b>Put long-term interests over quick gains. Trust only grows over many dealings.</p><p><b>2 · ARGUMENTS</b>Win people over by showing the good effects that follow.</p></div>'+

{part:2,src:'Second-Order Thinking · Prioritizing Long-Term Interests',
 solve:async L=>{while(L.$('#cn'))L.$('#cn').click();},
 run(L){
  const ST=[[0,'48 BC','Cleopatra is co-ruler of Egypt with her brother, but pushed out of the palace, short of support and a target for assassination.'],
   [.2,'Options','Make peace with her brother? Seek help from another country? Or side with Caesar, the Roman general who has just arrived?'],
   [.31,'Choice','She sides with Caesar. She likely foresaw the first-order effects: a furious brother, and Egyptians angry at Roman meddling.'],
   [.5,'Pain','The short-term pain came: civil war, months trapped in a besieged palace, constant plots against her life.'],
   [.98,'Gain','Then the effects of the effects: Caesar’s victory cleared away her main opponents, and she ruled Egypt successfully for many years.']];
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">Cleopatra’s hard choice in 48 BC. Follow her road.</h1>'+
   '<svg class="so-svg" id="csv" viewBox="0 0 320 176" role="img" aria-label="A road that dips into a valley of short-term pain, then climbs to long-term gain">'+
   '<rect width="320" height="176" rx="14" fill="var(--soft)"/>'+
   '<rect x="86" y="72" width="140" height="94" rx="10" fill="var(--no-bg)"/><text x="94" y="160" font-size="11" font-weight="700" fill="var(--no)">short-term pain</text>'+
   '<rect x="228" y="6" width="86" height="66" rx="10" fill="var(--ok-bg)"/><text x="310" y="66" text-anchor="end" font-size="11" font-weight="700" fill="var(--ok)">long-term gain</text>'+
   '<path d="M8 72H312" stroke="var(--line2)" stroke-dasharray="4 4"/><text x="10" y="88" font-size="11" fill="var(--muted)">start level</text>'+
   '<path id="cpath" d="M14 66C50 66 70 66 92 74C122 86 120 140 156 140C192 140 200 52 240 40S296 30 306 28" fill="none" stroke="var(--ink)" stroke-width="3.5" stroke-linecap="round"/>'+
   '<g id="cstops"></g><circle id="cdot" r="9" fill="var(--pri)" stroke="var(--card)" stroke-width="3"/></svg>'+
   '<div class="so-say" id="csay" aria-live="polite"></div><div class="so-ctl"><button class="btn pri" id="cn">'+L.ic('arrow')+'Next</button></div>');
  const p=L.$('#cpath'),len=p.getTotalLength();let k=0;
  const LO=[[8,-12,'middle'],[0,-12,'middle'],[-11,4,'end'],[12,4,'start'],[-6,-13,'middle']];
  L.$('#cstops').innerHTML=ST.map((s,j)=>{const q=p.getPointAtLength(len*s[0]),o=LO[j];return '<circle cx="'+q.x.toFixed(1)+'" cy="'+q.y.toFixed(1)+'" r="4" fill="var(--ink)"/><text x="'+(q.x+o[0]).toFixed(1)+'" y="'+(q.y+o[1]).toFixed(1)+'" text-anchor="'+o[2]+'" font-size="11" font-weight="700" fill="var(--muted)">'+s[1]+'</text>';}).join('');
  const show=()=>{const q=p.getPointAtLength(len*ST[k][0]);L.$('#cdot').setAttribute('cx',q.x);L.$('#cdot').setAttribute('cy',q.y);
    L.$('#csay').innerHTML='<b>'+(k+1)+' OF 5 · '+ST[k][1].toUpperCase()+'</b>'+ST[k][2];};
  show();
  L.$('#cn').onclick=()=>{k++;show();if(k===ST.length-1){L.$('#cn').remove();
    L.sheet('info','Short-term pain, long-term support','We can only guess at her reasoning. The book is careful here: don’t judge thinking by the outcome alone, as if a good ending proves the choice was well thought through. Even when you glimpse a long-term gain, nothing guarantees you’ll get there.');L.done();}};}},

{part:2,src:'Second-Order Thinking · Developing Trust for Future Success',
 solve:async L=>{L.tank.next();L.tank.next();},
 run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">Mary Wollstonecraft didn’t just argue women deserved rights. She showed what would follow.</h1>'+
   '<p class="small" style="margin:0">Late-1700s England gave women few rights. Tap “And then what?” to build her case the way she did.</p><div id="tk"></div>');
  let fin=false;
  L.tank=soTank(L,L.$('#tk'),{stones:[SO_WOLL],auto:true,onChange(e,t){if(!fin&&t.ring===3){fin=true;
    L.sheet('info','The ripples did the persuading','Empowering women was the first-order effect. Her case rested on the second-order effects: women better able to support themselves and raise children well, and a stronger society. The book: arguments land better when you show you’ve weighed the effects of the effects, and that they’re good too.');L.done();}}});}},

{part:2,src:'Second-Order Thinking · Developing Trust for Future Success',pts:1,
 solve:async L=>{L.$('#tp').children[1].click();L.$('#tpl').click();},
 run(L){
  L.h(L.kick('try','Predict, then watch')+'<h1 class="q">A client rings Ira: can Harrow & Finch rush a big order by Friday? The floor is already full. Which answer leaves the company better off after six rounds of orders?</h1>'+
   '<div class="so-chips" id="tp"></div><div class="so-ctl"><button class="btn pri" id="tpl" hidden>'+L.ic('play')+'Play six rounds</button></div>'+
   '<svg class="so-svg" id="tsv" viewBox="0 0 320 160" role="img" aria-label="Six rounds of orders from the same client, for each answer"></svg><p class="so-ro" id="tro" aria-live="polite"></p>');
  const A=['Yes now, without checking with the floor','Check with the floor, then give an honest date'];
  const ROW=[{lab:['Yes now'],y:22,v:[5,'late',0,0,0,0]},{lab:['Honest','date'],y:92,v:[3,3,3,3,3,3]}];
  let pick=null,shown=0;
  function draw(){let s='<rect width="320" height="160" rx="14" fill="var(--soft)"/>';
    for(let r=0;r<6;r++)s+='<text x="'+(97+r*39)+'" y="14" text-anchor="middle" font-size="11" font-weight="700" fill="var(--muted)">R'+(r+1)+'</text>';
    ROW.forEach((R,i)=>{R.lab.forEach((t,q)=>s+='<text x="10" y="'+(R.y+30+q*14-(R.lab.length-1)*7)+'" font-size="12" font-weight="700" fill="var(--ink)">'+t+'</text>');
      let gone=false;
      for(let r=0;r<6;r++){const x=78+r*39,v=R.v[r],on=r<shown;if(v==='late')gone=true;
        const here=on&&typeof v==='number'&&v>0,lost=on&&!here;
        s+='<rect x="'+x+'" y="'+R.y+'" width="36" height="62" rx="9" fill="var('+(here?'--card':'--soft2')+')" stroke="var('+(here?'--ok-line':'--line')+')" stroke-width="1.5"/>';
        if(on){const cx=x+18,col=here?'var(--h1)':'var(--faint)',fl=here?'var(--h1-bg)':'none';
          s+='<g'+(here?'':' stroke-dasharray="3 2" opacity=".7"')+'><circle cx="'+cx+'" cy="'+(R.y+15)+'" r="6.5" fill="var(--card)" stroke="'+col+'" stroke-width="1.8"/><rect x="'+(cx-8)+'" y="'+(R.y+23)+'" width="16" height="17" rx="6" fill="'+fl+'" stroke="'+col+'" stroke-width="1.8"/></g>';
          s+='<text x="'+cx+'" y="'+(R.y+55)+'" text-anchor="middle" font-size="11.5" font-weight="700" fill="var('+(here?'--ok':v==='late'?'--no':'--faint')+')">'+(here?'+'+v:v==='late'?'late':'—')+'</text>';}}});
    L.$('#tsv').innerHTML=s;
    const tot=R=>R.v.slice(0,shown).reduce((a,b)=>a+(typeof b==='number'?b:0),0);
    L.$('#tro').innerHTML=shown?'Work won so far: Yes now <b>'+tot(ROW[0])+'</b> · Honest date <b>'+tot(ROW[1])+'</b> <span class="small">(made-up units for this course)</span>':'';}
  draw();
  A.forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=n;b.onclick=()=>{if(shown)return;pick=j;[...L.$('#tp').children].forEach((x,q)=>x.classList.toggle('sel',q===j));L.$('#tpl').hidden=false;};L.$('#tp').appendChild(b);});
  L.$('#tpl').onclick=function(){this.remove();[...L.$('#tp').children].forEach(x=>x.disabled=true);
    const t=()=>{if(!L.$('#tsv')||!L.$('#tsv').isConnected)return;shown++;draw();if(shown<6){setTimeout(t,300);return;}
      const ok=pick===1;L.award(ok);
      L.sheet(ok?'ok':'no',ok?'Trust paid every round':'The quick yes was a one-off','<b>This course’s made-up example:</b> the rush “yes” won 5 in round one. Then the floor couldn’t deliver, the order was late, and the client didn’t call again. The honest date won less at first, but 18 over six rounds. <b>The book’s point:</b> trust comes from many dealings, and grabbing the immediate payoff, unless both sides win, almost always makes it a one-off.');L.done();};
    t();};}},

{part:2,src:'Second-Order Thinking · Developing Trust for Future Success',pts:1,
 solve:async L=>{L.$$('#cp .so-cd').filter(b=>+b.dataset.j<3).forEach(b=>b.click());L.$('#cck').click();},
 run(L){
  const POOL=[['Fewer orders lost in the switch, so the on-time rate holds',1,1,'on-time rate'],
   ['Less overtime fixing mistakes after go-live',1,1,'overtime'],
   ['The two unhappy clients see fewer late orders, and stay',2,1,'client trust'],
   ['Ira gets a calmer fortnight',1,0,'Ira'],
   ['Training will make every problem disappear for good',2,0,'?'],
   ['The screens look nicer once people know them',1,0,'staff'],
   ['The software invoice moves into next quarter',2,0,'vendor']];
  const ORD=[3,0,5,2,4,1,6];
  L.h(L.kick('pr','Challenge · build Ira’s argument')+'<h1 class="q">Ira wants Pella to delay go-live by two weeks to train staff. Pick the three effects that will matter most to Pella.</h1>'+
   '<p class="small" style="margin:0">Pella cares about the on-time rate, overtime and keeping clients. The honest cost is already in ring 1.</p><div id="ctk"></div>'+
   '<div class="so-rh">Effects you can add (pick 3)</div><div id="cp"></div><button class="btn pri" id="cck" disabled style="margin-top:6px">'+L.ic('check')+'Make the case to Pella</button><div id="cf"></div>');
  const ST={lab:'Delay go-live two weeks; train staff first',goal:'Pella’s: orders on time, clients who stay',rings:[[['Go-live slips two weeks past the date',-1,'Pella'],['Staff learn the system before it counts',1,'floor']],[],[]]};
  const t=soTank(L,L.$('#ctk'),{stones:[ST],noNext:true});t.drop(ST);t.show(1);
  const sel=new Set();let first=true,fin=false;
  function sync(){ST.rings[1]=[];ST.rings[2]=[];[...sel].sort((a,b)=>a-b).forEach(j=>{const p=POOL[j];ST.rings[p[1]].push([p[0],p[2],p[3]]);});
    t.show(sel.size?(ST.rings[2].length?3:2):1);L.$('#cck').disabled=sel.size!==3||fin;}
  ORD.forEach(j=>{const b=document.createElement('button');b.className='so-cd';b.dataset.j=j;b.innerHTML='<i>+</i><span>'+POOL[j][0]+'</span>';
    b.onclick=()=>{if(fin)return;if(sel.has(j))sel.delete(j);else{if(sel.size>=3){L.shake(b);return;}sel.add(j);}
      b.classList.toggle('up',sel.has(j));b.querySelector('i').textContent=sel.has(j)?'✓':'+';L.$('#cf').innerHTML='';sync();};
    L.$('#cp').appendChild(b);});
  L.$('#cck').onclick=()=>{const ok=[...sel].every(j=>POOL[j][2]>0);if(first){L.award(ok);first=false;}
    if(ok){fin=true;L.$('#cck').disabled=true;L.sheet('ok','Pella hears the ripples','The arrow now points straight at Pella’s goal. Like Wollstonecraft, Ira argues from the effects that follow, in the terms Pella cares about, and admits the cost up front.');L.done();}
    else{const bad=[...sel].filter(j=>POOL[j][2]<=0).map(j=>POOL[j][0]);L.fb(L.$('#cf'),'<b>Pella isn’t moved yet.</b> “'+bad.join('”, “')+'” '+(bad.length>1?'don’t':'doesn’t')+' touch Pella’s goal'+(bad.some(x=>x.includes('for good'))?', and a far-fetched promise weakens the whole case':'')+'. Swap and try again.','no');}};}},

{part:2,src:'Second-Order Thinking · Prioritizing Long-Term Interests',pts:6,run(L){
  L.h(L.kick('pr','Which way does the pain run?')+'<h1 class="q">Sort Ira’s choices: gain now and pain later, or pain now and gain later?</h1>');
  L.buckets(L.card,['Gain now, pain later','Pain now, gain later'],[
   ['Agree to every rush job to keep clients happy today',0,'Happy today; late nights, slipping orders and lost trust later.'],
   ['Spend a weekend fitting handrails and an alarm at Wynn’s',1,'A lost weekend now; a safer home for Wynn later.'],
   ['Tell a client the honest date, even though they grumble',1,'A grumble now; a client who trusts Ira’s dates later.'],
   ['Put the car repair on a high-interest card',0,'The car runs tomorrow; the interest piles up for months.'],
   ['Run a dull training day before go-live',1,'A slow day now; fewer mistakes after go-live.'],
   ['Have a late coffee to get through the afternoon',0,'Alert now; a bad night and a tired tomorrow.']],
   'The book’s question: how often is a short-term gain worth long, drawn-out pain? Delaying gratification now saves you cleaning up the mess later.');}},

{part:3,src:'Course application · built on Second-Order Thinking',pts:1,
 solve:async L=>{L.$('#ob').click();L.$('#ob').click();L.$('#ob').click();L.$$('#omt button.so-cd').filter(b=>b.dataset.f==='far').forEach(b=>b.click());L.$('#oq').children[1].click();},
 run(L){
  L.h(L.kick('pr','One-minute move')+'<h1 class="q">Bram asks Ira to promise another rush job. Run the move.</h1>'+
   L.note('How this course applies the book: a one-minute routine built only from the chapter’s own steps.','compass')+
   '<div class="so-rh">Reach for it when…</div>'+
   '<svg class="so-svg" viewBox="0 0 320 92" role="img" aria-label="Three cues: a quick fix looks great right now; you will deal with the same person again; you need to persuade someone">'+
   '<rect x="0" y="0" width="102" height="92" rx="12" fill="var(--soft)"/><rect x="109" y="0" width="102" height="92" rx="12" fill="var(--soft)"/><rect x="218" y="0" width="102" height="92" rx="12" fill="var(--soft)"/>'+
   '<path d="M14 46C24 46 28 16 40 14S50 22 56 28" fill="none" stroke="var(--ok-strong)" stroke-width="3" stroke-linecap="round"/><path d="M56 28C66 38 74 50 88 52" fill="none" stroke="var(--faint)" stroke-width="2.5" stroke-dasharray="3 4" stroke-linecap="round"/><text x="80" y="40" text-anchor="middle" font-size="13" font-weight="700" fill="var(--muted)">?</text>'+
   '<text x="51" y="70" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink)">a quick fix</text><text x="51" y="83" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink)">looks great</text>'+
   '<circle cx="140" cy="18" r="6" fill="var(--card)" stroke="var(--h1)" stroke-width="1.8"/><rect x="132" y="26" width="16" height="17" rx="6" fill="var(--h1-bg)" stroke="var(--h1)" stroke-width="1.8"/>'+
   '<circle cx="180" cy="18" r="6" fill="var(--card)" stroke="var(--h2)" stroke-width="1.8"/><rect x="172" y="26" width="16" height="17" rx="6" fill="var(--h2-bg)" stroke="var(--h2)" stroke-width="1.8"/>'+
   '<path d="M152 22Q160 12 168 22" fill="none" stroke="var(--pri)" stroke-width="2" stroke-linecap="round"/><path d="M165 17l3 5-6 1" fill="none" stroke="var(--pri)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'+
   '<path d="M168 40Q160 50 152 40" fill="none" stroke="var(--pri)" stroke-width="2" stroke-linecap="round"/><path d="M155 45l-3-5 6-1" fill="none" stroke="var(--pri)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'+
   '<text x="160" y="70" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink)">you’ll see</text><text x="160" y="83" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink)">them again</text>'+
   '<circle cx="269" cy="28" r="17" fill="none" stroke="var(--h2)" stroke-width="1.8" opacity=".6"/><circle cx="269" cy="28" r="24" fill="none" stroke="var(--h2)" stroke-width="1.8" opacity=".3"/>'+
   '<rect x="256" y="19" width="26" height="15" rx="6" fill="var(--card)" stroke="var(--ink)" stroke-width="1.8"/><path d="M261 34l-2 6 7-6" fill="var(--card)" stroke="var(--ink)" stroke-width="1.8" stroke-linejoin="round"/><path d="M261 25h16M261 29h10" stroke="var(--ink)" stroke-width="1.5" stroke-linecap="round"/>'+
   '<text x="269" y="70" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink)">you need to</text><text x="269" y="83" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink)">persuade</text>'+
   '</svg>'+
   '<div class="so-steps" id="osp"><span>1 · Immediate result</span><span>2 · Then what? ×2</span><span>3 · Likely only</span><span>4 · Toward or away?</span></div>'+
   '<div class="so-say" id="osay" aria-live="polite"></div><div class="so-ctl"><button class="btn pri" id="ob"></button></div><div id="oq"></div><div id="omt"></div>');
  let s=0,fin=false;
  const t=soTank(L,L.$('#omt'),{stones:[SO_RUSH],noNext:true,noArrow:true,onCard(c,k,b){if(s!==2||t.struck.has(k))return;
    if(c[3]==='far'){t.strike(k);if(['1:2','2:2'].every(x=>t.struck.has(x)))go(3);}
    else{b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');L.$('#osay').innerHTML='<b>STEP 3 · LIKELY ONLY</b>That one is likely: it has happened before. Keep it. Tap the far-fetched ones.';}}});
  const say=(h,x)=>L.$('#osay').innerHTML='<b>'+h+'</b>'+x;
  function go(n){s=n;L.$$('#osp span').forEach((p,j)=>{p.className=j<n?'dn':j===n?'cur':'';});
    const b=L.$('#ob');
    if(n===0){say('STEP 1 · IMMEDIATE RESULT','What happens right away if Ira says yes?');b.innerHTML=L.ic('play')+'Drop the stone';}
    if(n===1){say('STEP 2 · THEN WHAT? TWICE','Ask it for Ira, for others and for trust.');b.innerHTML=L.ic('arrow')+'And then what?';}
    if(n===2){b.parentNode.hidden=true;say('STEP 3 · LIKELY ONLY','Two of these effects are far-fetched. Tap them to set them aside.');}
    if(n===3){say('STEP 4 · TOWARD OR AWAY?','With only the likely effects left: does saying yes move Ira toward “clients who keep coming back”, or away?');
      ['Toward the goal','Away from the goal'].forEach((o,j)=>{const x=document.createElement('button');x.className='opt';x.textContent=o;x.onclick=()=>{if(fin)return;fin=true;const ok=j===1;L.award(ok);x.classList.add(ok?'ok':'no');
        t.showArrow();L.$$('#osp span').forEach(p=>p.className='dn');
        L.sheet(ok?'ok':'no',ok?'Away: a quick win, a slow loss':'Look at the arrow','Two greens right away, four reds after. The far-fetched effects didn’t change the answer, but leaving them in would have made it feel like a disaster rather than a pattern. So Ira says: “Let me check with the floor and call you back with a date.”');L.done();};L.$('#oq').appendChild(x);});}}
  L.$('#ob').onclick=()=>{if(s===0){t.drop(SO_RUSH);go(1);}else if(s===1){t.next();if(t.ring===3)go(2);}};
  go(0);}},

{part:3,src:'Second-Order Thinking · A Word of Caution',pts:6,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Likely, or far-fetched?',['Likely: weigh it','Far-fetched: set it aside'],[
   ['Ira drinks a late coffee → Ira sleeps worse tonight.',0,'Caffeine late in the day often means a worse night. A typical effect: weigh it.'],
   ['Ira drinks a late coffee → Ira loses the job by spring.',1,'A long chain where every link must happen. That’s the slippery slope the book warns about.'],

{part:3,src:'Second-Order Thinking · A Word of Caution',
 solve:async L=>{L.$$('#lp button').forEach(b=>b.click());},
 run(L){
  const PR=[['Cobra bounty',SO_COBRA,'likely','The fix fed the problem. Officials in colonial Delhi paid for dead cobras, so people bred cobras, and there were more snakes than before. You can’t delete the consequences to get back to the start.'],
   ['Slippery slope',SO_COFFEE,'all','Every possible effect floods the pond, so the decision button is dead. The book: a first drink <i>might</i> lead to addiction, but not most of the time. Garrett Hardin noted that by this logic we’d ban every vehicle from moving faster than zero.'],
   ['Not a crystal ball',SO_BLIND,'likely','Nobody could have known the software company would fail. Second-order thinking only sees likely effects from what you know: it isn’t prediction. That’s no excuse to skip it, though: the book says antibiotic resistance could have been foreseen.'],
   ['Good outcome, bad thinking',SO_LUCK,'likely','It worked, by luck: the floor happened to have a quiet week. The likely ring 2 was another late night. A good outcome doesn’t prove the thinking was good.']];
  L.h(L.kick('ex','Edge cases and limits')+'<h1 class="q">Where does second-order thinking stop helping? Try each case.</h1>'+
   '<div class="so-chips" id="lp"></div><div id="ltk"></div><div class="so-ctl"><button class="btn pri" id="ldc" disabled>'+L.ic('check')+'Decide</button></div><div id="lf"></div>');
  const seen=new Set();let fin=false,cur=null;
  const t=soTank(L,L.$('#ltk'),{stones:PR.map(p=>p[1]),noChips:true,noNext:true,modes:true,keepMode:true,onChange(e,tk){if(e==='mode')upd();}});
  function upd(){const b=L.$('#ldc');b.disabled=!cur||t.mode==='all';b.innerHTML=L.ic('check')+(t.mode==='all'?'Too many effects to decide':'Decide');}
  PR.forEach((p,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=p[0];b.onclick=()=>{cur=p;[...L.$('#lp').children].forEach((x,q)=>x.classList.toggle('sel',q===j));
    t.setMode(p[2]);t.drop(p[1]);t.show(p[1].rings.length);upd();L.$('#lf').innerHTML='';L.fb(L.$('#lf'),p[3],'info');seen.add(j);
    if(!fin&&seen.size===PR.length){fin=true;L.sheet('info','Weigh the typical effects, case by case','Second-order thinking can’t predict the future, can’t be judged by one lucky result, and can’t weigh every possible effect, or you’d never act. The book: weigh the effects that are most probable, and what those most probably lead to, case by case.');L.done();}};L.$('#lp').appendChild(b);});
  L.$('#ldc').onclick=()=>{if(!cur)return;L.$('#lf').innerHTML='';L.fb(L.$('#lf'),cur[1].decide||('Net '+soFmt(t.net)+': '+soDir(t.net)+'. With only likely effects on the table, a decision is possible.'),t.net<0?'no':'ok');};}},

{part:3,src:'Second-Order Thinking · A Word of Caution',pts:1,run(L){
  L.h(L.kick('pr','The slippery slope')+'<h1 class="q">Pella pushes back: “If we delay go-live two weeks, next it’ll be a month, and the system never launches.” What does the book’s caution suggest Ira do?</h1>');
  L.mc(L.card,['Agree: every delay leads to a longer one','Ask how likely that chain really is, and weigh the typical result','Stop looking past the first effect, so the worry goes away'],1,
   'That’s the book’s balance. A longer delay is possible, but not the typical result. Weigh the most likely effects, not the scariest chain, or you’d never act.',
   'The book warns against the slippery slope: treating one step as an unstoppable slide. It also doesn’t say to drop second-order thinking. Weigh the most likely effects, case by case.');}},

{part:3,src:'Course application · built on Second-Order Thinking',
 solve:async L=>{L.$('#yc').children[1].click();L.$('#y1').value='I get home 20 minutes earlier';L.$('#y2').value='I rush the checks and redo work later';L.$('#y3').value='My team stops trusting my sign-offs';
   ['#y1','#y2','#y3'].forEach(s=>L.$(s).dispatchEvent(new Event('input',{bubbles:true})));L.$('#yd').children[1].click();L.$('#yb').click();},
 run(L){
  L.h(L.kick('pr','Your turn · ungraded')+'<h1 class="q">One quick fix you’re tempted by this week. Drop it in your own pond.</h1>'+
   L.note('How this course applies the book: the one-minute move on your own decision.','compass')+
   '<span class="so-fl">THE QUICK FIX</span><div class="so-chips" id="yc"></div>'+
   '<label class="so-fl" for="y1">1 · RIGHT AWAY, WHAT DO I GET?</label><input class="so-in" id="y1" maxlength="80" placeholder="e.g. a new phone today">'+
   '<label class="so-fl" for="y2">2 · AND THEN WHAT? FOR ME</label><input class="so-in" id="y2" maxlength="80" placeholder="e.g. a bigger bill each month">'+
   '<label class="so-fl" for="y3">3 · AND THEN WHAT? FOR OTHERS OR TRUST</label><input class="so-in" id="y3" maxlength="80" placeholder="e.g. less to spend on the trip we planned">'+
   '<span class="so-fl">4 · THOSE LATER EFFECTS MOVE ME…</span><div class="so-chips" id="yd"></div>'+
   '<div class="so-ctl"><button class="btn pri" id="yb" disabled>'+L.ic('play')+'Drop it in the pond</button></div><div id="ytk"></div>');
  let fix=null,dir=null;
  ['A buy-now, pay-later purchase','A shortcut at work','A treat or late coffee','Saying yes to a favour'].forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=n;b.onclick=()=>{fix=n;[...L.$('#yc').children].forEach((x,q)=>x.classList.toggle('sel',q===j));chk();};L.$('#yc').appendChild(b);});
  ['Toward my goal','Away from my goal'].forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=n;b.onclick=()=>{dir=j;[...L.$('#yd').children].forEach((x,q)=>x.classList.toggle('sel',q===j));chk();};L.$('#yd').appendChild(b);});
  const v=s=>L.$(s).value.trim();
  function chk(){L.$('#yb').disabled=!(fix&&v('#y1').length>1&&v('#y2').length>1&&dir!==null);}
  ['#y1','#y2','#y3'].forEach(s=>L.$(s).addEventListener('input',chk));
  L.$('#yb').onclick=()=>{const e=s=>L.esc(v(s));const w=dir===0?2:-2;
    const ST={lab:fix,goal:'Your own goal',rings:[[[e('#y1'),1,'right away']],[[e('#y2'),w,'you']].concat(v('#y3')?[[e('#y3'),w,'others']]:[])]};
    L.$('#ytk').innerHTML='';const t=soTank(L,L.$('#ytk'),{stones:[ST],noNext:true});t.drop(ST);t.show(2);
    L.sheet('info',dir===1?'Pointing away: pause before you take it':'Pointing toward: go ahead','Write it down as one line in your decision journal. '+(dir===1?'An arrow pointing away is the cue to look for a choice whose effects lead toward your goal.':'You’ve checked the likely effects you can see. That’s enough for a small choice.')+' Later, note what actually happened.');L.done();};}},

{part:3,src:'Course application · built on Second-Order Thinking',run(L){
  L.h(L.kick('learn','Your decision map')+'<h1 class="q">Second-order thinking joins four rows of the map</h1>'+
   L.note('How this course applies the book. Lessons 7–10 fill the dashed gaps.','compass')+
   '<div id="dm"></div>'+
   '<p class="small">It’s the <b>first</b> lens for a tempting quick fix. On three other rows it comes later, as the check that protects trust and long-term goals.</p>'+
   '<div class="so-dm" style="border-style:dashed"><b>Also: I need to persuade someone</b><div class="r"><span class="m cur">Second-order</span><span class="ar">→</span><span class="m">show what follows</span></div></div>'+
   '<p class="small" style="margin-top:2px">Not a map row, but the book’s second use: before you ask for a yes, run “And then what?” on your idea, as Wollstonecraft and Ira did.</p>');
  L.$('#dm').innerHTML=SO_ROWS.map(r=>'<div class="so-dm'+(r[1][0]==='second'?' hot':'')+'"><b>'+r[0]+(r[1][0]==='second'?' · start here':'')+'</b><div class="r">'+
    r[1].map((k,j)=>(j?'<span class="ar">→</span>':'')+'<span class="m'+(k==='second'?' cur':SO_M[k][1]>6?' tbd':'')+'">'+(SO_M[k][1]>6?'?':SO_M[k][0])+'</span>').join('')+'</div></div>').join('');
  L.done();}}
  ]
});
</script>
</body>
</html>
