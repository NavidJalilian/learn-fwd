<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Occam’s Razor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
/* ===== This lesson's own visuals: the series light-string (an explanation as bulbs wired in
   one loop: every bulb is a moving part that must be true), the razor on the explanation
   tangle (branches with a facts checklist), plus the iceberg, the sunflower, the galaxy,
   the reservoir and the tiger's view. ===== */
(function(){const st=document.createElement('style');st.textContent=`
.card button[hidden],.oc-ctl[hidden]{display:none!important}
.oc-svg{display:block;width:100%;max-width:330px;margin:0 auto}
.oc-ro{font-size:14px;text-align:center;color:var(--muted);margin:4px 0 6px;min-height:20px;line-height:1.45}
.oc-ro b{color:var(--ink)}
.oc-ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;margin:6px 0}
.oc-ctl .chip{margin:0}
.oc-lab{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.3px;text-transform:uppercase;display:block;margin:8px 0 4px}
.oc-sl{display:block;margin:2px 0 0}
.oc-sl .h{display:flex;justify-content:space-between;font-size:14px;gap:8px}
.oc-sl input{width:100%;height:34px;margin:0;accent-color:var(--pri)}
.oc-tt{font-size:13px;font-weight:700;color:var(--ink);margin:8px 0 0;text-align:center}
.oc-trim{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:4px 0}
.oc-trim .chip{margin:0;min-height:38px;font-size:13.5px}
.oc-trim .chip.off{background:var(--soft);color:var(--muted)}
.oc-trim .chip.off span{text-decoration:line-through}
.oc-chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.oc-chips .chip{margin:0}
.oc-say{background:var(--soft);border-radius:14px;padding:10px 13px;font-size:15px;line-height:1.5;margin:8px 0}
.oc-say b.k{display:block;font-size:11.5px;letter-spacing:.4px;color:var(--muted);margin-bottom:2px}
.oc-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:4px 0 6px}
.oc-steps span{font-size:11.5px;line-height:1.25;font-weight:600;text-align:center;border-radius:10px;padding:6px 3px;background:var(--soft);color:var(--muted);border:1.5px solid transparent}
.oc-steps span.cur{background:var(--pri-bg);color:var(--pri-deep);border-color:var(--pri)}
.oc-steps span.dn{background:var(--ok-bg);color:var(--ok)}
.oc-in{display:block;width:100%;box-sizing:border-box;border:2px solid var(--line);border-radius:12px;padding:9px 11px;font:inherit;font-size:15px;background:var(--card);color:var(--ink);margin:2px 0 6px}
.oc-in:focus{outline:none;border-color:var(--pri)}
/* the tangle */
.oc-fx{display:flex;flex-direction:column;gap:4px;margin:0 0 8px}
.oc-f{display:flex;align-items:center;gap:8px;font-size:14px;line-height:1.3;border-radius:10px;padding:5px 8px;background:var(--ok-bg);border:1.5px solid var(--ok-line);transition:background .25s,border-color .25s}
.oc-f.no{background:var(--no-bg);border-color:var(--no-line)}
.oc-f i{font-style:normal;flex:none;width:22px;height:22px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--card)}
.oc-f span{flex:1;color:var(--ink)}
.oc-f em{font-style:normal;font-size:11.5px;font-weight:700;white-space:nowrap;color:var(--ok)}
.oc-f.no em{color:var(--no)}
.oc-root{font-size:12px;font-weight:700;letter-spacing:.3px;color:var(--h2);text-transform:uppercase;display:flex;align-items:center;gap:6px;margin:2px 0 2px}
.oc-root svg{width:16px;height:16px;flex:none}
.oc-brs{border-left:5px solid var(--h2);border-radius:0 0 0 8px;margin-left:6px}
.oc-br{position:relative;display:block;width:100%;text-align:left;background:none;border:0;padding:6px 0 4px;margin:0;font-family:inherit;color:var(--ink);cursor:pointer;overflow:hidden;min-height:44px;border-radius:0 10px 10px 0}
.oc-br:hover{background:var(--soft)}
.oc-br .bl{display:block;font-size:14px;font-weight:600;padding-left:8px;line-height:1.3}
.oc-br .bl em{font-style:normal;font-weight:700;font-size:11.5px;color:var(--muted);margin-left:6px;white-space:nowrap}
.oc-br .pl{display:block;font-size:12.5px;color:var(--muted);padding-left:8px;line-height:1.35;margin-top:1px}
.oc-br>svg.br{display:block;width:100%;max-width:290px;height:auto}
.oc-br.cut .bl b{text-decoration:line-through;color:var(--faint)}
.oc-br.cut>svg.br{opacity:.3}
.oc-br.keep .bl b{color:var(--ok)}
.oc-br .cutnote{display:block;font-size:11.5px;font-weight:700;color:var(--muted);padding-left:8px}
.oc-br .cutnote:empty{display:none}
.oc-blade{position:absolute;left:-44px;bottom:6px;width:36px;height:22px;opacity:0;pointer-events:none}
.oc-br.slice .oc-blade{animation:ocslice .5s ease-out}
@keyframes ocslice{0%{opacity:1;left:-44px}85%{opacity:1}100%{opacity:0;left:100%}}
.oc-br:focus-visible{outline:2px solid var(--pri);outline-offset:-2px}
.oc-br.shake{animation:ocshake .3s}
@keyframes ocshake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
/* pictures */
.oc-deep{transform-origin:158px 70px;transition:transform .6s ease}
.oc-fade{transition:opacity .5s}
.oc-orb{transform-origin:160px 98px;animation:ocspin linear infinite}
@keyframes ocspin{to{transform:rotate(360deg)}}
.oc-rz .lg{transition:opacity .7s}
.oc-rz.trim .lg{opacity:.18}
.oc-rz .rzr{transition:transform .9s ease}
.oc-rz.trim .rzr{transform:translate(0,44px)}
.oc-rz .win{transition:opacity .5s;opacity:0}
.oc-rz.trim .win{opacity:1}
.oc-plane{transition:transform .7s ease;transform-origin:160px 40px}
.oc-tiger{transition:transform .8s ease}
.oc-dm{border:1.5px solid var(--line);border-radius:14px;padding:8px 10px;margin:0 0 6px;background:var(--card)}
.oc-dm.hot{border-color:var(--pri);background:var(--pri-bg)}
.oc-dm>b{display:block;font-size:13.5px;margin-bottom:5px}
.oc-dm .r{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.oc-dm .m{font-size:12px;font-weight:600;border-radius:8px;padding:3px 7px;background:var(--soft2);color:var(--ink);border:1.5px solid transparent}
.oc-dm .m.cur{background:var(--pri);color:var(--pri-ink)}
.oc-dm .m.tbd{background:transparent;border:1.5px dashed var(--line2);color:var(--faint)}
.oc-dm .ar{color:var(--faint);font-size:12px}
@media (prefers-reduced-motion:reduce){.oc-orb{animation:none}}
`;document.head.appendChild(st);})();

const ocPct=v=>{const x=v*100;return (x<9.95?x.toFixed(1):String(Math.round(x)))+'%';};
const ocWrap=(s,m)=>{const out=[];let cur='';s.split(' ').forEach(x=>{if(cur&&(cur+' '+x).length>m){out.push(cur);cur=x;}else cur=cur?cur+' '+x:x;});if(cur)out.push(cur);return out;};

/* ---------- signature 1: the series light-string ----------
   An explanation drawn as bulbs wired in ONE loop. Each bulb is a moving part that must be
   true; if any one fails, the whole string goes dark. o: {n, p, sliders, test, labels, need,
   flags ('q' = never-seen part), trim, title, ro(api), onChange(ev, api)} */
function ocString(L,host,o){
  o=Object.assign({n:3,p:.99,maxN:40},o||{});
  let n=o.n,p=o.p,fail=-1,busy=false,tally=null;const off=new Set();
  const lab=o.labels||null,need=o.need||null,flags=o.flags||[];
  const rowsMax=lab?1:Math.ceil((o.sliders?o.maxN:n)/10);
  const wch=dx=>Math.max(9,Math.min(15,Math.floor(dx/6.6)));
  const lines=lab?Math.max(...lab.map(t=>ocWrap(t,wch(lab.length>1?Math.min(100,198/(lab.length-1)):130)).length)):0;
  const H=lab?(76+lines*13):(rowsMax*34+44);
  const w=document.createElement('div');w.className='oc-str';host.appendChild(w);
  w.innerHTML=(o.title?'<div class="oc-tt">'+o.title+'</div>':'')+
   (o.sliders?'<label class="oc-sl"><span class="h"><span>Moving parts (all must be true)</span><b class="vn"></b></span><input type="range" class="sn" min="1" max="'+o.maxN+'" step="1" value="'+n+'" aria-label="Moving parts, 1 to '+o.maxN+'"></label>'+
    '<label class="oc-sl"><span class="h"><span>Chance each part is right</span><b class="vp"></b></span><input type="range" class="sp" min="900" max="999" step="1" value="'+Math.round(p*1000)+'" aria-label="Chance each part is right, 90 to 99.9 percent"></label>':'')+
   '<svg class="oc-svg" viewBox="0 0 320 '+H+'" role="img" aria-label="'+(o.aria||'An explanation drawn as bulbs wired in one loop. Each bulb is a part that must be true; if one fails, all go dark.')+'"></svg>'+
   (o.noRo?'':'<p class="oc-ro" aria-live="polite"></p>')+
   (o.trim&&lab?'<div class="oc-trim"></div>':'')+
   (o.test?'<div class="oc-ctl"><button class="btn pri oc-tb">'+L.ic('play')+'Test it 100 times</button></div>':'');
  const $=s=>w.querySelector(s),svg=$('svg');
  const ids=()=>lab?lab.map((_,k)=>k).filter(k=>!off.has(k)||(need&&need[k])):Array.from({length:n},(_,k)=>k);
  const gaps=()=>lab?[...off].filter(k=>need&&need[k]):[];
  const count=()=>lab?lab.length-off.size:n;
  function pos(){const I=ids(),m=I.length;
    if(lab){const dx=m>1?Math.min(100,198/(m-1)):0,x0=64+(198-(m-1)*dx)/2;return I.map((k,j)=>({k,j,x:x0+j*dx,y:48,dx:dx||130}));}
    const rows=Math.max(1,Math.ceil(m/10)),y0=34+(rowsMax-rows)*17;
    return I.map((k,j)=>{const r=Math.floor(j/10),c=j%10;return {k,j,x:58+(r%2?9-c:c)*26,y:y0+r*34};});}
  function bulb(b,lit,bad){const q=flags[b.k]==='q',gap=off.has(b.k);
    let s='<g class="oc-bulb" data-k="'+b.k+'"'+(o.trim?' role="button" tabindex="0" style="cursor:pointer" aria-label="'+(gap?'Put back ':'Trim ')+(lab?lab[b.k]:'part')+'"':'')+'>';
    if(o.trim)s+='<rect x="'+(b.x-22)+'" y="'+(b.y-20)+'" width="44" height="'+(28+lines*13+20)+'" fill="transparent"/>';
    if(gap){s+='<rect x="'+(b.x-13)+'" y="'+(b.y-6)+'" width="26" height="12" fill="var(--soft)"/><path d="M'+(b.x-13)+' '+(b.y-5)+'l3 5-3 5M'+(b.x+13)+' '+(b.y-5)+'l-3 5 3 5" fill="none" stroke="var(--no-strong)" stroke-width="2"/>';
      s+='<text x="'+b.x+'" y="'+(b.y+24)+'" text-anchor="middle" font-size="11" font-weight="700" fill="var(--no)">missing</text>';
      ocWrap(lab[b.k],wch(b.dx)).forEach((t,j)=>s+='<text x="'+b.x+'" y="'+(b.y+37+j*13)+'" text-anchor="middle" font-size="11" fill="var(--faint)" text-decoration="line-through">'+t+'</text>');return s+'</g>';}
    if(lit)s+='<circle cx="'+b.x+'" cy="'+b.y+'" r="13" fill="var(--h3)" opacity=".22"/>';
    s+='<circle cx="'+b.x+'" cy="'+b.y+'" r="8.5" fill="var('+(lit?'--h3-bg':'--soft2')+')" stroke="var('+(bad?'--no-strong':lit?'--h3':'--line2')+')" stroke-width="2"'+(q?' stroke-dasharray="3 2"':'')+'/>';
    s+=bad?'<path d="M'+(b.x-4)+' '+(b.y-4)+'l8 8m0-8l-8 8" stroke="var(--no-strong)" stroke-width="2.2" stroke-linecap="round"/>':
       q?'<text x="'+b.x+'" y="'+(b.y+4)+'" text-anchor="middle" font-size="11" font-weight="700" fill="var(--muted)">?</text>':
       '<path d="M'+(b.x-3.5)+' '+(b.y+2)+'l1.75-4 1.75 4 1.75-4" fill="none" stroke="var('+(lit?'--h3':'--faint')+')" stroke-width="1.4" stroke-linejoin="round"/>';
    s+='<rect x="'+(b.x-4)+'" y="'+(b.y+8.5)+'" width="8" height="4" rx="1" fill="var(--line2)"/>';
    if(lab)ocWrap(lab[b.k],wch(b.dx)).forEach((t,j)=>s+='<text x="'+b.x+'" y="'+(b.y+28+j*13)+'" text-anchor="middle" font-size="11" fill="var('+(q?'--muted':'--ink')+')">'+t+'</text>');
    return s+'</g>';}
  function draw(){const P=pos(),m=P.length,G=gaps(),lit=fail<0&&m>0&&!G.length&&!o.unlit;
    let s='<rect width="320" height="'+H+'" rx="14" fill="var(--soft)"/>';
    const wc=lit?'var(--h3)':'var(--line2)';
    if(m){let d,ym,yA,yB;
      if(lab){yA=16;yB=P[0].y;d='M20 '+yB+'H'+P[m-1].x+'V'+yA+'H20Z';ym=(yA+yB)/2;}
      else{yB=Math.max(...P.map(b=>b.y))+24;d='M20 '+yB+'V'+P[0].y+P.map(b=>'L'+b.x+' '+b.y).join('')+'L'+P[m-1].x+' '+yB+'H20';yA=P[0].y;ym=(P[0].y+yB)/2;}
      s+='<path d="'+d+'" fill="none" stroke="'+wc+'" stroke-width="2.5" stroke-linejoin="round"/>';
      s+='<rect x="8" y="'+(ym-7)+'" width="24" height="14" fill="var(--soft)"/><path d="M9 '+(ym-4)+'h22" stroke="var(--ink)" stroke-width="2"/><path d="M14 '+(ym+3)+'h12" stroke="var(--ink)" stroke-width="4.5"/>';
      if(!lab)s+='<text x="12" y="17" font-size="11" font-weight="700" fill="var('+(lit?'--h3':'--no')+')">'+(lit?'ALL LIT: THE EXPLANATION HOLDS':o.unlit?'':'DARK: PART '+(fail+1)+' WASN’T TRUE')+'</text>';
      P.forEach(b=>s+=bulb(b,lit,b.j===fail));}
    svg.innerHTML=s;
    if(o.sliders){$('.vn').textContent=n;$('.vp').textContent=(p*100).toFixed(1)+'%';}
    const ro=$('.oc-ro');
    if(ro)ro.innerHTML=o.ro?o.ro(api):'Parts: <b>'+count()+'</b> · each right: <b>'+(p*100).toFixed(1)+'%</b><br>Chance the whole explanation is wrong: <b>'+ocPct(1-Math.pow(p,count()))+'</b>'+(tally?'<br>This test: dark in <b>'+tally.dark+'</b> of '+tally.runs+' runs':'');
    const tr=$('.oc-trim');
    if(tr)tr.innerHTML=lab.map((t,k)=>'<button class="chip'+(off.has(k)?' off':'')+'" data-k="'+k+'">'+(off.has(k)?'↺ ':'✂ ')+'<span>'+t+'</span></button>').join('');
    if(o.trim)w.querySelectorAll('[data-k]').forEach(el=>{el.onclick=()=>api.toggle(+el.dataset.k);
      if(el.tagName==='g')el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();api.toggle(+el.dataset.k);}};});}
  const api={wrap:w,off,
    get n(){return count();},get p(){return p;},get tally(){return tally;},get busy(){return busy;},
    get works(){return gaps().length===0;},gaps,
    set(nn,pp){n=nn;if(pp!=null)p=pp;fail=-1;tally=null;if(o.sliders){$('.sn').value=n;$('.sp').value=Math.round(p*1000);}draw();},
    toggle(k){if(off.has(k))off.delete(k);else off.add(k);fail=-1;draw();if(o.onChange)o.onChange('trim',api);},
    test(){return new Promise(res=>{if(busy)return res();busy=true;tally={dark:0,runs:0};const b=$('.oc-tb');if(b)b.disabled=true;
      const m=count();let fr=0;
      const tick=()=>{if(!w.isConnected){busy=false;return res();}
        let f=-1;for(let t=0;t<5;t++){tally.runs++;let ff=-1;for(let k=0;k<m;k++)if(Math.random()>p){ff=k;break;}if(ff>=0){tally.dark++;f=ff;}}
        fail=f;draw();fr++;
        if(fr<20)setTimeout(tick,60);
        else setTimeout(()=>{busy=false;if(!w.isConnected)return res();fail=-1;if(b)b.disabled=false;draw();if(o.onChange)o.onChange('test',api);res();},260);};
      tick();});},
    draw};
  if(o.sliders){$('.sn').addEventListener('input',e=>{n=+e.target.value;fail=-1;tally=null;draw();if(o.onChange)o.onChange('n',api);});
    $('.sp').addEventListener('input',e=>{p=+e.target.value/1000;fail=-1;tally=null;draw();if(o.onChange)o.onChange('p',api);});}
  if(o.test)$('.oc-tb').onclick=()=>api.test();
  draw();return api;}

/* ---------- signature 2: the razor on the explanation tangle ----------
   cfg: {root, facts:[[letter,text]], br:[{lab, parts:[..], ex:[fact idx]}], showParts, onTap(i,el), onChange(api,{i,lost})} */
const OC_FC=['--h1','--h2','--h4','--h3'];
const OC_BLADE='<svg class="oc-blade" viewBox="0 0 36 22" aria-hidden="true"><path d="M2 5h24l8 6-8 6H2z" fill="var(--card)" stroke="var(--ink)" stroke-width="1.6" stroke-linejoin="round"/><path d="M4 11h20" stroke="var(--muted)" stroke-width="1.2"/></svg>';
function ocTangle(L,host,cfg){
  const facts=cfg.facts.map(f=>f.slice()),br=cfg.br.map(b=>Object.assign({},b,{ex:b.ex.slice()}));const cut=new Set();
  let parts=!!cfg.showParts,shown=cfg.shown==null?br.length:cfg.shown;
  const w=document.createElement('div');w.className='oc-tg';host.appendChild(w);
  w.innerHTML='<span class="oc-lab">Facts to explain</span><div class="oc-fx"></div><div class="oc-root">'+L.ic('leaf')+'<span>'+cfg.root+'</span></div><div class="oc-brs"></div><div class="oc-msg" aria-live="polite"></div>';
  const $=s=>w.querySelector(s);
  const vis=()=>br.map((_,i)=>i).filter(i=>i<shown);
  const expl=f=>vis().some(i=>!cut.has(i)&&br[i].ex.includes(f));
  const unex=()=>facts.map((_,j)=>j).filter(j=>!expl(j));
  function drawFacts(){$('.oc-fx').innerHTML=facts.map((f,j)=>{const ok=expl(j);return '<div class="oc-f'+(ok?'':' no')+'"><i style="background:var('+OC_FC[j]+')">'+f[0]+'</i><span>'+f[1]+'</span><em>'+(ok?'✓ explained':'✕ unexplained')+'</em></div>';}).join('');}
  function bsvg(b){const n=b.parts.length,len=24+n*34;let d='M0 15',x=0;for(;x+17<=len;x+=17)d+='Q'+(x+8.5)+' '+((x/17)%2?21:9)+' '+(x+17)+' 15';d+='L'+len+' 15';
    let s='<svg class="br" viewBox="0 0 290 30" aria-hidden="true"><path d="'+d+'" fill="none" stroke="var(--h2)" stroke-width="3.5" stroke-linecap="round"/>';
    b.parts.forEach((_,k)=>{const x=24+k*34;s+='<circle cx="'+x+'" cy="15" r="8.5" fill="var(--card)" stroke="var(--h2)" stroke-width="2.5"/>'+(parts?'<text x="'+x+'" y="19" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">'+(k+1)+'</text>':'');});
    facts.forEach((f,j)=>{const x=len+16+j*20,has=b.ex.includes(j);
      s+=has?'<circle cx="'+x+'" cy="15" r="8.5" fill="var('+OC_FC[j]+')"/><text x="'+x+'" y="19" text-anchor="middle" font-size="11" font-weight="700" fill="var(--card)">'+f[0]+'</text>'
        :'<circle cx="'+x+'" cy="15" r="8" fill="none" stroke="var(--faint)" stroke-width="1.5" stroke-dasharray="3 2"/><text x="'+x+'" y="19" text-anchor="middle" font-size="11" font-weight="700" fill="var(--faint)">'+f[0]+'</text>';});
    return s+'</svg>';}
  const note=i=>cut.has(i)?'✂ trimmed'+(cfg.onTap?'':' · tap to put it back'):'';
  function rowHtml(i){const b=br[i],c=cut.has(i),n=b.parts.length,miss=facts.length-b.ex.filter(j=>j<facts.length).length;
    return '<button type="button" class="oc-br'+(c?' cut':'')+'" data-i="'+i+'" aria-pressed="'+c+'" aria-label="'+b.lab+': '+n+' part'+(n>1?'s':'')+', explains '+b.ex.map(j=>facts[j]?facts[j][0]:'').join(', ')+(miss?'; leaves '+miss+' fact'+(miss>1?'s':'')+' unexplained':'')+'">'+OC_BLADE+
      '<span class="bl"><b>'+b.lab+'</b>'+(parts?'<em>'+n+' part'+(n>1?'s':'')+'</em>':'')+'</span>'+(parts?'<span class="pl">'+b.parts.join(' · ')+'</span>':'')+bsvg(b)+'<span class="cutnote">'+note(i)+'</span></button>';}
  function render(){drawFacts();$('.oc-brs').innerHTML=vis().map(rowHtml).join('');
    w.querySelectorAll('.oc-br').forEach(el=>el.onclick=()=>{const i=+el.dataset.i;if(cfg.onTap)cfg.onTap(i,el);else api.toggle(i);});}
  const api={wrap:w,cut,facts,br,
    kept:()=>vis().filter(i=>!cut.has(i)),unex,
    toggle(i,quiet){const before=unex();if(cut.has(i))cut.delete(i);else cut.add(i);
      const el=w.querySelector('.oc-br[data-i="'+i+'"]');
      if(el){el.classList.toggle('cut',cut.has(i));el.setAttribute('aria-pressed',cut.has(i));el.querySelector('.cutnote').textContent=note(i);
        if(cut.has(i)){el.classList.remove('slice');void el.offsetWidth;el.classList.add('slice');}}
      drawFacts();const lost=unex().filter(j=>!before.includes(j));$('.oc-msg').innerHTML='';
      if(!quiet&&lost.length)L.fb($('.oc-msg'),'<b>'+lost.map(j=>'Fact '+facts[j][0]).join(' and ')+(lost.length>1?' are':' is')+' now unexplained.</b> That branch was needed, so the razor can’t trim it.','no');
      if(cfg.onChange)cfg.onChange(api,{i,lost});},
    msg(html,kind){$('.oc-msg').innerHTML='';if(html)L.fb($('.oc-msg'),html,kind||'info');},
    showParts(v){parts=v;render();},setShown(k){shown=k;render();},render};
  render();return api;}

Course.lesson({
  id:'0009', title:'Occam’s razor', minutes:20, icon:'leaf',
  goals:['Explain why an explanation with fewer moving parts is more likely to be true, and when that rule applies',
         'Trim a tangle of explanations to the simplest one that still explains every fact, and check it first',
         'Run the one-minute move on everyday worries, and spot where the razor stops working'],
  parts:['Fewest moving parts','Until proven otherwise','Where simple wins','Use it, know its limits'],
  read:'Read the book’s Occam’s Razor chapter for the full stories of Vera Rubin and dark matter, the shade balls on the Ivanhoe Reservoir, the tiger masks in the Ganges Delta and Louis Gerstner at IBM.',
  glossary:{
   'moving-parts':'Moving parts: the separate things that must all be true for an explanation to hold. More parts means more ways for the explanation to be wrong.',
   'irreducible':'Irreducibly complex: something that can’t be explained truthfully with fewer parts, like powered flight or how a big fraud grows. Trimming it makes the explanation wrong.',
   'horses-zebras':'Horses, not zebras: a saying taught to medical students. When symptoms fit both a common cause and a rare one, think of the common one first.'
  },
  cheatsheet:[
   '<b>Occam’s razor:</b> when explanations fit the facts equally well, prefer the one with the <b>fewest moving parts</b>. The more tangled the story, the more doubt it deserves.',
   '<b>Why it works:</b> every part must be true. At 99% each, a 3-part story is wrong about 3% of the time; a 30-part story about 26%, roughly nine times as often.',
   '<b>Simple until proven otherwise:</b> extraordinary claims need extraordinary proof (Hume, Sagan). Dark matter is the simplest current explanation, and it’s still being tested.',
   '<b>Simple saves time and money:</b> shade balls instead of a dome; a mask on the back of the head to fool tigers; doing the basics well at IBM instead of a grand vision.',
   '<b>Horses, not zebras:</b> check the common cause first. A good counter to health worry, not a diagnosis: if symptoms persist, see a doctor.',
   '<b>Limits:</b> not an iron law. It only applies when the explanations fit the facts equally well. Some things are irreducibly complex, or have several real causes. Simplify only while it stays accurate.',
   'One-minute move (how this course applies the book): list the explanations → count each one’s parts → start with the simplest that explains every fact → check it first, and move on only if the facts rule it out.'
  ],
  steps:[
/* ---------- PART 1: FEWEST MOVING PARTS ---------- */
{part:0,src:'Warm-up',pts:1,run(L){

{part:0,src:'Occam’s Razor · opening',
 solve:async L=>{for(let j=0;j<3;j++){L.$$('#ic .chip')[j].click();L.$('#itr').click();}},
 run(L){
  const C=[['Partner late home','A car accident?','Caught up at work'],['Child grew less this year','Something wrong with them?','The height was mismeasured'],['A sore toe','A serious illness?','A shoe that’s too tight']];
  L.h(L.kick('learn','Everyday spirals')+'<h1 class="q">We see the tip, then imagine a whole iceberg under it. Trim each one.</h1>'+
   '<svg class="oc-svg" viewBox="0 0 320 196" role="img" aria-label="An iceberg: a small tip above the water (what you see) and a huge mass below (the story you imagine)">'+
   '<rect width="320" height="196" rx="14" fill="var(--soft)"/><path d="M0 70H320V182a14 14 0 0 1-14 14H14A14 14 0 0 1 0 182Z" fill="var(--h2-bg)"/>'+
   '<path d="M0 70q20-5 40 0t40 0 40 0 40 0 40 0 40 0 40 0 40 0" fill="none" stroke="var(--h2)" stroke-width="2"/>'+
   '<text x="12" y="18" font-size="11" font-weight="700" fill="var(--muted)">WHAT YOU SEE</text><text x="12" y="186" font-size="11" font-weight="700" fill="var(--muted)">THE STORY YOU TELL</text>'+
   '<g class="oc-deep" id="ideep"><path d="M112 70H186L234 108 220 166 152 186 94 160 84 110Z" fill="var(--card)" opacity=".8" stroke="var(--h2)" stroke-width="2" stroke-dasharray="6 4"/></g>'+
   '<path d="M128 70L148 36 166 46 188 70Z" fill="var(--card)" stroke="var(--h2)" stroke-width="2" stroke-linejoin="round"/>'+
   '<text id="isee" x="158" y="28" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink)"></text>'+
   '<text id="iworst" class="oc-fade" x="158" y="132" text-anchor="middle" font-size="13" font-weight="700" fill="var(--no)"></text>'+
   '<text id="isimp" class="oc-fade" x="158" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ok)" opacity="0"></text>'+
   '</svg><div class="oc-chips" id="ic"></div><div class="oc-ctl"><button class="btn pri" id="itr">'+L.ic('leaf')+'What’s more likely?</button></div><p class="oc-ro" id="iro">Trimmed: <b>0 of 3</b></p><div id="icap"></div>');
  let cur=0;const done=new Set();
  function show(){const c=C[cur],t=done.has(cur);L.$('#isee').textContent=c[0];L.$('#iworst').textContent=c[1];L.$('#isimp').textContent=c[2];
    L.$('#ideep').style.transform=t?'scale(.16)':'scale(1)';L.$('#iworst').setAttribute('opacity',t?0:1);L.$('#isimp').setAttribute('opacity',t?1:0);
    L.$$('#ic .chip').forEach((b,j)=>b.classList.toggle('sel',j===cur));L.$('#itr').disabled=t;L.$('#iro').innerHTML='Trimmed: <b>'+done.size+' of 3</b>';}
  C.forEach((c,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=c[0];b.onclick=()=>{cur=j;show();};L.$('#ic').appendChild(b);});
  L.$('#itr').onclick=()=>{done.add(cur);show();if(done.size===3&&!L.$('#icap').innerHTML){
    L.$('#icap').innerHTML=L.prose('Any worst case <i>could</i> be true. But with no other facts pointing to it, the plain story is far more likely. Big, hidden stories take work to untangle.');L.done();}};
  show();}},

{part:0,src:'Occam’s Razor · opening',
 solve:async L=>{L.$$('#rzk .chip')[1].click();},
 run(L){
  /* the van story is made up for the course */
  const F=[['A','The engine won’t start'],['B','The dashboard lights are dim']];
  const BR=[[52,6,'Someone tampered with it',[0,1]],[106,2,'A flat battery',[0,1]],[160,1,'Out of fuel',[0]]];
  L.h(L.kick('learn','The razor')+'<h1 class="q">The delivery van won’t start. Three explanations. Keep one.</h1>'+
   '<span class="oc-lab">Facts to explain</span><div class="oc-fx" id="rzf"></div>'+
   '<svg class="oc-svg oc-rz" id="rzs" viewBox="0 0 320 196" role="img" aria-label="Three branches growing from one trunk: tampering with 6 parts explains facts A and B; a flat battery with 2 parts explains A and B; out of fuel with 1 part explains only A">'+
   '<rect width="320" height="196" rx="14" fill="var(--soft)"/>'+
   '<text x="14" y="20" font-size="11" font-weight="700" fill="var(--h2)">WHAT HAPPENED</text><rect x="20" y="28" width="7" height="154" rx="3.5" fill="var(--h2)"/>'+
   BR.map((r,i)=>{const len=r[1]*36+20;let d='M27 '+r[0];for(let x=27;x<27+len;x+=18)d+='Q'+(x+9)+' '+(r[0]+((x-27)/18%2?7:-7))+' '+(x+18)+' '+r[0];
     let g='<g class="oc-fade" id="rzg'+i+'"><path d="'+d+'" fill="none" stroke="var(--h2)" stroke-width="3.5" stroke-linecap="round"/>';
     for(let k=0;k<r[1];k++)g+='<circle cx="'+(52+k*36)+'" cy="'+r[0]+'" r="7.5" fill="var(--card)" stroke="var(--h2)" stroke-width="2.5"/>';
     F.forEach((f,j)=>{const x=27+len+14+j*20,has=r[3].includes(j);
       g+=has?'<circle cx="'+x+'" cy="'+r[0]+'" r="8.5" fill="var('+OC_FC[j]+')"/><text x="'+x+'" y="'+(r[0]+4)+'" text-anchor="middle" font-size="11" font-weight="700" fill="var(--card)">'+f[0]+'</text>'
         :'<circle cx="'+x+'" cy="'+r[0]+'" r="8" fill="none" stroke="var(--faint)" stroke-width="1.5" stroke-dasharray="3 2"/><text x="'+x+'" y="'+(r[0]+4)+'" text-anchor="middle" font-size="11" font-weight="700" fill="var(--faint)">'+f[0]+'</text>';});
     g+='<text x="40" y="'+(r[0]-14)+'" font-size="11" font-weight="700" fill="var(--muted)">'+r[2]+' · '+r[1]+' part'+(r[1]>1?'s':'')+'</text></g>';
     if(i===1)g+='<text class="win" x="176" y="'+(r[0]+4)+'" font-size="12" font-weight="700" fill="var(--ok)">← the razor keeps this</text>';return g;}).join('')+
   '<g class="rzr"><path d="M236 122h40l12 8-12 8h-40z" fill="var(--card)" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/><path d="M240 130h34" stroke="var(--muted)" stroke-width="1.4"/><rect x="216" y="124" width="20" height="12" rx="4" fill="var(--ink)"/></g>'+
   '</svg><span class="oc-lab">Keep only</span><div class="oc-chips" id="rzk"></div><div id="rzm" aria-live="polite"></div><div id="rzc"></div>');
  let fin=false;
  function facts(keep){L.$('#rzf').innerHTML=F.map((f,j)=>{const ok=keep==null||BR[keep][3].includes(j);return '<div class="oc-f'+(ok?'':' no')+'"><i style="background:var('+OC_FC[j]+')">'+f[0]+'</i><span>'+f[1]+'</span><em>'+(ok?'✓ explained':'✕ unexplained')+'</em></div>';}).join('');}
  BR.forEach((r,i)=>{const b=document.createElement('button');b.className='chip';b.textContent=r[2];b.onclick=()=>{if(fin)return;
    L.$$('#rzk .chip').forEach((x,q)=>x.classList.toggle('sel',q===i));BR.forEach((_,q)=>L.$('#rzg'+q).setAttribute('opacity',q===i?1:.18));facts(i);L.$('#rzm').innerHTML='';
    if(i===1){fin=true;L.$('#rzs').classList.add('trim');
      L.$('#rzc').innerHTML=L.prose(L.g('occams-razor','Occam’s razor')+' (after the medieval logician William of Ockham): when explanations fit the facts equally well, keep the one with the fewest '+L.g('moving-parts','moving parts')+'.')+
        '<p class="small">The idea is older than Ockham. Simple stories are also easier to test.</p>';L.done();}
    else L.fb(L.$('#rzm'),i===2?'Shortest, but fact B goes unexplained: fuel doesn’t dim the lights. It isn’t equally good, so the razor can’t pick it.':'It explains both facts, but six things must all be true. Another branch explains both with two.','no');};
    L.$('#rzk').appendChild(b);});

{part:0,src:'Occam’s Razor · Dark What?',
 solve:async L=>{const s=L.str;s.set(25);s.wrap.querySelector('.sn').dispatchEvent(new Event('input',{bubbles:true}));await s.test();},
 run(L){

{part:0,src:'Occam’s Razor · Dark What?',
 solve:async L=>{L.$('#cb').click();await L.sleep(1900);},
 run(L){

     '<text x="10" y="38" font-size="12" font-weight="700" fill="var(--ink)">A</text><rect x="30" y="26" width="'+sc(wa)+'" height="16" rx="4" fill="var(--ok-strong)"/><text x="'+(36+sc(wa))+'" y="39" font-size="12" font-weight="700" fill="var(--ok)">'+ocPct(wa)+'</text>'+
     '<text x="10" y="68" font-size="12" font-weight="700" fill="var(--ink)">B</text><rect x="30" y="56" width="'+sc(wb)+'" height="16" rx="4" fill="var(--no-strong)"/><text x="'+(36+sc(wb))+'" y="69" font-size="12" font-weight="700" fill="var(--no)">'+ocPct(wb)+'</text></svg>'+
     L.prose('The 30-part story fails roughly <b>nine times</b> as often. Same facts, same 99% per part. The simpler explanation holds up better when you’re unsure.');

{part:0,src:'Occam’s Razor · Dark What?',pts:1,
 solve:async L=>{L.$$('#pp .chip')[2].click();L.$('#pw').click();await L.sleep(1900);},
 run(L){

   '<div class="oc-chips" id="pp"></div><div class="oc-ctl"><button class="btn pri" id="pw" hidden>'+L.ic('play')+'Test it 100 times</button></div><div id="ps"></div>');

  const S=ocString(L,L.$('#ps'),{n:10,p:.95,ro:s=>'Parts: <b>10</b> · each right: <b>95.0%</b>'+(s.tally?'<br>This test: dark in <b>'+s.tally.dark+'</b> of '+s.tally.runs+' runs'+(s.busy?'':' · on average: <b>'+ocPct(1-Math.pow(.95,10))+'</b>'):'<br>Chance the whole explanation is wrong: <b>?</b>')});

{part:1,src:'Occam’s Razor · opening',

   '<path d="M160 170V112" stroke="var(--ok-strong)" stroke-width="4" stroke-linecap="round"/><path d="M160 146q-18-4-24-16q16 0 24 10M160 136q18-4 24-16q-16 0-24 10" fill="var(--ok-bg)" stroke="var(--ok-strong)" stroke-width="2"/>'+
   '<g id="sfhead">'+[-15,-9,-3,3,9,15].map(y=>'<ellipse cx="9" cy="'+y+'" rx="9" ry="3.4" fill="var(--h3-bg)" stroke="var(--h3)" stroke-width="1.5"/>').join('')+'<ellipse cx="2" cy="0" rx="7" ry="17" fill="var(--h3)"/></g>'+
   '<text id="sflab" x="160" y="182" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--muted)"></text></svg>'+
   '<label class="oc-sl"><span class="h"><span>Time of day</span><b id="sfv"></b></span><input type="range" id="sfs" min="5" max="95" step="1" value="10" aria-label="Time of day, morning to evening"></label>'+
   '<div class="oc-chips" id="sfk"></div><div id="sfc"></div>');
  let lo=10,hi=10,seenNow=false,fin=false;
  const why=['Before botany: a miracle?','Now: plant hormones'];let mode=0;
  ['A miracle?','What we know now'].forEach((t,j)=>{const b=document.createElement('button');b.className='chip'+(j===0?' sel':'');b.textContent=t;b.onclick=()=>{mode=j;if(j===1)seenNow=true;L.$$('#sfk .chip').forEach((x,q)=>x.classList.toggle('sel',q===j));upd();};L.$('#sfk').appendChild(b);});
  function upd(){const v=+L.$('#sfs').value,a=Math.PI*(1-v/100),sx=160+130*Math.cos(a),sy=150-130*Math.sin(a);
    L.$('#sfsun').setAttribute('transform','translate('+sx.toFixed(1)+' '+sy.toFixed(1)+')');
    const ang=Math.atan2(sy-112,sx-160)*180/Math.PI;L.$('#sfhead').setAttribute('transform','translate(160 112) rotate('+ang.toFixed(1)+')');
    L.$('#sfv').textContent=v<34?'Morning':v<67?'Midday':'Evening';L.$('#sflab').textContent=why[mode];
    lo=Math.min(lo,v);hi=Math.max(hi,v);
    if(!fin&&hi-lo>=60&&seenNow){fin=true;L.$('#sfc').innerHTML=L.prose('Plant hormones, not a miracle. Hume’s and Sagan’s point: when something seems to break nature’s rules, first suspect a wrong account or an ordinary cause we don’t yet understand.');L.done();}}
  L.$('#sfs').addEventListener('input',upd);upd();}},

{part:1,src:'Occam’s Razor · Dark What?',
 solve:async L=>{while(L.$('#gn')&&!L.$('#gn').hidden)L.$('#gn').click();},
 run(L){
  const R=[[34,3],[60,6],[88,9]],NW=[[34,3],[60,7.6],[88,13.5]];
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">Vera Rubin’s problem: a galaxy spinning “all wrong”.</h1>'+
   '<span class="oc-lab" id="gmode">WHAT GRAVITY PREDICTS</span><svg class="oc-svg" viewBox="0 0 320 196" role="img" aria-label="A spiral galaxy seen from above, with stars orbiting at three distances and arrows showing their speed">'+
   '<rect width="320" height="196" rx="14" fill="var(--soft)"/>'+
   '<circle id="ghalo" class="oc-fade" cx="160" cy="98" r="96" fill="var(--h1-bg)" opacity="0" stroke="var(--h1)" stroke-dasharray="5 5"/>'+
   '<text id="ghl" class="oc-fade" x="306" y="186" text-anchor="end" font-size="11" font-weight="700" fill="var(--h1)" opacity="0">unseen mass?</text>'+
   R.map(r=>'<circle cx="160" cy="98" r="'+r[0]+'" fill="none" stroke="var(--line2)" stroke-dasharray="2 4"/>').join('')+
   '<path d="M160 98c20-30 60-24 70 6M160 98c-20 30-60 24-70-6" fill="none" stroke="var(--h1)" stroke-width="7" stroke-linecap="round" opacity=".35"/>'+
   '<circle cx="160" cy="98" r="15" fill="var(--h1)" opacity=".55"/><circle cx="160" cy="98" r="7" fill="var(--h3)"/>'+
   R.map((r,j)=>'<g class="oc-orb" id="go'+j+'"><circle cx="'+(160+r[0])+'" cy="98" r="5" fill="var(--h3)" stroke="var(--card)" stroke-width="1.5"/><path class="garr" d="M'+(160+r[0])+' 98v24" stroke="var(--pri)" stroke-width="3" stroke-linecap="round"/></g>').join('')+
   '</svg>'+
   '<p class="oc-ro" id="gro"></p><div class="oc-say" id="gsay" aria-live="polite"></div><div class="oc-ctl"><button class="btn pri" id="gn">'+L.ic('arrow')+'Next</button></div>');
  const B=[[0,'1 OF 4 · THE EXPECTATION','Gravity pulls less on far-out stars, so they should orbit more slowly, like the outer planets.'],
   [1,'2 OF 4 · WHAT SHE SAW','Mid-1970s: Andromeda’s edge moved as fast as its middle. The data didn’t fit.'],
   [1,'3 OF 4 · THE SIMPLEST EXPLANATION','Unseen mass pulling on the stars: “dark matter” (Fritz Zwicky’s 1933 term). Rubin is credited with the first evidence.'],
   [1,'4 OF 4 · STILL BEING TESTED','No one has found it yet, so it’s still being tested. Rubin later leaned toward new gravity: a claim needing extraordinary proof.']];
  let k=0;
  function mode(m){const S=m?R:NW;S.forEach((s,j)=>{const el=L.$('#go'+j);if(el)el.style.animationDuration=s[1]+'s';});
    const len=m?[24,24,24]:[24,17,12.5];L.$$('.garr').forEach((p,j)=>p.setAttribute('d','M'+(160+R[j][0])+' 98v'+len[j]));
    L.$('#gmode').textContent=m?'WHAT RUBIN SAW':'WHAT GRAVITY PREDICTS';
    L.$('#gro').innerHTML='Outer star’s speed vs inner star: <b>'+(m?'about the same':'about half')+'</b>'+(m?'':' <span class="small">(illustration, not a book figure)</span>');}
  function show(){const b=B[k];mode(b[0]);L.$('#gsay').innerHTML='<b class="k">'+b[1]+'</b>'+b[2];
    L.$('#ghalo').setAttribute('opacity',k>=2?.55:0);L.$('#ghl').setAttribute('opacity',k>=2?1:0);}
  show();
  L.$('#gn').onclick=()=>{k++;show();if(k===B.length-1){L.$('#gn').hidden=true;
    L.sheet('info','The simplest explanation, for now','Dark matter is the explanation with the fewest new parts today, and it makes predictions that can be tested. If it ever becomes too complicated, the razor points to whatever is simplest then. Preferred until proven otherwise, not forever.');L.done();}};}},

{part:1,src:'Occam’s Razor · Conclusion',pts:1,run(L){
  L.h(L.kick('try','Build the rule')+'<h1 class="q">Tap each piece until the sentence states the razor the way the book does.</h1>');
  L.sentence(L.card,[
    ['When explanations sound equally dramatic,','When explanations explain the facts equally well,','When one explanation feels right,'],
    ['prefer the one with the most detail','prefer the one with the fewest moving parts','prefer the newest one'],
    ['for good.','until the facts rule it out.','unless an expert disagrees.']],[1,1,1],
   [['The razor isn’t about drama. It only applies when the explanations fit the facts equally well.','A feeling isn’t a test. The razor compares explanations that fit the facts equally well.'],
    ['More detail means more parts that must all be true, so it’s less likely, not more.','New isn’t simpler. Count the parts each one needs.'],
    ['The book says the simplest is preferred, not proven. It can be overturned.','Experts can be wrong too. What overturns the simple explanation is facts it can’t explain.']],
   'That’s the razor: <b>a tendency, not an iron law</b>. It picks between explanations that fit the facts equally well, and keeps the simplest only until the facts say otherwise.');}},

{part:2,src:'Occam’s Razor · Simplicity Can Increase Efficiency',
 solve:async L=>{L.$$('#rv .chip')[2].click();L.$$('#rt .chip')[1].click();L.$('#tm').click();},
 run(L){
  L.h(L.kick('ex','Two stories from the book')+'<h1 class="q">When the simple fix beat the complicated ones</h1><div class="oc-chips" id="rt"></div><div id="rh"></div>');
  let saw=false,mask=false,fin=false;
  function chk(){if(!fin&&saw&&mask){fin=true;L.sheet('info','Fewer parts, fewer dead ends','Chasing every complicated solution wastes time, money and energy. In both stories, the fix with almost no moving parts worked, and it came from someone who looked at how things really were.');L.done();}}
  function res(){L.$('#rh').innerHTML='<svg class="oc-svg" viewBox="0 0 320 170" role="img" aria-label="A reservoir seen from above in sunlight, with a cover option drawn over it" id="rsv"></svg><div class="oc-chips" id="rv"></div><p class="oc-ro" id="rro"></p>';
    const O=[['Ten-acre tarp','tarp'],['Retractable dome','dome'],['Shade balls','balls']];
    function draw(o){let s='<rect width="320" height="170" rx="14" fill="var(--soft)"/><circle cx="292" cy="24" r="12" fill="var(--h3)"/>'+[0,1,2].map(j=>'<path d="M'+(276-j*14)+' '+(38+j*6)+'l-22 22" stroke="var(--h3)" stroke-width="2" stroke-dasharray="4 4"/>').join('')+
       '<rect x="28" y="56" width="264" height="96" rx="18" fill="var(--h2-bg)" stroke="var(--h2)" stroke-width="2"/><text x="40" y="76" font-size="11" font-weight="700" fill="var(--h2)">IVANHOE RESERVOIR · 10 ACRES</text>';
      if(o==='tarp')s+='<rect x="34" y="62" width="252" height="84" rx="14" fill="var(--soft2)" stroke="var(--muted)" stroke-width="2"/>'+[60,110,160,210,260].map(x=>'<path d="M'+x+' 62v84" stroke="var(--line2)" stroke-width="1.5"/>').join('')+'<text x="160" y="108" text-anchor="middle" font-size="12" font-weight="700" fill="var(--muted)">a huge sheet to build, anchor and keep up</text>';
      if(o==='dome')s+='<path d="M28 150Q160 -10 292 150" fill="var(--soft2)" fill-opacity=".85" stroke="var(--muted)" stroke-width="2"/>'+[90,130,190,230].map(x=>'<path d="M'+x+' 150Q160 '+(30+Math.abs(x-160)/2)+' '+(320-x)+' 150" fill="none" stroke="var(--line2)" stroke-width="1.2"/>').join('')+'<text x="160" y="128" text-anchor="middle" font-size="12" font-weight="700" fill="var(--muted)">a giant structure with moving parts</text>';
      if(o==='balls'){for(let y=0;y<9;y++)for(let x=0;x<26;x++){const cx=38+x*9.8+(y%2?4.5:0),cy=86+y*7.2;if(cx<284)s+='<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="3.6" fill="var(--ink)"/>';}}
      else if(!o)s+='<text x="160" y="104" text-anchor="middle" font-size="12" font-weight="700" fill="var(--no)">sun + chlorine + bromide</text><text x="160" y="122" text-anchor="middle" font-size="12" font-weight="700" fill="var(--no)">= a harmful chemical</text>';
      L.$('#rsv').innerHTML=s;
      L.$('#rro').innerHTML=!o?'The water needed shade. Pick a fix.':o==='balls'?'<b>Tip them in and they float: nothing to build or look after.</b> About 40 cents each; three million went into LA reservoirs.':'<b>From the brainstorm, and judged not workable.</b> Building, parts, labour and upkeep for ten acres.';
      L.$$('#rv .chip').forEach((b,j)=>b.classList.toggle('sel',O[j][1]===o));}
    O.forEach(o=>{const b=document.createElement('button');b.className='chip';b.textContent=o[0];b.onclick=()=>{draw(o[1]);if(o[1]==='balls'){saw=true;chk();}};L.$('#rv').appendChild(b);});draw(null);}
  function tig(){L.$('#rh').innerHTML='<svg class="oc-svg" viewBox="0 0 320 176" role="img" aria-label="Left: a tiger in tall grass. Right: what the tiger sees, the back of a villager’s head, with or without a face mask"><g id="tsv"></g></svg><div class="oc-ctl"><button class="btn pri" id="tm">'+L.ic('eye')+'Put a face mask on the back of the head</button></div><p class="oc-ro" id="tro"></p>';
    function draw(){let s='<rect width="320" height="176" rx="14" fill="var(--soft)"/><rect x="166" y="10" width="146" height="156" rx="12" fill="var(--card)" stroke="var(--line2)"/><text x="239" y="27" text-anchor="middle" font-size="11" font-weight="700" fill="var(--muted)">WHAT THE TIGER SEES</text>';
      s+='<path d="M10 150q6-30 10 0M26 150q6-36 10 0M120 150q6-30 10 0M140 150q5-28 8 0" stroke="var(--ok-strong)" stroke-width="2.5" fill="none"/><path d="M8 152H156" stroke="var(--ok-line)" stroke-width="2"/>';
      s+='<g class="oc-tiger" style="transform:translateX('+(mask?-24:14)+'px)"><ellipse cx="80" cy="124" rx="32" ry="13" fill="var(--h3-bg)" stroke="var(--h3)" stroke-width="2"/>'+[66,78,90].map(x=>'<path d="M'+x+' 112l3 9" stroke="var(--h3)" stroke-width="3" stroke-linecap="round"/>').join('')+
        '<path d="M58 134v14M70 136v12M92 136v12M102 134v14" stroke="var(--h3)" stroke-width="4" stroke-linecap="round"/><path d="M48 120q-14-10-10-24" fill="none" stroke="var(--h3)" stroke-width="3" stroke-linecap="round"/>'+
        '<circle cx="116" cy="114" r="12" fill="var(--h3-bg)" stroke="var(--h3)" stroke-width="2"/><path d="M108 104l2-7 5 5M120 102l4-6 2 7" fill="var(--h3-bg)" stroke="var(--h3)" stroke-width="1.6"/><circle cx="121" cy="112" r="1.8" fill="var(--ink)"/>'+
        '</g><text x="82" y="52" text-anchor="middle" font-size="12" font-weight="700" fill="var('+(mask?'--ok':'--no')+')">'+(mask?'Feels watched:':'Thinks it’s unseen:')+'</text><text x="82" y="68" text-anchor="middle" font-size="12" font-weight="700" fill="var('+(mask?'--ok':'--no')+')">'+(mask?'it holds back':'it stalks')+'</text>';
      s+='<path d="M206 166q2-32 33-36q31 4 33 36z" fill="var(--h1-bg)" stroke="var(--h1)" stroke-width="2"/><circle cx="239" cy="88" r="38" fill="var(--soft2)" stroke="var(--line2)" stroke-width="2"/>';
      if(mask)s+='<ellipse cx="239" cy="90" rx="29" ry="33" fill="var(--h4-bg)" stroke="var(--h4)" stroke-width="2"/><ellipse cx="228" cy="82" rx="7" ry="5" fill="var(--card)" stroke="var(--ink)" stroke-width="1.5"/><ellipse cx="250" cy="82" rx="7" ry="5" fill="var(--card)" stroke="var(--ink)" stroke-width="1.5"/><circle cx="228" cy="82" r="2.6" fill="var(--ink)"/><circle cx="250" cy="82" r="2.6" fill="var(--ink)"/><path d="M220 72l14 2M258 72l-14 2M229 104q10 6 20 0" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/>';
      else s+='<path d="M206 80q33-26 66 0" fill="none" stroke="var(--faint)" stroke-width="2"/><path d="M212 96q27-16 54 0" fill="none" stroke="var(--faint)" stroke-width="1.5"/>';
      L.$('#tsv').innerHTML=s;
      L.$('#tro').innerHTML=mask?'<b>For three years, masked workers were left alone.</b> The people killed had gone without one.':'1989, Ganges Delta: tigers killed about sixty villagers. Nothing worked, not even dummies wired to shock them. Tigers attack when they think they’re unseen.';
      L.$('#tm').innerHTML=L.ic('eye')+(mask?'Take the mask off':'Put a face mask on the back of the head');}
    L.$('#tm').onclick=()=>{mask=!mask;draw();if(mask){L.$('#tro').innerHTML+='<br><span class="small">A student remembered insects with eye-like patterns that fool predators.</span>';}chk();};draw();}
  [['Shade the reservoir',res],['Stop the tigers',tig]].forEach((t,j)=>{const b=document.createElement('button');b.className='chip'+(j===0?' sel':'');b.textContent=t[0];b.onclick=()=>{L.$$('#rt .chip').forEach((x,q)=>x.classList.toggle('sel',q===j));t[1]();};L.$('#rt').appendChild(b);});
  res();}},

{part:2,src:'Occam’s Razor · Occam’s Razor in the Medical Field',
 solve:async L=>{L.$$('#hz .chip')[0].click();},
 run(L){
  L.h(L.kick('learn','Horses, not zebras')+'<h1 class="q">You hear hoofbeats behind the fence. What do you picture?</h1>'+
   '<svg class="oc-svg" viewBox="0 0 320 178" role="img" aria-label="A field behind a fence: a large horse close by, labelled common, and a small zebra far away, labelled rare">'+
   '<rect width="320" height="178" rx="14" fill="var(--soft)"/><path d="M0 108H320V164a14 14 0 0 1-14 14H14A14 14 0 0 1 0 164Z" fill="var(--ok-bg)"/>'+
   [20,70,120,170,220,270].map(x=>'<rect x="'+x+'" y="84" width="6" height="32" rx="2" fill="var(--line2)"/>').join('')+'<path d="M10 92H310M10 106H310" stroke="var(--line2)" stroke-width="3"/>'+
   '<g id="hzh" class="oc-fade" opacity=".35">'+ocAnimal(96,120,1.2,false)+'</g><g id="hzz" class="oc-fade" opacity=".35">'+ocAnimal(244,104,.62,true)+'</g>'+
   '<g id="hzl" class="oc-fade" opacity="0"><rect x="40" y="10" width="124" height="40" rx="10" fill="var(--ok-bg)" stroke="var(--ok-line)"/><text x="102" y="26" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ok)">Horse: common (flu)</text><text x="102" y="42" text-anchor="middle" font-size="11" fill="var(--ok)">check this first</text>'+
   '<rect x="186" y="18" width="122" height="40" rx="10" fill="var(--card)" stroke="var(--line2)"/><text x="247" y="34" text-anchor="middle" font-size="12" font-weight="700" fill="var(--muted)">Zebra: rare (Ebola)</text><text x="247" y="50" text-anchor="middle" font-size="11" fill="var(--muted)">only if facts point there</text></g>'+
   '</svg><div class="oc-chips" id="hz"></div><div id="hzc"></div>');
  let picked=false;
  function reveal(lead){['#hzh','#hzz','#hzl'].forEach(s=>L.$(s).setAttribute('opacity',1));L.$('#hzz').setAttribute('opacity',.55);
    L.$('#hzc').innerHTML=lead+
      L.quote('When you hear hoofbeats, think horses, not zebras.','a saying taught to medical students, quoted in the book')+
      L.prose('Why common first: begin with how often each cause happens in general (its base rate), then update with the new facts: Bayesian updating, from lesson 7. Flu is far more common than Ebola.')+
      '<p class="small">For patients, '+L.g('horses-zebras','horses, not zebras')+' is a counter to health worry, not medical advice: if symptoms persist or worsen, see a doctor.</p>';L.done();}
  ['A horse','A zebra'].forEach((t,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=t;b.onclick=()=>{if(picked)return;picked=true;b.classList.add('sel');
    if(j===0){reveal(L.fb(document.createElement('div'),'Horses are the common cause here, so they’re the first bet.','ok').outerHTML);return;}
    L.$('#hzz').setAttribute('opacity',1);
    L.$('#hzc').innerHTML='<span class="oc-lab">Zebras exist. What would make it a zebra?</span><div id="hzq"></div>';
    [['The hoofbeats sound scary',0],['A fact a horse can’t explain',1]].forEach(o=>{const x=document.createElement('button');x.className='opt';x.textContent=o[0];
      x.onclick=()=>{if(L.$('#hzq .ok'))return;L.$('#hzq .fb')&&L.$('#hzq .fb').remove();
        if(o[1]){x.classList.add('ok');reveal(L.fb(document.createElement('div'),'Right: only facts the common cause can’t explain move you to the rare one. Until then, start with the horse.','ok').outerHTML);}
        else{x.classList.add('no');L.fb(L.$('#hzq'),'A feeling isn’t a fact. Scary-sounding hoofbeats are still most likely a horse.','no');}};
      L.$('#hzq').appendChild(x);});};L.$('#hz').appendChild(b);});}},

{part:2,src:'Occam’s Razor · Occam’s Razor in Leadership',

{part:2,src:'Occam’s Razor · Occam’s Razor in the Medical Field',
 solve:async L=>{L.tg.toggle(0);L.tg.toggle(1);},
 run(L){
  L.h(L.kick('learn','Explore · the razor on the tangle')+'<h1 class="q">Ira has afternoon headaches and a tangle of explanations. Tap branches to trim them.</h1>'+
   '<p class="small" style="margin:0">Each knot is a moving part. Coloured badges show which facts a branch explains. Trim two branches and watch the facts.</p><div id="tg"></div>');
  let n=0,fin=false;
  L.tg=ocTangle(L,L.$('#tg'),Object.assign({},OC_HEAD,{onChange(t,e){if(t.cut.has(e.i))n++;
    if(!fin&&n>=2){fin=true;L.sheet('info','Shortest isn’t enough: it must explain everything','Screen glare and the office lights are the shortest branches, but neither explains fact B, so they aren’t equally good. The rare illness explains everything with five parts that must all be true. The sleep-and-coffee branch explains everything with three. That’s the one to check first.');L.done();}}}));

{part:2,src:'Occam’s Razor · Simplicity Can Increase Efficiency',pts:1,
 solve:async L=>{[0,1,3].forEach(i=>L.tg.toggle(i));L.$('#oc').click();},
 run(L){
  L.h(L.kick('pr','Challenge · trim the tangle')+'<h1 class="q">Orders “vanish” after the switchover. Trim until only the simplest branch that explains every fact is left.</h1><div id="tg"></div>'+
   '<div class="oc-ctl"><button class="btn pri" id="oc">'+L.ic('check')+'Check it first: this one</button></div>');
  let first=true,fin=false;
  L.tg=ocTangle(L,L.$('#tg'),OC_ORD);
  L.$('#oc').onclick=()=>{if(fin)return;const k=L.tg.kept(),ok=k.length===1&&k[0]===2;if(first){L.award(ok);first=false;}
    if(ok){fin=true;L.$('#oc').disabled=true;L.tg.wrap.querySelector('.oc-br[data-i="2"]').classList.add('keep');
      L.sheet('ok','Two parts, every fact explained','Ira walks to the front desk: the old spreadsheet is still open, with Tuesday’s orders in it. No sabotage needed. Checking the simple story first took five minutes instead of a week chasing a saboteur.');L.done();return;}
    let m;const u=L.tg.unex();
    if(!k.length)m='Nothing is left to explain the facts. Put back the branch that explains all of them with the fewest parts.';
    else if(u.length)m='Fact '+u.map(j=>OC_ORD.facts[j][0]).join(' and ')+' is unexplained. The razor only chooses between branches that explain every fact.';
    else if(k.includes(0))m='Sabotage explains every fact, but needs four things to all be true. Trim it: another branch explains the same facts with two.';
    else m='Keep only one branch: the shortest that still explains every fact.';
    L.tg.msg(m,'no');};}},

/* ---------- PART 4: USE IT, KNOW ITS LIMITS ---------- */
{part:3,src:'Course application · built on Occam’s Razor',pts:1,
 solve:async L=>{L.$('#mb').click();L.$('#mb').click();L.$$('#mt .oc-br')[1].click();await L.sleep(30);L.$$('#mq .opt')[1].click();},
 run(L){
  L.h(L.kick('pr','One-minute move')+'<h1 class="q">Wynn hasn’t answered Ira’s calls all afternoon. Ira’s mind races. Run the move.</h1>'+
   L.note('How this course applies the book: a one-minute routine built only from the chapter’s own steps.','compass')+
   '<div class="oc-steps" id="msp"><span>1 · List</span><span>2 · Count parts</span><span>3 · Simplest that fits all</span><span>4 · Check it first</span></div>'+
   '<div class="oc-say" id="msay" aria-live="polite"></div><div class="oc-ctl"><button class="btn pri" id="mb"></button></div><div id="mt"></div><div id="mq"></div>');
  let s=0,first=true,t=null,fin=false;
  const say=(h,x)=>L.$('#msay').innerHTML='<b class="k">'+h+'</b>'+x;
  function go(n){s=n;L.$$('#msp span').forEach((p,j)=>{p.className=j<n?'dn':j===n?'cur':'';});const b=L.$('#mb');
    if(n===0){say('STEP 1 · LIST','Write down every explanation in Ira’s head, the scary one too.');b.innerHTML=L.ic('list')+'List the explanations';}
    if(n===1){say('STEP 2 · COUNT PARTS','How many things must all be true for each one?');b.innerHTML=L.ic('pencil')+'Count the moving parts';}
    if(n===2){b.parentNode.hidden=true;say('STEP 3 · SIMPLEST THAT FITS ALL','Tap the branch to check first: the fewest parts that still explains facts A and B.');}
    if(n===3){say('STEP 4 · CHECK IT FIRST','Phone on silent is the first bet, not a certainty. What’s Ira’s quick check?');
      ['Drive the two hours to Wynn’s right now, just in case','Ring the landline and text again; if still nothing by evening, ask a neighbour to knock','Decide it’s the phone and stop checking for the day'].forEach((o,j)=>{const x=document.createElement('button');x.className='opt';x.textContent=o;
        x.onclick=()=>{if(fin)return;L.$('#mq .fb')&&L.$('#mq .fb').remove();
          if(j===1){fin=true;x.classList.add('ok');L.$$('#msp span').forEach(p=>p.className='dn');
            L.sheet('ok','Check the simple story, keep a way out','Ira rings the landline. Twenty minutes later Wynn calls back: the mobile was on silent in the garden. The check was quick, and if the facts had ruled it out, Ira had the next step ready.');L.done();}
          else{x.classList.add('no');L.fb(L.$('#mq'),j===0?'That acts on the zebra before checking the horse. A quick check comes first.':'That skips the check. The simplest story is preferred until proven otherwise, so you still test it.','no');}};
        L.$('#mq').appendChild(x);});setTimeout(()=>{const q=L.$('#mq');if(q&&q.isConnected)q.scrollIntoView({behavior:'smooth',block:'nearest'});},120);}}
  L.$('#mb').onclick=()=>{if(s===0){t=ocTangle(L,L.$('#mt'),Object.assign({},OC_WYNN,{onTap(i,el){if(s!==2||fin)return;const ok=i===1;if(first){L.award(ok);first=false;}
      if(ok){[0,2].forEach(q=>t.toggle(q,true));el.classList.add('keep');t.msg('');go(3);}
      else{L.shake(el);t.msg(i===0?'That fits both facts too, but needs three things to all be true. Start with the one-part story.':'Fewer parts than a fall, but it can’t explain fact B: a broken phone wouldn’t show texts as delivered.','no');}}}));go(1);}
    else if(s===1){t.showParts(true);go(2);}};
  go(0);}},

{part:3,src:'Occam’s Razor · Conclusion',pts:1,run(L){
  L.h(L.kick('pr','Until proven otherwise')+'<h1 class="q">A different afternoon: still no answer from Wynn by evening. The landline rings out, and the neighbour knocks with no reply, though Wynn’s car is outside. What now?</h1>'+
   L.note('How this course applies the book: the razor says move on to the next explanation; the action is ours.','compass'));
  L.mc(L.card,['Stick with “phone on silent”: it’s still the simplest story','The simple story no longer fits every fact: act on the next one and get someone in to check on Wynn','Assume the very worst and do nothing until morning'],1,
   'The razor keeps the simplest story only until the facts rule it out. A silent phone doesn’t explain an unanswered door, so Ira moves on to the next explanation and gets help to Wynn now.',
   'The simplest explanation is preferred until proven otherwise. A silent phone doesn’t explain the unanswered door, so the facts have moved. Ira acts on the next explanation and gets someone in to check on Wynn.');}},

{part:3,src:'Occam’s Razor · A Few Caveats',
 solve:async L=>{L.str.toggle(0);L.$$('#ft .chip')[1].click();L.str.toggle(2);L.str.toggle(4);},
 run(L){
  L.h(L.kick('learn','Limit · irreducibly complex')+'<h1 class="q">Some things only work with all their parts. Try to simplify these.</h1>'+
   '<div class="oc-chips" id="ft"></div><div id="fh"></div><div id="fc"></div>');
  let fell=false,tidy=false,fin=false;
  function chk(){if(!fin&&fell&&tidy){fin=true;L.$('#fc').innerHTML=L.prose('Powered flight isn’t a miracle, but it isn’t simple: it took a precise mix of lift, drag, airflow and combustion. The same goes for how frauds grow. Trim only what the explanation doesn’t need.');
    L.sheet('info','Simplify only while it stays accurate','Some things are '+L.g('irreducible','irreducibly complex')+', and the razor can’t make them simple. Like tidying code, you can cut what does no work, but cut a part that matters and it breaks.');L.done();}}
  function fly(){L.$('#fh').innerHTML='<svg class="oc-svg" viewBox="0 0 320 84" role="img" aria-label="A plane that stays up only while every part of flight is present"><rect width="320" height="84" rx="14" fill="var(--soft)"/><path d="M0 76H320" stroke="var(--line2)" stroke-width="2" stroke-dasharray="6 6"/>'+
     '<g class="oc-plane" id="fpl"><path d="M110 40h86l20-14h10l-8 18 8 4h-30l-22 0-20 18h-12l10-18h-42z" fill="var(--card)" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/><path d="M146 40l-14-18h12l26 18" fill="var(--card)" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/></g></svg><div id="fs"></div>';
    L.str=ocString(L,L.$('#fs'),{labels:['Lift','Low drag','Airflow','Combustion'],need:[1,1,1,1],trim:true,title:'Powered flight',
      ro:s=>s.works?'All '+s.n+' parts in place: <b>it stays in the air</b>. Tap a part to trim it.':'Missing a part flight needs: <b>it can’t stay up</b>.',
      onChange(e,s){L.$('#fpl').style.transform=s.works?'none':'translate(30px,26px) rotate(18deg)';if(!s.works){fell=true;chk();}}});}
  function code(){L.$('#fh').innerHTML='<div id="fs"></div>';
    L.str=ocString(L,L.$('#fs'),{labels:['Read the order','Check the size','Check the size again','Send to print','Old unused setting'],need:[1,1,0,1,0],trim:true,title:'Tidying code (the book’s example; steps made up)',
      ro:s=>(s.works?'<b>Still does its job</b>':'<b>Broken:</b> it no longer does its job')+' · '+s.n+' parts. Trim what does no work.',
      onChange(e,s){if(s.works&&s.off.has(2)&&s.off.has(4)){tidy=true;chk();}}});}
  [['Powered flight',fly],['Tidying code',code]].forEach((t,j)=>{const b=document.createElement('button');b.className='chip'+(j===0?' sel':'');b.textContent=t[0];b.onclick=()=>{L.$$('#ft .chip').forEach((x,q)=>x.classList.toggle('sel',q===j));t[1]();};L.$('#ft').appendChild(b);});
  fly();}},

{part:3,src:'Occam’s Razor · A Few Caveats',
 solve:async L=>{L.$$('#ep .chip').forEach(b=>b.click());},
 run(L){
  const P=[
   ['Not equally good',h=>{ocTangle(L,h,{root:'Ira’s afternoon headaches',facts:OC_HEAD.facts,br:[OC_HEAD.br[1],OC_HEAD.br[2]],showParts:true});},
    'Screen glare has fewer parts, but leaves fact B unexplained. The razor only chooses between explanations with <b>equal explanatory power</b>. Here they aren’t equal, so the longer branch wins.'],
   ['Several real causes',h=>{ocTangle(L,h,{root:'Ira’s poor sleep',facts:[['A','Takes ages to fall asleep'],['B','Wakes at 3 a.m., thinking'],['C','Worse after late-work days']],br:[{lab:'Late coffee',parts:['coffee after 4 p.m.'],ex:[0,2]},{lab:'Worry about Wynn’s fall',parts:['lies awake worrying'],ex:[1]}],showParts:true});},
    'Trim either branch and a fact goes unexplained. Ira’s sleep may truly have two causes. The razor can’t create <b>artificial simplicity</b>: you simplify only as far as the explanation stays accurate.'],
   ['Zebra after all',h=>{ocTangle(L,h,{root:'Ira’s afternoon headaches, three weeks on',facts:OC_HEAD.facts.concat([['D','Still there after three weeks of good sleep, no late coffee']]),br:[OC_HEAD.br[2],OC_HEAD.br[1]],showParts:true});},
    'New fact D rules out the simple story, and nothing on the tree explains it. Simplest is preferred <b>until proven otherwise</b>, so the razor says move to the next explanation. How this course applies it: Ira books a doctor, a Lifer for this question. (Not medical advice.)'],
   ['Extraordinary claim',h=>{ocString(L,h,{labels:['It jams at odd times','Something beyond known nature'],flags:[0,'q'],noRo:true,unlit:true,title:'“The new printer is haunted”'});ocString(L,h,{labels:['A worn roller','Damp paper in the tray'],noRo:true,title:'The simpler story'});},
    'The first story needs a part nobody has ever confirmed. Following Hume and Sagan: an extraordinary claim needs extraordinary proof. Check the roller and the paper first.']];
  L.h(L.kick('ex','Edge cases and limits')+'<h1 class="q">Where does the razor stop helping? Try each case.</h1><div class="oc-chips" id="ep"></div><div id="eh"></div><div id="ef"></div>');
  const seen=new Set();let fin=false;
  P.forEach((p,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=p[0];b.onclick=()=>{L.$$('#ep .chip').forEach((x,q)=>x.classList.toggle('sel',q===j));
    L.$('#eh').innerHTML='';p[1](L.$('#eh'));L.$('#ef').innerHTML='';L.fb(L.$('#ef'),p[2],'info');seen.add(j);
    if(!fin&&seen.size===P.length){fin=true;L.sheet('info','A tendency, not an iron law','The razor works when explanations fit the facts equally well. A story that’s too simple fails to capture reality; one that’s too complex collapses under its own weight. Know which side you’re on.');L.done();}};L.$('#ep').appendChild(b);});
  L.$('#eh').innerHTML='<p class="oc-ro">Pick a case.</p>';}},

{part:3,src:'Occam’s Razor · A Few Caveats',pts:6,run(L){
  L.h(L.kick('pr','Razor or not?')+'<h1 class="q">Sort Ira’s week: does the simple explanation get checked first, or do the facts need more parts?</h1>');
  L.buckets(L.card,['Check the simple one first','The facts need more parts'],[
   ['Remy is quiet at dinner. Tired after a long school day fits; so does “Remy is planning to leave”.',0,'Both fit the one fact, and one needs far fewer parts. Ask Remy how the day went before writing a drama.'],
   ['The on-time rate fell. “Staff are lazy” is short, but doesn’t explain why only night-shift orders dropped.',1,'A short story that misses a fact isn’t equally good. Look for one that explains the night shift too.'],
   ['Ira’s laptop crawls. Forty browser tabs are open; Ira wonders about hackers.',0,'Forty tabs explain the slowness with one part. Close them before chasing hackers.'],
   ['The switchover finally ran smoothly. Training, clean data and a good go-live plan all played a part.',1,'Several real causes. Crediting only one would be artificial simplicity.'],
   ['A client’s order is late. The van left after lunch, which explains every detail.',0,'One part, every fact explained. That’s the razor’s home ground.'],
   ['A supplier’s invoices hid an overcharge for years, through several people and a lot of paperwork.',1,'Frauds grow through a complex mix of design, accident and luck. Don’t force a one-part story onto it.']],
   'The razor picks the simplest explanation <b>that still fits every fact</b>. When a short story misses a fact, or the truth really has many parts, trimming would make it wrong.');}},

{part:3,src:'Course application · built on Occam’s Razor',
 solve:async L=>{L.$('#y0').value='My manager said “Quick word tomorrow?”';L.$('#y1').value='I’m about to be let go';L.$('#y2').value='They want to plan next week';L.$('#y3').value='Ask what it’s about';
   ['#y0','#y1','#y2','#y3'].forEach(s=>L.$(s).dispatchEvent(new Event('input',{bubbles:true})));const r=L.$('#yn1');r.value=5;r.dispatchEvent(new Event('input',{bubbles:true}));L.$('#yb').click();},
 run(L){
  L.h(L.kick('pr','Your turn · ungraded')+'<h1 class="q">One dramatic story you told yourself this week. Wire it up, then trim it.</h1>'+
   L.note('How this course applies the book: the one-minute move on your own week.','compass')+
   '<label class="oc-lab" for="y0">What actually happened (the facts)</label><input class="oc-in" id="y0" maxlength="70" placeholder="e.g. a friend didn’t reply all day">'+
   '<label class="oc-lab" for="y1">The dramatic story</label><input class="oc-in" id="y1" maxlength="60" placeholder="e.g. they’re upset with me">'+
   '<label class="oc-sl"><span class="h"><span>Its moving parts</span><b id="yv1">4</b></span><input type="range" id="yn1" min="2" max="10" step="1" value="4" aria-label="Moving parts in the dramatic story, 2 to 10"></label>'+
   '<label class="oc-lab" for="y2">The simple story that fits the same facts</label><input class="oc-in" id="y2" maxlength="60" placeholder="e.g. a busy day">'+
   '<label class="oc-sl"><span class="h"><span>Its moving parts</span><b id="yv2">1</b></span><input type="range" id="yn2" min="1" max="5" step="1" value="1" aria-label="Moving parts in the simple story, 1 to 5"></label>'+
   '<label class="oc-lab" for="y3">What I’ll check first</label><input class="oc-in" id="y3" maxlength="60" placeholder="e.g. send a light message">'+
   '<div class="oc-ctl"><button class="btn pri" id="yb" disabled>'+L.ic('play')+'Wire both stories</button></div><div id="yo"></div>');
  const v=s=>L.$(s).value.trim();
  function chk(){L.$('#yv1').textContent=L.$('#yn1').value;L.$('#yv2').textContent=L.$('#yn2').value;L.$('#yb').disabled=!['#y0','#y1','#y2','#y3'].every(s=>v(s).length>1);}
  ['#y0','#y1','#y2','#y3','#yn1','#yn2'].forEach(s=>L.$(s).addEventListener('input',chk));
  L.$('#yb').onclick=()=>{const a=+L.$('#yn1').value,b=+L.$('#yn2').value;L.$('#yo').innerHTML='';
    const ro=k=>s=>'<b>'+k+'</b> thing'+(k>1?'s':'')+' must all be true';
    ocString(L,L.$('#yo'),{n:a,p:.95,title:'“'+L.esc(v('#y1'))+'” · '+a+' parts',ro:ro(a)});ocString(L,L.$('#yo'),{n:b,p:.95,title:'“'+L.esc(v('#y2'))+'” · '+b+' part'+(b>1?'s':''),ro:ro(b)});
    L.$('#yo').insertAdjacentHTML('beforeend','<p class="oc-tt">More parts = more ways to be wrong.</p>');
    L.sheet('info','Your first check','<b>Check first:</b> '+L.esc(v('#y3'))+'.<br>Write one line in your decision journal: the facts, both stories, your first check. If the facts later rule out the simple story, move on, and note what happened.');L.done();};}},

{part:3,src:'Course application · built on Occam’s Razor',run(L){
  L.h(L.kick('learn','Your decision map')+'<h1 class="q">Occam’s razor starts the “Why did this happen?” row</h1>'+
   L.note('How this course applies the book. Lesson 10 fills the last dashed gap.','compass')+
   '<div id="dm"></div>'+
   '<p class="small">Explaining a symptom, a glitch, a missed message or a number that moved? Start with the razor, then check base rates, then go and look.</p>');
  L.$('#dm').innerHTML=OC_ROWS.map(r=>'<div class="oc-dm'+(r[1][0]==='occam'?' hot':'')+'"><b>'+r[0]+(r[1][0]==='occam'?' · start here':'')+'</b><div class="r">'+
    r[1].map((k,j)=>(j?'<span class="ar">→</span>':'')+'<span class="m'+(k==='occam'?' cur':OC_M[k][1]>9?' tbd':'')+'">'+(OC_M[k][1]>9?'?':OC_M[k][0])+'</span>').join('')+'</div></div>').join('');
  L.done();}}
  ]
});
