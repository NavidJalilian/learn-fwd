/* ---------- the competence rings ---------- */
const CX=160,CY=118,CR=88,CC=0.58;
const ccAdv=r=>r<=CC?3:Math.max(-3,3*(1-r)/(1-CC));
const ccConf=r=>r<=CC?3:Math.max(0.5,3-1.6*(r-CC));
const ccF=v=>(v>0.05?'+':v<-0.05?'−':'')+Math.abs(v).toFixed(1);
const ccClamp=(v,a,b)=>Math.max(a,Math.min(b,v));
/* o: {lm:[[x,y,label,lx,ly,anchor]], tx,ty, s(scale), boost(confidence), plus(advantage), ghost(scale of a dashed old ring), ghostLab,
       adviser(bool), drag, steps, bar, fadeLm, change(api)} */
function ccRings(L,host,o){
  o=Object.assign({lm:[],tx:CX,ty:CY,s:1,boost:0,plus:0,ghost:0,ghostLab:'before',adviser:false,drag:false,steps:false,bar:true,fadeLm:false,who:'Ira'},o||{});
  const st={tx:o.tx,ty:o.ty,s:o.s,boost:o.boost,plus:o.plus,ghost:o.ghost,ghostLab:o.ghostLab,adviser:o.adviser,lm:o.lm,fadeLm:o.fadeLm};
  const w=document.createElement('div');
  w.innerHTML='<svg class="cc-svg'+(o.drag?' drag':'')+'" viewBox="0 0 320 236" role="img" aria-label="Competence rings: a solid core, a fading edge and open Stranger ground beyond, with a token for '+o.who+'"></svg>'+
   (o.steps?'<div class="cc-row"><button class="btn cc-bin" type="button">Move in</button><button class="btn cc-bout" type="button">Move out</button></div>':'')+
   (o.bar?'<div class="cc-leg"><span><i class="sw"></i>real advantage (bar)</span><span><i class="tri"></i>how sure '+o.who+' feels</span></div>'+
     '<div class="cc-bar"><div class="cc-trk"><i class="cc-fill"></i><span class="cc-zero"></span><em class="cc-feel"></em></div><div class="cc-ends"><span>− others know more</span><span>'+o.who+' knows more +</span></div></div>'+
     (o.ro===false?'':'<div class="cc-ro" aria-live="polite"></div>'):'');
  host.appendChild(w);
  const svg=w.querySelector('svg');
  const api={st,w,r:()=>Math.hypot(st.tx-CX,st.ty-CY)/(CR*st.s),
    adv:()=>Math.min(3,ccAdv(api.r())+st.plus),conf:()=>Math.min(3,ccConf(api.r())+st.boost),
    zone(){const r=api.r();return r<=CC?'Lifer core':r<=1?'Near the edge':'Stranger ground';},
    set(p){Object.assign(st,p);draw();},
    place(x,y){st.tx=ccClamp(x,16,304);st.ty=ccClamp(y,16,220);draw();if(o.change)o.change(api);}};
  function near(){let best=null,bd=26;st.lm.forEach(l=>{const d=Math.hypot(l[0]-st.tx,l[1]-st.ty);if(d<bd){bd=d;best=l[2];}});return best;}
  function draw(){
    const R=CR*st.s,rc=R*CC;let h='<rect x="1" y="1" width="318" height="234" rx="16" fill="var(--soft)"/>';
    h+='<text x="308" y="20" text-anchor="end" class="cc-t">Stranger ground</text>';
    if(st.ghost){const g=CR*st.ghost;h+='<circle cx="'+CX+'" cy="'+CY+'" r="'+g+'" fill="none" stroke="var(--faint)" stroke-width="1.5" stroke-dasharray="3 4"/><text x="'+CX+'" y="'+Math.min(230,CY+g+14)+'" text-anchor="middle" class="cc-t cc-h">'+st.ghostLab+'</text>';}
    h+='<circle cx="'+CX+'" cy="'+CY+'" r="'+R.toFixed(1)+'" fill="var(--h2)" fill-opacity=".12" stroke="var(--h2)" stroke-width="1.5" stroke-dasharray="6 4" style="transition:r .4s"/>';
    h+='<circle cx="'+CX+'" cy="'+CY+'" r="'+rc.toFixed(1)+'" fill="var(--h2)" fill-opacity=".28" stroke="var(--h2)" stroke-width="2"/>';
    if(R>44)h+='<text x="'+CX+'" y="'+(CY-R+14).toFixed(1)+'" text-anchor="middle" class="cc-t" style="fill:var(--h2)">the edge</text>';
    if(rc>36)h+='<text x="'+CX+'" y="'+(CY-rc+16).toFixed(1)+'" text-anchor="middle" class="cc-t" style="fill:var(--h2)">Lifer core</text>';
    st.lm.forEach(l=>{const out=st.fadeLm&&Math.hypot(l[0]-CX,l[1]-CY)>R;
      h+='<circle cx="'+l[0]+'" cy="'+l[1]+'" r="4.5" fill="'+(out?'none':'var(--ink)')+'" stroke="'+(out?'var(--faint)':'var(--ink)')+'" stroke-width="1.5"/>'+
         '<text x="'+l[3]+'" y="'+l[4]+'" text-anchor="'+(l[5]||'middle')+'" class="cc-t cc-h" style="fill:'+(out?'var(--faint)':'var(--ink)')+(out?';text-decoration:line-through':'')+'">'+l[2]+'</text>';});
    if(st.adviser){const ax=272,ay=58;
      h+='<line x1="'+ax+'" y1="'+ay+'" x2="'+st.tx+'" y2="'+st.ty+'" stroke="var(--h3)" stroke-width="2" stroke-dasharray="5 4"/>'+
        '<circle cx="'+ax+'" cy="'+ay+'" r="28" fill="var(--h3)" fill-opacity=".18" stroke="var(--h3)" stroke-width="1.5"/>'+
        '<circle cx="'+ax+'" cy="'+ay+'" r="12" fill="var(--h3)"/><text x="'+ax+'" y="'+(ay+4)+'" text-anchor="middle" style="font:700 11px var(--sans);fill:var(--card)">M</text>'+
        '<text x="312" y="'+(ay+44)+'" text-anchor="end" class="cc-t cc-h" style="fill:var(--h3)">mechanic’s circle</text>'+
        '<text x="312" y="'+(ay+58)+'" text-anchor="end" class="cc-t cc-h" style="fill:var(--h3)">advice + their gain</text>';}
    h+='<circle cx="'+st.tx.toFixed(1)+'" cy="'+st.ty.toFixed(1)+'" r="15" fill="var(--pri)" stroke="var(--card)" stroke-width="3"/><text x="'+st.tx.toFixed(1)+'" y="'+(st.ty+4).toFixed(1)+'" text-anchor="middle" style="font:700 11px var(--sans);fill:var(--pri-ink)">'+o.who+'</text>';
    svg.innerHTML=h;
    if(!o.bar)return;
    const a=api.adv(),c=api.conf(),f=w.querySelector('.cc-fill');
    if(a>=0){f.style.left='50%';f.style.width=(a/6*100)+'%';f.style.background='var(--ok-strong)';}
    else{f.style.left=(50+a/6*100)+'%';f.style.width=(-a/6*100)+'%';f.style.background='var(--no-strong)';}
    w.querySelector('.cc-feel').style.left=(50+c/6*100)+'%';
    const nm=near(),ro=w.querySelector('.cc-ro');if(!ro)return;
    ro.innerHTML='<span>Zone</span><b>'+api.zone()+'</b><span>Advantage</span><span style="color:var(--ink)"><b>'+ccF(a)+'</b> · '+(a>0.05?o.who+' knows more than most':a<-0.05?'others know more':'about even')+'</span><span>Feels sure</span><span style="color:var(--ink)"><b>'+ccF(c)+'</b> of 3</span>'+(st.lm.length?'<span>Deciding</span><span style="color:var(--ink)">'+(nm||'nothing in particular')+'</span>':'');}
  if(o.drag){let dragging=false;
    const mv=e=>{const r=svg.getBoundingClientRect();api.place((e.clientX-r.left)*320/r.width,(e.clientY-r.top)*236/r.height);};
    svg.addEventListener('pointerdown',e=>{dragging=true;try{svg.setPointerCapture(e.pointerId);}catch(_){}mv(e);});
    svg.addEventListener('pointermove',e=>{if(dragging)mv(e);});
    ['pointerup','pointercancel'].forEach(t=>svg.addEventListener(t,()=>{dragging=false;}));}
  if(o.steps){const step=sg=>{const dx=st.tx-CX,dy=st.ty-CY,d=Math.hypot(dx,dy);let ux=-0.81,uy=-0.585;if(d>1){ux=dx/d;uy=dy/d;}
      const nd=Math.max(0,d+sg*CR*0.25);api.place(CX+ux*nd,CY+uy*nd);};
    w.querySelector('.cc-bin').onclick=()=>step(-1);w.querySelector('.cc-bout').onclick=()=>step(1);}
  draw();return api;}
const CC_ENGINE=[272,206,'Car engines',264,228,'end'];

 ['A tempting quick fix, purchase or shortcut',['','']],['A goal with no clear path',['','','']],['Choosing between uncertain options (a big bet)',['','','','','Circle']],['Stuck with “the way it’s done”',['','']]];
const ccStrip=()=>'<div class="cc-strip"><div class="hd">YOUR DECISION MAP SO FAR · HOW THIS COURSE APPLIES THE BOOK</div>'+CC_MAP.map(r=>'<div class="cc-sr"><b>'+r[0]+'</b><div class="cc-sl">'+r[1].map(m=>'<i class="'+(m==='Circle'?'me':m?'was':'')+'">'+(m||'·')+'</i>').join('')+'</div></div>').join('')+
 '<p class="small" style="margin:6px 0 2px">Teal: circle of competence, new today: first on “outside your expertise”, last (a final check) on “a big bet”. Purple: the map is not the territory, from the last lesson. Grey slots fill in later lessons.</p></div>';

 {who:'Bram says',claim:'“Clients always pay more for rush.”',right:1,opts:[

{part:0,src:'Warm-up',pts:1,run(L){

{part:0,src:'Circle of Competence · opening',run(L){

   '<svg class="cc-svg" viewBox="0 0 320 198" role="img" aria-label="Advantage by distance from what you know: high and flat in the core, falling to zero at the edge, negative past it">'+
   '<rect x="20" y="24" width="130" height="146" fill="var(--h2)" fill-opacity=".28"/><rect x="150" y="24" width="80" height="146" fill="var(--h2)" fill-opacity=".12"/><rect x="230" y="24" width="82" height="146" fill="var(--soft)"/>'+
   '<text x="85" y="16" text-anchor="middle" class="cc-t" style="fill:var(--h2)">core</text><text x="190" y="16" text-anchor="middle" class="cc-t" style="fill:var(--h2)">fading</text><text x="271" y="16" text-anchor="middle" class="cc-t">past the edge</text>'+

{part:0,src:'Circle of Competence · opening',
 solve:async L=>{for(let j=0;j<3;j++)L.$('#tq').children[j].click();},
 run(L){
  const LIT=[0,1,2,3];
  const Q=[['Where’s the bar?',2,true,'Surface knowledge. A few days in town is enough, so both can answer.'],
   ['Who owes money to whom?',4,false,'Built up over years of watching town life. The Stranger hasn’t seen it, and doesn’t know it’s missing.'],
   ['How high did the old flood reach?',9,false,'History the Stranger never lived through: how high the water came, and who helped whom.'],
   ['Is the empty plot worth the price?',11,false,'The Stranger’s real business. Without the town’s history, how can the Stranger know it’s the right land at the right price?']];
  L.h(L.kick('ex','The book’s picture')+'<h1 class="q">The Lifer and the Stranger: ask the town questions and see who can answer</h1>'+
   '<svg class="cc-svg" id="town" viewBox="0 0 320 188" role="img" aria-label="Two maps of the same small town. The Lifer knows every house. The Stranger knows four."></svg>'+
   '<p class="cc-hint" style="margin-top:8px">A '+L.g('lifer-stranger','Lifer')+' has lived in the town all their life. A Stranger arrived a few days ago, has chatted with a handful of locals, such as the mayor and the bartender, and feels they know the place. Ask at least three questions.</p>'+
   '<div class="cc-chips" id="tq"></div><div id="tx"></div>');
  let cur=-1;const asked=new Set();
  function house(x,y,lit,hl){const s=hl?'var(--pri)':lit?'var(--h3)':'var(--line2)',sw=hl?3:1.5;
    return '<path d="M'+x+' '+(y+10)+' L'+(x+13)+' '+y+' L'+(x+26)+' '+(y+10)+' Z" fill="'+(lit?'var(--h3)':'var(--soft2)')+'" fill-opacity="'+(lit?'.55':'1')+'" stroke="'+s+'" stroke-width="'+sw+'"/>'+
     '<rect x="'+x+'" y="'+(y+10)+'" width="26" height="16" fill="'+(lit?'var(--h3-bg)':'var(--soft2)')+'" stroke="'+s+'" stroke-width="'+sw+'"'+(lit?'':' stroke-dasharray="3 2"')+'/>'+
     '<rect x="'+(x+10)+'" y="'+(y+15)+'" width="6" height="6" fill="'+(lit?'var(--h3)':'var(--line2)')+'"/>';}
  function draw(){let h='<line x1="160" y1="4" x2="160" y2="184" stroke="var(--line)" stroke-width="1.5"/>';
    [0,1].forEach(t=>{const x0=t?168:8;h+='<text x="'+(x0+72)+'" y="16" text-anchor="middle" class="cc-tb">'+(t?'Stranger':'Lifer')+'</text>';
      for(let k=0;k<12;k++){const lit=t?LIT.includes(k):true;h+=house(x0+8+(k%4)*36,26+Math.floor(k/4)*34,lit,cur>=0&&Q[cur][1]===k);}
      h+='<text x="'+(x0+8)+'" y="149" class="cc-t">feels sure</text><rect x="'+(x0+76)+'" y="140" width="66" height="10" rx="5" fill="var(--pri)"/>';
      let ans='—',col='var(--muted)';if(cur>=0){const ok=!t||Q[cur][2];ans=ok?'✓ knows':'? no idea';col=ok?'var(--ok)':'var(--no)';}
      h+='<text x="'+(x0+72)+'" y="176" text-anchor="middle" style="font:700 13px var(--sans);fill:'+col+'">'+ans+'</text>';});
    L.$('#town').innerHTML=h;}
  Q.forEach((q,j)=>{const b=document.createElement('button');b.className='chip';b.type='button';b.textContent=q[0];
    b.onclick=()=>{cur=j;asked.add(j);[...L.$('#tq').children].forEach((x,z)=>x.classList.toggle('sel',z===j));draw();
      L.$('#tx').innerHTML='<div class="cc-box"><b class="t">'+q[0]+'</b>'+q[3]+'</div>';
      if(asked.size===3){L.sheet('info','Same confidence, different knowledge','Both feel sure. But the Lifer built a detailed web of knowledge over a lifetime, so the Lifer has more than one answer to most problems and can rule out bad choices fast. Any quiz the Lifer set would trip the Stranger up quickly, never the reverse. Deep knowledge of a complicated place can’t be bluffed.');L.done();}};
    L.$('#tq').appendChild(b);});
  draw();}},

{part:0,src:'Circle of Competence · opening',
 solve:async L=>{for(let j=0;j<4;j++)L.$('#evn').click();},
 run(L){

   [160,36,'1953','Tenzing Norgay worked for years as a porter, joined an attempt in 1935, and led the first successful ascent in 1953, after about twenty years in the region and many lucky failures.'],
   [112,134,'×16','About a quarter of later ascents were made by Sherpas, some going up as many as sixteen times. Most other climbers go once.'],

   '<svg class="cc-svg" id="ev" viewBox="0 0 320 200" role="img" aria-label="Mount Everest with four numbered markers along the route"></svg>'+
   '<div id="evt"></div><div class="cc-row"><button class="btn pri" id="evn" type="button">'+L.ic('arrow')+'Climb to marker 1</button></div>');
  let k=0;
  function draw(){let h='<path d="M8 194 L96 106 L124 122 L160 32 L196 94 L222 82 L312 194 Z" fill="var(--soft2)" stroke="var(--line2)" stroke-width="1.5"/>'+
     '<path d="M146 66 L160 32 L176 72 L166 64 L158 74 L152 64 Z" fill="var(--card)" stroke="var(--line2)"/>'+
     '<path d="M44 182 C 80 166, 104 146, 112 134 S 134 98, 142 88 S 156 50, 160 36" fill="none" stroke="var(--h3)" stroke-width="2.5" stroke-dasharray="5 5"/>';
    B.forEach((b,j)=>{const on=j<k;h+='<circle cx="'+b[0]+'" cy="'+b[1]+'" r="11" fill="'+(on?'var(--h3)':'var(--card)')+'" stroke="'+(on?'var(--h3)':'var(--line2)')+'" stroke-width="2"/>'+
      '<text x="'+b[0]+'" y="'+(b[1]+4)+'" text-anchor="middle" style="font:700 11px var(--sans);fill:'+(on?'var(--card)':'var(--muted)')+'">'+(j+1)+'</text>'+
      (on?'<text x="'+(b[0]+(j===1?16:15))+'" y="'+(b[1]+(j===1?2:4))+'" class="cc-tb" style="fill:var(--h3)">'+b[2]+'</text>':'');});

    else{this.disabled=true;L.sheet('info','Would you climb without a Lifer?','For most of us Everest is outside our circle in the scariest way: we don’t even know what we don’t know. Hard study might teach an outsider the gear, the training and the best season, but not how to tell when they know enough to get up and back alive.');L.done();}};}},

{part:0,src:'Circle of Competence · opening',pts:1,
 solve:async L=>{L.$('#pp').children[2].click();L.$('#pplay').click();},
 run(L){
  const S=[[150,118],[76,118],[35,118]];
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">Fieldnote offers Ira an operations job at a software start-up. At which stop does Ira’s advantage turn negative?</h1>'+
   '<div class="cc-chips" id="pp"></div><div id="ph"></div><div class="cc-row"><button class="btn pri" id="pplay" type="button" hidden>'+L.ic('play')+'Walk Ira out</button></div>');
  const ring=ccRings(L,L.$('#ph'),{tx:S[0][0],ty:S[0][1],lm:[[150,118,'A · print scheduling',150,98,'start'],[76,118,'B · ops, any firm',76,146,'middle'],[35,118,'C · software',14,96,'start']]});
  let p=null;
  ['At A · scheduling at Harrow & Finch','At B · operations in any firm','At C · the software start-up market'].forEach((t,j)=>{const b=document.createElement('button');b.className='chip';b.type='button';b.textContent=t;
    b.onclick=()=>{if(p!==null)return;p=j;b.classList.add('sel');L.$('#pplay').hidden=false;};L.$('#pp').appendChild(b);});
  L.$('#pplay').onclick=function(){this.remove();let j=1;
    const go=()=>{if(!ring.w.isConnected)return;ring.place(S[j][0],S[j][1]);j++;

      const ok=p===2;L.award(ok);
      L.sheet(ok?'ok':'no',ok?'You called it':'It turns negative at C','At B, Ira’s operations skills carry Ira to the edge: the advantage is close to zero, not below it. At C, the software market, the product and start-up pace are home ground for Fieldnote’s founder, so Ira is a Stranger there. And notice the “feels sure” marker: still well above zero.');L.done();};

{part:1,src:'Circle of Competence · How Do You Know When You Have a Circle of Competence?',run(L){

{part:1,src:'Circle of Competence · How Do You Know When You Have a Circle of Competence?',

{part:1,src:'Circle of Competence · How Do You Build and Maintain a Circle of Competence',
 solve:async L=>{const r=L.$('#yr');r.value=5;r.dispatchEvent(new Event('input',{bubbles:true}));L.$$('#sw .chip').forEach(b=>b.click());},
 run(L){
  L.h(L.kick('learn','Explore · the circle over time')+'<h1 class="q">A circle isn’t yours for life. Slide to year 5 with every switch off, then turn all three on.</h1>'+
   '<div id="th"></div><div class="cc-rh"><label for="yr"><b>Year <span id="yv">0</span></b> of 5</label><span class="small" id="yp"></span></div>'+
   '<input class="cc-rng" type="range" id="yr" min="0" max="5" step="1" value="0" aria-label="Year, 0 to 5">'+
   '<div class="cc-chips" id="sw" role="group" aria-label="The book’s three practices"></div><p class="cc-hint" id="yro" aria-live="polite"></p>');
  const LM=[[100,70,'Proofing',100,58],[226,86,'Press plans',226,74],[110,166,'Rush pricing',110,186],[214,160,'Client sign-offs',214,180]];
  const ring=ccRings(L,L.$('#th'),{bar:false,ghost:1,ghostLab:'year 0',lm:LM,fadeLm:true});
  const on=[false,false,false];let seenOff=false,seenOn=false,fin=false;
  ['Curiosity and learning','Honest monitoring (a journal)','Outside feedback'].forEach((t,j)=>{const b=document.createElement('button');b.className='chip';b.type='button';b.textContent=t;b.setAttribute('aria-pressed','false');
    b.onclick=()=>{on[j]=!on[j];b.classList.toggle('sel',on[j]);b.setAttribute('aria-pressed',String(on[j]));upd();};L.$('#sw').appendChild(b);});
  L.$('#yr').addEventListener('input',upd);
  function upd(){const y=+L.$('#yr').value,k=on.filter(Boolean).length,s=Math.max(0.3,1+y*(-0.12+0.05*k));ring.set({s});
    const inside=LM.filter(l=>Math.hypot(l[0]-CX,l[1]-CY)<=CR*s).length;
    L.$('#yv').textContent=y;L.$('#yp').textContent='Practices on: '+k+' of 3';
    L.$('#yro').innerHTML='Circle at <b style="color:var(--ink)">'+Math.round(s*100)+'%</b> of year 0 · Ira’s know-how still inside: <b style="color:var(--ink)">'+inside+' of 4</b>. Speeds are illustrative.';
    if(y>=4&&k===0)seenOff=true;if(y>=4&&k===3)seenOn=true;
    if(!fin&&seenOff&&seenOn){fin=true;L.sheet('info','The ground keeps moving','The world changes and knowledge goes out of date, so a circle you ignore quietly shrinks. The book names three practices that build and keep one: curiosity and learning (including from other people’s experience), honest monitoring of your own record, and outside feedback.');L.done();}}
  upd();}},

{part:1,src:'Circle of Competence · How Do You Build and Maintain a Circle of Competence',
 solve:async L=>{L.$('#bj').click();L.$('#bf').click();},
 run(L){
  L.h(L.kick('ex','Ira starts a decision journal')+'<h1 class="q">Some blind spots show up on paper. Others only show from outside.</h1>'+
   '<svg class="cc-svg" id="bs" viewBox="0 0 320 196" role="img" aria-label="Ira’s circle with a blind-spot wedge in two halves"></svg>'+
   '<div class="cc-row"><button class="btn" id="bj" type="button">'+L.ic('book')+'Read Ira’s journal</button><button class="btn" id="bf" type="button">'+L.ic('people')+'Ask the floor lead</button></div><div id="bo"></div>');
  const rev=[false,false];
  const pt=(a,r)=>[160+r*Math.cos(a*Math.PI/180),98+r*Math.sin(a*Math.PI/180)];
  const wedge=(a1,a2)=>{const p=pt(a1,82),q=pt(a2,82);return 'M160 98 L'+p[0].toFixed(1)+' '+p[1].toFixed(1)+' A82 82 0 0 1 '+q[0].toFixed(1)+' '+q[1].toFixed(1)+' Z';};
  function draw(){let h='<circle cx="160" cy="98" r="82" fill="var(--h2)" fill-opacity=".16" stroke="var(--h2)" stroke-width="2"/>'+
     '<text x="118" y="64" text-anchor="middle" class="cc-t" style="fill:var(--h2)">what Ira sees</text>';
    [[-30,20,'my record','var(--h3)',[246,66]],[20,70,'what others see','var(--h4)',[214,172]]].forEach((w,j)=>{const m=pt((w[0]+w[1])/2,58);
      h+='<path d="'+wedge(w[0],w[1])+'" fill="'+(rev[j]?w[3]:'var(--ink)')+'" fill-opacity="'+(rev[j]?'.32':'.16')+'" stroke="'+(rev[j]?w[3]:'var(--line2)')+'" stroke-width="1.5"/>'+
       '<text x="'+m[0].toFixed(1)+'" y="'+(m[1]+5).toFixed(1)+'" text-anchor="middle" style="font:700 14px var(--sans);fill:'+(rev[j]?w[3]:'var(--muted)')+'">'+(rev[j]?'✓':'?')+'</text>'+
       (rev[j]?'<text x="'+w[4][0]+'" y="'+w[4][1]+'" class="cc-tb" style="fill:'+w[3]+'">'+w[2]+'</text>':'');});
    h+='<circle cx="160" cy="98" r="15" fill="var(--pri)" stroke="var(--card)" stroke-width="3"/><text x="160" y="102" text-anchor="middle" style="font:700 11px var(--sans);fill:var(--pri-ink)">Ira</text>'+
      '<text x="160" y="194" text-anchor="middle" class="cc-t">'+(rev[0]&&rev[1]?'blind spot: lit from both sides':'grey wedge: Ira’s blind spot')+'</text>';
    L.$('#bs').innerHTML=h;}
  function chk(){if(rev[0]&&rev[1]){L.sheet('info','Inside view, outside view','The journal makes the thoughts in Ira’s head visible, so patterns show up. Feedback shows what Ira can’t see at all. Both sting the ego, which is exactly why they work. If you feel defensive, the book says, focus on the result you want.');L.done();}}
  draw();
  L.$('#bj').onclick=function(){if(rev[0])return;rev[0]=true;this.disabled=true;draw();
    L.$('#bo').insertAdjacentHTML('beforeend','<div class="cc-jr"><b>Mon · the car</b><br>Decision: the mechanic’s big repair quote<br>Lifer or Stranger? Stranger. Never looked under a hood.<br>I expect: some of it is needed, maybe not all.<br><i>Three weeks later:</i> I say yes too fast when I’m tired.</div>'+
     '<p class="small" style="margin:6px 0 0">A '+L.g('decision-journal','decision journal')+': the book’s private, honest record of your thinking and results.</p>');chk();};
  L.$('#bf').onclick=function(){if(rev[1])return;rev[1]=true;this.disabled=true;draw();
    L.$('#bo').insertAdjacentHTML('beforeend','<div class="cc-box"><b class="t">Outside feedback</b>The production floor lead: “Your rush plans look great on paper, but you never ask us how long a reprint takes.”<br><span class="small">In the book, top surgeon Atul Gawande hired a coach, embarrassed at first. He learned where his technique fell short, which no one else would point out, and got better at giving other doctors feedback.</span></div>');chk();};}},

{part:1,src:'Circle of Competence · How Do You Build and Maintain a Circle of Competence',pts:6,run(L){

{part:2,src:'Circle of Competence · How Do You Operate Outside a Circle of Competence?',
 solve:async L=>{L.$$('#om .cc-opt').forEach(b=>b.click());},
 run(L){

    h+='<circle cx="160" cy="132" r="15" fill="var(--pri)" stroke="var(--card)" stroke-width="3"/><text x="160" y="136" text-anchor="middle" style="font:700 11px var(--sans);fill:var(--pri-ink)">Ira</text>'+

{part:2,src:'Circle of Competence · The Problem of Incentives',
 solve:async L=>{L.$('#cm1').click();},
 run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">Elizabeth I knew where her circle ended, and built a council to cover the rest</h1>'+
   '<p class="cc-hint">She inherited a throne that was shaky, split over religion and nearly broke. In her first speech she said she would act on good advice. Compare two councils.</p>'+
   '<svg class="cc-svg" id="cs" viewBox="0 0 320 196" role="img" aria-label="A council table"></svg>'+
   '<div class="cc-row"><button class="btn" id="cm0" type="button">Yes-men who share her views</button><button class="btn" id="cm1" type="button">Elizabeth’s council</button></div><div class="cc-ro" id="cr" style="margin-top:10px"></div>');
  let mode=0,seen1=false;
  function draw(){const n=mode?5:11,pos=[];for(let k=0;k<n;k++){const a=(-90+(k+1)*360/(n+1))*Math.PI/180;pos.push([160+108*Math.cos(a),98+72*Math.sin(a)]);}
    const col=['var(--h1)','var(--h2)','var(--h3)','var(--h4)','var(--h2)'],tag=['old','new','old','new','new'];
    let h='<ellipse cx="160" cy="98" rx="72" ry="44" fill="var(--soft2)" stroke="var(--line2)" stroke-width="1.5"/>';
    if(mode)[[0,2],[1,3],[0,3],[2,4],[1,4]].forEach(p=>{h+='<line x1="'+pos[p[0]][0].toFixed(1)+'" y1="'+pos[p[0]][1].toFixed(1)+'" x2="'+pos[p[1]][0].toFixed(1)+'" y2="'+pos[p[1]][1].toFixed(1)+'" stroke="var(--h4)" stroke-width="2" stroke-dasharray="5 4"/>';});
    h+='<rect x="110" y="80" width="100" height="36" rx="10" fill="var(--soft2)"/><text x="160" y="94" text-anchor="middle" class="cc-tb" style="fill:var(--muted)">'+(mode?'open debate':'one view')+'</text><text x="160" y="110" text-anchor="middle" class="cc-t">'+(mode?'views challenged':'“agreed”')+'</text>';
    pos.forEach((p,k)=>{h+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="11" fill="'+(mode?col[k]:'var(--faint)')+'" stroke="var(--card)" stroke-width="2"/>';
      if(mode)h+='<text x="'+p[0].toFixed(1)+'" y="'+(p[1]+(p[1]>98?26:-16)).toFixed(1)+'" text-anchor="middle" class="cc-t">'+tag[k]+'</text>';});
    h+='<circle cx="160" cy="26" r="14" fill="var(--pri)" stroke="var(--card)" stroke-width="3"/><text x="160" y="30" text-anchor="middle" style="font:700 11px var(--sans);fill:var(--pri-ink)">E</text>';
    L.$('#cs').innerHTML=h;
    L.$('#cr').innerHTML=mode?'<span>Size</span><b>small, so real discussion can happen</b><span>Members</span><b>a blend of old hands and new</b><span>Views</span><b>varied, meant to be debated</b>':'<span>Size</span><b>large</b><span>Members</span><b>chosen for agreeing with her</b><span>Views</span><b>one, echoed back</b>';
    L.$('#cm0').classList.toggle('pri',!mode);L.$('#cm1').classList.toggle('pri',!!mode);}
  L.$('#cm0').onclick=()=>{mode=0;draw();};
  L.$('#cm1').onclick=()=>{mode=1;draw();if(!seen1){seen1=true;
    L.sheet('info','Many circles, combined by debate','Elizabeth admitted what she didn’t know. She avoided filling the council with yes-men, kept it small, mixed old and new, and wanted her advisers to argue. Open debate drew on each adviser’s circle. The book credits that advice, in large part, for turning unrest into stability. Seat counts here are illustrative.');L.done();}};
  draw();}},

{part:2,src:'Circle of Competence · The Problem of Incentives',pts:1,
 solve:async L=>{[0,2,4,5].forEach(j=>L.$('#mk').children[j].click());L.$('#mkc').click();},
 run(L){
  const O=[['Hold off on the big repair until it’s checked',1,'The book’s rule: defer major repair spending until you’ve confirmed it isn’t a bluff.'],
   ['Treat a weekend of repair videos as expertise',0,'A little learning lifts the “feels sure” marker, not the advantage. Ira is still a Stranger.'],
   ['Read up on the basics online',1,'Learn as you need it, while remembering you’re a Stranger.'],
   ['Say yes now: the mechanic is the expert',0,'The mechanic’s knowledge is real, and so is the incentive to sell a bigger repair.'],
   ['Ask which faults matter most, and why',1,'The variables-and-why question teaches Ira the reasoning, not just the verdict.'],
   ['Ask what the mechanic gains from each option',1,'Knowing the adviser’s incentive is what lets Ira weigh the advice.'],
   ['Ask the car dealer instead',0,'The dealer gains from selling a new car on finance. Swapping advisers doesn’t remove the incentive problem.']];
  L.h(L.kick('pr','Challenge · the mechanic’s quote')+'<h1 class="q">The car failed its inspection and the mechanic quotes a big repair. Pick every move that makes Ira’s decision safer, without pretending Ira is inside.</h1>'+
   '<div id="mh"></div><div class="cc-chips cc-col" id="mk"></div><div class="cc-row"><button class="btn pri" id="mkc" type="button">'+L.ic('check')+'Check my moves</button></div><div id="mf"></div>');
  const ring=ccRings(L,L.$('#mh'),{tx:CC_ENGINE[0],ty:CC_ENGINE[1],adviser:true,lm:[CC_ENGINE]});
  const sel=O.map(()=>false);let first=true,fin=false;
  O.forEach((o,j)=>{const b=document.createElement('button');b.className='chip';b.type='button';b.textContent=o[0];b.setAttribute('aria-pressed','false');
    b.onclick=()=>{if(fin)return;sel[j]=!sel[j];b.classList.toggle('sel',sel[j]);b.classList.remove('ok','no');b.setAttribute('aria-pressed',String(sel[j]));
      ring.set({boost:(sel[1]?1.8:0)+(sel[2]?0.4:0),plus:sel[2]?0.15:0});};
    L.$('#mk').appendChild(b);});
  L.$('#mkc').onclick=()=>{if(fin)return;const ok=O.every((o,j)=>sel[j]===!!o[1]);if(first){L.award(ok);first=false;}L.$('#mf').innerHTML='';
    if(ok){fin=true;[...L.$('#mk').children].forEach((b,j)=>{if(sel[j])b.classList.add('ok');});
      L.sheet('ok','A Stranger’s decision, made safer','Learn the basics, ask which faults matter and why, find out what the mechanic gains, and hold the big spend until a quick check confirms it. Ira’s token never moved inside, yet the decision got much safer.');L.done();}
    else{const bad=O.map((o,j)=>sel[j]!==!!o[1]?'<li>'+(o[1]?'Missing: ':'Not this: ')+'<b>'+o[0]+'</b>. '+o[2]+'</li>':'').join('');
      L.fb(L.$('#mf'),'<b>Not yet.</b><ul style="margin:6px 0 0;padding-left:18px">'+bad+'</ul>Change your picks and check again.','no');}};}},

{part:2,src:'Circle of Competence · How Do You Operate Outside a Circle of Competence?',pts:5,run(L){
  L.h('<div id="qk"></div><svg class="cc-svg" id="qp" viewBox="0 0 320 124" role="img" aria-label="Who Ira is asking: their circle, and whether they gain from Ira’s answer" style="margin-top:12px"></svg>');
  const WHO=[['lifer','ops Lifer'],['lifer','ops Lifer'],['founder','Fieldnote’s founder'],['lifer','ops Lifer'],['stranger','a friend']];
  const qp=()=>{const svg=L.$('#qp');if(!svg)return;const m=(L.$('#qk .kick')||L.$('#qk')).textContent.match(/(\d+) of/);const w=WHO[m?+m[1]-1:0];
    let h='<rect x="1" y="1" width="318" height="122" rx="14" fill="var(--soft)"/><text x="12" y="18" class="cc-t">who Ira is asking</text>'+
      '<circle cx="60" cy="66" r="15" fill="var(--pri)" stroke="var(--card)" stroke-width="3"/><text x="60" y="70" text-anchor="middle" style="font:700 11px var(--sans);fill:var(--pri-ink)">Ira</text><text x="60" y="104" text-anchor="middle" class="cc-t">a Stranger here</text>'+
      '<path d="M80 66 L206 66" stroke="var(--line2)" stroke-width="2" stroke-dasharray="5 4"/><path d="M212 66 L202 60 L202 72 Z" fill="var(--line2)"/><text x="140" y="58" text-anchor="middle" class="cc-t">asks</text>';
    if(w[0]!=='stranger')h+='<circle cx="252" cy="66" r="40" fill="var(--h3)" fill-opacity=".18" stroke="var(--h3)" stroke-width="1.5"/><text x="252" y="38" text-anchor="middle" class="cc-t" style="fill:var(--h3)">deep circle</text>';
    h+='<circle cx="252" cy="66" r="13" fill="'+(w[0]==='stranger'?'var(--faint)':'var(--h3)')+'"/><text x="252" y="70" text-anchor="middle" style="font:700 11px var(--sans);fill:var(--card)">'+(w[0]==='founder'?'F':w[0]==='lifer'?'L':'S')+'</text>'+
      '<text x="'+(w[0]==='lifer'?252:312)+'" y="'+(w[0]==='stranger'?100:120)+'" text-anchor="'+(w[0]==='lifer'?'middle':'end')+'" class="cc-tb cc-h">'+w[1]+(w[0]==='stranger'?': a Stranger too':'')+'</text>';
    if(w[0]==='founder')h+='<rect x="276" y="86" width="40" height="20" rx="6" fill="var(--h4-bg)" stroke="var(--h4)"/><text x="296" y="100" text-anchor="middle" style="font:700 11px var(--sans);fill:var(--h4)">£ if yes</text>';
    svg.innerHTML=h;};
  new MutationObserver(qp).observe(L.$('#qk'),{childList:true});
  L.quick(L.$('#qk'),'Fieldnote: ask like a Stranger',['Strong Stranger question','Weak question'],[
   ['Ira asks someone who has run operations at a software start-up for years: “Which things matter most in the first year of a job like this, and why?”',0,'The variables-and-why question: Ira learns their reasoning, not just their verdict.'],
   ['Ira asks the same person: “Would you take the job?”',1,'Ira would get an answer and learn nothing. Ask which variables matter and why.'],
   ['Ira asks Fieldnote’s founder: “Is this a great opportunity for me?”',1,'The founder gains if Ira says yes, and that shapes the answer. Consider the cartographer.'],
   ['Ira asks the industry Lifer: “Which parts of my situation are outside what you know?”',0,'Probing the limits of the Lifer’s circle tells Ira how far to lean on the advice.'],
   ['Ira asks a friend who once used scheduling software: “Is software a good industry?”',1,'The friend is a Stranger too, and the question asks for a verdict, not the variables.']]);
  qp();}},

/* ---------- PART 4: TEST IT AND USE IT ---------- */
{part:3,src:'Supporting Idea · Falsifiability',
 solve:async L=>{L.$$('#fc .btn').forEach(b=>b.click());},
 run(L){
  const C=[['The press jams more on humid days.','A month of humid days brings no more jams than dry days.',[3,9],'It could have failed, and didn’t. The claim survives, and it’s stronger for it.'],
   ['Some days are just cursed.','Nothing. A good day is “not a cursed one”; a bad day is.',null,'Every result fits, so the claim can’t be tested, and so it can’t be proven right either. Give it a rough likelihood instead.']];
  L.h(L.kick('learn','Supporting idea · falsifiability')+'<h1 class="q">A claim worth trusting says what would prove it wrong</h1>'+
   '<div id="fc"></div><p class="cc-cap">The philosopher Karl Popper said a real theory takes a risk: it can be shown wrong under stated conditions. Try hard to prove it wrong. If you fail, it gets stronger. Tap both tests.</p>');
  let n=0;
  C.forEach((c,j)=>{const d=document.createElement('div');d.className='cc-cl';
    d.innerHTML='<div class="who">Claim '+(j+1)+'</div><div class="cl">'+c[0]+'</div><div class="wr"><b>Proven wrong if:</b> '+c[1]+'</div><button class="btn" type="button">'+L.ic('flask')+'Try to prove it wrong</button><div class="res"></div>';
    d.querySelector('.btn').onclick=function(){this.remove();n++;
      const pic=c[2]?'<svg viewBox="0 0 220 74" style="width:100%;max-width:220px;display:block;margin:6px 0" role="img" aria-label="Jams on dry days: 3. Jams on humid days: 9. Illustrative."><rect x="84" y="8" width="'+c[2][0]*13+'" height="22" rx="5" fill="var(--soft2)" stroke="var(--line2)"/><text x="78" y="24" text-anchor="end" class="cc-t">dry days</text><text x="'+(90+c[2][0]*13)+'" y="24" class="cc-tb">'+c[2][0]+'</text>'+
        '<rect x="84" y="40" width="'+c[2][1]*13+'" height="22" rx="5" fill="var(--h2)" fill-opacity=".5" stroke="var(--h2)"/><text x="78" y="56" text-anchor="end" class="cc-t">humid days</text><text x="'+(90+c[2][1]*13)+'" y="56" class="cc-tb">'+c[2][1]+'</text></svg><div class="small">Jams in a month, illustrative.</div>'
        :'<svg viewBox="0 0 220 40" style="width:100%;max-width:220px;display:block;margin:6px 0" role="img" aria-label="Good day and bad day both fit the claim"><rect x="4" y="6" width="100" height="28" rx="8" fill="var(--soft2)"/><text x="54" y="25" text-anchor="middle" class="cc-tb">good day ✓ fits</text><rect x="114" y="6" width="100" height="28" rx="8" fill="var(--soft2)"/><text x="164" y="25" text-anchor="middle" class="cc-tb">bad day ✓ fits</text></svg>';
      d.querySelector('.res').innerHTML=pic+'<div class="fb '+(c[2]?'ok':'info')+'" style="margin-top:6px">'+c[3]+'</div>';
      if(n===2)L.done();};
    L.$('#fc').appendChild(d);});}},

{part:3,src:'Supporting Idea · Falsifiability',
 solve:async L=>{for(let j=0;j<4;j++)L.$('#ck25').click();L.$('#ck101').click();L.$('#ckw').click();},
 run(L){
  L.h(L.kick('learn','Explore · Russell’s chicken')+'<h1 class="q">Feed the chicken every day. Watch how sure it gets.</h1>'+

  let d=0,broke=false;const xd=k=>20+k*2.8,yc=k=>132-104*(k/(k+4));
  function chick(x,y,down){return '<g transform="translate('+x.toFixed(1)+' '+y.toFixed(1)+')'+(down?' rotate(90)':'')+'"><ellipse cx="0" cy="0" rx="11" ry="8" fill="var(--h3-bg)" stroke="var(--h3)" stroke-width="1.5"/><circle cx="9" cy="-8" r="5" fill="var(--h3-bg)" stroke="var(--h3)" stroke-width="1.5"/><path d="M14 -9 L19 -7 L14 -5 Z" fill="var(--h3)"/><path d="M6 -13 L8 -16 L10 -13" fill="none" stroke="var(--no-strong)" stroke-width="1.5"/></g>';}
  function draw(){let h='<text x="20" y="14" class="cc-t">how sure the chicken is that food comes tomorrow</text>'+
     '<line x1="20" y1="132" x2="304" y2="132" stroke="var(--line2)" stroke-width="1.5"/><text x="20" y="166" class="cc-t">day 1</text><text x="300" y="166" text-anchor="end" class="cc-t">day 100</text>';
    if(!broke){let g='M'+xd(1).toFixed(1)+' '+yc(1).toFixed(1);for(let k=2;k<=100;k++)g+=' L'+xd(k).toFixed(1)+' '+yc(k).toFixed(1);
      h+='<path d="'+g+'" fill="none" stroke="var(--faint)" stroke-width="1.5" stroke-dasharray="3 4" opacity=".7"/>';
      if(!d)h+='<text x="300" y="44" text-anchor="end" class="cc-t">the likely path: surer each day</text><text x="160" y="104" text-anchor="middle" class="cc-tb">Press “Run 25 days” to start feeding</text>';}
    for(let k=1;k<=d;k++)h+='<rect x="'+(xd(k)-1).toFixed(1)+'" y="138" width="1.8" height="10" fill="var(--ok-strong)"/>';
    if(d>0){let p='M'+xd(1).toFixed(1)+' '+yc(1).toFixed(1);for(let k=2;k<=d;k++)p+=' L'+xd(k).toFixed(1)+' '+yc(k).toFixed(1);
      if(broke)p+=' L'+(xd(100)+6).toFixed(1)+' 132';h+='<path d="'+p+'" fill="none" stroke="'+(broke?'var(--no-strong)':'var(--h3)')+'" stroke-width="3" stroke-linejoin="round"/>';}
    if(broke)h+='<text x="270" y="104" text-anchor="end" class="cc-tb" style="fill:var(--no)">day 101: no food</text>';
    const cx=d?xd(d):30,cy=d?yc(d)-14:118;h+=chick(broke?xd(100)-6:cx,broke?124:cy,broke);
    L.$('#ch').innerHTML=h;
    L.$('#chr').innerHTML=broke?'Day 101 · the farmer came for the chicken':'Day '+d+' · fed every day so far · sure: <b style="color:var(--ink)">'+(d?Math.round(d/(d+4)*100):0)+'%</b>';}
  draw();
  L.$('#ck25').onclick=function(){if(d>=100)return;d+=25;draw();if(d>=100){this.disabled=true;L.$('#ck101').disabled=false;}};
  L.$('#ck101').onclick=function(){if(d<100||broke)return;broke=true;this.disabled=true;draw();
    L.$('#cw').innerHTML='<div class="cc-box"><b class="t">Trend is not destiny</b>A hundred feedings looked like a law. They were a trend that depended on conditions, and conditions change. Popper warned against treating trends in history as fixed laws.</div><div class="cc-row"><button class="btn pri" id="ckw" type="button">'+L.ic('trend')+'Now: the worst so far</button></div><div id="cwf"></div>';
    L.$('#ckw').onclick=function(){this.remove();const H=[40,52,47,61,57,70,66,74];let s='<line x1="14" y1="118" x2="306" y2="118" stroke="var(--line2)"/>';
      H.forEach((v,k)=>{s+='<rect x="'+(18+k*31)+'" y="'+(118-v)+'" width="22" height="'+v+'" rx="4" fill="var(--h2)" fill-opacity=".55"/>';});
      s+='<rect x="266" y="6" width="26" height="112" rx="4" fill="var(--no-strong)"/><line x1="14" y1="44" x2="262" y2="44" stroke="var(--ink)" stroke-width="2" stroke-dasharray="6 4"/>'+
        '<text x="16" y="38" class="cc-tb">prepared for: the worst so far</text><text x="262" y="138" text-anchor="end" class="cc-t">the next one</text><text x="16" y="138" class="cc-t">past floods (illustrative)</text>';
      L.$('#cwf').innerHTML='<svg class="cc-svg" viewBox="0 0 320 144" role="img" aria-label="Past flood heights, each record a little higher, then a new one far above the worst so far">'+s+'</svg><p class="cc-cap">We prepare for the worst that has happened, forgetting that every “worst” once broke an older record. The book: prepare for the extremes that are possible, not just the ones on record.</p>';
      L.done();};};}},

{part:3,src:'Supporting Idea · Falsifiability',pts:3,
 solve:async L=>{CC_FAL.forEach((c,j)=>L.$('#fo'+j).children[c.right].click());L.$('#fchk').click();},
 run(L){
  L.h(L.kick('pr','Prove it wrong')+'<h1 class="q">For each claim, pick the result that would prove it wrong.</h1><div id="fl"></div>'+
   '<div class="cc-row"><button class="btn pri" id="fchk" type="button">'+L.ic('check')+'Check all three</button></div>');
  const pick=CC_FAL.map(()=>null);let done=false;
  CC_FAL.forEach((c,j)=>{const d=document.createElement('div');d.className='cc-cl';
    d.innerHTML='<div class="who">'+c.who+'</div><div class="cl">'+c.claim+'</div><div class="wr">Proven wrong if…</div><div class="cc-chips cc-col" id="fo'+j+'"></div><p class="why"></p>';
    c.opts.forEach((o,q)=>{const b=document.createElement('button');b.className='chip';b.type='button';b.textContent=o[0];
      b.onclick=()=>{if(done)return;pick[j]=q;[...d.querySelectorAll('.chip')].forEach((x,z)=>x.classList.toggle('sel',z===q));L.err('');};
      d.querySelector('#fo'+j).appendChild(b);});
    L.$('#fl').appendChild(d);});
  L.$('#fchk').onclick=()=>{if(done)return;if(pick.includes(null)){L.err('Pick a result for every claim first');return;}done=true;let n=0;
    CC_FAL.forEach((c,j)=>{const ok=pick[j]===c.right;n+=ok?1:0;L.award(ok);const chips=L.$$('#fo'+j+' .chip');chips[pick[j]].classList.remove('sel');chips[pick[j]].classList.add(ok?'ok':'no');if(!ok)chips[c.right].classList.add('ok');
      const w=L.$$('#fl .why')[j];w.style.color=ok?'var(--ok)':'var(--no)';w.textContent=c.opts[pick[j]][1]+(ok?'':' '+c.opts[c.right][1]);});
    L.$('#fchk').remove();
    L.sheet(n===3?'ok':'info',n+' of 3 right','A claim that could fail a test, and survives it, earns trust. “Always” claims fall to a few counter-examples. A claim that every result fits isn’t knowledge; treat it as a rough guess.');L.done();};}},

{part:3,src:'Course application · built on Circle of competence',
 solve:async L=>{['#mq00y','#mq01y','#mq10n','#mq11n'].forEach(s=>L.$(s).click());L.$$('#ms .cc-opt').forEach(b=>b.click());L.$('#hold').click();},
 run(L){
  L.h(L.kick('pr','One-minute move')+'<h1 class="q">The dealer says the extended warranty “pays for itself”. Run the circle-of-competence move before Ira signs.</h1>'+
   '<div class="cc-strip" style="margin-top:6px"><div class="hd">WHEN TO REACH FOR IT · HOW THIS COURSE APPLIES THE BOOK</div>'+
   '<svg class="cc-svg" viewBox="0 0 320 112" role="img" aria-label="Three cues: a field you have never worked in, advice from someone who gains, and feeling oddly sure after a quick read. The warranty trips the first two.">'+
   '<rect x="2" y="4" width="100" height="70" rx="10" fill="var(--soft)"/><rect x="110" y="4" width="100" height="70" rx="10" fill="var(--soft)"/><rect x="218" y="4" width="100" height="70" rx="10" fill="var(--soft)"/>'+
   '<path d="M30 22 L48 16 L66 22 L84 16 L84 56 L66 62 L48 56 L30 62 Z" fill="var(--card)" stroke="var(--line2)" stroke-width="1.5" stroke-dasharray="4 3"/><text x="57" y="47" text-anchor="middle" style="font:700 20px var(--sans);fill:var(--muted)">?</text>'+
   '<circle cx="150" cy="30" r="9" fill="var(--h3)"/><rect x="141" y="41" width="18" height="24" rx="6" fill="var(--h3)"/><circle cx="178" cy="44" r="13" fill="var(--h4-bg)" stroke="var(--h4)" stroke-width="1.5"/><text x="178" y="49" text-anchor="middle" style="font:700 13px var(--sans);fill:var(--h4)">£</text>'+
   '<rect x="240" y="34" width="26" height="30" rx="3" fill="var(--card)" stroke="var(--line2)" stroke-width="1.5"/><line x1="245" y1="43" x2="261" y2="43" stroke="var(--line2)"/><line x1="245" y1="50" x2="261" y2="50" stroke="var(--line2)"/>'+
   '<path d="M282 60 L282 26 M274 34 L282 24 L290 34" fill="none" stroke="var(--pri)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>'+
   '<text x="52" y="90" text-anchor="middle" class="cc-t">a field you’ve</text><text x="52" y="104" text-anchor="middle" class="cc-t">never worked in</text>'+
   '<text x="160" y="90" text-anchor="middle" class="cc-t">advice from</text><text x="160" y="104" text-anchor="middle" class="cc-t">someone who gains</text>'+
   '<text x="268" y="90" text-anchor="middle" class="cc-t">oddly sure after</text><text x="268" y="104" text-anchor="middle" class="cc-t">a quick read</text>'+
   '<circle cx="92" cy="14" r="8" fill="var(--ok-strong)"/><path d="M88 14 L91 17 L96 11" fill="none" stroke="var(--card)" stroke-width="2"/>'+
   '<circle cx="200" cy="14" r="8" fill="var(--ok-strong)"/><path d="M196 14 L199 17 L204 11" fill="none" stroke="var(--card)" stroke-width="2"/></svg>'+
   '<p class="small" style="margin:2px 0 4px">Ticks: the warranty trips two cues. The one-minute routine below is this course’s, built only from the chapter’s steps.</p></div>'+
   '<div class="cc-box"><b class="t">Step 1 · Lifer or Stranger? Answer honestly for Ira, for two decisions</b>'+
   '<div class="cc-q" id="mqs"></div><svg class="cc-svg" id="mr" viewBox="0 0 320 124" role="img" aria-label="Ira’s circle, with a token for each decision placed by the answers"></svg><div id="m1f"></div></div>'+
   '<div class="cc-box" id="m2" hidden><b class="t">Step 2 · Stranger moves for the warranty (tap each)</b><div id="ms" style="margin-top:6px"></div></div>'+
   '<div class="cc-box" id="m3" hidden><b class="t">Step 3 · Big spending waits</b><div class="cc-row" style="justify-content:flex-start"><button class="btn" id="sign" type="button">Sign today</button><button class="btn pri" id="hold" type="button">'+L.ic('lock')+'Hold until checked</button></div><div id="m3f"></div></div>');
  const DEC=['Print queue after a breakdown','Dealer’s warranty'],QS=['Do I know what I don’t know here?','Could I argue the other side’s case well?'],RIGHT=[[true,true],[false,false]];
  const ans=[[null,null],[null,null]];const done2=[false,false,false];let fin=false;
  QS.forEach((q,k)=>{L.$('#mqs').insertAdjacentHTML('beforeend','<div class="qq">'+(k+1)+'. '+q+'</div>');
    DEC.forEach((d,j)=>{const c=document.createElement('div');c.innerHTML='<span class="dl">'+(j?'Warranty':'Print queue')+'</span><div class="cc-seg"><button type="button" id="mq'+j+k+'y">Yes</button><button type="button" id="mq'+j+k+'n">No</button></div>';
      L.$('#mqs').appendChild(c);
      [['y',true],['n',false]].forEach(v=>{c.querySelector('#mq'+j+k+v[0]).onclick=()=>{ans[j][k]=v[1];
        c.querySelector('#mq'+j+k+'y').classList.toggle('sel',v[1]);c.querySelector('#mq'+j+k+'n').classList.toggle('sel',!v[1]);upd();};});});});
  function tok(j){const a=ans[j];if(a.includes(null))return null;const y=a.filter(Boolean).length;return y===2?14:y===1?42:84;}
  function draw(){let h='<rect x="1" y="1" width="318" height="122" rx="14" fill="var(--soft)"/><text x="310" y="18" text-anchor="end" class="cc-t">Stranger ground</text>'+
     '<circle cx="160" cy="62" r="52" fill="var(--h2)" fill-opacity=".12" stroke="var(--h2)" stroke-width="1.5" stroke-dasharray="6 4"/><circle cx="160" cy="62" r="30" fill="var(--h2)" fill-opacity=".28" stroke="var(--h2)" stroke-width="2"/>'+
     '<text x="160" y="24" text-anchor="middle" class="cc-t" style="fill:var(--h2)">Ira’s circle</text>';
    [[-1,'Q','queue'],[1,'W','warranty']].forEach((t,j)=>{const d=tok(j),x=160+t[0]*(d===null?110:d),known=d!==null;
      h+='<circle cx="'+x+'" cy="62" r="13" fill="'+(known?'var(--pri)':'var(--card)')+'" stroke="'+(known?'var(--card)':'var(--line2)')+'" stroke-width="'+(known?3:1.5)+'"'+(known?'':' stroke-dasharray="3 3"')+' style="transition:cx .4s"/>'+
        '<text x="'+x+'" y="66" text-anchor="middle" style="font:700 11px var(--sans);fill:'+(known?'var(--pri-ink)':'var(--muted)')+'">'+(known?t[1]:'?')+'</text>'+
        '<text x="'+x+'" y="'+(d!==null&&d<30?90:94)+'" text-anchor="middle" class="cc-t cc-h">'+t[2]+'</text>';});
    L.$('#mr').innerHTML=h;}
  function upd(){draw();L.$('#m1f').innerHTML='';
    if(ans.some(a=>a.includes(null)))return;
    const qOk=ans[0].every((v,k)=>v===RIGHT[0][k]),wOk=ans[1].every((v,k)=>v===RIGHT[1][k]);
    if(qOk&&wOk){L.$('#m2').hidden=false;
      L.fb(L.$('#m1f'),'<b>Print queue: Lifer.</b> Skip straight to deciding: Ira reshuffles the queue now, no extra steps. <b>Warranty: Stranger.</b> Ira has never read a warranty contract or sold one, so run the Stranger moves.','ok');return;}
    L.$('#m2').hidden=true;
    L.fb(L.$('#m1f'),(qOk?'':'<b>Print queue:</b> be fair to Ira. Years of scheduling, mistakes included: Ira knows the gaps and could argue a client’s case. That’s Lifer ground. ')+
      (wOk?'':'<b>Warranty:</b> be honest for Ira. Ira has never read a warranty contract and couldn’t argue the dealer’s side. A Stranger who feels like a Lifer is the risky case.'),'no');}
  draw();
  [['Learn the basics of extended warranties','Ira reads what such warranties usually cover and exclude.'],['Ask a Lifer: which terms matter, and why?','Ira asks a friend who handles insurance claims for a living.'],['Ask: what does the dealer gain?','The dealer earns on the warranty sale: advice with a stake.']].forEach((m,j)=>{
    const b=document.createElement('button');b.type='button';b.className='cc-opt';b.innerHTML='<span class="cc-num">'+(j+1)+'</span><span>'+m[0]+'<br><span class="small" style="font-weight:400">'+m[1]+'</span></span>';
    b.onclick=()=>{done2[j]=true;b.classList.add('sel');if(done2.every(Boolean))L.$('#m3').hidden=false;};L.$('#ms').appendChild(b);});
  L.$('#sign').onclick=()=>{L.$('#m3f').innerHTML='';L.fb(L.$('#m3f'),'Not yet. Ira is a Stranger here. The book’s rule for the mechanic is to hold major spending until you’ve checked it isn’t a bluff; using the same rule on the dealer is how this course applies it.','no');};
  L.$('#hold').onclick=()=>{if(fin)return;fin=true;L.$('#m3f').innerHTML='';
    L.sheet('info','The move, in one line','Lifer or Stranger? → if Lifer, as with the print queue: decide. → if Stranger: the basics, the Lifer question (“which variables matter, and why?”), the incentive question (“what do they gain?”) → hold big spending until checked.');L.done();};}},

{part:3,src:'Course application · built on Circle of competence',
 solve:async L=>{L.$$('#dk .cc-opt').forEach(b=>{if(b.dataset.g==='1')b.click();});},
 run(L){
  const O=[['Learn the basics',1,'Ira reads the system’s manual and its user forum, and remembers that’s still Stranger knowledge.'],
   ['Ask Bram: Bram is great with clients',0,'Bram is a Stranger in this system too. Asking another Stranger feels like help but adds nothing.'],
   ['Buy it: the vendor is the only expert around',0,'The vendor’s knowledge is real, and so is the gain from the sale. With no one to check against, slow down.'],
   ['Use a broad model',1,'The map is not the territory: Ira walks the floor to see where the delays really start, before blaming the software.'],
   ['Read the brochure until it feels clear',0,'A brochure lifts how sure Ira feels, not Ira’s advantage, and the seller wrote it.'],

    if(on[0])h+='<circle cx="92" cy="92" r="27" fill="none" stroke="var(--h2)" stroke-width="2" stroke-dasharray="3 3"/><text x="92" y="136" text-anchor="middle" class="cc-tb cc-h" style="fill:var(--h2)">① basics</text>';

    if(on[2])h+='<rect x="300" y="4" width="14" height="11" rx="2" fill="var(--ok-strong)"/><path d="M303 4 V1 a4 4 0 0 1 8 0 V4" fill="none" stroke="var(--ok-strong)" stroke-width="2"/>';
    h+='<circle cx="262" cy="112" r="22" fill="none" stroke="var(--faint)" stroke-width="1.5" stroke-dasharray="4 3"/><text x="262" y="117" text-anchor="middle" style="font:700 13px var(--sans);fill:var(--faint)">L</text>'+
      '<line x1="246" y1="96" x2="278" y2="128" stroke="var(--no-strong)" stroke-width="2.5" stroke-linecap="round"/><text x="262" y="152" text-anchor="middle" class="cc-t">no Lifer to ask</text>'+
      '<circle cx="92" cy="92" r="15" fill="var(--pri)" stroke="var(--card)" stroke-width="3"/><text x="92" y="96" text-anchor="middle" style="font:700 11px var(--sans);fill:var(--pri-ink)">Ira</text>';
    L.$('#de').innerHTML=h;}
  draw();let gi=0;
  O.forEach(o=>{const b=document.createElement('button');b.type='button';b.className='cc-opt';const n=o[1]?++gi:0;b.dataset.g=String(o[1]);
    b.innerHTML='<span>'+o[0]+'</span>';
    b.onclick=()=>{if(fin)return;
      if(o[1]){on[n-1]=true;b.classList.add('sel');b.innerHTML='<span class="cc-num">'+n+'</span><span>'+o[0]+'<br><span class="small" style="font-weight:400">'+o[2]+'</span></span>';draw();L.$('#dfb').innerHTML='';
        if(on.every(Boolean)){fin=true;L.sheet('info','A dead end is not a stop sign','No Lifer? The book’s other moves still work: learn the basics while remembering you’re a Stranger, lean on broad mental models, and hold big spending until you’ve checked it isn’t a bluff. Then decide, and note it in the journal. This playbook is the course’s; each step is the book’s.');L.done();}}
      else{b.style.opacity='.5';L.$('#dfb').innerHTML='';L.fb(L.$('#dfb'),'<b>'+o[0]+'</b>: '+o[2],'no');}};
    L.$('#dk').appendChild(b);});}},
{part:3,src:'Course application · built on Circle of competence',pts:6,run(L){
  L.h(L.kick('pr','How this course applies the book · Ira’s week')+'<h1 class="q">Sort Ira’s week. Inside the circle: decide and act. Outside: run the Stranger moves.</h1>'+
   '<svg class="cc-svg" id="wkp" viewBox="0 0 320 150" role="img" aria-label="Ira’s circle in print work. After you check, each numbered decision lands inside or outside it."></svg>');
  const WK=[0,1,1,0,1,0],inPos=[[96,62],[124,62],[110,88]],outPos=[[236,48],[272,74],[236,100]];
  const wk=placed=>{let h='<rect x="1" y="1" width="318" height="148" rx="14" fill="var(--soft)"/><text x="310" y="18" text-anchor="end" class="cc-t">Stranger ground</text>'+
     '<circle cx="110" cy="72" r="58" fill="var(--h2)" fill-opacity=".12" stroke="var(--h2)" stroke-width="1.5" stroke-dasharray="6 4"/><circle cx="110" cy="72" r="38" fill="var(--h2)" fill-opacity=".26" stroke="var(--h2)" stroke-width="2"/>'+
     '<text x="110" y="28" text-anchor="middle" class="cc-t cc-h" style="fill:var(--h2)">print work</text>'+
     '<text x="110" y="144" text-anchor="middle" class="cc-tb" style="fill:var(--h2)">inside: decide</text><text x="242" y="144" text-anchor="middle" class="cc-tb" style="fill:var(--pri)">outside: Stranger moves</text>';
    let a=0,b=0;
    WK.forEach((w,k)=>{
      if(!placed){h+='<circle cx="'+(200+k*20)+'" cy="118" r="9" fill="var(--card)" stroke="var(--line2)" stroke-dasharray="3 2"/><text x="'+(200+k*20)+'" y="122" text-anchor="middle" style="font:700 10.5px var(--sans);fill:var(--muted)">'+(k+1)+'</text>';return;}
      const p=w?outPos[b++]:inPos[a++];

    if(!placed)h+='<text x="250" y="96" text-anchor="middle" class="cc-t">check to place them</text>';
    L.$('#wkp').innerHTML=h;};
  wk(false);
  L.card.addEventListener('click',()=>{if(L.$('#wkp')&&[...L.$$('.row .why')].some(w=>w.textContent))wk(true);});
  const N=k=>'<span class="cc-num">'+k+'</span>';
  L.buckets(L.card,['Inside: decide','Outside: Stranger moves'],[
   [N(1)+'Re-order the print queue after a press breaks down',0,'Years of scheduling at Harrow & Finch: a fast call here is a Lifer’s call.'],
   [N(2)+'Choose between the two share-option offers in Fieldnote’s contract',1,'Ira has never valued share options. Learn the basics and ask a Lifer which terms matter, and why.'],
   [N(3)+'Pick a personal alarm and handrails for Wynn after the fall',1,'Ira knows Wynn, not home safety. Ask someone who fits these for a living what matters and why, and what they gain.'],
   [N(4)+'Approve a client’s banner proof before it prints',0,'Proof checks are Ira’s daily work: inside the circle.'],
   [N(5)+'An adviser pitches Ira and Remy a savings fund that pays the adviser a commission',1,'Outside Ira’s circle, and close to the book’s own example: find out how the adviser is paid, ask what matters and why, and check before moving money.'],
   [N(6)+'Plan who covers which press during a busy week',0,'Ira has done this for years and knows the trade-offs: Lifer ground.']],
   'Inside the circle, decide at Lifer speed. Outside, take a minute for the Stranger moves. Most weeks hold both.');}},

{part:3,src:'Circle of Competence · Conclusion',
 solve:async L=>{const c=L.$('#pre').children;for(let j=0;j<4;j++)c[j].click();},
 run(L){
  const P=[['A weekend of reading',{tx:CC_ENGINE[0],ty:CC_ENGINE[1],s:1,boost:1.8,plus:0.2,ghost:0,adviser:false},'Feels like a Lifer, isn’t. Basic facts breed confidence you haven’t earned; the advantage stays negative.'],
   ['A Lifer who stopped learning',{tx:128,ty:94,s:0.45,boost:0,plus:0,ghost:1,ghostLab:'five years ago',adviser:false},'The field moved on and the circle shrank. Ira stands where the core used to be, now at the edge. Without learning, monitoring and feedback, a circle fades.'],
   ['Must decide outside anyway',{tx:60,ty:52,s:1,boost:0,plus:0,ghost:0,adviser:false},'Life isn’t that forgiving. Hiring without training in psychology, buying technology you can’t fix: these still have to be decided. Learn the basics, use broad models, decide, and note it in the journal.'],
   ['Adviser on commission',{tx:CC_ENGINE[0],ty:CC_ENGINE[1],s:1,boost:0,plus:0,ghost:0,adviser:true},'The mechanic’s circle is real, and so is the mechanic’s gain. Advice from inside someone else’s circle is bent by their incentives. Find out what they gain.'],
   ['Stay in your spots',{tx:CX,ty:CY,s:1,boost:0,plus:0,ghost:0,adviser:false},'The upside of knowing your edge. Rose Blumkin, who spoke little English, built a great furniture store on numbers and furnishings: she’d buy thousands of end tables in an afternoon at the right price, and never touched stocks.'],
   ['A small circle, a known edge',{tx:CX,ty:CY,s:0.55,boost:0,plus:0,ghost:0,adviser:false},'Size isn’t the point. A small circle whose edge you know beats a big one you overestimate.']];
  L.h(L.kick('learn','Limits · where the circle stops protecting you')+'<h1 class="q">Load the edge cases. Tap at least four.</h1><div id="pr"></div><div id="pcap"></div><div class="cc-chips" id="pre" style="margin-top:10px"></div>');
  const ring=ccRings(L,L.$('#pr'),{lm:[],ro:false});const tried=new Set();
  P.forEach((p,j)=>{const b=document.createElement('button');b.className='chip';b.type='button';b.textContent=p[0];
    b.onclick=()=>{L.$$('#pre .chip').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');ring.set(p[1]);
      L.$('#pcap').innerHTML='<div class="fb info" style="margin:8px 0 4px">'+p[2]+'</div>';tried.add(j);
      if(tried.size===4)L.sheet('info','Four limits to remember','<b>1.</b> You can’t always stay inside: decisions outside still get made. <b>2.</b> A little learning feels like a lot. <b>3.</b> A circle shrinks without upkeep. <b>4.</b> Someone else’s circle comes with their incentives. And from the supporting idea: a trend is not a law.');
      if(tried.size>=4)L.done();};
    L.$('#pre').appendChild(b);});}},

{part:3,src:'Course application · built on Circle of competence',
 solve:async L=>{const a=L.$('#yd'),b=L.$('#yl');a.value='Choosing a new phone contract';a.dispatchEvent(new Event('input',{bubbles:true}));b.value='My cousin who sells them';b.dispatchEvent(new Event('input',{bubbles:true}));L.$('#ysv').click();},
 run(L){
  L.h(L.kick('pr','Your turn · how this course applies the book')+'<h1 class="q">Where are you a Stranger this week?</h1>'+
   '<svg class="cc-svg" viewBox="0 0 320 120" role="img" aria-label="Your circle, with you standing outside it as a Stranger"><rect x="1" y="1" width="318" height="118" rx="14" fill="var(--soft)"/>'+
   '<circle cx="96" cy="60" r="46" fill="var(--h2)" fill-opacity=".14" stroke="var(--h2)" stroke-dasharray="6 4"/><circle cx="96" cy="60" r="27" fill="var(--h2)" fill-opacity=".28" stroke="var(--h2)" stroke-width="2"/>'+
   '<text x="96" y="58" text-anchor="middle" class="cc-tb" style="fill:var(--h2)">your</text><text x="96" y="72" text-anchor="middle" class="cc-tb" style="fill:var(--h2)">circle</text><circle cx="214" cy="60" r="15" fill="var(--pri)" stroke="var(--card)" stroke-width="3"/><text x="214" y="64" text-anchor="middle" style="font:700 11px var(--sans);fill:var(--pri-ink)">you</text>'+
   '<path d="M232 60 L272 60" stroke="var(--h3)" stroke-width="2" stroke-dasharray="4 4"/><circle cx="286" cy="60" r="12" fill="var(--h3)"/><text x="286" y="64" text-anchor="middle" style="font:700 11px var(--sans);fill:var(--card)">L</text><text x="312" y="104" text-anchor="end" class="cc-t">ask a Lifer: what matters, why?</text></svg>'+
   '<label class="cc-lab" for="yd">A decision this week where you’re a Stranger</label><input class="cc-in" id="yd" type="text" maxlength="90" placeholder="e.g. a contract, a repair, a new tool">'+
   '<label class="cc-lab" for="yl">The Lifer you’ll ask, and what they might gain</label><input class="cc-in" id="yl" type="text" maxlength="90" placeholder="e.g. a friend in the trade">'+
   '<div class="cc-row" style="justify-content:flex-start"><button class="btn pri" id="ysv" type="button" disabled>'+L.ic('check')+'Add it to my week</button></div><div id="yout"></div>'+
   '<p class="small" style="margin-top:8px">Not graded, and nothing leaves this page.</p>');
  const ok=()=>L.$('#yd').value.trim().length>1&&L.$('#yl').value.trim().length>1;
  ['#yd','#yl'].forEach(s=>L.$(s).addEventListener('input',()=>{L.$('#ysv').disabled=!ok();}));
  L.$('#ysv').onclick=function(){if(!ok())return;this.disabled=true;
    const e=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    L.$('#yout').innerHTML='<div class="cc-box"><b class="t">Your one-minute move</b>Stranger in: <b>'+e(L.$('#yd').value.trim())+'</b><br>1. Learn the basics, and remember you’re still a Stranger.<br>2. Ask <b>'+e(L.$('#yl').value.trim())+'</b>: “Which things matter here, and why?”<br>3. Ask what they gain, and hold any big spend until you’ve checked.<br>Then note it in your journal: what you decided, and what you expect.</div>'+ccStrip();
    L.sheet('info','Saved for your week','Next time you feel oddly sure after a little reading, or an expert is selling you something, that’s your cue: Lifer or Stranger?');L.done();};}}
  ]
});
