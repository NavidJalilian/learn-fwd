function mwRand(n,x0,x1,y0,y1,w,h,col,op){let r=7,g='';for(let i=0;i<n;i++){r=(r*9301+49297)%233280;const x=x0+(r/233280)*(x1-x0);r=(r*9301+49297)%233280;const y=y0+(r/233280)*(y1-y0);
  g+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+w+'" height="'+h+'" rx="1" fill="none" stroke="var(--'+col+')" stroke-width="1" opacity="'+op+'"/>';}return g;}

/* the territory: the real shop floor */

   mwT(53,20,'PRESSES',{fs:11.5,w:700,ls:.5})+mwT(159,20,'PACKING',{fs:11.5,w:700,ls:.5})+mwT(262,20,'LOADING DOCK',{fs:11.5,w:700,ls:.4});
  g+='<rect x="14" y="98" width="62" height="74" rx="6" fill="var(--card)" stroke="var(--line2)" stroke-width="1.5"/><circle cx="32" cy="118" r="9" fill="none" stroke="var(--muted)" stroke-width="1.5"/><circle cx="58" cy="118" r="9" fill="none" stroke="var(--muted)" stroke-width="1.5"/><rect x="22" y="140" width="46" height="6" rx="2" fill="var(--line2)"/><path d="M22 156h46" stroke="var(--line2)" stroke-width="2"/>';
  for(let i=0;i<a.q;i++)g+='<rect x="82" y="'+(165-i*7)+'" width="20" height="5" rx="1" fill="var(--card)" stroke="var(--muted)" stroke-width="1"/>';
  g+=mwT(92,190,'new jobs',{fs:11.5});
  g+='<rect x="116" y="140" width="86" height="7" rx="2" fill="var(--line2)"/><path d="M122 147V172M196 147V172" stroke="var(--line2)" stroke-width="3"/>'+mwBox(126,128)+mwBox(142,128)+mwBox(172,128);
  g+=mwT(159,190,'packed ✓',{fs:11.5,c:'ok'});
  for(let i=0;i<n;i++){const c=i%4,r=Math.floor(i/4);g+=mwBox(220+c*17,158-r*13,i===0?'no':'h3');}
  g+=mwT(254,190,'on the dock: '+n,{fs:11.5,c:'ink'});

  if(s.truck!=null?s.truck:a.t)g+='<rect x="290" y="118" width="28" height="40" rx="3" fill="var(--card)" stroke="var(--muted)" stroke-width="1.5"/><circle cx="297" cy="164" r="6" fill="var(--muted)"/><circle cx="312" cy="164" r="6" fill="var(--muted)"/>';
  else g+='<path d="M292 196h26" stroke="var(--line2)" stroke-width="3" stroke-dasharray="6 5"/>';
  g+='<rect x="292" y="50" width="16" height="26" rx="3" fill="var(--card)" stroke="var(--muted)" stroke-width="1.5"/><path d="M296 57h8M296 63h8" stroke="var(--muted)" stroke-width="1.5"/><path d="M313 54q4 9 0 18M287 54q-4 9 0 18" stroke="var(--no)" fill="none" stroke-width="1.5"/>';
  if(s.nomap)g+=mwRand(150,6,306,32,206,7,5,'h3',.75)+mwRand(60,6,306,32,206,4,8,'muted',.6);

/* the territory: the real flat at 8 a.m. on a weekday */

  g+='<rect x="18" y="34" width="104" height="84" rx="4" fill="var(--soft2)" stroke="var(--line2)" stroke-width="3"/><rect x="24" y="84" width="42" height="24" rx="4" fill="var(--h3-bg)" stroke="var(--h3)" stroke-width="1.5"/><rect x="72" y="88" width="44" height="20" rx="4" fill="var(--h3-bg)" stroke="var(--h3)" stroke-width="1.5"/><path d="M30 92h30M78 95h32" stroke="var(--h3)" stroke-width="2"/><path d="M70 34v84M18 76h104" stroke="var(--line2)" stroke-width="2"/>'+mwT(70,134,'bus depot',{fs:11.5});

  g+='<rect x="150" y="130" width="74" height="46" fill="var(--card)" stroke="var(--line2)" stroke-width="1.5"/><circle cx="166" cy="137" r="4" fill="none" stroke="var(--muted)"/><circle cx="182" cy="137" r="4" fill="none" stroke="var(--muted)"/>'+mwT(187,196,'tiny kitchen',{fs:11.5});
  g+='<path d="M266 28q16 -6 40 2q8 22 2 44q-18 10 -34 0q-10 -22 -8 -46z" fill="var(--h3-bg)" stroke="var(--h3)" stroke-width="1.5" stroke-dasharray="3 3"/>';

/* the map: Pella's switchover dashboard */

   mwT(14,24,'SWITCHOVER DASHBOARD',{fs:11.5,w:700,a:'start',ls:.4})+mwT(306,24,'by '+c.short.toLowerCase(),{fs:11.5,a:'end'});
  g+='<text x="14" y="72" font-size="44" font-weight="700" fill="var(--'+col+')">'+v+'%</text>'+mwT(14,94,c.lab,{fs:13,a:'start',c:'ink',w:500});

  if(d>=5){g+=mwRand(110,6,306,100,208,7,5,'line2',1)+mwRand(40,150,306,34,98,5,4,'line2',1);

     '<rect x="262" y="146" width="32" height="18" rx="3" fill="var(--card)" stroke="var(--muted)"/><rect x="276" y="153" width="12" height="7" fill="none" stroke="var(--muted)" stroke-width=".8"/>';}

/* the map: the flat's listing */
function mwMapFlat(){

   mwT(14,154,'Bright, spacious 2-bed',{fs:16,a:'start',c:'ink',w:700})+mwT(14,174,'5 min to the station · quiet street',{fs:12.5,a:'start',c:'ink',w:500})+

/* build one wipe reveal. o: {s:{…state}, ctrls:['wipe','age','detail','carto'], gaps:bool, ro(s), change(kind)} */
function mwMake(host,o){o=o||{};const id='mw'+(++MW_N),C=o.ctrls||[];let live=false;
  const s=Object.assign({scene:'floor',x:0,age:0,detail:3,carto:'w',early:false,nomap:false,driver:false,showDef:false,spots:[]},o.s||{});
  const lab=s.scene==='flat'?'The flat’s listing laid over the real flat':'Pella’s dashboard laid over the real shop floor';
  host.insertAdjacentHTML('beforeend','<div class="mw" id="'+id+'"><svg viewBox="0 0 320 220" role="img" aria-label="'+lab+'"'+(C.includes('wipe')?'':' class="nodrag"')+'><defs><mask id="'+id+'k" maskUnits="userSpaceOnUse" x="0" y="0" width="320" height="220"></mask></defs><g class="mw-t"></g><g class="mw-m" mask="url(#'+id+'k)"></g><g class="mw-o"></g><g class="mw-h"></g></svg>'+
   (o.gaps===false?'':'<div class="mw-gl" aria-live="polite"></div>')+'<div class="mw-ro" aria-live="polite"></div><div class="mw-c"></div></div>');
  const el=host.lastElementChild,svg=el.querySelector('svg'),q=c=>el.querySelector(c),found=new Set();
  const slider=(k,t,mn,mx,v)=>'<label class="mw-sl"><div class="mw-slh"><span>'+t+'</span><span data-v="'+k+'"></span></div><input type="range" min="'+mn+'" max="'+mx+'" step="1" value="'+v+'" data-c="'+k+'" aria-label="'+t+'"></label>';
  let ch='';
  if(C.includes('age'))ch+=slider('age','Map age',0,4,s.age);
  if(C.includes('detail'))ch+=slider('detail','Map detail',1,5,s.detail);
  if(C.includes('wipe'))ch+=slider('wipe','Uncover the real thing',0,100,s.x);
  if(C.includes('carto'))ch+='<div class="mw-slh" style="margin-top:8px"><span>Who drew the map?</span><span></span></div><div class="mw-ch">'+['w','s','c'].map(k=>'<button class="chip'+(s.carto===k?' sel':'')+'" data-ca="'+k+'">'+MW_CA[k].short+'</button>').join('')+'</div>';
  q('.mw-c').innerHTML=ch;
  const fire=k=>{if(live&&o.change)o.change(k);};
  const vis=p=>{if(s.nomap)return true;if(p[0]+4<=s.x*3.2)return true;return s.spots.some(sp=>sp.length===4?(p[0]>=sp[0]&&p[0]<=sp[0]+sp[2]&&p[1]>=sp[1]&&p[1]<=sp[1]+sp[3]):Math.hypot(p[0]-sp[0],p[1]-sp[1])<=sp[2]);};
  const spot=(sp,a)=>sp.length===4?'<rect x="'+sp[0]+'" y="'+sp[1]+'" width="'+sp[2]+'" height="'+sp[3]+'" rx="14" '+a+'/>':'<circle cx="'+sp[0]+'" cy="'+sp[1]+'" r="'+sp[2]+'" '+a+'/>';
  function labels(){const a=MW_AGE[s.age];
    el.querySelectorAll('[data-v]').forEach(sp=>{const k=sp.dataset.v;
      sp.textContent=k==='wipe'?s.x+'% uncovered':k==='age'?(s.age?MW_DAY[s.age]+' · '+s.age+' day'+(s.age>1?'s':'')+' old':'Mon · fresh'):MW_DET[s.detail][0];});
    let r='';
    if(C.includes('age'))r+='<div>Map: <b>Mon 9:00</b> · Floor now: <b>'+MW_DAY[s.age]+' 9:00</b> · new orders since the map: <b>'+a.nw+'</b> · truck at the dock: <b>'+(a.t?'yes':'no')+'</b></div>';
    if(C.includes('detail')){const D=MW_DET[s.detail];r+='<div class="mw-bars"><span>Shows the floor</span><div class="bar"><i style="width:'+D[1]+'%;background:var(--h2)"></i></div><b>'+D[1]+'%</b><span>Readable at a glance</span><div class="bar"><i style="width:'+D[2]+'%;background:var(--pri)"></i></div><b>'+D[2]+'%</b></div>'+(s.detail===5?'<div style="color:var(--no);margin-top:4px">Now as big and cluttered as the floor, with a map of the map inside it.</div>':'');}
    if(C.includes('carto')){const c=MW_CA[s.carto];r+='<div>Drawn by <b>'+c.who+'</b>: an order is “on time” when it’s <b>'+c.def+'</b>.</div>';}
    if(o.ro)r+=o.ro(s);
    q('.mw-ro').innerHTML=r;}
  function gapList(){const gl=q('.mw-gl');if(!gl)return;
    if(s.nomap){gl.innerHTML='<div class="hd">NO MAP AT ALL</div>140 orders in view at once. Everything is there, and no pattern stands out.';return;}
    const G=MW_GAPS[s.scene];gl.innerHTML='<div class="hd">GAPS FOUND: '+found.size+' OF 3</div>'+[0,1,2].filter(j=>found.has(j)).map(j=>'<div class="mw-gi"><span class="mw-n">'+(j+1)+'</span><span>'+G[j](s)+'</span></div>').join('');}
  function wipe(){const X=s.x*3.2;
    q('mask').innerHTML='<rect width="320" height="220" fill="white"/>'+(X>0?'<rect width="'+X+'" height="220" fill="black"/>':'')+s.spots.map(sp=>spot(sp,'fill="black"')).join('')+(s.nomap?'<rect width="320" height="220" fill="black"/>':'');
    q('.mw-h').innerHTML=C.includes('wipe')&&!s.nomap?'<path d="M'+X+' 0V220" stroke="var(--pri)" stroke-width="3"/><circle cx="'+Math.max(15,Math.min(305,X))+'" cy="110" r="15" fill="var(--pri)"/><path d="M'+(Math.max(15,Math.min(305,X))-4)+' 104l-6 6 6 6M'+(Math.max(15,Math.min(305,X))+4)+' 104l6 6-6 6" stroke="var(--pri-ink)" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>':'';
    let nw=false;if(!s.nomap)MW_PINS[s.scene].forEach((p,j)=>{if(!found.has(j)&&vis(p)){found.add(j);nw=true;}});
    const sp=el.querySelector('[data-v="wipe"]');if(sp)sp.textContent=s.x+'% uncovered';
    gapList();if(nw)fire('found');}
  function draw(){const P=s.nomap||o.gaps===false?'':MW_PINS[s.scene].map((p,j)=>'<circle class="mw-pr" cx="'+p[0]+'" cy="'+p[1]+'" r="9" fill="var(--no-strong)"/><circle cx="'+p[0]+'" cy="'+p[1]+'" r="9" fill="var(--no-strong)"/>'+mwT(p[0],p[1]+4,j+1,{fs:12,w:700,c:'card'})).join('');
    q('.mw-t').innerHTML=(s.scene==='flat'?mwFlat(s):mwFloor(s))+P;
    q('.mw-m').innerHTML=s.scene==='flat'?mwMapFlat(s):mwMapF(s);
    q('.mw-o').innerHTML=(s.nomap?'':s.spots.map(sp=>spot(sp,'fill="none" stroke="var(--pri)" stroke-width="2" stroke-dasharray="5 4"')).join(''))+(s.driver?'<rect x="146" y="30" width="168" height="44" rx="10" fill="var(--h1-bg)" stroke="var(--h1)" stroke-width="1.5"/><path d="M290 74l6 12 4-12" fill="var(--h1-bg)" stroke="var(--h1)" stroke-width="1.5"/>'+mwT(230,48,'Driver: which bay is the',{fs:11.5,c:'h1',w:700})+mwT(230,64,'hotel chain’s order in?',{fs:11.5,c:'h1',w:700}):'');
    el.querySelectorAll('[data-ca]').forEach(b=>b.classList.toggle('sel',b.dataset.ca===s.carto));
    labels();wipe();}
  el.querySelectorAll('input[data-c]').forEach(inp=>inp.addEventListener('input',()=>{const k=inp.dataset.c,v=+inp.value;
    if(k==='wipe'){s.x=v;wipe();}else{s[k]=v;draw();}fire(k);}));
  el.querySelectorAll('[data-ca]').forEach(b=>b.onclick=()=>{s.carto=b.dataset.ca;draw();fire('carto');});
  if(C.includes('wipe')){let drag=false;
    const mv=e=>{const r=svg.getBoundingClientRect();const v=Math.max(0,Math.min(100,Math.round((e.clientX-r.left)/r.width*100)));if(v===s.x)return;s.x=v;const inp=el.querySelector('input[data-c="wipe"]');if(inp)inp.value=v;wipe();fire('wipe');};
    svg.addEventListener('pointerdown',e=>{if(s.nomap)return;drag=true;try{svg.setPointerCapture(e.pointerId);}catch(_){}mv(e);});
    svg.addEventListener('pointermove',e=>{if(drag)mv(e);});
    const up=()=>{drag=false;};svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);}
  draw();live=true;
  return {s,el,found,set(p){Object.assign(s,p);const inp=el.querySelectorAll('input[data-c]');inp.forEach(i=>{const k=i.dataset.c;i.value=k==='wipe'?s.x:s[k];});draw();},redraw:draw};}

{part:1,src:'The Map Is Not the Territory · Key Elements of a Map',run(L){
  const F=(x,lab,inner)=>'<rect x="'+x+'" y="10" width="94" height="94" rx="10" fill="var(--card)" stroke="var(--line2)" stroke-width="1.5"/>'+inner+mwT(x+47,124,lab,{fs:12,c:'ink'});
  let busy='';for(let i=0;i<5;i++)for(let j=0;j<4;j++){const x=12+i*17+(j%2)*5,y=20+j*20;busy+=(i+j)%3===0?'<circle cx="'+(x+5)+'" cy="'+(y+5)+'" r="5" fill="var(--h3)" opacity=".8"/>':'<rect x="'+x+'" y="'+y+'" width="12" height="9" rx="1.5" fill="var(--h3-bg)" stroke="var(--h3)"/>';}
  L.h(L.kick('learn','The illusion of knowledge')+'<h1 class="q">Every summary you read has lost something on the way to you</h1>'+
   '<svg class="mw-pic" viewBox="0 0 320 150" role="img" aria-label="Three frames: a busy real scene, a simpler report, and one remembered number">'+
   F(4,'What happened',busy)+
   '<path d="M101 57l8 0M105 52l5 5-5 5" stroke="var(--muted)" stroke-width="2" fill="none"/>'+
   F(112,'The report','<rect x="126" y="62" width="14" height="30" fill="var(--h2)" opacity=".7"/><rect x="146" y="44" width="14" height="48" fill="var(--h2)" opacity=".7"/><rect x="166" y="52" width="14" height="40" fill="var(--h2)" opacity=".7"/><path d="M126 26h60M126 36h40" stroke="var(--line2)" stroke-width="3"/>')+
   '<path d="M209 57l8 0M213 52l5 5-5 5" stroke="var(--muted)" stroke-width="2" fill="none"/>'+
   F(220,'What you recall','<text x="267" y="66" font-size="24" font-weight="700" text-anchor="middle" fill="var(--ok)">95% ✓</text>')+
   mwT(51,144,'many details',{fs:11.5,c:'h3'})+mwT(159,144,'some',{fs:11.5,c:'h2'})+mwT(267,144,'one number',{fs:11.5,c:'ok'})+'</svg>'+
   L.prose('News, reports and dashboards are other people’s summaries. Details drop out at each step. We didn’t do the work of making them, so we take them as gospel and can’t see when they stop matching reality. The book calls this the '+L.g('illusion-knowledge','illusion of knowledge')+'.'));

{part:1,src:'The Map Is Not the Territory · But My GPS Didn’t Show That Cliff',run(L){

   '<rect x="2" y="30" width="148" height="80" rx="10" fill="var(--ok-bg)" stroke="var(--ok)" stroke-width="1.5"/><rect x="152" y="30" width="96" height="80" fill="var(--h1-bg)" stroke="var(--h1)" stroke-width="1.5"/><rect x="250" y="30" width="68" height="80" rx="10" fill="var(--soft2)" stroke="var(--line2)" stroke-width="1.5" stroke-dasharray="5 4"/>'+

   mwT(284,64,'uncharted',{fs:12,w:700})+mwT(284,82,'explore',{fs:11.5})+mwT(284,96,'carefully',{fs:11.5})+
   '<path d="M151 8V30M249 8V30" stroke="var(--ink)" stroke-width="1.5"/><path d="M151 8h14l-4 4 4 4h-14M249 8h14l-4 4 4 4h-14" fill="var(--no-strong)"/>'+mwT(151,124,'known edge',{fs:11.5,c:'ink'})+mwT(249,124,'known edge',{fs:11.5,c:'ink'})+'</svg>'+

{part:1,src:'The Map Is Not the Territory · Models of Management',
 solve:async L=>{while(L.$('#tyn'))L.$('#tyn').click();},
 run(L){
  const CR=['People learn the model being used on them and stop responding to its incentives.','Competitors adopt it too, so the edge disappears.','It fit factories, not offices or technology work.','People aren’t simple machines: money isn’t their only motive.'];
  L.h(L.kick('ex','Two maps that outgrew their territory')+'<h1 class="q">A useful map, then a changing world</h1>'+
   '<svg class="mw-pic" id="ty" viewBox="0 0 320 200" role="img" aria-label="A model card above the territory it describes"></svg><div id="tyl"></div><button class="btn pri" id="tyn">'+L.ic('arrow')+'Next</button>');
  let k=0;
  function draw(){const ost=k>=5;let g='<rect x="12" y="8" width="296" height="80" rx="10" fill="var(--card)" stroke="var(--pri)" stroke-width="2"/>';
    if(!ost)g+=mwT(24,30,'TAYLOR’S MODEL OF MANAGEMENT',{fs:11.5,w:700,a:'start',c:'pri'})+mwT(24,52,'Split work into small tasks, specialize,',{fs:12,a:'start',c:'ink',w:500})+mwT(24,70,'and pay workers for output.',{fs:12,a:'start',c:'ink',w:500});
    else g+=mwT(24,30,'TRAGEDY OF THE COMMONS',{fs:11.5,w:700,a:'start',c:'pri'})+mwT(24,52,'Shared pasture: each herder gains from',{fs:12,a:'start',c:'ink',w:500})+mwT(24,70,'one more animal, so all overgraze.',{fs:12,a:'start',c:'ink',w:500})+
      (k===6?'<rect x="218" y="16" width="84" height="20" rx="5" fill="var(--h3-bg)" stroke="var(--h3)"/>'+mwT(260,30,'guidebook',{fs:11.5,c:'h3',w:700}):'');
    if(!ost)for(let j=0;j<Math.min(k,4);j++){const x=60+j*66;g+='<path d="M'+x+' 8l6 14-8 10 7 12-5 10" fill="none" stroke="var(--no-strong)" stroke-width="2.2"/><circle cx="'+(x+4)+'" cy="86" r="8" fill="var(--no-strong)"/>'+mwT(x+4,90,j+1,{fs:11.5,c:'card',w:700});}
    g+='<rect x="12" y="104" width="296" height="90" rx="10" fill="var(--soft)"/>';
    if(k===0)g+='<path d="M30 180v-34l22-16v16l22-16v16l22-16v16l22-16v50z" fill="var(--card)" stroke="var(--muted)" stroke-width="1.5"/><rect x="130" y="128" width="8" height="52" fill="var(--muted)" opacity=".5"/>'+mwT(226,146,'Factory era:',{fs:12,c:'ink',w:700})+mwT(226,164,'it worked, for a time',{fs:12,c:'ink',w:500});
    else if(!ost)g+=[30,80,130].map(x=>'<rect x="'+x+'" y="160" width="40" height="6" fill="var(--muted)"/><rect x="'+(x+8)+'" y="142" width="24" height="16" rx="2" fill="var(--card)" stroke="var(--muted)" stroke-width="1.5"/><circle cx="'+(x+20)+'" cy="128" r="6" fill="var(--h1)" opacity=".7"/>').join('')+mwT(240,146,'Later: offices',{fs:12,c:'ink',w:700})+mwT(240,164,'and tech work',{fs:12,c:'ink',w:500});
    else if(k===5)g+='<path d="M12 194V176q40-14 118-4V194z" fill="var(--h2-bg)"/>'+[[34,172],[58,178],[84,172]].map(p=>'<ellipse cx="'+p[0]+'" cy="'+p[1]+'" rx="10" ry="6" fill="var(--card)" stroke="var(--muted)"/>').join('')+
      '<ellipse cx="110" cy="164" rx="10" ry="6" fill="var(--ok-bg)" stroke="var(--ok)" stroke-width="2"/>'+mwT(110,148,'+1 cow',{fs:12,c:'ok',w:700})+mwT(64,128,'one herder',{fs:12,c:'ink',w:700})+
      mwT(142,124,'My gain from one more cow',{fs:11.5,a:'start',c:'ink'})+'<rect x="142" y="130" width="150" height="10" rx="5" fill="var(--ok-strong)"/>'+
      mwT(142,158,'My share of the damage',{fs:11.5,a:'start',c:'ink'})+'<rect x="142" y="164" width="16" height="10" rx="5" fill="var(--no-strong)"/>'+mwT(164,173,'split by all herders',{fs:11.5,a:'start'})+
      mwT(142,190,'So all add more: ruin',{fs:11.5,a:'start',c:'no',w:700});
    else g+='<path d="M12 184q50-40 100-10t100-8 96 4v18H12z" fill="var(--h2-bg)"/>'+[[50,160],[78,168],[120,172]].map(p=>'<ellipse cx="'+p[0]+'" cy="'+p[1]+'" rx="9" ry="6" fill="var(--card)" stroke="var(--muted)"/>').join('')+
      '<circle cx="160" cy="138" r="6" fill="var(--h1)" opacity=".7"/><circle cx="178" cy="138" r="6" fill="var(--h4)" opacity=".7"/><path d="M160 145v14M178 145v14" stroke="var(--muted)" stroke-width="3"/>'+mwT(250,140,'Real pastures:',{fs:12,c:'ink',w:700})+mwT(250,158,'people found',{fs:12,c:'ink',w:500})+mwT(250,174,'their own fixes',{fs:12,c:'ink',w:500});
    L.$('#ty').innerHTML=g;
    let h='';
    if(k===0)h='<div class="mw-cap">Frederick Taylor’s scientific management: chop factory work into narrow tasks, make each worker a specialist, pay for output. Crude, yet it got results in the factories of its day.</div>';
    else if(!ost)h='<div class="mw-cap">The economy moved away from factories. Reality turned out more complicated than the model:</div>'+CR.slice(0,k).map((c,j)=>'<div class="mw-gi"><span class="mw-n">'+(j+1)+'</span><span>'+c+'</span></div>').join('');
    else if(k===5)h='<div class="mw-cap">The commons model: one more cow gives its owner the whole gain, while the damage to the grass is split among every herder. So each adds another, then another, until the pasture is ruined.</div>';
    else h='<div class="mw-cap">Elinor Ostrom saw real communities solve this. Her warning: a map that fits a place in one or two ways gets assumed to fit in all, and people cling to it over new facts. Use models as <b>guidebooks, not laws</b>.</div>';
    L.$('#tyl').innerHTML=h;}
  draw();
  L.$('#tyn').onclick=()=>{k++;draw();if(k===6){L.$('#tyn').remove();L.done();}};}},

{part:2,src:'The Map Is Not the Territory · Maps Can’t Show Everything',
 solve:async L=>{L.$$('#pp button').forEach(b=>b.click());},
 run(L){
  const ST='<svg viewBox="0 0 224 64" style="display:block;width:100%;max-width:300px;margin:6px 0 2px" role="img" aria-label="A one-word label covers a person who has many more sides than the label shows">'+
    '<rect x="1" y="14" width="76" height="28" rx="6" fill="var(--card)" stroke="var(--ok)" stroke-width="1.5"/>'+mwT(39,33,'“engineer”',{fs:12,c:'ok',w:700})+mwT(39,58,'label = map',{fs:11.5})+
    '<path d="M81 28h10" stroke="var(--muted)" stroke-width="2"/><circle cx="100" cy="20" r="7" fill="var(--h1)" opacity=".7"/><path d="M100 29v20" stroke="var(--h1)" stroke-width="5" stroke-linecap="round"/>'+
    [['parent',112,6],['funny',172,6],['shy at first',112,34]].map(t=>'<rect x="'+t[1]+'" y="'+t[2]+'" width="'+(t[0].length*7+14)+'" height="20" rx="10" fill="var(--card)" stroke="var(--ok)"/>'+mwT(t[1]+7,t[2]+14,t[0],{fs:11.5,a:'start',c:'ink',w:500})).join('')+'</svg>';
  const P=[['ok','Reality is the ultimate update','The real world moves on while maps stand still. Good maps get corrected by people who go and look, so let your own visits overwrite the map.'+ST+'Stereotypes are maps too: handy for sorting fast, but a person holds far more than any label.'],
    ['h3','Consider the cartographer','No map is neutral. What its maker cared about, chose to measure and could see shapes it. Ask what they were after.'],
    ['no','Maps can influence territories','Jane Jacobs showed planners bending real neighbourhoods to fit their tidy models of a city, often making them worse.']];
  const A=['<path d="M96 136V92" stroke="var(--ok)" stroke-width="3"/><path d="M89 96l7-10 7 10z" fill="var(--ok)"/>'+mwT(106,118,'1 update',{fs:12,a:'start',c:'ok',w:700}),
    '<path d="M300 8l-16 20" stroke="var(--h3)" stroke-width="5" stroke-linecap="round"/><path d="M284 28l-3 6 6-3" fill="var(--h3)" stroke="var(--h3)"/>'+mwT(276,14,'2 who drew it?',{fs:12,a:'end',c:'h3',w:700}),
    '<path d="M236 82V128" stroke="var(--no-strong)" stroke-width="3"/><path d="M229 124l7 10 7-10z" fill="var(--no-strong)"/>'+mwT(228,110,'3 reshapes',{fs:12,a:'end',c:'no',w:700})];
  L.h(L.kick('learn','Three principles')+'<h1 class="q">Three ways a map and its territory affect each other. Tap each one.</h1>'+
   '<svg class="mw-pic" viewBox="0 0 320 210" role="img" aria-label="A map plane above a territory plane, with arrows between them">'+
   '<path d="M70 26H300L270 80H40Z" fill="var(--pri-bg)" stroke="var(--pri)" stroke-width="1.5"/><path d="M62 70Q110 58 150 68M196 68Q232 74 262 44" fill="none" stroke="var(--pri)" stroke-width="2" stroke-dasharray="5 4"/>'+mwT(172,58,'MAP',{fs:13,w:700,c:'pri'})+
   '<path d="M70 140H300L270 200H40Z" fill="var(--soft2)" stroke="var(--line2)" stroke-width="1.5"/><path d="M62 192q24-26 48 0q24-22 48 0q24-26 48 0q24-22 48 0" fill="none" stroke="var(--h2)" stroke-width="2"/>'+mwT(170,162,'TERRITORY',{fs:13,w:700,c:'ink'})+
   '<g id="pa"></g></svg><div id="pp" class="mw-cards">'+P.map((p,j)=>'<button class="opt" data-j="'+j+'"><span class="key">'+(j+1)+'</span><span><b>'+p[1]+'</b><span class="pp-x"></span></span></button>').join('')+'</div>'+
   '<p class="small" style="margin:8px 0 0">Whoever made a map is its '+L.g('cartographer','cartographer')+'.</p>');
  const on=new Set();
  L.$$('#pp button').forEach(b=>b.onclick=()=>{const j=+b.dataset.j;if(on.has(j))return;on.add(j);
    const c=['ok','h3','no'][j];b.style.borderColor='var(--'+(j===1?'h3':c+'-line')+')';b.style.background='var(--'+c+'-bg)';b.style.cursor='default';
    L.$('#pa').insertAdjacentHTML('beforeend',A[j]);

    if(on.size===3)L.done();});}},

{part:2,src:'The Map Is Not the Territory · Maps Can’t Show Everything',pts:1,
 solve:async L=>{L.$('#cpo').children[2].click();L.$('#cpp').click();await L.sleep(2500);},
 run(L){
  let p=null;
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">Same orders, same week. Sales and the clients each count “on time” their own way. Whose number is lowest?</h1>'+
   '<div id="cph"></div><div id="cpo" class="mw-ch" style="margin-top:8px">'+['Warehouse','Sales','Clients'].map(t=>'<button class="chip">'+t+'</button>').join('')+'</div>'+
   '<button class="btn pri" id="cpp" hidden>'+L.ic('play')+'Redraw the map three ways</button><div class="mw-res" id="cpr"></div><p class="small" style="margin:6px 0 0">Pella’s 95% is the warehouse’s figure. The other two numbers are illustrative.</p>');
  const m=mwMake(L.$('#cph'),{gaps:false,s:{detail:2,showDef:true}});
  L.$$('#cpo .chip').forEach((b,j)=>b.onclick=()=>{if(p!==null)return;p=j;b.classList.add('sel');L.$('#cpp').hidden=false;});
  L.$('#cpp').onclick=function(){this.remove();const R=['s','w','c'];let j=0;
    const step=()=>{if(!L.$('#cpr')||!L.$('#cpr').isConnected)return;
      if(j===R.length){const ok=p===2;L.award(ok);
        L.sheet(ok?'ok':'no',ok?'You called it':'The clients’ map is lowest','Same orders, three numbers: 100, 95 and 78. None is fake. Each '+'cartographer counts the moment that matters to them: sales the promise, the warehouse the packing, the clients the arrival. Before a number steers you, ask who drew it and what they wanted.');L.done();return;}
      const k=R[j],c=MW_CA[k];m.set({carto:k});
      L.$('#cpr').insertAdjacentHTML('beforeend','<span><b>'+c.short+'</b></span><div class="bar"><i style="background:var(--'+(c.v>=90?'ok-strong':'no-strong')+')"></i></div><b>'+c.v+'%</b>');
      const bars=L.$$('#cpr .bar i');requestAnimationFrame(()=>requestAnimationFrame(()=>{bars[bars.length-1].style.width=c.v+'%';}));
      j++;setTimeout(step,700);};
    step();};}},

{part:2,src:'The Map Is Not the Territory · Maps Can’t Show Everything',pts:1,
 solve:async L=>{L.$('#ipo').children[1].click();L.$('#ipp').click();await L.sleep(2200);},
 run(L){
  let p=null;
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">Pella tells the team: “Pack every order by its due date, whatever it takes. Keep the number green.” What happens?</h1>'+
   '<div id="iph"></div><div id="ipo" class="mw-cards">'+['The number rises, and clients get their orders sooner','The number rises, but clients’ orders arrive no sooner','Nothing changes: the floor ignores the dashboard'].map((t,j)=>'<button class="opt"><span class="key">'+(j+1)+'</span><span>'+t+'</span></button>').join('')+'</div>'+
   '<button class="btn pri" id="ipp" hidden style="margin-top:10px">'+L.ic('play')+'Watch the floor</button>');
  const m=mwMake(L.$('#iph'),{gaps:false,s:{detail:2},ro:s=>'<div>Dashboard: <b>'+(s.early?99:95)+'%</b> shipped on time · Clients’ view: <b style="color:var(--no)">78%</b> arrived on time</div>'});
  L.$$('#ipo .opt').forEach((b,j)=>b.onclick=()=>{if(p!==null)return;p=j;b.classList.add('sel');b.style.borderColor='var(--pri)';L.$('#ipp').hidden=false;});
  L.$('#ipp').onclick=function(){this.remove();L.$$('#ipo .opt').forEach((x,z)=>{if(z!==p)x.style.display='none';});
    setTimeout(()=>{if(!m.el.isConnected)return;m.set({early:true});},350);
    setTimeout(()=>{if(!m.el.isConnected)return;m.set({spots:[[206,74,110,140]]});},950);
    setTimeout(()=>{if(!m.el.isConnected)return;m.set({spots:[[206,74,110,140],[279,42,38,40]]});const ok=p===1;L.award(ok);
      L.sheet(ok?'ok':'no',ok?'The map changed the floor':'The number rose; deliveries didn’t','To keep the map green, the team packs early. The dashboard hits 99%, the pile on the dock grows, and clients still wait for the same trucks. The book’s example of this principle: Jane Jacobs’ planners, who bent real cities to match their models. (Ira’s case is made up.)');L.done();},1600);};}},

{part:2,src:'The Map Is Not the Territory · Conclusion',pts:1,run(L){
  L.h(L.kick('pr','Choose your mapmakers')+'<h1 class="q">Ira can’t check every report personally. Build the book’s rule for whose maps to rely on.</h1>');
  L.sentence(L.card,[['Pick a mapmaker who is rigorous,','Pick the most confident mapmaker,','Pick the mapmaker with the most data,'],['agrees with what you think,','never admits a mistake,','is open about how the map was made,'],['and sticks to it no matter what.','and updates it when reality changes.','and always sounds certain.']],[0,2,1],
   [['Confidence says nothing about how carefully the map was made.','More data still gets squeezed into someone’s map. The book asks how rigorous they are.'],['A map that flatters you is the easiest one to trip over.','Someone who never admits a mistake can’t be open to revision.'],['Sticking to a map no matter what is using it as dogma.','Sounding certain isn’t the same as being open to revision.']],
   'The book’s advice: if someone else draws the map, trust <b>careful mapmakers who show how they work and change course when wrong</b>.');}},

/* ---------- PART 4: USE IT ---------- */
{part:3,src:'Course application · built on The Map Is Not the Territory',
 solve:async L=>{L.$('#s1b').click();L.$('#s2b').click();mwSlide(L,'#fw','wipe',100);L.$('#s4c').children[2].click();},
 run(L){
  L.h(L.kick('learn','The one-minute move')+'<h1 class="q">Run the one-minute move on a flat Ira and Remy might rent</h1>'+mwAp(L,'the book has no step-by-step routine; these four steps use only the chapter’s own advice.')+'<div id="fw"></div><div id="fs"></div>');
  let stage=0;
  const m=mwMake(L.$('#fw'),{ctrls:['wipe'],s:{scene:'flat'},change(){if(stage===3&&m.found.size===3)s4();}});
  const row=(n,t,body,id)=>'<div class="st-row"'+(id?' id="'+id+'"':'')+'><span class="mw-n pri">'+n+'</span><div class="bx"><b>'+t+'</b>'+body+'</div></div>';
  L.$('#fs').innerHTML=row(1,'Name the map','<button class="btn" id="s1b" style="margin-top:4px">Name it</button>','s1');
  L.$('#s1b').onclick=()=>{L.$('#s1').innerHTML=row(1,'Name the map','The listing: photos plus “5 min to the station · quiet street”.');stage=1;
    L.$('#fs').insertAdjacentHTML('beforeend',row(2,'Who made it, when, why?','<button class="btn" id="s2b" style="margin-top:4px">Consider the cartographer</button>','s2'));
    L.$('#s2b').onclick=()=>{L.$('#s2').outerHTML=row(2,'Who made it, when, why?','The letting agent, last spring, to let the flat fast.');stage=2;
      L.$('#fs').insertAdjacentHTML('beforeend',row(3,'What does it leave out?','<span id="s3t">Drag the listing aside and find three gaps.</span>','s3'));stage=3;
      if(m.found.size===3)s4();};};
  function s4(){if(stage!==3)return;stage=4;
    L.$('#s3t').innerHTML='Three gaps found (listed under the picture).';
    L.$('#fs').insertAdjacentHTML('beforeend',row(4,L.g('touch-territory','Touch the territory')+': one quick real check','<div class="mw-ch" id="s4c">'+['Ask the agent if it’s quiet','Look at more photos online','Visit at 8 a.m. on a weekday'].map(t=>'<button class="chip">'+t+'</button>').join('')+'</div><div id="s4f"></div><div class="mw-de"><b>Dead end: can’t check it yourself?</b> Borrow a check from a mapmaker without the agent’s stake, like the current tenant or a neighbour. Prefer sources that are careful, open about how they know, and willing to correct themselves.</div>'));
    const FB=['The same cartographer, with the same aim. You’d get another map.','More photos from the same listing are more of the same map.'];
    [...L.$('#s4c').children].forEach((b,j)=>b.onclick=()=>{if(stage===5)return;L.$('#s4f').innerHTML='';
      if(j<2){b.classList.add('no');L.fb(L.$('#s4f'),FB[j],'no');return;}
      stage=5;b.classList.add('ok');
      L.sheet('info','Four steps, about a minute','Ira and Remy visit at 8 a.m. before signing anything: buses idling, damp showing, a 14-minute walk. The listing was a map made by someone who wanted to let the flat, and it left out what mattered to them. Now their map is updated.');L.done();});}}},

{part:3,src:'Course application · built on The Map Is Not the Territory',pts:1,run(L){
  L.h(L.kick('try','Your one-minute move')+'<h1 class="q">Ira’s review says “needs to delegate more”. Put Ira’s one-minute move in order.</h1>'+mwAp(L,'the signs and the four steps are built only from the chapter’s advice.')+mwWhen([0,2])+
   '<p class="small" style="margin:-4px 0 8px">The review is a map driving a decision about Ira’s work, and Pella made it. Two signs: time for the move.</p>');
  L.order(L.card,['Name the map: the yearly review','Who made it: Pella, from the dashboard and two meetings','What it leaves out: the floor fixes Pella never sees','One real check: hand off one task this week'],
   'Name it, consider the cartographer, ask what’s missing, then touch the territory. The review may still be right; now Ira will know.',['Name it','Who, when, why','What’s left out','Quick real check']);}},

{part:3,src:'The Map Is Not the Territory · opening',pts:1,
 solve:async L=>{L.$('#chk').children[2].click();},
 run(L){
  const O=[['Ask the warehouse for a fuller report',[],0,'Another map from the same cartographer: same definition, same 95%. Nothing new.'],
   ['Add a “late orders” chart to the dashboard',[],0,'More map, drawn from the same counts. It can’t show what it doesn’t count.'],
   ['Walk to the dock and find the hotel chain’s order',[[150,124,32],[206,74,110,140]],100,'There it is: packed on Monday, counted as shipped, still waiting for a truck. One trip explains the whole gap.'],
   ['Call one of the late clients',[[279,42,38,40]],50,'Real territory: the order did arrive late. But the call can’t tell you why the dashboard says otherwise.'],
   ['Read the paper ticket for one late order',[],50,'It shows the order was packed on time, but the ticket has no line for when it left. A ticket is a map too.']];
  L.h(L.kick('pr','Challenge')+'<h1 class="q">Find the one quick check that explains why clients say “late” while the dashboard says 95%. Fewest moves wins.</h1><div id="chh"></div>'+
   '<div class="mw-ro" id="chs">Moves: <b>0</b> · Gap explained: <b>0%</b></div><div class="mw-cards" id="chk">'+O.map((o,j)=>'<button class="opt"><span class="key">'+(j+1)+'</span><span>'+o[0]+'</span></button>').join('')+'</div><div id="chf"></div>');
  const m=mwMake(L.$('#chh'),{gaps:true,s:{detail:2}});let moves=0,best=0,first=true,fin=false;const sp=[];
  [...L.$('#chk').children].forEach((b,j)=>b.onclick=()=>{if(fin||b.getAttribute('aria-disabled'))return;const o=O[j];moves++;best=Math.max(best,o[2]);
    b.setAttribute('aria-disabled','true');b.classList.add(o[2]===100?'ok':'no');
    if(first){first=false;L.award(o[2]===100);}
    sp.push(...o[1]);m.set({spots:sp.slice()});
    L.$('#chs').innerHTML='Moves: <b>'+moves+'</b> · Gap explained: <b>'+best+'%</b>';
    L.$('#chf').innerHTML='';
    if(o[2]===100){fin=true;L.sheet(moves===1?'ok':'info',moves===1?'One move, gap explained':'Gap explained in '+moves+' moves',o[3]+' Reports about reports stay on the map. Only stepping into the territory showed the definition was the problem.');L.done();}
    else L.fb(L.$('#chf'),o[3]+' Try another check.','no');});}},

{part:3,src:'The Map Is Not the Territory · Maps Can’t Show Everything',
 solve:async L=>{const c=L.$('#lp').children;for(let j=0;j<4;j++)c[j].click();},
 run(L){
  const P=[['Perfect map',{detail:5},'Every box, shelf and pallet is on it, plus a map of the map. It’s as hard to read as the floor itself. A map is useful only because it leaves things out, so don’t demand a perfect one.'],
   ['Old map',{age:4,spots:[[90,140,28],[206,74,110,140]]},'Monday’s printout on Friday: the counts haven’t moved, the floor has. A map is a snapshot. The faster the territory changes, the faster it goes stale.'],
   ['Drawn by someone with a stake',{carto:'s',showDef:true},'Sales counts an order as on time when it’s promised for the client’s date: 100%. Maps carry the values and limits of whoever drew them.'],
   ['Map changes the floor',{early:true,spots:[[206,74,110,140]]},'The number became the goal. The team packs early to keep it green: 99% on the dashboard, a bigger pile on the dock, no faster deliveries.'],
   ['No map at all',{nomap:true},'Throw the map away and you face 140 orders at once, with no pattern in sight. You still need maps. Use each one inside the range where it’s known to work, as physicists do with Newton.'],
   ['Same map, different user',{driver:true,truck:1,spots:[[285,110,32,64]]},'Great for Pella’s question (how are we doing?), useless for the driver’s (where is it?). A map serves the user it was drawn for, like a trail map, not a pilot’s chart.']];
  const base={x:0,age:0,detail:3,carto:'w',early:false,nomap:false,driver:false,showDef:false,truck:null,spots:[]};
  L.h(L.kick('learn','Edge cases · where the map stops helping')+'<h1 class="q">Load the extreme cases. Tap at least four.</h1>'+mwAp(L,'the limits are the book’s; the cases on Pella’s floor are this course’s examples.')+'<div id="lh"></div><div class="mw-cap" id="lcap">Pick a case below to see what happens to the map and the floor.</div><div id="lp" class="mw-ch">'+P.map(p=>'<button class="chip">'+p[0]+'</button>').join('')+'</div>');
  const m=mwMake(L.$('#lh'),{gaps:false});const tried=new Set();
  [...L.$('#lp').children].forEach((b,j)=>b.onclick=()=>{L.$$('#lp .chip').forEach(x=>x.classList.toggle('sel',x===b));m.set(Object.assign({},base,{spots:[]},P[j][1]));
    L.$('#lcap').innerHTML='<b>'+P[j][0]+'.</b> '+P[j][2];tried.add(j);
    if(tried.size===4){L.sheet('info','Where this model stops working','<b>1.</b> Every map leaves things out, and a perfect one would be useless. <b>2.</b> You still need maps: use each one where it’s known to work. <b>3.</b> When you can’t check yourself, pick a mapmaker who is careful, shows their method and will correct mistakes. <b>4.</b> Maps can’t show every risk, so look around while you follow one.');L.done();}});}},

{part:3,src:'The Map Is Not the Territory · Conclusion',pts:1,run(L){
  L.h(L.kick('pr','Ira at home')+'<h1 class="q">After a minor fall, Wynn tells Ira on the phone: “I’m fine. Stop fussing.” What’s the map-aware next step?</h1>');
  L.mc(L.card,['Take it at face value: Wynn knows best','Assume the worst and start looking at care homes','Plan one small real check, like a video call where Ira sees Wynn move around the kitchen'],2,
   'Wynn’s words are a map, drawn by someone who hates fuss. One gentle real check touches the territory without overreacting. If even a call won’t work, Ira can borrow a check from someone who sees Wynn and will tell it straight, like a trusted neighbour.',
   'Both extremes skip the territory. Wynn’s “I’m fine” is a map from a cartographer who hates fuss; the worst case is a map from Ira’s worry. One small real check beats either.');}},

{part:3,src:'Course application · built on The Map Is Not the Territory',
 solve:async L=>{L.$('#ytc').children[0].click();const i=L.$('#ytk');i.value='Call one customer myself';i.dispatchEvent(new Event('input',{bubbles:true}));},
 run(L){
  const K=['A dashboard or report','A review or grade','A listing, ad or review site','A forecast or plan','Someone’s summary','A policy or manual'];
  L.h(L.kick('try','Your turn · not graded')+'<h1 class="q">Which map is steering your week? Name it, and the one quick check you’ll do.</h1>'+mwAp(L,'name the map, ask who made it and why, then touch the territory. Nothing here is saved.')+
   '<div class="yt-map"><small>THE MAP</small><b id="ytm">Pick one below</b><div class="yt-by" id="ytw"></div><div class="yt-gap" id="ytg"></div></div><div class="yt-ar">'+L.ic('down')+' touch the territory</div><div class="yt-ter"><small>MY ONE QUICK CHECK</small><b id="ytt">…</b></div>'+
   '<div id="ytc" class="mw-ch">'+K.map(t=>'<button class="chip">'+t+'</button>').join('')+'</div>'+
   '<label class="yt-in">Who made it, and what did they want? <span class="small">(optional)</span><input id="ytw2" type="text" maxlength="90" placeholder="e.g. my manager, to track the team’s speed"></label>'+
   '<label class="yt-in">What might it leave out? <span class="small">(optional)</span><input id="ytl" type="text" maxlength="90" placeholder="e.g. how the work actually feels to do"></label>'+
   '<label class="yt-in">My one quick real check<input id="ytk" type="text" maxlength="90" placeholder="e.g. call one customer myself"></label>'+
   '<div class="mw-de"><b>Can’t check it yourself?</b> Ask someone who has seen the real thing and has no stake in your choice, and favour sources that are careful, open about how they know, and quick to correct themselves.</div>');
  let kind=null,fin=false;
  const chk=()=>{const v=L.$('#ytk').value.trim();L.$('#ytt').textContent=v||'…';L.$('#ytg').textContent=L.$('#ytl').value.trim()?'Leaves out: '+L.$('#ytl').value.trim():'';L.$('#ytw').textContent=L.$('#ytw2').value.trim()?'Made by: '+L.$('#ytw2').value.trim():'';
    if(!fin&&kind!==null&&v.length>=3){fin=true;L.sheet('info','Do it before the map decides for you','Make the check this week, then update the map, or note what you found. When the data and what you see disagree, trust what you see and dig into why.');L.done();}};
  [...L.$('#ytc').children].forEach((b,j)=>b.onclick=()=>{kind=j;L.$$('#ytc .chip').forEach(x=>x.classList.toggle('sel',x===b));L.$('#ytm').textContent=K[j];chk();});
  ['#ytk','#ytl','#ytw2'].forEach(k=>L.$(k).addEventListener('input',chk));}},

{part:3,src:'Course application · built on The Map Is Not the Territory',run(L){
  L.h(L.kick('learn','How this course applies the book · your decision map')+'<h1 class="q">This model now has a place on three rows of your decision map</h1>'+
   '<div class="mw-cap" style="margin:0 0 6px">'+L.ic('map')+' <b>Reach for it when</b> a number, report, review, listing, plan or summary is driving the decision · the data and what people say disagree · the map is old or someone else made it.</div>'+
   '<div class="dm">'+DM_ROWS.map(r=>{let d='';for(let j=0;j<r[1];j++)d+=(j?'<span class="dm-j"></span>':'')+(j===r[2]?'<span class="dm-s on" title="The map is not the territory">'+L.ic('map')+'</span>':'<span class="dm-s"></span>');
     return '<div class="dm-r'+(r[2]>=0?' on':'')+'"><div>'+r[0]+(r[3]?'<small>'+r[3]+'</small>':'')+'</div><div class="dm-d">'+d+'</div></div>';}).join('')+'</div>'+
   '<p class="small" style="margin:6px 0 0">Dashed dots are models still to come. This one is rarely the first lens; it’s the reality check that follows one.</p>');
  L.done();}}
  ]
});
