/* models: [name, short, icon, colour] */
const OD_M={te:['Thought experiment','Thought exp.','flask','h1'],pr:['Probabilistic thinking','Probabilistic','trend','h2'],so:['Second-order thinking','Second-order','arrow','h3'],
 iv:['Inversion','Inversion','down','h4'],cc:['Circle of competence','Circle check','target','ok'],de:['Dead end','Dead end','alert','no'],
 out:['Six months on','Six months on','clock','muted'],act:['Act','Act','play','pri']};
const OD_ROW=['te','pr','so','iv','cc'];
const OD_SYM={w:'!',c:'+',n:'•',h:'?',u:'✗'};
const odCol=k=>'var(--'+OD_M[k][3]+')';
const odBg=k=>OD_M[k][3]==='muted'?'var(--soft)':'var(--'+OD_M[k][3]+'-bg)';
let odSeq=0;

/* table state */
function odStart(){return {cards:[
  {id:'mv',t:'Take it and move',f:'+20% pay · new lease near Fieldnote',m:[]},
  {id:'cm',t:'Take it and commute',f:'+20% pay · 90 min each way',m:[]},
  {id:'dc',t:'Decline and stay',f:'Secure job · finish the switchover',m:[]}],
 lease:[],log:[],seen:new Set(['cmv','ccm','cdc'])};}
const odCard=(st,id)=>st.cards.find(c=>c.id===id);
function odMk(st,id,k,t,x){const c=odCard(st,id);if(!c||c.x)return;c.m.push({k,t,x,id:++odSeq});}
function odX(st,id,why){const c=odCard(st,id);if(c&&!c.x)c.x=why;}
function odAdd(st,c){if(!odCard(st,c.id))st.cards.push(Object.assign({m:[]},c));}
function odLog(st,k,x,extra){st.log.push(Object.assign({k,x,id:++odSeq},extra||{}));}
/* what each model does to Ira’s table (default run, in the row’s order) */
const OD_FX={
 te:st=>{odMk(st,'cm','te','w','The commute decides it');odMk(st,'dc','te','n','Still wonders “what if”');
   odAdd(st,{id:'ns',t:'Ask: two remote days',f:'Same offer · fewer trips'});
   return 'Changed one thing at a time: the commute decides it. New card: ask for remote days.';},
 pr:st=>{odMk(st,'mv','pr','w','A deposit eats the savings');odMk(st,'cm','pr','w','90 min is a best case: pad it');
   ['cm','ns'].forEach(id=>odMk(st,id,'pr','c','Keep 6 months’ savings'));
   return 'Treated the start-up downside as fat-tailed (no cap): keep six months of savings untouched. The 90 minutes is optimistic: pad it.';},
 so:st=>{odMk(st,'cm','so','w','3 h a day: less sleep');odMk(st,'mv','so','w','Remy’s school is far');
     odMk(st,'dc','so','n','Trust with Pella kept');odMk(st,'ns','so','c','Start after the switchover');
   const n=odCard(st,'ns');if(n)n.t='Ask: later start, two remote days';
   return 'And then what? Leaving mid-switchover burns trust; 3 hours a day eats sleep. New condition: start after the switchover.';},
 de:st=>{st.lease.push({k:'de',t:'c',x:'Renew for a shorter term',id:++odSeq});
   return 'Standoff with Remy: Hanlon’s razor, then second-order. Next step both accept: a shorter lease.';},
 iv:st=>{odX(st,'mv','A long lease before the job is tested');odX(st,'cm','3 hours a day, 5 days a week');odMk(st,'ns','iv','c','If Fieldnote says no: decline');
   return 'What would guarantee this goes badly? Struck: moving now and commuting daily. Fallback: decline.';},
 cc:st=>{['Ask a Lifer first','What does the founder gain?','No big spending yet'].forEach(x=>odMk(st,'ns','cc','c',x));
   return 'Ira is a Stranger in software: ask a Lifer, check what the founder gains, no big spending yet.';}};
function odRun(st,k){odLog(st,k,OD_FX[k](st));}
function odSeenAll(st){st.cards.forEach(c=>{st.seen.add('c'+c.id);c.m.forEach(m=>st.seen.add(m.id));});st.lease.forEach(m=>st.seen.add(m.id));st.log.forEach(e=>st.seen.add(e.id));return st;}
function odUpTo(keys){const st=odStart();keys.forEach(k=>odRun(st,k));return odSeenAll(st);}
function odFull(de){const st=odUpTo(de===false?OD_ROW:['te','pr','so','de','iv','cc']);odCard(st,'ns').pick='Ira’s choice';return st;}

/* draw the table and its change log. o: {tapMarks, tapLog, order, skip:[keys], title, noLog} */
function odDraw(host,st,o){o=o||{};let n=0;
  const mk=(c,m,ci)=>{const nw=!st.seen.has(m.id),tag=o.tapMarks?'button':'div';const d=nw?';animation-delay:'+(Math.min(n++,8)*0.12)+'s':'';
    return '<'+tag+' class="od-mk '+m.t+(nw?' in':'')+'" style="--mc:'+odCol(m.k)+d+'"'+(o.tapMarks?' data-c="'+c.id+'" data-i="'+ci+'"':'')+'><b aria-hidden="true">'+OD_SYM[m.t]+'</b><span>'+m.x+'</span></'+tag+'>';};
  const card=c=>{const nw=!st.seen.has('c'+c.id);
    return '<div class="od-card'+(nw?' new':'')+(c.x?' x':'')+(c.pick?' pick':'')+(c.hunch?' hunch':'')+'" data-id="'+c.id+'">'+(c.pick?'<div class="od-rib">'+c.pick+'</div>':'')+
     '<div class="od-ct">'+c.t+'</div><div class="od-f">'+c.f+'</div>'+c.m.map((m,ci)=>mk(c,m,ci)).join('')+
     (c.x?'<div class="od-xr">✗ Struck: '+c.x+'</div><svg class="od-xo" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path d="M4 4L96 96M96 4L4 96" stroke="var(--no-strong)" stroke-width="2" opacity=".45" vector-effect="non-scaling-stroke"/></svg>':'')+'</div>';};
  const lease='<div class="od-lease"><span>'+L_ic('home')+' Lease:</span> renew in 2 months, rent +12%'+st.lease.map(m=>mk({id:'lease'},m,0)).join('')+'</div>';
  let slots;if(o.order)slots=st.log.map(e=>e.k);else{slots=OD_ROW.slice();if(st.log.some(e=>e.k==='de'))slots.splice(3,0,'de');}
  const tagL=o.tapLog?'button':'div';
  const lines=slots.map((k,j)=>{const e=st.log.find(x=>x.k===k);const sk=o.skip&&o.skip.includes(k);
    const nw=e&&!st.seen.has(e.id);const cls=e?(nw?' in':''):(sk?' skip':' empty');
    const txt=e?e.x:sk?'Skipped. Nothing on the table changed.':'Not run yet.';
    return '<'+tagL+' class="od-ll'+cls+'" data-k="'+k+'" style="--mc:'+odCol(k)+(nw?';animation-delay:'+(Math.min(n++,8)*0.12)+'s':'')+'"><i></i><div><span class="mn">'+(j+1)+' · '+OD_M[k][0]+'.</span> '+txt+'</div></'+tagL+'>';}).join('');
  host.innerHTML='<div class="od-tab"><div class="od-tt"><span>'+(o.title||'Ira’s table')+'</span><span>'+st.cards.filter(c=>!c.x).length+' standing</span></div><div class="od-cards">'+st.cards.map(card).join('')+'</div>'+(o.noLease?'':lease)+'</div>'+
   (o.noLog?'':'<div class="od-log"><div class="od-tt"><span>'+L_ic('pencil')+' Change log</span><span>'+st.log.length+' line'+(st.log.length===1?'':'s')+'</span></div>'+lines+'</div>');
  odSeenAll(st);}
let L_ic=()=>'';
const odShow=el=>{if(el&&el.scrollIntoView)el.scrollIntoView({behavior:'smooth',block:'start'});};

/* model bar: keys, o:{seq, locked:Set, done:Set, onRun(k,btn)} */
function odBar(L,host,keys,o){
  host.innerHTML='<div class="od-bar">'+keys.map((k,j)=>'<button class="od-mb" data-k="'+k+'" style="--mc:'+odCol(k)+';--mb:'+odBg(k)+'">'+L.ic(OD_M[k][2])+'<span>'+(j+1)+' · '+OD_M[k][0]+'</span></button>').join('')+'</div>';
  const done=o.done||new Set();
  const sync=()=>{let nx=true;[...host.querySelectorAll('.od-mb')].forEach(b=>{const k=b.dataset.k;const d=done.has(k);b.classList.toggle('done',d);
    const lock=(o.locked&&o.locked.has(k))||(o.seq&&!d&&!nx);b.classList.toggle('lock',!d&&lock);b.setAttribute('aria-disabled',String(d||lock));if(d)b.title='Already run';else if(lock)b.title='You run this one yourself in part 2';
    b.classList.toggle('next',!d&&!lock&&nx);if(!d&&!lock)nx=o.seq?false:nx;});};
  [...host.querySelectorAll('.od-mb')].forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(b.getAttribute('aria-disabled')==='true'||done.has(k))return;done.add(k);sync();o.onRun(k,b);});
  sync();return {done,sync};}

/* the journal page: rows [label, html|null, cls] */
function odJournal(host,rows,title){
  host.innerHTML='<div class="od-jp"><div class="od-jh">'+(title||'Decision journal')+'</div>'+rows.map((r,j)=>'<div class="od-jr'+(r[2]?' '+r[2]:'')+'" data-r="'+j+'"'+(r[3]?' style="animation-delay:'+r[3]+'s"':'')+'><span>'+r[0]+'</span><div class="'+(r[1]?'':'blank')+'">'+(r[1]||'…')+'</div></div>').join('')+'</div>';}
const odJm=k=>'<span class="od-jm" style="--mc:'+odCol(k)+'">'+OD_M[k][1]+'</span>';
const OD_JBASE=[
 ['Date','Sunday, week 1 of 2'],
 ['Decision','The Fieldnote offer (tangled with the lease)'],
 ['Models used',['te','pr','so','de','iv','cc'].map(odJm).join('')],
 ['What changed','New card from the commute · 6 months’ savings untouched · start after the switchover · shorter lease · struck moving now and daily commuting · ask a Lifer first'],

{part:1,src:'Course application · built on Hanlon’s Razor and Second-Order Thinking',pts:1,

{part:1,src:'Course application · built on Inversion',pts:1,
 solve:async L=>{L.$('#ip').children[2].click();L.$('#ig').click();},
 run(L){
  L_ic=L.ic;
  L.h(L.kick('pr','Predict, then run · inversion')+'<h1 class="q">Inversion asks: what would guarantee this goes badly? Which take-it card will survive?</h1>'+
   '<div class="od-chips col" id="ip"></div><div class="od-ctl"><button class="btn pri" id="ig" hidden>'+L.ic('down')+'Run inversion</button></div><ul class="od-fail" id="il"></ul><div id="it"></div>');
  const st=odUpTo(['te','pr','so','de']);odDraw(L.$('#it'),st);let p=null,ran=false;
  ['Take it and move','Take it and commute','Ask: later start, two remote days'].forEach((t,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=t;
    b.onclick=()=>{if(ran)return;p=j;L.$$('#ip .chip').forEach((x,q)=>x.classList.toggle('sel',q===j));L.$('#ig').hidden=false;};L.$('#ip').appendChild(b);});
  L.$('#ig').onclick=()=>{if(ran)return;ran=true;L.$('#ig').parentNode.remove();
    L.$('#il').innerHTML=[['Sign a long lease near Fieldnote before the job is tested',0],['Three hours on the road, five days a week, on top of bad sleep',0],['Walk out with the switchover half done',1]].map((f,j)=>'<li class="'+(f[1]?'done':'')+'" style="animation-delay:'+(j*0.2)+'s">'+(f[1]?'✓':'✗')+' <span>'+f[0]+(f[1]?' <i class="small">(already handled: start after the switchover)</i>':'')+'</span></li>').join('');
    odRun(st,'iv');odDraw(L.$('#it'),st);odShow(L.$('#il'));const ok=p===2;L.award(ok);L.$$('#ip .chip').forEach((x,q)=>{x.classList.remove('sel');if(q===2)x.classList.add('ok');else if(q===p)x.classList.add('no');});
    L.sheet(ok?'ok':'no',ok?'Only the new card stands':'The new card is the one left standing','Moving now means a long lease before the job is tested: hard to undo. Commuting daily means three hours a day on top of bad sleep. Avoiding these standard ways of failing raises Ira’s odds; the book is clear it doesn’t guarantee success, so the new card also gets a fallback: <b>decline if Fieldnote says no</b>.');L.done();};}},

{part:1,src:'Course application · built on Circle of Competence',pts:1,
 solve:async L=>{[0,2,4].forEach(j=>L.$('#cx').children[j].click());L.$('#cg').click();},
 run(L){
  L_ic=L.ic;
  const C=[[1,'Ask a Lifer who has run operations at a software start-up which variables matter, and why'],
   [0,'Read about software all weekend, then decide alone','A little learning breeds confidence, not competence: a Stranger who feels like a Lifer.'],
   [1,'Ask the founder what they gain from a fast yes'],
   [0,'Ask the founder: “Is this a great opportunity for me?”','The founder has a stake in Ira’s yes. Advice from someone with an incentive is skewed.'],
   [1,'Hold off on any big spending until it’s checked']];
  L.h(L.kick('pr','Your run · circle of competence check')+'<h1 class="q">Ira is a Lifer in operations but a Stranger in software start-ups. Pick the three moves the book’s advice points to.</h1>'+
   '<div class="od-chips col" id="cx"></div><div class="od-ctl"><button class="btn pri" id="cg" disabled>'+L.ic('target')+'Check and stamp</button></div><div id="cf"></div><div id="ct"></div>');
  const st=odUpTo(['te','pr','so','de','iv']);odDraw(L.$('#ct'),st);let first=true,fin=false;
  C.forEach((c,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=c[1];b.onclick=()=>{if(fin)return;b.classList.toggle('sel');L.$('#cg').disabled=L.$$('#cx .chip.sel').length!==3;};L.$('#cx').appendChild(b);});
  L.$('#cg').onclick=()=>{if(fin)return;const bs=L.$$('#cx .chip');const ok=bs.every((b,j)=>b.classList.contains('sel')===(C[j][0]===1));if(first){L.award(ok);first=false;}
    L.$('#cf').innerHTML='';
    if(!ok){const bad=bs.map((b,j)=>b.classList.contains('sel')&&!C[j][0]?C[j][2]:null).filter(Boolean);L.fb(L.$('#cf'),'<b>Not yet.</b> '+bad.join(' ')+' Swap that pick and check again.','no');return;}
    fin=true;bs.forEach((b,j)=>{b.classList.remove('sel');if(C[j][0])b.classList.add('ok');});L.$('#cg').parentNode.remove();odRun(st,'cc');odDraw(L.$('#ct'),st);odShow(L.$('#ct'));
    L.sheet('ok','Stranger moves, stamped on the card','Outside your circle, the book says: learn the basics, ask a Lifer which variables matter and why, remember an adviser’s incentives, and don’t rush big spending. Every card has now met every model in the row.');L.done();};}},

{part:1,src:'Course application · built on Second-Order Thinking and Thought Experiment',
 solve:async L=>{L.$$('#lp .chip').forEach(b=>b.click());},
 run(L){
  L_ic=L.ic;
  const P=[
   ['Skip a model',()=>{const st=odUpTo(['te','so','de','iv','cc']);const n=odCard(st,'ns');n.m.push({k:'pr',t:'h',x:'Savings: never checked',id:++odSeq});n.pick='Ira’s choice';return [st,{skip:['pr']}];},
    'Skip probabilistic thinking and the savings risk stays hidden: nothing on the table says “keep six months untouched”, so a deposit near Fieldnote could still happen. A skipped model leaves a blind spot exactly where it would have looked.'],
   ['Different order',()=>{const st=odStart();odX(st,'mv','A long lease before the job is tested');odX(st,'cm','3 hours a day, 5 days a week');odLog(st,'iv','Struck moving now and commuting daily. Only “decline” was left standing.');
      odLog(st,'te',OD_FX.te(st).replace('ask for remote days.','ask for remote days, after inversion already ran.'));['pr','so','cc'].forEach(k=>odRun(st,k));
      const n=odCard(st,'ns');n.m.push({k:'iv',t:'h',x:'Fallback: never checked',id:++odSeq});n.pick='Ira’s choice';return [odSeenAll(st),{order:true}];},
    'Inversion first strikes both take-it cards at once and leaves only “decline”. Stop there and Ira declines. Keep going and the thought experiment still makes the new card, but inversion never looked at it, so its fallback is missing. The order is this course’s suggestion, not the book’s law; what matters is that every option meets every lens.'],
   ['Good outcome, bad process',()=>{const st=odStart();const c=odCard(st,'mv');c.pick='Chosen on a hunch';c.hunch=1;c.m.push({k:'out',t:'n',x:'Six months on: it worked out',id:++odSeq});return [odSeenAll(st),{}];},
    'A twin Ira takes it and moves on a hunch, and it works out. The log is empty: nothing to learn from, nothing to repeat. The book is plain that a good result doesn’t prove the thinking was good, and that lucky wins hide how often the same move would have gone badly.'],
   ['Stop and act',()=>{const st=odFull();odMk(st,'ns','act','c','Act now: send the counter-offer');return [st,{}];},
    'More thinking won’t tell Ira whether Fieldnote says yes; only asking will. And the worst likely outcome can’t take Ira out of the game: savings untouched, current job kept until there’s a yes. So act, with a small, reversible step. (How this course applies the book: lesson 12’s act signal.)'],
   ['Each model’s limit',()=>{const st=odFull();st.log.forEach(e=>{e.x='<b>Limit:</b> '+OD_LIM[e.k];});return [st,{}];},
    'Every line on the log has an edge, per the book. The row leaves Ira better informed, not certain: rough numbers, likely effects, better odds and borrowed expertise. Know each edge so you don’t over-trust the table.']];
  L.h(L.kick('ex','Edge cases and limits')+'<h1 class="q">Where does walking the row go wrong, or need to stop? Load each case.</h1>'+
   '<div class="od-chips" id="lp" style="justify-content:center"></div><div id="lf" aria-live="polite"></div><div id="lt"></div>');
  const seen=new Set();let fin=false;
  odDraw(L.$('#lt'),odFull());
  P.forEach((p,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=p[0];b.onclick=()=>{L.$$('#lp .chip').forEach((x,q)=>x.classList.toggle('sel',q===j));
    const r=p[1]();odDraw(L.$('#lt'),r[0],r[1]);L.$('#lf').innerHTML='';L.fb(L.$('#lf'),p[2],j===3?'ok':j===2?'no':'info');seen.add(j);
    if(!fin&&seen.size===P.length){fin=true;L.sheet('info','Five limits to remember','<b>1.</b> A skipped model leaves its blind spot on the table. <b>2.</b> Order matters less than coverage (this course’s view, not the book’s): run every lens on every card, new ones too. <b>3.</b> Judge the process, not the result. <b>4.</b> Stop when thinking can’t remove the doubt left, and the step can’t take you out of the game. <b>5.</b> Each model has its own edge: a ballpark, not certainty; likely effects, not every chain; better odds, not a guarantee.');L.done();}};
    L.$('#lp').appendChild(b);});}},

/* ---------- PART 3: DECIDE AND RECORD ---------- */
{part:2,src:'Course application · built on the Introduction',pts:1,
 solve:async L=>{['te','pr','cc'].forEach(k=>L.$('#ht .od-ll[data-k="'+k+'"]').click());L.$('#hc').click();L.$('#hr').click();},
 run(L){
  L_ic=L.ic;
  L.h(L.kick('pr','Challenge · audit the log')+'<h1 class="q">Tired on Sunday night, Ira rushed a second run. Tap every log line that changed nothing on the table, or is missing.</h1>'+
   '<div id="ht"></div><div class="od-ctl"><button class="btn pri" id="hc">'+L.ic('eye')+'Check my audit</button></div><div id="hf"></div>');
  const st=odStart();odMk(st,'cm','so','w','3 h a day: less sleep');odX(st,'mv','A long lease before the job is tested');
  odLog(st,'te','Imagined taking it. Felt exciting.');odLog(st,'so','And then what? 3 hours a day eats sleep.');odLog(st,'iv','Struck: a long lease before the job is tested.');odLog(st,'cc','Read about software all weekend. I’m fine.');
  odSeenAll(st);
  const draw=()=>{odDraw(L.$('#ht'),st,{tapLog:true,title:'Ira’s rushed run'});L.$$('#ht button.od-ll').forEach(b=>{b.setAttribute('aria-pressed',String(fl.has(b.dataset.k)));b.classList.toggle('flag',fl.has(b.dataset.k));
    b.onclick=()=>{if(chk)return;const k=b.dataset.k;fl.has(k)?fl.delete(k):fl.add(k);draw();};});};
  const fl=new Set();let chk=false;draw();
  L.$('#hc').onclick=()=>{if(chk)return;chk=true;const R=['te','pr','cc'];const ok=fl.size===3&&R.every(k=>fl.has(k));L.award(ok);
    L.$$('#ht button.od-ll').forEach(b=>{b.classList.remove('flag');b.classList.toggle(R.includes(b.dataset.k)?'flag':'ok',true);});
    L.$('#hc').parentNode.remove();
    L.fb(L.$('#hf'),(ok?'<b>All three found.</b> ':'<b>The weak lines: thought experiment, probabilistic and the circle check.</b> ')+'“Felt exciting” changed no variable. Probabilistic never ran, so the savings are unguarded. A weekend of reading is a Stranger feeling like a Lifer. A model that leaves no mark on the table wasn’t really run.',ok?'ok':'no');
    L.$('#hf').insertAdjacentHTML('beforeend','<div class="od-ctl"><button class="btn pri" id="hr">'+L.ic('cycle')+'Rerun the row properly</button></div>');
    L.$('#hr').onclick=()=>{L.$('#hr').parentNode.remove();const f=odStart();OD_ROW.forEach(k=>odRun(f,k));odCard(f,'ns').pick='Ira’s choice';odDraw(L.$('#ht'),f);odShow(L.$('#ht'));
      L.sheet(ok?'ok':'info','Five lines, five changes','Rerun in order, every model leaves a mark: a new card, a savings rule, a start date, two struck cards and three checks before signing. That’s the test for a real run: <b>no line without a change</b>.');L.done();};};}},

{part:2,src:'Course application · built on the Introduction',run(L){

   ['This week','Ira sends Fieldnote’s founder a counter-offer: start after the switchover lands, two remote days a week. Asking is small and reversible.'],

{part:2,src:'Course application · built on the Introduction',pts:1,
 solve:async L=>{L.$('#jq0').children[2].click();L.$('#jq1').children[0].click();L.$('#jq2').children[1].click();L.$('#jc').click();},
 run(L){
  L_ic=L.ic;
  const Q=[['Ira expects',['Everything goes perfectly','No need to write what I expect','Fieldnote agrees to a later start; maybe one remote day, not two'],2],
   ['How sure',['About 60%, to update when Fieldnote replies','100%: it’s the right call','Can’t put a number on it'],0],
   ['Review on',['Only if it goes badly','In six months, whatever happens','Never: it’s decided'],1]];
  L.h(L.kick('pr','The journal page')+'<h1 class="q">Finish Ira’s '+L.g('decision-journal','journal entry')+'. Tap a line for each blank and watch the page fill.</h1><div id="jp"></div>'+
   Q.map((q,j)=>'<div class="od-lab">'+q[0]+'</div><div class="od-chips col" id="jq'+j+'"></div>').join('')+
   '<div class="od-ctl"><button class="btn pri" id="jc" disabled>'+L.ic('pencil')+'Sign the entry</button></div><div id="jf"></div>');
  const pick=[null,null,null];let first=true,fin=false;
  const page=nw=>{odJournal(L.$('#jp'),OD_JBASE.concat(Q.map((q,j)=>[q[0],pick[j]===null?null:q[1][pick[j]]])),'Decision journal · Ira');if(nw!==undefined){const d=L.$('#jp .od-jr[data-r="'+(OD_JBASE.length+nw)+'"]>div');if(d)d.classList.add('in');}};
  page();
  Q.forEach((q,j)=>q[1].forEach((t,o)=>{const b=document.createElement('button');b.className='chip';b.textContent=t;b.onclick=()=>{if(fin)return;pick[j]=o;L.$$('#jq'+j+' .chip').forEach((x,z)=>x.classList.toggle('sel',z===o));page(j);L.$('#jc').disabled=pick.includes(null);};L.$('#jq'+j).appendChild(b);}));
  L.$('#jc').onclick=()=>{if(fin)return;const ok=pick.every((p,j)=>p===Q[j][2]);if(first){L.award(ok);first=false;}L.$('#jf').innerHTML='';
    if(ok){fin=true;L.$('#jc').parentNode.remove();L.sheet('ok','An entry you can learn from','A specific expectation can be checked later. A rough number (probabilistic thinking: almost nothing is 100% certain) can be updated when Fieldnote replies. And a fixed review date means Ira looks back whatever happens, not only after a disaster. The book: keep a record of how you decided and what happened, then think it over.');L.done();}
    else{const why=['','',''];if(pick[0]!==2)why[0]='Write a specific expectation, so six months from now there’s something to compare.';if(pick[1]!==0)why[1]='Give a rough number you can update; certainty, or no number at all, teaches nothing.';if(pick[2]!==1)why[2]='Review whatever happens: judging only bad results hides lucky good ones.';
      L.fb(L.$('#jf'),'<b>Not quite.</b> '+why.filter(Boolean).join(' ')+' Change those lines and sign again.','no');}};}},

{part:2,src:'Introduction · Time Invested Yields Enormous Benefits',
 solve:async L=>{L.$('#rv').click();},
 run(L){
  L_ic=L.ic;
  const done=[['Ira expects','Fieldnote agrees to a later start; maybe one remote day, not two'],['How sure','About 60%'],['Review on','In six months']];
  const R=[['Happened','Later start agreed, and one remote day. The switchover landed first.'],['Surprise','Four commuting days are tiring. The padded estimate was right.'],
   ['Lens to revisit','Thought experiment: Ira never asked “if the hours were fixed?”. Start-up evenings mattered as much as the trip: the wrong variable got the focus.'],['Process','Same row next time; ask the remote-day question in the first call.']];
  L.h(L.kick('learn','Six months later')+'<h1 class="q">The entry only pays off when Ira comes back to it</h1><div id="rp"></div>'+
   '<div class="od-ctl"><button class="btn pri" id="rv">'+L.ic('clock')+'Turn to six months later</button></div><p class="od-cap" id="rc">Imagined, six months on. Turn the page and compare.</p>');

    L.$('#rc').innerHTML='The book’s advice: record and reflect on how you used the models and what happened. When a model didn’t help, don’t drop it; work out why. Maybe you understood it too little, missed part of the situation, or focused on the wrong variable.';

{part:2,src:'Introduction · Time Invested Yields Enormous Benefits',pts:5,run(L){
  L_ic=L.ic;
  L.h(L.kick('pr','Process or outcome?')+'<h1 class="q">Five journal reviews from Ira’s friends. Judge the process, not the result.</h1>');
  L.buckets(L.card,['Good process','Weak process'],[
   ['Took a new job on a hunch. It worked out brilliantly.',1,'A lucky result doesn’t prove the thinking was good. Nothing here could be repeated on purpose.'],
   ['Walked the row, kept savings untouched. The start-up folded; back on my feet in two months.',0,'A bad outcome, a good process: failing properly, never out of the game.'],
   ['Ran all five models, but none changed anything about the options.',1,'A model that leaves no mark wasn’t really run.'],
   ['Bought the car the dealer pushed, with no checks. No trouble so far.',1,'No lens at all; “so far” is luck, and the dealer had a stake.'],
   ['Asked a Lifer, padded my estimate, wrote it down. It went worse than I hoped, and the journal shows why.',0,'The journal turns a disappointment into a lesson about which variable was missed.']],
   'At first, the process matters more than the outcome. Judge a decision by what you knew and did, and use the journal to find out why results came out as they did.');}},

{part:2,src:'Course application · built on every model',pts:5,run(L){
  L_ic=L.ic;
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which model wrote this log line?',['Thought experiment','Probabilistic thinking','Second-order thinking','Inversion','Circle of competence'],[
   ['Moving nearer Wynn: pictured it with Remy’s job unchanged, then changed. Remy’s job decides it.',0,'Changing one variable at a time to see which one flips the choice is the thought experiment.'],
   ['If we move, then what? Wynn gets more help; Ira’s commute doubles; Remy changes schools.',2,'“And then what?” for you, for others and for trust is second-order thinking.'],

{part:3,src:'Course application · built on the Introduction',pts:1,run(L){
  L_ic=L.ic;
  L.h(L.kick('pr','The routine for a big decision')+'<h1 class="q">Put Ira’s routine for a big decision in order.</h1>'+L.note('How this course applies the book: the steps you ran today, as one routine.','compass'));
  L.order(L.card,['Name it: a big bet between uncertain options','Lay out the options as cards','Run each model in the row; each must change a card','Act with a small, reversible first step','Write the entry: expectation, a rough number, a review date','On the review date, compare what happened with what you expected'],
   'Name it, lay it out, run the row, act small, write it down, look back. The look back is what turns one decision into skill.');}},

{part:3,src:'Course application · built on Thought Experiment and Probabilistic Thinking',
 solve:async L=>{const set=(id,v)=>{L.$(id).value=v;L.$(id).dispatchEvent(new Event('input',{bubbles:true}));};set('#yd','Go back to studying part-time');set('#ya','Start this autumn');set('#yb','Wait a year');
   L.$('#yv').children[1].click();L.$('#yf').children[0].click();L.$('#yo').children[2].click();L.$('#yr').children[2].click();L.$('#yg').click();},
 run(L){
  L_ic=L.ic;
  const V=['Money','Time','Distance','What others think'];
  L.h(L.kick('pr','Your turn · ungraded')+'<h1 class="q">Put one big decision of yours on the table, and run the first two models.</h1>'+
   L.note('How this course applies the book: the row for a big bet, started on your own decision.','compass')+
   '<label class="od-lab" for="yd" style="display:block">YOUR BIG DECISION</label><input class="od-in" id="yd" maxlength="60" placeholder="e.g. whether to change teams">'+
   '<div class="od-two"><div><label class="od-lab" for="ya" style="display:block">OPTION A</label><input class="od-in" id="ya" maxlength="28" placeholder="e.g. move now"></div><div><label class="od-lab" for="yb" style="display:block">OPTION B</label><input class="od-in" id="yb" maxlength="28" placeholder="e.g. stay a year"></div></div>'+
   '<span class="od-lab" style="display:block">THOUGHT EXPERIMENT · IF THIS WERE NO OBJECT…</span><div class="od-chips" id="yv"></div>'+
   '<span class="od-lab" style="display:block">…WOULD YOUR CHOICE FLIP?</span><div class="od-chips" id="yf"></div>'+
   '<span class="od-lab" style="display:block">PROBABILISTIC · COULD AN OPTION TAKE YOU OUT OF THE GAME?</span><div class="od-chips" id="yo"></div>'+
   '<span class="od-lab" style="display:block">REVIEW IT IN</span><div class="od-chips" id="yr"></div>'+
   '<div class="od-ctl"><button class="btn pri" id="yg" disabled>'+L.ic('pencil')+'Stamp my table and write it down</button></div><div id="yt"></div><div id="yj"></div>');
  const sel={v:null,f:null,o:null,r:null};
  const chips=(id,arr,key)=>arr.forEach((t,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=t;b.onclick=()=>{sel[key]=j;L.$$(id+' .chip').forEach((x,q)=>x.classList.toggle('sel',q===j));chk();};L.$(id).appendChild(b);});
  chips('#yv',V,'v');chips('#yf',['It flips','It doesn’t'],'f');chips('#yo',['Option A','Option B','Neither'],'o');chips('#yr',['1 month','3 months','6 months'],'r');
  const val=id=>L.$(id).value.trim();
  function chk(){L.$('#yg').disabled=!(val('#yd').length>2&&val('#ya')&&val('#yb')&&Object.values(sel).every(x=>x!==null));}
  ['#yd','#ya','#yb'].forEach(id=>L.$(id).addEventListener('input',chk));
  L.$('#yg').onclick=()=>{const v=V[sel.v].toLowerCase(),fl=sel.f===0;
    const st={cards:[{id:'a',t:L.esc(val('#ya')),f:'Option A',m:[]},{id:'b',t:L.esc(val('#yb')),f:'Option B',m:[]}],lease:[],log:[],seen:new Set()};
    ['a','b'].forEach(id=>odMk(st,id,'te',fl?'w':'n',fl?'“'+V[sel.v]+'” decides it: work on that':'“'+V[sel.v]+'” doesn’t flip it'));
    if(sel.o<2)odMk(st,sel.o===0?'a':'b','pr','w','Could take me out of the game: don’t, or prepare first');
    ['a','b'].forEach(id=>odMk(st,id,'pr','c','Pad my estimate'));
    odLog(st,'te','If '+v+' were no object, my choice '+(fl?'flips: '+v+' is the variable to work on.':'stays the same.'));
    odLog(st,'pr',(sel.o<2?'Option '+(sel.o?'B':'A')+' could take me out of the game: avoid it or prepare. ':'No ruinous option. ')+'Estimates padded.');
    st.seen.add('ca');st.seen.add('cb');
    odDraw(L.$('#yt'),st,{noLease:true,title:'My table · '+L.esc(val('#yd'))});
    odJournal(L.$('#yj'),[['Decision',L.esc(val('#yd'))],['Options',L.esc(val('#ya'))+' · '+L.esc(val('#yb'))],['Models used',odJm('te')+odJm('pr')],['Review in',['1 month','3 months','6 months'][sel.r]]],'My decision journal');
    L.sheet('info','Two lines down, three to go','Run second-order, inversion and the circle check the same way, one line each, and make sure each changes a card. Copy the entry into a real notebook, and look back on the review date whatever happens.');L.done();};}},

{part:3,src:'Course application · built on Hanlon’s Razor, Second-Order Thinking and Occam’s Razor',pts:3,
 solve:async L=>{for(let i=0;i<OD_DAY.length;i++){L.$('#dm button.od-dm[data-r="'+OD_DAY[i].row+'"]').click();L.$('#dm button.m[data-j="0"]').click();const n=L.$('#dn');if(n)n.click();}},
 run(L){
  L_ic=L.ic;
  L.h(L.kick('pr','Your toolkit · small decisions')+'<h1 class="q">Any decision, from lunch to a new job. For each small one, tap its row, then the one model to run first.</h1>'+
   L.note('How this course applies the book: the whole decision map. Small and easy to undo? One model, about a minute, then act.','compass')+
   '<div class="od-sc" id="dsc"></div><div id="dsay"></div><div class="od-fz" id="dfz" aria-hidden="true"></div><div class="od-cap" id="dx" aria-live="polite" style="margin:4px 0 8px"></div><div id="dm"></div>');
  let i=0,ph=0,rp=null,mp=null;
  const draw=()=>{const s=OD_DAY[i],first=OD_MAPN[OD_MAPR[s.row][1][0]];
   L.$('#dsc').innerHTML=OD_DAY.map((x,j)=>'<i class="'+(j<i||(j===i&&ph===2)?'done':j===i?'on':'')+'"></i>').join('')+'<span class="small" style="margin-left:4px">Decision '+(i+1)+' of '+OD_DAY.length+'</span>';
   L.$('#dsay').innerHTML='<div class="od-say"><b>'+s.tag+'</b>'+s.say+'</div>';
   const lit=ph===0?0:ph===1?1:3;
   L.$('#dfz').innerHTML=[['Name it','10 s'],['Run it','40 s'],['Check it','10 s']].map((f,j)=>'<div class="'+(j<lit?'on':'')+'">'+f[0]+'<span>'+f[1]+'</span></div>').join('');
   L.$('#dx').innerHTML=ph===0?'<b>Name it.</b> Which kind of decision is this? Tap its row on the map.':
    ph===1?(rp===s.row?'<b>Right row.</b> ':'<b>Not that row.</b> '+s.why+' ')+'<b>Run it:</b> tap the model to try first.':
    (mp===0?'':'<b>Start with the row’s first model, '+first+'.</b> ')+'<b>Run '+first+':</b> '+s.run+'<br><b>Check its limit:</b> '+s.chk+
    (i<OD_DAY.length-1?'<div class="od-ctl"><button class="btn pri" id="dn">'+L.ic('play')+'Next decision</button></div>':'');
   L.$('#dm').innerHTML=OD_MAPR.map((r,ri)=>{const hot=ph>0&&ri===s.row,bad=ph>0&&ri===rp&&rp!==s.row;
    const ms=r[1].map((k,j)=>(j?'<span class="ar">→</span>':'')+(ph===1&&hot?'<button class="m" data-j="'+j+'">'+OD_MAPN[k]+'</button>':'<span class="m'+(ph===2&&hot?(j===0?' first':j===mp?' miss':''):'')+'">'+OD_MAPN[k]+'</span>')).join('');
    const inner='<b>'+r[0]+(r[2]?' <span class="small">· today’s big bet</span>':'')+'</b><div class="r">'+ms+'</div>';
    return ph===0?'<button class="od-dm" data-r="'+ri+'">'+inner+'</button>':'<div class="od-dm'+(hot?' hot':'')+(bad?' bad':'')+'">'+inner+'</div>';}).join('');
   L.$$('#dm button.od-dm').forEach(b=>b.onclick=()=>{if(ph!==0)return;rp=+b.dataset.r;ph=1;draw();});
   L.$$('#dm button.m').forEach(b=>b.onclick=()=>{if(ph!==1)return;mp=+b.dataset.j;ph=2;L.award(rp===s.row&&mp===0);draw();odShow(L.$('#dsay'));
    if(i===OD_DAY.length-1){L.sheet('info','Three decisions, about three minutes','Each was small and easy to undo, so one model, then act. A big bet like Fieldnote gets the whole row and a journal entry. Stuck? Name the knot. Always check the model’s limit before you trust it. (How this course applies the book.)');L.done();}});
   const n=L.$('#dn');if(n)n.onclick=()=>{i++;ph=0;rp=mp=null;draw();odShow(L.$('#dsc'));};};
  draw();}}
  ]
});
</script>
