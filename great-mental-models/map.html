<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your decision map</title>
<meta name="description" content="A quick daily reference: which mental model to reach for, how to run it in about a minute, and what to do when you are stuck.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
<style>
/* Page-only styles. Colours come only from course.css variables, so light and dark mode follow it. */
body{padding-bottom:56px}
.mp{max-width:680px;margin:0 auto;padding:20px 16px 0}
.mp a{color:var(--pri)}
.back{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;text-decoration:none;min-height:40px}
.back svg.i{width:18px;height:18px}
.mp h1{font-size:30px;line-height:1.15;letter-spacing:-.02em;margin:6px 0 6px}
.lead{font-size:15px;line-height:1.5;color:var(--muted);margin:0 0 14px}
.applied{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--h3);background:var(--h3-bg);border-radius:99px;padding:4px 10px;margin:0 0 10px}
.applied svg.i{width:14px;height:14px}
.frombook{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--h2);background:var(--h2-bg);border-radius:99px;padding:3px 9px}
.frombook svg.i{width:13px;height:13px}

/* model colours: one per model, built from the course palette */
.m-map{--mc:var(--h2)}
.m-circle{--mc:var(--ok-strong)}
.m-first{--mc:var(--h3)}
.m-thought{--mc:color-mix(in srgb,var(--h1) 50%,var(--h4))}
.m-second{--mc:var(--h1)}
.m-prob{--mc:color-mix(in srgb,var(--h2) 45%,var(--h1))}
.m-inv{--mc:var(--no-strong)}
.m-occam{--mc:color-mix(in srgb,var(--ok) 45%,var(--h3))}
.m-hanlon{--mc:var(--h4)}
[class*="m-"]{--mb:color-mix(in srgb,var(--mc) 15%,var(--card))}

/* the one-minute routine strip */
.routine{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:14px 14px 12px;margin:0 0 18px}
.routine h2{font-size:15px;margin:0 0 10px}
.fuse{display:grid;grid-template-columns:1.3fr 2.6fr 1.3fr;gap:4px}
.fuse div{border-radius:10px;padding:8px 6px;text-align:center;font-size:12.5px;line-height:1.25;font-weight:600}
.fuse div span{display:block;font-weight:500;font-size:11.5px;opacity:.85}
.fuse .f1{background:var(--h1-bg);color:var(--h1)}
.fuse .f2{background:var(--h2-bg);color:var(--h2)}
.fuse .f3{background:var(--h4-bg);color:var(--h4)}
.sizes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.size{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.4;color:var(--muted);background:var(--soft);border-radius:12px;padding:8px 10px}
.size b{color:var(--ink)}
.size svg{flex:none;margin-top:1px}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--soft2);border-radius:16px;padding:5px;margin:0 0 16px;position:sticky;top:8px;z-index:5;box-shadow:0 0 0 6px var(--bg)}
.tab{border:0;background:transparent;border-radius:12px;padding:8px 4px;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12.5px;font-weight:600;color:var(--muted);line-height:1.2}
.tab[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.tab[aria-selected="true"] svg.i{color:var(--pri)}
.panel h2{font-size:21px;margin:0 0 4px;letter-spacing:-.01em}
.panel .sub2{font-size:14px;color:var(--muted);margin:0 0 12px;line-height:1.45}

/* option grids */
.opts2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 16px}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;background:var(--card);border:2px solid var(--line);border-bottom-width:3px;border-radius:14px;padding:10px 10px 9px;min-height:84px;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--line2)}
.opt b{font-size:14px;line-height:1.25}
.opt small{font-size:12px;color:var(--muted);line-height:1.3}
.opt .oi{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--soft2);color:var(--muted)}
.opt .oi svg.i{width:18px;height:18px}
.opt[aria-pressed="true"]{border-color:var(--pri);background:var(--pri-bg)}
.opt[aria-pressed="true"] .oi{background:var(--pri);color:var(--pri-ink)}
.stuckopts .opt[aria-pressed="true"]{border-color:var(--no-strong);background:var(--no-bg)}
.stuckopts .opt[aria-pressed="true"] .oi{background:var(--no-strong);color:var(--card)}

/* result card */
.result{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:16px 14px;margin:0 0 18px;scroll-margin-top:84px}
.result:empty{display:none}
.result h3{font-size:18px;line-height:1.3;margin:4px 0 4px}
.result .signs{font-size:13.5px;color:var(--muted);margin:0 0 14px;line-height:1.4}
.hint[hidden]{display:none}
.hint{font-size:14px;color:var(--muted);background:var(--soft);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;margin:0 0 18px}

/* the path */
.path{list-style:none;margin:0;padding:0}
.node{display:grid;grid-template-columns:44px 1fr;gap:0 12px;position:relative}
.node .rail{display:flex;flex-direction:column;align-items:center}
.node .dot{width:44px;height:44px;border-radius:14px;background:var(--mc);color:var(--card);display:grid;place-items:center;flex:none}
.node .dot svg.i{width:22px;height:22px;stroke-width:2}
.node .line{flex:1;width:4px;border-radius:4px;background:color-mix(in srgb,var(--mc) 45%,var(--line));margin:4px 0;min-height:14px}
.node .body{padding:0 0 14px;min-width:0}
.node .tag{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mc)}
.node .name{font-size:16px;font-weight:700;margin:1px 0 2px}
.node .focus{font-size:13.5px;color:var(--muted);line-height:1.4;margin:0 0 6px}
.node.first .body{background:var(--mb);border-radius:16px;padding:10px 12px 12px;margin-bottom:14px}
.divider{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--muted);margin:0 0 12px}
.divider::before,.divider::after{content:"";flex:1;height:0;border-top:2px dashed var(--line2)}
.end .dot{background:var(--soft2);color:var(--muted)}
.steps{list-style:none;margin:6px 0 4px;padding:0;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:24px 1fr;gap:8px;font-size:14px;line-height:1.4;margin:0 0 6px}
.steps li::before{content:counter(s);width:24px;height:24px;border-radius:8px;background:var(--mc);color:var(--card);font-size:12.5px;font-weight:700;display:grid;place-items:center}
.more{border:0;background:transparent;color:var(--pri);font-weight:600;font-size:13.5px;padding:6px 0;min-height:36px;display:inline-flex;align-items:center;gap:4px}
.more svg.i{width:16px;height:16px;transition:transform .2s}
.more[aria-expanded="true"] svg.i{transform:rotate(90deg)}
.lk{display:inline-block;font-size:13.5px;font-weight:600;text-decoration:none;padding:6px 0;line-height:1.4}
.lk svg.i{width:16px;height:16px;vertical-align:-3px;margin-left:4px}
.pic{display:block;width:100%;max-width:240px;height:auto;margin:6px 0 8px}
.cap{font-size:12px;color:var(--muted);margin:-4px 0 6px;line-height:1.35}
.tip{display:flex;gap:8px;font-size:13px;color:var(--muted);line-height:1.4;background:var(--soft);border-radius:12px;padding:8px 10px;margin:4px 0 0}
.tip svg.i{width:16px;height:16px;margin-top:1px}

/* stuck flow */
.unblock{display:flex;flex-direction:column;align-items:stretch;gap:0}
.box{border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center}
.box .bi{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none}
.box b{font-size:15px;line-height:1.3}
.box small{display:block;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.box.stuck{background:var(--no-bg)}
.box.stuck .bi{background:var(--no-strong);color:var(--card)}
.down{display:flex;justify-content:center;color:var(--faint);padding:3px 0}
.down svg.i{width:22px;height:22px}
.chain{display:flex;flex-direction:column;gap:6px}
.mchip{display:flex;align-items:center;gap:10px;border:0;background:var(--mb);border-radius:14px;padding:8px 10px;text-align:left;width:100%;min-height:52px}
.mchip .bi{width:36px;height:36px;border-radius:11px;background:var(--mc);color:var(--card);display:grid;place-items:center;flex:none}
.mchip b{font-size:15px;display:block}
.mchip span{font-size:12.5px;color:var(--muted);display:block;line-height:1.3}
.mchip .gx{margin-left:auto;color:var(--muted);flex:none}
.mtile .pic text{display:none}
.or{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;text-align:center}
.box.next{background:var(--ok-bg);flex-direction:column;align-items:stretch}
.box.next .hd{display:flex;gap:10px;align-items:center}
.box.next .bi{background:var(--ok-strong);color:var(--card)}
.box.next .steps li::before{background:var(--ok-strong)}
.basis{font-size:12.5px;color:var(--muted);line-height:1.45;margin:10px 0 0}
.basis b{color:var(--ink);font-weight:600}

/* act check */
.act{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:16px 14px;margin:0 0 18px;border:2px solid transparent}
.act.hl{border-color:var(--ok-line)}
.act h3{font-size:17px;margin:4px 0 10px}
.gates{display:grid;grid-template-columns:1fr;gap:8px}
.gate{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;background:var(--soft);border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.4}
.gate .gi{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--card);color:var(--muted);border:2px solid var(--line2)}
.gate .gi svg.i{width:18px;height:18px}
.gate b{display:block;font-size:14.5px}
.gate span{color:var(--muted);font-size:13px}
.verdict{display:flex;gap:10px;align-items:center;margin-top:10px;background:var(--ok-bg);color:var(--ok);border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.4}
.verdict .bi{width:34px;height:34px;border-radius:50%;background:var(--ok-strong);color:var(--card);display:grid;place-items:center;flex:none}
.verdict b{color:var(--ink)}
.warnrow{display:flex;gap:10px;align-items:center;margin-top:8px;background:var(--no-bg);border-radius:14px;padding:10px 12px;font-size:13.5px;line-height:1.4}
.warnrow svg.i{color:var(--no-strong)}

/* model grid */
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 16px}
.mtile{display:flex;flex-direction:column;align-items:stretch;gap:4px;background:var(--card);border:2px solid var(--line);border-bottom-width:3px;border-radius:14px;padding:6px 6px 8px;text-align:center;min-height:104px}
.mtile:hover{border-color:var(--line2)}
.mtile .pic{margin:0 auto;max-width:100%}
.mtile b{font-size:12.5px;line-height:1.2;display:flex;align-items:center;justify-content:center;gap:5px;flex:1}
.mtile .sw{width:8px;height:8px;border-radius:50%;background:var(--mc);flex:none}
.mtile[aria-pressed="true"]{border-color:var(--mc);background:var(--mb)}
.sec{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:16px 0 8px;flex-wrap:wrap}
.sec .applied,.sec .frombook{text-transform:none;letter-spacing:0;margin:0}
.trig{display:flex;flex-direction:column;gap:6px}
.trig div{display:flex;gap:8px;align-items:flex-start;font-size:14px;line-height:1.4}
.trig svg.i{width:16px;height:16px;color:var(--mc);margin-top:2px}
.lims{display:flex;flex-direction:column;gap:6px}
.lims div{display:flex;gap:8px;align-items:flex-start;font-size:14px;line-height:1.4;background:var(--soft);border-radius:12px;padding:8px 10px}
.lims svg.i{width:16px;height:16px;color:var(--no-strong);margin-top:2px}
.uses{display:flex;flex-wrap:wrap;gap:6px}
.uses button{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:500;min-height:36px}
.detail-head{display:flex;gap:12px;align-items:center}
.detail-head .dot{width:44px;height:44px;border-radius:14px;background:var(--mc);color:var(--card);display:grid;place-items:center;flex:none}
.detail-head .dot svg.i{width:22px;height:22px}
.detail .pic{max-width:300px;margin:12px auto 4px}
.foot{font-size:12.5px;color:var(--muted);line-height:1.5;border-top:1px solid var(--line);padding-top:14px;margin-top:8px}
@media (min-width:560px){
  .opts2{grid-template-columns:repeat(3,1fr)}
  .stuckopts{grid-template-columns:repeat(4,1fr)}
  .gates{grid-template-columns:1fr 1fr}
  .tab{flex-direction:row;font-size:14px;gap:6px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="mp" id="app"></main>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
(function(){
'use strict';
const ic=Course.icon;
const C=Course.all[Course.all.length-1];
const lessonOf=id=>{const j=C.lessons.findIndex(l=>l.id===id);return {n:j+1,file:C.lessons[j].file,title:C.lessons[j].title};};
const APPLIED='<span class="applied">'+ic('compass')+'How this course applies the book</span>';
const BOOK='<span class="frombook">'+ic('book')+'From the book</span>';

/* ---------- the nine models (names, triggers, moves and limits from CANON.md) ---------- */
const M={
 map:{n:'The map is not the territory',ic:'map',l:'0002',short:'Map ≠ territory',
  alt:'A folded map over the real landscape; the map misses a tree that is really there.',
  trig:['A number, report, review or listing is driving the decision','The data and what people tell you disagree','The map is old, or someone else made it'],
  move:['Name the map.','Ask who made it, when, and why.','Ask what it leaves out.','Touch the territory: one quick real check (call, visit, try it), then update the map.'],
  lim:['Every map leaves things out, and a perfect one would be useless: don’t demand one.','You still need maps: use one inside the range where it’s known to work.','Can’t check it yourself? Choose a careful mapmaker who is open to changing it.']},
 circle:{n:'Circle of competence',ic:'target',l:'0003',short:'Circle of competence',
  alt:'A solid circle where the Lifer knows the ground, a fading edge, and a Stranger standing outside.',
  trig:['You’re deciding in an unfamiliar field: car repair, legal, medical, a new industry','You feel oddly sure after a little reading','An expert or salesperson is advising you'],
  move:['Ask: am I a Lifer or a Stranger here? Do I know what I don’t know?','If a Stranger: learn the basics, then ask a Lifer which things matter most, and why.','Ask what the adviser gains from your choice.','Hold off on big spending until you’ve checked.'],
  lim:['You can’t always stay inside your circle: some decisions outside it still have to be made.','A little learning breeds false confidence.','A circle shrinks unless you keep learning, check yourself honestly and get outside feedback.','Supporting idea: if nothing could prove a claim wrong, you can’t test it. A trend is not a law.']},
 first:{n:'First principles thinking',ic:'layers',l:'0004',short:'First principles',
  alt:'A brick house taken apart into separate bricks, then rebuilt as something new.',
  trig:['You hear “that’s just how it’s done”','Every option on the table is expensive, or the same','You’re copying a tactic without knowing why it works'],
  move:['Write the claim or the usual solution.','Ask “why?” up to five times, until you reach a checkable fact or “because it just is”.','Keep the facts; drop the assumptions.','Rebuild from the facts: the principle first, then the tactic.']
  ,lim:['It’s slow at first, and you’ll often hit “I don’t know” fast: don’t give up or get defensive.','First principles aren’t eternal truths: they depend on the situation and change as you learn.','Stopping at “because I said so” means you found an assumption, not a principle.']},
 thought:{n:'Thought experiment',ic:'flask',l:'0005',short:'Thought experiment',
  alt:'The same scene replayed three times, with one thing changed each time.',
  trig:['You can’t, or shouldn’t, test it for real','You’re choosing between possible futures','A good result might have been luck','You want to know what you really value, or what’s fair'],
  move:['Ask one clear question and picture it playing out in detail.','Change one thing at a time (“if money were no object”).','Run it 100 times in your head: how often does it go badly?','Easy bet or hard one? Adjust your plan.'],
  lim:['It needs rigor, not daydreaming.','Replaying the past is the riskiest use: history is chaotic, so explore what could have happened; don’t declare a cause.','It gives a rough sense, not a final answer.','Supporting idea: having what’s necessary isn’t enough to succeed; luck often fills the gap.']},
 second:{n:'Second-order thinking',ic:'arrow',l:'0006',short:'Second-order',
  alt:'Ripples spreading from a stone dropped in water: each ring asks “and then what?”',
  trig:['A quick fix, treat, shortcut or reward looks great right now','It affects other people, or a relationship you’ll have again','You need to persuade someone'],
  move:['Write the immediate result.','Ask “And then what?” twice: for you, for others, for trust.','Keep only the most likely effects.','Ask: does this move me toward my goal, or away?'],
  lim:['It can’t predict the future: you only see likely effects from what you know.','Avoid the slippery slope: worry about every possible effect and you’ll never act.','Weigh the typical, most likely effects, case by case.']},
 prob:{n:'Probabilistic thinking',ic:'trend',l:'0007',short:'Probabilistic',
  alt:'A bell curve beside a fat-tailed curve, with an out-of-the-game zone at the far end.',
  trig:['The outcome is uncertain','One headline or story is scaring or exciting you','You’re estimating time, money or odds','A bad outcome could be ruinous'],
  move:['Ask: what usually happens in cases like this? (the base rate)','Are the extremes capped (bell curve) or not (fat tail)?','Expect your estimate to be too rosy, and pad it.','Could any outcome take you out of the game? Then don’t take that risk, or prepare.'],
  lim:['It only gets you in the ballpark, never certainty.','Rare, extreme events can’t be predicted: prepare rather than predict.','Update your estimate as new information arrives.','Supporting idea: things moving together don’t prove a cause, and extremes drift back toward average on their own.']},
 inv:{n:'Inversion',ic:'down',l:'0008',short:'Inversion',
  alt:'Start at the goal and work backward, or start at failure and steer away from it.',
  trig:['You have a goal but no clear path','You want to prevent a problem, not fix it later','You’re stuck thinking only forward'],
  move:['Flip the question: “What would guarantee this fails?”','List three answers.','Avoid or remove them.','Then add the forces that help.'],
  lim:['Pair it with forward thinking: work on the forces that help and the ones that hold you back.','Avoiding the standard ways of failing raises your odds; it doesn’t guarantee success.']},
 occam:{n:'Occam’s razor',ic:'leaf',l:'0009',short:'Occam’s razor',
  alt:'A razor trimming a tangle of routes down to the shortest one.',
  trig:['You’re building a dramatic or complicated explanation: a symptom, a glitch, a drop in numbers','You’re chasing many theories at once'],
  move:['List the explanations.','Count each one’s moving parts: things that must all be true.','Start with the simplest that still explains all the facts (horses, not zebras).','Check it first; move on only if the facts rule it out.'],
  lim:['Not an iron law: it only applies when explanations fit the facts equally well.','Some things really are complex: don’t force a false simplicity.','Simplify only as far as the explanation stays accurate.']},
 hanlon:{n:'Hanlon’s razor',ic:'people',l:'0010',short:'Hanlon’s razor',
  alt:'Two thought bubbles over the same event: a scheming face, crossed out, and a face that simply didn’t notice.',
  trig:['Someone’s action annoyed, hurt or worried you','You feel targeted','You’re about to reply in anger or defend yourself'],
  move:['Pause before reacting.','List explanations with no ill intent: didn’t see, didn’t know, forgot, was rushed.','Ask how much effort deliberate harm would have taken.','Respond as if it was a mistake: ask, don’t accuse.'],
  lim:['Real malice exists.','Don’t overthink it.','Assume good faith unless the evidence is overwhelming; when it piles up, update.']}
};
const ORDER=['map','circle','first','thought','second','prob','inv','occam','hanlon'];

/* ---------- small pictures, one per model (stroke = model colour) ---------- */
const S='stroke="var(--mc)" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"';
const G='stroke="var(--faint)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
const T='fill="var(--muted)" font-family="Inter,sans-serif" font-size="8" font-weight="600"';

/* ---------- renderers ---------- */
function nodeHtml(k,focus,i,isLast){
 const m=M[k],first=i===0,id='mv-'+i+'-'+k;
 return '<li class="node m-'+k+(first?' first':'')+'"><div class="rail"><span class="dot">'+ic(m.ic)+'</span>'+(isLast?'':'<span class="line"></span>')+'</div><div class="body">'+
  '<div class="tag">'+(first?'Start here · about a minute':'Then')+'</div><div class="name">'+m.n+'</div>'+
  (first?pic(k):'')+
  (focus?'<p class="focus">'+focus+'</p>':'')+
  (first?stepsHtml(m.move):'<button type="button" class="more" aria-expanded="false" aria-controls="'+id+'">'+ic('arrow')+'Show the one-minute move</button><div id="'+id+'" hidden>'+stepsHtml(m.move)+'</div>')+
  lessonLink(k)+'</div></li>';
}
function renderFace(k){
 const d=DEC.find(x=>x.k===k),res=document.getElementById('face-res');
 let h='<span class="applied">'+ic('compass')+'How this course applies the book</span><h3>'+d.t+'</h3><p class="signs">'+d.s+'</p><ol class="path">';
 d.path.forEach((p,i)=>{
  if(i===1)h+='<li class="divider" role="presentation">Big or hard to undo? Keep going</li>';
  h+=nodeHtml(p[0],p[1],i,false);
 });
 h+='<li class="node end"><div class="rail"><span class="dot">'+ic('pencil')+'</span></div><div class="body"><div class="tag" style="color:var(--muted)">Then</div><div class="name">Write it down</div><p class="focus">Note which models you used and why. Look back once you see the result: the book’s journal advice.</p></div></li></ol>';
 if(d.tip)h+='<div class="tip">'+ic('info')+'<span>'+d.tip+'</span></div>';
 res.innerHTML=h;
 document.getElementById('face-hint').hidden=true;
 bindMore(res);
}
function renderStuck(k){
 const d=STUCK.find(x=>x.k===k),res=document.getElementById('stuck-res');
 let chain='';
 if(d.models.length){
  chain='<div class="chain">'+d.models.map((mk,i)=>(i?'<div class="or">'+d.join+'</div>':'')+
   '<button type="button" class="mchip m-'+mk+'" data-open="'+mk+'"><span class="bi">'+ic(M[mk].ic)+'</span><span><b>'+M[mk].n+'</b><span>'+M[mk].move[0]+'</span></span><span class="gx">'+ic('arrow')+'</span></button>').join('')+'</div>';
 }else{
  chain='<button type="button" class="mchip m-second" data-tab="face"><span class="bi">'+ic('compass')+'</span><span><b>Back to “What are you facing?”</b><span>Name the decision again; pick another lens.</span></span><span class="gx">'+ic('arrow')+'</span></button>';
 }
 res.innerHTML='<span class="applied">'+ic('compass')+'How this course applies the book</span>'+
  '<div class="unblock">'+
   '<div class="box stuck"><span class="bi">'+ic(d.ic)+'</span><span><small>You’re stuck</small><b>'+d.t+'</b></span></div>'+
   '<div class="down" aria-hidden="true">'+ic('down')+'</div>'+
   '<div class="sec" style="margin:0 0 6px">'+(d.models.length?'What unblocks it':'The model may be the wrong tool')+'</div>'+chain+
   '<div class="down" aria-hidden="true">'+ic('down')+'</div>'+
   '<div class="box next"><div class="hd"><span class="bi">'+ic('check')+'</span><b>Your next step</b></div>'+stepsHtml(d.next)+'</div>'+
  '</div>'+
  '<p class="basis"><b>Book basis:</b> '+d.basis+'</p>';
 document.getElementById('act').classList.toggle('hl',!!d.act);
}
function renderModel(k){
 const m=M[k],res=document.getElementById('model-res');
 const uses=DEC.filter(d=>d.path.some(p=>p[0]===k));
 res.className='result detail m-'+k;
 res.innerHTML='<div class="detail-head"><span class="dot">'+ic(m.ic)+'</span><h3>'+m.n+'</h3></div>'+pic(k)+'<div class="cap" style="text-align:center">'+m.alt+'</div>'+
  '<div class="sec">'+ic('eye')+'Reach for it when '+APPLIED+'</div><div class="trig">'+m.trig.map(t=>'<div>'+ic('check')+'<span>'+t+'</span></div>').join('')+'</div>'+
  '<div class="sec">'+ic('clock')+'One-minute move '+APPLIED+'</div>'+stepsHtml(m.move)+
  '<div class="sec">'+ic('alert')+'Where it stops working '+BOOK+'</div><div class="lims">'+m.lim.map(t=>'<div>'+ic('x')+'<span>'+t+'</span></div>').join('')+'</div>'+
  (uses.length?'<div class="sec">'+ic('map')+'On your decision map</div><div class="uses">'+uses.map(d=>'<button type="button" data-goface="'+d.k+'">'+d.lab+'</button>').join('')+'</div>':'')+
  '<div style="margin-top:12px">'+lessonLink(k)+'</div>';
}
function bindMore(root){
 root.querySelectorAll('.more').forEach(b=>b.addEventListener('click',()=>{
  const open=b.getAttribute('aria-expanded')!=='true';b.setAttribute('aria-expanded',String(open));
  document.getElementById(b.getAttribute('aria-controls')).hidden=!open;
  b.lastChild.textContent=open?'Hide the one-minute move':'Show the one-minute move';
 }));
}
function reveal(el){const r=el.getBoundingClientRect();if(r.top>innerHeight*0.55||r.top<60)el.scrollIntoView({behavior:'smooth',block:'start'});}
function press(sel,el){document.querySelectorAll(sel).forEach(b=>b.setAttribute('aria-pressed',String(b===el)));}

/* ---------- tabs ---------- */
const TABS=['face','stuck','models'];
function showTab(t,focus){
 TABS.forEach(x=>{const b=document.getElementById('t-'+x),on=x===t;b.setAttribute('aria-selected',String(on));b.tabIndex=on?0:-1;document.getElementById('p-'+x).hidden=!on;});
 if(focus)document.getElementById('t-'+t).focus();
 try{history.replaceState(null,'','#'+t);}catch(e){}
}
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(b)showTab(b.id.slice(2));});
document.querySelector('.tabs').addEventListener('keydown',e=>{
 const i=TABS.indexOf(document.activeElement.id.slice(2));if(i<0)return;
 let j=null;if(e.key==='ArrowRight')j=(i+1)%3;else if(e.key==='ArrowLeft')j=(i+2)%3;else if(e.key==='Home')j=0;else if(e.key==='End')j=2;
 if(j!==null){e.preventDefault();showTab(TABS[j],true);}
});

/* ---------- clicks ---------- */
function openFace(k){showTab('face');const b=document.querySelector('[data-face="'+k+'"]');press('[data-face]',b);renderFace(k);reveal(document.getElementById('face-res'));}
function openModel(k){showTab('models');const b=document.querySelector('[data-model="'+k+'"]');press('[data-model]',b);renderModel(k);try{history.replaceState(null,'','#model-'+k);}catch(e){}reveal(document.getElementById('model-res'));}
app.addEventListener('click',e=>{
 const f=e.target.closest('[data-face]');if(f){openFace(f.dataset.face);return;}
 const s=e.target.closest('[data-stuck]');if(s){press('[data-stuck]',s);renderStuck(s.dataset.stuck);reveal(document.getElementById('stuck-res'));return;}
 const m=e.target.closest('[data-model]');if(m){openModel(m.dataset.model);return;}
 const o=e.target.closest('[data-open]');if(o){openModel(o.dataset.open);return;}
 const g=e.target.closest('[data-goface]');if(g){openFace(g.dataset.goface);return;}
 const t=e.target.closest('[data-tab]');if(t){showTab(t.dataset.tab);window.scrollTo({top:document.querySelector('.tabs').offsetTop-8,behavior:'smooth'});}
});

/* deep links: #stuck, #models, #model-occam, #face-bet */
const h=location.hash.slice(1);
if(h.startsWith('model-')&&M[h.slice(6)])openModel(h.slice(6));
else if(h.startsWith('face-')&&DEC.some(d=>d.k===h.slice(5)))openFace(h.slice(5));
else if(TABS.includes(h))showTab(h);
})();
</script>
</body>
</html>
