<head>
<meta charset="utf-8">

<script>
/* ===== This lesson's own visuals: the blind-spot decoder (stackable colour-filter sheets over a hidden picture),

(function(){const st=document.createElement('style');st.textContent=`

.mm-app{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--h2);background:var(--h2-bg);border-radius:99px;padding:4px 11px;margin:0 0 10px}
.mm-app svg.i{width:15px;height:15px}

/* decoder */
.dz-tray{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0 0}
.dz-sh{display:flex;align-items:center;gap:8px;text-align:left;border:2px solid var(--line);border-radius:12px;padding:6px 8px;background:var(--card);min-height:46px;font:inherit;color:var(--ink);cursor:pointer;transition:border-color .15s,background .15s}

.dz-sh[disabled]{cursor:default}
.dz-read{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;font-size:13.5px;color:var(--muted);margin:10px 0 6px}
.dz-read b{color:var(--ink);font-size:15px}
.dz-read span{display:inline-flex;align-items:center;gap:5px}

.dz-pic{position:relative;border-radius:16px;padding:7px;background:var(--soft2)}

.dz-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.dz-t{background:var(--card);border-radius:12px;padding:8px 8px;font-size:12.5px;line-height:1.35;border:1.5px solid var(--line)}

.dz-s svg.i{width:15px;height:15px;color:var(--muted);margin-top:1px}
.dz-h{margin-top:6px;padding:5px 7px;border-radius:8px;font-size:12px;border-left:3px solid var(--c,var(--line2));background:color-mix(in srgb,var(--c,var(--line2)) 11%,var(--card))}

.dz-h.hid{filter:blur(3.6px);opacity:.6;border-left-color:var(--line2);background:radial-gradient(var(--line2) 1px,transparent 1.6px) 0 0/6px 6px,var(--soft);user-select:none}

.dz-by i svg.i{width:12px;height:12px}
.dz-badge{display:inline-block;font-size:10.5px;font-weight:700;border-radius:99px;padding:1px 7px;margin-top:5px;background:var(--h3-bg);color:var(--h3)}

.ele-svg{background:var(--soft);border-radius:16px}
.ele-g{font:700 12.5px var(--sans)}

.dz-tray.six{grid-template-columns:1fr 1fr 1fr}
.dz-tray.six .dz-sh{min-height:42px;padding:5px 6px;gap:6px}
.dz-tray.six .sw{width:24px;height:24px}
/* feedback line */
.fbk-read{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;justify-content:center;font-size:13.5px;color:var(--muted);margin:6px 0 0}

.fbk-dots{display:inline-flex;gap:4px}
.fbk-dots i{width:11px;height:11px;border-radius:50%;background:var(--soft2);border:1.5px solid var(--line2)}
.fbk-dots i.on{background:var(--h2);border-color:var(--h2)}
.fbk-n{font:700 11px var(--sans);fill:var(--pri-deep)}
.fbk-ctl{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.fbk-tg{display:flex;align-items:center;gap:8px;text-align:left;border:2px solid var(--line);border-radius:12px;padding:7px 9px;background:var(--card);font:inherit;color:var(--ink);min-height:48px}

.fbk-pk.ok{border-color:var(--ok-line);background:var(--ok-bg);color:var(--ok)}
.fbk-pk.no{border-color:var(--no-line);background:var(--no-bg);color:var(--no)}
.fbk-pk[aria-disabled=true]{cursor:default}
/* routine + map */
.rt{margin:6px 0 0}
.rt-bar{display:flex;height:34px;border-radius:10px;overflow:hidden;font:700 12px var(--sans)}

.rt-sb b{display:block;font-size:13.5px;margin-bottom:4px}
.rt-dots{display:flex;align-items:center;gap:4px;margin:4px 0 6px}

.rt-dots i.g{background:var(--line2)}

.dm{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.dm-row{display:grid;grid-template-columns:1fr 118px;gap:8px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:7px 8px;background:var(--card);text-align:left;width:100%;font:inherit;color:var(--ink)}
button.dm-row{cursor:pointer;border-bottom-width:3px}
.dm-row.sel{border-color:var(--pri);background:var(--pri-bg)}
.dm-k b{display:block;font-size:13px;line-height:1.3}
.dm-k small{display:block;font-size:11.5px;color:var(--muted);line-height:1.3;margin-top:1px}
.dm-row.ok{border-color:var(--ok-line);background:var(--ok-bg)}
.dm-row.no{border-color:var(--no-line);background:var(--no-bg)}
button.dm-row[aria-disabled=true]{cursor:default}
.yt-try{border:2px solid var(--h2);border-radius:14px;padding:10px 12px;margin-top:12px;font-size:14px;line-height:1.45;background:var(--h2-bg)}
.yt-try b.t{display:flex;align-items:center;gap:6px;font-size:12px;letter-spacing:.03em;text-transform:uppercase;color:var(--h2);margin-bottom:3px}
.yt-try b.t svg.i{width:15px;height:15px}
.dm-ex{grid-column:1/-1;font-size:12.5px;color:var(--h2);background:var(--h2-bg);border-radius:8px;padding:5px 8px;line-height:1.35}
.dm-slot{display:flex;align-items:center;gap:6px;border:1.5px dashed var(--line2);border-radius:10px;padding:5px 6px;font-size:11.5px;line-height:1.25;color:var(--muted);background:var(--soft)}
.dm-slot svg.i{width:16px;height:16px;color:var(--faint)}
.dm-slot small{display:block;font-size:10.5px;color:var(--faint)}
.yt-in{width:100%;min-height:64px;border:2px solid var(--line);border-radius:12px;padding:9px 11px;font:inherit;font-size:15px;color:var(--ink);background:var(--card);resize:vertical}
.yt-in:focus{outline:2px solid var(--pri);outline-offset:1px}
.yt-lab{display:block;font-size:13.5px;font-weight:600;margin:12px 0 6px}
.jr{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px 8px 30px;position:relative;background-image:repeating-linear-gradient(var(--card) 0 25px,var(--line) 25px 26px);font-size:13.5px;line-height:26px}
.jr:before{content:"";position:absolute;left:18px;top:0;bottom:0;border-left:2px solid var(--no-line)}
.jr b{color:var(--muted);font-weight:600}
.jr .h{color:var(--h2);font-weight:700}
`;document.head.appendChild(st);})();

const ic=n=>Course.icon(n);
/* tiny seeded random, so the noise looks the same on every visit */
function mmRng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const mmFmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');

/* ---------- the nine models (names exactly as the course uses them) ---------- */
const MOD={map:['The map is not the territory','map',2],circle:['Circle of competence','target',3],first:['First principles thinking','layers',4],
  thought:['Thought experiment','flask',5],second:['Second-order thinking','arrow',6],prob:['Probabilistic thinking','trend',7],
  inv:['Inversion','down',8],occam:['Occam’s razor','leaf',9],hanlon:['Hanlon’s razor','people',10]};

/* ---------- decoder sheets: one transparent colour filter per model (preview) ---------- */
/* [model key, colour, the question the sheet asks] */
const SH={map:['map','var(--h2)','Is this number the real thing?'],circle:['circle','var(--h1)','Do I really know this field?'],
  second:['second','var(--h3)','And then what?'],inv:['inv','var(--h4)','What would make this fail?'],
  occam:['occam','var(--ok-strong)','What’s the simplest explanation?'],hanlon:['hanlon','var(--no-strong)','A mistake, or meant?'],
  prob:['prob','var(--pri-deep)','What usually happens?']};
const SHK=['map','circle','second','inv','occam','hanlon','prob'];
/* Ira's Monday: [key, icon, what Ira sees, what's hidden, sheets that reveal it] */
const MON=[
 ['D','box','Dashboard: 95% shipped on time.','“Shipped” counts packed orders still sitting on the dock.',['map']],
 ['B','people','Bram promised another rush job.','Ira sees Bram only from production’s side. Bram may not see the queue.',['map','hanlon']],
 ['W','person','Wynn hasn’t called back.','Wynn often leaves the phone on silent.',['occam','prob']],
 ['C','alert','Dealer: new car, plus a warranty.','The dealer earns from the sale, and Ira knows little about cars.',['circle']],
 ['T','clock','Pella: skip training to hit the date.','Untrained staff make errors after go-live; the date slips anyway.',['second','inv']],
 ['F','star','Fieldnote: a job with 20% more pay.','It’s in software, outside what Ira knows well.',['circle']]];
const LUNCH=[['L1','bowl','Lunch: soup or a sandwich from the canteen?',null,[]],['L2','clock','Back at the desk by one o’clock.',null,[]]];

/* dzBoard(host,{parts,on,locked,onChange}) : tray of sheets + readout + picture of tiles */
function dzBoard(host,o){
  const st={parts:o.parts,on:new Set(o.on||[]),ov:{},badge:null,locked:!!o.locked},mini=!!o.locked;
  const el=document.createElement('div');el.className='dz';
  el.innerHTML='<div class="dz-tray"></div><div class="dz-read" aria-live="polite"></div><div class="dz-pic"><div class="dz-grid"></div></div>';
  host.appendChild(el);
  const tray=el.querySelector('.dz-tray'),read=el.querySelector('.dz-read'),pic=el.querySelector('.dz-pic'),grid=el.querySelector('.dz-grid');
  if(mini)tray.classList.add('mini');
  tray.innerHTML=(mini?'<span class="ml">Sheets laid down:</span>':'')+SHK.map(k=>{const m=MOD[SH[k][0]];return '<button class="dz-sh" data-k="'+k+'" style="--c:'+SH[k][1]+'" aria-pressed="false"'+(mini?' title="'+m[0]+'" aria-label="'+m[0]+'"':'')+'><span class="sw">'+ic(m[1])+'</span>'+(mini?'':'<span><b>'+m[0]+'</b><small>'+SH[k][2]+'</small></span>')+'</button>';}).join('');
  tray.querySelectorAll('.dz-sh').forEach(b=>b.onclick=()=>{if(st.locked)return;const k=b.dataset.k;if(st.on.has(k))st.on.delete(k);else st.on.add(k);render();if(o.onChange)o.onChange(k,st.on.has(k));});
  const isSeen=p=>p[3]===null||p[4].some(k=>st.on.has(k));let prev=new Set();
  function render(){const now=new Set(st.parts.filter(isSeen).map(p=>p[0]));
    tray.querySelectorAll('.dz-sh').forEach(b=>{const on=st.on.has(b.dataset.k);b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);b.disabled=st.locked;});
    grid.innerHTML=st.parts.map(p=>{const ov=st.ov[p[0]],by=p[4].filter(k=>st.on.has(k)),seen=isSeen(p);let h;
      if(ov)h='<div class="dz-h '+(ov.cls||'')+'" style="--c:'+(ov.c||'var(--line2)')+'">'+ov.html+'</div>';
      else if(p[3]===null)h='<div class="dz-h in">'+ic('check')+'Already in view</div>';
      else if(seen)h='<div class="dz-h'+(prev.has(p[0])?'':' fresh')+'" style="--c:'+SH[by[0]][1]+'">'+p[3]+'</div><div class="dz-by">'+by.map(k=>'<i style="--c:'+SH[k][1]+'" title="'+MOD[SH[k][0]][0]+'">'+ic(MOD[SH[k][0]][1])+MOD[SH[k][0]][0].replace('The map is not the territory','Map').replace(' thinking','').replace('Circle of competence','Circle')+'</i>').join('')+'</div>';
      else h='<div class="dz-h hid" aria-hidden="true">'+p[3]+'</div><span class="dz-badge" style="background:var(--soft);color:var(--muted)">hidden</span>';
      const bd=ov&&ov.badge?'<span class="dz-badge '+(ov.bcls||'')+'">'+ov.badge+'</span>':(st.badge&&seen&&p[3]!==null&&!ov?'<span class="dz-badge">'+st.badge+'</span>':'');
      return '<div class="dz-t" data-p="'+p[0]+'"><div class="dz-s">'+ic(p[1])+'<span>'+p[2]+'</span></div>'+h+bd+'</div>';}).join('');
    pic.querySelectorAll('.dz-lay').forEach(x=>x.remove());
    [...st.on].forEach((k,i)=>{const d=document.createElement('i');d.className='dz-lay';const c=SH[k][1];
      d.style.cssText='top:'+(i*3)+'px;left:'+(i*3)+'px;right:0;bottom:0;background:color-mix(in srgb,'+c+' 3%,transparent);border-color:color-mix(in srgb,'+c+' 60%,transparent)';pic.appendChild(d);});
    const n=now.size;prev=now;
    read.innerHTML='<span>'+ic('eye')+'<b>'+n+'</b> of '+st.parts.length+' parts seen</span><span>'+ic('layers')+'<b>'+st.on.size+'</b> sheet'+(st.on.size===1?'':'s')+'</span><span>'+ic('clock')+'<b>'+mmFmt(st.on.size*10)+'</b> spent</span>';}
  const api={el,st,render,seen:()=>st.parts.filter(isSeen).length,total:()=>st.parts.length,
    set(keys){st.on=new Set(keys);render();},add(k){st.on.add(k);render();},
    parts(list){st.parts=list;render();},ov(m){st.ov=m||{};render();},badge(t){st.badge=t;render();},lock(v){st.locked=v;render();},
    btn:k=>tray.querySelector('[data-k="'+k+'"]')};
  render();return api;}

/* ---------- the elephant: the same decoder, one sheet per person's hand ---------- */
const ELE=[['trunk','Trunk','a thick snake','var(--h2)'],['ear','Ear','a fan','var(--h1)'],['leg','Leg','a pillar','var(--h3)'],
  ['side','Side','a wall','var(--h4)'],['tail','Tail','a rope','var(--ok-strong)'],['tusk','Tusk','a spear','var(--no-strong)']];
const ELEP={

{part:0,src:'Introduction · How This Book Can Help You · Mental Models and How to Use Them',run(L){

    '<rect x="180" y="20" width="154" height="146" rx="14" fill="var(--pri-bg)"/><text x="257" y="14" text-anchor="middle" class="mm-tb">Your model of gravity</text>'+

    '<circle cx="200" cy="140" r="6" fill="var(--pri)" fill-opacity=".6"/><circle cx="234" cy="140" r="3" fill="var(--pri)" fill-opacity=".5"/><path d="M208 140 h18" stroke="var(--pri)" stroke-width="1.4" stroke-dasharray="2 3"/><text x="244" y="137" class="mm-tb" style="fill:var(--pri-deep)">further away,</text><text x="244" y="151" class="mm-tb" style="fill:var(--pri-deep)">weaker pull</text>'+

{part:0,src:'Introduction · The Power of Acquiring New Models',

{part:0,src:'Preface · Introduction · The Power of Acquiring New Models',run(L){
  const N=[['The map is not','the territory'],['Circle of','competence'],['First principles','thinking'],['Thought','experiment'],['Second-order','thinking'],['Probabilistic','thinking'],['Inversion',''],['Occam’s','razor'],['Hanlon’s','razor']];
  const XY=N.map((_,j)=>[60+(j%3)*110,26+Math.floor(j/3)*76]);
  let ln='';XY.forEach((a,j)=>XY.forEach((b,k)=>{if(k<=j)return;const dx=Math.abs(a[0]-b[0]),dy=Math.abs(a[1]-b[1]);if((dx===110&&dy===0)||(dx===110&&dy===76))ln+='<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'"/>';}));
  L.h(L.kick('learn','A latticework')+'<h1 class="q">Collect lenses from many fields, and link them</h1>'+
   '<svg viewBox="0 0 340 222" class="mm-svg" role="img" aria-label="A lattice of nine linked models: the nine this course teaches."><g stroke="var(--line2)" stroke-width="2">'+ln+'</g>'+
    N.map((n,j)=>{const p=XY[j];return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="14" fill="var(--pri-bg)" stroke="var(--pri)" stroke-width="2"/><text x="'+p[0]+'" y="'+(p[1]+4)+'" text-anchor="middle" class="mm-tb" style="fill:var(--pri-deep)">'+(j+1)+'</text>'+
      '<text x="'+p[0]+'" y="'+(p[1]+29)+'" text-anchor="middle" class="mm-t mm-halo">'+n[0]+'</text>'+(n[1]?'<text x="'+p[0]+'" y="'+(p[1]+42)+'" text-anchor="middle" class="mm-t mm-halo">'+n[1]+'</text>':'');}).join('')+'</svg>'+
   '<p class="mm-cap">Charlie Munger called it a '+L.g('latticework','latticework')+': big ideas from many fields, linked. The nine above are this book’s models and this course’s lessons. Know only one, and you overuse it.</p>'+
   L.quote('To the man with only a hammer, everything starts looking like a nail.','An old adage, quoted in the book’s Introduction'));

{part:0,src:'Introduction · How This Book Can Help You',pts:1,run(L){

   [['Both are partly right, like the blind men. Dropping one view hides a layer.','One lens, however good, shows one layer. With only a hammer, everything looks like a nail.'],

    '<path d="M224 120 v10 M220 124 l4 -5 4 5 M248 120 v10 M244 124 l4 -5 4 5" stroke="var(--muted)" stroke-width="2" fill="none" stroke-linecap="round"/>'+bar(296,.12,'var(--no-strong)')+'</g></svg>'+

{part:1,src:'Introduction · Getting in Our Own Way',pts:1,
 solve:async L=>{L.$('#gs-drop').click();await L.sleep(1150);L.$('#gs-o1').click();await L.sleep(1200);},
 run(L){let picked=-1;

   '<p class="small" style="margin:0" id="gs-cap">You’re below deck on a ship moving at a steady speed. There are no portholes.</p><div id="gs"></div>'+

  L.$('#gs-drop').onclick=()=>{L.$('#gs-b').hidden=true;sh.drop(()=>{if(!L.$('#gs-q'))return;
    L.$('#gs-cap').innerHTML='From where you stand, the ball falls straight down.';
    L.$('#gs-q').innerHTML='<h2 class="sub">An X-ray fish watches the ship go past. What path does the fish see the ball take?</h2><div class="mm-btns" style="margin-top:0">'+
      ['Straight down','Slanting forward, with the ship','Slanting backward'].map((t,j)=>'<button class="chip" id="gs-o'+j+'">'+t+'</button>').join('')+'</div>';
    [0,1,2].forEach(j=>L.$('#gs-o'+j).onclick=()=>{if(picked>=0)return;picked=j;L.$('#gs-o'+j).classList.add('sel');sh.view('out');
      L.$('#gs-cap').innerHTML='Now watch from outside, as the fish.';

        L.sheet(ok?'ok':'no',ok?'Yes: it slants forward':'It slants forward, with the ship','Inside, with nothing outside to compare against, the ball seems to fall straight. The fish also sees it travel about twenty feet sideways with the ship. That’s the first flaw, <b>perspective</b>: it’s hard to see a system you’re part of. Look for other vantage points.');L.done();});});});};}},

{part:1,src:'Introduction · Getting in Our Own Way',run(L){
  L.h(L.kick('learn','Flaws 2 and 3 · ego and distance')+'<h1 class="q">Two more things block the feedback you need</h1>'+

    '<path d="M40 72 q4 -4 0 -8 M48 72 q4 -4 0 -8 M56 72 q4 -4 0 -8" fill="none" stroke="var(--no-strong)" stroke-width="2" stroke-linecap="round"/>'+'<text x="80" y="40" class="mm-tb" style="fill:var(--no)">ouch!</text><text x="8" y="120" class="mm-t">hot stove: an instant lesson</text>'+

{part:1,src:'Introduction · Getting in Our Own Way',
 solve:async L=>{L.$('#fx-p').click();L.$('#fx-e').click();const r=L.$('#fx-d');r.value='2';r.dispatchEvent(new Event('input',{bubbles:true}));await L.sleep(30);},
 run(L){const touched=new Set();let fin=false;
  L.h(L.kick('learn','Explore · the feedback line')+'<h1 class="q">Feedback travels up from reality. Open and close the valves and watch what reaches the top.</h1>'+
   '<div id="fx"></div><div class="fbk-ctl"><button class="fbk-tg" id="fx-p" aria-pressed="false">'+L.ic('eye')+'<span><b>Perspective</b><small>other angles open</small></span></button>'+
   '<button class="fbk-tg" id="fx-e" aria-pressed="false">'+L.ic('shield')+'<span><b>Ego</b><small>open to criticism</small></span></button>'+
   '<label class="fbk-sl"><b>Distance</b> <small id="fx-dl">touches it myself</small><input type="range" id="fx-d" min="0" max="2" step="1" value="0" aria-label="Distance from the results"><span class="fbk-ticks"><span>my own hand</span><span>the team does it</span><span>three levels up</span></span></label></div>'+
   '<div class="mm-btns" id="fx-s"></div><p class="small" style="margin:8px 0 0">Feedback counts are illustrative. Try each control at least once. <span id="fx-c" style="font-weight:600;color:var(--ink)"></span></p>');
  const fb=fbLine(L.$('#fx'),{name:'You'});
  const sync=()=>{const s=fb.st;L.$('#fx-p').classList.toggle('shut',!s.p);L.$('#fx-p').setAttribute('aria-pressed',!s.p);L.$('#fx-p small').textContent=s.p?'other angles open':'only my angle';
    L.$('#fx-e').classList.toggle('shut',s.e);L.$('#fx-e').setAttribute('aria-pressed',s.e);L.$('#fx-e small').textContent=s.e?'shield up':'open to criticism';
    L.$('#fx-d').value=s.d;L.$('#fx-dl').textContent=FDL[s.d];L.$('#fx-c').textContent='Controls tried: '+touched.size+' of 3';
    if(!fin&&touched.size===3){fin=true;L.sheet('info','Any one flaw can stop the update','Close one valve and too little feedback reaches the top, so the belief stays as it was. That’s why we repeat the same mistakes. With every valve open and your hand near the results, the lamp lights: you update.');L.done();}};
  L.$('#fx-p').onclick=()=>{touched.add('p');fb.set({p:!fb.st.p});sync();};
  L.$('#fx-e').onclick=()=>{touched.add('e');fb.set({e:!fb.st.e});sync();};
  L.$('#fx-d').oninput=e=>{touched.add('d');fb.set({d:+e.target.value});sync();};
  const PS=[['Hot stove',{p:true,e:false,d:0}],['Pella, three levels up',{p:true,e:false,d:2}],['Shield up',{p:true,e:true,d:0}],['Only my angle',{p:false,e:false,d:0}]];
  L.$('#fx-s').innerHTML=PS.map((p,j)=>'<button class="chip" id="fx-s'+j+'">'+p[0]+'</button>').join('');
  PS.forEach((p,j)=>L.$('#fx-s'+j).onclick=()=>{PS.forEach((_,q)=>L.$('#fx-s'+q).classList.toggle('sel',q===j));fb.set(p[1]);sync();});
  sync();}},

{part:1,src:'Introduction · Getting in Our Own Way',pts:3,
 solve:async L=>{const R=[0,1,2];for(let k=0;k<3;k++){L.$('#ff-pk'+R[k]).click();await L.sleep(30);L.$('#ff-fix').click();await L.sleep(30);if(k<2){L.$('#ff-nx').click();await L.sleep(30);}}},
 run(L){
  const S=[['Ira','Ira is sure Bram is out to make production look bad. Ira has only ever seen Bram’s rush jobs from the production floor, never from a client call.',0,{p:false,e:false,d:0},
     'Ira sees the whole system from one seat, like the scientist below deck.','Sit in on one of Bram’s client calls',{p:true}],
   ['Ira','In the switchover meeting, the floor lead points out a hole in Ira’s plan. Ira spends the rest of the meeting explaining why the plan is fine.',1,{p:true,e:true,d:0},
     'The criticism was feedback. Ira’s ego turned it into an attack to fend off: defending, not upgrading.','Thank them, and ask what they’d change',{e:false}],
   ['Pella','Pella reads “95% on time” in the office and decides training can wait. Pella hasn’t been down to the loading dock in months.',2,{p:true,e:false,d:2},
     'Pella decides; other people carry it out. The results reach Pella faint and late, if at all.','Spend ten minutes at the loading dock',{d:0}]];
  const NM=[['eye','Perspective'],['shield','Ego'],['arrow','Distance']];
  let k=0,ans=false,fb;
  L.h(L.kick('pr','Ira’s three flaws')+'<h1 class="q">Which valve is blocking the feedback? Tap it.</h1><p class="small" style="margin:0" id="ff-n"></p><div class="fbk-say" id="ff-s"></div><div id="ff-l"></div>'+
   '<div class="fbk-picks">'+NM.map((n,j)=>'<button class="fbk-pk" id="ff-pk'+j+'">'+L.ic(n[0])+n[1]+'</button>').join('')+'</div><div id="ff-f"></div>'+
   '<div class="mm-btns"><button class="btn pri" id="ff-fix" hidden>'+L.ic('check')+'<span></span></button><button class="btn" id="ff-nx" hidden>'+L.ic('arrow')+'Next situation</button></div>');
  const show=()=>{ans=false;const s=S[k];L.$('#ff-n').textContent='Situation '+(k+1)+' of 3';L.$('#ff-s').innerHTML='<b>'+s[0]+'</b>'+s[1];
    L.$('#ff-l').innerHTML='';fb=fbLine(L.$('#ff-l'),{name:s[0],mystery:true});fb.set(s[3]);fb.set({myst:true});
    NM.forEach((_,j)=>{const b=L.$('#ff-pk'+j);b.className='fbk-pk';b.removeAttribute('aria-disabled');});L.$('#ff-f').innerHTML='';L.$('#ff-fix').hidden=true;L.$('#ff-nx').hidden=true;};
  NM.forEach((_,j)=>L.$('#ff-pk'+j).onclick=()=>{if(ans)return;ans=true;const s=S[k],ok=j===s[2];
    NM.forEach((_,q)=>L.$('#ff-pk'+q).setAttribute('aria-disabled','true'));L.$('#ff-pk'+j).classList.add(ok?'ok':'no');if(!ok)L.$('#ff-pk'+s[2]).classList.add('ok');
    L.award(ok);fb.set({myst:false});
    L.fb(L.$('#ff-f'),(ok?'<b>Yes, '+NM[s[2]][1].toLowerCase()+'.</b> ':'<b>It’s '+NM[s[2]][1].toLowerCase()+'.</b> ')+s[4],ok?'ok':'no');
    const fx=L.$('#ff-fix');fx.querySelector('span').textContent='Open it: '+s[5];fx.hidden=false;});
  L.$('#ff-fix').onclick=()=>{if(!ans||L.$('#ff-fix').hidden)return;fb.set(S[k][6]);L.$('#ff-fix').hidden=true;
    if(k<S.length-1)L.$('#ff-nx').hidden=false;
    else{L.sheet('info','Open one valve, and the lamp lights','Each fix is small: one more angle, one honest question, one walk to where the results happen. That’s keeping your feet on the ground, and it’s what lets a belief get updated.');L.done();}};
  L.$('#ff-nx').onclick=()=>{if(k>=S.length-1)return;k++;show();};
  show();}},

{part:1,src:'Introduction · Understanding Is Not Enough',run(L){
  L.h(L.kick('learn','Understanding is not enough')+'<h1 class="q">Knowing changes nothing until you act differently</h1>'+
   '<svg viewBox="0 0 340 130" class="mm-svg" role="img" aria-label="From understanding to changed behavior: a path of many small steps, day after day.">'+
    '<rect x="4" y="22" width="114" height="76" rx="12" fill="var(--h1-bg)"/><g transform="translate(50 30) scale(.9)" fill="none" stroke="var(--h1)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+'<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"/></g><text x="61" y="70" text-anchor="middle" class="mm-tb" style="fill:var(--h1)">I understand:</text><text x="61" y="88" text-anchor="middle" class="mm-t" style="fill:var(--ink)">“I interrupt people.”</text>'+
    '<rect x="222" y="22" width="114" height="76" rx="12" fill="var(--ok-bg)"/><g transform="translate(268 30) scale(.9)" fill="none" stroke="var(--ok)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></g><text x="279" y="70" text-anchor="middle" class="mm-tb" style="fill:var(--ok)">I change:</text><text x="279" y="88" text-anchor="middle" class="mm-t" style="fill:var(--ink)">I wait for the pause.</text>'+
    [0,1,2,3,4].map(j=>'<rect x="'+(126+j*19)+'" y="'+(70-j*6)+'" width="15" height="'+(10+j*6)+'" rx="3" fill="var(--h3)" fill-opacity="'+(.35+j*.13).toFixed(2)+'"/>').join('')+
    '<text x="170" y="112" text-anchor="middle" class="mm-t">day 1, day 2, day 3 …</text><text x="170" y="126" text-anchor="middle" class="mm-t">change takes consistency</text></svg>'+
   '<p class="mm-cap">Understanding becomes useful only when you change what you do. Spotting a mistake is easier than changing the habit behind it. Stick with it: the change takes consistency.</p>');
  L.done();}},

/* ---------- PART 3: USING LENSES WELL ---------- */
{part:2,src:'Introduction · Understanding Reality · Time Invested Yields Enormous Benefits',pts:1,
 solve:async L=>{L.$('#lp-o0').click();await L.sleep(20);L.$('#lp-go').click();await L.sleep(2300);},
 run(L){let pick=-1,ran=false;
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">Ira is choosing lunch. How many sheets until Ira sees everything that matters?</h1>'+
   '<div class="mm-btns" style="margin-top:0">'+['None, or one at most','About four','All seven, to be safe'].map((t,j)=>'<button class="chip" id="lp-o'+j+'">'+t+'</button>').join('')+'</div>'+
   '<div class="mm-btns" style="margin-top:4px"><button class="btn pri" id="lp-go" disabled>'+L.ic('play')+'Watch: lay down every sheet</button></div><div id="lp"></div>');
  const bd=dzBoard(L.$('#lp'),{parts:LUNCH,locked:true});
  [0,1,2].forEach(j=>L.$('#lp-o'+j).onclick=()=>{if(ran)return;pick=j;[0,1,2].forEach(q=>L.$('#lp-o'+q).classList.toggle('sel',q===j));L.$('#lp-go').disabled=false;});
  L.$('#lp-go').onclick=()=>{if(ran||pick<0)return;ran=true;L.$('#lp-go').hidden=true;let j=0;
    const iv=setInterval(()=>{if(!bd.el.isConnected){clearInterval(iv);return;}bd.add(SHK[j++]);
      if(j>=SHK.length){clearInterval(iv);const ok=pick===0;L.$('#lp-o0').classList.add('ok');if(!ok)L.$('#lp-o'+pick).classList.add('no');L.award(ok);
        L.sheet(ok?'ok':'no',ok?'Right: it was already in view':'Nothing new appeared','Seven sheets, seventy seconds, and still 2 of 2 parts seen. Simple, well-defined problems need few lenses: you already know what matters. The book is blunt that models are not an excuse for a long decision process. Pick, and get on with the day.');L.done();}},260);};}},

{part:2,src:'Introduction · Understanding Reality · The Power of Acquiring New Models',pts:1,
 solve:async L=>{['map','circle','second','occam'].forEach(k=>L.$('#mc .dz-sh[data-k="'+k+'"]').click());await L.sleep(20);L.$('#mc-go').click();},
 run(L){let first=true;
  L.h(L.kick('pr','Challenge · Ira’s Monday')+'<h1 class="q">Ira’s Monday hides six parts. Reveal all six with four sheets or fewer.</h1>'+
   '<p class="small" style="margin:0">Each sheet is one of the book’s models, previewed; each gets its own lesson. Every sheet costs about 10 seconds (illustrative).</p><div id="mc"></div>'+
   '<div class="mm-btns"><button class="btn pri" id="mc-go">'+L.ic('check')+'Check my sheets</button></div>');
  const bd=dzBoard(L.$('#mc'),{parts:MON});
  L.$('#mc-go').onclick=()=>{const n=bd.seen(),k=bd.st.on.size,ok=n===6&&k<=4;
    if(first){first=false;L.award(ok);}
    const miss=MON.filter(p=>!p[4].some(x=>bd.st.on.has(x))).length;
    if(ok)L.sheet('ok','The whole picture, four sheets','The map and circle sheets each reveal two parts. Second-order thinking (or inversion) and Occam’s razor (or probabilistic thinking) finish it. Some lenses overlap: once a part is seen, another sheet on it costs time and adds little.');
    else L.sheet('no',miss?miss+' part'+(miss===1?'':'s')+' still hidden':'All six, but '+k+' sheets',(miss?'Look for the sheets that reveal two tiles at once. ':'Some sheets only repeat what another already shows. Lift those. ')+'Four sheets are enough: the map, circle of competence, one of second-order thinking or inversion, and one of Occam’s razor or probabilistic thinking. Keep trying if you like.');
    L.done();};}},

{part:2,src:'Introduction · Mental Models and How to Use Them',run(L){
  L.h(L.kick('learn','Two ways a model fails')+'<h1 class="q">A wrong model, or a right one in the wrong place</h1>'+
   '<svg viewBox="0 0 340 166" class="mm-svg" role="img" aria-label="Left: a bowl collecting drops of blood, the old practice of bloodletting. Right: a hammer about to hit a screw.">'+
    '<rect x="4" y="6" width="160" height="156" rx="14" fill="var(--no-bg)"/><text x="84" y="26" text-anchor="middle" class="mm-tb" style="fill:var(--no)">The model is wrong</text>'+
    '<path d="M54 72 h60 a30 24 0 0 1 -60 0 z" fill="var(--card)" stroke="var(--no)" stroke-width="2.5"/>'+[68,84,100].map((x,j)=>'<path d="M'+x+' '+(38+j*5)+' q5 8 0 12 q-5 -4 0 -12 z" fill="var(--no-strong)"/>').join('')+
    '<text x="84" y="122" text-anchor="middle" class="mm-t" style="fill:var(--ink)">bloodletting was trusted</text><text x="84" y="136" text-anchor="middle" class="mm-t" style="fill:var(--ink)">for a long time, yet it</text><text x="84" y="150" text-anchor="middle" class="mm-t" style="fill:var(--ink)">weakened the sick</text>'+
    '<rect x="176" y="6" width="160" height="156" rx="14" fill="var(--h3-bg)"/><text x="256" y="26" text-anchor="middle" class="mm-tb" style="fill:var(--h3)">Right model, wrong place</text>'+
    '<g transform="rotate(-28 236 66)"><rect x="232" y="50" width="8" height="58" rx="3" fill="var(--h3)"/><rect x="216" y="40" width="40" height="16" rx="3" fill="var(--ink)"/></g>'+
    '<rect x="282" y="78" width="12" height="36" rx="2" fill="var(--line2)"/><path d="M282 84 l12 4 M282 92 l12 4 M282 100 l12 4 M282 108 l12 4" stroke="var(--muted)" stroke-width="1.5"/><rect x="276" y="72" width="24" height="7" rx="2" fill="var(--muted)"/>'+
    '<text x="256" y="136" text-anchor="middle" class="mm-t" style="fill:var(--ink)">a good tool, used on</text><text x="256" y="150" text-anchor="middle" class="mm-t" style="fill:var(--ink)">a problem it doesn’t fit</text></svg>'+
   '<p class="mm-cap">Trouble comes when a model doesn’t survive contact with reality, or when a sound model is used where it doesn’t belong. Either way, keep testing against reality, and switch lenses when one doesn’t fit.</p>');
  L.done();}},

{part:2,src:'Introduction · Mental Models and How to Use Them · Understanding Reality',
 solve:async L=>{for(let j=0;j<4;j++){L.$('#lm-'+j).click();await L.sleep(20);}},
 run(L){const seen=new Set();let fin=false;
  const MONB=MON.map(p=>p[0]);
  const PR=[['One lens only',()=>{bd.parts(MON);bd.set(['hanlon']);const o={};MONB.forEach(k=>o[k]={html:'“Just a mistake. Nobody meant harm.”',cls:'nail',badge:'same answer',bcls:'no'});bd.ov(o);bd.badge(null);},
     'Only Hanlon’s razor, so every tile gets the same answer. It fits Bram, but it says nothing about the dashboard’s count or the dealer’s pay. With only a hammer, everything looks like a nail.'],
    ['A simple choice',()=>{bd.ov({});bd.badge(null);bd.parts(LUNCH);bd.set(SHK);},
     'Lunch, with all seven sheets: seventy seconds gone, nothing new seen. Simple, well-defined choices need few lenses. Models are not an excuse for a long decision process.'],
    ['Right lens, wrong place',()=>{bd.parts(MON);bd.badge(null);bd.set(['occam']);bd.ov({D:{html:'Simplest story: the 95% is right and the two clients exaggerate.',cls:'bad',badge:'distorted',bcls:'no'}});},
     'Occam’s razor prefers the simplest explanation only when the explanations fit the facts equally well. Two clients’ late orders are facts this story ignores. A sound model in the wrong place hides the problem.'],
    ['Never checked',()=>{bd.parts(MON);bd.ov({});bd.set(['map','circle','second','occam']);bd.badge('unchecked');},
     'Lenses tell you where to look; they don’t prove you’re right. Like Antaeus, understanding stays strong only in contact with the ground: Ira still has to walk to the dock, call Wynn again and ask a second mechanic.']];
  L.h(L.kick('ex','Edge cases · where lenses stop helping')+'<h1 class="q">Load each case on Ira’s Monday and watch what goes wrong</h1>'+
   '<div class="mm-btns" style="margin-top:0">'+PR.map((p,j)=>'<button class="chip" id="lm-'+j+'">'+p[0]+'</button>').join('')+'</div>'+
   '<div class="mm-ro" id="lm-r" aria-live="polite"><b class="t">Pick a case <span id="lm-c"></span></b>Each one shows a way lenses can mislead or waste your time.</div><div id="lm"></div>');
  const bd=dzBoard(L.$('#lm'),{parts:MON,on:['map','circle','second','occam'],locked:true});
  PR.forEach((p,j)=>L.$('#lm-'+j).onclick=()=>{PR.forEach((_,q)=>L.$('#lm-'+q).classList.toggle('sel',q===j));p[1]();seen.add(j);
    L.$('#lm-r').innerHTML='<b class="t">'+p[0]+' · cases tried: '+seen.size+' of 4</b>'+p[2];
    if(!fin&&seen.size>=3){fin=true;L.sheet('info','More lenses help, up to a point','Lenses reveal blind spots, but only the right ones, in the right place, for a problem that needs them. And whatever they show still has to be tested against reality.');L.done();}});}},

{part:2,src:'Introduction · Time Invested Yields Enormous Benefits',run(L){
  L.h(L.kick('learn','Keep a journal')+'<h1 class="q">Write down which model you tried and how it went</h1>'+
   '<div class="jr" role="img" aria-label="A journal entry: decision, model tried, what happened, next time."><div class="h">A journal line (example)</div><div><b>Decision:</b> reply to a sharp email from a colleague</div><div><b>Model tried:</b> Hanlon’s razor</div><div><b>What happened:</b> I asked instead of accusing; they were rushed</div><div><b>Next time:</b> same move, faster</div></div>'+
   '<svg viewBox="0 0 340 74" class="mm-svg" role="img" aria-label="Over time: slow at first, then faster."><text x="6" y="12" class="mm-t">time a decision takes, entry after entry</text>'+[44,38,30,24,19,15,12,10].map((h,j)=>'<rect x="'+(8+j*41)+'" y="'+(72-h)+'" width="30" height="'+h+'" rx="4" fill="var(--h2)" fill-opacity="'+(.35+j*.08).toFixed(2)+'"/>').join('')+'</svg>'+
   '<p class="mm-cap">You’ll be slow at first and sometimes pick the wrong model. That’s part of it. At the start, the process matters more than the outcome. Record and reflect, and you’ll get faster at choosing and using models.</p>');
  L.done();}},

{part:2,src:'Introduction · Getting in Our Own Way · Understanding Is Not Enough · Time Invested Yields Enormous Benefits',pts:6,run(L){
  L.h('<div id="qk"></div>');

   ['Ira spends twenty minutes running every model on which sandwich to buy.',1,'Simple, well-defined choices need few lenses. Models are not an excuse for a long decision process.'],

   ['Ira writes down which model they tried on the car decision and how it turned out.',0,'The book’s advice: record and reflect, so you get better at choosing and using models.'],

{part:3,src:'Course application · built on Introduction · Understanding Reality',run(L){
  L.h(L.kick('learn','How this course applies the book')+'<h1 class="q">Your '+L.g('decision-map','decision map')+': each kind of decision gets a first model to try</h1>'+
   '<p class="small" style="margin:0 0 6px">Tap a row to see Ira’s example.</p><div class="dm">'+DMAP.map((r,j)=>'<button class="dm-row" id="dm-'+j+'"><span class="dm-k"><b>'+r[0]+'</b><small>'+r[1]+'</small></span>'+dmSlot(r[2])+'</button>').join('')+'</div>'+
   L.note('How this course applies the book: the book has no decision map. Each grey slot holds the model whose own triggers fit that kind of decision. Lessons 2–10 light the slots up; lesson 11 completes the map.','compass'));

{part:3,src:'Course application · built on Introduction · Time Invested Yields Enormous Benefits',run(L){

   '<div class="rt"><div class="rt-bar" role="img" aria-label="A 60-second bar: 10 seconds name it, 40 seconds run it, 10 seconds check it."><div style="flex:1;background:var(--h1)">10 s</div><div style="flex:4;background:var(--h2)">40 s</div><div style="flex:1;background:var(--h3)">10 s</div></div>'+
   '<div class="rt-lab"><div style="flex:1.25"><b style="color:var(--h1)">Name it</b>Which kind of decision? Find its row.</div><div style="flex:2.5"><b style="color:var(--h2)">Run it</b>Run that row’s first model, its one-minute move.</div><div style="flex:1.25"><b style="color:var(--h3)">Check it</b>Hitting a limit? Small or big?</div></div>'+

{part:3,src:'Course application · built on the nine model chapters',pts:7,
 solve:async L=>{for(let k=0;k<NAMEIT.length;k++){L.$('#ni-r'+NAMEIT[k][1]).click();await L.sleep(20);if(k<NAMEIT.length-1){L.$('#ni-nx').click();await L.sleep(20);}}},
 run(L){let k=0,ans=false;
  L.h(L.kick('pr','Name it · all seven rows')+'<h1 class="q">Name it: tap the row of the map each of Ira’s moments belongs to</h1><div class="mm-app">'+L.ic('compass')+'How this course applies the book</div>'+
   '<p class="small" style="margin:0" id="ni-n"></p><div class="fbk-say" id="ni-s"></div>'+
   '<div class="dm">'+DMAP.map((r,j)=>'<button class="dm-row" id="ni-r'+j+'"><span class="dm-k"><b>'+r[0]+'</b><small>'+r[1]+'</small></span>'+dmSlot(r[2])+'</button>').join('')+'</div>'+
   '<div id="ni-f"></div><div class="mm-btns"><button class="btn pri" id="ni-nx" hidden>'+L.ic('arrow')+'Next moment</button></div>');
  const show=()=>{ans=false;const m=NAMEIT[k];L.$('#ni-n').textContent='Moment '+(k+1)+' of '+NAMEIT.length;L.$('#ni-s').innerHTML='<b>Ira’s week</b>'+m[0];
    DMAP.forEach((_,j)=>{const b=L.$('#ni-r'+j);b.classList.remove('ok','no');b.removeAttribute('aria-disabled');});L.$('#ni-f').innerHTML='';L.$('#ni-nx').hidden=true;};
  DMAP.forEach((r,j)=>L.$('#ni-r'+j).onclick=()=>{if(ans)return;ans=true;const m=NAMEIT[k],ok=j===m[1];
    DMAP.forEach((_,q)=>L.$('#ni-r'+q).setAttribute('aria-disabled','true'));L.$('#ni-r'+j).classList.add(ok?'ok':'no');if(!ok)L.$('#ni-r'+m[1]).classList.add('ok');
    L.award(ok);L.fb(L.$('#ni-f'),(ok?'<b>Yes.</b> ':'<b>It’s “'+DMAP[m[1]][0]+'”.</b> ')+m[2],ok?'ok':'no');
    try{L.$('#ni-f').scrollIntoView({block:'center',behavior:'smooth'});}catch(e){}
    if(k<NAMEIT.length-1)L.$('#ni-nx').hidden=false;
    else{L.sheet('info','All seven rows named','Naming the kind of decision is the first ten seconds of the routine. It tells Ira which model to reach for first. If a moment seems to fit two rows, start with either, and note in your journal how it went: that’s how the map gets sharper.');L.done();}});
  L.$('#ni-nx').onclick=()=>{if(k>=NAMEIT.length-1)return;k++;show();L.$('#ni-s').scrollIntoView({block:'nearest'});};
  show();}},

{part:3,src:'Course application · built on Introduction · Time Invested Yields Enormous Benefits',
 solve:async L=>{const t=L.$('#yt-in');t.value='Whether to say yes to an extra project';t.dispatchEvent(new Event('input',{bubbles:true}));L.$('#yt-r3').click();L.$('#yt-s0').click();await L.sleep(20);},
 run(L){let row=-1,size=-1,fin=false;
  L.h(L.kick('pr','Your turn · ungraded')+'<h1 class="q">Pick one decision you face this week, and guess its row</h1><div class="mm-app">'+L.ic('compass')+'How this course applies the book</div>'+
   '<label class="yt-lab" for="yt-in">One decision I face this week</label><textarea class="yt-in" id="yt-in" placeholder="e.g. whether to fix the old laptop or buy a new one"></textarea>'+
   '<span class="yt-lab">Which kind of decision is it?</span><div class="dm">'+DMAP.map((r,j)=>'<button class="dm-row" id="yt-r'+j+'"><span class="dm-k"><b>'+r[0]+'</b></span>'+dmSlot(r[2])+'</button>').join('')+'</div>'+
   '<span class="yt-lab">Small or big?</span><div class="mm-btns" style="margin-top:0"><button class="chip" id="yt-s0">Small, easy to undo</button><button class="chip" id="yt-s1">Big, hard to undo</button></div><div id="yt-o"></div>');
  const out=()=>{const t=L.$('#yt-in').value.trim();
    if(row<0||size<0||t.length<3){L.$('#yt-o').innerHTML='';return;}const m=MOD[DMAP[row][2]];
    L.$('#yt-o').innerHTML='<div class="yt-try"><b class="t">'+L.ic(m[1])+'Try the first step now · 30 seconds</b>'+TRY[DMAP[row][2]]+'</div>'+
     '<div class="jr" style="margin-top:12px"><div class="h">Your first journal line</div><div><b>Decision:</b> '+L.esc(t)+'</div><div><b>Row:</b> '+DMAP[row][0]+'</div><div><b>First model:</b> '+m[0]+' (full move in lesson '+m[2]+')</div><div><b>Plan:</b> '+(size===0?'about a minute, then act':'walk the whole row, write it down, review later')+'</div></div>';
    if(!fin){fin=true;L.sheet('info','Keep this decision in mind','Run the green first step on your decision now: it takes about 30 seconds. Lesson '+m[2]+' runs the whole one-minute move of '+m[0].replace(/^(Second|Circle|Inversion|Thought|First)/,x=>x.toLowerCase())+' on this decision. If the row turns out wrong, that’s useful too: note it, and the map gets sharper.');L.done();}};
  L.$('#yt-in').addEventListener('input',out);
  DMAP.forEach((_,j)=>L.$('#yt-r'+j).onclick=()=>{row=j;DMAP.forEach((_,q)=>L.$('#yt-r'+q).classList.toggle('sel',q===j));out();});
  [0,1].forEach(j=>L.$('#yt-s'+j).onclick=()=>{size=j;[0,1].forEach(q=>L.$('#yt-s'+q).classList.toggle('sel',q===j));out();});}}
  ]
});
</script>
