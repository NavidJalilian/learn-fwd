<script>
/* ===== Inversion: this lesson's own force-field board, flip-the-road and small scenes ===== */
(function(){const st=document.createElement('style');st.textContent=`
.iv-fig{display:block;width:100%;max-width:336px;margin:0 auto 6px;overflow:visible}

.iv-fc .n{flex:none;min-width:30px;height:24px;padding:0 4px;border-radius:999px;display:grid;place-items:center;font-size:12.5px;font-weight:700}

/* ---------- shared bits for this lesson ---------- */
const ivEsc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const IV_FLIP='<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M5 2v11M2 10l3 3 3-3M11 14V3M8 6l3-3 3 3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/* ===== Signature 1: Lewin's force-field board. Helping forces push the "now" line right, blocking forces push it back. ===== */
const IV_SW={goal:8,
 help:[{k:'sys',l:'System',s:2,on:1},{k:'pella',l:'Pella',s:1,on:1},
  {k:'train',l:'Training',s:1,e:3,add:'Add a second training session'},
  {k:'lead',l:'Floor lead',s:2,e:2,add:'Floor lead champions it on the floor'},
  {k:'ref',l:'Ref cards',s:1,e:1,add:'Quick-reference card at each press'},
  {k:'mail',l:'Reminders',s:1,e:1,add:'Weekly reminder emails'}],
 hind:[{k:'fear',l:'Fear of blame',s:3,e:1,rm:'Pella promises no blame for early errors'},
  {k:'sheet',l:'Old sheet',s:2,e:1,rm:'retire the old spreadsheet after week one'},
  {k:'busy',l:'Busy week',s:1,e:2,rm:'move go-live to a quiet week'},
  {k:'click',l:'Extra clicks',s:1,e:2,rm:'set up a one-tap job shortcut'}]};
IV_SW.hind[0].rm='Pella promises no blame for early errors';

function ivBoard(host,o){
  const goal=o.goal||8;let stage=o.stage==null?5:o.stage;
  const F=o.help.map(f=>Object.assign({},f,{side:'h',init:!!f.on,on:!!f.on})).concat(o.hind.map(f=>Object.assign({},f,{side:'r',init:true,on:true})));
  const hs=F.filter(f=>f.side==='h'),rs=F.filter(f=>f.side==='r');
  const rows=Math.max(hs.length,rs.length,3),H=44+rows*28+28;
  const X=p=>120+11*Math.max(-2,Math.min(8.6,p));
  const pos=()=>F.reduce((a,f)=>a+(f.side==='h'?(f.on&&!f.init?f.s:0):(f.on?0:f.s)),0);
  const used=()=>F.filter(f=>f.side==='h'?(f.on&&!f.init):!f.on);
  const arrow=(f,j)=>{const y=44+j*28+12,t=f.side==='h',len=Math.round(Math.max(74+8*f.s,f.l.length*7+28)),a=(10+3*f.s)/2,hd=12;
    const x0=t?-len:len,x1=t?-3:3,xh=t?x1-hd:x1+hd,c=t?'ok':'no';
    return '<g class="iv-ar" data-k="'+f.k+'"><path d="M'+x0+' '+(y-a)+'H'+xh+'V'+(y-a-4)+'L'+x1+' '+y+'L'+xh+' '+(y+a+4)+'V'+(y+a)+'H'+x0+'Z" fill="var(--'+c+'-bg)" stroke="var(--'+c+'-strong)" stroke-width="1.6" stroke-linejoin="round"/>'+
      '<text x="'+(t?x0+7:x0-7)+'" y="'+(y+4)+'" text-anchor="'+(t?'start':'end')+'" font-size="12.5" font-weight="600" fill="var(--'+c+')">'+f.l+'</text></g>';};
  const w=document.createElement('div');w.className='iv-board';
  w.innerHTML=(o.steps===false?'':'<div class="iv-steps" aria-hidden="true"></div>')+
   '<svg class="iv-fig" viewBox="0 0 336 '+H+'" role="img" aria-label="Force field board: helping forces push the now line toward the objective from the left; blocking forces push it back from the right">'+
   '<line x1="8" y1="24" x2="328" y2="24" stroke="var(--line2)" stroke-width="2"/>'+
   '<line x1="'+X(0)+'" y1="18" x2="'+X(0)+'" y2="30" stroke="var(--muted)" stroke-width="2"/><text x="'+X(0)+'" y="13" text-anchor="middle" font-size="12.5" fill="var(--muted)">Start</text>'+
   '<g class="iv-g iv-flag"><line x1="'+X(goal)+'" y1="26" x2="'+X(goal)+'" y2="'+(H-24)+'" stroke="var(--ok-strong)" stroke-width="1.5" stroke-dasharray="4 4"/><path class="iv-fl" d="M'+X(goal)+' 24V3l15 5.5-15 5.5" fill="var(--ok-bg)" stroke="var(--ok-strong)" stroke-width="1.5" stroke-linejoin="round"/><text x="'+(X(goal)+19)+'" y="13" font-size="12.5" font-weight="700" fill="var(--ok)">'+(o.goalLabel||'Objective')+'</text></g>'+
   '<g class="iv-ln" style="transform:translateX('+X(0)+'px)">'+
    '<g class="iv-g iv-gr">'+rs.map(arrow).join('')+'</g>'+
    (o.cover?'<g class="iv-g iv-cov"><rect x="8" y="36" width="190" height="'+(H-70)+'" rx="10" fill="var(--soft2)" stroke="var(--line2)" stroke-dasharray="5 4"/><text x="103" y="'+(H/2-6)+'" text-anchor="middle" font-size="13" font-weight="700" fill="var(--muted)">Step 4 not done yet</text><text x="103" y="'+(H/2+11)+'" text-anchor="middle" font-size="13" fill="var(--muted)">What pushes back?</text></g>':'')+
    '<g class="iv-g iv-gh">'+hs.map(arrow).join('')+'</g>'+
    '<rect x="-2.5" y="30" width="5" height="'+(H-54)+'" rx="2.5" fill="var(--ink)"/><text x="0" y="'+(H-8)+'" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">Now</text>'+
   '</g></svg>'+
   '<p class="iv-ro" aria-live="polite"></p>'+(o.note===false?'':'<p class="iv-ill">'+(o.note||'Force strengths and effort are illustrative.')+'</p>')+'<div class="iv-tray"></div>';
  host.appendChild(w);
  const tray=w.querySelector('.iv-tray');
  const btn=f=>'<button class="iv-fc '+f.side+'" data-k="'+f.k+'" aria-pressed="false"><span class="n">+'+f.s+'</span><span>'+(f.side==='h'?f.add:'Remove “'+f.l+'”: '+f.rm)+'</span><em>effort '+f.e+'</em></button>';
  if(o.tray!==false){
    tray.innerHTML='<p class="iv-th">Add a helping force · step 3</p>'+hs.filter(f=>!f.init).map(btn).join('')+
     (o.flipBtn?'<div class="iv-btns iv-fb"><button class="btn pri" data-a="flip">'+IV_FLIP+'Flip: what pushes back? (step 4)</button></div>':'')+
     '<div class="iv-rsec"><p class="iv-th">Remove a blocking force · step 4</p>'+rs.map(btn).join('')+'</div>';
    tray.querySelectorAll('.iv-fc').forEach(b=>b.onclick=()=>{if(o.lock)return;api.use(b.dataset.k,!api.isUsed(b.dataset.k));});
    const fb=tray.querySelector('[data-a=flip]');if(fb)fb.onclick=()=>{api.setStage(5);if(o.onFlip)o.onFlip(api);};
  }
  const fmt=n=>String(Math.round(n*10)/10);
  function draw(){const p=pos(),u=used(),eff=u.reduce((a,f)=>a+(f.e||0),0),hit=p>=goal;
    w.querySelector('.iv-ln').style.transform='translateX('+X(p)+'px)';
    F.forEach(f=>{const g=w.querySelector('.iv-ar[data-k="'+f.k+'"]');g.classList.toggle('idle',f.side==='h'&&!f.on);g.classList.toggle('off',f.side==='r'&&!f.on);});
    w.querySelector('.iv-flag').classList.toggle('iv-hide',stage<2);
    w.querySelector('.iv-gh').classList.toggle('iv-hide',stage<3);
    w.querySelector('.iv-gr').classList.toggle('iv-hide',stage<4);
    const cv=w.querySelector('.iv-cov');if(cv)cv.classList.toggle('iv-hide',stage>=4||stage<3);
    w.querySelector('.iv-fl').setAttribute('fill',hit?'var(--ok-strong)':'var(--ok-bg)');
    const sp=w.querySelector('.iv-steps');
    if(sp)sp.innerHTML=[['1','Problem'],['2','Objective'],['3','Helping'],['','Flip'],['4','Blocking'],['5','Plan both']].map((x,j)=>{const on=j<3?stage>j:j===5?stage>=5:stage>=4;return '<span class="'+(on?'on':'')+(j===3?' fx':'')+'">'+(x[0]?x[0]+'<br>':IV_FLIP.replace('width="16" height="16"','width="12" height="12"')+'<br>')+x[1]+'</span>';}).join('');
    w.querySelector('.iv-ro').innerHTML=o.ro?o.ro(api):stage<2?'<b>The line marks where things are now.</b>':'<b>'+(hit?'Objective reached':'Line at '+fmt(Math.max(0,p))+' of '+goal)+'</b> · cards used '+u.length+' · effort '+eff;
    tray.querySelectorAll('.iv-fc').forEach(b=>{const k=b.dataset.k,on=api.isUsed(k);b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);b.disabled=!!o.lock;b.querySelector('em').textContent=on?(F.find(f=>f.k===k).side==='h'?'added':'removed'):'effort '+F.find(f=>f.k===k).e;});
    const rsec=tray.querySelector('.iv-rsec');if(rsec)rsec.style.display=stage<4?'none':'';
    const fbx=tray.querySelector('.iv-fb');if(fbx)fbx.style.display=stage>=4?'none':'';}
  const api={el:w,goal,
    get pos(){return pos();},get used(){return used();},get stage(){return stage;},
    get removals(){return used().filter(f=>f.side==='r').length;},get adds(){return used().filter(f=>f.side==='h').length;},
    get effort(){return used().reduce((a,f)=>a+(f.e||0),0);},
    isUsed(k){const f=F.find(x=>x.k===k);return !!f&&(f.side==='h'?(f.on&&!f.init):!f.on);},
    use(k,act){const f=F.find(x=>x.k===k);if(!f||(f.side==='h'&&f.init))return;f.on=f.side==='h'?!!act:!act;draw();if(o.onChange)o.onChange(api,f,act);},
    setStage(n){stage=n;draw();if(o.onChange)o.onChange(api);},
    reset(){F.forEach(f=>{f.on=f.side==='h'?f.init:true;});draw();if(o.onChange)o.onChange(api);}};
  draw();return api;}

/* ===== Signature 2: flip the road. Forward road to the goal; flip it into the road to guaranteed failure; flip back and fill the potholes. ===== */
const IV_RD='M30 175C110 175 90 110 160 105S230 40 292 34';
const IV_P=[[99,142],[160,105],[229,70]],IV_LB=[[118,168,'start'],[145,86,'end'],[211,49,'end']];
const IV_CAR='<rect x="-11" y="-8" width="22" height="12" rx="3.5" fill="var(--pri)" stroke="var(--card)" stroke-width="1.5"/><circle cx="-5.5" cy="4.5" r="2.8" fill="var(--ink)"/><circle cx="5.5" cy="4.5" r="2.8" fill="var(--ink)"/>';
function ivRoad(host,o){
  const need=o.need||3;let ph='fwd',goal=o.goal;const picked=[],filled=new Set(),free=['','',''];
  const w=document.createElement('div');w.className='iv-road';
  w.innerHTML='<div class="iv-flipbox"><div class="iv-rs"></div></div><p class="iv-ro" aria-live="polite"></p><div class="iv-rc"></div>';
  host.appendChild(w);
  const cut=s=>s.length>19?s.slice(0,18)+'…':s;
  const way=i=>{if(!o.free)return o.ways[picked[i]];const v=free[i]||(o.ph||[])[i]||'';return {s:v||'Way '+(i+1),fix:'Avoid it: '+(v||'way to fail '+(i+1))};};
  function svg(){const inv=ph==='inv',n=inv?(o.free?free.filter(Boolean).length:picked.length):ph==='fwd'?0:need;
    let s='<svg class="iv-fig" viewBox="0 0 320 190" role="img" aria-label="'+(inv?'The road flipped: it now leads to guaranteed failure':'A road from today to '+ivEsc(goal))+'">'+
     '<rect x="1" y="1" width="318" height="188" rx="14" fill="var(--'+(inv?'no-bg':'soft')+')"/>'+
     '<path d="'+IV_RD+'" fill="none" stroke="var(--'+(inv?'no-line':'line2')+')" stroke-width="24" stroke-linecap="round"/><path d="'+IV_RD+'" fill="none" stroke="var(--card)" stroke-width="2" stroke-dasharray="8 8"/>'+
     '<text x="12" y="155" font-size="13" font-weight="700" fill="var(--ink)">Today</text>';
    if(inv)s+='<rect x="272" y="26" width="40" height="10" fill="var(--no-strong)"/><path d="M278 26l6 10M290 26l6 10M302 26l6 10" stroke="var(--card)" stroke-width="3"/><path d="M276 36v12M308 36v12" stroke="var(--no-strong)" stroke-width="3"/>'+
      '<text x="266" y="22" text-anchor="end" font-size="13.5" font-weight="700" fill="var(--no)">Guaranteed failure</text>';
    else s+='<path d="M292 40V8" stroke="var(--ink)" stroke-width="2"/><path d="M292 9l18 6-18 6z" fill="var(--ok-strong)"/><text x="284" y="19" text-anchor="end" font-size="13.5" font-weight="700" fill="var(--ok)">'+ivEsc(goal||'Your goal')+'</text>';
    for(let i=0,k=0;i<(o.free&&inv?3:n);i++){const wd=way(i);if(o.free&&inv&&!free[i])continue;const j=o.free&&inv?i:k;k++;const x=IV_P[j][0],y=IV_P[j][1],lb=IV_LB[j];
      if(inv)s+='<g class="iv-pop"><rect x="'+(x-9)+'" y="'+(y-9)+'" width="18" height="18" rx="3" transform="rotate(45 '+x+' '+y+')" fill="var(--no-strong)"/><text x="'+x+'" y="'+(y+4.5)+'" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">'+(j+1)+'</text></g><text x="'+lb[0]+'" y="'+lb[1]+'" text-anchor="'+lb[2]+'" font-size="13" font-weight="700" fill="var(--no)">'+ivEsc(cut(wd.s))+'</text>';
      else{const f=filled.has(i);s+='<g class="iv-hole" data-i="'+i+'" style="cursor:pointer"><ellipse cx="'+x+'" cy="'+y+'" rx="14" ry="8" fill="var(--'+(f?'ok-strong':'no-strong')+')" opacity="'+(f?1:.9)+'"/>'+(f?'<path d="M'+(x-5)+' '+y+'l3.5 3.5 6.5-7" fill="none" stroke="#fff" stroke-width="2"/>':'<text x="'+x+'" y="'+(y+4)+'" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">'+(i+1)+'</text>')+'</g>'+
        '<text x="'+lb[0]+'" y="'+lb[1]+'" text-anchor="'+lb[2]+'" font-size="13" font-weight="600" fill="var(--'+(f?'ok':'ink')+')"'+(f?' text-decoration="line-through"':'')+'>'+ivEsc(cut(wd.s))+'</text>';}}
    if(!inv)s+='<g class="iv-car"'+(ph==='clear'?'':' transform="translate(30 175)"')+'>'+IV_CAR+(ph==='clear'?'<animateMotion dur="1.3s" fill="freeze" path="'+IV_RD+'" begin="indefinite"/>':'')+'</g>';
    return s+'</svg>';}
  function ro(){const left=need-filled.size;
    w.querySelector('.iv-ro').innerHTML=ph==='fwd'?'Thinking forward: <b>how do we reach '+ivEsc(goal||'the goal')+'?</b>':ph==='inv'?'Flipped: <b>what would guarantee failure?</b>'+(o.free?'':' '+picked.length+' of '+need+' found.'):ph==='pot'?'Flipped back: each way to fail is now a pothole. <b>'+left+' left to fill.</b>':'<b>Road clear:</b> none of the ways to fail is left on the road.';}
  function rs(){w.querySelector('.iv-rs').innerHTML=svg();ro();if(ph==='clear'){const am=w.querySelector('animateMotion');if(am&&am.beginElement)am.beginElement();}}
  function ctl(){const c=w.querySelector('.iv-rc');
    if(ph==='fwd'){c.innerHTML='<div class="iv-btns"><button class="btn pri" data-a="flip">'+IV_FLIP+(o.flipText||'Flip it: what would guarantee failure?')+'</button></div>';
      const b=c.querySelector('[data-a=flip]');b.disabled=!!(o.canFlip&&!o.canFlip());b.onclick=()=>{if(o.canFlip&&!o.canFlip())return;flipTo('inv');};}
    else if(ph==='inv'){
      if(o.free){c.innerHTML='<p class="small" style="margin:8px 0 6px">Write up to three ways that would guarantee failure. Short is fine.</p>'+[0,1,2].map(i=>'<label class="iv-lb" for="iv-fr'+i+'">Way to fail '+(i+1)+'</label><input class="iv-in" id="iv-fr'+i+'" data-i="'+i+'" maxlength="40" placeholder="'+ivEsc((o.ph||[])[i]||'')+'" value="'+ivEsc(free[i])+'">').join('')+'<div class="iv-btns"><button class="btn pri" data-a="back">'+IV_FLIP+'Flip back</button></div>';
        c.querySelectorAll('.iv-in').forEach(inp=>inp.oninput=()=>{free[+inp.dataset.i]=inp.value.trim();w.querySelector('.iv-rs').innerHTML=svg();});}
      else{c.innerHTML='<p class="small" style="margin:8px 0 4px">Tap '+need+' ways that would guarantee failure.</p><div class="iv-chips col">'+o.ways.map((x,i)=>'<button class="chip'+(picked.includes(i)?' sel':'')+'" data-i="'+i+'">'+x.t+'</button>').join('')+'</div><p class="iv-msg" aria-live="polite"></p><div class="iv-btns"><button class="btn pri" data-a="back" disabled>'+IV_FLIP+'Flip back</button></div>';
        c.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,x=o.ways[i],m=c.querySelector('.iv-msg');if(picked.includes(i)||picked.length>=need)return;
          if(!x.ok){b.classList.remove('iv-shake');void b.offsetWidth;b.classList.add('iv-shake');m.textContent=x.why;return;}
          m.textContent='';picked.push(i);b.classList.add('sel');rs();if(picked.length===need)c.querySelector('[data-a=back]').disabled=false;if(o.onPick)o.onPick(api);});}
      c.querySelector('[data-a=back]').onclick=()=>{if(!o.free&&picked.length<need)return;flipTo('pot');};}
    else if(ph==='pot'){c.innerHTML='<p class="iv-th">Tap a pothole or a fix to fill it</p>'+Array.from({length:need},(_,i)=>'<button class="iv-fc h" data-i="'+i+'"><span class="n">'+(i+1)+'</span><span>'+ivEsc(way(i).fix)+'</span><em>tap to fill</em></button>').join('');
      c.querySelectorAll('.iv-fc').forEach(b=>b.onclick=()=>fill(+b.dataset.i));}
    else c.querySelectorAll('.iv-fc').forEach(b=>{b.disabled=true;});}
  function fill(i){if(ph!=='pot'||filled.has(i))return;filled.add(i);
    const b=w.querySelector('.iv-rc .iv-fc[data-i="'+i+'"]');if(b){b.classList.add('on');b.querySelector('em').textContent='filled';}
    if(filled.size===need){ph='clear';rs();ctl();if(o.onPhase)o.onPhase(ph,api);if(o.onClear)o.onClear(api);}else rs();}
  function flipTo(n){const fb=w.querySelector('.iv-flipbox');fb.classList.add('fl');
    setTimeout(()=>{if(!w.isConnected)return;ph=n;rs();ctl();fb.classList.remove('fl');if(o.onPhase)o.onPhase(ph,api);},230);}
  w.querySelector('.iv-rs').onclick=e=>{const h=e.target.closest&&e.target.closest('.iv-hole');if(h)fill(+h.dataset.i);};
  const api={el:w,get phase(){return ph;},get picked(){return picked;},get free(){return free;},
    setGoal(g){goal=g;rs();if(ph==='fwd')ctl();}};
  rs();ctl();return api;}


Course.lesson({
  id:'0008', title:'Inversion', minutes:20, icon:'down',
  goals:['Flip a goal into “what would guarantee failure?” and turn the answers into things to avoid','Use both ways to invert, and run a force field analysis that adds helping forces and removes blocking ones','Run inversion in about a minute on everyday work, money and home decisions, and know where it stops'],
  parts:['Flip the question','Two ways to invert','The force field','Use it this week'],
  read:'Read the Inversion chapter for the full Lucky Strike campaign, Carson’s and Munger’s prescriptions for misery, and Florence Nightingale’s statistics.',
  glossary:{
   'force-field':'Force field analysis: psychologist Kurt Lewin’s method for managing change. List the forces that help and the forces that block it, then add helpers and remove blockers.',
   irrational:'Irrational number: a number that no fraction of two whole numbers equals exactly, such as the square root of two.',
   'index-fund':'Index fund: a fund that simply holds a whole market instead of trying to beat it, so less is lost to fees and to picking the wrong manager.',
   'standard-fail':'Standard ways of failing: the common, well-known traps that catch most people, such as spending more than you earn or borrowing too much.'
  },
  cheatsheet:[
   '<b>Inversion</b> approaches a problem from the opposite end. Instead of “How do I succeed?”, ask “What would guarantee failure?”, then avoid it.',
   'Not doing the dumb thing is easier than finding the brilliant one. <b>Avoiding the standard ways of failing</b> raises your odds a lot. We’re taught to think forward, and we can get stuck on one way of solving a problem; flipping it shows simpler answers we missed.',
   '<b>Approach 1:</b> assume the result is already true and ask what other things must also hold (Jacobi, Hippasus, Bernays).',
   '<b>Approach 2:</b> decide what to avoid, then see what options are left (Bogle’s index funds; money pitfalls: spending more than you earn, high-interest debt, saving late).',
   '<b>Force field analysis</b> (Lewin): problem → objective → helping forces → <i>flip</i> → blocking forces → a plan that adds helpers and removes blockers. Most people stop after step 3.',
   '<b>Fix or prevent?</b> Nightingale moved from “how do we fix this?” to “how do we stop it happening?”',
   '<b>Limits:</b> start from either angle, then take the opposite one. The book: avoiding failure raises the odds a lot. This course’s caution: higher odds aren’t a guarantee, so add helpers too.',
   '<b>One-minute move</b> (course application): flip it (“what would guarantee this fails?”) → list three → avoid or remove them → then add the forces that help. <b>Stuck</b> with only the usual ideas, or too many choices? Flip it and cross off what would guarantee failure.'
  ],
  steps:[
/* ---------- PART 1: FLIP THE QUESTION ---------- */

{part:0,src:'Inversion · opening',

 run(L){
  const W=[{k:'cof',l:'Coffee, 4 p.m.',b:'Skip the 4 p.m. coffee',tag:'Ira’s habit',h:1,d:1,wk:[12.1]},
   {k:'alc',l:'Drinks, 9 p.m.',b:'Skip the evening drinks',tag:'book’s example',h:5.8,d:0,wk:[14.4]},
   {k:'din',l:'Late dinner',b:'Eat earlier, not right before bed',tag:'book’s example',h:7.5,d:0,wk:[10,11.4]},
   {k:'ph',l:'Phone in bed',b:'Leave the phone outside the bedroom',tag:'Ira’s habit',h:9.3,d:.5,wk:[13.6]}];
  const on={cof:1,alc:1,din:1,ph:1},x=h=>16+h*19;
  const ico={cof:'<path d="M-6-4h9v5a4.5 4.5 0 0 1-9 0z M3-2h2.2a2 2 0 0 1 0 4H3" fill="none" stroke="currentColor" stroke-width="1.7"/>',
   alc:'<path d="M-5-8h10c0 5-2 8-5 8s-5-3-5-8zM0 0v7M-4 7h8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>',
   din:'<circle r="5.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M-9-6v12M-11-6v4a2 2 0 0 0 4 0v-4" fill="none" stroke="currentColor" stroke-width="1.4"/>',
   ph:'<rect x="-4.5" y="-7.5" width="9" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M-1.5 5h3" stroke="currentColor" stroke-width="1.5"/>'};
  const draw=()=>{const act=W.filter(w=>on[w.k]);const onset=8.25+act.reduce((a,w)=>a+w.d,0);
    const wakes=[].concat(...act.map(w=>w.wk)).sort((a,b)=>a-b);const q=92-act.reduce((a,w)=>a+({cof:18,alc:16,din:14,ph:10}[w.k]),0);
    let s='<svg class="iv-fig" viewBox="0 22 336 128" role="img" aria-label="Ira’s evening and night, 3 p.m. to 7 a.m., with sleep shown as a band">'+
     '<line x1="16" y1="68" x2="320" y2="68" stroke="var(--line2)" stroke-width="2"/>';
    [[0,'3 p.m.'],[4,'7 p.m.'],[8,'11 p.m.'],[12,'3 a.m.'],[16,'7 a.m.']].forEach(t=>{s+='<line x1="'+x(t[0])+'" y1="64" x2="'+x(t[0])+'" y2="72" stroke="var(--muted)" stroke-width="1.5"/><text x="'+x(t[0])+'" y="118" text-anchor="'+(t[0]===0?'start':t[0]===16?'end':'middle')+'" font-size="12.5" fill="var(--muted)">'+t[1]+'</text>';});
    s+='<rect x="'+x(8)+'" y="80" width="'+(x(16)-x(8))+'" height="20" rx="4" fill="var(--soft2)"/>';
    let a=onset;wakes.concat([16]).forEach(wk=>{if(wk>a)s+='<rect x="'+x(a)+'" y="80" width="'+(x(Math.min(wk,16))-x(a))+'" height="20" fill="var(--h2)" opacity=".75"/>';a=Math.max(a,wk+.45);});
    W.forEach(w=>{const o=on[w.k],cx=x(w.h);s+='<g transform="translate('+cx+' 44)" style="color:var(--'+(o?'no':'faint')+')"><circle r="14" fill="var(--'+(o?'no-bg':'soft')+')" stroke="var(--'+(o?'no-strong':'line2')+')" stroke-width="1.8"/>'+ico[w.k]+(o?'':'<path d="M-11 11L11-11" stroke="var(--ok-strong)" stroke-width="2.5"/>')+'</g>';});
    s+=     '<rect x="16" y="132" width="12" height="10" rx="2" fill="var(--h2)" opacity=".75"/><text x="32" y="141" font-size="12.5" fill="var(--muted)">asleep</text><rect x="84" y="132" width="12" height="10" rx="2" fill="var(--soft2)"/><text x="100" y="141" font-size="12.5" fill="var(--muted)">awake in bed</text></svg>';
    L.$('#nt-s').innerHTML=s;L.$('#nt-r').innerHTML='<b>Sleep quality: '+q+' of 100</b> (illustrative) · wake-ups: '+wakes.length;};
  L.h(L.kick('ex','The book’s example, on Ira’s night')+'<h1 class="q">Don’t design the perfect night. Remove what wrecks it.</h1><div id="nt-s"></div><p class="iv-ro" id="nt-r" aria-live="polite"></p>'+
   '<div id="nt-b" class="iv-ico" style="margin-top:8px">'+W.map(w=>'<button class="iv-fc h" data-k="'+w.k+'"><span class="n"><svg viewBox="-13 -12 24 24" width="20" height="20" aria-hidden="true">'+ico[w.k]+'</svg></span><span>'+w.b+'</span><em>'+w.tag+'</em></button>').join('')+'</div><div id="nt-x"></div>');
  draw();let fin=false;
  L.$$('#nt-b .iv-fc').forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(!on[k])return;on[k]=0;b.classList.add('on');b.disabled=true;b.querySelector('em').textContent='removed';draw();

{part:0,src:'Inversion · Avoiding the Standard Ways of Failing',

 run(L){

   '<svg class="iv-fig" viewBox="0 0 320 60" role="img" aria-label="A question card with a flip arrow"><rect x="20" y="8" width="240" height="44" rx="10" fill="var(--pri-bg)" stroke="var(--pri)" stroke-width="2"/><text x="140" y="35" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--pri-deep)">How do we make it a success?</text><g transform="translate(284 30)" style="color:var(--h1)"><circle r="16" fill="var(--h1-bg)"/><g transform="translate(-8 -8)">'+IV_FLIP+'</g></g></svg>');

   'Right. The book’s conclusion: instead of “How do I solve this?”, ask “What would guarantee failure?” The answers point to what to avoid.',
   'Inversion flips the question to the opposite end: what would guarantee failure? A bigger version of the same question is still forward; blame looks backward at people, not at what to avoid.');}},

/* ---------- PART 2: TWO WAYS TO INVERT ---------- */
{part:1,src:'Inversion · Avoiding the Standard Ways of Failing',
 solve:async L=>{L.$('#ta-1').click();L.$('#ta-2').click();},
 run(L){
  const seen=new Set();
  const draw=()=>{const a=seen.has(1),b=seen.has(2);
    let s='<svg class="iv-fig" viewBox="0 0 320 168" role="img" aria-label="Two ways to invert: from an assumed goal down to what must be true, and a grid of options with some crossed out">'+
     '<rect x="1" y="1" width="154" height="166" rx="12" fill="var(--'+(a?'h3-bg':'soft')+')"/><rect x="165" y="1" width="154" height="166" rx="12" fill="var(--'+(b?'h1-bg':'soft')+')"/>'+
     '<text x="78" y="20" text-anchor="middle" font-size="13" font-weight="700" fill="var(--h3)">1 · Assume it’s true</text><text x="242" y="20" text-anchor="middle" font-size="13" font-weight="700" fill="var(--h1)">2 · Decide what to avoid</text>'+
     '<rect x="20" y="30" width="116" height="26" rx="7" fill="var(--card)" stroke="var(--h3)" stroke-width="2"/><text x="78" y="47" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">Goal reached ✓</text>';
    [22,78,134].forEach((cx,j)=>{s+='<path d="M78 56L'+cx+' 88" stroke="var(--h3)" stroke-width="1.6"/><rect x="'+(cx-20)+'" y="88" width="40" height="26" rx="6" fill="var(--card)" stroke="var(--h3)" stroke-width="1.6" stroke-dasharray="'+(a?'0':'4 3')+'"/><text x="'+cx+'" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="var(--h3)"'+(a?' class="iv-pop" style="animation-delay:'+(j*.15)+'s"':'')+'>'+(a?'✓':'?')+'</text>';});
    s+='<text x="78" y="138" text-anchor="middle" font-size="13" fill="var(--ink)">What else would</text><text x="78" y="154" text-anchor="middle" font-size="13" fill="var(--ink)">have to be true?</text>';
    const X=[1,4,6,7];for(let r=0;r<3;r++)for(let c=0;c<3;c++){const j=r*3+c,x=199+c*30,y=32+r*30,cr=b&&X.includes(j);
      s+='<rect x="'+x+'" y="'+y+'" width="24" height="24" rx="5" fill="var(--'+(b&&!cr?'ok-bg':'card')+')" stroke="var(--'+(b&&!cr?'ok-strong':'line2')+')" stroke-width="1.6"'+(cr?' opacity=".5"':'')+'/>'+(cr?'<path class="iv-pop" style="animation-delay:'+(X.indexOf(j)*.12)+'s" d="M'+(x+5)+' '+(y+5)+'l14 14M'+(x+19)+' '+(y+5)+'l-14 14" stroke="var(--no-strong)" stroke-width="2.5"/>':'');}
    s+='<text x="242" y="138" text-anchor="middle" font-size="13" fill="var(--ink)">Cross off what fails,</text><text x="242" y="154" text-anchor="middle" font-size="13" fill="var(--ink)">see what’s left</text></svg>';
    L.$('#ta-s').innerHTML=s;
    L.$('#ta-c').innerHTML=!seen.size?'The book gives two ways to apply inversion. Tap each one.':(a?'<b>1.</b> Assume what you want is already true (or false), then work out what other conditions must hold for that to be the case. ':'')+(b?'<b>2.</b> Instead of aiming straight at the goal, think hard about what to avoid, then see which options are left.':'');};
  L.h(L.kick('learn','Two ways to invert')+'<h1 class="q">From the end, or from what to avoid</h1><div id="ta-s"></div><p class="iv-cap" id="ta-c" aria-live="polite"></p>'+
   '<div class="iv-btns"><button class="btn" id="ta-1">Approach 1</button><button class="btn" id="ta-2">Approach 2</button></div>');
  draw();
  [1,2].forEach(n=>L.$('#ta-'+n).onclick=()=>{seen.add(n);L.$('#ta-'+n).classList.add('pri');draw();if(seen.size===2)L.done();});}},

{part:1,src:'Inversion · Avoiding the Standard Ways of Failing',
 solve:async L=>{for(let j=0;j<4;j++)L.$('#hp-n').click();L.$('#hp-f').click();},
 run(L){
  const G=[[3,2],[7,5],[17,12],[41,29],[99,70]];let k=0,flip=false;
  const X=v=>16+(v-1.36)/0.16*304,R2=Math.SQRT2;
  const draw=()=>{let s='<svg class="iv-fig" viewBox="0 0 336 132" role="img" aria-label="Number line from 1.36 to 1.52 with fraction guesses closing in on the square root of two">'+
    '<line x1="16" y1="62" x2="320" y2="62" stroke="var(--line2)" stroke-width="2"/>';
    [1.4,1.45,1.5].forEach(v=>{s+='<line x1="'+X(v)+'" y1="56" x2="'+X(v)+'" y2="68" stroke="var(--muted)" stroke-width="1.5"/><text x="'+X(v)+'" y="84" text-anchor="middle" font-size="12.5" fill="var(--muted)">'+v.toFixed(2)+'</text>';});
    s+='<line x1="'+X(R2)+'" y1="28" x2="'+X(R2)+'" y2="70" stroke="var(--'+(flip?'h1':'ink')+')" stroke-width="2" stroke-dasharray="4 3"/><text x="'+X(R2)+'" y="20" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--'+(flip?'h1':'ink')+')">'+(flip?'√2: no fraction equals it':'√2 = ?')+'</text>';
    for(let j=0;j<k;j++){const v=G[j][0]/G[j][1],last=j===k-1;s+='<circle cx="'+X(v)+'" cy="62" r="'+(last?6:4.5)+'" fill="var(--'+(last&&!flip?'h4':'line2')+')"/>';
      if(last&&!flip)s+='<text x="'+(X(v)+(v>1.45?-8:8))+'" y="50" text-anchor="'+(v>1.45?'end':'start')+'" font-size="13" font-weight="700" fill="var(--h4)">'+G[j][0]+' ÷ '+G[j][1]+'</text>';}
    if(flip)s+='<g class="iv-pop"><circle cx="'+X(R2)+'" cy="62" r="10" fill="var(--card)" stroke="var(--no-strong)" stroke-width="2.5"/><path d="M'+(X(R2)-7)+' 69l14-14" stroke="var(--no-strong)" stroke-width="2.5"/></g>'+
      '<text x="16" y="114" font-size="13" fill="var(--muted)">Any fraction here?</text><g class="iv-pop"><rect x="146" y="98" width="66" height="24" rx="6" fill="var(--no-bg)" stroke="var(--no-strong)" stroke-width="2"/><text x="179" y="115" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--no)">a ÷ b</text><path d="M150 112H208" stroke="var(--no-strong)" stroke-width="1.6"/></g><text x="220" y="115" font-size="13" font-weight="700" fill="var(--no)">impossible</text>';
    else if(k){const v=G[k-1][0]/G[k-1][1],gap=Math.abs(v*v-2);s+='<text x="16" y="114" font-size="13" fill="var(--muted)">Square minus 2</text><rect x="128" y="104" width="'+Math.max(2,gap/0.25*170)+'" height="12" rx="3" fill="var(--'+(flip?'line2':'h4')+')"/><text x="'+(134+Math.max(2,gap/0.25*170))+'" y="114" font-size="13" font-weight="600" fill="var(--ink)">'+(v*v-2>0?'+':'−')+gap.toFixed(4)+'</text>';}
    L.$('#hp-s').innerHTML=s+'</svg>';
    L.$('#hp-r').innerHTML=!k?'Hippasus tried to find √2 by dividing whole numbers into each other.':flip?'<b>Flipped:</b> what would have to be true if √2 were a fraction?':'<b>Try '+k+':</b> '+G[k-1][0]+' ÷ '+G[k-1][1]+' = '+(G[k-1][0]/G[k-1][1]).toFixed(4)+'; squared = '+(Math.pow(G[k-1][0]/G[k-1][1],2)).toFixed(4)+'. Closer, never exactly 2.';};
  L.h(L.kick('ex','Approach 1 · in mathematics')+'<h1 class="q">Hippasus and the number that wouldn’t divide</h1>'+
   '<div id="hp-s"></div><p class="iv-ro" id="hp-r" aria-live="polite"></p><div class="iv-btns"><button class="btn pri" id="hp-n">Divide the next pair</button><button class="btn" id="hp-f" hidden>'+IV_FLIP+'Flip the question</button></div><div id="hp-x"></div>');
  draw();
  L.$('#hp-n').onclick=()=>{if(flip||k>=G.length)return;k++;draw();if(k>=4)L.$('#hp-f').hidden=false;if(k>=G.length)L.$('#hp-n').disabled=true;};
  L.$('#hp-f').onclick=()=>{if(flip)return;flip=true;draw();L.$('#hp-n').remove();L.$('#hp-f').remove();
    L.$('#hp-x').innerHTML='<p class="iv-cap">Forward got Hippasus closer, never there. So he flipped: what would √2 imply? Proving what it couldn’t be led to the first '+L.g('irrational','irrational number')+'. Jacobi worked the same way: assume, then follow the consequences.</p>'+L.quote('invert, always invert','Carl Jacobi, 19th-century mathematician, as the book reports');L.done();};}},

{part:1,src:'Inversion · Avoiding the Standard Ways of Failing',
 solve:async L=>{for(const k of ['scr','sign','bin','lead'])L.$('#wd-c [data-k="'+k+'"]').click();},
 run(L){
  const C=[{k:'scr',t:'Every press has a screen for logging jobs'},{k:'sign',t:'Nobody fears blame for early mistakes'},{k:'logo',t:'The system has a fancier logo',no:1},
   {k:'bin',t:'The old spreadsheet is gone'},{k:'lead',t:'The floor lead logs jobs in it first'},{k:'cal',t:'Go-live lands in a quiet week'}];
  const on={};let fin=false;
  const vis=k=>on[k]?'1':'0';
  const draw=()=>{const n=Object.keys(on).length;
    L.$('#wd-s').innerHTML='<svg class="iv-fig" viewBox="0 0 320 176" role="img" aria-label="The production floor, filling in with what would have to be true">'+
     '<rect x="1" y="1" width="318" height="174" rx="12" fill="var(--soft)"/><line x1="8" y1="158" x2="312" y2="158" stroke="var(--line2)" stroke-width="3"/>'+
     '<rect x="16" y="84" width="96" height="74" rx="6" fill="var(--soft2)" stroke="var(--muted)" stroke-width="2"/><circle cx="40" cy="132" r="12" fill="none" stroke="var(--muted)" stroke-width="2"/><circle cx="88" cy="132" r="12" fill="none" stroke="var(--muted)" stroke-width="2"/><text x="64" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="var(--muted)">Press</text>'+
     '<rect x="70" y="56" width="38" height="26" rx="3" fill="none" stroke="var(--line2)" stroke-dasharray="4 3"/><g class="iv-sc" opacity="'+vis('scr')+'"><rect x="70" y="56" width="38" height="26" rx="3" fill="var(--h2-bg)" stroke="var(--h2)" stroke-width="2"/><path d="M76 64h26M76 70h20M76 76h14" stroke="var(--h2)" stroke-width="1.6"/><path d="M89 82v4" stroke="var(--h2)" stroke-width="2"/></g>'+
     '<rect x="16" y="12" width="118" height="36" rx="6" fill="none" stroke="var(--line2)" stroke-dasharray="4 3"/><g class="iv-sc" opacity="'+vis('sign')+'"><rect x="16" y="12" width="118" height="36" rx="6" fill="var(--ok-bg)" stroke="var(--ok-strong)" stroke-width="2"/><text x="75" y="27" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ok)">No blame for</text><text x="75" y="41" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ok)">early errors</text></g>'+
     '<circle cx="164" cy="98" r="10" fill="var(--h3-bg)" stroke="var(--ink)" stroke-width="2"/><path d="M150 158c0-26 6-46 14-46s14 20 14 46" fill="var(--pri-bg)" stroke="var(--ink)" stroke-width="2"/><text x="164" y="80" text-anchor="middle" font-size="12.5" font-weight="600" fill="var(--muted)">Floor lead</text>'+
     '<rect x="176" y="118" width="22" height="16" rx="2" fill="none" stroke="var(--line2)" stroke-dasharray="3 3"/><g class="iv-sc" opacity="'+vis('lead')+'"><rect x="176" y="118" width="22" height="16" rx="2" fill="var(--h2-bg)" stroke="var(--h2)" stroke-width="2"/><path d="M180 124h14M180 129h9" stroke="var(--h2)" stroke-width="1.4"/></g>'+
     '<rect x="226" y="12" width="84" height="64" rx="6" fill="none" stroke="var(--line2)" stroke-dasharray="4 3"/><g class="iv-sc" opacity="'+vis('cal')+'"><rect x="226" y="12" width="84" height="64" rx="6" fill="var(--card)" stroke="var(--h3)" stroke-width="2"/><rect x="226" y="12" width="84" height="14" rx="6" fill="var(--h3)"/>'+[0,1,2].map(r=>[0,1,2,3,4].map(c=>'<rect x="'+(232+c*15)+'" y="'+(31+r*14)+'" width="11" height="9" rx="2" fill="var(--soft2)"/>').join('')).join('')+'<rect x="229" y="43" width="78" height="13" rx="4" fill="none" stroke="var(--ok-strong)" stroke-width="2"/><text x="268" y="72" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ok)">quiet week</text></g>'+
     '<path d="M244 118h40l-5 40h-30z" fill="none" stroke="var(--line2)" stroke-dasharray="4 3"/><g class="iv-sc" opacity="'+vis('bin')+'"><rect x="248" y="96" width="32" height="30" rx="2" fill="var(--card)" stroke="var(--muted)" stroke-width="1.5" transform="rotate(-12 264 111)"/><path d="M252 104h22M252 110h22M252 116h22" stroke="var(--muted)" stroke-width="1" transform="rotate(-12 264 111)"/><path d="M244 118h40l-5 40h-30z" fill="var(--soft2)" stroke="var(--muted)" stroke-width="2"/><text x="264" y="90" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--muted)">old sheet</text></g>'+
     '</svg>';
    L.$('#wd-r').innerHTML='<b>'+n+' of 5</b> things that would have to be true are in the picture.';};
  L.h(L.kick('ex','Approach 1 · in practice')+'<h1 class="q">Imagine the production team already uses the new system every day. What else would have to be true?</h1><div id="wd-s"></div><p class="iv-ro" id="wd-r" aria-live="polite"></p>'+
   '<p class="small" style="margin:8px 0 4px">Tap what would have to be true. Find at least four.</p><div class="iv-chips col" id="wd-c">'+C.map(c=>'<button class="chip" data-k="'+c.k+'">'+c.t+'</button>').join('')+'</div><p class="iv-msg" id="wd-m" aria-live="polite"></p><div id="wd-x"></div>');
  draw();
  L.$$('#wd-c .chip').forEach(b=>b.onclick=()=>{const c=C.find(x=>x.k===b.dataset.k);if(on[c.k])return;
    if(c.no){b.classList.remove('iv-shake');void b.offsetWidth;b.classList.add('iv-shake');L.$('#wd-m').textContent='Would that have to be true? The team could log every job daily whatever the logo looks like.';return;}
    L.$('#wd-m').textContent='';on[c.k]=1;b.classList.add('sel');draw();
    if(!fin&&Object.keys(on).length>=4){fin=true;L.$('#wd-x').innerHTML='<p class="iv-cap">The book’s example of this approach: in the 1920s, publicist Edward Bernays didn’t ask how to sell more cigarettes to women. He started from the finished result and asked which parts of everyday life would have to change to produce it. The book tells it only as method.</p>';L.done();}});}},

{part:1,src:'Inversion · Avoiding the Standard Ways of Failing',
 solve:async L=>{for(const k of ['fee','pick','over','int','late'])L.$('#bk-b [data-k="'+k+'"]').click();},
 run(L){
  const LK=[{k:'fee',l:'Fees',y:78,sd:'l',g:'Bogle'},{k:'pick',l:'Poor picks',y:112,sd:'l',g:'Bogle'},{k:'over',l:'Overspending',y:146,sd:'l',g:'you'},{k:'int',l:'High interest',y:92,sd:'r',g:'you'},{k:'late',l:'Saving late',y:132,sd:'r',g:'you'}];
  const T={fee:'Plug: fees',pick:'Plug: poor manager picks',over:'Plug: spending more than you earn',int:'Plug: high-interest debt',late:'Plug: starting to save late'};
  const plug={};let fin=false;
  const lx=y=>110+12*(y-40)/130,rx=y=>210-12*(y-40)/130;
  const draw=()=>{const n=Object.keys(plug).length,lev=96-n*15;
    let s='<svg class="iv-fig" viewBox="0 0 320 186" role="img" aria-label="A bucket of savings with five leaks"><defs><clipPath id="bk-clip"><path d="M110 40H210L198 170H122Z"/></clipPath></defs>'+
     '<g clip-path="url(#bk-clip)"><rect class="iv-wat" x="100" y="40" width="120" height="160" fill="var(--h2)" opacity=".42" style="transform:translateY('+lev+'px)"/></g>'+
     '<path d="M110 40H210L198 170H122Z" fill="none" stroke="var(--h3)" stroke-width="3" stroke-linejoin="round"/><text x="160" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">Money you keep</text>';
    LK.forEach(k=>{const p=!!plug[k.k],x=k.sd==='l'?lx(k.y):rx(k.y),d=k.sd==='l'?-1:1;
      s+='<g data-k="'+k.k+'" style="cursor:pointer">'+(p?'<rect x="'+(x-5)+'" y="'+(k.y-5)+'" width="10" height="10" rx="2" fill="var(--ok-strong)"/>':'<circle cx="'+x+'" cy="'+k.y+'" r="4" fill="var(--ink)"/><path d="M'+x+' '+k.y+'q'+(d*14)+' -2 '+(d*20)+' 12" fill="none" stroke="var(--h2)" stroke-width="2.5" stroke-linecap="round"/><circle cx="'+(x+d*22)+'" cy="'+(k.y+18)+'" r="2.2" fill="var(--h2)"/>')+
       '<text x="'+(x+d*28)+'" y="'+(k.y+4)+'" text-anchor="'+(d<0?'end':'start')+'" font-size="13" font-weight="600" fill="var(--'+(p?'ok':k.g==='Bogle'?'h4':'h1')+')"'+(p?' text-decoration="line-through"':'')+'>'+k.l+'</text></g>';});
    L.$('#bk-s').innerHTML=s+'</svg>';
    L.$('#bk-r').innerHTML='<b>Leaks plugged: '+n+' of 5</b> · water level '+(n===5?'holding':'rising')+' (illustrative)';};
  L.h(L.kick('ex','Approach 2 · in practice')+'<h1 class="q">Plug the leaks instead of chasing a bigger tap</h1><div id="bk-s"></div><p class="iv-ro" id="bk-r" aria-live="polite"></p>'+
   '<div id="bk-b" style="margin-top:8px">'+LK.map(k=>'<button class="iv-fc '+(k.g==='Bogle'?'r':'r')+'" data-k="'+k.k+'"><span class="n">'+(k.g==='Bogle'?'B':'You')+'</span><span>'+T[k.k]+'</span><em>leaking</em></button>').join('')+'</div><div id="bk-x"></div>');
  draw();
  const go=k=>{if(plug[k])return;plug[k]=1;const b=L.$('#bk-b [data-k="'+k+'"]');b.classList.add('on');b.querySelector('em').textContent='plugged';draw();
    if(!fin&&Object.keys(plug).length===5){fin=true;L.$('#bk-x').innerHTML='<p class="iv-cap">Everyone was trying to beat the market; no one managed it consistently. John Bogle flipped the question: how can investors stop losing money to fees and poor manager picks? His answer: '+L.g('index-fund','index funds')+'. Your own leaks, per the book: overspending, high-interest debt, saving late. (About thinking, not investment advice.)</p>';L.done();}};
  L.$$('#bk-b .iv-fc').forEach(b=>b.onclick=()=>go(b.dataset.k));
  L.$('#bk-s').onclick=e=>{const g=e.target.closest&&e.target.closest('[data-k]');if(g)go(g.dataset.k);};}},

{part:1,src:'Inversion · Avoiding the Standard Ways of Failing',pts:5,run(L){
  L.h(L.kick('pr','Which way is it?')+'<h1 class="q">Sort Ira’s and Remy’s questions: approach 1, approach 2, or not inversion at all?</h1>');
  L.buckets(L.card,['1 · Assume it’s true: what else must be?','2 · Decide what to avoid','Forward only: not inversion'],[
   ['Before a client review, Ira asks: “If this client renews next year, what would have to be true by then?”',0,'Ira starts from the result and works out what else must be true: approach 1.'],
   ['Remy lists how a house move usually goes wrong (no money buffer, no time off, no help) and plans around each one.',1,'Naming the ways it goes wrong and steering clear is approach 2: decide what to avoid.'],
   ['Ira plans the switchover by adding more training and more reminder emails.',2,'Only adding pushes toward the goal is forward thinking: Lewin’s step 3, with no flip yet.'],
   ['Ira asks: “If Wynn were living safely alone a year from now, what would be in place?”',0,'Assume the good outcome, then ask what else would be true (handrails, an alarm, regular calls): approach 1.'],
   ['Before the lease talk, Ira writes down what would make them regret renewing, and rules those out.',1,'“What would make us regret it?” is a list of things to avoid: approach 2.']],
   'Approach 1 starts from the end you want; approach 2 starts from the failure you don’t. Plain forward planning only asks what to add.');}},

{part:1,src:'Inversion · Guarantee a Life of Misery',
 solve:async L=>{L.$$('#ms .iv-mc').forEach(b=>b.click());},
 run(L){
  const M=[['Carson','Use substances to fix your mood','Handle stress without substances','<path d="M-5-8h10c0 5-2 8-5 8s-5-3-5-8zM0 0v7M-4 7h8"/>'],
   ['Carson','Envy whoever has more','Stop the comparing (envy)','<path d="M-9 8h18M-5 8V2M5 8V-8"/>'],
   ['Carson','Nurse every old grudge','Let small slights go (resentment)','<path d="M-6 2a4 4 0 0 1 0-8 5 5 0 0 1 9-1 3.5 3.5 0 0 1 3 9zM0 4l-2 4h3l-2 4"/>'],
   ['Munger','Break your promises','Do what you said you’d do','<path d="M-9-7h18v11h-9l-5 4v-4h-4z"/>'],
   ['Munger','Make every mistake yourself','Learn from others’ mistakes','<path d="M0-5v13M0-5c-3-2-6-2-9-1v13c3-1 6-1 9 1M0-5c3-2 6-2 9-1v13c-3-1-6-1-9 1"/>'],
   ['Munger','Quit after the first knock','Get up and keep trying','<path d="M-9 9h18M0 5V-8M-5-3l5-5 5 5"/>']];
  const ic=j=>'<svg viewBox="-12 -12 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+M[j][3]+'</svg>';
  const up=new Set();
  L.h(L.kick('ex','A famous inversion')+'<h1 class="q">A recipe for misery, read upside down</h1>'+
   '<div class="iv-mis" id="ms">'+M.map((m,j)=>'<button class="iv-mc" data-j="'+j+'" aria-label="'+ivEsc(m[1])+'"><i>'+m[0]+'</i><span>'+ic(j)+m[1]+'</span></button>').join('')+'</div>'+
   '<p class="iv-cap" id="ms-c" aria-live="polite">Comedian Johnny Carson couldn’t tell graduates how to be happy, so he gave sure routes to misery. Investor Charlie Munger added three. Tap each card to turn it right way up.</p>');
  L.$$('#ms .iv-mc').forEach(b=>b.onclick=()=>{const j=+b.dataset.j;if(up.has(j))return;up.add(j);b.classList.add('up');b.innerHTML='<i>'+M[j][0]+' · flipped</i><span>'+ic(j)+M[j][2]+'</span>';b.setAttribute('aria-label',M[j][2]);
    if(up.size===M.length){L.$('#ms-c').textContent='Nobody can hand you a recipe for a happy life. But a list of sure ways to be miserable is easy to write, and easy to steer away from.';L.done();}});}},

/* ---------- PART 3: THE FORCE FIELD ---------- */
{part:2,src:'Inversion · Guarantee a Life of Misery',
 solve:async L=>{for(let j=0;j<4;j++)L.$('#lw-n').click();},
 run(L){
  const CAP=['<b>1 · Identify the problem.</b> The production team still logs jobs on paper.','<b>2 · Define your objective.</b> The flag: every job logged in the new system.',
   '<b>3 · List the forces that help.</b> The new system is in; Pella backs it. Most of us stop here.',
   '<b>Flip, then 4 · list the forces that block it.</b> Fear of blame, the old spreadsheet, a busy go-live week, extra clicks. The inversion happens here, between steps 3 and 4.',
   '<b>5 · Plan both sides.</b> Add helping forces and remove blocking ones.'];
  let s=1;
  L.h(L.kick('learn','Kurt Lewin’s force field analysis')+'<h1 class="q">Five steps, with a flip in the middle</h1><div id="lw-b"></div><p class="iv-cap" id="lw-c" aria-live="polite"></p><div class="iv-btns"><button class="btn pri" id="lw-n">Next step</button></div>');
  const b=ivBoard(L.$('#lw-b'),{help:IV_SW.help,hind:IV_SW.hind,goal:IV_SW.goal,stage:1,tray:false,note:false,ro:a=>a.stage<4?'<b>Forces shown: helping only</b>':'<b>Both sides now visible</b>'});
  L.$('#lw-c').innerHTML=CAP[0];
  L.$('#lw-n').onclick=()=>{if(s>=5)return;s++;b.setStage(s);L.$('#lw-c').innerHTML=CAP[s-1];
    if(s===5){L.$('#lw-n').remove();L.sheet('info','Lewin, 1930s','Psychologist Kurt Lewin called this '+L.g('force-field','force field analysis')+'. The book’s point: most people, however logical, stop after step 3. Removing obstacles can be just as powerful as adding pushes.');L.done();}};}},

{part:2,src:'Inversion · Guarantee a Life of Misery',pts:1,run(L){
  L.h(L.kick('try','Put it in order')+'<h1 class="q">Ira runs Lewin’s steps for getting the team to use the new system. Tap them in order.</h1>');
  L.order(L.card,['Name the problem: jobs still logged on paper','Set the objective: every job logged in the system','List what helps: the system, Pella’s backing','List what blocks it: fear of blame, the old spreadsheet','Plan: add helpers and remove blockers'],
   'That’s Lewin’s order. The flip sits between listing what helps and listing what blocks it. Skip step 4 and half the levers stay invisible.');}},

{part:2,src:'Inversion · Guarantee a Life of Misery',
 solve:async L=>{L.$('#fx .iv-fc[data-k="lead"]').click();L.$('#fx [data-a=flip]').click();L.$('#fx .iv-fc[data-k="sheet"]').click();},
 run(L){
  let fin=false;
  L.h(L.kick('learn','Explore · the force field board')+'<h1 class="q">Push the line toward the flag. Then flip, and look at the other side.</h1>'+
   '<p class="small" style="margin:0 0 6px">Add at least one helping force, flip to step 4, then remove at least one blocking force.</p><div id="fx"></div>');

    L.sheet('info','Two sides of one line','Every blocking force was pushing back the whole time; you just hadn’t looked. Removing a blocker moves the line as far as adding a helper of the same strength, and here it often takes less effort.');L.done();}});}},

{part:2,src:'Inversion · Guarantee a Life of Misery',pts:1,
 solve:async L=>{L.$('#pd-o').children[1].click();L.$('#pd-go').click();L.$('#pd-2').click();},
 run(L){
  let p=null,step=0,ok=false;const O=['Most of the way to the flag','A small step, still far from the flag','Past the flag'];
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">Pella’s fix: add a second training session. Fear of blame stays. Where will the line end up?</h1>'+
   '<div class="iv-chips" id="pd-o"></div><div id="pd-b"></div><div class="iv-btns"><button class="btn pri" id="pd-go" disabled>Add the training session</button><button class="btn" id="pd-2" hidden>Now remove fear of blame instead</button></div><div id="pd-x"></div>');
  O.forEach((t,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=t;b.onclick=()=>{if(step)return;p=j;[...L.$('#pd-o').children].forEach(x=>x.classList.toggle('sel',x===b));L.$('#pd-go').disabled=false;};L.$('#pd-o').appendChild(b);});
  const bd=ivBoard(L.$('#pd-b'),{help:IV_SW.help,hind:IV_SW.hind,goal:IV_SW.goal,tray:false,steps:false});
  L.$('#pd-go').onclick=()=>{if(step||p===null)return;step=1;ok=p===1;L.award(ok);bd.use('train',true);L.$('#pd-go').remove();L.$('#pd-2').hidden=false;
    L.$('#pd-x').innerHTML='<div class="iv-cn"><small>'+(ok?'You called it':'Not quite')+'</small>Training moved the line <b>1 of 8</b>, for effort 3. Fear of blame is still pushing back at full strength. Now try the other side.</div>';};
  L.$('#pd-2').onclick=()=>{if(step!==1)return;step=2;bd.use('fear',true);L.$('#pd-2').remove();
    L.sheet(ok?'ok':'no',ok?'A small step':'Only a small step','Adding training: +1 for effort 3. Removing fear of blame: +3 for effort 1 (illustrative). Lewin’s insight, as the book tells it: removing obstacles can be just as powerful as adding pushes, and most people never list the obstacles.');L.done();};}},

{part:2,src:'Inversion · Guarantee a Life of Misery',
 solve:async L=>{L.$('#ng-2').click();},
 run(L){
  let mode=0;
  const GR=[[186,80,4],[214,98,3],[256,76,5],[292,94,3.5],[198,146,5],[282,146,4],[236,104,3]];

   '<g class="iv-g" id="ng-ok"><rect x="84" y="140" width="40" height="10" rx="3" fill="var(--ok-strong)"/><text x="104" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ok)">2.5%</text></g>'+
   '<text x="44" y="166" text-anchor="middle" font-size="12.5" fill="var(--muted)">1854–55</text><text x="104" y="166" text-anchor="middle" font-size="12.5" fill="var(--muted)">1855–56</text><text x="74" y="180" text-anchor="middle" font-size="12.5" font-weight="600" fill="var(--ink)">Army death rate, winter</text>'+
   '<path d="M168 62L240 30 312 62Z" fill="var(--soft2)" stroke="var(--muted)" stroke-width="2" stroke-linejoin="round"/><path d="M240 40v14M233 47h14" stroke="var(--no-strong)" stroke-width="3"/>'+
   '<rect x="174" y="62" width="132" height="88" fill="var(--card)" stroke="var(--muted)" stroke-width="2"/>'+bed(180)+bed(224)+bed(268)+
   '<g class="iv-g" id="ng-gr">'+GR.map(g=>'<ellipse cx="'+g[0]+'" cy="'+g[1]+'" rx="'+g[2]+'" ry="'+(g[2]*.7)+'" fill="var(--no-strong)" opacity=".45"/>').join('')+'</g>'+
   '<g class="iv-g" id="ng-st"><g transform="rotate(-7 240 86)"><rect x="170" y="73" width="140" height="26" rx="6" fill="var(--no-bg)" stroke="var(--no-strong)" stroke-width="2"/><text x="240" y="91" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--no)">Avoid: poor sanitation</text></g></g>'+
   '<text x="240" y="174" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)" id="ng-l"></text></svg>'+
   '<p class="iv-ill" style="margin-top:0">Ward drawing illustrative; the two death rates are the book’s.</p>'+
   '<div class="iv-chips"><button class="chip sel" id="ng-1">How do we fix this?</button><button class="chip" id="ng-2">How do we stop it happening?</button></div><p class="iv-cap" id="ng-c" aria-live="polite"></p>');
  const draw=()=>{const p=mode===1;L.$('#ng-1').classList.toggle('sel',!p);L.$('#ng-2').classList.toggle('sel',p);

{part:2,src:'Inversion · Guarantee a Life of Misery',pts:1,
 solve:async L=>{for(const k of ['fear','sheet','lead','train'])L.$('#ch .iv-fc[data-k="'+k+'"]').click();L.$('#ch-go').click();},
 run(L){
  let fin=false;
  L.h(L.kick('pr','Challenge · plan both sides')+'<h1 class="q">Get the line to the flag with at most 4 cards, at least 2 of them removals.</h1><div id="ch"></div>'+
   '<div class="iv-btns"><button class="btn" id="ch-rs">Reset</button><button class="btn pri" id="ch-go">Check my plan</button></div>');
  const bd=ivBoard(L.$('#ch'),{help:IV_SW.help,hind:IV_SW.hind,goal:IV_SW.goal,steps:false,
   ro:a=>'<b>'+(a.pos>=a.goal?'Objective reached':'Line at '+a.pos+' of '+a.goal)+'</b> · cards '+a.used.length+' of 4 max · removals '+a.removals+' (need 2+) · effort '+a.effort});
  L.$('#ch-rs').onclick=()=>{if(!fin)bd.reset();};
  L.$('#ch-go').onclick=()=>{if(fin)return;fin=true;const ok=bd.pos>=8&&bd.used.length<=4&&bd.removals>=2;L.award(ok);
    const why=bd.pos<8?'The line stopped at '+bd.pos+' of 8. ':bd.used.length>4?'That took '+bd.used.length+' cards; the limit was 4. ':bd.removals<2?'Only '+bd.removals+' removal'+(bd.removals===1?'':'s')+'. ':'';
    L.sheet(ok?'ok':'no',ok?'Both sides worked':'Not this time',why+'Helping cards alone can’t get there: all four add up to just 5. Remove fear of blame (+3) and the old spreadsheet (+2), then add the floor lead (+2) and one more helper. That’s step 5: strengthen what helps and remove what blocks.');L.done();};}},

{part:3,src:'Course application · built on Inversion',pts:1,
 solve:async L=>{L.$('#mv [data-a=flip]').click();await L.sleep(320);for(const i of [0,1,3])L.$('#mv .chip[data-i="'+i+'"]').click();L.$('#mv [data-a=back]').click();await L.sleep(320);for(const i of [0,1,2])L.$('#mv .iv-rc .iv-fc[data-i="'+i+'"]').click();L.$('#mv-q').children[0].click();},
 run(L){
  const ST=['Flip it','List three','Avoid them','Add helpers'];let fin=false;
  const strip=n=>{L.$('#mv-st').innerHTML=ST.map((x,j)=>'<span class="'+(j<n?'on':'')+'">'+(j+1)+'<br>'+x+'</span>').join('');};
  L.h(L.kick('learn','How this course applies the book · one-minute move')+'<h1 class="q">The old car failed its inspection. Run the move on Ira’s car decision.</h1>'+
   L.note('How this course applies the book: a one-minute version of the book’s inversion, run on the flip road.','compass')+
   '<div class="iv-steps" id="mv-st"></div><div id="mv"></div><div id="mv-x"></div>');
  strip(0);
  ivRoad(L.$('#mv'),{goal:'Reliable car, savings intact',ways:[
    {t:'Pick finance with a high interest rate because the monthly payment looks low',s:'High interest',fix:'Compare the total cost, not the monthly payment',ok:1},
    {t:'Buy the extended warranty the dealer pushes without reading it',s:'Unread warranty',fix:'Read what the warranty covers before paying for it',ok:1},
    {t:'Get a second quote on the repair',ok:0,why:'That makes failure less likely. It’s a helping force: hold it for step 4.'},
    {t:'Empty the savings buffer to pay for the car',s:'Empty buffer',fix:'Set a price limit that leaves the savings buffer intact',ok:1}],
   onPhase(ph){strip({fwd:0,inv:1,pot:2,clear:3}[ph]);
    if(ph==='clear'){L.$('#mv-x').innerHTML='<h2 class="sub" style="margin:14px 0 6px">Step 4: now add a force that helps. Which one?</h2><div class="iv-chips col" id="mv-q"></div>';
     [['Get a second quote on the repair before choosing',1],['Choose the car with the lowest monthly payment',0],['Decide today, before the dealer’s offer ends',0]].forEach(q=>{const b=document.createElement('button');b.className='chip';b.textContent=q[0];
      b.onclick=()=>{if(fin)return;fin=true;strip(4);b.classList.add(q[1]?'ok':'no');L.award(!!q[1]);
       L.sheet(q[1]?'ok':'no',q[1]?'Both sides covered':'That walks back into a pothole',(q[1]?'':'The lowest monthly payment is the high-interest trap, and deciding under time pressure skips the checks. ')+'A second quote helps Ira compare repair against replace. That’s the whole move in about a minute: flip it, list three ways to fail, avoid them, then add what helps.');L.done();};L.$('#mv-q').appendChild(b);});}}});}},

{part:3,src:'Inversion · Conclusion',
 solve:async L=>{for(let j=0;j<3;j++){L.$('#lm-p').children[j].click();await L.sleep(250);}},
 run(L){
  const seen=new Set();let fin=false;
  const MONEY={goal:8,goalLabel:'Deposit saved',help:[{k:'pay',l:'Ira’s pay',s:2,on:1},{k:'rmy',l:'Remy’s pay',s:2,on:1},{k:'side',l:'Side job',s:1,e:3,add:'Ira takes weekend work'}],
   hind:[{k:'over',l:'Overspending',s:3,e:1,rm:'spend less than you earn'},{k:'debt',l:'High interest',s:3,e:2,rm:'avoid the high-interest car finance'},{k:'late',l:'Saving late',s:2,e:1,rm:'start an automatic transfer now'}]};
  const PRE=[
   ['Only forward',()=>[IV_SW,['train','lead','ref','mail']],'Every helping force added, nothing removed: the line stalls at 5 of 8. The book: most people stop after step 3, and the blockers keep pushing back.'],
   ['Only avoiding',()=>[IV_SW,['fear','sheet','busy','click']],'Every blocker removed, nothing added: 7 of 8, close but short. The book: avoiding the standard ways of failing raises the odds a lot. How this course applies it: higher odds aren’t a guarantee, so step 5 works both sides.'],
   ['Assume it’s already true',()=>[IV_SW,['fear','sheet','busy','lead']],'Approach 1: if the team already logged every job, what else would be true? No fear of blame, no old spreadsheet, a quiet week, a lead who uses it. The same forces, found from the other end, and the line reaches the flag.'],
   ['Money: the standard ways to fail',()=>[MONEY,['over','debt','late']],'Ira and Remy’s savings, with the book’s three pitfalls removed: 8 of 8, without any clever scheme. The book: building wealth has a lot to do with not losing money. Not financial advice; figures illustrative.']];
  L.h(L.kick('learn','Limits · where it stops')+'<h1 class="q">Push the board to the extremes</h1>'+
   '<p class="small" style="margin:0 0 6px">Tap at least three presets. Each sets up the board and shows what happens in that case.</p><div class="iv-chips" id="lm-p"></div><div id="lm-b"><div class="iv-cn"><small>Pick a preset</small>The board will set itself up.</div></div>');
  PRE.forEach((P,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=P[0];
    b.onclick=()=>{[...L.$('#lm-p').children].forEach(x=>x.classList.toggle('sel',x===b));const h=L.$('#lm-b');h.innerHTML='';
      const c=P[1](),bd=ivBoard(h,{help:c[0].help,hind:c[0].hind,goal:c[0].goal,goalLabel:c[0].goalLabel,tray:false,steps:false,lock:true});
      setTimeout(()=>{if(h.isConnected)c[1].forEach(k=>bd.use(k,true));},60);
      h.insertAdjacentHTML('beforeend','<div class="iv-cn"><small>What the board shows · '+P[0]+'</small>'+P[2]+'</div>');
      seen.add(j);if(seen.size>=3&&!fin){fin=true;L.sheet('info','Use both angles','The book: whatever angle you start from, follow up with the opposite one. Think about what would solve the problem and what would make it worse, then avoid the second.');L.done();}};
    L.$('#lm-p').appendChild(b);});}},

{part:3,src:'Inversion · Conclusion',pts:1,run(L){
  L.h(L.kick('pr','Know the limit')+'<h1 class="q">Ira’s team filled every pothole on the switchover road. Pella says: “So success is guaranteed.” What’s the best reply?</h1>');
  L.mc(L.card,['Not guaranteed. Avoiding the known failures raises our odds a lot; now let’s add what helps too.','Yes. Once the ways to fail are gone, success has to follow.','No. Inversion works for personal goals, not for work projects.'],0,
   'Right. The book says avoiding the standard ways of failing raises the odds of success a lot. This course’s caution: higher odds aren’t a guarantee. So Lewin’s step 5 works both sides: remove blockers and add helpers.',
   'The book: removing the standard failures raises the odds a lot. This course’s caution: that’s not a guarantee (the “only avoiding” preset stopped short of the flag). And the book uses inversion everywhere: maths, hospitals, money, a whole life.');}},

{part:3,src:'Course application · built on Inversion',
 solve:async L=>{for(const r of ['goal','many'])L.$('#wr [data-r="'+r+'"]').dispatchEvent(new MouseEvent('click',{bubbles:true}));},
 run(L){
  const R=[{k:'goal',t:'Goal, no clear path',s:'1st stop',c:'<b>A goal with no clear path:</b> inversion is the first stop, then first principles, then second-order. Ira’s sleep, the switchover, the deposit.'},
   {k:'quick',t:'Tempting quick fix',s:'2nd stop',c:'<b>A tempting quick fix:</b> second-order thinking first, then flip it. Low monthly car payments; skipping training to hit a date.'},
   {k:'bet',t:'Big, uncertain bet',s:'4th stop',c:'<b>A big, uncertain bet:</b> after thought experiment, probabilistic and second-order thinking, flip it; check your circle of competence last. The Fieldnote offer.'},
   {k:'usual',t:'Only usual ideas',s:'dead end',d:1,c:'<b>Dead end, only the usual ideas:</b> flip it, list what to avoid, then see which options are left. (First principles is the other way out.)'},
   {k:'many',t:'Too many choices',s:'dead end',d:1,c:'<b>Dead end, too many choices:</b> cross off any option that could guarantee failure. Then run the rest through a thought experiment.'}];
  const seen=new Set();let cur=null,fin=false;
  const draw=()=>{const many=cur==='many';
    let s='<svg class="iv-fig iv-wr" viewBox="0 0 336 222" role="img" aria-label="Five situations on the left all lead into one flow on the right: flip it, list three ways to fail, avoid or cross them off, add helpers">';
    R.forEach((r,j)=>{const y=4+j*44,cy=y+19,on=cur===r.k,col=r.d?'h1':'pri';
      s+='<path d="M150 '+cy+'C174 '+cy+' 172 26 198 26" fill="none" stroke="var(--'+(on?col:'line2')+')" stroke-width="'+(on?2.5:1.5)+'"'+(on?'':' stroke-dasharray="4 3"')+'/>'+
       '<g data-r="'+r.k+'" role="button" tabindex="0" aria-pressed="'+on+'" aria-label="'+r.t+', '+r.s+'"><rect x="2" y="'+y+'" width="148" height="38" rx="9" fill="var(--'+(on?col+'-bg':'card')+')" stroke="var(--'+(on?col:'line2')+')" stroke-width="'+(on?2:1.5)+'"'+(r.d&&!on?' stroke-dasharray="5 3"':'')+'/>'+
       '<text x="11" y="'+(y+16)+'" font-size="12.5" font-weight="700" fill="var(--ink)">'+r.t+'</text><text x="11" y="'+(y+31)+'" font-size="11.5" font-weight="600" fill="var(--'+(r.d?'h1':'muted')+')">'+r.s+'</text></g>';});
    const B=['Flip it','List three',many?'Cross them off':'Avoid them','Add helpers'];
    B.forEach((b,j)=>{const y=8+j*54,lit=!!cur;
      s+='<rect x="198" y="'+y+'" width="136" height="36" rx="9" fill="var(--'+(lit?(j===0?'h1-bg':'ok-bg'):'soft')+')" stroke="var(--'+(lit?(j===0?'h1':'ok-strong'):'line2')+')" stroke-width="1.8"/>'+
       '<text x="266" y="'+(y+23)+'" text-anchor="middle" font-size="12" font-weight="700" fill="var(--'+(lit?(j===0?'h1':'ok'):'muted')+')">'+(j+1)+' · '+b+'</text>';
      if(j<3)s+='<path d="M266 '+(y+38)+'V'+(y+51)+'M261 '+(y+46)+'l5 5 5-5" fill="none" stroke="var(--'+(lit?'ok-strong':'line2')+')" stroke-width="1.8"/>';});
    L.$('#wr').innerHTML=s+'</svg>';
    L.$('#wr-c').innerHTML=cur?R.find(r=>r.k===cur).c:'Tap at least two situations on the left to see where inversion fits.';
    L.$$('#wr [data-r]').forEach(g=>{const go=()=>pick(g.dataset.r);g.onclick=go;g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}};});};
  const pick=k=>{cur=k;seen.add(k);draw();if(!fin&&seen.size>=2){fin=true;L.done();}};
  L.h(L.kick('learn','How this course applies the book · when to flip')+'<h1 class="q">When to reach for inversion, and what to do when stuck</h1>'+
   '<div id="wr"></div><p class="iv-cap" id="wr-c" aria-live="polite"></p>'+
   '<div class="iv-stk"><div class="iv-cn"><small>Can’t name three?</small>Borrow the standard ones: how does this usually go wrong for others?</div><div class="iv-cn"><small>List too long?</small>Keep only what would sink it outright. Avoid those, then act.</div></div>'+
   L.note('How this course applies the book: the decision map and dead-end playbook, built on the book’s two ways to invert.','compass'));
  draw();}},

{part:3,src:'Course application · built on Inversion',
 solve:async L=>{L.$('#yt-d').children[0].click();L.$('#yt [data-a=flip]').click();await L.sleep(320);L.$('#yt [data-a=back]').click();await L.sleep(320);},
 run(L){
  const PH={'Sleep better':['Coffee after 3 p.m.','Phone in bed','Late heavy dinner'],'Save money':['Spend more than I earn','High-interest debt','Start saving later'],'Finish a work project':['No one owns it','Start in the busiest week','Skip the check-ins'],'Get fitter':['Plan 5 a.m. sessions I hate','Go all-out, then quit','Skip sleep to train'],'Something else':['','','']};
  let g=null,fin=false;
  L.h(L.kick('try','Your turn · ungraded')+'<h1 class="q">Invert one of your own goals</h1>'+
   L.note('How this course applies the book: the flip-the-road move, used on your week.','compass')+
   '<p class="small" style="margin:0 0 4px">1. Pick a goal for this week.</p><div class="iv-chips" id="yt-d"></div><p class="small" style="margin:6px 0 4px">2. Flip the road and write what would guarantee failure.</p><div id="yt"></div><div id="yt-x"></div>');
  const rd=ivRoad(L.$('#yt'),{goal:'',free:true,canFlip:()=>!!g,get ph(){return g?PH[g]:[];},
   onPhase(ph){if(ph==='pot'&&!fin){fin=true;L.$('#yt-x').innerHTML='<div class="iv-cn"><small>Your next step</small>Pick one pothole and fill it this week. Then add one force that helps. If it’s a big, hard-to-undo goal, write the list in your decision journal.</div><textarea class="iv-ta" aria-label="Your note" placeholder="Optional: the one pothole you’ll fill first. It stays on this screen."></textarea>';L.done();}}});
  Object.keys(PH).forEach(x=>{const b=document.createElement('button');b.className='chip';b.textContent=x;b.onclick=()=>{if(rd.phase!=='fwd')return;g=x;[...L.$('#yt-d').children].forEach(y=>y.classList.toggle('sel',y===b));rd.setGoal(x);};L.$('#yt-d').appendChild(b);});}}
