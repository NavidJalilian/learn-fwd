function hnRoad(L,host,o){
  const w=document.createElement('div');host.appendChild(w);let sc=null,key=null,sy=null;
  w.innerHTML=(o.scenes.length>1?'<div class="hn-ctl hn-scn"></div>':'')+
   '<svg class="hn-svg" viewBox="0 0 320 260" role="img" aria-label="The event on the left; on the right, a stack with one block for every step the chosen story needs"><rect width="320" height="260" rx="16" fill="var(--soft)"/><g class="hn-scg"></g>'+
   '<text x="231" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="var(--muted)">EFFORT IT TAKES</text><text class="hn-cnt" x="231" y="46" text-anchor="middle" font-size="20" font-weight="700" fill="var(--ink)">?</text>'+
   '<g class="hn-stk"></g><path d="M150 247H312" stroke="var(--line2)" stroke-width="2.5" stroke-linecap="round"/></svg>'+
   '<p class="hn-ro" aria-live="polite"></p><div class="hn-ctl hn-sty"></div>';
  const $=q=>w.querySelector(q);
  if(o.scenes.length>1)o.scenes.forEach(k=>{const b=document.createElement('button');b.className='chip';b.dataset.k=k;b.textContent=HN_SC[k].lab;b.onclick=()=>api.setScene(k);$('.hn-scn').appendChild(b);});
  const api={
    get key(){return key;},get story(){return sy;},
    setScene(k){key=k;sc=HN_SC[k];sy=null;$('.hn-scg').innerHTML=sc.svg;$('.hn-stk').innerHTML='';$('.hn-cnt').textContent='?';
      $('.hn-ro').innerHTML='Pick a story. What would it take?';
      w.querySelectorAll('.hn-scn .chip').forEach(b=>b.classList.toggle('sel',b.dataset.k===k));
      const row=$('.hn-sty');row.innerHTML='<span class="hn-lab">Which story?</span>';
      ['mis','mal'].forEach(m=>{const b=document.createElement('button');b.className='chip';b.dataset.s=m;b.innerHTML=L.ic(m==='mal'?'alert':'eye')+sc[m].lab;b.onclick=()=>api.setStory(m);row.appendChild(b);});
      if(o.onChange)o.onChange('scene',api);},
    setStory(m){sy=m;const st=sc[m],n=st.blocks.length,col=m==='mal'?['var(--no-bg)',HN_NO]:['var(--h2-bg)',HN_MI];

      w.querySelectorAll('.hn-an').forEach(a=>a.classList.toggle('on',st.blocks.some(b=>b[1]===a.dataset.an)));
      const car=$('.hn-car');if(car){car.style.transition='none';car.style.transform='none';car.getBoundingClientRect();car.style.transition='';car.style.transform='translate(59px,-22px)';}
      $('.hn-cnt').textContent=n+(n>1?' steps':' step');
      $('.hn-ro').innerHTML='<b>'+st.lab+'</b> needs <b>'+n+(n>1?' steps':' step')+'</b>. '+(m==='mal'?'Each one is deliberate work.':'One ordinary slip, no intent.');
      w.querySelectorAll('.hn-sty .chip').forEach(b=>b.classList.toggle('sel',b.dataset.s===m));
      if(o.onChange)o.onChange('story',api);}};
  api.setScene(o.scenes[0]);return api;}

   '<circle cx="216" cy="177" r="6" fill="var(--h2-bg)" stroke="var(--h2)" stroke-width="1.5"/><circle cx="206" cy="187" r="3.5" fill="var(--h2-bg)" stroke="var(--h2)" stroke-width="1.5"/>'+
   '<rect x="20" y="194" width="280" height="44" rx="10" fill="var(--card)" stroke="var(--line2)" stroke-width="1.5"/><text class="ev" text-anchor="middle" font-size="12.5" fill="var(--ink)"></text>'+
   '</svg><div class="hn-sts"><span class="a"></span><span class="b"></span></div><p class="hn-ro" aria-live="polite"></p><div class="hn-opw"></div>';
  const $=q=>w.querySelector(q);
  if(o.small)w.querySelector('svg').style.maxWidth='250px';
  if(o.optsTop){const ow=$('.hn-opw');ow.style.margin='0 0 8px';w.insertBefore(ow,w.firstChild);}
  function draw(){
    const over=s.mal>=HN_T;
    $('.cm').setAttribute('r',hnR(s.mal));$('.cs').setAttribute('r',hnR(s.mis));
    $('.fl').setAttribute('r',s.feel>0?Math.min(76,13+8.5*(s.mal+s.feel)):0);
    $('.cm').setAttribute('fill',over?'var(--no-strong)':'var(--no-bg)');
    $('.fmw').innerHTML=hnFaceMal(88,98,over?'var(--card)':'var(--no)');
    $('.cm').setAttribute('stroke-width',s.assume==='mal'?5:2.5);$('.cs').setAttribute('stroke-width',s.assume==='mis'?5:2.5);
    $('.th').setAttribute('opacity',s.ring?1:0);$('.th text').setAttribute('opacity',over?0:1);$('.th circle').setAttribute('stroke',over?'var(--card)':'var(--ink)');
    const ev=s.event.split('|');$('.ev').innerHTML=hnLines(s.event,160,ev.length>1?212:220,16);
    $('.a').innerHTML=s.a;$('.b').innerHTML=s.b;
    $('.hn-ro').innerHTML=(s.note?s.note+'<br>':'')+'Evidence <span style="font-size:12px">(illustrative)</span>: meant it <b>'+hnF(s.mal)+'</b> · mistake <b>'+hnF(s.mis)+'</b>'+(s.feel>0?' · <i>feels like</i> <b>'+hnF(s.mal+s.feel)+'</b>':'')+(s.ring&&over?'<br><b style="color:var(--no)">Overwhelming evidence of intent: update.</b>':'')+(s.ring?'<br><span style="font-size:12px">Dotted ring: a teaching device for “overwhelming”, not a number from the book.</span>':'');
    if(s.options){const vis=s.options.filter(p=>s.assume!=='mal'||p[1]==='def').length;
      $('.hn-opw').innerHTML='<span class="hn-lab">'+(s.assume?'Options Ira can see: '+vis+' of '+s.options.length:'Ira’s options')+'</span><div class="hn-ops">'+
        s.options.map(p=>s.assume==='mal'&&p[1]!=='def'?'<span class="hn-op hid">?</span>':'<span class="hn-op '+(s.assume?p[1]:'')+'">'+p[0]+'</span>').join('')+'</div>';}
  }
  const api={s,wrap:w,draw,set(p){Object.assign(s,p);draw();},drop(c){s.mis+=c[1]||0;s.mal+=c[2]||0;s.feel+=c[3]||0;draw();},assume(m){s.assume=m;draw();},get over(){return s.mal>=HN_T;}};
  draw();return api;}

const HN_M={map:'Map',circle:'Circle',first:'First principles',thought:'Thought exp.',second:'Second-order',prob:'Probabilistic',inv:'Inversion',occam:'Occam',hanlon:'Hanlon'};
const HN_ROWS=[['Why did this happen?',['occam','prob','map']],['Someone upset me',['hanlon','map','second']],['Outside my expertise',['circle','map','first']],['A tempting quick fix',['second','inv']],['A goal, no clear path',['inv','first','second']],['A big, uncertain bet',['thought','prob','second','inv','circle']],['“That’s how it’s done”',['first','thought']]];

Course.lesson({
  id:'0010', title:'Hanlon’s razor', minutes:19, icon:'people',
  goals:['Catch yourself reading malice into a mistake, and see why the story with the least intent is usually the right one',
         'Explain how vivid details and assuming malice mislead you, and what that costs you in options',
         'Run the one-minute move on everyday annoyances, and know when the evidence is overwhelming enough to update'],
  parts:['One event, two stories','Why malice feels likely','What it costs','Use it this week'],
  read:'Read the book’s Hanlon’s Razor chapter for the full stories of Honorius and Stilicho and of Vasili Arkhipov, and for the Devil Fallacy sidebar.',
  glossary:{
   'conjunction-fallacy':'Conjunction fallacy: judging a story with more parts as more likely than one of its parts alone. Every extra detail must also be true, so it can only make a story less likely.',
   'devil-fallacy':'Devil fallacy: blaming villains for problems that really come from mistakes, not knowing, or people boxed in by their circumstances.'
  },
  cheatsheet:[
   '<b>Hanlon’s razor</b>: don’t blame malice for what a mistake or not knowing explains more easily (the book’s word is “stupidity”). The story with the <b>least intent</b> is the likeliest.',
   '<b>Malice takes effort.</b> To cut you off on purpose, a driver must notice you, judge your speed, guess your route, time the swerve and avoid a crash. Not seeing you takes one slip.',
   '<b>Vivid details fool us</b> (the Linda problem, the conjunction fallacy). Every extra detail must also be true, so it can only make a story less likely.',
   'Assuming ill will makes you the <b>star of everyone’s story</b> and in defensive mode, which hides your options. Honorius assumed a plot; Arkhipov assumed a mistake.',
   '<b>Devil fallacy</b>: blaming villains for what comes from mistakes, or from people boxed in by necessity.',
   'One-minute move (how this course applies the book): <b>pause</b> → list the no-ill-intent stories (didn’t see, didn’t know, forgot, rushed) → <b>how much effort would malice take?</b> → respond as if it was a mistake: ask, don’t accuse.',
   'Limits: real malice exists. Don’t overthink it. Assume good faith <b>unless the evidence is overwhelming</b>; when it piles up, update.'
  ],
  steps:[
/* ---------- PART 1: ONE EVENT, TWO STORIES ---------- */
{part:0,src:'Warm-up',pts:1,run(L){

   'Most people agree once they’ve calmed down. In the moment, though, it feels personal. This lesson is about that gap, and what to do with it.',
   'It can feel that way with your heart pounding. But think about what “on purpose” would take. The next screens show why the plainer story usually wins.');}},

{part:0,src:'Hanlon’s Razor · opening',

 run(L){
  L.h(L.kick('learn','Explore · the effort road')+'<h1 class="q">The car cuts in. Switch between the two stories and watch the stack.</h1>'+

{part:0,src:'Hanlon’s Razor · opening',pts:1,
 solve:async L=>{for(const b of L.$$('#sp .chip')){b.click();L.$('#sc-'+b.dataset.c).click();}},
 run(L){
  L.h(L.kick('try','Build both stacks')+'<h1 class="q">The rent is due today. Remy hasn’t sent their half. Put each block on the story that needs it.</h1>'+
   '<div class="hn-cols"><button class="hn-col mal" id="sc-mal" data-c="mal"><span class="h" style="color:var(--no)">Remy did it on purpose<small>0 steps</small></span><span class="s"></span></button>'+
   '<button class="hn-col mis" id="sc-mis" data-c="mis"><span class="h" style="color:var(--h2)">Remy forgot<small>0 steps</small></span><span class="s"></span></button></div>'+
   '<span class="hn-lab">Tap a block, then tap a stack</span><div class="hn-pool" id="sp"></div><div id="sf"></div>');
  const B=[['Remember it’s due today','mal'],['Exam-marking week: it slipped Remy’s mind','mis'],['Decide to leave Ira short','mal'],['Act as if they forgot','mal'],['Hide it until Ira notices','mal']];
  let held=null,err=false,left=B.length;const cnt={mal:0,mis:0};
  B.forEach(b=>{const c=document.createElement('button');c.className='chip';c.textContent=b[0];c.dataset.c=b[1];
    c.onclick=()=>{held=c;L.$$('#sp .chip').forEach(x=>x.classList.toggle('sel',x===c));L.$$('.hn-col').forEach(x=>x.classList.add('tgt'));};L.$('#sp').appendChild(c);});
  L.$$('.hn-col').forEach(col=>col.onclick=()=>{if(!held)return;const c=held,k=col.dataset.c;L.$('#sf').innerHTML='';
    if(c.dataset.c!==k){err=true;L.shake(c);L.fb(L.$('#sf'),k==='mal'?'That block is an ordinary slip. It needs no intent at all, so it belongs on “Remy forgot”.':'Forgetting doesn’t need that. Only a deliberate plan does: it belongs on “on purpose”.','no');return;}
    const sp=document.createElement('span');sp.textContent=c.textContent;col.querySelector('.s').appendChild(sp);c.remove();held=null;cnt[k]++;left--;
    col.querySelector('small').textContent=cnt[k]+(cnt[k]===1?' step':' steps');L.$$('.hn-col').forEach(x=>x.classList.remove('tgt'));
    if(!left){L.award(!err);L.sheet(err?'info':'ok','Four steps against one','“On purpose” needs Remy to remember, decide, pretend and hide it. “Forgot” needs one busy week. So Ira’s first move is a friendly reminder, not an accusation. If Remy really meant it, the reminder will show that too.');L.done();}});}},

{part:1,src:'Hanlon’s Razor · opening',pts:1,

 run(L){

  let a=false;
  ['Linda is a bank teller.','Linda is a bank teller and active in the feminist movement.'].forEach((t,j)=>{const b=document.createElement('button');b.className='opt';b.innerHTML='<span class="key">'+(j+1)+'</span><span>'+t+'</span>';

       '<rect width="320" height="128" rx="14" fill="var(--soft)"/>'+Array.from({length:12},(_,k)=>fig(k)).join('')+
       '<path d="M212 66v6h104v-6" fill="none" stroke="var(--pri)" stroke-width="2"/><text x="314" y="86" text-anchor="end" font-size="11" font-weight="700" fill="var(--pri)">Option 2: these 4</text>'+
       '<path d="M14 96v6h302v-6" fill="none" stroke="var(--h3)" stroke-width="2"/><text x="165" y="118" text-anchor="middle" font-size="11" font-weight="700" fill="var(--h3)">Option 1: all 12 bank tellers (illustrative)</text></svg>';
      L.sheet(ok?'ok':'no',ok?'Right: one condition beats two':'Most people pick 2. It can’t be likelier.','Anyone who is a feminist bank teller is, by definition, a bank teller, so option 2 can never beat option 1. In Kahneman and Tversky’s 1982 test, most people chose 2 anyway: vivid wording made the detail feel true. They called it the '+L.g('conjunction-fallacy','conjunction fallacy')+'. Critics said the wording set people up, which was exactly their point.');L.done();};L.$('#lo').appendChild(b);});}},

{part:1,src:'Hanlon’s Razor · opening',

{part:1,src:'Hanlon’s Razor · opening',

 run(L){

   P.map(p=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="22" fill="var(--card)" stroke="var(--line2)" stroke-width="2"/><text x="'+p[0]+'" y="'+(p[1]+5)+'" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink)">'+p[2]+'</text><text x="'+(p[0]+(p[0]<160?-30:30))+'" y="'+(p[1]+4)+'" text-anchor="'+(p[0]<160?'end':'start')+'" font-size="11" fill="var(--muted)">'+p[3]+'</text>').join('')+

{part:1,src:'Hanlon’s Razor · Conclusion',pts:1,
 solve:async L=>{L.$('#po').children[1].click();},
 run(L){
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">New card: Bram promised another rush job without checking, again. Which bubble grows?</h1><div id="pb"></div><div class="opts" id="po"></div>');
  const bub=hnBub(L,L.$('#pb'),{mis:3,mal:1,event:'Bram promises rush jobs|without checking the floor.',story:'“Bram means to hurt Ira”',misStory:'“Bram doesn’t check”'});
  let a=false;
  ['“Meant it” grows','“Mistake / didn’t know” grows','Neither: it’s just a vivid detail'].forEach((t,j)=>{const b=document.createElement('button');b.className='opt';b.innerHTML='<span class="key">'+(j+1)+'</span><span>'+t+'</span>';
    b.onclick=()=>{if(a)return;a=true;const ok=j===1;b.classList.add(ok?'ok':'no');if(!ok)L.$('#po').children[1].classList.add('ok');L.award(ok);
      bub.drop([0,1.6,0,1.2]);bub.set({note:'Card dropped: <b>“again, still unchecked”</b>'});
      L.sheet(ok?'ok':'no',ok?'The mistake bubble grows':'Watch the solid bubbles','Not checking, again, is what a habit looks like: no rule, no view of the floor, a happy client right now. The book lists exactly these: people act on incomplete information and chase short-term wins. The “meant it” halo puffed up because repeats <i>feel</i> personal, but nothing here shows intent. Nobody has told Bram the floor is full.');L.done();};L.$('#po').appendChild(b);});}},

/* ---------- PART 3: WHAT IT COSTS ---------- */
{part:2,src:'Hanlon’s Razor · The End of an Empire',
 solve:async L=>{L.$('#oa1').click();L.$('#oa0').click();},
 run(L){
  L.h(L.kick('learn','Defensive mode hides options')+'<h1 class="q">Pella asks Ira why the schedule slipped. Flip what Ira assumes about Bram and watch the options strip.</h1>'+
   '<div class="hn-ctl"><span class="hn-lab">Ira assumes</span><button class="chip" id="oa0">'+L.ic('alert')+'Bram meant it</button><button class="chip" id="oa1">'+L.ic('eye')+'Bram didn’t know</button></div><div id="ocap"></div><div id="ob"></div>');
  const bub=hnBub(L,L.$('#ob'),{optsTop:true,mis:3.5,mal:1,event:'Bram promised a rush job.|Pella asks Ira why the schedule slipped.',
    options:[['Defend: prove it was Bram’s fault','def'],['Attack: complain about Bram','def'],['Ask Bram what the client was told','open'],['Let sales see the floor schedule','open'],['Agree a rush-job rule with Bram and Pella','open']]});
  const seen=new Set();let fin=false;
  [['oa0','mal'],['oa1','mis']].forEach(p=>L.$('#'+p[0]).onclick=()=>{bub.assume(p[1]);L.$('#oa0').classList.toggle('sel',p[1]==='mal');L.$('#oa1').classList.toggle('sel',p[1]==='mis');seen.add(p[1]);
    L.$('#ocap').innerHTML=p[1]==='mal'?'<p class="small">Under threat, Ira sees only two moves: defend or attack.</p>':'<p class="small">Same facts. Now the three moves that actually fix the slip appear.</p>';
    if(!fin&&seen.size===2){fin=true;L.sheet('info','Threat narrows your view','The book: once we believe someone is targeting us, we instinctively go on guard. In that mode it’s harder to see, let alone use, opportunities. The razor gives more realistic and effective options for fixing a bad situation.');L.done();}});}},

{part:2,src:'Hanlon’s Razor · The End of an Empire',
 solve:async L=>{for(let k=0;k<3;k++)L.$('#hnx').click();},
 run(L){
  const X=[40,126,212,284],T=['Loyal','Advice','408 AD','410 AD'];
  const CAP=['Stilicho was Rome’s best general: many campaigns won, loyal to the empire. Like anyone, some of his calls turned out badly.',
   'Alaric, leader of the Visigoths, kept attacking Rome. The Senate wanted to fight. Stilicho advised giving in to Alaric’s demands, perhaps hoping to win him as an ally. His reputation suffered.',
   'Emperor Honorius gave him no benefit of the doubt. He assumed Stilicho was after the throne and ordered his arrest. Stilicho was executed in 408 AD.',
   'Without Stilicho, dealings with the Visigoths fell apart. Alaric sacked Rome in 410 AD, the first invader to take the city in nearly eight centuries. Some historians see this as a key factor in the Western Empire’s collapse.'];
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">The end of an empire: what one assumption of malice cost</h1>'+
   '<svg class="hn-svg" viewBox="0 0 320 196" role="img" aria-label="Timeline of Stilicho and Honorius, 408 to 410 AD">'+
   '<rect width="320" height="196" rx="16" fill="var(--soft)"/><path d="M28 56H296" stroke="var(--line2)" stroke-width="3" stroke-linecap="round"/>'+
   X.map((x,k)=>'<g class="hnt" data-k="'+k+'"><circle cx="'+x+'" cy="56" r="8" fill="var(--card)" stroke="var(--line2)" stroke-width="2.5"/><text x="'+x+'" y="34" text-anchor="middle" font-size="11" font-weight="700" fill="var(--muted)">'+T[k]+'</text></g>').join('')+
   '<g class="hnb hn-fade" data-k="0"><path d="M138 78H182V108Q182 132 160 142Q138 132 138 108Z" fill="var(--h2-bg)" stroke="var(--h2)" stroke-width="2.5"/><path d="M150 108 158 116 171 98" fill="none" stroke="var(--h2)" stroke-width="3" stroke-linecap="round"/><text x="160" y="166" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">Stilicho, general</text><text x="160" y="182" text-anchor="middle" font-size="11" fill="var(--muted)">many wins · loyal</text></g>'+
   '<g class="hnb hn-fade" data-k="1" opacity="0"><rect x="18" y="86" width="126" height="40" rx="12" fill="var(--card)" stroke="var(--line2)"/><text x="81" y="111" text-anchor="middle" font-size="12" fill="var(--ink)">Senate: “Fight!”</text>'+
   '<rect x="176" y="86" width="126" height="40" rx="12" fill="var(--h2-bg)" stroke="var(--h2)"/><text x="239" y="111" text-anchor="middle" font-size="12" fill="var(--ink)">Stilicho: “Give in”</text>'+
   '<text x="160" y="160" text-anchor="middle" font-size="12" fill="var(--muted)">Alaric’s Visigoths keep attacking</text></g>'+
   '<g class="hnb hn-fade" data-k="2" opacity="0"><circle cx="104" cy="120" r="44" fill="var(--no-bg)" stroke="var(--no-strong)" stroke-width="2.5"/><text text-anchor="middle" font-size="12" font-weight="700" fill="var(--no)">'+hnLines('“He wants|my throne”',104,116,15)+'</text>'+
   '<circle cx="232" cy="120" r="36" fill="var(--h2-bg)" stroke="var(--h2)" stroke-width="2" stroke-dasharray="5 4" opacity=".55"/><text text-anchor="middle" font-size="11" fill="var(--h2)" opacity=".8">'+hnLines('Hoping for|an ally?',232,116,14)+'</text>'+
   '<text x="104" y="182" text-anchor="middle" font-size="11" font-weight="700" fill="var(--muted)">Honorius assumes</text><text x="232" y="174" text-anchor="middle" font-size="11" fill="var(--muted)">never weighed</text></g>'+
   '<g class="hnb hn-fade" data-k="3" opacity="0"><rect x="120" y="84" width="22" height="70" fill="var(--soft2)" stroke="var(--ink)" stroke-width="1.5"/><path d="M164 154V112L172 104 180 116V154Z" fill="var(--soft2)" stroke="var(--ink)" stroke-width="1.5"/><path d="M114 84H148M114 154H186" stroke="var(--ink)" stroke-width="2"/>'+
   '<path d="M192 150 206 146 214 152 200 156Z" fill="var(--soft2)" stroke="var(--ink)"/><text x="160" y="178" text-anchor="middle" font-size="12" font-weight="700" fill="var(--no)">Rome sacked, 410 AD</text></g>'+
   '</svg><p class="hn-cap" id="hcap"></p><div class="hn-ctl"><button class="btn pri" id="hnx">'+L.ic('arrow')+'Next</button></div>');
  let k=0;const show=()=>{L.$$('.hnb').forEach(g=>g.setAttribute('opacity',+g.dataset.k===k?1:0));
    L.$$('.hnt circle').forEach((c,j)=>{c.setAttribute('fill',j<=k?(j===2?'var(--no-strong)':'var(--h2)'):'var(--card)');});L.$('#hcap').textContent=CAP[k];};show();
  L.$('#hnx').onclick=()=>{if(k>=3)return;k++;show();if(k===3){L.$('#hnx').hidden=true;L.sheet('info','No benefit of the doubt','One debatable decision was read as a plot. Removing the loyal general who handled Alaric left Rome exposed. Giving Stilicho the benefit of the doubt would have kept that option open.');L.done();}};}},

{part:2,src:'Hanlon’s Razor · The Man Who Saved the World',
 solve:async L=>{L.$('#ak1').click();},
 run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">27 October 1962. Depth charges explode above Soviet sub B-59. You are Arkhipov. What do you assume?</h1>'+
   '<svg class="hn-svg" viewBox="0 0 320 236" role="img" aria-label="Submarine B-59 under exploding depth charges; launch needs all three senior officers">'+
   '<rect width="320" height="236" rx="16" fill="var(--soft)"/><rect x="0" y="46" width="320" height="190" fill="var(--h2-bg)"/><path d="M0 46Q20 40 40 46T80 46T120 46T160 46T200 46T240 46T280 46T320 46" fill="none" stroke="var(--h2)" stroke-width="2"/>'+
   '<path d="M40 38H96L88 46H48Z M224 38H280L272 46H232Z" fill="var(--muted)"/><rect x="60" y="30" width="14" height="8" fill="var(--muted)"/><rect x="244" y="30" width="14" height="8" fill="var(--muted)"/>'+
   '<g id="akb" class="hn-fade">'+[[96,78],[168,70],[236,84]].map(p=>'<circle class="hn-burst" cx="'+p[0]+'" cy="'+p[1]+'" r="9" fill="var(--h3)"/>').join('')+'</g>'+
   '<g class="hn-sub" id="aks"><ellipse cx="160" cy="164" rx="130" ry="34" fill="var(--soft2)" stroke="var(--ink)" stroke-width="2"/><rect x="138" y="118" width="44" height="24" rx="6" fill="var(--soft2)" stroke="var(--ink)" stroke-width="2"/><text x="160" y="135" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">B-59</text>'+
   [[86,'Captain','var(--no-bg)','var(--no-strong)','yes'],[148,'Officer','var(--card)','var(--line2)',''],[210,'Arkhipov','var(--pri-bg)','var(--pri)','?']].map((o,j)=>'<circle id="ako'+j+'" cx="'+o[0]+'" cy="160" r="13" fill="'+o[2]+'" stroke="'+o[3]+'" stroke-width="2"/><text id="akt'+j+'" x="'+o[0]+'" y="164" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">'+o[4]+'</text><text x="'+o[0]+'" y="188" text-anchor="middle" font-size="11" fill="var(--muted)">'+o[1]+'</text>').join('')+
   '<circle id="akl" cx="258" cy="160" r="9" fill="var(--line2)"/><text id="aklt" x="258" y="140" text-anchor="middle" font-size="11" font-weight="700" fill="var(--muted)">LAUNCH</text></g>'+
   '</svg><p class="small" style="text-align:center;margin:4px 0">Firing the nuclear torpedo needs <b>all three</b> senior officers to agree. The captain wants to.</p>'+
   '<div class="hn-ctl" id="akc"><button class="btn" id="ak0">'+L.ic('alert')+'Agree: it’s an attack</button><button class="btn pri" id="ak1">'+L.ic('eye')+'Refuse: could be a mistake</button></div><div id="akcap"></div>');
  const end=agree=>{L.$('#akc').hidden=true;
    L.$('#ako2').setAttribute('fill',agree?'var(--no-bg)':'var(--h2-bg)');L.$('#akt2').textContent=agree?'yes':'no';
    if(agree){L.$('#akl').setAttribute('fill','var(--no-strong)');L.$('#aklt').textContent='ARMED?';}
    else{L.$('#akl').setAttribute('fill','var(--h2)');L.$('#aklt').textContent='BLOCKED';L.$('#aks').style.transform='translateY(-74px)';L.$('#akb').setAttribute('opacity',0);}
    L.$('#akcap').innerHTML=L.prose((agree?'Had all three agreed, a nuclear torpedo would have been fired, with fallout for decades. <b>The real Arkhipov refused.</b> ':'That’s what Arkhipov did. ')+
     'The Americans had told Moscow they’d drop practice charges to force subs up, but HQ never passed it on. Arkhipov kept his head and argued for coming up to radio Moscow.');
    L.sheet('info','The man who saved the world','Assuming attack would have put billions of lives at risk; assuming a mistake cost a surfacing. B-59 went home, and the world only learned how close it came when the records were declassified about forty years later.');L.done();};
  L.$('#ak0').onclick=()=>end(true);L.$('#ak1').onclick=()=>end(false);}},

{part:2,src:'Hanlon’s Razor · The Devil Fallacy',
 solve:async L=>{L.$('#dv1').click();},
 run(L){
  const PPL=[124,160,196];
  L.h(L.kick('learn','Sidebar · the devil fallacy')+'<h1 class="q">Ira sometimes thinks “sales are out to wreck production”. Look closer at the sales team.</h1>'+
   '<svg class="hn-svg" viewBox="0 0 320 214" role="img" aria-label="The sales team drawn with devil horns, then with the constraints around them">'+
   '<rect width="320" height="214" rx="16" fill="var(--soft)"/><rect x="90" y="64" width="140" height="92" rx="14" fill="var(--soft2)" stroke="var(--line2)" stroke-width="1.5"/>'+
   '<text x="160" y="82" text-anchor="middle" font-size="11" font-weight="700" fill="var(--muted)">SALES TEAM</text>'+
   PPL.map(x=>'<circle cx="'+x+'" cy="106" r="9" fill="var(--h3)"/><path d="M'+(x-14)+' 146c1-15 7-22 14-22s13 7 14 22Z" fill="var(--h3)"/>').join('')+
   '<g id="dvd" class="hn-fade">'+PPL.map(x=>'<path d="M'+(x-8)+' 99 '+(x-11)+' 88 '+(x-3)+' 97ZM'+(x+8)+' 99 '+(x+11)+' 88 '+(x+3)+' 97Z" fill="var(--no-strong)"/>').join('')+
   '<rect x="90" y="64" width="140" height="92" rx="14" fill="var(--no-strong)" opacity=".12"/><text x="160" y="186" text-anchor="middle" font-size="12" font-weight="700" fill="var(--no)">“Out to wreck production”</text></g>'+
   '<g id="dvc" class="hn-fade" opacity="0">'+
   '<rect x="6" y="20" width="98" height="38" rx="9" fill="var(--h2-bg)" stroke="var(--h2)"/><text text-anchor="middle" font-size="11" fill="var(--ink)">'+hnLines('Clients push|for speed',55,35,14)+'</text><path d="M70 58 96 72" stroke="var(--h2)" stroke-width="2"/>'+
   '<rect x="216" y="20" width="98" height="38" rx="9" fill="var(--h2-bg)" stroke="var(--h2)"/><text text-anchor="middle" font-size="11" fill="var(--ink)">'+hnLines('Targets to hit|this quarter',265,35,14)+'</text><path d="M250 58 224 72" stroke="var(--h2)" stroke-width="2"/>'+
   '<rect x="66" y="170" width="188" height="36" rx="9" fill="var(--h2-bg)" stroke="var(--h2)"/><text text-anchor="middle" font-size="11" fill="var(--ink)">'+hnLines('No view of the floor’s|schedule',160,185,14)+'</text><path d="M160 170V158" stroke="var(--h2)" stroke-width="2"/></g>'+
   '</svg><div class="hn-ctl"><button class="chip sel" id="dv0">'+L.ic('flame')+'Devil view</button><button class="chip" id="dv1">'+L.ic('eye')+'Look closer</button></div><div id="dcap"></div>');
  const set=v=>{L.$('#dv0').classList.toggle('sel',!v);L.$('#dv1').classList.toggle('sel',v);L.$('#dvd').setAttribute('opacity',v?0:1);L.$('#dvc').setAttribute('opacity',v?1:0);
    if(v){L.$('#dcap').innerHTML=L.prose('No villains: people boxed in by pressures, doing their best.')+'<p class="small">In Robert Heinlein’s 1941 story “Logic of Empire”, a character calls this the '+L.g('devil-fallacy','“devil” theory')+': blaming villainy for what comes from stupidity. People are constrained by necessity, then explain their acts afterwards. Hanlon’s razor is the cure.</p>';L.done();}
    else L.$('#dcap').innerHTML='';};
  L.$('#dv0').onclick=()=>set(false);L.$('#dv1').onclick=()=>set(true);}},

{part:2,src:'Hanlon’s Razor · Conclusion',pts:1,run(L){
  const Q=['Shop window decals','Menu cards','Flyers × 2,000','URGENT banner'];
  L.h(L.kick('try','Try it')+'<h1 class="q">At 4 p.m. Ira finds the urgent banner job moved to the back of the print queue by the production floor lead. What would Hanlon’s razor have Ira do first?</h1>'+
   '<svg class="hn-svg" viewBox="0 0 320 174" role="img" aria-label="The print queue at 4 p.m.: the urgent banner has moved from first place to last. The floor lead stands beside it; why is unknown.">'+
   '<rect width="320" height="174" rx="16" fill="var(--soft)"/><rect x="14" y="12" width="190" height="152" rx="12" fill="var(--card)" stroke="var(--line2)" stroke-width="1.5"/>'+
   '<text x="109" y="30" text-anchor="middle" font-size="11" font-weight="700" fill="var(--muted)">PRINT QUEUE · 4 P.M.</text>'+
   '<rect x="26" y="40" width="152" height="22" rx="6" fill="none" stroke="var(--faint)" stroke-width="1.5" stroke-dasharray="4 3"/><text x="102" y="55" text-anchor="middle" font-size="11" fill="var(--faint)">was here this morning</text>'+
   Q.map((t,k)=>{const y=40+(k+1)*25,u=k===3;return '<rect x="26" y="'+y+'" width="152" height="22" rx="6" fill="'+(u?'var(--no-bg)':'var(--soft2)')+'" stroke="'+(u?'var(--no-strong)':'none')+'" stroke-width="1.5"/>'+hnBadge(38,y+11,k+1,u?HN_NO:'var(--muted)')+'<text x="52" y="'+(y+15)+'" font-size="11" '+(u?'font-weight="700" fill="var(--no)"':'fill="var(--ink)"')+'>'+t+'</text>';}).join('')+
   '<path d="M184 51C202 51 202 151 184 151" fill="none" stroke="var(--no-strong)" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#hnq)"/>'+
   '<defs><marker id="hnq" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="var(--no-strong)"/></marker></defs>'+
   '<circle cx="262" cy="106" r="11" fill="var(--h3)"/><path d="M244 150c1-17 9-26 18-26s17 9 18 26Z" fill="var(--h3)"/><text x="262" y="166" text-anchor="middle" font-size="11" fill="var(--muted)">Floor lead</text>'+
   '<ellipse cx="264" cy="48" rx="38" ry="26" fill="var(--card)" stroke="var(--line2)" stroke-width="1.5"/><circle cx="260" cy="84" r="4" fill="var(--card)" stroke="var(--line2)" stroke-width="1.5"/><text x="264" y="44" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">Why?</text><text x="264" y="59" text-anchor="middle" font-size="11" fill="var(--muted)">unknown</text>'+
   '</svg>'+L.note('How this course applies the book: a practice case, not one of the book’s examples.','compass'));
  L.mc(L.card,['Report the floor lead to Pella for ignoring priorities','Ask the floor lead what changed in the queue today','Stop marking jobs urgent, since nobody respects it'],1,
   'Asking costs nothing and covers every no-ill-intent story: a new rush job, a broken machine, a missed flag. If there was a reason, Ira learns it; if not, Ira can fix it together.',
   'That move assumes the floor lead meant it, and it puts both of them on the defensive. The razor says: ask first. A missed flag or a machine fault is far likelier than a snub.');}},

{part:2,src:'Hanlon’s Razor · Conclusion',pts:6,run(L){
  L.h('<svg class="hn-svg" viewBox="0 0 320 92" role="img" aria-label="A scale from assume a mistake to update. A dotted line marks overwhelming evidence; the marker moves to the zone of each answer.">'+
   '<rect width="320" height="92" rx="14" fill="var(--soft)"/>'+
   '<rect x="18" y="38" width="210" height="16" rx="8" fill="var(--h2-bg)" stroke="var(--h2)" stroke-width="1.5"/><rect x="236" y="38" width="66" height="16" rx="8" fill="var(--no-bg)" stroke="var(--no-strong)" stroke-width="1.5"/>'+
   '<path d="M232 28V64" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="2 3"/><text x="232" y="22" text-anchor="middle" font-size="11" font-weight="600" fill="var(--muted)">overwhelming</text>'+
   '<text x="18" y="80" font-size="11" font-weight="700" fill="var(--h2)">Good faith: ask</text><text x="302" y="80" text-anchor="end" font-size="11" font-weight="700" fill="var(--no)">Update</text>'+
   '<g id="qkm" style="transition:transform .5s ease;opacity:0"><path d="M0 34 -7 24H7Z" fill="var(--ink)"/></g></svg>'+
   '<div id="qk"></div>'+L.note('How this course applies the book: these are practice cases, and the suggested moves are this course’s advice.','compass'));
  L.$('#qk').addEventListener('click',()=>setTimeout(()=>{const ok=L.$('#qk .opts .opt.ok');if(!ok)return;const r=[...ok.parentNode.children].indexOf(ok);
    const m=L.$('#qkm');if(m){m.style.opacity=1;m.style.transform='translateX('+(r?269:123)+'px)';}},0));
  new MutationObserver(()=>{const m=L.$('#qkm');if(m&&!L.$('#qk .opts .opt.ok'))m.style.opacity=0;}).observe(L.$('#qk'),{childList:true});
  L.quick(L.$('#qk'),'Good faith, or overwhelming?',['Assume a mistake: ask','Evidence is overwhelming: update'],[
   ['Bram forgets to copy Ira on a client email about a deadline.',0,'Forgetting a name on an email is one slip. Ask Bram to add Ira next time.'],
   ['A caller who says they’re from Ira’s bank keeps asking for Ira’s PIN after Ira refuses.',1,'Real malice exists. Pushing for a PIN after a clear no is overwhelming evidence: hang up and call the bank yourself.'],
   ['The letting agent sends the rent-renewal letter to Ira’s old address.',0,'An out-of-date address in a system is a classic mistake. Give them the new one.'],
   ['A supplier keeps overbilling after two written warnings, and their own delivery notes show it.',1,'Told twice, shown the proof, still doing it: the evidence of intent has piled up. Update and protect the company.'],
   ['Pella moves Ira’s meeting twice in one day without explaining.',0,'An overloaded manager juggling a calendar is far likelier than a campaign against Ira. Ask what time works.'],
   ['A cyclist swerves close to Ira’s car door as Ira gets out.',0,'Like the driver on the ring road: aiming at a door on purpose takes far more effort than not seeing it open.']]);}},

{part:2,src:'Hanlon’s Razor · Conclusion',pts:2,
 solve:async L=>{L.$$('#cc .hn-cd').filter(b=>b.dataset.e==='1').forEach(b=>b.click());const r=L.$('#cr').children[1];if(r)r.click();},
 run(L){
  L.h(L.kick('pr','Challenge · the overbilling supplier')+'<h1 class="q">Ira’s file on the vinyl supplier. Drop only the cards that are real evidence of intent. Does “meant it” reach the dotted ring?</h1>'+
   '<div id="cb"></div><div class="hn-cds" id="cc"></div><div class="opts" id="cr"></div>');
  const bub=hnBub(L,L.$('#cb'),{mis:3,mal:1,ring:true,event:'The vinyl supplier’s invoice|is too high.'});
  const C=[['March: billed for 500 banners; 300 arrived',0,1,0,1],['The supplier’s rep sounds smug on the phone',0,0,1.6,0],['Told in March and credited; April is overbilled the same way',0,1.5,0,1],
   ['Ira once read about crooked suppliers online',0,0,1.6,0],['Their own delivery note says 300; the invoice says 500',0,1,0,1],['May: overbilled again, after a written warning',0,1.5,0,1]];
  let err=false,fin=false;
  C.forEach(c=>{const b=document.createElement('button');b.className='hn-cd';b.dataset.e=c[4];b.innerHTML='<span>'+c[0]+'</span>';
    b.onclick=()=>{if(fin||b.classList.contains('used'))return;b.classList.add('used',c[4]?'ev':'vv');bub.drop(c);
      if(!c[4]){err=true;b.insertAdjacentHTML('beforeend','<em>not evidence</em>');bub.set({note:'That only puffed the halo: it <i>feels</i> damning, but proves nothing.'});return;}
      b.insertAdjacentHTML('beforeend','<em>evidence</em>');bub.set({note:''});
      if(bub.over&&!fin){fin=true;L.award(!err);
        L.$('#cr').insertAdjacentHTML('beforebegin','<p class="hn-ro"><b>Past the ring.</b> What should Ira do now?</p>'+L.note('How this course applies the book: the book says to update on overwhelming evidence; the practical steps below are this course’s advice.','compass'));
        ['Keep paying: it’s probably still a mistake','Dispute the invoices in writing and line up another supplier','Post an angry public review naming the rep'].forEach((t,j)=>{const o=document.createElement('button');o.className='opt';o.innerHTML='<span class="key">'+(j+1)+'</span><span>'+t+'</span>';
          o.onclick=()=>{if(o.parentNode.dataset.a)return;/*graded once*/o.parentNode.dataset.a=1;const ok=j===1;o.classList.add(ok?'ok':'no');if(!ok)L.$('#cr').children[1].classList.add('ok');L.award(ok);
            L.sheet(ok&&!err?'ok':'info',ok?'Update, calmly':'Update, but calmly','Told, credited, warned in writing, and their own notes contradict the bills: the evidence is overwhelming, so the razor no longer applies. Real malice exists. The response is firm and practical: dispute in writing, protect the company. Lashing out is still the defensive mode the book warns about.'+(err?' Note: the smug rep and the online story were vivid, not evidence.':''));L.done();};L.$('#cr').appendChild(o);});L.$('#cr').scrollIntoView({block:'nearest',behavior:'smooth'});}};
    L.$('#cc').appendChild(b);});}},

/* ---------- PART 4: USE IT THIS WEEK ---------- */
{part:3,src:'Course application · built on Hanlon’s Razor',pts:1,
 solve:async L=>{L.$('#mb').click();L.$$('#mx .chip').forEach(b=>b.click());L.$('#mb').click();L.$('#mr').children[2].click();},
 run(L){
  L.h(L.kick('pr','One-minute move · how this course applies the book')+'<h1 class="q">Bram promised another rush job; the floor is full. Ira is furious. Run the move.</h1>'+
   '<ol class="hn-mv" id="mv"><li>Pause</li><li>No-ill-intent stories</li><li>Effort check</li><li>Respond</li></ol>'+
   '<div class="hn-say" id="ms" aria-live="polite"></div><div class="hn-chips" id="mx" style="justify-content:center"></div><div id="me"></div><div class="hn-ctl"><button class="btn pri" id="mb"></button></div><div id="mbb"></div><div class="opts" id="mr"></div>');
  const bub=hnBub(L,L.$('#mbb'),{small:true,mis:1,mal:1.5,feel:1.5,event:'Bram promised Friday.|The floor is already full.'});
  let st=0;
  const say=(h,t)=>L.$('#ms').innerHTML='<b>'+h+'</b>'+t;
  const go=n=>{st=n;L.$$('#mv li').forEach((li,j)=>li.className=j<n?'dn':j===n?'cur':'');const b=L.$('#mb');b.parentNode.hidden=false;
    if(n===0){say('STEP 1 · PAUSE','Anger wants a reply right now. The razor starts by not sending it.');b.innerHTML=L.ic('clock')+'Pause before replying';}
    if(n===1){b.parentNode.hidden=true;say('STEP 2 · NO-ILL-INTENT STORIES','Tap every plain explanation that could fit. Watch the bubbles.');
      ['Didn’t see the schedule','Didn’t know the floor was full','Forgot to check','Rushed by the client'].forEach(t=>{const c=document.createElement('button');c.className='chip';c.textContent=t;
        c.onclick=()=>{if(c.disabled)return;c.disabled=true;c.classList.add('sel');bub.drop([0,0.9,0,-0.35]);if(L.$$('#mx .chip').every(x=>x.disabled))go(2);};L.$('#mx').appendChild(c);});}
    if(n===2){L.$('#mx').innerHTML='<p class="small" style="text-align:center;margin:0;width:100%">Plain stories listed: didn’t see · didn’t know · forgot · rushed</p>';say('STEP 3 · EFFORT CHECK','How much would “on purpose” take, compared with a slip?');b.innerHTML=L.ic('layers')+'Count the effort';}
    if(n===3){b.parentNode.hidden=true;say('STEP 4 · RESPOND','Unless the evidence is overwhelming, respond as if it was a mistake. What does Ira say?');
      ['Tell Pella that Bram is sabotaging the schedule','Say nothing and stay late again','Ask Bram what the client was told, and suggest checking the floor first'].forEach((t,j)=>{const o=document.createElement('button');o.className='opt';o.innerHTML='<span class="key">'+(j+1)+'</span><span>'+t+'</span>';
        o.onclick=()=>{if(L.$('#mr').dataset.a)return;L.$('#mr').dataset.a=1;const ok=j===2;o.classList.add(ok?'ok':'no');if(!ok)L.$('#mr').children[2].classList.add('ok');L.award(ok);L.$$('#mv li').forEach(li=>li.className='dn');bub.assume('mis');
          L.sheet(ok?'ok':'no',ok?'Ask, don’t accuse':'That skips the razor','Accusing assumes malice; staying silent assumes nothing will change. Asking fits the likeliest story and opens the real fixes: a check-the-floor rule for rush promises. If Bram keeps doing it after agreeing the rule, that becomes evidence, and Ira updates.');L.done();};L.$('#mr').appendChild(o);});L.$('#mr').scrollIntoView({block:'nearest',behavior:'smooth'});}};
  L.$('#mb').onclick=()=>{if(st===0)go(1);else if(st===2){L.$('#me').innerHTML='<div class="hn-ef"><div class="m"><span>On purpose: 4</span><i></i><i></i><i></i><i></i></div><div class="s"><span>A slip: 1</span><i></i></div></div><p class="small" style="text-align:center;margin:0">Know the floor is full, promise to overload it, steer blame to Ira, keep it from Pella.</p>';go(3);}};
  go(0);}},

{part:3,src:'Hanlon’s Razor · Conclusion',pts:1,run(L){
  L.h(L.kick('pr','Ask, don’t accuse')+'<h1 class="q">Pella’s message arrived at 11:40 p.m. Build Ira’s reply. Tap each piece to change it.</h1>'+
   '<div class="hn-msg"><small>Pella · 11:40 pm</small>We need to talk. 8 a.m.</div>'+
   '<div style="margin-bottom:10px">'+L.note('How this course applies the book: the reply wording is this course’s advice, built on the razor.','compass')+'</div>');
  L.sentence(L.card,[
    ['Is this about me?','Sure, 8 works.','Fine, if we must.'],
    ['What have I done now?','I can explain everything.','Is it the switchover date?'],
    ['I’ll bring proof it wasn’t me.','I’ll bring the latest order numbers.','I’ll bring a witness.']],[1,2,1],
   [['That asks Pella to confirm a threat Ira only imagined.','Grudging agreement starts the meeting on the defensive.'],
    ['That assumes Ira is in trouble. Nothing says so yet.','“Explain everything” is a defense before any charge.'],
    ['Bringing proof prepares a defense against an accusation nobody made.','A witness treats a short message as an attack.']],
   'Agree, ask a plain question, offer something useful. The reply fits the likeliest story (a busy manager typing fast late at night) and leaves every option open. If it really is bad news, Ira will hear it at 8, rested.');}},

{part:3,src:'Hanlon’s Razor · Conclusion',
 solve:async L=>{L.$$('#lp .chip').forEach(b=>b.click());},
 run(L){
  const PR=[
   ['Overwhelming evidence',{event:'The supplier overbilled again,|after a written warning.',mis:2,mal:6,feel:0,ring:true,a:'“They’re doing it on purpose”',b:'“A billing error”'},'Real malice exists. Once the evidence of intent passes “overwhelming”, update and protect yourself. The razor is a starting assumption, not a blindfold.'],
   ['Don’t overthink it',{event:'Someone took the last clean mug.',mis:1.2,mal:0.3,feel:0,ring:false,a:'',b:''},'A five-second annoyance. The book warns not to overthink this model: the motives that take the least energy, like not noticing, are the likeliest. Shrug and move on; no case to build.'],
   ['Vivid story',{event:'Bram winked at the client|while promising Friday.',mis:3,mal:1,feel:3.4,ring:false,a:'“Smug: he meant it”',b:'“Just being friendly”'},'Like Linda, a vivid detail puffs the halo, not the evidence. A wink makes a plot feel real; it doesn’t make it likelier.'],
   ['High stakes',{event:'Depth charges explode|above sub B-59.',mis:2.6,mal:2.4,feel:2.5,ring:true,a:'“It’s an attack”',b:'“A misunderstanding”'},'When wrongly assuming attack would be catastrophic, assuming a mistake keeps the safe options open. Arkhipov chose to surface and check, not to fire.'],
   ['You at the center',{event:'Pella, Bram, Remy and a driver:|all against Ira today?',mis:4.5,mal:0.8,feel:3.8,ring:false,a:'“Everyone’s against me”',b:'“Everyone’s busy”'},'If every annoyance is aimed at you, you’ve put yourself at the center of everyone’s world. The book: for every act of malice there’s far more not knowing and carelessness.']];
  L.h(L.kick('ex','Edge cases and limits')+'<h1 class="q">Where does Hanlon’s razor stop helping, or need care? Try each case.</h1>'+
   '<div id="lb"></div><div class="hn-chips" id="lp" style="justify-content:center"></div><div id="lf"></div>');
  const bub=hnBub(L,L.$('#lb'),{mis:3,mal:1,event:'Pick a case below.'});const seen=new Set();let fin=false;
  PR.forEach((p,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=p[0];b.onclick=()=>{L.$$('#lp .chip').forEach((x,q)=>x.classList.toggle('sel',q===j));
    bub.set(Object.assign({note:''},p[1]));L.$('#lf').innerHTML='';L.fb(L.$('#lf'),p[2],j===0?'no':'info');seen.add(j);
    if(!fin&&seen.size===PR.length){fin=true;L.sheet('info','The book’s limits','Real malice exists. Don’t overthink it. Assume good faith and don’t assign sinister motives <b>without overwhelming evidence</b>; when the evidence piles up, update. Most daily frustrations are mundane: people forget, speak without thinking, act on incomplete information.');L.done();}};L.$('#lp').appendChild(b);});}},

{part:3,src:'Course application · built on Hanlon’s Razor',
 solve:async L=>{L.$('#yw').value='A colleague left me off the meeting invite';L.$('#yw').dispatchEvent(new Event('input',{bubbles:true}));
   L.$('#ye').children[0].click();L.$('#ye').children[2].click();L.$('#yf').children[1].click();L.$('#yv').children[0].click();L.$('#yb').click();},
 run(L){
  L.h(L.kick('pr','Your turn · ungraded')+'<h1 class="q">One moment this week you felt targeted. Re-read it with the razor.</h1>'+
   L.note('How this course applies the book: the one-minute move on your own week.','compass')+
   '<label class="hn-fl" for="yw">WHAT HAPPENED?</label><input class="hn-in" id="yw" maxlength="70" placeholder="e.g. my friend didn’t reply to my message">'+
   '<span class="hn-fl">PLAIN STORIES THAT COULD FIT (tap any)</span><div class="hn-chips" id="ye"></div>'+
   '<span class="hn-fl">DOING IT ON PURPOSE WOULD TAKE…</span><div class="hn-chips" id="yf"></div>'+
   '<span class="hn-fl">EVIDENCE OF INTENT SO FAR</span><div class="hn-chips" id="yv"></div>'+
   '<div class="hn-ctl"><button class="btn pri" id="yb" disabled>'+L.ic('play')+'Draw my bubbles</button></div><div id="yo"></div>');
  const ex=new Set();let ef=null,ev=null;
  const chips=(id,arr,multi,cb)=>arr.forEach((t,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=t;b.onclick=()=>{if(multi){b.classList.toggle('sel');}else{[...L.$(id).children].forEach((x,q)=>x.classList.toggle('sel',q===j));}cb(j,b.classList.contains('sel'));chk();};L.$(id).appendChild(b);});
  chips('#ye',['Didn’t see it','Didn’t know','Forgot','Was rushed','Busy with their own stuff'],true,(j,on)=>{on?ex.add(j):ex.delete(j);});
  chips('#yf',['One slip','A whole chain of steps'],false,j=>ef=j);
  chips('#yv',['None','Some','Overwhelming'],false,j=>ev=j);
  function chk(){L.$('#yb').disabled=!(L.$('#yw').value.trim().length>2&&ex.size&&ef!==null&&ev!==null);}
  L.$('#yw').addEventListener('input',chk);
  L.$('#yb').onclick=()=>{L.$('#yo').innerHTML='';const mal=[1,2.5,5.5][ev]-(ef===1&&ev<2?0.4:0);
    hnBub(L,L.$('#yo'),{mis:1+0.8*ex.size,mal,ring:true,event:hnWrap(L.esc(L.$('#yw').value),38),story:'',misStory:''});
    L.sheet('info',ev===2?'Overwhelming: update, calmly':'Respond as if it was a mistake',(ev===2?'Real malice exists. Protect yourself with a firm, practical step, not a counter-attack.':'Your plain stories outweigh the evidence of intent. Ask, don’t accuse: one friendly question will tell you more than a night of brooding.')+' Write it as one line in your decision journal, and later note what the real story turned out to be.');L.done();};}},

{part:3,src:'Course application · built on Hanlon’s Razor',run(L){
  L.h(L.kick('learn','Your decision map')+'<h1 class="q">Hanlon’s razor completes the map</h1>'+
   L.note('How this course applies the book. Every slot is now filled; lesson 11 lets you ride the whole map.','compass')+
   '<div id="dm"></div><p class="small">It’s the <b>first</b> lens when someone’s behavior upsets you. Then check what you can’t see (the map), and remember you’ll deal with them again (second-order: trust).</p>');
  L.$('#dm').innerHTML=HN_ROWS.map(r=>{const hot=r[1][0]==='hanlon';return '<div class="hn-dm'+(hot?' hot':'')+'"><b>'+r[0]+(hot?' · start here':'')+'</b><div class="r">'+
    r[1].map((k,j)=>(j?'<span class="ar">→</span>':'')+'<span class="m'+(k==='hanlon'?' cur':'')+'">'+HN_M[k]+'</span>').join('')+'</div></div>';}).join('');
  L.done();}}
  ]
});
