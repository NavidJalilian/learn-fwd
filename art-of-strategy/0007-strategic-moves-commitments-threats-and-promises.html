/* ---------- small pictures ---------- */
function smPerson(x,y,c,lab,sub){return '<circle cx="'+x+'" cy="'+y+'" r="13" fill="var(--'+c+'-bg)" stroke="var(--'+c+')" stroke-width="2"/>'+
  '<path d="M'+(x-19)+' '+(y+42)+'q19-34 38 0z" fill="var(--'+c+'-bg)" stroke="var(--'+c+')" stroke-width="2"/>'+
  (lab?'<text x="'+x+'" y="'+(y+58)+'" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink)">'+lab+'</text>':'')+
  (sub?'<text x="'+x+'" y="'+(y+73)+'" text-anchor="middle" font-size="12" fill="var(--muted)">'+sub+'</text>':'');}
function smArrow(x1,y1,x2,y2,col,w){const dx=x2-x1,dy=y2-y1,l=Math.hypot(dx,dy),ux=dx/l,uy=dy/l,bx=x2-8*ux,by=y2-8*uy,px=-uy*4.5,py=ux*4.5;
  return '<path d="M'+x1+' '+y1+'L'+bx.toFixed(1)+' '+by.toFixed(1)+'" stroke="'+col+'" stroke-width="'+(w||2.5)+'" fill="none"/><path d="M'+x2+' '+y2+'L'+(bx+px).toFixed(1)+' '+(by+py).toFixed(1)+'L'+(bx-px).toFixed(1)+' '+(by-py).toFixed(1)+'Z" fill="'+col+'"/>';}
function smCarrot(x,y){return '<path d="M'+(x-5)+' '+(y-9)+'L'+(x+5)+' '+(y-9)+'L'+x+' '+(y+12)+'Z" fill="var(--h3)"/><path d="M'+x+' '+(y-9)+'l-6-7M'+x+' '+(y-9)+'l0-8M'+x+' '+(y-9)+'l6-7" stroke="var(--ok-strong)" stroke-width="2" stroke-linecap="round"/>';}
function smStick(x,y){return '<path d="M'+(x-11)+' '+(y+11)+'L'+(x+11)+' '+(y-11)+'" stroke="var(--no-strong)" stroke-width="5" stroke-linecap="round"/><path d="M'+(x+2)+' '+(y-2)+'l7 3" stroke="var(--no-strong)" stroke-width="3" stroke-linecap="round"/>';}

/* ---------- 1. the temptation vending machine (illustrative numbers) ---------- */
const VM_IT={head:['Headphones','£120',4,'phones'],take:['Takeaways','£60',3,'food'],conc:['Concert','£90',5,'gig'],fund:['Holiday fund','£150',2,'saved']};
const VM_MO=[['Feb',['head','take']],['Mar',['head','take']],['Apr',['conc','take']],['May',['head','take']],['Jun',['take']],['Jul',['head','take']]];
const VM_DEV={resolve:['Resolve harder',0,[]],shop:['Delete the shopping app',1,['head']],take:['Delete the takeaway app',1,['take']],auto:['Automatic transfer on payday',1,[],1],freeze:['Freeze the card for six months',5,['head','take','conc']]};
function vmRun(on){const rm=new Set();let auto=false,h=0;on.forEach(d=>{const v=VM_DEV[d];h+=v[1];v[2].forEach(x=>rm.add(x));if(v[3])auto=true;});
  const res=VM_MO.map(m=>{if(auto)return 'fund';const av=m[1].filter(x=>!rm.has(x));if(!av.length)return 'fund';return av.slice().sort((a,b)=>VM_IT[b][2]-VM_IT[a][2])[0];});
  return {res,rm,auto,h,saved:res.filter(r=>r==='fund').length*150};}
function vmIcon(k,x,y){
  if(k==='head')return '<path d="M'+x+' '+(y+12)+'a10 10 0 0 1 20 0" fill="none" stroke="var(--h1)" stroke-width="2.5"/><rect x="'+(x-2)+'" y="'+(y+10)+'" width="6" height="10" rx="2" fill="var(--h1)"/><rect x="'+(x+16)+'" y="'+(y+10)+'" width="6" height="10" rx="2" fill="var(--h1)"/>';
  if(k==='take')return '<path d="M'+(x+1)+' '+(y+7)+'h18l-2 13h-14z" fill="var(--h3)"/><path d="M'+(x+6)+' '+(y+7)+'a4 4 0 0 1 8 0" fill="none" stroke="var(--h3)" stroke-width="2"/>';
  if(k==='conc')return '<rect x="'+x+'" y="'+(y+5)+'" width="22" height="14" rx="2" fill="var(--h4)"/><circle cx="'+(x+11)+'" cy="'+(y+12)+'" r="3" fill="var(--card)"/>';
  return '<rect x="'+x+'" y="'+(y+6)+'" width="22" height="15" rx="3" fill="var(--ok-strong)"/><path d="M'+(x+7)+' '+(y+6)+'v-3h8v3" fill="none" stroke="var(--ok-strong)" stroke-width="2"/>';}
function vmSvg(s){const W=[['head',16,42],['take',114,42],['conc',16,126],['fund',114,126]];
  let o='<svg class="sm-svg" viewBox="0 0 330 214" role="img" aria-label="The payday machine: headphones, takeaways, concert tickets and the holiday fund'+(s.rm.size?'; removed: '+[...s.rm].map(k=>VM_IT[k][0]).join(', '):'')+(s.auto?'; automatic transfer on':'')+'">'+
   '<defs><pattern id="smst" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="4.5" height="9" fill="var(--line2)"/></pattern></defs>'+
   '<rect x="6" y="4" width="212" height="206" rx="16" fill="var(--soft)" stroke="var(--line2)" stroke-width="2"/>'+
   '<path d="M6 34V20a16 16 0 0 1 16-16h180a16 16 0 0 1 16 16v14z" fill="var(--pri)"/>'+
   '<text x="112" y="24" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--pri-ink)" letter-spacing="1">PAYDAY MACHINE</text>';
  W.forEach(w=>{const k=w[0],x=w[1],y=w[2],it=VM_IT[k],gone=s.rm.has(k),hot=k==='fund'&&s.auto;
    o+='<rect x="'+x+'" y="'+y+'" width="94" height="76" rx="10" fill="var(--card)" stroke="'+(hot?'var(--ok-strong)':'var(--line)')+'" stroke-width="'+(hot?3:1.5)+'"/>'+
     '<text x="'+(x+8)+'" y="'+(y+19)+'" font-size="12.5" font-weight="700" fill="var(--ink)">'+it[0]+'</text>'+
     '<text x="'+(x+8)+'" y="'+(y+36)+'" font-size="12" fill="var(--muted)">'+it[1]+'</text>'+vmIcon(k,x+64,y+24);
    for(let d=0;d<5;d++)o+='<circle cx="'+(x+13+d*10)+'" cy="'+(y+60)+'" r="3.8" fill="'+(d<it[2]?'var(--h3)':'var(--line)')+'"/>';
    if(s.cnt&&s.cnt[k])o+='<g class="sm-t"><circle cx="'+(x+80)+'" cy="'+(y+60)+'" r="12" fill="'+(k==='fund'?'var(--ok-strong)':'var(--no-strong)')+'"/><text x="'+(x+80)+'" y="'+(y+64.5)+'" text-anchor="middle" font-size="12" font-weight="700" fill="var(--card)">×'+s.cnt[k]+'</text></g>';
    if(gone)o+='<g class="sm-t"><rect x="'+x+'" y="'+(y+44)+'" width="94" height="32" rx="10" fill="url(#smst)" opacity=".75"/><path d="M'+(x+6)+' '+(y+32)+'h'+(it[1].length*7+6)+'" stroke="var(--no-strong)" stroke-width="2"/><rect x="'+(x+6)+'" y="'+(y+50)+'" width="82" height="20" rx="6" fill="var(--card)" stroke="var(--no-line)"/><text x="'+(x+47)+'" y="'+(y+64.5)+'" text-anchor="middle" font-size="12" font-weight="700" fill="var(--no)">REMOVED</text></g>';});
  o+=smPerson(274,52,'h2','Payday Tali','takes the')+'<text x="274" y="140" text-anchor="middle" font-size="12" fill="var(--muted)">strongest pull</text>';
  if(s.auto)o+='<g class="sm-t"><circle cx="292" cy="178" r="14" fill="var(--ok-strong)"/><text x="292" y="182.5" text-anchor="middle" font-size="12" font-weight="700" fill="var(--card)">£</text>'+smArrow(276,176,214,166,'var(--ok-strong)',3)+
    '<text x="268" y="204" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ok)">goes first</text></g>';
  return o+'</svg>';}
function vmBuild(L,host,o){const on=new Set(o.start||[]);let last=null;const w=document.createElement('div');host.appendChild(w);
  w.innerHTML='<div class="vm-sv"></div><p class="sm-ro" style="margin:2px 0"><span style="color:var(--h3)">●</span> how strongly payday Tali wants it (illustrative numbers)</p>'+
   '<div class="sm-mo vm-mo"></div><div class="vm-bars"></div><div class="sm-lab">Before payday, today’s Tali can…</div><div class="sm-tiles vm-dev"></div>'+
   '<div class="sm-ctl"><button class="btn pri vm-go">'+L.ic('play')+'Play six paydays</button></div>';
  const $=s=>w.querySelector(s);
  o.devs.forEach(d=>{const b=document.createElement('button');b.className='chip'+(on.has(d)?' sel':'');b.dataset.d=d;b.innerHTML=VM_DEV[d][0]+' <small>· hassle '+VM_DEV[d][1]+'</small>';
    b.onclick=()=>{on.has(d)?on.delete(d):on.add(d);b.classList.toggle('sel',on.has(d));last=null;draw();};$('.vm-dev').appendChild(b);});
  function draw(){const r=vmRun([...on]),cnt={};if(last)last.res.forEach(k=>cnt[k]=(cnt[k]||0)+1);
    $('.vm-sv').innerHTML=vmSvg({rm:r.rm,auto:r.auto,cnt:last?cnt:null});
    $('.vm-mo').innerHTML=VM_MO.map((m,j)=>{if(!last)return '<div><b>'+m[0]+'</b>?</div>';const k=last.res[j];
      return '<div class="pop '+(k==='fund'?'ok':'no')+'" style="animation-delay:'+j*110+'ms"><b>'+m[0]+'</b>'+VM_IT[k][3]+'</div>';}).join('');
    const sv=last?last.saved:0;
    $('.vm-bars').innerHTML='<div class="sm-bar"><span>Holiday fund</span><div class="b"><i style="width:'+(sv/900*100)+'%;background:var(--ok-strong)"></i></div><b>£'+sv+' / 900</b></div>'+
      '<div class="sm-bar"><span>Hassle</span><div class="b"><i style="width:'+(r.h/7*100)+'%;background:var(--h3)"></i></div><b>'+r.h+'</b></div>';}
  $('.vm-go').onclick=()=>{last=vmRun([...on]);draw();if(o.onPlay)o.onPlay(last,[...on]);};
  draw();return {on,set(list){on.clear();list.forEach(d=>on.add(d));w.querySelectorAll('.vm-dev .chip').forEach(b=>b.classList.toggle('sel',on.has(b.dataset.d)));last=null;draw();},play(){$('.vm-go').click();}};}

/* ---------- 4. the rule-card timeline ---------- */
function smTL(s){const st=s.stamp?'<span class="sm-stamp '+s.stamp[0]+'">'+s.stamp[1]+'</span>':'';
  return '<div class="sm-tl" role="group" aria-label="Rule card timeline: before, their move, your response">'+
   '<div class="sm-col on"><div class="sm-dot"><i></i>Before</div><div class="sm-box sm-card">'+(s.ifT?'<span class="k">IF</span>'+s.ifT+'<span class="k" style="margin-top:4px">THEN</span>'+(s.thenT||'…'):'<span class="k">'+(s.cardK||'YOUR RULE CARD')+'</span><span style="color:var(--muted)">'+(s.cardT||'Pick an “if” and a “then”.')+'</span>')+'<div>'+st+'</div></div></div>'+
   '<div class="sm-col'+(s.move?' on':'')+'"><div class="sm-dot"><i></i>Their move</div><div class="sm-box sm-mv'+(s.move?(s.move[1]?' ok':' no'):'')+'"><span class="who">'+s.who+'</span>'+(s.move?s.move[0]:'…')+'</div></div>'+
   '<div class="sm-col'+(s.resp?' on':'')+'"><div class="sm-dot"><i></i>Your reply</div><div class="sm-box"><div class="sm-ghost"><b>ANYWAY</b>'+s.ghost+'</div>'+(s.resp?'<b>'+s.resp+'</b>':'')+'</div></div></div>';}
/* stamp: a reply equal to the ghost is information only; a different reply is a strategic move */
function smJudge(S,ci,ri){const c=S.conds[ci],r=S.resps[ri];
  if(ri===S.ghost(ci))return r.v==='pun'?['warning','WARNING',0]:r.v==='rew'?['assurance','ASSURANCE',0]:['none','NO CHANGE',0];
  if(r.v==='neu')return ['none','NO CHANGE',0];
  if(c.bad&&r.v==='pun')return ['threat','THREAT',1];
  if(!c.bad&&r.v==='rew')return ['promise','PROMISE',1];
  return ['back','BACKWARDS',0];}
function smBuilder(L,host,S,o){const st={c:null,r:null};const w=document.createElement('div');host.appendChild(w);
  w.innerHTML='<div class="rc-tl"></div><div class="sm-tags rc-tags"></div><div class="sm-lab">If (their move)</div><div class="sm-tiles rc-c"></div><div class="sm-lab">Then (Tali’s reply)</div><div class="sm-tiles rc-r"></div>';
  const $=s=>w.querySelector(s);
  S.conds.forEach((c,j)=>{const b=document.createElement('button');b.className='chip';b.textContent='If '+c.t;b.onclick=()=>{st.c=j;draw();};$('.rc-c').appendChild(b);});
  S.resps.forEach((r,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=r.t;b.onclick=()=>{st.r=j;draw();};$('.rc-r').appendChild(b);});
  function draw(){[...$('.rc-c').children].forEach((b,j)=>b.classList.toggle('sel',st.c===j));[...$('.rc-r').children].forEach((b,j)=>b.classList.toggle('sel',st.r===j));
    const full=st.c!=null&&st.r!=null,J=full?smJudge(S,st.c,st.r):null;
    $('.rc-tl').innerHTML=smTL({ifT:st.c!=null?S.conds[st.c].t:'',thenT:st.r!=null?S.resps[st.r].t:'',stamp:J?[J[0],J[1]]:null,who:S.who,
      move:full?(J[2]?S.after:S.before):null,ghost:st.c!=null?S.gt(st.c):S.gt0,resp:null});
    if(st.c!=null&&st.r==null)$('.rc-tl').innerHTML=smTL({ifT:S.conds[st.c].t,thenT:'',who:S.who,move:null,ghost:S.gt(st.c)});
    $('.rc-tags').innerHTML=J?S.tags(J,st.c,st.r).map(t=>'<span class="sm-tag '+(t[1]||'')+'">'+t[0]+'</span>').join(''):'';
    if(o.onChange)o.onChange(J,st);}
  draw();return {st,pick(c,r){st.c=c;st.r=r;draw();}};}
const SC_B={who:'Builder',

  resps:[{t:'I hold back £300',v:'pun'},{t:'I pay a £300 bonus',v:'rew'},{t:'I pay the agreed price',v:'neu'}],
  ghost:()=>2,gt0:'…',gt:()=>'Tali pays the agreed price',

  tags:(J)=>J[0]==='threat'?[['If it works: costs Tali £0','ok'],['If carried out: £300 held back, and a row','no']]:
    J[0]==='promise'?[['If it works: Tali pays £300','no'],['If it fails: costs £0','ok']]:

    s+='<circle cx="'+X(p)+'" cy="92" r="9" fill="'+col+'"/><text x="'+X(p)+'" y="62" text-anchor="middle" font-size="12" font-weight="700" fill="'+tc+'"'+halo+'>'+o[1]+'</text>'+
     '<text x="'+X(p)+'" y="77" text-anchor="middle" font-size="12" fill="'+tc+'"'+halo+'>'+(c==='ok'?'reward':c==='no'?'punishment':'= normal')+'</text>';});

function sqStamp(n){if(n<=5)return ['threat','THREAT','Normal is today’s rent (or close). Both outcomes are worse; refusing is worse still. The landlord is threatening: sign, or else.'];

  id:'0007', title:'Strategic moves: commitments, threats and promises', minutes:20, icon:'arrow',
  goals:['Beat a temptation of your future self with a commitment that removes the choice, at the smallest cost that works',
         'Tell a real threat or promise from a warning or assurance, and pick the right one (stop or get done, who pays, what counts as normal)',
         'Shape a move that works, clear, certain, with a deadline when you need action and no bigger than needed, and know where it backfires'],
  parts:['Change the game','Threats and promises','Make them work','Use it this week'],
  read:'Read chapter 6 of the book up to “Large Threats” for the alarm clock, the catalog clause, the quick reference chart and the two-parents case. Its “Brinkmanship” section goes with the next lesson.',
  glossary:{
   salami:'Salami tactics: getting round a rule one thin slice at a time (“just one more minute”), so that no single step seems worth the big punishment.',
   'meet-clause':'Meet-the-competition clause: a printed promise to match any lower price a rival charges. It lets a seller respond after seeing the rival’s price, which takes away the rival’s reason to cut.'
  },
  cheatsheet:[
   '<b>Strategic move:</b> act before the game to change what others expect you to do. A <b>commitment</b> fixes your own action; a <b>threat</b> or <b>promise</b> is a response rule, set first, carried out after they move.',
   '<b>Fewer options can win.</b> The alarm across the room, the automatic transfer, the thrown-away steering wheel. But if both sides commit at once, you crash.',
   '<b>Real or just information?</b> If you’d do it anyway, it’s a <b>warning</b> (or an <b>assurance</b>) and changes nothing. A real threat or promise goes against your later interest, so credibility is the key issue.',
   '<b>Deter</b> (stop something): no deadline, a tripwire; threats suit it. <b>Compel</b> (get something done): needs a deadline, and rewards for acting early help.',
   '<b>Who pays:</b> a threat costs nothing if it works; a promise costs you when it works. Whether it’s a threat or a promise depends on what counts as normal.',
   '<b>Clear, certain, small:</b> spell out what triggers what; answer salami slices with small steps (a bit per day late); keep a threat as small as still works.',
   '<b>Others’ moves:</b> let them commit first when following wins; never let others threaten you; welcome their promises, which can help you both.',
   'One-minute move (how this course applies the book): if nothing changes? → commit, threaten or promise → deter or compel → real, not a warning? → clear, certain, smallest that works.'

{part:0,src:'Chapter 6 · Changing the Game',

    else{L.$('#tb').hidden=true;L.sheet('info','A game against your future self','The book calls the struggle to save (or diet) a game between the long-view self now and the tempted self later. A resolution alone is just words. The book’s two parts of every move: <b>what</b> to do (the science) and <b>how</b> to make it stick (the art).');L.done();}};}},

{part:0,src:'Chapter 6 · Commitments',pts:1,

   ['room','Across the room','<b class="k">ACROSS THE ROOM</b>Morning self: get up to switch it off (−1) or lie there while it rings (10 − 15 = −5)? It gets up. Night self: <b>8</b>, not 0.']];

    b.onclick=()=>{if(a)return;a=true;const ok=j===1;L.award(ok);b.classList.add(ok?'ok':'no');if(!ok)L.$$('#ao .opt')[1].classList.add('ok');
      L.$('#am').classList.remove('sm-hide');L.$('#aw').classList.remove('sm-hide');show(2);

{part:1,src:'Chapter 6 · Threats and Promises',
 solve:async L=>{L.$$('#msv .sm-tap').forEach(g=>g.dispatchEvent(new MouseEvent('click',{bubbles:true})));},
 run(L){
  L.h(L.kick('learn','Three strategic moves')+'<h1 class="q">One unconditional move, two conditional ones. Tap each.</h1>'+
   '<svg class="sm-svg" id="msv" viewBox="0 0 330 160" role="group" aria-label="Three moves: commitment, threat, promise"></svg><div class="sm-say" id="msay" aria-live="polite">Tap a picture.</div>');
  const P=[['Commitment','commit','<b class="k">COMMITMENT · UNCONDITIONAL</b>You fix your own action in advance; others adjust. The night self sets the alarm, then is gone by morning.'],
   ['Threat','threat','<b class="k">THREAT · A RESPONSE RULE</b>“If you do what I don’t want, I’ll punish it.” Set first, carried out after they move.'],
   ['Promise','promise','<b class="k">PROMISE · A RESPONSE RULE</b>“If you do what I want, I’ll reward it.” The rule must be in place before they move: in the book, a parent has to tie dessert to the spinach before the child can slip it to the dog.']];
  const seen=new Set();let sel=-1;
  function draw(){let s='';P.forEach((p,j)=>{const x=6+j*108,on=sel===j;
    s+='<g class="sm-tap" data-j="'+j+'" role="button" tabindex="0" aria-label="'+p[0]+'"><rect class="f" x="'+x+'" y="4" width="102" height="152" rx="14" fill="'+(on?'var(--pri-bg)':'var(--soft)')+'" stroke="'+(on?'var(--pri)':'var(--line)')+'" stroke-width="'+(on?2.5:1.5)+'"/>'+
      '<text x="'+(x+51)+'" y="26" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink)">'+p[0]+'</text>';
    const cx=x+51;
    if(j===0)s+='<path d="M'+cx+' 140V100" stroke="var(--pri)" stroke-width="5" stroke-linecap="round"/><path d="M'+cx+' 100L'+(cx-26)+' 52" stroke="var(--pri)" stroke-width="5" stroke-linecap="round"/><path d="M'+cx+' 100L'+(cx+12)+' 78" stroke="var(--line2)" stroke-width="5" stroke-linecap="round"/><path d="M'+(cx+18)+' 66L'+(cx+26)+' 52" stroke="var(--line2)" stroke-width="5" stroke-linecap="round" opacity=".5"/><path d="M'+(cx+9)+' 66l12 8M'+(cx+21)+' 66l-12 8" stroke="var(--no-strong)" stroke-width="2.5"/><text x="'+cx+'" y="152" text-anchor="middle" font-size="12" fill="var(--muted)">I will. Full stop.</text>';
    else{s+='<path d="M'+(cx-18)+' 140V58" stroke="var(--line2)" stroke-width="4"/><path d="M'+(cx-30)+' 50h56l10 10-10 10h-56z" fill="var(--card)" stroke="var(--ink)" stroke-width="1.5"/><text x="'+(cx-2)+'" y="65" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">IF '+(j===1?'✗':'✓')+'</text>'+
      (j===1?smStick(cx+18,104):smCarrot(cx+18,104))+'<text x="'+cx+'" y="152" text-anchor="middle" font-size="12" fill="var(--muted)">then '+(j===1?'a stick':'a carrot')+'</text>';}
    s+='</g>';});L.$('#msv').innerHTML=s;
    L.$$('#msv .sm-tap').forEach(g=>{const f=()=>{sel=+g.dataset.j;seen.add(sel);L.$('#msay').innerHTML=P[sel][2];draw();
      if(seen.size===3&&!L.$('h1.q').dataset.d){L.$('h1.q').dataset.d=1;L.sheet('info','Set first, respond second','A threat or promise needs two things: you set and announce the rule <b>before</b> they move, and you keep the ability to respond <b>after</b> you see their move.');L.done();}};
      g.onclick=f;g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();f();}};});}
  draw();}},

{part:1,src:'Chapter 6 · Threats and Promises',
 solve:async L=>{L.$('#kc').click();L.$('#kf').click();L.$('#kc').click();},
 run(L){
  L.h(L.kick('ex','The book’s shirt catalogs')+'<h1 class="q">Two catalogs print shirt prices at the same time. How does one footnote stop a price cut?</h1>'+
   '<svg class="sm-svg" id="ksv" viewBox="0 0 330 170" role="img" aria-label="Two catalogs side by side"></svg><div class="sm-say" id="ksay" aria-live="polite">Both print $80: <b>$72,000 profit each</b> (the book’s numbers). B. B. Lean is tempted to print $70.</div>'+
   '<div class="sm-ctl"><button class="chip" id="kf">Footnote: off</button><button class="btn pri" id="kc">'+L.ic('play')+'B. B. Lean prints $70</button></div>');
  let foot=false,cut=false,seen=new Set();
  function draw(){const re=cut?(foot?70:80):80,bb=cut?70:80;
    const page=(x,name,p,c,fn,profit)=>'<rect x="'+x+'" y="8" width="150" height="118" rx="10" fill="var(--card)" stroke="var(--line2)" stroke-width="1.5"/><rect x="'+x+'" y="8" width="150" height="24" rx="10" fill="var(--'+c+')"/><rect x="'+x+'" y="22" width="150" height="10" fill="var(--'+c+')"/>'+
      '<text x="'+(x+75)+'" y="25" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--card)">'+name+'</text><path d="M'+(x+18)+' 46h34l8 10v38h-50v-38z" fill="var(--'+c+'-bg)" stroke="var(--'+c+')" stroke-width="1.5"/>'+
      '<text x="'+(x+108)+'" y="72" text-anchor="middle" font-size="22" font-weight="700" fill="var(--ink)">$'+p+'</text>'+(fn?'<text x="'+(x+75)+'" y="108" text-anchor="middle" font-size="12" font-weight="700" fill="var(--pri)">* we match any</text><text x="'+(x+75)+'" y="121" text-anchor="middle" font-size="12" font-weight="700" fill="var(--pri)">lower price</text>':'')+
      (profit?'<text x="'+(x+75)+'" y="146" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink)">'+profit+'</text>':'');
    let pa='',pb='';if(cut&&!foot){pa='$24,000';pb='$110,000';}else if(cut&&foot){pa='$70,000';pb='$70,000';}else{pa='$72,000';pb='$72,000';}
    let s=page(6,'Rainbow’s End',re,'h1',foot,pa)+page(174,'B. B. Lean',bb,'h2',false,pb);
    if(cut&&!foot)s+='<g class="sm-t">'+smArrow(110,100,214,100,'var(--no-strong)',2.5)+'<text x="162" y="164" text-anchor="middle" font-size="12" font-weight="700" fill="var(--no)">customers switch to the cheaper catalog</text></g>';
    if(cut&&foot)s+='<g class="sm-t"><text x="165" y="164" text-anchor="middle" font-size="12" font-weight="700" fill="var(--pri)">price matched automatically: nobody switches</text></g>';
    L.$('#ksv').innerHTML=s;L.$('#kf').textContent='Footnote: '+(foot?'on':'off');L.$('#kf').classList.toggle('sel',foot);}
  draw();
  L.$('#kf').onclick=()=>{foot=!foot;cut=false;draw();L.$('#ksay').innerHTML=foot?'Rainbow’s End adds a footnote: <b>we will meet any lower price</b>. Now try the cut again.':'Footnote removed. Both at $80: <b>$72,000 each</b>.';};
  L.$('#kc').onclick=()=>{cut=true;seen.add(foot);draw();
    L.$('#ksay').innerHTML=foot?'<b class="k">WITH THE FOOTNOTE</b>Rainbow’s End matches at once, so the cut wins nobody over: B. B. Lean just earns $70,000 instead of $72,000. No reason to cut.':'<b class="k">NO FOOTNOTE</b>The cutter takes the customers: $110,000 against $24,000 (the book’s numbers). The temptation of the dilemma.';
    if(seen.size===2&&!L.$('h1.q').dataset.d){L.$('h1.q').dataset.d=1;L.sheet('info','A threat, made possible by print','The '+L.g('meet-clause','meet-the-competition clause')+' is a threat (“cut, and I match”) that lets Rainbow’s End respond after seeing the other catalog. Here the what is the threat to match any cut; the how is the printed footnote that makes it possible and believable.');L.done();}};}},

{part:1,src:'Chapter 6 · Threats and Promises',
 solve:async L=>{const c=L.$$('.rc-c .chip'),r=L.$$('.rc-r .chip');c[0].click();r[0].click();c[1].click();r[1].click();},
 run(L){

    if(got.has('threat')&&got.has('promise')&&!L.$('h1.q').dataset.d){L.$('h1.q').dataset.d=1;L.sheet('info','Both flip the builder','The threat punishes lateness; the promise rewards finishing on time. Look at the tags: they don’t cost the same. The “anyway” box matters too: a rule that just repeats what Tali would do anyway changes nothing.');L.done();}}});

{part:1,src:'Chapter 6 · Similarities and Differences between Threats and Promises',
 solve:async L=>{L.$$('#wsv .sm-tap').forEach(g=>g.dispatchEvent(new MouseEvent('click',{bubbles:true})));},
 run(L){
  L.h(L.kick('learn','Who pays?')+'<h1 class="q">A threat and a promise, each when it works and when it fails. Tap all four boxes.</h1>'+
   '<svg class="sm-svg" id="wsv" viewBox="0 0 330 186" role="group" aria-label="Who pays: threat and promise, works or fails"></svg><div class="sm-say" id="wsay" aria-live="polite">Tap a box to see what it costs Tali.</div>');
  const C=[[0,0,'£0','never carried out','<b class="k">THREAT THAT WORKS</b>The builder finishes on time, so Tali never holds anything back. Free.'],
   [0,1,'carry it out','or back down','<b class="k">THREAT THAT FAILS</b>Tali must hold back the money and face the row, or back down and lose face.'],
   [1,0,'pay up','£300 bonus','<b class="k">PROMISE THAT WORKS</b>The builder delivers, so Tali must pay. A promise costs you exactly when it succeeds.'],
   [1,1,'£0','nothing to pay','<b class="k">PROMISE THAT FAILS</b>No on-time finish, no bonus.']];
  const open=new Set();
  function draw(){let s='<text x="130" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="var(--muted)">IT WORKS</text><text x="260" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="var(--muted)">IT FAILS</text>'+
    '<text x="30" y="72" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--no)">Threat</text><text x="30" y="132" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ok)">Promise</text>'+smStick(30,96)+smCarrot(30,168);
    C.forEach((c,j)=>{const x=68+c[1]*130,y=30+c[0]*78,o=open.has(j),pay=c[2]!=='£0';
      s+='<g class="sm-tap" data-j="'+j+'" role="button" tabindex="0" aria-label="'+(c[0]?'Promise':'Threat')+(c[1]?' fails':' works')+'"><rect class="f" x="'+x+'" y="'+y+'" width="124" height="72" rx="12" fill="'+(o?(pay?'var(--no-bg)':'var(--ok-bg)'):'var(--soft)')+'" stroke="'+(o?(pay?'var(--no-line)':'var(--ok-line)'):'var(--line)')+'" stroke-width="1.5"/>'+
       (o?'<text x="'+(x+62)+'" y="'+(y+33)+'" text-anchor="middle" font-size="15" font-weight="700" fill="var(--'+(pay?'no':'ok')+')">'+c[2]+'</text><text x="'+(x+62)+'" y="'+(y+52)+'" text-anchor="middle" font-size="12" fill="var(--muted)">'+c[3]+'</text>'
         :'<text x="'+(x+62)+'" y="'+(y+42)+'" text-anchor="middle" font-size="20" font-weight="700" fill="var(--faint)">?</text>')+'</g>';});
    L.$('#wsv').innerHTML=s;
    L.$$('#wsv .sm-tap').forEach(g=>{const f=()=>{const j=+g.dataset.j;open.add(j);L.$('#wsay').innerHTML=C[j][4];draw();
      if(open.size===4&&!L.$('h1.q').dataset.d){L.$('h1.q').dataset.d=1;L.sheet('info','Threats are cheap if they work; promises aren’t','That’s why a firm might wish it could use threats instead of bonuses. But the book notes a threat-only system fails when nobody can judge fairly who deserves the punishment. More on that soon.');L.done();}};
      g.onclick=f;g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();f();}};});}
  draw();}},

{part:1,src:'Chapter 6 · Similarities and Differences between Threats and Promises',pts:1,run(L){
  L.h(L.kick('try','Who pays?')+'<h1 class="q">Greer wants every timesheet in by Friday, and the whole team complies. Which rule cost Greer more?</h1>'+
   '<div class="sm-lanes" style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'+
   '<div class="sm-box sm-card" style="min-height:0"><span class="k">RULE A</span>Timesheet in by Friday, and you get Monday morning off.<div><span class="sm-stamp promise">PROMISE</span></div></div>'+
   '<div class="sm-box sm-card" style="min-height:0"><span class="k">RULE B</span>Miss Friday, and you lose the Monday morning off you already have.<div><span class="sm-stamp threat">THREAT</span></div></div></div><div style="height:12px"></div>');
  L.mc(L.card,['Rule A: everyone complied, so everyone gets the morning off','Rule B: everyone complied, so Greer must hand out mornings off','Both cost the same once everyone complies'],0,

   'Under Rule B people only lose something they already have if they miss Friday, and nobody did. The promise (Rule A) must be paid when it works: a morning off for everyone.');}},

{part:1,src:'Chapter 6 · Warnings and Assurances',pts:1,
 solve:async L=>{L.$$('#go2 .opt')[1].click();L.$('#gt').click();},
 run(L){
  L.h(L.kick('pr','Predict, then watch · “I’ll have to tell Greer”')+'<h1 class="q">Tali tells Linus: “Take credit for my work again and I’ll have to tell Greer.” Greer asks who did what in every review, and Tali always answers honestly. Does this change what Linus does?</h1>'+
   '<div id="gsv"></div><div class="opts" id="go2"></div><div class="sm-ctl sm-hide" id="gtw"><button class="chip" id="gt">Now suppose Tali would rather keep quiet</button></div><div class="sm-say sm-hide" id="gsay" aria-live="polite"></div>');
  let quiet=false,a=false;
  const draw=(played)=>{L.$('#gsv').innerHTML=smTL({ifT:'you take credit for my work again',thenT:'I tell Greer who did what',who:'Linus',
     stamp:played?(quiet?['threat','THREAT']:['warning','WARNING']):null,move:played?(quiet?['Stops, if he believes it',1]:['Takes credit anyway',0]):null,
     ghost:quiet?'Tali keeps quiet (hates conflict)':'Tali tells Greer (asked every review)',resp:null});};
  draw(false);
  ['Yes: it’s a threat, so Linus backs off','No: Tali would tell Greer anyway, so it’s only a warning','Yes: saying it out loud makes it binding'].forEach((t,j)=>{const b=document.createElement('button');b.className='opt';b.innerHTML='<span class="key">'+(j+1)+'</span><span>'+t+'</span>';
    b.onclick=()=>{if(a)return;a=true;const ok=j===1;L.award(ok);b.classList.add(ok?'ok':'no');if(!ok)L.$$('#go2 .opt')[1].classList.add('ok');draw(true);
      L.$('#gtw').classList.remove('sm-hide');L.$('#gsay').classList.remove('sm-hide');
      L.$('#gsay').innerHTML='<b class="k">WARNING</b>The “then” matches the “anyway” box. Linus already expected Greer to hear the truth, so the sentence passes on information but doesn’t change the game.';
      L.sheet(ok?'ok':'no',ok?'A warning, not a threat':'Look at the “anyway” box','A '+L.g('warning-assurance','warning')+' says what you’d do anyway. Now change what Tali would do anyway.');};L.$('#go2').appendChild(b);});
  L.$('#gt').onclick=()=>{if(!a)return;quiet=!quiet;L.$('#gt').classList.toggle('sel',quiet);draw(true);
    L.$('#gsay').innerHTML=quiet?'<b class="k">NOW IT’S A THREAT</b>Telling Greer goes against what Tali would want at the time. It could change Linus, <b>but only if he believes it</b>. That is why credibility is the key issue (next lesson).':'<b class="k">WARNING</b>Back to the honest-review case: information only.';
    if(quiet&&!L.$('h1.q').dataset.d){L.$('h1.q').dataset.d=1;L.sheet('info','Real moves go against your later interest','Threats and promises commit you to something you’d rather not do when the time comes. That’s what gives them power, and why '+L.g('credibility','credibility')+' is the whole question.');L.done();}};}},

/* ---------- PART 3: MAKE THEM WORK ---------- */
{part:2,src:'Chapter 6 · Deterrence and Compellence',
 solve:async L=>{L.$$('#dm .chip').forEach(b=>b.click());},
 run(L){
  L.h(L.kick('learn','Stop it, or get it done?')+'<h1 class="q">Stopping Linus taking credit needs no date. Getting Arlo’s written loan plan does. Try each.</h1>'+
   '<div id="dsv"></div><div class="sm-ctl" id="dm"></div><div class="sm-say" id="dsay" aria-live="polite">Pick a case.</div>');
  const M=[['Deter Linus','deter','<b class="k">DETERRENCE</b>To stop something, set a tripwire and let them decide whether to trip it. No deadline: it holds from now on. Threats suit this.'],
   ['Compel Arlo: no deadline','none','<b class="k">COMPELLENCE WITHOUT A DATE</b>“Send me a plan.” Arlo always means to, tomorrow. With no deadline, it never comes.'],
   ['… by Friday 5pm','fri','<b class="k">ADD A DEADLINE</b>Now there’s a moment that counts. It arrives, just before 5.'],
   ['… plus a reward for early','early','<b class="k">REWARD EARLY ACTION</b>“Send it by Wednesday and we’ll go through it over dinner, my treat.” Earlier is better for Arlo too, so it comes early. A promise suits compellence.']];
  const seen=new Set();
  M.forEach((m,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=m[0];b.onclick=()=>{[...L.$('#dm').children].forEach((x,q)=>x.classList.toggle('sel',q===j));
    L.$('#dsv').innerHTML=wkSvg(m[1]);L.$('#dsay').innerHTML=m[2];seen.add(j);
    if(seen.size===4&&!L.$('h1.q').dataset.d){L.$('h1.q').dataset.d=1;L.sheet('info','Deter with a tripwire; compel with a deadline',L.g('deter-compel','Deterrence')+' needs no date. Compellence must have one, or the other side just delays. In the book, a mother asking for a tidy room names a time (5pm today), and a special treat once it’s done.');L.done();}};L.$('#dm').appendChild(b);});
  L.$('#dsv').innerHTML=wkSvg('deter');}},

{part:2,src:'Chapter 6 · Deterrence and Compellence',pts:5,run(L){
  L.h('<div id="qk"></div><svg class="sm-svg" viewBox="0 0 330 112" role="img" aria-label="Quick reference: deter threat, deter promise, compel threat, compel promise" style="margin-top:12px">'+
   '<rect width="330" height="112" rx="14" fill="var(--soft)"/><text x="133" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="var(--muted)">DETER (stop it)</text><text x="262" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="var(--muted)">COMPEL (do it)</text>'+
   '<text x="10" y="52" font-size="12.5" font-weight="700" fill="var(--no)">Threat</text><text x="10" y="92" font-size="12.5" font-weight="700" fill="var(--ok)">Promise</text>'+
   [[70,30,'If you do it, I’ll hurt you'],[200,30,'If you don’t, by the date, I’ll hurt you'],[70,70,'If you don’t, I’ll reward you'],[200,70,'If you do it, I’ll reward you']].map(c=>'<rect x="'+c[0]+'" y="'+c[1]+'" width="124" height="36" rx="8" fill="var(--card)"/><foreignObject x="'+(c[0]+3)+'" y="'+(c[1]+2)+'" width="118" height="34"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:12px;line-height:1.25;color:var(--ink);text-align:center">'+c[2]+'</div></foreignObject>').join('')+'</svg>'+
   '<p class="sm-ro" style="margin-top:4px">The book’s quick reference, as statements made before the game</p>');
  L.quick(L.$('#qk'),'Deter or compel?',['Deter: stop it','Compel: get it done'],[
   ['Tali wants Linus to stop taking credit for shared work.',0,'Stopping something: a standing tripwire, no deadline.'],
   ['Tali wants the builder to finish Hedda’s bathroom.',1,'Getting something done: it needs a date, or it drifts.'],
   ['Tali wants the neighbours to stop leaving bikes across the store door.',0,'Stopping a habit: a rule that holds from now on.'],
   ['Tali wants Juno to book the holiday dates this week.',1,'An action by a date: compellence. “This week” is the deadline; a reward for doing it early helps.'],
   ['Tali wants Arlo to send the written loan plan.',1,'Getting something done: without “by Friday” it slides to tomorrow, forever.']]);}},

{part:2,src:'Chapter 6 · Similarities and Differences between Threats and Promises',
 solve:async L=>{const s=L.$('#sq');s.value=0;s.dispatchEvent(new Event('input',{bubbles:true}));s.value=10;s.dispatchEvent(new Event('input',{bubbles:true}));},
 run(L){
  L.h(L.kick('ex','Threat or promise? Move “normal”')+'<h1 class="q">The landlord says: “Sign for two years and the rise is 5%. Don’t, and it’s 10%.” Slide what counts as normal.</h1>'+
   '<div id="qsv"></div><label class="sm-sl"><span class="h"><span>What counts as normal</span><b id="qv"></b></span><input id="sq" type="range" min="0" max="10" step="1" value="5" aria-label="What counts as normal, rent rise 0 to 10 percent"></label>'+
   '<div class="sm-say" id="qsay" aria-live="polite"></div><p class="small">Illustrative numbers. The book’s version: a mugger who asks to borrow $20 and promises not to hurt you is really threatening.</p>');
  const seen=new Set();
  const draw=()=>{const n=+L.$('#sq').value,st=sqStamp(n);L.$('#qsv').innerHTML=sqSvg(n);L.$('#qv').textContent='+'+n+'% ('+(n===0?'today’s rent':n===10?'the announced rise':'in between')+')';
    L.$('#qsay').innerHTML='<span class="sm-stamp '+st[0]+'" style="margin:0 0 6px">'+st[1]+'</span><br>'+st[2];
    if(n<=5)seen.add('t');if(n>=10)seen.add('p');
    if(seen.size===2&&!L.$('h1.q').dataset.d){L.$('h1.q').dataset.d=1;L.sheet('info','Same words, different move','Whether it’s a threat or a promise depends only on what counts as the status quo. To read someone’s offer, first ask: compared with what?');L.done();}};
  L.$('#sq').addEventListener('input',draw);draw();}},

{part:2,src:'Chapter 6 · Clarity and Certainty',
 solve:async L=>{L.$('#cc1').click();L.$('#cc2').click();},
 run(L){
  L.h(L.kick('learn','Clear and certain')+'<h1 class="q">Two ways a response rule fails, and the fix for each. Flip both switches.</h1>'+
   '<svg class="sm-svg" id="c1" viewBox="0 0 330 104" role="img" aria-label="Chance of punishment if you work hard or slack"></svg><div class="sm-ctl"><button class="chip" id="cc1">Checks: arbitrary</button></div>'+
   '<svg class="sm-svg" id="c2" viewBox="0 0 330 128" role="img" aria-label="Exam penalty by minutes late"></svg><div class="sm-ctl"><button class="chip" id="cc2">Rule: refuse late papers</button></div>'+
   '<div class="sm-say" id="csay" aria-live="polite">Illustrative numbers, from two of the book’s examples.</div>');
  let fair=false,ramp=false;const seen=new Set();
  function d1(){const v=fair?[5,60]:[40,45];let s='<rect width="330" height="104" rx="14" fill="var(--soft)"/><text x="12" y="20" font-size="12" font-weight="700" fill="var(--muted)">CHANCE OF BEING PUNISHED</text>';
    [['work hard',v[0],'var(--ok-strong)'],['slack',v[1],'var(--no-strong)']].forEach((r,j)=>{const y=34+j*32;s+='<text x="12" y="'+(y+14)+'" font-size="12.5" font-weight="700" fill="var(--ink)">If you '+r[0]+'</text><rect x="128" y="'+y+'" width="160" height="18" rx="5" fill="var(--soft2)"/><rect x="128" y="'+y+'" width="'+(r[1]*1.6)+'" height="18" rx="5" fill="'+r[2]+'"/><text x="320" y="'+(y+14)+'" text-anchor="end" font-size="12.5" font-weight="700" fill="var(--ink)">'+r[1]+'%</text>';});
    L.$('#c1').innerHTML=s;L.$('#cc1').textContent='Checks: '+(fair?'clear and fair':'arbitrary');L.$('#cc1').classList.toggle('sel',fair);}
  function d2(){const X=m=>44+m*26,Y=p=>104-p*0.8;let s='<rect width="330" height="128" rx="14" fill="var(--soft)"/><text x="12" y="18" font-size="12" font-weight="700" fill="var(--muted)">PENALTY · MINUTES LATE</text><path d="M'+X(0)+' 104H'+X(10)+'M'+X(0)+' 104V24" stroke="var(--line2)" stroke-width="1.5"/>';
    for(let m=0;m<=10;m+=2)s+='<text x="'+X(m)+'" y="120" text-anchor="middle" font-size="12" fill="var(--muted)">'+m+'</text>';
    if(ramp)s+='<path d="M'+X(0)+' 104L'+X(10)+' '+Y(20)+'" stroke="var(--ok-strong)" stroke-width="3"/><text x="'+X(10)+'" y="40" text-anchor="end" font-size="12" font-weight="700" fill="var(--ok)">2 points a minute: credible</text>';
    else s+='<path d="M'+X(0)+' 104V'+Y(100)+'H'+X(10)+'" stroke="var(--no-strong)" stroke-width="3" stroke-dasharray="6 4"/><text x="'+X(5)+'" y="'+(Y(100)-6)+'" text-anchor="middle" font-size="12" font-weight="700" fill="var(--no)">refuse the paper: nobody believes it</text>';
    (ramp?[0,0,0.3,0.6]:[1,2,3,5,7]).forEach((m,j)=>{s+='<circle class="sm-t" style="animation-delay:'+j*60+'ms" cx="'+X(m)+'" cy="'+(98-j*7)+'" r="5" fill="var(--h2)"/>';});
    s+=ramp?'<text x="'+X(1.2)+'" y="72" font-size="12" fill="var(--h2)">students stop on time</text>':'<text x="'+X(8.4)+'" y="66" text-anchor="middle" font-size="12" fill="var(--h2)">students still writing</text>';
    L.$('#c2').innerHTML=s;L.$('#cc2').textContent='Rule: '+(ramp?'lose 2 points a minute':'refuse late papers');L.$('#cc2').classList.toggle('sel',ramp);}
  d1();d2();
  const fin=()=>{if(seen.size===2&&!L.$('h1.q').dataset.d){L.$('h1.q').dataset.d=1;L.sheet('info','Clarity, certainty, small steps','Say clearly what brings what. Make the response sure to follow. And meet '+L.g('salami','salami tactics')+' with small steps: a big all-or-nothing rule tempts people to slice past it. The same goes for rewards: a bonus that rises gradually can beat one big all-or-nothing target.');L.done();}};
  L.$('#cc1').onclick=()=>{fair=!fair;d1();seen.add(1);L.$('#csay').innerHTML=fair?'<b class="k">CLEAR</b>Punish only the slackers, and working hard pays.':'<b class="k">ARBITRARY</b>The book’s Soviet example: when checks were arbitrary, hard workers were punished almost as often as slackers. So why work?';fin();};
  L.$('#cc2').onclick=()=>{ramp=!ramp;d2();seen.add(2);L.$('#csay').innerHTML=ramp?'<b class="k">SMALL STEPS</b>The authors’ own exams: a few points off per minute is perfectly believable, so students stop on time.':'<b class="k">ALL OR NOTHING</b>Refusing a paper two minutes late isn’t believable, so students keep writing, one more minute at a time.';fin();};}},

{part:2,src:'Chapter 6 · Large Threats',pts:1,
 solve:async L=>{L.$$('#bk .chip')[0].click();L.$$('#bd .chip')[1].click();L.$$('#bs .chip')[1].click();const s=L.$('#ba');s.value=100;s.dispatchEvent(new Event('input',{bubbles:true}));L.$('#bgo').click();},
 run(L){
  L.h(L.kick('pr','Challenge · the builder’s card')+'<h1 class="q">Get the builder to finish by 15 March with a card that costs Tali nothing if it works. Your first send counts.</h1>'+
   '<div id="btl"></div><div class="sm-lights" id="bl"></div>'+
   '<div class="sm-lab">Kind</div><div class="sm-tiles" id="bk"><button class="chip sel">Threat: hold back money</button><button class="chip">Promise: pay a bonus</button></div>'+
   '<div class="sm-lab">Deadline</div><div class="sm-tiles" id="bd"><button class="chip sel">No date</button><button class="chip">By 15 March</button></div>'+
   '<div id="bsw"><div class="sm-lab">Shape</div><div class="sm-tiles" id="bs"><button class="chip sel">All at once if late</button><button class="chip">A bit per day late</button></div></div>'+
   '<label class="sm-sl"><span class="h"><span id="bal">Size</span><b id="bav"></b></span><input id="ba" type="range" min="0" max="2000" step="50" value="1000" aria-label="Size of the threat or promise in pounds"></label>'+
   '<div class="sm-ctl"><button class="btn pri" id="bgo">'+L.ic('arrow')+'Send the card</button></div>'+
   '<p class="small">Illustrative numbers: slipping earns the builder about £50 a day on another job, and they plan to slip 6 days.</p>');
  const k={kind:0,dl:0,per:0};let first=true;
  const pick=(id,key)=>L.$$('#'+id+' .chip').forEach((b,j)=>b.onclick=()=>{k[key]=j;if(key==='kind'&&j===1)k.per=0;if(key==='per'||key==='kind'){const a=L.$('#ba');if(k.kind===0&&k.per){a.max=400;a.step=10;if(+a.value>400)a.value=200;}else{a.max=2000;a.step=50;}}draw();});
  pick('bk','kind');pick('bd','dl');pick('bs','per');
  function judge(){const a=+L.$('#ba').value,thr=k.kind===0;let moves,bel,sal;
    if(thr&&k.per){moves=a>=50;bel=a<=200;sal=true;}else if(thr){moves=a>=300;bel=a<=1000;sal=false;}else{moves=a>=300;bel=a<=1500;sal=true;}
    const clear=!!k.dl,free=thr,works=clear&&moves&&bel&&sal;
    let mv=works?['Finishes by 15 March',1]:!clear?['“Next week, promise.” No date to miss',0]:!moves?['Slips anyway: slipping still pays',0]:!bel?['Shrugs: too big to be real',0]:['Slips one day at a time',0];
    return {a,thr,clear,moves,bel,sal,free,works,mv};}
  function draw(){const J=judge();
    L.$$('#bk .chip').forEach((b,j)=>b.classList.toggle('sel',j===k.kind));L.$$('#bd .chip').forEach((b,j)=>b.classList.toggle('sel',j===k.dl));L.$$('#bs .chip').forEach((b,j)=>b.classList.toggle('sel',j===k.per));
    L.$('#bsw').hidden=!J.thr;L.$('#bal').textContent=J.thr?(k.per?'Held back per day late':'Held back if late'):'Bonus if on time';L.$('#bav').textContent='£'+J.a+(J.thr&&k.per?' a day':'');
    const date=k.dl?'after 15 March':'late';
    L.$('#btl').innerHTML=smTL({ifT:J.thr?'you finish '+date:'you finish '+(k.dl?'by 15 March':'on time'),thenT:J.thr?(k.per?'I hold back £'+J.a+' for each day':'I hold back £'+J.a):'I pay a £'+J.a+' bonus',
      stamp:J.thr?['threat','THREAT']:['promise','PROMISE'],who:'Builder',move:J.mv,ghost:'Tali pays the agreed price',resp:null});
    const li=[['Clear: has a date',J.clear],['Moves the builder',J.moves],['Believable size',J.bel],['Beats small slips',J.sal],['£0 if it works',J.free]];
    L.$('#bl').innerHTML=li.map(x=>'<span class="'+(x[1]?'on':'bad')+'"><i></i>'+x[0]+'</span>').join('');}
  L.$('#ba').addEventListener('input',draw);draw();
  L.$('#bgo').onclick=()=>{const J=judge(),ok=J.works&&J.free;if(first){L.award(ok);first=false;}
    if(ok)L.sheet('ok','Clear, certain, small, and free if it works','A modest charge for each day past a fixed date: every late day costs the builder more than it earns them, and Tali would really apply it. It’s fair too: the builder only pays for days they are actually late.');
    else{const why=!J.clear?'Without a date, “late” never arrives. Compellence needs a deadline.':!J.moves?'Too small: slipping still pays the builder more than the card costs them.':!J.bel?'Too big: nobody believes Tali would hold back that much over a few days, and if it went wrong, Tali would have to. Keep a threat as small as works.':!J.sal?'All at once invites salami tactics: one day late, would Tali really hold back the whole sum? The builder slips a day at a time. Try a bit per day.':'It works, but a promise that works must be paid: £'+J.a+'. A promise also builds goodwill; still, find the card that costs nothing if it works.';
      L.sheet('no','Not yet',why+' Adjust and send again.');}
    L.done();};}},

{part:2,src:'Chapter 6 · Case Study: Two Wrongs Keep Things Right',run(L){
  L.h(L.kick('ex','A case from the book')+'<h1 class="q">How do you make a threat you’d hate to carry out believable? Bring in someone who will hold you to it.</h1>');
  const line=(m)=>'<svg class="sm-svg" viewBox="0 0 260 66" role="img" aria-label="Weight line with a 175 pound limit'+(m?' and a marker at 190':'')+'"><rect width="260" height="66" rx="12" fill="var(--soft)"/><path d="M14 36H246" stroke="var(--line2)" stroke-width="3"/>'+
    '<path d="M80 22V50" stroke="var(--no-strong)" stroke-width="3"/><text x="80" y="16" text-anchor="middle" font-size="12" font-weight="700" fill="var(--no)">175 lb limit</text>'+
    '<text x="250" y="60" text-anchor="end" font-size="12" fill="var(--muted)">$1,000 a pound over</text>'+
    (m?'<rect x="80" y="30" width="'+(15*9)+'" height="12" rx="4" fill="var(--no-bg)" stroke="var(--no-line)"/><circle cx="215" cy="36" r="8" fill="var(--h2)"/><text x="215" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="var(--h2)">friend: 190</text>':'')+'</svg>';
  const cap=t=>'<p class="sm-ro" style="margin:4px 0 0">'+t+'</p>';
  L.beats(L.card,[
   ['Two parents','<svg class="sm-svg" viewBox="0 0 260 92" role="img" aria-label="Two parents linked by an agreement, both facing the child"><rect width="260" height="92" rx="12" fill="var(--soft)"/>'+smPerson(36,24,'h1','','')+smPerson(224,24,'h2','','')+
    '<path d="M58 40H202" stroke="var(--pri)" stroke-width="3" stroke-dasharray="6 4"/><rect x="80" y="28" width="100" height="22" rx="7" fill="var(--card)" stroke="var(--pri)" stroke-width="1.5"/><text x="130" y="43.5" text-anchor="middle" font-size="12" font-weight="700" fill="var(--pri)">our agreement</text>'+
    '<circle cx="110" cy="72" r="9" fill="var(--h3-bg)" stroke="var(--h3)" stroke-width="2"/><text x="126" y="77" font-size="12" fill="var(--muted)">the child</text></svg>'+
    cap('Letting the child off would break the parents’ deal, so the punishment is believable.')],
   ['A weight contract',line(false)+cap('Economist Dean Karlan and a friend: over 175 lb, pay the other $1,000 a pound.')],
   ['The test',line(true)+cap('The friend hit 190. Karlan collected $15,000.')],
   ['Why collect?','<svg class="sm-svg" viewBox="0 0 260 96" role="img" aria-label="Karlan and his friend each hold a penalty over the other; collecting keeps both real"><rect width="260" height="96" rx="12" fill="var(--soft)"/>'+
    smPerson(36,18,'h1','Karlan','')+smPerson(224,18,'h2','Friend','')+smArrow(62,30,196,30,'var(--h1)',2.5)+smArrow(198,62,64,62,'var(--h2)',2.5)+
    '<rect x="78" y="36" width="104" height="20" rx="6" fill="var(--ok-bg)"/><text x="130" y="50" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ok)">both threats real</text></svg>'+
    cap('Letting his friend off would have made his own penalty empty too.')]],
   'A threat you couldn’t bring yourself to carry out isn’t a threat. Tie it to a partner who will hold you to it. The next lesson collects the ways to make moves believable.');}},

/* ---------- PART 4: USE IT THIS WEEK ---------- */
{part:3,src:'Course application · built on Chapter 6',pts:1,
 solve:async L=>{L.$('#ob').click();L.$$('#oc .opt')[1].click();L.$$('#oc .chip')[0].click();L.$('#ob').click();L.$('#ob').click();L.$$('#oc .opt')[1].click();},
 run(L){
  L.h(L.kick('pr','One-minute move · commit, threaten or promise')+'<h1 class="q">Linus keeps bumping Tali’s booking of the shared senior designer on Friday night. Run the move.</h1>'+
   L.note('How this course applies the book: the tool’s five steps, run on the rule card.','compass')+
   '<div class="sm-steps" id="osp"><span>1 · If nothing changes</span><span>2 · Pick the move</span><span>3 · Deter or compel</span><span>4 · Real, not a warning</span><span>5 · Clear, certain, small</span></div>'+
   '<div id="otl"></div><div class="sm-say" id="osay" aria-live="polite"></div><div id="oc"></div><div class="sm-ctl"><button class="btn pri" id="ob"></button></div>');
  let s=0,first=true;const G='Tali grumbles, then gives way';
  const tl=o=>L.$('#otl').innerHTML=smTL(Object.assign({who:'Linus',ghost:G,resp:null},o));
  const say=(h,x)=>L.$('#osay').innerHTML='<b class="k">'+h+'</b>'+x;
  const opts=(list,right,onOk,onNo)=>{L.$('#oc').innerHTML='';list.forEach((t,j)=>{const b=document.createElement('button');b.className='opt';b.innerHTML='<span class="key">'+(j+1)+'</span><span>'+t+'</span>';
    b.onclick=()=>{if(j===right){b.classList.add('ok');onOk();}else{b.classList.add('no');onNo(j);}};L.$('#oc').appendChild(b);});};
  function go(n){s=n;L.$$('#osp span').forEach((p,j)=>p.className=j<n?'dn':j===n?'cur':'');const b=L.$('#ob');b.hidden=false;
    if(n===0){tl({cardK:'NO RULE YET',cardT:'Nothing set in advance.',move:['Bumps Tali’s booking, again',0]});say('STEP 1 · IF NOTHING CHANGES','Linus bumps Tali every Friday night, and Tali’s projects slip. Changing nothing means more of the same.');b.innerHTML=L.ic('play')+'Pick a move';}
    if(n===1){b.hidden=true;say('STEP 2 · WHICH MOVE?','Tali wants to <b>stop</b> something. Which move fits?');
      opts(['Commit: book the designer for every day of next month, right now','Threaten: set a rule for what happens if he bumps a booking late','Promise: buy Linus lunch every week he doesn’t bump Tali'],1,
       ()=>{if(first){L.award(true);first=false;}go(2);},
       j=>{if(first){L.award(false);first=false;}say('NOT THAT ONE',j===0?'Grabbing every slot invites Linus to do the same: two commitments at once is the crash in chicken. It also isn’t fair to his clients.':'A promise costs Tali every week it works. To stop something, a threat is cheaper: it costs nothing if it works.');});}
    if(n===2){b.hidden=true;say('STEP 3 · DETER OR COMPEL?','Stopping a habit, or getting something done by a date?');L.$('#oc').innerHTML='<div class="sm-ctl"><button class="chip">Deter: stop it</button><button class="chip">Compel: get it done</button></div>';
      const c=L.$$('#oc .chip');c[1].onclick=()=>{c[1].classList.add('sel');say('LOOK AGAIN','Tali wants bumping to stop. That’s deterrence: a standing rule, no deadline.');};
      c[0].onclick=()=>{L.$('#oc').innerHTML='';tl({ifT:'you bump my booking after Thursday noon',thenT:'I ask Greer to decide the clash',move:null});say('STEP 3 · DETER','A tripwire that holds from now on. Next: is it a real threat? Check the “anyway” box.');b.hidden=false;b.innerHTML=L.ic('eye')+'Check the “anyway” box';};}
    if(n===3){tl({ifT:'you bump my booking after Thursday noon',thenT:'I ask Greer to decide the clash',stamp:['threat','THREAT'],move:null});
      say('STEP 4 · REAL, NOT A WARNING','Left alone, Tali would give way. Going to Greer is awkward for Tali, so this changes what Linus expects. Real threat. (Will he believe it? Next lesson.)');b.innerHTML=L.ic('play')+'Size it';}
    if(n===4){b.hidden=true;say('STEP 5 · CLEAR, CERTAIN, SMALLEST THAT WORKS','Which wording?');
      opts(['“Do it again and I quit.”','“After Thursday noon, any clash goes to Greer.”','“Please be more considerate.”'],1,
       ()=>{L.$('#oc').innerHTML='';L.$$('#osp span').forEach(p=>p.className='dn');tl({ifT:'you bump my booking after Thursday noon',thenT:'any clash goes to Greer',stamp:['threat','THREAT'],move:['Books by Thursday noon',1],resp:'Costs £0 if it works'});
        say('DONE','Clear (a cut-off time), certain (one fixed reply), small (no drama), and free if it works.');
        L.sheet('ok','About a minute, start to finish','If nothing changes → a threat, because Tali wants something stopped → no deadline needed → real, since Tali would otherwise give way → a clear cut-off and a modest reply.');L.done();},
       j=>say('TOO '+(j===0?'BIG':'VAGUE'),j===0?'Quitting over a calendar clash isn’t believable or usable. Keep a threat as small as works.':'No clear trigger and no reply: Linus can’t tell what’s off-limits.'));}}
  L.$('#ob').onclick=()=>{if(s===0)go(1);else if(s===2)go(3);else if(s===3)go(4);};
  go(0);}},

{part:3,src:'Chapter 6 · Other Players’ Strategic Moves',
 solve:async L=>{L.$$('#lm .chip').forEach(b=>b.click());},
 run(L){
  L.h(L.kick('ex','Edge cases and limits')+'<h1 class="q">Where do strategic moves stop working, or backfire? Try each case.</h1>'+
   '<div id="lsv"></div><div class="sm-say" id="lsay" aria-live="polite"></div><div class="sm-ctl" id="lm"></div>');
  const both=()=>{let s='<rect x="6" y="62" width="318" height="44" fill="var(--soft2)"/><path d="M12 84H318" stroke="var(--line2)" stroke-width="2" stroke-dasharray="10 8"/>'+carSvg(122,84,1,'h1','You')+carSvg(208,84,-1,'h4','Rival')+wheelSvg(124,32)+wheelSvg(206,32)+
     '<g class="sm-t" style="animation-delay:400ms"><path d="M165 60l6 14 14-4-9 12 10 11-15-2-6 14-6-14-15 2 10-11-9-12 14 4z" fill="var(--no-strong)"/></g><text x="165" y="124" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--no)">both wheels gone: nobody can swerve</text>';return roadSvg(s,132,'Both drivers throw their wheels at once and crash');};
  const big=()=>{let s='<text x="12" y="22" font-size="12.5" font-weight="700" fill="var(--ink)">“Book the designer again and I quit.”</text>';
    [['Moves Linus?',100,'var(--ok-strong)'],['Believable?',8,'var(--no-strong)'],['Cost if it goes wrong',100,'var(--no-strong)']].forEach((r,j)=>{const y=38+j*28;s+='<text x="12" y="'+(y+13)+'" font-size="12" fill="var(--ink)">'+r[0]+'</text><rect x="150" y="'+y+'" width="168" height="16" rx="5" fill="var(--soft2)"/><rect x="150" y="'+y+'" width="'+(r[1]*1.68)+'" height="16" rx="5" fill="'+r[2]+'"/>';});
    s+='<text x="318" y="138" text-anchor="end" font-size="12" fill="var(--muted)">the cost: Tali’s job, over a calendar</text>';return roadSvg(s,148,'A threat too big to believe or use');};
  const boats=()=>{let s='<rect x="6" y="6" width="318" height="120" rx="12" fill="var(--h1-bg)" opacity=".6"/>';
    const sail=(x,y,c,l)=>'<path d="M'+(x-16)+' '+(y+14)+'h32l-6 8h-20z" fill="var(--'+c+')"/><path d="M'+x+' '+(y+12)+'V'+(y-22)+'L'+(x+14)+' '+(y+8)+'z" fill="var(--card)" stroke="var(--'+c+')" stroke-width="2"/><text x="'+x+'" y="'+(y+38)+'" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">'+l+'</text>';
    s+=sail(110,52,'h4','In front: copies')+sail(230,74,'h2','Behind: tacks first')+smArrow(230,44,200,28,'var(--h2)',2.5)+'<g class="sm-t" style="animation-delay:300ms">'+smArrow(110,24,82,10,'var(--h4)',2.5)+'</g>';
    return roadSvg(s,132,'Two sailing boats: the one behind tacks, the one in front copies');};
  const fork=()=>{let s=smPerson(36,44,'h1','Tali','')+'<path d="M62 72L150 26M62 72H150M62 72L150 114" stroke="var(--line2)" stroke-width="4" stroke-linecap="round"/>'+
     '<text x="158" y="30" font-size="12.5" fill="var(--ink)">do what they ask</text><text x="158" y="76" font-size="12.5" fill="var(--ink)">say no</text><text x="158" y="118" font-size="12.5" fill="var(--ink)">another option</text>'+
     '<g class="sm-t" style="animation-delay:300ms"><path d="M106 63l18 18M124 63l-18 18M98 84l18 18M116 84l-18 18" stroke="var(--no-strong)" stroke-width="3"/><text x="158" y="92" font-size="12" font-weight="700" fill="var(--no)">now punished</text><text x="158" y="134" font-size="12" font-weight="700" fill="var(--no)">now punished</text></g>';
    return roadSvg(s,142,'A threat from others can only make some of your options worse');};
  const salami=()=>{let s='<path d="M120 20V112" stroke="var(--no-strong)" stroke-width="3"/><text x="120" y="128" text-anchor="middle" font-size="12" font-weight="700" fill="var(--no)">time’s up</text>';
    for(let j=0;j<6;j++)s+='<g class="sm-t" style="animation-delay:'+j*120+'ms"><ellipse cx="'+(140+j*30)+'" cy="62" rx="11" ry="26" fill="var(--no-bg)" stroke="var(--no-strong)" stroke-width="2"/><circle cx="'+(137+j*30)+'" cy="55" r="2.5" fill="var(--card)"/><circle cx="'+(143+j*30)+'" cy="70" r="2" fill="var(--card)"/><text x="'+(140+j*30)+'" y="104" text-anchor="middle" font-size="12" fill="var(--muted)">+1</text></g>';
    s+='<text x="20" y="54" font-size="12.5" font-weight="700" fill="var(--ink)">“Just one</text><text x="20" y="70" font-size="12.5" font-weight="700" fill="var(--ink)">more minute”</text>';return roadSvg(s,136,'Slices of extra minutes past a deadline');};
  const P=[['Warning, not threat',()=>smTL({ifT:'you take credit again',thenT:'I tell Greer',stamp:['warning','WARNING'],who:'Linus',move:['Carries on',0],ghost:'Tali tells Greer anyway',resp:null}),'If you’d do it anyway, saying it changes nothing. Only a rule that goes against your later interest is a strategic move.'],
   ['No deadline',()=>wkSvg('none'),'To get something done, set a date, or “tomorrow” wins every day. Add a reward for acting early.'],
   ['Too big',big,'The book’s dinner guest: threatening to smash someone’s head unless they pass the salt. Huge threats aren’t believed, and if things go wrong you must carry them out or back down. Keep it as small as works.'],
   ['Both throw the wheel',both,'The book’s warning: moves are seen with a delay. If both commit at the same moment, both are stuck: a crash. Try these devices at your own risk.'],
   ['Let them go first',boats,'The book’s sailing tale: the boat in front copies whatever the boat behind does. When following wins, let the other side commit first.'],
   ['Never let them threaten you',fork,'You could always do what they want without the threat; a threat only makes your other options worse. Don’t set things up so others can threaten you.'],
   ['Salami tactics',salami,'People slip past a rule a slice at a time, and no one slice seems worth the big punishment. Answer small steps with small steps: a bit per minute or per day.']];
  const seen=new Set();
  P.forEach((p,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=p[0];b.onclick=()=>{[...L.$('#lm').children].forEach((x,q)=>x.classList.toggle('sel',q===j));
    L.$('#lsv').innerHTML=p[1]();L.$('#lsay').innerHTML='<b class="k">'+p[0].toUpperCase()+'</b>'+p[2];seen.add(j);
    if(seen.size===P.length&&!L.$('h1.q').dataset.d){L.$('h1.q').dataset.d=1;L.sheet('info','Know the limits','A move is worthless unless believed (next lesson), risky if both sides commit at once, and backfires if too big, vague or undated. When you step up the size of a threat bit by bit, that becomes '+L.g('brinkmanship','brinkmanship')+', also in the next lesson.');L.done();}};L.$('#lm').appendChild(b);});
  L.$('#lm').children[0].click();}},

{part:3,src:'Chapter 6 · Other Players’ Strategic Moves',
 solve:async L=>{L.$$('#pm .chip').forEach(b=>b.click());},
 run(L){
  L.h(L.kick('ex','Where cooperation wins')+'<h1 class="q">Tali and Linus both stay late to look keen, and both lose their evenings. Can one move fix it for both?</h1>'+
   '<svg class="sm-svg" id="psv" viewBox="0 0 330 140" role="img" aria-label="Evening bars for Tali and Linus"></svg><div class="sm-ctl" id="pm"></div><div class="sm-say" id="psay" aria-live="polite">Pick Tali’s move. Points from lesson 3, illustrative.</div>');
  const M=[['No move',[21,21],[2,2],'<b class="k">NO MOVE</b>Both stay till 9. Each would rather both left at 6.'],
   ['Commit: “I leave at 6, whatever”',[18,21],[1,4],'<b class="k">COMMITMENT</b>Linus simply exploits it: he stays and looks keener. Tali ends worse off.'],
   ['Promise: “I leave at 6 as long as you do”',[18,18],[3,3],'<b class="k">PROMISE</b>Now staying late only drags Tali back too, so Linus leaves at 6. Both better off.']];
  const seen=new Set();
  function draw(j){const m=M[j],X=h=>34+(h-17)*60;let s='<rect width="330" height="140" rx="14" fill="var(--soft)"/>';
    [17,18,19,20,21].forEach(h=>{s+='<text x="'+X(h)+'" y="20" text-anchor="middle" font-size="12" fill="var(--muted)">'+(h-12)+'pm</text><path d="M'+X(h)+' 26V112" stroke="var(--line)" stroke-width="1"/>';});
    ['Tali','Linus'].forEach((n,r)=>{const y=40+r*40,end=m[1][r];s+='<rect class="sm-t" x="'+X(17)+'" y="'+y+'" width="'+(X(end)-X(17))+'" height="22" rx="6" fill="var(--'+(end>18?'no-strong':'ok-strong')+')"/><text x="'+(X(17)+8)+'" y="'+(y+15.5)+'" font-size="12.5" font-weight="700" fill="var(--card)">'+n+'</text>'+
      '<text x="322" y="'+(y+15.5)+'" text-anchor="end" font-size="12.5" font-weight="700" fill="var(--ink)">'+m[2][r]+' pts</text>';});
    s+='<text x="165" y="132" text-anchor="middle" font-size="12" fill="var(--muted)">bar = time at the studio after 5pm</text>';L.$('#psv').innerHTML=s;}
  draw(0);
  M.forEach((m,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=m[0];b.onclick=()=>{[...L.$('#pm').children].forEach((x,q)=>x.classList.toggle('sel',q===j));draw(j);L.$('#psay').innerHTML=m[3];seen.add(j);
    if(seen.size===3&&!L.$('h1.q').dataset.d){L.$('h1.q').dataset.d=1;L.sheet('info','Promises can help both sides','The book: in a prisoners’ dilemma, both gain if even one side can make a believable promise, but it must be conditional, or the other just exploits it. You never gain by letting others threaten you, yet you may welcome their promises. Between people who meet daily, it’s also an assurance: keeping it pays anyway.');L.done();}};L.$('#pm').appendChild(b);});}},

{part:3,src:'Course application · built on Chapter 6',pts:6,run(L){
  L.h(L.kick('pr','Tali’s week')+'<h1 class="q">Which move is each one?</h1>');
  L.buckets(L.card,['Commitment','Threat','Promise','Warning or assurance'],[
   ['Tali sets up an automatic transfer to the holiday fund every payday.',0,'Unconditional: Tali fixes the action in advance, and payday Tali can only adjust.'],
   ['“Finish after 15 March and I hold back £100 for each day late.” (Tali would otherwise pay in full.)',1,'A response rule that punishes the move Tali doesn’t want, against what Tali would do anyway.'],
   ['“Send the plan by Wednesday and dinner’s on me.” (Tali wouldn’t otherwise treat Arlo.)',2,'A reward for the move Tali wants, by a date: a compellent promise.'],
   ['“If the rent goes up 10%, we’ll look at other flats.” (Tali and Juno would look anyway.)',3,'They’d do it anyway, so it’s a warning: useful information for the landlord, not a strategic move.'],
   ['Tali books a non-refundable train to Hedda’s for every second Sunday.',0,'Tali cuts off the option of a lazy Sunday in advance: a commitment.'],
   ['“If you cook, I’ll wash up,” Tali tells Juno, as Tali always does anyway.',3,'What Tali would do anyway, said out loud: an assurance.']],
   'Commitment fixes your own action. Threats and promises set a reply to their move. If you’d do it anyway, it’s only information.');}},

{part:3,src:'Course application · built on Chapter 6',
 solve:async L=>{L.$$('#yw .chip')[0].click();L.$$('#ym .chip')[0].click();L.$$('#ya .chip')[1].click();L.$('#y1').value='spending the holiday money';L.$('#y2').value='set up an automatic transfer on payday';
   ['#y1','#y2'].forEach(s=>L.$(s).dispatchEvent(new Event('input',{bubbles:true})));L.$('#yb').click();},
 run(L){
  L.h(L.kick('pr','Your turn · ungraded')+'<h1 class="q">One behaviour you want to change, yours or someone else’s. Make its card.</h1>'+
   L.note('How this course applies the book: the one-minute move on your own situation.','compass')+
   '<span class="sm-fl">WHOSE BEHAVIOUR?</span><div class="sm-ctl l" id="yw"></div>'+
   '<label class="sm-fl" for="y1">THE BEHAVIOUR (IF NOTHING CHANGES)</label><input class="sm-in" id="y1" maxlength="70" placeholder="e.g. replies to my emails a week late">'+
   '<span class="sm-fl">THE MOVE</span><div class="sm-ctl l" id="ym"></div>'+
   '<label class="sm-fl" for="y2">THE RULE OR ACTION (WITH A DATE IF YOU NEED ACTION)</label><input class="sm-in" id="y2" maxlength="90" placeholder="e.g. if it’s in by Friday, I’ll …">'+
   '<span class="sm-fl">WOULD I DO THIS ANYWAY?</span><div class="sm-ctl l" id="ya"></div>'+
   '<div class="sm-ctl"><button class="btn pri" id="yb" disabled>'+L.ic('pencil')+'Make my card</button></div><div id="ysv"></div>');
  const st={w:null,m:null,a:null};
  const chips=(id,key,list)=>list.forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=n;b.onclick=()=>{st[key]=j;[...L.$('#'+id).children].forEach((x,q)=>x.classList.toggle('sel',q===j));chk();};L.$('#'+id).appendChild(b);});
  const W=['Future me','A partner or flatmate','A colleague','Family','Someone I pay'];
  chips('yw','w',W);chips('ym','m',['Commit','Threaten','Promise']);chips('ya','a',['Yes','No']);
  const v=s=>L.$(s).value.trim();const chk=()=>{L.$('#yb').disabled=!(st.w!=null&&st.m!=null&&st.a!=null&&v('#y1').length>1&&v('#y2').length>1);};
  ['#y1','#y2'].forEach(s=>L.$(s).addEventListener('input',chk));
  L.$('#yb').onclick=()=>{const m=st.m,any=st.a===0;
    const stamp=m===0?['commit','COMMITMENT']:any?(m===1?['warning','WARNING']:['assurance','ASSURANCE']):(m===1?['threat','THREAT']:['promise','PROMISE']);
    L.$('#ysv').innerHTML=smTL({cardK:'MY CARD',cardT:'<b style="color:var(--ink)">'+L.esc(v('#y2'))+'</b>',stamp,who:W[st.w],move:any&&m?['No change expected',0]:['Should change',1],ghost:any?'I’d do it anyway':'I’d rather not, later',resp:null})+
     '<p class="sm-ro">Changing: <b>'+L.esc(v('#y1'))+'</b></p>';
    const tip=m===0?'Make it cheap and hard to undo, like the automatic transfer. If a gap appears, add another device.':any?'Since you’d do it anyway, say it plainly as information. It won’t change the game, and that’s fine.':m===1?'Check it’s clear, certain and as small as works, with no deadline if you’re stopping something. Would they believe you? That’s the next lesson.':'Remember a promise costs you when it works. For getting something done, give a date and reward acting early.';
    L.sheet('info','Your card is ready',tip+' Try it this week and note what happened.');L.done();};}},

{part:3,src:'Course application · built on Chapter 6',run(L){
  L.h(L.kick('learn','Your strategy map')+'<h1 class="q">“Commit, threaten or promise” joins the map</h1>'+
   L.note('How this course applies the book. Later lessons fill the dashed gaps.','compass')+
   '<div class="sm-map" style="border-style:dashed"><b>Row zero · Is it a game at all? Will anyone react?</b></div><div id="sm"></div>'+
   '<p class="small">It’s the <b>first</b> tool when you want to change someone’s behaviour (or your own later self’s), and a later step when you take turns or need everyone on the same choice.</p>');
  L.$('#sm').innerHTML=SM_ROWS.map(r=>'<div class="sm-map'+(r[1][0]==='commit'?' hot':'')+'"><b>'+r[0]+(r[1][0]==='commit'?' · start here':'')+'</b><div class="r">'+
    r[1].map((k,j)=>(j?'<span class="ar">→</span>':'')+'<span class="m'+(k==='commit'?' cur':SM_TL[k][1]>7?' tbd':'')+'">'+(SM_TL[k][1]>7?'?':SM_TL[k][0])+'</span>').join('')+'</div></div>').join('');
  L.done();}}
  ]
});
</script>
