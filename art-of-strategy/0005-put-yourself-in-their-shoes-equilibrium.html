/* ---------- the shrinking grid ----------
   G = {R:{who,s,l:[labels]}, C:{who,s,l:[labels]}, p:[[ [rowPay,colPay], …], …], f:format, unit}
   Row player’s number sits lower-left, column player’s upper-right (as in the book’s tables). */
function eqGrid(L,host,G,o){
  o=o||{};const nR=G.R.l.length,nC=G.C.l.length;
  const st={xr:new Set(),xc:new Set(),gr:new Set(),gc:new Set(),ring:new Set(),star:false,fr:-1,fc:-1,pick:null,go:new Set(),bad:null,mode:o.mode||'view',t:0};
  const w=document.createElement('div');w.className='eq-wrap';host.appendChild(w);
  w.innerHTML='<div class="eq-leg"></div><div class="eq-g"></div><p class="ps-ro" aria-live="polite"></p>';
  const g=w.querySelector('.eq-g'),ro=w.querySelector('.ps-ro');
  const P=(i,j)=>G.p[i][j];
  const lr=()=>[...Array(nR).keys()].filter(i=>!st.xr.has(i));
  const lc=()=>[...Array(nC).keys()].filter(j=>!st.xc.has(j));
  const brR=j=>{const rs=lr(),m=Math.max(...rs.map(i=>P(i,j)[0]));return rs.filter(i=>P(i,j)[0]===m);};
  const brC=i=>{const cs=lc(),m=Math.max(...cs.map(j=>P(i,j)[1]));return cs.filter(j=>P(i,j)[1]===m);};
  const eqs=()=>{const out=[];lr().forEach(i=>lc().forEach(j=>{if(brR(j).includes(i)&&brC(i).includes(j))out.push([i,j]);}));return out;};
  function why(k,i){
    if(k==='r'){const rs=lr(),cs=lc();if(rs.length<2||st.xr.has(i)||cs.some(j=>brR(j).includes(i)))return null;
      const d=rs.find(q=>q!==i&&cs.every(j=>P(q,j)[0]>P(i,j)[0]));return d!==undefined?{dom:d}:{nbr:1};}
    const rs=lr(),cs=lc();if(cs.length<2||st.xc.has(i)||rs.some(q=>brC(q).includes(i)))return null;
    const d=cs.find(q=>q!==i&&rs.every(r=>P(r,q)[1]>P(r,i)[1]));return d!==undefined?{dom:d}:{nbr:1};}
  const blocker=(k,i)=>k==='r'?lc().find(j=>brR(j).includes(i)):lr().find(r=>brC(r).includes(i));
  function render(pop){
    w.querySelector('.eq-leg').innerHTML='<span><i style="background:var(--h1)"></i><b style="color:var(--h1)">'+G.R.who+'</b> picks a row · lower-left number</span><span><i style="background:var(--h2)"></i><b style="color:var(--h2)">'+G.C.who+'</b> picks a column · upper-right number</span>'+(G.unit?'<span>'+G.unit+'</span>':'');
    const rs=[...Array(nR).keys()].filter(i=>!st.gr.has(i)),cs=[...Array(nC).keys()].filter(j=>!st.gc.has(j));
    g.style.gridTemplateColumns=(o.hw||50)+'px repeat('+cs.length+',minmax(0,1fr))';
    const act=k=>(st.mode==='cross'||st.mode==='belief')&&(!o.only||o.only===k);
    let h='<div class="eq-k"><span class="c">'+G.C.s+' →</span><span class="r">↓ '+G.R.s+'</span></div>';
    cs.forEach(j=>{h+='<button class="eq-h c'+(st.xc.has(j)?' eq-x':'')+(st.fc===j?' foc':'')+'" data-s="c'+j+'"'+(act('c')&&!st.xc.has(j)?'':' disabled')+' aria-label="'+G.C.who+': '+G.C.l[j]+'">'+G.C.l[j]+'</button>';});
    rs.forEach(i=>{h+='<button class="eq-h r'+(st.xr.has(i)?' eq-x':'')+(st.fr===i?' foc':'')+'" data-s="r'+i+'"'+(act('r')&&!st.xr.has(i)?'':' disabled')+' aria-label="'+G.R.who+': '+G.R.l[i]+'">'+G.R.l[i]+'</button>';
      cs.forEach(j=>{const v=P(i,j),ra=st.ring.has('a'+i+'_'+j),rb=st.ring.has('b'+i+'_'+j),x=st.xr.has(i)||st.xc.has(j),star=st.star&&ra&&rb&&!x;
        const cls='eq-c'+(x?' eq-x':'')+(star?' star':'')+(!x&&!star&&(st.fc===j||st.fr===i)?' foc':'')+(st.pick&&st.pick[0]===i&&st.pick[1]===j?' pick':'')+(st.go.has(i+'_'+j)?' go':'')+(st.bad&&st.bad[0]===i&&st.bad[1]===j?' bad':'');
        const tag=o.onCell?'button':'div';
        h+='<'+tag+' class="'+cls+'" data-c="'+i+'_'+j+'" aria-label="'+G.R.s+' '+G.R.l[i]+', '+G.C.s+' '+G.C.l[j]+': '+G.R.s+' gets '+G.f(v[0])+', '+G.C.s+' gets '+G.f(v[1])+(star?', equilibrium':'')+'"><span class="a'+(ra?' rg':'')+'">'+G.f(v[0])+'</span><span class="b'+(rb?' rg':'')+'">'+G.f(v[1])+'</span><span class="s">'+L.ic('star')+'</span></'+tag+'>';});});
    g.innerHTML=h;
    if(pop){g.classList.remove('eq-pop');void g.offsetWidth;g.classList.add('eq-pop');}
    g.querySelectorAll('.eq-h').forEach(b=>b.onclick=()=>hdr(b.dataset.s[0],+b.dataset.s.slice(1),b));
    if(o.onCell)g.querySelectorAll('.eq-c').forEach(b=>b.onclick=()=>{const q=b.dataset.c.split('_').map(Number);o.onCell(q[0],q[1],b);});
  }
  function hdr(k,i,b){if(st.mode==='cross')cross(k,i,b);else if(st.mode==='belief')belief(k,i);}
  function cross(k,i,b){
    if((k==='r'?st.xr:st.xc).has(i))return false;
    const r=why(k,i);
    if(!r){if(b)L.shake(b);if(o.onReject)o.onReject(k,i,blocker(k,i));return false;}
    (k==='r'?st.xr:st.xc).add(i);st.ring.clear();st.star=false;st.fr=st.fc=-1;render();
    if(o.onCross)o.onCross(k,i,r);
    clearTimeout(st.t);st.t=setTimeout(()=>{if(!w.isConnected)return;st.xr.forEach(q=>st.gr.add(q));st.xc.forEach(q=>st.gc.add(q));render(true);if(o.onShrink)o.onShrink(lr().length,lc().length);},380);
    return true;}
  function belief(k,i){
    if(!o.keep)st.ring.clear();st.star=false;
    if(k==='c'){st.fc=i;st.fr=-1;brR(i).forEach(q=>st.ring.add('a'+q+'_'+i));}
    else{st.fr=i;st.fc=-1;brC(i).forEach(q=>st.ring.add('b'+i+'_'+q));}
    render();if(o.onBelief)o.onBelief(k,i,k==='c'?brR(i):brC(i));}
  function markAll(cb,fast){
    st.fr=st.fc=-1;st.ring.clear();st.star=false;const seq=[];
    lc().forEach(j=>seq.push(()=>brR(j).forEach(q=>st.ring.add('a'+q+'_'+j))));
    lr().forEach(i=>seq.push(()=>brC(i).forEach(q=>st.ring.add('b'+i+'_'+q))));
    if(fast){seq.forEach(f=>f());st.star=true;render();if(cb)cb(eqs());return;}
    let k=0;const dt=Math.min(150,1300/seq.length);
    const tick=()=>{if(!w.isConnected)return;if(k<seq.length){seq[k++]();render();setTimeout(tick,dt);}else{st.star=true;render();if(cb)cb(eqs());}};tick();}
  render();
  return {w,st,G,render,markAll,cross,belief,eqs,brR,brC,lr,lc,
    say(h){ro.innerHTML=h;},
    mode(m){st.mode=m;render();},
    showStars(){st.star=true;render();}};
}

const shirtQ=(p,o)=>Math.max(0,2800-100*p+80*o); /* the book’s rule, Workouts: Trip to the Gym No. 2 */
function shirtGame(R,C,cR,cB){return {R:{who:'Rainbow’s End',s:'RE',l:R.map(x=>'$'+x)},C:{who:'B. B. Lean',s:'BB',l:C.map(x=>'$'+x)},
  p:R.map(a=>C.map(b=>[(a-cR)*shirtQ(a,b),(b-cB)*shirtQ(b,a)])),f:v=>(v/1000).toFixed(1),unit:'Profit in $ thousands · the book’s example'};}
const G_SHIRT=()=>shirtGame([42,41,40,39,38],[42,41,40,39,38],20,20);
const G_GYM3=()=>Object.assign(shirtGame([37,36,35,34,33],[40,39,38,37,36],11.6,20),{unit:'Profit in $ thousands · the book’s example, RE’s cost now $11.60'});
const G_DUO=()=>Object.assign(shirtGame([80,40],[80,40],20,20),{unit:'Profit in $ thousands · computed from the book’s rule'});
const G_HUNT=()=>({R:{who:'Fred',s:'Fred',l:['Stag','Bison','Rabbit']},C:{who:'Barney',s:'Barney',l:['Stag','Bison','Rabbit']},

const G_VISIT=()=>({R:{who:'Tali',s:'Tali',l:['Sat','Sun','Skip']},C:{who:'Arlo',s:'Arlo',l:['Sat','Sun','Skip']},

/* ---------- the station meeting map (illustrative: how 20 possible Arlos choose) ---------- */
const ST_SP=[['plat','Platform 1',206,26],['clock','Main clock',160,112],['tick','Ticket hall',50,112],['info','Info desk',270,112],['cafe','Café',56,206],['lost','Lost property',262,206],['meet','Meeting point',160,206]];
function stWeights(s){
  if(s.sign&&s.habit)return {clock:11,meet:8,info:1};
  if(s.sign)return {meet:15,clock:2,info:2,lost:1};
  if(s.habit)return s.newc?{clock:16,info:2,lost:2}:{clock:17,info:1,lost:1,cafe:1};
  return s.newc?{info:6,lost:5,clock:4,tick:3,cafe:1,plat:1}:{clock:7,info:4,lost:4,tick:2,cafe:2,plat:1};}
function stIcon(id,x,y){
  const box='<rect x="'+(x-14)+'" y="'+(y-14)+'" width="28" height="28" rx="8" fill="var(--card)" stroke="var(--line2)" stroke-width="1.5"/>';
  if(id==='clock')return '<path d="M'+x+' '+(y+15)+'V'+(y+26)+'" stroke="var(--ink)" stroke-width="3"/><circle cx="'+x+'" cy="'+y+'" r="16" fill="var(--card)" stroke="var(--ink)" stroke-width="2.5"/><path d="M'+x+' '+(y-10)+'V'+y+'L'+(x+7)+' '+(y+4)+'" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/>';
  if(id==='plat')return box+'<text x="'+x+'" y="'+(y+5)+'" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink)">1</text>';

  if(id==='lost')return box+'<text x="'+x+'" y="'+(y+5)+'" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink)">?</text>';
  if(id==='tick')return box+'<rect x="'+(x-8)+'" y="'+(y-5)+'" width="16" height="10" rx="2" fill="none" stroke="var(--ink)" stroke-width="1.8"/><path d="M'+(x+2)+' '+(y-5)+'v10" stroke="var(--ink)" stroke-width="1.4" stroke-dasharray="2 2"/>';
  if(id==='cafe')return box+'<path d="M'+(x-7)+' '+(y-4)+'h11v5a5 5 0 0 1-11 0z" fill="none" stroke="var(--ink)" stroke-width="1.8"/><path d="M'+(x+4)+' '+(y-2)+'h2a2 2 0 0 1 0 4h-2" fill="none" stroke="var(--ink)" stroke-width="1.6"/>';
  return '<path d="M'+x+' '+(y+4)+'V'+(y+16)+'" stroke="var(--ink)" stroke-width="2.5"/><rect x="'+(x-15)+'" y="'+(y-14)+'" width="30" height="20" rx="5" fill="var(--h3)" /><path d="M'+(x-8)+' '+(y-4)+'h16M'+(x-4)+' '+(y-8)+'l-4 4 4 4M'+(x+4)+' '+(y-8)+'l4 4-4 4" fill="none" stroke="var(--card)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>';}
function stMap(L,host,o){
  o=o||{};const sw=Object.assign({habit:false,newc:false,sign:false},o.sw||{});let at=null,show=!o.hide;
  const w=document.createElement('div');host.appendChild(w);
  w.innerHTML='<svg class="ps-svg" viewBox="0 0 320 250" role="img" aria-label="Plan of the central station with the possible meeting spots and 20 dots for where 20 possible Arlos go"></svg>'+
   '<p class="ps-ro" aria-live="polite"></p><div class="ps-lab">Tali waits at…</div><div class="ps-ctl st-spots"></div>'+(o.switches?'<div class="ps-lab">What do they share?</div><div class="ps-ctl st-sw"></div>':'');
  const svg=w.querySelector('svg'),ro=w.querySelector('.ps-ro');
  const spots=()=>ST_SP.filter(s=>s[0]!=='meet'||sw.sign);
  const cnt=id=>stWeights(sw)[id]||0;
  function base(){
    let s='<rect x="4" y="4" width="312" height="44" rx="10" fill="var(--soft2)"/><path d="M12 18H308M12 34H308" stroke="var(--line2)" stroke-width="2"/>'+
      '<path d="'+Array.from({length:19},(_,k)=>'M'+(16+k*16)+' 15v22').join('')+'" stroke="var(--line2)" stroke-width="1.2"/>'+
      '<rect x="4" y="52" width="312" height="194" rx="12" fill="var(--soft)"/>'+
      '<g class="st-halo"></g>';
    spots().forEach(p=>{s+='<g class="st-sp" data-id="'+p[0]+'" tabindex="0" role="button" aria-label="Wait at '+p[1]+'">'+
      '<circle cx="'+p[2]+'" cy="'+p[3]+'" r="27" fill="transparent"/><circle class="st-me" cx="'+p[2]+'" cy="'+p[3]+'" r="21" fill="none" stroke="var(--h1)" stroke-width="3" opacity="0"/>'+stIcon(p[0],p[2],p[3])+
      (p[0]==='plat'?'<rect x="'+(p[2]+22)+'" y="'+(p[3]-8)+'" width="'+(p[1].length*6.2+12)+'" height="16" rx="8" fill="var(--card)" opacity=".92"/><text x="'+(p[2]+28)+'" y="'+(p[3]+4)+'" font-size="11" font-weight="600" fill="var(--ink)">'+p[1]+'</text></g>'
       :'<rect x="'+(p[2]-p[1].length*3.1-6)+'" y="'+(p[3]+23)+'" width="'+(p[1].length*6.2+12)+'" height="16" rx="8" fill="var(--card)" opacity=".92"/><text x="'+p[2]+'" y="'+(p[3]+35)+'" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink)">'+p[1]+'</text></g>');});
    s+='<g class="st-dots">'+Array.from({length:20},(_,k)=>'<circle class="st-dot" r="4.5" cx="0" cy="0" fill="var(--h2)" stroke="var(--card)" stroke-width="1.2" style="transform:translate(160px,240px);opacity:0"/>').join('')+'</g>'+
      '<g class="st-t" opacity="0"><circle r="9" fill="var(--h1)" stroke="var(--card)" stroke-width="2"/><text y="4" text-anchor="middle" font-size="11" font-weight="700" fill="var(--card)">T</text></g>';
    svg.innerHTML=s;
    svg.querySelectorAll('.st-sp').forEach(g=>{g.onclick=()=>api.pick(g.dataset.id);g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();api.pick(g.dataset.id);}};});
    const sp=w.querySelector('.st-spots');sp.innerHTML='';
    spots().forEach(p=>{const b=document.createElement('button');b.className='chip';b.dataset.id=p[0];b.textContent=p[1];b.onclick=()=>api.pick(p[0]);sp.appendChild(b);});
  }
  function draw(){
    const W=stWeights(sw),dots=svg.querySelectorAll('.st-dot');let k=0;
    spots().forEach(p=>{const n=W[p[0]]||0;for(let q=0;q<n&&k<20;q++,k++){const ring=Math.floor(q/8),a=(142+((q%8)*36.5+ring*18)%256)*Math.PI/180,r=25+ring*8;
      const x=p[0]==='plat'?p[2]-26-q*11:p[2]+r*Math.cos(a),y=p[0]==='plat'?p[3]:p[3]+r*Math.sin(a);dots[k].style.transform='translate('+x.toFixed(1)+'px,'+y.toFixed(1)+'px)';dots[k].style.opacity=show?1:0;}});
    let halo='';if(show)spots().forEach(p=>{if((W[p[0]]||0)>=12)halo+='<circle cx="'+p[2]+'" cy="'+p[3]+'" r="46" fill="var(--h3-bg)" stroke="var(--h3)" stroke-width="1.5" stroke-dasharray="4 3"/>';});
    svg.querySelector('.st-halo').innerHTML=halo;
    svg.querySelectorAll('.st-sp').forEach(g=>g.querySelector('.st-me').setAttribute('opacity',g.dataset.id===at?1:0));
    const t=svg.querySelector('.st-t'),p=ST_SP.find(s=>s[0]===at);
    if(p){t.setAttribute('opacity',1);t.setAttribute('transform','translate('+(p[2]+17)+','+(p[3]-17)+')');}else t.setAttribute('opacity',0);
    w.querySelectorAll('.st-spots .chip').forEach(b=>b.classList.toggle('sel',b.dataset.id===at));
    w.querySelectorAll('.st-sw .chip').forEach(b=>b.classList.toggle('sel',!!sw[b.dataset.k]));
    const glow=spots().filter(s=>(W[s[0]]||0)>=12).map(s=>s[1].toLowerCase());
    if(!at)ro.innerHTML=show?'Each dot is one possible Arlo. Tap a spot for Tali.':'Tap a spot for Tali. The Arlos are hidden until you choose.';
    else if(show){const n=cnt(at);ro.innerHTML='<b>'+n+' of 20</b> Arlos come to the '+p[1].toLowerCase()+': Tali meets Arlo <b>'+Math.round(n*5)+'%</b> of the time.'+(glow.length?' The '+glow[0]+' glows: obvious to both.':' No spot is obvious to both.');}
  }
  const api={wrap:w,sw,get at(){return at;},count:cnt,
    pick(id){at=id;draw();if(o.onPick)o.onPick(id,cnt(id),api);},
    toggle(k){sw[k]=!sw[k];if(k==='sign'&&!sw.sign&&at==='meet')at=null;base();draw();if(o.onToggle)o.onToggle(k,api);},
    reveal(){show=true;draw();}};
  if(o.switches){const s=w.querySelector('.st-sw');[['habit','Family habit: “we meet under the clock”'],['newc','Arlo is new to the city'],['sign','The station has a signposted meeting point']].forEach(q=>{
    const b=document.createElement('button');b.className='chip';b.dataset.k=q[0];b.textContent=q[1];b.onclick=()=>api.toggle(q[0]);s.appendChild(b);});}
  base();draw();return api;}

Course.lesson({
  id:'0005', title:'Put yourself in their shoes: equilibrium', minutes:20, icon:'eye',
  goals:['Find each side’s best reply when you both choose at once, and spot the equilibrium where the two replies meet',
         'Shrink a payoff table with Rules 3 and 4, and tell when an equilibrium is still bad for both',
         'Pick the focal point when there are several equilibria, and run the one-minute move on everyday “same time” choices'],
  parts:['Their move, your move','Cross out, then star','Several answers','Real people, real week'],
  read:'Read chapter 4 of the book, “A Beautiful Equilibrium”, for the full shirt-price tables, Schelling’s New York meeting and the Half Way case, and its Epilogue to Part I for Rules 1 to 4 in one place.',
  glossary:{
   dominated:'Dominated strategy: a choice that does worse for you than some other choice, whatever the other side does. Nobody sensible picks it.',
   'never-best':'Never a best response: a choice that isn’t your best reply to anything the other side might sensibly do. Like a dominated choice, you can cross it out.',
   'battle-game':'Battle of the sexes: the old name (from a 1950s story) for a game where both want to end up together but each prefers a different option.',
   chicken:'Chicken: a game where the one who gives way loses a little, but if neither gives way, both get their worst outcome.'
  },
  cheatsheet:[
   '<b>Best response</b>: your best choice given what you <i>believe</i> they’ll do. When you choose at once, you reply to a belief, not to a move you saw.',
   '<b>Nash equilibrium</b>: each choice is the best reply to the other, and each side’s belief turns out right. Nobody gains by switching alone.',
   '<b>Rule 3</b>: cross out dominated choices and ones that are never a best reply, again and again. <b>Rule 4</b>: then look for a box where both best replies meet.',
   'An equilibrium can still be bad for both: the book’s shirt sellers settle at $40 each ($40,000 profit) when $80 each would give $72,000. Shoppers gain.',
   'Several equilibria? Theory alone won’t pick one. Look for the <b>focal point</b>: obvious to both that it’s obvious to both (noon under the clock; whoever called first calls back).',
   'Battle (agree, but on which?) and chicken (who gives way?): one commits, you take turns, or you toss a coin. Fair rules, like equal splits, make strong focal points.',
   'Real people stop after two or three levels of “they think that I think” (Half Way: 50, then 25). Play to how people really reason; with experience, play moves toward equilibrium.',
   'One-minute move (how this course applies the book): list options → dominant choice? → cross out → mark best replies → several? find the focal point.'

{part:0,src:'Chapter 4 · Big Game of Coordination',

 run(L){
  let fin=false;
  L.h(L.kick('learn','Best response')+'<h1 class="q">The book’s hunters, Fred and Barney, set out at dawn without being able to talk. Where should Fred go?</h1>'+
   '<svg class="ps-svg" id="hmap" viewBox="0 0 320 206" role="img" aria-label="Map: stag grounds to the west, bison grounds to the east, a rabbit field in the middle, Fred’s cave and Barney’s cave at the bottom"></svg>'+
   '<p class="ps-ro" id="hro" aria-live="polite">Tap where Barney goes. Fred’s best reply lights up.</p>'+
   '<div class="ps-lab">If Fred believes Barney goes to…</div><div class="ps-ctl"><button class="chip" id="hbs">Stag grounds</button><button class="chip" id="hbb">Bison grounds</button><button class="chip" id="hbr">Rabbit field</button></div>'+
   '<p class="ps-ill">The book’s numbers: rabbits alone = 1 · big game together = 3 each · big game alone = 0</p>');
  const D={s:[64,52,'Stag grounds'],b:[256,52,'Bison grounds'],r:[160,116,'Rabbit field']},F=[38,176],B=[282,176];

  function arrow(a,b,col,dash){const dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy),ux=dx/l,uy=dy/l,ex=b[0]-ux*22,ey=b[1]-uy*22,sx=a[0]+ux*18,sy=a[1]+uy*18;

  function draw(bk){

    [['s',64,84],['b',256,84],['r',160,92]].forEach(q=>{s+='<text x="'+q[1]+'" y="'+q[2]+'" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--muted)">'+D[q[0]][2]+'</text>';});

      s+='<g transform="translate(160,186)"><rect x="-44" y="-12" width="88" height="22" rx="11" fill="var(--h1)"/><text y="4" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--card)">Fred gets '+(bk==='r'?1:3)+'</text></g>';}

   '<p class="ps-cap"><b>1 · Best reply:</b> each picks what’s best given what they expect.<br><b>2 · Right beliefs:</b> each expectation turns out true.</p>'+
   '<div class="ps-ctl"><button class="btn pri" id="nb">'+L.ic('eye')+'Reveal what each really did</button></div><div id="nf"></div>');
  L.$('#nb').onclick=function(){this.hidden=true;L.$('#nck').setAttribute('opacity',1);
    L.$('#nf').innerHTML=L.note('Both expectations were right. Seeing the other’s choice, neither regrets their own: no reason to switch alone. The book calls this a resting point for the circle of “I think that you think”.','check');L.done();};}},

{part:0,src:'Chapter 4 · Squaring the Circle · Nash Equilibrium',pts:1,
 solve:async L=>{L.$('#tq').children[2].click();},
 run(L){
  L.h(L.kick('try','Is it an equilibrium?')+'<h1 class="q">Fred hunts rabbits and Barney hunts stag (the outlined box). Who would want to switch alone?</h1><div id="tg"></div><div class="opts" id="tq"></div>');
  const gr=eqGrid(L,L.$('#tg'),G_HUNT());gr.st.pick=[2,0];gr.render();
  let a=false;['Only Fred','Only Barney','Both of them','Neither: it’s an equilibrium'].forEach((t,j)=>{const b=document.createElement('button');b.className='opt';b.innerHTML='<span class="key">'+(j+1)+'</span><span>'+t+'</span>';
    b.onclick=()=>{if(a)return;a=true;const ok=j===2;[...L.$('#tq').children].forEach((x,q)=>{x.setAttribute('aria-disabled','true');if(q!==j&&q!==2)x.classList.add('dim');});
      b.classList.add(ok?'ok':'no');if(!ok)L.$('#tq').children[2].classList.add('ok');L.award(ok);
      gr.st.go=new Set(['0_0','2_2']);gr.render();gr.say('Dashed boxes: where each would rather be. Fred heads for the stag; Barney heads for the rabbits. They miss again.');
      L.sheet(ok?'ok':'no',ok?'Both, in opposite directions':'Both would switch','Fred gets 1 but would get 3 by joining Barney at the stag. Barney gets 0 but would get 1 with rabbits. In a box that isn’t an equilibrium, at least one player has a reason to move. Here both do, and they pass each other.');L.done();};L.$('#tq').appendChild(b);});}},

/* ---------- PART 2: CROSS OUT, THEN STAR ---------- */
{part:1,src:'Chapter 4 · Squaring the Circle · Best Responses',
 solve:async L=>{L.$('#sg [data-s="c0"]').click();await L.sleep(30);L.$('#sg [data-s="c3"]').click();},
 run(L){
  let fin=false;
  L.h(L.kick('learn','Not always undercut')+'<h1 class="q">The book’s two shirt catalogues, Rainbow’s End and B. B. Lean, each set a price from $38 to $42. Does RE always undercut?</h1>'+
   '<p class="small" style="margin:0">Tap BB’s $42, then BB’s $39. RE’s best reply gets a ring.</p><div id="sg"></div>');
  const seen=new Set();
  const gr=eqGrid(L,L.$('#sg'),G_SHIRT(),{mode:'belief',only:'c',onBelief(k,i,b){seen.add(i);const bb=gr.G.C.l[i],re=gr.G.R.l[b[0]],v=gr.G.p[b[0]][i][0];
    gr.say('If RE expects BB at <b>'+bb+'</b>, RE’s best reply is <b>'+re+'</b> ($'+v.toLocaleString('en-US')+'): '+(b[0]>i?'a little lower.':b[0]<i?'<b>higher</b> than BB.':'the same price.'));
    if(seen.has(0)&&(seen.has(3)||seen.has(4))&&!fin){fin=true;L.sheet('info','Cutting wins customers but thins the margin','Against $42, RE undercuts to $41. Against $39, RE does better at $40, keeping a fatter margin on fewer shirts. The book’s extreme: if BB priced at cost ($20), matching it would earn RE nothing. A best reply balances volume against margin.');L.done();}}});}},

{part:1,src:'Chapter 4 · Finding Nash Equilibria · Successive Elimination',
 solve:async L=>{const c=s=>{const b=L.$('#xg [data-s="'+s+'"]');if(b&&!b.disabled)b.click();};
   for(const s of ['r0','r4','c0','c4']){c(s);await L.sleep(15);}await L.sleep(450);for(const s of ['r1','r3','c1','c3']){c(s);await L.sleep(15);}},
 run(L){
  let fin=false;
  L.h(L.kick('ex','Explore · the shrinking grid')+'<h1 class="q">Rule 3: tap a price either firm would never pick. Keep going until one box is left.</h1>'+
   '<p class="small" style="margin:0">The grid only lets go of a price that is '+L.g('dominated','dominated')+' or '+L.g('never-best','never a best reply')+' to what’s still left.</p><div id="xg"></div><div id="xf"></div>');
  const nm=(k,i)=>(k==='r'?'RE’s ':'BB’s ')+gr.G[k==='r'?'R':'C'].l[i];
  const gr=eqGrid(L,L.$('#xg'),G_SHIRT(),{mode:'cross',
    onReject(k,i,j){L.$('#xf').innerHTML='';L.fb(L.$('#xf'),'<b>Not yet.</b> '+nm(k,i)+' is '+(k==='r'?'RE’s':'BB’s')+' best reply if '+(k==='r'?'BB':'RE')+' charges '+gr.G[k==='r'?'C':'R'].l[j]+'. While that price is still in play, so is this one.','no');},
    onCross(k,i,r){L.$('#xf').innerHTML='';L.fb(L.$('#xf'),'<b>Out: '+nm(k,i)+'.</b> '+(r.dom!==undefined?'It’s dominated: '+gr.G[k==='r'?'R':'C'].l[r.dom]+' earns more whatever the rival charges.':'It’s never a best reply to anything left. It only answered a price that’s now gone.'),'ok');},
    onShrink(nr,nc){if(nr===3&&nc===3)gr.say('<b>3 × 3 left.</b> Now $40 beats every other price for both firms: a '+L.g('dominant','dominant')+' choice (Rule 2). Keep crossing.');
      else if(nr===1&&nc===1&&!fin){fin=true;gr.markAll(()=>{gr.say('<b>$40 each · $40,000 each.</b> At $80 each (chapter 3), they’d make <b>$72,000</b> each.');
        L.sheet('info','The same star, the long way round','Crossing out round by round left $40 for both: the Nash equilibrium. But it’s still a prisoners’ dilemma. Both would earn more at $80, yet each is tempted to cut. Good news for shoppers, which is why the book warns that a cartel hurts consumers.');L.done();},true);}
      else gr.say(nr+' × '+nc+' left. Look again: what can’t be a best reply now?');}});
  gr.say('5 × 5 · Which prices can’t be a best reply to anything?');}},

{part:1,src:'Workouts · Trip to the Gym No. 3',pts:1,
 solve:async L=>{L.$('#pp').children[1].click();L.$('#pw').click();},
 run(L){
  L.h(L.kick('try','Predict, then watch')+'<h1 class="q">Rainbow’s End finds a cheaper supplier: its cost per shirt falls from $20 to $11.60. BB’s stays at $20. Where does the star move?</h1>'+
   '<div class="ps-chips" id="pp"></div><div class="ps-ctl"><button class="btn pri" id="pw" hidden>'+L.ic('play')+'Rule 4: mark every best reply</button></div><div id="pg"></div>');
  const O=['Both stay at $40','RE cuts a lot; BB cuts a little','RE cuts; BB holds at $40','RE raises its price'];let pick=null;
  O.forEach((t,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=t;b.onclick=()=>{if(b.disabled)return;pick=j;[...L.$('#pp').children].forEach((x,q)=>x.classList.toggle('sel',q===j));L.$('#pw').hidden=false;};L.$('#pp').appendChild(b);});
  const gr=eqGrid(L,L.$('#pg'),G_GYM3());gr.say('Prices shifted lower so the best replies fit on the grid, as the book does.');
  L.$('#pw').onclick=function(){this.hidden=true;[...L.$('#pp').children].forEach(x=>x.disabled=true);
    gr.markAll(()=>{const ok=pick===1;L.award(ok);gr.say('<b>RE $35 · BB $38.</b> RE earns $54,756; BB $32,400 (down from $40,000 each).');
      L.sheet(ok?'ok':'no',ok?'RE cuts to $35, BB to $38':'The star lands at RE $35, BB $38','RE’s lower cost makes cutting pay, and BB replies by cutting less, to keep its margin. RE gains twice: from the cheaper shirts and from customers who move over. The book’s point: small cost advantages can mean big profit gaps.');L.done();});};}},

{part:1,src:'Chapter 4 · Games with Infinitely Many Strategies',
 solve:async L=>{const s=L.$('#bl');s.value=40;s.dispatchEvent(new Event('input',{bubbles:true}));},
 run(L){
  let fin=false;
  L.h(L.kick('learn','Best-reply lines')+'<h1 class="q">Prices can be any amount, so the book draws each firm’s best replies as a line. Slide BB’s belief about RE’s price.</h1>'+
   '<svg class="ps-svg" id="bsv" viewBox="0 0 320 236" role="img" aria-label="Chart of best-reply lines for the two shirt firms, crossing at 40 dollars"></svg>'+
   '<label class="ps-sl"><span class="h"><span>BB believes RE charges</span><b id="blv">$56</b></span><input type="range" id="bl" min="20" max="60" step="1" value="56" aria-label="BB’s belief about RE’s price, in dollars"></label>'+
   '<p class="ps-ro" id="bro" aria-live="polite"></p>');
  const X=r=>40+(r-20)*6.5,Y=b=>196-(b-20)*4.4,f=v=>'$'+(Math.round(v*100)/100).toFixed(2).replace(/\.00$/,'');
  let moved=false;
  function draw(r){const b=24+.4*r,r2=24+.4*b;
    let s='<rect width="320" height="236" rx="14" fill="var(--soft)"/><path d="M40 196H302M40 196V12" stroke="var(--ink)" stroke-width="1.5"/>';
    [20,30,40,50,60].forEach(v=>{s+='<text x="'+X(v)+'" y="212" text-anchor="middle" font-size="11" fill="var(--muted)">$'+v+'</text><text x="34" y="'+(Y(v)+4)+'" text-anchor="end" font-size="11" fill="var(--muted)">$'+v+'</text>';});
    s+='<text x="300" y="228" text-anchor="end" font-size="11" font-weight="700" fill="var(--h1)">RE’s price →</text><text x="44" y="12" font-size="11" font-weight="700" fill="var(--h2)">↑ BB’s price</text>';
    s+='<path d="M'+X(20)+' '+Y(32)+'L'+X(60)+' '+Y(48)+'" stroke="var(--h2)" stroke-width="3.5" stroke-linecap="round"/><text x="'+X(21)+'" y="'+(Y(32.4)+18)+'" font-size="11" font-weight="700" fill="var(--h2)">BB’s best reply</text>';
    s+='<path d="M'+X(32)+' '+Y(20)+'L'+X(48)+' '+Y(60)+'" stroke="var(--h1)" stroke-width="3.5" stroke-linecap="round"/><text x="'+(X(48)+6)+'" y="'+(Y(60)+12)+'" font-size="11" font-weight="700" fill="var(--h1)">RE’s best reply</text>';
    s+='<path d="M'+X(r)+' 196V'+Y(b)+'H'+X(r2)+'" fill="none" stroke="var(--pri)" stroke-width="2" stroke-dasharray="4 4"/>';
    const hit=Math.abs(r-40)<.01;
    if(hit)s+='<circle cx="'+X(40)+'" cy="'+Y(40)+'" r="13" fill="var(--h3-bg)" stroke="var(--h3)" stroke-width="2.5"/><path d="'+'M'+X(40)+' '+(Y(40)-7)+'l2 4.2 4.6.6-3.3 3.2.8 4.6-4.1-2.2-4.1 2.2.8-4.6-3.3-3.2 4.6-.6z" fill="var(--h3)"/>';
    s+='<circle cx="'+X(r)+'" cy="'+Y(b)+'" r="6" fill="var(--h2)" stroke="var(--card)" stroke-width="2"/><circle cx="'+X(r2)+'" cy="'+Y(b)+'" r="6" fill="var(--h1)" stroke="var(--card)" stroke-width="2"/>';
    L.$('#bsv').innerHTML=s;L.$('#blv').textContent='$'+r;
    L.$('#bro').innerHTML=hit?'BB expects $40 and replies $40. RE’s best reply to $40 is $40. <b>Both beliefs come true where the lines cross.</b>':
      'BB expects RE at $'+r+' and replies <b>'+f(b)+'</b>. But RE’s best reply to that is <b>'+f(r2)+'</b>, not $'+r+': BB’s belief is wrong.';
    if(hit&&moved&&!fin){fin=true;L.sheet('info','Where the lines cross','BB’s rule (the book’s formula): $24 plus 40 cents for every dollar of RE’s price. For each $1 RE cuts, BB cuts only 40 cents. The lines cross once, at $40: one equilibrium, the same one the grid found.');L.done();}}
  L.$('#bl').addEventListener('input',e=>{moved=true;draw(+e.target.value);});draw(56);}},

{part:1,src:'Epilogue to Part I',pts:1,
 solve:async L=>{L.$('#rg [data-c="1_1"]').click();},
 run(L){
  L.h(L.kick('pr','Practice · day rates')+'<h1 class="q">Plover and Kittiwake each set their own day rate for next month. Kittiwake’s best replies are ringed. Tap the box Plover should aim for.</h1><div id="rg"></div><div id="rf"></div>');
  let a=false;
  const gr=eqGrid(L,L.$('#rg'),G_RATE(),{onCell(i,j){if(a)return;a=true;const ok=i===1&&j===1;L.award(ok);gr.st.pick=[i,j];gr.markAll(()=>{
    gr.say('<b>Plover £600 · Kittiwake £600.</b> Each rate is the best reply to the other.');
    L.sheet(ok?'ok':'no',ok?'Count on their dominant choice':'Start from Kittiwake’s dominant £600','£600 is Kittiwake’s best reply whatever Plover does: dominant. The book’s Epilogue: if your rival has a dominant strategy, count on them using it, then pick your best reply. Against £600, Plover’s best is £600 (12 beats 11 and 10). Each firm sets its own rate: agreeing rates with a rival would hurt clients, and it’s illegal.');L.done();});}});
  [0,1,2].forEach(i=>gr.brC(i).forEach(j=>gr.st.ring.add('b'+i+'_'+j)));gr.render();
  gr.say('All three of Kittiwake’s rings sit in the £600 column.');}},

/* ---------- PART 3: SEVERAL ANSWERS ---------- */
{part:2,src:'Chapter 4 · Which Equilibrium?',run(L){
  L.h(L.kick('learn','Focal points')+'<h1 class="q">Three equilibria, and no way to talk. Which one do they reach?</h1>'+
   '<svg class="ps-svg" viewBox="0 0 320 128" role="img" aria-label="Three starred boxes; one is circled because both players expect the other to see it">'+
   '<rect width="320" height="128" rx="14" fill="var(--soft)"/>'+
   [0,1,2].map(k=>'<rect x="'+(22+k*52)+'" y="38" width="44" height="40" rx="8" fill="var(--h3-bg)" stroke="var(--h3)" stroke-width="2"/><path d="M'+(44+k*52)+' 50l2.4 5 5.4.7-3.9 3.8.9 5.4-4.8-2.6-4.8 2.6.9-5.4-3.9-3.8 5.4-.7z" fill="var(--h3)"/><text x="'+(44+k*52)+'" y="94" text-anchor="middle" font-size="11" fill="var(--muted)">'+['Stag','Bison','Rabbit'][k]+'</text>').join('')+
   '<text x="96" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="var(--muted)">Nash finds three…</text>'+
   '<path d="M184 58H214" stroke="var(--ink)" stroke-width="2.5"/><path d="M212 52l8 6-8 6z" fill="var(--ink)"/>'+
   '<rect x="232" y="38" width="44" height="40" rx="8" fill="var(--h3-bg)" stroke="var(--h3)" stroke-width="2"/><path d="M254 50l2.4 5 5.4.7-3.9 3.8.9 5.4-4.8-2.6-4.8 2.6.9-5.4-3.9-3.8 5.4-.7z" fill="var(--h3)"/>'+
   '<circle cx="254" cy="58" r="34" fill="none" stroke="var(--pri)" stroke-width="3"/><text x="254" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="var(--pri)">…people need one</text>'+
   '<text x="254" y="110" text-anchor="middle" font-size="11" fill="var(--ink)">obvious to both that</text><text x="254" y="123" text-anchor="middle" font-size="11" fill="var(--ink)">it’s obvious to both</text></svg>'+
   '<p class="ps-cap">Theory alone can’t pick. A '+L.g('focal-point','focal point')+' does: shared history, culture or language makes one choice stand out to both. Flip the book’s cases.</p>');
  L.flips(L.card,[
   [fpCard('clock','Noon, under the clock','A clock at noon'),'Schelling asked people to meet a stranger in New York, no time or place given. Noon was the near-instant answer. His subjects from around Boston and New Haven, who came in by train, picked the Grand Central clock.'],
   [fpCard('pairs','Six pairs in New York','A tall tower and a crossroads, three pairs at each'),'On a TV experiment, six pairs of strangers had to find each other. Three went to the Empire State Building, three to Times Square, all at noon. With signs, all six met.'],
   [fpCard('cities','Splitting nine cities','A river splits the cities into east and west'),'One student had Boston, one San Francisco; they had to split nine cities without talking. US pairs split them east and west of the Mississippi over 80% of the time; pairs with a non-US student managed it far less often.'],
   [fpCard('number','Pick a positive number','The number 1 stands out among others'),'Both win only if they name the same whole number. The overwhelming choice is 1: the first and smallest.'],
   [fpCard('lost','Lost and found','A lost-and-found desk and a meeting-point sign'),'Separated in a store or station? The lost-and-found desk is focal, by its very name. Many German and Swiss stations build a signposted meeting point on purpose.']],
   'A focal point isn’t the place that’s obvious to you. It’s the one you both expect the other to expect. And there may be none: the book warns that failing to find one is a real possibility.');}},

{part:2,src:'Chapter 4 · Which Equilibrium?',
 solve:async L=>{const m=L.map;m.toggle('newc');m.pick('info');m.toggle('newc');m.toggle('habit');m.pick('clock');},
 run(L){
  L.h(L.kick('ex','Explore · the station meeting map')+'<h1 class="q">Tali and Arlo lose each other at the central station, and both phones die. Where should Tali wait?</h1>'+
   '<p class="small" style="margin:0">Each dot is one possible Arlo (illustrative numbers). Change what they share and watch the dots move. Get to 15 of 20, and try “new to the city”.</p><div id="sm"></div>');
  let best=0,triedNew=false,fin=false;
  const chk=m=>{if(m.at)best=Math.max(best,m.count(m.at));if(!fin&&best>=15&&triedNew){fin=true;
    L.sheet('info','Shared experience makes a spot obvious','The clock alone is the likeliest spot, but far from sure. A family habit makes it obvious to both that it’s obvious to both. A newcomer lacks that shared history, so the dots scatter. The book: common experience (history, culture, language) creates focal points.');L.done();}};
  L.map=stMap(L,L.$('#sm'),{switches:true,onPick:(id,n,m)=>chk(m),onToggle:(k,m)=>{if(k==='newc'&&m.sw.newc)triedNew=true;chk(m);}});}},

{part:2,src:'Chapter 4 · Which Equilibrium?',pts:1,
 solve:async L=>{L.map.pick('meet');},
 run(L){
  L.h(L.kick('try','Challenge · find the focal point')+'<h1 class="q">A different station. Arlo is new to the city, the family has no meeting habit, and there’s a signposted meeting point. Where should Tali wait?</h1>'+
   '<p class="small" style="margin:0">The Arlos stay hidden until Tali chooses. Your first choice counts.</p><div id="cm"></div>');
  let a=false;
  L.map=stMap(L,L.$('#cm'),{hide:true,sw:{newc:true,sign:true},onPick(id,n,m){if(a)return;a=true;m.reveal();const ok=id==='meet';L.award(ok);
    L.sheet(ok?'ok':'no',ok?'The sign does the work':'Most Arlos head for the sign','With no shared history, the clock is only one guess among many. A meeting point that’s built and signposted to be focal is obvious to anyone, even a newcomer: '+n+' of 20 Arlos come to the spot Tali chose. That’s why the book points to stations that create a meeting point on purpose.');L.done();}});}},

{part:2,src:'Chapter 4 · Case Study: Half Way · Case Discussion',pts:1,
 solve:async L=>{L.$('#dg [data-c="0_1"]').click();},
 run(L){
  L.h(L.kick('pr','Practice · the dropped call')+'<h1 class="q">Tali rang Hedda. The line drops. Their family rule: whoever called first calls back. Tap the box they land in.</h1><div id="dg"></div>');
  let a=false;
  const gr=eqGrid(L,L.$('#dg'),G_CALL(),{onCell(i,j){if(a)return;a=true;const ok=i===0&&j===1;L.award(ok);gr.st.pick=[i,j];gr.render();
    L.sheet(ok?'ok':'no',ok?'Tali calls, Hedda waits':'The rule says Tali calls back','Two equally good equilibria: one calls while the other waits. Experience alone doesn’t settle it: if both wait and then both call, the line is busy again. A social convention picks one. The book likes “the first caller calls back”: at least that person surely has the number.');L.done();}});
  gr.markAll(null,true);gr.say('Two stars, both equally good. Only a rule they share picks one.');}},

{part:2,src:'Chapter 4 · Battles and Chickens',
 solve:async L=>{L.$('#bgm').children[0].click();for(const k of ['in','cm','tn','cn']){L.$('#bfx [data-k="'+k+'"]').click();}L.$('#bgm').children[1].click();L.$('#bfx [data-k="in"]').click();},
 run(L){
  let fin=false;
  L.h(L.kick('learn','Battles and chickens')+'<h1 class="q">Two stars, but each player prefers a different one. What happens if both insist?</h1>'+
   '<div class="ps-ctl" id="bgm"></div><div id="bgr"></div><div class="ps-lab">Try a way to settle it</div><div class="ps-ctl" id="bfx"></div><div id="bnf"></div>');
  const GM=[['Holiday: city or coast?',G_TRIP,'Tali and Juno both want to travel together; Tali prefers the city, Juno the coast. This is the book’s '+L.g('battle-game','battle of the sexes')+'.',
     {in:[[0,1],'Tali books the city, Juno the coast: <b>0 each</b>, no trip.'],cm:[[0,0],'Tali commits to the city first; Juno’s best reply is the city too. It only works if it’s believed, and Juno may test it (lessons 7 and 8).'],tn:[null,'City this year, coast next: <b>3.5 each</b> on average, and both get their favourite in turn.'],cn:[null,'A coin picks the trip before booking: <b>3.5 each</b> on average, and it feels fair to both.']}],
   ['Designer week: who pushes?',G_DESK,'Tali and Linus both want the senior designer this week. If both push, Greer steps in and both lose. The one who waits is the “chicken”: this is the book’s '+L.g('chicken','chicken')+'.',
     {in:[[0,0],'Both push: <b>0 each</b>, the worst box for both. The conflict is sharper than in the battle.'],cm:[[0,1],'Tali commits to this week; Linus’s best reply is to wait (½ beats 0). Risky if Linus commits too.'],tn:[null,'This week Tali, next week Linus: <b>1.25 each</b> per week on average, and no clashes.'],cn:[null,'A coin decides who gets this week: <b>1.25 each</b> on average, with no fight.']}]];
  let cur=null,gr=null;const seenG=new Set(),seenF=new Set();
  function setG(n){cur=GM[n];seenG.add(n);[...L.$('#bgm').children].forEach((x,q)=>x.classList.toggle('sel',q===n));L.$('#bgr').innerHTML='';
    gr=eqGrid(L,L.$('#bgr'),cur[1]());gr.markAll(null,true);gr.say(cur[2]);L.$('#bnf').innerHTML='';}
  GM.forEach((g,n)=>{const b=document.createElement('button');b.className='chip';b.textContent=g[0];b.onclick=()=>setG(n);L.$('#bgm').appendChild(b);});
  [['in','Both insist'],['cm','One commits first'],['tn','Take turns'],['cn','Toss a coin']].forEach(f=>{const b=document.createElement('button');b.className='chip';b.dataset.k=f[0];b.textContent=f[1];
    b.onclick=()=>{if(!cur){L.err('Pick a game first');return;}const r=cur[3][f[0]];gr.st.bad=null;gr.st.pick=null;gr.st.go=new Set();
      if(f[0]==='in')gr.st.bad=r[0];else if(r[0])gr.st.pick=r[0];else gr.eqs().forEach(c=>gr.st.go.add(c[0]+'_'+c[1]));gr.render();gr.say(r[1]);seenF.add(f[0]);
      if(seenG.size===2&&seenF.size>=3&&!fin){fin=true;L.sheet('info','Agree on being together, disagree on where','In both games, any star beats a mismatch, but each wants a different star. In chicken, both trying for their favourite lands in the worst box. The book’s ways out: one side commits (and must be believed), take turns when the game repeats, or toss a coin. Chicken also shows that players in identical positions can end up doing different things.');L.done();}};L.$('#bfx').appendChild(b);});
  setG(0);}},

{part:2,src:'Chapter 4 · Battles and Chickens',pts:6,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which kind of game?',['Just coordinate: any match will do','Battle: agree, but on which?','Chicken: who gives way?'],[
   ['Tali and Arlo, phones dead, looking for each other at the station.',0,'Neither cares where, as long as it’s the same spot. Pure coordination: find the focal point.'],
   ['Tali wants a city break and Juno the coast, but both want to go together.',1,'Both prefer any shared trip to none, but each prefers a different one: a battle.'],
   ['Tali and Linus both demand the senior designer this week. If both dig in, Greer steps in and both lose.',2,'Giving way costs a little; both insisting is the worst for both. That’s chicken.'],
   ['The call drops. Neither Tali nor Hedda minds who calls back, as long as only one does.',0,'Two equally good equilibria and no preference between them: pure coordination. A convention settles it.'],
   ['The team must pick one file-sharing tool. Tali prefers one, Linus another; everyone wants the same one.',1,'Everyone gains from matching, but people prefer different matches: a battle.'],
   ['Tali and a neighbour both want the one parking space by the door. If both squeeze in, nobody can open a door.',2,'The one who drives on to the far space loses a little; both pushing in is worst. Chicken.']]);}},

/* ---------- PART 4: REAL PEOPLE, REAL WEEK ---------- */
{part:3,src:'Chapter 4 · Case Study: Half Way',
 solve:async L=>{const s=L.$('#hs');s.value=30;s.dispatchEvent(new Event('input',{bubbles:true}));L.$('#hk').click();for(let k=0;k<4;k++)L.$('#hn').click();L.$('#he').click();},
 run(L){
  L.h(L.kick('ex','The halving hop line')+'<h1 class="q">The studio quiz: Tali and Linus each write a number from 0 to 100. Closest to half the other’s number wins.</h1>'+
   '<svg class="ps-svg" id="hsv" viewBox="0 0 320 196" role="img" aria-label="A number line from 0 to 100; the shaded range of sensible picks halves at each level of thinking"></svg>'+
   '<label class="ps-sl"><span class="h"><span>Tali writes</span><b id="hsv2">50</b></span><input type="range" id="hs" min="0" max="100" step="1" value="50" aria-label="Tali’s number"></label>'+
   '<div class="ps-ctl"><button class="btn pri" id="hk">'+L.ic('check')+'Lock it in</button><button class="btn pri" id="hn" hidden>'+L.ic('arrow')+'One more level of thinking</button><button class="btn" id="he" hidden>Jump to the end</button></div>'+
   '<p class="ps-ro" id="hro" aria-live="polite">Pick Tali’s number first.</p>');
  let x=50,lv=-1,bound=100,arcs='',fin=false;
  const T=['','Linus can’t pick above 100, so a sensible pick is at most <b>50</b>.','If Linus is sensible too (50 or less), Tali’s best is at most <b>25</b>.','If Linus expects that, he aims at 25 or less, so Tali: at most <b>12.5</b>.','Again: at most <b>6.25</b>. The range keeps halving.'];
  function draw(){
    let s='<rect width="320" height="196" rx="14" fill="var(--soft)"/><text x="14" y="18" font-size="11" font-weight="700" fill="var(--muted)">WHERE FIRST-TIME PLAYERS STOP</text><text x="14" y="31" font-size="11" fill="var(--muted)">illustrative heights · the book: 50 most common, then 25</text>';
    [[50,46],[25,30],[12.5,13],[33,8],[0,5],[75,5],[100,4]].forEach(b=>{s+='<rect x="'+(HP_X(b[0])-5)+'" y="'+(88-b[1])+'" width="10" height="'+b[1]+'" rx="2" fill="var(--h2)" opacity=".75"/>';});
    s+='<path d="M20 88H300" stroke="var(--line2)" stroke-width="1"/>';
    s+='<rect x="20" y="104" width="'+(HP_X(bound)-20).toFixed(1)+'" height="22" rx="6" fill="var(--pri-bg)" stroke="var(--pri)" stroke-width="1.5" style="transition:width .5s"/>';
    s+=hpAxis(115)+arcs;
    if(lv>=0)s+='<path d="M'+HP_X(x)+' 96V128" stroke="var(--h1)" stroke-width="3"/><path d="M'+(HP_X(x)-6)+' 94h12l-6 7z" fill="var(--h1)"/><text x="'+(x>88?HP_X(x)-9:HP_X(x)+9)+'" y="101" text-anchor="'+(x>88?'end':'start')+'" font-size="11" font-weight="700" fill="var(--h1)">Tali '+x+'</text>';
    L.$('#hsv').innerHTML=s;}
  draw();
  L.$('#hs').addEventListener('input',e=>{if(lv>=0)return;x=+e.target.value;L.$('#hsv2').textContent=x;});
  L.$('#hk').onclick=function(){lv=0;this.hidden=true;L.$('#hs').disabled=true;L.$('#hn').hidden=false;draw();L.$('#hro').innerHTML='Tali writes <b>'+x+'</b> (the purple mark). Now think about Linus.';};
  function hop(nb,quiet){const a=HP_X(bound),b=HP_X(nb),m=(a+b)/2,d=Math.min(15,(a-b)/4);
    if(!quiet)arcs+='<path d="M'+a.toFixed(1)+' 142Q'+m.toFixed(1)+' '+(142+2*d).toFixed(1)+' '+b.toFixed(1)+' 142" fill="none" stroke="var(--pri)" stroke-width="2"/><path d="M'+b.toFixed(1)+' 142l5 4-1-6z" fill="var(--pri)"/>'+((a-b)>30?'<text x="'+m.toFixed(1)+'" y="'+(142+d+13).toFixed(1)+'" text-anchor="middle" font-size="11" font-weight="700" fill="var(--pri)">÷2</text>':'');bound=nb;}
  L.$('#hn').onclick=()=>{if(lv>=4)return;lv++;hop(bound/2);draw();L.$('#hro').innerHTML='Level '+lv+': '+T[lv]+(x>bound?' Tali’s '+x+' is now outside the range.':'');if(lv>=2)L.$('#he').hidden=false;if(lv>=4)L.$('#hn').hidden=true;};
  L.$('#he').onclick=function(){if(fin)return;fin=true;this.hidden=true;L.$('#hn').hidden=true;arcs+='<text x="'+HP_X(0)+'" y="190" font-size="11" font-weight="700" fill="var(--h3)">… all the way to 0</text>';while(bound>.5)hop(bound/2,true);bound=0;draw();
    L.$('#hro').innerHTML='Only <b>0</b> survives every level. If both pick 0, each is the best reply to the other: the '+L.g('nash','Nash equilibrium')+'.';
    L.sheet('info','The book’s twist: 0 was there all along','The authors play this game with the reader: they say 12.5 first, pick 0 in the rematch, and admit 0 was the right pick the first time too. With two players, 0 wins or ties against anything: an unusual case. Real first-timers mostly say 50, then 25; the book finds most people think only two or three levels deep. Tali’s '+x+(x===0?' was already there.':' would lose to a 0.'));L.done();};}},

{part:3,src:'Chapter 4 · Case Study: Half Way · Case Discussion',pts:1,
 solve:async L=>{const s=L.$('#gs');s.value=15;s.dispatchEvent(new Event('input',{bubbles:true}));L.$('#gh').click();L.$('#gr').click();},
 run(L){
  const C1=[50,50,50,50,50,40,33,25,25,25,25,12,12,0],C2=[12,10,8,8,6,5,5,4,3,3,2,1,0,0];
  L.h(L.kick('pr','Challenge · the whole studio plays')+'<h1 class="q">Now 15 people play. Closest to half the <i>average</i> wins. It’s everyone’s first time. What should Tali write?</h1>'+
   '<p class="small" style="margin:0">Guess where colleagues stop thinking, then aim at half their average. Your first hand-in counts.</p>'+
   '<svg class="ps-svg" id="gsv" viewBox="0 0 320 176" role="img" aria-label="Number line from 0 to 50 with colleagues’ picks, the average and the winning target"></svg>'+
   '<label class="ps-sl"><span class="h"><span>Tali writes</span><b id="gsl">30</b></span><input type="range" id="gs" min="0" max="50" step="1" value="30" aria-label="Tali’s number"></label>'+
   '<div class="ps-ctl"><button class="btn pri" id="gh">'+L.ic('check')+'Hand it in</button><button class="btn pri" id="gr" hidden>'+L.ic('cycle')+'Play a rematch</button></div><p class="ps-ro" id="gro" aria-live="polite"></p>');
  const X=v=>20+v*5.6;let x=30,round=0,graded=false;
  function res(C){const all=C.concat([x]),avg=all.reduce((a,b)=>a+b,0)/all.length,t=avg/2;const dm=Math.min(...C.map(c=>Math.abs(c-t)));const win=Math.abs(x-t)<dm;
    const wv=win?x:C.reduce((a,c)=>Math.abs(c-t)<Math.abs(a-t)?c:a,C[0]);return {avg,t,win,wv};}
  function draw(){let s='<rect width="320" height="176" rx="14" fill="var(--soft)"/><path d="M20 120H300" stroke="var(--ink)" stroke-width="2"/>'+[0,10,20,30,40,50].map(v=>'<path d="M'+X(v)+' 115v10" stroke="var(--ink)" stroke-width="1.5"/><text x="'+X(v)+'" y="140" text-anchor="middle" font-size="11" fill="var(--muted)">'+v+'</text>').join('');
    if(round){const C=round===1?C1:C2,r=res(C),cnt={};C.forEach(c=>cnt[c]=(cnt[c]||0)+1);
      s+='<text x="14" y="18" font-size="11" font-weight="700" fill="var(--muted)">'+(round===1?'FIRST GAME':'REMATCH')+' · 14 COLLEAGUES (ILLUSTRATIVE)</text>';
      Object.keys(cnt).forEach(v=>{const h=cnt[v]*13,iw=!r.win&&+v===r.wv;s+='<rect x="'+(X(+v)-2.5)+'" y="'+(116-h)+'" width="5" height="'+h+'" rx="1.5" fill="var('+(iw?'--ok-strong':'--h2')+')" opacity=".9"/>';});
      s+='<path d="M'+X(r.avg).toFixed(1)+' 34V120" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 3"/><text x="'+X(r.avg).toFixed(1)+'" y="31" text-anchor="middle" font-size="11" fill="var(--muted)">average '+r.avg.toFixed(1)+'</text>';
      s+='<path d="M'+X(r.t).toFixed(1)+' 44V124" stroke="var(--h3)" stroke-width="3"/><text x="'+X(r.t).toFixed(1)+'" y="'+(r.t<12?160:44)+'" text-anchor="'+(r.t<12?'start':'middle')+'" font-size="11" font-weight="700" fill="var(--h3)">target '+r.t.toFixed(1)+'</text>';}
    s+='<path d="M'+X(x)+' 148l-7 12h14z" fill="var('+(round&&res(round===1?C1:C2).win?'--ok-strong':'--h1')+')"/><text x="'+Math.max(30,Math.min(290,X(x)))+'" y="172" text-anchor="middle" font-size="11" font-weight="700" fill="var(--h1)">Tali '+x+'</text>';
    L.$('#gsv').innerHTML=s;}
  draw();
  L.$('#gs').addEventListener('input',e=>{x=+e.target.value;L.$('#gsl').textContent=x;draw();if(round===2){const r=res(C2);L.$('#gro').innerHTML='Target <b>'+r.t.toFixed(1)+'</b>. '+(r.win?'Tali wins the rematch.':'A colleague at '+r.wv+' is closer.');}});
  L.$('#gh').onclick=function(){if(graded)return;graded=true;round=1;this.hidden=true;L.$('#gs').disabled=true;const r=res(C1);L.award(r.win);draw();L.$('#gr').hidden=false;
    L.$('#gro').innerHTML='Average <b>'+r.avg.toFixed(1)+'</b>, so the target is <b>'+r.t.toFixed(1)+'</b>. '+(r.win?'Tali’s '+x+' is closest.':'A colleague at '+r.wv+' is closer.');
    L.sheet(r.win?'ok':'no',r.win?'Tali reads the room':'Aim at the room, not at perfect logic','Most colleagues stopped at one or two levels (50 and 25), so half the average landed near 15; anything from 13 to 19 won. Writing 0, the equilibrium, would have lost: with more than two players, 0 no longer always wins. Now try the rematch.');};
  L.$('#gr').onclick=function(){this.hidden=true;round=2;L.$('#gs').disabled=false;draw();const r=res(C2);
    L.$('#gro').innerHTML='Rematch: the room has learned. Target <b>'+r.t.toFixed(1)+'</b>. '+(r.win?'Tali wins again.':'A colleague at '+r.wv+' is closer. Slide to try again.');
    L.sheet('info','With practice, play moves toward 0','The book: people rarely pick 0 the first time (evidence against Nash as a prediction), but after two or three games they get very close (evidence for it). Both are true: best replies are easy; correct beliefs about others take experience.');L.done();};}},

{part:3,src:'Chapter 4 · A Beautiful Equilibrium?',
 solve:async L=>{L.$$('#lp button').forEach(b=>b.click());},
 run(L){
  let fin=false;
  L.h(L.kick('ex','Edge cases and limits')+'<h1 class="q">Where does “find the equilibrium” stop working? Try each case.</h1>'+
   '<div class="ps-chips" id="lp"></div><div id="lv"></div><div id="lf"></div>');
  const mini=(k)=>{let s='<svg class="ps-svg" viewBox="0 0 320 120" role="img" aria-label="Small picture for this case"><rect width="320" height="120" rx="14" fill="var(--soft)"/>';
    if(k==='belief'){[[50,58],[25,38],[12.5,16],[0,6]].forEach(b=>{s+='<rect x="'+(HP_X(b[0])-7)+'" y="'+(90-b[1])+'" width="14" height="'+b[1]+'" rx="3" fill="var(--h2)" opacity=".8"/>';});
      s+='<path d="M20 90H300" stroke="var(--ink)" stroke-width="1.5"/>'+[0,25,50,100].map(v=>'<text x="'+HP_X(v)+'" y="106" text-anchor="middle" font-size="11" fill="var(--muted)">'+v+'</text>').join('')+'<text x="'+HP_X(0)+'" y="20" font-size="11" font-weight="700" fill="var(--h3)">equilibrium: 0</text><text x="'+HP_X(52)+'" y="20" font-size="11" fill="var(--muted)">first-time picks (illustrative)</text>';}
    if(k==='novice'){[['Game 1',40],['Game 2',16],['Game 3',5]].forEach((b,j)=>{s+='<rect x="'+(50+j*84)+'" y="'+(92-b[1]*1.6)+'" width="56" height="'+(b[1]*1.6)+'" rx="5" fill="var(--h1)" opacity=".75"/><text x="'+(78+j*84)+'" y="108" text-anchor="middle" font-size="11" fill="var(--muted)">'+b[0]+'</text>';});
      s+='<path d="M40 92H290" stroke="var(--ink)" stroke-width="1.5"/><text x="20" y="18" font-size="11" font-weight="700" fill="var(--muted)">AVERAGE PICK, SAME GROUP (ILLUSTRATIVE)</text>';}
    if(k==='fad'){for(let j=0;j<7;j++){const cx=40+j*40;s+='<circle cx="'+cx+'" cy="62" r="15" fill="var(--card)" stroke="var(--line2)" stroke-width="2"/><circle cx="'+(cx-5)+'" cy="59" r="1.8" fill="var(--ink)"/><circle cx="'+(cx+5)+'" cy="59" r="1.8" fill="var(--ink)"/><path d="M'+(cx-5)+' 67q5 4 10 0" fill="none" stroke="var(--ink)" stroke-width="1.5"/>';
        if(j===4)s+='<path d="M'+(cx-16)+' 48h32M'+(cx-10)+' 48v-12h20v12" fill="var(--h3)" stroke="var(--h3)" stroke-width="3"/><circle cx="'+cx+'" cy="58" r="28" fill="none" stroke="var(--pri)" stroke-width="2.5"/>';}
      s+='<text x="160" y="108" text-anchor="middle" font-size="11" fill="var(--muted)">the one that stands out becomes focal</text>';}
    return s+'</svg>';};
  const PR=[['No equilibrium',()=>{const g=eqGrid(L,L.$('#lv'),G_KICK());g.markAll(null,true);},'No box gets both rings: whatever one side does, the other wants to switch. Any fixed choice can be exploited, so you mix your moves (lesson 6). Nash proved that once mixing is allowed, essentially every game has an equilibrium.'],
    ['Several equilibria',()=>{const g=eqGrid(L,L.$('#lv'),G_HUNT());g.markAll(null,true);},'Three stars. Nash finds them all but can’t say which one people will reach. You need Nash plus something else: a focal point, a convention, or a commitment.'],
    ['Bad for both',()=>{const g=eqGrid(L,L.$('#lv'),G_DUO());g.markAll(null,true);},'The star sits at $40 each ($40,000) while $80 each would pay $72,000. An equilibrium is stable, not good. Here shoppers are glad of it.'],
    ['Wrong beliefs',()=>{L.$('#lv').innerHTML=mini('belief');},'Equilibrium needs every player’s beliefs to be right. In Half Way, first-timers mostly say 50 or 25, not 0. Play to how people really reason, not to perfect logic.'],
    ['Newcomers',()=>{L.$('#lv').innerHTML=mini('novice')+L.quote('the basic equilibrium analysis is the place to begin','Charles Holt and Alvin Roth, quoted in the book');},'Newcomers miss the equilibrium at first; with experience, play often converges. The book’s verdict is a guarded yes: start from the equilibrium, then ask why real play might differ (fairness and care for others matter too).'],
    ['A fad decides',()=>{L.$('#lv').innerHTML=mini('fad');},'Keynes’s beauty contest: you guess what others guess others will like. Then anything that stands out, or a round number, can win. Whim and fashion can decide (this is about reasoning, not investment advice). It can even push pay up: every firm wants an above-average boss.']];
  const seen=new Set();
  PR.forEach((p,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=p[0];b.onclick=()=>{[...L.$('#lp').children].forEach((x,q)=>x.classList.toggle('sel',q===j));L.$('#lv').innerHTML='';p[1]();L.$('#lf').innerHTML='';L.fb(L.$('#lf'),p[2],'info');seen.add(j);
    if(seen.size===PR.length&&!fin){fin=true;L.sheet('info','Start with the equilibrium, then ask why people might differ','The tool stops on its own when there’s no equilibrium (mix instead), several (find a focal point) or a bad one (it’s a dilemma). It needs correct beliefs, which newcomers lack, and fashions can decide which focal point wins.');L.done();}};L.$('#lp').appendChild(b);});}},

{part:3,src:'Course application · built on Chapter 4',pts:1,
 solve:async L=>{L.$('#ob').click();L.$('#ob').click();const c=s=>L.$('#og [data-s="'+s+'"]').click();c('r2');c('c2');await L.sleep(450);L.$('#ob').click();await L.sleep(1500);L.$('#oq').children[1].click();},
 run(L){
  L.h(L.kick('pr','One-minute move')+'<h1 class="q">Tali and Arlo each decide which day to visit Hedda this weekend, without checking with each other. Run the move.</h1>'+
   L.note('How this course applies the book: a one-minute routine built only from the book’s Rules 2 to 4 and its focal points.','compass')+
   '<div class="ps-steps" id="osp"><span>1 · Options</span><span>2 · Dominant?</span><span>3 · Cross out</span><span>4 · Best replies</span><span>5 · Focal point</span></div>'+
   '<div id="og"></div><div class="ps-say" id="osay" aria-live="polite"></div><div class="ps-ctl"><button class="btn pri" id="ob"></button></div><div class="opts" id="oq"></div>');
  let s=0,fin=false,xs=0;
  const say=(h,x)=>L.$('#osay').innerHTML='<b>'+h+'</b>'+x;
  const gr=eqGrid(L,L.$('#og'),G_VISIT(),{mode:'view',
    onReject(k,i){say('STEP 3 · CROSS OUT','Not that one: it’s a best reply to something. Look for the choice that’s worse whatever the other does.');},
    onCross(){xs++;},onShrink(nr,nc){if(nr===2&&nc===2)go(3);else say('STEP 3 · CROSS OUT','Good. Now the same for '+(gr.st.xr.size?'Arlo':'Tali')+'.');}});
  function go(n){s=n;L.$$('#osp span').forEach((p,j)=>p.className=j<n?'dn':j===n?'cur':'');const b=L.$('#ob');b.parentNode.hidden=false;
    if(n===0){say('STEP 1 · LIST THE OPTIONS','Each can go Saturday, Sunday or skip. Hedda is happiest with a visitor both days (illustrative numbers).');b.innerHTML=L.ic('arrow')+'Next';}
    if(n===1){say('STEP 2 · A DOMINANT CHOICE?','Is one of Tali’s days best whatever Arlo does?');b.innerHTML=L.ic('eye')+'Check';}
    if(n===2){b.parentNode.hidden=true;gr.mode('cross');say('STEP 3 · CROSS OUT','No dominant day: Tali’s best day depends on Arlo’s. Now tap the choice nobody sensible would pick, for Tali (a row) and for Arlo (a column).');}
    if(n===3){gr.mode('view');say('STEP 4 · MARK BEST REPLIES','Two by two left. Mark every best reply.');b.innerHTML=L.ic('star')+'Mark best replies';}
    if(n===4){b.parentNode.hidden=true;say('STEP 5 · SEVERAL? FIND THE FOCAL POINT','Two stars. Last time Tali took Saturday, and the family habit is to swap. Which box will both expect?');
      ['Tali Saturday, Arlo Sunday','Tali Sunday, Arlo Saturday','Both on Saturday, to be safe'].forEach((t,j)=>{const x=document.createElement('button');x.className='opt';x.innerHTML='<span class="key">'+(j+1)+'</span><span>'+t+'</span>';
        x.onclick=()=>{if(fin)return;fin=true;const ok=j===1;L.award(ok);x.classList.add(ok?'ok':'no');if(!ok)L.$('#oq').children[1].classList.add('ok');gr.st.pick=[1,0];gr.render();L.$$('#osp span').forEach(p=>p.className='dn');
          L.sheet(ok?'ok':'no',ok?'The swap is the focal point':'The habit picks the swap','Both stars are equilibria, so logic alone can’t choose. The shared habit of swapping makes one obvious to both, and it’s fair: each gets the better day in turn. “Both Saturday” isn’t an equilibrium: whoever expected it would rather switch to Sunday.');L.done();};L.$('#oq').appendChild(x);});}}
  L.$('#ob').onclick=()=>{if(s===0)go(1);else if(s===1)go(2);else if(s===3){L.$('#ob').parentNode.hidden=true;gr.markAll(()=>go(4));}};
  go(0);}},

{part:3,src:'Chapter 4 · Which Equilibrium?',
 solve:async L=>{['eq','inc','turn'].forEach(k=>L.$('#cw [data-k="'+k+'"]').click());},
 run(L){
  let fin=false;
  L.h(L.kick('learn','Where cooperation wins')+'<h1 class="q">When both just need to agree, a fair rule is the easiest meeting place</h1>'+
   '<svg class="ps-svg" id="csv" viewBox="0 0 320 132" role="img" aria-label="Picture of a fair focal point"></svg><p class="ps-cap" id="ccap"></p><div class="ps-ctl" id="cw"></div>');
  const V={eq:['Equal split',()=>{let s='<rect width="320" height="132" rx="14" fill="var(--soft)"/><rect x="24" y="44" width="272" height="34" rx="8" fill="var(--h1-bg)" stroke="var(--h1)" stroke-width="1.5"/>';
      for(let k=1;k<12;k++)if(k!==6)s+='<path d="M'+(24+k*272/12)+' 40v42" stroke="var(--line2)" stroke-width="1.5" stroke-dasharray="3 3"/>';
      return s+'<path d="M160 32v58" stroke="var(--h3)" stroke-width="4"/><text x="160" y="26" text-anchor="middle" font-size="12" font-weight="700" fill="var(--h3)">50 : 50</text><text x="160" y="110" text-anchor="middle" font-size="11" fill="var(--muted)">many possible splits · one stands out</text>';},
     'In a bargain where both lose if they don’t agree, 50:50 is simple, clear and looks fair, so expectations meet there. That’s why the book sees it so often.'],
    inc:['Same share of income',()=>{let s='<rect width="320" height="132" rx="14" fill="var(--soft)"/>';
      [['Tali',260,'--h1'],['Juno',150,'--h2']].forEach((p,j)=>{const y=34+j*42;s+='<text x="20" y="'+(y+15)+'" font-size="12" font-weight="700" fill="var('+p[2]+')">'+p[0]+'</text><rect x="62" y="'+y+'" width="'+(p[1]*0.9)+'" height="22" rx="6" fill="var('+p[2]+'-bg)" stroke="var('+p[2]+')" stroke-width="1.5"/><rect x="62" y="'+y+'" width="'+(p[1]*0.9*0.3)+'" height="22" rx="6" fill="var('+p[2]+')" opacity=".7"/><text x="'+(66+p[1]*0.27)+'" y="'+(y+15)+'" font-size="11" font-weight="700" fill="var(--card)">30%</text>';});
      return s+'<text x="160" y="122" text-anchor="middle" font-size="11" fill="var(--muted)">same share, so the higher earner pays more (illustrative)</text>';},
     'The book’s example: rich countries were asked for a share of their income for aid, not a fixed sum, so richer ones give more. Tali and Juno can split the bills the same way when Juno’s income dips.'],
    turn:['Take turns',()=>{let s='<rect width="320" height="132" rx="14" fill="var(--soft)"/>';
      ['City','Coast','City','Coast'].forEach((t,j)=>{const x=24+j*70;s+='<rect x="'+x+'" y="40" width="62" height="44" rx="10" fill="var('+(j%2?'--h2-bg':'--h1-bg')+')" stroke="var('+(j%2?'--h2':'--h1')+')" stroke-width="1.5"/><text x="'+(x+31)+'" y="58" text-anchor="middle" font-size="11" fill="var(--muted)">Year '+(j+1)+'</text><text x="'+(x+31)+'" y="74" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">'+t+'</text>';});
      return s+'<text x="160" y="110" text-anchor="middle" font-size="11" fill="var(--muted)">both get their favourite, in turn, with no fight</text>';},
     'When the game repeats, alternating turns a fight into a fair, predictable rule. Each gets their favourite half the time, and nobody has to win a test of nerve.']};
  const seen=new Set();
  function show(k){L.$('#csv').innerHTML=V[k][1]();L.$('#ccap').innerHTML=V[k][2];[...L.$('#cw').children].forEach(b=>b.classList.toggle('sel',b.dataset.k===k));seen.add(k);
    if(seen.size===3&&!fin){fin=true;L.sheet('info','Fairness is strategic here','The book treats fairness as a focal point: rules that look fair make expectations meet, so both get a good outcome without a fight. With people Tali will see again, that matters more than winning one round.<br><br><b>Where it stops:</b> a rule is focal only if both see it as the obvious one. If Juno thinks equal amounts are fair and Tali thinks equal shares are, expectations don’t meet: say the rule out loud first. And a fair pledge isn’t payment: the book notes the aid may never arrive.');L.done();}}
  Object.keys(V).forEach(k=>{const b=document.createElement('button');b.className='chip';b.dataset.k=k;b.textContent=V[k][0];b.onclick=()=>show(k);L.$('#cw').appendChild(b);});
  L.$('#csv').innerHTML=V.eq[1]();L.$('#ccap').innerHTML='Tap each fair rule.';}},

{part:3,src:'Course application · built on Chapter 4',
 solve:async L=>{L.$('#yc').children[0].click();L.$('#y1').value='She’ll go to the café we used last time';L.$('#y2').value='Go there too';L.$('#y3').value='Our usual café at 1 pm';['#y1','#y2','#y3'].forEach(s=>L.$(s).dispatchEvent(new Event('input',{bubbles:true})));L.$('#yb').click();},
 run(L){
  L.h(L.kick('pr','Your turn · ungraded')+'<h1 class="q">One “we choose at the same time” moment in your week. Put yourself in their shoes.</h1>'+
   L.note('How this course applies the book: the one-minute move on your own situation.','compass')+
   '<span class="ps-fl">THE SITUATION</span><div class="ps-chips" id="yc"></div>'+
   '<label class="ps-fl" for="y1">1 · WHAT WILL THEY MOST LIKELY DO?</label><input class="ps-in" id="y1" maxlength="80" placeholder="e.g. they’ll assume I’m booking">'+
   '<label class="ps-fl" for="y2">2 · MY BEST REPLY TO THAT</label><input class="ps-in" id="y2" maxlength="80" placeholder="e.g. book it myself tonight">'+
   '<label class="ps-fl" for="y3">3 · THE FOCAL POINT WE’D BOTH EXPECT</label><input class="ps-in" id="y3" maxlength="80" placeholder="e.g. whoever suggested it books it">'+
   '<div class="ps-ctl"><button class="btn pri" id="yb" disabled>'+L.ic('star')+'Draw my box</button></div><div id="yo"></div>');
  let sit=null;
  ['Where or when to meet','Who calls or acts first','A plan we each prefer differently','A price or offer we each set'].forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=n;b.onclick=()=>{sit=n;[...L.$('#yc').children].forEach((x,q)=>x.classList.toggle('sel',q===j));chk();};L.$('#yc').appendChild(b);});
  const v=s=>L.$(s).value.trim();
  function chk(){L.$('#yb').disabled=!(sit&&v('#y1').length>1&&v('#y2').length>1&&v('#y3').length>1);}
  ['#y1','#y2','#y3'].forEach(s=>L.$(s).addEventListener('input',chk));
  L.$('#yb').onclick=()=>{const e=s=>L.esc(v(s));
    L.$('#yo').innerHTML='<svg class="ps-svg" viewBox="0 0 320 150" role="img" aria-label="Your situation drawn as a starred box"><rect width="320" height="150" rx="14" fill="var(--soft)"/>'+
     '<rect x="14" y="14" width="140" height="56" rx="12" fill="var(--h2-bg)" stroke="var(--h2)" stroke-width="1.5"/><text x="24" y="32" font-size="11" font-weight="700" fill="var(--h2)">THEY’LL LIKELY</text><foreignObject x="22" y="36" width="126" height="32"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:11.5px;line-height:1.3;color:var(--ink);overflow:hidden">'+e('#y1')+'</div></foreignObject>'+
     '<rect x="166" y="14" width="140" height="56" rx="12" fill="var(--h1-bg)" stroke="var(--h1)" stroke-width="1.5"/><text x="176" y="32" font-size="11" font-weight="700" fill="var(--h1)">MY BEST REPLY</text><foreignObject x="174" y="36" width="126" height="32"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:11.5px;line-height:1.3;color:var(--ink);overflow:hidden">'+e('#y2')+'</div></foreignObject>'+
     '<path d="M84 72L130 92M236 72L190 92" stroke="var(--ink)" stroke-width="2"/>'+
     '<rect x="60" y="92" width="200" height="48" rx="12" fill="var(--h3-bg)" stroke="var(--h3)" stroke-width="2.5"/><path d="M78 106l2.4 5 5.4.7-3.9 3.8.9 5.4-4.8-2.6-4.8 2.6.9-5.4-3.9-3.8 5.4-.7z" fill="var(--h3)"/><foreignObject x="94" y="98" width="160" height="38"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:12px;line-height:1.3;font-weight:600;color:var(--ink);overflow:hidden">'+e('#y3')+'</div></foreignObject></svg>';
    L.sheet('info','Say the focal point out loud','If your best reply and theirs point at the same box, you’re at an equilibrium. If you can talk first, naming the focal point (“whoever suggested it books it”) makes it obvious to both. Afterwards, note what happened.');L.done();};}},

{part:3,src:'Course application · built on Chapter 4 · Epilogue to Part I',run(L){
  L.h(L.kick('learn','Your strategy map')+'<h1 class="q">“Put yourself in their shoes” joins three rows of the map</h1>'+
   L.note('How this course applies the book. Later lessons fill the dashed gaps.','compass')+
   '<svg class="ps-svg" viewBox="0 0 320 62" role="img" aria-label="Tool picture: two thought bubbles pointing at one starred box"><rect width="320" height="62" rx="12" fill="var(--soft)"/><ellipse cx="54" cy="22" rx="38" ry="14" fill="var(--h1-bg)" stroke="var(--h1)" stroke-width="1.5"/><ellipse cx="266" cy="22" rx="38" ry="14" fill="var(--h2-bg)" stroke="var(--h2)" stroke-width="1.5"/><path d="M88 30L138 42M232 30L182 42" stroke="var(--ink)" stroke-width="2"/><rect x="140" y="30" width="40" height="26" rx="6" fill="var(--h3-bg)" stroke="var(--h3)" stroke-width="2"/><path d="M160 35l2 4.2 4.6.6-3.3 3.2.8 4.6-4.1-2.2-4.1 2.2.8-4.6-3.3-3.2 4.6-.6z" fill="var(--h3)"/><text x="54" y="26" text-anchor="middle" font-size="11" fill="var(--h1)">I think…</text><text x="266" y="26" text-anchor="middle" font-size="11" fill="var(--h2)">they think…</text></svg>'+
   '<div id="mp"></div>'+
   '<p class="small">It’s the <b>first</b> tool when you both choose at once, and when you need to land on the same choice. Part I in one line: turns → look ahead and reason back (Rule 1); same time → Rules 2, 3 and 4; no equilibrium → mix (next lesson).</p>');
  L.$('#mp').innerHTML='<div class="mp-row"><span class="n">0</span><b>Is it a game at all? Will the other side react?</b></div>'+MP_ROWS.map((r,j)=>{const hot=r[1].includes('shoes');
    return '<div class="mp-row'+(hot?' hot':'')+'"><span class="n">'+(j+1)+'</span><b>'+r[0]+'</b><div class="t">'+r[1].map((k,q)=>(q?'<span class="mp-ar">→</span>':'')+'<span class="mp-t'+(k==='shoes'?' cur':MP_T[k][1]>5?' tbd':'')+'">'+(MP_T[k][1]>5?'?':MP_T[k][0])+'</span>').join('')+'</div></div>';}).join('');
  L.done();}}
  ]
});
</script>
