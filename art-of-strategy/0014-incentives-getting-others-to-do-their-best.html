<script>
/* ===== This lesson’s own visuals: the frosted-workshop pay line (a worker behind a frosted window,
   two lamps for “takes the job” and “careful work pays”, and a pay line with a base handle and a
   success handle), the crowding-out dip bars, the efficiency-wage bars, the quota year, Tali’s
   ten spare hours, the airport board and the builder’s stage payments. Everything lives in this file. ===== */
(function(){const st=document.createElement('style');st.textContent=`
.card button[hidden]{display:none!important}
.iv-svg{display:block;width:100%;max-width:330px;margin:4px auto}
.iv-drag{touch-action:none;cursor:ns-resize}
.iv-ro{font-size:14px;text-align:center;color:var(--muted);margin:6px 0;min-height:20px;line-height:1.45}
.iv-ro b{color:var(--ink)}
.iv-ill{font-size:12px;color:var(--muted);text-align:center;margin:2px 0 4px;font-style:italic}
.iv-ctl{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;margin:6px 0}
.iv-ctl .chip,.iv-ctl .btn{margin:0}
.iv-cap{font-size:15px;line-height:1.5;margin:8px 0}
.iv-sl{display:block;margin:6px auto 0;max-width:330px}
.iv-sl .h{display:flex;justify-content:space-between;font-size:14px;gap:8px}
.iv-sl input{width:100%;height:34px;margin:0;accent-color:var(--pri)}
.iv-sl input:disabled{opacity:.4}
.iv-st{font-size:13px;font-weight:700;letter-spacing:.3px;color:var(--pri-deep);text-align:center;margin:4px 0}
.iv-say{background:var(--soft);border-radius:14px;padding:10px 13px;font-size:15px;line-height:1.5;margin:8px 0;min-height:48px}
.iv-say b.t{display:block;font-size:11.5px;letter-spacing:.4px;color:var(--muted);margin-bottom:2px}
.iv-steps{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:4px 0 8px}
.iv-steps span{font-size:11px;line-height:1.25;font-weight:600;text-align:center;border-radius:10px;padding:6px 1px;background:var(--soft);color:var(--muted);border:1.5px solid transparent}
.iv-steps span.cur{background:var(--pri-bg);color:var(--pri-deep);border-color:var(--pri)}

.iv-bk .row{display:grid;grid-template-columns:1fr 1fr;gap:6px;align-items:stretch}

.iv-bk .row .why:empty{display:none}

.iv-bk .chip svg{flex:0 0 18px;width:18px;height:18px}
.iv-bi{display:flex;gap:10px;align-items:center}
.iv-bi svg{flex:0 0 38px;width:38px;height:38px}
/* strategy-map strip */
.mp-row{display:grid;grid-template-columns:22px 1fr;gap:2px 8px;align-items:start;border-bottom:1px solid var(--line);padding:6px 2px}
.mp-row .n{width:20px;height:20px;border-radius:6px;background:var(--soft2);color:var(--muted);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.mp-row.hot .n{background:var(--pri);color:var(--pri-ink)}
.mp-row b{font-size:13px;line-height:1.35;font-weight:600}
.mp-row.hot b{color:var(--pri-deep)}
.mp-row .t{grid-column:2;display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.mp-t{font-size:11.5px;font-weight:600;border-radius:7px;padding:2px 7px;background:var(--soft2);color:var(--ink)}
.mp-t.cur{background:var(--pri);color:var(--pri-ink)}
.mp-ar{color:var(--faint);font-size:11px}
`;document.head.appendChild(st);})();

/* ---------- small helpers ---------- */
const ivNum=v=>String(Math.abs(Math.round(v))).replace(/\B(?=(\d{3})+(?!\d))/g,',');
const ivD=v=>(v<0?'−':'')+'$'+ivNum(v);
const ivL=v=>(v<0?'−':'')+'£'+ivNum(v);
const ivK=v=>{const k=Math.round(Math.abs(v)/100)/10;return k?(v<0?'−':'')+'$'+k+'k':'$0';};
function ivSet(inp,v){inp.value=v;inp.dispatchEvent(new Event('input',{bubbles:true}));}
function ivChips(host,labels,cb){labels.forEach((t,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=t;
  b.onclick=()=>{[...host.children].forEach((x,q)=>x.classList.toggle('sel',q===j));cb(j,b);};host.appendChild(b);});}
const ivDefs='<defs><filter id="ivBl" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.4"/></filter></defs>';
function ivFig(x,b,c){return '<circle cx="'+x+'" cy="'+(b-38)+'" r="7" fill="'+c+'"/><rect x="'+(x-7)+'" y="'+(b-29)+'" width="14" height="20" rx="5" fill="'+c+'"/><path d="M'+(x-3.5)+' '+(b-10)+'V'+b+'M'+(x+3.5)+' '+(b-10)+'V'+b+'" stroke="'+c+'" stroke-width="3.5" stroke-linecap="round"/>';}
/* the workshop with a frosted window: 132 wide, 80 tall */
function ivShop(x,y,lab){
  return '<g transform="translate('+x+' '+y+')">'+
   '<path d="M2 24L66 2L130 24" fill="var(--card)" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round"/>'+
   '<rect x="8" y="24" width="116" height="54" rx="4" fill="var(--card)" stroke="var(--ink)" stroke-width="2"/>'+
   '<rect x="16" y="31" width="68" height="40" rx="3" fill="var(--soft2)" stroke="var(--line2)" stroke-width="1.5"/>'+
   '<g filter="url(#ivBl)" opacity=".8"><circle cx="38" cy="44" r="6" fill="var(--muted)"/><rect x="31" y="51" width="14" height="17" rx="4" fill="var(--muted)"/><rect x="50" y="57" width="28" height="4" rx="2" fill="var(--muted)"/><rect x="56" y="44" width="16" height="11" rx="2" fill="var(--muted)"/></g>'+
   '<path d="M19 45L33 33M19 60L45 34M26 70L62 34M44 70L80 36M62 70L82 52" stroke="var(--card)" stroke-width="2.4" opacity=".6"/>'+
   '<rect x="94" y="42" width="22" height="36" rx="3" fill="var(--soft2)" stroke="var(--line2)" stroke-width="1.5"/><circle cx="111" cy="61" r="1.8" fill="var(--muted)"/>'+
   '</g>';}
function ivLamp(x,y,on,lab,sub,q){
  return (on?'<circle cx="'+x+'" cy="'+y+'" r="14" fill="var(--ok-strong)" opacity=".22"/>':'')+
   '<circle cx="'+x+'" cy="'+y+'" r="9" fill="'+(on?'var(--ok-strong)':'var(--soft2)')+'" stroke="'+(on?'var(--ok-strong)':'var(--line2)')+'" stroke-width="2"/>'+
   (on?'<path d="M'+(x-4)+' '+y+'l3 3l5-6" stroke="var(--card)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>':(q?'<text x="'+x+'" y="'+(y+4)+'" text-anchor="middle" font-size="11" font-weight="700" fill="var(--muted)">?</text>':''))+
   '<text x="'+(x+16)+'" y="'+(sub?y-1:y+4)+'" font-size="12.5" font-weight="700" fill="'+(on?'var(--ok)':'var(--muted)')+'">'+lab+'</text>'+
   (sub?'<text x="'+(x+16)+'" y="'+(y+13)+'" font-size="11" fill="var(--muted)">'+sub+'</text>':'');}

/* ---------- the frosted-workshop pay line (the book’s Wizard 1.0 numbers) ----------
   Success is worth $200k to the owner. Routine effort succeeds 60% of the time, careful effort 80%.
   The programmer can earn $50k elsewhere and counts careful effort as costing her $20k.
   She picks the effort that gives her the most (ties go to careful, as in the book), and takes
   the job only if that is worth at least $50k to her. Options: noFines (base can’t go below $0),
   risk (illustrative: a risk-shy worker knocks 20¢ off per $1 of spread), pC (careful success %). */
function ivCalc(o){const F=o.F,S=o.S,pC=o.pC||80,pR=60,d=S-F,rc=o.risk?Math.round(Math.abs(d)*0.2):0;
  const aR=F+pR*d/100,aC=F+pC*d/100,uR=aR-rc,uC=aC-20000-rc,care=uC>=uR-1,best=Math.max(uR,uC),takes=best>=49999;
  const p=care?pC:pR,avg=care?aC:aR;
  return {F,S,d,rc,aR,aC,uR,uC,care,best,takes,avg,p,profit:takes?p*2000-avg:0};}
function ivPay(L,host,o){
  o=Object.assign({F:50000,S:50000,noFines:false,risk:false,pC:80,lock:false,hide:false,onChange:null,
    tag:'The book’s example: Wizard 1.0, a chess program worth $200k to you if it succeeds'},o||{});
  const w=document.createElement('div');host.appendChild(w);
  w.innerHTML='<svg class="iv-svg iv-drag" viewBox="0 0 320 272" role="img" aria-label="A workshop with a frosted window hides the programmer’s effort. Two lamps show whether she takes the job and whether careful work pays her. Below, a pay line joins her pay if the project fails to her pay if it succeeds; drag either end up or down."></svg>'+
    '<p class="iv-ro" aria-live="polite"></p>'+
    '<label class="iv-sl"><span class="h"><span>Pay if it fails (base)</span><b class="vf"></b></span><input type="range" class="sf" min="-20000" max="100000" step="5000"></label>'+
    '<label class="iv-sl"><span class="h"><span>Pay if it succeeds</span><b class="vs"></b></span><input type="range" class="ss" min="0" max="160000" step="5000"></label>'+
    '<p class="iv-ill"></p>';
  const svg=w.querySelector('svg'),ro=w.querySelector('.iv-ro'),sf=w.querySelector('.sf'),ss=w.querySelector('.ss');
  const Y=v=>236-(Math.max(-20000,Math.min(160000,v))+20000)/180000*124,XF=92,XS=258;
  const api={w,o,c:null,sf,ss};
  function draw(){const c=ivCalc(o);api.c=c;const F=o.F,S=o.S,h=o.hide;
    let s=ivDefs+'<rect width="320" height="272" rx="14" fill="var(--soft)"/>';
    s+=ivShop(8,6,'')+'<text x="74" y="99" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--muted)">workshop: effort hidden</text>';
    s+=ivLamp(160,30,!h&&c.takes,'Takes the job',o.risk?'worth ≥ $50k after the risk':'best option ≥ $50k',h);
    s+=ivLamp(160,68,!h&&c.care,'Careful work pays',((o.pC||80)-60)+'% × bonus ≥ $20k',h);
    /* chart */
    if(o.noFines)s+='<rect x="46" y="'+Y(0).toFixed(1)+'" width="262" height="'+(Y(-20000)-Y(0)).toFixed(1)+'" fill="var(--soft2)"/><text x="190" y="'+(Y(-10000)+4).toFixed(1)+'" text-anchor="middle" font-size="11" font-weight="600" fill="var(--muted)">no fines allowed</text>';
    else s+='<text x="190" y="'+(Y(-10000)+4).toFixed(1)+'" text-anchor="middle" font-size="11" font-weight="600" fill="var(--muted)">below $0: she pays you a fine</text>';
    [[0,'$0'],[50000,'$50k'],[100000,'$100k'],[150000,'$150k']].forEach(g=>{const y=Y(g[0]).toFixed(1);
      s+='<path d="M46 '+y+'H308" stroke="'+(g[0]?'var(--line)':'var(--line2)')+'" stroke-width="'+(g[0]?1:1.8)+'"/><text x="42" y="'+(+y+4)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+g[1]+'</text>';});
    const yf=Y(F),ys=Y(S);
    s+='<path d="M'+XF+' '+yf.toFixed(1)+'L'+XS+' '+ys.toFixed(1)+'" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>';
    if(Math.abs(ys-yf)>3){s+='<path d="M286 '+yf.toFixed(1)+'H294M290 '+yf.toFixed(1)+'V'+ys.toFixed(1)+'M286 '+ys.toFixed(1)+'H294" stroke="var(--pri)" stroke-width="2.2" fill="none"/>';
      if(Math.abs(ys-yf)>=62)s+='<text transform="translate(305 '+((yf+ys)/2).toFixed(1)+') rotate(-90)" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--pri-deep)">bonus '+ivK(S-F)+'</text>';}
    const hdl=(x,y,col)=>'<circle cx="'+x+'" cy="'+y.toFixed(1)+'" r="22" fill="transparent"/><circle cx="'+x+'" cy="'+y.toFixed(1)+'" r="10.5" fill="'+col+'" stroke="var(--card)" stroke-width="2.5"/><path d="M'+(x-4)+' '+(y-2).toFixed(1)+'l4-4l4 4M'+(x-4)+' '+(y+2).toFixed(1)+'l4 4l4-4" stroke="var(--card)" stroke-width="1.6" fill="none"/>';
    s+=hdl(XF,yf,'var(--h2)')+hdl(XS,ys,'var(--pri)');
    const halo=' style="paint-order:stroke" stroke="var(--soft)" stroke-width="4"';
    s+='<text x="'+(XF+16)+'" y="'+(yf+4).toFixed(1)+'" font-size="12.5" font-weight="700" fill="var(--h2)"'+halo+'>'+ivK(F)+'</text>';
    s+='<text x="'+(XS-16)+'" y="'+(ys+4).toFixed(1)+'" text-anchor="end" font-size="12.5" font-weight="700" fill="var(--pri-deep)"'+halo+'>'+ivK(S)+'</text>';
    s+='<text x="'+XF+'" y="258" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">if it fails</text><text x="'+XS+'" y="258" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">if it succeeds</text>';
    svg.innerHTML=s;
    w.querySelector('.vf').textContent=ivD(F);w.querySelector('.vs').textContent=ivD(S);
    if(h)ro.innerHTML='Lamps covered until you decide.';
    else if(!c.takes)ro.innerHTML='She <b>turns the job down</b>: at best it’s worth '+ivK(c.best)+' to her, less than the $50k she can earn elsewhere. Your profit: <b>$0</b>';
    else ro.innerHTML='Behind the glass she picks <b>'+(c.care?'careful':'routine')+' effort</b> · her average pay <b>'+ivK(c.avg)+'</b>'+(o.risk?' (worth '+ivK(c.avg-c.rc)+' to her)':'')+'<br>Your average profit: <b>'+ivK(c.profit)+'</b>';}
  api.draw=draw;
  api.set=(F,S)=>{o.F=Math.max(o.noFines?0:-20000,Math.min(100000,F));o.S=Math.max(0,Math.min(160000,S));sf.value=o.F;ss.value=o.S;draw();if(o.onChange)o.onChange(api.c,api);};
  api.opt=p=>{Object.assign(o,p);sf.min=o.noFines?0:-20000;w.querySelector('.iv-ill').textContent=o.tag;api.set(o.F,o.S);};
  api.lock=v=>{o.lock=v;sf.disabled=v;ss.disabled=v;};
  let tw=0;
  api.anim=(F,S,ms,cb)=>{clearInterval(tw);const f0=o.F,s0=o.S,t0=Date.now();
    tw=setInterval(()=>{if(!w.isConnected){clearInterval(tw);return;}const k=Math.min(1,(Date.now()-t0)/ms);
      o.F=f0+(F-f0)*k;o.S=s0+(S-s0)*k;if(k>=1){clearInterval(tw);api.set(F,S);if(cb)cb(api.c);}else draw();},30);};
  let drag=null;
  const pt=e=>{const r=svg.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*320,y:(e.clientY-r.top)/r.height*272};};
  const fromY=y=>Math.round(((236-y)/124*180000-20000)/5000)*5000;
  const move=p=>{const v=fromY(p.y);if(drag==='F')api.set(v,o.S);else api.set(o.F,v);};
  svg.addEventListener('pointerdown',e=>{if(o.lock)return;const p=pt(e);if(p.y<104)return;drag=p.x<175?'F':'S';try{svg.setPointerCapture(e.pointerId);}catch(_){}move(p);});
  svg.addEventListener('pointermove',e=>{if(drag&&!o.lock)move(pt(e));});
  ['pointerup','pointercancel'].forEach(t=>svg.addEventListener(t,()=>{drag=null;}));
  sf.addEventListener('input',()=>{if(!o.lock)api.set(+sf.value,o.S);});
  ss.addEventListener('input',()=>{if(!o.lock)api.set(o.F,+ss.value);});
  api.opt({});api.lock(o.lock);return api;}

/* ---------- other pictures ---------- */
function ivCrate(x,y,c,mark){return '<rect x="'+x+'" y="'+y+'" width="40" height="28" rx="3" fill="var('+c+'-bg)" stroke="var('+c+')" stroke-width="2"/><path d="M'+x+' '+(y+14)+'H'+(x+40)+'" stroke="var('+c+')" stroke-width="1.5"/>'+(mark?'<text x="'+(x+20)+'" y="'+(y+25)+'" text-anchor="middle" font-size="11" font-weight="700" fill="var('+c+')">'+mark+'</text>':'');}

  let s='<rect width="320" height="180" rx="14" fill="var(--soft)"/>';
  s+='<rect x="18" y="10" width="124" height="40" rx="8" fill="var(--ink)"/><text x="80" y="25" text-anchor="middle" font-size="11" font-weight="700" fill="var(--card)" opacity=".8" letter-spacing=".4">QUANTITY QUOTA</text><text x="80" y="44" text-anchor="middle" font-size="16" font-weight="700" fill="var(--card)">1,000 ✓ met</text>';
  s+='<rect x="114" y="56" width="12" height="22" fill="var(--line2)"/><path d="M18 78V62L49 78V62L80 78V62L111 78V62L142 78Z" fill="var(--card)" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/>';
  s+='<rect x="18" y="78" width="124" height="72" fill="var(--card)" stroke="var(--ink)" stroke-width="2"/>';
  [28,58,88].forEach(x=>s+='<rect x="'+x+'" y="90" width="20" height="16" rx="2" fill="var(--soft2)" stroke="var(--line2)"/>');

    [[262,116],[274,110],[286,116]].forEach(p=>s+='<ellipse cx="'+p[0]+'" cy="'+p[1]+'" rx="9" ry="5" fill="var(--card)" stroke="var(--ink)" stroke-width="1.5"/><path d="M'+(p[0]-5)+' '+(p[1]-3)+'l3 3l-2 2l4 2" stroke="var(--no-strong)" stroke-width="1.6" fill="none"/>');
    s+='<text x="274" y="168" text-anchor="middle" font-size="12" font-weight="700" fill="var(--no)">quality ✗</text>';
  }else s+=ivCrate(254,122,'--h3','?')+'<text x="274" y="168" text-anchor="middle" font-size="12" font-weight="700" fill="var(--muted)">quality?</text>';
  return s;}
function ivMhArt(look,res){
  let s=ivDefs+'<rect width="320" height="170" rx="14" fill="var(--soft)"/>';
  s+=ivShop(94,14,'')+'<text x="160" y="108" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--muted)">student’s room</text><text x="160" y="122" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--muted)">effort hidden</text>';
  /* pages going in */
  [0,1,2].forEach(j=>s+='<rect x="'+(20+j*3)+'" y="'+(48-j*3)+'" width="40" height="50" rx="3" fill="var(--card)" stroke="var(--line2)" stroke-width="1.5"/>');
  s+='<path d="M32 60H58M32 68H58M32 76H52" stroke="var(--line2)" stroke-width="1.5"/><text x="42" y="114" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--ink)">600 pages</text>';
  s+='<path d="M70 70H90" stroke="var(--ink)" stroke-width="2"/><path d="M86 65L92 70L86 75" fill="none" stroke="var(--ink)" stroke-width="2"/>';
  if(look)s+='<ellipse cx="112" cy="138" rx="15" ry="9" fill="var(--card)" stroke="var(--no-strong)" stroke-width="2"/><circle cx="112" cy="138" r="4" fill="var(--no-strong)"/><text x="134" y="142" font-size="12" font-weight="700" fill="var(--no)">still frosted</text>';

Course.lesson({
  id:'0014', title:'Incentives: getting others to do their best', minutes:20, icon:'star',
  goals:['Spot hidden effort, and pay on what you can see: a base plus a reward tied to results',
         'Design a deal that lights both lamps: worth taking, and careful work pays',
         'Dodge the traps: all-or-nothing targets, one-task bonuses, two bosses, and small payments where people already care'],
  parts:['Hidden effort','The pay line','Many tasks, many people','Use it'],
  read:'Read chapter 13 of the book, “Incentives”, for the proofreader, the Wizard 1.0 numbers, efficiency wages, Heathrow’s split management, the IQ-test experiment and the author-and-publisher case.',
  glossary:{
   participation:'Participation constraint: on average, the deal must give the worker at least as much as their other options, after the cost of their effort, or they won’t take it.',
   'incentive-compat':'Incentive compatibility: the deal makes the effort you want the worker’s own best choice, because the extra pay it brings covers what the effort costs them.',
   nonlinear:'Nonlinear scheme: pay that jumps at a threshold, such as a bonus for hitting a quota, instead of rising in step with every result (a linear scheme, like a fixed commission).',
   'efficiency-wage':'Efficiency wage: pay set a bit above what the worker could earn elsewhere, so keeping the job matters and the risk of being caught slacking isn’t worth it.',
   'crowding-out':'Crowding out: paying people for something they would do anyway for its own sake can make them care less, so a small payment can bring less effort than none.'
  },
  cheatsheet:[
   '<b>Hidden effort (moral hazard):</b> you can’t see how hard someone works, only results, and results mix effort with luck. So pay on what you can see.',
   '<b>Mix a base with pay per result:</b> a flat fee invites slacking; pay only on results may find no takers. The book’s proofreader: $600 plus $1 per error found.',
   '<b>Two lamps:</b> the average must beat their other options (participation); the spread between good and bad results must cover what effort costs them (incentive compatibility).',
   '<b>Avoid all-or-nothing targets:</b> a hopeless or already-met quota stops effort and invites games. Pay that rises with every result is sturdier.',
   '<b>Many tasks:</b> pay only for the easy-to-measure one and the others empty. Keep pay moderate on tasks that compete for the same hours; group tasks that help each other.',
   '<b>Ongoing work:</b> pay a bit above the going rate (an efficiency wage), so keeping the job matters. Your regular mechanic stays honest.',
   '<b>Where people already care:</b> pay properly or not at all. In the book’s study, 3¢ an answer got 23 right; no pay got 28.',
   'One-minute move (how this course applies the book): what can I see? → enough to take it, part on results → no all-or-nothing → every task counted → a premium for ongoing work → no small money where they care.'
  ],

{part:0,src:'Chapter 13 · Incentives for Effort',pts:1,run(L){
  L.h(L.kick('try','Build the rule')+'<h1 class="q">Build the rule Tali takes from the proofreader. Tap each piece to change it.</h1>');

    ['A flat fee fails because nothing rewards a careful job;','A flat fee fails because the worker may turn it down;','A flat fee fails because it always costs the most;'],

   'Exactly. A base handles “will they take it?”; pay per result handles “will they try?”. The book calls this a compromise between the two extremes.');}},

  L.h(L.kick('learn','The pay line')+'<h1 class="q">Set her pay if Wizard fails and if it succeeds. Drag the two handles, or use the sliders, until both lamps light.</h1><div id="plv"></div>');
  L.card.__pay=ivPay(L,L.$('#plv'),{onChange:c=>{if(c.takes&&c.care&&!fin){fin=true;
    L.sheet('info','Two lamps, two jobs','The <b>gap</b> between the two ends is her bonus for success. Care raises her chance of success by 20 points, so care pays her when 20% of the bonus covers the $20k it costs her: a bonus of $100k or more. The <b>level</b> of the line sets her average pay, which decides whether the job beats her $50k elsewhere. Keep moving: which line earns you the most?');L.done();}}});}},

{part:1,src:'Chapter 13 · How to Reward Work Effort',pts:1,
 solve:async L=>{L.$$('#fxo .opt')[1].click();},
 run(L){
  let a=false;
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">You offer a flat $70k, the careful-effort wage, whatever happens. Behind the glass, what does she do?</h1><div class="opts" id="fxo"></div><div id="fxv"></div>');
  const p=ivPay(L,L.$('#fxv'),{F:70000,S:70000,hide:true,lock:true});
  ['She gives careful effort: she’s paid the careful wage','She takes the job and gives routine effort','She turns the job down: it isn’t enough'].forEach((t,j)=>{const b=document.createElement('button');b.className='opt';b.innerHTML='<span class="key">'+(j+1)+'</span><span>'+t+'</span>';
    b.onclick=()=>{if(a)return;a=true;const ok=j===1;L.award(ok);b.classList.add(ok?'ok':'no');if(!ok)L.$$('#fxo .opt')[1].classList.add('ok');
      setTimeout(()=>{if(!p.w.isConnected)return;p.o.hide=false;p.draw();
        L.sheet(ok?'ok':'no',ok?'Paid for care, she gives routine effort':'She takes it and gives routine effort','A flat line has no gap: careful and routine work pay her the same $70k, and care costs her $20k. So the job lamp lights, the effort lamp stays dark. You average $120k in sales minus $70k: <b>$50k profit</b>, worse than simply paying $50k for routine work ($70k). More pay doesn’t buy effort you can’t see.');L.done();},500);};
    L.$('#fxo').appendChild(b);});}},

{part:1,src:'Chapter 13 · Carrots versus Sticks',
 solve:async L=>{L.$('#csc').children[0].click();L.$('#csc').children[1].click();},
 run(L){
  const seen=new Set();let fin=false;
  L.h(L.kick('learn','Two dials: average and spread')+'<h1 class="q">Same average, same spread, two schemes. Compare the carrot and the stick.</h1>'+
   '<div class="iv-ctl" id="csc"></div>'+
   '<svg class="iv-svg" id="csv" viewBox="0 0 320 196" role="img" aria-label="Two bars: the usual result and a rare result, with a dashed average line at 100 and a bracket showing a spread of 50"></svg>'+
   '<p class="iv-cap">Every scheme has two dials. The <b>average</b> must beat their other options: the '+L.g('participation','participation constraint')+'. The <b>spread</b> between good and bad results makes effort pay: '+L.g('incentive-compat','incentive compatibility')+'.</p>');
  const draw=k=>{L.$('#csv').innerHTML=ivCSArt(k);};draw(0);
  ivChips(L.$('#csc'),['Carrot','Stick'],j=>{draw(j);seen.add(j);
    if(seen.size===2&&!fin){fin=true;
      L.sheet('info','They feel different, but work the same','The book’s numbers: a carrot pays 99 almost always and 149 for a rare great result; a stick pays 101 almost always and 51 for a rare awful one. Both average 100 with a spread of 50. A stick must still be tied to effort: Stalin’s punishments were cheap and harsh, but hit hard workers almost as easily as shirkers, so they gave no reason to work hard.');L.done();}});
  L.$('#csc').children[0].classList.add('sel');}},

{part:1,src:'Chapter 13 · How to Reward Work Effort',pts:2,
 solve:async L=>{const p=L.card.__pay;p.set(-10000,90000);L.$('#chb').click();await L.sleep(20);p.set(0,100000);L.$('#chb').click();},
 run(L){
  let ph=0;
  L.h(L.kick('pr','Challenge')+'<h1 class="q">Find the pay line that lights both lamps and earns you the most.</h1>'+
   '<p class="iv-st" id="chs">Round 1 of 2 · fines allowed</p><div id="chv"></div>'+
   '<div class="iv-ctl"><button class="btn pri" id="chb">'+L.ic('check')+'Lock in this deal</button></div><div id="chf"></div>');
  const p=L.card.__pay=ivPay(L,L.$('#chv'),{});
  L.$('#chb').onclick=()=>{const c=p.c;
    if(ph===0){ph=1;const ok=c.takes&&c.care&&c.profit===90000;L.award(ok);
      L.fb(L.$('#chf'),ok?'<b>Best possible: $90k profit.</b> $90k on success, a $10k fine on failure: the book’s answer. It’s like selling her half the firm for $10k, so care is in her own interest. You earn exactly what you would if you could watch her.':
        '<b>Not the best yet.</b> The book’s answer: $90k on success and a $10k fine on failure. The bonus is the $100k minimum, and her average is exactly $70k: $90k profit for you, as if you could watch her. The line moves there now.','info');
      if(!ok)p.set(-10000,90000);
      setTimeout(()=>{if(!p.w.isConnected)return;p.opt({noFines:true});L.$('#chs').textContent='Round 2 of 2 · fines not allowed';
        L.$('#chb').innerHTML=L.ic('check')+'Lock in the new deal';},ok?10:600);
      return;}
    if(ph===1){ph=2;const ok=c.takes&&c.care&&c.profit===80000;L.award(ok);p.lock(true);L.$('#chb').disabled=true;
      if(!ok)p.set(0,100000);
      L.sheet(ok?'ok':'no',ok?'$100k or nothing: $80k profit':'Best without fines: $100k or nothing',
        'Fines may be illegal, and she may not have $10k to buy a half share. So the bonus stays at $100k and the base can’t go below $0: her average pay rises to $80k and your profit falls to <b>$80k</b>. Now not seeing effort costs you $10k.');L.done();}};}},

{part:1,src:'Chapter 13 · Nonlinear Incentive Schemes',
 solve:async L=>{const s=L.$('#qsc').children,k=L.$('#qlc').children;s[0].click();k[1].click();k[2].click();s[1].click();},
 run(L){
  let sch='quota',luck='normal',fin=false;const seen=new Set();
  L.h(L.kick('learn','The quota trap')+'<h1 class="q">Plover’s new-business lead gets a big bonus for hitting a yearly sales quota. Change their luck. Then change the pay.</h1>'+
   '<div class="iv-ctl" id="qsc"></div><div class="iv-ctl" id="qlc"></div>'+
   '<svg class="iv-svg" id="qv" viewBox="0 0 320 200" role="img" aria-label="Sales so far this year climbing month by month toward a dashed quota line, with a row of dots showing in which months the salesperson works hard or coasts"></svg>'+
   '<p class="iv-ro" id="qro" aria-live="polite"></p><p class="iv-ill">Illustrative numbers.</p>');
  const TX={'quota-normal':'Works hard all year and just makes the quota in December. A well-set quota is a strong spur.',
    'quota-bad':'By July the quota is out of reach, so effort stops for the rest of the year.',
    'quota-lucky':'Quota met by June: nothing more to earn this year. Effort stops, and asking clients to delay orders into next year starts to pay.',
    'comm-normal':'Every sale pays the same share, so effort stays up all year.','comm-bad':'Bad luck early, but every sale still pays: effort stays up.','comm-lucky':'Good luck early, and every extra sale still pays: effort stays up.'};
  function draw(){L.$('#qv').innerHTML=ivQArt(sch,luck);L.$('#qro').innerHTML=TX[sch+'-'+luck];
    if(sch==='quota'&&luck!=='normal')seen.add(luck);if(sch==='comm'&&luck!=='normal')seen.add('c');
    if(seen.size===3&&!fin){fin=true;
      L.sheet('info','All-or-nothing targets are fragile','A quota is a '+L.g('nonlinear','nonlinear scheme')+': pay jumps at one line. Set just right, it spurs effort. But a hopeless quota or one already met gives no reason to try, and it invites games like shifting orders between years. Linear pay, a share of every result, is sturdier. That’s why many firms mix the two: a commission plus a quota bonus.');L.done();}}
  ivChips(L.$('#qsc'),['Quota bonus','A share of every sale'],j=>{sch=j?'comm':'quota';draw();});
  ivChips(L.$('#qlc'),['Normal year','Bad first half','Lucky first half'],j=>{luck=['normal','bad','lucky'][j];draw();});
  L.$('#qsc').children[0].classList.add('sel');L.$('#qlc').children[0].classList.add('sel');draw();}},

{part:1,src:'Workouts · Trip to the Gym No. 9',pts:1,run(L){
  L.h(L.kick('pr','The book’s puzzle')+'<h1 class="q">A house sells for $250,000 with a 6% commission. The seller’s agent works hard and gets $20,000 more. Commissions are split with the buyer’s agent, then with the agency. How much more does the seller’s agent keep?</h1>');
  L.mc(L.card,['$1,200: 6% of the extra $20,000','$600: half of the extra commission','$300: half of half of the extra commission'],2,
   'Right: $1,200, halved to $600, halved again to $300. Hardly worth weeks of extra effort, so agents gain more by selling fast. The book suggests 2.5% up to $200,000 and 20% above it; the catch is agreeing where that line sits.',
   'Follow the money: 6% of $20,000 is $1,200; split with the buyer’s agent leaves $600; split with the agency leaves $300. A weak incentive, so agents gain more by selling fast than by holding out for a better price.');}},

/* ---------- PART 3: MANY TASKS, MANY PEOPLE ---------- */
{part:2,src:'Chapter 13 · Multiple Tasks',
 solve:async L=>{ivSet(L.$('#hbs'),40);await L.sleep(10);ivSet(L.$('#hms'),20);ivSet(L.$('#hbs'),20);},
 run(L){
  let b=0,m=0,saw0=false,fin=false;
  L.h(L.kick('learn','Many tasks, one person')+'<h1 class="q">Greer’s new team bonus. Pay Tali only for billable hours, and watch the mentoring. Then find a mix that keeps both alive.</h1>'+
   '<svg class="iv-svg" id="hv" viewBox="0 0 320 190" role="img" aria-label="Ten blocks for Tali’s spare hours, coloured by billable work or mentoring, with bars for billed hours and mentoring hours and the cost of Greer’s bonus"></svg>'+
   '<label class="iv-sl"><span class="h"><span>Bonus per billable hour</span><b id="hbn">£0</b></span><input type="range" id="hbs" min="0" max="40" step="5" value="0"></label>'+
   '<label class="iv-sl"><span class="h"><span>Bonus per mentoring hour</span><b id="hmn">£0</b></span><input type="range" id="hms" min="0" max="40" step="5" value="0"></label>'+
   '<p class="iv-ill">Illustrative numbers. With no bonus, Tali splits the hours evenly.</p>');
  function draw(){b=+L.$('#hbs').value;m=+L.$('#hms').value;L.$('#hbn').textContent='£'+b;L.$('#hmn').textContent='£'+m;L.$('#hv').innerHTML=ivHoursArt(b,m);
    const hm=(b+m)===0?5:Math.round(10*m/(b+m));
    if(b>0&&m===0)saw0=true;
    if(saw0&&b>0&&m>0&&hm>=3&&hm<=7&&!fin){fin=true;
      L.sheet('info','Strong pay on one task drains the other','Billable work and mentoring compete for the same hours: the book calls such tasks substitutes. Pay hard for one and the other empties. And raising both bonuses doesn’t add hours, it only raises the bill. So when tasks compete, keep both incentives weaker than you would for either alone, and never pay only for the one that’s easy to measure.');L.done();}}
  ['#hbs','#hms'].forEach(s=>L.$(s).addEventListener('input',draw));draw();}},

{part:2,src:'Chapter 13 · Multiple Tasks',
 solve:async L=>{L.$('#arc').children[1].click();L.$('#arc').children[0].click();},
 run(L){
  const seen=new Set();let fin=false;
  L.h(L.kick('learn','Group tasks that help each other')+'<h1 class="q">London’s three airports. Compare how they’re run with the book’s rule.</h1>'+
   '<div class="iv-ctl" id="arc"></div>'+
   '<svg class="iv-svg" id="arv" viewBox="0 0 320 206" role="img" aria-label="Three airports side by side, each with buildings, security, shops and landing fees, coloured by who controls each part"></svg>'+
   '<p class="iv-cap">Some tasks help each other, like bees and apple trees: the book calls them complements. Others compete for the same effort, like a farmhand tired out by corn before the dairy shift.</p>');
  const draw=k=>{L.$('#arv').innerHTML=ivAirArt(k);};draw(0);
  ivChips(L.$('#arc'),['As run when the book was written','The book’s rule'],j=>{draw(j);seen.add(j);
    if(seen.size===2&&!fin){fin=true;
      L.sheet('info','Complements together, substitutes apart','Getting a passenger from kerb to plane is one chain of complements, so the book wants one manager per airport, with the airports competing. London had the reverse: one company owned all three, while inside each airport shops, security and fees answered to different bodies. Shop leases earned more than security lanes, so security got too little space. For Tali: give one person tasks that feed each other, with strong rewards; where tasks compete for hours, keep rewards moderate.');L.done();}});
  L.$('#arc').children[0].classList.add('sel');}},

{part:2,src:'Chapter 13 · Competition between Workers · Hierarchical Organizations; Case Study: Treat Them Like Royalty',run(L){
  L.h(L.kick('ex','Many workers, many links')+'<h1 class="q">When several people do similar work, comparisons can sharpen pay, and chains of bosses can blunt it.</h1>');
  const t=(x,y,txt,c,sz,a)=>'<text x="'+x+'" y="'+y+'" text-anchor="'+(a||'middle')+'" font-size="'+(sz||11.5)+'" font-weight="700" fill="var('+(c||'--ink')+')">'+txt+'</text>';
  L.beats(L.card,[
   ['Overlap the work',ivBeatSvg(80,'<rect x="10" y="12" width="150" height="20" rx="4" fill="var(--h2-bg)" stroke="var(--h2)" stroke-width="1.5"/><rect x="100" y="40" width="150" height="20" rx="4" fill="var(--h3-bg)" stroke="var(--h3)" stroke-width="1.5"/><rect x="100" y="8" width="60" height="56" rx="5" fill="none" stroke="var(--h4)" stroke-width="2.5" stroke-dasharray="4 3"/>'+t(52,27,'reader 1','--h2',12)+t(208,55,'reader 2','--h3',12)+t(130,76,'both read this part','--h4',12),'Pages split between two proofreaders, with an overlap read by both')+
     'Hire two proofreaders and give them some of the same pages. If one finds 12 errors there and the other finds 3, the second wasn’t trying. Luck is shared, so comparing them reveals effort.'],
   ['Keep it secret',ivBeatSvg(60,ivFig(36,54,'var(--h2)')+ivFig(224,54,'var(--h3)')+t(130,26,'who? which pages?','--h4',13)+t(130,45,'neither knows','--muted',12),'Two readers who don’t know each other or which pages overlap')+
     'Don’t tell either who the other is, or they could collude. Don’t say which pages overlap, or they’d read those carefully and skim the rest.'],
   ['First finder wins',ivBeatSvg(62,'<rect x="20" y="8" width="220" height="30" rx="4" fill="var(--card)" stroke="var(--ink)" stroke-width="2"/><path d="M130 8V38" stroke="var(--ink)" stroke-width="1.5"/><path d="M232 50H176" stroke="var(--pri)" stroke-width="3" stroke-linecap="round"/><path d="M183 44L175 50L183 56" fill="none" stroke="var(--pri)" stroke-width="3"/>'+t(75,28,'$2 a typo','--ink',12)+t(185,28,'start here','--pri-deep',12),'A book with an arrow starting from the back')+
     'For this book, students got $2 per typo, but only the first to find it. The author’s assistant won the most money: unlike the students, they looked ahead and started at the back.'],
   ['Chains of bosses',ivBeatSvg(60,t(28,28,'boss','--ink',12)+'<path d="M56 24H84" stroke="var(--line2)" stroke-width="2"/>'+t(120,28,'supervisor','--h4',12)+'<path d="M158 24H190" stroke="var(--line2)" stroke-width="2"/>'+t(222,28,'worker','--ink',12)+t(150,50,'passes shoddy work','--no',12),'Boss, supervisor and worker in a chain')+
     'If a supervisor certifies the work and earns a bonus for hitting targets, they may pass shoddy work to get it. To make such cheating less tempting, the top boss ends up keeping incentives weaker at those levels.'],
   ['Author and publisher',ivBeatSvg(66,'<path d="M16 40H244" stroke="var(--ink)" stroke-width="2"/><circle cx="92" cy="40" r="6" fill="var(--pri)"/><circle cx="148" cy="40" r="6" fill="var(--h4)"/>'+t(100,26,'author: $20','--pri-deep',12,'end')+t(140,26,'publisher: $24.30','--h4',12,'start')+t(130,60,'best list price, the book’s simple example','--muted',11),'A price line with the author’s best price at $20 and the publisher’s at $24.30')+
     'The book’s case: a royalty is a share of sales revenue, so the author wants the price that maximises revenue. The publisher also pays printing costs, so it wants a higher one. The authors settled the price in their contract up front.']],
   'Comparing people sharpens incentives when they share the same luck. But a contest between Tali and Linus for Greer’s bonus could feed the late-nights race from lesson 10: reward results, not hours seen.');}},

{part:2,src:'Chapter 13 · Efficiency Wages',pts:1,
 solve:async L=>{ivSet(L.$('#efs'),3200);L.$('#efb').click();},
 run(L){
  let a=false;
  L.h(L.kick('pr','Keep the good worker')+'<h1 class="q">Careful work is worth $60k a year to you. Find the lowest salary that keeps the worker from slacking.</h1>'+
   '<svg class="iv-svg" id="efv" viewBox="0 0 320 214" role="img" aria-label="A salary bar made of $40k from dead-end jobs, $8k for the cost of effort and a premium; below, the gain from slacking for a year compared with the expected loss"></svg>'+
   '<label class="iv-sl"><span class="h"><span>Premium above $48,000</span><b id="efn">$0</b></span><input type="range" id="efs" min="0" max="8000" step="400" value="0"></label>'+
   '<p class="iv-ill">The book’s example: careful effort costs the worker $8k a year; slacking is caught 25% of the time, and then they’re fired for good; interest is 10%.</p>'+
   '<div class="iv-ctl"><button class="btn pri" id="efb">'+L.ic('check')+'Offer this salary</button></div>');
  const draw=()=>{const X=+L.$('#efs').value;L.$('#efn').textContent=ivD(X);L.$('#efv').innerHTML=ivEffArt(X);};
  L.$('#efs').addEventListener('input',()=>{if(!a)draw();});draw();
  L.$('#efb').onclick=()=>{if(a)return;a=true;const X=+L.$('#efs').value,ok=X===3200;L.award(ok);L.$('#efs').disabled=true;L.$('#efb').disabled=true;
    if(!ok){L.$('#efs').value=3200;draw();}
    L.sheet(ok?'ok':'no',ok?'$51,200: honest work just pays':'The lowest honest salary is $51,200',
      (ok?'':'You offered '+ivD(48000+X)+'. '+(X<3200?'Below $51,200, slacking pays. ':'That works, but costs more than needed. '))+'Slacking saves $8k once, but risks a 25% chance of losing $3,200 a year for good, worth $32,000 at 10% interest: an $8k expected loss. That’s an '+L.g('efficiency-wage','efficiency wage')+', $11,200 above dead-end jobs, and worth it, since good work is worth $60k to you.');L.done();};}},

{part:2,src:'Chapter 13 · Motivated Workers',pts:1,
 solve:async L=>{for(const b of L.$$('#dpc .chip')){b.click();await L.sleep(5);}L.$$('#dpo .opt')[1].click();},
 run(L){
  const sh=[0,0,0,0];let a=false;
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">Fifty IQ-test questions. Some people are simply asked to do their best; others are paid per right answer. Tap each group.</h1>'+
   '<div class="iv-ctl" id="dpc"></div>'+
   '<svg class="iv-svg" id="dpv" viewBox="0 0 320 206" role="img" aria-label="Bars of average right answers out of 50 for four groups: no pay, 3 cents, 30 cents and 90 cents per right answer"></svg>'+
   '<div id="dpq" hidden><p class="iv-cap"><b>Now the 3¢ group.</b> Where does its bar land?</p><div class="opts" id="dpo"></div></div>');
  const draw=()=>{L.$('#dpv').innerHTML=ivDipArt(sh,-1);};draw();
  const map=[0,2,3];
  ivChips(L.$('#dpc'),['No pay','30¢ an answer','90¢ an answer'],j=>{sh[map[j]]=1;draw();if(sh[0]&&sh[2]&&sh[3])L.$('#dpq').hidden=false;});
  ['Between the unpaid and the well-paid groups','Below the unpaid group: the worst of all','Level with the well-paid groups'].forEach((t,j)=>{const b=document.createElement('button');b.className='opt';b.innerHTML='<span class="key">'+(j+1)+'</span><span>'+t+'</span>';
    b.onclick=()=>{if(a)return;a=true;const ok=j===1;L.award(ok);b.classList.add(ok?'ok':'no');if(!ok)L.$$('#dpo .opt')[1].classList.add('ok');
      sh[1]=1;L.$('#dpv').innerHTML=ivDipArt(sh,1);
      L.sheet(ok?'ok':'no',ok?'The dip: 23, the worst of all':'It dips to 23, the worst of all','Once money enters, it becomes the main reason to try, and 3¢ isn’t much of a reason. It may also say the task doesn’t matter. That’s '+L.g('crowding-out','crowding out')+'. The researchers’ advice: pay significantly, or not at all. People who care about the work need fewer, weaker money incentives.');L.done();};
    L.$('#dpo').appendChild(b);});}},

{part:2,src:'Chapter 13 · The Many Dimensions of Incentive Payment Schemes',pts:6,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Sharper or softer?',['Sharper incentives work here','Keep incentives softer here'],[
   ['An insurer’s claims team in a year of hurricanes: results depend mostly on the weather.',1,'When luck swamps effort, a reward for results mostly rewards luck. Keep it soft.'],
   ['Juno’s retoucher edits hundreds of photos a month for Juno, year after year.',0,'Many results average the luck out, so they track effort well. A long record allows sharper pay.'],
   ['Two proofreaders who share some pages, and so share the same luck.',0,'Shared luck makes comparing them a fair test of effort: relative pay can be sharp.'],
   ['Billable hours and mentoring, which fight for the same hours of Tali’s week.',1,'Substitutes: a strong pull on one empties the other. Keep both incentives moderate.'],
   ['Writing a pitch and presenting it, where each makes the other better.',0,'Complements: effort on one raises the other, so strong rewards on both work together.'],
   ['A team lead earns a bonus by signing off their own team’s work as good.',1,'In a chain of bosses, the certifier can pass shoddy work for their own bonus. The top boss keeps incentives weaker there.']]);}},

/* ---------- PART 4: USE IT ---------- */
{part:3,src:'Course application · built on Chapter 13',pts:1,
 solve:async L=>{for(let k=0;k<7;k++){L.$('#omb').click();await L.sleep(10);}ivSet(L.$('#oms'),60);L.$('#omg').click();},
 run(L){
  let s=-1,a=false;
  L.h(L.kick('pr','One-minute move')+'<h1 class="q">Hedda’s builder wants £8,000 up front. Run “Design incentives” in about a minute.</h1>'+
   L.note('How this course applies the book: a one-minute routine built only from the book’s advice on incentives.','compass')+
   '<div class="iv-steps" id="omst"><span>1 · See</span><span>2 · Pay</span><span>3 · Stages</span><span>4 · Tasks</span><span>5 · Again?</span><span>6 · Care</span></div>'+
   '<div class="iv-say" id="omt" aria-live="polite"></div>'+
   '<svg class="iv-svg" id="omv" viewBox="0 0 320 250" role="img" aria-label="Hedda’s bathroom behind a frosted window, two lamps, and four payment bars: a deposit and payments after the pipes, tiles and final checks"></svg>'+
   '<div id="omf" hidden><label class="iv-sl"><span class="h"><span>Held back until a stage passes Tali’s check</span><b id="omn">0%</b></span><input type="range" id="oms" min="0" max="100" step="5" value="0"></label>'+
   '<div class="iv-ctl"><button class="btn pri" id="omg">'+L.ic('check')+'Offer this deal</button></div></div>'+
   '<p class="iv-ill">Illustrative numbers: a £8,000 job with £2,000 of materials.</p>'+
   '<div class="iv-ctl"><button class="btn pri" id="omb">'+L.ic('arrow')+'Start</button></div>');
  const draw=(h,cov)=>{L.$('#omv').innerHTML=ivBuildArt(h,cov);};draw(0,true);
  const ST=[['STEP 1 · WHAT CAN TALI SEE?','Not the builder’s care. Only results: pipes that pass a pressure test, level tiles, a final walk-round. Those are what pay can ride on.'],
    ['STEP 2 · ENOUGH TO TAKE IT, PART ON RESULTS','A deposit that covers materials, so the builder takes the job. The rest is released as each check passes.'],
    ['STEP 3 · NO ALL-OR-NOTHING','Not one payment at the very end: one bad stage could make the rest feel pointless. Several stages keep every step worth doing well.'],
    ['STEP 4 · EVERY TASK COUNTED','No bonus just for speed, the easy thing to measure, or the tiling gets rushed. The checks cover quality, not only the finish date.'],
    ['STEP 5 · WILL THEY WORK FOR US AGAIN?','Hedda needs more work before selling the flat. A fair price, a bit above the cheapest quote, plus that next job makes honest work the builder’s best move too.'],
    ['STEP 6 · DO THEY ALREADY CARE?','This is paid work, so pay properly. Asking a favour fits people who help for its own sake. Now set the split.']];
  function go(n){s=n;L.$$('#omst span').forEach((p,j)=>p.className=j<n?'dn':j===n?'cur':'');L.$('#omt').innerHTML='<b class="t">'+ST[n][0]+'</b>'+ST[n][1];L.$('#omb').innerHTML=L.ic('arrow')+(n<5?'Next step':'Set the deal');}
  L.$('#omt').innerHTML='<b class="t">HEDDA’S BATHROOM</b>Six steps, about a minute. Right now: everything paid up front.';
  L.$('#oms').addEventListener('input',()=>{const h=+L.$('#oms').value;L.$('#omn').textContent=h+'%';if(!a)draw(h,false);});
  L.$('#omb').onclick=()=>{if(s<5){go(s+1);return;}L.$('#omb').hidden=true;L.$$('#omst span').forEach(p=>p.className='dn');L.$('#omf').hidden=false;draw(+L.$('#oms').value,false);
    L.$('#omt').innerHTML='<b class="t">SET THE DEAL</b>How much of the £8,000 should wait for Tali’s checks? Light both lamps.';};
  L.$('#omg').onclick=()=>{if(a)return;a=true;const h=+L.$('#oms').value,ok=h>=50&&h<=75;L.award(ok);L.$('#oms').disabled=true;L.$('#omg').disabled=true;
    L.sheet(ok?'ok':'no',ok?'Both lamps lit: '+h+'% rides on checks':'Hold back between 50% and 75%',
      (ok?'':(h<50?'With only '+h+'% held back, too little rides on the checks to make careful work pay. ':'With '+h+'% held back, the deposit no longer covers materials, so the builder may turn it down. '))+
      'A deposit for materials makes the job worth taking; the rest, paid as each checked stage passes, makes care pay. Add a visit or two on unannounced days (lesson 6), and the builder can’t predict when Tali looks.');L.done();};}},

{part:3,src:'Chapter 13 · How to Reward Work Effort · Multiple Owners · Motivated Workers',
 solve:async L=>{for(const b of L.$$('#lmc .chip')){b.click();await L.sleep(5);}},
 run(L){
  const seen=new Set();let fin=false;
  L.h(L.kick('ex','Edge cases and limits')+'<h1 class="q">Where does “Design incentives” stop working? Try each case.</h1><div class="iv-ctl" id="lmc"></div><div id="lmv"></div><div id="lmf"></div>');
  const host=()=>L.$('#lmv'),svg=(h,a,b)=>'<svg class="iv-svg" viewBox="0 0 320 '+h+'" role="img" aria-label="'+a+'">'+b+'</svg>';
  const pay=o=>{ivPay(L,host(),o);};
  const PR=[
   ['Flat fee',()=>pay({F:70000,S:70000}),'No gap, no reason to try: a flat $70k buys routine effort and leaves you $50k. Paying more doesn’t buy effort you can’t see.'],
   ['All on results',()=>pay({F:0,S:100000,risk:true,tag:'Illustrative: a risk-shy worker knocks 20¢ off per $1 of spread'}),'Strong pay for results loads the risk on the worker. A risk-shy worker values a $100k gamble at less than its average, so she turns this down unless you pay more. The book: often the best answer is a compromise, with weaker incentives and less risk.'],
   ['No fines allowed',()=>pay({F:0,S:100000,noFines:true}),'If fines are illegal, or the worker has no money to put in, the base can’t go below zero. Her average rises to $80k and your profit falls by $10k: hidden effort now costs you.'],
   ['Luck swamps effort',()=>pay({F:0,S:160000,pC:62,tag:'Illustrative: care lifts success only from 60% to 62%'}),'If care barely changes the result, results barely reveal care. The bonus needed would be $1 million. When chance dominates, don’t lean on pay for results.'],
   ['All-or-nothing quota',()=>{host().innerHTML=svg(200,'Sales so far this year against a quota, with effort stopping after a lucky first half',ivQArt('quota','lucky'));},'A quota met early, or out of reach, stops effort for the rest of the year, and invites games like shifting orders. Pay that rises with every result is sturdier.'],
   ['Only one task paid',()=>{host().innerHTML=svg(190,'Tali’s ten hours all going to billable work, with no mentoring',ivHoursArt(40,0));},'Pay only for what’s easy to measure and everything else empties. Mentoring drops to zero.'],
   ['Two bosses',()=>{host().innerHTML=svg(176,'Greer and a client pulling Tali in opposite directions; the net pull is weak',ivBossArt());},'Greer rewards new pitches; a demanding client rewards hours on their account. Each hour for one costs a chance at the other’s reward, so the pulls offset, like the book’s two parents rewarding grades and sport. The book reports models where incentive strength is inversely proportional to the number of bosses: two bosses, half the pull.'],
   ['A small payment',()=>{host().innerHTML=svg(206,'The four bars of the IQ-test study with the 3 cent bar outlined',ivDipArt([1,1,1,1],1));},'Where people already care, a token payment can do worse than none. Offer the neighbour’s teenager a proper wage for clearing the bike store, or simply ask a favour: not £2.']];
  PR.forEach((p,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=p[0];
    b.onclick=()=>{[...L.$('#lmc').children].forEach((x,q)=>x.classList.toggle('sel',q===j));host().innerHTML='';p[1]();L.$('#lmf').innerHTML='';L.fb(L.$('#lmf'),p[2],'info');seen.add(j);
      if(seen.size===PR.length&&!fin){fin=true;L.sheet('info','Know where the tool stops','Pay for results needs results that track effort, a worker who can bear some risk, one clear boss, every task in view, and a task people don’t already do for its own sake. Where those fail, soften the incentive, split the work, or don’t use money at all.');L.done();}};
    L.$('#lmc').appendChild(b);});}},

{part:3,src:'Chapter 13 · Efficiency Wages · Career Concerns',
 solve:async L=>{for(const b of L.$$('#mcc .chip')){b.click();await L.sleep(5);}},
 run(L){
  const seen=new Set();let fin=false;
  L.h(L.kick('learn','Where cooperation wins')+'<h1 class="q">Hedda’s car needs work. A one-off garage, or the regular mechanic? Compare, then see the same long game in a career.</h1>'+
   '<div class="iv-ctl" id="mcc"></div>'+
   '<svg class="iv-svg" id="mcv" viewBox="0 0 320 176" role="img" aria-label="A timeline of five years of visits to a garage: one uncertain visit with no future, or five honest visits, each with a fair margin. A third view shows a student’s career: careful proofreading now, then closer help with research, letters of recommendation and the job they want."></svg>'+
   '<p class="iv-cap" id="mct">The book’s advice for your regular car mechanic: pay a little more than the lowest rate.</p>');
  const draw=k=>{L.$('#mcv').innerHTML=k===2?ivCareerArt():ivMechArt(k);};draw(0);
  ivChips(L.$('#mcc'),['A one-off garage','The regular mechanic','A student’s career'],j=>{draw(j);seen.add(j);
    L.$('#mct').innerHTML=j===2?'The book calls it career concerns: the student reads carefully for closer help with research and better letters of recommendation later. It pulls hardest on people with a long future in the same place.':j?'A fair margin every year, for years. The book’s footnote: if your business brings them over $400 profit a year, a $1,000 invented fault, caught one time in four, isn’t worth losing you.':'No next visit to lose, so an invented fault is pure gain. The cheapest quote can turn out dearest.';
    if(seen.size===3&&!fin){fin=true;
      L.sheet('info','A fair premium and a long game','The premium buys honesty, not just effort, and both sides win: steady work for the mechanic, honest repairs for Hedda. Careers run on the same long game: future letters and promotions pull good work now. Treat people as partners in a larger game, and good work becomes their best move too.');L.done();}});
  L.$('#mcc').children[0].classList.add('sel');}},

{part:3,src:'Course application · built on Chapter 13',pts:6,run(L){
  L.h(L.kick('pr','Practice · how this course applies the book')+'<h1 class="q">Tali’s week of work you can’t watch. What’s the fix?</h1><div class="iv-bk" id="bkw"></div>');
  const sc=(k,t)=>'<span class="iv-bi"><svg viewBox="0 0 38 38" aria-hidden="true"><rect width="38" height="38" rx="10" fill="var(--soft)"/>'+[
    '<path d="M6 18L19 8L32 18" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linejoin="round"/><rect x="9" y="18" width="20" height="12" rx="2" fill="var(--card)" stroke="var(--ink)" stroke-width="2"/><rect x="12" y="21" width="9" height="6" rx="1" fill="var(--soft2)" stroke="var(--line2)"/><text x="25.5" y="28" text-anchor="middle" font-size="9" font-weight="700" fill="var(--h2)">£</text>',

    '<path d="M26 6L16 24" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="round"/><path d="M11 23L21 26L18 32L7 30Z" fill="var(--h4)" stroke="var(--ink)" stroke-width="1.6" stroke-linejoin="round"/><path d="M10 26L9 31M14 27L13 32" stroke="var(--ink)" stroke-width="1.2"/>',
    '<circle cx="11" cy="25" r="6" fill="none" stroke="var(--ink)" stroke-width="2"/><circle cx="27" cy="25" r="6" fill="none" stroke="var(--ink)" stroke-width="2"/><path d="M11 25L16 15H24L27 25M16 15L19 25H11M14 12H18M23 11L24 15" fill="none" stroke="var(--h2)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>',
    '<rect x="7" y="8" width="24" height="16" rx="2" fill="var(--card)" stroke="var(--ink)" stroke-width="2"/><path d="M4 28H34" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="round"/><path d="M14 16l3 3l6-6" fill="none" stroke="var(--ok-strong)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>',
    '<rect x="6" y="12" width="26" height="18" rx="3" fill="var(--card)" stroke="var(--ink)" stroke-width="2"/><path d="M13 12L15 8H23L25 12" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/><circle cx="19" cy="21" r="5" fill="var(--h3-bg)" stroke="var(--h3)" stroke-width="2"/>'
   ][k]+'</svg><span>'+t+'</span></span>';
  const FX=['<path d="M2 15H16" stroke-width="1.6"/><path d="M3 11L15 3" stroke-width="2.2"/><circle cx="3" cy="11" r="2" fill="currentColor"/>',
    '<rect x="1.5" y="5" width="6" height="6" rx="1.5"/><rect x="10.5" y="5" width="6" height="6" rx="1.5"/><path d="M3 8l1.5 1.5L6.5 6.5M12 8l1.5 1.5l2-3"/>',
    '<path d="M1 11H17" stroke-dasharray="2.5 2"/><rect x="5" y="3" width="8" height="13" rx="1.5" fill="currentColor" stroke="none" opacity=".35"/><path d="M9 7V3M7 5L9 3L11 5"/>',
    '<path d="M9 15C3 11 1.5 8.5 1.5 6.3A3.6 3.6 0 0 1 9 4.6A3.6 3.6 0 0 1 16.5 6.3C16.5 8.5 15 11 9 15Z"/>'];
  L.buckets(L.$('#bkw'),['Base plus pay on results','Reward every task','Pay a bit above the going rate','Pay properly, or not at all'],[
   [sc(0,'Hedda’s builder wants the whole bathroom fee before starting.'),0,'Hidden effort: a deposit for materials, the rest released as checked stages pass.'],
   [sc(1,'Greer’s bonus counts only billable hours, and nobody mentors the juniors now.'),1,'Pay for only the measurable task and the other empties. Reward both, more gently.'],
   [sc(2,'Hedda’s weekly cleaner could skip the rooms Hedda never checks.'),2,'Ongoing work: a little above the going rate makes keeping the job worth more than cutting corners.'],
   [sc(3,'Tali thinks of offering the neighbour’s teenager £2 to help clear the bike store.'),3,'A token sum can crowd out the willingness to help. Pay a proper wage, or ask as a favour.'],
   [sc(4,'Plover hires a freelance developer for one website, results visible at launch.'),0,'A one-off job: a fixed part to make it worth taking, plus a payment when the site passes its launch tests.'],
   [sc(5,'Juno’s photo assistant keeps the studio clean and also edits photos, but only edits are counted.'),1,'Two tasks, one counted: the cleaning will slide. Count both, or give one task to someone else.']],
   'One question sorts them: what can you see, and does the reward follow it? Base plus results for one-off jobs, every task counted, a premium for ongoing work, and no small money where people already care.');
  L.$$('#bkw .row').forEach(row=>row.querySelectorAll('.chip').forEach((c,j)=>c.insertAdjacentHTML('afterbegin','<svg viewBox="0 0 18 18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+FX[j]+'</svg>')));}},

{part:3,src:'Course application · built on Chapter 13',
 solve:async L=>{ivSet(L.$('#yu1'),'The cleaner at my parents’ flat');ivSet(L.$('#yu2'),'Whether the rooms are done');L.$('#yud').children[2].click();L.$('#yub').click();},
 run(L){
  L.h(L.kick('pr','Your turn · ungraded')+'<h1 class="q">One person whose work you depend on but can’t watch. Write their incentive card.</h1>'+
   L.note('How this course applies the book: the one-minute move on your own situation.','compass')+
   '<label class="iv-fl" for="yu1">WHO, AND WHAT JOB?</label><input class="iv-in" id="yu1" maxlength="60" placeholder="e.g. a builder, a babysitter, a teammate, a child’s chores">'+
   '<label class="iv-fl" for="yu2">1 · WHAT CAN YOU ACTUALLY SEE?</label><input class="iv-in" id="yu2" maxlength="70" placeholder="a result you can check, not the effort">'+
   '<span class="iv-fl">2 · WHICH SHAPE OF DEAL?</span><div class="iv-chips" id="yud"></div>'+
   '<div class="iv-ctl"><button class="btn pri" id="yub" disabled>'+L.ic('pencil')+'Write my card</button></div><div id="yuo"></div>');
  let d=null;
  const DS=['Base plus a reward tied to that result','Pay in stages, each after a check','A bit above the going rate, for the long run','No money: thanks and trust, they already care'];
  const NX=['Check the base makes the job worth taking, and the reward is big enough to matter.','Make each stage something you can actually check, and visit on days they can’t predict.','Say it plainly: good, steady work keeps a good deal going.','A small payment could make them care less. Thank them properly instead.'];
  ivChips(L.$('#yud'),DS,j=>{d=j;chk();});
  const v=s=>L.$(s).value.trim();
  function chk(){L.$('#yub').disabled=!(d!==null&&v('#yu1').length>1&&v('#yu2').length>1);}
  ['#yu1','#yu2'].forEach(s=>L.$(s).addEventListener('input',chk));
  L.$('#yub').onclick=()=>{
    L.$('#yuo').innerHTML='<div class="iv-card"><div class="k">MY INCENTIVE CARD</div><div class="i">'+L.esc(v('#yu1'))+'</div>'+
      '<div class="r"><b>I can see:</b> '+L.esc(v('#yu2'))+'<br><b>The deal:</b> '+DS[d]+'<br><b>Check:</b> '+NX[d]+'<br><b>Watch for:</b> only one task counted, an all-or-nothing target, or two bosses pulling apart.</div></div>';
    L.sheet('info','Your card is written','Next time you set up the deal, start from what you can see, not from what you hope they’ll do. And remember the larger game: a fair deal with someone you’ll work with again makes good work their best move as well as yours.');L.done();};}},

{part:3,src:'Course application · built on Chapter 13',run(L){

});
