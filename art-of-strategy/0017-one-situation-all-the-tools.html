const ktCl=(v,a,b)=>Math.max(a,Math.min(b,v));

 KT_KEYS.forEach(k=>{if(typeof fx[k]==='number')n.stack[k]=ktCl(n.stack[k]+fx[k],0,8);});

 n.warn=Object.assign({},fx.warn||{});
 if(obj&&!n.obj.includes(obj))n.obj.push(obj);
 return n;}

   '<b>Order matters:</b> finish the work before you sell, know which offer is real before you bargain, check the larger game last.',
   '<b>When you’re stuck,</b> name the kind of stuck, look ahead, and change the game: who plays, in what steps, on what terms.',
   '<b>Book traps:</b> don’t start an escalation (the dollar auction); compare all-in prices; look where others will go; count the cost you put on others; don’t turn family help into a contest (King Lear).',
   '<b>There is always a larger game.</b> Choose the plan that is workable and fair in it, not the one that wins each small game. A lucky result doesn’t prove the reasoning.',
   'How this course applies the book: this whole routine is the course’s own; every tool in it is the book’s.'
  ],
  steps:[
/* ================= PART 1: MANY GAMES, ONE TABLE ================= */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Sunday lunch. Hedda says: “I’m selling the flat.” Within a minute Tali is worrying about buyers, the builder, where Hedda goes, Arlo and the move. What helps most first?</h1>');
  L.mc(L.card,['Get the best price first; everything else follows from it','Let the estate agent run it all, so the family stays out of it','List who’s involved and what each wants, then take one question at a time'],2,
   'One tangle becomes a handful of smaller questions, each with its own people and aims. That is this lesson’s whole method.',
   'The price is one question among several, and an agent is one more player with aims of their own. Untangle first: who’s involved, what each wants, then one question at a time.');}},

{part:0,src:'Course application · built on the Introduction and Chapter 1',
 solve:async L=>{for(const k of KT_KEYS){L.$('#wi-'+k).click();await L.sleep(5);}},
 run(L){
  const seen=new Set();let fin=false;
  L.h(L.kick('learn','Who’s in the game?')+'<h1 class="q">Hedda’s kitchen table, from above. Tap each seat: what does that person want?</h1>'+ktApp(L,'row zero of the map comes first')+
   '<div id="wib"></div><div class="kt-say" id="wis"><b class="t">WHAT THEY WANT</b>Tap a seat or a name.</div><div class="kt-ctl" id="wic"></div>');
  const bd=ktBoard(L,L.$('#wib'),{st:Object.assign(ktCopy(KT_START),{title:'Hedda sells the flat'})});
  function pick(k){bd.sel=k;bd.draw();[...L.$('#wic').children].forEach(c=>c.classList.toggle('sel',c.id==='wi-'+k));
    L.$('#wis').innerHTML='<b class="t">'+KT_S[k].n.toUpperCase()+' WANTS</b>'+KT_WANT[k];seen.add(k);
    if(seen.size===KT_KEYS.length&&!fin){fin=true;L.sheet('info','Eight players, and every one reacts','Row zero asks: will they react to what you do? Here every seat will. Some aims are shared (everyone at the table wants Hedda settled), some pull apart (price, time, money). That mix makes it a game, not a lumberjack’s log. The thin green and dashed lines are <b>trust threads</b>: watch them all lesson.');L.done();}}
  bd.onSeat=pick;
  KT_KEYS.forEach(k=>{const b=document.createElement('button');b.className='chip';b.id='wi-'+k;b.textContent=KT_S[k].n;b.onclick=()=>pick(k);L.$('#wic').appendChild(b);});}},

{part:0,src:'Course application · built on every chapter',
 solve:async L=>{for(const g of ['move','offers','help','larger']){L.$('#tg-'+g).click();await L.sleep(5);}},
 run(L){
  const seen=new Set();let fin=false,sel=null;
  L.h(L.kick('learn','One situation, eight games')+'<h1 class="q">The sale isn’t one game. Tap the numbers to see each game, its map row and its tools.</h1>'+ktApp(L,'the strategy map, used on one big situation')+
   '<svg class="kt-svg" id="tgv" viewBox="0 0 320 148" role="img" aria-label="A timeline of the sale in three stretches, before listing, selling and moving, with seven numbered games along it and an eighth, the larger game, running under all of them"></svg>'+
   '<div class="kt-gcard" id="tgc"><span class="k">TAP A NUMBER</span><div class="t">Eight games, one at a time</div>Each has its own players and its own row on the map.</div><div class="kt-ctl" id="tgb"></div>');
  function draw(){L.$('#tgv').innerHTML=ktTimeline(sel,seen);}
  function pick(g){sel=g;seen.add(g);draw();const G=KT_G[g],i=KT_ORDER.indexOf(g);
    [...L.$('#tgb').children].forEach(c=>c.classList.toggle('sel',c.id==='tg-'+g));
    L.$('#tgc').innerHTML='<span class="k">GAME '+(i+1)+' · '+['BEFORE LISTING','SELLING','MOVING','ALL ALONG'][G.ph]+'</span><div class="t">'+G.s+'</div>Map row: <b>'+G.row+'</b>'+
     (G.tl.length?'<div class="kt-tl">'+G.tl.map((t,q)=>(q?'<i>→</i>':'')+'<span'+(q?'':' class="f"')+'>'+KT_TN[t]+'</span>').join('')+'</div>':'<div class="kt-tl"><span class="f">Is every move fair enough that trust won’t backfire?</span></div>');
    if(seen.size>=4&&!fin){fin=true;L.sheet('info','Big and hard to undo: walk each row','The map’s rule of thumb: a small, easy-to-undo game gets its first tool and a minute; a big one gets the whole row, sketched. A family home is big. So each game starts with its first tool (highlighted), and the others are there when the first runs out.');L.done();}}
  L.$('#tgv').addEventListener('click',e=>{const g=e.target.closest('[data-g]');if(g)pick(g.dataset.g);});
  KT_ORDER.forEach((g,i)=>{const b=document.createElement('button');b.className='chip';b.id='tg-'+g;b.textContent=(i+1)+' · '+KT_G[g].s;b.onclick=()=>pick(g);L.$('#tgb').appendChild(b);});
  draw();}},

{part:0,src:'Course application · built on Chapter 12',
 solve:async L=>{for(let k=0;k<4;k++){L.$('#exn').click();await L.sleep(5);}},
 run(L){
  let k=0;
  L.h(L.kick('ex','Run one game')+'<h1 class="q">Game 1: where does Hedda move? Step through one full run of a tool on the table.</h1>'+ktApp(L,'Hedda’s wishes first is the family’s choice; the voting tool is the book’s')+
   '<div id="exb"></div><div class="kt-say" id="exs"></div><div id="exx"></div><div class="kt-ctl"><button class="btn pri" id="exn">'+L.ic('play')+'Step 1: which game?</button></div><div id="exh"></div>');
  const bd=ktBoard(L,L.$('#exb'));
  const S=[
   ['STEP 1 · WHICH GAME?','Three people choose one of three flats together, so the map row is <b>a group decides together</b>. Its first tool: <b>Vote and set the agenda</b>.',()=>{const s=ktCopy(bd.st);s.title='1 · Where Hedda moves';bd.set(s,true);}],
   ['STEP 2 · RUN THE TOOL','Everyone ranks the flats. Then compare head to head: Elm Court beats Riverside 2–1 and beats Hillcrest 2–1. It beats every other option, the book’s '+L.g('condorcet','Condorcet')+' test, and it’s Hedda’s first choice.',()=>{
     L.$('#exx').innerHTML='<div class="kt-ballot"><div><b>HEDDA</b><span class="e">1 Elm Court</span><br>2 Riverside<br>3 Hillcrest</div><div><b>TALI</b>1 Riverside<br><span class="e">2 Elm Court</span><br>3 Hillcrest</div><div><b>ARLO</b>1 Hillcrest<br><span class="e">2 Elm Court</span><br>3 Riverside</div></div>';
     bd.apply(KT_G.move.v[0].fx,'ballot','1 · Where Hedda moves');}],
   ['STEP 3 · WRITE THE LINE','One numbered line per game, like a chess scoresheet. “!” marks a sound move; “?!” will mark one that wins now and risks later.',()=>{L.$('#exh').innerHTML=ktSheet([{g:'move',t:KT_G.move.v[0].line,ok:true}],3,0);}],
   ['STEP 4 · CHECK THE LARGER GAME','No thread frayed, and the person whose home it is got the first word. On to game 2.',()=>{}]];
  function show(){const s=S[k];L.$('#exs').innerHTML='<b class="t">'+s[0]+'</b>'+s[1];s[2]();k++;
    L.$('#exn').innerHTML=k<4?L.ic('play')+'Step '+(k+1)+': '+['which game?','run the tool','write the line','check the larger game'][k]:L.ic('check')+'Done';
    if(k===4){L.$('#exn').disabled=true;L.sheet('info','That’s one game, run','Row, tool, line, larger game. The whole lesson repeats this rhythm for each game at the table. Ranking also avoids a trap from the voting chapter: with three options, a show of hands can go round in circles, and whoever sets the order of votes can set the result.');L.done();}}
  L.$('#exs').innerHTML='<b class="t">THE TABLE, BEFORE ANY TOOL</b>Three flats are on offer: Elm Court near Hedda’s friends, Riverside near Tali, Hillcrest near Arlo.';
  L.$('#exn').onclick=()=>{if(k<4)show();};}},

{part:0,src:'Course application · built on Chapters 7 and 13',pts:1,
 solve:async L=>{L.$('#trk [data-ok="1"]').click();},
 run(L){

   '<div id="trb"></div><div class="kt-tok" id="trk"></div>');

    bd.apply(KT_G.builder.v[0].fx,'stages','2 · The bathroom');

{part:1,src:'Course application · built on every chapter',
 solve:async L=>{await ktSolveTable(L,L.$('#exp'),['move','builder','help']);},
 run(L){
  let fin=false;
  L.h(L.kick('learn','Explore · the kitchen table')+'<h1 class="q">Your turn at the table. Pick any game, then a move. Try a quick win too, and watch the threads.</h1>'+ktApp(L,'play the games in any order')+'<div id="exp"></div>');

    L.sheet('info','Three things to notice','A sound move (!) puts its tool on the table and adds coins without cutting a thread. A quick win (?!) wins something today and wears or cuts a thread, often one you didn’t touch. A wrong tool just bounces. Keep playing, or continue.');L.done();}}});}},

{part:1,src:'Course application · built on Chapters 8 and 10',pts:1,
 solve:async L=>{L.$$('#ofo .opt')[1].click();},
 run(L){
  let a=false;
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">Two offers arrive by Friday. Which one survives three checks: read the signals, look ahead, and ask what happens if they win?</h1>'+ktApp(L,'the book’s bidder advice, read from the seller’s side')+
   '<svg class="kt-svg" id="ofv" viewBox="0 0 320 236" role="img" aria-label="Two offer cards. Buyer A: £262,000, a chain of three sales, no proof of funds, wants to move in six weeks. Buyer B: £255,000, no chain, mortgage agreed, can wait twelve weeks. Three checks appear under each."></svg><p class="kt-ill">Illustrative numbers</p><div class="opts" id="ofo"></div>');
  const A={x:4,n:'BUYER A',p:'£262,000',f:['chain of 3 sales','no proof of funds','move in 6 weeks'],r:[['READ THE SIGNALS','✗ only words so far'],['LOOK AHEAD','✗ 3 sales must hold'],['IF THEY WIN…','✗ may haggle later']]};
  const B={x:164,n:'BUYER B',p:'£255,000',f:['no chain','mortgage agreed','can wait 12 weeks'],r:[['READ THE SIGNALS','✓ costly to fake'],['LOOK AHEAD','✓ nothing to break'],['IF THEY WIN…','✓ no surprises']]};
  function card(c,k,end){const win=c===B;let s='<rect x="'+c.x+'" y="4" width="152" height="228" rx="14" fill="var(--card)" stroke="'+(end?(win?'var(--ok)':'var(--no)'):'var(--line2)')+'" stroke-width="'+(end?3:1.5)+'"'+(end&&!win?' stroke-dasharray="6 4"':'')+'/>';
   s+='<text x="'+(c.x+12)+'" y="24" font-size="11.5" font-weight="700" fill="var(--muted)">'+c.n+'</text>';
   if(end)s+='<text x="'+(c.x+140)+'" y="24" text-anchor="end" font-size="11.5" font-weight="800" fill="'+(win?'var(--ok)':'var(--no)')+'">'+(win?'SURVIVES':'SHAKY')+'</text>';
   s+='<text x="'+(c.x+12)+'" y="50" font-size="22" font-weight="700" fill="var(--ink)">'+c.p+'</text>';
   if(end&&!win)s+='<path d="M'+(c.x+10)+' 43H'+(c.x+118)+'" stroke="var(--no)" stroke-width="2.5"/>';
   c.f.forEach((t,i)=>s+='<text x="'+(c.x+12)+'" y="'+(72+i*17)+'" font-size="12" fill="var(--ink)">• '+t+'</text>');
   s+='<path d="M'+(c.x+10)+' 118H'+(c.x+142)+'" stroke="var(--line)" stroke-width="1.5"/>';
   c.r.forEach((r,i)=>{const y=136+i*32,on=i<k;s+='<text x="'+(c.x+12)+'" y="'+y+'" font-size="11" font-weight="700" fill="var(--muted)" opacity="'+(on?1:.45)+'">'+r[0]+'</text>';
     s+='<text x="'+(c.x+12)+'" y="'+(y+16)+'" font-size="12" font-weight="700" fill="'+(on?(r[1][0]==='✓'?'var(--ok)':'var(--no)'):'var(--faint)')+'">'+(on?r[1]:'…')+'</text>';});
   return s;}
  function draw(k,end){L.$('#ofv').innerHTML=card(A,k,end)+card(B,k,end);}
  draw(0,false);
  ['Buyer A: £7,000 more is £7,000 more','Buyer B: a bit lower, but it will really happen','Neither: wait for a better buyer'].forEach((t,j)=>{const b=document.createElement('button');b.className='opt';b.innerHTML='<span class="key">'+(j+1)+'</span><span>'+t+'</span>';
   b.onclick=()=>{if(a)return;a=true;const ok=j===1;L.award(ok);b.classList.add(ok?'ok':'no');if(!ok)L.$$('#ofo .opt')[1].classList.add('ok');
    let k=0;const tick=()=>{if(!L.$('#ofv')||!L.$('#ofv').isConnected)return;k++;draw(k,k>3);
      if(k<4)setTimeout(tick,560);
      else{L.sheet(ok?'ok':'no',ok?'Buyer B survives':'Buyer B survives the checks',
       '<b>Signals:</b> a mortgage agreed costs something to fake; “we’re good for it” costs nothing. <b>Look ahead:</b> Buyer A’s three-sale chain must hold at every link. <b>If they win (the course’s seller-side reading of “bid as if you’ve won”):</b> a buyer who bid high in a hurry may later feel they overpaid and haggle late, when Hedda, packed and booked, loses more from waiting. The higher number is worth less than it looks.');L.done();}};
    setTimeout(tick,250);};L.$('#ofo').appendChild(b);});}},

{part:1,src:'Course application · built on Chapter 11',
 solve:async L=>{ktSet(L.$('#bns'),244);await L.sleep(5);L.$('#bnc').click();await L.sleep(5);},
 run(L){
  let card=false,fin=false;const seen=new Set();
  const base=Object.assign(ktAfter(['move','builder','offers','signals']),{title:'5 · The price'});
  L.h(L.kick('learn','The other offer is the floor')+'<h1 class="q">After the survey, Buyer B asks to pay less. Slide Buyer B’s new offer, with and without the BATNA card on the table.</h1>'+ktApp(L)+
   '<div id="bnb"></div><div class="kt-ctl"><button class="chip" id="bnc">'+L.ic('scale')+'Put the BATNA card on the table</button></div>'+
   '<label class="kt-sl"><span class="h"><span>Buyer B’s new offer</span><b id="bnn"></b></span><input type="range" id="bns" min="240" max="258" step="1" value="252"></label>'+
   '<div class="kt-say" id="bny"></div>');
  const bd=ktBoard(L,L.$('#bnb'),{st:base});
  function upd(){const p=+L.$('#bns').value,st=ktCopy(base);let say,key;
    if(card)st.obj.push('batna');
    if(!card){if(p<250){st.stack.H-=1;st.warn={H:1};say='“Fine, anything to get it over with.” Hedda accepts £'+p+'k: £'+(250-p)+'k below what the other offer was worth.';key='offLow';}
      else{st.stack.H+=1;st.stack.BB+=1;say='Hedda accepts £'+p+'k. Lucky: with no floor in mind, any number would have done.';key='offHigh';}}
    else{st.stack.H+=1;st.stack.BB+=1;
      if(p<250){say='“We have another offer.” Buyer B wants the flat and can wait for Hedda’s date, so comes back at £250k.';key='onLow';}
      else{say='Above the floor: Hedda accepts £'+p+'k and agrees Buyer B’s survey date.';key='onHigh';}}
    bd.set(st,true);L.$('#bnn').textContent='£'+p+'k';
    L.$('#bny').innerHTML='<b class="t">'+(card?'WITH THE BATNA CARD · FLOOR £250K':'NO BATNA CARD · NO FLOOR')+'</b>'+say;seen.add(key);
    if(seen.has('offLow')&&seen.has('onLow')&&!fin){fin=true;
      L.sheet('info','Know your floor before you haggle','Hedda’s '+L.g('batna','BATNA')+' (best alternative to a negotiated agreement) is Buyer A’s offer: £262k on paper, about £250k once you count the chance it falls through (illustrative). Without it, any number feels fine. With it, Hedda knows when to say no, and can trade what each side values differently: Buyer B can wait for Hedda’s date, which Hedda values more than a few thousand pounds.');L.done();}}
  L.$('#bnc').onclick=()=>{card=!card;L.$('#bnc').classList.toggle('sel',card);L.$('#bnc').innerHTML=L.ic('scale')+(card?'Take the BATNA card away':'Put the BATNA card on the table');upd();};
  L.$('#bns').addEventListener('input',upd);upd();}},

{part:1,src:'Chapter 14 · The King Lear Problem',
 solve:async L=>{for(let i=0;i<3;i++){L.$('#klN').click();await L.sleep(5);}},
 run(L){
  let k=0;
  const B=[['THE WORRY','Children don’t always keep their promises. Can a will get them to visit?',[1,0,2],['?','?','?'],'promises, not visits','var(--muted)'],
   ['THE RULE','Visit once and phone twice a week, or be cut out; the rest share equally.',[3,3,3],['1/3','1/3','1/3'],'below the quota: cut out','var(--h3)'],
   ['THE WORKAROUND','The parents won’t cut out all three, so the children agree to visit less.',[0,0,0],['1/3','1/3','1/3'],'the children’s pact: all visit less','var(--h3)'],
   ['THE BOOK’S FIX','If all fall short, the most visits takes everything. One extra call wins it all, so the pact breaks.',[3,3,3],['1/3','1/3','1/3'],'pact broken: most visits takes all','var(--no)']];
  function art(){const b=B[k];let s='<rect width="320" height="140" rx="14" fill="var(--soft)"/>';
   s+='<circle cx="34" cy="44" r="15" fill="var(--h2-bg)" stroke="var(--h2)" stroke-width="2"/><text x="34" y="49" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--h2)">P</text><text x="34" y="78" text-anchor="middle" font-size="11" fill="var(--muted)">parents</text>';
   s+='<rect x="60" y="20" width="40" height="50" rx="6" fill="var(--card)" stroke="var(--h3)" stroke-width="2"/><path d="M67 33h26M67 43h26M67 53h18" stroke="var(--h3)" stroke-width="2" stroke-linecap="round"/><text x="80" y="86" text-anchor="middle" font-size="11" font-weight="700" fill="var(--h3)">the will</text>';
   if(k>0)s+='<path d="M106 44H132" stroke="'+b[5]+'" stroke-width="2.5"/><path d="M127 38l7 6-7 6" fill="none" stroke="'+b[5]+'" stroke-width="2.5"/>';
   if(k===2)s+='<ellipse cx="222" cy="58" rx="76" ry="50" fill="none" stroke="var(--h3)" stroke-width="2.5"/>';
   if(k===3)s+='<ellipse cx="222" cy="58" rx="76" ry="50" fill="none" stroke="var(--no)" stroke-width="2" stroke-dasharray="6 6"/><path d="M290 14l10 10M300 14l-10 10" stroke="var(--no)" stroke-width="2.5" stroke-linecap="round"/>';
   [0,1,2].forEach(i=>{const x=170+i*52,v=b[2][i];
    s+='<circle cx="'+x+'" cy="38" r="14" fill="var(--card)" stroke="var(--line2)" stroke-width="2"/><text x="'+x+'" y="43" text-anchor="middle" font-size="12" font-weight="700" fill="var(--muted)">'+(i+1)+'</text>';
    for(let q=0;q<3;q++){const px=x-6+q*6;
     s+=q<v?'<path d="M'+px+' 60v12" stroke="'+(v>=3?'var(--ok)':'var(--ink)')+'" stroke-width="2.5" stroke-linecap="round"/>':'<path d="M'+px+' 60v12" stroke="var(--line2)" stroke-width="1.5" stroke-dasharray="2 2"/>';}
    s+='<text x="'+x+'" y="92" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">'+b[3][i]+'</text>';});
   s+='<text x="146" y="70" text-anchor="end" font-size="11" fill="var(--muted)">visits</text><text x="146" y="92" text-anchor="end" font-size="11" fill="var(--muted)">share</text>';
   s+='<text x="160" y="129" text-anchor="middle" font-size="12" font-weight="700" fill="'+b[5]+'">'+b[4]+'</text>';
   L.$('#klv').innerHTML=s;
   L.$('#klq').innerHTML=B.map((x,i)=>'<span class="'+(i===k?'on':'')+'">'+['Worry','Rule','Pact','Fix'][i]+'</span>').join('');
   L.$('#kly').innerHTML='<b class="t">'+b[0]+'</b>'+b[1];
   L.$('#klr').textContent='Visits (quota 3): '+b[2].join(', ')+'. Shares: '+b[3].join(', ')+'.';}
  L.h(L.kick('ex','The book’s case: King Lear')+'<h1 class="q">Can a will make grown children visit? Step through the book’s case.</h1>'+
   '<div class="kt-qs" id="klq"></div><svg class="kt-svg" id="klv" viewBox="0 0 320 140" role="img" aria-label="Parents and their will on the left; three children on the right, each with a tally of weekly visits and calls against a quota of three, and their share of the estate below"></svg><p class="kt-ro" id="klr" aria-live="polite"></p>'+
   '<div class="kt-say" id="kly"></div><div class="kt-ctl"><button class="btn pri" id="klN">'+L.ic('play')+'Next beat</button></div>');
  art();
  L.$('#klN').onclick=()=>{if(k>=3)return;k++;art();
   if(k===3){L.$('#klN').disabled=true;L.sheet('info','A warning, not a plan','The fix turns the pact into a many-person dilemma, so it works on paper (not with an only child). It works by setting the siblings against each other. This course uses it as a <b>warning</b> for Hedda’s family: the help they want is help given freely.');L.done();}};}},

{part:1,src:'Course application · built on Chapters 3 and 4',
 solve:async L=>{L.$('#rlL').click();await L.sleep(5);L.$('#rlR').click();},
 run(L){
  const seen=new Set();let fin=false;
  const base=Object.assign(ktAfter(['move','builder','offers','signals','price']),{title:'6 · Help with the move'});
  L.h(L.kick('learn','Rota or King Lear rule?')+'<h1 class="q">Packing and moving Hedda will take six Saturdays. Try each rule for sharing the help, and watch the thread between Tali and Arlo.</h1>'+ktApp(L)+

{part:2,src:'Chapter 1 · #10 Game Theory Can Be Dangerous to Your Health',
 solve:async L=>{L.$('#lgw').click();await L.sleep(5);L.$('#lgf').click();},
 run(L){
  const seen=new Set();let view='sale',plan='small',fin=false;
  const ST={small:{stack:{H:3,T:2,A:4,J:3,BA:2,BB:0,AG:2,BU:4},th:{HT:1,HA:1,TA:0,TJ:2},ring:false,money:'£262k',title:'Win every small game'},
            fair:{stack:{H:6,T:4,A:4,J:4,BA:1,BB:3,AG:2,BU:4},th:{HT:2,HA:2,TA:2,TJ:2},ring:true,money:'£255k',title:'Fair and workable'}};
  L.h(L.kick('learn','There is always a larger game')+'<h1 class="q">Two plans for the whole sale. Count only the sale, then count the family too.</h1>'+
   '<div class="kt-ctl"><button class="chip" id="lgs">'+L.ic('trend')+'Win every small game</button><button class="chip" id="lgf">'+L.ic('people')+'Fair and workable</button></div>'+
   '<div class="kt-ctl"><button class="chip" id="lgo">Count only the sale</button><button class="chip" id="lgw">Count the family too</button></div><div id="lgb"></div>'+
   L.quote('There is always a larger game.','Dixit and Nalebuff, The Art of Strategy, chapter 1')+
   '<p class="kt-cap">The book’s taxi story: two economists offered a Jerusalem taxi driver 2,200 shekels instead of 2,500, a matter of cents, and he drove them straight back to where they started. Pride and fairness are part of the game.</p>');
  const bd=ktBoard(L,L.$('#lgb'));
  function upd(){const s=Object.assign(ktCopy(KT_START),ktCopy(ST[plan]));s.obj=plan==='fair'?['ballot','stages','env','proof','batna','rota','iou']:['env'];
    if(view==='sale'){s.view='sale';s.stack.H=plan==='small'?7:6;}
    bd.set(s,true);L.$('#lgs').classList.toggle('sel',plan==='small');L.$('#lgf').classList.toggle('sel',plan==='fair');L.$('#lgo').classList.toggle('sel',view==='sale');L.$('#lgw').classList.toggle('sel',view==='fam');
    seen.add(plan+view);
    if(seen.has('smallsale')&&seen.has('smallfam')&&seen.has('fairfam')&&!fin){fin=true;L.sheet('info','The small game and the larger one','Counting only the sale, “win every small game” looks £7,000 better. Count the family and it has worn two threads and cut one: the relationship it sits inside is the '+L.g('larger-game','larger game')+', and it lasts for years. A fair, workable move is often the strategic one.');L.done();}}
  L.$('#lgs').onclick=()=>{plan='small';upd();};L.$('#lgf').onclick=()=>{plan='fair';upd();};
  L.$('#lgo').onclick=()=>{view='sale';upd();};L.$('#lgw').onclick=()=>{view='fam';upd();};upd();}},

 solve:async L=>{const h=L.$('#chT');await ktSolveTable(L,h,KT_ORDER);L.$('#chk').click();},
 run(L){
  let a=false;
  const C=[['Every game has a line',T=>T.lines.length===8],
   ['Every line is a sound move (!)',T=>T.lines.length>0&&T.lines.every(l=>l.ok)],
   ['No trust thread cut',T=>Object.values(T.bd.st.th).every(x=>x>0)],
   ['Hedda’s wishes first: line 1 is where Hedda moves',T=>!!T.lines[0]&&T.lines[0].g==='move'],
   ['The bathroom done before the offers',T=>{const i=g=>T.lines.findIndex(l=>l.g===g);return i('builder')>=0&&i('offers')>=0&&i('builder')<i('offers');}],
   ['Know which offer is real before bargaining',T=>{const i=g=>T.lines.findIndex(l=>l.g===g);return i('signals')>=0&&i('price')>=0&&i('signals')<i('price');}],
   ['The larger game checked last',T=>T.lines.length===8&&T.lines[7].g==='larger']];
  L.h(L.kick('pr','Challenge · the whole sale')+'<h1 class="q">Run all eight games in an order that works. The plan passes when every box below is ticked.</h1>'+ktApp(L)+

  function list(T){L.$('#chl').innerHTML=C.map(c=>{const on=c[1](T);return '<li class="'+(on?'on':'')+'"><span class="b">'+(on?'✓':'')+'</span>'+c[0]+'</li>';}).join('');L.$('#chk').disabled=a||T.lines.length<8;}
  const T=ktTable(L,L.$('#chT'),{undo:true,chips:['offers','larger','loan','move','price','help','signals','builder'],onRun:T=>list(T)});list(T);
  L.$('#chk').onclick=()=>{if(a)return;a=true;L.$('#chk').disabled=true;const miss=C.filter(c=>!c[1](T));const ok=!miss.length;L.award(ok,2);
    L.sheet(ok?'ok':'no',ok?'A plan that works, and keeps the family':'Not every box is ticked',
     ok?'Eight games, eight sound lines, every thread whole. Hedda chose first; the work was done before the sale; the real offer was known before the haggling; and the larger game had the last word.':'Still open: <b>'+miss.map(c=>c[0]).join('; ')+'</b>. Use “Undo last line” to replay a game. The order follows look ahead and reason back: some games only make sense once others are settled.');L.done();};}},

  MP_SHORT.forEach((t,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=t;b.onclick=()=>{row=j;[...L.$('#yur').children].forEach((x,q)=>x.classList.toggle('sel',q===j));chk();};L.$('#yur').appendChild(b);});

  L.$('#yub').onclick=()=>{const tl=MP_ROWS[row][1];
    L.$('#yuo').innerHTML='<div class="kt-sheet"><div class="hd"><span>SCORESHEET · '+L.esc(v('#yu1')).toUpperCase()+'</span><span>line 1</span></div><ol>'+
     '<li class="ok"><span class="n">0.</span><span><b>Who’s in:</b> '+L.esc(v('#yu2'))+'</span><span class="m"></span></li>'+
     '<li class="ok new"><span class="n">1.</span><span><b>'+KT_TN[tl[0]]+':</b> '+L.esc(v('#yu3'))+(tl[1]?' · then, if it runs out: '+KT_TN[tl[1]]:'')+'</span><span class="m">!</span></li>'+
     '<li class="empty"><span class="n">2.</span><span>the next game…</span><span></span></li><li class="empty"><span class="n">∞</span><span>last: check the larger game: keep trust with '+L.esc(v('#yu4'))+'</span><span></span></li></ol></div>';
    L.sheet('info','Line 1 is written','Run '+KT_TN[tl[0]]+' on that one game this week, in about a minute. If it stalls, name the kind of stuck, look ahead, and change who plays, the steps or the terms. Then take the next game the same way, and before the last line ask: would '+L.esc(v('#yu4'))+' still trust you? Next week, run the routine again on whatever is tangled then.');L.done();};}},

{part:3,src:'Introduction; Chapter 14 · The Three-Way Duel',run(L){
  L.h(L.kick('learn','The art grows with practice')+'<h1 class="q">Hedda’s sale touched seven rows of the map</h1>'+ktApp(L,'the strategy map, now walked end to end')+
   '<div id="mp"></div><p class="kt-cap">The book’s Introduction calls strategy an art as much as a science: rules can be learned, but skill comes from examples, cases and practice. Its last chapter is a set of cases for that reason. This course ends the same way: the next case is yours.</p>'+
   '<p class="kt-fl">ONE MORE CASE · THE THREE-WAY DUEL</p>'+
   '<svg class="kt-svg" viewBox="0 0 320 118" role="img" aria-label="The book’s three-way duel: Larry hits 30% of the time and survives 41.2%; Moe hits 80% and survives 56%; Curly never misses and survives 14%">'+
   '<rect x="236" y="2" width="9" height="9" rx="2" fill="var(--line2)"/><text x="249" y="10.5" font-size="11" fill="var(--muted)">aim</text><rect x="274" y="2" width="9" height="9" rx="2" fill="var(--pri)"/><text x="287" y="10.5" font-size="11" fill="var(--muted)">lives</text>'+
   [['Larry',30,41.2],['Moe',80,56],['Curly',100,14]].map((r,i)=>{const y=22+i*32;return '<text x="4" y="'+(y+15)+'" font-size="12" font-weight="700" fill="var(--ink)">'+r[0]+'</text>'+
    '<rect x="52" y="'+y+'" width="'+(r[1]*2.1)+'" height="9" rx="3" fill="var(--line2)"/><text x="'+(56+r[1]*2.1)+'" y="'+(y+8.5)+'" font-size="11" fill="var(--muted)">'+r[1]+'%</text>'+
    '<rect x="52" y="'+(y+12)+'" width="'+(r[2]*2.1)+'" height="9" rx="3" fill="var(--pri)"/><text x="'+(56+r[2]*2.1)+'" y="'+(y+20.5)+'" font-size="11" font-weight="700" fill="var(--pri-deep)">'+r[2]+'%</text>';}).join('')+'</svg>'+
   '<p class="kt-cap">Larry, the weakest shot, does best by firing into the air first and letting the stronger two aim at each other. Whom you threaten matters as much as your skill. The book’s Workouts section answers its “Trip to the Gym” puzzles: try each before peeking.</p>');
  const HIT={0:['look','Arlo’s request'],3:['shoes','Help with the move'],6:['sig','Which offer is real?'],7:['batna','The price'],8:['bid','Offers'],9:['vote','Where Hedda moves'],10:['inc','The bathroom']};
  L.$('#mp').innerHTML='<div class="mp-row hot"><span class="n">0</span><b>Is it a game at all? Who’s in?</b><div class="hs">Hedda’s sale: eight players round one table</div></div>'+MP_ROWS.map((r,j)=>{const h=HIT[j];
    return '<div class="mp-row'+(h?' hot':'')+'"><span class="n">'+(j+1)+'</span><b>'+r[0]+'</b><div class="t">'+r[1].map((k,q)=>(q?'<span class="mp-ar">→</span>':'')+'<span class="mp-t'+(h&&h[0]===k?' cur':'')+'">'+MP_T[k][0]+'</span>').join('')+'</div>'+(h?'<div class="hs">Hedda’s sale: '+h[1]+'</div>':'')+'</div>';}).join('');
  L.done();}}
  ]
});
