  const worse=P[1][1][0]<P[0][0][0]&&P[1][1][1]<P[0][0][1];
  const dA=c=>Math.sign(P[1][c][0]-P[0][c][0]),dB=r=>Math.sign(P[r][1][1]-P[r][0][1]);
  const sink=(r,c)=>!(((c===0&&dB(r)>0)||(c===1&&dB(r)<0))||((r===0&&dA(c)>0)||(r===1&&dA(c)<0)));
  const s00=sink(0,0),s11=sink(1,1);

  return {aDom,bDom,worse,kind};

    (o.players?'<div class="pd-ctl pj-n"><span class="pd-lab">How many players?</span><button class="chip" data-n="4">4 players</button><button class="chip" data-n="10">10 players</button></div>':'')+
    '<p class="pd-ro pj-ro" aria-live="polite"></p>';
  const $=s=>w.querySelector(s);
  const fm=v=>'£'+(Math.abs(v-Math.round(v))<1e-9?Math.round(v):v.toFixed(2));
  function fig(x,y,r,col){return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="var('+col+'-bg)" stroke="var('+col+')" stroke-width="1.8"/><rect x="'+(x-r*1.1)+'" y="'+(y+r+2)+'" width="'+(r*2.2)+'" height="'+(r*2.6)+'" rx="'+(r*.8)+'" fill="var('+col+'-bg)" stroke="var('+col+')" stroke-width="1.8"/>';}
  function draw(){
    const pool=t+(N-1)*ot,dbl=2*pool,share=dbl/N,tali=10-t+share,oth=10-ot+share,team=N*10+pool,best=N*20;
    let s='<text x="160" y="16" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">'+fm(pool)+' in × 2 = '+fm(dbl)+' · split '+N+' ways = '+fm(share)+' each</text>';
    s+='<path d="M136 32h48v10h-48z" fill="var(--card)" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/>';
    s+='<path d="M128 42Q116 48 116 64V164Q116 176 128 176H192Q204 176 204 164V64Q204 48 192 42Z" fill="none" stroke="var(--ink)" stroke-width="2.2"/>';
    s+='<circle cx="206" cy="46" r="13" fill="var(--ok-strong)"/><text x="206" y="51" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--card)">×2</text>';
    s+=fig(44,52,12,'--h1')+'<text x="44" y="112" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--h1)">Tali</text>'+
      '<text x="44" y="128" text-anchor="middle" font-size="11.5" fill="var(--muted)">keeps '+fm(10-t)+'</text><text x="44" y="143" text-anchor="middle" font-size="11.5" fill="var(--ok)">+'+fm(share)+' back</text>';
    if(N===4)[250,278,306].forEach(x=>s+=fig(x,56,9,'--h2'));
    else for(let q=0;q<9;q++)s+=fig(250+(q%3)*28,30+Math.floor(q/3)*24,5.5,'--h2');
    s+='<text x="278" y="112" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--h2)">'+(N-1)+' others</text>'+
      '<text x="278" y="128" text-anchor="middle" font-size="11.5" fill="var(--muted)">each keeps '+fm(10-ot)+'</text><text x="278" y="143" text-anchor="middle" font-size="11.5" fill="var(--ok)">+'+fm(share)+' back</text>';
    s+=pdArrow(114,160,74,160,'var(--ok-strong)')+pdArrow(206,160,246,160,'var(--ok-strong)');
    $('.pj-g').innerHTML=s;
    const H=108,hi=pool/(N*20)*H,hm=pool/(N*20)*H;
    const ri=$('.pj-in'),rm=$('.pj-mt');ri.style.y=(174-hi)+'px';ri.style.height=hi+'px';rm.style.y=(174-hi-hm)+'px';rm.style.height=hm+'px';
    $('.pj-t').innerHTML=(hi>15?'<text x="160" y="'+(174-hi/2+4)+'" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--h3)">'+fm(pool)+' put in</text>':'')+
      (hm>15?'<text x="160" y="'+(174-hi-hm/2+4)+'" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--ok)">+'+fm(pool)+' doubled</text>':'')+
      (pool===0?'<text x="160" y="160" text-anchor="middle" font-size="12" font-weight="700" fill="var(--muted)">empty</text>':'');
    const bar=(lab,v,max,col,txt)=>'<div class="pd-br"><span>'+lab+'</span><div class="bar"><i style="width:'+Math.max(2,v/max*100)+'%;background:var('+col+')"></i></div><b>'+txt+'</b></div>';
    $('.pj-bars').innerHTML=bar('Tali takes home',tali,30,'--h1',fm(tali))+bar('Each other player',oth,30,'--h2',fm(oth))+bar('Whole team (best '+fm(best)+')',team,best,'--pri',fm(team));
    if($('.pj-tv'))$('.pj-tv').textContent=fm(t);if($('.pj-ov'))$('.pj-ov').textContent=fm(ot);
    $('.pj-ro').innerHTML='Each £1 Tali adds → £2 in the jar → only <b>'+Math.round(200/N)+'p</b> comes back to Tali';
    w.querySelectorAll('.pj-n .chip').forEach(b=>b.classList.toggle('sel',+b.dataset.n===N));
  }
  const api={wrap:w,get t(){return t;},get o(){return ot;},get n(){return N;},
    set(nt,no){if(nt!=null)t=nt;if(no!=null)ot=no;if($('.pj-ts'))$('.pj-ts').value=t;if($('.pj-os'))$('.pj-os').value=ot;draw();if(o.onChange)o.onChange(api);},
    setN(n){N=n;draw();if(o.onChange)o.onChange(api);}};
  if($('.pj-ts'))$('.pj-ts').addEventListener('input',e=>api.set(+e.target.value,null));
  if($('.pj-os'))$('.pj-os').addEventListener('input',e=>api.set(null,+e.target.value));
  w.querySelectorAll('.pj-n .chip').forEach(b=>b.onclick=()=>api.setN(+b.dataset.n));
  draw();return api;
}

const PD_T={look:['Look ahead',2],pd:['Spot & escape a dilemma',3],shoes:['Their shoes',5],mix:['Mix your moves',6],move:['Commit, threaten, promise',7],cred:['Make it credible',8],
  sig:['Signals',9],group:['Coordinate the group',10],bid:['Bid smart',11],batna:['BATNA',12],vote:['Vote & agenda',13],inc:['Incentives',14]};
const PD_MAP=[['Taking turns: you move, then they respond',['look','cred','move']],['You both choose at once',['shoes','pd','mix']],['Everyone’s tempted to grab, everyone loses',['pd','group','inc']],
  ['You need to land on the same choice',['shoes','group','move']],['Your pattern is read, or you’re checking',['mix']],['You want to change someone’s behaviour',['move','cred','look']],

Course.lesson({
  id:'0003', title:'Prisoners’ dilemmas: why both sides lose', minutes:20, icon:'lock',
  goals:['Draw any two-sided choice as four boxes and see which way each side is pushed',
         'Spot a prisoners’ dilemma with two checks, and tell it apart from a stag hunt, where trust is enough',
         'Run the one-minute “Spot” move on tug-of-wars at work, at home and with friends, without falling for “if I hold back, they will”'],
  parts:['Spot the trap','Why both lose','Real people, many players','Use it this week'],
  read:'Read the first part of chapter 3 of the book for the catalogue-shirt table, the Friend or Foe and classroom experiments, and the Early Bird case about Darwin’s finches.',
  glossary:{
   'cooperate-defect':'Cooperate and defect: the general names for the two moves in a prisoners’ dilemma. Cooperate = hold back for the shared good; defect (or cheat) = grab for yourself.',
   'free-rider':'Free rider: someone who enjoys a shared benefit without paying in, hoping the others will cover it.',
   commons:'Tragedy of the commons: a prisoners’ dilemma with many players, where each takes more of a shared thing (a pasture, a fishery, a stable climate) because the cost falls on everyone else.',
   'stag-hunt':'Stag hunt: a cousin of the prisoners’ dilemma. If everyone commits, all do well, and nobody is tempted to cheat on people they trust. Doubt the others and you play safe. A confidence game.',
   'quasi-magical':'Quasi-magical thinking: acting as if your own hidden choice could change what the other side does (“if I cooperate, they will”). The book calls it illogical.'
  },
  cheatsheet:[
   '<b>Prisoners’ dilemma:</b> grabbing (defecting) is best for each side whatever the other does, yet when both grab, both end up worse off than if both had held back.',
   '<b>Draw the four boxes</b> (a payoff table): your choices down the side, theirs across the top, both payoffs in each box. Arrows show which way each side pushes; in a dilemma they all lead to the both-lose corner.',
   '<b>Rule 2: if you have a dominant strategy, use it.</b> In a dilemma both sides have one, and that is the trap. Holding back alone does worst.',
   'Most games aren’t zero-sum: both can win or both can lose. With many players (a kitty, a shared space, the commons), each £1 you put in returns less to you, so free riding pulls harder.',
   'Real people cooperate more than the theory predicts (almost half, even once). But “if I hold back, they will” is quasi-magical thinking: your hidden choice can’t change theirs.',
   'Not every dilemma should be escaped: a price war helps customers, and rivals agreeing prices is illegal. Not every shared task is a dilemma: in a stag hunt, trust is enough.',
   'One-minute move, “Spot” (how this course applies the book): draw the four boxes → is grabbing better for me whatever they do, and for them? → is both grabbing worse for both? → then it’s a dilemma. Escaping it is lesson 4.'
  ],
  steps:[
/* ---------- PART 1: SPOT THE TRAP ---------- */

{part:1,src:'Chapter 3 · A Little History · A Visual Representation',

 run(L){
  const C={'0,0':'Both at $80: each sells 1,200. (80 − 20) × 1,200 = <b>$72,000 each</b>.',

  L.h(L.kick('ex','The book’s shirts')+'<h1 class="q">Two catalogue firms price the same shirt, $80 or $70, without seeing each other’s catalogue. Tap each box to work out the profits.</h1>'+
   '<p class="small" style="margin:0">Rainbow’s End (RE) picks a row, B. B. Lean (BB) a column. Each shirt costs $20. $k = thousands of dollars.</p><div id="sb"></div>');
  const seen=new Set();
  const b=pdBoard(L,L.$('#sb'),Object.assign({pay:PD_SHIRT,hide:true,onCell(r,c){const k=r+','+c;seen.add(k);b.unhide(r,c);b.hl([[r,c]],'var(--pri)');b.ro(C[k]);
    if(seen.size===4){b.hl([[0,0],[1,1]],'var(--ok-strong)');
      L.sheet('info','Not zero-sum','Compare top-left with bottom-right: both firms earn more at $80 ($72,000) than at $70 ($70,000). One side’s gain isn’t the other’s loss: both can win, or both can lose. Two numbers per box, staggered like this, was Thomas Schelling’s idea.');L.done();}}},PD_SHIRT_O));
  b.ro('Four boxes, one for each pair of prices.');}},

{part:1,src:'Chapter 3 · A Little History · The Dilemma',pts:1,
 solve:async L=>{L.$('[data-cell="1,1"]').dispatchEvent(new MouseEvent('click',{bubbles:true}));L.$('#pt').click();await L.sleep(1500);},
 run(L){
  L.h(L.kick('try','Predict, then watch')+'<h1 class="q">Each firm picks its best price. Tap the box where you think they end up, then tilt the board.</h1><div id="pb"></div>'+
   '<div class="pd-ctl"><button class="btn pri" id="pt" disabled>'+L.ic('play')+'Tilt the board</button></div>');
  let pick=null,done=false;
  const b=pdBoard(L,L.$('#pb'),Object.assign({pay:PD_SHIRT,onCell(r,c){if(done)return;pick=[r,c];b.hl([pick],'var(--pri)');L.$('#pt').disabled=false;b.ro('Your guess: RE <b>'+(r?'$70':'$80')+'</b>, BB <b>'+(c?'$70':'$80')+'</b>');}},PD_SHIRT_O));
  b.ro('Tap a box to predict.');
  L.$('#pt').onclick=async function(){if(done||!pick)return;done=true;this.disabled=true;b.showAll();await b.roll([0,0]);if(!b.wrap.isConnected)return;
    const ok=pick[0]===1&&pick[1]===1;L.award(ok);b.ro('Both at <b>$70</b>: $70k each, below the $72k each at $80.');
    L.sheet(ok?'ok':'no',ok?'Both cut to $70':'They both cut to $70','RE’s manager reasons: if BB charges $80, cutting gives $110k instead of $72k. If BB charges $70, cutting gives $70k instead of $24k. Cutting wins either way. BB’s sums are the mirror image, so both cut, and both earn less than at $80.');L.done();};}},

{part:1,src:'Chapter 3 · A Little History · The Dilemma',
 solve:async L=>{L.$$('#rq .chip').forEach(b=>b.click());},
 run(L){
  L.h(L.kick('learn','Dominant strategy')+'<h1 class="q">RE doesn’t need to guess what BB will do. Check both of BB’s choices.</h1><div id="db"></div>'+
   '<div class="pd-ctl" id="rq"></div><div id="rr"></div>');
  const b=pdBoard(L,L.$('#db'),Object.assign({pay:PD_SHIRT},PD_SHIRT_O));b.ro('Tap both questions.');
  const seen=new Set();
  [['If BB charges $80',0,'BB at $80: RE gets $72k at $80 but <b>$110k</b> at $70. Cut.'],['If BB charges $70',1,'BB at $70: RE gets $24k at $80 but <b>$70k</b> at $70. Cut again.']].forEach(q=>{
    const x=document.createElement('button');x.className='chip';x.textContent=q[0];x.onclick=()=>{x.classList.add('sel');seen.add(q[1]);b.reveal('A',q[1]);b.hl([[0,q[1]],[1,q[1]]],'var(--h1)');b.ro(q[2]);
      if(seen.size===2){L.$('#rr').innerHTML='<div class="pd-rule">Rule 2: If you have a dominant strategy, use it.</div><p class="small" style="margin:0;text-align:center">A <b>'+L.g('dominant','dominant strategy')+'</b> is best for you whatever the others do. In this game, both firms have one.</p>';L.done();}};L.$('#rq').appendChild(x);});}},

{part:1,src:'Chapter 3 · A Little History · The Dilemma',
 solve:async L=>{L.$('#da').click();await L.sleep(1700);},
 run(L){
  L.h(L.kick('learn','Why both lose')+'<h1 class="q">The marble rests at $70 each. The dashed ring marks where both would be better off.</h1><div id="wb"></div>'+
   '<div class="pd-ctl"><button class="btn pri" id="da">'+L.ic('play')+'What if RE holds $80 alone?</button></div><div id="wt"></div>');
  const b=pdBoard(L,L.$('#wb'),Object.assign({pay:PD_SHIRT,arrows:true},PD_SHIRT_O));b.settle([1,1]);b.ghost([0,0]);
  b.ro('Rests at <b>$70k each</b>. The ring: <b>$72k each</b>, if both held $80.');
  L.$('#da').onclick=async function(){this.disabled=true;b.ro('RE holds $80 while BB cuts: RE gets <b>$24k</b>, the worst box.');await b.roll([0,1],{pause:1100});if(!b.wrap.isConnected)return;
    this.hidden=true;b.ro('…so RE cuts too, and the marble rolls back to $70k each.');
    L.$('#wt').innerHTML='<div class="pd-ck"><i class="y">✓</i><span><b>Cutting</b> is best for each firm, whatever the other does.</span></div><div class="pd-ck"><i class="y">✓</i><span>Both cutting is <b>worse for both</b> than both holding $80.</span></div>'+
      '<p class="small" style="margin:4px 0 0">Both checks pass: a prisoners’ dilemma. In general the moves are called '+L.g('cooperate-defect','cooperate and defect')+'.</p>';
    L.sheet('info','Holding back alone does worst','One firm at $80 isn’t enough: it just loses customers. Both would have to hold back, and each is tempted to undercut. The book notes this clashes with the old idea that each chasing their own interest gives the best result for all.');L.done();};}},

{part:1,src:'Chapter 3 · A Little History · The Dilemma',pts:1,run(L){
  L.h(L.kick('try','Build the test')+'<h1 class="q">Tap the pieces until the sentence describes a prisoners’ dilemma.</h1>');
  L.sentence(L.card,[['Cooperating','Defecting','Waiting to see'],['is best for each side, whatever the other does,','is best only if the other side defects,','is best only the first time,'],
    ['so both defecting is best for both.','so one side always wins.','yet both defecting leaves both worse off than both cooperating.']],[1,0,2],
   [['Cooperating is the move that loses to defecting in every case.','There’s no waiting: both choose at the same time, without seeing the other.'],
    ['Too weak. In a dilemma defecting wins in both cases: each side has a dominant strategy.','Repeats aren’t part of the test. It’s about one choice, made at the same time.'],
    ['That’s the trap: both defecting is worse for both than both cooperating.','It isn’t zero-sum: both can lose together.']],
   'Two checks: <b>defecting wins whatever the other does</b> (for each side), and <b>both defecting is worse for both</b> than both cooperating. You’ll run these two checks in the one-minute move.');}},

/* ---------- PART 3: REAL PEOPLE, MANY PLAYERS ---------- */
{part:2,src:'Chapter 3 · More Recent Experiments',
 solve:async L=>{L.$$('#fp .chip')[0].click();await L.sleep(900);},
 run(L){
  L.h(L.kick('ex','A game show from the book')+'<h1 class="q">You’re on <i>Friend or Foe</i>. Each of you secretly writes one word. What do you write?</h1>'+
   '<svg class="pd-svg" viewBox="0 0 320 120" role="img" aria-label="Two contestants and a shared pot of £4,000">'+pdFig(46,56,'--h1')+pdFig(274,56,'--h2')+
   '<text x="46" y="88" text-anchor="middle" font-size="12" font-weight="700" fill="var(--h1)">You</text><text x="274" y="88" text-anchor="middle" font-size="12" font-weight="700" fill="var(--h2)">Them</text>'+
   [0,1,2,3].map(j=>'<rect x="'+(126+j*4)+'" y="'+(70-j*9)+'" width="60" height="22" rx="4" fill="var(--ok-bg)" stroke="var(--ok-line)" stroke-width="1.5"/>').join('')+
   '<text x="160" y="112" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">£4,000 pot (illustrative)</text>'+
   '<g id="fyou"><rect x="70" y="24" width="44" height="30" rx="6" fill="var(--soft2)" stroke="var(--line2)" stroke-width="1.5"/><text x="92" y="44" text-anchor="middle" font-size="12" font-weight="700" fill="var(--muted)">?</text></g>'+
   '<rect x="206" y="24" width="44" height="30" rx="6" fill="var(--soft2)" stroke="var(--line2)" stroke-width="1.5"/><text x="228" y="44" text-anchor="middle" font-size="12" font-weight="700" fill="var(--muted)">?</text></svg>'+
   '<p class="small" style="margin:0;text-align:center">Both Friend: split it. One Foe: the Foe takes it all. Both Foe: nobody gets anything.</p>'+
   '<div class="pd-ctl" id="fp"></div><div id="fo"></div>');
  let done=false;
  ['Friend','Foe'].forEach((n,j)=>{const x=document.createElement('button');x.className='chip';x.textContent='Write “'+n+'”';x.onclick=()=>{if(done)return;done=true;x.classList.add('sel');
    L.$('#fyou').innerHTML='<rect x="66" y="24" width="52" height="30" rx="6" fill="var(--card)" stroke="var(--h1)" stroke-width="2"/><text x="92" y="44" text-anchor="middle" font-size="12" font-weight="700" fill="var(--h1)">'+n.toUpperCase()+'</text>';
    L.$('#fo').innerHTML='<div class="pd-cards"><div'+(j===0?' class="on"':'')+'><b>You write Friend</b>They write Friend: £2,000<br>They write Foe: £0</div><div'+(j===1?' class="on"':'')+'><b>You write Foe</b>They write Friend: £4,000<br>They write Foe: £0</div></div>'+
      '<p class="pd-ro">Foe gives you <b>at least as much, whatever they write</b>. And yet…</p>'+
      '<div class="pd-br"><span>Women, season 1, wrote Friend</span><div class="bar"><i style="background:var(--ok-strong)"></i></div><b>53.7%</b></div>'+
      '<div class="pd-br"><span>Men, season 1, wrote Friend</span><div class="bar"><i style="background:var(--ok-strong)"></i></div><b>47.5%</b></div>';
    requestAnimationFrame(()=>requestAnimationFrame(()=>{const is=L.$$('#fo .bar i');if(is[0])is[0].style.width='53.7%';if(is[1])is[1].style.width='47.5%';}));
    L.sheet('info','Almost half cooperate, even once','In one-off dilemmas almost half of people cooperate. On the show (over $700,000 paid out) bigger pots didn’t change that. Once season 2 players had seen earlier results, cooperation fell about ten points. Re-paired again and again, people cooperate less, but never zero.');L.done();};L.$('#fp').appendChild(x);});}},

{part:2,src:'Chapter 3 · Solution by Kantian Categorical Imperative?',pts:1,
 solve:async L=>{L.$$('#qp .chip')[2].click();L.$('#qr').click();await L.sleep(1000);},
 run(L){
  L.h(L.kick('pr','Predict, then reveal')+'<h1 class="q">Tali thinks: “If I leave at 6, Linus will too.” A study tested that kind of hope.</h1>'+
   '<svg class="pd-svg" viewBox="0 0 320 112" role="img" aria-label="Tali and Linus in separate rooms; Tali hopes a magic link joins their choices"><rect x="4" y="30" width="146" height="78" rx="12" fill="var(--soft)"/><rect x="170" y="30" width="146" height="78" rx="12" fill="var(--soft)"/>'+
   '<rect x="154" y="24" width="12" height="88" rx="3" fill="var(--line2)"/>'+pdFig(34,72,'--h1')+pdFig(286,72,'--h2')+
   '<text x="34" y="102" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--h1)">Tali</text><text x="286" y="102" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--h2)">Linus</text>'+
   '<rect x="60" y="34" width="88" height="36" rx="9" fill="var(--card)" stroke="var(--ink)" stroke-width="1.5"/><text x="104" y="49" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--ink)">If I leave at 6,</text><text x="104" y="63" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--ink)">Linus will too</text>'+
   '<path d="M104 34Q172 -8 268 62" fill="none" stroke="var(--pri)" stroke-width="2.5" stroke-dasharray="6 5"/><g id="qx" opacity="0"><circle cx="160" cy="22" r="14" fill="var(--no-strong)"/><path d="M154 16l12 12M166 16l-12 12" stroke="var(--card)" stroke-width="3" stroke-linecap="round"/></g></svg>'+
   '<p class="small" style="margin:4px 0 0">Students played a one-off dilemma. Some were told the other side’s choice first. Share who cooperated:</p>'+
   '<div class="pd-br"><span>Told the other defected</span><div class="bar"><i style="background:var(--no-strong)"></i></div><b>3%</b></div>'+
   '<div class="pd-br"><span>Told the other cooperated</span><div class="bar"><i style="background:var(--ok-strong)"></i></div><b>16%</b></div>'+
   '<div class="pd-br"><span>Told nothing</span><div class="bar"><i style="background:var(--pri)"></i></div><b id="qv">?</b></div>'+
   '<div class="pd-ctl" id="qp"><span class="pd-lab">Your prediction for “told nothing”</span></div><div class="pd-ctl"><button class="btn pri" id="qr" disabled>'+L.ic('eye')+'Reveal</button></div>');
  requestAnimationFrame(()=>requestAnimationFrame(()=>{const is=L.$$('.pd-br .bar i');if(is[0]){is[0].style.width='3%';is[1].style.width='16%';}}));
  let pick=null,done=false;
  ['Under 3%','Between 3% and 16%','Over 16%'].forEach((n,j)=>{const x=document.createElement('button');x.className='chip';x.textContent=n;x.onclick=()=>{if(done)return;pick=j;L.$$('#qp .chip').forEach((c,q)=>c.classList.toggle('sel',q===j));L.$('#qr').disabled=false;};L.$('#qp').appendChild(x);});
  L.$('#qr').onclick=function(){if(done||pick===null)return;done=true;this.disabled=true;L.$$('.pd-br .bar i')[2].style.width='37%';L.$('#qv').textContent='37%';L.$('#qx').setAttribute('opacity',1);
    const ok=pick===2;L.award(ok);
    L.sheet(ok?'ok':'no',ok?'37%: more than either':'It jumped to 37%','Eldar Shafir and Amos Tversky called it '+L.g('quasi-magical','quasi-magical thinking')+': while the other’s choice is unknown, people act as if their own could sway it. The book is blunt: it can’t. Linus decides without seeing Tali’s move. (Its twist: a society that thinks this way falls into fewer dilemmas.)');L.done();};}},

{part:2,src:'Chapter 3 · More Recent Experiments',
 solve:async L=>{for(const k of [0,1,2])L.$$('#jp .chip')[k].click();},
 run(L){
  L.h(L.kick('learn','Explore · the doubling kitty jar')+'<h1 class="q">The book’s contribution game, at Tali’s five-a-side: four players, £10 each. The jar is doubled, then split equally.</h1>'+
   '<p class="small" style="margin:0">The book plays it with a $10 stake; a sponsor doubling the kitty is this course’s way to tell it. Tap all three setups (or use the sliders).</p><div class="pd-ctl" id="jp"></div><div id="jj"></div>');
  const seen=new Set();let fin=false;
  const j=pdJar(L,L.$('#jj'),{t:5,o:5,onChange(a){seen.add(a.t+','+a.o);
    if(!fin&&['10,10','0,10','0,0'].every(k=>seen.has(k))){fin=true;
      L.sheet('info','Each £1 comes back as 50p','Tali’s £1 becomes £2 in the jar, but it’s split four ways, so only 50p returns to Tali. Keeping it is better for Tali whatever the others do, and the same goes for each of them. All give: £20 each. All keep: £10 each. Everyone hoping to be a '+L.g('free-rider','free rider')+' is the dilemma.');L.done();}}});
  [['Everyone gives £10',10,10],['Tali keeps, others give',0,10],['Nobody gives',0,0]].forEach(p=>{const x=document.createElement('button');x.className='chip';x.textContent=p[0];x.onclick=()=>{L.$$('#jp .chip').forEach(c=>c.classList.toggle('sel',c===x));j.set(p[1],p[2]);};L.$('#jp').appendChild(x);});}},

{part:2,src:'Chapter 3 · More Recent Experiments',pts:1,
 solve:async L=>{const s=L.$('.pj-ts');s.value=0;s.dispatchEvent(new Event('input',{bubbles:true}));L.$('#kl').click();await L.sleep(20);L.$('.pj-n .chip[data-n="10"]').click();},
 run(L){
  L.h(L.kick('pr','Challenge · the free rider')+'<h1 class="q">The other three each put in £10. How much should Tali put in to take home the most? Set it, then lock it in.</h1><div id="kj"></div>'+
   '<div class="pd-ctl"><button class="btn pri" id="kl">'+L.ic('lock')+'Lock it in</button></div><div id="kq"></div>');
  let locked=false,fin=false;
  const j=pdJar(L,L.$('#kj'),{t:10,o:10,others:false,players:true,onChange(a){if(locked&&!fin&&a.n===10){fin=true;
    L.sheet('info','Bigger group, stronger pull','With ten players each £1 returns only 20p, so keeping it tempts even more. A shared thing that everyone takes from or nobody pays into is a many-player dilemma: biologist Garrett Hardin called it the '+L.g('commons','tragedy of the commons')+'.');L.done();}}});
  L.$('.pj-n').hidden=true;
  L.$('#kl').onclick=function(){if(locked)return;locked=true;this.disabled=true;const ok=j.t===0;L.award(ok);
    L.$('#kq').innerHTML=L.quote('When everyone tries to be a free rider, the bus stays in the garage.','Dixit and Nalebuff, The Art of Strategy, chapter 3');
    L.sheet(ok?'ok':'no',ok?'£0: £25 for Tali':'£0 would pay Tali most','Putting in nothing gives Tali £25, against £20 for giving it all. But every player faces the same sums, so if all reason like Tali, the jar stays empty and each goes home with £10. Now switch to 10 players and watch what each £1 returns.',{label:'Try 10 players',fn:()=>{L.clearSheet();L.$('.pj-n').hidden=false;}});};}},

{part:2,src:'Chapter 3 · More Recent Experiments',
 solve:async L=>{L.$$('#cp .chip')[0].click();L.$$('#cp .chip')[1].click();},
 run(L){
  L.h(L.kick('ex','A classroom from the book')+'<h1 class="q">27 students each secretly write 1 (keep supply low, help everyone) or 2 (grab more). Slide how many write 1.</h1>'+
   '<svg class="pd-svg" id="csv" viewBox="0 0 320 112" role="img" aria-label="27 paper slips, each showing 1 or 2"></svg>'+
   '<label class="pd-sl"><span class="h"><span>Students who write 1</span><b id="cv"></b></span><input type="range" id="cs" min="0" max="27" step="1" value="14" aria-label="Students who write 1, from 0 to 27"></label>'+
   '<div class="pd-ctl" id="cp"></div><div id="cb"></div>');
  const seen=new Set();let fin=false;
  const draw=()=>{const n=+L.$('#cs').value,one=.04*n,two=one+.5,tot=n*one+(27-n)*two;let s='';
    for(let q=0;q<27;q++){const x=4+(q%9)*35,y=4+Math.floor(q/9)*36,on=q<n;s+='<rect x="'+x+'" y="'+y+'" width="31" height="31" rx="6" fill="var('+(on?'--ok-bg':'--no-bg')+')" stroke="var('+(on?'--ok-line':'--no-line')+')" stroke-width="1.5"/><text x="'+(x+15.5)+'" y="'+(y+21)+'" text-anchor="middle" font-size="14" font-weight="700" fill="var('+(on?'--ok':'--no')+')">'+(on?1:2)+'</text>';}
    L.$('#csv').innerHTML=s;L.$('#cv').textContent=n;
    const bar=(lab,v,max,col,txt)=>'<div class="pd-br"><span>'+lab+'</span><div class="bar"><i style="width:'+Math.max(2,v/max*100)+'%;background:var('+col+')"></i></div><b>'+txt+'</b></div>';
    L.$('#cb').innerHTML=(n?bar('Each who wrote 1 gets',one,1.6,'--ok-strong','$'+one.toFixed(2)):'')+(n<27?bar('Each who wrote 2 gets',two,1.6,'--no-strong','$'+two.toFixed(2)):'')+bar('Whole class (best $29.16)',tot,29.16,'--pri','$'+tot.toFixed(2));
    seen.add(n);if(!fin&&seen.has(27)&&seen.has(4)){fin=true;
      L.sheet('info','Writing 2 always pays 50 cents more','Each switch to 2 earns the switcher 46 cents more but costs each classmate 4 cents. In the final binding vote only 4 wrote 1: $15.82 in all, $13.34 less than if all had written 1. The student leading the pact to write 1? Wrote 2.');L.done();}};
  L.$('#cs').addEventListener('input',draw);
  [['The plan: all write 1',27],['The final vote',4],['Nobody writes 1',0]].forEach(p=>{const x=document.createElement('button');x.className='chip';x.textContent=p[0];x.onclick=()=>{L.$('#cs').value=p[1];draw();};L.$('#cp').appendChild(x);});
  draw();}},

{part:3,src:'Course application · built on Chapter 3',pts:1,
 solve:async L=>{L.$('#ob').click();L.$('#ob').click();L.$('#ob').click();L.$('#ob').click();L.$$('#ov .chip')[0].click();await L.sleep(1400);},
 run(L){
  L.h(L.kick('pr','One-minute move · Spot')+'<h1 class="q">After a party, the kitchen is a mess. Tali and Juno, both tired, each decide alone: wash up now or go to bed?</h1>'+
   L.note('How this course applies the book: a one-minute routine built only from the chapter’s two checks.','compass')+
   '<p class="pd-lab" style="margin:8px 0 4px">Reach for it when…</p><svg class="pd-svg" viewBox="0 0 320 78" role="img" aria-label="Reach for it when: you are both tempted to grab; if both grab, both lose; you can’t see their move">'+
   '<rect x="0" y="0" width="102" height="78" rx="12" fill="var(--soft)"/><rect x="109" y="0" width="102" height="78" rx="12" fill="var(--soft)"/><rect x="218" y="0" width="102" height="78" rx="12" fill="var(--soft)"/>'+
   pdFig(16,26,'--h1')+pdFig(86,26,'--h2')+'<circle cx="51" cy="24" r="7" fill="var(--h4-bg)" stroke="var(--h4)" stroke-width="1.8"/>'+pdArrow(26,24,41,24,'var(--h1)',5.5)+pdArrow(76,24,61,24,'var(--h2)',5.5)+
   '<text x="51" y="58" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink)">both tempted</text><text x="51" y="72" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink)">to grab</text>'+
   '<rect x="138" y="8" width="20" height="16" rx="3" fill="var(--card)" stroke="var(--line2)"/><rect x="162" y="8" width="20" height="16" rx="3" fill="var(--card)" stroke="var(--line2)"/><rect x="138" y="27" width="20" height="16" rx="3" fill="var(--card)" stroke="var(--line2)"/><rect x="162" y="27" width="20" height="16" rx="3" fill="var(--no-bg)" stroke="var(--no-strong)"/><circle cx="172" cy="35" r="4.5" fill="var(--pri)"/>'+
   '<text x="160" y="58" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink)">both grab,</text><text x="160" y="72" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink)">both lose</text>'+
   pdFig(244,26,'--h1')+pdFig(296,26,'--h2')+'<rect x="266" y="8" width="8" height="34" rx="2" fill="var(--line2)"/>'+
   '<text x="269" y="58" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink)">you can’t see</text><text x="269" y="72" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink)">their move</text></svg>'+
   '<div class="pd-steps" id="osp"><span><i>1</i>Draw boxes</span><span><i>2</i>Grab wins for me?</span><span><i>3</i>For them too?</span><span><i>4</i>Both worse?</span></div>'+
   '<div id="obd"></div><div class="pd-say" id="osay" aria-live="polite"></div><div class="pd-ctl"><button class="btn pri" id="ob"></button></div><div class="pd-ctl" id="ov"></div>');
  let s=0,fin=false,b=null;
  const say=(h,x)=>L.$('#osay').innerHTML='<b class="t">'+h+'</b>'+x;
  function go(n){s=n;L.$$('#osp span').forEach((p,j)=>p.className=j<n?'dn':j===n?'cur':'');const ob=L.$('#ob');
    if(n===0){say('STEP 1 · DRAW THE FOUR BOXES','Your two choices down the side, theirs across the top.');ob.innerHTML=L.ic('pencil')+'Draw the boxes';}
    if(n===1){say('STEP 2 · DOES GRABBING WIN FOR TALI?','Illustrative points: a clean kitchen, a good night’s sleep, a calm morning. Check Tali’s push in both columns.');ob.innerHTML=L.ic('eye')+'Check Tali’s arrows';}
    if(n===2){say('STEP 3 · …AND FOR JUNO?','Bed beats washing for Tali whatever Juno does. Now Juno’s side.');ob.innerHTML=L.ic('eye')+'Check Juno’s arrows';}
    if(n===3){say('STEP 4 · IS BOTH GRABBING WORSE FOR BOTH?','Compare both in bed (2 and 2) with both washing up together (3 and 3).');ob.innerHTML=L.ic('scale')+'Compare the two corners';}
    if(n===4){ob.parentNode.hidden=true;say('VERDICT','Both checks done. What is it?');
      [['A prisoners’ dilemma',0],['Not a dilemma: just go to bed',1]].forEach(o=>{const x=document.createElement('button');x.className='chip';x.textContent=o[0];x.onclick=async()=>{if(fin)return;fin=true;x.classList.add('sel');const ok=o[1]===0;L.award(ok);
        L.$$('#osp span').forEach(p=>p.className='dn');await b.roll([0,0]);if(!b.wrap.isConnected)return;b.ro('Both go to bed: <b>2 and 2</b>, a crusty kitchen and a grumpy morning.');
        L.sheet(ok?'ok':'no',ok?'Spotted: a dilemma':'Both checks passed: a dilemma','Going to bed wins for each whatever the other does, and both in bed is worse for both than washing up together. Spotting it takes a minute. The dishes come back every week, though, and lesson 4 shows how a repeated game like this one can escape the trap.');L.done();};L.$('#ov').appendChild(x);});}}
  L.$('#ob').onclick=()=>{if(s===0){b=pdBoard(L,L.$('#obd'),{b:'Juno',ra:['Wash|up','Go to|bed'],pay:PD_DISH});b.ro('Tali bottom-left, Juno top-right.');go(1);}
    else if(s===1){b.reveal('A',0);b.reveal('A',1);b.hl([[0,0],[1,0],[0,1],[1,1]],'var(--h1)');b.ro('Juno washes: Tali gets 3 washing, <b>4</b> in bed. Juno in bed: 1 washing alone, <b>2</b> in bed.');go(2);}
    else if(s===2){b.reveal('B',0);b.reveal('B',1);b.hl([[0,0],[0,1],[1,0],[1,1]],'var(--h2)');b.ro('Juno’s sums are the mirror: bed wins for Juno too.');go(3);}
    else if(s===3){b.hl([[0,0],[1,1]],'var(--pri)');b.ro('Both in bed: <b>2 and 2</b>. Both washing up: <b>3 and 3</b>. Worse for both.');go(4);}};
  go(0);}},

{part:3,src:'Chapter 3 · More Recent Experiments',
 solve:async L=>{for(const x of L.$$('#lp .chip')){x.click();await L.sleep(1300);}},
 run(L){
  L.h(L.kick('ex','Edge cases and limits')+'<h1 class="q">Where does the dilemma picture stop telling the whole story? Try each case.</h1>'+
   '<div class="pd-ctl" id="lp"></div><div id="lv"></div><div id="lf"></div>');
  const seen=new Set();let fin=false,tok=0;
  const P=[
   ['Hold back alone',async(h,t)=>{const b=pdBoard(L,h,{pay:PD_LATE,arrows:true});b.hl([[0,1]],'var(--no-strong)');b.settle([0,1]);b.ro('Tali leaves at 6, Linus stays: <b>Tali 1, Linus 4</b>.');},
    'The sucker’s box. Cooperating alone does worst, so good intentions on one side don’t fix a dilemma. Both would have to hold back.'],
   ['“If I hold back, they will”',async(h,t)=>{const b=pdBoard(L,h,{pay:PD_LATE,arrows:true});
      b.overlay('<path d="M'+(PX(0)+12)+' '+(PY(0)+14)+'L'+(PX(1)-12)+' '+(PY(1)-6)+'" stroke="var(--pri)" stroke-width="3" stroke-dasharray="6 5"/><text x="214" y="160" font-size="12" font-weight="700" fill="var(--pri)">magic link?</text>');
      b.ro('Tali leaves at 6, hoping it pulls Linus along…');await L.sleep(500);if(t!==tok)return;await b.roll([0,0]);if(t!==tok)return;b.ro('The arrows didn’t change. The marble ignores the hope.');},
    'Quasi-magical thinking. Your hidden choice can’t move theirs: the pushes stay the same. The book calls the logic illogical, while noting it can help a whole society cooperate.'],
   ['Customers win',async(h,t)=>{const b=pdBoard(L,h,Object.assign({pay:PD_SHIRT,arrows:true},PD_SHIRT_O));b.settle([1,1]);b.ro('The firms are stuck at $70k each…');
      h.insertAdjacentHTML('beforeend','<div class="pd-br"><span>Shirts sold, both at $80</span><div class="bar"><i style="width:43%;background:var(--h3)"></i></div><b>2,400</b></div><div class="pd-br"><span>Shirts sold, both at $70</span><div class="bar"><i style="width:50%;background:var(--ok-strong)"></i></div><b>2,800</b></div>');},
    'Shoppers aren’t players, but they gain: $10 off, and more of them buy. Society often wants this dilemma left alone, so rivals agreeing prices is illegal (antitrust law). Plover must never “solve” its price war by agreeing rates with Kittiwake.'],
   ['Many players',async(h,t)=>{pdJar(L,h,{n:10,t:0,o:10,stat:true});},
    'The kitty with ten players: Tali free-rides on nine others for £28. Each £1 put in returns 20p. More players, same trap, stronger pull: the tragedy of the commons.'],
   ['Real people',async(h,t)=>{const b=pdBoard(L,h,{pay:PD_LATE,arrows:true});b.settle([1,1]);b.ghost([0,0]);b.ro('The arrows show the pull. The ring: where almost half of people still go.');},
    'The theory says defect; in one-off lab dilemmas almost half cooperate anyway. The arrows are a strong pull, not a law of nature. Fairness and hope matter, so predict real people, not calculators.']];
  P.forEach((p,j)=>{const x=document.createElement('button');x.className='chip';x.textContent=p[0];x.onclick=async()=>{const t=++tok;L.$$('#lp .chip').forEach(c=>c.classList.toggle('sel',c===x));
    const h=L.$('#lv');h.innerHTML='';L.$('#lf').innerHTML='';L.fb(L.$('#lf'),'<b>'+p[0]+'.</b> '+p[2],'info');seen.add(j);await p[1](h,t);
    if(!fin&&seen.size===P.length){fin=true;L.sheet('info','Spot it, then think about who else is affected','A dilemma doesn’t yield to one side’s good intentions or hopes. It gets stronger with more players. Some dilemmas, like rivals’ price wars, protect people outside the game. And real people cooperate more than the arrows suggest.');L.done();}};L.$('#lp').appendChild(x);});}},

{part:3,src:'Chapter 3 · A Little History · The Dilemma',pts:1,run(L){
  L.h(L.kick('pr','The price war')+'<h1 class="q">Plover and Kittiwake keep undercutting each other’s day rates. Linus suggests ringing Kittiwake’s head to agree that both stop cutting. What does the book’s view of this dilemma say?</h1>');
  L.mc(L.card,['Do it: escaping the dilemma helps both agencies','Do it quietly, so clients never find out','Don’t: rivals agreeing prices hurts clients and is illegal; Plover sets its own course'],2,
   'Right. Clients are the winners of this dilemma, which is why antitrust law forbids rivals agreeing prices. Plover’s options are its own: its own pricing, what it offers clients, and how it bids (lessons 4 and 11).',
   'The firms’ trap is the clients’ gain, so society wants this one left alone: agreeing prices with a rival is illegal, quietly or not. Plover’s options are its own: its own pricing, its offer, how it bids (lessons 4 and 11).');}},

{part:3,src:'Chapter 3 · Case Study: The Early Bird Kills the Golden Goose',pts:1,
 solve:async L=>{L.$('[data-cell="0,0"]').dispatchEvent(new MouseEvent('click',{bubbles:true}));const p=L.$('.pd-step .btn[data-d="1"]');p.click();p.click();L.$('#gc').click();await L.sleep(1500);},
 run(L){
  L.h(L.kick('pr','Challenge · the joint pitch')+'<h1 class="q">The joint pitch for Greer: each is tempted to hedge and protect their own clients. Change only the payoffs until “both commit” is a resting well.</h1>'+
   '<p class="small" style="margin:0">Tap a box, then use − and +. Linus’s mirror box changes with it, so the game stays fair to both. Illustrative points.</p><div id="gb"></div>'+
   '<div class="pd-ctl"><button class="btn pri" id="gc">'+L.ic('check')+'Check it</button></div>');
  let first=true,fin=false;
  const b=pdBoard(L,L.$('#gb'),{ra:['Commit|fully','Hedge'],pay:PD_LATE,arrows:true,edit:true,checks:true,onChange(){b.ro('');L.clearSheet();}});
  b.ro('Which number makes hedging tempting when the other commits?');
  L.$('#gc').onclick=async()=>{if(fin)return;const ok=b.isSink(0,0);if(first){L.award(ok);first=false;}
    await b.roll([0,0]);if(!b.wrap.isConnected)return;
    if(ok){fin=true;L.$('#gc').disabled=true;const k=b.check().kind;b.ro('The marble stays put at <b>both commit</b>.');
      L.sheet('ok',k==='stag'?'You built a stag hunt':'Commit is now simply best',(k==='stag'?'Two wells now: both commit, or both hedge. ':'')+'A joint win worth more to each than hedging while the other commits removes the temptation. Nobody wants to cheat on a partner they trust. That isn’t a dilemma any more.');L.done();}
    else{b.ro('It still rolls away. Make “both commit” worth more than “hedge while the other commits”.');L.sheet('no','Still a dilemma','Hedging while the other commits still pays more, so the marble rolls away from both commit. Raise the both-commit box above that temptation, or lower the temptation.');}};}},

{part:3,src:'Chapter 3 · Case Study: The Early Bird Kills the Golden Goose',
 solve:async L=>{L.$('#ht').click();await L.sleep(700);L.$('#hd').click();await L.sleep(700);},
 run(L){
  L.h(L.kick('learn','Where cooperation wins')+'<h1 class="q">The joint pitch as a stag hunt: two wells. The marble sits on the ridge. What tips it?</h1><div id="hb"></div>'+
   '<div class="pd-ctl"><button class="chip" id="ht">They trust each other to commit</button><button class="chip" id="hd">Each doubts the other</button></div><div id="hf"></div>');
  const b=pdBoard(L,L.$('#hb'),{ra:['Commit|fully','Hedge'],pay:PD_STAG,arrows:true});b.ridge();b.ro('Commit pays only if the other commits. Hedging pays 3 either way.');
  const seen=new Set();
  const go=(k,cell,txt)=>{L.$$('#ht,#hd').forEach(x=>x.classList.toggle('sel',x.id===k));b.ridge();setTimeout(()=>{if(!b.wrap.isConnected)return;b.settle(cell,true);b.ro(txt);},60);seen.add(k);
    if(seen.size===2){L.$('#hf').innerHTML='<div class="pd-cap" style="border-left-color:var(--ok-strong)"><b>The book’s case: the early bird</b>On Daphne Major, a few cactus finches pry blossoms open early and ruin the flowers. While rare, the habit dies out; once common, waiting no longer saves anyone’s cactus, so all do it.</div>';
      L.sheet('info','Trust is enough','No rules or punishment needed: if each trusts the other, both commit and both do well. The book calls the '+L.g('stag-hunt','stag hunt')+' a confidence game: a cousin of the dilemma, not the same game. Go for the stag when you’re confident the others will.');L.done();}};
  L.$('#ht').onclick=()=>go('ht',[0,0],'Trust: both commit, <b>5 and 5</b>. Nobody wants to leave.');
  L.$('#hd').onclick=()=>go('hd',[1,1],'Doubt: both hedge, <b>3 and 3</b>. Also stable, and worse.');}},

{part:3,src:'Chapter 3 · Case Study: The Early Bird Kills the Golden Goose',pts:6,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Dilemma, stag hunt, or neither?',['Prisoners’ dilemma','Stag hunt: trust is enough','Not a dilemma'],[
   ['Tali and Linus each stay later every night before the promotion. Both are worn out and neither is ahead.',0,'Staying late wins for each whatever the other does, and both staying is worse for both. A dilemma.'],
   ['Tali and Arlo plan a surprise for Hedda. It works only if both keep the secret and both turn up; neither gains anything by skipping if the other comes.',1,'No temptation to cheat on someone you trust: if both commit, both do well. A stag hunt.'],
   ['Five-a-side players stop paying into the kitty, hoping the others will cover the pitch fees.',0,'Free riding: keeping your money wins whatever the others do, and an empty kitty hurts all. A many-player dilemma.'],
   ['Tali and Juno both want to eat at the same new restaurant tonight. They just need to agree on a time.',2,'They want the same thing, so there’s nothing to grab. That’s coordination (lesson 5), not a dilemma.'],
   ['Plover and Kittiwake keep cutting day rates to win local clients; both now win work at thin margins.',0,'Cutting wins for each whatever the other does, and both cutting hurts both. A dilemma, and one that clients benefit from.'],
   ['The two agencies could win a giant contract only by bidding jointly as partners; each would happily stay in if sure the other will.',1,'Committing pays only if the other commits too, and nobody is tempted to leave a trusted partner. A stag hunt.']]);}},

{part:3,src:'Course application · built on Chapter 3',
 solve:async L=>{L.$('#y1').value='my flatmate';L.$('#y2').value='skip the bathroom clean';L.$('#y3').value='clean it this week';['#y1','#y2','#y3'].forEach(s=>L.$(s).dispatchEvent(new Event('input',{bubbles:true})));
   L.$$('.pd-yn').forEach(r=>r.querySelectorAll('.chip')[0].click());L.$('#yb').click();await L.sleep(1400);},
 run(L){
  L.h(L.kick('pr','Your turn · ungraded')+'<h1 class="q">One tug-of-war in your week where you and someone else are both tempted to grab, slack or undercut. Spot it.</h1>'+
   L.note('How this course applies the book: the “Spot” move on your own situation.','compass')+
   '<label class="pd-fl" for="y1">Who’s the other side?</label><input class="pd-in" id="y1" maxlength="30" placeholder="e.g. my flatmate, a colleague, my sibling">'+
   '<label class="pd-fl" for="y2">The grab (what you’re each tempted to do)</label><input class="pd-in" id="y2" maxlength="40" placeholder="e.g. leave the shared fridge to them">'+
   '<label class="pd-fl" for="y3">The hold-back</label><input class="pd-in" id="y3" maxlength="40" placeholder="e.g. do my share this week">'+
   '<div class="pd-yn"><span>Is grabbing better for me, whatever they do?</span><button class="chip">Yes</button><button class="chip">No</button></div>'+
   '<div class="pd-yn"><span>Is it better for them too, whatever I do?</span><button class="chip">Yes</button><button class="chip">No</button></div>'+
   '<div class="pd-yn"><span>If we both grab, are we both worse off than if both held back?</span><button class="chip">Yes</button><button class="chip">No</button></div>'+
   '<div class="pd-ctl"><button class="btn pri" id="yb" disabled>'+L.ic('pencil')+'Draw my four boxes</button></div><div id="yo"></div>');
  const ans=[null,null,null];
  L.$$('.pd-yn').forEach((r,q)=>r.querySelectorAll('.chip').forEach((c,j)=>c.onclick=()=>{ans[q]=j===0;r.querySelectorAll('.chip').forEach(x=>x.classList.toggle('sel',x===c));chk();}));
  const v=s=>L.$(s).value.trim();
  function chk(){L.$('#yb').disabled=!(v('#y1').length>1&&v('#y2').length>1&&v('#y3').length>1&&ans.every(a=>a!==null));}
  ['#y1','#y2','#y3'].forEach(s=>L.$(s).addEventListener('input',chk));
  L.$('#yb').onclick=async()=>{const side=(dom,worse)=>({T:dom?4:2,R:3,S:1,P:worse?2:3.5});const a=side(ans[0],ans[2]),o=side(ans[1],ans[2]);
    const pay=[[[a.R,o.R],[a.S,o.T]],[[a.T,o.S],[a.P,o.P]]];
    const cut=s=>s.length>18?s.slice(0,17)+'…':s;
    L.$('#yo').innerHTML='';const b=pdBoard(L,L.$('#yo'),{a:'you',b:cut(v('#y1')),ra:[pdWrap(v('#y3')),pdWrap(v('#y2'))],ca:['Hold back','Grab'],rn:[v('#y3'),v('#y2')],pay,arrows:true,hide:true,checks:true});
    await b.roll([0,0]);if(!b.wrap.isConnected)return;const k=b.check().kind;
    L.sheet('info',k==='pd'?'A dilemma: don’t count on magic':k==='stag'?'Maybe a stag hunt':'Not a dilemma, by your answers',
      (k==='pd'?'Safe first move: re-check one box. If you trusted them to hold back, would you still grab? If not, it’s a stag hunt: say you’re in and keep your word. If yes, lesson 4 has the way out: repeat it, make it visible, agree one rule, start nice, forgive quickly.':
       k==='stag'?'If you can be confident they’ll do their part, do yours: trust may be all this needs. Be someone they can count on.':
       'Check whether you simply want the same thing (find a focal point, lesson 5), or whether it’s a game at all.')+' Note the date: next week, check what happened.');L.done();};}},

{part:3,src:'Course application · built on Chapter 3',run(L){
  L.h(L.kick('learn','Your strategy map')+'<h1 class="q">“Spot and escape a prisoners’ dilemma” joins three rows of the map</h1>'+
   L.note('How this course applies the book. Dashed tools arrive in later lessons; lesson 4 completes this one with “escape”.','compass')+
   '<div class="pd-map" style="border-style:dashed"><b>Row zero: is it a game at all?</b><div class="r"><span class="m">Lumberjack or general? Will they react?</span></div></div><div id="dm"></div>'+
   '<p class="small">It’s the <b>first</b> tool when everyone’s tempted to grab and everyone loses. When you both choose at once, it comes second; when competing for one prize, third (a costly race of who lasts longest).</p>');
  L.$('#dm').innerHTML=PD_MAP.map(r=>'<div class="pd-map'+(r[1][0]==='pd'?' hot':'')+'"><b>'+r[0]+(r[1][0]==='pd'?' · start here':'')+'</b><div class="r">'+
    r[1].map((k,j)=>{const t=PD_T[k];return (j?'<span class="ar">→</span>':'')+'<span class="m'+(k==='pd'?' cur':t[1]>3?' tbd':'')+'">'+(t[1]>3?'Lesson '+t[1]:t[0])+'</span>';}).join('')+'</div></div>').join('');
  L.done();}}
  ]
});
</script>
