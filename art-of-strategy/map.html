<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your strategy map</title>
<meta name="description" content="A quick daily reference: which game you are in, which strategy tool to reach for, how to run it in about a minute, and what to do when the game goes wrong.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
<style>
/* Page-only styles. Colours come only from course.css variables, so light and dark mode follow it. */
body{padding-bottom:56px}
.sm{max-width:680px;margin:0 auto;padding:20px 16px 0}
.sm a{color:var(--pri)}
.back{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;text-decoration:none;min-height:40px}
.back svg.i{width:18px;height:18px}
.sm h1{font-size:30px;line-height:1.15;letter-spacing:-.02em;margin:6px 0 6px}
.lead{font-size:15px;line-height:1.5;color:var(--muted);margin:0 0 14px}
.applied{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--h3);background:var(--h3-bg);border-radius:99px;padding:4px 10px;margin:0 0 10px}
.applied svg.i{width:14px;height:14px}
.frombook{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--h2);background:var(--h2-bg);border-radius:99px;padding:3px 9px}
.frombook svg.i{width:13px;height:13px}

/* tool colours: one per tool, built from the course palette */
.t-ahead{--tc:var(--h2)}
.t-dilemma{--tc:var(--no-strong)}
.t-shoes{--tc:var(--h1)}
.t-mix{--tc:var(--h4)}
.t-moves{--tc:var(--h3)}
.t-credible{--tc:color-mix(in srgb,var(--h1) 50%,var(--h4))}
.t-signals{--tc:color-mix(in srgb,var(--h2) 45%,var(--h1))}
.t-group{--tc:var(--ok-strong)}
.t-bid{--tc:color-mix(in srgb,var(--no-strong) 45%,var(--h1))}
.t-batna{--tc:color-mix(in srgb,var(--ok) 45%,var(--h3))}
.t-vote{--tc:color-mix(in srgb,var(--h3) 45%,var(--h4))}
.t-incent{--tc:color-mix(in srgb,var(--ok) 50%,var(--h1))}
.t-zero{--tc:var(--faint)}
[class*="t-"]{--tb:color-mix(in srgb,var(--tc) 14%,var(--card))}

/* the one-minute strategic check: a stopwatch */
.check{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:14px 14px 12px;margin:0 0 14px}
.check h2{font-size:16px;margin:0 0 10px}
.watch{display:grid;grid-template-columns:104px 1fr;gap:12px;align-items:center}
.watch svg.dial{width:104px;height:104px;display:block}
.lgd{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.lgd li{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start;font-size:13px;line-height:1.3}
.lgd .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:700;color:var(--card)}
.lgd b{display:block;font-size:13.5px}
.lgd span.s{color:var(--muted);font-size:12px}
.k1{background:var(--h1)}.k2{background:var(--h2)}.k3{background:var(--h3)}.k4{background:var(--h4)}
.sizes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.size{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;line-height:1.4;color:var(--muted);background:var(--soft);border-radius:12px;padding:8px 10px}
.size b{color:var(--ink)}
.size svg.i{flex:none;margin-top:1px;width:18px;height:18px}

/* fair beats clever */
.fair{background:var(--ok-bg);border-radius:20px;padding:12px 12px 10px;margin:4px 0 18px}
.fair h2{font-size:15px;margin:0 0 2px;display:flex;align-items:center;gap:8px;color:var(--ok)}
.fair h2 svg.i{color:var(--ok-strong)}
.fair .sub3{font-size:12.5px;color:var(--muted);margin:0 0 8px;line-height:1.4}
.fairs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.fairs div{background:var(--card);border-radius:12px;padding:8px 9px;font-size:12.5px;line-height:1.35;color:var(--muted)}
.fairs b{display:block;color:var(--ink);font-size:13px;margin-bottom:1px}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--soft2);border-radius:16px;padding:5px;margin:0 0 16px;position:sticky;top:8px;z-index:5;box-shadow:0 0 0 6px var(--bg)}
.tab{border:0;background:transparent;border-radius:12px;padding:8px 4px;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12.5px;font-weight:600;color:var(--muted);line-height:1.2}
.tab[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.tab[aria-selected="true"] svg.i{color:var(--pri)}
.panel h2{font-size:21px;margin:0 0 4px;letter-spacing:-.01em}
.panel .sub2{font-size:14px;color:var(--muted);margin:0 0 12px;line-height:1.45}

/* which game: the move trail and the question card */
.board{background-color:var(--card);background-image:radial-gradient(var(--line) 1.2px,transparent 1.3px);background-size:16px 16px;border-radius:20px;box-shadow:var(--shadow);padding:14px 12px;margin:0 0 14px}
.trail{list-style:none;margin:0 0 4px;padding:0}
.trail li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;position:relative;padding:0 0 10px}
.trail li::before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--line2)}
.trail:last-child li:last-child::before{display:none}
.trail .td{width:28px;height:28px;border-radius:50%;background:var(--pri);color:var(--pri-ink);display:grid;place-items:center;z-index:1}
.trail .td svg.i{width:16px;height:16px}
.trail .tq{font-size:12px;color:var(--muted);line-height:1.3;min-width:0}
.trail .tq b{display:block;font-size:14px;color:var(--ink)}
.chg{border:2px solid var(--line);background:var(--card);border-radius:10px;font-size:12.5px;font-weight:600;padding:4px 10px;min-height:36px;color:var(--pri)}
.qcard{position:relative}
.qcard .mv{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--pri);display:flex;align-items:center;gap:8px;margin:0 0 4px}
.qcard .mv i{flex:1;height:0;border-top:2px dashed var(--line2)}
.qcard h3{font-size:18px;line-height:1.3;margin:0 0 10px;outline:none}
.qopts{display:grid;grid-template-columns:1fr;gap:8px}
.qopts.two{grid-template-columns:1fr 1fr}
.qopts.two .qo{grid-template-columns:1fr;align-content:start;gap:6px;padding:10px}
.qo{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center;text-align:left;background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:8px 10px;min-height:56px;transition:border-color .15s,background .15s,transform .08s}
.qo:hover{border-color:var(--line2)}
.qo:active{transform:translateY(2px)}
.qo .gi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--tb,var(--pri-bg));color:var(--tc,var(--pri))}
.qo .gi svg.i{width:22px;height:22px}
.qo b{font-size:14.5px;line-height:1.25;display:block}
.qo small{font-size:12px;color:var(--muted);line-height:1.3;display:block;margin-top:1px}
.skip{display:flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--pri);font-weight:600;font-size:13.5px;padding:8px 0;min-height:40px}
.skip svg.i{width:16px;height:16px;transition:transform .2s}
.skip[aria-expanded="true"] svg.i{transform:rotate(90deg)}
.rowlist{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 14px}
.rowlist[hidden]{display:none}
.rowlist button{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:6px 10px 6px 7px;font-size:13px;font-weight:500;min-height:40px;text-align:left}
.rowlist button .sw{width:22px;height:22px;border-radius:7px;background:var(--tc);color:var(--card);display:grid;place-items:center;flex:none}
.rowlist button .sw svg.i{width:14px;height:14px}
.rowlist button[aria-pressed="true"]{border-color:var(--pri);background:var(--pri-bg)}

/* result: the game and its tools */
.result{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:16px 14px;margin:0 0 18px;scroll-margin-top:84px}
.result:empty{display:none}
.result .kk{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.result h3{font-size:19px;line-height:1.3;margin:2px 0 4px}
.result .signs{font-size:13.5px;color:var(--muted);margin:0 0 10px;line-height:1.4}
.gamehead{display:grid;grid-template-columns:1fr;gap:10px;align-items:center;background:var(--tb);border-radius:16px;padding:10px 12px;margin:0 0 14px}
.gamehead .pic{margin:0 auto;max-width:260px}
.kinds{display:flex;flex-wrap:wrap;gap:6px}
.kind{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;background:var(--card);border-radius:99px;padding:4px 10px 4px 7px;color:var(--ink)}
.kind svg.i{width:16px;height:16px;color:var(--tc)}
.pic{display:block;width:100%;height:auto}
.cap{font-size:12px;color:var(--muted);margin:2px 0 0;line-height:1.35;text-align:center}
.path{list-style:none;margin:0;padding:0}
.node{display:grid;grid-template-columns:40px 1fr;gap:0 12px}
.node .rail{display:flex;flex-direction:column;align-items:center}
.node .dot{width:40px;height:40px;border-radius:50%;background:var(--tc);color:var(--card);display:grid;place-items:center;flex:none;font-weight:700;font-size:15px;position:relative}
.node .dot svg.i{width:20px;height:20px;stroke-width:2}
.node .dot em{position:absolute;right:-4px;bottom:-4px;width:18px;height:18px;border-radius:50%;background:var(--card);color:var(--tc);font-style:normal;font-size:11px;display:grid;place-items:center;box-shadow:0 0 0 2px var(--tc)}
.node .line{flex:1;width:0;border-left:3px dotted color-mix(in srgb,var(--tc) 60%,var(--line));margin:4px 0;min-height:14px}
.node .body{padding:0 0 14px;min-width:0}
.node .tag{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--tc)}
.node .name{font-size:16px;font-weight:700;margin:1px 0 2px;line-height:1.3}
.node .focus{font-size:13.5px;color:var(--muted);line-height:1.4;margin:0 0 4px}
.node.first .body{background:var(--tb);border-radius:16px;padding:10px 12px 10px;margin-bottom:14px}
.divider{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--muted);margin:0 0 12px}
.divider::before,.divider::after{content:"";flex:1;height:0;border-top:2px dashed var(--line2)}
.steps{list-style:none;margin:6px 0 4px;padding:0;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:24px 1fr;gap:8px;font-size:14px;line-height:1.4;margin:0 0 6px}
.steps li::before{content:counter(s);width:24px;height:24px;border-radius:50%;background:var(--tc,var(--pri));color:var(--card);font-size:12.5px;font-weight:700;display:grid;place-items:center}
.more{border:0;background:transparent;color:var(--pri);font-weight:600;font-size:13.5px;padding:6px 0;min-height:36px;display:inline-flex;align-items:center;gap:4px;text-align:left}
.more svg.i{width:16px;height:16px;transition:transform .2s}
.more[aria-expanded="true"] svg.i{transform:rotate(90deg)}
.lk{display:inline-block;font-size:13.5px;font-weight:600;text-decoration:none;padding:6px 0;line-height:1.4}
.lk svg.i{width:16px;height:16px;vertical-align:-3px;margin-left:4px}
.toolbtn{border:0;background:transparent;color:var(--pri);font-weight:600;font-size:13.5px;padding:6px 0;min-height:36px;display:inline-flex;align-items:center;gap:4px;margin-right:12px}
.toolbtn svg.i{width:16px;height:16px}
.adds{border-top:2px dashed var(--line2);padding-top:12px;margin-top:2px}
.adds h4{font-size:13px;margin:0 0 8px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.add{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:start;background:var(--soft);border-radius:12px;padding:8px 10px;margin:0 0 6px;font-size:13.5px;line-height:1.4}
.add .ai{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--tc,var(--pri));color:var(--card)}
.add .ai svg.i{width:18px;height:18px}
.add b{display:block;font-size:14px}
.tali{display:flex;gap:8px;font-size:13px;color:var(--muted);line-height:1.4;margin:10px 0 0}
.tali svg.i{width:16px;height:16px;margin-top:1px}
.larger{display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:center;background:var(--h4-bg);border-radius:14px;padding:10px 12px;margin:12px 0 0;font-size:13.5px;line-height:1.4}
.larger .li{width:36px;height:36px;border-radius:50%;background:var(--h4);color:var(--card);display:grid;place-items:center}
.larger b{display:block;font-size:14px}
.again{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--card);border-radius:12px;font-weight:600;font-size:13.5px;padding:6px 12px;min-height:40px;margin-top:12px}
.again svg.i{width:16px;height:16px}

/* it's going wrong */
.stuckgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 16px}
.so{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:10px 10px 9px;min-height:84px;transition:border-color .15s,background .15s}
.so:hover{border-color:var(--line2)}
.so b{font-size:13.5px;line-height:1.25}
.so .oi{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--no-bg);color:var(--no-strong)}
.so .oi svg.i{width:17px;height:17px}
.so[aria-pressed="true"]{border-color:var(--no-strong);background:var(--no-bg)}
.so[aria-pressed="true"] .oi{background:var(--no-strong);color:var(--card)}
.unflow{display:flex;flex-direction:column;align-items:stretch}
.box{border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center}
.box .bi{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none}
.box b{font-size:15px;line-height:1.3}
.box small{display:block;font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.box.stuck{background:var(--no-bg)}
.box.stuck .bi{background:var(--no-strong);color:var(--card)}
.down{display:flex;justify-content:center;color:var(--faint);padding:3px 0}
.down svg.i{width:22px;height:22px}
.lbl{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 6px}
.chain{display:flex;flex-direction:column;gap:6px}
.tchip{display:grid;grid-template-columns:40px 1fr 20px;gap:10px;align-items:center;border:0;background:var(--tb);border-radius:14px;padding:8px 10px;text-align:left;width:100%;min-height:56px}
.tchip .bi{width:40px;height:40px;border-radius:50%;background:var(--tc);color:var(--card);display:grid;place-items:center}
.tchip .bi svg.i{width:20px;height:20px}
.tchip b{font-size:14.5px;display:block;line-height:1.3}
.tchip span.w{font-size:12px;color:var(--muted);display:block;line-height:1.3;font-weight:600}
.tchip .gx{color:var(--muted)}
.box.nxt{background:var(--ok-bg);flex-direction:column;align-items:stretch}
.box.nxt .hd{display:flex;gap:10px;align-items:center}
.box.nxt .bi{background:var(--ok-strong);color:var(--card)}
.box.nxt .steps li::before{background:var(--ok-strong)}
.box.swap{background:var(--h3-bg);align-items:flex-start;margin-top:10px}
.box.swap .bi{background:var(--h3);color:var(--card)}
.box.swap p{margin:2px 0 0;font-size:13.5px;line-height:1.4}
.basis{font-size:12.5px;color:var(--muted);line-height:1.45;margin:10px 0 0}
.basis b{color:var(--ink);font-weight:600}
.cg{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:16px 14px;margin:0 0 18px;border:2px solid transparent;scroll-margin-top:84px}
.cg.hl{border-color:var(--h3)}
.cg h3{font-size:17px;margin:2px 0 4px}
.cg .sub3{font-size:13px;color:var(--muted);line-height:1.4;margin:0 0 10px}
.ways{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.way{background:var(--soft);border-radius:14px;padding:10px;font-size:12.5px;line-height:1.35;color:var(--muted)}
.way .wi{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--h3-bg);color:var(--h3);margin-bottom:6px}
.way .wi svg.i{width:18px;height:18px}
.way b{display:block;color:var(--ink);font-size:13.5px;margin-bottom:2px;line-height:1.25}
.way.wide{grid-column:1/-1}
.way.no{grid-column:1/-1;background:var(--no-bg);display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center}
.way.no .wi{background:var(--no-strong);color:var(--card);margin:0}

/* the tools */
.grp{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:4px 0 8px;display:flex;align-items:center;gap:8px}
.grp::after{content:"";flex:1;border-top:2px dashed var(--line2)}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 14px}
.tt{display:flex;flex-direction:column;align-items:stretch;gap:6px;background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:8px 8px 9px;text-align:left;min-height:120px}
.tt:hover{border-color:var(--line2)}
.tt .pic{background:var(--tb);border-radius:10px}
.tt .pic .lb{display:none}
.tt .nm{display:grid;grid-template-columns:22px 1fr;gap:6px;align-items:start;font-size:13px;font-weight:600;line-height:1.25}
.tt .nm i{width:22px;height:22px;border-radius:50%;background:var(--tc);color:var(--card);font-style:normal;font-size:11.5px;font-weight:700;display:grid;place-items:center}
.tt[aria-pressed="true"]{border-color:var(--tc);background:var(--tb)}
.detail-head{display:flex;gap:12px;align-items:center}
.detail-head .dot{width:44px;height:44px;border-radius:50%;background:var(--tc);color:var(--card);display:grid;place-items:center;flex:none}
.detail-head .dot svg.i{width:22px;height:22px}
.detail-head h3{margin:0}
.detail .picwrap{background:var(--tb);border-radius:16px;padding:8px 10px 8px;margin:12px 0 4px}
.detail .picwrap .pic{max-width:300px;margin:0 auto}
.sec{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:16px 0 8px;flex-wrap:wrap}
.sec .applied,.sec .frombook{text-transform:none;letter-spacing:0;margin:0}
.sec svg.i{width:18px;height:18px}
.trig{display:flex;flex-direction:column;gap:6px}
.trig div{display:flex;gap:8px;align-items:flex-start;font-size:14px;line-height:1.4}
.trig svg.i{width:16px;height:16px;color:var(--tc);margin-top:2px}
.lims{display:flex;flex-direction:column;gap:6px}
.lims div{display:flex;gap:8px;align-items:flex-start;font-size:14px;line-height:1.4;background:var(--soft);border-radius:12px;padding:8px 10px}
.lims svg.i{width:16px;height:16px;color:var(--no-strong);margin-top:2px}
.coop{display:flex;gap:8px;align-items:flex-start;font-size:14px;line-height:1.4;background:var(--ok-bg);border-radius:12px;padding:8px 10px}
.coop svg.i{width:16px;height:16px;color:var(--ok-strong);margin-top:2px}
.rule{display:inline-block;font-size:12px;font-weight:700;color:var(--tc);background:var(--card);border:1.5px solid var(--tc);border-radius:99px;padding:2px 8px;margin:0 0 6px}
.uses{display:flex;flex-wrap:wrap;gap:6px}
.uses button{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:500;min-height:38px;text-align:left}
.lessons{display:flex;flex-direction:column}
blockquote.q2{margin:10px 0 0;padding:10px 12px;background:var(--soft);border-radius:12px;font-family:var(--serif);font-size:16px;line-height:1.4;font-style:italic}
blockquote.q2 cite{display:block;font-style:normal;font-family:var(--sans);font-size:12px;color:var(--muted);margin-top:4px}
.foot{font-size:12.5px;color:var(--muted);line-height:1.5;border-top:1px solid var(--line);padding-top:14px;margin-top:8px}
@media (min-width:560px){
  .qopts.wide{grid-template-columns:1fr 1fr}
  .stuckgrid{grid-template-columns:repeat(3,1fr)}
  .tgrid{grid-template-columns:repeat(3,1fr)}
  .ways{grid-template-columns:repeat(3,1fr)}
  .fairs{grid-template-columns:repeat(4,1fr)}
  .tab{flex-direction:row;font-size:14px;gap:6px}
  .gamehead{grid-template-columns:1.2fr 1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

<script>
(function(){
'use strict';
const ic=Course.icon;
const C=Course.all[Course.all.length-1];
const lessonOf=id=>{const j=C.lessons.findIndex(l=>l.id===id);return {n:j+1,file:C.lessons[j].file,title:C.lessons[j].title};};
const APPLIED='<span class="applied">'+ic('compass')+'How this course applies the book</span>';
const BOOK='<span class="frombook">'+ic('book')+'From the book</span>';

/* ---------- small glyphs for the kinds of game (24 × 24, drawn like the engine icons) ---------- */
const GL={
 tree:'<circle cx="4.5" cy="12" r="2"/><path d="M6.5 12h3l4.5-6h4M9.5 12l4.5 6h4"/><circle cx="20" cy="6" r="1.6"/><circle cx="20" cy="18" r="1.6"/>',

 loop:'<path d="M4.5 12a7.5 7.5 0 0 1 13-5.1"/><path d="M18 3v4.2h-4.2"/><path d="M19.5 12a7.5 7.5 0 0 1-13 5.1"/><path d="M6 21v-4.2h4.2"/>',

 seen:'<path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z"/><circle cx="12" cy="12" r="2.5"/><path d="M15 4l2-2M9 4 7 2"/>',
 blind:'<path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z"/><path d="M4 4l16 16"/>'
};
const gl=k=>'<svg class="i" viewBox="0 0 24 24" aria-hidden="true">'+GL[k]+'</svg>';
const icx=k=>GL[k]?gl(k):ic(k);

/* ---------- the twelve tools (names, triggers, moves and limits from CANON.md "Tool names and one-minute moves") ---------- */
const T={
 ahead:{n:'Look ahead and reason back',ic:'tree',l:['0002'],rule:'Rule 1: look forward and reason backward',
  alt:'A game tree: the last branches are crossed out first, and an arrow runs back to the first fork.',
  trig:['People take turns: you act, then they respond','An offer, a loan, paying before the work is done, a deadline','You’re asking “if I do this, what will they do next?”'],
  move:['Draw the turns: who moves, in what order.','Jump to the last move: what will that person really do, given <i>their</i> aims?','Cross out the branches they won’t take; step back one move and repeat.','Pick your first move from what’s left.'],
  lim:['It only works fully with no chance, known aims and moves you can see.','People care about fairness and pride: a “rational” lowball offer can be rejected.','Long games can’t be drawn in full: look a few moves ahead, then judge from experience.','Predict what <i>they</i> will do, not what you would do in their shoes.'],
  coop:'In the ultimatum game, most people offer 40–50% and very low offers get turned down: build fairness into your prediction.'},
 dilemma:{n:'Spot and escape a prisoners’ dilemma',ic:'lock',l:['0003','0004'],rule:'Rule 2: if you have a dominant strategy, use it',
  alt:'Two people and four boxes: both arrows slide to the corner where both lose.',
  trig:['Each of you is tempted to grab, cut, slack or stay late, whatever the other does','If you both do, you both end up worse off','Price cuts, chores, overtime races, a shared kitty, a shared space'],
  move:['Spot it: is grabbing better for each of you whatever the other does, yet both grabbing worse for both?','Make it repeated and visible, so cheating gets noticed.','Agree one clear rule and a fitting, certain response.','Start nice, respond to defection, forgive quickly. Or change the payoffs (a reward, a contract, a third party).'],
  lim:['One mistake makes tit for tat echo forever: build in forgiveness.','Cooperation tends to break down near a known last round.','Not every dilemma should be escaped: firms that “cooperate” on prices hurt customers, and it’s illegal.','“If I cooperate, they will” is magical thinking: your choice can’t change theirs.'],
  coop:'In a stag hunt, trust alone is enough: if everyone commits, everyone does well. Tit for tat wins by being nice and forgiving.'},
 shoes:{n:'Put yourself in their shoes',ic:'eye',l:['0005'],rule:'Rules 2–4: dominant first, cross out, then mutual best replies',
  alt:'Two thought bubbles feed into a table, and one box lights up because both arrows point to it.',
  trig:['You both choose without seeing the other’s choice','Prices, plans, a time to call back, where to meet','Your best choice depends on what they’ll do'],
  move:['List your options and theirs.','One choice best whatever they do? Use it. Cross out what no one would sensibly pick.','Mark each side’s best reply; a box marked for both is an equilibrium.','Several? Go for the focal point you both expect the other to see.'],
  lim:['It needs correct beliefs about each other; most people reason only two or three steps deep.','A game can have several equilibria, and theory alone won’t pick one.','An equilibrium can be bad for both (a dilemma).','Newcomers don’t reach it at first; experience helps.'],
  coop:'Fairness is a focal point: an equal split is what people expect each other to pick. When you each prefer a different option, take turns or toss a coin.'},
 mix:{n:'Mix your moves',ic:'target',l:['0006'],rule:'Rule 5: in pure conflict, mix in the right proportions',
  alt:'A goal split left and right, with a spinner set to the right proportions.',
  trig:['Pure conflict, and any pattern you show gets exploited','Where to kick, when to check, when to bluff','Test: would it hurt if they knew your choice in advance?'],
  move:['Ask the test question; if the answer is no, don’t mix.','Pick proportions that leave them no better option.','Let an outside device decide (a coin, a watch’s second hand); never just alternate.','Checking others: a big enough penalty plus occasional random checks.'],
  lim:['Only for pure conflict or checking: in coordination games, mixing causes mismatches.','People switch too often and mix badly.','In a one-off situation there’s no pattern to hide.','A bad result can follow the best mix: judge the policy, not one outcome.'],
  coop:'When you both want to land together (where to meet, which holiday), don’t mix: agree, or use one shared signal.'},
 moves:{n:'Commit, threaten or promise',ic:'arrow',l:['0007'],
  alt:'A path that forks with one branch cut away, and an “if → then” signpost.',
  trig:['Playing the current game well isn’t enough','You want to change what others expect you to do','Stopping someone, or getting something done by a date, or a resolution with your future self'],
  move:['What will they do if I change nothing?','Choose: commit (fix my own action), threaten (punish the wrong move) or promise (reward the right one).','Stopping something? Deter. Getting it done? Compel, with a deadline and a reward for acting early.','Check it’s not just a warning I’d carry out anyway; make it clear, certain and the smallest size that works.'],
  lim:['Worthless unless believed.','Risky: you may have to carry it out, or crash.','Threats too large to use aren’t believed.','A promise costs you when it works; a threat costs you when it fails.'],
  coop:'A promise can help both sides. Never let others put you where they can threaten you, and keep your own threats small.'},
 credible:{n:'Make it credible',ic:'shield',l:['0008'],
  alt:'At the fork where you must follow through, the back-down road has a bridge you can burn.',
  trig:['You’ve said what you’ll do, but when the moment comes you might prefer not to','They know it (“or else what?”)','Someone else’s threat or promise seems shaky'],
  move:['Ask: would I really follow through? Why would they believe it?','Change your payoffs: a written agreement, or your reputation on the line.','Or limit your way out: small steps, a burnt bridge, a partner or agent who holds you to it.','Against their move: renegotiate, take small steps, leave them a face-saving way out.'],
  lim:['Contracts can be renegotiated when both sides prefer it.','Reputation only matters if the game continues.','Burnt bridges hurt if you were wrong.','Brinkmanship creates a real risk you fall too: only where stakes are low.'],
  coop:'Keeping your word in an ongoing relationship builds the reputation that makes every later promise believable.'},
 signals:{n:'Read and send signals',ic:'info',l:['0009'],
  alt:'One person wears a costly badge the other type couldn’t afford; two doors sort people by what they pick.',
  trig:['One side knows something the other doesn’t','A used car, a job candidate, a tenant, a deal that looks too good','Someone says “trust me”'],
  move:['What do they know that I don’t, and what do they gain from what they tell me?','Watch actions, not words: only actions too costly for the wrong type count.','To find out: offer a test or a menu that makes types choose differently.','To show: pick a signal cheap for you, costly for others. Notice what they didn’t do.'],
  lim:['Signals can become a race everyone pays for.','The strong may countersignal by not signalling at all.','When everyone does it (cleans the car), it tells you nothing.','Screens have a cost too.'],
  coop:'Honest signals help both sides: a warranty lets a good seller show it and a buyer trust it.'},
 group:{n:'Coordinate the group',ic:'people',l:['0010','0005'],
  alt:'A crowd split between two roads, beside a tipping curve where the group slides to one side.',
  trig:['Everyone waits for someone else to start','Everyone stays late because everyone does','The group is stuck on an old standard'],
  move:['Does each person’s choice affect the others, with no one paying for it?','Is it a race for position, or several stable outcomes with a tipping point between?','Name a focal point, get a few to move first, or ask an outsider to set the rule.','Voting in small steps? Agree the end point before step one.'],
  lim:['One person usually can’t change a convention alone.','History and luck can lock in a worse standard.','Rules or prices can cost more than they save.','A group can slide step by step to an outcome it would reject as a whole.'],
  coop:'An outside rule everyone keeps (“we all leave at six”) can end a rat race that nobody wins.'},
 bid:{n:'Bid smart',ic:'pointer',l:['0011'],
  alt:'Bidders under a rising price; each one sits down at their own walkaway line.',
  trig:['You’re competing with others for one prize or contract','An auction, a tender, offers on a flat or a car','A race to launch, or a contest of who lasts longest'],
  move:['Decide whether to enter at all, and set your walkaway value before you start.','Rising auction or a proxy bid: go up to your value, then stop.','Sealed bid you pay: bid below your value, as if you’ve already won.','A war of attrition: look for a deal instead of bleeding.'],
  lim:['Rules change and bidders adapt.','When the value is the same for everyone, winning is bad news unless you adjust (the winner’s curse).','Escalating games, like the dollar auction, are best not started.'],
  coop:'In a war of attrition both sides bleed: the best move is a deal. Look for the larger game you’re both in.'},
 batna:{n:'Bargain from your BATNA',ic:'scale',l:['0012'],
  alt:'A pie: each side’s BATNA slice is set aside first, and only the middle, the real pie, is split; a clock shrinks it.',
  trig:['You’re splitting money or terms with someone','Pay, rent, a price, shared costs','Who does what'],
  move:['Work out your BATNA (your best option with no deal), and estimate theirs.','Measure the real pie: the deal’s value minus both BATNAs.','Who loses more from waiting? Improve your BATNA before you show it.','Trade across issues; start from an even split of the real pie.'],
  lim:['Pride and fairness matter: lowball offers get rejected.','Strikes and walkouts hurt both sides and bystanders.','Linking issues can also create threats.','Brinkmanship in bargaining risks a real breakdown.'],
  coop:'An even split of the real pie is a fair focal point. The book’s taxi story: pride can beat money.'},
 vote:{n:'Vote and set the agenda',ic:'list',l:['0013'],
  alt:'Three options with arrows going round in a circle: each beats one and loses to another.',
  trig:['A group decides together: family, team, club','Three or more options','Someone controls the order of the questions'],
  move:['Two options: vote your true preference.','Three or more: ask everyone to rank them; look for one that beats every other head to head.','Watch the order: whoever sets the agenda can set the result.','On a single scale (how much, how late), take the median choice.'],
  lim:['Majorities can go round in a circle with no clear winner.','Every system can invite strategic voting.','The median trick only works on a single line.','Your vote only changes the outcome when it breaks a tie.'],
  coop:'The median choice removes everyone’s reason to exaggerate; approval voting lets people tick every option they can live with.'},
 incent:{n:'Design incentives',ic:'star',l:['0014'],
  alt:'A pay line, a base plus a bonus that rises with the result, beside a frosted window that hides the effort.',
  trig:['Someone works for you and you can’t watch their effort','A builder, a hired helper, a teammate, a cleaner','You only see the result'],
  move:['Name what you can see: results, not effort.','Pay enough that they take the job; tie part of it to results; avoid all-or-nothing targets.','Several tasks? Don’t pay only for the easy-to-measure one.','Ongoing work: pay a bit above their alternative. Where people already care, money can crowd out goodwill.'],
  lim:['Results are a noisy sign of effort: luck shifts them.','Strong pay-for-results loads risk on the worker.','Quotas backfire when hopeless or already met.','A small payment can be worse than none.'],
  coop:'Paying a bit above the going rate makes a good working relationship worth keeping for both sides.'}
};

 '</section>';
}

/* ---------- which game: board and result ---------- */
function ansLabel(q,v){return Q[q].o.find(o=>o.v===v).b;}
function renderBoard(focus){
 const b=document.getElementById('board');
 const done=ASKED.filter(q=>st[q]);
 let h='';
 if(st.direct){
  h+='<ol class="trail"><li><span class="td">'+ic('pointer')+'</span><span class="tq">Picked directly<b>'+rowOf(st.direct).lab+'</b></span><button type="button" class="chg" data-restart="1">Ask me instead</button></li></ol>';
 }else if(done.length){
  h+='<ol class="trail">'+done.map((q,i)=>'<li><span class="td">'+icx(ANS_ICON[q]&&ANS_ICON[q][st[q]]||(q==='about'?(st.about==='none'?'play':T[Q.about.o.find(o=>o.v===st.about).t].ic):'check'))+'</span><span class="tq">Move '+(i+1)+' · '+Q[q].q+'<b>'+ansLabel(q,st[q])+'</b></span><button type="button" class="chg" data-change="'+q+'" aria-label="Change your answer to: '+Q[q].q.replace(/"/g,'&quot;')+'">Change</button></li>').join('')+'</ol>';
 }
 const q=nextQ();
 if(q){
  const Qd=Q[q];
  h+='<div class="qcard"><div class="mv">Move '+(done.length+1)+'<i></i></div><h3 id="qh" tabindex="-1">'+Qd.q+'</h3><div class="qopts '+(Qd.cls||'')+'">'+
   Qd.o.map(o=>'<button type="button" class="qo'+(o.t?' t-'+o.t:'')+'" data-q="'+q+'" data-v="'+o.v+'"><span class="gi">'+(o.t?ic(T[o.t].ic):icx(o.g))+'</span><span><b>'+o.b+'</b><small>'+o.s+'</small></span></button>').join('')+
  '</div></div>';
  document.getElementById('game-res').innerHTML='';
 }
 b.innerHTML=h;
 b.hidden=!h;
 if(!q)renderGame(rowFromState());
 if(focus&&q){const qh=document.getElementById('qh');qh.focus({preventScroll:true});reveal(b.querySelector('.qcard'));}
}
function nodeHtml(k,focus,i,isLast){
 const m=T[k],first=i===0,id='mv-'+i+'-'+k;
 return '<li class="node t-'+k+(first?' first':'')+'"><div class="rail"><span class="dot">'+ic(m.ic)+'<em>'+num(k)+'</em></span>'+(isLast?'':'<span class="line"></span>')+'</div><div class="body">'+
  '<div class="tag">'+(first?'Start here · about a minute':'Then')+'</div><div class="name">'+m.n+'</div>'+
  (focus?'<p class="focus">'+focus+'</p>':'')+
  (first?stepsHtml(m.move):'<button type="button" class="more" aria-expanded="false" aria-controls="'+id+'">'+ic('arrow')+'<span>Show the one-minute move</span></button><div id="'+id+'" hidden>'+stepsHtml(m.move)+'</div>')+
  '<button type="button" class="toolbtn" data-open="'+k+'">'+ic('info')+'Signs and limits</button>'+lessonLinks(k)+'</div></li>';
}
function extras(row){
 if(st.direct||row==='zero')return '';
 const has=k=>rowOf(row).path.some(p=>p[0]===k);
 const out=[];
 if(st.timing==='turns'&&!has('ahead'))out.push(['ahead','You said: turns','Before your first move, jump to their last move and reason back.']);
 if(st.timing==='same'&&!has('shoes'))out.push(['shoes','You said: at the same time','Mark your best reply to each of their choices, and theirs to yours.']);
 if(st.timing==='repeat')out.push(['dilemma','You said: again and again','Reputation counts and cooperation can pay: start nice, respond, forgive.']);
 if(st.info==='they'&&!has('signals'))out.push(['signals','You said: they know more','What do they gain from what they tell you? Watch actions, not words.']);
 if(st.info==='me'&&!has('signals'))out.push(['signals','You said: you know more','Show it with an action the wrong type couldn’t afford.']);
 if(!out.length)return '';
 return '<div class="adds"><h4>Your answers also point to</h4>'+out.map(x=>'<div class="add t-'+x[0]+'"><span class="ai">'+ic(T[x[0]].ic)+'</span><span><b>'+T[x[0]].n+'</b><span style="color:var(--muted);font-size:12.5px;font-weight:600">'+x[1]+'.</span> '+x[2]+'</span></div>').join('')+'</div>';
}
const KINDS={turns:['tree','Turns'],same:['table','At the same time'],repeat:['loop','Again and again']};
function kindChips(row){
 const c=[];
 if(!st.direct){
  if(st.timing)c.push(KINDS[st.timing]);
  if(st.round)c.push(KINDS[st.round==='see'?'turns':'same']);
  if(st.info==='they')c.push(['blind','They know more']);
  if(st.info==='me')c.push(['seen','You know more']);
 }else{
  if(row==='turns')c.push(KINDS.turns);
  if(row==='same')c.push(KINDS.same);
 }
 return c.length?'<div class="kinds">'+c.map(x=>'<span class="kind">'+icx(x[0])+x[1]+'</span>').join('')+'</div>':'';
}
function renderGame(row){
 const res=document.getElementById('game-res');
 document.querySelectorAll('[data-row]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.row===st.direct)));
 if(row==='zero'){
  const L=lessonOf('0001');
  res.className='result t-zero';
  res.innerHTML='<div class="kk">Your game</div><h3>Not a game: an ordinary decision</h3><p class="signs">Fixing a puncture, choosing a recipe, picking paint.</p>'+
   '<div class="gamehead">'+pic('zero')+'</div>'+
   '<ol class="steps"><li><span>Nobody is thinking about your move, so there’s nothing to outwit: decide on the facts, like a lumberjack cutting wood.</span></li><li><span>Check again: will someone react later? Your future self counts as a player.</span></li></ol>'+
   '<a class="lk" href="'+L.file+'">Lesson '+L.n+': '+L.title+ic('arrow')+'</a>'+
   '<br><button type="button" class="again" data-restart="1">'+ic('cycle')+'Start again</button>';
  return;
 }
 const r=rowOf(row),first=r.path[0][0];
 res.className='result t-'+first;
 let h='<div class="kk">Your game</div><h3>'+r.t+'</h3><p class="signs">'+r.s+'</p>'+
  '<div class="gamehead">'+pic(first)+kindChips(row)+'</div><ol class="path">';
 r.path.forEach((p,i)=>{
  if(i===1)h+='<li class="divider" role="presentation">Big or hard to undo? Keep going</li>';
  h+=nodeHtml(p[0],p[1],i,i===r.path.length-1);
 });
 h+='</ol>'+extras(row)+
  '<div class="larger"><span class="li">'+ic('layers')+'</span><span><b>Then check the larger game</b>Will you deal with them again? Is your move fair enough that pride and trust won’t backfire?</span></div>'+
  '<p class="tali">'+ic('person')+'<span><b style="color:var(--ink)">In the course:</b> '+r.tali+'</span></p>'+
  '<button type="button" class="again" data-restart="1">'+ic('cycle')+'Start again</button>';
 res.innerHTML=h;
 bindMore(res);
}
function bindMore(root){
 root.querySelectorAll('.more').forEach(b=>b.addEventListener('click',()=>{
  const open=b.getAttribute('aria-expanded')!=='true';b.setAttribute('aria-expanded',String(open));
  document.getElementById(b.getAttribute('aria-controls')).hidden=!open;
  b.querySelector('span').textContent=open?'Hide the one-minute move':'Show the one-minute move';
 }));
}

/* ---------- stuck ---------- */
function renderStuck(k){
 const d=STUCK.find(x=>x.k===k),res=document.getElementById('stuck-res');
 let chain='';
 if(d.tools.length){
  chain='<div class="lbl">What unblocks it</div><div class="chain">'+d.tools.map(t=>
   '<button type="button" class="tchip t-'+t[0]+'" data-open="'+t[0]+'"><span class="bi">'+ic(T[t[0]].ic)+'</span><span>'+(t[1]?'<span class="w">'+t[1]+'</span>':'')+'<b>'+T[t[0]].n+'</b></span><span class="gx">'+ic('arrow')+'</span></button>').join('')+'</div><div class="down" aria-hidden="true">'+ic('down')+'</div>';
 }else{
  chain='<div class="lbl">No tool fixes this from inside the game</div><button type="button" class="tchip t-moves" data-jump="cg"><span class="bi">'+ic('layers')+'</span><span><b>Change the game</b><span class="w">Five ways, or don’t play</span></span><span class="gx">'+ic('down')+'</span></button><div class="down" aria-hidden="true">'+ic('down')+'</div>';
 }
 res.innerHTML='<div class="unflow">'+
   '<div class="box stuck"><span class="bi">'+ic(d.ic)+'</span><span><small>You’re stuck</small><b>'+d.t+'</b></span></div>'+
   '<div class="down" aria-hidden="true">'+ic('down')+'</div>'+chain+
   '<div class="box nxt"><div class="hd"><span class="bi">'+ic('check')+'</span><b>Your next step</b></div>'+stepsHtml(d.next)+'</div>'+
   (d.swap?'<div class="box swap"><span class="bi">'+ic('layers')+'</span><span><small>Change the game instead when</small><p>'+d.swap+'</p></span></div>':'')+
  '</div>'+
  '<p class="basis"><b>Book basis:</b> '+d.basis+'</p>';
 document.getElementById('cg').classList.toggle('hl',!!d.hl);
}

/* ---------- tool detail ---------- */
function renderTool(k){
 const m=T[k],res=document.getElementById('tool-res');
 const uses=ROWS.filter(r=>r.path.some(p=>p[0]===k));
 res.className='result detail t-'+k;
 res.innerHTML='<div class="detail-head"><span class="dot">'+ic(m.ic)+'</span><div><div class="kk">Tool '+num(k)+' · '+GROUPS.find(g=>g[1].includes(k))[0]+'</div><h3>'+m.n+'</h3></div></div>'+
  '<div class="picwrap">'+pic(k)+'<p class="cap">'+m.alt+'</p></div>'+
  '<div class="sec">'+ic('eye')+'Reach for it when '+APPLIED+'</div><div class="trig">'+m.trig.map(t=>'<div>'+ic('check')+'<span>'+t+'</span></div>').join('')+'</div>'+
  '<div class="sec">'+ic('clock')+'One-minute move '+APPLIED+'</div>'+(m.rule?'<span class="rule">'+m.rule+'</span>':'')+stepsHtml(m.move)+
  '<div class="sec">'+ic('alert')+'Where it stops working '+BOOK+'</div><div class="lims">'+m.lim.map(t=>'<div>'+ic('x')+'<span>'+t+'</span></div>').join('')+'</div>'+
  '<div class="sec">'+ic('leaf')+'Where cooperation wins '+BOOK+'</div><div class="coop">'+ic('check')+'<span>'+m.coop+'</span></div>'+
  (uses.length?'<div class="sec">'+ic('map')+'On your strategy map</div><div class="uses">'+uses.map(r=>'<button type="button" data-row="'+r.k+'" data-go="1">'+r.lab+'</button>').join('')+'</div>':'')+
  '<div class="lessons" style="margin-top:12px">'+lessonLinks(k)+'</div>';
}

function reveal(el){if(!el)return;const r=el.getBoundingClientRect();if(r.top>innerHeight*0.6||r.top<70)el.scrollIntoView({behavior:'smooth',block:'start'});}
function press(sel,el){document.querySelectorAll(sel).forEach(b=>b.setAttribute('aria-pressed',String(b===el)));}

/* ---------- tabs ---------- */
const TABS=['game','stuck','tools'];
function showTab(t,focus){
 TABS.forEach(x=>{const b=document.getElementById('t-'+x),on=x===t;b.setAttribute('aria-selected',String(on));b.tabIndex=on?0:-1;document.getElementById('p-'+x).hidden=!on;});
 if(focus)document.getElementById('t-'+t).focus();
 try{history.replaceState(null,'','#'+t);}catch(e){}
}
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(b)showTab(b.id.slice(2));});
document.querySelector('.tabs').addEventListener('keydown',e=>{
 const i=TABS.indexOf(document.activeElement.id.slice(2));if(i<0)return;
 let j=null;if(e.key==='ArrowRight')j=(i+1)%3;else if(e.key==='ArrowLeft')j=(i+2)%3;else if(e.key==='Home')j=0;else if(e.key==='End')j=2;
 if(j!==null){e.preventDefault();showTab(TABS[j],true);}
});

/* ---------- clicks ---------- */
function openRow(k){showTab('game');st={direct:k};renderBoard();try{history.replaceState(null,'','#row-'+k);}catch(e){}reveal(document.getElementById('game-res'));}
function openTool(k){showTab('tools');press('[data-tool]',document.querySelector('[data-tool="'+k+'"]'));renderTool(k);try{history.replaceState(null,'','#tool-'+k);}catch(e){}reveal(document.getElementById('tool-res'));}
function openStuck(k){showTab('stuck');press('[data-stuck]',document.querySelector('[data-stuck="'+k+'"]'));renderStuck(k);try{history.replaceState(null,'','#stuck-'+k);}catch(e){}reveal(document.getElementById('stuck-res'));}
app.addEventListener('click',e=>{
 const a=e.target.closest('[data-q]');
 if(a){st[a.dataset.q]=a.dataset.v;renderBoard(true);if(!nextQ())reveal(document.getElementById('game-res'));return;}
 const c=e.target.closest('[data-change]');
 if(c){const i=ASKED.indexOf(c.dataset.change);ASKED.slice(i).forEach(q=>delete st[q]);renderBoard(true);return;}
 const rs=e.target.closest('[data-restart]');
 if(rs){st={};renderBoard(true);try{history.replaceState(null,'','#game');}catch(err){}return;}
 const r=e.target.closest('[data-row]');if(r){openRow(r.dataset.row);return;}
 const s=e.target.closest('[data-stuck]');if(s){openStuck(s.dataset.stuck);return;}
 const t=e.target.closest('[data-tool]');if(t){openTool(t.dataset.tool);return;}
 const o=e.target.closest('[data-open]');if(o){openTool(o.dataset.open);return;}
 const j=e.target.closest('[data-jump]');if(j){document.getElementById(j.dataset.jump).scrollIntoView({behavior:'smooth',block:'start'});return;}
});
document.getElementById('skip').addEventListener('click',e=>{
 const b=e.currentTarget,open=b.getAttribute('aria-expanded')!=='true';
 b.setAttribute('aria-expanded',String(open));document.getElementById('rowlist').hidden=!open;
});

/* deep links: #stuck, #tools, #tool-bid, #stuck-deadlock, #row-split */
renderBoard();
const h=location.hash.slice(1);
if(h.startsWith('tool-')&&T[h.slice(5)])openTool(h.slice(5));
else if(h.startsWith('stuck-')&&STUCK.some(d=>d.k===h.slice(6)))openStuck(h.slice(6));
else if(h.startsWith('row-')&&rowOf(h.slice(4)))openRow(h.slice(4));
else if(TABS.includes(h))showTab(h);
})();
</script>
</body>
</html>
