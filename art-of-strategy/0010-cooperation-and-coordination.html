<script>
/* ===== This lesson’s own visuals: the two-road commute (a crowd of dots split between a jamming
   road and a steady train, with a trip-time chart and a toll), the bandwagon S-curve (a ball on the
   diagonal that rolls to one end or the other past a tipping point) and the cutoff vote line (ten
   associates voting the partnership bar up one notch at a time). Everything lives in this file. ===== */
(function(){const st=document.createElement('style');st.textContent=`
.card [hidden]{display:none!important}
.cc-svg{display:block;width:100%;max-width:330px;margin:4px auto}
.cc-ro{font-size:14px;text-align:center;color:var(--muted);margin:6px 0;min-height:20px;line-height:1.45}

const NF=n=>Math.round(n).toLocaleString('en-GB');
const PC=v=>Math.round(v*100)+'%';
function ccSlider(id,label,min,max,step,val,shown){
  return '<label class="cc-sl" for="'+id+'"><span class="h"><span>'+label+'</span><b id="'+id+'v">'+shown+'</b></span><input type="range" id="'+id+'" min="'+min+'" max="'+max+'" step="'+step+'" value="'+val+'"></label>';}
function ccSet(L,sel,v){const e=L.$(sel);e.value=String(v);e.dispatchEvent(new Event('input',{bubbles:true}));}
function ccArrow(x1,y1,x2,y2,col,w){const dx=x2-x1,dy=y2-y1,l=Math.hypot(dx,dy)||1,ux=dx/l,uy=dy/l,ex=x2-ux*7,ey=y2-uy*7;
  return '<path d="M'+x1+' '+y1+'L'+ex.toFixed(1)+' '+ey.toFixed(1)+'" stroke="var('+col+')" stroke-width="'+(w||2.5)+'" stroke-linecap="round"/><path d="M'+x2+' '+y2+'L'+(ex-uy*5.5).toFixed(1)+' '+(ey+ux*5.5).toFixed(1)+'L'+(ex+uy*5.5).toFixed(1)+' '+(ey-ux*5.5).toFixed(1)+'Z" fill="var('+col+')"/>';}

/* ---------- the two-road commute ----------
   Book’s Bay Bridge numbers by default: 10,000 commuters, road 20 min empty + 5 min per 1,000 cars,
   train 40 min flat; $1 of toll feels like 5 minutes ($12 an hour). One dot = o.per people. */
function ccRoads(L,host,o){
  o=Object.assign({N:10000,per:100,base:20,slope:.005,train:40,kpd:5,n:4000,toll:0,road:'BRIDGE ROAD',rail:'TRAIN',railWord:'train',total:false,showE:false},o||{});
  const st={n:o.n,toll:o.toll,tm:null};
  const w=document.createElement('div');host.appendChild(w);
  w.innerHTML='<svg class="cc-svg" viewBox="0 0 320 288" role="img" aria-label="Two routes into town. Dots show who takes the road and who takes the '+o.railWord+'; badges show each trip time; the chart below shows road time rising with traffic while the '+o.railWord+' stays flat."></svg><p class="cc-ro" aria-live="polite"></p>';
  const svg=w.querySelector('svg'),ro=w.querySelector('.cc-ro');
  const rt=k=>o.base+o.slope*k,cost=k=>rt(k)+o.kpd*st.toll;
  const eqN=()=>{const v=(o.train-o.base-o.kpd*st.toll)/o.slope;return Math.max(0,Math.min(o.N,Math.round(v/o.per)*o.per));};
  const freeN=()=>Math.max(0,Math.min(o.N,Math.round((o.train-o.base)/o.slope/o.per)*o.per));
  const bestN=()=>Math.round((o.train-o.base)/(2*o.slope)/o.per)*o.per;
  const total=k=>k*rt(k)+(o.N-k)*o.train;
  const X=k=>36+k/o.N*270,Y=m=>268-(Math.min(m,70)-20)*1.8;
  const fm=m=>String(Math.round(m*10)/10);
  function draw(){
    const n=st.n,cap=Math.round(o.N/o.per),dn=Math.round(n/o.per),d=cost(n)-o.train;
    const rc=d<-.01?'ok':d>.01?'no':'pri',tc=d<-.01?'no':d>.01?'ok':'pri';
    let s='';
    [[4,o.road,'--h1',dn,rc,fm(rt(n)),st.toll?'min + $'+st.toll:'min'],[84,o.rail,'--h2',cap-dn,tc,fm(o.train),'min']].forEach((p,j)=>{const y=p[0];
      s+='<rect x="4" y="'+y+'" width="312" height="72" rx="12" fill="var(--soft)"/>'+
        '<text x="14" y="'+(y+17)+'" font-size="11" font-weight="700" letter-spacing=".5" fill="var('+p[2]+')">'+p[1]+' · '+NF(p[3]*o.per)+'</text>'+
        '<rect x="10" y="'+(y+24)+'" width="236" height="42" rx="6" fill="var(--soft2)"/>'+
        (j===0?'<path d="M14 '+(y+45)+'H242" stroke="var(--card)" stroke-width="1.5" stroke-dasharray="8 6"/>':'<path d="M14 '+(y+28)+'H242M14 '+(y+62)+'H242" stroke="var(--line2)" stroke-width="1.5"/>');
      for(let q=0;q<p[3];q++){const c=Math.floor(q/4),r=q%4;s+='<circle cx="'+(16+c*9.2).toFixed(1)+'" cy="'+(y+30+r*10)+'" r="3.4" fill="var('+p[2]+')"/>';}
      s+='<rect x="252" y="'+(y+10)+'" width="58" height="54" rx="10" fill="var(--'+p[4]+'-bg)" stroke="var(--'+(p[4]==='pri'?'pri':p[4])+')" stroke-width="1.5"/>'+
        '<text x="281" y="'+(y+40)+'" text-anchor="middle" font-size="20" font-weight="700" fill="var(--ink)">'+p[5]+'</text>'+
        '<text x="281" y="'+(y+56)+'" text-anchor="middle" font-size="11" fill="var(--muted)">'+p[6]+'</text>';});
    if(d<-.01)s+=ccArrow(281,96,281,66,'--ink',2.5);
    else if(d>.01)s+=ccArrow(281,66,281,96,'--ink',2.5);
    else s+='<rect x="268" y="72" width="26" height="18" rx="6" fill="var(--card)"/><path d="M273 78h16M273 84h16" stroke="var(--pri)" stroke-width="2.5"/>';
    /* chart */
    s+='<text x="36" y="172" font-size="11" font-weight="700" fill="var(--muted)">TRIP TIME, MINUTES</text>';
    [20,40,60].forEach(m=>{s+='<path d="M36 '+Y(m)+'H306" stroke="var(--line)" stroke-width="1"/><text x="31" y="'+(Y(m)+4)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+m+'</text>';});
    s+='<text x="36" y="284" font-size="11" fill="var(--muted)">0</text><text x="171" y="284" text-anchor="middle" font-size="11" fill="var(--muted)">'+NF(o.N/2)+'</text><text x="306" y="284" text-anchor="end" font-size="11" fill="var(--muted)">'+NF(o.N)+' drive</text>';
    const kEnd=Math.min(o.N,(70-o.base)/o.slope);
    s+='<path d="M'+X(0)+' '+Y(o.base)+'L'+X(kEnd).toFixed(1)+' '+Y(rt(kEnd)).toFixed(1)+'" stroke="var(--h1)" stroke-width="3" stroke-linecap="round"/>';
    if(st.toll){const k2=Math.min(o.N,Math.max(0,(70-o.base-o.kpd*st.toll)/o.slope));s+='<path d="M'+X(0)+' '+Y(o.base+o.kpd*st.toll).toFixed(1)+'L'+X(k2).toFixed(1)+' '+Y(cost(k2)).toFixed(1)+'" stroke="var(--h3)" stroke-width="2.5" stroke-dasharray="6 4"/><text x="'+(X(k2)-4).toFixed(1)+'" y="'+(Y(cost(k2))+14).toFixed(1)+'" text-anchor="end" font-size="11" font-weight="700" fill="var(--h3)">road + toll</text>';}
    s+='<path d="M36 '+Y(o.train)+'H306" stroke="var(--h2)" stroke-width="3"/><text x="304" y="'+(Y(o.train)+15)+'" text-anchor="end" font-size="11" font-weight="700" fill="var(--h2)">'+o.railWord+'</text>'+
      '<text x="'+(X(kEnd)-6).toFixed(1)+'" y="'+(Y(rt(kEnd))+4).toFixed(1)+'" text-anchor="end" font-size="11" font-weight="700" fill="var(--h1)" dx="-4">road</text>';
    if(o.showE){const e=freeN();s+='<circle cx="'+X(e)+'" cy="'+Y(o.train)+'" r="4" fill="var(--ink)"/><text x="'+(X(e)-4)+'" y="'+(Y(o.train)-8)+'" text-anchor="end" font-size="11" font-weight="700" fill="var(--ink)">E</text>';}
    s+='<path d="M'+X(n).toFixed(1)+' 268V180" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="3 3"/>'+
      '<circle cx="'+X(n).toFixed(1)+'" cy="'+Y(cost(n)).toFixed(1)+'" r="5.5" fill="var(--h1)" stroke="var(--card)" stroke-width="1.5"/><circle cx="'+X(n).toFixed(1)+'" cy="'+Y(o.train)+'" r="5.5" fill="var(--h2)" stroke="var(--card)" stroke-width="1.5"/>';
    svg.innerHTML=s;
    const tt=st.toll?' + $'+st.toll+' (feels like '+fm(cost(n))+')':'';
    let msg=d<-.01?'The road is faster: '+o.railWord+' riders want to switch to it.':d>.01?'The '+o.railWord+' is faster: drivers want to switch to it.':'Same either way: <b>nobody gains by switching</b>.';
    let h='<b>'+NF(n)+'</b> drive · <b>'+NF(o.N-n)+'</b> take the '+o.railWord+'<br>Road <b>'+fm(rt(n))+'</b> min'+tt+' · '+o.railWord+' <b>'+fm(o.train)+'</b> min<br>'+msg;
    if(o.total){const sv=total(freeN())-total(n);h+='<br>Everyone together: <b>'+NF(total(n))+'</b> minutes'+(sv>0?' · <b>'+NF(sv)+'</b> fewer than free choice':'');}
    if(o.extra)h+=o.extra(api);
    ro.innerHTML=h;
    if(o.onDraw)o.onDraw(api);
  }
  const api={w,o,rt,cost,eqN,freeN,bestN,total,get n(){return st.n;},get toll(){return st.toll;},
    set(k){clearTimeout(st.tm);st.n=Math.max(0,Math.min(o.N,k));draw();},
    setToll(t){st.toll=t;draw();},
    drift(t,cb){clearTimeout(st.tm);const a=st.n,F=Math.max(1,Math.min(30,Math.round(Math.abs(t-a)/o.per)));let f=0;
      const tick=()=>{if(!w.isConnected)return;f++;st.n=Math.round((a+(t-a)*f/F)/o.per)*o.per;draw();if(f<F)st.tm=setTimeout(tick,40);else{st.n=t;draw();if(cb)cb();}};tick();}};
  draw();return api;}

/* ---------- the bandwagon S-curve ----------
   Horizontal: share choosing an option now. Vertical: share of newcomers who choose it.
   Where the curve sits above the dashed diagonal the share grows; below it, it shrinks. */
function ccPchip(P){const n=P.length,xs=P.map(p=>p[0]),ys=P.map(p=>p[1]),h=[],d=[];
  for(let i=0;i<n-1;i++){h[i]=xs[i+1]-xs[i];d[i]=(ys[i+1]-ys[i])/h[i];}
  const m=new Array(n);m[0]=d[0];m[n-1]=d[n-2];
  for(let i=1;i<n-1;i++){if(d[i-1]*d[i]<=0)m[i]=0;else{const w1=2*h[i]+h[i-1],w2=h[i]+2*h[i-1];m[i]=(w1+w2)/(w1/d[i-1]+w2/d[i]);}}
  return x=>{if(x<=xs[0])return ys[0];if(x>=xs[n-1])return ys[n-1];let i=0;while(x>xs[i+1])i++;const t=(x-xs[i])/h[i],t2=t*t,t3=t2*t;
    return (2*t3-3*t2+1)*ys[i]+(t3-2*t2+t)*h[i]*m[i]+(-2*t3+3*t2)*ys[i+1]+(t3-t2)*h[i]*m[i+1];};}
function ccCurve(L,host,o){
  o=Object.assign({x:.5,people:0,stable:[],tip:null,xl:'',yl:'',rate:.35,h:200},o);
  const f=ccPchip(o.pts),st={x:o.x,tm:null,trail:[]};
  const top=o.people?30:2,ph=o.h,H=top+ph+40;
  const X=v=>46+v*262,Y=v=>top+ph-v*(ph-14);
  const w=document.createElement('div');host.appendChild(w);
  w.innerHTML='<svg class="cc-svg" viewBox="0 0 320 '+H+'" role="img" aria-label="Bandwagon chart: the ball sits on the dashed diagonal at today’s share; the curve shows the share of newcomers who choose the option; above the diagonal the share grows, below it shrinks"></svg><p class="cc-ro" aria-live="polite"></p>';
  const svg=w.querySelector('svg'),ro=w.querySelector('.cc-ro');
  let curve='';for(let k=0;k<=120;k++){const v=k/120;curve+=(k?'L':'M')+X(v).toFixed(1)+' '+Y(f(v)).toFixed(1);}
  function draw(){
    const x=st.x,fx=f(x);let s='';
    if(o.people){const n=o.people,on=Math.round(x*n),dx=Math.min(15,296/n);for(let k=0;k<n;k++){const cx=160-(n-1)*dx/2+k*dx;
      s+='<circle cx="'+cx.toFixed(1)+'" cy="13" r="5.6" fill="var('+(k<on?'--pri':'--soft2')+')" stroke="var('+(k<on?'--pri':'--line2')+')" stroke-width="1.2"/>';}}
    s+='<rect x="46" y="'+(top+14)+'" width="262" height="'+(ph-14)+'" rx="6" fill="var(--soft)"/>';
    [.5].forEach(v=>{s+='<path d="M'+X(v)+' '+(top+14)+'V'+(top+ph)+'M46 '+Y(v)+'H308" stroke="var(--line)" stroke-width="1"/>';});
    [0,.5,1].forEach(v=>{s+='<text x="'+X(v)+'" y="'+(top+ph+14)+'" text-anchor="'+(v===0?'start':v===1?'end':'middle')+'" font-size="11" fill="var(--muted)">'+PC(v)+'</text>'+
      '<text x="41" y="'+(Y(v)+4)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+PC(v)+'</text>';});
    s+='<text x="177" y="'+(top+ph+30)+'" text-anchor="middle" font-size="11" font-weight="600" fill="var(--muted)">'+o.xl+' →</text>'+
      '<text transform="translate(12 '+(top+14+(ph-14)/2)+') rotate(-90)" text-anchor="middle" font-size="11" font-weight="600" fill="var(--muted)">'+o.yl+' →</text>';
    s+='<path d="M'+X(0)+' '+Y(0)+'L'+X(1)+' '+Y(1)+'" stroke="var(--line2)" stroke-width="1.6" stroke-dasharray="5 4"/>';
    s+='<path d="'+curve+'" fill="none" stroke="var(--h3)" stroke-width="3" stroke-linejoin="round"/>';
    o.stable.forEach(v=>{s+='<circle cx="'+X(v)+'" cy="'+Y(v)+'" r="5" fill="var(--ok)"/>';});
    if(o.tip!=null)s+='<circle cx="'+X(o.tip)+'" cy="'+Y(o.tip)+'" r="6" fill="var(--card)" stroke="var(--no)" stroke-width="2.5"/><text x="'+(o.tip>.6?X(o.tip)-10:X(o.tip)+9)+'" y="'+(Y(o.tip)+(o.tip>.6?4:16))+'" text-anchor="'+(o.tip>.6?'end':'start')+'" font-size="11" font-weight="700" fill="var(--no)">tipping point '+PC(o.tip)+'</text>';
    if(o.labels)o.labels.forEach(q=>{s+='<text x="'+q[0]+'" y="'+(top+q[1])+'" text-anchor="'+(q[3]||'start')+'" font-size="11" font-weight="700" fill="var('+(q[4]||'--ok')+')">'+q[2]+'</text>';});
    if(st.trail.length>1)s+='<path d="'+st.trail.map((v,k)=>(k?'L':'M')+X(v).toFixed(1)+' '+Y(v).toFixed(1)).join('')+'" stroke="var(--h1)" stroke-width="4" opacity=".35" stroke-linecap="round"/>';
    const up=fx>x+.002,dn=fx<x-.002;
    s+='<path d="M'+X(x).toFixed(1)+' '+Y(x).toFixed(1)+'V'+Y(fx).toFixed(1)+'" stroke="var('+(up?'--ok':dn?'--no':'--muted')+')" stroke-width="3"/><circle cx="'+X(x).toFixed(1)+'" cy="'+Y(fx).toFixed(1)+'" r="3.5" fill="var(--h3)"/>';
    s+='<circle cx="'+X(x).toFixed(1)+'" cy="'+Y(x).toFixed(1)+'" r="8" fill="var(--h1)" stroke="var(--card)" stroke-width="2"/>';
    if(up||dn){const a=up?1:-1;s+=ccArrow(X(x)+a*12,Y(x)-a*12,X(x)+a*26,Y(x)-a*26,up?'--ok':'--no',3);}
    svg.innerHTML=s;
    ro.innerHTML=o.ro?o.ro(x,fx,api):'Now: <b>'+PC(x)+'</b> · newcomers choosing it: <b>'+PC(fx)+'</b>'+(up?' → <b style="color:var(--ok)">share grows</b>':dn?' → <b style="color:var(--no)">share shrinks</b>':' → <b>stays put</b>');
  }
  const api={w,f,get x(){return st.x;},
    set(v,keep){clearTimeout(st.tm);st.x=Math.max(0,Math.min(1,v));if(!keep)st.trail=[];draw();},
    run(cb){clearTimeout(st.tm);st.trail=[st.x];let k=0;
      const step=()=>{if(!w.isConnected)return;const d=f(st.x)-st.x,near=o.stable.find(v=>Math.abs(v-st.x)<.0062);
        if(near!==undefined||Math.abs(d)<.0004||k>60){if(near!==undefined)st.x=near;st.trail.push(st.x);draw();if(o.onStep)o.onStep(st.x);if(cb)cb(st.x);return;}
        st.x=Math.max(0,Math.min(1,st.x+Math.sign(d)*Math.max(Math.abs(d)*o.rate,.006)));st.trail.push(st.x);k++;draw();if(o.onStep)o.onStep(st.x);st.tm=setTimeout(step,40);};
      step();},
    draw};
  draw();return api;}
const CV_QWERTY=[[0,0],[.3,.08],[.55,.3],[.70,.5],[.72,.72],[.78,.88],[.85,.95],[.92,.972],[.98,.98],[1,.983]];
const CV_SPEED=[[0,.03],[.1,.1],[.3,.17],[.5,.5],[.75,.9],[1,1]];
const CV_TOOL=[[0,0],[.2,.07],[.32,.18],[.42,.42],[.52,.66],[.65,.86],[.8,.96],[1,1]];
const CV_SIX=[[0,.04],[.1,.1],[.25,.15],[.4,.4],[.6,.75],[.8,.94],[1,1]];

/* ---------- strategy-map strip (CANON “The strategy map”; built lesson by lesson) ---------- */
const MP_T={look:['Look ahead',2],pd:['Dilemma',3],shoes:['Their shoes',5],mix:['Mix',6],commit:['Commit',7],cred:['Credible',8],sig:['Signals',9],coord:['Coordinate',10],bid:['Bid smart',11],batna:['BATNA',12],vote:['Vote',13],inc:['Incentives',14]};
const MP_ROWS=[['Taking turns: you move, then they respond',['look','cred','commit']],['You both choose at once, without seeing the other',['shoes','pd','mix']],['Everyone’s tempted to grab or slack',['pd','coord','inc']],['You need everyone to land on the same choice',['shoes','coord','commit']],['Your pattern is being read, or you’re checking',['mix']],['You want to change someone’s behaviour',['commit','cred','look']],['They know something you don’t',['sig','shoes','bid']],['Splitting something or agreeing a price',['batna','cred','sig']],['Competing with several others for one prize',['bid','sig','pd']],['A group decides together',['vote','coord','batna']],['Getting good work you can’t watch',['inc','sig','cred']]];

Course.lesson({
  id:'0010', title:'Cooperation and coordination', minutes:20, icon:'people',
  goals:['Spot when a crowd’s free choices settle where nobody would choose, because each person ignores the cost they put on others',
         'Tell a crowd that settles in a mix from one that tips to an extreme, and move it with a short, intense push past the tipping point',
         'Pick the fix and run the one-minute move: price the harm, get a critical mass to move, ask for an outside rule, or agree the end point first'],
  parts:['Rat races and roads','Tipping points','Slopes and side effects','Use it this week'],
  read:'Read chapter 9 of the book, “Cooperation and Coordination”, for the Bay Bridge commute, the QWERTY story, the law firm’s nine-to-one votes and the dentists case.',
  glossary:{
   'rat-race':'Rat race: a contest decided by rank, where everyone works harder to stay ahead, the ranks end up where they started, and all have spent more effort for nothing.',
   spillover:'Spillover: an effect your choice has on other people that you don’t pay for, like the delay one more car adds for every other driver.',
   'lock-in':'Lock-in: an option stays in use because everyone already uses it, even after a better one exists.',
   'critical-mass':'Critical mass: enough people switching at once to carry a group past the tipping point, after which the rest follow by themselves.',
   'slippery-slope':'Slippery slope: a series of small steps, each approved on its own, that ends somewhere most people would have rejected as a whole.'
  },
  cheatsheet:[
   '<b>Rat race</b>: when only rank counts, everyone’s extra effort cancels out. Escape with an agreed, visible limit, best enforced from outside (the Ivy League’s one day of spring practice).',
   '<b>The route less traveled</b>: free choice settles where both routes take 40 minutes (4,000 drivers, the book’s numbers), yet 2,000 drivers would save 20,000 minutes. Each driver ignores the delay they add for others.',
   '<b>Price the harm</b>: a toll set to the harm ($2, worth 10 minutes) moves free choice to the best split. Rotating licences work too. Skip it if collecting costs more than it saves.',
   '<b>Tipping</b>: when company makes a choice better (keyboards, speeding, habits), the crowd runs to one end. QWERTY above 72% climbs to 98%; below, it dies out. History, not quality, can decide.',
   '<b>Critical mass, short and intense</b>: you needn’t convert everyone. Push enough people past the tipping point at once; the same effort spread thin fades away.',
   '<b>Slippery slope</b>: step-by-step votes that each pass 9 to 1 can end where nobody wanted. Agree the package, the end point, before step one.',
   '<b>Not every side effect needs fixing</b>: when it’s only a price change (the dentists), what one side loses the other gains.',
   '<b>One-minute move</b> (how this course applies the book): spillover nobody pays for? → race for rank? → mix or tip? → price it, push past the tip, ask for an outside rule, or agree the end point.'

/* ---------- PART 1: RAT RACES AND ROADS ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Before the promotion, everyone at Plover now stays till 7 to look keen. If the whole team agreed to leave at 6 instead, whose standing would drop?</h1>');
  L.mc(L.card,['Tali’s, since Tali would work fewer hours','Nobody’s: everyone would move together','Linus’s, since Linus stays the latest'],1,
   'Standing depends on who stays longer than whom. If everyone moves together, the order is the same and everyone gets their evening back. This lesson is about crowds stuck in races like this, and how they get out.',
   'If everyone leaves at 6, the order between people doesn’t change: everyone moves together. Only the wasted evenings disappear. This lesson is about crowds stuck in races like this.');}},

{part:0,src:'Chapter 9 · For Whom the Bell Curve Tolls',
 solve:async L=>{['one','all','cap'].forEach(k=>L.$('#rr [data-k="'+k+'"]').click());},
 run(L){
  let fin=false;
  L.h(L.kick('learn','The rat race')+'<h1 class="q">Five students are graded on a curve: only their rank counts. Tap each move and watch the ranks.</h1>'+
   '<svg class="cc-svg" id="rsv" viewBox="0 0 320 162" role="img" aria-label="Bars of weekly study hours for five students, with each one’s rank above the bar"></svg>'+
   '<p class="cc-ro" id="rro" aria-live="polite"></p><div class="cc-ctl" id="rr"></div><p class="cc-cap" id="rcap">Tap a move.</p>');
  const S={base:[6,8,5,9,7],one:[6,8,10,9,7],all:[10,12,9,13,11],cap:[4,6,3,7,5]};
  const T={one:'Student C studies 5 more hours and jumps from 5th to 1st. Everyone else drops a place. That’s the pull.',
    all:'But the others do the same. All add 4 hours: 35 hours a week become 55, and every rank is exactly where it started.',
    cap:'If all agree to study 2 hours less, the ranks and grades stay the same and 10 hours come back. It holds only if nobody sneaks extra study.'};
  const rank=a=>a.map(v=>a.filter(u=>u>v).length+1);
  function draw(k){const a=S[k],r=rank(a),r0=rank(S.base);let s='';
    a.forEach((v,j)=>{const x=26+j*60,top=138-v*8,ch=k!=='base'&&r[j]!==r0[j];
      s+='<rect x="'+x+'" y="'+top+'" width="40" height="'+(v*8)+'" rx="6" fill="var('+(j===2&&k==='one'?'--h3':'--h1')+')" opacity=".85"/>'+
        '<text x="'+(x+20)+'" y="'+(top+15)+'" text-anchor="middle" font-size="11" font-weight="700" fill="var(--card)">'+v+'h</text>'+
        '<circle cx="'+(x+20)+'" cy="'+(top-14)+'" r="12" fill="var('+(ch?'--no-bg':'--card')+')" stroke="var('+(ch?'--no':'--line2')+')" stroke-width="1.5"/>'+
        '<text x="'+(x+20)+'" y="'+(top-10)+'" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">'+['1st','2nd','3rd','4th','5th'][r[j]-1]+'</text>'+
        '<text x="'+(x+20)+'" y="156" text-anchor="middle" font-size="12" font-weight="700" fill="var(--muted)">'+'ABCDE'[j]+'</text>';});
    L.$('#rsv').innerHTML='<path d="M14 138H306" stroke="var(--line2)" stroke-width="1.5"/>'+s;
    const tot=a.reduce((p,q)=>p+q,0),same=r.every((v,j)=>v===r0[j]);
    L.$('#rro').innerHTML='Study hours, all five: <b>'+tot+'</b> a week · ranks: <b>'+(same?'same as before':'changed')+'</b>';}
  draw('base');const seen=new Set();
  [['one','One studies more'],['all','Everyone studies more'],['cap','Agree a limit']].forEach(q=>{const b=document.createElement('button');b.className='chip';b.dataset.k=q[0];b.textContent=q[1];
    b.onclick=()=>{draw(q[0]);L.$('#rcap').innerHTML=T[q[0]];[...L.$('#rr').children].forEach(x=>x.classList.toggle('sel',x===b));seen.add(q[0]);
      if(seen.size===3&&!fin){fin=true;L.sheet('info','A race nobody wins','When only rank counts, each person’s extra effort makes it harder for the others, and nobody pays for that. It’s a many-person '+L.g('prisoners-dilemma','prisoners’ dilemma')+': a '+L.g('rat-race','rat race')+'. In the 1950s the Ivy League colleges escaped one in football by agreeing to one day of spring practice. Such deals need cheating to be seen, or an outsider to enforce them: the 1968 ban on TV cigarette ads, which the companies fought, ended their ad race and raised all their profits.');L.done();}};
    L.$('#rr').appendChild(b);});}},

{part:0,src:'Chapter 9 · The Route Less Traveled',
 solve:async L=>{ccSet(L,'#rs',1000);await L.sleep(30);ccSet(L,'#rs',8000);},
 run(L){
  let fin=false;const seen=new Set();
  L.h(L.kick('learn','Explore · two roads into town')+'<h1 class="q">10,000 people commute into town each morning. Drag how many drive. Who wants to switch?</h1>'+
   '<p class="cc-ill">The book’s numbers (its Bay Bridge commute): the bridge takes 20 minutes empty and 5 more for every 1,000 cars; the train always takes 40. Each dot is 100 people.</p>'+
   '<div id="rd"></div>'+ccSlider('rs','Cars on the bridge road',0,10000,100,6000,'6,000'));
  const R=ccRoads(L,L.$('#rd'),{n:6000});
  L.$('#rs').addEventListener('input',e=>{const v=+e.target.value;L.$('#rsv').textContent=NF(v);R.set(v);const d=R.cost(v)-40;
    if(d<-.01)seen.add('fast');if(d>.01)seen.add('slow');
    if(seen.size===2&&!fin){fin=true;L.sheet('info','Someone always wants to move','With few drivers the road beats the train, so train riders switch to it. With many, drivers switch to the train. Each person simply picks the faster route for themselves. Next: where does that tug-of-war stop?');L.done();}});}},

{part:0,src:'Chapter 9 · The Route Less Traveled',pts:1,
 solve:async L=>{L.$('#pp [data-k="4000"]').click();},
 run(L){
  let fin=false;
  L.h(L.kick('try','Predict, then watch')+'<h1 class="q">It starts with 1,000 drivers. Each commuter keeps switching to whichever route is faster. Where does the crowd settle?</h1>'+
   '<div class="cc-ctl" id="pp"></div><div id="pd"></div>');
  const R=ccRoads(L,L.$('#pd'),{n:1000});
  [2000,4000,5000,10000].forEach(v=>{const b=document.createElement('button');b.className='chip';b.dataset.k=v;b.textContent=NF(v)+' drive';
    b.onclick=()=>{if(fin)return;fin=true;b.classList.add('sel');const ok=v===4000;L.award(ok);
      R.drift(4000,()=>{L.sheet(ok?'ok':'no',ok?'4,000 drive, and everyone takes 40 minutes':'It settles at 4,000 drivers',
        (ok?'':'You picked '+NF(v)+'. ')+'At 4,000 cars the road takes 20 + 20 = 40 minutes, exactly like the train, so nobody gains by switching. That resting point is the equilibrium of this game: each person’s choice is the best reply to what everyone else does. And notice: the road saves nobody any time. Everyone spends 40 minutes.');L.done();});};
    L.$('#pp').appendChild(b);});}},

{part:0,src:'Chapter 9 · The Route Less Traveled',pts:1,
 solve:async L=>{ccSet(L,'#bs',2000);L.$('#bl').click();},
 run(L){
  let fin=false;
  L.h(L.kick('pr','Play the planner')+'<h1 class="q">Now you decide who drives. Find the split that wastes the fewest minutes in total.</h1>'+
   '<div id="bd"></div>'+ccSlider('bs','Cars on the bridge road',0,10000,100,4000,'4,000')+
   '<div class="cc-ctl"><button class="btn pri" id="bl">'+L.ic('check')+'Lock in this split</button></div>');
  const R=ccRoads(L,L.$('#bd'),{n:4000,total:true});
  L.$('#bs').addEventListener('input',e=>{const v=+e.target.value;L.$('#bsv').textContent=NF(v);R.set(v);});
  L.$('#bl').onclick=()=>{if(fin)return;fin=true;const n=R.n,ok=n===2000;L.award(ok);L.$('#bs').disabled=true;
    L.sheet(ok?'ok':'no',ok?'2,000 drivers: 20,000 minutes saved':'The best split is 2,000 drivers',
      (ok?'':'At '+NF(n)+' drivers the group saves '+NF(R.total(4000)-R.total(n))+' minutes. ')+'At 2,000, each driver takes 30 minutes instead of 40, and the 2,000 who moved to the train lose nothing (40 either way). That saves 20,000 minutes every morning; 1,000 or 3,000 drivers save only 15,000 (the book’s numbers). But free choice won’t hold it: train riders see a 30-minute road and pile back on.');L.done();};}},

{part:0,src:'Chapter 9 · The Route Less Traveled',
 solve:async L=>{L.$('#ha').click();},
 run(L){
  L.h(L.kick('learn','The hidden cost')+'<h1 class="q">Why doesn’t free choice find the best split? Add one more driver at 4,000.</h1>'+
   '<svg class="cc-svg" id="hsv" viewBox="0 0 320 176" role="img" aria-label="A two-lane road full of cars; a new car joins at the back and every other car is slowed a little"></svg>'+
   '<p class="cc-ill">Worked out from the book’s numbers: 5 minutes per 1,000 cars is 0.3 seconds per extra car, for everyone on the road.</p>'+
   '<div class="cc-two" id="htw" hidden><div><b>WHAT THEY COUNT</b>Their own trip: 40 minutes, no better than the train.</div><div><b>WHAT THEY DON’T</b>0.3 seconds more for each of 4,000 others: 20 minutes in all.</div></div>'+
   '<div class="cc-ctl"><button class="btn pri" id="ha">'+L.ic('arrow')+'Add one more driver</button></div>');
  let s='<text x="160" y="22" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--muted)">4,000 DRIVERS · 40 MINUTES EACH</text>'+
    '<g id="hbr" class="cc-fade" opacity="0"><path d="M48 46V40H308V46" fill="none" stroke="var(--h3)" stroke-width="2"/><text x="178" y="34" text-anchor="middle" font-size="11" font-weight="700" fill="var(--h3)">each one: +0.3 seconds</text></g>'+
    '<rect x="4" y="52" width="312" height="72" rx="10" fill="var(--soft2)"/><path d="M8 88H312" stroke="var(--card)" stroke-width="2" stroke-dasharray="10 8"/>';
  const car=(x,y,col)=>'<rect x="'+x+'" y="'+y+'" width="26" height="16" rx="4" fill="var('+col+')"/><rect x="'+(x+15)+'" y="'+(y+3)+'" width="7" height="10" rx="2" fill="var(--card)" opacity=".75"/>';
  for(let r=0;r<2;r++)for(let k=0;k<8;k++)s+='<g class="hcar">'+car(50+k*33,60+r*36,'--h1')+'</g>';
  s+='<g id="hnew" class="cc-car" style="transform:translate(-60px,0)">'+car(14,60,'--h3')+'</g>'+
    '<g id="hlb" class="cc-fade" opacity="0"><text x="10" y="146" font-size="11" font-weight="700" fill="var(--h3)">new driver: 40 min, same as the train</text><text x="310" y="166" text-anchor="end" font-size="12" font-weight="700" fill="var(--no)">cost to others: 20 minutes, unpaid</text></g>';
  L.$('#hsv').innerHTML=s;
  L.$('#ha').onclick=()=>{L.$('#ha').disabled=true;L.$('#hnew').style.transform='translate(0,0)';
    setTimeout(()=>{if(!L.$('#hbr'))return;L.$('#hbr').setAttribute('opacity',1);L.$('#hlb').setAttribute('opacity',1);L.$$('.hcar').forEach(g=>g.setAttribute('opacity',.7));L.$('#htw').hidden=false;},500);
    L.sheet('info','Each driver ignores the delay they add for others','Nobody charges the new driver for the 20 minutes they cost everyone else, so they count only their own trip. That '+L.g('spillover','spillover')+' is why the crowd overuses the road. The book’s fixes: hand out 2,000 licences to drive, rotated monthly so it’s fair, or charge a toll that prices the harm.');L.done();};}},

{part:0,src:'Chapter 9 · The Route Less Traveled',pts:1,
 solve:async L=>{ccSet(L,'#ts',2);L.$('#tl').click();},
 run(L){
  let fin=false;
  L.h(L.kick('pr','Challenge · price the harm')+'<h1 class="q">No planner this time. Set a toll so that free choice lands on the best split by itself: 2,000 drivers.</h1>'+
   '<p class="cc-ill">The book’s assumption: people value time at $12 an hour, so each $1 feels like 5 minutes. The toll is charged on top of the train fare.</p>'+
   '<div id="td"></div>'+ccSlider('ts','Toll',0,4,0.5,0,'$0')+
   '<div class="cc-ctl"><button class="btn" id="tg">'+L.ic('play')+'Let people choose</button><button class="btn pri" id="tl">'+L.ic('check')+'Lock in this toll</button></div>');
  const R=ccRoads(L,L.$('#td'),{n:4000});
  L.$('#ts').addEventListener('input',e=>{const v=+e.target.value;L.$('#tsv').textContent='$'+v;R.setToll(v);});
  L.$('#tg').onclick=()=>R.drift(R.eqN());
  L.$('#tl').onclick=()=>{if(fin)return;fin=true;const t=R.toll,ok=t===2;L.award(ok);L.$('#ts').disabled=true;L.$('#tg').disabled=true;
    R.drift(R.eqN(),()=>{L.sheet(ok?'ok':'no',ok?'$2 does it: free choice finds 2,000':'The toll that works is $2',
      (ok?'':'At $'+t+', free choice settles at '+NF(R.eqN())+' drivers. ')+'$2 feels like 10 minutes, so drivers face 30 minutes plus $2, the same as 40 on the train. Free choice settles at 2,000 drivers, the best split, with no planner, and the toll raises $4,000 a morning that can lower other taxes. A toll makes each driver feel the harm they cause.');L.done();});};}},

{part:1,src:'Chapter 9 · Faster Than a Speeding Ticket',
 solve:async L=>{['w','b'].forEach(k=>L.$('#kk [data-k="'+k+'"]').click());},
 run(L){
  let fin=false;const seen=new Set();
  L.h(L.kick('learn','Two kinds of crowd')+'<h1 class="q">Does more company make a choice worse, or better? Flip between the two.</h1>'+
   '<div class="cc-ctl" id="kk"></div><svg class="cc-svg" id="ksv" viewBox="0 0 320 200" role="img" aria-label="How good each choice is for you, as more people make it"></svg><p class="cc-cap" id="kcap"></p>');
  function draw(k){let s='<text x="40" y="16" font-size="11" font-weight="700" fill="var(--muted)">HOW GOOD EACH CHOICE IS FOR YOU</text><rect x="40" y="26" width="262" height="134" rx="6" fill="var(--soft)"/>';
    if(k==='w'){s+='<path d="M40 40L302 150" stroke="var(--h1)" stroke-width="3"/><path d="M40 84H302" stroke="var(--h2)" stroke-width="3"/>'+
       '<text x="46" y="70" font-size="11" font-weight="700" fill="var(--h1)">drive</text><text x="296" y="78" text-anchor="end" font-size="11" font-weight="700" fill="var(--h2)">train</text>'+
       '<circle cx="145" cy="84" r="6" fill="var(--ok)"/><text x="145" y="104" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ok)">settles here</text>'+
       ccArrow(52,176,128,176,'--ok',3)+ccArrow(292,176,162,176,'--ok',3)+
       '<text x="40" y="196" font-size="11" fill="var(--muted)">nobody drives</text><text x="302" y="196" text-anchor="end" font-size="11" fill="var(--muted)">everyone drives</text>';}
    else{s+='<path d="M40 150L302 40" stroke="var(--h1)" stroke-width="3"/><path d="M40 40L302 150" stroke="var(--h4)" stroke-width="3"/>'+
       '<text x="196" y="44" font-size="11" font-weight="700" fill="var(--h1)">keep the limit</text><text x="46" y="70" font-size="11" font-weight="700" fill="var(--h4)">speed</text>'+
       '<circle cx="171" cy="95" r="6" fill="var(--card)" stroke="var(--no)" stroke-width="2.5"/><text x="171" y="80" text-anchor="middle" font-size="11" font-weight="700" fill="var(--no)">tipping point</text>'+
       ccArrow(160,176,50,176,'--no',3)+ccArrow(182,176,292,176,'--no',3)+
       '<circle cx="44" cy="40" r="5" fill="var(--ok)"/><circle cx="298" cy="40" r="5" fill="var(--ok)"/>'+
       '<text x="40" y="196" font-size="11" fill="var(--muted)">everyone speeds</text><text x="302" y="196" text-anchor="end" font-size="11" fill="var(--muted)">everyone keeps the limit</text>';}
    L.$('#ksv').innerHTML=s;
    L.$('#kcap').innerHTML=k==='w'?'<b>Company makes it worse.</b> Each extra driver slows the road, so driving loses appeal as more drive. The crowd settles in a mix where both choices are equal.':
      '<b>Company makes it better.</b> When most keep the limit, speeding means weaving and getting caught; when most speed, you’re safest going with the flow. The middle is a '+L.g('tipping','tipping point')+': the crowd runs to one end.';}
  [['w','Company makes it worse'],['b','Company makes it better']].forEach(q=>{const b=document.createElement('button');b.className='chip';b.dataset.k=q[0];b.textContent=q[1];

      if(seen.size===2&&!fin){fin=true;L.sheet('info','The shape tells you where the crowd goes','If company hurts (roads, queues), expect a mix. If company helps (keyboards, apps, habits, speeding), expect the crowd to end up at one extreme, and either extreme can last. Like chapter 4’s meeting places, any convention can hold once everyone expects it, even a worse one.');L.done();}};
    L.$('#kk').appendChild(b);});
  draw('w');}},

{part:1,src:'Chapter 9 · Catch-22?',
 solve:async L=>{ccSet(L,'#qs',85);L.$('#qg').click();await L.sleep(2600);ccSet(L,'#qs',60);L.$('#qg').click();},
 run(L){
  let fin=false;const seen=new Set();
  L.h(L.kick('learn','Explore · the bandwagon')+'<h1 class="q">Each new typist learns the keyboard layout most others use. Set QWERTY’s share today, then let new typists choose.</h1>'+
   '<p class="cc-ill">Curve drawn from the book’s numbers: at 85% QWERTY, 95% of new typists learn it; below 70%, most learn the faster rival layout.</p>'+
   '<div id="qd"></div>'+ccSlider('qs','QWERTY’s share today',0,100,1,60,'60%')+
   '<div class="cc-ctl"><button class="btn pri" id="qg">'+L.ic('play')+'Let new typists choose</button></div>');
  const C=ccCurve(L,L.$('#qd'),{pts:CV_QWERTY,x:.6,stable:[0,.98],tip:.72,xl:'typists using QWERTY now',yl:'new typists learning it',
    labels:[[252,30,'stable 98%','end'],[52,184,'stable 0%']],onStep:v=>{L.$('#qs').value=Math.round(v*100);L.$('#qsv').textContent=PC(v);}});
  L.$('#qs').addEventListener('input',e=>{const v=+e.target.value/100;L.$('#qsv').textContent=PC(v);C.set(v);});
  L.$('#qg').onclick=()=>{const x0=C.x;if(Math.abs(x0-.72)<.005){C.draw();return;}L.$('#qg').disabled=true;L.$('#qs').disabled=true;
    C.run(()=>{L.$('#qg').disabled=false;L.$('#qs').disabled=false;seen.add(x0>.72?'hi':'lo');
      if(seen.size===2&&!fin){fin=true;L.sheet('info','Two ends that last, one point that doesn’t','Above 72%, more than that share of new typists learn QWERTY, so it grows to 98% (a few always choose the faster layout). Below 72%, the rival takes over completely. The '+L.g('tipping','tipping point')+' between them can’t hold: any wobble sends the crowd to one end. Economists call this a bandwagon.');L.done();}});};}},

{part:1,src:'Chapter 9 · Catch-22?',pts:1,
 solve:async L=>{L.$('#wq').children[0].click();},
 run(L){
  let fin=false;
  L.h(L.kick('try','Predict, then watch')+'<h1 class="q">QWERTY sits at 98%. A keen group retrains so that 10% of all typists switch to the faster layout. What happens next?</h1>'+
   '<div id="wd"></div><div class="opts" id="wq"></div>');
  const C=ccCurve(L,L.$('#wd'),{pts:CV_QWERTY,x:.98,stable:[0,.98],tip:.72,xl:'typists using QWERTY now',yl:'new typists learning it',h:170,labels:[[252,30,'stable 98%','end']]});
  ['QWERTY climbs back to 98%','It settles at 88%','The faster layout takes over'].forEach((t,j)=>{const x=document.createElement('button');x.className='opt';x.innerHTML='<span class="key">'+(j+1)+'</span><span>'+t+'</span>';
    x.onclick=()=>{if(fin)return;fin=true;const ok=j===0;L.award(ok);x.classList.add(ok?'ok':'no');if(!ok)L.$('#wq').children[0].classList.add('ok');
      C.set(.88);setTimeout(()=>{if(!L.$('#wd').isConnected)return;C.run(()=>{L.sheet(ok?'ok':'no',ok?'Back to 98%':'It climbs back to 98%','88% is still above the tipping point, so most new typists keep learning QWERTY and it climbs back. No one group can change a convention. You don’t need everyone, though: if the big computer makers agreed, or a major employer retrained its staff, the share could drop below 72% and the bandwagon would carry the rest. That’s a '+L.g('critical-mass','critical mass')+'.');L.done();});},350);};
    L.$('#wq').appendChild(x);});}},

{part:1,src:'Chapter 9 · Catch-22?',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">Why the slower layout won: history, not quality</h1>'+
   '<svg class="cc-svg" viewBox="0 0 320 96" role="img" aria-label="Top rows of two keyboards: QWERTY, and the faster Dvorak layout"></svg>');
  const row=(y,keys,col,lab)=>'<text x="6" y="'+(y-6)+'" font-size="11" font-weight="700" fill="var('+col+')">'+lab+'</text>'+keys.map((k,j)=>'<rect x="'+(6+j*31)+'" y="'+y+'" width="27" height="27" rx="5" fill="var(--card)" stroke="var('+col+')" stroke-width="1.5"/><text x="'+(19.5+j*31)+'" y="'+(y+18)+'" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink)">'+k+'</text>').join('');
  L.$('svg.cc-svg').innerHTML=row(16,['Q','W','E','R','T','Y','U','I','O','P'],'--h1','QWERTY · 1873: built to slow typists down')+row(64,['’',',','.','P','Y','F','G','C','R','L'],'--h2','DVORAK · fingers travel less than half as far');
  L.beats(L.card,[
   ['1873','QWERTY spread the most-used letters apart so keys on manual typewriters wouldn’t jam. By 1904 mass production had made it the standard.'],
   ['Then','Electric machines and computers ended the jamming. Dvorak’s layout cuts finger travel by over half; the book says the same text takes 5 to 10% less time to type.'],
   ['The catch','A wartime US Navy study said retraining paid for itself in ten days, but critics found Dvorak himself was involved in it, and a 1956 study found retrained typists needed a month to catch up. Beginners also learn on labelled QWERTY keys.'],
   ['Not just keys','Petrol cars beat steam partly because a 1914 animal-disease outbreak removed the horse troughs steam cars refilled from. Light-water nuclear reactors won because the US Navy chose them for compact submarines.']],
   'History matters. Once one option has a head start, a better one may never get the chance (that’s '+L.g('lock-in','lock-in')+'). The time to think hardest is early, before a standard sets: ask what will be best later, not just what works today.');}},

{part:1,src:'Chapter 9 · Faster Than a Speeding Ticket',
 solve:async L=>{L.$('#sm').click();await L.sleep(2400);L.$('#si').click();},
 run(L){
  let fin=false;const seen=new Set(),hist={};
  L.h(L.kick('ex','Short and intense')+'<h1 class="q">Only 10% of drivers keep the speed limit. The police have the same total effort for two plans. Which one makes keeping the limit stick?</h1>'+
   '<div id="sd"></div><svg class="cc-svg" id="smo" viewBox="0 0 320 96" role="img" aria-label="Share of drivers keeping the limit, month by month, for each plan"></svg>'+
   '<p class="cc-ill">Illustrative numbers: both plans move 60 points of drivers in total; this crowd’s tipping point is 50%.</p>'+
   '<div class="cc-ctl"><button class="btn" id="sm">'+L.ic('clock')+'Mild: a little for 12 months</button><button class="btn" id="si">'+L.ic('flame')+'Intense: hard for 3 months</button></div>');
  const C=ccCurve(L,L.$('#sd'),{pts:CV_SPEED,x:.1,stable:[.1,1],tip:.5,xl:'drivers keeping the limit now',yl:'next month',h:160,
    ro:(x)=>'Keeping the limit now: <b>'+PC(x)+'</b>'});
  const MX=m=>40+m*14.7,MY=v=>80-v*64;
  function chart(){let s='<rect x="40" y="10" width="265" height="70" rx="6" fill="var(--soft)"/><path d="M40 '+MY(.5)+'H305" stroke="var(--no)" stroke-width="1" stroke-dasharray="4 3"/>'+
    '<text x="36" y="'+(MY(1)+4)+'" text-anchor="end" font-size="11" fill="var(--muted)">100%</text><text x="36" y="'+(MY(0)+4)+'" text-anchor="end" font-size="11" fill="var(--muted)">0%</text>'+
    '<text x="40" y="94" font-size="11" fill="var(--muted)">month 0</text><text x="305" y="94" text-anchor="end" font-size="11" fill="var(--muted)">month 18</text>';
    [['m','--h2','mild'],['i','--h1','intense']].forEach(q=>{const h=hist[q[0]];if(!h||h.length<2)return;s+='<path d="'+h.map((v,j)=>(j?'L':'M')+MX(j).toFixed(1)+' '+MY(v).toFixed(1)).join('')+'" fill="none" stroke="var('+q[1]+')" stroke-width="2.5"/><text x="'+(MX(h.length-1)-2).toFixed(1)+'" y="'+(MY(h[h.length-1])+(h[h.length-1]>.5?14:-5)).toFixed(1)+'" text-anchor="end" font-size="11" font-weight="700" fill="var('+q[1]+')">'+q[2]+'</text>';});
    L.$('#smo').innerHTML=s;}
  chart();
  function plan(k,push,months){L.$('#sm').disabled=L.$('#si').disabled=true;let x=.1,m=0;hist[k]=[x];C.set(x);
    const tick=()=>{if(!L.$('#smo')||!L.$('#smo').isConnected)return;m++;if(m<=months)x=Math.min(1,x+push);x=x+.5*(C.f(x)-x);hist[k].push(x);C.set(x,true);chart();
      if(m<18)setTimeout(tick,100);else{L.$('#sm').disabled=L.$('#si').disabled=false;seen.add(k);
        L.fb(L.card,k==='m'?'<b>Mild:</b> compliance creeps up to about 20%, never reaches the tipping point, and drifts back to 10% once the pressure stops.':'<b>Intense:</b> the push carries drivers past 50%; after that keeping the limit is the safe choice, so it climbs to nearly everyone with no more pressure.',k==='m'?'no':'ok');
        if(seen.size===2&&!fin){fin=true;L.sheet('info','Short and intense beats long and mild','Effort pays only if it gets a critical mass past the tipping point; then the new habit holds itself and enforcement can ease off. The book applies this to any shared bad habit, from speeding to arriving at parties an hour late, and to heavy cars: the more there are, the more everyone wants one.');L.done();}}};
    tick();}
  L.$('#sm').onclick=()=>plan('m',.05,12);L.$('#si').onclick=()=>plan('i',.2,3);}},

{part:1,src:'Chapter 9 · Faster Than a Speeding Ticket',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Mix or tip?',['Settles in a mix','Tips to one end'],[
   ['Two lunch spots near Plover. The busier one gets slower to serve.',0,'Company makes it worse: as one fills up, the other looks better, so people spread out.'],
   ['Which chat app the five-a-side team uses. The more players on one app, the more useful it is.',1,'Company makes it better: the team ends up all on one app, whichever got ahead.'],
   ['Bikes dumped in the walkway of the building’s bike store. The more bikes already there, the less anyone minds adding one.',1,'A tidy store tends to stay tidy and a messy one gets messier: it tips either way.'],
   ['Two checkout queues at the supermarket.',0,'A longer queue is worse, so shoppers spread between the two until the waits are about equal.'],
   ['Turning up on time to Hedda’s choir. If most arrive late, coming on time just means waiting around.',1,'Company makes lateness pay: the group ends up all late or all on time. A short, firm push can tip it to on time.']]);}},

{part:1,src:'Chapter 9 · Catch-22?',pts:1,
 solve:async L=>{for(let k=0;k<6;k++)L.$('#tp').click();L.$('#tk').click();},
 run(L){
  let fin=false,k=0;
  L.h(L.kick('pr','Challenge · tip the team')+'<h1 class="q">Plover’s 20 people are stuck on an old file-sharing tool. Only 3 use the new one, which is better once enough do. How few early movers does Greer need?</h1>'+
   '<div id="td"></div><p class="cc-ill">Illustrative curve. Purple dots: people on the new tool.</p>'+
   '<div class="cc-ctl"><button class="btn" id="tm" aria-label="One fewer early mover">−</button><span class="cc-cnt" id="tc">0 early movers</span><button class="btn" id="tp" aria-label="One more early mover">+</button></div>'+
   '<div class="cc-ctl"><button class="btn" id="tg">'+L.ic('play')+'Let the team settle</button><button class="btn pri" id="tk">'+L.ic('check')+'Lock in plan</button></div>');
  const C=ccCurve(L,L.$('#td'),{pts:CV_TOOL,x:.15,people:20,stable:[0,1],tip:.42,xl:'share on the new tool now',yl:'share picking it next',h:170,
    ro:(x,fx)=>'On the new tool: <b>'+Math.round(x*20)+' of 20</b> · next week: <b>'+PC(fx)+'</b>'+(fx>x+.002?' → <b style="color:var(--ok)">spreads</b>':fx<x-.002?' → <b style="color:var(--no)">fades</b>':'')});
  const sync=()=>{L.$('#tc').textContent=k+' early mover'+(k===1?'':'s');C.set((3+k)/20);};
  L.$('#tp').onclick=()=>{if(fin||k>=17)return;k++;sync();};L.$('#tm').onclick=()=>{if(fin||k<=0)return;k--;sync();};
  L.$('#tg').onclick=()=>{C.set((3+k)/20);L.$('#tg').disabled=true;C.run(()=>{L.$('#tg').disabled=fin;});};
  L.$('#tk').onclick=()=>{if(fin)return;fin=true;const ok=k===6;L.award(ok);['#tg','#tm','#tp'].forEach(s=>L.$(s).disabled=true);C.set((3+k)/20);C.run();
    L.sheet(ok?'ok':'no',ok?'6 is the fewest that tips it':(k<6?'Not enough to tip it':'It works, but 6 would do'),
      (ok?'':'With '+k+' early mover'+(k===1?'':'s')+', '+(3+k)+' of 20 use the new tool. ')+'Six take it to 9 of 20 (45%), just past the tipping point, and the rest follow on their own. Five leave it at 40%, and people drift back to the old tool. You never need to convert everyone, only a critical mass, all at once.');L.done();};}},

/* ---------- PART 3: SLOPES AND SIDE EFFECTS ---------- */
{part:2,src:'Chapter 9 · It Can Be Lonely at the Top',
 solve:async L=>{for(let k=0;k<10;k++){L.$('#vr').click();await L.sleep(5);}L.$('#vp').click();},
 run(L){
  let c=1,fin=false,votes=null;
  L.h(L.kick('ex','A case from the book')+'<h1 class="q">A law firm lets its ten junior lawyers vote on the bar for partner, one notch at a time. Run the votes.</h1>'+
   '<p class="cc-ill">The book’s made-up firm. Each lawyer privately knows their rating, 1 to 10; a majority sets the bar.</p>'+
   '<svg class="cc-svg" id="vsv" viewBox="0 0 320 132" role="img" aria-label="Ten lawyers in a row, rated 1 to 10, with the partnership bar and each one’s vote"></svg>'+
   '<div class="cc-leg"><span><i style="background:var(--ok)"></i>at or above the bar: makes partner</span><span><i style="background:var(--line2)"></i>below the bar: must leave</span></div>'+
   '<p class="cc-ro" id="vro" aria-live="polite"></p>'+
   '<div class="cc-ctl"><button class="btn pri" id="vr">'+L.ic('arrow')+'Propose: raise the bar one notch</button><button class="btn" id="vp" hidden>'+L.ic('layers')+'Vote on the whole package instead</button></div>');
  const PX=j=>18+j*31.6;
  function draw(){let s='';
    for(let j=0;j<10;j++){const r=j+1,p=r>=c,x=PX(j);
      s+='<circle cx="'+x+'" cy="58" r="8" fill="var('+(p?'--ok-bg':'--soft2')+')" stroke="var('+(p?'--ok':'--line2')+')" stroke-width="2"/>'+
        '<path d="M'+(x-11)+' 94v-14a11 11 0 0 1 22 0v14z" fill="var('+(p?'--ok-bg':'--soft2')+')" stroke="var('+(p?'--ok':'--line2')+')" stroke-width="2"/>'+
        '<text x="'+x+'" y="90" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--ink)">'+r+'</text>';
      if(votes){const yes=votes[j];s+='<g class="cc-vote"><circle cx="'+x+'" cy="26" r="9" fill="var('+(yes?'--ok':'--no')+')"/><path d="'+(yes?'M'+(x-4)+' 26l3 3 5-6':'M'+(x-3.5)+' 22.5l7 7M'+(x+3.5)+' 22.5l-7 7')+'" stroke="var(--card)" stroke-width="2.2" fill="none" stroke-linecap="round"/></g>';}}
    if(c<=10){const bx=PX(c-1)-15.8;s+='<path d="M'+bx+' 40V104" stroke="var(--no)" stroke-width="2.5" stroke-dasharray="5 3"/><text x="'+bx+'" y="120" text-anchor="'+(c===1?'start':c>=10?'end':'middle')+'" font-size="11" font-weight="700" fill="var(--no)">bar: '+c+'</text>';}
    else s+='<path d="M312 40V104" stroke="var(--no)" stroke-width="2.5" stroke-dasharray="5 3"/><text x="312" y="120" text-anchor="end" font-size="11" font-weight="700" fill="var(--no)">bar: 11 · nobody</text>';
    L.$('#vsv').innerHTML=s;}
  function say(h){L.$('#vro').innerHTML=h;}
  draw();say('Bar 1: <b>all ten make partner</b>. Everyone prefers this to the old days, when nobody did.');
  L.$('#vr').onclick=()=>{if(c>10)return;votes=Array.from({length:10},(_,j)=>j+1!==c);const lose=c;c++;draw();
    const n=Math.max(0,11-c);
    say('Vote '+lose+': raise the bar to '+c+'? <b>9 yes · 1 no</b>. Only lawyer '+lose+' objects: those above get a stronger partnership, those below hide among more people who missed.<br>Partners now: <b>'+n+' of 10</b>');
    if(c>10){L.$('#vr').hidden=true;L.$('#vp').hidden=false;say('Ten votes, each passed <b>9 to 1</b>. Bar 11: <b>nobody makes partner</b>, the outcome all ten liked least. Each lawyer won nine small votes and lost one big one.');}};
  L.$('#vp').onclick=()=>{if(fin)return;fin=true;c=1;votes=Array(10).fill(true);draw();L.$('#vp').disabled=true;
    say('Package vote: “all ten make partner” or “nobody does”? <b>10 yes · 0 no</b> for everyone. Seen whole, nobody wants the end of the slope.');
    L.sheet('info','Each step looked good; the end was worse for all','Votes count heads, not how strongly people feel: nine small gains beat one big loss every time. That’s a '+L.g('slippery-slope','slippery slope')+', and no single person can stop it. The group must look ahead and reason back together and agree to vote only on the package, so everyone sees where they’ll end up. (The lowest-rated lawyer’s logic is real too: when others judge your ability, failing at something hard costs you less.)');L.done();};}},

{part:2,src:'Chapter 9 · It Can Be Lonely at the Top',pts:1,run(L){
  L.h(L.kick('pr','Practice · Greer’s hiring bar')+'<h1 class="q">To hire a junior designer, Greer’s team votes each week on raising the portfolio bar one notch. Each raise passes easily, and now no candidate meets it. What should Tali propose?</h1>');
  L.mc(L.card,['Let it run: a higher bar can only mean a better hire','Vote against each raise, alone, every week','Agree the final bar as one package before any more steps'],2,
   'Step-by-step votes can slide to an end nobody wants: here, no hire at all and a team stretched for months. Deciding the package first lets everyone see where they’ll end up. One person voting no each week can’t stop the slope; the group has to agree the rule.',
   'One “no” each week gets outvoted, and “let it run” ends with no hire and a team stretched for months. The way off the slope is to agree the end point, the final bar, as one package before taking more steps.');}},

{part:2,src:'Chapter 9 · Case Study: A Prescription for Allocating Dentists',pts:1,
 solve:async L=>{L.$('#dq').children[0].click();},
 run(L){
  let fin=false;
  L.h(L.kick('ex','A case from the book')+'<h1 class="q">100,000 new dentists choose a city or a country practice, purely for income. Free choice settles at E. Is E best for society?</h1>'+
   '<svg class="cc-svg" id="dsv" viewBox="0 0 320 206" role="img" aria-label="City dentists’ income falls as more choose the city; rural income stays flat; they cross at E"></svg>'+
   '<p class="cc-ill">The book’s chart gives the shape, not the numbers.</p><div class="opts" id="dq"></div>');
  function draw(rev){let s='<text x="40" y="14" font-size="11" font-weight="700" fill="var(--muted)">INCOME PER DENTIST</text><rect x="40" y="22" width="262" height="134" rx="6" fill="var(--soft)"/>'+
     '<path d="M40 36L302 146" stroke="var(--h1)" stroke-width="3"/><path d="M40 91H302" stroke="var(--h2)" stroke-width="3"/>'+
     '<text x="46" y="70" font-size="11" font-weight="700" fill="var(--h1)">city</text><text x="296" y="85" text-anchor="end" font-size="11" font-weight="700" fill="var(--h2)">countryside</text>'+
     '<circle cx="171" cy="91" r="6" fill="var(--ink)"/><text x="160" y="108" text-anchor="end" font-size="12" font-weight="700" fill="var(--ink)">E</text>'+
     '<text x="40" y="172" font-size="11" fill="var(--muted)">0 in the city</text><text x="302" y="172" text-anchor="end" font-size="11" fill="var(--muted)">100,000 in the city</text>';
    if(rev)s+=ccArrow(196,96,196,138,'--no',3)+ccArrow(230,86,230,44,'--ok',3)+
      '<text x="190" y="150" text-anchor="end" font-size="11" font-weight="700" fill="var(--no)">city dentists earn less</text>'+
      '<text x="224" y="50" text-anchor="end" font-size="11" font-weight="700" fill="var(--ok)">patients pay less</text>'+
      '<rect x="88" y="184" width="144" height="18" rx="9" fill="var(--ok-bg)"/><text x="160" y="197" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ok)">they cancel out</text>';
    L.$('#dsv').innerHTML=s;}
  draw(false);
  ['Yes: what city dentists lose, their patients gain','No: too many crowd into the city, like the bridge','No: too few choose the countryside'].forEach((t,j)=>{const x=document.createElement('button');x.className='opt';x.innerHTML='<span class="key">'+(j+1)+'</span><span>'+t+'</span>';
    x.onclick=()=>{if(fin)return;fin=true;const ok=j===0;L.award(ok);x.classList.add(ok?'ok':'no');if(!ok)L.$('#dq').children[0].classList.add('ok');draw(true);
      L.sheet(ok?'ok':'no',ok?'Free choice gets this one right':'Here free choice gets it right','An extra city dentist lowers other city dentists’ fees, and patients gain exactly that. On the bridge, nobody gained from the extra delay. When the side effect is only a price change, it cancels out. (Dentists as a group might still want fewer city practices, say by funding students who promise to work rurally. That serves dentists, not society.)');L.done();};
    L.$('#dq').appendChild(x);});}},

{part:2,src:'Chapter 9 · A Recapitulation',pts:6,run(L){
  L.h(L.kick('pr','Tali’s week · pick the fix')+'<h1 class="q">Which fix fits each crowd problem?</h1>');
  L.buckets(L.card,['Price the harm','Push past the tipping point','An outside rule','Agree the end point first'],[
   ['Plover’s “stay till 7” habit: everyone stays to look keen, and nobody’s standing changes.',2,'A rat race. A visible limit everyone must keep, set by Greer from outside the race, ends it.'],
   ['The team is stuck on an old file tool everyone knows, though the new one is better once enough people use it.',1,'Two stable ends. Get a critical mass to move at once and the rest follow.'],
   ['The town’s road jams at rush hour because each driver ignores the delay they add.',0,'A spillover nobody pays for. A charge set to the harm makes each driver count it.'],
   ['Greer’s team raises the hiring bar one notch per meeting.',3,'A slippery slope. Agree the final bar as a package before the next step.'],
   ['Thursday kick-off drifts later every month, because most players turn up late.',1,'A habit that tips. Two firm weeks of starting sharp on time can move enough players; then it holds.'],
   ['In Hedda’s choir, each singer sings louder to hear themselves, so everyone ends up shouting.',2,'A race for who’s heard. The conductor setting the volume for all ends it.']],
   'Spillover you can charge for → price it. Several stable outcomes → move a critical mass past the tip, briefly and hard. A race for rank → a rule from outside that everyone can see. A step-by-step slide → agree the package first.');}},

/* ---------- PART 4: USE IT THIS WEEK ---------- */
{part:3,src:'Course application · built on Chapter 9',pts:1,
 solve:async L=>{for(let k=0;k<3;k++){L.$('#ob').click();await L.sleep(10);}L.$('#oq').children[0].click();},
 run(L){
  let s=0,fin=false;
  L.h(L.kick('pr','One-minute move')+'<h1 class="q">Plover moves to an edge-of-town office. Its 40 staff choose the ring road or the tram, and by 9 a.m. the ring road crawls. Run the move.</h1>'+
   L.note('How this course applies the book: a one-minute routine built only from this chapter’s ideas.','compass')+
   '<div class="cc-steps" id="osp"><span>1 · Spillover?</span><span>2 · Race for rank?</span><span>3 · Mix or tip?</span><span>4 · Pick the fix</span><span>5 · End point?</span></div>'+
   '<div id="od"></div><p class="cc-ill">Illustrative numbers: ring road 20 minutes empty, 1 more per car; tram 40. Each dot is one person.</p>'+
   '<div class="cc-say" id="osay" aria-live="polite"></div><div class="cc-ctl"><button class="btn pri" id="ob">'+L.ic('arrow')+'Next</button></div><div class="opts" id="oq"></div>');
  const R=ccRoads(L,L.$('#od'),{N:40,per:1,base:20,slope:1,train:40,n:20,road:'RING ROAD',rail:'TRAM',railWord:'tram',total:true});
  const say=(h,x)=>L.$('#osay').innerHTML='<b>'+h+'</b>'+x;
  function go(n){s=n;L.$$('#osp span').forEach((p,j)=>p.className=j<n?'dn':j===n?'cur':'');
    if(n===0)say('STEP 1 · A SPILLOVER NOBODY PAYS FOR?','Yes: each extra car adds a minute for every other driver, and no one is charged for it.');
    if(n===1)say('STEP 2 · A RACE FOR RANK?','No: nobody wins by arriving before colleagues. It’s about time, not position.');
    if(n===2)say('STEP 3 · SETTLES IN A MIX, OR TIPS?','More cars make the road worse, so it settles in a mix: 20 drive and everyone takes 40 minutes. Best for the group: 10 drivers at 30 minutes.');
    if(n===3){L.$('#ob').parentNode.hidden=true;say('STEP 4 · PICK THE FIX','Which fix would Tali suggest to Greer?');
      ['Ten parking permits, rotated weekly so everyone shares them','Ask everyone to drive: the road is quick when empty','Leave it: free choice always finds the best split'].forEach((t,j)=>{const x=document.createElement('button');x.className='opt';x.innerHTML='<span class="key">'+(j+1)+'</span><span>'+t+'</span>';
        x.onclick=()=>{if(fin)return;fin=true;const ok=j===0;L.award(ok);x.classList.add(ok?'ok':'no');if(!ok)L.$('#oq').children[0].classList.add('ok');
          R.o.extra=()=>'<br><b>Permits hold it:</b> only 10 may drive each week.';R.drift(10);L.$$('#osp span').forEach(p=>p.className='dn');say('STEP 5 · A STEP-BY-STEP VOTE?','Not here. If the permit rule gets decided in small votes, agree the end point first.');
          L.sheet(ok?'ok':'no',ok?'Rotating permits fix the jam fairly':'Rotating permits fix it','Ten permits keep the ring road at 30 minutes for drivers, the tram stays at 40, and the group saves 100 minutes a morning. Rotating them shares the fast road fairly, like the book’s monthly licences. A small parking charge would work too, if collecting it costs less than the time it saves. Asking everyone to drive gives the worst jam of all.');L.done();};
        L.$('#oq').appendChild(x);});}}
  L.$('#ob').onclick=()=>{if(s<3)go(s+1);};go(0);}},

{part:3,src:'Chapter 9 · A Recapitulation',
 solve:async L=>{L.$$('#lp button').forEach(b=>b.click());},
 run(L){
  let fin=false;
  L.h(L.kick('ex','Edge cases and limits')+'<h1 class="q">Where does “coordinate the group” stop working? Try each case.</h1>'+
   '<div class="cc-chips" id="lp"></div><svg class="cc-svg" id="lv" viewBox="0 0 320 120" role="img" aria-label="Small picture for this case"></svg><div id="lf"></div>');
  const bg='<rect width="320" height="120" rx="14" fill="var(--soft)"/>';
  const car=(x,y,col)=>'<rect x="'+x+'" y="'+y+'" width="22" height="13" rx="3" fill="var('+col+')"/>';
  const PR=[
   ['One person can’t change it',()=>{let s=bg;for(let k=0;k<20;k++){const x=22+k*14.5;s+='<circle cx="'+x+'" cy="'+(k===6?34:66)+'" r="5.5" fill="var('+(k===6?'--pri':'--soft2')+')" stroke="var('+(k===6?'--pri':'--line2')+')" stroke-width="1.2"/>';}
      return s+'<path d="M'+(22+6*14.5+9)+' 36q22 8 6 26" fill="none" stroke="var(--no)" stroke-width="2"/>'+ccArrow(127,56,121,63,'--no',2)+'<text x="160" y="100" text-anchor="middle" font-size="11" fill="var(--muted)">a lone mover is pulled back to the crowd</text>';},
    'One typist, one early leaver, one driver keeping the limit: below the tipping point, the crowd pulls them back. Change needs a critical mass, or an outside rule.'],
   ['History locks it in',()=>bg+'<path d="M20 60C110 60 140 32 300 32" fill="none" stroke="var(--h1)" stroke-width="9" stroke-linecap="round"/><path d="M20 60C110 60 140 88 300 88" fill="none" stroke="var(--line2)" stroke-width="2.5" stroke-dasharray="6 5"/>'+
      '<text x="296" y="20" text-anchor="end" font-size="11" font-weight="700" fill="var(--h1)">the head start keeps winning</text><text x="296" y="108" text-anchor="end" font-size="11" fill="var(--muted)">the better option never catches up</text>',
    'Once one option is ahead, a better one may never get its chance. And treat “the better option” stories with care: the book notes the evidence for the faster keyboard is disputed.'],
   ['The toll costs more than it saves',()=>{let s=bg+'<rect x="210" y="30" width="30" height="56" rx="4" fill="var(--h3-bg)" stroke="var(--h3)" stroke-width="2"/><text x="225" y="62" text-anchor="middle" font-size="12" font-weight="700" fill="var(--h3)">$</text>';
      for(let k=0;k<6;k++)s+=car(20+k*30,k%2?66:40,'--h1');return s+'<text x="160" y="106" text-anchor="middle" font-size="11" fill="var(--muted)">the queue is at the toll booth</text>';},
    'Creating a price isn’t free. If collecting the toll causes the jam, it may be best to live with the original mess.'],
   ['Pricing can change the good',()=>bg+[[100,'--ok','given freely'],[220,'--no','sold for cash']].map(q=>'<path d="M'+q[0]+' 22c-14 20-20 30-20 42a20 20 0 0 0 40 0c0-12-6-22-20-42z" fill="var('+q[1]+')" opacity=".85"/><text x="'+q[0]+'" y="106" text-anchor="middle" font-size="11" font-weight="700" fill="var('+q[1]+')">'+q[2]+'</text>').join(''),
    'Much of what matters (courtesy, clean air) has no price. Pricing some things changes them: the book notes donated blood tends to be better than bought blood, since people who sell blood are more often in poor health.'],
   ['Crowding the middle',()=>{let s=bg+'<path d="M20 62H300" stroke="var(--line2)" stroke-width="6" stroke-linecap="round"/>';for(let k=0;k<15;k++)s+='<circle cx="'+(26+k*19.3).toFixed(1)+'" cy="44" r="4" fill="var(--h2)"/>';
      return s+'<rect x="146" y="54" width="14" height="16" rx="3" fill="var(--h1)"/><rect x="162" y="54" width="14" height="16" rx="3" fill="var(--h4)"/><text x="153" y="88" text-anchor="end" font-size="11" font-weight="700" fill="var(--h1)">Arlo</text><text x="169" y="88" font-size="11" font-weight="700" fill="var(--h4)">rival cart</text>'+
       ccArrow(60,100,24,100,'--muted',2)+ccArrow(260,100,296,100,'--muted',2)+'<text x="160" y="110" text-anchor="middle" font-size="11" fill="var(--muted)">long walks for the ends</text>';},
    'Arlo’s coffee cart and a rival both edge to the middle of the park, so the ends get two near-identical carts far away: Hotelling’s point about rival parties too. Add a third cart and the middle one is squeezed and keeps jumping: there may be no stable outcome at all.']];
  const seen=new Set();
  PR.forEach((p,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=p[0];b.onclick=()=>{[...L.$('#lp').children].forEach((x,q)=>x.classList.toggle('sel',q===j));L.$('#lv').innerHTML=p[1]();L.$('#lf').innerHTML='';L.fb(L.$('#lf'),p[2],'info');seen.add(j);
    if(seen.size===PR.length&&!fin){fin=true;L.sheet('info','Know where the tool stops','Coordinating a crowd needs a critical mass, a rule people accept, or a price that’s cheap to collect. Watch for lock-in early, don’t price what money would spoil, and remember the free market doesn’t always get it right, but sometimes it does (the dentists).');L.done();}};L.$('#lp').appendChild(b);});
  L.$('#lv').innerHTML=bg+'<text x="160" y="64" text-anchor="middle" font-size="12" fill="var(--muted)">Tap a case above.</text>';}},

{part:3,src:'Chapter 9 · For Whom the Bell Curve Tolls',
 solve:async L=>{L.$('#ct').click();await L.sleep(2600);L.$('#cg').click();},
 run(L){
  let fin=false;const seen=new Set();
  L.h(L.kick('learn','Where cooperation wins')+'<h1 class="q">Plover’s “stay till 7” habit. Only 2 of 20 leave by 6. Who can end it?</h1>'+
   '<div id="cd"></div><p class="cc-ill">Illustrative curve. Purple dots: people leaving by 6.</p>'+
   '<div class="cc-ctl"><button class="btn" id="ct">'+L.ic('person')+'Tali leaves at 6, alone</button><button class="btn" id="cg">'+L.ic('people')+'Greer sets a rule for a month</button></div><p class="cc-cap" id="ccap"></p>');
  const C=ccCurve(L,L.$('#cd'),{pts:CV_SIX,x:.1,people:20,stable:[.1,1],tip:.4,xl:'share leaving by 6 now',yl:'next week',h:170,
    ro:(x)=>'Leaving by 6: <b>'+Math.round(x*20)+' of 20</b> · promotion standings: <b>unchanged</b>'});
  function go(k,x0,cap){L.$('#ct').disabled=L.$('#cg').disabled=true;C.set(x0);L.$('#ccap').innerHTML=cap;
    setTimeout(()=>{if(!L.$('#cd')||!L.$('#cd').isConnected)return;C.run(()=>{L.$('#ct').disabled=L.$('#cg').disabled=false;seen.add(k);
      L.$('#ccap').innerHTML+=k==='t'?' <b>Result:</b> the habit pulls Tali’s share back to 2 of 20, and Tali just looks less keen.':' <b>Result:</b> past the tipping point, leaving by 6 becomes the norm and holds after the month ends.';
      if(seen.size===2&&!fin){fin=true;L.sheet('info','An agreed rule beats a race nobody wins','Alone, Tali only loses ground. A clear rule from outside the race, seen by all and kept by the boss, moves everyone at once, like the Ivy League’s practice limit. Standings stay the same; evenings come back. The book makes the same case for acting together on good causes: many would gladly chip in if they knew everyone else would.');L.done();}});},300);}
  L.$('#ct').onclick=()=>go('t',.15,'Tali leaves at 6 for a week: 3 of 20.');
  L.$('#cg').onclick=()=>go('g',.75,'Greer: “For one month, everyone leaves by 6 unless on call,” and leaves at 6 too: 15 of 20 the first week.');}},

{part:3,src:'Course application · built on Chapter 9',
 solve:async L=>{L.$('#yc').children[0].click();L.$('#y1').value='Answer work chats late at night';L.$('#y2').value='Everyone’s evenings';L.$('#y3').value='Ask 4 teammates to mute after 7 with me for two weeks';['#y1','#y2','#y3'].forEach(s=>L.$(s).dispatchEvent(new Event('input',{bubbles:true})));L.$('#yb').click();},
 run(L){
  L.h(L.kick('pr','Your turn · ungraded')+'<h1 class="q">One thing you do mainly because everyone does. Draw your crowd.</h1>'+
   L.note('How this course applies the book: the one-minute move on your own week.','compass')+
   '<span class="cc-fl">WHAT KIND OF CROWD?</span><div class="cc-chips" id="yc"></div>'+
   '<label class="cc-fl" for="y1">1 · WHAT DOES EVERYONE DO?</label><input class="cc-in" id="y1" maxlength="70" placeholder="e.g. reply to work messages at night">'+
   '<label class="cc-fl" for="y2">2 · WHO PAYS THE HIDDEN COST?</label><input class="cc-in" id="y2" maxlength="70" placeholder="e.g. everyone’s evenings">'+
   '<label class="cc-fl" for="y3">3 · MY MOVE: FIRST MOVERS, A RULE, A PRICE OR AN END POINT</label><input class="cc-in" id="y3" maxlength="80" placeholder="e.g. 4 of us mute after 7 for two weeks">'+
   '<div class="cc-ctl"><button class="btn pri" id="yb" disabled>'+L.ic('people')+'Draw my crowd</button></div><div id="yo"></div>');
  let kind=null;
  ['A race for rank','We all crowd one option','A stuck habit or tool','A step-by-step slide'].forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=n;b.onclick=()=>{kind=n;[...L.$('#yc').children].forEach((x,q)=>x.classList.toggle('sel',q===j));chk();};L.$('#yc').appendChild(b);});
  const v=s=>L.$(s).value.trim();
  function chk(){L.$('#yb').disabled=!(kind&&v('#y1').length>1&&v('#y2').length>1&&v('#y3').length>1);}
  ['#y1','#y2','#y3'].forEach(s=>L.$(s).addEventListener('input',chk));
  L.$('#yb').onclick=()=>{const e=s=>L.esc(v(s));
    const fo=(x,y,w,h,t,c)=>'<foreignObject x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:12px;line-height:1.3;color:var(--ink);overflow:hidden">'+t+'</div></foreignObject>';
    let dots='';for(let k=0;k<20;k++){const fm=k>=16;dots+='<circle cx="'+(24+k*14.5)+'" cy="'+(fm?78:84)+'" r="5.5" fill="var('+(fm?'--pri':'--soft2')+')" stroke="var('+(fm?'--pri':'--line2')+')" stroke-width="1.2"/>';}
    L.$('#yo').innerHTML='<svg class="cc-svg" viewBox="0 0 320 232" role="img" aria-label="Your crowd: what everyone does, the hidden cost, and your first movers"><rect width="320" height="232" rx="14" fill="var(--soft)"/>'+
     '<text x="14" y="22" font-size="11" font-weight="700" fill="var(--muted)">'+L.esc(kind.toUpperCase())+' · EVERYONE:</text>'+fo(14,28,292,34,e('#y1'))+
     dots+'<text x="306" y="104" text-anchor="end" font-size="11" font-weight="700" fill="var(--pri)">a few move first, together</text>'+
     '<rect x="10" y="112" width="300" height="52" rx="10" fill="var(--no-bg)"/><text x="18" y="128" font-size="11" font-weight="700" fill="var(--no)">HIDDEN COST</text>'+fo(18,132,284,30,e('#y2'))+
     '<rect x="10" y="170" width="300" height="54" rx="10" fill="var(--ok-bg)"/><text x="18" y="186" font-size="11" font-weight="700" fill="var(--ok)">MY MOVE</text>'+fo(18,190,284,32,e('#y3'))+'</svg>';
    L.sheet('info','Make it short, visible and shared','Pick a small group that moves together, for a short, intense spell rather than a long, mild one, and make the new habit easy for others to see. Afterwards, note what happened.');L.done();};}},

{part:3,src:'Course application · built on Chapter 9',run(L){
  L.h(L.kick('learn','Your strategy map')+'<h1 class="q">“Coordinate the group” joins three rows of the map</h1>'+
   L.note('How this course applies the book. Later lessons fill the dashed gaps.','compass')+
   '<svg class="cc-svg" viewBox="0 0 320 64" role="img" aria-label="Tool picture: a crowd split between two roads, beside a tipping curve"><rect width="320" height="64" rx="12" fill="var(--soft)"/>'+
   '<path d="M14 32C40 32 50 14 120 14M14 32C40 32 50 50 120 50" fill="none" stroke="var(--line2)" stroke-width="6" stroke-linecap="round"/>'+
   [[60,15],[78,14],[96,14],[64,48],[84,49],[104,50],[38,26],[30,36]].map(p=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3.6" fill="var(--h1)"/>').join('')+
   '<rect x="168" y="8" width="140" height="48" rx="6" fill="var(--card)"/><path d="M174 52L302 12" stroke="var(--line2)" stroke-width="1.3" stroke-dasharray="4 3"/><path d="M174 50C214 50 222 44 238 32S262 12 302 12" fill="none" stroke="var(--h3)" stroke-width="2.5"/><circle cx="238" cy="32" r="4" fill="var(--card)" stroke="var(--no)" stroke-width="2"/>'+
   '<text x="136" y="36" text-anchor="middle" font-size="11" font-weight="700" fill="var(--muted)">+</text></svg>'+
   '<div id="mp"></div>'+
   '<p class="small">It’s the <b>second</b> tool when many people are tempted to grab or slack, and when everyone must land on the same choice; it also helps when a group decides together. Its job: price the harm, move a critical mass, set an outside rule, or agree the end point first.</p>');
  L.$('#mp').innerHTML='<div class="mp-row"><span class="n">0</span><b>Is it a game at all? Will the other side react?</b></div>'+MP_ROWS.map((r,j)=>{const hot=r[1].includes('coord');
    return '<div class="mp-row'+(hot?' hot':'')+'"><span class="n">'+(j+1)+'</span><b>'+r[0]+'</b><div class="t">'+r[1].map((k,q)=>(q?'<span class="mp-ar">→</span>':'')+'<span class="mp-t'+(k==='coord'?' cur':MP_T[k][1]>10?' tbd':'')+'">'+(MP_T[k][1]>10?'?':MP_T[k][0])+'</span>').join('')+'</div></div>';}).join('');
  L.done();}}
  ]
});
</script>
