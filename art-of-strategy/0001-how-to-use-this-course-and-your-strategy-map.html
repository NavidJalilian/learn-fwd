(function(){const st=document.createElement('style');st.textContent=`

/* ---------- small drawing helpers ---------- */
const TGX=v=>24+v*27.2;               /* outcome rail: score 0..10 → x */
const tgIc=(L,n,x,y,s,c)=>L.ic(n).replace('<svg class="i"','<svg x="'+x+'" y="'+y+'" width="'+s+'" height="'+s+'" fill="none" stroke="'+c+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"');
function tgFig(x,y,col,dash,sm){const r=sm?6:9,bw=sm?16:24,bh=sm?16:24,d=dash?' stroke-dasharray="3 2"':'';
  return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="var(--card)" stroke="var('+col+')" stroke-width="2"'+d+'/>'+
   '<rect x="'+(x-bw/2)+'" y="'+(y+r+2)+'" width="'+bw+'" height="'+bh+'" rx="'+(sm?6:9)+'" fill="var('+col+'-bg)" stroke="var('+col+')" stroke-width="2"'+d+'/>';}
function tgObj(sc,x,y){
  if(!sc)return '<circle cx="'+x+'" cy="'+(y+16)+'" r="18" fill="none" stroke="var(--line2)" stroke-width="2" stroke-dasharray="4 4"/><text x="'+x+'" y="'+(y+20)+'" text-anchor="middle" font-size="11" fill="var(--muted)">nobody</text>';
  if(sc.draw==='tyre')return '<circle cx="'+x+'" cy="'+(y+16)+'" r="18" fill="none" stroke="var(--ink)" stroke-width="5"/><circle cx="'+x+'" cy="'+(y+16)+'" r="3" fill="var(--ink)"/>'+
    '<path d="M'+x+' '+(y+1)+'V'+(y+31)+'M'+(x-15)+' '+(y+16)+'H'+(x+15)+'" stroke="var(--muted)" stroke-width="1.5"/>';
  if(sc.draw==='tin')return '<rect x="'+(x-15)+'" y="'+(y+2)+'" width="30" height="32" rx="4" fill="var(--card)" stroke="var(--h4)" stroke-width="2"/><rect class="tg-pt" x="'+(x-13)+'" y="'+(y+14)+'" width="26" height="10" fill="var(--soft2)"/><path d="M'+(x-15)+' '+(y+7)+'H'+(x+15)+'" stroke="var(--h4)" stroke-width="2"/>';
  return tgFig(x,y,sc.col||'--h1',sc.dash);}

/* ---------- the split stage ---------- */
/* scene: {name, short, kind:'log'|'person', draw?, col?, moves:[{lab, arr, exp, act, reply|res, note?, big?:{act, tab, note, silent?}}]}
   exp = where the naive plan ("as if they won’t react") puts Tali; act = where Tali really lands. Scores 0–10 are illustrative. */
function tgStage(L,host,o){
  o=o||{};
  const LN={a:{y:4,h:136,t:'DOESN’T FIGHT BACK'},b:{y:150,h:150,t:'THINKS AND REACTS'}};
  const st={a:{sc:o.a||null,mv:-1,run:0,done:false,dim:!!o.dimA},b:{sc:o.b||null,mv:-1,run:0,done:false,dim:false}};
  let ghost=!!o.ghost,big=!!o.big;
  const w=document.createElement('div');host.appendChild(w);
  const lane=k=>{const y=LN[k].y,h=LN[k].h,ry=y+h-26;
    return '<g class="tg-ln" data-l="'+k+'">'+
     (k==='b'?'<rect class="tg-fr" x="1.5" y="'+(y-4)+'" width="317" height="'+(h+8)+'" rx="16" fill="none" stroke="var(--h3)" stroke-width="2.5" stroke-dasharray="7 5" opacity="0"/>':'')+
     '<rect x="5" y="'+y+'" width="310" height="'+h+'" rx="14" fill="var(--soft)"/>'+
     '<text class="tg-tt" x="15" y="'+(y+18)+'" font-size="11" font-weight="700" letter-spacing=".4" fill="var(--muted)">'+LN[k].t+'</text>'+
     '<text class="tg-nm" x="305" y="'+(y+18)+'" text-anchor="end" font-size="11.5" font-weight="700" fill="var(--ink)"></text>'+
     tgFig(40,y+40,'--pri')+'<text x="40" y="'+(y+92)+'" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--ink)">Tali</text>'+
     '<g class="tg-ob"></g>'+(k==='b'?'<g class="tg-sil" opacity="0">'+tgFig(300,y+46,'--h3',true,true)+'</g>':'')+
     '<text class="tg-onm" x="262" y="'+(y+92)+'" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--ink)"></text>'+
     '<path class="tg-mv" d="M62 '+(y+50)+'H232" fill="none" stroke="var(--pri)" stroke-width="3" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>'+
     '<path class="tg-mvh" d="M225 '+(y+44)+'l8 6-8 6" fill="none" stroke="var(--pri)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0"/>'+
     '<text class="tg-mvt" x="147" y="'+(y+41)+'" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--pri-deep)"></text>'+
     '<path class="tg-rp" d="M232 '+(y+66)+'H62" fill="none" stroke="var(--h1)" stroke-width="2.5" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>'+
     '<path class="tg-rph" d="M69 '+(y+60)+'l-8 6 8 6" fill="none" stroke="var(--h1)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0"/>'+
     '<text class="tg-rpt" x="147" y="'+(y+82)+'" text-anchor="middle" font-size="11.5" fill="var(--ink)"><tspan x="147" dy="0"></tspan><tspan x="147" dy="13"></tspan></text>'+
     '<path d="M24 '+ry+'H296" stroke="var(--line2)" stroke-width="3" stroke-linecap="round"/>'+
     [0,5,10].map(v=>'<path d="M'+TGX(v)+' '+(ry-5)+'v10" stroke="var(--line2)" stroke-width="2"/>').join('')+
     '<text x="24" y="'+(ry+18)+'" font-size="11" fill="var(--muted)">worse</text><text x="296" y="'+(ry+18)+'" text-anchor="end" font-size="11" fill="var(--muted)">better</text>'+
     '<rect class="tg-gp" x="0" y="'+(ry-6)+'" width="0" height="12" rx="6" opacity="0"/>'+
     '<text class="tg-gpt" x="0" y="'+(ry-13)+'" text-anchor="middle" font-size="11" font-weight="700" opacity="0"></text>'+
     '<circle class="tg-gh" cx="0" cy="'+ry+'" r="9" fill="var(--card)" stroke="var(--pri)" stroke-width="2" stroke-dasharray="3 2" opacity="0"/>'+
     '<g class="tg-tk" style="opacity:0"><circle cx="0" cy="'+ry+'" r="9" fill="var(--pri)" stroke="var(--card)" stroke-width="2"/></g>'+
     '</g>';};
  const vb=o.only==='b'?'0 144 320 162':'0 0 320 306';
  w.innerHTML='<svg class="tg-svg" viewBox="'+vb+'" role="img" aria-label="The split stage: Tali makes a move; on top a thing that cannot react, below a person who replies; each lane ends with where Tali lands on a worse-to-better rail">'+(o.only==='b'?'':lane('a'))+lane('b')+'</svg>'+
    '<p class="tg-cap">Illustrative scores, 0 to 10: how well it ends for Tali. The dashed ring is the naive plan.</p>'+
    '<div class="tg-ctl"></div><div class="tg-ro" aria-live="polite"></div><div class="tg-nt" aria-live="polite"></div>';
  const has=k=>!!w.querySelector('[data-l="'+k+'"]');
  const Q=(k,s)=>w.querySelector('[data-l="'+k+'"] '+s);
  const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
  function pos(k){const s=st[k],m=s.sc&&s.mv>=0?s.sc.moves[s.mv]:null;if(!m)return null;
    const ub=k==='b'&&big&&!!m.big;return {m,exp:m.exp,act:ub?m.big.act:m.act,big:ub};}
  function drawLane(k){if(!has(k))return;const s=st[k],y=LN[k].y,sc=s.sc;
    Q(k,'.tg-nm').textContent=sc?sc.name:'';Q(k,'.tg-onm').textContent=sc?(sc.short||''):'';
    Q(k,'.tg-ob').innerHTML=tgObj(sc,262,y+40);
    w.querySelector('[data-l="'+k+'"]').setAttribute('opacity',s.dim?.35:1);}
  function reset(k){if(!has(k))return;
    [Q(k,'.tg-mv'),Q(k,'.tg-rp')].forEach(p=>{p.style.transition='none';p.style.strokeDashoffset='1';});
    Q(k,'.tg-mvh').setAttribute('opacity',0);Q(k,'.tg-rph').setAttribute('opacity',0);
    const ts=Q(k,'.tg-rpt').children;ts[0].textContent='';ts[1].textContent='';
    Q(k,'.tg-mvt').textContent='';Q(k,'.tg-tk').style.opacity='0';}
  function decor(k){if(!has(k))return;const s=st[k],p=pos(k);
    const gh=Q(k,'.tg-gh'),gp=Q(k,'.tg-gp'),gt=Q(k,'.tg-gpt'),tk=Q(k,'.tg-tk');
    if(!p||!s.done){gh.setAttribute('opacity',0);gp.setAttribute('opacity',0);gt.setAttribute('opacity',0);}
    else{tk.style.transform='translate('+TGX(p.act)+'px,0px)';
      const d=p.act-p.exp,x1=TGX(Math.min(p.act,p.exp)),x2=TGX(Math.max(p.act,p.exp));
      gh.setAttribute('cx',TGX(p.exp));gh.setAttribute('opacity',ghost?1:0);
      gp.setAttribute('x',x1);gp.setAttribute('width',Math.max(0,x2-x1));gp.setAttribute('fill',d<0?'var(--no-bg)':'var(--ok-bg)');gp.setAttribute('opacity',ghost&&d?1:0);
      gt.setAttribute('x',d?(x1+x2)/2:TGX(p.act));gt.textContent=d?'gap '+(d>0?'+':'−')+Math.abs(d):'plan = result';
      gt.setAttribute('fill',d<0?'var(--no)':d>0?'var(--ok)':'var(--muted)');gt.setAttribute('opacity',ghost?1:0);}
    if(k==='b'){const bb=!!(p&&p.big&&s.done);Q('b','.tg-fr').setAttribute('opacity',bb?1:0);
      const tt=Q('b','.tg-tt');tt.textContent=bb?'THE LARGER GAME · '+p.m.big.tab.toUpperCase():LN.b.t;tt.setAttribute('fill',bb?'var(--h3)':'var(--muted)');
      Q('b','.tg-sil').setAttribute('opacity',bb&&p.m.big.silent?1:0);}
    ro();}
  function ro(){let h='';['a','b'].forEach(k=>{const s=st[k],p=pos(k);if(!has(k)||!p||!s.done||s.dim)return;
      const d=p.act-p.exp,nm=cap(s.sc.short||s.sc.name);
      h+='<div><b>'+nm+'</b>: '+(ghost?'plan '+p.exp+' · ':'')+(p.big?'this round '+p.m.act+' → larger game <b>'+p.act+'</b>':'result <b>'+p.act+'</b>')+
        (ghost?' · gap <b style="color:var('+(d<0?'--no':d>0?'--ok':'--muted')+')">'+(d>0?'+':d<0?'−':'')+Math.abs(d)+'</b>':'')+(p.m.res?' <span>('+p.m.res+')</span>':'')+'</div>';});
    w.querySelector('.tg-ro').innerHTML=h||(o.noCtl?'':'Pick a move to play it.');
    const p=pos('b'),s=st.b;w.querySelector('.tg-nt').innerHTML=(p&&s.done&&!s.dim)?(p.big&&p.m.big.note?p.m.big.note:(p.m.note||'')):'';}
  function play(k,j){return new Promise(res=>{const s=st[k];if(!has(k)||!s.sc)return res();
    s.mv=j;s.done=false;const run=++s.run,m=s.sc.moves[j];reset(k);decor(k);
    const mv=Q(k,'.tg-mv'),rp=Q(k,'.tg-rp'),tk=Q(k,'.tg-tk'),ts=Q(k,'.tg-rpt').children,pt=Q(k,'.tg-pt');
    if(pt)pt.setAttribute('fill','var(--soft2)');
    Q(k,'.tg-mvt').textContent=m.arr||m.lab;void mv.getBoundingClientRect();mv.style.transition='';mv.style.strokeDashoffset='0';
    const alive=()=>w.isConnected&&run===s.run;
    setTimeout(()=>{if(!alive())return res();Q(k,'.tg-mvh').setAttribute('opacity',1);
      if(s.sc.kind==='log'){ts[0].textContent='no reply: it can’t react';ts[0].setAttribute('fill','var(--muted)');if(pt&&m.paint)pt.setAttribute('fill','var('+m.paint+')');}
      else{const c='var('+(s.sc.col||'--h1')+')';rp.setAttribute('stroke',c);Q(k,'.tg-rph').setAttribute('stroke',c);rp.style.transition='';rp.style.strokeDashoffset='0';
        const r=(m.reply||'').split('|');ts[0].setAttribute('fill','var(--ink)');ts[0].textContent=r[0];ts[1].textContent=r[1]||'';}
      setTimeout(()=>{if(!alive())return res();if(s.sc.kind!=='log')Q(k,'.tg-rph').setAttribute('opacity',1);
        tk.style.transition='none';tk.style.transform='translate('+TGX(m.exp)+'px,0px)';tk.style.opacity='1';void tk.getBoundingClientRect();tk.style.transition='';
        s.done=true;decor(k);if(o.onPlay)o.onPlay(k,s.sc,m,api);res();},s.sc.kind==='log'?250:600);},420);});}
  function setScene(k,sc){const s=st[k];s.sc=sc;s.mv=-1;s.done=false;s.run++;reset(k);drawLane(k);decor(k);}
  /* controls */
  const ctl=w.querySelector('.tg-ctl');let bRow=null,pChips=[],aChips=[],gB=null,bB=null;
  function moveChips(k,row){row.innerHTML='';const s=st[k];if(!s.sc)return;
    s.sc.moves.forEach((m,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=m.lab;
      b.onclick=()=>{[...row.children].forEach((x,q)=>x.classList.toggle('sel',q===j));play(k,j);};row.appendChild(b);});}

const TG_TALES=[
 {n:1,t:'Pick a number',k:'sco',p:'Lesson 5',s:'The authors hide a number from 1 to 100 and pay less the longer you take. Most people halve the range: 50, 25, 37, 42. That’s ideal for a random number, but a person who wanted to keep the money chose this one.',c:'This course places it here: the hider fixes the number before seeing any guess, so each side picks without seeing the other’s choice. The book uses the tale to teach reading the other side.',tali:'A client’s “final” budget was set by a person with aims, not drawn from a hat.'},
 {n:2,t:'Winning by losing',k:'tco',p:'Lesson 2',s:'In the first <i>Survivor</i> final, the winner of a last endurance challenge would choose their opponent. Richard Hatch saw that the popular Rudy would win any final, and that dropping his ally himself would cost jury votes. So he stepped off early, let Kelly win and pick him, and won the vote.',tali:'Thinking past the next meeting to whom Greer will choose in spring.'},
 {n:3,t:'The hot hand',k:'scr',p:'Lessons 5 and 6',s:'Defenders crowd a player on a streak, so that player’s own scoring can drop while teammates get free shots. When LeBron James improved his weaker left hand, defenders covered it more, which freed his stronger right.',tali:'If Tali gets better at shooting penalties left, the keeper will adjust too.'},
 {n:4,t:'To lead or not to lead',k:'tcr',p:'Lesson 2',s:'In the 1983 America’s Cup, the leading US boat didn’t follow the trailing Australian boat’s gamble on a wind shift. The wind shifted, Australia won the race and then the series. When only winning counts, a leader usually copies the trailer.',tali:'Ahead in the promotion race, Tali needn’t gamble; Linus, behind, has more reason to try something bold.'},
 {n:5,t:'Here I stand',k:'tmr',p:'Lessons 7 and 8',s:'Luther wouldn’t recant, and de Gaulle’s firm “Non!” left others only take it or leave it. Inflexibility gives bargaining power, but it costs: greed spoils future dealings, and stubbornness can turn small losses into disasters, as for de Lesseps at Panama.',tali:'A firm “no weekend work” rule helps Tali only if Tali can hold it without souring things with Greer.'},
 {n:6,t:'Thinning strategically',k:'tmr',p:'Lesson 7',s:'On a TV show, people trying to lose weight agreed that photos they’d never want aired would be broadcast unless they hit a weight-loss target within two months. Each was playing their future self, who moves last and prefers the ice cream. Cutting off the easy way out, like Odysseus tied to the mast, worked.',tali:'Tali’s holiday savings versus the Tali who spots a sale.'},
 {n:7,t:'Buffett’s dilemma',k:'smo',p:'Lesson 3',s:'Warren Buffett imagined a billionaire promising $1 billion to whichever party did most to pass a reform, paid only if it failed. Each party then gains by backing it whatever the other does, so it passes, against their shared interest. Its many-player cousin: who will bell the cat?',tali:'Everyone in the building wants a tidy bike store; nobody wants to go first.'},
 {n:8,t:'Mix your plays',k:'sco',p:'Lesson 6',s:'A collector had two auction houses play Rock Paper Scissors for an $18 million sale. Christie’s asked staff’s children, who advised starting with scissors; Sotheby’s treated it as pure chance and played paper. Scissors won. Be unpredictable, and think about what the other side has been told.',tali:'Tali’s Thursday penalties against a keeper who watches for patterns.'},
 {n:9,t:'Never give a sucker an even bet',k:'tco',p:'Lessons 9 and 11',s:'If someone offers you a bet, ask why: they probably know something. When one side’s gain is the other’s loss, both think they’re smarter, and one is wrong. Even winning an auction is a clue: everyone else valued the prize less (the '+'winner’s curse).',tali:'A car seller who is suddenly keen to “do you a deal”.'},

         'Spot the larger game and when not to play, and find your way around the strategy map and the one-minute check'],
  parts:['Does it fight back?','Which game?','Where it breaks','Your strategy map'],
  read:'Read the Preface, the Introduction and Chapter 1, “Ten Tales of Strategy”, for all ten tales in full and the Multiple Choice case.',
  glossary:{
   'game-theory':'Game theory: the science of strategic decisions, where your result depends on choices other people make on purpose. The book says using it well stays an art, learned from examples and practice.',
   'mixed-motives':'Mixed motives: a game where the players’ aims partly clash and partly line up, so some outcomes are good or bad for both. Most of life is like this.',
   'repeated-game':'Repeated game: the same people meet again and again, so today’s move affects tomorrow’s trust and reputation.',
   'larger-game':'The larger game: the bigger, longer game around the one in front of you: the relationship, the next round, the people watching.',
   'strategy-map':'Strategy map (course application): a chart of everyday situations, each pointing to the tool to try first. Each lesson lights up one tool.'
  },
  cheatsheet:[
   '<b>Lumberjack or general?</b> Wood doesn’t fight back; people do. If someone will react to your move, you’re in a strategic game.',
   'Rivals, partners, siblings and even children are strategic, and their aims can clash with yours or line up. Plan for their reply, not as if they won’t react.',
   'Name the game with three questions: <b>turns or at the same time? pure conflict or mixed motives? one-off or repeated?</b> The answer points to the tool.',
   'Strategy is outdoing a rival, but also finding ways to cooperate, convincing others (and yourself), reading and revealing information, and standing in their shoes. Good strategy mixes competition and cooperation.',
   'Read the other player: a person picked that number; your future self moves last; silent players count; the other side shifts when you improve.',
   '<b>There is always a larger game:</b> pride, fairness and the next round. Sometimes the best move is not to play.',
   'How this course applies the book: the <b>strategy map</b> (situation → first tool) and the <b>one-minute check</b>: Who’s in · Which game · Run the tool · Check the larger game.'
  ],
  steps:[
/* ---------- PART 1: DOES IT FIGHT BACK? ---------- */
{part:0,src:'Chapter 1 · #1 Pick a Number',
 solve:async L=>{for(const n of [50,25,37,42,46]){if(L.$('#nb').disabled)break;const s=L.$('#ns');s.value=n;s.dispatchEvent(new Event('input',{bubbles:true}));L.$('#nb').click();await L.sleep(40);}},
 run(L){
  L.h(L.kick('try','Warm-up · play the book’s game')+'<h1 class="q">Someone hid a number from 1 to 100. Find it in five guesses.</h1>'+
   '<p class="small" style="margin:0 0 6px">After each miss you’re told “too high” or “too low”. The sooner you find it, the bigger the (imaginary) prize. On the board, ↑ means your guess was too low, ↓ too high.</p>'+
   '<svg class="tg-svg" id="nbd" viewBox="0 0 320 228" role="img" aria-label="A board of the numbers 1 to 100; numbers that are ruled out fade"></svg>'+
   '<div class="tg-prz" id="npz"></div>'+
   '<label class="tg-sl"><span class="h"><span>Your guess</span><b id="nv">50</b></span></label>'+
   '<div class="tg-slr"><button class="chip" id="nm" aria-label="One lower">−</button><input type="range" id="ns" min="1" max="100" value="50" aria-label="Your guess, 1 to 100"><button class="chip" id="np" aria-label="One higher">+</button></div>'+
   '<div class="tg-row" style="justify-content:center;margin-top:8px"><button class="btn pri" id="nb">'+L.ic('target')+'Guess</button></div><p class="tg-ro" id="nro" aria-live="polite">Guess 1 of 5 for a prize of 100.</p>');
  const H=48,PR=[100,80,60,40,20];let lo=1,hi=100,n=0,over=false;const tried={};
  function board(){let s='';for(let i=1;i<=100;i++){const c=(i-1)%10,r=Math.floor((i-1)/10),x=5+c*31,y=4+r*22;
      const out=i<lo||i>hi,g=tried[i],ans=over&&i===H;
      const f=ans?'var(--ok-bg)':g?'var(--no-bg)':out?'var(--soft2)':'var(--card)',sk=ans?'var(--ok-strong)':g?'var(--no-line)':'var(--line)',tc=ans?'var(--ok)':g?'var(--no)':out?'var(--faint)':'var(--ink)';
      s+='<rect x="'+x+'" y="'+y+'" width="29" height="20" rx="5" fill="'+f+'" stroke="'+sk+'" stroke-width="'+(ans?2:1)+'"/><text x="'+(x+14.5)+'" y="'+(y+14)+'" text-anchor="middle" font-size="11" font-weight="'+(g||ans?700:500)+'" fill="'+tc+'">'+(g?(g==='h'?'↓':'↑')+i:i)+'</text>';}
    L.$('#nbd').innerHTML=s;
    L.$('#npz').innerHTML=PR.map((p,j)=>'<span class="'+(j===n&&!over?'cur':j<n?'gone':'')+'">'+(j+1)+': '+p+'</span>').join('');}
  const sl=L.$('#ns'),upd=()=>{L.$('#nv').textContent=sl.value;};
  sl.addEventListener('input',upd);
  L.$('#nm').onclick=()=>{sl.value=Math.max(1,+sl.value-1);upd();};L.$('#np').onclick=()=>{sl.value=Math.min(100,+sl.value+1);upd();};
  L.$('#nb').onclick=()=>{if(over)return;const g=+sl.value;n++;let msg;
    if(g===H){over=true;msg='<b>'+g+'</b>: found it, for a prize of '+PR[n-1]+'.';}
    else{if(g>H){hi=Math.min(hi,g-1);tried[g]='h';msg='<b>'+g+'</b> is too high.';}else{lo=Math.max(lo,g+1);tried[g]='l';msg='<b>'+g+'</b> is too low.';}
      if(n>=5){over=true;msg+=' Out of guesses.';}else msg+=' Guess '+(n+1)+' of 5 for '+PR[n]+'.';}
    L.$('#nro').innerHTML=msg;board();
    if(over){L.$('#nb').disabled=true;sl.disabled=true;L.$('#nm').disabled=true;L.$('#np').disabled=true;
      L.sheet('info',g===H?'You read the picker':'It was 48',(g===H?'You found 48. ':'')+'Halving the range is the best plan when a number is random: each guess rules out the most. But a person picked this one, and they wanted to keep the money. Most people go 50, 25, 37, 42, so the book’s authors chose 48. That’s what makes something a game: the other side has aims, and plans around yours.');L.done();}};
  board();}},

{part:0,src:'Introduction',
 solve:async L=>{L.$('#lj1').click();L.$('#lj2').click();},
 run(L){
  L.h(L.kick('learn','The lumberjack and the general')+'<h1 class="q">Make a move on each side. Which one answers back?</h1>'+
   '<svg class="tg-svg" viewBox="0 0 320 168" role="img" aria-label="Left: a lumberjack’s log. Right: a general’s army facing an enemy.">'+
   '<rect x="2" y="2" width="154" height="164" rx="14" fill="var(--soft)"/><rect x="164" y="2" width="154" height="164" rx="14" fill="var(--soft)"/>'+
   '<text x="79" y="22" text-anchor="middle" font-size="11" font-weight="700" fill="var(--muted)" letter-spacing=".4">LUMBERJACK</text>'+
   '<text x="241" y="22" text-anchor="middle" font-size="11" font-weight="700" fill="var(--muted)" letter-spacing=".4">GENERAL</text>'+
   '<path d="M14 128H144" stroke="var(--line2)" stroke-width="2"/>'+
   '<g id="lgA" style="transition:transform .5s"><rect x="30" y="96" width="49" height="30" rx="6" fill="var(--h4-bg)" stroke="var(--h4)" stroke-width="2"/></g>'+
   '<g id="lgB" style="transition:transform .5s"><rect x="79" y="96" width="49" height="30" rx="6" fill="var(--h4-bg)" stroke="var(--h4)" stroke-width="2"/><ellipse cx="128" cy="111" rx="6" ry="15" fill="var(--card)" stroke="var(--h4)" stroke-width="2"/></g>'+
   '<g id="axe" style="transition:transform .35s;transform-origin:96px 88px"><path d="M96 38 80 88" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/><path d="M89 34q14-6 18 8l-12 4z" fill="var(--muted)" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/></g>'+
   '<text id="ljt1" x="79" y="152" text-anchor="middle" font-size="12" font-weight="700" fill="var(--muted)" opacity="0">no reply: it just splits</text>'+
   '<path d="M174 128H308" stroke="var(--line2)" stroke-width="2"/>'+
   '<path d="M190 70V110" stroke="var(--ink)" stroke-width="2.5"/><path d="M191 70l18 6-18 6z" fill="var(--pri)"/>'+tgFig(190,96,'--pri',false,true)+
   '<g id="enm" style="transition:transform .5s;transform-origin:280px 98px">'+[78,98,118].map(y=>'<rect x="270" y="'+(y-8)+'" width="22" height="16" rx="4" fill="var(--no-bg)" stroke="var(--no-strong)" stroke-width="2"/>').join('')+'</g>'+
   '<path id="ga1" d="M212 104C236 104 248 86 262 78" fill="none" stroke="var(--pri)" stroke-width="3" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" style="transition:stroke-dashoffset .4s"/>'+
   '<path id="ga2" d="M264 118C252 128 236 128 222 118" fill="none" stroke="var(--no-strong)" stroke-width="3" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" style="transition:stroke-dashoffset .4s .5s"/>'+
   '<text id="ljt2" x="241" y="152" text-anchor="middle" font-size="12" font-weight="700" fill="var(--no)" opacity="0">it moves to meet you</text>'+
   '</svg>'+
   '<div class="tg-row" style="justify-content:center"><button class="btn" id="lj1">'+L.ic('play')+'Swing the axe</button><button class="btn" id="lj2">'+L.ic('play')+'Send the army</button></div><div id="ljc"></div>');
  const seen=new Set();
  const fin=()=>{if(seen.size<2)return;L.$('#ljc').innerHTML=L.prose('The book’s picture: a lumberjack’s wood doesn’t fight back; a general’s enemy does. Most choices that matter are the general’s kind, a '+L.g('strategic-game','strategic game')+'. '+L.g('game-theory','Game theory')+' is the science of these choices.');L.done();};
  L.$('#lj1').onclick=function(){this.disabled=true;L.$('#axe').style.transform='rotate(-28deg)';setTimeout(()=>{if(!L.$('#axe'))return;L.$('#axe').style.transform='none';L.$('#lgA').style.transform='translate(-7px,0)';L.$('#lgB').style.transform='translate(7px,0)';L.$('#ljt1').setAttribute('opacity',1);},350);seen.add(1);fin();};
  L.$('#lj2').onclick=function(){this.disabled=true;L.$('#ga1').style.strokeDashoffset='0';L.$('#enm').style.transform='translate(0,-6px) rotate(-14deg)';L.$('#ga2').style.strokeDashoffset='0';L.$('#ljt2').setAttribute('opacity',1);seen.add(2);fin();};}},

{part:0,src:'Introduction',
 solve:async L=>{const s=L.stage;s.ghostBtn().click();s.moveBtn('a',0).click();s.moveBtn('b',1).click();await L.sleep(1300);},
 run(L){
  L.h(L.kick('learn','Explore · the split stage')+'<h1 class="q">Tali has a flat tyre and a rent rise. Play a move on each. Then show the naive plan.</h1>'+
   '<div class="tg-gate" id="sgt"><span>Fix the tyre</span><span>Move across the table</span><span>Show the naive plan</span></div><div id="stg"></div>');
  const got=[false,false,false];let fin=false;
  const chk=()=>{L.$$('#sgt span').forEach((x,j)=>x.classList.toggle('dn',got[j]));
    if(!fin&&got.every(Boolean)){fin=true;L.sheet('info','The tyre can’t surprise you. People can.','On the tyre, the naive plan and the result sit on the same spot: nothing reacts. Across the table, the plan assumes the other person just goes along, and the result lands somewhere else. The gap is what you pay for planning as if they won’t react. Try another person, too.');L.done();}};
  L.stage=tgStage(L,L.$('#stg'),{a:TG_TYRE,b:TG_LANDLORD,people:[TG_LANDLORD,TG_ARLO,TG_GREER],aMoves:true,ghostToggle:true,
    onPlay(k,sc,m,api){if(k==='a')got[0]=true;else{got[1]=true;}if(api.ghost&&k==='b'&&m.act!==m.exp)got[2]=true;chk();},
    onToggle(t,v,api){const p=api.pos('b');if(v&&api.st.b.done&&p&&p.act!==p.exp)got[2]=true;chk();}});}},

{part:0,src:'Introduction',
 solve:async L=>{for(let j=0;j<6;j++)L.$$('.tg-seat')[j].dispatchEvent(new MouseEvent('click',{bubbles:true}));},
 run(L){
  const S=[['Greer','Gr','b','Greer is Tali’s manager: the pay talk is in March, and in spring Greer picks Tali or Linus for head of delivery. Greer wants Tali to do well, but pays only what it takes.'],
   ['Linus','Li','b','Linus is Tali’s rival for the promotion. They share one senior designer and keep staying later. Rivals, yet both want their evenings back.'],
   ['Juno','Ju','b','Juno is Tali’s partner: chores, a used car to buy, and the holiday (Tali wants a city, Juno the coast). Mostly on the same side.'],
   ['Arlo','Ar','b','Arlo is Tali’s sibling, asking for £3,000 for a coffee cart, “back by summer”, after being late twice. Both want the cart to work; the money pulls them apart.'],
   ['Hedda','He','s','Hedda is Tali’s parent: a builder is redoing Hedda’s bathroom, and Hedda may sell the family flat. Aims mostly shared, though Hedda dislikes fuss.'],
   ['Landlord','La','b','The landlord wants 10% more rent at renewal. Moving costs Tali, but an empty flat costs the landlord too.'],
   ['Kittiwake','Ki','b','Kittiwake Digital, a rival agency, keeps undercutting Plover’s day rates; both now win work at thin margins. Its recruiter has sounded Tali out.'],
   ['Keeper','Ke','x','The rival goalkeeper on Thursdays watches Tali’s penalties for patterns. A goal for one is a miss for the other: pure conflict.'],
   ['Neighbours','Ne','b','The neighbours share a bike store nobody tidies. Everyone wants it tidy; each hopes someone else will do it.']];
  const C=[160,124],P=S.map((_,j)=>{const a=(-90+j*40)*Math.PI/180;return [C[0]+128*Math.cos(a),C[1]+94*Math.sin(a)];});
  L.h(L.kick('learn','Everyone at the table plays')+'<h1 class="q">Tali’s week: tap each seat to see the game being played there.</h1>'+
   '<svg class="tg-svg" id="tsv" viewBox="0 0 320 252" role="group" aria-label="Tali at a round table with nine people from Tali’s week"></svg>'+
   '<div class="tg-row" style="justify-content:center;font-size:12.5px;color:var(--muted);gap:12px"><span><b style="color:var(--no-strong)">━</b> aims clash</span><span><b style="color:var(--ok-strong)">━</b> aims shared</span><span><b style="color:var(--no-strong)">━</b><b style="color:var(--ok-strong)">━</b> some of each</span></div>'+
   '<div class="tg-box" id="tbx" aria-live="polite"><b>Tap a seat</b>Who is across the table, and do your aims clash or line up?</div>');
  const seen=new Set();let fin=false;
  function draw(){let s='<ellipse cx="160" cy="124" rx="74" ry="44" fill="var(--soft2)" stroke="var(--line2)" stroke-width="2"/>';
    seen.forEach(j=>{const p=P[j],r=S[j][2];const dx=p[0]-C[0],dy=p[1]-C[1],l=Math.hypot(dx,dy),nx=-dy/l*3,ny=dx/l*3;
      if(r==='b')s+='<path d="M'+(C[0]+nx)+' '+(C[1]+ny)+'L'+(p[0]+nx)+' '+(p[1]+ny)+'" stroke="var(--no-strong)" stroke-width="2.5"/><path d="M'+(C[0]-nx)+' '+(C[1]-ny)+'L'+(p[0]-nx)+' '+(p[1]-ny)+'" stroke="var(--ok-strong)" stroke-width="2.5"/>';
      else s+='<path d="M'+C[0]+' '+C[1]+'L'+p[0]+' '+p[1]+'" stroke="var('+(r==='x'?'--no-strong':'--ok-strong')+')" stroke-width="3"/>';});
    s+=tgFig(160,104,'--pri')+'<text x="160" y="158" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--ink)">Tali</text>';
    S.forEach((x,j)=>{const p=P[j],on=seen.has(j),r=x[2],c=on?(r==='x'?'--no-strong':r==='s'?'--ok-strong':'--h3'):'--line2';
      s+='<g class="tg-seat" data-j="'+j+'" role="button" tabindex="0" aria-label="'+x[0]+'"><circle class="hit" cx="'+p[0]+'" cy="'+p[1]+'" r="17" fill="var(--card)" stroke="var('+c+')" stroke-width="'+(on?3:2)+'"/>'+
       '<text x="'+p[0]+'" y="'+(p[1]+4)+'" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--ink)">'+x[1]+'</text>'+
       '<text x="'+p[0]+'" y="'+(p[1]+30)+'" text-anchor="middle" font-size="11" fill="var(--muted)">'+x[0]+'</text><circle cx="'+p[0]+'" cy="'+(p[1]+6)+'" r="24" fill="transparent"/></g>';});
    L.$('#tsv').innerHTML=s;
    L.$$('.tg-seat').forEach(g=>{const j=+g.dataset.j;g.addEventListener('click',()=>tap(j));g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tap(j);}});});}
  function tap(j){seen.add(j);draw();const r=S[j][2];
    L.$('#tbx').innerHTML='<b>'+S[j][0]+' · '+(r==='x'?'aims clash':r==='s'?'aims mostly shared':'some clash, some shared')+'</b>'+S[j][3];
    if(!fin&&seen.size>=6){fin=true;L.sheet('info','A week full of generals','Every seat holds someone who thinks and reacts, so each is a strategic game. Only the keeper is pure conflict; most seats mix clashing and shared aims. The book: your choice must allow for the conflict and make use of the cooperation. Parents meet the same thing; the book says children are the pros.');L.done();}}
  draw();}},

{part:0,src:'Introduction',pts:6,run(L){
  L.h(L.kick('try','Log or general?')+'<h1 class="q">Sort Tali’s choices: does anything on the other side react?</h1>');
  L.buckets(L.card,['Log: just decide','General: someone reacts'],[
   ['Fixing the bike puncture before work',0,'The tyre doesn’t care what Tali does. An ordinary decision: just decide well.'],
   ['Answering the landlord’s 10% rent rise',1,'The landlord will reply to whatever Tali says: accept, counter or call a bluff.'],
   ['Picking a recipe to cook for one',0,'The recipe can’t plan around Tali. No game here.'],
   ['Replying to Arlo’s request for £3,000',1,'Arlo moves next: repays, delays, or asks someone else. That’s a game.'],
   ['Setting Plover’s day rate for a pitch Kittiwake also wants',1,'Kittiwake sets its rate with Plover in mind, and Plover with Kittiwake in mind.'],
   ['Preparing for the March pay talk with Greer',1,'Greer will respond to what Tali asks for and how. A classic game.']],
   'Wood doesn’t fight back; people do. The three people choices are games, so Tali should plan for the reply.');}},

{part:0,src:'Chapter 1 · The Shape of Things to Come',pts:1,
 solve:async L=>{L.$('#pp').children[2].click();L.$('#pw').click();await L.sleep(1300);},
 run(L){
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">Tali treats Arlo’s request like the tyre: lend £3,000 now and count on repayment by summer. Where will Tali land, compared with that plan?</h1>'+
   '<div class="tg-row" id="pp"></div><div class="tg-row" style="justify-content:center"><button class="btn pri" id="pw" hidden>'+L.ic('play')+'Lend it and watch</button></div><div id="pst"></div>');
  let pick=null;
  ['Right on the plan','Above the plan','Below the plan'].forEach((t,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=t;b.onclick=()=>{if(b.disabled)return;pick=j;[...L.$('#pp').children].forEach((x,q)=>x.classList.toggle('sel',q===j));L.$('#pw').hidden=false;};L.$('#pp').appendChild(b);});
  const s=tgStage(L,L.$('#pst'),{a:TG_TYRE,b:TG_ARLO,noCtl:true,ghost:true});
  s.play('a',0);
  L.$('#pw').onclick=async function(){this.hidden=true;[...L.$('#pp').children].forEach(x=>x.disabled=true);await s.play('b',0);if(!L.$('#pst'))return;
    const ok=pick===2;L.award(ok);
    L.sheet(ok?'ok':'no',ok?'Below, as you said':'It lands well below','That’s the lumberjack mistake: treating a person like wood. The naive plan (dashed) assumed Arlo would just repay. But Arlo is a player with aims and a track record of paying late twice, and Arlo moves after Tali. The book: we can’t assume that when we act, everything else stays unchanged.');L.done();};}},

/* ---------- PART 2: WHICH GAME? ---------- */
{part:1,src:'Preface',
 solve:async L=>{for(let j=0;j<5;j++)L.$$('.tg-cd')[j].dispatchEvent(new MouseEvent('click',{bubbles:true}));},
 run(L){
  const CD=[['Outdo','flame','Outdo a rival who is trying to outdo you.','The promotion race with Linus.'],
   ['Co-|operate','people','Find ways to cooperate, even when others act out of self-interest.','Ending the late-night race with Linus.'],
   ['Convince','chat','Convince others, and even yourself, to do what you say.','A savings plan that Tali will actually keep.'],
   ['Read and|reveal','info','Read and reveal information.','What a seller’s warranty says about the used car.'],
   ['Their|shoes','eye','Put yourself in their shoes, to predict and influence what they’ll do.','What Greer needs to hear in March.']];
  L.h(L.kick('learn','Five arts, one science')+'<h1 class="q">The preface’s wider idea of strategy. Tap each card.</h1>'+
   '<svg class="tg-svg" id="csv" viewBox="0 0 320 210" role="group" aria-label="A hand of five cards, each one part of strategy, above a base labelled the science of game theory"></svg>'+
   '<div class="tg-box" id="cbx" aria-live="polite"><b>Tap a card</b>Strategy is more than beating someone.</div>');
  const up=new Set();let fin=false;
  function draw(){let s='<rect x="16" y="178" width="288" height="26" rx="8" fill="var(--soft2)"/><text x="160" y="195" text-anchor="middle" font-size="11" font-weight="700" fill="var(--muted)" letter-spacing=".3">UNDERNEATH: THE SCIENCE (GAME THEORY)</text>';
    CD.forEach((c,j)=>{const a=(j-2)*7.5,on=up.has(j),ln=c[0].split('|');
      s+='<g class="tg-cd" data-j="'+j+'" role="button" tabindex="0" aria-label="'+c[2]+'" transform="rotate('+a+' 160 520)"><g style="transform:translateY('+(on?-14:0)+'px)">'+
       '<rect x="131" y="44" width="58" height="96" rx="9" fill="var('+(on?'--pri-bg':'--card')+')" stroke="var('+(on?'--pri':'--line2')+')" stroke-width="2"/>'+
       tgIc(L,c[1],148,56,24,on?'var(--pri-deep)':'var(--muted)')+
       ln.map((t,q)=>'<text x="160" y="'+(104+q*14)+'" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">'+t+'</text>').join('')+'</g></g>';});
    L.$('#csv').innerHTML=s;
    L.$$('.tg-cd').forEach(g=>{const j=+g.dataset.j;g.addEventListener('click',()=>tap(j));g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tap(j);}});});}
  function tap(j){up.add(j);draw();L.$('#cbx').innerHTML='<b>The art of… ('+up.size+' of 5)</b>'+CD[j][2]+'<span class="tl">Tali: <b>'+CD[j][3]+'</b></span>';
    if(!fin&&up.size===5){fin=true;L.sheet('info','Good strategy mixes competition and cooperation','The authors say their older view was mostly about competition; they now see cooperation as just as important. '+L.g('game-theory','Game theory')+' supplies a few general principles (the science). Using them in your own situation stays an art, learned from examples and practice. That’s why this course runs on Tali’s games and your own week.');L.done();}}
  draw();}},

{part:1,src:'Chapter 4 · Epilogue to Part I',
 solve:async L=>{const c=L.cube;c.set('tco');c.set('scr');c.set('tmr');c.set('smo');},
 run(L){

{part:1,src:'Chapter 1 · #8 Mix Your Plays',pts:1,
 solve:async L=>{const c=L.cube;c.pick('m','s');c.pick('a','c');c.pick('r','o');L.$('#rl').click();},
 run(L){
  L.h(L.kick('ex','Predict, then watch')+'<h1 class="q">Two auction houses play one round of Rock Paper Scissors to win an $18 million sale. Which corner of the cube is that?</h1>'+
   '<div id="rcb"></div><div class="tg-row" style="justify-content:center"><button class="btn pri" id="rl" disabled>'+L.ic('lock')+'Lock in this corner</button></div><div id="rfb"></div>');
  let done=false;
  L.cube=tgCube(L,L.$('#rcb'),{hideTools:true,onSet(){L.$('#rl').disabled=false;}});
  L.$('#rl').onclick=()=>{if(done||!L.cube.key)return;done=true;const k=L.cube.key,ok=k==='sco';L.award(ok);L.cube.lock(true);L.cube.mark(['s','c','o']);L.$('#rl').hidden=true;
    L.cube.place('t8','8','sco',ok?'--ok-strong':'--h3');
    L.$('#rfb').innerHTML='<div class="tg-cr"><b>THE BOOK’S CORNER: SAME TIME · PURE CONFLICT · ONE-OFF</b>'+tgTools(L,'sco')+'</div>';
    L.sheet(ok?'ok':'no',ok?'Same time, pure conflict, one-off':'It’s the same-time, pure-conflict, one-off corner','Both show their hands at once; one house wins the sale and the other loses it; and it’s a single round. Christie’s asked employees’ children, who advised starting with scissors. Sotheby’s called it pure chance and played paper. Scissors won. The book: had Sotheby’s thought about the advice Christie’s was likely getting, rock would have won.');L.done();};}},

{part:1,src:'Chapter 1 · Ten Tales of Strategy',
 solve:async L=>{for(let j=0;j<5;j++)L.$('#tch').children[j].click();},
 run(L){

   '<span class="tg-lab">Tap a tale</span><div class="tg-row" id="tch"></div><div id="tsx" aria-live="polite"><div class="tg-box"><b>Ten tales, ten kinds of game</b>Each tap retells one tale and drops its number on its corner of the cube.</div></div><div id="tcb"></div>');
  const seen=new Set();let fin=false;
  L.cube=tgCube(L,L.$('#tcb'),{noRead:true});L.cube.lock(true);
  TG_TALES.forEach((t,j)=>{const b=document.createElement('button');b.className='chip';b.style.minWidth='48px';b.style.justifyContent='center';b.textContent='#'+t.n;b.setAttribute('aria-label','Tale '+t.n+': '+t.t);b.onclick=()=>{
    [...L.$('#tch').children].forEach((x,q)=>x.classList.toggle('sel',q===j));seen.add(j);

    if(!fin&&seen.size>=5){fin=true;L.sheet('info','Ten tales, one habit','The tales cover very different games, but the habit is the same: see the other players, their aims and their likely reply. The book offers them as quick previews: later chapters turn each one into a method. Tap the rest whenever you like.');L.done();}};
    L.$('#tch').appendChild(b);});}},

{part:1,src:'Course application · built on Chapter 1 and the Epilogue to Part I',pts:6,
 solve:async L=>{for(let j=0;j<TG_WEEK.length;j++){const k=TG_WEEK[j].k;L.cube.pick('m',k[0]);L.cube.pick('a',k[1]);L.cube.pick('r',k[2]);L.$('#wd').click();if(j<TG_WEEK.length-1)L.$('#wn').click();}},
 run(L){
  L.h(L.kick('pr','Challenge · Tali’s week on the cube')+'<h1 class="q">Place each of Tali’s six situations on its corner.</h1>'+
   L.note('How this course applies the book: the cube’s three questions come from the book; the corner-to-tool pointers are this course’s.','compass')+
   '<div class="tg-box" id="wtx" aria-live="polite"></div><div id="wcb"></div>'+
   '<div class="tg-row" style="justify-content:center"><button class="btn pri" id="wd" disabled>'+L.ic('check')+'Drop it on this corner</button><button class="btn" id="wn" hidden>'+L.ic('arrow')+'Next situation</button></div><div id="wfb"></div>');
  let i=0,score=0,answered=false;const L8='ABCDEF';
  L.cube=tgCube(L,L.$('#wcb'),{noRead:true,onSet(){if(!answered)L.$('#wd').disabled=false;}});
  function show(){answered=false;L.cube.lock(false);L.cube.reset();L.$('#wd').disabled=true;L.$('#wd').hidden=false;L.$('#wn').hidden=true;L.$('#wfb').innerHTML='';
    L.$('#wtx').innerHTML='<b>Situation '+L8[i]+' · '+(i+1)+' of 6</b>'+TG_WEEK[i].txt;}
  L.$('#wd').onclick=()=>{if(answered||!L.cube.key)return;answered=true;const it=TG_WEEK[i],k=L.cube.key,ok=k===it.k;L.award(ok);if(ok)score++;
    L.cube.mark([it.k[0],it.k[1],it.k[2]]);L.cube.lock(true);
    if(!ok)L.cube.place('w'+i+'x',L8[i],k,'--no-strong');
    L.cube.place('w'+i,L8[i],it.k,'--ok-strong');
    const wrong=['m','a','r'].map((d,j)=>k[j]!==it.k[j]?it.why[j]:null).filter(Boolean);
    L.$('#wfb').innerHTML='';L.fb(L.$('#wfb'),(ok?'<b>Right corner.</b> '+it.why.join(' '):'<b>Not that corner.</b> '+wrong.join(' '))+'<br>First tool: '+tgTools(L,it.k),ok?'ok':'no');
    L.$('#wd').hidden=true;
    if(i<TG_WEEK.length-1)L.$('#wn').hidden=false;
    else{L.sheet(score===6?'ok':'info',score+' of 6 on the first try','Three questions place almost any situation: turns or at once, pure conflict or mixed, one-off or repeated. Notice how few of Tali’s games are pure conflict, and how many repeat. That’s why trust and the larger game keep coming back in this course.');L.done();}};
  L.$('#wn').onclick=()=>{i++;show();};
  show();}},

/* ---------- PART 3: WHERE IT BREAKS ---------- */
{part:2,src:'Chapter 1 · The Shape of Things to Come',
 solve:async L=>{for(let j=0;j<5;j++){L.$('#lpr').children[j].click();await L.sleep(30);}},
 run(L){
  const PR=[
   ['A log, not a general',{a:TG_PAINT,b:null,play:[['a',0]]},'Paint for Tali’s own bike frame: nobody replies, so plan and result match. That’s an ordinary decision: just decide well. Not every choice is a game, so don’t hunt for a rival who isn’t there.'],
   ['The lumberjack mistake',{b:TG_ARLO,play:[['b',0]]},'Treating Arlo’s request as a plain money sum (lend it, get it back) draws the naive plan. Arlo is a person with aims and a track record, so the result lands far below it.'],
   ['Your future self plays',{b:TG_FUTURE,play:[['b',0]]},'The book’s tale #6: you can play a game against your future self, who moves last and wants the treat now. A plan only works if it changes that self’s choice, for example by cutting off the easy way out (Lesson 7).'],
   ['The silent player',{b:TG_TAXI,big:true,play:[['b',0]]},'The book’s tale #10: haggling at the hotel, the authors saw only the driver. Years later they invented a letter “from him” to make a point: a new spouse sat silently in front, and the low offer shamed him. Count everyone watching; a larger game sits around this one.'],
   ['Every action, a reaction',{b:TG_KEEPER,play:[['b',0]]},'The book’s tale #3: improve one side and the defence shifts. Tali practises the weaker left side; the keeper guards left more, which frees Tali’s right. The other side’s reply can even help you, but only if you look for it.'],
   ['Not a random number',{b:TG_PICKER,play:[['b',0]]},'Halving the range is perfect when nobody chose the number. In the book’s game a person did, to keep the money, and picked the spot halving would miss. Ask who chose it, and what they want.'],
   ['Don’t play',{b:TG_HOLDER,play:[['b',0],['b',1]]},'From Chapter 2: Lucy holds the football and pulls it away every time Charlie Brown runs to kick. He knows her, so he should refuse to play. The Introduction adds that strategic thinking sometimes means knowing when not to play.']];
  L.h(L.kick('learn','Edge cases and limits')+'<h1 class="q">Where does “plan for their reply” trip people up? Try each case.</h1>'+
   '<p class="tg-ro" id="lpc">Cases tried: <b>0</b> of 7 · try at least 5</p><div class="tg-row" id="lpr"></div><div id="lst"></div><div id="lfb" aria-live="polite"></div>');
  const seen=new Set();let fin=false,run=0;
  const s=tgStage(L,L.$('#lst'),{a:TG_TYRE,b:null,noCtl:true,ghost:true,dimA:true});
  PR.forEach((p,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=p[0];b.onclick=async()=>{const me=++run;
    [...L.$('#lpr').children].forEach((x,q)=>x.classList.toggle('sel',q===j));seen.add(j);
    L.$('#lpc').innerHTML='Cases tried: <b>'+seen.size+'</b> of 7'+(seen.size<5?' · try at least 5':'');
    const c=p[1];s.setBig(!!c.big);s.setScene('a',c.a||TG_TYRE);s.dim('a',!c.a);s.setScene('b',c.b);s.dim('b',!c.b);
    L.$('#lfb').innerHTML='';L.fb(L.$('#lfb'),p[2],'info');
    if(!fin&&seen.size>=5){fin=true;L.sheet('info','Where the idea needs care','Don’t game an ordinary decision. Do count the players you can’t see: your future self, a silent watcher, the person who picked the number. Expect the other side to shift when you change. And when every way of playing ends badly, the best move can be to decline.');L.done();}
    for(const pl of c.play){if(me!==run||!L.$('#lst'))return;await s.play(pl[0],pl[1]);if(c.play.length>1)await L.sleep(350);}};
    L.$('#lpr').appendChild(b);});}},

{part:2,src:'Chapter 1 · #10 Game Theory Can Be Dangerous to Your Health',
 solve:async L=>{const s=L.stage;s.bigBtn().click();s.moveBtn('b',0).click();await L.sleep(1200);s.personBtn(1).click();s.moveBtn('b',0).click();await L.sleep(1200);},
 run(L){
  L.h(L.kick('ex','The larger game')+'<h1 class="q">Win this round, or the game around it? Switch on the larger game, then try a hard move with each person.</h1>'+
   '<div class="tg-gate" id="bgt"><span>Landlord, larger game</span><span>Greer, larger game</span></div><div id="bst"></div>'+
   L.quote('There is always a larger game.','Dixit and Nalebuff, Chapter 1'));
  const got=[false,false];let fin=false;
  L.stage=tgStage(L,L.$('#bst'),{b:TG_LLBIG,people:[TG_LLBIG,TG_GRBIG],only:'b',bigToggle:true,
    onPlay(k,sc,m,api){if(api.big&&m.big&&m.big.act!==m.act){got[sc===TG_LLBIG?0:1]=true;}
      L.$$('#bgt span').forEach((x,j)=>x.classList.toggle('dn',got[j]));
      if(!fin&&got[0]&&got[1]){fin=true;L.sheet('info','Win the round, lose the game','Squeezing the landlord or digging in with Greer wins this round, then costs Tali in the next one. The book’s taxi story and de Gaulle’s tale make the same point: pride and fairness shape what people do next, and an unfair win can spoil a relationship. When you’ll deal with someone again, the fair, cooperative move is often the strategic one.');L.done();}}});}},

{part:2,src:'Chapter 1 · Case Study: Multiple Choice',pts:1,
 solve:async L=>{L.$('#mco').children[3].click();L.$('#mcg').click();await L.sleep(2300);},
 run(L){
  const A=[['a','4π'],['b','8π'],['c','16'],['d','16π'],['e','32π']];
  L.h(L.kick('ex','The book’s case · Multiple Choice')+'<h1 class="q">The book shows a test’s five answers but not the question. Which is right?</h1>'+
   '<p class="small" style="margin:0 0 6px">The answers are areas, in square inches. Think about the person who wrote the test.</p>'+
   '<div class="tg-row" id="mco"></div><div id="mcw"></div>');
  let picked=false;
  A.forEach((a,j)=>{const b=document.createElement('button');b.className='chip';b.style.minWidth='54px';b.style.justifyContent='center';b.innerHTML='<b>'+a[0]+'</b>&nbsp;'+a[1];
    b.onclick=()=>{if(picked)return;picked=true;const ok=j===3;L.award(ok);b.classList.add(ok?'ok':'no');if(!ok)L.$('#mco').children[3].classList.add('ok');
      L.$('#mcw').innerHTML='<p class="tg-ro">'+(ok?'<b>Right: 16π.</b> Now see why.':'<b>The book’s answer is 16π.</b> See why.')+'</p>'+
       '<svg class="tg-svg" viewBox="0 0 320 214" role="img" aria-label="If the question were a circle with radius 4, each of the five answers is what a particular formula gives">'+
       '<rect width="320" height="214" rx="14" fill="var(--soft)"/><text x="12" y="20" font-size="11" font-weight="700" fill="var(--muted)" letter-spacing=".3">IF IT’S A CIRCLE WITH RADIUS 4…</text>'+
       [['πr: forgot to square',0],['2πr: mixed up with the rim',1],['r², dropped the π',2],['πr²: the right formula',3],['2πr²: two mistakes mixed',4]].map((f,q)=>{const y=46+q*36,right=q===3;
         return '<g class="tg-mf" data-q="'+q+'" opacity=".18"><text x="12" y="'+(y+4)+'" font-size="12" font-weight="'+(right?700:500)+'" fill="var('+(right?'--ok':'--ink')+')">'+f[0]+'</text>'+
          '<path d="M188 '+y+'H246" stroke="var('+(right?'--ok-strong':'--line2')+')" stroke-width="2.5"/><path d="M240 '+(y-5)+'l7 5-7 5" fill="none" stroke="var('+(right?'--ok-strong':'--line2')+')" stroke-width="2.5"/>'+
          '<rect x="252" y="'+(y-12)+'" width="58" height="24" rx="8" fill="var('+(right?'--ok-bg':'--card')+')" stroke="var('+(right?'--ok-strong':'--line2')+')" stroke-width="2"/>'+
          '<text x="281" y="'+(y+4)+'" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink)">'+A[f[1]][0]+' '+A[f[1]][1]+'</text></g>';}).join('')+
       '</svg><div class="tg-row" style="justify-content:center"><button class="btn pri" id="mcg">'+L.ic('eye')+'Think like the test-writer</button></div><div id="mcx"></div>';
      L.$('#mcg').onclick=function(){this.hidden=true;const order=[3,1,0,2,4];let n=0;
        const go=()=>{if(!L.$('#mcw')||!L.$('#mcw').isConnected)return;if(n<order.length){L.$$('.tg-mf')[order[n]].setAttribute('opacity',1);n++;setTimeout(go,330);return;}
          L.fb(L.$('#mcx'),'The test-writer wants wrong answers that tempt people who half know the topic. If 16π is right, every other option is a mistake someone would really make. If 4π were right (radius 2), mixing up the formulas would <i>also</i> give 4π: a right answer for the wrong reason, which no test-writer allows. And 16 is the odd one out: nobody adds π for fun.','info');
          L.sheet(ok?'ok':'no',ok?'You read the test-writer':'Read the writer, not just the options','The case’s lesson: almost anything is a game. Ask what the other person is trying to achieve, here someone designing tempting wrong answers, and their choices start to talk.');L.done();};
        go();};};
    L.$('#mco').appendChild(b);});}},

{part:2,src:'Chapter 1 · #6 Thinning Strategically',pts:1,run(L){
  L.h(L.kick('pr','Your future self plays')+'<h1 class="q">Every month Tali plans to put £200 aside for the holiday, and every month it’s gone by the 20th. What does the book’s “thinning” tale suggest?</h1>');
  L.mc(L.card,['Make a firmer plan each month and try harder','Move the £200 on payday to an account Tali can’t touch until summer','Stop planning ahead, since next month can’t be known'],1,
   'That’s the tale’s move: future Tali moves last, so change what that self can do. Cutting off the tempting option, like Odysseus tied to the mast, changes the ending. Lesson 7 builds on this.',
   'A firmer plan still leaves future Tali, who moves last, free to spend; and giving up on planning hands that self the win. The tale’s move is to cut off the option in advance, so future Tali can’t take it.');}},

{part:2,src:'Chapter 1 · #10 Game Theory Can Be Dangerous to Your Health',pts:1,run(L){
  L.h(L.kick('pr','Pride and fairness')+'<h1 class="q">Juno wants to haggle £2 off the window cleaner’s fair price. The cleaner has done the building for years and is proud of the work. What should Tali suggest?</h1>');
  L.mc(L.card,['Haggle anyway: £2 saved is £2 earned','Switch cleaners to show who’s in charge','Pay the fair price: pride and the next visit matter more'],2,
   'That’s the taxi lesson. The other player is a person with pride, not a machine, and there’s a larger game: years of visits. The book’s lesson: when the sum is tiny, letting someone overcharge you a little can be the smarter choice.',
   'The book’s taxi story is a warning here: people react to an unfair offer with pride, and £2 can cost far more in the larger game of years of good work. Paying the fair price is the strategic move.');}},

{part:3,src:'Course application · built on the Introduction and Chapter 1',
 solve:async L=>{L.$('#mfd').children[0].click();},
 run(L){
  const SH=[null,['Taking turns','Look ahead · L2'],['Choosing at once','Their shoes · L5'],['Tempted to grab or slack','Dilemma · L3–4'],['Need the same choice','Their shoes · L5'],
   ['Pattern read, or checking','Mix moves · L6'],['Change their behaviour','Commit · L7'],['They know more','Signals · L9'],['Split or set a price','BATNA · L12'],
   ['Compete for one prize','Bid smart · L11'],['A group decides','Vote · L13'],['Good work you can’t watch','Incentives · L14']];
  const GR=[['Read the game · L2–5','--h1',[1,2,3,4]],['Change the game · L6–8','--h2',[5,6]],['Everyday games · L9–14','--h3',[7,8,9,10,11]]];
  const FD=[['Splitting a bill',8,'The sign: something to divide.'],['Buying a used phone',7,'The sign: the seller knows the phone; you don’t.'],
   ['A teen to tidy up',6,'The sign: you want someone to act differently.'],['Whose turn: dishes',3,'The sign: each is tempted to leave it to the other.'],
   ['Meeting, phone dead',4,'The sign: you both need to pick the same spot.']];
  L.h(L.kick('learn','How to use this course')+'<h1 class="q">Your strategy map: find the row, get the first tool</h1>'+
   L.note('How this course applies the book: the book has no map. This one is built only from its ideas.','compass')+
   '<span class="tg-lab">Find the row: tap a situation</span><div class="tg-row" id="mfd"></div>'+
   '<div id="mp"></div>'+
   '<div class="tg-box" id="mbx" aria-live="polite"><b>All grey for now</b>Tap a situation, or any tile, to see where it points.</div>'+
   '<p class="small">The cube is a quick first guess from three switches; a row reads the everyday signs and gives the fuller route. If they differ, follow the row. Each lesson lights up its tool and ends with its one-minute move and limits.</p>');
  const lab=r=>r.charAt(0)==='L'?'Lesson '+r.slice(1):r;
  L.$('#mp').innerHTML='<button class="tg-g0" data-j="0"><span class="q">Row 0 · Will anyone react to what you do?</span><span class="o"><span>No → just decide</span><span>Yes ↓ find your row</span></span></button>'+
   GR.map(g=>'<div class="tg-mg" style="--c:var('+g[1]+');--cb:var('+g[1]+'-bg)"><div class="hd">'+g[0]+'</div><div class="gr">'+
    g[2].map(j=>'<button class="tg-mt" data-j="'+j+'" aria-label="'+TG_MAP[j][0]+': first tool '+TG_MAP[j][1]+'"><span class="s">'+SH[j][0]+'</span><span class="f">'+L.ic(TG_MAP[j][2])+SH[j][1]+'</span></button>').join('')+'</div></div>').join('')+
   '<div class="tg-m4"><b>Putting it to work · L15–17</b><br>The full map, what to do when stuck, and every tool on one case.</div>';
  let fin=false;
  const lite=(j,lit)=>{L.$$('#mp [data-j]').forEach(b=>{const on=+b.dataset.j===j;b.classList.toggle('on',lit&&on);b.classList.toggle('cur',!lit&&on);});};
  const tool=j=>'<span class="tg-tool">'+L.ic(TG_MAP[j][2])+TG_MAP[j][1]+' <small>· '+lab(TG_MAP[j][3])+'</small></span>';
  L.$$('#mp [data-j]').forEach(b=>b.onclick=()=>{const j=+b.dataset.j;lite(j,false);[...L.$('#mfd').children].forEach(x=>x.classList.remove('sel'));
    L.$('#mbx').innerHTML='<b>Row '+j+' · '+TG_MAP[j][0]+'</b>'+(j?'First: '+tool(j)+'<span class="tl">'+TG_MAP[j][4]+'</span>':TG_MAP[j][4]);});
  FD.forEach((f,q)=>{const c=document.createElement('button');c.className='chip';c.textContent=f[0];c.onclick=()=>{
    [...L.$('#mfd').children].forEach((x,k)=>x.classList.toggle('sel',k===q));lite(f[1],true);
    L.$('#mbx').innerHTML='<b>'+f[0]+' → row '+f[1]+'</b>'+f[2]+' First: '+tool(f[1])+'<span class="tl">'+TG_MAP[f[1]][4].replace(/ Tali:.*$/,'')+'</span>';
    if(!fin){fin=true;L.done();}};L.$('#mfd').appendChild(c);});}},

{part:3,src:'Course application · built on the Introduction and Chapter 1',
 solve:async L=>{L.$('#mr').click();await L.sleep(2700);},
 run(L){
  const ST=[['Who’s in the game?',15,'Is it a game at all? Who else is involved, and what do they want?','The landlord, Tali and Juno. The landlord wants the flat full and more rent.'],
   ['Which game?',10,'Turns or at the same time? Find the row on the map.','Turns: an offer, then a reply. Row: splitting something or agreeing a price.'],
   ['Run the tool',25,'Run the first tool’s one-minute move. Each lesson teaches one.','Bargain from your BATNA (Lesson 12): moving costs Tali, but an empty flat costs the landlord.'],
   ['Check the larger game',10,'Is the tool hitting a limit? Will you deal with them again? Is the move fair enough that pride won’t backfire?','Years of repairs and renewals ahead: keep the offer fair.']];
  const X=[10,85,135,260,310],COL=['--h1','--h2','--h3','--h4'];
  L.h(L.kick('learn','The one-minute check · a preview')+'<h1 class="q">One minute, four questions, before any move that someone will answer</h1>'+
   L.note('How this course applies the book: a short routine made only from the book’s ideas. You’ll practise it in Lesson 15.','compass')+
   '<svg class="tg-svg" viewBox="0 0 320 96" role="img" aria-label="A one-minute bar split into four steps: 15, 10, 25 and 10 seconds">'+
   '<text x="10" y="18" font-size="11" font-weight="700" fill="var(--muted)" letter-spacing=".3">ONE MINUTE</text>'+
   ST.map((s,j)=>'<rect class="tg-sg" data-j="'+j+'" x="'+X[j]+'" y="28" width="'+(X[j+1]-X[j]-2)+'" height="32" rx="7" fill="var('+COL[j]+'-bg)" stroke="var('+COL[j]+')" stroke-width="2"/><text x="'+((X[j]+X[j+1])/2-1)+'" y="49" text-anchor="middle" font-size="13" font-weight="700" fill="var('+COL[j]+')">'+(j+1)+'</text>').join('')+
   X.map((x,j)=>'<text x="'+Math.min(306,Math.max(14,x))+'" y="80" text-anchor="middle" font-size="11" fill="var(--muted)">'+[0,15,25,50,60][j]+'s</text>').join('')+
   '</svg><div class="tg-steps" id="msp">'+ST.map((s,j)=>'<button data-j="'+j+'">'+(j+1)+' · '+s[0]+'</button>').join('')+'</div>'+
   '<div class="tg-say" id="msy" aria-live="polite"><b>Tap a step</b>or run the whole minute on Tali’s rent renewal.</div>'+
   '<div class="tg-row" style="justify-content:center"><button class="btn pri" id="mr">'+L.ic('play')+'Run it on the rent renewal</button></div>');
  const seen=new Set();let fin=false,ran=false;
  const show=(j,ex)=>{L.$$('#msp button').forEach((b,q)=>{b.classList.toggle('cur',q===j);if(seen.has(q)&&q!==j)b.classList.add('dn');});
    L.$$('.tg-sg').forEach((r,q)=>r.setAttribute('stroke-width',q===j?4:2));
    L.$('#msy').innerHTML='<b>'+(j+1)+' · '+ST[j][0]+' · about '+ST[j][1]+' seconds</b>'+ST[j][2]+(ex?'<i>Tali: '+ST[j][3]+'</i>':'');};
  const end=()=>{if(fin)return;fin=true;L.sheet('info','Four questions, then act','Who’s in · Which game · Run the tool · Check the larger game. For small, easy-to-undo things, a minute is enough. For big ones, walk the whole row of the map and sketch the game. Then act, and later note what happened.');L.done();};
  L.$$('#msp button').forEach(b=>b.onclick=()=>{const j=+b.dataset.j;seen.add(j);show(j,ran);if(seen.size===4)end();});
  L.$('#mr').onclick=function(){this.disabled=true;ran=true;let j=0;const go=()=>{if(!L.$('#msy')||!L.$('#msy').isConnected)return;seen.add(j);show(j,true);j++;if(j<4)setTimeout(go,620);else setTimeout(()=>{if(L.$('#msy'))end();},500);};go();};}},

{part:3,src:'Chapter 1 · The Shape of Things to Come',pts:1,run(L){
  L.h(L.kick('pr','Put it together')+'<h1 class="q">Build the habit this lesson teaches. Tap each piece to change it.</h1>');
  L.sentence(L.card,[['Plan as if they won’t react','First ask who will react, and how'],['then name the kind of game','then grab what looks best right now'],['to find the tool to reach for','to prove you’re the smartest player'],['and keep the larger game in view.','and win this round at any cost.']],[1,0,0,0],
   [['That’s the lumberjack mistake: people reply, and the result lands away from the plan.'],['The best-looking move now is often the one the other side has planned around. Name the game first.'],['The point isn’t to look clever. The kind of game tells you which tool fits.'],['An unfair win can cost you in the next round: there is always a larger game.']],
   'Ask who will react, name the game, reach for the right tool, and keep the larger game in view. That’s the whole course in one sentence.');}},

{part:3,src:'Course application · built on Chapter 1',
 solve:async L=>{const i=L.$('#yt');i.value='Asking my flatmate to split the internet bill';i.dispatchEvent(new Event('input',{bubbles:true}));L.$('#yr').children[0].click();L.cube.pick('m','t');L.cube.pick('a','m');L.cube.pick('r','r');L.$('#yb').click();},
 run(L){
  L.h(L.kick('pr','Your turn · ungraded')+'<h1 class="q">Pick one situation this week where someone will react to what you do. Put it on the cube.</h1>'+
   L.note('How this course applies the book: the book’s three questions, used on your own week.','compass')+
   '<label class="tg-lab" for="yt">1 · Who, and what?</label><input class="tg-in" id="yt" maxlength="90" placeholder="e.g. asking a flatmate to split the internet bill">'+
   '<span class="tg-lab">2 · Will they react to what you do?</span><div class="tg-row" id="yr"></div>'+
   '<div id="ycw" hidden><span class="tg-lab">3 · Which game?</span><div id="ycb"></div><div class="tg-row" style="justify-content:center"><button class="btn pri" id="yb" disabled>'+L.ic('compass')+'Find my tool</button></div></div><div id="yfb"></div>');
  let react=null;const txt=()=>L.$('#yt').value.trim();
  L.cube=tgCube(L,L.$('#ycb'),{onSet(){chk();}});
  const chk=()=>{L.$('#yb').disabled=!(txt().length>2&&L.cube.key);};
  L.$('#yt').addEventListener('input',chk);
  [['Yes, they’ll respond',true],['No, nothing reacts',false]].forEach((o,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=o[0];
    b.onclick=()=>{react=o[1];[...L.$('#yr').children].forEach((x,q)=>x.classList.toggle('sel',q===j));L.$('#ycw').hidden=!react;L.$('#yfb').innerHTML='';
      if(!react){if(txt().length<3){L.fb(L.$('#yfb'),'Write the situation in box 1 first.','no');return;}
        L.sheet('info','That’s a log','Nobody will plan around your move, so it’s an ordinary decision: weigh the options on their merits and decide. Row zero of the map is there to save you from gaming things that aren’t games. Try another situation where someone will answer back, if you have one.');L.done();}
      chk();};L.$('#yr').appendChild(b);});
  L.$('#yb').onclick=()=>{if(!L.cube.key||txt().length<3)return;const k=L.cube.key;
    L.$('#yfb').innerHTML='<div class="tg-box"><b>'+L.esc(txt())+'</b>'+TG_C[k].t+'<span class="tl">First guess: '+tgTools(L,k)+'</span><span class="tl">For the fuller route, find its row on the strategy map you just saw; if the two differ, follow the row.</span></div>';
    L.sheet('info','Your corner, your first tool','Before you move, spend one minute: who’s in, what they want, and what they’ll do next. When you reach the lesson for this tool, come back to this situation and run its one-minute move. And keep the larger game in view: you’ll likely deal with them again.');L.done();};}}
  ]
});
</script>
