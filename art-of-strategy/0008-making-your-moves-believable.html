<script>
/* ===== This lesson’s own visuals: the moment-of-truth road (the fork where Tali must follow
   through, two coin piles, the other side’s prediction bubble, and eight devices that can be
   placed on the scene), and the slippery slope of brinkmanship (a marble stepping down a slope
   that gets steeper, with a hidden landlord and a low/high stakes switch). Everything lives here. ===== */
(function(){const st=document.createElement('style');st.textContent=`

.cr-tag i{font-style:normal;font-size:11px;font-weight:700;letter-spacing:.3px;border-radius:6px;padding:1px 6px;white-space:nowrap;margin-top:1px}
.cr-tag i.ok{background:var(--ok-bg);color:var(--ok)}

.cr-steps span{font-size:11.5px;line-height:1.25;font-weight:600;text-align:center;border-radius:10px;padding:6px 3px;background:var(--soft);color:var(--muted);border:1.5px solid transparent}
.cr-steps span.cur{background:var(--pri-bg);color:var(--pri-deep);border-color:var(--pri)}

.cr-in{display:block;width:100%;box-sizing:border-box;border:2px solid var(--line);border-radius:12px;padding:9px 11px;font:inherit;font-size:15px;background:var(--card);color:var(--ink);margin:4px 0 8px}
.cr-in:focus{outline:none;border-color:var(--pri)}
.cr-fl{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.3px;display:block;margin-top:6px}
.cr-map{border:1.5px solid var(--line);border-radius:12px;padding:6px 9px;margin:0 0 5px;background:var(--card)}

.cr-map .m{font-size:12px;font-weight:600;border-radius:8px;padding:3px 7px;background:var(--soft2);color:var(--ink);border:1.5px solid transparent}
.cr-map .m.cur{background:var(--pri);color:var(--pri-ink)}

.cr-map .ar{color:var(--faint);font-size:12px}

.cr-t{animation:crin .3s both}
@keyframes crin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
`;document.head.appendChild(st);})();

/* ---------- small drawing helpers ---------- */
const crFig=(x,y,c,lab,ly)=>'<circle cx="'+x+'" cy="'+y+'" r="8" fill="var(--card)" stroke="'+c+'" stroke-width="2"/><rect x="'+(x-10)+'" y="'+(y+10)+'" width="20" height="22" rx="7" fill="var(--card)" stroke="'+c+'" stroke-width="2"/>'+
  (lab?'<text x="'+x+'" y="'+(ly||y+46)+'" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--ink)">'+lab+'</text>':'');
const crTx=(x,y,t,o)=>{o=o||{};return '<text x="'+x+'" y="'+y+'" text-anchor="'+(o.a||'middle')+'" font-size="'+(o.s||11)+'" font-weight="'+(o.w||700)+'" fill="'+(o.c||'var(--ink)')+'">'+t+'</text>';};
const crBz=(p,t)=>{const u=1-t;return [u*u*u*p[0]+3*u*u*t*p[2]+3*u*t*t*p[4]+t*t*t*p[6],u*u*u*p[1]+3*u*u*t*p[3]+3*u*t*t*p[5]+t*t*t*p[7]];};
const CR_LB=[165,214,165,186,92,192,64,166],CR_RB=[165,214,165,186,238,192,266,166];
const crPath=p=>'M'+p[0]+' '+p[1]+'C'+p[2]+' '+p[3]+' '+p[4]+' '+p[5]+' '+p[6]+' '+p[7];

/* ---------- the moment-of-truth road: model (Tali’s payoffs at the moment of truth are illustrative) ---------- */
const CR_G=[['Change the payoffs','h1'],['Limit your way out','h4'],['Small steps','h2'],['Use others','h3']];
const CR_DEV=[
 {k:'con',g:0,n:'Contract',d:'A signed loan agreement: dates, amounts and a small late fee.',s:-2,tag:'warn',why:'Can be renegotiated: if Tali and Arlo both want to tear it up, nothing stops them.'},
 {k:'rep',g:0,n:'Reputation',d:'Tell Arlo, in front of Juno: this is how I’ll lend to anyone, now and later.',c:2,tag:'warn',why:'Counts only if the game goes on. Here it does: Arlo will ask again.'},
 {k:'cut',g:1,n:'Cut off contact',d:'Fix the dates, then refuse to discuss any change until the summer.',kill:1,tag:'harm',why:'No news gets through: if Arlo has a real emergency, Tali won’t hear of it.'},
 {k:'burn',g:1,n:'Burn a bridge',d:'Lock Tali’s spare savings in a fixed account, so there’s nothing more to lend.',kill:1,tag:'harm',why:'No way back if Tali was wrong: a real emergency gets no help either.'},
 {k:'luck',g:1,n:'Leave it to chance',d:'Say a missed payment will come up at Sunday dinner with Hedda, and who knows where that goes.',chance:1,tag:'harm',why:'An accident can set it off: a row in front of Hedda that nobody wanted.'},
 {k:'step',g:2,n:'Small steps',d:'Lend £1,000 at a time. The next part comes only after repayments arrive on time.',c:3,tag:'ok',why:'Keep the end open: a clear last step can unravel trust.'},
 {k:'team',g:3,n:'Teamwork',d:'Agree the plan with Juno, who will hold Tali to it.',s:-2,tag:'ok',why:'Juno must be willing to hold Tali to it.'},
 {k:'agent',g:3,n:'An agent',d:'A bank standing order moves the money by the rule, not by mood.',s:-3,tag:'warn',why:'Arlo can still ask Tali to override it; it holds only if Tali refuses.'}];
const CR_BASE={c:2,s:6};
function crEval(base,items,on){let c=base.c,s=base.s,closed=false,chance=false;const mc=[],ms=[],tags=[];
  items.filter(d=>on.has(d.k)).forEach(d=>{if(d.c){c+=d.c;mc.push([d.c,d.n]);}if(d.s){s+=d.s;ms.push([d.s,d.n]);}if(d.kill)closed=true;if(d.chance)chance=true;if(d.why)tags.push([d.tag,d.n,d.why]);});
  c=Math.max(0,c);s=Math.max(0,s);
  const verdict=closed||c>s?'carry':chance?'chance':'slide';
  return {c,s,closed,chance,verdict,mc,ms,tags,tie:!closed&&c===s,n:on.size,harm:tags.some(t=>t[0]==='harm')};}

/* ---------- the moment-of-truth road: drawing ---------- */
function crPile(x,n,lab,closed,col,hide){let s=crTx(x,76,lab,{c:'var(--muted)'});
  if(hide){s+='<rect x="'+(x-18)+'" y="122" width="36" height="30" rx="8" fill="var(--soft2)" stroke="var(--line2)" stroke-dasharray="3 2"/>'+crTx(x,142,'?',{s:15,c:'var(--muted)'});return s;}
  if(closed){s+='<rect x="'+(x-24)+'" y="126" width="48" height="24" rx="7" fill="var(--soft2)" stroke="var(--line2)" stroke-dasharray="3 2"/>'+crTx(x,142,'closed',{c:'var(--muted)'});return s;}
  for(let j=0;j<n;j++){const y=150-j*6;s+='<ellipse cx="'+x+'" cy="'+y+'" rx="15" ry="4.5" fill="var(--h3-bg)" stroke="var(--h3)" stroke-width="1.5"/>';}
  return s+crTx(x,150-Math.max(n-1,0)*6-11,n,{s:15,c:col||'var(--ink)'});}
function crMonths(v,o){const P=v==='carry'?[1,1,1,1,1,1]:v==='chance'?[1,1,1,2,1,1]:[1,0,1,0,0,1];
  let s=crTx(10,240,o.mLab||'ARLO’S REPAYMENTS',{a:'start',c:'var(--muted)'});
  P.forEach((p,j)=>{const x=10+j*18,c=p===1?'var(--ok-strong)':p===2?'var(--h3)':'var(--no-strong)';
    s+='<rect x="'+x+'" y="246" width="15" height="17" rx="4" fill="'+c+'"/>'+crTx(x+7.5,259,p===1?'✓':p===2?'!':'×',{c:'var(--card)',s:11.5});});
  return s;}
function crGlyph(k,o,dim){const op=dim?' opacity=".18"':'';const lab=(o.lab||{})[k];let s='<g class="cr-t"'+op+'>';
  if(k==='rep'){const f=o.oneoff,c=f?'var(--faint)':'var(--h1)';
    s+=[[104,114],[120,108],[136,114]].map(p=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="5.5" fill="var(--card)" stroke="'+c+'" stroke-width="1.8"'+(f?' stroke-dasharray="2 2"':'')+'/><path d="M'+(p[0]-7)+' '+(p[1]+17)+'q7-13 14 0z" fill="var(--card)" stroke="'+c+'" stroke-width="1.8"'+(f?' stroke-dasharray="2 2"':'')+'/>').join('')+
      crTx(120,144,f?'nobody watching':lab||'future asks',{c});}
  if(k==='con'){s+='<path d="M194 177L206 203" stroke="var(--h1)" stroke-width="5" stroke-dasharray="4 3"/><rect x="214" y="200" width="13" height="16" rx="2" fill="var(--card)" stroke="var(--h1)" stroke-width="1.6"/><path d="M217 205h7M217 209h7M217 213h4" stroke="var(--h1)" stroke-width="1.2"/>'+
      crTx(231,213,lab||'contract',{a:'start',c:'var(--h1)'});
    if(o.renego)s+='<path d="M180 206C190 236 236 232 232 186" fill="none" stroke="var(--h3)" stroke-width="2" stroke-dasharray="4 3"/><path d="M232 181l-5 8h10z" fill="var(--h3)"/>'+crTx(262,240,'tear it up together?',{c:'var(--h3)'});}
  if(k==='cut'){s+='<path d="M151 74c0-6 4-9 7-9l3 7-3 3c1 4 4 7 8 8l3-3 7 3c0 3-3 7-9 7-9 0-16-7-16-16z" fill="var(--card)" stroke="var(--h4)" stroke-width="1.8"/><path d="M178 66l-28 26" stroke="var(--no-strong)" stroke-width="2.5" stroke-linecap="round"/>'+
      crTx(165,108,lab||'no talks',{c:'var(--h4)'});}
  if(k==='burn'){s+=[[238,170],[248,162],[256,172]].map(p=>'<path d="M'+p[0]+' '+p[1]+'c-6-6-2-12 0-16c1 5 5 6 5 11c0 3-2 5-5 5z" fill="var(--no-strong)"/>').join('')+crTx(230,166,lab||'bridge burnt',{a:'end',c:'var(--no)'});
    if(o.wrong)s+='<rect x="262" y="178" width="64" height="34" rx="8" fill="var(--no-bg)" stroke="var(--no-strong)" stroke-width="1.5"/>'+crTx(294,192,'real',{c:'var(--no)'})+crTx(294,206,'emergency',{c:'var(--no)'});}
  if(k==='luck'){const a=o.accident;s+='<circle cx="165" cy="200" r="13" fill="var(--card)" stroke="var(--h4)" stroke-width="2"/><path d="M165 200L165 187A13 13 0 0 1 176.3 206.5Z" fill="'+(a?'var(--no-strong)':'var(--h4)')+'" opacity="'+(a?1:.55)+'"/><path d="M165 200l'+(a?'7 -8':'-9 5')+'" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/>'+
      crTx(144,224,a?'an accident!':(lab||'1 in 3'),{a:'end',c:a?'var(--no)':'var(--h4)'});}
  if(k==='step'){/* drawn as stepping stones on the left road */s+=crTx(12,202,lab||'£1,000 at a time',{a:'start',c:'var(--h2)'});
    if(o.laststep)s+=crTx(90,160,'last step?',{a:'start',c:'var(--no)'});}
  if(k==='team'){s+=crFig(200,222,'var(--h3)','')+crTx(200,272,lab||'Juno',{c:'var(--h3)'});}
  if(k==='agent'){s+='<path d="M284 230l12-8 12 8z" fill="var(--card)" stroke="var(--h3)" stroke-width="1.6"/><path d="M287 232v12M293 232v12M299 232v12M305 232v12M284 245h24" stroke="var(--h3)" stroke-width="1.6"/>'+
      crTx(324,262,lab||'standing order',{a:'end',c:'var(--h3)'});}
  return s+'</g>';}
function crRoad(e,o){o=o||{};const on=o.on||new Set(),all=o.all,hl=o.hl;const has=k=>all||on.has(k);
  const v=e.verdict,good=o.good||'carry',vc=v===good?'var(--ok-strong)':v==='chance'?'var(--h3)':'var(--no-strong)';
  const who=o.who||'Tali',pred=o.pred||'Arlo',Ln=o.L||'CARRY IT OUT',Rn=o.R||'LET IT SLIDE';
  let s='<svg class="cr-svg" viewBox="0 0 330 276" role="img" aria-label="'+(o.aria||'The moment-of-truth road: '+who+' at a fork between '+Ln.toLowerCase()+' and '+Rn.toLowerCase())+'"><rect width="330" height="276" rx="14" fill="var(--soft)"/>';
  /* roads */
  const road=(p,hot,col,stones)=>{if(stones){let t='';for(let j=1;j<=7;j++){const q=crBz(p,j/7.6);t+='<ellipse cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" rx="8" ry="5.5" fill="'+(hot?col:'var(--card)')+'" fill-opacity="'+(hot?.45:1)+'" stroke="var(--h2)" stroke-width="1.6"'+(o.laststep&&j===7?' stroke-dasharray="3 2"':'')+'/>';}return t;}
    return '<path d="'+crPath(p)+'" fill="none" stroke="var(--line2)" stroke-width="15" stroke-linecap="round"/><path d="'+crPath(p)+'" fill="none" stroke="'+(hot?col:'var(--card)')+'" stroke-opacity="'+(hot?.5:1)+'" stroke-width="11" stroke-linecap="round"/>';};
  s+='<path d="M165 268V214" stroke="var(--line2)" stroke-width="15"/><path d="M165 268V214" stroke="var(--card)" stroke-width="11"/>';
  const hideP=o.hidePiles,lhot=!hideP&&(v==='carry'||v==='chance'),rhot=!hideP&&v==='slide';
  s+=road(CR_LB,lhot,vc,has('step')&&!(hl&&!hl.has('step')))+(has('step')&&hl&&!hl.has('step')?road(CR_LB,false,vc,false):'');
  s+=e.closed&&!hideP?'<path d="'+crPath(CR_RB)+'" fill="none" stroke="var(--line2)" stroke-width="13" stroke-dasharray="5 5" stroke-linecap="round" opacity=".7"/>':road(CR_RB,rhot,vc,false);
  /* piles */
  s+=o.noPiles?crTx(64,76,Ln,{c:'var(--muted)'})+crTx(266,76,Rn,{c:'var(--muted)'}):crPile(64,e.c,Ln,false,lhot?vc:null,hideP)+crPile(266,e.s,Rn,e.closed,rhot?vc:null,hideP);
  /* prediction bubble */
  const bl=o.bubble||[pred.toUpperCase()+' EXPECTS',v==='carry'?who+(o.carryTxt||' will carry it out'):v==='chance'?(o.chanceTxt||'Too risky to test: a row could erupt'):who+(o.slideTxt||' will let it slide'),vc];
  s+=crFig(24,16,'var(--h2)','')+'<circle cx="42" cy="44" r="3" fill="var(--card)" stroke="'+bl[2]+'" stroke-width="1.5"/><rect x="48" y="6" width="274" height="46" rx="12" fill="var(--card)" stroke="'+bl[2]+'" stroke-width="2"/>'+
    crTx(60,24,bl[0],{a:'start',c:'var(--muted)'})+crTx(60,43,bl[1],{a:'start',s:bl[1].length>32?12.5:14,c:bl[2]});
  /* devices */
  CR_DEV.forEach(d=>{if(has(d.k))s+=crGlyph(d.k,o,hl&&!hl.has(d.k));});
  if(o.glyphs)s+=o.glyphs(on);
  if(o.extra)s+=o.extra;
  /* the mover */
  s+=crFig(165,222,'var(--h1)','')+crTx(165,272,who);
  if(o.say)s+='<rect x="186" y="236" width="138" height="30" rx="9" fill="var(--card)" stroke="var(--h1)" stroke-width="1.5"/><path d="M186 248l-8 4 8 3z" fill="var(--h1)"/>'+crTx(255,255,o.say,{s:11.5,c:'var(--h1)'});
  if(o.months!==false)s+=crMonths(hideP?'slide':v,o);
  return s+'</svg>';}
function crReadout(e,o){o=o||{};const sum=m=>m.reduce((a,x)=>a+x[0],0);
  const f=(v,m)=>m.length?(Math.max(0,v-sum(m)))+m.map(x=>' '+(x[0]>0?'+':'−')+Math.abs(x[0])+' '+x[1].toLowerCase()).join('')+' = <b>'+v+'</b>':'<b>'+v+'</b>';
  const Ln=o.Lw||'Carry it out',Rn=o.Rw||'Let it slide',nw=o.nowWho||o.pred||'Arlo';
  return '<span>'+Ln+': '+f(e.c,e.mc)+'</span><span>'+Rn+': '+(e.closed?'<b>closed</b>':f(e.s,e.ms))+'</span>'+
   (e.chance&&!e.closed&&!(e.c>e.s)?'<span>The fork is a spinner: about <b>1 in 3</b> a row happens whatever anyone wants</span>':'')+
   '<span>'+nw+' now: <b>'+(e.verdict==='carry'?(o.carryNow||'pays on time'):e.verdict==='chance'?(o.chanceNow||'pays on time, but takes a risk with everyone'):(o.slideNow||'pays when it suits'))+'</b>'+(e.tie&&!e.chance?' (a tie: '+(o.pred||'Arlo')+' bets on the easy road)':'')+'</span>';}
function crTags(e){return e.tags.map(t=>'<div class="cr-tag cr-t"><i class="'+t[0]+'">'+(t[0]==='harm'?'SIDE EFFECT':t[0]==='warn'?'LIMIT':'WATCH')+'</i><span><b>'+t[1]+'.</b> '+t[2]+'</span></div>').join('');}
/* a full panel: road + readout + side-effect tags + device chips */
function crPanel(L,host,o){o=o||{};const items=o.items||CR_DEV,base=o.base||CR_BASE,on=new Set(o.start||[]);
  const w=document.createElement('div');host.appendChild(w);
  const chips=d=>'<button class="chip" data-k="'+d.k+'">'+d.n+'</button>';
  w.innerHTML='<div class="cr-sv"></div><p class="cr-ro" aria-live="polite"></p>'+(o.say!==false?'<div class="cr-say cr-dsay" aria-live="polite">'+(o.hint||'Tap a device to place it on the road. Tap again to remove it.')+'</div>':'')+
    (o.groups===false?'<div class="cr-grp"><div class="cs">'+items.map(chips).join('')+'</div></div>':
     CR_G.map((g,j)=>'<div class="cr-grp"><span class="gl" style="color:var(--'+g[1]+')">'+(j+1)+' · '+g[0]+'</span><div class="cs">'+items.filter(d=>d.g===j).map(chips).join('')+'</div></div>').join(''))+
    '<div class="cr-tags"></div>';
  const $=s=>w.querySelector(s);let e=null;
  function draw(){e=crEval(base,items,on);$('.cr-sv').innerHTML=crRoad(e,Object.assign({on},o.road||{}));$('.cr-ro').innerHTML=crReadout(e,o.road||{});$('.cr-tags').innerHTML=crTags(e);
    w.querySelectorAll('.cs .chip').forEach(c=>c.classList.toggle('sel',on.has(c.dataset.k)));if(o.onChange)o.onChange(api);}
  w.querySelectorAll('.cs .chip').forEach(c=>c.onclick=()=>{if(api.lock)return;const k=c.dataset.k,d=items.find(x=>x.k===k);if(on.has(k))on.delete(k);else on.add(k);api.last=k;
    const sy=$('.cr-dsay');if(sy)sy.innerHTML=on.has(k)?'<b class="k">'+d.n.toUpperCase()+'</b>'+d.d:'<b class="k">REMOVED</b>'+d.n+' is off the road.';draw();});
  const api={on,get e(){return e;},last:null,lock:false,set(keys){on.clear();keys.forEach(k=>on.add(k));draw();},tog(k){w.querySelector('.cs .chip[data-k="'+k+'"]').click();}};
  draw();return api;}

/* ---------- the slippery slope (rent talk; risks are illustrative) ---------- */
const CR_SL=[['Safe ground','Ask the landlord, calmly, for a smaller rise.',0],['Step 1','Mention you’re looking at other flats.',.05],['Step 2','Book two viewings, and say so.',.10],
 ['Step 3','Let the landlord’s reply date pass unsigned.',.15],['Step 4','Send a draft notice, “just in case”.',.25],['Step 5','Let the notice stand.',.40]];
const CR_SX=[34,88,138,182,220,252];
const crSY=x=>58+150*Math.pow(Math.max(0,x-30)/250,2.3);
const crCum=k=>1-CR_SL.slice(1,k+1).reduce((a,s)=>a*(1-s[2]),1);
function crSlope(st,o){o=o||{};const hi=st.stakes==='high';let pts='';for(let x=30;x<=282;x+=6)pts+=' L'+x+' '+crSY(x).toFixed(1);
  let s='<svg class="cr-svg" viewBox="0 0 330 250" role="img" aria-label="'+(o.aria||'A slope that gets steeper step by step, ending in '+(hi?'a ravine':'a puddle'))+'"><rect width="330" height="250" rx="14" fill="var(--soft)"/>';
  if(o.cliff){s+='<path d="M10 92H214V244H10Z" fill="var(--soft2)"/><path d="M10 92H214V244" fill="none" stroke="var(--line2)" stroke-width="2.5"/>'+
      '<path d="M216 200H330V250H216Z" fill="var(--no-bg)"/><path d="M226 214l8 26M248 222l6 20M272 210l6 26M300 218l5 22" stroke="var(--no-strong)" stroke-width="2" opacity=".6"/>'+crTx(272,196,'the drop',{c:'var(--no)'})+
      crFig(198,58,'var(--h1)','')+crTx(184,70,'Tali',{a:'end'})+crTx(112,128,'firm, flat footing',{c:'var(--muted)'})+crTx(112,146,'a clear edge',{c:'var(--muted)'})+
      '<path d="M222 70h50" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="3 3"/>'+crTx(276,74,'jump?',{a:'start',c:'var(--muted)'})+
      crTx(272,130,'you’d fall only',{c:'var(--muted)'})+crTx(272,146,'by jumping',{c:'var(--muted)'});return s+'</svg>';}
  s+='<path d="M10 240V58H30'+pts+' L282 240Z" fill="var(--soft2)"/><path d="M10 58H30'+pts+'" fill="none" stroke="var(--line2)" stroke-width="2.5"/>';
  s+=hi?'<path d="M282 208L292 250H330V204Z" fill="var(--no-bg)"/><path d="M282 208L292 250M330 204L318 250M296 226l10 6M314 216l6 10" stroke="var(--no-strong)" stroke-width="2"/>'+crTx(308,196,'ravine',{c:'var(--no)'})
       :'<ellipse cx="306" cy="234" rx="22" ry="7" fill="var(--h2-bg)" stroke="var(--h2)" stroke-width="1.5"/>'+crTx(306,212,'puddle',{c:'var(--h2)'});
  s+=crTx(12,98,o.safe||'safe ground',{a:'start',c:'var(--muted)',w:600});
  if(!o.noRisk)CR_SX.forEach((x,k)=>{if(!k)return;const y=crSY(x);s+='<circle cx="'+x+'" cy="'+y.toFixed(1)+'" r="3.5" fill="var(--card)" stroke="var(--muted)" stroke-width="1.5"/>'+crTx(x-2,y+21,Math.round(CR_SL[k][2]*100)+'%',{s:13,c:k<=st.k?'var(--no)':'var(--muted)'});});
  if(o.marks)o.marks.forEach(m=>{const x=CR_SX[m[0]],y=crSY(x);s+='<circle cx="'+x+'" cy="'+y.toFixed(1)+'" r="3.5" fill="var(--card)" stroke="var(--muted)" stroke-width="1.5"/>';});
  /* landlord (or other side) */
  const blink=st.end==='blink',bt=blink?(o.blinkTxt||'OK, 4% then'):(o.other||'landlord: limit ?'),bw=Math.round(bt.length*6.4+20);
  s+=crFig(304,18,'var(--h4)','')+'<rect x="'+(286-bw)+'" y="10" width="'+bw+'" height="28" rx="9" fill="var(--card)" stroke="'+(blink?'var(--ok-strong)':'var(--h4)')+'" stroke-width="1.5"/>'+
    crTx(286-bw/2,29,bt,{c:blink?'var(--ok)':'var(--h4)'});
  /* the marble */
  let mx,my;if(st.end==='fell'){mx=hi?306:306;my=hi?238:226;}else{mx=CR_SX[st.k];my=crSY(mx)-9;}
  s+='<circle class="cr-t" cx="'+mx+'" cy="'+my.toFixed(1)+'" r="8" fill="'+(st.end==='fell'?'var(--no-strong)':'var(--pri)')+'"/>'+crTx(mx-(st.end==='fell'?30:0),my-13,o.who||'Tali',{c:'var(--ink)',a:st.end==='fell'?'end':'middle'});
  if(o.tag)s+=o.tag;
  return s+'</svg>';}

/* Tali’s moves drawn on Linus’s road (undermining a rule) */
function crLinG(on){let s='';
  if(on.has('quiet'))s+='<g class="cr-t">'+[[104,114],[120,108],[136,114]].map(p=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="5.5" fill="var(--card)" stroke="var(--faint)" stroke-width="1.8" stroke-dasharray="2 2"/><path d="M'+(p[0]-7)+' '+(p[1]+17)+'q7-13 14 0z" fill="var(--card)" stroke="var(--faint)" stroke-width="1.8" stroke-dasharray="2 2"/>').join('')+crTx(120,144,'no audience',{c:'var(--muted)'})+'</g>';
  if(on.has('trade'))s+='<g class="cr-t"><path d="M150 72h28M172 66l6 6-6 6M180 88h-28M158 82l-6 6 6 6" fill="none" stroke="var(--h2)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>'+crTx(165,108,'a fair trade',{c:'var(--h2)'})+'</g>';
  if(on.has('slice'))s+='<g class="cr-t"><circle cx="246" cy="170" r="9" fill="var(--h4-bg)" stroke="var(--h4)" stroke-width="1.6"/><path d="M246 170L246 161A9 9 0 0 1 254 166Z" fill="var(--h4)"/>'+crTx(232,166,'one small slice',{a:'end',c:'var(--h4)'})+'</g>';
  if(on.has('outlet'))s+='<g class="cr-t"><path d="M190 214H232" stroke="var(--ok-strong)" stroke-width="2.5"/><path d="M238 214l-9-5v10z" fill="var(--ok-strong)"/>'+crTx(244,218,'a way out',{a:'start',c:'var(--ok)'})+'</g>';
  if(on.has('corner'))s+='<g class="cr-t"><path d="M142 212V262H188V212" fill="none" stroke="var(--no-strong)" stroke-width="3"/>'+crTx(196,252,'cornered',{a:'start',c:'var(--no)'})+'</g>';
  return s;}

/* ---------- tiny scene pictures for the “Which device is this?” round ---------- */
function crQi(k){const W=(b,lab)=>'<svg viewBox="0 0 150 70" role="img" aria-label="'+lab+'" style="display:block;width:170px;max-width:60%;margin:0 auto 8px"><rect width="150" height="70" rx="12" fill="var(--soft)"/>'+b+crTx(75,64,lab,{c:'var(--muted)',s:11.5,w:600})+'</svg>';
  if(k==='mail')return W('<rect x="50" y="10" width="50" height="34" rx="4" fill="var(--card)" stroke="var(--h4)" stroke-width="2"/><path d="M50 12l25 18 25-18" fill="none" stroke="var(--h4)" stroke-width="2"/><circle cx="102" cy="40" r="9" fill="var(--card)" stroke="var(--no-strong)" stroke-width="2"/><path d="M96 46l12-12" stroke="var(--no-strong)" stroke-width="2"/>','auto-reply: away');
  if(k==='team')return W([31,53,75,97,119].map(x=>crFig(x,14,x===75?'var(--h1)':'var(--h2)','')).join('').replace(/r="8"/g,'r="6"'),'told the whole team');
  if(k==='bet')return W(crFig(75,12,'var(--h3)','')+[48,102].map(x=>[0,1,2].map(j=>'<ellipse cx="'+x+'" cy="'+(40-j*5)+'" rx="11" ry="3.5" fill="var(--h3-bg)" stroke="var(--h3)" stroke-width="1.5"/>').join('')).join('')+crTx(48,22,'£50',{c:'var(--h3)',s:11.5})+crTx(102,22,'£50',{c:'var(--h3)',s:11.5}),'the captain holds it');
  if(k==='stage')return W('<rect x="10" y="22" width="130" height="24" rx="6" fill="var(--h2-bg)"/>'+[30,58,86,114].map(x=>'<ellipse cx="'+x+'" cy="34" rx="10" ry="6" fill="var(--card)" stroke="var(--h2)" stroke-width="1.6"/>').join(''),'pay after each stage');
  if(k==='desk')return W(crFig(75,12,'var(--h3)','')+'<rect x="30" y="36" width="90" height="12" rx="3" fill="var(--line2)"/>'+'<rect x="94" y="10" width="30" height="20" rx="3" fill="var(--card)" stroke="var(--h3)" stroke-width="1.5"/><path d="M99 16h20M99 21h20M99 26h12" stroke="var(--h3)" stroke-width="1.2"/>','“the policy says”');
  if(k==='app')return W('<rect x="58" y="4" width="34" height="48" rx="6" fill="var(--card)" stroke="var(--line2)" stroke-width="2"/><rect x="66" y="16" width="18" height="18" rx="4" fill="var(--h4-bg)" stroke="var(--h4)" stroke-width="1.5"/><path d="M62 12l26 32M88 12l-26 32" stroke="var(--no-strong)" stroke-width="2.5" stroke-linecap="round"/>','app deleted');
  return '';}

/* ---------- the strategy-map strip (CANON “The strategy map”; built lesson by lesson) ---------- */
const CR_TL={look:['Look ahead',2],dil:['Prisoners’ dilemma',3],shoes:['Their shoes',5],mix:['Mix',6],commit:['Commit',7],cred:['Credible',8],sig:['Signals',9],coord:['Coordinate',10],bid:['Bid smart',11],batna:['BATNA',12],vote:['Vote',13],inc:['Incentives',14]};
const CR_ROWS=[['Taking turns',['look','cred','commit']],['Both choose at once',['shoes','dil','mix']],['Everyone’s tempted to grab or slack',['dil','coord','inc']],['Everyone must land on the same choice',['shoes','coord','commit']],['Your pattern is read, or you check',['mix']],['You want to change someone’s behaviour',['commit','cred','look']],['They know something you don’t',['sig','shoes','bid']],['Splitting or agreeing a price',['batna','cred','sig']],['Competing for one prize',['bid','sig','dil']],['A group decides together',['vote','coord','batna']],['Good work you can’t watch',['inc','sig','cred']]];

Course.lesson({
  id:'0008', title:'Making your moves believable', minutes:20, icon:'shield',
  goals:['Check whether a threat or promise will be believed by looking at the moment of truth, and fix it with a device from the eightfold path',
         'Use brinkmanship with care: see the slope, how the risk adds up step by step, and when the stakes are too high to start',
         'Handle other people’s rigid moves gently, and help a good promise be believed'],
  parts:['The moment of truth','Eight devices','The slippery slope','Use it this week'],
  read:'Read chapter 7 of the book for all eight devices and their stories (from Cortés’s ships to the Commitment Store), the ways to undermine someone else’s credibility and the textbook case. The “Brinkmanship” section at the end of chapter 6 covers the slope.',
  glossary:{
   'eightfold-path':'Eightfold path to credibility: the book’s eight ways to make a threat or promise believable: contracts, reputation, cutting off communication, burning bridges, leaving it to chance, small steps, teamwork and mandated agents.',
   'mandated-agent':'Mandated agent: someone (or something, like a rule or a machine) that acts for you and has no power to give way, so your position can’t be talked down.',
   'salami-tactics':'Salami tactics: getting round someone’s threat one thin slice at a time, each step too small to be worth punishing.'
  },
  cheatsheet:[
   '<b>The moment of truth decides.</b> A threat or promise works only if, when the time comes, carrying it out is still your best move, or your way out is gone. Words alone don’t change that.',
   '<b>Change the payoffs:</b> a contract (strongest when the enforcer has their own reason to enforce; otherwise both sides can tear it up) or your reputation (counts only if the game goes on).',
   '<b>Limit your way out:</b> cut off contact, burn a bridge or leave it to chance. Each has a price: no news, no way back if you were wrong, accidents.',
   '<b>Small steps:</b> pay or lend in stages so each side risks only one step at a time. Keep the end open, or trust unravels from the last step.',
   '<b>Use others:</b> a team that holds you to it, or an agent (a rule, a machine, a negotiator) who can’t give way.',
   '<b>Brinkmanship</b> deliberately creates a risk neither side controls. The brink is a slope, not a cliff, and the risk adds up step by step. Only where a fall is small; if you’d blink first, don’t start.',
   '<b>Their moves:</b> renegotiate, take a small slice, ask past the agent, and always leave a face-saving way out. If their promise helps you both, help it be believed.',
   'One-minute move (how this course applies the book): would I really follow through? → change the payoffs → limit my way out → small steps → use others → against their move: undermine gently.'
  ],
  steps:[
/* ---------- PART 1: THE MOMENT OF TRUTH ---------- */

{part:0,src:'Chapter 7 · The Eightfold Path to Credibility',
 solve:async L=>{L.$('#wd').children[0].click();L.$('#wj').click();},
 run(L){
  L.h(L.kick('learn','The moment of truth')+'<h1 class="q">Tali lends Arlo £3,000 for a coffee cart, with a rule: “Miss a repayment, and no more money from me.” Try to make Arlo believe it.</h1>'+
   '<div id="wsv"></div><div class="cr-ctl" id="wd"></div><div class="cr-ctl"><button class="btn pri" id="wj" hidden>'+L.ic('play')+'Jump to the moment of truth</button></div>'+
   '<div class="cr-say" id="wsay" aria-live="polite">The bubble shows what Arlo expects Tali to do if a repayment is missed. Arlo’s behaviour follows the bubble.</div><div id="wq"></div>');
  const e=crEval(CR_BASE,CR_DEV,new Set());let said=null,fin=false;
  const draw=()=>L.$('#wsv').innerHTML=crRoad(e,{hidePiles:!fin,say:said,aria:'Tali at the fork; Arlo expects Tali to let it slide'});draw();
  [['Say it firmly','I mean it this time.'],['Say it louder','I REALLY MEAN IT!'],['Swear on it','I swear, last time.']].forEach((m,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=m[0];
    b.onclick=()=>{if(fin)return;said=m[1];[...L.$('#wd').children].forEach((x,q)=>x.classList.toggle('sel',q===j));draw();
      L.$('#wsay').innerHTML='<b class="k">THE BUBBLE DOESN’T MOVE</b>Arlo has heard words before. They cost Tali nothing to say, so they tell Arlo nothing about what Tali will do.';L.$('#wj').hidden=false;};L.$('#wd').appendChild(b);});
  L.$('#wj').onclick=function(){this.hidden=true;fin=true;said=null;draw();
    L.$('#wsay').innerHTML='<b class="k">TWO MONTHS IN</b>Arlo misses a repayment and asks for £500 more. Saying no means a row, a stalled cart and Hedda upset: <b>2</b>. Lending anyway keeps the peace: <b>6</b> (illustrative numbers). Arlo can see the piles too.';

 run(L){
  const card=(x,t,a,b,done,note)=>{let s='<rect x="'+(x-78)+'" y="4" width="156" height="166" rx="12" fill="var(--card)" stroke="var(--line2)" stroke-width="1.5"/>'+crTx(x,22,t,{s:12});
    const lp=[x,150,x,126,x-44,120,x-46,72],rp=[x,150,x,126,x+44,120,x+46,72];

  const st=[false,false];

    card(82,'A threat in Eden',['Threatened:','death'],['Done:','banished'],st[0],'too costly to carry out')+card(248,'A promise to a goblin',['Promised:','sword now'],['Planned:','sword later'],st[1],'the goblin grabbed it')+'</svg>';
  L.h(L.kick('ex','Two stories from the book')+'<h1 class="q">Even the most powerful have this problem. Tap each story.</h1><div id="esv"></div><div class="cr-ctl" id="ec"></div><div class="cr-say" id="esay" aria-live="polite">Each fork shows what was said, and the road taken when the moment came.</div>');

  [['Eden','<b class="k">A THREAT TOO COSTLY</b>The book’s playful reading of Genesis: the threatened punishment for eating the fruit was death. Carrying it out would have wiped out the new creation, so the punishment turned out far milder: banishment. The serpent had guessed it was a bluff.'],
   ['Harry Potter','<b class="k">A PROMISE BENT</b>Harry promises the goblin Griphook the Sword of Gryffindor for helping break into the bank, but plans to use it first and hand it over later. Griphook expected it at once, and simply snatched it during the escape. Even a hero had a credibility problem.']].forEach((m,j)=>{
    const b=document.createElement('button');b.className='chip';b.textContent=m[0];b.onclick=()=>{st[j]=true;b.classList.add('sel');draw();L.$('#esay').innerHTML=m[1];
      if(!fin&&st[0]&&st[1]){fin=true;L.sheet('info','Strategic moves need credibility','Commitments, threats and promises do nothing unless believed. The “what” of a strategic move is science; the “how” of making it believed is, the authors say, an art: examples help, nothing works every time, and success is a matter of degree.');L.done();}};L.$('#ec').appendChild(b);});}},

{part:0,src:'Chapter 7 · The Eightfold Path to Credibility',
 solve:async L=>{L.$$('#gc .chip').forEach(b=>b.click());},
 run(L){
  L.h(L.kick('learn','The eightfold path')+'<h1 class="q">The book’s eight devices, built on three ideas. Tap each group to see where it acts on the road.</h1><div id="gsv"></div><div class="cr-ctl" id="gc"></div>'+
   '<div class="cr-say" id="gsay" aria-live="polite">All eight devices are placed, faded. Pick a group.</div>');
  const e=crEval(CR_BASE,CR_DEV,new Set());const draw=hl=>L.$('#gsv').innerHTML=crRoad(e,{all:true,hl:hl||new Set(),hidePiles:true,months:false,aria:'The road with all eight devices drawn faintly'});draw();
  const T=['<b class="k">1 · CHANGE THE PAYOFFS</b>A <b>contract</b> puts a toll on the back-down road; <b>reputation</b> adds future gains to the follow-through road. Both make breaking your word cost more than keeping it.',
   '<b class="k">2 · LIMIT YOUR WAY OUT</b><b>Cut off contact</b> so nobody can talk you round, <b>burn the bridge</b> on the back-down road, or <b>leave it to chance</b>: the fork becomes a spinner you don’t control.',
   '<b class="k">3 · SMALL STEPS</b>Break one big promise into many small ones. Each stage is too small to be worth breaking, given what the rest is worth.',
   '<b class="k">4 · USE OTHERS</b>A <b>team</b> that holds you to it, or an <b>agent</b> (a negotiator, a rule, a machine) who simply can’t give way.'];
  const seen=new Set();let fin=false;
  CR_G.forEach((g,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=g[0];b.onclick=()=>{[...L.$('#gc').children].forEach((x,q)=>x.classList.toggle('sel',q===j));
    draw(new Set(CR_DEV.filter(d=>d.g===j).map(d=>d.k)));L.$('#gsay').innerHTML=T[j];seen.add(j);
    if(!fin&&seen.size===4){fin=true;L.sheet('info','Three ideas, eight devices','Change the payoffs (1–2), limit your ability to back out (3–5), and use others (7–8), with small steps (6) shrinking the problem itself. Real situations often need more than one, and even together they don’t work every time. This is the book’s '+L.g('eightfold-path','eightfold path')+'.');L.done();}};L.$('#gc').appendChild(b);});}},

{part:0,src:'Chapter 7 · Contracts',pts:1,
 solve:async L=>{L.$('#pp').children[1].click();L.$('#pw').click();},
 run(L){
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">Tali writes the loan down: dates, amounts, a small late fee, both sign. Will Arlo now believe “no more money if you miss”?</h1>'+
   '<div id="psv"></div><div class="cr-ctl cr-col" id="pp"></div><div class="cr-ctl"><button class="btn pri" id="pw" hidden>'+L.ic('play')+'Place the contract</button></div><p class="cr-ro" id="pro"></p>');
  const draw=on=>{const e=crEval(CR_BASE,CR_DEV,on);L.$('#psv').innerHTML=crRoad(e,{on,renego:on.has('con'),aria:on.size?'The road with a contract on the back-down road':'The road with no devices'});if(on.size)L.$('#pro').innerHTML=crReadout(e);};draw(new Set());
  let pick=null;['Yes: it’s in writing now','No: Arlo still expects Tali to let it slide','Only if Arlo has a lawyer'].forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=n;
    b.onclick=()=>{if(b.disabled)return;pick=j;[...L.$('#pp').children].forEach((x,q)=>x.classList.toggle('sel',q===j));L.$('#pw').hidden=false;};L.$('#pp').appendChild(b);});
  L.$('#pw').onclick=function(){this.hidden=true;[...L.$('#pp').children].forEach(x=>x.disabled=true);draw(new Set(['con']));const ok=pick===1;L.award(ok);
    L.sheet(ok?'ok':'no',ok?'Still not believed':'The bubble doesn’t flip','Only Tali and Arlo could enforce it, and at the moment of truth both would rather tear it up. The book’s dieter offered a $25,000 bounty (for charity) to anyone who caught him eating in a restaurant; he could then offer the diners a round of drinks to let him off. A contract bites when the enforcer has their own reason to enforce: a buyer who wants the delivery, or the Commitment Store, which sends forfeits to charity.');L.done();};}},

/* ---------- PART 2: EIGHT DEVICES ---------- */
{part:1,src:'Chapter 7 · Reputation',
 solve:async L=>{L.$$('#rc .chip').forEach(b=>b.click());},
 run(L){
  L.h(L.kick('learn','Reputation')+'<h1 class="q">Backing down now can cost Tali in every later game. Switch the situation and watch who’s watching.</h1>'+
   '<svg class="cr-svg" id="rsv" viewBox="0 0 330 200" role="img" aria-label="Tali in the middle, people from future games around"></svg><div class="cr-ctl" id="rc"></div><div class="cr-say" id="rsay" aria-live="polite">Pick a situation.</div>');
  const W=[[50,40,'Arlo next year'],[165,26,'Juno'],[280,40,'Hedda'],[50,150,'Arlo’s next ask'],[280,150,'other family loans']];
  function draw(m){let s='<rect width="330" height="200" rx="14" fill="var(--soft)"/>';
    W.forEach(p=>{const live=m===1||m===2,c=live?'var(--h1)':'var(--faint)';
      if(live)s+='<path d="M165 100L'+p[0]+' '+(p[1]+10)+'" stroke="var(--h1)" stroke-width="1.5" stroke-dasharray="3 3" opacity=".6"/>';
      s+='<circle cx="'+p[0]+'" cy="'+(p[1]-4)+'" r="6.5" fill="var(--card)" stroke="'+c+'" stroke-width="2"'+(live?'':' stroke-dasharray="2 2"')+'/><path d="M'+(p[0]-9)+' '+(p[1]+14)+'q9-15 18 0z" fill="var(--card)" stroke="'+c+'" stroke-width="2"'+(live?'':' stroke-dasharray="2 2"')+'/>'+crTx(p[0],p[1]+28,p[2],{c,s:11});});
    s+='<circle cx="165" cy="100" r="22" fill="var(--card)" stroke="var(--h1)" stroke-width="2"/>'+crTx(165,105,'Tali',{s:12});
    if(m===0)s+=crTx(165,146,'a one-off: nobody will remember',{c:'var(--muted)'});
    if(m===1)s+='<g class="cr-t">'+[0,1,2].map(j=>'<ellipse cx="252" cy="'+(116-j*6)+'" rx="12" ry="4" fill="var(--h3-bg)" stroke="var(--h3)" stroke-width="1.5"/>').join('')+crTx(252,96,'+2',{s:13,c:'var(--h3)'})+crTx(165,146,'follow-through pays off later',{c:'var(--h3)'})+'</g>';
    if(m===2)s+='<g class="cr-t"><path d="M134 104l-26 -10v24z" fill="var(--h4-bg)" stroke="var(--h4)" stroke-width="1.5"/><rect x="134" y="99" width="8" height="10" rx="2" fill="var(--h4)"/><path d="M100 94q-8 12 0 24M92 88q-12 18 0 36" fill="none" stroke="var(--h4)" stroke-width="1.6" stroke-linecap="round"/>'+crTx(165,146,'said in public: the stake is bigger',{c:'var(--h4)'})+'</g>';
    L.$('#rsv').innerHTML=s;}
  draw(-1);const M=[['A one-off','<b class="k">A ONE-OFF</b>Selling a sofa to a stranger. Nobody you’ll deal with again is watching, so a reputation is worth little and backing down costs nothing later.'],
   ['Ongoing','<b class="k">AN ONGOING GAME</b>Family loans for years. Arlo will ask again, and others hear about it. Holding firm today makes every future rule believable, so the follow-through pile grows.'],
   ['Said in public','<b class="k">A PUBLIC DECLARATION</b>Saying it in front of others puts your reputation on the line. The book’s warning: break a public pledge and the damage can last. A presidential candidate’s “no new taxes”, broken a year later, hurt their re-election.']];
  const seen=new Set();let fin=false;
  M.forEach((m,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=m[0];b.onclick=()=>{[...L.$('#rc').children].forEach((x,q)=>x.classList.toggle('sel',q===j));draw(j);L.$('#rsay').innerHTML=m[1];seen.add(j);
    if(!fin&&seen.size===3){fin=true;L.sheet('info','A record, not a look','A reputation is built by what you have actually done when it cost you. Things anyone can do (looking tough, sounding firm) don’t count. And when a reputation is strong enough, you may not even need a contract: your word is your bond.');L.done();}};L.$('#rc').appendChild(b);});}},

{part:1,src:'Chapter 7 · Burning Bridges behind You',
 solve:async L=>{L.$$('#xc .chip').forEach(b=>b.click());},
 run(L){
  L.h(L.kick('learn','Limit your way out')+'<h1 class="q">Three ways to make backing down impossible. Try each on Tali’s road, and read its price.</h1><div id="xsv"></div><div class="cr-ctl" id="xc"></div><div class="cr-say" id="xsay" aria-live="polite">Pick a device.</div>');
  const D=[['cut','Cut off contact','<b class="k">CUT OFF CONTACT</b>Once a letter is posted, you can’t take it back; a will can hardly be renegotiated once its writer has died. Being unreachable makes a move irreversible. <b>Price:</b> you can’t check the other side complied, or hear real news.'],
   ['burn','Burn a bridge','<b class="k">BURN A BRIDGE</b>Armies that burned their own ships (William the Conqueror in 1066, Cortés in Mexico) had to fight. Polaroid stayed only in instant photos, so it had to defend that market against Kodak, and won. <b>Price:</b> no way back if you were wrong.'],
   ['luck','Leave it to chance','<b class="k">LEAVE IT TO CHANCE</b>In the film <i>Dr. Strangelove</i>, a doomsday machine fires automatically, so the threat is fully believed. <b>Price:</b> an accident can set it off when nobody wants it. A risk, not a certainty, keeps the threat smaller.']];
  const draw=k=>{const on=new Set(k?[k]:[]);L.$('#xsv').innerHTML=crRoad(crEval(CR_BASE,CR_DEV,on),{on,aria:'The road with '+(k||'no device')});};draw(null);
  const seen=new Set();let fin=false;
  D.forEach((d,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=d[1];b.onclick=()=>{[...L.$('#xc').children].forEach((x,q)=>x.classList.toggle('sel',q===j));draw(d[0]);L.$('#xsay').innerHTML=d[2];seen.add(j);
    if(!fin&&seen.size===3){fin=true;L.sheet('info','They work, at a price','Cutting off and burning close the back-down road; chance turns the fork into a spinner. All three flip Arlo’s bubble, and all three carry a side effect. The book also notes the reverse: Sun Tzu advised leaving an enemy a way out, so they don’t fight with the courage of the cornered.');L.done();}};L.$('#xc').appendChild(b);});}},

{part:1,src:'Chapter 7 · Moving in Steps',
 solve:async L=>{const s=L.$('#nr');s.value=6;s.dispatchEvent(new Event('input',{bubbles:true}));L.$$('#nc .chip').forEach(b=>b.click());},
 run(L){
  L.h(L.kick('ex','Small steps · Hedda’s bathroom')+'<h1 class="q">Hedda’s builder: £6,000 of work (illustrative). Slide the number of stages and watch how much either side could lose at once.</h1>'+
   '<svg class="cr-svg" id="nsv" viewBox="0 0 330 176" role="img" aria-label="Stepping stones across a river between Hedda and the builder"></svg>'+
   '<label class="cr-sl"><span class="h"><span>Pay in stages</span><b id="nv"></b></span><input type="range" id="nr" min="1" max="10" step="1" value="1" aria-label="Number of payment stages, 1 to 10"></label>'+
   '<div class="cr-ctl" id="nc"><button class="chip" data-m="end">A clear last stage</button><button class="chip" data-m="open">More work likely later</button></div><p class="cr-ro" id="nro" aria-live="polite"></p>');
  let n=1,mode=null,moved=false;const seen=new Set();let fin=false;
  function draw(){let s='<rect width="330" height="176" rx="14" fill="var(--soft)"/><rect x="62" y="20" width="206" height="118" fill="var(--h2-bg)"/>'+
      '<path d="M62 46q20 -6 40 0t40 0t40 0t40 0t46 0M62 112q20 -6 40 0t40 0t40 0t40 0t46 0" fill="none" stroke="var(--h2)" stroke-width="1.2" opacity=".5"/>'+
      crFig(32,58,'var(--h4)','Hedda',112)+crFig(298,58,'var(--h3)','builder',112);
    const gap=206/(n+1);for(let j=1;j<=n;j++){const x=62+gap*j,last=j===n&&n>1,crack=mode==='end'&&n>1&&j>=n-1;
      s+='<ellipse class="cr-t" cx="'+x.toFixed(1)+'" cy="80" rx="'+Math.max(6,Math.min(22,gap/2-2)).toFixed(1)+'" ry="10" fill="var(--card)" stroke="'+(crack?'var(--no-strong)':'var(--line2)')+'" stroke-width="2"'+(crack?' stroke-dasharray="4 3"':'')+'/>';
      if(last&&mode)s+=crTx(x,104,mode==='end'?'last step':'not the last',{c:mode==='end'?'var(--no)':'var(--ok)'});}
    if(mode==='end'&&n>1)s+='<path d="M'+(62+gap*n-4).toFixed(1)+' 60Q'+(62+gap*(n-1)).toFixed(1)+' 42 '+(62+gap*(n-1)-8).toFixed(1)+' 62" fill="none" stroke="var(--no-strong)" stroke-width="2"/><path d="M'+(62+gap*(n-1)-8).toFixed(1)+' 62l-3-8 8 3z" fill="var(--no-strong)"/>'+crTx(165,14,'cheat at the end? then the step before is the end…',{c:'var(--no)',s:11});
    const r=Math.round(6000/n);s+=crTx(165,158,'at most £'+r.toLocaleString('en-GB')+' at risk at once',{s:13,c:n>=4?'var(--ok)':'var(--no)'});
    L.$('#nsv').innerHTML=s;L.$('#nv').textContent=n===1?'1 (all at once)':n+' stages';
    L.$('#nro').innerHTML=n===1?'One big jump: pay up front and the builder could slow down or walk off; pay at the end and Hedda could refuse.':'Each side risks <b>one stage</b> at a time. Breaking a small promise would cost the rest of the job.';
    if(!fin&&moved&&n>=4&&seen.size===2){fin=true;L.sheet('info','Trust a little at a time','Builders and homeowners each fear being cheated, so builders are paid as the work progresses: each side risks one stage at most. The catch: if there’s a clear last step, people expect cheating there, then on the step before, and trust unravels. The fix is no clear end: a chance of more business keeps everyone honest. Be extra careful in a closing-down sale.');L.done();}}
  L.$('#nr').addEventListener('input',e=>{n=+e.target.value;moved=true;draw();});
  L.$$('#nc .chip').forEach(b=>b.onclick=()=>{mode=b.dataset.m;seen.add(mode);L.$$('#nc .chip').forEach(x=>x.classList.toggle('sel',x===b));draw();});draw();}},

{part:1,src:'Chapter 7 · Teamwork',
 solve:async L=>{L.$$('#uc .chip').forEach(b=>b.click());},
 run(L){
  L.h(L.kick('learn','Use others')+'<h1 class="q">Sometimes other people hold your line better than you can. Look at both.</h1>'+
   '<svg class="cr-svg" id="usv" viewBox="0 0 330 190" role="img" aria-label="A team that holds each other to a rule, or an agent who can’t give way"></svg><div class="cr-ctl" id="uc"></div><div class="cr-say" id="usay" aria-live="polite">Pick one.</div>');
  function draw(m){let s='<rect width="330" height="190" rx="14" fill="var(--soft)"/>';
    if(m===-1){/* default: both scenes side by side, faint, until the learner picks one */
      s+=crTx(82,24,'A TEAM',{c:'var(--h2)',s:12})+crTx(248,24,'AN AGENT',{c:'var(--h3)',s:12})+'<path d="M165 34V150" stroke="var(--line2)" stroke-width="1.5" stroke-dasharray="4 4"/>';
      s+='<g opacity=".55">'+[40,82,124].map(x=>'<rect x="'+(x-16)+'" y="104" width="32" height="8" rx="2" fill="var(--line2)"/>'+crFig(x,62,'var(--h2)','')).join('')+
        '<path d="M52 74h18M112 74h-18" stroke="var(--h2)" stroke-width="2"/><path d="M72 74l-5-3.5v7zM92 74l5-3.5v7z" fill="var(--h2)"/>'+
        '<rect x="216" y="40" width="64" height="88" rx="8" fill="var(--card)" stroke="var(--line2)" stroke-width="2"/>'+[0,1].map(r=>[0,1].map(c=>'<rect x="'+(224+c*26)+'" y="'+(50+r*24)+'" width="20" height="18" rx="3" fill="var(--soft2)"/>').join('')).join('')+
        '<rect x="228" y="104" width="40" height="14" rx="3" fill="var(--soft2)"/>'+crTx(248,115,'£1.50',{c:'var(--ink)'})+'</g>';
      s+=crTx(82,140,'holds you to it',{c:'var(--h2)',s:12})+crTx(248,140,'can’t give way',{c:'var(--h3)',s:12})+crTx(165,176,'tap a button to see each one',{c:'var(--muted)',w:600,s:12});}
    if(m===0){s+=crTx(165,22,'AN EXAM WITH AN HONOUR CODE',{c:'var(--muted)'});[50,108,166,224,282].forEach((x,j)=>{const ch=j===2;s+='<rect x="'+(x-22)+'" y="112" width="44" height="10" rx="2" fill="var(--line2)"/>'+crFig(x,64,ch?'var(--no-strong)':'var(--h2)','');
      if(ch)s+=crTx(x,48,'cheats',{c:'var(--no)'});});
      s+='<path d="M124 76h24M208 76h-24" stroke="var(--h2)" stroke-width="2"/><path d="M150 76l-6-4v8zM182 76l6-4v8z" fill="var(--h2)"/>'+crTx(165,146,'staying silent breaks the code too',{c:'var(--h2)'})+crTx(165,166,'so neighbours report',{c:'var(--muted)',w:600,s:12});}
    if(m===1){s+=crFig(70,40,'var(--h3)','')+'<rect x="14" y="96" width="112" height="40" rx="8" fill="var(--card)" stroke="var(--h3)" stroke-width="1.5"/>'+crTx(70,112,'members’ mandate:',{c:'var(--h3)'})+crTx(70,128,'no less than 5%',{c:'var(--ink)'})+crTx(70,160,'a union negotiator',{c:'var(--muted)',w:600,s:12});
      s+='<rect x="214" y="26" width="64" height="110" rx="8" fill="var(--card)" stroke="var(--line2)" stroke-width="2"/>'+[0,1,2].map(r=>[0,1].map(c=>'<rect x="'+(222+c*26)+'" y="'+(36+r*24)+'" width="20" height="18" rx="3" fill="var(--soft2)"/>').join('')).join('')+
        '<rect x="226" y="112" width="40" height="14" rx="3" fill="var(--soft2)"/>'+crTx(246,123,'£1.50',{c:'var(--ink)'})+crTx(246,160,'a vending machine',{c:'var(--muted)',w:600,s:12})+crTx(246,176,'nobody haggles',{c:'var(--muted)',w:600,s:12});}
    L.$('#usv').innerHTML=s;}
  draw(-1);const M=[['A team','<b class="k">TEAMWORK</b>Groups build resolve: Alcoholics Anonymous and diet groups make broken promises cost pride. An honour code makes failing to report cheating a breach too, so the rule enforces its own enforcers (the ancient Roman army used a harsher version of the same idea).'],
   ['An agent','<b class="k">A MANDATED AGENT</b>A union negotiator whose members must approve any deal can’t quietly accept 4% instead of 5%. Rules and machines work the same way: clerks can say a discount is “above their grade”. Agents help most when friendship would make you give way, which is why athletes and authors use them.']];
  const seen=new Set();let fin=false;
  M.forEach((m,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=m[0];b.onclick=()=>{[...L.$('#uc').children].forEach((x,q)=>x.classList.toggle('sel',q===j));draw(j);L.$('#usay').innerHTML=m[1];seen.add(j);
    if(!fin&&seen.size===2){fin=true;L.sheet('info','Others can hold the line','A team changes your payoffs (breaking your word costs you with people you care about). An '+L.g('mandated-agent','agent')+' removes your power to give way. Its limit: the other side may refuse to deal with the agent and ask for the boss.');L.done();}};L.$('#uc').appendChild(b);});}},

{part:1,src:'Chapter 7 · The Eightfold Path to Credibility',pts:6,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which device is this?',['Contract','Reputation','Limit your way out','Small steps','Use others'],[
   [crQi('mail')+'Before the holiday, Tali sets an auto-reply: “No email access until the 14th.”',2,'Cutting off communication: clients can’t pull Tali back in. The price: urgent news can’t reach Tali either, so a teammate must cover.'],
   [crQi('team')+'Tali tells the whole five-a-side team they’re running the city half-marathon in May.',1,'A public declaration puts Tali’s reputation on the line: the team will ask every Thursday how training’s going.'],
   [crQi('bet')+'Tali and a teammate each give the captain £50: whoever misses two gym sessions in a week loses theirs to the other.',0,'A written wager held by a third party, like the Commitment Store’s pact between friends. The captain won’t hand it back just because one of them asks.'],
   [crQi('stage')+'Hedda pays the builder after each finished stage, not all up front.',3,'The book’s own example: each side risks one stage at most.'],
   [crQi('desk')+'At Plover’s front desk: “Discounts are set by the pricing policy. I can’t change them.”',4,'A rule-bound clerk is a mandated agent: nobody can talk them down. You could still ask for the manager.'],
   [crQi('app')+'Tali deletes the food-delivery app to stick to the holiday savings plan.',2,'Burning a bridge: the easy back-down road is gone. If Tali truly needs a meal delivered one night, it’s a hassle, but a small price.']]);}},

{part:1,src:'Chapter 7 · Moving in Steps',pts:1,
 solve:async L=>{const p=L.cp;p.set([]);p.tog('step');p.tog('con');L.$('#hck').click();},
 run(L){
  L.h(L.kick('pr','Challenge · Arlo’s repayment plan')+'<h1 class="q">Make Tali’s rule believable with <b>at most two devices</b> and <b>no side effect</b> that harms the family.</h1><div id="cp"></div>'+
   '<div class="cr-ctl"><button class="btn pri" id="hck">'+L.ic('check')+'Check the plan</button></div><div id="hf"></div>');
  L.cp=crPanel(L,L.$('#cp'),{say:false,onChange(){L.$('#hf').innerHTML='';}});let first=true,fin=false;
  L.$('#hck').onclick=()=>{if(fin)return;const e=L.cp.e,ok=e.verdict==='carry'&&e.n<=2&&!e.harm;if(first){L.award(ok);first=false;}
    if(ok){fin=true;L.cp.lock=true;const st=L.cp.on.has('step');
      L.sheet('ok','Believable, and kind enough',(st?'Small steps do the heavy lifting: saying no to one £1,000 part is easy, and Arlo has the rest of the loan to lose. ':'It works. ')+'In stages and in writing is the book’s pattern for builders, and it makes the deal credible both ways: each on-time repayment unlocks Arlo’s next part, so Arlo’s promise is easier to believe too.');L.done();}
    else{L.$('#hf').innerHTML='';L.fb(L.$('#hf'),e.n>2?'<b>Too many devices ('+e.n+').</b> Which could go?':e.harm?'<b>It works, at a cost.</b> Read the side effect: the family pays for it. Try a gentler pair.':e.n<2?'<b>Not believed yet.</b> One device isn’t enough here. Try a pair.':'<b>Not believed yet.</b> Arlo still bets on the bigger pile. Which device makes saying no cheap for Tali?','no');}};}},

/* ---------- PART 3: THE SLIPPERY SLOPE ---------- */
{part:2,src:'Chapter 6 · Brinkmanship',
 solve:async L=>{L.$$('#bc .chip').forEach(b=>b.click());},
 run(L){
  L.h(L.kick('learn','Brinkmanship')+'<h1 class="q">A threat to “push you off the edge” isn’t believable, since you’d fall too. What is? Compare a cliff with a slope.</h1>'+
   '<div id="bsv"></div><div class="cr-ctl" id="bc"></div><div class="cr-say" id="bsay" aria-live="polite">Pick a picture.</div>');
  const draw=m=>L.$('#bsv').innerHTML=crSlope({k:2,end:null,stakes:'high'},m===0?{cliff:true,aria:'A flat clifftop with a clear edge'}:{noRisk:true,other:'the other side',aria:'A slope that gets steeper, ending in a ravine'});draw(0);
  const M=[['A clear cliff','<b class="k">FIRM FOOTING</b>On a flat top with a sharp edge, you can only fall by jumping on purpose. Nobody believes you’d do that, so standing near the edge scares no one. (The book draws on Thomas Schelling here.)'],
   ['A slippery slope','<b class="k">LOOSE FOOTING</b>On a slope you can slip. Stepping down creates a real risk that neither side fully controls. That shared risk is the threat: the other side gives way to make it go away.']];
  const seen=new Set();let fin=false;
  M.forEach((m,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=m[0];b.onclick=()=>{[...L.$('#bc').children].forEach((x,q)=>x.classList.toggle('sel',q===j));draw(j);L.$('#bsay').innerHTML=m[1];seen.add(j);
    if(!fin&&seen.size===2){fin=true;L.sheet('info','A deliberate, shared risk',L.g('brinkmanship','Brinkmanship')+' is creating a risk of a bad outcome on purpose. You choose how big the risk is, not how it ends. It is chicken played over time: the longer both keep going, the likelier a crash, even if someone swerves late.');L.done();}};L.$('#bc').appendChild(b);});}},

{part:2,src:'Chapter 6 · Brinkmanship',
 solve:async L=>{for(let j=0;j<6&&!L.sl.end;j++)L.$('#sd').click();},
 run(L){
  L.h(L.kick('learn','Explore · the slippery slope')+'<h1 class="q">The landlord wants a 10% rise. Step down the slope to push back. The landlord’s limit is hidden.</h1>'+
   '<p class="cr-ill">Illustrative risks: each step has a chance that talks break down for real that round.</p><div id="ssv"></div>'+
   '<div class="cr-bar"><span class="h"><span>Risk taken so far</span><b id="scm">0%</b></span><span class="b"><i id="sbr" style="width:0"></i></span></div>'+
   '<div class="cr-say" id="ssay" aria-live="polite"></div>'+
   '<div class="cr-ctl"><button class="btn pri" id="sd">'+L.ic('down')+'Take a step down</button><button class="btn" id="su">Pull back</button><button class="btn" id="sn" hidden>'+L.ic('cycle')+'New talk</button></div>'+
   '<div class="cr-lab" style="text-align:center">If talks break down</div><div class="cr-ctl" id="sk"><button class="chip sel" data-s="low">Low stakes</button><button class="chip" data-s="high">High stakes</button></div>');
  const st=L.sl={k:0,end:null,stakes:'low',tol:2+Math.floor(Math.random()*4)};let fin=false,plays=0;
  const FALL={low:'Talks break down. Tali and Juno move to the similar flat they viewed (about £900 and two weekends, illustrative). The landlord has an empty flat for a month. Both lose, but both recover.',
    high:'Talks break down in a tight market, with Juno’s studio in the flat and nothing lined up. Months of disruption. Both lose, and badly.'};
  function draw(){L.$('#ssv').innerHTML=crSlope(st);const c=crCum(st.k);L.$('#scm').textContent=Math.round(c*100)+'%';L.$('#sbr').style.width=(c*100).toFixed(1)+'%';
    const s=CR_SL[st.k];L.$('#ssay').innerHTML=st.end==='fell'?'<b class="k" style="color:var(--no)">YOU BOTH FELL</b>'+FALL[st.stakes]:st.end==='blink'?'<b class="k" style="color:var(--ok)">THE LANDLORD BLINKED</b>At step '+st.k+' the risk got too much for the landlord: a 4% rise instead of 10%. Lucky this time: nobody knew where the landlord’s limit was.':
      st.end==='back'?'<b class="k">PULLED BACK</b>Tali climbs back to safe ground and accepts the landlord’s middle offer of 7%. No fall, a smaller win.':'<b class="k">'+s[0].toUpperCase()+(st.k?' · THIS STEP: '+Math.round(s[2]*100)+'% RISK':'')+'</b>'+s[1];
    L.$('#sd').hidden=!!st.end||st.k>=5;L.$('#su').hidden=!!st.end||st.k===0;L.$('#sn').hidden=!st.end;
    if(st.end&&!fin){fin=true;L.sheet('info','You choose the risk, not the result',st.end==='fell'?'That’s the danger the book warns about: the thing both sides dread can happen while you’re raising the stakes.':st.end==='blink'?'It worked, but it could have gone the other way at any step. Try a few more talks and you’ll see falls too.':'Pulling back is always allowed, but only before you slip. Try a few more talks and watch the risk bar.');L.done();}}
  L.$('#sd').onclick=()=>{if(st.end||st.k>=5)return;st.k++;if(Math.random()<CR_SL[st.k][2])st.end='fell';else if(st.k>=st.tol)st.end='blink';draw();};
  L.$('#su').onclick=()=>{if(st.end)return;st.end='back';draw();};
  L.$('#sn').onclick=()=>{plays++;Object.assign(st,{k:0,end:null,tol:2+Math.floor(Math.random()*4)});draw();};
  L.$$('#sk .chip').forEach(b=>b.onclick=()=>{st.stakes=b.dataset.s;L.$$('#sk .chip').forEach(x=>x.classList.toggle('sel',x===b));draw();});draw();}},

{part:2,src:'Chapter 6 · Brinkmanship',pts:1,
 solve:async L=>{L.$('#qp').children[1].click();L.$('#qw').click();},
 run(L){
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">Tali is three steps down and nothing has gone wrong. Is step 4 safer?</h1><div id="qsv"></div>'+
   '<div class="cr-bar"><span class="h"><span>Risk taken so far</span><b id="qcm"></b></span><span class="b"><i id="qbr"></i></span></div>'+
   '<div class="cr-ctl cr-col" id="qp"></div><div class="cr-ctl"><button class="btn pri" id="qw" hidden>'+L.ic('down')+'Take step 4</button></div>');
  const draw=k=>{L.$('#qsv').innerHTML=crSlope({k,end:null,stakes:'low'});const c=crCum(k);L.$('#qcm').textContent=Math.round(c*100)+'%';L.$('#qbr').style.width=(c*100).toFixed(1)+'%';};draw(3);
  let pick=null;['Safer: nothing has gone wrong so far','Riskier: the slope is steeper and the risk keeps adding up','About as risky as step 1'].forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=n;
    b.onclick=()=>{if(b.disabled)return;pick=j;[...L.$('#qp').children].forEach((x,q)=>x.classList.toggle('sel',q===j));L.$('#qw').hidden=false;};L.$('#qp').appendChild(b);});
  L.$('#qw').onclick=function(){this.hidden=true;[...L.$('#qp').children].forEach(x=>x.disabled=true);draw(4);const ok=pick===1;L.award(ok);
    L.sheet(ok?'ok':'no',ok?'Steeper, and it adds up':'Not safer','Step 4 alone carries 25% risk, five times step 1. The risk taken so far jumps from 27% to 45%. Getting this far safely says nothing about the next step. The book retells a film scene where each repeat of a threat raised the odds of disaster, from one in six to one in four, then one in three. If you think you’d blink before the other side does, the book’s advice is not to start.');L.done();};}},

{part:2,src:'Chapter 6 · Brinkmanship',
 solve:async L=>{for(let j=0;j<4;j++)L.$('#kb').click();},
 run(L){
  L.h(L.kick('ex','A case from the book')+'<h1 class="q">October 1962: the Cuban missile crisis, on the slope. Step through it.</h1><div id="ksv"></div><div class="cr-say" id="ksay" aria-live="polite"></div><div class="cr-ctl"><button class="btn pri" id="kb"></button></div>');
  const B=[[0,'OCTOBER 14','Oct 14','Spy-plane photos show Soviet missile sites being built in Cuba, about ninety miles from the US coast.'],
   [2,'OCTOBER 22','Oct 22','President Kennedy announces a naval quarantine of Cuba: a deliberate step down the slope. Defying it could have led, step by step, to war.'],
   [3,'THE TENSE DAYS','tense days','Kennedy put the chance of war somewhere between one in three and even. In the “fog of war”, even the president couldn’t fully steer the blockade: an order to move it closer to Cuba seems never to have taken effect.'],
   [0,'THE PULL-BACK','pulled back','Khrushchev looked down the slope and pulled back. A face-saving deal helped: US missiles in Turkey would later be withdrawn. Both sides climbed back to safe ground.']];
  let j=0,fin=false;
  const show=()=>{const b=B[j];L.$('#ksv').innerHTML=crSlope({k:b[0],end:null,stakes:'high'},{noRisk:true,who:b[2],other:'two superpowers',aria:'The crisis as a marble on a slope: '+b[1]});
    L.$('#ksay').innerHTML='<b class="k">'+b[1]+'</b>'+b[3];L.$('#kb').innerHTML=(j<B.length-1?'Next':L.ic('check')+'Done')+' <span style="opacity:.7;font-weight:500">· step '+(j+1)+' of 4</span>';};
  show();L.$('#kb').onclick=()=>{if(j<B.length-1){j++;show();return;}if(fin)return;fin=true;L.$('#kb').hidden=true;
    L.sheet('info','A slope, not a cliff','There was no single edge: each move made war a little more likely. It ended well, but the book notes that had war come, survivors would have judged Kennedy reckless. The book sees brinkmanship everywhere, in milder forms: a company and a union, a couple, a parent and a child.');L.done();};}},
