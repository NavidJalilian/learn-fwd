{part:3,src:'Chapter 7 · Undermining Your Opponent’s Credibility',pts:1,
 solve:async L=>{const p=L.lp;p.set([]);p.tog('slice');p.tog('outlet');L.$('#lck').click();},
 run(L){
  L.h(L.kick('pr','Their move · Linus’s rule')+'<h1 class="q">Tali needs cover for two client days on holiday. Linus says: “I never cover anyone’s clients.” Get Linus to make an exception, without cornering them.</h1>'+
   L.note('How this course applies the book: Linus is our example. Now Linus is at the fork; Tali predicts.','compass')+'<div id="lp"></div>'+
   '<div class="cr-ctl"><button class="btn pri" id="lck">'+L.ic('check')+'Ask Linus</button></div><div id="lf"></div>');
  const LIN=[{k:'quiet',n:'Keep it quiet',d:'“Nobody else needs to know you helped.” A reputation only matters if people hear of it.',c:-2,tag:'ok',why:'Only fair if true: never ask anyone to hide things from Greer.'},
   {k:'slice',n:'One small slice',d:'“Just forward anything urgent for those two days.” Too small to be worth defending the rule over.',s:2,tag:'ok',why:'Salami tactics: one thin slice at a time.'},
   {k:'outlet',n:'A face-saving way out',d:'“It’s the holiday cover rota Greer set up, not a favour to me.” Linus can say yes without breaking the rule.',s:2,tag:'ok',why:'Leave an outlet: a cornered person digs in.'},
   {k:'trade',n:'A fair trade',d:'“I’ll cover your launch week in March.” A new deal that suits you both.',s:2,tag:'ok',why:'Renegotiation works when the new deal beats the old for everyone.'},
   {k:'corner',n:'Corner them',d:'“Fine. I’ll tell Greer you never help anyone.”',c:2,tag:'harm',why:'No way out: Linus digs in to save face, and the relationship takes the hit.'}];
  L.lp=crPanel(L,L.$('#lp'),{items:LIN,base:{c:5,s:2},groups:false,hint:'Tap Tali’s moves to try them on Linus’s road.',
    road:{who:'Linus',pred:'Tali',L:'KEEP THE RULE',R:'AN EXCEPTION',Lw:'Keep the rule',Rw:'Make an exception',good:'slide',carryTxt:' will keep the rule',slideTxt:' will make an exception',months:false,
      nowWho:'Linus',carryNow:'says no',slideNow:'agrees to cover',aria:'Linus at the fork between keeping the rule and making an exception',glyphs:crLinG},onChange(){L.$('#lf').innerHTML='';}});
  let first=true,fin=false;
  L.$('#lck').onclick=()=>{if(fin)return;const e=L.lp.e,ok=e.verdict==='slide'&&!e.harm;if(first){L.award(ok);first=false;}
    if(ok){fin=true;L.lp.lock=true;L.sheet('ok','Linus says yes, and keeps face','<i>How this course applies the book:</i> Linus’s rule rests on reputation (“if I cover once, everyone will ask”). Shrinking the ask, offering a trade or giving a reason that isn’t a precedent makes the exception the better road for Linus. Leaving an outlet matters most: the book cites Sun Tzu’s advice to leave a surrounded enemy a way out.');L.done();}
    else{L.$('#lf').innerHTML='';L.fb(L.$('#lf'),e.harm?'<b>Cornering backfires.</b> With no face-saving road, Linus digs in. Remove it and try gentler moves.':'<b>Linus still says no.</b> Keeping the rule is still the bigger pile for Linus. Add another gentle move.','no');}};}},

{part:3,src:'Chapter 7 · Undermining Your Opponent’s Credibility',
 solve:async L=>{L.$$('#ec .chip').forEach(b=>b.click());},
 run(L){
  const P=[['Renegotiate',['con'],{renego:true},'<b class="k">RENEGOTIATION</b>When both people present would rather tear a contract up, they can. The book’s dieter could offer the diners a round of drinks to release him. Fix: an enforcer with their own stake (a producer who wants the delivery; a centre where staff lose their jobs if they rewrite a contract).'],
   ['Reputation in a one-off',['rep'],{oneoff:true,lab:{rep:''}},'<b class="k">NOBODY WATCHING</b>In a once-in-a-lifetime deal, reputation is worth little. It also counts only if people hear of it: a student asking for an extension can promise that nobody else will know.'],
   ['Cut off, no news',['cut'],{bubble:['TALI CAN’T TELL','Did Arlo pay? Is there an emergency?','var(--h3)']},'<b class="k">CUT OFF AND IN THE DARK</b>In <i>Dr. Strangelove</i>, a general cuts off all contact so nobody can recall the bombers; but if you’re unreachable, you can’t check the other side complied. Wills need trustees for this reason.'],
   ['Burnt bridge, wrong road',['burn'],{wrong:true},'<b class="k">NO WAY BACK</b>Polaroid kept all its chips in instant photos and beat Kodak, but later felt trapped on a sinking island as video and digital photos arrived. A burnt bridge hurts when you were wrong.'],
   ['Doomsday',['luck'],{accident:true},'<b class="k">AN ACCIDENT</b>A machine that fires automatically is believed, but a small accident can set it off when nobody wants it. That’s why the book prefers a risk to a certainty, and a threat no bigger than needed.'],
   ['The last step',['step'],{laststep:true},'<b class="k">THE LAST STEP</b>Small steps can unravel from a clear end: if cheating pays on the last stage, it pays on the one before. Keep the end open.'],
   ['High stakes',null,null,'<b class="k">TOO MUCH TO LOSE</b>Brinkmanship can fail even with care. The book’s advice: practise it where a fall means a messy room or a tantrum, not a messy divorce. Never with something you can’t afford to lose.']];
  L.h(L.kick('ex','Edge cases and limits')+'<h1 class="q">Where does each device stop protecting you? Try each case.</h1><div id="esv"></div><div class="cr-say" id="esay" aria-live="polite">Pick a case.</div><div class="cr-ctl" id="ec"></div>');
  L.$('#esv').innerHTML=crRoad(crEval(CR_BASE,CR_DEV,new Set()),{aria:'The road with no device'});
  const seen=new Set();let fin=false;
  P.forEach((p,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=p[0];b.onclick=()=>{[...L.$('#ec').children].forEach((x,q)=>x.classList.toggle('sel',q===j));
    if(p[1]){const on=new Set(p[1]);let e=crEval(CR_BASE,CR_DEV,on);if(p[0]==='Doomsday')e=Object.assign({},e,{verdict:'chance'});L.$('#esv').innerHTML=crRoad(e,Object.assign({on,aria:p[0]},p[2]));}
    else L.$('#esv').innerHTML=crSlope({k:5,end:'fell',stakes:'high'},{aria:'The slope with a ravine: a fall is a disaster'});
    L.$('#esay').innerHTML=p[3];seen.add(j);
    if(!fin&&seen.size===P.length){fin=true;L.sheet('info','Every device has an edge','Contracts can be torn up, reputations need an audience and a future, cutting off leaves you blind, burnt bridges trap you, chance can misfire, small steps can unravel at the end, and brinkmanship can fall. Pick the device whose side effect you can live with.');L.done();}};L.$('#ec').appendChild(b);});}},

{part:3,src:'Course application · built on Chapter 7',pts:1,
 solve:async L=>{L.$('#ob').click();L.$$('#oc .opt')[1].click();L.$('#ob').click();},
 run(L){
  L.h(L.kick('pr','One-minute move · make it credible')+'<h1 class="q">Tali told Hedda’s builder: “Finish by 15 March, or I hold back the last £1,000.” Run the move.</h1>'+
   L.note('How this course applies the book: the one-minute move for “Make it credible”, built from chapter 7.','compass')+
   '<div class="cr-steps" id="osp"><span>1 · Would I follow through?</span><span>2 · Change the payoffs</span><span>3 · Limit my way out</span><span>4 · Small steps</span><span>5 · Use others</span><span>6 · Their move</span></div>'+
   '<div id="osv"></div><div class="cr-say" id="osay" aria-live="polite"></div><div id="oc"></div><div class="cr-ctl"><button class="btn pri" id="ob"></button></div>');
  const BI=[{k:'words',n:'Say it again, firmly'},{k:'step',n:'Pay per finished stage',c:3},{k:'cut',n:'Go silent until 15 March',kill:1,tag:'harm',why:'No news: Tali can’t hear about a late delivery or check the work.'},{k:'big',n:'Threaten to withhold everything and sue',c:-1,tag:'harm',why:'Too big to be believed, and too big to use.'}];
  const RO={who:'Tali',pred:'Builder',L:'HOLD BACK £1,000',R:'PAY IN FULL',Lw:'Hold back £1,000',Rw:'Pay in full anyway',months:false,carryTxt:' will hold back the money',slideTxt:' will pay in full anyway',nowWho:'The builder',carryNow:'finishes on time',slideNow:'lets the job drift',lab:{step:'paid per stage',cut:'silent'}};
  let s=0,first=true,fin=false;
  const show=(keys,cap)=>{const on=new Set(keys),e=crEval({c:2,s:4},BI,on);L.$('#osv').innerHTML=crRoad(e,Object.assign({on,aria:cap},RO))+'<p class="cr-ro">'+crReadout(e,RO)+'</p>';return e;};
  const say=(h,x)=>L.$('#osay').innerHTML='<b class="k">'+h+'</b>'+x;
  const mark=(done,cur)=>L.$$('#osp span').forEach((p,j)=>p.className=done.includes(j)?'dn':j===cur?'cur':'');
  function go(n){s=n;const b=L.$('#ob');
    if(n===0){mark([],0);show([],'The builder’s road');say('STEP 1','At the moment of truth, would Tali really hold back the money? Look at the piles first.');b.innerHTML=L.ic('eye')+'Show the moment of truth';}
    if(n===1){mark([0],-1);b.parentNode.hidden=true;show([],'Holding back costs Tali');say('NO, AND THE BUILDER KNOWS IT','Holding back risks the builder walking off and Hedda left without a bathroom: 2. Paying anyway: 4 (illustrative). Steps 2–5: pick the one device that fits best.');
      BI.forEach((d,j)=>{const x=document.createElement('button');x.className='opt';x.textContent=d.n;x.onclick=()=>{if(s!==1)return;const ok=j===1;if(first){L.award(ok);first=false;}
        const e=show([d.k],d.n);if(ok){x.classList.add('ok');L.$('#oc').innerHTML='';go(2);}
        else{x.classList.add('no');say('THAT FAILS',d.k==='words'?'Words don’t move the piles: the builder still bets Tali will pay in full.':d.k==='cut'?'It closes the pay-anyway road, but Tali can’t hear about a delayed delivery or check the work. A side effect too high here.':'Nobody believes Tali would sue over a few days. Keep the threat as small as works.');}};L.$('#oc').appendChild(x);});}
    if(n===2){mark([0,3],5);b.parentNode.hidden=false;say('STEPS 2–5 · STAGES FIT BEST','Each stage paid when done: holding back one stage is cheap for Tali, and the builder has the rest to lose. Step 6: the builder says, “I need half up front, it’s my policy.”');b.innerHTML=L.ic('chat')+'Offer stages, and leave a way to say yes';}
    if(n===3){b.parentNode.hidden=true;mark([0,1,2,3,4,5],-1);fin=true;say('STEP 6 · THEIR MOVE','“Your policy is fine with me: a first stage up front for materials, then each stage when it’s done.” A policy is an agent of sorts; meet it gently, and leave the builder a way to agree.');
      L.sheet('ok','About a minute','Would I follow through? No, so change something. One device chosen for its side effects (stages, the book’s own example), and their counter-move met with a face-saving offer.');L.done();}}
  L.$('#ob').onclick=()=>{if(s===0)go(1);else if(s===2)go(3);};go(0);}},

{part:3,src:'Chapter 7 · Undermining Your Opponent’s Credibility',
 solve:async L=>{L.$$('#wc .chip').forEach(b=>b.click());},
 run(L){
  L.h(L.kick('ex','Where cooperation wins')+'<h1 class="q">Credibility isn’t only a weapon. Look at three ways it helps both sides.</h1>'+
   '<svg class="cr-svg" id="csv" viewBox="0 0 330 186" role="img" aria-label="Pictures of credibility helping both sides"></svg><div class="cr-ctl" id="wc"></div><div class="cr-say" id="csay" aria-live="polite">Pick one.</div>');
  function draw(m){let s='<rect width="330" height="186" rx="14" fill="var(--soft)"/>';
    if(m===-1){/* default: all three scenes as small faint thumbnails, until the learner picks one */
      s+=crTx(57,24,'A WAY OUT',{c:'var(--h4)',s:11.5})+crTx(165,24,'THEIR PROMISE',{c:'var(--h2)',s:11.5})+crTx(273,24,'RENT IT',{c:'var(--ok)',s:11.5})+
        '<path d="M111 36V146M219 36V146" stroke="var(--line2)" stroke-width="1.5" stroke-dasharray="4 4"/><g opacity=".55">'+
        '<path d="M18 44H92V120H18Z" fill="none" stroke="var(--line2)" stroke-width="4"/><path d="M91 66V98" stroke="var(--soft)" stroke-width="6"/>'+crFig(50,62,'var(--h4)','')+'<path d="M64 82H100" stroke="var(--ok-strong)" stroke-width="2.5"/><path d="M106 82l-8-5v10z" fill="var(--ok-strong)"/>'+
        '<rect x="124" y="44" width="82" height="76" rx="8" fill="var(--card)" stroke="var(--line2)" stroke-width="1.5"/><rect x="124" y="44" width="82" height="16" rx="8" fill="var(--h2-bg)"/>'+
        [0,1,2].map(j=>'<rect x="'+(132+j*24)+'" y="70" width="18" height="18" rx="4" fill="var(--ok-bg)"/>'+crTx(141+j*24,84,'✓',{c:'var(--ok)',s:12})).join('')+'<path d="M134 102h62" stroke="var(--line2)" stroke-width="3" stroke-linecap="round"/>'+
        '<rect x="234" y="52" width="50" height="14" rx="3" fill="var(--h3)"/><rect x="234" y="76" width="80" height="14" rx="3" fill="var(--no-strong)"/><rect x="234" y="100" width="42" height="14" rx="3" fill="var(--ok-strong)"/></g>'+
        crTx(57,138,'they say yes',{c:'var(--muted)',w:600,s:12})+crTx(165,138,'you can rely on it',{c:'var(--muted)',w:600,s:12})+crTx(273,138,'both pay less',{c:'var(--muted)',w:600,s:12})+
        crTx(165,172,'tap a button to see each one',{c:'var(--muted)',w:600,s:12});}
    if(m===0){s+='<path d="M60 40H270V150H60Z" fill="none" stroke="var(--line2)" stroke-width="5"/><path d="M268 70V120" stroke="var(--soft)" stroke-width="8"/>'+crFig(165,72,'var(--h4)','Linus',132)+
      '<path d="M196 96H300" stroke="var(--ok-strong)" stroke-width="3"/><path d="M308 96l-10-6v12z" fill="var(--ok-strong)"/>'+crTx(250,88,'a way out',{c:'var(--ok)'})+crTx(165,172,'leave an outlet, and they stop digging in',{c:'var(--muted)',w:600,s:12});}
    if(m===1){s+='<rect x="40" y="30" width="250" height="112" rx="10" fill="var(--card)" stroke="var(--line2)" stroke-width="1.5"/><rect x="40" y="30" width="250" height="24" rx="10" fill="var(--h2-bg)"/>'+crTx(165,47,'TEAM CALENDAR',{c:'var(--h2)'})+
      ['Mon','Tue','Wed','Thu','Fri'].map((d,j)=>{const x=68+j*49;return crTx(x,74,d,{c:'var(--muted)'})+'<rect x="'+(x-16)+'" y="82" width="32" height="26" rx="6" fill="var(--ok-bg)"/>'+crTx(x,100,'✓',{s:14,c:'var(--ok)'});}).join('')+
      crTx(165,128,'Tali + Linus: out by 7',{c:'var(--ink)'})+crTx(165,170,'help their promise be seen and kept',{c:'var(--muted)',w:600,s:12});}
    if(m===2){const bar=(y,lab,v,c,t)=>crTx(20,y+12,lab,{a:'start',c:'var(--ink)',s:11.5})+'<rect x="130" y="'+y+'" width="'+(v*1.1).toFixed(0)+'" height="16" rx="4" fill="'+c+'"/>'+crTx(136+v*1.1,y+12,t,{a:'start',c:'var(--muted)'});
      s+=crTx(165,22,'WHAT A STUDENT PAYS FOR ONE TEXTBOOK',{c:'var(--muted)'})+bar(40,'Buy, resell',75,'var(--h3)','$75 net')+bar(70,'Buy, new edition',150,'var(--no-strong)','$150')+bar(100,'Rent or licence',60,'var(--ok-strong)','$60')+
        crTx(165,150,'the book’s case numbers',{c:'var(--muted)',w:600,s:12})+crTx(165,168,'renting ends the urge to rush new editions',{c:'var(--muted)',w:600,s:12});}
    L.$('#csv').innerHTML=s;}
  draw(-1);const M=[['Leave a way out','<b class="k">LEAVE AN OUTLET</b>Sun Tzu: when you surround an enemy, leave a way out, so they don’t fight with the courage of the desperate. With Linus, the landlord or a sibling, a face-saving road gets you a yes and keeps the relationship.'],
   ['Help their promise','<b class="k">HELP THEM BE BELIEVED</b>Not every game is win-lose. In a dilemma, if the other side can promise to return your cooperation, you want that promise to be credible. In this course’s example, when Linus offers “I’ll leave by 7 if you do”, put it somewhere both of you can see it.'],
   ['Rent, don’t sell','<b class="k">THE TEXTBOOK CASE</b>A $150 textbook resold to the store for $75 pushes publishers to rush new editions, and students in an edition’s last year pay full price. If publishers rented or licensed the book for about $60, students and publishers could both do better (bookstores would lose). Renting solves a promise nobody can otherwise make believable.']];
  const seen=new Set();let fin=false;
  M.forEach((m,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=m[0];b.onclick=()=>{[...L.$('#wc').children].forEach((x,q)=>x.classList.toggle('sel',q===j));draw(j);L.$('#csay').innerHTML=m[1];seen.add(j);
    if(!fin&&seen.size===3){fin=true;L.sheet('info','Believable promises build trust','The point of credibility is often to make cooperation possible: a promise the other side can rely on lets both of you move to the better outcome. Undermine someone’s move only when it hurts you, and even then, leave them a way out.');L.done();}};L.$('#wc').appendChild(b);});}},

{part:3,src:'Course application · built on Chapters 6 and 7',pts:6,run(L){
  L.h(L.kick('pr','Tali’s week')+'<h1 class="q">Which move fits each of Tali’s situations?</h1>');
  L.buckets(L.card,['Add a device','Undermine their move','Help them be believed','Don’t push: too risky'],[
   ['Arlo doesn’t believe Tali’s “no more money if you miss”.',0,'Change the moment of truth: stages plus a written plan, so saying no is cheap for Tali.'],
   ['The landlord says: “Head office sets the rises. I can’t change them.”',1,'A mandated agent: politely ask to speak to whoever sets the policy, and leave room to agree.'],
   ['Linus offers: “I’ll stop staying late if you do.”',2,'A promise that helps you both. Make it visible (the team calendar) so it can be relied on.'],
   ['Tali is tempted to tell Hedda: “Sell the flat this month, or I stop helping with the move.”',3,'Brinkmanship with family and a home at stake is all ravine, no puddle. Talk, don’t push.'],
   ['Greer says: “We never pay for courses, or everyone will ask.”',1,'The rule rests on reputation. Ask for a small slice (a half-day course) with a reason that isn’t a precedent.'],
   ['Tali’s own “three gym sessions a week” keeps slipping.',0,'A device for your own future self: the £50 pact with a teammate, held by the captain.']],
   'Fix your own moves with a device, undermine others’ rigid moves gently, help good promises be believed, and keep brinkmanship for small stakes.');}},

{part:3,src:'Course application · built on Chapter 7',
 solve:async L=>{L.$('#yc').children[1].click();L.$('#y1').value='I said I’d stop answering work messages after 8';L.$$('#yd .chip')[0].click();L.$('#y2').value='a real emergency might wait';
   ['#y1','#y2'].forEach(s=>L.$(s).dispatchEvent(new Event('input',{bubbles:true})));L.$('#yb').click();},
 run(L){
  L.h(L.kick('pr','Your turn · ungraded')+'<h1 class="q">Something you said you’d do that people don’t quite believe. Which one device will you add?</h1>'+
   L.note('How this course applies the book: the moment-of-truth check on your own week.','compass')+
   '<span class="cr-fl">WHO DOUBTS IT?</span><div class="cr-ctl" id="yc" style="justify-content:flex-start"></div>'+
   '<label class="cr-fl" for="y1">WHAT I SAID I’D DO (OR MY RULE)</label><input class="cr-in" id="y1" maxlength="70" placeholder="e.g. no lending until the last loan is repaid">'+
   '<span class="cr-fl">ONE DEVICE</span><div class="cr-ctl" id="yd" style="justify-content:flex-start"></div>'+
   '<label class="cr-fl" for="y2">THE SIDE EFFECT I’LL WATCH</label><input class="cr-in" id="y2" maxlength="70" placeholder="e.g. don’t let it turn into a row">'+
   '<div class="cr-ctl"><button class="btn pri" id="yb" disabled>'+L.ic('play')+'Put it on my road</button></div><div id="ysv"></div>');
  let who=null,dev=null;
  ['Family','A colleague or boss','A friend or flatmate','Myself'].forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=n;b.onclick=()=>{who=n;[...L.$('#yc').children].forEach((x,q)=>x.classList.toggle('sel',q===j));chk();};L.$('#yc').appendChild(b);});
  CR_DEV.forEach(d=>{const b=document.createElement('button');b.className='chip';b.textContent=d.n;b.onclick=()=>{dev=d;L.$$('#yd .chip').forEach(x=>x.classList.toggle('sel',x===b));chk();};L.$('#yd').appendChild(b);});
  const v=s=>L.$(s).value.trim();const chk=()=>{L.$('#yb').disabled=!(who&&dev&&v('#y1').length>1);};L.$('#y1').addEventListener('input',chk);
  L.$('#yb').onclick=()=>{const on=new Set([dev.k]),e=Object.assign(crEval(CR_BASE,CR_DEV,on),{verdict:'carry'});
    const ut=v('#y1'),u1=L.esc(ut.length>33?ut.slice(0,32)+'…':ut);
    L.$('#ysv').innerHTML=crRoad(e,{on,who:'You',pred:who==='Myself'?'Future you':'They',L:'FOLLOW THROUGH',R:'BACK DOWN',months:false,noPiles:true,lab:{rep:'people watching',step:'small steps',con:'in writing',team:'a partner',agent:'an agent',cut:'no talks',burn:'no way back'},
      bubble:[(who==='Myself'?'FUTURE YOU':'THEY')+' SHOULD NOW EXPECT YOU TO KEEP','“'+u1+'”','var(--ok-strong)'],aria:'Your road with your device: '+dev.n});
    L.sheet('info','At the moment of truth, the easy road is harder','“'+L.esc(v('#y1'))+'”, now backed by <b>'+dev.n.toLowerCase()+'</b>. Watch for: '+(v('#y2')?L.esc(v('#y2')):dev.why.toLowerCase())+'. If it still isn’t believed, add a second device, or shrink the promise to one you’d really keep.');L.done();};}},

  const row=r=>'<div class="cr-map'+(r[1].includes('cred')?' hot':'')+'"><b>'+r[0]+'</b><div class="r">'+
    r[1].map((k,j)=>(j?'<span class="ar">→</span>':'')+'<span class="m'+(k==='cred'?' cur':CR_TL[k][1]>8?' tbd':'')+'">'+(CR_TL[k][1]>8?'?':CR_TL[k][0])+'</span>').join('')+'</div></div>';
  const hot=CR_ROWS.filter(r=>r[1].includes('cred')),rest=CR_ROWS.filter(r=>!r[1].includes('cred'));
  L.$('#sm').innerHTML=hot.map(row).join('')+'<details class="cr-more"><summary>The other '+rest.length+' rows of the map</summary>'+rest.map(row).join('')+'</details>';
  L.done();}}
  ]
});
