/* ===== This lesson’s own visuals: the game-board map (a Start square asking “will they react?”,
   eleven squares round the edge, one per row of the strategy map, each with its tool badges in
   order; a “just decide” side square and two extra squares for big situations in the middle; a
   ring round the board for the larger game), draggable situation tokens that hop square by square,
   and the four-box check card that stamps each box. Plus small one-off pictures: turns vs at the
   same time, the chess look-ahead bars and the renewal-inside-the-ring picture.
   The board, the check card and the small/big rule are this course’s application of the book.
   Everything lives in this file. ===== */
(function(){const st=document.createElement('style');st.textContent=`

/* ---------- small helpers ---------- */
const GB_AP=()=>'<span class="gb-ap">'+Course.icon('compass')+'How this course applies the book</span>';

/* ---------- the twelve tools (CANON “Tool names and one-minute moves”; same text as map.html) ---------- */
const GB_T={
 ahead:{n:'Look ahead and reason back',ic:'tree',les:'2',alt:'A game tree: the last branches are crossed out first, and an arrow runs back to the first fork.',
  move:['Draw the turns: who moves, in what order.','Jump to the last move: what will that person really do, given <i>their</i> aims?','Cross out the branches they won’t take; step back one move and repeat.','Pick your first move from what’s left.'],
  lim:['Works fully only with no chance, known aims and moves you can see.','People care about fairness and pride: a “rational” lowball can be rejected.','Long games can’t be drawn in full: look a few moves ahead, then judge.']},
 dilemma:{n:'Spot and escape a prisoners’ dilemma',ic:'lock',les:'3–4',alt:'Two people and four boxes: both arrows slide to the corner where both lose.',
  move:['Spot it: is grabbing better for each of you whatever the other does, yet both grabbing worse for both?','Make it repeated and visible, so cheating gets noticed.','Agree one clear rule and a fitting, certain response.','Start nice, respond to defection, forgive quickly. Or change the payoffs.'],
  lim:['One mistake makes tit for tat echo: build in forgiveness.','Cooperation tends to break down near a known last round.','Not every dilemma should be escaped: firms “cooperating” on prices hurt customers, and it’s illegal.']},
 shoes:{n:'Put yourself in their shoes',ic:'eye',les:'5',alt:'Two thought bubbles feed into a table, and one box lights up because both arrows point to it.',
  move:['List your options and theirs.','One choice best whatever they do? Use it. Cross out what no one would sensibly pick.','Mark each side’s best reply; a box marked for both is an equilibrium.','Several? Go for the focal point you both expect the other to see.'],
  lim:['Most people reason only two or three steps deep.','A game can have several equilibria; theory alone won’t pick one.','An equilibrium can be bad for both (a dilemma).']},
 mix:{n:'Mix your moves',ic:'target',les:'6',alt:'A goal split left and right, with a spinner set to the right proportions.',
  move:['Would it hurt if they knew your choice in advance? If not, don’t mix.','Pick proportions that leave them no better option.','Let an outside device decide (a coin, a watch’s second hand); never just alternate.','Checking others: a big enough penalty plus occasional random checks.'],
  lim:['Only for pure conflict or checking: in coordination games, mixing causes mismatches.','In a one-off situation there’s no pattern to hide.','A bad result can follow the best mix: judge the policy.']},
 moves:{n:'Commit, threaten or promise',ic:'arrow',les:'7',alt:'A path that forks with one branch cut away, and an “if, then” signpost.',
  move:['What will they do if I change nothing?','Choose: commit (fix my own action), threaten (punish the wrong move) or promise (reward the right one).','Stopping something? Deter. Getting it done? Compel, with a deadline.','Check it’s not just a warning; make it clear, certain and the smallest size that works.'],
  lim:['Worthless unless believed.','Risky: you may have to carry it out.','Threats too large to use aren’t believed.']},
 credible:{n:'Make it credible',ic:'shield',les:'8',alt:'At the fork where you must follow through, the back-down road has a bridge you can burn.',
  move:['Would I really follow through? Why would they believe it?','Change your payoffs: a written agreement, or your reputation on the line.','Or limit your way out: small steps, a burnt bridge, a partner who holds you to it.','Against their move: renegotiate, take small steps, leave them a face-saving way out.'],
  lim:['Contracts can be renegotiated when both sides prefer it.','Reputation only matters if the game continues.','Brinkmanship risks a real fall: only where stakes are low.']},
 signals:{n:'Read and send signals',ic:'info',les:'9',alt:'One person wears a costly badge the other type couldn’t afford; two doors sort people by what they pick.',
  move:['What do they know that I don’t, and what do they gain from what they tell me?','Watch actions, not words: only actions too costly for the wrong type count.','To find out: offer a test or a menu that makes types choose differently.','To show: pick a signal cheap for you, costly for others.'],
  lim:['When everyone does it (cleans the car), it tells you nothing.','The strong may countersignal by not signalling.','Screens have a cost too.']},
 group:{n:'Coordinate the group',ic:'people',les:'10',alt:'A crowd split between two roads, beside a tipping curve where the group slides to one side.',
  move:['Does each person’s choice affect the others, with no one paying for it?','A race for position, or several stable outcomes with a tipping point?','Name a focal point, get a few to move first, or ask an outsider to set the rule.','Voting in small steps? Agree the end point first.'],
  lim:['One person usually can’t change a convention alone.','History and luck can lock in a worse standard.','A group can slide step by step to what it would reject as a whole.']},
 bid:{n:'Bid smart',ic:'pointer',les:'11',alt:'Bidders under a rising price; each one sits down at their own walkaway line.',
  move:['Decide whether to enter at all; set your walkaway value before you start.','Rising auction or proxy bid: go up to your value, then stop.','Sealed bid you pay: bid below your value, as if you’ve already won.','A war of attrition: look for a deal instead of bleeding.'],
  lim:['Rules change and bidders adapt.','When the value is common, winning is bad news unless you adjust.','Escalating games are best not started.']},
 batna:{n:'Bargain from your BATNA',ic:'scale',les:'12',alt:'A pie: each side’s BATNA slice is set aside first, and only the middle, the real pie, is split.',
  move:['Work out your BATNA (your best option with no deal), and estimate theirs.','Measure the real pie: the deal’s value minus both BATNAs.','Who loses more from waiting? Improve your BATNA before you show it.','Trade across issues; start from an even split of the real pie.'],
  lim:['Pride and fairness matter: lowball offers get rejected.','Walkouts hurt both sides and bystanders.','Brinkmanship in bargaining risks a real breakdown.']},
 vote:{n:'Vote and set the agenda',ic:'list',les:'13',alt:'Three options with arrows going round in a circle: each beats one and loses to another.',
  move:['Two options: vote your true preference.','Three or more: ask for rankings; look for one that beats every other head to head.','Watch the order: whoever sets the agenda can set the result.','On a single scale, take the median choice.'],
  lim:['Majorities can go round in a circle.','Every system can invite strategic voting.','The median trick only works on a single line.']},
 incent:{n:'Design incentives',ic:'star',les:'14',alt:'A pay line, a base plus a bonus that rises with the result, beside a frosted window that hides the effort.',
  move:['Name what you can see: results, not effort.','Pay enough that they take the job; tie part of it to results; avoid all-or-nothing targets.','Several tasks? Don’t pay only for the easy-to-measure one.','Where people already care, money can crowd out goodwill.'],
  lim:['Results are a noisy sign of effort: luck shifts them.','Quotas backfire when hopeless or already met.','A small payment can be worse than none.']}
};

{part:0,src:'Warm-up',pts:1,run(L){

   'The tyre and the paint don’t answer back. The landlord will read Tali’s reply and respond. Spotting that difference is the first question on today’s board.',

{part:0,src:'Introduction',
 solve:async L=>{const t=L.$$('#s2t .gb-t');t[0].click();await L.sleep(60);gbAns(L,'no');await L.sleep(520);t[1].click();await L.sleep(60);gbAns(L,'yes');await L.sleep(420);},
 run(L){
  L.h(L.kick('learn','Row zero')+'<h1 class="q">Does it fight back? Drag each of Tali’s jobs onto <b>Start</b> (or tap it) and answer the Start question.</h1>'+
   '<div class="gb-tray" id="s2t"></div><div id="s2b"></div><div id="s2q"></div><p class="gb-ro" id="s2r" aria-live="polite">Notice which token leaves the board.</p>');
  const bd=gbBoard(L,L.$('#s2b'));bd.set({only:[0]});
  const T=[['Patch the bike puncture','Bike puncture'],['Reply to the landlord’s rent rise','Landlord’s rent rise']];const did=new Set();let busy=false,fin=false;
  T.forEach((t,j)=>{const b=gbTok(t[0]);L.$('#s2t').appendChild(b);gbDrag(b,bd.svg,k=>{if(busy||did.has(j)||k===null)return;go(j,b,k);});});
  function go(j,b,k){busy=true;b.classList.add('on');bd.set({side:false,cap:T[j][1],lit:null});bd.place(0);gbShow(L.$('#s2b'));
    L.$('#s2r').innerHTML=k!=='tap'&&k!==0?'Every token starts on Start: first ask whether it’s a game at all.':'On Start. Answer the question below.';
    gbAsk(L,L.$('#s2q'),{only1:true},r=>{did.add(j);b.classList.remove('on');b.classList.add('used');
      if(r===-1)bd.hop(-1,()=>{busy=false;L.$('#s2r').innerHTML='<b>Off the board:</b> the tyre won’t react, so just decide. No strategy needed.';check();});
      else{bd.set({lit:0});busy=false;L.$('#s2r').innerHTML='<b>It stays on the board:</b> the landlord will answer. It’s a game, so it needs a square.';check();}});}
  function check(){if(did.size<2||fin)return;fin=true;
    L.sheet('info','The lumberjack and the general','The book’s picture: a lumberjack’s wood doesn’t fight back, but a general’s enemy does. Rivals, partners, even children are '+L.g('strategic-game','strategic')+': their aims can clash with yours or match them. Only those situations go round the board.');L.done();}}},

   '<svg class="gb-svg" id="s4v" viewBox="0 0 320 164" role="img" aria-label="Left: a game tree for taking turns, a chain of moves. Right: a two by two table for choosing at the same time, with arrows going round in a circle."></svg>'+
   '<div class="gb-pick"><button class="chip" id="s4a">Tali hints at Kittiwake, then Greer names a pay figure</button><button class="chip" id="s4b">Plover and Kittiwake each set next month’s day rates</button></div>'+

{part:1,src:'Course application · built on Chapters 2 and 4',

  for(const [j,an] of runs){t[j].click();for(const v of an){await L.sleep(40);gbAns(L,v);await L.sleep(230);}await L.sleep(1200);}},
 run(L){
  const landed=new Set();let busy=false,fin=false;
  L.h(L.kick('learn','Explore the board')+GB_AP()+'<h1 class="q">Drop any token on Start and answer. Watch it hop to its square. Land three on different squares.</h1>'+
   '<div class="gb-tray" id="s6t"></div><div id="s6b"></div><div id="s6q"></div><div id="s6p"></div><p class="gb-ro" id="s6r" aria-live="polite">Notice: two questions do most of the work; then one sign picks the square.</p>');
  const bd=gbBoard(L,L.$('#s6b'));
  const T=['Paint colour','Arlo’s £3,000 loan','Landlord’s 10% rise','Dishes tonight','Used car, no warranty','Team offsite vote'];
  T.forEach((t,j)=>{const b=gbTok(t);L.$('#s6t').appendChild(b);gbDrag(b,bd.svg,k=>{if(busy||k===null)return;start(j,b,k);});});
  function start(j,b,k){busy=true;L.$$('#s6t .gb-t').forEach(x=>x.classList.toggle('on',x===b));L.$('#s6p').innerHTML='';
    bd.set({lit:null,side:false,size:null,cap:T[j]});bd.place(0);gbShow(L.$('#s6b'));
    L.$('#s6r').innerHTML=k!=='tap'&&k!==0?'Every token starts on Start, whatever square you aim for.':'On Start. Answer below.';

      L.$('#s6r').innerHTML=r===-1?'Off to the side: not a game.':'Landed on <b>square '+r+'</b>. Its first tool is the one to reach for.';
      if(landed.size>=3&&!fin){fin=true;L.sheet('info','Questions first, then the square','Will anyone react? Turns or at once? Which sign fits? Three taps, and the token lands where its tools are waiting. If you answered differently from how you’d really read the situation, drop it again: the board only knows what you tell it.');L.done();}});});}}},

    b.onclick=()=>{if(a)return;a=true;const ok=j===1;L.award(ok);b.classList.add(ok?'ok':'no');if(!ok)L.$$('#s7o .opt')[1].classList.add('ok');

{part:2,src:'Course application · built on Chapter 2 · Very Complex Trees',
 solve:async L=>{const z=L.$$('#s10z button');L.$('#s10a').click();await L.sleep(30);z[0].click();z[1].click();L.$('#s10b').click();await L.sleep(30);z[1].click();},
 run(L){
  const seen=new Set();let fin=false,cur=null;
  L.h(L.kick('learn','Small or big?')+GB_AP()+'<h1 class="q">Same board, different effort. Pick a token, then switch between small and big. Watch what lights up.</h1>'+
   '<div class="gb-pick"><button class="chip" id="s10a">Who washes up tonight</button><button class="chip" id="s10b">Tali’s March pay talk</button></div>'+
   '<div class="gb-ctl"><div class="gb-size" id="s10z"><button type="button" data-z="small">Small</button><button type="button" data-z="big">Big</button></div></div>'+
   '<div id="s10bd"></div><p class="gb-ro" id="s10r" aria-live="polite">Pick a token first.</p><div id="s10p"></div>');
  const bd=gbBoard(L,L.$('#s10bd'));
  const V={dishes:{k:3,c:'Dishes tonight',small:'<b>Right size.</b> About a minute: is it a little dilemma? A clear rule (alternate nights), then wash up.',big:'<b>Too big.</b> An evening of tables over one sink of plates: the thinking costs more than the dishes.'},
   pay:{k:8,c:'The March pay talk',small:'<b>Too small.</b> One minute on your BATNA, then walk in? Pay is hard to undo for a year.',big:'<b>Right size.</b> Walk the row: your BATNA, then is your walk-away credible, then signals. Sketch the real pie. Check the larger game: Tali sees Greer every day.'}};
  function show(z){const v=V[cur];bd.set({lit:v.k,size:z||null,cap:v.c});bd.place(v.k);gbPanel(L,L.$('#s10p'),v.k,{size:z||null});
    L.$$('#s10z button').forEach(b=>b.classList.toggle('sel',b.dataset.z===z));
    L.$('#s10r').innerHTML=z?v[z]:'Now switch between <b>Small</b> and <b>Big</b>.';}
  function pick(id,key){cur=key;['s10a','s10b'].forEach(q=>L.$('#'+q).classList.toggle('sel',q===id));show(null);}
  L.$('#s10a').onclick=()=>pick('s10a','dishes');L.$('#s10b').onclick=()=>pick('s10b','pay');
  L.$$('#s10z button').forEach(b=>b.onclick=()=>{if(!cur){L.$('#s10r').innerHTML='Pick a token first.';return;}const z=b.dataset.z;show(z);seen.add(cur);seen.add(z);
    if(seen.size>=4&&!fin){fin=true;
      L.sheet('info','Match the effort to the stakes','Small, low-stakes or easy to undo: run only the first tool, for about a minute, then act. Big or hard to undo: walk the whole row, sketch the tree or table, and check the larger game. Book basis: with practice, many everyday situations need only '+L.g('tree-logic','tree logic')+' in your head; big ones deserve more.');L.done();}});}},

{part:2,src:'Chapter 2 · Very Complex Trees',
 solve:async L=>{const i=L.$('#s11s');for(const v of [4,6,8]){gbSet(i,v);await L.sleep(15);}},
 run(L){
  let fin=false;
  L.h(L.kick('ex','The book’s chess lesson')+'<h1 class="q">Even a big situation can’t be drawn to the end. Slide how far ahead you look, and watch the paths pile up.</h1>'+
   '<svg class="gb-svg" id="s11v" viewBox="0 0 320 206" role="img" aria-label="Bars for moves looked ahead, one to eight. Each bar shows how many paths you would have to check; they grow twenty times per move. A shaded zone beyond your look-ahead says judge from experience."></svg>'+
   '<label class="gb-sl"><span class="h"><span>Look ahead</span><b id="s11n"></b></span><input type="range" id="s11s" min="1" max="8" step="1" value="2"></label>'+
   '<p class="gb-ro" id="s11r" aria-live="polite"></p><p class="gb-ill">Here one move is one player’s turn. The book’s example: 20 first moves in chess, 20 replies to each, so 400 paths at 2 moves (one each); later moves often have more. Experts look about five pairs ahead: 10 moves, past the end of this chart. The one-a-second times are illustrative.</p>');
  const i=L.$('#s11s');
  function draw(){const n=+i.value;L.$('#s11v').innerHTML=gbChess(n);L.$('#s11n').textContent=n+(n===1?' move':' moves')+(n%2?'':' ('+n/2+' each)');
    L.$('#s11r').innerHTML='Looking <b>'+n+'</b> '+(n===1?'move':'moves')+' ahead: about <b>'+GB_PATHS[n-1]+'</b> paths, even if every move had only 20 options. Checking one a second: <b>'+GB_TIME[n-1]+'</b>.';
    if(n>=7&&!fin){fin=true;L.sheet('info','Look a few moves ahead, then judge','The book estimates chess’s full tree at about 10<sup>120</sup> branch points: no one can draw it. Experts look ahead about five pairs of moves (10 on this chart’s count, past its end), then judge the position from experience. For your big situations: sketch a few moves of the tree or table, then use judgment. Science plus art, not either alone.');L.done();}}
  i.addEventListener('input',draw);draw();}},

{part:2,src:'Course application · built on Chapters 1, 2 and 4',

{part:2,src:'Course application · built on Chapters 1, 2, 3, 11 and 14',
 solve:async L=>{const b=L.$$('#s14k .chip');for(const j of [0,2,3,4]){b[j].click();await L.sleep(1500);}},
 run(L){
  const seen=new Set();let fin=false,busy=false;
  L.h(L.kick('learn','Edge cases and limits')+GB_AP()+'<h1 class="q">Where does the board stop helping? Try at least four of these.</h1>'+
   '<div id="s14b"></div><div class="gb-pick" id="s14k"></div><p class="gb-cap" id="s14t" aria-live="polite">Each button drops one of Tali’s situations on the board.</p>');
  const bd=gbBoard(L,L.$('#s14b'));
  const P=[['Not a game','Patch the puncture',{to:-1},'No one reacts, so it’s the lumberjack’s kind of decision: just decide. Don’t turn a puncture into a strategy session.'],
   ['Fits two squares','Arlo’s coffee-cart plan',{to:7,via:1},'Turns <i>and</i> hidden information. It pauses on square 1, then settles on 7, because what Tali is deciding now is whether the plan is any good.'],
   ['Too small to bother','Who washes up tonight',{to:3,size:'small'},'First tool only, about a minute: alternate nights, then wash up. More than that costs more than the plates.'],
   ['Big and hard to undo','Tali’s March pay talk',{to:8,size:'big'},'The whole row lights, plus the two extra squares: sketch the real pie, then check the larger game. Pay sticks for a year.'],
   ['First tool hits its limit','Linus breaks the late-night truce, again',{to:3,bounce:true,cap:'Linus breaks the truce'},'Tit for tat has started to echo: each slip answered by a slip. Running the same tool harder won’t help. That’s being stuck: Lesson 16, “When the game goes wrong”.'],
   ['The larger game overrides','Haggling the rent to the last pound',{to:8,ring:true,cap:'Rent haggled to the pound'},'Tali could win this square and lose the landlord’s goodwill for years. The ring lights up: the larger game outranks the square.']];
  P.forEach((p,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=p[0];b.onclick=()=>{if(busy)return;busy=true;
      L.$$('#s14k .chip').forEach((x,q)=>x.classList.toggle('sel',q===j));const o=p[2];
      bd.set({cap:o.cap||p[1],ring:false,size:null,bounce:false,side:false,lit:null});L.$('#s14t').innerHTML='…';gbShow(L.$('#s14b'));
      const land=()=>{busy=false;if(o.size)bd.set({size:o.size});if(o.ring)bd.set({ring:true});
        if(o.bounce){setTimeout(()=>{if(!bd.svg.isConnected)return;bd.place('mid');bd.set({lit:3,bounce:true,cap:''});},250);}
        L.$('#s14t').innerHTML='<b>'+p[1]+':</b> '+p[3];seen.add(j);
        if(seen.size>=4&&!fin){fin=true;L.sheet('info','The board’s limits','It can’t tell you what you haven’t noticed: if no one will react, step off it. It needs you to pick the decision at hand. It doesn’t replace judgment on big, messy games. And when the first tool keeps bouncing, you’re stuck, not unlucky: that’s Lesson 16.');L.done();}};
      if(o.via){bd.hop(o.via,()=>{setTimeout(()=>{if(!bd.svg.isConnected)return;bd.set({only:null,lit:null});bd.place(o.to);setTimeout(()=>{if(bd.svg.isConnected){bd.set({lit:o.to});land();}},380);},350);},70);}
      else bd.hop(o.to,land,70);};
    L.$('#s14k').appendChild(b);});}},

{part:3,src:'Chapter 1 · #10 Game Theory Can Be Dangerous to Your Health',
 solve:async L=>{L.$('#s17a').click();L.$('#s17b').click();},
 run(L){
  const seen=new Set();let fin=false;
  L.h(L.kick('ex','Where fairness wins')+GB_AP()+'<h1 class="q">Every square sits inside a ring. Try both ways of playing the rent renewal and watch the ring.</h1>'+
   '<svg class="gb-svg" id="s17v" viewBox="0 0 320 190" role="img" aria-label="Square 8, this renewal, sits inside a big ring, the larger game over the next two years. Each has a bar for how well Tali does."></svg>'+
   '<p class="gb-ill">Illustrative numbers. The rent story and the advice are this course’s; the taxi ride and the larger game are the book’s.</p>'+
   '<div class="gb-pick"><button class="chip" id="s17a">Squeeze: bluff about a cheaper flat</button><button class="chip" id="s17b">Fair and firm: real costs, a longer tenancy</button></div>'+
   '<p class="gb-cap" id="s17t">Tali has no cheaper flat lined up. What happens beyond this renewal?</p>');
  const T={s17a:[0,'<b>Squeeze:</b> the bluff might shave the rise. But if it’s called, every later request is harder, and repairs get slow. Won the square, lost the ring.'],
   s17b:[1,'<b>Fair and firm:</b> Tali shows what moving would really cost both sides and offers a two-year tenancy for a smaller rise. A bit less now, a lot more later.']};
  L.$('#s17v').innerHTML=gbRing(null);
  ['s17a','s17b'].forEach(id=>L.$('#'+id).onclick=()=>{['s17a','s17b'].forEach(q=>L.$('#'+q).classList.toggle('sel',q===id));L.$('#s17v').innerHTML=gbRing(T[id][0]);L.$('#s17t').innerHTML=T[id][1];seen.add(id);
    if(seen.size===2&&!fin){fin=true;L.$('#s17t').insertAdjacentHTML('afterend',L.quote('There is always a larger game.','Dixit and Nalebuff, chapter 1'));
      L.sheet('info','The book’s taxi ride','Two economists tried to haggle a Jerusalem taxi fare down at the end of the ride. The proud driver drove them straight back where they’d started. In the book’s imagined follow-up letter, the driver’s silent wife had been in the front seat all along. The lessons: pride and fairness are part of the payoffs, and you may be playing only part of a '+L.g('larger-game','larger game')+'. Fair moves are often the strategic ones.');L.done();}});}},

{part:3,src:'Course application · built on every chapter',pts:7,
 solve:async L=>{for(const d of S15){await L.sleep(30);gbTap(gbCellEl(L,d[2]));L.$$('#s15z button')[d[3]==='big'?1:0].click();L.$('#s15g').click();await L.sleep(30);}},
 run(L){
  let n=0,sel=null,size=null,score=0;
  L.h(L.kick('pr','Challenge · Tali’s week')+GB_AP()+'<h1 class="q">Seven days, seven games. For each, tap its square (or drag the token there), choose small or big, then place it.</h1>'+
   '<div class="gb-hand" id="s15h"></div><div id="s15b"></div>'+
   '<div class="gb-ctl"><div class="gb-size" id="s15z"><button type="button" data-z="small">Small</button><button type="button" data-z="big">Big</button></div><button class="btn pri" id="s15g" disabled>'+L.ic('check')+'Place it</button></div>'+
   '<p class="gb-ro" id="s15r" aria-live="polite">First attempt counts. Square and size both need to be right.</p>');
  const bd=gbBoard(L,L.$('#s15b'),{onCell:k=>{if(n>=S15.length||k===0)return;sel=k;bd.set({sel:k});upd();}});
  bd.set({noDim:true});
  function hand(){const d=S15[n];L.$('#s15h').innerHTML='<span class="gb-day">'+d[0].toUpperCase()+'</span>';const t=gbTok(d[1]);L.$('#s15h').appendChild(t);
    gbDrag(t,bd.svg,k=>{if(typeof k==='number'&&k>0){sel=k;bd.set({sel:k});upd();}});}
  function upd(){L.$('#s15g').disabled=!(sel&&size);L.$$('#s15z button').forEach(b=>b.classList.toggle('sel',b.dataset.z===size));}
  L.$$('#s15z button').forEach(b=>b.onclick=()=>{if(n>=S15.length)return;size=b.dataset.z;upd();});
  L.$('#s15g').onclick=()=>{if(!(sel&&size)||n>=S15.length)return;const d=S15[n],okK=sel===d[2],okZ=size===d[3],ok=okK&&okZ;L.award(ok);if(ok)score++;
    const m=bd.st.marks.slice();m.push({k:d[2],t:d[0],c:ok?'ok':'no'});bd.set({marks:m,sel:null});
    L.$('#s15r').innerHTML=(ok?'<b>✓ '+d[0]+':</b> ':'<b>✗ '+d[0]+':</b> square '+d[2]+', '+d[3]+'. ')+d[4];
    n++;sel=null;size=null;upd();
    if(n<S15.length)hand();else{L.$('#s15h').innerHTML='<span class="gb-day">WEEK DONE</span>';L.$('#s15g').disabled=true;
      L.sheet(score===7?'ok':'info',score+' of 7 placed right','Seven different squares in one ordinary week, and only three were big: the pay talk, the second stage of Arlo’s loan and the car auction. That’s the pattern most weeks follow: a few big games that deserve a sketch, many small ones that need just a minute.');L.done();}};
  hand();upd();}},

{part:3,src:'Course application · built on every chapter',
 solve:async L=>{const v=[['Asking my manager for Friday off','1','small'],['Splitting a group gift with friends','8','small'],['Choosing a nursery with my partner','4','big']];
  for(let j=0;j<3;j++){gbSet(L.$('#y'+j+'t'),v[j][0]);gbSet(L.$('#y'+j+'s'),v[j][1]);L.$$('#y'+j+'z button')[v[j][2]==='big'?1:0].click();}L.$('#ygo').click();},
 run(L){
  L.h(L.kick('pr','Your turn · ungraded')+'<h1 class="q">Map your coming week: three situations, three squares</h1>'+
   L.note('How this course applies the book: the board on your own life. Nothing here is graded or saved.','compass')+
   '<div id="ywr"></div><div id="ywb"></div><div class="gb-ctl"><button class="btn pri" id="ygo" disabled>'+L.ic('map')+'Put my week on the board</button></div><div id="ywo"></div>');
  const bd=gbBoard(L,L.$('#ywb'));bd.set({noDim:true});
  const ph=['e.g. asking for a day off','e.g. sharing a bill or a cost','e.g. a family or team decision'];
  const opts='<option value="">Which square?</option><option value="0">0 · Not a game: just decide</option>'+GB_ROWS.slice(1).map((r,k)=>'<option value="'+(k+1)+'">'+(k+1)+' · '+r.l.join(' ')+'</option>').join('');
  const S=[{},{},{}];
  for(let j=0;j<3;j++){L.$('#ywr').insertAdjacentHTML('beforeend','<div class="gb-yt"><div class="hd"><span class="n">'+(j+1)+'</span>SITUATION '+(j+1)+'</div>'+
    '<input class="gb-in" id="y'+j+'t" maxlength="70" placeholder="'+ph[j]+'" aria-label="Situation '+(j+1)+'">'+
    '<select class="gb-sel" id="y'+j+'s" aria-label="Square for situation '+(j+1)+'">'+opts+'</select>'+
    '<div class="gb-zr"><span>Size</span><div class="gb-size" id="y'+j+'z"><button type="button" data-z="small">Small</button><button type="button" data-z="big">Big</button></div></div></div>');
    L.$('#y'+j+'t').addEventListener('input',()=>{S[j].t=L.$('#y'+j+'t').value.trim();chk();});
    L.$('#y'+j+'s').addEventListener('change',()=>{S[j].k=L.$('#y'+j+'s').value;chk();});
    L.$$('#y'+j+'z button').forEach(b=>b.onclick=()=>{S[j].z=b.dataset.z;L.$$('#y'+j+'z button').forEach(x=>x.classList.toggle('sel',x===b));chk();});}
  function chk(){bd.set({marks:S.map((s,j)=>s.k&&s.k!=='0'?{k:+s.k,t:String(j+1),c:'pri'}:null).filter(Boolean),side:S.some(s=>s.k==='0')});
    L.$('#ygo').disabled=!S.every(s=>s.t&&s.t.length>1&&s.k!==undefined&&s.k!==''&&s.z);}
  L.$('#ygo').onclick=()=>{L.$('#ywo').innerHTML='<div class="gb-out"><div class="k">MY WEEK ON THE BOARD</div>'+S.map((s,j)=>{const k=+s.k;
      if(k===0)return '<p><b>'+(j+1)+'. '+L.esc(s.t)+'</b><br>Not a game: just decide, and save your strategy for the rest.</p>';
      const R=GB_ROWS[k],first=GB_T[R.p[0][0]].n;
      return '<p><b>'+(j+1)+'. '+L.esc(s.t)+'</b><br>Square '+k+' · first tool: <b>'+first+'</b><br>'+(s.z==='big'?'Big: walk the row ('+R.p.map(p=>GB_T[p[0]].n).join(' → ')+'), sketch it, check the larger game.':'Small: one minute on '+first+', then act.')+'</p>';}).join('')+
      '<p><b>Before each:</b> the four boxes. Who’s in? Which game? Run the tool. Larger game?</p></div>';
    L.sheet('info','Your week is mapped','Run the one-minute check just before each of these moments, not now. Afterwards, note what happened: the book’s point is that the art of strategy improves only with examples and practice, and your own week is the best source of both.');L.done();};}},
