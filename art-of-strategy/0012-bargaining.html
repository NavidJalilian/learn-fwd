<body>

<script>
/* ===== This lesson’s own visuals: the BATNA pie with side plates (each side’s fallback slice is set
   aside first, only the real pie in the middle is split; a day strip shrinks it as the season passes),
   the fare bars (what each side pays against going alone) and the issue trade cards (items each side
   values differently, with a live tally of who gains). Everything lives in this file. ===== */
(function(){const st=document.createElement('style');st.textContent=`
.card [hidden]{display:none!important}
.bg-svg{display:block;width:100%;max-width:330px;margin:4px auto}
.bg-ro{font-size:14px;text-align:center;color:var(--muted);margin:4px 0 6px;min-height:20px;line-height:1.45}
.bg-ro b{color:var(--ink)}
.bg-ctl{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;margin:6px 0}
.bg-ctl .chip,.bg-ctl .btn{margin:0}
.bg-lab{font-size:11.5px;font-weight:700;letter-spacing:.4px;color:var(--muted);text-transform:uppercase;width:100%;text-align:center;margin:6px 0 2px}
.bg-cap{font-size:15px;line-height:1.5;margin:8px 0;color:var(--ink);min-height:44px}
.bg-ill{font-size:12.5px;color:var(--muted);text-align:center;margin:2px 0 4px;font-style:italic;line-height:1.4}
.bg-sl{display:block;margin:6px auto 0;max-width:330px}
.bg-sl .h{display:flex;justify-content:space-between;font-size:14px;gap:8px}
.bg-sl input{width:100%;height:34px;margin:0;accent-color:var(--pri)}
.bg-say{background:var(--soft);border-radius:14px;padding:10px 13px;font-size:15px;line-height:1.5;margin:8px 0;min-height:64px}
.bg-say b{display:block;font-size:11.5px;letter-spacing:.4px;color:var(--muted);margin-bottom:2px}
.bg-steps{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin:4px 0 6px}
.bg-steps span{font-size:11px;line-height:1.25;font-weight:600;text-align:center;border-radius:9px;padding:5px 1px;background:var(--soft);color:var(--muted);border:1.5px solid transparent}
.bg-steps span.cur{background:var(--pri-bg);color:var(--pri-deep);border-color:var(--pri)}
.bg-steps span.dn{background:var(--ok-bg);color:var(--ok)}
.bg-chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0;justify-content:center}
.bg-chips .chip{margin:0}
.bg-in{display:block;width:100%;box-sizing:border-box;border:2px solid var(--line);border-radius:12px;padding:9px 11px;font:inherit;font-size:15px;background:var(--card);color:var(--ink);margin:4px 0 8px}
.bg-in:focus{outline:none;border-color:var(--pri)}
.bg-fl{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.2px;display:block;margin-top:6px}
.bg-cards{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0}
.bg-cd{display:block;width:100%;box-sizing:border-box;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:7px 8px 6px;text-align:left;font:inherit;color:var(--ink);cursor:pointer;min-height:44px}
.bg-cd .t{display:block;font-size:13px;font-weight:700;line-height:1.25;margin-bottom:4px}
.bg-cd .t svg.i{width:14px;height:14px;vertical-align:-2px;margin-right:3px;color:var(--no)}
.bg-cd .r{display:grid;grid-template-columns:1fr auto;gap:2px 6px;align-items:center;font-size:11.5px;color:var(--muted);margin-top:3px}
.bg-cd .r .bar{grid-column:1/-1;height:6px;background:var(--soft2);border-radius:4px;overflow:hidden;display:block}
.bg-cd .r .bar i{display:block;height:100%;border-radius:4px}
.bg-cd .r b{font-size:12px;text-align:right;color:var(--ink);white-space:nowrap}
.bg-cd.on{border-color:var(--pri);background:var(--pri-bg)}
.bg-cd.thr{border-style:dashed;border-color:var(--no-line)}
.bg-cd.thr.on{border-color:var(--no);background:var(--no-bg)}
.bg-two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.bg-two div{background:var(--soft);border-radius:12px;padding:8px 10px;font-size:13.5px;line-height:1.4;overflow-wrap:anywhere}
.bg-two b{display:block;font-size:11.5px;letter-spacing:.4px;color:var(--muted);margin-bottom:2px}
.bg-one{background:var(--pri-bg);border-radius:12px;padding:8px 10px;font-size:13.5px;line-height:1.4;overflow-wrap:anywhere}
.bg-one b{display:block;font-size:11.5px;letter-spacing:.4px;color:var(--pri-deep);margin-bottom:2px}
/* strategy-map strip */
.mp-row{display:grid;grid-template-columns:22px 1fr;gap:2px 8px;align-items:start;border-bottom:1px solid var(--line);padding:6px 2px}
.mp-row .n{width:20px;height:20px;border-radius:6px;background:var(--soft2);color:var(--muted);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.mp-row.hot .n{background:var(--pri);color:var(--pri-ink)}
.mp-row b{font-size:13px;line-height:1.35;font-weight:600}
.mp-row.hot b{color:var(--pri-deep)}
.mp-row .t{grid-column:2;display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.mp-t{font-size:11.5px;font-weight:600;border-radius:7px;padding:2px 7px;background:var(--soft2);color:var(--ink)}
.mp-t.cur{background:var(--pri);color:var(--pri-ink)}
.mp-t.tbd{background:transparent;border:1.5px dashed var(--line2);color:var(--faint);padding:1px 6px}
.mp-ar{color:var(--faint);font-size:11px}
`;document.head.appendChild(st);})();

const NF=n=>Math.round(n).toLocaleString('en-GB');
const D$=v=>'$'+NF(v);
const GBP=v=>'£'+NF(v);
const KP=v=>'£'+(Math.round(v*10)/10)+'k';
const PCT=v=>Math.round(v)+'%';
function bgSlider(id,label,min,max,step,val,shown){
  return '<label class="bg-sl" for="'+id+'"><span class="h"><span>'+label+'</span><b id="'+id+'v">'+shown+'</b></span><input type="range" id="'+id+'" min="'+min+'" max="'+max+'" step="'+step+'" value="'+val+'"></label>';}
function bgSet(L,sel,v){const e=L.$(sel);e.value=String(v);e.dispatchEvent(new Event('input',{bubbles:true}));}
function bgChips(L,host,list,onPick){list.forEach(q=>{const b=document.createElement('button');b.className='chip';b.dataset.k=q[0];b.textContent=q[1];
  b.onclick=()=>{[...host.children].forEach(x=>x.classList.toggle('sel',x===b));onPick(q[0],b);};host.appendChild(b);});}

/* ---------- the BATNA pie with side plates ----------
   Angles run clockwise from 12 o’clock. Side A’s share sits left of the top, side B’s right of it.
   Each side’s BATNA slice is pulled out toward its plate; the real pie (what a deal adds above both
   BATNAs) is the top wedge, outlined, split at 12 o’clock. */
function bgArc(cx,cy,r,t1,t2){const P=t=>(cx+r*Math.sin(t)).toFixed(1)+' '+(cy-r*Math.cos(t)).toFixed(1);
  return 'M'+cx+' '+cy+'L'+P(t1)+'A'+r.toFixed(1)+' '+r.toFixed(1)+' 0 '+((t2-t1)>Math.PI?1:0)+' 1 '+P(t2)+'Z';}
function bgSeg(cx,cy,r,t1,t2,fill,stroke){if(t2-t1<1e-4)return '';
  const st=' stroke="var('+(stroke||'--card')+')" stroke-width="1.5" stroke-linejoin="round"';
  if(t2-t1>=2*Math.PI-1e-4)return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r.toFixed(1)+'" fill="var('+fill+')"'+st+'/>';
  return '<path d="'+bgArc(cx,cy,r,t1,t2)+'" fill="var('+fill+')"'+st+'/>';}
function bgPie(L,host,o){
  o=Object.assign({total:1000,a:0,b:0,share:.5,nA:'Union',nB:'Management',cA:'--h2',cB:'--h3',fmt:D$,scale:1,stage:3,no:false,top:null,topCol:null,bottom:null,botCol:null,lines:null,ro:null,crack:false,link:false},o||{});
  const w=document.createElement('div');host.appendChild(w);
  w.innerHTML='<svg class="bg-svg" viewBox="0 0 320 194" role="img"></svg><p class="bg-ro" aria-live="polite"></p>';
  const svg=w.querySelector('svg'),ro=w.querySelector('.bg-ro');
  const CX=160,CY=102,R0=60;
  const calc=()=>{const T=o.total,a=Math.max(0,o.a),b=Math.max(0,o.b),s=T-a-b;
    if(s>1e-9){const sa=s*o.share;return {T,a,b,s,sa,sb:s-sa,A:a+sa,B:b+s-sa,ok:true};}
    return {T,a,b,s:0,sa:0,sb:0,A:a,B:b,ok:false};};
  function plate(cx,name,col,ln,frac,fd){
    let s='<text x="'+cx+'" y="20" text-anchor="middle" font-size="11.5" font-weight="700" letter-spacing=".4" fill="var('+col+')">'+name.toUpperCase()+'</text>'+
      '<text x="'+cx+'" y="45" text-anchor="middle" font-size="18" font-weight="700" fill="var(--ink)">'+ln[0]+'</text>';
    if(ln[1])s+='<text x="'+cx+'" y="62" text-anchor="middle" font-size="11" fill="var(--muted)">'+ln[1]+'</text>';
    if(ln[2])s+='<text x="'+cx+'" y="76" text-anchor="middle" font-size="11" fill="var(--muted)">'+ln[2]+'</text>';
    s+='<ellipse cx="'+cx+'" cy="129" rx="34" ry="7" fill="var(--soft2)" stroke="var(--line2)" stroke-width="1.2"/>';
    const F=Math.max(0,Math.min(1,frac))*2*Math.PI,D=Math.min(F,Math.max(0,Math.min(1,fd))*2*Math.PI);
    if(F>1e-3){const t0=-F/2;s+=bgSeg(cx,106,17,t0,t0+D,col,null)+bgSeg(cx,106,17,t0+D,t0+F,col+'-bg',col);}
    return s;}
  function draw(){
    const c=calc(),r=R0*o.scale,F=o.fmt,base=c.ok?c.T:Math.max(c.a+c.b,1e-9),k=2*Math.PI/base;
    const lab=(t1,t2,txt,fill)=>{if((t2-t1)*r*.6<36||r<34)return '';const m=(t1+t2)/2;
      return '<text x="'+(CX+r*.6*Math.sin(m)).toFixed(1)+'" y="'+(CY-r*.6*Math.cos(m)+4).toFixed(1)+'" text-anchor="middle" font-size="11.5" font-weight="700" fill="var('+fill+')">'+txt+'</text>';};
    const ex=(t1,t2,d)=>{const m=(t1+t2)/2;return ' transform="translate('+(d*Math.sin(m)).toFixed(1)+' '+(-d*Math.cos(m)).toFixed(1)+')"';};
    let s='<g'+(o.no?' opacity=".3"':'')+'>';
    if(o.stage===0){s+='<circle cx="'+CX+'" cy="'+CY+'" r="'+r.toFixed(1)+'" fill="var(--soft2)" stroke="var(--line2)" stroke-width="1.5"/><text x="'+CX+'" y="'+(CY+6)+'" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink)">'+F(c.T)+'</text>';}
    else{
      const tA0=-(c.sa+c.a)*k,tA1=-c.sa*k,tB1=c.sb*k,tB2=(c.sb+c.b)*k,showA=o.stage>=1,showB=o.stage>=2,showH=o.stage>=3&&c.ok;
      if(c.ok){if(showH)s+=bgSeg(CX,CY,r,tA1,0,o.cA+'-bg',o.cA)+bgSeg(CX,CY,r,0,tB1,o.cB+'-bg',o.cB);
        else s+=bgSeg(CX,CY,r,tA1,tB1,'--soft2','--line2');}
      if(c.a>0){const d=showA?6:0;s+='<g'+ex(tA0,tA1,d)+'>'+bgSeg(CX,CY,r,tA0,tA1,showA?o.cA:'--soft2',showA?null:'--line2')+(showA?lab(tA0,tA1,F(c.a),'--card'):'')+'</g>';}
      if(c.b>0){const d=showB?6:0;s+='<g'+ex(tB1,tB2,d)+'>'+bgSeg(CX,CY,r,tB1,tB2,showB?o.cB:'--soft2',showB?null:'--line2')+(showB?lab(tB1,tB2,F(c.b),'--card'):'')+'</g>';}
      if(showH){s+=lab(tA1,0,F(c.sa),'--ink')+lab(0,tB1,F(c.sb),'--ink');
        if(c.a+c.b>0)s+='<path d="'+bgArc(CX,CY,r,tA1,tB1)+'" fill="none" stroke="var(--pri)" stroke-width="2.5" stroke-linejoin="round"/>';}
    }
    s+='</g>';
    if(o.crack)s+='<path d="M'+(CX-r*.85)+' '+(CY-8)+'l14 10l10-12l14 14l12-10l14 16l12-12l14 12l12-8" fill="none" stroke="var(--no)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
    if(o.link)s+='<g fill="none" stroke="var(--no)" stroke-width="3"><rect x="'+(CX-24)+'" y="'+(CY+r-6)+'" width="28" height="14" rx="7"/><rect x="'+(CX-4)+'" y="'+(CY+r-6)+'" width="28" height="14" rx="7"/></g>';
    if(o.no)s+='<text x="'+CX+'" y="'+(CY+6)+'" text-anchor="middle" font-size="17" font-weight="700" fill="var(--no)">SAID NO</text>';
    const top=o.top!=null?o.top:(o.stage<3?'REAL PIE ?':c.ok?'REAL PIE '+F(c.s):'NO REAL PIE');
    s+='<text x="'+CX+'" y="25" text-anchor="middle" font-size="11.5" font-weight="700" letter-spacing=".3" fill="var('+(o.topCol||(c.ok||o.stage<3?'--pri':'--no'))+')">'+top+'</text>';
    s+='<text x="'+CX+'" y="188" text-anchor="middle" font-size="11" font-weight="600" fill="var('+(o.botCol||'--muted')+')">'+(o.bottom!=null?o.bottom:'WHOLE PIE '+F(c.T))+'</text>';
    let ln;
    if(o.lines)ln=o.lines(c,o);
    else{const done=o.stage>=3||!c.ok;
      ln={A:[done?F(c.A):'?',(o.stage>=1&&c.a>0)?F(c.a)+' alone':'',!c.ok?'no deal':o.stage>=3?'+ '+F(c.sa)+' half':''],
          B:[done?F(c.B):'?',(o.stage>=2&&c.b>0)?F(c.b)+' alone':'',!c.ok?'no deal':o.stage>=3?'+ '+F(c.sb)+' half':'']};}
    const showSl=o.stage>=3&&!o.no;
    s+=plate(46,o.nA,o.cA,ln.A,showSl?c.A/base:0,c.a/base)+plate(274,o.nB,o.cB,ln.B,showSl?c.B/base:0,c.b/base);
    svg.innerHTML=s;
    svg.setAttribute('aria-label','Pie: '+o.nA+' gets '+F(c.A)+', '+o.nB+' gets '+F(c.B)+(c.ok?'; real pie '+F(c.s):'; no real pie'));
    ro.innerHTML=o.ro?o.ro(c,o):(o.nA+' <b>'+F(c.A)+'</b> · '+o.nB+' <b>'+F(c.B)+'</b> · '+(c.ok?'real pie <b>'+F(c.s)+'</b>, split '+(Math.abs(o.share-.5)<1e-6?'evenly':Math.round(o.share*100)+':'+Math.round(100-o.share*100)):'<b>no real pie</b>: a deal adds nothing'));
  }
  const api={w,o,calc,set(p){Object.assign(o,p||{});draw();}};
  draw();return api;}

/* ---------- the hotel season (book: 101 days, $1,000 a day, alternating offers, union makes the last) ---------- */
const uShare=n=>n%2?((n+1)/2)/n:.5;
const uTotal=n=>n%2?(n+1)/2*1000:n*500;
function bgDays(el,fill,mid){let s='';for(let i=1;i<=101;i++)s+='<rect x="'+(10+(i-1)*2.98).toFixed(2)+'" y="4" width="2.2" height="20" rx="1" fill="var('+fill(i)+')"/>';
  s+='<text x="10" y="40" font-size="11" fill="var(--muted)">day 1</text><text x="310" y="40" text-anchor="end" font-size="11" fill="var(--muted)">day 101</text><text x="160" y="40" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">'+mid+'</text>';
  el.innerHTML=s;}

/* ---------- fare bars: what each side pays, against what it would pay alone (its BATNA) ---------- */
function bgFare(L,host,o){
  const w=document.createElement('div');host.appendChild(w);const H=o.rows.length*64+4;
  w.innerHTML='<svg class="bg-svg" viewBox="0 0 320 '+H+'" role="img"></svg>';const svg=w.querySelector('svg');
  const F=o.fmt||D$,max=Math.max(...o.rows.map(r=>r.alone))*(o.pad||1.08),X=v=>10+Math.max(0,v)/max*290;
  function set(pays){let s='';
    o.rows.forEach((r,j)=>{const y=j*64+4,p=pays[j],sv=r.alone-p;
      s+='<text x="10" y="'+(y+11)+'" font-size="11.5" font-weight="700" letter-spacing=".3" fill="var('+r.col+')">'+r.n+'</text>'+
        '<rect x="10" y="'+(y+17)+'" width="'+(X(r.alone)-10).toFixed(1)+'" height="18" rx="5" fill="none" stroke="var(--line2)" stroke-width="1.5" stroke-dasharray="4 3"/>'+
        '<rect x="10" y="'+(y+20)+'" width="'+(X(p)-10).toFixed(1)+'" height="12" rx="4" fill="var('+r.col+')"/>'+
        '<path d="M'+X(r.alone).toFixed(1)+' '+(y+13)+'V'+(y+39)+'" stroke="var(--muted)" stroke-width="1.5"/>'+
        '<text x="10" y="'+(y+53)+'" font-size="12" fill="var(--muted)">pays <tspan font-weight="700" fill="var(--ink)">'+F(p)+'</tspan> · alone '+F(r.alone)+' · <tspan font-weight="700" fill="var('+(sv>=0?'--ok':'--no')+')">'+(sv>=0?'saves '+F(sv):F(-sv)+' worse than alone')+'</tspan></text>';});
    svg.innerHTML=s;svg.setAttribute('aria-label',o.rows.map((r,j)=>r.n+' pays '+F(pays[j])+', alone '+F(r.alone)).join('; '));}
  return {set};}

/* ---------- the deal range: one side’s floor to the other’s ceiling. The gap between them is the real pie;
   a price inside it splits the gap into what each side gains over walking away ---------- */
function bgRange(host,o){
  const w=document.createElement('div');host.appendChild(w);
  w.innerHTML='<svg class="bg-svg" viewBox="0 0 320 134" role="img"></svg><p class="bg-ro" aria-live="polite"></p>';
  const svg=w.querySelector('svg'),ro=w.querySelector('.bg-ro');
  function set(p){p=Object.assign({gap:true,mid:false,at:null,pins:[],solidHi:true,solidLo:true,hiSub:'',loSub:'',note:'',ro:''},p||{});
    const lo=o.lo,hi=o.hi,F=o.fmt,ok=hi>lo,a=Math.min(lo,hi),b=Math.max(lo,hi),pad=Math.max((b-a)*.08,Math.abs(b)*.04,1),d0=a-pad,d1=b+pad,X=v=>+(20+(v-d0)/(d1-d0)*280).toFixed(1);
    let s='<text x="160" y="14" text-anchor="middle" font-size="11.5" font-weight="700" letter-spacing=".3" fill="var('+(ok||!p.gap?'--pri':'--no')+')">'+(!p.gap?'WHERE IS THE REAL PIE?':ok?'REAL PIE '+F(hi-lo):'NO REAL PIE: NO NUMBER SUITS BOTH')+'</text>';
    s+='<rect x="20" y="52" width="280" height="16" rx="8" fill="var(--soft2)"/>';
    if(p.gap){
      if(ok&&p.at!=null){const m=X(p.at),gl=(x1,x2,v)=>x2-x1<30?'':'<text x="'+((x1+x2)/2).toFixed(1)+'" y="64" text-anchor="middle" font-size="11" font-weight="700" fill="var(--card)">+'+F(v)+'</text>';
        s+='<rect x="'+X(lo)+'" y="52" width="'+(m-X(lo)).toFixed(1)+'" height="16" fill="var('+o.loCol+')"/><rect x="'+m+'" y="52" width="'+(X(hi)-m).toFixed(1)+'" height="16" fill="var('+o.hiCol+')"/>'+gl(X(lo),m,p.at-lo)+gl(m,X(hi),hi-p.at)+
          '<path d="M'+m+' 44V76" stroke="var(--ink)" stroke-width="2.5"/>';}
      else s+='<rect x="'+X(a)+'" y="52" width="'+(X(b)-X(a)).toFixed(1)+'" height="16" fill="var('+(ok?'--pri-bg':'--no-bg')+')" stroke="var('+(ok?'--pri':'--no')+')" stroke-width="2"'+(ok?'':' stroke-dasharray="4 3"')+'/>';}
    if(p.mid&&ok){const m=X((lo+hi)/2);s+='<path d="M'+m+' 46V74" stroke="var(--pri)" stroke-width="2" stroke-dasharray="3 2"/><text x="'+m+'" y="38" text-anchor="middle" font-size="11" font-weight="700" fill="var(--pri)">'+F((lo+hi)/2)+'</text>';}
    p.pins.forEach(q=>{const x=X(q.v);s+='<path d="M'+(x-6)+' 41H'+(x+6)+'L'+x+' 49Z" fill="var('+(q.sel?'--ink':'--muted')+')"/><text x="'+x+'" y="35" text-anchor="middle" font-size="11" font-weight="'+(q.sel?700:500)+'" fill="var('+(q.sel?'--ink':'--muted')+')">'+q.label+'</text>';});
    const end=(v,col,name,solid,sub)=>{const x=X(v),tx=Math.max(70,Math.min(250,x));
      return '<path d="M'+x+' 44V76" stroke="var('+col+')" stroke-width="3"'+(solid?'':' stroke-dasharray="4 3"')+'/>'+
        '<text x="'+tx+'" y="90" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink)">'+F(v)+'</text>'+
        '<text x="'+tx+'" y="104" text-anchor="middle" font-size="11" font-weight="700" letter-spacing=".3" fill="var('+col+')">'+name+'</text>'+
        (sub?'<text x="'+tx+'" y="117" text-anchor="middle" font-size="11" fill="var(--muted)">'+sub+'</text>':'');};
    s+=end(lo,o.loCol,o.loName,p.solidLo,p.loSub)+end(hi,o.hiCol,o.hiName,p.solidHi,p.hiSub);
    if(p.note)s+='<text x="160" y="131" text-anchor="middle" font-size="11" font-weight="600" fill="var(--pri-deep)">'+p.note+'</text>';
    svg.innerHTML=s;svg.setAttribute('aria-label',o.loName+' '+F(lo)+', '+o.hiName+' '+F(hi)+(ok?', real pie '+F(hi-lo):', no real pie')+(p.at!=null?', price '+F(p.at):''));
    ro.innerHTML=p.ro;}
  return {o,set};}

/* ---------- issue trade cards: each card shows its value to each side; the tray tallies the package ---------- */
function bgCards(L,host,o){
  const st={on:new Set(),ever:new Set()},F=o.fmt;
  const w=document.createElement('div');host.appendChild(w);
  w.innerHTML='<div class="bg-cards"></div><svg class="bg-svg" viewBox="0 0 320 112" role="img"></svg><p class="bg-ro" aria-live="polite"></p>';
  const grid=w.querySelector('.bg-cards'),svg=w.querySelector('svg'),ro=w.querySelector('.bg-ro');
  const row=(nm,v,thr)=>{const pc=Math.min(100,Math.abs(v)/3.2*100);
    return '<span class="r"><span>'+nm+'</span><b>'+(thr?'?':F(v))+'</b><span class="bar"><i style="width:'+(thr?0:pc)+'%;background:var('+(v>=0?'--ok':'--no')+')"></i></span></span>';};
  o.cards.forEach(c=>{const b=document.createElement('button');b.className='bg-cd'+(c.thr?' thr':'');b.dataset.k=c.id;b.setAttribute('aria-pressed','false');
    b.innerHTML='<span class="t">'+(c.thr?L.ic('alert'):'')+c.t+'</span>'+row(o.nA,c.a,c.thr)+row(o.nB,c.b,c.thr);
    b.onclick=()=>{if(st.on.has(c.id))st.on.delete(c.id);else{if(o.single)st.on.clear();st.on.add(c.id);st.ever.add(c.id);}
      [...grid.children].forEach(x=>{const on=st.on.has(x.dataset.k);x.classList.toggle('on',on);x.setAttribute('aria-pressed',on?'true':'false');});draw();if(o.onChange)o.onChange(api);};
    grid.appendChild(b);});
  const tot=()=>{let a=0,b=0,thr=false;o.cards.forEach(c=>{if(st.on.has(c.id)){a+=c.a;b+=c.b;if(c.thr)thr=true;}});return {a,b,j:a+b,thr};};
  /* tally: each row’s name sits on its own line above a wide bar; the axis at the centre is “no change” */
  function draw(){const t=tot(),Z=160,U=o.unit||15,cl=v=>Math.max(-6,Math.min(8,v)),empty=st.on.size===0;
    const bar=(y,v,col,ghost)=>{const x2=Z+cl(v)*U;let s='';
      if(ghost!=null){const g=Z+cl(ghost)*U;s+='<rect x="'+Math.min(Z,g)+'" y="'+(y-10)+'" width="'+Math.abs(g-Z)+'" height="20" rx="4" fill="none" stroke="var(--line2)" stroke-width="1.5" stroke-dasharray="4 3"/>';}
      if(empty)return s+(y<40&&ghost==null?'<text x="'+(Z+6)+'" y="'+(y+4)+'" font-size="11.5" fill="var(--muted)">nothing chosen yet</text>':'');
      s+='<rect x="'+Math.min(Z,x2)+'" y="'+(y-7)+'" width="'+Math.max(1,Math.abs(x2-Z))+'" height="14" rx="3" fill="var('+col+')"/>';
      s+='<text x="'+(v>=0?x2+5:x2-5)+'" y="'+(y+4)+'" text-anchor="'+(v>=0?'start':'end')+'" font-size="12" font-weight="700" fill="var(--ink)">'+F(v)+'</text>';return s;};
    let s='<path d="M'+Z+' 18V108" stroke="var(--line2)" stroke-width="1.5"/>';
    [[28,o.nA.toUpperCase(),t.a,o.cA,o.base?o.base.a:null],[64,o.nB.toUpperCase(),t.b,o.cB,o.base?o.base.b:null],[100,'TOGETHER',t.j,'--pri',o.base?o.base.a+o.base.b:null]].forEach((q,j)=>{
      s+='<text x="6" y="'+(q[0]-13)+'" font-size="11.5" font-weight="700" letter-spacing=".3" fill="var('+q[3]+')">'+q[1]+'</text>'+bar(q[0],q[2],q[3],q[4]);
      if(!j&&o.ghostLab)s+='<text x="314" y="'+(q[0]-13)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+o.ghostLab+'</text>';
      if(!j&&o.axisLab)s+='<text x="314" y="'+(q[0]-13)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+o.axisLab+'</text>';});
    svg.innerHTML=s;svg.setAttribute('aria-label','Package: '+o.nA+' '+F(t.a)+', '+o.nB+' '+F(t.b)+', together '+F(t.j));
    ro.innerHTML=empty&&o.empty?o.empty:o.ro?o.ro(t,api):(o.nA+' <b>'+F(t.a)+'</b> · '+o.nB+' <b>'+F(t.b)+'</b> · together <b>'+F(t.j)+'</b>');}
  const api={w,st,tot,draw};draw();return api;}

Course.lesson({
  id:'0012', title:'Bargaining', minutes:20, icon:'scale',
  goals:['Measure the real pie in any split: what a deal adds above both sides’ BATNAs, and split that, not the headline number',
         'Shift the split the ways the book shows: a better BATNA (shown once it’s real), a lower cost of waiting, and trades on issues each side values differently',
         'Run the one-minute bargaining move on pay, rent or shared costs, and know its limits: pride, strikes that hurt bystanders, linked threats and real breakdowns'],
  parts:['Reason back from the end','Measure the real pie','Power and patience','Many issues, real life'],
  read:'Read chapter 11 of the book, “Bargaining”, for the hotel season tables, the airfare split, the 1980 baseball strike, the virtual strike cases and the appendix on Rubinstein bargaining.',
  glossary:{
   'real-pie':'The real pie: the extra value a deal creates above what both sides would get anyway (their BATNAs). That, not the headline number, is what’s really being split.',
   'waiting-cost':'Cost of waiting: what each day or week without a deal costs a side. The side that loses less from waiting gets the larger share.',
   'virtual-strike':'Virtual strike: workers keep working without pay and the firm keeps operating but gives up its revenue, so both sides feel a strike’s pain while customers and bystanders are spared.'
  },
  cheatsheet:[
   '<b>Reason back from the last offer</b>: the edge from making the final offer shrinks as talks get longer. The book’s 101-day hotel season splits $505 vs $495 a day, agreed on day one, since delay only burns the pie.',
   '<b>Measure the real pie</b>: the deal’s value minus both BATNAs. Hotel: $1,000 a day, fallbacks $300 and $500, so the real pie is $200.',
   '<b>Split the real pie</b>: each side gets its BATNA plus half: $400 and $600. Shared airfare: share the $1,000 saved, so $832 and $1,986.',
   '<b>Improve your BATNA, then show it</b>: only a real, known alternative moves the split (“Or else what?”). Hurting both sides, but them more, also shifts it, at a cost.',
   '<b>The patient side gets more</b>: whoever loses less from waiting gets the bigger share; twice as impatient means half as much.',
   '<b>Trade across issues</b>: give what costs you little and they value a lot (health cover: $1,000 to the firm, $2,000 to a worker alone). Don’t link a threat.',
   '<b>Limits</b>: pride and fairness (the taxi; low ultimatum offers rejected), strikes that hurt bystanders (a virtual strike spares them), brinkmanship that really breaks down.',
   '<b>One-minute move</b> (how this course applies the book): both BATNAs → real pie → who waits better → improve and show your BATNA → trade issues → split the real pie evenly.'
  ],
  steps:[
/* ---------- PART 1: REASON BACK FROM THE END ---------- */
{part:0,src:'Chapter 11 · opening',pts:1,run(L){

{part:0,src:'Chapter 11 · opening',
 solve:async L=>{for(let k=0;k<3;k++){L.$('#sb').click();await L.sleep(20);}L.$('#sj').click();},
 run(L){
  let n=1,fin=false;const seen=[1];
  L.h(L.kick('learn','Explore · start at the end')+'<h1 class="q">Start on the last day of the season and step back. How does the split change?</h1>'+
   '<p class="bg-ill">The book’s hotel: $1,000 profit a day for 101 days, but it opens only once union and management agree pay. They take turns, one offer a day; the union makes the last one.</p>'+
   '<div id="sp"></div><svg class="bg-svg" id="sds" viewBox="0 0 320 44" role="img" aria-label="Season strip: lit days are the days still left"></svg>'+
   '<svg class="bg-svg" id="scv" viewBox="0 0 320 94" role="img" aria-label="Union’s share per day against days left, closing in on an even split"></svg>'+
   '<p class="bg-cap" id="scap"></p><div class="bg-ctl"><button class="btn pri" id="sb">'+L.ic('arrow')+'Step back a day</button><button class="btn" id="sj" disabled>Jump to day 1</button></div>');
  const P=bgPie(L,L.$('#sp'),{a:0,b:0,share:1,lines:c=>({A:[D$(c.A),'a day',''],B:[D$(c.B),'a day','']}),
    ro:c=>'Union <b>'+D$(c.A)+'</b> a day · management <b>'+D$(c.B)+'</b> a day'});
  const lx=v=>46+Math.log(v)/Math.log(101)*260,ly=u=>72-(u-.5)/.5*50;
  function draw(){const u=uShare(n);
    P.set({share:u,scale:Math.max(.26,Math.sqrt(n/101)),top:n+(n>1?' DAYS':' DAY')+' LEFT',bottom:'ON THE TABLE: '+D$(n*1000)+' · '+(n%2?'UNION':'MANAGEMENT')+' OFFERS TODAY'});
    bgDays(L.$('#sds'),i=>i>101-n?'--pri':'--soft2',n+(n>1?' days':' day')+' left');
    let s='<text x="46" y="12" font-size="11" font-weight="700" fill="var(--muted)">UNION’S SHARE PER DAY</text><path d="M46 '+ly(.5)+'H306" stroke="var(--line2)" stroke-dasharray="4 3"/><text x="306" y="'+(ly(.5)-4)+'" text-anchor="end" font-size="11" fill="var(--muted)">even split</text>'+
      '<text x="36" y="'+(ly(1)+4)+'" text-anchor="end" font-size="11" fill="var(--muted)">all</text><text x="36" y="'+(ly(.5)+4)+'" text-anchor="end" font-size="11" fill="var(--muted)">half</text>'+
      '<text x="46" y="90" font-size="11" fill="var(--muted)">1 day left</text><text x="306" y="90" text-anchor="end" font-size="11" fill="var(--muted)">101 days</text>';
    const pts=seen.slice().sort((p,q)=>p-q);
    s+='<path d="'+pts.map((v,j)=>(j?'L':'M')+lx(v).toFixed(1)+' '+ly(uShare(v)).toFixed(1)).join('')+'" fill="none" stroke="var(--h2)" stroke-width="2"/>';
    pts.forEach(v=>{s+='<circle cx="'+lx(v).toFixed(1)+'" cy="'+ly(uShare(v)).toFixed(1)+'" r="'+(v===n?5:3.5)+'" fill="var(--h2)"/>';});
    L.$('#scv').innerHTML=s;
    L.$('#scap').innerHTML=n===1?'<b>Last day, union’s turn.</b> Management takes anything over nothing, so the union asks for all $1,000.':
      n===2?'<b>Management’s turn.</b> The union could wait and take $1,000 tomorrow, so management offers exactly that and keeps the other $1,000: $500 a day each.':
      n===3?'<b>Union’s turn.</b> Management could wait for $1,000 tomorrow, so the union offers that and keeps $2,000: $667 vs $333 a day.':
      n===101?'<b>Day 1, union’s turn: $505 vs $495 a day.</b> Almost an even split.':
      '<b>'+(n%2?'Union':'Management')+'’s turn.</b> Each step back, the edge from making the offer is spread over more days.';
    L.$('#sj').disabled=n<4||n===101;L.$('#sb').disabled=n>=101;
    if(n===101&&!fin){fin=true;L.sheet('info','Reason back from the last offer','This is Rule 1, '+L.g('backward-reasoning','look ahead and reason back')+', used on bargaining. Making the last offer is an edge, but it shrinks as the season grows: $505 vs $495. The book: with short gaps between offers and a long horizon, the rule becomes simple: split it down the middle.');L.done();}}
  L.$('#sb').onclick=()=>{if(n<101){n++;seen.push(n);draw();}};
  L.$('#sj').onclick=()=>{n=101;seen.push(101);draw();};
  draw();}},

{part:0,src:'Chapter 11 · opening',pts:1,

{part:1,src:'Chapter 11 · The Handicap System in Negotiations',

  B.set([1332,2486]);
  bgChips(L,L.$('#fc'),[['s','Halve the fare'],['l','By legs'],['p','In proportion'],['b','Split the saving']],k=>{B.set(M[k][0]);L.$('#fcap').innerHTML=M[k][1];seen.add(k);
    if(seen.size===4&&!fin){fin=true;L.sheet('info','The pie is the saving, not the fare','If they can’t agree, the lawyer makes two trips: $3,818. Together the trip costs $2,818. The real pie is the $1,000 saved, and each client is equally needed to create it, so equally patient sides split it evenly. Houston pays less here than under any other method. The book traces this idea back to the Talmud.');L.done();}});}},

{part:1,src:'Chapter 11 · Measuring the Pie',pts:1,

 run(L){

{part:1,src:'Chapter 11 · Measuring the Pie',pts:1,
 solve:async L=>{L.$('#ko [data-k="firm"]').click();L.$('#kt [data-k="yes"]').click();L.$('#kl').click();},
 run(L){
  let fin=false,firm=false,told=false,early=false;
  L.h(L.kick('pr','Challenge · the pay talk')+'<h1 class="q">Raise Tali’s pay without a louder word: change only what happens if there’s no deal.</h1>'+
   '<p class="bg-ill">Illustrative numbers, per year. Tali’s work brings Plover £80k. Tali is paid £46k today. A Kittiwake recruiter has sounded Tali out.</p>'+
   '<div id="kp"></div><span class="bg-lab">The Kittiwake approach</span><div class="bg-chips" id="ko"></div>'+
   '<span class="bg-lab">Tell Greer?</span><div class="bg-chips" id="kt"></div>'+
   '<div class="bg-ctl"><button class="btn" id="kd">Say “£60k, or else”</button></div><div class="bg-say" id="ksay" aria-live="polite"><b>GREER</b>Let’s look at your pay for next year.</div>'+
   '<div class="bg-ctl"><button class="btn pri" id="kl">'+L.ic('check')+'Lock in</button></div>');
  const P=bgPie(L,L.$('#kp'),{total:80,a:46,b:34,nA:'Tali',nB:'Greer',fmt:KP,bottom:'WHAT TALI’S WORK BRINGS IN: £80K A YEAR',
    lines:c=>({A:[KP(c.A),'no deal: '+KP(c.a),c.ok?'+ '+KP(c.sa)+' half':'nothing extra'],B:[KP(c.B),'no deal: '+KP(c.b),c.ok?'+ '+KP(c.sb)+' half':'nothing extra']}),
    ro:c=>'Greer counts Tali’s alternative as <b>'+KP(c.a)+'</b>'+(c.ok?' (the firm offer)':' (today’s pay)')+' · Tali’s pay: <b>'+KP(c.A)+'</b>'});
  const say=t=>L.$('#ksay').innerHTML='<b>GREER</b>'+t;
  function upd(){const real=firm&&told;P.set(real?{a:52,b:20,top:null}:{a:46,b:34,top:'NOTHING TO SPLIT'});}
  bgChips(L,L.$('#ko'),[['snd','Just sounded out'],['firm','Firm offer: £52k']],k=>{firm=k==='firm';upd();
    if(firm&&!told)say('(doesn’t know yet) Same budget as last year, Tali.');});
  bgChips(L,L.$('#kt'),[['no','Not yet'],['yes','Mention it']],k=>{told=k==='yes';if(told&&!firm)early=true;upd();
    if(told&&firm)say('A written offer at £52k? Then losing you means hiring and training someone: Plover keeps about £20k instead of £34k. Let’s find a number.');
    else if(told)say('Do you have an offer? … No? Then nothing has changed.');
    else say('Let’s look at your pay for next year.');});
  L.$('#ko').children[0].classList.add('sel');L.$('#kt').children[0].classList.add('sel');upd();
  L.$('#kd').onclick=()=>say(firm&&told?'You don’t need to shout. The offer is what counts; let’s talk numbers.':'Or else what? A louder demand with nothing behind it changes nothing.');
  L.$('#kl').onclick=()=>{if(fin)return;fin=true;const ok=firm&&told;L.award(ok);
    L.sheet(ok?'ok':'no',ok?'A real alternative, shown, moves the split':'Make it firm, then mention it',
      'With a firm £52k offer that Greer knows about, “no deal” means Tali leaves. A real pie of £8k appears; split evenly, Tali’s pay is £56k. Without it, “no deal” only means today’s pay goes on, like the book’s union working on under an expired contract: weak for the side that wants a change.'+(early?' And order matters: mentioning a mere sounding-out first was an empty “or else”.':' Mention an offer only once it’s real and you’d really take it.'));L.done();};}},

{part:1,src:'Chapter 11 · Measuring the Pie',pts:6,run(L){
  L.h(L.kick('pr','Practice · real or not?')+'<h1 class="q">Which of these is a real BATNA, something you can actually get with no deal?</h1>');
  L.buckets(L.card,['A real BATNA','Not (yet) a BATNA'],[
   ['A written job offer Tali could accept on Monday.',0,'Tali can take it without Greer’s agreement. That’s what makes it count.'],
   ['A recruiter’s “we should talk sometime”.',1,'There’s nothing to walk to yet. Leaning on it invites “Or else what?”'],
   ['For the landlord: re-letting the flat after a month empty.',0,'The landlord can do it alone, at a cost. It’s their fallback, and Tali should estimate it.'],
   ['Tali’s feeling that Greer “can’t manage without me”.',1,'A belief, not an alternative. It’s also a guess about Greer’s BATNA, so check it against facts.'],
   ['Juno, haggling over a lamp, with the same lamp on the next stall for £5 less.',0,'Juno can walk over and buy it. A real, nearby alternative.'],
   ['Arlo saying “I’ll find the money somewhere else” with no lender in mind.',1,'Words with no option behind them. Until there’s a lender, it isn’t a BATNA.']],
   'A BATNA is what you can actually get without this deal, by yourself. Hopes, hints and feelings don’t count, for you or for the other side.');}},

{part:2,src:'Chapter 11 · This Will Hurt You More Than It Hurts Me',pts:1,

{part:2,src:'Chapter 11 · This Will Hurt You More Than It Hurts Me',pts:1,
 solve:async L=>{L.$('#bb [data-k="ex"]').click();L.$('#bb [data-k="md"]').click();L.$('#bl').click();},
 run(L){
  let fin=false;const on=new Set();
  L.h(L.kick('pr','Challenge · time the strike')+'<h1 class="q">Lower their BATNA more than yours. In which part of the season should the players strike?</h1>'+
   '<p class="bg-ill">The book’s 1980 baseball case. Bar heights are illustrative; the pattern is the book’s.</p>'+
   '<svg class="bg-svg" id="bsv" viewBox="0 0 320 168" role="img"></svg><div class="bg-chips" id="bb"></div><p class="bg-ro" id="bro" aria-live="polite"></p>'+
   '<div class="bg-ctl"><button class="btn pri" id="bl" disabled>'+L.ic('check')+'Strike in these weeks</button></div>');
  const PER=[['ex','Exhibition','players unpaid',.6,4],['er','Early season','low gates',5,2],['md','Memorial Day on','big gates and TV',5,9]];
  function draw(){let s='',pl=0,ow=0;
    PER.forEach((q,j)=>{const x=6+j*104,sel=on.has(q[0]),H=v=>v/9*62;
      s+='<rect x="'+x+'" y="2" width="100" height="140" rx="10" fill="var('+(sel?'--no-bg':'--soft')+')"'+(sel?' stroke="var(--no)" stroke-width="2"':'')+'/>'+
        '<text x="'+(x+50)+'" y="18" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--ink)">'+q[1]+'</text><text x="'+(x+50)+'" y="31" text-anchor="middle" font-size="11" fill="var(--muted)">'+q[2]+'</text>'+
        '<rect x="'+(x+22)+'" y="'+(104-H(q[3])).toFixed(1)+'" width="24" height="'+H(q[3]).toFixed(1)+'" rx="3" fill="var(--h2)"/><rect x="'+(x+54)+'" y="'+(104-H(q[4])).toFixed(1)+'" width="24" height="'+H(q[4]).toFixed(1)+'" rx="3" fill="var(--h3)"/>'+
        '<path d="M'+(x+12)+' 104H'+(x+88)+'" stroke="var(--line2)" stroke-width="1.5"/>'+
        '<text x="'+(x+50)+'" y="119" text-anchor="middle" font-size="11" font-weight="600" fill="var('+(q[4]>q[3]?'--ok':'--no')+')">'+(q[4]>q[3]?'owners hurt more':'players hurt more')+'</text>'+
        (sel?'<text x="'+(x+50)+'" y="135" text-anchor="middle" font-size="11" font-weight="700" fill="var(--no)">ON STRIKE</text>':'');
      if(sel){pl+=q[3];ow+=q[4];}});
    s+='<rect x="40" y="152" width="10" height="10" rx="2" fill="var(--h2)"/><text x="54" y="161" font-size="11" fill="var(--ink)">players’ loss</text><rect x="168" y="152" width="10" height="10" rx="2" fill="var(--h3)"/><text x="182" y="161" font-size="11" fill="var(--ink)">owners’ loss</text>';
    L.$('#bsv').innerHTML=s;L.$('#bsv').setAttribute('aria-label','Loss per strike week. Exhibition: players lose little, owners lose more. Early season: players lose more. From Memorial Day: owners lose much more.');
    L.$('#bro').innerHTML=!on.size?'Tap the parts of the season to strike in.':'A strike week here costs players <b>'+pl+'</b> and owners <b>'+ow+'</b> (illustrative units) · '+(ow>pl?'<b style="color:var(--ok)">owners’ fallback drops more: the split moves to the players</b>':'<b style="color:var(--no)">players’ fallback drops more: the split moves to the owners</b>');
    L.$('#bl').disabled=!on.size||fin;}
  PER.forEach(q=>{const b=document.createElement('button');b.className='chip';b.dataset.k=q[0];b.textContent=q[1];b.setAttribute('aria-pressed','false');
    b.onclick=()=>{if(fin)return;on.has(q[0])?on.delete(q[0]):on.add(q[0]);b.classList.toggle('sel',on.has(q[0]));b.setAttribute('aria-pressed',on.has(q[0])?'true':'false');draw();};L.$('#bb').appendChild(b);});
  L.$('#bl').onclick=()=>{if(fin)return;fin=true;const ok=on.size===2&&on.has('ex')&&on.has('md');L.award(ok);draw();
    L.sheet(ok?'ok':'no',ok?'Exactly what the players did':'Strike where owners lose most and players least',
      'In 1980 the players struck in the exhibition season, when they drew no salary but owners still sold tickets. They went back for the regular season, when their pay ran but owners’ takings were low, and threatened to strike again from Memorial Day weekend, when gates and TV money rise. The owners gave in just before the second strike. Lowering their BATNA more than yours shifts the split, but it costs you too, and the first strike really happened. Next: why.');L.done();};
  draw();}},

{part:2,src:'Chapter 11 · Brinkmanship and Strikes',
 solve:async L=>{for(let k=0;k<4;k++){L.$('#kn').click();await L.sleep(10);}},
 run(L){
  let j=0;
  L.h(L.kick('ex','Why strikes happen')+'<h1 class="q">If both sides reason ahead, why do strikes happen at all? Step through one.</h1>'+
   '<svg class="bg-svg" id="ksv" viewBox="0 0 320 196" role="img" aria-label="Union and management during a strike, with what each has lost so far"></svg>'+
   '<p class="bg-ill">Illustrative numbers: each strike day costs the union $200 and management $500.</p>'+
   '<div class="bg-say" id="ksay" aria-live="polite"></div><div class="bg-ctl"><button class="btn pri" id="kn">'+L.ic('arrow')+'Next</button></div>');
  const S=[[0,'BEFORE THE OLD CONTRACT ENDS','No rush: work goes on. Each side claims that waiting costs it little, since the side that waits more cheaply gets more. So neither believes the other.'],
   [1,'THE STRIKE STARTS','The only proof of a low cost of waiting is to start paying it. A strike is a signal: actions speak louder than words.'],
   [4,'ONE MORE DAY','“We’ll never come back” isn’t believable. “One more day” is. Each side holds out, sure the other is about to give in.'],
   [7,'THE SLIPPERY SLOPE','It’s '+L.g('brinkmanship','brinkmanship')+', as in lesson 8: losses and tempers grow each day, and talks can break down even though neither side wants that.'],
   [9,'SOMEONE GIVES IN','Management finds the union really does lose less from waiting, and settles. The proof cost both sides, and their customers too.']];
  const per=(x,col)=>'<circle cx="'+x+'" cy="40" r="11" fill="var('+col+')"/><path d="M'+(x-17)+' 78C'+(x-17)+' 56 '+(x+17)+' 56 '+(x+17)+' 78Z" fill="var('+col+')"/>';
  /* speech bubble with a tail pointing at its speaker (left or right) */
  const bub=(x,left,col,t1,t2)=>'<path d="M'+(left?x+2:x+90)+' 38L'+(left?x-10:x+102)+' 44L'+(left?x+2:x+90)+' 46Z" fill="var(--card)" stroke="var('+col+')" stroke-width="1.3"/>'+
    '<rect x="'+x+'" y="16" width="92" height="40" rx="12" fill="var(--card)" stroke="var('+col+')" stroke-width="1.3"/><text x="'+(x+46)+'" y="32" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--ink)">'+t1+'</text><text x="'+(x+46)+'" y="47" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--ink)">'+t2+'</text>';
  function draw(){const d=S[j][0];
    let s='<rect width="320" height="196" rx="14" fill="var(--soft)"/>'+per(44,'--h2')+per(276,'--h3')+
      '<text x="44" y="96" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--h2)">UNION</text><text x="276" y="96" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--h3)">MANAGEMENT</text>';
    if(j===0)s+=bub(64,true,'--h2','Waiting costs','us little.')+bub(164,false,'--h3','Waiting costs','us even less.')+
      '<text x="8" y="118" font-size="11" font-weight="700" fill="var(--muted)">OLD CONTRACT STILL RUNNING · LOST SO FAR</text>'+
      [[134,'Union'],[158,'Management']].map(q=>'<text x="8" y="'+(q[0]+4)+'" font-size="11.5" fill="var(--ink)">'+q[1]+'</text><rect x="86" y="'+(q[0]-6)+'" width="150" height="12" rx="3" fill="none" stroke="var(--line2)" stroke-dasharray="3 3"/><text x="244" y="'+(q[0]+4)+'" font-size="11.5" font-weight="700" fill="var(--ink)">$0</text>').join('')+
      '<text x="8" y="186" font-size="11.5" font-weight="600" fill="var(--ok)">Customers: served as usual</text>';
    if(j===1||j===2)s+='<path d="M98 44V78" stroke="var(--muted)" stroke-width="2.5"/><rect x="68" y="18" width="62" height="26" rx="4" fill="var(--card)" stroke="var(--h2)" stroke-width="2"/><text x="99" y="35" text-anchor="middle" font-size="11" font-weight="700" fill="var(--h2)">ON STRIKE</text>';
    if(j===3)s+='<path d="M120 22Q178 24 204 88" fill="none" stroke="var(--line2)" stroke-width="4" stroke-linecap="round"/><circle cx="182" cy="46" r="7" fill="var(--pri)"/><text x="214" y="70" font-size="11" font-weight="700" fill="var(--no)">risk grows</text>';
    if(j===4)s+='<path d="M234 74V24" stroke="var(--muted)" stroke-width="2.5"/><path d="M234 24H212L216 31L212 38H234Z" fill="var(--card)" stroke="var(--muted)" stroke-width="1.5"/><text x="160" y="56" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">“All right, let’s settle.”</text>';
    if(d>0){s+='<text x="8" y="118" font-size="11" font-weight="700" fill="var(--muted)">STRIKE DAY '+d+' · LOST SO FAR</text>';
      [[134,'Union',200,8,'--h2'],[158,'Management',500,20,'--h3']].forEach(q=>{const wd=d*q[3];
        s+='<text x="8" y="'+(q[0]+4)+'" font-size="11.5" fill="var(--ink)">'+q[1]+'</text><rect x="86" y="'+(q[0]-6)+'" width="'+wd+'" height="12" rx="3" fill="var('+q[4]+')"/><text x="'+(90+wd)+'" y="'+(q[0]+4)+'" font-size="11.5" font-weight="700" fill="var(--ink)">−'+D$(d*q[2])+'</text>';});
      s+='<text x="8" y="186" font-size="11.5" font-weight="600" fill="var(--no)">Customers: no service either</text>';}
    L.$('#ksv').innerHTML=s;L.$('#ksay').innerHTML='<b>'+S[j][1]+'</b>'+S[j][2];}
  L.$('#kn').onclick=()=>{if(j<4){j++;draw();}if(j===4){L.$('#kn').disabled=true;
    L.sheet('info','A strike is a costly signal','Reasoning ahead predicts a deal on day one, but only if both sides see the same end. They often don’t: each must guess the other’s cost of waiting, and only paying it proves it. Working on under an expired contract signals weakness for the side that wants a change; some risk of a strike is what moves the other side.');L.done();}};
  draw();}},

{part:2,src:'Chapter 11 · The Virtues of a Virtual Strike',
 solve:async L=>{['r','v','d'].forEach(k=>L.$('#vt [data-k="'+k+'"]').click());},
 run(L){
  let fin=false;const seen=new Set();
  L.h(L.kick('ex','Cases from the book')+'<h1 class="q">A strike hurts more than the two sides. Compare a real strike with a virtual one.</h1>'+
   '<div class="bg-chips" id="vt"></div><svg class="bg-svg" id="vsv" viewBox="0 0 320 164" role="img" aria-label="Who is hurt: workers, company and customers"></svg><p class="bg-cap" id="vcap">Tap a view.</p>');
  const icon=(x,k)=>{const c=x+49;if(k==='w')return '<circle cx="'+(c-11)+'" cy="44" r="6" fill="var(--h2)"/><circle cx="'+(c+11)+'" cy="44" r="6" fill="var(--h2)"/><path d="M'+(c-21)+' 66c0-12 20-12 20 0zM'+(c+1)+' 66c0-12 20-12 20 0z" fill="var(--h2)"/>';
    if(k==='c')return '<rect x="'+(c-18)+'" y="36" width="36" height="30" rx="3" fill="var(--h3)"/>'+[0,1,2].map(i=>'<rect x="'+(c-13+i*10)+'" y="42" width="6" height="6" fill="var(--card)"/><rect x="'+(c-13+i*10)+'" y="53" width="6" height="6" fill="var(--card)"/>').join('');
    return '<circle cx="'+(c-6)+'" cy="42" r="6" fill="var(--h1)"/><path d="M'+(c-16)+' 66c0-14 20-14 20 0z" fill="var(--h1)"/><rect x="'+(c+6)+'" y="52" width="13" height="13" rx="2" fill="var(--h1)"/>';};
  const panel=(x,t,k,l1,l2,kind)=>'<rect x="'+x+'" y="4" width="98" height="126" rx="12" fill="var(--soft)"/><text x="'+(x+49)+'" y="22" text-anchor="middle" font-size="11" font-weight="700" fill="var(--muted)">'+t+'</text>'+icon(x,k)+
    '<rect x="'+(x+5)+'" y="80" width="88" height="42" rx="9" fill="var(--'+kind+'-bg)"/><text x="'+(x+49)+'" y="97" text-anchor="middle" font-size="11" font-weight="700" fill="var(--'+kind+')">'+l1+'</text><text x="'+(x+49)+'" y="112" text-anchor="middle" font-size="11" font-weight="700" fill="var(--'+kind+')">'+l2+'</text>';
  const V={r:[['lose','their wages','no'],['lose','their profits','no'],['no service,','left stranded','no']],v:[['work as usual,','but unpaid','no'],['gives up all','its revenue','no'],['served','as usual','ok']]};
  const T={r:'A real strike hurts both sides, and everyone around them. The 2004–5 hockey lockout cost a whole season, and crowds took a long time to come back.',
    v:'A '+L.g('virtual-strike','virtual strike')+': both sides feel the same pain, so their BATNAs and pressure to settle are unchanged, but customers are spared. Meridiana’s crews did this in Italy in 1999; the airline gave the fares to charity.',
    d:'In 2002 a ten-day lockout at US ports disrupted more than $10 billion of the economy, in a dispute over $20 million of changes: 500 times larger.'};
  function draw(k){let s='';
    if(k==='d'){s='<rect x="40" y="96" width="4" height="4" fill="var(--h3)"/><text x="42" y="120" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">$20 million</text><text x="42" y="135" text-anchor="middle" font-size="11" fill="var(--muted)">in dispute</text>'+
      '<rect x="150" y="8" width="90" height="90" rx="4" fill="var(--no-bg)" stroke="var(--no)" stroke-width="2"/><text x="195" y="120" text-anchor="middle" font-size="11" font-weight="700" fill="var(--no)">$10 billion+</text><text x="195" y="135" text-anchor="middle" font-size="11" fill="var(--muted)">of disruption to others</text><text x="160" y="158" text-anchor="middle" font-size="11" fill="var(--muted)">square areas to scale</text>';}
    else{const p=V[k];s=panel(6,'WORKERS','w',p[0][0],p[0][1],p[0][2])+panel(111,'COMPANY','c',p[1][0],p[1][1],p[1][2])+panel(216,'CUSTOMERS','u',p[2][0],p[2][1],p[2][2])+
      '<text x="160" y="152" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--pri)">Pressure on both sides to settle: the same</text>';}
    L.$('#vsv').innerHTML=s;L.$('#vcap').innerHTML=T[k];}
  bgChips(L,L.$('#vt'),[['r','Real strike'],['v','Virtual strike'],['d','Side damage']],k=>{draw(k);seen.add(k);
    if(seen.size===3&&!fin){fin=true;L.sheet('info','Hurt the parties, not the bystanders','A virtual strike keeps the pressure that makes a deal happen, without the waste. It has been tried: a wartime valve plant, Miami’s buses in 1960 (free rides) and Meridiana in 1999. The best time to agree on one is while you’re still talking. The catch: a real strike also presses a firm through annoyed customers, so in past cases firms gave up all their revenue, not just profit.');L.done();}});
  draw('r');L.$('#vt').children[0].classList.add('sel');seen.add('r');}},

{part:2,src:'Chapter 11 · Appendix: Rubinstein Bargaining',
 solve:async L=>{bgSet(L,'#pm',2);},
 run(L){
  let fin=false;
  L.h(L.kick('learn','Explore · the patient side')+'<h1 class="q">Quick offers, no end date. Set how much each side loses per week without a deal.</h1>'+
   '<p class="bg-ill">The book’s appendix (Rubinstein bargaining): with quick offers the pie splits in the ratio of waiting costs, so a side twice as impatient gets one-third. The weekly losses here are illustrative.</p>'+
   '<div id="pp"></div>'+bgSlider('pu','Union loses per week',1,5,1,1,'1%')+bgSlider('pm','Management loses per week',1,5,1,1,'1%'));
  const P=bgPie(L,L.$('#pp'),{total:100,fmt:PCT,top:'THE WHOLE PIE',bottom:'SHARES SET BY EACH SIDE’S COST OF WAITING',
    lines:c=>({A:[PCT(c.A),'loses '+L.$('#pu').value+'% a week',''],B:[PCT(c.B),'loses '+L.$('#pm').value+'% a week','']}),
    ro:c=>'Union <b>'+PCT(c.A)+'</b> · management <b>'+PCT(c.B)+'</b>'});
  function upd(){const u=+L.$('#pu').value,m=+L.$('#pm').value;L.$('#puv').textContent=u+'%';L.$('#pmv').textContent=m+'%';P.set({share:m/(u+m)});
    if(u!==m&&!fin){fin=true;L.sheet('info','The patient side gets more','With equal patience and quick offers, the split is close to 50:50: making the first offer barely matters. When one side loses twice as much per week, it ends with half as much: one-third against two-thirds. The book’s warning: pressure for quick results is weakness that the other side can exploit.');L.done();}}
  ['#pu','#pm'].forEach(s=>L.$(s).addEventListener('input',upd));upd();}},

{part:2,src:'Chapter 11 · This Will Hurt You More Than It Hurts Me',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Does it raise your share?',['Raises your share','Doesn’t'],[
   ['You get a firm, written offer from elsewhere, and the other side knows it.',0,'A better BATNA, known to them, moves the split your way.'],
   ['You tell them: “I really need this settled by Friday.”',1,'That announces a high cost of waiting. The less patient side gets less.'],
   ['The other side’s busy season starts, so each week without a deal costs them more.',0,'Their cost of waiting rises relative to yours, so the split moves toward you.'],
   ['You repeat your demand, louder, with no alternative behind it.',1,'“Or else what?” Volume isn’t a BATNA.'],
   ['A delay costs you a little and costs them a lot more.',0,'“This will hurt you more than it hurts me”: what counts is your fallback compared with theirs. Use with care: it hurts both.']]);}},

{part:2,src:'Chapter 11 · Case Study: ’Tis Better to Give Than to Receive?',pts:1,run(L){
  L.h(L.kick('pr','A case from the book')+'<h1 class="q">Change the hotel game: only management makes offers, and workers can only say yes or no. If workers care only about money, what does management offer on day one?</h1>');
  L.mc(L.card,['About half, as when offers alternate','About $1 a day: $101 for the whole season','Nothing at all, since workers must accept'],1,
   'Right. Reason back: on the last day workers take $1 over nothing; the day before, $2 beats $1 tomorrow; so on day one, $101 for the season. Making every offer is power. But real workers care about fairness. If they’d refuse anything under $200 of $1,000, management can still keep 80% with a steady 4:1 split. And in a repeated game, an early “no” that costs workers more than it could win shows it’s no bluff.',
   'It’s about $1 a day. Reason back: on the last day workers take $1 over nothing; the day before, $2 beats $1 tomorrow; so $101 for the season. Real workers care about fairness, so management may need a steady 4:1 split instead, still 80% of the profit.');}},

/* ---------- PART 4: MANY ISSUES, REAL LIFE ---------- */
{part:3,src:'Chapter 11 · Simultaneous Bargaining over Many Issues',
 solve:async L=>{L.$('#hc .bg-cd[data-k="w"]').click();L.$('#hc .bg-cd[data-k="h"]').click();},
 run(L){
  let fin=false;
  L.h(L.kick('learn','Trade issues')+'<h1 class="q">The company can spend $1,500 a year more on each worker. Wages or health cover? Tap each.</h1>'+
   '<p class="bg-ill">The book’s numbers: group cover costs the company $1,000 a year; a worker would pay $2,000 on their own.</p><div id="hc"></div>');
  const C=bgCards(L,L.$('#hc'),{single:true,unit:40,axisLab:'per worker, a year',empty:'Tap a card: the bars show who gains and who pays.',nA:'Workers',nB:'Company',cA:'--h2',cB:'--h3',fmt:v=>(v<0?'−':'+')+'$'+NF(Math.abs(v)*1000),
    cards:[{id:'w',t:'$1,500 more in wages',a:1.5,b:-1.5},{id:'h',t:'Group health cover',a:2,b:-1}],
    onChange:api=>{if(api.st.ever.size===2&&!fin){fin=true;L.sheet('info','Different values make the pie bigger','Wages are a pure transfer: what the company pays, workers get. Health cover costs the company $1,000 but is worth $2,000 to a worker, so both prefer it to $1,500 in wages. Put all the issues in one pot and trade what each side values differently. The book notes broad trade talks have done better than narrow ones.');L.done();}}});}},

{part:3,src:'Chapter 11 · Simultaneous Bargaining over Many Issues',pts:1,
 solve:async L=>{L.$('#tc .bg-cd[data-k="rem"]').click();L.$('#tc .bg-cd[data-k="trn"]').click();L.$('#tl').click();},
 run(L){
  let fin=false,touched=false;
  L.h(L.kick('pr','Challenge · build a package')+'<h1 class="q">Find a package where Tali gains more than a plain £3k raise and it costs Greer less.</h1>'+
   '<p class="bg-ill">Illustrative values, £k a year.</p><div id="tc"></div><div id="tw"></div>'+
   '<div class="bg-ctl"><button class="btn pri" id="tl">'+L.ic('check')+'Offer this package</button></div>');
  const C=bgCards(L,L.$('#tc'),{unit:15,ghostLab:'dashed = plain £3k raise',empty:'Tap cards to build a package. Goal: Tali’s bar longer than its dashed box, Greer’s shorter.',nA:'Tali',nB:'Greer',cA:'--h2',cB:'--h3',fmt:v=>(v<0?'−':'+')+'£'+(Math.round(Math.abs(v)*10)/10)+'k',base:{a:3,b:-3},
    cards:[{id:'p3',t:'Pay rise £3k',a:3,b:-3},{id:'p15',t:'Pay rise £1.5k',a:1.5,b:-1.5},{id:'rem',t:'One remote day a week',a:2.5,b:-.5},{id:'trn',t:'Training budget £1k',a:2,b:-1},
      {id:'ttl',t:'Title: senior lead',a:1,b:-.2},{id:'fri',t:'Tali covers Greer’s Friday calls',a:-1,b:2},{id:'thr',t:'“No raise, no help on the council bid”',a:0,b:0,thr:true}],
    ro:t=>{const ok=t.a>=3&&t.b>-3&&!t.thr;return 'Tali <b>'+(t.a>=0?'+':'−')+'£'+Math.abs(t.a)+'k</b> · Greer <b>'+(t.b>=0?'+':'−')+'£'+Math.abs(t.b)+'k</b> · '+(t.thr?'<b style="color:var(--no)">a threat is linked</b>':ok?'<b style="color:var(--ok)">both beat the plain raise</b>':'goal not met yet');},
    onChange:api=>{const t=api.tot();L.$('#tw').innerHTML='';if(t.thr){touched=true;L.fb(L.$('#tw'),'Linking issues can also create threats. Greer would insist the council bid is discussed separately, and trust drops. The book’s example: a country tying trade talks to its military support.','no');}}});
  L.$('#tl').onclick=()=>{if(fin)return;fin=true;const t=C.tot(),ok=t.a>=3&&t.b>-3&&!t.thr;L.award(ok);
    L.sheet(ok?'ok':'no',ok?'A package where both gain':'Look for items worth more to Tali than they cost Greer',
      (ok?'':'Your package: Tali '+t.a+', Greer '+t.b+(t.thr?', with a linked threat':'')+'. ')+'A remote day and a training budget give Tali £4.5k of value for £1.5k of Greer’s money. That’s only possible because each side values the items differently: a pay rise is a pure transfer, a remote day isn’t.'+(touched&&ok?' And you dropped the linked threat: good.':''));L.done();};}},

{part:3,src:'Course application · built on Chapter 11',pts:1,
 solve:async L=>{for(let k=0;k<5;k++){L.$('#ob').click();await L.sleep(10);}L.$('#oq [data-k="mid"]').click();L.$('#ol').click();},
 run(L){
  let s=0,fin=false,pick=null;
  L.h(L.kick('pr','One-minute move')+'<h1 class="q">The landlord wants a 10% rise at renewal: £12,000 a year to £13,200. Run the move with Tali.</h1>'+
   L.note('How this course applies the book: a one-minute routine built only from this chapter’s ideas. Illustrative numbers.','compass')+
   '<div class="bg-steps" id="osp"><span>1<br>BATNAs</span><span>2<br>Real pie</span><span>3<br>Waiting</span><span>4<br>Improve</span><span>5<br>Trade</span><span>6<br>Split</span></div>'+
   '<div id="od"></div><div class="bg-say" id="osay" aria-live="polite"></div><div class="bg-ctl"><button class="btn pri" id="ob">'+L.ic('arrow')+'Next</button></div>'+
   '<div id="oc" hidden><span class="bg-lab">Tap a counter-offer to see the split</span><div class="bg-chips" id="oq"></div><div class="bg-ctl"><button class="btn pri" id="ol" disabled>'+L.ic('check')+'Make this counter-offer</button></div></div>');
  const LO=11500,HI=13800;
  const R=bgRange(L.$('#od'),{lo:LO,hi:HI,fmt:GBP,loName:'LANDLORD’S FLOOR',hiName:'TALI’S LIMIT',loCol:'--h3',hiCol:'--h2'});
  const OPT={lo:[12000,'“£12,000 or I leave”'],mid:[12650,'£12,650: half each'],hi:[13200,'Accept £13,200']};
  const T=[['STEP 1 · BOTH BATNAs','Tali’s: the next-best flat at £12,600 plus about £1,200 to move, so staying is worth up to £13,800. The landlord’s: re-let after an empty month and an agent’s fee, about £11,500.'],
   ['STEP 2 · THE REAL PIE','£13,800 − £11,500 = £2,300 a year. Any rent in that range beats no deal for both. Its middle is £12,650.'],
   ['STEP 3 · WHO LOSES MORE FROM WAITING?','An empty month costs the landlord about £1,100. Renewal is two months away, so Tali has time. Tali’s dread of moving is real, but it shouldn’t rush a yes.'],
   ['STEP 4 · IMPROVE YOUR BATNA, THEN SHOW IT','Tali views two flats this week. The limit stops being a claim: mentioned calmly, it makes Tali’s walk-away believable.'],
   ['STEP 5 · TRADE ISSUES','A two-year tenancy: the landlord avoids empty months, Tali gets a steady rent. It adds value for both on top of the rent. We don’t price it here.'],
   ['STEP 6 · SPLIT THE REAL PIE','Which counter-offer should Tali make? Tap one to see who gains what.']];
  function view(){const v=pick?OPT[pick][0]:null;
    R.set({gap:s>=1,mid:s>=1&&s<5,at:s===5?v:null,
      pins:s===5?Object.keys(OPT).map(k=>({v:OPT[k][0],label:GBP(OPT[k][0]),sel:pick===k})):s<1?[{v:12000,label:'now'},{v:13200,label:'asked'}]:[],
      solidHi:s>=3,hiSub:s>=3?'backed by 2 viewings':'not shown yet',loSub:'after an empty month',
      note:s===2?'Each empty month costs the landlord about £1,100':s===4?'+ two-year tenancy: a plus for both, not priced here':'',
      ro:v!=null&&s===5?'Rent <b>'+GBP(v)+'</b> · landlord <b>+'+GBP(v-LO)+'</b> over its floor · Tali <b>+'+GBP(HI-v)+'</b> vs moving':
        s>=1?'Real pie <b>£2,300</b> · its middle <b>£12,650</b>':'Landlord’s floor <b>£11,500</b> · Tali’s limit <b>£13,800</b>'});}
  function go(n){s=n;L.$$('#osp span').forEach((p,j)=>p.className=j<n?'dn':j===n?'cur':'');L.$('#osay').innerHTML='<b>'+T[n][0]+'</b>'+T[n][1];
    if(n===5){L.$('#ob').parentNode.hidden=true;L.$('#oc').hidden=false;}view();}
  bgChips(L,L.$('#oq'),Object.keys(OPT).map(k=>[k,OPT[k][1]]),k=>{if(fin)return;pick=k;L.$('#ol').disabled=false;view();});
  L.$('#ol').onclick=()=>{if(fin||!pick)return;fin=true;const ok=pick==='mid';L.award(ok);L.$('#ol').disabled=true;L.$$('#osp span').forEach(p=>p.className='dn');
    L.sheet(ok?'ok':'no',ok?'Half the real pie each':'Half the real pie is £12,650','£12,650 gives each side £1,150 more than its BATNA: a 5.4% rise instead of 10%. Both can see why it’s fair, which makes it a natural focal point. The two-year tenancy is a sweetener on top: it helps both but doesn’t change the number. “£12,000 or I leave” is a threat Tali wouldn’t carry out, since moving costs Tali more. Accepting £13,200 hands the landlord £1,700 of the £2,300.');L.done();};
  L.$('#ob').onclick=()=>{if(s<5)go(s+1);};go(0);}},

{part:3,src:'Chapter 11 · Brinkmanship and Strikes',
 solve:async L=>{L.$$('#lp button').forEach(b=>b.click());},
 run(L){
  let fin=false;const seen=new Set();
  L.h(L.kick('ex','Edge cases and limits')+'<h1 class="q">Where does “bargain from your BATNA” stop working? Try each case.</h1>'+
   '<div class="bg-chips" id="lp"></div><div id="lv"></div><div id="lf"></div>');
  const base={total:1000,a:300,b:500,share:.5,nA:'Union',nB:'Management',fmt:D$,no:false,top:null,topCol:null,bottom:null,botCol:null,lines:null,ro:null,crack:false,link:false,stage:3,scale:1};
  const P=bgPie(L,L.$('#lv'),base);
  const PR=[
   ['Pride',{a:0,b:0,share:.9,nA:'You',nB:'Them',no:true,top:'THEY SAY NO',topCol:'--no',bottom:'YOU OFFER THEM 10%: BOTH GET NOTHING',lines:()=>({A:['$0','asked 90%',''],B:['$0','refused','']}),ro:()=>'Offer 90:10 · refused · both get <b>$0</b>'},
    'The book’s taxi story: one of the authors haggled over a small fare at the hotel door, and the outraged driver drove them straight back to where they started. In ultimatum experiments, offers giving the other side under 20% are refused about half the time.',
    'Don’t squeeze over small sums: offer a split they can accept with their pride intact. The book’s own moral: when being cheated costs you only small change, letting it go can be the smarter move.','book'],
   ['One side makes every offer',{a:0,b:0,share:.2,top:'4:1 EVERY DAY',bottom:'MANAGEMENT MAKES EVERY OFFER',lines:()=>({A:['$200','a day',''],B:['$800','a day','']})},
    'The power to make every offer is worth a lot: management can keep 80% if workers would rather take $200 than nothing. Theory says even more, but people’s sense of fairness sets a floor.',
    'Making the offers? Stay above their fairness floor. Receiving them, in a repeated game? An early “no” to a lopsided offer shows you’re not bluffing, but it costs you that round.','book'],
   ['Brinkmanship',{crack:true,top:'BREAKDOWN RISK',topCol:'--no',bottom:'TENSION RISES WITH EACH DAY OF TALKS'},
    'A rising risk of breakdown can win a better split for the side that fears a breakdown less. But sometimes both go over the edge: strikes take on a life of their own and last surprisingly long, regretted by both.',
    'Keep the threat small enough to believe (“one more day”, not “never”), and agree in advance, while still talking, on a virtual strike: the pressure stays, the waste goes.','book'],
   ['Linking a threat',{link:true,top:'LINKED THREAT',topCol:'--no',bottom:'ONE GAME USED TO THREATEN IN ANOTHER',botCol:'--no'},
    'Putting issues together can grow the pie, but it also lets one side threaten in one game to win in another. The threatened side will insist on separate talks, and trust suffers.',
    'Split the issues: keep trading items each side values differently, and move the threat-bearing issue to separate talks, as the book’s threatened side insists.','book'],
   ['No real pie',{a:600,b:500,top:'NOTHING TO SPLIT',bottom:'FALLBACKS ADD UP TO MORE THAN $1,000'},
    'If both BATNAs add up to more than a deal is worth, there is nothing to split: any deal leaves one side worse off than walking away.',
    'Look for a trade that adds value before you split anything; if none exists, take your BATNA calmly and keep the relationship.','course']];
  PR.forEach((p,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=p[0];
    b.onclick=()=>{[...L.$('#lp').children].forEach((x,q)=>x.classList.toggle('sel',q===j));P.set(Object.assign({},base,p[1]));L.$('#lf').innerHTML='';L.fb(L.$('#lf'),'<b>Where it stops.</b> '+p[2],'info');L.fb(L.$('#lf'),'<b>Next move'+(p[4]==='course'?' (how this course applies the book)':' (from the book)')+'.</b> '+p[3],'ok');seen.add(j);
      if(seen.size===PR.length&&!fin){fin=true;L.sheet('info','Know where the tool stops','The BATNA pie assumes cool heads and numbers both sides can see. Pride, lopsided splits, real breakdowns and linked threats all break it. When one bites: don’t squeeze, keep threats small, talk about threats separately, and if there’s no pie, walk away calmly.');L.done();}};
    L.$('#lp').appendChild(b);});}},

{part:3,src:'Chapter 11 · Measuring the Pie',
 solve:async L=>{['sq','ev','tr'].forEach(k=>L.$('#gc [data-k="'+k+'"]').click());},
 run(L){
  let fin=false;const seen=new Set();
  L.h(L.kick('learn','Where cooperation wins')+'<h1 class="q">Tali now has the firm £52k offer. Three ways to settle with Greer: compare them.</h1>'+
   '<p class="bg-ill">Illustrative numbers, £k a year, as in the pay-talk challenge.</p><div class="bg-chips" id="gc"></div><div id="gp"></div><p class="bg-cap" id="gcap"></p>');
  const P=bgPie(L,L.$('#gp'),{total:80,a:52,b:20,nA:'Tali',nB:'Greer',fmt:KP});
  const S={sq:[{total:80,share:.9,scale:1,bottom:'TALI TAKES 90% OF THE REAL PIE'},'Tali £59.2k, Greer £20.8k: barely above Greer’s BATNA. Greer may refuse out of pride, like the book’s taxi driver. And next year’s pay talk is a repeat round, where the book shows a squeezed side can play tough to teach a lesson.'],
    ev:[{total:80,share:.5,scale:1,bottom:'HALF THE REAL PIE EACH'},'Tali £56k, Greer £24k. Each gets its alternative plus half of what the deal adds. Both can see it’s fair, so it settles fast: a natural '+L.g('focal-point','focal point')+'.'],
    tr:[{total:83,share:.5,scale:1.06,bottom:'REMOTE DAY + TRAINING: THE PIE GROWS'},'Add items worth more to Tali than they cost Plover, and the real pie grows to £11k. Split evenly, Tali’s side gets £57.5k in pay and perks and Greer keeps £25.5k: both beat the plain even split.']};
  bgChips(L,L.$('#gc'),[['sq','Squeeze'],['ev','Split evenly'],['tr','Trade, then split']],k=>{P.set(S[k][0]);L.$('#gcap').innerHTML=S[k][1];seen.add(k);
    if(seen.size===3&&!fin){fin=true;L.sheet('info','Fair is strategic','The book splits the real pie evenly when both sides are equally needed and equally patient, and warns that pride can sink a lopsided deal. Trading what each side values differently grows the pie. How this course applies the book: with someone you’ll bargain with again, start from the fair split and the bigger pie.');L.done();}});
  L.$('#gcap').textContent='Tap a way to settle.';}},

{part:3,src:'Course application · built on Chapter 11',
 solve:async L=>{L.$('#y1').value='A used bike from a neighbour';L.$('#y2').value='300';L.$('#y3').value='220';L.$('#y4').value='I collect it this weekend';['#y1','#y2','#y3','#y4'].forEach(s=>L.$(s).dispatchEvent(new Event('input',{bubbles:true})));L.$('#yb').click();},
 run(L){
  let role='pay',drawn=false,R=null;
  L.h(L.kick('pr','Your turn · ungraded')+'<h1 class="q">One thing you’ll split or price this month. Draw your real pie.</h1>'+
   L.note('How this course applies the book: the one-minute move on your own week. Use rough numbers; a guess is fine.','compass')+
   '<label class="bg-fl" for="y1">1 · WHAT WILL YOU SPLIT OR AGREE A PRICE FOR?</label><input class="bg-in" id="y1" maxlength="70" placeholder="e.g. a freelance fee, a used bike">'+
   '<span class="bg-fl">2 · YOUR SIDE</span><div class="bg-chips" id="yr" style="justify-content:flex-start"></div>'+
   '<label class="bg-fl" for="y2" id="y2l"></label><input class="bg-in" id="y2" inputmode="decimal" maxlength="12" placeholder="">'+
   '<label class="bg-fl" for="y3" id="y3l"></label><input class="bg-in" id="y3" inputmode="decimal" maxlength="12" placeholder="">'+
   '<label class="bg-fl" for="y4">5 · ONE ISSUE TO TRADE</label><input class="bg-in" id="y4" maxlength="70" placeholder="e.g. a later deadline, collecting it myself">'+
   '<div class="bg-ctl"><button class="btn pri" id="yb" disabled>'+L.ic('scale')+'Draw my real pie</button></div><div id="yo"></div>');
  const v=s=>L.$(s).value.trim(),num=s=>{const n=parseFloat(v(s).replace(/[^0-9.]/g,''));return isFinite(n)&&n>0?n:null;};
  const F=x=>NF(x);
  function labels(){const pay=role==='pay';
    L.$('#y2l').textContent=pay?'3 · THE MOST I’D PAY (MY BATNA SETS IT)':'3 · THE LEAST I’D TAKE (MY BATNA SETS IT)';
    L.$('#y3l').textContent=pay?'4 · THE LEAST THEY’D TAKE (MY BEST GUESS)':'4 · THE MOST THEY’D PAY (MY BEST GUESS)';
    L.$('#y2').placeholder=pay?'e.g. 300: the shop price for the same bike':'e.g. 300: what another client pays a day';
    L.$('#y3').placeholder=pay?'e.g. 220: what they’d get selling it online':'e.g. 400: what a rival would charge them';}
  function paint(){const me=num('#y2'),them=num('#y3');if(me==null||them==null)return;const pay=role==='pay';
    const lo=pay?them:me,hi=pay?me:them;
    if(!R){L.$('#yo').innerHTML='<div id="yr2"></div><div class="bg-one" id="ys"></div><div class="bg-one" id="yt" style="margin-top:6px"></div>';R=bgRange(L.$('#yr2'),{});}
    Object.assign(R.o,{lo,hi,fmt:F,loName:pay?'THEIR FLOOR (GUESS)':'MY FLOOR',hiName:pay?'MY LIMIT':'THEIR LIMIT (GUESS)',loCol:pay?'--h3':'--h2',hiCol:pay?'--h2':'--h3'});
    const ok=hi>lo,mid=(lo+hi)/2;
    R.set({gap:true,mid:ok,ro:ok?'Real pie <b>'+F(hi-lo)+'</b> · an even split lands near <b>'+F(mid)+'</b>':'<b>No real pie</b>: their limit is past yours, so any deal leaves one of you worse off than walking away. Look for a trade that adds value, or take your BATNA calmly.'});
    L.$('#ys').innerHTML='<b>SPLITTING</b>'+L.esc(v('#y1'));L.$('#yt').innerHTML='<b>TO TRADE, ON TOP</b>'+L.esc(v('#y4'));}
  bgChips(L,L.$('#yr'),[['pay','I’m paying'],['get','I’m being paid']],k=>{role=k;labels();if(drawn)paint();});
  L.$('#yr').children[0].classList.add('sel');labels();
  const chk=()=>{L.$('#yb').disabled=!(v('#y1').length>1&&v('#y4').length>1&&num('#y2')!=null&&num('#y3')!=null);if(drawn)paint();};
  ['#y1','#y2','#y3','#y4'].forEach(s=>L.$(s).addEventListener('input',chk));
  L.$('#yb').onclick=()=>{if(L.$('#yb').disabled)return;const first=!drawn;drawn=true;paint();
