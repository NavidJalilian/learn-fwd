/* ===== This lesson’s own visuals: the penalty goal with its kick-history strip, the two-line mix

(function(){const st=document.createElement('style');st.textContent=`

/* ---------- the penalty game (book numbers where stated; Tali’s numbers illustrative) ----------
   LL = kick left, keeper dives left … the number is the kicker’s % chance of scoring. */
const MXP={
  BOOK:{LL:58,LR:95,RL:93,RR:70,tag:'The book’s numbers: top-league penalties, 1995–2000'},
  TALI:{LL:50,LR:90,RL:85,RR:65,tag:'Illustrative numbers · Tali vs the rival keeper'},
  BETTER:{LL:58,LR:95,RL:93,RR:60,tag:'The book’s example: the keeper gets better on the right'},
  WEAK:{LL:30,LR:60,RL:93,RR:70,tag:'Illustrative numbers · a kicker with a weak left side'}};
const mxL=(P,x)=>P.LL*x+P.RL*(1-x);      /* scoring vs a keeper diving left, kicking left a share x */
const mxR=(P,x)=>P.LR*x+P.RR*(1-x);      /* … vs a keeper diving right */
const mxF=(P,x)=>Math.min(mxL(P,x),mxR(P,x));
function mxBest(P){const d=(P.RL-P.RR)+(P.LR-P.LL),c=[0,1];if(d){const x=(P.RL-P.RR)/d;if(x>0&&x<1)c.push(x);}
  let b=c[0];c.forEach(x=>{if(mxF(P,x)>mxF(P,b)+1e-9)b=x;});return {x:b,v:mxF(P,b)};}
function mxKeep(P){const d=(P.LR-P.RR)+(P.RL-P.LL);const y=d?(P.LR-P.RR)/d:.5;return Math.max(0,Math.min(1,y));}
const mxPc=v=>(Math.round(v*10)/10).toFixed(1)+'%';
function mxRng(seed){let a=seed>>>0;return ()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
/* the keeper who studies your pattern: what followed your last two kicks before? if nothing,
   bet that you switch (people trying to look random switch too often) */
function mxRead(h){const n=h.length;if(!n)return 'R';const last=h[n-1],sw=last==='L'?'R':'L';
  if(n>=3){const c=h[n-2]+last,a={L:0,R:0};for(let i=2;i<n;i++)if(h[i-2]+h[i-1]===c)a[h[i]]++;if(a.L!==a.R)return a.L>a.R?'L':'R';}
  let s=0;for(let i=1;i<n;i++)if(h[i]!==h[i-1])s++;return (n<2||s/(n-1)>=.5)?sw:last;}

/* ---------- the goal ---------- */
function mxGoalArt(){
  let s='<rect width="320" height="136" rx="14" fill="var(--soft)"/><rect x="50" y="14" width="110" height="82" fill="var(--h1)" opacity=".08"/><rect x="160" y="14" width="110" height="82" fill="var(--h2)" opacity=".08"/>';
  for(let x=62;x<270;x+=12)s+='<path d="M'+x+' 14V96" stroke="var(--line2)" stroke-width="1" opacity=".7"/>';
  for(let y=26;y<96;y+=12)s+='<path d="M50 '+y+'H270" stroke="var(--line2)" stroke-width="1" opacity=".7"/>';
  s+='<path d="M14 97H306" stroke="var(--line2)" stroke-width="2"/><path d="M50 97V14H270V97" fill="none" stroke="var(--ink)" stroke-width="4" stroke-linejoin="round"/>';
  s+='<text x="105" y="113" text-anchor="middle" font-size="12" font-weight="700" fill="var(--h1)">LEFT</text><text x="215" y="113" text-anchor="middle" font-size="12" font-weight="700" fill="var(--h2)">RIGHT · natural side</text>';
  s+='<ellipse cx="160" cy="128" rx="7" ry="2.5" fill="var(--line2)"/>';
  s+='<g class="mx-kp" style="transform:translate(160px,96px)"><path d="M-4 -14L-8 0M4 -14L8 0" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/><rect x="-8" y="-37" width="16" height="24" rx="5" fill="var(--h4)"/>'+
    '<path d="M-7 -33L-19 -47M7 -33L19 -47" stroke="var(--h4)" stroke-width="4.5" stroke-linecap="round"/><circle cx="-19" cy="-47" r="3.4" fill="var(--h3)"/><circle cx="19" cy="-47" r="3.4" fill="var(--h3)"/><circle cy="-44" r="6" fill="var(--card)" stroke="var(--ink)" stroke-width="1.5"/></g>';
  s+='<g class="mx-ball" style="transform:translate(160px,124px)"><circle r="6.5" fill="var(--card)" stroke="var(--ink)" stroke-width="1.6"/><path d="M-2.4-1.6l2.4-1.6 2.4 1.6-.9 2.6h-3z" fill="var(--ink)"/></g>';
  s+='<g class="mx-badge" opacity="0"><rect x="122" y="20" width="76" height="22" rx="11" fill="var(--ok-strong)"/><text x="160" y="35" text-anchor="middle" font-size="12" font-weight="700" fill="var(--card)">GOAL</text></g>';
  return s;}
function mxGoal(L,host,o){
  o=Object.assign({P:MXP.BOOK,keeper:'reader',x:.5,seed:0,strip:true,legend:true},o||{});
  const rng=o.seed?mxRng(o.seed):Math.random;
  const w=document.createElement('div');host.appendChild(w);
  w.innerHTML='<svg class="mx-svg" viewBox="0 0 320 136" role="img" aria-label="A goal seen from behind the penalty spot: the left half, the right half (the kicker’s natural side), a keeper in the middle and the ball on the spot">'+mxGoalArt()+'</svg>'+
    (o.strip?'<div class="mx-strip" aria-label="Kick history"></div>'+(o.legend?'<p class="mx-leg"><span class="mx-tok L">L</span> left · <span class="mx-tok R">R</span> right · <span class="mx-tok L rd">L</span> ringed: the keeper guessed it · faded: no goal</p>':''):'');
  const svg=w.querySelector('svg'),kp=svg.querySelector('.mx-kp'),ball=svg.querySelector('.mx-ball'),bd=svg.querySelector('.mx-badge'),strip=w.querySelector('.mx-strip');
  let tm=0;
  const api={w,hist:[],res:[],P:o.P,x:o.x,keeper:o.keeper,shown:0};
  function pose(k,d,out){
    kp.style.transform='translate('+(d==='L'?116:d==='R'?204:160)+'px,96px) rotate('+(d==='L'?-50:d==='R'?50:0)+'deg)';
    let bx=160,by=124;
    if(k){if(out==='goal'){bx=k==='L'?82:238;by=34;}else if(out==='saved'){bx=k==='L'?78:242;by=72;}else{bx=k==='L'?34:286;by=7;}}
    ball.style.transform='translate('+bx+'px,'+by+'px)';
    if(out){bd.setAttribute('opacity',1);bd.querySelector('rect').setAttribute('fill','var('+(out==='goal'?'--ok-strong':'--no-strong')+')');bd.querySelector('text').textContent=out==='goal'?'GOAL':out==='saved'?'SAVED':'WIDE';}
    else bd.setAttribute('opacity',0);}
  function play(r){[kp,ball].forEach(e=>e.style.transition='none');pose();void svg.getBoundingClientRect();[kp,ball].forEach(e=>e.style.transition='');
    requestAnimationFrame(()=>pose(r.k,r.d,r.out));}
  function drawStrip(){if(!strip)return;const from=Math.max(0,api.shown-20);
    strip.innerHTML=api.res.slice(from,api.shown).map(r=>'<span class="mx-tok '+r.k+(r.d===r.k?' rd':'')+(r.out==='goal'?'':' ms')+'">'+r.k+'</span>').join('');}
  api.dive=()=>{if(api.keeper==='reader')return mxRead(api.hist);
    if(api.keeper==='knows'){const a=mxL(api.P,api.x),b=mxR(api.P,api.x);if(a<b-.01)return 'L';if(b<a-.01)return 'R';return rng()<mxKeep(api.P)?'L':'R';}
    return api.keeper;};
  api.kick=(k,anim)=>{const d=api.dive(),p=api.P[k+d],g=rng()*100<p,r={k,d,p,out:g?'goal':(d===k?'saved':'wide')};
    api.hist.push(k);api.res.push(r);if(anim!==false){api.shown=api.res.length;drawStrip();play(r);}return r;};
  api.stats=(from)=>{const rs=api.res.slice(from||0);return {n:rs.length,read:rs.filter(r=>r.d===r.k).length,goals:rs.filter(r=>r.out==='goal').length,exp:rs.length?rs.reduce((a,r)=>a+r.p,0)/rs.length:0};};
  api.reset=()=>{clearTimeout(tm);api.hist=[];api.res=[];api.shown=0;drawStrip();pose();};
  api.show=(r)=>{pose(r.k,r.d,r.out);};
  /* run a whole sequence now; reveal it in the strip over ~1 s; cb when shown */
  api.run=(seq,cb)=>{clearTimeout(tm);api.shown=api.res.length;const start=api.res.length;
    seq.forEach(k=>api.kick(typeof k==='function'?k():k,false));
    const end=api.res.length,step=()=>{if(!w.isConnected)return;api.shown++;drawStrip();play(api.res[api.shown-1]);
      if(api.shown<end)tm=setTimeout(step,50);else if(cb)cb(api.stats(start));};
    step();};
  api.finish=()=>{clearTimeout(tm);api.shown=api.res.length;drawStrip();};
  api.rng=rng;
  pose();drawStrip();return api;}

/* ---------- the mix chart: two straight lines and the thick lower (or upper) envelope ---------- */
function mxChart(L,host,o){
  o=Object.assign({P:MXP.BOOK,view:'kicker',x:.5,slider:false,peak:false,marker:true},o||{});
  const w=document.createElement('div');host.appendChild(w);
  w.innerHTML='<svg class="mx-svg" viewBox="0 0 320 226" role="img"></svg>'+
    (o.slider?'<label class="mx-sl"><span class="h"><span>Share of kicks to the left</span><b class="v"></b></span><input type="range" min="0" max="100" step="1"></label>':'')+
    '<p class="mx-ro" aria-live="polite"></p><p class="mx-ill"></p>';
  const svg=w.querySelector('svg'),ro=w.querySelector('.mx-ro'),inp=w.querySelector('input');
  const api={w,P:Object.assign({},o.P),x:o.x,pins:[],peak:o.peak,marker:o.marker,view:o.view,tag:o.P.tag};
  const kv=()=>api.view==='kicker';
  const X0=48,X1=302,Y0=26,Y1=178;
  function lines(){const P=api.P;return kv()?[{f:x=>mxL(P,x),c:'--h1',t:'keeper dives left'},{f:x=>mxR(P,x),c:'--h2',t:'keeper dives right'}]
     :[{f:y=>P.LL*y+P.LR*(1-y),c:'--h1',t:'kicker kicks left'},{f:y=>P.RL*y+P.RR*(1-y),c:'--h2',t:'kicker kicks right'}];}
  const env=x=>{const ls=lines();return kv()?Math.min(ls[0].f(x),ls[1].f(x)):Math.max(ls[0].f(x),ls[1].f(x));};
  api.opt=()=>{if(kv())return mxBest(api.P);const y=mxKeep(api.P);return {x:y,v:env(y)};};
  api.env=env;
  function draw(){
    const ls=lines(),lo=Math.min(40,Math.floor(Math.min(...[0,1].flatMap(x=>ls.map(l=>l.f(x))))/10)*10);
    const sx=x=>X0+(X1-X0)*x,sy=v=>Y1-(Y1-Y0)*(v-lo)/(100-lo);
    let s='<rect width="320" height="226" rx="14" fill="var(--soft)"/>';
    for(let v=lo;v<=100;v+=10)s+='<path d="M'+X0+' '+sy(v).toFixed(1)+'H'+X1+'" stroke="var(--line2)" stroke-width="1" opacity=".6"/><text x="'+(X0-7)+'" y="'+(sy(v)+4).toFixed(1)+'" text-anchor="end" font-size="11.5" fill="var(--muted)">'+v+'%</text>';
    [0,25,50,75,100].forEach(p=>s+='<text x="'+sx(p/100)+'" y="'+(Y1+16)+'" text-anchor="middle" font-size="11.5" fill="var(--muted)">'+p+'%</text>');
    s+='<text x="'+((X0+X1)/2)+'" y="'+(Y1+36)+'" text-anchor="middle" font-size="12" font-weight="600" fill="var(--ink)">'+(kv()?'Share of kicks to the left →':'Keeper’s share of dives to the left →')+'</text>';
    let d='';for(let k=0;k<=100;k++){const x=k/100;d+=(k?'L':'M')+sx(x).toFixed(1)+' '+sy(env(x)).toFixed(1);}
    s+='<path d="'+d+'" fill="none" stroke="var(--h3)" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" opacity=".55"/>';
    ls.forEach(l=>{s+='<path d="M'+sx(0)+' '+sy(l.f(0)).toFixed(1)+'L'+sx(1)+' '+sy(l.f(1)).toFixed(1)+'" stroke="var('+l.c+')" stroke-width="2.5"/>';});
    ls.forEach((l,j)=>{const lx=j?166:10;s+='<path d="M'+lx+' 11h14" stroke="var('+l.c+')" stroke-width="3"/><text x="'+(lx+18)+'" y="15" font-size="11.5" font-weight="700" fill="var('+l.c+')">'+l.t+'</text>';});
    api.pins.forEach(p=>{const v=p[2]!=null?p[2]:env(p[0]);s+='<circle cx="'+sx(p[0])+'" cy="'+sy(v)+'" r="4.5" fill="var(--card)" stroke="var(--ink)" stroke-width="2"/><text x="'+sx(p[0])+'" y="'+(sy(v)+19)+'" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--ink)">'+p[1]+'</text>';});
    if(api.peak){const b=api.opt();s+='<g transform="translate('+sx(b.x).toFixed(1)+','+sy(b.v).toFixed(1)+')"><path d="M0-11l3.2 6.6 7.2.9-5.3 5 1.3 7.2L0 5.3l-6.4 3.4 1.3-7.2-5.3-5 7.2-.9z" fill="var(--h3)" stroke="var(--card)" stroke-width="1.2"/></g>';}
    if(api.marker){const x=api.x,v=env(x),cx=sx(x);
      s+='<path d="M'+cx.toFixed(1)+' '+Y0+'V'+Y1+'" stroke="var(--ink)" stroke-width="1.4" stroke-dasharray="4 4" opacity=".6"/>';
      ls.forEach(l=>{s+='<circle cx="'+cx.toFixed(1)+'" cy="'+sy(l.f(x)).toFixed(1)+'" r="4" fill="var('+l.c+')"/>';});
      const lx=Math.max(X0+26,Math.min(X1-26,cx)),ly=Math.max(14,sy(v)-26);
      s+='<circle cx="'+cx.toFixed(1)+'" cy="'+sy(v).toFixed(1)+'" r="7" fill="var(--ink)" stroke="var(--card)" stroke-width="2"/>'+
        '<rect x="'+(lx-26)+'" y="'+(ly-11)+'" width="52" height="20" rx="10" fill="var(--ink)"/><text x="'+lx+'" y="'+(ly+3.5)+'" text-anchor="middle" font-size="12" font-weight="700" fill="var(--card)">'+mxPc(v)+'</text>';}
    svg.innerHTML=s;
    svg.setAttribute('aria-label',kv()?'Chart: two straight lines show scoring against a keeper diving left and diving right, for every share of kicks to the left; the lower of the two is drawn thick, an upside-down V':'Chart from the keeper’s side: two lines show the kicker’s scoring for every share of keeper dives to the left; the higher of the two is drawn thick, a V');
    const ls2=lines(),a=ls2[0].f(api.x),b=ls2[1].f(api.x),pc=Math.round(api.x*100);
    if(inp){inp.value=pc;w.querySelector('.v').textContent=pc+'% left';}
    if(api.marker)ro.innerHTML=kv()?'Left '+pc+'%, right '+(100-pc)+'% · keeper dives left: '+mxPc(a)+' · dives right: '+mxPc(b)+'<br>A keeper who knows your mix holds you to <b>'+mxPc(Math.min(a,b))+'</b>'
      :'Keeper dives left '+pc+'%, right '+(100-pc)+'% · kicker kicks left: '+mxPc(a)+' · right: '+mxPc(b)+'<br>A kicker who knows this mix gets <b>'+mxPc(Math.max(a,b))+'</b>';
    else ro.innerHTML='';
    w.querySelector('.mx-ill').textContent=api.tag;}
  api.draw=draw;
  api.set=x=>{api.x=Math.max(0,Math.min(1,x));draw();if(o.onX)o.onX(api.x,api);};
  api.say=h=>{ro.innerHTML=h;};
  let tw=0;
  api.anim=(to,ms,cb)=>{clearInterval(tw);const f=api.x,t0=Date.now();tw=setInterval(()=>{if(!w.isConnected){clearInterval(tw);return;}
    const k=Math.min(1,(Date.now()-t0)/ms),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;api.x=f+(to-f)*e;draw();if(k>=1){clearInterval(tw);if(cb)cb();}},30);};
  api.animP=(P2,ms,cb,follow)=>{clearInterval(tw);const P1=Object.assign({},api.P),t0=Date.now();tw=setInterval(()=>{if(!w.isConnected){clearInterval(tw);return;}
    const k=Math.min(1,(Date.now()-t0)/ms);['LL','LR','RL','RR'].forEach(q=>api.P[q]=P1[q]+(P2[q]-P1[q])*k);if(follow)api.x=api.opt().x;draw();if(k>=1){clearInterval(tw);api.tag=P2.tag;draw();if(cb)cb();}},30);};
  if(inp)inp.addEventListener('input',()=>api.set(+inp.value/100));
  draw();return api;}

/* ---------- the watch: an outside device that picks the side ---------- */
function mxWatchArt(n,sec,run){
  const cx=160,cy=92,r=76,pt=(s,rr)=>[cx+rr*Math.sin(s*Math.PI/30),cy-rr*Math.cos(s*Math.PI/30)];
  let s='<rect width="320" height="186" rx="14" fill="var(--soft)"/><circle cx="'+cx+'" cy="'+cy+'" r="'+(r+8)+'" fill="var(--card)" stroke="var(--ink)" stroke-width="3"/>';
  s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="var(--h2-bg)"/>';
  if(n>0&&n<60){const e=pt(n,r);s+='<path d="M'+cx+' '+cy+'L'+cx+' '+(cy-r)+'A'+r+' '+r+' 0 '+(n>30?1:0)+' 1 '+e[0].toFixed(1)+' '+e[1].toFixed(1)+'Z" fill="var(--h1-bg)" stroke="var(--h1)" stroke-width="1.5"/>';}
  else if(n>=60)s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="var(--h1-bg)"/>';
  for(let k=0;k<60;k++){const a=pt(k,r-(k%5?5:10)),b=pt(k,r);s+='<path d="M'+a[0].toFixed(1)+' '+a[1].toFixed(1)+'L'+b[0].toFixed(1)+' '+b[1].toFixed(1)+'" stroke="var(--ink)" stroke-width="'+(k%5?1:2)+'" opacity=".7"/>';}
  [[0,'60'],[15,'15'],[30,'30'],[45,'45']].forEach(q=>{const p=pt(q[0],r-22);s+='<text x="'+p[0].toFixed(1)+'" y="'+(p[1]+4).toFixed(1)+'" text-anchor="middle" font-size="12" font-weight="700" fill="var(--muted)">'+q[1]+'</text>';});
  if(n>0&&n<60){const m=pt(n/2,r*.55);s+='<text x="'+m[0].toFixed(1)+'" y="'+(m[1]+4).toFixed(1)+'" text-anchor="middle" font-size="12" font-weight="700" fill="var(--h1)">LEFT</text>';
    const m2=pt(n+(60-n)/2,r*.55);s+='<text x="'+m2[0].toFixed(1)+'" y="'+(m2[1]+4).toFixed(1)+'" text-anchor="middle" font-size="12" font-weight="700" fill="var(--h2)">RIGHT</text>';}
  if(sec!=null){const h=pt(sec,r-4);s+='<path class="mx-hand" d="M'+cx+' '+cy+'L'+h[0].toFixed(1)+' '+h[1].toFixed(1)+'" stroke="var(--no-strong)" stroke-width="2.5" stroke-linecap="round"/><circle cx="'+cx+'" cy="'+cy+'" r="5" fill="var(--no-strong)"/>';}
  s+='<text x="22" y="30" font-size="11.5" font-weight="700" fill="var(--muted)">'+(run?'SECOND HAND':'STOPPED')+'</text>';
  return s;}

/* ---------- coordination: the hunters’ numbers as an area square ---------- */
function mxSquare(shared){
  const X=18,Y=30,S=160,a=4/7,b=3/7;let s='<rect width="320" height="216" rx="14" fill="var(--soft)"/>';
  const cell=(x,y,w,h,ok,t)=>'<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+h.toFixed(1)+'" fill="var('+(ok?'--ok-bg':'--no-bg')+')" stroke="var(--card)" stroke-width="2"/>'+(t?'<text x="'+(x+w/2).toFixed(1)+'" y="'+(y+h/2+4).toFixed(1)+'" text-anchor="middle" font-size="11.5" font-weight="700" fill="var('+(ok?'--ok':'--no')+')">'+t+'</text>':'');
  if(!shared){s+=cell(X,Y,S*a,S*b,1,'city ✓')+cell(X+S*a,Y,S*(1-a),S*b,0,'apart')+cell(X,Y+S*b,S*a,S*(1-b),0,'apart')+cell(X+S*a,Y+S*b,S*(1-a),S*(1-b),1,'coast ✓');
    s+='<text x="'+(X+S*a/2)+'" y="'+(Y-8)+'" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--h1)">Tali: city 4/7</text><text x="'+(X+S*a+S*(1-a)/2)+'" y="'+(Y-8)+'" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--h1)">coast</text>';
    s+='<text x="'+(X+S+8)+'" y="'+(Y+S*b/2+4)+'" font-size="11.5" font-weight="700" fill="var(--h2)">Juno: city 3/7</text><text x="'+(X+S+8)+'" y="'+(Y+S*b+S*(1-b)/2+4)+'" font-size="11.5" font-weight="700" fill="var(--h2)">Juno: coast</text>';
    s+='<text x="'+(X+S+8)+'" y="'+(Y+S-28)+'" font-size="12" font-weight="700" fill="var(--no)">Apart 25 of 49</text><text x="'+(X+S+8)+'" y="'+(Y+S-12)+'" font-size="12" font-weight="700" fill="var(--ink)">Each: 1.71 on avg</text>';}
  else{s+=cell(X,Y,S,S/2,1,'rain → city together')+cell(X,Y+S/2,S,S/2,1,'dry → coast together');
    s+='<text x="'+(X+S/2)+'" y="'+(Y-8)+'" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--ink)">One shared signal: the weather</text>';
    s+='<text x="'+(X+S+8)+'" y="'+(Y+S-28)+'" font-size="12" font-weight="700" fill="var(--ok)">Apart: never</text><text x="'+(X+S+8)+'" y="'+(Y+S-12)+'" font-size="12" font-weight="700" fill="var(--ink)">Each: 3.5 on avg</text>';}
  return s+'<text x="160" y="'+(Y+S+20)+'" text-anchor="middle" font-size="11.5" fill="var(--muted)">area = how often · the book’s hunters’ numbers</text>';}

  goals:['Use the test question to tell when a pattern will be exploited, and apply the book’s Rule 5',

  glossary:{
   pure:'Pure strategy: one definite move, such as “kick left”. A mixed strategy chooses among pure strategies at random, in set proportions.',

  },
  cheatsheet:[
   '<b>Any pattern gets read.</b> In pure conflict, whatever rule you follow, a sharp opponent works it out and exploits it (Vizzini’s endless circle). Test: would it hurt if they knew your move in advance?',

   '<b>The right proportions</b> leave them nothing to exploit: you score the same whatever they do. The book’s penalties: 38.3% left gives 79.6%; the keeper’s best mix holds the kicker to the same 79.6% (minimax).',
   '<b>Random isn’t alternating.</b> People switch too often. Let an outside device decide: left if the second hand is between 0 and 23 gives 38%.',
   '<b>Get better on one side and it’s used less:</b> when the keeper saves more on the right (70 → 60), kickers go left more (38.3% → 47.1%), the keeper dives right less, and scoring still falls (79.6% → 76.5%).',
   '<b>Checking others:</b> a big enough consequence plus occasional random checks (the book: a $25 fine with a 1-in-25 check). Fixed check days get read.',
   '<b>Don’t mix when you want to match.</b> Two people mixing apart miss each other about half the time; agree a shared signal or take turns. One-off? No pattern to hide.',

{part:0,src:'Chapter 5 · Wit’s End',

 run(L){
  L.h(L.kick('learn','Circles of guessing')+'<h1 class="q">In the film <i>The Princess Bride</i>, Westley poisons one of two goblets. Vizzini tries to reason out which. Follow his thinking.</h1>'+
   '<svg class="mx-svg" id="vzs" viewBox="0 0 320 150" role="img" aria-label="Two goblets on a table, one in front of Westley and one in front of Vizzini"></svg>'+
   '<div class="mx-say" id="vzt" aria-live="polite"></div><div class="mx-ctl"><button class="btn pri" id="vzb">'+L.ic('cycle')+'Next thought</button></div>');
  const cup=(x,on)=>'<g><path d="M'+(x-22)+' 46h44c0 26-10 40-22 40s-22-14-22-40z" fill="var('+(on?'--h3-bg':'--card')+')" stroke="var('+(on?'--h3':'--ink')+')" stroke-width="'+(on?3:2)+'"/><path d="M'+x+' 86v20M'+(x-14)+' 108h28" stroke="var('+(on?'--h3':'--ink')+')" stroke-width="'+(on?3:2)+'" stroke-linecap="round"/><path d="M'+(x-18)+' 54h36" stroke="var(--h4)" stroke-width="5" opacity=".5"/></g>';

    ['THOUGHT 2','But Westley knew I’m no fool, and counted on it. So: not mine either.',1],
    ['THOUGHT 3','But he’d have foreseen that too, so back to…',2],
    ['THOUGHT 4','…and so on. Each step is undone by the next one. The circle never ends.',0]];

    '<text x="90" y="132" text-anchor="middle" font-size="12" font-weight="600" fill="var(--muted)">Westley’s goblet</text><text x="230" y="132" text-anchor="middle" font-size="12" font-weight="600" fill="var(--muted)">Vizzini’s goblet</text>';

    if(loop)s+='<path d="M120 40C140 14 180 14 200 40" fill="none" stroke="var(--h4)" stroke-width="3"/><path d="M196 30l6 12-13-2z" fill="var(--h4)"/><path d="M200 70C180 96 140 96 120 70" fill="none" stroke="var(--h4)" stroke-width="3"/><path d="M124 80l-6-12 13 2z" fill="var(--h4)"/>';
    L.$('#vzs').innerHTML=s;}
  draw(0,false);L.$('#vzt').innerHTML='<b>VIZZINI</b>Tap for his first thought.';
  L.$('#vzb').onclick=()=>{if(k>=T.length)return;const t=T[k++];draw(t[2],k===T.length);L.$('#vzt').innerHTML='<b>'+t[0]+'</b>'+t[1];
    if(k===T.length){L.$('#vzb').hidden=true;L.sheet('info','No pattern survives a thinking opponent','Whatever rule Vizzini picks, Westley can think the same thought one step further. The book draws the lesson: if your choices follow any system, the other side will exploit it, so don’t follow one. (In the film Westley had poisoned both cups. When someone proposes a game, ask: do they know something I don’t?)');L.done();}};}},

{part:0,src:'Chapter 5 · Wit’s End',
 solve:async L=>{for(let k=0;k<10;k++){L.$(k%2?'#tkr':'#tkl').click();await L.sleep(5);}},
 run(L){
  let fin=false;
  L.h(L.kick('learn','Try to be unpredictable')+'<h1 class="q">Take 10 penalties. Tap left or right for each, as randomly as you can. The keeper studies your pattern.</h1><div id="tkg"></div>'+
   '<div class="mx-ctl"><button class="btn" id="tkl" style="color:var(--h1)">'+L.ic('arrow')+'Kick left</button><button class="btn" id="tkr" style="color:var(--h2)">Kick right'+L.ic('arrow')+'</button></div><p class="mx-ro" id="tkro" aria-live="polite">Kick 1 of 10.</p><p class="mx-ill">Scoring chances: the book’s penalty numbers</p>');
  L.$('#tkl').querySelector('svg').style.transform='scaleX(-1)';
  const g=mxGoal(L,L.$('#tkg'),{keeper:'reader'});
  function go(k){if(fin)return;const r=g.kick(k);const s=g.stats();
    L.$('#tkro').innerHTML='Kick '+Math.min(s.n+1,10)+' of 10 · the keeper guessed your side <b>'+s.read+'</b> times · goals: <b>'+s.goals+'</b>';
    if(s.n>=10){fin=true;L.$('#tkro').innerHTML='10 kicks · the keeper guessed your side <b>'+s.read+' of 10</b> · goals: <b>'+s.goals+'</b>';
      let sw=0;for(let i=1;i<10;i++)if(g.hist[i]!==g.hist[i-1])sw++;
      setTimeout(()=>{L.sheet('info',s.read>=6?'The keeper read you '+s.read+' times out of 10':'You hid well this time: '+s.read+' out of 10',
        'You switched sides '+sw+' times in 9 chances. People trying to look random switch too often, so this keeper simply bets on the switch, and on any habit it spots. A keeper who guesses right more often saves more. Willpower makes a poor coin: later you’ll use one that doesn’t depend on you.');L.done();},450);}}
  L.$('#tkl').onclick=()=>go('L');L.$('#tkr').onclick=()=>go('R');}},

{part:0,src:'Chapter 5 · Mixing It Up on the Soccer Field',
 solve:async L=>{for(let k=0;k<4;k++){L.$('#fbb').click();await L.sleep(10);}},
 run(L){
  L.h(L.kick('ex','The book’s penalty table')+'<h1 class="q">The ball reaches the line in about two-tenths of a second, so the keeper must pick a side before seeing the kick. Follow who wants to switch.</h1>'+
   '<svg class="mx-svg" id="fbs" viewBox="0 0 320 246" role="img" aria-label="Four boxes: the kicker kicks left or right, the keeper dives left or right; each box shows the kicker’s chance of scoring"></svg>'+
   '<div class="mx-say" id="fbt" aria-live="polite"></div><div class="mx-ctl"><button class="btn pri" id="fbb">'+L.ic('cycle')+'Who wants to switch?</button></div>');
  const B={LL:[74,30],LR:[198,30],RL:[74,140],RR:[198,140]},V={LL:58,LR:95,RL:93,RR:70};
  function tile(key,on){const [x,y]=B[key],k=key[0],d=key[1];
    let s='<rect x="'+x+'" y="'+y+'" width="116" height="100" rx="12" fill="var('+(on?'--h3-bg':'--card')+')" stroke="var('+(on?'--h3':'--line2')+')" stroke-width="'+(on?3:1.5)+'"/>';
    s+='<path d="M'+(x+18)+' '+(y+44)+'V'+(y+12)+'H'+(x+98)+'V'+(y+44)+'" fill="none" stroke="var(--ink)" stroke-width="2.5"/>';
    const kx=x+58+(d==='L'?-20:20);s+='<path d="M'+(x+58)+' '+(y+44)+'L'+kx+' '+(y+26)+'" stroke="var(--h4)" stroke-width="6" stroke-linecap="round"/><circle cx="'+(x+58+(d==='L'?-22:22))+'" cy="'+(y+23)+'" r="4.5" fill="var(--card)" stroke="var(--ink)" stroke-width="1.5"/>';
    const bx=x+58+(k==='L'?-35:35);s+='<circle cx="'+bx+'" cy="'+(y+18)+'" r="4" fill="var(--ink)"/>';
    s+='<text x="'+(x+58)+'" y="'+(y+74)+'" text-anchor="middle" font-size="22" font-weight="700" fill="var(--ink)">'+V[key]+'%</text><text x="'+(x+58)+'" y="'+(y+91)+'" text-anchor="middle" font-size="11.5" fill="var(--muted)">kicker scores</text>';
    return s;}
  const ARR=[['LL','RL'],['RL','RR'],['RR','LR'],['LR','LL']];
  function arrow(a,b){const A=B[a],Bb=B[b],x1=A[0]+58,y1=A[1]+50,x2=Bb[0]+58,y2=Bb[1]+50;
    let p='',h='';
    if(x1===x2){const xx=x1+(y2>y1?44:-44),ya=y1+(y2>y1?30:-30),yb=y2+(y2>y1?-30:30);p='M'+xx+' '+ya+'L'+xx+' '+yb;h='M'+(xx-6)+' '+(yb+(y2>y1?-8:8))+'L'+xx+' '+yb+'L'+(xx+6)+' '+(yb+(y2>y1?-8:8));}
    else{const yy=y1+(x2>x1?28:-28),xa=x1+(x2>x1?40:-40),xb=x2+(x2>x1?-40:40);p='M'+xa+' '+yy+'L'+xb+' '+yy;h='M'+(xb+(x2>x1?-8:8))+' '+(yy-6)+'L'+xb+' '+yy+'L'+(xb+(x2>x1?-8:8))+' '+(yy+6);}
    return '<path d="'+p+'" stroke="var(--h4)" stroke-width="3.5"/><path d="'+h+'" fill="none" stroke="var(--h4)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>';}
  let k=0;
  function draw(){const cur=k===0?'LL':ARR[k-1][1];let s='<rect width="320" height="246" rx="14" fill="var(--soft)"/>';
    s+='<text x="132" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="var(--h1)">keeper dives LEFT</text><text x="256" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="var(--h2)">dives RIGHT</text>';
    s+='<text x="8" y="76" font-size="12" font-weight="700" fill="var(--h1)">Kick</text><text x="8" y="91" font-size="12" font-weight="700" fill="var(--h1)">LEFT</text><text x="8" y="186" font-size="12" font-weight="700" fill="var(--h2)">Kick</text><text x="8" y="201" font-size="12" font-weight="700" fill="var(--h2)">RIGHT</text>';
    ['LL','LR','RL','RR'].forEach(q=>s+=tile(q,q===cur));
    for(let j=0;j<k;j++)s+=arrow(ARR[j][0],ARR[j][1]);
    L.$('#fbs').innerHTML=s;}
  const T=['Start anywhere: the kicker goes left and the keeper dives left. The kicker scores <b>58%</b> of the time.',
    'The kicker would rather switch to the right: <b>58% → 93%</b>.',
    'Now the keeper would rather dive right: their saves go from 7% to <b>30%</b>.',
    'Now the kicker would rather go left: <b>70% → 95%</b>.',
    'And the keeper would rather dive left: saves from 5% to <b>42%</b>. Back where we started.'];
  draw();L.$('#fbt').innerHTML='<b>THE BOOK’S NUMBERS</b>'+T[0];
  L.$('#fbb').onclick=()=>{if(k>=4)return;k++;draw();L.$('#fbt').innerHTML='<b>SWITCH '+k+' OF 4</b>'+T[k];
    if(k===4){L.$('#fbb').hidden=true;L.sheet('info','No box is a resting place','In every box one side wants to switch, so no pair of plain moves (the book calls them '+L.g('pure','pure strategies')+') is a '+L.g('nash','Nash equilibrium')+'. It’s Vizzini’s circle in numbers. The way out is a new kind of move: a '+L.g('mixed','mixed strategy')+'.');L.done();}};}},

    zsj:['<svg class="mx-svg" viewBox="0 0 320 96" role="img" aria-label="Tali and Juno meet at the same café"><rect width="320" height="96" rx="14" fill="var(--soft)"/>'+
      '<rect x="128" y="22" width="64" height="44" rx="8" fill="var(--h3-bg)" stroke="var(--h3)" stroke-width="2"/><path d="M128 32h64" stroke="var(--h3)" stroke-width="6"/><text x="160" y="58" text-anchor="middle" font-size="12" font-weight="700" fill="var(--h3)">café</text>'+
      '<circle cx="90" cy="44" r="12" fill="var(--h1)"/><text x="90" y="48" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--card)">T</text><circle cx="230" cy="44" r="12" fill="var(--h2)"/><text x="230" y="48" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--card)">J</text>'+
      '<path d="M104 44h18M216 44h-18" stroke="var(--ink)" stroke-width="2.5"/><text x="160" y="86" text-anchor="middle" font-size="12" font-weight="600" fill="var(--ok)">seeing Tali’s choice helps both</text></svg>',
      '<b>No, it helps.</b> They want the same thing: to meet. Being predictable is good here, so there’s nothing to hide and no reason to mix.']};
  ['zsk','zsj'].forEach(id=>L.$('#'+id).onclick=()=>{['zsk','zsj'].forEach(q=>L.$('#'+q).classList.toggle('sel',q===id));L.$('#zsv').innerHTML=V[id][0]+'<p class="mx-cap">'+V[id][1]+'</p>';seen.add(id);
    if(seen.size===2&&!fin){fin=true;L.sheet('info','The test question','Ask: would it hurt if they knew my choice in advance? If yes, you’re in pure conflict and hiding pays: mix. If no, don’t mix: just choose, or make your choice easy to read.');L.done();}});}},

{part:0,src:'Chapter 5 · Theory and Reality',pts:1,run(L){

    ['In a game of pure conflict,','In any game at all,','When you both want the same thing,'],

    ['choose at random in the right proportions.','alternate between your moves.','pick 50:50 every time.']],[0,0,0],
   [['Mixing helps where one side’s gain is the other’s loss. Elsewhere it can cause misses.','When you both want the same thing, being predictable helps you meet.'],

{part:1,src:'Chapter 5 · Mixing It Up on the Soccer Field',pts:1,

    b.onclick=()=>{if(a)return;a=true;const ok=j===1;L.award(ok);b.classList.add(ok?'ok':'no');if(!ok)L.$$('#pdo .opt')[1].classList.add('ok');L.$$('#pdo .opt').forEach(x=>x.setAttribute('aria-disabled','true'));
      c.marker=true;c.set(0);c.pins=[[0,'70']];

{part:1,src:'Chapter 5 · How to Find Mixed Strategy Equilibria',
 solve:async L=>{const i=L.$('#exc input');for(const v of [100,0,40]){i.value=v;i.dispatchEvent(new Event('input',{bubbles:true}));await L.sleep(10);}L.$('#exk').click();await L.sleep(1100);},
 run(L){
  let end=false,mid=false,fin=false;
  L.h(L.kick('learn','Explore the mix chart')+'<h1 class="q">Drag the slider from all-right to all-left. The thick line is what a keeper who knows your mix holds you to.</h1><div id="exg"></div><div id="exc"></div>'+
   '<div class="mx-ctl"><button class="btn" id="exk">'+L.ic('play')+'Take 10 kicks (a coin picks)</button></div>');
  const g=mxGoal(L,L.$('#exg'),{keeper:'knows',legend:false,seed:11});
  const c=mxChart(L,L.$('#exc'),{slider:true,x:.7,onX(x){g.x=x;if(x<=.05||x>=.95)end=true;if(x>=.25&&x<=.6)mid=true;chk();}});
  g.x=c.x;
  function chk(){if(end&&mid&&!fin){fin=true;L.sheet('info','An upside-down V','At either end the keeper simply covers your side. In between, the keeper can only pick the lower line, and the lower line is highest where the two lines cross. That peak is your best mix.');L.done();}}
  L.$('#exk').onclick=()=>{g.reset();g.run(Array.from({length:10},()=>()=>g.rng()<c.x?'L':'R'),s=>{const nl=g.hist.filter(k=>k==='L').length;
    c.say('10 kicks at '+Math.round(c.x*100)+'% left: <b>'+s.goals+' goals</b>. The keeper dove '+(g.res.every(r=>r.d===g.res[0].d)?'<b>'+(g.res[0].d==='L'?'left':'right')+'</b> every time':'both ways')+'. Over many kicks expect <b>'+mxPc(mxF(c.P,c.x))+'</b>.');});};}},

{part:1,src:'Chapter 5 · Mixing It Up on the Soccer Field',
 solve:async L=>{L.$('#mmk').click();L.$('#mmg').click();},
 run(L){
  const seen=new Set();let fin=false;
  L.h(L.kick('learn','The peak, from both sides')+'<h1 class="q">The kicker’s best mix sits at the top of the upside-down V. Now look from the keeper’s side.</h1>'+
   '<div class="mx-ctl"><button class="chip sel" id="mmk">Kicker’s best mix</button><button class="chip" id="mmg">Keeper’s best mix</button></div><div id="mmc"></div><p class="mx-cap" id="mmt"></p>');
  const T={mmk:['kicker','Kick left <b>38.3%</b> of the time: you score <b>79.6%</b> whichever way the keeper dives. Nothing is left to exploit.',23/60],
    mmg:['keeper','Dive left <b>41.7%</b>, right 58.3%: the kicker scores <b>79.6%</b> whichever way they kick. The keeper’s line is a V, and they take its bottom.',25/60]};
  function show(id){L.$('#mmc').innerHTML='';const c=mxChart(L,L.$('#mmc'),{view:T[id][0],x:T[id][2],peak:true});L.$('#mmt').innerHTML=T[id][1];
    ['mmk','mmg'].forEach(q=>L.$('#'+q).classList.toggle('sel',q===id));seen.add(id);
    if(seen.size===2&&!fin){fin=true;L.sheet('info','Both best mixes meet at 79.6%','That’s no coincidence. It’s John von Neumann’s '+L.g('minimax','minimax theorem')+', which he later built on with Oscar Morgenstern in the book that launched game theory: in pure conflict, what one side can guarantee equals what the other can hold it to. Each mix is the best reply to the other: a Nash equilibrium in mixed strategies.');L.done();}}
  show('mmk');L.$('#mmk').onclick=()=>show('mmk');L.$('#mmg').onclick=()=>show('mmg');}},

{part:1,src:'Chapter 5 · How to Act Randomly',pts:1,run(L){
  L.h(L.kick('pr','Practice')+'<h1 class="q">The rival keeper has learned their best mix. Tali reasons: “Then I score the same whichever way I kick, so I’ll just kick right every time.” What happens next?</h1>');
  L.mc(L.card,['The keeper notices, dives right more, and Tali’s scoring falls','Nothing: the keeper’s mix protects Tali’s scoring for good','Tali scores more, since right is the natural side'],0,
   'The book’s point: the keeper only keeps mixing because Tali does. Once Tali sticks to one side, the keeper covers it. You use your best mix to keep the other side using theirs.',
   'The keeper only keeps mixing because Tali does. Once Tali sticks to one side, the keeper covers it and Tali’s scoring falls toward 65% (illustrative). You use your best mix to keep the other side using theirs.');}},

{part:1,src:'Chapter 5 · How to Find Mixed Strategy Equilibria',pts:1,
 solve:async L=>{const i=L.$('#chc input');i.value=33;i.dispatchEvent(new Event('input',{bubbles:true}));L.$('#chb').click();},
 run(L){
  let a=false;
  L.h(L.kick('pr','Challenge')+'<h1 class="q">Find Tali’s best mix against the rival keeper: the share of left kicks the keeper can’t exploit.</h1><div id="chc"></div>'+

{part:1,src:'Chapter 5 · How to Find Mixed Strategy Equilibria · Surprising Changes in Mixtures',pts:1,
 solve:async L=>{L.$$('#sco .opt')[1].click();await L.sleep(1600);},
 run(L){
  let a=false;
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">The keeper trains hard on their weak side: kicks to the right now score 60% instead of 70% when they guess it. In the best mix, does the kicker go right…</h1>'+
   '<div class="opts" id="sco"></div><div id="scc"></div>');
  const c=mxChart(L,L.$('#scc'),{x:23/60,peak:true});
  ['More often, to test the keeper’s new skill','Less often','Just as often as before'].forEach((t,j)=>{const b=document.createElement('button');b.className='opt';b.innerHTML='<span class="key">'+(j+1)+'</span><span>'+t+'</span>';
    b.onclick=()=>{if(a)return;a=true;const ok=j===1;L.award(ok);b.classList.add(ok?'ok':'no');if(!ok)L.$$('#sco .opt')[1].classList.add('ok');L.$$('#sco .opt').forEach(x=>x.setAttribute('aria-disabled','true'));
      c.pins=[[23/60,'before',mxBest(MXP.BOOK).v]];c.animP(MXP.BETTER,1300,()=>{c.say('Left share <b>38.3% → 47.1%</b> · scoring <b>79.6% → 76.5%</b> · keeper’s dives to the right 58.3% → 50%');
        L.sheet(ok?'ok':'no',ok?'Less often: the improved side gets attacked less':'Less often: the improved side gets attacked less','Kickers now go left 47.1% of the time instead of 38.3%. So the keeper, facing more left kicks, dives right <i>less</i> (58.3% → 50%), yet still gains: scoring falls from 79.6% to 76.5%. The book’s tennis version: improve your weak backhand and opponents stop aiming at it, so you get to use your forehand more.');L.done();},true);};L.$('#sco').appendChild(b);});}},

{part:2,src:'Chapter 5 · How to Act Randomly',
 solve:async L=>{for(const b of L.$$('#ppc .chip')){b.click();await L.sleep(15);}await L.sleep(1150);},
 run(L){
  const seen=new Set();let fin=false;
  L.h(L.kick('ex','Edge cases: fake randomness')+'<h1 class="q">Four ways to “mix” 20 kicks against the pattern-reading keeper. Run each one.</h1><div id="ppg"></div>'+
   '<div class="mx-ctl" id="ppc"></div><p class="mx-ro" id="ppr" aria-live="polite">Pick a way to mix.</p>');
  const g=mxGoal(L,L.$('#ppg'),{keeper:'reader',seed:5});
  const S=[['Alternate','LRLRLRLRLRLRLRLRLRLR','L, R, L, R is read at once. Random is not alternating.'],
    ['“Human random”','LRLRRLRLLRLRLRRLRLRL','16 switches in 19: far too many. The keeper bets on the switch and wins.'],
    ['Six right, four left','RRRRRRLLLLRRRRRRLLLL','A 60:40 mix doesn’t mean six of one, then four of the other. Runs are easy to read.'],
    ['A watch decides (38% left)','RRLRRRLLRRLRRRLRRLRL','The keeper still guesses some right, but it doesn’t help: scoring stays near the best, 79.6%.']];
  S.forEach((p,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=p[0];
    b.onclick=()=>{g.finish();g.reset();[...L.$('#ppc').children].forEach((x,q)=>x.classList.toggle('sel',q===j));L.$('#ppr').innerHTML='Kicking…';seen.add(j);
      g.run(p[1].split(''),s=>{L.$('#ppr').innerHTML='Keeper guessed <b>'+s.read+' of 20</b> · scoring chance on these kicks: <b>'+mxPc(s.exp)+'</b><br>'+p[2];
        if(seen.size===S.length&&!fin){fin=true;L.sheet('info','Let something outside you decide','People forget that heads is as likely after heads as after tails, so their “random” has too many switches and too few runs. A keeper who spots any of this saves more. A device with the right odds leaves nothing to read.');L.done();}});};
    L.$('#ppc').appendChild(b);});}},

{part:2,src:'Chapter 5 · How to Act Randomly',
 solve:async L=>{const i=L.$('#wsl');i.value=23;i.dispatchEvent(new Event('input',{bubbles:true}));for(let k=0;k<3;k++){L.$('#wsb').click();await L.sleep(10);}},
 run(L){
  let n=30,stop=null,fin=false,hist=[];
  L.h(L.kick('ex','An outside device')+'<h1 class="q">The book’s trick: glance at your watch on the run-up. Set the left zone to the best mix, 38%, then glance three times.</h1>'+
   '<svg class="mx-svg" id="wsv" viewBox="0 0 320 186" role="img" aria-label="A watch face split into a left zone and a right zone, with a moving second hand"></svg>'+
   '<label class="mx-sl"><span class="h"><span>Left zone: 0 to <b id="wsn">30</b> seconds</span><b id="wsp">50% left</b></span><input type="range" id="wsl" min="0" max="60" step="1" value="30"></label>'+
   '<div class="mx-ctl"><button class="btn pri" id="wsb">'+L.ic('eye')+'Glance at the watch</button></div><div class="mx-strip" id="wst"></div><p class="mx-ro" id="wsr" aria-live="polite">Nobody else knows where your second hand is.</p>');
  const sec=()=>(Date.now()/1000)%60;
  const draw=()=>{L.$('#wsv').innerHTML=mxWatchArt(n,stop==null?sec():stop,stop==null);};
  const tm=setInterval(()=>{if(!L.$('#wsv')||!L.$('#wsv').isConnected){clearInterval(tm);return;}if(stop==null)draw();},100);
  draw();
  L.$('#wsl').addEventListener('input',()=>{n=+L.$('#wsl').value;L.$('#wsn').textContent=n;L.$('#wsp').textContent=Math.round(n/60*1000)/10+'% left';draw();chk();});
  L.$('#wsb').onclick=()=>{const s=Math.floor(sec());stop=s+.0;const k=s<n?'L':'R';hist.push(k);draw();
    L.$('#wst').innerHTML=hist.slice(-20).map(q=>'<span class="mx-tok '+q+'">'+q+'</span>').join('');
    L.$('#wsr').innerHTML='The hand says <b>'+s+'</b>: kick <b>'+(k==='L'?'left':'right')+'</b>.';
    setTimeout(()=>{stop=null;},700);chk();};
  function chk(){if(fin)return;if(n===23&&hist.length>=3){fin=true;L.sheet('info','23 seconds out of 60 is 38.3%','Left if the hand is between 0 and 23, right otherwise. Any share works this way (the book’s example: 1 to 24 for 40%). Your watch isn’t your gut, so it can’t fall into a pattern, and nobody else can see it.');L.done();}
    else if(hist.length>=3&&n!==23)L.$('#wsr').innerHTML+=' Now set the left zone to 23 seconds (38%).';}}},

{part:2,src:'Chapter 5 · Child’s Play · Mixing It Up in the Laboratory',
 solve:async L=>{for(const b of L.$$('#rpc .chip')){b.click();await L.sleep(5);}},
 run(L){
  const seen=new Set();let fin=false;
  L.h(L.kick('learn','Who really mixes well?')+'<h1 class="q">Rock Paper Scissors has a world championship. Do the champions mix the way theory says?</h1>'+
   '<div class="mx-ctl" id="rpc"></div><svg class="mx-svg" id="rpv" viewBox="0 0 320 150" role="img" aria-label="Picture for this tab"></svg><p class="mx-cap" id="rpt"></p>');
  const tok=(x,y,t,c)=>'<rect x="'+x+'" y="'+y+'" width="26" height="26" rx="7" fill="var('+c+')"/><text x="'+(x+13)+'" y="'+(y+18)+'" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--card)">'+t+'</text>';
  const C={R:'--muted',P:'--h3',S:'--h4'};
  const V=[['Theory',()=>{let s='<rect width="320" height="150" rx="14" fill="var(--soft)"/>';
      [['R','Rock'],['P','Paper'],['S','Scissors']].forEach((q,j)=>{const x=30+j*96;s+=tok(x+22,16,q[0],C[q[0]])+'<text x="'+(x+35)+'" y="60" text-anchor="middle" font-size="12" font-weight="600" fill="var(--ink)">'+q[1]+'</text><rect x="'+x+'" y="72" width="70" height="16" rx="5" fill="var('+C[q[0]]+')" opacity=".75"/><text x="'+(x+35)+'" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">1/3</text>';});
      return s+'<text x="160" y="136" text-anchor="middle" font-size="12" fill="var(--muted)">each throw can be beaten; a third each averages zero</text>';},
     'Any single throw can be beaten every time. Mix all three equally and you average zero whatever the other player does: that’s the equilibrium.'],
    ['Champions’ gambits',()=>{let s='<rect width="320" height="150" rx="14" fill="var(--soft)"/>';
      [['Bureaucrat','PPP'],['Scissor Sandwich','PSP'],['Exclusion','PSSPS']].forEach((q,j)=>{const y=14+j*42;s+='<text x="14" y="'+(y+18)+'" font-size="12" font-weight="700" fill="var(--ink)">'+q[0]+'</text>';q[1].split('').forEach((t,k)=>{s+=tok(140+k*32,y,t,C[t]);});});
      return s;},
     'Players at the championship favour named sequences like these, aimed at opponents who think a throw is “due”. Yet few players do well year after year, so the gambits give no lasting edge.'],
    ['Pros vs the lab',()=>{let s='<rect width="320" height="150" rx="14" fill="var(--soft)"/>';
      [[14,'On the pitch and court','--ok','close to the best mix','same rivals study them','huge stakes'],[166,'In the laboratory','--no','rarely flip a coin','novices, small stakes','no coins offered']].forEach(p=>{
        s+='<rect x="'+p[0]+'" y="14" width="140" height="122" rx="12" fill="var(--card)" stroke="var('+p[2]+')" stroke-width="2"/><text x="'+(p[0]+70)+'" y="36" text-anchor="middle" font-size="12" font-weight="700" fill="var('+p[2]+')">'+p[1]+'</text>';
        [p[3],p[4],p[5]].forEach((t,k)=>{s+='<text x="'+(p[0]+70)+'" y="'+(68+k*24)+'" text-anchor="middle" font-size="12" fill="var(--ink)">'+t+'</text>';});});
      return s;},
     'Top footballers and tennis players mix close to the best proportions: their rivals study them and the stakes are huge. Lab volunteers, new to the game and playing for little, rarely randomise.']];
  V.forEach((p,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=p[0];
    b.onclick=()=>{[...L.$('#rpc').children].forEach((x,q)=>x.classList.toggle('sel',q===j));L.$('#rpv').innerHTML=p[1]();L.$('#rpt').innerHTML=p[2];seen.add(j);
      if(seen.size===V.length&&!fin){fin=true;L.sheet('info','Practice and stakes make good mixers','Where patterns get punished, people learn to mix well. Where they don’t, they mix badly. In daily life most of us are closer to the lab volunteers, which is why a device beats your gut.');L.done();}};
    L.$('#rpc').appendChild(b);});
  L.$('#rpc').children[0].click();}},

{part:2,src:'Chapter 5 · Case Study: Janken Step Game · Case Discussion',pts:1,run(L){
  const bar='<svg class="mx-svg" viewBox="0 0 320 54" role="img" aria-label="The book’s answer: paper one-eighth, scissors five-eighths, rock two-eighths"><rect x="10" y="8" width="37.5" height="22" rx="4" fill="var(--h3)"/><rect x="47.5" y="8" width="187.5" height="22" rx="4" fill="var(--h4)"/><rect x="235" y="8" width="75" height="22" rx="4" fill="var(--muted)"/>'+
    '<text x="28" y="46" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--h3)">P 1/8</text><text x="141" y="46" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--h4)">Scissors 5/8</text><text x="272" y="46" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--muted)">Rock 2/8</text></svg>';
  L.h(L.kick('pr','The chapter’s case')+'<h1 class="q">Two friends at a sushi bar play for the last serving. In this Rock Paper Scissors, the winner moves ahead: 5 steps for winning with Paper, 2 with Scissors, 1 with Rock. Which throw should each use most often?</h1>'+
   '<svg class="mx-svg" viewBox="0 0 320 70" role="img" aria-label="Paper wins 5 steps, Scissors 2, Rock 1"><rect width="320" height="70" rx="14" fill="var(--soft)"/>'+
   [['P','Paper','+5','--h3'],['S','Scissors','+2','--h4'],['R','Rock','+1','--muted']].map((q,j)=>{const x=20+j*100;return '<rect x="'+x+'" y="14" width="26" height="26" rx="7" fill="var('+q[3]+')"/><text x="'+(x+13)+'" y="32" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--card)">'+q[0]+'</text><text x="'+(x+34)+'" y="26" font-size="12" font-weight="600" fill="var(--ink)">'+q[1]+'</text><text x="'+(x+34)+'" y="42" font-size="12" font-weight="700" fill="var(--ok)">'+q[2]+' steps</text>';}).join('')+
   '<text x="160" y="62" text-anchor="middle" font-size="11.5" fill="var(--muted)">what counts: how far ahead of the other you get</text></svg>');
  L.mc(L.card,['Paper, since it wins the most','Scissors','Rock','All three equally'],1,
   'The book’s answer: Scissors 5/8, Rock 2/8, Paper only 1/8. Paper’s big prize means you must guard against it, and Scissors is the guard. Rock punishes all that Scissors. At these shares every throw earns the same on average (zero), so nothing is left to exploit.'+bar,
   'It’s Scissors. The book’s answer: Scissors 5/8, Rock 2/8, Paper only 1/8. Paper’s big prize means you must guard against it, and Scissors is the guard. Rock punishes all that Scissors. At these shares every throw earns the same on average (zero).'+bar);}},

{part:2,src:'Chapter 5 · Mixing in Business and Other Wars',
 solve:async L=>{const f=L.$('#pkf'),c=L.$('#pkc');f.value=6;f.dispatchEvent(new Event('input',{bubbles:true}));c.value=6;c.dispatchEvent(new Event('input',{bubbles:true}));await L.sleep(20);},
 run(L){
  let fin=false,ran=0,tk=null;
  const FINES=[1.01,2,5,10,15,20,25,40,50],CH=[[1,'every car'],[1/2,'1 in 2'],[1/4,'1 in 4'],[1/5,'1 in 5'],[1/10,'1 in 10'],[1/20,'1 in 20'],[1/25,'1 in 25'],[1/50,'1 in 50']];
  L.h(L.kick('learn','Checking others: the parking street')+'<h1 class="q">The meter costs $1 an hour. Keep this street honest while checking as few cars as you can.</h1>'+
   '<svg class="mx-svg" id="pks" viewBox="0 0 320 178" role="img" aria-label="A street with 25 parking bays; green cars paid the meter, red cars took the risk; a warden walks the road"></svg>'+
   '<label class="mx-sl"><span class="h"><span>Fine if caught</span><b id="pkfv"></b></span><input type="range" id="pkf" min="0" max="8" step="1" value="0"></label>'+
   '<label class="mx-sl"><span class="h"><span>Cars the warden checks</span><b id="pkcv"></b></span><input type="range" id="pkc" min="0" max="7" step="1" value="6"></label>'+
   '<div class="mx-bl"><span>Warden time used</span><b id="pkwv"></b></div><div class="mx-bar"><div id="pkw"></div></div>'+
   '<p class="mx-ro" id="pkr" aria-live="polite"></p><div class="mx-ctl"><button class="btn" id="pkd">'+L.ic('play')+'Run a day</button></div><p class="mx-ill">The book’s numbers: $1 an hour, a $25 fine, a 1-in-25 check · warden time illustrative</p>');
  const bays=[];for(let i=0;i<13;i++)bays.push([8+i*23.4,10,23.4]);for(let i=0;i<12;i++)bays.push([8+i*25.33,124,25.33]);
  const rng=mxRng(3);
  function st(){const f=FINES[+L.$('#pkf').value],c=CH[+L.$('#pkc').value];return {f,p:c[0],lab:c[1],honest:f*c[0]>=1-1e-9,exp:f*c[0]};}
  function draw(wx){const s=st();let v='<rect width="320" height="178" rx="14" fill="var(--soft)"/><rect x="4" y="62" width="312" height="56" fill="var(--soft2)"/><path d="M12 90H308" stroke="var(--line2)" stroke-width="2" stroke-dasharray="10 8"/>';
    bays.forEach((b,i)=>{const top=i<13,x=b[0],y=b[1],w=b[2];
      v+='<path d="M'+x+' '+y+'v44" stroke="var(--line2)" stroke-width="1.2"/>';
      v+='<rect x="'+(x+3)+'" y="'+(y+(top?8:0))+'" width="'+(w-6)+'" height="34" rx="5" fill="var('+(s.honest?'--ok-bg':'--no-bg')+')" stroke="var('+(s.honest?'--ok':'--no')+')" stroke-width="1.6"/>'+
        '<rect x="'+(x+6)+'" y="'+(y+(top?30:4))+'" width="'+(w-12)+'" height="7" rx="2" fill="var('+(s.honest?'--ok':'--no')+')" opacity=".45"/>';
      v+='<circle cx="'+(x+w/2)+'" cy="'+(top?y+3:y+42)+'" r="3" fill="var('+(s.honest?'--ok-strong':'--line2')+')"/>';
      if(tk&&tk.has(i))v+=s.honest?'<circle cx="'+(x+w/2)+'" cy="'+(y+(top?25:17))+'" r="6" fill="var(--ok-strong)"/><path d="M'+(x+w/2-3)+' '+(y+(top?25:17))+'l2 2 4-4" fill="none" stroke="var(--card)" stroke-width="1.6"/>':'<rect x="'+(x+w/2-6)+'" y="'+(y+(top?18:10))+'" width="12" height="14" rx="2" fill="var(--no-strong)"/><text x="'+(x+w/2)+'" y="'+(y+(top?29:21))+'" text-anchor="middle" font-size="11" font-weight="700" fill="var(--card)">!</text>';});
    if(wx==null)wx=20;v+='<g transform="translate('+wx+',90)"><circle r="9" fill="var(--h4)" stroke="var(--card)" stroke-width="2"/><path d="M-8-6h16" stroke="var(--ink)" stroke-width="3"/><text y="22" text-anchor="middle" font-size="11" font-weight="700" fill="var(--h4)">warden</text></g>';
    L.$('#pks').innerHTML=v;
    L.$('#pkfv').textContent='$'+(s.f%1?s.f.toFixed(2):s.f);L.$('#pkcv').textContent=s.lab;
    L.$('#pkw').style.width=(s.p*100)+'%';L.$('#pkwv').textContent=Math.round(s.p*100)+'% of checking every car';
    L.$('#pkr').innerHTML='Expected fine for skipping the meter: $'+(s.f%1?s.f.toFixed(2):s.f)+' × '+(s.p===1?'1':'1/'+Math.round(1/s.p))+' = <b>$'+s.exp.toFixed(2)+'</b> against a <b>$1</b> fee<br>'+(s.honest?'<b style="color:var(--ok)">Every driver pays.</b>':'<b style="color:var(--no)">Skipping is cheaper, so drivers take the risk.</b>');}
  function chk(){const s=st();if(s.honest&&s.p<=.1&&!fin){fin=true;L.sheet('info','Big fine, occasional check','A $1.01 fine works only if every car is checked, which costs a fortune in wardens. The book’s answer: raise the fine and check at random. A $25 fine with a 1-in-25 chance keeps drivers honest with a much smaller force. The rule: the <i>expected</i> punishment should fit the offence. Drug tests and tax audits work the same way. (The checked side can mix too: hiding the real thing among decoys spreads checkers thin.)');L.done();}}
  ['#pkf','#pkc'].forEach(id=>L.$(id).addEventListener('input',()=>{tk=null;draw();chk();}));
  L.$('#pkd').onclick=()=>{const s=st();const n=Math.max(1,Math.round(25*s.p));const idx=[...Array(25).keys()].sort(()=>rng()-.5).slice(0,n);tk=new Set();ran++;
    let x=10;const t=setInterval(()=>{if(!L.$('#pks')||!L.$('#pks').isConnected){clearInterval(t);return;}x+=30;bays.forEach((b,i)=>{if(idx.includes(i)&&b[0]+b[2]/2<=x)tk.add(i);});draw(Math.min(x,306));
      if(x>=310){clearInterval(t);idx.forEach(i=>tk.add(i));draw();const tix=s.honest?0:n;L.$('#pkr').innerHTML+='<br>Today: '+n+' car'+(n>1?'s':'')+' checked, <b>'+tix+' ticket'+(tix===1?'':'s')+'</b>.';}},60);};
  draw();}},

{part:2,src:'Chapter 5 · Mixing in Business and Other Wars',pts:1,
 solve:async L=>{L.$('#hbr').click();const c=L.$('#hbc'),m=L.$('#hbm');c.value=600;c.dispatchEvent(new Event('input',{bubbles:true}));m.value=2;m.dispatchEvent(new Event('input',{bubbles:true}));L.$('#hbb').click();},
 run(L){
  let mode='fixed',a=false;
  L.h(L.kick('pr','Challenge · Hedda’s bathroom')+'<h1 class="q">Tali can’t watch the builder every day. Plan the checks so every day’s work is done properly, with as few visits as possible.</h1>'+
   '<svg class="mx-svg" id="hbs" viewBox="0 0 320 154"role="img" aria-label="A bathroom wall of 20 tiles, one per working day; green tiles were done properly, red ones had corners cut; a magnifier marks the days Tali checks"></svg>'+
   '<div class="mx-ctl"><button class="chip sel" id="hbf">Every Friday</button><button class="chip" id="hbr">Random days</button></div>'+
   '<label class="mx-sl"><span class="h"><span>Stage payment held back if a check fails</span><b id="hbcv"></b></span><input type="range" id="hbc" min="0" max="600" step="50" value="300"></label>'+
   '<label class="mx-sl"><span class="h"><span>Days Tali checks, out of 20</span><b id="hbmv"></b></span><input type="range" id="hbm" min="0" max="20" step="1" value="4"></label>'+
   '<p class="mx-ro" id="hbr2" aria-live="polite"></p><div class="mx-ctl"><button class="btn pri" id="hbb">'+L.ic('check')+'Lock in this plan</button></div>'+
   '<p class="mx-ill">Illustrative numbers · cutting corners saves the builder £50 a day</p>');
  const order=[...Array(20).keys()];{const r=mxRng(9);for(let i=19;i>0;i--){const j=Math.floor(r()*(i+1));[order[i],order[j]]=[order[j],order[i]];}}
  const D='MTWTF';
  function st(){const C=+L.$('#hbc').value,n=mode==='fixed'?4:+L.$('#hbm').value,p=n/20;
    const chk=new Set(mode==='fixed'?[4,9,14,19]:order.slice(0,n));
    const good=i=>mode==='fixed'?(chk.has(i)&&C>50):C*p>50+1e-9;
    return {C,n,p,chk,good,all:[...Array(20).keys()].every(good),tie:mode==='random'&&Math.abs(C*p-50)<1e-9};}
  function draw(){const s=st();let v='<rect width="320" height="154" rx="14" fill="var(--soft)"/><rect x="6" y="6" width="308" height="86" rx="8" fill="var(--card)"/>';
    for(let i=0;i<20;i++){const x=12+(i%10)*30,y=16+Math.floor(i/10)*40,g=s.good(i);
      v+='<rect x="'+x+'" y="'+y+'" width="27" height="30" rx="4" fill="var('+(g?'--ok-bg':'--no-bg')+')" stroke="var('+(g?'--ok':'--no')+')" stroke-width="1.6"/><text x="'+(x+13.5)+'" y="'+(y+20)+'" text-anchor="middle" font-size="11.5" font-weight="700" fill="var('+(g?'--ok':'--no')+')">'+D[i%5]+'</text>';
      if(s.chk.has(i))v+='<path d="M'+(x+24.5)+' '+(y-1.5)+'l4-4.5" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="round"/><circle cx="'+(x+21)+'" cy="'+(y+2)+'" r="5" fill="var(--card)" stroke="var(--ink)" stroke-width="2"/>';}
    v+='<path d="M40 104h240v12a24 24 0 0 1-24 24H64a24 24 0 0 1-24-24z" fill="var(--card)" stroke="var(--ink)" stroke-width="2"/><path d="M60 104V96a8 8 0 0 1 16 0" fill="none" stroke="var(--ink)" stroke-width="2"/><text x="160" y="126" text-anchor="middle" font-size="11.5" fill="var(--muted)">20 working days, 2 weeks per row</text>';
    L.$('#hbs').innerHTML=v;
    L.$('#hbcv').textContent='£'+s.C;L.$('#hbmv').textContent=mode==='fixed'?'4 (Fridays)':s.n+' ('+Math.round(s.p*100)+'%)';L.$('#hbm').disabled=mode==='fixed';
    L.$('#hbr2').innerHTML=mode==='fixed'?'The builder knows Friday is check day, so Monday to Thursday carry no risk. <b>'+[...Array(20).keys()].filter(s.good).length+' of 20</b> days done properly.'
      :'Each day has a '+Math.round(s.p*100)+'% chance of a check: expected loss £'+s.C+' × '+Math.round(s.p*100)+'% = <b>£'+(s.C*s.p).toFixed(0)+'</b> against <b>£50</b> saved. '+(s.all?'<b style="color:var(--ok)">Worth doing every day properly.</b>':s.tie?'<b style="color:var(--no)">A tie: skimping costs the builder nothing extra, so honest work isn’t clearly better.</b>':'<b style="color:var(--no)">Cutting corners pays.</b>');}
  ['#hbc','#hbm'].forEach(id=>L.$(id).addEventListener('input',draw));
  const setM=m=>{mode=m;L.$('#hbf').classList.toggle('sel',m==='fixed');L.$('#hbr').classList.toggle('sel',m==='random');draw();};
  L.$('#hbf').onclick=()=>setM('fixed');L.$('#hbr').onclick=()=>setM('random');
  L.$('#hbb').onclick=()=>{if(a)return;const s=st();a=true;const ok=mode==='random'&&s.all&&s.n<=2;L.award(ok);L.$('#hbb').hidden=true;
    L.sheet(ok?'ok':'no',ok?'Two random days do it':(mode==='fixed'?'Fixed days get read':s.all?'It works, but with more visits than needed':'Some days still get skimped'),
     (mode==='fixed'?'Every Friday tells the builder exactly when it matters. ':'')+(mode==='random'&&s.all&&s.n>2?'Your plan keeps every day right, but uses '+s.n+' visits. ':'')+
     'The fewest: hold back the full £600 stage and check 2 random days in 20. Each day then carries a 10% chance of losing £600, an expected £60, more than the £50 skimping saves, so doing it properly is the builder’s best move. Tell the builder the rule up front: the point is good work, not catching anyone out.');L.done();};
  draw();}},

  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Mix or not?',['Mix your moves','Don’t mix'],[
   ['Which side Tali kicks penalties to, all season, against the same rival keeper',0,'Pure conflict, repeated, and the keeper studies patterns. Mix, in the right proportions.'],

{part:3,src:'Course application · built on Chapter 5',pts:1,
 solve:async L=>{for(let k=0;k<6;k++){L.$('#omb').click();await L.sleep(10);}L.$$('#omq .opt')[0].click();},
 run(L){
  let s=-1,fin=false;
  L.h(L.kick('pr','One-minute move')+'<h1 class="q">Next Thursday, Tali faces the rival keeper again. Run the move.</h1>'+
   '<div class="mx-steps" id="oms"><span>1 · Test</span><span>2 · Mix</span><span>3 · Device</span><span>4 · No pattern</span><span>5 · If checking</span></div>'+
   '<div id="omv"></div><div class="mx-say" id="omt" aria-live="polite"></div><div class="mx-ctl"><button class="btn pri" id="omb">'+L.ic('arrow')+'Start</button></div><div class="opts" id="omq"></div>'+
   L.note('How this course applies the book: a one-minute routine built only from the book’s Rule 5 and its advice on acting randomly.','compass'));
  const tok=q=>'<span class="mx-tok '+q+'">'+q+'</span>';
  const ST=[['STEP 1 · THE TEST QUESTION','Would it hurt Tali if the keeper knew the kick in advance? Yes: seen, Tali scores 50% left or 65% right. Hidden, a good mix gets 73%. So mix.',()=>{L.$('#omv').innerHTML='<svg class="mx-svg" viewBox="0 0 320 92" role="img" aria-label="Seen left 50%, seen right 65%, hidden best mix 73%"><rect width="320" height="92" rx="14" fill="var(--soft)"/>'+
       [['Seen, kicks left',50,'--no'],['Seen, kicks right',65,'--no'],['Hidden, best mix',73.3,'--ok']].map((r,j)=>{const y=12+j*26;return '<text x="12" y="'+(y+14)+'" font-size="12" font-weight="600" fill="var(--ink)">'+r[0]+'</text><rect x="128" y="'+y+'" width="'+(r[1]*1.9)+'" height="18" rx="5" fill="var('+r[2]+')" opacity=".75"/><text x="'+(132+r[1]*1.9)+'" y="'+(y+14)+'" font-size="12" font-weight="700" fill="var(--ink)">'+r[1]+'%</text>';}).join('')+'</svg><p class="mx-ill">Illustrative numbers · Tali vs the rival keeper</p>';}],
    ['STEP 2 · PICK THE PROPORTIONS','More of the move they defend least well. On these numbers the lines cross at about a third left.',()=>{L.$('#omv').innerHTML='';mxChart(L,L.$('#omv'),{P:MXP.TALI,x:1/3,peak:true});}],
    ['STEP 3 · LET A DEVICE DECIDE','On the run-up, glance at a watch: left if the second hand is between 0 and 20 (a third), right otherwise.',()=>{L.$('#omv').innerHTML='<svg class="mx-svg" viewBox="0 0 320 186" role="img" aria-label="Watch face with a left zone of 20 seconds">'+mxWatchArt(20,41,false)+'</svg>';}],
    ['STEP 4 · NEVER JUST ALTERNATE','No “left last time, so right now”. Runs are fine when the device gives them.',()=>{L.$('#omv').innerHTML='<p class="mx-leg">Alternating, read at once:</p><div class="mx-strip">'+'LRLRLRLR'.split('').map(q=>tok(q).replace('mx-tok','mx-tok x')).join('')+'</div><p class="mx-leg">From the watch:</p><div class="mx-strip">'+'RRLRRRLR'.split('').map(tok).join('')+'</div>';}],
    ['STEP 5 · IF YOU’RE THE ONE CHECKING','A big enough consequence plus occasional random checks, as with Hedda’s builder. Not needed for penalties. Last: one question.',()=>{let v='<svg class="mx-svg" viewBox="0 0 320 64" role="img" aria-label="Ten tiles of good work, one random check, and a big consequence"><rect width="320" height="64" rx="12" fill="var(--soft)"/>';
       for(let i=0;i<10;i++){const x=12+i*30;v+='<rect x="'+x+'" y="14" width="26" height="26" rx="4" fill="var(--ok-bg)" stroke="var(--ok)" stroke-width="1.5"/>';if(i===6)v+='<path d="M'+(x+23.5)+' 9.5l4-4.5" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="round"/><circle cx="'+(x+20)+'" cy="14" r="5" fill="var(--card)" stroke="var(--ink)" stroke-width="2"/>';}
       L.$('#omv').innerHTML=v+'<text x="160" y="56" text-anchor="middle" font-size="11.5" fill="var(--muted)">one random check · £600 at stake · every day done right</text></svg>';}]];
  function go(n){s=n;L.$$('#oms span').forEach((p,j)=>p.className=j<n?'dn':j===n?'cur':'');L.$('#omt').innerHTML='<b>'+ST[n][0]+'</b>'+ST[n][1];ST[n][2]();L.$('#omb').innerHTML=L.ic('arrow')+(n<4?'Next step':'Final question');}
  L.$('#omv').innerHTML='<svg class="mx-svg" viewBox="0 0 320 136" role="img" aria-label="The goal Tali kicks at: left half, right half, the rival keeper in the middle and the ball on the spot">'+mxGoalArt()+'</svg>';
  L.$('#omt').innerHTML='<b>TALI’S PENALTIES</b>Same goal, same keeper, who studies every kick. Five steps, about a minute.';
  L.$('#omb').onclick=()=>{if(s<4){go(s+1);return;}
    L.$('#omb').hidden=true;L.$$('#oms span').forEach(p=>p.className='dn');
    L.$('#omt').innerHTML='<b>THURSDAY</b>Tali follows the plan, and the keeper saves two in a row. A teammate shouts: “Stop going left!” What should Tali do?';L.$('#omv').innerHTML='';
    ['Keep the same mix and the watch','Kick right every time for a while','Switch to 50:50, to be safe'].forEach((t,j)=>{const b=document.createElement('button');b.className='opt';b.innerHTML='<span class="key">'+(j+1)+'</span><span>'+t+'</span>';
      b.onclick=()=>{if(fin)return;fin=true;const ok=j===0;L.award(ok);b.classList.add(ok?'ok':'no');if(!ok)L.$$('#omq .opt')[0].classList.add('ok');
        L.sheet(ok?'ok':'no',ok?'Judge the policy, not one result':'Keep the mix','Even the best mix fails about a quarter of the time here. Two saves don’t prove it wrong, and kicking right every time hands the keeper a pattern. The book’s advice: explain the policy before you use it, like a coach who throws the occasional risky long pass to keep the defence honest.');L.done();};L.$('#omq').appendChild(b);});};}},

{part:3,src:'Chapter 5 · Unique Situations',
 solve:async L=>{for(const b of L.$$('#lmc .chip')){b.click();await L.sleep(5);}},
 run(L){
  const seen=new Set();let fin=false;
  L.h(L.kick('ex','Edge cases and limits')+'<h1 class="q">Where does “mix your moves” stop helping? Try each case.</h1><div class="mx-ctl" id="lmc"></div><div id="lmv"></div><div id="lmf"></div>');
  const PR=[['One side too weak',()=>{mxChart(L,L.$('#lmv'),{P:MXP.WEAK,x:0,peak:true});},'Here kicking left scores so badly that right is better whatever the keeper does: a '+L.g('dominant','dominant')+' choice. The peak sits at 0% left. Mixing pays only when each move has something going for it.'],
    ['A one-off',()=>{L.$('#lmv').innerHTML='<svg class="mx-svg" viewBox="0 0 320 186" role="img" aria-label="Watch face used at the last moment">'+mxWatchArt(23,9,false)+'</svg>';},'Played once, there’s no history for anyone to read. But if they might find out your plan in advance (the book’s example is spies before a battle), keep your options open and let a device choose at the last moment, in the right proportions.'],
    ['Good mix, bad result',()=>{const g=mxGoal(L,L.$('#lmv'),{keeper:'L',legend:false});g.show({k:'L',d:'L',out:'saved'});},'Even at the best mix the keeper still guesses right sometimes. One saved kick doesn’t prove the mix wrong. Justify the policy before you use it, not after one result.'],
    ['You want to match',()=>{L.$('#lmv').innerHTML='<svg class="mx-svg" viewBox="0 0 320 216" role="img" aria-label="Area square: mixing apart, two people miss each other 25 times in 49">'+mxSquare(false)+'</svg>';},'When both sides share an interest, like meeting up, mixing apart makes them miss each other about half the time. More on that next.']];
  PR.forEach((p,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=p[0];
    b.onclick=()=>{[...L.$('#lmc').children].forEach((x,q)=>x.classList.toggle('sel',q===j));L.$('#lmv').innerHTML='';p[1]();L.$('#lmf').innerHTML='';L.fb(L.$('#lmf'),p[2],'info');seen.add(j);
      if(seen.size===PR.length&&!fin){fin=true;L.sheet('info','Mix only where a pattern can hurt you','Mixing is for pure conflict and for checking. Skip it when one move is simply better, when you want to coordinate, and don’t judge it by one result. Business is wary of chance because a failed gamble can cost a job, but the point is to avoid being predictable, not to win every time.');L.done();}};
    L.$('#lmc').appendChild(b);});}},

{part:3,src:'Chapter 5 · Mixing Strategies in Mixed-Motives Games',
 solve:async L=>{L.$('#cpa').click();L.$('#cpb').click();},
 run(L){
  const seen=new Set();let fin=false;
  L.h(L.kick('learn','Where cooperation wins')+'<h1 class="q">Tali wants a city break, Juno the coast. Both would rather go together than apart. Should they each toss a coin?</h1>'+
   '<div class="mx-ctl"><button class="chip" id="cpa">Each tosses their own coin</button><button class="chip" id="cpb">One shared signal</button></div>'+
   '<svg class="mx-svg" id="cps" viewBox="0 0 320 216" role="img" aria-label="Area square showing how often Tali and Juno end up together"></svg><p class="mx-cap" id="cpt">Tap each way.</p>');
  const T={cpa:[false,'Mixing apart, in the proportions that would leave each indifferent, they end up in different places <b>25 times in 49</b>. Each averages 1.71, worse even than giving in (3).'],
    cpb:[true,'Agree in advance: if it rains on booking day, city; if dry, coast. They always go together, and each averages <b>3.5</b>. A coin they share is fair; coins they toss apart are a mess.']};
  L.$('#cps').innerHTML=mxSquare(false);
  ['cpa','cpb'].forEach(id=>L.$('#'+id).onclick=()=>{['cpa','cpb'].forEach(q=>L.$('#'+q).classList.toggle('sel',q===id));L.$('#cps').innerHTML=mxSquare(T[id][0]);L.$('#cpt').innerHTML=T[id][1];seen.add(id);
    if(seen.size===2&&!fin){fin=true;L.sheet('info','Coordinate, don’t mix','Between people who share an interest, independent mixing is wasteful and fragile: a tiny change in beliefs and it collapses. The book’s evidence that rivals coordinate too: over one 52-week stretch Coke and Pepsi each ran promotions for 26 weeks with no overlap at all. They took turns. With people you care about, take turns or agree a shared signal.');L.done();}});}},

{part:3,src:'Course application · built on Chapter 5',
 solve:async L=>{L.$('#yuc').children[1].click();L.$('#yut').children[0].click();
   [['#yu1','When I check the team’s timesheets'],['#yua','Monday'],['#yub','another day'],['#yud','watch: 0 to 12 seconds means Monday']].forEach(q=>{L.$(q[0]).value=q[1];L.$(q[0]).dispatchEvent(new Event('input',{bubbles:true}));});
   const s=L.$('#yus');s.value=20;s.dispatchEvent(new Event('input',{bubbles:true}));L.$('#yub2').click();},
 run(L){
  L.h(L.kick('pr','Your turn · ungraded')+'<h1 class="q">One place in your week where your pattern is being read, or where you’re the one checking</h1>'+
   L.note('How this course applies the book: the one-minute move on your own situation.','compass')+
   '<span class="mx-fl">WHICH SIDE ARE YOU ON?</span><div class="mx-chips" id="yuc"></div>'+
   '<label class="mx-fl" for="yu1">THE SITUATION</label><input class="mx-in" id="yu1" maxlength="70" placeholder="e.g. when I ask for a raise, which day I check homework">'+
   '<span class="mx-fl">1 · WOULD IT HURT IF THEY KNEW YOUR MOVE IN ADVANCE?</span><div class="mx-chips" id="yut"></div>'+
   '<span class="mx-fl">2 · YOUR TWO MOVES</span><div class="mx-two"><input class="mx-in" id="yua" maxlength="24" placeholder="move A" aria-label="Move A"><input class="mx-in" id="yub" maxlength="24" placeholder="move B" aria-label="Move B"></div>'+
   '<label class="mx-sl"><span class="h"><span>3 · Share of move A</span><b id="yuv">50%</b></span><input type="range" id="yus" min="0" max="100" step="5" value="50"></label>'+
   '<label class="mx-fl" for="yud">4 · YOUR OUTSIDE DEVICE</label><input class="mx-in" id="yud" maxlength="60" placeholder="e.g. watch’s second hand, a dice roll">'+
   '<div class="mx-ctl"><button class="btn pri" id="yub2" disabled>'+L.ic('target')+'Set my spinner</button></div><div id="yuo"></div>');
  let side=null,hurt=null;
  const chips=(id,arr,cb)=>arr.forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=n;b.onclick=()=>{[...L.$(id).children].forEach((x,q)=>x.classList.toggle('sel',q===j));cb(j);chk();};L.$(id).appendChild(b);});
  chips('#yuc',['My pattern is being read','I’m the one checking'],j=>side=j);
  chips('#yut',['Yes, it would hurt','No, it wouldn’t'],j=>hurt=j);
  const v=s=>L.$(s).value.trim();
  function chk(){L.$('#yub2').disabled=!(side!==null&&hurt!==null&&v('#yu1').length>1&&v('#yua').length>0&&v('#yub').length>0&&v('#yud').length>1);}
  ['#yu1','#yua','#yub','#yud'].forEach(s=>L.$(s).addEventListener('input',chk));
  L.$('#yus').addEventListener('input',()=>{L.$('#yuv').textContent=L.$('#yus').value+'%';});
  L.$('#yub2').onclick=()=>{const p=+L.$('#yus').value/100,e=s=>L.esc(v(s));
    if(hurt===1){L.$('#yuo').innerHTML='';L.fb(L.$('#yuo'),'If being seen in advance wouldn’t hurt you, there’s nothing to hide: don’t mix. Just choose, or agree a clear rule with the other person.','info');
      L.sheet('info','No need to mix here','The test question says this isn’t pure conflict or checking. A clear, predictable choice may even help both of you.');L.done();return;}
    const cx=110,cy=96,r=74,a=p*2*Math.PI,ex=cx+r*Math.sin(a),ey=cy-r*Math.cos(a);
    let svg='<svg class="mx-svg" viewBox="0 0 320 200" role="img" aria-label="Your spinner, split into your two moves"><rect width="320" height="200" rx="14" fill="var(--soft)"/><circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="var(--h2-bg)" stroke="var(--h2)" stroke-width="2"/>';
    if(p>=1)svg+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="var(--h1-bg)" stroke="var(--h1)" stroke-width="2"/>';
    else if(p>0)svg+='<path d="M'+cx+' '+cy+'L'+cx+' '+(cy-r)+'A'+r+' '+r+' 0 '+(p>.5?1:0)+' 1 '+ex.toFixed(1)+' '+ey.toFixed(1)+'Z" fill="var(--h1-bg)" stroke="var(--h1)" stroke-width="2"/>';
    svg+='<path d="M'+cx+' '+cy+'L'+(cx+50)+' '+(cy+30)+'" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/><circle cx="'+cx+'" cy="'+cy+'" r="6" fill="var(--ink)"/>';
    svg+='<foreignObject x="196" y="20" width="116" height="160"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:12px;line-height:1.35;color:var(--ink);overflow:hidden"><b style="color:var(--h1)">'+e('#yua')+'</b> '+Math.round(p*100)+'%<br/><b style="color:var(--h2)">'+e('#yub')+'</b> '+Math.round((1-p)*100)+'%<br/><br/><span style="color:var(--muted)">Device:</span> '+e('#yud')+'</div></foreignObject></svg>';
    L.$('#yuo').innerHTML=svg;
    L.sheet('info','Your spinner is set',(side===1?'Pair it with a consequence big enough that the expected cost beats the gain from slacking, and tell people the rule up front.':'Lean toward the move they handle worst, so they can’t do better by guessing.')+' Let the device decide each time, never alternate, and judge the policy over many rounds, not one.');L.done();};}},

{part:3,src:'Course application · built on Chapter 5',run(L){
  L.h(L.kick('learn','Your strategy map')+'<h1 class="q">“Mix your moves” joins two rows of the map</h1>'+
   L.note('How this course applies the book. Later lessons fill the dashed gaps.','compass')+
   '<svg class="mx-svg" viewBox="0 0 320 76" role="img" aria-label="Tool picture: a penalty spot facing a goal split left and right, with a spinner set to the right proportions"><rect width="320" height="76" rx="12" fill="var(--soft)"/>'+
   '<rect x="20" y="14" width="56" height="40" fill="var(--h1-bg)"/><rect x="76" y="14" width="76" height="40" fill="var(--h2-bg)"/><path d="M20 56V12H152V56" fill="none" stroke="var(--ink)" stroke-width="3"/><text x="48" y="40" text-anchor="middle" font-size="12" font-weight="700" fill="var(--h1)">L</text><text x="114" y="40" text-anchor="middle" font-size="12" font-weight="700" fill="var(--h2)">R</text><ellipse cx="86" cy="68" rx="6" ry="2.5" fill="var(--line2)"/>'+
   '<circle cx="238" cy="38" r="28" fill="var(--h2-bg)" stroke="var(--h2)" stroke-width="2"/><path d="M238 38V10A28 28 0 0 1 '+(238+28*Math.sin(23/60*2*Math.PI)).toFixed(1)+' '+(38-28*Math.cos(23/60*2*Math.PI)).toFixed(1)+'Z" fill="var(--h1-bg)" stroke="var(--h1)" stroke-width="2"/><path d="M238 38l16 12" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/><circle cx="238" cy="38" r="4" fill="var(--ink)"/><text x="290" y="42" font-size="12" font-weight="700" fill="var(--h1)">38%</text></svg>'+
   '<div id="mp"></div>'+
   '<p class="small">It’s the <b>only</b> tool when your pattern is being read or you’re the one checking, and the third tool to try when you both choose at once. Never for games where you want to match.</p>');
  L.$('#mp').innerHTML='<div class="mp-row"><span class="n">0</span><b>Is it a game at all? Will the other side react?</b></div>'+MP_ROWS.map((r,j)=>{const hot=r[1].includes('mix');
    return '<div class="mp-row'+(hot?' hot':'')+'"><span class="n">'+(j+1)+'</span><b>'+r[0]+'</b><div class="t">'+r[1].map((k,q)=>(q?'<span class="mp-ar">→</span>':'')+'<span class="mp-t'+(k==='mix'?' cur':MP_T[k][1]>6?' tbd':'')+'">'+(MP_T[k][1]>6?'?':MP_T[k][0])+'</span>').join('')+'</div></div>';}).join('');
  L.done();}}
  ]
});
</script>
