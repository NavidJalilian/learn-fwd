let SGN=0;
const sgSet=(el,v)=>{el.value=v;el.dispatchEvent(new Event('input',{bubbles:true}));};
const sgAlive=id=>!!document.getElementById(id);

/* ---------- the lemons car lot ----------
   Book’s numbers (Ch 8, A Little History): lemon owner sells for $1,000, buyers pay up to $1,500;
   peach owner wants $3,000, buyers pay up to $4,000; half and half. Warranty, inspection and
   Tali’s £ lot use illustrative numbers. */
const LOT_BOOK={cur:'$',LMIN:1000,LBUY:1500,PMIN:3000,PBUY:4000,WP:3500,LS:1250,CL:150,CP:25,MAX:4500,FEE:100};
const LOT_TALI={cur:'£',LMIN:900,LBUY:1400,PMIN:2600,PBUY:3400,WP:3000,LS:1200,CL:200,CP:30,MAX:4000,FEE:100};
const LOT_T=['L','P','P','L','P','L','L','P','L','P'];
const sgM=(c,v)=>c.cur+Math.round(v).toLocaleString('en-GB');
function sgCar(t,hid){
  const k=hid?'U':t;
  const c=k==='L'?'var(--h3)':k==='P'?'var(--h4)':'var(--line2)',bg=k==='L'?'var(--h3-bg)':k==='P'?'var(--h4-bg)':'var(--soft2)';
  return '<path d="M8 11L14 2H32L38 11Z" fill="'+bg+'" stroke="'+c+'" stroke-width="1.6" stroke-linejoin="round"/><rect x="1" y="10" width="44" height="14" rx="5" fill="'+c+'"/>'+
   '<circle cx="11" cy="25" r="4.6" fill="var(--ink)"/><circle cx="35" cy="25" r="4.6" fill="var(--ink)"/>'+
   '<text x="23" y="21.5" text-anchor="middle" font-size="11" font-weight="700" fill="'+(k==='U'?'var(--ink)':'var(--card)')+'">'+(k==='L'?'lemon':k==='P'?'peach':'?')+'</text>';}
const SG_TAG={
  w:'<g transform="translate(-4,-6)"><path d="M0 2l7-3 7 3v5c0 4-3 7-7 8-4-1-7-4-7-8z" fill="var(--h2)" stroke="var(--card)" stroke-width="1.2"/><path d="M4 6.5l2.2 2.2L10 5" fill="none" stroke="var(--card)" stroke-width="1.6" stroke-linecap="round"/></g>',
  s:'<g transform="translate(42,0)"><circle r="7.5" fill="var(--ok-strong)" stroke="var(--card)" stroke-width="1.2"/><path d="M-3.5 0l2.5 2.5 4.5-5" fill="none" stroke="var(--card)" stroke-width="1.8" stroke-linecap="round"/></g>',
  i:'<g transform="translate(23,-5)"><circle r="5" fill="var(--card)" stroke="var(--pri)" stroke-width="2"/><path d="M3.6 3.6l4 4" stroke="var(--pri)" stroke-width="2.4" stroke-linecap="round"/></g>',
  j:'<g fill="var(--pri)"><path transform="translate(15,-4)" d="M0 -5L1.2 -1.2L5 0L1.2 1.2L0 5L-1.2 1.2L-5 0L-1.2 -1.2Z"/><path transform="translate(33,-1) scale(.75)" d="M0 -5L1.2 -1.2L5 0L1.2 1.2L0 5L-1.2 1.2L-5 0L-1.2 -1.2Z"/></g>'};

function sgLot(L,host,c,o){
  o=o||{};const id='lt'+(++SGN),X=v=>20+v/c.MAX*280,H=o.short?126:214;
  const st={mode:o.mode||'price',p:o.p!=null?o.p:c.LBUY,fix:o.fix||null,m:o.m!=null?o.m:6,jam:!!o.jam,hid:!!o.hidden,tags:o.tags||{},ro:o.ro||'',worthO:null,dim:o.dim||null};
  const pos=j=>[18+(j%5)*60,j<5?32:84];
  let s='<svg class="sg-svg" id="'+id+'" viewBox="0 0 320 '+H+'" role="img" aria-label="A used-car lot of ten cars, half lemons and half peaches'+(o.short?'':', above a price line')+'">';
  s+='<text x="8" y="13" font-size="11" font-weight="700" fill="var(--muted)" letter-spacing=".4">'+(o.title||'THE LOT')+'</text>';
  if(!st.hid)s+='<rect x="212" y="4" width="10" height="10" rx="3" fill="var(--h3)"/><text x="226" y="13" font-size="11" fill="var(--muted)">lemon</text><rect x="264" y="4" width="10" height="10" rx="3" fill="var(--h4)"/><text x="278" y="13" font-size="11" fill="var(--muted)">peach</text>';
  s+='<rect x="4" y="20" width="312" height="104" rx="12" fill="var(--soft)"/>';
  for(let j=0;j<=5;j++)s+='<path d="M'+(12+j*60)+' 28v38M'+(12+j*60)+' 80v38" stroke="var(--line2)" stroke-width="1.5" stroke-dasharray="3 4"/>';
  LOT_T.forEach((t,j)=>{const[x,y]=pos(j);s+='<g class="sg-car" data-j="'+j+'" style="transform:translate('+x+'px,'+y+'px)">'+sgCar(t,st.hid)+'<g class="tg"></g>'+
    (o.lab&&o.lab[j]?'<rect x="14" y="-17" width="18" height="15" rx="5" fill="var(--pri)"/><text x="23" y="-5.5" text-anchor="middle" font-size="11" font-weight="700" fill="var(--pri-ink)">'+o.lab[j]+'</text>':'')+'</g>';});
  if(!o.short){
    s+='<g class="ax"><rect x="'+X(c.LMIN)+'" y="158" width="'+(X(c.LBUY)-X(c.LMIN))+'" height="9" rx="3" fill="var(--h3-bg)" stroke="var(--h3)" stroke-width="1.3"/>'+
      '<rect x="'+X(c.PMIN)+'" y="158" width="'+(X(c.PBUY)-X(c.PMIN))+'" height="9" rx="3" fill="var(--h4-bg)" stroke="var(--h4)" stroke-width="1.3"/>'+
      '<path d="M20 172H300" stroke="var(--ink)" stroke-width="1.6"/>';
    for(let v=0;v<=c.MAX;v+=1000)s+='<path d="M'+X(v)+' 169v6" stroke="var(--ink)" stroke-width="1.4"/><text x="'+X(v)+'" y="187" text-anchor="middle" font-size="11" fill="var(--muted)">'+c.cur+(v?(v/1000)+'k':'0')+'</text>';
    const kk=v=>c.cur+(v/1000)+'k';
    s+='<rect x="20" y="196" width="9" height="9" rx="2" fill="var(--h3-bg)" stroke="var(--h3)"/><text x="33" y="204.5" font-size="11" fill="var(--muted)">lemon deals '+kk(c.LMIN)+'–'+kk(c.LBUY).slice(1)+'</text>'+
      '<rect x="170" y="196" width="9" height="9" rx="2" fill="var(--h4-bg)" stroke="var(--h4)"/><text x="183" y="204.5" font-size="11" fill="var(--muted)">peach deals '+kk(c.PMIN)+'–'+kk(c.PBUY).slice(1)+'</text>'+
      '<g class="fl"></g><g class="wd sg-mv" style="transform:translate('+X(2750)+'px,172px)"><path d="M0 -7L7 0L0 7L-7 0Z" fill="var(--pri)" stroke="var(--card)" stroke-width="1.5"/></g>'+
      '<g class="pm sg-mv" style="transform:translate('+X(st.p)+'px,0px)"><path d="M0 150V178" stroke="var(--ink)" stroke-width="2.5"/><text class="pt" y="146" font-size="11.5" font-weight="700" fill="var(--ink)" text-anchor="middle"></text></g></g><g class="cb"></g>';}
  s+='</svg>'+(o.short?'':'<p class="sg-key"></p>')+'<p class="sg-ro" aria-live="polite"></p>';
  const w=document.createElement('div');w.innerHTML=s;host.appendChild(w);
  function akerlof(R,p){R.on=LOT_T.map(t=>t==='L'?p>=c.LMIN:p>=c.PMIN);const nL=LOT_T.filter((t,j)=>t==='L'&&R.on[j]).length,nP=LOT_T.filter((t,j)=>t==='P'&&R.on[j]).length,n=nL+nP;
    R.worth=n?(nL*c.LBUY+nP*c.PBUY)/n:null;const deal=n>0&&p<=R.worth;R.sold=R.on.map(v=>v&&deal);R.price=p;return{nL,nP,n,deal};}
  function calc(){
    const T=LOT_T,R={on:T.map(()=>true),sold:T.map(()=>false),w:T.map(()=>false),i:false,ro:'',worth:null,price:null,flags:null,cb:null,axis:!o.short,sorted:false,key:''};
    if(st.mode==='static'){R.axis=!!o.axis&&!o.short;R.ro=st.ro;return R;}
    if(st.mode==='price'){const p=st.p,a=akerlof(R,p);R.key='<i>◆</i> what buyers think a car on the lot is worth · <b>|</b> the price on offer';
      if(st.worthO!=null)R.worth=st.worthO;
      if(st.ro)R.ro=st.ro;
      else if(!a.n)R.ro='At <b>'+sgM(c,p)+'</b> nobody sells: lemon owners want at least '+sgM(c,c.LMIN)+'.';
      else if(!a.nP)R.ro='Peach owners want at least '+sgM(c,c.PMIN)+', so they drive off. Only lemons are left, worth <b>'+sgM(c,c.LBUY)+'</b> to a buyer. '+(a.deal?'At '+sgM(c,p)+' buyers still gain, so the lemons sell.':'Paying '+sgM(c,p)+' for a lemon loses a buyer '+sgM(c,p-c.LBUY)+', so nobody buys.');
      else R.ro='All ten stay. Buyers can’t tell them apart, so a car is worth the average to them: <b>'+sgM(c,R.worth)+'</b>. '+(a.deal?'Buyers gain, so cars sell.':'Paying '+sgM(c,p)+' loses a buyer '+sgM(c,p-R.worth)+' a car on average, so nobody buys.');
      return R;}
    if(st.fix==='insp'){R.i=true;R.sold=T.map(()=>true);R.flags=[[c.LS,'--h3'],[c.WP,'--h4']];R.sorted=true;R.key='Each buyer pays a mechanic about '+sgM(c,c.FEE)+' a car (illustrative).';
      R.ro='Buyers’ own mechanic checks each car. Lemons sell near <b>'+sgM(c,c.LS)+'</b>, peaches near <b>'+sgM(c,c.WP)+'</b>: all ten trade. The check does it, not a seller’s offer to allow one: agreeing costs a lemon’s owner nothing.';return R;}
    if(st.fix==='wd'||st.fix==='wp'){const m=st.m,cl=(st.fix==='wp'?c.CL*0.3:c.CL)*m,cp=c.CP*m,gl=c.WP-c.LS,gp=c.WP-c.PMIN,lo=m>0&&cl<gl,po=m>0&&cp<=gp;
      R.axis=false;R.cb={cl,cp,gl,gp,lo,po,m};const pre=st.fix==='wp'?'A private seller can move away and never pay, so a lemon owner expects to cover only about a third of the repairs. ':'';
      if(po&&!lo){R.sorted=true;R.w=T.map(t=>t==='P');R.sold=T.map(()=>true);R.ro=pre+'<b>Sorted.</b> Only peach owners offer '+m+' months. Peaches sell with it near '+sgM(c,c.WP)+', lemons without near '+sgM(c,c.LS)+'. All ten trade.';}
      else if(po&&lo){akerlof(R,c.LBUY);R.w=T.map(()=>true);R.ro=pre+'<b>Lemon owners copy it.</b> '+m+' months costs them '+sgM(c,cl)+', less than the '+sgM(c,gl)+' they’d gain by passing as a peach. The warranty tells buyers nothing.';}
      else if(lo){akerlof(R,c.LBUY);R.w=T.map(t=>t==='L');R.ro=pre+'Too long for peach owners, yet a promise nobody can enforce still costs a lemon owner little. Now a warranty marks a lemon.';}
      else{akerlof(R,c.LBUY);R.ro=m?'<b>Too long:</b> even a peach owner’s repairs ('+sgM(c,cp)+') eat their '+sgM(c,gp)+' gain. Nobody offers it, and peaches leave again.':'No warranty: back to the lemons problem. Peaches leave.';}
      return R;}
    akerlof(R,c.LBUY);R.key='<i>◆</i> what buyers think a car on the lot is worth';R.ro='No fix yet: peach owners stay away and only lemons sell, at '+sgM(c,c.LBUY)+' or less. Pick a fix.';return R;}
  function cbars(b){
    const row=(y,nm,col,cost,gain,on)=>{const ww=Math.max(2,Math.min(cost/gain*150,222));
      return '<text x="8" y="'+(y+10)+'" font-size="11" font-weight="700" fill="var('+col+')">'+nm+'</text><rect x="92" y="'+y+'" width="222" height="12" rx="4" fill="var(--soft2)"/>'+
       '<rect x="92" y="'+y+'" width="'+ww+'" height="12" rx="4" fill="var('+col+')" opacity=".85"/><text x="8" y="'+(y+27)+'" font-size="11" fill="var(--muted)">repairs '+sgM(c,cost)+' vs gain '+sgM(c,gain)+' → <tspan font-weight="700" fill="var('+(on?'--ok':'--no')+')">'+(on?'offers it':'won’t offer')+'</tspan></text>';};
    return '<text x="8" y="137" font-size="11" font-weight="700" fill="var(--muted)" letter-spacing=".3">'+b.m+' MONTHS · REPAIRS (BAR) vs GAIN (LINE)</text>'+
      row(146,'Lemon owner','--h3',b.cl,b.gl,b.lo)+row(180,'Peach owner','--h4',b.cp,b.gp,b.po)+
      '<path d="M242 142v20M242 176v20" stroke="var(--ink)" stroke-width="2.2"/><path d="M237 141h10M237 175h10" stroke="var(--ink)" stroke-width="2"/>';}
  function upd(){

      const tg=st.tags[j]||'';g.querySelector('.tg').innerHTML=(R.w[j]||tg.includes('w')?SG_TAG.w:'')+(R.i||tg.includes('i')?SG_TAG.i:'')+(st.jam||tg.includes('j')?SG_TAG.j:'')+(R.sold[j]?SG_TAG.s:'');});
    if(!o.short){
      const ax=svg.querySelector('.ax'),cb=svg.querySelector('.cb');ax.style.display=R.axis?'':'none';cb.innerHTML=R.cb?cbars(R.cb):'';
      const wd=svg.querySelector('.wd'),pm=svg.querySelector('.pm');
      wd.style.opacity=R.worth!=null&&!R.flags?1:0;if(R.worth!=null)wd.style.transform='translate('+X(R.worth)+'px,172px)';
      pm.style.opacity=R.price!=null&&!R.flags?1:0;
      if(R.price!=null){const px=X(R.price);pm.style.transform='translate('+px+'px,0px)';const t=pm.querySelector('.pt');t.textContent='price '+sgM(c,R.price);t.setAttribute('text-anchor',px>255?'end':px<62?'start':'middle');t.setAttribute('x',px>255?6:px<62?-6:0);}
      svg.querySelector('.fl').innerHTML=R.flags?R.flags.map(f=>'<path d="M'+X(f[0])+' 150V178" stroke="var('+f[1]+')" stroke-width="2.5"/><text x="'+X(f[0])+'" y="146" text-anchor="middle" font-size="11.5" font-weight="700" fill="var('+f[1]+')">'+sgM(c,f[0])+'</text>').join(''):'';

  upd();return api;}

/* ---------- the two-door menu (screening by self-selection) ----------
   20 figures stand for a crowd; each picks the door that leaves it the most, or walks away. */
function sgDoors(L,host,cx){
  const id='dr'+(++SGN),ppl=[];cx.types.forEach(t=>{for(let n=0;n<t.n;n++)ppl.push(t);});
  for(let j=ppl.length-1;j>0;j--){const r=(j*7+3)%(j+1);[ppl[j],ppl[r]]=[ppl[r],ppl[j]];}
  const qp=j=>[24+(j%4)*19,42+Math.floor(j/4)*24];
  let s='<svg class="sg-svg" id="'+id+'" viewBox="0 0 320 176" role="img" aria-label="'+cx.aria+'">'+
   '<text x="51" y="14" text-anchor="middle" font-size="11" font-weight="700" fill="var(--muted)" letter-spacing=".4">QUEUE</text>'+
   '<rect x="6" y="22" width="90" height="148" rx="12" fill="var(--soft)"/><text class="ql" x="51" y="163" text-anchor="middle" font-size="11" fill="var(--muted)">type hidden</text>';
  ppl.forEach((t,j)=>{const[x,y]=qp(j);s+='<g transform="translate('+x+','+y+')" fill="none" stroke="var(--line2)" stroke-width="1.2"><circle cy="-7" r="3.8"/><rect x="-4.5" y="-2.5" width="9" height="10" rx="3.5"/></g>';});

   '<rect x="152" y="22" width="162" height="70" rx="12" fill="var(--soft)"/><rect x="152" y="102" width="162" height="70" rx="12" fill="var(--soft)"/>';

const sgN=(o,k)=>o[k]||0;
/* The book’s airline (Ch 8, Price Discrimination by Screening): business $300 first / $225 economy;
   tourists $175 / $140; costs $150 / $100. Each figure = 5 passengers. */
function AIR(f,e,half){const nb=half?10:6;return{aria:'A queue of travellers choosing between first class and economy',
  types:[{k:'b',nm:'Business traveller',col:'--h1',n:nb},{k:'t',nm:'Tourist',col:'--h2',n:20-nb}],st:{f,e},tie:{b:0,t:1},
  gain(k,d,st){if(d===1&&st.e==null)return -Infinity;const V=k==='b'?[300,225]:[175,140];return V[d]-(d?st.e:st.f);},
  label(d,st){return d?(st.e==null?'Economy · not offered':'Economy · $'+st.e):'First class · $'+st.f;},
  closed:st=>st.e==null,
  profit(st,c){return (sgN(c[0],'b')+sgN(c[0],'t'))*5*(st.f-150)+(sgN(c[1],'b')+sgN(c[1],'t'))*5*((st.e||0)-100);},
  sorted(c){return sgN(c[0],'b')===(half?10:6)&&sgN(c[1],'t')===(half?10:14);},
  ro(st,c){const p=this.profit(st,c),bf=300-st.f,be=st.e==null?null:225-st.e;
    const pill=this.sorted(c)?'<span class="sg-pill ok">Sorted: each type took its own door</span>':sgN(c[1],'b')?'<span class="sg-pill no">Business travellers defect to economy</span>':sgN(c[2],'t')?'<span class="sg-pill mid">Tourists walk away</span>':'<span class="sg-pill mid">Not sorted</span>';
    return pill+'<br>First: <b>'+sgN(c[0],'b')*5+'</b> business, <b>'+sgN(c[0],'t')*5+'</b> tourists · Economy: <b>'+sgN(c[1],'b')*5+'</b> business, <b>'+sgN(c[1],'t')*5+'</b> tourists'+(sgN(c[2],'t')+sgN(c[2],'b')?' · <b>'+(sgN(c[2],'t')+sgN(c[2],'b'))*5+'</b> walk away':'')+
     '<br>A business traveller keeps <b>$'+Math.max(bf,0)+'</b> in first'+(be==null?'':' or <b>$'+Math.max(be,0)+'</b> in economy')+' · Profit per 100 passengers: <b>$'+p.toLocaleString('en-GB')+'</b>';}};}
/* Plover’s junior-designer test (illustrative): strong designers likely pass and find the task quick
   (gain 36 − hours); weak ones rarely pass and find it slow (gain 8 − 2 × hours). */
function HIRE(h){return{aria:'A queue of junior-designer applicants choosing whether to take a test task',
  types:[{k:'s',nm:'Strong designer',col:'--h2',n:8},{k:'w',nm:'Weak designer',col:'--h4',n:12}],st:{h},tie:{s:1,w:1},
  gain(k,d,st){if(d===1)return 0;return k==='s'?36-st.h:8-2*st.h;},
  label(d,st){return d?'Don’t apply':'Test task · '+st.h+' h';},
  sorted(c){return sgN(c[0],'s')===8&&!sgN(c[0],'w');},
  ro(st,c){const s0=sgN(c[0],'s'),w0=sgN(c[0],'w');
    const pill=this.sorted(c)?'<span class="sg-pill ok">Sorted: only strong designers take the test</span>':w0?'<span class="sg-pill no">Weak designers apply too</span>':'<span class="sg-pill no">Even strong designers stay away</span>';
    return pill+'<br>Took the test: <b>'+s0+'</b> strong, <b>'+w0+'</b> weak · Cost of the screen: <b>'+s0*st.h+' hours</b> of strong designers’ time';}};}
/* The book’s balance-transfer card (Ch 8, positive selection). */
function CARDS(){return{aria:'Card customers choosing whether to move their balance to a new card',
  types:[{k:'m',nm:'Pays in full',col:'--h1',n:6},{k:'r',nm:'Borrows, repays',col:'--h2',n:8},{k:'d',nm:'Won’t repay',col:'--h4',n:6}],st:{},tie:{m:1,r:1,d:1},
  gain(k,d){return d===0&&k==='r'?1:0;},label(d){return d?'Stay with old card':'Balance-transfer offer';},
  ro(st,c){return '<span class="sg-pill ok">Only the profitable type walks in</span><br>Everyone who takes the offer borrows and repays. The card company never had to ask.';}};}

Course.lesson({
  id:'0009', title:'Reading and sending signals', minutes:20, icon:'info',
  goals:['Tell when someone’s words can be trusted, and spot the action that would cost too much for the wrong type',
         'See how hidden quality empties a market, and fix it with warranties, inspections and choices that make people sort themselves',
         'Read silences, shine and countersignals, and run the one-minute signals move on a purchase, a hire or a promise'],
  parts:['Words are cheap','The lemons lot','Doors and silences','Use it this week'],
  read:'Read chapter 8 of the book, “Interpreting and Manipulating Information”, for Akerlof’s lemons in full, the MBA as a screen, the pass/fail spiral, countersignalling, the poker bluff worked with Bayes’ rule and the airline fares.',
  glossary:{
   'signal-jamming':'Signal jamming: copying the action of a better type (cleaning the car before a sale) so that the action stops telling anyone anything.',
   countersignal:'Countersignalling: the strongest type refusing to signal at all, because signalling would mark them as someone who needs to.',
   'cost-difference':'Cost-difference rule: an action is a believable signal only if it costs the wrong type much more than the right type, so only the right type finds it worth taking.',
   'positive-selection':'Positive selection: an offer built so that only the people you want find it attractive, the reverse of adverse selection.'
  },
  cheatsheet:[
   '<b>Words are cheap when interests clash.</b> The bigger the conflict, the less a message tells you. If interests are fully opposed, ignore it: don’t believe it, and don’t assume the opposite.',
   '<b>Actions speak louder than words</b>, but only an action that would cost too much for the wrong type counts (a warranty: cheap on a good car, ruinous on a bad one).',
   '<b>Lemons:</b> when buyers can’t see quality, an average price drives the good sellers out. The book’s cars: at $2,750 peaches leave and the price falls to $1,500. That’s adverse selection.',
   '<b>Signalling</b>: the side that knows acts. <b>Screening</b>: the side that doesn’t sets a test or a menu that makes types choose differently (ask for a warranty; a short test task; first class vs economy).',
   'A menu sorts only if each type prefers its own option: keep the top price low enough that the top type doesn’t defect (the book’s first class: at most $215).',
   '<b>Silence speaks</b> (no warranty, a pass/fail grade). When everyone does it (the valet), it tells you nothing. The strongest may not signal at all.',
   '<b>One-minute move</b> (how this course applies the book): what do they know and gain? → actions, not words → would the other type do it too? → screen to find out → signal cheaply to show → notice what they didn’t do.',
   '<b>Limits:</b> signals can turn into a rat race; screens cost the good types too; people can tell the truth so as not to be believed. With people you’ll see again, a way to prove honesty helps both sides.'
  ],
  steps:[
/* =================== PART 1: WORDS ARE CHEAP =================== */

 run(L){

{part:0,src:'Chapter 8 · Tell It Like It Is?',

 run(L){

      s+='<circle cx="'+x+'" cy="128" r="12" fill="var('+w[1]+'-bg)" stroke="var('+w[1]+')" stroke-width="2"/><path d="M'+(x-17)+' 164c0-13 7-20 17-20s17 7 17 20z" fill="var('+w[1]+'-bg)" stroke="var('+w[1]+')" stroke-width="2"/>'+
       '<rect x="'+(j?166:6)+'" y="92" width="148" height="24" rx="9" fill="var(--card)" stroke="var('+w[1]+')" stroke-width="1.4"/><text x="'+(j?240:80)+'" y="108" text-anchor="middle" font-size="11" fill="var(--ink)">'+w[3]+'</text>'+
       '<text x="'+x+'" y="'+(j?86:86)+'" text-anchor="middle" font-size="11" font-weight="700" fill="var('+w[1]+')">'+w[2]+'</text>';});
    if(m)s+='<rect x="96" y="150" width="128" height="22" rx="11" fill="var('+(ok?'--ok-bg':'--no-bg')+')"/><text x="160" y="165" text-anchor="middle" font-size="11" font-weight="700" fill="var('+(ok?'--ok':'--no')+')">'+(ok?'King can tell them apart':'Same words: no way to tell')+'</text>';
    L.$('#ssv').innerHTML=s;}
  const T={1:'The rival’s answer gives her away, and the child goes to the real mother. The test worked, but only because the rival blundered.',2:'A rival who understood the test would just copy the real mother. Both say the same thing, and the king learns nothing.'};
  [1,2].forEach(m=>L.$('#sm'+m).onclick=()=>{draw(m);L.$$('.sg-chips .chip').forEach((b,q)=>b.classList.toggle('sel',q===m-1));L.$('#sro').innerHTML=T[m];seen.add(m);
    if(seen.size===2&&!fin){fin=true;L.sheet('info','More lucky than wise','The book’s verdict: the king’s test only worked because of the rival’s mistake. A test that the wrong type can simply copy reveals nothing. The answer must cost the wrong type something the right type doesn’t mind paying. (The book offers what Solomon should have done as a case in its last chapter.)');L.done();}});

{part:0,src:'Chapter 8 · Devices for Manipulating Information',
 solve:async L=>{for(const k of ['sig','jam','scr']){L.$('#dv [data-k="'+k+'"]').click();await L.sleep(10);}},
 run(L){
  let fin=false;const seen=new Set();
  L.h(L.kick('learn','Actions speak louder than words')+'<h1 class="q">Three moves in every game of hidden information. Tap each.</h1>'+
   '<div class="sg-chips" id="dv"></div><svg class="sg-svg" id="dsv" viewBox="0 0 320 150" role="img" aria-label="Picture of the chosen device"></svg><p class="sg-cap" id="dcap">Someone knows something you don’t. They will act on it, and you can read their actions.</p>');
  const lab=(x,y,t,col,b)=>'<text x="'+x+'" y="'+y+'" text-anchor="middle" font-size="11.5"'+(b?' font-weight="700"':'')+' fill="var('+(col||'--ink')+')">'+t+'</text>';
  const V={
   sig:['Signal',()=>'<rect width="320" height="150" rx="14" fill="var(--soft)"/><g transform="translate(56,30)">'+sgCar('P')+SG_TAG.w+'</g><g transform="translate(218,30)">'+sgCar('L')+SG_TAG.w+'</g><path d="M212 18l60 52M272 18l-60 52" stroke="var(--no)" stroke-width="3" stroke-linecap="round" opacity=".8"/>'+
     lab(79,88,'Good car: a warranty','--h4',1)+lab(79,104,'costs its owner little')+lab(241,88,'Bad car: a warranty','--h3',1)+lab(241,104,'would cost a fortune')+lab(160,136,'The side that knows acts. Only one type can afford to.','--muted'),
     'The side that knows takes an action that would cost too much for the other type (a long warranty). The economist Michael Spence showed it works only through that cost difference.'],
   jam:['Signal jamming',()=>{let s='<rect width="320" height="150" rx="14" fill="var(--soft)"/><g transform="translate(56,30)">'+sgCar('P')+SG_TAG.j+'</g><g transform="translate(218,30)">'+sgCar('L')+SG_TAG.j+'</g>';
     return s+lab(79,88,'Careful owner','--h4',1)+lab(79,104,'valets the car')+lab(241,88,'Careless owner','--h3',1)+lab(241,104,'valets it too')+lab(160,136,'Copy the other type’s action, and it tells you nothing.','--muted');},
     'The side that knows hides bad news by copying what the better type does: '+L.g('signal-jamming','signal jamming')+'. A shine costs a careless owner no more than a careful one, so the shine stops meaning anything.'],
   scr:['Screening',()=>'<rect width="320" height="150" rx="14" fill="var(--soft)"/><circle cx="30" cy="52" r="10" fill="var(--h2-bg)" stroke="var(--h2)" stroke-width="2"/><path d="M16 86c0-12 6-18 14-18s14 6 14 18z" fill="var(--h2-bg)" stroke="var(--h2)" stroke-width="2"/>'+lab(30,104,'Buyer','--h2',1)+
     '<rect x="70" y="14" width="112" height="44" rx="8" fill="var(--card)" stroke="var(--ink)" stroke-width="1.6"/>'+lab(126,32,'Door A: $800 extra','--ink',1)+lab(126,48,'with a warranty')+
     '<rect x="70" y="70" width="112" height="44" rx="8" fill="var(--card)" stroke="var(--ink)" stroke-width="1.6"/>'+lab(126,88,'Door B: as it is','--ink',1)+lab(126,104,'no warranty')+
     '<g transform="translate(222,24) scale(.85)">'+sgCar('P')+'</g><path d="M218 38h-30" stroke="var(--h4)" stroke-width="2.5"/><g transform="translate(222,80) scale(.85)">'+sgCar('L')+'</g><path d="M218 94h-30" stroke="var(--h3)" stroke-width="2.5"/>'+
     lab(160,138,'The side that doesn’t know sets the test.','--muted'),
     'The side that doesn’t know sets up a choice that each type answers differently: '+L.g('screening','screening')+'. Sue’s tattoo request was this kind of test. The choice reveals what words never could.']};
  Object.keys(V).forEach(k=>{const b=document.createElement('button');b.className='chip';b.dataset.k=k;b.textContent=V[k][0];
    b.onclick=()=>{L.$('#dsv').innerHTML=V[k][1]();L.$('#dcap').innerHTML=V[k][2];L.$$('#dv .chip').forEach(x=>x.classList.toggle('sel',x===b));seen.add(k);
      if(seen.size===3&&!fin){fin=true;L.sheet('info','Watch what they do, not what they say','The book’s general rule: actions speak louder than words. People know their actions are read, so they choose them for what they reveal (signalling) or hide (jamming), and you can design choices that make them reveal it (screening).');L.done();}};L.$('#dv').appendChild(b);});
  L.$('#dsv').innerHTML=V.sig[1]();L.$('#dcap').innerHTML=V.sig[2];L.$('#dv [data-k="sig"]').classList.add('sel');seen.add('sig');}},

{part:0,src:'Chapter 8 · Is the Quality Guaranteed?',pts:1,run(L){
  L.h(L.kick('try','The rule')+'<h1 class="q">Build the rule for when an action can be trusted. Tap a piece to change it.</h1>');
  L.sentence(L.card,[['A seller’s words','A seller’s action'],['count as evidence only if','always count, because'],['they would cost too much','they cost something'],['for a seller whose car is bad.','for any seller at all.']],[1,0,0,0],
   [['Words cost nothing to say, so the owner of a bad car can say them too.'],['Not always: if a bad car’s owner would take the same action, it tells you nothing.'],['Costing something isn’t enough: a valet costs something, but the same for everyone. The cost must differ by type.'],['If it’s too costly for every seller, nobody does it and you learn nothing. It must stay affordable for a good car.']],
   'A seller’s action counts only if it would cost too much for a seller whose car is bad. That’s the '+L.g('cost-difference','cost-difference property')+', and it’s why a warranty can be believed when “trust me” can’t.');}},

{part:1,src:'Chapter 8 · A Little History',
 solve:async L=>{sgSet(L.$('#lp'),2000);await L.sleep(1000);},
 run(L){
  let fin=false,a=false,b=true;
  L.h(L.kick('learn','Explore · the lemons lot')+'<h1 class="q">Ten used cars, half lemons, half peaches. Only sellers know which is which. Drag the price down and watch.</h1>'+
   '<div id="lh"></div><label class="sg-sl" for="lp"><span class="h"><span>Price buyers offer</span><b id="lpv">$3,500</b></span><input type="range" id="lp" min="500" max="4500" step="250" value="3500"></label>'+

{part:1,src:'Chapter 8 · A Little History',pts:1,
 solve:async L=>{L.$('#pq').children[1].click();await L.sleep(2700);},
 run(L){
  let fin=false;
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">Buyers know half the cars are peaches, so they offer the average value: $2,750. What happens?</h1>'+
   '<div id="ph"></div><div class="opts" id="pq"></div>');

  ['All ten cars sell at $2,750','Peaches leave; only lemons sell, at about $1,500','Lemons leave; only peaches sell, at $2,750'].forEach((t,j)=>{const x=document.createElement('button');x.className='opt';x.innerHTML='<span class="key">'+(j+1)+'</span><span>'+t+'</span>';
    x.onclick=()=>{if(fin)return;fin=true;const ok=j===1;L.award(ok);x.classList.add(ok?'ok':'no');if(!ok)L.$('#pq').children[1].classList.add('ok');[...L.$('#pq').children].forEach(b=>b.setAttribute('aria-disabled','true'));
      lot.set({mode:'price',p:2750,worthO:2750,ro:'At $2,750, peach owners (who want $3,000) drive off…'});

{part:1,src:'Chapter 8 · A Little History',
 solve:async L=>{for(let k=0;k<3;k++){L.$('#ib').click();await L.sleep(20);}},
 run(L){
  L.h(L.kick('learn','Adverse selection')+'<h1 class="q">The same trap in insurance: raise the price, and the good risks leave</h1>'+
   '<svg class="sg-svg" id="isv" viewBox="0 0 320 150" role="img" aria-label="Ten people, each with a different chance of a claim; who buys insurance at the current premium"></svg>'+
   '<p class="sg-ro" id="iro" aria-live="polite"></p><div class="sg-ctl"><button class="btn pri" id="ib">'+L.ic('trend')+'Insurer raises the premium to cover claims</button></div><p class="sg-ill">Illustrative numbers. People also buy some cover simply to protect their families.</p>');
  let prem=5,fin=false;
  const buys=r=>r>=prem-2;
  function draw(){const B=[...Array(10).keys()].map(j=>j+1).filter(buys),avg=B.reduce((a,b)=>a+b,0)/B.length;
    let s='<rect width="320" height="150" rx="14" fill="var(--soft)"/><text x="12" y="20" font-size="11" font-weight="700" fill="var(--muted)" letter-spacing=".3">PREMIUM: '+(+prem.toFixed(1))+'¢ PER $1 OF COVER</text>';
    for(let r=1;r<=10;r++){const x=22+(r-1)*30.5,on=buys(r),c='var(--h1)';
      s+='<g class="sg-mv" style="transform:translate('+x+'px,'+(on?62:84)+'px);opacity:'+(on?1:.35)+'"><circle cy="-8" r="6" fill="'+c+'"/><rect x="-7" y="0" width="14" height="16" rx="5" fill="'+c+'"/></g>'+
       '<text x="'+x+'" y="122" text-anchor="middle" font-size="11" fill="var(--muted)">'+r+'%</text>';}
    s+='<text x="12" y="140" font-size="11" fill="var(--muted)">each person’s chance of a claim · faded = didn’t buy</text>';
    L.$('#isv').innerHTML=s;
    const lose=avg>prem+0.01;
    L.$('#iro').innerHTML='<b>'+B.length+' of 10</b> buy. Their average claim chance: <b>'+avg.toFixed(1)+'%</b>, '+(lose?'above the '+(+prem.toFixed(1))+'% premium, so the insurer loses money.':'equal to the premium. The pool has shrunk to the riskiest half.');
    return {avg,lose};}
  L.$('#ib').onclick=()=>{const r=draw();if(r.lose){prem=r.avg;const r2=draw();if(!r2.lose&&!fin){fin=true;L.$('#ib').disabled=true;
    L.sheet('info','The book’s name for it: adverse selection',L.g('adverse-selection','Adverse selection')+': a policy priced for the average attracts the worst risks most. Raise the price and the good risks drop out, leaving worse ones. Anyone happy to buy at that price is someone you’d rather not insure. Same logic as the lemons, which only sell at an average price.');L.done();}}};
  draw();}},

{part:1,src:'Chapter 8 · Is the Quality Guaranteed?',
 solve:async L=>{L.$('#fx [data-k="insp"]').click();await L.sleep(20);L.$('#fx [data-k="wp"]').click();await L.sleep(20);L.$('#fx [data-k="wd"]').click();await L.sleep(20);sgSet(L.$('#fm'),18);await L.sleep(1000);},
 run(L){
  let fin=false;const seen=new Set();
  L.h(L.kick('ex','Fix the lot')+'<h1 class="q">How do real markets cope? Try each fix, and find a warranty length that sorts the lot.</h1>'+
   '<div class="sg-chips" id="fx"></div><div id="fh"></div><label class="sg-sl" for="fm" id="fml" hidden><span class="h"><span>Warranty length</span><b id="fmv">6 months</b></span><input type="range" id="fm" min="0" max="24" step="1" value="6"></label>'+
   '<p class="sg-ill">Book’s car values; repair costs per month ($25 for a peach, $150 for a lemon) are illustrative.</p>');
  const lot=sgLot(L,L.$('#fh'),LOT_BOOK,{mode:'fix',fix:null,m:6});
  function chk(){if(lot.R&&lot.R.sorted&&lot.st.fix==='wd')seen.add('sorted');
    if(seen.has('insp')&&seen.has('wp')&&seen.has('sorted')&&!fin){fin=true;
      L.sheet('info','A fix works when it costs the wrong type more','A warranty sorts the lot only in a window: long enough that lemon owners won’t copy it, short enough that peach owners still gain. It must be enforceable: a dealer with a name to protect pays; a private seller may vanish. The buyer’s own check works too, but a seller’s offer to allow one proves nothing: a lemon’s owner loses nothing by agreeing. Markets also use friends who know cars, and owners forced to sell good cars when they move.');L.done();}}
  [['wd','Dealer warranty'],['wp','Private warranty'],['insp','Inspection']].forEach(f=>{const b=document.createElement('button');b.className='chip';b.dataset.k=f[0];b.textContent=f[1];
    b.onclick=()=>{L.$$('#fx .chip').forEach(x=>x.classList.toggle('sel',x===b));L.$('#fml').hidden=f[0]==='insp';lot.set({fix:f[0]});seen.add(f[0]);chk();};L.$('#fx').appendChild(b);});
  L.$('#fm').addEventListener('input',e=>{const m=+e.target.value;L.$('#fmv').textContent=m+' month'+(m===1?'':'s');lot.set({m});chk();});}},

{part:1,src:'Chapter 8 · Is the Quality Guaranteed?',pts:1,
 solve:async L=>{sgSet(L.$('#wp'),800);L.$('#wb').click();},
 run(L){
  let fin=false;const X=v=>20+v/2500*280;
  L.h(L.kick('try','Screen the seller')+'<h1 class="q">Tali can ask for a warranty and offer extra for it. Set an extra that only a good car’s seller would accept.</h1>'+
   '<svg class="sg-svg" id="wsv" viewBox="0 0 320 152" role="img" aria-label="Two sellers and a line of possible extra payments for a warranty"></svg>'+
   '<label class="sg-sl" for="wp"><span class="h"><span>Extra Tali pays for a warranty</span><b id="wpv">$0</b></span><input type="range" id="wp" min="0" max="2500" step="100" value="0"></label>'+
   '<div class="sg-ctl"><button class="btn pri" id="wb">'+L.ic('check')+'Make this offer</button></div><p class="sg-ill">The book’s numbers: expected repairs of $500 on a good car, $2,000 on a bad one.</p>');
  function draw(v){const gA=v>500,bA=v>2000;
    let s='<rect width="320" height="152" rx="14" fill="var(--soft)"/>'+
     '<g transform="translate(14,12)">'+sgCar('P')+'</g><text x="66" y="24" font-size="11" fill="var(--ink)">repairs $500</text>'+
     '<text x="66" y="40" font-size="11.5" font-weight="700" fill="var('+(gA?'--ok':'--no')+')">'+(gA?'✓ accepts':'✗ refuses')+'</text>'+
     '<g transform="translate(170,12)">'+sgCar('L')+'</g><text x="222" y="24" font-size="11" fill="var(--ink)">repairs $2,000</text>'+
     '<text x="222" y="40" font-size="11.5" font-weight="700" fill="var('+(bA?'--ok':'--no')+')">'+(bA?'✓ accepts':'✗ refuses')+'</text>'+
     '<rect x="20" y="78" width="'+(X(500)-20)+'" height="14" fill="var(--no-bg)"/><rect x="'+X(500)+'" y="78" width="'+(X(2000)-X(500))+'" height="14" fill="var(--ok-bg)"/><rect x="'+X(2000)+'" y="78" width="'+(300-X(2000))+'" height="14" fill="var(--h3-bg)"/>'+
     '<path d="M20 92H300" stroke="var(--ink)" stroke-width="1.5"/>';
    [0,500,1000,1500,2000,2500].forEach(t=>{s+='<path d="M'+X(t)+' 89v7" stroke="var(--ink)" stroke-width="1.3"/><text x="'+X(t)+'" y="108" text-anchor="middle" font-size="11" fill="var(--muted)">$'+(t>=1000?(t/1000)+'k':t)+'</text>';});
    s+='<text x="'+((20+X(500))/2)+'" y="126" text-anchor="middle" font-size="11" fill="var(--no)">nobody</text><text x="'+((X(500)+X(2000))/2)+'" y="126" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ok)">only good cars: sorted</text><text x="'+((X(2000)+300)/2)+'" y="126" text-anchor="middle" font-size="11" fill="var(--h3)">everyone</text>'+
     '<g class="sg-mv" style="transform:translate('+X(v)+'px,0)"><path d="M0 74l-7-12h14z" fill="var(--pri)"/><path d="M0 74v22" stroke="var(--pri)" stroke-width="2.5"/></g>'+
     '<text x="160" y="146" text-anchor="middle" font-size="11" fill="var(--muted)">A seller accepts if the extra beats their expected repairs.</text>';
    L.$('#wsv').innerHTML=s;L.$('#wpv').textContent='$'+v.toLocaleString('en-GB');}
  L.$('#wp').addEventListener('input',e=>draw(+e.target.value));
  L.$('#wb').onclick=()=>{if(fin)return;fin=true;const v=+L.$('#wp').value,ok=v>500&&v<2000;L.award(ok);L.$('#wb').disabled=true;
    L.sheet(ok?'ok':'no',ok?'Only the good car’s seller says yes':'That offer doesn’t sort them',(ok?'':'At $'+v.toLocaleString('en-GB')+(v<=500?' nobody accepts.':' every seller accepts, bad cars included.')+' ')+'Any extra between $500 and $2,000 makes the two kinds of seller act differently, so a “yes” tells Tali the car is good. The book uses $800. Asking for it is screening. Hyundai sent the same message in 1999 with an unusually long warranty, to prove its quality had improved.');L.done();};
  draw(0);}},

{part:1,src:'Chapter 8 · Is the Quality Guaranteed?',pts:1,
 solve:async L=>{sgSet(L.$('#cm'),11);await L.sleep(900);L.$('#cb').click();},
 run(L){
  let fin=false;
  L.h(L.kick('pr','Challenge · Tali’s car')+'<h1 class="q">Juno finds a small dealer with ten similar cars. How long a warranty should Tali ask for, so only peach owners agree?</h1>'+
   '<div id="ch"></div><label class="sg-sl" for="cm"><span class="h"><span>Warranty Tali asks for</span><b id="cmv">3 months</b></span><input type="range" id="cm" min="0" max="24" step="1" value="3"></label>'+
   '<div class="sg-ctl"><button class="btn pri" id="cb">'+L.ic('check')+'Ask for this warranty</button></div><p class="sg-ill">Illustrative numbers: repairs cost £30 a month on a peach, £200 on a lemon.</p>');

  L.$('#cm').addEventListener('input',e=>{const m=+e.target.value;L.$('#cmv').textContent=m+' month'+(m===1?'':'s');lot.set({m});});
  L.$('#cb').onclick=()=>{if(fin)return;fin=true;const m=+L.$('#cm').value,ok=m>=9&&m<=13;L.award(ok);L.$('#cb').disabled=true;
    L.sheet(ok?'ok':'no',ok?'Sorted: a yes now means a peach':m<9?'Too short: lemon owners copy it':'Too long: even peach owners refuse','Here, 9 to 13 months sorts the lot. Shorter, and a lemon owner’s repairs cost less than the £1,800 they gain by passing as a peach. Longer, and a peach owner’s repairs eat their £400 gain. So the private seller’s 3-month warranty tells Tali little: it’s cheap for a lemon owner too.');L.done();};}},

{part:2,src:'Chapter 8 · Price Discrimination by Screening',
 solve:async L=>{await L.sleep(350);sgSet(L.$('#af'),200);await L.sleep(1800);},
 run(L){
  let fin=false;
  L.h(L.kick('learn','Explore · two doors')+'<h1 class="q">An airline can’t tell business travellers from tourists. Set the fares so each type picks its own door.</h1>'+
   '<div id="ah"></div>'+
   '<label class="sg-sl" for="af"><span class="h"><span>First-class fare</span><b id="afv">$300</b></span><input type="range" id="af" min="150" max="320" step="5" value="300"></label>'+
   '<label class="sg-sl" for="ae"><span class="h"><span>Economy fare</span><b id="aev">$140</b></span><input type="range" id="ae" min="100" max="240" step="5" value="140"></label>'+
   '<p class="sg-ill">The book’s airline: 30% business travellers (first is worth $300 to them, economy $225), 70% tourists ($175, $140). Each figure is 5 passengers.</p>');
  const cx=AIR(300,140);
  cx.onRoute=c=>{if(cx.sorted(c)&&!fin){fin=true;
    L.sheet('info','Sorted without asking anyone','Each type chose its own door, so the airline charged each type differently without knowing who was who. That’s screening by a menu, an idea set out most clearly for insurance plans.');L.done();}};
  const d=sgDoors(L,L.$('#ah'),cx);let tm=null;
  const go=()=>{clearTimeout(tm);tm=setTimeout(()=>{if(document.getElementById('ah'))d.route();},90);};

{part:2,src:'Chapter 8 · Screening and Signaling',pts:1,

{part:2,src:'Chapter 8 · Price Discrimination by Screening; Signaling via Bureaucracy',
 solve:async L=>{for(const b of L.$$('#ev .chip')){b.click();await L.sleep(20);}},
 run(L){
  let fin=false;const seen=new Set();
  L.h(L.kick('ex','Everyday screens')+'<h1 class="q">A worse version or a hassle, on purpose. Tap each to see who it sorts.</h1>'+
   '<svg class="sg-svg" id="esv" viewBox="0 0 320 168" role="img" aria-label="Two kinds of people, two options, and which option each kind picks"></svg><div class="sg-chips" id="ev"></div><p class="sg-cap" id="ecap"></p>');
  const fig=(x,y,col)=>'<circle cx="'+x+'" cy="'+(y-9)+'" r="7" fill="var('+col+'-bg)" stroke="var('+col+')" stroke-width="2"/><path d="M'+(x-10)+' '+(y+13)+'c0-9 4-14 10-14s10 5 10 14z" fill="var('+col+'-bg)" stroke="var('+col+')" stroke-width="2"/>';
  const tx=(x,y,t,o)=>'<text x="'+x+'" y="'+y+'" font-size="'+(o&&o.b?'11.5" font-weight="700':'11')+'" fill="var('+((o&&o.c)||'--ink')+')"'+(o&&o.m?' text-anchor="middle"':'')+'>'+t+'</text>';
  const E=[
   ['bk','Hardcover, then paperback',['Wants it now','Happy to wait'],[['Hardcover','out now · high price'],['Paperback','a year later · cheap']],'Printing costs differ little','The wait is the screen. Readers keen to read now pay more; patient readers wait for the cheap edition. The publisher never has to ask who is who.'],
   ['pr','The slowed printer',['Office: needs speed','Home: can wait'],[['Fast model','10 pages a minute'],['E model · $200 less','5 pages a minute']],'Same printer: a chip slows the E','The book’s case: IBM added a chip to slow its cheaper laser printer. Without the slow version, it would have had to sell every printer at one price.'],
   ['fm','Forms and a day’s wait',['Truly can’t work','Healthy, could earn'],[['Claim','forms + a day in an office'],['Skip it','go to work instead']],'A lost day costs the earner more','The book’s case: long forms and a day of waiting cost a healthy person a day’s pay, but cost someone truly unable to work far less. The hassle screens out false claims.'],
   ['wc','A wheelchair, not cash',['Needs a wheelchair','Pretending'],[['Takes it','uses it every day'],['Doesn’t bother','resale: effort, low price']],'Cash would tempt pretenders','Benefits in kind work the same way. Cash attracts people who pretend; a wheelchair is worth little to someone who doesn’t need one, so only those who need it claim.']];
  function draw(e){
    let s='<rect width="320" height="168" rx="14" fill="var(--soft)"/>'+tx(12,20,'TWO TYPES',{b:1,c:'--muted'})+tx(178,20,'TWO OPTIONS',{b:1,c:'--muted'});
    [['--h1',60],['--h2',114]].forEach((r,j)=>{const y=r[1];s+=fig(24,y,r[0])+tx(42,y+4,e[2][j],{b:1,c:r[0]});
      s+='<rect x="178" y="'+(y-20)+'" width="132" height="40" rx="9" fill="var(--card)" stroke="var('+r[0]+')" stroke-width="1.8"/>'+tx(244,y-4,e[3][j][0],{b:1,m:1})+tx(244,y+12,e[3][j][1],{m:1,c:'--muted'});});
    L.$('#esv').innerHTML=s+'<rect x="12" y="140" width="296" height="22" rx="11" fill="var(--pri-bg)"/>'+tx(160,155,e[4],{b:1,m:1,c:'--pri-deep'});
    L.$('#ecap').innerHTML=e[5];}
  E.forEach(e=>{const b=document.createElement('button');b.className='chip';b.dataset.k=e[0];b.textContent=e[1];
    b.onclick=()=>{L.$$('#ev .chip').forEach(x=>x.classList.toggle('sel',x===b));draw(e);seen.add(e[0]);
      if(seen.size===E.length&&!fin){fin=true;L.sheet('info','A hassle that costs one type more is a screen','People call these waste, but each one makes the types choose differently.<br><br><b>How this course applies the book:</b> an off-peak gym pass or an off-peak train ticket is the same trick. When you meet one, ask what your choice reveals; when you set one, make the hassle land on the type you want to filter out.');L.done();}};
    L.$('#ev').appendChild(b);});
  L.$('#ev .chip').classList.add('sel');draw(E[0]);seen.add('bk');}},

{part:2,src:'Chapter 8 · Signaling by Not Signaling',
 solve:async L=>{for(let k=0;k<3;k++){L.$('#ub').click();await L.sleep(20);}},
 run(L){
  let fin=false,round=0;
  L.h(L.kick('learn','The dog that didn’t bark')+'<h1 class="q">Some courses can be taken pass/fail. Watch what a “P” comes to mean. Tap each term.</h1>'+
   '<svg class="sg-svg" id="usv" viewBox="0 0 320 170" role="img" aria-label="Students moving from the pass/fail box to the letter-grade box"></svg>'+
   '<p class="sg-ro" id="uro" aria-live="polite"></p><div class="sg-ctl"><button class="btn pri" id="ub">'+L.ic('play')+'Next term: who switches?</button></div><p class="sg-ill">Each student knows their likely grade. Illustrative grades.</p>');
  const G=[4.3,4.0,4.0,3.7,3.7,3.3,3.3,3.0,2.3,1.7],LT=[[4.3,'A+'],[4,'A'],[3.7,'A−'],[3.3,'B+'],[3,'B'],[2.7,'B−'],[2.3,'C+'],[2,'C'],[1.7,'C−']];
  const let_=v=>LT.reduce((b,x)=>Math.abs(x[0]-v)<Math.abs(b[0]-v)?x:b)[1];
  const inP=G.map(()=>true),order=[];
  let s='<rect x="4" y="22" width="152" height="118" rx="12" fill="var(--soft)"/><rect x="164" y="22" width="152" height="118" rx="12" fill="var(--h1-bg)"/>'+
   '<text x="80" y="15" text-anchor="middle" font-size="11" font-weight="700" fill="var(--muted)" letter-spacing=".4">LETTER GRADE</text><text x="240" y="15" text-anchor="middle" font-size="11" font-weight="700" fill="var(--h1)" letter-spacing=".4">PASS / FAIL</text>';
  G.forEach((g,j)=>{s+='<g class="sg-mv" id="us'+j+'"><circle r="13" fill="var(--card)" stroke="var(--h1)" stroke-width="2"/><text y="4" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">'+let_(g)+'</text></g>';});
  s+='<text id="upr" x="240" y="160" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--pri)"></text><text x="80" y="160" text-anchor="middle" font-size="11" fill="var(--muted)">grade shows</text>';
  L.$('#usv').innerHTML=s;
  function place(){let p=0;G.forEach((g,j)=>{const el=L.$('#us'+j);let x,y;if(inP[j]){x=186+(p%5)*27;y=50+Math.floor(p/5)*36;p++;}else{const q=order.indexOf(j);x=26+(q%5)*27;y=50+Math.floor(q/5)*36;}el.style.transform='translate('+x+'px,'+y+'px)';});
    const P=G.filter((g,j)=>inP[j]),avg=P.reduce((a,b)=>a+b,0)/P.length;L.$('#upr').textContent='A “P” is read as: '+let_(avg);return avg;}
  const avg0=place();
  L.$('#uro').innerHTML='Everyone starts on pass/fail, so readers take a P as the average: <b>'+let_(avg0)+'</b>. Anyone expecting better than that gains by showing their letter grade.';
  L.$('#ub').onclick=()=>{if(fin)return;round++;const P=G.filter((g,j)=>inP[j]),avg=P.reduce((a,b)=>a+b,0)/P.length;let n=0;
    G.forEach((g,j)=>{if(inP[j]&&g>avg+0.01){inP[j]=false;order.push(j);n++;}});const na=place();
    const left=G.filter((g,j)=>inP[j]),more=left.some(g=>g>na+0.01);
    L.$('#uro').innerHTML='Term '+round+': <b>'+n+'</b> '+(n===1?'student switches':'students switch')+' to letter grades. The pass/fail pool loses its top, so a P now reads as <b>'+let_(na)+'</b>.';
    if(!more){fin=true;L.$('#ub').disabled=true;
      L.sheet('info','Not signalling is a signal','In the Sherlock Holmes story the clue was a dog that did <i>not</i> bark. Here, the best students show their grades, so choosing pass/fail ends up meaning “C or worse”. If you could take an action that shows something good and don’t, people read that. The book’s friend John learned it too: his right to co-invest in deals meant that not investing would read as a bad sign.');L.done();}};}},

{part:2,src:'Chapter 8 · Screening and Signaling',pts:7,run(L){

   ['Plover asks each junior-designer applicant to do a short paid test task.',1,'Plover, who knows less, sets a task that strong and weak designers answer differently: a screen.'],
   ['Before the promotion decision, Tali volunteers to run Plover’s hardest client.',0,'Tali, who knows their own drive, takes an action that would be a costly mistake for someone less committed or able: a signal.'],

{part:3,src:'Course application · built on Chapter 8',pts:1,
 solve:async L=>{L.$('#ob').click();await L.sleep(20);L.$('#ob').click();await L.sleep(20);L.$('#oa1').click();L.$('#oa2').click();await L.sleep(20);L.$('#ob').click();await L.sleep(20);L.$('#oq').children[0].click();await L.sleep(20);L.$('#ob').click();await L.sleep(20);L.$('#ob').click();},
 run(L){
  let s=0,fin=false,graded=false;const tapped=new Set();
  L.h(L.kick('pr','One-minute move')+'<h1 class="q">Tali and Juno compare two private sellers’ cars. Run the move.</h1>'+
   L.note('How this course applies the book: a one-minute routine built only from chapter 8’s ideas.','compass')+
   '<div class="sg-steps" id="osp"><span>1 · Know</span><span>2 · Acts</span><span>3 · Copy?</span><span>4 · Screen</span><span>5 · Show</span><span>6 · Silence</span></div>'+
   '<div id="oh"></div><div class="sg-two" id="otw"></div><div class="sg-say" id="osay" aria-live="polite"></div><div class="sg-ctl" id="oac"></div><div class="opts" id="oq"></div><div class="sg-ctl"><button class="btn pri" id="ob"></button></div>');
  const lot=sgLot(L,L.$('#oh'),LOT_TALI,{mode:'static',short:true,hidden:true,lab:{2:'A',6:'B'},dim:[2,6],tags:{2:'w',6:'j'},title:'TWO PRIVATE SELLERS · TYPE HIDDEN'});
  const say=(h,x)=>L.$('#osay').innerHTML='<b class="h">'+h+'</b>'+x;
  const cards=(strike)=>{L.$('#otw').innerHTML='<div><b>SELLER A</b>Says: '+(strike?'<s>“Barely driven.”</s>':'“Barely driven.”')+'<br>Does: offers a 3-month warranty</div><div><b>SELLER B</b>Says: '+(strike?'<s>“Never had a problem.”</s>':'“Never had a problem.”')+'<br>Does: freshly valeted</div>';};
  function go(n){s=n;L.$$('#osp span').forEach((p,j)=>p.className=j<n?'dn':j===n?'cur':'');const b=L.$('#ob');b.hidden=false;L.$('#oac').innerHTML='';
    if(n===0){cards(false);say('STEP 1 · WHAT DO THEY KNOW, WHAT DO THEY GAIN?','Each seller knows their car’s history; Tali doesn’t. Both gain from a higher price, whatever the truth. So their interests clash with Tali’s.');b.innerHTML='Next '+L.ic('arrow');}
    if(n===1){cards(true);say('STEP 2 · ACTIONS, NOT WORDS','Strike out the words: either seller would say them. Keep the actions: a short warranty, and a shine.');b.innerHTML='Next '+L.ic('arrow');}
    if(n===2){b.hidden=true;say('STEP 3 · WOULD THE OTHER TYPE DO IT TOO?','Tap each action to test it.');
      [['oa1','A’s 3-month warranty','Mostly yes: 3 months of a lemon’s repairs (about £600, illustrative) is far less than the £1,800 gained by passing as a peach. A weak signal.'],['oa2','B’s valet','Yes: a valet costs a careless owner the same as a careful one. Signal jamming: it tells you nothing.']].forEach(a=>{const c=document.createElement('button');c.className='chip';c.id=a[0];c.textContent=a[1];
        c.onclick=()=>{c.classList.add('sel');tapped.add(a[0]);say('STEP 3 · WOULD THE OTHER TYPE DO IT TOO?',a[2]);if(tapped.size===2){b.hidden=false;b.innerHTML='Next '+L.ic('arrow');}};L.$('#oac').appendChild(c);});}
    if(n===3){b.hidden=true;say('STEP 4 · SCREEN TO FIND OUT','Neither action sorts the cars. What should Tali ask both sellers?');
      ['Can my own mechanic inspect it? I’ll pay for it','Will you promise in writing there are no faults?','Can you clean the engine too, so I can compare?'].forEach((t,j)=>{const x=document.createElement('button');x.className='opt';x.innerHTML='<span class="key">'+(j+1)+'</span><span>'+t+'</span>';
        x.onclick=()=>{if(graded)return;graded=true;const ok=j===0;L.award(ok);x.classList.add(ok?'ok':'no');if(!ok)L.$('#oq').children[0].classList.add('ok');
          say('STEP 4 · SCREEN TO FIND OUT',(ok?'Right. ':'')+'What tells the truth is the check itself. A seller’s yes proves nothing: agreeing costs a lemon’s owner nothing, as the book points out. A written promise is just words unless Tali can enforce it; a cleaner engine is more jamming.');
          b.hidden=false;b.innerHTML='Next '+L.ic('arrow');};L.$('#oq').appendChild(x);});}
    if(n===4){L.$('#oq').innerHTML='';say('STEP 5 · SIGNAL CHEAPLY TO SHOW','Tali is the buyer, so there’s little to prove. Turning up with the inspection booked and the money ready shows a serious buyer, cheaply.');b.innerHTML='Next '+L.ic('arrow');}
    if(n===5){b.hidden=true;lot.set({tags:{2:'wi',6:'j'},ro:''});say('STEP 6 · NOTICE WHAT THEY DIDN’T DO','Seller A says yes. That alone proves nothing: a lemon’s owner could say yes too. Seller B finds a reason to say no. Agreeing would cost B nothing, so the refusal is the dog that didn’t bark. Only the mechanic’s actual check settles A’s car.');
      L.$$('#osp span').forEach(p=>p.className='dn');if(!fin){fin=true;L.sheet('info','Six questions, about a minute','What do they know and gain? Watch actions, not words. Would the other type do it too? Screen to find out. Signal cheaply to show. Notice what they didn’t do. Tali walks away from Seller B, and buys from Seller A only once their own mechanic has checked the car and found it sound.');L.done();}}}
  L.$('#ob').onclick=()=>{if(s===0)go(1);else if(s===1)go(2);else if(s===2&&tapped.size===2)go(3);else if(s===3&&graded)go(4);else if(s===4)go(5);};
  go(0);}},

{part:3,src:'Chapter 8 · Screening and Signaling',pts:1,run(L){
  L.h(L.kick('pr','Arlo’s coffee cart')+'<h1 class="q">Arlo asks Tali for £3,000 for a coffee cart. Which request tells Tali most about whether Arlo is serious?</h1>'+
   '<svg class="sg-svg" viewBox="0 0 320 112" role="img" aria-label="Two possible Arlos, serious or dreaming; Tali can’t tell which is asking">'+

{part:3,src:'Course application · built on Chapter 8 (Spence’s cost difference)',

     row(40,'…a lead who is committed and able',m[2],'--ok-strong')+row(80,'…a lead going through the motions',m[3],'--no-strong')+
     '<rect x="'+(ok?54:74)+'" y="118" width="'+(ok?212:172)+'" height="22" rx="11" fill="var('+(!pick?'--soft2':ok?'--ok-bg':'--no-bg')+')"/><text x="160" y="133" text-anchor="middle" font-size="11.5" font-weight="700" fill="var('+(!pick?'--muted':ok?'--ok':'--no')+')">'+m[5]+'</text>';
    L.$('#sdc').innerHTML=m[6];}
  M.forEach(m=>{const b=document.createElement('button');b.className='chip';b.textContent=m[1];
    b.onclick=()=>{L.$$('#sd .chip').forEach(x=>x.classList.toggle('sel',x===b));draw(m);seen.add(m[0]);
      if(seen.size===M.length&&!fin){fin=true;L.sheet('info','Send what the wrong type couldn’t afford','To be believed, pick a move that costs you little only because you are what you claim, and would cost a pretender a lot. Before Tali’s March pay talk, run the same check: what proof of value could Greer not get from someone less valuable?');L.done();}};
    L.$('#sd').appendChild(b);});
  draw(['',0,0,0,'no','Tap a move below','']);}},

{part:3,src:'Chapter 8 · Countersignaling',
 solve:async L=>{for(const b of L.$$('#lmp .chip')){b.click();await L.sleep(30);}},
 run(L){
  let fin=false;const seen=new Set();
  L.h(L.kick('ex','Edge cases and limits')+'<h1 class="q">Where does reading signals mislead you? Try each case.</h1>'+
   '<div class="sg-chips" id="lmp"></div><div id="lmv"></div><div id="lmf"></div>');
  const box=h=>'<svg class="sg-svg" viewBox="0 0 320 132" role="img" aria-label="Picture for this case"><rect width="320" height="132" rx="14" fill="var(--soft)"/>'+h+'</svg>';
  const P=[
   ['Everyone shines',()=>sgLot(L,L.$('#lmv'),LOT_BOOK,{mode:'static',jam:true,short:true,ro:'All ten cars sparkle, lemons too.'}),
    'Signal jamming. If careless owners are few, they all clean up to blend in, and a clean car tells you nothing. If they’re many, only some do. Look for actions that cost them more, not the shine.'],
   ['Private warranty',()=>{const l=sgLot(L,L.$('#lmv'),LOT_BOOK,{mode:'fix',fix:'wp',m:18});},
    'A warranty is only as good as your power to collect. A private seller can move away, so lemon owners copy it at any length. A dealer with a reputation to protect is far more likely to pay.'],
   ['Best don’t bother',()=>{L.$('#lmv').innerHTML=box('<text x="160" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="var(--muted)" letter-spacing=".3">ECONOMISTS USING A TITLE ON THEIR VOICEMAIL</text>'+
      '<rect x="40" y="'+(112-4*2.6)+'" width="70" height="'+(4*2.6)+'" rx="5" fill="var(--h1)"/><text x="75" y="'+(104-4*2.6)+'" text-anchor="middle" font-size="12" font-weight="700" fill="var(--h1)">under 4%</text>'+
      '<rect x="190" y="'+(112-27*2.6)+'" width="70" height="'+(27*2.6)+'" rx="5" fill="var(--h2)"/><text x="225" y="'+(104-27*2.6)+'" text-anchor="middle" font-size="12" font-weight="700" fill="var(--h2)">27%</text>'+
      '<path d="M24 112H296" stroke="var(--ink)" stroke-width="1.5"/><text x="75" y="126" text-anchor="middle" font-size="11" fill="var(--muted)">schools with PhD study</text><text x="225" y="126" text-anchor="middle" font-size="11" fill="var(--muted)">schools without</text>');},
    L.g('countersignal','Countersignalling')+'. The book cites a study of California universities: economists at schools with PhD programmes rarely used their title on voicemail; elsewhere, over a quarter did. All had PhDs. Using a title suggests you feel you need one. Plover’s best designer keeps a bare-bones profile for the same reason. So don’t read “no signal” as weak when other evidence says strong.'],
   ['Truth to mislead',()=>{L.$('#lmv').innerHTML=box('<text x="12" y="20" font-size="11" font-weight="700" fill="var(--muted)" letter-spacing=".3">CHANCE A POKER RIVAL’S HAND IS GOOD</text>'+
      '<text x="12" y="50" font-size="11.5" fill="var(--ink)">before the bet</text><rect x="110" y="40" width="190" height="14" rx="7" fill="var(--soft2)"/><rect x="110" y="40" width="95" height="14" rx="7" fill="var(--h1)"/><text x="296" y="51" text-anchor="end" font-size="11" font-weight="700" fill="var(--ink)">1 in 2</text>'+
      '<text x="12" y="80" font-size="11.5" fill="var(--ink)">after a raise</text><rect x="110" y="70" width="190" height="14" rx="7" fill="var(--soft2)"/><rect x="110" y="70" width="127" height="14" rx="7" fill="var(--h2)"/><text x="296" y="81" text-anchor="end" font-size="11" font-weight="700" fill="var(--ink)">2 in 3</text>'+
      '<text x="160" y="112" text-anchor="middle" font-size="11" fill="var(--muted)">the book’s numbers: actions shift the odds a little</text>');},
    'Deceivers mix truth and lies: Churchill told Stalin that in war, truth needs a guard of lies. People can even tell the truth so you won’t believe it (the book’s old joke has one rival accuse another of saying “Minsk” only so he’ll think Pinsk, though he really is going to Minsk). From a fully opposed rival, ignore the words. But their actions still move the odds: in the book’s poker example, a raise lifts the chance of a good hand from 1 in 2 to 2 in 3.'],
   ['Good-customer offer',()=>{L.$('#lmv').innerHTML='';sgDoors(L,L.$('#lmv'),CARDS());},
    L.g('positive-selection','Positive selection')+', the reverse of the lemons. The book’s case: a new card company in the 1990s offered a low rate to move a balance over. People who pay in full had no reason to switch; people who won’t repay didn’t care. It attracted mostly those who borrow and repay: the profitable type.'],
   ['Screens cost',()=>{L.$('#lmv').innerHTML='';sgDoors(L,L.$('#lmv'),AIR(300,null,true));},
    'Screens cost something, and the good types pay too (strong designers sit the test). The book’s airline: if half the travellers are business, keeping tourists means charging business only $215. Dropping economy and charging $300 earns $7,500 per 100 against $5,250. Sometimes the screener stops serving one type.'],
   ['Rat race',()=>{L.$('#lmv').innerHTML=box('<text x="12" y="20" font-size="11" font-weight="700" fill="var(--muted)" letter-spacing=".3">QUALIFICATION ASKED FOR THE SAME JOB (ILLUSTRATIVE)</text>'+
      [['then',30,'school'],['later',58,'degree'],['now',86,'master’s']].map((r,j)=>'<rect x="'+(50+j*84)+'" y="'+(112-r[1])+'" width="56" height="'+r[1]+'" rx="5" fill="var(--h3)" opacity="'+(.5+j*.2)+'"/><text x="'+(78+j*84)+'" y="'+(106-r[1])+'" text-anchor="middle" font-size="11" font-weight="700" fill="var(--h3)">'+r[2]+'</text><text x="'+(78+j*84)+'" y="126" text-anchor="middle" font-size="11" fill="var(--muted)">'+r[0]+'</text>').join('')+'<path d="M36 112H296" stroke="var(--ink)" stroke-width="1.5"/>');},
    'Education signals ability. But if the less able copy a little more schooling, the more able must get even more to stand out. True abilities don’t change; everyone just pays more. The book says individuals can’t stop this alone: it needs an outside rule.']];
  P.forEach((p,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=p[0];
    b.onclick=()=>{L.$$('#lmp .chip').forEach(x=>x.classList.toggle('sel',x===b));L.$('#lmv').innerHTML='';p[1]();L.$('#lmf').innerHTML='';L.fb(L.$('#lmf'),p[2],'info');seen.add(j);
      if(seen.size===P.length&&!fin){fin=true;L.sheet('info','Signals help, within limits','Shine everyone can copy tells you nothing. A warranty must be enforceable. The strongest may not signal at all. Opponents can tell the truth to mislead, though their actions still shift the odds. Screens cost the good types too, and signals can become a race nobody wins.');L.done();}};L.$('#lmp').appendChild(b);});
  L.$('#lmp .chip').click();}},

{part:3,src:'Chapter 8 · Is the Quality Guaranteed?',
 solve:async L=>{L.$('#kw [data-k="w"]').click();await L.sleep(20);L.$('#kw [data-k="n"]').click();},
 run(L){
  let fin=false;const seen=new Set();
  L.h(L.kick('learn','Where cooperation wins')+'<h1 class="q">A way to prove quality helps honest sellers and buyers alike</h1>'+
   '<div class="sg-chips" id="kw"><button class="chip" data-k="n">No way to prove quality</button><button class="chip" data-k="w">Dealer warranty, 18 months</button></div>'+
   '<div id="kh"></div><svg class="sg-svg" id="kg" viewBox="0 0 320 106" role="img" aria-label="Gains from each peach that sells, for its seller and its buyer"></svg><p class="sg-cap" id="kc"></p>');
  const lot=sgLot(L,L.$('#kh'),LOT_BOOK,{mode:'fix',fix:null,m:18});
  function gains(on){const row=(y,nm,col,v)=>'<text x="10" y="'+(y+11)+'" font-size="11.5" font-weight="700" fill="var('+col+')">'+nm+'</text><rect x="122" y="'+y+'" width="160" height="14" rx="5" fill="var(--soft2)"/><rect x="122" y="'+y+'" width="'+Math.max(2,v/500*120)+'" height="14" rx="5" fill="var('+col+')" style="transition:width .5s"/><text x="312" y="'+(y+11)+'" text-anchor="end" font-size="11.5" font-weight="700" fill="var(--ink)">$'+v+'</text>';
    L.$('#kg').innerHTML='<text x="10" y="16" font-size="11" font-weight="700" fill="var(--muted)" letter-spacing=".3">GAIN FROM EACH PEACH THAT SELLS</text>'+row(28,'Peach owner','--h4',on?500:0)+row(54,'Peach buyer','--h2',on?500:0)+'<text x="10" y="88" font-size="11" fill="var(--muted)">'+(on?'sold near $3,500 (illustrative):':'the peach never sells,')+'</text><text x="10" y="102" font-size="11" fill="var(--muted)">'+(on?'owner wanted $3,000, buyer valued $4,000':'so neither side gains')+'</text>';}
  L.$$('#kw .chip').forEach(b=>b.onclick=()=>{L.$$('#kw .chip').forEach(x=>x.classList.toggle('sel',x===b));const on=b.dataset.k==='w';lot.set({fix:on?'wd':null});gains(on);seen.add(b.dataset.k);
    L.$('#kc').innerHTML=on?'With proof, good cars sell at a fair price: both sides gain. Honest sellers <i>want</i> a way to be believed.':'Without proof, honest sellers can’t get a fair price, and buyers can’t find a good car. Both lose.';
    if(seen.size===2&&!fin){fin=true;L.sheet('info','Be the one whose word is backed by action','Signals aren’t only for outwitting people: a way to prove quality lets honest sellers get a fair price and buyers find a good car.<br><br><b>How this course applies the book:</b> when Tali sells their old bike, offering a week to bring it back is cheap for an honest seller and helps the buyer too. With people you’ll deal with again, keeping your word builds the same kind of proof.');L.done();}});
  gains(false);L.$('#kc').innerHTML='Tap both to compare.';}},

{part:3,src:'Course application · built on Chapter 8',
 solve:async L=>{L.$('#yc').children[0].click();L.$('#y1').value='Whether the car has hidden faults';L.$('#y2').value='Letting my mechanic check it';L.$('#y3').value='A reason to skip the check';['#y1','#y2','#y3'].forEach(s=>L.$(s).dispatchEvent(new Event('input',{bubbles:true})));L.$('#yb').click();},
 run(L){
  L.h(L.kick('pr','Your turn · ungraded')+'<h1 class="q">Someone this week knows more than you. Plan what you’ll watch for.</h1>'+
   L.note('How this course applies the book: the one-minute move on your own situation.','compass')+
   '<span class="sg-fl">THE SITUATION</span><div class="sg-chips" id="yc" style="justify-content:flex-start"></div>'+
   '<label class="sg-fl" for="y1">1 · WHAT DO THEY KNOW THAT I DON’T?</label><input class="sg-in" id="y1" maxlength="70" placeholder="e.g. how reliable they really are">'+
   '<label class="sg-fl" for="y2">2 · AN ACTION THAT WOULD COST THEM ONLY IF IT’S NOT TRUE</label><input class="sg-in" id="y2" maxlength="70" placeholder="e.g. a small paid trial first">'+
   '<label class="sg-fl" for="y3">3 · WHAT I’LL NOTICE IF THEY DON’T DO IT</label><input class="sg-in" id="y3" maxlength="70" placeholder="e.g. excuses to skip the trial">'+
   '<div class="sg-ctl"><button class="btn pri" id="yb" disabled>'+L.ic('eye')+'Draw my signal card</button></div><div id="yo"></div>');
  let sit=null;
  ['A purchase','A hire or a tradesperson','A date or new friend','Someone saying “trust me”','A deal that looks too good'].forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=n;b.onclick=()=>{sit=n;L.$$('#yc .chip').forEach((x,q)=>x.classList.toggle('sel',q===j));chk();};L.$('#yc').appendChild(b);});
  const v=s=>L.$(s).value.trim();
  function chk(){L.$('#yb').disabled=!(sit&&v('#y1').length>1&&v('#y2').length>1&&v('#y3').length>1);}
  ['#y1','#y2','#y3'].forEach(s=>L.$(s).addEventListener('input',chk));
  L.$('#yb').onclick=()=>{const e=s=>L.esc(v(s)),fo=(x,y,w,h,t,b)=>'<foreignObject x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:12px;line-height:1.3;color:var(--ink);overflow:hidden;'+(b?'font-weight:600':'')+'">'+t+'</div></foreignObject>';
    L.$('#yo').innerHTML='<svg class="sg-svg" viewBox="0 0 320 176" role="img" aria-label="Your signal card"><rect width="320" height="176" rx="14" fill="var(--soft)"/>'+
     '<text x="14" y="22" font-size="11" font-weight="700" fill="var(--muted)" letter-spacing=".3">'+L.esc(sit).toUpperCase()+'</text>'+
     '<rect x="12" y="32" width="296" height="40" rx="10" fill="var(--card)" stroke="var(--line2)" stroke-width="1.4"/><text x="22" y="47" font-size="11" font-weight="700" fill="var(--muted)">THEY KNOW</text>'+fo(96,37,206,32,e('#y1'))+
     '<rect x="12" y="80" width="296" height="40" rx="10" fill="var(--h2-bg)" stroke="var(--h2)" stroke-width="1.6"/><g transform="translate(26,88)"><path d="M0 2l7-3 7 3v5c0 4-3 7-7 8-4-1-7-4-7-8z" fill="var(--h2)"/></g>'+fo(50,85,252,32,e('#y2'),1)+
     '<rect x="12" y="128" width="296" height="40" rx="10" fill="var(--card)" stroke="var(--line2)" stroke-width="1.4" stroke-dasharray="4 3"/><text x="22" y="143" font-size="11" font-weight="700" fill="var(--muted)">IF NOT</text>'+fo(96,133,206,32,e('#y3'))+'</svg>';
    L.sheet('info','Watch the action, not the words','When the moment comes, ask for the action in the middle. If they take it, believe it more. If they find a reason not to, that’s your dog that didn’t bark. Afterwards, note what happened.');L.done();};}},

{part:3,src:'Course application · built on Chapter 8',run(L){
  L.h(L.kick('learn','Your strategy map')+'<h1 class="q">“Read and send signals” joins three rows of the map</h1>'+
   L.note('How this course applies the book. Later lessons fill the dashed gaps.','compass')+
   '<svg class="sg-svg" viewBox="0 0 320 74" role="img" aria-label="Tool picture: a badge only one type can afford, and two doors that sort people"><rect width="320" height="74" rx="12" fill="var(--soft)"/>'+
   '<circle cx="40" cy="22" r="9" fill="var(--h4-bg)" stroke="var(--h4)" stroke-width="2"/><path d="M26 52c0-11 6-17 14-17s14 6 14 17z" fill="var(--h4-bg)" stroke="var(--h4)" stroke-width="2"/><g transform="translate(46,30) scale(.8)"><path d="M0 2l7-3 7 3v5c0 4-3 7-7 8-4-1-7-4-7-8z" fill="var(--h2)"/></g>'+
   '<circle cx="104" cy="22" r="9" fill="var(--h3-bg)" stroke="var(--h3)" stroke-width="2"/><path d="M90 52c0-11 6-17 14-17s14 6 14 17z" fill="var(--h3-bg)" stroke="var(--h3)" stroke-width="2"/><text x="122" y="28" font-size="12" font-weight="700" fill="var(--no)">✗</text>'+
   '<rect x="186" y="10" width="26" height="44" rx="4" fill="var(--card)" stroke="var(--ink)" stroke-width="1.6"/><rect x="226" y="10" width="26" height="44" rx="4" fill="var(--card)" stroke="var(--ink)" stroke-width="1.6"/>'+
   '<circle cx="270" cy="22" r="5" fill="var(--h1)"/><circle cx="286" cy="40" r="5" fill="var(--h2)"/><path d="M262 22h-46M278 40h-28" stroke="var(--line2)" stroke-width="1.5" stroke-dasharray="3 3"/>'+
   '<text x="78" y="68" text-anchor="middle" font-size="11" fill="var(--muted)">a costly badge</text><text x="236" y="68" text-anchor="middle" font-size="11" fill="var(--muted)">doors that sort</text></svg>'+
   '<div id="mp"></div>'+
   '<p class="small">It’s the <b>first</b> tool when they know something you don’t, and a back-up when you’re agreeing a price, competing for a prize or hiring someone whose work you can’t watch.</p>');
  L.$('#mp').innerHTML='<div class="mp-row"><span class="n">0</span><b>Is it a game at all? Will the other side react?</b></div>'+MP_ROWS.map((r,j)=>{const hot=r[1].includes('sig');
    return '<div class="mp-row'+(hot?' hot':'')+'"><span class="n">'+(j+1)+'</span><b>'+r[0]+'</b><div class="t">'+r[1].map((k,q)=>(q?'<span class="mp-ar">→</span>':'')+'<span class="mp-t'+(k==='sig'?' cur':MP_T[k][1]>9?' tbd':'')+'">'+(MP_T[k][1]>9?'?':MP_T[k][0])+'</span>').join('')+'</div></div>';}).join('');
  L.done();}}
  ]
});
</script>
