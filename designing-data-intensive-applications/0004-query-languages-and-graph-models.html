<script>
/* =====================================================================
   Lesson 0004 only. Two hands-on models used across the lesson:
   1. Strip – today’s parcel rows in storage order, scanned by Tobias’s
              loop (one cursor, stops early) and Linh’s query (any number
              of parallel cursors). Rows can be moved by the database.
   2. Graph – Otterpost’s place graph (illustrative): a property graph the
              learner queries with a Cypher pattern; matching spreads one
              WITHIN hop per round, like a recursive query or Datalog rule.
   ===================================================================== */
let FAST=false;
const wait=ms=>new Promise(r=>setTimeout(r,FAST?Math.min(ms,25):ms));
const tx=(x,y,s,st)=>'<text x="'+x+'" y="'+y+'" style="'+st+'">'+s+'</text>';
const MKC=['line2','h1','h2','h3','h4','pri','ok','no','muted','ink'];
const defs=p=>'<defs>'+MKC.map(c=>'<marker id="'+p+c+'" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L8,4 L0,7.5 z" style="fill:var(--'+c+')"/></marker>').join('')+'</defs>';
const arw=(p,x1,y1,x2,y2,c,w,dash)=>'<path d="M'+x1+' '+y1+' L'+x2+' '+y2+'" style="fill:none;stroke:var(--'+c+');stroke-width:'+(w||1.6)+(dash?';stroke-dasharray:'+dash:'')+';marker-end:url(#'+p+c+')"/>';
const box=(x,y,w,h,f,s,rx,extra)=>'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+(rx==null?8:rx)+'" style="fill:var(--'+f+');stroke:var(--'+s+');stroke-width:1.5'+(extra||'')+'"/>';
const FIG=(p,vb,label,inner)=>'<div class="q4fig"><svg viewBox="'+vb+'" role="img" aria-label="'+label+'">'+defs(p)+inner+'</svg></div>';
const CAP=t=>'<p class="prose q4cap">'+t+'</p>';
const MONO='font-family:ui-monospace,Menlo,monospace';
function chips(host,labels,on){labels.forEach((t,j)=>{const b=document.createElement('button');b.className='chip';b.innerHTML=t;b.onclick=()=>on(j,b);host.appendChild(b);});}
const CSS='<style>'+
 '.q4fig{margin:4px 0 2px}.q4fig svg,.q4g svg{width:100%;display:block}.q4fig text,.q4g text,.q4lane text{font-family:var(--sans)}'+
 '.q4cap{margin-top:10px}'+
 '.q4code{background:var(--soft);border-radius:14px;padding:10px 12px;margin:10px 0;font-family:ui-monospace,Menlo,monospace;font-size:13px;line-height:1.5;overflow-wrap:anywhere}'+
 '.q4ln{display:flex;flex-wrap:wrap;align-items:center;gap:3px;min-height:22px}.q4ln span{white-space:pre}'+
 '.q4slot{font:inherit;font-weight:700;min-height:36px;padding:3px 8px;border-radius:9px;border:2px solid var(--pri);border-bottom-width:3px;background:var(--pri-bg);color:var(--pri-deep);margin:2px 0}'+
 '.q4fix{color:var(--pri-deep);background:var(--pri-bg);border-radius:6px;padding:1px 4px}'+
 '.q4row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.q4row .btn{min-height:42px}.q4row .chip{margin:0;min-height:40px}'+
 '.q4read{background:var(--soft);border-radius:14px;padding:10px 12px;font-size:14.5px;line-height:1.5;margin:8px 0;min-height:44px}'+
 '.q4cap2{background:var(--soft);border-radius:14px;padding:10px 13px;font-size:15px;line-height:1.5;margin:8px 0;min-height:48px}'+
 '.q4leg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted);margin:4px 0;align-items:center}.q4leg span{display:inline-flex;align-items:center;gap:4px}'+
 '.q4sq{display:inline-block;width:12px;height:12px;border-radius:3px;border:1.5px solid}'+
 '.q4new{animation:q4pop .5s}@keyframes q4pop{0%{opacity:.15}100%{opacity:1}}'+
 '.q4lane{background:var(--soft);border-radius:14px;padding:8px 10px;margin:8px 0}.q4lh{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline;font-size:14px;margin-bottom:4px}'+
 '.q4mono{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--muted)}.q4lr{font-size:13.5px;margin-top:4px;min-height:20px}'+
 '.q4lane svg{width:100%;display:block}.q4cell{transition:transform .7s cubic-bezier(.3,.8,.3,1)}'+
 '.q4ph2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.q4ph{border:2px solid var(--line);border-radius:16px;padding:8px;min-width:0}'+
 '.q4phh{font-size:13.5px;font-weight:700;margin-bottom:4px}.q4sm{font-size:11.5px;margin-bottom:6px;line-height:1.4}'+
 '.q4st{display:block;width:100%;text-align:left;background:none;border:2px solid transparent;border-radius:9px;padding:6px 7px;margin:3px 0;font-size:13.5px;min-height:38px;line-height:1.25}'+
 '.q4st.on{background:var(--pri-bg);color:var(--pri-deep);font-weight:600}.q4st.mk{border-color:var(--no)}.q4st i{display:block;font-style:normal;font-size:11.5px;color:var(--muted);font-weight:500}'+
 'button.q4st:disabled{cursor:default;color:inherit;opacity:1}button.q4st.on:disabled{color:var(--pri-deep)}'+
 '.q4ask{font-size:15px;font-weight:600;margin:12px 0 4px}'+
 '.q4clock{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;margin:6px 0}.q4clock b{font-variant-numeric:tabular-nums}'+
 '.q4out{background:var(--soft);border-radius:14px;padding:9px 12px;font-size:14px;line-height:1.55;margin:8px 0}'+
 '.q4fact{display:inline-block;font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--pri-bg);color:var(--pri-deep);border-radius:7px;padding:2px 6px;margin:2px 3px 2px 0}'+
 '.ok-t{color:var(--ok);font-weight:700}.no-t{color:var(--no);font-weight:700}'+
 '</style>';

/* ================= 1. the storage-order strip ================= */
const STRIP_B=[0,1,12,5,20,14,2,25,17,9,30,11,3,22,16,27,6,19,13,29,7,24,10,31,4,18,23,15,8,28,21,26];
function Strip(L,host,o){
  const ID=o.id,N=32,TD=10;let order=[...Array(N).keys()],cores=1,busy=false;
  const lanes={a:{cell:{},cur:[],col:'h1'},b:{cell:{},cur:[],col:'h2'}};
  host.insertAdjacentHTML('beforeend',
   '<div class="q4leg"><span><i class="q4sq" style="background:var(--ok-bg);border-color:var(--ok-line)"></i>due today</span><span><i class="q4sq" style="background:var(--soft);border-color:var(--line2)"></i>due tomorrow</span><span><i class="q4sq" style="background:var(--ok-strong);border-color:var(--ok-strong)"></i>found</span><span><i class="q4sq" style="background:var(--card);border-color:var(--no);border-style:dashed"></i>missed</span></div>'+
   '<div class="q4lane"><div class="q4lh"><b style="color:var(--h1)">Tobias’s loop</b><span class="q4mono">for each row: keep it, stop at the first not due today</span></div><svg id="'+ID+'-a" viewBox="0 0 330 52" role="img" aria-label="Rows in storage order, scanned by Tobias’s loop"></svg><div class="q4lr" id="'+ID+'-ar" aria-live="polite"></div></div>'+
   '<div class="q4lane"><div class="q4lh"><b style="color:var(--h2)">Linh’s query</b><span class="q4mono">SELECT * FROM parcels WHERE due = today</span></div><svg id="'+ID+'-b" viewBox="0 0 330 52" role="img" aria-label="Rows in storage order, scanned by Linh’s query"></svg><div class="q4lr" id="'+ID+'-br" aria-live="polite"></div></div>');
  const sv={a:host.querySelector('#'+ID+'-a'),b:host.querySelector('#'+ID+'-b')};
  const X=p=>2+(p%16)*20.4,Y=p=>3+Math.floor(p/16)*25;
  const alive=()=>sv.a.isConnected;
  ['a','b'].forEach(k=>{let s='';for(let r=0;r<N;r++)s+='<g class="q4cell" data-k="'+r+'"><rect width="18.5" height="21" rx="4"/><path d="" style="stroke:var(--no);stroke-width:2.2;stroke-linecap:round"/></g>';sv[k].innerHTML=s+'<g class="q4cur"></g>';});
  function place(){['a','b'].forEach(k=>sv[k].querySelectorAll('g[data-k]').forEach(g=>{const p=order.indexOf(+g.dataset.k);g.style.transform='translate('+X(p)+'px,'+Y(p)+'px)';}));}
  function paint(){['a','b'].forEach(k=>{const ln=lanes[k];
    sv[k].querySelectorAll('g[data-k]').forEach(g=>{const r=+g.dataset.k,st=ln.cell[r],today=r<TD;
      let f=today?'ok-bg':'soft',s=today?'ok-line':'line2',dash='',w=1.3;
      if(st==='found'){f='ok-strong';s='ok-strong';}
      if(st==='miss'){f='card';s='no';dash='3 2';w=2;}
      if(st==='stop'){f='no-bg';s='no';w=2;}
      const rc=g.firstChild;rc.setAttribute('style','fill:var(--'+f+');stroke:var(--'+s+');stroke-width:'+w+(dash?';stroke-dasharray:'+dash:''));
      g.lastChild.setAttribute('d',st==='stop'?'M5 6 l8.5 9 m0 -9 l-8.5 9':'');});
    sv[k].querySelector('.q4cur').innerHTML=ln.cur.map(p=>'<rect x="'+(X(p)-1.5)+'" y="'+(Y(p)-1.5)+'" width="21.5" height="24" rx="5" style="fill:none;stroke:var(--'+ln.col+');stroke-width:3"/>').join('');});}
  function say(k,h){if(alive())host.querySelector('#'+ID+'-'+k+'r').innerHTML=h;}
  place();paint();
  async function run(){
    if(busy||!alive())return null;busy=true;
    lanes.a.cell={};lanes.b.cell={};const lp={found:0,ticks:0},q={found:0,ticks:0},seg=N/cores;let ldone=false,t=0;
    while(!(ldone&&t>=seg)){
      if(!ldone){const k=order[t];lanes.a.cur=[t];if(k<TD){lanes.a.cell[k]='found';lp.found++;}else{lanes.a.cell[k]='stop';ldone=true;}lp.ticks=t+1;if(t===N-1)ldone=true;}else lanes.a.cur=[];
      if(t<seg){lanes.b.cur=[];for(let c=0;c<cores;c++){const p=c*seg+t,k=order[p];lanes.b.cur.push(p);if(k<TD){lanes.b.cell[k]='found';q.found++;}}q.ticks=t+1;}else lanes.b.cur=[];
      paint();
      say('a','Found <b>'+lp.found+'</b> of 10 · <b>'+lp.ticks+'</b> time steps · 1 cursor'+(cores>1?' (it can’t use the other '+(cores-1)+' cores)':''));
      say('b','Found <b>'+q.found+'</b> of 10 · <b>'+q.ticks+'</b> time steps · '+cores+' cursor'+(cores>1?'s, side by side':''));
      await wait(cores===1?50:120);if(!alive())return null;t++;}
    for(let r=0;r<TD;r++)if(!lanes.a.cell[r])lanes.a.cell[r]='miss';
    lanes.a.cur=[];lanes.b.cur=[];paint();
    if(lp.found<TD)say('a','Found <b class="no-t">'+lp.found+'</b> of 10 · stopped after <b>'+lp.ticks+'</b> steps · <span class="no-t">missed '+(TD-lp.found)+'</span>');
    busy=false;return {loop:lp,q,cores};
  }
  function pre(){lanes.a.cell={};lanes.b.cell={};for(let r=0;r<TD;r++){lanes.a.cell[r]='found';lanes.b.cell[r]='found';}lanes.a.cell[TD]='stop';paint();
    say('a','Last night: found <b>10</b> of 10 · stopped at row 11');say('b','Last night: found <b>10</b> of 10');}
  async function reorg(){order=STRIP_B.slice();lanes.a.cell={};lanes.b.cell={};paint();place();
    say('a','The database is moving rows…');say('b','The database is moving rows…');await wait(900);}
  return {run,pre,reorg,cores:c=>{cores=c;},busy:()=>busy,idle:async()=>{for(let i=0;i<300&&busy;i++)await wait(20);}};
}

/* ================= 2. Otterpost’s place graph ================= */
/* id: [type, label, x, y, stage]  stage 9 = only after “add lockers” */
const GV={
 wp:['Region','Westport',165,18,1], bb:['Address','B&B depot',40,58,3], w1:['Zone','W1',130,58,1], w2:['Zone','W2',240,58,1],
 mill:['Address','12 Mill Ln',115,98,1], dock:['Address','3 Dock Rd',200,98,1], oak:['Address','9 Oak Ln',285,98,1],
 p13:['Parcel','48213',30,146,4], p14:['Parcel','48214',82,146,4], p16:['Parcel','48216',134,146,4], p17:['Parcel','48217',186,146,4], p18:['Parcel','48218',238,146,9], p15:['Parcel','48215',290,146,5],
 quay:['Address','40 Quay St',62,194,2], elm:['Address','7 Elm St',190,194,2], lk:['Locker','Locker L7',264,194,9],
 e1:['Zone','E1',62,234,2], e2:['Zone','E2',220,234,2], rv:['District','Riverside',62,274,2], ev:['Region','Eastvale',165,312,2]};
/* [tail, head, label W/P/D, stage] */
const GE=[
 ['w1','wp','W',1],['w2','wp','W',1],['bb','wp','W',3],['mill','w1','W',1],['dock','w2','W',1],['oak','w2','W',1],
 ['quay','e1','W',2],['e1','rv','W',2],['rv','ev','W',2],['elm','e2','W',2],['e2','ev','W',2],['lk','e2','W',9],
 ['p13','bb','P',4],['p14','mill','P',4],['p16','elm','P',4],['p17','dock','P',4],['p15','oak','P',5],['p18','oak','P',9],
 ['p13','quay','D',4],['p14','dock','D',4],['p16','mill','D',4],['p17','elm','D',4],['p15','ev','D',5],['p18','lk','D',9]];
const SZ={Region:[78,24],District:[70,22],Zone:[34,22],Address:[70,22],Locker:[66,22],Parcel:[46,22]};
const TY={Region:['h4-bg','h4','h4'],District:['h3-bg','h3','h3'],Zone:['h3-bg','h3','h3'],Address:['card','line2','ink'],Locker:['card','line2','ink'],Parcel:['soft','line2','ink']};
const EDG={D:'DELIVERED_TO',P:'PICKED_UP_AT'},REG={ev:'Eastvale',wp:'Westport'},HOPS=['*1','*2','*3','*0..','*1..'];
const nm=k=>GV[k][1],code=k=>'OP-'+GV[k][1];
const hopOk=(h,d)=>h==='*0..'?true:h==='*1..'?d>=1:d===+h.slice(1);
const GLEG='<span><svg width="22" height="8" aria-hidden="true"><line x1="0" y1="4" x2="22" y2="4" style="stroke:var(--line2);stroke-width:2"/></svg>WITHIN</span>'+
 '<span><svg width="22" height="8" aria-hidden="true"><line x1="0" y1="4" x2="22" y2="4" style="stroke:var(--h2);stroke-width:2"/></svg>DELIVERED_TO</span>'+
 '<span><svg width="22" height="8" aria-hidden="true"><line x1="0" y1="4" x2="22" y2="4" style="stroke:var(--h1);stroke-width:2;stroke-dasharray:4 3"/></svg>PICKED_UP_AT</span>';

function Graph(L,host,o){
  o=Object.assign({id:'g',stage:9,locker:false,y0:0,noP:false},o||{});
  const ID=o.id,P=ID+'m',H=330-o.y0;
  const S={stage:o.stage,locker:o.locker,sets:[],match:null,part:{},trail:null,focus:new Set(),focusE:new Set(),busy:false,newV:new Set(),hiE:new Map()};
  host.insertAdjacentHTML('beforeend','<div class="q4g"><svg id="'+ID+'-svg" viewBox="0 '+o.y0+' 330 '+H+'" role="img" aria-label="Otterpost’s place graph: Westport places at the top, parcels in the middle, Eastvale places at the bottom. WITHIN edges point from a place to the place that contains it."></svg>'+
   '<div class="q4leg">'+GLEG+'<span style="font-style:italic">Otterpost’s graph is illustrative</span></div><div class="q4read" id="'+ID+'-rd" aria-live="polite"></div></div>');
  const svg=host.querySelector('#'+ID+'-svg'),rd=host.querySelector('#'+ID+'-rd');
  const alive=()=>svg.isConnected;
  const vis=k=>{const v=GV[k];return v[4]===9?S.locker:v[4]<=S.stage;};
  const visE=e=>(e[3]===9?S.locker:e[3]<=S.stage)&&!(o.noP&&(e[2]==='P'||GV[e[1]][3]<o.y0));
  function clip(k,dx,dy){const v=GV[k],s=SZ[v[0]],hw=s[0]/2+1,hh=s[1]/2+1;const t=Math.min(dx?hw/Math.abs(dx):1e9,dy?hh/Math.abs(dy):1e9);return [v[2]+dx*t,v[3]+dy*t];}
  function reached(k){for(const s of S.sets){const d=s.dist[k];if(d!=null&&d<=s.upto)return s;}return null;}
  const inEnd=(s,k)=>{const d=s.dist[k];return d!=null&&d<=s.upto&&hopOk(s.l.h,d);};
  function draw(){
    if(!alive())return;
    let s=defs(P);
    GE.forEach((e,j)=>{if(!visE(e)||!vis(e[0])||!vis(e[1]))return;
      const a=GV[e[0]],b=GV[e[1]];
      let col=e[2]==='W'?'line2':e[2]==='P'?'h1':'h2',w=1.4,dash=e[2]==='P'?'4 3':'';
      if(e[2]==='W'&&S.sets.some(st=>st.dist[e[0]]!=null&&st.dist[e[1]]!=null&&st.dist[e[0]]===st.dist[e[1]]+1&&st.dist[e[0]]<=st.upto)){col='pri';w=2.4;}
      if(S.hiE.has(j)){col=S.hiE.get(j);w=2.6;}
      if(S.trail&&S.trail.e.has(j)){col='h3';w=2.6;}
      if(S.focusE.has(j)){col='h3';w=3;}
      let d;
      if(e[0]==='p15'&&e[1]==='ev')d='M290 157 C322 220 322 300 205 312';
      else{const dx=b[2]-a[2],dy=b[3]-a[3],A=clip(e[0],dx,dy),B=clip(e[1],-dx,-dy);d='M'+A[0].toFixed(1)+' '+A[1].toFixed(1)+' L'+B[0].toFixed(1)+' '+B[1].toFixed(1);}
      s+='<path d="'+d+'" style="fill:none;stroke:var(--'+col+');stroke-width:'+w+(dash?';stroke-dasharray:'+dash:'')+';marker-end:url(#'+P+col+')"/>';});
    Object.keys(GV).forEach(k=>{if(!vis(k))return;
      const v=GV[k],t=v[0],sz=SZ[t],x=v[2]-sz[0]/2,y=v[3]-sz[1]/2,c=TY[t];
      let fill='var(--'+c[0]+')',stroke='var(--'+c[1]+')',tc='var(--'+c[2]+')',sw=1.5,dash='',op=1,bold=t==='Region'||t==='Parcel';
      const st=reached(k);
      if(st){if(st.done&&!inEnd(st,k)){stroke='var(--pri)';dash='3 3';sw=2;}else{fill='var(--pri-bg)';stroke='var(--pri)';sw=2.6;tc='var(--pri-deep)';}}
      if(t==='Parcel'&&S.match){if(S.match.has(k)){fill='var(--ok-bg)';stroke='var(--ok)';sw=2.6;tc='var(--ok)';}else if(S.part[k]){stroke='var(--pri)';sw=2;dash='3 3';}else op=.45;}
      if(S.trail&&S.trail.v.has(k)){stroke='var(--h3)';sw=2.6;op=1;}
      s+='<g'+(S.newV.has(k)?' class="q4new"':'')+' style="opacity:'+op+'">';
      if(S.focus.has(k))s+='<rect x="'+(x-4)+'" y="'+(y-4)+'" width="'+(sz[0]+8)+'" height="'+(sz[1]+8)+'" rx="'+(t==='Parcel'?15:9)+'" style="fill:none;stroke:var(--h3);stroke-width:2.4;stroke-dasharray:4 3"/>';
      s+='<rect x="'+x+'" y="'+y+'" width="'+sz[0]+'" height="'+sz[1]+'" rx="'+(t==='Parcel'?11:6)+'" style="fill:'+fill+';stroke:'+stroke+';stroke-width:'+sw+(dash?';stroke-dasharray:'+dash:'')+'"/>';
      s+=tx(v[2],v[3]+4.2,v[1],'font-size:12px;text-anchor:middle;fill:'+tc+(bold?';font-weight:700':''));
      if(st&&!(st.done&&!inEnd(st,k))){const bx=x+sz[0]-1,by=y+1;s+='<circle cx="'+bx+'" cy="'+by+'" r="8" style="fill:var(--pri)"/>'+tx(bx,by+4,st.dist[k],'font-size:11.5px;font-weight:700;text-anchor:middle;fill:var(--pri-ink)');}
      s+='</g>';});
    svg.innerHTML=s;
  }
  function say(h){if(alive())rd.innerHTML=h;}
  function spread(target){const dist={[target]:0},rounds=[[target]];let fr=[target];
    while(fr.length){const nx=[];fr.forEach(v=>GE.forEach(e=>{if(e[2]==='W'&&e[1]===v&&visE(e)&&vis(e[0])&&dist[e[0]]==null){dist[e[0]]=rounds.length;nx.push(e[0]);}}));if(nx.length)rounds.push(nx);fr=nx;}
    return {dist,rounds};}
  const lim=s=>s.l.h==='*0..'||s.l.h==='*1..'?s.rounds.length:+s.l.h.slice(1);
  function clear(){S.sets=[];S.match=null;S.part={};S.trail=null;S.hiE=new Map();S.newV=new Set();}
  function begin(lines){clear();S.sets=lines.map(l=>{const sp=spread(l.t);return {l,dist:sp.dist,rounds:sp.rounds,upto:-1,done:false};});}
  function roundMsg(r){S.newV=new Set();const msgs=[];
    S.sets.forEach(s=>{if(r>lim(s))return;s.upto=r;const nw=s.rounds[r]||[];nw.forEach(k=>S.newV.add(k));
      const size=Object.keys(s.dist).filter(k=>s.dist[k]<=r).length;const exact=s.l.h[1]!=='0'&&s.l.h.length===2;
      msgs.push((S.sets.length>1?'<i>'+REG[s.l.t]+'</i>: ':'')+(nw.length?(r===0?'start at '+nw.map(nm).join(', '):'+ '+nw.map(nm).join(', ')):'nothing new')+' <span class="small">(set: '+size+')</span>'+
        (exact&&r===lim(s)?' · stop: exactly '+r+' hop'+(r===1?'':'s'):(!nw.length?' · so stop':'')));});
    return '<b>Round '+r+'</b> · '+msgs.join('<br>');}
  function finish(){
    S.sets.forEach(s=>{s.done=true;});S.newV=new Set();S.hiE=new Map();S.part={};
    const m=new Set();
    Object.keys(GV).filter(k=>GV[k][0]==='Parcel'&&vis(k)).forEach(p=>{let all=true,any=false;const es=[];
      S.sets.forEach(s=>{const ei=GE.findIndex(e=>e[0]===p&&e[2]===s.l.e&&visE(e));if(ei>=0&&inEnd(s,GE[ei][1])){any=true;es.push(ei);}else all=false;});
      if(all){m.add(p);es.forEach(ei=>S.hiE.set(ei,'ok'));}else if(any){S.part[p]=1;es.forEach(ei=>S.hiE.set(ei,'pri'));}});
    S.match=m;draw();
    const counted=S.sets.map(s=>Object.keys(s.dist).filter(k=>inEnd(s,k)));
    const list=[...m].sort();
    say((S.sets.length===1?'<b>Places that count:</b> '+(counted[0].length?counted[0].map(nm).join(', '):'none'):S.sets.map((s,i)=>'<b>In '+REG[s.l.t]+':</b> '+counted[i].length+' places').join(' · '))+
      '<br><b>Matches:</b> '+(list.length?'<span class="ok-t">'+list.map(code).join(', ')+'</span>':'<span class="no-t">none</span>'));
    return list;
  }
  async function run(lines){
    if(S.busy||!alive())return null;S.busy=true;
    if(!FAST&&svg.getBoundingClientRect().top<40)svg.scrollIntoView({behavior:'smooth',block:'start'});
    begin(lines);const R=Math.max(...S.sets.map(lim));
    for(let r=0;r<=R;r++){say(roundMsg(r));draw();await wait(560);if(!alive())return null;}
    await wait(150);if(!alive())return null;
    const list=finish();S.busy=false;return {match:list};
  }
  async function runFwd(l){
    if(S.busy||!alive())return null;S.busy=true;clear();S.match=new Set();
    for(const p of Object.keys(GV).filter(k=>GV[k][0]==='Parcel'&&vis(k))){
      const tv=new Set([p]),te=new Set();let ok=false;const ei=GE.findIndex(e=>e[0]===p&&e[2]===l.e&&visE(e));
      if(ei>=0){te.add(ei);let v=GE[ei][1],hops=0;tv.add(v);
        for(;;){if(GV[v][0]==='Region'){ok=v===l.t&&hopOk(l.h,hops);break;}
          const wi=GE.findIndex(e=>e[0]===v&&e[2]==='W'&&visE(e));if(wi<0)break;te.add(wi);v=GE[wi][1];tv.add(v);hops++;}}
      S.trail={v:tv,e:te};if(ok)S.match.add(p);
      say('Start at <b>'+code(p)+'</b> and walk forwards: '+[...tv].slice(1).map(nm).join(' → ')+(ok?' <span class="ok-t">✓ match</span>':' <span class="no-t">✗</span>'));
      draw();await wait(620);if(!alive())return null;}
    S.trail=null;const list=[...S.match].sort();
    list.forEach(p=>{const ei=GE.findIndex(e=>e[0]===p&&e[2]===l.e&&visE(e));S.hiE.set(ei,'ok');});draw();
    say('<b>Walked forwards from every parcel.</b> Matches: <span class="ok-t">'+list.map(code).join(', ')+'</span>, the same as walking backwards from Eastvale.');
    S.busy=false;return {match:list};
  }
  draw();
  return {run,runFwd,say,draw,S,begin,roundMsg,finish,
    stage:n=>{S.stage=n;draw();},locker:on=>{S.locker=on;clear();draw();},
    focus:(vs,es)=>{S.focus=new Set(vs);S.focusE=new Set(es||[]);draw();},
    busy:()=>S.busy,idle:async()=>{for(let i=0;i<400&&S.busy;i++)await wait(20);}};
}

/* the Cypher pattern, with tappable parts */
function Pat(host,id,lines,edit){
  edit=edit!==false;let ls=lines.map(l=>Object.assign({},l)),onch=()=>{};
  const el=document.createElement('div');el.className='q4code';el.id=id;host.appendChild(el);
  const slot=(i,k,t,aria)=>edit?'<button class="q4slot" id="'+id+'-'+i+k+'" aria-label="'+aria+'. Tap to change">'+t+'</button>':'<b class="q4fix">'+t+'</b>';
  function draw(){
    let h='<div class="q4ln"><span>MATCH (p:Parcel)</span></div>';
    ls.forEach((l,i)=>{
      if(i)h+='<div class="q4ln"><span>      (p)</span></div>';
      h+='<div class="q4ln"><span>  -[:</span>'+slot(i,'e',EDG[l.e],'Edge label '+EDG[l.e])+'<span>]-&gt; ()</span></div>';
      h+='<div class="q4ln"><span>  -[:WITHIN</span>'+slot(i,'h',l.h,'WITHIN hops '+l.h)+'<span>]-&gt;</span></div>';
      h+='<div class="q4ln"><span>  (:Region {name:\'</span>'+slot(i,'t',REG[l.t],'Region '+REG[l.t])+'<span>\'})'+(i<ls.length-1?',':'')+'</span></div>';});
    h+='<div class="q4ln"><span>RETURN p.code</span></div>';
    el.innerHTML=h;
    if(edit)ls.forEach((l,i)=>{
      el.querySelector('#'+id+'-'+i+'e').onclick=()=>{l.e=l.e==='D'?'P':'D';draw();onch();};
      el.querySelector('#'+id+'-'+i+'h').onclick=()=>{l.h=HOPS[(HOPS.indexOf(l.h)+1)%HOPS.length];draw();onch();};
      el.querySelector('#'+id+'-'+i+'t').onclick=()=>{l.t=l.t==='ev'?'wp':'ev';draw();onch();};});
  }
  draw();
  return {lines:()=>ls.map(l=>Object.assign({},l)),set:n=>{ls=n.map(l=>Object.assign({},l));draw();},onChange:f=>{onch=f;}};
}
function setSlot(L,id,i,k,val){for(let n=0;n<6;n++){const b=L.$('#'+id+'-'+i+k);if(!b||b.textContent===val)return;b.click();}}

function Purity(L,host,id,on){
  const K='key = this.hub + month(this.time)',E='emit(key, this.parcels)';
  const V=[['Pure',K+'<br>'+E],
           ['Reads the clock','key = this.hub + month(<b style="color:var(--no)">now()</b>)<br>'+E],
           ['Shared counter','<b style="color:var(--no)">counter.add(1)</b><br>'+K+'<br>'+E]];
  const D=[['WC','3 Nov',120],['WN','9 Nov',40],['WC','18 Nov',85],['WN','27 Nov',30]];
  let v=0,busy=false,st=null;
  host.insertAdjacentHTML('beforeend','<div class="q4row" id="'+id+'-v" role="group" aria-label="Which map function"></div><div class="q4code" id="'+id+'-c"></div>'+
    '<div class="q4clock"><span>Clock: <b id="'+id+'-k">30 Nov, 23:58</b></span><span id="'+id+'-n"></span></div>'+
    '<div class="q4fig"><svg id="'+id+'-s" viewBox="0 0 330 150" role="img" aria-label="Three machines running map. Machine 1 handles documents 1 and 2, machine 2 handles documents 3 and 4 and crashes, machine 3 reruns machine 2’s documents."></svg></div>'+
    '<div class="q4row"><button class="btn pri" id="'+id+'-go">'+L.ic('play')+'Run, with machine 2 crashing</button></div><div class="q4out" id="'+id+'-o" aria-live="polite">Pick a map function, then run it.</div><p class="small">Machines, clock times, parcel counts and the crash are illustrative.</p>');
  const $=s=>host.querySelector(s),svg=$('#'+id+'-s');
  chips($('#'+id+'-v'),V.map(x=>x[0]),(j,b)=>{if(busy)return;v=j;[...$('#'+id+'-v').children].forEach(x=>x.classList.toggle('sel',x===b));st=null;draw();});
  $('#'+id+'-v').children[0].classList.add('sel');
  function draw(){
    if(!svg.isConnected)return;
    $('#'+id+'-c').innerHTML='<span class="small" style="font-family:var(--sans)">function map() {</span><br>&nbsp;&nbsp;'+V[v][1].replace(/<br>/g,'<br>&nbsp;&nbsp;')+'<br><span class="small" style="font-family:var(--sans)">}</span>';
    $('#'+id+'-n').innerHTML=v===2?'Shared counter: <b>'+(st?st.counter:0)+'</b>':'';
    let s='';
    const rows=[['Machine 1','',[0,1]],['Machine 2','',[2,3]],['Machine 3','the rerun',[2,3]]];
    rows.forEach((r,ri)=>{const y=6+ri*48;
      s+=tx(4,y+16,r[0],'font-size:12px;font-weight:700;fill:var(--ink)')+(r[1]?tx(4,y+31,r[1],'font-size:12px;fill:var(--muted)'):'');
      r[2].forEach((d,ci)=>{const x=82+ci*84,dd=D[d],m=st&&st.m[ri][ci];const lost=st&&ri===1&&st.crash&&m;
        s+=box(x,y,78,38,m?'pri-bg':'card',m?'pri':'line2',8)+tx(x+39,y+15,dd[0]+' · '+dd[1],'font-size:12px;font-weight:700;text-anchor:middle;fill:var(--ink)');
        if(m)s+=tx(x+39,y+31,'→ '+m,'font-size:12px;text-anchor:middle;fill:var(--'+(m.endsWith('12')?'no':'pri-deep')+')'+(lost?';text-decoration:line-through':''));});
      const stt=st&&st.s[ri];if(stt)s+=tx(254,y+24,stt[0],'font-size:12.5px;font-weight:700;fill:var(--'+stt[1]+')');});
    svg.innerHTML=s;
  }
  draw();
  $('#'+id+'-go').onclick=async()=>{
    if(busy)return;busy=true;$('#'+id+'-go').disabled=true;const me=v;
    st={m:[[null,null],[null,null],[null,null]],s:[null,null,null],counter:0,crash:false};
    const key=(d,late)=>me===1&&late?'2026-12':'2026-11';
    $('#'+id+'-k').textContent='30 Nov, 23:58';$('#'+id+'-o').innerHTML='Running…';draw();await wait(300);
    st.m[0][0]=key(0);st.m[1][0]=key(2);st.counter+=2;draw();await wait(500);if(!svg.isConnected)return;
    st.m[0][1]=key(1);st.counter+=1;st.s[0]=['done','ok'];st.crash=true;st.s[1]=['crashed ✗','no'];draw();await wait(600);if(!svg.isConnected)return;
    $('#'+id+'-k').textContent='1 Dec, 00:02';st.m[2][0]=key(2,1);st.m[2][1]=key(3,1);st.counter+=2;st.s[2]=['done','ok'];draw();await wait(500);if(!svg.isConnected)return;
    const tot={};[[0,0],[0,1],[2,0],[2,1]].forEach(([r,c])=>{const d=r===0?D[c]:D[2+c];const k=d[0]+' '+st.m[r][c];tot[k]=(tot[k]||0)+d[2];});
    const rows=Object.keys(tot).map(k=>k+': <b>'+tot[k]+'</b>').join('<br>');
    let verdict;
    if(me===0)verdict='<span class="ok-t">✓ Correct:</span> the same report as a run with no crash.';
    else if(me===1)verdict='<span class="no-t">✗ Wrong:</span> the rerun happened after midnight, so parcels from 18 and 27 November are filed under December.';
    else verdict='<span class="no-t">✗ Wrong:</span> the report is right, but the counter says 5 documents. There are 4: the crashed attempt was counted too.';
    $('#'+id+'-o').innerHTML='<b>monthlyHubReport</b><br>'+rows+'<br>'+verdict;
    busy=false;$('#'+id+'-go').disabled=false;on(me);};
  return {pick:j=>{$('#'+id+'-v').children[j].click();},go:()=>$('#'+id+'-go').click(),idle:async()=>{for(let i=0;i<300&&busy;i++)await wait(20);}};
}

/* ============================== the lesson ============================== */
Course.lesson({
  id:'0004', title:'Query languages and graph models', minutes:20, icon:'map',
  goals:['Explain why a declarative query keeps working, and gets faster, when the database changes how it runs','Say what map and reduce may not do in a MapReduce query, and why','Model connected data as a graph and read a pattern that follows edges any number of hops'],
  parts:['Say what','MapReduce','Graphs','Triples, Datalog'],
  read:'Read the second half of chapter 2 of the book for the full Cypher, SQL, SPARQL and Datalog versions of the same query.',
  glossary:{
    'declarative':'Declarative query: you describe the result you want (conditions, sorting, grouping), and the database decides how to get it. SQL and CSS are declarative.',
    'imperative':'Imperative code: step-by-step instructions run in a fixed order, like a loop that checks each record in turn.',
    'optimizer':'Query optimizer: the part of a database that decides how to run a query: which indexes to use, which join method, and in what order.',
    'mapreduce':'MapReduce: a way to process lots of data. A map function turns each record into key-value pairs, the pairs are grouped by key, and a reduce function combines each group.',
    'pure':'Pure function: a function that uses only its inputs, makes no extra database queries and changes nothing outside itself, so it can be rerun safely.',
    'graph':'Graph: data made of vertices (things, also called nodes or entities) and edges (the links between them, also called relationships or arcs).',
    'property-graph':'Property graph: a graph where every vertex and edge has an ID and key-value properties, and every edge has a label and runs from a tail vertex to a head vertex.',
    'recursive-cte':'Recursive common table expression (WITH RECURSIVE): a SQL feature that keeps adding rows to a set, round after round, until no new rows appear. Used to follow a chain of unknown length.',
    'triple':'Triple: a three-part fact (subject, predicate, object), such as (quay, within, e1). Triple-stores hold all data this way.',
    'rdf':'RDF (Resource Description Framework): a standard format for triples, built for the semantic web, an overhyped idea that websites would publish machine-readable data. Its URIs keep merged datasets from clashing. Triples still make a good internal model.',
    'rule':'Datalog rule: a statement that derives new facts from existing ones. When everything on its right-hand side matches, its left-hand side counts as a new fact.'
  },
  cheatsheet:[
    '<b>Declarative</b> (SQL, CSS) says what result you want; <b>imperative</b> code says how. The query optimizer picks indexes, join methods and order.',
    'A declarative query is shorter and easier to write. It promises no row order and no steps, so the database can move rows, speed up its engine and run on many cores with no change to the query.',
    'A CSS rule stays true as the page changes; imperative DOM code leaves stale styles and must be rewritten to use faster APIs.',
    '<b>MapReduce</b>: filter, map emits key-value pairs, the framework groups by key, reduce combines each group. map and reduce must be <b>pure</b>, so they can run anywhere, in any order, and be rerun after a failure.',
    'Two matched functions are harder than one query, so MongoDB added the declarative aggregation pipeline: NoSQL reinventing SQL.',
    'When anything may link to anything, use a <b>graph</b>: vertices and labelled edges, indexed at both ends so you can walk forwards and backwards. New kinds of vertex need no migration.',
    'Cypher’s <code>-[:WITHIN*0..]-&gt;</code> follows a chain of any length, even zero. SQL needs <code>WITH RECURSIVE</code>: 29 lines against 4 in the book.',
    '<b>Triples</b> (SPARQL) and <b>Datalog</b> rules hold and query the same graph; graph databases are not CODASYL again. Document, relational and graph models each thrive in their own domain.'
  ],
  steps:[
/* ---------- PART 1: SAY WHAT ---------- */

 solve:async L=>{L.$('#c6n').click();L.$('#c6n').click();L.$('#c6b-0').click();L.$('#c6b-1').click();L.$('#c6k').click();},
 run(L){
  const S=['Picked up','At hub','Out for delivery','Delivered'];let cur=0,tap=false,checked=false;const js=new Set([0]),mark=new Set();

   '<div class="q4ph2"><div class="q4ph"><div class="q4phh" style="color:var(--h2)">CSS rule</div><div class="q4mono q4sm">li.current &gt; p<br>{ background: blue }</div><div id="c6a"></div></div>'+
   '<div class="q4ph"><div class="q4phh" style="color:var(--h1)">Tobias’s script</div><div class="q4mono q4sm">find li.current,<br>paint its p blue</div><div id="c6b"></div></div></div>'+
   '<div class="q4row"><button class="btn pri" id="c6n">'+L.ic('play')+'Next status</button></div><div id="c6q"></div><p class="small">Both run again after every change. “current” marks the item with the class.</p>'+CSS);
  function draw(){
    L.$('#c6a').innerHTML=S.map((t,j)=>'<div class="q4st'+(j===cur?' on':'')+'">'+t+(j===cur?'<i>current</i>':'')+'</div>').join('');
    L.$('#c6b').innerHTML=S.map((t,j)=>'<button class="q4st'+(js.has(j)?' on':'')+(mark.has(j)?' mk':'')+'" id="c6b-'+j+'"'+(tap&&!checked?' aria-pressed="'+mark.has(j)+'"':' disabled')+'>'+t+(j===cur?'<i>current</i>':'')+(mark.has(j)?'<i style="color:var(--no)">marked as wrong</i>':'')+'</button>').join('');
    S.forEach((t,j)=>{L.$('#c6b-'+j).onclick=()=>{if(!tap||checked)return;mark.has(j)?mark.delete(j):mark.add(j);draw();};});}
  draw();
  L.$('#c6n').onclick=function(){if(cur>=2)return;cur++;js.add(cur);draw();
    if(cur===2){this.remove();tap=true;draw();
      L.$('#c6q').innerHTML='<p class="q4ask">Tap each step on Tobias’s page that is blue by mistake, then check.</p><div class="q4row"><button class="btn pri" id="c6k">Check</button></div>';
      L.$('#c6k').onclick=()=>{if(checked)return;checked=true;const ok=mark.size===2&&mark.has(0)&&mark.has(1);L.award(ok);draw();
        L.sheet(ok?'ok':'no',ok?'Right: two stale highlights':'Picked up and At hub are the stale ones','The script only ever adds a style. Rerunning it never removes the blue from steps that lost the class, so they stay blue until the page reloads. The browser notices when the CSS rule stops matching and drops the blue. And browser makers can speed up CSS without breaking anyone, while the script must be rewritten to use a faster API.');L.done();};}};}},

{part:2,src:'Chapter 2 · Property Graphs',pts:1,
 solve:async L=>{for(let k=0;k<4;k++){const b=L.$('#b14n');if(b)b.click();}L.$('#b14k').children[0].click();},
 run(L){
  let st=1;
  const C=['<b>Westport.</b> Each address lies WITHIN a zone, each zone WITHIN the region. Every grey arrow is an edge labelled WITHIN.',
   '<b>Eastvale is organised differently.</b> Zone E1 sits inside the Riverside district, an extra level; E2 doesn’t. Fixed tables would need a column per level. The graph just adds edges.',
   '<b>Mixed detail.</b> Bramble &amp; Bolt’s depot is only known to be in Westport, with no zone. That’s fine: it points WITHIN whatever contains it.',
   '<b>Parcels join the same graph</b> with new edge labels, PICKED_UP_AT and DELIVERED_TO. One store holds many kinds of things.',
   '<b>A rural drop-off.</b> OP-48215 is known only as “Eastvale”: its DELIVERED_TO edge points straight at the region.'];
  L.h(L.kick('ex','Build it up')+'<h1 class="q">Zainab sketches Otterpost’s places as a graph</h1><div id="b14g"></div><div class="q4cap2" id="b14c" aria-live="polite"></div><div id="b14q"></div><div class="q4row"><button class="btn pri" id="b14n">'+L.ic('play')+'Add the next layer</button></div>'+CSS);
  const g=Graph(L,L.$('#b14g'),{id:'g14',stage:1});g.say('Layer 1 of 5');
  let fb='';
  const cap=()=>{L.$('#b14c').innerHTML=fb+C[st-1];g.say('Layer '+st+' of 5');};cap();
  L.$('#b14n').onclick=function(){if(st>=4){
      if(L.$('#b14k'))return;this.remove();
      L.$('#b14q').innerHTML='<p class="q4ask">Your call: OP-48215 is known only as “Eastvale”. Where should its DELIVERED_TO edge point?</p><div class="q4row" id="b14k" role="group" aria-label="Where the edge points"></div>';
      chips(L.$('#b14k'),['Straight at the Eastvale region','At a guessed Eastvale zone','Nowhere: it needs an address'],(j,b)=>{if(st>=5)return;b.classList.add('sel');const ok=j===0;L.award(ok);
        fb=ok?'<span class="ok-t">✓ Right.</span> ':'<span class="no-t">✗ No need to guess or wait:</span> ';
        st=5;g.stage(5);cap();
        L.sheet(ok?'ok':'no',ok?'Point it at what you know':'Point it at the region','Any vertex may link to any other, so the edge can go straight to the region. A guessed zone would be wrong data, and no fixed depth is required. The book’s version: Lucy, born in Idaho, and Alain, born in Beaune, France, are married and live in London. France splits into régions and départements, the US into states and counties, and Lucy’s birthplace is known only to the state. Add vertices for allergens and foods, and you could ask what each person can safely eat. Graphs are good for evolvability.');L.done();});
      return;}
    st++;g.stage(st);cap();
  };}},
{part:2,src:'Chapter 2 · The Cypher Query Language',run(L){

   CAP('Cypher, made for Neo4j (and named after a character in <i>The Matrix</i>), writes edges as arrows. <code>*0..</code> means follow WITHIN zero or more times, like <code>*</code> in a regular expression. You never say how: the optimizer may start at the parcels or at Eastvale.')+CSS);

{part:2,src:'Chapter 2 · The Cypher Query Language',
 solve:async L=>{FAST=true;L.$('#q16go').click();await L.g16.idle();setSlot(L,'q16',0,'h','*0..');L.$('#q16go').click();await L.g16.idle();},
 run(L){

{part:2,src:'Chapter 2 · Graph Queries in SQL',pts:1,
 solve:async L=>{FAST=true;L.$('#q17c').children[0].click();for(let i=0;i<300&&!L.$('#q17d');i++)await L.sleep(20);},
 run(L){

{part:2,src:'Chapter 2 · Graph Queries in SQL',run(L){

{part:2,src:'Chapter 2 · Graph Queries in SQL',
 solve:async L=>{FAST=true;for(let k=0;k<4;k++){L.$('#q19b').children[k].click();await L.sleep(10);await L.g19.idle();}},
 run(L){
  const tried=new Set();let cur=-1;
  const C=[
   ['Zero hops',{e:'D',h:'*1..',t:'ev'},'n','With <code>*1..</code> the region itself is left out of the set, so OP-48215, delivered straight to Eastvale, is <b>missed</b>. Only <code>*0..</code> allows a path with no WITHIN hop at all.'],
   ['Uneven depth',{e:'D',h:'*2',t:'ev'},'n','Exactly 2 hops is like a fixed number of joins: it finds only 7 Elm St’s parcel. 40 Quay St sits 3 levels down and the rural drop-off 0. When depths vary, the hop count must be open-ended.'],
   ['New kind of place',{e:'D',h:'*0..',t:'ev'},'lk','Otterpost adds parcel lockers: a new vertex type, and OP-48218 delivered to one. No schema change, no migration: any vertex may link to any other. The same pattern now finds <b>4</b> parcels.'],
   ['Walk forwards',{e:'D',h:'*0..',t:'ev'},'fwd','This time the database starts at each parcel and follows edges forwards, instead of starting at Eastvale and walking backwards. Same 3 parcels. The query never said which way: that choice is the optimizer’s.']];
  L.h(L.kick('ex','Edge-case lab')+'<h1 class="q">Where does the pattern stop helping you? Run each case.</h1><div class="q4row" id="q19b"></div><div class="q4cap2" id="q19c" aria-live="polite">Pick a case.</div><div id="q19g"></div><div id="q19p"></div>'+CSS);
  const g=L.g19=Graph(L,L.$('#q19g'),{id:'g19'});const pat=Pat(L.$('#q19p'),'q19',[{e:'D',h:'*0..',t:'ev'}],false);
  g.say('Each case sets the pattern below and runs it.');
  chips(L.$('#q19b'),C.map(c=>c[0]),async(j,b)=>{if(g.busy())return;cur=j;[...L.$('#q19b').children].forEach(x=>x.classList.toggle('sel',x===b));
    const c=C[j];pat.set([c[1]]);g.locker(c[2]==='lk');L.$('#q19c').innerHTML='Running…';
    const r=c[2]==='fwd'?await g.runFwd(c[1]):await g.run([c[1]]);if(!r||cur!==j)return;
    L.$('#q19c').innerHTML='<b>'+c[0]+'.</b> '+c[3];tried.add(j);
    if(tried.size===4&&!L.$('#q19ok')){L.$('#q19c').insertAdjacentHTML('beforeend','<span id="q19ok"></span>');
      L.sheet('info','The limits you just saw','A pattern finds only what its edges and hop count describe: <code>*1..</code> or a fixed count silently drops places at other depths. New vertex types cost nothing. And the database is free to pick the direction; your query stays the same.');L.done();}});}},
{part:2,src:'Chapter 2 · The Cypher Query Language',pts:1,
 solve:async L=>{FAST=true;setSlot(L,'q20',0,'h','*0..');setSlot(L,'q20',1,'h','*0..');L.$('#q20go').click();await L.g20.idle();},
 run(L){
  let first=true,ok=false;
  L.h(L.kick('pr','Challenge')+'<h1 class="q">Linh needs exactly the parcels <b>picked up in Westport</b> and <b>delivered in Eastvale</b>. Tune both lines. Your first run counts.</h1><div id="q20g"></div><div id="q20p"></div><div class="q4row"><button class="btn pri" id="q20go">'+L.ic('play')+'Run pattern</button></div>'+CSS);

  L.$('#q20go').onclick=async()=>{if(ok)return;const r=await g.run(pat.lines());if(!r)return;
    const pass=r.match.join()==='p13,p15,p17';if(first){L.award(pass);first=false;}
    if(pass){ok=true;L.$('#q20go').disabled=true;L.sheet('ok','Exactly the three','Pickups sit 1 or 2 hops below Westport and deliveries 0, 2 or 3 below Eastvale, so both lines need an open-ended hop count (<code>*0..</code>, or <code>*1..</code> on the pickup side). The right answer is OP-48213, OP-48215 and OP-48217.');L.done();}
    else L.sheet('no','Not yet','The right set is the parcels whose pickup place is somewhere in Westport and whose delivery place is somewhere in Eastvale, at any depth. Check the edge, hop count and region on each line, then run again.');};}},

{part:3,src:'Chapter 2 · Triple-Stores and SPARQL',run(L){

   CAP('A triple-store (Datomic, AllegroGraph) is mostly a property graph in other words: every fact is a '+L.g('triple','triple')+'. If the object is a plain value, it’s a property; if it’s another vertex, it’s an edge.')+
   '<div class="q4code" style="white-space:pre">_:quay a :Address;\n       :name "40 Quay St";\n       :within _:e1.</div>'+
   '<p class="small">That is <b>Turtle</b>, a readable way to write '+L.g('rdf','RDF')+'.</p>'+CSS);
  L.done();}},
{part:3,src:'Chapter 2 · Triple-Stores and SPARQL',pts:5,run(L){
  L.h(L.kick('pr','Edge or property?')+'<h1 class="q">Zainab loads Otterpost facts as triples. Is each predicate an edge or a property?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Edge','Property'],[
   ['(op_48213, weightKg, 2.4)',1,'2.4 is a plain number, so weightKg is a property of the parcel vertex.'],
   ['(op_48213, deliveredTo, quay)',0,'quay is another vertex, so deliveredTo is an edge.'],
   ['(ravi, drives, van_12)',0,'van_12 is a vertex in the graph, so drives is an edge between Ravi and the van.'],
   ['(e1, name, “E1”)',1,'A text value makes name a property.'],
   ['(e1, within, riverside)',0,'Both ends are vertices, so within is an edge.']],
   'Look at the object: a plain value makes a property, another vertex makes an edge. RDF uses the same predicate idea for both.');}},
{part:3,src:'Chapter 2 · The SPARQL query language',run(L){
  const C=(t,c)=>'<span style="color:var(--'+c+');font-weight:700">'+t+'</span>';
  L.h(L.kick('learn','SPARQL, and an old question')+'<h1 class="q">SPARQL queries triples; graph databases are not CODASYL again</h1>'+figCodasyl()+
   CAP('CODASYL’s network model linked records too, but a graph database differs in all four ways above. SPARQL (“sparkle”) queries triples; Cypher borrowed its pattern matching, so the two look alike:')+
   '<div class="q4code"><span class="small" style="font-family:var(--sans)">Cypher</span> (p) -[:'+C('DELIVERED_TO','h2')+']-&gt; ()<br>&nbsp;&nbsp;-[:'+C('WITHIN*0..','pri')+']-&gt; (loc)<br><span class="small" style="font-family:var(--sans)">SPARQL</span> ?p :'+C('deliveredTo','h2')+' / :'+C('within*','pri')+' ?loc.</div>'+CSS);
  L.done();}},
{part:3,src:'Chapter 2 · The Foundation: Datalog',
 solve:async L=>{L.$('#d24r1').click();for(let k=0;k<6;k++){const b=L.$('#d24r2');if(b.disabled)break;b.click();}L.$('#d24q').click();},
 run(L){
  let r=-1,fix=false,asked=false;
  L.h(L.kick('ex','Watch the rules fire')+'<h1 class="q">Datalog derives which places are in Eastvale, one small fact at a time</h1><div id="d24g"></div>'+
   '<div class="q4code" style="white-space:pre;font-size:12.5px"><span style="color:var(--muted)">/* rule 1 */</span>\nin_place(Loc, Name) :-\n    name(Loc, Name).\n<span style="color:var(--muted)">/* rule 2 */</span>\nin_place(Loc, Name) :-\n    within(Loc, Via),\n    in_place(Via, Name).\n<span style="color:var(--muted)">/* rule 3 */</span>\ndelivered_in(Code, Name) :-\n    code(P, Code),\n    delivered_to(P, Loc),\n    in_place(Loc, Name).\n?- delivered_in(Code, \'Eastvale\').</div>'+
   '<div class="q4row"><button class="btn pri" id="d24r1">Apply rule 1</button><button class="btn" id="d24r2" disabled>Apply rule 2</button><button class="btn" id="d24q" disabled>'+L.ic('play')+'Ask rule 3</button></div>'+
   '<div class="q4out" id="d24f" aria-live="polite"><b>Derived facts:</b> none yet</div>'+CSS);
  const g=Graph(L,L.$('#d24g'),{id:'g24',y0:124,noP:true});
  g.say('Capitalised words are variables. A '+L.g('rule','rule')+' applies when everything right of <code>:-</code> matches; its left side then counts as a new fact.');
  const line={e:'D',h:'*0..',t:'ev'};const facts=[];
  const show=()=>{L.$('#d24f').innerHTML='<b>Derived facts ('+facts.length+'):</b> '+(facts.length?facts.map(f=>'<span class="q4fact">'+f+'</span>').join(''):'none yet');};
  const id=k=>k==='ev'?'eastvale':k==='rv'?'riverside':k;
  L.$('#d24r1').onclick=function(){if(r>=0)return;g.begin([line]);r=0;g.roundMsg(0);g.draw();facts.push('in_place(eastvale, \'Eastvale\')');show();
    g.say('<b>Rule 1:</b> the fact name(eastvale, \'Eastvale\') exists, so in_place(eastvale, \'Eastvale\') is now a fact. (It does the same for every named place; we follow Eastvale.)');
    this.disabled=true;L.$('#d24r2').disabled=false;L.$('#d24r2').classList.add('pri');};
  L.$('#d24r2').onclick=function(){if(r<0||fix)return;const s=g.S.sets[0],nw=s.rounds[r+1]||[];
    if(!nw.length){fix=true;this.disabled=true;this.classList.remove('pri');L.$('#d24q').disabled=false;L.$('#d24q').classList.add('pri');
      g.say('<b>Rule 2 finds nothing new.</b> Every fact it could make is already known, so the derivation is complete: '+facts.length+' places are in Eastvale.');return;}
    r++;g.roundMsg(r);g.draw();
    const how=nw.map(k=>{const p=GE.find(e=>e[0]===k&&e[2]==='W')[1];facts.push('in_place('+id(k)+', \'Eastvale\')');return 'within('+id(k)+', '+id(p)+') + in_place('+id(p)+', \'Eastvale\') ⇒ <b>in_place('+id(k)+', \'Eastvale\')</b>';});
    show();g.say('<b>Rule 2, pass '+r+':</b><br>'+how.join('<br>'));};
  L.$('#d24q').onclick=function(){if(!fix||asked)return;asked=true;this.disabled=true;const list=g.finish();
    g.say('<b>Rule 3</b> matches every parcel whose DELIVERED_TO place has an in_place fact for Eastvale. Code = <span class="ok-t">'+list.map(p=>GV[p][1]).join(', ')+'</span>. The same parcels Cypher found.');
    L.sheet('info','Rules built on rules','Datalog, studied by academics in the 1980s, is the foundation later query languages build on; Datomic and Cascalog use it. Rule 2 uses itself, like a function calling itself, and rule 3 reuses both. That’s clumsy for a quick one-off query, but rules combine and get reused, so it copes better with complex data.');L.done();};}},
{part:3,src:'Chapter 2 · Summary',run(L){
  L.h(L.kick('learn','The chapter in one picture')+'<h1 class="q">Three models, each good in its own domain</h1>'+figSummary()+
   CAP('Any model can emulate another (a graph in SQL tables, say), but the result is often awkward, hence different systems for different jobs. Document and graph stores rarely enforce a schema, yet the app still assumes one: explicit on write, or implicit on read.')+
   '<p class="small">Not covered here: genome databases for similar-sequence search, custom systems for particle physics at hundreds of petabytes, and full-text search (chapter 3).</p>'+CSS);
  L.done();}},
