<script>
Course.lesson({
  id:'0034', title:'Doing the right thing', minutes:18, icon:'scale',
  goals:['Spot how a prediction about people can encode bias, shut people out and feed on itself','Tell tracking that serves users from surveillance, and explain why “consent” is often thin','Apply Kleppmann’s advice on data as power: collect less, purge early, keep people in control'],
  parts:['Predictions about people','Privacy and tracking','Data, power and you'],
  read:'Read the “Doing the Right Thing” section and the Summary at the end of chapter 12: it is short, personal and worth reading in full.',
  glossary:{
    'predictive':'Predictive analytics: using data about the past to predict something about the future, such as whether a person will repay a loan or turn up late.',
    'proxy':'Proxy: a piece of data that stands in for another, closely enough to give it away. In a segregated city, a postcode can act as a proxy for race.',
    'feedback-loop':'Feedback loop: when a system’s output changes its own future input. A low score leads to worse chances, which leads to a lower score.',
    'systems-thinking':'Systems thinking: looking at the whole system, including the people who interact with it, not just the computer parts, to foresee side effects.',
    'surveillance':'Surveillance: tracking people mainly to serve someone other than them, such as the advertisers who fund a service.',
    'data-broker':'Data broker: a company that buys, combines, analyzes and resells personal data about people, mostly for marketing.'
  },
  cheatsheet:[
    'Engineers own the <b>consequences</b> of their systems. Much data is about <b>people</b>: treat it with humanity and respect.',
    'Predictions about individuals can <b>shut people out</b> everywhere at once, with no proof and little chance to appeal.',
    'Biased past data gives biased predictions. Removing a protected field doesn’t help when <b>proxies</b> like postcode remain.',
    'Predictions are right on average and can be <b>wrong for one person</b>. Someone must be accountable, and errors must be fixable.',
    'Watch for <b>feedback loops</b>: think about the whole system, people included.',
    'Tracking that serves the user is a service. Tracking for someone else is closer to <b>surveillance</b>. Consent is thin when users can’t see what they agree to or can’t opt out.',
    '<b>Privacy</b> means choosing what to reveal to whom. Collecting data moves that choice to the company.',
    'Data is power and a hazard: collect less, <b>purge it</b> when no longer needed, and treat users as people, not metrics.'
  ],
  steps:[
/* ---------- PART 1: PREDICTIONS ABOUT PEOPLE ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Tobias says: “A courier score built from GPS data is just maths, so it can’t be unfair.” Do you agree?</h1>');
  L.mc(L.card,['Yes: numbers don’t have opinions','No: it’s only as fair as its data and its use'],1,
   'Maths applied to unfair data, or used in an unfair way, gives unfair results. This lesson shows how.',
   'The maths may be neutral, but the data it learns from and the decisions it drives are not. This lesson shows how a score can be unfair without anyone meaning it to be.');}},
{part:0,src:'Chapter 12 · Doing the Right Thing',run(L){
  L.h(L.kick('learn','The last section of the book')+'<h1 class="q">Every system has consequences, and someone must own them</h1>'+
   L.prose('Kleppmann ends the book by stepping back. Every system is built for a purpose, maybe just making money, but its effects can reach much further, intended or not. He argues that we, the engineers, are responsible for thinking those effects through and for deciding what kind of world we want to help build.')+
   L.prose('Many datasets are about <b>people</b>: what they do, what they like, who they are. That data deserves humanity and respect. Codes of ethics for software engineers exist (such as the ACM’s), but he notes they are rarely discussed or enforced.')+
   L.note('A technology isn’t good or bad in itself; what matters is how it is used and how it affects people. This section is openly Kleppmann’s opinion, written in the first person.','scale'));
  L.done();}},
{part:0,src:'Chapter 12 · Predictive Analytics',run(L){
  L.h(L.kick('learn','Predictive analytics')+'<h1 class="q">Predicting the weather is one thing. Predicting a person is another.</h1>'+
   L.lanes([['leaf','About the world','Forecasting the weather or the spread of a disease.',2],
            ['person','About one person','Will this person reoffend, default on a loan, make costly insurance claims? These predictions change individual lives.',4]])+
   L.prose('Organizations are naturally cautious: a missed customer costs little, a bad loan costs a lot. So when in doubt, they say no. As '+L.g('predictive','predictive analytics')+' spreads, someone labelled risky (rightly or wrongly) may get that “no” from employers, airlines, insurers, landlords and banks all at once. This has been called <b>algorithmic prison</b>.')+
   L.prose('Courts presume innocence until guilt is proven. An automated system can shut someone out of society with no proof at all, and with little chance to appeal.'));
  L.done();}},
{part:0,src:'Chapter 12 · Predictive Analytics',run(L){
  L.h(L.kick('ex','Two proposals land on Femi’s desk')+'<h1 class="q">Otterpost has the data. Should it use it this way?</h1>');
  L.beats(L.card,[
   ['The score','Tobias proposes a <b>courier reliability score</b> from 0 to 100, built from GPS pings and scans: late arrivals, failed deliveries, minutes per stop.'],
   ['Its use','Dispatch would give Peak Week shifts, bonuses and the easiest routes to the highest scores first.'],
   ['Femi’s question','“What does this mean for couriers?” A low score would touch shifts, pay and van access at once. If the score were ever shared with partner firms, it could follow a courier out the door.'],
   ['The second request','Bramble & Bolt offers to <b>buy recipients’ delivery habits</b>: when each household is usually home, how often it gets parcels.'],
   ['The plan','Femi asks the team to judge both proposals with Kleppmann’s arguments in mind.']],
   'The score is a prediction about people. The data sale is about tracking. This lesson takes them in that order.');}},
{part:0,src:'Chapter 12 · Predictive Analytics',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Ravi’s score drops to 38 after a month of slow rural routes. Shifts, bonuses and van booking all use the same score. What risk does the book warn about?</h1>');
  L.mc(L.card,['One label shuts Ravi out of many things at once','The score will be too slow to recover next month','Ravi will learn to game the GPS pings instead'],0,
   'Each “no” looks sensible on its own, but together they box Ravi in. That is the algorithmic-prison worry, at Otterpost scale.',
   'The book’s worry is different: one label, right or wrong, triggers “no” from many places at once, and the person has little way to appeal.');}},
{part:0,src:'Chapter 12 · Bias and discrimination',run(L){
  L.h(L.kick('learn','Bias and discrimination')+'<h1 class="q">Biased data in, biased decisions out</h1>'+
   L.prose('An algorithm isn’t automatically better or worse than a person. People have biases too, and there is hope that data could give overlooked people a fairer chance. But predictive systems don’t just automate a rule a person wrote: they <b>infer the rules from data</b>, and those rules are opaque. If the input has a systematic bias, the system will most likely learn it and amplify it.')+
   L.prose('Laws in many countries forbid treating people differently by protected traits such as ethnicity, age, gender or disability. But other data can be a '+L.g('proxy','proxy')+': in a segregated city, a postcode or even an IP address strongly predicts race.')+
   L.prose('Predictive systems only extrapolate from the past. If the past was discriminatory, they write that into code. A better future takes moral imagination, which only humans can supply.')+
   L.quote('Data and models should be our tools, not our masters.','Martin Kleppmann'));
  L.done();}},
{part:0,src:'Chapter 12 · Bias and discrimination',pts:1,
 solve:async L=>{L.$('#b0').click();L.$('#b1').click();},
 run(L){
  const draw=(g,t)=>{L.$('#gm').style.width=g*3+'%';L.$('#gv').textContent=g+' points';L.$('#gt').innerHTML=t;};
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Remove the sensitive input and watch the score gap</h1>'+
   L.note('A made-up example. For years, Westport dispatchers by habit gave couriers from the Harbour ward, a mostly immigrant neighbourhood, the hilliest, stair-heavy routes. Those routes ran late more often. The new score learns from that history.','info')+
   '<div class="meterrow"><div class="lb">Score gap between groups</div><div class="meter"><div id="gm" style="background:var(--no)"></div></div></div><div class="week" id="gv"></div><p class="small" id="gt"></p>'+
   '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="b0">'+L.ic('x')+'Remove “nationality”</button><button class="btn" id="b1" disabled>'+L.ic('x')+'Also remove “home ward”</button></div><div id="bq"></div>');
  draw(22,'Inputs: nationality, home ward, late-arrival history.');
  L.$('#b0').onclick=function(){this.remove();L.$('#b1').disabled=false;draw(21,'Barely moved: home ward says almost the same thing as nationality here.');};
  L.$('#b1').onclick=function(){if(this.disabled)return;this.remove();draw(17,'Still there: the late-arrival history itself reflects who got the hard routes in the past.');
    const q=L.$('#bq');q.innerHTML='<h2 class="sub">Why didn’t removing the sensitive inputs close the gap?</h2>';
    L.mc(q,['The model needs more data before it becomes fair','Other inputs carry the same bias from the past','Gaps under 20 points are just random noise'],1,
     'Home ward was a proxy, and the late-arrival history recorded past unfair route choices. The system extrapolated from a biased past.',
     'More data of the same kind would only repeat the past. Home ward acts as a proxy, and the history itself records who was given the hard routes. The bias lives in the data, not just in one column.');};}},
{part:0,src:'Chapter 12 · Responsibility and accountability',run(L){
  L.h(L.kick('learn','Responsibility and accountability')+'<h1 class="q">Who answers for the algorithm’s mistake?</h1>'+
   L.prose('When a person makes a bad decision, they can be held to account and you can appeal. When an algorithm does, who is responsible? Could you explain its reasoning to a judge?')+
   L.lanes([['book','A classic credit score','Asks: <i>how did you behave in the past?</i> It uses your own borrowing record, and errors can be corrected (though not easily).',2],
            ['people','Predictive analytics','Asks: <i>who is similar to you, and how did people like you behave?</i> Wide, opaque inputs. That means stereotyping, for example by where you live. Wrong bucket or wrong data, and there’s almost no recourse.',4]])+
   L.prose('Predictions are statistical. If average life expectancy is 80, that doesn’t mean you’ll die on your 80th birthday. A prediction can be right on average and wrong for you. Kleppmann calls blind faith in data dangerous: we need algorithms that are accountable and transparent, that don’t reinforce biases, and whose mistakes can be fixed.')+
   '<p class="small">The same analysis that could steer help to people in need is sometimes used to find vulnerable people and sell them high-cost loans.</p>');
  L.done();}},
{part:0,src:'Chapter 12 · Feedback loops',run(L){
  L.h(L.kick('learn','Feedback loops')+'<h1 class="q">Predictions that make themselves come true</h1>'+
   L.prose('Even milder predictions cause trouble. A service that is good at predicting what people want to see may end up showing them only opinions they already hold: echo chambers where stereotypes and misinformation spread.')+
   L.prose('Worse are '+L.g('feedback-loop','feedback loops')+' that hit people’s lives. The book’s example: employers check credit scores when hiring.')+
   L.flow([['alert','Misfortune','A good worker hits bad luck and misses bills.','',4],['down','Score drops','Fewer job offers.','',3],['cycle','Spiral','Joblessness, then poverty, then a worse score.','',4]])+
   L.prose('We can’t foresee every loop, but many can be predicted with '+L.g('systems-thinking','systems thinking')+'. Ask: does this system widen existing differences (the rich get richer) or fight injustice? And even with good intentions, watch for side effects.'));
  L.done();}},
{part:0,src:'Chapter 12 · Feedback loops',pts:1,
 solve:async L=>{for(let k=0;k<4;k++)L.$('#nx').click();},
 run(L){
  const A=[74,78,82,85,88],R=[70,62,54,47,41];let m=0;
  L.h(L.kick('pr','Spin the loop')+'<h1 class="q">Ines and Ravi start with similar scores. The rule: top scores get the easy city routes; the rest get the leftover rural and stair-heavy ones. Step through four months.</h1>'+
   '<div class="small">Month</div><div class="week" id="mo">0</div>'+
   '<div class="meterrow"><div class="lb">Ines</div><div class="meter"><div id="ma" style="background:var(--ok-strong)"></div></div><b id="va"></b></div>'+
   '<div class="meterrow"><div class="lb">Ravi</div><div class="meter"><div id="mr" style="background:var(--no)"></div></div><b id="vr"></b></div>'+
   '<p class="small" id="lg"></p><button class="btn pri" id="nx">'+L.ic('cycle')+'Next month</button><div id="lq"></div>');
  const draw=()=>{L.$('#mo').textContent=m;L.$('#ma').style.width=A[m]+'%';L.$('#mr').style.width=R[m]+'%';L.$('#va').textContent=A[m];L.$('#vr').textContent=R[m];};draw();
  L.$('#nx').onclick=function(){if(m>=4)return;m++;draw();
    L.$('#lg').textContent=m===1?'Ravi’s slightly lower score gives them the rural routes. Those run later, so Ravi’s score drops.':m===2?'Lower score, even harder routes, more late arrivals.':m===3?'Easy routes keep Ines on time. The gap widens on its own.':'Same two couriers, same effort. The score now “proves” Ravi is unreliable.';
    if(m===4){this.remove();const q=L.$('#lq');q.innerHTML='<h2 class="sub">What would looking at the whole system have caught first?</h2>';
      L.mc(q,['GPS pings should be sent more often','Route difficulty feeds back into the score','The score needs a finer scale than 0–100'],1,
       'The score decided the routes, and the routes drove the score. Thinking about the people and the whole loop, not just the computer part, reveals that.',
       'The data wasn’t too coarse. The score decided the routes and the routes drove the score: a loop you only see when you look at the whole system, people included.');}};}},
{part:0,src:'Chapter 12 · Predictive Analytics',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Name the problem',['A proxy for a protected trait','No accountability or appeal','A feedback loop','Right on average, wrong for one'],[
   ['The score uses home postcode, which in parts of Westport closely tracks ethnicity.',0,'The postcode stands in for a protected trait, so the bias gets in by the back door.'],
   ['Ines is told their shift cut was “decided by the system”. Nobody can say why or change it.',1,'No one answers for the decision and there’s no way to appeal.'],
   ['Low scorers get the harder routes, which push their scores down further.',2,'The output feeds its own input. A self-reinforcing loop.'],
   ['Zone E2 couriers average 80% on time, so the model rates Mei at 80%, though Mei is at 98%.',3,'A fair average can still be badly wrong for one person.'],
   ['A GPS glitch logged Kofi as late all week, and there’s no way to correct the record.',1,'Wrong data with no recourse: an accountability failure.']]);}},

/* ---------- PART 2: PRIVACY AND TRACKING ---------- */
{part:1,src:'Chapter 12 · Privacy and Tracking',run(L){
  L.h(L.kick('learn','Privacy and tracking')+'<h1 class="q">Who is the customer?</h1>'+
   L.prose('If a system stores only what a user entered on purpose, so it can do something for them, the system serves the user: the user is the customer. When activity is tracked as a side effect of something else, the relationship blurs. The service starts to have interests of its own.')+
   L.tiers([['check','Tracking that helps users','Clicks on search results improve the ranking; “people who liked X also liked Y” helps people find things; A/B tests improve the interface.','Users benefit'],
            ['trend','Tracking for the funders','If ads pay for the service, advertisers are the real customers. Tracking gets more detailed, data is kept longer, profiles are built for marketing.','The user’s interests come second'],
            ['eye','Surveillance','Kleppmann’s word for the second kind of relationship: a free service that coaxes people to engage, while the tracking mainly serves someone else.','',true]]));
  L.done();}},
{part:1,src:'Chapter 12 · Surveillance',pts:1,
 solve:async L=>{L.$('#sw').click();},
 run(L){
  const T='Join our <w>data</w> team! We stream live <w>data</w> from 3,000 couriers into our <w>data</w> warehouse, where our <w>data</w> scientists turn <w>data</w> into insights.';
  const show=word=>T.replace(/<w>data<\/w>/g,'<b style="color:'+(word==='data'?'var(--ink)':'var(--no)')+'">'+word+'</b>');
  L.h(L.kick('try','Try the thought experiment')+'<h1 class="q">Kleppmann suggests a test: replace the word “data” with “surveillance”. Try it on this made-up Otterpost job ad.</h1>'+
   '<div class="lane" style="margin:8px 0 12px"><p class="prose" id="ad" style="margin:0">'+show('data')+'</p></div>'+
   '<button class="btn pri" id="sw">'+L.ic('eye')+'Swap the word</button><div id="sq"></div>');
  L.$('#sw').onclick=function(){this.remove();L.$('#ad').innerHTML=show('surveillance');
    const q=L.$('#sq');q.innerHTML='<h2 class="sub">What is the swap meant to do?</h2>';
    L.mc(q,['Prove that Otterpost’s data team is spying','Show that all data collection should be illegal','Make you look at your relationship with the people tracked'],2,
     'Not all data collection is surveillance, the book says, but looking at it that way helps you see the relationship between collector and collected.',
     'The book doesn’t claim all collection is surveillance or illegal. The test is a lens: it makes you ask whom the tracking really serves.');};}},
{part:1,src:'Chapter 12 · Surveillance',run(L){
  L.h(L.kick('learn','Surveillance')+'<h1 class="q">The biggest surveillance network ever, carried in our pockets</h1>'+
   L.prose('Kleppmann argues that, in rushing to put software into everything, we built the greatest mass '+L.g('surveillance','surveillance')+' infrastructure in history. Phones, smart TVs, voice assistants, baby monitors and even toys put an internet-connected microphone in nearly every room, often with poor security. Even repressive regimes could only dream of this. The difference: companies collect it, not governments.')+
   L.list([['shield','“Nothing to hide”','That works only if you fit in with existing power, aren’t part of a marginalized minority, and needn’t fear persecution. Not everyone is so lucky.'],
     ['alert','“It’s just ads”','Car insurance is already priced from in-car trackers, and some health cover depends on wearing a fitness tracker. When tracking decides insurance or jobs, it no longer looks harmless.'],
     ['eye','More than you’d think','A smartwatch’s movement sensor can reveal what you type, passwords included, with fair accuracy. And analysis only gets better.']],4));
  L.done();}},
{part:1,src:'Chapter 12 · Consent and freedom of choice',run(L){
  L.h(L.kick('learn','Consent and freedom of choice')+'<h1 class="q">“They agreed to the terms” is weaker than it sounds</h1>'+
   L.prose('The usual defence: users chose the service, accepted the privacy policy, and get something valuable in return. Kleppmann sees four problems:')+
   L.list([['They can’t see what they agree to','People don’t know what data they feed in or how it’s used, and most privacy policies hide more than they explain. Derived datasets that combine everyone’s data with outside sources are beyond anyone’s understanding.'],
     ['Others are in the data','Data from one user often says things about people who never used the service or agreed to anything.'],
     ['It’s a one-way deal','There is no negotiation over how much data to give and what to get back. The service sets the terms.'],
     ['Opting out isn’t free','If a service is essential for social life or work, refusing it has a real cost. Only people with time, knowledge and security can afford to say no.']],2));
  L.done();}},
{part:1,src:'Chapter 12 · Privacy and use of data',run(L){
  L.h(L.kick('learn','What privacy really means')+'<h1 class="q">Privacy isn’t secrecy. It’s the right to choose.</h1>'+
   L.prose('Some say privacy is dead because people post their lives online. Kleppmann calls that a misunderstanding. Privacy means the freedom to choose <b>what to reveal, to whom</b>, and what to keep secret, in each situation. It is a decision right.')+
   L.flow([['person','Before','The person decides what to reveal.','',2],['arrow','Collection','The company asks to be trusted with it.','',3],['box','After','The company decides, aiming at profit.','',4]])+
   L.prose('Surveillance doesn’t destroy that right, it <b>moves</b> it to the collector. Companies keep much of what they learn quiet, because revealing it would seem creepy. Intimate facts leak only indirectly, for example through ads aimed at people with a certain illness. Privacy settings help a little, but the service itself still sees everything.')+
   '<p class="small">Trust relationships like doctor and patient have always existed, but strict ethics and laws governed them. Moving this much private power from individuals to companies has never happened before.</p>');
  L.done();}},
{part:1,src:'Chapter 12 · Consent and freedom of choice',run(L){
  L.h(L.kick('ex','The second proposal')+'<h1 class="q">Bramble & Bolt wants to buy recipients’ delivery habits</h1>');
  L.beats(L.card,[
   ['The ask','Bramble & Bolt wants each household’s usual at-home hours and how often it gets parcels, to time its ads and flash-sale emails.'],
   ['Who agreed?','Recipients aren’t Otterpost’s customers: merchants are. Most recipients never saw Otterpost’s terms; a shop simply sent them a parcel. Neighbours who accept parcels for them are in the data too.'],
   ['What it reveals','At-home hours show when a house is empty. Regular pharmacy parcels can hint at an illness. Nobody chose to reveal these things.'],
   ['Opting out?','A recipient can’t easily refuse: the shop picked the carrier, not them.'],
   ['Femi’s read','Using an address and a chosen slot to deliver serves the recipient. Selling their habits serves someone else, and moves the choice of what to reveal from the recipient to Otterpost.']],
   'Ask whom the data serves, who never agreed, and who really holds the choice.');}},
{part:1,src:'Chapter 12 · Privacy and Tracking',pts:6,run(L){
  L.h(L.kick('pr','Whom does it serve?')+'<h1 class="q">Sort each use of recipients’ data</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Serves the recipient','Serves someone else'],[
   ['Using the address and chosen slot to deliver the parcel',0,'This is the service the recipient expects.'],
   ['Showing the courier’s live position on the tracking page on delivery day',0,'Tracking that directly helps the recipient.'],
   ['Selling each household’s usual at-home hours to merchants',1,'It serves the buyer and reveals when homes are empty.'],
   ['Keeping every recipient’s delivery history forever, “in case it’s useful”',1,'No one benefits yet, and the data becomes a risk.'],
   ['Flagging homes that often get pharmacy parcels for health-product ads',1,'It exposes intimate information the recipient never chose to share.'],
   ['Remembering a recipient’s “leave with neighbour” note for next time',0,'They entered it on purpose so Otterpost would use it.']],
   'Data the recipient gave on purpose, used for their delivery, is a service. Using it for someone else’s goals starts to look like surveillance.');}},
{part:1,src:'Chapter 12 · Privacy and use of data',pts:1,run(L){
  L.h(L.kick('pr','Answer Tobias')+'<h1 class="q">Tobias: “Recipients post their addresses and birthdays online anyway. Privacy is dead.” What’s the best reply?</h1>');
  L.mc(L.card,['Privacy is choosing what to reveal to whom, not keeping all secret','He’s right: once people share some things, privacy stops mattering','Privacy only covers data that is encrypted when it is stored'],0,
   'Sharing a birthday with friends is the person’s own choice. Selling their at-home hours takes that choice away. Privacy is a decision right.',
   'People sharing some things is privacy at work: they chose what to reveal. The book defines privacy as that freedom to choose, which is exactly what selling their data would take away.');}},

/* ---------- PART 3: DATA, POWER AND YOU ---------- */
{part:2,src:'Chapter 12 · Data as assets and power',run(L){
  L.h(L.kick('learn','Data as assets and power')+'<h1 class="q">Data isn’t waste. It’s an asset, and a hazard.</h1>'+
   L.prose('Behavioural data is sometimes called “data exhaust”, as if it were worthless waste. Kleppmann says it’s the other way round: if targeted ads pay for a service, the data about people <i>is</i> the core asset, and the app is just a way to get more of it. '+L.g('data-broker','Data brokers')+', a secretive industry, buy and resell this data, mostly for marketing.')+
   L.list([['people','Many want it','Companies, and governments too: through secret deals, legal force or theft.'],
     ['alert','It escapes','Breaches happen worryingly often, insiders leak, and when a company goes bust its data is sold with its other assets.'],
     ['clock','Think of future rulers','Not every future government will respect human rights. Critics call data a toxic asset; collect it only if the benefit outweighs the risk of it falling into the wrong hands.'],
     ['eye','Knowledge is power','Watching others while avoiding being watched is a deep form of power. Tech companies hold a lot of it, mostly outside public oversight.']],4));
  L.done();}},
{part:2,src:'Chapter 12 · Data as assets and power',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">An investor tells Femi: “Recipients’ delivery data is just exhaust. Selling it is free money.” How would Kleppmann answer?</h1>');
  L.mc(L.card,['Agreed: it’s waste, so any use of it is a bonus','It’s a valuable asset that also carries real risk','It’s worthless, so it should simply be ignored'],1,
   'Calling it exhaust hides both sides: people want it because it’s valuable, and that same value makes it a target for breaches, buyers and governments.',
   'Kleppmann rejects the “exhaust” framing. The data is valuable, which is exactly why holding it is risky: breaches, leaks, sale in bankruptcy, demands from governments.');}},
{part:2,src:'Chapter 12 · Remembering the Industrial Revolution',run(L){
  L.h(L.kick('learn','Remembering the Industrial Revolution')+'<h1 class="q">Every big leap has a dark side to clean up</h1>'+
   L.lanes([['trend','What it brought','Long-run economic growth and much better living standards.',2],
            ['alert','What it cost','Polluted air and water, terrible housing, long hours, child labour in mines.',4]])+
   L.prose('Safeguards came slowly: environmental rules, workplace safety, a ban on child labour, food inspections. Business got more expensive, but society gained hugely, and few would go back.')+
   L.prose('Kleppmann sees the information age the same way. He cites Bruce Schneier’s comparison: data is this age’s pollution problem, and protecting privacy is its environmental challenge. Our grandchildren will judge how we handled it.'));
  L.done();}},
{part:2,src:'Chapter 12 · Legislation and self-regulation',run(L){
  L.h(L.kick('learn','Legislation and self-regulation')+'<h1 class="q">Laws help, but the culture has to change too</h1>'+
   L.prose('Data protection laws may help. The 1995 European Data Protection Directive said personal data must be collected for specified, explicit purposes and must not be excessive. Kleppmann doubts it works online: Big Data is all about collecting as much as possible and exploring it for unforeseen uses. (At the time of writing, updated rules were being developed.) Companies call regulation a brake on innovation, and he grants that is partly fair, for example in medical research.')+
   L.list([['people','Treat users as people','Not metrics to optimize. Earn trust by limiting what you collect, and explain to users how their data is used.'],
     ['leaf','Protect it like a national park','Our control over our own data is a shared good. Without care, it gets used up, and everyone loses.'],
     ['x','Don’t keep data forever','Purge it as soon as it’s no longer needed. That clashes with immutable logs, but he thinks it can be solved.'],
     ['lock','Enforce with cryptography','Control access through cryptographic protocols, not just through a written policy.']],2));
  L.done();}},
{part:2,src:'Chapter 12 · Legislation and self-regulation',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Would Kleppmann back this?',['In line with the book','Against the book’s advice'],[
   ['Delete raw GPS pings once pay and ETAs for that day are settled.',0,'Purge data as soon as it’s no longer needed.'],
   ['Keep all recipient data forever, because a future project might use it.',1,'Unforeseen future uses are exactly what makes stored data risky.'],
   ['Tell recipients in plain words what Otterpost stores about them, and why.',0,'Educate users instead of keeping them in the dark.'],
   ['Read couriers’ phone contacts in the app “for future features”.',1,'Collecting beyond the purpose. It also pulls in people who never agreed.'],
   ['Guard delivery histories with encryption keys, not only a written policy.',0,'He favours enforcing access through cryptography rather than policy alone.']]);}},
{part:2,src:'Chapter 12 · Summary',run(L){
  L.h(L.kick('learn','The chapter, and the book, in four cards')+'<h1 class="q">Tap each card</h1>');
  L.flips(L.card,[
   ['Integrate by deriving','No one tool fits every need. Pick systems of record and let batch and stream processing derive the rest: indexes, caches, models, reports.'],
   ['Unbundle the database','Loosely coupled pieces keep a problem in one place. Rerun a transformation to change a view or recover from a bug, and carry dataflow all the way to the user’s screen.'],
   ['Stay correct without coordinating','End-to-end request IDs, asynchronous constraint checks with apologies when needed, and audits keep integrity, even across regions.'],
   ['Do the right thing','Data can help or harm people. Engineers share responsibility for building a world that treats people with humanity and respect.']],
   'That’s the end of the book. Femi now has one decision left.');}},
{part:2,src:'Chapter 12 · Doing the Right Thing',pts:1,run(L){
  L.h(L.kick('pr','The final call')+'<h1 class="q">Which plan for the two proposals fits Kleppmann’s arguments best?</h1>');
  L.mc(L.card,['Ship the score as it is, and sell the data: both bring in value','Ship the score with hidden inputs, and sell the data without names','Use the score only as an explained aid with appeals; don’t sell the data'],2,
   'Transparency and a way to appeal address bias and accountability, watching the routes guards against the loop, and declining the sale keeps the choice with recipients. That is what Kleppmann asks of engineers.',
   'Hidden inputs remove any chance to appeal, and selling habits (even without names) still moves recipients’ choices to Otterpost and a merchant. Explained, appealable use and no sale fits the book.');}}
  ]
});
