<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Partitioning Data and Secondary Indexes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">

<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
/* =====================================================================
   Lesson 0013 only. Two hands-on models used across the lesson:
   1. Ruler   – the key space of Otterpost’s bookings table cut into four
                partitions: draggable key-range boundaries or fixed hash
                ranges, bookings raining onto their keys, a live load bar
                per partition, range queries that light the partitions
                they must read, and Bramble & Bolt’s hot key with an
                optional random suffix.
   2. Pillars – eight partitions of parcels with a local or a global
                postcode index: Signe’s search fans out or goes to one
                pillar; a booking writes one pillar or several, later.
   ===================================================================== */
const NS='http://www.w3.org/2000/svg';
const PC=['h1','h2','h3','h4'];
const pct=v=>Math.round(v*100)+'%';
const CSS='<style>'+
 '.pz svg{width:100%;display:block}.pz svg text,.pzv text{font-family:var(--sans)}'+
 '.pzv{width:100%;display:block;margin:2px 0 12px}'+
 '.pz-row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.pz-row .chip{margin:0;min-height:40px}.pz-row .btn{min-height:42px;padding:8px 12px}'+
 '.pz-lbl{font-size:13px;font-weight:600;color:var(--muted);margin:12px 0 0}'+
 '.pz-read{background:var(--soft);border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.5;margin:6px 0 4px}'+
 '.pz-read .pp{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 6px}'+
 '.pz-read .pp span{font-size:13px;font-weight:700;border-radius:8px;padding:2px 6px;font-variant-numeric:tabular-nums}'+
 '.pz-sm .chip{font-size:13.5px;padding:6px 10px;min-height:38px}'+
 '.pz-hot{color:var(--no);font-weight:700}.pz-ok{color:var(--ok);font-weight:700}'+
 '.pz-q{margin-top:6px;padding-top:6px;border-top:1px solid var(--line2)}'+
 '.pz-leg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted);margin:4px 0 2px}.pz-leg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}'+
 '.pz-tasks{list-style:none;margin:6px 0 8px;padding:0}.pz-tasks li{display:flex;gap:8px;align-items:center;font-size:14.5px;margin:5px 0;color:var(--muted)}'+
 '.pz-tasks .bx{width:20px;height:20px;border-radius:6px;border:2px solid var(--line2);flex:none;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}'+
 '.pz-tasks li.done{color:var(--ok)}.pz-tasks li.done .bx{background:var(--ok-strong);border-color:var(--ok-strong);color:var(--card)}'+
 '.pz-goal{display:flex;gap:8px;align-items:center;font-size:14.5px;margin:4px 0}.pz-goal b{width:18px;text-align:center}'+
 '</style>';

/* ---------- small shared bits for this lesson ---------- */
function tasks(id,items){return '<ul class="pz-tasks" id="'+id+'">'+items.map((t,k)=>'<li data-k="'+k+'"><span class="bx"></span><span>'+t+'</span></li>').join('')+'</ul>';}
function tick(L,id,k){const li=L.$('#'+id+' li[data-k="'+k+'"]');if(li&&!li.classList.contains('done')){li.classList.add('done');li.querySelector('.bx').textContent='✓';}}
function allDone(L,id){const ul=L.$('#'+id);return !!ul&&[...ul.children].every(li=>li.classList.contains('done'));}
function chipRow(host,items,pick,sel){host.innerHTML='';items.forEach((it,j)=>{const b=document.createElement('button');b.className='chip'+(j===sel?' sel':'');b.id=it[0];b.innerHTML=it[1];
  b.onclick=()=>{[...host.children].forEach(x=>x.classList.toggle('sel',x===b));pick(j,b);};host.appendChild(b);});}
function arrowLine(x1,y1,x2,y2,col,dash,w){const a=Math.atan2(y2-y1,x2-x1),h=7,ax=x2-h*Math.cos(a-.42),ay=y2-h*Math.sin(a-.42),bx=x2-h*Math.cos(a+.42),by=y2-h*Math.sin(a+.42);
  return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" style="stroke:'+col+';stroke-width:'+(w||1.6)+(dash?';stroke-dasharray:4 3':'')+'"/><path d="M'+x2+' '+y2+'L'+ax.toFixed(1)+' '+ay.toFixed(1)+'L'+bx.toFixed(1)+' '+by.toFixed(1)+'Z" style="fill:'+col+'"/>';}
const T=(x,y,t,st)=>'<text x="'+x+'" y="'+y+'" style="'+st+'">'+t+'</text>';

/* =====================================================================
   1. The key-space ruler
   ===================================================================== */
const RX=10,RW=300,BB=100,BH=84,RY=112,RH=22,HOT=.4;
const PHI=.6180339887;
const SLV=Array.from({length:100},(_,i)=>((i+1)*PHI+.13)%1);   // Bramble & Bolt’s 100 split keys, hashed
const SLVP=Array.from({length:100},(_,i)=>((i+1)*PHI+.41)%1);  // Pip & Thistle’s 100 split keys, hashed
const BBH=.585;                                                 // hash of M-17 (illustrative)
const RKEY={
  time:{name:'booked-at time',ends:['1 Dec','31 Dec'],lab:p=>Math.min(31,Math.floor(p*31)+1)+' Dec',
    comps:()=>[{a:.2765,b:.2775,w:1}]},
  code:{name:'region letter + tracking code',ends:['E-0','W-9'],lab:p=>{const z=Math.min(2,Math.floor(p*3));return 'ENW'[z]+'-'+Math.min(9,Math.floor((p*3-z)*10));},
    comps:()=>[{a:0,b:1/3,w:.25},{a:1/3,b:2/3,w:.05},{a:2/3,b:1,w:.7}]},
  mkey:{name:'merchant ID + booked-at',ends:['M-1','M-999'],lab:p=>'M-'+Math.max(1,Math.round(p*999)),
    comps:S=>{const bb=S.sale?.6:.15;return [{a:.017,b:.0172,w:bb,hot:1},{a:0,b:1,w:1-bb}];}}
};
const RQ={hour:'Every booking in the last hour',bb:'Bramble & Bolt’s bookings, last week',mr:'Merchants M-100 to M-200',pip:'Pip & Thistle’s bookings, last week'};
const pIdx=(B,x)=>{for(let k=0;k<4;k++)if(x<B[k+1])return k;return 3;};
const rBounds=S=>S.mode==='hash'?[0,.25,.5,.75,1]:[0].concat(S.b,[1]);
function rLoads(S){const B=rBounds(S),out=[0,0,0,0];
  RKEY[S.key].comps(S).forEach(c=>{
    if(S.mode==='hash'){
      if(c.hot&&!S.split)out[pIdx(B,BBH)]+=c.w;
      else if(c.hot)SLV.forEach(x=>{out[pIdx(B,x)]+=c.w/100;});
      else for(let k=0;k<4;k++)out[k]+=c.w*(B[k+1]-B[k]);
    }else for(let k=0;k<4;k++){const ov=Math.max(0,Math.min(c.b,B[k+1])-Math.max(c.a,B[k]));out[k]+=c.w*ov/(c.b-c.a);}
  });return out;}
function rQuery(S,q){
  const B=rBounds(S),H=S.mode==='hash',K=S.key,all=[0,1,2,3];
  const span=(a,b)=>all.filter(k=>B[k]<b&&B[k+1]>a);
  const r={parts:all,scans:0,band:null,ticks:null,txt:''};
  if(q==='hour'){
    if(K==='time'&&!H){r.band=[.2765,.2775];r.parts=span(.2765,.2775);r.scans=1;r.txt='The keys are times, kept in order, so the last hour is one short range.';}
    else if(K==='time')r.txt='Hashing scattered neighbouring times over every partition.';
    else if(K==='code')r.txt='Time isn’t in this key, so every partition must be searched.';
    else{r.scans='many';r.txt='Time comes second in the key: one range query per merchant, on every partition.';}
  }else if(q==='bb'||q==='pip'){
    const pip=q==='pip';
    if(K==='mkey'){
      if(H&&(pip?S.split===2:S.split)){r.ticks=pip?SLVP:SLV;r.parts=[...new Set(r.ticks.map(x=>pIdx(B,x)))].sort();r.scans=100;
        r.txt=pip?'Pip & Thistle is a small shop, but its key was split too: 100 reads for nothing.':'The key is split into 100 keys: read all 100, then combine them.';}
      else{const x=H?(pip?.21:BBH):(pip?.44:.017);r.parts=[pIdx(B,x)];r.scans=1;if(H)r.ticks=[x];else r.band=[x,x+.0004];
        r.txt='The merchant picks the partition; inside it, that merchant’s bookings sit in time order.';}
    }else if(K==='time'&&!H){r.band=[.0645,.2775];r.parts=span(.0645,.2775);r.scans=1;r.txt='Last week is one range, but it holds every merchant’s bookings: read them all to find one shop’s.';}
    else r.txt='The merchant isn’t first in this key, so every partition must be searched.';
  }else if(q==='mr'){
    if(K==='mkey'&&!H){r.band=[.1,.2];r.parts=span(.1,.2);r.scans=1;r.txt='Merchant IDs are kept in order: one range scan.';}
    else if(K==='mkey')r.txt='Hashing scattered the merchant IDs over every partition.';
    else r.txt='The merchant isn’t first in this key, so every partition must be searched.';
  }
  return r;}

function Ruler(L,host,o){
  o=Object.assign({id:'r',key:'time',mode:'range',b:[.25,.5,.75],drag:false,rain:true,show:true,sale:false,split:0,q:null,on:()=>{}},o||{});
  const S={key:o.key,mode:o.mode,b:o.b.slice(),sale:o.sale,split:o.split,rain:o.rain,show:o.show,q:o.q,drag:o.drag};
  const ID=o.id,x=p=>RX+p*RW;
  host.insertAdjacentHTML('beforeend','<div class="pz"><svg id="'+ID+'-svg" viewBox="0 0 320 194" role="img" aria-label="Key-space ruler: the key space cut into four partitions, with a bar above each partition for its share of new bookings"'+(o.drag?' style="touch-action:none"':'')+
    '><g id="'+ID+'-bars"></g><g id="'+ID+'-st"></g><g id="'+ID+'-dots" style="pointer-events:none"></g><g id="'+ID+'-lb" style="pointer-events:none"></g></svg>'+
    '<div class="pz-leg"><span><i style="background:var(--h1);border-radius:99px"></i>a new booking</span><span><i style="background:var(--h2-bg);border:1.5px solid var(--h2)"></i>share of writes</span><span>dashed line: fair share (25%)</span></div>'+
    '<div class="pz-read" id="'+ID+'-rd" aria-live="polite"></div></div>');
  const svg=host.querySelector('#'+ID+'-svg'),st=host.querySelector('#'+ID+'-st'),dg=host.querySelector('#'+ID+'-dots'),bars=host.querySelector('#'+ID+'-bars'),lb=host.querySelector('#'+ID+'-lb'),rd=host.querySelector('#'+ID+'-rd');
  bars.innerHTML=[0,1,2,3].map(k=>'<rect id="'+ID+'-br'+k+'" rx="3"/>').join('');
  lb.innerHTML=[0,1,2,3].map(k=>'<text id="'+ID+'-bt'+k+'"></text>').join('');   // share labels sit above the falling dots, with a halo
  const disp=rLoads(S).map(v=>S.show?v:0),dots=[];
  function paintBars(){
    const B=rBounds(S),tg=rLoads(S);
    for(let k=0;k<4;k++){const x0=x(B[k]),w=(B[k+1]-B[k])*RW,bw=Math.max(3,w*.7),h=disp[k]>.004?Math.max(2,disp[k]*BH):0,hot=S.show&&tg[k]>HOT;
      const r=bars.children[k],t=lb.children[k];
      r.setAttribute('x',(x0+(w-bw)/2).toFixed(1));r.setAttribute('y',(BB-h).toFixed(1));r.setAttribute('width',bw.toFixed(1));r.setAttribute('height',h.toFixed(1));
      r.setAttribute('style','fill:var(--'+(hot?'no':PC[k])+'-bg);stroke:var(--'+(hot?'no':PC[k])+');stroke-width:1.5');
      t.setAttribute('x',(x0+w/2).toFixed(1));t.setAttribute('y',(BB-h-4).toFixed(1));t.setAttribute('style','font-size:11.5px;font-weight:700;text-anchor:middle;fill:var(--'+(hot?'no':PC[k])+');paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round');
      t.textContent=S.show&&w>=26?pct(disp[k]):'';}
  }
  function draw(){
    if(!svg.isConnected)return;
    const B=rBounds(S),H=S.mode==='hash',K=RKEY[S.key],qr=S.q?rQuery(S,S.q):null;
    let s='<line x1="'+RX+'" x2="'+(RX+RW)+'" y1="'+(BB-.25*BH)+'" y2="'+(BB-.25*BH)+'" style="stroke:var(--muted);stroke-width:1;stroke-dasharray:4 4"/>'+
      '<line x1="'+RX+'" x2="'+(RX+RW)+'" y1="'+BB+'" y2="'+BB+'" style="stroke:var(--line2)"/>';
    for(let k=0;k<4;k++){const x0=x(B[k]),x1=x(B[k+1]),hit=qr&&qr.parts.includes(k);
      s+='<rect x="'+x0.toFixed(1)+'" y="'+RY+'" width="'+(x1-x0).toFixed(1)+'" height="'+RH+'" style="fill:var(--'+PC[k]+'-bg);stroke:'+(hit?'var(--pri)':'var(--'+PC[k]+')')+';stroke-width:'+(hit?3:1.2)+'"/>';
      if(x1-x0>=22)s+=T(((x0+x1)/2).toFixed(1),RY+15.5,'P'+(k+1),'font-size:11.5px;font-weight:700;text-anchor:middle;fill:var(--'+PC[k]+')');}
    if(S.key==='code'&&!H){[1/3,2/3].forEach(p=>{s+='<line x1="'+x(p)+'" x2="'+x(p)+'" y1="'+(RY+2)+'" y2="'+(RY+RH-2)+'" style="stroke:var(--ink);opacity:.35;stroke-dasharray:2 2"/>';});
      [[1/6,'E codes · 25%'],[.5,'N · 5%'],[5/6,'W codes · 70%']].forEach(z=>{s+=T(x(z[0]),RY+RH+14,z[1],'font-size:11px;fill:var(--muted);text-anchor:middle');});}
    if(S.key==='time'&&!H){const nx=x(.277);s+='<path d="M'+(nx-5)+' '+(RY-9)+'h10l-5 7z" style="fill:var(--ink)"/>'+T(nx,RY+RH+14,'now: 9 Dec','font-size:11px;font-weight:600;fill:var(--ink);text-anchor:middle');}
    if(S.key==='mkey'){
      if(H&&S.split){SLV.forEach(p=>{s+='<line x1="'+x(p).toFixed(1)+'" x2="'+x(p).toFixed(1)+'" y1="'+(RY+1)+'" y2="'+(RY+6)+'" style="stroke:var(--h4);stroke-width:1"/>';});
        s+=T(160,RY+RH+14,'B&amp;B split into 100 keys'+(S.split===2?' (and every other shop too)':''),'font-size:11px;font-weight:600;fill:var(--h4);text-anchor:middle');}
      else{const bx=x(H?BBH:.017);s+='<path d="M'+(bx-5)+' '+(RY-9)+'h10l-5 7z" style="fill:var(--h4)"/>'+T(Math.max(bx,40),RY+RH+14,'B&amp;B (M-17)','font-size:11px;font-weight:700;fill:var(--h4);text-anchor:middle');}}
    if(qr&&qr.band){const a=x(qr.band[0]),w=Math.max(4,x(qr.band[1])-a);s+='<rect x="'+a.toFixed(1)+'" y="'+(RY-4)+'" width="'+w.toFixed(1)+'" height="'+(RH+8)+'" rx="2" style="fill:var(--pri);opacity:.45"/>';}
    if(qr&&qr.ticks)qr.ticks.forEach(p=>{s+='<line x1="'+x(p).toFixed(1)+'" x2="'+x(p).toFixed(1)+'" y1="'+(RY-7)+'" y2="'+(RY+1)+'" style="stroke:var(--pri);stroke-width:1.6"/>';});
    const lab=H?(p=>(p*4.29).toFixed(1)+' bn'):K.lab;
    // Ends and boundary keys share one row; a label drops to a second row only when it would touch its neighbour.
    const its=[{x:RX,t:H?'hash 0':K.ends[0],a:'start'}].concat([1,2,3].map(i=>({x:x(B[i]),t:lab(B[i]),a:'middle',b:1})),[{x:RX+RW,t:H?'4.3 bn':K.ends[1],a:'end'}]);
    const last=[-1e9,-1e9];
    its.forEach(it=>{const w=it.t.length*6.4;let l=it.a==='start'?it.x:it.a==='end'?it.x-w:it.x-w/2;
      if(it.a==='middle'){l=Math.max(RX,Math.min(RX+RW-w,l));it.x=l+w/2;}
      const row=l>=last[0]+8?0:l>=last[1]+8?1:0;last[row]=l+w;
      s+=T(it.x.toFixed(1),row?182:167,it.t,'font-size:11px;'+(it.b?'font-weight:600;fill:var(--ink)':'fill:var(--muted)')+';text-anchor:'+it.a);});
    if(!H&&S.drag)S.b.forEach((p,i)=>{const hx=x(p).toFixed(1);
      s+='<g data-h="'+i+'" tabindex="0" role="slider" aria-label="Boundary between P'+(i+1)+' and P'+(i+2)+'" aria-valuetext="'+K.lab(p)+'" style="cursor:ew-resize;outline:none">'+
        '<rect x="'+(hx-17)+'" y="'+(RY-16)+'" width="34" height="'+(RH+32)+'" style="fill:transparent"/>'+
        '<line x1="'+hx+'" x2="'+hx+'" y1="'+(RY-8)+'" y2="'+(RY+RH+3)+'" style="stroke:var(--ink);stroke-width:2.5"/>'+
        '<circle cx="'+hx+'" cy="'+(RY+RH/2)+'" r="8.5" style="fill:var(--card);stroke:var(--ink);stroke-width:2"/>'+
        '<path d="M'+(hx-2.5)+' '+(RY+RH/2-4)+'v8M'+(+hx+2.5)+' '+(RY+RH/2-4)+'v8" style="stroke:var(--ink);stroke-width:1.5"/></g>';});
    st.innerHTML=s;paintBars();readout();
  }
  function readout(){
    const ld=rLoads(S),mx=ld.indexOf(Math.max(...ld)),H=S.mode==='hash';
    let h='<div class="small" style="line-height:1.4">Key: <b>'+RKEY[S.key].name+'</b> · '+(H?'hash of key, four equal hash ranges':'key ranges, cut at <b>'+S.b.map(RKEY[S.key].lab).join(' · ')+'</b>')+(S.sale?' · <b>flash sale</b>':'')+'</div>';
    if(!S.show)h+='No bookings yet today.';
    else{h+='<div class="pp">'+ld.map((v,k)=>'<span style="background:var(--'+(v>HOT?'no':PC[k])+'-bg);color:var(--'+(v>HOT?'no':PC[k])+')">P'+(k+1)+' '+pct(v)+'</span>').join('')+'</div>';
      h+=ld[mx]>HOT?'<span class="pz-hot">Hot spot:</span> P'+(mx+1)+' takes '+pct(ld[mx])+' of the writes.':'<span class="pz-ok">Even enough:</span> the busiest, P'+(mx+1)+', takes '+pct(ld[mx])+'.';}
    if(S.q){const r=rQuery(S,S.q);h+='<div class="pz-q"><b>'+RQ[S.q]+'</b> asks <b>'+r.parts.length+' of 4</b> partitions'+(r.scans?' · '+r.scans+' range scan'+(r.scans===1?'':'s'):'')+'. '+r.txt+'</div>';}
    rd.innerHTML=h;
  }
  function spawn(){
    const cs=RKEY[S.key].comps(S),tot=cs.reduce((a,c)=>a+c.w,0);let u=Math.random()*tot,c=cs[0];
    for(const k of cs){if(u<k.w){c=k;break;}u-=k.w;}
    let p;if(S.mode==='hash')p=c.hot?(S.split?SLV[Math.floor(Math.random()*100)]:BBH):Math.random();else p=c.a+Math.random()*(c.b-c.a);
    const k=pIdx(rBounds(S),p),el=document.createElementNS(NS,'circle');el.setAttribute('r','2.7');el.setAttribute('cx',x(p).toFixed(1));el.setAttribute('style','fill:var(--'+PC[k]+')');
    dg.appendChild(el);dots.push({el,y:2+Math.random()*12});
  }
  const iv=setInterval(()=>{
    if(!svg.isConnected){clearInterval(iv);return;}
    const tg=rLoads(S);for(let k=0;k<4;k++){const t=S.show?tg[k]:0;disp[k]=Math.abs(disp[k]-t)>.003?disp[k]+(t-disp[k])*.2:t;}
    paintBars();
    if(S.rain&&S.show){spawn();if(Math.random()<.5)spawn();}
    for(let j=dots.length-1;j>=0;j--){const d=dots[j];d.y+=5;if(d.y>=RY){d.el.remove();dots.splice(j,1);}else d.el.setAttribute('cy',d.y.toFixed(1));}
  },40);
  function setB(i,p){const lo=(i?S.b[i-1]:0)+.03,hi=(i<2?S.b[i+1]:1)-.03;S.b[i]=Math.max(lo,Math.min(hi,p));draw();o.on({type:'drag',i});}
  let dragI=-1;
  svg.addEventListener('pointerdown',e=>{const g=e.target.closest('[data-h]');if(!g)return;dragI=+g.dataset.h;try{svg.setPointerCapture(e.pointerId);}catch(_){};e.preventDefault();});
  svg.addEventListener('pointermove',e=>{if(dragI<0)return;const r=svg.getBoundingClientRect();setB(dragI,((e.clientX-r.left)/r.width*320-RX)/RW);});
  const up=()=>{if(dragI>=0){dragI=-1;o.on({type:'dragend'});}};
  svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
  svg.addEventListener('keydown',e=>{const g=e.target.closest&&e.target.closest('[data-h]');if(!g)return;const i=+g.dataset.h;
    const d=e.key==='ArrowLeft'||e.key==='ArrowDown'?-.01:e.key==='ArrowRight'||e.key==='ArrowUp'?.01:0;if(!d)return;e.preventDefault();
    setB(i,S.b[i]+d);const ng=svg.querySelector('[data-h="'+i+'"]');if(ng)ng.focus();});
  draw();
  return {S,draw,setB,loads:()=>rLoads(S),max:()=>Math.max(...rLoads(S)),
    set(p){Object.assign(S,p);draw();o.on(Object.assign({type:'set'},p));},
    query(q){S.q=q;draw();const r=rQuery(S,q);o.on({type:'query',q,r});return r;},
    alive:()=>svg.isConnected};
}

/* =====================================================================
   2. The index pillars
   ===================================================================== */
const PLX=k=>8+k*38,PLW=34,PLY=80,PLH=136,pcx=k=>PLX(k)+PLW/2;
const WPOS=[[1,4],[],[2],[0,5],[],[3],[1,2],[4]];   // which of each partition’s 6 parcels go to WP4 (9 in all)
const TERMS=['A–B','C–E','F–H','I–K','L–N','O–R','S–V','W–Z'];
const LAT=[12,9,14,11,10,13,9,12];                  // illustrative reply times, ms
const HOME=2,PCI=7,MCI=0;                            // new parcel → P3; “WP4” term → P8; “Bramble & Bolt” term → P1
function Pillars(L,host,o){
  o=Object.assign({id:'pl',mode:'local',shelf:true,lines:[],read:true,on:()=>{}},o||{});
  const S={mode:o.mode,slow:-1,booked:0,applied:0,pending:false,busy:false,delay:1100,ls:null,lb:null,lines:o.lines.slice(),ep:0};
  const ID=o.id;
  host.insertAdjacentHTML('beforeend','<div class="pz"><svg id="'+ID+'-svg" viewBox="0 0 320 222" role="img" aria-label="Eight partitions of parcels. Signe’s postcode search starts top left; a new booking starts top right."><g id="'+ID+'-b"></g><g id="'+ID+'-ln"></g><g id="'+ID+'-fx" style="pointer-events:none"></g></svg>'+
    '<div class="pz-leg"><span><i style="background:var(--h4-bg);border:1.5px solid var(--h4)"></i>parcel to WP4</span><span><i style="background:var(--card);border:1.5px solid var(--line2)"></i>other parcel</span>'+(o.shelf?'<span><i style="background:var(--card);border:1.5px solid var(--ink)"></i>index shelf</span>':'')+'</div>'+
    (o.read?'<div class="pz-read" id="'+ID+'-rd" aria-live="polite"></div>':'')+'</div>');
  const svg=host.querySelector('#'+ID+'-svg'),base=host.querySelector('#'+ID+'-b'),ln=host.querySelector('#'+ID+'-ln'),fx=host.querySelector('#'+ID+'-fx'),rd=host.querySelector('#'+ID+'-rd');
  const alive=()=>svg.isConnected;
  const client=(x,f,s,a,b)=>'<rect x="'+x+'" y="4" width="146" height="36" rx="10" style="fill:'+f+';stroke:'+s+';stroke-width:1.5"/>'+T(x+73,19,a,'font-size:12.5px;font-weight:700;text-anchor:middle;fill:'+s)+T(x+73,33,b,'font-size:11.5px;text-anchor:middle;fill:'+s);
  function draw(){
    if(!alive())return;
    const G=S.mode==='global';
    let s=client(8,'var(--h2-bg)','var(--h2)','Signe searches','postcode WP4')+client(166,'var(--h1-bg)','var(--h1)','Bramble &amp; Bolt','books a parcel to WP4');
    for(let k=0;k<8;k++){const x=PLX(k),slow=S.slow===k;
      s+='<rect x="'+x+'" y="'+PLY+'" width="'+PLW+'" height="'+PLH+'" rx="8" style="fill:var(--soft);stroke:'+(slow?'var(--no)':'var(--line2)')+';stroke-width:'+(slow?2:1.2)+(slow?';stroke-dasharray:4 3':'')+'"/>';
      s+=T(x+17,PLY+14,'P'+(k+1),'font-size:11.5px;font-weight:700;text-anchor:middle;fill:'+(slow?'var(--no)':'var(--ink)'));
      if(slow)s+=T(x+17,PLY+PLH-5,'slow','font-size:11px;font-weight:700;text-anchor:middle;fill:var(--no)');
      if(o.shelf){
        s+='<rect x="'+(x+3)+'" y="'+(PLY+20)+'" width="28" height="44" rx="5" style="fill:var(--card);stroke:var(--ink);stroke-width:1"/>';
        s+=T(x+17,PLY+33,G?TERMS[k]:'own','font-size:11px;font-weight:600;text-anchor:middle;fill:var(--muted)');
        const n=G?(k===PCI?9+S.applied:0):WPOS[k].length+(k===HOME?S.booked:0),bb=G&&k===MCI?S.applied:0;
        const cells=[];for(let j=0;j<n;j++)cells.push('h4');for(let j=0;j<bb;j++)cells.push('h1');
        if(G&&S.pending&&(k===PCI||k===MCI))cells.push('wait');
        cells.slice(0,12).forEach((c,j)=>{const cx=x+5+(j%4)*6.5,cy=PLY+38+Math.floor(j/4)*7.5;
          s+='<rect x="'+cx+'" y="'+cy+'" width="5.5" height="5.5" rx="1" style="'+(c==='wait'?'fill:none;stroke:var(--h3);stroke-width:1.2;stroke-dasharray:1.5 1':'fill:var(--'+c+')')+'"/>';});
      }
      const extra=k===HOME?Math.min(2,S.booked):0;
      for(let j=0;j<6+extra;j++){const wp=j>=6||WPOS[k].includes(j),px=x+5+(j%2)*13,py=PLY+70+Math.floor(j/2)*14;
        s+='<rect x="'+px+'" y="'+py+'" width="11" height="11" rx="2.5" style="fill:var(--'+(wp?'h4-bg':'card')+');stroke:'+(j>=6?'var(--pri)':wp?'var(--h4)':'var(--line2)')+';stroke-width:'+(j>=6?2:1.3)+'"/>';}
    }
    base.innerHTML=s;drawLines();readout();
  }
  function drawLines(){if(!alive())return;ln.innerHTML=S.lines.map(l=>arrowLine(l.f==='s'?81:239,40,pcx(l.k),PLY-1,l.col,l.dash)).join('');}
  function readout(){
    if(!rd)return;
    const G=S.mode==='global';
    let h='<div class="small" style="line-height:1.4">Index: <b>'+(G?'global, split by term':'local, one per partition')+'</b>'+(S.slow>=0?' · P'+(S.slow+1)+' is slow':'')+'</div>';
    if(S.ls)h+='<div><b>Search:</b> asked <b>'+S.ls.asked+' of 8</b> partitions · waited <b>'+S.ls.ms+' ms</b>'+(S.ls.asked>1?' (the slowest)':'')+' · found <b>'+S.ls.found+'</b> WP4 parcels'+(S.ls.missing?' <span class="pz-hot">· the new one isn’t listed yet</span>':'')+'.</div>';
    if(S.lb)h+='<div><b>Booking:</b> '+(S.lb.writes===1?'wrote to <b>1</b> partition, P3: the parcel and its index entry together.':'wrote to <b>3</b> partitions: the parcel on P3, the postcode index on P8, the merchant index on P1. '+(S.pending?'<span class="pz-hot">Index updates still on their way…</span>':'<span class="pz-ok">Index updates applied.</span>'))+'</div>';
    if(!S.ls&&!S.lb)h+='Run a search or a booking.';
    if(S.ls)h+='<div class="small">Reply times are illustrative.</div>';
    rd.innerHTML=h;
  }
  function fly(x1,y1,x2,y2,col,ms){return new Promise(res=>{
    if(!alive()){res();return;}
    const c=document.createElementNS(NS,'circle');c.setAttribute('r','4.5');c.setAttribute('style','fill:'+col);c.setAttribute('cx',x1);c.setAttribute('cy',y1);fx.appendChild(c);
    const t0=performance.now();
    (function step(){if(!c.isConnected){res();return;}
      const p=Math.min(1,(performance.now()-t0)/ms),e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
      c.setAttribute('cx',(x1+(x2-x1)*e).toFixed(1));c.setAttribute('cy',(y1+(y2-y1)*e).toFixed(1));
      if(p<1){setTimeout(step,16);return;}c.remove();res();})();});}
  async function search(){
    if(S.busy||!alive())return null;S.busy=true;
    const G=S.mode==='global',asked=G?[PCI]:[0,1,2,3,4,5,6,7],lat=k=>S.slow===k?180:LAT[k];
    S.lines=asked.map(k=>({f:'s',k,col:'var(--h2)'}));drawLines();
    await Promise.all(asked.map(k=>fly(81,40,pcx(k),PLY,'var(--h2)',380)));
    if(!alive())return null;
    let found=0,missing=0;
    await Promise.all(asked.map(k=>L.sleep(lat(k)*5).then(()=>{
      if(k===PCI||!G){found=G?9+S.applied:9+S.booked;missing=G?S.booked-S.applied:0;}
      return fly(pcx(k),PLY,81,40,'var(--h2)',340);})));
    if(!alive())return null;
    S.ls={asked:asked.length,ms:Math.max(...asked.map(lat)),found,missing};S.busy=false;readout();
    o.on(Object.assign({type:'search',mode:S.mode,slow:S.slow},S.ls));return S.ls;
  }
  async function book(){
    if(S.busy||!alive())return null;S.busy=true;
    const G=S.mode==='global',ep=S.ep;
    S.lines=[{f:'b',k:HOME,col:'var(--h1)'}];
    if(G)S.lines.push({f:'b',k:PCI,col:'var(--h3)',dash:1},{f:'b',k:MCI,col:'var(--h3)',dash:1});
    drawLines();
    await fly(239,40,pcx(HOME),PLY,'var(--h1)',420);
    if(!alive())return null;
    S.booked++;
    if(G){S.pending=true;const n=S.booked;
      Promise.all([fly(239,40,pcx(PCI),PLY,'var(--h3)',S.delay),fly(239,40,pcx(MCI),PLY,'var(--h3)',S.delay)]).then(()=>{
        if(!alive()||ep!==S.ep)return;S.applied=n;S.pending=S.applied<S.booked;draw();o.on({type:'applied'});});}
    S.lb={writes:G?3:1};S.busy=false;draw();o.on({type:'book',mode:S.mode,writes:S.lb.writes});return S.lb;
  }
  async function idle(){for(let i=0;i<150&&(S.busy||S.pending)&&alive();i++)await L.sleep(40);}
  function setMode(m){S.ep++;S.mode=m;S.booked=0;S.applied=0;S.pending=false;S.lines=[];S.ls=null;S.lb=null;fx.innerHTML='';draw();}
  draw();
  return {S,draw,search,book,idle,setMode,alive,setSlow(k){S.slow=k;draw();}};
}

Course.lesson({
  id:'0013', title:'Partitioning data and secondary indexes', minutes:20, icon:'layers',
  goals:['Explain why a big database is split into partitions, and how that fits with replication','Choose between key-range and hash partitioning, and calm a hot key','Pick a local or a global secondary index for a partitioned database'],
  parts:['Why split','Key ranges','Hashing','Secondary indexes'],
  read:'Read the first half of chapter 6 of the book (up to “Rebalancing Partitions”) for the encyclopedia, sensor and used-car examples.',
  glossary:{
    'skew':'Skew: an unfair split, where some partitions get much more data or many more requests than others.',
    'hot-spot':'Hot spot: a partition (or node) that gets far more load than the rest, so it becomes the bottleneck while others sit idle.',
    'hash-fn':'Hash function: a function that turns any key into a number that looks random. The same key always gives the same number, and similar keys give very different numbers.',
    'range-query':'Range query: a request for every key between a minimum and a maximum, such as all courier IDs from C-0100 to C-0199.',
    'secondary-index':'Secondary index: an extra index on a column other than the primary key, such as all parcels of one merchant. Its keys don’t have to be unique.',
    'scatter-gather':'Scatter/gather: sending the same query to every partition, then combining all the answers. The query is only as fast as the slowest partition.',
    'local-index':'Local (document-partitioned) index: each partition keeps a secondary index covering only its own records.',
    'global-index':'Global (term-partitioned) index: one secondary index covering all records, itself split into partitions by the value being searched for (the term).'
  },
  cheatsheet:[
    '<b>Partitioning</b> splits the data so each record lives in exactly one partition. Each partition is still <b>replicated</b>, so a node leads some partitions and follows others.',
    'The goal is an even spread of data and queries. <b>Skew</b> ruins it, and the overloaded partition is a <b>hot spot</b>.',
    '<b>Key range</b>: keys stay sorted, so range scans are easy, but keys written close together (like timestamps) pile onto one partition. Boundaries must follow the data.',
    '<b>Hash of key</b>: spreads keys evenly but loses their order, so range queries go to every partition. Don’t call it “consistent hashing”.',
    '<b>Compound key</b>: hash the first part to pick the partition, sort by the rest. Fix the first part and you can range-scan the rest.',
    '<b>One very hot key</b> still lands on one partition. The app can add a random number to that key, but then reads must combine every piece. Do it only for the few hot keys.',
    '<b>Local index</b>: a write touches one partition, but a search asks every partition (scatter/gather) and waits for the slowest.',
    '<b>Global index</b>: a search asks one index partition, but a write may touch several, and the index is often updated asynchronously.'
  ],
  steps:[
/* ---------- PART 1: WHY SPLIT ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · from the last chapter')+'<h1 class="q">Peak Week is coming and Otterpost’s writes will triple. Each region’s Parcel DB has one leader and several followers. Will adding more followers take some of the writes?</h1>');
  L.mc(L.card,['Yes, each new follower takes a share of the writes','No, every write still goes through the one leader'],1,
   'Followers copy every write the leader makes, so they help with reads, not writes. To spread the <i>writes</i>, the data itself has to be split up. That’s this chapter.',
   'With leader-based replication every write goes to the leader, and every follower then applies that same write. More followers help with reads. To spread writes, the data must be split.');}},
{part:0,src:'Chapter 6 · Partitioning',run(L){

   '<p class="small">Not a <i>network</i> partition (a broken link between machines, chapter 8).</p>');

{part:2,src:'Chapter 6 · Partitioning by Hash of Key',run(L){

      L.sheet('info','Writes spread, reads pay','In the sale B&amp;B is most of the bookings, all on one hash, so P3 takes 70%. The suffix turns one key into 100 that spread out. The bill comes at read time: 100 keys to read and combine instead of one.');L.done();}};
  const r=L.rul=Ruler(L,L.$('#r16'),{id:'r16',key:'mkey',mode:'hash',on:chk});
  L.$('#s16').onclick=function(){const on=!r.S.sale;this.innerHTML=L.ic('flame')+(on?'End flash sale':'Start flash sale');r.set({sale:on});};
  chipRow(L.$('#k16'),[['k16a','No suffix'],['k16b','Suffix on B&amp;B’s key']],j=>r.set({split:j}),0);
  L.$('#q16').onclick=()=>r.query('bb');}},
{part:2,src:'Chapter 6 · Partitioning of Key-Value Data',
 solve:async L=>{for(let j=0;j<5;j++)L.$('#e17b'+j).click();},
 run(L){
  const P=[
   ['Time key, Peak Week',{key:'time',mode:'range',b:[.25,.5,.75],sale:false,split:0},null,'Key ranges by time: every new booking lands in today’s range. One partition works, three wait.'],
   ['W codes are 70%',{key:'code',mode:'range',b:[.25,.5,.75],sale:false,split:0},null,'Even slices of the key space aren’t even slices of the data. Drag the boundaries and it heals: key ranges must follow the data.'],
   ['Hash + range query',{key:'time',mode:'hash',sale:false,split:0},'hour','Hashing cured the hot spot, but neighbouring times now sit on every partition. “The last hour” has to ask all four.'],
   ['Bramble & Bolt is 15% of parcels',{key:'mkey',mode:'hash',sale:false,split:0},'bb','Hashing spreads merchants, not one merchant. On a normal day, B&amp;B’s single key already gives P3 about 1.5 times its fair share.'],
   ['Suffix on every key',{key:'mkey',mode:'hash',sale:false,split:2},'pip','Tobias’s “to be safe” idea. Writes look fine, but reading small shop Pip &amp; Thistle now means 100 keys. Split only the few hot keys.']];
  const seen=new Set();
  L.h(L.kick('ex','Edge cases')+'<h1 class="q">Where does each scheme stop protecting you? Try all five.</h1><div class="pz-row pz-sm" id="e17"></div><div id="e17c"></div><div id="r17"></div>'+CSS);
  const r=L.rul=Ruler(L,L.$('#r17'),{id:'r17',key:'time',drag:true});
  P.forEach((p,j)=>{const b=document.createElement('button');b.className='chip';b.id='e17b'+j;b.innerHTML=p[0].replace('&','&amp;');
    b.onclick=()=>{[...L.$('#e17').children].forEach(x=>x.classList.toggle('sel',x===b));r.S.q=p[2];r.set(Object.assign({},p[1],{b:(p[1].b||r.S.b).slice()}));
      L.$('#e17c').innerHTML='<div class="fb info" style="margin:4px 0 6px;font-size:14.5px">'+p[3]+'</div>';seen.add(j);
      if(seen.size===P.length&&!L.$('#e17ok')){L.$('#e17c').insertAdjacentHTML('beforeend','<span id="e17ok"></span>');L.done();}};
    L.$('#e17').appendChild(b);});

{part:2,src:'Chapter 6 · Partitioning of Key-Value Data',pts:6,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'What happens here?',['A hot spot','A query that asks every partition','Works well'],[
   ['Parcels are range-partitioned by booking time. Peak Week Monday morning, bookings pour in.',0,'New bookings all have keys near “now”, so they crowd onto the newest range.'],
   ['Parcels are hash-partitioned by tracking code. A recipient opens the tracking page for one parcel.',2,'The tracking code gives the hash, the hash gives the partition: one hop.'],
   ['Parcels are hash-partitioned by tracking code. Linh wants codes OP-10000 to OP-19999.',1,'Hashing scattered neighbouring codes, so the range is spread over every partition.'],

{part:2,src:'Chapter 6 · Partitioning by Hash of Key',pts:1,
 solve:async L=>{L.$('#k19m').click();L.$('#m19h').click();L.$('#c19').click();},
 run(L){
  let first=true,passed=false;
  L.h(L.kick('pr','Challenge')+'<h1 class="q">Design the bookings key for Peak Week. Writes must spread (no partition over 40%), and “Bramble & Bolt’s bookings, last week” must read one partition.</h1>'+
   '<div class="pz-lbl">Key</div><div class="pz-row" id="k19"></div><div class="pz-lbl">Scheme</div><div class="pz-row" id="m19"></div>'+
   '<div id="g19"></div><div id="r19"></div><button class="btn pri" id="c19" style="margin-top:6px">'+L.ic('check')+'Check my design</button>'+CSS);
  const goals=()=>{const ok1=r.max()<=HOT,ok2=rQuery(r.S,'bb').parts.length===1;
    L.$('#g19').innerHTML=[[ok1,'Writes spread: busiest partition at most 40%'],[ok2,'B&amp;B’s last week reads one partition']].map(g=>'<div class="pz-goal"><b class="'+(g[0]?'pz-ok':'pz-hot')+'">'+(g[0]?'✓':'✗')+'</b>'+g[1]+'</div>').join('');return ok1&&ok2;};
  const r=L.rul=Ruler(L,L.$('#r19'),{id:'r19',key:'time',q:'bb',on:()=>{if(L.$('#g19'))goals();}});
  chipRow(L.$('#k19'),[['k19t','Booked-at'],['k19c','Region + code'],['k19m','Merchant + booked-at']],j=>r.set({key:['time','code','mkey'][j]}),0);
  chipRow(L.$('#m19'),[['m19r','Key ranges'],['m19h','Hash of key']],j=>r.set({mode:j?'hash':'range'}),0);
  goals();
  L.$('#c19').onclick=()=>{if(passed)return;const ok=goals();
    if(first){L.award(ok);first=false;}
    if(ok){passed=true;L.sheet('ok','Design passes','Merchant first, booked-at second. Writes spread over many shops, and one shop’s week is one range scan on one partition. Hashing the merchant is one way, as in Cassandra’s compound key; key ranges work here too. B&amp;B still makes its partition the busiest, at 36%.');L.done();}
    else L.sheet('no','Not yet','Look at the red cross. A time-first key piles today onto one partition, or scatters one shop’s week. A key that doesn’t start with the merchant can’t find one shop’s bookings in one place. Change the key or scheme and check again.');};}},

/* ---------- PART 4: SECONDARY INDEXES ---------- */
{part:3,src:'Chapter 6 · Partitioning and Secondary Indexes',run(L){
  L.h(L.kick('learn','The problem with secondary indexes')+'<h1 class="q">The key tells you where a parcel lives. A postcode doesn’t.</h1>'+CSS+'<div id="v20"></div>'+
   L.prose('Parcels are spread by a hash of the tracking code. A '+L.g('secondary-index','secondary index')+' finds records by another value, like postcode WP4, whose parcels sit on six of eight partitions.')+
   '<p class="small">Relational databases rely on them; Solr and Elasticsearch exist for them.</p>');
  Pillars(L,L.$('#v20'),{id:'v20',shelf:false,read:false});
  L.done();}},
{part:3,src:'Chapter 6 · Partitioning Secondary Indexes by Document',run(L){
  L.h(L.kick('learn','Option 1: a local index')+'<h1 class="q">Each partition indexes only its own parcels</h1>'+CSS+'<div id="v21"></div>'+
   L.prose('A '+L.g('local-index','local index')+' makes a booking write one partition. But a search must ask all eight and combine the answers: '+L.g('scatter-gather','scatter/gather')+', as slow as the slowest partition.')+
   '<p class="small">MongoDB, Riak, Cassandra, Elasticsearch, SolrCloud and VoltDB work this way. The book’s example is a used-car site searching for red cars.</p>');
  Pillars(L,L.$('#v21'),{id:'v21',read:false,lines:[0,1,2,3,4,5,6,7].map(k=>({f:'s',k,col:'var(--h2)'})).concat([{f:'b',k:HOME,col:'var(--h1)'}])});
  L.done();}},
{part:3,src:'Chapter 6 · Partitioning Secondary Indexes by Term',run(L){
  L.h(L.kick('learn','Option 2: a global index')+'<h1 class="q">One index for all parcels, split by the term you search for</h1>'+CSS+'<div id="v22"></div>'+
   L.prose('A '+L.g('global-index','global index')+' is partitioned by the searched value (the <b>term</b>): WP4 lives on P8. A search asks one partition, but a booking also writes each term’s partition, often later.')+
   '<p class="small">Split by the term itself for range scans (like a price range), or by a hash of the term for an even load.</p>');
  Pillars(L,L.$('#v22'),{id:'v22',mode:'global',read:false,lines:[{f:'s',k:PCI,col:'var(--h2)'},{f:'b',k:HOME,col:'var(--h1)'},{f:'b',k:PCI,col:'var(--h3)',dash:1},{f:'b',k:MCI,col:'var(--h3)',dash:1}]});
  L.done();}},
{part:3,src:'Chapter 6 · Partitioning and Secondary Indexes',
 solve:async L=>{const p=L.pil;L.$('#a23s').click();await p.idle();L.$('#a23b').click();await p.idle();L.$('#m23g').click();L.$('#a23s').click();await p.idle();L.$('#a23b').click();await p.idle();},
 run(L){
  const seen=new Set();
  L.h(L.kick('ex','Hands-on · the index pillars')+'<h1 class="q">Run Signe’s search and a booking with each kind of index. Count the partitions each one touches.</h1>'+
   tasks('t23',['Local index: search and book','Global index: search and book'])+
   '<div class="pz-row pz-sm" id="m23"></div><div class="pz-row"><button class="btn pri" id="a23s">'+L.ic('eye')+'Search WP4</button><button class="btn" id="a23b">'+L.ic('box')+'Book a parcel</button></div><div id="v23"></div>'+CSS);
  const p=L.pil=Pillars(L,L.$('#v23'),{id:'v23',on:e=>{
    if(e.type==='search'||e.type==='book')seen.add(e.mode+e.type);
    if(seen.has('localsearch')&&seen.has('localbook'))tick(L,'t23',0);
    if(seen.has('globalsearch')&&seen.has('globalbook'))tick(L,'t23',1);
    if(allDone(L,'t23')&&!L.$('#t23ok')){L.$('#t23').insertAdjacentHTML('afterend','<span id="t23ok"></span>');
      L.sheet('info','The trade, in one picture','Local: a booking writes 1 partition, a search asks all 8. Global: a search asks 1 partition, a booking writes 3, and the index catches up a moment later. You choose which side pays.');L.done();}}});
  chipRow(L.$('#m23'),[['m23l','Local index'],['m23g','Global index']],j=>{if(p.S.busy)return;p.setMode(j?'global':'local');},0);
  L.$('#a23s').onclick=()=>p.search();L.$('#a23b').onclick=()=>p.book();}},
{part:3,src:'Chapter 6 · Partitioning Secondary Indexes by Term',
 solve:async L=>{for(let j=0;j<3;j++){L.$('#e24b'+j).click();await L.sleep(30);await L.pil.idle();for(let i=0;i<60&&L.$('#e24b'+j).disabled;i++)await L.sleep(30);}},
 run(L){
  const seen=new Set();let busy=false;
  L.h(L.kick('ex','Edge cases')+'<h1 class="q">Where does each index stop protecting you? Run all three cases.</h1><div class="pz-row pz-sm" id="e24"></div><div id="e24c"></div><div id="v24"></div>'+CSS);
  const p=L.pil=Pillars(L,L.$('#v24'),{id:'v24'});
  const P=[
   ['Slow P6 · local',async()=>{p.setMode('local');p.setSlow(5);await p.search();},'Scatter/gather waits for every answer, so one slow partition makes every search slow. That’s tail latency amplification, from chapter 1.'],
   ['Slow P6 · global',async()=>{p.setMode('global');p.setSlow(5);await p.search();},'The search asks only P8, so the slow P6 doesn’t matter, unless the term you want lives on P6.'],
   ['Search just after booking · global',async()=>{p.setMode('global');p.setSlow(-1);await p.book();await p.search();},'The parcel is saved, but its index entry is still on its way. DynamoDB says its global indexes usually catch up within a fraction of a second, and take longer when something fails. Keeping them exact would need a distributed transaction.']];
  P.forEach((c,j)=>{const b=document.createElement('button');b.className='chip';b.id='e24b'+j;b.textContent=c[0];
    b.onclick=async()=>{if(busy||p.S.busy)return;busy=true;[...L.$('#e24').children].forEach(x=>{x.classList.toggle('sel',x===b);x.disabled=true;});
      L.$('#e24c').innerHTML='<div class="fb info" style="margin:4px 0 6px;font-size:14.5px">Running…</div>';
      await c[1]();if(!p.alive())return;
      L.$('#e24c').innerHTML='<div class="fb info" style="margin:4px 0 6px;font-size:14.5px">'+c[2]+'</div>';seen.add(j);busy=false;[...L.$('#e24').children].forEach(x=>{x.disabled=false;});
      if(seen.size===P.length&&!L.$('#e24ok')){L.$('#e24c').insertAdjacentHTML('beforeend','<span id="e24ok"></span>');L.done();}};
    L.$('#e24').appendChild(b);});
  L.$('#e24c').innerHTML='<div class="fb info" style="margin:4px 0 6px;font-size:14.5px">Tap a case to run it.</div>';}},
{part:3,src:'Chapter 6 · Partitioning and Secondary Indexes',pts:5,run(L){
  L.h(L.kick('pr','Local or global?')+'<h1 class="q">For each need, which kind of index fits better?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Local index','Global index'],[
   ['Searches are rare, but Peak Week bookings must stay as cheap as possible',0,'A local index keeps each write inside one partition.'],
   ['Signe’s team searches all day long, and each search must be quick',1,'A global index answers from one index partition, with no scatter/gather.'],
   ['The slowest of 40 partitions keeps dragging search times up',1,'That’s tail latency amplification from scatter/gather. A global index avoids asking all 40.'],
   ['Each booking must write only to the partition that stores the parcel itself',0,'A local index sits in the same partition as the parcel, so one partition is enough.'],
   ['Merchants refresh their dashboards all day; bookings are far fewer',1,'Reads dominate, so make each read hit one index partition and accept heavier writes.']],
   'Local: cheap writes, scattered reads. Global: targeted reads, heavier and often delayed writes.');}}
  ]
});
