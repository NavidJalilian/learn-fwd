/* =====================================================================
   Lesson 0033 only. Two signature models, reused through the lesson:
   1. The duplicate onion: four nested rings, each one the reach of one
      duplicate check (outermost: the whole booking from the packer’s
      click; then one API call from Bramble & Bolt’s server; then one
      transaction between the API server and the Parcel DB; innermost:
      one TCP connection). A retry starts in one ring. A check catches
      it only if the retry started inside that check’s ring. The Parcel
      DB in the middle counts parcels booked (1 or 2).
   2. The audit chain: Bramble & Bolt’s October booking events as a hash
      chain, the ledger derived from them, and the merchant’s own
      records. Inject faults, then run three checks (walk the hash
      chain, re-derive the ledger, compare end to end); each has its
      own blind spot.
   Plus: the slot-claim log (uniqueness by partition), the crash-and-
   replay splitter (multi-partition without atomic commit), the wait
   slider (timeliness vs integrity) and the apology trade-off chart.
   ===================================================================== */
document.head.insertAdjacentHTML('beforeend','<style>'+

 '.pic33{width:100%;display:block;margin:4px 0 2px}'+

/* ---------------- tiny SVG helpers ---------------- */
const tx=(x,y,t,cls,st)=>'<text x="'+x+'" y="'+y+'" class="'+(cls||'t33')+'"'+(st?' style="'+st+'"':'')+'>'+t+'</text>';
const txc=(x,y,t,cls,st)=>'<text x="'+x+'" y="'+y+'" text-anchor="middle" class="'+(cls||'t33')+'"'+(st?' style="'+st+'"':'')+'>'+t+'</text>';
const txr=(x,y,t,cls,st)=>'<text x="'+x+'" y="'+y+'" text-anchor="end" class="'+(cls||'t33')+'"'+(st?' style="'+st+'"':'')+'>'+t+'</text>';
const rc=(x,y,w,h,fill,stroke,sw,dash,rx)=>'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+(rx==null?10:rx)+'" style="fill:var(--'+fill+');stroke:var(--'+(stroke||'line2')+');stroke-width:'+(sw||1.5)+(dash?';stroke-dasharray:5 4':'')+'"/>';
const f1=n=>Math.round(n*10)/10;
const arr=(x1,y1,x2,y2,col,dash,w)=>{const a=Math.atan2(y2-y1,x2-x1),hx=x2-8*Math.cos(a),hy=y2-8*Math.sin(a),s=Math.sin(a),c=Math.cos(a),k=col||'muted';
  return '<path d="M'+f1(x1)+' '+f1(y1)+' L'+f1(hx)+' '+f1(hy)+'" style="fill:none;stroke:var(--'+k+');stroke-width:'+(w||2)+(dash?';stroke-dasharray:5 4':'')+'"/>'+
   '<path d="M'+f1(x2)+' '+f1(y2)+' L'+f1(hx-4.5*s)+' '+f1(hy+4.5*c)+' L'+f1(hx+4.5*s)+' '+f1(hy-4.5*c)+'z" style="fill:var(--'+k+')"/>';};
const pill=(x,y,w,t,kind)=>{const f=kind==='ok'?'ok-bg':kind==='no'?'no-bg':'soft2',s=kind==='ok'?'ok':kind==='no'?'no':'line2',c=kind==='ok'?'ok':kind==='no'?'no':'muted';
  return rc(x,y,w,20,f,s,1.5,false,10)+txc(x+w/2,y+14,t,'k33','fill:var(--'+c+')');};
const vd=(k,t)=>'<span class="vd33 '+k+'">'+t+'</span>';
const svg33=(h,label,body)=>'<svg class="pic33" viewBox="0 0 340 '+h+'" role="img" aria-label="'+label+'">'+body+'</svg>';
const money=c=>'$'+(c/100).toFixed(2);

/* =================== Signature 1: the duplicate onion =================== */
const RG=['Whole booking, from the click','One API call from the shop','One transaction, API ↔ DB','One TCP connection'];
const RX=k=>({x:4+14*k,y:4+36*k,w:332-28*k,h:292-48*k});
const ORG=[
 {t:'Packer clicks “Book” again',d:'The packer saw an error and clicked again, so the shop sends a brand-new call.'},
 {t:'Shop server retries',d:'The reply was lost, so Bramble & Bolt’s server sent the booking again as a new request.'},
 {t:'API server reruns the transaction',d:'The DB connection timed out after COMMIT, so the API server reconnected and ran it again.'},
 {t:'TCP resends a packet',d:'A packet looked lost, so TCP sent it again on the same connection.'}];
const IDS={api:{k:2,t:'API server'},shop:{k:1,t:'shop server'},form:{k:0,t:'booking form'}};
function onionEval(s){
  const g=[{n:'TCP sequence numbers',tag:'TCP',k:3,on:true}];
  if(s.tpc)g.push({n:'two-phase commit recovery',tag:'2PC',k:2,on:true});
  if(s.id)g.push({n:'the request ID from the '+IDS[s.id].t,tag:'ID',k:IDS[s.id].k,on:!!s.uq,id:true});
  if(s.o==null)return {g,caught:null,by:[],unchecked:false};
  const by=g.filter(x=>x.on&&x.k<=s.o);
  return {g,caught:by.length>0,by,unchecked:!!(s.id&&!s.uq&&IDS[s.id].k<=s.o)};
}
function onionSVG(s,R,anim){
  let h='';
  for(let k=0;k<4;k++){const r=RX(k),hit=R.by.some(x=>x.k===k);
    h+='<rect x="'+r.x+'" y="'+r.y+'" width="'+r.w+'" height="'+r.h+'" rx="'+(18-2*k)+'" style="fill:var(--'+(k%2?'card':'soft')+');stroke:var(--'+(hit?'ok':'line2')+');stroke-width:'+(hit?3:1.5)+'"/>';
    h+=tx(r.x+10,r.y+22,RG[k]);
    const gs=R.g.filter(x=>x.k===k);
    if(gs.length){const lab=gs.map(x=>x.tag).join('+'),w=16+lab.length*7.4,x=r.x+r.w-8-w,live=gs.some(x=>x.on);
      h+='<rect x="'+f1(x)+'" y="'+(r.y+8)+'" width="'+f1(w)+'" height="20" rx="10" style="fill:var(--'+(hit?'ok-bg':live?'pri-bg':'soft2')+');stroke:var(--'+(hit?'ok':live?'pri':'line2')+');stroke-width:1.5'+(live?'':';stroke-dasharray:4 3')+'"/>'+
        txc(f1(x+w/2),r.y+22,lab,'k33','fill:var(--'+(hit?'ok':live?'pri-deep':'muted')+')');}
  }
  const n=R.caught===false?2:1,bad=n===2;
  h+=rc(66,152,208,96,'card',bad?'no':'line2',bad?2.5:1.5)+txc(170,172,'Parcel DB','t33')+
    txc(170,199,n+(n===1?' parcel booked':' parcels booked'),'b33','fill:var(--'+(bad?'no':R.caught?'ok':'ink')+')')+
    txc(170,218,money(420*n)+' charged to Bramble & Bolt','m33');
  if(s.uq)h+=rc(102,226,136,17,'pri-bg','pri',1,false,8)+txc(170,238.5,'UNIQUE (request_id)','k33','fill:var(--pri-deep)');
  if(s.o!=null){const y0=RX(s.o).y+18,col=R.caught?'ok':'no';
    h+=arr(232,y0+11,232,150,col,!R.caught,2.5)+
      '<circle cx="232" cy="'+y0+'" r="10" style="fill:var(--'+col+'-bg);stroke:var(--'+col+');stroke-width:2"/>'+txc(232,y0+4.5,'↻','t33','fill:var(--'+col+')');
    if(anim)h+='<circle r="5" cx="232" cy="'+y0+'" style="fill:var(--'+col+')"><animate attributeName="cy" from="'+y0+'" to="148" dur="0.6s" fill="freeze"/></circle>';}
  return h;
}
function onionRead(s,R){
  if(s.o==null)return 'Pick where the retry starts. So far: one booking, 1 parcel, $4.20.';
  let t=(R.caught?vd('ok','1 parcel'):vd('no','2 parcels'))+ORG[s.o].d+' ';
  if(R.caught)t+='Caught by '+R.by.map(x=>x.n).join(' and ')+': the retry started inside its ring.';
  else t+='No working check’s ring contains where it started, so every layer sees a brand-new booking.';
  if(R.unchecked)t+=' The request ID was carried along, but with no unique constraint the Parcel DB never checked it.';
  return t;
}
function Onion(host,cfg){
  const s=Object.assign({o:null,tpc:false,id:null,uq:false},cfg.s||{}),P=cfg.pre,ctl=cfg.ctl||[];
  let html=svg33(300,'Four nested rings, each the reach of one duplicate check. Outermost: the whole booking from the packer’s click. Then one API call from the shop. Then one transaction between the API server and the Parcel DB. Innermost: one TCP connection. The Parcel DB in the middle counts parcels booked.','');
  if(!cfg.noRead)html+='<div class="rd33" aria-live="polite"></div>';
  if(ctl.includes('o'))html+='<div class="lab33">Where the retry starts</div><div class="row33">'+ORG.map((x,k)=>'<button class="chip" id="'+P+'o'+k+'">'+x.t+'</button>').join('')+'</div>';
  if(ctl.includes('g'))html+='<div class="lab33">Duplicate checks</div><div class="row33"><span class="chip static">TCP: always on</span><button class="chip" id="'+P+'tpc"></button><button class="chip" id="'+P+'uq"></button></div>'+
    '<div class="lab33">Request ID made in the…</div><div class="row33">'+[['none','nowhere'],['api','API server'],['shop','shop server'],['form','booking form']].map(x=>'<button class="chip" id="'+P+'id-'+x[0]+'">'+x[1]+'</button>').join('')+'</div>';
  host.innerHTML=html;
  const svg=host.querySelector('svg'),rd=host.querySelector('.rd33');
  const o={s};
  o.draw=anim=>{const R=onionEval(s);svg.innerHTML=onionSVG(s,R,anim);if(rd)rd.innerHTML=cfg.read?cfg.read(s,R):onionRead(s,R);
    if(ctl.includes('o'))ORG.forEach((_,k)=>{const b=host.querySelector('#'+P+'o'+k);if(b)b.classList.toggle('sel',s.o===k);});
    if(ctl.includes('g')){const t=host.querySelector('#'+P+'tpc'),u=host.querySelector('#'+P+'uq');
      t.textContent='2PC recovery: '+(s.tpc?'on':'off');t.classList.toggle('sel',s.tpc);
      u.textContent='Unique constraint: '+(s.uq?'on':'off');u.classList.toggle('sel',s.uq);
      ['none','api','shop','form'].forEach(k=>host.querySelector('#'+P+'id-'+k).classList.toggle('sel',(s.id||'none')===k));}
    return R;};
  o.set=(p,anim)=>{Object.assign(s,p);const R=o.draw(anim);if(cfg.on)cfg.on(s,R);return R;};
  if(ctl.includes('o'))ORG.forEach((_,k)=>{host.querySelector('#'+P+'o'+k).onclick=()=>o.set({o:k},true);});
  if(ctl.includes('g')){host.querySelector('#'+P+'tpc').onclick=()=>o.set({tpc:!s.tpc});host.querySelector('#'+P+'uq').onclick=()=>o.set({uq:!s.uq});
    ['none','api','shop','form'].forEach(k=>{host.querySelector('#'+P+'id-'+k).onclick=()=>o.set({id:k==='none'?null:k});});}
  o.draw(false);
  return o;
}

/* ---------------- $11 becomes $22: a sequence diagram you step through ---------------- */
function seqSVG(st){
  let h=rc(14,4,72,26,'h1-bg','h1')+txc(50,22,'App')+rc(250,4,80,26,'h2-bg','h2')+txc(290,22,'Database');
  h+='<path d="M50 30 V206 M290 30 V206" style="stroke:var(--line2);stroke-width:1.5;stroke-dasharray:3 4"/>';
  const msg=(y,t,col,back,dash)=>(back?arr(288,y,52,y,col,dash):arr(52,y,288,y,col,dash))+txc(170,y-5,t,'m33',col&&col!=='muted'?'fill:var(--'+col+')':'');
  if(st>=1){h+=msg(50,'BEGIN')+msg(70,'UPDATE 1234: + $11')+msg(90,'UPDATE 4321: − $11')+msg(110,'COMMIT');
    h+=txr(284,126,'committed ✓','m33','fill:var(--ok)');}
  if(st>=2){h+=msg(142,'reply lost: connection timed out','no',true,true)+'<circle cx="270" cy="142" r="8" style="fill:var(--no-bg);stroke:var(--no)"/>'+txc(270,146,'✗','k33','fill:var(--no)');}
  if(st>=3){h+=rc(56,152,228,16,'soft2','soft2',1,false,6)+txc(170,164,'new connection','k33');
    const g=st>=4;
    h+=msg(186,g?'2PC: reconnect, ask “did it commit?”':'BEGIN · +$11 · −$11 · COMMIT, again',g?'ok':'no');
    if(g)h+=txr(284,202,'yes: nothing reruns','m33','fill:var(--ok)');}
  const moved=st===0?0:st===3?22:11,bad=moved===22;
  h+=rc(4,214,332,52,bad?'no-bg':moved?'ok-bg':'soft',bad?'no':moved?'ok':'line2')+tx(16,236,'Moved from 4321 to 1234','t33')+tx(16,254,bad?'twice: not idempotent':moved?'once':'nothing yet','m33')+
    txr(322,250,'$'+moved,'b33','font-size:24px;fill:var(--'+(bad?'no':moved?'ok':'muted')+')');
  return svg33(270,'Sequence diagram: an app sends a money transfer to a database, the reply is lost, and the app reruns it on a new connection',h);
}

 h+=rc(174,2,164,132,'soft','line2')+tx(184,22,'Database')+pill(186,34,140,'bug writes bad data','no')+arr(256,56,256,70)+
  tx(186,86,'still there next year…','m33');
 for(let j=0;j<6;j++)h+='<rect x="'+(188+j*23)+'" y="94" width="18" height="12" rx="3" style="fill:var(--no-bg);stroke:var(--no)"/>';
 h+=tx(186,126,'and in copies, backups','m33','fill:var(--no)');
 h+=rc(2,142,336,42,'ok-bg','ok')+tx(12,159,'Append-only data helps','t33','fill:var(--ok)')+tx(12,176,'buggy code can add bad records, not destroy good ones','m33','fill:var(--ink)');
 h+=rc(2,192,164,84,'pri-bg','pri')+tx(12,212,'Serializable +','t33')+tx(12,228,'atomic commit','t33')+tx(12,246,'strong, but usually one','m33')+tx(12,262,'datacenter; limits scale','m33');
 h+=rc(174,192,164,84,'soft2','line2')+tx(184,212,'Cross your fingers','t33')+tx(184,232,'fine only if losing or','m33')+tx(184,248,'corrupting some data','m33')+tx(184,264,'now and then is OK','m33');
 h+=tx(4,298,'Transactions: the main tool for ~40 years, but…','t33');

 h+=rc(174,306,164,44,'no-bg','no')+tx(184,323,'Jepsen tests','t33','fill:var(--no)')+tx(184,340,'found broken promises','m33','fill:var(--ink)');
 return svg33(352,'Left: a read-only service recovers from a bug by restarting. Right: a database keeps a bad write for good; append-only data means buggy code cannot destroy good records. Then the two traditional choices, strong transactions or crossing your fingers. Last: transactions have been the main tool for about 40 years, but weak isolation levels confuse people and Jepsen tests found databases breaking their promises',h);})();

const PIC_IDS=(()=>{let h=rc(64,4,212,58,'card','line2')+txc(170,24,'Book courier · Bramble & Bolt')+
  rc(78,32,184,22,'pri-bg','pri',1.5,true,6)+txc(170,47,'hidden field: id = bb-7f3','m33','fill:var(--pri-deep)');
 h+=arr(132,62,132,98)+arr(208,62,208,98)+txr(124,84,'try 1 · bb-7f3','m33')+tx(216,84,'try 2 · bb-7f3','m33');
 h+=rc(92,98,156,28,'soft','line2')+txc(170,117,'Merchant API server','t33');
 h+=arr(132,126,132,150)+arr(208,126,208,150);
 h+=rc(4,150,332,110,'card','line2')+tx(14,170,'Parcel DB · table “requests”')+txr(326,170,'UNIQUE (request_id)','k33','fill:var(--pri-deep)');
 h+=rc(14,180,312,32,'ok-bg','ok')+tx(24,201,'bb-7f3 · OP-48213 · $4.20')+txr(316,201,'✓ inserted','t33','fill:var(--ok)');
 h+=rc(14,220,312,32,'no-bg','no',1.5,true)+tx(24,241,'bb-7f3 · again')+txr(316,241,'✗ exists → abort','t33','fill:var(--no)');
 h+=rc(4,268,332,42,'ok-bg','ok')+tx(14,285,'✓ The DB’s constraint holds at weak isolation','t33','fill:var(--ok)')+tx(14,302,'app code that checks, then inserts, may not','m33','fill:var(--ink)');

const PIC_UNIQUE=(()=>{let h=rc(6,6,116,26,'h1-bg','h1',1.5,false,13)+txc(64,23,'Mrs. Okoro','t33','fill:var(--h1)')+rc(218,6,116,26,'h2-bg','h2',1.5,false,13)+txc(276,23,'Dan','t33','fill:var(--h2)');

      (bad?txr(x+98,Y+34,'✗','b33','fill:var(--no)'):'');
    if(col<2)h+=arr(x+104,Y+27,x+114,Y+27,'line2');});
  h+='<path d="M286 76 V83 H56 V88" style="fill:none;stroke:var(--line2);stroke-width:2"/>';
  const D=mk.der||new Set(),E=mk.e2e||new Set(),tot=S.led.reduce((a,l)=>a+l.c,0);
  h+=tx(4,162,'Ledger (derived) → invoice','k33')+txr(336,162,'invoice '+money(tot),'t33',tot!==2820&&opt.reveal?'fill:var(--no)':'');
  let cells=[];
  for(let i=0;i<6;i++){S.led.forEach((l,j)=>{if(l.i===i)cells.push({lab:'#'+(i+1),c:l.c,j});});
    if(!S.led.some(l=>l.i===i)&&(D.has('X'+i)||E.has('X'+i)))cells.push({lab:'#'+(i+1),miss:true});}
  cells.forEach((c,q)=>{const x=4+q*47,y=170,flag=c.miss||D.has('L'+c.j)||E.has('L'+c.j),chk=(mk.der||mk.e2e)&&!flag;
    h+=rc(x,y,43,40,flag?'no-bg':'card',flag?'no':chk?'ok':'line2',flag?2:1.5,c.miss,6)+txc(x+21.5,y+15,c.lab,'m33')+txc(x+21.5,y+32,c.miss?'?':(c.c/100).toFixed(2),'t33',flag?'fill:var(--no)':'');});
  h+=tx(4,232,'Bramble & Bolt’s own records','k33')+txr(336,232,opt.hideMer&&!mk.e2e?'ask them':'expects '+money(2820),'t33');
  const merBad=new Set();S.led.forEach((l,j)=>{if(E.has('L'+j))merBad.add(l.i);});for(let i=0;i<6;i++)if(E.has('X'+i))merBad.add(i);
  AP.forEach((c,i)=>{const x=4+i*47,y=240,b=merBad.has(i),hid=opt.hideMer&&!mk.e2e;
    h+=rc(x,y,43,40,b?'no-bg':'soft',b?'no':'line2',1.5,hid,6)+txc(x+21.5,y+15,'#'+(i+1),'m33')+txc(x+21.5,y+32,hid?'…':(c/100).toFixed(2),'t33');});
  return svg33(284,'Six booking events in a hash chain, the ledger lines derived from them with the invoice total, and Bramble & Bolt’s own records of the same six bookings',h);
}
function auditRead(S,mk){
  const out=[];
  if(mk.hash!=null)out.push(mk.hash>=0?vd('no','Hash chain')+'broken at event #'+(mk.hash+1)+': its stored bytes no longer match its hash.':vd('ok','Hash chain')+'intact: the log is as it was written.');
  const desc=set=>{const n=set.size;return n+' line'+(n===1?'':'s')+' differ'+(n===1?'s':'');};
  if(mk.der)out.push(mk.der.size?vd('no','Re-derive')+desc(mk.der)+' from what the events say.':vd('ok','Re-derive')+'the ledger matches the events.');
  if(mk.e2e)out.push(mk.e2e.size?vd('no','End to end')+desc(mk.e2e)+' from Bramble & Bolt’s records.':vd('ok','End to end')+'the bill matches what Bramble & Bolt booked.');
  return out.join('<br>');
}

Course.lesson({
  id:'0033', title:'Aiming for correctness', minutes:22, icon:'shield',
  goals:['Stop retries from doubling work with a request ID made at the client and checked at the database','Enforce uniqueness and multi-partition writes with ordered logs instead of atomic commit','Tell timeliness from integrity, and catch corruption with end-to-end audits'],
  parts:['End to end','Constraints','Timeliness vs integrity','Trust, but verify'],
  read:'Read “Aiming for Correctness” in chapter 12 for the full money-transfer walk-through and Kleppmann’s case for self-auditing systems.',
  glossary:{
    exactlyonce:'Exactly-once semantics (better called effectively-once): even if some work is retried after a fault, the visible result is as if every input was processed exactly once.',
    idempotence:'Idempotence: an operation that has the same effect whether it runs once or several times, so a retry can’t do it twice.',
    'request-id':'Request ID (operation identifier): a unique ID created once for an operation by the client, sent with every retry and checked at the database, so a repeat can be recognized and ignored.',
    'end-to-end':'End-to-end argument: the idea (Saltzer, Reed and Clark, 1984) that some jobs, like removing duplicates or catching corruption, can only be done completely by the applications at the two ends. Lower layers can help but can’t finish the job.',
    tob:'Total order broadcast: a way of sending messages so that none are lost and every node gets them in exactly the same order. Also called atomic broadcast.',
    timeliness:'Timeliness: users see data that is current. A timeliness problem, like a stale read, goes away if you wait and try again.',
    integrity:'Integrity: no corruption: nothing lost, nothing contradictory or false, and derived data that matches its source. An integrity problem stays until someone finds it and repairs it.',
    compensating:'Compensating transaction: a new, separate transaction that undoes the effects of an earlier committed one. To the database it is just another transaction.',
    auditing:'Auditing: checking the integrity of data, for example by re-reading it, comparing copies or rerunning the processing that produced it.',
    merkle:'Merkle tree: a tree of hashes. Changing any record changes the hashes above it, and it can prove efficiently that a record is part of a dataset.'
  },
  cheatsheet:[
    'Even <b>serializable transactions</b> can’t stop an app bug, or a repeated request, from writing wrong data.',
    'TCP, transactions and 2PC each catch duplicates <b>only inside their own ring</b>. A retry that starts further out looks brand new.',
    'Fix it end to end: a <b>request ID made once at the client</b> (hidden form field or hash of the form), carried through, and <b>checked by a unique constraint</b>.',
    '<b>End-to-end argument:</b> only the endpoints can fully guarantee correctness. Lower layers make problems rarer, not impossible.',
    'Uniqueness needs <b>consensus</b>: one leader, or route every claim on a value to <b>one log partition</b> read in order.',
    'Multi-partition writes without atomic commit: log <b>one message</b>, split it <b>deterministically</b>, <b>dedupe by request ID</b>.',
    '<b>Timeliness</b> problems fix themselves; <b>integrity</b> problems are permanent. Relax timeliness (apologize later) where it’s cheap; never integrity.',
    '<b>Trust, but verify:</b> hash the log, re-derive the derived data, and check the pipeline end to end. Each check has a blind spot.'
  ],
  steps:[
/* ---------- PART 1: END TO END ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Bramble & Bolt’s server books a parcel through Otterpost’s merchant API. The booking goes through, but the reply never arrives, so their code sends the same request again. What might happen?</h1>');
  L.mc(L.card,['Otterpost books two parcels and charges twice','Nothing: the network quietly drops the copy'],0,
   'To Otterpost the retry looks like a brand-new booking. This lesson is about making that retry harmless.',
   'The network only drops copies inside one connection. A retry sent later looks like a brand-new booking, so the parcel can be booked and charged twice.');}},

{part:0,src:'Chapter 12 · Aiming for Correctness',run(L){
  L.h(L.kick('learn','Why correctness is hard')+'<h1 class="q">Databases remember their mistakes</h1>'+PIC_REMEMBER+
   '<p class="capt33">Restart a read-only service and its bug is gone; a database keeps a bad write. Even serializable '+L.g('transaction','transactions')+' can’t stop an app bug writing wrong data. Kleppmann: transactions stay, but aren’t the last word.</p>');
  L.done();}},

{part:0,src:'Chapter 12 · Exactly-once execution of an operation',
 solve:async L=>{while(L.$('#n3'))L.$('#n3').click();},
 run(L){
  const CAP=['The book’s example: one transaction moves $11 from account 4321 to account 1234. Tap through it.',
   'The app sends BEGIN, both updates and COMMIT on one connection. The database commits: $11 moved.',
   'The connection times out before the reply arrives. Did it commit? The app can’t tell.',
   'The app reconnects and runs it again. A new connection is outside TCP’s duplicate check, and the transfer isn’t idempotent: <b>$22</b> moved. Real banks don’t work like this.',
   'Two-phase commit lets a coordinator reconnect and settle the in-doubt transaction instead of rerunning it. That fixes this hop, but not a person who clicks “submit” again.'];
  let st=0;
  L.h(L.kick('ex','Exactly-once execution')+'<h1 class="q">Retry, and $11 becomes $22</h1><div id="sq3"></div><div class="step33" id="sc3" aria-live="polite"></div><button class="btn pri" id="n3">'+L.ic('play')+'Next step</button>'+
   '<p class="capt33 sm">'+L.g('exactlyonce','Exactly-once')+' means the end effect is as if no fault happened, even after a retry. The surest route is an '+L.g('idempotence','idempotent')+' operation, which may need extra metadata (IDs already applied) and fencing during failover.</p>');
  const draw=()=>{L.$('#sq3').innerHTML=seqSVG(st);L.$('#sc3').innerHTML='<span class="n">Step '+st+' of 4</span>'+CAP[st];};
  draw();
  L.$('#n3').onclick=function(){st++;draw();if(st>=4){this.remove();L.sheet('info','Every layer guards only its own hop','TCP guards one connection. 2PC guards the hop between app and database. A person resubmitting a form sits outside both.');L.done();}};}},

{part:0,src:'Chapter 12 · Duplicate suppression',run(L){
  L.h(L.kick('learn','Duplicate suppression')+'<h1 class="q">The duplicate onion: each check sees only its own ring</h1><div id="on4"></div>'+
   '<p class="capt33">Each ring is how far one duplicate check can see. TCP sees one connection; a transaction, even with two-phase commit (2PC), one database session. Here the shop server’s retry starts outside both, so the Parcel DB books twice.</p>');
  Onion(L.$('#on4'),{pre:'a4',s:{o:1,tpc:true},noRead:true});
  L.done();}},

{part:0,src:'Chapter 12 · Duplicate suppression',
 solve:async L=>{L.$('#e5o0').click();L.$('#e5o1').click();L.$('#e5o3').click();},
 run(L){
  const tried=new Set();let dbl=false,shown=false;
  L.h(L.kick('pr','Explore')+'<h1 class="q">Start a retry in different rings. Which ones does Otterpost catch?</h1><div id="on5"></div>');
  Onion(L.$('#on5'),{pre:'e5',ctl:['o','g'],on:(s,R)=>{if(s.o!=null)tried.add(s.o);if(R.caught===false)dbl=true;
    if(tried.size>=3&&dbl&&!shown){shown=true;L.sheet('info','Where it starts decides everything','A check catches a retry only if the retry starts inside its ring. TCP catches its own resends; anything that starts further out gets through.');L.done();}}});}},

{part:0,src:'Chapter 12 · Duplicate suppression',pts:1,
 solve:async L=>{L.$('#p6').children[1].click();L.$('#go6').click();await L.sleep(1000);},
 run(L){
  let p=null;
  L.h(L.kick('try','Predict, then watch')+'<h1 class="q">Zainab turns on two-phase commit recovery and runs bookings at serializable isolation. Then Bramble & Bolt’s server retries after a lost reply. How many parcels?</h1><div id="on6"></div>'+
   '<div class="row33" id="p6"></div><button class="btn pri" id="go6" hidden>'+L.ic('play')+'Send the retry</button>');
  const o=Onion(L.$('#on6'),{pre:'p6',s:{tpc:true},read:(s,R)=>s.o==null?'Zainab’s setup: TCP plus 2PC recovery. One booking so far: 1 parcel, $4.20.':onionRead(s,R)});
  ['1 parcel: the database catches it','2 parcels: it gets through'].forEach((t,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=t;
    b.onclick=()=>{if(p!==null)return;p=j;b.classList.add('sel');L.$('#go6').hidden=false;};L.$('#p6').appendChild(b);});
  L.$('#go6').onclick=function(){this.remove();o.set({o:1},true);
    setTimeout(()=>{if(!L.$('#on6'))return;const ok=p===1;L.award(ok);
      L.sheet(ok?'ok':'no',ok?'You called it':'It gets through','2PC only covers the hop between the API server and the Parcel DB. Serializable isolation handles transactions running at the same time; this retry is a separate, later transaction. Both work inside that ring; the retry starts outside it.');L.done();},700);};}},

{part:0,src:'Chapter 12 · Operation identifiers',run(L){
  L.h(L.kick('learn','Operation identifiers')+'<h1 class="q">One ID per booking, made where the booking starts</h1>'+PIC_IDS+
   '<p class="capt33">The client makes one '+L.g('request-id','request ID')+' per booking (a UUID in a hidden form field, or a hash of the form) and sends it on every try. A unique constraint rejects the repeat, so the booking runs once.</p>');
  L.done();}},

{part:0,src:'Chapter 12 · Operation identifiers',
 solve:async L=>{for(let j=0;j<5;j++)L.$('#e8p'+j).click();},
 run(L){
  const P=[{nm:'TCP resends a packet',s:{o:3,tpc:false,id:null,uq:false},cap:'Inside one connection, TCP numbers packets and drops the copy. No extra work needed.'},
   {nm:'ID made by the API server',s:{o:1,tpc:false,id:'api',uq:true},cap:'Too late: each new request from the shop gets a fresh ID, so the retry looks new.'},
   {nm:'ID made by the shop server, packer clicks again',s:{o:0,tpc:false,id:'shop',uq:true},cap:'The second click is a new call, so the shop server gives it a new ID. The ID must come from where the booking starts.'},
   {nm:'ID in the form, no unique constraint',s:{o:0,tpc:false,id:'form',uq:false},cap:'The ID travels all the way, but nobody checks it. Carrying is not enough.'},
   {nm:'ID in the form + unique constraint',s:{o:0,tpc:false,id:'form',uq:true},cap:'Made at the outer end, checked at the inner end: every retry is caught.'}];
  const seen=new Set();let cur=null,shown=false;
  L.h(L.kick('pr','Edge cases')+'<h1 class="q">Where does a request ID stop protecting you? Run each case.</h1><div class="row33">'+P.map((p,j)=>'<button class="chip" id="e8p'+j+'">'+p.nm+'</button>').join('')+'</div><div id="on8"></div>');
  const o=Onion(L.$('#on8'),{pre:'e8',read:(s,R)=>cur?onionRead(s,R)+'<br><b>'+cur.cap+'</b>':'Pick a case.'});
  P.forEach((p,j)=>{L.$('#e8p'+j).onclick=()=>{P.forEach((_,q)=>L.$('#e8p'+q).classList.toggle('sel',q===j));cur=p;o.set(Object.assign({},p.s),true);seen.add(j);
    if(seen.size===P.length&&!shown){shown=true;L.sheet('info','Made at one end, checked at the other','An ID protects only from the ring where it is made. Make it where the booking starts, and check it where the write lands.');L.done();}};});}},

{part:0,src:'Chapter 12 · The end-to-end argument',run(L){
  L.h(L.kick('learn','The end-to-end argument')+'<h1 class="q">Only the two ends can finish the job</h1>'+PIC_E2E+
   '<p class="capt33">Saltzer, Reed and Clark’s '+L.g('end-to-end','end-to-end argument')+' (1984): some jobs can only be finished by the applications at the two ends. Lower layers still help: they make problems rarer, and HTTP would break without TCP’s ordering. They just can’t finish the job.</p>');
  L.done();}},

{part:0,src:'Chapter 12 · Applying end-to-end thinking in data systems',pts:1,
 solve:async L=>{L.$('#c10id-form').click();L.$('#c10uq').click();L.$('#go10').click();},
 run(L){
  L.h(L.kick('pr','Challenge')+'<h1 class="q">Tobias wants all four kinds of retry to be harmless. Set up the checks, then run all four.</h1><div id="on10"></div><button class="btn pri" id="go10">'+L.ic('play')+'Run all four retries</button><ul class="res33" id="r10"></ul>');
  const o=Onion(L.$('#on10'),{pre:'c10',ctl:['g'],read:(s,R)=>s.o==null?'Set the checks, then run all four retries.':onionRead(s,R)});
  let graded=false;
  L.$('#go10').onclick=()=>{const s=o.s,res=[0,1,2,3].map(k=>onionEval(Object.assign({},s,{o:k})).caught),all=res.every(x=>x);
    L.$('#r10').innerHTML=ORG.map((x,k)=>'<li>'+(res[k]?vd('ok','caught'):vd('no','2 parcels'))+x.t+'</li>').join('');
    o.set({o:0},true);
    if(!graded){graded=true;L.award(all);
      L.sheet(all?'ok':'no',all?'All four caught':'Not all caught yet',(all?'':'Hint: make the ID in the booking form and turn on the unique constraint. Try again; ')+'Transactions squash many problems into commit or abort, a big help, but a retry from outside never reaches them. Kleppmann suspects most homemade fault-tolerance code is wrong, and says we haven’t found the right abstraction yet.');L.done();}
    else if(all)L.sheet('ok','All four caught','A request ID made at the booking form, checked by the unique constraint, covers every ring.');};}},

/* ---------- PART 2: CONSTRAINTS ---------- */
{part:1,src:'Chapter 12 · Uniqueness constraints require consensus',run(L){
  L.h(L.kick('learn','Enforcing constraints')+'<h1 class="q">One winner per value means someone must decide</h1>'+PIC_UNIQUE+
   '<p class="capt33">Unique tracking codes, slot places, credit that stays above zero: all need one winner when claims clash. That is '+L.g('consensus','consensus')+'. To reject a clash immediately, some synchronous coordination is unavoidable.</p>');
  L.done();}},

{part:1,src:'Chapter 12 · Uniqueness in log-based messaging',pts:1,
 solve:async L=>{L.$('#p12').children[1].click();L.$('#go12').click();await L.sleep(1300);L.$('#fx12').click();await L.sleep(1300);},
 run(L){
  let p=null,key='rec',ran=0;
  L.h(L.kick('try','Predict, then run')+'<h1 class="q">Peak Week. Mrs. Okoro and Dan claim the last place in a slot. Tobias partitions claims by recipient to spread the load. What happens?</h1><div id="sl12"></div><div class="rd33" id="rd12" aria-live="polite">Each partition has one processor reading it in order, with a local count of places left.</div>'+
   '<div class="row33" id="p12"></div><button class="btn pri" id="go12" hidden>'+L.ic('play')+'Run the processors</button><button class="btn pri" id="fx12" hidden>'+L.ic('play')+'Partition by slot instead, and run</button>'+
   '<p class="capt33 sm">A log gives every consumer the same order ('+L.g('tob','total order broadcast')+', equivalent to consensus). Each client watches the output stream for its answer.</p>');
  const draw=ph=>{L.$('#sl12').innerHTML=slotSVG(key,ph);};draw(0);
  const run=(after)=>{let ph=0;const t=setInterval(()=>{if(!L.$('#sl12')){clearInterval(t);return;}ph++;draw(ph);if(ph>=2){clearInterval(t);after();}},450);};
  ['1 accepted, 1 rejected','Both accepted'].forEach((t,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=t;
    b.onclick=()=>{if(p!==null)return;p=j;b.classList.add('sel');L.$('#go12').hidden=false;};L.$('#p12').appendChild(b);});
  L.$('#go12').onclick=function(){this.remove();run(()=>{const ok=p===1;L.award(ok);
    L.$('#rd12').innerHTML=vd('no','Overbooked')+'2 bookings for 1 place. Each processor saw only its own claim, so both said yes.';
    L.sheet(ok?'ok':'no',ok?'You called it':'Both were accepted','Claims on the same slot landed in different partitions, read by different processors. Partition by the thing that must stay unique. Now fix it.');
    L.$('#fx12').hidden=false;});};
  L.$('#fx12').onclick=function(){this.remove();key='slot';draw(0);run(()=>{
    L.$('#rd12').innerHTML=vd('ok','1 booking')+'Both claims sat in one partition. Its processor read Mrs. Okoro’s first (accepted), then Dan’s (rejected).';
    L.sheet('info','Conflicting writes, one partition','Route every write that might conflict to the same partition and process it in order. More partitions add throughput, and the processor can run any validation logic, not just “is it taken?”');L.done();});};}},

{part:1,src:'Chapter 12 · Multi-partition request processing',run(L){
  L.h(L.kick('learn','Multi-partition request processing')+'<h1 class="q">Two partitions, no atomic commit</h1>'+PIC_SPLIT+
   '<p class="capt33">Appending one message is atomic, so the booking is in the log or it isn’t. The splitter is deterministic: after a crash it emits the same two messages again, and consumers drop repeats by ID. No atomic commit needed.</p>');
  L.done();}},

{part:1,src:'Chapter 12 · Multi-partition request processing',
 solve:async L=>{for(let j=0;j<3;j++){L.$('#c14p'+j).click();await L.sleep(1450);}},
 run(L){
  const base={log:true,sp:'idle',deb:[],cre:[],ch:0,pc:0,dd:false,end:false};
  const P=[{nm:'Crash after the debit, no ID check',dd:false,log:true},{nm:'Crash after the debit, consumers drop repeated IDs',dd:true,log:true},{nm:'No request log: the shop sends both',dd:false,log:false}];
  const FIN=[vd('no','Charged twice')+'The restarted splitter emitted the debit again. With no ID check, the ledger applied it twice: $8.40 for one parcel.',
   vd('ok','Exactly once')+'Same crash, same two messages again. The ledger saw bb-7f3 a second time and dropped it: $4.20, one parcel.',
   vd('no','Money, no parcel')+'No message in a log remembers the booking, so nothing restarts the “create”. Bramble & Bolt paid $4.20 for nothing. Avoiding this needs atomic commit.'];
  const seen=new Set();let tm=null,shown=false;
  L.h(L.kick('pr','Edge cases')+'<h1 class="q">Linh’s new booking pipeline drops the two-phase commit with the billing ledger. Crash it three ways.</h1><div class="row33">'+P.map((p,j)=>'<button class="chip" id="c14p'+j+'">'+p.nm+'</button>').join('')+'</div><div id="cr14"></div><div class="rd33" id="rd14" aria-live="polite">Pick a case to run booking bb-7f3.</div>');
  L.$('#cr14').innerHTML=crashSVG(base);
  P.forEach((p,j)=>{L.$('#c14p'+j).onclick=()=>{if(tm)clearInterval(tm);P.forEach((_,q)=>L.$('#c14p'+q).classList.toggle('sel',q===j));
    const F=[Object.assign({},base,{log:p.log,dd:p.dd,sp:'run'}),{deb:['ok'],ch:420},{sp:p.log?'crash':'dead'},p.log?{sp:'again',deb:['ok',p.dd?'drop':'ok'],cre:['ok'],ch:p.dd?420:840,pc:1,end:true}:{end:true}];
    const C=['Booking bb-7f3 is processed.','The debit goes out first. Bramble & Bolt is charged $4.20.',p.log?'The splitter crashes before “create parcel”.':'The shop’s code crashes before “create parcel”.',FIN[j]];
    let st=Object.assign({},F[0]),k=0;
    const show=()=>{L.$('#cr14').innerHTML=crashSVG(st);L.$('#rd14').innerHTML=C[k];};show();
    tm=setInterval(()=>{if(!L.$('#cr14')){clearInterval(tm);return;}k++;st=Object.assign({},st,F[k]);show();
      if(k>=3){clearInterval(tm);tm=null;seen.add(j);
        if(seen.size===3&&!shown){shown=true;L.sheet('info','Integrity without atomic commit','The recipe: write the request as one message, derive everything else with deterministic code, carry the client’s request ID through every stage, and keep messages immutable so you can reprocess. Kleppmann calls it a very promising direction.');L.done();}}},380);};});}},

{part:1,src:'Chapter 12 · Multi-partition request processing',pts:1,run(L){
  L.h(L.kick('pr','Put it in order')+'<h1 class="q">Put Linh’s booking pipeline in order, from the merchant’s click to the stored records.</h1><div id="od15"></div>');
  L.order(L.$('#od15'),[
   'Bramble & Bolt’s system gives the booking a unique request ID',
   'A credit check, partitioned by merchant, confirms they can pay',
   'The booking is appended to the request log as one message',
   'A processor emits “debit $4.20” and “create parcel”, both with the ID',
   'Ledger and Parcel DB consumers drop repeated IDs and apply each change'],
   'Two differently partitioned stages plus one end-to-end ID: each booking is charged once and creates one parcel, even after crashes, with no atomic commit.');}},

/* ---------- PART 3: TIMELINESS VS INTEGRITY ---------- */
{part:2,src:'Chapter 12 · Timeliness and Integrity',run(L){
  L.h(L.kick('learn','Two meanings of “consistency”')+'<h1 class="q">Up to date and correct are different things</h1>'+PIC_TI+
   '<p class="capt33">Kleppmann splits “consistency” into '+L.g('timeliness','timeliness')+' and '+L.g('integrity','integrity')+'. A stale read heals by waiting; corruption doesn’t. He argues integrity matters far more.</p>'+
   L.quote('…violations of integrity are ‘perpetual inconsistency.’','Martin Kleppmann'));
  L.done();}},

{part:2,src:'Chapter 12 · Timeliness and Integrity',pts:1,
 solve:async L=>{L.$('#p17').children[0].click();const r=L.$('#r17');r.value=60;r.dispatchEvent(new Event('input',{bubbles:true}));},
 run(L){
  let p=null,graded=false;
  L.h(L.kick('pr','Predict, then wait')+'<h1 class="q">Signe’s team reports three problems. Which one will fix itself if you just wait?</h1><div id="w17"></div>'+
   '<div class="row33" id="p17"></div><div class="rng33" id="rg17" hidden><label for="r17">Minutes waited</label><b id="m17">0 min</b><input type="range" id="r17" min="0" max="60" step="1" value="0"></div>');
  L.$('#w17').innerHTML=waitSVG(0);
  ['The tracking page','The invoice','Support search'].forEach((t,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=t;
    b.onclick=()=>{if(p!==null)return;p=j;b.classList.add('sel');L.$('#rg17').hidden=false;};L.$('#p17').appendChild(b);});
  L.$('#r17').oninput=function(){const m=+this.value;L.$('#m17').textContent=m+' min';L.$('#w17').innerHTML=waitSVG(m);
    if(m>=60&&!graded){graded=true;const ok=p===0;L.award(ok);
      L.sheet(ok?'ok':'no',ok?'You called it':'Only the tracking page healed','The tracking page was a <b>timeliness</b> problem: the update was already on its way. The invoice and the index are <b>integrity</b> problems: an hour, a day or a year won’t fix them. Someone has to find and repair them.');L.done();}};}},

{part:2,src:'Chapter 12 · Timeliness and Integrity',pts:5,run(L){
  L.h(L.kick('pr','Sort them')+'<h1 class="q">Timeliness or integrity?</h1><div id="bk18"></div>');
  L.buckets(L.$('#bk18'),['Timeliness','Integrity'],[
   ['A merchant’s dashboard shows today’s parcel count 30 seconds behind.',0,'It catches up on its own. That’s timeliness.'],
   ['A courier’s “delivered” scan was processed twice, so they were paid twice for one drop.',1,'An event taking effect twice is corruption. It stays until someone fixes it.'],
   ['A parcel was charged to Bramble & Bolt but never recorded in the Parcel DB.',1,'Money charged with nothing to show for it: disappearing data, an integrity failure.'],
   ['A recipient reads from a lagging replica and can’t see the slot they just booked.',0,'The replica will catch up. Annoying, but temporary.'],
   ['A buggy consumer dropped an event, so a parcel’s history skips “at hub” forever.',1,'A lost event never comes back by waiting. Integrity.']],
   'Timeliness problems go away with time. Integrity problems need someone to notice and repair them, which is why they matter more.');}},

{part:2,src:'Chapter 12 · Loosely interpreted constraints',run(L){
  L.h(L.kick('learn','Loosely interpreted constraints')+'<h1 class="q">Break the rule now, say sorry later?</h1>'+PIC_SORRY+
   '<p class="capt33">Many businesses already break rules, even on purpose, and fix it with a '+L.g('compensating','compensating transaction')+'. If the apology is cheap, write now and check after. Check first only before steps you can’t undo. Integrity still holds: never lose the booking.</p>');
  L.done();}},

{part:2,src:'Chapter 12 · Loosely interpreted constraints',pts:4,
 solve:async L=>{for(let j=0;j<SC20.length;j++){L.$('#q20b'+SC20[j].r).click();await L.sleep(5);const nx=L.$('#nx20');if(nx&&!nx.hidden)nx.click();await L.sleep(5);}},
 run(L){
  let k=0,n=0,busy=false;const placed=[];
  L.h(L.kick('pr','Check first, or fix later?')+'<h1 class="q">Decide each Otterpost case, then see where it lands on the cost-of-sorry scale.</h1><div id="sc20"></div><div class="rd33" id="rd20" aria-live="polite"></div><div class="row33" id="ch20"></div><button class="btn pri" id="nx20" hidden>Next case</button>');
  const show=()=>{L.$('#sc20').innerHTML=sorryScaleSVG(placed);
    L.$('#rd20').innerHTML='<b>Case '+(k+1)+' of '+SC20.length+'.</b> '+SC20[k].t;
    L.$('#ch20').innerHTML=['Check strictly first','Write now, apologize if needed'].map((t,j)=>'<button class="chip" id="q20b'+j+'">'+t+'</button>').join('');
    [0,1].forEach(j=>{L.$('#q20b'+j).onclick=()=>pick(j);});};
  const pick=j=>{if(busy)return;busy=true;const c=SC20[k],ok=j===c.r;if(ok)n++;placed.push({k,ok});
    L.$('#q20b'+j).classList.add('sel');[0,1].forEach(q=>L.$('#q20b'+q).setAttribute('aria-disabled','true'));
    L.$('#sc20').innerHTML=sorryScaleSVG(placed,true);
    L.$('#rd20').innerHTML=vd(ok?'ok':'no',ok?'Right':'Not quite')+c.w;
    if(k<SC20.length-1)L.$('#nx20').hidden=false;
    else{L.awardMany(n,SC20.length);L.sheet(n===SC20.length?'ok':'info',n+' of '+SC20.length+' right','Where saying sorry is cheap, write now and fix it later with a compensating transaction. Check strictly first only before a step you can’t take back, like paying money out.');L.done();}};
  L.$('#nx20').onclick=function(){this.hidden=true;k++;busy=false;show();};
  show();}},

{part:2,src:'Chapter 12 · Coordination-avoiding data systems',run(L){
  L.h(L.kick('learn','Coordination-avoiding data systems')+'<h1 class="q">Femi asks: why not route every write through one global coordinator?</h1><div id="ch21"></div>'+
   '<div class="rng33"><label for="r21">How much coordination</label><b id="m21">40%</b><input type="range" id="r21" min="0" max="100" step="1" value="40"></div><div class="rd33" id="rd21" aria-live="polite"></div>'+
   '<p class="capt33">Dataflow keeps integrity without coordination, so Westport, Eastvale and Nordhaven can each run on their own. Coordinate only before steps you can’t undo. Zero apologies is out of reach; aim for the sweet spot.</p>');
  let best=0,bv=1e9;for(let j=0;j<=100;j++){const u=j/100,v=INC(u)+OUT(u);if(v<bv){bv=v;best=u;}}
  const draw=x=>{L.$('#ch21').innerHTML=tradeSVG(x);L.$('#m21').textContent=Math.round(x*100)+'%';
    L.$('#rd21').innerHTML=Math.abs(x-best)<=.1?vd('ok','Sweet spot')+'Fewest apologies in total. Serializable transactions still fit in small scopes; cross-system (XA) ones aren’t needed.':
     x<best?vd('no','Too little')+'Nobody waits, but more inconsistencies to apologize for, like an oversold slot.':
     vd('no','Too much')+'Fewer inconsistencies, but a slow or failed coordinator stalls everyone: more outage apologies.';};draw(.4);
  L.$('#r21').oninput=function(){draw(+this.value/100);};
  L.done();}},

/* ---------- PART 4: TRUST, BUT VERIFY ---------- */
{part:3,src:'Chapter 12 · Trust, but Verify',run(L){
  L.h(L.kick('learn','Trust, but verify')+'<h1 class="q">The things we assume never break do break, rarely</h1>'+PIC_MODEL+
   '<p class="capt33">A system model sorts faults into “can happen” and “never”. Really it’s probability: with enough machines, rare things happen, even in mature databases. So don’t trust blindly; check. That is '+L.g('auditing','auditing')+'.</p>');
  L.done();}},

{part:3,src:'Chapter 12 · Designing for auditability',run(L){
  L.h(L.kick('learn','Designing for auditability')+'<h1 class="q">Table changes say what. Events say why.</h1>'+PIC_AUDIT+
   '<p class="capt33">Table changes, even via change data capture, don’t show why: the code that decided ran once and is gone. Immutable events through a fixed code version can be hashed, replayed and compared, like time-travel debugging.</p>');
  L.done();}},

{part:3,src:'Chapter 12 · Designing for auditability',
 solve:async L=>{L.$('#a24f-flip').click();L.$('#a24c-hash').click();},
 run(L){
  let F=new Set(),mk={},shown=false;
  L.h(L.kick('pr','Explore')+'<h1 class="q">Bramble & Bolt disputes October’s invoice. Break something, then check.</h1><div id="au24"></div><div class="rd33" id="rd24" aria-live="polite"></div>'+
   '<div class="lab33">Inject a fault</div><div class="row33">'+['flip','twice','lost','db'].map(f=>'<button class="chip" id="a24f-'+f+'">'+FAULT[f].t+'</button>').join('')+'</div>'+
   '<div class="lab33">Run a check</div><div class="row33">'+Object.keys(CHECKS).map(k=>'<button class="chip" id="a24c-'+k+'">'+CHECKS[k]+'</button>').join('')+'</div>');
  const draw=()=>{const S=auditState(F);L.$('#au24').innerHTML=auditSVG(S,mk,{reveal:true});const tot=S.led.reduce((a,l)=>a+l.c,0);
    L.$('#rd24').innerHTML=(F.size?'Invoice now '+money(tot)+'. ':'No fault yet. Invoice $28.20, as Bramble & Bolt expects. ')+(Object.keys(mk).length?auditRead(S,mk):F.size?'Nothing has flagged it: without a check, nobody knows.':'');
    return S;};
  draw();
  ['flip','twice','lost','db'].forEach(f=>{L.$('#a24f-'+f).onclick=()=>{F=new Set([f]);mk={};['flip','twice','lost','db'].forEach(g=>L.$('#a24f-'+g).classList.toggle('sel',g===f));draw();};});
  Object.keys(CHECKS).forEach(k=>{L.$('#a24c-'+k).onclick=()=>{const S=auditState(F);mk[k]=k==='hash'?chkHash(S):k==='der'?chkDer(S):chkE2E(S);draw();
    if(F.size&&caughtBy(S,k)&&!shown){shown=true;L.sheet('info','Found it','Corruption you never check for stays silent. Here a check turned a hidden fault into a red mark you can trace and repair. Try other faults and checks.');L.done();}};});}},

{part:3,src:'Chapter 12 · Tools for auditable data systems',
 solve:async L=>{for(const f of Object.keys(FAULT))L.$('#a25p-'+f).click();},
 run(L){
  const seen=new Set();let shown=false;
  L.h(L.kick('pr','Edge cases')+'<h1 class="q">Every check has a blind spot. Run each fault against all three.</h1>'+
   '<div class="row33">'+Object.keys(FAULT).map(f=>'<button class="chip" id="a25p-'+f+'">'+FAULT[f].s+'</button>').join('')+'</div><div id="au25"></div>'+
   '<table class="mx33" id="mx25"><thead><tr><th>Fault</th><th>Hash chain</th><th>Re-derive</th><th>End to end</th></tr></thead><tbody></tbody></table>');
  const tb=cur=>{L.$('#mx25 tbody').innerHTML=Object.keys(FAULT).map(f=>'<tr'+(f===cur?' class="cur"':'')+'><td>'+FAULT[f].s+'</td>'+Object.keys(CHECKS).map(k=>seen.has(f)?(CATCH[f][k]?'<td class="y" aria-label="caught">✓</td>':'<td class="n" aria-label="missed">✗</td>'):'<td class="u">·</td>').join('')+'</tr>').join('');};
  L.$('#au25').innerHTML=auditSVG(auditState(new Set()),{},{reveal:true});tb(null);
  Object.keys(FAULT).forEach(f=>{L.$('#a25p-'+f).onclick=()=>{Object.keys(FAULT).forEach(g=>L.$('#a25p-'+g).classList.toggle('sel',g===f));
    const S=auditState(new Set([f]));L.$('#au25').innerHTML=auditSVG(S,{hash:chkHash(S),der:chkDer(S),e2e:chkE2E(S)},{reveal:true});seen.add(f);tb(f);
    if(seen.size===5&&!shown){shown=true;L.sheet('info','No check sees everything','This catch table is the lesson’s own model of the book’s three checks (hashes illustrative). Hashes prove the log wasn’t damaged, not that the right entries went in: a log signed by a hardware security module has the same limit. Kleppmann finds blockchains’ integrity checks interesting, is skeptical of the Byzantine fault tolerance and proof-of-work parts, and points to '+L.g('merkle','Merkle trees')+', as in certificate transparency.');L.done();}};});}},

{part:3,src:'Chapter 12 · The end-to-end argument again',pts:3,
 solve:async L=>{L.$('#a26c-hash').click();L.$('#a26c-e2e').click();L.$('#go26').click();},
 run(L){
  const PL=['flip','twice','bad'],pick=[];let graded=false;
  const S=auditState(new Set(PL));
  L.h(L.kick('pr','Challenge')+'<h1 class="q">Kwame has time to build two checks this quarter (an illustrative limit). Three faults are hidden in October’s billing. Pick the two that catch them all.</h1>'+
   '<div id="au26"></div><div class="lab33">Pick two checks</div><div class="row33">'+Object.keys(CHECKS).map(k=>'<button class="chip" id="a26c-'+k+'">'+CHECKS[k]+'</button>').join('')+'</div>'+
   '<button class="btn pri" id="go26">'+L.ic('play')+'Run the checks</button><ul class="res33" id="r26"></ul>');
  L.$('#au26').innerHTML=auditSVG(S,{},{hideMer:true});
  Object.keys(CHECKS).forEach(k=>{L.$('#a26c-'+k).onclick=()=>{const j=pick.indexOf(k);if(j>=0)pick.splice(j,1);else{pick.push(k);if(pick.length>2)pick.shift();}
    Object.keys(CHECKS).forEach(q=>L.$('#a26c-'+q).classList.toggle('sel',pick.includes(q)));};});
  L.$('#go26').onclick=()=>{if(!pick.length){L.err('Pick at least one check');return;}
    const mk={};pick.forEach(k=>{mk[k]=k==='hash'?chkHash(S):k==='der'?chkDer(S):chkE2E(S);});
    L.$('#au26').innerHTML=auditSVG(S,mk,{hideMer:true});
    const found=PL.map(f=>pick.some(k=>CATCH[f][k]));
    L.$('#r26').innerHTML=PL.map((f,j)=>'<li>'+(found[j]?vd('ok','found'):vd('no','missed'))+FAULT[f].t+'</li>').join('');
    const n=found.filter(x=>x).length;
    if(!graded){graded=true;L.awardMany(n,3);
      L.sheet(n===3?'ok':'no',n===3?'All three found':n+' of 3 found','The end-to-end comparison is the one you can’t skip: only it sees a wrong price written into the event itself. Pair it with the hash chain or a re-derivation to catch rot in the log. Checks that span the whole pipeline cover every disk, network and job in between, and like automated tests they let a team change things with less fear.');L.done();}};}}
  ]
});
</script>
