/* =====================================================================
   Lesson 0021 only. The signature model, used all through the lesson:
   Board = an operation-bar timing diagram with a linearizability checker.
   Each request is a bar from "sent" to "reply". A tick inside the bar
   marks when the request took effect. The checker walks the ticks in

const X=t=>10+t*3.2;                       /* time 0..100 -> x 10..330 */
const ST={p:['Picked up','h4'],h:['At hub','h1'],o:['Out','h3'],d:['Delivered','h2']};
const CR={a:['$50','h3'],b:['$80','h2']};
const LK={f:['free','h3'],p1:['Planner 1','h2'],p2:['Planner 2','h4']};
const LOC={m:['Mill Lane','h3'],k:['Dock Road','h2']};
const TC={f:['free','h3'],bb:['B&B','h2'],pt:['P&T','h4']};
const esc2=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');

/* is there ANY order of the operations that respects real time
   (a before b when a ended before b started) and is a valid run of one copy? */
function linSearch(ops,init){
  const n=ops.length,used=new Array(n).fill(false),order=[];
  const free=i=>ops.every((o,j)=>used[j]||j===i||!(o.e<ops[i].s));
  const dfs=cur=>{
    if(order.length===n)return true;
    for(let i=0;i<n;i++){
      if(used[i]||!free(i))continue;
      const o=ops[i];let nx=cur;
      if(o.k==='r'){if(o.v!==cur)continue;}
      else if(o.k==='w')nx=o.v;
      else{const hit=cur===o.f;if((o.res==='ok')!==hit)continue;if(hit)nx=o.v;}
      used[i]=true;order.push(o);
      if(dfs(nx))return true;
      used[i]=false;order.pop();
    }
    return false;};
  return dfs(init)?order.slice():null;
}

/* the timing board */
function Board(host,cfg){
  const b={cfg,ops:cfg.ops.map((o,j)=>Object.assign({id:'o'+j},o))};
  const vals=cfg.vals||ST;
  const V=v=>v==='?'?'?':(vals[v]?vals[v][0]:v);
  const C=v=>vals[v]?vals[v][1]:null;
  const hasSub=b.ops.some(o=>o.sub)||cfg.subs;
  const anyDrag=!!cfg.drag,LH=(hasSub?62:48)+(anyDrag?22:0),nL=cfg.lanes.length,SY=4+nL*LH+2,H=SY+(cfg.strip===false?18:44);
  b.ops.forEach(o=>{if(o.t==null)o.t=(o.s+o.e)/2;});
  host.innerHTML='<div class="tlw"><svg viewBox="0 0 340 '+H+'" role="img" aria-label="'+(cfg.aria||'Timing diagram: one bar per request, from sending it to getting the reply')+'"></svg></div>';
  const svg=host.querySelector('svg');b.svg=svg;
  b.op=id=>b.ops.find(o=>o.id===id);
  b.V=V;
  const nm=o=>o.nm||cfg.lanes[o.ln].split(' · ')[0];
  b.nm=nm;
  const canDrag=o=>!o.fail&&(cfg.drag===true||(Array.isArray(cfg.drag)&&cfg.drag.includes(o.id)));
  b.run=()=>{
    const seq=b.ops.filter(o=>!o.fail&&!o.hide).sort((a,c)=>a.t-c.t);
    let cur=cfg.init;const bad=new Set(),msg={},seg=[[0,cur]],marks=[];
    seq.forEach(o=>{
      if(o.k==='w'){cur=o.v;seg.push([o.t,cur]);}
      else if(o.k==='r'){
        if(cfg.derive)o.v=cur;
        else if(o.v!=='?'&&o.v!==cur){bad.add(o.id);msg[o.id]=nm(o)+' got <b>'+V(o.v)+'</b>, but at that tick the one copy says <b>'+V(cur)+'</b>.';}
        marks.push([o.t,o.v==='?'?null:!bad.has(o.id)]);}
      else{const hit=cur===o.f;
        if(cfg.derive)o.res=hit?'ok':'err';
        else if((o.res==='ok')!==hit){bad.add(o.id);msg[o.id]=nm(o)+'’s compare-and-set says <b>'+(o.res==='ok'?'ok':'error')+'</b>, but at that tick the value is <b>'+V(cur)+'</b>'+(hit?', so it would succeed.':', not '+V(o.f)+', so it must fail.');}
        if(hit){cur=o.v;seg.push([o.t,cur]);}}
    });
    return {seq,bad,msg,seg,marks};};
  b.draw=()=>{
    const R=b.run();b.last=R;let s='';const tk=cfg.ticks!==false;
    let labs='',txt='';const clash={};
    cfg.lanes.forEach((ln,i)=>{const y=4+i*LH;
      labs+='<text x="8" y="'+(y+12)+'" class="tll" style="paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round">'+esc2(ln)+'</text>';
      s+='<rect x="6" y="'+(y+16)+'" width="328" height="28" rx="9" style="fill:var(--soft)"/>';});
    if(tk){const pts=R.seq.map(o=>[X(o.t),4+o.ln*LH+(canDrag(o)?52:30),o]);
      for(let j=1;j<pts.length;j++){const a=pts[j-1],c=pts[j];
        s+='<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+c[0]+'" y2="'+c[1]+'" style="stroke:var(--'+(R.bad.has(c[2].id)?'no':'pri')+');stroke-width:2.5;opacity:.85"/>';}}
    b.ops.forEach(o=>{
      if(o.hide)return;
      const y=4+o.ln*LH+18,x1=X(o.s),x2=X(o.fail?100:o.e)-(o.fail?4:0),w=x2-x1;
      const col=o.fail?null:(o.k==='r'&&o.v==='?')?null:C(o.v);
      const isBad=tk&&R.bad.has(o.id),isHl=(b.hl||[]).includes(o.id);
      const fill=o.fail?'var(--soft2)':col?'var(--'+col+'-bg)':'var(--card)';
      const stroke=isBad?'var(--no)':isHl?'var(--pri)':o.fail?'var(--no)':col?'var(--'+col+')':'var(--line2)';
      const lab=o.lab||(o.fail?'× no reply':o.k==='w'?'set '+V(o.v):o.k==='r'?V(o.v):V(o.f)+'→'+V(o.v)+' '+(o.res==='ok'?'ok':'error'));
      const tap=cfg.onTap&&o.tap!==false;
      s+='<g'+(tap?' data-op="'+o.id+'" class="tlb"':'')+'><rect x="'+x1+'" y="'+y+'" width="'+w+'" height="24" rx="7" style="fill:'+fill+';stroke:'+stroke+';stroke-width:'+(isBad||isHl?3:2)+(o.fail?';stroke-dasharray:5 4':'')+'"/></g>';
      const est=lab.length*6.4;
      /* keep the label clear of this bar's tick: slide it to the side with room */
      let lx=x1+w/2,anc='middle',room=w-8;
      if(tk&&R.seq.includes(o)){const tx=X(o.t),rR=x2-4-(tx+6),rL=(tx-6)-(x1+4);
        if(Math.abs(tx-lx)<Math.min(est,room)/2+4){const best=rR>=rL?rR:rL;
          if(best>=Math.min(est,room)*0.8){room=best;if(rR>=rL){lx=tx+6;anc='start';}else{lx=tx-6;anc='end';}}
          else clash[o.id]=1;}}
      txt+='<text x="'+lx+'" y="'+(y+16)+'" text-anchor="'+anc+'" class="tlt" style="paint-order:stroke;stroke:'+fill+';stroke-width:3px;stroke-linejoin:round'+(o.fail?';fill:var(--no)':'')+'"'+(est>room?' textLength="'+Math.max(10,room)+'" lengthAdjust="spacingAndGlyphs"':'')+'>'+esc2(lab)+'</text>';
      if(o.sub){const ew=o.sub.length*5.9,cx=Math.max(ew/2+4,Math.min(336-ew/2,x1+w/2));
        s+='<text x="'+cx+'" y="'+(y+39)+'" text-anchor="middle" class="tls"'+(isBad?' style="fill:var(--no)"':'')+'>'+esc2(o.sub)+'</text>';}
    });
    if(tk){
      R.seq.forEach(o=>{const y=4+o.ln*LH+18,x=X(o.t),bd=R.bad.has(o.id);
        const tst='stroke:var(--'+(bd?'no':'ink')+');stroke-width:2.5;stroke-linecap:round;pointer-events:none',y2=y+(canDrag(o)?33:28);
        /* when the label can't move clear of the tick, the tick skips the text band */
        s+=clash[o.id]?'<line x1="'+x+'" y1="'+(y-3)+'" x2="'+x+'" y2="'+(y+3)+'" style="'+tst+'"/><line x1="'+x+'" y1="'+(y+21)+'" x2="'+x+'" y2="'+y2+'" style="'+tst+'"/>':'<line x1="'+x+'" y1="'+(y-3)+'" x2="'+x+'" y2="'+y2+'" style="'+tst+'"/>';
        if(canDrag(o))s+='<g data-h="'+o.id+'" tabindex="0" role="slider" aria-label="When '+esc2(nm(o))+'’s request took effect" aria-valuemin="'+o.s+'" aria-valuemax="'+o.e+'" aria-valuenow="'+Math.round(o.t)+'" class="tlh"><rect x="'+(x-18)+'" y="'+(y-6)+'" width="36" height="50" style="fill:transparent"/><circle cx="'+x+'" cy="'+(y+34)+'" r="7.5" style="fill:var(--card);stroke:var(--'+(bd?'no':'ink')+');stroke-width:2.5"/></g>';
        else s+='<circle cx="'+x+'" cy="'+(y+(clash[o.id]?24:12))+'" r="3.5" style="fill:var(--'+(bd?'no':'ink')+');pointer-events:none"/>';});
    }
    if(cfg.strip!==false){
      const y=SY;
      s+='<text x="8" y="'+(y+12)+'" class="tll">'+(cfg.stripLabel||'The one copy, in tick order')+'</text><text x="332" y="'+(y+12)+'" text-anchor="end" class="tls">time →</text>';
      if(tk){R.seg.forEach((g,j)=>{const x1=X(g[0]),x2=X(j<R.seg.length-1?R.seg[j+1][0]:100),c=C(g[1])||'line2';
          s+='<rect x="'+x1+'" y="'+(y+18)+'" width="'+Math.max(0,x2-x1)+'" height="18" style="fill:var(--'+c+'-bg);stroke:var(--'+c+');stroke-width:1"/>';
          if(x2-x1>V(g[1]).length*6.2+6)s+='<text x="'+((x1+x2)/2)+'" y="'+(y+31)+'" text-anchor="middle" class="tls" style="fill:var(--ink)">'+esc2(V(g[1]))+'</text>';});
        R.marks.forEach(m=>{s+='<path d="M'+X(m[0])+' '+(y+18)+' l-5 -7 h10z" style="fill:var(--'+(m[1]===null?'muted':m[1]?'ok':'no')+')"/>';});}
      else s+='<rect x="'+X(0)+'" y="'+(y+18)+'" width="320" height="18" rx="4" style="fill:var(--soft);stroke:var(--line);stroke-dasharray:4 4"/><text x="170" y="'+(y+31)+'" text-anchor="middle" class="tls">?</text>';
    }else s+='<text x="332" y="'+(SY+12)+'" text-anchor="end" class="tls">time →</text>';
    svg.innerHTML=s+txt+labs;
  };
  b.toT=cx=>{const m=svg.getScreenCTM();return ((cx-m.e)/m.a-10)/3.2;};
  b.setTick=(id,t)=>{const o=b.op(id);o.t=Math.max(o.s+1,Math.min(o.e-1,t));b.draw();if(cfg.onChange)cfg.onChange(b);};
  b.lin=()=>linSearch(b.ops.filter(o=>!o.fail&&!o.hide),cfg.init);
  b.place=order=>{const n=order.length,lo=[],hi=[];let prev=-1e9;
    order.forEach((o,j)=>{let t=Math.max(o.s+1.5,prev+2.5);if(t>o.e-1.5)t=Math.max(o.s+0.5,prev+0.3);lo[j]=t;prev=t;});
    let nx=1e9;for(let j=n-1;j>=0;j--){const o=order[j];let t=Math.min(o.e-1.5,nx-2.5);if(t<o.s+1.5)t=Math.min(o.e-0.5,nx-0.3);hi[j]=t;nx=t;}
    const tg={};order.forEach((o,j)=>{tg[o.id]=(lo[j]+hi[j])/2;});return tg;};
  /* valid ticks for everything except `bad` (left in the middle of its bar) */
  b.explain=bad=>{const ops=b.ops.filter(o=>!o.fail&&!o.hide&&o.id!==bad);const ord=linSearch(ops,cfg.init);return ord?b.place(ord):{};};
  b.anim=(tg,ms)=>new Promise(res=>{ms=ms||560;const from={};Object.keys(tg).forEach(k=>from[k]=b.op(k).t);const t0=Date.now();
    const step=()=>{if(!svg.isConnected){res();return;}
      const p=Math.min(1,(Date.now()-t0)/ms),e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
      Object.keys(tg).forEach(k=>{b.op(k).t=from[k]+(tg[k]-from[k])*e;});b.draw();
      if(p<1)setTimeout(step,16);else{if(cfg.onChange)cfg.onChange(b);res();}};step();});
  svg.addEventListener('pointerdown',e=>{const g=e.target.closest&&e.target.closest('[data-h]');if(!g)return;e.preventDefault();const id=g.getAttribute('data-h');
    const mv=ev=>b.setTick(id,b.toT(ev.clientX));
    const up=()=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);if(cfg.onEnd)cfg.onEnd(b);};
    window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);});
  svg.addEventListener('keydown',e=>{const g=e.target.closest&&e.target.closest('[data-h]');if(!g)return;const d=e.key==='ArrowRight'?2:e.key==='ArrowLeft'?-2:0;if(!d)return;e.preventDefault();
    const id=g.getAttribute('data-h');b.setTick(id,b.op(id).t+d);const n=svg.querySelector('[data-h="'+id+'"]');if(n)n.focus();if(cfg.onEnd)cfg.onEnd(b);});
  svg.addEventListener('click',e=>{const g=e.target.closest&&e.target.closest('[data-op]');if(g&&cfg.onTap)cfg.onTap(g.getAttribute('data-op'),b);});
  b.draw();
  return b;
}
/* drag a tick with real pointer events (used by the autoplay solvers) */
async function dragTick(L,b,id,t){
  const h=b.svg.querySelector('[data-h="'+id+'"] circle');if(!h)return;
  const r=h.getBoundingClientRect(),cy=r.top+r.height/2,m=b.svg.getScreenCTM(),cx=m.a*X(t)+m.e;
  h.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true,cancelable:true,clientX:r.left+r.width/2,clientY:cy,pointerId:1,isPrimary:true}));
  window.dispatchEvent(new PointerEvent('pointermove',{clientX:cx,clientY:cy,pointerId:1,isPrimary:true}));
  window.dispatchEvent(new PointerEvent('pointerup',{clientX:cx,clientY:cy,pointerId:1,isPrimary:true}));
  await L.sleep(40);
}
const vd=(ok,t)=>'<span class="vd '+(ok?'ok':'no')+'">'+t+'</span>';
const valTxt=(b,v)=>{const c=(b.cfg.vals||ST)[v];return c?'<b style="color:var(--'+c[1]+')">'+c[0]+'</b>':'<b>?</b>';};
/* run a preset: place valid ticks (or valid ticks for all but the culprit) */
async function showPreset(b,p){const tg=p.bad?b.explain(p.bad):b.place(b.lin()||[]);await b.anim(tg,520);}

function picOneCopy(k){
  const cp=(i,y,val,col,st)=>'<rect x="14" y="'+y+'" width="122" height="44" rx="10" style="fill:var(--'+col+'-bg);stroke:var(--'+(st||col)+');stroke-width:'+(st?3:2)+'"/><text x="24" y="'+(y+16)+'" class="tls">Copy '+i+'</text><text x="24" y="'+(y+34)+'" class="tlt" style="font-size:12.5px">'+val+'</text>';
  const person=(x,y,ini,name)=>'<circle cx="'+x+'" cy="'+y+'" r="17" style="fill:var(--card);stroke:var(--ink);stroke-width:2"/><text x="'+x+'" y="'+(y+5)+'" text-anchor="middle" class="tlt">'+ini+'</text><text x="'+x+'" y="'+(y+33)+'" text-anchor="middle" class="tll">'+name+'</text>';

Course.lesson({
  id:'0021', title:'Linearizability', minutes:22, icon:'layers',
  goals:['Say what linearizability promises, and spot a read that breaks it','Tell when an app truly needs it: locks, uniqueness, two channels','Explain which setups can provide it, and what it costs'],
  parts:['One copy','The rules','When it matters','The cost'],
  read:'Read chapter 9 of the book, from the start to the end of “The Cost of Linearizability”, for the timing diagrams this lesson rebuilds.',
  glossary:{
    eventual:'Eventual consistency (better called convergence): if writes stop and you wait, every copy will end up the same. Until then, copies can disagree, and there is no limit on how long “eventually” takes. Its bugs tend to show only during faults or heavy load.',
    'consistency-model':'Consistency model: what a replicated store promises about what reads return. Stronger models are easier to use correctly, but can be slower or less fault-tolerant. Not the same as transaction isolation levels (chapter 7), which handle racing transactions; consistency models coordinate copies despite delays and faults.',
    register:'Register: the textbook name for one piece of data you can read and write, such as one key, one row or one document.',
    cas:'Compare-and-set: a single-object write that only happens if the value is still what you expect. If someone changed it, the write does nothing and returns an error.',
    serializable:'Serializable isolation: the strongest level. Transactions may run at the same time, but the outcome matches running them one at a time.',
    cap:'CAP theorem: the observation that when the network cuts replicas off from each other, a system must choose between staying linearizable and staying available.',
    'split-brain':'Split brain: two nodes both believe they are the leader and both accept writes, which can lose or corrupt data.'
  },
  cheatsheet:[
    '<b>Eventual consistency</b> only promises replicas agree <i>eventually</i>, once writes stop. It says nothing about when.',
    '<b>Linearizability</b> = behave as if there is one copy. Once any read has seen a new value, every later read must see it too.',
    'Draw each request as a bar. A read that overlaps a write may return old or new; a read that starts after another read <i>finished</i> can never be older. Test: put a tick in every bar; the ticks in time order must be a valid run of one copy.',
    '<b>Linearizable ≠ serializable.</b> One is recency on single objects; the other is transactions in some serial order. Both together = strict serializability. SSI is not linearizable.',
    'You need it for <b>locks and leader election</b>, <b>hard uniqueness constraints</b> and <b>timing across two channels</b>.',
    'Single-leader: potentially. Consensus: yes. Multi-leader: no. Leaderless: assume no, even with strict quorums.',
    '<b>CAP</b>, better put: when the network is partitioned, choose linearizable <i>or</i> available. Beyond that it says little.',
    'Linearizability is slow <b>all the time</b>, not only during faults. Most systems that drop it do so for speed.'
  ],
  steps:[
/* ================= PART 1: ONE COPY ================= */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Mrs. Okoro refreshes Otterpost’s tracking page and sees “Delivered.” They call out to their son Dayo, who then refreshes on their own phone and sees “Out for delivery.” Is that OK?</h1>');
  L.mc(L.card,['Yes, two phones can always disagree','No, Dayo looked after Mrs. Okoro saw it'],1,
   'Dayo knows they refreshed <i>after</i> their mother saw the new status, so they expect news at least as fresh. This lesson names that expectation, and draws it.',
   'If they had refreshed at the same instant, different answers would be less surprising. But Dayo looked <i>after</i> Mrs. Okoro saw “Delivered,” so an older answer feels wrong. This lesson names that expectation.');}},

{part:1,src:'Chapter 9 · What Makes a System Linearizable?',
 solve:async L=>{while(L.$('#x8n'))L.$('#x8n').click();},
 run(L){
  const S=[
   {hide:['o1','o2'],ticks:false,t:'Ravi’s app starts writing <b>Delivered</b>. Until its reply comes back, nobody outside knows when the status flips.'},
   {hide:['o2'],t:'Mrs. Okoro’s read overlaps the write and gets <b>Delivered</b>. So the flip happened before Mrs. Okoro’s tick.'},
   {t:'Dayo’s read starts after Mrs. Okoro’s ended, so its tick comes later still. Dayo <b>must</b> get Delivered, even though the write hasn’t finished.',hl:['o2']},
   {t:'Odd but fine: both saw Delivered before Ravi’s app got its ok. The ok was just slow on the network.',hl:['o0']},
   {t:'The test: join the ticks in time order. Every read must return the latest write before its tick, so the value can never flip back.'}];
  let k=0;
  L.h(L.kick('ex','The extra rule')+'<h1 class="q">Once anyone has read the new value, no later read may go back</h1><div id="b8"></div><div class="stepcap" id="c8"></div><button class="btn pri" id="x8n">Next '+L.ic('arrow')+'</button>');
  const b=Board(L.$('#b8'),{lanes:['Ravi’s app · writes','Mrs. Okoro · reads','Dayo · reads'],init:'o',
    ops:[{ln:0,k:'w',v:'d',s:8,e:92,t:20},{ln:1,k:'r',v:'d',s:22,e:42,t:30},{ln:2,k:'r',v:'?',s:50,e:70,t:58}]});
  const draw=()=>{const s=S[k];b.ops.forEach(o=>o.hide=(s.hide||[]).includes(o.id));b.cfg.ticks=s.ticks!==false;b.hl=s.hl||[];b.op('o2').v=k>=2?'d':'?';b.draw();

{part:1,src:'Chapter 9 · What Makes a System Linearizable?',pts:1,
 solve:async L=>{L.$('#p9d').click();await L.sleep(700);},
 run(L){
  let done=false;
  L.h(L.kick('try','Your turn')+'<h1 class="q">Reader A got Delivered and finished. Reader B starts after. What may B get?</h1><div id="b9"></div>'+
   '<div class="tlrow"><button class="chip" id="p9o">B gets Out</button><button class="chip" id="p9d">B gets Delivered</button></div>');
  const b=Board(L.$('#b9'),{lanes:['Ravi’s app · writes','Reader A · reads','Reader B · reads'],init:'o',ticks:false,
    ops:[{ln:0,k:'w',v:'d',s:8,e:92},{ln:1,k:'r',v:'d',s:22,e:42},{ln:2,k:'r',v:'?',s:54,e:74}]});
  const pick=async v=>{if(done)return;done=true;const ok=v==='d';L.$(ok?'#p9d':'#p9o').classList.add(ok?'ok':'no');
    b.op('o2').v=v;b.cfg.ticks=true;b.draw();L.award(ok);
    await showPreset(b,ok?{}:{bad:'o2'});
    if(ok)L.sheet('ok','Right: only Delivered','B overlaps the write, so on its own either value would do. But A had already returned Delivered before B started, so B’s tick comes after the flip.');
    else L.sheet('no','Not allowed','On its own B overlaps the write, so Out looks possible. But A already saw Delivered before B started: B’s tick must come later, after the flip. The red tick shows the clash.');
    L.done();};
  L.$('#p9o').onclick=()=>pick('o');L.$('#p9d').onclick=()=>pick('d');}},

  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">Ravi’s app writes Delivered. Five reads come in. Tap the one read that breaks linearizability.</h1><div id="b10"></div>'+
   '<div class="tlrow" id="p10ch">'+[1,2,3,4,5].map(n=>'<button class="chip" id="p10c'+n+'">Read '+n+'</button>').join('')+'</div>');
  const pick=async n=>{if(done)return;done=true;const ok=n===4;L.$('#p10c'+n).classList.add(ok?'ok':'no');if(!ok)L.$('#p10c4').classList.add('ok');
    L.award(ok);b.cfg.ticks=true;b.draw();await showPreset(b,{bad:'o4'});
    if(ok)L.sheet('ok','You found it','Read 4 started after read 2 had already returned Delivered, so its tick must come later and see Delivered. Every other read fits somewhere. That’s what the checker did: it searched for one valid order of ticks. In general that search is expensive.');
    else L.sheet('no','That one is allowed',why[n-1]+' The checker found the culprit: read 4, which started after read 2 had returned Delivered, yet got Out.');
    L.done();};
  const b=Board(L.$('#b10'),{lanes:['Ravi’s app · writes','Mrs. Okoro · reads','Dayo · reads','Signe · reads'],init:'o',ticks:false,onTap:id=>{const n=+id.slice(1);if(n>0)pick(n);},
    ops:[{ln:0,k:'w',v:'d',s:10,e:86,tap:false},{ln:1,k:'r',v:'o',s:0,e:18,sub:'read 1'},{ln:1,k:'r',v:'d',s:28,e:50,sub:'read 2'},{ln:2,k:'r',v:'o',s:22,e:42,sub:'read 3'},{ln:2,k:'r',v:'o',s:56,e:76,sub:'read 4'},{ln:3,k:'r',v:'d',s:70,e:94,sub:'read 5'}]});
  [1,2,3,4,5].forEach(n=>{L.$('#p10c'+n).onclick=()=>pick(n);});}},

{part:1,src:'Chapter 9 · What Makes a System Linearizable?',pts:1,
 solve:async L=>{await dragTick(L,L.b11,'o1',24);await dragTick(L,L.b11,'o2',34);L.$('#k11').click();},
 run(L){
  let first=true,fin=false;
  L.h(L.kick('pr','Place the ticks')+'<h1 class="q">Drag each tick to when that request took effect, until every read and '+L.g('cas','compare-and-set')+' fits one copy.</h1>'+
   '<div id="b11"></div><div class="tlr" id="r11"></div><button class="btn pri" id="k11">'+L.ic('check')+'Check my ticks</button><div id="f11"></div>');
  const upd=b=>{const R=b.last;L.$('#r11').innerHTML=R.bad.size?[...R.bad].map(id=>'<span style="color:var(--no)">✗</span> '+R.msg[id]).join('<br>'):'<span style="color:var(--ok)">✓</span> Every read and compare-and-set fits one copy. The line only moves forward.';};
  L.b11=Board(L.$('#b11'),{lanes:['Hub scanner · writes','Ravi’s app · writes, then compare-and-set','Mrs. Okoro · reads','Tobias’s script · compare-and-set'],init:'p',drag:true,
    ops:[{ln:0,k:'w',v:'h',s:4,e:30},{ln:1,k:'w',v:'o',s:14,e:60},{ln:2,k:'r',v:'o',s:2,e:40},{ln:1,k:'c',f:'o',v:'d',res:'ok',s:64,e:99},{ln:3,k:'c',f:'h',v:'o',res:'err',s:46,e:84},{ln:2,k:'r',v:'d',s:78,e:99}],onChange:upd});
  upd(L.b11);
  L.$('#k11').onclick=()=>{if(fin)return;const ok=L.b11.last.bad.size===0;if(first){L.award(ok);first=false;}
    L.$('#f11').innerHTML='';
    if(ok){fin=true;L.sheet(L.$('#f11').dataset.miss?'info':'ok','A valid order','Mrs. Okoro sent the very first request, yet it took effect after both writes. Fine: the requests were concurrent, and theirs may have been delayed. They also saw Out before Ravi’s app got its ok. And Tobias’s compare-and-set failed because, by then, the status was no longer At hub.');L.done();}
    else{L.$('#f11').dataset.miss=1;L.fb(L.$('#f11'),'<b>Not yet.</b> Hint: Mrs. Okoro got Out, so Ravi’s write must take effect after the hub scan and before Mrs. Okoro’s tick.','no');}};}},

{part:1,src:'Chapter 9 · What Makes a System Linearizable?',
 solve:async L=>{for(let j=0;j<5;j++){L.$('#e12p'+j).click();await L.sleep(620);}},
 run(L){
  const P=[
   {nm:'Okoro, then Dayo',lanes:['Ravi’s app · writes','Mrs. Okoro · reads','Dayo · reads'],init:'o',ops:[{ln:0,k:'w',v:'d',s:8,e:92},{ln:1,k:'r',v:'d',s:22,e:44},{ln:2,k:'r',v:'o',s:52,e:74}],bad:'o2',
    cap:'Dayo’s read starts after Mrs. Okoro’s returned Delivered, so it must get Delivered too, even mid-write. The book’s football-score story.'},
   {nm:'Before the ok',lanes:['Ravi’s app · writes','Mrs. Okoro · reads'],init:'o',ops:[{ln:0,k:'w',v:'d',s:8,e:76},{ln:1,k:'r',v:'d',s:24,e:48},{ln:1,k:'r',v:'d',s:80,e:99}],
    cap:'Mrs. Okoro sees Delivered before Ravi’s app hears ok. Fine: the value didn’t appear before it was written; the ok was just slow on the network.'},
   {nm:'Out of order',lanes:['Mrs. Okoro · reads','Ravi’s app · writes'],init:'o',ops:[{ln:0,k:'r',v:'d',s:4,e:66},{ln:1,k:'w',v:'d',s:20,e:44}],
    cap:'Mrs. Okoro’s read was sent before the write, yet got Delivered. Fine: they were concurrent, and the read may have been delayed on the way.'},
   {nm:'Flips back',lanes:['Ravi’s app · writes','Dayo · reads'],init:'o',ops:[{ln:0,k:'w',v:'d',s:6,e:94},{ln:1,k:'r',v:'d',s:10,e:30},{ln:1,k:'r',v:'o',s:36,e:58},{ln:1,k:'r',v:'d',s:64,e:86}],bad:'o2',
    cap:'Each read overlaps the write, so alone each could be either. But one copy can’t flip back: after Delivered, Dayo’s next read must stay Delivered.'},
   {nm:'SSI report',lanes:['Credit top-up · writes','Report, begun earlier · reads'],vals:CR,init:'a',ops:[{ln:0,k:'w',v:'b',s:6,e:42},{ln:1,k:'r',v:'a',s:48,e:76,sub:'reads its snapshot from before'}],bad:'o1',
    cap:'A report transaction began before Bramble & Bolt’s top-up. Its read comes after the top-up committed, yet under '+L.g('serializable','serializable')+' snapshot isolation it sees the old balance. Serializable: yes. Linearizable: no.'}];
  const seen=new Set();let shown=false;
  L.h(L.kick('ex','Edge cases')+'<h1 class="q">Where does the rule bite, and where doesn’t it? Run each case.</h1>'+
   '<div class="tlrow">'+P.map((p,j)=>'<button class="chip" id="e12p'+j+'">'+p.nm+'</button>').join('')+'</div><div id="b12"></div><div class="tlr" id="c12">Pick a case.</div>');
  P.forEach((p,j)=>{L.$('#e12p'+j).onclick=async()=>{P.forEach((_,q)=>L.$('#e12p'+q).classList.toggle('sel',q===j));
    const b=Board(L.$('#b12'),{lanes:p.lanes,init:p.init,vals:p.vals,ops:p.ops});
    L.$('#c12').innerHTML=(p.bad?vd(false,'Not linearizable'):vd(true,'Linearizable'))+'<br>'+p.cap;
    await showPreset(b,p);seen.add(j);
    if(seen.size===P.length&&!shown){shown=true;L.sheet('info','The limits of the rule','Overlap gives freedom: reads may see a value early, or be handled in a different order than sent. What’s never allowed is going back after someone has seen the newer value. And serializability doesn’t give you that recency.');L.done();}};});}},

{part:1,src:'Chapter 9 · What Makes a System Linearizable?',pts:1,
 solve:async L=>{const n={o1:1,o2:1,o3:2,o4:2,o5:2};for(const id in n)for(let j=0;j<n[id];j++)L.$('#q13'+id).click();L.$('#k13').click();await L.sleep(650);},
 run(L){
  const cyc=['?','o','d'];let first=true,fin=false;
  const L2={o1:'A',o2:'B',o3:'C',o4:'D',o5:'E'};
  L.h(L.kick('pr','Challenge')+'<h1 class="q">Set what each read returned so the history is linearizable <i>and</i> someone sees Delivered before Ravi’s app gets its ok.</h1><div id="b13"></div>'+
   '<div class="tlrow" id="ch13"></div><button class="btn pri" id="k13">'+L.ic('check')+'Check</button><div id="f13"></div>');
  const b=Board(L.$('#b13'),{lanes:['Ravi’s app · writes','Mrs. Okoro · reads','Dayo · reads','Signe · reads'],init:'o',ticks:false,
    onTap:id=>{if(L2[id])L.$('#q13'+id).click();},
    ops:[{ln:0,k:'w',v:'d',s:18,e:80,tap:false},{ln:1,k:'r',v:'?',s:0,e:16,sub:'A'},{ln:2,k:'r',v:'?',s:20,e:38,sub:'B'},{ln:3,k:'r',v:'?',s:41,e:58,sub:'C'},{ln:1,k:'r',v:'?',s:61,e:78,sub:'D'},{ln:2,k:'r',v:'?',s:82,e:99,sub:'E'}]});
  const chips=()=>{L.$('#ch13').innerHTML=Object.keys(L2).map(id=>'<button class="chip'+(b.op(id).v!=='?'?' sel':'')+'" id="q13'+id+'">'+L2[id]+': '+b.V(b.op(id).v)+' '+L.ic('cycle')+'</button>').join('');
    Object.keys(L2).forEach(id=>{L.$('#q13'+id).onclick=()=>{if(fin)return;const o=b.op(id);o.v=cyc[(cyc.indexOf(o.v)+1)%3];if(o.v==='?')o.v='o';b.cfg.ticks=false;b.draw();chips();L.$('#f13').innerHTML='';};});};
  chips();
  L.$('#k13').onclick=async()=>{if(fin)return;const rs=Object.keys(L2).map(id=>b.op(id));
    if(rs.some(o=>o.v==='?')){L.err('Set every read first');return;}
    const w=b.op('o0'),lin=b.lin(),early=rs.some(o=>o.e<w.e&&o.v==='d'),ok=!!lin&&early;
    if(first){L.award(ok);first=false;}
    L.$('#f13').innerHTML='';
    if(ok){fin=true;b.cfg.ticks=true;b.draw();await b.anim(b.place(lin),520);
      L.sheet('ok','Linearizable, and early','Reads B to D overlap the write, so each may go either way, as long as none goes back after another has seen Delivered. Seeing the value before the writer’s ok is fine: the ok was just slow.');L.done();return;}
    let m='';
    if(rs[0].v==='d')m='A finished before the write started, so it must get Out.';
    else if(rs[4].v==='o')m='E started after the write finished, so it must get Delivered.';
    else if(!lin){const seenD=rs.find(o=>o.v==='d'&&rs.some(q=>q.s>o.e&&q.v==='o'));const back=seenD&&rs.find(q=>q.s>seenD.e&&q.v==='o');
      m=back?L2[back.id]+' started after '+L2[seenD.id]+' had returned Delivered, so it can’t get Out.':'No order of ticks fits these results.';}
    else m='That’s linearizable, but no one saw Delivered before Ravi’s app got its ok. Let a read that overlaps the write return Delivered.';
    L.fb(L.$('#f13'),'<b>Not yet.</b> '+m,'no');};}},

{part:1,src:'Chapter 9 · Linearizability Versus Serializability',run(L){
  L.h(L.kick('learn','Two words that sound alike')+'<h1 class="q">Linearizable is not the same as serializable</h1>'+PIC_LINSER+
   '<p class="capt">Linearizability: recency on one register; it doesn’t group operations, so alone it won’t stop write skew. Serializability: transactions act as if run one at a time, in <i>some</i> order. Both together: <b>strict serializability</b>.</p>');
  L.done();}},

{part:1,src:'Chapter 9 · Linearizability Versus Serializability',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which promise is this?',['Linearizability','Serializability','Both at once'],[
   ['Two slot-booking transactions each check, then book. The outcome must match running them one after the other.',1,'Groups of reads and writes, as if run one at a time: serializability.'],
   ['Once one reader sees a parcel as “Delivered”, nobody who reads later may see an older status.',0,'Recency on one object: linearizability.'],
   ['The database may pretend transaction B ran before A, even though A really started first.',1,'Serializability only needs <i>some</i> serial order, not the real one.'],
   ['Zainab wants transactions in a serial order <i>and</i> every read up to date.',2,'Both together is called strict serializability.'],
   ['It talks about single reads and writes of one register, not transactions.',0,'Linearizability is a single-object guarantee.']]);}},

{part:2,src:'Chapter 9 · Relying on Linearizability',run(L){
  L.h(L.kick('learn','When stale is not OK')+'<h1 class="q">A score a few seconds old harms no one. These cases are different.</h1>'+PIC_USES+
   '<p class="capt">Coordination services like ZooKeeper and etcd give linearizable locks using consensus (fencing still matters). A rule you can repair later, like an overbooked slot fixed with an apology, may not need it. Foreign-key checks don’t.</p>');
  L.done();}},

{part:2,src:'Chapter 9 · Constraints and uniqueness guarantees',pts:1,
 solve:async L=>{L.$('#u17o1').click();L.$('#k17').click();await L.sleep(650);},
 run(L){
  let first=true,fin=false;
  L.h(L.kick('pr','Claim a tracking code')+'<h1 class="q">Bramble & Bolt and Pip & Thistle both claim tracking code OP&#8209;51760 at once. Set the results so the store behaves like one copy.</h1>'+
   '<div id="b17"></div><div class="tlrow" id="ch17"></div><button class="btn pri" id="k17">'+L.ic('check')+'Check</button><div id="f17"></div>');
  const b=Board(L.$('#b17'),{lanes:['Bramble & Bolt’s booking · claims','Pip & Thistle’s booking · claims','Signe’s support search · reads'],vals:TC,init:'f',ticks:false,
    onTap:id=>{const c=L.$('#u17'+id);if(c)c.click();},
    ops:[{ln:0,k:'c',f:'f',v:'bb',res:'ok',s:4,e:48,nm:'Bramble & Bolt'},{ln:1,k:'c',f:'f',v:'pt',res:'ok',s:14,e:58,nm:'Pip & Thistle'},{ln:2,k:'r',v:'bb',s:66,e:96,nm:'Signe'}]});
  const chips=()=>{const o=b.ops;L.$('#ch17').innerHTML=
    '<button class="chip sel" id="u17o0">B&amp;B’s claim: '+(o[0].res==='ok'?'ok':'error')+' '+L.ic('cycle')+'</button>'+
    '<button class="chip sel" id="u17o1">P&amp;T’s claim: '+(o[1].res==='ok'?'ok':'error')+' '+L.ic('cycle')+'</button>'+
    '<button class="chip sel" id="u17o2">Signe sees: '+esc2(b.V(o[2].v))+' '+L.ic('cycle')+'</button>';
    ['o0','o1'].forEach(id=>{L.$('#u17'+id).onclick=()=>{if(fin)return;const x=b.op(id);x.res=x.res==='ok'?'err':'ok';b.draw();chips();L.$('#f17').innerHTML='';};});
    L.$('#u17o2').onclick=()=>{if(fin)return;const x=b.op('o2'),c=['bb','pt','f'];x.v=c[(c.indexOf(x.v)+1)%3];b.draw();chips();L.$('#f17').innerHTML='';};};
  chips();
  L.$('#k17').onclick=async()=>{if(fin)return;const lin=b.lin();if(first){L.award(!!lin);first=false;}
    L.$('#f17').innerHTML='';const o=b.ops;
    if(lin){fin=true;b.cfg.ticks=true;b.draw();await b.anim(b.place(lin),520);
      L.sheet('ok','Exactly one winner','The first claim to take effect switches the code from free to its parcel; the other compare-and-set finds it taken and returns an error, so that merchant picks another code. Enforcing uniqueness as data is written needs this. It’s like taking a lock on the code.');L.done();return;}
    const m=o[0].res==='ok'&&o[1].res==='ok'?'Both claims say ok: two parcels would share OP-51760. One copy can only switch from free once.':
      o[0].res!=='ok'&&o[1].res!=='ok'?'Both claims failed, but the code started free: whichever ran first must succeed.':
      'Signe must see whoever won the claim.';
    L.fb(L.$('#f17'),'<b>Not one copy.</b> '+m,'no');};}},

{part:2,src:'Chapter 9 · Cross-channel timing dependencies',
 solve:async L=>{const r=L.$('#lag18');r.value=50;r.dispatchEvent(new Event('input',{bubbles:true}));L.$('#run18').click();await L.sleep(1550);L.$('#lin18').click();L.$('#run18').click();await L.sleep(1550);},
 run(L){
  let lag=10,mode='first',lin=false,busy=false,sawBad=false,fin=false;
  L.h(L.kick('ex','A race between two channels')+'<h1 class="q">Ravi’s proof-of-delivery photo: can the queue outrun the file storage?</h1>'+
   '<div id="p18"></div>'+
   '<div class="rng21"><span>Copy to replica takes <span class="small">(the job arrives at 34)</span></span><b id="lv18">10</b><input type="range" id="lag18" min="0" max="60" value="10" aria-label="Replication lag inside file storage, illustrative time units; the job reaches the resizer at 34"></div>'+
   '<div class="tlrow"><button class="chip sel" id="m18a">First photo</button><button class="chip" id="m18b">Retake</button><button class="chip" id="lin18">Linearizable storage: off</button></div>'+
   '<button class="btn pri" id="run18">'+L.ic('play')+'Run the race</button><div class="thumbs" id="th18"></div>');
  const box=(x,y,w,h,col,t1,id)=>'<rect'+(id?' id="'+id+'b"':'')+' x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="10" style="fill:var(--'+col+'-bg);stroke:var(--'+col+');stroke-width:2"/><text x="'+(x+w/2)+'" y="'+(y+(id?17:h/2+5))+'" text-anchor="middle" style="font:700 12px var(--sans);fill:var(--ink)">'+t1+'</text>'+(id?'<text id="'+id+'" x="'+(x+w/2)+'" y="'+(y+33)+'" text-anchor="middle" class="tls" style="fill:var(--ink)"></text>':'');
  const P={p1:[[120,26],[180,50]],rep:[[251,72],[251,102]],q1:[[64,48],[64,98]],q2:[[64,138],[64,184]],f:[[120,204],[218,142]]};
  L.$('#p18').innerHTML='<svg class="pic" viewBox="0 0 340 266" role="img" aria-label="Web server stores the photo, then queues a job; the resizer fetches the photo from a storage replica">'+
   '<rect x="168" y="2" width="168" height="150" rx="14" style="fill:none;stroke:var(--line2);stroke-width:1.5;stroke-dasharray:5 4"/><text x="252" y="18" text-anchor="middle" class="tll">File storage</text>'+
   Object.keys(P).map(k=>'<line x1="'+P[k][0][0]+'" y1="'+P[k][0][1]+'" x2="'+P[k][1][0]+'" y2="'+P[k][1][1]+'" style="stroke:var(--line2);stroke-width:2;'+(k==='rep'||k==='f'?'stroke-dasharray:4 4':'')+'"/>').join('')+
   box(8,6,112,42,'h1','Web server')+box(180,28,142,44,'h3','Main copy','mc18')+box(180,102,142,44,'h3','Replica','rp18')+
   box(8,98,112,40,'h4','Message queue')+box(8,184,112,42,'pri','Resizer')+
   '<text x="126" y="20" class="tls">1 store</text><text x="70" y="78" class="tls">2 job</text><text x="70" y="166" class="tls">3</text><text x="160" y="186" class="tls" id="ft18">4 fetch</text><text x="258" y="92" class="tls">copying</text>'+
   '<rect id="gb18" x="8" y="234" width="326" height="28" rx="14" style="fill:var(--soft);stroke:var(--line2)"/><text id="gt18" x="171" y="253" text-anchor="middle" class="tlt">Resizer fetched: (run the race)</text>'+
   '<circle id="tp18" r="7" cx="-20" cy="-20" style="fill:var(--h1)"/><circle id="tr18" r="7" cx="-20" cy="-20" style="fill:var(--h2)"/><circle id="tj18" r="7" cx="-20" cy="-20" style="fill:var(--h4)"/><circle id="tf18" r="6" cx="-20" cy="-20" style="fill:var(--ink)"/></svg>';
  const at=(seg,p)=>[seg[0][0]+(seg[1][0]-seg[0][0])*p,seg[0][1]+(seg[1][1]-seg[0][1])*p];
  const put=(id,xy)=>{const c=L.$(id);if(!c)return;c.setAttribute('cx',xy?xy[0]:-20);c.setAttribute('cy',xy?xy[1]:-20);};
  const oldTxt=()=>mode==='first'?'no photo 88':'photo 88 (old)';
  const paint=(id,nw)=>{L.$(id).textContent=nw?'photo 88 (new)':oldTxt();const c=nw?'h2':'h3';L.$(id+'b').style.cssText='fill:var(--'+c+'-bg);stroke:var(--'+c+');stroke-width:2';};
  const setTxt=(p,arr)=>{paint('#mc18',p>=0.15);paint('#rp18',p>=arr);};
  const got=res=>{const c=res==null?null:res==='ok'?'ok':'no';L.$('#gb18').style.cssText=c?'fill:var(--'+c+'-bg);stroke:var(--'+c+')':'fill:var(--soft);stroke:var(--line2)';
    L.$('#gt18').textContent='Resizer fetched: '+(res==null?'(run the race)':res==='ok'?'photo 88 (new)':res==='none'?'nothing, no photo 88':'photo 88 (old)');L.$('#gt18').style.fill=c?'var(--'+c+')':'';};
  const thumbs=res=>{got(res);L.$('#th18').innerHTML=res?'<div class="thumb ok"><b>Full photo</b>photo 88 (new)</div><div class="thumb '+(res==='ok'?'ok':'no')+'"><b>Preview</b>'+(res==='ok'?'matches the new photo':res==='none'?'none: photo 88 not found':'made from the old photo: they disagree for good')+'</div>':'';};
  const idle=()=>{const arr=0.15+0.8*lag/60;setTxt(0,arr);['#tp18','#tr18','#tj18','#tf18'].forEach(i=>put(i,null));thumbs(null);};
  idle();
  L.$('#lag18').oninput=e=>{lag=+e.target.value;L.$('#lv18').textContent=lag;if(!busy)idle();};
  const setMode=m=>{if(busy)return;mode=m;L.$('#m18a').classList.toggle('sel',m==='first');L.$('#m18b').classList.toggle('sel',m!=='first');idle();};
  L.$('#m18a').onclick=()=>setMode('first');L.$('#m18b').onclick=()=>setMode('retake');
  L.$('#lin18').onclick=()=>{if(busy)return;lin=!lin;L.$('#lin18').classList.toggle('sel',lin);L.$('#lin18').textContent='Linearizable storage: '+(lin?'on':'off');L.$('#ft18').textContent=lin?'4 fetch: latest':'4 fetch';idle();};
  L.$('#run18').onclick=()=>{if(busy)return;busy=true;const arr=0.15+0.8*lag/60,t0=Date.now(),D=1400,lagNow=lag,linNow=lin;
    const res=linNow||arr<=0.6?'ok':mode==='first'?'none':'old';
    const step=()=>{if(!L.$('#p18')){busy=false;return;}const p=Math.min(1,(Date.now()-t0)/D);
      put('#tp18',p<0.15?at(P.p1,p/0.15):null);
      put('#tr18',p>=0.15&&p<arr?at(P.rep,(p-0.15)/(arr-0.15)):null);
      put('#tj18',p>=0.15&&p<0.35?at(P.q1,(p-0.15)/0.2):p>=0.35&&p<0.55?at(P.q2,(p-0.35)/0.2):null);
      put('#tf18',p>=0.6&&p<0.78?at(P.f,(p-0.6)/0.18):null);
      setTxt(p,linNow?0.6:arr);
      if(p>=0.78)got(res);
      if(p<1){setTimeout(step,16);return;}
      busy=false;thumbs(res);
      if(res!=='ok')sawBad=true;
      if(!fin&&sawBad&&linNow&&arr>0.6){fin=true;
        L.sheet('info','Two channels, one race','The queue and the storage’s own copying are two channels. Without a second channel nobody notices a stale read; they’d just look again later, like Dayo without Mrs. Okoro’s shout. Linearizable storage is the simplest fix. Since Otterpost controls the queue, read-your-writes-style tricks would also work, with more complexity.');L.done();}
      else if(!fin&&res!=='ok')L.err('Now switch on linearizable storage and run it again.');
      else if(!fin&&!sawBad)L.err('Drag the lag past 34, then run it.');};
    step();};}},

{part:2,src:'Chapter 9 · Relying on Linearizability',pts:6,run(L){
  L.h(L.kick('pr','Needs it or not?')+'<h1 class="q">For each Otterpost feature, does a stale read break it, or is a slightly old value fine?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Needs linearizability','Stale is fine'],[
   ['Only one route planner per region may hold the region’s lock',0,'If two planners both think they hold it, they both write routes: split brain.'],
   ['Every new parcel gets a tracking code no other parcel has',0,'A hard uniqueness rule, enforced as the code is written.'],
   ['The dashboard chart of parcels delivered this month',1,'A chart a few seconds behind hurts nobody.'],
   ['A merchant’s prepaid credit must never drop below zero',0,'One up-to-date balance that every node agrees on.'],
   ['The courier’s dot on the tracking page map',1,'A position a few seconds old is fine; it moves again soon.'],
   ['A rare overbooked delivery slot is fixed by moving a parcel and apologising',1,'A loosely interpreted rule, fixed afterwards, may not need linearizability.']],
   'Linearizability earns its cost where two parties must not both “win”: locks, unique codes and balances.');}},

/* ================= PART 4: THE COST ================= */
{part:3,src:'Chapter 9 · Implementing Linearizable Systems',
 solve:async L=>{for(let j=0;j<5;j++){L.$('#s20p'+j).click();await L.sleep(620);}},
 run(L){
  const P=[
   {nm:'Leader reads',lanes:['Ravi’s app · writes to leader','Mrs. Okoro · reads leader','Dayo · reads leader'],init:'o',ops:[{ln:0,k:'w',v:'d',s:6,e:40},{ln:1,k:'r',v:'d',s:44,e:64},{ln:2,k:'r',v:'d',s:70,e:94}],tag:'Single-leader: potentially',
    cap:'Reads go to the leader (or synchronous followers). It breaks if a node wrongly believes it’s leader, or async failover loses writes; some databases aren’t linearizable by design. One leader per partition changes nothing.'},
   {nm:'Follower reads',lanes:['Ravi’s app · writes to leader','Mrs. Okoro · reads leader','Dayo · reads a follower'],init:'o',ops:[{ln:0,k:'w',v:'d',s:6,e:30},{ln:1,k:'r',v:'d',s:36,e:56},{ln:2,k:'r',v:'o',s:62,e:86,sub:'the follower hasn’t caught up'}],bad:'o2',tag:'Lagging follower: no',
    cap:'Dayo’s read starts after the write finished, yet the lagging follower answers Out.'},
   {nm:'Consensus',lanes:['Planner 1 · claims the lock','Planner 2 · claims the lock','Dispatch · reads the lock'],vals:LK,init:'f',ops:[{ln:0,k:'c',f:'f',v:'p1',res:'ok',s:4,e:44},{ln:1,k:'c',f:'f',v:'p2',res:'err',s:14,e:54},{ln:2,k:'r',v:'p1',s:62,e:92}],tag:'Consensus: yes',
    cap:'Like single-leader, plus rules that stop split brain and stale replicas. ZooKeeper and etcd work this way (their default reads can be stale; ask for a quorum read or sync()).'},
   {nm:'Multi-leader',lanes:['Ravi’s app · Westport leader','Hub scanner · Eastvale leader','Mrs. Okoro · Westport','Dayo · Eastvale'],init:'o',ops:[{ln:0,k:'w',v:'d',s:4,e:26},{ln:1,k:'w',v:'h',s:6,e:28},{ln:2,k:'r',v:'d',s:34,e:58},{ln:3,k:'r',v:'h',s:62,e:86}],bad:'o3',tag:'Multi-leader: no',
    cap:'Both leaders accepted a write at once and swap them later, so a conflict needs resolving. There never was one copy.'},
   {nm:'Leaderless',lanes:['Ravi’s phone · writes, w = 3','Tracking page A · reads, r = 2','Tracking page B · reads, r = 2'],vals:LOC,init:'m',ops:[{ln:0,k:'w',v:'k',s:4,e:96,sub:'reaches the 3 replicas at different times'},{ln:1,k:'r',v:'k',s:16,e:44,sub:'replies: new, old'},{ln:2,k:'r',v:'m',s:52,e:80,sub:'replies: old, old'}],bad:'o2',tag:'Leaderless: probably not',
    cap:'n = 3, so w + r > n holds. Yet with variable delays B starts after A finished and gets the older spot. Clock-based last write wins and sloppy quorums break it outright.'}];
  const seen=new Set();let shown=false;
  L.h(L.kick('ex','Which setups can be linearizable?')+'<h1 class="q">One copy can’t survive a crash, so we replicate. Run each method.</h1>'+
   '<div class="tlrow">'+P.map((p,j)=>'<button class="chip" id="s20p'+j+'">'+p.nm+'</button>').join('')+'</div><div id="b20"></div><div class="tlr" id="c20">Pick a setup.</div>');
  P.forEach((p,j)=>{L.$('#s20p'+j).onclick=async()=>{P.forEach((_,q)=>L.$('#s20p'+q).classList.toggle('sel',q===j));
    const b=Board(L.$('#b20'),{lanes:p.lanes,init:p.init,vals:p.vals,ops:p.ops});
    L.$('#c20').innerHTML=vd(!p.bad,p.tag)+'<br>'+p.cap;
    await showPreset(b,p);seen.add(j);
    if(seen.size===P.length&&!shown){shown=true;L.sheet('info','The scorecard','Single-leader: potentially. Consensus: yes. Multi-leader: no. Leaderless: assume not. Strict quorums can be made linearizable with synchronous read repair plus writers that first read a quorum, at a speed cost, but never compare-and-set: that needs consensus.');L.done();}};});}},

{part:3,src:'Chapter 9 · The Cost of Linearizability',
 solve:async L=>{L.$('#n21c').click();await L.sleep(620);L.$('#n21e').click();await L.sleep(620);},
 run(L){
  let link='up',des='one',shown=false;const seen=new Set();
  L.h(L.kick('ex','Cut the link')+'<h1 class="q">The Westport–Eastvale link fails. Each side still reaches its own clients. Try both designs.</h1>'+
   '<div class="tlrow"><button class="chip sel" id="n21u">Link up</button><button class="chip" id="n21c">Link cut</button></div>'+
   '<div class="tlrow"><button class="chip sel" id="n21o">One leader, in Westport</button><button class="chip" id="n21e">A leader in each region</button></div>'+
   '<div id="b21"></div><div class="tlr" id="c21"></div>');
  const show=async()=>{L.$('#n21u').classList.toggle('sel',link==='up');L.$('#n21c').classList.toggle('sel',link==='cut');L.$('#n21o').classList.toggle('sel',des==='one');L.$('#n21e').classList.toggle('sel',des==='each');
    const d=link==='cut'?(des==='one'?{k:'r',v:'d',s:64,e:96,fail:true,sub:'can’t reach the Westport leader'}:{k:'r',v:'o',s:64,e:84,sub:'local leader never got the write'}):(des==='one'?{k:'r',v:'d',s:64,e:94,sub:'asks the Westport leader'}:{k:'r',v:'d',s:64,e:82,sub:'local leader, already synced'});
    const ops=[{ln:0,k:'w',v:'d',s:6,e:30},{ln:1,k:'r',v:'d',s:36,e:58},Object.assign({ln:2},d)];
    const b=Board(L.$('#b21'),{lanes:['Ravi’s app · Westport','Mrs. Okoro · Westport','Dayo · Eastvale'],init:'o',subs:true,ops});
    const bad=link==='cut'&&des==='each';
    L.$('#c21').innerHTML=link==='up'?vd(true,'Linearizable')+vd(true,'Available')+'<br>With the network working you can have both.':
      des==='one'?vd(true,'Linearizable')+vd(false,'Eastvale unavailable')+'<br>Eastvale can’t write or make a linearizable read; it waits or errors. Westport carries on.':
      vd(true,'Available')+vd(false,'Not linearizable')+'<br>Both sides keep working, writes queue up for later, and Dayo gets stale Out.';
    await showPreset(b,bad?{bad:'o2'}:{});
    if(link==='cut')seen.add(des);
    if(seen.size===2&&!shown){shown=true;L.sheet('info','The trade-off','With one leader, clients cut off from it lose writes and linearizable reads until the link is fixed; they can still read the possibly stale follower. With a leader on each side, both stay up, but the data is no longer one copy.');L.done();}};
  L.$('#n21u').onclick=()=>{link='up';show();};L.$('#n21c').onclick=()=>{link='cut';show();};
  L.$('#n21o').onclick=()=>{des='one';show();};L.$('#n21e').onclick=()=>{des='each';show();};
  show();}},

{part:3,src:'Chapter 9 · The CAP theorem',run(L){
  L.h(L.kick('learn','The CAP theorem, and why it’s unhelpful')+'<h1 class="q">When the network is cut, choose: linearizable or available</h1>'+
   PIC_CAP+
   '<p class="capt">Any linearizable system on an unreliable network faces this: that’s the '+L.g('cap','CAP theorem')+'. It covers one model and one fault, and its “availability” isn’t the everyday kind. It helped spark NoSQL; today it’s mostly history.</p>'+
   L.quote('Is it better to be alive and wrong or right and dead?','Jay Kreps, quoted at the start of chapter 9'));
  L.done();}},

{part:3,src:'Chapter 9 · Linearizability and network delays',
 solve:async L=>{const r=L.$('#u23');r.value=9;r.dispatchEvent(new Event('input',{bubbles:true}));},
 run(L){
  let fin=false;
  L.h(L.kick('learn','The cost you pay every day')+'<h1 class="q">Linearizability is slow even when nothing is broken</h1><div id="p23"></div>'+
   '<div class="rng21"><span>How much network delays vary</span><b id="v23">low</b><input type="range" id="u23" min="0" max="10" value="1" aria-label="Network delay uncertainty (illustrative)"></div>'+
   '<p class="capt">Attiya and Welch proved linearizable reads and writes take time at least proportional to how uncertain network delays are. So most systems skip it for speed, not fault tolerance. Chapter 12 shows ways to avoid it without losing correctness.</p>');
  const draw=u=>{const weak=34+u*2,lin=56+u*26;
    L.$('#p23').innerHTML='<svg class="pic" viewBox="0 0 340 174" role="img" aria-label="Response time of a nearby read versus a linearizable read, and CPU caches">'+
     '<text x="6" y="14" class="tll">Read from a nearby copy (not linearizable)</text><rect x="6" y="20" width="'+weak+'" height="22" rx="6" style="fill:var(--h2-bg);stroke:var(--h2);stroke-width:1.5"/>'+
     '<text x="6" y="64" class="tll">Linearizable read</text><rect x="6" y="70" width="'+lin+'" height="22" rx="6" style="fill:var(--h3-bg);stroke:var(--h3);stroke-width:1.5"/>'+
     '<text x="'+(lin+12>300?lin-4:lin+12)+'" y="86" '+(lin+12>300?'text-anchor="end" ':'')+'class="tlt">×'+(lin/weak).toFixed(1)+'</text>'+
     '<text x="334" y="108" text-anchor="end" class="tls">response time (illustrative) →</text>'+
     '<text x="6" y="128" class="tll">Even multi-core RAM skips it, for speed:</text>'+
     [['Core 1 cache','x = 1','h2'],['Core 2 cache','x = 0 (old)','h3'],['Main memory','gets 1 later','h1']].map((c,j)=>'<rect x="'+(6+j*112)+'" y="134" width="104" height="38" rx="8" style="fill:var(--'+c[2]+'-bg);stroke:var(--'+c[2]+');stroke-width:1.5"/><text x="'+(58+j*112)+'" y="149" text-anchor="middle" class="tls">'+c[0]+'</text><text x="'+(58+j*112)+'" y="165" text-anchor="middle" class="tlt">'+c[1]+'</text>').join('')+'</svg>';
    L.$('#v23').textContent=u<4?'low':u<7?'medium':'high';};
  draw(1);
  L.$('#u23').oninput=e=>{const u=+e.target.value;draw(u);
    if(u>=7&&!fin){fin=true;L.sheet('info','Slow all the time','With very variable delays, as on most networks, every linearizable read and write waits out that uncertainty, faults or not, and no faster algorithm exists. CPUs make the same trade: each core’s cache holds its own copy, written to memory later. CAP doesn’t explain that; speed does.');L.done();}};}},

{part:3,src:'Chapter 9 · The Unhelpful CAP Theorem',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Keep or bust?',['Keep: it’s true','Bust: it’s wrong'],[
   ['“Our Parcel DB is a CA system: consistent and available, so we skip partition tolerance.”',1,'Partitions are faults that happen anyway. You only choose how to behave when they do.'],
   ['“During a cut, Eastvale clients of a Westport-led database can still read, but maybe stale data.”',0,'They can read the local follower, but not linearizably, and they can’t write.'],
   ['“Most systems drop linearizability mainly to survive network faults.”',1,'The main reason is speed, and the slowness is there all the time.'],
   ['“With a smarter algorithm, linearizable writes could be as fast as weak ones.”',1,'Attiya and Welch proved the delay grows with network uncertainty. No faster algorithm exists.'],
   ['“With the link working, CAP forces Otterpost to give nothing up.”',0,'CAP’s choice only bites while the network is partitioned. On a healthy network you can have both.']]);}},

{part:3,src:'Chapter 9 · The Cost of Linearizability',pts:1,run(L){
  L.h(L.kick('pr','Femi’s call')+'<h1 class="q">Nordhaven is overseas, and every request from there to Westport takes a long trip. Which design should Femi choose?</h1>');
  L.mc(L.card,['Send every read and write to Westport, so all is linearizable','Make nothing linearizable, tracking codes included','Only tracking codes, credit and the route lock pay for it'],2,
   'Pay the slow, partition-sensitive price only where two parties must never both win. Tracking-page reads can come from a nearby replica.',
   'All-linearizable makes every Nordhaven request slow and fails during any cut. Nothing-linearizable lets two parcels share a code. Pay the cost only where it’s needed.');}}
  ]
});
