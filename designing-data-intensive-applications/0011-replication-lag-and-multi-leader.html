const LAGS=[0,0.5,2,10,30,60,120,300,3600];
const FCOL=['h2','h3','h4'];
function lagTxt(s){return s===0?'0 s':s<1?'0.5 s':s<60?s+' s':s<3600?(s/60)+' min':(s/3600)+' h';}
function hms(base,t){let s=Math.round(base+t);s=((s%86400)+86400)%86400;const h=Math.floor(s/3600),m=Math.floor(s/60)%60,x=s%60;return h+':'+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0');}
function setR(L,id,v){const e=L.$('#'+id);e.value=v;e.dispatchEvent(new Event('input',{bubbles:true}));}
function tasks(id,items){return '<ul class="tasks" id="'+id+'">'+items.map((t,k)=>'<li id="'+id+'-'+k+'"><span class="bx"></span><span>'+t+'</span></li>').join('')+'</ul>';}
function tick(L,id,k){const li=L.$('#'+id+'-'+k);if(li&&!li.classList.contains('done')){li.classList.add('done');li.querySelector('.bx').innerHTML=L.ic('check');}}
function allTicked(L,id){return L.$$('#'+id+' li').every(li=>li.classList.contains('done'));}
function chipRow(host,items,cur,onPick){host.innerHTML='';items.forEach(([k,t])=>{const b=document.createElement('button');b.className='chip'+(k===cur?' sel':'');b.dataset.k=k;b.innerHTML=t;
  b.onclick=()=>{[...host.children].forEach(x=>x.classList.toggle('sel',x===b));onPick(k,b);};host.appendChild(b);});}
function tx(x,y,t,st){return '<text x="'+x+'" y="'+y+'" style="text-anchor:middle;'+st+'">'+t+'</text>';}
function txl(x,y,t,st){return '<text x="'+x+'" y="'+y+'" style="'+st+'">'+t+'</text>';}
function arrowHead(x1,y1,x2,y2,f,col){const px=x1+(x2-x1)*f,py=y1+(y2-y1)*f,a=Math.atan2(y2-y1,x2-x1),c=Math.cos(a),s=Math.sin(a);
  const p=[[px+c*6,py+s*6],[px-c*5-s*4.5,py-s*5+c*4.5],[px-c*5+s*4.5,py-s*5-c*4.5]];return '<polygon points="'+p.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ')+'" style="fill:'+col+'"/>';}
function flyDot(g,x1,y1,x2,y2,ms,col,frac){return new Promise(res=>{
  if(!g||!g.isConnected){res();return;}frac=frac==null?1:frac;
  const c=document.createElementNS(NS,'circle');c.setAttribute('r','6');c.setAttribute('cx',x1);c.setAttribute('cy',y1);c.setAttribute('style','fill:'+col+';stroke:var(--card);stroke-width:1.5');g.appendChild(c);
  const t0=performance.now();
  (function st(){if(!c.isConnected){res();return;}
    const p=Math.min(1,(performance.now()-t0)/ms),e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2,f=e*frac;
    c.setAttribute('cx',x1+(x2-x1)*f);c.setAttribute('cy',y1+(y2-y1)*f);
    if(p<1){setTimeout(st,16);return;}
    c.remove();
    if(frac<1){const x=x1+(x2-x1)*frac,y=y1+(y2-y1)*frac,t=document.createElementNS(NS,'path');
      t.setAttribute('d','M'+(x-6)+' '+(y-6)+'l12 12m0 -12l-12 12');t.setAttribute('style','stroke:var(--no);stroke-width:3;stroke-linecap:round;fill:none');g.appendChild(t);setTimeout(()=>t.remove(),900);}
    res();})();});}

/* ---------- 1. The refresh filmstrip ---------- */
/* writes: {t (seconds), k (field), v, own, dev, p (partition), dep (index of the write it answers)}
   reads:  {t, dev}. Each read becomes one frame. */
const DAY={who:'Mrs. Okoro',show:['status','note'],nf:3,base:36000,sticky:2,
  writes:[{t:-7200,k:'status',v:'At hub'},{t:0,k:'status',v:'Out for delivery'},{t:100,k:'note',v:'Leave in the porch',own:1}],
  reads:[{t:15},{t:45},{t:104},{t:110},{t:150},{t:200}],rnd:[0,1,2,1,0,2],
  truth:[[0,'Ravi scans: Out for delivery'],[100,'Mrs. Okoro saves a note']]};
const FLIP={who:'Mrs. Okoro',show:['status'],nf:2,base:36000,sticky:1,
  writes:[{t:-7200,k:'status',v:'At hub'},{t:120,k:'status',v:'Out for delivery'}],
  reads:[{t:180},{t:240},{t:300},{t:360},{t:420}],rnd:[0,1,0,1,0],
  truth:[[120,'Ravi scans: Out for delivery']]};
const ADA={who:'Ada',show:['addr'],nf:3,base:36840,sticky:1,
  writes:[{t:-90000,k:'addr',v:'4 Mill Lane'},{t:0,k:'addr',v:'14 Mill Lane',own:1},{t:25,k:'addr',v:'14 Mill Lane',own:1}],
  reads:[{t:1},{t:30}],rnd:[1,0],
  truth:[[0,'Ada saves: 14 Mill Lane']]};
const DEV={who:'Ada',devs:['laptop','phone'],show:['pickup'],nf:3,base:39600,sticky:1,
  writes:[{t:-90000,k:'pickup',v:'2 pm'},{t:0,k:'pickup',v:'4 pm',own:1,dev:0}],
  reads:[{t:5,dev:0},{t:10,dev:1},{t:40,dev:1}],rnd:[0,1,1],
  truth:[[0,'On the laptop, Ada moves pickup to 4 pm']]};
const CHAT={who:'Signe',show:['chat'],parts:[30,1],base:50400,
  writes:[{t:0,k:'q',v:'Can you leave it in the porch?',by:'Mrs. Okoro',p:0},{t:8,k:'a',v:'Done. It’s in the porch.',by:'Ravi',p:1,dep:0}],
  reads:[{t:10},{t:20},{t:45}],
  truth:[[0,'Mrs. Okoro asks'],[8,'Ravi answers']]};

function runStrip(sc,S){
  const out=[],seen=new Set(),nf=sc.nf||3;
  sc.reads.forEach((r,i)=>{
    const dev=r.dev||0;
    const known=sc.writes.filter(w=>w.own&&w.t<=r.t&&(S.central||(w.dev||0)===dev));
    const lastOwn=known.length?known[known.length-1]:null;
    let rep;
    if(sc.parts)rep=-2;
    else if(S.pick==='leader')rep=-1;
    else rep=S.pick==='sticky'?(S.sticky!=null?S.sticky:sc.sticky):sc.rnd[i];
    if(rep>=0&&S.skip&&S.lags[rep]>60){let best=-1;for(let k=0;k<nf;k++)if(S.lags[k]<=60&&(best<0||S.lags[k]<S.lags[best]))best=k;rep=best;}
    if(rep>=0&&S.own==='min'&&lastOwn&&r.t-lastOwn.t<60)rep=-1;
    const lag=rep>=0?S.lags[rep]:0;
    let wait=0;
    if(rep>=0&&S.own==='ryw'&&lastOwn&&lastOwn.t>r.t-lag)wait=lastOwn.t+lag-r.t;
    const te=r.t+wait,vis=new Set();
    sc.writes.forEach((w,j)=>{const l=sc.parts?sc.parts[S.onePart?0:(w.p||0)]:lag;if(w.t<=te-l)vis.add(j);});
    const bad=[];
    if(sc.writes.some((w,j)=>w.own&&w.t<=r.t&&!vis.has(j)))bad.push('own');
    if([...seen].some(j=>!vis.has(j)))bad.push('back');
    if(sc.writes.some((w,j)=>w.dep!=null&&vis.has(j)&&!vis.has(w.dep)))bad.push('prefix');
    if(wait>30)bad.push('slow');
    vis.forEach(j=>seen.add(j));
    out.push({i,t:r.t,clock:hms(sc.base||36000,r.t),dev,rep,lag,wait,vis,bad});
  });
  return out;
}
const isRed=f=>f.bad.some(b=>b!=='slow');
function frameHTML(sc,f){
  const val=k=>{let v=null;sc.writes.forEach((w,j)=>{if(w.k===k&&f.vis.has(j))v=w.v;});return v;};
  let b='';
  sc.show.forEach(k=>{
    if(k==='status')b+='<div class="fs">'+(val('status')||'—')+'</div>';
    if(k==='note'){const v=val('note');b+='<div class="fn">Note: '+(v?'<b>'+v+'</b>':'none')+'</div>';}
    if(k==='addr')b+='<div class="fn">Street</div><div class="fs">'+(val('addr')||'—')+'</div>';
    if(k==='pickup')b+='<div class="fn">Pickup time</div><div class="fs">'+(val('pickup')||'—')+'</div>';
    if(k==='chat'){const m=sc.writes.filter((w,j)=>(w.k==='q'||w.k==='a')&&f.vis.has(j));
      b+=m.length?m.map(w=>'<div class="bub"><b>'+w.by+'</b>'+w.v+'</div>').join(''):'<div class="fn">No messages yet</div>';}
  });
  const bad=f.bad.filter(x=>x!=='slow'),slow=f.bad.includes('slow');
  const tg=f.rep===-1?'<span class="tag" style="background:var(--pri-bg);color:var(--pri)">Leader</span>':f.rep===-2?'':'<span class="tag" style="background:var(--'+FCOL[f.rep]+'-bg);color:var(--'+FCOL[f.rep]+')">F'+(f.rep+1)+' · '+lagTxt(f.lag)+'</span>';
  const why={own:'Own edit missing',back:'Went back in time',prefix:'Answer before question'};
  return '<div class="fr'+(bad.length?' bad':slow?' slow':'')+'"><div class="ft"><span>'+f.clock+'</span>'+(sc.devs?'<span>'+sc.devs[f.dev]+'</span>':'')+'</div>'+b+
    '<div class="fb2">'+tg+(f.wait?'<span class="wt">waited '+Math.round(f.wait)+' s</span>':'')+(bad.length?'<span class="fx">'+why[bad[0]]+'</span>':'')+'</div></div>';
}
const PICK=[['random','Any follower'],['sticky','Same follower each time'],['leader','Always the leader']];
const OWN=[['none','No extra rule'],['min','Leader for 1 min after my edit'],['ryw','Only a copy that has my last edit']];
function Strip(L,host,o){
  const id=o.id,sc=o.sc;
  const S=Object.assign({lags:[0.5,0.5,0.5],pick:'random',own:'none',central:false,onePart:false,skip:false,sticky:null,shown:99},o.S||{});
  S.lags=S.lags.slice();
  host.insertAdjacentHTML('beforeend','<div class="strip" id="'+id+'">'+
    (sc.truth?'<div class="truth">'+sc.truth.map(x=>'<span><b>'+hms(sc.base||36000,x[0])+'</b>'+x[1]+'</span>').join('')+'</div>':'')+
    '<div id="'+id+'-ctl"></div><div class="sthd">'+sc.who+'’s screen'+(sc.devs?'s':'')+', refresh by refresh</div>'+
    '<div class="fgrid'+(sc.reads.length===2||sc.reads.length===4?' two':'')+'" id="'+id+'-g"></div><div class="sread" id="'+id+'-r" aria-live="polite"></div></div>');
  const $=s=>host.querySelector(s),alive=()=>!!$('#'+id)&&$('#'+id).isConnected;
  let res=[];
  const ctl=$('#'+id+'-ctl');
  if(o.sliders){
    ctl.innerHTML='<div class="rl">How far each follower lags behind the leader (made-up lags)</div>'+S.lags.slice(0,sc.nf).map((l,k)=>'<label class="rng"><span style="color:var(--'+FCOL[k]+')">F'+(k+1)+'</span><input type="range" min="0" max="8" step="1" value="'+LAGS.indexOf(l)+'" id="'+id+'-l'+k+'" aria-label="F'+(k+1)+' lag"><b id="'+id+'-l'+k+'v">'+lagTxt(l)+'</b></label>').join('');
    for(let k=0;k<sc.nf;k++){const e=$('#'+id+'-l'+k);e.oninput=()=>{S.lags[k]=LAGS[+e.value];$('#'+id+'-l'+k+'v').textContent=lagTxt(S.lags[k]);draw();};}
  }else{
    ctl.innerHTML='<div class="cfg" id="'+id+'-cfg"></div>';
  }
  if(o.routing){
    ctl.insertAdjacentHTML('beforeend','<div class="rl">Which copy answers a refresh?</div><div class="chips" id="'+id+'-pk"></div><div class="rl">After '+sc.who+' edits something</div><div class="chips" id="'+id+'-ow"></div>');
    chipRow($('#'+id+'-pk'),PICK,S.pick,k=>{S.pick=k;draw();});
    chipRow($('#'+id+'-ow'),OWN,S.own,k=>{S.own=k;draw();});
  }
  function cfgText(){
    if(sc.parts)return S.onePart?'The whole conversation lives in one partition; its copy is 30 s behind (made-up lag).':'Made-up lags. Recipients’ messages: partition 1, copy 30 s behind. Couriers’ messages: partition 2, copy 1 s behind.';
    const lg='Made-up lags: '+S.lags.slice(0,sc.nf).map((l,k)=>'F'+(k+1)+' '+lagTxt(l)).join(' · ')+' behind.';
    if(o.routing)return lg+' Same follower for '+sc.who+' = F'+((S.sticky!=null?S.sticky:sc.sticky)+1)+'.';
    const pk={random:'any follower',sticky:'the same follower (F'+((S.sticky!=null?S.sticky:sc.sticky)+1)+')',leader:'the leader'}[S.pick];
    const ow={none:'',min:' For 1 min after an edit, read from the leader.',ryw:' Only a copy that has the last edit '+(S.central?'(remembered centrally)':'(remembered on the device)')+' may answer; otherwise wait.'}[S.own];
    return lg+' Each refresh goes to '+pk+'.'+ow+(S.skip?' Followers more than 1 min behind are skipped.':'');
  }
  function draw(){
    if(!alive())return res;
    res=runStrip(sc,S);
    const c=$('#'+id+'-cfg');if(c)c.textContent=cfgText();
    $('#'+id+'-g').innerHTML=res.map((f,k)=>k<S.shown?frameHTML(sc,f):'<div class="fr ph"><span>'+f.clock+'</span><b>?</b></div>').join('');
    const vis=res.slice(0,S.shown),red=vis.filter(isRed).length,ld=vis.filter(f=>f.rep===-1).length,mw=Math.max(0,...vis.map(f=>f.wait));
    $('#'+id+'-r').innerHTML=vis.length?'Red frames: <b class="'+(red?'no-t':'ok-t')+'">'+red+'</b> of '+res.length+(sc.parts?'':' · Reads on the leader: <b>'+ld+'</b>')+(mw?' · Longest wait: <b>'+Math.round(mw)+' s</b>':''):'Frames appear as '+sc.who+' refreshes.';
    if(o.on)o.on(res);
    return res;
  }
  async function play(ms){S.shown=0;draw();for(let k=0;k<res.length;k++){await L.sleep(ms);if(!alive())return null;S.shown=k+1;draw();}return res;}
  draw();
  return {S,draw,play,res:()=>res,alive};
}

/* ---------- 2. The three-region map ---------- */
const PT={W:[62,172],E:[258,172],N:[160,42]},NM={W:'Westport',E:'Eastvale',N:'Nordhaven'};
function mapSVG(id,label){return '<svg id="'+id+'" class="vis" viewBox="0 0 320 210" role="img" aria-label="'+label+'">'+
  '<path d="M0 96 Q 20 89 40 96 T 80 96 T 120 96 T 160 96 T 200 96 T 240 96 T 280 96 T 320 96 V 122 Q 300 129 280 122 T 240 122 T 200 122 T 160 122 T 120 122 T 80 122 T 40 122 T 0 122 Z" style="fill:var(--h2-bg)"/>'+
  '<text x="314" y="113" style="font-size:12px;font-style:italic;fill:var(--h2);text-anchor:end">sea</text>'+
  '<g class="ml"></g><g class="mn"></g><g class="mfx"></g></svg>';}
function lane(a,b,off){const [x1,y1]=PT[a],[x2,y2]=PT[b],dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy),nx=-dy/len*off,ny=dx/len*off;return [x1+nx,y1+ny,x2+nx,y2+ny];}
function mLinks(svg,links){
  let s='';
  links.forEach(l=>{
    const dirs=l.dir==='both'?[[l.a,l.b],[l.b,l.a]]:l.dir==='ba'?[[l.b,l.a]]:[[l.a,l.b]];
    dirs.forEach(([a,b])=>{const [x1,y1,x2,y2]=lane(a,b,l.dir==='both'?4.5:0);
      const col=l.st==='cut'?'var(--no)':l.st==='slow'?'var(--h3)':l.st==='hot'?'var(--pri)':l.st==='dim'?'var(--line)':'var(--line2)';
      s+='<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" style="stroke:'+col+';stroke-width:2.2'+(l.st==='cut'||l.st==='slow'?';stroke-dasharray:6 5':'')+'"/>';
      if(l.dir!=='none')s+=arrowHead(x1,y1,x2,y2,.56,col);});
    const [x1,y1,x2,y2]=lane(l.a,l.b,0),mx=(x1+x2)/2,my=(y1+y2)/2;
    if(l.st==='cut')s+='<path d="M'+(mx-7)+' '+(my-7)+'l14 14m0 -14l-14 14" style="stroke:var(--no);stroke-width:3;stroke-linecap:round"/>';
    if(l.label)s+='<rect x="'+(mx-l.label.length*3.4-6)+'" y="'+(my-10)+'" width="'+(l.label.length*6.8+12)+'" height="20" rx="10" style="fill:var(--card);stroke:'+(l.lc||'var(--line2)')+'"/>'+tx(mx,my+4.5,l.label,'font-size:12px;font-weight:700;fill:'+(l.lc||'var(--ink)'));
  });
  svg.querySelector('.ml').innerHTML=s;
}
function mNodes(svg,nodes){
  let s='';
  const F={ok:['var(--card)','var(--line2)'],lead:['var(--pri-bg)','var(--pri)'],down:['var(--soft)','var(--line2)'],good:['var(--ok-bg)','var(--ok-line)'],bad:['var(--no-bg)','var(--no-line)'],warn:['var(--h3-bg)','var(--h3)']};
  Object.keys(nodes).forEach(K=>{const n=nodes[K],[cx,cy]=PT[K],x=cx-54,y=cy-31,st=F[n.st||'ok'];
    s+='<rect x="'+x+'" y="'+y+'" width="108" height="62" rx="12" style="fill:'+st[0]+';stroke:'+st[1]+';stroke-width:2'+(n.st==='down'?';stroke-dasharray:5 4':'')+'"/>';
    s+=tx(cx,y+15,NM[K],'font-size:12.5px;font-weight:700;fill:var(--ink)');
    s+=tx(cx,y+29,n.role||'','font-size:11.5px;fill:var(--muted)');
    const v=[].concat(n.val==null?[]:n.val);
    v.forEach((t,j)=>{s+=tx(cx,y+(v.length>1?43+j*13:47),t,'font-size:12px;font-weight:700;fill:'+(n.vc||'var(--ink)'));});
    if(n.st==='down')s+='<path d="M'+(x+90)+' '+(y+6)+'l11 11m0 -11l-11 11" style="stroke:var(--no);stroke-width:2.4;stroke-linecap:round"/>';
  });
  svg.querySelector('.mn').innerHTML=s;
}
function mFly(svg,a,b,ms,col,off,frac){const [x1,y1,x2,y2]=lane(a,b,off||0);return flyDot(svg.querySelector('.mfx'),x1,y1,x2,y2,ms,col,frac);}

Course.lesson({
  id:'0011', title:'Replication lag and multi-leader replication', minutes:20, icon:'clock',
  goals:['Name the three replication-lag bugs users notice, and fix each one','Say when several leaders are worth their cost','Choose a way to handle write conflicts between leaders'],
  parts:['Lag bugs','Reading in order','Many leaders','Conflicts'],
  read:'Read “Problems with Replication Lag” and “Multi-Leader Replication” in chapter 5, including the Mr. Poons and Mrs. Cake dialog and the replication topologies.',
  glossary:{
    'eventual':'Eventual consistency: if writes stop and you wait, every copy will end up the same. Until then, copies can disagree, and there is no limit on how long “eventually” takes.',
    'ryw':'Read-after-write consistency (also called read-your-writes): after you save something and reload, you always see your own change. It promises nothing about other people’s changes.',
    'monotonic':'Monotonic reads: if you read several times in a row, you never see older data after you have seen newer data. Time never seems to go backward.',
    'prefix':'Consistent prefix reads: if writes happen in a certain order, anyone reading them sees them in that same order, so an answer never appears before its question.',
    'multi-leader':'Multi-leader replication: more than one node accepts writes. Each leader sends its changes to the others, so each leader is also a follower of the rest.',
    'conflict':'Write conflict: two leaders accept different changes to the same data at the same time, so the copies disagree and something must decide the final value.',
    'lww':'Last write wins (LWW): resolve a conflict by keeping the write with the latest timestamp and silently dropping the others. Everyone ends up the same, but data is lost.',
    'crdt':'CRDT (conflict-free replicated datatype): a data structure, like a set, counter or list, that several people can change at once and that merges the changes automatically in a sensible way.',
    'topology':'Replication topology: the paths along which writes travel from one leader to the others (for example a circle, a star or all-to-all).',
    'version-vector':'Version vector: a version number for each replica, kept with each key. It lets the database tell an overwrite from a concurrent write.'
  },
  cheatsheet:[
    'Reading from <b>asynchronous followers</b> scales reads, but they lag. “Eventually consistent” has no time limit: seconds or minutes under load.',
    '<b>Read-after-write:</b> you always see your own changes. Read things you may have edited from the leader, or make sure the replica is at least as new as your last write.',
    '<b>Monotonic reads:</b> never go back in time. Send each user to the same replica (for example, by hash of user ID).',
    '<b>Consistent prefix reads:</b> answers never appear before questions. Keep causally related writes in the same partition.',
    'Ask “what if the lag hit an hour?” Don’t pretend async is sync. Lag workarounds in app code are complex and easy to get wrong; <b>transactions</b> exist so the database can give stronger guarantees instead. Calling them too costly for distributed systems is, the book says, too simple a view (chapters 7 and 9).',
    '<b>Multi-leader</b> fits several datacenters, apps that work offline, and real-time collaborative editing. Rarely worth it in one datacenter.',
    'Conflicts: <b>avoid</b> them (one home leader per record), or <b>converge</b>: last write wins (loses data), merge, or keep both and resolve in code on write or on read.',
    'Topologies: circular and star have single points of failure; all-to-all can deliver writes out of order. Read the docs and test.'
  ],
  steps:[
/* ---------- PART 1: LAG BUGS ---------- */

{part:0,src:'Chapter 5 · Problems with Replication Lag',

    const lf={ok:['var(--ok-bg)','var(--ok-line)'],no:['var(--no-bg)','var(--no-line)'],wait:['var(--h3-bg)','var(--h3)'],idle:['var(--pri-bg)','var(--pri)']}[leadSt||'idle'];
    s+=box(8,52,104,66,lf[0],lf[1])+tx(60,72,'Leader','font-size:12.5px;font-weight:700;fill:var(--ink)')+tx(60,89,lead||'ready','font-size:12px;font-weight:700;fill:var(--ink)')+
      tx(60,106,S.sync?'waits for all':'replies at once','font-size:11.5px;fill:var(--muted)');
    s+=txl(8,146,'Tracking-page reads go','font-size:11.5px;fill:var(--muted)')+txl(8,160,'to the followers','font-size:11.5px;fill:var(--muted)');

    const fl=FY.map((y,k)=>flyDot(g,112,85,200,y,320+k*260,'var(--pri)',k===2&&S.down?.55:1).then(()=>{if(!(k===2&&S.down)){S.has[k]=S.n;draw(S.sync?'waiting…':b+' confirmed ✓',S.sync?'wait':'ok');}}));

  };

{part:1,src:'Chapter 5 · Consistent Prefix Reads',
 solve:async L=>{for(let i=0;i<4&&L.$('#f10nx');i++){L.$('#f10nx').click();for(let w=0;w<60&&L.$('#f10nx')&&L.$('#f10nx').disabled;w++)await L.sleep(30);}},
 run(L){
  let k=0,busy=false;
  const CAP=['Mr. Poons asks Mrs. Cake a question. It’s stored in partition 1, whose follower runs far behind.',
   'Mrs. Cake hears it and answers. The answer goes to partition 2, whose follower is almost up to date. A third person, reading through the followers, gets the answer first.',

   '<svg id="f10" class="vis" viewBox="0 0 320 168" role="img" aria-label="Mr. Poons writes to partition 1 with a slow follower; Mrs. Cake writes to partition 2 with a fast follower; an observer reads both"><g id="f10b"></g><g id="f10fx"></g></svg>'+

    '<line x1="88" y1="34" x2="116" y2="34" style="stroke:var(--line2);stroke-width:2"/><line x1="88" y1="134" x2="116" y2="134" style="stroke:var(--line2);stroke-width:2"/>'+
    '<line x1="208" y1="34" x2="240" y2="76" style="stroke:var(--line2);stroke-width:2"/><line x1="208" y1="134" x2="240" y2="92" style="stroke:var(--line2);stroke-width:2"/>'+
    box(4,14,84,40,'var(--h1-bg)','var(--h1)')+tx(46,39,'Mr. Poons','font-size:12.5px;font-weight:700;fill:var(--h1)')+
    box(4,114,84,40,'var(--h4-bg)','var(--h4)')+tx(46,139,'Mrs. Cake','font-size:12.5px;font-weight:700;fill:var(--h4)')+
    box(116,10,92,48,'var(--card)','var(--h3)')+tx(162,29,'Partition 1','font-size:12.5px;font-weight:700;fill:var(--ink)')+tx(162,46,'far behind','font-size:11.5px;fill:var(--h3)')+
    box(116,110,92,48,'var(--card)','var(--h2)')+tx(162,129,'Partition 2','font-size:12.5px;font-weight:700;fill:var(--ink)')+tx(162,146,'barely behind','font-size:11.5px;fill:var(--h2)')+
    box(240,62,76,44,'var(--soft)','var(--line2)')+tx(278,81,'Observer','font-size:12px;font-weight:700;fill:var(--ink)')+tx(278,96,'reads both','font-size:11.5px;fill:var(--muted)');
  const g=L.$('#f10fx');
  const line=(t,bad)=>L.$('#f10o').insertAdjacentHTML('beforeend','<div class="ln'+(bad?' bad':'')+'">'+t+'</div>');
  L.$('#f10c').innerHTML='Tap Next to play the book’s dialog between Mr. Poons and Mrs. Cake.';
  L.$('#f10nx').onclick=async()=>{
    if(busy)return;busy=true;L.$('#f10nx').disabled=true;const s=k;L.$('#f10c').innerHTML='<span class="stp">Step '+(s+1)+' of 3</span>'+CAP[s];
    if(s===0){await flyDot(g,88,34,140,34,500,'var(--h1)');if(!g.isConnected)return;g.insertAdjacentHTML('beforeend','<circle cx="136" cy="68" r="6" style="fill:var(--h1)"/>'+txl(146,72,'waiting…','font-size:11.5px;font-weight:700;fill:var(--h1)'));}
    if(s===1){await flyDot(g,88,134,208,134,450,'var(--h4)');if(!g.isConnected)return;await flyDot(g,208,134,240,92,300,'var(--h4)');if(!g.isConnected)return;line('<b>Mrs. Cake:</b> Ten seconds or so, most days.');}
    if(s===2){g.innerHTML='';await flyDot(g,208,34,240,76,450,'var(--h1)');if(!g.isConnected)return;line('<b>Mr. Poons:</b> How far ahead can you see? <span style="font-weight:700">← question after answer</span>',true);}
    k++;busy=false;L.$('#f10nx').disabled=false;

      L.$('#f10c').insertAdjacentHTML('afterend',L.quote('Such psychic powers are impressive, but very confusing.','Martin Kleppmann, chapter 5')+

{part:1,src:'Chapter 5 · Problems with Replication Lag',
 solve:async L=>{for(let j=0;j<4;j++){L.$('#e11p').children[j].click();await L.sleep(20);}},
 run(L){
  const PRE=[
   ['hour','Lag hits an hour',DAY,{lags:[0.5,3600,0.5]},'Under load or network trouble, nothing caps the lag. F2 falls an hour behind: the note vanishes and the parcel jumps back to the hub. Ask early: if the lag hit an hour, would users suffer?',null],
   ['dev','Laptop, then phone',DEV,{lags:[0.5,30,0.5],own:'ryw'},'The laptop remembers Ada’s last write; the phone doesn’t know it exists. Fix: keep that memory centrally. Also, broadband and mobile data may reach different datacenters, so leader reads may need all of a user’s devices routed to one.',['central','keep the last write centrally']],
   ['chat','Chat in two partitions',CHAT,{},'Recipients’ and couriers’ messages live in different partitions, copied with different lag. Signe, in support, sees Ravi’s answer before Mrs. Okoro’s question.',['onePart','one partition per chat']],
   ['min','The one-minute rule',DAY,{lags:[0.5,300,0.5],pick:'sticky',sticky:1,own:'min'},'For a minute after the note, reads go to the leader. Then F2, 5 minutes behind, answers again and the note vanishes. The minute rule only holds if no follower is more than a minute behind.',['skip','skip followers 1 min+ behind']]];
  const tried=new Set();let st=null;
  L.h(L.kick('pr','Edge cases')+'<h1 class="q">Where do the fixes stop protecting you? Try each case, then its fix.</h1><div class="chips" id="e11p"></div><div id="e11s"></div><div id="e11f"></div><div class="cap" id="e11c">Pick a case.</div>');
  chipRow(L.$('#e11p'),PRE.map((p,j)=>[j,p[1]]),-1,j=>{
    const p=PRE[j];tried.add(j);L.$('#e11s').innerHTML='';
    st=Strip(L,L.$('#e11s'),{id:'s11',sc:p[2],S:Object.assign({},p[3])});
    L.$('#e11c').innerHTML=p[4];
    const f=L.$('#e11f');f.innerHTML='';
    if(p[5]){const b=document.createElement('button');b.className='btn';b.style.margin='6px 0 2px';b.innerHTML=L.ic('shield')+'<span>Fix: '+p[5][1]+'</span>';
      b.onclick=()=>{st.S[p[5][0]]=!st.S[p[5][0]];b.classList.toggle('pri',st.S[p[5][0]]);b.querySelector('span').textContent=(st.S[p[5][0]]?'Fix on: ':'Fix: ')+p[5][1];st.draw();};f.appendChild(b);}
    if(tried.size===4&&!L.$('#e11d')){L.$('#e11p').insertAdjacentHTML('afterend','<span id="e11d"></span>');
      L.sheet('info','Every fix has an edge','An hour of lag breaks anything that assumes “soon.” Remembering the last write must work across devices. Same-partition writes keep answers after questions. Time-based rules hold only while lag stays small.');L.done();}
  });}},

{part:1,src:'Chapter 5 · Problems with Replication Lag',pts:5,run(L){

{part:1,src:'Chapter 5 · Reading Your Own Writes · Monotonic Reads',pts:1,
 solve:async L=>{L.$('#s13-pk').children[1].click();L.$('#s13-ow').children[2].click();L.$('#c13go').click();},
 run(L){
  let tries=0,fin=false;
  L.h(L.kick('pr','Challenge')+'<h1 class="q">Pick the routing rules: no red frame for Mrs. Okoro, no refresh waiting over 30 s, and as few reads on the leader as possible.</h1><div id="c13"></div>'+
   '<button class="btn pri" id="c13go" style="margin-top:8px">'+L.ic('check')+'Check these rules</button>');
  const st=Strip(L,L.$('#c13'),{id:'s13',sc:DAY,S:{lags:[0.5,300,20]},routing:true,on:()=>{if(!fin)L.clearSheet();}});
  L.$('#c13go').onclick=()=>{
    if(fin)return;const r=st.res(),red=r.filter(isRed).length,slow=r.filter(f=>f.bad.includes('slow')).length,ld=r.filter(f=>f.rep===-1).length;
    const pass=red===0&&slow===0&&ld===0;tries++;
    if(tries===1)L.award(pass);
    if(pass){fin=true;L.sheet('ok','Zero red, zero leader reads','“Same follower each time” gives monotonic reads: F3 never shows an older state than before. “Only a copy that has my last edit” gives read-after-write: the refresh just after the note waited 16 s for F3 instead of going to the leader.');L.done();return;}
    const why=red?red+' red frame'+(red>1?'s':'')+'. Look at the red label: went back in time needs the same follower each time; own edit missing needs a rule for after an edit.':slow?'A refresh waited over 30 s, because it went to F2, 5 minutes behind.':'No red frames, but '+ld+' reads hit the leader. One rule protects Mrs. Okoro’s note without the leader.';
    if(tries>=2){fin=true;L.sheet('no','Here’s one answer',why+' Best: same follower each time + only a copy that has my last edit. 0 red, 0 leader reads.');L.done();}
    else L.sheet('no','Not yet',why+' Change the rules and check again.');
  };}},

{part:1,src:'Chapter 5 · Solutions for Replication Lag',run(L){
  const X=s=>16+288*(Math.log10(s)+1)/(Math.log10(3600)+1);
  L.h(L.kick('learn','Designing for lag')+'<h1 class="q">Ask: what if the lag reached an hour?</h1>'+
   '<svg class="vis" viewBox="0 0 320 132" role="img" aria-label="A lag scale from 0.1 seconds to 1 hour. Usually under a second. Near capacity or with network trouble, seconds to minutes. Ask what an hour would do.">'+
   '<rect x="'+X(.1)+'" y="40" width="'+(X(1)-X(.1))+'" height="22" rx="6" style="fill:var(--ok-bg);stroke:var(--ok-line)"/>'+
   '<rect x="'+X(1)+'" y="40" width="'+(X(600)-X(1))+'" height="22" rx="6" style="fill:var(--h3-bg);stroke:var(--h3)"/>'+
   txl(X(.1),30,'usually: under a second','font-size:12px;font-weight:700;fill:var(--ok)')+
   tx((X(1)+X(600))/2,56,'busy or bad network','font-size:12px;font-weight:700;fill:var(--h3)')+
   '<line x1="16" y1="76" x2="304" y2="76" style="stroke:var(--line2);stroke-width:2"/>'+
   [[.1,'0.1 s'],[1,'1 s'],[10,'10 s'],[60,'1 min'],[600,'10 min'],[3600,'1 h']].map(t=>'<line x1="'+X(t[0])+'" y1="71" x2="'+X(t[0])+'" y2="81" style="stroke:var(--line2);stroke-width:2"/>'+tx(Math.min(296,Math.max(22,X(t[0]))),96,t[1],'font-size:11.5px;fill:var(--muted)')).join('')+
   '<circle cx="'+X(3600)+'" cy="51" r="9" style="fill:var(--no-bg);stroke:var(--no);stroke-width:2"/>'+tx(X(3600),55,'?','font-size:12px;font-weight:700;fill:var(--no)')+
   txl(150,122,'what would an hour do?','font-size:12px;font-weight:700;fill:var(--no)')+'</svg>'+
   '<div class="cap">If an hour of lag is “no problem,” fine. If users would suffer, design for a stronger guarantee, like read-after-write. Pretending async replication is synchronous causes problems later.</div>');
  L.done();}},

{part:2,src:'Chapter 5 · Multi-Leader Replication · Multi-datacenter operation',
 solve:async L=>{const w=async()=>{for(let i=0;i<120&&L.$('#m15bk').disabled;i++)await L.sleep(25);};
   L.$('#m15sea').click();L.$('#m15bk').click();await w();L.$('#m15md').children[1].click();L.$('#m15bk').click();await w();L.$('#m15sea').click();L.$('#m15wd').click();L.$('#m15bk').click();await w();},
 run(L){
  const S={multi:false,sea:true,wDown:false,busy:false,nv:{}},done=new Set();
  L.h(L.kick('learn','More than one leader')+'<h1 class="q">Nordhaven opens overseas. Where should its bookings be written?</h1>'+
   mapSVG('m15','Westport and Eastvale on one coast, Nordhaven across the sea')+
   '<div class="chips" id="m15md"></div><div class="brow"><button class="btn" id="m15sea">'+L.ic('x')+'<span>Cut sea link</span></button><button class="btn" id="m15wd">'+L.ic('alert')+'<span>Westport down</span></button><button class="btn pri" id="m15bk">'+L.ic('arrow')+'Book in Nordhaven</button></div>'+
   '<div class="mlog" id="m15l">With one leader, every write goes through Westport: can’t reach it, can’t write. A '+L.g('multi-leader','multi-leader')+' setup (also called master–master or active/active) gives each region a leader that also follows the others.</div>'+
   tasks('m15t',['Book with <b>one leader</b> and the sea link cut','Book with <b>a leader per region</b> and the sea link cut','Book with Westport down']));
  const svg=L.$('#m15');
  function draw(){
    const role=K=>S.multi?'leader':K==='W'?'leader':'follower';
    const n={};['W','E','N'].forEach(K=>{n[K]={role:role(K),st:K==='W'&&S.wDown?'down':(S.multi||K==='W')?'lead':'ok',val:K==='W'&&S.wDown?'down':S.nv[K]||'',vc:K==='W'&&S.wDown?'var(--muted)':(S.nv[K]||'').includes('✗')?'var(--no)':'var(--ok)'};});
    const sea=S.sea?'ok':'cut';
    mLinks(svg,S.multi?[{a:'W',b:'E',dir:'both'},{a:'W',b:'N',dir:'both',st:sea},{a:'E',b:'N',dir:'both',st:sea}]:[{a:'W',b:'E',dir:'ab'},{a:'W',b:'N',dir:'ab',st:sea}]);
    mNodes(svg,n);
  }
  chipRow(L.$('#m15md'),[[0,'One leader'],[1,'Leader per region']],0,k=>{if(S.busy)return;S.multi=!!k;S.nv={};draw();});
  L.$('#m15sea').onclick=()=>{if(S.busy)return;S.sea=!S.sea;L.$('#m15sea span').textContent=S.sea?'Cut sea link':'Restore link';L.$('#m15sea').classList.toggle('pri',!S.sea);S.nv={};draw();};
  L.$('#m15wd').onclick=()=>{if(S.busy)return;S.wDown=!S.wDown;L.$('#m15wd span').textContent=S.wDown?'Westport back':'Westport down';L.$('#m15wd').classList.toggle('pri',S.wDown);S.nv={};draw();};
  L.$('#m15bk').onclick=async()=>{
    if(S.busy)return;S.busy=true;L.$('#m15bk').disabled=true;S.nv={};draw();const log=h=>{L.$('#m15l').innerHTML=h;};
    if(!S.multi){
      if(S.wDown){S.nv.N='✗ no leader';draw();log('<b>No leader.</b> Every write needs Westport. Before Nordhaven can book again, failover must promote a follower in another region.');}
      else if(!S.sea){await mFly(svg,'N','W',650,'var(--pri)',0,.45);S.nv.N='✗ failed';log('<b>Booking failed.</b> It must cross the sea to the leader in Westport, and the link is down. Single-leader writes depend on that link.');if(!S.sea)done.add(0);}
      else{await mFly(svg,'N','W',650,'var(--pri)');await mFly(svg,'W','N',650,'var(--ok-strong)');S.nv.N='✓ slow';log('Saved, but each booking crossed the sea to Westport and back before the merchant got an answer.');}
    }else{
      S.nv.N='✓ saved here';draw();
      const cut=!S.sea;
      await Promise.all([mFly(svg,'N','W',650,'var(--pri)',4.5,cut||S.wDown?.45:1),mFly(svg,'N','E',800,'var(--pri)',4.5,cut?.45:1)]);
      if(!cut&&!S.wDown)S.nv.E='✓ copied';
      log(cut?'<b>Saved in Nordhaven at once.</b> The copies to the other regions wait and catch up when the link is back. A broken link doesn’t stop writes.':S.wDown?'<b>Saved in Nordhaven at once.</b> Eastvale and Nordhaven keep working without Westport, which catches up when it’s back.':'Saved locally at once, then copied to the other regions in the background. Users don’t feel the distance.');
      if(cut)done.add(1);
    }
    if(S.wDown)done.add(2);
    done.forEach(k=>tick(L,'m15t',k));draw();
    S.busy=false;L.$('#m15bk').disabled=false;
    if(allTicked(L,'m15t')&&!S.fin){S.fin=true;
      L.sheet('info','A leader per datacenter','Writes are local, so they feel faster; each region survives another’s outage; a broken link doesn’t stop writes. Inside one datacenter it rarely pays. And it’s often bolted on, so autoincrement keys, triggers and constraints can misbehave: dangerous territory.');L.done();}
  };
  draw();}},

   '<div class="cap">Offline, each device’s local database is a leader that syncs later: multi-datacenter replication in the extreme. CouchDB is designed for this. Live co-editing is alike: each keystroke lands on your own copy first, with no lock.</div>');
  L.done();}},

{part:3,src:'Chapter 5 · Handling Write Conflicts · Synchronous versus asynchronous conflict detection',run(L){
  L.h(L.kick('learn','Write conflicts')+'<h1 class="q">Both edits succeed. Then they collide.</h1>'+mapSVG('w19','Ada edits the pickup spot in Westport while Bo edits it in Nordhaven; both saves succeed, and the clash is found later')+
   '<div class="cap">Ada sets Pip & Thistle’s pickup spot in Westport; their colleague Bo sets it in Nordhaven at the same moment. Both leaders say “saved.” The '+L.g('conflict','conflict')+' shows up later, when edits are copied across.</div>'+
   L.note('One leader would make the second writer wait or retry. Detecting clashes synchronously, by waiting for every leader before saying “saved,” throws away the point of having several.','info'));
  const svg=L.$('#w19');
  mLinks(svg,[{a:'W',b:'N',dir:'both',st:'slow',label:'⚡ clash found later',lc:'var(--no)'}]);
  mNodes(svg,{W:{role:'Ada: Back door →',val:'Side gate ✓',st:'good',vc:'var(--ok)'},N:{role:'Bo: Back door →',val:'Front desk ✓',st:'good',vc:'var(--ok)'}});

{part:3,src:'Chapter 5 · Handling Write Conflicts',
 solve:async L=>{const run=async(s)=>{L.$('#k20s').querySelector('[data-k="'+s+'"]').click();L.$('#k20go').click();for(let i=0;i<120&&L.$('#k20go').disabled;i++)await L.sleep(25);};
   await run('arr');await run('lww');await run('merge');L.$('#k20c').children[1].click();await run('rid');},
 run(L){
  const S={case:'note',strat:'arr',busy:false,wfail:false};const got=new Set();
  const ST=[['arr','Each applies in arrival order'],['lww','Last write wins'],['rid','Higher replica ID wins'],['merge','Merge the values'],['both','Keep both, ask later'],['home','Home region (avoid)']];
  L.h(L.kick('pr','Explore · resolve the clash')+'<h1 class="q">Pick a strategy and replicate. Do all three regions end up the same? Was anything lost?</h1>'+
   '<div class="chips" id="k20c"></div>'+mapSVG('k20','Three regions holding Pip & Thistle’s data')+'<div class="rl">Strategy</div><div class="chips" id="k20s"></div>'+
   '<div class="brow"><button class="btn pri" id="k20go">'+L.ic('play')+'Edit and replicate</button><button class="btn" id="k20wf">'+L.ic('alert')+'<span>Home region fails</span></button></div>'+
   '<div class="mlog" id="k20l">Ada edits in Westport (clock 10:00:00.120); Bo edits in Nordhaven (10:00:00.090). Replica IDs: Westport 1, Eastvale 2, Nordhaven 3.</div>'+
   tasks('k20t',['See the regions disagree','Agree, but lose an edit','Agree without losing either edit','Try “last place in a slot”']));
  const svg=L.$('#k20');
  const A={note:['Back door','Side gate','Front desk'],slot:['1 place left','Ada books it','M-31 books it']};
  function show(vals,st){const n={};['W','E','N'].forEach(K=>{const v=vals[K];n[K]={role:K==='W'?'leader · Ada':K==='N'?(S.case==='note'?'leader · Bo':'leader · M-31'):'leader',val:v,st:st&&st[K]||'ok',vc:st&&st[K]==='bad'?'var(--no)':'var(--ink)'};});mNodes(svg,n);}
  function links(hot){mLinks(svg,[{a:'W',b:'E',dir:'both',st:hot?'hot':''},{a:'W',b:'N',dir:'both',st:hot?'hot':''},{a:'E',b:'N',dir:'both',st:hot?'hot':''}]);}
  function reset(){const a=A[S.case][0];links(false);show({W:a,E:a,N:a});
    L.$('#k20l').innerHTML=S.case==='note'?'Pickup spot is “Back door.” Ada edits it in Westport (clock 10:00:00.120); Bo in Nordhaven (10:00:00.090). Replica IDs: Westport 1, Eastvale 2, Nordhaven 3.':'The 3–4 pm slot in zone W2 has 1 place left. Ada books it in Westport while shop M-31 books it in Nordhaven. Each leader checks: 1 place left ✓.';}
  chipRow(L.$('#k20c'),[['note','Same field, two edits'],['slot','Last place in a slot']],'note',k=>{if(S.busy)return;S.case=k;reset();});
  chipRow(L.$('#k20s'),ST,'arr',k=>{if(S.busy)return;S.strat=k;reset();});
  L.$('#k20wf').onclick=()=>{if(S.busy)return;S.wfail=!S.wfail;L.$('#k20wf').classList.toggle('pri',S.wfail);L.$('#k20wf span').textContent=S.wfail?'Home region back':'Home region fails';reset();};
  L.$('#k20go').onclick=async()=>{
    if(S.busy)return;S.busy=true;L.$('#k20go').disabled=true;reset();
    const note=S.case==='note',[a0,B,C]=A[S.case];let res,eq,lost,msg;
    const home=S.strat==='home'&&!S.wfail;
    if(home){
      show({W:a0,E:a0,N:a0});await mFly(svg,'N','W',600,'var(--h4)',4.5);
      links(true);show({W:note?C:'Ada’s ✓',E:a0,N:a0});await Promise.all([mFly(svg,'W','E',500,'var(--pri)',4.5),mFly(svg,'W','N',600,'var(--pri)',4.5)]);
      if(note){res={W:C,E:C,N:C};lost='none';msg='<b>No conflict.</b> Pip & Thistle’s home is Westport, so Bo’s edit went there too, and one leader put the two edits in order. For this record, it’s single-leader.';}
      else{res={W:'1 booking',E:'1 booking',N:'M-31: full ✗'};lost='none';msg='<b>No clash across leaders.</b> All bookings for this slot go to one leader, which sees both and can turn the second one down. (Doing that check safely on one node is a transaction question, later in the course.)';}
      eq=true;
    }else{
      show(note?{W:B,E:a0,N:C}:{W:'Ada ✓',E:a0,N:'M-31 ✓'});await L.sleep(250);links(true);
      await Promise.all([mFly(svg,'W','E',450,'var(--h1)',4.5),mFly(svg,'W','N',650,'var(--h1)',4.5),mFly(svg,'N','E',800,'var(--h4)',4.5),mFly(svg,'N','W',650,'var(--h4)',4.5)]);
      const pre=S.strat==='home'?'<b>Home region failed</b>, so Bo’s writes were rerouted to Nordhaven. Avoidance broke down. ':'';
      if(!note){res={W:'2 bookings',E:'2 bookings',N:'2 bookings'};eq=true;lost='none';msg=pre+'<b>Same everywhere, and over-booked: 2 bookings for 1 place.</b> They’re different records, so no field ever clashed, and nothing resolved it. Subtle conflicts like this need more than a merge rule.';}
      else if(S.strat==='arr'||S.strat==='home'){res={W:C,E:C,N:B};eq=false;lost='-';msg=pre+'<b>The regions disagree, forever.</b> Westport saw Ada’s edit then Bo’s; Nordhaven saw them the other way round. Every copy must end up the same: resolution must be <b>convergent</b>.';}
      else if(S.strat==='lww'){res={W:B,E:B,N:B};eq=true;lost='Bo’s “Front desk”';msg='<b>Same everywhere.</b> '+L.g('lww','Last write wins')+' kept the later timestamp, Ada’s, and silently threw Bo’s edit away. Popular, but prone to losing data.';}
      else if(S.strat==='rid'){res={W:C,E:C,N:C};eq=true;lost='Ada’s “Side gate”';msg='<b>Same everywhere.</b> Nordhaven has the higher replica ID, so Bo’s edit wins and Ada’s is dropped. Also loses data.';}
      else if(S.strat==='merge'){res={W:['Front desk /','Side gate'],E:['Front desk /','Side gate'],N:['Front desk /','Side gate']};eq=true;lost='none';msg='<b>Same everywhere, nothing lost.</b> The values were sorted and joined. Safe, if “Front desk / Side gate” makes sense to a courier.';}
      else{res={W:['2 versions','ask Ada'],E:['2 versions','ask Ada'],N:['2 versions','ask Ada']};eq=true;lost='none';msg='<b>Same everywhere, nothing lost.</b> Both versions are kept in an explicit structure. App code resolves it later, maybe by asking Ada which spot is right.';}
    }
    if(!L.$('#k20'))return;
    const st={};['W','E','N'].forEach(K=>{st[K]=!eq?'bad':(!note&&!home)?'bad':'good';});
    links(false);show(res,st);
    L.$('#k20l').innerHTML=msg+'<br><span class="'+(eq?'ok-t':'no-t')+'">'+(eq?'✓ all regions equal':'✗ regions differ')+'</span>'+(note&&lost!=='-'?' · <span class="'+(lost==='none'?'ok-t':'no-t')+'">lost: '+lost+'</span>':'');
    if(note&&!eq)tick(L,'k20t',0);
    if(note&&eq&&lost!=='none')tick(L,'k20t',1);
    if(note&&eq&&lost==='none'&&!home)tick(L,'k20t',2);
    if(note&&home)tick(L,'k20t',2);
    if(!note)tick(L,'k20t',3);
    S.busy=false;L.$('#k20go').disabled=false;
    if(allTicked(L,'k20t')&&!S.fin){S.fin=true;
      L.sheet('info','Avoid, or converge','Simplest: avoid conflicts by giving each record a home leader. That breaks when the home has to change: a datacenter fails, or a user moves. Otherwise every copy must converge, and the cheap ways (last write wins, higher replica ID) lose data.');L.done();}
  };
  reset();}},

   ['When two edits to a delivery note clash, the one with the later timestamp is kept and the other silently dropped.',1,'Keep the latest timestamp, drop the rest: last write wins. It converges but loses an edit.'],
   ['Both clashing versions are stored. The dashboard shows both to the merchant next time and asks which to keep.',2,'All versions are kept and handed to the app at read time.'],

{part:3,src:'Chapter 5 · Multi-Leader Replication Topologies',
 solve:async L=>{const w=async()=>{for(let i=0;i<150&&L.$('#t24w').disabled;i++)await L.sleep(25);};
   for(const t of ['ring','star','all']){L.$('#t24k').querySelector('[data-k="'+t+'"]').click();L.$('#t24n').click();await w();}
   L.$('#t24k').querySelector('[data-k="ring"]').click();L.$('#t24e').click();L.$('#t24w').click();await w();},
 run(L){
  const S={topo:'ring',eDown:false,busy:false,cnt:{W:0,N:0},has:{W:[],E:[],N:[]}},tried=new Set();
  L.h(L.kick('learn','Who sends to whom?')+'<h1 class="q">Pick a '+L.g('topology','topology')+' and send a write. Then knock out Eastvale.</h1>'+
   '<div class="chips" id="t24k"></div>'+mapSVG('t24','Three leaders and the paths writes travel between them')+
   '<div class="brow"><button class="btn pri" id="t24w">'+L.ic('arrow')+'Write in Westport</button><button class="btn pri" id="t24n">'+L.ic('arrow')+'Write in Nordhaven</button><button class="btn" id="t24e">'+L.ic('x')+'<span>Eastvale down</span></button></div>'+
   '<div class="mlog" id="t24l">Circular (MySQL’s default): each leader passes writes, plus its own, to the next. Star: one root (Westport) forwards to the rest; it can grow into a tree. All-to-all: every leader sends to every other.</div>'+
   tasks('t24t',['Send a write in all three topologies','Break the circle: Eastvale down, write in Westport']));
  const svg=L.$('#t24');
  const NEXT={W:'E',E:'N',N:'W'};
  function links(){const st=K=>S.eDown&&K==='E'?'dim':'';
    if(S.topo==='ring')return [{a:'W',b:'E',dir:'ab',st:st('E')},{a:'E',b:'N',dir:'ab',st:st('E')},{a:'N',b:'W',dir:'ab'}];
    if(S.topo==='star')return [{a:'W',b:'E',dir:'both',st:st('E')},{a:'W',b:'N',dir:'both'}];
    return [{a:'W',b:'E',dir:'both',st:st('E')},{a:'W',b:'N',dir:'both'},{a:'E',b:'N',dir:'both',st:st('E')}];}
  function draw(){mLinks(svg,links());const n={};['W','E','N'].forEach(K=>{const d=S.eDown&&K==='E';n[K]={role:(S.topo==='star'&&K==='W'?'root ':'')+'leader',st:d?'down':'ok',val:d?'down':(S.has[K].length?S.has[K].slice(-3).join(' '):'—'),vc:'var(--pri)'};});mNodes(svg,n);}
  chipRow(L.$('#t24k'),[['ring','Circular'],['star','Star'],['all','All-to-all']],'ring',k=>{if(S.busy)return;S.topo=k;S.has={W:[],E:[],N:[]};draw();});
  L.$('#t24e').onclick=()=>{if(S.busy)return;S.eDown=!S.eDown;L.$('#t24e span').textContent=S.eDown?'Eastvale back up':'Eastvale down';L.$('#t24e').classList.toggle('pri',S.eDown);S.has={W:[],E:[],N:[]};draw();};
  async function send(O){
    if(S.busy)return;S.busy=true;L.$('#t24w').disabled=L.$('#t24n').disabled=true;
    S.cnt[O]++;const id=O+S.cnt[O],notes=[];S.has[O].push(id);draw();
    const off=S.topo==='ring'?0:4.5;
    let hops=[];
    if(S.topo==='ring')hops=[[O,NEXT[O],[O]]];
    else if(S.topo==='star')hops=O==='W'?[['W','E',['W']],['W','N',['W']]]:[[O,'W',[O]]];
    else hops=['W','E','N'].filter(K=>K!==O).map(K=>[O,K,[O]]);
    while(hops.length){
      const nx=[];
      await Promise.all(hops.map(async([a,b,tags])=>{
        const down=S.eDown&&b==='E';
        await mFly(svg,a,b,560,'var(--pri)',off,down?.55:1);
        if(down){notes.push(NM[b]+' is down: the write stops there.');return;}
        if(tags.includes(b)){notes.push(id+' came back to '+NM[b]+' tagged '+tags.map(t=>NM[t]).join(', ')+': ignored, so it doesn’t loop forever.');return;}
        if(!S.has[b].includes(id))S.has[b].push(id);draw();
        const t2=tags.concat(b);
        if(S.topo==='ring')nx.push([b,NEXT[b],t2]);
        if(S.topo==='star'&&b==='W')['E','N'].filter(K=>!t2.includes(K)).forEach(K=>nx.push(['W',K,t2]));
      }));
      if(!L.$('#t24'))return;hops=nx;
    }
    const miss=['W','E','N'].filter(K=>!(S.eDown&&K==='E')&&!S.has[K].includes(id));
    L.$('#t24l').innerHTML=(miss.length?'<b class="no-t">'+id+' never reached '+miss.map(K=>NM[K]).join(', ')+'</b>, although it’s up. One failed node blocks the flow until someone reconfigures by hand. ':'<b class="ok-t">'+id+' reached every live leader.</b> ')+notes.join(' ');
    tried.add(S.topo);if(tried.size===3)tick(L,'t24t',0);
    if(S.topo==='ring'&&S.eDown&&miss.length)tick(L,'t24t',1);
    S.busy=false;L.$('#t24w').disabled=L.$('#t24n').disabled=false;
    if(allTicked(L,'t24t')&&!S.fin){S.fin=true;
      L.sheet('info','Single points of failure','In circular and star topologies, a write passes through several nodes and is tagged with each node’s ID, so it doesn’t loop forever. One failed node can cut others off. All-to-all routes around failures, but has its own catch: next.');L.done();}
  }
  L.$('#t24w').onclick=()=>send('W');L.$('#t24n').onclick=()=>send('N');
  draw();}},

{part:3,src:'Chapter 5 · Multi-Leader Replication Topologies',pts:1,
 solve:async L=>{L.$('#p25o').children[1].click();for(let i=0;i<150&&!L.$('#p25d');i++)await L.sleep(30);},
 run(L){
  let pick=null;
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">All-to-all, but the Nordhaven → Eastvale link is slow today. Nordhaven creates parcel OP&#8209;48213. Westport gets it and updates its status. What reaches Eastvale first?</h1>'+
   '<div class="chips" id="p25o"></div>'+mapSVG('p25','All-to-all between three leaders; the link from Nordhaven to Eastvale is slow')+'<div class="mlog" id="p25l">Pick a prediction to play it.</div>');
  const svg=L.$('#p25');const has={W:[],E:[],N:[]};
  function draw(){mLinks(svg,[{a:'W',b:'E',dir:'both'},{a:'W',b:'N',dir:'both'},{a:'E',b:'N',dir:'both',st:'slow'}]);
    const n={};['W','E','N'].forEach(K=>{const h=has[K];n[K]={role:'leader',val:h.length?h:'—',st:K==='E'&&h[0]&&h[0].startsWith('update')?'bad':'ok',vc:K==='E'&&h[0]&&h[0].startsWith('update')?'var(--no)':'var(--ink)'};});mNodes(svg,n);}
  draw();
  ['The create, then the update','The update, for a parcel it doesn’t have','Only the update; the create is lost'].forEach((t,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=t;
    b.onclick=async()=>{if(pick!==null)return;pick=j;b.classList.add('sel');
      has.N.push('create');draw();
      const slow=mFly(svg,'N','E',2000,'var(--h4)',4.5).then(()=>{has.E.push('create');draw();});
      await mFly(svg,'N','W',500,'var(--h4)',4.5);if(!L.$('#p25'))return;has.W.push('create');draw();await L.sleep(150);
      has.W=['create','update'];draw();
      await Promise.all([mFly(svg,'W','E',500,'var(--pri)',4.5).then(()=>{has.E.push('update ✗');draw();}),mFly(svg,'W','N',500,'var(--pri)',4.5).then(()=>{has.N.push('update');draw();})]);
      await slow;if(!L.$('#p25'))return;
      L.$('#p25l').innerHTML='Eastvale got <b>update OP-48213</b> for a parcel it had never heard of, and only later the <b>create</b> it depends on.<span id="p25d"></span>';
      const ok=j===1;L.award(ok);
      L.sheet(ok?'ok':'no',ok?'Right: the update overtook the create':'The update overtook the create','The update depends on the create, like an answer on its question. Timestamps can’t fix the order, since clocks aren’t reliably in sync. '+L.g('version-vector','Version vectors')+' can (next lesson). Many multi-leader tools handle this poorly: read the docs and test.');L.done();};
    L.$('#p25o').appendChild(b);});}}
  ]
});
</script>
</body>
</html>
