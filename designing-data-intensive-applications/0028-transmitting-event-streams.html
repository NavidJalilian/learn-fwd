{part:3,src:'Chapter 11 · Partitioned Logs',run(L){
  let qA=[5,6,7,8,9],pB=5;
  L.h(L.kick('learn','Two mindsets')+'<h1 class="q">Reading deletes, or reading just moves a bookmark</h1>'+CSS+
   '<div class="es-fig" id="m19f"></div><div class="es-row"><button class="btn" id="m19b">'+L.ic('play')+'Read one message</button></div>'+
   '<p class="es-cap">In a classic broker, acknowledging a message deletes it, so a rerun can’t give the same result. Files and databases keep data. A <b>log-based broker</b> combines both: durable storage plus fast notification.</p>');
  function draw(){let s='<svg viewBox="0 0 320 196" role="img" aria-label="Top: a classic queue loses each message once read. Bottom: a log keeps every message and the consumer’s pointer moves along.">';
    s+=T(4,14,'Classic broker: a message passes through','font-size:12px;font-weight:700;fill:var(--pri)');
    qA.forEach((m,k)=>{const x=8+k*36;s+=box(x,24,32,28,'var(--pri-bg)','var(--pri)',{rx:6})+T(x+16,43,'m'+m,'font-size:11.5px;font-weight:700;fill:var(--pri);text-anchor:middle');});
    s+=box(236,22,80,32,'var(--h2-bg)','',{rx:8})+T(276,42,'Consumer','font-size:11.5px;font-weight:700;fill:var(--h2);text-anchor:middle');
    s+=T(4,74,'New consumers get only new messages','font-size:11.5px;fill:var(--muted)');if(qA[0]>5)s+=T(276,74,'m'+(qA[0]-1)+' deleted','font-size:11.5px;font-weight:700;fill:var(--no);text-anchor:middle');
    s+='<line x1="0" y1="88" x2="320" y2="88" style="stroke:var(--line);stroke-width:1"/>';
    s+=T(4,108,'Log: messages stay, like a file','font-size:12px;font-weight:700;fill:var(--h2)');
    for(let k=0;k<10;k++){const x=6+k*31,rd=k<pB;s+=box(x,118,27,28,rd?'var(--soft2)':'var(--card)','var(--line2)',{rx:5})+T(x+13.5,137,k,'font-size:11.5px;font-weight:600;fill:'+(rd?'var(--muted)':'var(--ink)')+';text-anchor:middle');}
    const px=6+pB*31+13.5;s+='<path d="M'+px+' 150l-7 10h14z" style="fill:var(--h2)"/>'+T(Math.min(px,250),174,'consumer at offset '+pB,'font-size:11.5px;font-weight:600;fill:var(--h2);text-anchor:middle');
    s+='<path d="M19.5 150l-7 10h14z" style="fill:none;stroke:var(--h4);stroke-width:1.5;stroke-dasharray:3 2"/>'+T(4,192,'a new consumer can start at 0','font-size:11.5px;font-weight:600;fill:var(--h4)');
    L.$('#m19f').innerHTML=s+'</svg>';}
  L.$('#m19b').onclick=()=>{if(qA.length>1){qA=qA.slice(1);qA.push(qA[qA.length-1]+1);}if(pB<9)pB++;draw();};
  draw();L.done();}},
{part:3,src:'Chapter 11 · Using logs for message storage',run(L){
  const LEN=[8,6,9];
  let s='<svg viewBox="0 0 320 220" role="img" aria-label="The parcel-scans topic as three partitions, each a row of numbered messages with new ones appended at the right end. Below, the systems that work this way.">'+arrowDefs;
  s+=T(4,14,'Topic “parcel-scans”','font-size:12px;font-weight:700;fill:var(--ink)');
  LEN.forEach((n,p)=>{const y=26+p*44;s+=T(4,y+18,'P'+p,'font-size:12px;font-weight:700;fill:var(--muted)');
    for(let k=0;k<n;k++){const x=28+k*28;s+=box(x,y,25,26,k===n-1?'var(--h3-bg)':'var(--card)',k===n-1?'var(--h3)':'var(--line2)',{rx:5})+T(x+12.5,y+18,k,'font-size:11.5px;font-weight:600;fill:var(--ink);text-anchor:middle');}
    const ex=28+n*28;s+='<line x1="'+(ex+22)+'" y1="'+(y+13)+'" x2="'+(ex+3)+'" y2="'+(y+13)+'" style="stroke:var(--h3);stroke-width:2" marker-end="url(#es-ah)"/>';});
  s+=T(316,14,'append →','font-size:11.5px;font-weight:700;fill:var(--h3);text-anchor:end');
  s+='<path d="M'+(28+5*28+12.5)+' 54l-6 8h12z" style="fill:var(--h1)"/>'+T(28+5*28+24,63,'a consumer’s offset','font-size:11px;font-weight:700;fill:var(--h1)');
  s+=T(4,172,'Order holds inside a partition, not across them.','font-size:12px;font-weight:600;fill:var(--h2)');
  s+='<line x1="2" y1="182" x2="318" y2="182" style="stroke:var(--line);stroke-width:1"/>';
  s+=T(4,198,'Kafka · Kinesis Streams · DistributedLog','font-size:11.5px;font-weight:600;fill:var(--muted)');
  s+=T(4,214,'Google Cloud Pub/Sub: log-like inside, JMS-style API','font-size:11px;fill:var(--muted)');
  s+='</svg>';
  L.h(L.kick('learn','How a log-based broker works')+'<h1 class="q">Append, partition, number</h1>'+CSS+'<div class="es-fig">'+s+'</div>'+
   '<p class="es-cap">Producers append to the end of a '+L.g('log','log')+'; a consumer reads it in order and waits at the end, like <code>tail -f</code>. Each '+L.g('partition','partition')+' can sit on its own machine; every message gets an increasing '+L.g('offset','offset')+'.</p>'+
   '<p class="es-foot">All on disk, yet millions of messages a second by partitioning; replicas survive faults.</p>');
  L.done();}},
{part:3,src:'Chapter 11 · When consumers cannot keep up',
 solve:async L=>{setRange(L,'g21-m',300);setRange(L,'g21-c2',0);for(let k=0;k<4&&!L.$('#g21ok');k++){await L.sleep(80);L.$('#g21-sk').click();await L.sleep(650);}await waitFor(L,'#g21ok',2000);},
 run(L){
  L.h(L.kick('pr','Explore the ring')+'<h1 class="q">One partition of Otterpost’s event log is a ring of disk segments. Make one consumer fall so far behind that it loses events.</h1>'+CSS+
   '<p class="small">Slow a consumer, speed up new scans, or skip ahead. You can drag a dot backwards to re-read old scans.</p><div id="g21"></div><p class="es-foot">Rates are illustrative: 100k scans an hour on a normal day.</p>');
  const rg=Ring(L,L.$('#g21'),{id:'g21',cons:RING_CONS,on:e=>{
    if(e.type==='lost'&&!L.$('#g21ok')){L.$('#g21').insertAdjacentHTML('beforeend','<span id="g21ok"></span>');const c=rg.S.cons[e.i];const others=rg.S.cons.filter(x=>x!==c&&!x.missed).map(x=>x.name);
      L.sheet('info',c.name+' was lapped','The write head came all the way round and the segments '+c.name+' still needed were deleted, so it skipped to the oldest kept scan. '+(others.length?others.join(' and ')+' didn’t notice a thing. ':'')+'A log is <b>buffering with a big but fixed-size buffer</b>: a ring.');L.done();}}});}},
{part:3,src:'Chapter 11 · Disk space usage',pts:1,
 solve:async L=>{L.$('#d22c').children[1].click();await waitFor(L,'#d22s',5000);},
 run(L){
  let pick=null;
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">A typical large disk (when the book was written) holds 6 TB and writes 150 MB per second. Writing flat out, how long until the ring is full and starts deleting?</h1>'+CSS+
   '<div class="es-row" id="d22c"></div><div class="es-fig" id="d22f"></div><div id="d22x"></div>');
  function draw(fr,big,sub){let s='<svg viewBox="0 0 320 196" role="img" aria-label="A ring of disk segments filling up as messages are written.">';const cx=160,cy=98;
    for(let k=0;k<12;k++)s+='<path d="'+sector(cx,cy,62,88,k*30+.8,k*30+29.2)+'" style="fill:var(--card);stroke:var(--line2);stroke-width:1.2"/>';
    if(fr>0)s+='<path d="'+sector(cx,cy,64,86,0,Math.min(359.9,fr*360))+'" style="fill:var(--h2-bg)"/>';
    const a=Math.min(359.9,fr*360);s+='<line x1="'+pol(cx,cy,58,a).replace(' ','" y1="')+'" x2="'+pol(cx,cy,94,a).replace(' ','" y2="')+'" style="stroke:var(--h3);stroke-width:4;stroke-linecap:round"/>';
    s+=T(cx,cy+4,big,'font-size:19px;font-weight:700;fill:var(--ink);text-anchor:middle')+T(cx,cy+20,sub,'font-size:11px;fill:var(--muted);text-anchor:middle');
    s+=T(4,190,'6 TB disk','font-size:12px;font-weight:600;fill:var(--muted)')+T(316,190,'written in order','font-size:12px;font-weight:600;fill:var(--muted);text-anchor:end');
    L.$('#d22f').innerHTML=s+'</svg>';}
  draw(0,'0 h','written');
  ['About 1 hour','About 11 hours','About 4 days'].forEach((t,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=t;
    b.onclick=async()=>{if(pick!==null)return;pick=j;b.classList.add('sel');
      for(let k=1;k<=30;k++){if(!L.$('#d22f'))return;draw(k/30,R1(11.1*k/30)+' h','at 150 MB/s');await L.sleep(50);}
      const ok=j===1;L.award(ok);
      L.sheet(ok?'ok':'no',ok?'Right: about 11 hours':'About 11 hours','6,000,000 MB ÷ 150 MB/s = 40,000 seconds, about 11 hours. After that, each new segment overwrites the oldest one. The ratio stays the same with more disks and machines.');
      L.$('#d22x').innerHTML=rng('d22s','Write speed',15,150,150,15)+'<div class="es-read" id="d22r"></div>';
      const u=()=>{const v=+L.$('#d22s').value,h=6e6/v/3600;L.$('#d22s-v').textContent=v+' MB/s';draw(1,h<48?R1(h)+' h':R1(h/24)+' days','kept at '+v+' MB/s');
        L.$('#d22r').innerHTML='Real logs rarely write at full speed, so the ring often holds <b>days or weeks</b> of messages. And the log’s throughput stays about the same however much it keeps, because every message goes to disk anyway.';};
      L.$('#d22s').oninput=u;u();L.done();};
    L.$('#d22c').appendChild(b);});}},
{part:3,src:'Chapter 11 · Consumer offsets',
 solve:async L=>{setRange(L,'o23m',5);await L.sleep(60);L.$('#o23x').click();await L.sleep(60);L.$('#o23s').click();await waitFor(L,'#o23ok',3000);},
 run(L){
  const S0=1; /* saved offset sits at cell 1 of each row */
  const st={n:2,k:3,crash:false,slow:false},seen={many:false,crash:false,slow:false};
  L.h(L.kick('pr','Consumer groups and offsets')+'<h1 class="q">Linh’s notification group reads a topic with four partitions. Add machines, crash M2, and slow a message.</h1>'+CSS+
   '<div class="es-fig" id="o23f"></div>'+
   '<div class="small" style="margin:2px 0 6px"><span style="display:inline-block;width:3px;height:12px;background:var(--ok-strong);vertical-align:middle"></span> saved offset · <span style="display:inline-block;width:12px;height:10px;background:var(--h1-bg);border:1.5px solid var(--h1);vertical-align:middle"></span> reading now · <span style="display:inline-block;width:12px;height:10px;background:var(--h3-bg);border:1.5px solid var(--h3);vertical-align:middle"></span> ×2 processed twice</div>'+
   rng('o23m','Machines',1,6,st.n)+rng('o23k','Not yet saved',0,5,st.k)+
   '<div class="es-row"><button class="btn" id="o23x"></button><button class="btn" id="o23s"></button></div>'+
   '<div class="es-read" id="o23r" aria-live="polite"></div>'+
   '<p class="es-cap">The broker hands each machine <b>whole partitions</b>, read in order. It doesn’t track acks per message; now and then it saves each partition’s <b>offset</b>.</p>'+
   '<p class="small" id="o23h"></p><p class="es-foot">Offsets and counts are illustrative.</p>');
  /* split partitions over the first min(n,4) machines in blocks: 2 machines → P0,P1 | P2,P3 */
  function assign(){const k=Math.min(st.n,4),own=[0,1,2,3].map(p=>Math.floor(p*k/4));
    let orphan=[];if(st.crash&&st.n>=2){orphan=[0,1,2,3].filter(p=>own[p]===1);
      orphan.forEach(p=>{let best=-1,cnt=9;for(let m=0;m<st.n;m++){if(m===1)continue;const c=own.filter((o,q)=>o===m&&!orphan.includes(q)).length;if(c<cnt){cnt=c;best=m;}}own[p]=best;});}
    return {own,orphan};}
  function draw(){
    const {own,orphan}=assign(),r=S0+st.k,n=st.n;
    let s='<svg viewBox="0 0 320 188" role="img" aria-label="Four partitions as rows of messages on the left, the machines of the notification group on the right, with a line from each partition to the machine reading it.">';
    const mh=Math.min(40,(176-(n-1)*6)/n),my=m=>R1(6+m*(mh+6));
    for(let p=0;p<4;p++){const y=8+p*44,orph=orphan.includes(p),cur=orph?S0:r,slowHere=st.slow&&p===1;
      s+=T(4,y+19,'P'+p,'font-size:12px;font-weight:700;fill:var(--muted)');
      for(let i=0;i<7;i++){const x=30+i*27;let f=i<cur?'var(--soft2)':'var(--card)',sk='var(--line2)',dash='',lab='';
        if(orph&&i>=S0&&i<r){f='var(--h3-bg)';sk='var(--h3)';lab='×2';}
        if(i===cur){f=slowHere?'var(--no-bg)':orph&&i<r?'var(--h3-bg)':'var(--h1-bg)';sk=slowHere?'var(--no)':'var(--h1)';if(slowHere)lab='2 s';}
        else if(slowHere&&i>cur){sk='var(--no)';dash='3 2';}
        s+=box(x,y,24,28,f,sk,{rx:5,dash,sw:i===cur?2.2:1.5});
        if(lab)s+=T(x+12,y+19,lab,'font-size:11px;font-weight:700;fill:'+(lab==='2 s'?'var(--no)':'var(--h3)')+';text-anchor:middle');}
      s+='<rect x="'+(30+S0*27-2.5)+'" y="'+(y-3)+'" width="3" height="34" rx="1.5" style="fill:var(--ok-strong)"/>';
      const m=own[p];s+='<line x1="220" y1="'+(y+14)+'" x2="238" y2="'+R1(my(m)+mh/2)+'" style="stroke:var(--muted);stroke-width:1.4"/>';}
    for(let m=0;m<n;m++){const y=my(m),dead=st.crash&&m===1,mine=[0,1,2,3].filter(p=>own[p]===m),idle=!dead&&!mine.length;
      const col=dead?'var(--no)':idle?'var(--muted)':'var(--h2)';
      s+=box(240,y,76,mh,dead?'var(--no-bg)':idle?'var(--soft)':'var(--h2-bg)',dead?'var(--no)':idle?'var(--line2)':'',{rx:8,dash:dead||idle?'4 3':''});
      s+=T(278,R1(y+mh/2+4),'M'+(m+1)+' · '+(dead?'down':idle?'idle':mine.map(p=>'P'+p).join(',')),'font-size:11.5px;font-weight:700;fill:'+col+';text-anchor:middle');}
    L.$('#o23f').innerHTML=s+'</svg>';
    L.$('#o23m-v').textContent=n;L.$('#o23k-v').textContent=st.k;
    const x=L.$('#o23x');x.disabled=n<2;x.innerHTML=n<2?L.ic('alert')+'Crash M2 (needs 2)':st.crash?L.ic('cycle')+'Restart M2':L.ic('alert')+'Crash M2';
    L.$('#o23s').innerHTML=L.ic('clock')+(st.slow?'Make P1 fast again':'Slow label in P1');
    const alive=n-(st.crash&&n>=2?1:0),working=Math.min(alive,4),twice=orphan.length*st.k,wait=st.slow?6-(orphan.includes(1)?S0:r):0;
    L.$('#o23r').innerHTML='<div class="es-tbl"><span>'+L.ic('people')+'</span><span>Machines doing work</span><b class="'+(working<alive?'no-t':'')+'">'+working+' of '+alive+'</b>'+
      '<span>'+L.ic('cycle')+'</span><span>Messages processed twice</span><b class="'+(twice?'no-t':'')+'">'+twice+'</b>'+
      '<span>'+L.ic('clock')+'</span><span>Stuck behind P1’s slow label</span><b class="'+(wait?'no-t':'')+'">'+(st.slow?wait:'none')+'</b></div>'+
      '<div class="small" style="margin-top:6px">'+(st.crash&&n>=2?(orphan.length?'M2’s '+orphan.map(p=>'P'+p).join(' and ')+' restart from the saved offset (5,100), so '+st.k+' message'+(st.k===1?'':'s')+' each, up to 5,'+(100+st.k)+', run again.':'M2 had no partition, so nothing is redone.'):working<alive?'Only one machine per partition: the rest sit idle.':'Each machine reads its partitions one message at a time.')+'</div>';
    const tick=b=>b?'<b class="ok-t">✓</b>':'○';
    L.$('#o23h').innerHTML=tick(seen.many)+' more than 4 machines · '+tick(seen.crash)+' crash M2 · '+tick(seen.slow)+' slow label';
    if(seen.many&&seen.crash&&seen.slow&&!L.$('#o23ok')){L.$('#o23h').insertAdjacentHTML('beforeend','<span id="o23ok"></span>');
      L.sheet('info','Whole partitions, saved offsets','At most <b>one machine per partition</b>: more parallelism needs more partitions. After a crash, the next machine starts at the <b>saved offset</b>, so anything read since then is processed twice; a database follower reconnects by log position the same way. One slow message holds up its partition: '+L.g('head-of-line','head-of-line blocking')+'. In return, one machine reads each partition in order, so if every scan of a parcel lands in the same partition, its scans stay in order.');L.done();}
  }
  L.$('#o23m').oninput=()=>{st.n=+L.$('#o23m').value;if(st.n>4)seen.many=true;if(st.n<2)st.crash=false;draw();};
  L.$('#o23k').oninput=()=>{st.k=+L.$('#o23k').value;draw();};
  L.$('#o23x').onclick=()=>{if(st.n<2)return;st.crash=!st.crash;if(st.crash)seen.crash=true;draw();};
  L.$('#o23s').onclick=()=>{st.slow=!st.slow;if(st.slow)seen.slow=true;draw();};
  draw();}},
{part:3,src:'Chapter 11 · When consumers cannot keep up',
 solve:async L=>{const b=L.$('#e24c').children;for(const k of [0,1,2]){b[k].click();await waitFor(L,'#e24d'+k,3000);}},
 run(L){
  const PRE=[
   ['One slow consumer',{caps:[300,200,80]},12,'Billing reads 80k an hour but 100k arrive, so it falls further behind every hour. Notifications and the ETA model don’t notice. Watch each consumer’s lag and alert: the ring is big, so someone has time to fix it.'],
   ['Consumer shut down',{caps:[300,0,125]},12,'A stopped consumer costs nothing but its saved offset. In a classic broker, a queue whose consumer is gone keeps filling and takes memory from the others, so you must remember to delete it.'],
   ['Replay yesterday',{caps:[300,200,150]},12,'Billing jumped back 24 hours and re-reads the day. Reading deletes nothing, so a copy of a consumer can reprocess old messages into a new table, as often as needed. A classic broker can’t: acknowledged messages are gone.'],
   ['Peak Week ×3',{mult:3,caps:[300,200,125]},12,'The disk didn’t shrink, but at three times the rate it holds a third of the hours: 24 instead of 72. Consumers slower than the new rate now fall behind, with less time to spare.'],
   ['Stopped at Peak',{mult:3,caps:[300,200,0]},24,'Billing fell more than a whole ring behind. The segments it needed were deleted, so it lost those scans. Only billing is affected.']];
  const seen=new Set();
  L.h(L.kick('pr','Edge cases')+'<h1 class="q">Push the log to its limits. Try at least three presets.</h1>'+CSS+'<div class="es-row" id="e24c"></div><div class="fb info" id="e24t" style="margin-bottom:6px">Pick a preset.</div><div id="e24"></div>');
  const rg=Ring(L,L.$('#e24'),{id:'e24',cons:RING_CONS,sliders:false,auto:false});
  PRE.forEach((p,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=p[0];
    b.onclick=async()=>{if(rg.S.busy)return;[...L.$('#e24c').children].forEach(x=>x.classList.toggle('sel',x===b));
      rg.reset(Object.assign({lags:[.3,1,4]},p[1]));if(j===2)rg.rewind(2,24);L.$('#e24t').innerHTML=p[3];
      await rg.skip(p[2]);if(!rg.alive())return;seen.add(j);L.$('#e24t').insertAdjacentHTML('beforeend','<span id="e24d'+j+'"></span>');
      if(seen.size>=3&&!L.$('#e24ok')){L.$('#e24c').insertAdjacentHTML('beforeend','<span id="e24ok"></span>');L.done();}};
    L.$('#e24c').appendChild(b);});}},
{part:3,src:'Chapter 11 · Logs compared to traditional messaging',pts:1,
 solve:async L=>{setRange(L,'c25p',6);setRange(L,'c25h',36);L.$('#c25go').click();await waitFor(L,'#c25ok',5000);},
 run(L){
  const ARR=300,PER=70,MACH=6,BUDGET=48;let graded=false,busy=false;
  L.h(L.kick('pr','Challenge')+'<h1 class="q">Plan the log for Peak Week: 300k scans an hour. Six ETA machines read 70k an hour each. Linh must be able to replay yesterday; the disks hold 48 hours.</h1>'+CSS+
   rng('c25p','Partitions',1,8,3)+rng('c25h','Keep scans for',6,96,12,6)+'<div class="es-read" id="c25r"></div>'+
   '<button class="btn pri" id="c25go">'+L.ic('play')+'Run a Peak Week day</button><div class="es-fig" id="c25f" style="margin-top:8px"></div><ul class="es-res" id="c25s"></ul><p class="es-foot">Numbers are illustrative.</p>');
  const P=()=>+L.$('#c25p').value,H=()=>+L.$('#c25h').value;
  function rings(t){const p=P(),h=H(),arr=ARR/p,cap=PER*Math.min(p,MACH)/p,grow=Math.max(0,arr-cap),lagH=grow*t/arr;
    let s='<svg viewBox="0 0 320 '+(p>4?186:100)+'" role="img" aria-label="'+p+' small rings, one per partition, each showing how far the ETA model is behind.">';
    for(let k=0;k<p;k++){const cx=42+(k%4)*78,cy=46+Math.floor(k/4)*86,lost=lagH>h,fr=Math.min(1,lagH/h);
      s+='<circle cx="'+cx+'" cy="'+cy+'" r="28" style="fill:none;stroke:'+(lost?'var(--no-bg)':'var(--soft2)')+';stroke-width:10"/>';
      if(fr>.004)s+='<path d="'+arc(cx,cy,28,360-fr*360,360)+'" style="fill:none;stroke:var(--no);stroke-width:10;opacity:.6"/>';
      s+='<line x1="'+cx+'" y1="'+(cy-36)+'" x2="'+cx+'" y2="'+(cy-20)+'" style="stroke:var(--h3);stroke-width:3.5;stroke-linecap:round"/>';
      const hp=pol(cx,cy,28,360-fr*360).split(' ');s+='<circle cx="'+hp[0]+'" cy="'+hp[1]+'" r="6" style="fill:var(--h2);stroke:var(--card);stroke-width:2"/>';
      s+=T(cx,cy+4,'P'+k,'font-size:12px;font-weight:700;fill:var(--ink);text-anchor:middle');
      s+=T(cx,cy+46,lagH<.05?'up to date':R1(lagH)+' h behind','font-size:11px;font-weight:600;fill:'+(lagH<.05?'var(--ok)':'var(--no)')+';text-anchor:middle');}
    L.$('#c25f').innerHTML=s+'</svg>';return {lagH,grow};}
  function info(){const p=P(),h=H(),busyM=Math.min(p,MACH);L.$('#c25p-v').textContent=p;L.$('#c25h-v').textContent=h+' h';
    L.$('#c25r').innerHTML='<div class="es-tbl"><span>'+L.ic('people')+'</span><span>ETA machines with a partition</span><b>'+busyM+' of '+MACH+'</b>'+
      '<span>'+L.ic('layers')+'</span><span>Disk used</span><b class="'+(h>BUDGET?'no-t':'')+'">'+h+' of '+BUDGET+' h</b></div>'+
      '<div class="es-meter" aria-hidden="true"><i style="width:'+Math.min(100,h/96*100)+'%;background:'+(h>BUDGET?'var(--no-strong)':'var(--h2)')+'"></i><span style="position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--ink)"></span></div>';
    rings(0);L.$('#c25s').innerHTML='';}
  L.$('#c25p').oninput=info;L.$('#c25h').oninput=info;info();
  L.$('#c25go').onclick=async()=>{if(busy)return;busy=true;let r;for(let t=1;t<=24;t++){if(!L.$('#c25f'))return;r=rings(t);await L.sleep(60);}busy=false;
    const p=P(),h=H(),a=r.grow===0,b=h>=24,c=h<=BUDGET,ok=a&&b&&c;
    const li=(g,t)=>'<li><span class="'+(g?'ok-t':'no-t')+'">'+L.ic(g?'check':'x')+'</span><span>'+t+'</span></li>';
    L.$('#c25s').innerHTML=li(a,a?'The ETA model keeps up: lag stays near zero.':'The ETA model falls behind: '+Math.min(p,MACH)+' machines read '+(Math.min(p,MACH)*PER)+'k an hour, but 300k arrive. At most one machine per partition.')+
      li(b,b?'Yesterday’s scans are still there to replay.':'Only '+h+' hours are kept, so part of yesterday is already deleted.')+
      li(c,c?'It fits on the disks.':'Keeping '+h+' hours needs more disk than the 48 hours there is.');
    if(!graded){graded=true;L.award(ok);}
    if(ok){L.$('#c25s').insertAdjacentHTML('beforeend','<span id="c25ok"></span>');L.sheet('ok','Peak Week is covered','At least 5 partitions let 5 or more ETA machines work in parallel (5 × 70k = 350k an hour), and keeping 24 to 48 hours lets Linh replay yesterday without running out of disk.');L.done();}
    else L.sheet('no','Not yet','Adjust the sliders and run the day again.');};}},
{part:3,src:'Chapter 11 · Replaying old messages',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Classic queue or log?',['Classic JMS/AMQP queue','Log-based broker'],[
   ['A new analytics consumer must read the last week of scans, not just new ones.',1,'A log keeps messages on disk, so a new consumer can start from an old offset. A classic queue only delivers what’s sent after it subscribes.'],
   ['Each message is a slow, independent job: render a two-second PDF shipping label.',0,'Slow, independent tasks suit a classic queue: any free worker takes the next message, and one slow label doesn’t hold up a whole partition.'],
   ['Tens of millions of GPS pings a day, each handled very quickly, and each courier’s pings must stay in order.',1,'High throughput, quick messages and ordering are where logs shine.'],
   ['After a bug, Linh wants to reprocess yesterday’s messages with fixed code.',1,'Reading a log is non-destructive, so you can move the offset back and replay.'],
   ['A task queue where nobody ever needs to go back and reread old messages, and order doesn’t matter.',0,'When messages are expensive to process one by one and order doesn’t matter much, the classic broker fits.']]);}}
  ]
});
</script>
