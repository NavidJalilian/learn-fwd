<script>
/* =====================================================================
   Lesson 0028 only. Two hands-on models used across the lesson:
   1. Tank – a classic broker’s queue as a tank: producers pour in,
             workers drain it, and a policy decides what happens when
             it fills (drop, buffer in memory, buffer on disk, backpressure).
   2. Ring – one partition of Otterpost’s event log as a ring buffer on
             disk: a write head adds scans, consumers are read heads at
             their own offsets, and a head that is lapped loses events.
   ===================================================================== */
const CSS='<style>'+
 '.es-fig svg{width:100%;display:block}.es-fig svg text{font-family:var(--sans)}'+
 '.es-cap{font-size:15.5px;line-height:1.5;margin:10px 0 4px}'+
 '.es-foot{font-size:13px;color:var(--muted);line-height:1.45;margin:6px 0 0}'+
 '.es-row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.es-row .chip{margin:0;min-height:40px}.es-row .btn{min-height:42px;padding:8px 12px;flex:0 0 auto}'+
 '.es-rng{display:grid;grid-template-columns:112px 1fr 70px;gap:8px;align-items:center;font-size:14.5px;margin:2px 0}.es-rng input{width:100%;accent-color:var(--pri);height:32px;margin:0}.es-rng b{text-align:right;font-variant-numeric:tabular-nums;font-size:14px}'+

 '.es-q .n{flex:none;width:28px;height:28px;border-radius:99px;background:var(--h3-bg);color:var(--h3);font-weight:700;display:flex;align-items:center;justify-content:center}'+

 '.es-phone .chip{margin:3px 4px 3px 0}'+
 '.es-tbl{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;font-size:14px;align-items:center}.es-tbl .d{width:12px;height:12px;border-radius:99px;display:inline-block}'+
 '.es-meter{height:10px;border-radius:99px;background:var(--line);overflow:hidden;position:relative;margin:4px 0}.es-meter i{display:block;height:100%;border-radius:99px}'+
 '.es-res{list-style:none;padding:0;margin:8px 0}.es-res li{display:flex;gap:8px;align-items:flex-start;font-size:14.5px;line-height:1.4;margin:5px 0}'+
 '.ok-t{color:var(--ok);font-weight:700}.no-t{color:var(--no);font-weight:700}'+
 '@keyframes es-flow{to{stroke-dashoffset:-24}}@keyframes es-drop{0%{transform:translateY(0);opacity:1}100%{transform:translateY(34px);opacity:0}}'+
 '.es-drip{animation:es-drop .6s linear infinite}'+
 '</style>';

/* ---------- small shared helpers (this lesson only) ---------- */
const T=(x,y,s,st)=>'<text x="'+x+'" y="'+y+'" style="'+st+'">'+s+'</text>';
const R1=n=>Math.round(n*10)/10;
const fmt=n=>Math.round(n).toLocaleString('en-US');
/* scans are counted in thousands (k) */
const fk=k=>k>=1000?(Math.round(k/100)/10)+' M':Math.round(k)+'k';
function pol(cx,cy,r,a){const t=(a-90)*Math.PI/180;return R1(cx+r*Math.cos(t))+' '+R1(cy+r*Math.sin(t));}
function sector(cx,cy,r1,r2,a0,a1){if(a1-a0>=359.9)a1=a0+359.9;const lg=a1-a0>180?1:0;
  return 'M'+pol(cx,cy,r2,a0)+'A'+r2+' '+r2+' 0 '+lg+' 1 '+pol(cx,cy,r2,a1)+'L'+pol(cx,cy,r1,a1)+'A'+r1+' '+r1+' 0 '+lg+' 0 '+pol(cx,cy,r1,a0)+'Z';}
function arc(cx,cy,r,a0,a1){if(a1-a0>=359.9)a1=a0+359.9;if(a1-a0<0.8)return '';const lg=a1-a0>180?1:0;return 'M'+pol(cx,cy,r,a0)+'A'+r+' '+r+' 0 '+lg+' 1 '+pol(cx,cy,r,a1);}
function rng(id,label,min,max,val,step){return '<label class="es-rng"><span>'+label+'</span><input type="range" id="'+id+'" min="'+min+'" max="'+max+'" step="'+(step||1)+'" value="'+val+'"><b id="'+id+'-v"></b></label>';}
function setRange(L,id,v){const e=L.$('#'+id);e.value=v;e.dispatchEvent(new Event('input',{bubbles:true}));}
async function waitFor(L,sel,ms){for(let i=0;i<(ms||4000)/30&&!L.$(sel);i++)await L.sleep(30);}
function chips(L,host,items,onPick,sel){host.innerHTML='';items.forEach((it,j)=>{const b=document.createElement('button');b.className='chip'+(j===sel?' sel':'');b.innerHTML=it;b.onclick=()=>{[...host.children].forEach(x=>x.classList.toggle('sel',x===b));onPick(j,b);};host.appendChild(b);});}
const box=(x,y,w,h,f,s,extra)=>'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+(extra&&extra.rx!=null?extra.rx:10)+'" style="fill:'+f+(s?';stroke:'+s+';stroke-width:'+((extra&&extra.sw)||1.5):'')+(extra&&extra.dash?';stroke-dasharray:'+extra.dash:'')+'"/>';
const arrowDefs='<defs><marker id="es-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--muted)"/></marker></defs>';
const line=(x1,y1,x2,y2,col,extra)=>'<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" style="stroke:'+(col||'var(--muted)')+';stroke-width:'+((extra&&extra.sw)||1.6)+(extra&&extra.dash?';stroke-dasharray:'+extra.dash:'')+'"'+(extra&&extra.noArrow?'':' marker-end="url(#es-ah)"')+'/>';

/* ---------- Figure: bounded vs unbounded input ---------- */
let seedB=5;const rndB=()=>(seedB=seedB*16807%2147483647)/2147483647;
const SCANS_B=[...Array(46)].map(()=>rndB()*60).sort((a,b)=>a-b);
function figBound(mode){
  const X=h=>R1(12+h*4.75);
  let s='<svg viewBox="0 0 320 178" role="img" aria-label="Top: a file with a clear end. Bottom: a timeline of scans that keeps going, with output marks for the chosen processing style.">'+arrowDefs;
  s+=T(4,14,'Batch input: bounded','font-size:12px;font-weight:700;fill:var(--muted)');
  s+=box(4,22,176,30,'var(--soft2)','var(--line2)',{rx:6});
  for(let k=0;k<14;k++)s+='<rect x="'+(10+k*12)+'" y="29" width="7" height="16" rx="2" style="fill:var(--h1);opacity:.55"/>';
  s+=box(182,20,34,34,'var(--h4-bg)','var(--h4)',{rx:6})+T(199,41,'END','font-size:11px;font-weight:700;fill:var(--h4);text-anchor:middle');
  s+=line(220,37,246,37)+box(248,22,68,30,'var(--ok-bg)','var(--ok-line)',{rx:6})+T(282,41,'sort, output','font-size:11px;font-weight:600;fill:var(--ok);text-anchor:middle');
  s+=T(4,82,'Otterpost’s scans: unbounded','font-size:12px;font-weight:700;fill:var(--muted)');
  s+='<line x1="8" y1="118" x2="300" y2="118" style="stroke:var(--line2);stroke-width:2"/>'+T(304,122,'…','font-size:16px;font-weight:700;fill:var(--muted)');
  [0,24,48].forEach((h,j)=>{s+='<line x1="'+X(h)+'" y1="112" x2="'+X(h)+'" y2="124" style="stroke:var(--line2);stroke-width:1.5"/>'+T(X(h)+3,138,['Mon','Tue','Wed'][j],'font-size:11px;fill:var(--muted)');});
  SCANS_B.forEach(t=>{s+='<circle cx="'+X(t)+'" cy="104" r="3.2" style="fill:var(--h2)"/>';});
  const out=[];
  if(mode===0)out.push(24,48);else if(mode===1){for(let h=1;h<=60;h++)out.push(h);}else SCANS_B.forEach(t=>out.push(t+0.15));
  out.forEach(h=>{if(h>60)return;const x=X(h);s+=mode===0?'<path d="M'+x+' 142l6 7l-6 7l-6 -7z" style="fill:var(--h3)"/>':'<line x1="'+x+'" y1="144" x2="'+x+'" y2="'+(mode===1?154:156)+'" style="stroke:var(--h3);stroke-width:'+(mode===1?1.6:1.4)+'"/>';});
  s+=T(4,174,['Output nightly: a scan waits up to a day','Output hourly: a scan waits up to an hour','Each scan is handled as it arrives'][mode],'font-size:12px;font-weight:600;fill:var(--h3)');
  return s+'</svg>';
}

/* ---------- Figure: event, producer, topic, consumers ---------- */
function figEvent(){
  let s='<svg viewBox="0 0 320 216" role="img" aria-label="The courier app produces an event into the parcel-scans topic, which three consumers read. Below, the event card with its fields.">'+arrowDefs;
  s+=box(4,16,84,46,'var(--h1-bg)')+T(46,36,'Courier app','font-size:12.5px;font-weight:700;fill:var(--h1);text-anchor:middle')+T(46,52,'producer','font-size:11px;fill:var(--h1);text-anchor:middle');
  s+=line(90,39,112,39);
  s+=box(114,20,94,38,'var(--soft2)','var(--line2)',{rx:19})+T(161,37,'parcel-scans','font-size:12px;font-weight:700;fill:var(--ink);text-anchor:middle')+T(161,51,'topic','font-size:11px;fill:var(--muted);text-anchor:middle');
  ['Notifications','ETA model','Billing'].forEach((n,j)=>{const y=6+j*30;s+=line(209,39,230,y+13)+box(232,y,84,26,'var(--h2-bg)','',{rx:8})+T(274,y+17,n,'font-size:11.5px;font-weight:600;fill:var(--h2);text-anchor:middle');});
  s+=T(274,106,'consumers','font-size:11px;fill:var(--muted);text-anchor:middle');

  s+=box(36,112,250,100,'var(--card)','var(--h3)',{rx:12});
  s+='<path d="M36 136V124a12 12 0 0 1 12 -12h226a12 12 0 0 1 12 12v12z" style="fill:var(--h3-bg)"/>';
  s+=T(50,129,'EVENT','font-size:11.5px;font-weight:700;letter-spacing:.08em;fill:var(--h3)')+T(272,129,'never changes','font-size:11.5px;font-weight:600;fill:var(--h3);text-anchor:end');
  [['parcel','OP-48213'],['what','scanned at a hub'],['where','Westport North'],['when','09:14:07 (timestamp)']].forEach((f,j)=>{const y=155+j*16;s+=T(50,y,f[0],'font-size:12px;fill:var(--muted)')+T(104,y,f[1],'font-size:12.5px;font-weight:600;fill:var(--ink)');});
  return s+'</svg>';
}

  s+=T(58,14,'Pipe or TCP','font-size:12px;font-weight:700;fill:var(--muted);text-anchor:middle');

  s+=line(56,66,66,66)+box(68,50,50,32,'var(--h2-bg)','',{rx:8})+T(93,70,'receiver','font-size:11px;font-weight:600;fill:var(--h2);text-anchor:middle');
  s+=T(60,136,'1 → 1','font-size:15px;font-weight:700;fill:var(--ink);text-anchor:middle');

  s+=box(218,48,40,28,'var(--soft2)','var(--line2)',{rx:14})+T(238,66,'topic','font-size:11px;font-weight:700;fill:var(--ink);text-anchor:middle');
  ['Notify','ETA','Billing'].forEach((n,j)=>{const y=26+j*32;s+=line(259,62,268,y+12)+box(270,y,46,24,'var(--h2-bg)','',{rx:7})+T(293,y+16,n,'font-size:11px;font-weight:600;fill:var(--h2);text-anchor:middle');});

/* ---------- Tank: a classic broker queue ---------- */
function Tank(L,host,o){
  o=Object.assign({id:'tk',inR:40,outR:20,pol:'mem',auto:true,controls:true,on:()=>{}},o||{});
  const ID=o.id,SMALL=20,MEM=200,DISK=1000,TX=124,TY=74,TW=80,TH=112;
  const S={in:o.inR,out:o.outR,pol:o.pol,q:0,lost:0,held:0,acc:0,srv:0,crash:0,crashTxt:'',dropping:false};
  const POL=[['drop','Drop'],['mem','Buffer in memory'],['disk','Buffer on disk'],['back','Backpressure']];
  host.insertAdjacentHTML('beforeend','<div class="es-fig"><svg id="'+ID+'-svg" viewBox="0 0 320 206" role="img" aria-label="A tank: producers pour messages in at the top left, workers drain them at the bottom right. The water level is the queue."></svg></div>'+
    (o.controls?'<div class="es-lbl">When the queue fills up, the broker will…</div><div class="es-row" id="'+ID+'-p"></div>'+rng(ID+'-in','Producers send',10,60,S.in,5)+rng(ID+'-out','Workers handle',10,60,S.out,5)+
      '<div class="es-row"><button class="btn" id="'+ID+'-cr">'+L.ic('alert')+'Crash the broker</button><button class="btn" id="'+ID+'-rs">'+L.ic('cycle')+'Empty it</button></div>':'')+
    '<div class="es-read" id="'+ID+'-rd" aria-live="polite"></div>');
  const $=s=>host.querySelector(s),svg=$('#'+ID+'-svg');
  /* static parts once, dynamic parts by id */
  let s='';
  s+=box(4,18,92,50,'var(--h1-bg)')+T(50,38,'Producers','font-size:12.5px;font-weight:700;fill:var(--h1);text-anchor:middle')+'<text id="'+ID+'-pin" x="50" y="56" style="font-size:12px;fill:var(--h1);text-anchor:middle"></text>';
  s+='<path d="M96 43H164V'+TY+'" style="fill:none;stroke:var(--line2);stroke-width:9;stroke-linejoin:round"/>';
  s+='<path id="'+ID+'-fi" d="M96 43H164V'+TY+'" style="fill:none;stroke:var(--pri);stroke-width:3;stroke-dasharray:4 8;animation:es-flow .5s linear infinite"/>';
  s+='<path d="M'+(TX+TW)+' '+(TY+TH-14)+'H236" style="fill:none;stroke:var(--line2);stroke-width:9"/>';
  s+='<path id="'+ID+'-fo" d="M'+(TX+TW)+' '+(TY+TH-14)+'H236" style="fill:none;stroke:var(--ok-strong);stroke-width:3;stroke-dasharray:4 8;animation:es-flow .5s linear infinite"/>';
  s+=box(232,146,84,50,'var(--h2-bg)')+T(274,166,'Workers','font-size:12.5px;font-weight:700;fill:var(--h2);text-anchor:middle')+'<text id="'+ID+'-pout" x="274" y="184" style="font-size:12px;fill:var(--h2);text-anchor:middle"></text>';
  s+='<rect x="'+TX+'" y="'+TY+'" width="'+TW+'" height="'+TH+'" rx="6" style="fill:var(--card);stroke:var(--line2);stroke-width:2"/>';
  s+='<rect id="'+ID+'-lvA" x="'+(TX+2)+'" width="'+(TW-4)+'" rx="4" style="fill:var(--h2-bg);stroke:var(--h2);stroke-width:1"/>';
  s+='<rect id="'+ID+'-lvB" x="'+(TX+2)+'" width="'+(TW-4)+'" rx="4" style="fill:var(--h3-bg);stroke:var(--h3);stroke-width:1"/>';
  s+='<line id="'+ID+'-ml" x1="'+(TX-4)+'" x2="'+(TX+TW+4)+'" style="stroke:var(--h3);stroke-width:1.5;stroke-dasharray:4 3"/>';
  s+='<text id="'+ID+'-qt" x="'+(TX+TW/2)+'" style="font-size:12.5px;font-weight:700;fill:var(--ink);text-anchor:middle"></text>';
  s+='<text id="'+ID+'-l1" x="'+(TX-6)+'" style="font-size:11px;font-weight:600;text-anchor:end"></text><text id="'+ID+'-l2" x="'+(TX-6)+'" style="font-size:11px;font-weight:600;text-anchor:end"></text>';
  s+='<g id="'+ID+'-va"><circle cx="130" cy="43" r="10" style="fill:var(--no-bg);stroke:var(--no);stroke-width:2"/><path d="M125 43h10" style="stroke:var(--no);stroke-width:3;stroke-linecap:round"/>'+T(130,66,'wait','font-size:11px;font-weight:700;fill:var(--no);text-anchor:middle')+'</g>';
  s+='<g id="'+ID+'-sp">'+[0,1,2].map(k=>'<circle class="es-drip" cx="'+(TX+TW+8+k*7)+'" cy="'+(TY+4)+'" r="3" style="fill:var(--no);animation-delay:'+(k*.2)+'s"/>').join('')+T(TX+TW+6,TY+50,'dropped','font-size:11px;font-weight:700;fill:var(--no)')+'</g>';
  s+='<g id="'+ID+'-x"><rect x="'+(TX-2)+'" y="'+(TY-2)+'" width="'+(TW+4)+'" height="'+(TH+4)+'" rx="8" style="fill:var(--no-bg);stroke:var(--no);stroke-width:2"/><text id="'+ID+'-x1" x="'+(TX+TW/2)+'" y="'+(TY+46)+'" style="font-size:12.5px;font-weight:700;fill:var(--no);text-anchor:middle"></text><text id="'+ID+'-x2" x="'+(TX+TW/2)+'" y="'+(TY+64)+'" style="font-size:12px;fill:var(--no);text-anchor:middle"></text></g>';
  svg.innerHTML=s;
  const E=id=>svg.querySelector('#'+ID+'-'+id);
  const show=(id,on)=>{E(id).style.display=on?'':'none';};
  const cap=()=>S.pol==='drop'||S.pol==='back'?SMALL:S.pol==='mem'?MEM:DISK;
  const dur=r=>r>0?(Math.max(.18,6/r)).toFixed(2)+'s':'0s';
  function draw(){
    if(!svg.isConnected)return;
    const c=cap(),bottom=TY+TH-2,full=TH-4;
    const memQ=S.pol==='disk'?Math.min(S.q,MEM):Math.min(S.q,c),diskQ=S.pol==='disk'?Math.max(0,Math.min(S.q,DISK)-MEM):0;
    const hA=full*memQ/c,hB=full*diskQ/c;
    E('lvA').setAttribute('y',R1(bottom-hA));E('lvA').setAttribute('height',R1(Math.max(0,hA)));
    E('lvB').setAttribute('y',R1(bottom-hA-hB));E('lvB').setAttribute('height',R1(Math.max(0,hB)));
    const my=R1(bottom-full*MEM/DISK);E('ml').setAttribute('y1',my);E('ml').setAttribute('y2',my);show('ml',S.pol==='disk');
    E('qt').setAttribute('y',R1(Math.max(TY+18,Math.min(TY+TH-8,bottom-hA-hB-6))));
    E('qt').textContent=(S.q>=DISK&&S.pol==='disk'?'1,000+':fmt(S.q))+' queued';
    const l1=E('l1'),l2=E('l2');
    if(S.pol==='disk'){l1.setAttribute('y',R1((TY+my)/2+4));l1.textContent='on disk';l1.style.fill='var(--h3)';l2.setAttribute('y',R1((my+bottom)/2+4));l2.textContent='in memory';l2.style.fill='var(--h2)';}
    else if(S.pol==='mem'){l1.setAttribute('y',TY+12);l1.textContent='full =';l1.style.fill='var(--no)';l2.setAttribute('y',TY+26);l2.textContent='crash';l2.style.fill='var(--no)';}
    else{l1.setAttribute('y',TY+12);l1.textContent='small';l1.style.fill='var(--muted)';l2.setAttribute('y',TY+26);l2.textContent='buffer';l2.style.fill='var(--muted)';}
    E('pin').textContent=S.in+' msg/s'+(S.pol==='back'&&S.held>0.5?' → '+Math.round(S.acc):'');
    E('pout').textContent=Math.round(S.out*(S.pol==='disk'&&S.q>MEM?.6:1))+' msg/s';
    E('fi').style.animationDuration=dur(S.crash?0:S.acc||S.in);E('fi').style.opacity=S.crash?0:1;
    E('fo').style.animationDuration=dur(S.srv);E('fo').style.opacity=S.srv>0?1:0;
    show('va',S.pol==='back'&&S.held>0.5&&!S.crash);show('sp',S.pol==='drop'&&S.dropping&&!S.crash);show('x',S.crash>0);
    E('x1').textContent=S.crashTxt;E('x2').textContent=S.crashSub||'';
    const delay=S.out?S.q/S.out:0;
    $('#'+ID+'-rd').innerHTML='<div class="es-tbl"><span>'+L.ic('x')+'</span><span>Messages lost</span><b class="'+(S.lost?'no-t':'')+'">'+fmt(S.lost)+'</b>'+
      '<span>'+L.ic('clock')+'</span><span>Wait in the queue</span><b>'+(delay<1?'none':'≈ '+Math.round(delay)+' s')+'</b>'+
      '<span>'+L.ic('lock')+'</span><span>Producers held back</span><b class="'+(S.held>0.5?'no-t':'')+'">'+(S.held>0.5?Math.round(S.held/S.in*100)+'%':'no')+'</b></div>';
  }
  function crash(reason){
    const lostNow=S.pol==='disk'?0:Math.round(S.q);S.lost+=lostNow;if(S.pol!=='disk')S.q=0;S.crash=6;
    S.crashTxt=reason||'Crashed!';S.crashSub=S.pol==='disk'?'nothing lost':fmt(lostNow)+' lost';S.acc=0;S.srv=0;draw();o.on({type:'crash',lost:lostNow});
  }
  function step(){
    if(S.crash>0){S.crash--;S.acc=0;S.srv=0;draw();return;}
    const outCap=S.out*(S.pol==='disk'&&S.q>MEM?.6:1);
    let acc=S.in;
    if(S.pol==='back'){acc=Math.min(S.in,Math.max(0,SMALL-S.q+outCap));S.held=S.in-acc;}else S.held=0;
    S.q+=acc;const srv=Math.min(S.q,outCap);S.q-=srv;S.acc=acc;S.srv=srv;S.dropping=false;
    if(S.pol==='drop'&&S.q>SMALL){S.lost+=S.q-SMALL;S.q=SMALL;S.dropping=true;}
    if(S.pol==='mem'&&S.q>MEM){crash('Out of memory');return;}
    draw();o.on({type:'tick'});
  }
  function setPol(p){S.pol=p;S.q=Math.min(S.q,p==='drop'||p==='back'?SMALL:S.q);S.crash=0;draw();o.on({type:'pol',pol:p});}
  if(o.controls){
    chips(L,$('#'+ID+'-p'),POL.map(p=>p[1]),j=>setPol(POL[j][0]),POL.findIndex(p=>p[0]===S.pol));
    const upd=()=>{S.in=+$('#'+ID+'-in').value;S.out=+$('#'+ID+'-out').value;$('#'+ID+'-in-v').textContent=S.in+'/s';$('#'+ID+'-out-v').textContent=S.out+'/s';draw();o.on({type:'rate'});};
    $('#'+ID+'-in').oninput=upd;$('#'+ID+'-out').oninput=upd;upd();
    $('#'+ID+'-cr').onclick=()=>crash('Broker crashed');
    $('#'+ID+'-rs').onclick=()=>{S.q=0;S.lost=0;S.crash=0;S.held=0;draw();};
  }
  draw();
  if(o.auto){const tm=setInterval(()=>{if(!svg.isConnected){clearInterval(tm);return;}step();},200);}
  async function run(n,ms){for(let k=0;k<n;k++){if(!svg.isConnected)return false;step();await L.sleep(ms||170);}return svg.isConnected;}
  return {S,draw,step,crash,setPol,run,alive:()=>svg.isConnected,reset(){S.q=0;S.lost=0;S.crash=0;S.held=0;S.acc=0;S.srv=0;draw();}};
}

/* ---------- Ring: one partition of the event log on disk ---------- */
const R0=100; /* normal Otterpost rate: 100k scans an hour (illustrative) */
function Ring(L,host,o){
  o=Object.assign({id:'rg',hours:72,mult:1,auto:true,sliders:true,on:()=>{}},o||{});
  const ID=o.id,C=o.hours*R0,cx=160,cy=116,RI=76,RO=100;
  const S={w:0,mult:o.mult,clock:56,play:o.auto,busy:false,cons:[]};
  function reset(cfg){cfg=cfg||{};S.mult=cfg.mult||o.mult;S.w=3.4*C;S.clock=56;
    S.cons=o.cons.map((c,i)=>({name:c.name,ab:c.ab,col:c.col,cap:(cfg.caps&&cfg.caps[i]!=null)?cfg.caps[i]:c.cap,c:0,missed:0,flash:0}));
    S.cons.forEach((c,i)=>{const lag=(cfg.lags&&cfg.lags[i]!=null)?cfg.lags[i]:o.cons[i].lag;c.c=S.w-lag*R0*S.mult;});}
  reset();
  host.insertAdjacentHTML('beforeend','<div class="es-fig"><svg id="'+ID+'-svg" viewBox="0 0 320 228" style="touch-action:none" role="img" aria-label="A ring of 12 disk segments. The amber line is where new scans are written; each coloured dot is a consumer’s offset, with an arc showing how far behind it is."></svg></div>'+
    '<div class="es-row" id="'+ID+'-ctl"><button class="btn" id="'+ID+'-pp"></button><button class="btn" id="'+ID+'-sk">'+L.ic('clock')+'Skip 12 hours</button></div>'+
    (o.sliders?rng(ID+'-m','New scans',R0,3*R0,S.mult*R0,50)+S.cons.map((c,i)=>rng(ID+'-c'+i,c.name,0,400,c.cap,25)).join(''):'')+
    '<div class="es-read" id="'+ID+'-rd" aria-live="polite"></div>');
  const $=s=>host.querySelector(s),svg=$('#'+ID+'-svg');
  const ang=x=>(((x%C)+C)%C)/C*360;
  function draw(){
    if(!svg.isConnected)return;
    const aw=ang(S.w),ws=Math.floor(aw/30),old=(ws+1)%12;let s='';
    const day=Math.floor(S.clock/24)+1,hr=Math.floor(S.clock%24);
    s+=T(4,16,'Day '+day+', '+String(hr).padStart(2,'0')+':00','font-size:12.5px;font-weight:700;fill:var(--ink)');
    s+=T(316,16,'Partition 0','font-size:12px;font-weight:600;fill:var(--muted);text-anchor:end');
    for(let k=0;k<12;k++){const od=k===old;s+='<path d="'+sector(cx,cy,RI,RO,k*30+.8,k*30+29.2)+'" style="fill:'+(od?'var(--no-bg)':'var(--soft2)')+';stroke:'+(od?'var(--no)':'var(--line2)')+';stroke-width:1.2'+(od?';stroke-dasharray:3 3':'')+'"/>';}
    s+='<path d="'+sector(cx,cy,RI+3,RO-3,ws*30+.8,Math.max(ws*30+1.2,aw))+'" style="fill:var(--h3-bg)"/>';
    S.cons.forEach((c,i)=>{const r=64-12*i,ac=ang(c.c),lag=S.w-c.c,fr=Math.min(1,lag/C);
      s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" style="fill:none;stroke:var(--line);stroke-width:1"/>';
      if(fr>.003)s+='<path d="'+arc(cx,cy,r,ac,ac+fr*360)+'" style="fill:none;stroke:'+c.col+';stroke-width:5;stroke-linecap:round;opacity:.5"/>';});
    s+='<line x1="'+pol(cx,cy,RI-4,aw).replace(' ','" y1="')+'" x2="'+pol(cx,cy,RO+8,aw).replace(' ','" y2="')+'" style="stroke:var(--h3);stroke-width:4;stroke-linecap:round"/>';
    S.cons.forEach((c,i)=>{const r=64-12*i,p=pol(cx,cy,r,ang(c.c)).split(' ');
      s+='<g data-i="'+i+'" style="cursor:grab"><circle cx="'+p[0]+'" cy="'+p[1]+'" r="16" style="fill:transparent"/><circle cx="'+p[0]+'" cy="'+p[1]+'" r="9" style="fill:'+c.col+';stroke:'+(c.flash?'var(--no)':'var(--card)')+';stroke-width:'+(c.flash?3.5:2)+'"/>'+
        T(p[0],R1(+p[1]+4),c.ab,'font-size:11px;font-weight:700;fill:var(--card);text-anchor:middle;pointer-events:none')+'</g>';});
    const kept=C/(R0*S.mult);
    s+=T(cx,cy+2,Math.round(kept)+' h','font-size:15px;font-weight:700;fill:var(--ink);text-anchor:middle')+T(cx,cy+16,'kept','font-size:11px;fill:var(--muted);text-anchor:middle');
    svg.innerHTML=s;
    $('#'+ID+'-pp').innerHTML=S.play?L.ic('clock')+'Pause':L.ic('play')+'Play';
    const rate=R0*S.mult;
    $('#'+ID+'-rd').innerHTML='<div class="small" style="margin-bottom:6px"><span style="display:inline-block;width:14px;height:4px;background:var(--h3);border-radius:2px;vertical-align:middle"></span> new scans written here · <span style="display:inline-block;width:12px;height:10px;border:1.5px dashed var(--no);background:var(--no-bg);vertical-align:middle"></span> oldest segment, deleted next</div>'+
      '<div class="es-tbl">'+S.cons.map(c=>{const lag=S.w-c.c;return '<span class="d" style="background:'+c.col+'"></span><span><b>'+c.name+'</b><br><span class="small">'+(lag<5?'up to date':R1(lag/rate)+' h behind · '+fk(lag)+' scans')+'</span></span><b class="'+(c.missed?'no-t':'ok-t')+'">'+(c.missed?'lost '+fk(c.missed):'lost 0')+'</b>';}).join('')+'</div>';
  }
  function adv(h){const rate=R0*S.mult;S.w+=rate*h;S.clock+=h;
    S.cons.forEach((c,i)=>{c.c=Math.min(S.w,c.c+c.cap*h);if(S.w-c.c>C){c.missed+=S.w-C-c.c;c.c=S.w-C;c.flash=4;o.on({type:'lost',i});}else if(c.flash>0)c.flash--;});}
  async function skip(h){if(S.busy)return;S.busy=true;const n=8;for(let k=0;k<n;k++){adv(h/n);draw();await L.sleep(55);if(!svg.isConnected)return;}S.busy=false;o.on({type:'skip'});}
  $('#'+ID+'-pp').onclick=()=>{S.play=!S.play;draw();};
  $('#'+ID+'-sk').onclick=()=>skip(12);
  if(o.sliders){
    const um=()=>{S.mult=+$('#'+ID+'-m').value/R0;$('#'+ID+'-m-v').textContent=fk(S.mult*R0)+'/h';draw();o.on({type:'rate'});};
    $('#'+ID+'-m').oninput=um;um();
    S.cons.forEach((c,i)=>{const u=()=>{c.cap=+$('#'+ID+'-c'+i).value;$('#'+ID+'-c'+i+'-v').textContent=fk(c.cap)+'/h';draw();o.on({type:'speed',i});};$('#'+ID+'-c'+i).oninput=u;u();});
  }
  /* drag a consumer head round the ring (only within the data still kept) */
  let drag=-1;
  const pt=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());};
  svg.addEventListener('pointerdown',e=>{const g=e.target.closest('g[data-i]');if(!g)return;drag=+g.dataset.i;try{svg.setPointerCapture(e.pointerId);}catch(_){}e.preventDefault();});
  svg.addEventListener('pointermove',e=>{if(drag<0)return;const p=pt(e);let a=Math.atan2(p.x-cx,-(p.y-cy))*180/Math.PI;a=(a+360)%360;
    const pos=a/360*C,wm=((S.w%C)+C)%C,back=((wm-pos)%C+C)%C;S.cons[drag].c=S.w-back;draw();});
  const end=()=>{if(drag<0)return;const i=drag;drag=-1;o.on({type:'drag',i});};
  svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);
  draw();
  const tm=setInterval(()=>{if(!svg.isConnected){clearInterval(tm);return;}if(S.play&&!S.busy&&drag<0){adv(.5);draw();}},200);
  return {S,draw,adv,skip,C,reset(cfg){reset(cfg);draw();},alive:()=>svg.isConnected,
    rewind(i,h){const c=S.cons[i];c.c=Math.max(S.w-C,S.w-h*R0*S.mult);draw();}};
}
const RING_CONS=[{name:'Notifications',ab:'N',col:'var(--h1)',cap:300,lag:.3},{name:'ETA model',ab:'E',col:'var(--h2)',cap:200,lag:1},{name:'Billing',ab:'B',col:'var(--h4)',cap:125,lag:4}];

Course.lesson({
  id:'0028', title:'Transmitting event streams', minutes:20, icon:'arrow',
  goals:['Explain what an event stream is and why polling falls short','Choose between dropping, buffering and backpressure, and between load balancing and fan-out','Decide when a log-based broker beats a classic message queue'],
  parts:['Streams and events','Messaging systems','Message brokers','Partitioned logs'],
  read:'Read the first part of chapter 11 (“Transmitting Event Streams”) for the book’s figures on load balancing, redelivery and partitioned logs.',
  glossary:{
    event:'Event: a small, self-contained record of something that happened at a certain time, such as “parcel 88 scanned at Westport North hub at 09:14”. Once written, it never changes.',
    topic:'Topic (or stream): a named group of related events, such as all parcel scans. Producers write events to a topic and consumers read from it.',
    backpressure:'Backpressure (also called flow control): when the receiver is full, the sender is blocked from sending more until there is room. Nothing is lost; the sender just slows down.',
    broker:'Message broker (or message queue): an intermediary that receives messages from senders, stores them for a while, and delivers them to one or more recipients.',
    offset:'Offset: the position number of a message inside one partition of a log. A consumer remembers the offset it has reached, like a reader remembers a page number.',
    ack:'Acknowledgment: a consumer’s message to the broker saying “I’ve finished processing this message”, so the broker can remove it.',
    'head-of-line':'Head-of-line blocking: a few slow requests at the front of a queue hold up the fast requests behind them.'
  },
  cheatsheet:[
    'A <b>stream</b> is input that never ends. An <b>event</b> is a small, immutable record of something that happened, with a timestamp.',
    '<b>Producers</b> write events to a <b>topic</b>; <b>consumers</b> read them. Polling wastes more requests the faster it goes; notifying consumers is better.',
    'Ask any messaging system: when consumers are slow, does it <b>drop, buffer or apply backpressure</b>? When nodes crash, are messages <b>lost</b>?',
    '<b>Direct messaging</b> (UDP multicast, webhooks) assumes both ends stay online. A <b>broker</b> holds messages so clients can come and go.',
    '<b>Load balancing</b>: each message to one consumer. <b>Fan-out</b>: each message to every consumer. Consumer groups combine both.',
    'Acknowledgments stop messages being lost, but <b>redelivery plus load balancing reorders</b> messages.',
    '<b>Log-based brokers</b> append to partitioned logs and consumers move an <b>offset</b>. Order holds within a partition, reading deletes nothing, and the disk is a huge <b>ring buffer</b> you can <b>replay</b>.',
    'Classic queue: slow, independent tasks where order doesn’t matter. Log: high throughput, quick messages, order matters.'
  ],
  steps:[
/* ---------- PART 1: STREAMS AND EVENTS ---------- */
{part:0,src:'Warm-up',pts:1,run(L){

  L.mc(L.card,['The batch job runs only once a day','The dashboard has a display bug'],0,
   'A daily batch can only show today’s deliveries tomorrow. This lesson is about handling each event as it happens instead.',
   'The dashboard shows exactly what the job produced. The trouble is timing: a job that runs once a night can only reflect today’s deliveries tomorrow.');}},
{part:0,src:'Chapter 11 · Stream Processing',run(L){
  L.h(L.kick('learn','Bounded and unbounded input')+'<h1 class="q">Batch needs an end. Real data never ends.</h1>'+CSS+
   '<div class="es-fig" id="b2f"></div><div class="es-row" id="b2c"></div>'+
   '<p class="es-cap">A sort can’t output anything until the last record is in. Otterpost’s scans never stop, so batch chops them into days or hours. A <b>stream</b> handles each event as it arrives, like Unix stdin or a TCP connection.</p>');

{part:0,src:'Chapter 11 · Transmitting Event Streams',run(L){

{part:0,src:'Chapter 11 · Transmitting Event Streams',pts:1,
 solve:async L=>{L.$('#t4 [data-k="1"]').click();},

{part:0,src:'Chapter 11 · Transmitting Event Streams',
 solve:async L=>{setRange(L,'p5',0);await L.sleep(60);setRange(L,'p5',5);await L.sleep(60);L.$('#p5n').click();},
 run(L){
  let seed=11;const rnd=()=>(seed=seed*16807%2147483647)/2147483647;
  const SC=[...Array(60)].map(()=>rnd()*3600).sort((a,b)=>a-b);
  const IV=[1,5,15,60,300,600],IVL=['1 s','5 s','15 s','1 min','5 min','10 min'];
  const seen={fast:false,slow:false,note:false};let notify=false,idx=3;
  L.h(L.kick('pr','Turn the dial')+'<h1 class="q">Tobias’s first notification sender keeps asking the Parcel DB “any new scans?” About 60 scans arrive per hour.</h1>'+CSS+
   '<p class="small" id="p5h">Try a fast poll and a slow one, then switch to notifications.</p>'+
   '<div class="es-fig" id="p5f"></div>'+rng('p5','Poll every',0,5,idx)+
   '<div class="es-row"><button class="btn" id="p5n">'+L.ic('chat')+'Notify me instead</button></div><div class="es-read" id="p5r"></div><p class="es-foot">Numbers are illustrative.</p>');
  const X=t=>R1(10+t/3600*300);
  function draw(){
    const I=IV[idx];let s='<svg viewBox="0 0 320 112" role="img" aria-label="One hour: scans on the top row, polls on the bottom row; green polls found a new scan, grey ones found nothing.">';
    s+=T(4,12,'Scans (one hour)','font-size:11.5px;font-weight:600;fill:var(--muted)');
    SC.forEach(t=>{s+='<circle cx="'+X(t)+'" cy="26" r="3" style="fill:var(--h2)"/>';});
    s+=T(4,50,notify?'Notifications':'Polls','font-size:11.5px;font-weight:600;fill:var(--muted)');
    let n=0,useful=0,wait=0;
    if(notify){SC.forEach(t=>{s+='<line x1="'+X(t)+'" y1="58" x2="'+X(t)+'" y2="84" style="stroke:var(--ok-strong);stroke-width:1.6"/>';});n=60;useful=60;wait=0;}
    else{n=Math.floor(3600/I);const hit=new Set(SC.map(t=>Math.floor(t/I)));useful=hit.size;SC.forEach(t=>{wait+=(Math.floor(t/I)+1)*I-t;});wait/=SC.length;
      if(n>150){s+='<rect x="10" y="58" width="300" height="26" style="fill:var(--line2)"/>';hit.forEach(k=>{const x=X(Math.min(3600,(k+1)*I));s+='<line x1="'+x+'" y1="58" x2="'+x+'" y2="84" style="stroke:var(--ok-strong);stroke-width:1.6"/>';});}
      else for(let k=0;k<n;k++){const x=X((k+1)*I),ok=hit.has(k);s+='<line x1="'+x+'" y1="'+(ok?58:64)+'" x2="'+x+'" y2="84" style="stroke:'+(ok?'var(--ok-strong)':'var(--line2)')+';stroke-width:'+(n>40?1.4:2.4)+'"/>';}}
    s+=T(10,104,'0 min','font-size:11px;fill:var(--muted)')+T(160,104,'30 min','font-size:11px;fill:var(--muted);text-anchor:middle')+T(310,104,'60 min','font-size:11px;fill:var(--muted);text-anchor:end');
    L.$('#p5f').innerHTML=s+'</svg>';
    L.$('#p5-v').textContent=notify?'—':IVL[idx];
    const pct=Math.round(useful/n*100);
    L.$('#p5r').innerHTML='<div class="es-tbl"><span>'+L.ic('cycle')+'</span><span>Requests per hour</span><b>'+fmt(n)+'</b>'+
      '<span>'+L.ic('check')+'</span><span>Found a new scan</span><b class="'+(pct<20?'no-t':'ok-t')+'">'+(pct<2?'under 2%':pct+'%')+'</b>'+
      '<span>'+L.ic('clock')+'</span><span>A scan waits, on average</span><b class="'+(wait>60?'no-t':'')+'">'+(notify?'no time':wait<60?R1(wait)+' s':R1(wait/60)+' min')+'</b></div>'+
      '<div class="es-meter" aria-hidden="true"><i style="width:'+Math.max(2,pct)+'%;background:var(--ok-strong)"></i></div>';
  }
  function check(){if(seen.fast&&seen.slow&&seen.note&&!L.$('#p5ok')){L.$('#p5h').insertAdjacentHTML('beforeend','<span id="p5ok"></span>');
    L.sheet('info','Polling can’t win','Polling faster shortens the wait, but a smaller share of polls finds anything, so the overhead climbs. Polling slower wastes less and makes scans wait. Better: <b>notify</b> consumers when an event appears. Database triggers can react to a new row, but they’re limited, so special tools were built for this.');L.done();}}
  L.$('#p5').oninput=()=>{idx=+L.$('#p5').value;notify=false;if(IV[idx]<=5)seen.fast=true;if(IV[idx]>=300)seen.slow=true;L.$('#p5n').classList.remove('pri');draw();check();};
  L.$('#p5n').onclick=()=>{notify=true;seen.note=true;L.$('#p5n').classList.add('pri');draw();check();};
  draw();}},

/* ---------- PART 2: MESSAGING SYSTEMS ---------- */
{part:1,src:'Chapter 11 · Messaging Systems',run(L){
  L.h(L.kick('learn','Publish/subscribe')+'<h1 class="q">From one-to-one pipes to many-to-many topics</h1>'+CSS+
   '<div class="es-fig">'+figPubSub()+'</div>'+
   '<p class="es-cap">A pipe links one sender to one receiver. A <b>messaging system</b> lets many producers and consumers share a topic. Ask each one two questions:</p>'+
   '<div class="es-q"><span class="n">1</span><span>Producers faster than consumers: <b>drop</b>, <b>buffer</b> or '+L.g('backpressure','backpressure')+'?</span></div>'+
   '<div class="es-q"><span class="n">2</span><span>A node crashes: are messages <b>lost</b>? Not losing them costs disk or replicas.</span></div>');
  L.done();}},
{part:1,src:'Chapter 11 · Messaging Systems',
 solve:async L=>{setRange(L,'k7-in',50);setRange(L,'k7-out',20);const c=L.$('#k7-p').children;c[0].click();await L.sleep(250);c[1].click();await L.sleep(250);c[3].click();await L.sleep(250);},
 run(L){
  const tried=new Set();let tk=null;
  L.h(L.kick('pr','Explore the tank')+'<h1 class="q">Otterpost’s notification queue is a tank. Make producers faster than the workers, then try each policy.</h1>'+CSS+
   '<div id="k7"></div><p class="es-foot">Rates and sizes are illustrative. Tried with an overload: <b id="k7n">0</b> of 3 policies needed.</p>');
  tk=Tank(L,L.$('#k7'),{id:'k7',inR:20,outR:30,pol:'mem',on:e=>{
    if((e.type==='pol'||e.type==='rate')&&tk&&tk.S.in>tk.S.out){tried.add(tk.S.pol);L.$('#k7n').textContent=Math.min(3,tried.size);
      if(tried.size>=3&&!L.$('#k7ok')){L.$('#k7n').insertAdjacentHTML('afterend','<span id="k7ok"></span>');
        L.sheet('info','Four answers to one question','<b>Drop</b> loses messages. <b>Memory</b> holds them until it runs out, then the broker crashes. <b>Disk</b> keeps going, but each message gets slower. <b>Backpressure</b> loses nothing and holds the producers back; Unix pipes and TCP do this with a small buffer.');L.done();}}}});}},
{part:1,src:'Chapter 11 · Messaging Systems',
 solve:async L=>{L.$('#e8c').children[2].click();},
 run(L){
  const PTS=[[18,120],[30,104],[44,98],[56,84],[70,80],[84,68],[96,72],[108,58],[118,48],[128,52],[138,40],[146,34]];
  const LOST=[[],[5],[1,2,4,5,7,8,10]];
  L.h(L.kick('ex','Is losing a message OK?')+'<h1 class="q">Kwame and Linh compare two streams. Turn up the loss.</h1>'+CSS+
   '<div class="es-fig" id="e8f"></div><div class="es-row" id="e8c"></div>'+
   '<p class="es-cap">A lost GPS ping hardly matters: a newer one arrives seconds later. A count is wrong by every event it loses. And heavy loss is easy to miss: nothing flags that the numbers are off.</p><p class="es-foot">Numbers are illustrative.</p>');
  function draw(m){
    const lost=new Set(LOST[m]);let s='<svg viewBox="0 0 320 170" role="img" aria-label="Left: a courier’s trail drawn from GPS pings. Right: Bramble and Bolt’s delivered count.">';
    s+=T(78,12,'GPS pings → live map','font-size:12px;font-weight:700;fill:var(--muted);text-anchor:middle');
    s+=box(4,20,148,120,'var(--soft)','',{rx:10});
    for(let k=1;k<4;k++)s+='<line x1="4" y1="'+(20+k*30)+'" x2="152" y2="'+(20+k*30)+'" style="stroke:var(--line);stroke-width:1"/><line x1="'+(4+k*37)+'" y1="20" x2="'+(4+k*37)+'" y2="140" style="stroke:var(--line);stroke-width:1"/>';
    const kept=PTS.filter((p,k)=>!lost.has(k));
    s+='<polyline points="'+kept.map(p=>p.join(',')).join(' ')+'" style="fill:none;stroke:var(--h2);stroke-width:2.5;stroke-linejoin:round"/>';
    PTS.forEach((p,k)=>{s+=lost.has(k)?'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="4" style="fill:var(--card);stroke:var(--no);stroke-width:1.5;stroke-dasharray:2 2"/>':'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="4" style="fill:var(--h2)"/>';});
    s+=T(78,160,m===2?'jumpy, and no alarm fires':'trail still about right','font-size:11.5px;font-weight:600;fill:'+(m===2?'var(--no)':'var(--ok)')+';text-anchor:middle');
    s+=T(242,12,'Delivered scans → invoice','font-size:12px;font-weight:700;fill:var(--muted);text-anchor:middle');
    s+=box(168,20,148,120,'var(--card)','var(--line2)',{rx:10});
    s+=T(242,42,'Bramble & Bolt','font-size:12px;font-weight:700;fill:var(--ink);text-anchor:middle')+T(242,58,'delivered today: 1,000','font-size:11px;fill:var(--muted);text-anchor:middle');
    const counted=[1000,900,400][m];
    s+=T(242,96,fmt(counted),'font-size:26px;font-weight:700;fill:'+(m?'var(--no)':'var(--ok)')+';text-anchor:middle')+T(242,116,'counted and billed','font-size:11px;fill:var(--muted);text-anchor:middle');
    s+=T(242,160,m?fmt(1000-counted)+' deliveries never billed':'every event counted','font-size:11.5px;font-weight:600;fill:'+(m?'var(--no)':'var(--ok)')+';text-anchor:middle');
    L.$('#e8f').innerHTML=s+'</svg>';
  }
  chips(L,L.$('#e8c'),['Lose none','Lose 1 in 10','Lose 6 in 10'],m=>{draw(m);if(m===2&&!L.$('#e8ok')){L.$('#e8c').insertAdjacentHTML('beforeend','<span id="e8ok"></span>');
    L.sheet('info','The decision','GPS pings can take a faster path that sometimes loses messages. Delivery scans are counted, so they need reliable, durable delivery, even if it costs some throughput.<br><br>Batch jobs had this for free: failed tasks are retried and their partial output thrown away, so the result is as if nothing failed. Streams must earn a similar guarantee; later lessons show how.');L.done();}},0);draw(0);}},
{part:1,src:'Chapter 11 · Messaging Systems',pts:1,
 solve:async L=>{L.$('#p9c').children[1].click();await waitFor(L,'#p9rp',5000);L.$('#p9rp').click();await waitFor(L,'#p9d',5000);},
 run(L){
  let pick=null;
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">Flash sale: 40 messages a second arrive, workers handle 20. The broker buffers <b>in memory</b>. After 8 seconds its machine restarts. How many messages are lost?</h1>'+CSS+
   '<div class="es-row" id="p9c"></div><div id="p9t"></div><div id="p9x"></div>');
  const tk=Tank(L,L.$('#p9t'),{id:'p9',inR:40,outR:20,pol:'mem',auto:false,controls:false});
  ['None: the broker said “stored”','About 160: the whole backlog','About 20: one second’s worth'].forEach((t,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=t;
    b.onclick=async()=>{if(pick!==null)return;pick=j;b.classList.add('sel');
      if(!await tk.run(8))return;tk.crash('Restarted');await L.sleep(500);if(!tk.alive())return;
      const ok=j===1;L.award(ok);
      L.sheet(ok?'ok':'no',ok?'Right: 160 gone':'160 were lost','Each second, 20 more messages piled up than the workers could take: 8 × 20 = 160 in the queue. They lived only in memory, so the restart wiped them, even though every producer had been told “stored”.');
      L.$('#p9x').innerHTML='<button class="btn pri" id="p9rp" style="margin-top:8px">'+L.ic('play')+'Replay with the buffer on disk</button>';
      L.$('#p9rp').onclick=async function(){this.remove();tk.reset();tk.S.pol='disk';tk.draw();if(!await tk.run(8))return;tk.crash('Restarted');await L.sleep(400);if(!tk.alive())return;
        L.$('#p9x').innerHTML='<div class="fb ok" id="p9d">Same crash, nothing lost: the backlog was on disk. That’s why the broker’s own durability matters. Producers stop waiting once the broker confirms “stored”.</div>';L.done();};};
    L.$('#p9c').appendChild(b);});}},
{part:1,src:'Chapter 11 · Direct messaging from producers to consumers',run(L){
  L.h(L.kick('learn','No middleman')+'<h1 class="q">Direct messaging: producer straight to consumer</h1>'+CSS+
   '<div class="es-fig" id="d10f"></div><div class="es-row" id="d10c"></div>'+
   '<p class="es-cap">Some systems skip any server in between. Protocols may resend lost packets, but they assume both ends stay online. An offline consumer misses messages, and a producer that crashes loses the messages it meant to retry.</p>');
  function draw(m){
    let s='<svg viewBox="0 0 320 160" role="img" aria-label="Four kinds of direct messaging, and Otterpost’s webhook sender calling Bramble and Bolt’s server directly.">'+arrowDefs;
    [['UDP multicast: stock feeds',4,4],['ZeroMQ, nanomsg: pub/sub',162,4],['StatsD: metrics over UDP',4,30],['Webhooks: callback URLs',162,30]].forEach(p=>{s+=box(p[1],p[2],154,22,'var(--soft)','',{rx:11})+T(p[1]+77,p[2]+15,p[0],'font-size:11px;font-weight:600;fill:var(--muted);text-anchor:middle');});
    const pc=m===2;s+=box(4,70,104,82,pc?'var(--no-bg)':'var(--h1-bg)',pc?'var(--no)':'',{rx:10});
    s+=T(56,88,'Webhook sender','font-size:11.5px;font-weight:700;fill:'+(pc?'var(--no)':'var(--h1)')+';text-anchor:middle');
    for(let k=0;k<3;k++)s+='<rect x="'+(22+k*24)+'" y="100" width="20" height="14" rx="2" style="fill:var(--card);stroke:'+(pc?'var(--no)':'var(--h1)')+';stroke-width:1.2;opacity:'+(pc?.35:1)+'"/>';
    s+=T(56,132,pc?'crashed:':'retry buffer','font-size:11px;fill:'+(pc?'var(--no)':'var(--h1)')+';text-anchor:middle;font-weight:600')+(pc?T(56,146,'retries gone','font-size:11px;fill:var(--no);text-anchor:middle;font-weight:600'):'');
    const off=m>0;
    s+=box(212,70,104,82,off?'var(--soft)':'var(--h2-bg)',off?'var(--line2)':'',{rx:10,dash:off?'5 4':''});
    s+=T(264,98,'Bramble & Bolt','font-size:11.5px;font-weight:700;fill:'+(off?'var(--muted)':'var(--h2)')+';text-anchor:middle')+T(264,114,'server','font-size:11.5px;fill:'+(off?'var(--muted)':'var(--h2)')+';text-anchor:middle')+T(264,136,off?'offline (deploy)':'online','font-size:11px;font-weight:600;fill:'+(off?'var(--no)':'var(--ok)')+';text-anchor:middle');
    if(off){s+='<line x1="110" y1="111" x2="176" y2="111" style="stroke:var(--muted);stroke-width:1.6;stroke-dasharray:4 4"/><path d="M182 104l12 14m0 -14l-12 14" style="stroke:var(--no);stroke-width:3;stroke-linecap:round"/>'+T(160,134,'missed','font-size:11px;font-weight:700;fill:var(--no);text-anchor:middle');}
    else s+=line(110,111,208,111,'var(--ok-strong)')+T(160,102,'status update','font-size:11px;fill:var(--ok);text-anchor:middle');
    L.$('#d10f').innerHTML=s+'</svg>';}
  chips(L,L.$('#d10c'),['Both online','Merchant offline','…and sender crashes'],draw,0);draw(0);
  L.done();}},
{part:1,src:'Chapter 11 · Messaging Systems',pts:5,run(L){
  L.h(L.kick('pr','Drop, buffer or backpressure?')+'<h1 class="q">Sort each behavior.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Drop','Buffer','Backpressure'],[
   ['A Unix pipe’s small buffer fills up, so the writing program is paused until the reader catches up.',2,'The sender is blocked until there is room. Nothing is lost.'],
   ['A metrics collector over UDP loses packets when it’s busy.',0,'Lost packets are simply gone. That’s dropping.'],
   ['During Peak Week the notification queue grows to 2 million messages and spills onto disk.',1,'Messages wait in a queue to be handled later. That’s buffering, and spilling to disk can slow it down.'],
   ['In a flash sale, the broker refuses new booking events until consumers catch up, so the merchant API has to wait.',2,'The producer is held back instead of losing data. That’s backpressure.'],
   ['A courier app keeps scans on the phone while there’s no signal in a basement, and sends them later.',1,'The scans wait in a local buffer. Nothing is dropped, and nobody is blocked from scanning.']],
   'Only dropping loses data. Buffering spends memory or disk and adds delay; backpressure slows the producer.');}},

{part:2,src:'Chapter 11 · Message brokers',run(L){
  let s='<svg viewBox="0 0 320 170" role="img" aria-label="Producers send to a broker server, which stores messages and answers stored. One consumer is connected, another is offline and its messages wait.">'+arrowDefs;

  [[52],[124]].forEach(p=>{s+='<line x1="120" y1="'+p[0]+'" x2="92" y2="'+p[0]+'" style="stroke:var(--ok-strong);stroke-width:1.6;stroke-dasharray:4 3" marker-end="url(#es-ah)"/>';});
  s+=T(104,70,'“stored”','font-size:11px;font-weight:700;fill:var(--ok);text-anchor:middle');
  s+=box(122,10,92,150,'var(--pri-bg)','var(--pri)',{rx:14});
  s+=T(168,30,'Broker','font-size:13px;font-weight:700;fill:var(--pri);text-anchor:middle')+T(168,44,'a server','font-size:11px;fill:var(--pri);text-anchor:middle');
  for(let k=0;k<5;k++)s+='<rect x="138" y="'+(56+k*16)+'" width="60" height="12" rx="3" style="fill:var(--card);stroke:var(--pri);stroke-width:1"/>';
  s+=T(168,150,'memory or disk','font-size:11px;fill:var(--pri);text-anchor:middle');
  s+=line(216,40,234,40)+box(236,24,80,32,'var(--h2-bg)','',{rx:8})+T(276,44,'Notifications','font-size:11px;font-weight:600;fill:var(--h2);text-anchor:middle');
  s+='<line x1="216" y1="112" x2="234" y2="112" style="stroke:var(--line2);stroke-width:1.6;stroke-dasharray:3 3"/>'+box(236,96,80,32,'var(--soft)','var(--line2)',{rx:8,dash:'4 3'})+T(276,116,'Billing','font-size:11px;font-weight:600;fill:var(--muted);text-anchor:middle')+T(276,144,'offline: waits','font-size:11px;font-weight:600;fill:var(--muted);text-anchor:middle');
  s+='</svg>';
  L.h(L.kick('learn','Message brokers')+'<h1 class="q">A broker is a database for messages in transit</h1>'+CSS+'<div class="es-fig">'+s+'</div>'+
   '<p class="es-cap">A '+L.g('broker','message broker')+' is a server. Clients connect, disconnect and crash; the broker holds the messages. Producers wait only for “stored”, not for processing, so consumers are <b>asynchronous</b>.</p>'+
   '<p class="es-foot">With slow consumers, most brokers just let the queue grow.</p>');

{part:2,src:'Chapter 11 · Message brokers compared to databases',run(L){
  const R=[['After a read',['still there'],['deleted once','delivered']],['Lots of data',['normal'],['expects short queues;','long ones slow it']],['Picking data',['indexes, search'],['subscribe to topics','matching a pattern']],['Data changes',['you aren’t told','(a snapshot)'],['you’re notified','of new messages']]];
  let s='<svg viewBox="0 0 320 232" role="img" aria-label="Table comparing a database and a classic broker on four points.">';
  s+=box(78,2,108,30,'var(--h2-bg)','',{rx:8})+T(132,22,'Database','font-size:12.5px;font-weight:700;fill:var(--h2);text-anchor:middle');
  s+=box(190,2,128,30,'var(--pri-bg)','',{rx:8})+T(254,22,'Classic broker','font-size:12.5px;font-weight:700;fill:var(--pri);text-anchor:middle');
  R.forEach((r,j)=>{const y=40+j*48;s+='<line x1="2" y1="'+(y-3)+'" x2="318" y2="'+(y-3)+'" style="stroke:var(--line);stroke-width:1"/>';
    s+=T(4,y+24,r[0],'font-size:11.5px;font-weight:700;fill:var(--muted)');
    const cell=(x,lines,col)=>lines.map((t,k)=>T(x,y+(lines.length===1?24:17+k*15),t,'font-size:12px;fill:'+col+';text-anchor:middle')).join('');
    s+=cell(132,r[1],'var(--ink)')+cell(254,r[2],'var(--ink)');});
  s+='</svg>';
  L.h(L.kick('learn','Brokers and databases')+'<h1 class="q">Close cousins, different habits</h1>'+CSS+'<div class="es-fig">'+s+'</div>'+
   '<p class="es-cap">Some brokers even join two-phase commit, like a database. This is the classic broker of the JMS and AMQP standards, such as RabbitMQ and ActiveMQ. Otterpost’s notification queue is one.</p>');
  L.done();}},
{part:2,src:'Chapter 11 · Multiple consumers',run(L){
  const COL=['h1','h2','h3','h4','h1','h2'];
  const MODES=[{boxes:[['Machine 1',[1,4]],['Machine 2',[2,5]],['Machine 3',[3,6]]],cap:'<b>Load balancing:</b> each message goes to <b>one</b> consumer. Add consumers to share work that is expensive to process.'},
    {boxes:[['Notifications',[1,2,3,4,5,6]],['ETA model',[1,2,3,4,5,6]],['Billing',[1,2,3,4,5,6]]],cap:'<b>Fan-out:</b> each message goes to <b>every</b> consumer. Each tunes in without affecting the others, like several batch jobs reading one input file.'},
    {boxes:[['Notifications A',[1,3,5]],['Notifications B',[2,4,6]],['Billing',[1,2,3,4,5,6]]],grp:true,cap:'<b>Both at once:</b> each <b>group</b> gets every message; inside a group, only one machine handles each one.'}];
  L.h(L.kick('learn','Multiple consumers')+'<h1 class="q">Share the work, or copy it?</h1>'+CSS+'<div class="es-fig" id="m14f"></div><div class="es-row" id="m14c"></div><p class="es-cap" id="m14p"></p>');
  function draw(m){const M=MODES[m];let s='<svg viewBox="0 0 320 172" role="img" aria-label="A scan topic with six messages and three consumers; each consumer box shows which messages it receives.">'+arrowDefs;
    s+=box(4,56,96,62,'var(--soft2)','var(--line2)',{rx:12})+T(52,74,'scan topic','font-size:11.5px;font-weight:700;fill:var(--ink);text-anchor:middle');
    for(let k=0;k<6;k++){const x=12+k*14.5;s+='<rect x="'+x+'" y="84" width="12" height="20" rx="3" style="fill:var(--'+COL[k]+'-bg);stroke:var(--'+COL[k]+')"/>'+T(x+6,98,k+1,'font-size:11px;font-weight:700;fill:var(--'+COL[k]+');text-anchor:middle');}
    M.boxes.forEach((b,j)=>{const y=6+j*56;s+=line(102,87,152,y+22)+box(156,y,160,46,'var(--card)',M.grp&&j<2?'var(--h1)':'var(--line2)',{rx:10,dash:M.grp&&j<2?'':''});
      s+=T(164,y+16,b[0],'font-size:11.5px;font-weight:700;fill:var(--ink)');
      b[1].forEach((n,k)=>{const x=164+k*24;s+='<rect x="'+x+'" y="'+(y+22)+'" width="20" height="18" rx="4" style="fill:var(--'+COL[n-1]+'-bg);stroke:var(--'+COL[n-1]+')"/>'+T(x+10,y+35,n,'font-size:11px;font-weight:700;fill:var(--'+COL[n-1]+');text-anchor:middle');});});
    if(M.grp)s+='<rect x="151" y="2" width="168" height="110" rx="13" style="fill:none;stroke:var(--h1);stroke-width:1.5;stroke-dasharray:5 4"/>';
    L.$('#m14f').innerHTML=s+'</svg>';L.$('#m14p').innerHTML=M.cap;}
  chips(L,L.$('#m14c'),['Load balancing','Fan-out','Two groups'],draw,0);draw(0);
  L.done();}},
{part:2,src:'Chapter 11 · Multiple consumers',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Inside the notification group, three machines share the work. Each scan should trigger exactly one push message. Which pattern is that?</h1>');
  L.mc(L.card,['Fan-out','Load balancing'],1,
   'Each message goes to one of the three machines, so they split the work between them.',
   'Fan-out would give every machine a copy, so the recipient would get three pushes. Splitting the messages between machines is load balancing.');}},
{part:2,src:'Chapter 11 · Acknowledgments and redelivery',run(L){
  L.h(L.kick('learn','Acknowledgments')+'<h1 class="q">A message is removed only when the consumer says “done”</h1>'+CSS+
   '<div class="es-fig" id="a16f"></div><div class="es-row" id="a16c"></div>'+
   '<p class="es-cap">Brokers use '+L.g('ack','acknowledgments')+'. If the connection closes or times out with no ack, the broker delivers the message again to another consumer. If the work was done and only the ack got lost, it runs twice; fixing that needs atomic commit (chapter 9).</p>');
  function draw(m){let s='<svg viewBox="0 0 320 156" role="img" aria-label="A broker holding message m3, worker 1 and worker 2, with numbered arrows for delivery, acknowledgment and redelivery.">'+arrowDefs;
    s+=box(4,8,96,140,'var(--pri-bg)','var(--pri)',{rx:12})+T(52,26,'Broker','font-size:12.5px;font-weight:700;fill:var(--pri);text-anchor:middle');
    const gone=m===0;
    s+=box(24,62,56,26,gone?'var(--soft)':'var(--h3-bg)',gone?'var(--line2)':'var(--h3)',{rx:6,dash:gone?'3 3':''})+T(52,80,'m3','font-size:12.5px;font-weight:700;fill:'+(gone?'var(--muted)':'var(--h3)')+';text-anchor:middle');
    s+=T(52,110,gone?'removed':'kept: no ack','font-size:11px;font-weight:600;fill:'+(gone?'var(--ok)':'var(--h3)')+';text-anchor:middle');
    const w1x=214;s+=box(w1x,8,102,58,m===1?'var(--no-bg)':'var(--h2-bg)',m===1?'var(--no)':'',{rx:10})+T(w1x+51,28,'Worker 1','font-size:12px;font-weight:700;fill:'+(m===1?'var(--no)':'var(--h2)')+';text-anchor:middle');
    s+=T(w1x+51,48,m===1?'crashes':'sends the push','font-size:11px;fill:'+(m===1?'var(--no)':'var(--h2)')+';text-anchor:middle');
    const tag=(x,y,n,col)=>'<circle cx="'+x+'" cy="'+y+'" r="9" style="fill:'+col+'"/>'+T(x,y+4,n,'font-size:11px;font-weight:700;fill:var(--card);text-anchor:middle');
    s+=line(102,30,210,30,'var(--muted)')+tag(156,30,'1','var(--muted)')+T(156,18,'deliver m3','font-size:11px;fill:var(--muted);text-anchor:middle');
    if(m===0){s+=line(212,52,104,52,'var(--ok-strong)')+tag(158,52,'2','var(--ok-strong)')+T(158,70,'ack: done','font-size:11px;font-weight:600;fill:var(--ok);text-anchor:middle');}
    else{if(m===2){s+='<line x1="212" y1="52" x2="168" y2="52" style="stroke:var(--no);stroke-width:1.6;stroke-dasharray:4 3"/><path d="M156 46l10 12m0 -12l-10 12" style="stroke:var(--no);stroke-width:2.6;stroke-linecap:round"/>'+T(170,70,'ack lost','font-size:11px;font-weight:600;fill:var(--no)');}
      s+=box(w1x,92,102,56,'var(--h2-bg)','',{rx:10})+T(w1x+51,112,'Worker 2','font-size:12px;font-weight:700;fill:var(--h2);text-anchor:middle')+T(w1x+51,130,m===2?'sends it again':'sends the push','font-size:11px;fill:var(--h2);text-anchor:middle');
      s+=line(102,120,210,120,'var(--h3)')+tag(156,120,m===2?'3':'2','var(--h3)')+T(156,140,'redeliver m3','font-size:11px;font-weight:600;fill:var(--h3);text-anchor:middle');}
    L.$('#a16f').innerHTML=s+'</svg>';}
  chips(L,L.$('#a16c'),['All goes well','Worker crashes','Ack gets lost'],draw,0);draw(0);
  L.done();}},
{part:2,src:'Chapter 11 · Acknowledgments and redelivery',pts:1,
 solve:async L=>{L.$('#r17go').click();await waitFor(L,'#r17c .chip',5000);L.$('#r17c').children[2].click();await waitFor(L,'#r17ok',5000);},
 run(L){
  const MSG={1:['Picked up','h1'],2:['At hub','h2'],3:['Out for delivery','h3'],4:['Delivered','h4']};
  const SC={base:{lanes:['A','B'],ev:[['A',0,1,'ok'],['B',0,2,'ok'],['B',1,3,'crash'],['A',1,4,'ok'],['A',2,3,'re']]},
    third:{lanes:['A','B','C'],ev:[['A',0,1,'ok'],['B',0,2,'ok'],['C',0,3,'crash'],['A',1,4,'ok'],['B',2,3,'re']]},
    ackfirst:{lanes:['A','B'],ev:[['A',0,1,'ok'],['B',0,2,'ok'],['B',1,3,'ackcrash'],['A',1,4,'ok']]},
    own:{lanes:['A'],note:'Fix: this queue has one worker, A',ev:[['A',0,1,'ok'],['A',1,2,'ok'],['A',2,3,'crash'],['A',3,3,'re'],['A',4,4,'ok']]}};
  let tried=0,graded=false;
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Mrs. Okoro’s parcel OP-48213 sends four status messages through the notification queue to two load-balanced workers. Worker B will crash.</h1>'+CSS+
   '<div class="es-fig" id="r17f"></div><div class="es-phone"><div class="h">Mrs. Okoro’s phone</div><div id="r17p" class="small">No pushes yet.</div></div>'+
   '<div id="r17x"><button class="btn pri" id="r17go" style="margin-top:10px">'+L.ic('play')+'Run the queue</button></div>');
  function lanes(sc,shown){const n=sc.lanes.length,H=24+n*50;let s='<svg viewBox="0 0 320 '+H+'" role="img" aria-label="Timeline: each lane is a worker, each pill a message it handled.">';
    s+=T(62,14,'time →','font-size:11px;font-weight:600;fill:var(--muted)');
    if(sc.note)s+=T(316,14,sc.note,'font-size:11px;font-weight:700;fill:var(--h2);text-anchor:end');
    sc.lanes.forEach((ln,j)=>{const y=24+j*50;s+='<line x1="58" y1="'+(y+16)+'" x2="316" y2="'+(y+16)+'" style="stroke:var(--line);stroke-width:1.5"/>'+T(2,y+20,'Worker '+ln,'font-size:11.5px;font-weight:700;fill:var(--ink)');});
    sc.ev.slice(0,shown).forEach(e=>{const j=sc.lanes.indexOf(e[0]),y=24+j*50,x=62+e[1]*51,m=MSG[e[2]],bad=e[3]==='crash'||e[3]==='ackcrash';
      s+='<rect x="'+x+'" y="'+(y+3)+'" width="44" height="26" rx="8" style="fill:'+(bad?'var(--no-bg)':'var(--'+m[1]+'-bg)')+';stroke:'+(bad?'var(--no)':'var(--'+m[1]+')')+';stroke-width:1.5'+(bad?';stroke-dasharray:4 3':'')+'"/>';
      s+=T(x+22,y+21,'m'+e[2]+(bad?' ✗':' ✓'),'font-size:12px;font-weight:700;fill:'+(bad?'var(--no)':'var(--'+m[1]+')')+';text-anchor:middle');
      const sub={crash:'crash',ackcrash:'acked, crash',re:'redelivered'}[e[3]];
      if(sub)s+=T(x+22,y+43,sub,'font-size:11px;font-weight:600;fill:'+(bad?'var(--no)':'var(--h3)')+';text-anchor:middle');});
    L.$('#r17f').innerHTML=s+'</svg>';}
  async function play(key){const sc=SC[key],out=[];L.$('#r17p').innerHTML='No pushes yet.';
    for(let k=0;k<=sc.ev.length;k++){if(!L.$('#r17f'))return null;lanes(sc,k);
      const e=sc.ev[k-1];if(e&&(e[3]==='ok'||e[3]==='re')){out.push(e[2]);
        L.$('#r17p').innerHTML=out.map((n,j)=>{const wrong=j>0&&n<out[j-1];return '<span class="chip static'+(wrong?' no':' ok')+'">'+(j+1)+'. '+MSG[n][0]+'</span>';}).join('');}
      await L.sleep(360);}
    return out;}
  lanes(SC.base,0);
  L.$('#r17go').onclick=async function(){this.remove();const out=await play('base');if(!out)return;
    L.$('#r17x').innerHTML='<h2 class="sub" style="margin-top:12px">“Delivered” arrived before “Out for delivery”. Pick a fix and replay.</h2><div class="es-row" id="r17c"></div>';
    const FX=[['Add a third worker','third'],['Acknowledge before processing','ackfirst'],['One queue per consumer, no load balancing','own']];
    FX.forEach((f,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=f[0];
      b.onclick=async()=>{if(b.dataset.busy)return;[...L.$('#r17c').children].forEach(x=>x.dataset.busy=1);b.classList.add('sel');tried++;
        const o=await play(f[1]);if(!o)return;[...L.$('#r17c').children].forEach(x=>delete x.dataset.busy);
        const ok=f[1]==='own';if(!graded){graded=true;L.award(ok);}
        if(ok){L.$('#r17x').insertAdjacentHTML('beforeend','<span id="r17ok"></span>');
          L.sheet('ok','In order','With one consumer per queue, there’s no Worker B to hand m3 to. Worker A crashes on m3, restarts, and gets m3 back before m4. Even when a broker tries to keep order, <b>load balancing plus redelivery</b> reorders messages. That matters when messages depend on each other, as these do.');L.done();}
        else{b.classList.remove('sel');b.classList.add('no');
          L.sheet('no',f[1]==='third'?'Still out of order':'Now a message is lost',f[1]==='third'?'Worker C crashed on m3, and its redelivery came after m4. More workers just mean more chances to reorder. Try another fix.':'Worker B acknowledged m3, then crashed, so the broker deleted it. Mrs. Okoro never hears “Out for delivery”. Try another fix.');}};
      L.$('#r17c').appendChild(b);});};}},
{part:2,src:'Chapter 11 · Multiple consumers',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Load balancing or fan-out?',['Load balancing','Fan-out'],[
   ['Billing, the ETA model and support search each need every scan event.',1,'Each system needs its own copy of every message. That’s fan-out.'],
   ['Six machines share a pile of “print label” jobs, and each label must print once.',0,'Each job goes to one machine, so they share the work.'],
   ['A new fraud-check team wants to tune in to booking events without disturbing anyone.',1,'Fan-out lets a new consumer get every message without affecting the others.'],
   ['During Peak Week, Linh adds two more machines to the notification group so pushes go out faster.',0,'Adding consumers to share the work inside a group is load balancing.']]);}},
