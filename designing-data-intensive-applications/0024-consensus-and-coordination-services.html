<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">

<script>
/* =====================================================================
   Lesson 0024 only. Two hands-on models used across the lesson:
   1. Ladder – the epoch ladder. Columns are Kwame’s five voting nodes,
               rows are votes (elections and proposals), each tagged with
               its epoch. Crash nodes, elect, propose; property badges
               show which consensus promises still hold. A Venn panel
               shows how the election and proposal quorums overlap.
   2. Tree   – a ZooKeeper-style tree. Three route planners race for an
               ephemeral leader key; freeze one and watch its session
               expire, the key vanish and a watcher take over.
   ===================================================================== */
const CSS='<style>'+
 '.cc-fig svg{width:100%;display:block;touch-action:manipulation}.cc-fig svg text{font-family:var(--sans)}'+
 '.cc-cap{font-size:15.5px;line-height:1.5;margin:10px 0 4px}'+
 '.cc-foot{font-size:13px;color:var(--muted);line-height:1.45;margin:6px 0 0}'+
 '.cc-ctl{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.cc-ctl .btn{min-height:42px;padding:8px 12px;margin:0}.cc-ctl .chip{margin:0;min-height:40px}'+
 '.cc-hint{font-size:13px;color:var(--muted);margin:6px 0 4px}'+
 '.cc-nodes{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 4px}.cc-nodes .chip{margin:0;min-width:50px;min-height:40px;justify-content:center;font-weight:600}'+
 '.cc-nodes .chip.down{background:var(--soft);color:var(--muted);border-style:dashed;text-decoration:line-through}.cc-nodes .chip.zz{background:var(--soft);color:var(--muted);border-style:dashed}.cc-nodes .chip.lock{opacity:.55;cursor:default}'+
 '.cc-read{background:var(--soft);border-radius:14px;padding:10px 13px;font-size:14.5px;line-height:1.5;margin:8px 0;min-height:46px}'+
 '.cc-badges{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 2px}'+
 '.cc-b{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;border-radius:99px;padding:4px 9px;border:1.5px solid}.cc-b svg.i{width:13px;height:13px;stroke-width:3}'+
 '.cc-b.ok{color:var(--ok);background:var(--ok-bg);border-color:var(--ok-line)}.cc-b.no{color:var(--no);background:var(--no-bg);border-color:var(--no-line)}.cc-b.wa{color:var(--h3);background:var(--h3-bg);border-color:var(--h3)}'+
 '.cc-dec{font-size:13.5px;color:var(--muted);margin:4px 0}.cc-dec b{color:var(--ink)}.cc-dec .d{display:inline-block;border-radius:8px;padding:1px 7px;margin:2px 4px 2px 0;background:var(--ok-bg);color:var(--ok);font-weight:700}.cc-dec .d.x{background:var(--no-bg);color:var(--no)}'+
 '.cc-goals{margin:8px 0 4px;padding:0;list-style:none}.cc-goals li{display:flex;gap:8px;align-items:center;font-size:14.5px;margin:5px 0;color:var(--muted)}'+
 '.cc-goals li .bx{width:20px;height:20px;border-radius:6px;border:2px solid var(--line2);flex:none;display:inline-flex;align-items:center;justify-content:center}'+
 '.cc-goals li.done{color:var(--ok)}.cc-goals li.done .bx{background:var(--ok-strong);border-color:var(--ok-strong);color:var(--card)}.cc-goals li .bx svg.i{width:13px;height:13px;stroke-width:3}'+
 '.cc-tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.cc-tile{border-radius:14px;padding:8px 9px 10px;border:2px solid var(--line);font-size:13px;line-height:1.35;color:var(--muted);background:var(--card)}'+
 '.cc-tile svg{width:100%;display:block;margin:2px 0 4px}.cc-tile svg text{font-family:var(--sans)}.cc-tile b{display:block;color:var(--ink);font-size:14px;margin-bottom:2px}'+
 '.cc-tag{display:inline-block;font-size:11.5px;font-weight:700;border-radius:99px;padding:2px 8px}.cc-tag.s{background:var(--h1-bg);color:var(--h1)}.cc-tag.l{background:var(--h2-bg);color:var(--h2)}'+
 '.cc-pl{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}.cc-pc{border:2px solid var(--line);border-radius:14px;padding:7px 7px 8px;font-size:12.5px;line-height:1.3;background:var(--card);transition:border-color .2s,background .2s}'+
 '.cc-pc.lead{border-color:var(--ok-line);background:var(--ok-bg)}.cc-pc.ring{border-color:var(--h3);background:var(--h3-bg)}.cc-pc.dead{border-style:dashed;background:var(--soft)}'+
 '.cc-pc b{display:block;font-size:13.5px;color:var(--ink)}.cc-pc .stt{min-height:32px;color:var(--muted);margin:2px 0 4px}.cc-pc .stt svg.i{width:13px;height:13px;vertical-align:-2px}'+
 '.cc-hb{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted)}.cc-hb i{width:9px;height:9px;border-radius:50%;background:var(--line2);display:inline-block}.cc-hb i.on{background:var(--ok-strong);animation:ccbeat 1s infinite}'+
 '@keyframes ccbeat{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.45);opacity:.55}}'+
 '.cc-bar{height:6px;border-radius:9px;background:var(--soft2);margin:5px 0 6px;overflow:hidden}.cc-bar span{display:block;height:100%;width:0;background:var(--no);border-radius:9px}'+
 '.cc-pc .btn{width:100%;justify-content:center;min-height:38px;padding:6px 4px;font-size:13px;margin:0}'+
 '.cc-store{border-radius:14px;padding:9px 12px;font-size:14px;line-height:1.45;border:2px dashed var(--line2);margin:6px 0}'+
 '.ok-t{color:var(--ok);font-weight:700}.no-t{color:var(--no);font-weight:700}.wa-t{color:var(--h3);font-weight:700}'+
 '</style>';

const T=(L,ms)=>L.fast?Math.min(ms,25):ms;
const nap=(L,ms)=>L.sleep(T(L,ms));
function anim(L,ms,fn){return new Promise(res=>{const d=T(L,ms),t0=performance.now();(function st(){const p=Math.min(1,(performance.now()-t0)/d);if(fn(p)===false){res(false);return;}if(p<1)setTimeout(st,16);else res(true);})();});}
const tx=(x,y,s,st)=>'<text x="'+x+'" y="'+y+'" style="'+st+'">'+s+'</text>';
const NM=k=>'N'+(k+1);
const FULL={Okoro:'Mrs. Okoro',Lund:'Mr. Lund',Adeyemi:'Ms. Adeyemi',Haddad:'Mr. Haddad',Silva:'Ms. Silva',nobody:'“nobody”'};
function crownD(x,y0,s){s=s||1;return 'M'+(x-9*s)+' '+y0+'L'+(x-9*s)+' '+(y0-9*s)+'L'+(x-4.5*s)+' '+(y0-4*s)+'L'+x+' '+(y0-11*s)+'L'+(x+4.5*s)+' '+(y0-4*s)+'L'+(x+9*s)+' '+(y0-9*s)+'L'+(x+9*s)+' '+y0+'Z';}
const chk=(x,y,c)=>'<path d="M'+(x-5)+' '+y+'L'+(x-1.5)+' '+(y+3.5)+'L'+(x+5)+' '+(y-4)+'" style="fill:none;stroke:'+(c||'var(--ok)')+';stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round"/>';
const xx=(x,y,s,c)=>'<path d="M'+(x-s)+' '+(y-s)+'L'+(x+s)+' '+(y+s)+'M'+(x+s)+' '+(y-s)+'L'+(x-s)+' '+(y+s)+'" style="fill:none;stroke:'+(c||'var(--no)')+';stroke-width:2.6;stroke-linecap:round"/>';
const node=(x,y,r,t,f,s,dash)=>'<circle cx="'+x+'" cy="'+y+'" r="'+r+'" style="fill:'+(f||'var(--h1-bg)')+';stroke:'+(s||'var(--h1)')+';stroke-width:2'+(dash?';stroke-dasharray:'+dash:'')+'"/>'+(t?tx(x,y+4,t,'font-size:11.5px;font-weight:700;text-anchor:middle;fill:var(--ink)'):'');
const arrowDefs=id=>'<defs><marker id="'+id+'" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--muted)"/></marker></defs>';
function goalsHtml(id,items){return '<ul class="cc-goals" id="'+id+'">'+items.map((t,j)=>'<li data-j="'+j+'"><span class="bx"></span><span>'+t+'</span></li>').join('')+'</ul>';}
function tick(L,id,j){const li=L.$('#'+id+' li[data-j="'+j+'"]');if(li&&!li.classList.contains('done')){li.classList.add('done');li.querySelector('.bx').innerHTML=L.ic('check');}}
function allTicked(L,id){return L.$$('#'+id+' li').every(li=>li.classList.contains('done'));}

/* ---------- 1. The epoch ladder ---------- */
const ST={up:['var(--h1-bg)','var(--h1)',''],down:['var(--soft)','var(--line2)','3 3'],zz:['var(--soft)','var(--line2)','5 4'],cut:['var(--h3-bg)','var(--h3)',''],x:['var(--card)','var(--line2)','2 3']};
function Ladder(L,host,o){
  o=Object.assign({id:'ld',n:5,rows:5,tap:false,badges:true,lock:[],label:'Epoch ladder: one column per voting node, one row per vote',on:null},o||{});
  const ID=o.id;
  const S={n:o.n,extra:0,st:[],know:[],rows:[],top:0,leader:null,believe:{},twin:null,dec:[],mode:'ok',ovr:{},busy:false,anim:true,lastE:[],lastP:[]};
  host.insertAdjacentHTML('beforeend','<div class="cc-fig"><svg id="'+ID+'-s" viewBox="0 0 320 100" role="img" aria-label="'+o.label+'"></svg></div>'+
    (o.tap?'<div class="cc-hint">Tap a node to crash it or bring it back</div><div class="cc-nodes" id="'+ID+'-c"></div>':'')+
    (o.badges?'<div class="cc-badges" id="'+ID+'-b" aria-live="polite"></div>':'')+'<div class="cc-dec" id="'+ID+'-d"></div>');
  const svg=host.querySelector('#'+ID+'-s'),chips=host.querySelector('#'+ID+'-c'),bdg=host.querySelector('#'+ID+'-b'),decEl=host.querySelector('#'+ID+'-d');
  const alive=()=>svg.isConnected;
  const maj=()=>Math.floor(S.n/2)+1;
  function reset(n){S.n=n||o.n;S.extra=0;S.st=Array(S.n).fill('up');S.know=Array(S.n).fill(0);S.rows=[];S.top=0;S.leader=null;S.believe={};S.twin=null;S.dec=[];S.mode='ok';S.ovr={};S.lastE=[];S.lastP=[];}
  reset(o.n);
  function props(){
    const by={};let a=true;S.dec.forEach(d=>{if(by[d.slot]!=null&&by[d.slot]!==d.val)a=false;by[d.slot]=d.val;});
    const up=S.st.filter(s=>s==='up').length;
    const t=S.mode==='dict'?(S.st[0]==='up'?'ok':'no'):(up>=maj()?'ok':'no');
    return Object.assign({a:a?'ok':'no',i:'ok',v:S.dec.some(d=>d.bad)?'no':'ok',t},S.ovr);}
  function paint(){
    if(!alive())return;
    const C=S.n+S.extra,cw=164/C,cx=k=>+(82+cw*(k+.5)).toFixed(1),r=Math.min(13,cw/2-3),fs=C>5?10.5:12,RH=32,y0=72;
    const H=y0+Math.max(1,S.rows.length)*RH+4;svg.setAttribute('viewBox','0 0 320 '+H);
    let s='';
    s+=tx(4,36,'nodes','font-size:11px;fill:var(--muted)')+tx(4,62,'knows','font-size:11px;fill:var(--muted)')+tx(285,36,'result','font-size:11px;text-anchor:middle;fill:var(--muted)');
    for(let k=0;k<C;k++){const x=cx(k),y=32,ext=k>=S.n,st=ext?'x':S.st[k],c=ST[st];
      s+='<circle cx="'+x+'" cy="'+y+'" r="'+r+'" style="fill:'+c[0]+';stroke:'+c[1]+';stroke-width:2.2'+(c[2]?';stroke-dasharray:'+c[2]:'')+'"/>';
      s+=tx(x,y+4,NM(k),'font-size:'+fs+'px;font-weight:700;text-anchor:middle;fill:var(--'+(st==='up'||st==='cut'?'ink':'muted')+')');
      if(st==='down')s+='<circle cx="'+(x+r*.75)+'" cy="'+(y-r*.75)+'" r="6" style="fill:var(--no-bg);stroke:var(--no)"/>'+xx(x+r*.75,y-r*.75,2.6);
      if(st==='zz')s+=tx(x+r*.8,y-r*.55,'z','font-size:11px;font-weight:700;fill:var(--muted)');
      s+=tx(x,62,ext?'—':st==='down'?'down':S.know[k]?'e'+S.know[k]:'—','font-size:11px;text-anchor:middle;fill:var(--'+(st==='down'?'no':'muted')+')');}
    const crowns=[];if(S.leader!=null)crowns.push([S.leader,'solid']);
    Object.keys(S.believe).forEach(k=>{k=+k;if(k!==S.leader)crowns.push([k,S.twin&&S.twin.includes(k)?'solid':'ghost']);});
    crowns.forEach(cr=>{const x=cx(cr[0]),y0c=32-r-1;s+='<path d="'+crownD(x,y0c,.75)+'" style="'+(cr[1]==='solid'?'fill:var(--h4);stroke:var(--h4)':'fill:var(--card);stroke:var(--no);stroke-dasharray:2 2')+';stroke-width:1.4;stroke-linejoin:round"/>';});
    S.rows.forEach((rw,i)=>{const y=y0+i*RH;
      if(i%2===0)s+='<rect x="0" y="'+y+'" width="320" height="'+RH+'" rx="7" style="fill:var(--soft)"/>';
      s+='<rect x="3" y="'+(y+8)+'" width="28" height="17" rx="8" style="fill:var(--pri-bg)"/>'+tx(17,y+20.5,rw.e==null?'—':'E'+rw.e,'font-size:11px;font-weight:700;text-anchor:middle;fill:var(--pri-deep)');
      s+=tx(35,y+21,rw.kind==='elect'?'elect':rw.val,'font-size:11px;'+(rw.kind==='elect'?'font-style:italic;fill:var(--muted)':'font-weight:600;fill:var(--ink)'));
      for(let k=0;k<C;k++){if(k>=rw.shown)break;const x=cx(k),yc=y+16,v=k<rw.cells.length?rw.cells[k]:'o',rr=Math.min(10,r);
        if(v==='L')s+='<circle cx="'+x+'" cy="'+yc+'" r="'+rr+'" style="fill:var(--h4-bg);stroke:var(--h4);stroke-width:1.6"/><path d="'+crownD(x,yc+4,.55)+'" style="fill:var(--h4);stroke:var(--h4);stroke-width:1;stroke-linejoin:round"/>';
        else if(v==='y')s+='<circle cx="'+x+'" cy="'+yc+'" r="'+rr+'" style="fill:var(--ok-bg);stroke:var(--ok-line);stroke-width:1.6"/>'+chk(x,yc);
        else if(v==='n')s+='<rect x="'+(x-12)+'" y="'+(yc-9)+'" width="24" height="18" rx="6" style="fill:var(--no-bg);stroke:var(--no-line);stroke-width:1.4"/>'+tx(x,yc+4,(rw.tags&&rw.tags[k])||'no','font-size:10.5px;font-weight:700;text-anchor:middle;fill:var(--no)');
        else if(v==='-')s+='<line x1="'+(x-6)+'" y1="'+yc+'" x2="'+(x+6)+'" y2="'+yc+'" style="stroke:var(--line2);stroke-width:2.4;stroke-linecap:round"/>';
        else s+='<circle cx="'+x+'" cy="'+yc+'" r="2.5" style="fill:var(--line2)"/>';}
      if(rw.shown>=C){const col=rw.ok?'var(--ok)':'var(--no)';s+=tx(285,y+14,rw.res1,'font-size:11px;font-weight:700;text-anchor:middle;fill:'+col)+tx(285,y+27,rw.res2,'font-size:11px;text-anchor:middle;fill:'+col);}});
    if(!S.rows.length)s+=tx(160,y0+20,'No votes yet','font-size:12px;text-anchor:middle;fill:var(--muted)');
    svg.innerHTML=s;
    if(chips){chips.innerHTML=S.st.map((st,k)=>'<button class="chip '+st+(o.lock.includes(k)?' lock':'')+'" data-k="'+k+'" aria-label="'+NM(k)+': '+({up:'running',down:'crashed',zz:'frozen',cut:'cut off'}[st])+'. Tap to change">'+NM(k)+'</button>').join('');
      chips.querySelectorAll('button').forEach(b=>{b.onclick=()=>tap(+b.dataset.k);});}
    if(bdg){const p=props(),B=[['a','Agreement'],['i','Integrity'],['v','Validity'],['t','Termination']];
      bdg.innerHTML=B.map(b=>'<span class="cc-b '+p[b[0]]+'">'+L.ic(p[b[0]]==='ok'?'check':p[b[0]]==='no'?'x':'clock')+b[1]+(p[b[0]]==='wa'?' (barely)':'')+'</span>').join('');}
    const by={};S.dec.forEach(d=>{(by[d.slot]=by[d.slot]||[]).push(d);});
    decEl.innerHTML='<b>Decided:</b> '+(S.dec.length?Object.keys(by).map(sl=>by[sl].map(d=>'<span class="d'+(by[sl].length>1||d.bad?' x':'')+'">#'+sl+' '+d.val+'</span>').join('')).join(''):'nothing yet');
  }
  async function addRow(rw){
    const C=S.n+S.extra;rw.shown=0;S.rows.push(rw);if(S.rows.length>o.rows)S.rows.shift();
    if(!S.anim){rw.shown=C;paint();return;}
    for(let k=0;k<=C;k++){rw.shown=k;paint();await nap(L,k<C?120:60);if(!alive())return;}
    rw.shown=C;paint();}
  async function elect(cand){
    const n=S.n,e=++S.top;let c=cand;
    if(c==null){const ups=[...Array(n).keys()].filter(k=>S.st[k]==='up');c=ups.find(k=>k!==S.leader);if(c==null)c=ups[0];}
    if(c==null){await addRow({e,kind:'elect',cells:S.st.map(()=>'-'),res1:'0 of '+n,res2:'no leader',ok:false});return {ok:false,yes:0,e};}
    const cells=S.st.map((s,k)=>k===c?'L':s==='up'?'y':'-');
    const yes=cells.filter(x=>x!=='-').length,ok=yes>=maj();
    if(ok){cells.forEach((x,k)=>{if(x!=='-'){S.know[k]=e;if(k!==c)delete S.believe[k];}});S.believe[c]=e;S.leader=c;S.lastE=cells.map((x,k)=>x!=='-'?k:-1).filter(k=>k>=0);}
    await addRow({e,kind:'elect',cells,res1:yes+' of '+n,res2:ok?'leader '+NM(c):'no leader',ok});
    return {ok,yes,e,c};}
  async function propose(val,by,bad){
    if(by==null)by=S.leader;
    if(by==null||S.believe[by]==null||S.st[by]!=='up')return {ok:false,why:'nolead'};
    const eb=S.believe[by],n=S.n,slot=S.dec.length+1,tags=[];let cells;
    if(S.mode==='dict')cells=S.st.map((s,k)=>k===by?'L':'o');
    else cells=S.st.map((s,k)=>{if(k===by)return 'L';if(s!=='up')return '-';if(S.know[k]>eb){tags[k]='e'+S.know[k];return 'n';}return 'y';});
    const yes=cells.filter(x=>x==='L'||x==='y').length,ok=S.mode==='dict'?true:yes>=maj();
    if(ok){cells.forEach((x,k)=>{if(x==='y')S.know[k]=Math.max(S.know[k],eb);});S.dec.push({slot,val,e:eb,by,bad:!!bad});S.lastP=cells.map((x,k)=>x==='L'||x==='y'?k:-1).filter(k=>k>=0);}
    else if(cells.includes('n')){delete S.believe[by];S.know[by]=Math.max(...S.know);}
    await addRow({e:S.mode==='dict'?null:eb,kind:'prop',val,cells,tags,res1:S.mode==='dict'?NM(by)+' alone':yes+' of '+n,res2:ok?'decided':'refused',ok});
    return {ok,yes,slot,cells};}
  function tap(k){if(!o.tap||S.busy||o.lock.includes(k))return;
    S.st[k]=S.st[k]==='up'?'down':'up';paint();if(o.on)o.on({type:'tap',k,st:S.st[k]});}
  const api={S,reset,paint,elect,propose,addRow,alive,maj,props};
  L.ld=api;return api;}

/* Venn panel: election quorum (blue) vs proposal votes (amber) */
function vennSvg(n,E,P,o){
  o=o||{};const both=E.filter(k=>P.includes(k)),eo=E.filter(k=>!P.includes(k)),po=P.filter(k=>!E.includes(k)),none=[];
  for(let k=0;k<n;k++)if(!E.includes(k)&&!P.includes(k))none.push(k);
  const ys=(m,i)=>94+(i-(m-1)/2)*27;
  const tok=(x,y,k,col)=>'<circle cx="'+x+'" cy="'+y+'" r="12" style="fill:var(--card);stroke:'+col+';stroke-width:2.2"/>'+tx(x,y+4,NM(k),'font-size:11.5px;font-weight:700;text-anchor:middle;fill:var(--ink)')+
    ((o.no||[]).includes(k)?'<circle cx="'+(x+11)+'" cy="'+(y-10)+'" r="6.5" style="fill:var(--no-bg);stroke:var(--no)"/>'+xx(x+11,y-10,2.8):'');
  let s='<svg viewBox="0 0 320 186" role="img" aria-label="'+(o.aria||'Two overlapping circles: the election quorum and the proposal votes')+'">';
  s+='<circle cx="122" cy="94" r="66" style="fill:var(--h1-bg);fill-opacity:.75;stroke:var(--h1);stroke-width:2"/>';
  s+='<circle cx="198" cy="94" r="66" style="fill:var(--h3-bg);fill-opacity:.75;stroke:var(--h3);stroke-width:2"/>';
  s+=tx(88,17,o.la||'Election quorum','font-size:12px;font-weight:700;text-anchor:middle;fill:var(--h1)')+tx(232,17,o.lb||'Proposal votes','font-size:12px;font-weight:700;text-anchor:middle;fill:var(--h3)');
  eo.forEach((k,i)=>{s+=tok(90,ys(eo.length,i),k,'var(--h1)');});
  both.forEach((k,i)=>{s+=tok(160,ys(both.length,i),k,'var(--ok-strong)');});
  po.forEach((k,i)=>{s+=tok(230,ys(po.length,i),k,'var(--h3)');});
  if(!both.length&&o.gap)s+=tx(160,90,o.gap[0],'font-size:11px;font-weight:700;text-anchor:middle;fill:var(--no)')+tx(160,104,o.gap[1],'font-size:11px;font-weight:700;text-anchor:middle;fill:var(--no)');

/* ---------- 2. The coordination tree ---------- */
const PN=['Planner A','Planner B','Planner C'];
function Tree(L,host,o){
  o=Object.assign({id:'tr',on:null,branches:true,freeze:true},o||{});
  const ID=o.id;
  const S={lead:null,zx:1040,tok:[null,null,null],sess:[1,1,1],frozen:[0,0,0],bar:[0,0,0],watch:[0,0,0],ring:[0,0,0],store:0,storeMsg:'No writes yet',started:false,busy:false,open:null,gone:false};
  host.insertAdjacentHTML('beforeend','<div class="cc-fig"><svg id="'+ID+'-s" viewBox="0 0 320 194" role="img" aria-label="A coordination-service tree for Otterpost: the Westport planner leader key, dispatch members, partition 7 and the merchant API address"></svg></div>'+
    (o.branches?'<div class="cc-ctl" id="'+ID+'-br"></div>':'')+'<div class="cc-pl" id="'+ID+'-p"></div><div class="cc-store" id="'+ID+'-st" aria-live="polite"></div>');
  const svg=host.querySelector('#'+ID+'-s'),pl=host.querySelector('#'+ID+'-p'),stEl=host.querySelector('#'+ID+'-st'),br=host.querySelector('#'+ID+'-br');
  const alive=()=>svg.isConnected;
  const BR=[['lead','planners/westport'],['mem','members/dispatch'],['part','partitions/p7'],['svc','services/merchant-api']];
  function paint(){
    if(!alive())return;
    let s='';const Y=[44,90,134,174];
    s+=tx(6,16,'/otterpost','font-size:13px;font-weight:700;fill:var(--ink)');
    s+='<line x1="14" y1="22" x2="14" y2="'+Y[3]+'" style="stroke:var(--line2);stroke-width:2"/>';
    BR.forEach((b,j)=>{const y=Y[j],on=S.open===b[0];
      s+='<line x1="14" y1="'+y+'" x2="26" y2="'+y+'" style="stroke:var(--line2);stroke-width:2"/>';
      s+=tx(30,y+4,b[1],'font-size:11.5px;'+(on?'font-weight:700;fill:var(--pri)':'fill:var(--ink)'));});
    const pill=(y,l1,l2,eph,col,bg,dim)=>'<rect x="176" y="'+(y-16)+'" width="140" height="32" rx="10" style="fill:'+(bg||'var(--card)')+';stroke:'+(col||'var(--line2)')+';stroke-width:2'+(eph?';stroke-dasharray:5 3':'')+'"/>'+
      tx(246,y-2,l1,'font-size:11.5px;font-weight:700;text-anchor:middle;fill:'+(dim?'var(--muted)':'var(--ink)'))+(l2?tx(246,y+11,l2,'font-size:11px;text-anchor:middle;fill:var(--muted)'):'');
    if(S.lead!=null)s+=pill(Y[0],'leader → '+PN[S.lead],'ephemeral · zxid '+S.tok[S.lead],true,'var(--ok-line)','var(--ok-bg)');
    else if(S.gone)s+=pill(Y[0],'leader key deleted','session timed out',true,'var(--no)','var(--no-bg)');
    else s+=pill(Y[0],'(no leader key)',S.started?'racing…':'planners not started',true,'var(--line2)','var(--soft)',true);
    ['w1','w2','w3'].forEach((w,j)=>{const x=176+j*48;s+='<rect x="'+x+'" y="'+(Y[1]-13)+'" width="44" height="26" rx="9" style="fill:var(--h1-bg);stroke:var(--h1);stroke-width:2;stroke-dasharray:5 3"/>'+tx(x+22,Y[1]+4,w,'font-size:11.5px;font-weight:700;text-anchor:middle;fill:var(--ink)');});
    s+=pill(Y[2],'leader: 10.1.1.23','changes over hours',false,'var(--h2)','var(--h2-bg)');
    s+=pill(Y[3],'10.1.4.8','merchant API address',false,'var(--h4)','var(--h4-bg)');
    if(S.open){const j=BR.findIndex(b=>b[0]===S.open);s+='<rect x="2" y="'+(Y[j]-19)+'" width="316" height="38" rx="11" style="fill:none;stroke:var(--pri);stroke-width:2"/>';}
    svg.innerHTML=s;
    pl.innerHTML=PN.map((nm,k)=>{const lead=S.lead===k,dead=!S.sess[k];
      let st=!S.started?'idle':dead?(S.frozen[k]?'frozen · session expired':'session expired · lock gone'):S.frozen[k]?(lead?'frozen… still thinks it leads':'frozen'):lead?'<span class="ok-t">leader · token '+S.tok[k]+'</span>':S.ring[k]?L.ic('alert')+' <b style="display:inline;font-size:12.5px;color:var(--h3)">notified!</b>':S.watch[k]?L.ic('eye')+' watching the key':'racing…';
      const hb=S.started&&!S.frozen[k]&&S.sess[k];
      return '<div class="cc-pc'+(lead&&!dead?' lead':'')+(S.ring[k]?' ring':'')+(dead?' dead':'')+'"><b>'+nm+'</b><div class="stt">'+st+'</div>'+
        '<div class="cc-hb"><i class="'+(hb?'on':'')+'"></i>'+(hb?'heartbeats':'no heartbeats')+'</div><div class="cc-bar" title="session timeout"><span style="width:'+Math.round(S.bar[k]*100)+'%"></span></div>'+
        (o.freeze&&S.started&&!S.frozen[k]&&S.sess[k]?'<button class="btn" id="'+ID+'-f'+k+'" aria-label="Freeze '+nm+': its heartbeats stop">'+L.ic('pause')+'Freeze</button>':'')+'</div>';}).join('');
    PN.forEach((nm,k)=>{const b=host.querySelector('#'+ID+'-f'+k);if(b)b.onclick=()=>freeze(k);});
    stEl.innerHTML='<b>Routes store</b> · highest token seen: <b>'+(S.store||'—')+'</b><br>'+S.storeMsg;
    if(br){br.innerHTML=BR.map(b=>'<button class="chip'+(S.open===b[0]?' sel':'')+'" data-b="'+b[0]+'">'+({lead:'Leader key',mem:'Members',part:'Partition 7',svc:'Merchant API'}[b[0]])+'</button>').join('');
      br.querySelectorAll('button').forEach(b=>{b.onclick=()=>{S.open=b.dataset.b;paint();if(o.on)o.on({type:'open',b:S.open});};});}
  }
  function write(k){const t=S.tok[k];if(t>=S.store){S.store=t;S.storeMsg='<span class="ok-t">✓</span> '+PN[k]+' writes routes with token '+t;}else S.storeMsg='<span class="no-t">✗</span> '+PN[k]+'’s write with token '+t+' refused: it has already seen '+S.store;}
  async function start(){if(S.started||S.busy)return;S.busy=true;S.started=true;paint();await nap(L,600);if(!alive())return;
    S.zx=1041;S.lead=0;S.tok[0]=1041;S.watch=[0,1,1];paint();await nap(L,450);if(!alive())return;write(0);paint();S.busy=false;if(o.on)o.on({type:'start'});}
  function setStarted(){S.started=true;S.zx=1041;S.lead=0;S.tok[0]=1041;S.watch=[0,1,1];write(0);paint();}
  async function freeze(k){if(S.busy||S.frozen[k]||!S.sess[k])return;S.busy=true;S.frozen[k]=1;paint();if(o.on)o.on({type:'freeze',k});
    const ok=await anim(L,1500,p=>{if(!alive())return false;S.bar[k]=p;const e=host.querySelector('#'+ID+'-p .cc-pc:nth-child('+(k+1)+') .cc-bar span');if(e)e.style.width=Math.round(p*100)+'%';});if(!ok)return;
    S.sess[k]=0;S.watch[k]=0;
    if(S.lead===k){S.lead=null;S.gone=true;paint();await nap(L,600);if(!alive())return;
      const w=[0,1,2].filter(j=>S.watch[j]&&S.sess[j]);w.forEach(j=>S.ring[j]=1);paint();await nap(L,700);if(!alive())return;
      w.forEach(j=>S.ring[j]=0);
      if(w.length){const j=w[0];S.zx+=5;S.lead=j;S.tok[j]=S.zx;S.watch[j]=0;S.gone=false;paint();await nap(L,450);if(!alive())return;write(j);if(o.on)o.on({type:'takeover',k:j});}
      else S.storeMsg='No planner left to take over';}
    paint();S.busy=false;}
  async function wake(k){if(!S.frozen[k])return;S.frozen[k]=0;paint();await nap(L,350);if(!alive())return;write(k);paint();if(o.on)o.on({type:'wake',k});}
  async function idle(){for(let i=0;i<300&&S.busy;i++)await L.sleep(15);}
  paint();
  const api={S,paint,start,setStarted,freeze,wake,idle,alive};L.tr=api;return api;}

Course.lesson({
  id:'0024', title:'Consensus and coordination services', minutes:20, icon:'people',
  goals:['Name the four properties of consensus and why it needs a majority','Use epochs and overlapping quorums to show why a stale leader can’t decide','Choose when to lean on a coordination service like ZooKeeper or etcd'],
  parts:['What consensus means','Epochs and quorums','The price','Coordination services'],
  read:'Read chapter 9 from “Fault-Tolerant Consensus” to the end of the chapter summary for the details, including the ZooKeeper features and the list of problems equivalent to consensus.',
  glossary:{
    'twopc':'Two-phase commit (2PC): an algorithm for atomic commit across nodes. A coordinator first asks every participant “can you commit?” (prepare), and only if all say yes tells them all to commit.',
    tob:'Total order broadcast: a way of sending messages so that none are lost and every node gets them in exactly the same order. Also called atomic broadcast.',
    'epoch':'Epoch number: a number that goes up with every leader election (Paxos calls it the ballot number, Viewstamped Replication the view number, Raft the term number). Within one epoch there is at most one leader.',
    quorum:'Quorum: a minimum number of nodes that must vote for a decision. Usually a majority, more than half of all nodes.',
    'coordination-service':'Coordination service: a small, highly reliable store, such as ZooKeeper, that other systems use to agree on shared facts like “which node holds which partition”.',
    'ephemeral':'Ephemeral node: a ZooKeeper entry tied to a client’s session. If the session times out, the entry is deleted automatically, releasing any lock it stood for.',
    fencing:'Fencing token: a number that goes up every time a lock or lease is granted. The protected resource rejects any request carrying a lower number than one it has already seen.',
    byzantine:'Byzantine fault: a node that doesn’t follow the protocol, such as by sending conflicting or hostile messages. Most consensus algorithms assume there are none. Consensus can still be solved if fewer than a third of the nodes are Byzantine-faulty.',
    'split-brain':'Split brain: two nodes both believe they are the leader and both accept writes, which can lose or corrupt data.'
  },
  cheatsheet:[
    '<b>Consensus</b>: nodes propose values and all decide on one. Properties: uniform agreement, integrity, validity, termination.',
    '<b>Termination</b> is the fault-tolerance part and needs a majority up. Safety holds even without one: an outage stalls decisions but can’t corrupt them. 2PC fails termination.',
    'Viewstamped Replication, Paxos, Raft and Zab decide a <b>sequence</b> of values: they are total order broadcast.',
    'At most one leader per <b>epoch</b>. Every decision needs a second quorum vote, and the election and proposal quorums overlap, so a stale leader always meets a node that knows better.',
    'Costs: synchronous voting, 3 nodes to survive 1 failure (5 for 2), mostly fixed membership, trouble with timeouts on flaky networks.',
    '<b>ZooKeeper / etcd</b>: linearizable atomic operations, total order (zxid as fencing token), sessions with ephemeral nodes, change notifications. Small, slow-changing data only.',
    'Compare-and-set, atomic commit, total order broadcast, locks and leases, membership and uniqueness are all <b>equivalent to consensus</b>.',
    'A leader only moves consensus elsewhere. Don’t build your own: use a proven algorithm or service.'
  ],
  steps:[
/* ---------- PART 1: WHAT CONSENSUS MEANS ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.fast=false;
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Mrs. Okoro and Mr. Lund grab the last place in the 6–7 pm delivery slot at the same moment, through two different servers. How many should get it?</h1>');
  L.mc(L.card,['Both: the courier can squeeze one more in','Exactly one, and every server must agree which'],1,
   'Both can’t win. Something has to pick one, and every server has to agree on the pick. That’s the consensus problem.',
   'The slot has a fixed number of places, so only one request can win, and every server must agree which. That’s the consensus problem.');}},
{part:0,src:'Chapter 9 · Fault-Tolerant Consensus',run(L){
  L.h(L.kick('learn','Consensus, stated precisely')+'<h1 class="q">Propose, then decide</h1>'+CSS+FIG_PROPOSE()+
   '<p class="cc-cap">Each server <b>proposes</b> the recipient it’s serving. The '+L.g('consensus','consensus')+' algorithm <b>decides</b> on one proposal, and every server gets the same answer. The others hear: sorry, the place is gone.</p>');
  L.done();}},
{part:0,src:'Chapter 9 · Fault-Tolerant Consensus',run(L){
  L.h(L.kick('learn','Four promises')+'<h1 class="q">Each property forbids one thing</h1>'+CSS+FIG_PROPS(L)+
   '<p class="cc-cap">Agreement and integrity are the heart: one answer, and it’s final. Validity rules out cheats like always deciding “nobody”. Termination is the promise of progress.</p>');
  L.done();}},
{part:0,src:'Chapter 9 · Fault-Tolerant Consensus',run(L){
  L.h(L.kick('learn','Where fault tolerance comes in')+'<h1 class="q">A dictator can agree. It just can’t survive.</h1>'+CSS+FIG_DICT()+
   '<p class="cc-cap">One “dictator” node meets the first three easily. That’s '+L.g('twopc','2PC')+': if the coordinator dies, nobody decides, and a crashed node counts as gone for good. Nodes are assumed honest (no '+L.g('byzantine','Byzantine faults')+').</p>');
  L.done();}},
{part:0,src:'Chapter 9 · Fault-Tolerant Consensus',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which property is broken?',['Uniform agreement','Integrity','Validity','Termination'],[
   ['Server 1 tells Mrs. Okoro they got the last place. Server 2 tells Mr. Lund they did.',0,'Two nodes decided differently.'],
   ['Server 3 decides Mrs. Okoro, then later switches its decision to Mr. Lund.',1,'A node decided twice: it changed its mind.'],
   ['Tobias’s algorithm always decides “nobody gets the place”, whatever was proposed.',2,'Every node agrees and never changes its mind, but nobody proposed “nobody”.'],
   ['A healthy server waits forever because the one node it relies on was destroyed.',3,'A node that didn’t crash never decides. No progress.'],
   ['Under 2PC, a participant stays in doubt because the coordinator never comes back.',3,'2PC waits for the coordinator to recover, so it doesn’t meet termination.']]);}},

/* ---------- PART 2: EPOCHS AND QUORUMS ---------- */
{part:1,src:'Chapter 9 · Consensus algorithms and total order broadcast',run(L){
  L.h(L.kick('learn','Real algorithms')+'<h1 class="q">They agree on a whole sequence, not one value</h1>'+CSS+FIG_TOB()+
   '<p class="cc-cap">Viewstamped Replication, Paxos, Raft and Zab decide a <b>sequence</b>: each log slot is one round of consensus. That makes them '+L.g('tob','total order broadcast')+'. Know their shared ideas, and don’t build your own: it’s hard.</p>');
  L.done();}},
{part:1,src:'Chapter 9 · Single-leader replication and consensus',run(L){
  L.h(L.kick('learn','A chicken-and-egg problem')+'<h1 class="q">To elect a leader, you first need… a leader?</h1>'+CSS+FIG_LOOP()+
   '<p class="cc-cap">Automatic failover must stop two nodes both thinking they lead ('+L.g('split-brain','split brain')+'). That takes consensus. If humans pick the leader instead, it works, but writes stop until they act: no termination.</p>');
  L.done();}},
{part:1,src:'Chapter 9 · Epoch numbering and quorums',run(L){
  L.h(L.kick('learn','The way out')+'<h1 class="q">One leader per epoch, and two rounds of voting</h1>'+CSS+FIG_EPOCH()+
   '<p class="cc-cap">Each election gets a higher '+L.g('epoch','epoch number')+'; in a clash, the higher epoch wins. Then every decision needs a second '+L.g('quorum','quorum')+' vote. A node votes yes only if it knows no higher epoch.</p>');
  L.done();}},
{part:1,src:'Chapter 9 · Epoch numbering and quorums',
 solve:async L=>{L.fast=true;const h=()=>L.ld;const w=async()=>{for(let i=0;i<200&&h().S.busy;i++)await L.sleep(15);};
   L.$('#x9p').click();await w();L.$('#ld9-c button[data-k="0"]').click();await L.sleep(10);L.$('#x9e').click();await w();L.$('#x9p').click();await w();},
 run(L){
  L.fast=false;
  L.h(L.kick('ex','Try it live · the epoch ladder')+'<h1 class="q">Kwame’s five nodes decide who gets each last slot place. Crash the leader and keep deciding.</h1>'+CSS+
   goalsHtml('g9',['Get a place decided in epoch 1','Crash leader N1, then elect a new leader','Get a place decided by the new leader'])+
   '<div id="l9"></div><div class="cc-ctl"><button class="btn pri" id="x9p">'+L.ic('play')+'Propose next place</button><button class="btn" id="x9e">'+L.ic('cycle')+'Elect a new leader</button></div><div class="cc-read" id="r9" aria-live="polite"></div>');
  const NAMES=['Okoro','Lund','Adeyemi','Haddad','Silva'];let ni=0;

  say('Epoch 1: N1 won the election with 5 of 5 votes (the crown). Press <b>Propose</b> to decide who gets the first last place.');
  const fin=()=>{if(allTicked(L,'g9')&&!L.$('#ok9')){L.$('#g9').insertAdjacentHTML('afterend','<span id="ok9"></span>');
    L.sheet('info','Two rounds, every time','A majority elects the epoch’s leader. Then each proposal needs its own majority of yes votes. Crash two and it still works; crash three and the ladder fills with refusals.');L.done();}};
  L.$('#x9p').onclick=async()=>{if(h.S.busy)return;h.S.busy=true;const v=NAMES[ni%NAMES.length];
    const r=await h.propose(v);h.S.busy=false;if(!h.alive())return;
    if(r.why==='nolead'){say('No live leader: '+NM(h.S.leader)+' is down, so nobody may propose. Press <b>Elect a new leader</b>.');return;}
    ni++;
    if(r.ok){say('Decided: '+FULL[v]+' gets place #'+r.slot+', with '+r.yes+' of 5 yes votes in epoch '+h.S.believe[h.S.leader]+'.');tick(L,'g9',h.S.top===1?0:2);if(h.S.top>1&&h.S.st[0]!=='up')tick(L,'g9',2);}
    else say('Only '+r.yes+' of 5 voted yes: no majority, so nothing is decided. Stuck, but nothing wrong happened.');fin();};
  L.$('#x9e').onclick=async()=>{if(h.S.busy)return;h.S.busy=true;const old=h.S.leader;const r=await h.elect();h.S.busy=false;if(!h.alive())return;
    if(r.ok){say('Epoch '+r.e+': '+NM(r.c)+' collects '+r.yes+' of 5 votes and leads. Every voter now knows epoch '+r.e+'.');if(h.S.st[old]==='down')tick(L,'g9',1);}
    else say('Epoch '+r.e+': only '+r.yes+' of 5 nodes answer. No majority, no leader.');fin();};}},
{part:1,src:'Chapter 9 · Epoch numbering and quorums',
 solve:async L=>{const c=k=>L.$('#v10-n button[data-k="'+k+'"]').click();c(0);c(1);c(2);await L.sleep(10);L.$('#v10-q2').click();await L.sleep(10);c(0);c(1);},
 run(L){
  L.fast=false;let q=3,P=[];
  L.h(L.kick('ex','Try to break it')+'<h1 class="q">Can a proposal dodge the latest election’s voters?</h1>'+CSS+
   goalsHtml('g10',['With majorities: pick 3 proposal voters, avoiding the blue circle if you can','Switch to quorums of 2 and find voters with no overlap'])+
   '<div class="cc-ctl"><button class="chip sel" id="v10-q3">Majority: 3 of 5</button><button class="chip" id="v10-q2">Just 2 of 5</button></div>'+
   '<div class="cc-fig" id="v10"></div><div class="cc-hint">Tap nodes to choose who votes for the proposal</div><div class="cc-nodes" id="v10-n"></div><div class="cc-read" id="r10" aria-live="polite"></div>');
  const E=()=>q===3?[2,3,4]:[3,4];
  const draw=()=>{const both=E().filter(k=>P.includes(k));
    L.$('#v10').innerHTML=vennSvg(5,E(),P,{la:'Elected leader in E3',lb:'Proposal votes',gap:P.length===q?['no','overlap']:null});
    L.$('#v10-n').innerHTML=[0,1,2,3,4].map(k=>'<button class="chip'+(P.includes(k)?' sel':'')+'" data-k="'+k+'">'+NM(k)+'</button>').join('');
    L.$$('#v10-n button').forEach(b=>{b.onclick=()=>{const k=+b.dataset.k;if(P.includes(k))P=P.filter(x=>x!==k);else{P.push(k);if(P.length>q)P.shift();}draw();};});
    let t;
    if(P.length<q)t='Pick '+q+' proposal voters ('+P.length+' of '+q+'). The blue circle voted in epoch 3’s election, so they know epoch 3.';
    else if(both.length){t='<span class="ok-t">Overlap: '+both.map(NM).join(', ')+'.</span> '+(both.length>1?'They':'It')+' voted in epoch 3’s election, so a stale epoch-2 leader asking for this vote would be refused.';if(q===3)tick(L,'g10',0);}
    else{t='<span class="no-t">No overlap!</span> A stale epoch-2 leader could collect these 2 votes and decide, while the epoch-3 leader decides something else: two answers.';if(q===2)tick(L,'g10',1);}
    L.$('#r10').innerHTML=t;
    if(allTicked(L,'g10')&&!L.$('#ok10')){L.$('#g10').insertAdjacentHTML('afterend','<span id="ok10"></span>');
      L.sheet('info','Two majorities always share a node','3 + 3 = 6, more than 5, so any two majorities of five overlap. The shared node took part in the newest election and refuses an older epoch. Quorums that don’t overlap can miss each other, and then two leaders can both decide.');L.done();}};
  L.$('#v10-q3').onclick=function(){q=3;P=[];this.classList.add('sel');L.$('#v10-q2').classList.remove('sel');draw();};
  L.$('#v10-q2').onclick=function(){q=2;P=[];this.classList.add('sel');L.$('#v10-q3').classList.remove('sel');draw();};
  draw();}},
{part:1,src:'Chapter 9 · Epoch numbering and quorums',pts:1,
 solve:async L=>{L.fast=true;L.$('#p11').children[1].click();for(let i=0;i<200&&!L.$('#p11d');i++)await L.sleep(20);},
 run(L){
  L.fast=false;let pick=null;
  L.h(L.kick('try','Predict, then watch')+'<h1 class="q">While N1 (epoch 2) was frozen and N5 down, N2 won epoch 3. Now both are back, and N1 still thinks it leads. It proposes Mr. Lund. What happens?</h1>'+CSS+
   '<div id="l11"></div><div class="cc-ctl" id="p11" style="flex-direction:column;align-items:stretch"></div><div id="v11" class="cc-fig"></div><div id="p11x"></div>');
  const h=Ladder(L,L.$('#l11'),{id:'ld11',label:'Epoch ladder before N1 proposes'});
  (async()=>{h.S.anim=false;h.S.top=1;await h.elect(0);await h.propose('Okoro');h.S.st[0]='zz';h.S.st[4]='down';await h.elect(1);h.S.st[4]='up';h.S.st[0]='up';h.S.anim=true;h.paint();})();
  ['Decided: N1 and N5 both vote yes, and that’s enough','Refused: N1 can’t reach a majority without someone who knows epoch 3','Decided twice: N1’s answer and N2’s answer both stand'].forEach((t,j)=>{
    const b=document.createElement('button');b.className='chip';b.style.textAlign='left';b.textContent=t;
    b.onclick=async()=>{if(pick!==null)return;pick=j;b.classList.add('sel');
      await nap(L,250);if(!h.alive())return;h.S.busy=true;await h.propose('Lund',0);h.S.busy=false;if(!h.alive())return;
      L.$('#v11').innerHTML=vennSvg(5,[1,2,3],[0,4],{la:'Elected N2 in E3',lb:'Yes to N1',no:[1,2,3],gap:['3rd vote','refused'],aria:'N2, N3 and N4 voted in the epoch 3 election and refuse N1. Only N1 and N5 vote yes.'});
      const ok=j===1;L.award(ok);
      L.sheet(ok?'ok':'no',ok?'Right: the stale leader is refused':'N1’s proposal is refused','N5 missed the news and votes yes, but that’s only 2 of 5. A third vote would have to come from N2, N3 or N4, and each answers “I know epoch 3”. N1 learns it was replaced and steps down.');
      L.$('#p11x').innerHTML='<span id="p11d"></span>';L.done();};
    L.$('#p11').appendChild(b);});}},
{part:1,src:'Chapter 9 · Epoch numbering and quorums',run(L){

/* ---------- PART 3: THE PRICE ---------- */
{part:2,src:'Chapter 9 · Limitations of consensus',run(L){
  L.h(L.kick('learn','Limitations of consensus')+'<h1 class="q">A huge breakthrough, with a price</h1>'+CSS+FIG_PRICE()+
   '<p class="cc-cap">Consensus gives safe, '+L.g('linearizability','linearizable')+' decisions while a majority is up. The price: every write waits for votes. So many databases still pick asynchronous replication: faster, but it can lose committed data on failover.</p>');
  L.done();}},
{part:2,src:'Chapter 9 · Limitations of consensus',
 solve:async L=>{L.fast=true;for(const id of ['crash3','flaky','dict','nobody','sixth','tobias']){L.$('#e14-'+id).click();for(let i=0;i<300&&L.ld.S.busy;i++)await L.sleep(15);await L.sleep(10);}},
 run(L){
  L.fast=false;const tried=new Set();
  L.h(L.kick('pr','Edge cases')+'<h1 class="q">Where does consensus stall, or break? Run each preset and watch the four badges.</h1>'+CSS+
   '<div class="cc-ctl"><button class="chip" id="e14-crash3">Crash 3 of 5</button><button class="chip" id="e14-flaky">Flaky network</button><button class="chip" id="e14-dict">Dictator node</button><button class="chip" id="e14-nobody">Always “nobody”</button><button class="chip" id="e14-sixth">Add a 6th node</button><button class="chip" id="e14-tobias">Tobias’s heartbeat rule</button></div>'+
   '<div id="l14"></div><div class="cc-read" id="r14" aria-live="polite">Pick a preset. Try at least four.</div>');
  const h=Ladder(L,L.$('#l14'),{id:'ld14',rows:6});h.S.anim=false;h.elect(0).then(()=>{h.S.anim=true;h.paint();});
  const say=t=>{L.$('#r14').innerHTML=t;};
  const base=async()=>{h.reset(5);h.S.anim=false;await h.elect(0);await h.propose('Okoro');h.S.anim=true;h.paint();};
  const P={
   crash3:async()=>{await base();h.S.st=['down','down','down','up','up'];h.paint();await h.elect();
     say('Three of five crash. N4 calls an election and gets only 2 votes: no leader, nothing more decided. <b>Termination</b> is lost, but the other three badges stay green: the cluster stalls rather than deciding wrongly.');},
   flaky:async()=>{await base();h.S.ovr={t:'wa'};for(const c of [1,0,1,0]){await h.elect(c);if(!h.alive())return;}
     say('Every node is up, but variable delays make nodes think the leader died. Four elections, and no place decided since #1. Safety holds; useful work stops. Raft can even bounce leadership between two nodes when one link keeps failing.');},
   dict:async()=>{h.reset(5);h.S.mode='dict';h.S.believe[0]=0;h.S.leader=0;h.paint();await h.propose('Okoro');h.S.st[0]='down';h.paint();
     await h.addRow({e:null,kind:'prop',val:'Lund',cells:['-','o','o','o','o'],res1:'N1 down',res2:'stuck',ok:false});
     say('N1 decides everything alone, so agreement is easy. Then N1 is lost. No one else may decide and there’s no election to replace it: <b>termination</b> fails. That’s 2PC’s weakness.');},
   nobody:async()=>{h.reset(5);h.S.anim=false;await h.elect(0);h.S.anim=true;await h.propose('nobody',0,true);
     say('Tobias’s joke algorithm decides “nobody” every time. All nodes agree and never change their minds, but no server proposed “nobody”: <b>validity</b> fails.');},
   sixth:async()=>{h.reset(5);h.S.extra=1;h.S.anim=false;await h.elect(0);h.S.anim=true;await h.propose('Okoro');
     say('Kwame adds N6 for Peak Week. Most algorithms have a fixed set of voters, so N6 gets no vote and the majority is still 3 of 5. Changing the set needs dynamic membership extensions, which are much less well understood.');},
   tobias:async()=>{await base();h.S.st=['cut','cut','up','up','up'];h.paint();
     await h.addRow({e:null,kind:'prop',val:'N3 leads',cells:['-','-','L','y','y'],res1:'no vote',res2:'takes over',ok:false});
     h.S.believe[2]=1;h.S.twin=[0,2];h.paint();
     await h.addRow({e:1,kind:'prop',val:'Lund',cells:['L','y','-','-','-'],res1:'2 of 5',res2:'accepted!',ok:false});h.S.dec.push({slot:2,val:'Lund'});h.paint();
     await h.addRow({e:null,kind:'prop',val:'Adeyemi',cells:['-','-','L','y','y'],res1:'3 of 5',res2:'accepted',ok:false});h.S.dec.push({slot:2,val:'Adeyemi'});h.paint();
     say('Tobias’s rule: “miss three heartbeats and the lowest ID you can see takes over”, with no majority count. A fault cuts N1, N2 off from N3–N5. Both sides crown a leader and both decide place #2: '+L.g('split-brain','split brain')+', <b>agreement</b> broken. A majority rule would refuse N1’s 2 votes.');}};
  Object.keys(P).forEach(id=>{L.$('#e14-'+id).onclick=async function(){if(h.S.busy)return;h.S.busy=true;L.$$('#e14-crash3,#e14-flaky,#e14-dict,#e14-nobody,#e14-sixth,#e14-tobias').forEach(x=>x.classList.toggle('sel',x===this));
    say('Running…');await P[id]();h.S.busy=false;if(!h.alive())return;tried.add(id);
    if(tried.size>=4&&!L.$('#ok14')){L.$('#r14').insertAdjacentHTML('afterend','<span id="ok14"></span>');
      L.sheet('info','Stalls are safe; shortcuts are not','A real algorithm may stop (too few nodes, endless elections) but never decides wrongly. The breakages came from shortcuts: one dictator, a made-up value, no majority rule. Fixed membership is a practical limit.');L.done();}};});}},
{part:2,src:'Chapter 9 · Limitations of consensus',pts:1,
 solve:async L=>{L.fast=true;L.$('#ld15-c button[data-k="1"]').click();await L.sleep(10);L.$('#x15').click();for(let i=0;i<300&&!L.$('#d15');i++)await L.sleep(15);},
 run(L){
  L.fast=false;let first=true;
  L.h(L.kick('pr','Challenge')+'<h1 class="q">Leader N1 has crashed. Crash as many <i>more</i> nodes as you can while place #2 still gets decided. One try counts.</h1>'+CSS+
   '<div id="l15"></div><div class="cc-ctl"><button class="btn pri" id="x15">'+L.ic('play')+'Elect, then decide place #2</button><button class="btn" id="z15" hidden>'+L.ic('cycle')+'Reset</button></div><div class="cc-read" id="r15" aria-live="polite">N1 is down (locked). Tap N2–N5 to crash them, then run.</div>');
  const h=Ladder(L,L.$('#l15'),{id:'ld15',tap:true,lock:[0]});
  const setup=async()=>{h.reset(5);h.S.anim=false;await h.elect(0);await h.propose('Okoro');h.S.st[0]='down';h.S.anim=true;h.paint();};
  setup();
  L.$('#z15').onclick=async()=>{if(h.S.busy)return;await setup();L.$('#x15').hidden=false;L.$('#z15').hidden=true;L.$('#r15').innerHTML='Tap N2–N5 to crash them, then run.';};
  L.$('#x15').onclick=async()=>{if(h.S.busy)return;h.S.busy=true;L.$('#x15').hidden=true;
    const down=h.S.st.filter(s=>s==='down').length;const e=await h.elect();let r={ok:false};if(e.ok)r=await h.propose('Lund');h.S.busy=false;if(!h.alive())return;
    const ok=r.ok&&down===2;
    const msg=ok?'Two down is the limit for five nodes: the remaining 3 of 5 still form a majority for the election and again for the proposal.':
      r.ok?'Place #2 was decided with only '+down+' node'+(down>1?'s':'')+' down. Five nodes can lose two and still decide, so one more crash was possible.':
      'With '+down+' nodes down only '+(5-down)+' of 5 can vote: no majority, no new leader, nothing decided. Stuck, though nothing wrong happened.';
    L.$('#r15').innerHTML=msg;L.$('#z15').hidden=false;
    if(first){first=false;L.award(ok);L.sheet(ok?'ok':'no',ok?'Exactly at the limit':'Not quite',msg);L.$('#r15').insertAdjacentHTML('afterend','<span id="d15"></span>');L.done();}};}},

{part:3,src:'Chapter 9 · Membership and Coordination Services',run(L){

{part:3,src:'Chapter 9 · Allocating work to nodes',
 solve:async L=>{L.fast=true;L.$('#s17').click();await L.tr.idle();L.$('#tr17-f0').click();await L.tr.idle();L.$('#tr17-br button[data-b="part"]').click();},
 run(L){
  L.fast=false;
  L.h(L.kick('ex','Try it live · the coordination tree')+'<h1 class="q">Three Westport route planners, one leader key. Start them, then freeze the leader.</h1>'+CSS+
   goalsHtml('g17',['Start the planners: they race for the leader key','Freeze the leader and watch who takes over','Tap another branch to see what it’s for'])+
   '<div class="cc-ctl"><button class="btn pri" id="s17">'+L.ic('play')+'Start the planners</button></div><div id="t17"></div><div class="cc-read" id="r17" aria-live="polite">The tree is Otterpost’s data in the coordination service. Dashed boxes are '+L.g('ephemeral','ephemeral')+': they live only as long as their owner’s session.</div>');
  const say=t=>{L.$('#r17').innerHTML=t;};
  const BT={lead:'<b>Leader election.</b> The planners race to create this key with an atomic compare-and-set; exactly one wins. Its zxid becomes a '+L.g('fencing','fencing token')+' for every route write.',
    mem:'<b>Membership.</b> Each dispatch worker keeps an ephemeral entry. If its session times out, the entry vanishes, and everyone agrees it’s out. Even a wrong “dead” verdict is useful, because all agree on it.',
    part:'<b>Allocating work.</b> “Partition 7 of the Parcel DB is led by 10.1.1.23.” Facts like this change over minutes or hours, which is what these services are for. Not data that changes thousands of times a second.',
    svc:'<b>Service discovery.</b> Where to reach the merchant API. This doesn’t really need consensus: a slightly stale answer, as DNS gives, is fine. Read-only caching replicas can serve such reads.'};
  const t=Tree(L,L.$('#t17'),{id:'tr17',on:e=>{
    if(e.type==='start'){tick(L,'g17',0);say('All three tried to create <b>planners/westport/leader</b> at once. A won; B and C saw it already existed and now <b>watch</b> the key. Freeze A.');}
    if(e.type==='freeze')say(PN[e.k]+' froze: its heartbeats stopped. The session timeout bar is running…');
    if(e.type==='takeover'){tick(L,'g17',1);say('The session timed out, so the ephemeral key was deleted. B and C were notified (no polling), raced again, and '+PN[e.k]+' won with a higher zxid: '+t.S.tok[e.k]+'.');}
    if(e.type==='open'){say(BT[e.b]);if(e.b!=='lead')tick(L,'g17',2);}
    if(allTicked(L,'g17')&&!L.$('#ok17')){L.$('#g17').insertAdjacentHTML('afterend','<span id="ok17"></span>');
      L.sheet('info','Failover without writing consensus code','Atomic operations, ephemeral nodes, notifications and ordering together gave automatic failover. Only the atomic operations truly need consensus; the combination is what helps. Libraries like Apache Curator help, but it’s still not easy.');L.done();}}});
  L.$('#s17').onclick=function(){this.disabled=true;t.start();};}},
{part:3,src:'Chapter 9 · Membership and Coordination Services',pts:1,
 solve:async L=>{L.fast=true;L.$('#p18').children[2].click();for(let i=0;i<300&&!L.$('#p18d');i++)await L.sleep(20);},
 run(L){
  L.fast=false;let pick=null;
  L.h(L.kick('try','Predict, then watch')+'<h1 class="q">Planner A leads with token 1041. It freezes in a 15-second garbage-collection pause; the session timeout is 10 seconds (both illustrative). When A wakes, it writes routes with token 1041. What happens?</h1>'+CSS+
   '<div class="cc-ctl" id="p18" style="flex-direction:column;align-items:stretch"></div><div id="t18"></div><div id="p18x"></div>');
  const t=Tree(L,L.$('#t18'),{id:'tr18',branches:false,freeze:false});t.setStarted();
  ['A still holds the lock, so its write lands','The service keeps A’s key until A confirms it’s alive','A’s key vanished with its session; B took over, and A’s write is refused'].forEach((s,j)=>{
    const b=document.createElement('button');b.className='chip';b.style.textAlign='left';b.textContent=s;
    b.onclick=async()=>{if(pick!==null)return;pick=j;b.classList.add('sel');
      await t.freeze(0);if(!t.alive())return;await nap(L,300);await t.wake(0);if(!t.alive())return;
      const ok=j===2;L.award(ok);
      L.sheet(ok?'ok':'no',ok?'Right: the session decides, not A':'A lost the lock while it slept','The service doesn’t wait for A: heartbeats stopped, so after the timeout it declared the session dead and deleted the ephemeral key. B was notified and won with zxid 1046. A’s late write carries 1041, and the routes store refuses it.');
      L.$('#p18x').innerHTML='<span id="p18d"></span>';L.done();};
    L.$('#p18').appendChild(b);});}},
{part:3,src:'Chapter 9 · Membership and Coordination Services',pts:6,run(L){
  L.h(L.kick('pr','Right tool?')+'<h1 class="q">Kwame gets requests to put things in the coordination service. Sort them.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Good fit','Wrong tool'],[
   ['Which node leads partition 7 of the Parcel DB',0,'Small, slow-changing, and everyone must agree on it.'],
   ['Every booking write, copied to a standby Parcel DB',1,'Replicating app state from node to node is a job for other tools, such as Apache BookKeeper.'],
   ['Which Eastvale route planner instance is the leader',0,'Leader election is a classic use.'],
   ['Every parcel record and its scan events',1,'It’s not a general-purpose database. That data belongs in the Parcel DB.'],
   ['Which dispatch workers are alive right now',0,'Membership: sessions and ephemeral nodes are built for it.'],
   ['Each courier’s live position, updated every few seconds',1,'Runtime state that changes constantly. Other tools are meant for replicating that.']],
   'Small, slow-changing facts the whole system must agree on: yes. Bulk or fast-changing application data: no.');}},
{part:3,src:'Chapter 9 · Membership and Coordination Services; Service discovery',
 solve:async L=>{for(const k of ['zk1','zk3','gps','track','many']){L.$('#e20-'+k).click();await L.sleep(10);}},
 run(L){
  const tried=new Set();
  L.h(L.kick('pr','Edge cases')+'<h1 class="q">Where does the coordination service stop helping? Try each preset.</h1>'+CSS+
   '<div class="cc-ctl" id="e20"><button class="chip" id="e20-zk1">1 server fails</button><button class="chip" id="e20-zk3">3 of 5 crash</button><button class="chip" id="e20-gps">Store GPS pings</button><button class="chip" id="e20-track">Read on every request</button><button class="chip" id="e20-many">1,000 voters</button></div>'+
   '<div class="cc-fig" id="v20"></div><div class="cc-read" id="r20" aria-live="polite">Normal use: leader keys, members and partition owners. Small facts that change over minutes or hours. Rates are illustrative.</div>');
  const base={n:5,down:0,many:false,ro:false,rate:.1,mem:.06,clients:[['Planners','×3',1.5],['Dispatch','×12 workers',1.5]],v:['ok','Fits','small, slow','facts'],aria:'Normal use: five voters up, small slow-changing data, little memory used'};
  const PR={
   zk1:[{down:1,v:['ok','Fine','4 of 5 vote','sessions live'],aria:'One of five voters down; the service keeps working'},
     'One ZooKeeper server fails. Four of five still form a majority, and Planner A’s <b>session stays active</b>: one server failing doesn’t end it. No false “A is dead”.'],
   zk3:[{down:3,v:['wa','Stalls','safe, but','stuck'],aria:'Three of five voters down; the service cannot decide anything'},
     'The service runs consensus itself, so it needs a majority of its own voters. With 2 of 5 it can’t commit any change: no lock handed over, no new leader key. Like the ladder: <b>stuck, but never wrong</b>.'],
   gps:[{rate:.98,mem:1.3,clients:[['Planners','×3',1.5],['Courier app','3,000 phones',5]],v:['no','Wrong tool','fast app','state'],aria:'Every GPS ping written to the service: changes thousands of times a second and does not fit in memory'},
     'Tobias wants every courier ping in the tree. That’s app state changing <b>thousands of times a second</b>, while these services keep a small amount of data in memory. Keep it in the courier location store.'],
   track:[{ro:true,clients:[['Planners','×3',1.5],['Tracking','every request',5]],v:['wa','Overkill','a stale read','is fine'],aria:'Tracking-page servers read the merchant API address on every request; read-only replicas can answer'},
     'Tobias wants a linearizable read of the merchant API’s address on every tracking-page request. Service discovery can live with slightly stale answers, as DNS does. <b>Read-only caching replicas</b> (no vote) can serve them.'],
   many:[{many:true,clients:[['App servers','1,000 vote',5],['Dispatch','×12 workers',1.5]],v:['no','Too slow','501 votes','per change'],aria:'A thousand voters: every decision waits for 501 of them'},
     'Why not let all 1,000 app servers vote? Polling that many nodes for a majority would waste huge effort. So the service votes among <b>3 or 5</b> nodes and serves many clients: coordination is outsourced.']};
  const draw=c=>{L.$('#v20').innerHTML=svcSvg(Object.assign({},base,c||{}));};draw();
  Object.keys(PR).forEach(k=>{L.$('#e20-'+k).onclick=function(){L.$$('#e20 .chip').forEach(x=>x.classList.toggle('sel',x===this));draw(PR[k][0]);L.$('#r20').innerHTML=PR[k][1];tried.add(k);
    if(tried.size>=4&&!L.$('#ok20')){L.$('#r20').insertAdjacentHTML('afterend','<span id="ok20"></span>');
      L.sheet('info','Small, slow, and agreed','Use it for facts everyone must agree on that change over minutes or hours. It tolerates a minority of failures and stalls safely without a majority. Bulk app state and stale-tolerant lookups belong elsewhere.');L.done();}};});}},
{part:3,src:'Chapter 9 · Summary',run(L){
  L.h(L.kick('learn','The chapter’s big reveal')+'<h1 class="q">Six problems that are secretly one</h1>'+CSS+FIG_HUB()+
   '<p class="cc-cap">Each is “decide one thing, together”. Solve one and you can turn it into a solution for the others. With a single leader deciding, all of them are easy.</p>');
  L.done();}},
{part:3,src:'Chapter 9 · Summary',
 solve:async L=>{L.fast=true;for(const k of ['wait','man','auto']){L.$('#w22-'+k).click();for(let i=0;i<200&&L.$('#w22').dataset.busy==='1';i++)await L.sleep(15);}},
 run(L){
  L.fast=false;const seen=new Set();const shown={};
  L.h(L.kick('ex','The leader dies at 2 am')+'<h1 class="q">Three ways out when the leader fails. Tap each one.</h1>'+CSS+
   '<div class="cc-ctl"><button class="chip" id="w22-wait">Wait for it</button><button class="chip" id="w22-man">Fail over by hand</button><button class="chip" id="w22-auto">Elect automatically</button></div>'+
   '<div class="cc-fig"><svg id="w22" viewBox="0 0 320 196" role="img" aria-label="Timeline from 2:00 to 3:00 am showing how long writes are blocked under each approach"></svg></div><div class="cc-read" id="r22" aria-live="polite">Times are illustrative.</div><div id="q22"></div>');
  const X=m=>36+m*(268/60);
  const R={wait:[0,'Wait for it',60,'blocked until it returns… if ever'],man:[1,'Fail over by hand',30,'Kwame is paged'],auto:[2,'Elect automatically',0.6,'new leader in seconds']};
  const TXT={wait:'Many XA/JTA transaction coordinators wait for the leader to recover. If it never does, the system is blocked forever: no termination.',
    man:'Many relational databases fail over by hand: consensus by “act of God”, as a human decides from outside the system. Only as fast as people are.',
    auto:'Electing a new leader automatically needs a consensus algorithm. Use a proven one that handles bad networks, or a service like ZooKeeper.'};
  function paint(){let s='';
    [0,15,30,45,60].forEach(m=>{s+='<line x1="'+X(m)+'" y1="168" x2="'+X(m)+'" y2="173" style="stroke:var(--line2);stroke-width:1.5"/>'+tx(m===0?X(m)-6:m===60?X(m)+6:X(m),188,m===60?'3:00':'2:'+String(m).padStart(2,'0'),'font-size:12px;text-anchor:'+(m===0?'start':m===60?'end':'middle')+';fill:var(--muted)');});
    s+='<line x1="'+X(0)+'" y1="168" x2="'+X(60)+'" y2="168" style="stroke:var(--line2);stroke-width:1.5"/>';
    s+='<line x1="'+X(0)+'" y1="20" x2="'+X(0)+'" y2="168" style="stroke:var(--no);stroke-width:1.8;stroke-dasharray:4 3"/>'+tx(X(0)-6,13,'leader fails','font-size:12px;font-weight:700;fill:var(--no)');
    Object.keys(R).forEach(k=>{const r=R[k],top=26+r[0]*48,p=shown[k],by=top+18;
      s+=tx(X(0)+8,top+12,r[1],'font-size:13px;'+(p==null?'fill:var(--muted)':'font-weight:700;fill:var(--ink)'));
      if(p==null){s+='<rect x="'+X(0)+'" y="'+by+'" width="'+(X(60)-X(0))+'" height="20" rx="6" style="fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:4 3"/>';return;}
      const end=Math.min(r[2],60),xr=X(end*p);
      s+='<rect x="'+X(0)+'" y="'+by+'" width="'+Math.max(3,xr-X(0))+'" height="20" rx="6" style="fill:var(--no-bg);stroke:var(--no);stroke-width:1.4"/>';
      if(k!=='wait'&&p>=1)s+='<rect x="'+xr+'" y="'+by+'" width="'+(X(60)-xr)+'" height="20" rx="6" style="fill:var(--ok-bg);stroke:var(--ok-line);stroke-width:1.4"/>';
      if(p>=1)s+=tx(k==='auto'?X(60)-6:X(0)+8,by+14,r[3],'font-size:11.5px;font-weight:600;fill:var(--'+(k==='auto'?'ok':'no')+');text-anchor:'+(k==='auto'?'end':'start'));});
    const el=L.$('#w22');if(el){const b=el.dataset.busy;el.innerHTML=s;el.dataset.busy=b||'0';}}
  paint();
  Object.keys(R).forEach(k=>{L.$('#w22-'+k).onclick=async function(){const el=L.$('#w22');if(el.dataset.busy==='1')return;el.dataset.busy='1';
    L.$$('#w22-wait,#w22-man,#w22-auto').forEach(x=>x.classList.toggle('sel',x===this));L.$('#r22').innerHTML=TXT[k];
    const ok=await anim(L,700,p=>{if(!L.$('#w22'))return false;shown[k]=p;paint();});if(!ok)return;shown[k]=1;paint();L.$('#w22').dataset.busy='0';seen.add(k);
    if(seen.size===3&&!L.$('#ok22')){L.$('#q22').innerHTML='<span id="ok22"></span>'+L.quote('kicks the can down the road','Martin Kleppmann, chapter 9 summary, on what a leader achieves');
      L.sheet('info','A leader only moves the problem','A single-leader database avoids consensus on every write, but still needs it to keep and change leadership. Leaderless and multi-leader systems usually skip global consensus and live with conflicts instead.');L.done();}};});}},
{part:3,src:'Chapter 9 · Summary',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which problem is it, underneath?',['Uniqueness constraint','Atomic commit','Total order broadcast','Locks and leases','Membership'],[
   ['Two bookings must never get the same tracking code, OP-48213.',0,'Concurrent conflicting records: one must win, the other must fail.'],
   ['A booking must land in both the Parcel DB and the billing ledger, or in neither.',1,'Every participant must agree to commit or abort.'],
   ['Every replica must apply parcel scan events in exactly the same order.',2,'Deciding the delivery order of messages.'],
   ['Only one Westport route planner may write routes at a time.',3,'Racing instances; one gets the lease.'],
   ['Dispatch must agree which of its workers are still alive.',4,'Deciding which nodes count as live members.']]);}},
{part:3,src:'Chapter 9 · Summary',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Tap each piece until the sentence says what a leader really does for consensus.</h1>');
  L.sentence(L.card,[['A single-leader database avoids consensus','A single-leader database still needs consensus'],['to choose and change its leader,','on every single write,'],['so the leader moves the problem elsewhere.','so the leader makes the problem go away.']],[1,0,0],
   [['It runs no consensus per write, but leadership itself must be agreed. It still needs consensus.'],['Writes flow through the leader without a vote each time. Consensus is needed for leadership, not every write.'],['It doesn’t go away: when the leader fails, the nodes still have to agree on a new one.']],
   'You still need consensus, just in a different place and less often. For that part, borrow a proven service such as ZooKeeper instead of building your own.');}}
  ]
});
</script>
