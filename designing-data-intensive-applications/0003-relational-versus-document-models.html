<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">

<script src="course-data.js"></script>
<script>
/* =====================================================================
   Lesson 0003 only. The signature model, used across the lesson:
   Morph – Mrs. Okoro’s parcel OP-48213 as a nested document. Each nested
           piece (scans, merchant, courier, hubs) can sit inside the
           document or move out into its own table, linked by an ID.
           Operations (draw the tracking page, rename the merchant, new
           courier photo, add a scan, read the status) run against the
           current shape and count reads, joins, copies and bytes.
   Plus: a layer stack, a 1975 access-path walker and a postcode
   schema-change player.
   ===================================================================== */
const X=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const T=(x,y,t,a)=>'<text x="'+x+'" y="'+y+'" '+(a||'')+'>'+X(t)+'</text>';
const R=(x,y,w,h,r,st,ex)=>'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+r+'" style="'+st+'" '+(ex||'')+'/>';
const LN=(x1,y1,x2,y2,st)=>'<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" style="'+st+'"/>';
const r1=n=>Math.round(n*10)/10;
function AR(x1,y1,x2,y2,col,dash){const a=Math.atan2(y2-y1,x2-x1),h=6.5,s=.5;
  const p=(d)=>r1(x2-h*Math.cos(a+d))+','+r1(y2-h*Math.sin(a+d));
  return LN(x1,y1,r1(x2-4*Math.cos(a)),r1(y2-4*Math.sin(a)),'stroke:var(--'+col+');stroke-width:1.6'+(dash?';stroke-dasharray:4 3':''))+'<polygon points="'+x2+','+y2+' '+p(s)+' '+p(-s)+'" style="fill:var(--'+col+')"/>';}
const FIG=(vb,body,label)=>'<div class="rd-fig"><svg viewBox="'+vb+'" role="img" aria-label="'+X(label)+'">'+body+'</svg></div>';
const CAP=t=>'<p class="rd-cap">'+t+'</p>';
const t11='font-size="11.2" fill="var(--muted)"';
const CSS='<style>'+
 '.rd-fig{margin:4px 0 10px}.rd-fig svg{width:100%;max-width:440px;display:block;margin:0 auto}.rd-fig svg text{font-family:var(--sans)}'+
 '.rd-cap{font-size:16px;line-height:1.55;margin:8px 0 4px}'+
 '.rd-hint{font-size:13.5px;color:var(--muted);margin:2px 0 6px;line-height:1.45}'+
 '.rd-row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.rd-row .btn,.rd-row .chip{margin:0;min-height:40px}.rd-row .btn[disabled],.rd-row .chip[disabled]{opacity:.55;cursor:default}'+
 '.rd-tgs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0 8px}.rd-tg{margin:0!important;min-height:44px;font-size:13px!important;justify-content:flex-start;gap:7px!important;padding:5px 9px!important;text-align:left;line-height:1.25}'+
 '.rd-tg b{font-weight:700;display:block;white-space:nowrap}.rd-tg span.n{display:block;white-space:nowrap}.rd-dot{width:10px;height:10px;border-radius:99px;flex:none}'+
 '.rd-tiles{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}'+
 '.rd-tile{border-radius:12px;padding:7px 9px;background:var(--soft);font-size:12.5px;color:var(--muted);line-height:1.3;border:1.5px solid var(--line)}'+
 '.rd-tile b{display:block;font-size:13.5px;color:var(--ink);margin-top:2px}'+
 '.rd-tile.good{background:var(--ok-bg);border-color:var(--ok-line)}.rd-tile.good b{color:var(--ok)}'+
 '.rd-tile.bad{background:var(--no-bg);border-color:var(--no-line)}.rd-tile.bad b{color:var(--no)}'+
 '.rd-out{background:var(--soft);border-radius:14px;padding:10px 12px;font-size:14.5px;line-height:1.5;margin:8px 0}'+
 '.rd-leg{font-size:12.5px;color:var(--muted);margin:2px 0 4px;line-height:1.5}.rd-sq{display:inline-block;width:10px;height:10px;border-radius:2px;border:1.5px solid;vertical-align:-1px;margin:0 3px 0 6px}'+
 '.rd-tap{cursor:pointer}'+
 '@keyframes rdin{from{opacity:0;transform:translateX(-46px)}to{opacity:1;transform:none}}.rd-new{animation:rdin .5s cubic-bezier(.2,.8,.2,1) both}'+
 '@keyframes rddash{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}.rd-lk{stroke-dasharray:100;animation:rddash .6s ease .15s both}'+
 '@keyframes rdpulse{0%,100%{opacity:1}50%{opacity:.3}}.rd-pulse{animation:rdpulse .5s ease 2}'+
 '@keyframes rdfill{0%,55%{fill:var(--pri-bg)}100%{fill:var(--card)}}.rd-fl{animation:rdfill 1.2s ease both}'+
 '.rd-slab{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border-radius:14px;padding:9px 11px;margin:0 0 6px;border:2px solid var(--line);background:var(--card);font-size:14px;line-height:1.35;transition:background .3s,border-color .3s,opacity .3s}'+
 '.rd-slab .ic{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center}'+
 '.rd-slab b{display:block;font-size:14.5px}.rd-slab .who{font-size:12px;color:var(--muted);font-weight:600}.rd-slab small{display:block;font-size:13px;color:var(--ink);margin-top:2px}'+
 '.rd-slab.hid{background:var(--soft2);border-style:dashed;opacity:.75}.rd-slab.hid small{color:var(--muted);font-style:italic}'+
 '.rd-slab.cur{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-bg)}'+
 'button.rd-slab.sel{border-color:var(--pri);background:var(--pri-bg)}button.rd-slab.ok{border-color:var(--ok-line);background:var(--ok-bg)}button.rd-slab.no{border-color:var(--no-line);background:var(--no-bg)}'+
 '.rd-mono{font-family:ui-monospace,Menlo,monospace;font-size:12.5px}'+
 '.rd-code{background:var(--soft);border-radius:12px;padding:8px 10px;margin:8px 0;font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:1.6;overflow-wrap:anywhere}'+
 '.rd-code span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:6px;padding:0 4px;transition:background .3s}.rd-code span.on{background:var(--h3-bg);color:var(--h3);font-weight:600}'+
 '.rd-ways{display:flex;flex-direction:column;gap:8px;margin:6px 0 10px}.rd-way{display:flex;gap:10px;align-items:center;background:var(--soft);border-radius:14px;padding:8px 10px}'+
 '.rd-way svg{flex:none;width:92px;height:56px}.rd-way svg text{font-family:var(--sans)}.rd-way b{display:block;font-size:14.5px}.rd-way span{font-size:13.5px;line-height:1.4;color:var(--muted)}'+
 '.rd-ben{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}.rd-ben span{font-size:13px;font-weight:600;border-radius:99px;padding:5px 10px;background:var(--h1-bg);color:var(--h1)}'+
 '</style>';

/* ---------- the signature model: tree-to-tables morph ---------- */
const HUBS=[['H-1','Westport Central','W. Central'],['H-2','Westport North','W. North']];
const SC0=[['picked up',-1],['',0],['',1],['on the van',-1]];
const KC={s:'h2',m:'h1',c:'h3',h:'h4'};
const KN={s:'Scans',m:'Merchant',c:'Courier',h:'Hubs'};
const ORD=[...Array(40).keys()].sort((a,b)=>((a*17+5)%41)-((b*17+5)%41));
function Morph(L,host,o){
  o=Object.assign({id:'mo',sw:[],ops:[],fleet:false,tiles:[],st:{},kb:2,hint:'',on:()=>{}},o||{});
  const S=Object.assign({s:1,m:1,c:1,h:1},o.st);
  const fresh0=()=>({name:'Bramble & Bolt',photo:1,extra:false,stale:'',hot:'',badges:[],fl:null});
  Object.assign(S,fresh0(),{kb:o.kb});
  const ID=o.id;let tok=0;
  const OPS={draw:['play','Draw the tracking page'],ren:['pencil','Rename Bramble & Bolt'],pho:['person','Ravi’s new photo'],scan:['list','Add a scan'],stat:['eye','Read only the status']};
  host.insertAdjacentHTML('beforeend','<div class="rd-mo">'+
    (o.sw.length?'<div class="rd-tgs" id="'+ID+'-sw"></div>':'')+
    (o.hint?'<p class="rd-hint">'+o.hint+'</p>':'')+
    '<div class="rd-fig"><svg id="'+ID+'-svg" viewBox="0 0 312 260" role="img" aria-label="Parcel OP-48213 drawn as a document, with any pieces moved out into their own tables"></svg></div>'+
    (o.fleet?'<div id="'+ID+'-fl" hidden><div class="rd-fig" style="margin:0"><svg id="'+ID+'-fls" viewBox="0 0 312 54" role="img" aria-label="Stored parcels that hold the name or photo"></svg></div><p class="rd-leg" id="'+ID+'-leg"></p></div>':'')+
    (o.ops.length?'<div class="rd-row" id="'+ID+'-ops">'+o.ops.map(k=>'<button class="btn" id="'+ID+'-op-'+k+'">'+L.ic(OPS[k][0])+OPS[k][1]+'</button>').join('')+'</div>':'')+
    (o.tiles.length?'<div class="rd-tiles" id="'+ID+'-tl" aria-live="polite"></div>':'')+
    '<div class="rd-out" id="'+ID+'-out" aria-live="polite" hidden></div></div>');
  const svg=L.$('#'+ID+'-svg');
  const reads=()=>1+['s','m','c','h'].filter(k=>!S[k]).length;
  const TL={
    read:()=>{const n=reads();return ['Draw the tracking page',n+(n===1?' read':' reads')+' · '+(n-1)+(n-1===1?' join':' joins'),n===1?'good':''];},
    ren:()=>S.m?['Rename the merchant','a copy in every parcel it sent','bad']:['Rename the merchant','change 1 row','good'],
    pho:()=>S.c?['Ravi’s new photo','a copy in every parcel they carried','bad']:['Ravi’s new photo','change 1 row','good'],
    hub:()=>S.h?['Rename a hub','a copy in every scan there','bad']:['Rename a hub','change 1 row','good'],
    scan:()=>S.s?['Add one scan','rewrite the whole '+S.kb+' KB','']:['Add one scan','insert 1 row','good']};
  function dot(x,y,col){return '<circle cx="'+x+'" cy="'+y+'" r="3.5" style="fill:var(--'+col+')"/>';}
  function hubBit(x,y,hi,edge,anchorX){
    let s='<g data-k="h" class="'+(o.sw.includes('h')?'rd-tap':'')+'">';
    if(S.h){s+=R(x,y,74,17,8.5,'fill:var(--h4-bg);stroke:var(--h4);stroke-width:1.2')+T(x+37,y+12.5,HUBS[hi][2],'font-size="11.2" font-weight="600" text-anchor="middle" fill="var(--h4)"');}
    else{s+=R(x,y,34,17,5,'fill:var(--card);stroke:var(--h4);stroke-width:1.5;stroke-dasharray:3 2')+T(x+17,y+12.5,HUBS[hi][0],'font-size="11.2" font-weight="700" text-anchor="middle" fill="var(--h4)"')+dot(edge,y+8.5,'h4');}
    return s+'</g>';}
  function draw(fresh){
    fresh=fresh||new Set();
    const X0=2,W0=128,R0=148,RW=158,top=20;
    const scans=SC0.concat(S.extra?[['delivered',-1]]:[]);
    let y=top;const rw={head:y};y+=38;rw.m=y;y+=40;rw.c=y;y+=40;
    if(S.s){rw.sl=y;y+=18;rw.s=scans.map(()=>{const v=y;y+=20;return v;});y+=4;rw.kb=y;y+=18;}else{rw.sx=y;y+=28;}
    const docB=y;
    let yr=top;const cd={};
    ['m','c','s','h'].forEach(k=>{if(!S[k]){const n=k==='s'?scans.length:2;const h=26+n*19;cd[k]={y:yr,h};yr+=h+10;}});
    const H=Math.max(docB,yr-10)+6;
    let g='';
    g+=T(X0+2,12,S.s?'parcel document':'parcels table · 1 row','font-size="11.2" font-weight="700" fill="var(--pri)"');
    if(Object.keys(cd).length)g+=T(R0+2,12,'its own tables','font-size="11.2" font-weight="700" fill="var(--muted)"');
    /* links first, so boxes sit on top of their ends */
    const lk=(x1,y1,x2,y2,col,k,bend)=>{const c1=bend?x1+bend:x1+(x2-x1)*.55,c2=bend?x2+bend:x2-(x2-x1)*.55;
      return '<path d="M'+x1+' '+y1+' C'+c1+' '+y1+' '+c2+' '+y2+' '+x2+' '+y2+'" pathLength="100" class="'+(fresh.has(k)?'rd-lk':'')+(S.hot==='lk'+k?' rd-pulse':'')+'" style="fill:none;stroke:var(--'+col+');stroke-width:1.7"/>';};
    if(!S.m)g+=lk(X0+W0,rw.m+26.5,R0,cd.m.y+11,'h1','m');
    if(!S.c)g+=lk(X0+W0,rw.c+26.5,R0,cd.c.y+11,'h3','c');
    if(!S.s)g+=lk(X0+W0,rw.head+14,R0,cd.s.y+11,'h2','s');
    if(!S.h)scans.forEach((sc,i)=>{if(sc[1]<0)return;const hy=cd.h.y+24+sc[1]*19+9.5;
      g+=S.s?lk(X0+W0,rw.s[i]+9.5,R0,hy,'h4','h'):lk(R0+RW,cd.s.y+24+i*19+9.5,R0+RW,hy,'h4','h',8);});
    /* the document */
    const docHot=S.badges.includes('doc')||(S.hot==='stat'&&S.s)||(S.hot==='rw'&&S.s);
    g+=R(X0,top,W0,docB-top,12,'fill:var(--card);stroke:var(--pri);stroke-width:'+(docHot?3:1.5),(S.hot==='rw'&&S.s)||(S.hot==='stat'&&S.s)?'class="rd-fl"':'');
    g+=T(X0+9,rw.head+16,'OP-48213','font-size="13" font-weight="700" fill="var(--ink)"')+T(X0+9,rw.head+31,'to Mrs. Okoro','font-size="11.5" fill="var(--muted)"');
    ['m','c'].forEach(k=>{const yy=rw[k];
      let s='<g data-k="'+k+'" class="'+(o.sw.includes(k)?'rd-tap':'')+'">'+R(X0+3,yy,W0-6,38,8,'fill:transparent')+T(X0+9,yy+12,k==='m'?'merchant':'courier',t11);
      if(S[k]){const st=S.stale===k;const txt=k==='m'?S.name:'Ravi · photo '+S.photo;
        s+=R(X0+6,yy+17,W0-12,19,9.5,'fill:var(--'+KC[k]+'-bg);stroke:var(--'+(st?'no':KC[k])+');stroke-width:'+(st?2.2:1.2));
        if(k==='c')s+='<circle cx="'+(X0+16)+'" cy="'+(yy+26.5)+'" r="5" style="fill:var(--'+(S.photo===1?'h3':'card')+');stroke:var(--h3);stroke-width:1.5"/>';
        s+=T(k==='c'?X0+25:X0+12,yy+30.5,txt+(st?' ✗':''),'font-size="11.2" font-weight="600" fill="var(--'+(st?'no':KC[k])+')"');}
      else{const idt=k==='m'?'M-17':'C-0017',w=k==='m'?38:50;
        s+=R(X0+6,yy+17,w,19,6,'fill:var(--card);stroke:var(--'+KC[k]+');stroke-width:1.5;stroke-dasharray:3 2')+T(X0+6+w/2,yy+30.5,idt,'font-size="11.2" font-weight="700" text-anchor="middle" fill="var(--'+KC[k]+')"');
        s+=T(X0+11+w,yy+30.5,'→ '+(k==='m'?'merchants':'couriers'),t11)+dot(X0+W0,yy+26.5,KC[k]);}
      g+=s+'</g>';});
    if(S.s){
      let s='<g data-k="s" class="'+(o.sw.includes('s')?'rd-tap':'')+'">'+R(X0+3,rw.sl-2,W0-6,rw.kb-rw.sl,8,'fill:transparent')+T(X0+9,rw.sl+12,'scans ('+scans.length+')','font-size="11.2" font-weight="700" fill="var(--h2)"');
      scans.forEach((sc,i)=>{const yy=rw.s[i],nw=S.extra&&i===4&&S.hot==='rw';
        s+='<circle cx="'+(X0+12)+'" cy="'+(yy+9.5)+'" r="3" style="fill:var(--h2)"/>';
        if(sc[1]<0)s+=T(X0+21,yy+13.5,sc[0],'font-size="11.5" fill="var(--'+(nw?'pri':'ink')+')"'+(nw?' font-weight="700"':''));
        else s+=hubBit(X0+20,yy+1,sc[1],X0+W0);});
      g+=s+'</g>';
      const kbl=S.hot==='rw'?'rewrote all ≈'+S.kb+' KB':S.hot==='stat'?'loaded all ≈'+S.kb+' KB':'≈'+S.kb+' KB';
      g+=T(X0+W0-8,rw.kb+12,kbl,'font-size="11.2" text-anchor="end" '+(S.hot==='rw'||S.hot==='stat'?'font-weight="700" fill="var(--pri)"':'fill="var(--muted)"'));
    }else{
      g+='<g data-k="s" class="'+(o.sw.includes('s')?'rd-tap':'')+'">'+R(X0+3,rw.sx,W0-6,26,8,'fill:transparent')+T(X0+9,rw.sx+17,'scans: own table','font-size="11.2" font-style="italic" fill="var(--h2)"')+'</g>'+dot(X0+W0,rw.head+14,'h2');
    }
    /* the tables */
    const card=(k,title,rows)=>{const c=cd[k];let s='<g data-k="'+k+'" class="'+(o.sw.includes(k)?'rd-tap ':'')+(fresh.has(k)?'rd-new':'')+'">';
      s+=R(R0,c.y,RW,c.h,10,'fill:var(--card);stroke:var(--'+KC[k]+');stroke-width:'+(S.badges.includes(k)?3:1.5));
      s+=R(R0+1.5,c.y+1.5,RW-3,20,8.5,'fill:var(--'+KC[k]+'-bg)')+T(R0+9,c.y+15,title,'font-size="11.5" font-weight="700" fill="var(--'+KC[k]+')"');
      rows.forEach((fn,i)=>{s+=fn(c.y+24+i*19,i);});return s+'</g>';};
    const hl=(yy,on,col)=>on?R(R0+3,yy,RW-6,18,5,'fill:var(--'+(col||'ok')+'-bg)'):'';
    if(!S.m)g+=card('m','merchants',[yy=>hl(yy,S.hot==='mrow'||S.hot==='lkm')+T(R0+9,yy+13,'M-17','font-size="11.2" font-weight="700" fill="var(--h1)"')+T(R0+40,yy+13,S.name,'font-size="11.2" fill="var(--ink)"'),
      yy=>T(R0+9,yy+13,'M-18','font-size="11.2" font-weight="700" fill="var(--h1)"')+T(R0+40,yy+13,'Pip & Thistle','font-size="11.2" fill="var(--ink)"')]);
    if(!S.c)g+=card('c','couriers',[yy=>hl(yy,S.hot==='crow'||S.hot==='lkc')+T(R0+9,yy+13,'C-0017','font-size="11.2" font-weight="700" fill="var(--h3)"')+'<circle cx="'+(R0+62)+'" cy="'+(yy+9)+'" r="5" style="fill:var(--'+(S.photo===1?'h3':'card')+');stroke:var(--h3);stroke-width:1.5"/>'+T(R0+71,yy+13,'Ravi · photo '+S.photo,'font-size="11.2" fill="var(--ink)"'),
      yy=>T(R0+9,yy+13,'C-0002','font-size="11.2" font-weight="700" fill="var(--h3)"')+'<circle cx="'+(R0+62)+'" cy="'+(yy+9)+'" r="5" style="fill:var(--h3);stroke:var(--h3);stroke-width:1.5"/>'+T(R0+71,yy+13,'Mia · photo 1','font-size="11.2" fill="var(--ink)"')]);
    if(!S.s)g+=card('s','scans',scans.map((sc,i)=>yy=>hl(yy,(S.hot==='rw'&&i===4)||(S.hot==='stat'&&i===3),'pri')+T(R0+9,yy+13,'OP-48213',t11)+(sc[1]<0?T(R0+70,yy+13,sc[0],'font-size="11.2" fill="var(--ink)"'):hubBit(R0+68,yy+1,sc[1],R0+RW))));
    if(!S.h)g+=card('h','hubs',HUBS.map(hb=>yy=>T(R0+9,yy+13,hb[0],'font-size="11.2" font-weight="700" fill="var(--h4)"')+T(R0+36,yy+13,hb[1],'font-size="11.2" fill="var(--ink)"')));
    S.badges.forEach((k,i)=>{const p=k==='doc'?[X0+W0-12,top+12]:[R0+RW-12,cd[k].y+11];
      g+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="9" style="fill:var(--pri)"/>'+T(p[0],p[1]+4,String(i+1),'font-size="11.5" font-weight="700" text-anchor="middle" fill="var(--pri-ink)"');});
    svg.setAttribute('viewBox','0 0 312 '+H);svg.innerHTML=g;
    const sw=L.$('#'+ID+'-sw');
    if(sw)sw.innerHTML=o.sw.map(k=>'<button class="chip rd-tg'+(S[k]?'':' sel')+'" data-k="'+k+'" aria-pressed="'+(!S[k])+'"><span class="rd-dot" style="background:var(--'+KC[k]+')"></span><span><span class="n">'+KN[k]+'</span><b>'+(S[k]?'inside':'own table')+'</b></span></button>').join('');
    const tl=L.$('#'+ID+'-tl');
    if(tl)tl.innerHTML=o.tiles.map(k=>{const v=TL[k]();return '<div class="rd-tile '+v[2]+'">'+v[0]+'<b>'+v[1]+'</b></div>';}).join('');
  }
  function drawFleet(){
    const box=L.$('#'+ID+'-fl');if(!box)return;
    if(!S.fl){box.hidden=true;return;}box.hidden=false;
    const m=S.fl.mode==='m',col=m?'h1':'h3';
    let g=T(2,11,m?'Bramble & Bolt parcels · 1 square ≈ 1,500':'Parcels Ravi carried · 1 square ≈ 70',t11);
    const sty={old:'fill:var(--soft2);stroke:var(--line2)',new:'fill:var(--ok-bg);stroke:var(--ok)',stale:'fill:var(--no-bg);stroke:var(--no)',ptr:'fill:var(--card);stroke:var(--'+col+');stroke-dasharray:2 2',ptrnew:'fill:var(--ok-bg);stroke:var(--ok);stroke-dasharray:2 2'};
    S.fl.cells.forEach((c,i)=>{g+=R(2+(i%20)*15.4,18+Math.floor(i/20)*17,13,13,3,sty[c]+';stroke-width:1.5');});
    L.$('#'+ID+'-fls').innerHTML=g;
    const sq=(b,c)=>'<span class="rd-sq" style="background:var(--'+b+');border-color:var(--'+c+')"></span>';
    L.$('#'+ID+'-leg').innerHTML=S.fl.cells[0].startsWith('ptr')?'Dashed squares hold only the ID and read the current '+(m?'name':'photo')+' through it (numbers illustrative).':sq('soft2','line2')+'old copy'+sq('ok-bg','ok')+'rewritten'+sq('no-bg','no')+'missed (numbers illustrative)';
  }
  function out(h){const b=L.$('#'+ID+'-out');if(!b)return;b.hidden=false;b.innerHTML=h;}
  const live=my=>my===tok&&svg.isConnected;
  function clear(){Object.assign(S,fresh0());drawFleet();}
  function set(st,fresh){tok++;clear();Object.assign(S,st);draw(fresh);}
  function tog(k){if(!o.sw.includes(k))return;tok++;S[k]=S[k]?0:1;clear();draw(new Set(S[k]?[]:[k]));o.on('tog',k);}
  async function opDraw(){const my=++tok;clear();draw();
    const pl=['doc'].concat(['m','c','s','h'].filter(k=>!S[k]));
    for(const p of pl){if(!live(my))return;S.badges.push(p);draw();await wait(230);}
    if(!live(my))return;const n=pl.length;
    out(n===1?'<b>1 read.</b> Everything the page needs sits together in one place. That is <b>locality</b>.':'<b>'+n+' reads, '+(n-1)+(n>2?' joins':' join')+'.</b> The page’s pieces live in '+n+' places, so it takes several queries or one multi-table join.');
    o.on('draw');return true;}
  async function opCopy(k){const my=++tok;clear();const m=k==='m';
    S.fl={mode:k,cells:Array(40).fill(S[k]?'old':'ptr')};draw();drawFleet();await wait(250);if(!live(my))return;
    if(S[k]){
      for(let i=0;i<34;i++){S.fl.cells[ORD[i]]='new';if(i%2){drawFleet();await wait(45);if(!live(my))return;}}
      for(let i=34;i<40;i++)S.fl.cells[ORD[i]]='stale';S.stale=k;draw();drawFleet();
      out(m?'<b>About 51,000 copies rewritten, 9,000 missed.</b> The update job was cut off partway. Those parcels, OP-48213 among them, still say “Bramble & Bolt”.':'<b>Copies rewritten one by one, some missed.</b> The job was cut off partway. OP-48213 still shows Ravi’s old photo.');
    }else{
      if(m)S.name='Bramble & Bolt Home';else S.photo=2;S.hot=m?'mrow':'crow';draw();await wait(350);if(!live(my))return;
      S.hot='lk'+k;draw();S.fl.cells=S.fl.cells.map(()=>'ptrnew');drawFleet();
      out(m?'<b>1 row changed.</b> Every parcel still holds M-17 and reads the new name through it. Nothing can go stale.':'<b>1 row changed.</b> Every parcel holds C-0017 and shows Ravi’s current photo through it.');}
    o.on(m?'ren':'pho');return true;}
  async function opScan(){const my=++tok;clear();draw();await wait(120);if(!live(my))return;
    S.extra=true;S.hot='rw';draw();
    out(S.s?'<b>Rewrote the whole ≈'+S.kb+' KB document</b> to add one small scan (sizes illustrative). Only edits that keep a document’s size can be made in place.':'<b>Inserted 1 row</b> (≈100 bytes, illustrative) into the scans table. Nothing else was rewritten.');
    o.on('scan');return true;}
  async function opStat(){tok++;clear();S.hot='stat';draw();
    out(S.s?'<b>Loaded the whole ≈'+S.kb+' KB document</b> to read one line, “on the van”. The database usually loads all of it, even for a small part.':'<b>Read 1 small row:</b> the latest scan in the scans table.');
    o.on('stat');return true;}
  const run={draw:opDraw,ren:()=>opCopy('m'),pho:()=>opCopy('c'),scan:opScan,stat:opStat};
  svg.addEventListener('click',e=>{const t=e.target.closest('[data-k]');if(t)tog(t.dataset.k);});
  const sw=L.$('#'+ID+'-sw');if(sw)sw.addEventListener('click',e=>{const t=e.target.closest('[data-k]');if(t)tog(t.dataset.k);});
  o.ops.forEach(k=>{L.$('#'+ID+'-op-'+k).onclick=()=>run[k]();});
  draw();
  return {S,draw,set,run,out,tog,cancel:()=>{tok++;}};
}

/* ---------- 1975 access-path walker ---------- */
function Nav(L,host,onDone){
  const P=[['1041',0],['1042',1],['1043',0],['1044',1],['1045',1],['1046',0]];
  let mode=0,cur=-1,idx=false,walked=false,ranIdx=false,tok=0,fin=false;const vis=new Set();let lit=[],litIdx=false;
  host.insertAdjacentHTML('beforeend','<div class="rd-row" id="nv-md"><button class="chip sel" data-m="0">1975: network</button><button class="chip" data-m="1">Relational</button></div>'+
    '<div id="nv-q"></div><div class="rd-fig"><svg id="nv-svg" viewBox="0 0 312 200" role="img" aria-label="The parcels as linked records or as a table"></svg></div><div class="rd-row" id="nv-ctl"></div><div class="rd-out" id="nv-out" aria-live="polite"></div>');
  const svg=L.$('#nv-svg');
  function drawNet(){let g='';
    const px=i=>4+i*52;
    g+=R(4,6,128,28,8,'fill:var(--h1-bg);stroke:var(--h1);stroke-width:1.5')+T(68,24,'Bramble & Bolt','font-size="11.5" font-weight="700" text-anchor="middle" fill="var(--h1)"')+T(144,18,'each record points','font-size="11.2" fill="var(--muted)"')+T(144,31,'to the next one','font-size="11.2" fill="var(--muted)"');
    g+=AR(24,34,24,62,'h1');
    P.forEach((p,i)=>{if(i<5)g+=AR(px(i)+42,79,px(i+1)-1,79,'h1');});
    const hx=[64,206];
    P.forEach((p,i)=>{g+=LN(hx[p[1]]+38,150,px(i)+21,96,'stroke:var(--h4);stroke-width:1.2;stroke-dasharray:4 3');});
    P.forEach((p,i)=>{const v=vis.has(i),m=v&&p[1]===1;g+=R(px(i),64,42,32,7,'fill:var(--'+(m?'ok-bg':v?'soft2':'card')+');stroke:var(--'+(m?'ok':'line2')+');stroke-width:1.5')+T(px(i)+21,84,p[0],'font-size="11.5" font-weight="700" text-anchor="middle" fill="var(--'+(m?'ok':'ink')+')"');
      if(v)g+=T(px(i)+21,112,m?'✓':'–','font-size="12" font-weight="700" text-anchor="middle" fill="var(--'+(m?'ok':'muted')+')"');});
    ['W. Central','W. North'].forEach((h,i)=>{g+=R(hx[i],150,76,28,8,'fill:var(--h4-bg);stroke:var(--h4);stroke-width:1.5')+T(hx[i]+38,168,h,'font-size="11.5" font-weight="700" text-anchor="middle" fill="var(--h4)"');});
    g+=T(156,196,'Hub links: each parcel has a second parent','font-size="11.2" text-anchor="middle" fill="var(--muted)"');
    const cx=cur<0?[4,6,128,28]:[px(cur),64,42,32];
    g+=R(cx[0]-4,cx[1]-4,cx[2]+8,cx[3]+8,10,'fill:none;stroke:var(--pri);stroke-width:3');
    svg.setAttribute('viewBox','0 0 312 202');svg.innerHTML=g;}
  function drawRel(){let g='';
    g+=R(2,4,194,22+P.length*21,9,'fill:var(--card);stroke:var(--pri);stroke-width:1.5')+R(3.5,5.5,191,19,7.5,'fill:var(--pri-bg)');
    g+=T(10,19,'code','font-size="11.2" font-weight="700" fill="var(--pri)"')+T(76,19,'merchant','font-size="11.2" font-weight="700" fill="var(--pri)"')+T(134,19,'hub','font-size="11.2" font-weight="700" fill="var(--pri)"');
    P.forEach((p,i)=>{const y=26+i*21,on=lit.includes(i),m=on&&p[1]===1;
      g+=(on?R(4,y+1,190,19,5,'fill:var(--'+(m?'ok':'pri')+'-bg)'):'')+T(10,y+15,'OP-'+p[0],'font-size="11.2" fill="var(--ink)"')+T(76,y+15,'M-17','font-size="11.2" fill="var(--ink)"')+T(134,y+15,p[1]?'W. North':'W. Central','font-size="11.2" fill="var(--'+(m?'ok':'ink')+')"'+(m?' font-weight="700"':''));});
    if(idx){g+=R(206,4,104,112,9,'fill:var(--card);stroke:var(--h4);stroke-width:1.5')+R(207.5,5.5,101,19,7.5,'fill:var(--h4-bg)')+T(214,19,'index on hub','font-size="11.2" font-weight="700" fill="var(--h4)"');
      [['W. Central','1041 1043 1046'],['W. North','1042 1044 1045']].forEach((e,i)=>{const y=32+i*40;g+=(litIdx&&i===1?R(209,y-4,98,36,6,'fill:var(--h4-bg)'):'')+T(214,y+10,e[0],'font-size="11.2" font-weight="700" fill="var(--h4)"')+T(214,y+25,e[1],'font-size="11.2" fill="var(--ink)"');});}
    svg.setAttribute('viewBox','0 0 312 156');svg.innerHTML=g;}
  function out(h){L.$('#nv-out').innerHTML=h;}
  function check(){if(walked&&ranIdx&&!fin){fin=true;onDone();}}
  function ui(){
    L.$$('#nv-md .chip').forEach(b=>b.classList.toggle('sel',+b.dataset.m===mode));
    L.$('#nv-q').innerHTML=mode?'<div class="rd-code"><span>parcels where merchant = M-17</span><span>and hub = W. North</span></div><p class="rd-hint" style="margin-top:-2px">You say <b>what</b> you want. The query optimizer picks the path.</p>':'';
    const c=L.$('#nv-ctl');
    if(!mode){c.innerHTML='<button class="btn pri" id="nv-next"'+(cur>=P.length-1?' disabled':'')+'>'+L.ic('arrow')+'Follow the next link</button>';
      L.$('#nv-next').onclick=()=>{if(cur>=P.length-1)return;cur++;vis.add(cur);const p=P[cur];drawNet();
        if(cur===P.length-1){walked=true;L.$('#nv-next').disabled=true;out('<b>7 records visited</b> to find 3 parcels. Your code had to know this path. If the path you need doesn’t exist, you change the access paths and rewrite the hand-written query code. Hand-picked paths squeezed speed out of slow 1970s tape drives, but made change hard.');check();}
        else out('Record '+(cur+2)+' of 7: OP-'+p[0]+' → hub '+(p[1]?'W. North <b>✓ match</b>':'W. Central, not a match')+'. Keep following.');};
      drawNet();if(cur<0)out('The cursor starts at the merchant record. In this model you reach data only by following links, one record at a time.');}
    else{c.innerHTML='<button class="btn pri" id="nv-run">'+L.ic('play')+'Run the query</button><button class="btn" id="nv-idx"'+(idx?' disabled':'')+'>'+L.ic('list')+(idx?'Index added':'Add an index on hub')+'</button>';
      L.$('#nv-run').onclick=async()=>{const my=++tok;lit=[];litIdx=false;drawRel();
        if(!idx){for(let i=0;i<P.length;i++){lit.push(i);drawRel();await wait(90);if(my!==tok||!svg.isConnected)return;}
          out('<b>6 rows read.</b> No index on hub yet, so the optimizer reads the whole table. Try adding an index, then run the same query again.');}
        else{litIdx=true;drawRel();await wait(250);for(const i of [1,3,4]){lit.push(i);drawRel();await wait(140);if(my!==tok||!svg.isConnected)return;}
          ranIdx=true;out('<b>3 rows read.</b> The optimizer spotted the new index and used it. The query text didn’t change at all.');check();}};
      L.$('#nv-idx').onclick=()=>{if(idx)return;idx=true;tok++;lit=[];litIdx=false;L.$('#nv-idx').disabled=true;L.$('#nv-idx').innerHTML=L.ic('check')+'Index added';drawRel();out('An index on hub now exists. Your query stays exactly the same. Run it again.');};
      drawRel();if(!lit.length&&!idx)out('Same parcels, laid out as one table. No links to follow.');}
  }
  L.$('#nv-md').addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(!b)return;mode=+b.dataset.m;tok++;lit=[];litIdx=false;ui();});
  ui();
}

/* ---------- postcode schema change player ---------- */
function Schema(L,host,onDone){
  const ROWS=[['OP-4801','14 Kiln Road','WP3 7QA'],['OP-4802','2 Mill Lane','WP1 4RT'],['OP-4803','9 Dock Road','WP2 8LN'],['OP-4804','31 Elm Street','WP3 2HX']];

  const CODE={w:[['ALTER TABLE parcels','  ADD COLUMN postcode;'],['UPDATE parcels','  SET postcode = …;  -- every row']],

    rows.forEach((r,i)=>{const y=20+i*29,fl=st.flash===i,nw=i===4;

      g+=T(10,y+16.5,r[0],'font-size="11.5" font-weight="700" fill="var(--ink)"')+T(66,y+16.5,r[1]+', '+r[2],'font-size="11.2" fill="var(--muted)"');
      if(mode==='w'){if(st.col){g+=R(226,y+4,78,17,5,'fill:var(--'+(st.fill[i]?'h3-bg':'soft')+');stroke:var(--h3);stroke-width:1;stroke-dasharray:'+(st.fill[i]?'0':'3 2'))+T(265,y+16,st.fill[i]?r[2]:'empty','font-size="11.2" text-anchor="middle" fill="var(--'+(st.fill[i]?'h3':'muted')+')"'+(st.fill[i]?' font-weight="600"':''));}}
      else{if(nw)g+=R(226,y+4,78,17,5,'fill:var(--h3-bg);stroke:var(--h3);stroke-width:1')+T(265,y+16,r[2],'font-size="11.2" text-anchor="middle" font-weight="600" fill="var(--h3)"');
        else if(st.derived===i)g+=R(226,y+4,78,17,5,'fill:var(--card);stroke:var(--h3);stroke-width:1.2;stroke-dasharray:3 2')+T(265,y+16,r[2],'font-size="11.2" text-anchor="middle" font-style="italic" fill="var(--h3)"');
        else g+=T(265,y+16,'no field','font-size="11.2" text-anchor="middle" fill="var(--muted)"');}});
    let y=20+rows.length*29+4;
    if(st.bar>=0){g+=R(2,y,308,10,5,'fill:var(--soft2)')+R(2,y,r1(308*st.bar),10,5,'fill:var(--no)')+T(156,y+24,'MySQL copies the whole table first','font-size="11.2" text-anchor="middle" fill="var(--no)"');y+=30;}
    svg.setAttribute('viewBox','0 0 312 '+(y+2));svg.innerHTML=g;}
  function code(on){L.$('#sc-code').innerHTML=CODE[mode].map((g,i)=>'<span'+(on===i?' class="on"':'')+'>'+g.map(l=>X(l).replace(/  /g,'&nbsp;&nbsp;')).join('<br>')+'</span>').join('');}
  function out(h){L.$('#sc-out').innerHTML=h;}
  function reset(){tok++;st={col:false,fill:[],flash:-1,bar:-1,extra:false,derived:-1};
    L.$$('#sc-md .chip').forEach(b=>b.classList.toggle('sel',b.dataset.m===mode));
    L.$('#sc-my').innerHTML=mode==='w'?'<button class="chip'+(mysql?' sel':'')+'" id="sc-myb" aria-pressed="'+mysql+'">Old MySQL engine: '+(mysql?'on':'off')+'</button>':'';
    const mb=L.$('#sc-myb');if(mb)mb.onclick=()=>{mysql=!mysql;reset();};
    L.$('#sc-go').disabled=false;draw();code(-1);
    out(mode==='w'?'Schema-on-write: the database checks every write against the table’s columns. Adding a field means a migration.':'Schema-on-read: the database stores whatever it’s given. The reading code decides what the fields mean.');}
  L.$('#sc-md').addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(!b)return;mode=b.dataset.m;reset();});
  L.$('#sc-go').onclick=async()=>{const my=++tok;const ok=()=>my===tok&&svg.isConnected;L.$('#sc-go').disabled=true;
    if(mode==='w'){code(0);
      if(mysql){for(let k=1;k<=10;k++){st.bar=k/10;draw();await wait(90);if(!ok())return;}}
      st.col=true;st.bar=-1;draw();await wait(300);if(!ok())return;code(1);
      for(let i=0;i<ROWS.length;i++){st.flash=i;st.fill[i]=true;draw();await wait(230);if(!ok())return;}
      st.flash=-1;draw();code(-1);done.add(mysql?'wm':'w');
      out((mysql?'<b>The ALTER copied the whole table</b>: minutes or even hours on a big one. ':'<b>The ALTER took milliseconds</b> on most databases. ')+'<b>The UPDATE rewrote every row</b>, which is slow on a big table. A middle path: skip the UPDATE, leave old rows empty and fill them in when read.');}

      out('<b>Nothing was rewritten.</b> New parcels carry a postcode. When code reads an old one like OP-4802, it works the postcode out from the address on the spot.');}
    if((done.has('w')||done.has('wm'))&&done.has('r'))onDone();};
  reset();
}

Course.lesson({
  id:'0003', title:'Relational versus document models', minutes:20, icon:'layers',
  goals:['Tell when data is a tree that fits one document, and when its links need IDs and joins','Explain why storing IDs beats copying names, and how the 1970s fought the same fight','Choose between schema-on-read and schema-on-write, and know when a document’s locality pays off'],
  parts:['Layers','Trees','Links','Today'],
  read:'Read the first half of chapter 2 of the book for the LinkedIn résumé example and the full history of IMS and CODASYL.',
  glossary:{
    'data-model':'Data model: the general shape you give your data so a database can store it, such as tables (relational), nested documents, or a graph.',
    'document-model':'Document model: data kept as self-contained documents, usually JSON, where items that belong to a record are nested inside it.',
    'impedance':'Impedance mismatch (object-relational mismatch): the awkward gap between the objects in application code and the tables, rows and columns of a relational database.',
    'polyglot':'Polyglot persistence: using several kinds of datastore side by side, each for the job it suits best.',
    'one-to-many':'One-to-many relationship: one record owns several items, like a parcel and its scan events. Data made of these forms a tree.',
    'many-to-one':'Many-to-one relationship: many records point at the same item, like many parcels sent by one merchant.',
    'many-to-many':'Many-to-many relationship: items on both sides link to many on the other side, like parcels and the hubs they pass through.',
    'normalization':'Normalization: storing each human-meaningful fact in only one place and referring to it by ID everywhere else, instead of copying it into every record.',
    'join':'Join: combining records that refer to each other, for example a parcel with its merchant’s details, at the time you read them.',
    'optimizer':'Query optimizer: the part of a database that decides how to run a query: which indexes to use, which join method, and in what order.',
    'access-path':'Access path: in old network (CODASYL) databases, the chain of links a program had to follow by hand to reach a record.',
    'schema-on-read':'Schema-on-read: the database doesn’t enforce a structure. The code that reads the data assumes one and interprets it at read time.',
    'schema-on-write':'Schema-on-write: the schema is explicit, and the database checks that every write fits it (the traditional relational approach).',
    'locality':'Locality: data that is read together is stored together, so one read fetches it all.',
    'shredding':'Shredding: splitting a tree-shaped record into several tables, such as a parcels table and a scans table.'
  },
  cheatsheet:[
    'A <b>data model</b> is a layer that hides the one below it. It decides which jobs feel natural and which feel awkward.',
    'One-to-many items with one parent each form a <b>tree</b>. A document stores the tree whole: one read, good <b>locality</b>.',
    'Refer to <b>shared</b> things by <b>ID</b>. Copy them instead and every rename must find every copy, or some go stale (that’s why we normalize).',
    'Many-to-one and many-to-many links need <b>joins</b>. Document databases had weak joins, so the work moved into app code.',
    'Rule of thumb: <b>embed</b> what one record owns; <b>refer by ID</b> to what many records share.',
    'History: IMS stored trees, CODASYL made programmers walk <b>access paths</b> by hand, and the relational <b>query optimizer</b> won.',
    '<b>Schema-on-read</b> (your code interprets on read) suits varied or outside-controlled data. <b>Schema-on-write</b> (the database checks every write) documents and protects a shared shape.',
    'Locality only pays when you need most of the document: keep documents small. The two models are converging (JSON columns, joins in document databases).'

{part:0,src:'Warm-up',pts:1,run(L){

{part:0,src:'Chapter 2 · Data Models and Query Languages',
 solve:async L=>{for(let k=0;k<4;k++){L.$('#ly-go').click();await L.sleep(20);}},
 run(L){
  const C=['The real world: a parcel for Mrs. Okoro. Everything below is hidden from it. Lift the lid to see how each layer is built.',
   'Otterpost’s developers model the world as <b>objects in code</b>: a Parcel with a list of scans. These are specific to the app.',
   'To store those objects, they’re expressed in a <b>general-purpose '+L.g('data-model','data model')+'</b>: tables, JSON documents or a graph. This chapter compares them.',
   'The database’s own engineers decided how tables or documents become <b>bytes</b> in memory, on disk and on the network.',
   'Hardware engineers turn bytes into current, light pulses or magnetic fields. <b>Each layer hides the one below behind a clean model.</b>'];
  let cur=0;
  L.h(CSS+L.kick('learn','Data models come in layers')+'<h1 class="q">Follow parcel OP-48213 down through the layers</h1><div id="ly"></div><p class="rd-cap" id="ly-c"></p><div class="rd-row"><button class="btn pri" id="ly-go">'+L.ic('down')+'Lift the lid: one layer down</button></div>');

    if(cur===4){L.$('#ly-go').disabled=true;L.sheet('info','Why layers matter','The clean boundary between layers lets the database vendor’s engineers and Otterpost’s developers each do their job. But every model carries assumptions: some jobs feel natural in it, others awkward or slow. So the choice of model matters.');L.done();}};
 }},

{part:0,src:'Chapter 2 · Data Models and Query Languages',pts:1,

 run(L){

   ['A 20 KB document',{s:1,m:0,c:0,h:0,kb:20},'scan','A tiny scan forces a big rewrite. Keep documents small and avoid writes that grow them.'],
   ['Read only the status',{s:1,m:0,c:0,h:0,kb:20},'stat','Locality only pays when you need most of the document at once.']];

{part:3,src:'Chapter 2 · Schema flexibility in the document model',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Merchants attach their own extras to parcels: one sends “fragile”, one an age check, one a gift message. They change formats without warning. Which fits these extras?</h1>');
  L.mc(L.card,['Schema-on-write: a column per merchant field','Schema-on-write: reject any unknown field','Schema-on-read: store them, interpret on read'],2,
   'The shape is set by outside systems you don’t control, and it varies by merchant. Here a strict schema hurts more than it helps.',
   'Outside systems decide this shape and change it at will. A strict schema would keep breaking or rejecting merchants’ data. Schema-on-read fits.');}},

{part:3,src:'Chapter 2 · Convergence of document and relational databases',pts:1,run(L){
  L.h(CSS+L.kick('learn','The models are converging')+'<h1 class="q">Relational learned JSON; documents learned joins</h1>'+figConverge()+
   CAP('Each side borrowed the other’s strength. The book sees a hybrid as a good direction: handle document-like data and run relational queries on it.')+
   '<div id="fq"><h2 class="sub">Tobias: “Let’s move the whole Parcel DB to a document database. The tracking page reads parcels as trees.” What should Zainab suggest?</h2></div>');
  L.mc(L.$('#fq'),['Move it all; documents are newer and simpler','Keep it relational; add a JSON column for extras','Split each parcel into one table per scan type'],1,
   'Parcels link to merchants, couriers, hubs and credit, which needs joins. The tree-like, merchant-specific extras can live in a JSON column. That’s the hybrid the book likes.',
   'Parcels have many many-to-one links, so a document store would push joins into app code. Keep the Parcel DB relational, and use a JSON column for the tree-like extras.');}}
  ]
});
</script>
