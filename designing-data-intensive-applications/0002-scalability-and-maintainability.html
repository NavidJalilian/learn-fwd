/* ---------- small helpers ---------- */
function scRng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function scGauss(r){let u=0;while(!u)u=r();const v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function scFmt(v){return v<1000?Math.round(v)+' ms':(Math.round(v/100)/10)+' s';}
function scRange(id,label,min,max,val,step){return '<label class="sc-rng" for="'+id+'"><span>'+label+'</span><input type="range" id="'+id+'" min="'+min+'" max="'+max+'" step="'+(step||1)+'" value="'+val+'"><b id="'+id+'-v"></b></label>';}
function scSet(L,id,v){const e=L.$('#'+id);e.value=v;e.dispatchEvent(new Event('input',{bubbles:true}));}
function scTx(x,y,s,st){return '<text x="'+x+'" y="'+y+'" style="'+st+'">'+s+'</text>';}
const SC_HALO='paint-order:stroke;stroke:var(--card);stroke-width:3.5px;stroke-linejoin:round;';
function scTasks(id,items){return '<ul class="sc-tasks" id="'+id+'">'+items.map((t,j)=>'<li data-k="'+j+'"><i></i><span>'+t+'</span></li>').join('')+'</ul>';}
function scTick(L,id,k){const li=L.$('#'+id+' li[data-k="'+k+'"]');if(li)li.classList.add('done');return [...L.$$('#'+id+' li')].every(x=>x.classList.contains('done'));}
async function scWait(L,sel,n){for(let i=0;i<(n||120)&&!L.$(sel);i++)await L.sleep(25);}

/* ---------- the data behind the dot strip (fixed seeds: every learner sees the same requests) ---------- */
const SCD=(()=>{
  const R=scRng(7),N=200;
  const U=[...Array(N)].map((_,i)=>(i+.5)/N);for(let i=N-1;i>0;i--){const j=Math.floor(R()*(i+1));[U[i],U[j]]=[U[j],U[i]];}
  const F=[...Array(N)].map(()=>[...Array(20)].map(()=>Math.round(70*Math.exp(.32*scGauss(R)))));
  const S=[...Array(N)].map(()=>Math.round(600+R()*2200));
  /* s = share of backend calls that are slow, k = calls per page; a page is as slow as its slowest call */
  function pages(s,k){const ph=1-Math.pow(1-s,k);return F.map((f,i)=>{let v=Math.max(...f.slice(0,k));const hit=U[i]<ph;if(hit)v=Math.max(v,S[i]);return {v,c:hit?'s':'f',hit};});}
  /* one server with 2 workers, requests arriving on their own schedule; two heavy merchant reports */
  function queue(){const r=scRng(4),heavy=new Set([80,81]),free=[0,0],svc=[],cli=[];let t=0;
    for(let i=0;i<N;i++){const h=heavy.has(i),d=h?1200+Math.round(r()*300):Math.round(38*Math.exp(.3*scGauss(r)));
      t+=-Math.log(1-r())*32;const w=free[0]<=free[1]?0:1,start=Math.max(t,free[w]);free[w]=start+d;
      svc.push({v:d,c:h?'s':'f'});cli.push({v:Math.round(start+d-t),c:h?'s':(start-t>100?'q':'f')});}
    return {svc,cli};}
  /* two web servers: A is quiet and fast, B is overloaded */
  function two(){const r=scRng(21),a=[...Array(180)].map(()=>({v:Math.round(60*Math.exp(.3*scGauss(r))),c:'a'})),b=[...Array(20)].map(()=>({v:Math.round(650*Math.exp(.45*scGauss(r))),c:'b'}));return {a,b};}
  return {pages,queue,two};
})();
function scP(vals,p){const v=vals.map(x=>x.v).sort((a,b)=>a-b);return v[Math.ceil(p/100*v.length)-1];}
function scMean(vals){return vals.reduce((a,x)=>a+x.v,0)/vals.length;}

/* ---------- 1. the dot strip ---------- */
const SC_COL={f:'var(--h1)',s:'var(--no-strong)',q:'var(--h3)',a:'var(--h1)',b:'var(--h2)'};
const SC_FLAG={50:'var(--h2)',95:'var(--h3)',99:'var(--ink)'};
function Strip(L,host,o){
  o=Object.assign({id:'st',H:200,flags:[],mean:false,user:0,hl:[],ro:['mean','p50','p95','p99'],legend:''},o||{});
  const ID=o.id,H=o.H,X0=48,X1=312,T=28,B=H-24,lo=20,hi=4000;
  host.insertAdjacentHTML('beforeend','<svg class="sc-svg'+(o.user?' drag':'')+'" id="'+ID+'" viewBox="0 0 320 '+H+'" role="img" aria-label="Response times as dots, sorted from fastest on the left to slowest on the right. Higher means slower."></svg>'+
    (o.user?scRange(ID+'-u','Your flag',1,200,o.user):'')+'<div class="sc-ro" id="'+ID+'-ro" aria-live="polite"></div>');
  const svg=host.querySelector('#'+ID),ro=host.querySelector('#'+ID+'-ro');
  const S={vals:[],flags:o.flags.slice(),mean:o.mean,hl:o.hl.slice(),user:o.user,ro:o.ro.slice()};
  const X=i=>X0+(i+.5)/S.vals.length*(X1-X0);
  const Y=v=>T+(1-(Math.log(Math.max(lo,Math.min(hi,v)))-Math.log(lo))/(Math.log(hi)-Math.log(lo)))*(B-T);
  const rk=p=>Math.ceil(p/100*S.vals.length);
  function pname(r){const n=S.vals.length,p=Math.round(r/n*1000)/10;return r===n/2?'p50 (median)':'p'+p;}
  function draw(){
    if(!svg.isConnected)return;
    const v=S.vals;let s='';
    [50,100,300,1000,3000].forEach(t=>{const y=Y(t);s+='<line x1="'+X0+'" x2="'+X1+'" y1="'+y+'" y2="'+y+'" style="stroke:var(--line);stroke-width:1"/>'+scTx(X0-5,y+4,t===50?'50 ms':t<1000?t:(t/1000)+' s','font-size:12px;fill:var(--muted);text-anchor:end');});
    s+=scTx(X0,H-5,'← fastest','font-size:12px;fill:var(--muted)')+scTx((X0+X1)/2,H-5,'one dot per request','font-size:12px;fill:var(--muted);text-anchor:middle')+scTx(X1,H-5,'slowest →','font-size:12px;fill:var(--muted);text-anchor:end');
    v.forEach((d,i)=>{s+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(d.v).toFixed(1)+'" r="2.3" style="fill:'+SC_COL[d.c]+'"/>';});
    const hls=S.hl.slice();if(S.mean)hls.push({v:scMean(v),label:'mean '+scFmt(scMean(v)),col:'var(--h4)',right:true});
    hls.forEach(h=>{const y=Y(h.v);s+='<line x1="'+X0+'" x2="'+X1+'" y1="'+y+'" y2="'+y+'" style="stroke:'+h.col+';stroke-width:2;stroke-dasharray:5 4"/>'+
      scTx(h.right?X1-2:X0+4,y-5,h.label,SC_HALO+'font-size:12px;font-weight:700;fill:'+h.col+(h.right?';text-anchor:end':''));});
    const fl=S.flags.map(p=>({x:X(rk(p)-1),y:Y(v[rk(p)-1].v),t:'p'+p,col:SC_FLAG[p]||'var(--ink)',w:2}));
    if(S.user){const r=S.user;fl.push({x:X(r-1),y:Y(v[r-1].v),t:'your flag',col:'var(--pri)',w:3,u:true});}
    fl.sort((a,b)=>a.x-b.x);let lastX=-99,row=0;
    fl.forEach(f=>{row=(f.x-lastX<34)?1-row:0;lastX=f.x;const ly=row?24:11,cx=Math.max(X0+14,Math.min(318-(f.u?28:12),f.x));
      s+='<line x1="'+f.x+'" x2="'+f.x+'" y1="'+(ly+3)+'" y2="'+B+'" style="stroke:'+f.col+';stroke-width:'+f.w+'"/>'+
        '<circle cx="'+f.x+'" cy="'+f.y+'" r="5" style="fill:none;stroke:'+f.col+';stroke-width:2.2"/>'+
        scTx(cx,ly,f.t,SC_HALO+'font-size:12px;font-weight:700;text-anchor:middle;fill:'+f.col)+
        (f.u?'<circle cx="'+f.x+'" cy="'+B+'" r="7" style="fill:var(--pri);stroke:var(--card);stroke-width:2"/>':'');});
    svg.innerHTML=s;
    const st=k=>{const c={mean:['var(--h4)','Mean'],p50:['var(--h2)','Median (p50)'],p95:['var(--h3)','p95'],p99:['var(--ink)','p99']}[k];
      const val=k==='mean'?scMean(v):scP(v,{p50:50,p95:95,p99:99}[k]);return '<span><i style="background:'+c[0]+'"></i>'+c[1]+' <b>'+scFmt(val)+'</b></span>';};
    let h=S.ro.filter(k=>k!=='hits'&&k!=='user').map(st).join('');
    if(S.ro.includes('hits')){const n=v.filter(d=>d.hit).length;h+='<span><i style="background:var(--no-strong)"></i>Pages hit by a slow call <b>'+n+' of '+v.length+' ('+(Math.round(n/v.length*1000)/10)+'%)</b></span>';}
    if(S.user){h='<span><i style="background:var(--pri)"></i>Your flag: <b>'+pname(S.user)+' = '+scFmt(v[S.user-1].v)+'</b></span><span>'+S.user+' of '+v.length+' requests take this long or less</span>';
      const lab=host.querySelector('#'+ID+'-u-v');if(lab)lab.textContent=S.user;}
    ro.innerHTML=h;
  }
  if(o.user){const inp=host.querySelector('#'+ID+'-u');
    inp.addEventListener('input',()=>{S.user=+inp.value;draw();if(o.onUser)o.onUser(S.user);});
    let drag=false;const at=e=>{const r=svg.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*320;
      const i=Math.round((x-X0)/(X1-X0)*S.vals.length-.5);inp.value=Math.max(1,Math.min(S.vals.length,i+1));inp.dispatchEvent(new Event('input',{bubbles:true}));};
    svg.addEventListener('pointerdown',e=>{drag=true;try{svg.setPointerCapture(e.pointerId);}catch(_){}at(e);});
    svg.addEventListener('pointermove',e=>{if(drag)at(e);});
    ['pointerup','pointercancel'].forEach(t=>svg.addEventListener(t,()=>{drag=false;}));}
  function set(vals){S.vals=vals.slice().sort((a,b)=>a.v-b.v);draw();}
  return {S,set,draw,alive:()=>svg.isConnected,get vals(){return S.vals;}};
}

/* ---------- 2. the load ladder ---------- */
const LD_M=[1,3,10,100],LD_ML=[['1×','today'],['3×','Peak Week'],['10×',''],['100×','']];
const LD_ROWS={
  web:['Web servers (keep no data)',[['as','As is'],['up','Scale up'],['out','Scale out']]],
  db:['Parcel DB (holds the data)',[['as','As is'],['up','Scale up'],['split','Split it']]],
  nt:['Delay notices',[['read','Look up on view'],['push','Push to pages'],['hyb','Hybrid']]],
  big:['Which notice to measure',[[1,'Biggest: Bramble & Bolt, 60,000 parcels'],[0,'Average: 150 parcels']]]};
function ldCalc(st,m){
  const V=1000*m,servers=st.web==='out'?Math.max(4,Math.ceil(V/300)):4,webCap=st.web==='up'?8000:servers*500;
  const dbLoad=({read:1250,push:300,hyb:340})[st.nt]*m;
  const dbN=st.db==='split'?Math.max(1,Math.ceil(dbLoad/1000)):1,dbCap=st.db==='up'?16000:st.db==='split'?dbN*2000:2000;
  const parcels=(st.big?60000:150)*m,secs=st.nt==='push'||(st.nt==='hyb'&&!st.big)?Math.max(.1,parcels/1000):1;
  return {web:V/webCap,servers,db:dbLoad/dbCap,dbN,notice:secs/30,secs};
}
const ldLvl=p=>p<.7?'ok':p<=1?'am':'no';
function Ladder(L,host,o){
  o=Object.assign({id:'ld',rungs:[0,1,2,3],bars:['web','db','nt'],rows:['web','db','nt'],at:0,state:{},lockSplit:false,on:()=>{}},o||{});
  const ID=o.id,st=Object.assign({web:'as',db:'as',nt:'read',big:1},o.state);let at=o.at;
  host.insertAdjacentHTML('beforeend','<div class="ld"><div class="ld-top"><div class="ld-lad" id="'+ID+'-lad" role="group" aria-label="Load level"></div><div class="ld-bars" id="'+ID+'-bars"></div></div>'+
    '<p class="ld-leg">Solid tick = full capacity. Dotted tick = 70%: Kwame wants 30% headroom. Green = under 70%.</p>'+
    '<div class="ld-ctl" id="'+ID+'-ctl"></div><div class="ld-say" id="'+ID+'-say" aria-live="polite"></div></div>');
  const $=s=>host.querySelector(s),alive=()=>!!$('#'+ID+'-say')&&$('#'+ID+'-say').isConnected;
  [3,2,1,0].forEach(k=>{const b=document.createElement('button');b.className='ld-r';b.id=ID+'-r'+k;b.innerHTML='<i></i>'+LD_ML[k][0]+(LD_ML[k][1]?'<small>'+LD_ML[k][1]+'</small>':'');
    if(!o.rungs.includes(k))b.disabled=true;b.onclick=()=>{if(!o.rungs.includes(k))return;at=k;draw();o.on({type:'rung',k});};$('#'+ID+'-lad').appendChild(b);});
  o.rows.forEach(r=>{const R=LD_ROWS[r];$('#'+ID+'-ctl').insertAdjacentHTML('beforeend','<div class="sc-lbl">'+R[0]+'</div><div class="sc-row" id="'+ID+'-'+r+'"></div>');
    R[1].forEach(([v,t])=>{const b=document.createElement('button');b.className='chip';b.id=ID+'-'+r+'-'+v;b.textContent=t;
      if(o.lockSplit&&r==='db'&&v==='split'){b.disabled=true;b.title='Femi: the Parcel DB stays on one machine this year';b.textContent='Split: not this year';}
      b.onclick=()=>{if(b.disabled)return;st[r]=v;draw();o.on({type:'set',r,v});};$('#'+ID+'-'+r).appendChild(b);});});
  const moves=()=>(st.web!=='as')+(st.db!=='as')+(st.nt!=='read');
  const worst=m=>{const c=ldCalc(st,m);return Math.max(...o.bars.map(b=>b==='nt'?c.notice:c[b]));};
  function draw(){
    if(!alive())return;const m=LD_M[at],c=ldCalc(st,m);
    o.rungs.forEach(k=>{const b=$('#'+ID+'-r'+k);b.classList.toggle('cur',k===at);b.querySelector('i').className='g-'+ldLvl(worst(LD_M[k]));b.setAttribute('aria-pressed',k===at);});

Course.lesson({
  id:'0002', title:'Scalability and maintainability', minutes:22, icon:'trend',
  goals:['Describe load with the right load parameters and decide where to do the work','Measure performance with percentiles instead of averages, and spot where the tail hides','Judge scaling and maintainability choices: up or out, operability, simplicity, evolvability'],
  parts:['Describing load','Measuring performance','Coping with load','Maintainability'],
  read:'Read chapter 1 of the book from “Scalability” to the end for the Twitter case, percentiles and the three maintainability principles.',
  glossary:{
    'load-parameter':'Load parameter: one of a few numbers that describe the load on your system, such as requests per second, the ratio of reads to writes, or a cache’s hit rate. Which ones matter depends on your design.',
    'fan-out':'Fan-out: how many places one piece of work has to reach. For Twitter, one new tweet has to be copied into the timeline of every follower.',
    'throughput':'Throughput: how much work a system gets through per second, such as records processed. Batch jobs usually care most about it.',
    'response-time':'Response time: what the client sees, from sending a request to getting the answer. It includes network delays, time waiting in a queue and the actual work.',
    'latency':'Latency: the part of a request’s life spent waiting to be handled. Often used loosely to mean response time, but the book keeps them apart.',
    'percentile':'Percentile: sort all response times from fastest to slowest; the 95th percentile (p95) is the time that 95% of requests beat. The median is p50.',
    'tail-latency':'Tail latency: the response times at high percentiles (p99, p999): the slowest requests.',
    'head-of-line':'Head-of-line blocking: a few slow requests at the front of a queue hold up the fast requests behind them.',
    'sla':'Service level agreement (SLA): a contract saying how fast and how available a service must be, often stated in percentiles. Service level objectives (SLOs) set the same kind of targets.',
    'shared-nothing':'Shared-nothing architecture: spreading the load over several machines, each with its own processor, memory and disks, that coordinate only over the network.',
    'elastic':'Elastic system: one that adds computing resources by itself when it detects more load.',
    'accidental-complexity':'Accidental complexity: complexity that isn’t part of the problem users see, but comes only from how the software was built.'
  },
  cheatsheet:[
    '“Is it scalable?” means nothing alone. Ask: <b>if load grows this way, what are our options?</b>',
    'Describe load with <b>load parameters</b>. For Twitter, the follower distribution (fan-out) mattered more than tweets per second.',
    'Reads far outnumber writes? Do more work <b>at write time</b>. Exempt the huge cases (Twitter’s celebrities) and merge them <b>at read time</b>.',
    'Measure <b>response time</b> as a distribution. Use the median for typical, <b>p95/p99/p999</b> for the tail; the mean hides how many users suffered.',
    'Queues make the tail: measure at the client, load-test without waiting for answers, and <b>add histograms</b>, never average percentiles. One slow backend call makes the whole page slow.',
    '<b>Scale up</b> (bigger machine) or <b>scale out</b> (more machines, shared-nothing). Stateless is easy to spread; stateful is hard. Rethink at every 10× jump.',
    '<b>No magic scaling sauce:</b> a design rests on guesses about which operations are common. For an early or unproven product, iterating fast on features usually matters more than scaling for imagined load.',
    'Most software cost is maintenance. Design for <b>operability</b>, <b>simplicity</b> (remove accidental complexity with good abstractions) and <b>evolvability</b>.'
  ],
  steps:[

{part:1,src:'Chapter 1 · Describing Performance',run(L){

  const br=(x1,x2,y,up,col,t)=>'<path d="M'+x1+' '+(y+(up?6:-6))+' V'+y+' H'+x2+' V'+(y+(up?6:-6))+'" style="fill:none;stroke:'+col+';stroke-width:2"/>'+scTx((x1+x2)/2,y+(up?-6:16),t,'font-size:12.5px;font-weight:700;text-anchor:middle;fill:'+col);
  L.h(L.kick('learn','Describing performance')+'<h1 class="q">What a recipient waits for when the tracking page loads</h1>'+
   '<svg class="sc-svg" viewBox="0 0 320 200" role="img" aria-label="A request’s life: network, waiting in the queue, the actual work, network back. Response time covers all of it; latency is only the waiting.">'+
   br(8,312,40,true,'var(--h1)','response time: what the client sees')+
   seg(8,44,'var(--soft2)','var(--line2)','net')+seg(54,104,'var(--h3-bg)','var(--h3)','waiting in queue')+seg(160,104,'var(--h1-bg)','var(--h1)','service: the work')+seg(266,46,'var(--soft2)','var(--line2)','net')+
   br(54,158,104,false,'var(--h3)','latency: waiting to be handled')+
   '<line x1="8" x2="312" y1="150" y2="150" style="stroke:var(--line);stroke-width:1"/>'+
   scTx(8,172,'Linh’s nightly batch job asks a different question:','font-size:12.5px;fill:var(--muted)')+
   '<g>'+[0,1,2,3,4,5,6,7].map(k=>'<rect class="sc-mv" x="'+(8+k*26)+'" y="180" width="18" height="12" rx="3" style="fill:var(--h2-bg);stroke:var(--h2)"/>').join('')+'</g>'+
   scTx(312,190,'records / s','font-size:12.5px;font-weight:700;text-anchor:end;fill:var(--h2);'+SC_HALO)+'</svg>'+
   '<div class="sc-cap">Online systems like the tracking page care about '+L.g('response-time','response time')+'; batch jobs care about '+L.g('throughput','throughput')+'. People often say '+L.g('latency','latency')+' for response time, but latency is only the waiting part.</div>');
  L.done();}},
{part:1,src:'Chapter 1 · Describing Performance',
 solve:async L=>{scSet(L,'s7',6);},
 run(L){
  L.h(L.kick('ex','Explore the dot strip')+'<h1 class="q">200 tracking-page requests, sorted. Slide until the mean is double the median.</h1><div id="s7h"></div>'+
   scRange('s7','Slow requests',0,10,0,.5)+
   '<p class="small" style="margin:0">Slow = a garbage-collection pause, a lost network packet that must be resent, a read from disk, a background process grabbing the CPU, even vibrations in the server rack…</p><p class="sc-ill">Response times are illustrative.</p>');
  const sp=Strip(L,L.$('#s7h'),{id:'s7s',mean:true,flags:[50],ro:['mean','p50']});
  const upd=()=>{const s=+L.$('#s7').value;L.$('#s7-v').textContent=s+'%';const v=SCD.pages(s/100,1);sp.set(v);
    const mean=scMean(v),med=scP(v,50);
    if(mean>=2*med&&!L.$('#s7ok')){L.$('#s7h').insertAdjacentHTML('beforeend','<span id="s7ok"></span>');const above=v.filter(d=>d.v>mean).length;
      L.sheet('info','The mean drifted away from almost everyone','The mean is now '+scFmt(mean)+', but the median is still '+scFmt(med)+': half the requests are faster than that, as before. Only '+above+' of 200 requests are slower than the mean. The mean (add up, divide by the count) doesn’t show how many real users waited that long.');L.done();}};
  L.$('#s7').oninput=upd;upd();}},
{part:1,src:'Chapter 1 · Describing Performance',
 solve:async L=>{['#s8-50','#s8-95','#s8-99'].forEach(s=>L.$(s).click());},
 run(L){
  L.h(L.kick('learn','Percentiles')+'<h1 class="q">Sort the requests, then plant a flag. Tap each one.</h1>'+
   '<div class="sc-row"><button class="btn" id="s8-50">Plant p50</button><button class="btn" id="s8-95">Plant p95</button><button class="btn" id="s8-99">Plant p99</button></div><div id="s8h"></div>'+
   '<div class="sc-cap" id="s8c" aria-live="polite"><span class="t">Percentiles</span>A percentile is a spot in the sorted list. Plant a flag to see what it tells you.</div>');
  const sp=Strip(L,L.$('#s8h'),{id:'s8s',ro:[]});const v=SCD.pages(.05,1);sp.set(v);
  const T={50:'<b>p50, the median:</b> half the requests are faster than '+scFmt(scP(v,50))+', half slower. It’s the typical wait.',
    95:'<b>p95:</b> 95 in 100 requests are faster than '+scFmt(scP(v,95))+'; 5 in 100 take that long or longer.',
    99:'<b>p99:</b> 99 in 100 are faster than '+scFmt(scP(v,99))+'. The slowest 1 in 100 wait longer. p999 is the same idea for 1 in 1,000, so it needs at least 1,000 requests.'};
  [50,95,99].forEach(p=>{L.$('#s8-'+p).onclick=()=>{if(!sp.S.flags.includes(p))sp.S.flags.push(p);sp.S.ro=sp.S.flags.map(x=>'p'+x);sp.draw();L.$('#s8-'+p).classList.add('pri');
    L.$('#s8c').innerHTML='<span class="t">'+sp.S.flags.length+' of 3 flags</span>'+T[p];
    if(sp.S.flags.length===3&&!L.$('#s8ok')){L.$('#s8h').insertAdjacentHTML('beforeend','<span id="s8ok"></span>');
      L.sheet('info','Percentiles say how many people waited','p95 and p99 are '+L.g('percentile','percentiles')+'. One catch about the median: it describes one request. A recipient whose page needs several requests is far more than 50% likely to hit at least one slower than the median.');L.done();}};});}},
{part:1,src:'Chapter 1 · Describing Performance',pts:1,
 solve:async L=>{scSet(L,'s9s-u',198);L.$('#s9go').click();},
 run(L){
  let first=true;
  L.h(L.kick('try','Find the percentile')+'<h1 class="q">These are merchant-dashboard pages. Kwame needs their p99. Drag your flag to it, then lock it in.</h1><div id="s9h"></div>'+
   '<button class="btn pri" id="s9go">'+L.ic('check')+'Lock in my flag</button>');
  const sp=Strip(L,L.$('#s9h'),{id:'s9s',user:100,ro:['user']});sp.set(SCD.pages(.01,5));
  L.$('#s9go').onclick=()=>{const r=sp.S.user,ok=r===198,val=scFmt(sp.vals[197].v);
    if(first){L.award(ok);first=false;}
    if(ok){L.$('#s9go').disabled=true;L.sheet('ok','That’s p99','198 of 200 pages take '+val+' or less: 99 in 100. Only the slowest 2, the 1%, take longer. Notice how far the p99 sits from the median.');L.done();}
    else L.sheet('no','Not p99 yet','p99 is the spot where 99% of the requests are at or below the flag: 99% of 200 is 198. Your flag is at '+r+'. Move it until the readout says p99.');};}},
{part:1,src:'Chapter 1 · Describing Performance',run(L){
  L.h(L.kick('learn','Why the tail matters')+'<h1 class="q">The slowest requests often belong to your best customers</h1><div id="s10h"></div>'+
   '<div class="sc-cap">High percentiles are the '+L.g('tail-latency','tail')+'. At Amazon, the slowest requests often come from the biggest buyers, who have the most data. The dashed lines are an '+L.g('sla','SLA')+'.</div>');
  const sp=Strip(L,L.$('#s10h'),{id:'s10s',flags:[50,99],ro:['p50','p99'],hl:[{v:200,label:'SLA: median < 200 ms ✓',col:'var(--ok)'},{v:1000,label:'SLA: p99 < 1 s missed → refund',col:'var(--no)'}]});
  sp.set(SCD.pages(.05,1));
  L.$('#s10h').insertAdjacentHTML('beforeend','<p class="sc-ill" style="margin:0">The book’s example SLA, which also asks for 99.9% uptime. Times are illustrative.</p>');
  L.card.insertAdjacentHTML('beforeend','<div class="sc-facts"><span><b>Amazon</b> targets <b>p999</b></span><span><b>p9999</b>: too costly</span><span><b>+100 ms</b> → 1% fewer sales</span><span><b>+1 s</b> → 16% lower satisfaction score</span></div>');
  L.done();}},
{part:1,src:'Chapter 1 · Describing Performance',
 solve:async L=>{for(let p=0;p<3;p++){L.$('#e11-p'+p).click();await L.sleep(10);L.$('#e11-v1').click();await L.sleep(10);}},
 run(L){
  L.h(L.kick('ex','Edge-case lab')+'<h1 class="q">Peak Week, day one: the server says 40 ms, recipients say seconds. Open each case, then flip its view.</h1>'+
   '<div class="sc-row" id="e11"></div><div class="sc-row" id="e11v"></div><div id="e11h"></div><div class="sc-cap" id="e11c" aria-live="polite"></div>');
  const sp=Strip(L,L.$('#e11h'),{id:'e11s',ro:['p50','p95','p99']});
  const q=SCD.queue(),tw=SCD.two(),all=tw.a.concat(tw.b),pa=scP(tw.a,99),pb=scP(tw.b,99),avg=(pa+pb)/2,real=scP(all,99);
  const P=[
   ['Queue',[['Server’s timer',()=>{sp.S.hl=[];sp.S.flags=[50,95,99];sp.S.ro=['p50','p95','p99'];sp.set(q.svc);},'The server starts its timer when it picks a request up. Two heavy merchant reports (red) took over a second, but almost everything else looks fast.'],
     ['Client’s timer',()=>{sp.S.hl=[];sp.S.flags=[50,95,99];sp.S.ro=['p50','p95','p99'];sp.set(q.cli);},'Same requests, timed by the client. The server works on two at a time, so the fast requests behind those reports waited in the queue (amber). This is '+L.g('head-of-line','head-of-line blocking')+'. Measure response time at the client.']]],
   ['Load test',[['Tester waits',()=>{sp.S.hl=[];sp.S.flags=[50,95,99];sp.S.ro=['p50','p95','p99'];sp.set(q.svc.map(d=>({v:d.v,c:d.c})));},'Last month’s load test sent the next request only after the last one returned. No queue ever built up, so the tail barely showed and the test looked fine.'],
     ['Real users',()=>{sp.S.hl=[];sp.S.flags=[50,95,99];sp.S.ro=['p50','p95','p99'];sp.set(q.cli);},'Real recipients keep arriving whatever the response times. A load tester must do the same, or its queues stay unrealistically short and the measurements are skewed.']]],
   ['Two servers',[['Average p99s',()=>{sp.S.flags=[];sp.S.ro=[];sp.S.hl=[{v:avg,label:'average of the p99s: '+scFmt(avg),col:'var(--h4)'}];sp.set(all);},'Web-1 (blue) has p99 '+scFmt(pa)+'; the overloaded web-2 (green) has p99 '+scFmt(pb)+'. Kwame averages them: '+scFmt(avg)+'. That number means nothing.'],
     ['Add the histograms',()=>{sp.S.hl=[];sp.S.flags=[99];sp.S.ro=['p99'];sp.set(all);},'Pool all 200 requests (add the two histograms), then read the p99: '+scFmt(real)+'. Averaging percentiles, across machines or time windows, is mathematically meaningless. Algorithms such as t-digest or HdrHistogram approximate percentiles cheaply.']]]];
  const seen=P.map(()=>new Set());let cur=-1;
  P.forEach((p,j)=>{const b=document.createElement('button');b.className='chip';b.id='e11-p'+j;b.textContent=p[0];b.onclick=()=>open(j);L.$('#e11').appendChild(b);});
  function open(j){cur=j;[...L.$('#e11').children].forEach((x,k)=>x.classList.toggle('sel',k===j));
    L.$('#e11v').innerHTML=P[j][1].map((v,k)=>'<button class="btn" id="e11-v'+k+'">'+(k?L.ic('arrow'):'')+v[0]+'</button>').join('');
    P[j][1].forEach((v,k)=>{L.$('#e11-v'+k).onclick=()=>view(j,k);});view(j,0);}
  function view(j,k){[0,1].forEach(x=>L.$('#e11-v'+x).classList.toggle('pri',x===k));P[j][1][k][1]();seen[j].add(k);
    if(seen[j].size===2)L.$('#e11-p'+j).classList.add('ok');
    L.$('#e11c').innerHTML='<span class="t">'+P[j][0]+' · '+P[j][1][k][0]+'</span>'+P[j][1][k][2];
    if(seen.every(s=>s.size===2)&&!L.$('#e11ok')){L.$('#e11h').insertAdjacentHTML('beforeend','<span id="e11ok"></span>');
      L.sheet('info','Queues make the tail','Waiting in line often makes up much of the slowest responses, and only the client sees that wait. Watch percentiles over a rolling window (say, the last 10 minutes, recomputed every minute), and combine servers by adding histograms.');L.done();}}
  L.$('#e11c').innerHTML='<span class="t">Pick a case</span>Each one changes what the strip shows. Amber dots waited in a queue.';
  sp.S.flags=[50,95,99];sp.set(q.svc);}},
{part:1,src:'Chapter 1 · Percentiles in Practice',run(L){
  const lane=(y,t,len,slow)=>scTx(104,y-5,t,'font-size:12px;fill:var(--muted)')+(slow?'':'<line x1="'+(108+len)+'" x2="278" y1="'+(y+7)+'" y2="'+(y+7)+'" style="stroke:var(--line2);stroke-width:2;stroke-dasharray:2 4"/>')+'<rect x="104" y="'+y+'" width="'+len+'" height="14" rx="5" style="fill:'+(slow?'var(--no-strong)':'var(--h1)')+'"/>'+'<line x1="88" y1="95" x2="102" y2="'+(y+7)+'" style="stroke:var(--line2);stroke-width:1.5"/>';
  L.h(L.kick('learn','Percentiles in practice')+'<h1 class="q">One slow call makes the whole page slow</h1>'+
   '<svg class="sc-svg" viewBox="0 0 320 196" role="img" aria-label="The tracking page calls four services in parallel. Three answer fast, one is slow, and the page is ready only when the slowest one answers.">'+
   '<rect x="6" y="72" width="82" height="46" rx="10" style="fill:var(--h2-bg);stroke:var(--h2);stroke-width:2"/>'+scTx(47,92,'Tracking','font-size:12.5px;font-weight:700;text-anchor:middle;fill:var(--ink)')+scTx(47,107,'page','font-size:12.5px;font-weight:700;text-anchor:middle;fill:var(--ink)')+
   lane(30,'Parcel DB',52)+lane(70,'ETA model',64)+lane(110,'Notices',176,1)+lane(150,'Merchant info',44)+
   '<line x1="280" x2="280" y1="20" y2="172" style="stroke:var(--no);stroke-width:2;stroke-dasharray:5 4"/>'+scTx(316,14,'page ready','font-size:12.5px;font-weight:700;text-anchor:end;fill:var(--no)')+
   scTx(104,190,'dotted = waiting for the slow call','font-size:12px;fill:var(--muted)')+'</svg>'+
   '<div class="sc-cap">Even when the calls run in parallel, the page waits for the slowest. So even if only a few backend calls are slow, many more pages hit one. The book calls this <b>tail latency amplification</b>.</div>');
  L.done();}},
{part:1,src:'Chapter 1 · Percentiles in Practice',pts:1,
 solve:async L=>{L.$('#p13').children[1].click();await scWait(L,'#p13ok',200);},
 run(L){
  let pick=null;
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">1% of backend calls are slow. Each tracking page now makes 10 calls in parallel. What share of pages will be slow?</h1>'+
   '<div class="sc-row" id="p13"></div><div id="p13h"></div><div id="p13k"></div>');
  const sp=Strip(L,L.$('#p13h'),{id:'p13s',flags:[50,99],ro:['p50','p99','hits']});sp.set(SCD.pages(.01,1));
  ['About 1%','About 10%','About half'].forEach((t,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=t;
    b.onclick=async()=>{if(pick!==null)return;pick=j;b.classList.add('sel');
      for(let k=2;k<=10;k++){await L.sleep(130);if(!sp.alive())return;sp.set(SCD.pages(.01,k));}
      const ok=j===1;b.classList.remove('sel');b.classList.add(ok?'ok':'no');L.award(ok);
      L.sheet(ok?'ok':'no',ok?'Right: about 10%':'It’s about 10%','Each call has a 99% chance to be fast, so all 10 are fast only 0.99<sup>10</sup> ≈ 90% of the time. About 1 page in 10 hits a slow call, ten times the rate of single calls. The page’s p99 jumped too.');
      L.$('#p13k').innerHTML=scRange('p13c','Calls per page',1,20,10)+'<span id="p13ok"></span>';
      const upd=()=>{const k=+L.$('#p13c').value;L.$('#p13c-v').textContent=k;sp.set(SCD.pages(.01,k));};L.$('#p13c').oninput=upd;upd();L.done();};
    L.$('#p13').appendChild(b);});}},
{part:1,src:'Chapter 1 · Percentiles in Practice',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Sound practice or mistake?',['Sound practice','Mistake'],[
   ['To get one Otterpost-wide p99, Kwame averages the p99 of each of the six web servers.',1,'Averaging percentiles is meaningless. Add the six histograms, then read the p99 off the total.'],
   ['The page calls 5 services at once, each slow 1% of the time. Tobias says 1% of pages will be slow.',1,'The page waits for the slowest call, so about 5% of pages hit at least one slow call. That’s tail latency amplification.'],
   ['Zainab tracks p50, p95 and p99 over the last 10 minutes, recomputed every minute.',0,'A rolling window keeps the dashboard current without storing everything forever.'],
   ['The load tester waits for each response before sending its next request.',1,'That keeps queues artificially short. The tester should send independently of response times.'],
   ['Femi judges the merchant dashboard by its p999, since the biggest merchants have the slowest pages.',0,'Like Amazon’s p999 targets: the tail is where the most valuable customers are.']]);}},

{part:2,src:'Chapter 1 · Approaches for Coping with Load',run(L){
  const srv=(x,y,w,h,col,bg)=>'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="5" style="fill:'+bg+';stroke:'+col+';stroke-width:1.8"/>'+[1,2,3].filter(k=>k*9<h-4).map(k=>'<line x1="'+(x+5)+'" x2="'+(x+w-5)+'" y1="'+(y+k*9)+'" y2="'+(y+k*9)+'" style="stroke:'+col+';stroke-width:1.5;opacity:.6"/>').join('');
  L.h(L.kick('learn','Scaling up or scaling out')+'<h1 class="q">Two ways to add capacity</h1>'+
   '<svg class="sc-svg" viewBox="0 0 320 262" role="img" aria-label="Left: one small machine replaced by one much bigger machine; simpler to run, but high-end machines get very expensive. Right: six small machines, each with its own CPU, memory and disks, linked by a network. Below: machines can be added by hand, which is simpler with fewer surprises, or by an elastic system that adds them itself.">'+
   scTx(76,16,'Scale up','font-size:13px;font-weight:700;text-anchor:middle;fill:var(--h1)')+scTx(76,30,'vertical','font-size:12px;text-anchor:middle;fill:var(--muted)')+
   srv(14,118,30,30,'var(--line2)','var(--soft)')+'<path d="M50 133 h20" style="stroke:var(--h1);stroke-width:2.2" marker-end="url(#up-a)"/>'+srv(80,46,64,102,'var(--h1)','var(--h1-bg)')+
   scTx(76,168,'one bigger machine','font-size:12px;text-anchor:middle;fill:var(--ink)')+
   '<line x1="160" x2="160" y1="10" y2="168" style="stroke:var(--line);stroke-width:1.5"/>'+
   scTx(242,16,'Scale out','font-size:13px;font-weight:700;text-anchor:middle;fill:var(--h2)')+scTx(242,30,'horizontal · shared-nothing','font-size:12px;text-anchor:middle;fill:var(--muted)')+
   [0,1,2].map(c=>[0,1].map(r=>srv(186+c*38,72+r*42,30,30,'var(--h2)','var(--h2-bg)')).join('')).join('')+
   '<path d="M190 60 Q242 40 294 60" style="fill:none;stroke:var(--h2);stroke-width:1.5;stroke-dasharray:3 3"/>'+scTx(242,52,'network','font-size:11.5px;text-anchor:middle;fill:var(--h2)')+
   scTx(242,168,'more, smaller machines','font-size:12px;text-anchor:middle;fill:var(--ink)')+
   scTx(76,186,'+ simpler to run','font-size:11.5px;text-anchor:middle;fill:var(--ok)')+scTx(76,201,'− high end gets very costly','font-size:11.5px;text-anchor:middle;fill:var(--no)')+
   scTx(242,186,'each has its own CPU,','font-size:11.5px;text-anchor:middle;fill:var(--muted)')+scTx(242,201,'memory and disks','font-size:11.5px;text-anchor:middle;fill:var(--muted)')+
   '<line x1="4" x2="316" y1="212" y2="212" style="stroke:var(--line);stroke-width:1.5"/>'+
   scTx(160,228,'Who adds the machines?','font-size:12px;font-weight:700;text-anchor:middle;fill:var(--muted)')+
   '<circle cx="18" cy="245" r="6" style="fill:none;stroke:var(--h1);stroke-width:2"/>'+scTx(30,242,'By hand','font-size:12px;font-weight:700;fill:var(--ink)')+scTx(30,256,'simpler, fewer surprises','font-size:11px;fill:var(--muted)')+
   '<path d="M173 245 a6 6 0 1 1 3 5" style="fill:none;stroke:var(--h2);stroke-width:2"/><path d="M172 252 l4 -2 l-1 4z" style="fill:var(--h2)"/>'+scTx(186,242,'Elastic','font-size:12px;font-weight:700;fill:var(--ink)')+scTx(186,256,'adds them by itself','font-size:11px;fill:var(--muted)')+
   '<defs><marker id="up-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8z" style="fill:var(--h1)"/></marker></defs></svg>'+
   '<div class="sc-cap">Out is '+L.g('shared-nothing','shared-nothing')+'. Real designs mix both: a few fairly powerful machines can beat many tiny ones. '+L.g('elastic','Elastic')+' suits very unpredictable load.</div>');
  L.done();}},
{part:2,src:'Chapter 1 · Approaches for Coping with Load',
 solve:async L=>{L.$('#l16-web-out').click();L.$('#l16-nt-hyb').click();L.$('#l16-r1').click();},
 run(L){
  L.h(L.kick('pr','Explore the load ladder')+'<h1 class="q">Climb to 3× Peak Week and get every bar green. Tap a rung, then make moves.</h1><div id="l16"></div><p class="sc-ill">Loads and capacities are illustrative.</p>');
  const ld=Ladder(L,L.$('#l16'),{id:'l16',on:()=>check()});
  function check(){if(ld.worst(3)<.7&&!L.$('#l16ok')){L.$('#l16').insertAdjacentHTML('beforeend','<span id="l16ok"></span>');
    L.sheet('info','You just asked both of the book’s questions','First: keep the machines and raise the load; what happens to performance? (The bars go red.) Second: keep performance; how much must you add? (Your moves.) The web servers keep no data, so adding more of them is easy. Look at the 10× rung next.');L.done();}}
  check();}},
{part:2,src:'Chapter 1 · Approaches for Coping with Load',
 solve:async L=>{for(let p=0;p<3;p++){L.$('#e17-p'+p).click();await L.sleep(10);}},
 run(L){
  L.h(L.kick('ex','Edge-case lab')+'<h1 class="q">Where do the easy moves stop working? Try each case.</h1><div class="sc-row" id="e17"></div><div class="sc-cap" id="e17c" aria-live="polite"></div><div id="e17h"></div>');
  const ld=Ladder(L,L.$('#e17h'),{id:'e17',state:{web:'out',db:'up',nt:'hyb'},at:1});
  const P=[['Bigger web machines at 10×',{web:'up',db:'up',nt:'hyb'},2,'One bigger machine has a ceiling, and high-end machines get very expensive. Web servers keep no data between requests (stateless), so spreading them over more machines is the easy fix.'],
    ['100× load',{web:'out',db:'up',nt:'hyb'},3,'Even the biggest Parcel DB machine Otterpost can buy runs out. A design that fits one level of load rarely copes with ten times that: expect to rethink at every order of magnitude.'],
    ['Split the Parcel DB',{web:'out',db:'split',nt:'hyb'},3,'Green again, but read the warning. Spreading a stateful database over machines adds a lot of complexity. The common wisdom: scale the database up until cost or availability forces a split. Better tools may change that.']];
  const seen=new Set();
  P.forEach((p,j)=>{const b=document.createElement('button');b.className='chip';b.id='e17-p'+j;b.textContent=p[0];
    b.onclick=()=>{ld.set(p[1]);ld.at=p[2];seen.add(j);[...L.$('#e17').children].forEach((x,k)=>x.classList.toggle('sel',k===j));b.classList.add('ok');
      L.$('#e17c').innerHTML='<span class="t">'+p[0]+'</span>'+p[3];
      if(seen.size===3&&!L.$('#e17ok')){L.$('#e17h').insertAdjacentHTML('beforeend','<span id="e17ok"></span>');L.done();}};L.$('#e17').appendChild(b);});
  L.$('#e17c').innerHTML='<span class="t">Pick a case</span>The ladder starts with a design that passes 3×. Each case jumps to a limit.';}},
{part:2,src:'Chapter 1 · Approaches for Coping with Load',run(L){
  const dots=[...Array(52)].map((_,k)=>'<circle cx="'+(-18+k*5.6)+'" cy="'+(46+((k*7)%5)*3)+'" r="2" style="fill:var(--h1)"/>').join('');
  L.h(L.kick('learn','No magic scaling sauce')+'<h1 class="q">Same bytes per second, very different systems</h1>'+
   '<svg class="sc-svg" viewBox="0 0 320 170" role="img" aria-label="Top pipe: a stream of tiny requests. Bottom pipe: a couple of huge requests. Both carry about 100 megabytes a second.">'+
   scTx(8,18,'100,000 requests/s × 1 kB','font-size:12.5px;font-weight:700;fill:var(--h1)')+
   '<defs><clipPath id="pp1"><rect x="6" y="31" width="252" height="36" rx="18"/></clipPath><clipPath id="pp2"><rect x="6" y="117" width="252" height="36" rx="18"/></clipPath></defs><rect x="4" y="30" width="256" height="38" rx="19" style="fill:var(--soft);stroke:var(--line2)"/><g clip-path="url(#pp1)"><g class="sc-mv">'+dots+'</g></g>'+
   scTx(8,104,'3 requests/min × 2 GB','font-size:12.5px;font-weight:700;fill:var(--h3)')+
   '<rect x="4" y="116" width="256" height="38" rx="19" style="fill:var(--soft);stroke:var(--line2)"/><g clip-path="url(#pp2)"><g class="sc-mvb"><rect x="14" y="121" width="58" height="28" rx="6" style="fill:var(--h3-bg);stroke:var(--h3);stroke-width:2"/></g></g>'+
   [49,135].map(y=>'<rect x="264" y="'+(y-14)+'" width="54" height="28" rx="8" style="fill:var(--card);stroke:var(--line2)"/>'+scTx(291,y+5,'100 MB/s','font-size:12px;font-weight:700;text-anchor:middle;fill:var(--ink)')).join('')+
   '</svg>'+
   L.quote('there is no such thing as a generic, one-size-fits-all scalable architecture','Martin Kleppmann, chapter 1')+
   '<div class="sc-cap">Every scalable design rests on guesses about which operations are common: its load parameters. Guess wrong, and the scaling work is wasted or even harmful.</div>');
  L.done();}},
{part:2,src:'Chapter 1 · Approaches for Coping with Load',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Courier phones send a steady stream of tiny GPS pings. Linh’s nightly export ships a few huge files. Over a day, both move about the same megabytes per second. Tobias: “Same throughput, so reuse the GPS design.” Right?</h1>');
  L.mc(L.card,['Yes: equal throughput means an equal design','Yes, as long as both use the same database','No: tiny frequent and huge rare loads differ'],2,
   'Like the book’s 1 kB versus 2 GB example: equal throughput, but many tiny requests and a few huge files stress completely different things.',
   'Equal throughput doesn’t mean equal design, and sharing a database doesn’t fix it. Many tiny messages and a few huge files need very different systems.');}},
{part:2,src:'Chapter 1 · Approaches for Coping with Load',pts:1,
 solve:async L=>{L.$('#l20-web-out').click();L.$('#l20-db-up').click();L.$('#l20-nt-hyb').click();L.$('#l20go').click();await scWait(L,'#l20ok',200);},
 run(L){
  let first=true,running=false;
  L.h(L.kick('pr','Challenge')+'<h1 class="q">Kwame’s plan for growth: every bar green on every rung up to 10×. Femi’s rule: the Parcel DB stays on one machine this year. Make your moves, then climb.</h1>'+
   '<div id="l20"></div><button class="btn pri" id="l20go" style="margin-top:8px">'+L.ic('play')+'Climb to 10×</button><div id="l20res"></div>');
  const ld=Ladder(L,L.$('#l20'),{id:'l20',rungs:[0,1,2,3],lockSplit:true});
  L.$('#l20go').onclick=async()=>{if(running)return;running=true;L.$('#l20go').disabled=true;L.$('#l20res').innerHTML='';
    const rows=[];for(const k of [0,1,2]){ld.at=k;await L.sleep(450);if(!ld.alive())return;const w=ld.worst(LD_M[k]);rows.push([LD_ML[k][0]+(LD_ML[k][1]?' '+LD_ML[k][1]:''),w<.7,Math.round(w*100)]);}
    L.$('#l20res').innerHTML='<div class="ld-res">'+rows.map(r=>(r[1]?'<span class="ok-t">✓</span> ':'<span class="no-t">✗</span> ')+r[0]+': fullest bar at '+r[2]+'%').join('<br>')+'</div>';
    const pass=rows.every(r=>r[1]);if(first){L.award(pass);first=false;}running=false;L.$('#l20go').disabled=false;
    if(pass){L.$('#l20go').disabled=true;L.$('#l20res').insertAdjacentHTML('beforeend','<span id="l20ok"></span>');
      L.sheet('ok','Green to 10×','More web machines (stateless, easy to spread), one bigger Parcel DB machine (the common wisdom for stateful data), and the hybrid for notices, so views stay cheap and the giant notice is written once. Tap 100×: even this design needs rethinking there.');L.done();}
    else L.sheet('no','Not yet','Find the red or amber bar on the failing rung. Web servers need room to grow past 3×; the Parcel DB needs a lighter notice design <i>and</i> more power by 10×; pushing every notice can’t deliver Bramble & Bolt’s in time.');};}},

/* ---------- PART 4: MAINTAINABILITY ---------- */
{part:3,src:'Chapter 1 · Maintainability',run(L){
  const chores=['fix bugs','keep it running','investigate failures','new platforms','new uses','pay off tech debt','add features'];
  L.h(L.kick('learn','Maintainability')+'<h1 class="q">Most of software’s cost comes after it ships</h1>'+
   '<svg class="sc-svg" viewBox="0 0 320 70" role="img" aria-label="A bar of a system’s lifetime cost: a short part for building it, and a much longer part for maintaining it.">'+
   scTx(4,16,'Cost over a system’s life','font-size:12.5px;font-weight:700;fill:var(--muted)')+
   '<rect x="4" y="26" width="56" height="34" rx="8" style="fill:var(--h1-bg);stroke:var(--h1);stroke-width:1.8"/>'+scTx(32,47,'build','font-size:12.5px;font-weight:700;text-anchor:middle;fill:var(--h1)')+
   '<rect x="64" y="26" width="252" height="34" rx="8" style="fill:var(--h3-bg);stroke:var(--h3);stroke-width:1.8"/>'+scTx(190,47,'maintain: most of the cost','font-size:12.5px;font-weight:700;text-anchor:middle;fill:var(--h3)')+
   '</svg><div class="sc-facts" style="margin-top:0">'+chores.map(c=>'<span style="background:var(--h3-bg)">'+c+'</span>').join('')+'</div>'+
   '<div class="lp">'+[['eye','Operability','Easy for operations to keep it running'],['leaf','Simplicity','Easy for new engineers to understand'],['cycle','Evolvability','Easy to change for needs nobody foresaw']].map((p,k)=>'<div'+(k===2?' class="w"':'')+'><small>'+L.ic(p[0])+'Principle '+(k+1)+'</small><b style="font-size:18px">'+p[1]+'</b><span>'+p[2]+'</span></div>').join('')+'</div>'+
   '<div class="sc-cap">Many people dislike working on “legacy” systems. The goal is to design software that won’t become one. Simplicity here means the code, not a simple user interface.</div>');
  L.done();}},
{part:3,src:'Chapter 1 · Operability: Making Life Easy for Operations',
 solve:async L=>{L.$('#o22-ask').click();await scWait(L,'#o22-do');L.$('#o22-do').click();await scWait(L,'#o22ok',200);},
 run(L){
  const H=['Good monitoring','Predictable: “if I do X, Y happens”','Not tied to one machine','Good defaults you can override','Self-healing, with manual control','Automation and standard tools'];
  let lit=new Set([0]),state='live';
  L.h(L.kick('learn','Operability')+'<h1 class="q">Kwame must patch web-2 tonight. Ask what will happen, then do it.</h1>'+
   '<svg class="sc-svg" id="o22s" viewBox="0 0 320 178" role="img" aria-label="A load balancer sends tracking-page traffic to three web servers. A small chart below shows p99 response time."></svg>'+
   '<div class="sc-row"><button class="btn" id="o22-ask">'+L.ic('info')+'What happens if I patch web-2?</button></div><div id="o22p"></div>'+
   '<div class="sc-facts" id="o22h"></div>'+
   '<div class="sc-cap">Strong operations can often make up for weak software; the reverse doesn’t work. A data system helps by making routine work easy, so the team can focus on high-value work.</div>');
  function draw(){const web=k=>{const down=k===1&&state==='patch',x=20+k*100;return '<rect x="'+x+'" y="92" width="80" height="34" rx="8" style="fill:'+(down?'var(--soft)':'var(--h2-bg)')+';stroke:'+(down?'var(--line2)':'var(--h2)')+';stroke-width:2'+(down?';stroke-dasharray:5 4':'')+'"/>'+
      scTx(x+40,108,'web-'+(k+1),'font-size:12.5px;font-weight:700;text-anchor:middle;fill:var(--ink)')+scTx(x+40,121,down?'patching…':k===1&&state==='done'?'patched ✓':'running','font-size:11px;text-anchor:middle;fill:'+(down?'var(--muted)':'var(--h2)'));};
    const share=state==='patch'?['50%','','50%']:['33%','33%','33%'];
    let s='<rect x="100" y="8" width="120" height="30" rx="8" style="fill:var(--card);stroke:var(--line2);stroke-width:1.8"/>'+scTx(160,27,'Load balancer','font-size:12.5px;font-weight:700;text-anchor:middle;fill:var(--ink)');
    [0,1,2].forEach(k=>{if(share[k])s+='<line x1="160" y1="38" x2="'+(60+k*100)+'" y2="90" style="stroke:var(--h1);stroke-width:'+(share[k]==='50%'?3.2:2)+'"/>'+scTx(160+(k*100-100)*.62+(k===1?16:0),72,share[k],SC_HALO+'font-size:12px;font-weight:700;text-anchor:middle;fill:var(--h1)');});
    s+=web(0)+web(1)+web(2);
    s+=scTx(8,152,'p99','font-size:12px;font-weight:700;fill:var(--muted)')+'<polyline points="34,160 70,158 106,161 142,159 178,160 214,158 250,161 286,159 312,160" style="fill:none;stroke:var(--ok-strong);stroke-width:2"/>'+scTx(312,174,'steady: merchants notice nothing','font-size:11.5px;text-anchor:end;fill:var(--ok)');
    L.$('#o22s').innerHTML=s;
    L.$('#o22h').innerHTML=H.map((h,k)=>'<span style="'+(lit.has(k)?'background:var(--ok-bg);color:var(--ok)':'')+'">'+(lit.has(k)?'✓ ':'')+h+'</span>').join('');}
  L.$('#o22-ask').onclick=()=>{if(L.$('#o22-do'))return;lit.add(1);draw();
    L.$('#o22p').innerHTML='<div class="ld-say"><b>Preview:</b> web-2 stops taking traffic; web-1 and web-3 take half each; no request is lost. When the patch is done, web-2 rejoins.</div><div class="sc-row"><button class="btn pri" id="o22-do">'+L.ic('play')+'Patch web-2</button></div>';
    L.$('#o22-do').onclick=async()=>{L.$('#o22-do').disabled=true;state='patch';draw();await L.sleep(1100);if(!L.$('#o22s'))return;state='done';lit.add(2);draw();
      L.$('#o22p').insertAdjacentHTML('beforeend','<span id="o22ok"></span>');
      L.sheet('info','Routine work stayed routine','Kwame knew what would happen before acting, and no single machine was essential. Other things the book lists: good monitoring, automation, good documentation, sensible defaults admins can override, and self-healing with manual control. Ops teams also plan capacity, apply security patches and keep knowledge alive as people come and go.');L.done();};};
  draw();}},
{part:3,src:'Chapter 1 · Simplicity: Managing Complexity',pts:1,
 solve:async L=>{[0,1,2].forEach(k=>L.$('#m23-k'+k).click());L.$('#m23go').click();},
 run(L){
  const K=[['Three names for the parcel ID: pid, parcel_id, ref',[0,1,2],[],1],['A Bramble & Bolt special case, copied into 5 modules',[0,1,3,4,5],[],1],['Every module reads Billing’s tables directly',[2],[1,5,9,10,11],1],
    ['Prices that vary by parcel size and zone',[2],[],0],['Redelivery rules for when nobody is home',[3,4],[],0]];
  const cut=new Set();let doneOnce=false;
  L.h(L.kick('pr','Untangle the mud')+'<h1 class="q">Zainab’s parcel code has become a ball of mud. Strike out only the <i>accidental</i> complexity, then clean up.</h1>'+
   '<svg class="sc-svg" id="m23s" viewBox="0 0 320 196" role="img" aria-label="Six modules of the parcel code with tangled links between all of them."></svg><p class="small" id="m23n" style="margin:0"></p>'+
   '<div class="mud-k" id="m23k"></div><button class="btn pri" id="m23go">'+L.ic('leaf')+'Clean up</button>');
  const draw=(hl)=>{const k=hl==null?null:K[hl];L.$('#m23s').innerHTML=mudSvg({hlM:k?k[1]:[],hlE:k?k[2]:[]});L.$('#m23n').textContent='15 direct links between 6 modules. Tap an item to see where it lives.';};
  K.forEach((k,j)=>{const b=document.createElement('button');b.className='chip';b.id='m23-k'+j;b.textContent=k[0];
    b.onclick=()=>{if(doneOnce)return;cut.has(j)?cut.delete(j):cut.add(j);b.classList.toggle('cut',cut.has(j));b.setAttribute('aria-pressed',cut.has(j));draw(j);};L.$('#m23k').appendChild(b);});
  draw();
  L.$('#m23go').onclick=()=>{if(doneOnce)return;doneOnce=true;L.$('#m23go').disabled=true;
    const ok=K.every((k,j)=>cut.has(j)===!!k[3]);L.award(ok);
    K.forEach((k,j)=>{const b=L.$('#m23-k'+j);b.classList.remove('cut');b.classList.add(k[3]?'cut':'static');if(cut.has(j)!==!!k[3])b.classList.add('no');});
    L.$('#m23s').innerHTML=mudSvg({clean:true,tags:true});L.$('#m23n').textContent='6 links, all through one Parcel API. Pricing and redelivery rules are still there.';
    L.sheet(ok?'ok':'no',ok?'Mud cleared':'Not quite','Names, a copied special case and modules reaching into each other’s tables come only from how the code was built: '+L.g('accidental-complexity','accidental complexity')+'. Pricing and redelivery rules are the real problem merchants and recipients have, so they stay. Simpler doesn’t mean fewer features. The tool: a good <b>abstraction</b>, a clean surface hiding detail, like SQL hiding on-disk structures, other clients’ requests and the mess left by crashes. Good abstractions for distributed systems are much harder to find.');L.done();};}},
{part:3,src:'Chapter 1 · Evolvability: Making Change Easy',
 solve:async L=>{L.$('#v24-b0').click();L.$('#v24-go').click();await L.sleep(10);L.$('#v24-b1').click();L.$('#v24-go').click();},
 run(L){
  let view=0;const seen=new Set();
  const D=[['Before cleanup',{touch:[0,1,3,4,5]},'5 modules each parse addresses their own way. All 5 must change, and each may hide its own surprise.'],
    ['After cleanup',{clean:true,touch:[6]},'Addresses live behind the Parcel API. One place changes; the six modules don’t notice.']];
  L.h(L.kick('ex','Evolvability')+'<h1 class="q">New need: Nordhaven addresses have a different format. Apply the change to each design.</h1>'+
   '<div class="sc-row"><button class="chip" id="v24-b0">Before cleanup</button><button class="chip" id="v24-b1">After cleanup</button></div>'+
   '<svg class="sc-svg" id="v24s" viewBox="0 0 320 196" role="img" aria-label="The parcel code, with the modules a change touches highlighted."></svg>'+
   '<div class="sc-row"><button class="btn pri" id="v24-go">'+L.ic('pencil')+'Apply the change</button></div><div class="ld-say" id="v24c" aria-live="polite"></div>'+
   '<div class="sc-cap">Requirements keep changing. Refactoring and TDD help inside a few files. <b>Evolvability</b> is that ease of change across a whole data system, like moving Twitter from approach 1 to 2.</div>');
  const draw=t=>{const d=D[view];L.$('#v24s').innerHTML=mudSvg(Object.assign({},d[1],{touch:t?d[1].touch:[]}));[0,1].forEach(k=>L.$('#v24-b'+k).classList.toggle('sel',k===view));};
  [0,1].forEach(k=>{L.$('#v24-b'+k).onclick=()=>{view=k;draw(false);L.$('#v24c').innerHTML='<b>'+D[k][0]+'.</b> Tap “Apply the change”.';};});
  L.$('#v24-go').onclick=()=>{draw(true);seen.add(view);L.$('#v24c').innerHTML='<b>'+D[view][0]+': '+(view?'1 place':'5 modules')+' to change.</b> '+D[view][2];
    if(seen.size===2&&!L.$('#v24ok')){L.$('#v24c').insertAdjacentHTML('beforeend','<span id="v24ok"></span>');
      L.sheet('info','Simple systems are easier to change','Evolvability is closely linked to simplicity and good abstractions: a system that is easy to understand is usually easier to modify.');L.done();}};
  draw(false);L.$('#v24c').innerHTML='<b>Before cleanup.</b> Tap “Apply the change”.';}},
{part:3,src:'Chapter 1 · Maintainability',pts:6,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which principle does it serve?',['Operability','Simplicity','Evolvability'],[
   ['Kwame can reboot any one web server for a security patch without merchants noticing.',0,'Not depending on any single machine makes operations easier.'],
   ['Tobias removes a two-year-old performance hack that special-cases Bramble & Bolt in five places.',1,'Hacks and special cases are accidental complexity.'],
   ['Adding Nordhaven’s different address format takes one small change, not a rewrite.',2,'Adapting to a new, unforeseen need is evolvability.'],
   ['The admin tool tells operators exactly what will happen before they pause a hub.',0,'A predictable “if I do X, Y happens” model is part of operability.'],
   ['Zainab hides the messy courier-shift rules behind one clean function every screen reuses.',1,'A good abstraction hides detail and removes duplicated complexity.'],
   ['Linh plans how to move the tracking page from look-up-on-view to push-on-write without downtime.',2,'Refactoring a whole data system’s design is evolvability.']]);}},
{part:3,src:'Chapter 1 · Summary',pts:1,run(L){
  L.h(L.kick('pr','Put it together')+'<h1 class="q">The book separates what a system does (<b>functional</b> requirements) from general qualities like reliability and scalability (<b>nonfunctional</b>). Tap the pieces until the sentence is right.</h1>');
  L.sentence(L.card,[['Letting merchants book a parcel','Keeping p99 under 1 s in Peak Week'],['is a functional requirement','is a nonfunctional requirement'],['about scalability:','about maintainability:'],['add capacity as load grows.','make the code easy to change.']],[1,1,0,0],
   [['Booking a parcel is something the system does, so it’s functional. Pick the requirement about speed under load.'],['A response-time target under heavy load isn’t a feature; it’s a quality the system must keep.'],['This is about coping with load, not about people working on the code.'],['Easy-to-change code is maintainability. Coping with Peak Week load means adding capacity.']],
   'A scalable system keeps performance good as load grows, by letting you add processing capacity.');}}
  ]
});
</script>
