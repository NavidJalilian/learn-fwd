/* =====================================================================
   Lesson 0032 only. Two signature models, reused through the lesson:
   1. The formula grid: Otterpost as one spreadsheet. Column A holds
      source cells (parcels, scans, merchants, rates), column B holds
      formula cells (support search, tracking view, merchant stats,
      Nordhaven bills) with "derived from" arrows. Editing a source
      ripples along the arrows into the formulas that use that field.
      Screens put faults on it: search down in a flash sale, a formula
      redefined, events applied twice / out of order / lost, and the
      exchange rate asked on demand vs subscribed to.
   2. The journey line: the path from a write to a read, with a
      draggable meeting point (the derived dataset). Left of it is the
      write path (eager), right of it the read path (lazy). Reused for
      support search, a three-query challenge, and extended onto
      Mrs. Okoro's phone.
   ===================================================================== */

const COL32={A:{x:14,w:142},B:{x:190,w:146}};
const CELL32={
 A1:{t:'Parcels',f:'Source (system of record): each parcel’s recipient, address and price.'},
 A2:{t:'Scans',f:'Source: scan events from couriers’ phones, in log order.'},
 A3:{t:'Merchants',f:'Source: merchant accounts and their names.'},
 A4:{t:'Rates',f:'Source: exchange-rate updates for Nordhaven’s currency.'},
 B1:{t:'Support search',f:'= INDEX(A1 by name, phone, postcode)'},
 B2:{t:'Tracking view',f:'= LATEST(A2 scan) + A1 address'},
 B3:{t:'Merchant stats',f:'= COUNT(A2 delivered) per A3 merchant'},
 B4:{t:'Nordhaven bills',f:'= A1 price × A4 rate'}};
const DEP32=[['A1','B1'],['A1','B2'],['A1','B4'],['A2','B2'],['A2','B3'],['A3','B3'],['A4','B4']];
const V32={A1:['OP-48213 · Okoro','12 Quay St · $6.00'],A2:['OP-48213','at Eastvale hub'],A3:['M-17','Bramble & Bolt'],A4:['Nordhaven rate','$1 = 9.80 local'],
 B1:['search “Okoro”','→ 12 Quay St'],B2:['at Eastvale hub','to 12 Quay St'],B3:['Bramble & Bolt','1,204 delivered'],B4:['$6.00 parcel','= 58.80 local']};
const BK32={ok:['ok-bg','ok'],no:['no-bg','no'],pri:['pri-bg','pri-deep'],mut:['soft2','muted'],warn:['h4-bg','h4']};

function Grid(host,o){
  o=o||{};
  const cells=o.cells||Object.keys(CELL32);
  const rows=[...new Set(cells.map(c=>+c[1]))].sort((a,b)=>a-b);
  const PITCH=72,TOP=34,CH=56,H=TOP+rows.length*PITCH-6;
  const g={v:JSON.parse(JSON.stringify(V32)),f:{},t:{},badge:{},cls:{},hl:new Set(),dash:new Set(),mark:new Set(),prog:{},sel:o.sel||null,lock:false};
  host.innerHTML=(o.bar===false?'':'<div class="fx32"><i>fx</i><span></span></div>')+
   '<div class="g32"><svg viewBox="0 0 340 '+H+'" role="img" aria-label="Spreadsheet of Otterpost data: source cells in column A, formula cells in column B; arrows show which sources each formula is derived from"></svg></div>'+
   (o.read===false?'':'<div class="rd32" aria-live="polite"></div>');
  const svg=host.querySelector('svg'),fx=host.querySelector('.fx32 span'),rd=host.querySelector('.rd32');
  const P=id=>{const c=COL32[id[0]];return {x:c.x,y:TOP+rows.indexOf(+id[1])*PITCH,w:c.w};};
  const deps=()=>DEP32.filter(d=>cells.includes(d[0])&&cells.includes(d[1]));
  const ends=d=>{const D=deps(),out=D.filter(e=>e[0]===d[0]),inn=D.filter(e=>e[1]===d[1]),a=P(d[0]),b=P(d[1]);
    return [a.x+a.w,a.y+CH/2+(out.indexOf(d)-(out.length-1)/2)*14,b.x,b.y+CH/2+(inn.indexOf(d)-(inn.length-1)/2)*14];};
  g.draw=()=>{let s='';
    s+=tc(COL32.A.x+COL32.A.w/2,14,'A · sources','p32m')+tc(COL32.B.x+COL32.B.w/2,14,'B · formulas','p32m');
    rows.forEach((r,i)=>{s+=tc(6,TOP+i*PITCH+CH/2+4,r,'p32m');
      ['A','B'].forEach(c=>{if(!cells.includes(c+r)){const p=P(c+r);s+='<rect x="'+p.x+'" y="'+p.y+'" width="'+p.w+'" height="'+CH+'" rx="9" style="fill:none;stroke:var(--line);stroke-dasharray:3 4"/>';}});});
    deps().forEach(d=>{const [x1,y1,x2,y2]=ends(d),k=d[0]+d[1],h=g.hl.has(k),col=h?'var(--pri)':'var(--line2)';
      s+='<path data-a="'+k+'" d="M'+x1+' '+y1+' C'+(x1+18)+' '+y1+' '+(x2-22)+' '+y2+' '+(x2-8)+' '+y2+'" style="fill:none;stroke:'+col+';stroke-width:'+(h?2.6:1.8)+(g.dash.has(k)?';stroke-dasharray:5 4':'')+'"/>'+
        '<circle cx="'+x1+'" cy="'+y1+'" r="3.2" style="fill:'+col+'"/><path d="M'+x2+' '+y2+' L'+(x2-9)+' '+(y2-5)+' L'+(x2-9)+' '+(y2+5)+'Z" style="fill:'+col+'"/>';});
    cells.forEach(id=>{const p=P(id),k=g.cls[id]||'',sel=g.sel===id,mk=g.mark.has(id);
      const fill=k==='ok'?'ok-bg':k==='no'?'no-bg':k==='flash'?'pri-bg':k==='warn'?'h4-bg':(id[0]==='A'?'soft':'card');
      const st=mk||sel||k==='flash'?'pri':k==='ok'?'ok-line':k==='no'?'no-line':k==='warn'?'h4':'line2';
      s+='<g class="c32" data-c="'+id+'" tabindex="0" role="button" aria-label="Cell '+id+', '+(g.t[id]||CELL32[id].t)+': '+g.v[id].join(', ')+(mk?', marked':'')+'"'+(k==='dim'?' style="opacity:.4"':'')+'>'+
        '<rect class="cb" x="'+p.x+'" y="'+p.y+'" width="'+p.w+'" height="'+CH+'" rx="9" style="fill:var(--'+fill+');stroke:var(--'+st+');stroke-width:'+(mk||sel?3:1.6)+'"/>'+
        '<text x="'+(p.x+8)+'" y="'+(p.y+18)+'" class="p32t" style="font-size:12.5px"><tspan style="fill:var(--muted);font-weight:700">'+id+'</tspan> '+(g.t[id]||CELL32[id].t)+'</text>'+
        t32(p.x+8,p.y+34,g.v[id][0],'p32v')+t32(p.x+8,p.y+49,g.v[id][1],'p32v')+
        (g.prog[id]!=null?'<rect x="'+(p.x+8)+'" y="'+(p.y+CH-5)+'" width="'+((p.w-16)*g.prog[id]).toFixed(1)+'" height="3" rx="1.5" style="fill:var(--pri)"/>':'')+'</g>';});
    cells.forEach(id=>{const b=g.badge[id];if(!b)return;const p=P(id),w=b[0].length*7.1+14,c=BK32[b[1]||'ok'];
      s+='<rect x="'+(p.x+p.w-w-4)+'" y="'+(p.y-14)+'" width="'+w+'" height="19" rx="9.5" style="fill:var(--'+c[0]+');stroke:var(--'+c[1]+');stroke-width:1.2"/>'+
        tc(p.x+p.w-4-w/2,p.y,b[0],'','font:700 12.5px var(--sans);fill:var(--'+c[1]+')');});
    svg.innerHTML=s;
    if(fx){const id=o.fxFixed||g.sel;fx.innerHTML=id?'<span><b>'+id+' '+(g.t[id]||CELL32[id].t)+'</b> '+(g.f[id]||CELL32[id].f)+'</span>':'<span style="color:var(--muted)">Tap a cell to see its formula.</span>';}};
  g.say=h=>{if(rd)rd.innerHTML=h;};
  g.pulse=(pairs,ms,rev)=>new Promise(res=>{ms=ms||420;pairs.forEach(k=>g.hl.add(k));g.draw();
    const ps=pairs.map(k=>svg.querySelector('[data-a="'+k+'"]')).filter(Boolean);
    const dots=ps.map(()=>{const c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('r','5.5');c.setAttribute('style','fill:var(--pri);stroke:var(--card);stroke-width:2');svg.appendChild(c);return c;});
    const t0=Date.now();
    const step=()=>{if(!svg.isConnected){res();return;}const u=Math.min(1,(Date.now()-t0)/ms);
      ps.forEach((p,j)=>{const len=p.getTotalLength(),pt=p.getPointAtLength(len*(rev?1-u:u));dots[j].setAttribute('cx',pt.x);dots[j].setAttribute('cy',pt.y);});
      if(u<1)setTimeout(step,30);else{dots.forEach(d=>d.remove());pairs.forEach(k=>g.hl.delete(k));g.draw();res();}};
    step();});
  /* a source edit ripples into the formulas that use the changed field */
  g.ripple=async(src,nv,targets)=>{g.badge={};g.cls={};g.v[src]=nv;g.cls[src]='flash';g.draw();await zz(150);
    if(targets.length)await g.pulse(targets.map(t=>src+t[0]));
    for(const t of targets){if(t[1])g.v[t[0]]=t[1];g.cls[t[0]]=t[3]==='mut'?'':(t[3]||'ok');g.badge[t[0]]=[t[2],t[3]||'ok'];g.draw();await zz(130);}
    g.cls[src]='';g.draw();};
  const tap=e=>{const c=e.target.closest('.c32');if(!c||g.lock)return;const id=c.dataset.c;
    if(o.pick){g.mark.has(id)?g.mark.delete(id):g.mark.add(id);}else g.sel=id;g.draw();
    const n=svg.querySelector('[data-c="'+id+'"]');if(n&&e.type==='keydown')n.focus();if(o.onTap)o.onTap(id,g);};
  svg.addEventListener('click',tap);
  svg.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tap(e);}});
  g.draw();
  return g;
}
const tapCell=(L,id)=>{const c=L.$('[data-c="'+id+'"]');if(c)c.dispatchEvent(new MouseEvent('click',{bubbles:true}));};

/* ---------------- Signature 2: the journey line ---------------- */
/* stations: [[line1,line2]...]; k = the station where the write path meets the read path */
function journey(stations,k,start,end,note){
  const n=stations.length,X=i=>22+(i+1)*(296/(n+1)),xk=X(k),Y=58;
  let s='<svg viewBox="0 0 340 126" role="img" aria-label="Journey from '+start.join(' ')+' to '+end.join(' ')+'. Stations up to '+stations[k].join(' ')+' are built on the write path; the rest happens on the read path.">';
  s+=t32(6,16,'write path · eager','p32t','','fill:var(--h2)')+t32(334,16,'read path · lazy','p32t','end','fill:var(--h3)');
  s+='<path d="M22 '+Y+' H'+xk+'" style="stroke:var(--h2);stroke-width:6;stroke-linecap:round"/><path d="M'+xk+' '+Y+' H318" style="stroke:var(--h3);stroke-width:6;stroke-linecap:round"/>';
  s+='<circle cx="22" cy="'+Y+'" r="11" style="fill:var(--h2-bg);stroke:var(--h2);stroke-width:2"/><circle cx="318" cy="'+Y+'" r="11" style="fill:var(--h3-bg);stroke:var(--h3);stroke-width:2"/>';
  s+=tc(22,92,start[0],'p32m')+tc(22,106,start[1]||'','p32m')+tc(318,92,end[0],'p32m')+tc(318,106,end[1]||'','p32m');
  stations.forEach((st,i)=>{const x=X(i),built=i<=k;
    if(i===k)s+='<rect x="'+(x-11)+'" y="'+(Y-11)+'" width="22" height="22" rx="3" transform="rotate(45 '+x+' '+Y+')" style="fill:var(--pri);stroke:var(--card);stroke-width:2"/>';
    else s+='<circle cx="'+x+'" cy="'+Y+'" r="8" style="fill:var(--'+(built?'h2':'card')+');stroke:var(--'+(built?'h2':'line2')+');stroke-width:2'+(built?'':';stroke-dasharray:3 2')+'"/>';
    const st2=i===k?'fill:var(--pri-deep);font-weight:700':built?'':'opacity:.55';
    s+=tc(x,92,st[0],'p32m',st2)+tc(x,106,st[1]||'','p32m',st2);});
  s+=tc(xk,36,note||'paths meet','p32m','fill:var(--pri-deep);font-weight:700');
  return s+'</svg>';
}

Course.lesson({
  id:'0032', title:'Unbundling databases', minutes:20, icon:'layers',
  goals:['See Otterpost’s pipelines as one big database turned inside out','Choose between federating reads, unbundling writes or one integrated database','Decide how much work to do at write time versus read time, all the way to a phone'],
  parts:['Inside a database','Unbundling writes','Dataflow apps','Write and read paths'],
  read:'Read “Unbundling Databases” in chapter 12 for the spreadsheet comparison, the exchange-rate example and the write path and read path in full.',
  glossary:{
    idempotence:'Idempotence: an operation that has the same effect whether it runs once or several times, so a retry can’t do it twice.',
    cdc:'Change data capture: reading a database’s log of row changes so another system (a warehouse, a search index, a cache) can copy them.',
    'unbundling':'Unbundling the database: taking features a database has built in (indexes, materialized views, replication) and providing them instead with separate tools joined by event logs.',
    'federated':'Federated database (polystore): one query interface over several different storage systems, so you can read from all of them in one place. It does not keep their writes in sync.',
    'materialized-view':'Materialized view: a stored copy of a query’s results, written to disk and updated when the data changes, so the query isn’t recomputed each time.',
    'write-path':'Write path: the work done eagerly as soon as data comes in, such as updating indexes and views, whether or not anyone has asked for it yet.',
    'read-path':'Read path: the work done only when someone asks, such as looking up an index and building the response.'
  },
  cheatsheet:[
    'A database’s index is <b>derived data</b>. CREATE INDEX = snapshot, catch up, then follow every write, like a new follower or CDC.',
    'Across an organization, pipelines act like one big database: stream jobs are its <b>triggers and view maintenance</b>, derived systems its <b>index types</b>.',
    '<b>Federated</b> databases unify reads. <b>Unbundled</b> databases unify writes, through an ordered event log and idempotent consumers, not distributed transactions.',
    'Logs give <b>loose coupling</b>: a slow consumer can’t stall the rest, and teams can work independently. But if one product does everything you need, use it.',
    'Think of application code as a <b>derivation function</b>, like a spreadsheet formula. Derived data needs a stable order and no lost messages.',
    'Subscribe to changes instead of querying another service: <b>local, faster and more robust</b>. Joins with changing data still depend on time.',
    'Indexes, caches and materialized views shift the boundary between the <b>write path</b> (eager) and the <b>read path</b> (lazy).',
    'Push state changes all the way to the client; it resumes from its offset after being offline. Reads can be events too, recording what a user saw.'
  ],
  steps:[

  L.buckets(L.$('#bk'),['Index','Materialized view','Trigger'],[
   ['Support search, fed by CDC, for finding parcels by phone or postcode',0,'It exists to look records up by a field’s value: an index outside the database.'],
   ['A table of on-time counts per merchant, kept current by a stream job',1,'A precomputed query result kept up to date: a materialized view.'],
   ['A consumer that sends a merchant’s status webhook whenever a parcel changes',2,'Code that runs in reaction to a change, like a trigger firing.'],
   ['A key-value store of parcels by tracking-code prefix, fed from the log',0,'Another lookup structure keyed by a field: an index type.'],
   ['The tracking cache holding each parcel’s ready-to-show page',1,'A precomputed result shaped for display: a cache, which is a kind of materialized view.']],
   'Otterpost has rebuilt, outside the Parcel DB, the features a database has inside it.');}},

/* ================= PART 2: UNBUNDLING WRITES ================= */
{part:1,src:'Chapter 12 · Composing Data Storage Technologies',run(L){
  L.h(L.kick('learn','Two ways to compose')+'<h1 class="q">Unify the reads, or unify the writes</h1>'+PIC_FED+
   '<p class="capt32">A '+L.g('federated','federated database')+' (polystore), like PostgreSQL’s foreign data wrappers, puts one query interface over many stores: the relational tradition. '+L.g('unbundling','Unbundling')+' syncs writes through change data capture and event logs: the Unix tradition of small tools.</p>'+
   '<p class="capt32 sm">Two sides of one coin. Kleppmann focuses on writes, the harder problem.</p>');
  L.done();}},

{part:1,src:'Chapter 12 · Composing Data Storage Technologies',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Signe wants one query that combines support search with warehouse reports, only to read. Which approach fits?</h1>');
  L.mc(L.card,['A federated query interface over both','An unbundled pipeline that syncs writes','Merge both systems into one database'],0,
   'Read-only querying across several systems is exactly what federation offers. Each system keeps working directly as before.',
   'Signe only needs to read across two systems. Federation gives one query interface over both. Unbundling is about writes, and merging them loses what each is good at.');}},

{part:1,src:'Chapter 12 · Making unbundling work',run(L){
  L.h(L.kick('learn','Making unbundling work')+'<h1 class="q">An event log beats a transaction across different systems</h1>'+PIC_LOG+
   '<p class="capt32">Different technologies share no standard transaction protocol. An ordered log with '+L.g('idempotence','idempotent')+' consumers is simpler, so it works everywhere. The win is loose coupling: a fault stays in one consumer, and each team works behind a clear interface.</p>');
  L.done();}},

{part:1,src:'Chapter 12 · Making unbundling work',pts:1,
 solve:async L=>{L.$('#p10').children[1].click();L.$('#go10').click();await L.sleep(2700);},
 run(L){
  const PR=['Bookings stop until search is back','Bookings go on; search catches up later','Bookings go on; search misses them for good'];let p=null;
  const TL=m=>{const X=i=>8+i*10.8;let s=svgo(104,'Thirty minutes of bookings. Search is down from minute 5 to 25. With the event log every minute’s bookings succeed; with a distributed transaction the bookings in those 20 minutes fail.')+
     '<rect x="'+X(5)+'" y="20" width="'+(10.8*20)+'" height="70" rx="4" style="fill:var(--no-bg)"/>'+tc(X(15),14,'search down','p32m','fill:var(--no)');
    [['Event log',34,0],['Distributed transaction',70,1]].forEach(l=>{s+=t32(8,l[1],l[0],'p32t');
      for(let i=0;i<30;i++){const bad=l[2]&&i>=5&&i<25,on=i<m;s+='<rect x="'+(X(i)+.5)+'" y="'+(l[1]+5)+'" width="9.8" height="13" rx="2" style="fill:var(--'+(on?(bad?'no':'ok'):'soft2')+')"/>';}});
    return s+t32(8,102,'0','p32m')+t32(332,102,'30 min','p32m','end')+'</svg>';};
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">Bramble & Bolt’s flash sale. Support search goes down for 20 minutes. With the event log, what happens?</h1><div id="g10"></div><div id="t10">'+TL(0)+'</div><div class="row32" id="p10"></div><button class="btn pri" id="go10" hidden>'+L.ic('play')+'Play 30 minutes</button>');
  const g=Grid(L.$('#g10'),{cells:['A1','B1','B2'],bar:false});
  g.badge.B1=['down min 5–25','no'];g.draw();
  g.say('About 300 bookings a minute land in A1 (illustrative). Search and the tracking view follow the log.');
  PR.forEach((t,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=t;
    b.onclick=()=>{if(p!==null)return;p=j;b.classList.add('sel');L.$('#go10').hidden=false;};L.$('#p10').appendChild(b);});
  L.$('#go10').onclick=function(){this.remove();let m=0;
    const tick=()=>{if(!L.$('#g10'))return;m++;const i=m-1,acc=m*300,failed=Math.max(0,Math.min(m,25)-5)*300;
      let b1;if(i<5)b1=['in step','ok'];else if(i<25)b1=['behind '+fmt((i-4)*300),'no'];else{const left=Math.max(0,6000-(i-24)*1500);b1=left?['catching up '+fmt(left),'warn']:['caught up','ok'];}
      g.badge={A1:['+300/min','pri'],B1:b1,B2:['in step','ok']};g.cls={B1:b1[1]==='ok'?'ok':b1[1]};g.draw();
      L.$('#t10').innerHTML=TL(m);
      g.say('Minute '+m+'. <b>Event log:</b> '+fmt(acc)+' bookings taken; search '+(b1[0])+'. <b>Distributed transaction:</b> '+fmt(failed)+' bookings failed.');
      if(m<30){setTimeout(tick,75);return;}
      const ok=p===1;L.award(ok);
      L.sheet(ok?'ok':'no',ok?'You called it':'Bookings never stopped','With the log, all 9,000 bookings went through. Search fell 6,000 events behind, then read on from its offset and caught up, missing nothing. With a distributed transaction, search couldn’t vote yes, so 6,000 bookings failed. That’s loose coupling at the system level.');L.done();};
    tick();};}},

{part:1,src:'Chapter 12 · Unbundled versus integrated systems',run(L){
  L.h(L.kick('learn','Unbundled versus integrated systems')+'<h1 class="q">Unbundling is for breadth, not for beating a database</h1>'+PIC_BREADTH+
   '<p class="capt32">Databases stay as needed as ever: stream jobs keep state in them and serve results from them. Each extra system adds a learning curve and quirks, and building for scale you don’t need is premature optimization. If one product does everything you need, use it.</p>');
  L.done();}},

{part:1,src:'Chapter 12 · What’s missing?',run(L){
  L.h(L.kick('learn','What’s missing?')+'<h1 class="q">A shell for unbundled databases doesn’t exist yet</h1>'+PIC_SHELL+
   '<p class="capt32">Kleppmann wants a high-level way to compose storage systems, like the Unix shell. His example pipes MySQL into Elasticsearch: copy everything, then apply every change, with no custom code. That would be CREATE INDEX across systems.</p>'+
   '<p class="capt32 sm">He’d also like to declare caches as materialized views. Research such as differential dataflow points that way.</p>');
  L.done();}},

{part:1,src:'Chapter 12 · Unbundled versus integrated systems',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'One product, or compose tools?',['Use one integrated database','Compose specialized tools'],[
   ['A small tool for 50 hub staff to sign up for extra shifts. It only needs to store and look up rows.',0,'One database does everything needed. Extra moving parts would only add learning curves and quirks.'],
   ['Parcel data must serve bookings, fuzzy search by partial phone number, on-time analytics and ETA training.',1,'No single product does all of this well. That’s when composing tools pays off.'],
   ['Tobias wants the merchant dashboard prototype on an event log, a search cluster and a cache, “for when we’re huge”.',0,'Building for scale you don’t need is premature optimization. Start with one database.'],
   ['Signe’s team needs typo-tolerant name search that the Parcel DB’s built-in text search can’t do.',1,'Specialist search is a real requirement the database can’t meet. Feed a search index from the Parcel DB through CDC.']]);}},

/* ================= PART 3: DATAFLOW APPS ================= */
{part:2,src:'Chapter 12 · Designing Applications Around Dataflow',run(L){
  L.h(L.kick('learn','Designing applications around dataflow')+'<h1 class="q">What spreadsheets got right</h1>'+PIC_SHEET+
   '<p class="capt32">Change a cell and every formula that uses it recalculates. Kleppmann wants that from data systems, and calls the idea the “database inside-out”: a design pattern, not a new architecture. Unlike a spreadsheet, it must be fault-tolerant, scalable and durable.</p>'+
   '<p class="capt32 sm">It borrows from dataflow languages, functional reactive programming and logic programming. The term “unbundling” comes from Jay Kreps.</p>');
  L.done();}},

{part:2,src:'Chapter 12 · Application code as a derivation function',run(L){
  L.h(L.kick('learn','Application code as a derivation function')+'<h1 class="q">Every derived dataset comes from some function</h1>'+PIC_FUNC+
   '<p class="capt32">A secondary index is so standard that you just say CREATE INDEX. Full-text search needs tuning; ML models and caches need custom code. That’s where many databases struggle: triggers and stored procedures were an afterthought.</p>');
  L.done();}},

{part:2,src:'Chapter 12 · Application code as a derivation function',pts:1,
 solve:async L=>{tapCell(L,'B2');L.$('#go16').click();await L.sleep(1900);},
 run(L){
  let did=false;
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">Tobias changes the tracking page to show every scan, not just the latest. Tap every cell that must be rebuilt, then press Rebuild.</h1><div id="g16"></div>'+
   '<button class="btn pri" id="go16" disabled>'+L.ic('cycle')+'Rebuild</button>');
  const g=Grid(L.$('#g16'),{pick:true,fxFixed:'B2',onTap:()=>{L.$('#go16').disabled=!g.mark.size;g.say(g.mark.size?'Marked: <b>'+[...g.mark].sort().join(', ')+'</b>.':'Nothing marked yet.');}});
  g.f.B2='= ALL(A2 scans) + A1 address  <span class="vd32 ok">new</span>';g.draw();
  g.say('Nothing marked yet. Sources are in column A, formulas in column B.');
  L.$('#go16').onclick=async function(){if(did||!g.mark.size)return;did=true;this.disabled=true;g.lock=true;
    const picked=new Set(g.mark),ok=picked.size===1&&picked.has('B2');L.award(ok);
    Object.keys(CELL32).forEach(id=>{if(id!=='B2')g.cls[id]=picked.has(id)?'no':'dim';});
    Object.keys(CELL32).forEach(id=>{if(id!=='B2'&&picked.has(id))g.badge[id]=['unchanged','no'];});
    g.badge.B2=['reprocessing scans','pri'];
    for(let i=0;i<=10;i++){if(!L.$('#g16'))return;g.prog.B2=i/10;g.draw();await zz(110);}
    delete g.prog.B2;g.v.B2=['picked up → at hub','to 12 Quay St'];g.badge.B2=['rebuilt','ok'];g.cls.B2='ok';g.draw();
    g.say('B2 was rebuilt by running its new formula over every scan in the log. Nothing else changed.');
    L.sheet(ok?'ok':'no',ok?'Only B2':'Only B2 needed it','The sources are the system of record and didn’t change, and no other formula reads B2. Only the redefined view is rebuilt, by reprocessing history, like CREATE INDEX deriving a new view. A cache shaped for a screen changes whenever the screen does.');L.done();};}},

{part:2,src:'Chapter 12 · Separation of application code and state',run(L){
  L.h(L.kick('learn','Separation of application code and state')+'<h1 class="q">Keep code and state apart, then let state talk back</h1>'+PIC_STATE+
   '<p class="capt32">Tools like Kubernetes and Docker run code better than a database can, so apps keep stateless code apart from state. But a database is like a variable you can’t subscribe to: apps must poll. In dataflow, code reacts to one change by making another.</p>');
  L.done();}},

{part:2,src:'Chapter 12 · Dataflow: Interplay between state changes and application code',
 solve:async L=>{for(let j=0;j<3;j++){L.$('#e18p'+j).click();await L.sleep(1700);L.$('#fx18').click();await L.sleep(1700);}},
 run(L){
  const P=[
   {nm:'Applied twice',fix:'Make it idempotent',
    ev:f=>[{o:41,s:'out for delivery'},{o:42,s:'delivered'},{mk:'restart'},{o:42,s:'delivered',dup:true}],
    bad:'The stats job restarted and got offset 42 again. It counted the same delivery twice: <b>1,206</b> instead of 1,205.',
    good:'The job stores the last offset it applied together with the count, so it skips 42 the second time. Same result however often it runs.'},
   {nm:'Out of order',fix:'Keep the log’s order',
    ev:f=>f?[{o:41,s:'out for delivery'},{o:42,s:'delivered'}]:[{o:42,s:'delivered'},{o:41,s:'out for delivery',dup:true}],
    bad:'A broker redelivered offset 41 after 42. The tracking view now says <b>out for delivery</b> while stats say delivered: two views disagree.',
    good:'Consumers read the log in offset order, so every view applies 41 before 42 and they agree.'},
   {nm:'Lost in a crash',fix:'Resume from the offset',
    ev:f=>f?[{o:41,s:'out for delivery'},{mk:'crash · restart at 42'},{o:42,s:'delivered'}]:[{o:41,s:'out for delivery'},{o:42,s:'delivered',lost:true}],
    bad:'The job held offset 42 only in memory and crashed. The view is stuck at <b>out for delivery</b> and stats missed a delivery, for good.',
    good:'The log is durable and the job records its offset. After the crash it resumes at 42 and catches up.'}];
  const fixed=new Set();let cur=-1,busy=false,shown=false;
  L.h(L.kick('ex','Edge cases')+'<h1 class="q">Derived data is stricter than a job queue. Break each view, then fix it.</h1>'+
   '<div class="row32">'+P.map((p,j)=>'<button class="chip" id="e18p'+j+'">'+p.nm+'</button>').join('')+'</div>'+
   '<div class="tape32" id="tp18"><span class="lb">Delivered to the jobs:</span></div><div id="g18"></div><button class="btn pri" id="fx18" hidden></button>');
  const g=Grid(L.$('#g18'),{cells:['A2','B2','A3','B3'],bar:false});
  g.say('Parcel OP-48213 gets two scans: offset 41 “out for delivery”, then 42 “delivered”. Pick a fault.');
  const play=async(j,f)=>{busy=true;const p=P[j],tp=L.$('#tp18');tp.innerHTML='<span class="lb">Delivered to the jobs:</span>';
    g.badge={};g.cls={};g.v.B2=['at Eastvale hub','to 12 Quay St'];g.v.B3=['Bramble & Bolt','1,204 delivered'];g.v.A2=['OP-48213','at Eastvale hub'];g.draw();
    let status='at Eastvale hub',count=1204;const seen=new Set();
    for(const e of p.ev(f)){if(!L.$('#g18'))return;
      const sp=document.createElement('span');sp.className='e'+(e.mk?' mk':e.lost?' lost':e.dup?' dup':'');sp.textContent=e.mk||(e.o+' '+e.s+(e.lost?' (lost)':''));tp.appendChild(sp);
      if(e.mk){await zz(260);continue;}
      g.v.A2=['offset '+e.o,e.s];g.cls.A2='flash';g.draw();
      if(e.lost){await zz(380);g.cls.A2='';continue;}
      await g.pulse(['A2B2','A2B3'],300);g.cls.A2='';
      if(!(f&&j===0&&seen.has(e.o))){status=e.s;if(e.s==='delivered')count++;}
      seen.add(e.o);g.v.B2=[status,'to 12 Quay St'];g.v.B3=['Bramble & Bolt',fmt(count)+' delivered'];g.draw();await zz(120);}
    const okB2=status==='delivered',okB3=count===1205;
    g.cls={B2:okB2?'ok':'no',B3:okB3?'ok':'no'};
    g.badge={B2:okB2?['right','ok']:['wrong status','no'],B3:okB3?['right','ok']:[count>1205?'counted twice':'missed one','no']};g.draw();
    g.say((f?vd(true,'Fixed')+p.good:vd(false,'Broken')+p.bad));busy=false;};
  P.forEach((p,j)=>{L.$('#e18p'+j).onclick=async()=>{if(busy)return;cur=j;P.forEach((_,q)=>L.$('#e18p'+q).classList.toggle('sel',q===j));
    const b=L.$('#fx18');b.hidden=true;await play(j,false);if(!L.$('#g18'))return;b.hidden=false;b.innerHTML=L.ic('shield')+p.fix;};});
  L.$('#fx18').onclick=async function(){if(busy||cur<0)return;this.hidden=true;const j=cur;await play(j,true);if(!L.$('#g18'))return;
    fixed.add(j);L.$('#e18p'+j).classList.add('ok');
    if(fixed.size===3&&!shown){shown=true;L.sheet('info','Order, and nothing lost','Several views fed from one log must apply events in the same order, and losing one message leaves a view wrong for good. A durable, ordered log with idempotent consumers gives both, far more cheaply than distributed transactions. Dual writes are ruled out too.');L.done();}};}},

{part:2,src:'Chapter 12 · Stream processors and services',
 solve:async L=>{L.$('#a19d').click();await L.sleep(60);L.$('#a19b').click();await L.sleep(1700);L.$('#m19s').click();await L.sleep(60);L.$('#a19b').click();await L.sleep(1300);},
 run(L){
  let mode='ask',down=false,busy=false,shown=false,rate=9.8;const tried=new Set();
  L.h(L.kick('ex','Edge cases')+'<h1 class="q">Nordhaven merchants pay in their own currency. Price a booking by asking the rate service, or by subscribing to rate changes.</h1>'+
   '<div class="row32"><button class="chip sel" id="m19a">Ask each time</button><button class="chip" id="m19s">Subscribe</button></div><div id="g19"></div>'+
   '<div class="row32"><button class="chip" id="a19b">Book a parcel</button><button class="chip" id="a19d">Service down</button><button class="chip" id="a19c">Rate changes</button><button class="chip" id="a19r">Reprocess March</button></div>');
  const g=Grid(L.$('#g19'),{cells:['A1','A4','B4'],fxFixed:'B4'});
  const setMode=m=>{mode=m;L.$('#m19a').classList.toggle('sel',m==='ask');L.$('#m19s').classList.toggle('sel',m==='sub');
    g.dash=m==='ask'?new Set(['A4B4']):new Set();g.t.A4=m==='ask'?'Rate service':'Rate updates';
    g.f.B4=m==='ask'?'= A1 price × ASK(rate service): one network call per booking':'= A1 price × local copy of A4, kept fresh by a stream of rate updates';
    g.badge={B4:m==='ask'?['asks each time','mut']:['local copy','pri']};if(down)g.badge.A4=['down','no'];g.cls=down?{A4:'no'}:{};g.draw();
    g.say(m==='ask'?'Microservice style: the booking code calls the rate service for each booking.':'Dataflow style: the booking code subscribed in advance and keeps the latest rate in a local database.');};
  setMode('ask');
  const act=async fn=>{if(busy)return;busy=true;await fn();busy=false;};
  L.$('#m19a').onclick=()=>act(async()=>setMode('ask'));
  L.$('#m19s').onclick=()=>act(async()=>setMode('sub'));
  L.$('#a19d').onclick=()=>act(async()=>{down=!down;L.$('#a19d').classList.toggle('sel',down);setMode(mode);
    g.say(down?'The rate service is down. Now book a parcel.':'The rate service is back.');});
  L.$('#a19c').onclick=()=>act(async()=>{if(down){g.say('The rate service is down, so no rate updates arrive right now.');return;}
    rate=rate===9.8?10.1:9.8;g.v.A4=['Nordhaven rate','$1 = '+rate.toFixed(2)+' local'];g.cls={A4:'flash'};g.draw();
    if(mode==='sub'){await g.pulse(['A4B4']);g.badge={B4:['copy updated','ok']};g.cls={};g.draw();
      g.say('The new rate streamed into the local copy before any booking needed it.');}
    else{g.cls={};g.draw();g.say('The service has the new rate. Nothing else happens until a booking asks for it.');}});
  L.$('#a19b').onclick=()=>act(async()=>{g.badge={};g.cls=down?{A4:'no'}:{};if(down)g.badge.A4=['down','no'];g.draw();
    await g.pulse(['A1B4'],350);
    const price='= '+(6*rate).toFixed(2)+' local';
    if(mode==='ask'){await g.pulse(['A4B4'],350,true);
      if(down){g.cls.B4='no';g.badge.B4=['can’t price','no'];g.v.B4=['$6.00 parcel','waiting…'];g.draw();
        g.say(vd(false,'Booking stuck')+'The call to the rate service times out, so the booking waits, then fails. One service’s outage spreads to bookings.');tried.add('ask');}
      else{await g.pulse(['A4B4'],350);g.cls.B4='ok';g.badge.B4=['1 call · ~40 ms','ok'];g.v.B4=['$6.00 parcel',price];g.draw();
        g.say('One network call per booking (about 40 ms, illustrative). Priced at '+(6*rate).toFixed(2)+' local.');}}
    else{g.cls.B4='ok';g.badge.B4=['local · ~1 ms','ok'];g.v.B4=['$6.00 parcel',price];g.draw();
      g.say(down?vd(true,'Booking priced')+'The rate service is down, but the local copy still has the latest rate. No network call at all.':'A local lookup, no network call (about 1 ms, illustrative). Priced at '+(6*rate).toFixed(2)+' local.');
      if(down)tried.add('sub');}
    if(tried.size===2&&!shown){shown=true;L.sheet('info','No network request at all',L.quote('The fastest and most reliable network request is no network request at all!','Martin Kleppmann, chapter 12')+'<p>Subscribing turns a call into a stream-table join between bookings and rate updates. Both styles let teams work apart; dataflow uses one-way streams instead of request and response.</p>');L.done();}});
  L.$('#a19r').onclick=()=>act(async()=>{g.badge={B4:['needs March rate','warn']};g.cls={B4:'warn'};g.draw();
    g.say('Linh reprocesses last March’s bookings. Today’s rate would give wrong bills: either way, asking or subscribing, the join needs each booking’s rate <b>as it was then</b>. The join depends on time.');});}},

/* ================= PART 4: WRITE AND READ PATHS ================= */
{part:3,src:'Chapter 12 · Observing Derived State',run(L){
  L.h(L.kick('learn','Observing derived state')+'<h1 class="q">Where the write path meets the read path</h1>'+PIC_PATHS+
   '<p class="capt32">The '+L.g('write-path','write path')+' is done eagerly as data arrives, whether anyone asked or not. The '+L.g('read-path','read path')+' runs only when someone asks. They meet at the derived dataset: a trade-off between work at write time and at read time.</p>'+
   '<p class="capt32 sm">Programmers will recognize eager and lazy evaluation.</p>');
  L.done();}},

{part:3,src:'Chapter 12 · Materialized views and caching',
 solve:async L=>{const r=L.$('#r21');for(const v of [0,3]){r.value=v;r.dispatchEvent(new Event('input',{bubbles:true}));await L.sleep(60);}},
 run(L){
  const ST=[['raw','log'],['search','index'],['cached','searches'],['every','answer']];
  const B=[{n:'No index (scan)',w:6,r:100,s:8,wt:'tiny',rt:'huge',stt:'small',cap:'Writes just store the parcel. Every search scans everything, like grep. Fine for a handful of parcels, hopeless for millions.'},
   {n:'Search index',w:38,r:30,s:35,wt:'some',rt:'some',stt:'more',cap:'Writes update the entry for every word in the parcel. Reads look up each word and combine the results (AND, OR). Both paths do some work.'},
   {n:'Index + cached common searches',w:56,r:12,s:50,wt:'more',rt:'little',stt:'more',cap:'Popular searches are precomputed, so a new matching parcel must update them: really a '+L.g('materialized-view','materialized view')+'. Rare searches still use the index.'},
   {n:'Precompute every answer',w:100,r:3,s:100,wt:'∞',rt:'tiny',stt:'∞',cap:'Reads would just fetch the answer. But the possible searches are endless, so the write path would never finish.'}];
  const seen=new Set();let shown=false;
  L.h(L.kick('ex','Explore')+'<h1 class="q">Signe searches support search. Move the meeting point and watch the work shift between writing and reading.</h1>'+
   '<div class="j32" id="j21"></div><label class="rng32"><span>Meeting point</span><b id="v21"></b><input type="range" id="r21" min="0" max="3" step="1" value="1"></label>'+
   '<div class="mt32">'+[['Per write','w','h2'],['Per read','r','h3'],['Storage','s','h4']].map(m=>'<div class="meterrow"><div class="lb">'+m[0]+'</div><div class="meter"><div id="m21'+m[1]+'" style="background:var(--'+m[2]+')"></div></div><span class="mv" id="t21'+m[1]+'"></span></div>').join('')+'</div>'+
   '<div class="rd32" id="c21" aria-live="polite"></div>');
  const draw=k=>{const b=B[k];L.$('#j21').innerHTML=journey(ST,k,['parcel','booked'],['Signe','asks']);L.$('#v21').textContent=b.n;
    L.$('#m21w').style.width=b.w+'%';L.$('#m21r').style.width=b.r+'%';L.$('#m21s').style.width=b.s+'%';
    L.$('#t21w').textContent=b.wt;L.$('#t21r').textContent=b.rt;L.$('#t21s').textContent=b.stt;
    ['w','s'].forEach(x=>{L.$('#m21'+x).style.background=k===3?'var(--no)':'var(--'+(x==='w'?'h2':'h4')+')';});
    L.$('#c21').innerHTML=b.cap;seen.add(k);
    if(seen.has(0)&&seen.has(3)&&!shown){shown=true;L.sheet('info','Caches, indexes and views move one line','They all shift the boundary: more work at write time, by precomputing, to save work on the read path. A cached common search is a materialized view, kept right on the write path. Chapter 1’s Twitter timelines made the same choice, drawn differently for celebrities.');L.done();}};
  const r=L.$('#r21');r.setAttribute('aria-label','Where the write path meets the read path');r.addEventListener('input',()=>draw(+r.value));draw(1);}},

{part:3,src:'Chapter 12 · Materialized views and caching',pts:1,
 solve:async L=>{L.$('#q22s0_0').click();L.$('#q22s2_2').click();L.$('#ck22').click();},
 run(L){
  const Q=[{t:'Find a word in today’s 30 open complaints (searched twice a day)',c:[[0,60],[100,10],[150,4],null]},
   {t:'Find a parcel by phone number (300 searches a day, all different)',c:[[0,1200000],[800,1500],[1200,1480],null]},
   {t:'“Bramble & Bolt, booked today” (900 searches a day, always the same)',c:[[0,3600000],[800,4500],[860,900],null]}];
  const NM=['Scan','Index','Cache','All'],MAX=6000,TARGET=4200;const pick=[1,1,1];let checked=false;
  L.h(L.kick('pr','Challenge')+'<h1 class="q">Place the meeting point for each of Signe’s searches. Get total daily work to '+fmt(TARGET)+' or less.</h1>'+
   Q.map((q,i)=>'<div class="q32"><div class="qt">'+q.t+'</div><div class="trk32" role="group" aria-label="Meeting point for this search">'+NM.map((n,j)=>'<button id="q22s'+i+'_'+j+'" aria-pressed="false"><i></i>'+n+'</button>').join('')+'</div>'+
     '<div class="bar32"><span id="q22w'+i+'" style="background:var(--h2)"></span><span id="q22r'+i+'" style="background:var(--h3)"></span></div><div class="bl32"><span>write <b id="q22a'+i+'"></b> · read <b id="q22b'+i+'"></b></span><b id="q22t'+i+'"></b></div></div>').join('')+
   '<div class="tot32"><span>Total work a day</span><span id="tt22"></span></div><p class="capt32 sm">Work units are illustrative. “All” means every possible answer precomputed.</p>'+
   '<button class="btn pri" id="ck22">'+L.ic('check')+'Check</button>');
  const cost=i=>{const c=Q[i].c[pick[i]];return c?c[0]+c[1]:Infinity;};
  const draw=()=>{let tot=0;Q.forEach((q,i)=>{const c=q.c[pick[i]];
      NM.forEach((_,j)=>{const b=L.$('#q22s'+i+'_'+j);b.classList.toggle('sel',j===pick[i]);b.setAttribute('aria-pressed',j===pick[i]);});
      if(!c){L.$('#q22w'+i).style.width='100%';L.$('#q22w'+i).style.background='var(--no)';L.$('#q22r'+i).style.width='0';
        L.$('#q22a'+i).textContent='∞';L.$('#q22b'+i).textContent='tiny';L.$('#q22t'+i).textContent='never finishes';L.$('#q22t'+i).className='no';tot=Infinity;return;}
      const over=c[0]+c[1]>MAX;L.$('#q22w'+i).style.background='var(--h2)';
      L.$('#q22w'+i).style.width=Math.min(100,c[0]/MAX*100)+'%';L.$('#q22r'+i).style.width=Math.max(0,Math.min(100-c[0]/MAX*100,c[1]/MAX*100))+'%';
      L.$('#q22r'+i).style.background=over?'var(--no)':'var(--h3)';
      L.$('#q22a'+i).textContent=fmt(c[0]);L.$('#q22b'+i).textContent=fmt(c[1]);L.$('#q22t'+i).textContent=fmt(c[0]+c[1]);L.$('#q22t'+i).className=over?'no':'';tot+=c[0]+c[1];});
    const tt=L.$('#tt22');tt.textContent=tot===Infinity?'never finishes':fmt(tot)+' / '+fmt(TARGET);tt.className=tot<=TARGET?'ok':'no';return tot;};
  Q.forEach((q,i)=>NM.forEach((_,j)=>{L.$('#q22s'+i+'_'+j).onclick=()=>{if(checked)return;pick[i]=j;draw();};}));
  draw();
  L.$('#ck22').onclick=function(){if(checked)return;checked=true;this.disabled=true;const tot=draw(),ok=tot<=TARGET;L.award(ok);
    L.sheet(ok?'ok':'no',ok?'Each search in its place':'Not under '+fmt(TARGET)+' yet','<b>Complaints:</b> 30 items, rarely searched, so a plain scan is cheapest. <b>Phone number:</b> every search differs, so a cache rarely hits: the index wins. <b>Bramble & Bolt today:</b> one query asked 900 times, so cache its answer and update it on the write path. Precomputing everything never finishes. Best total: 4,120.');L.done();};}},

{part:3,src:'Chapter 12 · Stateful, offline-capable clients',run(L){
  L.h(L.kick('learn','Stateful, offline-capable clients')+'<h1 class="q">The phone’s screen is a cache too</h1>'+PIC_PHONE+
   '<p class="capt32">Single-page and mobile apps keep state on the device, and offline-first apps sync in the background. Then the device’s state is a cache of the server’s: the pixels are a materialized view of model objects, a local replica of the datacenter.</p>');
  L.done();}},

{part:3,src:'Chapter 12 · Pushing state changes to clients',
 solve:async L=>{L.$('#go24').click();await L.sleep(2700);L.$('#m24p').click();L.$('#go24').click();await L.sleep(2700);},
 run(L){
  const EV=[{s:'At Eastvale hub',txt:'Mrs. Okoro opens the tracking page. The first load uses the read path.',on:true},
   {s:'Out for delivery',txt:'Ravi scans the parcel: out for delivery.',on:true},
   {s:'Out for delivery',txt:'Mrs. Okoro steps into a lift. No signal.',on:false},
   {s:'Two stops away',txt:'Ravi’s app marks the parcel two stops away.',on:false},
   {s:'Two stops away',txt:'Out of the lift, back online.',on:true,re:true},
   {s:'Delivered',txt:'Ravi scans: delivered.',on:true}];
  let mode='once',busy=false,shown=false;const played=new Set();
  const ST=[['event','log'],['tracking','view'],['phone','state'],['pixels','']];
  const scene=(srv,ph,on,missed,label)=>svgo(150,'Server tracking view says '+srv+'. Mrs. Okoro’s phone shows '+ph+(on?'':', offline')+'.')+
    bx(4,30,118,84,'h2',false,12)+tc(63,52,'tracking view','p32m','fill:var(--h2)')+tc(63,78,srv,'p32t')+tc(63,98,'(server)','p32m')+
    '<path d="M124 72 H196" style="stroke:var(--'+(on?(mode==='push'?'pri':'line2'):'no')+');stroke-width:3'+(on&&mode==='push'?'':';stroke-dasharray:5 4')+'"/>'+
    tc(160,62,on?(mode==='push'?'pushes':'read once'):'no signal','p32m',on?'':'fill:var(--no)')+
    '<rect x="200" y="4" width="132" height="142" rx="18" style="fill:var(--card);stroke:var(--ink);stroke-width:2.5"/>'+
    '<rect x="212" y="20" width="108" height="112" rx="8" style="fill:var(--'+(missed?'no-bg':'soft')+')"/>'+
    tc(266,40,'OP-48213','p32m')+tc(266,66,ph.split(' ').slice(0,2).join(' '),'p32b')+tc(266,84,ph.split(' ').slice(2).join(' '),'p32b')+
    (missed?tc(266,112,missed+' change'+(missed>1?'s':'')+' missed','p32m','fill:var(--no);font-weight:700'):tc(266,112,label||'up to date','p32m','fill:var(--ok)'))+'</svg>';
  L.h(L.kick('ex','Extend the write path')+'<h1 class="q">Mrs. Okoro watches parcel OP-48213. Play the delivery with each kind of page.</h1>'+
   '<div class="row32"><button class="chip sel" id="m24o">Read once</button><button class="chip" id="m24p">Subscribe: server pushes</button></div>'+
   '<div class="j32" id="j24"></div><div id="s24"></div><div class="rd32" id="c24" aria-live="polite"></div><button class="btn pri" id="go24">'+L.ic('play')+'Play the delivery</button>');
  const draw0=()=>{L.$('#j24').innerHTML=journey(ST,mode==='push'?3:1,['Ravi’s','scan'],['Mrs.','Okoro'],mode==='push'?'paths meet on the phone':'paths meet');
    L.$('#s24').innerHTML=scene('At Eastvale hub','At Eastvale hub',true,0);
    L.$('#c24').innerHTML=mode==='push'?'The page loads once, then keeps a connection open (server-sent events or WebSockets) and the server pushes each change.':'The page reads the data once, like most web pages, and only a reload or polling would refresh it.';};
  const setMode=m=>{if(busy)return;mode=m;L.$('#m24o').classList.toggle('sel',m==='once');L.$('#m24p').classList.toggle('sel',m==='push');draw0();};
  L.$('#m24o').onclick=()=>setMode('once');L.$('#m24p').onclick=()=>setMode('push');draw0();
  L.$('#go24').onclick=async()=>{if(busy)return;busy=true;let ph=EV[0].s,missed=0;
    for(let i=0;i<EV.length;i++){if(!L.$('#s24'))return;const e=EV[i],changed=i>0&&e.s!==EV[i-1].s;
      if(mode==='once'){if(changed)missed++;}
      else if(e.on){ph=e.s;missed=0;}else if(changed)missed++;
      const note=mode==='push'&&e.re?' The phone resumes from its last offset and gets the missed update.':'';
      L.$('#s24').innerHTML=scene(e.s,ph,e.on,missed,mode==='push'&&e.re?'caught up':'');
      L.$('#c24').innerHTML='<b>'+(i+1)+'/6</b> '+e.txt+note;await zz(380);}
    if(!L.$('#s24'))return;
    L.$('#c24').innerHTML=mode==='push'?vd(true,'Live')+'Each scan reached the phone in under a second. After the lift it resumed from its offset and missed nothing: the write path reached her screen.':vd(false,'Stale')+'The phone still says “At Eastvale hub”: 3 changes missed. The page read once and became a stale cache.';
    played.add(mode);busy=false;
    if(played.size===2&&!shown){shown=true;L.sheet('info','Pushing the write path out to the phone','Pushing changes extends the write path to the end user: read once, then follow a stream of changes. After being offline, a device resumes from its offset, like a log consumer. UI tools like Elm and React with Redux already treat screen state as events; few databases let you subscribe yet. Kleppmann thinks the switch is worth it.');L.done();}};}},

{part:3,src:'Chapter 12 · Reads are events too',run(L){
  L.h(L.kick('learn','Reads are events too')+'<h1 class="q">Send the reads through the stream as well</h1>'+PIC_READS+
   '<p class="capt32">Kleppmann suggests treating reads as events: the stream processor answers each one by joining it with its state. A one-off read passes through; a subscription stays joined. Logging reads shows what a user saw before deciding, at extra storage cost.</p>'+
   '<p class="capt32 sm">Streams can also run queries across many partitions, like counting everyone who saw a URL. A database that already does such joins is probably simpler.</p>');
  L.done();}},

{part:3,src:'Chapter 12 · End-to-end event streams',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'What would Kleppmann reach for?',['Push changes to the client','Log the read as an event','Use a database’s own joins'],[
   ['Recipients complain the tracking page still says “At hub” an hour after the van left, unless they reload.',0,'The page read once and went stale. Push state changes so the write path reaches the phone.'],
   ['Bramble & Bolt disputes which delivery promise a shopper was shown before buying.',1,'Recording the read lets you reconstruct what the shopper saw before deciding, like the book’s shipping-date example.'],
   ['Kwame needs a fraud score per booking from several partitioned stores, and their MPP database already joins them well.',2,'Kleppmann says a database that offers multi-partition joins is probably simpler than building it on streams.'],
   ['A courier’s app loses signal in a tunnel and must not miss any route changes sent meanwhile.',0,'Pushed changes plus a stored offset: on reconnect, the device resumes where it left off.']]);}}
  ]
});
</script>
