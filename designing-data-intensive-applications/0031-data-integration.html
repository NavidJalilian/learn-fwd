/* =====================================================================
   Lesson 0031 only. Two hands-on models, reused across the lesson:
   1. Funnel – lanes of events (log partitions, datacenters, services,
      an offline phone) merge through a funnel into one consumer. Shows
      when one log fixes the order and when Ama’s two events can swap.
   2. Rail   – the third-rail migration: reprocess history into a new
      view, shift reads with a slider, roll back, remove the old rail.
   ===================================================================== */
let SPD=1; /* animation speed; solvers lower it */
const f1=n=>Math.round(n*10)/10;
const fmt=n=>Number(n).toLocaleString('en-US');
const T=(x,y,s,st)=>'<text x="'+f1(x)+'" y="'+f1(y)+'" style="'+st+'">'+s+'</text>';
const R=(x,y,w,h,rx,st)=>'<rect x="'+f1(x)+'" y="'+f1(y)+'" width="'+f1(w)+'" height="'+f1(h)+'" rx="'+rx+'" style="'+st+'"/>';
const Ln=(x1,y1,x2,y2,st)=>'<line x1="'+f1(x1)+'" y1="'+f1(y1)+'" x2="'+f1(x2)+'" y2="'+f1(y2)+'" style="'+st+'"/>';
const ST=(sz,col,anc,wt)=>'font-size:'+sz+'px;fill:'+col+';text-anchor:'+(anc||'middle')+(wt?';font-weight:'+wt:'');
const SV=(h,inner,label,id)=>'<svg'+(id?' id="'+id+'"':'')+' class="di-svg" viewBox="0 0 320 '+h+'" role="img" aria-label="'+label+'">'+inner+'</svg>';
const cap=h=>'<p class="di-cap">'+h+'</p>';
function arw(x1,y1,x2,y2,c,o){o=o||{};const a=Math.atan2(y2-y1,x2-x1),h=7,w=4.2,bx=x2-h*Math.cos(a),by=y2-h*Math.sin(a);
  return Ln(x1,y1,bx,by,'stroke:'+c+';stroke-width:'+(o.w||1.8)+(o.dash?';stroke-dasharray:'+o.dash:''))+
   '<polygon points="'+f1(x2)+','+f1(y2)+' '+f1(bx+w*Math.sin(a))+','+f1(by-w*Math.cos(a))+' '+f1(bx-w*Math.sin(a))+','+f1(by+w*Math.cos(a))+'" style="fill:'+c+'"/>';}
function bx(x,y,w,h,t1,t2,c,o){o=o||{};const plain=c==='soft'||c==='card';
  const fill=plain?'var(--'+c+')':'var(--'+c+'-bg)',st=plain?'var(--line2)':(c==='ok'?'var(--ok-line)':c==='no'?'var(--no-line)':'var(--'+c+')'),tc=plain?'var(--ink)':'var(--'+c+')';
  let s=R(x,y,w,h,o.rx||9,'fill:'+fill+';stroke:'+(o.stroke||st)+';stroke-width:'+(o.sw||1.6)+(o.dash?';stroke-dasharray:'+o.dash:''));
  const cx=x+w/2;
  if(t2)s+=T(cx,y+h/2-2,t1,ST(o.fs||12,tc,'middle',700))+T(cx,y+h/2+12,t2,ST(11,o.sub||'var(--muted)'));
  else s+=T(cx,y+h/2+4,t1,ST(o.fs||12,tc,'middle',700));
  return s;}
function db(cx,y,w,h,t1,t2,c,fs){const rx=w/2,ry=5,f='var(--'+c+'-bg)',st='var(--'+c+')';
  return '<path d="M'+f1(cx-rx)+' '+f1(y+ry)+' v'+f1(h-2*ry)+' a'+f1(rx)+' '+ry+' 0 0 0 '+f1(w)+' 0 v-'+f1(h-2*ry)+'" style="fill:'+f+';stroke:'+st+';stroke-width:1.6"/>'+
   '<ellipse cx="'+f1(cx)+'" cy="'+f1(y+ry)+'" rx="'+f1(rx)+'" ry="'+ry+'" style="fill:'+f+';stroke:'+st+';stroke-width:1.6"/>'+
   T(cx,y+h/2+(t2?3:7),t1,ST(fs||12,st,'middle',700))+(t2?T(cx,y+h/2+17,t2,ST(11,'var(--muted)')):'');}
function tape(x,y,cells,c,cw,hi){cw=cw||18;let s='';cells.forEach((t,j)=>{const on=hi===j,cc=on?'h4':c;
  s+=R(x+j*cw,y,cw-3,18,4,'fill:var(--'+cc+'-bg);stroke:var(--'+cc+');stroke-width:'+(on?2.2:1.2))+T(x+j*cw+(cw-3)/2,y+13,t,ST(11,'var(--'+cc+')','middle',700));});return s;}
function tok(x,y,d,cls,r){const c=cls==='a'?'h2':'h1';r=r||10;
  return '<circle cx="'+f1(x)+'" cy="'+f1(y)+'" r="'+r+'" style="fill:var(--'+c+'-bg);stroke:var(--'+c+');stroke-width:2"/>'+T(x,y+4,d,ST(r<9?11:12,'var(--'+c+')','middle',700));}
function lock(x,y,c){return R(x-7,y,14,11,2.5,'fill:'+c)+'<path d="M'+(x-4)+' '+y+' v-4 a4 4 0 0 1 8 0 v4" style="fill:none;stroke:'+c+';stroke-width:2"/>';}
const tk=(d,cls)=>'<span class="di-tk '+cls+'">'+d+'</span>';
function goals(id,items){return '<ul class="di-goals" id="'+id+'">'+items.map((t,j)=>'<li data-j="'+j+'"><span class="bx"></span><span>'+t+'</span></li>').join('')+'</ul>';}
function tick(L,id,j){const li=L.$('#'+id+' li[data-j="'+j+'"]');if(li&&!li.classList.contains('done')){li.classList.add('done');li.querySelector('.bx').innerHTML=L.ic('check');}}
const allT=(L,id)=>[...L.$$('#'+id+' li')].every(li=>li.classList.contains('done'));
function setRange(L,id,v){const e=L.$('#'+id);e.value=v;e.dispatchEvent(new Event('input',{bubbles:true}));}
const waitFor=async(L,fn,n)=>{for(let i=0;i<(n||200)&&!fn();i++)await L.sleep(30);};

const CSS='<style>'+

 '.di-cap{font-size:15.5px;line-height:1.5;margin:10px 0 4px}'+
 '.di-row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.di-row .btn{min-height:42px;padding:8px 12px;margin:0}.di-row .btn[disabled]{opacity:.45;cursor:default}.di-row .chip{margin:0;min-height:40px}'+
 '.di-rng{display:grid;grid-template-columns:auto 1fr 48px;gap:10px;align-items:center;font-size:14.5px;margin:6px 0}.di-rng input{width:100%;accent-color:var(--pri);height:30px}.di-rng b{text-align:right;font-variant-numeric:tabular-nums}'+

 '.di-tk.a{background:var(--h2-bg);color:var(--h2);border:2px solid var(--h2)}.di-tk.b{background:var(--h1-bg);color:var(--h1);border:2px solid var(--h1)}'+
 '.di-ev{display:grid;grid-template-columns:30px 1fr;gap:4px 8px;align-items:center;font-size:14.5px;line-height:1.35;background:var(--soft);border-radius:14px;padding:9px 11px;margin:8px 0}'+
 '.di-key{display:block;font-size:12.5px;color:var(--muted)}'+
 '.di-out{border-radius:14px;padding:9px 12px;font-size:14.5px;line-height:1.5;margin:6px 0}.di-out.ok{background:var(--ok-bg);color:var(--ok)}.di-out.no{background:var(--no-bg);color:var(--no)}.di-out.info{background:var(--soft);color:var(--ink)}'+
 '.di-goals{margin:8px 0;padding:0;list-style:none}.di-goals li{display:flex;gap:8px;align-items:center;font-size:14.5px;margin:5px 0;color:var(--muted)}'+
 '.di-goals .bx{width:20px;height:20px;border-radius:6px;border:2px solid var(--line2);flex:none;display:inline-flex;align-items:center;justify-content:center}'+
 '.di-goals li.done{color:var(--ok)}.di-goals li.done .bx{background:var(--ok-strong);border-color:var(--ok-strong);color:var(--card)}.di-goals .bx svg.i{width:13px;height:13px;stroke-width:3}'+
 '.di-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:8px 0}.di-stats div{background:var(--soft);border-radius:12px;padding:6px 8px;font-size:12px;line-height:1.3;color:var(--muted)}.di-stats b{display:block;font-size:14.5px;color:var(--ink);font-variant-numeric:tabular-nums}.di-stats b.bad{color:var(--no)}'+
 '.di-leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted);margin:2px 0 4px}.di-leg i{display:inline-block;width:14px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}.di-leg i.o{background:var(--h3-bg);border:2px solid var(--h3)}.di-leg i.n{background:var(--h2-bg);border:2px solid var(--h2)}'+
 '.di-tiles{display:grid;gap:8px;margin:8px 0}.di-tile{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;background:var(--soft);border-radius:14px;padding:9px 11px;font-size:14px;line-height:1.45}.di-tile .ico{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center}.di-tile b{display:block}'+
 '.di-cmp{display:grid;grid-template-columns:auto 1fr 1fr;gap:5px;font-size:13.5px;line-height:1.35;margin:6px 0}.di-cmp div{background:var(--soft);border-radius:10px;padding:7px 8px}.di-cmp .h{background:none;font-weight:700;color:var(--muted);padding:7px 2px}.di-cmp .l{background:var(--h4-bg);color:var(--h4)}.di-cmp .r{background:var(--h2-bg);color:var(--h2)}'+
 '.di-stage{font-size:12.5px;font-weight:700;color:var(--muted);display:block;margin-bottom:2px}'+
 '.di-detail{background:var(--soft);border-radius:14px;padding:10px 12px;font-size:14.5px;line-height:1.5;margin:8px 0;min-height:64px}'+
 '.di-tbl{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}.di-tbl td{padding:6px 6px;border-bottom:1px solid var(--line)}.di-tbl td:last-child{text-align:right;font-weight:700;white-space:nowrap}'+
 '.di-chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.di-chips span{font-size:12.5px;font-weight:600;border-radius:99px;padding:4px 10px;background:var(--soft);color:var(--muted)}'+
 '</style>';

/* ---------- 1. The funnel: lanes of events merging into one consumer ---------- */
function schedule(p){const out=[];
  p.toks.forEach((t,i)=>{const b=p.backlog[t.lane]||0,prev=out.filter(x=>x.lane===t.lane),q=prev.length;
    const tIn=t.t0+1,tOut=Math.max(tIn,b,q?prev[q-1].tOut+0.45:0),tArr=tOut+0.7;
    let tEnter=tArr;if(t.after!=null&&out[t.after])tEnter=Math.max(tArr,out[t.after].tEnter+0.45);
    out.push({i,lane:t.lane,q,b,t0:t.t0,tIn,tOut,tArr,tEnter});});
  return out;}
const delivered=(t,sc)=>sc.filter(x=>t>=x.tEnter).sort((a,b)=>a.tEnter-b.tEnter).map(x=>x.i);
const arrival=p=>{const sc=schedule(p);return delivered(1e9,sc);};

function Funnel(L,host,o){
  const ID=o.id;
  host.insertAdjacentHTML('beforeend','<svg id="'+ID+'-svg" class="di-svg" viewBox="0 0 320 100" role="img" aria-label="'+(o.aria||'Lanes of events merge through a funnel into the consumer on the right')+'"></svg><div class="di-merge" id="'+ID+'-m" aria-live="polite"></div>');
  const svg=host.querySelector('#'+ID+'-svg'),mg=host.querySelector('#'+ID+'-m');
  const F={plan:null,busy:false,sc:null};
  const alive=()=>svg.isConnected;
  const lab=o.mergeLabel||'Arrival order at the consumer: ';
  function geo(p){const n=p.lanes.length,rh=n<=3?42:Math.max(13,Math.floor(156/n)),lh=n*rh,ch=p.cons.length*50-10,H=Math.max(lh+18,ch+18,92),top=(H-lh)/2;
    return {n,rh,H,top,bot:top+lh,mid:H/2,cy:k=>top+k*rh+rh/2,ccy:c=>H/2-(p.cons.length-1)*25+c*50};}
  function pos(s,t,g){
    const y=g.cy(s.lane),ln=F.plan.lanes[s.lane],sx=86+s.q*18;
    const tail=ln.off?116:Math.max(98+s.q*18,201-s.b*9-s.q*16),front=ln.off?tail:201-s.q*16;
    if(t<s.t0)return {x:sx,y};
    if(t<s.tIn)return {x:sx+(tail-sx)*(t-s.t0),y};
    if(t<s.tOut){const u=(t-s.tIn)/Math.max(.01,s.tOut-s.tIn);return {x:tail+(front-tail)*u,y};}
    if(t<s.tArr){const u=(t-s.tOut)/0.7;if(u<.35)return {x:front+(216-front)*(u/.35),y};const v=(u-.35)/.65;return {x:216+24*v,y:y+(g.mid-y)*v};}
    if(t<s.tEnter)return {x:232,y:g.mid-(g.H/2-14),hold:true};
    return null;}
  function draw(t){
    if(!alive()||!F.plan)return;const p=F.plan,g=geo(p),sc=F.sc;let s='';
    svg.setAttribute('viewBox','0 0 320 '+g.H);
    s+='<polygon points="216,'+f1(g.top-2)+' 240,'+f1(g.mid-8)+' 240,'+f1(g.mid+8)+' 216,'+f1(g.bot+2)+'" style="fill:var(--soft2);stroke:var(--line2);stroke-width:1.2"/>';
    p.lanes.forEach((ln,k)=>{const y=g.cy(k),hi=(p.hl||[]).includes(k);
      if(g.rh>=20)s+=R(74,y-g.rh/2+3,142,g.rh-6,8,'fill:'+(hi?'var(--pri-bg)':'var(--soft)'));
      else if(hi)s+=R(74,y-g.rh/2+.5,142,g.rh-1,4,'fill:var(--pri-bg)');
      s+=Ln(74,y,216,y,'stroke:var(--line2);stroke-width:1.4'+(ln.off?';stroke-dasharray:4 4':''));
      s+=T(69,y+4,ln.name,ST(11,hi?'var(--pri)':'var(--muted)','end',600));
      const b=p.backlog[k]||0;
      if(ln.off){if(t<b)s+=T(160,y-9,'offline: waits to sync',ST(11,'var(--no)','middle',600));else if(t>=b&&t<1e8)s+=T(160,y-9,'back online: syncs',ST(11,'var(--ok)','middle',600));}
      else{const gone=t<0?0:Math.min(b,Math.max(0,Math.floor(t)));for(let j=gone;j<b;j++)s+=R(207-(j-gone)*9,y-4.5,7,9,2,'fill:var(--faint)');}
    });
    const d=t<0?[]:delivered(t,sc);
    p.cons.forEach((c,ci)=>{const y=g.ccy(ci),fl=t>=0&&sc.some(x=>t>=x.tEnter&&t<x.tEnter+.4);
      s+=Ln(240,g.mid,248,y,'stroke:var(--line2);stroke-width:1.4');
      s+=R(248,y-21,70,42,10,'fill:var(--card);stroke:'+(fl?'var(--pri)':'var(--line2)')+';stroke-width:'+(fl?3:1.6));
      s+=T(283,y-4,c.name,ST(11.5,'var(--ink)','middle',700))+T(283,y+12,o.sub?o.sub(ci,d):(c.sub||''),ST(11,'var(--muted)'));});
    sc.forEach(x=>{const ps=pos(x,t<0?-1:t,g);if(!ps)return;const k=p.toks[x.i];
      s+=tok(ps.x,ps.y,k.label,k.cls,8);
      if(ps.hold)s+=T(ps.x-12,ps.y+4,'waits',ST(11,'var(--h1)','end',700));});
    svg.innerHTML=s;}
  function set(plan,msg){F.plan=plan;F.sc=schedule(plan);draw(-1);mg.innerHTML=lab+'<span class="di-mut">'+(msg||'not run yet')+'</span>';}
  function run(){return new Promise(res=>{
    if(F.busy||!alive()||!F.plan){res(null);return;}
    F.busy=true;const sc=F.sc=schedule(F.plan),end=Math.max(...sc.map(x=>x.tEnter))+.5,U=(o.unit||230)*SPD,st=performance.now();
    (function step(){
      if(!alive()){F.busy=false;res(null);return;}
      const t=Math.min(end,(performance.now()-st)/U);draw(t);
      const d=delivered(t,sc);mg.innerHTML=lab+(d.length?d.map(i=>tk(F.plan.toks[i].d,F.plan.toks[i].cls)).join(' then '):'<span class="di-mut">…</span>');
      if(t<end){setTimeout(step,16);return;}
      F.busy=false;const r={order:d};if(o.on)o.on(r);res(r);})();});}
  return {F,set,run,draw,alive,idle:async()=>{for(let i=0;i<300&&F.busy;i++)await L.sleep(30);}};
}

/* Ama’s two events in the four setups (traffic and hash values are illustrative) */
const HASH={u:1013,p:1104};
function backlogFor(n,l1,l2,seed){const b=[];
  for(let k=0;k<n;k++)b.push(seed?((seed*7919+k*104729+seed*k*31)%97)%7:[2,1,3,0,2,1,3,1,0,2,1,2][k%12]);
  if(!seed){if(l1!==l2){b[l1]=5;b[l2]=0;}else b[l1]=3;}
  return b;}
function amaPlan(mode,o){o=o||{};let lanes,l1,l2,backlog;
  if(mode==='parts'){const n=o.n||12;lanes=[];for(let k=0;k<n;k++)lanes.push({name:n===1?'Event log':'P'+(k+1)});
    l1=HASH.u%n;l2=o.route==='user'?l1:HASH.p%n;backlog=backlogFor(n,l1,l2,o.seed||0);}
  else if(mode==='dc'){lanes=[{name:'Westport'},{name:'Eastvale'},{name:'Nordhaven'}];l1=2;l2=0;backlog=[0,2,5];}
  else if(mode==='svc'){lanes=[{name:'Preferences'},{name:'Parcel DB'}];l1=0;l2=1;backlog=[5,0];}
  else{lanes=[{name:'Ama’s phone',off:true},{name:'Server'}];l1=0;l2=1;backlog=[5,0];}
  return {lanes,backlog,l1,l2,hl:[l1,l2],cons:[{name:'Notifier'}],
    toks:[{label:'1',d:'①',cls:'a',lane:l1,t0:0},{label:'2',d:'②',cls:'b',lane:l2,t0:1,after:o.fix==='dep'?0:null}]};}
const notifSub=(ci,d)=>!d.includes(1)?'no text yet':(d.indexOf(0)>=0&&d.indexOf(0)<d.indexOf(1)?'to: Ama':'to: Ama, Jo');
const joGets=order=>order.indexOf(1)<order.indexOf(0)||order.indexOf(0)<0;
function laneInfo(p){const a=p.lanes[p.l1].name,b=p.lanes[p.l2].name;
  return tk('①','a')+' in <b>'+a+'</b> · '+tk('②','b')+' in <b>'+b+'</b> · '+(p.l1===p.l2?'<span style="color:var(--ok);font-weight:700">same lane: order kept</span>':'<span style="color:var(--no);font-weight:700">different lanes: no defined order</span>');}
function outHTML(order,fix){const jo=joGets(order);
  if(!jo)return '<div class="di-out ok">The new address was texted to <b>Ama</b> only. Jo heard nothing.</div>';
  return '<div class="di-out no">② arrived first, while Jo was still on the list, so the notifier texted the new address to <b>Ama and Jo</b>.'+
   (fix==='cr'?' Conflict resolution later fixes the stored list, but a sent text can’t be unsent.':fix==='lamport'?' The timestamps (41, then 42) give the right order, but ② got here first and the notifier acted on it.':'')+'</div>';}
const amaEvents=()=>'<div class="di-ev">'+tk('①','a')+'<div>Ama stops sharing tracking with Jo<span class="di-key">key: user Ama</span></div>'+tk('②','b')+'<div>Ama changes their delivery address<span class="di-key">key: parcel OP-48213</span></div>'+
  '<span></span><span class="di-key">The notifier texts each new address to everyone Ama shares tracking with. Backlogs are illustrative.</span></div>';

/* ---------- 2. The third rail: migrating the tracking view ---------- */
const STOPS=[0,1,5,10,25,50,100],READS=1000000,BUG=0.02,BUDGET=500;
function railSVG(st){let s='';
  for(let x=6;x<318;x+=14)s+=R(x,16,6,74,1.5,'fill:var(--soft2)');
  s+=Ln(0,24,320,24,'stroke:var(--muted);stroke-width:3.5');
  s+=st.oldGone?Ln(0,82,320,82,'stroke:var(--line2);stroke-width:2;stroke-dasharray:2 7'):Ln(0,82,320,82,'stroke:var(--h3);stroke-width:3.5');
  const tx=320*Math.max(0,Math.min(1,st.third||0));
  if(tx<320)s+=Ln(tx,53,320,53,'stroke:var(--line2);stroke-width:1.5;stroke-dasharray:4 5');
  if(tx>0)s+=Ln(0,53,tx,53,'stroke:var(--h2);stroke-width:3.5');
  (st.trains||[]).forEach(tr=>{const x=tr.x;if(x<-60||x>330)return;
    if(tr.k==='old')s+=R(x,12,54,76,8,'fill:var(--h3-bg);stroke:var(--h3);stroke-width:2')+R(x+9,22,12,10,2,'fill:var(--h3)')+R(x+30,22,12,10,2,'fill:var(--h3)');
    else{const bad=tr.k==='bad',c=bad?'no':'h2';
      s+=R(x,12,54,46,8,'fill:var(--'+c+'-bg);stroke:var(--'+c+');stroke-width:2')+(bad?T(x+27,41,'✗',ST(17,'var(--no)','middle',700)):R(x+9,22,12,10,2,'fill:var(--h2)')+R(x+30,22,12,10,2,'fill:var(--h2)'));}});
  return s+(st.extra||'');}
const railLegend='<div class="di-leg"><span><i class="o"></i>wide train, orange rail = old view</span><span><i class="n"></i>narrow train, teal third rail = new view</span></div>';

function Rail(L,host,o){
  o=Object.assign({id:'r',ctl:true,budget:false,on:()=>{}},o||{});const ID=o.id;
  host.insertAdjacentHTML('beforeend',
   '<svg id="'+ID+'-svg" class="di-svg" viewBox="0 0 320 96" role="img" aria-label="A dual-gauge track: a shared rail, a third rail for the new view and an old rail for the old view"></svg>'+railLegend+
   '<div class="di-stats" id="'+ID+'-st"></div>'+
   (o.ctl?'<div class="di-row"><button class="btn pri" id="'+ID+'-rp">'+L.ic('cycle')+'<span id="'+ID+'-rpl">Reprocess history</span></button></div>'+
    '<div class="di-rng"><label for="'+ID+'-sp">Reads on new view</label><input type="range" id="'+ID+'-sp" min="0" max="6" step="1" value="0"><b id="'+ID+'-spv">0%</b></div>'+
    '<div class="di-row"><button class="btn" id="'+ID+'-day">'+L.ic('play')+'Run a day</button><button class="btn" id="'+ID+'-rb">Roll back to 0%</button><button class="btn" id="'+ID+'-dr">'+L.ic('x')+'Remove old rail</button></div>':'')+
   '<div id="'+ID+'-log" aria-live="polite"></div>');
  const $=s=>host.querySelector(s),svg=$('#'+ID+'-svg');
  const alive=()=>svg.isConnected;
  const D={prog:0,built:false,bug:true,found:false,fixed:false,split:0,drop:false,day:0,err:0,mis:null,clean100:false,logDays:0,lambda:false,streamBug:false,busy:false,trains:null};
  const S=Object.assign({},D);
  function idleTrains(){const t=[];if(!S.drop)t.push({x:22,k:'old'});if(S.built||S.drop)t.push({x:224,k:'new'});return t;}
  function draw(){
    if(!alive())return;
    svg.innerHTML=railSVG({third:S.prog,oldGone:S.drop,trains:S.trains||idleTrains()});
    const pct=STOPS[S.split];
    const view=S.busy==='rp'?'rebuilding '+Math.round(S.prog*100)+'%':S.built?(S.fixed?(S.lambda&&S.streamBug?'batch fixed':'built, fixed'):'built'):(S.logDays&&S.prog>0?'last 7 days only':'not built');
    const cells=[['Day',S.day],['New view',view],['Reads on new',pct+'%'],['Error pages',fmt(S.err)+(o.budget?' / '+BUDGET:''),o.budget&&S.err>BUDGET],['Mismatches',S.mis==null?'–':fmt(S.mis),S.mis>0],['Old view',S.drop?'removed':'running',S.drop&&!S.clean100]];
    $('#'+ID+'-st').innerHTML=cells.map(c=>'<div>'+c[0]+'<b'+(c[2]?' class="bad"':'')+'>'+c[1]+'</b></div>').join('');
    if(o.ctl){
      $('#'+ID+'-rpl').textContent=S.lambda&&S.fixed&&S.streamBug?'Fix the stream job too':S.built&&S.found&&!S.fixed?'Fix the parser and reprocess':'Reprocess history';
      $('#'+ID+'-rp').disabled=!!S.busy||(S.built&&!(S.found&&!S.fixed)&&!(S.lambda&&S.fixed&&S.streamBug));
      const sp=$('#'+ID+'-sp');sp.value=S.split;sp.disabled=!!S.busy||!S.built||S.drop;$('#'+ID+'-spv').textContent=pct+'%';
      $('#'+ID+'-day').disabled=!!S.busy;$('#'+ID+'-rb').disabled=!!S.busy||(!S.drop&&S.split===0);$('#'+ID+'-dr').disabled=!!S.busy||S.drop;}
  }
  function log(h,kind){if(alive())$('#'+ID+'-log').innerHTML='<div class="fb '+(kind||'info')+'" style="margin-top:6px">'+h+'</div>';}
  function anim(ms,fn){return new Promise(res=>{const st=performance.now();(function step(){if(!alive()){res(false);return;}const u=Math.min(1,(performance.now()-st)/(ms*SPD));fn(u);draw();if(u<1){setTimeout(step,16);return;}res(true);})();});}
  async function reprocess(){
    if(S.busy||!alive())return;
    if(S.lambda&&S.fixed&&S.streamBug){S.streamBug=false;draw();log('You fixed the same parser a second time, in the stream job. Lambda keeps the logic in two codebases, so every fix is made twice.','ok');o.on({type:'fix2'});return;}
    if(S.built&&!(S.found&&!S.fixed))return;
    if(S.built&&S.split>0&&!S.drop){log('Roll back to 0% first, so nobody reads the new view while it is rebuilt.','info');o.on({type:'blocked'});return;}
    const fixing=S.built&&S.found;S.busy='rp';S.prog=0;
    const target=S.logDays?0.02:1;
    if(!(await anim(S.logDays?500:1200,u=>{S.prog=target*u;})))return;
    S.busy=false;
    if(S.logDays){S.built=false;draw();log('The event log only keeps 7 days, so only last week’s parcels could be rebuilt: about 2% of the history. You can’t derive a whole new view without the old events. You’re back to simple changes, like adding an optional “flat” field.','no');o.on({type:'short'});return;}
    S.built=true;
    if(fixing){S.fixed=true;S.bug=false;S.mis=null;if(S.lambda)S.streamBug=true;}
    draw();
    log(fixing?(S.lambda?'Parser fixed in the batch job, and history replayed again. The stream job that handles today’s events is a separate codebase.':'Parser fixed, and all six years of history replayed through it. The new view is rebuilt beside the old one.'):
      'Replayed six years of address events through the new parser. The new view now sits beside the old one. Nobody reads it yet.','ok');
    o.on({type:'built',fixed:fixing});}
  async function runDay(){
    if(S.busy||!alive())return;
    S.busy='day';const pct=STOPS[S.split],newReads=(S.built||S.drop)?READS*pct/100:0;
    const rate=S.bug?BUG:(S.lambda&&S.streamBug?BUG*.1:0),errs=Math.round(newReads*rate);
    const nNew=pct?Math.max(1,Math.round(7*pct/100)):0,kinds=[];
    for(let i=0;i<7;i++)kinds.push('old');
    for(let j=0;j<nNew;j++)kinds[Math.min(6,Math.round(j*7/nNew))]='new';
    if(S.drop)kinds.fill('new');
    if(errs){const f=kinds.indexOf('new');if(f>=0)kinds[f]='bad';}
    if(!(await anim(1300,u=>{S.trains=kinds.map((k,i)=>({k,x:-60-i*66+u*(400+7*66)}));})))return;
    S.trains=null;S.busy=false;S.day++;S.err+=errs;S.mis=errs;
    if(errs)S.found=true;
    S.clean100=pct===100&&!errs;
    draw();
    if(!pct)log('All '+fmt(READS)+' reads used the old view. Nothing changed for recipients.','info');
    else if(errs&&!S.bug)log(fmt(errs)+' error pages, all on today’s parcels. Those come from the stream layer, which runs its own copy of the parser. You only fixed the batch job.','no');
    else if(errs)log(fmt(newReads)+' reads ('+pct+'%) used the new view. <b>'+fmt(errs)+'</b> showed a broken address: in addresses like “Flat 3, 12 Quay Road” the flat landed in the street field.'+(S.drop?' And there is no old view to send anyone back to.':' The old view still works for everyone else.'),'no');
    else log('Clean day: '+fmt(newReads)+' reads on the new view and no mismatches.'+(pct===100&&!S.drop?' Everyone is on the new view, so you can remove the old rail.':''),'ok');
    o.on({type:'day',pct,errs});}
  function rollback(){
    if(S.busy||!alive())return;
    if(S.drop){log('There is no old view to go back to: it was converted in place. Recipients keep seeing errors until a fix is rebuilt.','no');o.on({type:'norollback'});return;}
    if(!S.split)return;
    S.split=0;S.clean100=false;draw();log('Rolled back: every read uses the old view again. Recipients are safe while the bug is fixed.','info');o.on({type:'rollback'});}
  function dropOld(){
    if(S.busy||!alive()||S.drop)return;
    if(STOPS[S.split]<100){log('Some reads still use the old view. Move every read to the new view first.','info');return;}
    if(!S.clean100){log('Run a clean day at 100% first. While the old rail exists, you can still roll back.','info');return;}
    S.drop=true;draw();log('Old rail removed: the old view is dropped and the migration is done. From now on there is no going back.','ok');o.on({type:'drop'});}
  function reset(cfg){Object.assign(S,D,cfg||{});S.trains=null;draw();if(alive())$('#'+ID+'-log').innerHTML='';}
  if(o.ctl){
    $('#'+ID+'-rp').onclick=reprocess;$('#'+ID+'-day').onclick=runDay;$('#'+ID+'-rb').onclick=rollback;$('#'+ID+'-dr').onclick=dropOld;
    $('#'+ID+'-sp').oninput=e=>{if(S.busy)return;S.split=+e.target.value;S.clean100=false;draw();o.on({type:'split',pct:STOPS[S.split]});};}
  reset(o.start);
  return {S,draw,reset,reprocess,runDay,rollback,dropOld,log,alive,idle:async()=>{for(let i=0;i<300&&S.busy;i++)await L.sleep(30);}};
}

/* ---------- dual writes: two writers, two stores, no one decides the order ---------- */
/* each write: from writer w (0 = ①, 1 = ②) to store s (0 = Parcel DB, 1 = Search), leaves at t0, lands at t1 */
const DW=[{w:0,s:0,t0:0,t1:.8},{w:1,s:0,t0:.3,t1:1.2},{w:1,s:1,t0:.3,t1:.9},{w:0,s:1,t0:0,t1:1.6}],DWEND=1.9;
const dwApplied=(t,s)=>DW.filter(x=>x.s===s&&t>=x.t1).sort((a,b)=>a.t1-b.t1).map(x=>x.w);
function dualSVG(t){
  const wy=[32,100],sy=[32,100],val=s=>{const a=dwApplied(t,s);return a.length?(a[a.length-1]===0?'…4410':'…4471'):'empty';};

  s+=bx(2,10,86,44,'Merchant API','sets …4410','soft',{fs:11.5})+bx(2,78,86,44,'Support agent','sets …4471','soft',{fs:11.5});
  s+=tok(98,32,'1','a',8)+tok(98,100,'2','b',8);
  [['Parcel DB',0],['Search',1]].forEach(([n,k])=>{const fl=DW.some(x=>x.s===k&&t>=x.t1&&t<x.t1+.25);
    s+=R(226,sy[k]-22,92,44,10,'fill:var(--card);stroke:'+(fl?'var(--pri)':'var(--line2)')+';stroke-width:'+(fl?3:1.6))+
      T(272,sy[k]-4,n,ST(11.5,'var(--ink)','middle',700))+T(272,sy[k]+12,val(k),ST(11,'var(--muted)'));});
  DW.forEach(x=>{if(t<x.t0||t>=x.t1)return;const u=(t-x.t0)/(x.t1-x.t0);
    s+=tok(106+(226-106)*u,wy[x.w]+(sy[x.s]-wy[x.w])*u,x.w?'2':'1',x.w?'b':'a',8);});
  if(t>=DWEND)s+=T(272,72,'≠ for good',ST(12,'var(--no)','middle',700));
  return s;}

  goals:['Explain why Otterpost should derive every copy from one ordered log, not dual writes or distributed transactions','Show where one total order breaks down, and protect an order that matters','Change a data model gradually by reprocessing history into a side-by-side view'],
  parts:['One ordered log','Logs vs transactions','Limits of order','Reprocess and evolve'],
  read:'Read the start of chapter 12 (“Data Integration”, up to “Unbundling Databases”) for the lambda architecture discussion and the railway sidebar in full.',
  glossary:{
    cdc:'Change data capture: reading a database’s log of row changes so another system (a warehouse, a search index, a cache) can copy them.',
    dualwrite:'Dual writes: the application itself writes each change to several systems, for example the database and then the search index. Easy to build, but the copies can drift apart.',
    totalorder:'Total order: an ordering where you can compare any two items and say which comes first, like numbers.',
    tob:'Total order broadcast: a way of sending messages so that none are lost and every node gets them in exactly the same order. Also called atomic broadcast.',
    idempotence:'Idempotence: an operation that has the same effect whether it runs once or several times, so a retry can’t do it twice.',
    eventtime:'Event time vs processing time: event time is when something actually happened (the timestamp inside the event); processing time is when a stream processor gets round to handling it. The two can be far apart.',
    'logical-clock':'Logical clock: a counter that goes up with each event. It shows which event came before which, not the time of day.',
    'lambda-arch':'Lambda architecture: running a batch system and a separate stream system side by side over the same events. The stream gives a fast, rough view; the batch job later produces a corrected one.'
  },
  cheatsheet:[
    'Chapter 12 is <b>Kleppmann’s opinion</b>: read it as “he argues”, not settled fact.',
    'No tool fits every job, so you <b>combine tools by deriving data</b>. Know where data is written first and what is derived from what.',
    '<b>Funnel writes through one log</b> that decides a total order, and let every other copy apply that order (CDC or event sourcing). Avoid dual writes.',
    '<b>Log vs distributed transaction:</b> log position instead of locks, idempotent retry instead of atomic commit. You lose read-your-writes by default, but a fault stays local.',
    'One total order breaks with <b>partitions, several datacenters, microservices and offline clients</b>. Routing by key only orders events inside one log. For causal links, one starting point: reference the event the user saw.',
    'Derive with <b>deterministic functions</b> and update derived systems <b>asynchronously</b>.',
    '<b>Reprocess history</b> into a new view beside the old one, shift reads gradually, roll back if needed, then drop the old view: the railway’s third rail.',
    '<b>Lambda</b> runs batch and stream side by side (logic twice, hard merges). Unified engines need replay, exactly-once and event-time windows.'
  ],

{part:0,src:'Chapter 12 · Combining Specialized Tools by Deriving Data',

 run(L){
  const INFO={db:['Parcel DB','<b>Good at:</b> being the durable system of record for parcels, merchants and prices. <b>Not built for:</b> rich keyword search. Some databases have simple full-text search, enough for simple apps.'],
   search:['Support search','<b>Good at:</b> finding a parcel from part of a phone number or postcode. <b>Not built for:</b> being the durable system of record.'],
   cache:['Tracking cache','<b>Good at:</b> answering the same tracking lookup again and again, fast. It is a copy derived from the original data.'],

 solve:async L=>{SPD=.3;L.$('#f5go').click();await L.fun.idle();L.$('#f5rp').click();await L.fun.idle();L.$('#f5dw').click();await waitFor(L,()=>!L.dwBusy);},
 run(L){
  SPD=1;let ran=0,replay=false,didReplay=false,didDual=false,fin=false;L.dwBusy=false;
  L.h(L.kick('ex','One log decides the order')+'<h1 class="q">Two edits to parcel OP-48213’s phone number arrive at once. Send them through one log, then try dual writes.</h1>'+CSS+
   '<div class="di-ev">'+tk('①','a')+'<div>Merchant API sets the phone <span style="white-space:nowrap">to …4410</span></div>'+tk('②','b')+'<div>Signe’s support agent corrects it <span style="white-space:nowrap">to …4471</span></div></div><div id="f5"></div>'+
   '<div id="f5dv" hidden><svg id="f5dsvg" class="di-svg" viewBox="0 0 320 132" role="img" aria-label="Dual writes: the merchant API and the support agent each write to the Parcel DB and to search directly, with different network delays"></svg><div class="di-merge" id="f5dm" aria-live="polite"></div></div>'+
   '<div class="di-row"><button class="btn pri" id="f5go">'+L.ic('play')+'Send both edits</button><button class="btn" id="f5dw">'+L.ic('play')+'Run dual writes</button><button class="btn" id="f5rp" disabled>'+L.ic('cycle')+'Crash search, replay from offset 0</button></div><div id="f5o"></div>');
  const sub=(ci,d)=>{if(ci===1&&replay)return '…4471';return d.length?(d[d.length-1]===0?'…4410':'…4471'):'empty';};
  const fun=L.fun=Funnel(L,L.$('#f5'),{id:'f5',sub,mergeLabel:'The log’s order: '});
  const plan=()=>({lanes:[{name:'Event log'}],backlog:[2],hl:[],cons:[{name:'Search'},{name:'Cache'}],toks:[{label:'1',d:'①',cls:'a',lane:0,t0:0},{label:'2',d:'②',cls:'b',lane:0,t0:1}]});
  fun.set(plan(),'press Send');
  const view=v=>{L.$('#f5').hidden=v!=='log';L.$('#f5dv').hidden=v!=='dual';};
  const busy=()=>fun.F.busy||L.dwBusy;
  function finish(){if(fin||!didReplay||!didDual)return;fin=true;
    L.sheet('info','One order, or none','The log fixed one order, and every copy applied it: state machine replication, the idea behind '+L.g('tob','total order broadcast')+'. CDC or event sourcing matters less than deciding one '+L.g('totalorder','total order')+'. Replay is harmless because the update is deterministic and '+L.g('idempotence','idempotent')+'. With dual writes, nobody decides the order.');L.done();}
  L.$('#f5go').onclick=async()=>{if(busy())return;view('log');replay=false;fun.set(plan(),'press Send');L.$('#f5o').innerHTML='';const r=await fun.run();if(!r)return;ran=1;
    L.$('#f5o').innerHTML='<div class="di-out ok">Both copies applied ① then ②. Search and the cache both say <b>…4471</b>.</div>';L.$('#f5rp').disabled=false;};
  L.$('#f5rp').onclick=async()=>{if(!ran||busy())return;view('log');L.$('#f5rp').disabled=true;replay=true;fun.set(plan(),'search restarts at offset 0');const r=await fun.run();if(!r)return;
    L.$('#f5o').innerHTML='<div class="di-out ok">Search re-read every event, in the same order, and ended at <b>…4471</b> again. Nothing doubled.</div>'+(didDual?'':'<div class="di-out info">Now try <b>Run dual writes</b>: the booking code writes to both systems itself.</div>');
    didReplay=true;finish();};
  L.$('#f5dw').onclick=()=>{if(busy())return;L.dwBusy=true;view('dual');L.$('#f5o').innerHTML='';
    const svg=L.$('#f5dsvg'),dm=L.$('#f5dm'),U=700*SPD,st=performance.now();
    const ord=(t,k)=>{const a=dwApplied(t,k);return a.length?a.map(w=>w?tk('②','b'):tk('①','a')).join(' then '):'<span class="di-mut">…</span>';};
    (function step(){
      if(!svg.isConnected){L.dwBusy=false;return;}
      const t=Math.min(DWEND,(performance.now()-st)/U);svg.innerHTML=dualSVG(t);
      dm.innerHTML='Parcel DB: '+ord(t,0)+'<br>Search: '+ord(t,1);
      if(t<DWEND){setTimeout(step,16);return;}
      L.dwBusy=false;didDual=true;
      L.$('#f5o').innerHTML='<div class="di-out no">No one decided the order. The Parcel DB got ① then ② and says <b>…4471</b>; search got ② then ① and says <b>…4410</b>. Nothing will ever reconcile them.</div>'+(didReplay?'':'<div class="di-out info">Now send both edits through the log, then crash search and replay.</div>');
      finish();})();};}},

 solve:async L=>{SPD=.3;for(const m of ['parts','dc','svc','phone']){L.$('#e14-'+m).click();await L.sleep(20);await L.fun.idle();}},
 run(L){
  SPD=1;const tried=new Set();let mode='parts',route='rec';
  const NOTE={parts:'Too much for one leader: the log is split into 12 partitions. Order holds only inside each one.',
   dc:'Ama is abroad, so their sharing change goes through Nordhaven’s leader; the parcel lives in Westport. Each datacenter has its own leader, so nothing orders events across them.',
   svc:'The sharing list lives in the preferences service, addresses in the Parcel DB. Each service keeps its own state and log, so their events have no defined order.',
   phone:'Ama removed Jo in the app while offline on a train, then changed the address on the website. Ama’s phone saw ① then ②; the server sees ② then ①.'};
  L.h(L.kick('pr','Edge cases')+'<h1 class="q">Run Ama’s two events through each limit of total ordering. Then try routing ② by Ama’s user ID.</h1>'+CSS+
   '<div class="di-row" id="e14p">'+[['parts','One leader’s limit'],['dc','Several datacenters'],['svc','Microservices'],['phone','Offline client']].map(p=>'<button class="chip" id="e14-'+p[0]+'">'+p[1]+'</button>').join('')+'</div>'+
   '<div class="di-row"><button class="chip" id="e14r" aria-pressed="false">Route ② by Ama’s user ID: off</button></div>'+
   '<div class="di-merge" id="e14i"></div><div id="f14"></div><div id="e14o"></div>');
  const fun=L.fun=Funnel(L,L.$('#f14'),{id:'f14',sub:notifSub});
  function load(){const p=amaPlan(mode,{n:12,route});fun.set(p,'running…');let h=laneInfo(p);
    if(route==='user')h+='<br>'+(mode==='parts'?'Both events now go to Ama’s partition, so ① stays ahead of ②.':'Routing can’t help here: these are separate logs, with no shared partition to route into.');
    L.$('#e14i').innerHTML=h;return p;}
  async function go(m){if(fun.F.busy)return;mode=m;[...L.$('#e14p').children].forEach(b=>b.classList.toggle('sel',b.id==='e14-'+m));
    load();L.$('#e14o').innerHTML='<div class="di-out info">'+NOTE[m]+'</div>';const r=await fun.run();if(!r)return;
    L.$('#e14o').insertAdjacentHTML('beforeend',outHTML(r.order));tried.add(m);
    if(tried.size===4&&!L.$('#e14d')){L.$('#e14o').insertAdjacentHTML('beforeend','<span id="e14d"></span>');
      L.sheet('info','Four places one order runs out','Partitions, datacenters, services and offline clients each leave ① and ② without a defined order. Routing both events by one key only helps inside one partitioned log. Most consensus algorithms assume one node can order the whole stream.');L.done();}}
  ['parts','dc','svc','phone'].forEach(m=>{L.$('#e14-'+m).onclick=()=>go(m);});
  L.$('#e14r').onclick=()=>{if(fun.F.busy)return;route=route==='rec'?'user':'rec';const b=L.$('#e14r');b.classList.toggle('sel',route==='user');b.setAttribute('aria-pressed',route==='user');
    b.textContent='Route ② by Ama’s user ID: '+(route==='user'?'on':'off');if(tried.size)go(mode);else load();};
  load();L.$('#e14o').innerHTML='<div class="di-out info">Pick a limit to run it.</div>';}},
{part:2,src:'Chapter 12 · Ordering events to capture causality',pts:1,
 solve:async L=>{SPD=.3;L.$('#c15-dep').click();L.$('#c15go').click();await waitFor(L,()=>L.$('#c15d'));},
 run(L){
  SPD=1;let fix=null,graded=false;
  const FIX=[['route','Route both by Ama’s user ID'],['lamport','Add logical timestamps'],['dep','② references the list version Ama saw'],['cr','Resolve conflicts in the list']];
  const WHY={dep:'② carries the ID of the list version Ama saw, which already left Jo out, so the dependency is recorded in the event and the notifier can see it. One way to use it, shown here: the notifier holds ② until it has that version. The reference travels with the event, across any log, datacenter or service. Kleppmann offers this as a starting point, not a full solution.',
   route:'One key per partition fixes the partitioned log only. Datacenters, services and an offline phone are separate logs, with no shared partition to route into.',
   lamport:'Logical timestamps give every event a place in one order without coordination. But ② still arrives first, and the notifier can’t know ① is on its way: receivers must cope with out-of-order events.',
   cr:'Conflict resolution can fix the stored sharing list later. It can’t unsend a text: a notification is a side effect in the outside world.'};
  L.h(L.kick('pr','Challenge')+'<h1 class="q">Pick one fix that keeps Jo from getting the text in all four setups. It runs live on the microservices setup.</h1>'+CSS+
   '<div class="di-row" id="c15p">'+FIX.map(f=>'<button class="chip" id="c15-'+f[0]+'">'+f[1]+'</button>').join('')+'</div>'+
   '<div class="di-row"><button class="btn pri" id="c15go" disabled>'+L.ic('play')+'Run all four setups</button></div><div id="f15"></div><div id="c15o"></div>');
  const fun=L.fun=Funnel(L,L.$('#f15'),{id:'f15',sub:notifSub});
  fun.set(amaPlan('svc',{}),'pick a fix');
  FIX.forEach(f=>{L.$('#c15-'+f[0]).onclick=()=>{if(fun.F.busy)return;fix=f[0];[...L.$('#c15p').children].forEach(b=>b.classList.toggle('sel',b.id==='c15-'+fix));
    L.$('#c15go').disabled=false;fun.set(amaPlan('svc',{fix}),'press Run');L.$('#c15o').innerHTML='';};});
  L.$('#c15go').onclick=async()=>{if(!fix||fun.F.busy)return;const f=fix;L.$('#c15go').disabled=true;
    const r=await fun.run();if(!r)return;L.$('#c15go').disabled=false;
    const rows=[['parts','12 partitions'],['dc','Several datacenters'],['svc','Microservices'],['phone','Offline client']].map(m=>{
      const o=arrival(amaPlan(m[0],{n:12,route:f==='route'?'user':'rec',fix:f}));return [m[1],!joGets(o)];});
    const pass=rows.every(x=>x[1]);
    L.$('#c15o').innerHTML=outHTML(r.order,f)+'<table class="di-tbl">'+rows.map(x=>'<tr><td>'+x[0]+'</td><td style="color:var(--'+(x[1]?'ok':'no')+')">'+(x[1]?'✓ Jo safe':'✗ Jo texted')+'</td></tr>').join('')+'</table>';
    if(!graded){graded=true;L.award(pass);}
    L.$('#c15o').insertAdjacentHTML('beforeend','<span id="c15d"></span>');
    L.sheet(pass?'ok':'no',pass?'Jo is safe everywhere':'Not in every setup',WHY[f]+(pass?'':' The fix that works everywhere: ② references the list version Ama saw. You can try the others.'));L.done();};}},

{part:3,src:'Chapter 12 · Maintaining derived state',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Linh’s job rebuilds the tracking view from the event log. Tobias adds a line that also texts the recipient whenever the job processes a “delivered” event. The job crashes and replays an hour of events. What happens?</h1>');
  L.mc(L.card,['The view is rebuilt correctly and nobody notices','Recipients get their “delivered” text a second time','The replay refuses to run until the texts are removed'],1,
   'The view comes out right, but the text is a side effect outside the job’s output, so the replay sends it again. Deterministic functions with no other side effects are what make replays safe.',
   'Nothing stops the replay, and the view itself is fine. The problem is the side effect: each replayed “delivered” event sends its text again. Keep derivations pure, with the output as the only effect.');}},
{part:3,src:'Chapter 12 · Schema Migrations on Railways',

{part:3,src:'Chapter 12 · Reprocessing data for application evolution',pts:1,
 solve:async L=>{SPD=.3;L.$('#p21').children[1].click();await waitFor(L,()=>L.$('#p21d'));},
 run(L){

{part:3,src:'Chapter 12 · The lambda architecture',run(L){

   cap('The '+L.g('lambda-arch','lambda architecture')+' runs a stream processor (e.g. Storm) for a quick, rough view and a batch job (e.g. Hadoop MapReduce) for a corrected one, betting that batch is less buggy. Kleppmann credits it with popularizing derived views, but sees three problems:')+

{part:3,src:'Chapter 12 · Reprocessing data for application evolution',
 solve:async L=>{SPD=.25;for(const k of ['bb','sl','la']){L.$('#e23-'+k).click();await L.sleep(20);await waitFor(L,()=>!L.e23busy,300);}},
 run(L){
  SPD=1;const tried=new Set();L.e23busy=false;
  L.h(L.kick('pr','Edge cases')+'<h1 class="q">Where does the third rail stop protecting you? Run each case.</h1>'+CSS+
   '<div class="di-row" id="e23p"><button class="chip" id="e23-bb">Big-bang switch</button><button class="chip" id="e23-sl">Log keeps only 7 days</button><button class="chip" id="e23-la">Lambda: two codebases</button></div><div id="r23"></div>');
  const rail=L.rail=Rail(L,L.$('#r23'),{id:'r23'});
  rail.log('Pick a case. Each one loads a starting state and plays the key step.','info');
  async function go(k){if(L.e23busy||rail.S.busy)return;L.e23busy=true;[...L.$('#e23p').children].forEach(b=>b.classList.toggle('sel',b.id==='e23-'+k));
    if(k==='bb'){rail.reset(BIGBANG);await rail.runDay();}
    else if(k==='sl'){rail.reset({logDays:7});await rail.reprocess();}
    else{rail.reset({lambda:true,built:true,prog:1,found:true});await rail.reprocess();if(rail.alive()){rail.S.split=4;rail.draw();await rail.runDay();}}
    L.e23busy=false;if(!rail.alive())return;tried.add(k);
    if(tried.size===3&&!L.$('#e23d')){L.$('#r23').insertAdjacentHTML('beforeend','<span id="e23d"></span>');
      L.sheet('info','Three limits','No old view means no way back. No history means nothing to reprocess, so changes stay small. And with lambda the same logic lives twice, so one fix leaves the other layer wrong. You can keep playing with the controls.');L.done();}}
  ['bb','sl','la'].forEach(k=>{L.$('#e23-'+k).onclick=()=>go(k);});}},
{part:3,src:'Chapter 12 · Reprocessing data for application evolution',pts:1,
 solve:async L=>{SPD=.25;const r=L.rail;L.$('#r24-rp').click();await r.idle();setRange(L,'r24-sp',1);L.$('#r24-day').click();await r.idle();L.$('#r24-rb').click();
