/* ---------- byte encoders (real encodings of a small record) ---------- */
const ascii=s=>[...s].map(c=>c.charCodeAt(0));
function uvar(n){const o=[];do{let b=n%128;n=Math.floor(n/128);if(n>0)b+=128;o.push(b);}while(n>0);return o;}
const zz=n=>n>=0?2*n:-2*n-1, unzz=n=>n%2===0?n/2:-(n+1)/2;
function be(n,k){const o=[];for(let i=k-1;i>=0;i--)o.push(Math.floor(n/Math.pow(256,i))%256);return o;}
const Sg=(b,r,l,a,fi)=>({b,r,l,a:!!a,fi});
const REC={
 ravi:{lab:'Ravi’s scan',F:[
  {n:'trackingCode',t:'string',tag:1,v:'OP-48213'},
  {n:'status',t:'string',tag:2,v:'delivered'},
  {n:'courierId',t:'string',tag:3,v:'C-0017'},
  {n:'codCents',t:'long',tag:4,v:2500,u:1}]},
 book:{lab:'The book’s record',F:[
  {n:'userName',t:'string',tag:1,v:'Martin'},
  {n:'favoriteNumber',t:'long',tag:2,v:1337,u:1},
  {n:'interests',t:'list',tag:3,v:['daydreaming','hacking']}]}};
const TN={string:'string',long:'whole number',list:'list'};
function eJSON(F){const s=[Sg(ascii('{'),'struct','Start of the object',1,-1)];
 F.forEach((f,i)=>{s.push(Sg(ascii('"'+f.n+'":'),'name','The field name “'+f.n+'”, spelled out in full',1,i));
  const txt=f.t==='string'?'"'+f.v+'"':f.t==='list'?'['+f.v.map(x=>'"'+x+'"').join(',')+']':String(f.v);
  s.push(Sg(ascii(txt),'val',f.t==='long'?'The number '+f.v+', written as '+txt.length+' digit characters':'The value of '+f.n+', as text',1,i));
  if(i<F.length-1)s.push(Sg(ascii(','),'struct','A comma between fields',1,-1));});
 s.push(Sg(ascii('}'),'struct','End of the object',1,-1));return s;}
function eMP(F){const s=[Sg([0x80|F.length],'struct','“An object with '+F.length+' fields follows”',0,-1)];
 const str=(t,role,what,i)=>{s.push(Sg([0xa0|t.length],'len','“A string, '+t.length+' bytes long, follows”',0,i));s.push(Sg(ascii(t),role,what,1,i));};
 F.forEach((f,i)=>{str(f.n,'name','The field name “'+f.n+'”, still spelled out',i);
  if(f.t==='string')str(f.v,'val','The value “'+f.v+'”',i);
  else if(f.t==='long'){s.push(Sg([0xcd],'tag','“A 16-bit whole number follows”',0,i));s.push(Sg(be(f.v,2),'val','The number '+f.v+' in 2 bytes',0,i));}
  else{s.push(Sg([0x90|f.v.length],'len','“A list of '+f.v.length+' items follows”',0,i));f.v.forEach(x=>str(x,'val','The list item “'+x+'”',i));}});
 return s;}
const TBt={string:11,long:10,list:15},TCt={string:8,long:6,list:9};
function eTB(F){const s=[];F.forEach((f,i)=>{s.push(Sg([TBt[f.t],0,f.tag],'tag','Type ('+TN[f.t]+') plus field tag '+f.tag+'. No name.',0,i));
  if(f.t==='string'){s.push(Sg(be(f.v.length,4),'len','Length '+f.v.length+', as a 4-byte number',0,i));s.push(Sg(ascii(f.v),'val','The value “'+f.v+'”',1,i));}
  else if(f.t==='long')s.push(Sg(be(f.v,8),'val','The number '+f.v+' in a fixed 8 bytes',0,i));
  else{s.push(Sg([11].concat(be(f.v.length,4)),'len','“The items are strings, and there are '+f.v.length+'”',0,i));f.v.forEach(x=>{s.push(Sg(be(x.length,4),'len','Length '+x.length,0,i));s.push(Sg(ascii(x),'val','The list item “'+x+'”',1,i));});}});
 s.push(Sg([0],'struct','“End of the record”',0,-1));return s;}
function eTC(F){const s=[];let last=0;F.forEach((f,i)=>{const d=f.tag-last;last=f.tag;s.push(Sg([(d<<4)|TCt[f.t]],'tag','Field tag '+f.tag+' and type ('+TN[f.t]+') packed into one byte',0,i));
  if(f.t==='string'){s.push(Sg(uvar(f.v.length),'len','Length '+f.v.length,0,i));s.push(Sg(ascii(f.v),'val','The value “'+f.v+'”',1,i));}
  else if(f.t==='long'){const b=uvar(zz(f.v));s.push(Sg(b,'val','The number '+f.v+' as a variable-length integer: '+b.length+' bytes, not 8',0,i));}
  else{s.push(Sg([(f.v.length<<4)|8],'len','“'+f.v.length+' items, all strings” in one byte',0,i));f.v.forEach(x=>{s.push(Sg(uvar(x.length),'len','Length '+x.length,0,i));s.push(Sg(ascii(x),'val','The list item “'+x+'”',1,i));});}});
 s.push(Sg([0],'struct','“End of the record”',0,-1));return s;}
function ePB(F){const s=[];F.forEach((f,i)=>{
  if(f.t==='list')f.v.forEach(x=>{s.push(Sg([(f.tag<<3)|2],'tag','Tag '+f.tag+' and type, one byte. A repeated field just writes its tag again for each item.',0,i));s.push(Sg(uvar(x.length),'len','Length '+x.length,0,i));s.push(Sg(ascii(x),'val','The list item “'+x+'”',1,i));});
  else if(f.t==='string'){s.push(Sg([(f.tag<<3)|2],'tag','Tag '+f.tag+' and type, in one byte. The name “'+f.n+'” is never sent.',0,i));s.push(Sg(uvar(f.v.length),'len','Length '+f.v.length,0,i));s.push(Sg(ascii(f.v),'val','The value “'+f.v+'”',1,i));}
  else{s.push(Sg([(f.tag<<3)|0],'tag','Tag '+f.tag+' and type (whole number), in one byte',0,i));const b=uvar(f.v);s.push(Sg(b,'val','The number '+f.v+' as a variable-length integer: '+b.length+' bytes',0,i));}});
 return s;}
function eAV(F){const s=[];F.forEach((f,i)=>{
  if(f.t==='string'){s.push(Sg(uvar(zz(f.v.length)),'len','Length '+f.v.length+'. Nothing says which field this is, or even that it’s a string.',0,i));s.push(Sg(ascii(f.v),'val','The value “'+f.v+'”',1,i));}
  else if(f.t==='long'){s.push(Sg([2],'tag','Which branch of the union {null, long}: branch 1, a long',0,i));const b=uvar(zz(f.v));s.push(Sg(b,'val','The number '+f.v+' as a variable-length integer',0,i));}
  else{s.push(Sg(uvar(zz(f.v.length)),'len','“'+f.v.length+' items follow”',0,i));f.v.forEach(x=>{s.push(Sg(uvar(zz(x.length)),'len','Length '+x.length,0,i));s.push(Sg(ascii(x),'val','The list item “'+x+'”',1,i));});s.push(Sg([0],'struct','“End of the list”',0,i));}});
 return s;}
const FMTS=[['json','JSON',eJSON],['mp','MessagePack',eMP],['tb','Thrift Binary',eTB],['tc','Thrift Compact',eTC],['pb','Protocol Buffers',ePB],['av','Avro',eAV]];
const FN={};FMTS.forEach(f=>FN[f[0]]=f[1]);
const encode=(rec,fmt)=>FMTS.find(f=>f[0]===fmt)[2](REC[rec].F);
const sizeOf=s=>s.reduce((a,x)=>a+x.b.length,0), namesOf=s=>s.filter(x=>x.r==='name').reduce((a,x)=>a+x.b.length,0);
const bytesOf=s=>s.reduce((a,x)=>a.concat(x.b),[]);
const ROLES=[['name','Field name'],['tag','Tag / type'],['len','Length'],['val','Value'],['struct','Structure']];
const LEG='<div class="e8leg">'+ROLES.map(r=>'<span><i class="r-'+r[0]+'"></i>'+r[1]+'</span>').join('')+'</div>';
const hex=b=>(b<16?'0':'')+b.toString(16);

/* ---------- 1. the byte inspector ---------- */
function Insp(L,host,o){
 o=Object.assign({id:'i',rec:'ravi',fmt:'json',recs:['ravi','book'],fmts:FMTS.map(f=>f[0]),bars:true,leg:LEG,on:()=>{}},o||{});
 const ID=o.id,st={rec:o.rec,fmt:o.fmt,sel:-1,segs:[]};
 host.insertAdjacentHTML('beforeend','<div class="e8i">'+
  (o.recs.length>1?'<div class="e8row" id="'+ID+'-rec" role="group" aria-label="Record"></div>':'')+
  (o.fmts.length>1?'<div class="e8row" id="'+ID+'-fmt" role="group" aria-label="Format"></div>':'')+
  '<div class="e8th" id="'+ID+'-th"></div>'+o.leg+
  '<div class="e8tape" id="'+ID+'-tape"></div>'+

 const $=s=>L.$('#'+ID+'-'+s);

 function draw(){

  let h='';st.segs.forEach((s,si)=>s.b.forEach(b=>{const pr=s.a&&b>32&&b<127;h+='<span class="e8c r-'+s.r+(pr?'':' hx')+'" data-s="'+si+'">'+L.esc(pr?String.fromCharCode(b):hex(b))+'</span>';}));

/* ---------- 2. the schema handshake ---------- */
const show=v=>v===null?'null':Array.isArray(v)?'['+v.map(show).join(', ')+']':typeof v==='string'?'“'+v+'”':String(v);
const i32=v=>{let x=v%4294967296;if(x>2147483647)x-=4294967296;return x;};
function resolve(W,R,val,mode){
 const o={w:W.map(()=>null),r:R.map(()=>null),links:[],ok:true,invalid:''};
 if(mode==='avro'){const bad=[...W,...R].find(f=>f.def==='null'&&!(f.u||[]).includes('null'));
  if(bad){o.ok=false;o.invalid='Not allowed: <b>'+bad.n+'</b> has the default null, but null isn’t one of its types. Null can only be a default if it’s a branch of a union, like union {null, string}.';
   W.forEach((f,i)=>{if(f===bad)o.w[i]=['bad','invalid default'];});R.forEach((f,i)=>{if(f===bad)o.r[i]=['bad','invalid default'];});return o;}}
 W.forEach((w,wi)=>{const v=val(w);if(v===undefined)return;
  const ri=R.findIndex(r=>mode==='tag'?r.tag===w.tag:(r.n===w.n||(r.alias||[]).includes(w.n)));
  if(ri<0){
   if(mode==='tag'){const s=R.findIndex(r=>r.id===w.id);
    if(s>=0){o.w[wi]=['bad','tag '+w.tag+' unknown: skipped'];o.r[s]=['bad','empty: its data came under tag '+w.tag];o.ok=false;o.links.push([wi,-1,'bad']);return;}
    o.w[wi]=['skip','unknown tag '+w.tag+': skipped'];}
   else o.w[wi]=['skip','not in reader’s schema: ignored'];
   o.links.push([wi,-1,'skip']);return;}
  const r=R[ri];let k='ok',t;
  if(mode==='tag'){
   if(r.id!==w.id){k='bad';t='misread: '+r.n+' = '+show(v);o.w[wi]=['bad','was '+w.n+'!'];}
   else if(w.t==='int64'&&r.t==='int32'&&Math.abs(v)>2147483647){k='bad';t='cut to 32 bits: '+i32(v);}
   else if(w.rule==='rep'&&r.rule!=='rep')t='sees only the last item: '+show(v[v.length-1]);
   else if(w.rule!=='rep'&&r.rule==='rep')t='a list of one: ['+show(v)+']';
   else t='read: '+show(v)+(r.n!==w.n?' (new name)':'');
  }else{
   const vt=v===null?'null':typeof v==='number'?'long':'string',ts=r.u||[r.t];
   if(!ts.includes(vt)){k='bad';t='error: can’t read a '+vt;}
   else t='read: '+show(v)+(r.n!==w.n?' (via alias)':'');
  }
  if(k==='bad')o.ok=false;o.r[ri]=[k,t];o.links.push([wi,ri,k]);});
 R.forEach((r,ri)=>{if(o.r[ri])return;
  if(mode==='tag'){if(r.rule==='req'){o.r[ri]=['bad','error: required field missing'];o.ok=false;}else o.r[ri]=['def','not set: left empty'];}
  else if(r.def!==undefined)o.r[ri]=['def','filled with default: '+r.def];
  else{o.r[ri]=['bad','error: no value, no default'];o.ok=false;}});
 return o;}
function Hand(L,host,o){
 o=Object.assign({id:'h',mode:'tag',dirs:true},o||{});
 const ID=o.id,H={old:[],nu:[],vals:{},lab:{old:'old code',nu:'new code'},dir:'b',res:null,hl:null};
 host.insertAdjacentHTML('beforeend','<div class="e8h">'+(o.dirs?'<div class="e8dir" id="'+ID+'-dir"></div>':'')+'<div class="e8hg" id="'+ID+'-g"></div><div class="e8hn" id="'+ID+'-n"></div></div>');
 const val=f=>f.v!==undefined?f.v:H.vals[f.id];
 const typ=f=>o.mode==='tag'?(f.rule==='req'?'required':f.rule==='rep'?'repeated':'optional')+' '+f.t:
  (f.u?'union {'+f.u.join(', ')+'}':f.t)+(f.def!==undefined?' = '+f.def:'')+(f.alias?' · alias “'+f.alias.join(', ')+'”':'');
 function row(f,r,side,i){const cls=(r&&r[0]==='bad'?' bad':'')+(H.hl?(H.hl.includes(f.id)?' hl':' dim'):'')+(f.isNew&&!(r&&r[0]==='bad')?' nw':'');
  return '<div class="e8f'+cls+'" id="'+ID+'-'+side+i+'">'+(o.mode==='tag'?'<span class="e8tg">'+f.tag+'</span>':'')+'<div style="min-width:0"><b>'+f.n+'</b><small>'+typ(f)+'</small>'+
   (side==='w'&&val(f)!==undefined?'<small class="e8v">= '+show(val(f))+'</small>':'')+(r?'<em class="'+r[0]+'">'+r[1]+'</em>':'')+'</div></div>';}
 function lines(links,colored){const g=L.$('#'+ID+'-g');if(!g)return;const old=g.querySelector('svg');if(old)old.remove();
  const cw=L.$('#'+ID+'-cw'),cr=L.$('#'+ID+'-cr');if(!cw||!cr)return;const x1=cw.offsetLeft+cw.offsetWidth,x2=cr.offsetLeft;let p='';
  links.forEach(([wi,ri,k])=>{const a=L.$('#'+ID+'-w'+wi);if(!a)return;const y1=a.offsetTop+a.offsetHeight/2;
   const col=!colored?'var(--line2)':k==='bad'?'var(--no)':k==='skip'?'var(--faint)':'var(--ok-strong)';
   if(ri<0){const m=x1+(x2-x1)*.5;p+='<path d="M'+x1+' '+y1+' H'+m+'" style="stroke:'+col+';stroke-width:2.5;stroke-dasharray:3 3;fill:none"/><path d="M'+(m+1)+' '+(y1-4)+'l7 8m0 -8l-7 8" style="stroke:'+col+';stroke-width:2;fill:none;stroke-linecap:round"/>';return;}
   const b=L.$('#'+ID+'-r'+ri);if(!b)return;const y2=b.offsetTop+b.offsetHeight/2;
   p+='<path d="M'+x1+' '+y1+' C'+(x1+16)+' '+y1+' '+(x2-16)+' '+y2+' '+x2+' '+y2+'" style="stroke:'+col+';stroke-width:2.5;fill:none"/>';});
  g.insertAdjacentHTML('beforeend','<svg aria-hidden="true">'+p+'</svg>');}
 let last=null;
 function draw(){const g=L.$('#'+ID+'-g');if(!g)return;
  if(o.dirs){const d=L.$('#'+ID+'-dir');d.innerHTML=['b','f'].map(k=>{const r=H.res&&H.res[k];
    return '<button class="e8d'+(H.dir===k?' sel':'')+(r?(r.ok?' ok':' no'):'')+'" data-d="'+k+'"><b>'+(k==='b'?'Backward':'Forward')+(r?(r.ok?' ✓':' ✗'):'')+'</b>'+(k==='b'?'new code reads old data':'old code reads new data')+'</button>';}).join('');
   d.querySelectorAll('button').forEach(b=>b.onclick=()=>H.show(b.dataset.d));}
  const W=H.dir==='b'?H.old:H.nu,R=H.dir==='b'?H.nu:H.old,res=H.res&&H.res[H.dir];
  const wl=H.dir==='b'?H.lab.old:H.lab.nu,rl=H.dir==='b'?H.lab.nu:H.lab.old;
  g.innerHTML='<div class="e8col" id="'+ID+'-cw"><div class="e8ch">Written by '+wl+'</div>'+W.map((f,i)=>row(f,res&&res.w[i],'w',i)).join('')+'</div><div></div>'+
   '<div class="e8col" id="'+ID+'-cr"><div class="e8ch">Read by '+rl+'</div>'+R.map((f,i)=>row(f,res&&res.r[i],'r',i)).join('')+'</div>';
  const n=L.$('#'+ID+'-n');n.innerHTML=res&&res.invalid?'<div class="fb no">'+res.invalid+'</div>':'';
  last=[(res||resolve(W,R,val,o.mode)).links,!!res];
  requestAnimationFrame(()=>lines(last[0],last[1]));}
 const redraw=()=>{if(!L.$('#'+ID+'-g')){window.removeEventListener('resize',redraw);return;}if(last)lines(last[0],last[1]);};
 window.addEventListener('resize',redraw);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(redraw);
 H.set=(old,nu,vals,lab)=>{H.old=old;H.nu=nu;H.vals=vals||{};if(lab)H.lab=lab;H.res=null;H.hl=null;draw();return H;};
 H.decode=()=>{H.res={b:resolve(H.old,H.nu,val,o.mode),f:resolve(H.nu,H.old,val,o.mode)};draw();return H.res;};
 H.show=d=>{H.dir=d;draw();};
 H.focus=ids=>{H.hl=ids;draw();};
 H.note=html=>{L.$('#'+ID+'-n').innerHTML=html;};
 return H;
}

  id:'0008', title:'Encoding formats and schema evolution', minutes:24, icon:'layers',
  goals:['Tell backward from forward compatibility, and say why a rollout needs both','See where the bytes go in JSON, MessagePack, Thrift, Protocol Buffers and Avro','Change a field-tag or Avro schema without breaking old or new code'],
  parts:['Old and new','Text and bytes','Field tags','Avro and schemas'],
  read:'Read chapter 4 of the book, from the start to the end of “The Merits of Schemas”, for the byte-by-byte figures of each format.',
  glossary:{
    'rolling-upgrade':'Rolling upgrade: updating a system one machine at a time, so the whole system never has to go down.',
    'backward-compat':'Backward compatibility: newer code can read data that was written by older code.',
    'forward-compat':'Forward compatibility: older code can read data that was written by newer code, by ignoring the parts it doesn’t know.',
    'encoding':'Encoding: turning data held in memory (objects, lists, pointers) into a self-contained sequence of bytes that can be saved or sent over the network. Also called serialization or marshalling. Decoding is the reverse.',
    'field-tag':'Field tag: a number that stands in for a field’s name in Thrift and Protocol Buffers. The encoded bytes carry the tag, never the name.',
    'varint':'Variable-length integer: a way of writing numbers where small numbers take fewer bytes and big numbers take more.',
    'writers-schema':'Writer’s schema: in Avro, the version of the schema a program used when it encoded the data.',
    'readers-schema':'Reader’s schema: in Avro, the version of the schema the reading program expects. It only has to be compatible with the writer’s schema, not identical.'
  },
  cheatsheet:[
    'Old and new code, and old and new data, live side by side (rolling upgrades, users who don’t update). You need <b>backward</b> (new code reads old data) and <b>forward</b> (old code reads new data) compatibility.',
    '<b>Encoding</b> = in-memory objects to a self-contained run of bytes; <b>decoding</b> = back again. Pointers mean nothing to another process.',
    'Your language’s <b>built-in encoding</b> locks you in, invites security holes, ignores versioning and is often slow. Only for very short-lived data.',
    '<b>JSON, XML, CSV</b>: readable and everywhere, but vague about numbers (above 2<sup>53</sup>) and binary data (Base64, +33%). Fine for exchange between organizations.',
    '<b>Binary JSON</b> still spells out every field name (the book’s record: 81 → 66 bytes). Schemas drop the names: Thrift Compact 34, Protocol Buffers 33, Avro 32.',
    '<b>Thrift and Protocol Buffers</b>: field tags. Rename freely; never change or reuse a tag; new fields optional or with a default; remove only optional fields.',
    '<b>Avro</b>: no tags. The reader resolves the <b>writer’s schema</b> against its <b>reader’s schema</b> by name. Add or remove only fields with a default. The writer’s schema lives in the file header, as a version number per record, or is agreed per connection.',
    'Schemas give you compact data, documentation that can’t go stale, compatibility checks before deploy, and type-checked generated code.'
  ],

    L.$('#cm-'+j).innerHTML='<b>'+(j===1?'Backward':j===2?'Forward':'Same')+'</b>'+L.$('#cm-'+j).innerHTML.replace(/^<b>.*?<\/b>/,'');
    L.$('#cm-c').innerHTML='<span class="stp">'+C[j][0]+'</span>'+C[j][1];seen.add(j);
    if(seen.has(1)&&seen.has(2)&&!seen.has('x')){seen.add('x');L.sheet('info','Name it from the reader’s side','<b>Backward</b>: the new reader looks back at older data. <b>Forward</b>: an old reader meets data from the future. A rollout needs both, because both squares light up at once.');L.done();}};});}},

{part:0,src:'Chapter 4 · Encoding and Evolution',pts:5,run(L){
  L.h(L.kick('pr','Which direction?')+'<h1 class="q">For each situation, which kind of compatibility is needed?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Backward','Forward'],[
   ['Ravi’s phone updates to v43, then sends the scans it saved offline while it was still v42.',0,'The v43 app reads data its own older version wrote: new code, old data.'],
   ['Amara’s v42 app downloads a route list from a server that has added a new field to it.',1,'Old app code reads data written by newer server code.'],
   ['An upgraded ingest server reads scans from phones still on old app versions.',0,'New server code reads data written by older app code.'],
   ['Halfway through the rollout, a server not yet upgraded reads a scan written by v43.',1,'Old server code meets data from a newer version.'],
   ['Linh’s new report job reads a parcels export file written last year.',0,'Today’s code reads data written by last year’s code.']],
   'Ask two questions: which code is reading, and which code wrote the data? New reading old is backward; old reading new is forward.');}},

{part:1,src:'Chapter 4 · Formats for Encoding Data',
 solve:async L=>{L.$('#ts-a').click();await L.sleep(30);L.$('#ts-b').click();},
 run(L){
  const bx=(x,y,w,h,c,lines)=>'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="9" style="fill:var(--'+c+'-bg);stroke:var(--'+c+');stroke-width:2"/>'+lines.map((t,j)=>'<text x="'+(x+9)+'" y="'+(y+17+j*15)+'" style="font-size:12px;'+(j?'':'font-weight:700;')+'fill:var(--ink)">'+t+'</text>').join('');
  const mem=(y,addr)=>bx(6,y,150,56,'h1',['scan','code  OP-48213','courier  ●'])+bx(196,y+6,118,44,'h2',['courier @'+addr,'id  C-0017'])+
   '<path d="M84 '+(y+43)+' C150 '+(y+43)+' 160 '+(y+28)+' 194 '+(y+28)+'" style="stroke:var(--ink);stroke-width:2;fill:none"/><path d="M188 '+(y+23)+' L195 '+(y+28)+' L188 '+(y+33)+'" style="stroke:var(--ink);stroke-width:2;fill:none"/>';
  L.h(L.kick('learn','Encoding')+'<h1 class="q">Data lives in two shapes</h1>'+
   '<svg class="e8svg" viewBox="0 0 320 244" role="img" aria-label="Objects linked by a pointer in the phone’s memory, encoded to a run of bytes, then decoded into new objects on the server">'+
   '<text x="4" y="12" style="font-size:12px;font-weight:600;fill:var(--muted)">Ravi’s phone · memory</text>'+mem(18,'0x7f3a')+
   '<g id="ts-g1" style="opacity:.22;transition:opacity .5s"><text x="160" y="92" style="font-size:12px;font-weight:700;text-anchor:middle;fill:var(--h3)">↓ encode</text>'+
   '<rect x="6" y="98" width="308" height="28" rx="6" style="fill:var(--h3-bg);stroke:var(--h3);stroke-width:2"/>'+
   '<text x="12" y="116.5" textLength="296" lengthAdjust="spacingAndGlyphs" style="font:600 11.5px ui-monospace,Menlo,monospace;fill:var(--ink)">{"code":"OP-48213","courier":{"id":"C-0017"}}</text>'+
   '<text x="160" y="141" style="font-size:11.5px;text-anchor:middle;fill:var(--muted)">one self-contained run of bytes (JSON here)</text></g>'+
   '<g id="ts-g2" style="opacity:.22;transition:opacity .5s"><text x="160" y="161" style="font-size:12px;font-weight:700;text-anchor:middle;fill:var(--h2)">↓ decode · server memory, rebuilt</text>'+mem(170,'0x2c91')+'</g></svg>'+
   '<div class="e8row"><button class="btn pri" id="ts-a">Encode it</button><button class="btn" id="ts-b" disabled>Send and decode</button></div>'+
   L.prose('In memory, objects point at each other by address. An address means nothing to another process. So '+L.g('encoding','<b>encoding</b>')+' (serialization) copies everything into one run of bytes, and <b>decoding</b> (parsing) rebuilds the objects.')+CSS);
  L.$('#ts-a').onclick=()=>{L.$('#ts-g1').style.opacity=1;L.$('#ts-a').disabled=true;L.$('#ts-b').disabled=false;L.$('#ts-b').classList.add('pri');};
  L.$('#ts-b').onclick=()=>{L.$('#ts-g2').style.opacity=1;L.$('#ts-b').disabled=true;
   L.sheet('info','New objects, new addresses','The server’s copy has the same data at a different address. The book says “encoding” because “serialization” means something quite different for transactions (chapter 7). And encoding has nothing to do with encryption.');L.done();};}},

{part:1,src:'Chapter 4 · Language-Specific Formats',
 solve:async L=>{for(let j=0;j<4;j++){L.$('#bi-'+j).click();await L.sleep(40);}for(let k=0;k<60&&!L.$('#bi-done');k++)await L.sleep(30);},
 run(L){
  const D=[['Route tool (Python)','✗ can’t read the bytes','Read it in Python','<b>Locked to one language.</b> Reading the bytes from another language is very hard, so a Python route tool, or a partner company, is shut out.'],
   ['Ingest server','✗ attacker’s code runs','Feed it crafted bytes','<b>A security hole.</b> To rebuild objects, the decoder may create any class it’s told to. Crafted bytes can make it run an attacker’s code.'],
   ['App v44, new class','✗ no plan for versions','Read it in a newer version','<b>Versioning is an afterthought.</b> These libraries are built for quick saving, and often ignore forward and backward compatibility.'],
   ['Size and speed','✗ slow and bloated','Measure it','<b>Efficiency is an afterthought.</b> Encoding can be slow and bulky. Java’s own built-in encoding has a bad reputation for this.']];
  const seen=new Set();
  let svg='<rect x="4" y="80" width="114" height="78" rx="10" style="fill:var(--h3-bg);stroke:var(--h3);stroke-width:2"/><text x="61" y="104" style="font-size:13.5px;font-weight:700;text-anchor:middle;fill:var(--ink)">Courier app</text><text x="61" y="124" style="font-size:13px;text-anchor:middle;fill:var(--ink)">offline queue,</text><text x="61" y="142" style="font-size:13px;text-anchor:middle;fill:var(--ink)">Java built-in</text><g id="bi-dots"></g>';
  D.forEach((d,j)=>{const y=6+j*60;svg+='<path d="M118 119 C142 119 138 '+(y+25)+' 160 '+(y+25)+'" style="stroke:var(--line2);stroke-width:2;fill:none" id="bi-l'+j+'"/>'+
   '<rect id="bi-r'+j+'" x="160" y="'+y+'" width="156" height="50" rx="9" style="fill:var(--card);stroke:var(--line2);stroke-width:2"/><text x="169" y="'+(y+21)+'" style="font-size:13px;font-weight:700;fill:var(--ink)">'+d[0]+'</text><text id="bi-t'+j+'" x="169" y="'+(y+39)+'" style="font-size:12.5px;fill:var(--faint)">?</text>';});
  L.h(L.kick('learn','The built-in shortcut')+'<h1 class="q">Tobias saves the offline scan queue with Java’s own encoder. Send it four places.</h1>'+
   '<svg class="e8svg" viewBox="0 0 320 244" role="img" aria-label="Java-encoded bytes sent to four destinations">'+svg+'</svg>'+
   '<div class="e8row" id="bi-b" style="display:grid;grid-template-columns:1fr 1fr"></div><div class="e8cap" id="bi-c" aria-live="polite">Java’s Serializable, Python’s pickle and Ruby’s Marshal save objects with almost no code. Tap each button to see the catch.</div>'+CSS);
  D.forEach((d,j)=>{const b=document.createElement('button');b.className='btn';b.id='bi-'+j;b.style.justifyContent='center';b.textContent=d[2];
   b.onclick=()=>{if(seen.has(j))return;seen.add(j);b.disabled=true;
    const c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('r','6');c.setAttribute('style','fill:var(--h3)');L.$('#bi-dots').appendChild(c);
    const p=L.$('#bi-l'+j),len=p.getTotalLength(),t0=performance.now();
    (function step(){if(!c.isConnected)return;const f=Math.min(1,(performance.now()-t0)/450),pt=p.getPointAtLength(len*f);c.setAttribute('cx',pt.x);c.setAttribute('cy',pt.y);
     if(f<1){requestAnimationFrame(step);return;}c.remove();
     L.$('#bi-r'+j).setAttribute('style','fill:var(--no-bg);stroke:var(--no);stroke-width:2');const t=L.$('#bi-t'+j);t.textContent=d[1];t.setAttribute('style','font-size:12.5px;font-weight:600;fill:var(--no)');
     L.$('#bi-c').innerHTML=d[3];
     if(seen.size===4&&!L.$('#bi-done')){L.$('#bi-c').insertAdjacentHTML('afterend','<span id="bi-done"></span>');
      L.sheet('info','Handy, but only for short-lived data','Built-in encodings lock you into one language, open a security hole, neglect compatibility and are often slow. The book’s advice: use your language’s built-in encoding only for very transient purposes, never for data you store or send between systems.');L.done();}})();};
   L.$('#bi-b').appendChild(b);});}},

{part:1,src:'Chapter 4 · JSON, XML, and Binary Variants',
 solve:async L=>{L.$('#tl-t0').click();for(let k=0;k<5;k++){L.$('#tl-up').click();await L.sleep(10);}L.$('#tl-t1').click();const r=L.$('#tl-kb');r.value=210;r.dispatchEvent(new Event('input'));L.$('#tl-t2').click();L.$('#tl-pz').children[1].click();},
 run(L){
  const seen=[0,0,0],TAB=['Big number','Raw bytes','CSV comma'];let tab=0,id=9007199254740989n,dual=false,kb=60,naive=false;
  L.h(L.kick('ex','Edge cases')+'<h1 class="q">Break JSON and CSV three ways</h1><div class="e8row" id="tl-tabs" role="tablist"></div><div id="tl-p"></div>'+tasks('tl-k',['A parcel ID that changes on the way','A photo that grows as text','An address that splits in two'])+CSS);
  TAB.forEach((t,j)=>{const b=document.createElement('button');b.className='chip';b.id='tl-t'+j;b.textContent=t;b.onclick=()=>{tab=j;draw();};L.$('#tl-tabs').appendChild(b);});
  function mark(j){if(seen[j])return;seen[j]=1;tick(L,'tl-k',j);
   if(seen.every(Boolean)){L.sheet('info','Flawed, and still everywhere','JSON, XML and CSV do the job in many cases, especially sending data <b>between organizations</b>. There, getting everyone to agree on a format matters more than how pretty or efficient it is. Twitter’s fix for big IDs: send each one twice, as a number and as a string.');L.done();}}
  function draw(){[...L.$('#tl-tabs').children].forEach((b,j)=>b.classList.toggle('sel',j===tab));const p=L.$('#tl-p');
   if(tab===0){const s=id.toString(),js=String(Number(s)),bad=js!==s;
    let g='';for(let d=-4;d<=6;d++){const v=9007199254740992n+BigInt(d),x=16+(d+4)*28.8,b2=String(Number(v.toString()))!==v.toString(),cur=v===id;
     g+='<line x1="'+x+'" y1="22" x2="'+x+'" y2="40" style="stroke:var(--'+(b2?'no':'ok-strong')+');stroke-width:'+(cur?4:2)+'"/><text x="'+x+'" y="54" style="font-size:11px;text-anchor:middle;fill:var(--'+(cur?'ink':'muted')+');font-weight:'+(cur?700:400)+'">'+(d===0?'2⁵³':(d>0?'+':'−')+Math.abs(d))+'</text>'+(cur?'<path d="M'+(x-6)+' 10 L'+(x+6)+' 10 L'+x+' 19z" style="fill:var(--ink)"/>':'');}
    p.innerHTML='<svg class="e8svg" viewBox="0 0 320 64" role="img" aria-label="Whole numbers around 2 to the 53rd; green survive, red change">'+g+'<text x="320" y="8" style="font-size:11px;text-anchor:end;fill:var(--muted)">green: exact · red: rounded</text></svg>'+
     '<div class="e8nr"><span>Otterpost sends</span><b>'+s+'</b></div><div class="e8nr '+(bad?'bad':'good')+'"><span>JavaScript reads</span><b>'+js+(bad?' ✗':' ✓')+'</b></div>'+(dual?'<div class="e8nr good"><span>…and as a string</span><b>"'+s+'" ✓</b></div>':'')+
     '<div class="e8row"><button class="btn" id="tl-dn" aria-label="Parcel ID minus one">−1</button><button class="btn" id="tl-up" aria-label="Parcel ID plus one">+1</button><button class="chip'+(dual?' sel':'')+'" id="tl-du">Also send it as a string</button></div>'+
     '<p class="small">JSON doesn’t say whether a number is whole, or how precise it is. JavaScript reads it as floating point, exact only up to 2⁵³. XML and CSV can’t even tell 42 from “42” without a schema.</p>';
    L.$('#tl-up').onclick=()=>{id+=1n;draw();};L.$('#tl-dn').onclick=()=>{id-=1n;draw();};L.$('#tl-du').onclick=()=>{dual=!dual;draw();};
    if(bad)mark(0);}
   else if(tab===1){
    p.innerHTML='<div class="e8rng"><label for="tl-kb">Signature photo</label><input type="range" id="tl-kb" min="10" max="300" step="10" value="'+kb+'"></div>'+
     '<div class="e8kb"><span>Raw bytes</span><span class="e8tr"><span class="e8fl" id="tl-f1" style="transition:none"></span></span><b id="tl-n1"></b></div>'+
     '<div class="e8kb"><span>Base64 text inside JSON</span><span class="e8tr"><span class="e8fl" id="tl-f2" style="background:var(--h4);transition:none"></span></span><b id="tl-n2"></b></div>'+
     '<p class="small">JSON and XML handle text well but have no type for raw bytes. The usual workaround writes them as Base64 text: hacky, and <b>33% bigger</b>.</p>';
    const upd=()=>{const b64=Math.ceil(kb*1024/3)*4/1024;L.$('#tl-f1').style.width=(kb/400*100)+'%';L.$('#tl-n1').textContent=kb+' KB';L.$('#tl-f2').style.width=(b64/400*100)+'%';L.$('#tl-n2').textContent=Math.round(b64)+' KB';};
    L.$('#tl-kb').oninput=e=>{kb=+e.target.value;upd();mark(1);};upd();}
   else{const line='OP-48213,Mrs. Okoro,"Flat 2, 14 Mill Lane",W2';
    const cells=naive?line.split(','):['OP-48213','Mrs. Okoro','Flat 2, 14 Mill Lane','W2'];
    p.innerHTML='<div class="e8lbl">One row of Linh’s export file</div><div class="e8csv">'+L.esc(line)+'</div><div class="e8lbl">The parser</div><div class="e8row" id="tl-pz"><button class="chip'+(naive?'':' sel')+'">Follows the escaping rules</button><button class="chip'+(naive?' sel':'')+'">Splits on every comma</button></div>'+
     '<div class="e8tb"><div class="hd">code</div><div class="hd">recipient</div><div class="hd">address</div><div class="hd">zone</div>'+cells.slice(0,4).map((c,j)=>'<div class="'+(naive&&j>1?'bad':'')+'">'+L.esc(c)+'</div>').join('')+'</div>'+
     (naive?'<p class="small" style="color:var(--no)">5 values for 4 columns: “'+L.esc(cells[4])+'” has nowhere to go, and the zone is wrong.</p>':'')+
     '<p class="small">CSV has no schema: the app decides what each column means. Commas and line breaks inside values need escaping rules, and not every parser follows them.</p>';
    const z=L.$('#tl-pz').children;z[0].onclick=()=>{naive=false;draw();};z[1].onclick=()=>{naive=true;draw();mark(2);};}}
  draw();}},

{part:1,src:'Chapter 4 · Binary encoding',pts:1,
 solve:async L=>{L.$('#pp').children[1].click();await wait(L,'#pp-done',120);},
 run(L){
  let p=null;
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">Tobias wants smaller scan events. Which switch shrinks a record more?</h1><p class="small" style="margin-top:-4px">Scan events never leave Otterpost, so the team can pick any format. For small data the gain is tiny; at terabytes it matters.</p><div class="e8row" id="pp" style="display:grid;grid-template-columns:1fr 1fr"></div>'+
   '<div class="e8bars" id="pp-b"></div><div id="pp-x"></div>'+CSS);
  const O=[['Binary JSON','MessagePack: same data model, packed as binary'],['A schema with field tags','Each field gets a number; names stay in the schema']];
  O.forEach((x,j)=>{const b=document.createElement('button');b.className='chip e8pk';b.innerHTML='<b>'+x[0]+'</b><small>'+x[1]+'</small>';b.onclick=()=>{if(p!==null)return;p=j;b.classList.add('sel');run();};L.$('#pp').appendChild(b);});
  const R=FMTS.map(f=>{const s=f[2](REC.book.F);return [f[1],sizeOf(s),namesOf(s)];});
  L.$('#pp-b').innerHTML='<div class="e8bh">The book’s sample record (a name, a number, two interests) · pink = field names</div>'+R.map((r,j)=>'<div class="e8bar" style="cursor:default"><span>'+r[0]+'</span><span class="e8tr"><span class="e8fl" id="pp-f'+j+'" style="width:0;transition-delay:'+(j*.28)+'s"><span class="e8nm" style="width:'+(r[2]/r[1]*100).toFixed(1)+'%"></span></span></span><b id="pp-n'+j+'">?</b></div>').join('');
  function run(){R.forEach((r,j)=>{L.$('#pp-f'+j).style.width=(r[1]/81*100).toFixed(1)+'%';setTimeout(()=>{const n=L.$('#pp-n'+j);if(n)n.textContent=r[1]+' B';},j*280+450);});
   setTimeout(()=>{if(!L.$('#pp-x'))return;L.award(p===1);L.$('#pp-x').innerHTML='<span id="pp-done"></span>';
    L.sheet(p===1?'ok':'no',p===1?'Right: drop the names':'The tags win by far','Binary JSON only went from 81 to 66 bytes, because every field name is still inside (the pink). The book doubts that’s worth losing readability. Formats with a schema leave the names out: Thrift’s CompactProtocol 34 bytes, Protocol Buffers 33, Avro 32. Next, look inside the bytes yourself.');L.done();},R.length*280+700);}}},

{part:1,src:'Chapter 4 · Thrift and Protocol Buffers',
 solve:async L=>{const f=L.$('#ex-fmt').children;f[1].click();f[4].click();f[5].click();L.$('#ex-nx').click();L.$('#ex-nx').click();L.$('#ex-rec').children[1].click();},
 run(L){

{part:1,src:'Chapter 4 · Language-Specific Formats',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Name the problem',['Locked to one language','A security hole','Numbers lose precision','Bytes need Base64','CSV escaping breaks'],[
   ['The Android app saves its offline scan queue with Java’s built-in serializer. The new route tool, written in Python, can’t read it.',0,'Built-in encodings tie the data to one programming language.'],
   ['The ingest server decodes whatever bytes a phone sends with its language’s built-in object decoder. Someone sends crafted bytes.',1,'Built-in decoders can create arbitrary classes, which attackers can use to run their own code.'],

{part:2,src:'Chapter 4 · Thrift and Protocol Buffers',run(L){
  L.h(L.kick('learn','Field tags')+'<h1 class="q">The bytes carry a number, never the name</h1>'+
   '<div class="e8sch"><div class="e8sh">Scan event schema (Protocol Buffers, v42)</div>'+V42.map(f=>'<div class="e8sr" id="ft-'+f.tag+'"><span class="e8tg">'+f.tag+'</span><span>'+(f.rule==='req'?'required':'optional')+' '+f.t+' <b>'+f.n+'</b></span></div>').join('')+'<div class="e8sh" style="margin:4px 0 0;font-weight:600">“required” never reaches the bytes. It only adds a runtime check.</div></div><div id="ft"></div>'+

{part:2,src:'Chapter 4 · Thrift and Protocol Buffers',
 solve:async L=>{const p=L.$('#vi-p').children;p[0].click();p[2].click();p[5].click();},
 run(L){
  const PR=[63,64,1337,2500,8191,8192,-64,-65],got=new Set();let live=false;
  L.h(L.kick('ex','Variable-length integers')+'<h1 class="q">How many bytes does a number need?</h1>'+
   '<div class="e8rng"><label for="vi-r">Number</label><input type="range" id="vi-r" min="-9000" max="9000" step="1" value="2500"></div>'+
   '<div class="e8row" id="vi-p"></div><div class="e8big" id="vi-v" aria-live="polite"></div>'+
   '<div class="e8lbl">Thrift BinaryProtocol: always 8 bytes</div><div class="e8bytes" id="vi-8"></div>'+
   '<div class="e8lbl" id="vi-cl"></div><div class="e8bytes" id="vi-c"></div>'+
   L.prose('Thrift’s CompactProtocol writes a number in as few bytes as it needs. The top bit of each byte (amber) says “more bytes follow”. −64 to 63 fit in one byte, −8192 to 8191 in two. A '+L.g('varint','variable-length integer')+'.')+
   tasks('vi-k',['Find a 1-byte number','Find a 2-byte number','Find a 3-byte number'])+CSS);
  function draw(v){L.$('#vi-v').textContent=v.toLocaleString('en-US');
   let x=BigInt.asUintN(64,BigInt(v)),b8=[];for(let k=0;k<8;k++){b8.unshift(Number(x&255n));x>>=8n;}
   L.$('#vi-8').innerHTML=b8.map(b=>'<span class="e8by g">'+hex(b)+'</span>').join('');
   const c=uvar(zz(v));L.$('#vi-cl').textContent='Thrift CompactProtocol: '+c.length+' byte'+(c.length>1?'s':'');
   L.$('#vi-c').innerHTML=c.map(b=>{const s=b.toString(2).padStart(8,'0');return '<span class="e8by"><i>'+s[0]+'</i>'+s.slice(1)+'</span>';}).join('');
   if(!live)return;got.add(c.length);if(got.has(1))tick(L,'vi-k',0);if(got.has(2))tick(L,'vi-k',1);if(got.has(3))tick(L,'vi-k',2);
   if(got.has(1)&&got.has(2)&&got.has(3)&&!L.$('#vi-done')){L.$('#vi-k').insertAdjacentHTML('afterend','<span id="vi-done"></span>');
    L.sheet('info','Small numbers, small bytes','The book’s 1337 takes 2 bytes instead of 8. Protocol Buffers packs numbers in a very similar way. Bigger numbers simply use more bytes.');L.done();}}
  PR.forEach(v=>{const b=document.createElement('button');b.className='chip';b.textContent=v.toLocaleString('en-US').replace('-','−');b.onclick=()=>{L.$('#vi-r').value=v;draw(v);};L.$('#vi-p').appendChild(b);});
  L.$('#vi-r').oninput=e=>{live=true;draw(+e.target.value);};
  draw(2500);live=true;}},

{part:2,src:'Chapter 4 · Field tags and schema evolution',
 solve:async L=>{for(let k=0;k<3;k++){L.$('#hs-nx').click();await L.sleep(20);}},
 run(L){
  let k=0;
  const S=[
   ()=>{H.set(V42,[...V42,fx(T.left,{isNew:1})],VALS,{old:'v42',nu:'v43'});H.decode();H.show('f');
     return ['Old code, new data','A v42 server reads Ravi’s v43 scan. Tag 5 is unknown, so it’s <b>skipped</b>. The type annotation tells the parser how many bytes to skip. Forward compatible.'];},
   ()=>{H.show('b');return ['New code, old data','A v43 server reads Amara’s v42 scan. Tags keep their meaning, so everything reads. <code>leftWith</code> is missing, so it’s simply left empty. Backward compatible.'];},
   ()=>{H.set(V42,[...V42,fx(T.left,{rule:'req',isNew:1})],VALS,{old:'v42',nu:'v43'});H.decode();H.show('b');
     return ['What if leftWith were required?','Then every old scan fails the required check. So every field added after the first release must be <b>optional</b> or have a <b>default</b>.'];},
   ()=>{H.set(V43,[T.track,T.status,T.courier,T.left],VALS,{old:'v43',nu:'v44'});H.decode();H.show('f');
     return ['Removing a field','Otterpost drops cash on delivery, so v44 removes <code>codCents</code>. Old code just finds it missing. That only works because it was optional, and tag 4 must never be used again.'];}];
  L.h(L.kick('ex','Schema evolution')+'<h1 class="q">Old and new code meet on the field tags</h1><div id="hs"></div>'+

{part:2,src:'Chapter 4 · Field tags and schema evolution',pts:1,

{part:2,src:'Chapter 4 · Datatypes and schema evolution',
 solve:async L=>{const c=L.$('#lb-p').children;for(let j=0;j<4;j++){c[j].click();await L.sleep(20);}},
 run(L){
  const P=[
   ['Add a required field',V43,[...V43,{id:'weight',tag:6,n:'weightGrams',t:'int64',rule:'req',isNew:1}],'b','Backward breaks: old data never had tag 6, so the required check fails. Old code skips tag 6, so forward is fine.'],
   ['Reuse a removed tag',V43,[T.track,T.status,T.courier,{id:'weight',tag:4,n:'weightGrams',t:'int64',rule:'opt',isNew:1},T.left],'b','Both directions misread, silently: cents become grams and grams become cents. Old data with tag 4 is still out there, so the tag is retired for good.'],
   ['Remove a required field',V43,[T.status,T.courier,T.cod,T.left],'f','New code skips tag 1 in old data. But old code still requires <code>trackingCode</code> and fails on every new record. A required field can never be removed.'],
   ['Rename a field',V43,[T.track,fx(T.status,{n:'scanType'}),T.courier,T.cod,T.left],'b','Both fine. The bytes carry tag 2, never the name, so the name is free to change.'],
   ['int32 → int64',[T.track,{id:'pid',tag:6,n:'parcelId',t:'int32',rule:'opt',v:48213}],[T.track,{id:'pid',tag:6,n:'parcelId',t:'int64',rule:'opt',v:3000000000,isNew:1}],'f','New code fills the missing bits with zeros. Old code still holds the value in 32 bits, so a big new ID is cut down to a wrong number. Check the docs before changing a type.'],
   ['Optional → repeated',[T.track,T.courier],[T.track,{id:'courier',tag:3,n:'courierIds',t:'string',rule:'rep',v:['C-0017','C-0031'],isNew:1}],'f','Protocol Buffers only. A repeated field is the same tag written again for each item. New code sees old data as a list of one; old code sees only the last item. Thrift has a list type instead: no such change, but nested lists work.']];
  const seen=new Set();
  L.h(L.kick('ex','Limits')+'<h1 class="q">Push the field-tag rules to the edge. Try at least four changes.</h1><div class="e8row" id="lb-p"></div><div id="lb"></div>'+CSS);
  const H=Hand(L,L.$('#lb'),{id:'lbh'});
  P.forEach((x,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=x[0];b.onclick=()=>{selOne(L.$('#lb-p'),b);
    H.set(x[1],x[2],VALS,{old:'old code',nu:'new code'});const r=H.decode();H.show(!r.b.ok?'b':!r.f.ok?'f':x[3]);H.note('<div class="fb info">'+x[4]+'</div>');
    seen.add(j);b.classList.add('ok');
    if(seen.size>=4&&!L.$('#lb-done')){L.$('#lb-p').insertAdjacentHTML('afterend','<span id="lb-done"></span>');L.sheet('info','The tag is the field’s identity','Names can change; tags are forever. Added fields are optional or have a default. Only optional fields can be removed, and their tags are never reused. Type changes may lose precision.');L.done();}};
   L.$('#lb-p').appendChild(b);});
  H.set(V43,V43,VALS,{old:'old code',nu:'new code'});H.note('<p class="small">Pick a change above. The handshake decodes it both ways.</p>');}},

{part:2,src:'Chapter 4 · Field tags and schema evolution',pts:1,
 solve:async L=>{L.$('#cg-w1').click();L.$('#cg-r1').click();L.$('#cg-s0').click();L.$('#cg-go').click();await wait(L,'#cg-ok',60);},
 run(L){
  const st={w:0,r:0,s:1};let first=true;
  L.h(L.kick('pr','Challenge')+'<h1 class="q">Fix Tobias’s v44 draft so both badges go green</h1>'+
   '<p class="small" style="margin-top:-4px">v44 must add <code>weightGrams</code>, drop <code>codCents</code> and rename <code>status</code> to <code>scanType</code>.</p>'+
   '<div class="e8lbl">weightGrams gets tag</div><div class="e8row"><button class="chip" id="cg-w0">4 (now free)</button><button class="chip" id="cg-w1">6 (never used)</button></div>'+
   '<div class="e8lbl">weightGrams is</div><div class="e8row"><button class="chip" id="cg-r0">required</button><button class="chip" id="cg-r1">optional</button></div>'+
   '<div class="e8lbl">scanType (was status) gets tag</div><div class="e8row"><button class="chip" id="cg-s0">2 (keep it)</button><button class="chip" id="cg-s1">7 (new name, new tag)</button></div>'+
   '<div id="cg"></div><button class="btn pri" id="cg-go" style="margin-top:10px">Decode both ways</button>'+CSS);
  const H=Hand(L,L.$('#cg'),{id:'cgh'});
  function build(){['w','r','s'].forEach(g=>[0,1].forEach(j=>L.$('#cg-'+g+j).classList.toggle('sel',st[g]===j)));
   const nu=[T.track,fx(T.status,{n:'scanType',tag:st.s?7:2,isNew:st.s}),T.courier,T.left,{id:'weight',tag:st.w?6:4,n:'weightGrams',t:'int64',rule:st.r?'opt':'req',isNew:1}].sort((a,b)=>a.tag-b.tag);
   H.set(V43,nu,VALS,{old:'v43',nu:'v44 draft'});}
  ['w','r','s'].forEach(g=>[0,1].forEach(j=>L.$('#cg-'+g+j).onclick=()=>{st[g]=j;build();}));
  L.$('#cg-go').onclick=()=>{const r=H.decode(),ok=r.b.ok&&r.f.ok;H.show(!r.b.ok?'b':!r.f.ok?'f':'b');
   if(first){L.award(ok);first=false;}
   if(ok){L.$('#cg-go').disabled=true;L.$('#cg-go').insertAdjacentHTML('afterend','<span id="cg-ok"></span>');
    L.sheet('ok','Both directions work','A brand-new tag (6) for weightGrams, optional, so old scans without it still read. scanType keeps tag 2, because a rename never touches the bytes. codCents is gone, and its tag 4 is retired.');L.done();}
   else L.sheet('no','Still red','Tap the red badge to see which field fails. Reused tags misread silently, required new fields break old data, and a new tag for a renamed field loses its old values.');};
  build();}},

{part:3,src:'Chapter 4 · Avro',
 solve:async L=>{const c=L.$('#aw-p').children;c[1].click();c[2].click();},
 run(L){
  const SC=[['The writer’s exact schema',[{n:'trackingCode',t:'string'},{n:'status',t:'string'},{n:'courierId',t:'string'},{n:'codCents',u:['null','long']}]],
   ['status and courierId swapped',[{n:'trackingCode',t:'string'},{n:'courierId',t:'string'},{n:'status',t:'string'},{n:'codCents',u:['null','long']}]],
   ['weightGrams added before codCents',[{n:'trackingCode',t:'string'},{n:'status',t:'string'},{n:'courierId',t:'string'},{n:'weightGrams',t:'long'},{n:'codCents',u:['null','long']}]]];
  const tried=new Set(),TRUE={};REC.ravi.F.forEach(f=>TRUE[f.n]=f.v);
  L.h(L.kick('learn','Avro')+'<h1 class="q">No tags, no names: just values in a row</h1><div id="aw"></div>'+
   '<div class="e8lbl">Decode these bytes with</div><div class="e8row" id="aw-p"></div><div class="e8out" id="aw-o" aria-live="polite"></div>'+
   L.prose('Avro (2009, from Hadoop) has a schema but no tag numbers. Nothing in the bytes says which field comes next, or its type. You walk the schema in order, so you need the <b>exact</b> schema the writer used.')+CSS);
  const I=Insp(L,L.$('#aw'),{id:'awi',fmt:'av',recs:['ravi'],fmts:['av'],bars:false,leg:'<div class="e8leg">Ravi’s scan as Avro bytes. Colours: which field the reader assigns each byte to.</div>'});
  function dec(bytes,schema){let p=0;const out=[];
   const rv=()=>{let n=0,m=1,b;do{if(p>=bytes.length)throw new Error('ran out of bytes');b=bytes[p++];n+=(b&127)*m;m*=128;}while(b&128);return n;};
   const rd=t=>{if(t==='null')return null;if(t==='long')return unzz(rv());const len=unzz(rv());if(len<0||p+len>bytes.length)throw new Error('length '+len+' runs past the end');const s=String.fromCharCode(...bytes.slice(p,p+len));p+=len;return s;};
   for(const f of schema){const s0=p;try{let v;if(f.u){const i=unzz(rv());if(i<0||i>=f.u.length)throw new Error('union branch '+i+' doesn’t exist');v=rd(f.u[i]);}else v=rd(f.t);out.push({n:f.n,v,a:s0,b:p});}
    catch(e){out.push({n:f.n,err:e.message,a:s0,b:Math.max(p,s0+1)});break;}}
   return out;}
  SC.forEach((s,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=s[0];b.onclick=()=>{selOne(L.$('#aw-p'),b);tried.add(j);
    const out=dec(I.bytes(),s[1]),C=['pp0','pp1','pp2','pp3'];
    I.paint(out.map((x,k)=>[x.a,x.b,x.err?'ppx':C[k%4]]));
    L.$('#aw-o').innerHTML=out.map((x,k)=>{const ok=!x.err&&x.n in TRUE&&TRUE[x.n]===x.v;
     return '<div class="e8o '+(ok?'ok':'bad')+'"><i class="e8c '+(x.err?'ppx':C[k%4])+'" style="width:12px;height:12px;border-bottom-width:2px"></i><b>'+x.n+'</b><span>'+(x.err?'✗ error: '+x.err:(ok?'✓ ':'✗ ')+show(x.v)+(ok?'':x.n in TRUE?' (wrong!)':' (never written)'))+'</span></div>';}).join('');
    if(tried.has(1)&&tried.has(2)&&!L.$('#aw-done')){L.$('#aw-o').insertAdjacentHTML('afterend','<span id="aw-done"></span>');
     L.sheet('info','Wrong schema, wrong data','Swapped fields read silently wrong. An extra field steals the next bytes, and the rest falls apart. That’s why Avro’s reader must also know the writer’s schema. Avro’s reward: the book’s record takes just 32 bytes, the smallest of all.');L.done();}};
   L.$('#aw-p').appendChild(b);});
  L.$('#aw-p').children[0].click();}},

{part:3,src:'Chapter 4 · The writer’s schema and the reader’s schema',
 solve:async L=>{for(let k=0;k<2;k++){L.$('#ar-nx').click();await L.sleep(20);}},
 run(L){
  let k=0;
  const S=[[['track','status'],'Order differs','The writer put <code>status</code> first, the reader expects <code>trackingCode</code> first. No problem: Avro matches fields <b>by name</b>.'],
   [['note'],'Writer only','<code>courierNote</code> is in the '+L.g('writers-schema','writer’s schema')+' but not the reader’s, so it’s <b>ignored</b>.'],
   [['slot'],'Reader only','<code>timeSlot</code> is in the '+L.g('readers-schema','reader’s schema')+' only, so it’s <b>filled with the reader’s default</b>: null.']];
  L.h(L.kick('ex','Writer’s and reader’s schema')+'<h1 class="q">Linh’s ETA job reads last year’s parcel file</h1><div id="ar"></div>'+
   '<div class="e8cap" id="ar-c" aria-live="polite"></div><button class="btn pri" id="ar-nx">Next ›</button>'+CSS);
  const H=Hand(L,L.$('#ar'),{id:'arh',mode:'avro',dirs:false});
  H.set([A.status,A.track,{id:'note',n:'courierNote',u:['null','string'],def:'null'}],[A.track,A.status,{id:'slot',n:'timeSlot',u:['null','string'],def:'null'}],
   {status:'delivered',track:'OP-31907',note:'ring twice'},{old:'last year’s export',nu:'today’s ETA job'});
  H.decode();
  function go(){H.focus(S[k][0]);L.$('#ar-c').innerHTML='<span class="stp">'+(k+1)+' of 3 · '+S[k][1]+'</span>'+S[k][2];
   if(k===2){L.$('#ar-nx').style.display='none';L.sheet('info','Compatible, not identical','The two schemas don’t have to match, only be compatible. The Avro library looks at both side by side and converts the data from the format the writer used into the one the reader expects.');L.done();}}
  L.$('#ar-nx').onclick=()=>{if(k<2){k++;go();}};go();}},

{part:3,src:'Chapter 4 · The writer’s schema and the reader’s schema',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">The reader’s schema has <code>weightGrams</code> with a default of 0. The writer’s schema has no such field. What does the reader get?</h1>');
  L.mc(L.card,['An error, because the two schemas differ','Whatever bytes come next in the record','The default from its own schema: 0'],2,
   'A field the reader expects but the writer never wrote is filled with the default from the reader’s schema.',
   'The schemas only need to be compatible, not equal, and Avro never guesses from leftover bytes. The missing field gets the reader’s default, 0.');}},

{part:3,src:'Chapter 4 · Schema evolution rules',pts:6,
 solve:async L=>{const ans=[0,2,1,1,1,3];for(let j=0;j<6;j++){await wait(L,'#av-q',40);L.$('#av-q').children[ans[j]].click();await L.sleep(20);const n=L.$('#av-nx');if(n)n.click();await L.sleep(20);}},
 run(L){
  const OPT=['Both ways','Backward only','Forward only','Neither'];
  const P=[
   ['Add weightGrams, default null',[...A43,{id:'weight',n:'weightGrams',u:['null','long'],def:'null',isNew:1}],0,'Old readers ignore it; new readers fill in null for old records. A field with a default is safe both ways.'],
   ['Add zoneCode, no default',[...A43,{id:'zone',n:'zoneCode',t:'string',isNew:1}],2,'Old readers just ignore it. But new readers find nothing to fill in when reading old data: backward breaks.'],
   ['Remove courierId (it had no default)',[A.track,A.status,A.left],1,'New readers ignore it in old data. Old readers still expect it in new data and have no default: forward breaks.'],
   ['Rename status → scanType, with alias “status”',[A.track,fx(A.status,{n:'scanType',alias:['status'],isNew:1}),A.courier,A.left],1,'The new reader finds the old name through the alias. Old readers don’t know the new name. Renames are backward compatible, not forward.'],
   ['leftWith may now be a locker number',[A.track,A.status,A.courier,fx(A.left,{u:['null','string','long'],v:117,isNew:1})],1,'Adding a branch to a union: new readers handle all three types, old readers can’t read a long. Backward, not forward.'],
   ['Add hubCode: string, default null',[...A43,{id:'hub',n:'hubCode',t:'string',def:'null',isNew:1}],3,'Null is only allowed if it’s a branch of a union. Avro is explicit about what can be null, which prevents bugs, so it has unions and defaults instead of optional and required.']];
  let k=0;
  L.h(L.kick('pr','Predict, then decode')+'<h1 class="q">Six changes to the Avro scan schema. Which reads still work?</h1>'+
   '<div class="e8cap" id="av-c"></div><div id="av-qw"></div><div id="av"></div><div id="av-x"></div>'+CSS);
  const H=Hand(L,L.$('#av'),{id:'avh',mode:'avro'});
  function show1(){const x=P[k];L.$('#av-c').innerHTML='<span class="stp">Change '+(k+1)+' of 6</span><b>'+x[0]+'</b>';L.$('#av-x').innerHTML='';
   H.set(A43,x[1],VALS,{old:'v43',nu:'v44'});
   L.$('#av-qw').innerHTML='<div class="e8row" id="av-q" role="group" aria-label="Your prediction"></div>';
   OPT.forEach((t,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=t;b.onclick=()=>pick(j,b);L.$('#av-q').appendChild(b);});}
  function pick(j,b){const x=P[k],ok=j===x[2];[...L.$('#av-q').children].forEach((c,i)=>{c.disabled=true;if(i===x[2])c.classList.add('ok');else if(c===b)c.classList.add('no');});
   L.award(ok);const r=H.decode();H.show(!r.b.ok?'b':!r.f.ok?'f':'b');
   const last=k===P.length-1;
   L.$('#av-x').innerHTML='<div class="fb '+(ok?'ok':'no')+'" style="margin-top:8px">'+(ok?'Right. ':'It’s '+OPT[x[2]].toLowerCase()+'. ')+x[3]+'</div>'+(last?'':'<button class="btn pri" id="av-nx" style="margin-top:10px">Next change ›</button>');
   if(last){L.sheet('info','Avro’s rules','Add or remove only fields that have a default. Renames (aliases) and new union branches work backward only. Null must be a branch of a union. Type changes work if Avro can convert the types.');L.done();}
   else L.$('#av-nx').onclick=()=>{k++;show1();};}
  show1();}},

{part:3,src:'Chapter 4 · But what is the writer’s schema?',run(L){
  const rec=(x,y,w,c,t)=>'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="22" rx="5" style="fill:var(--'+c+'-bg);stroke:var(--'+c+');stroke-width:1.5"/>'+(t?'<text x="'+(x+w/2)+'" y="'+(y+15)+'" style="font-size:11px;font-weight:700;text-anchor:middle;fill:var(--'+c+')">'+t+'</text>':'');
  let s='<text x="4" y="12" style="font-size:12.5px;font-weight:700;fill:var(--ink)">1 · A big file of similar records</text>'+rec(4,20,54,'h2','schema');
  for(let j=0;j<9;j++)s+=rec(62+j*28,20,24,'h1','');
  s+='<text x="4" y="58" style="font-size:11.5px;fill:var(--muted)">Written once at the start (Avro object container file)</text>';
  s+='<text x="4" y="86" style="font-size:12.5px;font-weight:700;fill:var(--ink)">2 · A database, records written over years</text>';
  [['v3',94],['v7',120],['v3',146]].forEach(r=>{s+=rec(4,r[1],30,'h2',r[0])+rec(38,r[1],140,'h1','');});
  s+='<rect x="196" y="100" width="120" height="62" rx="8" style="fill:var(--soft);stroke:var(--line2);stroke-width:1.5"/><text x="256" y="118" style="font-size:11.5px;font-weight:700;text-anchor:middle;fill:var(--ink)">schema versions</text><text x="256" y="136" style="font-size:11.5px;text-anchor:middle;fill:var(--h2)">v3 · v7</text><text x="256" y="152" style="font-size:11px;text-anchor:middle;fill:var(--muted)">kept in the database</text>'+
   '<path d="M180 131 H194" style="stroke:var(--line2);stroke-width:2;fill:none"/><text x="4" y="186" style="font-size:11.5px;fill:var(--muted)">Each record starts with its schema’s version number</text>';
  s+='<text x="4" y="214" style="font-size:12.5px;font-weight:700;fill:var(--ink)">3 · A network connection</text>'+
   '<rect x="4" y="224" width="70" height="36" rx="8" style="fill:var(--h3-bg);stroke:var(--h3);stroke-width:1.5"/><text x="39" y="246" style="font-size:12px;font-weight:700;text-anchor:middle;fill:var(--h3)">process</text>'+
   '<rect x="246" y="224" width="70" height="36" rx="8" style="fill:var(--h3-bg);stroke:var(--h3);stroke-width:1.5"/><text x="281" y="246" style="font-size:12px;font-weight:700;text-anchor:middle;fill:var(--h3)">process</text>'+
   '<path d="M78 233 H242" style="stroke:var(--h2);stroke-width:2;fill:none"/><text x="160" y="229" style="font-size:11px;font-weight:700;text-anchor:middle;fill:var(--h2)">agree on v7 when connecting</text>'+
   '<path d="M78 252 H242" style="stroke:var(--h1);stroke-width:2;stroke-dasharray:6 4;fill:none"/><text x="160" y="270" style="font-size:11px;text-anchor:middle;fill:var(--muted)">then records only, for the whole connection</text>';
  L.h(L.kick('learn','Where the writer’s schema lives')+'<h1 class="q">The reader has to find the writer’s schema</h1>'+
   '<svg class="e8svg" viewBox="0 0 320 276" role="img" aria-label="Three places for the writer’s schema: once per file, a version number per database record, or agreed per network connection">'+s+'</svg>'+
   L.prose('Sending the whole schema with every record would often outweigh the data. A database of schema versions (a counter or a hash) also documents the data and lets you check compatibility.')+CSS);
  L.done();}},

{part:3,src:'Chapter 4 · But what is the writer’s schema?',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Linh writes one nightly export file of 2 million parcel rows, all with the same schema. Where should the writer’s schema go?</h1>');
  L.mc(L.card,['Once, at the very start of the file','In front of every single row, to be safe','In a separate email to the readers'],0,
   'All rows share one schema, so writing it once at the start of the file is enough. Avro’s object container files do exactly this.',
   'Repeating the schema on every row would waste more space than the data, and readers need it reliably. Write it once at the start of the file.');}},

{part:3,src:'Chapter 4 · Dynamically generated schemas',
 solve:async L=>{L.$('#gs-add').click();L.$('#gs-drop').click();},
 run(L){
  let cols=['parcel_id','merchant_id','status','hub_code'],pb=[['parcel_id',1,''],['merchant_id',2,''],['status',3,''],['hub_code',4,'']],fresh='';const done=new Set();
  L.h(L.kick('learn','Generated schemas')+'<h1 class="q">Linh dumps the Parcel DB to Avro files every night</h1>'+
   '<div class="e8lbl">Parcel DB table: parcels</div><div class="e8row" id="gs-cols"></div>'+
   '<div class="e8two"><div class="e8pan"><div class="e8ph">Avro schema<br><small>generated from the table each night</small></div><div id="gs-av"></div></div>'+
   '<div class="e8pan"><div class="e8ph">Protocol Buffers<br><small>column → tag map, kept by hand</small></div><div id="gs-pb"></div></div></div>'+
   '<div class="e8row"><button class="btn" id="gs-add">+ Add column van_id</button><button class="btn" id="gs-drop">− Drop hub_code</button></div>'+
   L.prose('Avro fields match by name, so the export can regenerate the schema from the tables every time. With tags, someone has to keep the column-to-tag map, and never reuse a tag.')+CSS);
  function draw(){L.$('#gs-cols').innerHTML=cols.map(c=>'<span class="e8col2'+(c===fresh?' nw':'')+'">'+c+'</span>').join('');
   L.$('#gs-av').innerHTML=cols.map(c=>'<div class="e8it'+(c===fresh?' nw':'')+'">'+c+(c===fresh?'<small>generated, nothing to assign</small>':'')+'</div>').join('');
   L.$('#gs-pb').innerHTML=pb.map(p=>'<div class="e8it'+(p[2]?' '+p[2]:'')+'">'+p[1]+' · '+p[0]+(p[2]==='hand'?'<small>tag picked by hand</small>':p[2]==='ret'?'<small>retired: never reuse 4</small>':'')+'</div>').join('');}
  function chk(){if(done.size===2&&!L.$('#gs-done')){L.$('#gs-pb').insertAdjacentHTML('afterend','<span id="gs-done"></span>');
   L.sheet('info','Built for generated schemas','Generated schemas were a design goal for Avro, not for Thrift or Protocol Buffers. They rely on code generation, which helps statically typed languages (Java, C++, C#). In JavaScript, Ruby or Python it adds little. Avro’s is optional: a file carries its writer’s schema, so you can open it like a JSON file.');L.done();}}
  L.$('#gs-add').onclick=()=>{L.$('#gs-add').disabled=true;cols.push('van_id');fresh='van_id';pb.push(['van_id',5,'hand']);draw();done.add(0);chk();};
  L.$('#gs-drop').onclick=()=>{L.$('#gs-drop').disabled=true;cols=cols.filter(c=>c!=='hub_code');pb.find(p=>p[0]==='hub_code')[2]='ret';draw();done.add(1);chk();};
  draw();}},

{part:3,src:'Chapter 4 · The Merits of Schemas',pts:1,run(L){
  const box=(x,y,c,lines)=>'<rect x="'+x+'" y="'+y+'" width="150" height="58" rx="10" style="fill:var(--'+c+'-bg);stroke:var(--'+c+');stroke-width:2"/>'+lines.map((t,j)=>'<text x="'+(x+75)+'" y="'+(y+19+j*15)+'" style="font-size:'+(j?11.5:12.5)+'px;'+(j?'':'font-weight:700;')+'text-anchor:middle;fill:var(--'+(j?'ink':c)+')">'+t+'</text>').join('');
  L.h(L.kick('learn','The merits of schemas')+'<h1 class="q">One schema, four payoffs</h1>'+
   '<svg class="e8svg" viewBox="0 0 320 214" role="img" aria-label="A schema in the middle, with four benefits around it">'+
   '<path d="M79 64 L160 107 L241 64 M79 150 L160 107 L241 150" style="stroke:var(--line2);stroke-width:2;fill:none"/>'+
   box(4,6,'h4',['Compact','no field names','in the bytes'])+box(166,6,'h2',['Docs that stay true','needed to decode,','so never out of date'])+
   box(4,150,'h3',['Checked before deploy','a database of schemas','tests both directions'])+box(166,150,'h1',['Type-checked code','generated from it','for Java, C++, C#'])+
   '<rect x="92" y="86" width="136" height="42" rx="12" style="fill:var(--card);stroke:var(--ink);stroke-width:2"/><text x="160" y="105" style="font-size:13px;font-weight:700;text-anchor:middle;fill:var(--ink)">Schema</text><text x="160" y="120" style="font-size:11px;text-anchor:middle;fill:var(--muted)">Protobuf · Thrift · Avro</text></svg>'+
   L.prose('These schema languages are far simpler than XML Schema or JSON Schema. (ASN.1, from 1984, used tags too, but is complex.) The price: people can’t read the bytes by eye.')+
   '<h2 class="sub">Tap each piece until the sentence is true.</h2><div id="sq"></div>'+CSS);
  L.sentence(L.$('#sq'),[['The field names','The schema','The Base64 text'],['is needed to decode the data,','is optional for readers,','is kept in a separate wiki,'],['so it never goes out of date.','so it slows every read.','so it must be checked by hand.']],[1,0,0],
   [['Field names are exactly what these formats leave out of the data.','Base64 is a workaround for bytes in JSON, not part of a schema.'],['If readers could skip it, nothing would force it to stay current.','A wiki is the kind of documentation that drifts away from reality.'],['Using a schema doesn’t make reads slow.','The point is that nobody has to check it by hand.']],
   'Because decoding needs the schema, it’s documentation that can’t quietly fall out of date. Overall, schema evolution gives you the flexibility of schemaless JSON, with better guarantees and better tools.');}}
  ]
});
function selOne(host,b){[...host.children].forEach(x=>x.classList.toggle('sel',x===b));}
