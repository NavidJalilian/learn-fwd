<script>
/* =====================================================================
   Lesson 0010 only. Signature interactive: the LOG-POSITION RACE TRACK.
   The leader’s replication log is a numbered track of bookings (B1, B2…).
   Each follower is a runner on its own lane, standing at the next entry it
   still needs. Green cells = the merchant was told “booked”.
   Time moves in 1-second ticks, one booking per tick. Delays are illustrative.
   Second, smaller interactive: the replication-log format lens (part 4).
   ===================================================================== */
const NS='http://www.w3.org/2000/svg';
const SV=310,CW=25.5,X0=78,RH=38,WIN=9;
const RT_COL={W:'var(--h2)',E:'var(--h4)',N:'var(--h3)'};
const RT_NAME={W:'Westport',E:'Eastvale',N:'Nordhaven'};
/* cell look: fill, stroke, text, dash */
const CELL={
  ok:['var(--ok-bg)','var(--ok-line)','var(--ok)',''],
  pend:['var(--h3-bg)','var(--h3)','var(--h3)','3 2'],
  lostc:['var(--no-bg)','var(--no)','var(--no)',''],
  lost:['var(--soft2)','var(--line2)','var(--muted)','3 2'],
  have:['var(--pri-bg)','var(--pri)','var(--pri-deep)',''],
  new:['var(--pri)','var(--pri)','var(--pri-ink)',''],
  clash:['var(--no-bg)','var(--no)','var(--no)',''],
  split:['var(--no-bg)','var(--no)','var(--no)','3 2'],
  snap:['var(--soft2)','var(--line2)','var(--muted)',''],
  dup:['var(--no-bg)','var(--no)','var(--no)',''],
  gap:['none','var(--no)','var(--no)','3 2'],
  empty:['none','var(--line2)','var(--muted)','3 3'],
  refused:['none','var(--no)','var(--no)','2 2']
};

/* ---------- small helpers ---------- */
const tx=(x,y,s,st)=>'<text x="'+x+'" y="'+y+'" style="'+st+'">'+s+'</text>';
function setR(L,id,v){const e=L.$('#'+id);e.value=v;e.dispatchEvent(new Event('input'));}
function tasks(id,items){return '<ul class="rt-tasks" id="'+id+'">'+items.map((t,j)=>'<li data-j="'+j+'"><span class="bx"></span><span>'+t+'</span></li>').join('')+'</ul>';}
function tdone(L,id,j){const li=L.$('#'+id+' li[data-j="'+j+'"]');if(li&&!li.classList.contains('done')){li.classList.add('done');li.querySelector('.bx').innerHTML=L.ic('check');}}
function allDone(L,id){return L.$$('#'+id+' li').every(li=>li.classList.contains('done'));}
async function waitFor(L,fn,ms){for(let i=0;i<(ms||4000)/40&&!fn();i++)await L.sleep(40);}
function legend(keys){const M={ok:['var(--ok-bg)','var(--ok-line)','merchant told “booked”'],pend:['var(--h3-bg)','var(--h3)','merchant still waiting'],have:['var(--pri-bg)','var(--pri)','follower has it'],
  lostc:['var(--no-bg)','var(--no)','“booked”, then lost'],lost:['var(--soft2)','var(--line2)','lost, never confirmed'],new:['var(--pri)','var(--pri)','written by new leader'],snap:['var(--soft2)','var(--line2)','from the snapshot'],run:['var(--card)','var(--h2)','runner: next booking it needs',1]};
  return '<div class="rt-leg">'+keys.map(k=>'<span><i style="background:'+M[k][0]+';border-color:'+M[k][1]+(M[k][3]?';border-radius:50%;border-width:2.5px':'')+'"></i>'+M[k][2]+'</span>').join('')+'</div>';}

/* ---------- the race-track renderer ---------- */
function Track(host,id,label){
  host.insertAdjacentHTML('beforeend','<div class="rt"><svg id="'+id+'" viewBox="0 0 '+SV+' 120" role="img" aria-label="'+label+'"><g class="rtb"></g><g class="rtr"></g></svg></div>');
  const svg=host.querySelector('#'+id);
  return {svg,draw:vm=>drawTrack(svg,vm),alive:()=>svg.isConnected};
}
function drawTrack(svg,vm){
  if(!svg||!svg.isConnected)return;
  const rows=vm.rows,H=rows.length*RH+4;
  svg.setAttribute('viewBox','0 0 '+SV+' '+H);
  let s='';
  rows.forEach((r,j)=>{const y=2+j*RH;
    s+='<rect x="0" y="'+y+'" width="'+SV+'" height="'+(RH-4)+'" rx="10" style="fill:'+(r.bg||'var(--soft)')+'"/>';
    s+=tx(7,y+14.5,r.l1,'font-size:12.5px;font-weight:700;fill:'+(r.c1||'var(--ink)'));
    s+=tx(7,y+28.5,r.l2,'font-size:11.5px;font-weight:600;fill:'+(r.c2||'var(--muted)'));
    for(let c=0;c<WIN;c++){const id=vm.start+c,st=r.cells[id];if(!st)continue;const k=CELL[st],x=X0+c*CW;
      s+='<rect x="'+(x+1)+'" y="'+(y+4.5)+'" width="'+(CW-3)+'" height="25" rx="5" style="fill:'+k[0]+';stroke:'+k[1]+';stroke-width:1.5'+(k[3]?';stroke-dasharray:'+k[3]:'')+'"/>';
      const t=st==='dup'?'×2':st==='gap'?'?':st==='refused'?'✗':st==='empty'?'':'B'+id;
      if(t)s+=tx(x+CW/2-0.5,y+21.5,t,'font-size:11.5px;font-weight:700;text-anchor:middle;fill:'+k[2]);
      if(st==='lost'||st==='lostc')s+='<line x1="'+(x+4)+'" y1="'+(y+17.5)+'" x2="'+(x+CW-6)+'" y2="'+(y+17.5)+'" style="stroke:'+k[2]+';stroke-width:1.7"/>';
    }
    if(r.mark!=null){const c=r.mark-vm.start;if(c>=0&&c<WIN){const cx=X0+c*CW+CW/2-1.5,cy=y+17;
      if(r.markKind==='slow')s+='<circle cx="'+cx+'" cy="'+cy+'" r="9.5" style="fill:var(--h3-bg);stroke:var(--h3);stroke-width:2"/>'+tx(cx,cy+4.5,'…','font-size:13px;font-weight:700;text-anchor:middle;fill:var(--h3)');
      else s+='<circle cx="'+cx+'" cy="'+cy+'" r="9.5" style="fill:var(--no-bg);stroke:var(--no);stroke-width:2"/><path d="M'+(cx-4)+' '+(cy-4)+'l8 8m0 -8l-8 8" style="stroke:var(--no);stroke-width:2.2;stroke-linecap:round"/>';}}
    if(r.cam!=null){const c=r.cam-vm.start+1;if(c>=0&&c<=WIN){const x=X0+c*CW-1.2;
      s+='<line x1="'+x+'" y1="'+(y+3)+'" x2="'+x+'" y2="'+(y+31)+'" style="stroke:var(--pri);stroke-width:2.5"/><rect x="'+(x-7)+'" y="'+(y-3)+'" width="14" height="10" rx="2.5" style="fill:var(--pri)"/><circle cx="'+x+'" cy="'+(y+2)+'" r="2.6" style="fill:var(--card)"/>';}}
  });
  svg.querySelector('.rtb').innerHTML=s;
  const rl=svg.querySelector('.rtr'),keep=new Set();
  rows.forEach((r,j)=>{if(r.run==null)return;keep.add(r.key);const y=2+j*RH;
    let c=r.run-vm.start;c=Math.max(0,Math.min(WIN-1,c));
    const cx=X0+c*CW+CW/2-1.5,cy=y+17;
    let g=rl.querySelector('g[data-k="'+r.key+'"]');const fresh=!g;
    if(!g){g=document.createElementNS(NS,'g');g.setAttribute('data-k',r.key);rl.appendChild(g);}
    const col=r.dn?'var(--muted)':r.rc;
    g.innerHTML='<circle r="10.5" style="fill:var(--card);stroke:'+col+';stroke-width:2.6'+(r.dn?';stroke-dasharray:3 2':'')+'"/>'+tx(0,4.5,r.key,'font-size:12.5px;font-weight:700;text-anchor:middle;fill:'+col);
    if(fresh){g.style.transition='none';g.style.transform='translate('+cx+'px,'+cy+'px)';void g.getBoundingClientRect();g.style.transition='';}
    else g.style.transform='translate('+cx+'px,'+cy+'px)';
  });
  [...rl.children].forEach(g=>{if(!keep.has(g.getAttribute('data-k')))g.remove();});
}

/* ---------- the replication model behind the track ---------- */
function Sim(fols){
  const S={now:0,ent:[],crash:null,prom:null,keep:0,pc:{},tp:0,nw:[],bk:[],back:false,slow:false,
    fol:fols.map(f=>Object.assign({mode:'async',d:1,down:null},f))};
  const F=k=>S.fol.find(f=>f.k===k);
  /* when each old-leader entry reaches follower f (1e9 = never) */
  function arrs(f){let p=-1e9;return S.ent.map(e=>{let a=Math.max(p,e.t+e.d[f.k]);
    if(f.down&&a>f.down.a)a=f.down.b==null?1e9:Math.max(a,f.down.b);
    if(S.crash!=null&&a>S.crash)a=1e9;return p=a;});}
  /* the new leader’s log after a failover: the entries it kept, then its own */
  function nlog(){return S.ent.slice(0,S.keep).map(e=>({n:e.n,t:S.tp,kept:true})).concat(S.nw);}
  function arrsN(f){const have=Math.min(S.pc[f.k],S.keep);let p=-1e9;return nlog().map((e,i)=>{if(i<have)return -1e9;
    let a=Math.max(p,e.t+f.d);if(f.down&&a>f.down.a)a=f.down.b==null?1e9:Math.max(a,f.down.b);return p=a;});}
  const cnt=a=>a.filter(x=>x<=S.now).length;
  function pos(f){if(typeof f==='string')f=F(f);if(S.prom==null)return cnt(arrs(f));if(f.k===S.prom)return S.keep+S.nw.length;return cnt(arrsN(f));}
  /* a booking is confirmed once every synchronous follower has it */
  function settle(){if(S.prom!=null)return;if(S.crash!=null&&S.now>S.crash)return;
    const A=S.fol.filter(f=>f.mode==='sync').map(arrs);
    S.ent.forEach((e,i)=>{if(e.c==null&&A.every(a=>a[i]<=S.now))e.c=S.now;});}
  function write(){
    if(S.prom!=null){S.nw.push({n:S.keep+S.nw.length+1,t:S.now});if(S.back)S.bk.push({n:S.ent.length+S.bk.length+1,t:S.now});return true;}
    if(S.crash!=null)return false;
    const d={};S.fol.forEach(f=>d[f.k]=f.d);S.ent.push({n:S.ent.length+1,t:S.now,d,c:null});settle();return true;}
  function tick(book){S.now++;if(book!==false)write();settle();}
  function crash(slow){S.crash=S.now;S.slow=!!slow;}
  function promote(k){S.fol.forEach(f=>S.pc[f.k]=pos(f));S.keep=S.pc[k];S.prom=k;S.tp=S.now;}
  function down(k){F(k).down={a:S.now,b:null};}
  function up(k){const f=F(k);if(f.down)f.down.b=S.now;settle();}
  const isDown=k=>{const f=F(k);return !!(f.down&&f.down.b==null);};
  function info(){const p={};S.fol.forEach(f=>p[f.k]=pos(f));const sy=S.fol.filter(f=>f.mode==='sync');
    return {n:S.ent.length,p,sy,wait:sy.length?Math.max(...sy.map(f=>f.d)):0,stalled:sy.some(f=>isDown(f.k)),
      pend:S.ent.filter(e=>e.c==null).length,
      lostC:S.prom!=null?S.ent.filter(e=>e.n>S.keep&&e.c!=null).map(e=>e.n):[],
      lostP:S.prom!=null?S.ent.filter(e=>e.n>S.keep&&e.c==null).map(e=>e.n):[],
      reused:S.prom!=null?S.nw.filter(e=>{const o=S.ent[e.n-1];return o&&o.c!=null;}).map(e=>e.n):[]};}
  function vm(o){o=o||{};
    const oldN=S.ent.length+S.bk.length+(o.refused||0),newN=S.prom!=null?S.keep+S.nw.length:0;
    const maxID=Math.max(oldN,newN,o.min||0);const start=Math.max(1,maxID+2-WIN);
    const lc={};
    S.ent.forEach(e=>{let st=e.c!=null?'ok':'pend';if(S.prom!=null&&e.n>S.keep)st=e.c!=null?'lostc':'lost';lc[e.n]=st;});
    const newIds=new Set(S.prom!=null?nlog().map(e=>e.n):[]);
    S.bk.forEach(e=>{lc[e.n]=newIds.has(e.n)?'clash':'split';});
    for(let j=0;j<(o.refused||0);j++)lc[S.ent.length+1+j]='refused';
    const lead={key:'L',l1:'Leader',cells:lc,bg:'var(--soft)'};
    if(S.back){lead.l2='2nd leader!';lead.c2='var(--no)';}
    else if(S.slow){lead.l2='slow, alive';lead.c2='var(--h3)';lead.mark=S.ent.length+1;lead.markKind='slow';}
    else if(S.crash!=null){lead.l2='crashed';lead.c2='var(--no)';if(!o.refused)lead.mark=S.ent.length+1;}
    else lead.l2='Westport';
    const rows=[lead];
    S.fol.forEach(f=>{const p=pos(f),cells={},isP=f.k===S.prom,dn=isDown(f.k);
      if(S.prom==null)S.ent.forEach(e=>{cells[e.n]=e.n<=p?'have':'empty';});
      else nlog().forEach((e,i)=>{let st=i<p?(e.kept?'have':'new'):'empty';
        if(isP&&st==='new'&&(lc[e.n]==='lostc'||lc[e.n]==='clash'))st='clash';cells[e.n]=st;});
      rows.push({key:f.k,l1:RT_NAME[f.k],l2:isP?'new leader':dn?'down':(f.mode+' · '+f.d+' s'),
        c2:isP?'var(--h1)':dn?'var(--no)':(f.mode==='sync'?'var(--pri)':'var(--muted)'),
        cells,run:isP?null:p+1,rc:RT_COL[f.k],dn,bg:isP?'var(--h1-bg)':'var(--soft)'});});
    return {start,rows};}
  return {S,F,pos,tick,write,crash,promote,down,up,isDown,settle,info,vm,nlog};
}
const fol2=(wm,wd,em,ed)=>Sim([{k:'W',mode:wm,d:wd},{k:'E',mode:em,d:ed}]);
function best(sim){const ks=sim.S.fol.filter(f=>!sim.isDown(f.k)).map(f=>f.k);return ks.sort((a,b)=>sim.pos(b)-sim.pos(a))[0];}

/* ---------- static pictures for the Learn screens ---------- */
function srv(x,y,w,h,load,col){return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="4" style="fill:var(--card);stroke:var(--line2);stroke-width:1.5"/>'+
  '<rect x="'+(x+3)+'" y="'+(y+h-3-(h-6)*load)+'" width="'+(w-6)+'" height="'+((h-6)*load)+'" rx="2" style="fill:'+col+'"/>';}

    'shared-nothing':'Shared-nothing architecture: spreading the load over several machines, each with its own processor, memory and disks, that coordinate only over the network.',
    'sync':'Synchronous replication: the leader waits until a follower confirms it has the write before telling the client the write succeeded. Asynchronous replication: the leader sends the change and does not wait.',
    'semi-sync':'Semi-synchronous: one follower is synchronous and the rest are asynchronous, so every confirmed write is on at least two nodes.',
    'snapshot':'Consistent snapshot: a copy of the whole database as it was at one exact moment, tied to a position in the leader’s replication log (PostgreSQL calls it the log sequence number; MySQL, the binlog coordinates).',
    'failover':'Failover: when the leader fails, a follower is promoted to be the new leader, clients send their writes to it, and the other followers start copying from it.',
    'split-brain':'Split brain: two nodes both believe they are the leader and both accept writes, which can lose or corrupt data.',
    'wal':'Write-ahead log (WAL, also called a redo log): an append-only file where every change is written before it is applied, so the database can repair itself after a crash.',
    'cdc':'Change data capture: reading a database’s log of row changes so another system (a warehouse, a search index, a cache) can copy them.'
  },
  cheatsheet:[
    'Spread data over machines for <b>scalability</b>, <b>fault tolerance</b> and <b>latency</b>. Shared-nothing is the usual way.',
    '<b>Replication</b> = the same data on several nodes. <b>Partitioning</b> = splitting data into pieces on different nodes. They often go together.',
    '<b>Leader-based replication:</b> all writes go to the leader; followers apply its log <b>in the same order</b>; reads can go anywhere.',
    '<b>Synchronous</b> followers are safe but can block writes. <b>Asynchronous</b> never blocks, but a confirmed write can be lost if the leader dies. <b>Semi-synchronous</b> = one sync follower.',
    'New follower: <b>consistent snapshot</b> + its log position, then catch up on everything after that position.',
    'Follower failure: <b>catch-up recovery</b> from its own log. Leader failure: <b>failover</b> (detect by timeout, choose the most up-to-date follower, reconfigure).',
    'Failover risks: lost writes, reused IDs that clash with other systems, <b>split brain</b>, and a timeout that is too long or too short.',
    'Log formats: <b>statement-based</b> (breaks on NOW(), RAND()), <b>WAL shipping</b> (tied to the storage engine), <b>logical row-based</b> (decoupled, good for change data capture), <b>trigger-based</b> (flexible, slower).'
  ],
  steps:[
/* ---------- PART 1: WHY DISTRIBUTE ---------- */
{part:0,src:'Warm-up',pts:1,run(L){

   'There’s no other machine holding the data, so nothing can answer. Bookings stop until the server is back. That’s the problem replication solves.');}},
{part:0,src:'Part II · Distributed Data',run(L){

{part:0,src:'Part II · Shared-Nothing Architectures',run(L){

{part:0,src:'Part II · Scaling to Higher Load',pts:1,run(L){

/* ---------- PART 2: LEADERS AND FOLLOWERS ---------- */
{part:1,src:'Chapter 5 · Leaders and Followers',run(L){
  L.h(L.kick('learn','Leader-based replication')+'<h1 class="q">One node takes the writes. The others copy its log.</h1>'+CSS+picLeader()+
   '<p class="cap">Every write goes to the '+L.g('leader','leader')+' (primary), which adds it to the replication '+L.g('log','log')+'. Followers (read replicas) apply that log <b>in exactly the same order</b>. Reads can go to any copy; only the leader takes writes.</p>');

{part:1,src:'Chapter 5 · Leaders and Followers',
 solve:async L=>{L.$('#o1').click();L.$('#o2').click();L.$('#ors').click();L.$('#o2').click();L.$('#o1').click();},
 run(L){
  const seen=new Set();let applied=[];
  L.h(L.kick('ex','Hands on · why order matters')+'<h1 class="q">The leader’s log has two changes for parcel OP-48213. Tap them to apply them on the follower, in any order you like.</h1>'+CSS+
   '<div class="ord"><div><h4>Leader (the log)</h4><div class="small">#1 status → At hub<br>#2 status → Out for delivery</div><div class="stp out">Out for delivery</div></div>'+
   '<div><h4>Follower</h4><div class="stp none" id="ost">no status yet</div><div class="ordlog" id="olg"></div></div></div>'+
   '<div class="rt-btns"><button class="btn" id="o1">Apply #1 · At hub</button><button class="btn" id="o2">Apply #2 · Out for delivery</button><button class="btn" id="ors">'+L.ic('cycle')+'Reset</button></div>'+
   '<div class="rt-read" id="ord" aria-live="polite">Try the log’s order, then try the other order.</div>');
  const ST={1:['hub','At hub'],2:['out','Out for delivery']};
  function draw(){const last=applied[applied.length-1];const el=L.$('#ost');
    if(!last){el.className='stp none';el.textContent='no status yet';}else{el.className='stp '+ST[last][0];el.textContent=ST[last][1];}
    L.$('#olg').textContent=applied.length?'Applied: '+applied.map(n=>'#'+n).join(' then '):'';
    L.$('#o1').disabled=applied.includes(1);L.$('#o2').disabled=applied.includes(2);}
  function ap(n){if(applied.includes(n))return;applied.push(n);draw();
    if(applied.length===2){const inOrder=applied[0]===1;seen.add(inOrder?'in':'out');
      L.$('#ord').innerHTML=inOrder?'<span class="ok-t">Same as the leader.</span> Log order gives the same final status.':'<span class="no-t">Different from the leader.</span> Same two changes, other order: the follower ends at “At hub”, and recipients reading from it see the parcel go backwards.';
      if(seen.size===2){L.sheet('info','Same writes, different order, different data','That’s why the leader fixes one order in its log and every follower replays it exactly. Keep this in mind: the order of the log is the whole game.');L.done();}}}
  L.$('#o1').onclick=()=>ap(1);L.$('#o2').onclick=()=>ap(2);
  L.$('#ors').onclick=()=>{applied=[];draw();L.$('#ord').textContent=seen.size?'Now try the other order.':'Try the log’s order, then try the other order.';};
  draw();}},
{part:1,src:'Chapter 5 · Synchronous Versus Asynchronous Replication',run(L){
  L.h(L.kick('learn','Wait or don’t wait?')+'<h1 class="q">When does the leader tell the merchant “booked”?</h1>'+CSS+'<div id="w9"></div>');
  const sim=fol2('sync',1,'async',3);for(let j=0;j<6;j++)sim.tick();
  const T=Track(L.$('#w9'),'w9s','The leader’s log B1 to B6. B1 to B5 are green, B6 is amber. Westport, synchronous, has B1 to B5. Eastvale, asynchronous, has B1 to B3.');T.draw(sim.vm());
  L.$('#w9').insertAdjacentHTML('beforeend',legend(['ok','pend','have','run'])+
   '<p class="cap">Westport is '+L.g('sync','synchronous')+': a booking turns green only once Westport has it. Eastvale is asynchronous: the leader doesn’t wait, so it trails, usually by under a second, but with no upper limit.</p>'+
   '<p class="small">Delays here are illustrative.</p>');
  L.done();}},
{part:1,src:'Chapter 5 · Synchronous Versus Asynchronous Replication',
 solve:async L=>{setR(L,'x1dE',3);for(let j=0;j<4;j++)L.$('#x1st').click();L.$('#x1mWs').click();setR(L,'x1dW',2);for(let j=0;j<3;j++)L.$('#x1st').click();},
 run(L){
  L.h(L.kick('ex','Explore the track')+'<h1 class="q">One booking arrives every second. Change how each follower replicates and watch what the merchant sees.</h1>'+CSS+
   tasks('x1t',['Make a follower <b>sync</b> with a delay of 2 s or more, and run','Let an <b>async</b> follower fall 3 or more bookings behind'])+'<div id="x1"></div>');
  const sim=fol2('async',1,'async',1);let running=false,doneOnce=false;
  const box=L.$('#x1'),T=Track(box,'x1s','The race track: the leader’s log and each follower’s position');
  box.insertAdjacentHTML('beforeend','<div class="rt-read" id="x1r" aria-live="polite"></div>'+legend(['ok','pend','have'])+
   '<div class="rt-btns"><button class="btn pri" id="x1run">'+L.ic('play')+'Run</button><button class="btn" id="x1st">+1 s</button><button class="btn" id="x1rs">'+L.ic('cycle')+'Reset</button></div>'+
   folCtl('x1',sim,['W','E']));
  function draw(){T.draw(sim.vm());const I=sim.info();
    if(!I.n){L.$('#x1r').innerHTML='No bookings yet. Press <b>Run</b> or <b>+1 s</b>.';return;}
    let h='Leader log ends at <b>B'+I.n+'</b>. '+['W','E'].map(k=>RT_NAME[k]+' has '+(I.p[k]?'B'+I.p[k]:'nothing')+' ('+(I.n-I.p[k])+' behind)').join(' · ')+'. ';
    h+=I.wait?'<span class="am-t">Each booking waits '+I.wait+' s</span> before “booked”.':'<span class="ok-t">Merchants never wait:</span> no follower is synchronous.';
    L.$('#x1r').innerHTML=h;
    if(I.n&&sim.S.fol.some(f=>f.mode==='sync'&&f.d>=2)&&I.pend>0)tdone(L,'x1t',0);
    if(sim.S.fol.some(f=>f.mode==='async'&&I.n-I.p[f.k]>=3))tdone(L,'x1t',1);
    if(allDone(L,'x1t')&&!doneOnce){doneOnce=true;
      L.sheet('info','What you just saw','<b>Sync:</b> the merchant waits as long as that follower takes, but every green booking is already on it. <b>Async:</b> the merchant never waits, but the follower can trail, so it may be missing bookings that were confirmed.');L.done();}}
  function step(){if(sim.S.ent.length>=90){running=false;L.$('#x1run').innerHTML=L.ic('play')+'Run';return;}sim.tick();draw();}
  bindFol(L,'x1',sim,['W','E'],draw);
  L.$('#x1st').onclick=step;
  L.$('#x1run').onclick=async()=>{running=!running;L.$('#x1run').innerHTML=running?'Pause':L.ic('play')+'Run';
    while(running&&T.alive()){step();await L.sleep(850);}};
  L.$('#x1rs').onclick=()=>{const S=sim.S;S.now=0;S.ent=[];draw();};
  draw();}},
{part:1,src:'Chapter 5 · Synchronous Versus Asynchronous Replication',pts:1,
 solve:async L=>{L.$('#p2c1').click();await waitFor(L,()=>L.$('#p2rp'));L.$('#p2rp').click();await waitFor(L,()=>L.$('#p2dn'));},
 run(L){
  let pick=null;
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">Both followers are async: Westport 1&nbsp;s behind, Eastvale 2&nbsp;s. The leader confirms B1 to B5, then crashes. Kwame promotes the most up-to-date follower. Which confirmed bookings are lost?</h1>'+CSS+
   '<div class="lz-row" id="p2c"></div><div id="p2"></div><div id="p2x"></div>');
  const box=L.$('#p2'),T=Track(box,'p2s','The race track for the crash');
  box.insertAdjacentHTML('beforeend','<div class="rt-read" id="p2r" aria-live="polite">Pick your prediction to run it.</div>'+legend(['ok','have','lostc','lost']));
  let sim=fol2('async',1,'async',2);T.draw(sim.vm({min:7}));
  async function play(wm){sim=fol2(wm,1,'async',2);T.draw(sim.vm({min:7}));
    for(let j=0;j<5;j++){await L.sleep(300);if(!T.alive())return null;sim.tick();T.draw(sim.vm({min:7}));}
    await L.sleep(350);if(!T.alive())return null;sim.crash();T.draw(sim.vm({min:7}));L.$('#p2r').innerHTML='<span class="no-t">The leader crashes.</span> Failover picks the follower with the most bookings…';
    await L.sleep(550);if(!T.alive())return null;sim.promote(best(sim));T.draw(sim.vm({min:7}));return sim.info();}
  ['Nothing is lost','Only B5','B4 and B5','B3, B4 and B5'].forEach((t,j)=>{const b=document.createElement('button');b.className='chip';b.id='p2c'+j;b.textContent=t;
    b.onclick=async()=>{if(pick!==null)return;pick=j;b.classList.add('sel');const I=await play('async');if(!I)return;
      const ok=j===1;L.award(ok);
      L.$('#p2r').innerHTML='Westport had B1 to B4. <span class="no-t">B5 is gone</span>, though its merchant was told “booked”. Eastvale was even further behind.';
      L.sheet(ok?'ok':'no',ok?'Right: only B5':'Only B5 was lost','Async means the leader says “booked” before any follower has the booking. Westport, 1 s behind, was missing just the last one. With async replication a confirmed write is not guaranteed to survive a leader crash.');
      L.$('#p2x').innerHTML='<button class="btn pri" id="p2rp" style="margin-top:6px">'+L.ic('play')+'Replay with Westport synchronous</button>';
      L.$('#p2rp').onclick=async function(){this.remove();const I2=await play('sync');if(!I2)return;
        L.$('#p2r').innerHTML='Same crash. B5 was still amber: the leader hadn’t said “booked” yet, so its merchant never got a promise that was then broken. <span class="ok-t">No confirmed booking lost.</span>';
        L.$('#p2x').innerHTML='<div class="fb ok" id="p2dn">That’s '+L.g('semi-sync','semi-synchronous')+': one sync follower, so every confirmed booking is on at least two nodes, the leader and Westport.</div>';L.done();};};
    L.$('#p2c').appendChild(b);});}},
{part:1,src:'Chapter 5 · Synchronous Versus Asynchronous Replication',
 solve:async L=>{for(let j=0;j<4;j++){L.$('#e3p'+j).click();await L.sleep(20);}},
 run(L){
  const tried=new Set();
  L.h(L.kick('pr','Edge cases')+'<h1 class="q">Push the settings to the extremes. Where does each one stop protecting you?</h1>'+CSS+'<div class="rt-pre" id="e3b"></div><div id="e3"></div>');
  const box=L.$('#e3'),T=Track(box,'e3s','The race track for the chosen edge case');
  box.insertAdjacentHTML('beforeend','<div class="rt-read" id="e3r" aria-live="polite">Tap a case above. Try at least three.</div>'+legend(['ok','pend','have']));
  T.draw(fol2('async',1,'async',1).vm({min:7}));
  const P=[
   ['All sync, one slow disk',()=>{const s=fol2('sync',1,'sync',4);for(let j=0;j<7;j++)s.tick();return s;},
    '<span class="am-t">Every booking waits 4 s.</span> With every follower synchronous, the slowest one sets the pace for all writes. If any one stopped answering, nothing could be confirmed. That’s why “synchronous” in practice usually means just one follower.'],
   ['Sync follower goes down',()=>{const s=fol2('sync',1,'async',2);for(let j=0;j<3;j++)s.tick();s.down('W');for(let j=0;j<4;j++)s.tick();return s;},
    '<span class="no-t">Bookings stall.</span> Westport is the synchronous follower and it’s down, so the leader can’t confirm anything. It must block writes until Westport is back.'],
   ['Make another one sync',()=>{const s=fol2('sync',1,'async',2);for(let j=0;j<3;j++)s.tick();s.down('W');for(let j=0;j<4;j++)s.tick();s.F('W').mode='async';s.F('E').mode='sync';s.settle();for(let j=0;j<2;j++)s.tick();return s;},
    '<span class="ok-t">Unstuck.</span> When the synchronous follower fails, an asynchronous one is made synchronous. That keeps an up-to-date copy on two nodes: '+L.g('semi-sync','semi-synchronous')+' replication.'],
   ['Async, lag grows',()=>{const s=fol2('async',1,'async',1);for(let j=0;j<3;j++)s.tick();s.F('E').d=12;for(let j=0;j<7;j++)s.tick();return s;},
    '<span class="am-t">Eastvale falls far behind</span> and the leader doesn’t care. Lag is usually under a second, but there’s no guarantee: recovering from a failure, running near capacity or network trouble can push it to minutes.']];
  P.forEach((p,j)=>{const b=document.createElement('button');b.className='chip';b.id='e3p'+j;b.textContent=p[0];
    b.onclick=()=>{[...L.$('#e3b').children].forEach(x=>x.classList.toggle('sel',x===b));const s=p[1]();T.draw(s.vm({min:7}));L.$('#e3r').innerHTML=p[2];tried.add(j);
      if(tried.size>=3&&!L.$('#e3ok')){L.$('#e3').insertAdjacentHTML('beforeend','<span id="e3ok"></span>');
        L.sheet('info','The trade-off in one line','Sync buys durability and costs availability: one slow or dead sync follower holds up every write. Async keeps writes flowing but weakens durability. Semi-sync is the usual middle.');L.done();}};
    L.$('#e3b').appendChild(b);});}},
{part:1,src:'Chapter 5 · Synchronous Versus Asynchronous Replication',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Kwame plans six followers for the tracking page, spread over Westport, Eastvale and Nordhaven. Why does the book say fully asynchronous replication is common in setups like this?</h1>');
  L.mc(L.card,['Async followers are never behind the leader','With many or far-away followers, waiting for them would stall writes','Async replication never loses a confirmed write'],1,
   'Right. The more followers and the further away they are, the more likely one is slow. Async lets the leader keep taking writes even if every follower falls behind. The price is weaker durability.',
   'Async followers can fall behind, and async can lose confirmed writes if the leader dies. What it buys is that the leader never waits, which matters most with many or distant followers.');}},
{part:1,src:'Chapter 5 · Setting Up New Followers',run(L){
  L.h(L.kick('learn','Adding a follower')+'<h1 class="q">You can’t just copy the files while bookings keep coming</h1>'+CSS+picNewFollower()+
   '<p class="cap">A plain file copy mixes moments. Locking stops bookings. Instead, take a '+L.g('snapshot','consistent snapshot')+' tied to an exact log position, copy it, then fetch every change after that position.</p>');
  L.done();}},
{part:1,src:'Chapter 5 · Setting Up New Followers',pts:1,
 solve:async L=>{L.$('#n4a').click();L.$('#n4b').click();await waitFor(L,()=>L.$('#n4c1'));L.$('#n4c1').click();},
 run(L){
  let ph=0,n=6,snapCells=0,pick=null,first=true;
  L.h(L.kick('pr','Hands on · new follower')+'<h1 class="q">Kwame adds a Nordhaven follower without stopping bookings. Do the steps, then choose where Nordhaven picks up.</h1>'+CSS+'<div id="n4"></div>');
  const box=L.$('#n4'),T=Track(box,'n4s','The leader’s log, the Westport follower and the new Nordhaven follower');
  box.insertAdjacentHTML('beforeend',legend(['ok','have','snap'])+
   '<div class="rt-btns"><button class="btn pri" id="n4a">1 · Snapshot the leader</button><button class="btn" id="n4b" disabled>2 · Copy it to Nordhaven</button></div>'+
   '<div id="n4q"></div><div class="rt-read" id="n4r" aria-live="polite">Bookings keep arriving the whole time.</div>');
  function vm(){const lc={},wc={},nc={};for(let j=1;j<=n;j++){lc[j]='ok';wc[j]=j<n?'have':'empty';}
    let run=null,l2=ph>=1?'snapshot B6':'new, empty';
    for(let j=1;j<=snapCells;j++)nc[j]='snap';
    if(ph>=1)for(let j=snapCells+1;j<=n;j++)nc[j]='empty';
    if(ph>=2)run=7;
    if(pick!==null){l2=['applied twice','caught up','has a hole'][pick];run=n+1;
      for(let j=7;j<=9;j++)nc[j]=pick===2?'gap':'have';
      if(pick===0)for(let j=1;j<=6;j++)nc[j]='dup';}
    return {start:pick!==null?2:1,rows:[{key:'L',l1:'Leader',l2:'Westport',cells:lc,cam:ph>=1?6:null},
      {key:'W',l1:'Westport',l2:'async · 1 s',c2:'var(--muted)',cells:wc,run:n,rc:RT_COL.W},
      {key:'N',l1:'Nordhaven',l2,c2:pick===null?'var(--h3)':pick===1?'var(--ok)':'var(--no)',cells:nc,run,rc:RT_COL.N,cam:snapCells>=6?6:null}]};}
  T.draw(vm());
  L.$('#n4a').onclick=function(){if(ph)return;ph=1;this.disabled=true;L.$('#n4b').disabled=false;T.draw(vm());
    L.$('#n4r').innerHTML='A consistent snapshot of the leader at log position <b>B6</b>, taken without locking. Bookings carry on.';};
  L.$('#n4b').onclick=async function(){if(ph!==1)return;ph=2;this.disabled=true;
    for(let j=0;j<3;j++){await L.sleep(320);if(!T.alive())return;n++;snapCells=Math.min(6,snapCells+2);T.draw(vm());}
    L.$('#n4r').innerHTML='Copying took a while: the leader is now at <b>B9</b>. Nordhaven holds B1 to B6 from the snapshot.';
    L.$('#n4q').innerHTML='<div class="rt-lbl">3 · Nordhaven asks the leader for changes. Which ones?</div><div class="lz-row" id="n4c"></div>';
    ['Everything from B1','Everything after B6','Only new ones, after B9'].forEach((t,j)=>{const b=document.createElement('button');b.className='chip';b.id='n4c'+j;b.textContent=t;
      b.onclick=()=>{pick=j;[...L.$('#n4c').children].forEach(x=>x.classList.toggle('sel',x===b));T.draw(vm());
        const ok=j===1;
        const R=['<span class="no-t">B1 to B6 applied twice</span> on top of the snapshot: duplicate parcels and double charges.',
          '<span class="ok-t">Caught up.</span> Nordhaven applies B7 to B9, the backlog since the snapshot, and now follows live like any follower.',
          '<span class="no-t">B7 to B9 never arrive.</span> A silent hole: Nordhaven looks healthy but is missing three bookings for good.'];
        L.$('#n4r').innerHTML=R[j];
        if(first){first=false;L.award(ok);
          L.sheet(ok?'ok':'no',ok?'Right: after B6':'Pick up exactly where the snapshot ends','The snapshot is tied to an exact log position, B6. The new follower asks for every change <i>after</i> that position, works through the backlog, and then it has <b>caught up</b>. You can tap the other choices to see what they break.');L.done();}};
      L.$('#n4c').appendChild(b);});};}},

/* ---------- PART 3: OUTAGES AND FAILOVER ---------- */
{part:2,src:'Chapter 5 · Handling Node Outages',run(L){
  L.h(L.kick('learn','When a node goes down')+'<h1 class="q">A follower failing is easy. A leader failing is not.</h1>'+CSS+picOutage()+
   '<p class="cap">A restarted follower knows from its own log where it stopped and fetches the rest. When the leader dies, '+L.g('failover','failover')+' detects it by timeout, promotes the most up-to-date follower and sends writes there.</p>'+
   L.quote('Failover is fraught with things that can go wrong.','Martin Kleppmann, chapter 5'));
  L.done();}},
{part:2,src:'Chapter 5 · Handling Node Outages',
 solve:async L=>{L.$('#x5dW').click();for(let j=0;j<3;j++)L.$('#x5st').click();L.$('#x5dW').click();L.$('#x5L').click();await waitFor(L,()=>L.$('#x5pW'));L.$('#x5pW').click();},
 run(L){
  let sim,running=false,doneOnce=false,detecting=false;
  L.h(L.kick('ex','Hands on · outages')+'<h1 class="q">Knock nodes over and watch the system recover.</h1>'+CSS+
   tasks('x5t',['Crash a <b>follower</b>, let 2+ bookings pass, then restart it','Crash the <b>leader</b> and promote a follower'])+'<div id="x5"></div>');
  const box=L.$('#x5'),T=Track(box,'x5s','The race track with crash and restart controls');
  box.insertAdjacentHTML('beforeend','<div class="rt-read" id="x5r" aria-live="polite"></div><div class="lz-row" id="x5p"></div>'+legend(['ok','have','lostc','new'])+
   '<div class="rt-btns"><button class="btn pri" id="x5run">'+L.ic('play')+'Run</button><button class="btn" id="x5st">+1 s</button><button class="btn" id="x5rs">'+L.ic('cycle')+'Reset</button></div>'+
   '<div class="rt-btns"><button class="btn" id="x5dW">Crash W</button><button class="btn" id="x5dE">Crash E</button><button class="btn" id="x5L">Crash leader</button></div>');
  function reset(){sim=fol2('async',1,'async',2);for(let j=0;j<3;j++)sim.tick();L.$('#x5p').innerHTML='';detecting=false;draw('Bookings flow: press Run or +1 s.');}
  function draw(msg){T.draw(sim.vm());const S=sim.S,I=sim.info();
    ['W','E'].forEach(k=>{const b=L.$('#x5d'+k);b.textContent=(sim.isDown(k)?'Restart ':'Crash ')+k;b.disabled=S.prom===k;});
    L.$('#x5L').disabled=S.crash!=null;
    if(msg)L.$('#x5r').innerHTML=msg;}
  function step(){if(sim.S.now>=80)return;sim.tick();
    let m=null;const S=sim.S;
    if(S.crash!=null&&S.prom==null)m='<span class="no-t">No leader:</span> bookings fail until a follower is promoted.';
    else if(S.prom!=null){const I=sim.info();m=RT_NAME[S.prom]+' leads now. '+(I.lostC.length?'<span class="no-t">Lost after “booked”: '+I.lostC.map(x=>'B'+x).join(', ')+'.</span> ':'')+(I.reused.length?'Its counter handed out '+I.reused.map(x=>'B'+x).join(', ')+' again.':'');}
    else{const dn=['W','E'].filter(k=>sim.isDown(k));if(dn.length)m=dn.map(k=>RT_NAME[k]).join(' and ')+' is down and missing bookings. The leader carries on.';}
    draw(m);}
  bindRun();
  function bindRun(){
    L.$('#x5st').onclick=step;
    L.$('#x5run').onclick=async()=>{running=!running;L.$('#x5run').innerHTML=running?'Pause':L.ic('play')+'Run';while(running&&T.alive()){step();await L.sleep(900);}};
    L.$('#x5rs').onclick=reset;
    ['W','E'].forEach(k=>{L.$('#x5d'+k).onclick=()=>{const f=sim.F(k);
      if(sim.isDown(k)){const missed=sim.S.ent.filter(e=>e.t>f.down.a).length+sim.S.nw.filter(e=>e.t>f.down.a).length;sim.up(k);
        draw(missed?'<span class="ok-t">Catch-up recovery:</span> '+RT_NAME[k]+'’s own log says where it stopped. It asks for everything after that and jumps forward.':RT_NAME[k]+' is back, but it missed nothing. Next time let some bookings pass while it’s down.');
        if(missed>=2)tdone(L,'x5t',0);}
      else{sim.down(k);draw(RT_NAME[k]+' is down. Let a few bookings pass, then restart it.');}
      check();};});
    L.$('#x5L').onclick=async()=>{if(sim.S.crash!=null||detecting)return;sim.crash();detecting=true;
      draw('<span class="no-t">The leader crashed.</span> No reply… after the timeout (30 s, sped up here) it’s presumed dead.');
      await L.sleep(500);if(!T.alive())return;detecting=false;
      const ups=['W','E'].filter(k=>!sim.isDown(k));
      if(!ups.length){draw('Both followers are down too, so nobody can take over. Press Reset.');return;}
      L.$('#x5p').innerHTML='<div class="rt-lbl" style="width:100%">Choose the new leader</div>'+ups.map(k=>'<button class="chip" id="x5p'+k+'">Promote '+RT_NAME[k]+' (has B'+sim.pos(k)+')</button>').join('');
      ups.forEach(k=>{L.$('#x5p'+k).onclick=()=>{sim.promote(k);L.$('#x5p').innerHTML='';const I=sim.info();
        draw(RT_NAME[k]+' is the new leader. Writes go to it and the other follower copies from it. '+(I.lostC.length?'<span class="no-t">'+I.lostC.map(x=>'B'+x).join(', ')+(I.lostC.length>1?' were':' was')+' confirmed but never reached it: discarded.</span>':'<span class="ok-t">It had every confirmed booking.</span>'));
        tdone(L,'x5t',1);check();};});
      draw();};
  }
  function check(){if(allDone(L,'x5t')&&!doneOnce){doneOnce=true;
    L.sheet('info','Two very different recoveries','A follower just catches up from its log position: nothing to decide. Losing the leader needs a decision (who leads now?) and can lose bookings the old leader confirmed. Choosing the most up-to-date follower keeps the loss smallest; getting all nodes to agree on it is a '+L.g('consensus','consensus')+' problem (chapter 9).');L.done();}}
  reset();}},
{part:2,src:'Chapter 5 · Handling Node Outages',
 solve:async L=>{for(let j=0;j<4;j++){L.$('#f6p'+j).click();await L.sleep(20);}},
 run(L){
  const tried=new Set();
  L.h(L.kick('pr','Edge cases · failover')+'<h1 class="q">Replay four nights that went wrong at Otterpost. What broke each time?</h1>'+CSS+'<div class="rt-pre" id="f6b"></div><div id="f6"></div>');
  const box=L.$('#f6'),T=Track(box,'f6s','The race track for the chosen failover case');
  box.insertAdjacentHTML('beforeend','<div class="rt-read" id="f6r" aria-live="polite">Tap a night above. Try at least three.</div>'+legend(['ok','lostc','new','have']));
  T.draw(fol2('async',1,'async',2).vm({min:7}));
  const bar=(a,b,t,bl,ll)=>'<svg viewBox="0 0 300 44" style="width:100%;display:block;margin:2px 0 6px" role="img" aria-label="'+t+'"><rect x="0" y="24" width="300" height="12" rx="4" style="fill:var(--card)"/><rect x="0" y="24" width="'+a+'" height="12" rx="4" style="fill:var(--h3)"/><line x1="'+b+'" y1="18" x2="'+b+'" y2="42" style="stroke:var(--no);stroke-width:2.5"/>'+
    tx(0,14,bl,'font-size:12px;font-weight:600;fill:var(--h3)')+tx(b>250?b:b+5,14,ll,'font-size:12px;font-weight:600;fill:var(--no)'+(b>250?';text-anchor:end':''))+'</svg>';
  const P=[
   ['Promote a lagging follower',()=>{const s=fol2('async',1,'async',2);for(let j=0;j<2;j++)s.tick();s.down('W');for(let j=0;j<4;j++)s.tick();s.crash();s.promote('E');s.tick();s.tick();return [s,{}];},
    'Westport was rebooting for a patch, so Eastvale, 2 behind, was promoted. Its ID counter was at B4, so it handed out <span class="no-t">B5 and B6 again</span>. The tracking-page cache still held the old B5 and B6: two recipients could see a stranger’s name and address.',
    'This mirrors the book’s GitHub incident: an out-of-date MySQL follower became leader, reused primary keys that a Redis store also used, and private data reached the wrong users.'],
   ['Old leader comes back',()=>{const s=fol2('async',1,'async',2);for(let j=0;j<5;j++)s.tick();s.crash();s.promote('W');s.tick();s.S.back=true;s.tick();return [s,{}];},
    'The old leader restarts still believing it leads. One merchant API server with old settings keeps writing to it. Now <span class="no-t">two different B6s</span> exist on two leaders: '+L.g('split-brain','split brain')+'.',
    'With no way to resolve the conflict, data is lost or corrupted. Some systems shut one node down when they see two leaders, but a badly designed safety catch can shut down both.'],
   ['Timeout too short, load spike',()=>{const s=fol2('async',1,'async',2);for(let j=0;j<5;j++)s.tick();s.crash(true);s.promote('W');return [s,{}];},
    bar(240,150,'Leader silent 8 seconds; the timeout line sits at 5 seconds','busy 8 s','timeout 5 s')+'Peak Week spike: the leader was <span class="am-t">busy, not dead</span>, silent for 8 s with a 5 s timeout (illustrative numbers). A needless failover, which also dropped B5.',
    'An unnecessary failover adds work to a system that is already struggling with load or network trouble, making things worse, not better.'],
   ['Timeout too long, real crash',()=>{const s=fol2('async',1,'async',2);for(let j=0;j<5;j++)s.tick();s.crash();return [s,{refused:3}];},
    bar(230,298,'The leader is dead and the 5-minute timeout has not run out yet','dead, still waiting…','timeout 5 min')+'The leader really died, but the timeout is 5 minutes (illustrative). <span class="no-t">Every booking fails</span> until it runs out and someone is promoted.',
    'The longer the timeout, the longer recovery takes after a real failure. There is no setting that is both quick and safe.']];
  P.forEach((p,j)=>{const b=document.createElement('button');b.className='chip';b.id='f6p'+j;b.textContent=p[0];
    b.onclick=()=>{[...L.$('#f6b').children].forEach(x=>x.classList.toggle('sel',x===b));const r=p[1]();T.draw(r[0].vm(Object.assign({min:7},r[1])));
      L.$('#f6r').innerHTML=p[2]+'<div class="small" style="margin-top:6px">'+p[3]+'</div>';tried.add(j);
      if(tried.size>=3&&!L.$('#f6ok')){L.$('#f6').insertAdjacentHTML('beforeend','<span id="f6ok"></span>');
        L.sheet('info','No easy fixes','Lost writes, reused IDs, two leaders, and a timeout that is wrong either way. That’s why some operations teams fail over by hand, even when the software can do it automatically.');L.done();}};
    L.$('#f6b').appendChild(b);});}},
{part:2,src:'Chapter 5 · Handling Node Outages',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which failover problem?',['Lost writes','Split brain','Timeout too short','Timeout too long'],[
   ['During a Peak Week spike, the leader answers slowly for 8 seconds. Failover kicks in, and the cluster spends 10 minutes reshuffling while overloaded.',2,'The leader wasn’t dead, just busy. A short timeout turned a slow moment into an unneeded failover that made things worse.'],
   ['The leader really died, but nothing happened for 5 minutes. No bookings could be made the whole time.',3,'A long timeout means a long wait before recovery starts after a real failure.'],
   ['After failover, a merchant finds that a parcel they booked just before the crash doesn’t exist.',0,'The new leader never received it, and the old leader’s unreplicated writes were discarded.'],
   ['A network glitch cuts the leader off. A follower is promoted, but the old leader is still running and taking writes from some servers.',1,'Two nodes both acting as leader is split brain. Writes on both sides can clash or get lost.']]);}},
{part:2,src:'Chapter 5 · Handling Node Outages',pts:1,
 solve:async L=>{L.$('#c7Ws').click();L.$('#c7Ea').click();L.$('#c7t1').click();L.$('#c7go').click();await waitFor(L,()=>L.$('#c7ok'),5000);},
 run(L){
  const C={W:'async',E:'async',t:0},TO=['5 s','30 s','5 min'];let first=true,running=false;
  L.h(L.kick('pr','Challenge')+'<h1 class="q">Set up the Parcel DB for a rough night: a load spike at 01:00 (leader silent 10&nbsp;s), then a real leader crash at 03:00. The Eastvale link is slow (3&nbsp;s).</h1>'+CSS+
   '<div class="small">Pass all four (limits are illustrative): no confirmed booking lost · no booking waits over 2 s · no needless failover · bookings down at most a minute.</div>'+
   '<div class="rt-pick"><span>Westport (1 s)</span><div class="lz-row"><button class="chip" id="c7Ws">Sync</button><button class="chip sel" id="c7Wa">Async</button></div></div>'+
   '<div class="rt-pick"><span>Eastvale (3 s)</span><div class="lz-row"><button class="chip" id="c7Es">Sync</button><button class="chip sel" id="c7Ea">Async</button></div></div>'+
   '<div class="rt-pick"><span>Timeout</span><div class="lz-row">'+TO.map((t,j)=>'<button class="chip'+(j===0?' sel':'')+'" id="c7t'+j+'">'+t+'</button>').join('')+'</div></div>'+
   '<div class="rt-btns"><button class="btn pri" id="c7go">'+L.ic('play')+'Run the night</button></div><div id="c7"></div><div id="c7res"></div>');
  const T=Track(L.$('#c7'),'c7s','The race track for the scripted night');
  T.draw(fol2('async',1,'async',3).vm({min:7}));
  ['W','E'].forEach(k=>{const s=L.$('#c7'+k+'s'),a=L.$('#c7'+k+'a');s.onclick=()=>{C[k]='sync';s.classList.add('sel');a.classList.remove('sel');};a.onclick=()=>{C[k]='async';a.classList.add('sel');s.classList.remove('sel');};});
  TO.forEach((t,j)=>{L.$('#c7t'+j).onclick=()=>{C.t=j;TO.forEach((x,i)=>L.$('#c7t'+i).classList.toggle('sel',i===j));};});
  L.$('#c7go').onclick=async()=>{if(running)return;running=true;L.$('#c7go').disabled=true;L.$('#c7res').innerHTML='';
    const sim=fol2(C.W,1,C.E,3);
    for(let j=0;j<6;j++){sim.tick();T.draw(sim.vm({min:7}));await L.sleep(220);if(!T.alive())return;}
    sim.crash();T.draw(sim.vm({min:7}));await L.sleep(350);if(!T.alive())return;
    if(C.t!==2)sim.promote(best(sim));T.draw(sim.vm(C.t===2?{min:7,refused:2}:{min:7}));
    const I=sim.info(),wait=Math.max(0,...['W','E'].filter(k=>C[k]==='sync').map(k=>k==='W'?1:3));
    const rows=[[I.lostC.length===0,'No confirmed booking lost',I.lostC.length?'lost '+I.lostC.map(x=>'B'+x).join(', '):''],
      [wait<=2,'No booking waits over 2 s',wait>2?'each waits '+wait+' s for Eastvale':''],
      [C.t!==0,'No needless failover at 01:00',C.t===0?'10 s of silence beat the 5 s timeout':''],
      [C.t!==2,'Bookings down at most a minute',C.t===2?'down for 5 minutes':'']];
    if(C.t===2){const s2=fol2(C.W,1,C.E,3);for(let j=0;j<6;j++)s2.tick();s2.crash();s2.promote(best(s2));rows[0][0]=s2.info().lostC.length===0;rows[0][2]=rows[0][0]?'':'lost '+s2.info().lostC.map(x=>'B'+x).join(', ')+' once someone is promoted';}
    const sx=v=>(12+Math.log10(v)/Math.log10(300)*284).toFixed(1),tv=[5,30,300][C.t],tx0=sx(tv);
    const night='<svg viewBox="0 0 310 92" style="width:100%;display:block;margin:8px 0 2px" role="img" aria-label="The night against the timeout: the 10 second spike, then the real crash, which lasts until the timeout of '+TO[C.t]+'">'+
      tx(12,13,'01:00 spike · silent 10 s','font-size:11.5px;font-weight:700;fill:var(--h3)')+'<rect x="12" y="19" width="'+(sx(10)-12)+'" height="12" rx="4" style="fill:var(--h3)"/>'+
      tx(12,51,'03:00 crash · no leader until the timeout','font-size:11.5px;font-weight:700;fill:var(--no)')+'<rect x="12" y="57" width="'+(tx0-12)+'" height="12" rx="4" style="fill:var(--no-bg);stroke:var(--no);stroke-width:1.2"/>'+
      '<path d="M'+tx0+' 16V34M'+tx0+' 54V74" style="stroke:var(--pri);stroke-width:2.5;stroke-dasharray:4 3"/>'+
      tx(tx0,88,'timeout '+TO[C.t],'font-size:11.5px;font-weight:700;fill:var(--pri-deep);text-anchor:'+(C.t===2?'end':'middle'))+'</svg>';
    L.$('#c7res').innerHTML=night+'<div class="rt-read"><table class="chal">'+rows.map(r=>'<tr><td style="width:24px">'+(r[0]?'<span class="ok-t">✓</span>':'<span class="no-t">✗</span>')+'</td><td>'+r[1]+(r[2]?' <span class="small">('+r[2]+')</span>':'')+'</td></tr>').join('')+'</table></div>';
    const pass=rows.every(r=>r[0]);if(first){first=false;L.award(pass);}
    running=false;L.$('#c7go').disabled=false;
    if(pass){L.$('#c7go').disabled=true;L.$('#c7res').insertAdjacentHTML('beforeend','<span id="c7ok"></span>');
      L.sheet('ok','The night passes','Westport sync, Eastvale async: semi-synchronous, so every confirmed booking is on Westport, the follower failover promotes. Eastvale’s slow link never holds up a booking. A 30 s timeout rides out the 10 s spike but recovers quickly from the real crash.');L.done();}
    else L.sheet('no','Not yet','Look at the red lines. One sync follower protects confirmed bookings, but a slow sync follower makes every booking wait. The timeout has to sit between the spike and a minute. Change a setting and run it again.');};}},

/* ---------- PART 4: REPLICATION LOGS ---------- */
{part:3,src:'Chapter 5 · Implementation of Replication Logs',run(L){
  const F=[['var(--h4)','Statement-based','SQL text','UPDATE parcels SET pickup_code = RAND()\nWHERE id = 7','Compact; RAND() or a new run order breaks it.'],
    ['var(--h3)',L.g('wal','WAL')+' shipping','disk bytes','block 4711 +0x1c: 12 d5 9a 40','Exact; tied to engine version. PostgreSQL.'],
    ['var(--h2)','Logical log','row values','update parcels id=7: pickup_code=4821\ncommit','Decoupled, easy to read. MySQL binlog.'],
    ['var(--h1)','Trigger-based','your code','trigger → changes table → copier','Flexible; slower, buggier. Bucardo.']];
  L.h(L.kick('learn','What goes in the log?')+'<h1 class="q">Four ways to write the same change into the log</h1>'+CSS+
   F.map(f=>'<div class="fmt" style="border-color:'+f[0]+'"><div class="ft"><span style="color:'+f[0]+';font-size:14px;font-weight:700">'+f[1]+'</span><span style="color:var(--muted)">'+f[2]+'</span></div><div class="mono">'+f[3]+'</div><div class="small" style="margin-top:4px">'+f[4]+'</div></div>').join('')+
   '<p class="cap">One change, four encodings. The choice decides if followers rebuild the same row, can run another version, and if other systems can read along.</p>');
  L.done();}},
{part:3,src:'Chapter 5 · Implementation of Replication Logs',
 solve:async L=>{for(let s=0;s<5;s++)for(let f=0;f<4;f++){L.$('#lz'+s+f).click();await L.sleep(5);}},
 run(L){
  let cur=[0,0];const seen=new Set();
  L.h(L.kick('pr','Hands on · the format lens')+'<h1 class="q">Tap a cell to run booking B7 through a format in a situation. Where does each format break?</h1>'+CSS+
   '<p class="small" style="margin:0">Rows are situations; columns are the four log formats. Reveal 8+ cells, including Stmt × RAND() and WAL × Upgrade.</p>'+
   '<div class="lz-grid" id="lzg"></div><div id="lzo" class="lz-out na" aria-live="polite"></div><div id="lzw" class="rt-read" style="background:var(--card);border:2px solid var(--line)"></div>');
  let g='<div></div>'+LZ_F.map(f=>'<div class="h">'+f[0]+'</div>').join('');
  LZ_S.forEach((sc,s)=>{g+='<div class="rh">'+sc[0]+'</div>'+LZ_F.map((f,fi)=>'<div class="c" role="button" tabindex="0" id="lz'+s+fi+'" aria-label="'+f[1]+' with '+sc[1]+'">'+(s===0&&fi===0?'tap':'?')+'</div>').join('');});
  L.$('#lzg').innerHTML=g;L.$('#lz00').classList.add('cur');
  function show(s,fi){cur=[s,fi];const r=LZ[s][fi],sc=LZ_S[s];seen.add(s+'-'+fi);
    const c=L.$('#lz'+s+fi);c.className='c '+r[0];c.textContent=r[0]==='ok'?'✓':r[0]==='no'?'✗':'–';
    L.$$('#lzg .c').forEach(x=>x.classList.toggle('cur',x===c));
    L.$('#lzw').innerHTML='<div class="small"><b>'+sc[1]+'.</b> '+sc[2]+'</div><div class="rt-lbl" style="margin:8px 0 0">'+LZ_F[fi][1]+': the leader sends</div><div class="mono" style="background:var(--soft)">'+(LZ_SEND_S[s]||LZ_SEND)[fi]+'</div>';
    const o=L.$('#lzo');o.className='lz-out '+r[0];o.innerHTML='<span class="vd">'+(r[0]==='ok'?'✓ ':r[0]==='no'?'✗ ':'– ')+r[1]+'.</span> '+r[2];
    if(seen.size>=8&&seen.has('0-0')&&seen.has('2-1')&&!L.$('#lzdone')){L.$('#lzw').insertAdjacentHTML('afterend','<span id="lzdone"></span>');
      L.sheet('info','Each format has its breaking point','Statement-based breaks on anything nondeterministic or order-dependent. WAL shipping ties leader and followers to one storage format. The logical log avoids both and doubles as change data capture. Triggers trade speed and safety for flexibility.');L.done();}}
  LZ_S.forEach((sc,s)=>LZ_F.forEach((f,fi)=>{const c=L.$('#lz'+s+fi);c.onclick=()=>show(s,fi);c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show(s,fi);}};}));
  L.$('#lzw').innerHTML='<div class="small">What the leader sends shows here. “–” means the book doesn’t weigh that case.</div>';
  L.$('#lzo').innerHTML='Start with the top-left cell: a statement log meets RAND().';}},
{part:3,src:'Chapter 5 · Implementation of Replication Logs',pts:4,run(L){
  L.h(L.kick('pr','Pick the log')+'<h1 class="q">Which replication method fits, or explains, each situation?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Statement','WAL shipping','Logical','Trigger'],[
   ['Followers end up with different “booked at” times because the statement used NOW()',0,'Replaying a statement re-runs NOW() on each follower.'],
   ['Only Nordhaven parcels must be copied into a partner company’s different database',3,'Copying a subset into another kind of database needs application logic: triggers.'],
   ['Followers must run the exact same version as the leader, so upgrades need downtime',1,'WAL shipping copies disk-block changes, so it’s tied to the storage format.'],
   ['Linh wants a stream of row changes to feed the warehouse and the support search',2,'A logical row-based log is easy for outside systems to read: change data capture.']],
   'Statement-based is compact but fragile; WAL shipping is exact but coupled; logical logs are decoupled and readable; triggers are flexible but slower.');}},
{part:3,src:'Chapter 5 · Logical (row-based) log replication',pts:1,run(L){

/* follower controls for the explore screen (defined after use is fine: function declarations hoist) */
function folCtl(p,sim,ks){
  return '<div class="rt-fc">'+ks.map(k=>{const f=sim.F(k);return '<div class="rt-f"><div class="rt-fh"><span class="rt-dot" style="border-color:'+RT_COL[k]+';color:'+RT_COL[k]+'">'+k+'</span><b>'+RT_NAME[k]+'</b>'+
    '<span class="rt-seg"><button class="chip'+(f.mode==='sync'?' sel':'')+'" id="'+p+'m'+k+'s">Sync</button><button class="chip'+(f.mode==='async'?' sel':'')+'" id="'+p+'m'+k+'a">Async</button></span></div>'+
    '<label class="rt-rng"><span>Delay</span><input type="range" min="0" max="4" step="1" value="'+f.d+'" id="'+p+'d'+k+'" aria-label="'+RT_NAME[k]+' delay in seconds"><b id="'+p+'d'+k+'v">'+f.d+' s</b></label></div>';}).join('')+'</div>';
}
function bindFol(L,p,sim,ks,onCh){ks.forEach(k=>{const f=sim.F(k);
  const s=L.$('#'+p+'m'+k+'s'),a=L.$('#'+p+'m'+k+'a');
  const set=m=>{f.mode=m;s.classList.toggle('sel',m==='sync');a.classList.toggle('sel',m==='async');sim.settle();onCh();};
  s.onclick=()=>set('sync');a.onclick=()=>set('async');
  const r=L.$('#'+p+'d'+k);r.oninput=()=>{f.d=+r.value;L.$('#'+p+'d'+k+'v').textContent=f.d+' s';onCh();};});}
</script>
