/* =====================================================================
   Lesson 0027 only. Two hands-on models used across the lesson:
   1. Flow  – stage progress curves for Linh’s workflow, with a task grid
              underneath: MapReduce (wait + write replicated files between jobs) versus a
              dataflow engine (records stream between operators), stragglers,
              sorts, a crashed machine and a random vs seeded sample.

              minutes from Westport Central, round by round, with checkpoints,
              a crash, a plain-MapReduce-loop comparison and machine placement.
   All minutes are illustrative.
   ===================================================================== */

/* tap-to-reveal for the extra facts on a Learn screen */
const MORE=(label,html)=>'<details class="bx-more"><summary>'+label+'</summary><div>'+html+'</div></details>';

const COL=['var(--h1)','var(--h2)','var(--h3)','var(--h4)','var(--ok-strong)'];
const COLB=['var(--h1-bg)','var(--h2-bg)','var(--h3-bg)','var(--h4-bg)'];
const tx=(x,y,s,st)=>'<text x="'+x+'" y="'+y+'" style="'+st+'">'+s+'</text>';
const rr=(x,y,w,h,f,s,r,extra)=>'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+(r==null?8:r)+'" style="fill:'+f+';stroke:'+s+';stroke-width:1.6'+(extra||'')+'"/>';
const AR=id=>'<defs><marker id="'+id+'" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--muted)"/></marker></defs>';
const line=(d,st,mk)=>'<path d="'+d+'" style="fill:none;'+(st||'stroke:var(--muted);stroke-width:1.8')+'"'+(mk?' marker-end="url(#'+mk+')"':'')+'/>';
/* a distributed-filesystem file: a stack of copies on several machines (the book gives no number) */
function dfs(x,y,lab){
  let s='';for(let k=2;k>=0;k--)s+=rr(x+k*4,y-k*4,30,24,'var(--h4-bg)','var(--h4)',5);
  for(let k=0;k<3;k++)s+='<rect x="'+(x+7)+'" y="'+(y+6+k*4.5)+'" width="16" height="2" rx="1" style="fill:var(--h4)"/>';
  return s+(lab?tx(x+19,y+40,lab,'font-size:11px;text-anchor:middle;fill:var(--muted)'):'');}
const X11='font-size:11px;fill:var(--muted)',B12='font-size:12px;font-weight:700;fill:var(--ink)',HD='font-size:11px;font-weight:700;fill:var(--muted)';

/* ---------- 1. Flow: stage progress curves + task grid ---------- */
const WF=[{n:'Clean',k:'s',d:10},{n:'Convert',k:'s',d:8},{n:'Sort & count',k:'b',d:6}];
function simFlow(stages,eng,strag,crash,det){
  const dt=.25,P=4,LG=4,M=4,S=stages.length,nT=s=>stages[s].one?1:P;
  const x=stages.map((_,s)=>new Array(nT(s)).fill(0)),H=stages.map((_,s)=>[...Array(nT(s))].map(()=>[]));
  const mean=stages.map(()=>[]),doneAt=new Array(S).fill(null),startAt=new Array(S).fill(null);
  const ci=crash?Math.round(crash.t/dt):-1;let fin=null,lost=0;
  const up=(s,p,j)=>j<0?0:H[s][p][Math.min(j,H[s][p].length-1)];
  for(let i=0;i<2400;i++){
    const t=i*dt;
    if(i===ci){crash.stages.forEach(s=>{x[s][crash.p]=0;doneAt[s]=null;});
      if(!det&&crash.kill!=null){x[crash.kill].forEach((v,p)=>{lost=Math.max(lost,v);x[crash.kill][p]=0;});doneAt[crash.kill]=null;}}
    for(let s=0;s<S;s++){let m=0;for(let p=0;p<nT(s);p++){H[s][p].push(x[s][p]);m+=x[s][p];}mean[s].push(m/nT(s));}
    if(x[S-1].every(v=>v>=1)){fin=t;break;}
    for(let s=0;s<S;s++)for(let p=0;p<nT(s);p++){
      let av;
      if(s===0)av=1;
      else if(eng==='mr')av=(doneAt[s-1]!=null&&t>=doneAt[s-1]+M-1e-9)?1:0;
      else{const pn=nT(s-1);
        if(stages[s].k==='b')av=[...Array(pn)].every((_,q)=>up(s-1,q,i-LG)>=1)?1:0;
        else if(pn!==nT(s))av=[...Array(pn)].reduce((a,_,q)=>a+up(s-1,q,i-LG),0)/pn;
        else av=up(s-1,p,i-LG);}
      const d=(s===0&&p===P-1&&strag)?Math.max(stages[0].d,strag):stages[s].d;
      let v=Math.max(x[s][p],Math.min(1,x[s][p]+dt/d,av));if(v>.9999)v=1;x[s][p]=v;}
    for(let s=0;s<S;s++){if(doneAt[s]==null&&x[s].every(v=>v>=1))doneAt[s]=t+dt;if(startAt[s]==null&&x[s].some(v=>v>0))startAt[s]=t;}
  }
  return {mean,H,doneAt,startAt,fin,dt,M,lost,S};
}
function Flow(L,host,o){
  o=Object.assign({id:'f',stages:WF,eng:'mr',strag:10,engCtl:false,stragCtl:false,playCtl:true,crash:null,det:true,xMax:null,read:null,on:()=>{}},o||{});
  const st={eng:o.eng,strag:o.strag,stages:o.stages,crash:o.crash,det:o.det,xMax:o.xMax,crashOn:false,tag:0};
  const ID=o.id;
  host.insertAdjacentHTML('beforeend','<div class="bx-flow">'+
    (o.engCtl?'<div class="bx-ctl" id="'+ID+'-eng" role="group" aria-label="Engine"><button class="chip" data-e="mr">MapReduce</button><button class="chip" data-e="df">Dataflow engine</button></div>':'')+
    (o.stragCtl?'<div class="bx-rng"><label for="'+ID+'-s">Slowest Clean task</label><input type="range" id="'+ID+'-s" min="10" max="40" step="2" value="'+st.strag+'"><b id="'+ID+'-sv"></b></div>':'')+
    '<div class="bx-read" id="'+ID+'-rd" aria-live="polite"></div>'+
    '<svg id="'+ID+'-svg" viewBox="0 0 320 226" role="img" aria-label="Top: a chart of each stage’s progress over time. Bottom: a grid of tasks, one row per part of the input, one column per stage."></svg>'+
    (o.playCtl?'<div class="bx-ctl"><button class="btn" id="'+ID+'-pl">'+L.ic('play')+'Play it over time</button></div>':'')+
    '</div>');
  const $=s=>host.querySelector(s),svg=$('#'+ID+'-svg');
  let res,R,xMax,cur=null;
  function compute(){
    const c=st.crashOn?st.crash:null;
    res={mr:simFlow(st.stages,'mr',st.strag,null,st.det),df:simFlow(st.stages,'df',st.strag,c,st.det)};
    if(c)res.dfPlain=simFlow(st.stages,'df',st.strag,null,st.det);
    R=res[st.eng];
    xMax=st.xMax||Math.ceil(Math.max(res.mr.fin,res.df.fin)*1.06/10)*10;
  }
  function draw(tC){
    if(!svg.isConnected)return;
    const r=R,S=r.S,T=tC==null?r.fin:tC,iC=Math.min(Math.round(T/r.dt),r.mean[0].length-1);
    const X=t=>36+t/xMax*276,Y=v=>12+(1-v)*100;
    let s='';
    const step=xMax>70?20:10;
    for(let t=0;t<=xMax+1e-9;t+=step)s+='<line x1="'+X(t)+'" y1="12" x2="'+X(t)+'" y2="112" style="stroke:var(--line);stroke-width:1"/>'+tx(X(t),125,String(t),'font-size:11px;fill:var(--muted);text-anchor:middle');
    [0,.5,1].forEach(v=>{s+='<line x1="36" y1="'+Y(v)+'" x2="312" y2="'+Y(v)+'" style="stroke:var(--line);stroke-width:1"/>';});
    s+=tx(32,16,'100%','font-size:11px;fill:var(--muted);text-anchor:end')+tx(30,125,'min','font-size:11px;fill:var(--muted);text-anchor:end');
    if(st.eng==='mr')for(let k=0;k<S-1;k++){const d=r.doneAt[k];if(d!=null&&d<=T){const w=X(Math.min(d+r.M,T))-X(d);
      s+='<rect x="'+X(d)+'" y="12" width="'+Math.max(w,0)+'" height="100" style="fill:var(--h4-bg);stroke:none"/>';}}
    if(st.crashOn&&st.eng==='df'&&T>=st.crash.t){const cx=X(st.crash.t);
      s+='<line x1="'+cx+'" y1="12" x2="'+cx+'" y2="112" style="stroke:var(--no);stroke-width:1.6;stroke-dasharray:3 3"/><path d="M'+(cx-5)+' 3l10 10m0 -10l-10 10" style="stroke:var(--no);stroke-width:2.6;stroke-linecap:round"/>';}
    for(let k=0;k<S;k++){const m=r.mean[k];let d='';for(let j=0;j<=iC;j+=2)d+=(d?'L':'M')+X(j*r.dt).toFixed(1)+' '+Y(m[j]).toFixed(1);
      d+='L'+X(iC*r.dt).toFixed(1)+' '+Y(m[iC]).toFixed(1);
      s+='<path d="'+d+'" style="fill:none;stroke:'+COL[k%COL.length]+';stroke-width:'+(S>6?1.8:2.8)+';stroke-linejoin:round;stroke-linecap:round"/>';}
    if(tC!=null&&tC<r.fin)s+='<line x1="'+X(T)+'" y1="12" x2="'+X(T)+'" y2="112" style="stroke:var(--pri);stroke-width:1.6"/>';
    /* task grid */
    const y0=138,gx=40,gap=S>6?3:8,cw=(274-(S-1)*gap)/S,rh=15,rg=3;
    s+=tx(4,y0+10,'input','font-size:11px;font-weight:700;fill:var(--muted)');
    for(let k=0;k<S;k++){const cx=gx+k*(cw+gap);
      s+=tx(cx+cw/2,y0+10,S>6?String(k+1):(S>3&&st.stages[k].sh)||st.stages[k].n,'font-size:11px;font-weight:700;text-anchor:middle;fill:'+COL[k%COL.length]);}
    const lin=st.crashOn&&st.eng==='df'&&T>=st.crash.t;
    for(let p=0;p<4;p++){const y=y0+16+p*(rh+rg),hot=lin&&p===st.crash.p;
      s+=rr(4,y,30,rh,'var(--h4-bg)',hot?'var(--pri)':'var(--h4)',4,hot?';stroke-width:2.4':'')+tx(19,y+11.5,'B'+(p+1),'font-size:11px;font-weight:700;text-anchor:middle;fill:var(--h4)');}
    for(let k=0;k<S;k++){const cx=gx+k*(cw+gap),one=st.stages[k].one;
      for(let p=0;p<(one?1:4);p++){const y=y0+16+p*(rh+rg),h=one?4*rh+3*rg:rh,v=r.H[k][p][Math.min(iC,r.H[k][p].length-1)];
        let stroke='var(--line2)',ex='';
        if(lin&&st.crash.stages.includes(k)&&p===st.crash.p){stroke='var(--pri)';ex=';stroke-width:2.4;stroke-dasharray:4 2';}
        if(lin&&!st.det&&k===st.crash.kill){stroke='var(--no)';ex=';stroke-width:2.4';}
        s+=rr(cx,y,cw,h,'var(--soft)',stroke,4,ex)+'<rect x="'+cx+'" y="'+y+'" width="'+(cw*v).toFixed(1)+'" height="'+h+'" rx="4" style="fill:'+COL[k%COL.length]+';opacity:.85"/>';
        if(one&&cw>40)s+=tx(cx+cw/2,y+h/2+4,Math.round(v*100)+'%','font-size:11px;font-weight:700;text-anchor:middle;fill:var(--ink)');}}
    svg.innerHTML=s;
    const rd=$('#'+ID+'-rd');
    if(o.read)rd.innerHTML=o.read(res,st,T,R);
    else{const fin=Math.round(R.fin),cs=Math.round(R.startAt[1]),cp=st.eng==='mr'?S:1;
      rd.innerHTML='<b>'+(st.eng==='mr'?'MapReduce':'Dataflow engine')+': done at min '+fin+'</b> · '+st.stages[1].n+' starts at min '+cs+
       '<br><span class="sm">Files copied to several machines on the distributed filesystem: '+cp+'</span><span class="bx-tally">'+'<i></i>'.repeat(cp)+'</span>'+
       (o.engCtl?'<br><span class="sm">'+(st.eng==='mr'?'Dataflow engine':'MapReduce')+' would finish at min '+Math.round(res[st.eng==='mr'?'df':'mr'].fin)+'. Times are illustrative.</span>':'<br><span class="sm">Times are illustrative.</span>');}
    if(o.engCtl)host.querySelectorAll('#'+ID+'-eng .chip').forEach(b=>b.classList.toggle('sel',b.dataset.e===st.eng));
    if(o.stragCtl)$('#'+ID+'-sv').textContent=st.strag+' min';
  }
  function play(ms){
    ms=ms||1700;const tag=++st.tag,end=R.fin,t0=performance.now();
    return new Promise(res=>{(function f(){
      if(!svg.isConnected||tag!==st.tag){res();return;}
      const p=Math.min(1,(performance.now()-t0)/ms);cur=p*end;draw(p<1?cur:null);
      if(p<1)setTimeout(f,30);else res();})();});
  }
  function set(p,anim){Object.assign(st,p);st.tag++;compute();if(anim)return play();draw();return Promise.resolve();}
  if(o.playCtl)$('#'+ID+'-pl').onclick=()=>{st.tag++;play();};
  if(o.engCtl)host.querySelectorAll('#'+ID+'-eng .chip').forEach(b=>{b.onclick=()=>{set({eng:b.dataset.e});o.on({type:'eng',eng:st.eng});};});
  if(o.stragCtl){const sl=$('#'+ID+'-s');sl.addEventListener('input',()=>{set({strag:+sl.value});o.on({type:'strag',v:+sl.value});});}
  compute();draw();
  return {st,set,play,res:()=>res,R:()=>R};
}

/* ---------- 2. Steps: Pregel superstep table on the hub network ---------- */
const GV=[['WC','Westport Central',24,62],['WN','Westport North',92,22],['WS','Westport South',92,102],['W1','Zone W1',150,54],
          ['W2','Zone W2',160,102],['W3','Zone W3',234,108],['ED','Eastvale Depot',262,34],['E1','Zone E1',298,92]];
const GE=[[0,1,12],[0,2,9],[1,3,6],[2,4,7],[3,5,5,.72],[4,5,4],[1,6,40],[2,6,30],[4,6,18],[6,7,8]];
const NB=GV.map((_,v)=>GE.filter(e=>e[0]===v||e[1]===v).map(e=>[e[0]===v?e[1]:e[0],e[2]]));
const ROUNDS=(()=>{const R=[];const val=GV.map(()=>Infinity);val[0]=0;
  let msgs=NB[0].map(([u,w])=>[0,u,w]);R.push({val:val.slice(),recv:[0],imp:[0],msgs});
  for(let g=0;g<20&&msgs.length;g++){const inbox={};msgs.forEach(([f,u,m])=>{inbox[u]=Math.min(inbox[u]==null?Infinity:inbox[u],m);});
    const recv=Object.keys(inbox).map(Number).sort((a,b)=>a-b),imp=recv.filter(u=>inbox[u]<val[u]);imp.forEach(u=>{val[u]=inbox[u];});
    msgs=[];imp.forEach(v=>NB[v].forEach(([u,w])=>msgs.push([v,u,val[v]+w])));R.push({val:val.slice(),recv,imp,msgs});}
  return R;})();
function netSVG(o){
  o=o||{};const val=o.val,recv=o.recv||[],imp=o.imp||[],msgs=o.msgs||[],showW=o.showW!==false;
  let s='';
  GE.forEach(e=>{const [a,b,w]=e,A=GV[a],B=GV[b],hot=msgs.some(m=>(m[0]===a&&m[1]===b)||(m[0]===b&&m[1]===a));
    s+='<line x1="'+A[2]+'" y1="'+A[3]+'" x2="'+B[2]+'" y2="'+B[3]+'" style="stroke:'+(hot?'var(--pri)':'var(--line2)')+';stroke-width:'+(hot?2.6:1.6)+'"/>';
    if(showW){const f=e[3]||.5,mx=A[2]+(B[2]-A[2])*f,my=A[3]+(B[3]-A[3])*f;s+='<text x="'+mx+'" y="'+(my+4)+'" style="font-size:11px;font-weight:600;text-anchor:middle;fill:var(--muted);paint-order:stroke;stroke:var(--card);stroke-width:4px">'+w+'</text>';}});
  msgs.forEach(([f,u])=>{const A=GV[f],B=GV[u],x=A[2]+(B[2]-A[2])*.68,y=A[3]+(B[3]-A[3])*.68;s+='<circle cx="'+x+'" cy="'+y+'" r="4" style="fill:var(--pri)"/>';});
  GV.forEach((v,k)=>{let f='var(--card)',st='var(--line2)',d='';
    if(val){if(imp.includes(k)){f='var(--ok-bg)';st='var(--ok-line)';}else if(recv.includes(k)){f='var(--h3-bg)';st='var(--h3)';}else if(val[k]===Infinity){d=';stroke-dasharray:3 3';}else{f='var(--soft)';}}
    if(o.mach){f=o.mach[k];}
    s+='<circle cx="'+v[2]+'" cy="'+v[3]+'" r="14" style="fill:'+f+';stroke:'+st+';stroke-width:2'+d+'"/>'+tx(v[2],v[3]+4,v[0],'font-size:11px;font-weight:700;text-anchor:middle;fill:var(--ink)');
    const lo=(k===7||k===0)?[-16,-12,'end']:k===4?[-17,-12,'end']:[16,-12,'start'];
    if(val&&val[k]!==Infinity)s+='<text x="'+(v[2]+lo[0])+'" y="'+(v[3]+lo[1])+'" style="font-size:11.5px;font-weight:700;text-anchor:'+lo[2]+';fill:var(--pri-deep);paint-order:stroke;stroke:var(--card);stroke-width:4px">'+val[k]+'</text>';});
  return s;
}
function Steps(L,host,o){
  o=Object.assign({id:'g',ctl:true,top:false,on:()=>{}},o||{});
  const ID=o.id,st={cur:0,ck:1,armed:false,lost:new Set(),crashAt:null,redone:0,ckw:1,mode:'pregel',place:'2',busy:false};
  const RD='<div class="bx-read" id="'+ID+'-rd" aria-live="polite"></div>';
  host.insertAdjacentHTML('beforeend','<div class="bx-steps">'+(o.top?RD:'')+'<svg id="'+ID+'-svg" viewBox="0 0 320 334" role="img" aria-label="Top: Otterpost’s hub network with travel minutes on each road. Bottom: a table, one row per hub or zone, one column per round, showing each one’s best travel minutes from Westport Central."></svg>'+
    '<div class="bx-ctl" id="'+ID+'-c"><button class="btn pri" id="'+ID+'-nx">'+L.ic('play')+'Next round</button><button class="btn" id="'+ID+'-rs">'+L.ic('cycle')+'Reset</button></div>'+
    (o.top?'':RD)+'</div>');
  const $=s=>host.querySelector(s),svg=$('#'+ID+'-svg'),last=ROUNDS.length-1;
  const mach=v=>st.place==='1'?0:st.place==='many'?v:v%2;
  function counts(){let pw=0,mw=0,msg=0,cross=0;for(let k=0;k<=st.cur;k++){pw+=ROUNDS[k].recv.length;mw+=GV.length;}
    const m=ROUNDS[st.cur].msgs;msg=m.length;cross=m.filter(([f,u])=>mach(f)!==mach(u)).length;
    let tm=0,tc=0;for(let k=0;k<=st.cur;k++){ROUNDS[k].msgs.forEach(([f,u])=>{tm++;if(mach(f)!==mach(u))tc++;});}
    return {pw,mw,msg,cross,tm,tc};}
  function draw(){
    if(!svg.isConnected)return;
    const r=ROUNDS[st.cur];
    let s='<g>'+netSVG({val:r.val,recv:st.mode==='mr'?GV.map((_,k)=>k):r.recv,imp:r.imp,msgs:st.cur<last?r.msgs:[]})+'</g>';
    const y0=134,nx=102,cw=(316-nx)/ROUNDS.length,rh=19;
    s+=tx(4,y0+12,'Round','font-size:11px;font-weight:700;fill:var(--muted)');
    ROUNDS.forEach((_,k)=>{const cx=nx+k*cw+cw/2,ck=k%st.ck===0;
      s+=tx(cx,y0+12,String(k),'font-size:11.5px;font-weight:700;text-anchor:middle;fill:'+(k===st.cur?'var(--pri-deep)':'var(--muted)'));
      if(ck)s+='<rect x="'+(cx-9)+'" y="'+(y0+16)+'" width="18" height="4" rx="2" style="fill:var(--h4)"/>';
      if(st.crashAt===k)s+='<path d="M'+(cx+8)+' '+(y0+1)+'l9 9m0 -9l-9 9" style="stroke:var(--no);stroke-width:2.4;stroke-linecap:round"/>';});
    GV.forEach((v,j)=>{const y=y0+24+j*rh;
      s+=tx(4,y+13,v[1],'font-size:11px;font-weight:600;fill:var(--ink)');
      ROUNDS.forEach((R,k)=>{const x=nx+k*cw+1.5,w=cw-3;
        if(k<=st.cur){const imp=R.imp.includes(j),got=st.mode==='mr'||R.recv.includes(j),vv=R.val[j];
          const f=imp?'var(--ok-bg)':got?'var(--h3-bg)':'var(--soft)',sc=imp?'var(--ok-line)':got?'var(--h3)':'var(--line)';
          s+=rr(x,y+1,w,rh-3,f,sc,5)+tx(x+w/2,y+13,vv===Infinity?'–':vv,'font-size:11.5px;font-weight:'+(imp?700:500)+';text-anchor:middle;fill:'+(got||imp?'var(--ink)':'var(--faint)'));}
        else if(st.lost.has(k)){s+=rr(x,y+1,w,rh-3,'var(--no-bg)','var(--no-line)',5,';stroke-dasharray:3 2');}
        else s+=rr(x,y+1,w,rh-3,'none','var(--line)',5,';stroke-dasharray:2 3');});});
    /* legend, inside the picture */
    const ly=y0+24+GV.length*rh+14;let lx=4;
    [['var(--ok-bg)','var(--ok-line)','improved'],['var(--h3-bg)','var(--h3)','got messages'],['var(--soft)','var(--line)','no work']].forEach(([f,sc,t])=>{
      s+=rr(lx,ly-9,12,11,f,sc,3)+tx(lx+16,ly,t,'font-size:11px;fill:var(--muted)');lx+=16+t.length*5.8+10;});
    s+='<rect x="'+lx+'" y="'+(ly-6)+'" width="14" height="4" rx="2" style="fill:var(--h4)"/>'+tx(lx+18,ly,'checkpoint','font-size:11px;fill:var(--muted)');
    svg.innerHTML=s;
    const c=counts();
    $('#'+ID+'-rd').innerHTML='<b>Round '+st.cur+(st.cur===last?' · nothing changed: done':'')+'</b> · messages sent: '+c.msg+
      '<br><span class="sm">Vertex work so far: '+(st.mode==='mr'?'<b>plain loop '+c.mw+'</b> (Pregel: '+c.pw+')':'<b>Pregel '+c.pw+'</b> (plain loop: '+c.mw+')')+
      '<br>Messages crossing machines: '+c.tc+' of '+c.tm+(st.place==='1'?' (one machine)':st.place==='many'?' (one machine per vertex)':' (2 machines, split by ID)')+
      '<br>Checkpoint every '+(st.ck===1?'round':st.ck+' rounds')+' · rounds redone: <b>'+st.redone+'</b> · minutes are illustrative</span>';
    $('#'+ID+'-nx').disabled=st.cur>=last||st.busy;
  }
  function next(){
    if(st.cur>=last)return null;const r=st.cur+1;
    if(st.armed){st.armed=false;st.crashAt=r;let c=st.cur;while(c%st.ck!==0)c--;for(let k=c+1;k<=r;k++)st.lost.add(k);st.redone+=r-c;st.cur=c;draw();o.on({type:'crash',from:r,to:c});return 'crash';}
    st.cur=r;st.lost.delete(r);if(r%st.ck===0)st.ckw++;draw();o.on({type:'next',cur:r});return 'next';}
  function reset(p){Object.assign(st,{cur:0,armed:false,lost:new Set(),crashAt:null,redone:0,ckw:1},p||{});draw();}
  $('#'+ID+'-nx').onclick=()=>next();
  $('#'+ID+'-rs').onclick=()=>{reset();o.on({type:'reset'});};
  if(!o.ctl)$('#'+ID+'-c').style.display='none';
  draw();
  return {st,next,reset,draw,last};
}

Course.lesson({
  id:'0027', title:'Beyond MapReduce', minutes:20, icon:'cycle',
  goals:['See why waiting for whole stages and writing every in-between result slows MapReduce workflows, and how dataflow engines avoid it','Keep a batch job safe to recompute by making its operators deterministic','Choose between a Pregel-style graph job and a single machine'],
  parts:['Intermediate state','Dataflow engines','Graphs','High-level APIs'],
  read:'Read “Beyond MapReduce” and the summary at the end of chapter 10 for the full comparison of execution engines.',
  glossary:{
    materialize:'Materialization: computing a result eagerly and writing it out (for example to files), instead of computing it on demand or streaming it straight to the next step.',
    dataflow:'Dataflow engine: a batch engine such as Spark, Tez or Flink that runs a whole workflow as one job, passing data between flexible processing steps called operators.',
    deterministic:'Deterministic: given the same input, it always produces exactly the same output. Random numbers, clocks and outside lookups break this.',
    pregel:'Pregel model (bulk synchronous parallel): a way to process a whole graph in rounds. In each round every vertex reads the messages sent to it, updates its own state and sends messages to other vertices.',
    straggler:'Straggler: a task that takes much longer than the others in its stage, for example because of skew or a busy machine.'
  },
  cheatsheet:[
    'MapReduce <b>materializes</b> every in-between result on the distributed filesystem: each job waits for the slowest task of the one before, extra map steps repeat work, and temporary files get copied to several machines.',
    'Publish outputs that many teams reuse by name. Data that only passes from one step to the next is <b>intermediate state</b>.',
    '<b>Dataflow engines</b> (Spark, Tez, Flink) run a whole workflow as one job of operators, wired by repartition-and-sort, partition-only or broadcast, and sort only where needed.',
    'They recover by <b>recomputing</b> lost parts from earlier data, so make operators <b>deterministic</b>: no unseeded randomness, clock reads, outside lookups or hash-table ordering.',
    'A sort must see its whole input before it outputs anything; most other steps can be <b>pipelined</b>. Inputs and final outputs still live on the distributed filesystem.',
    '<b>Pregel</b>: each vertex keeps its state and swaps messages in fixed rounds; checkpoints at round ends make it fault-tolerant. If the graph fits on one machine, one machine is likely faster.',
    'High-level APIs add <b>declarative</b> joins and filters, so optimizers pick join algorithms and read only the needed columns, while still allowing arbitrary code.',
    'Batch input is <b>bounded</b>, so a job finishes. Streams (next chapter) never do.'
  ],
  steps:[
/* ---------- PART 1: INTERMEDIATE STATE ---------- */

   MORE('How much of it?','Big workflows, such as recommendation systems built from 50 to 100 MapReduce jobs, create a lot of intermediate state.'));

    L.$('#pk'+j).classList.add('sel');[0,1,2].forEach(q=>{L.$('#pk'+q).disabled=true;});

    const r=F.res();
    L.sheet(j===0?'ok':'no',j===0?'Right: records flow as soon as they exist':'Not on a dataflow engine',
      'MapReduce (first run): Convert waits for the straggler <b>and</b> the write, starting at min '+Math.round(r.mr.startAt[1])+'. Dataflow (now showing): Convert starts at min '+Math.round(r.df.startAt[1])+', and only the part behind the slow task lags. Done at min '+Math.round(r.df.fin)+' instead of '+Math.round(r.mr.fin)+'. Flip the engines to compare.');};});
  }},
{part:1,src:'Chapter 10 · Dataflow engines',
 solve:async L=>{for(const k of [0,1,2])L.$('#ep'+k).click();},
 run(L){
  L.h(L.kick('ex','Edge cases')+'<h1 class="q">Where does the dataflow engine’s advantage grow, and where does it shrink? Try each case on both engines.</h1>'+CSS+
   '<div class="bx-ctl" id="eps"><button class="chip" id="ep0">One straggler</button><button class="chip" id="ep1">A sort mid-way</button><button class="chip" id="ep2">12 jobs</button></div><div id="f10"></div>');
  const P=[{stages:WF,strag:40,xMax:null},
    {stages:[{n:'Clean',k:'s',d:10},{n:'Sort',k:'b',d:8},{n:'Routes',k:'s',d:6}],strag:16,xMax:null},
    {stages:[...Array(12)].map((_,k)=>({n:String(k+1),k:(k===5||k===11)?'b':'s',d:3})),strag:0,xMax:null}];
  const C=[
    ['A slow Clean task (40 min)','<b>MapReduce:</b> everything downstream waits for it. <b>Dataflow:</b> only the one part behind it lags, and the last step, a sort, waits for that part. The gap is big.'],
    ['Convert is now a sort','A sort must read <b>all</b> its input before it outputs anything, so even the dataflow engine waits for the slow Clean task here. What it still saves: no replicated file written between steps.'],
    ['12 jobs in a row','Every MapReduce boundary adds a write and a new job, so long chains pay again and again. The dataflow engine pipelines all 12 and only pauses at its two sorts.']];
  const tried=new Set();let cur=-1;
  const F=Flow(L,L.$('#f10'),{id:'f10',eng:'mr',engCtl:true,
    read:res=>(cur<0?'<b>Baseline</b> · ':'<b>'+C[cur][0]+'</b> · ')+'MapReduce '+Math.round(res.mr.fin)+' min, dataflow '+Math.round(res.df.fin)+' min'+
      '<br>'+(cur<0?'Pick a case above, then flip the engine.':C[cur][1])+'<br><span class="sm">Times are illustrative.</span>'});
  [0,1,2].forEach(k=>{L.$('#ep'+k).onclick=()=>{cur=k;tried.add(k);[0,1,2].forEach(q=>L.$('#ep'+q).classList.toggle('sel',q===k));
    F.set(P[k]);
    if(tried.size===3){L.sheet('info','The limits of the speed-up','Pipelining helps most where many steps can stream. Sorts are hard stops. And none of this changes the input and final output: those are still files on the distributed filesystem.');L.done();}};});
  }},
{part:1,src:'Chapter 10 · Fault tolerance',run(L){
  L.h(L.kick('learn','Fault tolerance')+'<h1 class="q">No durable copy, so recompute</h1>'+CSS+FIG_LINEAGE()+
   '<p class="bx-cap">In-between data isn’t on the filesystem, so when a machine dies the engine <b>recomputes</b> what it held. It must know how each part was made.</p>'+
   MORE('When writing it out wins','MapReduce simply reruns a failed task from its files. For a dataflow engine, recomputing isn’t always best: if the in-between data is much smaller than the source, or very CPU-heavy to compute, writing it to files is likely cheaper.'));
  L.done();}},
{part:1,src:'Chapter 10 · Fault tolerance',
 solve:async L=>{L.$('#sd0').click();L.$('#cr').click();await L.sleep(50);L.$('#sd1').click();await L.$('#cr').onclick();},
 run(L){
  L.h(L.kick('ex','Break it · a lost machine')+'<h1 class="q">Linh’s job samples 1% of GPS pings, then averages speed per zone. Crash machine 3 with each kind of sample.</h1>'+CSS+
   '<div class="bx-ctl" id="sd"><button class="chip" id="sd0">Random each run</button><button class="chip" id="sd1">Fixed seed</button></div>'+
   '<div class="bx-ctl"><button class="btn pri" id="cr">'+L.ic('alert')+'Machine 3 dies at min 6</button></div><div id="f12"></div>');
  const STG=[{n:'Read',k:'s',d:6},{n:'Sample 1%',k:'s',d:8},{n:'Average per zone',k:'s',d:12,one:true}];
  const CR={t:6,p:2,stages:[0,1],kill:2};
  let det=null,ran=false;const seen=new Set();
  const F=Flow(L,L.$('#f12'),{id:'f12',eng:'df',stages:STG,crash:CR,xMax:24,playCtl:false,
    read:(res,st,T)=>{
      if(!st.crashOn)return '<b>No crash yet.</b> Done at min '+Math.round(res.df.fin)+'.<br><span class="sm">Part 3 of Read and Sample runs on machine 3. Average per zone runs elsewhere and already receives sampled rows as they come. Times and speeds are illustrative.</span>';
      if(T<CR.t)return '<b>Running…</b>';
      return st.det?'<span class="bx-ok">Fixed seed:</span> the recomputed sample is the <b>same rows</b> the average already received. No contradiction: zone W4 stays 14.2 km/h. Only part 3 of Read and Sample reran (dashed purple, back to input block B3).<br><b>Done at min '+Math.round(res.df.fin)+'</b> (no crash: '+Math.round(res.dfPlain.fin)+')'
        :'<span class="bx-no">Random sample:</span> the rerun draws <b>different rows</b>. The average already holds some of the old ones: the old rows put zone W4 at 14.2 km/h, the new rows at 13.6. It can’t mix them, so it is killed and rerun: '+Math.round(res.df.lost*100)+'% of its work thrown away.<br><b>Done at min '+Math.round(res.df.fin)+'</b> (no crash: '+Math.round(res.dfPlain.fin)+')';}});
  const pick=j=>{det=j===1;[0,1].forEach(q=>L.$('#sd'+q).classList.toggle('sel',q===j));F.set({det,crashOn:false});};
  [0,1].forEach(j=>{L.$('#sd'+j).onclick=()=>pick(j);});
  L.$('#cr').onclick=async()=>{if(det===null){L.$('#f12-rd').innerHTML='Pick a kind of sample first.';return;}
    seen.add(det);const both=seen.size===2&&!ran;if(both)ran=true;await F.set({crashOn:true},true);
    if(both&&L.$('#f12')){L.sheet('info','Determinism makes recovery cheap','If recomputed data can differ from what was already sent downstream, the downstream operators must be killed and rerun too. A '+L.g('deterministic','deterministic')+' operator (same input, same output) avoids that cascade. A fixed seed makes “random” repeatable.');L.done();}};
  }},
{part:1,src:'Chapter 10 · Fault tolerance',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Safe to recompute?',['Deterministic','Not deterministic'],[
   ['An operator adds up delivered scans per zone.',0,'Same scans in, same totals out, every time.'],
   ['An operator stamps each record with the machine’s current clock time.',1,'Run it again and the clock reads differently. Use a time from the data instead.'],
   ['An operator looks up each courier’s vehicle in the live Parcel DB.',1,'Outside data can change between runs. A copy taken into the job’s input avoids that.'],
   ['An operator picks a random 1% sample using a fixed seed.',0,'A fixed seed produces the same pseudorandom numbers each run.'],
   ['An operator loops over a hash table and outputs the first entry it finds.',1,'Many languages don’t guarantee the order of a hash table, so the “first” entry can differ.']]);}},
{part:1,src:'Chapter 10 · Discussion of materialization',run(L){
  L.h(L.kick('learn','Pipes, not temp files')+'<h1 class="q">Most steps stream. A sort can’t.</h1>'+CSS+FIG_SORT()+
   '<p class="bx-cap">Dataflow engines pass records on like Unix pipes: <b>pipelined execution</b>. A sort can’t, because the last record in might belong first.</p>'+
   MORE('What you save, and what stays','MapReduce is like writing each command’s output to a temp file; Flink especially is built around pipelining. You save writing the intermediate state. Inputs stay unchanged, and the final output still replaces a whole dataset on the filesystem.'));
  L.done();}},
{part:1,src:'Chapter 10 · Discussion of materialization',pts:1,
 solve:async L=>{[1,2,4].forEach(k=>L.$('#op'+k).click());L.$('#ck').click();},
 run(L){
  L.h(L.kick('pr','Challenge')+'<h1 class="q">Linh’s route job starts with every step waiting for all its input. Let each step stream if it can, for the earliest correct finish.</h1>'+CSS+
   '<div class="bx-ops" id="ops"></div><div id="f15"></div><button class="btn pri" id="ck">'+L.ic('check')+'Check</button>');
  const OPS=[{n:'Read scans',sh:'Read',k:'s',d:6},{n:'Drop bad scans',sh:'Drop',k:'b',d:4},{n:'Add hub names',sh:'Hubs',k:'b',d:4},{n:'Sort by courier and time',sh:'Sort',k:'b',d:6},{n:'Build routes',sh:'Routes',k:'b',d:5}];
  const best=simFlow(OPS.map((o,k)=>Object.assign({},o,{k:k===3?'b':'s'})),'df',0,null,true).fin;
  const F=Flow(L,L.$('#f15'),{id:'f15',eng:'df',stages:OPS.map(o=>Object.assign({},o)),xMax:40,
    read:(res,st)=>'<b>Done at min '+Math.round(res.df.fin)+'</b><br><span class="sm">Each step: amber = waits for all input, teal = streams. Times are illustrative.</span>'});
  const box=L.$('#ops');
  OPS.forEach((o,k)=>{if(!k)return;box.insertAdjacentHTML('beforeend','<div class="bx-op"><b>'+o.n+'</b><button class="chip wait" id="op'+k+'" aria-pressed="false">waits for all</button></div>');
    L.$('#op'+k).onclick=function(){o.k=o.k==='b'?'s':'b';this.className='chip '+(o.k==='b'?'wait':'strm');this.textContent=o.k==='b'?'waits for all':'streams';this.setAttribute('aria-pressed',o.k==='s');
      F.set({stages:OPS.map(x=>Object.assign({},x))});};});
  let answered=false;
  L.$('#ck').onclick=()=>{if(answered)return;answered=true;
    const sortStreams=OPS[3].k==='s',extra=[1,2,4].filter(k=>OPS[k].k==='b').length,ok=!sortStreams&&extra===0;
    L.award(ok);
    if(ok)L.sheet('ok','Earliest correct finish: min '+Math.round(best),'Dropping, adding hub names (a broadcast join with a small table) and building routes from sorted records all work one record at a time, so they stream. Only the sort must wait.');
    else if(sortStreams)L.sheet('no','A sort can’t stream','The last scan read might belong first in the order, so the sort must hold everything before it outputs. The best plan streams the other three steps and keeps the sort waiting: done at min '+Math.round(best)+'.');
    else L.sheet('no','Correct, but slower than needed',extra+' step'+(extra>1?'s':'')+' still wait'+(extra>1?'':'s')+' for all input although '+(extra>1?'they work':'it works')+' one record at a time. Streaming them too, with only the sort waiting, finishes at min '+Math.round(best)+'.');
    L.done();};
  }},

/* ---------- PART 3: GRAPHS ---------- */
{part:2,src:'Chapter 10 · Graphs and Iterative Processing',run(L){
  L.h(L.kick('learn','Graphs in batch jobs')+'<h1 class="q">Process the whole graph, round after round</h1>'+CSS+FIG_GRAPHLOOP()+
   '<p class="bx-cap">Linh wants travel times from Westport Central to every hub. Like PageRank, this passes news along the roads, round after round. Plain MapReduce rereads the <b>whole</b> graph each round.</p>'+
   MORE('Naming trap: two kinds of “graph”','Dataflow engines arrange their operators as a graph too (a DAG, a directed acyclic graph). That isn’t graph processing: here the <i>data itself</i> is the graph.'));
  L.done();}},
{part:2,src:'Chapter 10 · The Pregel processing model',run(L){
  L.h(L.kick('learn','The Pregel model')+'<h1 class="q">Think like a vertex</h1>'+CSS+FIG_VERTEX()+
   '<p class="bx-cap">In the '+L.g('pregel','Pregel model')+', each vertex <b>keeps its state</b> and handles only new messages. No messages, no work.</p>'+
   MORE('Other names and relatives','Also called bulk synchronous parallel. Apache Giraph, Spark’s GraphX and Flink’s Gelly use it. A vertex gets every message sent to it, the way a reducer call gets every value for a key. It is like an actor, but vertex state and messages survive faults, and rounds are fixed.'));
  L.done();}},
{part:2,src:'Chapter 10 · The Pregel processing model',pts:1,
 solve:async L=>{L.$('#rq1').click();for(let k=0;k<8;k++){const b=L.$('#g18-nx');if(b&&!b.disabled)b.click();await L.sleep(10);}},
 run(L){
  L.h(L.kick('try','Predict, then watch')+'<h1 class="q">Eastvale Depot first hears a time in round 2. In which round does it settle on its final time?</h1>'+CSS+
   '<div class="bx-ctl" id="rq"><button class="chip" id="rq0">Round 2</button><button class="chip" id="rq1">Round 3</button><button class="chip" id="rq2">Round 4</button></div><div id="g18"></div>');
  let pick=null,fin=false;
  const G=Steps(L,L.$('#g18'),{id:'g18',on:e=>{
    if(e.type==='next'&&e.cur===G.last&&!fin){fin=true;const ok=pick===1;L.award(ok);
      L.sheet(ok?'ok':'no',ok?'Round 3: a longer route won':'It settled in round 3',
        'Round 2: Eastvale hears 39 min via Westport South (9 + 30). Round 3: a message arrives via Zone W2 (16 + 18 = 34), which is shorter, so it updates. Nothing shorter comes after. Grey cells did no work: Pregel only touches vertices that get messages.');L.done();}}});
  L.$('#g18-nx').disabled=true;
  const nx=L.$('#g18-nx');const orig=nx.onclick;nx.onclick=()=>{if(pick===null)return;orig();};
  [0,1,2].forEach(j=>{L.$('#rq'+j).onclick=()=>{if(pick!==null)return;pick=j;L.$('#rq'+j).classList.add('sel');[0,1,2].forEach(q=>{L.$('#rq'+q).disabled=true;});G.draw();};});
  }},
{part:2,src:'Chapter 10 · Fault tolerance',
 solve:async L=>{for(const k of [0,1,2,3])L.$('#gp'+k).click();},
 run(L){
  L.h(L.kick('ex','Edge cases')+'<h1 class="q">Crash a machine in round 3, run a plain MapReduce loop, spread vertices out. Try every case.</h1>'+CSS+
   '<div class="bx-pick two" id="gps"><button class="chip" id="gp0">Crash · checkpoint every 3 rounds</button><button class="chip" id="gp1">Crash · checkpoint every round</button><button class="chip" id="gp2">Plain MapReduce loop</button><button class="chip" id="gp3">Each vertex on its own machine</button></div>'+
   '<div class="bx-read" id="gpc">Pick a case, then use Next round to carry on.</div><div id="g19"></div>');
  const G=Steps(L,L.$('#g19'),{id:'g19',top:true});
  const C=[
   ['Rolled back to round 0','The last checkpoint was after round 0, so rounds 1 to 3 are lost (red) and must be redone. Fewer checkpoints means less writing, but more to redo.'],
   ['Rolled back to round 2','A checkpoint after every round means only round 3 is redone. The price: writing every vertex’s full state to durable storage each round.'],
   ['Plain MapReduce: every cell works','Each round reads all 8 vertices and writes a whole new copy, even when only a few changed. Compare the vertex work: Pregel skips the grey, quiet vertices.'],
   ['Messages all cross the network','The framework places vertices by ID with no attempt to group neighbours, so messages cross machines and can outgrow the graph itself. For a small graph, that overhead dominates.']];
  const tried=new Set();
  const run=async k=>{tried.add(k);[0,1,2,3].forEach(q=>L.$('#gp'+q).classList.toggle('sel',q===k));
    if(k<2){G.reset({ck:k===0?3:1,mode:'pregel',place:'2'});G.next();G.next();G.st.armed=true;G.next();}
    else{G.reset({ck:1,mode:k===2?'mr':'pregel',place:k===3?'many':'2'});for(let j=0;j<G.last;j++)G.next();}
    L.$('#gpc').innerHTML='<b>'+C[k][0]+'</b><br>'+C[k][1];
    if(tried.size===4){L.sheet('info','How Pregel survives, and what it costs','At the end of a round every vertex’s state can be checkpointed. After a crash, the simple fix rolls the whole graph back to the last checkpoint. If the algorithm is deterministic and messages are logged, only the lost partition needs recovering.');L.done();}};
  [0,1,2,3].forEach(k=>{L.$('#gp'+k).onclick=()=>run(k);});
  }},
{part:2,src:'Chapter 10 · Parallel execution',run(L){
  L.h(L.kick('learn','Parallel execution')+'<h1 class="q">Often, one machine wins</h1>'+CSS+FIG_SIZE()+
   '<p class="bx-cap">The framework places vertices by ID, not next to their neighbours, so messages flood the network. If the graph fits on one machine, use one.</p>'+
   MORE('What Pregel does promise','However the network loses, repeats or holds up messages, each vertex handles every message once and only once, in the round after it was sent.'));
  L.done();}},
{part:2,src:'Chapter 10 · Parallel execution',pts:1,run(L){
  L.h(L.kick('pr','Make the call')+'<h1 class="q">Tobias proposes a 40-machine Pregel cluster to compute travel times across Otterpost’s hub network: a few hundred hubs and zones. What should Linh say?</h1>');
  L.mc(L.card,['Use plain MapReduce, which suits repeated rounds','Add more machines, since graphs need lots of messages','Run it on one machine: the graph easily fits in memory'],2,
   'A graph this small fits in one machine’s memory, where a simple program avoids all the cross-machine messaging.',
   'Plain MapReduce rereads the whole graph every round, and more machines mean more messages crossing the network. A few hundred vertices fit in one machine’s memory, where a single-machine program is likely faster.');}},

/* ---------- PART 4: HIGH-LEVEL APIS ---------- */
{part:3,src:'Chapter 10 · The move toward declarative query languages',run(L){
  L.h(L.kick('learn','High-level APIs')+'<h1 class="q">Say what you want; let the engine choose how</h1>'+CSS+FIG_DECL()+
   '<p class="bx-cap">Declare a join, and an optimizer picks the algorithm and even the join order. Declare a filter, and only the needed columns are read.</p>'+
   MORE('Who offers it, and how it stays fast','Hive, Pig, Spark and Flink offer join, group, filter and aggregate; Hive, Spark and Flink have cost-based optimizers. It means less code and suits an interactive shell. Spark generates JVM bytecode and Impala uses LLVM for fast inner loops. You can still call any library from your own code.'));
  L.done();}},
{part:3,src:'Chapter 10 · The move toward declarative query languages',pts:4,run(L){
  L.h(L.kick('pr','Which side helps?')+'<h1 class="q">For each need in Linh’s jobs, which helps more: a declarative operator or arbitrary code?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Declarative operator','Arbitrary code'],[
   ['Choose between a broadcast and a sort-merge join for scans and couriers',0,'State the join; the optimizer looks at the inputs and picks the algorithm.'],
   ['Parse odd courier-app log lines with an existing open-source library',1,'Callbacks can call any library from the language’s ecosystem.'],
   ['Keep only Eastvale scans, reading just 2 of 40 columns',0,'A declared filter and field selection lets the engine read only those columns.'],
   ['Run an image-analysis library over proof-of-delivery photos',1,'Image analysis needs real code, not a query. Database user-defined functions are often clumsy for this.']],
   'Declarative pieces give the optimizer room to work; callbacks keep the door open to any code. Modern engines offer both.');}},
{part:3,src:'Chapter 10 · Specialization for different domains',run(L){
  L.h(L.kick('learn','Specialization')+'<h1 class="q">Batch engines and MPP databases grow alike</h1>'+CSS+FIG_CONVERGE()+
   '<p class="bx-cap">Patterns that keep coming back get reusable building blocks. In the end, both kinds of system just store and process data.</p>');
  L.done();}},
{part:3,src:'Chapter 10 · Summary',run(L){
  L.h(L.kick('learn','Chapter 10 in one picture')+'<h1 class="q">Two problems, two styles of answer</h1>'+CSS+FIG_SUM()+
   '<p class="bx-cap">Every batch engine must bring related records together and survive faults. That works because your callbacks have no side effects beyond their output, so the framework can retry tasks and discard failed output safely.</p>');
  L.done();}},
{part:3,src:'Chapter 10 · Summary',pts:1,run(L){
  L.h(L.kick('pr','Looking ahead')+'<h1 class="q">Linh’s nightly job always knows when it is done. Next month Linh starts processing the scan stream as it arrives. What changes?</h1>'+CSS+FIG_BOUND());
  L.mc(L.card,['Nothing: it still finishes once all scans are read','It must keep every result in memory to stay fast','Its input never ends, so the job never completes'],2,
   'Batch input is bounded, so a batch job finishes. A stream is unbounded: there may always be more scans coming, so the job never completes. That is chapter 11.',
   'A batch job finishes because its input has a fixed size. A stream of scans never ends, so a stream job is never complete. Memory isn’t the defining difference.');}}
  ]
});
</script>
