/* =====================================================================
   Lesson 0029 only. Two signature models, reused through the lesson:
   1. Cross: the dual-write crossing diagram. Two clients (a support
      agent sets parcel OP-48288's address to A, Mrs. Okoro sets B).
      Each client's write lands on the Parcel DB row, then on the
      support search row; a line joins one client's two writes. When
      the lines cross, the stores saw the writes in opposite orders and
      end with different values. Switch to CDC: search follows the
      Parcel DB's change log, so its dots move with the DB's order.
   2. The event scrubber: parcel OP-48288's lifecycle log with a read
      head; three state cards (tracking page, billing, support) are a
      fold of the events up to the head. Presets compact it, replay
      from a snapshot, and reject a command.
   ===================================================================== */
document.head.insertAdjacentHTML('beforeend','<style>'+
 '.card [hidden]{display:none!important}'+
 '.cx29 svg{width:100%;display:block;touch-action:none;-webkit-user-select:none;user-select:none}'+

 '.log29{list-style:none;margin:6px 0;padding:0;display:flex;flex-direction:column;gap:4px}'+
 '.log29 li{display:flex;align-items:center;gap:8px;border-radius:10px;padding:6px 9px;font-size:14px;line-height:1.3;background:var(--card);border:1.5px solid var(--line);transition:opacity .2s}'+

 '.log29.sm li{padding:3px 8px;font-size:13.5px}.log29 li .amt{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}'+

const arrowD=(x,y1,y2,col)=>'<path d="M'+x+' '+y1+' V'+(y2-7)+'" style="stroke:var(--'+(col||'muted')+');stroke-width:2"/><path d="M'+(x-5)+' '+(y2-8)+' l5 8 l5 -8z" style="fill:var(--'+(col||'muted')+')"/>';
const tx=(x,y,t,cls,extra)=>'<text x="'+x+'" y="'+y+'" class="'+(cls||'s29t')+'"'+(extra||'')+'>'+t+'</text>';
const txc=(x,y,t,cls,st)=>'<text x="'+x+'" y="'+y+'" text-anchor="middle" class="'+(cls||'s29t')+'"'+(st?' style="'+st+'"':'')+'>'+t+'</text>';
const box=(x,y,w,h,col,dash)=>'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="12" style="fill:var(--'+(col?col+'-bg':'soft')+');stroke:var(--'+(col||'line2')+');stroke-width:'+(col?2:1.5)+(dash?';stroke-dasharray:5 4':'')+'"/>';

const chips29=(x,y,arr,col)=>{let s='';arr.forEach(t=>{const w=Math.round(t.length*6.3+(t.match(/[A-Z]/g)||[]).length*2.5+18);s+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="24" rx="12" style="fill:var(--'+(col?col+'-bg':'card')+');stroke:var(--'+(col||'line2')+')"/>'+txc(x+w/2,y+16.5,t,'s29m','fill:var(--'+(col||'ink')+');font-weight:600');x+=w+6;});return s;};

/* ---------------- Signature 1: the dual-write crossing diagram ---------------- */
const XT=t=>22+t*2.4;                       /* time 0..100 -> x 22..262 */
const CK={A:'h1',B:'h2'};
function Cross(host,cfg){
  const c={mode:cfg.mode||'dual',w:{A:Object.assign({},cfg.w.A),B:Object.assign({},cfg.w.B)},fail:cfg.fail||null,down:false,lag:14,
    ghost:new Set(cfg.ghost||[]),drag:cfg.drag!==false,on:cfg.on||(()=>{}),read:cfg.read};
  host.innerHTML='<div class="cx29"><svg viewBox="0 0 340 236" role="img" aria-label="Crossing diagram: each client’s write lands on the Parcel DB row, then on the support search row. Each store keeps the last write it saw."></svg></div><div class="rd29" aria-live="polite"></div>';
  const svg=host.querySelector('svg'),rd=host.querySelector('.rd29');
  const Y={db:66,s:176};
  c.sT=k=>{
    if(c.mode==='dual')return c.w[k].s;
    const ord=['A','B'].sort((a,b)=>c.w[a].db-c.w[b].db||(a<b?-1:1));
    let prev=-99;const out={};
    ord.forEach(q=>{let t=c.w[q].db+c.lag;if(c.down&&t>=34&&t<=70)t=73;t=Math.max(t,prev+7);out[q]=t;prev=t;});
    return out[k];};
  c.res=()=>{
    const vis=(k,r)=>!c.ghost.has(k+r);
    const last=arr=>arr.length?arr.sort((a,b)=>a[0]-b[0]||(a[1]<b[1]?-1:1))[arr.length-1][1]:'old';
    const db=last(['A','B'].filter(k=>vis(k,'db')).map(k=>[c.w[k].db,k]));
    const s=last(['A','B'].filter(k=>vis(k,'s')&&!(c.mode==='dual'&&c.fail===k)).map(k=>[c.sT(k),k]));
    const crossed=c.mode==='dual'&&!c.fail&&(c.w.A.db-c.w.B.db)*(c.w.A.s-c.w.B.s)<0;
    return {db,s,crossed,same:db===s};};
  const defRead=R=>{
    if(c.mode==='cdc')return vd29(true,'In step')+'Search applies the Parcel DB’s changes in the same order, a moment later. Both end as <b>'+R.db+'</b>.'+(c.down?' Search was offline, so it picked up from its last offset and caught up.':'');
    if(c.fail)return vd29(false,'Out of step')+'Mrs. Okoro’s write to search <b>failed</b> after the Parcel DB took it. Parcel DB: <b>'+R.db+'</b>, search: <b>'+R.s+'</b>.';
    return R.same?vd29(true,'In step')+'Both end as <b>'+R.db+'</b>.':vd29(false,'Out of step')+'Parcel DB ends as <b>'+R.db+'</b>, search as <b>'+R.s+'</b>. No error was raised, so nobody is alerted.';};
  c.draw=()=>{
    const R=c.res();let s='';
    const mini=(x,y,k)=>'<circle cx="'+x+'" cy="'+y+'" r="9" style="fill:var(--'+CK[k]+'-bg);stroke:var(--'+CK[k]+');stroke-width:2"/>'+txc(x,y+4.5,k,'','font:700 12.5px var(--sans);fill:var(--'+CK[k]+')');
    s+=mini(17,16,'A')+tx(32,21,'Agent sets A')+mini(170,16,'B')+tx(185,21,'Mrs. Okoro sets B');
    [['db','Parcel DB'],['s',c.mode==='cdc'?'Support search · follows the log':'Support search']].forEach(([r,lab])=>{
      const y=Y[r],v=r==='db'?R.db:R.s,col=v==='old'?null:CK[v];
      s+=tx(10,y-22,lab)+'<rect x="8" y="'+(y-15)+'" width="258" height="30" rx="10" style="fill:var(--soft)"/>';
      s+='<rect x="274" y="'+(y-17)+'" width="60" height="34" rx="10" style="fill:var(--'+(col?col+'-bg':'card')+');stroke:var(--'+(col||'line2')+');stroke-width:2"/>'+txc(304,y+5,v==='old'?'old':v,'s29b','fill:var(--'+(col||'muted')+')');});
    s+=txc(304,Y.db-23,'ends as','s29m');
    if(c.mode==='cdc'&&c.down)s+='<rect x="'+XT(34)+'" y="'+(Y.s-15)+'" width="'+(XT(70)-XT(34))+'" height="30" style="fill:var(--no-bg);stroke:var(--no-line);stroke-dasharray:4 3"/>'+txc((XT(34)+XT(70))/2,Y.s+5,'offline','s29m','fill:var(--no)');
    if(c.mode==='cdc')s+='<rect x="8" y="110" width="258" height="22" rx="7" style="fill:var(--soft2)"/>';
    const ends={};
    ['A','B'].forEach(k=>{
      const x1=XT(c.w[k].db),x2=XT(c.sT(k)),f=c.mode==='dual'&&c.fail===k,gh=c.ghost.has(k+'db')||c.ghost.has(k+'s');
      ends[k]=[x1,x2];
      s+='<line x1="'+x1+'" y1="'+(Y.db+13)+'" x2="'+x2+'" y2="'+(Y.s-13)+'" style="stroke:var(--'+(f?'no':CK[k])+');stroke-width:2.5;'+(c.mode==='cdc'||f?'stroke-dasharray:5 4;':'')+(gh?'opacity:.25':'')+'"/>';});
    if(c.mode==='cdc')s+=txc(137,125.5,'change log, in the Parcel DB’s order','s29m','fill:var(--ink);paint-order:stroke;stroke:var(--soft2);stroke-width:4px;stroke-linejoin:round');
    if(R.crossed&&!c.ghost.size){const [a1,a2]=ends.A,[b1,b2]=ends.B,u=(b1-a1)/((a2-a1)-(b2-b1));
      if(u>0&&u<1)s+='<circle cx="'+(a1+u*(a2-a1))+'" cy="'+(Y.db+13+u*(Y.s-Y.db-26))+'" r="10" style="fill:none;stroke:var(--no);stroke-width:3"/>';}
    ['A','B'].forEach(k=>['db','s'].forEach(r=>{
      const t=r==='db'?c.w[k].db:c.sT(k),x=XT(t),y=Y[r],failed=c.mode==='dual'&&c.fail===k&&r==='s',gh=c.ghost.has(k+r);
      const dr=c.drag&&!gh&&(c.mode==='dual'||r==='db'),col=failed?'no':CK[k];
      s+='<g'+(dr?' class="dot" tabindex="0" role="slider" aria-label="When '+(k==='A'?'the agent':'Mrs. Okoro')+'’s write reaches '+(r==='db'?'the Parcel DB':'support search')+'" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+Math.round(t)+'"':'')+' data-d="'+k+r+'" style="'+(gh?'opacity:.3':'')+'">'+
        '<rect x="'+(x-20)+'" y="'+(y-22)+'" width="40" height="44" style="fill:transparent"/>'+
        '<circle cx="'+x+'" cy="'+y+'" r="13" style="fill:var(--'+col+'-bg);stroke:var(--'+col+');stroke-width:2.5'+(failed||gh?';stroke-dasharray:4 3':'')+'"/>'+
        txc(x,y+5,failed?'✗':k,'s29b','fill:var(--'+col+');pointer-events:none')+'</g>';}));
    s+='<text x="264" y="226" text-anchor="end" class="s29m">time →</text>';
    if(c.mode==='dual'&&c.drag)s+=tx(10,226,'drag the dots','s29m');
    svg.innerHTML=s;
    rd.innerHTML=c.read?c.read(R,c):defRead(R);
    return R;};
  c.set=(id,t)=>{const k=id[0],r=id.slice(1),w=c.w[k];
    if(r==='db'){w.db=Math.max(0,Math.min(c.mode==='cdc'?80:92,t));if(w.s<w.db+8)w.s=w.db+8;}
    else w.s=Math.max(w.db+8,Math.min(100,t));
    const R=c.draw();c.on(R,c);};
  c.get=id=>id.slice(1)==='db'?c.w[id[0]].db:c.w[id[0]].s;
  c.load=p=>{c.w={A:Object.assign({},p.A),B:Object.assign({},p.B)};c.fail=p.fail||null;return c.draw();};
  let dg=null;
  svg.addEventListener('pointerdown',e=>{const g=e.target.closest('.dot');if(!g)return;dg=g.dataset.d;try{svg.setPointerCapture(e.pointerId);}catch(_){}e.preventDefault();});
  svg.addEventListener('pointermove',e=>{if(!dg)return;const b=svg.getBoundingClientRect();c.set(dg,((e.clientX-b.left)/b.width*340-22)/2.4);});
  const up=()=>{dg=null;};svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
  svg.addEventListener('keydown',e=>{const g=e.target.closest('.dot');if(!g)return;const d={ArrowLeft:-5,ArrowDown:-5,ArrowRight:5,ArrowUp:5}[e.key];if(!d)return;
    e.preventDefault();const id=g.dataset.d;c.set(id,c.get(id)+d);const n=svg.querySelector('[data-d="'+id+'"]');if(n)n.focus();});
  c.defRead=defRead;
  c.draw();
  return c;
}
/* the solver moves a dot through its real keyboard control */
const nudge29=(L,id,dir,n)=>{for(let j=0;j<n;j++){const g=L.$('[data-d="'+id+'"]');g.dispatchEvent(new KeyboardEvent('keydown',{key:dir>0?'ArrowRight':'ArrowLeft',bubbles:true}));}};

/* ---------------- Signature 2: the event scrubber ---------------- */
const EV=[['book','Booked by Bramble & Bolt, slot 10–11'],['label','Label printed'],['pick','Picked up by Ravi'],['att','Delivery attempted, nobody home'],['redir','Mrs. Okoro: leave it on the porch'],['deliv','Delivered']];
function fold29(kinds){const s={status:'Not booked',safe:null,charged:0,att:0,n:0};
  kinds.forEach(k=>{s.n++;
    if(k==='book'){s.status='Booked';s.charged+=6;}
    else if(k==='label')s.status='Label printed';
    else if(k==='pick')s.status='Picked up';
    else if(k==='att'){s.status='Attempted';s.att++;}
    else if(k==='redir')s.safe='porch';
    else if(k==='deliv')s.status='Delivered';});
  return s;}
const TRUTH=fold29(EV.map(e=>e[0]));
function cards29(s,cmp){
  const bad=k=>cmp&&s[k]!==TRUTH[k];
  const v=(k,html)=>bad(k)?'<span class="bad">'+html+'</span>':html;
  const where=s.status==='Delivered'?(s.safe?' to the porch':'<span class="bad"> to… where?</span>'):'';
  const tCls=bad('safe')||bad('status')?' class="badc"':'',bCls=bad('charged')?' class="badc"':'',sCls=bad('att')?' class="badc"':'';
  return '<div class="st29"><div'+tCls+'><b>Tracking page</b>'+v('status',s.status)+where+'<br>Safe place: '+v('safe',s.safe||'none')+'</div>'+
   '<div'+bCls+'><b>Billing</b>'+v('charged','$'+s.charged.toFixed(2))+' charged</div>'+
   '<div'+sCls+'><b>Support</b>'+s.n+' event'+(s.n===1?'':'s')+'<br>'+v('att',s.att+' attempt'+(s.att===1?'':'s'))+'</div></div>';}
const logRows29=(rows,sm)=>'<ol class="log29'+(sm?' sm':'')+'">'+rows.map(r=>'<li class="'+(r.c||'')+'"><span class="o">'+r.o+'</span><span>'+r.t+'</span>'+(r.a?'<span class="amt">'+r.a+'</span>':'')+'</li>').join('')+'</ol>';

 ['w1','w2','w3'].map((w,j)=>'<rect x="'+(12+j*30)+'" y="6" width="26" height="22" rx="6" style="fill:var(--card);stroke:var(--line2)"/>'+txc(25+j*30,21.5,w,'s29m')+arrowD(25+j*30,30,54)).join('')+
 box(8,56,96,66,'h1')+txc(56,84,'Parcel DB')+txc(56,104,'leader','s29m')+
 arrowR(106,89,126)+txc(175,68,'replication log')+
 ['w1','w2','w3'].map((w,j)=>'<rect x="'+(128+j*32)+'" y="76" width="30" height="26" rx="5" style="fill:var(--pri-bg);stroke:var(--pri)"/>'+txc(143+j*32,94,w,'s29m','fill:var(--pri-deep)')).join('')+
 txc(175,122,'a stream of','s29m')+txc(175,138,'write events','s29m')+

const PIC_LEADERS='<svg class="pic29" viewBox="0 0 340 214" role="img" aria-label="Left: with dual writes the app writes to the Parcel DB and to search, two leaders. Right: one leader, the Parcel DB, and search follows its change log">'+

Course.lesson({
  id:'0029', title:'Databases and streams', minutes:22, icon:'list',
  goals:['Show why dual writes leave copies out of step, and how change data capture keeps them in step','Tell change data capture from event sourcing, a command from an event, and when compaction is safe','Derive state and new views from an immutable log, fix mistakes by appending, and know when you must truly delete'],
  parts:['Keeping in sync','Change data capture','Event sourcing','Immutability'],
  read:'Read “Databases and Streams” in chapter 11 for the book’s figures on dual writes, change data capture and state as the integral of a stream.',
  glossary:{
    event:'Event: a small, self-contained record of something that happened at a certain time, such as “parcel 88 scanned at Westport North hub at 09:14”. Once written, it never changes.',
    dualwrite:'Dual writes: the application itself writes each change to several systems, for example the database and then the search index. Easy to build, but the copies can drift apart.',
    cdc:'Change data capture: reading a database’s log of row changes so another system (a warehouse, a search index, a cache) can copy them.',
    compaction:'Compaction: rewriting log segments to throw away values that were overwritten or deleted, keeping only the latest value for each key.',
    snapshot:'Consistent snapshot: a copy of the whole database as it was at one moment, tied to an exact position in the replication log.',
    eventsourcing:'Event sourcing: building an application on an append-only log of immutable events that record what users did, and deriving the current state from that log.',
    'version-vector':'Version vector: a version number for each replica, kept with each key. It lets the database tell an overwrite from a concurrent write.',
    serializable:'Serializable isolation: the strongest level. Transactions may run at the same time, but the outcome matches running them one at a time.',
    cqrs:'CQRS (command query responsibility segregation): writing data in one form, such as an event log, and reading it from one or more different forms built for queries.'
  },
  cheatsheet:[
    'A <b>write to a database is an event</b>. A replication log is a stream of them; replicas that apply the same events in the same order end up the same.',
    '<b>Dual writes</b> break two ways: <b>races</b> (writes reach the systems in different orders, no error) and <b>partial failures</b> (one write fails). Root cause: two leaders.',
    '<b>Change data capture</b> makes the database the leader and derived systems its followers, fed in its order (with lag). Start a new follower from a <b>snapshot tied to a log offset</b>, or from offset 0 of a <b>compacted</b> topic.',
    '<b>Event sourcing</b> stores what users did as immutable, app-level events. State is a deterministic fold of the log. Later events don’t replace earlier ones, so no compaction by key.',
    'A <b>command</b> may fail; once validated it becomes an <b>event</b>, a fact consumers can’t reject. Validate before you write the event.',
    'State is the <b>integral</b> of the event stream; the log is the truth and the database a cache of its latest values. <b>Fix mistakes by appending</b> corrections, and derive <b>several read views</b> from one log (CQRS).',
    'Catch: log-derived views lag, so users may not read their own writes. Bonus: one self-contained event per action is a single, atomic append.',
    'High churn makes full history costly, and privacy or legal reasons can require <b>really deleting</b> (excision), which is hard because copies hide everywhere.'
  ],
  steps:[
/* ================= PART 1: KEEPING IN SYNC ================= */

   '<p class="capt">An '+L.g('event','event')+' records something that happened; a write is one. A '+L.g('replication','replication')+' log is a stream of them. Same events, same order, deterministic steps: every copy ends the same. That’s state machine replication.</p>');

 run(L){
  const PR=['Both end as B','Both end as A','Parcel DB: B, search: A','Parcel DB: A, search: B'];let p=null;
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">Today the agent’s write to search is slow. The faint dots show when each write will land. How will each system end up?</h1><div id="x5"></div>'+
   '<div class="row29" id="p5"></div><button class="btn pri" id="go5" hidden>'+L.ic('play')+'Play the writes</button>');
  const c=Cross(L.$('#x5'),{w:{A:{db:12,s:78},B:{db:34,s:52}},drag:false,ghost:['Adb','Bdb','Bs','As'],
    read:(R,c)=>c.ghost.size===4?'Nothing has landed yet. Both systems still hold the old address.':R.same?vd29(true,'In step')+'Both hold <b>'+R.db+'</b> so far.':vd29(false,'Out of step')+'Parcel DB holds <b>'+R.db+'</b>, search holds <b>'+R.s+'</b>.'});
  PR.forEach((t,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=t;
    b.onclick=()=>{if(p!==null)return;p=j;b.classList.add('sel');L.$('#go5').hidden=false;};L.$('#p5').appendChild(b);});
  L.$('#go5').onclick=function(){this.remove();const seq=['Adb','Bdb','Bs','As'];let k=0;
    const t=setInterval(()=>{if(!L.$('#x5')){clearInterval(t);return;}
      c.ghost.delete(seq[k]);c.draw();k++;
      if(k===seq.length){clearInterval(t);const ok=p===2;L.award(ok);
        L.sheet(ok?'ok':'no',ok?'You called it':'They end up different','Parcel DB: A then B, so B. Search: B then A, so A. They stay that way. Without extra tools such as '+L.g('version-vector','version vectors')+', nobody even notices the writes were concurrent.');L.done();}},480);};}},

{part:0,src:'Chapter 11 · Keeping Systems in Sync',
 solve:async L=>{for(let j=0;j<3;j++)L.$('#e6p'+j).click();},
 run(L){
  const P=[{nm:'No overlap',A:{db:10,s:28},B:{db:52,s:72},cap:'The agent finishes before Mrs. Okoro starts. Both systems see A, then B. Dual writes look fine when writes never overlap.'},
    {nm:'Writes overlap',A:{db:12,s:78},B:{db:34,s:52},cap:'A <b>race</b>: the two systems see the writes in opposite orders. Nothing failed, and no retry would help.'},
    {nm:'Second write fails',A:{db:10,s:28},B:{db:52,s:72},fail:'B',cap:'A <b>partial failure</b>: the Parcel DB took B, then the app crashed or search timed out. Making both succeed or both fail is atomic commit, which is costly.'}];
  const seen=new Set();let shown=false,cur=null;
  L.h(L.kick('ex','Edge cases')+'<h1 class="q">Where do dual writes hold up, and where do they break? Run each case.</h1>'+
   '<div class="row29">'+P.map((p,j)=>'<button class="chip" id="e6p'+j+'">'+p.nm+'</button>').join('')+'</div><div id="x6"></div>');
  const c=Cross(L.$('#x6'),{w:{A:{db:10,s:28},B:{db:52,s:72}},read:(R,c)=>cur?c.defRead(R)+'<br>'+cur.cap:'Pick a case, then drag the dots if you like.',on:(R,c)=>{if(cur){cur=null;c.draw();}}});
  P.forEach((p,j)=>{L.$('#e6p'+j).onclick=()=>{P.forEach((_,q)=>L.$('#e6p'+q).classList.toggle('sel',q===j));cur=p;c.load(p);seen.add(j);
    if(seen.size===P.length&&!shown){shown=true;L.sheet('info','Two ways to drift apart','A race needs no failure, only overlapping writes. A partial failure needs no race. Either way the copies disagree, and nothing fixes them later.');L.done();}};});}},

{part:0,src:'Chapter 11 · Keeping Systems in Sync',run(L){
  L.h(L.kick('learn','The root cause')+'<h1 class="q">Dual writes have two leaders</h1>'+PIC_LEADERS+
   '<p class="capt">The Parcel DB and search each accept writes, and neither follows the other, so nothing fixes one order: the multi-leader conflict problem again. With one'+L.g('leader','leader')+', the database, search could simply follow it.</p>');
  L.done();}},

/* ================= PART 2: CHANGE DATA CAPTURE ================= */
{part:1,src:'Chapter 11 · Change Data Capture',
 solve:async L=>{L.$('#m8c').click();nudge29(L,'Adb',1,8);},
 run(L){
  let swapped=false,shown=false;
  L.h(L.kick('ex','Flip the switch')+'<h1 class="q">Same race. Switch to '+L.g('cdc','change data capture')+': the app writes only to the Parcel DB, and search follows its log. Now try to make them disagree.</h1>'+
   '<div class="row29"><button class="chip sel" id="m8d">Dual writes</button><button class="chip" id="m8c">Change data capture</button><button class="chip" id="m8o" hidden>Search offline a while</button></div><div id="x8"></div>');
  const c=Cross(L.$('#x8'),{w:{A:{db:12,s:78},B:{db:34,s:52}},on:R=>{
    if(c.mode==='cdc'&&c.w.B.db<c.w.A.db)swapped=true;
    if(c.mode==='cdc'&&swapped&&!shown){shown=true;
      L.sheet('info','Search follows the leader','Whatever order the Parcel DB sees, search sees the same, a moment later. A log-based broker keeps the order, so redelivery can’t shuffle it. Derived systems are just consumers of the change stream.');L.done();}}});
  const mode=m=>{c.mode=m;L.$('#m8d').classList.toggle('sel',m==='dual');L.$('#m8c').classList.toggle('sel',m==='cdc');L.$('#m8o').hidden=m!=='cdc';
    if(m==='cdc'){['A','B'].forEach(k=>{c.w[k].db=Math.min(c.w[k].db,80);});}c.draw();};
  L.$('#m8d').onclick=()=>mode('dual');L.$('#m8c').onclick=()=>mode('cdc');
  L.$('#m8o').onclick=function(){c.down=!c.down;this.classList.toggle('sel',c.down);c.draw();};}},

{part:1,src:'Chapter 11 · Implementing change data capture',run(L){
  L.h(L.kick('learn','How CDC is built')+'<h1 class="q">Three ways to get the changes out</h1>'+PIC_CDCWAYS+
   '<p class="capt">The replication log was long a private, undocumented detail. CDC reads it anyway, usually asynchronously: a slow consumer barely slows the database, but every '+L.g('lag','replication lag')+' problem applies. Log parsing beats triggers, though schema changes need care.</p>');
  L.done();}},

{part:1,src:'Chapter 11 · Initial snapshot',pts:1,
 solve:async L=>{const r=L.$('#r10');r.value=27;r.dispatchEvent(new Event('input',{bubbles:true}));L.$('#k10').click();},
 run(L){
  const CH={21:'parcel 88 address → A',22:'parcel 90 booked',23:'parcel 91 at hub',24:'parcel 88 address → B',25:'parcel 92 booked',26:'parcel 90 picked up',27:'parcel 93 booked',28:'parcel 88 out for delivery',29:'parcel 91 delivered',30:'parcel 94 booked',31:'parcel 92 cancelled',32:'parcel 95 booked'};
  const SNAP=26;let first=true;
  L.h(L.kick('pr','Start a new index')+'<h1 class="q">Linh builds a fresh support search index. The log before offset 21 is gone, so they load a '+L.g('snapshot','snapshot')+' first. Where should the index start reading the log? <span class="ill29">illustrative offsets</span></h1>'+
   '<div id="s10"></div><div class="rng29"><label for="r10">Start reading at offset</label><b id="v10">32</b><input type="range" id="r10" min="21" max="32" step="1" value="32"></div>'+
   '<div class="rd29" id="o10"></div><button class="btn pri" id="k10">'+L.ic('check')+'Build the index</button>');
  const draw=()=>{const st=+L.$('#r10').value;L.$('#v10').textContent=st;
    let s='<svg class="pic29" viewBox="0 0 340 150" role="img" aria-label="Change log offsets 21 to 32, a snapshot covering everything up to 26, and where the index starts reading">';
    s+='<rect x="6" y="18" width="'+(34+(SNAP-21+1)*25-6)+'" height="16" rx="5" style="fill:var(--h3-bg);stroke:var(--h3)"/>'+tx(10,14,'snapshot: whole database as of offset 26','s29m','style="fill:var(--h3)"');
    s+='<rect x="6" y="40" width="24" height="34" rx="5" style="fill:var(--soft2)"/>'+txc(18,62,'…','s29m');
    for(let o=21;o<=32;o++){const x=34+(o-21)*25,inS=o<=SNAP,on=o>=st;
      const col=inS&&on?'h4':!inS&&!on?'no':!inS&&on?'ok':null;
      s+='<rect x="'+x+'" y="40" width="23" height="34" rx="5" style="fill:var(--'+(col?col+'-bg':'soft')+');stroke:var(--'+(col||'line')+');stroke-width:'+(col?2:1)+(col==='no'?';stroke-dasharray:4 3':'')+'"/>'+txc(x+11.5,62,String(o),'s29m','fill:var(--ink);font-size:12px');}
    const sx=34+(st-21)*25+11.5;
    s+='<path d="M'+sx+' 78 l-7 10 h14z" style="fill:var(--pri)"/>'+txc(Math.max(40,Math.min(300,sx)),104,'start here','s29t','fill:var(--pri)');
    s+=tx(8,138,'older log deleted','s29m');
    s+='<rect x="140" y="128" width="12" height="12" rx="3" style="fill:var(--h4-bg);stroke:var(--h4)"/>'+tx(156,138,'twice','s29m')+'<rect x="200" y="128" width="12" height="12" rx="3" style="fill:var(--no-bg);stroke:var(--no);stroke-dasharray:3 2"/>'+tx(216,138,'missed','s29m')+'<rect x="268" y="128" width="12" height="12" rx="3" style="fill:var(--ok-bg);stroke:var(--ok)"/>'+tx(284,138,'once','s29m');
    L.$('#s10').innerHTML=s+'</svg>';
    const miss=[],twice=[];for(let o=21;o<=32;o++){if(o>SNAP&&o<st)miss.push(o);if(o<=SNAP&&o>=st)twice.push(o);}
    L.$('#o10').innerHTML=miss.length?vd29(false,'Gap')+'Missed '+miss[0]+(miss.length>1?'–'+miss[miss.length-1]:'')+', such as “'+CH[miss[0]]+'”. The index never learns about '+(miss.length>1?'them':'it')+'.':
      twice.length?vd29(false,'Overlap')+'Changes '+twice[0]+(twice.length>1?'–'+twice[twice.length-1]:'')+' are already in the snapshot and get applied again. Harmless only if each change replaces the whole record; a count would double.':
      vd29(true,'Seamless')+'The snapshot ends at 26, and the log takes over at 27. Nothing missed, nothing repeated.';};
  L.$('#r10').addEventListener('input',draw);draw();
  L.$('#k10').onclick=()=>{const ok=+L.$('#r10').value===SNAP+1;
    if(first){first=false;L.award(ok);L.done();}
    L.sheet(ok?'ok':'no',ok?'Right after the snapshot':'Start at 27','A snapshot must match a known offset in the change log, so you know where to start applying changes. Some CDC tools do this for you; others leave it as a manual step.');};}},

{part:1,src:'Chapter 11 · Log compaction',pts:1,
 solve:async L=>{L.$('#p11').children[1].click();L.$('#k11').click();await L.sleep(700);},
 run(L){
  const LOG=[['88','at hub'],['91','picked up'],['88','on the van'],['93','picked up'],['91','at hub'],['93','tombstone (cancelled)'],['88','delivered'],['95','picked up']];
  const KEEP=[4,6,7];let p=null;const PR=['4 records','3 records','5 records'];
  const draw=done=>{let s='<svg class="pic29" viewBox="0 0 340 176" role="img" aria-label="Eight records of the Parcel DB change topic, keyed by parcel'+(done?'; after compaction only three remain':'')+'">';
    LOG.forEach((r,j)=>{const x=j%2?174:4,y=4+Math.floor(j/2)*43,gone=done&&!KEEP.includes(j),kept=done&&KEEP.includes(j),tomb=r[1].startsWith('tomb');
      s+='<g style="opacity:'+(gone?.35:1)+'"><rect x="'+x+'" y="'+y+'" width="162" height="37" rx="9" style="fill:var(--'+(kept?'ok-bg':tomb?'soft2':'card')+');stroke:var(--'+(kept?'ok':'line2')+');stroke-width:'+(kept?2:1.2)+'"/>'+
        tx(x+9,y+24,j+'','s29m','style="font-weight:700"')+tx(x+28,y+24,'parcel '+r[0]+' · '+r[1].replace(' (cancelled)','').replace('out for delivery','on the van'),'s29m','style="fill:var(--ink)"')+
        (gone?'<path d="M'+(x+8)+' '+(y+19)+' H'+(x+154)+'" style="stroke:var(--no);stroke-width:2"/>':'')+'</g>';});
    L.$('#g11').innerHTML=s+'</svg>';};
  L.h(L.kick('pr','Predict, then compact')+'<h1 class="q">Here is part of the Parcel DB change topic, keyed by parcel. Each record replaces the parcel’s whole row. After '+L.g('compaction','log compaction')+', how many records are left?</h1>'+
   '<div id="g11"></div><div class="row29" id="p11"></div><button class="btn pri" id="k11" hidden>'+L.ic('play')+'Compact the log</button>');
  draw(false);
  PR.forEach((t,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=t;b.onclick=()=>{if(p!==null)return;p=j;b.classList.add('sel');L.$('#k11').hidden=false;};L.$('#p11').appendChild(b);});
  L.$('#k11').onclick=function(){this.remove();setTimeout(()=>{if(!L.$('#g11'))return;draw(true);L.award(p===1);
    L.sheet(p===1?'ok':'no',p===1?'Three it is':'Three records are left','Parcels 88 and 91 keep only their latest row. The tombstone for 93 removes it entirely. What’s left is the current value of every key, so a new consumer can read from offset 0 and get a full copy, with no new snapshot. Kafka supports this.');L.done();},500);};}},

{part:1,src:'Chapter 11 · Initial snapshot',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'How should this consumer start?',['Take a new snapshot','Read the compacted topic from offset 0','Resume from its own offset'],[
   ['Linh adds an address-analytics store. The Parcel DB change topic is log-compacted.',1,'A compacted topic holds the latest value of every key, so reading it from the start gives a full copy.'],
   ['The change topic keeps only the last 7 days, not compacted. Linh wants a new cache of every parcel. <span class="ill29">illustrative</span>',0,'Seven days of changes miss parcels that didn’t change lately. Start from a consistent snapshot tied to an offset.'],
   ['Support search was down for 10 minutes. Its last offset is still in the log. <span class="ill29">illustrative</span>',2,'Nothing was lost. It carries on from its recorded offset, like a follower catching up.'],
   ['A new fraud model needs every merchant’s current settings. Only the last 2 days of changes are kept. <span class="ill29">illustrative</span>',0,'Two days of changes leave out merchants who haven’t changed anything lately. A snapshot is needed.']]);}},

/* ================= PART 3: EVENT SOURCING ================= */
{part:2,src:'Chapter 11 · Event Sourcing',run(L){
  L.h(L.kick('learn','Event sourcing')+'<h1 class="q">The same log idea, one level up</h1>'+PIC_LEVELS+
   '<p class="capt">'+L.g('eventsourcing','Event sourcing')+', from domain-driven design, also logs every change, but the app is built on it. It records what users did as immutable events, not how rows changed, so the app is easier to evolve and debug.</p>');
  L.done();}},

{part:2,src:'Chapter 11 · Event Sourcing',
 solve:async L=>{while(L.$('#n14'))L.$('#n14').click();},
 run(L){
  const T=['The book’s example: a student cancels a course enrollment. As an event it’s one neutral fact. As side effects, it bakes in guesses about how the data will be used.',
   'Later the school wants to offer the freed place to whoever is next in line. That new effect simply hangs off the existing event.',
   'At Otterpost, Mrs. Okoro redirects parcel 88 to their neighbour at no. 14. Linh records that action, not “address column overwritten”.',

  let k=0;
  L.h(L.kick('ex','What happened beats what changed')+'<h1 class="q">New features can hang off old events</h1><div id="i14"></div><div class="stepcap29" id="c14"></div><button class="btn pri" id="n14">Next '+L.ic('arrow')+'</button>');
  const draw=()=>{L.$('#i14').innerHTML=picES(k);L.$('#c14').innerHTML='<span class="n">Step '+(k+1)+' of 4</span>'+T[k];};draw();
  L.$('#n14').onclick=()=>{k++;draw();if(k===3){L.$('#n14').remove();L.done();}};}},

{part:2,src:'Chapter 11 · Deriving current state from the event log',
 solve:async L=>{const r=L.$('#r15');r.value=6;r.dispatchEvent(new Event('input',{bubbles:true}));r.value=3;r.dispatchEvent(new Event('input',{bubbles:true}));},
 run(L){
  let top=false,shown=false;
  L.h(L.kick('ex','Explore')+'<h1 class="q">Parcel 88’s lifecycle log. Drag the read head and watch three screens rebuild from the events.</h1>'+
   '<div id="l15"></div><div class="rng29"><label for="r15">Events applied</label><b id="v15">0 of 6</b><input type="range" id="r15" min="0" max="6" step="1" value="0"></div><div id="s15"></div>'+
   '<p class="capt sm">Go to the end, then back to before the porch event. What do the screens lose?</p>');

{part:2,src:'Chapter 11 · Commands and events',run(L){
  L.h(L.kick('learn','Commands and events')+'<h1 class="q">A command can fail. An event is a fact.</h1>'+PIC_CMD+
   '<p class="capt">Check before writing the event, say in a '+L.g('serializable','serializable')+' transaction that validates and publishes together. Or log a tentative reservation, then a confirming event. Changing the slot later is a new event; the reservation still happened.</p>');
  L.done();}},

{part:2,src:'Chapter 11 · Deriving current state from the event log',
 solve:async L=>{for(let j=0;j<4;j++)L.$('#e17p'+j).click();},
 run(L){
  const full=EV.map((e,j)=>({o:j,t:e[1]}));
  const P=[
   {nm:'Compact it',rows:EV.map((e,j)=>({o:j,t:e[1],c:j<5?'gone':''})),st:fold29(['deliv']),cmp:true,
    cap:vd29(false,'History lost')+'Only “Delivered” survives. The charge, the attempt and the porch came from earlier events. Events hold intents, so later ones don’t replace earlier ones: no compaction by key.'},
   {nm:'CDC rows',rows:[['v1','row 88: Booked · $6'],['v2','row 88: Label printed · $6'],['v3','row 88: Picked up · $6'],['v4','row 88: Attempted · 1 try · $6'],['v5','row 88: … · porch · $6'],['v6','row 88: Delivered · porch · 1 try · $6']].map((r,j)=>({o:r[0],t:r[1],c:j<5?'gone':''})),st:TRUTH,cmp:true,
    cap:vd29(true,'Nothing lost')+'A CDC record holds the whole new row, so the latest one per key says everything. Compaction is safe here.'},
   {nm:'Late command',rows:full.concat([{o:'✗',t:'Command: redirect 88 to no. 14. Rejected: already delivered',c:'cmd'}]),st:TRUTH,
    cap:vd29(true,'Log unchanged')+'The request was a command. It failed the check, so no event was written and no screen changed.'},
   {nm:'From a snapshot',rows:[{o:'S',t:'Snapshot after 3: Attempted · $6 · 1 try',c:'snap'}].concat(full.map((r,j)=>Object.assign({},r,{c:j<4?'off':''}))),st:TRUTH,cmp:true,
    cap:vd29(true,'Same state')+'Starting from a saved snapshot just skips work. Events 0–3 are still kept, so the full log can be replayed any time.'}];
  const seen=new Set();let shown=false;
  L.h(L.kick('ex','Edge cases')+'<h1 class="q">Push the log to its limits. Run each case and watch the screens.</h1>'+
   '<div class="row29">'+P.map((p,j)=>'<button class="chip" id="e17p'+j+'">'+p.nm+'</button>').join('')+'</div><div id="l17"></div><div id="s17"></div><div class="rd29" id="c17">Compact it: the lifecycle log, compacted by parcel. CDC rows: a CDC topic, compacted. Late command: a redirect after delivery. Red marks a wrong screen.</div>');
  const show=p=>{L.$('#l17').innerHTML=logRows29(p.rows);L.$('#s17').innerHTML=cards29(p.st,p.cmp);};
  show({rows:full,st:TRUTH});
  P.forEach((p,j)=>{L.$('#e17p'+j).onclick=()=>{P.forEach((_,q)=>L.$('#e17p'+q).classList.toggle('sel',q===j));show(p);L.$('#c17').innerHTML=p.cap;seen.add(j);
    if(seen.size===P.length&&!shown){shown=true;L.sheet('info','Where the log idea bends','Compaction fits CDC rows, not intent events. Commands are checked before they become events. Snapshots are only a shortcut: the raw events stay.');L.done();}};});}},

{part:2,src:'Chapter 11 · Commands and events',pts:5,run(L){
  L.h(L.kick('pr','Command or event?')+'<h1 class="q">Sort each item.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Command','Event'],[
   ['“Reserve the 14–15 slot for parcel 102,” just sent by the recipient’s app.',0,'It hasn’t been checked yet. The slot might be full, so it can still fail.'],
   ['“Slot 14–15 reserved for parcel 102,” written to the log after the check.',1,'It passed validation and was recorded. Now it’s a fact.'],
   ['“Parcel 102’s reservation cancelled,” recorded after the reservation.',1,'A cancellation is a new event. The reservation still happened.'],
   ['A merchant’s API request to book 500 parcels on credit it may not have.',0,'It still has to be checked against the credit balance, so it’s a command.'],
   ['What billing receives: “parcel 102 booked,” at a price billing thinks is wrong.',1,'It’s already in the log, so billing can’t reject it. Checks belong before the event is written.']],
   'A command is a request that may fail. Once validated, it becomes an event: a fact that consumers can’t refuse.');}},

/* ================= PART 4: IMMUTABILITY ================= */
{part:3,src:'Chapter 11 · State, Streams, and Immutability',run(L){
  L.h(L.kick('learn','State and streams')+'<h1 class="q">Changing state and an unchanging log are two sides of one coin</h1>'+PIC_INTEGRAL+
   '<p class="capt">Sum the stream to get the state; take the state’s changes to get the stream. Keep the changelog and the database is a cache of latest values. The analogy has limits: a second derivative of state seems meaningless.</p>'+
   L.quote('The truth is the log.','Pat Helland, quoted in chapter 11'));
  L.done();}},

{part:3,src:'Chapter 11 · Advantages of immutable events',pts:1,
 solve:async L=>{L.$('#a20r').click();},
 run(L){
  const base=[{o:'Mon',t:'Top-up',a:'+$5,000'},{o:'Tue',t:'300 parcels booked',a:'−$1,800'},{o:'Tue',t:'300 parcels booked (bug: charged twice)',a:'−$1,800',c:'bug'},{o:'Wed',t:'40 parcels booked',a:'−$240'}];
  const A={d:{rows:base.filter((_,j)=>j!==2).concat([]),bal:2960,hist:false,why:'The balance is right, but the double charge left no trace. Bramble & Bolt’s dashboard already showed $3,600 for Tuesday, and nothing explains the change.'},
    e:{rows:base.map((r,j)=>j===2?{o:'Tue',t:'300 parcels booked (edited)',a:'$0',c:'bug'}:r),bal:2960,hist:false,why:'The ledger now claims the second charge was $0. The record of what really happened is gone.'},
    r:{rows:base.concat([{o:'Thu',t:'Refund: Tuesday double charge',a:'+$1,800',c:'fix'}]),bal:2960,hist:true,why:'The mistake and the fix both stay in the ledger. The balance is right and an auditor can see why.'}};
  let first=true;
  L.h(L.kick('pr','Fix the bill')+'<h1 class="q">On Tuesday a bug charged Bramble & Bolt twice for 300 parcels. The charges are events in the billing log. How should Linh fix it? <span class="ill29">illustrative figures</span></h1>'+

   '<div class="row29"><button class="chip" id="a20d">Delete the duplicate</button><button class="chip" id="a20e">Edit it to $0</button><button class="chip" id="a20r">Append a refund</button></div>');
  L.$('#l20').innerHTML=logRows29(base);
  ['d','e','r'].forEach(k=>{L.$('#a20'+k).onclick=()=>{['d','e','r'].forEach(q=>L.$('#a20'+q).classList.toggle('sel',q===k));const a=A[k];
    L.$('#l20').innerHTML=logRows29(a.rows);
    L.$('#m20').innerHTML='<span class="ok">Balance: $'+a.bal.toLocaleString('en-US')+' ✓</span><span class="'+(a.hist?'ok':'no')+'">History '+(a.hist?'kept ✓':'erased ✗')+'</span>';
    const ok=k==='r';if(first){first=false;L.award(ok);L.done();}
    L.sheet(ok?'ok':'no',ok?'Like an accountant':'Right balance, lost history',a.why+' Accountants never erase: they add a compensating entry. Immutable events also make it much easier to see what buggy code did, and recover.');};});}},

{part:3,src:'Chapter 11 · Deriving several views from the same event log',run(L){
  L.h(L.kick('learn','Many views, one log')+'<h1 class="q">Write once, read in many shapes</h1>'+PIC_VIEWS+
   '<p class="capt">Write data one way, read it many ways ('+L.g('cqrs','CQRS')+'). A new feature gets its own view, built from the log beside the old ones: often easier than migrating a schema. Denormalized views are fine: the log keeps them consistent.</p>');
  L.done();}},

{part:3,src:'Chapter 11 · Deriving several views from the same event log',pts:1,
 solve:async L=>{const r=L.$('#r22');r.value=0;r.dispatchEvent(new Event('input',{bubbles:true}));L.$('#f22').click();L.$('#k22').click();await L.sleep(1500);L.$('#ship22').click();},

   '<div class="row29"><button class="chip sel" id="f22">Full log</button><button class="chip" id="c22">Compacted by parcel</button></div>'+
   '<div id="l22"></div><div class="rng29"><label for="r22">Start the new view at offset</label><b id="v22">10 (now)</b><input type="range" id="r22" min="0" max="10" step="1" value="10"></div>'+
   '<div id="g22"></div><div class="rd29" id="o22">Pick a source and a start, then replay.</div><button class="btn pri" id="k22">'+L.ic('play')+'Replay into the view</button> <button class="btn" id="ship22" hidden>'+L.ic('check')+'Ship this view</button>');
  const kept=j=>src==='full'||!E.slice(j+1).some(x=>x[2]===E[j][2]);
  const rows=(head)=>{const st=+L.$('#r22').value;L.$('#l22').innerHTML=logRows29(E.map((e,j)=>({o:j,t:txt(e),c:!kept(j)?'gone':j<st?'off':j===head?'head':''})),true);};
  const chart=cnt=>{let s='<svg class="pic29" viewBox="0 0 340 78" role="img" aria-label="Late parcels per zone compared with the target">';
    ['W1','W2'].forEach((z,i)=>{const y=6+i*36,n=cnt?cnt[z]:0;
      s+=tx(8,y+19,z)+'<rect x="40" y="'+(y+4)+'" width="'+(n*80)+'" height="20" rx="5" style="fill:var(--'+(n===TG[z]?'ok':'h1')+')"/>'+
       '<path d="M'+(40+TG[z]*80)+' '+y+' V'+(y+28)+'" style="stroke:var(--ink);stroke-width:2;stroke-dasharray:3 3"/>'+tx(46+TG[z]*80,y+19,'target '+TG[z],'s29m')+
       (n?tx(44+n*80-24,y+19,String(n),'s29t','style="fill:var(--pri-ink)"'):'');});
    L.$('#g22').innerHTML=s+'</svg>';};
  const setSrc=v=>{if(busy)return;src=v;L.$('#f22').classList.toggle('sel',v==='full');L.$('#c22').classList.toggle('sel',v!=='full');rows(-1);};
  L.$('#f22').onclick=()=>setSrc('full');L.$('#c22').onclick=()=>setSrc('cmp');
  L.$('#r22').addEventListener('input',()=>{if(busy)return;const v=+L.$('#r22').value;L.$('#v22').textContent=v===10?'10 (now)':v;rows(-1);});
  rows(-1);chart(null);
  L.$('#k22').onclick=()=>{if(busy)return;busy=true;L.$('#ship22').hidden=true;const st=+L.$('#r22').value,seq=[];for(let j=st;j<10;j++)if(kept(j))seq.push(j);
    const slot={},cnt={W1:0,W2:0};let unk=0,k=0;
    const step=()=>{if(!L.$('#l22'))return;
      if(k<seq.length){const e=E[seq[k]];if(e[0]==='b')slot[e[2]]={z:e[3],end:e[5]};else{const s=slot[e[2]];if(!s)unk++;else if(e[4]>s.end)cnt[s.z]++;}
        rows(seq[k]);chart(cnt);k++;setTimeout(step,110);return;}
      busy=false;rows(-1);res={cnt,unk};const ok=cnt.W1===TG.W1&&cnt.W2===TG.W2;
      L.$('#o22').innerHTML=(ok?vd29(true,'Matches'):vd29(false,'Off'))+'W1: <b>'+cnt.W1+'</b>, W2: <b>'+cnt.W2+'</b>'+(unk?' · '+unk+' deliver'+(unk===1?'y':'ies')+' with no booking, so lateness can’t be told':'')+(seq.length?'':' · no events replayed');
      L.$('#ship22').hidden=false;};
    step();};
  L.$('#ship22').onclick=()=>{if(!res)return;const ok=res.cnt.W1===TG.W1&&res.cnt.W2===TG.W2;
    if(first){first=false;L.award(ok);L.done();}
    L.sheet(ok?'ok':'no',ok?'View shipped':'Not matching yet',ok?'From offset 0 of the full log, every booking’s slot is known when its delivery arrives. Run the view beside the old ones; drop it when it’s no longer needed.':
      'Lateness needs each booking’s slot <i>and</i> its delivery. Start later than 0 and early bookings are missing; compact by parcel and every booking is thrown away. Use the full log from offset 0.');};}},

{part:3,src:'Chapter 11 · Concurrency control',run(L){
  L.h(L.kick('learn','Concurrency control')+'<h1 class="q">One catch, and one bonus</h1>'+PIC_CONC+
   '<p class="capt">Catch: log consumers are usually asynchronous. Fix it by updating the view in the same transaction as the append, or with total order broadcast. Bonus: make each event describe one whole user action, so it’s one atomic append.</p>');
  L.done();}},

{part:3,src:'Chapter 11 · Limitations of immutability',pts:1,run(L){
  L.h(L.kick('learn','Limitations of immutability')+'<h1 class="q">When you really must delete</h1>'+PIC_LIMITS+
   '<p class="capt">Mostly-added data is cheap to keep forever; heavy churn on little data makes history huge. Privacy rules, laws or a leak can force true deletion: rewriting history as if it was never written (Datomic’s <i>excision</i>, Fossil’s <i>shunning</i>).</p>'+
   '<div id="dq"><h2 class="sub">Mrs. Okoro closes their account and asks Otterpost to delete their personal data. Their address sits in many parcel events. What does that take?</h2></div>');
  L.mc(L.$('#dq'),['Append an “address deleted” event to the log','Rewrite the log as if their data was never written','Nothing: events can never be removed'],1,
   'An extra event would leave their address in the older events. This needs excision: rewrite history, then chase the other copies as best you can.',
   'Appending leaves their address in the older events, and “never removable” isn’t an option when privacy rules require deletion. History has to be rewritten, then the other copies chased down.');}},

{part:3,src:'Chapter 11 · Summary',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Mixed review',['Dual writes','Change data capture','Event sourcing'],[
   ['The app writes each new address to the Parcel DB, then to support search itself.',0,'The application writes to both systems itself, which opens the door to races and partial failures.'],
   ['A tool reads the Parcel DB’s replication log and feeds each change to support search, in order.',1,'Changes are pulled from the database at a low level, so the order matches the real writes.'],
   ['The courier app records “delivery attempted, nobody home,” and parcel state is computed from such records.',2,'App-level, immutable events with state derived from them: that’s event sourcing.'],
   ['The application has no idea its changes are being streamed to other systems.',1,'With CDC the app uses the database as normal and is unaware of the capture.'],
   ['The log can’t be compacted to one record per parcel without losing information.',2,'Event-sourced events hold intents, so later ones don’t replace earlier ones.']]);}}
  ]
});
</script>
