<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">

<script>
Course.lesson({
  id:'0029', title:'Databases and streams', minutes:20, icon:'list',
  goals:['Explain why dual writes go wrong and how change data capture fixes them','Tell change data capture from event sourcing, and a command from an event','Use immutable events to fix mistakes and build new views, and know when you must truly delete'],
  parts:['Keeping in sync','Change data capture','Event sourcing','Immutability'],
  read:'Read “Databases and Streams” in chapter 11 for the book’s figures on dual writes, change data capture and state as the integral of a stream.',
  glossary:{
    event:'Event: a small, self-contained record of something that happened at a certain time, such as “parcel 88 scanned at Westport North hub at 09:14”. Once written, it never changes.',
    dualwrite:'Dual writes: the application itself writes each change to several systems, for example the database and then the search index. Easy to build, but the copies can drift apart.',
    cdc:'Change data capture: reading a database’s log of row changes so another system (a warehouse, a search index, a cache) can copy them.',
    compaction:'Compaction: rewriting log segments to throw away values that were overwritten or deleted, keeping only the latest value for each key.',
    cqrs:'CQRS (command query responsibility segregation): writing data in one form, such as an event log, and reading it from one or more different forms built for queries.'
  },
  cheatsheet:[
    'A <b>write to a database is an event</b>. A replication log is a stream of them; replicas that apply the same events in the same order end up the same.',
    '<b>Dual writes</b> break two ways: <b>races</b> (writes arrive in different orders, no error) and <b>partial failures</b> (one write fails). Root cause: two leaders.',
    '<b>Change data capture</b> makes the database the leader and derived systems its followers. Start a new follower from a <b>snapshot tied to an offset</b>, or from offset 0 of a <b>compacted</b> log.',
    '<b>Event sourcing</b> stores what users did, as immutable app-level events. State is derived deterministically; the full history is needed, so no key-based compaction.',
    'A <b>command</b> may fail; once validated it becomes an <b>event</b>, a fact consumers can’t reject. Validate before writing the event.',
    'State is the result of its events. <b>Fix mistakes by appending</b> corrections, like an accountant, and derive <b>several read views</b> from one log (CQRS).',
    'Catch: log-derived views lag behind. Bonus: one self-contained event per action is a single, atomic append.',
    'High churn makes full history costly, and privacy or legal reasons can require <b>really deleting</b> (excision), which is hard.'
  ],
  steps:[
/* ---------- PART 1: KEEPING IN SYNC ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Mrs. Okoro changed their address yesterday, and the Parcel DB shows the new one. But when Signe’s team searches support search for their new postcode, nothing comes up. What’s most likely?</h1>');
  L.mc(L.card,['Support search keeps its own copy, which wasn’t updated','The Parcel DB quietly lost their change'],0,
   'Support search keeps its own copy of the data. This lesson is about keeping copies like that in step.',
   'The Parcel DB shows the new address, so it kept the change. Support search keeps its own copy, and that copy fell behind.');}},
{part:0,src:'Chapter 11 · Databases and Streams',run(L){
  L.h(L.kick('learn','Writes are events')+'<h1 class="q">A write to a database is an event too</h1>'+
   L.prose('An '+L.g('event','event')+' records something that happened. That can be a scan or a click, but it can also be <b>a write to a database</b>, which can be captured, stored and processed like any other event.')+
   L.flow([['pencil','Writes','arrive at the Parcel DB leader'],['list','Change stream','the replication log'],['layers','Same data','on every follower']])+
   L.prose('You’ve met this already. A replication log is a stream of write events: the leader produces it, and followers apply it to get the same data. This is <b>state machine replication</b>: if every replica processes the same events in the same order, and processing is deterministic, they all end in the same state.'));
  L.done();}},
{part:0,src:'Chapter 11 · Keeping Systems in Sync',run(L){
  L.h(L.kick('learn','Keeping systems in sync')+'<h1 class="q">One app, many copies of the same data</h1>'+
   L.prose('No single system meets every need, so Otterpost, like most real apps, combines several. Each keeps its own copy of the data, shaped for its own job:')+
   L.list([['box','Parcel DB','the database that serves bookings and status changes'],['layers','Cache','in front of the tracking page'],['eye','Support search','a full-text index for Signe’s team'],['trend','Analytics warehouse','Linh’s reports']],1)+
   L.prose('When a parcel changes, every copy must change too. The warehouse is usually refreshed by ETL, a batch process: dump the database, transform it, bulk-load it. When that’s too slow, some teams use '+L.g('dualwrite','dual writes')+': the application writes to the database, then updates the search index, then clears the cache.'));
  L.done();}},
{part:0,src:'Chapter 11 · Keeping Systems in Sync',pts:1,
 solve:async L=>{L.$('#pc').children[2].click();L.$('#run').click();},
 run(L){
  let p=null;const PR=['Both show B','Both show A','They end up different'];
  const S=[['Parcel DB gets the agent’s write: A','db','A'],['Parcel DB gets the recipient’s write: B','db','B'],['Support search gets the recipient’s write: B','ix','B'],['Support search gets the agent’s write: A','ix','A']];
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">Tobias’s code does dual writes: Parcel DB first, then support search. A support agent sets parcel 88’s address to A just as the recipient’s app sets it to B. Where does each system end up?</h1><div id="pc"></div>'+
   '<div id="sim" hidden><div class="two" style="margin-top:6px"><div class="lane"><div class="lh" style="color:var(--h1)">'+L.ic('box')+'Parcel DB</div><div class="week" id="db">–</div></div><div class="lane"><div class="lh" style="color:var(--h3)">'+L.ic('eye')+'Support search</div><div class="week" id="ix">–</div></div></div>'+
   '<button class="btn pri" id="run" style="margin-top:12px">'+L.ic('play')+'Run with unlucky timing</button><div id="tl" style="margin-top:10px"></div></div>');
  PR.forEach((t,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=t;b.onclick=()=>{if(p!==null)return;p=j;b.classList.add('sel');L.$('#sim').hidden=false;};L.$('#pc').appendChild(b);});
  L.$('#run').onclick=function(){this.remove();let k=0;
    const t=setInterval(()=>{const tl=L.$('#tl');if(!tl){clearInterval(t);return;}const s=S[k];
      tl.insertAdjacentHTML('beforeend','<div class="small" style="padding:3px 0">'+(k+1)+'. '+s[0]+'</div>');L.$('#'+s[1]).textContent=s[2];k++;
      if(k===S.length){clearInterval(t);L.award(p===2);
        L.sheet(p===2?'ok':'no',p===2?'You called it':'They end up different',
         'The Parcel DB says B; support search says A, and they’ll stay that way. No request failed, so nobody is alerted. Without extra tools such as version vectors, nobody even notices the two writes were concurrent.');L.done();}},450);};}},
{part:0,src:'Chapter 11 · Keeping Systems in Sync',run(L){
  L.h(L.kick('learn','What goes wrong')+'<h1 class="q">Dual writes: two problems, one root cause</h1>'+
   L.list([['cycle','Race condition','Two writers interleave, and each system applies their writes in a different order. No error is raised; the copies just disagree for good.'],
     ['x','Partial failure','One write succeeds and the other fails, maybe because the app crashed between them. Making sure both succeed or both fail is the atomic commit problem, which is expensive to solve.']],4)+
   L.note('The root cause: there are <b>two leaders</b>. The Parcel DB may have a leader and support search may have one, but neither follows the other. It would be much better with one leader, the Parcel DB, and support search as its follower.','bulb'));
  L.done();}},
{part:0,src:'Chapter 11 · Keeping Systems in Sync',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Tobias adds retries, so the search write repeats until it succeeds. Which dual-write problem can still happen even if no request ever fails?</h1>');
  L.mc(L.card,['The search index running out of disk space','Retries making the Parcel DB slower','Writes reaching the two systems in different orders'],2,
   'The race needs no failure at all: two clients’ writes just interleave differently at each system. There’s no error to retry.',
   'That isn’t one of the dual-write problems. The one retries can’t touch is the race: writes reach the two systems in different orders, with no error to retry.');}},

/* ---------- PART 2: CHANGE DATA CAPTURE ---------- */
{part:1,src:'Chapter 11 · Change Data Capture',run(L){
  L.h(L.kick('learn','Change data capture')+'<h1 class="q">Make the database the leader, and everything else its followers</h1>'+
   L.prose('For decades, replication logs were treated as a private detail of the database, with no documented way to read them. '+L.g('cdc','Change data capture')+' (CDC) changes that: it observes every change written to a database and passes it on, ideally as a stream the moment it’s written.')+
   L.flow([['box','Parcel DB','system of record',1],['list','Change stream','in write order',2],['eye','Support search','follower',3],['trend','Warehouse','follower',4]])+
   L.prose('If the changes are applied in the same order, support search ends up matching the Parcel DB. Derived systems are just consumers of the change stream. A log-based broker suits the job because it keeps messages in order, so redelivery can’t shuffle them.'));
  L.done();}},
{part:1,src:'Chapter 11 · Implementing change data capture',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">Linh feeds support search from the Parcel DB with CDC</h1>');
  L.beats(L.card,[
   ['How to capture','Linh could add database triggers that copy each change into a changelog table, but triggers tend to be fragile and costly. Parsing the replication log is more robust, though schema changes need care.'],
   ['Not just from now on','A new search index needs <b>every</b> parcel, not only the ones changed lately, and the full change history wasn’t kept.'],
   ['Snapshot','So Linh takes a consistent snapshot of the Parcel DB that matches a known position in the change log: offset 9,400,000.'],
   ['Catch up','The index is built from the snapshot, then applies every change from offset 9,400,000 on, in order.'],
   ['Steady state','Mrs. Okoro’s new address now flows Parcel DB → change stream → support search, a moment after it commits.']],
   'CDC is usually asynchronous: the Parcel DB doesn’t wait for consumers. A slow consumer barely affects it, but every replication-lag problem applies to the derived systems.');}},
{part:1,src:'Chapter 11 · Initial snapshot',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Why must Linh’s snapshot match a known offset in the change log?</h1>');
  L.mc(L.card,['So the snapshot takes up less disk space','So the index knows which change to apply first','So the Parcel DB can skip its nightly backups'],1,
   'The offset marks where the snapshot ends and the stream begins. Without it, the index can’t tell which changes the snapshot already contains.',
   'The offset has nothing to do with size or backups. It tells the index where the snapshot stops, so it knows which change to apply first.');}},
{part:1,src:'Chapter 11 · Log compaction',run(L){
  L.h(L.kick('learn','Log compaction')+'<h1 class="q">Keep only the latest value for each key</h1>'+
   L.prose('A fresh snapshot for every new derived system is a chore. '+L.g('compaction','Log compaction')+' is the alternative. In the background, the system finds records with the same key, throws away the older ones and keeps the most recent. A special empty value, a <b>tombstone</b>, marks a deleted key, which then disappears during compaction.')+
   L.prose('So the log’s size depends on the current data, not on how many writes ever happened. If every CDC change carries a primary key and replaces the previous value, the latest write per key is enough. A new consumer can start at <b>offset 0</b> of the compacted topic and read a full copy of the database, with no new snapshot. (The book notes Apache Kafka supports this, so a broker can serve as durable storage.)')+
   L.note('Databases are also starting to offer change streams as a proper interface instead of something reverse-engineered. The book’s examples include RethinkDB, Firebase, CouchDB, Meteor and VoltDB. Kafka Connect links CDC tools for many databases to Kafka.','info'));
  L.done();}},
{part:1,src:'Chapter 11 · Log compaction',pts:1,
 solve:async L=>{L.$('#pc').children[1].click();L.$('#cp').click();},
 run(L){
  const LOG=[['P88','at hub'],['P91','picked up'],['P88','out for delivery'],['P93','picked up'],['P91','at hub'],['P93','tombstone (booking cancelled)'],['P88','delivered'],['P95','picked up']];
  const KEEP=[4,6,7];let p=null;const PR=['4 records','3 records','5 records'];
  const draw=c=>LOG.map((r,j)=>{const gone=c&&!KEEP.includes(j);return '<div class="small" style="padding:4px 8px;margin:3px 0;border-radius:8px;background:var(--card);'+(gone?'opacity:.3;text-decoration:line-through':c?'border:2px solid var(--ok-line)':'')+'"><b>'+j+'</b> · '+r[0]+': '+r[1]+'</div>';}).join('');
  L.h(L.kick('pr','Predict, then compact')+'<h1 class="q">Here is part of the Parcel DB change topic, keyed by parcel. After compaction, how many records are left?</h1>'+
   '<div id="lg" style="background:var(--soft);border-radius:16px;padding:10px 12px;margin:8px 0">'+draw(false)+'</div><div id="pc"></div><button class="btn pri" id="cp" hidden>'+L.ic('play')+'Compact the log</button>');
  PR.forEach((t,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=t;b.onclick=()=>{if(p!==null)return;p=j;b.classList.add('sel');L.$('#cp').hidden=false;};L.$('#pc').appendChild(b);});
  L.$('#cp').onclick=function(){this.remove();setTimeout(()=>{const lg=L.$('#lg');if(!lg)return;lg.innerHTML=draw(true);L.award(p===1);
    L.sheet(p===1?'ok':'no',p===1?'Three it is':'Three records are left',
     'P88 and P91 keep only their latest status, and P93’s tombstone removes it entirely. What’s left is the current value of every key: enough to build a new index from offset 0.');L.done();},500);};}},
{part:1,src:'Chapter 11 · Initial snapshot',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'How should this consumer start?',['Take a new snapshot','Read the compacted topic from offset 0','Resume from its own offset'],[
   ['Linh adds an address-analytics store. The Parcel DB change topic is log-compacted.',1,'A compacted topic holds the latest value of every key, so reading it from the start gives a full copy.'],
   ['The change topic keeps only the last 7 days, not compacted. Linh wants a new cache of every parcel.',0,'Seven days of changes miss parcels that didn’t change lately. Start from a consistent snapshot tied to an offset.'],
   ['Support search was down for 10 minutes. Its last offset is still in the log.',2,'Nothing was lost. It carries on from its recorded offset, like a follower catching up.'],
   ['A new fraud model needs every merchant’s current settings. Only the last 2 days of changes are kept.',0,'Two days of changes leave out merchants who haven’t changed anything lately. A snapshot is needed.']]);}},

/* ---------- PART 3: EVENT SOURCING ---------- */
{part:2,src:'Chapter 11 · Event Sourcing',run(L){
  L.h(L.kick('learn','Event sourcing')+'<h1 class="q">The same log idea, one level up</h1>'+
   L.prose('<b>Event sourcing</b> comes from the domain-driven design community. Like CDC, it stores every change as a log of events. The difference is the level:')+
   L.lanes([['box','Change data capture','The app updates and deletes records freely. The change log is pulled out of the database at a low level, so its order matches the real writes. The app doesn’t know CDC is happening.',1],
            ['list','Event sourcing','The app is built on <b>immutable events</b> in an append-only log. Updates and deletes are discouraged or banned. Events describe what happened in the app, not low-level state changes.',2]])+
   L.prose('Recording what users <i>did</i>, rather than the effect on a mutable database, makes an app easier to evolve, easier to debug after the fact, and safer against bugs.'));
  L.done();}},
{part:2,src:'Chapter 11 · Event Sourcing',run(L){
  L.h(L.kick('ex','The book’s example, then Otterpost')+'<h1 class="q">Why “what happened” beats “what changed”</h1>');
  L.beats(L.card,[
   ['As an event','A student cancels a course enrollment. As an event, that’s one neutral fact: the student cancelled.'],
   ['As side effects','Stored as state changes, it becomes “a row deleted from enrollments, a reason added to feedback.” That bakes in guesses about how the data will be used later.'],
   ['A new feature','Later the school wants to offer the freed place to the next person on the waiting list. With the event, that new effect simply hangs off the existing event.'],
   ['At Otterpost','A recipient redirects parcel 88 to a neighbour. Linh records “recipient redirected parcel 88 to number 14,” not “address column overwritten.”'],
   ['Months later','Femi wants the neighbour told in advance. The new notification just listens for redirect events, and old events still mean exactly what they meant.']],
   'An event records the intent of one action. New features can chain new effects off old events, with no guessing what a pile of row changes meant.');}},
{part:2,src:'Chapter 11 · Deriving current state from the event log',run(L){
  L.h(L.kick('learn','Deriving current state')+'<h1 class="q">Users want the current state, not the history</h1>'+
   L.prose('An event log alone isn’t much use to a user. A shopper wants to see what’s in their cart now, not every change they ever made to it. So an event-sourced app turns the log into current state. Any logic can do this, but it must be <b>deterministic</b>, so replaying the log always gives the same state.')+
   L.lanes([['box','CDC event','Holds the whole new version of a record. The latest event per key says it all, so compaction can drop older ones.',1],
            ['list','Event-sourced event','Holds a user’s intent, like “redirected to number 14.” Later events don’t replace earlier ones, so you need the full history.',2]])+
   L.note('Event-sourced apps usually save snapshots of the current state so they don’t replay everything each time. That’s only a speed-up. The intent is to keep every raw event forever and be able to reprocess the whole log.','info'));
  L.done();}},
{part:2,src:'Chapter 11 · Deriving current state from the event log',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Linh wants to compact the parcel lifecycle log, which holds events like “redirected,” “delivery attempted” and “delivered,” keeping only each parcel’s latest event. What’s the problem?</h1>');
  L.mc(L.card,['None: the latest event says everything','Earlier events still shape the state','Compaction only works on small logs'],1,
   'Events record intents, and later ones don’t replace earlier ones. After “delivery attempted” is logged, the redirect still decides the address. You need the full history.',
   'In event sourcing, a later event doesn’t carry the whole state. “Delivery attempted” says nothing about the redirect before it, so dropping earlier events loses state.');}},
{part:2,src:'Chapter 11 · Commands and events',run(L){
  L.h(L.kick('learn','Commands and events')+'<h1 class="q">A command can fail. An event is a fact.</h1>'+
   L.flow([['pointer','Command','“Book the 10–11 slot for parcel 88”','may still fail',4],['check','Validate','Does the slot still have a free place?','',3],['book','Event','“10–11 slot reserved for parcel 88”','durable, immutable',2]])+
   L.prose('A request starts as a <b>command</b>. The app first checks that it can be done; only then does it become an <b>event</b>, a fact. If the recipient later changes slot, the reservation still happened. The change is a <i>new</i> event.')+
   L.prose('Consumers can’t reject an event: it’s already in the log, and others may have seen it. So validation must happen <b>before</b> the event is written, for example in a serializable transaction that checks and publishes together. Or split it in two: a tentative reservation event, then a confirmation event once it’s validated.'));
  L.done();}},
{part:2,src:'Chapter 11 · Commands and events',pts:5,run(L){
  L.h(L.kick('pr','Command or event?')+'<h1 class="q">Sort each item.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Command','Event'],[
   ['“Reserve the 14–15 slot for parcel 102,” just sent by the recipient’s app.',0,'It hasn’t been checked yet. The slot might be full, so it can still fail.'],
   ['“Slot 14–15 reserved for parcel 102,” written to the log after the check.',1,'It passed validation and was recorded. Now it’s a fact.'],
   ['“Parcel 102’s reservation cancelled,” recorded after the reservation.',1,'A cancellation is a new event. The reservation still happened.'],
   ['A merchant’s API request to book 500 parcels on credit it may not have.',0,'It still has to be checked against the credit balance, so it’s a command.'],
   ['What billing receives: “parcel 102 booked,” at a price billing thinks is wrong.',1,'It’s already in the log, so billing can’t reject it. Checks belong before the event is written.']],
   'A command is a request that may fail. Once validated, it becomes an event: a fact that consumers can’t refuse.');}},

/* ---------- PART 4: IMMUTABILITY ---------- */
{part:3,src:'Chapter 11 · State, Streams, and Immutability',run(L){
  L.h(L.kick('learn','State and streams')+'<h1 class="q">Changing state and an unchanging log are two sides of one coin</h1>'+
   L.prose('Databases usually store current state, which changes. How does that fit with immutable events? Any changing state is the result of the events that changed it. Free delivery slots are the result of the reservations processed; a merchant’s credit balance is the result of its top-ups and charges.')+
   L.flow([['list','Event stream','top-ups and charges','add up over time',2],['box','State','credit balance today','look at the changes',1]])+
   L.prose('In maths terms, state is what you get by integrating the stream over time, and the stream is what you get by differentiating the state. Keep the changelog, and the state becomes reproducible.')+
   L.quote('The truth is the log.','Pat Helland, quoted in chapter 11')+
   L.prose('In that view the database just caches the latest value of each record. Log compaction bridges the two: it keeps only the latest version of each record.'));
  L.done();}},
{part:3,src:'Chapter 11 · Advantages of immutable events',run(L){
  L.h(L.kick('learn','Advantages of immutable events')+'<h1 class="q">Why accountants never use an eraser</h1>'+
   L.list([['book','Auditing','Accountants record every transaction in an append-only ledger and derive the accounts by adding it up. A mistake isn’t erased: a correcting transaction is added, and the wrong one stays for the audit trail.'],
     ['shield','Recovering from bugs','If buggy code overwrites data, recovery is hard. With an append-only log of events, it’s much easier to see what happened and repair it.'],
     ['eye','More information','A shopper adds an item to the cart, then removes it. For delivery nothing happened; for analytics, they were considering it. The log keeps that. A database that deletes the row loses it.']],2));
  L.done();}},
{part:3,src:'Chapter 11 · Advantages of immutable events',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">On Tuesday, billing charged Bramble & Bolt twice for 300 parcels. The charges are events in the billing log. What should Linh do?</h1>');
  L.mc(L.card,['Delete the 300 duplicate charge events','Edit the duplicates to a price of zero','Append 300 refund events that correct them'],2,
   'Like an accountant: add compensating events. The mistake stays visible for audit, and the balance derived from the log is right again.',
   'Deleting or editing events destroys the record of what happened. Like an accountant, append refunds that cancel the mistake; the balance then comes out right.');}},
{part:3,src:'Chapter 11 · Deriving several views from the same event log',run(L){
  L.h(L.kick('learn','Many views, one log')+'<h1 class="q">Write once, read in many shapes</h1>'+
   L.flow([['list','Parcel event log','written once',2],['map','Tracking page','read view',1],['eye','Support search','read view',3],['trend','Merchant stats','read view',4]],false)+
   L.prose('Once the log is separate from the state, you can derive <b>several</b> read-optimized views from it, like several consumers of one stream. Want to show existing data in a new way? Build a new view from the log, run it beside the old ones, and shut the old one down when it’s no longer needed. That’s often easier than a complicated schema migration.')+
   L.prose('Separating how data is written from how it is read is sometimes called '+L.g('cqrs','CQRS')+'. It also takes the heat out of the normalization debate: a denormalized read view is fine, because the step that translates the log into the view keeps it consistent. Twitter’s home timelines, from chapter 1, are such a view.'));
  L.done();}},
{part:3,src:'Chapter 11 · Concurrency control',run(L){
  L.h(L.kick('learn','Concurrency control')+'<h1 class="q">One catch, and one bonus</h1>'+
   L.lanes([['clock','The catch','Log consumers are usually asynchronous. A merchant books a parcel, opens the dashboard, and the view hasn’t caught up: the read-your-writes problem. Fixes: update the view in the same transaction as the append (same storage system, or a distributed transaction), or use the total order broadcast approach from chapter 9.',4],
            ['check','The bonus','Design each event as a self-contained description of one user action. Then the action is a single append in one place, which is easy to make atomic. If the log and the state are partitioned the same way, a single-threaded consumer per partition needs no concurrency control at all.',2]]));
  L.done();}},
{part:3,src:'Chapter 11 · Limitations of immutability',pts:1,run(L){
  L.h(L.kick('learn','Limitations of immutability')+'<h1 class="q">When you really must delete</h1>'+
   L.prose('Keeping every change forever depends on <b>churn</b>. Data that is mostly added is easy to keep. A small dataset with many updates and deletes can build a huge history, and compaction and garbage collection become critical.')+
   L.prose('Sometimes data must go for other reasons: privacy rules after an account is closed, a law requiring wrong information to be removed, or a leak of sensitive data. Appending a “please ignore” event isn’t enough; you have to rewrite history as if the data was never written. Datomic calls this <b>excision</b>; the Fossil version control system calls it <b>shunning</b>.')+
   L.note('Truly deleting is hard. Storage engines, filesystems and SSDs often write new copies rather than overwrite, and backups are deliberately unchangeable. Deleting means “harder to retrieve” more than “impossible to retrieve,” but you still have to try.','lock')+
   '<div id="dq"><h2 class="sub">Mrs. Okoro closes their account and asks Otterpost to delete their personal data. Their address sits in many parcel events. What does that take?</h2></div>');
  L.mc(L.$('#dq'),['Append an “address deleted” event to the log','Rewrite the log as if their data was never written','Nothing: events can never be removed'],1,
   'An extra event would leave their address in the older events. This needs excision: rewrite history, then chase down the other copies as best you can.',
   'Appending leaves their address sitting in the older events, and “never removable” isn’t an option when privacy rules require deletion. History has to be rewritten, then other copies chased down.');}},
