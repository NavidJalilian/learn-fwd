<script>
/* =====================================================================
   Lesson 0015 only. Hands-on models used across the lesson:
   1. Strip   – Tobias’s booking as four writes, with crash scissors (atomicity)
   2. Race    – two bookings bump one counter (isolation)
   3. Ladder  – the durability ladder with a disaster picker (durability)
   4. DocZoom – one 20 KB document cut mid-write (single-object atomicity)
   5. Tries   – retry attempts after different errors (aborts and retries)
   ===================================================================== */
const CSS='<style>'+
 '.tp-svg{width:100%;display:block;margin:4px 0}.tp-svg text{font-family:var(--sans)}'+
 '.tp-drag{touch-action:none;cursor:ns-resize;-webkit-user-select:none;user-select:none}'+
 '.tp-ctl{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.tp-ctl .chip,.tp-ctl .btn{margin:0;min-height:40px}.tp-ctl .btn:disabled{opacity:.45}'+
 '.tp-lbl{font-size:13px;font-weight:600;color:var(--muted);margin:10px 0 2px}'+
 '.tp-rng{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;font-size:14px;margin:2px 0}'+
 '.tp-rng label{font-weight:600;color:var(--muted)}.tp-rng b{color:var(--no)}'+
 '.tp-rng input{flex:1 1 100%;width:100%;accent-color:var(--no);height:32px;margin:0}'+
 '.tp-db{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0}'+
 '.tp-db div{background:var(--soft);border-radius:10px;padding:6px 2px;text-align:center;font-size:12px;color:var(--muted);line-height:1.25;min-width:0}'+
 '.tp-db b{display:block;font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}'+
 '.tp-db div.bad{background:var(--no-bg);color:var(--no)}.tp-db div.bad b{color:var(--no)}'+
 '.tp-chk{list-style:none;margin:6px 0;padding:0}.tp-chk li{display:flex;gap:7px;align-items:flex-start;font-size:13.5px;line-height:1.35;margin:4px 0}'+
 '.tp-chk li svg.i{width:17px;height:17px;flex:none;margin-top:1px}.tp-chk li.ok{color:var(--ok)}.tp-chk li.no{color:var(--no)}'+
 '.tp-v{border-radius:12px;padding:9px 12px;font-size:14.5px;line-height:1.45;margin-top:6px}'+
 '.tp-v.ok{background:var(--ok-bg);color:var(--ok)}.tp-v.no{background:var(--no-bg);color:var(--no)}.tp-v.info{background:var(--soft);color:var(--ink)}.tp-v.mid{background:var(--h3-bg);color:var(--h3)}'+
 '.tp-small{font-size:13.5px;color:var(--muted);line-height:1.45;margin:6px 0 0}'+
 '.tp-acid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 12px}'+
 '.tp-acid>div{border:2px solid var(--line);border-radius:14px;padding:8px 10px;min-width:0;background:var(--card)}'+
 '.tp-acid>div.c{border-style:dashed;border-color:var(--h4);background:var(--h4-bg)}'+
 '.tp-acid .lt{display:flex;align-items:baseline;gap:6px}.tp-acid .lt b{font-size:24px;line-height:1}.tp-acid .lt span{font-size:13.5px;font-weight:700}'+
 '.tp-acid svg{width:100%;height:40px;display:block;margin:4px 0}.tp-acid .d{font-size:13px;line-height:1.35}'+
 '.tp-acid .who{display:inline-block;font-size:11.5px;font-weight:700;border-radius:99px;padding:1px 8px;margin-top:6px;background:var(--soft);color:var(--muted)}'+
 '.tp-acid .c .who{background:var(--card);color:var(--h4)}'+
 '.tp-done{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}.tp-done span{font-size:12.5px;font-weight:600;border-radius:99px;padding:2px 9px;background:var(--soft);color:var(--muted)}.tp-done span.y{background:var(--ok-bg);color:var(--ok)}'+
 '</style>';

/* ---------- tiny SVG helpers ---------- */
const tx=(x,y,s,o)=>{o=o||{};return '<text x="'+x+'" y="'+y+'" style="font-size:'+(o.z||11)+'px;font-weight:'+(o.b?700:400)+';fill:'+(o.f||'var(--ink)')+(o.a?';text-anchor:'+(o.a==='m'?'middle':'end'):'')+(o.i?';font-style:italic':'')+'">'+s+'</text>';};
const rc=(x,y,w,h,r,st)=>'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+r+'" style="'+st+'"/>';
const ln=(x1,y1,x2,y2,st)=>'<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" style="'+st+'"/>';
function ar(x1,y1,x2,y2,col,w){const a=Math.atan2(y2-y1,x2-x1),h=7,p=k=>(x2-h*Math.cos(a+k)).toFixed(1)+' '+(y2-h*Math.sin(a+k)).toFixed(1);
  return '<path d="M'+x1+' '+y1+'L'+x2+' '+y2+'M'+p(-.45)+'L'+x2+' '+y2+'L'+p(.45)+'" style="fill:none;stroke:'+col+';stroke-width:'+(w||2)+';stroke-linecap:round;stroke-linejoin:round"/>';}
function cyl(x,y,w,h,fill,stroke){const rx=w/2,ry=8;
  return '<path d="M'+x+' '+(y+ry)+'v'+(h-2*ry)+'a'+rx+' '+ry+' 0 0 0 '+w+' 0v'+(-(h-2*ry))+'" style="fill:'+fill+';stroke:'+stroke+';stroke-width:1.6"/><ellipse cx="'+(x+rx)+'" cy="'+(y+ry)+'" rx="'+rx+'" ry="'+ry+'" style="fill:'+fill+';stroke:'+stroke+';stroke-width:1.6"/>';}
const IP={check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',undo:'<path d="M5 13a7.5 7.5 0 1 0 2.4-6.3"/><path d="M4.5 3.5v4.5H9"/>',x:'<path d="M6 6l12 12M18 6 6 18"/>',dash:'<path d="M7 12h10"/>',alert:'<path d="M12 4 21 20H3z"/><path d="M12 10v4.5M12 17.2v.3"/>',send:'<path d="M4 12h13M12 6l6 6-6 6"/>'};
const icn=(n,x,y,sz,col)=>'<svg x="'+(x-sz/2)+'" y="'+(y-sz/2)+'" width="'+sz+'" height="'+sz+'" viewBox="0 0 24 24" style="overflow:visible"><g style="fill:none;stroke:'+col+';stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round">'+IP[n]+'</g></svg>';
const pin=(n,x,y)=>'<circle cx="'+x+'" cy="'+y+'" r="8.5" style="fill:var(--no-bg);stroke:var(--no);stroke-width:1.6"/>'+tx(x,y+4,n,{z:11,b:1,f:'var(--no)',a:'m'});
const fig=(h,label,body)=>'<svg class="tp-svg" viewBox="0 0 330 '+h+'" role="img" aria-label="'+label+'">'+body+'</svg>';
function setRange(L,id,v){const e=L.$('#'+id);e.value=v;e.dispatchEvent(new Event('input',{bubbles:true}));}
const idle=async(L,S)=>{for(let k=0;k<200&&S.busy;k++)await L.sleep(30);};
/* Result sheets sit at the bottom of a phone screen. After one opens, scroll so the readout
   it explains sits just above it (waits for the finger to lift, so a drag isn't disturbed). */
let ptrDown=false;
document.addEventListener('pointerdown',()=>{ptrDown=true;},true);
['pointerup','pointercancel'].forEach(n=>document.addEventListener(n,()=>{ptrDown=false;},true));
function keepAbove(el){
  const go=()=>requestAnimationFrame(()=>{
    if(!el||!el.isConnected)return;
    const d=document.querySelector('.dock'),dh=d?d.getBoundingClientRect().height:0,par=el.parentNode;
    let sp=par.querySelector(':scope > .tp-sp');
    if(!sp){sp=document.createElement('div');sp.className='tp-sp';sp.setAttribute('aria-hidden','true');par.appendChild(sp);}
    sp.style.height=Math.max(0,dh-150)+'px';
    const r=el.getBoundingClientRect(),room=innerHeight-dh-8,delta=Math.min(r.bottom-room,r.top-8);
    if(r.bottom>room&&delta>0)window.scrollBy(0,delta);});
  if(ptrDown)document.addEventListener('pointerup',go,{once:true,capture:true});else go();
}
const sheetAt=(L,el,kind,title,html)=>{L.sheet(kind,title,html);keepAbove(el);};

/* =====================================================================
   1. STRIP: Tobias’s booking as four writes. Drag the scissors (crash point).
   ===================================================================== */
const ROWS=[['Insert parcel row','OP-48213 · parcels 42 → 43'],['Deduct the price','credit $664 → $656'],['Bump the counter','parcels today 42 → 43'],['Rewrite dashboard doc','20 KB · “43 parcels, $344”']];
const CUTS=[0,1,2,3,3.5,4,5];
const CY={0:34,1:79,2:123,3:167,3.5:189,4:213,5:249};
const RY=[38,82,126,170];
function cutName(c,t){return c===0?'before write 1':c===3.5?'halfway through write 4 (10 of 20 KB)':c===5?(t?'after COMMIT':'after every write'):c===4?(t?'after write 4, before COMMIT':'after write 4'):'after write '+c;}
const RS={
 idle:{f:'var(--card)',s:'var(--line2)'},
 run:{f:'var(--pri-bg)',s:'var(--pri)',sub:'writing…',sc:'var(--pri)'},
 done:{f:'var(--ok-bg)',s:'var(--ok-line)',ic:'check',icc:'var(--ok)'},
 half:{f:'var(--h3-bg)',s:'var(--h3)',sub:'10 of 20 KB sent…',sc:'var(--h3)'},
 kept:{f:'var(--ok-bg)',s:'var(--ok-line)',ic:'check',icc:'var(--ok)',pre:'kept · ',sc:'var(--ok)'},
 undone:{f:'var(--soft)',s:'var(--line2)',d:1,m:1,ic:'undo',icc:'var(--muted)',sub:'rolled back: no trace left'},
 never:{f:'var(--card)',s:'var(--line2)',d:1,m:1,ic:'dash',icc:'var(--muted)',sub:'never ran'},
 old:{f:'var(--h3-bg)',s:'var(--h3)',ic:'alert',icc:'var(--h3)',sub:'cut mid-write: the old doc stays whole',sc:'var(--h3)'},
 skip:{f:'var(--no-bg)',s:'var(--no-line)',d:1,ic:'x',icc:'var(--no)',sub:'missing: the code skips it',sc:'var(--no)'}};
function outcome(c,t,code){
  const committed=t&&c>=5;
  const st=[1,2,3,4].map(i=>{
    if(code==='skip'&&i===3)return c>=3?'skip':'never';
    const ran=c>=i,part=i===4&&c===3.5;
    if(t){if(committed)return 'kept';return (ran||part)?'undone':'never';}
    return ran?'kept':part?'old':'never';});
  const k=i=>st[i-1]==='kept',parcels=42+(k(1)?1:0),credit=664-(k(2)?(code==='bug80'?80:8):0),counter=42+(k(3)?1:0),doc=k(4)?43:42;
  return {st,c,t,code,committed,cm:t?(committed?'done':'never'):'off',parcels,credit,counter,doc,
    checks:[credit===1000-8*parcels,counter===parcels,doc===parcels],kept:st.filter(s=>s==='kept').length};
}
function verdict(o){
  const bad=o.checks.filter(x=>!x).length;
  if(o.t&&!o.committed)return ['ok',o.c===0?'Crash before any write. Nothing to undo, nothing changed: safe to retry.':'The crash came before COMMIT, so the database rolled back every write. Nothing changed: safe to retry.'];
  if(!o.kept)return ['info','Nothing ran before the crash. Nothing to clean up.'];
  if(!bad)return ['ok',o.t?'Committed in full. Every check passes.':'Every write landed before the crash. Every check passes this time.'];
  if(o.t)return ['no','Committed, and still wrong. The database stored exactly what the code told it to.'];
  return ['no','Half done: '+o.kept+' of 4 writes stuck, and the code can’t easily tell which. Retry, and they may happen twice. Don’t, and the data stays wrong.'];
}
function stripResult(L,o){
  const c=o.checks,t=(lab,v,bad)=>'<div'+(bad?' class="bad"':'')+'><b>'+v+'</b>'+lab+'</div>',v=verdict(o);
  return '<div class="tp-lbl">What the Parcel DB holds afterwards</div><div class="tp-db">'+t('parcels',o.parcels)+t('credit','$'+o.credit,!c[0])+t('counter',o.counter,!c[1])+t('doc says',o.doc,!c[2])+'</div>'+
   '<ul class="tp-chk">'+[['Every parcel paid for: credit = $1,000 − $8 × parcels',c[0]],['Counter = number of parcels',c[1]],['Dashboard doc = number of parcels',c[2]]].map(x=>'<li class="'+(x[1]?'ok':'no')+'">'+L.ic(x[1]?'check':'x')+'<span>'+x[0]+'</span></li>').join('')+'</ul>'+
   '<div class="tp-v '+v[0]+'">'+v[1]+'</div>';
}
function Strip(L,host,o){
  o=Object.assign({id:'st',tx:false,cut:5,code:'ok',drag:true,range:true,txBtn:false,scissors:true,live:true,lock:false,on:()=>{}},o||{});
  const ID=o.id,S={tx:o.tx,cut:o.cut,code:o.code,busy:false,live:o.live,ran:false,lock:o.lock};
  host.insertAdjacentHTML('beforeend','<div class="tp">'+
   (o.txBtn?'<div class="tp-ctl"><button class="chip" id="'+ID+'-tx"></button></div>':'')+
   '<svg class="tp-svg'+(o.drag?' tp-drag':'')+'" id="'+ID+'-svg" viewBox="0 0 330 264" role="img" aria-label="Tobias’s booking as four writes in order, between BEGIN and COMMIT, with a crash line"></svg>'+
   (o.range?'<div class="tp-rng" id="'+ID+'-rw"><label for="'+ID+'-r">Crash point:</label><b id="'+ID+'-rv"></b><input type="range" id="'+ID+'-r" min="0" max="6" step="1" value="'+CUTS.indexOf(S.cut)+'"></div>':'')+
   '<div id="'+ID+'-out" aria-live="polite"></div></div>');
  const q=s=>host.querySelector(s),svg=q('#'+ID+'-svg'),out=q('#'+ID+'-out'),alive=()=>svg.isConnected;
  function rowSub(i){if(S.code==='bug80'&&i===1)return 'credit $664 → $584 (bug: $80)';return ROWS[i][1];}
  function draw(st,cm,flash){
    if(!alive())return;
    const t=S.tx;let s='';
    s+=rc(50,6,276,24,8,'fill:'+(t?'var(--h2-bg)':'var(--card)')+';stroke:'+(t?'var(--h2)':'var(--line2)')+';stroke-width:1.5'+(t?'':';stroke-dasharray:4 3'));
    s+=tx(188,22,t?'BEGIN TRANSACTION':'no transaction: each write saves on its own',{z:11.5,b:1,f:t?'var(--h2)':'var(--muted)',a:'m'});
    ROWS.forEach((r,i)=>{const y=RY[i],k=st[i],m=RS[k];
      s+=rc(50,y,276,38,10,'fill:'+m.f+';stroke:'+m.s+';stroke-width:1.6'+(m.d?';stroke-dasharray:4 3':''));
      s+='<circle cx="64" cy="'+(y+19)+'" r="9" style="fill:var(--card);stroke:'+m.s+';stroke-width:1.5"/>'+tx(64,y+23,i+1,{z:11,b:1,a:'m'});
      s+=tx(80,y+16,r[0]+(S.code==='bug80'&&i===1?' (bug!)':''),{z:12.5,b:1,f:m.m?'var(--muted)':'var(--ink)'});
      s+=tx(80,y+31,m.sub||((m.pre||'')+rowSub(i)),{z:11,f:m.sc||'var(--muted)',b:m.sc?1:0});
      if(m.ic)s+='<circle cx="308" cy="'+(y+19)+'" r="10" style="fill:var(--card);stroke:'+m.icc+';stroke-width:1.5"/>'+icn(m.ic,308,y+19,13,m.icc);});
    const C={off:['var(--card)','var(--line2)',1,'no COMMIT step','var(--muted)'],idle:['var(--h2-bg)','var(--h2)',0,'COMMIT','var(--h2)'],done:['var(--ok-bg)','var(--ok-line)',0,'COMMIT: done','var(--ok)'],never:['var(--card)','var(--line2)',1,'COMMIT never reached','var(--muted)']}[cm];
    s+=rc(50,218,276,24,8,'fill:'+C[0]+';stroke:'+C[1]+';stroke-width:1.5'+(C[2]?';stroke-dasharray:4 3':''))+tx(188,234,C[3],{z:11.5,b:1,f:C[4],a:'m'});
    if(o.scissors){const y=CY[S.cut];
      s+=ln(34,y,328,y,'stroke:var(--no);stroke-width:'+(flash?3.5:2)+';stroke-dasharray:6 4');
      if(o.drag&&!S.lock)s+='<path d="M16 '+(y-18)+'l4 -4 4 4M16 '+(y+18)+'l4 4 4 -4" style="fill:none;stroke:var(--no);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"/>';
      s+='<circle cx="20" cy="'+y+'" r="13" style="fill:'+(flash?'var(--no)':'var(--no-bg)')+';stroke:var(--no);stroke-width:2"/>'+
       '<g transform="translate(20 '+y+')" style="fill:none;stroke:'+(flash?'var(--card)':'var(--no)')+';stroke-width:1.8;stroke-linecap:round"><circle cx="-4.5" cy="-4" r="2.8"/><circle cx="-4.5" cy="4" r="2.8"/><path d="M-2.2 -2.4L7 4M-2.2 2.4L7 -4"/></g>';}
    svg.innerHTML=s;
  }
  function render(){
    if(!alive())return;
    const r=outcome(S.cut,S.tx,S.code);
    if(S.live||S.ran){draw(r.st,r.cm,0);out.innerHTML=stripResult(L,r);}
    else{draw(['idle','idle','idle','idle'],S.tx?'idle':'off',0);out.innerHTML='';}
    if(o.range){const e=q('#'+ID+'-r');e.value=CUTS.indexOf(S.cut);e.disabled=S.lock;q('#'+ID+'-rv').textContent=cutName(S.cut,S.tx);}
    if(o.txBtn){const b=q('#'+ID+'-tx');b.className='chip'+(S.tx?' sel':'');b.setAttribute('aria-pressed',S.tx);b.innerHTML=L.ic('shield')+'Inside a transaction: <b>'+(S.tx?'on':'off')+'</b>';}
    return r;
  }
  function set(c){if(S.busy||S.lock)return;if(c===S.cut&&(S.live||S.ran))return;S.cut=c;const r=render();o.on(r);}
  if(o.drag){let down=false;
    const pick=e=>{const b=svg.getBoundingClientRect(),y=(e.clientY-b.top)*264/b.height;let best=CUTS[0],bd=1e9;CUTS.forEach(c=>{const d=Math.abs(CY[c]-y);if(d<bd){bd=d;best=c;}});set(best);};
    svg.addEventListener('pointerdown',e=>{if(S.busy||S.lock)return;down=true;try{svg.setPointerCapture(e.pointerId);}catch(_){}pick(e);});
    svg.addEventListener('pointermove',e=>{if(down)pick(e);});
    ['pointerup','pointercancel'].forEach(n=>svg.addEventListener(n,()=>{down=false;}));}
  if(o.range)q('#'+ID+'-r').addEventListener('input',e=>set(CUTS[+e.target.value]));
  if(o.txBtn)q('#'+ID+'-tx').onclick=()=>{if(S.busy||S.lock)return;S.tx=!S.tx;const r=render();o.on(r);};
  async function play(){
    if(S.busy||!alive())return null;S.busy=true;
    const r=outcome(S.cut,S.tx,S.code),st=['idle','idle','idle','idle'];let cm=S.tx?'idle':'off';
    out.innerHTML='<div class="tp-v info">Running the booking…</div>';draw(st,cm,0);await L.sleep(150);
    for(let i=1;i<=4;i++){
      const full=S.cut>=i,part=i===4&&S.cut===3.5;if(!full&&!part)break;
      if(S.code==='skip'&&i===3){st[2]='skip';draw(st,cm,0);await L.sleep(160);if(!alive())return null;continue;}
      st[i-1]='run';draw(st,cm,0);await L.sleep(190);if(!alive())return null;
      st[i-1]=part?'half':'done';draw(st,cm,0);await L.sleep(80);if(!alive())return null;}
    if(S.tx&&S.cut>=5){cm='done';draw(st,cm,0);await L.sleep(220);if(!alive())return null;}
    if(o.scissors&&S.cut<5){draw(st,cm,1);await L.sleep(380);if(!alive())return null;}
    if(S.tx&&!r.committed){cm='never';for(let i=3;i>=0;i--)if(st[i]==='done'||st[i]==='half'){st[i]='undone';draw(st,cm,1);await L.sleep(170);if(!alive())return null;}}
    S.ran=true;S.busy=false;render();return r;
  }
  render();
  return {S,render,play,set,alive,unlock(){S.lock=false;S.live=true;render();},setCode(c){S.code=c;S.ran=false;render();}};
}

/* =====================================================================
   2. RACE: two bookings at the same moment bump one counter.
   ===================================================================== */
function Race(L,host,o){
  const ID=o.id,S={busy:false,ran:new Set()},STEP=['insert parcel','read counter','write counter + 1'];
  host.insertAdjacentHTML('beforeend','<div class="tp"><svg class="tp-svg" id="'+ID+'-svg" viewBox="0 0 330 206" role="img" aria-label="Booking A and booking B each insert a parcel and add 1 to the shared counter in the Parcel DB, which has no built-in increment"></svg>'+
   '<div class="tp-ctl"><button class="btn" id="'+ID+'-w">'+L.ic('play')+'Run: isolation off</button><button class="btn" id="'+ID+'-s">'+L.ic('play')+'Run: serializable</button></div><div id="'+ID+'-out" aria-live="polite"></div></div>');
  const q=s=>host.querySelector(s),svg=q('#'+ID+'-svg'),out=q('#'+ID+'-out');
  let A,B,db,hot,fin=false;
  function reset(){A=STEP.map(()=>({sub:'',ord:0,st:'idle'}));B=STEP.map(()=>({sub:'',ord:0,st:'idle'}));db={p:42,c:42};hot=null;fin=false;}
  function draw(){
    if(!svg.isConnected)return;
    let s=tx(61,16,'Booking A',{z:12.5,b:1,f:'var(--h1)',a:'m'})+tx(165,16,'Parcel DB',{z:12.5,b:1,f:'var(--h2)',a:'m'})+tx(269,16,'Booking B',{z:12.5,b:1,f:'var(--h4)',a:'m'});
    s+=rc(126,30,78,132,12,'fill:var(--h2-bg);stroke:var(--h2);stroke-width:1.5')+tx(165,54,'parcels',{a:'m',f:'var(--muted)'})+tx(165,80,db.p,{z:24,b:1,a:'m'})+
      tx(165,110,'counter',{a:'m',f:'var(--muted)'})+tx(165,136,db.c,{z:24,b:1,a:'m',f:fin&&db.c!==db.p?'var(--no)':fin?'var(--ok)':'var(--ink)'});
    [['A',A,2,'var(--h1)','var(--h1-bg)'],['B',B,210,'var(--h4)','var(--h4-bg)']].forEach(([w,X,x,col,bg])=>{
      X.forEach((st,i)=>{const y=30+i*46,h=hot&&hot[0]===w&&hot[1]===i;

    S.done.add(S.k);S.busy=false;o.on(S.k);
  }
  q('#'+ID+'-p').innerHTML=Object.keys(TRY).map(k=>'<button class="chip" data-k="'+k+'" id="'+ID+'-p'+k+'">'+TRY[k].c+'</button>').join('');
  Object.keys(TRY).forEach(k=>{q('#'+ID+'-p'+k).onclick=()=>pick(k);});
  q('#'+ID+'-r').onclick=retry;
  draw([]);
  return {S,pick,retry};
}

Course.lesson({
  id:'0015', title:'What a transaction promises', minutes:20, icon:'shield',
  goals:['Say what each letter of ACID really promises, and which one is the app’s job','Tell when one-object operations are enough and when you need a multi-object transaction','Decide when retrying an aborted transaction is safe, and when it backfires'],
  parts:['All or nothing','The four letters','One object or many','Aborts and retries'],
  read:'Read the start of chapter 7, up to “Weak Isolation Levels”, for the full ACID discussion and the sidebar on replication and durability.',
  glossary:{
    acid:'ACID: Atomicity, Consistency, Isolation, Durability. A popular label for the safety promises of transactions. Each database fills it in its own way, so the label alone tells you little.',
    atomicity:'Atomicity (in ACID): if a fault stops a transaction partway, the database throws away all of its writes. “Abortability” would be a clearer name.',
    invariant:'Invariant: a rule about your data that must always be true, such as “every merchant’s balance equals top-ups minus parcel prices”.',
    race:'Race condition: a bug that only appears when two clients happen to touch the same data at nearly the same moment.',
    denorm:'Denormalization: keeping a copy or summary of data in a second place (like a stored count) so reads are faster. The copy must then be kept in step by hand.',
    cas:'Compare-and-set: a single-object write that only happens if the value is still what you read earlier. If someone changed it, the write does nothing and you try again.',
    backoff:'Exponential backoff: waiting longer before each new retry (say 1, 2, then 4 seconds), so retries don’t pile onto a system that is already struggling.',
    fsync:'fsync: a call that tells the operating system to push data all the way to the disk, instead of leaving it in memory for a while.'
  },
  cheatsheet:[
    'A <b>transaction</b> groups reads and writes into one unit: <b>commit</b> all of it or <b>abort</b> all of it, so the app can retry instead of untangling a half-done job.',
    'Transactions are a <b>trade-off</b>, not a law of nature. “Big systems can’t have them” and “serious apps need full ACID” are both hype.',
    '<b>Atomicity</b> = abortability. It is about faults partway through, not about concurrency.',
    '<b>Consistency</b> = your app’s invariants. It is the app’s job; atomicity, isolation and durability are the database’s.',
    '<b>Isolation</b> = concurrent transactions don’t step on each other. Formally that’s serializability, which is rarely the setting in practice.',
    '<b>Durability</b> = committed data isn’t forgotten. Perfect durability doesn’t exist, so combine disk, replication and backups.',
    'One-object operations (atomic increment, compare-and-set) are useful but are <b>not</b> transactions. Foreign keys, denormalized copies and secondary indexes need multi-object transactions.',
    'Retry only <b>transient</b> errors, a limited number of times with backoff. Watch for lost replies (double work), side effects outside the database and overload.'
  ],
  steps:[
/* ---------- PART 1: ALL OR NOTHING ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Tobias’s booking code inserts a parcel, then deducts its price from the merchant’s credit. The server crashes between the two steps. With no protection, what is left in the Parcel DB?</h1>');
  L.mc(L.card,['A booked parcel that nobody paid for','Nothing, because the booking failed','Both writes, because the code was right'],0,
   'The first write happened and the second never did. The data is now half done, and nobody knows which half. This lesson is about the tool that prevents that.',
   'Nothing undoes the first write by itself. The parcel row is there, the payment isn’t: a half-done booking.');}},
{part:0,src:'Chapter 7 · Transactions',run(L){
  L.h(L.kick('learn','Many things can go wrong')+'<h1 class="q">A transaction turns a messy failure into a clean “try again”</h1>'+CSS+FIG_WRONG()+
   L.prose('Any of these can leave a booking half done. A <b>'+L.g('transaction','transaction')+'</b> groups reads and writes into one unit: it either <b>commits</b> all of them or <b>aborts</b> all of them. After an abort, the app simply tries again.'));
  L.done();}},
{part:0,src:'Chapter 7 · Transactions',
 solve:async L=>{for(const v of [1,2,4]){setRange(L,'x3-r',v);await L.sleep(30);}},
 run(L){
  const tried=new Set();let fin=false;
  L.h(L.kick('ex','Try it live · crash scissors')+'<h1 class="q">Tobias’s booking makes four writes, with no transaction. Drag the scissors to crash the server at different points.</h1>'+CSS+'<div id="x3"></div><div class="tp-done" id="x3t"></div>');
  const upd=()=>{L.$('#x3t').innerHTML=[1,2,3,3.5].map(c=>'<span class="'+(tried.has(c)?'y':'')+'">'+(c===3.5?'mid write 4':'after write '+c)+'</span>').join('');};
  Strip(L,L.$('#x3'),{id:'x3',tx:false,cut:5,on:r=>{
    if([1,2,3,3.5].includes(r.c))tried.add(r.c);upd();
    if(tried.size>=3&&!fin){fin=true;
      sheetAt(L,L.$('#x3-out'),'info','No safe place to crash','Every cut between write 1 and write 4 leaves a <b>partial failure</b>: some writes landed, some didn’t, and at least one check breaks. Tobias’s code can’t easily tell which. A retry risks doing writes twice. Next: the same crash inside a transaction.');L.done();}}});
  upd();}},
{part:0,src:'Chapter 7 · Transactions',pts:1,
 solve:async L=>{L.$('#p4c').children[1].click();for(let i=0;i<150&&!L.$('#p4fin');i++)await L.sleep(30);},
 run(L){
  let pick=null;
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">Same booking, now between <b>BEGIN</b> and <b>COMMIT</b>. The server crashes right after write 2. After the restart, what is left?</h1>'+CSS+
   '<div class="tp-ctl" id="p4c"></div><div id="p4"></div><div id="p4x"></div>');
  const s=Strip(L,L.$('#p4'),{id:'p4',tx:true,cut:2,live:false,lock:true,txBtn:false});
  ['Writes 1 and 2 stay; 3 and 4 never ran','Nothing: writes 1 and 2 are undone','All four: the database finishes the job'].forEach((t,j)=>{
    const b=document.createElement('button');b.className='chip';b.textContent=t;
    b.onclick=async()=>{if(pick!==null)return;pick=j;b.classList.add('sel');const r=await s.play();if(!r)return;
      const ok=j===1;L.award(ok);
      sheetAt(L,L.$('#p4-out'),ok?'ok':'no',ok?'Right: rolled back':'It rolled everything back','The crash came before COMMIT, so the database discarded writes 1 and 2. Every check passes, and the app knows <b>nothing changed</b>, so it can simply retry. In SQL databases, everything between BEGIN and COMMIT on one connection counts as one transaction.');
      L.$('#p4x').innerHTML='<p class="tp-small" id="p4fin">Now drag the scissors anywhere. Every cut before COMMIT leaves no trace.</p>';s.unlock();L.done();};
    L.$('#p4c').appendChild(b);});}},
{part:0,src:'Chapter 7 · The Slippery Concept of a Transaction',run(L){
  L.h(L.kick('learn','Not a law of nature')+'<h1 class="q">Transactions were designed on purpose, and fashions about them swing</h1>'+CSS+FIG_HISTORY()+
   L.quote('Both viewpoints are pure hyperbole.','Martin Kleppmann, chapter 7')+
   L.prose('Transactions make apps simpler by handling some faults and concurrency for you. To decide if you need them, know what they promise and cost.'));
  L.done();}},

/* ---------- PART 2: THE FOUR LETTERS ---------- */
{part:1,src:'Chapter 7 · The Meaning of ACID',run(L){
  const tile=(k,cls,name,d,who)=>'<div class="'+cls+'"><div class="lt"><b>'+k+'</b><span>'+name+'</span></div>'+mini[k]+'<div class="d">'+d+'</div><span class="who">'+who+'</span></div>';
  L.h(L.kick('learn','Four letters')+'<h1 class="q">ACID: four different promises under one label</h1>'+CSS+
   '<div class="tp-acid">'+tile('A','','Atomicity','A fault partway? Undo every write.','database’s job')+tile('C','c','Consistency','Your app’s rules stay true.','your app’s job')+
   tile('I','','Isolation','Transactions running at once don’t collide.','database’s job')+tile('D','','Durability','Committed data isn’t forgotten.','database’s job')+'</div>'+
   L.prose('Härder and Reuter coined '+L.g('acid','ACID')+' in 1983. Each database fills it in differently, so “ACID compliant” now says little: it’s mostly marketing. Systems that aren’t are sometimes called <b>BASE</b>, which really just means “not ACID”.'));
  L.done();}},
{part:1,src:'Chapter 7 · Atomicity',run(L){
  L.h(L.kick('learn','A is for “abortability”')+'<h1 class="q">Atomicity is about faults, not about two users at once</h1>'+CSS+FIG_ATOMIC()+
   L.prose('In ACID, '+L.g('atomicity','atomicity')+' covers a fault partway through: a crash, a cut connection, a full disk or a broken constraint. The transaction is aborted and its writes discarded. The book suggests “abortability” as the clearer name.'));
  L.done();}},
{part:1,src:'Chapter 7 · Atomicity',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Kwame says: “ACID atomicity means two bookings running at the same moment can’t see each other’s half-done work.” Which letter actually covers that?</h1>');
  L.mc(L.card,['Atomicity','Durability','Isolation'],2,
   'Right. What concurrent transactions can see of each other is isolation. Atomicity is about undoing writes after a fault.',
   'That’s isolation. In ACID, atomicity means “abort and discard everything if a fault hits partway”. It says nothing about concurrency.');}},
{part:1,src:'Chapter 7 · Isolation',
 solve:async L=>{L.$('#r9-w').click();await idle(L,L.race.S);L.$('#r9-s').click();await idle(L,L.race.S);},
 run(L){
  L.h(L.kick('ex','See it happen · isolation')+'<h1 class="q">During a flash sale, two app servers book Bramble & Bolt parcels at the same moment. The database has no built-in increment, so each reads the counter, adds 1, writes it back. Run it both ways.</h1>'+CSS+'<div id="r9"></div>');
  L.race=Race(L,L.$('#r9'),{id:'r9',on:()=>{
    if(L.race.S.ran.size===2){
      sheetAt(L,L.$('#r9-out'),'info','That’s the I in ACID','Atomicity was on both times and didn’t help. '+L.g('isolation','Isolation')+' means concurrent transactions can’t step on each other. Textbooks define it as <b>serializability</b>: the result is as if they ran one after another. It costs speed, so it’s rarely used. Oracle 11g’s “serializable” setting is really something weaker (next lesson).');L.done();}}});}},
{part:1,src:'Chapter 7 · Consistency',run(L){
  L.h(L.kick('learn','The odd letter out')+'<h1 class="q">“Consistency” is the app’s job, not the database’s</h1>'+CSS+FIG_CONS()+
   L.prose('ACID’s C means your '+L.g('invariant','invariants')+', rules that must always hold, stay true. Only the app knows them; the database checks a few, like foreign keys and uniqueness. A, I and D belong to the database. C belongs to the app.'));
  L.done();}},
{part:1,src:'Chapter 7 · Consistency',
 solve:async L=>{L.$('#c11b').click();await L.sleep(20);L.$('#c11go').click();await idle(L,L.strip.S);},
 run(L){
  let fin=false;
  L.h(L.kick('ex','Try it live · break the C')+'<h1 class="q">Every booking now runs inside a transaction, with no crash. Can it still break Otterpost’s rules? Pick Tobias’s code, then run it.</h1>'+CSS+
   '<div class="tp-ctl" id="c11c"></div><button class="btn pri" id="c11go">'+L.ic('play')+'Run the booking</button><div id="c11"></div>');
  const s=L.strip=Strip(L,L.$('#c11'),{id:'c11',tx:true,cut:5,scissors:false,drag:false,range:false,live:false});
  [['ok','Correct code','c11a'],['bug80','Bug: deducts $80','c11b'],['skip','Bug: skips the counter','c11d']].forEach(([k,t,id],j)=>{
    const b=document.createElement('button');b.className='chip'+(j===0?' sel':'');b.id=id;b.textContent=t;
    b.onclick=()=>{if(s.S.busy)return;[...L.$('#c11c').children].forEach(x=>x.classList.toggle('sel',x===b));s.setCode(k);};L.$('#c11c').appendChild(b);});
  L.$('#c11go').onclick=async()=>{const r=await s.play();if(!r)return;
    if(r.code!=='ok'&&!fin){fin=true;
      sheetAt(L,L.$('#c11-out'),'info','A clean commit of wrong data','Atomic, isolated, durable, and still wrong. The database can’t know that the credit must equal $1,000 − $8 × parcels; it just stores what the code writes. Keeping invariants true is the app’s job. (Joe Hellerstein has remarked that the C was added mainly to make the acronym work.)');L.done();}};}},
{part:1,src:'Chapter 7 · Durability',run(L){
  L.h(L.kick('learn','D is for “don’t forget”')+'<h1 class="q">Committed means written somewhere that survives a crash</h1>'+CSS+FIG_DUR()+
   L.prose('<b>Durability</b>: once committed, the booking survives a crash. The database reports “committed” only after the disk write ('+L.g('fsync','fsync')+' plus a log) or the copies finish. No setup is perfect: lose every disk and backup together, and nothing helps.'));
  L.done();}},
{part:1,src:'Chapter 7 · Replication and Durability',
 solve:async L=>{for(const d of ['crash','machine','fire'])L.$('#l13-d'+d).click();},
 run(L){
  let fin=false;
  L.h(L.kick('ex','Try it live · durability ladder')+'<h1 class="q">A booking just committed. Switch rungs on and off, then hit it with disasters. Where does it survive?</h1>'+CSS+'<div id="l13"></div><div class="tp-done" id="l13t"></div>');
  const lad=Ladder(L,L.$('#l13'),{id:'l13',sel:['mem','disk'],on:()=>{
    L.$('#l13t').innerHTML='<span class="'+(lad.S.tried.size>=3?'y':'')+'">Disasters tried: '+lad.S.tried.size+' of 3</span>';
    if(lad.S.tried.size>=3&&!fin){fin=true;
      sheetAt(L,L.$('#l13-out'),'info','Every rung has a gap','Disk survives crashes but not a fire. Replicas stay available, but one bug or power cut can hit them all, and they copy bad writes too. Backups miss today’s data. SSDs fail as well: one study found 30–80% develop a bad block within four years. Use the rungs <b>together</b>.');L.done();}}});
  L.$('#l13t').innerHTML='<span>Disasters tried: 0 of 3</span>';}},
{part:1,src:'Chapter 7 · The Meaning of ACID',pts:6,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which letter of ACID?',['Atomicity','Consistency','Isolation','Durability'],[
   ['Deducting the price fails, so the database undoes the parcel row inserted a moment before.',0,'A fault partway through, so every write is thrown away: atomicity.'],
   ['Otterpost’s rule: a balance must equal top-ups minus parcel prices, and Otterpost’s code must keep it true.',1,'An app-defined invariant that the app must uphold: consistency.'],
   ['While a booking is half done, Linh’s report sees either all of its writes or none of them.',2,'What one transaction can see of another running at the same time: isolation.'],
   ['The power fails one second after a booking commits. After the restart, the booking is still there.',3,'Committed data survives a crash: durability.'],
   ['The booking API only says “booked” once the write has reached two replicas.',3,'Waiting for the copies before reporting a commit is how a replicated database offers durability.'],
   ['Femi decides no merchant may book with a negative balance. The database stores whatever it is told.',1,'Only the app knows this rule, so keeping it is the app’s job: consistency.']]);}},
{part:1,src:'Chapter 7 · Replication and Durability',pts:1,
 solve:async L=>{L.$('#l15-tdisk').click();L.$('#l15-tregion').click();L.$('#l15-tbackup').click();await L.sleep(20);L.$('#l15go').click();for(let i=0;i<150&&!L.$('#l15ok');i++)await L.sleep(30);},
 run(L){
  let first=true,running=false;
  const GOALS=[['crash','Process crash: the booking survives',v=>v[0]==='ok'],['machine','Leader’s machine dies: still reachable',v=>v[0]==='ok'],['fire','Westport datacenter fire: survives',v=>v[0]==='ok'],['drop','Table dropped: last night’s data comes back',v=>v[0]==='ok'||/last night/.test(v[1])]];
  L.h(L.kick('pr','Challenge · Kwame’s Peak Week checklist')+'<h1 class="q">Pass all four disasters, with each commit waiting <b>6 units or less</b> (illustrative units). Pick the rungs, then run the drill.</h1>'+CSS+
   '<div id="l15"></div><button class="btn pri" id="l15go" style="margin-top:6px">'+L.ic('play')+'Run the drill</button><div id="l15res"></div>');
  const lad=Ladder(L,L.$('#l15'),{id:'l15',sel:['mem','disk'],dis:GOALS.map(g=>g[0])});
  L.$('#l15go').onclick=async()=>{
    if(running)return;running=true;lad.S.busy=true;L.$('#l15go').disabled=true;L.$('#l15res').innerHTML='';
    const res=[];
    for(const g of GOALS){lad.pick(g[0]);const v=ladderOut(lad.S.sel,g[0]);res.push([g[1],g[2](v)]);await L.sleep(380);if(!L.$('#l15'))return;}
    const w=waitOf(lad.S.sel);res.push(['Each commit waits '+w+' units (6 or less)',w<=6]);
    L.$('#l15res').innerHTML='<ul class="tp-chk">'+res.map(x=>'<li class="'+(x[1]?'ok':'no')+'">'+L.ic(x[1]?'check':'x')+'<span>'+x[0]+'</span></li>').join('')+'</ul>';
    const pass=res.every(x=>x[1]);if(first){L.award(pass);first=false;}
    running=false;lad.S.busy=false;L.$('#l15go').disabled=false;
    if(pass){L.$('#l15go').disabled=true;L.$('#l15res').insertAdjacentHTML('beforeend','<span id="l15ok"></span>');
      sheetAt(L,L.$('#l15res'),'ok','Drill passed','A copy in <b>another region</b> survives the crash, the dead machine and the fire. Only a <b>backup</b> brings back a dropped table, because replicas copy the drop at once. The leader’s disk is optional here (1 more unit), but cheap insurance. Westport followers can’t survive the fire and push the wait past 6.');L.done();}
    else sheetAt(L,L.$('#l15res'),'no','Not yet','Look at the red lines. Which disaster takes out every copy in Westport? Which one do replicas copy straight away? Change the rungs and run the drill again.');};}},
{part:1,src:'Chapter 7 · Replication and Durability',pts:1,
 solve:async L=>{L.$('#l16-ddrop').click();L.$('#l16-dfirm').click();for(let i=0;i<50&&!L.$('#l16q .opts');i++)await L.sleep(20);},
 run(L){
  let asked=false;
  L.h(L.kick('pr','Kwame’s proposal')+'<h1 class="q">“Each region’s Parcel DB leader now has two followers in the same datacenter: three copies,” says Kwame. “We can stop the nightly backups.” Test his setup on two disasters, then answer.</h1>'+CSS+'<div id="l16"></div><div id="l16q"></div>');
  const lad=Ladder(L,L.$('#l16'),{id:'l16',sel:['mem','disk','dc'],toggle:false,dis:['crash','fire','firm','rot','drop'],on:()=>{
    if(lad.S.tried.size>=2&&!asked){asked=true;
      L.$('#l16q').innerHTML='<h2 class="sub" style="margin-top:14px">What should Zainab answer?</h2>';
      L.mc(L.$('#l16q'),['Agree: three copies make data loss impossible','Keep backups: one fault can hit every copy','Agree, as long as all replicas run on SSDs'],1,
       'A dropped table, a shared firmware bug or slow corruption reaches every replica together. Disk, replication and backups each cover gaps the others leave, so use them together.',
       'Replicas share risks: a bad write is copied everywhere at once, and one bug or power cut can hit them all. SSDs fail too. Backups are still needed.');}}});}},

/* ---------- PART 3: ONE OBJECT OR MANY ---------- */
{part:2,src:'Chapter 7 · Single-object writes',run(L){
  L.h(L.kick('learn','Even one object needs protecting')+'<h1 class="q">Writing one 20 KB document raises three questions</h1>'+CSS+FIG_ONE()+
   L.prose('Storage engines almost always protect one object on one node: a crash-recovery log and a lock per object. Some add atomic increment and '+L.g('cas','compare-and-set')+'. Useful, but these are <b>not transactions</b>, whatever the marketing calls them.'));
  L.done();}},
{part:2,src:'Chapter 7 · Single-object writes',
 solve:async L=>{for(const k of Object.keys(DZ)){L.$('#z18-p'+k).click();await idle(L,L.dz.S);}},
 run(L){
  let fin=false;
  L.h(L.kick('ex','Edge cases · one object')+'<h1 class="q">Back to write 4 of Tobias’s booking, with no transaction. Interrupt the 20 KB dashboard doc three ways.</h1>'+CSS+'<div id="z18"></div>');
  L.dz=DocZoom(L,L.$('#z18'),{id:'z18',on:()=>{
    if(L.dz.S.done.size===3&&!fin){fin=true;
      sheetAt(L,L.$('#z18-out'),'info','One object is safe. The booking isn’t.','The engine keeps the doc whole: old or new, never half. But the parcel row, the credit and the counter are separate objects that already changed. Single-object protection can’t tie them together. Selling it as “lightweight transactions” is misleading: a transaction groups several objects into one unit.');L.done();}}});}},
{part:2,src:'Chapter 7 · The need for multi-object transactions',run(L){
  L.h(L.kick('learn','When one object isn’t enough')+'<h1 class="q">Three common cases need several writes to land together</h1>'+CSS+FIG_MULTI()+
   L.prose('Foreign keys, '+L.g('denorm','denormalized')+' copies and secondary indexes must change together. BEGIN … COMMIT groups their writes; a key-value multi-put may leave some done and some not.'));
  L.done();}},
{part:2,src:'Chapter 7 · Single-Object and Multi-Object Operations',pts:5,run(L){
  L.h(L.kick('pr','One object or many?')+'<h1 class="q">Sort each Otterpost job.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['One object is enough','Needs a multi-object transaction'],[
   ['Add 1 to a courier’s “deliveries today” with an atomic increment',0,'One object, one built-in atomic operation.'],
   ['Insert a delivery attempt and update the parcel’s copied “attempts” field',1,'A denormalized copy that must change with the source.'],
   ['Replace a parcel’s whole label document in one write',0,'Storage engines make a single-object write atomic and isolated.'],
   ['Insert a parcel that points to a merchant row created in the same step',1,'Two rows that refer to each other: the foreign key must be valid.'],
   ['Set status to “out for delivery” only if it is still “at hub”',0,'That’s compare-and-set on one object.']],
   'One object: the storage engine, increment or compare-and-set cover you. Several objects in step need a transaction. Many distributed stores dropped those: hard across '+L.g('partition','partitions')+' and costly for speed or availability, though not impossible (chapter 9). Document stores without joins push you to copy data; without transactions, keeping it right is your code’s job.');}},

/* ---------- PART 4: ABORTS AND RETRIES ---------- */
{part:3,src:'Chapter 7 · Handling errors and aborts',run(L){
  L.h(L.kick('learn','Abort, then retry')+'<h1 class="q">An abort is only useful if someone retries</h1>'+CSS+FIG_ABORT()+
   L.prose('ACID databases undo a failed transaction; leaderless stores keep what they did. Many ORMs (libraries mapping objects to tables) never retry, wasting the point of aborts: <b>safe retries</b>.'));
  L.done();}},
{part:3,src:'Chapter 7 · Handling errors and aborts',
 solve:async L=>{const t=L.tries;for(const k of Object.keys(TRY)){L.$('#t22-p'+k).click();await idle(L,t.S);L.$('#t22-r').click();await idle(L,t.S);}},
 run(L){
  let fin=false;
  L.h(L.kick('ex','Edge cases · retry lab')+'<h1 class="q">Tobias’s booking is aborted, and the app retries. Is retrying always safe? Try all six errors.</h1>'+CSS+'<div id="t22"></div><div class="tp-done" id="t22t"></div>');
  const upd=()=>{L.$('#t22t').innerHTML=Object.keys(TRY).map(k=>'<span class="'+(L.tries.S.done.has(k)?'y':'')+'">'+TRY[k].c+'</span>').join('');};
  L.tries=Tries(L,L.$('#t22'),{id:'t22',on:()=>{upd();
    if(L.tries.S.done.size===6&&!fin){fin=true;
      sheetAt(L,L.$('#t22-out'),'info','Retrying is simple, not perfect','Retry only <b>transient</b> errors (deadlock, isolation conflict, network blip, failover), a limited number of times with '+L.g('backoff','exponential backoff')+'. Guard against a commit whose reply was lost. Keep side effects like webhooks out of the retry, or tie systems together with two-phase commit (chapter 9).');L.done();}}});
  upd();}},
{part:3,src:'Chapter 7 · Handling errors and aborts',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'What about retrying this?',['Fine to retry','Pointless: it fails again','May run twice','A side effect repeats','Makes overload worse'],[
   ['Ravi’s scan update is aborted because it clashed with another transaction (an isolation conflict).',0,'An isolation conflict is transient. The next attempt will most likely go through.'],
   ['A merchant’s top-up fails because the amount breaks a “must be positive” rule.',1,'A constraint violation is permanent. The same request fails the same way every time.'],
   ['A $50 credit top-up committed, but the reply was lost. The dashboard sends the top-up again.',2,'The first commit worked. Without a duplicate check, the merchant gets $100 of credit.'],
   ['Each booking attempt texts the recipient a pickup code before committing. The commit aborts and is retried.',3,'The text went out on the first attempt. Each retry sends another one: the abort didn’t undo it.'],
   ['During Peak Week the Parcel DB rejects writes because it is overloaded. Every app server retries instantly, again and again.',4,'Instant, unlimited retries add load to a database that is already struggling. Limit them and back off.']]);}},
{part:3,src:'Chapter 7 · Handling errors and aborts',pts:1,run(L){
  L.h(L.kick('pr','Write the rule')+'<h1 class="q">Zainab writes a retry rule for Tobias’s booking code. Tap each piece until the rule is safe.</h1>');
  L.sentence(L.card,[['Retry every error','Retry only transient errors'],['instantly, with no limit','a few times, with backoff'],['and check for duplicates','and trust each runs once']],[1,1,0],
   [['A broken constraint or other permanent error will just fail again.'],['Instant, unlimited retries pile load onto a database that may already be overloaded.'],['If a commit worked but its reply was lost, a blind retry books the parcel twice.']],
   'Retry what can succeed next time, don’t add to overload, and guard against a commit that already happened.');}}
  ]
});
</script>
