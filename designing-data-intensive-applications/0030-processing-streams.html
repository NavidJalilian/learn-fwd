/* =====================================================================
   Lesson 0030 only. Two signature models, reused through the lesson:
   1. Sc: the event-time vs processing-time scatter. Each dot is 10 scans
      at Westport Central: x = when the scan happened, y = when Linh's job
      processed it (on-time dots sit on the diagonal). Basis switch:
      event-time windows are vertical bands, processing-time windows are
      horizontal bands; live per-minute bars. A "window closes" step line
      (event time + allowance) turns later dots into stragglers.
   2. Odo: the checkpoint odometer. Bramble & Bolt's "delivered today"
      counter in an outside database, fed by delivered scans (offsets
      7,041-7,056) with checkpoint barriers. Crash, restart from the last
      checkpoint, and watch the counter overshoot unless the job stores
      the offset with the value or commits output and offset together.
   Scan rates, intervals and targets are illustrative.
   ===================================================================== */

 '.jn30 .ev.bk{border-color:var(--h2);background:var(--h2-bg)}.jn30 .ev.new{box-shadow:0 0 0 3px var(--pri-bg);border-color:var(--pri)}'+

/* ---------------- small SVG helpers ---------------- */
const f1=n=>Math.round(n*10)/10;
const tx=(x,y,t,cls,anc,st)=>'<text x="'+f1(x)+'" y="'+f1(y)+'"'+(anc?' text-anchor="'+anc+'"':'')+' class="'+(cls||'t30')+'"'+(st?' style="'+st+'"':'')+'>'+t+'</text>';
const rc=(x,y,w,h,fill,stroke,rx,st)=>'<rect x="'+f1(x)+'" y="'+f1(y)+'" width="'+f1(w)+'" height="'+f1(h)+'" rx="'+(rx==null?8:rx)+'" style="fill:'+(fill?'var(--'+fill+')':'none')+';stroke:'+(stroke?'var(--'+stroke+')':'none')+';stroke-width:1.5'+(st?';'+st:'')+'"/>';
const ln=(x1,y1,x2,y2,col,w,dash)=>'<path d="M'+f1(x1)+' '+f1(y1)+' L'+f1(x2)+' '+f1(y2)+'" style="stroke:var(--'+(col||'line2')+');stroke-width:'+(w||1.5)+';fill:none'+(dash?';stroke-dasharray:'+dash:'')+'"/>';
const dot=(x,y,r,col,hollow)=>'<circle cx="'+f1(x)+'" cy="'+f1(y)+'" r="'+r+'" style="'+(hollow?'fill:var(--card);stroke:var(--'+col+');stroke-width:2':'fill:var(--'+col+')')+'"/>';
function ar(x1,y1,x2,y2,col,w){col=col||'muted';const a=Math.atan2(y2-y1,x2-x1),bx=x2-7*Math.cos(a),by=y2-7*Math.sin(a),px=-Math.sin(a)*4,py=Math.cos(a)*4;
  return ln(x1,y1,bx,by,col,w||2)+'<path d="M'+f1(x2)+' '+f1(y2)+' L'+f1(bx+px)+' '+f1(by+py)+' L'+f1(bx-px)+' '+f1(by-py)+'Z" style="fill:var(--'+col+')"/>';}
const pic=(h,label,body)=>'<svg class="pic30" viewBox="0 0 340 '+h+'" role="img" aria-label="'+label+'">'+body+'</svg>';
const more=(s,t)=>'<details class="more30"><summary>'+s+'</summary><p>'+t+'</p></details>';
const vd=(k,t)=>'<span class="vd30 '+k+'">'+t+'</span>';
const hm=m=>{const h=Math.floor(m/60),x=Math.round(m-h*60);return (h<10?'0':'')+h+':'+(x<10?'0':'')+x;};
const fmt=n=>n.toLocaleString('en-US');
function chips(host,names,onPick){host.innerHTML='';const bs=names.map((n,j)=>{const b=document.createElement('button');b.className='chip';b.innerHTML=n;
  b.onclick=()=>{bs.forEach((x,q)=>x.classList.toggle('sel',q===j));onPick(j,b);};host.appendChild(b);return b;});return bs;}
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

const P_JOINS=(()=>{let g='';
  const R=[['Stream–stream (window join)',['card left','h4'],['redelivery booked','h4'],['both kinds,','last 48 h'],['match, or','no match']],

    g+=ar(256,y+45,268,y+45)+rc(270,y+20,64,50,'ok-bg','ok-line',10)+tx(302,y+41,r[4][0],'m30','middle','fill:var(--ok)')+tx(302,y+57,r[4][1],'m30','middle','fill:var(--ok)');});

function scans(o){o=o||{};const r=rng(o.seed||7),out=[];
  for(let m=0;m<10;m++)for(let k=0;k<6;k++){const e=m+0.06+0.15*k+(r()-0.5)*0.04;

  if(o.redeploy!=null)out.forEach(d=>{if(d.p>=o.redeploy&&d.p<o.redeploy+1)d.p=o.redeploy+1+(d.p-o.redeploy)*0.35;});
  if(o.offline)[2.3,2.45,2.6].forEach(e=>out.push({e,p:e+120,k:'r'}));
  if(o.clock)[5.2,5.4,5.6,5.8].forEach(t=>out.push({e:t-60,t,p:t+0.15,k:'c'}));

function Sc(host,cfg){

      if(s.A>=1&&1+s.A<=9)g+=tx(SX(0)+2,SY(1+s.A)-6,'window closes','m30','start','fill:var(--no);font-weight:600');}
    let top=null,left=null;

const DSN=['Add 1 per scan','Store offset with value','Commit output + offset together'],DK=['plain','offset','atomic'],IV=[2,4,8,16],IVL=['every 0.5 s','every 1 s','every 2 s','every 4 s'];
function odoSim(o){
  const N=16,cells=Array(N).fill(''),redo=Array(N).fill(false),snaps=[];let C=1200,T=1200,stored=7040,ck=-1,buf=[],head=-1,crashAt=-1,zomb=null;const seen=new Set();
  const snap=()=>snaps.push({cells:cells.slice(),redo:redo.slice(),C,T,head,ck,crashAt,zomb});
  const bar=i=>(i+1)%o.I===0;
  const proc=i=>{head=i;if(!seen.has(i)){seen.add(i);T++;}const off=7041+i;
    if(o.design==='plain'){C++;cells[i]=cells[i]?'a2':'a';}
    else if(o.design==='offset'){if(off>stored){C++;stored=off;cells[i]='a';}else cells[i]=o.special==='reorder'&&!cells[i]?'u':'s';}
    else{buf.push(i);cells[i]='b';}
    if(bar(i)){ck=i;if(o.design==='atomic'){C+=buf.length;buf.forEach(j=>{cells[j]='c';});buf=[];}}
    snap();};
  snap();
  if(o.special==='reorder'){[0,1,2,3,5,6].forEach(proc);crashAt=6;snap();[4,7,8,9,10,11,12,13,14,15].forEach(proc);}
  else{const c=o.crash;
    if(c>=0&&c<N-1){for(let i=0;i<=c;i++)proc(i);crashAt=c;if(o.design==='atomic'){buf.forEach(j=>{cells[j]='x';redo[j]=true;});buf=[];}snap();
      for(let i=ck+1;i<N;i++)proc(i);}
    else for(let i=0;i<N;i++)proc(i);
    if(o.special==='zombie'){zomb=o.fence?'rejected':'wrote';if(!o.fence)C=1208;head=-1;snap();}}
  const f=snaps[snaps.length-1];f.over=f.C-f.T;return {snaps,final:f};}
function Odo(host,cfg){

  const dg=host.querySelectorAll('.dg'),svg=host.querySelector('svg'),rd=host.querySelector('.rd30');let timer=null,last=null;
  const CX=i=>12+(i%8)*40,CY=i=>i<8?40:114;

  const draw=(sn,running)=>{let g=tx(12,16,'Delivered scans · offsets 7,041 → 7,056','t30');
    for(let i=0;i<16;i++){const x=CX(i),y=CY(i),st=sn.cells[i],L=LB[st]||['','card','line2'];
      g+=rc(x,y,36,34,L[1],L[2],7,st==='b'||st==='x'?'stroke-dasharray:4 3':'')+tx(x+18,y+15,'0'+(41+i),'t30','middle',st?'':'fill:var(--faint)');
      const lab=sn.redo[i]&&st==='c'?'redo':L[0];if(lab)g+=tx(x+18,y+29,lab,'m30','middle','font-weight:700;fill:var(--'+(st==='s'?'ok':st==='b'?'pri-deep':'no')+')');}
    if(o.special!=='reorder'){g+=ln(9,34,9,80,sn.ck===-1?'h2':'line2',sn.ck===-1?3:2);
      for(let i=0;i<16;i++)if((i+1)%o.I===0){const x=CX(i)+38,y=CY(i);g+=ln(x,y-6,x,y+40,i===sn.ck?'h2':'line2',i===sn.ck?3.2:2);}
      const cx=sn.ck===-1?9:CX(sn.ck)+38,cy=sn.ck===-1?40:CY(sn.ck);g+=tx(Math.max(36,Math.min(cx,300)),cy+50,'checkpoint','m30','middle','fill:var(--h2);font-weight:700');}
    if(sn.crashAt>=0){const x=CX(sn.crashAt)+37,y=CY(sn.crashAt);g+='<path d="M'+x+' '+(y-4)+' l4 8 l-6 8 l6 8 l-6 8 l4 8" style="stroke:var(--no);stroke-width:3;fill:none"/>'+tx(Math.min(x,318),y-8,'crash','m30','middle','fill:var(--no);font-weight:700');}
    if(sn.head>=0&&running){const x=CX(sn.head)+18,y=CY(sn.head);g+='<path d="M'+(x-6)+' '+(y-12)+' h12 l-6 8z" style="fill:var(--pri)"/>';}
    svg.innerHTML=g;dg[0].textContent=fmt(sn.C);dg[1].textContent=fmt(sn.T);};
  const res=sim=>{const f=sim.final;last=f;const k=f.over===0?'ok':'no';
    rd.innerHTML=vd(k,f.over===0?'Exact':f.over>0?'Over by '+f.over:'Under by '+(-f.over))+(cfg.read?cfg.read(f,o):'')+'';if(cfg.on)cfg.on(f,o);};
  const api={o,
    run(fast){if(timer)clearInterval(timer);const sim=odoSim(o);
      if(fast){draw(sim.final,false);res(sim);return;}
      let k=0;rd.innerHTML='Running…';timer=setInterval(()=>{if(!host.isConnected){clearInterval(timer);return;}draw(sim.snaps[k],true);k++;if(k>=sim.snaps.length){clearInterval(timer);timer=null;draw(sim.final,false);res(sim);}},48);},
    reset(){if(timer)clearInterval(timer);timer=null;const s0=odoSim(Object.assign({},o,{crash:-1})).snaps[0];draw(Object.assign({},s0,{ck:-1}),false);rd.innerHTML=cfg.idle||'Set it up, then run it.';},
    last:()=>last};
  api.reset();return api;}

Course.lesson({

  goals:['Count events in the right time window, and handle late events and wrong clocks','Pick the right stream join, and join with the version of the data that was true at the time','Make a stream job’s effects count once, even after a crash'],
  parts:['Uses','Reasoning about time','Stream joins','Fault tolerance'],
  read:'Read “Processing Streams” in chapter 11, then its summary, for the book’s figure of windowing artifacts and the full search, profile and timeline join examples.',
  glossary:{
    eventtime:'Event time vs processing time: event time is when something actually happened (the timestamp inside the event); processing time is when a stream processor gets round to handling it. The two can be far apart.',
    straggler:'Straggler: an event that arrives after its time window was already declared complete.',
    window:'Window: the stretch of time a stream job groups events by, such as “each minute” or “the last 5 minutes”, so it can count or average them.',
    'materialized-view':'Materialized view: a stored copy of a query’s results, written to disk and updated when the data changes, so the query isn’t recomputed each time.',
    cdc:'Change data capture: reading a database’s log of row changes so another system (a warehouse, a search index, a cache) can copy them.',
    compaction:'Compaction: rewriting log segments to throw away values that were overwritten or deleted, keeping only the latest value for each key.',
    offset:'Offset: the position number of a message inside one partition of a log. A consumer remembers the offset it has reached, like a reader remembers a page number.',
    exactlyonce:'Exactly-once semantics (better called effectively-once): even if some work is retried after a fault, the visible result is as if every input was processed exactly once.',
    idempotence:'Idempotence: an operation that has the same effect whether it runs once or several times, so a retry can’t do it twice.',
    fencing:'Fencing token: a number that goes up every time a lock or lease is granted. The protected resource rejects any request carrying a lower number than one it has already processed.'
  },
  cheatsheet:[
    'A stream job can <b>store</b> events, <b>show</b> them to people, or <b>process</b> them into new streams. Streams never end: no sorting, and no restarting from the beginning.',
    'Uses: <b>complex event processing</b> (stored patterns), <b>stream analytics</b> (windowed aggregates; probabilistic algorithms only save memory), <b>materialized views</b> (every event ever), <b>search on streams</b> (stored queries).',
    'Window by <b>event time</b>, not processing time: a one-minute redeploy turns a steady rate into a fake dip and a fake spike.',
    'You never know a window is complete. <b>Stragglers</b>: drop them and count the drops, or publish a correction. Device clocks: log <b>three timestamps</b> and correct by received − sent.',
    'Windows: <b>tumbling</b> (fixed, no overlap), <b>hopping</b> (fixed, overlapping), <b>sliding</b> (events within an interval of each other), <b>session</b> (ends after inactivity).',
    'Joins: <b>stream-stream</b> (two event streams in a window), <b>stream-table</b> (enrich from a local copy kept current by CDC), <b>table-table</b> (maintain a joined view). Join with the <b>version valid at the time</b>.',
    '<b>Exactly-once really means effectively-once.</b> Microbatches and checkpoints work inside the framework; effects outside it need <b>atomic commit</b> or <b>idempotent</b> writes (store the offset with the value).',
    'State must survive crashes: keep it remote, copy local state out (snapshots, compacted changelog topic), or rebuild it from the input.'

{part:0,src:'Chapter 11 · Processing Streams',run(L){

{part:0,src:'Chapter 11 · Uses of Stream Processing',
 solve:async L=>{for(let j=0;j<4;j++)L.$('#u2'+j).click();},
 run(L){
  const U=[['Complex event processing','<b>Complex event processing</b>: describe a pattern of events, like a regular expression, often in a SQL-like language. The roles reverse: the queries are stored for a long time, events flow past them, and a match emits a “complex event”.',
     '<rect x="4" y="34" width="20" height="20" rx="10" style="fill:var(--h1)"/><rect x="32" y="34" width="20" height="20" rx="3" style="fill:var(--h2)"/><path d="M70 34 l10 20 h-20z" style="fill:var(--h4)"/><rect x="88" y="34" width="20" height="20" rx="3" style="fill:var(--h2)"/><rect x="116" y="34" width="20" height="20" rx="10" style="fill:var(--h1)"/><path d="M58 28 v-8 h52 v8" style="stroke:var(--no);stroke-width:2.5;fill:none"/><text x="84" y="14" text-anchor="middle" class="m30" style="fill:var(--no);font-weight:700">match!</text>'],
    ['Stream analytics','<b>Stream analytics</b>: aggregates over many events in a '+L.g('window','window')+': a rate, a rolling average, a comparison with last week. Some use probabilistic algorithms (Bloom filters, HyperLogLog, percentile estimates) to save memory. That’s an optimization: streams aren’t inherently approximate.',
     [12,18,15,22,30,26].map((h,j)=>'<rect x="'+(8+j*22)+'" y="'+(60-h)+'" width="16" height="'+h+'" rx="3" style="fill:var(--h2)"/>').join('')+'<path d="M4 40 L140 30" style="stroke:var(--h3);stroke-width:2;stroke-dasharray:4 3"/><text x="140" y="22" text-anchor="end" class="m30" style="fill:var(--h3)">last week</text>'],
    ['Materialized views','<b>Materialized views</b>: keep a cache, search index or event-sourced state current from a change stream (a '+L.g('materialized-view','materialized view')+'). Unlike analytics, it needs every event since the beginning (minus what log compaction drops), not a recent window.',
     [0,1,2,3,4].map(j=>'<rect x="'+(4+j*15)+'" y="30" width="13" height="18" rx="3" style="fill:var(--h4-bg);stroke:var(--h4);stroke-width:1.5"/>').join('')+'<text x="4" y="22" class="m30">from the start</text><path d="M80 39 H96" style="stroke:var(--muted);stroke-width:2"/><path d="M96 34 l7 5 l-7 5z" style="fill:var(--muted)"/><rect x="106" y="22" width="38" height="36" rx="4" style="fill:var(--card);stroke:var(--h2);stroke-width:1.5"/><path d="M106 34 H144 M106 46 H144 M125 22 V58" style="stroke:var(--h2);stroke-width:1.2"/>'],
    ['Search on streams','<b>Search on streams</b>: save the search first, then match each new item against it, like an alert for new homes on a property site. Normal search indexes documents and runs queries; this turns it around. The queries can be indexed too.',
     '<rect x="4" y="22" width="56" height="34" rx="8" style="fill:var(--pri-bg);stroke:var(--pri);stroke-width:1.5"/><circle cx="20" cy="37" r="6" style="fill:none;stroke:var(--pri);stroke-width:2"/><path d="M24 41 l6 6" style="stroke:var(--pri);stroke-width:2"/><text x="36" y="42" class="m30" style="fill:var(--pri-deep)">saved</text>'+
       [0,1,2].map(j=>'<rect x="'+(72+j*24)+'" y="26" width="18" height="24" rx="3" style="fill:'+(j===1?'var(--ok-bg)':'var(--card)')+';stroke:var(--'+(j===1?'ok':'line2')+');stroke-width:1.5"/>').join('')+'<text x="105" y="66" text-anchor="middle" class="m30" style="fill:var(--ok)">match</text>']];
  const seen=new Set();let shown=false;
  L.h(L.kick('learn','Uses of stream processing')+'<h1 class="q">What stream jobs are used for</h1>'+
   '<p class="cap30 sm" style="margin-top:0">Monitoring is the long-standing use: spotting a stolen card, trading on price rules, watching factory machines, raising military alarms. Tap each use.</p>'+
   '<div class="tiles30">'+U.map((u,j)=>'<button id="u2'+j+'"><svg viewBox="0 0 150 70" aria-hidden="true">'+u[2]+'</svg>'+u[0]+'</button>').join('')+'</div><div class="rd30" id="r2">Tap a tile.</div>');
  U.forEach((u,j)=>{L.$('#u2'+j).onclick=function(){U.forEach((_,q)=>L.$('#u2'+q).classList.toggle('sel',q===j));this.classList.add('seen');L.$('#r2').innerHTML=u[1];seen.add(j);
    if(seen.size===4&&!shown){shown=true;L.sheet('info','Not called stream processing: actors','Actor frameworks pass messages too, but they manage concurrency, talk one-to-one and briefly, and can loop. Stream jobs are a data technique: durable logs, many subscribers, acyclic pipelines.');L.done();}};});}},

{part:0,src:'Chapter 11 · Uses of Stream Processing',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which use is this?',['Complex event processing','Stream analytics','Materialized view','Search on streams'],[
   ['Alert if a parcel is scanned “delivered” and then “at hub” within an hour.',0,'A pattern made of several events in sequence: complex event processing.'],
   ['Average delivery time per zone over the last 5 minutes, compared with last week.',1,'An aggregate over a time window, compared with the past: stream analytics.'],
   ['Keep the tracking page’s parcel status up to date from every scan ever made.',2,'It needs all events since the beginning, not a window: a materialized view.'],
   ['Signe saves a query for “fragile” parcels to postcode WP4 and wants an alert for each new match.',3,'A stored query that each new item is matched against: search on streams.'],
   ['Count failed delivery attempts per hour in Eastvale.',1,'A rate per time interval is classic stream analytics.']]);}},

/* ---------- PART 2: REASONING ABOUT TIME ---------- */
{part:1,src:'Chapter 11 · Event time versus processing time',run(L){
  L.h(L.kick('learn','Event time versus processing time')+'<h1 class="q">Every event has two times</h1>'+P_CLOCKS+
   '<p class="cap30">When it happened (<b>event time</b>) and when a job handled it (<b>processing time</b>): '+L.g('eventtime','two different clocks')+'. Queues, faults, restarts and replays push dots up. Delays can also reorder events, like watching Star Wars in release order.</p>'+
   more('Why batch jobs rarely notice','A batch job reading a year of history uses the timestamps inside the events, so reruns give the same answer. Many stream frameworks use the machine’s clock instead: simple, and fine only while delays are tiny. Lag can come from a queue, a network fault, a busy broker, a restart or a replay.'));
  L.done();}},

{part:1,src:'Chapter 11 · Event time versus processing time',
 solve:async L=>{L.$('#q5').click();L.$('#b5').children[1].click();L.$('#b5').children[0].click();},
 run(L){
  let moved=false,shown=false;const seen=new Set([0]);
  L.h(L.kick('ex','Explore')+'<h1 class="q">Each dot is 10 scans at Westport Central. Drag a dot up to hold it in a queue. Compare both ways of counting.</h1>'+
   '<div class="row30" id="b5"></div><div id="s5"></div><button class="btn" id="q5">'+L.ic('clock')+'Hold 3 scans in a queue</button>');
  const chk=()=>{if(moved&&seen.size===2&&!shown){shown=true;
    L.sheet('info','Lag moves dots between processing windows','The held scans still happened in the same minute, so the event-time count didn’t move. By processing time they land in a later minute: one window short, another too full.');L.done();}};
  const s=Sc(L.$('#s5'),{dots:scans({seed:5}),drag:true,
    read:(R,s)=>{const mv=s.dots.filter(d=>Math.floor(d.p)!==Math.floor(d.e)).length;if(mv)moved=true;
      return s.basis==='event'?'<b>Event time</b>: each scan counts in the minute it happened. '+(mv?'The held scans still count where they belong.':'Every minute shows 60.')
        :'<b>Processing time</b>: each scan counts in the minute the job saw it. '+(mv?vd('no','Off')+'The held scans moved to a later minute.':'With no delay, it agrees with event time.');},
    on:()=>chk()});
  basisChips(L.$('#b5'),s,j=>{seen.add(j);chk();})[0].classList.add('sel');
  L.$('#q5').onclick=()=>{const ds=s.dots.filter(d=>d.k==='n'&&d.e>2.5&&d.e<3.5).slice(0,3);ds.forEach(d=>{d.p=d.e+2.4;});s.draw();};}},

{part:1,src:'Chapter 11 · Event time versus processing time',pts:1,
 solve:async L=>{L.$('#p6').children[2].click();L.$('#go6').click();await L.sleep(1400);},
 run(L){
  const PR=['60 scans','0 scans','120 scans','180 scans'];let p=null;
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">At 10:03 Linh redeploys the job. It’s down for one minute, then clears the backlog. Counted by processing time, what will 10:04 show?</h1>'+
   '<div id="s6"></div><div class="row30" id="b6" hidden></div><div class="row30" id="p6"></div><button class="btn pri" id="go6" hidden>'+L.ic('play')+'Play the redeploy</button>');
  const s=Sc(L.$('#s6'),{dots:scans({seed:5}),basis:'proc',
    read:(R,s)=>s.basis==='proc'?'By processing time: 10:03 shows <b>'+R.c[3]*10+'</b>, 10:04 shows <b>'+R.c[4]*10+'</b>.':'By event time: 10:03 shows <b>'+R.c[3]*10+'</b>, 10:04 shows <b>'+R.c[4]*10+'</b>. The real rate never changed.'});
  chips(L.$('#p6'),PR,j=>{if(p!==null)return;p=j;L.$('#p6').querySelectorAll('.chip').forEach(b=>b.disabled=true);L.$('#go6').hidden=false;});
  L.$('#go6').onclick=function(){this.remove();const to=scans({seed:5,redeploy:3});try{L.$('#s6').scrollIntoView({block:'start',behavior:'smooth'});}catch(e){}
    s.anim(to,900,()=>{const ok=p===2;L.award(ok);L.$('#b6').hidden=false;basisChips(L.$('#b6'),s)[1].classList.add('sel');
      L.sheet(ok?'ok':'no',ok?'120: a fake spike':'It shows 120','10:03’s scans were processed during 10:04, on top of 10:04’s own. By processing time that reads 0, then 120, though the real rate was a steady 60. An alert on “rate doubled” would go off for nothing. Tap “By event time” to compare.');L.done();});};}},

{part:1,src:'Chapter 11 · Knowing when you’re ready',run(L){
  L.h(L.kick('learn','Knowing when you’re ready')+'<h1 class="q">When is a minute finished?</h1>'+P_READY+
   '<p class="cap30">You can never be sure a window has every event. Most new events are for :38 and :39, so you declare :37 done and publish its count. A later event for :37 is a '+L.g('straggler','straggler')+'.</p>'+
   more('Why not wait for silence?','A quiet spell doesn’t prove much: some events may be stuck on another machine. A producer can send “nothing older than t from now on”, but with many producers, each one must be tracked separately.'));
  L.done();}},

{part:1,src:'Chapter 11 · Whose clock are you using, anyway?',
 solve:async L=>{for(let j=0;j<5;j++){const b=L.$('#n8');if(b&&!b.hidden)b.click();}},
 run(L){
  const S=[{cap:'Ravi scans parcel OP-48213 in a basement with no signal. The courier app stamps it <b>10:00</b> by the phone’s clock and keeps it.',ph:[[600,'scan 10:00']]},
    {cap:'Upstairs, the app uploads and stamps <b>sent 10:30</b>, again by the phone. To consumers, this scan is a very late straggler.',ph:[[600,'scan 10:00'],[630,'sent 10:30']]},
    {cap:'The server stamps <b>received 10:23</b> by its own clock. Otterpost controls that clock, so it’s more trustworthy, but it only says when the event arrived.',ph:[[600,'scan 10:00'],[630,'sent 10:30']],sv:[[623,'received 10:23']],arrow:[630,623]},
    {cap:'Received − sent = <b>−7 minutes</b>. If the network delay is tiny, the phone runs about 7 minutes fast. Slide its ruler to match.',ph:[[600,'scan 10:00'],[630,'sent 10:30']],sv:[[623,'received 10:23']],arrow:[630,623],shift:7},
    {cap:'Apply the same offset to the scan: it really happened at about <b>09:53</b>. This assumes the phone’s offset didn’t change between the scan and the upload.',ph:[[600,'scan 10:00'],[630,'sent 10:30']],sv:[[623,'received 10:23'],[593,'true 09:53','ok']],shift:7,drop:[600,593]}];
  let k=0,sh=0;
  L.h(L.kick('ex','Three timestamps')+'<h1 class="q">Ravi’s phone clock can’t be trusted. The server’s can. Log three times.</h1><div id="v8"></div><div class="stepcap30" id="c8"></div><button class="btn pri" id="n8">Next '+L.ic('arrow')+'</button><p class="cap30 sm">Times are illustrative.</p>');
  const paint=()=>{const st=S[k];L.$('#v8').innerHTML=rulers({t0:585,t1:635,id:'8',shift:sh,phone:st.ph,server:st.sv,arrow:st.arrow,drop:st.drop});
    L.$('#c8').innerHTML='<span class="n">Step '+(k+1)+' of '+S.length+'</span>'+st.cap;};
  paint();
  L.$('#n8').onclick=()=>{k++;const st=S[k];if(st.shift&&sh<st.shift){const t0=Date.now();const t=setInterval(()=>{if(!L.$('#v8')){clearInterval(t);return;}const q=Math.min(1,(Date.now()-t0)/500);sh=st.shift*q;paint();if(q>=1)clearInterval(t);},30);}
    else{sh=st.shift||0;}paint();
    if(k===S.length-1){L.$('#n8').hidden=true;L.sheet('info','Three timestamps','Scan time and sent time come from the device; received time comes from the server. Batch jobs have the same problem; streaming just makes it easier to notice.');L.done();}};}},

{part:1,src:'Chapter 11 · Whose clock are you using, anyway?',pts:1,
 solve:async L=>{const r=L.$('#r9');r.value=845;r.dispatchEvent(new Event('input'));L.$('#k9').click();},
 run(L){
  let done=false,guess=850;
  L.h(L.kick('try','Your turn')+'<h1 class="q">Another upload from Ravi’s phone: scan <b>14:10</b> and sent <b>14:40</b> by the phone, received <b>14:35</b> by the server. When did the scan really happen?</h1><div id="v9"></div>'+
   '<div class="rng30"><label for="r9">The scan really happened at</label><b id="o9">14:10</b><input type="range" id="r9" min="835" max="865" step="1" value="850"></div><button class="btn pri" id="k9">Check</button><p class="cap30 sm">Times are illustrative.</p>');
  const paint=(shift,truth)=>{L.$('#v9').innerHTML=rulers({t0:835,t1:885,id:'9',shift:shift||0,phone:[[850,'scan 14:10'],[880,'sent 14:40']],
    server:[[875,'received 14:35']].concat(truth?[[845,'true 14:05','ok']]:[[guess,'your answer','pri']]),arrow:truth?null:[880,875],drop:truth?[850,845]:null});};
  paint(0);
  L.$('#r9').oninput=e=>{if(done)return;guess=+e.target.value;L.$('#o9').textContent=hm(guess);paint(0);};
  L.$('#k9').onclick=function(){if(done)return;done=true;this.remove();L.$('#r9').disabled=true;const ok=guess===845;L.award(ok);
    const t0=Date.now();const t=setInterval(()=>{if(!L.$('#v9')){clearInterval(t);return;}const q=Math.min(1,(Date.now()-t0)/500);paint(5*q,q>=1);if(q>=1)clearInterval(t);},30);
    L.sheet(ok?'ok':'no',ok?'About 14:05':'It was about 14:05','Received 14:35 − sent 14:40 = −5 minutes: the phone runs 5 minutes fast. Shift the scan by the same amount: 14:10 − 5 minutes = 14:05.');L.done();};}},

{part:1,src:'Chapter 11 · Types of windows',
 solve:async L=>{for(let j=0;j<4;j++)L.$('#w10').children[j].click();},
 run(L){
  const EV=[0.4,1.2,1.5,3.65,8.2,9.0,12.3,12.9,13.4],X=m=>16+m*20.5,H=[3.65,8.2];
  const base=()=>{let g=ln(X(0),150,X(15),150,'line2',2);[0,5,10,15].forEach(m=>{g+=ln(X(m),146,X(m),154,'line2',2)+tx(X(m),192,'10:'+(m<10?'0':'')+m,'m30','middle');});
    EV.forEach(e=>{const h=H.includes(e);g+=dot(X(e),150,h?6:5,h?'h3':'h1');});
    g+=tx(X(3.65),172,'10:03:39','m30','middle','fill:var(--h3);font-weight:700')+tx(X(8.2),172,'10:08:12','m30','middle','fill:var(--h3);font-weight:700');return g;};
  const W=[['Tumbling','Fixed length, no overlap: every event is in exactly one window. Round each timestamp down. The two amber events land in different windows.',
      ()=>[[0,5],[5,10],[10,15]].map((w,j)=>rc(X(w[0])+1,22,X(w[1])-X(w[0])-2,116,j%2?'h2-bg':'h1-bg',j%2?'h2':'h1',8)+tx((X(w[0])+X(w[1]))/2,40,EV.filter(e=>e>=w[0]&&e<w[1]).length+' events','m30','middle','fill:var(--ink);font-weight:600')).join('')],
    ['Hopping','Fixed length, but windows overlap: 5 minutes long, starting every minute. Smoother. Built by adding up 1-minute tumbling windows. No window holds both amber events.',
      ()=>{let g='';for(let s=0;s<=10;s++){const n=EV.filter(e=>e>=s&&e<s+5).length;g+=rc(X(s),22+s*10,X(s+5)-X(s),7,'h2-bg','h2',3)+tx(X(s+5)+3,29+s*10,n,'m30','start','font-size:11px');}return g;}],
    ['Sliding','All events within some interval of each other. A 5-minute sliding window holds both amber events: they are under 5 minutes apart. Kept as a time-sorted buffer that drops expired events.',
      ()=>rc(X(3.2),40,X(8.2)-X(3.2),98,'h3-bg','h3',8)+tx((X(3.2)+X(8.2))/2,60,'5 min back from 10:08:12','m30','middle','fill:var(--ink);font-weight:600')],
    ['Session','No fixed length. One user’s events that come close together; the session ends after a quiet gap (here 2 minutes, illustrative; the book’s example is 30). Common in website analytics.',
      ()=>[[0.4,1.5],[3.65,3.65],[8.2,9.0],[12.3,13.4]].map(w=>rc(X(w[0])-9,40,X(w[1])-X(w[0])+18,98,'h4-bg','h4',10)).join('')+tx(X(6),70,'quiet gap','m30','middle')+ar(X(4.6),80,X(7.4),80,'muted',1.5)]];
  const seen=new Set();let shown=false;
  L.h(L.kick('learn','Types of windows')+'<h1 class="q">Four ways to slice time into '+L.g('window','windows')+'</h1><p class="cap30 sm" style="margin-top:0">One merchant’s dashboard clicks, 10:00 to 10:15. Tap each window type.</p>'+
   '<div class="row30" id="w10"></div><svg class="pic30" id="v10" viewBox="0 0 340 200" role="img" aria-label="A time axis from 10:00 to 10:15 with nine click events and the chosen windows drawn above them"></svg><div class="rd30" id="r10">Pick a window type.</div>');
  L.$('#v10').innerHTML=base();
  chips(L.$('#w10'),W.map(w=>w[0]),j=>{L.$('#v10').innerHTML=W[j][2]()+base();L.$('#r10').innerHTML='<b>'+W[j][0]+'.</b> '+W[j][1];seen.add(j);
    if(seen.size===4&&!shown){shown=true;L.sheet('info','Fixed or flexible','Tumbling and hopping use fixed boundaries. Sliding looks at the gaps between events. Session follows one user until they go quiet.');L.done();}});}},

{part:1,src:'Chapter 11 · Types of windows',pts:5,run(L){
  L.h(L.kick('pr','Which window?')+'<h1 class="q">Match each of Otterpost’s needs to a window type.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Tumbling','Hopping','Sliding','Session'],[
   ['Count scans in each clock minute, each scan in exactly one minute.',0,'Fixed slots that don’t overlap: tumbling.'],
   ['A 15-minute average of courier speed, refreshed every minute.',1,'Fixed length, with overlapping windows that move on by a minute: hopping.'],
   ['Flag two failed delivery attempts on one parcel less than 10 minutes apart, whatever the clock says.',2,'“Within 10 minutes of each other,” with no fixed boundaries: sliding.'],
   ['Group a merchant’s dashboard clicks into visits that end after 30 minutes of inactivity.',3,'No fixed length, ending after a gap: session.'],
   ['Hourly on-time rate per zone: 9:00–9:59, 10:00–10:59 and so on.',0,'Fixed hours that don’t overlap: tumbling.']],
   'Tumbling and hopping use fixed boundaries; sliding looks at the gaps between events; session follows one user until they go quiet.');}},

{part:1,src:'Chapter 11 · Knowing when you’re ready',
 solve:async L=>{for(let j=0;j<4;j++)L.$('#e12p'+j).click();},
 run(L){
  const P=[{nm:'Redeploy',dots:()=>scans({seed:5,redeploy:3}),basis:'proc',A:1},
    {nm:'Offline phone',dots:()=>scans({seed:5,offline:true}),basis:'event',A:1},
    {nm:'Wrong clock',dots:()=>scans({seed:5,clock:true}),basis:'event',A:1},
    {nm:'No waiting',dots:()=>scans({seed:7,lag:'real'}),basis:'event',A:0}];
  let cur=-1,shown=false;const seen=new Set();
  L.h(L.kick('ex','Edge cases')+'<h1 class="q">Where does counting by event time hold up, and where does it break? Run each case.</h1>'+
   '<div class="row30">'+P.map((p,j)=>'<button class="chip" id="e12p'+j+'">'+p.nm+'</button>').join('')+'</div><div id="s12"></div><div class="row30" id="b12"></div><div class="row30" id="f12"></div>');
  const s=Sc(L.$('#s12'),{dots:scans({seed:5}),basis:'event',A:1,read:(R,s)=>{
    if(cur<0)return 'Pick a case. The red step line is where each minute is declared done (1 minute after it ends).';
    if(cur===0)return s.basis==='proc'?vd('no','Fake spike')+'By processing time 10:03 shows 0 and 10:04 shows 120. Switch to event time.':vd('ok','Holds')+'By event time, with a 1-minute wait, every minute shows 60. The backlog arrived before 10:03 closed.';
    if(cur===1)return vd('no','Stragglers')+'Ravi’s phone was offline. Its 30 scans from 10:02 arrive about 2 hours late, long after 10:02 closed. Drop them and count the drops, or publish a correction.';
    if(cur===2)return s.fix?vd('ok','Fixed')+'Received − sent showed the phone was 1 hour slow, so its 40 scans move back to 10:05.':vd('no','Wrong window')+'A courier’s phone clock is 1 hour slow, so 40 scans are stamped 09:05 and miss 10:05 entirely. Try the three-timestamp fix.';
    return vd('no',R.lateN*10+' scans late')+'Closing each minute the instant it ends turns ordinary network lag into stragglers: '+Math.round(R.lateN/R.tot*100)+'% of scans miss their window.';}});
  const bc=basisChips(L.$('#b12'),s);bc[0].classList.add('sel');
  P.forEach((p,j)=>{L.$('#e12p'+j).onclick=()=>{P.forEach((_,q)=>L.$('#e12p'+q).classList.toggle('sel',q===j));cur=j;s.dots=p.dots();s.basis=p.basis;s.A=p.A;s.fix=false;
    bc.forEach((b,q)=>b.classList.toggle('sel',q===(p.basis==='proc'?1:0)));
    L.$('#f12').innerHTML=j===2?'<button class="btn" id="fx12">'+L.ic('clock')+'Fix with three timestamps</button>':'';
    if(j===2)L.$('#fx12').onclick=()=>{s.fix=true;s.draw();};
    s.draw();seen.add(j);
    if(seen.size===P.length&&!shown){shown=true;L.sheet('info','Event time has limits too','It fixes processing artifacts, but late data still forces a choice (drop or correct), and it’s only as good as the timestamps. How long to wait is a trade-off between speed and completeness.');L.done();}};});}},

{part:1,src:'Chapter 11 · Knowing when you’re ready',pts:1,
 solve:async L=>{L.$('#b13').children[0].click();const r=L.$('#r13');r.value=2;r.dispatchEvent(new Event('input'));L.$('#k13').click();},
 run(L){
  let done=false;
  L.h(L.kick('pr','Challenge')+'<h1 class="q">Kwame wants per-minute scan counts that leave out at most 2% of scans and are published within 2½ minutes of each minute’s end. Set it up.</h1>'+
   '<div class="row30" id="b13"></div><div class="rng30"><label for="r13">Wait before declaring a minute done</label><b id="o13">0 min</b><input type="range" id="r13" min="0" max="4" step="0.5" value="0"></div>'+
   '<div id="s13"></div><div class="mtr30" id="m13"></div><button class="btn pri" id="k13">Check</button><p class="cap30 sm">Today’s data: normal network lag, some slow uploads, and a redeploy at 10:06. Targets are illustrative.</p>');
  const s=Sc(L.$('#s13'),{dots:scans({seed:5,lag:'real',redeploy:6}),basis:'proc',A:0,read:(R,s)=>s.basis==='proc'?'Processing time publishes each minute at once, but scans land in the wrong minute.':'Event time: scans count in the minute they happened; anything later than the wait is a straggler.',
    on:(R,s)=>{const ev=s.basis==='event',miss=ev?R.lateN:R.off/2,pct=Math.round(miss/R.tot*1000)/10,delay=ev?s.A:0;
      s.res={pct,delay,ok:pct<=2&&delay<=2.5};
      const m=L.$('#m13');if(m)m.innerHTML='<span class="'+(pct<=2?'ok':'no')+'"><small>'+(ev?'Left out of first count':'Counted in wrong minute')+'</small>'+pct+'% of scans</span><span class="'+(delay<=2.5?'ok':'no')+'"><small>Published after</small>'+(ev?delay+' min':'at once')+'</span>';}});
  basisChips(L.$('#b13'),s)[1].classList.add('sel');s.draw();
  L.$('#r13').oninput=e=>{s.A=+e.target.value;L.$('#o13').textContent=s.A+' min';s.draw();};
  L.$('#k13').onclick=function(){if(done)return;done=true;this.remove();const r=s.res,ok=s.basis==='event'&&r.ok;L.award(ok);
    L.sheet(ok?'ok':'no',ok?'Accurate and quick enough':'Not yet',(ok?'Counting by event time with a '+s.A+'-minute wait catches almost every late scan and still publishes on time. ':s.basis==='proc'?'Processing time publishes at once, but the redeploy and slow uploads put scans in the wrong minute. ':r.pct>2?'Too few minutes of waiting: slow uploads become stragglers. ':'That waits too long before publishing. ')+
      'The trade-off: wait longer for completeness, or publish sooner and handle stragglers: send corrections, or drop them while counting drops as a metric and alerting if they grow. Here 2 to 2½ minutes works.');L.done();};}},

/* ---------- PART 3: STREAM JOINS ---------- */
{part:2,src:'Chapter 11 · Stream Joins',run(L){
  L.h(L.kick('learn','Stream joins')+'<h1 class="q">Three kinds of join, one shared trick: keep state</h1>'+P_JOINS+
   '<p class="cap30">Each join keeps state from one input and looks it up for events from the other. Inputs are activity events or a table’s changelog from '+L.g('cdc','change data capture')+'. New events never stop, so it’s harder than in batch.</p>'+
   more('Why a local copy? And the Twitter case','Querying a remote database for every event is slow and can overload it. So the job keeps its own copy, like a map-side hash join in batch, kept current from the table’s changelog. Table-table is the book’s Twitter case: home timelines are a cache of tweets joined with follows, updated on every tweet, delete, follow and unfollow.'));
  L.done();}},

{part:2,src:'Chapter 11 · Stream-stream join (window join)',
 solve:async L=>{for(let j=0;j<7;j++){const b=L.$('#n15');if(b&&!b.hidden)b.click();}},
 run(L){
  const S=[{clk:'Mon 09:55',cap:'Two streams flow in: “card left, nobody home” scans and “redelivery booked” events. Linh’s job keeps both for 48 hours, indexed by parcel.'},
    {clk:'Mon 10:00',inc:['c','OP-48213 · card left'],cap:'No booking for OP-48213 yet, so the scan waits in state.'},
    {clk:'Mon 11:30',inc:['c','OP-48250 · card left'],cap:'Another parcel waits.'},
    {clk:'Mon 12:05',inc:['b','OP-48277 · rebooked'],cap:'A booking for OP-48277 arrives <b>before</b> its card-left scan: network delays reorder streams. It waits too.'},
    {clk:'Mon 12:06',inc:['c','OP-48277 · card left 11:50'],out:['ok','OP-48277 rebooked 15 min after the card'],rm:'OP-48277',cap:'The late scan finds its booking in state: a match. Both leave the state.'},
    {clk:'Tue 09:00',inc:['b','OP-48213 · rebooked'],out:['ok','OP-48213 rebooked after 23 h'],rm:'OP-48213',cap:'Almost a day later, OP-48213’s booking finds its card in state. Still inside 48 hours.'},
    {clk:'Wed 11:30',out:['nm','OP-48250: no redelivery booked'],rm:'OP-48250',cap:'48 hours pass with no booking for OP-48250. The window expires and the job says so.'}];
  let k=0;const st={c:[],b:[]},out=[];
  L.h(L.kick('ex','Stream-stream join')+'<h1 class="q">How often does a “card left” lead to a redelivery within 48 hours? Step through Linh’s join.</h1>'+
   '<div class="jn30"><div class="box"><div class="hd">Arriving now <span class="clk" id="k15"></span></div><div id="i15"><span class="small">Nothing yet</span></div></div><div class="ar">▼</div>'+
   '<div class="box st"><div class="hd">Job state · last 48 h, by parcel</div><div class="cols"><div id="sc15"></div><div id="sb15"></div></div></div><div class="ar">▼</div>'+
   '<div class="box"><div class="hd">Output</div><div id="o15"><span class="small">Nothing yet</span></div></div></div>'+
   '<div class="stepcap30" id="c15"></div><button class="btn pri" id="n15">Next event '+L.ic('arrow')+'</button><p class="cap30 sm">The 48-hour window, parcels and times are illustrative.</p>');
  const ev=(cls,t)=>'<span class="ev '+cls+'">'+t+'</span>';
  const paint=fresh=>{const s=S[k];L.$('#k15').textContent=s.clk;
    L.$('#i15').innerHTML=s.inc?ev((s.inc[0]==='b'?'bk ':'')+'new',s.inc[1]):'<span class="small">'+(k?'No event: the clock moves on':'Nothing yet')+'</span>';
    L.$('#sc15').innerHTML='<div class="small"><b>Card left</b></div>'+st.c.map(x=>ev(x===fresh?'new':'',x)).join('');
    L.$('#sb15').innerHTML='<div class="small"><b>Rebooked</b></div>'+st.b.map(x=>ev('bk'+(x===fresh?' new':''),x)).join('');
    L.$('#o15').innerHTML=out.length?out.map(o=>ev(o[0],o[1])).join(''):'<span class="small">Nothing yet</span>';
    L.$('#c15').innerHTML='<span class="n">Step '+(k+1)+' of '+S.length+'</span>'+s.cap;};
  paint();
  L.$('#n15').onclick=()=>{k++;const s=S[k];let fresh=null;
    if(s.rm){st.c=st.c.filter(x=>x.indexOf(s.rm)!==0);st.b=st.b.filter(x=>x.indexOf(s.rm)!==0);}
    else if(s.inc){fresh=s.inc[1];(s.inc[0]==='c'?st.c:st.b).push(fresh);}
    if(s.out)out.push(s.out);paint(fresh);
    if(k===S.length-1){L.$('#n15').hidden=true;L.sheet('info','2 of 3 rebooked','Only a join can report OP-48250. Copying card details into booking events would show parcels that were rebooked, never the ones that weren’t, and the rate needs both.');L.done();}};}},

{part:2,src:'Chapter 11 · Time-dependence of joins',run(L){
  L.h(L.kick('learn','Time-dependence of joins')+'<h1 class="q">Which version of the table do you join with?</h1>'+P_TIMEDEP+
   '<p class="cap30">The table changes, and order across streams isn’t guaranteed, so a rerun can give a different answer: the join is <b>nondeterministic</b>. Fix: give each version an ID and store it on the record.</p>'+
   more('The fine print','Warehouses call this a <b>slowly changing dimension</b>. A partitioned log keeps order within one partition only. The cost of version IDs: every version must be kept, so the table’s changelog can’t use '+L.g('compaction','log compaction')+'.'));
  L.done();}},

{part:2,src:'Chapter 11 · Stream-table join (stream enrichment)',pts:1,
 solve:async L=>{L.$('#ca17').children[1].click();L.$('#cb17').children[1].click();L.$('#k17').click();},
 run(L){
  const RUNS=[{nm:'Live: 28 Feb → 1 Mar',sub:'The job started on 20 Feb. The price rises at midnight.',rows:[['OP-47912 · 28 Feb 23:50','v1',4.20],['OP-47913 · 1 Mar 00:10','v2',4.60],['OP-47960 · 1 Mar 09:00','v2',4.60]]},
    {nm:'Rerun February in April',sub:'Linh fixes an invoice bug and replays February’s bookings.',rows:[['OP-47012 · 3 Feb','v1',4.20],['OP-47388 · 14 Feb','v1',4.20],['OP-47790 · 27 Feb','v1',4.20]]}];
  let copy=-1,join=-1,run=0,done=false;
  const got=(r,row)=>{if(r===0){if(join===0)return copy===0?4.20:row[2];return copy===0&&row[1]==='v2'?null:row[2];}return join===0?4.60:row[2];};
  const why=r=>{if(copy<0||join<0)return 'Pick both settings.';
    if(r===0){if(copy===0)return join===0?'The copy was loaded on 20 Feb and never updated, so March bookings get February’s price.':'The copy was loaded on 20 Feb, so it has never heard of v2.';return 'The change stream updates the copy at midnight, so each booking finds its price.';}
    return join===0?'The copy now holds only the latest price, so February gets March’s $4.60.':'Each booking carries v1, and v1 is still kept, so February gets $4.20.';};
  L.h(L.kick('pr','Join lab')+'<h1 class="q">Linh’s billing job joins each delivered booking with Otterpost’s price list. Make both runs charge the right price.</h1>'+
   '<svg class="pic30" viewBox="0 0 340 50" role="img" aria-label="Price list: v1 $4.20 until 28 February, v2 $4.60 from 1 March">'+rc(8,8,160,30,'h2-bg','h2',7)+tx(18,28,'v1 · $4.20 · to 28 Feb','t30')+rc(172,8,160,30,'h3-bg','h3',7)+tx(182,28,'v2 · $4.60 · from 1 Mar','t30')+'</svg>'+
   '<div class="lbl30">The job’s local copy of the price list</div><p class="cap30 sm" style="margin-top:2px">Local, because a remote query per booking is slow and can overload the database: like a map-side hash join.</p><div class="row30" id="ca17"></div>'+
   '<div class="lbl30">Each booking joins with</div><div class="row30" id="cb17"></div>'+
   '<div class="lbl30">Run</div><div class="row30" id="cr17"></div><div id="o17"></div><button class="btn pri" id="k17">Check both runs</button><p class="cap30 sm">Prices, dates and bookings are illustrative.</p>');
  const paint=()=>{const R=RUNS[run];let h='<div class="rd30" style="min-height:0"><b>'+R.nm+'.</b> '+R.sub+'</div><table class="tb30"><tr><th>Booking</th><th>Should be</th><th>Charged</th></tr>';
    R.rows.forEach(row=>{const g=(copy<0||join<0)?undefined:got(run,row);h+='<tr><td>'+row[0]+'</td><td>$'+row[2].toFixed(2)+' ('+row[1]+')</td>'+
      (g===undefined?'<td>—</td>':g===null?'<td class="no">no price ✗</td>':'<td class="'+(g===row[2]?'ok':'no')+'">$'+g.toFixed(2)+(g===row[2]?' ✓':' ✗')+'</td>')+'</tr>';});
    L.$('#o17').innerHTML=h+'</table><div class="small">'+why(run)+'</div>';};
  chips(L.$('#ca17'),['Loaded once at start','Kept current by CDC'],j=>{copy=j;paint();});
  chips(L.$('#cb17'),['The latest price','The price version on the booking'],j=>{join=j;paint();});
  chips(L.$('#cr17'),RUNS.map(r=>r.nm),j=>{run=j;paint();})[0].classList.add('sel');paint();
  L.$('#k17').onclick=function(){if(done)return;if(copy<0||join<0){L.err('Pick both settings first');return;}done=true;this.remove();
    const ok=copy===1&&join===1;L.award(ok);
    L.sheet(ok?'ok':'no',ok?'Both runs right':'One run still charges the wrong price',
      'A change stream keeps the live copy current (a stream-table join is really a join of two streams). The version ID on each booking makes reruns repeatable. The cost: every price version must be kept, so no log compaction.');L.done();};}},

{part:2,src:'Chapter 11 · Summary',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which join?',['Stream-stream','Stream-table','Table-table'],[
   ['Add each courier’s vehicle type, from the couriers table, to every GPS ping.',1,'Activity events enriched from a table kept current by change data capture: stream-table.'],
   ['Recipients follow several parcels. Keep each “my parcels” page current from changes to the parcels table and the follows table.',2,'Both inputs are changelogs, and the output is a maintained view of their join, like Twitter timelines: table-table.'],
   ['Match each “out for delivery” scan with the “delivered” scan for the same parcel within 12 hours.',0,'Two activity events matched within a window. Both come from the same stream, which makes it a self-join.'],
   ['Attach the current zone name, from the zones table, to each scan event.',1,'Enriching events with table data: stream-table.']]);}},

/* ---------- PART 4: FAULT TOLERANCE ---------- */
{part:3,src:'Chapter 11 · Fault Tolerance',run(L){
  L.h(L.kick('learn','Fault tolerance')+'<h1 class="q">“Exactly once” really means effectively once</h1>'+P_ONCE+
   '<p class="cap30">A batch job hides failures: output appears only on success, so each record seems processed once ('+L.g('exactlyonce','exactly-once semantics')+'). A stream never finishes, so jobs cut it into microbatches or checkpoints instead.</p>'+
   more('Microbatch or checkpoint?','Smaller microbatches cost more overhead; bigger ones add delay. Microbatches also quietly make a tumbling window by processing time. Checkpoints don’t force a window size. Neither can recall a database write or an email once it has left the framework.'));
  L.done();}},

{part:3,src:'Chapter 11 · Microbatching and checkpointing',
 solve:async L=>{const r=L.$('#r20');r.value=6;r.dispatchEvent(new Event('input'));L.$('#go20').click();await L.sleep(1700);},
 run(L){
  let shown=false;
  L.h(L.kick('ex','Explore')+'<h1 class="q">Linh’s job adds 1 to Bramble & Bolt’s “delivered today” counter for each delivered scan. Pick a crash point and a checkpoint interval, then run it.</h1>'+
   '<div id="d20"></div><div class="lbl30">Checkpoint (4 scans a second, illustrative)</div><div class="row30" id="i20"></div>'+
   '<div class="rng30"><label for="r20">Crash right after offset</label><b id="o20">no crash</b><input type="range" id="r20" min="0" max="15" step="1" value="15"></div>'+
   '<button class="btn pri" id="go20">'+L.ic('play')+'Run</button>');
  const od=Odo(L.$('#d20'),{idle:'Move the crash slider, then run. After a crash the job restarts from its last checkpoint, which only the framework controls.',
    read:(f,o)=>f.over>0?'Restarted from the checkpoint and replayed '+f.over+' scan'+(f.over>1?'s':'')+' it had already counted. The outside database can’t take back the extra +1s.':'No scan was counted twice.',
    on:f=>{if(f.over>0&&!shown){shown=true;L.sheet('info','Replayed, so counted twice','Scans between the last checkpoint and the crash were processed twice. Inside the framework that’s invisible; in the outside counter it sticks. Move the crash or the interval and the overshoot changes.');L.done();}}});
  chips(L.$('#i20'),IVL,j=>{od.o.I=IV[j];od.reset();})[1].classList.add('sel');
  L.$('#r20').oninput=e=>{const v=+e.target.value;od.o.crash=v===15?-1:v;L.$('#o20').textContent=v===15?'no crash':'7,0'+(41+v);od.reset();};
  od.o.crash=-1;
  L.$('#go20').onclick=()=>od.run();}},

{part:3,src:'Chapter 11 · Microbatching and checkpointing',pts:1,
 solve:async L=>{L.$('#p21').children[3].click();L.$('#go21').click();await L.sleep(1900);},
 run(L){
  const PR=['Exact','Over by 3','Over by 11','Over by 15'];let p=null;
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">To save work, Linh checkpoints only every 4 seconds (16 scans). The job crashes right after offset 7,055. How far off is the counter?</h1>'+
   '<div class="row30" id="p21"></div><button class="btn pri" id="go21" hidden>'+L.ic('play')+'Run it</button><div id="d21"></div>');
  const od=Odo(L.$('#d21'),{init:{I:16,crash:14},idle:'The last checkpoint is at 7,040, before the first scan on the tape.'});
  chips(L.$('#p21'),PR,j=>{if(p!==null)return;p=j;L.$('#p21').querySelectorAll('.chip').forEach(b=>b.disabled=true);L.$('#go21').hidden=false;});
  L.$('#go21').onclick=function(){this.remove();try{L.$('#d21').scrollIntoView({block:'start',behavior:'smooth'});}catch(e){}od.run();const t=setInterval(()=>{if(!L.$('#d21')){clearInterval(t);return;}const f=od.last();if(!f)return;clearInterval(t);
    const ok=p===3;L.award(ok);L.sheet(ok?'ok':'no',ok?'Over by 15':'It’s over by 15','The last checkpoint was 7,040, so the restart replayed 7,041 to 7,055 and added 1 for each again. Rarer checkpoints mean less overhead but more repeated work after a crash.');L.done();},60);};}},

{part:3,src:'Chapter 11 · Atomic commit revisited',run(L){
  L.h(L.kick('learn','Atomic commit and idempotence')+'<h1 class="q">Two ways to make each effect count once</h1>'+P_TWO+
   '<p class="cap30"><b>Atomic commit</b>: an event’s effects and the '+L.g('offset','offset')+' move happen together or not at all. <b>Idempotence</b>: make repeats harmless. Setting a value is '+L.g('idempotence','idempotent')+'; adding 1 isn’t, unless you store the offset with it.</p>'+
   more('How this differs from XA','Unlike XA, efficient atomic commit keeps transactions inside the framework (Google Cloud Dataflow, VoltDB; planned for Kafka) and groups several messages per transaction to cut overhead.'));
  L.done();}},

{part:3,src:'Chapter 11 · Idempotence',
 solve:async L=>{for(let j=0;j<5;j++){L.$('#e23p'+j).click();await L.sleep(5);}},
 run(L){
  const P=[{nm:'Add 1',o:{design:'plain',I:4,crash:6,special:null}},
    {nm:'Store offset',o:{design:'offset',I:4,crash:6,special:null}},
    {nm:'Commit together',o:{design:'atomic',I:4,crash:6,special:null}},
    {nm:'Out of order',o:{design:'offset',I:16,crash:6,special:'reorder'}},
    {nm:'Old node wakes',o:{design:'offset',I:4,crash:6,special:'zombie',fence:false}}];
  const CAP=['Plain +1: the three scans after the 7,044 checkpoint are added twice.',
    'Each write stores its offset. On replay, 7,045 to 7,047 are already applied, so they’re skipped.',
    'Increments wait for the checkpoint and commit with the offset. The crash throws away the uncommitted three; the replay redoes them once.',
    'No log: a queue redelivered 7,045 after 7,047. The offset check thinks it’s a repeat and skips it. Idempotence needs the same messages replayed in the same order.',
    ''];
  let cur=-1,shown=false;const seen=new Set();
  L.h(L.kick('ex','Edge cases')+'<h1 class="q">Same crash after offset 7,047, five designs. Which keep the counter exact, and where do they break?</h1>'+
   '<div class="row30">'+P.map((p,j)=>'<button class="chip" id="e23p'+j+'">'+p.nm+'</button>').join('')+'</div><div id="d23"></div><div class="row30" id="f23"></div>');
  const od=Odo(L.$('#d23'),{idle:'Pick a design. The crash comes right after offset 7,047.',
    read:(f,o)=>' '+(cur===4?(o.fence?'The old node’s write carries an older '+L.g('fencing','fencing token')+', so the database rejects it.':'The old node wasn’t dead, only paused. It wakes and writes the count it had (1,208), over the newer value. Idempotence assumes no other writer.'):CAP[cur]),
    on:()=>{if(seen.size===P.length&&!shown){shown=true;L.sheet('info','Exact, within limits','Storing the offset or committing atomically makes replays harmless. Idempotence also needs a deterministic job, the same replay order (a log gives it), and no second writer: fencing stops a node wrongly thought dead.');L.done();}}});
  P.forEach((p,j)=>{L.$('#e23p'+j).onclick=()=>{P.forEach((_,q)=>L.$('#e23p'+q).classList.toggle('sel',q===j));cur=j;Object.assign(od.o,{fence:false},p.o);seen.add(j);
    L.$('#f23').innerHTML=j===4?'<button class="btn" id="fx23">'+L.ic('shield')+'Turn on fencing tokens</button>':'';
    if(j===4)L.$('#fx23').onclick=function(){od.o.fence=true;this.remove();od.run(true);};
    od.run();};});}},

{part:3,src:'Chapter 11 · Atomic commit revisited',pts:1,
 solve:async L=>{L.$('#ca24').children[1].click();L.$('#k24').click();},
 run(L){
  let d=0,iv=1,done=false;
  L.h(L.kick('pr','Challenge')+'<h1 class="q">Bramble & Bolt’s dashboard must be exact after a crash, at most 1 second behind, with at most 60 transactions a minute. Set up Linh’s job.</h1>'+
   '<div class="lbl30">How the counter is written</div><div class="row30" id="ca24"></div><div class="lbl30">Checkpoint or microbatch</div><div class="row30" id="cb24"></div>'+
   '<div class="mtr30" id="m24"></div><div id="d24"></div><div class="row30"><button class="btn" id="go24">'+L.ic('play')+'Run with a crash after 7,051</button><button class="btn pri" id="k24">Check</button></div><p class="cap30 sm">4 scans a second; limits are illustrative.</p>');
  const od=Odo(L.$('#d24'),{init:{design:'plain',I:4,crash:10},idle:'Run it to watch the crash, or check when you’re ready.'});
  const meters=()=>{const f=odoSim(od.o).final,behind=d===2?IV[iv]/4:0,tx=d===2?240/IV[iv]:0;
    L.$('#m24').innerHTML='<span class="'+(f.over===0?'ok':'no')+'"><small>After the crash</small>'+(f.over===0?'exact':f.over>0?'over by '+f.over:'under by '+(-f.over))+'</span>'+
      '<span class="'+(behind<=1?'ok':'no')+'"><small>Dashboard behind</small>'+(behind?behind+' s':'0 s')+'</span><span class="'+(tx<=60?'ok':'no')+'"><small>Transactions</small>'+tx+' / min</span>';
    return f.over===0&&behind<=1&&tx<=60;};
  chips(L.$('#ca24'),DSN,j=>{d=j;od.o.design=DK[j];od.reset();meters();})[0].classList.add('sel');
  chips(L.$('#cb24'),IVL,j=>{iv=j;od.o.I=IV[j];od.reset();meters();})[1].classList.add('sel');meters();
  L.$('#go24').onclick=()=>od.run();
  L.$('#k24').onclick=function(){if(done)return;done=true;this.remove();const ok=meters();L.award(ok);od.run(true);
    L.sheet(ok?'ok':'no',ok?'Exact and fresh':'Not all three',(d===0?'Plain +1 always overshoots after a crash. ':d===2&&iv===0?'Committing every half second is exact, but costs 120 transactions a minute. ':d===2&&iv>1?'Exact, but the dashboard only moves at each commit, so it lags. ':'')+
      'Two designs pass: store the offset with the value (exact, instant, no transactions), or commit output and offset together about once a second, as microbatching does.');L.done();};}},

{part:3,src:'Chapter 11 · Rebuilding state after a failure',run(L){
  L.h(L.kick('learn','Rebuilding state after a failure')+'<h1 class="q">Getting the job’s state back</h1>'+P_REBUILD+
   '<p class="cap30">Windowed counts, averages and join tables are state, and must survive a crash. Keep it in a remote database, keep it local and copy it out, or rebuild it from the input.</p>'+
   more('Which tools do what','Flink snapshots operator state to durable storage such as HDFS. Samza and Kafka Streams send state changes to a log-compacted topic, much like CDC. VoltDB processes each message on several nodes.'));
  L.done();}},

{part:3,src:'Chapter 11 · Rebuilding state after a failure',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">The merchant-enrichment job crashed. Tap each piece until it’s a sound recovery plan.</h1>');
  L.sentence(L.card,[['Start with an empty merchants table','Rebuild the merchants table','Ask merchants to resend their settings'],['from the compacted change topic,','from the last hour of scans,','from the courier app’s cache,'],['then add 1 per scan as before.','then write counters only daily.','then store each message’s offset with its write.']],[1,0,2],
   [['An empty table would enrich scans with nothing until each merchant happened to change something.','Merchants shouldn’t have to do anything. The data is already in a log.'],
    ['Scan events don’t contain merchant settings, and an hour of them isn’t the whole table.','The courier app doesn’t hold merchant settings, and it isn’t a reliable source.'],
    ['Plain increments count twice anything replayed after the crash.','Writing once a day defeats the point of a stream job and doesn’t stop double counting.']],
   'A compacted change topic holds every merchant’s latest settings, so the table can be rebuilt from it. Storing offsets with writes makes replayed messages harmless.');}}
  ]
