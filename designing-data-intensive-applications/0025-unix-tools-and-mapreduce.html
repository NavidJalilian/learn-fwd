   Lesson 0025 only. Two hands-on models used across the lesson:
   1. Pipe  – a snap-together Unix pipeline over a sample of Otterpost’s

const T=(x,y,s,o)=>{o=o||{};return '<text x="'+x+'" y="'+y+'" style="font-size:'+(o.s||12)+'px;font-weight:'+(o.w||400)+';fill:var(--'+(o.c||'ink')+');text-anchor:'+(o.a||'start')+(o.m?';font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace':'')+'"'+(o.id?' id="'+o.id+'"':'')+'>'+s+'</text>';};

const CYL=(cx,y,w,h,c)=>{const e=7,x=cx-w/2,st='fill:var('+CP[c][0]+');stroke:var('+CP[c][1]+');stroke-width:2';return '<path d="M'+x+' '+(y+e)+' v'+(h-2*e)+' a'+(w/2)+' '+e+' 0 0 0 '+w+' 0 v'+(-(h-2*e))+'" style="'+st+'"/><ellipse cx="'+cx+'" cy="'+(y+e)+'" rx="'+(w/2)+'" ry="'+e+'" style="'+st+'"/>';};
const DEFS=id=>'<defs><marker id="'+id+'" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--muted)"/></marker></defs>';

const tick=(L,id,j)=>{const li=L.$('#'+id+' li[data-j="'+j+'"]');if(li&&!li.classList.contains('done')){li.classList.add('done');li.querySelector('.bx').textContent='✓';}};
const allTicked=(L,id)=>{const ls=L.$$('#'+id+' li');return ls.length>0&&ls.every(x=>x.classList.contains('done'));};

/* ---------- the access log (illustrative sample, 57 lines) ---------- */
const COUNTS=[['/favicon.ico',11],['/track/OP-48213',9],['/css/site.css',8],['/track/OP-48207',7],['/track/OP-48230',6],['/track/OP-48219',5],['/track/OP-48202',4],['/',3],['/track/OP-48241',2],['/track/OP-48255',1],['/track/OP-48226',1]];
const IPS=['203.0.113.7','198.51.100.4','192.0.2.33','203.0.113.52','198.51.100.19','192.0.2.8','203.0.113.90'];
const LOG=(()=>{const urls=[];COUNTS.forEach(([u,n])=>{for(let k=0;k<n;k++)urls.push(u);});
  let s=7;const rnd=()=>(s=(s*16807)%2147483647)/2147483647;
  for(let i=urls.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[urls[i],urls[j]]=[urls[j],urls[i]];}
  return urls.map((u,i)=>IPS[(i*5+2)%IPS.length]+' - - [14/Nov/2026:07:'+String(2+Math.floor(i/6)).padStart(2,'0')+':'+String((i*13+11)%60).padStart(2,'0')+' +0000] "GET '+u+' HTTP/1.1" 200 '+(u.startsWith('/track')?5120+i*7:u==='/favicon.ico'?318:u==='/'?8410:2264));})();
const pad4=n=>String(n).padStart(4,' ');
const leadNum=s=>{const m=/^\s*(\d+)/.exec(s);return m?+m[1]:0;};
const TOOLS={
  awk7:{t:"awk '{print $7}'",f:a=>a.map(l=>l.trim().split(/\s+/)[6]||'')},
  awk1:{t:"awk '{print $1}'",f:a=>a.map(l=>l.trim().split(/\s+/)[0]||'')},
  grep:{t:'grep /track/',f:a=>a.filter(l=>l.includes('/track/'))},
  sort:{t:'sort',f:a=>a.slice().sort()},
  uniq:{t:'uniq -c',f:a=>{const o=[];let p=null,n=0;for(const l of a){if(l===p)n++;else{if(p!==null)o.push(pad4(n)+' '+p);p=l;n=1;}}if(p!==null)o.push(pad4(n)+' '+p);return o;}},
  sortrn:{t:'sort -r -n',f:a=>a.slice().sort((x,y)=>leadNum(y)-leadNum(x)||(x<y?1:x>y?-1:0))},
  head:{t:'head -n 5',f:a=>a.slice(0,5)}
};
const runPipe=(list,src)=>list.reduce((a,k)=>TOOLS[k].f(a),src||LOG);
const sameOut=(a,b)=>a.length===b.length&&a.every((x,i)=>x===b[i]);
const lines=(a,n)=>a.slice(0,n).map(l=>'<div class="ux-ln">'+(uxEsc(l)||'&nbsp;')+'</div>').join('')+(a.length>n?'<div class="ux-ln" style="color:var(--muted)">… '+(a.length-n)+' more</div>':'');

/* ---------- signature 1: the snap-together pipe ---------- */
function Pipe(L,host,o){
  const id=o.id,P={list:(o.list||[]).slice(),src:null,open:-1,mask:o.mask==null?99:o.mask,cls:'',fresh:-1};
  host.innerHTML=(o.palette?'<div class="ux-hint">Tap a block to snap it onto the bottom of the pipe. × takes one off.</div><div class="ux-pal" id="'+id+'-pal"></div>':'')+'<div id="'+id+'-p"></div>';
  if(o.palette){const pal=L.$('#'+id+'-pal');o.palette.forEach(k=>{const b=document.createElement('button');b.className='chip ux-m';b.id=id+'-a-'+k;b.textContent=TOOLS[k].t;
    b.onclick=()=>{if(P.list.length>=8){L.err('Eight blocks is plenty');return;}P.list.push(k);P.fresh=P.list.length-1;P.draw();};pal.appendChild(b);});}
  P.run=()=>{const st=[P.src||LOG];P.list.forEach(k=>st.push(TOOLS[k].f(st[st.length-1])));return st;};
  function joint(a,j){const masked=j>=P.mask,open=P.open===j;
    const inner='<div class="n">'+(masked?'? lines':a.length+' line'+(a.length===1?'':'s'))+(o.inspect&&!masked?(open?' · open in less ▴':' · tap to look ▾'):'')+'</div>'+(masked?'<div class="ux-ln">?</div>':lines(a,open?10:2));
    return o.inspect?'<button class="ux-jt'+(open?' open':'')+'" data-j="'+j+'" aria-expanded="'+open+'">'+inner+'</button>':'<div class="ux-jt'+(masked?' q':'')+'">'+inner+'</div>';}
  P.draw=()=>{const box=L.$('#'+id+'-p');if(!box)return;const st=P.run(),out=st[st.length-1];
    if(o.judge)P.cls=o.judge(out,P);
    let h='<div class="ux-blk src ux-m">cat access.log</div>';
    P.list.forEach((k,j)=>{h+=joint(st[j],j)+'<div class="ux-blk ux-m"'+(P.fresh===j?'':' style="animation:none"')+'><span>'+uxEsc(TOOLS[k].t)+'</span>'+(o.edit?'<button class="ux-x" data-j="'+j+'" aria-label="Remove '+uxEsc(TOOLS[k].t)+'">×</button>':'')+'</div>';});
    const hide=P.list.length>=P.mask&&P.list.length>0;
    h+='<div class="ux-jt" style="padding:2px 0 2px 12px"></div><div class="ux-out '+P.cls+'"><div class="n">'+(hide?'Output · ?':'Output · '+out.length+' line'+(out.length===1?'':'s'))+'</div>'+(hide?'<div class="ux-ln">?</div>':lines(out,6))+'</div>';
    box.innerHTML=h;P.fresh=-1;
    box.querySelectorAll('.ux-x').forEach(b=>b.onclick=()=>{P.list.splice(+b.dataset.j,1);P.draw();});
    box.querySelectorAll('button.ux-jt').forEach(b=>b.onclick=()=>{const j=+b.dataset.j;P.open=P.open===j?-1:j;P.draw();if(o.onInspect)o.onInspect(j);});
    if(o.onChange)o.onChange(P,out,st);};
  P.draw();return P;}

/* ---------- signature 2: the MapReduce shuffle board ---------- */
const BLK=[[['48201','at hub','WC','BB'],['48202','at hub','ED','BB'],['48203','delivered','','PT'],['48204','at hub','WC','BB']],
  [['48205','at hub','WN','BB'],['48206','at hub','WC','LL'],['48207','out for delivery','','BB'],['48208','at hub','ED','BB']],
  [['48209','at hub','WC','BB'],['48210','at hub','WN','BB'],['48211','at hub','WS','BB'],['48212','delivered','','PT']]];
const HOLD=[[0,2],[0,1],[1,2]];
const PART={hub2:{ED:0,WN:0,WC:1,WS:1},hub3:{ED:0,WC:1,WN:2,WS:2},mer2:{BB:0,PT:1,LL:1},mer3:{BB:0,PT:1,LL:2}};
const RCOL=['h1','h2','h4'];
const BCAP={hub:['One day’s scan file is split into blocks B1–B3. HDFS keeps each block on two machines. One map task per block.',
  'The scheduler runs each map task on a machine that already holds a copy of its block, after copying Linh’s code there. The input never crosses the network.',
  'Each mapper sees one record at a time and remembers nothing between them. An “at hub” scan emits (hub, 1); other scans emit nothing.',
  'Each map task splits its pairs by a hash of the key, one file per reducer, and sorts each file on its own local disk.',
  'When a mapper finishes, every reducer downloads its file from it. Partition, sort, copy: that’s the shuffle. Nothing random about it.',
  'Each reducer merges its sorted files, so equal keys sit side by side, and calls Linh’s reducer once per key. The output goes back to HDFS.']};
const STEPL=['Place the map tasks','Run the mappers','Partition and sort','Shuffle','Merge and reduce'];
function Board(L,host,o){
  o=o||{};const B={};
  B.reset=()=>{B.S={stage:0,R:2,key:'hub',down:-1,place:[0,1,2],mask:[],hl:null};};B.reset();
  const emit=t=>BLK[t].map(r=>B.S.key==='hub'?(r[1]==='at hub'?r[2]:null):r[3]);
  const part=k=>PART[B.S.key+B.S.R][k];
  const kv=(k,r)=>'<span class="ux-kv'+(r==null?'':' r'+r)+(B.S.hl===k?' hl':'')+'">'+k+' 1</span>';
  B.files=t=>{const out=[];for(let r=0;r<B.S.R;r++)out.push(emit(t).filter(k=>k&&part(k)===r).sort());return out;};
  B.alive=()=>host.isConnected;
  B.draw=()=>{if(!host.isConnected)return;const S=B.S;let h='';
    if(!o.only)h+='<div class="ux-leg">'+(S.key==='hub'?'<b>WC</b> Westport Central · <b>WN</b> Westport North · <b>WS</b> Westport South · <b>ED</b> Eastvale Depot':'<b>BB</b> Bramble &amp; Bolt · <b>PT</b> Pip &amp; Thistle · <b>LL</b> Little Lantern')+'</div>';
    h+='<div class="ux-bh">Machines · HDFS keeps each block on two of them</div><div class="ux-g ux-g3">';
    for(let m=0;m<3;m++){const dn=S.down===m,tasks=S.stage>=1?[0,1,2].filter(t=>S.place[t]===m):[],over=o.cap&&tasks.length>o.cap[m];
      h+='<div class="ux-mc'+(dn?' dn':'')+'"><b>M'+(m+1)+'</b>'+(dn?' <span style="color:var(--no);font-weight:700;font-size:11.5px">disk died</span>':'')+
        '<div>'+HOLD[m].map(b=>'<span class="ux-bk">B'+(b+1)+'</span>').join('')+'</div>'+
        (o.cap?'<div class="ux-capl'+(over?' over':'')+'">'+(over?'over capacity!':'room for '+o.cap[m]+' task'+(o.cap[m]>1?'s':''))+'</div>':'')+
        tasks.map(t=>{const local=!dn&&HOLD[m].includes(t);return '<div class="ux-task'+(local&&!over?'':' far')+'">m'+(t+1)+(dn?' can’t run here':local?' reads B'+(t+1)+' locally':' pulls B'+(t+1)+' over the network')+'</div>';}).join('')+'</div>';}
    h+='</div>';
    if(!o.only){
      h+='<div class="ux-bh">'+(S.stage<2?'Map tasks · one per input block':S.stage<3?'Mappers emit (key, 1)':'Mapper output: one sorted file per reducer, on local disk')+'</div><div class="ux-g ux-g3">';
      for(let t=0;t<3;t++){const masked=S.mask.includes(t);
        h+='<div class="ux-col"><div class="ux-ch">m'+(t+1)+' · B'+(t+1)+(S.stage>=1?' · M'+(S.place[t]+1):'')+'</div>';
        if(S.stage<2)h+=BLK[t].map(r=>'<div class="ux-rec">'+r[0]+' '+(S.key==='hub'?(r[1]==='at hub'?'hub '+r[2]:r[1]):r[3])+'</div>').join('');
        else if(S.stage===2||masked)h+=BLK[t].map((r,j)=>{const k=emit(t)[j];return '<div class="ux-rec"><span class="ft">…'+r[0].slice(2)+'</span> → '+(k?kv(k,null):'<span class="ft">nothing</span>')+'</div>';}).join('')+(masked?'<div class="ft" style="margin-top:3px">partitions: ?</div>':'');
        else h+=B.files(t).map((f,r)=>'<div class="ux-file"><div class="ft">to R'+(r+1)+'</div>'+(f.length?f.map(k=>kv(k,r)).join(''):'<span class="ft">empty</span>')+'</div>').join('');
        h+='</div>';}
      h+='</div>';
      if(S.stage>=4){const xs=[53,160,267],rx=S.R===2?[80,240]:[53,160,267];let ln='';
        for(let t=0;t<3;t++)B.files(t).forEach((f,r)=>{if(f.length)ln+='<line x1="'+xs[t]+'" y1="2" x2="'+rx[r]+'" y2="32" style="stroke:var(--'+RCOL[r]+');stroke-width:2.2"/>';});
        h+='<svg viewBox="0 0 320 34" preserveAspectRatio="none" style="width:100%;height:34px;display:block;margin:2px 0" aria-hidden="true">'+ln+'</svg>';
        h+='<div class="ux-bh" style="margin-top:0">'+(S.stage<5?'Reducers download their files: the shuffle':'Reducers merge, then count each key')+'</div><div class="ux-g ux-g'+S.R+'">';
        for(let r=0;r<S.R;r++){const got=[0,1,2].map(t=>B.files(t)[r]),all=[].concat(...got).sort();
          h+='<div class="ux-red r'+r+'"><div class="ux-ch" style="color:var(--'+RCOL[r]+')">R'+(r+1)+' · '+all.length+' pair'+(all.length===1?'':'s')+'</div>';
          if(S.stage===4)h+=got.map((f,t)=>f.length?'<div class="ux-rr"><span class="ft">from m'+(t+1)+'</span> '+f.map(k=>kv(k,r)).join('')+'</div>':'').join('');
          else{const cnt={};all.forEach(k=>cnt[k]=(cnt[k]||0)+1);
            h+='<div>'+all.map(k=>kv(k,r)).join('')+'</div>'+(Object.keys(cnt).sort().map(k=>'<div class="ux-res'+(S.hl===k?' hl':'')+'">'+k+' → '+cnt[k]+'</div>').join('')||'<div class="ft">no keys</div>')+'<div class="ft" style="margin-top:3px">→ written to HDFS</div>';}
          h+='</div>';}
        h+='</div>';}}
    host.innerHTML=h;};
  B.play=async(from,to,ms)=>{for(let s=from;s<=to;s++){if(!B.alive())return false;B.S.stage=s;B.draw();if(s<to)await L.sleep(ms);}return B.alive();};
  B.draw();return B;}

Course.lesson({
  id:'0025', title:'Batch processing with Unix tools and MapReduce', minutes:20, icon:'layers',
  goals:['Tell a system of record from derived data, and rebuild what is derived','Build a Unix pipeline and explain why sorting copes with data bigger than memory','Trace a MapReduce job from input blocks through the shuffle to reducer output'],
  parts:['Derived data','Unix pipes','Unix philosophy','MapReduce'],
  read:'Read the Part III introduction and chapter 10 up to the end of “MapReduce workflows” for the full log-analysis walkthrough and the Unix philosophy in the book’s own words.',
  glossary:{
    batch:'Batch job: a program that reads a large, fixed set of input data, processes all of it and writes output. Nobody waits for it; it usually runs on a schedule, such as nightly. Batch is old: punch-card machines tallied the 1890 US census. MapReduce (2004) took it to clusters of ordinary machines; its importance is now declining, but it shows clearly why batch is useful.',
    workingset:'Working set: the amount of memory a job needs random access to at the same time.',
    stdio:'stdin and stdout: a program’s standard input and standard output. The program just reads one and writes the other; whoever runs it decides where they are connected.',
    hdfs:'HDFS (Hadoop Distributed File System): one big filesystem made from the disks of many ordinary machines, an open-source copy of Google’s GFS. Files are split into blocks, and each block is kept on several machines, as full copies or with erasure coding. The biggest deployments span tens of thousands of machines and hundreds of petabytes. Object stores such as Amazon S3 work in a similar way.',
    'shared-nothing':'Shared-nothing: an architecture where each machine has its own CPU, memory and disks, and machines coordinate only over an ordinary network.',
    mapper:'Mapper: in MapReduce, your function that runs on each input record and pulls out a key and a value.',
    reducer:'Reducer: in MapReduce, your function that is called once per key, with all the values for that key, and writes output records.',
    workflow:'Workflow: a chain of batch jobs where one job’s output directory is the next job’s input. Schedulers such as Oozie, Azkaban, Luigi, Airflow and Pinball run the jobs in order. Workflows of 50 to 100 jobs are common for recommendation systems, and tools such as Pig, Hive, Cascading, Crunch and FlumeJava set up multi-stage workflows for you.',
    shuffle:'Shuffle: the MapReduce step that splits mapper output by key, sorts it and copies each part to the right reducer. Despite the name, nothing is random.'
  },
  cheatsheet:[
    '<b>System of record</b> = the authoritative copy, written first. <b>Derived data</b> (caches, indexes, reports, predictions) is built from it and can be rebuilt. Which one a database is depends on how you use it, not on the tool.',
    '<b>Services</b> are judged by response time, <b>batch jobs</b> by throughput, and <b>stream processors</b> sit in between, acting soon after each event.',
    'A <b>hash table</b> of counts needs memory for every distinct key. <b>Sorting</b> spills sorted chunks to disk and merges them, so it keeps going when the keys don’t fit.',
    'Unix philosophy: small tools that do one thing well, a <b>uniform interface</b> (bytes, one record per line), <b>logic separate from wiring</b> (stdin/stdout), and <b>immutable inputs</b> that make experiments safe.',
    '<b>HDFS</b> is a shared-nothing filesystem: a NameNode tracks which machine holds each block, and every block is copied to several machines.',
    '<b>MapReduce</b>: the mapper pulls out a key and value → the framework partitions by a hash of the key, sorts and shuffles → the reducer combines all values for each key. Map tasks run where their block is stored.',
    'Jobs chain into <b>workflows</b> through directory names. A job’s output only counts once the whole job has succeeded.'
  ],
  steps:[

  L.h(L.kick('pr','Hands on')+'<h1 class="q">Wipe Otterpost’s systems. Which ones come back?</h1>'+CSS+
   goals('w4g',['Wipe a derived system, then rebuild it','Wipe the Parcel DB, then try to rebuild something'])+
   '<button class="ux-sys rec" id="w4-db"></button><div class="ux-dn">▼ built from the Parcel DB ▼</div><div class="ux-g ux-g2" id="w4-grid"></div>'+
   '<p class="ux-hint">Tap a system to wipe it. Tap a wiped one to rebuild it.</p>');
  L.$('#w4-grid').innerHTML=NM.map((n,k)=>'<button class="ux-sys" id="w4-d'+k+'"></button>').join('');
  const db=L.$('#w4-db');
  const drawDb=()=>{db.className='ux-sys rec'+(S.db?'':' gone fail');db.innerHTML='<b>Parcel DB</b><span class="st">'+(S.db?'system of record · parcels, addresses, scans':'wiped: the only authoritative copy is gone. Tap to undo (this is a sandbox)')+'</span><span class="bar"><i style="width:'+(S.db?100:0)+'%"></i></span>';};
  const drawD=(k,st,cls)=>{const b=L.$('#w4-d'+k);if(!b)return;b.className='ux-sys'+(cls?' '+cls:'');b.innerHTML='<b>'+NM[k]+'</b><span class="st">'+st+'</span><span class="bar"><i style="width:'+(S.d[k]*100)+'%"></i></span>';};
  drawDb();NM.forEach((n,k)=>drawD(k,'derived · full'));
  const check=()=>{if(allTicked(L,'w4g')&&!S.fin){S.fin=true;
    L.sheet('info','Copies come back; the original doesn’t','Derived data is redundant on purpose: it repeats the source in a shape that makes reads fast, and losing it costs only the time to rebuild. The system of record is the copy everything else is built from, so when two systems disagree, it is right by definition.');L.done();}};
  db.onclick=()=>{if(S.busy)return;S.db=!S.db;drawDb();};
  NM.forEach((n,k)=>{L.$('#w4-d'+k).onclick=()=>{if(S.busy)return;
    if(S.d[k]===1){S.d[k]=0;drawD(k,'wiped: empty. Tap to rebuild','gone');return;}
    if(!S.db){drawD(k,'can’t rebuild: nothing left to copy from','gone fail');L.shake(L.$('#w4-d'+k));tick(L,'w4g',1);check();return;}
    S.busy=true;S.d[k]=1;drawD(k,'rebuilding from the Parcel DB…','gone');
    setTimeout(()=>{S.busy=false;if(!L.$('#w4-d'+k))return;drawD(k,'rebuilt: same data as before');tick(L,'w4g',0);check();},650);};});}},

{part:1,src:'Chapter 10 · Batch Processing',run(L){
  L.h(L.kick('learn','Three kinds of system')+'<h1 class="q">Not every system waits for a request</h1>'+CSS+FIG_KINDS()+
   '<p class="ux-cap">Services answer while someone waits. A '+L.g('batch','batch job')+' crunches a fixed pile of input, often nightly, so nobody waits; it is judged by throughput. Stream processors act soon after each event. This chapter is batch.</p>');
  L.done();}},

{part:1,src:'Chapter 10 · Simple Log Analysis',

 run(L){

{part:1,src:'Chapter 10 · Simple Log Analysis',
 solve:async L=>{for(let k=0;k<5;k++){const b=L.$('#e9go');if(b)b.click();await L.sleep(20);}},
 run(L){
  const SEQ=['awk7','sort','uniq','sortrn','head'];
  const CAP=['57 sample lines of this morning’s log (illustrative; the real one has millions). Snap on the first tool.',
   '<b>awk</b> splits each line on spaces and keeps field 7: just the page.',
   '<b>sort</b> puts the lines in order. All 9 copies of /track/OP-48213 now sit in a row.',
   '<b>uniq -c</b> compares each line with the one before it and collapses every run of repeats into one line with a count.',
   '<b>sort -r -n</b> sorts by the number at the start: numerically (-n), biggest first (-r).',
   '<b>head -n 5</b> keeps the first five lines. Done: the top five pages. On a real server this chews through gigabytes in seconds.'];
  let k=0;
  L.h(L.kick('ex','Worked example')+'<h1 class="q">Linh finds the five most-viewed pages by snapping small tools together</h1>'+CSS+
   '<div class="ux-read" id="e9c"></div><div id="e9b"></div><div id="e9p" style="margin-top:8px"></div>');
  const P=Pipe(L,L.$('#e9p'),{id:'e9',judge:(out,P)=>P.list.length===5?'hit':''});
  const upd=()=>{L.$('#e9c').innerHTML='<span class="small" style="font-weight:700;display:block">Step '+k+' of 5</span>'+CAP[k];
    L.$('#e9b').innerHTML=k<5?'<button class="btn pri ux-m" id="e9go">+ '+uxEsc(TOOLS[SEQ[k]].t)+'</button>':'';
    const b=L.$('#e9go');if(b)b.onclick=()=>{P.list.push(SEQ[k]);P.fresh=k;k++;P.draw();upd();
      if(k===5){L.sheet('info','Six tools, one report','Each joint is a stream of plain text lines passed straight to the next tool through a small memory buffer; the whole stream is never written to disk. To count visitors instead of pages, change $7 to $1. To skip CSS files, change only the awk part. Small tools make the analysis easy to bend.');L.done();}};};
  upd();}},
{part:1,src:'Chapter 10 · Simple Log Analysis',pts:1,
 solve:async L=>{L.$('#p10o').children[1].click();await L.sleep(30);L.$('#p10fix').click();},
 run(L){
  let pick=null;
  L.h(L.kick('try','Predict, then watch')+'<h1 class="q">Tobias drops the first <span class="ux-m">sort</span> to save time. What will the output show?</h1>'+CSS+
   '<div class="ux-ctl" id="p10o"></div><div id="p10x"></div><div id="p10p"></div>');
  const P=Pipe(L,L.$('#p10p'),{id:'p10',list:['awk7','uniq','sortrn','head'],mask:2});
  ['The true counts, led by 11 /favicon.ico','Small counts, some pages listed twice','An error: uniq -c needs sorted input'].forEach((t,j)=>{
    const b=document.createElement('button');b.className='chip';b.textContent=t;
    b.onclick=()=>{if(pick!==null)return;pick=j;b.classList.add('sel');[...L.$('#p10o').children].forEach(x=>{if(x!==b)x.setAttribute('aria-disabled','true');});
      P.mask=99;P.cls='bad';P.draw();const ok=j===1;L.award(ok);b.classList.add(ok?'ok':'no');L.$('#p10o').children[1].classList.add('ok');
      L.sheet(ok?'ok':'no',ok?'Right: the counts fall apart':'Look at the output',
       '<b>uniq -c</b> only compares each line with the one right before it. Unsorted, the 11 /favicon.ico requests are scattered, so it counts short runs: 3 here, 1 there, and a page appears on several lines. No error: it just answers a different question.');
      L.$('#p10x').innerHTML='<button class="btn pri" id="p10fix">Put the first sort back</button>';
      L.$('#p10fix').onclick=function(){this.remove();P.list.splice(1,0,'sort');P.fresh=1;P.cls='hit';P.draw();
        L.$('#p10x').innerHTML='<div class="ux-read good">Sorted first, all 11 copies of /favicon.ico sit together, so uniq counts them as one run: 11.</div>';L.done();};};
    L.$('#p10o').appendChild(b);});}},
{part:1,src:'Chapter 10 · Sorting versus in-memory aggregation',run(L){
  L.h(L.kick('learn','Two ways to count')+'<h1 class="q">A table in memory, or sort first?</h1>'+CSS+FIG_HS()+
   '<p class="ux-cap">Tobias’s version of the report keeps a hash table: one counter per distinct page, all in memory. The pipeline keeps no table: once sorted, repeats are neighbours, and sort itself spills to disk when memory runs out.</p>');
  L.done();}},
{part:1,src:'Chapter 10 · Sorting versus in-memory aggregation',
 solve:async L=>{L.$('#g12p2').click();await L.sleep(20);L.$('#g12p1').click();},
 run(L){
  const DST=[1,40,1e3,1e5,1e6,1e7,3e7,1e8,5e8],LST=[1e6,1e7,1e8,8.8e8,1e9,1e10];
  const MEM=1e9,ROW=100,LINE=50;
  const fmtN=n=>n>=1e9?(n/1e9)+' billion':n>=1e6?(n/1e6)+' million':n>=1e3?(n/1e3)+' thousand':String(n);
  const fmtB=b=>b>=1e9?Math.round(b/1e9)+' GB':b>=1e6?Math.round(b/1e6)+' MB':b>=1e3?Math.round(b/1e3)+' KB':b+' bytes';
  L.h(L.kick('pr','Hands on')+'<h1 class="q">Linh’s machine has 1 GB of memory. Push the counting job until the hash table breaks.</h1>'+CSS+
   goals('g12g',['Make the hash table run out of memory','Feed it almost a billion lines without breaking it'])+
   '<div class="ux-fig" id="g12f"></div><div class="ux-read" id="g12r"></div>'+
   '<div class="ux-rng"><label for="g12d">Distinct keys</label><b id="g12d-v"></b><input type="range" id="g12d" min="0" max="'+(DST.length-1)+'" step="1" value="2"></div>'+
   '<div class="ux-rng"><label for="g12n">Log lines</label><b id="g12n-v"></b><input type="range" id="g12n" min="0" max="'+(LST.length-1)+'" step="1" value="1"></div>'+
   '<div class="ux-hint">Presets (one year of Otterpost data):</div><div class="ux-ctl"><button class="chip" id="g12p0">1 page, 1 million views</button><button class="chip" id="g12p1">Job A · scans per hub</button><button class="chip" id="g12p2">Job B · pings per courier-minute</button></div>'+
   '<p class="small">Illustrative numbers: about 100 bytes per counter, 50 bytes per log line.</p>');
  let fin=false;
  function upd(){const n=LST[+L.$('#g12n').value],d=Math.min(DST[+L.$('#g12d').value],n);
    L.$('#g12d-v').textContent=fmtN(d);L.$('#g12n-v').textContent=fmtN(n);
    const need=d*ROW,crash=need>MEM,data=n*LINE,chunks=data<=MEM?0:Math.ceil(data/MEM),fill=Math.min(need/MEM,1);
    const tiles=Math.min(chunks,11);
    L.$('#g12f').innerHTML='<svg viewBox="0 0 320 172" role="img" aria-label="Memory gauges. Hash table needs '+fmtB(need)+(crash?', out of memory':'')+'. Sort writes '+chunks+' sorted chunks to disk.">'+
     T(4,14,'Hash table',{s:12.5,w:700,c:'h2'})+T(170,14,'Sort, spill, merge',{s:12.5,w:700,c:'h3'})+
     T(4,30,'memory 1 GB',{s:11,c:'muted'})+T(170,30,'memory 1 GB',{s:11,c:'muted'})+
     (crash?'<rect x="4" y="34" width="140" height="96" rx="8" style="fill:var(--no-bg);stroke:var(--no);stroke-width:2.5"/>'+T(74,78,'out of',{s:13,w:700,a:'middle',c:'no'})+T(74,95,'memory',{s:13,w:700,a:'middle',c:'no'}):
       RX(4,34,140,96,'card',8)+'<rect x="6" y="'+(128-Math.max(fill*92,2))+'" width="136" height="'+Math.max(fill*92,2)+'" rx="6" style="fill:var(--h2-bg);stroke:var(--h2);stroke-width:1.5"/>')+
     T(4,148,'needs '+fmtB(need),{s:11.5,w:700,c:crash?'no':'ink'})+T(4,164,'for '+fmtN(d)+' counter'+(d===1?'':'s'),{s:11,c:'muted'})+
     RX(170,34,146,54,'card',8)+'<rect x="172" y="'+(86-Math.min(data/MEM,1)*46)+'" width="142" height="'+(Math.min(data/MEM,1)*46)+'" rx="6" style="fill:var(--h3-bg);stroke:var(--h3);stroke-width:1.5"/>'+
     T(170,104,'disk',{s:11,c:'muted'})+RX(170,108,146,30,'soft',6)+
     Array.from({length:tiles},(x,i)=>'<rect x="'+(175+i*10)+'" y="114" width="7" height="18" rx="2" style="fill:var(--h3)"/>').join('')+
     (chunks>tiles?T(316,128,'+'+(chunks-tiles),{s:11,w:700,a:'end'}):'')+(chunks===0?T(243,127,'nothing spilled',{s:11,a:'middle',c:'muted'}):'')+
     T(170,154,chunks?chunks+' sorted chunks,':'fits in memory',{s:11.5,w:700})+T(170,168,chunks?'then one merge pass':'no spilling needed',{s:11,c:'muted'})+'</svg>';
    L.$('#g12r').className='ux-read'+(crash?' bad':'');
    L.$('#g12r').innerHTML=crash?'<b>Hash table:</b> '+fmtN(d)+' distinct keys need '+fmtB(need)+'. The job dies. <b>Sort</b> still finishes: memory stays full but never overflows.':
      '<b>Hash table:</b> fine, '+fmtB(need)+(n>=8.8e8?', even with '+fmtN(n)+' lines. Line count doesn’t matter; distinct keys do.':'.')+' <b>Sort:</b> '+(chunks?'spills '+chunks+' sorted chunks and merges them.':'fits in memory.');
    if(crash)tick(L,'g12g',0);
    if(!crash&&n>=8.8e8)tick(L,'g12g',1);
    if(allTicked(L,'g12g')&&!fin){fin=true;
      L.sheet('info','Distinct keys set the working set','The hash table’s '+L.g('workingset','working set')+' grows with distinct keys only. When it outgrows memory, sorting wins: chunks are sorted in memory, written to disk and merged, all in long sequential runs, the same trick as SSTables in chapter 3. GNU sort does this by itself and uses several CPU cores; the slow part is usually just reading the input.');L.done();}}
  L.$('#g12d').oninput=upd;L.$('#g12n').oninput=upd;
  const pre=(d,n)=>{L.$('#g12d').value=DST.indexOf(d);L.$('#g12n').value=LST.indexOf(n);upd();};
  L.$('#g12p0').onclick=()=>pre(1,1e6);L.$('#g12p1').onclick=()=>pre(40,8.8e8);L.$('#g12p2').onclick=()=>pre(5e8,1e10);
  upd();}},
{part:1,src:'Chapter 10 · Simple Log Analysis',pts:1,
 solve:async L=>{L.$('#c13clr').click();['awk7','grep','sort','uniq','sortrn','head'].forEach(k=>L.$('#c13-a-'+k).click());L.$('#c13chk').click();},
 run(L){
  const TARGET=runPipe(['awk7','grep','sort','uniq','sortrn','head']);let first=true,won=false;
  L.h(L.kick('pr','Challenge')+'<h1 class="q">Signe wants the five most-viewed <b>parcel tracking pages</b>: no favicon, no CSS. Build it with at most 6 blocks.</h1>'+CSS+
   '<div class="ux-read"><div class="small" style="font-weight:700;margin-bottom:2px">Target output</div>'+lines(TARGET,5)+'</div>'+
   '<div class="ux-ctl"><button class="btn pri" id="c13chk">Check my pipeline</button><button class="btn" id="c13clr">Clear</button><span class="small" id="c13n" style="align-self:center"></span></div><div id="c13p"></div>');
  const P=Pipe(L,L.$('#c13p'),{id:'c13',edit:true,palette:['sort','head','awk1','uniq','grep','sortrn','awk7'],
    judge:out=>sameOut(out,TARGET)?'hit':'',onChange:P=>{const n=L.$('#c13n');if(n)n.textContent='Blocks: '+P.list.length+' of 6';}});
  L.$('#c13clr').onclick=()=>{P.list=[];P.draw();};
  L.$('#c13chk').onclick=()=>{if(won)return;const out=runPipe(P.list),ok=sameOut(out,TARGET)&&P.list.length<=6;
    if(first){L.award(ok);first=false;}
    if(ok){won=true;L.sheet('ok','Signe has their list','awk keeps the page, grep keeps only /track/ lines, sort lines up repeats, uniq -c counts them, sort -r -n ranks, head keeps five. Filtering with grep before or after counting both work. The book does the same filtering by changing only the awk part.');L.done();}
    else L.sheet('no',sameOut(out,TARGET)?'Right output, too many blocks':'Not the target yet',sameOut(out,TARGET)?'Six blocks are enough: one tool for each job. Take off the extra one and check again.':'Compare your output with the target. Keep only the page, filter to /track/, and remember uniq -c needs sorted input. Then rank and cut to five.');};}},

{part:2,src:'Chapter 10 · The Unix Philosophy',run(L){
  L.h(L.kick('learn','The Unix philosophy')+'<h1 class="q">Connect programs like a garden hose</h1>'+CSS+
   L.quote('We should have some ways of connecting programs like [a] garden hose','Doug McIlroy, inventor of Unix pipes, 1964 (quoted in chapter 10)')+FIG_HOSE()+
   '<p class="ux-cap">Written down in 1978, these sound a lot like Agile and DevOps today, the book notes. <b>sort</b> is the model: a better sort than most standard libraries, yet barely useful alone. Next to <b>uniq</b> it becomes powerful.</p>');
  L.done();}},
{part:2,src:'Chapter 10 · Separation of logic and wiring',
 solve:async L=>{L.$('#r15i1').click();L.$('#r15o2').click();L.$('#r15t').click();},
 run(L){
  const IN=[['scans.log','a file on disk','zone &lt; scans.log'],['grep’s output','a pipe from another tool','grep "at hub" scans.log | zone'],['the keyboard','typed by hand','zone']];
  const OUT=[['the screen','the terminal',''],['zones.txt','a file on disk',' &gt; zones.txt'],['sort','a pipe into the next tool',' | sort']];
  const S={i:0,o:0,tob:false};
  L.h(L.kick('pr','Hands on')+'<h1 class="q">Rewire Linh’s <span class="ux-m">zone</span> tool (postcode → delivery zone) without touching its code</h1>'+CSS+
   goals('r15g',['Plug in a different input','Send the output somewhere else','Compare with Tobias’s version'])+
   '<div class="ux-fig" id="r15f"></div><div class="ux-read" id="r15cmd"></div>'+
   '<div class="ux-hint">Input: '+L.g('stdio','stdin')+' comes from…</div><div class="ux-ctl" id="r15in"></div>'+
   '<div class="ux-hint">Output: stdout goes to…</div><div class="ux-ctl" id="r15out"></div>'+
   '<div class="ux-ctl"><button class="btn" id="r15t">Show Tobias’s version</button></div>');

  OUT.forEach((x,j)=>{L.$('#r15out').insertAdjacentHTML('beforeend','<button class="chip'+(j===0?' sel':'')+'" id="r15o'+j+'">'+x[0]+'</button>');});
  function draw(){const t=S.tob,fade=t?';opacity:.4':'';
    L.$('#r15f').innerHTML='<svg viewBox="0 0 320 196" role="img" aria-label="'+(t?'Tobias’s tool opens its own files, so the input and output chosen in the shell are not connected.':'Input '+IN[S.i][0]+' flows through stdin into zone, and stdout flows to '+OUT[S.o][0]+'.')+'">'+DEFS('mR')+
     '<g style="'+fade+'">'+RX(50,4,220,42,'soft')+T(160,22,IN[S.i][0],{s:12.5,w:700,a:'middle'})+T(160,38,IN[S.i][1],{s:11,a:'middle',c:'muted'})+'</g>'+
     '<path d="M160 47 L160 70" style="fill:none;stroke:var('+(t?'--line2':'--muted')+');stroke-width:2'+(t?';stroke-dasharray:4 4':'')+'"'+(t?'':' marker-end="url(#mR)"')+'/>'+T(170,63,t?'not connected':'stdin',{s:11,c:t?'no':'muted'})+(t?'':T(150,63,'bytes, one record per line',{s:11,a:'end',c:'muted'}))+
     RX(30,72,260,54,t?'h4':'h2')+
     (t?T(160,90,'tobias-zone',{s:13,w:700,a:'middle',m:1})+T(160,105,'opens /data/scans.log itself',{s:11,a:'middle'})+T(160,119,'writes /reports/zones.txt itself',{s:11,a:'middle'}):
        T(160,95,'zone',{s:14,w:700,a:'middle',m:1})+T(160,113,'logic only: postcode → zone',{s:11,a:'middle',c:'muted'}))+
     '<path d="M160 127 L160 150" style="fill:none;stroke:var('+(t?'--line2':'--muted')+');stroke-width:2'+(t?';stroke-dasharray:4 4':'')+'"'+(t?'':' marker-end="url(#mR)"')+'/>'+T(170,143,t?'not connected':'stdout',{s:11,c:t?'no':'muted'})+
     '<g style="'+fade+'">'+RX(50,152,220,40,'soft')+T(160,169,OUT[S.o][0],{s:12.5,w:700,a:'middle'})+T(160,184,OUT[S.o][1],{s:11,a:'middle',c:'muted'})+'</g></svg>';
    L.$('#r15cmd').innerHTML=t?'<div class="ux-m" style="font-size:13px">$ tobias-zone</div><div class="small" style="margin-top:4px">Always reads /data/scans.log and writes /reports/zones.txt. To read grep’s output instead, Tobias has to change the program.</div>':
      '<div class="ux-m" style="font-size:13px;overflow-wrap:anywhere">$ '+IN[S.i][2]+OUT[S.o][2]+'</div><div class="small" style="margin-top:4px">The shell did the wiring. Lines of zone’s code changed: <b>0</b>.</div>';
    L.$$('#r15in .chip,#r15out .chip').forEach(c=>c.setAttribute('aria-disabled',t?'true':'false'));
    L.$('#r15t').textContent=t?'Back to Linh’s version':'Show Tobias’s version';}
  function check(){if(allTicked(L,'r15g')&&!S.fin){S.fin=true;
    L.sheet('info','Logic here, wiring there','Linh’s tool just reads stdin and writes stdout, so whoever runs it does the wiring, and it fits any pipeline. Files, pipes, the keyboard and network sockets all share one interface: an ordered stream of bytes, by convention one record per line. Limits: several inputs or outputs get awkward, and piping into a network connection needs a tool like netcat or curl.');L.done();}}
  IN.forEach((x,j)=>{L.$('#r15i'+j).onclick=()=>{if(S.tob)return;S.i=j;L.$$('#r15in .chip').forEach((c,k)=>c.classList.toggle('sel',k===j));if(j)tick(L,'r15g',0);draw();check();};});
  OUT.forEach((x,j)=>{L.$('#r15o'+j).onclick=()=>{if(S.tob)return;S.o=j;L.$$('#r15out .chip').forEach((c,k)=>c.classList.toggle('sel',k===j));if(j)tick(L,'r15g',1);draw();check();};});
  L.$('#r15t').onclick=()=>{S.tob=!S.tob;if(S.tob)tick(L,'r15g',2);draw();check();};
  draw();}},
{part:2,src:'Chapter 10 · Transparency and experimentation',
 solve:async L=>{L.$('#t16p button.ux-jt[data-j="2"]').click();L.$('#t16w').click();},
 run(L){
  L.h(L.kick('pr','Hands on')+'<h1 class="q">Peek inside the pipe, then break the rule that makes peeking safe</h1>'+CSS+
   goals('t16g',['Tap a joint to look inside, like piping into <span class="ux-m">less</span>','Let Tobias’s cleanup overwrite the input, then rerun'])+
   '<div class="ux-ctl"><button class="btn" id="t16w">Tobias: overwrite access.log with just the pages</button></div><div id="t16m"></div><div id="t16p"></div>');
  let fin=false;
  const check=()=>{if(allTicked(L,'t16g')&&!fin){fin=true;
    L.sheet('info','Immutable inputs make experiments cheap','Unix commands normally treat their input as read-only, so you can rerun a pipeline as often as you like with different options. You can stop at any stage and look, or save one stage’s output to a file and rerun only the later stages. MapReduce keeps the same habit: a job normally doesn’t change its input.');L.done();}};
  const P=Pipe(L,L.$('#t16p'),{id:'t16',list:['awk7','sort','uniq','sortrn','head'],inspect:true,onInspect:()=>{tick(L,'t16g',0);check();}});
  L.$('#t16w').onclick=function(){
    if(!P.src){P.src=LOG.map(l=>l.split(/\s+/)[6]);P.cls='bad';P.draw();this.textContent='Restore the original log (sandbox only)';
      L.$('#t16m').innerHTML='<div class="ux-read bad">The cleanup wrote over access.log. Each line now has one field, so field 7 is empty and uniq counts 57 blank lines. Rerunning can’t fix it: the original is gone.</div>';tick(L,'t16g',1);check();}
    else{P.src=null;P.cls='';P.draw();this.textContent='Tobias: overwrite access.log with just the pages';
      L.$('#t16m').innerHTML='<div class="ux-read good">Back to normal. In real life there’d be no undo. The safe habit: write results to a new file, such as pages.log, and leave the input untouched.</div>';}};}},
{part:2,src:'Chapter 10 · The Unix Philosophy',pts:5,run(L){
  L.h(L.kick('pr','Name the idea')+'<h1 class="q">Which Unix idea is Linh relying on in each case?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Uniform interface','Logic vs wiring','Experimentation'],[
   ['Linh pipes one stage’s output into a pager to check it before adding the next step.',2,'Stopping at any stage to look is the transparency that makes experiments easy.'],
   ['Linh’s tools can read a scan file, another tool’s output or a socket, because all are just bytes.',0,'Everything looks like a file, so anything can plug into anything.'],
   ['Linh’s postcode-to-zone tool reads stdin and writes stdout, so anyone can drop it into a pipeline.',1,'The tool holds the logic; whoever runs it decides the wiring.'],
   ['Linh saves stage 3’s output to a file, fixes stage 4, and reruns only stages 4 and 5.',2,'Saved intermediate output lets you restart later stages without rerunning everything.'],
   ['Every tool in the pipeline splits records on the newline character.',0,'A shared record separator is part of the uniform interface that lets the tools work together.']],
   'A uniform interface lets tools connect, separating logic from wiring lets you connect them any way you like, and immutable inputs make trying things safe. The biggest limit: Unix tools run on one machine.');}},

{part:3,src:'Chapter 10 · MapReduce and Distributed Filesystems',run(L){
  L.h(L.kick('learn','From one machine to thousands')+'<h1 class="q">One filesystem made of many machines’ disks</h1>'+CSS+FIG_HDFS()+
   '<p class="ux-cap">'+L.g('hdfs','HDFS')+' joins ordinary machines’ disks into one '+L.g('shared-nothing','shared-nothing')+' filesystem. A daemon on each machine serves its files; the NameNode tracks which block is where. Every block sits on several machines, so a dead disk loses nothing.</p>');
  L.done();}},
{part:3,src:'Chapter 10 · MapReduce Job Execution',run(L){
  L.h(L.kick('learn','How a MapReduce job works')+'<h1 class="q">The same pipeline, as one MapReduce job</h1>'+CSS+FIG_MAP()+
   '<p class="ux-cap">Like a Unix tool, a job reads input files and writes new output files, normally leaving its input unchanged. You write only the '+L.g('mapper','mapper')+' (like awk) and the '+L.g('reducer','reducer')+' (like uniq -c). Ranking needs a second sort: a second job.</p>');
  L.done();}},
{part:3,src:'Chapter 10 · Distributed execution of MapReduce',
 solve:async L=>{for(let k=0;k<5;k++){L.$('#b20n').click();await L.sleep(15);}},
 run(L){
  L.h(L.kick('ex','Step through it')+'<h1 class="q">Be the cluster: Linh’s job counts “at hub” scans per hub</h1>'+CSS+
   '<div id="b20"></div><div class="ux-read" id="b20c"></div><div class="ux-ctl" id="b20k"><button class="btn pri" id="b20n"></button><button class="btn" id="b20r">Start over</button></div>');
  const B=Board(L,L.$('#b20'));let fin=false;
  const keep=()=>{const k=L.$('#b20k');if(!k)return;const d=document.querySelector('.dock'),lim=(d?d.getBoundingClientRect().top:innerHeight)-12,c=L.$('#b20c').getBoundingClientRect(),r=k.getBoundingClientRect();
    if(r.bottom>lim)window.scrollBy({top:Math.min(r.bottom-lim,Math.max(c.top-80,0)),behavior:'smooth'});};
  const upd=()=>{const s=B.S.stage;L.$('#b20c').innerHTML='<span class="small" style="font-weight:700;display:block">Step '+s+' of 5</span>'+BCAP.hub[s];
    const n=L.$('#b20n');n.textContent=s<5?'Next: '+STEPL[s]:'Done';n.disabled=s>=5;};
  L.$('#b20n').onclick=()=>{if(B.S.stage>=5)return;B.S.stage++;B.draw();upd();keep();
    if(B.S.stage===5&&!fin){fin=true;L.sheet('info','Two small functions, a lot of plumbing','Linh wrote only “at hub scan → (hub, 1)” and “add up the ones”. Placing tasks near the data, '+L.g('partition','partitioning')+' by key, sorting, the '+L.g('shuffle','shuffle')+' and merging were all the framework’s work.');L.done();}};
  L.$('#b20r').onclick=()=>{B.S.stage=0;B.draw();upd();keep();};

{part:3,src:'Chapter 10 · Distributed execution of MapReduce',pts:1,
 solve:async L=>{L.$('#p21o').children[1].click();for(let i=0;i<100&&!L.$('#p21d');i++)await L.sleep(30);},
 run(L){
  let pick=null;
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">m1 put its Westport Central pairs in its file for R2. Where will m3’s Westport Central pair go?</h1>'+CSS+
   '<div class="ux-ctl" id="p21o"></div><div id="p21x"></div><div id="p21b"></div>');
  const B=Board(L,L.$('#p21b'));B.S.stage=3;B.S.mask=[1,2];B.S.hl='WC';B.draw();
  ['R1, to spread the load evenly','R2, the same reducer as m1’s','Whichever reducer is free first'].forEach((t,j)=>{
    const b=document.createElement('button');b.className='chip';b.textContent=t;
    b.onclick=async()=>{if(pick!==null)return;pick=j;b.classList.add('sel');[...L.$('#p21o').children].forEach(x=>{if(x!==b)x.setAttribute('aria-disabled','true');});
      const ok=j===1;L.award(ok);b.classList.add(ok?'ok':'no');L.$('#p21o').children[1].classList.add('ok');
      L.sheet(ok?'ok':'no',ok?'Same key, same reducer':'It goes to R2',
       'The reducer is picked by a hash of the key, and Westport Central hashes to the same value whichever mapper computes it. So every WC pair from m1, m2 and m3 meets at R2, sorted next to each other, and R2 alone counts all 4.');
      B.S.mask=[];B.draw();await L.sleep(450);if(!B.alive())return;
      if(!await B.play(4,5,550))return;
      L.$('#p21x').innerHTML='<div class="ux-read good" id="p21d">All four WC pairs (outlined) end up at R2: WC → 4.</div>';L.done();};
    L.$('#p21o').appendChild(b);});}},
{part:3,src:'Chapter 10 · Distributed execution of MapReduce',
 solve:async L=>{L.$('#e22p0').click();for(let i=0;i<100&&L.e22busy;i++)await L.sleep(30);L.$('#e22p1').click();for(let i=0;i<100&&L.e22busy;i++)await L.sleep(30);},
 run(L){
  const PRE=[['Disk dies on M2',S=>{S.down=1;S.place=[0,2,2];},'M2’s disk died. B1 and B2 still have copies on M1 and M3, so the scheduler runs m2 on M3 instead. The framework just reruns a failed task elsewhere. Same answer: WC 4, ED 2, WN 2, WS 1.'],
   ['Bramble & Bolt in every block',S=>{S.key='mer';},'Now the job counts scans per merchant on a flash-sale day (illustrative). Bramble &amp; Bolt’s pairs come from every block, and the hash sends all of them to R1: 9 of 12 pairs on one reducer. A very popular key piles up in one place (the next lesson deals with this).'],
   ['Three reducers',S=>{S.R=3;},'Linh sets 3 reduce tasks. The number of map tasks follows the input blocks; the number of reduce tasks is the job author’s choice. Keys spread differently, but each key still goes to exactly one reducer.']];
  const tried=new Set();L.e22busy=false;
  L.h(L.kick('pr','Edge cases')+'<h1 class="q">Push the board to its limits. Try at least two.</h1>'+CSS+
   '<div class="ux-ctl" id="e22o"></div><div class="ux-read" id="e22c">Pick a case. The job then runs from start to finish.</div><div id="e22b"></div>');
  const B=Board(L,L.$('#e22b'));
  PRE.forEach((p,j)=>{const b=document.createElement('button');b.className='chip';b.id='e22p'+j;b.textContent=p[0];
    b.onclick=async()=>{if(L.e22busy)return;L.e22busy=true;[...L.$('#e22o').children].forEach((x,k)=>x.classList.toggle('sel',k===j));
      B.reset();p[1](B.S);L.$('#e22c').innerHTML=p[2];
      const ok=await B.play(0,5,170);L.e22busy=false;if(!ok)return;tried.add(j);
      if(tried.size===2){L.sheet('info','Where the model bends','Replicated blocks let a task rerun near another copy, so one dead disk costs a little time, not the answer. Hashing guarantees one key meets at one reducer, which is exactly why a huge key can overload that reducer. And the reducer count is yours to choose.');L.done();}};
    L.$('#e22o').appendChild(b);});}},
{part:3,src:'Chapter 10 · Distributed execution of MapReduce',pts:1,
 solve:async L=>{L.$('#c23-0-0').click();L.$('#c23-1-2').click();L.$('#c23-2-0').click();L.$('#c23chk').click();},
 run(L){
  const CAP=[2,2,1],MB=256;let first=true,won=false;
  L.h(L.kick('pr','Challenge')+'<h1 class="q">M2’s disk has died. Place the three map tasks so no input block crosses the network, and no machine runs more than it has room for.</h1>'+CSS+
   '<div id="c23b"></div><div id="c23a" style="margin-top:8px"></div><div class="ux-read" id="c23r"></div><div class="ux-ctl"><button class="btn pri" id="c23chk">Run the map phase</button></div>');
  const B=Board(L,L.$('#c23b'),{only:'mach',cap:CAP});B.S.down=1;B.S.stage=1;B.S.place=[-1,-1,-1];B.draw();
  L.$('#c23a').innerHTML=[0,1,2].map(t=>'<div class="ux-asg"><span class="lb">m'+(t+1)+' reads B'+(t+1)+'</span>'+[0,1,2].map(m=>'<button class="chip" id="c23-'+t+'-'+m+'">M'+(m+1)+'</button>').join('')+'</div>').join('');
  const status=()=>{const P=B.S.place,probs=[];let net=0;
    [0,1,2].forEach(t=>{const m=P[t];if(m<0){probs.push('m'+(t+1)+' has no machine yet');return;}
      if(m===1)probs.push('m'+(t+1)+' is on M2, which is down');else if(!HOLD[m].includes(t)){net+=MB;probs.push('m'+(t+1)+' pulls B'+(t+1)+' over the network');}});
    [0,1,2].forEach(m=>{if(P.filter(x=>x===m).length>CAP[m])probs.push('M'+(m+1)+' is over capacity');});
    return {probs,net};};
  const upd=()=>{const s=status();L.$('#c23r').innerHTML='<b>Input copied over the network:</b> '+s.net+' MB <span class="small">(illustrative: '+MB+' MB per block)</span>'+(s.probs.length?'<div class="small" style="margin-top:4px;color:var(--no)">'+s.probs.join(' · ')+'</div>':'<div class="small" style="margin-top:4px;color:var(--ok)">Every task reads its block locally.</div>');};
  [0,1,2].forEach(t=>[0,1,2].forEach(m=>{L.$('#c23-'+t+'-'+m).onclick=()=>{if(won)return;B.S.place[t]=m;[0,1,2].forEach(k=>L.$('#c23-'+t+'-'+k).classList.toggle('sel',k===m));B.draw();upd();};}));
  upd();
  L.$('#c23chk').onclick=()=>{if(won)return;const s=status(),ok=s.probs.length===0;
    if(first){L.award(ok);first=false;}
    if(ok){won=true;L.sheet('ok','Computation near the data','m2 can only go to M3 (the one live copy of B2), which fills M3. So m3 goes to M1, the other home of B3, next to m1. The scheduler does this itself: it tries to run each map task on a machine holding a copy of its block, if that machine has spare memory and CPU.');L.done();}
    else L.sheet('no','Not yet','Fix the red items. Start with the task that has only one possible machine: which live machine still holds B2?');};}},
{part:3,src:'Chapter 10 · MapReduce workflows',run(L){
  L.h(L.kick('learn','Chaining jobs')+'<h1 class="q">Real batch work is a workflow of many jobs</h1>'+CSS+FIG_WF()+
   '<p class="ux-cap">Ranking needs a second sort, so a second job. Hadoop chains jobs into a '+L.g('workflow','workflow')+' only by directory name: each job writes all its output to files, while a Unix pipe streams lines through a small memory buffer.</p>');
  L.done();}},
{part:3,src:'Chapter 10 · MapReduce workflows',pts:1,
 solve:async L=>{L.$('#w25o').children[2].click();for(let i=0;i<120&&!L.$('#w25d');i++)await L.sleep(30);},
 run(L){
  let pick=null;
  const job=(x,a,b,c,id)=>RX(x,26,92,62,c)+T(x+46,44,a,{s:12.5,w:700,a:'middle'})+T(x+46,58,b,{s:11,a:'middle',c:'muted'});
  L.h(L.kick('pr','What should happen?')+'<h1 class="q">Linh’s job 1 crashes after writing 60% of its files to <span class="ux-m">/clean/scans</span>. Job 2 reads that directory. What should happen?</h1>'+CSS+
   '<div class="ux-fig"><svg viewBox="0 0 320 120" role="img" aria-label="Job 1 writes files into /clean/scans; job 2 reads them.">'+DEFS('mX')+
   job(4,'Job 1','clean scans','h2')+'<rect x="14" y="68" width="72" height="9" rx="4" style="fill:var(--card);stroke:var(--line2)"/><rect id="w25bar" x="14" y="68" width="0" height="9" rx="4" style="fill:var(--h2)"/>'+
   AR(98,57,114,57,'mX')+'<path d="M116 30 h28 l6 6 h56 v54 h-90 z" style="fill:var(--soft);stroke:var(--line2);stroke-width:2"/>'+T(161,20,'/clean/scans',{s:11,a:'middle',m:1})+
   Array.from({length:10},(x,i)=>'<rect id="w25f'+i+'" x="'+(123+(i%5)*16)+'" y="'+(44+Math.floor(i/5)*20)+'" width="12" height="15" rx="2" style="fill:var(--h2-bg);stroke:var(--h2);stroke-width:1.5;opacity:0"/>').join('')+
   AR(208,57,222,57,'mX')+job(224,'Job 2','on-time report','h3')+T(270,78,'not started',{s:11,a:'middle',w:700,id:'w25s'})+
   T(160,112,'',{s:11.5,a:'middle',w:700,id:'w25m'})+'</svg></div><div class="ux-ctl" id="w25o"></div><div id="w25x"></div>');
  const $=s=>L.$(s);
  const files=(n,st)=>{for(let i=0;i<10;i++){const f=$('#w25f'+i);if(!f)return;f.style.opacity=i<n?1:0;f.style.fill=st==='x'?'var(--no-bg)':'var(--h2-bg)';f.style.stroke=st==='x'?'var(--no)':'var(--h2)';}};
  const bar=(p,bad)=>{const b=$('#w25bar');if(b){b.setAttribute('width',72*p);b.style.fill=bad?'var(--no)':'var(--h2)';}};
  const msg=(t,c)=>{const m=$('#w25m');if(m){m.textContent=t;m.style.fill='var(--'+(c||'ink')+')';}};
  const st2=(t,c)=>{const m=$('#w25s');if(m){m.textContent=t;m.style.fill='var(--'+(c||'ink')+')';}};
  async function play(){
    st2('waiting','muted');
    for(let k=1;k<=6;k++){bar(k/10);files(k);msg('job 1 writing…');await L.sleep(90);if(!$('#w25bar'))return false;}
    bar(.6,1);msg('job 1 crashed at 60%','no');await L.sleep(450);if(!$('#w25bar'))return false;
    files(6,'x');msg('partial output: discarded','no');await L.sleep(450);if(!$('#w25bar'))return false;
    files(0);msg('job 1 reruns');
    for(let k=1;k<=10;k++){bar(k/10);files(k);await L.sleep(70);if(!$('#w25bar'))return false;}
    msg('job 1 succeeded: input complete','ok');st2('running','ok');return true;}
  ['Job 2 starts on the 60%, so the report is partly ready','Job 2 starts and fills the missing 40% from the Parcel DB','Job 2 waits; job 1’s partial files are discarded and it reruns'].forEach((t,j)=>{
    const b=document.createElement('button');b.className='chip';b.textContent=t;b.style.textAlign='left';
    b.onclick=async()=>{if(pick!==null)return;pick=j;b.classList.add('sel');[...L.$('#w25o').children].forEach(x=>{if(x!==b)x.setAttribute('aria-disabled','true');});
      const ok=j===2;L.award(ok);b.classList.add(ok?'ok':'no');L.$('#w25o').children[2].classList.add('ok');
      L.sheet(ok?'ok':'no',ok?'Only complete output counts':'Not quite',
       'A job’s output is valid only once the whole job has succeeded: MapReduce throws away a failed job’s partial output. So the scheduler holds job 2 until job 1 has run again and completed. Starting on 60% would build the report from only part of the day’s scans.');
      if(await play())L.$('#w25x').innerHTML='<span id="w25d"></span>';L.done();};
    L.$('#w25o').appendChild(b);});}},
{part:3,src:'Chapter 10 · MapReduce Job Execution',pts:6,run(L){
  L.h(L.kick('pr','Who does what?')+'<h1 class="q">In Linh’s count-per-hub job, who handles each part?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Linh writes it','The framework'],[
   ['Pull the hub name out of each scan record',0,'That is the mapper, Linh’s code.'],
   ['Sort all key-value pairs by key',1,'The sort is built in. Mapper output is always sorted before reducers see it.'],
   ['Decide how many reduce tasks the job uses',0,'The number of reduce tasks is set by the job’s author. The number of map tasks follows the input blocks.'],
   ['Run each map task on a machine that holds its block',1,'The scheduler places tasks near the data.'],
   ['Add up the scans for each hub',0,'That is the reducer, Linh’s code.'],
   ['Copy each mapper’s sorted files to the right reducer',1,'Partitioning, sorting and copying make up the shuffle, which the framework runs.']],
   'Linh writes the logic for one record and one key. The framework handles the parallelism and the data movement.');}}
  ]
});
