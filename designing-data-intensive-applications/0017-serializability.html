<script>
/* =====================================================================
   Lesson 0017 only. Three hands-on models used across the lesson:
   1. Ledger  – the Parcel DB's lock ledger: rows with shared (S) and
                exclusive (X) lock badges, a wait queue, a live wait-for
                graph with deadlock loops (2PL), and read markers,
                uncommitted versions and commit checks (SSI).
   2. Ribbon  – the single thread of a serial-execution database drawn
                over time: work, waits for the app, disk stalls and
                cross-partition lock-step.
   3. Bays    – the Westport hub's loading-bay board, showing which part
                a predicate lock or an index-range lock covers.
   ===================================================================== */
let FAST=false;                                   /* solvers switch animations off */
const nap=(L,ms)=>L.sleep(FAST?0:ms);
const alive=el=>!!(el&&el.isConnected);
const CSS='<style>'+

 '.sz-hd{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin:0 0 4px;display:flex;justify-content:space-between;gap:6px}'+

 'button.sz-tok:hover{border-color:var(--line2)}div.sz-tok{cursor:default}'+

 '.sz-tok.st-wait{background:var(--h3-bg)}.sz-tok.st-done{background:var(--ok-bg)}.sz-tok.st-abort{background:var(--no-bg)}'+
 '.sz-pp{display:flex;gap:3px;margin:2px 0}.sz-pp i{width:9px;height:9px;border-radius:3px;background:var(--soft2);border:1px solid var(--line2)}.sz-pp i.on{background:var(--ok-strong);border-color:var(--ok-strong)}'+

 '.sz-stats{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;font-size:13px}.sz-stats span{background:var(--soft);border-radius:99px;padding:3px 10px;font-weight:600;font-variant-numeric:tabular-nums}'+
 '.sz-svg{width:100%;display:block}svg text{font-family:var(--sans)}'+

 '.sz-lbl{font-size:13px;font-weight:600;color:var(--muted);margin:10px 0 4px}'+
 '.sz-key{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted);margin:6px 0}.sz-key span{display:inline-flex;align-items:center;gap:5px}.sz-key i{width:14px;height:10px;border-radius:3px;display:inline-block}'+

 '.sz-goals{list-style:none;margin:6px 0;padding:0}.sz-goals li{display:flex;gap:8px;align-items:center;font-size:14.5px;margin:4px 0;color:var(--muted)}'+

 '.sz-goals li.done{color:var(--ok)}.sz-goals li.done .bx{background:var(--ok-strong);border-color:var(--ok-strong);color:var(--card)}.sz-goals li .bx svg.i{width:13px;height:13px;stroke-width:3}'+
 '.sz-read{background:var(--soft);border-radius:12px;padding:8px 10px;font-size:14px;line-height:1.5;margin:8px 0}'+
 '.sz-tbl{width:100%;border-collapse:collapse;font-size:13.5px;margin:6px 0}.sz-tbl th{text-align:left;color:var(--muted);font-weight:600;padding:5px 4px;font-size:12.5px}.sz-tbl td{padding:6px 4px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}'+
 '.sz-grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}'+
 '.sz-cand{border:2px solid var(--line);border-radius:14px;padding:7px;min-width:0}.sz-cand .small{margin-top:5px}.sz-cand>b{font-size:13.5px;display:block;line-height:1.3;min-height:36px}'+
 '.sz-cand .sz-yn{display:flex;gap:5px;margin-top:5px}.sz-cand .sz-yn button{flex:1;min-height:38px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-size:13.5px;font-weight:600;padding:4px}'+
 '.sz-cand .sz-yn button.sel{border-color:var(--pri);background:var(--pri-bg);color:var(--pri-deep)}'+
 '.sz-cand.ok{border-color:var(--ok-line);background:var(--ok-bg)}.sz-cand.no{border-color:var(--no-line);background:var(--no-bg)}'+
 '.sz-wl{border:2px solid var(--line);border-radius:16px;padding:10px;margin:10px 0}.sz-wl h3{margin:0 0 4px;font-size:15.5px}'+
 '.sz-tr{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 6px}.sz-tr span{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;border-radius:8px;padding:3px 7px;background:var(--soft);color:var(--ink)}'+
 '.sz-tr span svg.i{width:14px;height:14px}.sz-tr span.hit{background:var(--no-bg);color:var(--no);outline:1.5px solid var(--no)}'+
 '.sz-dots{display:flex;gap:5px;margin:6px 0 2px;min-height:16px}.sz-dots i{width:16px;height:16px;border-radius:50%;display:inline-block}'+
 '.sz-why{font-size:13.5px;line-height:1.45;margin-top:4px}'+
 '.sz-mtx td.y{background:var(--ok-bg);color:var(--ok);font-weight:700;text-align:center}.sz-mtx td.n{background:var(--no-bg);color:var(--no);font-weight:700;text-align:center}.sz-mtx td.p{background:var(--h3-bg);color:var(--h3);font-weight:700;text-align:center}'+
 '.sz-mtx td{border:2px solid var(--card)}.sz-mtx th{text-align:center}.sz-mtx th:first-child,.sz-mtx td:first-child{text-align:left}'+
 '</style>';
const COL={h1:'h1',h2:'h2',h3:'h3',h4:'h4'};

/* ---------------- 1. LEDGER ----------------
   rows: [{k,label,v,fmt}]   txs: [{id,name,role,col,ops,at}]
   ops: {k:'r',rows,s,out} read · {k:'w',row,f,s,ok,no} write (f returns null = app decides not to write)
        {k:'t',s} work in the app · {k:'c',s} commit                                        */
const rd=(rows,s,out)=>({k:'r',rows,s,out});
const wr=(row,f,s,ok,no)=>({k:'w',row,f,s,ok,no});
const th=s=>({k:'t',s});
const cm=()=>({k:'c',s:'Commit'});
const places=v=>v+(v===1?' place':' places')+' left';
const duty=v=>v?'on duty':'off duty';
function slotRow(k,label,v){return {k,label,v,fmt:places,say:'slot '+label.slice(5)};}
function booking(id,name,role,col,slot,lab,at){
  return {id,name,role,col,at,ops:[rd([slot],'Check '+lab,v=>'sees '+places(v[slot])+' at '+lab),
    wr(slot,v=>v[slot]>0?v[slot]-1:null,'Book '+lab,'takes a place at '+lab,'finds '+lab+' full and books nothing'),cm()]};}
function endShift(id,name,col,role){
  return {id,name,role:role||'ends their shift',col,ops:[rd(['ravi','mia'],'Count on-duty couriers',v=>'counts '+(v.ravi+v.mia)+' on duty in W3'),
    wr(id==='R'?'ravi':'mia',v=>v.ravi+v.mia>=2?0:null,'End shift','goes off duty, not committed yet','refuses: W3 would have nobody on duty'),cm()]};}
const dutyRows=()=>[{k:'ravi',label:'Ravi · W3',v:1,fmt:duty,say:'Ravi’s row'},{k:'mia',label:'Mia · W3',v:1,fmt:duty,say:'Mia’s row'}];

function Ledger(L,host,o){
  const me={o};let S;
  const R=k=>S.rows.find(r=>r.k===k),T=id=>S.txs.find(t=>t.id===id);
  const cur=r=>r.com[r.com.length-1].v;
  const active=t=>t.state==='run'||t.state==='wait';
  me.reset=()=>{
    S=me.S={mode:o.mode,clock:1,tick:0,wseq:0,loop:null,msg:o.hello||'',kind:'',stats:{done:0,wait:0,aborts:0},
      rows:o.rows.map(r=>({k:r.k,label:r.label,say:r.say||r.label,fmt:r.fmt,com:[{v:r.v,ts:1,by:null}],pend:[],locks:{},reads:[]})),
      txs:o.txs.map((t,j)=>({id:t.id,name:t.name,role:t.role,col:t.col,ops:t.ops,at:t.at||0,j,pc:0,state:'new',view:{},rs:{},ign:{},warn:{},snap:0,tries:0,wt:0,cool:0,why:'',wrote:false}))};
    render();};
  function say(t,k){S.msg=t;S.kind=k||'';}
  function emit(e){if(o.on)o.on(e,me);}
  function visible(r,tx){const own=r.pend.find(p=>p.tx===tx.id);if(own)return own.v;
    if(S.mode==='ssi'){let v=r.com[0].v;r.com.forEach(c=>{if(c.ts<=tx.snap)v=c.v;});return v;}return cur(r);}
  function blockers(tx,r,m){return Object.keys(r.locks).filter(id=>id!==tx.id&&(m==='X'||r.locks[id]==='X'));}
  function names(ids){return ids.map(id=>T(id).name).join(' and ');}
  /* try the current op; true = done, false = must wait (2PL only) */
  function attempt(tx){
    const op=tx.ops[tx.pc];
    if(op.k==='r'){
      if(S.mode==='2pl'){
        for(const k of op.rows){const b=blockers(tx,R(k),'S');if(b.length){tx.want={k,m:'S',by:b};return false;}}
        op.rows.forEach(k=>{const r=R(k);if(!r.locks[tx.id])r.locks[tx.id]='S';});
      }else op.rows.forEach(k=>{const r=R(k);tx.rs[k]=1;if(!r.reads.includes(tx.id))r.reads.push(tx.id);
        const o2=r.pend.filter(p=>p.tx!==tx.id).map(p=>p.tx);if(o2.length)tx.ign[k]=o2;});
      op.rows.forEach(k=>{tx.view[k]=visible(R(k),tx);});return true;}
    if(op.k==='w'){
      const r=R(op.row);
      if(S.mode==='2pl'){const b=blockers(tx,r,'X');if(b.length){tx.want={k:op.row,m:'X',by:b};return false;}r.locks[tx.id]='X';}
      r.pend=r.pend.filter(p=>p.tx!==tx.id);r.pend.push({tx:tx.id,v:tx.nv});tx.view[op.row]=tx.nv;tx.wrote=true;
      if(S.mode==='ssi'){const hit=r.reads.filter(id=>id!==tx.id&&active(T(id)));hit.forEach(id=>{T(id).warn[op.row]=tx.id;});tx.trip=hit;}
      return true;}
    return true;}
  function opText(tx,op,pre){
    if(op.k==='r')return tx.name+' '+op.out(tx.view)+(S.mode==='2pl'?(pre?'.':' (shared lock'+(op.rows.length>1?'s':'')+' taken).'):' from its snapshot.');
    if(op.k==='w')return tx.name+' '+op.ok+(S.mode==='2pl'&&!pre?' (exclusive lock taken).':'.');
    return pre||'';}
  function cycleFrom(tx){
    const edges=t=>t.state==='wait'?blockers(t,R(t.want.k),t.want.m):[];
    const path=[];const seen=new Set();
    const dfs=id=>{if(id===tx.id&&path.length)return true;if(seen.has(id))return false;seen.add(id);path.push(id);
      for(const n of edges(T(id)))if(dfs(n))return true;path.pop();return false;};
    return dfs(tx.id)?path.slice():null;}
  function enterWait(tx){
    tx.state='wait';tx.ws=++S.wseq;
    const r=R(tx.want.k);
    say(tx.name+' must wait: '+names(tx.want.by)+' '+(tx.want.by.length>1?'hold':'holds')+' a lock on '+r.say+' that clashes with the '+(tx.want.m==='X'?'exclusive':'shared')+' lock '+tx.name+' needs.','wait');
    if(o.auto)S.stats.wait++;emit({type:'wait',tx});
    const cyc=cycleFrom(tx);
    if(cyc){S.loop=cyc.slice();const msg='Deadlock: '+cyc.map((id,i)=>T(id).name+' waits for '+T(cyc[(i+1)%cyc.length]).name).join(', and ')+'. The database aborts '+tx.name+' so the rest can move.';
      emit({type:'deadlock',tx,cyc});abort(tx,'deadlock',msg);}
  }
  function finish(tx,state){
    S.rows.forEach(r=>{delete r.locks[tx.id];r.reads=r.reads.filter(id=>id!==tx.id);r.pend=r.pend.filter(p=>p.tx!==tx.id);});
    tx.state=state;tx.want=null;wake();}
  function abort(tx,kind,msg){
    tx.why=kind;S.stats.aborts++;tx.cool=1;say(msg,'no');finish(tx,'abort');emit({type:'abort',tx,kind});}
  function wake(){
    const ws=S.txs.filter(t=>t.state==='wait').sort((a,b)=>a.ws-b.ws);
    ws.forEach(t=>{if(attempt(t)){const op=t.ops[t.pc];t.state='run';t.pc++;
      S.granted=(S.granted||0)+1;S.msg+=' Now '+t.name+' gets its lock and '+opText(t,op,1).replace(t.name+' ','');emit({type:'grant',tx:t});}});}
  function commit(tx){
    const mine=S.rows.filter(r=>r.pend.some(p=>p.tx===tx.id));
    if(S.mode==='ssi'&&mine.length){
      for(const k of Object.keys(tx.rs)){const r=R(k);const c=r.com.find(c=>c.ts>tx.snap&&c.by&&c.by!==tx.id);
        if(c){const stale=(tx.ign[k]||[]).includes(c.by),w=T(c.by).name;
          abort(tx,stale?'stale':'trip',stale?
            'Commit check fails for '+tx.name+'. When '+tx.name+' read '+r.say+', '+w+'’s change was already there but not committed, so the snapshot skipped it. '+w+' has committed since, so '+tx.name+'’s premise is stale. Aborted.':
            'Commit check fails for '+tx.name+'. '+w+' wrote '+r.say+' after '+tx.name+' read it (the tripwire went off), and '+w+' committed first. '+tx.name+'’s premise is stale. Aborted.');
          return;}}}
    S.clock++;mine.forEach(r=>{const p=r.pend.find(p=>p.tx===tx.id);r.com.push({v:p.v,ts:S.clock,by:tx.id});});
    const ro=!mine.length;S.stats.done++;
    say(tx.name+' commits'+(ro?' (it wrote nothing)':'')+'.'+(S.mode==='2pl'?' All '+tx.name+'’s locks are released.':(ro?' Read-only, so no check is needed.':' No write it depended on changed: the check passes.')),'ok');
    finish(tx,'done');emit({type:'commit',tx,ro});}
  function step(tx,auto){
    if(tx.state==='done')return false;
    if(tx.state==='wait'){say(tx.name+' is still waiting for '+names(tx.want.by)+'.','wait');return false;}
    if(tx.state==='abort'&&!o.retry)return false;
    if(tx.state==='new'||tx.state==='abort'){if(tx.state==='abort')tx.tries++;tx.state='run';tx.pc=0;tx.view={};tx.rs={};tx.ign={};tx.warn={};tx.wrote=false;tx.snap=S.clock;S.loop=null;}
    const op=tx.ops[tx.pc];
    if(op.k==='t'){tx.pc++;say(tx.name+': '+op.s+'.','');}
    else if(op.k==='r'){if(attempt(tx)){tx.pc++;say((tx.tries&&tx.pc===1?tx.name+' retries. ':'')+opText(tx,op)+
        (S.mode==='ssi'&&op.rows.some(k=>tx.ign[k])?' It skips '+names([...new Set(op.rows.flatMap(k=>tx.ign[k]||[]))])+'’s uncommitted change, and the database notes that.':''),'');}else enterWait(tx);}
    else if(op.k==='w'){const nv=op.f(tx.view);
      if(nv===null){tx.pc++;tx.refused=true;say(tx.name+' '+op.no+'.','');}
      else{tx.nv=nv;if(attempt(tx)){tx.pc++;say(opText(tx,op)+(S.mode==='ssi'&&tx.trip&&tx.trip.length?' The write trips '+names(tx.trip)+'’s read marker: their premise may be out of date.':''),'');emit({type:'write',tx});}else enterWait(tx);}}
    else if(op.k==='c')commit(tx);
    return true;}
  me.tap=id=>{const tx=T(id);if(!tx)return;S.loop=null;step(tx);render();emit({type:'step',tx});};
  me.finished=()=>S.txs.every(t=>t.state==='done'||(t.state==='abort'&&!o.retry));
  /* auto mode: one op per transaction per tick */
  me.run=async ms=>{
    for(let g=0;g<70&&!me.finished();g++){
      if(!alive(host))return false;S.tick++;
      for(const tx of S.txs){if(S.tick<=tx.at)continue;
        if(tx.state==='wait'){tx.wt++;S.stats.wait++;continue;}
        if(tx.state==='abort'&&tx.cool>0){tx.cool--;continue;}
        step(tx,true);}
      render();await nap(L,ms);}
    return alive(host);};
  function status(t){
    if(t.state==='new')return t.at&&S.tick<=t.at&&o.auto?'Not started':'Next: '+t.ops[0].s;
    if(t.state==='run')return 'Next: '+t.ops[t.pc].s;
    if(t.state==='wait')return '<b>Waiting</b> for '+names(t.want.by);
    if(t.state==='done')return '<b>Committed</b>'+(t.refused?' · changed nothing':'')+(t.tries?' · after '+t.tries+' retr'+(t.tries>1?'ies':'y'):'');
    return '<b>Aborted</b>'+(t.why==='deadlock'?' (deadlock)':'')+(o.retry&&!o.auto?' · tap to retry':o.retry?' · retrying':'');}
  function wfGraph(){
    const tx=S.txs;const n=tx.length,W=300,y=40,xs=tx.map((t,j)=>Math.round(W/(n+1)*(j+1))+10);
    const loop=S.loop||[];const inLoop=(a,b)=>{const i=loop.indexOf(a);return i>=0&&loop[(i+1)%loop.length]===b;};
    let e='';tx.forEach((t,j)=>{const by=t.state==='wait'?blockers(t,R(t.want.k),t.want.m):[];
      const targets=by.map(id=>({id,red:false}));
      if(loop.length&&loop.includes(t.id)){const nx=loop[(loop.indexOf(t.id)+1)%loop.length];if(!by.includes(nx))targets.push({id:nx,red:true});}
      targets.forEach(tg=>{const k=tx.findIndex(u=>u.id===tg.id),x1=xs[j],x2=xs[k],up=x2>x1?-1:1,red=tg.red||inLoop(t.id,tg.id);
        const sx=x1+(x2>x1?14:-14),ex=x2+(x2>x1?-17:17),cy=y+up*34;
        e+='<path d="M'+sx+' '+(y+up*6)+' Q'+((x1+x2)/2)+' '+cy+' '+ex+' '+(y+up*6)+'" style="fill:none;stroke:'+(red?'var(--no)':'var(--h3)')+';stroke-width:2.2'+(tg.red?';stroke-dasharray:4 3':'')+'" marker-end="url(#'+o.id+(red?'-mr':'-ma')+')"/>';});});
    const nodes=tx.map((t,j)=>'<circle cx="'+xs[j]+'" cy="'+y+'" r="14" style="fill:var(--'+t.col+'-bg);stroke:var(--'+t.col+');stroke-width:2"/><text x="'+xs[j]+'" y="'+(y+4.5)+'" style="font-size:12.5px;font-weight:700;text-anchor:middle;fill:var(--'+t.col+')">'+t.name.slice(0,2)+'</text>').join('');
    const any=e!=='';
    return '<svg class="sz-svg" viewBox="0 0 320 84" role="img" aria-label="Wait-for graph: an arrow from A to B means A waits for B.">'+
      '<defs><marker id="'+o.id+'-ma" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--h3)"/></marker>'+
      '<marker id="'+o.id+'-mr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--no)"/></marker></defs>'+
      e+nodes+(any?'':'<text x="160" y="78" style="font-size:12px;fill:var(--faint);text-anchor:middle">nobody is waiting</text>')+
      (loop.length?'<text x="160" y="80" style="font-size:12.5px;font-weight:700;fill:var(--no);text-anchor:middle">deadlock loop</text>':'')+'</svg>';}
  function render(){
    if(!alive(host))return;
    const ic=L.ic;
    let h='<div class="sz-led"><div class="sz-hd"><span>'+(o.title||'Parcel DB')+'</span><span>'+(S.mode==='2pl'?'2PL':'SSI')+'</span></div><div>';
    S.rows.forEach(r=>{let b='';
      if(S.mode==='2pl'){
        Object.keys(r.locks).forEach(id=>{const t=T(id);b+='<span class="sz-b '+t.col+'c"><i>'+r.locks[id]+'</i>'+t.name+'</span>';});
        S.txs.filter(t=>t.state==='wait'&&t.want.k===r.k).forEach(t=>{b+='<span class="sz-b q '+t.col+'c">'+ic('clock')+t.name+' wants '+t.want.m+'</span>';});
      }else r.reads.forEach(id=>{const t=T(id);const tr=Object.keys(t.warn).length&&t.warn[r.k];b+='<span class="sz-b '+(tr?'trip':t.col+'c')+'">'+ic(tr?'alert':'eye')+t.name+' read'+'</span>';});
      r.pend.forEach(p=>{const t=T(p.tx);b+='<span class="sz-b pv '+t.col+'c">'+ic('pencil')+t.name+': '+(r.fmt===duty?duty(p.v):p.v+' left')+' · uncommitted</span>';});
      h+='<div class="sz-row"><div class="sz-rl"><b>'+r.label+'</b><span>'+r.fmt(cur(r))+'</span></div><div class="sz-bs">'+(b||'<span class="sz-none">'+(S.mode==='2pl'?'no locks':'no readers')+'</span>')+'</div></div>';});
    h+='</div>';
    if(S.mode==='2pl'&&o.graph!==false)h+='<div class="sz-hd" style="margin-top:6px;border-top:1px solid var(--line);padding-top:6px"><span>Who waits for whom</span></div>'+wfGraph();
    h+='</div>';
    const tag=(o.auto||o.static)?'div':'button';
    h+='<div class="sz-toks">'+S.txs.map(t=>'<'+tag+' class="sz-tok '+t.col+'t st-'+t.state+'" id="'+o.id+'-t-'+t.id+'"'+((o.auto||o.static)?'':' aria-label="Step '+t.name+'"')+'><b>'+t.name+'</b><small>'+t.role+'</small>'+
      '<span class="sz-pp">'+t.ops.map((x,k)=>'<i class="'+((t.state==='done'||k<t.pc)&&t.state!=='new'&&t.state!=='abort'?'on':'')+'"></i>').join('')+'</span><span class="sz-ts">'+status(t)+'</span></'+tag+'>').join('')+'</div>';
    h+='<div class="sz-msg '+S.kind+'" aria-live="polite">'+(S.msg||'&nbsp;')+'</div>';
    if(o.stats!==false)h+='<div class="sz-stats"><span>Committed '+S.stats.done+'</span><span>'+(o.auto?'Ticks spent waiting ':'Times made to wait ')+(o.auto?S.stats.wait:S.txs.reduce((a,t)=>a+(t.waits||0),0))+'</span><span>Aborted '+S.stats.aborts+'</span></div>';
    host.innerHTML=h;

  /* count manual waits per transaction */
  const on0=o.on;o.on=(e,m)=>{if(e.type==='wait'&&!o.auto)e.tx.waits=(e.tx.waits||0)+1;if(on0)on0(e,m);};

/* ---------------- 2. RIBBON ----------------
   The single thread (one lane per partition) over a 60-unit window.
   mode 'inter' = statements with round trips to the app; 'proc' = stored procedure.
   pre: '' | 'cross' (every 6th transaction spans all partitions) | 'disk' | 'slow'           */
function ribbonPlan(c){
  const W=60,P=c.p,free=Array(P).fill(0),lanes=[...Array(P)].map(()=>[]);let rr=0,done=0,work=0;
  for(let i=0;i<110;i++){
    let segs=c.mode==='inter'?[['w',1],['g',4],['w',1],['g',4],['w',1]]:[['w',3]];
    if(i===1&&c.pre==='disk')segs=[['w',1],['d',22],['w',2]];
    if(i===1&&c.pre==='slow')segs=[['w',24]];
    const cross=c.pre==='cross'&&i%6===4&&P>1;
    if(cross){const st=Math.max(...free);
      lanes.forEach((ln,l)=>{if(st>free[l])ln.push({a:free[l],b:st,k:'s',i});ln.push({a:st,b:st+9,k:'x',i});free[l]=st+9;});
      if(st+9<=W)done++;continue;}
    const l=rr%P;rr++;let t=free[l];const q=lanes[l].filter(b=>b.k!=='s').length;
    segs.forEach(s=>{lanes[l].push({a:t,b:t+s[1],k:s[0],i:q});t+=s[1];});free[l]=t;if(t<=W)done++;}
  lanes.forEach(ln=>ln.forEach(b=>{if((b.k==='w')&&b.a<W)work+=Math.min(b.b,W)-b.a;if(b.k==='x'&&b.a<W)work+=Math.max(0,Math.min(b.a+3,W)-b.a);}));
  return {lanes,done,busy:Math.round(work/(P*W)*100),W};}
function ribbonSVG(c,id){
  const p=ribbonPlan(c),x0=30,sc=(316-x0)/p.W,lh=c.p>2?22:28,top=8,H=top+lh*c.p+30;
  const fill={w:'var(--ok-strong)',g:'var(--soft2)',d:'var(--h3)',x:'var(--h4)',s:'var(--no-bg)'};
  let s='<svg class="sz-svg" viewBox="0 0 320 '+H+'" role="img" aria-label="The database thread over time: '+p.done+' transactions finished in the window."><defs><clipPath id="'+id+'-cp"><rect id="'+id+'-cr" x="0" y="0" width="'+(FAST?320:x0)+'" height="'+H+'"/></clipPath></defs>';
  for(let l=0;l<c.p;l++){const y=top+l*lh;
    s+='<text x="2" y="'+(y+lh/2+4)+'" style="font-size:12px;font-weight:600;fill:var(--muted)">'+(c.p>1?'P'+(l+1):'thr')+'</text>'+
       '<rect x="'+x0+'" y="'+(y+2)+'" width="'+(p.W*sc)+'" height="'+(lh-6)+'" rx="4" style="fill:var(--soft)"/>';}
  s+='<g clip-path="url(#'+id+'-cp)">';
  p.lanes.forEach((ln,l)=>{const y=top+l*lh;ln.forEach(b=>{if(b.a>=p.W)return;const xa=x0+b.a*sc,xb=x0+Math.min(b.b,p.W)*sc;
    s+='<rect x="'+(xa+.5).toFixed(1)+'" y="'+(y+2)+'" width="'+Math.max(1,xb-xa-1).toFixed(1)+'" height="'+(lh-6)+'" rx="2" style="fill:'+fill[b.k]+(b.k==='g'?';stroke:var(--line2);stroke-width:1':'')+(b.k==='s'?';stroke:var(--no-line);stroke-dasharray:3 2;stroke-width:1':'')+(b.k==='w'&&b.i%2?';opacity:.72':'')+'"/>';});});
  s+='</g>';
  const ay=top+lh*c.p+4;
  s+='<path d="M'+x0+' '+ay+'h'+(p.W*sc)+'" style="stroke:var(--line2);stroke-width:1.2"/>';
  [0,20,40,60].forEach(t=>{const x=x0+t*sc;s+='<path d="M'+x+' '+ay+'v4" style="stroke:var(--line2)"/><text x="'+x+'" y="'+(ay+16)+'" style="font-size:12px;fill:var(--muted);text-anchor:'+(t===0?'start':t===60?'end':'middle')+'">'+t+' ms</text>';});
  s+='</svg>';
  return {svg:s,done:p.done,busy:p.busy};}
function ribbonAnimate(id){
  const r=document.getElementById(id+'-cr');if(!r)return Promise.resolve();
  if(FAST){r.setAttribute('width',320);return Promise.resolve();}
  return new Promise(res=>{const t0=performance.now();const f=t=>{if(!r.isConnected){res();return;}const k=Math.min(1,(t-t0)/900);r.setAttribute('width',30+k*290);if(k<1)requestAnimationFrame(f);else res();};requestAnimationFrame(f);});}
const RKEY='<div class="sz-key"><span><i style="background:var(--ok-strong)"></i>working</span><span><i style="background:var(--soft2);border:1px solid var(--line2)"></i>waiting for the app</span>'+
  '<span><i style="background:var(--h3)"></i>waiting for disk</span><span><i style="background:var(--h4)"></i>cross-partition</span><span><i style="background:var(--no-bg);border:1px dashed var(--no-line)"></i>stalled</span></div>';

/* ---------------- 3. BAY BOARD ----------------
   Westport hub loading bays 1-4 × 15-minute windows 08:30-10:15.                          */
const BT=['08:30','08:45','09:00','09:15','09:30','09:45','10:00','10:15'];
const BX=44,BW=34,BY=22,BH=27;
const EXIST=[[1,2,4],[4,0,1],[3,6,7]];
const LOCKS={row:null,pred:[3,3,2,3],bay:[3,3,0,7],time:[1,4,2,3],table:[1,4,0,7]};
const INS=[{b:3,c:3,who:'Ana',t:'bay 3 at 09:15'},{b:3,c:0,who:'Ravi',t:'bay 3 at 08:30'},{b:2,c:2,who:'Mia',t:'bay 2 at 09:00'}];
function inBox(bx,b,c){return !!bx&&b>=bx[0]&&b<=bx[1]&&c>=bx[2]&&c<=bx[3];}
function bayBoard(o){
  const H=o.mini?BY+4*BH+4:BY+4*BH+8;
  let s='<svg class="sz-svg" viewBox="0 0 320 '+H+'" role="img" aria-label="'+(o.aria||'Loading-bay board')+'">';
  if(!o.mini)[0,2,4,6].forEach(c=>{s+='<text x="'+(BX+c*BW+2)+'" y="14" style="font-size:12px;fill:var(--muted)">'+BT[c]+'</text>';});
  for(let b=1;b<=4;b++){const y=BY+(b-1)*BH;
    if(!o.mini)s+='<text x="2" y="'+(y+BH/2+4)+'" style="font-size:12px;font-weight:600;fill:var(--muted)">Bay '+b+'</text>';

  EXIST.forEach(e=>{const y=BY+(e[0]-1)*BH;s+='<rect x="'+(BX+e[1]*BW+2)+'" y="'+(y+4)+'" width="'+((e[2]-e[1]+1)*BW-4)+'" height="'+(BH-8)+'" rx="4" style="fill:var(--line2)"/>'+
    (o.mini?'':'<text x="'+(BX+e[1]*BW+8)+'" y="'+(y+BH/2+4)+'" style="font-size:12px;fill:var(--ink)">booked</text>');});
  if(o.lock){const k=o.lock;s+='<rect x="'+(BX+k[2]*BW-1)+'" y="'+(BY+(k[0]-1)*BH-1)+'" width="'+((k[3]-k[2]+1)*BW+2)+'" height="'+((k[1]-k[0]+1)*BH+2)+'" rx="5" style="fill:var(--h3);fill-opacity:.28;stroke:var(--h3);stroke-width:2.5"/>';}
  if(o.lockCells)o.lockCells.forEach(e=>{const y=BY+(e[0]-1)*BH;s+='<rect x="'+(BX+e[1]*BW)+'" y="'+y+'" width="'+((e[2]-e[1]+1)*BW)+'" height="'+BH+'" rx="5" style="fill:var(--h3);fill-opacity:.28;stroke:var(--h3);stroke-width:2.5"/>';});
  if(o.pred!==false){const y=BY+2*BH;s+='<rect x="'+(BX+2*BW+3)+'" y="'+(y+3)+'" width="'+(2*BW-6)+'" height="'+(BH-6)+'" rx="4" style="fill:none;stroke:var(--pri);stroke-width:2;stroke-dasharray:4 3"/>';}
  (o.ins||[]).forEach((n,j)=>{const x=BX+n.c*BW+BW/2,y=BY+(n.b-1)*BH+BH/2;
    const col=n.res==='wait'?'var(--h3)':n.res==='bad'?'var(--no)':n.res==='ok'?'var(--ok-strong)':'var(--pri)';
    s+='<circle cx="'+x+'" cy="'+y+'" r="10" style="fill:'+col+';stroke:var(--card);stroke-width:2"/><text x="'+x+'" y="'+(y+4)+'" style="font-size:12px;font-weight:700;fill:var(--card);text-anchor:middle">'+(j+1)+'</text>';});
  return s+'</svg>';}

/* small helpers */
function goals(id,items){return '<ul class="sz-goals" id="'+id+'">'+items.map(t=>'<li><span class="bx"></span><span>'+t+'</span></li>').join('')+'</ul>';}
function tick(id,k){const li=document.querySelectorAll('#'+id+' li')[k];if(li&&!li.classList.contains('done')){li.classList.add('done');li.querySelector('.bx').innerHTML='<svg class="i" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';}}

Course.lesson({
  id:'0017', title:'Serializability', minutes:22, icon:'lock',
  goals:['Explain the three ways databases reach serializability: one at a time, two-phase locking and SSI','Predict when each one makes transactions wait, abort or stall, and where it breaks','Match each race condition to the weakest isolation level that stops it'],
  parts:['One at a time','Two-phase locking','Optimistic: SSI','Pick a method'],
  read:'Read the “Serializability” section and the summary of chapter 7, with Figures 7-9 to 7-11 on stored procedures and on how SSI spots stale premises.',
  glossary:{
    serializable:'Serializable isolation: the strongest level. Transactions may run at the same time, but the outcome matches running them one at a time.',
    'stored-proc':'Stored procedure: transaction code handed to the database ahead of time, so the database runs the whole thing in one go instead of waiting for the app between steps.',
    deadlock:'Deadlock: transaction A waits for a lock held by B while B waits for a lock held by A. Neither can move until the database aborts one of them.',
    'predicate-lock':'Predicate lock: a lock on every row that matches a search condition, including rows that don’t exist yet.',
    'index-range':'Index-range lock (next-key lock): a cheaper stand-in for a predicate lock. It locks a wider range in an index, such as a whole room or a whole time window.',
    ssi:'Serializable snapshot isolation (SSI): transactions read from a snapshot and never wait for locks. At commit, the database aborts any transaction whose reads have gone out of date.',
    contention:'Contention: many transactions wanting the same rows at the same time.',
    'write-skew':'Write skew: two transactions read the same data, each decides it is safe to go ahead, and each writes something different. Together they break a rule neither broke alone.'
  },
  cheatsheet:[
    '<b>Serializable</b>: the result is as if transactions ran one at a time. If each transaction is correct alone, they stay correct together.',
    '<b>Actual serial execution</b>: one thread, data in memory, whole transactions sent as stored procedures. Transactions must be short; throughput is one CPU core per partition; cross-partition transactions are slow.',
    '<b>Two-phase locking</b>: shared locks to read, exclusive locks to write, all held until commit. Readers and writers block each other. Safe, but slow, with unstable high-percentile latency and frequent deadlocks.',
    '<b>Predicate locks</b> also cover rows that don’t exist yet (phantoms). In practice databases use <b>index-range locks</b>: wider, cheaper approximations.',
    '2PL (two-phase locking) has nothing to do with 2PC (two-phase commit).',
    '<b>SSI</b> is optimistic: read from a snapshot without blocking, then abort at commit if the premise changed. Keep read-write transactions short; it suffers under high contention.',
    'Weakest level that stops each race: dirty reads and writes → read committed; read skew → snapshot isolation; lost updates → some snapshot implementations or a lock; write skew → serializable only.'
  ],
  steps:[
/* ---------- PART 1: ONE AT A TIME ---------- */
{part:0,src:'Warm-up',pts:1,run(L){

   'One at a time means no races at all. That’s the simplest road to serializability, and the first one in this lesson.',

{part:0,src:'Chapter 7 · Serializability',run(L){

   '<rect x="164" y="68" width="142" height="42" rx="9" style="fill:var(--h1-bg)"/><text x="174" y="86" style="font-size:12px;font-weight:700;fill:var(--h1)">Short OLTP work</text><text x="174" y="102" style="font-size:12px;fill:var(--h1)">a few reads and writes</text>'+
   '<text x="14" y="128" style="font-size:12px;font-weight:600;fill:var(--muted)">Long read-only reports: off to the side</text>'+

{part:0,src:'Chapter 7 · Actual Serial Execution · Encapsulating transactions in stored procedures',

{part:0,src:'Chapter 7 · Actual Serial Execution · Partitioning',
 solve:async L=>{FAST=true;L.$('#rp6').children[2].click();await L.sleep(10);L.$('#rq6').children[1].click();await L.sleep(10);L.$('#rq6').children[2].click();await L.sleep(10);L.$('#rq6').children[0].click();await L.sleep(10);FAST=false;},
 run(L){
  let p=1,pre='';
  L.h(L.kick('pr','Edge cases · where serial breaks')+'<h1 class="q">Give each partition its own thread. Then find what stalls them.</h1>'+CSS+
   '<div id="rv6"></div>'+RKEY+'<div class="sz-read" id="rr6" aria-live="polite"></div>'+
   '<div class="sz-lbl">Partitions, one thread each</div><div class="sz-ctl" id="rp6"></div><div class="sz-lbl">Workload</div><div class="sz-ctl" id="rq6"></div>'+
   goals('g6',['Scale to 4 partitions with the normal workload','Add cross-partition bookings with 4 partitions','Stall a thread with a disk read or a slow transaction']));
  const NOTE={'':'Each transaction touches one partition, so each thread runs on its own core and throughput grows with the cores.',
   cross:'A cross-partition transaction must run in lock-step on every partition: all threads stall until each is free, then pay for coordination.',
   disk:'One transaction needs data that isn’t in memory. Its thread sits idle for the disk, and everything queued behind it waits.',
   slow:'One slow transaction holds its thread, and every transaction queued behind it stalls.'};
  function draw(){
    const r=ribbonSVG({p,mode:'proc',pre},'r6');L.$('#rv6').innerHTML=r.svg;ribbonAnimate('r6');
    L.$('#rr6').innerHTML='<b>'+r.done+' transactions</b> finished in 60 ms on '+p+' thread'+(p>1?'s':'')+'. '+(pre==='cross'&&p===1?'With one partition nothing is cross-partition yet. Add partitions.':NOTE[pre])+' <span class="small">(Illustrative.)</span>';

    if(allTicked('g6')&&!L.$('#g6d')){L.$('#g6').insertAdjacentHTML('afterend','<span id="g6d"></span>');
      L.sheet('info','Serial execution has hard limits','It works when every transaction is small and fast, the active data fits in memory, and writes fit on one core, or partition cleanly. VoltDB reports about 1,000 cross-partition writes a second, far below its single-partition speed, and more machines don’t help. Key-value data partitions easily; data with many secondary indexes needs a lot of cross-partition work.');L.done();}}
  chips(L.$('#rp6'),['1','2','4'],j=>{p=[1,2,4][j];draw();},0);
  chips(L.$('#rq6'),['Normal','Cross-partition','Not in memory','One slow one'],j=>{pre=['','cross','disk','slow'][j];draw();},0);
  draw();}},

{part:1,src:'Chapter 7 · Two-Phase Locking (2PL) · Implementation of two-phase locking',run(L){
  const cell=(x,y,ok,t)=>'<rect x="'+x+'" y="'+y+'" width="50" height="36" rx="7" style="fill:var(--'+(ok?'ok':'h3')+'-bg);stroke:var(--'+(ok?'ok-line':'h3')+');stroke-width:1.5"/><text x="'+(x+25)+'" y="'+(y+23)+'" style="font-size:12.5px;font-weight:700;fill:var(--'+(ok?'ok':'h3')+');text-anchor:middle">'+t+'</text>';
  L.h(L.kick('learn','The classic method')+'<h1 class="q">Two-phase locking: share to read, alone to write, hold to the end</h1>'+CSS+
   '<svg class="sz-svg" viewBox="0 0 320 196" role="img" aria-label="Lock rules: a read can share with a read; every other pair waits. Locks pile up while the transaction runs and are all released at commit.">'+
   '<text x="62" y="14" style="font-size:12px;font-weight:600;fill:var(--muted)">You want to…</text>'+
   '<text x="89" y="32" style="font-size:12px;font-weight:700;fill:var(--ink);text-anchor:middle">read (S)</text><text x="143" y="32" style="font-size:12px;font-weight:700;fill:var(--ink);text-anchor:middle">write (X)</text>'+
   '<text x="4" y="58" style="font-size:12px;fill:var(--muted)">Other has</text><text x="4" y="72" style="font-size:12px;font-weight:700;fill:var(--ink)">S</text>'+
   '<text x="4" y="100" style="font-size:12px;fill:var(--muted)">Other has</text><text x="4" y="114" style="font-size:12px;font-weight:700;fill:var(--ink)">X</text>'+
   cell(64,40,1,'share')+cell(118,40,0,'wait')+cell(64,82,0,'wait')+cell(118,82,0,'wait')+
   '<text x="4" y="140" style="font-size:12px;fill:var(--muted)">Read, then write?</text><text x="4" y="155" style="font-size:12px;fill:var(--muted)">Upgrade S to X, same rule.</text>'+
   '<text x="186" y="14" style="font-size:12px;font-weight:600;fill:var(--muted)">Locks held</text>'+
   '<path d="M186 22V150H316" style="fill:none;stroke:var(--line2);stroke-width:1.5"/>'+
   '<path d="M188 150V128H210V106H232V84H254V62H276V40H290V150Z" style="fill:var(--h1-bg);stroke:var(--h1);stroke-width:2"/>'+
   '<path d="M290 40V150" style="stroke:var(--no);stroke-width:2.5"/><text x="296" y="36" style="font-size:12px;font-weight:700;fill:var(--no);text-anchor:middle">commit</text>'+
   '<text x="188" y="168" style="font-size:12px;fill:var(--h1)">1 · take locks as it runs</text><text x="316" y="184" style="font-size:12px;fill:var(--no);text-anchor:end">2 · release all at once</text></svg>'+
   '<p class="sz-cap">Readers may share a lock; a writer needs the object alone. Every lock stays until commit or abort. So readers block writers and writers block readers: the opposite of snapshot isolation. In return, every race is stopped, '+L.g('write-skew','write skew')+' included.</p>'+
   '<div class="sz-tags"><span>The standard for ~30 years</span><span>Serializable in MySQL (InnoDB), SQL Server</span><span>Repeatable read in DB2</span><span>2PL is not 2PC (chapter 9)</span></div>');
  L.done();}},
{part:1,src:'Chapter 7 · Two-Phase Locking (2PL)',
 solve:async L=>{const g=L.led;['L','L','T','T','L','L','T'].forEach(id=>g.tap(id));await L.sleep(20);},
 run(L){
  L.h(L.kick('ex','Explore · the lock ledger')+'<h1 class="q">Tap a transaction to run its next step. Make someone wait for a lock, then let them through.</h1>'+CSS+
   '<p class="small" style="margin:0">S = shared lock (for reading). X = exclusive lock (for writing). Try: Linh reads 09:30, then Tobias books 09:30.</p><div id="led9"></div>'+
   '<button class="btn" id="led9r" style="margin-top:8px">'+L.ic('cycle')+'Reset</button>');
  let got=false;
  const g=L.led=Ledger(L,L.$('#led9'),{id:'l9',mode:'2pl',title:'Delivery slots',
    rows:[slotRow('s0900','Slot 09:00',3),slotRow('s0930','Slot 09:30',1),slotRow('s1000','Slot 10:00',2)],
    txs:[{id:'L',name:'Linh',role:'report, reads every slot',col:'h3',ops:[rd(['s0900'],'Read 09:00',v=>'reads '+places(v.s0900)+' at 09:00'),rd(['s0930'],'Read 09:30',v=>'reads '+places(v.s0930)+' at 09:30'),rd(['s1000'],'Read 10:00',v=>'reads '+places(v.s1000)+' at 10:00'),cm()]},
      booking('T','Tobias','test booking','h4','s0930','09:30'),booking('A','Ada','Pip & Thistle booking','h1','s0930','09:30')],
    hello:'Nobody holds a lock yet.',
    on:(e)=>{if(got)return;
      if(e.type==='grant'||e.type==='deadlock'){got=true;
        setTimeout(()=>{if(!alive(L.$('#led9')))return;
          L.sheet('info',e.type==='grant'?'You just saw 2PL’s core rule':'You even found a deadlock',
           e.type==='grant'?'The writer needed the row alone, but a reader held a shared lock on it. It waited until that reader committed, which released all its locks at once. Under 2PL readers block writers, and the wait has no time limit.':
           'Two transactions each held a shared lock and each needed the other to let go before upgrading to exclusive. The database broke the loop by aborting one. More on deadlocks soon.');L.done();},30);}}});
  L.$('#led9r').onclick=()=>g.reset();}},
{part:1,src:'Chapter 7 · Two-Phase Locking (2PL) · Performance of two-phase locking',pts:1,
 solve:async L=>{FAST=true;L.$('#p10').children[1].click();for(let i=0;i<100&&!L.$('#p10d');i++)await L.sleep(20);FAST=false;},
 run(L){
  let pick=null;
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">Linh’s report has read every slot under 2PL and is still running. Tobias’s booking wants to write 09:30. What happens?</h1>'+CSS+
   '<div class="sz-ctl" id="p10" style="flex-direction:column;align-items:stretch"></div><div id="led10"></div><div id="p10x"></div>');
  const g=L.led=Ledger(L,L.$('#led10'),{id:'l10',mode:'2pl',static:true,title:'Delivery slots',
    rows:[slotRow('s0900','Slot 09:00',3),slotRow('s0930','Slot 09:30',2),slotRow('s1000','Slot 10:00',2)],
    txs:[{id:'L',name:'Linh',role:'long report',col:'h3',ops:[rd(['s0900','s0930','s1000'],'Read every slot',v=>'reads all three slots'),th('Total the places'),th('Format the report'),cm()]},
      booking('T','Tobias','booking','h4','s0930','09:30')]});
  g.tap('L');g.S.msg='Linh holds shared locks on every slot and keeps working. Pick your prediction to run it.';g.render();
  ['Tobias writes now; Linh keeps the old value','Tobias waits until Linh commits','Linh is aborted so Tobias goes first'].forEach((t,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=t;
    b.onclick=async()=>{if(pick!==null)return;pick=j;b.classList.add('sel');
      for(const id of ['T','T','L','L','L','T']){await nap(L,430);if(!alive(L.$('#led10')))return;g.tap(id);}
      const ok=j===1;L.award(ok);L.$('#p10x').innerHTML='<span id="p10d"></span>';
      L.sheet(ok?'ok':'no',ok?'Right: the writer waits':'It waited',
       'Linh held a shared lock on 09:30, so Tobias’s exclusive lock had to wait, with no old version to fall back on and no abort. Only Linh’s commit released the locks. That’s why long transactions hurt under 2PL: one reader can hold up every writer.');L.done();};
    L.$('#p10').appendChild(b);});}},

{part:1,src:'Chapter 7 · Two-Phase Locking (2PL) · Implementation of two-phase locking',
 solve:async L=>{const g=L.led;['R','M','R','M'].forEach(id=>g.tap(id));for(let k=0;k<8&&!g.finished();k++){const t=g.S.txs.find(t=>t.state==='run'||t.state==='abort'||t.state==='new');if(t)g.tap(t.id);}await L.sleep(20);},
 run(L){
  let dead=false,fin=false;
  L.h(L.kick('ex','See it happen · deadlock')+'<h1 class="q">Zone W3 must keep one courier on duty. Ravi and Mia end their shifts at once. Interleave their steps.</h1>'+CSS+
   '<p class="small" style="margin:0">Each app counts who is on duty and ends the shift only if 2 are on. Try Ravi, Mia, Ravi, Mia.</p><div id="led12"></div>'+
   '<button class="btn" id="led12r" style="margin-top:8px">'+L.ic('cycle')+'Reset</button>');
  const g=L.led=Ledger(L,L.$('#led12'),{id:'l12',mode:'2pl',retry:true,title:'Couriers on duty',rows:dutyRows(),
    txs:[endShift('R','Ravi','h1'),endShift('M','Mia','h2')],hello:'Both are on duty.',
    on:(e,m)=>{if(e.type==='deadlock')dead=true;
      if(e.type==='step'&&m.finished()&&!fin){
        if(!dead){m.S.msg+=' No collision this time: one ran before the other. Reset and interleave them.';m.render();return;}
        fin=true;setTimeout(()=>{if(!alive(L.$('#led12')))return;
          L.sheet('info','Deadlock caught, write skew stopped','Both held shared locks on both rows, then each needed an exclusive lock the other was sharing. The database spotted the '+L.g('deadlock','deadlock')+' loop and aborted one. Its app retried, now counted 1 on duty, and refused. Deadlocks happen far more often under 2PL than under read committed, and each one throws work away.');L.done();},30);}}});
  L.$('#led12r').onclick=()=>{dead=false;g.reset();};}},
{part:1,src:'Chapter 7 · Two-Phase Locking (2PL) · Performance of two-phase locking',run(L){

{part:1,src:'Chapter 7 · Two-Phase Locking (2PL) · Predicate locks',
 solve:async L=>{FAST=true;for(let j=0;j<5;j++){L.$('#bl14').children[j].click();await L.sleep(15);}FAST=false;},
 run(L){
  const tried=new Set();let busy=false;
  const NAMES=['Row locks only','Predicate lock','Index-range: bay 3','Index-range: 09:00–09:30','Whole table'],KEYS=['row','pred','bay','time','table'];
  const COST={row:'Nothing matched Joss’s search, so there was no row to lock. Ana’s booking slips in: a phantom double-books bay 3.',
   pred:'Exact: only the real clash waits. But every write is checked against every predicate lock held, which gets slow with many locks.',
   bay:'Cheap: one shared lock on the bay-3 entry of an index on bay. Safe, but Ravi’s 08:30 booking waits for no reason.',
   time:'Cheap: one shared lock on the 09:00–09:30 range of an index on time. Safe, but Mia’s bay-2 booking waits for no reason.',
   table:'The fallback when no index fits: safe, but every booking in the table waits.'};
  L.h(L.kick('ex','Explore · phantoms')+'<h1 class="q">Joss searched bay 3 for 09:00–09:30 (dashed box), found nothing, and is about to book. Pick the lock the database holds.</h1>'+CSS+
   '<div id="bb14">'+bayBoard({ins:INS})+'</div>'+
   '<div class="sz-key"><span><i style="background:var(--h3);opacity:.5"></i>locked area</span><span><i style="background:var(--line2)"></i>booked</span><span><i style="background:var(--ok-strong)"></i>goes ahead</span><span><i style="background:var(--h3)"></i>waits</span><span><i style="background:var(--no)"></i>double booking</span></div>'+
   '<div class="sz-ctl" id="bl14"></div><div class="sz-read" id="br14" aria-live="polite">Three bookings arrive while Joss’s transaction runs: <b>1</b> Ana, bay 3 at 09:15 (a real clash) · <b>2</b> Ravi, bay 3 at 08:30 · <b>3</b> Mia, bay 2 at 09:00.</div>');
  chips(L.$('#bl14'),NAMES,async j=>{if(busy)return;busy=true;const k=KEYS[j],lk=LOCKS[k];
    const ins=INS.map(n=>({...n}));L.$('#bb14').innerHTML=bayBoard({lock:lk,ins});await nap(L,380);if(!alive(L.$('#bb14'))){return;}
    const res=ins.map((n,i)=>{const bl=inBox(lk,n.b,n.c);n.res=bl?'wait':(i===0?'bad':'ok');return n;});
    L.$('#bb14').innerHTML=bayBoard({lock:lk,ins:res});
    const word=n=>n.res==='wait'?'<b style="color:var(--h3)">waits</b>':n.res==='bad'?'<b style="color:var(--no)">double-books!</b>':'<b style="color:var(--ok)">goes ahead</b>';
    L.$('#br14').innerHTML='<b>'+NAMES[j]+'.</b> '+res.map((n,i)=>(i+1)+' '+n.who+' '+word(n)).join(' · ')+'<br>'+COST[k];
    tried.add(k);busy=false;
    if(tried.has('row')&&tried.has('pred')&&(tried.has('bay')||tried.has('time'))&&!L.$('#bb14d')){L.$('#bl14').insertAdjacentHTML('afterend','<span id="bb14d"></span>');
      L.sheet('info','Lock what doesn’t exist yet','A '+L.g('predicate-lock','predicate lock')+' covers every row matching a search, even rows not inserted yet, so 2PL with predicate locks stops phantoms and all write skew. Checking many of them is slow, so most 2PL databases use '+L.g('index-range','index-range locks')+' (next-key locks): lock a bigger area that’s cheap to check. Any write matching the search also hits the bigger area.<br><br>No index to hang the range lock on? The database falls back to a shared lock on the <b>whole table</b>: still safe, but every other writer to that table waits.');L.done();}});}},
{part:1,src:'Chapter 7 · Two-Phase Locking (2PL) · Index-range locks',pts:1,
 solve:async L=>{const A=[0,1,0,1,1];A.forEach((a,i)=>{L.$('#c15-'+i).querySelectorAll('.sz-yn button')[a?0:1].click();});L.$('#c15go').click();},
 run(L){
  const C=[['Bay 3, 09:00–09:15',{lockCells:[[3,2,2]]},0,'It misses 09:15–09:30, so a clashing booking there gets through.'],
   ['Bay 3, all morning',{lock:[3,3,0,7]},1,'Bigger than the search, so any clash hits it: the index-on-bay version.'],
   ['Only the bookings that exist now',{lockCells:[[1,2,4],[4,0,1],[3,6,7]]},0,'The danger is a <i>new</i> row. Locking existing rows can’t stop a phantom.'],
   ['All bays, 09:00–09:30',{lock:[1,4,2,3]},1,'Bigger than the search: the index-on-time version.'],
   ['Bays 2–4, 08:45–09:45',{lock:[2,4,1,5]},1,'Odd, but it fully covers the search, so it’s safe. It just blocks more than needed.']];
  const ans=Array(C.length).fill(null);let first=true;
  L.h(L.kick('pr','Challenge · safe stand-ins')+'<h1 class="q">The database can’t lock Joss’s exact search cheaply. Which of these locks are safe stand-ins for it?</h1>'+CSS+
   '<p class="small" style="margin:0">Dashed box = Joss’s search. Shaded = what would be locked.</p><div class="sz-grid2" id="c15"></div><button class="btn pri" id="c15go" disabled>'+L.ic('check')+'Check</button>');
  C.forEach((c,i)=>{const d=document.createElement('div');d.className='sz-cand';d.id='c15-'+i;
    d.innerHTML=bayBoard(Object.assign({mini:true,aria:c[0]},c[1]))+'<b>'+c[0]+'</b><div class="sz-yn"><button>Safe</button><button>Not safe</button></div><div class="small" style="line-height:1.4"></div>';
    const bs=d.querySelectorAll('.sz-yn button');bs.forEach((b,k)=>b.onclick=()=>{if(!first)return;ans[i]=k===0?1:0;bs.forEach(x=>x.classList.toggle('sel',x===b));L.$('#c15go').disabled=ans.includes(null);});
    L.$('#c15').appendChild(d);});
  L.$('#c15go').onclick=()=>{if(!first||ans.includes(null))return;first=false;L.$('#c15go').disabled=true;
    let n=0;C.forEach((c,i)=>{const ok=ans[i]===c[2];if(ok)n++;const d=L.$('#c15-'+i);d.classList.add(ok?'ok':'no');d.querySelector('.small').innerHTML=(c[2]?'<b>Safe.</b> ':'<b>Not safe.</b> ')+c[3];});
    const all=n===C.length;L.award(all);
    L.sheet(all?'ok':'no',all?'All five right':n+' of 5 right','The rule: a stand-in is safe only if it covers <b>everything</b> the search covers, including rows that don’t exist yet. Bigger is safe but blocks more; smaller or “existing rows only” lets phantoms through.');L.done();};}},

{part:2,src:'Chapter 7 · Serializable Snapshot Isolation (SSI) · Pessimistic versus optimistic concurrency control',run(L){

   '<svg class="sz-svg" viewBox="0 0 320 196" role="img" aria-label="Pessimistic: a transaction waits at a lock gate. Optimistic: transactions run straight to a commit check; one passes, one is sent back to retry.">'+
   '<text x="8" y="16" style="font-size:12.5px;font-weight:700;fill:var(--h4)">Pessimistic · 2PL</text>'+

   '<text x="10" y="76" style="font-size:12px;fill:var(--h3)">T2 waits until it’s safe</text>'+

   '<path d="M10 144H310" style="stroke:var(--line2);stroke-width:3"/>'+
   '<path d="M232 128L248 144L232 160L216 144Z" style="fill:var(--h2-bg);stroke:var(--h2);stroke-width:2"/><text x="232" y="122" style="font-size:12px;fill:var(--h2);text-anchor:middle">commit check</text>'+
   dot(286,144,'ok','T1')+dot(150,144,'no','T2')+

   '<text x="10" y="188" style="font-size:12px;fill:var(--no)">premise changed: abort, retry</text><text x="310" y="170" style="font-size:12px;fill:var(--ok);text-anchor:end">commits</text></svg>'+

{part:2,src:'Chapter 7 · Serializable Snapshot Isolation (SSI) · Decisions based on an outdated premise',

{part:2,src:'Chapter 7 · Serializable Snapshot Isolation (SSI) · Detecting stale MVCC reads',pts:1,

{part:2,src:'Chapter 7 · Serializable Snapshot Isolation (SSI) · Performance of serializable snapshot isolation',run(L){

   '<text x="8" y="14" style="font-size:12px;font-weight:600;fill:var(--muted)">How finely to track who read and wrote what</text>'+

   '<div class="sz-grid2">'+tile('lock','Vs 2PL: no lock waits, steady latency','ok')+tile('eye','Read-only queries take no locks','ok')+
     tile('trend','Vs serial: not capped at one core','ok')+tile('clock','Long read-write transactions tend to abort','no')+'</div>'+
   '<p class="sz-cap">So keep read-write transactions short. SSI is probably less hurt by slow transactions than 2PL or serial execution.</p>');

{part:2,src:'Chapter 7 · Serializable Snapshot Isolation (SSI) · Performance of serializable snapshot isolation',
 solve:async L=>{FAST=true;for(let j=0;j<5;j++){L.$('#e20').children[j].click();for(let k=0;k<200&&L.busy20;k++)await L.sleep(10);}FAST=false;},
 run(L){

    b.onclick=async()=>{if(L.busy20)return;L.busy20=true;[...L.$('#e20').children].forEach(x=>x.classList.toggle('sel',x===b));
      const g=Ledger(L,L.$('#led20'),{id:'l20',mode:p[1],auto:true,retry:true,graph:p[1]==='2pl',title:p[0],rows:p[2](),txs:p[3](),hello:'Running…'});

{part:3,src:'Chapter 7 · Serializability',pts:3,
 solve:async L=>{FAST=true;[0,2,1].forEach((m,w)=>L.$('#w21-'+w).querySelectorAll('.sz-ctl .chip')[m].click());L.$('#w21go').click();for(let i=0;i<100&&!L.$('#w21d');i++)await L.sleep(20);FAST=false;},
 run(L){
  const M=['One at a time','2PL','SSI'];
  const W=[
   {t:'Flash sale on Bramble & Bolt’s credit',tr:[['clock','Short transactions'],['box','All data in memory'],['layers','One partition each'],['trend','Fits one core'],['flame','Hundreds hit the same balance']],
    r:[[1,null,[8,0,0],'One at a time there are no locks and no aborts. Tiny in-memory transactions drain the queue fast.'],
       [0,4,[4,3,1],'Everyone queues for the same row lock and some deadlock, so p99 swings.'],
       [0,4,[3,0,5],'High contention: most premises go stale, so most commits abort and retry.']]},

    r:[[0,1,[3,5,0],'Cross-partition bookings run in lock-step, and one core can’t keep up.'],
       [0,0,[2,6,0],'Reports hold shared locks on everything they read, so bookings wait until each report ends.'],
       [1,null,[8,0,0],'Reports read a snapshot with no locks, little contention keeps aborts rare, and it isn’t capped at one core.']]},
   {t:'Dispatch app that chats with the database',tr:[['chat','App sends one statement at a time'],['clock','Short transactions'],['leaf','Little contention']],
    r:[[0,0,[2,6,0],'The lone thread would sit idle during every network round trip.'],
       [1,null,[8,0,0],'Little contention, so locks rarely make anyone wait.'],
       [1,null,[8,0,0],'Little contention, so aborts are rare and nobody waits.']]}];
  const pick=[null,null,null];let first=true,busy=false;

      const dots=d.querySelector('.sz-dots');dots.innerHTML='';const seq=[].concat(Array(r[2][0]).fill('var(--ok-strong)'),Array(r[2][1]).fill('var(--h3)'),Array(r[2][2]).fill('var(--no)'));

{part:3,src:'Chapter 7 · Summary',pts:5,
 solve:async L=>{const s=L.$('#lv22');for(const a of [0,1,2,0,2]){s.value=a;s.dispatchEvent(new Event('input'));L.$('#lv22go').click();await L.sleep(15);}for(let i=0;i<50&&!L.$('#lv22d');i++)await L.sleep(20);},
 run(L){
  const LV=['Read committed','Snapshot isolation','Serializable'],WC=['h1','h2','ok'];
  const RACES=[['Dirty reads','yyy'],['Dirty writes','yyy'],['Read skew','nyy'],['Lost updates','npy'],['Write skew','nny'],['Phantom write skew','nny']];
  const NOTE=['Read committed: you only see committed data, and a writer waits for an uncommitted write. Anything that reads twice, or decides from a read, can still race.',
   'Snapshot isolation: each transaction reads one consistent snapshot. Some databases catch lost updates on their own; others need a manual lock.',
   'Serializable: the result is as if transactions ran one at a time, so every race on this list stops.'];
  const BUGS=[['A dashboard shows a parcel from a booking that later aborts.',0,'a dirty read. Read committed stops it.'],
   ['Linh’s backup mixes data from before and after a transfer.',1,'read skew. A consistent snapshot fixes it.'],
   ['The last two couriers in a zone both end their shifts.',2,'write skew. Only serializable catches it on its own.'],
   ['Two claims overwrite each other’s uncommitted parcel writes.',0,'dirty writes. Read committed makes the second writer wait.'],
   ['Two dispatchers book the same loading bay and time at once.',2,'write skew through a phantom: each inserted a row the other’s check never saw.']];
  let lv=0,b=0,right=0;
  L.h(L.kick('pr','Challenge · the weakest level')+'<h1 class="q">Slide the isolation level and watch which races get through. Then set the weakest level that stops each Otterpost bug.</h1>'+CSS+
   '<div class="sz-led" style="padding:6px 8px" id="mx22"></div>'+
   '<label class="sz-lbl" for="lv22" style="display:block">Isolation level: <b id="lv22v" style="color:var(--ink)"></b></label>'+
   '<input type="range" id="lv22" min="0" max="2" step="1" value="0" style="width:100%;accent-color:var(--pri);min-height:36px" aria-describedby="lv22n">'+
   '<div class="sz-read" id="lv22n" aria-live="polite" style="margin-top:4px"></div>'+
   '<div class="sz-wl" id="bug22"><h3 id="bug22h"></h3><div class="sz-why" id="bug22t" style="font-size:15px;margin:0 0 8px"></div>'+
   '<button class="btn pri" id="lv22go">'+L.ic('check')+'Lock in this level</button><div class="sz-dots" id="bug22o"></div><div class="sz-why" id="bug22f" aria-live="polite"></div></div>');
  function draw(){
    const c=WC[lv],top=22,rh=25,H=top+RACES.length*rh+4,wx=152;
