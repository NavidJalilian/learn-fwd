<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paths from Here</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0020', title:'Paths from here', minutes:20, icon:'tree',
  goals:['Compare the paths onward from a staff role, from staying put to changing careers','Weigh a move into management, or a new employer, with the book’s cautions','Start a new role as a beginner again, and take the responsibility of software seriously'],
  parts:['Staying','New shapes','Leaving','Reset'],
  read:'Read the end of chapter 9 for the full stories of the people who took each path, and the book’s closing words.',
  glossary:{
    'pendulum':'Engineer/manager pendulum: Charity Majors’s idea of deliberately switching between management and hands-on engineering every few years.',
    'rebound-job':'Rebound job: a job picked mainly to escape your current one, which often isn’t a good long-term choice.',
    'downleveling':'Downleveling: joining a new company at a lower title or level than you had before.',
    'niche':'Niche role: a role shaped around your specific strengths, sometimes one you design yourself with your company.'
  },
  cheatsheet:[
    '<b>Keep doing it</b> if it gives you what you need, but keep learning enough to stay current.',
    '<b>Promotion</b>: ask what you really want from the next level, and how promotion works where you are.',
    '<b>Work less</b>, <b>change teams</b>, <b>build a new specialty</b> or <b>explore</b>: all ways to change without leaving.',
    '<b>Management</b> is a change of profession, not a promotion. Learn one thing at a time; commit about two years.',
    '<b>Find or invent a niche</b> shaped like you. Beware the fancy role you’d hate doing.',
    'Leaving? Avoid a <b>rebound job</b>, ask what “staff” means there, and don’t treat title as the gate. Startups and independence need a cash cushion and a network.',
    '<b>Prepare to reset</b>: your maps are out of date. Listen, learn the shadow org chart, assume past choices had reasons.',
    '<b>Take software seriously.</b> What senior people do sets the culture for the industry.'
  ],
  steps:[
/* ---------- PART 1: STAYING ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Quinn’s feed is full of “Excited to share my new role!” posts. Quinn’s job still gives them what they need. Does Quinn need to move to keep growing?</h1>');
  L.mc(L.card,['Not if the job still gives them what they need','Yes, staying in one job too long looks bad'],0,
   'The book stresses this: if your job gives you what you need, there’s no need to change anything. The new-job posts can make you feel otherwise.',
   'The book pushes back on that pressure. If the job is giving you what you need, staying is a perfectly good path.');}},
{part:0,src:'Chapter 9 · Keep Doing What You’re Doing',run(L){
  L.h(L.kick('learn','Stay, or work toward promotion')+'<h1 class="q">Two paths that don’t need a new job</h1>'+
   L.lanes([['home','Keep doing it','In a growing niche you might learn for decades in one team. Or you may just want to use your skills until you retire. Either way, keep learning a little: tech, norms and even leadership styles go out of date.',1],
            ['trend','Work toward promotion','A higher level brings pay and credibility, and it feels nice. But ask what you really want: money, scope, respect, a seat in “the room”? Make sure the level gives you that.',2]])+
   L.list([['Learn how promotion works','A director? A committee? Are there limits on how many people can hold the level, or a need for a big enough project?'],
     ['Ask for help','Talk to your manager. Ask people at the next level how they got there.'],
     ['Use the right bar','Aim for the impact they had when <i>they</i> were promoted, not what they do now.']],3));
  L.done();}},
{part:0,src:'Chapter 9 · Work Less',run(L){
  L.h(L.kick('learn','Work less')+'<h1 class="q">Success can mean fewer hours</h1>'+
   L.prose('Jens Rantil swapped a staff role for 80% time and 20% less pay at a smaller company, and loved it. Going part-time is often the first time people put a price on their free time. Remember a pay cut also hits retirement savings.')+
   L.list([['clock','Choose which hours go','It’s easy to drop focus time and keep the meetings. That may not make you happy, or deliver what your manager needs. And if you already worked overtime on five days, why will four be different?'],
     ['chat','Agree it with your manager','Say if you still want promotion or interesting projects. Agree on on-call, holiday weeks and sick days.'],
     ['people','Expect some pushback','Your team keeps the same headcount, so less of you is less for them. Still, you may get a lot done in less time.']],2));
  L.done();}},
{part:0,src:'Chapter 9 · Work Toward Promotion',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Quinn says, “I want to be a principal engineer.” What should Quinn ask themselves first?</h1>');
  L.mc(L.card,['Who else at Usherly is going for it','What exactly they want that the level brings','How fast the last principal got promoted'],1,
   'Is it the level, or scope, money, respect, a seat in the room? If the level won’t bring that, the new title will feel flat.',
   'Rivals and speed don’t tell Quinn whether the level is worth it. The book says to unpack the wish first: what are you really after?');}},
{part:0,src:'Chapter 9 · Work Less',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Following the book’s advice?',['Yes','Not quite'],[
   ['Saskia moves to four days, and agrees with Wren how on-call and holiday weeks will work.',0,'Agreeing on specific situations like on-call is exactly what the book suggests.'],
   ['Lucia goes to four days but keeps every meeting and drops all focus time.',1,'Dropping focus time is the easy cut, but it may not make Lucia happy or deliver results.'],
   ['Hollis studies what the two latest principals did to get promoted, not what they do today.',0,'The bar is the impact they had when they were promoted.'],
   ['Greta plans to stay in Box Office until retirement and stops learning anything new.',1,'Staying is fine, but even then you need to keep learning a little to stay current.']]);}},

/* ---------- PART 2: NEW SHAPES ---------- */
{part:1,src:'Chapter 9 · Change Teams',run(L){
  L.h(L.kick('learn','Change shape without leaving')+'<h1 class="q">Four ways to make a fresh start where you are. Tap each.</h1>');
  L.flips(L.card,[
   ['Change teams','You keep context, relationships, credibility and social capital, but start fresh. Like a skilled player starting a new character: you’ll level up fast. You also become a bridge between teams.'],
   ['Build a new specialty','Learn something next door to what you know, or something brand new. Interesting things happen on the boundaries. It might even mean a new track, such as product management.'],
   ['Explore','Rotations, short gigs, embedding with a team. One engineer tried three very different teams over two years, then stayed with the one that fit.'],
   ['Find or invent a niche','Look for a role “shaped like you.” Beware one that sounds made for you but exhausts you to imagine, especially if it’s fancy. You can even design one with your manager.']],
   'Designing your own role? Leadership coach Fabianna Tassini suggests about 70% work that gives you energy and 30% things you want to get better at.');}},
{part:1,src:'Chapter 9 · Take a Management Role',run(L){
  L.h(L.kick('learn','Management')+'<h1 class="q">Not a promotion: a different profession</h1>'+
   L.prose('Charity Majors’s '+L.g('pendulum','engineer/manager pendulum')+': move between management and hands-on work every few years. Each builds skills that help the other, with no change in status either way. But you can only really improve at one at a time.')+
   L.list([['Hybrid roles','Will Larson: a mix of manager and engineer can work if you already have solid experience in both. He advises against <i>starting</i> a management career in one.'],
     ['First reports','Reasons to try: a future goal needs it, decisions only reach managers where you are, or you’ve topped out the ladder.'],
     ['Start small','Amanda Walker advises line management before managing managers. It’s easier to coach a sport you’ve played.'],
     ['Commit','Majors suggests a two-year minimum. Learning takes over a year, and switching managers often hurts the team. Expect to do far less technical work.']],4));
  L.done();}},
{part:1,src:'Chapter 9 · Take on Reports for the First Time',run(L){
  L.h(L.kick('ex','Quinn weighs Ezra’s offer')+'<h1 class="q">Should Quinn become a manager now?</h1>');
  L.beats(L.card,[
   ['The offer','Ezra is forming a new team to own the on-sale waiting room, and asks if Quinn would manage it, “and stay its tech lead too.”'],
   ['Against the list','Learning a lot: yes, management is a whole new profession. Making a difference: yes. Thursday evenings: probably fine.'],
   ['The hybrid','Quinn has never managed anyone. Both Larson and Majors would warn against starting a management career in a hybrid role.'],
   ['The two-year test','Could Quinn commit two full years and give up most hands-on work? Right now, Quinn wants to finish the on-sale strategy and grow toward principal. Honest answer: not yet.'],
   ['The answer','Quinn tells Ezra: “Not now. Ask me again in a year or two. I’d rather try management properly than half-try it next to tech lead.”']],
   'The pendulum stays open. Saying “not now” to a two-year commitment you can’t make is fairer to the team you’d manage.');}},
{part:1,src:'Chapter 9 · Take a Management Role',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Why does the book treat moving into management as a change of profession?</h1>');
  L.mc(L.card,['It needs different skills that take time to learn','It is always a step up in status and pay','It means you can never return to engineering'],0,
   'New skills, a learning curve of more than a year, and a commitment to the people who report to you.',
   'Majors says there should be no change in status either way, and the pendulum means you <i>can</i> come back. It’s a change because the skills are different.');}},
{part:1,src:'Chapter 9 · Find or Invent Your Own Niche',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which path fits best?',['Change teams','New specialty','Explore','Invent a niche'],[
   ['Lucia loves Usherly but is restless after five years on mobile. Platform has an opening.',0,'An internal move keeps Lucia’s context and relationships, with a fresh start.'],
   ['Bao has no idea which kind of team suits them next, and Usherly runs six-month rotations.',2,'A rotation lets Bao try several teams before choosing.'],
   ['Hollis knows payments and wants to learn machine learning for fraud: a boundary few people cover.',1,'Adding a new field next to an existing one is building a new specialty.'],
   ['Odile proposes a role advising every product team on event-page speed: mostly what they love, partly what they want to learn.',3,'Shaping a role with leadership around your strengths is inventing a niche.']]);}},

/* ---------- PART 3: LEAVING ---------- */
{part:2,src:'Chapter 9 · Do the Same Job for a Different Employer',run(L){
  L.h(L.kick('learn','Changing employers')+'<h1 class="q">Same level, up a level, or down a level</h1>'+
   L.list([['arrow','Same job, new employer','A new size, stack, domain or culture can fill gaps. Avoid a '+L.g('rebound-job','rebound job')+' picked just to escape. Ask what “staff” means to them: it varies a lot. Remember you’re interviewing them too.'],
     ['trend','Up a level','Sometimes easier than a promotion where you are, or the only option if there’s no room. Easier if you already know their domain. Check the industry really sees it as a step up.'],
     ['down','Down a level','Bigger companies often '+L.g('downleveling','downlevel')+', sometimes with no pay cut. It can mean more hands-on work, and learning from people more senior than you. Making title a gate limits your options.']],1));
  L.done();}},
{part:2,src:'Chapter 9 · Set Up Your Own Startup',run(L){
  L.h(L.kick('learn','Bigger leaps')+'<h1 class="q">Startup, independent, or a new career</h1>'+
   L.list([['flame','Start a company','One engineer met a cofounder through local investor communities, then quit to start in earnest. Build a cash safety net first: he wouldn’t have risked it without one.'],
     ['person','Go independent','Consulting, contracting, indie apps, training. The prize is freedom. But it relies on a strong network and constant marketing, often pays less with more stress, and you wear every hat.'],
     ['leaf','Change careers','Education, policy, research, or something new. One staff engineer left to run a retreat for programmers in the mountains, now cooking pancakes instead of code.']],3));
  L.done();}},
{part:2,src:'Chapter 9 · Do the Same Job for a Different Employer',run(L){
  L.h(L.kick('ex','Noa decides to leave')+'<h1 class="q">How Noa avoids a rebound</h1>');
  L.beats(L.card,[
   ['The pull','Noa has wanted to work on rail signalling systems for years, a field Usherly will never need. That’s a mismatch.'],
   ['The trap','A recruiter mail arrives: “Principal at a ticketing startup, just like now!” It would be an escape, and Noa nearly replies. It’s a rebound job.'],
   ['Taking time','Instead Noa spends three months talking to engineers in rail software, using Noa’s network from conference talks.'],
   ['Asking questions','At each interview Noa asks: “What does a principal do here? What would my job be?” Two companies can’t really say.'],
   ['The choice','Noa accepts a principal role at a company that builds train signalling software, where the role is clear.']],
   'Noa picked a destination, not an exit. Next: Noa has to start over as a beginner.');}},
{part:2,src:'Chapter 9 · Do the Same Job for a Different Employer',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Mika is miserable after a rough quarter and wants to accept the first offer that arrives. What’s the book’s warning?</h1>');
  L.mc(L.card,['A first offer always pays less than later ones','Leaving after a rough quarter looks unreliable','The opposite of misery isn’t the same as a good fit'],2,
   'That’s Molly Graham’s rebound-job warning: it gets you out, but often isn’t the healthy long-term choice. Take your time.',
   'The book’s worry isn’t pay or looks. It’s that a job chosen just to escape is often not the right one. Take time and know what you want.');}},
{part:2,src:'Chapter 9 · Change Employers and Go Down a Level',pts:4,run(L){
  L.h(L.kick('pr','Match the advice')+'<h1 class="q">Four Usherly colleagues are each weighing a move someday. Which advice fits each?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Build a cash cushion','Build your network first','Don’t gate on title','Know their domain'],[
   ['Tomas wants to quit and cofound a company with a friend.',0,'A startup means time without much income. Savings make the risk bearable.'],
   ['Saskia wants to go independent as a reliability consultant.',1,'Independent work depends on people already knowing what you can do.'],
   ['Greta is offered a senior (not staff) role at a much bigger company, with lots to learn.',2,'Refusing anything below your title shrinks your options. Downleveling can be a good move.'],
   ['Callum wants a level up at a health-care company, a field they know nothing about.',3,'Going up a level is easier where you already know the domain. Learning both at once is a harder sell.']],
   'Every path has trade-offs. The book’s advice is to know them and accept them before you jump.');}},

/* ---------- PART 4: RESET ---------- */
{part:3,src:'Chapter 9 · Prepare to Reset',run(L){
  L.h(L.kick('learn','Prepare to reset')+'<h1 class="q">In a new job, all your maps are out of date</h1>'+
   L.flow([['map','Locator map','Rebuild your perspective','',1],['compass','Topographical map','Relearn culture and terrain','',2],['star','Treasure map','Find where they’re heading','',3]])+
   L.prose('Engineer Cindy Sridharan warns that new senior leaders often try to remake the new organization in the image of the old one, and fail more often than those who learn its ways first.')+
   L.list([['Listen first','Talk to as many people as you can. Find the right rooms and learn the shadow org chart.'],
     ['Be humble','Solve some problems, but assume past technical choices had good reasons.'],
     ['Ask what’s important','Figure out what matters here, and how to level up the engineers around you.']],2)+
   '<p class="small" style="margin-top:10px">And enjoy a quiet calendar while it lasts.</p>');
  L.done();}},
{part:3,src:'Chapter 9 · Prepare to Reset',pts:1,
 solve:async L=>{['a1','a3','a5'].forEach(id=>L.$('#'+id).click());L.$('#ck').click();},
 run(L){
  const A=[['a0','Replace their deploy tool with a Runway clone','no'],['a1','Have coffee with fifteen people across teams','ok'],['a2','Announce a new architecture vision in week one','no'],
    ['a3','Ask why the old signalling service was built that way','ok'],['a4','Run every meeting the way Usherly did','no'],['a5','Find out who people check with before decisions','ok']];
  const sel=new Set();let done=false;
  L.h(L.kick('pr','See it happen')+'<h1 class="q">It’s Noa’s first month in the new job. Pick the three moves the book would recommend.</h1><div id="ac" style="display:flex;flex-wrap:wrap;gap:8px"></div>'+
   '<button class="btn pri" id="ck" style="margin-top:14px" disabled>'+L.ic('check')+'Check my three</button><div id="ar"></div>');
  A.forEach(a=>{const b=document.createElement('button');b.className='chip';b.id=a[0];b.textContent=a[1];
    b.onclick=()=>{if(done)return;if(sel.has(a[0])){sel.delete(a[0]);b.classList.remove('sel');}else if(sel.size<3){sel.add(a[0]);b.classList.add('sel');}L.$('#ck').disabled=sel.size!==3;};L.$('#ac').appendChild(b);});
  L.$('#ck').onclick=()=>{if(done||sel.size!==3)return;done=true;L.$('#ck').disabled=true;
    A.forEach(a=>{const b=L.$('#'+a[0]);b.classList.remove('sel');b.className='chip static'+(a[2]==='ok'?' ok':'');b.style.opacity=a[2]==='ok'?'1':'.45';b.innerHTML=(a[2]==='ok'?L.ic('check'):L.ic('x'))+a[1];});
    const ok=['a1','a3','a5'].every(x=>sel.has(x));L.award(ok);
    L.sheet(ok?'ok':'no',ok?'A beginner again, on purpose':'Some of those remake the old job',
     'Listening widely, assuming past choices had reasons, and learning the shadow org chart redraw Noa’s maps. Cloning Runway, Usherly-style meetings or a week-one vision would mold the new place in the old one’s image.');L.done();};}},
{part:3,src:'Chapter 9 · Prepare to Reset',pts:1,run(L){
  L.h(L.kick('pr','Your call')+'<h1 class="q">In week three, Noa finds the new company’s message queue odd and wants to replace it with what Usherly used. What should Noa do first?</h1>');
  L.mc(L.card,['Write the replacement proposal while ideas are fresh','Learn why the team chose it and what it trades off','Quietly build a prototype to prove the old one wrong'],1,
   'Assume there were good reasons: everything has trade-offs. Noa may still propose a change, but from understanding.',
   'Both jump to remaking the place in Usherly’s image. The book says be humble and assume previous decisions had reasons.');}},
{part:3,src:'Chapter 9 · Your Choices Matter',run(L){
  L.h(L.kick('learn','Your choices matter')+'<h1 class="q">The book’s last word isn’t about careers</h1>'+
   L.quote('You need to take software seriously.','Tanya Reilly, chapter 9')+
   L.prose('Software can be fun and creative. But crashes lose people’s work, bad validation drops insurance claims, and leaks, abuse and addictive design harm real people. More and more software is life-critical.')+
   L.prose('Engineers are called senior after a few years and often move every two or three, which rewards building for now, not the long term. The book wants the care of other life-critical professions, like the ring Canadian engineers wear to remember their duties.')+
   L.note('Know how your software will be used. Be firm about what’s negotiable and what isn’t. What senior people do sets the culture for the whole industry.','shield'));
  L.done();}},
{part:3,src:'Chapter 9 · Your Choices Matter',pts:1,run(L){
  L.h(L.kick('pr','Your call')+'<h1 class="q">Think back to Resale’s launch. Two weeks before it, someone suggests skipping Bao’s fraud checks to make the date. Fans could lose money to fake listings. What should Quinn do?</h1>');
  L.mc(L.card,['Agree, and add the checks right after launch','Hold firm: fan safety isn’t negotiable here','Let Ezra decide, and stay out of it'],1,
   'Knowing how the software will be used, and being firm on what isn’t negotiable, is the senior engineer’s job. Quinn can cut other scope instead.',
   'Shipping without them risks real fans’ money, and staying out of it gives up the influence Quinn has. Be firm about what isn’t negotiable, and cut elsewhere.');}},
{part:3,src:'Chapter 9 · To Recap',pts:1,run(L){
  L.h(L.kick('pr','Look back on the journey')+'<h1 class="q">Put Quinn’s first year as a staff engineer in the order the book takes it.</h1>');
  L.order(L.card,['Define the role and its scope with Ezra','Map Usherly’s terrain and the shadow org chart','Write the on-sale strategy with Noa','Choose projects and lead Resale','Become a role model and level up Mika','Steer their own career'],
   'Big-picture thinking, then execution, then leveling up others and yourself: the three pillars, in order. Build good software, a good career and a good industry.');}}
  ]
});
</script>
</body>
</html>
