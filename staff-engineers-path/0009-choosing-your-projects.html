<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choosing Your Projects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0009', title:'Choosing your projects', minutes:20, icon:'scale',
  goals:['Run a new project through questions about energy, quality of life, credibility, social capital and skills','Pick the right move when a project doesn’t fit: do it anyway, compensate, let others lead, resize, or say no','Defend your time without feeling like a slacker'],
  parts:['Energy and enjoyment','Reputation and growth','The wrong project','Real decisions'],
  read:'Read the second half of chapter 4 for the four worked examples and the full list of quality-of-life questions.',
  glossary:{
    'snacking':'Snacking: doing lots of low-effort, low-impact work because it’s quick and feels good, at the cost of work that matters.',
    'managing-up':'Managing up: understanding your manager’s priorities, giving them the information they need and clearing problems from their way.',
    'back-burner':'Torch the back burner: deliberately stop “keeping warm” projects you’ll never get back to, or hand them to someone else.',
    'exit-criteria':'Exit criteria: conditions, agreed up front, for when you stop or step away from a piece of work.'
  },
  cheatsheet:[
    '<b>Energy</b>: do you have a free slot to care about this? Does the work give or take energy? Are you <b>snacking</b> because you’re tired? Is this fight worth it?',
    '<b>Quality of life</b>: will you enjoy the actual work, including the gaps you’d fill? How do you feel about the project’s goals?',
    '<b>Credibility</b>: does it use your technical skills and show your leadership? If it fails, will you be respected or blamed?',
    '<b>Social capital</b>: is it work expected at your level, respected by peers? Don’t squander capital, yours or a sponsor’s.',
    '<b>Skills</b>: will it teach you what you want to learn, and will the people around you raise your game?',
    'Wrong project? Do it anyway (short term, with exit criteria), compensate, let others lead, resize it, or just don’t.',
    'Strong “I don’t want to”? Take the feeling seriously. Look for a reshaped version, and tell people what you <b>do</b> want.',
    'Defend your time. Saying no is the price of high-quality work, and a gift to Future You.'
  ],
  steps:[
/* ---------- PART 1: ENERGY AND ENJOYMENT ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Quinn finds long whiteboard sessions draining. Noa loves them. A new project needs weeks of whiteboarding. Does it cost them both the same?</h1>');
  L.mc(L.card,['Yes, an hour is an hour for anyone','No, it costs Quinn more energy'],1,
   'Right. Different people are drained by different work. The same project can be cheap for Noa and expensive for Quinn.',
   'The hours are the same, but the energy isn’t. Work that drains you costs more than its hours. This lesson is full of questions like this one.');}},
{part:0,src:'Chapter 4 · Energy: How many things are you already doing?',run(L){
  L.h(L.kick('learn','Energy questions')+'<h1 class="q">Do you have a free slot, and will this work drain you?</h1>'+
   L.prose('The author jokes (only mostly) that they have enough energy to care about <b>five things</b> at once. Caring about a sixth means one of the five has to go. Otherwise a ball gets dropped, and it won’t be the least important one.')+
   L.list([['layers','How many things are you already doing?','Do you have a free slot to care about something new? Life outside work counts too. Before a big life event is no time to start a draining project.'],
     ['flame','Does this kind of work give or take energy?','Lots of conversations, hundreds of pages of reading, or people who exhaust you all make a project more expensive for <i>you</i>.']],1)+
   L.note('If you tend to volunteer by reflex, build a habit: pause for a few seconds before you say yes.','clock'));
  L.done();}},
{part:0,src:'Chapter 4 · Energy: How many things are you already doing?',pts:1,
 solve:async L=>{L.$('#dec').click();},
 run(L){
  const B=['On-sale surge strategy','Mentoring Mika','Box Office reviews','Till migration advice','Runway feedback'];
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Quinn already cares about five things. Wren asks Quinn to also care about a load-balancer redesign. Pick Quinn’s move.</h1>'+
   '<div id="balls" style="margin:6px 0 12px">'+B.map((b,j)=>'<span class="chip static ok" id="b'+j+'">'+L.ic('check')+b+'</span>').join('')+'</div>'+
   '<div style="display:flex;gap:8px;flex-wrap:wrap" id="mv"><button class="btn" id="add">Add it, keep all five</button><button class="btn" id="drp">Drop one of the five first</button><button class="btn" id="dec">Decline the new one</button></div>');
  const fin=()=>{L.$('#mv').remove();L.done();};
  L.$('#add').onclick=()=>{const b=L.$('#b0');b.classList.remove('ok');b.style.opacity='.45';b.innerHTML=L.ic('x')+B[0]+' (dropped)';
    L.$('#balls').insertAdjacentHTML('beforeend','<span class="chip static ok">'+L.ic('check')+'Load-balancer redesign</span>');
    L.award(false);L.sheet('no','A ball fell, and not a small one','With six balls in the air, something drops by accident. The book warns it won’t be the least important one: here, the surge strategy slipped. Choose what to stop caring about, or don’t add the new thing.');fin();};
  L.$('#drp').onclick=()=>{const b=L.$('#b4');b.classList.remove('ok');b.style.opacity='.45';b.innerHTML=L.ic('cycle')+B[4]+' (handed back)';
    L.$('#balls').insertAdjacentHTML('beforeend','<span class="chip static ok">'+L.ic('check')+'Load-balancer redesign</span>');
    L.award(true);L.sheet('ok','A deliberate trade','Quinn chose what to stop caring about, instead of letting chance choose. That’s the book’s point: a sixth thing means one of the five has to go.');fin();};
  L.$('#dec').onclick=()=>{L.award(true);L.sheet('ok','Five stays five','Quinn can still care for the length of one meeting and offer advice, then let the slot go. Every choice means something else you can’t do, so choose your battles.');fin();};}},
{part:0,src:'Chapter 4 · Energy: Are you procrastinating?',run(L){
  L.h(L.kick('learn','Snacking and fights')+'<h1 class="q">Two energy traps: snacking, and fights that aren’t worth it</h1>'+
   L.prose('When you’re low on energy, a huge ambiguous project feels impossible, so you pick up small stuff instead. A bit is fine at the end of a draining day. The book cites a 2×2 grid of <b>impact</b> against <b>effort</b>, and warns about the low-impact, low-effort corner: '+L.g('snacking','snacking')+'.')+
   L.quote('If you never eat anything of substance you’ll suffer.','Des Traynor, quoted in chapter 4')+
   L.prose('When you notice busywork because you’re tired, find a way to <b>rest</b> instead.')+
   L.note('<b>Is this fight worth it?</b> Organizational battles over problems nobody owns often take longer and drain more than planned. Ask whether it was worth it to you, how many similar fights you see, and what else you could do with that energy.','scale'));
  L.done();}},
{part:0,src:'Chapter 4 · Energy: Are you procrastinating?',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Quinn has spent three tired afternoons this week renaming wiki pages and closing stale tickets, while the surge strategy sits untouched. What does the book suggest?</h1>');
  L.mc(L.card,['Keep going, since it’s still useful work','Notice it’s tiredness, and rest instead','Force a push on the strategy every evening'],1,
   'Yes. Snacking can feel easier than resting. Spotting the pattern is the first step, and real rest beats more busywork.',
   'Busywork is useful in small doses, but three afternoons of it is snacking. Pushing harder when drained doesn’t work either. The book says notice it and find a way to rest.');}},
{part:0,src:'Chapter 4 · Quality of life: Do you enjoy this work?',run(L){
  L.h(L.kick('learn','Quality of life questions')+'<h1 class="q">Will you enjoy the work, and believe in it?</h1>'+
   L.prose('Recall Zunger’s four disciplines from lesson 0002: core technical skills, product management, project management and people management. If you lead a project, you fill whatever gaps nobody else covers. Will you enjoy that, or resent it?')+
   L.list([['flame','Intensity','Enough excitement for you, or too much stress?'],
     ['people','People','Collaborators if you hate working alone? A big group all day if people tire you?'],
     ['alert','On call and travel','Will it need either, and do you want that?'],
     ['home','Safety','Will you work with people who let you relax and be yourself?']],2)+
   L.note('<b>How do you feel about the goals?</b> For some, it’s enough not to hurt anyone. Others need the work to make the world better. Weigh how the project’s effect on the world affects your own satisfaction.','compass'));
  L.done();}},
{part:0,src:'Chapter 4 · Quality of life: Do you enjoy this work?',pts:1,run(L){
  L.h(L.kick('pr','Apply it')+'<h1 class="q">Ezra wants Quinn to lead Usherly Resale. There’s no product manager yet, so Quinn would also shape the product. Which question should Quinn ask first about quality of life?</h1>');
  L.mc(L.card,['Is Resale written in my favorite language?','Will I enjoy doing the product-manager part?','Will leading it get me promoted faster?'],1,
   'Right. If nobody covers product management, the lead fills that gap. Quinn should ask honestly whether they’ll enjoy it or resent it.',
   'Promotion is a social-capital question, and the language is a minor detail. The quality-of-life question is about the actual work, including the product gap Quinn would fill.');}},

/* ---------- PART 2: REPUTATION AND GROWTH ---------- */
{part:1,src:'Chapter 4 · Credibility: Does this project use your technical skills?',run(L){
  L.h(L.kick('learn','Credibility questions')+'<h1 class="q">Will this show what you can do, technically and as a leader?</h1>'+
   L.lanes([['pencil','Technical skills','After a long time at high altitude, get back into the trenches now and then. Cracking something three others failed at is a solid boost, and protects you from the “ivory tower” label later.',2],
            ['star','Leadership skills','Owning outcomes, communicating often and well, and giving the right detail about what’s working and what isn’t. And actually succeeding.',3]])+
   L.note('Check the risk too. If the battle can’t be won, will people respect you for trying, or blame you?','alert'));
  L.done();}},
{part:1,src:'Chapter 4 · Social capital: Is this the kind of work that your company and your manager expects at your level?',run(L){
  L.h(L.kick('learn','Social capital questions')+'<h1 class="q">Who will value this work?</h1>'+
   L.list([['target','Is it expected at your level?','If your company only counts staff engineers as successful when they design systems or lead big projects, make sure you do those things. Work that matters to your reporting chain builds capital.'],
     ['people','Will peers respect it?','Work peers see as important or cool earns goodwill. Work they see as pointless or shady costs you their help and trust.'],
     ['shield','Are you squandering it?','Capital you’ve built can be spent on a fight you don’t even care much about. Notice when that’s happening.']],1)+
   L.prose(L.g('managing-up','Managing up')+' helps your manager succeed, which gives <i>them</i> capital to help you. But only optimizing for looking good to leadership earns little respect. It’s one factor, not the whole picture.'));
  L.done();}},
{part:1,src:'Chapter 4 · Social capital: Are you squandering the capital you’ve built?',run(L){
  L.h(L.kick('ex','A cautionary tale from the book')+'<h1 class="q">How a respected new hire spent their reputation in a few months</h1>');
  L.beats(L.card,[
   ['A great start','The author’s team hired a senior engineer with big credentials. They were productive at once and raised everyone’s standards.'],
   ['The pet fix','A few weeks in, they spotted a messy system that broke a best practice. It was rarely touched and didn’t seem worth fixing.'],
   ['Spending','Their reputation carried the room. Nobody objected when they pulled two new-grad engineers off their projects to fix it.'],
   ['The cost','It turned out to need quarters, not weeks, and cost about ten times the estimate. They kept pushing for a couple of months before it was dropped.'],
   ['The result','Everything went back to normal, except the new hire was no longer quite so esteemed.']],
   'Capital spent on a fight you don’t really care about is simply gone. The same goes for <b>borrowed</b> capital: if you lean on a '+L.g('sponsor','sponsor')+'’s reputation and waste it, they may not back you a second time.');}},
{part:1,src:'Chapter 4 · Social capital: Are you squandering the capital you’ve built?',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Ezra put their name behind Quinn’s surge strategy. Now Quinn wants to use Ezra’s backing to push a pet refactor nobody else cares about. What’s the main risk?</h1>');
  L.mc(L.card,['Quinn’s technical credibility will go up','Nothing, since backing never runs out','Ezra may not back Quinn’s ideas again'],2,
   'Right. Borrowed capital is still capital. Waste it and the lender may not lend a second time.',
   'Sponsorship is borrowed social capital, and it does run out. Spending it on a pet project risks Ezra not backing Quinn again.');}},
{part:1,src:'Chapter 4 · Skills: Will this project teach you something you want to learn?',run(L){
  L.h(L.kick('learn','Skills questions')+'<h1 class="q">Will you grow, and who will you grow next to?</h1>'+
   L.prose('<b>Will it teach you something you want to learn?</b> Think of the stories you’d like to tell on a future résumé: leading a big, messy project to done, debugging something hard, driving a culture change, turning junior engineers into senior ones. Look for projects that let you practice those.')+
   L.prose('<b>Will the people around you raise your game?</b> You learn a lot by watching a skill done well. Even the most senior person on a team can learn from others, including new grads. One of the author’s friends took a chance to work with her CTO just to learn how CTOs talk to people.'));
  L.done();}},
{part:1,src:'Chapter 4 · Questions to Ask Yourself About Projects',pts:6,run(L){
  L.h(L.kick('pr','Which question is this?')+'<h1 class="q">Quinn is weighing a new project. Sort each thought by the resource it’s about.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Credibility','Social capital','Skills'],[
   ['Engineers are starting to ask whether Quinn still knows how Box Office really works.',0,'Time to get back into the trenches and show technical judgment.'],
   ['This project is Ezra’s top priority for the half.',1,'Work that matters to your reporting chain builds social capital.'],
   ['Quinn would work beside Noa for six months.',2,'Working next to someone very skilled raises your game.'],
   ['Most peers think the project is pointless.',1,'Peers who don’t respect the work will be slower to help or trust you.'],
   ['Quinn wants a résumé story about driving a culture change.',2,'Pick projects that let you practice the skills behind the stories you want to tell.'],
   ['Three teams already failed to fix the seat-map race bug. Quinn thinks they can crack it.',0,'Solving what others couldn’t is a strong credibility boost.']],
   'Each resource has its own questions. Running a project through all of them is how you judge fit, not just importance.');}},
{part:1,src:'Chapter 4 · Social capital: Are you squandering the capital you’ve built?',pts:1,run(L){
  L.h(L.kick('pr','Lending capital')+'<h1 class="q">Mika asks Quinn to recommend them to lead a visible Payments project. What should Quinn weigh?</h1>');
  L.mc(L.card,['Recommending someone is free, so just say yes','A recommendation spends Quinn’s own capital','Never vouch for someone outside your own team'],1,
   'Yes. Vouching for someone is a form of sponsorship, and it reflects on your judgment. Quinn should be confident Mika will do the work well.',
   'Recommending someone isn’t free: if it goes badly, it reflects on your judgment. That doesn’t mean never doing it. Just be sure the person is worth it.');}},

/* ---------- PART 3: THE WRONG PROJECT ---------- */
{part:2,src:'Chapter 4 · What If It’s the Wrong Project?',run(L){
  L.h(L.kick('learn','What if it’s the wrong project?')+'<h1 class="q">Important doesn’t mean right for you. You have five options.</h1>'+
   L.list([['Do it anyway','The path of least resistance. Can be right short term, but know why, and know the exit criteria. If there’s no end in sight, talk to your manager.'],
     ['Compensate','Add a side project for what’s missing, or make space by moving other work. Sometimes you have to '+L.g('back-burner','torch the back burner')+'.'],
     ['Let others lead','It may be a great chance for someone else. Work you’d “get an A” on might earn them a B first time, and that’s a fine outcome.'],
     ['Resize it','Join for the first month, act as a consultant, meet once instead of mentoring weekly, or suggest another reviewer.'],
     ['Just don’t','Not every problem is your problem. Saying no is the price of doing the rest well.']],1));
  L.done();}},
{part:2,src:'Chapter 4 · Do it anyway?',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">For a year, Quinn has done work that drains them, with no end in sight. Quinn has told Ezra clearly, many times, and nothing changes. What might the book say this signals?</h1>');
  L.mc(L.card,['Quinn may be in the wrong team or company','Quinn simply needs to try much harder','Ezra must be a bad manager'],0,
   'Right. It doesn’t have to reflect badly on anyone. Sometimes a big fish needs a bigger pond.',
   'Trying harder doesn’t fix a mismatch, and the book doesn’t blame anyone. If clear requests change nothing, it may signal the wrong team or company.');}},
{part:2,src:'Chapter 4 · Just don’t do it',pts:1,
 solve:async L=>{L.$('#jd').click();},
 run(L){
  L.h(L.kick('pr','See it happen')+'<h1 class="q">In October, two versions of Quinn get the same three requests: weekly design reviews for Payments, a meetup talk, and an internal dashboard rebuild. Jump ahead and compare.</h1>'+
   L.lanes([['check','Quinn A','Says yes to all three, as asked.<div class="res" id="ra"></div>',4],
            ['scale','Quinn B','Offers Payments one review session and another reviewer, hands the talk to Mika, and declines the dashboard.<div class="res" id="rb"></div>',2]])+
   '<button class="btn pri" id="jd" style="margin-top:14px">'+L.ic('cal')+'Jump to December</button><div id="jq"></div>');
  L.$('#jd').onclick=function(){this.remove();
    L.$('#ra').innerHTML='<span style="color:var(--no)">Surge strategy two months late, evenings gone, three things half done.</span>';
    L.$('#rb').innerHTML='<span style="color:var(--ok)">Strategy shipped. Mika gave their first talk. Nobody missed the dashboard.</span>';
    const q=L.$('#jq');q.innerHTML='<h2 class="sub">What did Quinn B do with the meetup talk?</h2>';
    L.mc(q,['Resized it','Let someone else lead it'],1,
     'Quinn had given many talks. For Mika, it was a real chance to grow, and a B on a first try is a great outcome.',
     'Resizing is what Quinn did with the design reviews (one session instead of weekly). The talk went to Mika: letting others lead.');};}},
{part:2,src:'Chapter 4 · What If It’s the Wrong Project?',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which move fits?',['Do it anyway','Compensate','Let others lead','Resize it','Just don’t'],[
   ['The big on-sale load test needs a lead in two weeks. It will wreck Quinn’s month, but it ends on a clear date.',0,'A short, vital stint with a clear exit. Fine, as long as it doesn’t become the norm.'],
   ['Till migration advice is good for Quinn’s credibility, but Quinn misses coding. Quinn adds a small coding side project.',1,'A side project fills the gap the main work leaves.'],
   ['Quinn has given a dozen Box Office talks. A new engineer on the team never has.',2,'An easy A for Quinn is a growth chance for someone else.'],
   ['A team wants Quinn as full-time lead. Quinn offers the first month, to check whether it’s feasible.',3,'Joining for the start is a classic way to reshape a project.'],
   ['Someone suggests Quinn rebuild a rarely used admin page. It bugs Quinn, but Quinn is swamped.',4,'Not every problem is your problem. It can stay imperfect, and that’s OK.']]);}},
{part:2,src:'Chapter 4 · Compensate for the project',pts:1,run(L){
  L.h(L.kick('pr','Apply it')+'<h1 class="q">For months, Quinn has kept three side projects “warm,” hoping to get back to them. They never move, but Quinn keeps thinking about them. What should Quinn do?</h1>');
  L.mc(L.card,['Plan a weekend to finish all three','Keep them warm, since one day there’ll be time','Drop them, or hand them to someone else'],2,
   'Yes: torch the back burner. Accept they’re not important enough to come back to, or give them to another “chef.”',
   'Keeping them warm costs headspace with no progress, and weekends are not spare capacity. The book’s advice: torch the back burner, or hand them off.');}},

/* ---------- PART 4: REAL DECISIONS ---------- */
{part:3,src:'Chapter 4 · Examples',run(L){
  L.h(L.kick('ex','Four examples from the book')+'<h1 class="q">Flip each one to see how the author weighs it</h1>');
  L.flips(L.card,[
   ['Speak at the all-hands?','You’re exhausted after an 18-month project, and a VP asks for a talk. Visibility is good, but it costs energy and vacation. Is it new for you? If not, give it to a teammate who’ll do it well, or shorten it, co-present, or postpone.'],
   ['Join the incident-commander rotation?','New, visible, transferable skills, but out-of-hours pages. Weigh it by quality of life: if you’re fried, maybe not now. If it makes you happy, sign up for six months and reconsider.'],
   ['The exciting project you have no time for?','You’re the contact for lots of process work. Take the new project if you’ll torch the back burner: hand off the process work, and block project time before others fill your calendar.'],
   ['“I want to want to”?','A great project on paper, but you dread it. Take the feeling seriously; it isn’t mandatory. Look for a reshaped role, and tell people what you’d rather do.']],
   'Each one weighs the dashboard, then looks for ways to boost the good parts and shrink the costs.');}},
{part:3,src:'Chapter 4 · Example: Joining an on-call rotation',pts:1,run(L){
  L.h(L.kick('pr','Quinn’s decision')+'<h1 class="q">Quinn has never been an incident commander and likes the idea. They’re sleeping well and feeling rested lately. What’s a sensible way in?</h1>');
  L.mc(L.card,['Commit for good, to show dedication','Sign up for six months, then reconsider','Decline, since on-call is never worth it'],1,
   'That matches the book: if it makes you happy, do it, with a natural point to check whether it still works.',
   'On-call can be well worth it for new, visible skills, but it’s hard on energy. A six-month stint with a check-in avoids both extremes.');}},
{part:3,src:'Chapter 4 · Example: The exciting project you wish you could do',pts:1,run(L){
  L.h(L.kick('pr','Quinn’s decision')+'<h1 class="q">Quinn says yes to leading Resale. But Quinn is also everyone’s go-to for Box Office process questions. What makes the new project survivable?</h1>');
  L.mc(L.card,['Block Resale time first, hand off process work','Keep all the process work, just work faster','Wait for the calendar to empty by itself'],0,
   'Right. If others define your calendar, there’s no time left for the project. Block it first, and find someone to take the process work.',
   'Calendars don’t empty themselves, and “faster” isn’t a plan. Block the project time first, then let others claim what’s left. Hand off the process work.');}},
{part:3,src:'Chapter 4 · Example: I want to want to',pts:1,run(L){
  L.h(L.kick('pr','Advising Mika')+'<h1 class="q">Mika is offered a high-profile Payments project that looks great for their career. Mika tells Quinn they dread it. What should Quinn advise?</h1>');
  L.mc(L.card,['Take it, since feelings shouldn’t steer careers','Say no flatly and don’t discuss it further','Take the feeling seriously and explore a reshape'],2,
   'Yes. A strong negative feeling is worth listening to. Before saying no, Mika can look for a variant, like a smaller role, and tell their manager what they’d rather do.',
   'The book says not to rationalize the feeling away, and taking it isn’t mandatory. But before a flat no, look for a reshaped role and say what you’d rather do.');}},
{part:3,src:'Chapter 4 · Defend Your Time',run(L){
  L.h(L.kick('learn','Defend your time')+'<h1 class="q">The demands grow. The hours don’t.</h1>'+
   L.prose('The author once hesitated to ask a busy VP for advice. A friend’s reply stuck: ask her, because nobody reaches that level without knowing how to defend their time.')+
   L.list([['x','Saying no is the price of quality','Do too many things and you can’t do any of them well.'],
     ['eye','Borrow the words','Watch how colleagues you admire say no, and copy their language and tone.'],
     ['star','It’s a gift to Future You','The author tags declined requests with an #isaidno label, and enjoys not being on the hook when the deadline comes.']],2));
  L.done();}},
{part:3,src:'Chapter 4 · Just don’t do it',pts:1,run(L){
  L.h(L.kick('pr','Final check')+'<h1 class="q">Quinn wants to say no to a design-review request from a team they like, but can’t imagine doing it without hurting the relationship. What does the book suggest?</h1>');
  L.mc(L.card,['Say yes this time and no next time','Copy how admired colleagues say no','Ignore the request until they give up'],1,
   'Right. Find colleagues who say no well, and borrow their language, tone and other cues.',
   'Deferring the no just piles up yeses, and silence damages the relationship more. The book suggests learning from people who say no gracefully.');}}
  ]
});
</script>
</body>
</html>
