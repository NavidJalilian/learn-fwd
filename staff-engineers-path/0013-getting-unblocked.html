<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Getting Unblocked</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0013', title:'Getting unblocked', minutes:19, icon:'lock',
  goals:['Name which of six kinds of blocker is stopping a project, and what is really going on behind it','Use the four moves (understand and explain, make the work easier, get organizational support, make alternative plans) on any blocker','Escalate as a polite request for help, and ask for things in a way that’s easy to say yes to'],
  parts:['Stuck in traffic','Teams and decisions','Buttons and people','Nobody and everybody'],
  read:'Read the first half of chapter 6 for every blocker’s full playbook and the author’s own stories from load balancing and migrations.',
  glossary:{
    'escalate':'Escalate: bring a problem to a leader who has the power to help, as a calm request for help, not a complaint.',
    'three-bullets':'Three Bullets and a Call to Action: a short request with at most three bullet points about the issue and exactly one clear ask, easy to forward.',
    'rollup':'Rollup: one written summary that pulls together all the scattered facts about a situation, plus the conclusions they lead to.',
    'go-no-go':'Go/no-go date: an agreed date by which, if the work isn’t ready, everyone switches to a backup plan.',
    'half-migration':'Half-finished migration: a move from an old system to a new one that has stalled partway, so everyone has to support both.'
  },
  cheatsheet:[
    'You can unstick projects you don’t lead, often with a small nudge. But <b>defend your time</b>: pick where your help matters most, and plan to step away.',
    'Four moves for any blocker: <b>understand and explain</b>, <b>make the work easier</b>, <b>get organizational support</b>, <b>make alternative plans</b>.',
    'Another team: look for a <b>misunderstanding, misadventure or misalignment</b>. If your work matters less, leave them alone.',
    'Escalation is a <b>polite conversation</b> with someone who can help: unemotional facts, what you need, why it matters. Talk to your sponsor first.',
    'Stuck decision: you’re on the same side. Reframe with examples, say what’s hard to reverse, or make a documented best guess.',
    'Button clicks and single people: make the ask tiny and clear (<b>Three Bullets and a Call to Action</b>), say thank you, pair to get people started.',
    'Unassigned work: more designs won’t help. Write a <b>rollup</b> and push for an owning team, or postpone.',
    'Stalled migration: tell both sides’ stories, have the migrating team do the work, make the new way the default and show the graph going to zero.'
  ],
  steps:[
/* ---------- PART 1: STUCK IN TRAFFIC ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Resale needs work from another team, and that team has stopped answering Quinn’s emails. What’s most likely going on?</h1>');
  L.mc(L.card,['They don’t care whether Resale launches','They have a reason Quinn doesn’t know yet'],1,
   'The book says there’s almost always a good reason. The first job is to go and find out what it is.',
   'It’s tempting to think so, but the book says there’s almost always a good reason. Quinn’s first job is to go and find it.');}},
{part:0,src:'Chapter 6 · The Project Isn’t Moving—Should It Be?',run(L){
  L.h(L.kick('learn','Should it be moving?')+'<h1 class="q">Projects stop for many reasons, and you can help even ones you don’t lead</h1>'+
   L.prose('A project can halt for a while because it’s <b>blocked</b> or <b>lost</b>, or it can stop on purpose. This lesson covers blocked projects. Lost and finished ones come next.')+
   L.prose('As a staff engineer, you can also help projects you’re <i>not</i> leading. Will Larson observes that many projects are one small change or one conversation away from success. With your relationships and experience, a small push from you can matter a lot.')+
   L.note('But seeing a problem doesn’t mean you should jump on it. <b>Defend your time.</b> It’s easy to fill your week with helping others until there’s no room for the project you promised to deliver. Choose where your help is worth most, act on purpose, and plan how you’ll step away.','clock'));
  L.done();}},
{part:0,src:'Chapter 6 · You’re Stuck in Traffic',run(L){
  L.h(L.kick('learn','The four moves')+'<h1 class="q">Whatever the blocker, you use the same four moves</h1>'+
   L.list([['eye','Understand and explain','Debug what’s really going on, then make sure everyone shares that understanding.'],
     ['down','Make the work easier','Need less from the people you’re waiting on.'],
     ['people','Get organizational support','Show the work is an organizational goal. Sometimes, '+L.g('escalate','escalate')+' to get past the block.'],
     ['compass','Make alternative plans','Find a creative way around, or accept the project can’t happen in its current form.']],1)+
   '<p class="small" style="margin-top:10px">The book applies them to six blockers: another team, a decision, a single button click, a single person, unassigned work, and a huge crowd (a stalled migration).</p>');
  L.done();}},
{part:0,src:'Chapter 6 · You’re Stuck in Traffic',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Wren’s team can’t build the three custom routing rules Resale wanted. Quinn asks for just one. Which move is that?</h1>');
  L.mc(L.card,['Get organizational support','Make alternative plans','Make the work easier'],2,
   'Asking for less from the people you’re waiting on is the classic way to make the work easier.',
   'Quinn didn’t go to a leader or change the plan. Asking for less from the busy team is <i>making the work easier</i>.');}},
{part:0,src:'Chapter 6 · You’re Stuck in Traffic',pts:6,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which move is this?',['Understand and explain','Make the work easier','Get org support','Alternative plans'],[
   ['Quinn books a call with Oskar to learn what Legal still needs before ruling on price caps.',0,'Finding out what’s really in the way is understanding.'],
   ['Quinn asks Payments for one refund endpoint instead of three.',1,'Needing less from the team you wait on makes the work easier.'],
   ['Quinn asks Ezra whether Resale or Platform’s Runway work should come first this quarter.',2,'When priorities clash, leadership decides which project wins.'],
   ['With no load-balancer pool in time, Resale launches for small venues first.',3,'Rescoping around a blocker that won’t move is an alternative plan.'],
   ['Ines writes the config change so Tomas only has to review it.',1,'Doing part of the work for the other team makes it easier for them.'],
   ['Quinn tells Bao’s team what Resale can’t do until their fraud check exists, and when it’s needed.',0,'Explaining why it matters and by when is the “explain” half of the move.']]);}},

/* ---------- PART 2: TEAMS AND DECISIONS ---------- */
{part:1,src:'Chapter 6 · Blocked by Another Team',run(L){
  L.h(L.kick('learn','Blocked by another team')+'<h1 class="q">Three likely reasons a team you depend on isn’t delivering</h1>'+
   L.tiers([['chat','Misunderstanding','They don’t know about your deadline, or understood the request differently.','Info got lost on the way'],
            ['alert','Misadventure','Someone quit or got sick. They’re understaffed, overloaded, or blocked themselves.','Life happened'],
            ['layers','Misalignment','They’re moving fast, just on something that ranks higher for them than your project does.','Your #1 is their #3']])+
   L.note('Escalating doesn’t mean complaining about the other team. It means a polite conversation with someone who has the power to help, solving the problem together.','info'));
  L.done();}},
{part:1,src:'Chapter 6 · Blocked by Another Team',pts:1,
 solve:async L=>{L.$('#pp').children[1].click();L.$('#runq').click();},
 run(L){
  let p=null;const R=[['Runway on-sale surge work',[1,5]],['Load-balancer upgrade',[6,10]],['Resale load-balancer pool',[13,16]]];
  L.h(L.kick('try','Predict, then watch')+'<h1 class="q">Resale is the Resale team’s #1 priority. On Wren’s Infrastructure team, it’s #3. Will Wren’s team get to it this quarter?</h1><div id="pp"></div>'+
   '<div id="qv" hidden><div style="display:flex;align-items:center;justify-content:space-between;margin-top:6px;gap:8px;flex-wrap:wrap"><div><div class="small">Infrastructure team, this quarter</div><div class="week" id="wk">Week 0</div></div><button class="btn pri" id="runq">'+L.ic('play')+'Run 12 weeks</button></div>'+
   R.map((r,j)=>'<div class="meterrow"><div class="lb">#'+(j+1)+' '+r[0]+'</div><div class="meter"><div id="q'+j+'" style="background:var(--h'+(j+2)+')"></div></div></div>').join('')+'</div>');
  ['Yes, it gets done','No, it keeps waiting'].forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=n;b.onclick=()=>{if(p!==null)return;p=j;b.classList.add('sel');L.$('#qv').hidden=false;};L.$('#pp').appendChild(b);});
  L.$('#runq').onclick=function(){this.remove();let w=0;
    const t=setInterval(()=>{w++;const wk=L.$('#wk');if(!wk){clearInterval(t);return;}wk.textContent='Week '+w;
      R.forEach((r,j)=>{const el=L.$('#q'+j);if(el)el.style.width=Math.round(Math.max(0,Math.min(1,(w-r[1][0]+1)/(r[1][1]-r[1][0]+1)))*100)+'%';});
      if(w>=12){clearInterval(t);L.award(p===1);
        L.sheet(p===1?'ok':'no',p===1?'You called it':'It keeps waiting','Wren’s team worked hard all quarter, just on their top two. That’s <b>misalignment</b>: nobody is lazy or wrong. The fix is to ask leadership which project should win. If Resale matters less, Quinn should leave Wren’s team alone.');L.done();}},200);};}},
{part:1,src:'Chapter 6 · Navigating the dependency',run(L){
  L.h(L.kick('ex','Quinn and Wren’s team')+'<h1 class="q">The four moves, one after another</h1>');
  L.beats(L.card,[
   ['Understand','Tickets go unanswered, so Quinn asks Wren for a 20-minute call. Over coffee, Tomas mentions the team just lost two engineers. Misadventure <i>and</i> misalignment.'],
   ['Explain','Quinn spells it out: one resale pool on the load balancers, by March 1, because resale traffic spikes with every big on-sale. “Is that realistic? Is there something else that would work?”'],
   ['Make it easier','Quinn drops two of the three routing rules and offers to have Ines write the change for Tomas to review. Wren declines: coaching a newcomer through it would take longer. Quinn isn’t offended.'],
   ['Get support','Quinn talks to Ezra first. Ezra and Wren’s director take the plain facts to the VP of Engineering, their shared leader. The VP decides Runway’s surge work comes first.'],
   ['Alternative plan','Quinn rescopes: Resale opens for smaller events first and adds stadium shows when the pool is ready in April. Quinn tells the stakeholders why.']],
   'Even when the answer is “not yet,” Quinn finds out early, keeps the relationship and changes the plan in the open.');}},
{part:1,src:'Chapter 6 · Get organizational support',pts:1,run(L){
  L.h(L.kick('pr','Your call')+'<h1 class="q">Quinn drafts a note to the VP of Engineering. Which one is a real escalation?</h1>');
  L.mc(L.card,['“Wren’s team ignores Resale again. Please make them do our work first.”','“Resale needs one pool by March 1; Wren’s team has two other priorities. Which comes first?”','“FYI: Infrastructure is blocking Resale, and the launch will almost certainly slip.”'],1,
   'Calm facts, what’s needed, why, and a request to decide together. That’s asking for help, not complaining.',
   'One blames the other team and the other just warns without asking for anything. An escalation states the facts and asks someone with power to help solve the problem.');}},
{part:1,src:'Chapter 6 · Blocked by a Decision',run(L){
  L.h(L.kick('learn','Blocked by a decision')+'<h1 class="q">The decision isn’t easier from where they stand</h1>'+
   L.prose('You ask a stakeholder for a decision and get nothing. It’s tempting to think “Why won’t they <i>just</i> decide?” But they can’t decide on the spot any more than you can, and they may be waiting on someone else.')+
   L.prose('Or they don’t understand the question. The book describes an engineer asking “Do you want X or Y?” and hearing “Yes, that would be great!” In a different field, the two options can look the same.')+
   L.list([['people','You’re on the same side','Find what they need to decide, and explain the impact on things <i>they</i> care about.'],
     ['eye','Reframe the question','Use pictures, user stories or examples. Say which parts are hard to reverse later and which don’t matter.'],
     ['scale','Mediate or equip','If deciders disagree, help each side see the other. If their bosses must decide, give them talking points.'],
     ['compass','If it still won’t come','Ask your sponsor. Or keep options open, or make a best guess, written down with its trade-offs. Or accept you can’t go on yet.']],2));
  L.done();}},
{part:1,src:'Chapter 6 · Navigating the unmade decision',pts:1,run(L){
  L.h(L.kick('pr','Your call')+'<h1 class="q">Quinn asks Oskar in Legal: “One global price cap, or a cap per event?” Oskar replies: “Both sound fine!” What should Quinn do next?</h1>');
  L.mc(L.card,['Show two fan stories, one per option, and say which is hard to undo','Pick the global cap, since Oskar has no strong opinion','Escalate to the VP, because Legal is slowing Resale'],0,
   '“Both sound fine” means the question didn’t land. Concrete examples help Oskar see the real difference, and flagging what’s hard to reverse shows where the decision matters.',
   'Oskar hasn’t seen the difference yet, so it isn’t really a choice. Guessing or escalating comes later. First reframe the question with examples Oskar can react to.');}},

/* ---------- PART 3: BUTTONS AND PEOPLE ---------- */
{part:2,src:'Chapter 6 · Blocked by a Single $%@$% Button Click',run(L){
  L.h(L.kick('learn','Blocked by a single button click')+'<h1 class="q">“It’s ten minutes of work. Why won’t they just click it?”</h1>'+
   L.prose('The author once ran load balancing for a whole company. Each request took about half an hour, but the docs asked for a week’s notice. Why? Hundreds of teams used those balancers, it was one of four critical services the team ran, and they wanted to plan their weeks and batch changes. Teams who showed up angry the day before launch got little sympathy.')+
   L.quote('Lack of planning on your part is not an emergency on mine.','The author’s old team motto, chapter 6')+
   L.prose('Your button is one small block on <i>their</i> calendar, among many. And an approval often means they share the blame if things go wrong, so they shouldn’t give it lightly.'));
  L.done();}},
{part:2,src:'Chapter 6 · Navigating the unclicked button',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">Quinn skipped the process and now needs a config change from Tomas</h1>'+
   L.lanes([['x','First draft','“Hi! We need the resale backend added to the load balancers ASAP, we launch Thursday. Should be quick. Thanks!!”',4],
            ['check','What Quinn sends','“Sorry, we missed your notice period, that’s on us. <b>Need:</b> add backend resale-01 to pool web-east. <b>Config:</b> attached and tested. <b>Why now:</b> Thursday launch. Happy to wait if this week is impossible.”',1]])+
   L.prose('The second one is easy to say yes to: small, nothing to work out, little to read. It owns the mistake and asks politely. If Tomas helps, Quinn says thank you, for example by naming Tomas in the launch email.')+
   '<p class="small">Escalating to skip a queue can cause bad blood. If you must, say you understand why the process exists. If nothing works, wait, and tell your stakeholders.</p>');
  L.done();}},
{part:2,src:'Chapter 6 · Blocked by a Single $%@$% Button Click',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Resale needs the security team’s launch approval. “It’s one click,” says Joss. Why might security take their time?</h1>');
  L.mc(L.card,['Approving means sharing the blame if it goes wrong','Security teams like to slow product teams down','Their approval tool takes days to load a request'],0,
   'An approval moves part of the responsibility onto them. They shouldn’t give it lightly.',
   'The book’s point is about accountability, not bad intent or slow tools. When security approves, they share responsibility if something goes wrong.');}},
{part:2,src:'Chapter 6 · Blocked by a Single Person',run(L){
  L.h(L.kick('learn','Blocked by a single person')+'<h1 class="q">The excuses you hear may not be the real reason</h1>'+
   L.prose('The author once waited weeks for a colleague to write two short scripts. There was always an excuse. The truth: he’d come from operations, had never written much code, and was intimidated. Pairing on the first steps got him going.')+
   L.prose('People get stuck because they’re intimidated, overloaded, stressed at home, told by their boss something else matters more, or too embarrassed to ask a third time. From outside, it all looks the same. You’re not their boss or therapist, but you can help:')+
   L.list([['eye','Dig deeper','Don’t just accept “next week.” Explain the business need, and agree an earlier '+L.g('go-no-go','go/no-go date')+'.'],
     ['list','Make the ask tiny','Break it down and spell out exactly what you need, for example with '+L.g('three-bullets','Three Bullets and a Call to Action')+'.'],
     ['people','Help, don’t take over','Coach, or pair to get them started. With a busy manager, sit in a one-on-one while they do it.'],
     ['shield','Then escalate','Someone not doing their job is a people-management issue. Talking to their manager is asking for help.']],3));
  L.done();}},
{part:2,src:'Chapter 6 · Navigating a colleague who isn’t doing the work',pts:1,run(L){
  L.h(L.kick('pr','Your call')+'<h1 class="q">Ines has put off the seat-lock script for three weeks: an outage, a sick day, a broken laptop. Ines spent years in support before Resale. What should Quinn try first?</h1>');
  L.mc(L.card,['Write the script for Ines to save some time','Sit with Ines and pair on the first steps','Ask Ines’s manager to set a firm deadline'],1,
   'The excuses hint that Ines may be intimidated by a first big coding task. Pairing gets past the scary start, and Ines can carry on alone.',
   'Taking over teaches nothing and adds to Quinn’s load. Escalating comes after trying to help. First find out what’s really going on, and pair to get Ines started.');}},
{part:2,src:'Chapter 6 · What Are You Asking For?',pts:6,run(L){
  L.h(L.kick('pr','Three bullets and a call to action')+'<h1 class="q">Quinn drafts a note to Hollis about the payout-hold code. Sort each line.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Bullet','Call to action','Cut it'],[
   ['Resale can’t take money until sellers’ payouts can be held.',0,'Why it matters, in one line.'],
   ['Launch is March 23; the payout hold is the last missing piece.',0,'The date and what’s blocked.'],
   ['If it can’t land by March 1, we switch to a backup plan.',0,'The go/no-go date, stated plainly.'],
   ['Can you tell me by Friday whether March 1 works?',1,'One clear ask, and only one.'],
   ['Also, could you review the refund doc and the dashboard?',2,'A second ask gets the reply you care least about, or none.'],
   ['A long history of how the payout design changed since 2019',2,'Background makes it harder to read and to forward.']],
   'At most three bullets and exactly one ask. Short enough that Hollis can answer, or forward it to their manager, in a minute.');}},

/* ---------- PART 4: NOBODY AND EVERYBODY ---------- */
{part:3,src:'Chapter 6 · Blocked by Unassigned Work',run(L){
  L.h(L.kick('learn','Blocked by unassigned work')+'<h1 class="q">Everyone agrees it’s needed. Nobody is going to build it.</h1>'+
   L.prose('Some work falls between team boundaries: too big for one person, or needing a team to own and support it over time. Many teams have opinions about it, but none plans to write the code. Until someone owns it, more designs and plans won’t help.')+
   L.note('The book’s picture: an impassable ridge blocks the treasure, and teams spend their time debating which of three doomed paths to take. The ridge is the missing staffing.','map')+
   L.list([['eye','Understand and explain','Have lots of conversations, then write a '+L.g('rollup','rollup')+' with clear conclusions. Wrong is better than vague.'],
     ['people','Make it easier','Offer to mentor, advise or join the team that takes it on.'],
     ['star','Get support','Your most valuable work: find a sponsor and an owning team, with a sharp pitch they can repeat.'],
     ['clock','Alternative','If staffing is always “next quarter,” it isn’t a priority. Postpone.']],4));
  L.done();}},
{part:3,src:'Chapter 6 · Rollup',run(L){
  L.h(L.kick('ex','Quinn writes a rollup')+'<h1 class="q">Two facts, one conclusion nobody had said out loud</h1>');
  L.beats(L.card,[
   ['The gap','Resale, Swap and door scanning all need one shared record of who owns each ticket. Four teams come to every meeting about it. None has it on their roadmap.'],
   ['Fact 1','Hollis: “Payouts can be held once the ticket-ownership record exists.”'],
   ['Fact 2','Lucia: “Nobody is building that record. Mobile can’t take it on before autumn.”'],
   ['Conclusion','Quinn writes what follows: <b>“Sellers won’t get safe payouts before autumn unless a team owns the ticket record.”</b> Ezra hadn’t put the two facts together.'],
   ['The pitch','Quinn adds: “I can advise the team that takes it on, half a day a week.” Ezra takes the rollup to the director’s staff meeting to find an owner.']],
   'The rollup did the sum nobody else had done. Spelled out plainly, it gave everyone a chance to react, and gave Ezra something to act on.');}},
{part:3,src:'Chapter 6 · Blocked by Unassigned Work',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Quinn’s group holds a fourth meeting comparing three designs for the ticket-ownership record. No team plans to build it. What’s really blocking it?</h1>');
  L.mc(L.card,['They haven’t yet found the best design','The design doc needs more technical detail','No team owns the work, so none will build it'],2,
   'The organizational gap is the crux. Until a team owns it, picking the best design changes nothing.',
   'That’s the doomed-paths trap: debating routes while the ridge, the missing owner, stays in place. More design work won’t get it built.');}},
{part:3,src:'Chapter 6 · Blocked by a Huge Crowd of People',run(L){
  L.h(L.kick('learn','Blocked by a huge crowd')+'<h1 class="q">The '+L.g('half-migration','half-finished migration')+'</h1>'+
   L.prose('When every team must change how they work, some won’t. One team likes the move but has no time. One prefers the old system. One is just tired of endless upgrades that never help them. They’re all being reasonable, and stalling halfway hurts everyone, because both systems need support.')+
   L.list([['eye','Tell both stories','Show why the work matters and why it’s hard for the teams asked to do it. Be a bridge.'],
     ['down','Make it easy','The migrating team does the extra work. Automate, say exactly which files to change, make the new way the default and show a progress graph heading to zero. Pair with teams, or make the change for components nobody owns.'],
     ['people','Get support','Get it onto the organization’s goals. If leadership won’t, maybe it isn’t where to spend time now.'],
     ['compass','End-game options','With strong backing, add friction to the old way (never breaking customers). Or make the last teams the owners of the old system.']],1));
  L.done();}},
{part:3,src:'Chapter 6 · Navigating the half-finished migration',pts:1,
 solve:async L=>{const c=L.$('#ta').children;[0,2,3,4,6].forEach(i=>c[i].click());},
 run(L){
  const A=[['Write a script that edits each team’s Till config for them',1,'Automation: the migrating side does the work.'],
           ['Email all five teams a firmer reminder',0,'They’ve had plenty of emails. Nagging doesn’t make the work easier.'],
           ['Post the 14-team burndown graph in the engineering channel',1,'People like seeing a graph head to zero.'],
           ['Pair with the checkout team on their odd use case',1,'Their case didn’t fit the script, so Quinn helps directly.'],
           ['Get the Till move onto Product Engineering’s quarterly goals',1,'Organizational support makes it a priority, not a favor.'],
           ['Switch Till off for an hour a day, without asking leadership',0,'Friction needs strong backing, and must never break fans’ checkouts.'],
           ['Make the last team the owner of Till, as part of their service',1,'Last out turns out the lights.']];
  let left=5,bad=false,awarded=false;
  L.h(L.kick('pr','See it happen')+'<h1 class="q">The Till migration has sat at 9 of 14 teams for a year. Quinn steps in to help Callum. Pick moves until no team is left on Till.</h1>'+
   '<div style="background:var(--soft);border-radius:16px;padding:14px;margin:6px 0 10px"><div class="small">Teams still on Till</div><div class="week" id="tl">5 of 14</div><div class="meter" style="margin-top:6px"><div id="tm" style="width:36%;background:var(--h4)"></div></div></div>'+
   '<div id="ta" style="display:flex;flex-direction:column;gap:8px;align-items:stretch"></div><div id="tf"></div>');
  A.forEach((a,j)=>{const b=document.createElement('button');b.className='chip';b.style.textAlign='left';b.style.whiteSpace='normal';b.textContent=a[0];
    b.onclick=()=>{if(b.disabled||left===0)return;b.disabled=true;
      if(a[1]){left--;b.classList.add('sel');L.$('#tl').textContent=left+' of 14';L.$('#tm').style.width=Math.round(left/14*100)+'%';L.fb(L.$('#tf'),'<b>One more team moves.</b> '+a[2],'ok');}
      else{b.style.opacity='.45';if(!bad&&!awarded){bad=true;awarded=true;L.award(false);}L.fb(L.$('#tf'),'<b>No team moves.</b> '+a[2],'no');}
      if(left===0){if(!awarded){awarded=true;L.award(true);}L.$('#tf').innerHTML='';
        L.sheet(bad?'info':'ok',bad?'Done, with a detour':'Till is finally empty','Every move that worked made the migration easier or more official. The ones that didn’t were nagging, or forcing without backing.');L.done();}};
    L.$('#ta').appendChild(b);});}},
