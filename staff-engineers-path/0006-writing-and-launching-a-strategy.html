<script>
Course.lesson({
  id:'0006', title:'Writing and launching a strategy', minutes:20, icon:'pencil',
  goals:['Run the writing loop: questions, drafts, interviews and thinking time','Make decisions that stick: trade-offs, rough consensus, and showing your work','Align people with nemawashi and a good story, then launch and keep it fresh'],
  parts:['The writing loop','Making decisions','Getting aligned','The launch'],
  read:'Read the middle of chapter 3, from “The Writing” to “Keep It Fresh,” for more interview questions and the full launch advice.',
  glossary:{
    'even-over':'Even-over statement: a sentence that ranks two good things, such as “ease of use even over performance,” to make a trade-off clear.',
    'rough-consensus':'Rough consensus: most of the group agrees and the main objections have been heard, even if not everyone is happy.',
    'overton':'Overton window: the range of ideas people currently accept as reasonable rather than too extreme or risky.',
    'nemawashi':'Nemawashi: quietly sharing information and building agreement one person at a time, so a consensus exists before the formal decision.',
    'straw-man':'Straw man: a rough first proposal put up so people have something concrete to react to.'
  },
  cheatsheet:[
    'Writing is a <b>loop</b>, not a line: initial questions, drafting, interviews and thinking time, many times over. Timebox it.',
    'Start with: What documents already exist? What needs to change? What’s great as it is? What’s important? What will Future You wish Present You had done?',
    'Interview widely, beyond your friends. Keep asking “Yes, but why?” so a pet project doesn’t sneak in.',
    'Make trade-offs explicit with <b>even-over</b> statements. Seek rough consensus: “Can anyone not live with this?”',
    'Not deciding is a decision for the status quo. Timebox, aim for good enough, and <b>show your work</b>, downsides included.',
    'Align as you go: sponsor at each checkpoint, stay inside the Overton window, use <b>nemawashi</b>, and be willing to change.',
    'Tell a story that is <b>comprehensible, relatable and comfortable</b>. Make the final draft easy to read.',
    'Launch = endorsement + a real-looking document + staffing. Stay with it, and revisit it when things change.'
  ],
  steps:[
/* ---------- PART 1: THE WRITING LOOP ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Quinn, Noa and Saskia have interviewed twelve people for their on-sale strategy. There’s always one more person to ask. What should they do?</h1>');
  L.mc(L.card,['Set a deadline and start wrapping up','Keep going until everyone has been heard'],0,
   'There will always be more information. The book says to notice when you’re getting less and less from each round, and to timebox the work.',
   'There will always be one more person. The book says to timebox the work, stop when it’s good enough, and add what you missed later.');}},
{part:0,src:'Chapter 3 · The Writing Loop',run(L){
  L.h(L.kick('learn','The writing loop')+'<h1 class="q">You don’t write a strategy once. You go round and round.</h1>'+
   L.prose('Once the setup is done, the real writing starts. It’s not a straight line. You’ll repeat these steps many times, in no fixed order, and sometimes drop back to the setup questions.')+
   L.flow([['bulb','Initial ideas','questions to order your thoughts'],['pencil','Writing','a rough draft'],['chat','Interviews','talk to lots of people'],['clock','Thinking','time to digest']])+
   L.note('A strategy can drag on forever, especially if it isn’t your main project. <b>Timebox it</b> and use milestones as a reminder to wrap up. It doesn’t have to be perfect: you’ll revisit it later.','clock'));
  L.done();}},
{part:0,src:'Chapter 3 · Initial ideas',run(L){
  L.h(L.kick('learn','Five starting questions')+'<h1 class="q">Get your own thoughts in order before you talk to others</h1>'+
   L.list([['What documents already exist?','Inherit limits from bigger plans like company goals. Know which smaller plans yours will disrupt.'],
     ['What needs to change?','What’s hard now? Think big: aim for 20-minute deploys, not “half as slow.” Bold goals invite bold ideas.'],
     ['What’s great as it is?','Keep what works. If you trade some of it away, do it on purpose.'],
     ['What’s important?','The more effort you ask of others, the better the treasure at the end needs to be.'],
     ['What will Future You wish Present You had done?','Which problems get a little worse every quarter? Fixing one now is “sending a cookie into the future.”']],1));
  L.done();}},
{part:0,src:'Chapter 3 · Initial ideas',run(L){
  L.h(L.kick('ex','Back at Usherly')+'<h1 class="q">Quinn’s group runs through the five questions</h1>');
  L.beats(L.card,[
   ['Existing documents','Usherly’s goal for the year is a smooth Resale launch next spring. The strategy must support it. Platform’s plan for Runway exists too, so they’ll build on it, not around it.'],
   ['What needs to change','Their first draft says “checkout down for less time.” They push further: <b>a stadium on-sale should be a non-event</b>.'],
   ['What’s great','Seat maps load fast and fans love them. Any fix must keep that.'],
   ['What’s important','An on-sale is Usherly’s biggest hour for revenue and reputation. That justifies asking 14 teams for effort.'],
   ['Future You','In two years, Resale will run on the same checkout. The seat-hold table gets a little slower every quarter. That’s their cookie for the future.']],
   'The questions turned a vague worry into themes: a bold goal, one thing to protect, and one slow-growing problem to fix now.');}},
{part:0,src:'Chapter 3 · Initial ideas',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Saskia suggests serving seat maps a new way. It would help on-sales, but seat maps would load a little slower. Which question should make the group pause?</h1>');
  L.mc(L.card,['What documents already exist?','What will Future You wish you’d done?','What’s great as it is?'],2,
   'Fast seat maps are something that works well. They might still trade it away, but only on purpose.',
   'The issue is giving up something that already works: fast seat maps. That’s “What’s great as it is?” Trade it only on purpose.');}},
{part:0,src:'Chapter 3 · Writing',run(L){
  L.h(L.kick('learn','Writing as a group')+'<h1 class="q">Two ways to get a first draft</h1>'+
   L.lanes([['person','The leader drafts','One consistent voice. But the draft reflects the author’s interests, and others are swayed by what’s already written, especially if the author is senior. <b>Fix:</b> talk a lot first, flag choices you made arbitrarily, and make it safe to disagree.',2],
            ['people','Everyone drafts, then combine','Everyone’s unbiased views. But people get attached to their own draft and attack the others. <b>Fix:</b> say up front that all drafts feed one final document, with no “winner,” and name who writes it and settles disputes.',3]])+
   L.prose('Either way, be ready for others to change your mind, maybe a lot.'));
  L.done();}},
{part:0,src:'Chapter 3 · Interviews',run(L){
  L.h(L.kick('learn','Interviews and thinking time')+'<h1 class="q">Talk to lots of people, then think hard about what you heard</h1>'+
   L.prose('Your core group only knows its own corner. Talk to leaders, influencers and people close to the work in <b>other</b> areas, not just colleagues you already like.')+
   L.flow([['chat','Early','Broad questions: “What’s important to include?” “If you had a magic wand…?”'],['pencil','Later','Share a draft or a '+L.g('straw-man','straw man')+' and ask for reactions.'],['check','Always end with','“What else should I have asked you?”']])+
   L.prose('Then give yourselves time to think, in whatever way works: writing, whiteboards, debate, sleeping on it. Watch for one trap: describing the problem in terms of a solution you’ve already picked. Ask <b>“Yes, but why?”</b> until the answer clearly leads back to the goal.'));
  L.done();}},
{part:0,src:'Chapter 3 · Thinking time',pts:1,
 solve:async L=>{for(const j of [0,1]){L.$('#ii').children[j].click();while(!L.$('#wy').hidden)L.$('#wy').click();}},
 run(L){
  const I=[['Noa: a waiting room',['Add a waiting room before checkout','So only as many fans enter as Box Office can handle','So the seat-hold table isn’t swamped','So checkout stays up during on-sales'],'ok','It leads straight back to the goal.'],
           ['Quinn: an event-streaming platform',['Move Box Office onto an event-streaming platform','So we use the design Quinn has wanted for years','So Box Office feels more modern','So… it might be nicer to work in?'],'no','The chain drifts away from on-sales. It’s a pet project.']];
  let cur=-1,lv=0;const seen=new Set();
  L.h(L.kick('pr','Yes, but why?')+'<h1 class="q">Pick an idea and keep asking “Yes, but why?” Does it lead back to keeping checkout up during on-sales?</h1><div id="ii" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px"></div>'+
   '<div class="ladder" id="ld"></div><button class="btn" id="wy" hidden>Yes, but why? '+L.ic('down')+'</button><div id="lv"></div><div id="wq"></div>');
  const draw=()=>{const x=I[cur];L.$('#ld').innerHTML=x[1].slice(0,lv+1).map((t,j)=>(j?'<div class="conn"></div>':'')+'<div class="rung'+(j===lv?' cur':'')+'">'+t+'</div>').join('');
    const end=lv>=x[1].length-1;L.$('#wy').hidden=end;L.$('#lv').innerHTML='';
    if(end){L.fb(L.$('#lv'),x[3],x[2]);seen.add(cur);
      if(seen.size===2&&!L.$('#wq').innerHTML){const q=L.$('#wq');q.innerHTML='<h2 class="sub">Which idea belongs in the strategy?</h2>';
        L.mc(q,['The waiting room','The event-streaming platform'],0,'Its “why” chain leads straight to the goal. Quinn’s idea may have its day, but not in this strategy.',
         'Its “why” chain drifts off into “modern” and “nicer.” The book warns to be honest about what you’re selling to yourself. Your pet project’s time will come.');}}};
  I.forEach((x,j)=>{const b=document.createElement('button');b.className='chip';b.innerHTML=L.ic('bulb')+x[0];
    b.onclick=()=>{[...L.$('#ii').children].forEach(y=>y.classList.remove('sel'));b.classList.add('sel');cur=j;lv=0;draw();};L.$('#ii').appendChild(b);});
  L.$('#wy').onclick=()=>{if(cur<0)return;lv++;draw();};}},

/* ---------- PART 2: MAKING DECISIONS ---------- */
{part:1,src:'Chapter 3 · Make Decisions',run(L){
  L.h(L.kick('learn','Trade-offs and rough consensus')+'<h1 class="q">Every option has downsides. Pick the ones you can live with.</h1>'+
   L.prose('Decisions are hard because every choice has pros and cons. Deciding your priorities in advance tells you which downsides you’ll accept. One clear way is an '+L.g('even-over','even-over statement')+': “We’ll favor ease of use <i>even over</i> performance.”')+
   L.prose('Often no option pleases everyone. Try to align, but don’t wait for everyone to agree, or you’ll wait forever. Borrow '+L.g('rough-consensus','rough consensus')+' from the Internet Engineering Task Force:')+
   L.quote('Lack of disagreement is more important than agreement.','IETF principles, quoted in chapter 3')+
   L.prose('So don’t ask “Is everyone OK with A?” Ask <b>“Can anyone not live with A?”</b> If you’re still stuck, someone named up front breaks the tie. Asking your sponsor is a last resort: they’re far from the details.'));
  L.done();}},
{part:1,src:'Chapter 3 · Not deciding is a decision (just usually not a good one)',run(L){
  L.h(L.kick('learn','Not deciding is a decision')+'<h1 class="q">Option C, “don’t decide,” is usually the worst one</h1>'+
   L.prose('Between A and B there’s always a hidden option C: stay on the fence. It upsets nobody, so people drift into it. But it keeps the status quo <i>and</i> the uncertainty, and every decision that depends on it has to hedge.')+
   L.list([['clock','Timebox it','Not “find the best storage system ever,” but “research for two weeks, then choose.”'],
     ['check','Good enough beats best','Ask what information you’re waiting for, and how you’ll get it.'],
     ['scale','Choose not to decide on purpose','Sometimes waiting is right, for example when deciding costs more than it gains. Then list “no decision” as an option and pick it deliberately.'],
     ['shield','Make being wrong survivable','Build in ways to change course if it goes badly.']],4)+
   L.note('<b>Show your work.</b> Write down the trade-offs and the downsides, and why you chose anyway. It’s respectful, and it stops every newcomer from reopening the decision. If nobody is unhappy, you probably didn’t really decide anything.','pencil'));
  L.done();}},
{part:1,src:'Chapter 3 · Make Decisions',run(L){
  L.h(L.kick('ex','Back at Usherly')+'<h1 class="q">The group makes its biggest call</h1>');
  L.beats(L.card,[
   ['The choice','Option A: a waiting room that lets fans into checkout at a safe rate. Option B: make Box Office scale to absorb any surge.'],
   ['The trade-off','A means some fans wait. B means a huge, slow change to an 11-year-old system. They write: “Fair, predictable entry for fans <i>even over</i> the fastest checkout for the first few.”'],
   ['Rough consensus','Quinn asks: “Can anyone not live with the waiting room?” Noa prefers B but can live with A. Saskia can live with it if Infrastructure isn’t on call for it.'],
   ['A timebox','Build or buy the waiting room? Nobody knows yet. They give themselves two weeks to test both, then choose.'],
   ['Show the work','The draft lists A’s downsides (fans wait, a new part to run) and explains why B was rejected, so nobody has to reargue it later.']],
   'A clear trade-off, a “can you live with it?” check, a timebox for the open question, and the downsides written down.');}},
{part:1,src:'Chapter 3 · Building consensus',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">The group is split on how long a fan’s place in the queue should last. Which question fits rough consensus?</h1>');
  L.mc(L.card,['“Is everyone happy with ten minutes?”','“Shall we take a vote on ten minutes?”','“Can anyone not live with ten minutes?”'],2,
   'Rough consensus looks for the absence of strong objections, not for everyone’s enthusiasm.',
   'Waiting for everyone to be happy can take forever, and the IETF approach rejects voting. Ask whether anyone <i>can’t live</i> with the option.');}},
{part:1,src:'Chapter 3 · Trade-offs',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">The group agrees that a fair wait for every fan matters more than the fastest checkout for the very first fans. Tap the pieces to write their even-over statement.</h1>');
  L.sentence(L.card,[['We will choose'],['fair, predictable entry for every fan','the fastest checkout for the first fans','a perfect experience for everyone'],['even over'],['the fastest checkout for the first fans','fair, predictable entry for every fan','any downsides at all']],[0,0,0,0],
   [[],['That flips the priority the group agreed on.','That isn’t a trade-off. Every option has downsides.'],[],['That puts the same thing on both sides.','An even-over statement compares two good things, not a good one and a bad one.']],
   'Two good things, ranked. Now anyone designing the waiting room knows which way to lean when they clash.');}},
{part:1,src:'Chapter 3 · Show your work',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Good decision-making, or not?',['Good practice','Needs fixing'],[
   ['“Let’s revisit retry limits next quarter.” Nobody says what they’re waiting to learn.',1,'That’s option C in disguise. Ask what information you need, how you’ll get it, and set a timebox.'],
   ['“We’ll test both waiting-room options for two weeks and choose on the 15th.”',0,'A timeboxed decision. Good enough by a date beats perfect never.'],
   ['The draft lists only the waiting room’s upsides, to make it more convincing.',1,'Hiding downsides invites people to reopen the decision. Show them, and explain why you chose anyway.'],
   ['“We looked at caching prices. Deciding now costs more than it gains, so we deliberately keep things as they are.”',0,'That’s choosing not to decide, on purpose, for a stated reason. The book allows that.'],
   ['Everyone in Box Office got exactly what they asked for.',1,'If everyone gets their wish, you probably didn’t make any real decisions.']]);}},

/* ---------- PART 3: GETTING ALIGNED ---------- */
{part:2,src:'Chapter 3 · Get Aligned and Stay Aligned',run(L){
  L.h(L.kick('learn','Stay aligned as you go')+'<h1 class="q">Nobody should see the plan for the first time at the end</h1>'+
   L.list([['person','Keep your sponsor in step','Send summaries and options, not a messy 20-page draft. For a strategy, align at least after the diagnosis, after the guiding policy and after the actions.'],
     ['compass','Be reasonable','Aim high, but not impossibly high. Ideas outside the '+L.g('overton','Overton window')+' get dismissed, and you lose credibility.'],
     ['people','Use nemawashi',L.g('nemawashi','Nemawashi')+' means building agreement person by person before the decision meeting. The author’s version: don’t call a vote until you know you have the votes.'],
     ['cycle','Let it go both ways','Aligning isn’t just convincing. Drop points people get stuck on, compromise, and stay open to a better destination.']],2));
  L.done();}},
{part:2,src:'Chapter 3 · Nemawashi',run(L){
  L.h(L.kick('ex','Back at Usherly')+'<h1 class="q">Quinn does the quiet work before the big review</h1>');
  L.beats(L.card,[
   ['Checkpoint','After the diagnosis, Quinn sends Ezra a one-page summary. Ezra agrees the focus is right, which beats finding out a month later.'],
   ['Outside the window','Noa’s draft hints at rebuilding Box Office around events. After two stalled rewrites, most people would dismiss that, so it’s cut from this strategy.'],
   ['One-on-one','A week before the architecture review, Quinn meets Wren alone. Wren’s real worry: “Your waiting room will page my team at 3 a.m.”'],
   ['The plan changes','The group agrees the waiting room will be owned and run by a product team, not Infrastructure. Wren’s worry is answered in the doc.'],
   ['The meeting','Wren arrives at the review already convinced, and says so. The decision takes ten minutes.']],
   'By the time the group met to decide, the agreement already existed. And the plan was better for listening.');}},
{part:2,src:'Chapter 3 · Work on your story',run(L){
  L.h(L.kick('learn','Work on your story')+'<h1 class="q">A plan people can’t retell won’t guide them when you’re not there</h1>'+
   L.prose('Nobody memorizes a long document. A short slogan helps. The book’s example is the <i>Financial Times</i>, whose “Cloud only 2020” was the piece of its tech strategy developers could quote.')+
   L.tiers([['bulb','Comprehensible','A short, connected story, not a list of unrelated tasks. If people don’t understand it, they can’t tell it for you.','',true],
            ['people','Relatable','Why <i>you</i> find the treasure exciting may not excite others. Show how it makes <i>their</i> lives better.'],
            ['home','Comfortable','A story from A to B only works if people are already at A. If they’re far back, convince them of A first.']])+
   '<p class="small" style="margin-top:10px">Also tell people the hard parts are expected: the heroes fall into the pit, then climb out.</p>');
  L.done();}},
{part:2,src:'Chapter 3 · Work on your story',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Quinn is presenting the strategy to Wren’s Infrastructure team. Which line makes it most relatable for them?</h1>');
  L.mc(L.card,['“Box Office engineers will finally stop dreading on-sales.”','“Fewer surprise pages for your team during big on-sales.”','“Fans will see a fair queue instead of an error page.”'],1,
   'It speaks to what Wren’s team cares about. Relatable means showing how the plan helps <i>them</i>.',
   'Those are real benefits, but for other people. To make it relatable for Infrastructure, show what changes for <i>their</i> team.');}},
{part:2,src:'Chapter 3 · Work on your story',pts:5,run(L){
  L.h(L.kick('pr','Fix the story')+'<h1 class="q">Early readers give feedback on the on-sale strategy. Which part of the story does each problem point to?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Comprehensible','Relatable','Comfortable'],[
   ['The draft is a list of 23 tasks with no thread connecting them.',0,'A short, connected story beats a list. Find the thread.'],
   ['The Payments team can’t see what’s in it for them.',1,'Show how the plan makes their lives better too.'],
   ['It assumes teams accept that Box Office must be split up. Most still think it’s fine.',2,'People aren’t at A yet. Convince them of A first.'],
   ['Engineers can’t retell the plan when Quinn isn’t in the room.',0,'If they can’t explain it, they don’t really understand it. Simplify, and try a slogan.'],
   ['The mobile team hears only about Box Office’s pain.',1,'The reason it excites Box Office may not excite mobile. Reframe it for them.']],
   'Comprehensible: people can understand and retell it. Relatable: it matters to them. Comfortable: it starts where they are now.');}},

/* ---------- PART 4: THE LAUNCH ---------- */
{part:3,src:'Chapter 3 · Create the Final Draft',run(L){
  L.h(L.kick('learn','The final draft')+'<h1 class="q">Not everyone will want to read it, so make it easy</h1>'+
   L.prose('After weeks of work, it’s easy to forget that a long document can sit unread in a browser tab for months. Don’t be offended. Help readers instead.')+
   L.list([['eye','Make it easy to scan','Images, bullet points, plenty of white space. No walls of text.'],
     ['people','Use personas','Describe a few affected people, and their experience before and after.'],
     ['target','Show a real scenario','Something hard or impossible today, and how it will change.'],
     ['x','Cut the jargon','Unless every reader works in your area, acronyms make people tune out.'],
     ['layers','Add companion pieces','Slides for an all-hands, a one-page pitch, maybe an external blog post.']],3));
  L.done();}},
{part:3,src:'Chapter 3 · The Launch',run(L){
  L.h(L.kick('learn','Launch it and keep it fresh')+'<h1 class="q">Many documents die right here</h1>'+
   L.prose('One person’s idea and the organization’s official plan look the same on paper. The difference is mostly <b>belief</b>, and that takes three things:')+
   L.flow([['star','Endorsed','The top manager for the scope sends an email, adds their name, mentions it in next quarter’s goals or invites you to present.','',1],['book','Looks real','On an official internal site, comments closed, to-dos gone, a contact named (ideally a department head).','',2],['people','Staffed','Real headcount, budget and computing power, through the usual planning process.','',3]],false)+
   L.prose('The author has seen more success when the authors <b>stay with it</b> as it turns into projects. And keep it fresh: revisit it within a year, or sooner if it isn’t working. Explain what changed, update it, and tell a new story.'));
  L.done();}},
{part:3,src:'Chapter 3 · Make It Official',run(L){
  L.h(L.kick('ex','Back at Usherly')+'<h1 class="q">“No more Saturdays” goes live</h1>');
  L.beats(L.card,[
   ['The slogan','The strategy gets a bumper sticker everyone at Usherly understands: <b>“No more Saturdays.”</b>'],
   ['Personas','Lina, a fan, today sees a spinner and an error. After: a queue with their place in line. Tariq, on call, today gets paged mid-on-sale. After: a quiet night.'],
   ['Endorsement','Ezra emails all of Product Engineering, puts their name on the document as the contact, and adds the waiting room to next quarter’s goals.'],
   ['Staffing','Ezra moves two engineers onto checkout for two quarters through the normal planning process.'],
   ['Staying on','Quinn stays as an adviser on the waiting-room project and puts a review of the strategy on the calendar for next year.']],
   'A story people can repeat, an endorsement from the person in charge, real people to do the work, and a date to look at it again.');}},
{part:3,src:'Chapter 3 · Make It Official',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Does this make the strategy real?',['Yes, it helps','Not yet'],[
   ['The final doc lives in Quinn’s personal folder, with open comments and three to-dos.',1,'Make it look real: an official site, comments closed, to-dos removed.'],
   ['The VP of Engineering mentions the strategy when presenting next quarter’s goals.',0,'A public gesture from the person in charge turns your plan into the organization’s plan.'],
   ['The plan needs two engineers, but nobody has asked for headcount.',1,'An endorsed plan nobody staffs stays a document. Work with your sponsor on headcount.'],
   ['The document lists Ezra as the contact for questions, not just three engineers.',0,'A department head’s name as contact carries much more weight.']]);}},
{part:3,src:'Chapter 3 · Keep It Fresh',pts:1,run(L){
  L.h(L.kick('pr','Keep it fresh')+'<h1 class="q">Eight months later, Usherly starts selling festival passes with week-long on-sales, not one-minute surges. The strategy assumed short spikes. What should Quinn do?</h1>');
  L.mc(L.card,['Keep the plan as written, since it was endorsed','Revisit it, explain what changed and update it','Drop it quietly and start a brand-new strategy'],1,
   'The world changed, so the plan should too. Explain the new information, update the document and tell the new story.',
   'Keeping a plan that no longer fits wastes effort, and dropping it quietly confuses everyone. Revisit it, say what changed and update it openly.');}}
  ]
});
</script>
</body>
</html>
