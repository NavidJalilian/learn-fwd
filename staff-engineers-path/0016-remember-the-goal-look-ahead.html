<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remember the Goal, Look Ahead</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0016', title:'Remember the goal, look ahead', minutes:19, icon:'compass',
  goals:['Weigh technical choices against the business, the user and the team','Use four habits that help Future You: telegraph, tidy up, sharpen tools, write it down','Design for failure, maintenance and an easy switch-off, and grow the next leaders'],
  parts:['The business','User and team','Look ahead','Built to last'],
  read:'Read the second half of chapter 7 for the full stories behind each habit, including the incident review the author loves most.',
  glossary:{
    'innovation-token':'Innovation token: Dan McKinley’s name for a company’s small supply of chances to do something new, weird or hard. Spend them only where it really counts.',
    'cyae':'CYAE (“cover your ass engineering”): John Allspaw’s name for dodging responsibility, as in “I built it to spec, so it’s not my fault,” instead of asking whether the work actually helped the people it was for.',
    'spof':'Single point of failure: one part (or one person) that everything stops without when it’s missing.',
    'institutional-memory':'Institutional memory: what an organization remembers about why things are the way they are, which leaks away every time someone leaves.',
    'observable':'Observable: easy to inspect, analyze and debug from the outside, through tooling, tracing or clear status messages.',
    'decommission':'Decommission: turn a system off for good and remove it, once nothing depends on it any more.'
  },
  cheatsheet:[
    'Software is the means, not the end. <b>Adapt to the situation</b>: sometimes on time beats perfect, and in an outage you restore first and clean up later.',
    'Know how the company makes money, whether times are good or lean, and spend <b>headcount</b> and '+'<b>innovation tokens</b> only where the business needs them.',
    'Know your <b>real users</b>: write requirements down, review the API and show a mockup before building. Built to spec but unloved is still wrong.',
    'You’re part of a <b>team</b>: don’t grab every problem or become a single point of failure. Your impact is what wouldn’t have happened without you.',
    'Help Future You: <b>telegraph</b> what’s coming, <b>tidy up</b>, keep your <b>tools sharp</b>, and <b>write things down</b>, even the obvious.',
    '<b>Expect failure</b>: test error paths, have a response plan, practice it, and test your backups.',
    'Optimize for <b>maintenance</b>: make it understandable, keep it simple (try a second solution), and <b>build to decommission</b>.',
    'Grow future leaders. The measure of success: do people <b>want to work with you</b>?'
  ],
  steps:[
/* ---------- PART 1: THE BUSINESS ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">A summer festival goes on sale through Usherly in three weeks, on a date fixed by the organizer. A new presale page is needed. Which is better?</h1>');
  L.mc(L.card,['A plain page that works, live on the day','A polished page that arrives a week late'],0,
   'Right. A festival on-sale won’t move for Usherly. An imperfect solution beats a late one, and this lesson is about knowing when that’s true.',
   'A late page is worth nothing to a festival that has already gone on sale. When the date is fixed, the simple version that ships on time wins.');}},
{part:0,src:'Chapter 7 · Remember the Goal',run(L){
  L.h(L.kick('learn','Two more role-model attributes')+'<h1 class="q">It’s not just technology</h1>'+
   L.prose('The previous lesson covered the first two attributes of a role-model senior engineer: <b>be competent</b> and <b>be responsible</b>. This one covers the last two: <b>remember the goal</b> and <b>look ahead</b>.')+
   L.prose('You work for a business (or a nonprofit, or a government agency) that is trying to achieve something. The software is how you get there, not the point in itself.')+
   L.list([['scale','Adapt to the situation','Sometimes a faster solution is better, sometimes a sturdier one. If time to market decides whether the business survives, a rough first version may matter more than beautiful code.'],
     ['flame','Outages change the rules','Your usual rule may be a careful, gradual restart. When everything is broken, the fastest fix might be to switch it all off and on again. Get back online first, clean up later.'],
     ['cycle','Be OK with change','Growth, a new market or a takeover can throw out your goals. Expect it and treat it as a new challenge, rather than resenting it.']],1));
  L.done();}},
{part:0,src:'Chapter 7 · Adapt to the situation',run(L){
  L.h(L.kick('ex','At Usherly')+'<h1 class="q">Odile and the festival presale page</h1>');
  L.beats(L.card,[
   ['The ask','Marketing needs a presale page for the summer festival in three weeks. The festival date can’t move.'],
   ['Odile’s plan','Odile, an engineer on the event-pages team, wants to rebuild the shared event-page component first, “properly,” so the presale page sits on clean code. Estimate: five weeks.'],
   ['Quinn’s question','“What does the business need here?” A page that works on the day. A late page has no value at all.'],
   ['The call','Odile builds a plain presale page on the existing component. It’s not pretty inside, but it’s tested and live a few days early.'],
   ['Afterwards','The component rebuild goes on the list as its own piece of work, to be weighed against everything else. It doesn’t get to hijack a fixed date.']],
   'Same engineer, same standards, different answer: the situation decides whether speed or polish matters more.');}},
{part:0,src:'Chapter 7 · Be aware that there’s a budget',run(L){
  L.h(L.kick('learn','Budgets and headcount')+'<h1 class="q">Good engineering always competes with money</h1>'+
   L.prose('High standards will always pull against what the business is willing to spend. That doesn’t mean dropping your principles. It means keeping the budget in the back of your mind.')+
   L.lanes([['trend','Know the money','How does the company make money? Are these good times or lean times? What counts as a big cost, a big saving or big new revenue?',2],
            ['people','Spend people wisely','Headcount (the number of people a team is allowed) is limited. Putting people on one project means they aren’t on another.',3]])+
   L.prose('Use Dan McKinley’s idea of '+L.g('innovation-token','innovation tokens')+': a company can only do a few new, weird or hard things at once. Is this the right place to spend one?')+
   L.note('Build the most <b>useful</b> thing, not the most fun one. And when it’s good enough, stop polishing. Don’t obsess, though: freezing up over every cost is its own problem.','scale'));
  L.done();}},
{part:0,src:'Chapter 7 · Spend resources mindfully',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Usherly has just had a lean quarter and frozen hiring. Quinn has three ideas. What should Quinn do first?</h1>');
  L.mc(L.card,['Start the most exciting idea while the team is keen','Check which idea the business actually needs now','Drop all three until hiring opens up again'],1,
   'Right. People are finite, and in lean times even more so. Pick the work the business needs, not the work that’s most fun.',
   'Excitement isn’t the test, and dropping everything is the freeze the book warns about. Ask which idea the business needs, then spend the people on that.');}},
{part:0,src:'Chapter 7 · Spend resources mindfully',pts:1,
 solve:async L=>{const c=L.$('#tk').children;c[1].click();c[3].click();L.$('#spend').click();},
 run(L){
  const ID=[['Write Usherly’s own message queue from scratch',0],['Enforce Resale’s price caps, which Legal requires before launch',1],['Rebuild event pages in a brand-new web framework',0],['The waiting room in front of checkout for on-sales',1],['Move seat maps to a trendy graph database',0]];
  const pick=new Set();
  L.h(L.kick('pr','Spend your tokens')+'<h1 class="q">Usherly can afford two '+L.g('innovation-token','innovation tokens')+' this year. Pick the two ideas worth them, then spend.</h1>'+
   '<div id="tk" style="display:flex;flex-wrap:wrap;gap:8px"></div><div class="small" id="tc" style="margin:10px 0">0 of 2 chosen</div>'+
   '<button class="btn pri" id="spend" disabled>'+L.ic('check')+'Spend tokens</button><div id="tf"></div>');
  ID.forEach((d,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=d[0];
    b.onclick=()=>{if(L.$('#spend').hidden)return;if(pick.has(j)){pick.delete(j);b.classList.remove('sel');}else if(pick.size<2){pick.add(j);b.classList.add('sel');}
      L.$('#tc').textContent=pick.size+' of 2 chosen';L.$('#spend').disabled=pick.size!==2;};L.$('#tk').appendChild(b);});
  L.$('#spend').onclick=function(){this.hidden=true;const ok=pick.has(1)&&pick.has(3);
    [...L.$('#tk').children].forEach((b,j)=>{if(ID[j][1])b.classList.add('ok');});
    L.award(ok);
    L.sheet(ok?'ok':'no',ok?'Well spent':'Not the best use',
     'The price caps and the waiting room are hard, new work the business <b>needs</b>: one unblocks a launch, the other protects on-sales. A homemade queue, a new framework and a trendy database are fun, but nothing at Usherly is crying out for them.');L.done();};}},
{part:0,src:'Chapter 7 · Adapt to the situation',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Faster or sturdier?',['Go for faster','Go for sturdier'],[
   ['Checkout is down in the middle of a stadium on-sale. The clean fix needs a careful, step-by-step restart.',0,'In an outage, get the system back first and clean up later. Switching it all off and on may be the fastest way.'],
   ['The seat-hold code in Box Office will be used by every team for years to come.',1,'Long-lived, shared code is where care pays off. Most of the time you’re planning for years, not weeks.'],
   ['A one-off sign-up form for a charity concert next week, thrown away right after.',0,'It’s short-lived and the date is fixed. Polishing it would be time spent on nothing.'],
   ['The payout logic that sends Resale sellers their money.',1,'Money moving between people needs to be right and to last. This is not the place for a rough first version.']]);}},

/* ---------- PART 2: USER AND TEAM ---------- */
{part:1,src:'Chapter 7 · Remember There’s a User',run(L){
  L.h(L.kick('learn','Users and teammates')+'<h1 class="q">Real users, and a real team</h1>'+
   L.prose('The author once watched a vendor insist a feature worked. It did, but only in browsers the author’s company didn’t use. The vendor said few people used that browser. Her colleague pointed around a cafeteria where literally everyone did.')+
   L.lanes([['person','Remember there’s a user','Know who uses your software and how. Don’t build for perfect imaginary users. Write the requirements down and share them, get the API reviewed before coding, show a mockup before building, and check in often.',2],
            ['people','Remember there’s a team','Don’t jump on every problem because you’re fastest. Don’t become a '+L.g('spof','single point of failure')+': it isn’t sustainable and it hides problems. If someone else does better work because you helped, that’s a win too.',3]])+
   L.note('Avoid '+L.g('cyae','CYAE')+'. Built to spec or not, if the user isn’t happy, you built the wrong thing. And count your impact as <b>what wouldn’t have happened without you</b>, not just what you did with your own hands.','alert'));
  L.done();}},
{part:1,src:'Chapter 7 · Remember There’s a User',run(L){
  L.h(L.kick('ex','At Usherly')+'<h1 class="q">The door-scanning app that worked perfectly in the office</h1>');
  L.beats(L.card,[
   ['The plan','For Resale, a resold ticket gets a new barcode, and the old one must stop working. The organizer-tools team plans to check every scan live against Box Office.'],
   ['The demo','In the office, on fast Wi-Fi, it’s instant. Everyone is pleased.'],
   ['Quinn asks','“Who actually scans tickets, and where?” Door staff, on cheap phones, outside stadiums, where thousands of fans overload the mobile network.'],
   ['The check','Quinn gets a mockup in front of two venue managers before the code is written. Both say the same thing: at the gate, the signal drops all the time.'],
   ['The change','The requirement is rewritten and shared: scanning must keep working when the network is slow or gone. That changes the design before a line is wasted.']],
   'The office users were perfect and imaginary. The real users stood at a gate with one bar of signal.');}},
{part:1,src:'Chapter 7 · Remember There’s a Team',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">This quarter, Quinn coached Mika through a tricky Payments change and Mika shipped it. How should Quinn see their own impact?</h1>');
  L.mc(L.card,['It’s Mika’s win, so it isn’t Quinn’s impact','It counts, since it wouldn’t have happened that way without Quinn','It only counts if Quinn wrote part of the code'],1,
   'Right. Impact is what wouldn’t have happened without you. Helping someone else do better work is as much a win as doing it yourself.',
   'The book measures impact as what wouldn’t have happened without you, not what you typed yourself. Empowering Mika is a real victory for Quinn.');}},
{part:1,src:'Chapter 7 · Remember the Goal',pts:5,run(L){
  L.h(L.kick('pr','Which goal was forgotten?')+'<h1 class="q">Each of these Usherly stories forgets one part of the goal. Sort them.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['The business','The user','The team'],[
   ['Mika spends two weeks making an internal Payments report page beautiful, when it already did its job.',0,'Good enough was reached. Polishing past that spends finite time the business needed elsewhere.'],
   ['The checkout team designs the Resale screens around desktop, though most fans buy on their phones.',1,'They built for imaginary users. Know who really uses it and how.'],
   ['Only Quinn knows how seat holds work, so every Box Office change waits for Quinn.',2,'Quinn has become a single point of failure. The team stalls whenever Quinn is away.'],
   ['A team ships the API exactly to spec, organizers can’t use it, and the team says “not our problem.”',1,'That’s CYAE. If the user isn’t happy, it was the wrong thing, spec or not.'],
   ['In a lean year, an engineer proposes a new team to build a custom monitoring tool nobody asked for.',0,'Headcount is finite and times are lean. That team has to come from somewhere.']],
   'Business, user, team: three things to hold in mind alongside the technology.');}},

/* ---------- PART 3: LOOK AHEAD ---------- */
{part:2,src:'Chapter 7 · Look Ahead',run(L){
  L.h(L.kick('learn','Look ahead')+'<h1 class="q">Your code will outlive this quarter, and probably your job</h1>'+
   L.prose('Most of the time you aren’t rushing to market. The code and architecture you touch will likely still be running in 5 or 10 years. As Titus Winters puts it, software engineering is programming over <i>time</i>.')+
   L.prose('The systems were there before you and will be there after you. So don’t win speed today at the cost of how fast the team can move later. It’s fine to plant seeds you’ll never see grow.')+
   L.note('Bring back the question from the strategy lessons: <b>“What will Future You wish Present You had done?”</b> Treat your future self and your future team as stakeholders. They’ll live with today’s decisions.','clock'));
  L.done();}},
{part:2,src:'Chapter 7 · Anticipate What You’ll Wish You’d Done',run(L){
  L.h(L.kick('learn','Four habits')+'<h1 class="q">Four ways to help Future You</h1>'+
   L.list([['alert','Telegraph what’s coming','Say where you’re heading before the details are ready. You may not have a shutdown date for an old system, but you can announce the <i>intention</i>. New projects stop building on it, and some teams move early on their own.'],
     ['home','Tidy up','Like a tool shed where nothing is where it should be, a messy codebase triples every job. Write tests that make changes safe, follow the style guide, and leave no traps, such as a script nobody must run or a setting changed by hand but never saved in source control.'],
     ['flame','Keep your tools sharp','Keep making the environment better: smaller builds, fixed or deleted flaky tests, repeatable steps, automation. Speed helps reliability too: every minute cut from spotting or deploying a fix comes off every outage.'],
     ['book','Create institutional memory','People leave and take history with them. Write down decisions and why, draw the diagrams of what “everyone knows,” add context to code comments, and use searchable keywords.']],2));
  L.done();}},
{part:2,src:'Chapter 7 · Telegraph what’s coming',run(L){
  L.h(L.kick('ex','At Usherly')+'<h1 class="q">Noa telegraphs the end of the old deploy scripts</h1>');
  L.beats(L.card,[
   ['The problem','Most product teams still deploy with old hand-made scripts instead of '+'Runway, Platform’s paved road. Every new service copies the old scripts.'],
   ['Not ready yet','Noa can’t set a shutdown date: Runway still needs features before the biggest teams can move.'],
   ['The small step','Noa posts a short note: “We intend to retire the old deploy scripts. No date yet, likely within two years. New services, please start on Runway.”'],
   ['What happens','Two new services start on Runway instead of copying scripts. One team with a quiet month moves without being asked.'],
   ['Later','When the real migration starts, there are fewer teams to move and nobody is surprised. A few minutes of writing saved months of work.']],
   'You don’t need the details to announce the direction. Setting expectations early is cheap and makes the future project easier.');}},
{part:2,src:'Chapter 7 · Create institutional memory',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Greta, who has worked on Box Office for ten years, explains over lunch why seat holds expire after eight minutes. What would most help the team in five years?</h1>');
  L.mc(L.card,['Remember to ask Greta next time it comes up','Add a comment in the code saying “do not change”','Write a short decision record with the reason and keywords'],2,
   'Right. Greta won’t be there forever. A searchable record of <i>why</i> sends the knowledge into the future.',
   'Relying on Greta fails when Greta leaves, and “do not change” keeps the rule but loses the reason. Write the decision and the why down, with keywords people will search for.');}},
{part:2,src:'Chapter 7 · Anticipate What You’ll Wish You’d Done',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which habit is this?',['Telegraph what’s coming','Tidy up','Keep your tools sharp','Create institutional memory'],[
   ['Quinn deletes a dangerous cleanup script from the shared folder that “everyone knows not to run.”',1,'A known trap is still a trap. Tidying means leaving nothing that can hurt the next person.'],
   ['Saskia cuts the time to deploy a fix from 20 minutes to 4.',2,'Faster deploys mean every future outage gets shorter. That’s sharpening the tools.'],
   ['Ezra tells teams that the old Till library will be retired, even though no date is set.',0,'Announcing the intention early lets teams plan, and stops new code from leaning on Till.'],
   ['Noa draws the on-sale traffic path, including the parts “everybody already knows.”',3,'The obvious stops being obvious once the people who knew it leave.'],
   ['Mika fixes the three flaky checkout tests that everyone just reruns.',2,'Flaky tests slow every change. Fixing or deleting them keeps the team fast and safe.']]);}},
{part:2,src:'Chapter 7 · Expect Failure',run(L){
  L.h(L.kick('learn','Expect failure')+'<h1 class="q">You can’t predict what will break, only that something will</h1>'+
   L.prose('The author’s favorite incident review is about a company knocked over by an outage at a cloud provider it didn’t even use. Its own customers slowed down at once and held their connections open until a limit was hit. Nobody could have predicted it.')+
   L.prose('Assume your systems hide many failures like that. Networks fail, hardware fails, people have off days, and parts interact in ways nobody imagined. So plan for what you’ll do when it happens:')+
   L.flow([['shield','Build it in','Test the error paths as well as the happy path. Do something sensible for users when a reply isn’t what you expected.','',1],
           ['eye','Notice it','Make sure you find out when systems misbehave, and have a plan to respond.','',2],
           ['cycle','Practice it','Agree how you’ll work in an emergency, then drill it: game days, tabletop exercises, controlled outages.','',3]],false)+
   L.note('And if you’ve never tested restoring your backups, assume you don’t have any.','alert'));
  L.done();}},
{part:2,src:'Chapter 7 · Expect Failure',pts:1,run(L){
  L.h(L.kick('pr','Getting ready')+'<h1 class="q">A huge tour goes on sale in two months. Which plan shows the most “expect failure” thinking?</h1>');
  L.mc(L.card,['Freeze all changes for two months so nothing can go wrong','Run a game day that breaks payments, and check fans see a clear message','Add extra servers until the load test passes with room to spare'],1,
   'Right. It assumes something will break, tests the error path, and practices the response before the real day.',
   'A freeze and extra servers both try to stop failure. The book says failure will come anyway, so test what happens when it does and practice the response.');}},

/* ---------- PART 4: BUILT TO LAST ---------- */
{part:3,src:'Chapter 7 · Optimize for Maintenance, Not Creation',run(L){
  L.h(L.kick('learn','Maintenance, not creation')+'<h1 class="q">Built once, looked after for years</h1>'+
   L.prose('Software is written once and maintained for years: monitoring, logging, scaling. Even untouched code gets dragged along by the world, such as new security standards or privacy laws. So don’t build what’s hard to maintain.')+
   L.tiers([['eye','Make it understandable','Nobody will ever understand it as well as on the day it’s built. Write docs for the future reader: a short intro, one big simple picture with arrows for data flow, links. Make it '+L.g('observable','observable')+'.','Or keep training everyone forever'],
            ['leaf','Keep it simple','Treat your first solution as just the first. Spend at least as long on another: fewer lines, branches, teams, files, hours of upkeep. If complexity is unavoidable, put it in one deliberate place.','Complexity is a cost, not a trophy'],
            ['box','Build to decommission','Someday it will be switched off. Give it a clean interface so that day is a simple cutover, not an excavation.','Next screen']]));
  L.done();}},
{part:3,src:'Chapter 7 · Build to decommission',pts:1,
 solve:async L=>{L.$('#ten').click();},
 run(L){
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Two ways to add Resale’s price-cap check. Jump ten years ahead, when it must be switched off.</h1>'+
   L.lanes([['layers','Design A · Wired in','Price-cap rules are added straight into Box Office order code, checkout and the mobile app, wherever they’re needed.<div class="res" id="da"></div>',1],
            ['box','Design B · Clean interface','One small service holds the rules. Others call it through a single interface, and a dashboard lists who still calls it.<div class="res" id="db"></div>',2]])+
   '<button class="btn pri" id="ten" style="margin-top:14px">'+L.ic('play')+'Ten years later: turn it off</button><div id="dq"></div>');
  L.$('#ten').onclick=function(){this.remove();
    L.$('#da').innerHTML='<span style="color:var(--no)">Dig through three codebases, untangle rules from order logic, guess who depends on it. Months of careful work.</span>';
    L.$('#db').innerHTML='<span style="color:var(--ok)">Read the dashboard, move the last two callers, switch it off. A simple cutover.</span>';
    const q=L.$('#dq');q.innerHTML='<h2 class="sub">What else does Design B give Usherly, long before that day?</h2>';
    L.mc(q,['A system that is modular and easier to maintain','A faster first launch than Design A would get'],0,
     'Right. The book notes that building to decommission has a side effect: a modular system that’s easier to maintain all along.',
     'Design A is probably the quicker one to wire in today. The bonus of Design B is that it’s modular and easier to maintain for its whole life.');};}},
{part:3,src:'Chapter 7 · Keep it simple',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Quinn is reviewing Mika’s first design for Resale refunds. Tap each piece until the advice matches the book.</h1>');
  L.sentence(L.card,[['Treat this design as','Ship this design as'],['the final answer,','just the first,'],['then spend','then skip'],['at least as long on another one,','no time on alternatives,'],['and put any hard logic','and spread any hard logic'],['in one clear place.','across every service.']],[0,1,0,0,0,0],
   [['Shipping the first idea skips the step where it gets simpler.'],['A first solution is where understanding starts, not where it ends.'],['Skipping the second try is how needless complexity survives.'],['The book suggests matching the time spent on the first one, at least.'],['Spreading complexity everywhere makes the whole system hard to reason about.'],['Hard logic belongs in one place, so others can treat it as a black box.']],
   'That’s the book’s recipe for simple: a second solution with at least the same effort, and any unavoidable complexity kept in one deliberate place.');}},
{part:3,src:'Chapter 7 · Create Future Leaders',run(L){
  L.h(L.kick('learn','Create future leaders')+'<h1 class="q">Your junior engineers are future senior engineers</h1>'+
   L.prose('It will often be quicker for you to solve a problem or lead a project yourself. That doesn’t mean you should. Give others room to learn, hands-on work, and problems that keep getting harder. (The next lessons are all about this.)')+
   L.prose('The chapter ends with a test drawn from John Allspaw: how much others want to work with you predicts how far your career goes.')+
   L.quote('The metric for success is whether other people want to work with you.','Tanya Reilly, chapter 7')+
   L.prose('If they don’t, look again at how you’re working.'));
  L.done();}},
{part:3,src:'Chapter 7 · Create Future Leaders',pts:1,run(L){
  L.h(L.kick('pr','Quinn’s choice')+'<h1 class="q">A Resale payout bug isn’t urgent. Quinn could fix it in an hour. Mika says they’d like to try, and it might take them two days. What should Quinn do?</h1>');
  L.mc(L.card,['Fix it now, since an hour is cheaper than two days','Fix it, then send Mika the change to read','Let Mika take it, and be there if they get stuck'],2,
   'Right. Nothing is on fire, and Mika is a future senior engineer. Hands-on problems are how they get there.',
   'Faster for Quinn isn’t the test when it isn’t urgent. Reading Quinn’s fix teaches far less than solving it. Let Mika do the hands-on work, with support.');}}
  ]
});
</script>
</body>
</html>
