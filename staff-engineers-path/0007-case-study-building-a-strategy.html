<title>Case Study: Building a Strategy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">

<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0007', title:'Case study: building a strategy', minutes:18, icon:'map',
  goals:['Explain why earlier attempts at a big change failed, and avoid repeating them','Follow a strategy from sponsor and scope to diagnosis, policy and actions','Judge a launch by direction and staffing, not by how exciting the plan sounds'],
  parts:['The scenario','Approach','Writing','Launch'],
  read:'Read the SockMatcher scenario at the start of chapter 3 and the case study at its end, for the full diagnosis and the complete list of challenges.',
  glossary:{
    'monolith':'Monolith: one large program that does many jobs at once (login, billing, matching and so on), usually sharing one database.',
    'pii':'PII (personally identifiable information): data that identifies a person, such as names or card numbers.',
    'feature-flag':'Feature flag: a switch that turns new code on or off without a new deploy, so a bad change can be undone quickly.',
    'okr':'OKR (objectives and key results): a common way for companies to set and track goals, often each quarter.',
    'dri':'DRI (directly responsible individual): the one person who is accountable for a goal and gets the final say, for example when a group is stuck.'
  },
  cheatsheet:[
    'Before trying a big change again, find out <b>why earlier attempts failed</b>. At SockMatcher: a solution handed down, then a working group stuck in debate.',
    'Treat <b>organizational alignment</b> as the hard part, not the technology. Be pragmatic and low-ego.',
    'Find a sponsor whose goals your plan serves. Jesse said yes once the plan protected his launch.',
    'Bring in co-authors who commit real time, and engage skeptics: use their earlier work, with credit.',
    'Scope to your influence: a one-year strategy for the monolith that includes the new launch, not a vision for everything.',
    'Interview before you diagnose: the obvious cause (traffic spikes) wasn’t the main one. Write down what you’re setting aside.',
    'Guiding policy: find leverage. Make billing and personalization easy and safe to integrate with. Keep the action list short and staffed.',
    'A good strategy can be boring and not loved by everyone. Documented trade-offs keep the grumbling from changing the plan.'
  ],
  steps:[
/* ---------- PART 1: THE SCENARIO ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Two senior engineers have already tried to fix a company’s biggest architecture problem, and both gave up. You want to try next. What do you do first?</h1>');
  L.mc(L.card,['Find out why the earlier attempts failed','Start fast with a better technical plan'],0,
   'If you don’t know why they failed, you’ll probably fail the same way. That’s exactly how this lesson’s case begins.',
   'A better plan may fail for the same reasons theirs did. Learn why the earlier attempts failed first. That’s how this lesson’s case begins.');}},
{part:0,src:'Chapter 3 · The Scenario: SockMatcher Needs a Plan',run(L){
  L.h(L.kick('learn','The book’s case: SockMatcher')+'<h1 class="q">A made-up company with a very real problem</h1>'+
   L.prose('This lesson leaves Usherly for the book’s own fictional case. <b>SockMatcher</b> matches odd socks: people upload a photo, and machine learning finds someone who lost the other one.')+
   L.flow([['layers','One monolith','Login, billing, matching and more in one '+L.g('monolith','monolith')+' and one shared database, including '+L.g('pii','PII')+'.','',1],['alert','Special cases','Gloves and buttons were added as kinds of sock, with if statements scattered everywhere.','',4],['box','Next: lids','Food storage containers and lids aren’t identical pairs. They need new matching and new partners.','',2]])+
   L.prose('The new food-storage team wants its own separate service. But it still needs login, billing, personalization and safe PII handling, all built around socks. There will be pressure to just call containers “a kind of sock.” The team is split.'));
  L.done();}},
{part:0,src:'Chapter 3 · The Scenario: SockMatcher Needs a Plan',run(L){
  L.h(L.kick('ex','More trouble at SockMatcher')+'<h1 class="q">Tap each card to see the other challenges</h1>');
  L.flips(L.card,[
   ['The public API','Outside companies use it, and it isn’t versioned. It gets harder to change with every new integration.'],
   ['Login','Homegrown, a few years of life left, and nobody is proud of it.'],
   ['Matching','The best on the market, but it sometimes misses a match. One engineer is excited about a much faster algorithm.'],
   ['Operations','The monolith team is paged several times a day: full disks, failed deploys, bugs.'],
   ['Outages','Celebrity sellers have caused 100× traffic spikes and full outages. Almost every outage hits almost everyone.'],
   ['Deploys','Building and deploying takes about three hours, so incidents drag on. App store reviews are sliding.']],
   'Most of these have well-known technical fixes. Working groups keep forming: twenty people who care but don’t agree, who then get pulled back to feature work. Nothing gains momentum.');}},
{part:0,src:'Chapter 3 · The Scenario: SockMatcher Needs a Plan',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">New people at SockMatcher keep suggesting good fixes: shard the data, version the API, split the monolith. Why does nothing change?</h1>');
  L.mc(L.card,['Nobody there has proposed a workable fix yet','The fixes are all too expensive to try','Many fixes exist, but nobody agrees which to back'],2,
   'The ideas are there. What’s missing is one agreed direction that people will commit time to.',
   'The fixes are known and many are reasonable. The gap is agreement: nobody can get momentum behind any single plan.');}},

/* ---------- PART 2: APPROACH ---------- */
{part:1,src:'Chapter 3 · Why didn’t previous attempts work?',run(L){
  L.h(L.kick('ex','Why earlier attempts failed')+'<h1 class="q">The book casts you as a staff engineer at SockMatcher</h1>');
  L.beats(L.card,[
   ['Your pitch','Your last project just ended and you want something big. Your manager is wary: this may be an uncrossable desert. You ask for two weeks to learn why earlier attempts failed, and promise to drop it if you find no reason to expect a different result.'],
   ['Pierre’s attempt','Pierre spent three months on a detailed design. Other teams disagreed with its trade-offs, it clashed with their own plans, and they didn’t like being handed a solution. He gave up, and he’s still grumpy.'],
   ['Geneva’s attempt','Geneva built a coalition first: a working group with lots of interest. It got bogged down in debate. People stopped coming, Geneva included.'],
   ['Pattern 1','Almost everyone has a specific solution in mind (“we just need microservices”) and wants theirs to win. So consensus is impossible.'],
   ['Pattern 2','Everyone focuses on the technical problem. There are many sound ideas, and no plan for getting the organization to buy in.'],
   ['Your plan','Treat organizational alignment as the crux. Get an executive sponsor, propose only what <i>this</i> organization can actually do, and help existing ideas succeed rather than pushing your own.']],
   'The earlier attempts failed on people, not technology. So that’s where you aim.');}},
{part:1,src:'Chapter 3 · Sponsorship',run(L){
  L.h(L.kick('learn','Finding a sponsor')+'<h1 class="q">You can’t make everyone happy, so you need someone who can decide</h1>'+
   L.prose('You have some credibility from your last project, but not enough to convince every team. Some decisions will disappoint people, and any plan will need engineers. Better to learn early if it can’t be staffed.')+
   L.lanes([['x','Jody: no','Director of the teams that run the monolith. She wants it easier to maintain, but her people were pulled into both failed attempts. She protects their time: rearchitecture is a “next year, maybe.”',4],
            ['check','Jesse: yes, on one condition','Director of the food-storage launch, so he may have easier access to staff. A future of happier, autonomous teams doesn’t move him: food storage must launch <b>this year</b>. You agree any plan must let it launch with little friction. He signs on.',2]])+
   L.prose('The right sponsor was the one whose own goal the plan could serve.'));
  L.done();}},
{part:1,src:'Chapter 3 · Sponsorship',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">What finally convinced Jesse to sponsor the work?</h1>');
  L.mc(L.card,['A future where product teams work on their own','A promise that the plan wouldn’t slow his launch','An offer of extra engineers for his launch team'],1,
   'Jesse cared about one thing: launching food storage this year. Once the plan protected that, he was in.',
   'The autonomous future didn’t move him, and the engineers went the other way: later, Jesse gave up some of his headcount. What won him was protecting his launch.');}},
{part:1,src:'Chapter 3 · Other engineers',run(L){
  L.h(L.kick('ex','Co-authors, allies and skeptics')+'<h1 class="q">Tap each person to see how you bring them along</h1>');
  L.flips(L.card,[
   ['Pierre, the skeptic','Still sore, and says it’s a waste of time. You ask to use his old plan as input, with credit, while scoping differently. He won’t join, but agrees to be interviewed and review.'],
   ['Geneva','Joins as co-author. Her old working group turns out to still meet weekly: three senior engineers with deep knowledge.'],
   ['Fran','From that group, commits two days a week for two months. The other two advise instead, and you update them every few weeks.'],
   ['Food-storage lead','Tends to think others’ work is easier than it is, but will back any real plan.'],
   ['Databases lead','Fears surprise work for their team, with good reason: there’s history. You promise early looks at every plan.'],
   ['Original sock-code author','Very senior and very influential. If convinced, many others follow. Wants to review early.']],
   'A small core who commit real time, and a wide circle of allies, including the people most likely to push back.');}},
{part:1,src:'Chapter 3 · Approach',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Back at Usherly: which pattern is it?',['Repeats Pierre’s mistake','Repeats Geneva’s mistake','Follows the case’s approach'],[
   ['Noa wants product teams to finally adopt Runway. Noa spends three months on a perfect migration design, then hands it to the teams.',0,'A finished solution handed to teams who weren’t involved is how Pierre’s plan died.'],
   ['Noa first asks Wren and two product leads why the last Runway push fizzled.',2,'Learning why earlier attempts failed is where the case starts.'],
   ['Noa opens a weekly Runway forum. Twenty people debate, nobody decides, and attendance drops.',1,'Interest without a way to decide is how Geneva’s working group stalled.'],
   ['Noa ties the plan to Ezra’s goal: Runway makes Resale’s deploys safer before launch.',2,'Like Jesse, a sponsor signs on when the plan serves their own goal.']]);}},
{part:1,src:'Chapter 3 · Scope',run(L){
  L.h(L.kick('learn','Choosing the scope')+'<h1 class="q">A strategy, not a vision, and only as big as your influence</h1>'+
   L.tiers([['x','A vision for all architecture','Fran’s wish. But neither you nor Jesse has that much influence, and it couldn’t be ready for the launch.','Too broad'],
            ['x','A vision for the monolith','Clarifies the destination, but teams would still fight about how to get there.','Not enough'],
            ['check','A one-year strategy','A high-level plan for the monolith that explicitly includes the food-storage launch. Lower-level calls only when nobody else owns them.','',true,'Chosen']])+
   L.prose('It also had to be <b>official</b>, not just <i>a</i> plan. Jesse suggested an organization-wide '+L.g('okr','OKR')+' with you as '+L.g('dri','DRI')+'. You opened a discussion channel and asked for collaborators with two days a week. Lots of people had opinions. Nobody had the time.'));
  L.done();}},

/* ---------- PART 3: WRITING ---------- */
{part:2,src:'Chapter 3 · Diagnosis',run(L){
  L.h(L.kick('learn','Diagnose before you solve')+'<h1 class="q">Too many facts, so pick the ones that matter</h1>'+
   L.prose('The list of true things is long: the new product, pages to the monolith team, a slow matcher, traffic spikes, unhappy users, old login code, slow deploys, a frozen API, unhappy developers.')+
   L.prose('The group brainstorms what’s important, what’s broken and what’s great. They picture their future selves with <b>twice the engineers and five more products</b>, all added as special cases: tangled logic, slower builds, more failed deploys. Doing nothing isn’t an option.')+
   L.note('Before committing to an answer, they go and interview product teams, leaders and engineers. It changes the picture.','chat'));
  L.done();}},
{part:2,src:'Chapter 3 · Diagnosis',pts:1,
 solve:async L=>{L.$('#pc').children[1].click();L.$('#run').click();},
 run(L){
  const P=['Celebrity traffic spikes','Ordinary bugs and slow deploys','The old login system'];let p=null;
  const F=[['trend','Overload outages are rare and short: a few minutes a month.'],['alert','Most damage comes from ordinary code bugs, plus three hours to ship a fix.'],['clock','Past fixes added more release tests, which slowed deploys and lengthened outages.']];
  L.h(L.kick('pr','Predict, then interview')+'<h1 class="q">The group suspected celebrity traffic spikes were behind SockMatcher’s poor availability. What will the interviews say is the main cause?</h1><div id="pc" style="display:flex;flex-wrap:wrap;gap:8px"></div>'+
   '<div id="iv" hidden><button class="btn pri" id="run" style="margin-top:12px">'+L.ic('play')+'Run the interviews</button><div id="fd" style="margin-top:10px"></div></div>');
  P.forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=n;b.onclick=()=>{if(p!==null)return;p=j;b.classList.add('sel');L.$('#iv').hidden=false;};L.$('#pc').appendChild(b);});
  L.$('#run').onclick=function(){this.remove();let k=0;
    const t=setInterval(()=>{const fd=L.$('#fd');if(!fd){clearInterval(t);return;}
      fd.insertAdjacentHTML('beforeend','<div class="fb info" style="display:flex;gap:10px;align-items:flex-start;margin-top:8px">'+L.ic(F[k][0])+'<div>'+F[k][1]+'</div></div>');k++;
      if(k>=F.length){clearInterval(t);L.award(p===1);
        L.sheet(p===1?'ok':'no',p===1?'You saw past the obvious':'Not the spikes, it turns out','The spikes were real but minor. The damage came from everyday bugs and slow deploys. Teams didn’t hate the monolith so much as <i>releasing</i> into it, and billing and personalization were the most fought-over parts. Without interviews, the plan would have targeted the wrong problem.');L.done();}},450);};}},
{part:2,src:'Chapter 3 · Diagnosis',run(L){
  L.h(L.kick('learn','The diagnosis')+'<h1 class="q">A simpler story than the messy reality</h1>'+
   L.prose('From the interviews, the group picks the facts that matter most and writes a short diagnosis. In plain terms:')+
   L.flow([['layers','Shared parts','Every new feature needs complex changes to the same shared components.','',1],['alert','Slow and risky','Changing them is hard, teams break each other’s work, outages run long.','',4],['trend','Getting worse','Each new kind of item adds more tangles. Growth will grind to a halt.','',3]])+
   L.prose('Choosing a focus hurts. The frozen API, the old login code and a better matcher are all real, but <b>set aside for now</b>. You show Jesse the diagnosis <i>and</i> the list of what you’re not tackling, so he knows you saw them. He agrees.'));
  L.done();}},
{part:2,src:'Chapter 3 · Guiding policy',run(L){
  L.h(L.kick('learn','The guiding policy')+'<h1 class="q">Not “microservices.” Find the point of leverage instead.</h1>'+
   L.lanes([['x','On the table: break up the monolith','It would ease adding products and speed fixes. But teams would still make risky shared changes, many would go on call for the first time, and it would take <b>three years or more</b>, with no way to ship meanwhile.',4],
            ['check','Chosen: fix the two hot spots','Billing and personalization are where integration hurts most. Make them easy to extend and other teams can add new items safely. Fewer outages means more time to improve. A virtuous cycle.',2]])+
   L.note('The guiding policy, in short: <b>billing and personalization should be easy and safe to integrate with.</b> You also write down the policies you <i>didn’t</i> choose, and why.','compass'));
  L.done();}},
{part:2,src:'Chapter 3 · Guiding policy',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Why didn’t the group adopt “move everything to microservices” as its guiding policy?</h1>');
  L.mc(L.card,['Microservices are a bad choice for every company','Nobody at SockMatcher knew how to build them','It ignored their reality: years of work, no shipping'],2,
   'The book calls it potentially perfect for a company with different constraints. It just didn’t fit SockMatcher’s situation.',
   'The book doesn’t reject microservices in general, and skills weren’t the issue. It didn’t fit the situation: years of work, new on-call duties, and nothing for the launch this year.');}},
{part:2,src:'Chapter 3 · Actions',run(L){
  L.h(L.kick('ex','The actions')+'<h1 class="q">Short, realistic and staffed</h1>');
  L.beats(L.card,[
   ['Check it’s real','You talk to the billing and personalization teams. They already had ideas: a menu of billing options set by configuration, and a plug-in design for personalization. They’re glad of a reason to do them.'],
   ['A bootstrapping problem','Those refactors are risky and could cause outages, which is why nobody had prioritized them. You suggest '+L.g('feature-flag','feature flags')+', so a bad change is a quick switch back, not another three-hour deploy.'],
   ['A pilot','Food storage can’t wait. Billing and personalization will integrate it the old way first, then move it to the new self-service way as the pilot customer.'],
   ['People','Those teams can’t do both with their current staff. Jesse gives up some of the food-storage headcount so they can grow.'],
   ['The list','Four actions: feature flags; extra engineers for billing and personalization; make both self-service for new items; onboard food storage, then migrate it as the pilot.'],
   ['Writing it up','Fran is the main author, with you and Geneva editing. The document is honest about trade-offs and rejected options. You align with Jesse, test the draft on allies, then share more widely. The story gets tighter each time.']],
   'Everyone had a long wish list. The guiding policy kept the action list short, and every action had people behind it.');}},
{part:2,src:'Chapter 3 · Diagnosis',pts:6,run(L){
  L.h(L.kick('pr','Sort the strategy')+'<h1 class="q">Where did each of these end up in SockMatcher’s strategy?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Diagnosis','Set aside','Action'],[
   ['New features need complex changes to shared billing and personalization logic',0,'That’s the heart of the diagnosis: tangled shared components.'],
   ['The external API isn’t versioned',1,'A real problem, but deliberately set aside for now.'],
   ['Add a feature-flag system for staged rollouts and quick rollbacks',2,'An action that makes the risky refactoring safer.'],
   ['A much faster matching algorithm',1,'A real opportunity, but not this strategy’s focus.'],
   ['Teams keep breaking each other’s work, causing long outages',0,'Part of the diagnosis: coupling makes changes risky.'],
   ['Move engineers onto the billing and personalization teams',2,'An action, paid for with Jesse’s headcount.']],
   'A diagnosis explains what’s going on, the set-aside list shows what you saw but chose not to tackle, and actions commit people.');}},

/* ---------- PART 4: LAUNCH ---------- */
{part:3,src:'Chapter 3 · The Launch',run(L){
  L.h(L.kick('ex','The launch')+'<h1 class="q">Not universally loved, and still a success</h1>');
  L.beats(L.card,[
   ['The grumbling','Some colleagues find it boring, no more visionary than their own ideas. Some say you should have just decided, since the answer was obvious.'],
   ['The dissent','Others say it’s wrong: one group still wants microservices, another wants a focus on load spikes, and some food-storage engineers dislike working in the monolith.'],
   ['Why it holds','None of it is news. The downsides and alternatives were already written down, so the grumbling doesn’t change the plan.'],
   ['The support','Most people are energized by one official direction. Allies from the start are strongest. The OKR adds visibility, and the directors staff it. Even Jody offers help: her team will build the feature flags.'],
   ['A year later','You stay on, working on billing and advising on personalization. Food storage launches. Next comes board-game pieces, which can use the new self-service parts right away. The monolith team finally has time for resilience.']],
   'Focus removed one barrier that was slowing everyone. A boring, staffed plan beat many exciting, unstaffed ones.');}},
{part:3,src:'Chapter 3 · To Recap',run(L){
  L.h(L.kick('learn','Chapter 3 in six lines')+'<h1 class="q">What to carry forward</h1>'+
   L.list([['A vision describes a future state. A strategy describes a plan of action.',''],
     ['It’s a group effort: a small core group, plus information and goodwill from a wider one.',''],
     ['Plan up front how it becomes real. That usually means an executive sponsor.',''],
     ['Agree deliberately on the type of document and the scope.',''],
     ['Expect many rounds of talking, refining, deciding, writing and realigning. It takes time.',''],
     ['Your vision or strategy is only as good as the story you can tell about it.','']],1));
  L.done();}},
{part:3,src:'Chapter 3 · The Launch',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">After launch, a senior engineer complains that SockMatcher’s strategy is “boring” and argues again for microservices. What does the case suggest?</h1>');
  L.mc(L.card,['Expected: the trade-offs were documented, so the plan stands','Rewrite it to sound more visionary and win them over','Reopen the debate until the engineer is persuaded'],0,
   'Showing your work meant the objection had already been weighed. Boring is fine, and the grumbling doesn’t change the plan.',
   'Chasing every critic would undo the decision. The alternatives were already weighed and written down. A boring, staffed plan is a good result.');}},
{part:3,src:'Chapter 3 · Case Study: SockMatcher',pts:1,run(L){
  L.h(L.kick('pr','Put it in order')+'<h1 class="q">Tap the steps of the SockMatcher strategy in the order they happened.</h1>');
  L.order(L.card,['Learn why earlier attempts failed','Win a sponsor','Recruit co-authors and allies','Agree on the scope','Write the diagnosis','Choose the guiding policy','Agree on the actions','Launch and stay with it'],
   'Approach first (failures, sponsor, people, scope), then writing (diagnosis, policy, actions), then launch. The same three phases as the chapter.');}},
{part:3,src:'Chapter 3 · The Launch',pts:1,run(L){
  L.h(L.kick('pr','Back at Usherly')+'<h1 class="q">Quinn’s “No more Saturdays” strategy has launched. Some say it’s “just a waiting room.” Another group still wants a Box Office rewrite. What should Quinn take from SockMatcher?</h1>');
  L.mc(L.card,['Add the rewrite to the plan so that group feels heard','Pause the work until everyone is enthusiastic about it','Keep going: those objections were already weighed and written'],2,
   'Same lesson, different company. Boring is fine, the rewrite was considered and rejected in writing, and a staffed plan with a sponsor is a success.',
   'Adding the rewrite would undo a real decision, and waiting for enthusiasm could take forever. The objections were weighed and documented. Keep going.');}}
  ]
});
</script>
</body>
</html>
