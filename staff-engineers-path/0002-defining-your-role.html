<html lang="en">

<title>Defining Your Role</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0002', title:'Defining your role', minutes:20, icon:'compass',
  goals:['Describe what every staff role shares: leader, technical, autonomous','Spot a scope that’s too broad or too narrow','Write a role description your manager agrees with'],
  parts:['What’s constant','Where you sit','Role shape','Focus and fit'],
  read:'Read the second half of chapter 1 for the full role-description example and the “Is that your job?” stories.',
  glossary:{
    'skip-level':'Skip-level meeting: a one-on-one with your manager’s manager.',
    'tlm':'Tech lead manager (TLM): a hybrid role that is both the technical leader and the people manager of a team.',
    'side-quest':'Side quest: a task off your main mission, like an optional mission in a video game.',
    'role-description':'Role description: a short written plan of what your job is, what you focus on and what success looks like.'
  },
  cheatsheet:[
    'Staff is a <b>leadership</b> role without reports: you’re the manager’s counterpart and often the “someone” who should do something. Introverts welcome; jerks not.',
    'It’s a <b>technical</b> role, but not always a coding one. What matters is that problems get solved, not how.',
    '<b>Autonomy</b>: create your own backlog, defend your time, and speak up if a request would cause harm.',
    'Reporting <b>high</b> = broad context, less manager time. Reporting <b>low</b> = more attention, less influence; add skip-levels.',
    '<b>Scope</b> too broad: bottleneck, decision fatigue, side quests, missing relationships. Too narrow: overshadowing, overengineering, opportunity cost.',
    '<b>Role shape</b>: depth- or breadth-first, Zunger’s four disciplines, how much you code, delayed gratification, TLM, Larson’s four archetypes.',
    '<b>Primary focus</b>: is it important, and does it need <i>you</i>? Then write a role description and align with your manager.',
    'Your job is to make your <b>organization</b> successful, even when that’s not in anyone’s job description.'
  ],
  steps:[
/* ---------- PART 1: WHAT’S CONSTANT ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">At the end of a Box Office meeting, six engineers agree “someone should write this decision down.” Nobody does. Quinn is the most senior person there. Who is that “someone”?</h1>');
  L.mc(L.card,['Ezra, since they’re the manager','Most likely Quinn'],1,
   'The book says that whenever there’s a feeling of “someone should do something,” there’s a good chance the someone is the staff engineer.',
   'Ezra wasn’t even in the room. The book says when “someone should do something,” there’s a good chance that someone is the staff engineer.');}},
{part:0,src:'Chapter 1 · You’re Not a Manager, but You Are a Leader',run(L){
  L.h(L.kick('learn','Not a manager, but a leader')+'<h1 class="q">You lead, just without anyone reporting to you</h1>'+
   L.prose('A staff engineer is the <b>counterpart of a manager</b> at the same level, and is expected to be just as much “the grown-up in the room.” You can’t opt out: bigger projects need people to agree with you, and others copy whoever has the big title.')+
   L.lanes([['x','What you don’t do','Manage anyone’s performance, approve vacations or expenses, hire, fire or promote.',4],
            ['check','How you lead instead','Design “happy paths” that stop common mistakes, give reviews that build confidence, teach, set direction, and earn trust as a great technologist.',2]])+
   L.note('<b>Introverts welcome. Jerks not.</b> You don’t have to love being around people. You do have to be a role model and treat people well. A brilliant but difficult engineer is a liability, because others’ work and growth suffer.','people'));
  L.done();}},
{part:0,src:'Chapter 1 · You’re in a “Technical” Role',run(L){
  L.h(L.kick('learn','A technical role')+'<h1 class="q">Deeply technical, but not always coding</h1>'+
   L.prose('You need real technical depth: high standards, reviews that make the code better, and enough understanding of trade-offs to explain them to others. When you argue for a change, you have to know what you’re talking about.')+
   L.prose('That doesn’t mean writing lots of code. Often the best use of your time is the design or leadership work only you can do.')+
   L.flow([['alert','Messy problem','ambiguous, hard','',4],['pencil','Staff engineer','does just enough to make it manageable','',2],['person','Less senior engineer','takes it on and grows','',1]])+
   L.prose('Some staff engineers solve problems through code, others through documents, data analysis or many one-on-ones. What matters is <b>that</b> the problem gets solved, not <b>how</b>.'));
  L.done();}},
{part:0,src:'Chapter 1 · You Aim to Be Autonomous',run(L){
  L.h(L.kick('learn','Autonomous, sets direction, communicates')+'<h1 class="q">Three more things every staff role shares</h1>'+
   L.list([['compass','You aim to be autonomous','Your manager shares context, but you tell them what’s important as much as they tell you. You defend your own time and make your own call on requests, weighing priority, time and the relationship.'],
     ['map','You set technical direction','Make sure big technical decisions get made, get made well and get written down. You don’t have to invent them all, or even any of them.'],
     ['chat','You communicate often and well','Almost everything you do moves information between brains. The better you’re understood, the easier the job.']],2)+
   L.quote('You create it!','Sabrina Leandro, on where to find a backlog of high-impact work')+
   '<p class="small">Autonomy comes with responsibility: if you’re asked to do something harmful, speak up. Don’t let a disaster unfold quietly.</p>');
  L.done();}},
{part:0,src:'Chapter 1 · You Set Technical Direction',run(L){
  L.h(L.kick('ex','Quinn’s first week')+'<h1 class="q">The axioms in action</h1>');
  L.beats(L.card,[
   ['A request','A product manager asks Quinn to build a small reporting script. Quinn weighs it: a midlevel engineer could do it, and the relationship matters. Quinn suggests a teammate and offers to review it.'],
   ['A direction gap','Three Box Office teams have argued about seat-map caching for months. Quinn doesn’t design it alone. They make sure a decision gets made, made well, and written down.'],
   ['A worrying ask','Ezra wants a Box Office change shipped the week of a stadium on-sale. Quinn sees real risk of an outage and says so clearly, instead of quietly doing it.'],
   ['A messy problem','Nobody understands why checkout slows during surges. Quinn digs in just enough to split it into clear pieces, then hands one to a less senior engineer as a growth opportunity.']],
   'Quinn is leading, technically and autonomously, without managing anyone. Each move solves the problem without Quinn doing all the work.');}},
{part:0,src:'Chapter 1 · You Set Technical Direction',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Two Ticketing teams can’t agree how event pages should load seat maps. What’s Quinn’s job, according to the book?</h1>');
  L.mc(L.card,['Design the answer alone and announce it to both','Make sure a good decision gets made and written down','Stay out, since neither team reports to Quinn'],1,
   'Yes. Setting direction means ensuring an agreed, well-understood solution exists, not inventing every piece yourself.',
   'Setting technical direction doesn’t mean inventing it all, and it doesn’t mean staying out. It means making sure a good decision gets made, made well and written down.');}},
{part:0,src:'Chapter 1 · Enough Philosophy. What’s My Job?',pts:6,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Does it fit the staff role?',['Fits the role','Doesn’t fit'],[
   ['Quinn approves Mika’s vacation request.',1,'Staff engineers usually don’t manage anyone’s vacation, expenses or performance.'],
   ['Quinn builds a safe default for seat-map queries so teams can’t make a common mistake.',0,'Designing “happy path” solutions that protect other engineers is a form of leadership.'],
   ['A brilliant Usherly engineer ships fast but belittles people in every review.',1,'However strong their output, an engineer who drags down others’ work and growth is a liability.'],
   ['A quiet engineer rarely speaks in meetings but sets direction through clear written designs.',0,'Introverts can set strong technical direction through judgment and good influence.'],
   ['Ezra asks for something Quinn thinks will cause an outage, and Quinn does it without a word.',1,'Autonomy brings responsibility. If a request looks harmful, speak up.'],
   ['Quinn spends a day in documents and data, not code, and solves the problem.',0,'What matters is that the problem gets solved, not how.']]);}},

/* ---------- PART 2: WHERE YOU SIT ---------- */
{part:1,src:'Chapter 1 · Where in the Organization Do You Sit?',run(L){
  L.h(L.kick('learn','Reporting high or low')+'<h1 class="q">Who you report to changes what you see</h1>'+
   L.prose('There’s no industry standard for where staff engineers report. It affects your support, the information you get and how others see you.')+
   L.lanes([['trend','Reporting “high”','To a director or VP. <b>Gains:</b> broad, high-level information and big problems; you learn by watching a senior leader. <b>Costs:</b> less of your manager’s time, less visibility into your work, and you may feel cut off from a team.',2],
            ['person','Reporting “low”','To a line manager. <b>Gains:</b> more attention, a likely advocate, closeness to one area. <b>Costs:</b> less influence across the org, filtered information, and maybe a manager less experienced than you.',3]])+
   L.note('Reporting low? Hold '+L.g('skip-level','skip-level meetings')+' with your manager’s manager to stay connected to the wider goals.','info'));
  L.done();}},
{part:1,src:'Chapter 1 · Reporting “high”',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Noa reports to the VP of Engineering. Which downside should Noa watch for most?</h1>');
  L.mc(L.card,['Information that is filtered down to one team’s problems','Too little influence outside a single team','Too little of the VP’s time to see and back Noa’s work'],2,
   'Right. Reporting high gives broad context, but a busy senior manager has less time and visibility to advocate for you.',
   'Filtered information and low influence are risks of reporting <i>low</i>. Reporting high usually costs you your manager’s time and visibility.');}},
{part:1,src:'Chapter 1 · What’s Your Scope?',run(L){
  L.h(L.kick('learn','Scope')+'<h1 class="q">Your scope is the area you feel responsible for</h1>'+
   L.prose('Your '+L.g('scope','scope')+' is the domain or teams you pay close attention to, even without a formal title there. Ezra and Quinn agree Quinn’s scope is the <b>Ticketing group plus Box Office</b>. Inside it, Quinn should:')+
   L.list([['target','Shape goals','Have influence on short- and long-term goals.'],
     ['eye','Know the big decisions','Be aware of them and have opinions.'],
     ['shield','Speak for others','Represent people without the leverage to stop poor decisions that affect them.'],
     ['leaf','Grow the next seniors','Notice projects and openings that would help others grow.']],3)+
   '<p class="small" style="margin-top:10px">Scope isn’t a fence. In an outage there’s no “not my job,” and part of a staff engineer’s value is <i>not</i> staying in their lane. Still, be very clear what your scope is.</p>');
  L.done();}},
{part:1,src:'Chapter 1 · What’s Your Scope?',pts:1,
 solve:async L=>{const c=L.$('#sc').children;c[0].click();c[1].click();c[2].click();},
 run(L){
  const S=[['One team only','Just the seat-map team',4,[['Lack of impact','Is this team critical enough to need a staff engineer?'],['Opportunity cost','Others forget to call Quinn for bigger problems elsewhere.'],['Overshadowing','Quinn takes every tricky problem, so nobody else learns.'],['Overengineering','With time to spare, Quinn builds far too much for simple problems.']]],
           ['Agreed scope','Ticketing group plus Box Office',2,[['Room to go deep','A critical area where Quinn can build influence and solve problems fully.'],['Room to step out','In a crisis, Quinn still helps wherever needed.']]],
           ['Anything at all','Any problem at Usherly',4,[['Lack of impact','Endless side quests, and no story of what Quinn achieved.'],['Bottleneck','Every decision waits until Quinn is in the room.'],['Decision fatigue','Quinn spends energy deciding what to do.'],['Missing relationships','Too many teams to know any of them well.']]]];
  const seen=new Set();
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Slide Quinn’s scope from narrow to broad. Watch what goes wrong at each end.</h1><div id="sc" style="display:flex;flex-wrap:wrap;gap:8px"></div>'+
   '<div style="background:var(--soft);border-radius:16px;padding:12px;margin:10px 0 6px;min-height:150px" id="sv"><div class="small">Pick a scope above.</div></div><div id="sq"></div>');
  S.forEach((x,j)=>{const b=document.createElement('button');b.className='chip';b.innerHTML=L.ic(['person','target','people'][j])+x[0];
    b.onclick=()=>{[...L.$('#sc').children].forEach(y=>y.classList.remove('sel'));b.classList.add('sel');seen.add(j);
      L.$('#sv').innerHTML='<div class="small" style="margin:0 0 8px"><b>'+x[1]+'</b></div>'+x[3].map(r=>'<div style="display:flex;gap:8px;margin:6px 0;color:var(--'+(x[2]===2?'ok':'no')+')">'+L.ic(x[2]===2?'check':'alert')+'<div><b>'+r[0]+'.</b> <span style="color:var(--ink)">'+r[1]+'</span></div></div>').join('');
      if(seen.size===3&&!L.$('#sq').innerHTML){const q=L.$('#sq');q.innerHTML='<h2 class="sub">A midlevel Box Office engineer hasn’t had a hard problem in months, because Quinn takes them all. Which problem is this?</h2>';
        L.mc(q,['Scope too broad: decision fatigue','Scope too narrow: overshadowing others'],1,
         'Yes. With too little to do, a staff engineer soaks up every tricky problem and others lose their chances to learn.',
         'Decision fatigue is about the cost of choosing among too many things. Taking every hard problem from less senior people is overshadowing, a sign of a scope that’s too narrow.');}};
    L.$('#sc').appendChild(b);});}},
{part:1,src:'Chapter 1 · What’s Your Scope?',pts:6,run(L){
  L.h(L.kick('pr','Too broad or too narrow?')+'<h1 class="q">Each of these is a warning sign. Which way is the scope off?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Too broad','Too narrow'],[
   ['Box Office teams wait for Noa before deciding anything',0,'When a senior person seems to do everything, they become a bottleneck.'],
   ['Quinn builds an elaborate framework for a simple form',1,'Overengineering often comes from a staff engineer without a hard enough problem.'],
   ['Mika’s team never gets support from a “local” staff engineer',0,'Spread across too many teams, you miss the relationships and they miss your mentoring.'],
   ['Product teams forget Quinn exists when Payments needs help',1,'That’s opportunity cost: stuck on one team, you’re not top of mind elsewhere.'],
   ['Noa ends each day tired from choosing among endless requests',0,'Decision fatigue is the constant cost of picking what to do when anything could be yours.'],
   ['A senior engineer on Quinn’s team stops volunteering for tough bugs',1,'Overshadowing: if you take every tricky problem, nobody else gets the experience.']],
   'Too broad: bottleneck, decision fatigue, missing relationships, endless side quests. Too narrow: overshadowing, overengineering, opportunity cost. Both can mean a lack of impact.');}},
{part:1,src:'Chapter 1 · Reporting “low”',pts:1,run(L){
  L.h(L.kick('pr','Your call')+'<h1 class="q">Hollis, a staff engineer in Payments, reports to a line manager. Hollis keeps hearing about org priorities weeks late. What should Hollis try first?</h1>');
  L.mc(L.card,['Ask for regular skip-level meetings with the director','Quietly stop sharing work updates with the manager','Wait for the line manager to pass more news along'],0,
   'Yes. Skip-level meetings keep you connected to the wider goals. Be clear you’re not trying to go around your manager.',
   'Hollis’s manager probably doesn’t have the information either. The book suggests skip-level meetings with the manager’s manager, framed as staying connected, not reporting on them.');}},

/* ---------- PART 3: ROLE SHAPE ---------- */
{part:2,src:'Chapter 1 · What Shape Is Your Role?',run(L){
  L.h(L.kick('learn','Role shape')+'<h1 class="q">Depth-first or breadth-first, and the four disciplines</h1>'+
   L.lanes([['down','Depth-first','Focus closely on one problem or technology. Quinn, six years deep in Box Office.',1],
            ['layers','Breadth-first','Go wide across teams, diving in only when needed. Noa, across all of Platform.',2]])+
   L.prose('Neither is wrong, but it helps when your preference matches your scope. Yonatan Zunger lists <b>four disciplines</b> every team needs:')+
   L.list([['Core technical skills','Coding, or whatever the role’s core craft is.'],
     ['Product management','What needs doing and why, and keeping the story of the work.'],
     ['Project management','Tracking tasks, spotting what’s blocked and getting it unblocked.'],
     ['People management','Turning people into a team and growing their skills and careers.']],3)+
   '<p class="small" style="margin-top:10px">You’ll use all four, but needn’t be great at all. If you hate one, partner with someone who loves it. It’s hard to keep growing with only the core technical skills.</p>');
  L.done();}},
{part:2,src:'Chapter 1 · What Shape Is Your Role?',run(L){
  L.h(L.kick('learn','More questions about shape')+'<h1 class="q">Three more questions to ask yourself</h1>'+
   L.tiers([['pencil','How much do you want to code?','Some staff engineers review code but rarely write it; some code daily; some find small, non-critical projects to scratch the itch. If you need code every day, don’t take a broad influence role with no time for it.'],
            ['clock','How’s your delayed gratification?','Code gives fast feedback. Strategy, culture change and big projects can take months to show results. If that will stress you, ask a manager you trust for regular, honest check-ins.'],
            ['people','One foot on the manager track?','A '+L.g('tlm','tech lead manager')+' leads a team technically and manages it too. It’s famously hard to do both without feeling you’re failing at one.']]));
  L.done();}},
{part:2,src:'Chapter 1 · Do any of these archetypes fit you?',run(L){
  L.h(L.kick('ex','Will Larson’s four archetypes')+'<h1 class="q">Four common patterns for staff roles. Tap each one.</h1>');
  L.flips(L.card,[
   ['Tech lead','Partners with managers to guide how one or more teams execute.'],
   ['Architect','Owns technical direction and quality across a critical area.'],
   ['Solver','Wades into one difficult problem at a time.'],
   ['Right hand','Adds leadership bandwidth to an organization.']],
   'They’re not boxes you must fit into. If your role mixes several, or none, that’s fine. They just give you words to describe how you like to work.');}},
{part:2,src:'Chapter 1 · Do any of these archetypes fit you?',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Noa is responsible for the technical direction and quality of Usherly’s whole infrastructure area. Which archetype fits best?</h1>');
  L.mc(L.card,['Solver','Tech lead','Architect','Right hand'],2,
   'Yes. Direction and quality across a critical area is the architect archetype.',
   'A solver takes one hard problem at a time; a tech lead guides teams’ execution; a right hand adds leadership bandwidth. Direction and quality across an area is the architect.');}},
{part:2,src:'Chapter 1 · Which of the “four disciplines” do you gravitate toward?',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which discipline?',['Core technical','Product management','Project management','People management'],[
   ['Quinn rewrites the seat-locking code so it survives a surge.',0,'Doing the core craft of the role, here coding, is core technical skill.'],
   ['Quinn keeps a clear story of why the Till migration matters and what it’s for.',1,'Deciding what needs doing and why, and keeping the narrative, is product management.'],
   ['Quinn spots that two Till tasks are blocked and gets them moving again.',2,'Tracking tasks and unblocking them is project management.'],
   ['Quinn helps Mika plan their path toward a staff promotion.',3,'Building someone’s skills and career is people management.'],
   ['Quinn tracks which of the 14 teams have moved off Till, and by when.',2,'Tracking progress and removing chaos is project management.']]);}},
{part:2,src:'Chapter 1 · How’s your delayed gratification?',pts:1,run(L){
  L.h(L.kick('pr','Your call')+'<h1 class="q">Quinn loves the quick feedback of passing tests. Ezra suggests a project to change how teams handle on-call, which may take months to show results. Quinn is anxious about it. What does the book suggest?</h1>');
  L.mc(L.card,['Turn it down and only take coding work from now on','Take it, and ask Ezra for regular, honest check-ins','Take it, and judge success by how busy the week felt'],1,
   'Right. With long feedback loops, ask a manager you trust to tell you regularly how it’s going, or pick projects that pay off sooner.',
   'Refusing everything slow rules out much of the staff job, and busyness isn’t a signal. The book suggests honest, regular check-ins from a manager you trust.');}},

/* ---------- PART 4: FOCUS AND FIT ---------- */
{part:3,src:'Chapter 1 · What’s Your Primary Focus?',run(L){
  L.h(L.kick('learn','Primary focus')+'<h1 class="q">Everyone wants you to care about something</h1>'+
   L.prose('A code-review guide wants your input. A hiring push needs you. A stalled deprecation needs a senior voice. That’s just Monday morning. Every yes is also a no to something else, so choose your '+L.g('primary-focus','primary focus')+' on purpose with two questions:')+
   L.lanes([['star','What’s important?','Your time has a high opportunity cost. Important work is often unglamorous: grungy data gathering, old code nobody reads. Know why it matters strategically, or do something else.',2],
            ['pointer','What needs you?','A midlevel engineer could do that coding task. Avoid projects that already have plenty of senior voices; an extra leader can even slow it down. Pick a problem that needs your attention.',1]]));
  L.done();}},
{part:3,src:'Chapter 1 · Aligning on Scope, Shape, and Primary Focus',run(L){
  L.h(L.kick('ex','Writing it down')+'<h1 class="q">Quinn and Ezra make the role explicit</h1>');
  L.beats(L.card,[
   ['The idea','The book suggests writing out your understanding of your job and sharing it with your manager. Its example is a breadth-first architect who lists time splits, goals, sample activities and what success looks like.'],
   ['Overview','Quinn drafts: “My primary focus is Box Office’s reliability during on-sales. About half my time on that, a third on Ticketing technical direction, the rest on reviews and mentoring.”'],
   ['Goals and activities','Guide Box Office’s direction; lead design reviews in Ticketing; act as extra leadership in incidents; mentor Mika.'],
   ['Success','“Big on-sales run without checkout outages, and Ticketing teams share a clear plan for Box Office.”'],
   ['The conversation','Ezra had assumed Quinn would mostly code Box Office features. Better to find that gap now than at performance review time. They agree on a version.'],
   ['Keep it fresh','It only needs to be <i>right enough</i>. If priorities change, Quinn writes a new one.']],
   'A written '+L.g('role-description','role description')+' removes ambiguity early, reminds you what you meant to do, and keeps you and your manager on the same page.');}},
{part:3,src:'Chapter 1 · What needs you?',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Quinn has room for one more project. Which one passes both “important?” and “needs you?”</h1>');
  L.mc(L.card,['Finding out, from old logs, why checkout fails in surges','A small Box Office bug fix any midlevel engineer could do','Joining Resale’s design, which has four senior leads already'],0,
   'Yes. It’s unglamorous, strategically important after the Saturday incident, and nobody else is on it.',
   'The bug fix doesn’t need a staff engineer, and Resale already has plenty of senior voices. The grungy surge investigation is important and needs Quinn.');}},
{part:3,src:'Chapter 1 · Aligning on Scope, Shape, and Primary Focus',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Tap each piece to build a strong overview line for Noa’s role description.</h1>');
  L.sentence(L.card,[['My focus is anything Platform needs,','My focus is Runway adoption,','My focus is writing Runway code,'],['about half my time,','whenever I find a spare moment,'],['and success means most teams deploy with Runway.','and success means I stayed very busy.']],[1,0,0],
   [['“Anything” is a scope with no edges: side quests, bottlenecks and no story of what you achieved.','Coding may be part of it, but a focus should name the important problem, not the activity.'],['A focus needs a real share of your time, or it never gets done.'],['Busyness isn’t success. Name an outcome your manager can recognize.']],
   'It names an important problem, commits real time and says what success looks like, just like the book’s example.');}},
{part:3,src:'Chapter 1 · Is That Your Job?',pts:1,run(L){
  L.h(L.kick('pr','Your call')+'<h1 class="q">During a huge on-sale, Usherly’s door-scanning app fails at three venues. Support is overwhelmed and organizers need calls back. It’s not Quinn’s scope or skill set. What should Quinn do?</h1>');
  L.mc(L.card,['Stay on Box Office work, since venues are not in scope','Write up a scope note on who should own this next time','Help however the situation actually needs right now'],2,
   'Yes. Your job is to make the organization successful. In a crisis there’s no “not my job,” even if it means work in nobody’s job description.',
   'A follow-up note can come later. The book is clear: your job is ultimately what the organization needs, and in a crisis scope doesn’t limit you.');}}
  ]
});
</script>
</body>
</html>
