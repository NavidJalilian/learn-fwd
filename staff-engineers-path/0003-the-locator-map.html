<title>The Locator Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">

</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0003', title:'The locator map: getting perspective', minutes:20, icon:'map',
  goals:['Name the three maps and what each one is for','Spot the four risks of seeing only your own group','Use outsider, customer and “solved before?” checks to see what’s important'],
  parts:['Three maps','Where you stand','Seeing bigger','What matters'],
  read:'Read the first half of chapter 2 for the full “outsider view” story and the author’s list of industry resources.',
  glossary:{
    'fog-of-war':'Fog of war: in strategy games, the parts of the map you haven’t explored yet and so can’t see. The book uses it for the parts of your organization you don’t understand yet.',
    'virtual-team':'Virtual team: the group of staff (or principal) engineers across different groups who treat each other as teammates, even though they sit in different parts of the org chart.',
    'always-true':'Objectives that are always true: goals so obvious nobody writes them down until they’re in danger, like staying in business, paying everyone and keeping a good reputation.',
    'slo':'SLO (service level objective): a target for how often a service is up and working, such as 99.95% of the time (“three and a half nines”).',
    'prior-art':'Prior art: solutions that already exist, inside or outside your company, for the problem you’re looking at.'
  },
  cheatsheet:[
    'Three maps: <b>locator</b> (where you are), <b>topographical</b> (how to get around), <b>treasure</b> (where you’re all going). They already exist; your job is to clear the fog.',
    'Knowing things takes <b>skill</b> (pay attention, note “that’s interesting!” facts) and <b>access</b> (being where decisions get discussed).',
    'Seeing only your group risks: <b>prioritizing badly</b>, <b>losing empathy</b>, <b>tuning out background noise</b>, <b>forgetting what the work is for</b>.',
    'Take an <b>outsider view</b> all the time, but with humility: <b>respect what came before</b>.',
    'Escape the echo chamber: treat other staff engineers as <b>your team</b>, and befriend people outside engineering.',
    'Know what’s important <b>right now</b>, including the objectives that are <b>always true</b>. If you can’t explain why your work needs a staff engineer, rethink it.',
    'Measure success from the <b>user’s</b> point of view, and check whether the problem has <b>been solved before</b>.'
  ],
  steps:[
/* ---------- PART 1: THREE MAPS ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Quinn has worked on Box Office for six years. A new hire joins and, after two weeks, asks: “Why does every team deploy Box Office with a hand-edited script?” Who was more likely to notice that oddity?</h1>');
  L.mc(L.card,['Quinn, who knows the system best','The new hire, who sees it fresh'],1,
   'Someone new has no history with the script, so they see it as it really is. This lesson is about getting that fresh view even when you’re not new.',
   'Deep knowledge helps, but after six years Quinn has stopped noticing the script at all. Someone new sees it as it really is. This lesson is about getting that fresh view on purpose.');}},
{part:0,src:'Chapter 2 · Uh, Did Anyone Bring a Map?',run(L){
  L.h(L.kick('learn','Three maps')+'<h1 class="q">One map can’t show everything, so the book draws three</h1>'+
   L.prose('A hiking map doesn’t also show voting districts and subway lines. In the same way, the book splits the big picture of your work into three separate maps:')+
   L.tiers([['pointer','The '+L.g('locator-map','locator map'),'“You are here.” Where your group sits in the whole company, and how big it looks when you zoom out.','This lesson'],
            ['layers','The '+L.g('topographic-map','topographical map'),'The terrain: culture, obstacles, shortcuts, and how decisions really get made.','Next lesson'],
            ['star','The '+L.g('treasure-map','treasure map'),'Where everyone is trying to get to, and the stops along the way.','Next lesson']])+
   L.prose('You can treat these as a way of thinking, or actually sketch them. The book suggests comparing your map with a colleague’s to see where you disagree.'));
  L.done();}},
{part:0,src:'Chapter 2 · Clearing the Fog of War',run(L){
  L.h(L.kick('learn','The fog of war')+'<h1 class="q">The maps already exist. You just can’t see them yet.</h1>'+
   L.prose('In strategy games, the parts of the world you haven’t explored are hidden under the '+L.g('fog-of-war','fog of war')+'. As you scout around, the fog clears. Joining a company works the same way: most of the big picture is hidden at first.')+
   L.prose('Once you clear the fog, you can help other people see too:')+
   L.list([['pointer','Locator map','Helps teams understand their purpose, who their customers are and how their work affects others.'],
     ['layers','Topographical map','Shows the friction and gaps between teams, and opens up communication.'],
     ['star','Treasure map','Makes sure everyone knows exactly what they’re trying to achieve, and why.']],1));
  L.done();}},
{part:0,src:'Chapter 2 · Uh, Did Anyone Bring a Map?',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Quinn wants to know which teams will resist a change to Box Office, and who quietly influences the decision. Which map is that?</h1>');
  L.mc(L.card,['The locator map','The treasure map','The topographical map'],2,
   'Obstacles, friction and how decisions really get made are all part of the terrain.',
   'Resistance and hidden influence are features of the terrain: that’s the topographical map. The locator map is “you are here”; the treasure map is the destination.');}},
{part:0,src:'Chapter 2 · Uh, Did Anyone Bring a Map?',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which map answers this question?',['Locator map','Topographical map','Treasure map'],[
   ['“How big is Box Office compared with everything else Usherly does?”',0,'Zooming out to see your part in context is the locator map.'],
   ['“Where is Usherly trying to get to in the next two years?”',2,'The destination is the treasure map.'],
   ['“Why does every request to Wren’s team stall for weeks?”',1,'An obstacle in the terrain belongs on the topographical map.'],
   ['“Is our migration a goal in itself, or a stop on the way to something bigger?”',2,'Goals and the stops on the way to them are the treasure map.'],
   ['“Who outside Ticketing is affected when Box Office changes?”',0,'Seeing what sits along your borders is part of the locator map.']]);}},
{part:0,src:'Chapter 2 · Clearing the Fog of War',run(L){
  L.h(L.kick('learn','Knowing things')+'<h1 class="q">Clearing the fog takes skill and access</h1>'+
   L.prose('The author describes country walks with friends who spotted animal tracks in mud and tasty leaves in the grass, all of which she walked straight past. They weren’t smarter. They had <b>learned what to look for</b>.')+
   L.lanes([['eye','Skill: paying attention','Train your brain to think “That’s interesting!” and keep facts you might need later. If facts don’t stick, write them down until it becomes a habit.',2],
            ['lock','Access: being there','Noticing doesn’t help if you never hear the discussions that affect your work. You also need a way into the room where decisions happen.',3]])+
   L.note('Useful facts are anything that helps you or others understand the work, find a way through the organization, or move toward a goal.','bulb'));
  L.done();}},
{part:0,src:'Chapter 2 · Clearing the Fog of War',pts:1,run(L){
  L.h(L.kick('pr','Paying attention')+'<h1 class="q">At the company all-hands, marketing announces a huge campaign for a stadium tour going on sale in March. Why might Quinn write that down?</h1>');
  L.mc(L.card,['It hints at a traffic surge Box Office may not be ready for','It means Quinn should join the marketing planning meetings','It shows marketing is now Usherly’s top priority for the year'],0,
   'Exactly the kind of link the book describes: a marketing push can mean traffic spikes heading your way.',
   'The book’s point is spotting what a fact means for your work. A big marketing push can mean a traffic spike that Box Office isn’t ready for.');}},

/* ---------- PART 2: WHERE YOU STAND ---------- */
{part:1,src:'Chapter 2 · The Locator Map: Getting Perspective',run(L){
  L.h(L.kick('learn','Your view depends on where you stand')+'<h1 class="q">Deep focus brings depth, and four risks</h1>'+
   L.prose('Everyone you work with has their own “You are here” pin somewhere else on the map. The longer you spend inside one domain, the richer it gets, and the more it fills your view.')+
   L.list([['Prioritizing badly','When everyone around you cares about the same things, those things feel huge and other groups’ problems look simple. That’s how '+L.g('local-max','local maximum')+' decisions happen.'],
     ['Losing empathy','Like a fish-eye lens: your work looks huge and everyone else’s looks trivial. “I could solve that in a weekend.” In incidents, teams get lost in the technical puzzle and forget users are waiting.'],
     ['Tuning out background noise','You get so used to a messy config file or broken deploy that you stop seeing it, even as it slowly gets worse.'],
     ['Forgetting what the work is for','A project keeps running after its goal stopped mattering. Everyone does their little part; nobody owns the result, or the ethics of the whole.']],4));
  L.done();}},
{part:1,src:'Chapter 2 · The Locator Map: Getting Perspective',run(L){
  L.h(L.kick('ex','Inside the Box Office bubble')+'<h1 class="q">Four scenes from Quinn’s old team</h1>');
  L.beats(L.card,[
   ['Scene 1','The team spends a quarter building its own custom job scheduler for Box Office, sure its needs are unique. Nobody checks what other teams already use.'],
   ['Scene 2','Someone on the team says of the mobile app team: “They just draw screens. We could do their job in a week.”'],
   ['Scene 3','Every Box Office deploy needs a hand-edited script and 40 minutes of babysitting. Nobody complains anymore. It’s just how things are.'],
   ['Scene 4','Two years ago, the team started splitting out a “venue service” to support a partnership. The partnership ended last spring. The work continues.']],
   'Scene 1 is prioritizing badly, 2 is losing empathy, 3 is tuning out background noise, and 4 is forgetting what the work is for. All four come from spending too long looking only at your own patch.');}},
{part:1,src:'Chapter 2 · The Locator Map: Getting Perspective',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">During the Saturday incident, two engineers spend 15 minutes debating an interesting cache bug while checkout stays down. Which risk is that?</h1>');
  L.mc(L.card,['Tuning out background noise','Losing empathy','Prioritizing badly'],1,
   'The book names this case directly: absorbed in the technical details, teams forget users are waiting.',
   'The book uses incidents as its example of losing empathy: the puzzle becomes so interesting that the fans waiting to buy tickets drop out of view.');}},
{part:1,src:'Chapter 2 · The Locator Map: Getting Perspective',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Spot the risk',['Prioritizing badly','Losing empathy','Tuning out the noise','Forgetting what it’s for'],[
   ['The organizer-tools team says Platform’s on-call rotation is “basically nothing.”',1,'Thinking other groups’ work is trivial is the fish-eye lens of lost empathy.'],
   ['A flaky Box Office test fails one run in five. The team just clicks “retry” and has for a year.',2,'They’re so used to it they no longer see it as something to fix.'],
   ['Ticketing insists its logging needs are special and starts building a brand-new logging system.',0,'Treating your own problems as unique is how local maxima happen. Check for prior art first.'],
   ['A team is still tuning a recommendations widget for a homepage that was redesigned without it.',3,'The work goes on after its purpose went away.'],
   ['Each Resale team builds its own part, and nobody can say who checks that the whole flow is fair to fans.',3,'When everyone does their little part, nobody owns the end result, including its ethics.']]);}},
{part:1,src:'Chapter 2 · What’s actually important?',pts:1,
 solve:async L=>{L.$('#zo').click();},
 run(L){
  const P=[['Seat-map cache rewrite',0],['Surviving on-sale surges',1],['Box Office test cleanup',0],['Usherly Resale launch',1],['Renaming Box Office modules',0]];
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Here are the projects Quinn’s old team argues about most. Zoom out to the whole company and see which ones still show up.</h1>'+
   '<div style="background:var(--soft);border-radius:16px;padding:14px;margin:8px 0"><div class="small" id="zl" style="margin-bottom:8px">'+L.ic('pointer')+'Zoom: Box Office team</div><div id="zp"></div></div>'+
   '<button class="btn pri" id="zo">'+L.ic('eye')+'Zoom out to all of Usherly</button><div id="zq"></div>');
  const draw=out=>{L.$('#zp').innerHTML=P.map(p=>'<span class="chip static'+(out&&p[1]?' ok':'')+'" style="'+(out&&!p[1]?'opacity:.3;font-size:12px':'font-size:16px')+'">'+p[0]+'</span>').join('');};draw(false);
  L.$('#zo').onclick=function(){this.remove();draw(true);L.$('#zl').innerHTML=L.ic('pointer')+'Zoom: all of Usherly, about 20 teams';
    const q=L.$('#zq');q.innerHTML='<h2 class="sub">The team says the seat-map cache rewrite is the most important work at Usherly. What does the zoomed-out view suggest?</h2>';
    L.mc(q,['It may matter a lot locally but barely registers company-wide','It must be the top priority, since the team knows it best','It should be cancelled, since it’s invisible at company level'],0,
     'That’s the locator map’s lesson: a project can feel like the center of the universe and still be small on the big map. Small isn’t wrong; it just needs honest perspective.',
     'Neither extreme. Up close the rewrite looks huge; zoomed out it barely shows. That doesn’t make it worthless, but it shouldn’t be ranked above work the whole company depends on.');};}},

/* ---------- PART 3: SEEING BIGGER ---------- */
{part:2,src:'Chapter 2 · Taking an outsider view',run(L){
  L.h(L.kick('learn','Take an outsider view')+'<h1 class="q">A new person can always see the problems</h1>'+
   L.prose('The author recalls being the new person on an infrastructure team whose face gave away what she thought of the old systems. Two years later, after a lot of good work, a newer hire made the very same face at <i>her</i> architecture. She had become an insider.')+
   L.prose('Newcomers haven’t lived through the slow, gradual changes, so they see the situation raw. A staff engineer should try to keep that view <b>all the time</b>. Ask:')+
   L.list([['eye','Only insiders get it?','Do our technical decisions only make sense to people who forgot there’s a world outside the team?'],
     ['clock','Would anyone notice?','If we stopped this work, how long before anyone else cared?'],
     ['target','Still on target?','Have we got so absorbed in the technology that we forgot the original goal?']],2)+
   L.note('<b>Being new isn’t a license to be a jerk.</b> Assume there were good reasons for how things are. The book points to an Amazon principal engineer tenet: respect what came before.','shield'));
  L.done();}},
{part:2,src:'Chapter 2 · Taking an outsider view',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">A new Ticketing engineer reads the Box Office order code and says in standup: “This is terrible. Why didn’t they just use a queue?” What would the book want them to do?</h1>');
  L.mc(L.card,['Keep quiet until they’ve been here a full year','Raise it, but assume there were good reasons','Push to rewrite it now, while their view is fresh'],1,
   'Their fresh eyes are valuable, and so is humility. Ask what the reasons were before judging.',
   'Fresh eyes are worth using, so staying silent wastes them. But hindsight makes old choices look foolish. The book says to keep the outsider view <i>and</i> respect what came before.');}},
{part:2,src:'Chapter 2 · Escaping the echo chamber',run(L){
  L.h(L.kick('learn','Escape the echo chamber')+'<h1 class="q">The other staff engineers are your team too</h1>'+
   L.prose('If everyone around you holds the same opinions, other groups’ views can come as a shock. The author spent over a decade in infrastructure; working with product teams that moved fast and valued features as much as reliability made her views more nuanced.')+
   L.flow([['people','Your own group','where you spend your days','',1],['star','The '+L.g('virtual-team','virtual team'),'other staff engineers, one per group','',2],['chat','Beyond engineering','product, support, admin staff…','',3]],false)+
   L.prose('Build friendly relationships with other staff engineers, enough goodwill that you can tell each other hard truths without a fight. That includes hearing what other teams dislike about <i>your</i> group, and seeing what’s valid in it.'));
  L.done();}},
{part:2,src:'Chapter 2 · Escaping the echo chamber',run(L){
  L.h(L.kick('ex','Quinn crosses the chasm')+'<h1 class="q">How Quinn starts building a bigger view</h1>');
  L.beats(L.card,[
   ['The echo','In Ticketing, everyone agrees: Platform always says no and slows product teams down.'],
   ['A coffee','Quinn asks Noa for a regular coffee. Noa is a principal engineer in Platform and part of the staff+ virtual team.'],
   ['The hard truth','Noa says, kindly: Platform sees Ticketing ship surge-sensitive changes with no load testing, then page Platform at 2am.'],
   ['The valid part','Quinn checks. It’s true for two of the last three on-sale incidents. That’s worth fixing, not arguing about.'],
   ['Wider still','Quinn also gets lunch with a support lead, who explains which checkout errors fans complain about most.']],
   'Quinn didn’t give up Ticketing’s view. They added Platform’s and support’s, and found something real to fix in their own group.');}},
{part:2,src:'Chapter 2 · Escaping the echo chamber',pts:1,run(L){
  L.h(L.kick('pr','What next?')+'<h1 class="q">At a staff+ meeting, a Platform engineer says Ticketing “treats the load balancers like they’re free.” Quinn’s team is offended. What should Quinn do?</h1>');
  L.mc(L.card,['Defend Ticketing firmly, since the comment was unfair','Leave it to Ezra, since it’s now a cross-org issue','Find out what’s valid in it before responding'],2,
   'The book says to understand the negative opinions other teams hold about your group. Seeing what’s valid in them leads to better work.',
   'Defending or escalating skips the useful part. The book says to understand other teams’ negative opinions of your group: if part of it is valid, you’ll do better work.');}},

/* ---------- PART 4: WHAT MATTERS ---------- */
{part:3,src:'Chapter 2 · What’s actually important?',run(L){
  L.h(L.kick('learn','What’s actually important?')+'<h1 class="q">Technology is a means to an end</h1>'+
   L.prose('You’re there to help your company reach its goals, so you need to know them. They depend on the company: a startup, a tech giant and a local nonprofit care about different things. And they change, so know what matters <b>right now</b>.')+
   L.lanes([['trend','Customers leaving','because competitors have core features you lack: probably not the moment to push for a tech-debt focus.',4],
            ['leaf','Smooth sailing','with growth on the way: a great moment to make sure the foundations are solid.',2]])+
   L.prose('Some goals are never written down. The book calls them the '+L.g('always-true','objectives that are always true')+': keep existing, pay everyone, keep a good reputation. The product should work, customers should want it, and deploying it shouldn’t be painfully slow.'));
  L.done();}},
{part:3,src:'Chapter 2 · What’s actually important?',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Organizers are leaving Usherly for a rival because it offers reserved seating maps and Usherly doesn’t. Quinn has a plan to spend a quarter on Box Office tech debt. Is now a good time?</h1>');
  L.mc(L.card,['Yes: debt work always pays off in the end','Probably not: the missing feature matters more now'],1,
   'The book’s own example: when customers leave over missing core features, it’s probably not the time to push for a tech-debt focus.',
   'Debt work can be valuable, but priorities depend on the moment. With customers leaving over a missing feature, the book says it’s probably not the time.');}},
{part:3,src:'Chapter 2 · What’s actually important?',pts:5,run(L){
  L.h(L.kick('pr','Stated or always true?')+'<h1 class="q">Sort Usherly’s goals: written in this year’s plan, or always true even if nobody says so?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Stated this year','Always true'],[
   ['Launch Usherly Resale next spring',0,'A specific, written goal for this year.'],
   ['Checkout keeps working during a stadium on-sale',1,'The product should work. Nobody writes that down until it fails, as on Saturday.'],
   ['Fans trust Usherly not to sell them fake tickets',1,'Reputation is one of the book’s examples of an objective that’s always true.'],
   ['Grow organizer sign-ups 20% this year',0,'A stated growth target.'],
   ['Engineers can ship a fix without a painfully slow deploy',1,'The book lists “deploying it shouldn’t be painfully slow” as always true.']],
   'Know the implicit goals as well as the written ones. The always-true ones usually only get said out loud when they’re in danger.');}},
{part:3,src:'Chapter 2 · What’s actually important?',run(L){
  L.h(L.kick('learn','Keep it current')+'<h1 class="q">Priorities change, and the fog rolls back in</h1>'+
   L.list([['people','Go to all-hands','For your own group and for others.'],
     ['person','Ask for skip-levels','One-on-ones with your manager’s manager.'],
     ['chat','Get face time','With customers, or with the teams that depend on you.'],
     ['info','Ask for context','If you don’t know why (or whether) your work matters, ask.']],2)+
   L.prose('When goals change, your scope or focus may need to change too. You don’t have to work on the <i>most</i> important thing. But if you can’t explain to yourself why your work needs a staff engineer, you might be doing the wrong thing.'));
  L.done();}},
{part:3,src:'Chapter 2 · What do your customers care about?',run(L){
  L.h(L.kick('learn','What do your customers care about?')+'<h1 class="q">Measure success from the user’s side</h1>'+
   L.prose('An '+L.g('slo','SLO')+' says how often a service should be up, like 99.95% of the time. Useful, but who decides what “up” means?')+
   L.quote('Nines don’t matter when users aren’t happy.','Charity Majors, CTO of Honeycomb, on a sticker she hands out')+
   L.prose('The book tells how a Microsoft team tracked down unreliable internet providers where Bing couldn’t be reached. Bing itself wasn’t broken, but users don’t care whose fault it is: a site works or it doesn’t.')+
   L.note('This applies even when your customers are other teams inside the company. If you don’t understand your customer, you don’t really know what’s important.','people'));
  L.done();}},
{part:3,src:'Chapter 2 · What do your customers care about?',pts:1,run(L){
  L.h(L.kick('pr','What next?')+'<h1 class="q">Box Office dashboards show 99.97% uptime this month. But support reports fans in one region can’t load seat maps, because a content delivery network there keeps failing. The team says “not our bug.” What should Quinn push for?</h1>');
  L.mc(L.card,['Count it as an outage and chase it down','Close it, since the dashboards are green','Raise the uptime target to 99.99%'],0,
   'From the fans’ side, Usherly is broken. Like the Bing team, Quinn measures success by what users experience.',
   'Green dashboards and higher targets both measure the system, not the fan. For those fans the site doesn’t work, whoever’s fault it is. Measure from their side.');}},
{part:3,src:'Chapter 2 · Have your problems been solved before?',run(L){
  L.h(L.kick('learn','Has it been solved before?')+'<h1 class="q">Your goal is to solve the problem, not to write code</h1>'+
   L.prose('The same Amazon tenet, respect what came before, reminds engineers that many problems aren’t really new. Study what others have done before you create something new.')+
   L.flow([['home','Inside the company','other teams, old projects, design docs'],['compass','Outside the company','conferences, newsletters, online communities'],['pencil','Then build','only what’s truly missing']])+
   L.prose('This is why design documents should list the alternatives considered. The author keeps up through conferences, newsletters and Slack groups for staff engineers; whatever your field, it has its own '+L.g('prior-art','prior art')+' and its own publications.'));
  L.done();}},
{part:3,src:'Chapter 2 · Have your problems been solved before?',pts:1,run(L){
  L.h(L.kick('pr','What next?')+'<h1 class="q">Mika proposes building a custom rate limiter in Payments to survive on-sale surges, and has sketched a design. What should Quinn suggest first?</h1>');
  L.mc(L.card,['Prototype it this sprint to prove it works','Check what already exists in and outside Usherly','Wait until after the next on-sale to decide'],1,
   'Rate limiting under traffic spikes is a well-known problem. Platform may already have something, and the industry certainly does.',
   'Building or waiting both skip the key question: has this been solved before? Many problems aren’t new, and the goal is to solve it, not to write code.');}},
{part:3,src:'Chapter 2 · The Locator Map: Getting Perspective',pts:6,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Mixed review: what should Quinn do?',['Zoom out','Talk to others','Check prior art','Ask the user'],[
   ['Quinn feels sure the seat-map rewrite is Usherly’s most important project.',0,'Look at it on the big map before ranking it.'],
   ['Ticketing is certain Platform is the problem, and nobody has asked Platform.',1,'Escape the echo chamber: hear the other side, and find what’s valid in it.'],
   ['A team wants to write its own feature-flag system from scratch.',2,'Many problems aren’t new. Look inside and outside the company first.'],
   ['The checkout error rate looks fine, but fans keep complaining checkout “hangs.”',3,'Measure success from the fans’ side, not just the dashboard’s.'],
   ['Quinn has never once talked to customer support about Box Office.',1,'Go beyond engineering: support knows what fans actually struggle with.'],
   ['Quinn’s team plans a custom queue for on-sale traffic.',2,'Check what other teams and the industry already use for surges.']]);}}
  ]
});
</script>
</body>
</html>
