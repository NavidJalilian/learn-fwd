<!doctype html>
<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Advice and Teaching</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">

</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0017', title:'Advice and teaching', minutes:20, icon:'people',
  goals:['Place any act of influence on the grid of four mechanisms and three tiers','Give advice people want: mentoring, answers, feedback and peer reviews that help','Teach so it sticks: clear goals, shadowing to reverse shadowing, reviews that teach and real coaching'],
  parts:['Scaling influence','Advice','Teaching','Coaching and classes'],
  read:'Read the first half of chapter 8 for the full code-review advice and the story of the learning path for short-term contributors.',
  glossary:{
    'mentoring':'Mentoring: sharing your own experience so someone else can use it. It centers on what you did and learned.',
    'coaching':'Coaching: helping someone solve a problem for themselves, through questions, listening and space, instead of giving them your answer.',
    'unsolicited':'Unsolicited advice: advice the other person didn’t ask for.',
    'peer-review':'Peer review: written feedback on a colleague, collected during a company’s performance cycle and read by their manager too.',
    'reverse-shadow':'Reverse shadowing: the learner does the task while the experienced person watches and gives notes afterwards.',
    'codelab':'Codelab: a guided, self-paced tutorial that walks a learner step by step through building something or solving exercises.'
  },
  cheatsheet:[
    'Four mechanisms of influence (<b>advice, teaching, guardrails, opportunity</b>) at three tiers (<b>individual, group, catalyst</b>). A menu, not a checklist.',
    'Don’t skip the small ones, and don’t chase catalyst work: joining an existing effort often beats starting a new one.',
    'Before advising, ask: was it asked for, and do I have the context? If unsure, ask “Can I offer some advice?” or “Do you want to vent, or advice?”',
    'Answer the question behind the question, without infodumping. Give honest, kind feedback. Peer reviews have two audiences; watch for bias.',
    'Scale advice by writing it down and using the microphone. Catalyst: set up advice flows that don’t need you.',
    'Teaching aims for understanding: set a concrete goal, let the learner do, leave them an artifact. Shadowing → pairing → reverse shadowing.',
    'Reviews that teach: know the assignment, explain why, show a better example, say what matters, choose battles, say “yes.”',
    '<b>Coaching</b>: open questions, active listening, making space. Scale with classes and codelabs; become a catalyst by teaching teachers.'
  ],
  steps:[
/* ---------- PART 1: SCALING INFLUENCE ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Each week, three different engineers ask Quinn the same question about how seat holds work in Box Office. What would save the most time over a year?</h1>');
  L.mc(L.card,['Answer each person kindly, one at a time','Write the answer down once and share the link'],1,
   'Right. Write it once and many people can read it. This lesson is about raising other people’s skills, and doing it at a scale that fits in your week.',
   'Kind answers help one person each time. Writing it down helps everyone who will ever ask, including people Quinn will never meet.');}},
{part:0,src:'Chapter 8 · Good Influence',run(L){
  L.h(L.kick('learn','Why level others up?')+'<h1 class="q">Being a good example is a start. Now be an active influence.</h1>'+
   L.prose('The last chapter was about being a role model: doing great work where others can see it. This chapter goes further, to active ways of raising the skills around you. When a colleague has gaps or lower standards, don’t get frustrated: bring them up a level. The book gives three reasons.')+
   L.list([['people','Better colleagues, better work','Even a brilliant soloist meets problems too big for one person. Work with more skilled people and your own work gets easier, and the software gets better.'],
     ['cycle','The industry keeps changing','Someday a new tool or way of working will need everyone on board. Without skill at teaching, getting teams to adopt it will be pure frustration.'],
     ['star','It’s the right thing to do','Teach a midlevel engineer well, and think of the people <i>they</i> will teach in ten years. You’re sending high standards into the future.']],1));
  L.done();}},
{part:0,src:'Chapter 8 · Scaling Your Good Influence',run(L){
  L.h(L.kick('learn','The grid')+'<h1 class="q">Four mechanisms, three tiers</h1>'+
   L.prose('As your '+L.g('scope','scope')+' grows, one-to-one help runs out of hours. So the book sorts influence two ways.')+
   L.tiers([['person','Individual','You grow one other person’s skills.','e.g. mentoring, pairing'],
            ['people','Group','You bring a skill or new approach to many people at once.','e.g. a talk, a class'],
            ['flame','Catalyst','You set up something that keeps working after you step away.','e.g. a mentoring program',true,'Lasts']])+
   L.flow([['chat','Advice','',''],['book','Teaching','',''],['shield','Guardrails','','next lesson'],['star','Opportunity','','next lesson']],false)+
   L.note('It’s a <b>menu, not a checklist</b>. Play to your strengths, and don’t skip the “small” tiers: a good code review ripples outward. Don’t chase '+L.g('catalyst','catalyst')+' work either: too many programs overwhelm people, and helping an existing effort often beats starting a new one. Do individual and group work first.','list'));
  L.done();}},
{part:0,src:'Chapter 8 · Scaling Your Good Influence',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Noa sets up a monthly tech-talk series, then hands it to three engineers who keep it running without Noa. Which tier is that?</h1>');
  L.mc(L.card,['Individual','Group','Catalyst'],2,
   'Right. The talks keep happening after Noa steps away. That’s what makes it catalyst influence.',
   'Giving one talk would be group influence. What makes this catalyst is that it keeps working without Noa.');}},
{part:0,src:'Chapter 8 · Scaling Your Good Influence',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which tier?',['Individual','Group','Catalyst'],[
   ['Quinn pairs with Mika for an afternoon on a tricky refund bug.',0,'One person’s skills grow. That’s individual influence.'],
   ['Quinn gives a talk to all of Product Engineering on what the Saturday incident taught.',1,'One talk, many listeners at once: group influence.'],
   ['Quinn convinces a manager to set up a mentoring program, which the manager then runs.',2,'Convincing someone else to set up a program still counts. It runs without Quinn.'],
   ['Noa writes a one-page guide on choosing between Runway and the old scripts.',1,'Written once, read by many: advice scaled to a group.'],
   ['Saskia leaves detailed notes on Mika’s first load-balancer change.',0,'A review for one person grows one person’s skills.']]);}},

/* ---------- PART 2: ADVICE ---------- */
{part:1,src:'Chapter 8 · Who Asked You?',run(L){
  L.h(L.kick('learn','Who asked you?')+'<h1 class="q">Advice is noisy, so check it’s wanted</h1>'+
   L.prose('Advice mixes good signal with bad, and it’s rarely tailored to the person getting it. Still, it’s how you pass on your successes and mistakes. Before giving it, check two things: did they <b>ask</b>, and do you have enough <b>context</b> to say something useful and not obvious?')+
   L.lanes([['chat','Solicited','They asked: for a recommendation, feedback, help deciding. Go ahead.',2],
            ['alert',L.g('unsolicited','Unsolicited'),'They didn’t ask. Ask first: “Can I offer some advice?” Some advice should come from friends, not strangers.',4]])+
   L.prose('Unsolicited advice can still be right when someone is stuck in a situation they can’t see out of, or when you have key information they lack, like knowing a platform they plan to use is about to be shut down.')+
   '<p class="small">Itching to advise on something nobody asked about? Write a blog post instead.</p>');
  L.done();}},
{part:1,src:'Chapter 8 · Mentorship',run(L){
  L.h(L.kick('learn','Mentoring and answering questions')+'<h1 class="q">Share your experience, and answer the real question</h1>'+
   L.quote('Sharing your experience so an engineer can leverage it themselves.','Neha Batra on mentoring, quoted in chapter 8')+
   L.list([['person','Your experience may not fit them','Advice like “be louder in meetings” can backfire for people who are judged differently, and old best practices may not fit today.'],
     ['chat','Find out what they need','They may want help, or reassurance, or to think out loud, or to vent. Ask: “Do you need to vent, or do you want advice?”'],
     ['cal','Set it up to succeed','Agree how often you’ll meet and for how long, and what you’re aiming for: settling in, a codebase, or career advice.'],
     ['info','Answer the question behind the question','Don’t guard knowledge by answering only what was asked. Don’t dump everything either. Ask what they’re trying to do.']],2));
  L.done();}},
{part:1,src:'Chapter 8 · Mentorship',run(L){
  L.h(L.kick('ex','At Usherly')+'<h1 class="q">Mika and Quinn make mentoring official</h1>');
  L.beats(L.card,[
   ['The ask','Mika asks Quinn to be their mentor “properly,” not just in hallway chats.'],
   ['Set it up','They agree on six weekly half-hour meetings and one aim: Mika wants to learn how to lead work across teams, a step toward staff.'],
   ['Week two','Mika starts describing a tense Payments meeting. Quinn feels the urge to say what they’d have done, and instead asks: “Do you want to vent, or do you want advice?”'],
   ['The answer','“Honestly, just vent.” Quinn listens, and says the meeting sounds hard for anyone. Mika leaves calmer, with no unasked-for lecture.'],
   ['Week four','This time Mika wants advice. Quinn tells a story from their own first cross-team project, and is clear it’s one experience, not a rule.']],
   'Structure up front, then find out what the person needs before offering what you know.');}},
{part:1,src:'Chapter 8 · Answering questions',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Mika asks: “Does the old refund endpoint return the seat number?” It doesn’t, but a newer endpoint does. What should Quinn say?</h1>');
  L.mc(L.card,['“No, it only returns the order number.”','“No, but the newer one does. What are you building?”','“No. Here’s how every refund endpoint we have works.”'],1,
   'Right. Quinn answers the question behind the question and asks what Mika is trying to do, without dumping everything.',
   'A bare “no” could cost Mika an hour of hacking around it. A full tour of every endpoint is an infodump. Answer the real need, then ask what they’re building.');}},
{part:1,src:'Chapter 8 · Feedback',run(L){
  L.h(L.kick('learn','Feedback and peer reviews')+'<h1 class="q">Kind, honest, and aware of who else is reading</h1>'+
   L.prose('When someone asks you to review a document, a pull request or a talk, point out what’s great, and be kindly honest about what isn’t. It takes effort to find the words, but hiding the truth wastes their time.')+
   L.prose('A '+L.g('peer-review','peer review')+' has <b>two audiences</b>:')+
   L.lanes([['person','The colleague','Take “What could they do better?” literally. Stuck? Ask what’s missing for them to be a level or two more senior.',2],
            ['eye','Their manager and others','They use it to judge and promote. Could your words be taken out of context? Give sensitive growth points privately instead.',3]])+
   L.note('Watch for bias. The same behavior gets called “consensus building” for one person and “indecisive” for another. Advice like “be more aggressive” helps some people and gets others in trouble.','alert'));
  L.done();}},
{part:1,src:'Chapter 8 · Scaling Your Advice to a Group',run(L){
  L.h(L.kick('learn','Advice for many')+'<h1 class="q">Write it once, say it to a room, then make it run without you</h1>'+
   L.flow([['pencil','Group: write it down','FAQs, how-tos, articles. One volunteer group put one-page testing tips up in office toilet stalls, and people read them.','',2],
           ['chat','Group: get a microphone','Talks, all-hands slots. You can frame the topic you were given to carry the message you care about.','',3],
           ['flame','Catalyst: advice flows','Make it easy for colleagues to advise each other without you.','',1]],false)+
   L.list([['Start writing culture small','In an oral culture, don’t demand that everything be written. Try a FAQ of common interruptions, or a documentation day.'],
     ['Talk series need a crew','Recruiting talks and sending reminders is real work. Plan the time and start with at least three people.'],
     ['Mentoring programs are heavy','The admin takes longer than expected. A manager may find it easier to make it part of their job.']],4));
  L.done();}},
{part:1,src:'Chapter 8 · Who Asked You?',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'What should Quinn do with this advice?',['Ask first, then offer','Offer it, it’s key info','Write a post instead'],[
   ['Mika plans to build a new service on the old deploy scripts. Quinn knows the scripts are being retired.',1,'Mika lacks key information. That’s a case where unsolicited advice clearly helps.'],
   ['Quinn has strong opinions on how teams in general should name their database tables. Nobody has asked.',2,'A topic nobody asked about, with no one person in need: a blog post or article fits better.'],
   ['After a talk, Quinn noticed that a new teammate spoke to the floor and was hard to hear.',0,'Hard but kind feedback can help. Since it wasn’t asked for, check first that it’s welcome.'],
   ['Hollis starts telling Quinn about a stressful week on the Payments team.',0,'Maybe Hollis wants advice, or maybe just to vent. Asking first avoids derailing them.']]);}},

/* ---------- PART 3: TEACHING ---------- */
{part:2,src:'Chapter 8 · Teaching',run(L){
  L.h(L.kick('learn','Telling vs teaching')+'<h1 class="q">Teaching aims for understanding</h1>'+
   L.prose('With advice, you share how <i>you</i> see things, and they can take it or leave it. Teaching goes further: the other person should make the knowledge their own. Anywhere there’s a knowledge gap, there’s a chance to teach, whoever is more senior.')+
   L.prose('Great classes <b>unlock</b> a topic: you leave with something to build on. So set a concrete goal, the way a teacher writes a lesson plan:')+
   L.list([['map','System overview','By the end, they can draw it on a whiteboard and explain it to someone else.'],
     ['pencil','Codebase walkthrough','By the end, they have what they need to send their first pull request.'],
     ['list','Tool or API','By the end, they can handle three to five common cases alone.']],1)+
   L.note('Let them <b>do</b>, not just listen: their hands on the keyboard, their tabs open. Even better if they leave with an artifact, like a diagram or a code snippet.','play'));
  L.done();}},
{part:2,src:'Chapter 8 · Pairing, shadowing, and reverse shadowing',run(L){
  L.h(L.kick('ex','At Usherly')+'<h1 class="q">Mika learns to be an incident commander</h1>');
  L.beats(L.card,[
   ['The goal','Mika wants to join the incident-commander rotation, the people who coordinate a big outage rather than fix it themselves.'],
   ['Shadowing','During a minor checkout incident, Quinn, who has since signed up for the rotation, runs the response. Mika watches and takes notes on how Quinn assigns roles and keeps updates calm.'],
   ['Pairing','At a game day, they run the drill together. Quinn checks Mika’s understanding as they go: “Who would you ask to update the status page now?”'],
   ['Reverse shadowing','At the next drill, Mika runs everything. Quinn only watches, then gives notes afterwards.'],
   ['The result','Mika learns the most in that last step, by doing it for real. The watching also acts as a safety net.']],
   'Working together runs along a spectrum: you do it, you do it together, they do it. Each point fits a different moment.');}},
{part:2,src:'Chapter 8 · Pairing, shadowing, and reverse shadowing',pts:1,run(L){
  L.h(L.kick('try','Put it in order')+'<h1 class="q">Order the ways of working together, from the expert doing all the work to the learner doing it all.</h1>');
  L.order(L.card,['Shadowing: the learner watches and takes notes','Pairing: both work on it, side by side','Reverse shadowing: the expert watches and gives notes'],
   'Right. Shadowing teaches by showing, pairing shares the work, and '+L.g('reverse-shadow','reverse shadowing')+' lets the learner practice with a safety net.');}},
{part:2,src:'Chapter 8 · Code and design review',run(L){
  L.h(L.kick('learn','Reviews that teach')+'<h1 class="q">A review can build confidence, or crush it</h1>'+
   L.list([['eye','Understand the assignment','New to the tech and wanting to learn, or just a safety check? Early draft: comment on the approach. Last review before launch: get into the details.'],
     ['bulb','Explain why as well as what','“Use this, not that” only fixes today. A short reason or a specific link helps them next time.'],
     ['pencil','Give an example of better','Not “make this clearer,” but a couple of ways you think they could say it.'],
     ['scale','Be clear about what matters','Label each comment: must fix (say why), team preference (link the style guide), your call, or just a nitpick.'],
     ['layers','Choose your battles','Review in passes, big picture first. If it solves the wrong problem, a hundred small comments don’t help.'],
     ['check','If you mean yes, say yes','Say whether comments block. Say “looks good to me.” Senior reviewers can feel intimidating; if it needs lots of work, talk or pair instead.']],3));
  L.done();}},
{part:2,src:'Chapter 8 · Be clear about what matters',pts:4,run(L){
  L.h(L.kick('pr','Label the comments')+'<h1 class="q">Quinn is reviewing Mika’s refund change. How should each comment be labeled?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Must fix','Team preference','Just a nitpick'],[
   ['The refund amount is built by pasting text into a database query. A malicious user could abuse it.',0,'A security hole is vital. Say it must change, and why.'],
   ['The team’s style guide avoids global singletons. It works, but here’s the guide’s section on why.',1,'It works fine; the team simply prefers another way. Link the reason.'],
   ['Every other comment in this file uses American spelling, so “canceled,” not “cancelled.”',2,'Harmless either way. Labeling it a nitpick stops Mika from worrying about it.'],
   ['If the refund call times out, the fan is charged but never told. That needs handling before launch.',0,'Fans losing money silently is a real problem. It blocks the change.']],
   'Labeled comments let a less experienced author tell a vital fix from a matter of taste.');}},
{part:2,src:'Chapter 8 · Explain why as well as what',pts:1,run(L){
  L.h(L.kick('pr','Which comment teaches?')+'<h1 class="q">Mika’s design for seller payouts has a confusing section. Which review comment teaches best?</h1>');
  L.mc(L.card,['“This section is unclear. Please make it clearer before we go on.”','“I got lost here. Do you mean payouts wait for the event, or for the ticket scan? If so, say that up front.”','“Rewrite this section. I’ve done it for you below, so just paste it in.”'],1,
   'Right. It says what went wrong and offers concrete guesses at what Mika means, so Mika learns how to fix it.',
   '“Make it clearer” gives Mika nothing to act on, and rewriting it for them teaches nothing. Offering a couple of possible meanings shows what better looks like.');}},

/* ---------- PART 4: COACHING AND CLASSES ---------- */
{part:3,src:'Chapter 8 · Coaching',run(L){
  L.h(L.kick('learn','Coaching')+'<h1 class="q">Help them find their own answer</h1>'+
   L.prose(L.g('mentoring','Mentoring')+' shares <i>your</i> experience. '+L.g('coaching','Coaching')+' helps the other person solve the problem themselves. It’s slower, but they learn far more from making their own connections. It takes deliberate practice; don’t expect to be good at it straight away.')+
   L.tiers([['chat','Ask open questions','Questions that can’t be answered yes or no. Dig into the problem rather than starting with a fix.'],
            ['eye','Listen actively','Reflect back what you heard. Feeling understood helps, and your framing can give them a new way to see it.'],
            ['clock','Make space','Leave silence for them to think. If you tend to jump in, count to five first.']])+
   L.note('Why not just give the answer? You can’t know every detail of their situation. Hand over a solution and you’ll often get a “Yes, but…” back.','info'));
  L.done();}},
{part:3,src:'Chapter 8 · Coaching',pts:1,
 solve:async L=>{for(const r of [1,0,1]){L.$('#co').children[r].click();}},
 run(L){
  const R=[
   ['Mika: “Wren’s team keeps bouncing my Runway change back. I don’t know what to do.”',['“Have you tried just messaging Wren directly?”','“What did they say each time it came back?”'],1,'That’s a closed question with a fix already inside it. Start by digging into the problem.','“Different things. First tests, then config, now they want a design doc. It feels like they just don’t want it.”'],
   ['How does Quinn respond?',['“So the target keeps moving, and that’s wearing you down?”','“That’s Platform for you. Just write the doc.”'],0,'That skips straight to an answer and dismisses the feeling. Reflect back what you heard first.','“Yes, exactly.” Mika goes quiet, thinking.'],
   ['Mika is silent. What does Quinn do?',['Fill the gap with how Quinn handled Wren last year','Wait, counting to five before speaking'],1,'Jumping in takes the thinking away from Mika. Make space.','“…Maybe I should ask Tomas what a design doc needs to look like for them, before I write it.”']];
  let r=0,miss=0;
  L.h(L.kick('pr','Coach, don’t fix')+'<h1 class="q">Play Quinn in a coaching chat with Mika. Pick each reply.</h1><div id="log"></div><div id="cp"></div><div id="co" style="display:flex;flex-direction:column;gap:8px"></div><div id="cf"></div>');
  const show=()=>{const x=R[r];L.$('#cp').innerHTML='<h2 class="sub">'+x[0]+'</h2>';L.$('#co').innerHTML='';
    x[1].forEach((o,j)=>{const b=document.createElement('button');b.className='chip';b.style.textAlign='left';b.textContent=o;
      b.onclick=()=>{if(j===x[2]){L.$('#cf').innerHTML='';L.$('#log').innerHTML+='<p class="small" style="margin:6px 0"><b>Quinn:</b> '+o+'<br><b>Mika:</b> '+x[4]+'</p>';r++;
          if(r<R.length)show();else{L.$('#cp').innerHTML='';L.$('#co').innerHTML='';L.award(miss===0);
            L.sheet(miss===0?'ok':'info',miss===0?'Coached, not fixed':'Mika got there','Open question, active listening, space. Quinn never gave an answer, and Mika found a better one than Quinn’s: ask the team what they need before writing the doc.');L.done();}}
        else{miss++;b.classList.add('no');L.fb(L.$('#cf'),x[3],'no');}};L.$('#co').appendChild(b);});};
  show();}},
{part:3,src:'Chapter 8 · Scaling Your Teaching to a Group',run(L){
  L.h(L.kick('learn','Teaching at scale')+'<h1 class="q">Classes, codelabs, and teachers who teach</h1>'+
   L.prose('One-to-one teaching is slow. A class costs a lot to build the first time, but that cost spreads over every later run. Give it a clear goal and exercises. For self-paced learning, a '+L.g('codelab','codelab')+' walks learners through building something step by step.')+
   L.prose('The author once worked on a project staffed mostly by people who stayed about three months. Their learning path: day one, two tiny pull requests (a joke and their name on the team list) to learn code review. Day two, run a tiny test service, watch its logs and metrics, then change and deploy it. By week two, the scary codebase was just code.')+
   L.note('<b>Catalyst:</b> teach others to teach your class, let them change the slides or make their own version, give honest feedback, then step away. Get broad classes into onboarding so every new hire takes them.','flame'));
  L.done();}},
{part:3,src:'Chapter 8 · Being a Catalyst',pts:1,run(L){
  L.h(L.kick('pr','Quinn’s class')+'<h1 class="q">Quinn’s “Box Office in an hour” class is popular, and Quinn now teaches it every two weeks. It’s eating Quinn’s time. What’s the catalyst move?</h1>');
  L.mc(L.card,['Train Greta and Mika to teach it, let them adapt it, and add it to onboarding','Record one session as a video and stop teaching it for good','Keep teaching it, since nobody knows Box Office as well as Quinn'],0,
   'Right. New teachers who own the material, plus a place in onboarding, keep the class alive without Quinn.',
   'Carrying on alone doesn’t scale, and a frozen recording loses the exercises and goes stale. Teaching teachers and getting into onboarding makes it run without Quinn.');}},
{part:3,src:'Chapter 8 · Teaching',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Mixed review: what is Quinn doing?',['Mentoring','Coaching','Teaching','Reviewing to teach'],[
   ['Quinn tells Mika how they handled their own first cross-team project.',0,'Sharing your own experience for someone else to use is mentoring.'],
   ['Quinn asks Mika, “What would a good outcome look like for you?” and waits.',1,'An open question plus space helps Mika find their own answer.'],
   ['Quinn walks a new hire through checkout until they can send their first pull request.',2,'A concrete goal and hands-on learning: that’s teaching.'],
   ['Quinn marks one comment “blocking, here’s why” and another “just a nitpick.”',3,'Being clear about what matters is a review that teaches.'],
   ['Quinn reflects back: “It sounds like the deadline worries you more than the code.”',1,'Active listening is a coaching skill.']]);}}
  ]
});
</script>
</body>
</html>
