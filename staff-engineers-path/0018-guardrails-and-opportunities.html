<script>
Course.lesson({
  id:'0018', title:'Guardrails and opportunities', minutes:20, icon:'shield',
  goals:['Act as a guardrail for a colleague through careful review and project support','Scale guardrails with light processes, written decisions, robots and, finally, culture','Grow people through delegation, sponsorship and sharing the spotlight, and plan to give away your job'],
  parts:['One guardrail','At scale','Opportunity','Sponsor and share'],
  read:'Read the second half of chapter 8 for the full list of review questions, the process preamble and the stories behind sponsorship.',
  glossary:{
    'guardrail':'Guardrail: a check that keeps people safe while they work on their own, like a railing on a cliff path. You don’t lean on it, but it stops a stumble becoming a fall.',
    'change-mgmt':'Change management: writing down exactly what you’ll do before you do it (commands, clicks, steps), and having someone else agree the steps are right.',
    'rubber-stamp':'Rubber-stamping: approving a change without really reading it.',
    'paved-road':'Paved road: the official, well-supported way of doing something, such as a standard set of technologies or a self-service deploy pipeline, made so easy that teams choose it.',
    'linter':'Linter: a tool that automatically checks code against rules, such as a style guide, so people don’t have to.',
    'presubmit':'Presubmit: an automatic check that runs before a change goes in, such as running tests or checking a config for unsafe values.',
    'delegation':'Delegation: giving part of your own work to someone else, and really letting them own it.',
    'sponsorship':'Sponsorship: using your influence to actively open doors for someone else, not just giving them advice.'
  },
  cheatsheet:[
    'A <b>guardrail</b> lets people work on their own safely. You don’t lean on it; it stops a stumble becoming a fall.',
    'Never rubber-stamp. Ask: should this exist, does it solve the problem, how does it fail, is it understandable, does it fit the bigger picture, do the right people know?',
    'Be a <b>project guardrail</b>: ask the questions that show someone they’re near a cliff, and say exactly how and when you’ll help.',
    'Scale with <b>light processes</b>, <b>written decisions</b> (style guides, paved roads, a few policies, strategy) and <b>robots and reminders</b>. Make the right way the easy way.',
    'The strongest guardrail is <b>culture</b>: solve a real problem, choose your battles, offer support, find allies.',
    '<b>Delegate</b> messy work with a safety net to someone it stretches. You won’t get a clone. Redirect questions; don’t proxy them.',
    '<b>Sponsor</b>: amplify, boost, connect, defend. Watch for only sponsoring people like you. <b>Share the spotlight</b>, but don’t vanish.',
    'Plan to give away your job: grow the people who will grow the next ones.'
  ],
  steps:[
/* ---------- PART 1: ONE GUARDRAIL ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Mika has to run a risky database change on Box Office tonight, alone. What would help Mika do it with the most confidence?</h1>');
  L.mc(L.card,['Quinn checks the written steps first','Quinn runs the change instead of Mika'],0,
   'A check before the risky moment lets Mika act alone and still feel safe. That check is what this lesson calls a guardrail.',
   'Taking over makes it safe, but Mika learns nothing and still can’t work alone. A check on Mika’s plan gives safety <i>and</i> independence.');}},
{part:0,src:'Chapter 8 · Guardrails',run(L){
  L.h(L.kick('learn','Guardrails')+'<h1 class="q">The railing on a cliff path</h1>'+
   L.prose('Picture a walking path along a cliff with a railing. You don’t lean on it all day. But if you trip, it stops you going over the edge. That’s a '+L.g('guardrail','guardrail')+'. When the going is safe, everyone moves faster and dares to explore.')+
   L.prose('The third of the book’s four ways to level people up is to give them guardrails, first one person at a time, then at scale.')+
   L.flow([['eye','Code review','Is this code right?','',1],['layers','Design review','Will this architecture work?','',2],['list','Change review','Are these exact steps right?','',3]])+
   L.prose('The third one, '+L.g('change-mgmt','change management')+', is like code review for commands and button clicks. When people know a review is coming, they can work alone with confidence: someone will catch the outage or the dead-end design.'));
  L.done();}},
{part:0,src:'Chapter 8 · Code, design, and change review',run(L){
  L.h(L.kick('learn','How to be a good reviewer')+'<h1 class="q">Never '+L.g('rubber-stamp','rubber-stamp')+'. Read every line, then ask six questions. Tap each.</h1>');
  L.flips(L.card,[
   ['Should this work exist?','What problem is it solving? Is it a technical fix for something a conversation should have solved?'],
   ['Does it solve the problem?','Will it work? Can users do what they need? Bugs, typos, performance, systems used in ways they can’t support?'],
   ['How will it handle failure?','Weird input, network loss, load spikes. Does it fail cleanly, or corrupt data or take money without delivering? How will you find out?'],
   ['Is it understandable?','Can others maintain and debug it? Are names clear? Is the complexity in a sensible place?'],
   ['Does it fit the bigger picture?','Does it set a pattern you don’t want copied, make work for other teams, or clash with a big launch?'],
   ['Do the right people know?','Is everyone copied who should be? Does each action have a named owner, or is it all passive voice?']],
   'Stay open to not knowing everything: ask questions and be constructive. A good guardrail isn’t a gatekeeper. You’re on the same side as the person you keep safe.');}},
{part:0,src:'Chapter 8 · Code, design, and change review',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Hollis asks Quinn to review a Payments change “quickly, it’s tiny.” What makes Quinn a good guardrail here?</h1>');
  L.mc(L.card,['Approve it fast, since Hollis is very experienced','Read every line, then ask questions, not orders','Block it until Hollis explains every choice'],1,
   'A guardrail reads carefully and stays on the author’s side: curious and constructive, not a gatekeeper.',
   'Approving unread is rubber-stamping, so it catches nothing. Blocking until every choice is defended turns a guardrail into a gatekeeper. Read it all, and ask.');}},
{part:0,src:'Chapter 8 · Code, design, and change review',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which review question catches it?',['Should it exist?','How does it fail?','Is it understandable?','Fits the bigger picture?','Right people know?'],[
   ['Mika’s plan for the Resale payout job says “the config will be updated” but not who updates it.',4,'Passive voice hides the owner. Every action needs a name attached.'],
   ['A design adds a script to auto-retry failed charges, because two teams won’t talk about who owns refunds.',0,'It’s a technical fix for a conversation that hasn’t happened.'],
   ['The new payout code has variables named <i>x2</i>, <i>tmp</i> and <i>doIt</i>.',2,'Others will have to maintain and debug this. Names should explain themselves.'],
   ['A Box Office schema change is scheduled for the night before a stadium on-sale.',3,'A risky change at the same time as a high-profile event is a bigger-picture problem.'],
   ['If the bank call times out, the payout job marks the payout as paid anyway.',1,'That’s failing in a dirty way: money and records drift apart, and nobody finds out.']]);}},
{part:0,src:'Chapter 8 · Project guardrails',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">The guardrail who just asked questions</h1>');
  L.beats(L.card,[
   ['The stretch','The author once led a project bigger than anything she’d done: more moving parts, more stakeholders, much more politics.'],
   ['The weekly question','In their weekly meeting, her team lead would ask casually how she planned to handle something, like two business priorities that clashed.'],
   ['The cliff edge','Usually the author had no plan. She hadn’t even noticed the problem coming. The question was enough: she found a way forward herself.'],
   ['What it was','The team lead was a <b>project guardrail</b>: not doing the work, not preventing every mistake, but making sure the author saw a cliff before it was too late, and ready to coach if needed.'],
   ['Be specific','Lara Hogan adds: say exactly how you’ll help (review designs, back the idea with leaders) and when to call you. For example, “If someone ignores you for three days, tell me and I’ll step in.”']],
   'Anyone can use a project guardrail, even very experienced people trying a new skill. If someone asks you to advise on their project, they probably want a little guarding.');}},
{part:0,src:'Chapter 8 · Project guardrails',pts:1,run(L){
  L.h(L.kick('pr','Your call')+'<h1 class="q">Mika is now leading the Resale refunds work, their first cross-team piece. Mika asks Quinn to “keep an eye on it.” What should Quinn say?</h1>');
  L.mc(L.card,['“Sure, just send me the plan when it’s done.”','“I’ll review designs, and ping me if Wren’s team stalls you.”','“I’ll join every standup so nothing slips past us.”'],1,
   'That’s Lara Hogan’s advice: name what you’ll do and when Mika should call on you. Mika still leads.',
   'Waiting for the finished plan means Quinn can’t warn Mika near a cliff. Joining every standup drifts into running it. Be specific about how and when you’ll help.');}},

/* ---------- PART 2: AT SCALE ---------- */
{part:1,src:'Chapter 8 · Processes',run(L){
  L.h(L.kick('learn','Scaling guardrails: processes')+'<h1 class="q">You can’t review every change yourself</h1>'+
   L.prose('Try, and you slow everyone down. Instead, write down a standard set of steps and convince the organization to follow them. A prelaunch process might ask: do we need security approval? How much notice do support and marketing need? Ship behind a feature flag? Warn other teams about extra load?')+
   L.lanes([['check','Some people love it','Clear steps feel safe. Nobody has to ask the same questions every time.',2],
            ['x','Others hate it','People should think, not follow checklists. Approvals slow them down.',4]])+
   L.prose('Nobody is wrong: it’s a trade-off, and bigger companies need more structure. But keep processes <b>light</b>. Heavy boilerplate, central approval and long waits make people sneak around them. <b>Make the right way the easy way.</b>')+
   L.note('The author’s process documents start with a preamble: these are mostly correct answers, all guidelines are wrong sometimes, do what makes sense, and propose a change if they’re wrong a lot.','book'));
  L.done();}},
{part:1,src:'Chapter 8 · Written decisions',run(L){
  L.h(L.kick('learn','Written decisions')+'<h1 class="q">Decide once, write it down, stop re-arguing</h1>'+
   L.prose('A written decision spares people the same argument on every project. The book gives four kinds:')+
   L.list([['pencil','Style guides','Naming, error handling, which language features are fine. Ends the “camel case or snake case?” debates.'],
     ['map',L.g('paved-road','Paved roads'),'The standard, well-supported technologies teams should stay on. The book likes the Tech Radar style, marking each one, for example “Adopt” or “Hold.”'],
     ['lock','Policies','Rules such as “every team runs a retro after an outage.” Use sparingly: edge cases pile up, and nobody remembers many rules.'],
     ['compass','Vision and strategy','A clear direction inside which teams pick their own way to solve problems.']],2));
  L.done();}},
{part:1,src:'Chapter 8 · Robots and reminders',run(L){
  L.h(L.kick('ex','Robots and reminders at Usherly')+'<h1 class="q">Put the right way in people’s faces, or let a machine do it</h1>');
  L.beats(L.card,[
   ['The idea','Consultant Glen Mailer’s example: people kept forgetting their timesheets, so someone taped the timesheet to the exit door at head height. Hard to miss.'],
   ['Reminders','Quinn’s Resale launch checklist lives on a wiki page. Now a bot messages whoever is launching that week, with a link to it.'],
   ['Linters','Usherly’s style guide arguments kept eating review time. Hollis turns most rules into a '+L.g('linter','linter')+', so reviewers stop commenting on them.'],
   ['Search and templates','Searching “how to deploy” brings up old scripts, so the old pages get a header pointing to Runway. The RFC template gains an on-sale load section.'],
   ['Presubmits','Saskia adds a '+L.g('presubmit','presubmit')+' to Runway that rejects a checkout change with no feature flag, much like Google’s SRSly, which refuses to reboot too many servers at once.']],
   'Each step takes a little remembering off humans. The best guardrail is the one nobody has to think about.');}},
{part:1,src:'Chapter 8 · Scaling Your Guardrails to a Group',pts:6,run(L){
  L.h(L.kick('pr','Name the guardrail')+'<h1 class="q">Usherly adds six guardrails this quarter. Which kind is each?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Process','Written decision','Robot or reminder'],[
   ['A short checklist teams follow before any public launch',0,'A standard set of steps everyone follows is a process.'],
   ['A style guide that settles how Box Office errors are named',1,'Deciding once and writing it down is a written decision.'],
   ['A bot that DMs the week’s release captain with a link to the steps',2,'Automation that puts the right step in front of someone is a reminder.'],
   ['A rule that every team runs a retro after an outage',1,'A policy is a written decision. Use them sparingly.'],
   ['A config check that blocks raising the waiting-room limit above a safe value',2,'A config checker does the right thing so humans don’t have to.'],
   ['Agreed steps for sharing and agreeing on RFCs',0,'The book lists RFC sharing as a good place for a process.']],
   'Processes and written decisions still rely on people remembering. Robots help them remember, or do it for them.');}},
{part:1,src:'Chapter 8 · Processes',pts:1,run(L){
  L.h(L.kick('pr','Your call')+'<h1 class="q">After a bad deploy, Wren proposes that every Runway change needs sign-off from a central board, which meets every two weeks. What’s the risk?</h1>');
  L.mc(L.card,['Teams will quietly go back to old deploy scripts','The board will catch too many real problems','Product teams will deploy far less carefully'],0,
   'A heavy process with long waits isn’t a good guardrail: people sneak around it. Make the right way the easy way.',
   'Catching problems is the point, and more care isn’t the risk. The danger is a slow, heavy process that people simply route around.');}},

{part:1,src:'Chapter 8 · Being a Catalyst',run(L){
  L.h(L.kick('learn','The catalyst: changing culture')+'<h1 class="q">Every guardrail we take for granted was once argued for</h1>'+
   L.prose('Code review and tests weren’t always normal. People who cared argued them in. Culture change is slow, so be patient. But it’s the only way to stop pushing a process along by hand. Four things make it easier:')+
   L.list([['target','Solve a real problem','Expect lots of “why?” questions. Have a real answer: what does the business get?'],
     ['scale','Choose your battles','Build respect for, say, design review. Offer easy defaults, and let teams pick their own form.'],
     ['shield','Offer support','Processes and automation should make the right thing easy.'],
     ['people','Find allies','Don’t go alone. Look for senior sponsors and influencers, using your shadow org chart.']],3));
  L.done();}},
{part:1,src:'Chapter 8 · Being a Catalyst',pts:1,
 solve:async L=>{for(let i=0;i<4;i++)L.$('#up').click();},
 run(L){
  const R=[['Quinn reminds each team in review','individual guardrail','Needs Quinn in every review.'],
    ['A launch checklist every team follows','process','Needs Quinn to keep pushing it.'],
    ['“Ship behind a flag” on the paved-road page','written decision','Needs people to read it.'],
    ['Runway rejects unflagged checkout changes','robot','Needs someone to build and keep it.'],
    ['Teams find it weird to launch without a flag','culture','Keeps working without anyone pushing.']];
  let lv=0;
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Quinn wants every checkout change shipped behind a feature flag. Scale the guardrail up, one rung at a time.</h1><div class="ladder" id="ld"></div><button class="btn pri" id="up">Scale it up '+L.ic('arrow')+'</button><div id="lq"></div>');
  const draw=()=>{L.$('#ld').innerHTML=R.slice(0,lv+1).map((x,j)=>(j?'<div class="conn"></div>':'')+'<div class="rung'+(j===lv?' cur':'')+'"><small>'+x[1]+'</small>'+x[0]+'<div class="small" style="margin-top:4px">'+x[2]+'</div></div>').join('');};draw();
  L.$('#up').onclick=function(){if(lv>=R.length-1)return;lv++;draw();
    if(lv===R.length-1){this.remove();const q=L.$('#lq');q.innerHTML='<h2 class="sub">Why does the book call the top rung the most effective guardrail?</h2>';
      L.mc(q,['It stops relying on anyone pushing it','It is the fastest one to put in place'],0,
       'Processes, policies and robots all still need someone. When the guardrail is part of the culture, you stop chasing people to comply.',
       'Culture is actually the hardest and slowest to change. It wins because, once it’s there, nobody has to keep pushing it.');}};}},
{part:1,src:'Chapter 8 · Being a Catalyst',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which advice does each move follow?',['Solve a real problem','Choose your battles','Offer support','Find allies'],[
   ['Before pitching load tests for every on-sale, Quinn links them to the Saturday incident’s cost.',0,'A clear business answer to “why?” is what makes a culture change stick.'],
   ['Quinn stops arguing about one design-review template; teams may use any form as long as they review.',1,'Respect for review matters more than everyone using the same form.'],
   ['Saskia ships a one-click load-test setup in Runway, so running one takes minutes.',2,'Tooling that makes the right thing easy supports the change.'],
   ['Quinn asks Greta, whose opinion Ezra trusts, to champion load testing in Box Office.',3,'Influencers from the shadow org chart help a change spread.']]);}},
/* ---------- PART 3: OPPORTUNITY ---------- */
{part:2,src:'Chapter 8 · Delegation',run(L){
  L.h(L.kick('learn','Opportunity: delegation')+'<h1 class="q">People learn most by doing</h1>'+
   L.prose('The fourth way to level people up is opportunity: real experiences, which bring skills, visibility and contacts. The most direct form is '+L.g('delegation','delegation')+'.')+
   L.list([['Really hand it over','Don’t wrap the work into a tidy gift first. Lara Hogan suggests a messy, unscoped project, with a safety net. That’s where problem solving grows.'],
     ['Pick a stretch, not a sure thing','Someone who would do it perfectly learns nothing. Pick someone who’ll find it hard but doable with support. Tell them why you think they can.'],
     ['You won’t get a clone','They’ll do it differently. Coach and ask questions, but resist stepping in, as long as they’ll reach the goals.'],
     ['Redirect, don’t proxy','When someone asks you about it, point them to the new owner. Answering yourself keeps you the contact, and you may be out of date.']],1)+
   L.note('Molly Graham calls this “giving away your Legos”: handing over the tower you started is how you move on to bigger things.','layers'));
  L.done();}},
{part:2,src:'Chapter 8 · Delegation',run(L){
  L.h(L.kick('ex','Quinn gives away a Lego')+'<h1 class="q">The Resale launch checklist becomes everyone’s</h1>');
  L.beats(L.card,[
   ['The work','Ezra wants Quinn’s Resale launch checklist turned into a prelaunch process for every Usherly team. It’s messy: Platform, Product, support and security all have opinions.'],
   ['The choice','Noa could do it flawlessly. Quinn picks Mika instead: it’s a stretch, but doable. Quinn explains why: Mika knows Payments launches and writes careful plans.'],
   ['The safety net','Quinn promises to review drafts and to step in if Wren’s team doesn’t answer within a week. Then Quinn leaves the scoping to Mika.'],
   ['Not a clone','Mika makes it a short form in Runway rather than Quinn’s long wiki page. Quinn wouldn’t have, but it meets the goal. Quinn lets it be.'],
   ['Redirect','When Callum asks Quinn about it, Quinn replies: “Mika owns this now. Ask them.”']],
   'Mika gets a real cross-team project and new contacts. Quinn gets the work off their plate.');}},
{part:2,src:'Chapter 8 · Delegation',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">In a meeting, the VP of Engineering asks Quinn how the new prelaunch process is going. Mika is in the room. What should Quinn do?</h1>');
  L.mc(L.card,['Give the VP a full status update','Say Mika owns it and let Mika answer','Promise to send the VP notes later'],1,
   'Redirecting shows Mika is the owner, gives Mika a new connection, and the VP will know whom to ask next time.',
   'Answering yourself, now or later, keeps you as the point of contact and undercuts Mika. You may also be out of date. Redirect to the owner.');}},
{part:2,src:'Chapter 8 · Delegation',pts:1,run(L){
  L.h(L.kick('pr','Your call')+'<h1 class="q">Quinn needs someone to run the next on-sale readiness review. Who gets the most from it?</h1>');
  L.mc(L.card,['Saskia, who has run ten of these already','A new grad who joined Usherly last month','Mika, who has joined two but never run one'],2,
   'It’s a stretch for Mika but doable with support. That’s the sweet spot for delegation.',
   'Saskia would do an A+ job but learn nothing new. A new grad would get chaos they can’t handle yet. Aim for a stretch that’s manageable.');}},

/* ---------- PART 4: SPONSOR AND SHARE ---------- */
{part:3,src:'Chapter 8 · Sponsorship',run(L){
  L.h(L.kick('learn','Sponsorship')+'<h1 class="q">Mentoring gives advice. '+L.g('sponsorship','Sponsorship')+' opens doors.</h1>'+
   L.prose('Sponsorship means using your influence to advocate for someone. It takes more work: you need to know what they want, and you spend your own social capital on them. Rosalind Chow describes four parts, the ABCDs:')+
   L.list([['star','Amplifying','Making sure others hear about their good work.'],
     ['trend','Boosting','Recommending them for opportunities; vouching for their skills.'],
     ['people','Connecting','Bringing them into networks and meetings they couldn’t reach alone.'],
     ['shield','Defending','Standing up for them when they’re unfairly criticized.']],4)+
   L.note('Sponsor people who want to grow and will do good work. And watch for in-group favoritism: it’s surprisingly easy to sponsor only people who look like you.','alert'));
  L.done();}},
{part:3,src:'Chapter 8 · Sponsorship',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Which of these is sponsorship rather than mentoring?</h1>');
  L.mc(L.card,['Quinn tells Mika how they prepared for their first big design review','Quinn puts Mika’s name forward to lead the next Resale milestone'],1,
   'Putting Mika forward spends Quinn’s influence to open a door. That’s sponsorship.',
   'Sharing your own experience is mentoring: useful, but it opens no doors. Putting Mika’s name forward is sponsorship.');}},
{part:3,src:'Chapter 8 · Sponsorship',pts:4,run(L){
  L.h(L.kick('pr','Spot the ABCD')+'<h1 class="q">Quinn sponsors Mika this quarter. Which part of sponsorship is each move?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Amplifying','Boosting','Connecting','Defending'],[
   ['In the Resale update to Ezra, Quinn credits Mika by name for the new prelaunch form.',0,'Making Mika’s good work visible is amplifying.'],
   ['When a new incident-commander seat opens, Quinn recommends Mika for it.',1,'Recommending them for an opportunity is boosting.'],
   ['Quinn invites Mika to a session of Noa’s staff+ group.',2,'Bringing Mika into a network they couldn’t reach alone is connecting.'],
   ['Someone calls Mika “too quiet to lead.” Quinn points to Mika’s calm handling of an incident.',3,'Changing an unfair view of Mika is defending.']],
   'Small acts add up: a small project led well gets someone picked for a bigger one.');}},
{part:3,src:'Chapter 8 · Share the spotlight',run(L){
  L.h(L.kick('learn','Connecting and sharing the spotlight')+'<h1 class="q">Two more ways to hand out opportunity</h1>'+
   L.lanes([['compass','Connect people to information','You hear about more than most. Remember the open call for talks, the team lead role, the training someone wanted, and pass it on.',1],
            ['star','Share the spotlight','If you jump on every hard problem, you overshadow the team. Let others do work that’s good enough, even if not as good as yours.',2]])+
   L.list([['Leave a gap','When someone asks a question in a meeting, pause, or hand the floor to a teammate.'],
     ['Bring someone along','Add a less senior colleague to a meeting and let them talk about their work.'],
     ['Ask for their review','Invite them to review related designs or code, and make clear their view counts.']],3)+
   L.note('<b>Don’t overcorrect.</b> If you delegate everything, agree it with your manager. Most expect staff engineers to also deliver visible work of their own.','alert'));
  L.done();}},
{part:3,src:'Chapter 8 · Share the spotlight',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Sharing the spotlight, or hogging it?',['Sharing it','Hogging it','Gone too far'],[
   ['In the Resale demo, Esme asks how refunds work. Quinn pauses and nods to Mika, who built them.',0,'Handing the floor to the person who did the work is sharing the spotlight.'],
   ['Quinn rewrites Lucia’s good-enough mobile design overnight so it’s “really right.”',1,'Good enough is how people learn. Redoing it overshadows the team.'],
   ['Quinn hands off every project, ships nothing, and Ezra can’t say what Quinn does.',2,'The book warns about this extreme. Agree how you work with your manager.'],
   ['Quinn brings Bao to the VP review to present the fraud checks Bao designed.',0,'Bringing a colleague into the room and letting them speak is sharing the stage.']]);}},
{part:3,src:'Chapter 8 · Being a Catalyst',run(L){
  L.h(L.kick('learn','Plan to give away your job')+'<h1 class="q">Your leadership keeps going when the people you grew grow others</h1>'+
   L.prose('To keep opportunity flowing without you, help others look past the obvious candidates: argue for inclusive interviews, or post open team roles on an internal job board.')+
   L.prose('The biggest catalyst is this: turn mid-levels into seniors and seniors into staff, and teach <i>them</i> to give advice, teaching, guardrails and opportunities to the next ones.')+
   L.quote('How you can get pushed up is by building a whole bench behind you.','Bryan Liles, quoted in chapter 8')+
   L.note('New people at your level don’t need to be as good as you are <i>now</i>, only as good as you were when you were promoted. If they seem less capable, maybe you’ve grown.','bulb'));
  L.done();}},
