<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finite Time, Finite Resources</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0008', title:'Finite time, finite resources', minutes:19, icon:'clock',
  goals:['See the real shape of your week, including the buffer you need for spikes','Read your own dashboard: energy, quality of life, credibility, social capital, skills','Size up new work by where it came from and what it will cost you later'],
  parts:['Finite time','Your dashboard','Where work comes from','Signing on'],
  read:'Read the first half of chapter 4 for the time graphs and the full list of ways projects find you.',
  glossary:{
    'opportunity-cost':'Opportunity cost: whatever you give up by choosing to do something else with the same time.',
    'time-graph':'Time graph: a sketch of a month or quarter showing which part of your time is already spoken for and what each project takes up.',
    'dashboard':'Resource dashboard: the book’s picture of five personal “needs bars” (energy, quality of life, credibility, social capital, skills) that every project raises or lowers.',
    'smartbrain':'Smartbrain: the author’s family word for the energy to stay focused and do something useful with a piece of work.',
    'bin-packing':'Bin packing: fitting items of different shapes and sizes into limited space, a famously hard puzzle to optimize.',
    'side-quest':'Side quest: a task off your main mission, like an optional mission in a video game.',
    'exit-criteria':'Exit criteria: conditions, agreed up front, for when you stop or step away from a piece of work.'
  },
  cheatsheet:[
    'Every yes has an <b>opportunity cost</b>. There are 168 hours a week, and infinite work. Make peace with walking past some broken things.',
    'Put <b>non-meetings</b> in your calendar: the work itself, not just the interruptions. Something you keep rescheduling may not matter.',
    'Don’t book 100% of your time. When a <b>spike</b> hits a full schedule, you drop something important or run past capacity.',
    'You can’t just pop the top item off a priority list: work comes in many sizes, and fit with <b>you</b> matters too.',
    'Your <b>dashboard</b>: energy, quality of life, credibility (they believe you can), social capital (they want to help), skills (always slowly sliding).',
    'There’s no formula. Some projects are bad on one axis and still worth it, but over time your needs must be met. Think longer about bigger projects.',
    'Work arrives eight ways: invited, ask to join, own idea, fire alarm, claiming a problem, grassroots effort, “someone needs to…”, meddling. Each has its own trap.',
    'Know what you’re <b>signing on for</b>: how it grows over time, its hidden hours, and your exit criteria.'
  ],
  steps:[
/* ---------- PART 1: FINITE TIME ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Quinn spots a flaky Box Office test that wastes everyone a few minutes a day. It’s a real problem. Should Quinn fix it right now?</h1>');
  L.mc(L.card,['Yes, any real problem is worth fixing','Only if it’s worth more than what gets dropped'],1,
   'Exactly. Every hour Quinn spends here is an hour not spent on something else. This lesson is about weighing that trade.',
   'It is a real problem, but so are a hundred others. Every hour on this one is an hour not spent elsewhere. This lesson is about weighing that trade.');}},
{part:0,src:'Chapter 4 · Doing All the Things',run(L){
  L.h(L.kick('learn','Infinite work, one of you')+'<h1 class="q">Senior people see more problems than they can ever fix</h1>'+
   L.prose('The more senior you get, the more problems you notice: systems that won’t scale, processes that waste time, missed chances. You won’t run out of work. But you can’t do it all, and jumping on everything isn’t sustainable.')+
   L.prose('Every commitment has an '+L.g('opportunity-cost','opportunity cost')+'. Fixing a dead link between meetings means not answering an email then. Saying yes to a two-year project means you aren’t free for a different one.')+
   L.flow([['clock','168 hours','in every week, for life','',1],['layers','Five more resources','energy, quality of life, credibility, social capital, skills','',2],['scale','Your choice','good for the company <i>and</i> for you','',3]])+
   L.note('The book adds a layer to “is it important for the company?”: <b>is it good for you?</b> That can feel a little selfish, but you’re the person with the most reason to look after your own needs.','person'));
  L.done();}},
{part:0,src:'Chapter 4 · Finite Time',run(L){
  L.h(L.kick('learn','Make your time visible')+'<h1 class="q">Your calendar only shows the interruptions</h1>'+
   L.prose('Work calendars usually show only meetings. If you do focused work, that means they show the things that <i>interrupt</i> your work, not the work. The book’s advice, from an executive coach: <b>put non-meetings in the calendar too</b>, as specific items, not vague blocks.')+
   L.prose('For a longer view, sketch a '+L.g('time-graph','time graph')+' of a month or a quarter. Part of it is already spoken for:')+
   '<div style="display:flex;height:36px;border-radius:12px;overflow:hidden;margin:6px 0 4px;font-size:12px;font-weight:600">'+
   '<div style="width:22%;background:var(--soft2);display:flex;align-items:center;justify-content:center;color:var(--muted)">noise</div>'+
   '<div style="width:78%;background:var(--h2-bg);display:flex;align-items:center;justify-content:center;color:var(--ink)">available</div></div>'+
   '<p class="small">“Noise” = all-hands, performance reviews and other company background. The rest holds projects, reviews, relationships, mentoring, learning… and lunch.</p>'+
   L.prose('Every new thing you take on adds a block to that graph. A huge block or a tiny dot, it still takes up space.'));
  L.done();}},
{part:0,src:'Chapter 4 · Finite Time',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">Quinn puts the real work into the calendar</h1>');
  L.beats(L.card,[
   ['Monday','Quinn’s calendar shows nine meetings and plenty of white space. It looks like a light week.'],
   ['The catch','The white space is where the real work lives: the on-sale surge strategy draft, two design reviews, a Box Office bug. None of it is visible.'],
   ['The fix','Quinn adds the work itself: “Surge strategy, write section 2,” “Review seat-map RFC.” Now the week looks as full as it really is.'],
   ['A request','Mika asks for a review of a 20-page Payments design. Quinn checks the calendar and can answer honestly: “Thursday afternoon, or not this week.” If it matters more, Quinn can move something else.'],
   ['A signal','“Clean up old Box Office feature flags” has been pushed back three weeks running. Quinn asks: am I avoiding this, or does it just not matter? They drop it.']],
   'Seeing your work, not just your meetings, lets you ask the key question: <b>if I start this, what am I not doing instead?</b>');}},
{part:0,src:'Chapter 4 · How Busy Do You Like to Be?',pts:1,
 solve:async L=>{L.$('#po').children[0].click();L.$('#go').click();},
 run(L){
  let p=null;const N=['Booked 70%','Booked 90%','Booked 100%'],F=[70,90,100],S=25;
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">Three versions of Quinn plan the same month. Then a stadium on-sale breaks checkout and adds a load spike. Which Quinn copes without dropping anything?</h1><div id="po"></div>'+
   '<div id="sim" hidden>'+N.map((n,j)=>'<div class="meterrow"><div class="lb">'+n+'</div><div class="meter"><div id="m'+j+'" style="width:'+F[j]+'%;background:var(--h2)"></div></div></div>').join('')+
   '<button class="btn pri" id="go" style="margin-top:10px">'+L.ic('flame')+'Run the on-sale</button><div id="out" class="small" style="margin-top:8px"></div></div>');
  N.forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=n;b.onclick=()=>{if(p!==null)return;p=j;b.classList.add('sel');L.$('#sim').hidden=false;};L.$('#po').appendChild(b);});
  L.$('#go').onclick=function(){this.remove();
    setTimeout(()=>{if(!L.$('#out'))return;F.forEach((f,j)=>{const el=L.$('#m'+j);const t=f+S;el.style.width=Math.min(100,t)+'%';el.style.background=t>100?'var(--no)':'var(--ok-strong)';});
      L.$('#out').innerHTML='The spike adds about '+S+'% more work. Only the 70% Quinn still fits. The other two run over.';
      L.award(p===0);
      L.sheet(p===0?'ok':'no',p===0?'You called it':'Only the 70% Quinn coped','When a schedule is full of important work, a spike leaves two choices: <b>drop something important</b>, or <b>run beyond capacity</b> and let work spill into the rest of life. The book’s advice: know your normal, your spike level and your breaking point, and leave at least a little buffer.');L.done();},900);};}},
{part:0,src:'Chapter 4 · How Busy Do You Like to Be?',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Quinn has filled every hour with important work. A launch suddenly needs ten extra hours. Quinn refuses to drop anything. What does the book predict?</h1>');
  L.mc(L.card,['Work spills into the rest of life, causing stress','Quinn quietly finds the time with no real cost','The least important work drops off by itself'],0,
   'Right. With no buffer and nothing dropped, the extra hours come out of evenings and weekends, and stress and exhaustion follow.',
   'There’s no hidden time, and when everything is important nothing drops “by itself.” With no buffer and nothing dropped, work spills into the rest of life.');}},
{part:0,src:'Chapter 4 · projectqueue.pop()?',run(L){
  L.h(L.kick('learn','Not a priority queue')+'<h1 class="q">Why not just rank all the work and take the top item?</h1>'+
   L.prose('With your locator map and treasure map you can judge how important a project is. So could every engineer just pull the next item off one ranked list? The book calls that a little silly:')+
   L.list([['box','Work comes in all sizes','A five-minute introduction stuck behind three big projects won’t happen for months.'],
     ['person','People fit different work','Some engineers suit some projects far better than others.']],1)+
   L.prose('So there’s always a balance between the strictly most important thing and the work that’s right for <i>you</i>. This assumes you’ve already checked that a project matters to the organization.')+
   L.note('You’re not an interchangeable cog. Choosing work that keeps you healthy, happy and growing makes you do better work and makes you easier to keep. Everyone wins.','star'));
  L.done();}},

/* ---------- PART 2: YOUR DASHBOARD ---------- */
{part:1,src:'Chapter 4 · Your Dashboard',run(L){
  L.h(L.kick('learn','Your needs dashboard')+'<h1 class="q">Five bars that every project pushes up or down</h1>'+
   L.prose('In the video game <i>The Sims</i>, each character has a panel of needs bars. Let one drop into the red and they get grumpy, and some activities stop being available, even good ones. The book suggests you picture your own '+L.g('dashboard','dashboard')+':')+
   L.list([['flame','Energy','Whether you have the focus left to do this kind of work.'],
     ['home','Quality of life','How the work makes you feel, day to day.'],
     ['shield','Credibility','Whether people believe you <b>can</b> do what you’re trying to do.'],
     ['people','Social capital','Whether people <b>want to help</b> you do it.'],
     ['book','Skills','Whether you’re keeping up, or slowly falling behind.']],2)+
   '<p class="small" style="margin-top:10px">Several of these have a bar to entry: below a certain level, some projects simply aren’t open to you.</p>');
  L.done();}},
{part:1,src:'Chapter 4 · Your Dashboard',run(L){
  L.h(L.kick('learn','What moves each bar')+'<h1 class="q">Flip each card to see what raises and lowers it</h1>');
  L.flips(L.card,[
   ['Energy','You need enough '+L.g('smartbrain','smartbrain')+' to start a task. People differ: one-on-ones drain some and energize others. Life outside work (a new baby, a move, illness) also takes from the same tank.'],
   ['Quality of life','Enjoying the work and the people lifts it every day. Boredom, people who treat you badly, or work you feel is harmful wear it down. Money matters too, for you and those who depend on you.'],
   ['Credibility','Built by solving hard problems, good judgment and staying calm and clear. Lost by drifting too far from the technology, pushing one tool for everything, or adding to chaos. It covers leadership, not just tech.'],
   ['Social capital','A bank account with each person: trust, friendship, owed favors. Helping people and finishing projects pays in. Refusing to help in a crisis or dropping projects burns it. Spend it deliberately.'],
   ['Skills','Always slowly sliding, because the industry moves on. Three ways up: learn on purpose (a class, a book, a toy project), work next to someone very skilled, and learn by doing.']],
   'One thing to remember: if you waste your “one unreasonable request” token, you won’t get it back.');}},
{part:1,src:'Chapter 4 · Social capital',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Wren’s team trusts Quinn’s judgment on load balancers completely. But after Quinn ignored two of their requests, they now put every favor Quinn asks at the bottom of the queue. Which bar is low?</h1>');
  L.mc(L.card,['Credibility','Social capital'],1,
   'They believe Quinn is capable (credibility is fine). They just don’t feel like helping (social capital is low).',
   'Credibility is whether they think Quinn <i>can</i> do it, and they clearly do. What’s missing is their wish to help: social capital.');}},
{part:1,src:'Chapter 4 · E + 2S + ...?',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">Quinn compares two pieces of work, bar by bar</h1>');
  L.beats(L.card,[
   ['The choice','Quinn has room for one more thing this quarter: rewriting the seat-map cache in Box Office, or joining the incident-commander rotation.'],
   ['No formula','The book is clear there’s no equation to plug numbers into. Which bar matters depends on where each bar is now and what you’re aiming for.'],
   ['Cache rewrite','Deep coding Quinn loves: good for quality of life and technical credibility. Little new skill, since Quinn knows Box Office best of anyone.'],
   ['Incident rotation','New skills and cross-team visibility, but paged out of hours: a hit to energy. (Lesson 0009 weighs this one fully.)'],
   ['Not every pick is perfect','Quinn might choose something bad on one axis for a good reason, like helping the team through a crunch. That’s fine, as long as, over the long run, Quinn’s needs get met.'],
   ['Bin packing','Fitting odd-shaped work into limited time while keeping five bars healthy is a hard '+L.g('bin-packing','bin-packing')+' problem. So don’t overthink a two-hour task. Spend longer on the big ones.']],
   'Look at what a project does to <b>each</b> bar, not just whether it matters to the company. The bigger the project, the more thought it deserves.');}},
{part:1,src:'Chapter 4 · Your Dashboard',pts:6,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which bar moves most?',['Energy','Quality of life','Credibility','Social capital','Skills'],[
   ['After six back-to-back meetings, Quinn reads the same RFC three times and takes in nothing.',0,'That’s a smartbrain problem: the time is there, the focus isn’t.'],
   ['Quinn recommends Runway in every design review, even where it clearly doesn’t fit.',2,'Absolutism about one tool is a classic way to lose credibility.'],
   ['Quinn spends a quarter working beside Noa, who is brilliant at capacity planning.',4,'Working closely with someone very skilled is one of the three ways skills grow.'],
   ['Quinn helped Wren’s team through a painful migration last year. Today Wren says yes to Quinn’s awkward request.',3,'Quinn paid into the account, and now it’s there to spend.'],
   ['Quinn dreads every Box Office sync because one attendee belittles people.',1,'Working with people who treat you badly chips away at your happiness.'],
   ['During a messy outage call, Quinn stays calm and explains the situation clearly.',2,'Credibility covers leadership too: making chaos easier for others to understand builds it.']]);}},
{part:1,src:'Chapter 4 · Social capital',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Tap each piece until the sentence tells credibility and social capital apart.</h1>');
  L.sentence(L.card,[['Social capital','Credibility'],['want to help you','believe you can do it'],['skills','social capital'],['want to help you','remember your name']],[1,1,1,0],
   [['Social capital is about goodwill, not about whether you’re capable.'],['Wanting to help is the other resource. This one is about belief in your ability.'],['Skills are what you can do. The resource about goodwill is social capital.'],['Being remembered isn’t enough. Social capital is people wanting to help you.']],
   'Credibility: they believe you <b>can</b>. Social capital: they <b>want</b> to help. You need both for big changes.');}},

/* ---------- PART 3: WHERE WORK COMES FROM ---------- */
{part:2,src:'Chapter 4 · Evaluating a Project',run(L){
  L.h(L.kick('learn','Where work comes from, part 1')+'<h1 class="q">Four ways a project can land on your plate</h1>'+
   L.prose('It’s easier to judge a project when you know how it reached you. Each route has an upside and a catch.')+
   L.list([['You’re invited to join','It already has momentum and support, and being sought out feels good. Catch: it may not be what you think matters most, and you may be asked because it’s like work you’ve already done.'],
     ['You ask to join','Great for growth, skills or fun. If you tend to hint and wait to be noticed: don’t. Go ask for the project you want.'],
     ['You have an idea','You must convince people to care, and navigate headcount and business cases. In return you get to lead it your way.'],
     ['The fire alarm goes off','A crisis: clear goals, a bias to act, and it feels good to be needed. Catch: a jarring switch, and too much firefighting leaves no story of growth.']],1));
  L.done();}},
{part:2,src:'Chapter 4 · Evaluating a Project',run(L){
  L.h(L.kick('learn','Where work comes from, part 2')+'<h1 class="q">Four more routes, each with a trap</h1>'+
   L.list([['You’re claiming a problem','Something keeps slowing you down, so you go fix it: a '+L.g('side-quest','side quest')+'. Great for momentum and kudos. Too much keeps you from long-term work.'],
     ['A grassroots effort','A working group nobody funded. Can be brilliant, or a huge waste. It works with buy-in, a clear time commitment, exit criteria and a way to decide. Otherwise it’s a social club.'],
     ['“Someone needs to…”','Unowned work: do your fair share, and sometimes more of the grungy part to shield junior colleagues. Just not so much that your expected results suffer.'],
     ['You’re just meddling','Nudging into a project you weren’t invited to. Can be welcome or not. Don’t “lob a water balloon”: cause chaos, then walk away from the consequences.']],3));
  L.done();}},
{part:2,src:'Chapter 4 · You ask to join',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Platform is starting a project to make Runway handle on-sale surges. Quinn would love to join and keeps mentioning in meetings that they “have some time.” What does the book suggest?</h1>');
  L.mc(L.card,['Keep hinting so as not to look pushy','Wait, since the best fit will be noticed','Ask Wren directly to join the project'],2,
   'Yes. Even when you’re the obvious fit, don’t wait to be noticed. Asking makes everyone happier and raises your chances.',
   'Hinting and waiting is exactly the habit the book warns against. Even if you’re the obvious fit, go ask for the project you want.');}},
{part:2,src:'Chapter 4 · Evaluating a Project',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'How did this work arrive?',['Fire alarm','Claiming a problem','Grassroots effort','Someone needs to…','Meddling'],[
   ['A checkout outage pages every senior engineer at 9 p.m. during a tour on-sale.',0,'A crisis. Helping is often right, but it’s an abrupt context switch.'],
   ['For the fifth time, Box Office’s clunky seat-map API slows Quinn down, so Quinn decides to fix it.',1,'A classic side quest: satisfying, but watch that it doesn’t crowd out longer work.'],
   ['A dozen engineers start a “better load testing” group. No funding, no deadline, no way to decide anything.',2,'Without buy-in, a time limit and a decision process, it risks being a social club.'],
   ['A planning meeting ends with “someone should update the on-sale runbook.” Nobody owns it.',3,'Do a fair share of unowned work, but don’t let it eat the results you’re expected to deliver.'],
   ['Quinn sees Payments’ new design heading somewhere risky and joins their conversations, uninvited.',4,'Can be welcome, but stay for the consequences. Don’t lob a water balloon and leave.']]);}},
{part:2,src:'Chapter 4 · Other People Aren’t Necessarily Right',pts:1,run(L){
  L.h(L.kick('pr','Interruptions')+L.note('The book warns about letting low-priority requests from others jump ahead of your own top work, such as always dropping everything for a minor outage or answering chat within seconds. Others can’t see your dashboard. Usually, only you look after it.','alert')+
   '<h1 class="q" style="margin-top:16px">Quinn is in a focus block writing the surge strategy. A Slack ping from another team asks about a minor glitch in a test environment. What should Quinn do?</h1><div id="iq"></div>');
  L.mc(L.$('#iq'),['Reply at once, since speed is part of the job','Ignore all chat messages for the whole week','Finish the block, then judge if it really matters more'],2,
   'Right. Sometimes an interruption really is more important, so check. But don’t let it win by default.',
   'Neither extreme works. Some interruptions truly matter, so be discerning: finish the planned work unless the request genuinely beats it.');}},

/* ---------- PART 4: SIGNING ON ---------- */
{part:3,src:'Chapter 4 · What are you signing on for?',run(L){
  L.h(L.kick('learn','What are you signing on for?')+'<h1 class="q">A project has a shape over time, not just a size</h1>'+
   L.prose('Before you take on a project, a mentoring arrangement or a recurring meeting, ask what it will do to your time <b>now and later</b>. Be clear about what you’re sending to Future You.')+
   L.lanes([['trend','Ramps up later','Starts small, then hits a turning point (like project approval) and needs far more time.',3],
            ['down','Front-loaded','Busy at the start, then trails off.',2]])+
   L.prose('Small things can be big, too. A “one-hour” meeting may hide prep and action items. A small task you keep for years becomes a large commitment. And one meeting can lift your credibility or drain you for the rest of the day.'));
  L.done();}},
{part:3,src:'Chapter 4 · What are you signing on for?',pts:1,
 solve:async L=>{L.$('#po').children[2].click();L.$('#rv').click();},
 run(L){
  let p=null;const O=['1 hour','About 2 hours','3 hours or more'];
  const C=[['The meeting itself','1 h'],['Reading the proposals beforehand','1 h'],['Action items Quinn always volunteers for','1 h+'],['A meeting in the middle of a 4-hour focus block','breaks it in two']];
  L.h(L.kick('pr','Predict, then reveal')+'<h1 class="q">Noa invites Quinn to a weekly one-hour Runway adoption meeting. How much of Quinn’s week will it really take?</h1><div id="po"></div>'+
   '<div id="rvb" hidden><button class="btn pri" id="rv" style="margin-top:8px">'+L.ic('eye')+'Reveal the hidden costs</button></div><div id="cl"></div>');
  O.forEach((o,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=o;b.onclick=()=>{if(p!==null)return;p=j;b.classList.add('sel');L.$('#rvb').hidden=false;};L.$('#po').appendChild(b);});
  L.$('#rv').onclick=function(){L.$('#rvb').remove();
    L.$('#cl').innerHTML='<div class="ladder">'+C.map((c,j)=>(j?'<div class="conn"></div>':'')+'<div class="rung'+(j===C.length-1?' cur':'')+'"><small>'+c[1]+'</small>'+c[0]+'</div>').join('')+'</div>';
    L.award(p===2);
    L.sheet(p===2?'ok':'no',p===2?'You saw through it':'It’s at least 3 hours','The book asks: is a weekly hour really an hour, once you count prep and action items? And if it lands in the middle of a four-hour block, can you still use the rest well? Estimate the real cost before you say yes.');L.done();};}},
{part:3,src:'Chapter 4 · What are you signing on for?',run(L){
  L.h(L.kick('learn','Set the boundaries up front')+'<h1 class="q">Decide how and when you’ll get out</h1>'+
   L.list([['cycle','Taking on a process?','Ask whether you’ll be able to hand it to a team later.'],
     ['clock','Joining just to help?','Say clearly that you’re there for the beginning, to clear up the direction or help the lead get going.'],
     ['flask','Risky or unsure?','Agree '+L.g('exit-criteria','exit criteria')+'. Add go/no-go or review points, or frame it as a timeboxed experiment.']],2)+
   L.note('Exit criteria matter most for work that is risky, or that you’re not sure you should be doing at all.','lock'));
  L.done();}},
{part:3,src:'Chapter 4 · What are you signing on for?',pts:4,run(L){
  L.h(L.kick('pr','Shape over time')+'<h1 class="q">Which way will each commitment grow?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Ramps up later','Front-loaded'],[
   ['Ezra asks Quinn to “just sketch some ideas” for Resale. If leadership approves it, Quinn would lead the whole build.',0,'Small now, but approval is the turning point. After it, this becomes a big project.'],
   ['Callum asks Quinn to spend two weeks untangling the Till migration plan, then step back.',1,'Heavy at the start, then it trails off, as long as Quinn really does step back.'],
   ['Quinn writes the onboarding guide for new Box Office engineers, then hands it to the team to maintain.',1,'Most of the effort is the first draft. The hand-off keeps it from lingering.'],
   ['Quinn agrees to “advise” a prototype that, if it works, becomes a migration Quinn would own.',0,'If the prototype succeeds, the ownership lands on Quinn. Know that before saying yes.']],
   'Ask how each piece of work grows <b>before</b> you sign. Future You will thank you.');}},
{part:3,src:'Chapter 4 · What are you signing on for?',pts:1,run(L){
  L.h(L.kick('pr','Decide')+'<h1 class="q">Quinn is unsure the new load-testing working group will go anywhere, but wants to help. How should Quinn join?</h1>');
  L.mc(L.card,['As a six-week trial, with a review point','With no end date, to see where it goes','Only if others promise it will succeed'],0,
