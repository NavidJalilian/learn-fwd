<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giving a Project Structure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0011', title:'Giving a project structure', minutes:20, icon:'layers',
  goals:['Agree who does what on a project with several leaders, using a responsibilities table or RACI','Set scope, milestones, estimates, logistics and a kickoff that keep a project moving','Drive a project: explore the problem before the solution, then make it easy for everyone to understand'],
  parts:['Who does what','Scope and time','Setting up','Driving'],
  read:'Read the middle of chapter 5 for the full example responsibilities table and the talks it recommends.',
  glossary:{
    'raci':'RACI: a table that says, for each task, who is Responsible (does it), Accountable (signs off; only one person), Consulted (asked for opinions) and Informed (kept up to date).',
    'tpm':'TPM (technical program manager): the person who gets a big project delivered on time by running timelines, tracking progress across teams and communicating status.',
    'triangle':'Project triangle: time, budget and scope pull against each other. Often put as “fast, cheap, good: pick two.”',
    'milestone':'Milestone: a dated point in a project where something specific is done, ideally something users can try.',
    'workstream':'Workstream: a chunk of a big project that can be built in parallel with others, with its own milestones.',
    'mental-model':'Mental model: a simple picture in your head of how something works, often borrowed from something you already know.'
  },
  cheatsheet:[
    'At senior levels, roles blur. At the start, write down <b>who does what</b>: a table of leadership responsibilities, or <b>RACI</b> when decisions keep stalling.',
    'The lead fills every <b>empty role</b>, or makes sure someone does. Unsure of your own role? Ask: “Here’s what I think I own. Do you agree?”',
    'Recruit people who <b>complement</b> you and can drive the work: good judgment plus optimism, conflict skills and clear communication.',
    '<b>Fast, cheap, good: pick two.</b> Deliver in small milestones users can try; split big work into workstreams or phases.',
    'Estimates get better <b>on the project itself</b>: update them as you ship. Tell teams you depend on what you need <b>early</b>.',
    'Agree on logistics: meetings, informal chat, status updates, a documentation home, development practices. Then hold a <b>kickoff</b>, and say clearly what you want people to do.',
    '<b>Driving</b> is active. Explore what matters to each team first; only then compare approaches, including existing ones.',
    '<b>Clarify</b> with mental models, shared names (a glossary) and pictures.'
  ],
  steps:[
/* ---------- PART 1: WHO DOES WHAT ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">On Resale, Quinn and Callum both send Ezra a weekly status email. Nobody tracks what fans need. What went wrong?</h1>');
  L.mc(L.card,['Nobody agreed who does what','Ezra gets too many emails'],0,
   'Two people did the same job and another job fell through the cracks. That’s what happens when leaders don’t split the work up front.',
   'The extra email is a symptom. The real problem is that nobody agreed who does what, so one job doubled and another vanished.');}},
{part:0,src:'Chapter 5 · Defining roles',run(L){
  L.h(L.kick('learn','Defining roles')+'<h1 class="q">At senior levels, roles blur together</h1>'+
   L.prose('A staff engineer, an engineering manager and a '+L.g('tpm','technical program manager')+' all act as the “grown-up in the room”: they spot risks, remove blockers and solve problems. Managers have reports, but engineers may too. Program managers report status, but anyone should step in if nobody does.')+
   L.prose('So the start of a project is the best time to write down <b>who does what</b>, before two people find they’re doing the same job, or work slips through the cracks.')+
   L.note('The book’s example is a simple table: one column of responsibilities, each with a role beside it. Customer needs go to the product manager, timelines to the TPM, team health to the engineering manager, final technical decisions to the technical lead. It stresses that this is only an example.','list'));
  L.done();}},
{part:0,src:'Chapter 5 · Defining roles',run(L){
  L.h(L.kick('learn','RACI, for when you really need it')+'<h1 class="q">Four letters for each task. Tap to reveal.</h1>');
  L.flips(L.card,[['Responsible','The person actually doing the work.'],['Accountable','The person who signs off that it’s done. Only <b>one</b> per task, often the same as Responsible.'],['Consulted','People asked for their opinion.'],['Informed','People kept up to date on progress.']],
   '<b>RACI</b> can be overkill, but on a chaotic project it helps. A staff engineer the book quotes used it to escape two traps: discussing forever because nobody knew who decided, and reopening every decision. Its neutral structure lets you raise the question without it being awkward.');}},
{part:0,src:'Chapter 5 · Defining roles',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">In Resale’s '+L.g('raci','RACI')+', who should be <i>Accountable</i> for the payout design?</h1>');
  L.mc(L.card,['Hollis, Quinn and Esme, as a shared group','Just one person, such as Hollis','Everyone who’ll be consulted on it'],1,
   'RACI allows only one accountable person per task. Others can be consulted or informed.',
   'Shared accountability is what RACI exists to prevent. There is exactly one accountable person per task.');}},
{part:0,src:'Chapter 5 · Defining roles',pts:6,run(L){
  L.h(L.kick('pr','Fill in the table')+'<h1 class="q">Resale now has Esme (product manager), Quinn (technical lead), Joss (engineering manager) and Callum (TPM). Using the book’s example table as a guide, who takes each one?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Esme','Quinn','Joss','Callum'],[
   ['Understand what fans and organizers need',0,'Customer needs and first requirements go to the product manager.'],
   ['Final say on the technical approach',1,'Final technical decisions go to the technical lead.'],
   ['Watch over the team’s health',2,'Team health is the engineering manager’s job.'],
   ['Send status to stakeholders',3,'Communicating status sits with the TPM.'],
   ['Final say on what fans see on screen',0,'User-visible behavior is the product manager’s call.'],
   ['Design the high-level architecture',1,'The technical lead designs it, with support from the engineers.']],
   'Your table may differ, and that’s fine. What matters is that every leader agrees on it before work starts.');}},
{part:0,src:'Chapter 5 · Defining roles',pts:1,run(L){
  L.h(L.kick('pr','Your call')+'<h1 class="q">Before Esme joined, nobody on Resale tracked what organizers needed from it. Whose job was it?</h1>');
  L.mc(L.card,['Nobody’s, until a product manager arrived','Ezra’s, as the sponsor of the project','Quinn’s, as lead, or Quinn finds someone'],2,
   'The lead is responsible for the whole project, so they quietly fill any empty role, or at least make sure the work gets done.',
   'An empty role doesn’t mean empty work. The book says the lead fills any role without a person in it, or makes sure someone does.');}},
{part:0,src:'Chapter 5 · Defining roles',pts:1,run(L){
  L.h(L.kick('pr','Your call')+'<h1 class="q">Bao, the Trust &amp; Safety sublead, arrives at every sync with Quinn a bit nervous, unsure they did what was expected. What should Bao do?</h1>');
  L.mc(L.card,['Do extra work each week, just in case','Ask: “Here’s what I think I own. Agree?”','Wait for Quinn to raise any problems'],1,
   'The author once felt the same as a sublead and says one direct conversation would have saved a lot of anxiety.',
   'Guessing or waiting keeps the anxiety going. A direct question about ownership settles it, and the book says to align every leader on roles.');}},

/* ---------- PART 2: SCOPE AND TIME ---------- */
{part:1,src:'Chapter 5 · Agreeing on scope',run(L){
  L.h(L.kick('learn','People, scope and milestones')+'<h1 class="q">Recruit well, then agree what you’ll actually do</h1>'+
   L.lanes([['people','Recruiting','Look for people who fill the gaps in your skills. A big-picture lead needs a detail lover. Best of all: someone who loves the work you hate. For leads, look for good judgment <i>and</i> attitude: optimism, conflict skills, clear communication.',2],
            ['target','Scope','Time, budget and scope pull against each other: the '+L.g('triangle','project triangle')+'. Fewer people means less gets done. Agree what you’ll try to do.',3]])+
   L.list([['Milestones you can try','Treat each '+L.g('milestone','milestone')+' like a beta test: something users can use or see, which may change what they want next.'],
           ['Always one in sight','Keep steps small. People rarely act with urgency until a deadline is close.'],
           ['Split big work','Use '+L.g('workstream','workstreams')+' in parallel, or phases one after another, so you can say “this stream is on track.”']],1));
  L.done();}},
{part:1,src:'Chapter 5 · Agreeing on scope',pts:1,
 solve:async L=>{L.$('#t0').click();L.$('#t1').click();},
 run(L){
  const S=['Launch date','Team size','Features at launch'];const fx=new Set();
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Fast, cheap, good: pick two. Ezra has already fixed two corners of Resale. Tap the two that can’t move.</h1><div id="tg" style="display:flex;flex-wrap:wrap;gap:8px"></div><div id="tr" style="margin-top:12px"></div><div id="tq"></div>');
  S.forEach((s,j)=>{const b=document.createElement('button');b.className='chip';b.id='t'+j;b.innerHTML=L.ic(['cal','people','box'][j])+s;
    b.onclick=()=>{if(fx.size>=2||fx.has(j))return;fx.add(j);b.classList.add('sel');b.innerHTML=L.ic('lock')+s+' (fixed)';
      if(fx.size===2){const free=[0,1,2].find(k=>!fx.has(k));
        L.$('#tr').innerHTML='<div class="small">Resale at a glance</div><span class="chip static ok">'+L.ic('lock')+S[[0,1,2].filter(k=>fx.has(k))[0]]+'</span> <span class="chip static ok">'+L.ic('lock')+S[[0,1,2].filter(k=>fx.has(k))[1]]+'</span> <span class="chip static" style="border-color:var(--no);color:var(--no)">'+L.ic('cycle')+S[free]+' must flex</span>';
        const q=L.$('#tq');q.innerHTML='<h2 class="sub">Spring date and team are fixed. Legal’s price-cap decision then slips a month. What should Quinn do?</h2>';
        L.mc(q,['Ask the team to work weekends to keep everything','Cut or delay features, and agree the new scope','Keep all features and hope to catch up later'],1,
         'With time and people fixed, scope is the only corner left. Agree openly on what’s in the first milestone and what waits.',
         'Weekends quietly add people-hours, and hoping changes nothing. With two corners fixed, the third has to give, so agree a smaller scope.');}};
    L.$('#tg').appendChild(b);});}},
{part:1,src:'Chapter 5 · Agreeing on scope',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Which is the better first Resale milestone?</h1>');
  L.mc(L.card,['“Backend for listings 60% complete” by March','“Staff can list and buy one test ticket” by March'],1,
   'It’s something people can actually try, so it doubles as a beta test and gives early feedback.',
   'A percentage of backend isn’t something anyone can use. The book’s advice is milestones that are usable or demonstrable.');}},
{part:1,src:'Chapter 5 · Estimating time',run(L){
  L.h(L.kick('learn','Estimating time')+'<h1 class="q">Almost nobody is good at estimates</h1>'+
   L.prose('Common advice is to break work into tiny tasks, or to multiply every guess by three. The book finds neither satisfying.')+
   L.flow([['play','Ship a small slice','Deliver a bit of real work','',1],['clock','Learn your pace','See how long it really took','',2],['cycle','Update the schedule','Every time, not once','',3]])+
   L.prose('It prefers advice from <i>The Pragmatic Programmer</i>: the way to learn a project’s timetable is experience on that same project. Practice estimating, even when it doesn’t matter, and keep a log of how you did.')+
   L.note('<b>Count the teams you depend on.</b> Platform teams often get last-minute requests they could easily have planned for months earlier. Ask late and you probably won’t get it, and you disrupt their other plans.','alert'));
  L.done();}},
{part:1,src:'Chapter 5 · Estimating time',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Good estimating habit?',['Good habit','Bad habit'],[
   ['After each two-week slice, Joss compares the plan with what shipped and moves the dates.',0,'Updating the schedule with experience from this very project is the book’s preferred approach.'],
   ['Callum fixes the launch plan in January and never revisits it.',1,'Estimates improve as you ship. A plan never updated can’t learn anything.'],
   ['Lucia guesses how long small tasks will take and logs how close each guess was.',0,'Practicing and keeping a log is how estimating gets better.'],
   ['Quinn will tell Wren’s team about the load-balancer change once the code is done.',1,'Tell teams you depend on early. Late requests rarely get done and disrupt their plans.']]);}},
{part:1,src:'Chapter 5 · Estimating time',pts:1,run(L){
  L.h(L.kick('pr','Your call')+'<h1 class="q">Resale will need a new rule on Wren’s load balancers before the spring launch. It’s January. When should Quinn tell Wren?</h1>');
  L.mc(L.card,['Now, so it can go into their quarterly plans','In March, when the exact config is final','Right before launch, as a small urgent ask'],0,
   'Wren’s team is overloaded. A request they can plan for months ahead is far more likely to happen than a surprise.',
   'The later a dependent team hears, the less likely you get what you need. Waiting for the perfect config costs their planning window.');}},

/* ---------- PART 3: SETTING UP ---------- */
{part:2,src:'Chapter 5 · Agreeing on logistics',run(L){
  L.h(L.kick('learn','Agreeing on logistics')+'<h1 class="q">Small decisions that make a project run smoothly</h1>'+
   L.list([['cal','How you’ll meet','Standups? How often do leads sync? Demos, retros?'],
     ['chat','Informal chat','A social channel, icebreakers, even meme threads, so people ask each other questions sooner.'],
     ['trend','Sharing status','How does the sponsor want updates? Who sends them, and how often?'],
     ['home','A documentation home','One easy-to-find page that links to everything: the fixed point in a chaotic universe.'],
     ['pencil','Development practices','Languages, deploys, code review standards, testing, feature flags.']],2));
  L.done();}},
{part:2,src:'Chapter 5 · Agreeing on logistics',run(L){
  L.h(L.kick('ex','Quinn sets up Resale')+'<h1 class="q">From logistics to kickoff in one week</h1>');
  L.beats(L.card,[
   ['Meetings','The four subleads and Esme meet with Quinn every Tuesday. Each team keeps its own standup. Demos every two weeks.'],
   ['Chat','Quinn opens a #resale channel for questions and a #resale-random channel for jokes, so people who’ve never met start talking.'],
   ['Status','Ezra wants a short update every two weeks. Callum sends it.'],
   ['Docs home','A single Resale page links to the context page, decisions, milestones and meeting notes.'],
   ['Practices','Everything deploys through Runway behind feature flags. Usherly’s normal code review rules apply.'],
   ['Kickoff','A one-hour meeting: who everyone is, the goals, what’s happened, the structures, what’s next, and exactly what each team should do this month.']],
   'Most of this was already written down. The kickoff still matters: seeing each other’s faces gives the project momentum.');}},
{part:2,src:'Chapter 5 · Agreeing on logistics',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Why does the Resale documentation home matter so much?</h1>');
  L.mc(L.card,['It replaces the need for any meetings','It gives everyone one up-to-date place to start','It lets Ezra track each engineer’s output'],1,
   'Everyone looks at the same current information: the latest notes, the next milestone, the decisions.',
   'A docs home doesn’t replace meetings or track people. Its job is to be the single place where everything starts.');}},
{part:2,src:'Chapter 5 · Agreeing on logistics',pts:5,run(L){
  L.h(L.kick('pr','Which decision is it?')+'<h1 class="q">Each question came up while setting up Resale. Which logistics topic does it belong to?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Meetings','Informal chat','Status','Docs home','Dev practices'],[
   ['Should the mobile app release Resale behind a feature flag?',4,'Release methods are a development practice.'],
   ['Where does someone find last week’s meeting recap?',3,'The docs home should link out to everything.'],
   ['Should the subleads sync weekly or every two weeks?',0,'How often leaders get together is a meeting decision.'],
   ['How will the VP hear about progress?',2,'Who gets updates, and how, is about sharing status.'],
   ['How do new people feel safe asking “dumb” questions?',1,'A social channel or icebreakers lower the bar for chatting.']],
   'None is hard alone. Settling them early stops each one becoming a small argument later.');}},
{part:2,src:'Chapter 5 · Having a kickoff meeting',pts:1,run(L){
  L.h(L.kick('pr','Fix the slide')+'<h1 class="q">Quinn’s kickoff slide says: “It might be nice if teams could look at the payout design sometime.” What’s the better version?</h1>');
  L.mc(L.card,['“Have a look whenever you get a chance.”','“Feedback is always very welcome, of course.”','“Hollis and Bao: review the design by May 3.”'],2,
   'The book says to be explicit about what you want people to do. Vague hints make everyone guess how much it matters.',
   'Still a hint. Ambiguity creates more work for everyone, who must guess how much it matters. Name the people, the task and the date.');}},

/* ---------- PART 4: DRIVING ---------- */
{part:3,src:'Chapter 5 · Driving the Project',run(L){
  L.h(L.kick('learn','Driving the project')+'<h1 class="q">Driving isn’t just keeping your foot on the gas</h1>'+
   L.prose('The book borrows from a talk by Kripa Krishnan, “Avoid the Lake!”: driving a project is active. You choose the route, make decisions and react to hazards ahead. The lead is in the driver’s seat.')+
   L.tiers([['eye','1 · What matters?','Teams may hold different pictures of the goal, use different words, or expect a different scope. Get to where you can sum up what each team wants, and they agree it’s accurate.','Gives you an elevator pitch, and a list of what you’re <b>not</b> doing'],
            ['compass','2 · Which approach?','Only then pick how. Keep an open mind, consider existing solutions, learn from past attempts, and favor fewer things to maintain.','Code must be run, monitored and one day deleted']])+
   L.note('Be suspicious of a brand-new project that already names its implementation. On day one you can’t know enough for that.','alert'));
  L.done();}},
{part:3,src:'Chapter 5 · Exploring',pts:1,run(L){
  L.h(L.kick('pr','Put it in order')+'<h1 class="q">How should Quinn explore Resale? Tap the steps in order.</h1>');
  L.order(L.card,['Learn what each team expects from Resale','Sum it up, including what’s out of scope','List possible approaches, existing ones too','Choose the approach to build'],
   'Problem first, solution second. Framing what everyone wants is what makes the approaches comparable.');}},
{part:3,src:'Chapter 5 · What possible approaches can you take?',pts:1,run(L){
  L.h(L.kick('pr','Your call')+'<h1 class="q">Quinn’s draft from two months ago says “build a new resale service with its own ticket store.” Exploring shows Box Office could handle resale as a new order type. What now?</h1>');
  L.mc(L.card,['Keep the new service; the plan was approved','Build both and see which works out','Weigh Box Office fairly, upkeep included'],2,
   'The book warns leads against clinging to their first idea. An existing system may be a workable shape, and fewer things to maintain counts in its favor.',
   'Sticking to the first idea, or building both, ignores what exploring found. Weigh the existing option fairly, including what each costs to run.');}},
{part:3,src:'Chapter 5 · Clarifying',run(L){
  L.h(L.kick('learn','Clarifying')+'<h1 class="q">Give people a chain to hang new ideas on</h1>'+
   L.prose('People you ask for help have their own focus. Unless you lower the complexity for them, they may optimize for the wrong thing. The writer Alain de Botton says facts that link to nothing we know are')+
   L.quote('as useless and fugitive as necklace beads without a connecting chain','Alain de Botton, quoted in chapter 5')+
   L.list([['bulb','Mental models','Use an analogy (“think of it like…”), an example, or a handy name, so people build a '+L.g('mental-model','mental model')+' fast. “Leader election” is easier than “distributed consensus algorithm.”'],
     ['chat','Naming','The same word can mean different things to different groups. Use their words, and give a glossary when groups mix.'],
     ['eye','Pictures and graphs','Before-and-after pictures, nested shapes, a graph trending toward the goal. Mind existing meanings: a cylinder reads as a database, red reads as “stop.”']],4));
  L.done();}},
{part:3,src:'Chapter 5 · Naming',pts:1,
 solve:async L=>{[...L.$('#nm').children].forEach(b=>b.click());},
 run(L){
  const T=[['Box Office','A seat record inside an order.'],['Payments','A line item to charge or refund.'],['Trust & Safety','A support case about a suspicious seller.'],['Esme (product)','What a fan holds in the app.']];const seen=new Set();
  L.h(L.kick('pr','See it happen')+'<h1 class="q">At the leads sync, everyone keeps saying “ticket.” Tap each group to see what they mean by it.</h1><div id="nm" style="display:flex;flex-wrap:wrap;gap:8px"></div><div id="nr" style="margin-top:12px"></div><div id="nq"></div>');
  T.forEach((t,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=t[0];
    b.onclick=()=>{b.classList.add('sel');seen.add(j);L.$('#nr').innerHTML=[...seen].map(k=>'<div class="small" style="margin:4px 0"><b>'+T[k][0].replace('&','&amp;')+':</b> “ticket” = '+T[k][1]+'</div>').join('');
      if(seen.size===T.length&&!L.$('#nq').innerHTML){const q=L.$('#nq');q.innerHTML='<h2 class="sub">Four meanings for one word. What should Quinn do?</h2>';
        L.mc(q,['Ban the word “ticket” in all project docs','Agree on terms and add a glossary to the docs home','Let each team keep its meaning; context will sort it'],1,
         'A shared language, with a glossary where groups mix, lets people talk precisely about where they agree or disagree.',
         'Banning the word ignores how people really talk, and leaving it alone means people agree in meetings while meaning different things. Agree the terms and write them down.');}};
    L.$('#nm').appendChild(b);});}},
{part:3,src:'Chapter 5 · Clarifying',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which tool fits best?',['Mental model','Naming','Picture or graph'],[
   ['Execs can’t see why the resale price cap matters. Quinn shows a chart of fan complaints climbing toward last summer’s peak.',2,'A line trending toward a disaster point makes the need clear at a glance.'],
   ['Finance says “customer” for organizers; engineering says it for fans.',1,'Same word, different meaning. Agree the terms and write them down.'],
   ['Mobile engineers don’t follow how a listing is held. Quinn says: “It’s like a seat hold during checkout, just longer.”',0,'An analogy hooks the new idea onto something they already know.'],
   ['Quinn wants to show how ticket ownership changes after a resale.',2,'Before-and-after pictures can be clearer than a whole essay.']]);}}
  ]
});
</script>
</body>
</html>
