<script>
Course.lesson({
  id:'0005', title:'Vision, strategy and getting set up', minutes:20, icon:'compass',
  goals:['Tell a technical vision from a technical strategy, and know when you need neither','Break a strategy into diagnosis, guiding policy and coherent actions','Set up the effort: join existing work, win a sponsor, pick a core group and scope'],
  parts:['A missing map','Vision and strategy','Getting set up','Ready to start?'],
  read:'Read the first half of chapter 3 for the SystemX story, the SockMatcher scenario and the full checklist.',
  glossary:{
    'commons':'Tragedy of the commons: when every team does what’s best for itself, and the shared result is bad for everyone.',
    'kernel':'Kernel of a strategy: Richard Rumelt’s three parts of any real strategy: a diagnosis, a guiding policy and coherent actions.',
    'ape-games':'Ape games: dominance plays and politicking, where people fight to be seen as the leader of an area instead of working together.',
    'dri':'DRI (directly responsible individual): the one person who is accountable for a goal and gets the final say, for example when a group is stuck.',
    'elevator-pitch':'Elevator pitch: the short version of your case, short enough to say in an elevator ride (the book suggests about 50 words).'
  },
  cheatsheet:[
    'When every team decides alone you get local maximums, neglected shared problems and decisions made without context. Big unmade decisions get harder over time.',
    'A <b>technical vision</b> describes the future once the problems are solved. A <b>technical strategy</b> is the plan of action to get past the obstacles.',
    'Rumelt’s kernel: <b>diagnosis</b> (what’s going on, simpler than reality), <b>guiding policy</b> (a signpost), <b>coherent actions</b> (what you’ll do, and won’t).',
    'Don’t write one you don’t need. If everyone can align without it, or one decision is blocking you, just make the call.',
    'The agreement <i>is</i> the work. Expect boring, obvious ideas. Join an existing effort (share the lead, follow their lead, or step away) instead of competing.',
    'Get a <b>sponsor</b> (director or VP): bring them something they want, in about 50 words, and keep checking you still have their support.',
    'Small core group (2–4 with a real time commitment), wider allies, a realistic scope, and a gut check that it’s solvable.',
    'Run the checklist honestly. If every box is checked, make it official and work on it out loud.'
  ],
  steps:[
/* ---------- PART 1: A MISSING MAP ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">After the Saturday incident, three Usherly teams each fix on-sale surges their own way: one adds a cache, one adds retries, one builds its own queue. Each fix makes sense. What’s the risk?</h1>');
  L.mc(L.card,['None, since each team knows its own system best','The fixes may clash, and the shared part stays broken'],1,
   'Each fix is sensible on its own. Together they may fight each other, and Box Office, which everyone shares, gets no fix at all. This lesson is about creating the big picture that stops that.',
   'Teams do know their own systems. But nobody is looking at the whole, so the fixes may clash, and the part they all share stays broken. This lesson is about creating that missing big picture.');}},
{part:0,src:'Chapter 3 · What’s a Vision? What’s a Strategy?',run(L){
  L.h(L.kick('learn','When every team decides alone')+'<h1 class="q">Letting each team decide is fast, until it isn’t</h1>'+
   L.prose('Letting teams make their own decisions can help an organization move quickly. But when there’s no shared direction, the book lists three problems:')+
   L.list([['people','The shared result is bad','Each team does what’s best for itself and the total is bad for everyone, a '+L.g('commons','tragedy of the commons')+'. It’s the '+L.g('local-max','local maximum')+' again.'],
     ['alert','Shared problems get neglected','No single team has the power, or the reason, to fix them alone.'],
     ['eye','Decisions lack context','The people deciding may not be the people who live with the results, or they may live with them much later.']],4)+
   L.prose('Big decisions that nobody makes don’t go away. Teams guess, build their guesses into their own systems, and the question gets <b>harder</b> to settle later.'));
  L.done();}},
{part:0,src:'Chapter 3 · Creating the Big Picture',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">One question at an all-hands, three different answers</h1>');
  L.beats(L.card,[
   ['The setup','A critical system, which the author calls SystemX, has caused outages. Someone asks about it for an upcoming all-hands, and the author is picked to answer.'],
   ['Message 1','A colleague asks them to reassure everyone: the team is growing and adding capacity, so no more outages are expected.'],
   ['Message 2','Almost at once, another says: tell everyone SystemX is deprecated and they should plan to move off it.'],
   ['Message 3','A third says: announce my new working group, which will explore how SystemX should evolve and report next quarter.'],
   ['The real problem','Each plan was reasonable. But there were <b>three</b> of them, and nobody had noticed.']],
   'The group didn’t lack good ideas. It lacked one shared picture of where it was going. Creating that picture is what this chapter is about.');}},
{part:0,src:'Chapter 3 · What’s a Vision? What’s a Strategy?',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Which sign best suggests Usherly needs a big central decision, not more team-by-team choices?</h1>');
  L.mc(L.card,['Every design review reargues how to handle on-sale traffic','One team’s design review runs a little long this week','A team picks a new logging library for its own service'],0,
   'When the same big question eats time in review after review, and designs bake in different answers, the book says it’s time for a central decision.',
   'One long review, or a choice that only touches one team, is normal. The sign is the <i>same</i> big question coming back in review after review.');}},
{part:0,src:'Chapter 3 · What’s a Vision? What’s a Strategy?',pts:3,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which problem is this?',['Bad shared result','Shared problem neglected','Missing context'],[
   ['To survive surges, every team adds aggressive retries. Together, the retries hammer Box Office harder during on-sales.',0,'Each team’s choice is sensible for that team, but the sum is worse for everyone: a tragedy of the commons.'],
   ['Box Office’s seat-hold table slows every on-sale. All 14 teams suffer, but none can justify fixing it alone.',1,'It hurts everyone, and no single team has the power or the reason to fix it.'],
   ['The event-pages team sets cache times without knowing that organizers change prices minutes before an on-sale.',2,'The people making the choice aren’t the ones who see the results, so they decide without the context they need.']]);}},

/* ---------- PART 2: VISION AND STRATEGY ---------- */
{part:1,src:'Chapter 3 · What’s a Technical Vision?',run(L){
  L.h(L.kick('learn','Technical vision')+'<h1 class="q">A vision describes the world after the work is done</h1>'+
   L.prose('A '+L.g('vision','technical vision')+' describes the future once the goals are met and the biggest problems are solved. It’s sometimes called a “north star.” It can cover all of engineering or just one team.')+
   L.prose('It creates a <b>shared reality</b>. Many senior people can picture a better future, but their pictures may not match. Writing it down makes hidden disagreements visible early.')+
   L.tiers([['list','What it might contain','Values and goals, principles for making decisions, decisions already made, an architecture diagram.','A sentence, a 20-page essay or a slide deck'],
            ['check','What it must be','Clear, opinionated, a realistic better future, and fitted to what your organization needs.','',true,'Key'],
            ['bulb','A test question','If you could wave a magic wand and be done, what would your architecture, processes and teams look like?','']])+
   '<p class="small" style="margin-top:10px">A vision doesn’t make every decision. It removes conflict and ambiguity so people can choose their own path and still arrive in the right place.</p>');
  L.done();}},
{part:1,src:'Chapter 3 · What’s a Technical Strategy?',run(L){
  L.h(L.kick('learn','Technical strategy')+'<h1 class="q">A strategy is a plan for getting past the obstacles</h1>'+
   L.prose('A '+L.g('strategy','technical strategy')+' is a plan of action: how you’ll reach your goals despite the obstacles in the way. A vision brings clarity about the destination. A strategy brings clarity about the <i>path</i>.')+
   L.prose('The book uses Richard Rumelt’s '+L.g('kernel','kernel of a strategy')+', from <i>Good Strategy/Bad Strategy</i>:')+
   L.flow([['eye','Diagnosis','What’s going on here? Simpler than the messy reality.','hard, takes time'],['compass','Guiding policy','Your approach to the obstacles. Short and clear, like a signpost.','makes later choices easier'],['list','Coherent actions','What you’ll do, and what you won’t.','people and time committed']])+
   L.note('Actions are rarely just technology. They can include new teams, new processes and changed projects. Focus means some exciting ideas won’t happen.','alert'));
  L.done();}},
{part:1,src:'Chapter 3 · Coherent actions',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">A strategy that feeds itself</h1>');
  L.beats(L.card,[
   ['The problems','Isaac Perez Moncho, an engineering manager in London, was writing an engineering strategy. The product teams had too few tools, too many incidents and poor deployments.'],
   ['The advantage','He also had a strong DevOps team who could fix those problems, if only they had more time.'],
   ['The guiding policy','Free up some of the DevOps team’s time.'],
   ['The loop','With that time, they automated work, which freed even more time, which let them solve more problems.'],
   ['The lesson','Good strategies use your advantages, ideally in a way that keeps reinforcing itself. And they stay realistic: a plan your organization can’t staff is a waste of your time.']],
   'Look for the advantage you already have, and design the plan so that using it makes it stronger.');}},
{part:1,src:'Chapter 3 · What’s a Technical Strategy?',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Quinn drafts three sentences. Which one is a <b>strategy</b> rather than a vision?</h1>');
  L.mc(L.card,['In two years, any on-sale is a quiet day and fans wait in a fair queue','Usherly is the ticketing company fans trust most on the busiest nights','Surges overload Box Office, so we’ll limit inflow first, starting with checkout'],2,
   'It names an obstacle and a way past it. That’s a plan of action, so it’s strategy.',
   'The other two describe a future state you’d like to reach, which makes them vision. The strategy is the one with an obstacle and a plan for getting past it.');}},
{part:1,src:'Chapter 3 · What’s a Technical Strategy?',pts:5,run(L){
  L.h(L.kick('pr','Sort Quinn’s notes')+'<h1 class="q">Quinn’s notes for an on-sale strategy are a mess. Sort each line into the right part.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Vision','Diagnosis','Guiding policy','Action'],[
   ['Checkout stays up and calm even when a stadium tour goes on sale.',0,'That describes the future once the problem is solved.'],
   ['Retries from many teams multiply load on one shared table in Box Office.',1,'It explains what’s going on, simpler than the full mess.'],
   ['Control how much traffic reaches Box Office, rather than absorb all of it.',2,'It’s a short signpost that makes the later choices easier.'],
   ['Put a waiting room in front of checkout before the spring tours.',3,'It’s a specific step that people and time will be committed to.'],
   ['We will not start a Box Office rewrite this year.',3,'Actions include what you won’t do. Saying no frees people for the chosen work.']],
   'A vision is the destination. A strategy explains the situation, picks a direction, then commits to specific actions, including what to skip.');}},
{part:1,src:'Chapter 3 · Do You Really Need Vision and Strategy Documents?',run(L){
  L.h(L.kick('learn','Do you even need one?')+'<h1 class="q">Create what your organization needs, and no more</h1>'+
   L.prose('Visions and strategies bring clarity, but they take a lot of time. For many situations they’re overkill.')+
   L.list([['check','Easy to describe?','If the goal or problem is simple, the goals section of a design document, or even a pull request description, may be enough.'],
     ['people','Already aligned?','If everyone can agree without a document, you probably don’t need one.'],
     ['target','Stuck on one decision?','Don’t write philosophy. Make a call on the specific item that’s blocking you.'],
     ['map','Truly lost or growing fast?','Then a vision, a strategy, or one followed by the other, may be worth it.']],2));
  L.done();}},
{part:1,src:'Chapter 3 · Do You Really Need Vision and Strategy Documents?',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'What does this situation need?',['A technical vision','A technical strategy','No big document'],[
   ['The VP of Engineering expects Usherly to triple its events in three years and asks what the architecture should look like by then.',0,'It’s a request to describe a future state for a growing company. That’s a vision.'],
   ['Teams keep arguing over one thing: which queue library to use for on-sales.',2,'One blocking decision doesn’t need philosophy. Make the call on that item.'],
   ['Surges keep breaking checkout. There are dozens of ideas and no agreement on which obstacles to tackle first.',1,'They need to diagnose the situation, pick a direction and commit to some actions. That’s a strategy.'],
   ['Everyone agrees the seat-map cache needs a longer timeout. It’s a two-line change.',2,'If people align without a document, skip it. A clear pull request description is enough.']]);}},

/* ---------- PART 3: GETTING SET UP ---------- */
{part:2,src:'Chapter 3 · Embrace the Boring Ideas',run(L){
  L.h(L.kick('learn','The agreement is the work')+'<h1 class="q">Expect boring ideas, and that’s fine</h1>'+
   L.prose('Writing a vision or strategy is a big project. Getting people to agree isn’t a chore that stands in the way of the real work. The book says the agreement <b>is</b> the work.')+
   L.prose('When the author was new to the industry, she pictured very senior engineers as wizards with game-changing ideas. In real life, wherever there are senior people, good ideas usually already exist. What’s missing is agreement on which one to follow.')+
   L.quote('If you write something interesting, it’s probably wrong.','Camille Fournier, quoted in chapter 3')+
   L.prose('What’s needed is someone who weighs all the options, makes the case for what to do and not do, brings everyone along, and is brave enough to make a decision that might be wrong.'));
  L.done();}},
{part:2,src:'Chapter 3 · Join an Expedition in Progress',run(L){
  L.h(L.kick('learn','Join an expedition in progress')+'<h1 class="q">If someone has already started, don’t compete. Join them.</h1>'+
   L.list([['Share the lead','Split the leadership: one leads the overall project, the other leads pieces inside it. Or co-lead and take turns as main author.'],
     ['Follow their lead','Put your ego aside. Fill the gaps in their skills, dig into old code for them, and argue for the plan in rooms they aren’t in.'],
     ['Step away','Decide it will succeed without you, cheer it on, and find a project that needs you.']],3)+
   L.note('Promotion systems can tempt people into '+L.g('ape-games','ape games')+': fighting to “win” an area. Ask yourself: is their direction <b>wrong</b>, or just <b>different</b>? Don’t fight for a slightly better path if the cost is no decision at all.','alert')+
   '<p class="small" style="margin-top:10px">Even if you think their plan is harmful, try to join it and change its direction. You inherit their allies, momentum and lessons.</p>');
  L.done();}},
{part:2,src:'Chapter 3 · Join an Expedition in Progress',run(L){
  L.h(L.kick('ex','Back at Usherly')+'<h1 class="q">Quinn finds someone already on the trail</h1>');
  L.beats(L.card,[
   ['The plan','After the Saturday incident, Quinn wants to write a strategy for surviving on-sale surges in Box Office.'],
   ['The discovery','While mapping who cares about surges, Quinn finds that Noa has a half-written “on-sale readiness” doc from the Platform side.'],
   ['The temptation','Quinn’s first thought is to start a fresh doc focused on Box Office. Quinn knows that code better than anyone.'],
   ['The check','Quinn asks: is Noa’s direction wrong, or just different? It’s different. It starts from load balancers rather than Box Office, but it points the same way.'],
   ['The deal','They agree to <b>share the lead</b>. Quinn leads the overall strategy; Noa leads the Platform pieces inside it. Noa’s draft becomes their starting point.']],
   'Quinn gains Noa’s allies, notes and momentum, and Usherly avoids having two rival surge plans.');}},
{part:2,src:'Chapter 3 · Join an Expedition in Progress',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Mika is already drafting a plan for payment retries during surges. It’s decent, just not how Quinn would do it. What should Quinn do?</h1>');
  L.mc(L.card,['Start a second plan with a slightly better design','Ask Ezra to judge between Mika’s plan and a new one','Back Mika’s plan and help fill in the gaps'],2,
   'Following someone else’s lead is a big-impact role. Quinn can nudge Mika’s plan, fill gaps and argue for it in other rooms.',
   'A rival plan, or a contest judged by Ezra, starts ape games and may leave no decision at all. If the direction is just different, not wrong, support it.');}},
{part:2,src:'Chapter 3 · Get a Sponsor',run(L){
  L.h(L.kick('learn','Get a sponsor')+'<h1 class="q">Big plans need someone with the power to make them real</h1>'+
   L.prose('In most organizations a big effort without high-level support won’t succeed. A '+L.g('sponsor','sponsor')+', usually a director or VP, makes your plan the <i>organization’s</i> map, not just yours. They can set success criteria, break ties, or name a '+L.g('dri','DRI')+'.')+
   L.list([['target','Bring them something they want','Better than “good for the company”: something that solves a problem they care about or unblocks their goals.'],
     ['clock','Polish your pitch first','If you can’t convince them in about 50 words, you may not be able to at all. You rarely get a second try.'],
     ['person','Staff can’t sponsor','A sponsor decides what an organization spends people and time on. That’s usually a director or VP.'],
     ['cycle','Keep checking','Support can fade as things change. Check in so you <i>still</i> have it.']],1));
  L.done();}},
{part:2,src:'Chapter 3 · Get a Sponsor',pts:1,
 solve:async L=>{[...L.$('#pp').children].forEach(b=>b.click());},
 run(L){
  const P=[
   ['The deep dive','“Let me walk you through how the seat-hold table locks, why retries stack up, how the connection pool is sized…” (and so on, for ten minutes)','about 400 words','“I’m ten minutes in and I still don’t know what you need from me.”','no'],
   ['Your launch, protected','“On-sales are Usherly’s riskiest hours, and Resale will run on the same checkout next spring. Back a plan to keep checkout up during surges, and I’ll bring it to you in six weeks.”','37 words','“That’s my launch you’re talking about. What do you need from me?”','ok'],
   ['Good for everyone','“Reliability matters to the whole company. We really should write a strategy about it. It’s the right thing to do.”','20 words','“Sure, in principle. But why now, and why my teams?”','no']];
  const seen=new Set();
  L.h(L.kick('pr','Try your pitch')+'<h1 class="q">Quinn gets five minutes with Ezra. Try each pitch and watch how Ezra reacts.</h1><div id="pp" style="display:flex;flex-wrap:wrap;gap:8px"></div>'+
   '<div style="background:var(--soft);border-radius:16px;padding:14px;margin:10px 0 6px;min-height:140px" id="pv"><div class="small">Pick a pitch above.</div></div><div id="pq"></div>');
  P.forEach((p,j)=>{const b=document.createElement('button');b.className='chip';b.innerHTML=L.ic('chat')+p[0];
    b.onclick=()=>{[...L.$('#pp').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(j);
      L.$('#pv').innerHTML='<div class="small" style="margin-bottom:6px"><b>Quinn</b> · '+p[2]+'</div><p class="prose" style="margin:0 0 10px">'+p[1]+'</p><div style="color:var(--'+p[4]+')"><b>Ezra:</b> '+p[3]+'</div>';
      if(seen.size===3&&!L.$('#pq').innerHTML){const q=L.$('#pq');q.innerHTML='<h2 class="sub">Which pitch should Quinn lead with?</h2>';
        L.mc(q,P.map(x=>x[0]),1,'It’s short, and it ties the plan to Ezra’s own goal: the Resale launch. Sponsors back plans that solve <i>their</i> problems.',
         'Detail loses a busy director, and “good for the company” gives no reason to act now. Tie the plan to something Ezra already cares about, in about 50 words.');}};
    L.$('#pp').appendChild(b);});}},

/* ---------- PART 4: READY TO START? ---------- */
{part:3,src:'Chapter 3 · Choose Your Core Group',run(L){
  L.h(L.kick('learn','Choose your core group')+'<h1 class="q">A small crew to write it, a wider circle to support it</h1>'+
   L.prose('Working with others keeps you accountable and pools your contacts, '+L.g('credibility','credibility')+' and '+L.g('social-capital','social capital')+'. Agreeing inside the group also surfaces disagreements early.')+
   L.lanes([['people','Core group','<b>Two to four people</b>, including you. Ask for a real time commitment, such as 8–12 hours a week. That keeps the group small without excluding anyone, and keeps “tourists” out.',2],
            ['chat','Wider allies','Interview them, represent their views, send updates and invite comments on early drafts. Their knowledge makes the plan better.',3]])+
   L.prose('Use your topographical map: who will oppose this? For a likely dissenter, either have enough support to outweigh them, or <b>bring them in from the start</b> and learn why they object.')+
   '<p class="small">Say up front whether you’re the lead and final decider or a “first among equals.” Either way, let the group lead too.</p>');
  L.done();}},
{part:3,src:'Chapter 3 · Set Scope',run(L){
  L.h(L.kick('learn','Set scope, check it’s achievable')+'<h1 class="q">Big enough to solve the problem, small enough to finish</h1>'+
   L.list([['target','Cover enough ground','Aim to solve the problem, within your skill and influence. Changing another team’s systems? Put someone from that team in the core group.'],
     ['x','No magical thinking','If the plan needs something you can’t control, like a new CEO or customers buying differently, work around it instead.'],
     ['list','Agree on the output','Have each core member say what documents or “bumper stickers” they expect at the end. Pick a format your sponsor likes.'],
     ['compass','Get a gut check','Ask someone who has done this before whether you’ll hit a dead end. Saying a problem is too big for you now is good risk analysis.']],2)+
   '<p class="small" style="margin-top:10px">If it isn’t solvable by you, the book’s honest options include recruiting someone with the missing skills, shrinking the scope, or working on something else.</p>');
  L.done();}},
{part:3,src:'Chapter 3 · Choose Your Core Group',run(L){
  L.h(L.kick('ex','Back at Usherly')+'<h1 class="q">Quinn and Noa set up the effort</h1>');
  L.beats(L.card,[
   ['Core group','Quinn and Noa invite Saskia, an SRE on Wren’s Infrastructure team who knows the load balancers. All three commit about 8 hours a week.'],
   ['The dissenter','Wren is wary: their team is overloaded and fears another wave of tickets. Quinn asks Wren what worries them most and promises an early look at every draft.'],
   ['Allies','Mika, Hollis and two Box Office tech leads will be interviewed and asked to comment on drafts, without joining the core group.'],
   ['Scope','Box Office and checkout during on-sales, for the next year: a strategy, not a vision. An idea to make promoters stop announcing on-sales at noon is dropped. Usherly can’t control that.'],
   ['Gut check','Quinn asks the VP of Engineering, who once led a similar effort elsewhere, whether this is solvable. The answer: yes, if the scope stays this tight.']],
   'A small committed group, the skeptic brought in early, a scope that matches their influence, and an outside check that it can be done.');}},
{part:3,src:'Chapter 3 · Choose Your Core Group',pts:5,run(L){
  L.h(L.kick('pr','Who goes where?')+'<h1 class="q">Five people want to help with the on-sale strategy. Where should each one fit?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Core group','Wider allies'],[
   ['A Box Office engineer who can give 10 hours a week and knows the seat-hold code',0,'They can commit real time and bring knowledge the group needs.'],
   ['Hollis, who has strong opinions but only an hour a month',1,'Interview Hollis and invite comments on drafts. The core group needs a time commitment.'],
   ['A manager who wants to attend meetings “to stay in the loop”',1,'That’s a tourist. Keep them updated without making the core group bigger.'],
   ['Mika, keen to learn but already overcommitted on Payments',1,'Mika can be interviewed and review drafts without taking on 8 more hours a week.'],
   ['A second load-balancer expert, when Saskia is already in the group',1,'Keep the core at two to four. One expert from that team is enough; the other can review.']],
   'Core members commit real time and bring something the group lacks. Everyone else can still shape the plan through interviews and drafts.');}},
{part:3,src:'Chapter 3 · Make It Official',run(L){
  L.h(L.kick('learn','The checklist')+'<h1 class="q">Before you start writing, check every box honestly</h1>'+
   L.list([['check','We need this.',''],['check','I know the solution will be boring and obvious.',''],['check','There isn’t an existing effort, or I’ve joined it.',''],['check','There’s organizational support.',''],['check','We agree on what we’re creating.',''],['check','The problem is solvable, by me.',''],['eye','I’m not lying to myself about any of the above.','']],2)+
   L.prose('If you can’t check every box, the author’s advice is to stop. Your time has other uses. If you can, <b>make it official</b>: kickoff notes, milestones and progress updates. Work on it out loud, so people can bring you information and help.'));
  L.done();}},
{part:3,src:'Chapter 3 · Make It Official',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which box can’t be checked?',['We need this','Existing effort','Organizational support','Solvable by me'],[
   ['Ezra likes the idea in a hallway chat but hasn’t agreed to back it or give it any people.',2,'Liking an idea isn’t sponsorship. Without a committed sponsor, the plan may never be staffed.'],
   ['Quinn learns that a Payments group has been writing its own surge plan for a month.',1,'Join that effort, or agree how the two fit, before writing a competing plan.'],
   ['Everyone already agrees on the fix. It just needs one engineer for a week.',0,'If people are aligned and the work is small, a big document only slows things down.'],
