<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lost, Done or Stopped</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0014', title:'Lost, done or stopped', minutes:20, icon:'map',
  goals:['Tell which of three ways a project is lost, and pick the moves that fit','Spot a false finish (not usable, not used, or shaky) before the team goes home','End a project on purpose: stop early, handle a cancellation, or celebrate a real arrival'],
  parts:['Lost','False finishes','Unused or shaky','Endings'],
  read:'Read the second half of chapter 6 for the full list of techniques and the storage-team story.',
  glossary:{
    'analysis-paralysis':'Analysis paralysis: a group so busy debating options that it never decides and never moves.',
    'definition-of-done':'Definition of done: the criteria, agreed before work starts, that must be true before anyone can call a piece of work finished.',
    'dogfooding':'Dogfooding: regularly using the thing you build yourself, so you share your users’ experience (from “eating your own dog food”).',
    'sunk-cost':'Sunk cost fallacy: sticking with something because of the time, money or energy already spent on it, even when going on is a bad idea.',
    'retro':'Retrospective: a meeting or write-up where the team looks back at what happened and what it learned, after failures and successes alike.'
  },
  cheatsheet:[
    '<b>Lost</b> is not blocked: nothing is in the way, you just don’t know the way. Ask: is it where we’re going, how to get there, or where we stand?',
    'No destination? <b>Clarify roles</b> (hear everyone, one person decides), then choose a <b>strategy</b>, a <b>problem</b> or a <b>stakeholder</b>.',
    'No path? Articulate the problem, revisit assumptions, give it time, look for prior art, try another angle, start smaller, ask for help.',
    'Unsure of support? <b>Go and ask</b> your sponsor, make roles official, ask for what you need, refuel the team.',
    'Code complete isn’t done. <b>Define done</b> up front, be your own user, and <b>celebrate landings, not launches</b>.',
    'Nobody using it? <b>Tell people, and keep telling them</b>; make it easy to find under every likely name.',
    'Shaky foundation? Ask for tests and monitoring every time, put cleanup in the user stories, negotiate engineer-led time.',
    'Ending on purpose is fine: stop when it’s done enough, kill a doomed project early, handle a cancellation with care, and double-check before declaring victory.'
  ],
  steps:[
/* ---------- PART 1: LOST ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Noa leads a group asked to “modernize Box Office.” They have a team, a mandate and no blockers. Four months in, nothing has shipped. What’s most likely wrong?</h1>');
  L.mc(L.card,['A missing tool or system is holding them up','They haven’t agreed on where they’re going'],1,
   'Nothing is in their way, yet they aren’t moving. That’s what being <i>lost</i> looks like, and it’s the first topic of this lesson.',
   'There’s no blocker to point at, so a missing tool is unlikely. When nothing is in the way and you still don’t move, you’re usually lost: nobody agrees on the destination.');}},
{part:0,src:'Chapter 6 · You’re Lost',run(L){
  L.h(L.kick('learn','Blocked is not the same as lost')+'<h1 class="q">Sometimes nothing is in the way. You just don’t know the way.</h1>'+
   L.prose('Last lesson was about blockers: another team, a decision, a missing click. This lesson starts with a quieter reason projects stall. You can’t see any obstacle, yet you aren’t getting anywhere. You’re <b>lost</b>.')+
   L.flow([['compass','Where you’re going','No agreed destination','',1],['map','How to get there','The problem is just hard','',2],['eye','Where you stand','Is the work still wanted?','',3]])+
   L.prose('Each kind of lost needs different moves, so the first job is to work out which one you’re in.'));
  L.done();}},
{part:0,src:'Chapter 6 · You Don’t Know Where You’re All Going',run(L){
  L.h(L.kick('ex','Usherly story')+'<h1 class="q">Why Noa’s Box Office group is going in circles</h1>');
  L.beats(L.card,[
   ['The mandate','The VP of Engineering sets a goal: “modernize Box Office.” Noa gets a small dedicated team. Fourteen teams change Box Office, so all fourteen care.'],
   ['The opinions','One group wants to split it into microservices. Another wants feature flags and fast rollbacks so changes are safer. A third wants events everywhere. Greta only cares that the data stops getting corrupted.'],
   ['The noise','Every design doc collects a hundred comments. Every meeting has too many voices. Everyone agrees <i>something</i> must happen; nobody agrees on what.'],
   ['The result','Months go by. The group is stuck in '+L.g('analysis-paralysis','analysis paralysis')+'. There’s nothing to steer, because there’s no project yet: just a pile of good ideas.']],
   'A huge group facing an undefined mess will almost always freeze. Before you can find a path, you need a destination.');}},
{part:0,src:'Chapter 6 · Choosing a destination',run(L){
  L.h(L.kick('learn','Choosing a destination')+'<h1 class="q">Four ways to decide where you’re going</h1>'+
   L.list([['people','Clarify roles','Say from the start: we want to hear from everyone, but we’re not aiming for full agreement. The lead decides. If you can’t claim that, ask your '+L.g('sponsor','sponsor')+' to back you. Without that support, you may not be set up to succeed.'],
     ['compass','Choose a strategy','Rule: no implementation talk until everyone agrees on the problem. Have a small group write a strategy. It will make trade-offs and leave some real problems unsolved for now.'],
     ['target','Choose a problem','No time for a strategy? Pick one real problem. Promise to come back to the others later. Any deliberate direction beats staying frozen.'],
     ['person','Choose a stakeholder','Instead of “fix the whole architecture,” help one team get one thing done. Then the next. Once results show, revisit the big strategy.']],1));
  L.done();}},
{part:0,src:'Chapter 6 · Choosing a destination',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">In Noa’s group, every meeting turns into a fight about which message queue to use, before anyone has agreed what’s broken. What should Noa do?</h1>');
  L.mc(L.card,['Let the debate run until everyone finally agrees','Pause tool talk until the problem itself is agreed','Settle it by a vote on the most popular queue'],1,
   'That’s the “choose a strategy” rule: no implementation details until the group agrees on the problem it’s solving.',
   'Waiting for full agreement or voting on a tool both skip the real question: what problem are we solving? The book says to ban implementation talk until that’s settled.');}},
{part:0,src:'Chapter 6 · You Don’t Know How to Get There',run(L){
  L.h(L.kick('learn','You know where, but not how')+'<h1 class="q">The path is unknown, not unknowable</h1>'+
   L.prose('Sometimes the destination is clear and nothing blocks you, yet you can’t crack the next problem. Avoiding it makes it feel worse. Tap each card for a way to find your footing.'));
  L.flips(L.card,[
   ['Articulate the problem','Write it down or say it out loud. Be precise about what <i>is</i> happening versus what <i>should</i> be happening.'],
   ['Revisit your assumptions','Have you already picked a solution in your head? Ruled out trade-offs, or answers that seemed “too easy”?'],
   ['Give it time and room','Sleep on it, or step away for a few days. Book hours of focused time, not the gaps between meetings.'],
   ['Look for prior art','Has someone solved this before, inside or outside the company? Aviation, medicine and civil engineering often have.'],
   ['Try a different angle','A technical problem might have an organizational fix, and the reverse. Who would you pay to solve it?'],
   ['Start smaller, ask for help','Solve one small piece, or start with a rough version. Ask colleagues, mentors and experts: no need to learn it all from scratch.']],
   'Being stuck on a hard problem is normal. These moves turn “I don’t know” into “here’s what I’ll try next.”');}},
{part:0,src:'Chapter 6 · You Don’t Know Where You Stand',run(L){
  L.h(L.kick('learn','You don’t know where you stand')+'<h1 class="q">Is this work still wanted?</h1>'+
   L.prose('The scariest kind of lost: your sponsor checks in less, your project is missing from the list of company priorities, and teammates say “if” instead of “when.” Nobody tells you anything.')+
   L.lanes([['alert','It might be at risk','A new leader or new priorities can quietly kill a project. Leads in unusual positions are easy to forget.',3],
            ['check','It might be fine','When there are fires elsewhere, nobody checks on a project that’s humming along. Silence can mean “keep going.”',2]])+
   L.list([['Clarify support','Brace yourself, then ask your manager or sponsor whether the project should continue.'],
     ['Clarify roles','If you’re the lead and nobody else knows it, you’re not the lead. Make it official.'],
     ['Ask for what you need','A mention at the all-hands or a place on the org’s goals. You won’t get it if you don’t ask.'],
     ['Refuel','A “Phase 2” kickoff, new deadlines or a keen new teammate can restart a tired team.']],2));
  L.done();}},
{part:0,src:'Chapter 6 · Getting back on solid ground',pts:1,run(L){
  L.h(L.kick('pr','What should Quinn do?')+'<h1 class="q">The VP shares next half’s top priorities. Resale isn’t on the list. Ezra has skipped two check-ins, and Lucia now says “if Resale ships.” What should Quinn do first?</h1>');
  L.mc(L.card,['Keep working quietly, since silence means all is well','Start a Phase 2 kickoff to lift the team’s spirits','Ask Ezra plainly whether Resale is meant to continue'],2,
   'Going on without knowing just builds stress and may waste time. Quinn should brace for any answer and ask.',
   'Silence <i>might</i> mean all is well, but guessing either way is risky, and a pep talk before knowing the facts could be wasted. The first move is to clarify support: ask Ezra directly.');}},
{part:0,src:'Chapter 6 · You’re Lost',pts:5,run(L){
  L.h(L.kick('pr','Which kind of lost?')+'<h1 class="q">Sort each Usherly situation by what’s missing.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Where we’re going','How to get there','Where we stand'],[
   ['Bao’s fraud group has argued for weeks over three different goals for resale fraud checks.',0,'They haven’t agreed on a destination. Clarify roles and choose one problem.'],
   ['Quinn knows Resale must stop bots reselling above the cap, but can’t see any design that works.',1,'The goal is clear; the path isn’t. Articulate the problem, look for prior art, ask for help.'],
   ['Lucia hears at the all-hands that the mobile app will be “refocused” next quarter.',2,'This is about support, not direction. Lucia should ask whether the mobile part of Resale still stands.'],
   ['Hollis has redesigned seller payouts four times, and every version still feels wrong.',1,'A hard problem with a known goal. Try a different angle, or start with a rough version and iterate.'],
   ['The Resale planning meeting moved, and Quinn wasn’t invited. Nobody has said why.',2,'Quinn is unsure of their standing. Time to ask Ezra and make roles clear.']],
   'Name the kind of lost first. Each one has its own set of moves.');}},

/* ---------- PART 2: FALSE FINISHES ---------- */
{part:1,src:'Chapter 6 · You Have Arrived…Somewhere?',run(L){
  L.h(L.kick('learn','False finishes')+'<h1 class="q">The team went home, but the problem isn’t solved</h1>'+
   L.prose('Another way projects stop: everyone thinks they’ve arrived. The tasks are ticked off, the team has collected its praise and moved on. Yet the customer still isn’t happy.')+
   L.tiers([['check','Code complete, but not usable','Only the coding work was planned. Nobody can use it yet.','This part'],
            ['eye','Done, but nobody uses it','It works, but the people who need it don’t know it exists.','Next part'],
            ['alert','Done, on a shaky foundation','Users are happy, but everyone knows it’s held together with tape.','Next part']])+
   '<p class="small" style="margin-top:10px">Watch for all three before you declare victory.</p>');
  L.done();}},
{part:1,src:'Chapter 6 · But It’s Code Complete!',run(L){
  L.h(L.kick('ex','A familiar conversation')+'<h1 class="q">“It’s done!” “Great, can I use it?” “Well…”</h1>');
  L.beats(L.card,[
   ['Ezra asks','“Is the seller payout for Resale ready?” Hollis: “Yes, it’s done!”'],
   ['Ezra asks again','“Great. Can a fan resell a ticket and get paid today?” Hollis: “Well…”'],
   ['The “well”','It only runs in staging. The payout limits are hard-coded. One pull request is still waiting for review. It’s <i>done</i>, Hollis says. It just isn’t <i>usable</i>.'],
   ['What went wrong','Like most engineers, the team planned only the coding. Deploying, monitoring, launch approval from Oskar in Legal and updating the help pages were on nobody’s list.'],
   ['The point',L.quote('Nobody wants to use software. They want to catch a Pokémon.','Heidi Waterhouse, quoted in chapter 6')+'A fan doesn’t care how elegant the payout code is. Either they get paid or they don’t.']],
   'If the user can’t do the thing, the software might as well not exist.');}},
{part:1,src:'Chapter 6 · Making sure the user can catch a Pokémon',run(L){
  L.h(L.kick('learn','Making it really done')+'<h1 class="q">Three habits that stop work falling through the cracks</h1>'+
   L.list([['list','Define done','Before work starts, agree what the end looks like: a general checklist for every change plus criteria for this project. Let real users try it and agree it works. Until they do, nobody calls it done. This is a '+L.g('definition-of-done','definition of done')+'.'],
     ['person','Be your own user','Where you can, use what you’re building yourself, regularly. This is called '+L.g('dogfooding','dogfooding')+'.'],
     ['star','Celebrate landings, not launches','Celebrate when users are happily using it, not when an internal milestone is hit. In a migration, celebrate the old system being switched off, not the new one going live.']],1)+
   L.note('As lead, you look at the whole project, not just which tasks are ticked.','eye'));
  L.done();}},
{part:1,src:'Chapter 6 · Celebrate landings, not launches',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">The Till migration: when should Usherly throw the party?</h1>');
  L.mc(L.card,['When the new Payments service first went live','When 9 of the 14 teams had moved to Payments','When the last team leaves and Till is switched off'],2,
   'In a migration, the landing is the old thing being turned off. Until then, two systems run and the job is half done.',
   'A launch and a 9-of-14 milestone are only visible inside engineering. The book says to celebrate the landing: in a migration, that’s the old system switched off.');}},
{part:1,src:'Chapter 6 · But It’s Code Complete!',pts:1,
 solve:async L=>{L.$('#go').click();},
 run(L){
  const T=['Payout code merged','Unit tests pass','Code reviewed','Staging demo works'];
  const J=[['Open the ticket in the Usherly app',1],['Tap “Resell” and set a price',1],['A buyer pays',1],['The seller gets paid',0]];
  L.h(L.kick('pr','See it happen')+'<h1 class="q">The Payments board is all green. Let a real fan try to resell a ticket.</h1>'+
   '<div style="background:var(--soft);border-radius:16px;padding:14px;margin:8px 0 12px"><div class="small" style="margin-bottom:8px">Payments team board</div>'+
   T.map(t=>'<span class="chip static ok">'+L.ic('check')+t+'</span>').join('')+'</div>'+
   '<button class="btn pri" id="go">'+L.ic('play')+'Let a fan try</button><div class="ladder" id="jr"></div><div id="jq"></div>');
  L.$('#go').onclick=function(){this.remove();let i=0;
    const t=setInterval(()=>{const jr=L.$('#jr');if(!jr){clearInterval(t);return;}const s=J[i];
      jr.insertAdjacentHTML('beforeend',(i?'<div class="conn"></div>':'')+'<div class="rung'+(s[1]?'':' cur')+'">'+(s[1]?'':'<small style="color:var(--no)">Stuck</small>')+(s[1]?L.ic('check'):L.ic('x'))+s[0]+(s[1]?'':'<div class="small" style="margin-top:6px">Payouts were only ever switched on in staging. Turning them on in production was on nobody’s list.</div>')+'</div>');
      i++;
      if(i>=J.length){clearInterval(t);const q=L.$('#jq');q.innerHTML='<h2 class="sub">What would have caught this before anyone celebrated?</h2>';
        L.mc(q,['An agreed definition of done, with a real user test','Another careful round of code review on payouts','More unit tests covering the payout code paths'],0,
         'Every coding task was green. Only a definition of done that includes “a real fan gets paid” would have shown the gap.',
         'The code itself was fine and well tested. The missing piece was never a coding task. A definition of done with a user acceptance test checks the whole journey.');}},500);};}},

/* ---------- PART 3: UNUSED OR SHAKY ---------- */
{part:2,src:'Chapter 6 · It’s Done but Nobody Is Using It',run(L){
  L.h(L.kick('learn','Done, but nobody uses it')+'<h1 class="q">Beware of the Leopard</h1>'+
   L.prose('A platform team spends months on a great fix for a common problem. They give it a cute name, maybe write one doc, launch, celebrate… and teams keep doing it the old, painful way.')+
   L.prose('The book calls these <b>“Beware of the Leopard” projects</b>, after a joke in <i>The Hitchhiker’s Guide to the Galaxy</i>: the plans were “on display” in a locked filing cabinet, in a disused toilet, behind a leopard warning. The information exists. Nobody will ever find it.')+
   L.note('Another analogy from the book: it’s like a farmer who grows a crop and then leaves it in the field. You still have to harvest it and take it to people.','leaf')+
   L.lanes([['chat','Tell people','And <b>keep</b> telling them: emails, road shows, an all-hands slot, posters, testimonials. Give hands-on help to teams likely to speak up for you. Address what people worry about.',1],
            ['eye','Make it discoverable','Link to it wherever users look. Make every doc search land on it. Set up shortlinks for every likely name, including misspellings.',2]]));
  L.done();}},
{part:2,src:'Chapter 6 · Selling it',run(L){
  L.h(L.kick('ex','Usherly story')+'<h1 class="q">Runway, the paved road nobody takes</h1>');
  L.beats(L.card,[
   ['The launch','Wren’s team built Runway, a self-service deploy pipeline. It’s faster and safer than the old scripts. They wrote one page on the Platform wiki and moved on.'],
   ['The silence','Product engineers search their own wiki for “deploy” and find the old scripts page. “Runway” gives no hint of what it does. Most teams have never heard of it.'],
   ['Tell people','Quinn gets Wren a slot at the Product Engineering all-hands. Wren’s team gives Lucia’s mobile team hands-on help moving over, and Lucia agrees to share how it went.'],
   ['Answer the worry','Product teams ask: “Will it survive an on-sale?” The road show shows Platform’s work on surge traffic, so the worry is addressed, not ignored.'],
   ['Make it findable','Shortlinks for go/runway, go/deploy and even go/runaway. The old scripts page now points to Runway.']],
   'Building it was half the job. The other half is making sure people know it exists and want it.');}},
{part:2,src:'Chapter 6 · Tell people',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Three months after the road show, Runway sign-ups slow down again. What does the book suggest?</h1>');
  L.mc(L.card,['Accept it, since every team has heard of it once','Keep telling people until they tell each other','Rename Runway to something easier to remember'],1,
   'One announcement isn’t enough. Keep telling people until word of mouth takes over.',
   'Hearing about it once rarely changes habits, and a new name alone doesn’t spread the word. The book says to keep telling people until they start telling each other.');}},
{part:2,src:'Chapter 6 · It’s Built on a Shaky Foundation',run(L){
  L.h(L.kick('learn','Done, on a shaky foundation')+'<h1 class="q">There’s no such thing as a temporary hack</h1>'+
   L.prose('A quick prototype goes into production. Users are happy, so managers want to move on. But the engineers know it won’t scale, or it’s untested, or it’s a hack everyone else must work around.')+
   L.prose('Shipping fast can be the right call, for example when beating a competitor matters. But once the team moves on, the cheap version stays. The author learned this in a data center: a messy “temporary” cable stays until the server is retired.')+
   L.list([['shield','Set a culture of quality','Be the senior person who always asks for tests, asks “how will we monitor this?” and points out the docs need updating. Scale it with templates and style guides.'],
     ['person','Make the cleanup a user story','Put it in the project’s user stories. Frame it as user experience or groundwork for the next feature. Bug reports and outage follow-ups help make the case.'],
     ['cal','Negotiate engineer-led time','Fix-it weeks, tech-debt weeks, or a rotation where one person always makes things better. Don’t argue about what “counts.”']],3));
  L.done();}},
{part:2,src:'Chapter 6 · Make the foundational work a user story',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Resale shipped with a hacky payout limit. Tap each piece until Quinn’s request to Ezra makes the strongest case.</h1>');
  L.sentence(L.card,[['Rewriting payouts in a nicer framework','Replacing the hard-coded payout limits'],['should go in a separate tech-debt list','should go in the Resale user stories'],['because the code embarrasses the team','because late payouts stop sellers reselling']],[1,1,1],
   [['A rewrite for its own sake isn’t tied to any user need. Name the specific cleanup.'],['A separate list is easy to push aside. The book suggests putting cleanup in the project’s own user stories.'],['Embarrassment won’t persuade anyone. Tie the work to what customers experience.']],
   'A specific fix, inside the project’s stories, justified by its effect on customers. That’s the book’s recipe.');}},
{part:2,src:'Chapter 6 · You Have Arrived…Somewhere?',pts:6,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which false finish?',['Code complete, not usable','Done, but nobody uses it','Done, on a shaky foundation'],[
   ['The organizer tools redesign is “done,” but Legal hasn’t approved the launch.',0,'Launch approval is part of done. Organizers can’t use it yet.'],
   ['Platform’s new log search works well. It’s called “Ferret” and linked from one wiki page.',1,'A cute name and one hidden page: classic Beware of the Leopard.'],
   ['Resale’s price cap is a hard-coded list of 30 events. Adding one needs a deploy.',2,'Fans can use it, but it won’t grow. That’s a shaky foundation.'],
   ['A ticket-scanner fix shipped, but venue staff still use the old app. Nobody told them.',1,'It works, but its users don’t know. Tell people, and keep telling them.'],
   ['The new seat-map editor is merged, but runs only behind a staff-only flag.',0,'Merged code behind a flag isn’t something a user can use.'],
   ['During an on-sale, checkout’s queue was patched with untested code that’s still there.',2,'The “temporary” fix became permanent. Make the cleanup a user story.']]);}},

/* ---------- PART 4: ENDINGS ---------- */
{part:3,src:'Chapter 6 · The Project Just Stops Here',run(L){
  L.h(L.kick('learn','Ending on purpose')+'<h1 class="q">Four ways a project can deliberately end</h1>'+
   L.tiers([['check','A better place to stop','More work isn’t worth the cost. Watch for polishing something that’s done enough, a '+L.g('local-max','local maximum')+'. First check you aren’t leaving unhappy users or a half-finished migration.','Declare it done enough'],
            ['x','Not the right journey','You learn it can’t work. Stop early and share what you learned.','Kill it early'],
            ['alert','Canceled','Priorities, leaders or the market changed. The decision came from above.','Handle it with care'],
            ['star','The destination','You did the thing. Double-check, then celebrate.','Declare victory',true,'The goal']]));
  L.done();}},
{part:3,src:'Chapter 6 · It’s not the right journey to take',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">One of the biggest successes the author saw celebrated was a cancellation</h1>');
  L.beats(L.card,[
   ['The work','A team of senior engineers spent months building a new data storage system. Other teams were waiting eagerly for it.'],
   ['The discovery','As the work went on, they found it wouldn’t work at scale.'],
   ['The choice','They didn’t hunt for some use for what they’d built. They killed the project and wrote a detailed '+L.g('retro','retrospective')+'.'],
   ['Why it wasn’t failure','They could only learn it wouldn’t work by trying. Pushing on <i>after</i> knowing would have been the real failure.'],
   ['The trap','The '+L.g('sunk-cost','sunk cost fallacy')+': the more you’ve put in, the harder it is to stop. Saying “that didn’t work, and here’s what we learned” builds a team where people feel safe.']],
   'Knowing when to cut your losses is part of good judgment.');}},
{part:3,src:'Chapter 6 · It’s not the right journey to take',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Hollis’s team has spent four months on instant payouts for Resale. Tests show the bank’s limits make it impossible. Hollis says: “We’ve put in too much to stop now.” What should happen?</h1>');
  L.mc(L.card,['Stop now, and write up what the team learned','Push on, since four months is a lot to throw away','Keep it quietly and look for smaller uses for it'],0,
   'Four months are spent either way. Pushing on only postpones the end and blocks more useful work. A retrospective turns the effort into learning.',
   'That’s the sunk cost fallacy. The four months are gone whatever happens next, and hunting for a use for a doomed system wastes more. Stop and share what was learned.');}},
{part:3,src:'Chapter 6 · The project has been canceled',run(L){
  L.h(L.kick('learn','Canceled, or arrived')+'<h1 class="q">How to end well either way</h1>'+
   L.lanes([['alert','If it’s canceled','It feels bad, even if you agree. Work through your own feelings first. Get the bigger picture. Then tell your team <b>directly</b>, leading with why, before gossip or an email does. Let them react, even at you. Shut it down cleanly: turn things off, delete code, document if a restart is truly likely. Showcase people’s work to their next managers.',3],
            ['star','If you’ve arrived','Double-check first: are the goals met, can users really use it, is the foundation solid? Then celebrate and give people visibility. Hold a '+L.g('retro','retrospective')+' too: you learn from success as well. Call out the behaviors you want to see more of.',2]]));
  L.done();}},
