<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What Staff Engineers Are For</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0001', title:'What staff engineers are for', minutes:20, icon:'layers',
  goals:['Name the three pillars of the staff role and what holds them up','Spot a local maximum before a team picks it','Explain why leadership work is the job, not a distraction'],
  parts:['Two paths','Ladders and titles','The big picture','Projects and influence'],
  read:'Read the Introduction and the first half of chapter 1 for the full career-ladder and local-maximum discussion.',
  glossary:{
    'humaning':'“Humaning” skills: the book’s word for people and leadership skills, such as communicating, framing problems and mentoring.',
    'tpm':'TPM (technical program manager): the person who gets a big project delivered on time by running timelines, tracking progress across teams and communicating status.',
    'ladder':'Job ladder: a company’s list of levels (junior, senior, staff…) and what each level is expected to do.'
  },
  cheatsheet:[
    'Past senior, there are <b>two paths</b>: manager (clear and well traveled) or staff engineer (technical leader without reports, still poorly signposted).',
    '<b>Three pillars</b>: big-picture thinking, execution, leveling up. They stand on a <b>technical foundation</b>; “humaning” skills are the <b>flying buttresses</b>.',
    'Staff to manager at the same level is a <b>sideways move</b>. Senior is the anchor level; staying there is fine.',
    '<b>Titles matter</b>: they show progress, give authority to people who might not get it automatically, and signal competence outside.',
    'A <b>local maximum</b> is best for one team but costly for the whole company. Staff engineers bring the outsider view.',
    'Cross-team projects have gaps and overlaps. Someone must own <b>the whole thing</b>: TPMs own delivery, staff engineers own design and quality.',
    'Senior engineers set the real norms. Big-picture, big-project, good-influence work <b>is the job</b>.'
  ],
  steps:[
/* ---------- PART 1: TWO PATHS ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Quinn has just been promoted to staff engineer at Usherly. They plan to spend every hour coding, since great code got them promoted. Will Usherly get everything it hoped for?</h1>');
  L.mc(L.card,['Yes, more of Quinn’s code is the whole point','Probably not, some important work goes undone'],1,
   'Coding still matters, but this lesson shows the work only a staff engineer can do, and why it can’t be squeezed in on top of a full coding load.',
   'Great code helps, but the company promoted Quinn for things a coder alone can’t do. This lesson shows what those things are.');}},
{part:0,src:'Introduction · Two Paths',run(L){
  L.h(L.kick('learn','A fork in the road')+'<h1 class="q">After senior, two paths open up</h1>'+
   L.prose('A senior engineer who wants to keep growing usually meets a fork. One path leads to <b>management</b>: you take on direct reports. The other leads to <b>technical leadership without reports</b>, often called '+L.g('staff-engineer','staff engineer')+'.')+
   L.lanes([['people','Manager path','Clear and well traveled. You’ve had managers, there are many books on it, and people often treat “promotion” as “becoming someone’s boss.”',3],
            ['compass','Staff engineer path','Muddy and poorly signposted. Expectations vary between companies, and even inside one company the criteria can be vague.',2]])+
   L.prose('The two paths share a lot further on: they lead to many of the same places and need many of the same skills. The book’s promise is that the staff path isn’t wizardry. <b>It’s all learnable.</b>'));
  L.done();}},
{part:0,src:'Introduction · The Pillars of Staff Engineering',run(L){
  const col=(t,s,c)=>'<div style="flex:1;min-width:0;background:var(--'+c+'-bg);color:var(--'+c+');border-radius:10px 10px 4px 4px;padding:10px 6px;text-align:center;font-weight:600;font-size:13.5px;line-height:1.3">'+t+'<div style="font-weight:400;font-size:12px;color:var(--muted);margin-top:4px">'+s+'</div></div>';
  L.h(L.kick('learn','The three pillars')+'<h1 class="q">The book’s picture of the job is a building</h1>'+
   '<div style="max-width:330px;margin:6px auto 14px"><div style="background:var(--soft);border-radius:10px;padding:8px;text-align:center;font-weight:600;font-size:14px;margin-bottom:6px">'+L.ic('star')+' Your impact</div>'+
   '<div style="display:flex;gap:6px;align-items:stretch"><div style="width:16px;background:var(--soft2);border-radius:12px 2px 2px 12px" title="buttress"></div>'+
   col('Big-picture thinking','step back, look ahead','h1')+col('Execution','messy, cross-team projects','h2')+col('Leveling up','raise others’ skills','h3')+
   '<div style="width:16px;background:var(--soft2);border-radius:2px 12px 12px 2px" title="buttress"></div></div>'+
   '<div style="background:var(--ink);color:var(--card);border-radius:8px;padding:8px;text-align:center;font-size:13px;font-weight:600;margin-top:6px">Foundation: technical knowledge and experience</div>'+
   '<p class="small" style="text-align:center;margin:6px 0 0">Grey side pieces = “humaning” skills, the flying buttresses</p></div>'+
   L.list([['Big-picture thinking','Seeing past the details to the context, and past today to what the company will need in a few years.'],
     ['Execution','Leading projects that are messier, more ambiguous and involve more people than before.'],
     ['Leveling up','Raising the skills of engineers around you, on purpose (teaching) and by accident (being watched).']],1)+
   L.prose('The pillars rest on <b>technical skill</b>: your reviews must make designs better, so you need to be right. But that isn’t enough. '+L.g('humaning','“Humaning” skills')+' work like the flying buttresses of a gothic cathedral: they don’t replace the walls, but they let you build much taller.'));
  L.done();}},
{part:0,src:'Introduction · The Pillars of Staff Engineering',run(L){
  L.h(L.kick('ex','Quinn’s first month')+'<h1 class="q">Watch the three pillars show up in Quinn’s ordinary work</h1>');
  L.beats(L.card,[
   ['Big-picture thinking','Box Office is 11 years old and 14 teams change it. Quinn starts asking what it will need to survive three years of growing on-sale surges, not just what breaks this week.'],
   ['Execution','The Till migration has been stuck for a year. Finishing it isn’t a coding puzzle: it means persuading busy teams and finding support across the org.'],
   ['Leveling up','Quinn notices newer engineers copying how Quinn writes tests and review comments. That’s influence Quinn didn’t choose, alongside the mentoring Quinn does on purpose.'],
   ['The foundation','None of this works if Quinn is wrong. Their six years inside Box Office are why their review comments actually improve designs.'],
   ['The buttresses','Persuading teams, framing the Till problem so people care, and staying calm when they don’t feel ready: these are the humaning skills that let the rest stand.']],
   'The pillars aren’t separate jobs. They’re three kinds of impact that all rest on technical skill and all need people skills to reach full height.');}},
{part:0,src:'Introduction · The Pillars of Staff Engineering',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Mika, a Payments engineer, starts copying the way Quinn writes careful test plans, without Quinn ever asking. Which pillar is this?</h1>');
  L.mc(L.card,['Big-picture thinking','Execution','Leveling up'],2,
   'Leveling up includes the accidental influence of being a role model, not only teaching on purpose.',
   'It’s leveling up. Quinn is raising someone else’s standards just by being watched. The book counts that accidental influence as part of the pillar.');}},
{part:0,src:'Introduction · The Pillars of Staff Engineering',pts:5,run(L){
  L.h(L.kick('pr','Sort the work')+'<h1 class="q">Which pillar does each piece of Quinn’s work mainly belong to?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Big picture','Execution','Leveling up'],[
   ['Asking what Box Office will need in three years',0,'Thinking beyond the current time is big-picture work.'],
   ['Getting four busy teams to agree on how Till finishes',1,'Messy, many-team projects that need influence are execution.'],
   ['Pairing with Mika so they can lead the next Payments design',2,'Growing someone else’s skills is leveling up.'],
   ['Designing a new Box Office feature so it’s easy to switch off later',0,'The book lists building software that’s easy to decommission as big-picture thinking.'],
   ['Running a lunch session on how seat-map locking works',2,'Teaching raises the skills of engineers in your orbit.']],
   'Big picture looks wider and further ahead, execution gets the messy work done, and leveling up raises everyone else.');}},
{part:0,src:'Introduction · The Pillars of Staff Engineering',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Foundation or buttress?',['Technical foundation','“Humaning” skill'],[
   ['Knowing exactly why Box Office locks seat maps the way it does.',0,'Deep domain knowledge is part of the technical foundation.'],
   ['Framing the Till problem so other teams actually care about it.',1,'The book lists framing a problem so others care as a humaning skill.'],
   ['Leaving review comments that really make a design better.',0,'Good reviews depend on being technically right, which is the foundation.'],
   ['Taking charge in an incident while feeling nervous inside.',1,'Acting like a leader whether you feel like one or not is a humaning skill.'],
   ['Delegating a piece of work so a teammate can grow.',1,'Mentorship, sponsorship and delegation are humaning skills.']]);}},

/* ---------- PART 2: LADDERS AND TITLES ---------- */
{part:1,src:'Chapter 1 · What Even Is a Staff Engineer?',run(L){
  const rung=(t,c)=>'<div style="background:var(--'+c+'-bg);color:var(--'+c+');border-radius:8px;padding:6px 8px;margin:4px 0;font-size:13.5px;font-weight:600;text-align:center">'+t+'</div>';
  L.h(L.kick('learn','Job ladders')+'<h1 class="q">Two ladders side by side</h1>'+
   L.prose('Many companies now have a '+L.g('ladder','job ladder')+' with two tracks above senior. Each rung on one side roughly matches a rung on the other.')+
   L.lanes([['person','Technical track',rung('Principal','h2')+rung('Senior staff','h2')+rung('Staff','h2'),2],
            ['people','Manager track',rung('Director','h3')+rung('Senior manager','h3')+rung('Manager','h3'),3]])+
   '<div style="background:var(--soft);border-radius:10px;padding:8px;text-align:center;font-weight:600;font-size:14px;margin:6px 0 12px">Senior: the anchor level</div>'+
   L.list([['Senior is the anchor','Levels below senior are about growing your autonomy. Levels above it add impact and responsibility. Staying at senior for good is fine.'],
     ['Switching tracks is sideways','Going from staff engineer to manager at the same level isn’t a promotion. A principal engineer sits about level with a director.'],
     ['Ladders differ','Companies use different numbers of rungs and names, sometimes even the same names in a different order. The book uses “staff+” for every level above senior.']],2));
  L.done();}},
{part:1,src:'Chapter 1 · A Note About Titles',run(L){
  L.h(L.kick('ex','Do titles matter?')+'<h1 class="q">Some companies say “we’re flat, titles don’t matter.” The book disagrees. Tap each card.</h1>');
  L.flips(L.card,[
   ['They show progress','A title helps people see that they’re growing. This one matters to you, not to others.'],
   ['They give authority','A title gives authority to people who might not get it automatically. Bias is real: women engineers, especially women of color, are often assumed to be more junior.'],
   ['They signal competence','A title tells people outside your team, and outside your company, what level to expect. That saves you proving yourself in every meeting.'],
   ['They shape your next job','The book’s author found recruiters almost always offered roles at their current level or lower. Your title now anchors your next one.']],
   'The first three reasons come from a Medium engineering blog post the book cites. Titles save people hours of re-proving themselves, so they matter even in a “flat” company.');}},
{part:1,src:'Chapter 1 · A Note About Titles',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Hollis just joined Usherly as a staff engineer. In cross-team meetings, people keep assuming Hollis is junior. Usherly leaders say titles don’t matter here. What would the book say?</h1>');
  L.mc(L.card,['Ideas should win on merit, so the title is irrelevant','The title anchors expectations so Hollis stops re-proving','The title mostly matters to Hollis’s own sense of pride'],1,
   'Exactly. A title gives authority to people who might not get it automatically, and saves them time proving themselves again and again.',
   'Merit matters, but people judge each other by level and by bias anyway. The book says a title gives Hollis authority and signals competence, which saves real time every week.');}},
{part:1,src:'Chapter 1 · What Even Is a Staff Engineer?',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'True or false at Usherly?',['True','False'],[
   ['If Quinn moves from staff engineer to engineering manager at the same level, that’s a promotion.',1,'On a dual-track ladder that’s a sideways move, not a step up.'],
   ['A senior engineer can stay senior for the rest of their career and still be valued.',0,'The book calls senior the “tenure” level for many: going further is a choice.'],
   ['Every tech company uses the same level names in the same order.',1,'Ladders vary a lot. The book tells of an acquisition where “staff” and “principal” were swapped, and nobody was happy.'],
   ['Noa, a principal engineer, sits at roughly the same level as a director.',0,'In the book’s example ladder, principal engineer lines up with director.']]);}},

/* ---------- PART 3: THE BIG PICTURE ---------- */
{part:2,src:'Chapter 1 · Why Do We Need Engineers Who Can See the Big Picture?',run(L){
  L.h(L.kick('learn','The local maximum')+'<h1 class="q">The best choice for one team can be a bad choice for the company</h1>'+
   L.prose('Engineers know the answer to most technology choices is “it depends.” It depends on <b>context</b>: what you’re trying to do, how much time and money you have, how much risk you can take, what the business needs.')+
   L.prose('Teams naturally optimize for their own goals. But a decision that seems to belong to one team often lands on many others. The '+L.g('local-max','local maximum')+' is the choice that’s best for one group, and it may be nothing like the best choice overall.')+
   L.flow([['people','One team','Picks what’s easiest for them','sees its own goals',1],['alert','Other teams','Inherit hidden costs','legal, security, platform',4],['eye','Outsider view','Weighs every team’s goals','what staff engineers add',2]])+
   L.prose('Big-picture thinking also looks ahead in time: a year from now, what will we regret? In three years, what will we wish we’d started today?'));
  L.done();}},
{part:2,src:'Chapter 1 · Why Do We Need Engineers Who Can See the Big Picture?',pts:1,
 solve:async L=>{const c=L.$('#lz').children;c[0].click();c[1].click();},
 run(L){
  const R=[['Setup time','Works on day one','Two sprints of setup',0],
           ['Legal and Security','Ongoing extra work','Nothing extra',1],
           ['IT and Platform','Special case forever','Standard setup',1],
           ['Overall cost','Much bigger over time','Pays back within a quarter',1]];
  const seen=new Set();
  L.h(L.kick('pr','See it happen')+'<h1 class="q">The Ticketing team must pick a feature-flag tool. Both have the features they need. Look through both lenses.</h1><div id="lz" style="display:flex;flex-wrap:wrap;gap:8px"></div>'+
   '<div style="background:var(--soft);border-radius:16px;padding:12px;margin:10px 0 6px;min-height:150px" id="lv"><div class="small">Choose a lens above.</div></div><div id="lq"></div>');
  const draw=co=>{const rows=R.filter(r=>co||r[3]===0);
    L.$('#lv').innerHTML='<div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);gap:6px;font-size:13.5px"><b></b><b>Tool A</b><b>Tool B</b>'+
     rows.map(r=>{const aBad=r[3]===1,bBad=r[3]===0;return '<span class="small" style="margin:0">'+r[0]+'</span><span style="color:var(--'+(aBad?'no':'ok')+')">'+r[1]+'</span><span style="color:var(--'+(bBad?'no':'ok')+')">'+r[2]+'</span>';}).join('')+'</div>'+
     '<p class="small" style="margin:10px 0 0">'+(co?'From the whole company’s view, A quietly creates work for other teams for years.':'From the team’s view, A is the obvious winner. Why wait two sprints?')+'</p>';};
  [['people','Team’s view'],['eye','Whole company’s view']].forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.innerHTML=L.ic(n[0])+n[1];
    b.onclick=()=>{[...L.$('#lz').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(j);draw(j===1);
      if(seen.size===2&&!L.$('#lq').innerHTML){const q=L.$('#lq');q.innerHTML='<h2 class="sub">Which tool is the local maximum?</h2>';
        L.mc(q,['Tool A, the one that works on day one','Tool B, the one that takes two sprints'],0,
         'Right. A is best for Ticketing alone. B is only slightly worse for them and much better overall, but you only see that through a wider lens.',
         'B is the better choice for the company. The local maximum is A: best for one team, costly for everyone else.');}};L.$('#lz').appendChild(b);});}},
{part:2,src:'Chapter 1 · Why Do We Need Engineers Who Can See the Big Picture?',run(L){
  L.h(L.kick('learn','Why not just managers?')+'<h1 class="q">Why can’t a manager or the CTO hold the big picture?</h1>'+
   L.prose('On a small team, they can. A manager can be the most experienced technologist, and a small company’s CTO can stay in every detail. Those companies may not need staff engineers. As a company grows, three problems appear:')+
   L.list([['scale','Authority gets in the way','People feel uneasy arguing with their manager’s technical call, even when they know a better answer.'],
     ['clock','Managing is a full-time job','Time spent on people is time not spent keeping up with technology, and the reverse.'],
     ['alert','Something gets neglected','When the team’s needs and the technical strategy pull apart, a manager must choose. Either the people or the technical direction suffers.']],3)+
   L.note('Engineers still don’t set direction alone. Managers decide where headcount goes, so they must be part of major technical decisions.','people'));
  L.done();}},
{part:2,src:'Chapter 1 · Why Do We Need Engineers Who Can See the Big Picture?',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Ezra, director of Product Engineering, offers to make every technical call for the Ticketing group themselves so Quinn can focus on code. What’s the main risk the book points to?</h1>');
  L.mc(L.card,['Ezra can’t give both their people and the tech enough time','Ezra’s technical calls will always be worse than Quinn’s','Directors are never allowed to make technical decisions'],0,
   'Yes. Managing people is a full-time job. When team needs and technical direction pull apart, one of them gets neglected.',
   'It isn’t about Ezra being less clever, and managers should take part in big decisions. The risk is that one person can’t give both the people and the technical direction the time they need.');}},
{part:2,src:'Chapter 1 · Why Do We Need Engineers Who Can See the Big Picture?',pts:1,run(L){
  L.h(L.kick('pr','Your call')+'<h1 class="q">The Payments team wants a new kind of database. It’s the fastest option for them, but Platform would have to support it as a one-off forever. Mika asks Quinn for advice. What should Quinn do?</h1>');
  L.mc(L.card,['Back Payments, since the choice belongs to them','Tell Payments to use whatever Platform prefers','Weigh what it costs Platform and others before choosing'],2,
   'That’s the outsider view: consider several teams’ goals and pick what’s best for the whole organization. That might still be the new database, but only after counting every cost.',
   'Deciding only for Payments risks a local maximum, and deferring blindly to Platform skips the thinking too. The book asks for an outsider view that weighs every team’s goals.');}},

/* ---------- PART 4: PROJECTS AND INFLUENCE ---------- */
{part:3,src:'Chapter 1 · Why Do We Need Engineers Who Lead Projects That Cross Multiple Teams?',run(L){
  L.h(L.kick('learn','Cross-team projects')+'<h1 class="q">Real projects don’t fit together like puzzle pieces</h1>'+
   L.lanes([['star','The dream','Brand-new project, no legacy, teams built around the design, every team fully on it, and the hard parts are fun research.',2],
            ['alert','The reality','Teams already have other priorities. Surprise dependencies. Gaps nobody owns, overlaps two teams claim. The hard parts are old code and busy teams.',4]])+
   L.prose('Information gets lost between teams, and each team makes a sensible local-maximum choice, so the project stalls. One fix is a person who owns <b>the whole thing</b>, not any single part. That person:')+
   L.list([['Shapes it','Scopes the work and often writes the high-level design.'],
     ['Guards quality','Spots risks early, asks hard questions, coaches the leads of each part.'],
     ['Unblocks and tells the story','Finds why it’s stuck, and explains to the company what it will make possible.']],2));
  L.done();}},
{part:3,src:'Chapter 1 · Why Do We Need Engineers Who Lead Projects That Cross Multiple Teams?',run(L){
  L.h(L.kick('ex','The Till migration')+'<h1 class="q">Why a migration can stall for a whole year</h1>');
  L.beats(L.card,[
   ['The plan','Move payment code out of Till, an old library inside Box Office, into the new Payments service. Fourteen teams use Till.'],
   ['Good start','Nine teams move. Then progress stops, and stays stopped for a year.'],
   ['The reality','The last five teams have other priorities. One piece of Till code is claimed by two teams; another has no owner. The engineers who wrote it left years ago.'],
   ['Local maxima','Each team makes a sensible choice for itself: “not this quarter.” Every choice is reasonable, and the whole project stays stuck.'],
   ['What’s missing','Nobody feels responsible for the <i>whole</i> migration: finding why each team is stuck, closing the gaps, and explaining why finishing matters.']],
   'Cross-team projects stall in the gaps between teams. That’s exactly the space a staff engineer who owns the whole project is there to fill.');}},
{part:3,src:'Chapter 1 · Why Do We Need Engineers Who Lead Projects That Cross Multiple Teams?',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Callum, a technical program manager, joins the Till migration alongside Quinn. Who should decide which teams must change their code, after digging through Till’s legacy code?</h1>');
  L.mc(L.card,['Callum, since they own the project schedule','Quinn, since it’s a design and quality call','Whichever team finishes its own move first'],1,
   'Right. A TPM owns delivery. Design calls that need a deep dive through legacy code belong with the staff engineer.',
   'The book says a TPM owns delivery, not design or engineering quality. A deep dive into legacy code to decide who must integrate is the staff engineer’s job.');}},
{part:3,src:'Chapter 1 · Why Do We Need Engineers Who Lead Projects That Cross Multiple Teams?',pts:5,run(L){
  L.h(L.kick('pr','Dream team')+'<h1 class="q">Quinn and Callum split the Till work. Who mainly owns each part?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Callum (TPM)','Quinn (staff)'],[
   ['Making sure the migration is done on time',0,'Delivery on time is the TPM’s core responsibility.'],
   ['Writing the high-level design for the new payment flow',1,'Staff engineers often author the high-level design.'],
   ['Setting the testing standard every team must meet',1,'Setting project standards for testing is a staff engineer job, not a TPM one.'],
   ['Avoiding traps for whoever maintains Payments next',1,'Being wary of tech debt and future traps is part of guarding engineering quality.'],
   ['Tracking each team’s milestones and dates',0,'Keeping delivery on track belongs to the TPM.']],
   'The TPM makes sure it’s done on time; the staff engineer makes sure it’s done well. Working together, they can be a dream team.');}},
{part:3,src:'Chapter 1 · Why Do We Need Engineers Who Are a Good Influence?',run(L){
  L.h(L.kick('learn','Good influence')+'<h1 class="q">Software matters, and seniors set the norms</h1>'+
   L.prose('Software bugs and outages can hurt people’s money and health, and have even cost lives. Even when stakes are lower, companies want working software, built efficiently, without chaos. Under deadline pressure, teams skip tests, cut corners and rubber-stamp reviews.')+
   L.prose('Managers can set rules, but the real <b>norms</b> come from how the most respected engineers behave. If the senior people don’t write tests, nobody else will either. The same goes for respect, celebrating others and asking clarifying questions.')+
   L.prose('This work can’t sit on top of a full senior coding load. Every hour of strategy, design review or setting standards is an hour not coding. So it has to be in the job description.')+
   L.quote('It isn’t a distraction from the job: it <i>is</i> the job.','Tanya Reilly, chapter 1'));
  L.done();}},
{part:3,src:'Chapter 1 · Why Do We Need Engineers Who Are a Good Influence?',pts:1,run(L){
  L.h(L.kick('pr','Your call')+'<h1 class="q">Usherly’s handbook says every change needs tests. Racing a deadline, Quinn merges a Box Office change with none. What’s the biggest effect?</h1>');
  L.mc(L.card,['Little, because the handbook rule still applies','Only the risk of one bug in that one change','Others learn that tests are optional when busy'],2,
   'Yes. Norms follow what respected seniors do, not what the standards say. Quinn just taught everyone watching that tests can be skipped.',
   'The written rule matters less than Quinn’s example. The book says if the most senior engineers skip tests, you’ll never convince everyone else to write them.');}},
{part:3,src:'Chapter 1 · What Would You Say You Do Here?',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'What does Usherly need here?',['Big-picture view','Cross-team project lead','Good influence'],[
   ['Box Office is about to adopt a library that will make Security treat it as a special case forever.',0,'A choice best for one team but costly for others is a local maximum. It needs an outsider view.'],
