<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starting a Big Project</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0010', title:'Starting a big project', minutes:19, icon:'compass',
  goals:['Explain what really makes a big project hard, and what that asks of its lead','Use five moves to get through the overwhelming first weeks','Build the context a project needs: goals, customers, success metrics, constraints, risks, history and team'],
  parts:['The lead’s job','Feeling overwhelmed','Why and for whom','Limits, past and people'],
  read:'Read the first part of chapter 5 for the full list of context questions and the stories behind them.',
  glossary:{
    'anchor-doc':'Anchor document: a private document the lead keeps for the whole project, holding notes, rumors, leads, reminders and to-dos in one place.',
    'imposter':'Imposter syndrome: the fear that you’re in your role by mistake and will fail in public, even when you’re capable.',
    'success-metric':'Success metric: an agreed, measurable sign that the project solved the real problem, ideally one you can compare before and after.',
    'sublead':'Sublead: a person who leads one part of a big project, such as one team’s share of the work, and reports progress to the overall lead.'
  },
  cheatsheet:[
    'Great project leads need <b>perseverance, courage and a willingness to talk to people</b>. Big projects are hard because of ambiguity, not because they need genius.',
    'As lead, you own the <b>whole</b> problem, including the gaps between teams that are nobody’s job.',
    'Overwhelm is normal at the start. Check your resources: energy, time, skills. The difficulty is why they need you.',
    'Five moves: create an <b>anchor document</b>, talk to your <b>sponsor</b>, choose who hears your <b>uncertainty</b>, give yourself a <b>win</b>, use your <b>strengths</b>.',
    'Use the early weeks when not knowing is cheap: “I’m new to this, so tell me if I have this wrong…”',
    'Build context: <b>goals</b> (the why), <b>customer needs</b>, <b>success metrics</b>, <b>sponsors and stakeholders</b>, <b>fixed constraints</b>, <b>risks</b>, <b>history</b>, <b>team</b>.',
    'Code written is not success. Be strictest about success metrics on projects <b>you</b> started.',
    'Ship in small steps to lower the risk of wasted effort. Respect what came before. Skip the power struggles.'
  ],
  steps:[
/* ---------- PART 1: THE LEAD'S JOB ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Quinn now leads Usherly Resale: Box Office, Payments, the mobile app, Trust &amp; Safety and Legal all have a part. What’s most likely to make it hard?</h1>');
  L.mc(L.card,['Needing a technical idea nobody has had','Unclear direction and many people to align'],1,
   'Right. Reselling tickets isn’t new technology. The hard part is five groups, an open Legal question and an 11-year-old system. That’s what this lesson is about.',
   'Resale doesn’t need a breakthrough. Five groups, a pending Legal decision and an old core system are the hard part: ambiguity, not invention.');}},
{part:0,src:'Chapter 5 · Leading Big Projects',run(L){
  L.h(L.kick('learn','What a great lead needs')+'<h1 class="q">Big projects rarely need genius</h1>'+
   L.prose('The book says a great project lead mostly needs three things: <b>perseverance</b>, <b>courage</b> and a willingness to <b>talk to other people</b>.')+
   L.prose('Most big projects aren’t hard because they push the limits of technology. They’re hard because of <b>ambiguity</b>, which comes in three forms:')+
   L.flow([['compass','Unclear direction','Nobody quite agrees on the goal','',1],['people','Messy humans','Many teams, many opinions','',2],['box','Legacy systems','Old code that behaves in surprising ways','',3]],false)+
   L.prose('When a project spans many teams and has big, risky decisions, it needs a lead who sticks with it and trusts the problems can be solved. That’s often a '+L.g('staff-engineer','staff engineer')+'.'));
  L.done();}},
{part:0,src:'Chapter 5 · The Life of a Project',run(L){
  L.h(L.kick('learn','The kind of project we mean')+'<h1 class="q">Months long, many teams, and nobody reports to you</h1>'+
   L.prose('The chapter follows one kind of project: it lasts at least several months and needs work from several teams. You’re the named technical lead. Nobody on it reports to you, yet you’re expected to get results.')+
   L.note('There may be other leaders too: a product manager, a project or program manager, engineering managers. But <b>you</b> are responsible for the result, so you think about the <b>whole</b> problem, including the cracks between teams and the work that isn’t anyone’s job.','alert')+
   L.tiers([['play','Start','Get the lay of the land, handle the overwhelm, build context','This lesson',true,'Now'],
            ['layers','Structure','Roles, scope, estimates, logistics, kickoff','Next lesson'],
            ['compass','Drive','Explore, clarify, design, code, communicate','Later lessons']]));
  L.done();}},
{part:0,src:'Chapter 5 · The Life of a Project',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Payments builds the refund for a resold ticket. The mobile app shows the seller’s payout. Nobody owns telling the seller when the money arrives. Whose problem is it?</h1>');
  L.mc(L.card,['Payments’, since they move the money','The mobile team’s, since they own the screen','Quinn’s, as lead of the whole project'],2,
   'The lead owns the whole problem, especially the parts in the gaps between teams. Quinn may not build it, but Quinn makes sure someone does.',
   'Each team could fairly say “not ours.” That’s exactly the kind of gap the book says belongs to the lead, who owns the whole result.');}},
{part:0,src:'Chapter 5 · Leading Big Projects',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which kind of ambiguity?',['Unclear direction','Messy humans','Legacy systems'],[
   ['Ezra says Resale is about “fan trust.” The VP says it’s about “a new revenue line.”',0,'Two leaders want different things from the same project. The direction isn’t settled yet.'],
   ['Box Office stores seat holds in a way nobody has documented, and changes there break checkout.',2,'An 11-year-old system that behaves unpredictably is legacy ambiguity.'],
   ['The Trust &amp; Safety lead and the Payments lead each want final say on fraud rules.',1,'This is about people and who decides, not about code.'],
   ['Wren’s team is overloaded and answers every request with “file a ticket.”',1,'A busy team guarding its queue is a people problem. It needs talking, not genius.']]);}},

/* ---------- PART 2: FEELING OVERWHELMED ---------- */
{part:1,src:'Chapter 5 · If You’re Feeling Overwhelmed…',run(L){
  L.h(L.kick('learn','Start with the overwhelm')+'<h1 class="q">Feeling swamped at the start is normal</h1>'+
   L.prose('A new project might come with a detailed spec, or just a whiteboard scrawl and long email threads you weren’t copied on. Either way, lots of people have opinions before you even know what the project is for.')+
   L.quote('That feeling of discomfort is called learning.','Polina Giralt, quoted in chapter 5')+
   L.list([['flame','Check your resources','Feeling out of your depth may mean you’re low on energy, time or skills. Can you get more, or get help?'],
           ['people','Everyone is figuring it out','Whoever led this would find it hard. Most people don’t know better than you what to do.'],
           ['shield','Hard is the point','If it weren’t messy, they wouldn’t need you. A mistake, even ten, won’t destroy you.']],2)+
   '<p class="small" style="margin-top:10px">Fearing you’re there by mistake is called '+L.g('imposter','imposter syndrome')+'. Left alone, it can hurt your performance, so it’s worth managing.</p>');
  L.done();}},
{part:1,src:'Chapter 5 · If You’re Feeling Overwhelmed…',run(L){
  L.h(L.kick('learn','Five moves')+'<h1 class="q">Five ways to make a new project less overwhelming</h1>'+
   L.list([['pencil','Create an anchor for yourself','One private '+L.g('anchor-doc','document')+' that acts as an outside part of your brain: rumors, leads, reminders, to-dos.'],
     ['person','Talk to your sponsor','Bring a written guess at what they want and what success looks like. Ask if they agree. Clear up your role and who gets updates.'],
     ['chat','Decide who gets your uncertainty','Not your junior engineers. Find a manager, mentor or peer who says “this is hard for me too.”'],
     ['check','Give yourself a win','Any step that gives you some control: draw a picture, talk to someone, describe the problem.'],
     ['star','Use your strengths','Start where you’re strongest: code, people or documents.']],1));
  L.done();}},
{part:1,src:'Chapter 5 · If You’re Feeling Overwhelmed…',run(L){
  L.h(L.kick('ex','Quinn’s first week on Resale')+'<h1 class="q">Watch Quinn use the five moves</h1>');
  L.beats(L.card,[
   ['Monday','Quinn opens a private doc called “Resale brain.” In go the rumors about price caps, a list of teams, open questions and to-dos.'],
   ['Tuesday','Quinn meets Ezra with a written guess: “Success means fans resell through Usherly instead of scalper sites.” Ezra adds: “and fraud complaints don’t go up.” Quinn writes that down and reads it back.'],
   ['Wednesday','Quinn feels out of their depth on payments law. Instead of telling the team, Quinn books a coffee with Noa, who admits a Platform project once felt the same.'],
   ['Thursday','Quinn sketches the flow from listing to payout on a whiteboard and asks a Payments engineer, “I’m new to this, so tell me if I have this wrong…”'],
   ['Friday','Quinn knows Box Office best, so they read the order code that resale would touch. It feels like familiar ground again.']],
   'None of these moves needs the answer to the project. They just turn a fog into a place where Quinn can start working.');}},
{part:1,src:'Chapter 5 · Talk to your project sponsor',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Why did Quinn bring a <i>written</i> guess of what success looks like to Ezra?</h1>');
  L.mc(L.card,['So Ezra can confirm or correct it on the spot','So Quinn looks prepared and senior','So Quinn can skip meeting Ezra later on'],0,
   'It’s easy to misunderstand the mission at the start. A concrete guess gives the sponsor something to agree with or fix, as Ezra did by adding fraud complaints.',
   'The point is to check the mission. A written guess lets the sponsor say “yes” or “not quite,” which is how Ezra added the fraud goal.');}},
{part:1,src:'Chapter 5 · Decide who gets your uncertainty',pts:1,
 solve:async L=>{L.$('#w0').click();L.$('#w1').click();},
 run(L){
  const R=[['A junior engineer on the team','The junior engineer starts to worry the project will fail and spends the evening reading payments law instead of building the listing page.','no'],
           ['Noa, a peer and mentor','Noa listens, says this stuff is hard for them too, and suggests asking Legal for a one-page summary. Quinn feels steadier.','ok']];
  const seen=new Set();
  L.h(L.kick('pr','Toggle and compare')+'<h1 class="q">Quinn is worried the Legal price-cap decision will sink Resale. Who should hear it first? Try both.</h1><div id="wb" style="display:flex;flex-wrap:wrap;gap:8px"></div><div id="wr" style="margin-top:10px"></div><div id="wq"></div>');
  R.forEach((r,j)=>{const b=document.createElement('button');b.className='chip';b.id='w'+j;b.innerHTML=L.ic(j?'person':'people')+r[0];
    b.onclick=()=>{[...L.$('#wb').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(j);L.$('#wr').innerHTML='';L.fb(L.$('#wr'),r[1],r[2]);
      if(seen.size===2&&!L.$('#wq').innerHTML){const q=L.$('#wq');q.innerHTML='<h2 class="sub">So what does the junior engineer need from Quinn?</h2>';
        L.mc(q,['Every worry Quinn has, for full honesty','Safety and steadiness, with some honesty'],1,
         'Be open about some difficulties, and show that senior people are still learning. But don’t let your fears spill onto people looking to you for stability.',
         'The book says juniors look to you for safety. Share some of the difficulty, but take your fears to a peer or mentor instead.');}};
    L.$('#wb').appendChild(b);});}},
{part:1,src:'Chapter 5 · If You’re Feeling Overwhelmed…',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which move is this?',['Anchor document','Talk to sponsor','Who gets uncertainty','Give yourself a win','Use your strengths'],[
   ['Quinn can’t remember where they wrote down the Legal contact’s name. Again.',0,'One place for everything removes the “where did I write that?” problem.'],
   ['Ezra will be travelling for two months starting next week.',1,'The less often you’ll see the sponsor, the more vital it is to get everything up front now.'],
   ['Quinn is tempted to vent about the deadline in the team channel.',2,'Take worries to a sounding board, not to the people who look to you for calm.'],
   ['Quinn has stared at the blank project page for an hour.',3,'Take any step that gives some control: draw it, talk about it, describe it.'],
   ['Quinn, a strong coder, wants to understand how tickets get reissued.',4,'Start with your core muscle. For Quinn, that’s reading the code.']]);}},

/* ---------- PART 3: WHY AND FOR WHOM ---------- */
{part:2,src:'Chapter 5 · Building Context',run(L){
  L.h(L.kick('learn','Building context')+'<h1 class="q">Draw the three maps, this time for one project</h1>'+
   L.prose('In chapter 2 you mapped the whole company. At the start of a project you do the same for the project: a '+L.g('locator-map','locator map')+' (goals, limits, history, link to the business), a '+L.g('topographic-map','topographical map')+' (the terrain, local politics, how decisions get made) and a '+L.g('treasure-map','treasure map')+' (where you’re going and the milestones on the way).')+
   L.prose('The book lists eight points of context to make clear, for yourself <i>and</i> for everyone else. Tap each one.'));
  L.flips(L.card,[['Goals','Why this project, out of everything we could do?'],['Customer needs','Who will use what we build, and what do they need?'],['Success metrics','How will we measure that we solved the problem?'],['Sponsors and stakeholders','Who wants it, who pays, who uses it?'],['Fixed constraints','Which deadlines, budgets and dependencies can’t move?'],['Risks','What could stop us, and what don’t we know?'],['History','Where did the idea come from, and what was tried?'],['Team','Who are the leads, contacts and subleads?']],
   'The next screens go through them in the book’s order: goals, customers and success first, then constraints, risks, history and team.');}},
{part:2,src:'Chapter 5 · Goals',run(L){
  L.h(L.kick('learn','Goals and customer needs')+'<h1 class="q">Know the “why,” and know who it’s for</h1>'+
   L.lanes([['target','Goals','Why <b>this</b> project, out of all possible work? The why guides every decision. Without it you may finish the work and still miss the real problem. It may even show the project won’t reach the goal at all. Better to learn that early.',1],
            ['people','Customer needs','Even internal projects have customers. If there’s no product manager, finding their needs is on you. Watch them use the old tool, sketch an interface and see how they react, avoid jargon, and listen to what they actually say.',2]])+
   L.note('The book tells of a team building a feature for another team on the <b>same floor</b>. Asked why that team needed it, they admitted they didn’t really know.','book')+
   '<p class="small" style="margin-top:12px">Even with a product manager, engineers should care about customers and key numbers too.</p>');
  L.done();}},
{part:2,src:'Chapter 5 · Success metrics',run(L){
  L.h(L.kick('learn','Success metrics')+'<h1 class="q">Code that exists isn’t proof of anything</h1>'+
   L.prose('Describe how you’ll measure success, and make sure your sponsor and the other leads agree. A '+L.g('success-metric','success metric')+' shows the problem got solved: more revenue, fewer outages, a process that takes less time. Sometimes success means <i>deleting</i> code.')+
   L.prose('One talk the book cites judged a big migration by two numbers: time spent keeping the new system healthy, and the number of grumbling chat messages about things that didn’t work.')+
   L.note('<b>Did you start the project yourself?</b> Then be even stricter. People may follow you on trust in you alone, but you could be wrong, and credibility can go down as well as up.','alert'));
  L.done();}},
{part:2,src:'Chapter 5 · Success metrics',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Halfway through, the Resale team reports “80% of the code is written.” What does that tell Ezra about success?</h1>');
  L.mc(L.card,['Very little: code doesn’t show a solved problem','The project is about 80% of the way to success','The team will launch on time next spring'],0,
   'Code existing says nothing about whether fans resell through Usherly or fraud stays low. That’s what the success metrics are for.',
   'Code written is the trap the book warns about. It measures effort, not whether the real problem got solved.');}},
{part:2,src:'Chapter 5 · Success metrics',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Tap each piece until this is a success metric Ezra and Quinn could check before and after launch.</h1>');
  L.sentence(L.card,[['Share of','Lines of code for','Number of meetings on'],['resold Usherly tickets','resale features','the price cap'],['sold through Usherly, not scalper sites,','merged into Box Office','agreed by Legal'],['each month','eventually']],[0,0,0,0],
   [['Lines of code measure effort, not a solved problem.','Meetings measure activity, not results.'],['Counting features is counting output, not what fans do.','The price cap is a constraint, not something to grow.'],['Merged code is the “code written” trap again.','A Legal decision is a milestone, not a measure of success.'],['“Eventually” can’t be compared before and after. Pick a regular period.']],
   'It measures what fans actually do, and you can compare it before and after launch. Ezra’s second goal, fraud complaints, would sit beside it.');}},
{part:2,src:'Chapter 5 · Sponsors, stakeholders, and customers',pts:1,run(L){
  L.h(L.kick('pr','Your call')+'<h1 class="q">On the side, Quinn proposes a Box Office cleanup nobody asked for. Teams sign up because they trust Quinn. What should Quinn do first?</h1>');
  L.mc(L.card,['Use the goodwill to start coding quickly','Set measurable goals now and watch the trend','Wait for a sponsor to define success'],1,
   'Projects you start yourself need the most skepticism. Real goals show early whether it’s working, so it doesn’t run on Quinn’s credibility alone. And if Quinn started it, Quinn may have to keep justifying it.',
   'Trust in Quinn can carry a project only so far, and it can drop. The book says to treat your own ideas with the most skepticism and set measurable goals quickly.');}},

/* ---------- PART 4: LIMITS, PAST AND PEOPLE ---------- */
{part:3,src:'Chapter 5 · Fixed constraints',run(L){
  L.h(L.kick('learn','Constraints, risks, history, team')+'<h1 class="q">The other four points of context</h1>'+
   L.list([['lock','Fixed constraints','Deadlines that can’t move, budgets, busy teams you depend on, difficult people. Describe reality so you don’t spend the project being mad at it. Be kind when you write about people: the doc will get forwarded.'],
     ['alert','Risks','Is it a moonshot (huge and hopeful) or a roofshot (a clear step forward)? Name the unknowns, the dependencies and the people you can’t lose. Ship in small steps so you get feedback early.'],
     ['book','History','Where did the idea come from? Was it announced already? If others tried and failed, expect leftover parts, odd users and sore feelings. Have lots of conversations first.'],
     ['tree','Team','Know the leaders, contacts and '+L.g('sublead','subleads')+', and what role each expects to play. Don’t waste time on power struggles.']],3));
  L.done();}},
{part:3,src:'Chapter 5 · Building Context',run(L){
  L.h(L.kick('ex','Quinn fills in the context')+'<h1 class="q">Quinn adds a context page to the Resale docs, one point at a time</h1>');
  L.beats(L.card,[
   ['Fixed constraints','Launch is next spring, already promised. No product manager yet. Wren’s team owns the load balancers and is fully booked this quarter.'],
   ['Risks','The Legal price-cap decision is still open. Resale will run on the same checkout that went down during the Saturday incident.'],
   ['History','Two years ago the mobile team built a half-finished ticket-transfer feature called Swap. A few organizers still rely on it, and the mobile engineers still feel bruised about how it ended.'],
   ['Team','Subleads: Hollis for Payments, Lucia for the mobile app, Bao for Trust &amp; Safety. Oskar is the Legal contact.']],
   'Written down this way, the hard parts stop being surprises. Each one is now something Quinn can plan around.');}},
{part:3,src:'Chapter 5 · Risks',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Quinn fears building a resale flow that fans never use. Which plan best lowers that risk?</h1>');
  L.mc(L.card,['Build everything, then one big launch in spring','Release small pieces often and gather feedback','Write a longer spec before anyone starts'],1,
   'Frequent small releases bring user feedback early, so you can change course, or even stop early, instead of betting everything on one release.',
   'Wasted effort is one of the most common risks. The book’s answer is small, frequent changes that let users tell you early whether you’re on track.');}},
{part:3,src:'Chapter 5 · Building Context',pts:6,run(L){
  L.h(L.kick('pr','Sort the context')+'<h1 class="q">Where does each fact go on Quinn’s context page?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Constraint','Risk','History','Team'],[
   ['The VP announced “Resale by spring” at an all-hands.',2,'An announcement that already set expectations is part of the history.'],
   ['If Hollis leaves, nobody else understands payouts.',1,'A key person who could doom the project is a risk.'],
   ['Payouts must use the new Payments service, not Till.',0,'A fixed technical limit you can’t negotiate away is a constraint.'],
   ['Lucia leads the mobile part and has two engineers.',3,'Who leads which part is team context.'],
   ['Nobody knows yet how fans will price their tickets.',1,'An unknown that could change the plan is a risk.'],
   ['Swap, the old transfer feature, still has some users.',2,'Leftover parts and their users come from history.']],
   'Constraints are fixed, risks might happen, history already happened, and the team is who you’ll work with.');}},
{part:3,src:'Chapter 5 · History',pts:1,run(L){
  L.h(L.kick('pr','Your call')+'<h1 class="q">Lucia’s mobile engineers built Swap and saw it shelved. They’re cool toward Resale. What should Quinn do first?</h1>');
  L.mc(L.card,['Tell them Resale is a fresh start, so Swap doesn’t matter','Plan to delete Swap first so it can’t get in the way','Talk with them about Swap: what happened and what they learned'],2,
   'The book says to have lots of conversations, learn from people’s experience and “respect what came before.” Their enthusiasm has to be won back carefully.',
   'Brushing Swap aside, or deleting it, ignores the history and the people who built it. Start with conversations and learn what they know.');}},
{part:3,src:'Chapter 5 · Team',pts:1,run(L){
  L.h(L.kick('pr','Your call')+'<h1 class="q">Joss, the engineering manager of the new Resale team, starts sending status emails to Ezra too. Quinn feels stepped on. What helps most?</h1>');
  L.mc(L.card,['Ask Joss what role they expect to play, and agree','Send status emails more often than Joss does','Ask Ezra to tell Joss that Quinn is the lead'],0,
   'Multiple leaders often means unclear expectations. Understand who the leaders are and what role each expects. A clear split beats a contest.',
   'That turns it into a power struggle, which the book says wastes time. Start by understanding the role Joss expects, then agree who does what.');}}
  ]
});
</script>
</body>
</html>
