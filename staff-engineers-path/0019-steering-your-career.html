<!doctype html>
<html lang="en">

<title>Steering Your Career</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0019', title:'Steering your career', minutes:19, icon:'compass',
  goals:['Write a priority list and a trail map for your own career','Decide where to spend your ability points, and how to build a network and visibility','Check your job’s health over time and weigh reasons to stay against reasons to move'],
  parts:['What matters','Where to','Invest','Your role'],
  read:'Read the first half of chapter 9 for the full priority list, the networking advice and the stories of people who chose their roles deliberately.',
  glossary:{
    'trail-map':'Trail map: the book’s fourth map, a picture of your career as paths across mountains, with milestones toward where you want to go.',
    'priority-list':'Priority list: your own ranked list of what you want from work and life right now, such as money, learning or a flexible schedule.',
    'ability-points':'Ability points: the book’s video-game picture of growth. Each year you earn points and choose which skills to spend them on.',
    'imposter':'Imposter syndrome: the fear that you’re in your role by mistake and will fail in public, even when you’re capable.',
    'job-health':'Job-health signals: Cate Huston’s five things to watch in your job: learning, transferable skills, recruiting, confidence and stress.'
  },
  cheatsheet:[
    'You own your career. Nobody else can drive it, and your manager may not know your path.',
    'Write a <b>priority list</b>: money, family, flexibility, learning, visibility, cool work, challenge, wealth, independence, impact, a vocation. There’s no right answer, and it changes.',
    'Draw a <b>trail map</b> with milestones. Draw it with others: ask people who took the path you want. Don’t rule out the ambitious route.',
    'Spend <b>ability points</b> on what you <i>want</i> to be good at. Not good at it = not leveled up yet. But mind your energy.',
    'Skills aren’t enough: build a <b>network</b> and <b>visibility</b>, and choose roles and projects <b>deliberately</b> (it’s easy to get typecast).',
    'Track <b>Cate Huston’s five signals</b> for months: learning, transferable skills vs dysfunction, recruiting, confidence, stress. Look at trends, not one bad month.',
    'Stay for feedback loops, depth, relationships, context, familiarity. Move for employability, experiences, growth, money or a mismatch.'
  ],
  steps:[
/* ---------- PART 1: WHAT MATTERS ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">A year into the staff role, Ezra suggests Quinn could become an engineering manager. Who is best placed to decide if that’s right for Quinn?</h1>');
  L.mc(L.card,['Ezra, who sees the whole org','Quinn, who knows what matters to them'],1,
   'Ezra can offer advice and the role. But only Quinn knows what Quinn wants from work and life. That’s where this lesson starts.',
   'Ezra’s view helps, but it’s Quinn’s career. The book’s last chapter starts from one idea: you’re the only one who can drive it.');}},
{part:0,src:'Chapter 9 · Your Career',run(L){
  L.h(L.kick('learn','The fourth map')+'<h1 class="q">What’s the point of leveling up?</h1>'+
   L.prose('A friend of the author compared his career to a dungeon game: you clear the dungeon, go up a level, and start a new dungeon where the monsters have leveled up too. So what’s the point, for <i>you</i>?')+
   L.prose('The book adds a fourth map to the three from chapter 2: the '+L.g('trail-map','trail map')+'. Your career is a journey across mountains, with many paths: some busy, some overgrown, some twisting away before they lead where you want.')+
   L.note('Not every destination is on a marked path. If you only follow the trails in front of you, you may just follow other people’s footsteps to the next dungeon. With a map, you know where to leave the trail.','map')+
   L.prose('Climbing a ladder of seniority, power and pay is only some of the paths. So first: what’s important to you?'));
  L.done();}},
{part:0,src:'Chapter 9 · What’s Important to You?',run(L){
  L.h(L.kick('learn','Your priority list')+'<h1 class="q">Staff engineer Cian Synnott keeps a '+L.g('priority-list','priority list')+'. Tap to see some common entries.</h1>');
  L.flips(L.card,[
   ['Security and family','Paying off debt, saving for retirement, a steady paycheck and benefits for the people who depend on you.'],
   ['A flexible schedule','Room for childcare, eldercare, health needs, or just lots of free time.'],
   ['Learning and challenge','Becoming world class in a domain, or a generalist who can take on anything. Tackling things bigger than you thought you could.'],
   ['Being visible','Respect from peers, being “industry famous,” or being someone others can see succeed in a role.'],
   ['Cool work and wealth','Exciting, energizing projects. Or as much money in the bank as possible over your career.'],
   ['Independence and impact','Being your own boss one day. Making the world better. Or funding what you <i>really</i> care about, like a music career.']],
   'There’s no right answer. It’s personal, and it will probably change across your career.');}},
{part:0,src:'Chapter 9 · What’s Important to You?',run(L){
  L.h(L.kick('ex','Quinn writes a list')+'<h1 class="q">One Sunday, Quinn ranks what matters right now</h1>');
  L.beats(L.card,[
   ['1 · Learning a lot','The staff year showed Quinn how much there is beyond Box Office: strategy, other orgs, leading people. Quinn wants more of that.'],
   ['2 · Making a difference','The Saturday incident still stings. Quinn cares that fans get tickets fairly and safely.'],
   ['3 · A flexible schedule','Quinn coaches a youth football team on Thursday evenings and won’t give that up.'],
   ['Lower down','Building wealth matters, but Quinn is already comfortable. Being “industry famous” barely registers.'],
   ['The point','The list doesn’t say “take the manager job” or “don’t.” It gives Quinn something to measure every option against.']],
   'A priority list keeps you oriented. It doesn’t yet tell you where to go: that’s the trail map’s job.');}},
{part:0,src:'Chapter 9 · What’s Important to You?',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Mika sees Quinn’s list and asks: “Should mine look the same, since I want to reach staff too?”</h1>');
  L.mc(L.card,['Yes, the same goal needs the same list','No, it’s personal and changes over time','Yes, until Mika reaches the staff level'],1,
   'Mika might put money or visibility first. Two people on the same path can want very different things from it.',
   'Two people chasing the same title can want very different things. The book says the list is personal and shifts across a career.');}},
{part:0,src:'Chapter 9 · What’s Important to You?',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which priority does each choice point to?',['Security or wealth','Flexible schedule','Learning or challenge','Being visible'],[
   ['Saskia turns down a startup offer for Usherly’s steadier salary and benefits while paying off a mortgage.',0,'A steady paycheck and paying off debt point to financial security.'],
   ['Lucia asks to work four longer days so Fridays are free for eldercare.',1,'Shaping the week around care is about a flexible schedule.'],
   ['Hollis volunteers for the hardest Payments problem, though it’s far outside their comfort zone.',2,'Picking the hard thing on purpose points to learning and challenge.'],
   ['Bao wants to speak at security conferences so others see someone like them in the role.',3,'Being seen succeeding, and being representation, is about visibility.']]);}},

/* ---------- PART 2: WHERE TO ---------- */
{part:1,src:'Chapter 9 · Where Are You Going?',run(L){
  L.h(L.kick('learn','Draw your trail map')+'<h1 class="q">A destination, milestones, and help drawing it</h1>'+
   L.prose('Your priority list keeps you oriented. The trail map adds where you’re going and the milestones on the way. Where do you see yourself in five years? What does that mean you should do now?')+
   L.list([['people','Don’t draw it alone','From your own experience you only see the paths near you. Read, go to conferences, and above all ask people who took the path you’re curious about.'],
     ['person','Don’t rely on your manager','They may help, but at staff+ you may be on a path they never took. Find your own advice, teaching, guardrails and opportunities.'],
     ['flame','Consider the ambitious path','Don’t pick only what’s clearly signposted. If your goal feels out of reach, step toward a spot with a better view. A career is long.']],1));
  L.done();}},
{part:1,src:'Chapter 9 · Where Are You Going?',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Quinn wonders what the path to principal looks like. Ezra has only ever been a manager. Who should Quinn ask?</h1>');
  L.mc(L.card,['Only Ezra, since Ezra writes the reviews','Noa and other people who have taken it','Nobody: just wait for the next review'],1,
   'People who walked the path show you trails you can’t see from where you stand. Noa is a principal; that’s the obvious first conversation.',
   'Ezra may help, but at staff+ your manager may not know your path, and waiting shows you nothing. Ask people who walked it.');}},
{part:1,src:'Chapter 9 · Where Are You Going?',pts:1,run(L){
  L.h(L.kick('pr','Your call')+'<h1 class="q">Mika dreams of one day leading payments architecture across a whole company. It feels miles away. What fits the book’s advice?</h1>');
  L.mc(L.card,['Drop it and pick a goal that is clearly signposted','Wait until the right big role is advertised','Take a nearer step that gives a better view'],2,
   'If the goal isn’t reachable from here, move to a vantage point, like leading a cross-team Payments piece, that shows where to go next.',
   'The book warns against choosing only what’s signposted, and waiting isn’t a step. Move somewhere with a better view; a career is long.');}},

/* ---------- PART 3: INVEST ---------- */
{part:2,src:'Chapter 9 · Building skills',run(L){
  L.h(L.kick('learn','Ability points')+'<h1 class="q">“I’m not good at it” really means “I haven’t leveled it up yet”</h1>'+
   L.prose('In some role-playing games, each mission earns '+L.g('ability-points','ability points')+' you spend on skills. Say you have 14 points in Python. This year you could push it to 15, or start something new.')+
   L.lanes([['x','Common advice','Focus on what you’re already good at.',4],
            ['check','The book’s advice','Spend points on what you <i>want</i> to be good at.',2]])+
   L.prose('Everything in tech is learnable, if it’s worth the time. You can’t learn it all, and you don’t need to: strong teams combine people with different skills. But if a gap blocks your goal, it’s unknown, not unknowable.')+
   L.note('Don’t make the trip harder than it needs to be. If the work drains you every day, find another path. Charity Majors warns that a long career means managing your energy.','leaf'));
  L.done();}},
{part:2,src:'Chapter 9 · Building skills',pts:1,
 solve:async L=>{L.$('#p1').click();L.$('#p1').click();L.$('#p2').click();L.$('#p2').click();L.$('#p1').click();L.$('#lk').click();},
 run(L){
  const S=[['Box Office depth',14],['Technical strategy',3],['Influencing across orgs',2]];const add=[0,0,0];let left=5,done=false;
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Quinn’s trail map says: “Lead an org-wide technical strategy within three years.” Spend this year’s 5 ability points.</h1>'+
   '<div id="sk"></div><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:10px"><div class="small" id="lf">5 points left</div><div style="display:flex;gap:8px"><button class="btn" id="rs">Reset</button><button class="btn pri" id="lk" disabled>'+L.ic('lock')+'Lock in</button></div></div><div id="fbk"></div>');
  const draw=()=>{L.$('#sk').innerHTML=S.map((x,j)=>'<div class="meterrow" style="align-items:center"><div class="lb">'+x[0]+'<br><span class="small">'+x[1]+(add[j]?' + '+add[j]:'')+'</span></div><div class="meter"><div style="width:'+Math.min(100,Math.round((x[1]+add[j])/20*100))+'%;background:'+(add[j]?'var(--ok-strong)':'var(--h2)')+'"></div></div><button class="chip" id="p'+j+'" style="margin-left:8px">+1</button></div>').join('');
    S.forEach((x,j)=>{L.$('#p'+j).onclick=()=>{if(done||left<=0)return;add[j]++;left--;draw();};});
    L.$('#lf').textContent=left+' point'+(left===1?'':'s')+' left';L.$('#lk').disabled=left>0||done;};
  draw();
  L.$('#rs').onclick=()=>{if(done)return;add.fill(0);left=5;draw();};
  L.$('#lk').onclick=()=>{if(done||left>0)return;done=true;L.$('#lk').disabled=true;const ok=add[1]+add[2]>=4;L.award(ok);
    L.sheet(ok?'ok':'no',ok?'Points where the goal is':'Most points went to what Quinn is already good at',
     ok?'Box Office depth is already high. Quinn spends this year on the skills the trail map needs: strategy and influence. That’s putting points into what you <i>want</i> to be good at.':'Fourteen points in Box Office is already a strength. The goal needs strategy and influence across orgs, so the book would put points there: into what Quinn <i>wants</i> to be good at.');L.done();};}},
{part:2,src:'Chapter 9 · Imposter Syndrome',run(L){
  L.h(L.kick('ex','Mika feels like an imposter')+'<h1 class="q">A worried message after a design review</h1>');
  L.beats(L.card,[
   ['The message','Mika writes to Quinn: “Everyone in that review understood systems design better than me. I’m just not good at it. Maybe I’m not staff material.”'],
   ['The feeling','That’s '+L.g('imposter','imposter syndrome')+'. The book says many staff engineers feel it, even at that level. It can make people take fewer smart risks, so their work suffers.'],
   ['The reframe','Quinn replies: “You’re not bad at systems design. You haven’t put ability points there yet. It’s learnable.”'],
   ['A small step','Quinn suggests Mika co-write the next Payments design with Hollis: a nervous-making place to spend a few points, with support.'],
   ['A break','And Quinn adds: “Go easy on yourself. Nobody knows everything. I still feel it about strategy.”']],
   'Unknown, not unknowable. Put a few points into what scares you, and you see it’s just another topic you can learn.');}},
{part:2,src:'Chapter 9 · Building skills',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Tomas says, “I’m just not a people person, so I avoid networking events.” How would the book reframe that?</h1>');
  L.mc(L.card,['It’s a skill Noa hasn’t leveled up yet','It’s a fixed trait, so Noa should avoid it','It only matters for people who want to manage'],0,
   'The book calls networking tricks learnable “humaning” skills. Tomas can decide whether it’s worth the points.',
   'The book’s view is that skills like this are learnable, not fixed, and they matter for anyone whose next step depends on contacts.');}},
{part:2,src:'Chapter 9 · Building a network',run(L){
  L.h(L.kick('learn','Network, visibility and deliberate choices')+'<h1 class="q">Skills alone rarely get you there</h1>'+
   L.list([['people','Build a network','Many jobs are never advertised; people find them through contacts. When a project needs a lead, leaders ask around. Yvette Pasqua invites people to chat about a specific topic, joins only groups that give her energy, and talks one-on-one at events.'],
     ['eye','Build visibility','If nobody sees your skills, nobody invites you to use them. Let people see you solve problems and bring a clear plan to chaos. Talks, writing and open source are optional and cost points. Got a chance? Show what you can do.'],
     ['compass','Choose roles deliberately','You get better at what you spend time on. Five years on storage makes you “the storage person.” It’s easy to get typecast, so pick roles that give the experiences you want.']],2)+
   '<p class="small" style="margin-top:10px">Not sure which experiences you need? Find someone living the role you want and ask what got them there.</p>');
  L.done();}},
{part:2,src:'Chapter 9 · What Do You Need to Invest In?',pts:5,run(L){
  L.h(L.kick('pr','Which investment?')+'<h1 class="q">Quinn’s colleagues are investing in their futures. Which kind of investment is each one?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Skills','Network','Visibility','Deliberate role'],[
   ['Lucia spends evenings on a course in accessibility testing, which their goal needs.',0,'Putting ability points into a needed skill is building skills.'],
   ['Hollis asks three payments engineers at other companies for a 30-minute chat on fraud tooling.',1,'Reaching out about a specific shared topic is how Yvette Pasqua builds a network.'],
   ['Bao writes up how Resale’s fraud checks work and shares it at the engineering all-hands.',2,'Letting people see you solve problems builds visibility.'],
   ['After five years on mobile, Lucia asks to join Platform to avoid being typecast.',3,'Choosing a role for the experience it gives is deliberate.'],
   ['Mika rehearses a meetup talk three times rather than writing it the night before.',2,'When you get a visible chance, don’t waste it: be visibly competent.']],
   'Skills, contacts and visibility all grow fastest through your day job, if you choose it on purpose.');}},

/* ---------- PART 4: YOUR ROLE ---------- */
{part:3,src:'Chapter 9 · Five Metrics to Keep an Eye On',run(L){
  L.h(L.kick('learn','Is your job good for you?')+'<h1 class="q">Cate Huston’s five '+L.g('job-health','job-health signals')+'</h1>'+
   L.list([['Am I learning?',''],['Am I building transferable skills, or just navigating dysfunction?',''],['How do I feel about recruiting others to my team?',''],['How confident do I feel?',''],['How stressed do I feel?','']],3)+
   L.prose('A bad job (stagnation, a bully, no support, impossible deadlines) can get worse so slowly you don’t notice. The author has seen friends stay so long they came to believe nobody else would hire them.')+
   L.quote('Five years of experience is just… the same year of experience, five times over.','Cate Huston, quoted in chapter 9'));
  L.done();}},
{part:3,src:'Chapter 9 · Five Metrics to Keep an Eye On',pts:1,
 solve:async L=>{L.$('#six').click();},
 run(L){
  const M=['Jan','Feb','Mar','Apr','May','Jun'],D=[[4,4,3,4,4,2],[3,4,4,4,3,1]];
  const row=(n,v)=>'<div class="meterrow"><div class="lb">'+n+'</div><div class="meter"><div style="width:'+v*20+'%;background:'+(v<=2?'var(--no)':'var(--ok-strong)')+'"></div></div></div>';
  L.h(L.kick('pr','Predict, then look')+'<h1 class="q">June was rough for Quinn: an on-sale incident and a nasty review fight. Confidence and calm both dropped. Is it time to leave?</h1>'+
   '<div id="tk"><div class="small">June only</div>'+row('Confidence',D[0][5])+row('Calm (low stress)',D[1][5])+'</div>'+
   '<button class="btn pri" id="six" style="margin-top:12px">'+L.ic('cal')+'Show all six months</button><div id="tq"></div>');
  L.$('#six').onclick=function(){this.remove();
    L.$('#tk').innerHTML=M.map((m,j)=>'<div class="small" style="margin-top:8px">'+m+'</div>'+row('Confidence',D[0][j])+row('Calm (low stress)',D[1][j])).join('');
    const q=L.$('#tq');q.innerHTML='<h2 class="sub">What should Quinn take from the six months?</h2>';
    L.mc(q,['One bad month in a mostly healthy job','A clear trend, so start job hunting now'],0,
     'Five good months and one bad one. Tracking over time protects you from rage-quitting over a bad month.',
     'Look again: January to May were mostly good. One bad month isn’t a trend. Keep tracking, and act if bad months keep coming.');};}},
{part:3,src:'Chapter 9 · Five Metrics to Keep an Eye On',pts:1,run(L){
  L.h(L.kick('pr','Your call')+'<h1 class="q">Noa’s tracker shows eight months of falling learning and rising stress. Noa still feels unsure. Which question helps most?</h1>');
  L.mc(L.card,['“Was last month worse than the one before?”','“If nothing changed, how long would I stay?”','“Would my manager be upset if I left?”'],1,
   'That’s the Sheelzebub principle from Captain Awkward: if things stayed exactly as they are, would you stay another month? A year? Five?',
   'Comparing single months brings back the recency trap, and a manager’s feelings aren’t a health signal. Ask: if nothing changed, how long would I stay?');}},
{part:3,src:'Chapter 9 · Should You Change Jobs?',run(L){
  L.h(L.kick('learn','Stay or move?')+'<h1 class="q">Check your role against your list, then weigh both sides</h1>'+
   L.prose('Go through your priority list: what is your job giving you, and what’s missing? Notice the good parts too; they’re easy to take for granted. No role wins on everything: top pay can clash with doing good, and big achievements can eat your free time.')+
   L.lanes([['home','Reasons to stay','<b>Feedback loops</b>: you see results of your own decisions. <b>Depth</b> in one domain. <b>Relationships</b> built on trust. <b>Context</b>: you know the shadow org chart. <b>Familiarity</b>: your life fits around it.',2],
            ['arrow','Reasons to move','<b>Employability</b>: fresh, transferable skills. New <b>experiences</b> and people. <b>Growth</b>: a step up can be easier elsewhere. <b>Money</b>: new hires often get more. <b>Mismatch</b>: the path you want doesn’t exist here.',3]]));
  L.done();}},
{part:3,src:'Chapter 9 · Should You Change Jobs?',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which reason is this?',['Feedback loops','Relationships','Context','Mismatch','Employability'],[
   ['Quinn wants to see whether the waiting room they pushed for really holds up for two more years of on-sales.',0,'Staying lets you see the results of your own decisions.'],
   ['Noa wants to become an industry expert in a field Usherly has no use for.',3,'When the path you want doesn’t exist here, that’s a mismatch.'],
   ['Wren and Quinn now disagree in meetings without anyone getting heated.',1,'Goodwill built over years makes even hard disagreements friendly.'],
   ['Greta has spent ten years mastering Box Office quirks no other company uses.',4,'Long stays can teach you one culture instead of transferable skills. Fresh skills keep doors open.'],
   ['Quinn knows exactly who to ask before a decision reaches Ezra.',2,'Knowing how to navigate this organization is context that doesn’t transfer.']]);}},
{part:3,src:'Chapter 9 · Can You Get What You Want from Your Role?',pts:1,run(L){
  L.h(L.kick('pr','Your call')+'<h1 class="q">Quinn checks the staff role against their list: lots of learning, real impact for fans, Thursdays protected. Pay is fine, not great. What’s the book’s next step?</h1>');
  L.mc(L.card,['Leave for the highest-paying offer available','Accept that pay can’t ever be improved here','See if pay can improve without losing the rest'],2,
   'No role is best at everything. Look at what isn’t ideal and ask whether you can change it without giving up too much elsewhere.',
   'Quinn’s top priorities are met, and wealth is lower on the list. Jumping throws that away, and giving up skips the question. Try to fix the gap without losing the rest.');}}
  ]
});
</script>
</body>
</html>
