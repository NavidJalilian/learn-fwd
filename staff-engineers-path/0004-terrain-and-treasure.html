<script>
Course.lesson({
  id:'0004', title:'Navigating the terrain, finding the treasure', minutes:20, icon:'compass',
  goals:['Read your organization’s culture and pitch ideas to fit it','Mark chasms, fortresses and other landmarks, and find where decisions really get made','Connect today’s work to the long-term goal and tell that story'],
  parts:['Culture','Landmarks','Decisions','Treasure'],
  read:'Read the second half of chapter 2 for the full culture sliders, the Westrum table and the shadow org chart.',
  glossary:{
    'westrum':'Westrum’s typology: sociologist Ron Westrum’s three kinds of organizational culture: pathological (power-oriented), bureaucratic (rule-oriented) and generative (performance- or mission-oriented).',
    'fortress':'Fortress: a team or person who seems set on blocking your project, usually a gatekeeper who cares about quality or safety.',
    'paved-road':'Paved road: the official, well-supported way of doing something, such as a standard set of technologies or a self-service deploy pipeline, made so easy that teams choose it.',
    'the-room':'“The room”: wherever the decisions that affect your scope actually get made, such as a managers’ meeting or a director’s staff meeting.',
    'shadow-org':'Shadow org chart: the unwritten map of who influences whom, which is often different from the official org chart.',
    'gemba':'Gemba: a Lean manufacturing idea: go to where the work happens and see how things actually run.',
    'tech-tree':'Tech tree: in strategy games like Civilization, the graph of technologies where each one unlocks the next. You research physics because you want a railroad.'
  },
  cheatsheet:[
    'Being right is less than half the battle. Organizational skills aren’t “politics”: they’re <b>engineering</b> that includes the humans in the system.',
    'Read the culture: secret/open, oral/written, top-down/bottom-up, fast/deliberate, back channels/front doors, allocated/available, liquid/crystallized. Pitch to fit it.',
    '<b>Westrum</b>: power-, rule- or mission-oriented cultures. Know which you’re in and budget your time and risk to match.',
    'Mark the landmarks: <b>chasms</b>, <b>fortresses</b>, <b>disputed territory</b>, <b>uncrossable deserts</b>, <b>paved roads</b> and goat tracks.',
    'Find <b>the room</b>. Ask to join for the organization’s sake, then make yourself cheap to include. Learn the <b>shadow org chart</b>.',
    'Keep the map fresh (channels, walking the floor, lurking, reading, leaders, people) and <b>be a bridge</b> across gaps.',
    '<b>Treasure map</b>: know why you’re doing each step. Share the map, tell the story of progress, and draw a new one if nobody has.'
  ],
  steps:[
/* ---------- PART 1: CULTURE ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Quinn is certain Box Office needs load testing before every big on-sale, and has the data to prove it. Is being right enough to make it happen?</h1>');
  L.mc(L.card,['Yes, good data speaks for itself','No, people still have to care'],1,
   'The book says being right is less than half the battle. You have to convince people, and convince them to care. That takes a map of the terrain.',
   'Data helps, but the book says being right is less than half the battle. You also have to convince the right people to care. That’s what this lesson is about.');}},
{part:0,src:'Chapter 2 · Rough Terrain',run(L){
  L.h(L.kick('learn','The topographical map')+'<h1 class="q">Without a map of the terrain, three things go wrong</h1>'+
   L.prose('Teams press against each other like the plates of the earth, forming ridges and chasms. A reorg or a new leader can reshape the land overnight. To cross it you need a '+L.g('topographic-map','topographical map')+'.')+
   L.list([['trend','Good ideas don’t get traction','You need sponsors, momentum and a way to make the idea “real”.'],
     ['alert','You hit the hard part late','Others may have failed at the same cliff. Knowing where lets you go another way, or solve the hardest part first.'],
     ['clock','Everything takes longer','Simple decisions drag on for months. Even timing matters: announce a plan right after quarterly goals are set and you may wait a quarter.']],4)+
   L.note('Engineers sometimes call this “politics.” The book disagrees: thinking about the humans in the system, the real problem, long-term consequences and trade-offs is <b>good engineering</b>.','scale'));
  L.done();}},
{part:0,src:'Chapter 2 · Rough Terrain',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Quinn plans to launch the load-testing idea the week after Usherly sets its quarterly engineering goals. What’s the likely result?</h1>');
  L.mc(L.card,['A hard fight, and maybe a wait until next quarter','Quick support, since the incident is still fresh','Little effect, since timing rarely matters'],0,
   'Teams have just committed their time. Learning the planning cycle helps Quinn time the pitch.',
   'The book’s own example: announce an initiative just after quarterly goals are set and you face a hard fight, maybe a quarter’s wait. Timing is part of the terrain.');}},
{part:0,src:'Chapter 2 · What’s the culture?',run(L){
  L.h(L.kick('learn','Seven culture questions')+'<h1 class="q">Where does your org sit on each one?</h1>'+
   L.prose('Published values show what leaders hope for. The real culture is what happens every day. Most companies sit somewhere in the middle; it’s the extremes that are hard. Tap each card.'));
  L.flips(L.card,[
   ['Secret or open?','Is information locked away and shared on a need-to-know basis, or is everything visible, even messy drafts? Reshare a secret in one and you lose trust; withhold in the other and you look political.'],
   ['Oral or written?','Big decisions in a hallway chat, or a spec and sign-offs for every change? Write too much in one and nobody reads it; too little in the other and you look sloppy.'],
   ['Top-down or bottom-up?','Do initiatives come from leaders, or from teams? Tells you whether to win over fellow engineers first or your director.'],
   ['Fast or deliberate change?','Fast orgs want an incremental path with value right away. Deliberate ones want to see the whole plan thought through.'],
   ['Back channels or front doors?','A quick DM to a friend on the other team, or a ticket and a wait? Skip the queue in a front-door culture and it’s rude.'],
   ['Allocated or available?','Overloaded teams say no fast; pick ideas that free up time. Teams with spare time spawn many competing projects; back one and help it finish.'],
   ['Liquid or crystallized?','Can you move around and hustle for good projects, or is there a fixed lattice where people rise together and promotion projects are already earmarked?']],
   'None of these has a right answer. Knowing where the sliders sit keeps you from working against the culture.');}},
{part:0,src:'Chapter 2 · What’s the culture?',pts:1,
 solve:async L=>{const c=L.$('#cs').children;c[0].click();c[1].click();},
 run(L){
  const C=[['Product Engineering','Fast change · oral · back channels','Lead with a small first step that shows value in the next on-sale. A short chat and a one-page note at most. DM the team leads directly.'],
           ['Platform','Deliberate change · written · front doors','Show the whole plan, thought through end to end, in a proper design doc. Request it through the official queue; skipping it looks rude.']];const seen=new Set();
  L.h(L.kick('pr','Toggle and compare')+'<h1 class="q">Quinn’s load-testing plan needs both orgs. Pick an org and see how the same idea should be pitched. Try both.</h1><div id="cs"></div>'+
   '<div style="background:var(--soft);border-radius:16px;padding:14px;margin:8px 0 6px;min-height:110px"><div class="small" id="ct" style="margin-bottom:6px">Choose an org above.</div><div id="cb"></div></div><div id="cq"></div>');
  C.forEach((c,j)=>{const b=document.createElement('button');b.className='chip';b.innerHTML=L.ic(j?'layers':'flame')+c[0];b.onclick=()=>{[...L.$('#cs').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(j);
    L.$('#ct').innerHTML='<b>'+c[1]+'</b>';L.$('#cb').innerHTML='<p class="prose" style="margin:0">'+c[2]+'</p>';
    if(seen.size===2&&!L.$('#cq').innerHTML){const q=L.$('#cq');q.innerHTML='<h2 class="sub">Quinn needs Wren’s team in Platform to set up load-test environments. Which approach fits?</h2>';
      L.mc(q,['DM a friendly engineer on the team to slip it in quietly','Send a full written plan through the team’s request queue'],1,
       'Platform is deliberate, written and front-door. A thought-through plan through the official path fits how it works.',
       'In a front-door culture, skipping the queue gets you judged poorly, and a deliberate org wants the whole plan in writing.');}};L.$('#cs').appendChild(b);});}},
{part:0,src:'Chapter 2 · What’s the culture?',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which culture question does this show?',['Secret or open','Oral or written','Back channels or front doors','Allocated or available','Liquid or crystallized'],[
   ['At Usherly, Ezra’s calendar is private and most planning channels are invite-only.',0,'Information is need-to-know: a secret-leaning culture.'],
   ['The mobile team shipped a big feature nobody else heard about until it launched.',1,'Decisions made by word of mouth, with nothing written: an oral culture.'],
   ['To get a load-balancer change, you file a ticket with Wren’s team and wait.',2,'Formal requests and queues are front doors.'],
   ['Every team’s roadmap is full, and new requests get a fast “no.”',3,'Overloaded teams: an allocated culture.'],
   ['In Payments, everyone knows the next big project is reserved for whoever is next in line.',4,'Earmarked promotion projects are a sign of a crystallized lattice.']]);}},
{part:0,src:'Chapter 2 · Allocated or available?',pts:1,run(L){
  L.h(L.kick('pr','What next?')+'<h1 class="q">Most Usherly teams are overloaded and turn down anything not on their roadmap. Which of Quinn’s ideas is most likely to succeed?</h1>');
  L.mc(L.card,['A big cross-team push to rebuild the seat-map service','A new weekly reliability review for every team','A script Quinn writes that cuts on-call toil for all teams'],2,
   'In an allocated culture, the best bets free up time without big investment, and need little help from busy people.',
   'Both of those ask busy teams to commit to something new. In an allocated culture, the book says to favor work that frees up time and that you can do alone or with a little help.');}},

/* ---------- PART 2: LANDMARKS ---------- */
{part:1,src:'Chapter 2 · Power, rules, or mission?',run(L){
  L.h(L.kick('learn','Power, rules or mission?')+'<h1 class="q">A second lens: what do leaders reward?</h1>'+
   L.prose('People follow whatever leaders reward and punish. '+L.g('westrum','Ron Westrum')+' sorted organizations into three cultures by how they handle information:')+
   L.tiers([['flame','Pathological · power-oriented','Low cooperation. Messengers get “shot,” failure leads to scapegoating, new ideas get crushed.','Take fewer risks, and protect yourself when you do.'],
            ['list','Bureaucratic · rule-oriented','Modest cooperation. Information moves through set channels; failure leads to “justice,” novelty causes problems.','Plan ahead, follow the rules, respect the chain of command.'],
            ['leaf','Generative · mission-oriented','High cooperation. Messengers are trained, risks are shared, failure leads to inquiry, new ideas get built.','Sharing and progress come easiest.',true,'Easiest terrain']])+
   '<p class="small" style="margin-top:10px">The DORA research group found that high-trust cultures where information flows have better software delivery. Rocky road? Budget more time, and don’t get angry at what you can’t control.</p>');
  L.done();}},
{part:1,src:'Chapter 2 · Power, rules, or mission?',pts:6,run(L){
  L.h(L.kick('pr','Which culture?')+'<h1 class="q">Sort each sign by Westrum’s three cultures.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Power','Rules','Mission'],[
   ['An engineer warns that an on-sale looks risky and gets blamed when it fails',0,'“Messengers shot” is pathological.'],
   ['After the outage, a review decides which rule was broken and who pays',1,'Failure leading to “justice” is bureaucratic.'],
   ['After the outage, a blameless review asks how the system let it happen',2,'Failure leading to inquiry is generative.'],
   ['Each team does exactly its narrow job and nothing more',1,'Narrow responsibilities are bureaucratic.'],
   ['When things go wrong, everyone works hard to make sure it’s not their fault',0,'Responsibilities shirked: pathological.'],
   ['Teams are encouraged to link up with other teams',2,'Bridging encouraged: generative.']],
   'Reading these signals tells you how much people will share, help and get behind new ideas.');}},
{part:1,src:'Chapter 2 · Noticing the points of interest',run(L){
  L.h(L.kick('learn','Points of interest')+'<h1 class="q">The landmarks on your map</h1>'+
   L.list([['Chasms','Gaps between groups whose cultures and goals grew apart, often product teams vs infrastructure. Work and information fall into them.'],
     ['Fortresses','Gatekeepers who seem to block everything. Most care about quality and safety. Get in with a token from a sponsor they respect, or the “password”: risks addressed, checklists done, comments answered.'],
     ['Disputed territory','Work that several teams think they own, or that nobody fully owns. Expect power struggles and wasted effort.'],
     ['Uncrossable deserts','Battles others think can’t be won. You can still try, but bring evidence that this time will be different.'],
     ['Paved roads','Official ways that are also the easiest ways. Use them. But some roads lead nowhere useful, and people use old “goat tracks” instead.']],3)+
   L.note('Going around a fortress or fighting a long battle both cost you: the long way round loses the gatekeeper’s wisdom too.','shield'));
  L.done();}},
{part:1,src:'Chapter 2 · Noticing the points of interest',run(L){
  L.h(L.kick('ex','Quinn sketches Usherly')+'<h1 class="q">The first draft of Quinn’s topographical map</h1>');
  L.beats(L.card,[
   ['A chasm','Between Product Engineering and Platform. Product says Platform always says no; Platform says product ignores reliability.'],
   ['A fortress','Wren’s Infrastructure team. Every request gets “file a ticket.” Quinn notes: overloaded, well-meaning, guards the load balancers because outages hurt.'],
   ['Disputed territory','Box Office itself: 14 teams change it, and nobody owns its future.'],
   ['An uncrossable desert','A Box Office rewrite. Two attempts stalled. Any mention gets tired sighs.'],
   ['A paved road, and a goat track','Runway, Platform’s new self-service deploy pipeline, is good. But most teams still use the old scripts, which still work for them.']],
   'Quinn now knows where the hard parts are before setting out, and which ones need a sponsor, evidence or a bridge.');}},
{part:1,src:'Chapter 2 · Fortresses',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Quinn needs a load-balancer change from Wren’s team before the next on-sale. Which is the book’s way through the fortress gate?</h1>');
  L.mc(L.card,['Argue every point in public until they give in','Ask a product team to build its own load balancer','Show the risks are covered, with a sponsor’s backing'],2,
   'That’s the “password” and the “token”: prove the risks are handled, and bring support from someone the gatekeeper respects.',
   'A public battle can be a win that costs more than it gains. Going around loses the gatekeeper’s wisdom. Bring a sponsor’s backing and show the risks are handled.');}},
{part:1,src:'Chapter 2 · Noticing the points of interest',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Name the landmark',['Chasm','Fortress','Disputed territory','Uncrossable desert','Paved road'],[
   ['Three teams each own one part of checkout’s retry logic. Nobody can say if a change is safe.',2,'Ownership smeared across teams is disputed territory.'],
   ['A self-service checklist gets a new service into production safely and quickly.',4,'The official way is also the easy way: a paved road.'],
   ['Moving all Usherly data to one shared store has been tried twice and vetoed twice.',3,'A battle others now consider unwinnable.'],
   ['The security team rejects most design docs within an hour, citing old incidents.',1,'A gatekeeper who seems to block everything, often because they care about safety.'],
   ['Mobile and Payments use different words for “order” and rarely talk.',0,'Cultures and goals that grew apart leave a chasm.']]);}},

/* ---------- PART 3: DECISIONS ---------- */
{part:2,src:'Chapter 2 · Where is “the room”?',run(L){
  L.h(L.kick('learn','How decisions get made')+'<h1 class="q">Find the room where it happens</h1>'+
   L.prose('Opinions and plans seem to appear from nowhere: suddenly everyone agrees on a new direction. Some decisions emerge from talk; others are made formally, in rooms you’re not in. If you keep feeling out of the loop, you don’t yet know how decisions get made, or who shapes them.')+
   L.list([['people','A weekly managers’ meeting','meant for org matters, but it often weighs in on technical direction'],
     ['person','A director’s staff meeting','with the people who report to them'],
     ['chat','An architecture channel','where a central group reaches agreement']],2)+
   L.prose('Find '+L.g('the-room','“the room”')+' for the decisions you care about. If you can’t see it, ask someone you trust to walk you through where a decision came from, and make clear you’re not fighting it. Sometimes there’s no room at all.')+
   '<p class="small">A tip from the book: when you think “why won’t <i>they</i> listen?”, ask who “they” is. Name exactly who you need to convince.</p>');
  L.done();}},
{part:2,src:'Chapter 2 · Asking to join in',run(L){
  L.h(L.kick('learn','Asking to join in')+'<h1 class="q">Get in for the org’s sake, then be cheap to include</h1>'+
   L.lanes([['target','Asking','Show how including you helps the <b>organization</b> reach its goals, not your career. Practice your story. Expect pushback: every extra person slows a meeting and changes how open people are.',2],
            ['check','Once you’re in','Lower the cost of having you: come prepared, speak briefly, be easy to work with. Make the room slower and you won’t be invited back.',1]])+
   L.list([['If you’re not let in','Don’t take it personally or complain. Be friendly and do good work.'],
     ['Rooms to stay out of','Pay and performance talks are for managers. Suggest splitting them from technical topics.'],
     ['It may hold less power','The author once found directors who felt their real decisions were made two levels up.']],3));
  L.done();}},
{part:2,src:'Chapter 2 · Asking to join in',pts:1,run(L){
  L.h(L.kick('pr','Build the pitch')+'<h1 class="q">Quinn asks Ezra to join the weekly Product Engineering managers’ meeting. Tap each piece until the pitch matches the book.</h1>');
  L.sentence(L.card,[['To help my path to principal,','Since Box Office reliability calls get made there,','Since it feels unfair that I’m left out,'],['I’ll come prepared and keep it brief,','I’ll raise every open issue I have,','I’ll join each discussion in depth,'],['and if not, I’ll take it to the VP.','and if not, I’ll stop sharing my notes.','and if not, I’ll keep doing good work.']],[1,0,2],
   [['Career reasons rarely persuade. Frame it around what the organization gains.','Feeling left out isn’t a reason the group can act on. Show what it gains.'],['That makes the meeting slower, which raises the cost of including you.','Long dives slow the room down. Be concise.'],['Escalating over an invitation looks like grousing.','Holding back information hurts the organization and looks political.']],
   'Organizational impact, a low cost to include you, and grace if the answer is no.');}},
{part:2,src:'Chapter 2 · The shadow org chart',run(L){
  L.h(L.kick('ex','The shadow org chart')+'<h1 class="q">Why Ezra suddenly went cold</h1>');
  L.beats(L.card,[
   ['The book’s story','A director seems keen on an idea, then goes cold. The reason: before any decision, the director checks with a long-time engineer who isn’t very senior but whose “no” ends things.'],
   ['The idea','The '+L.g('shadow-org','shadow org chart')+' (from the book <i>Debugging Teams</i>) is the unwritten map of influence. It names “connectors,” who know people everywhere, and “old-timers,” trusted for having been around a long time.'],
   ['At Usherly','Ezra loved Quinn’s load-testing plan on Monday. By Thursday, Ezra had doubts.'],
   ['The clue','Quinn asks a friend how decisions really get made in Product Engineering. Answer: Ezra runs every Box Office decision past Greta, who has worked on it for ten years.'],
   ['The move','Quinn books time with Greta, listens to Greta’s worries about test traffic hitting real payment systems, and changes the plan to fix them.']],
   'Titles matter, but so does who people listen to. Those influencers are who you need to convince before change can happen.');}},
{part:2,src:'Chapter 2 · The shadow org chart',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Quinn wants Platform to adopt the load-testing step. Wren manages the team, but people say Wren never moves on reliability without asking Tomas, a long-time infrastructure engineer. What should Quinn do first?</h1>');
  L.mc(L.card,['Talk with Tomas and understand their concerns','Go straight to Wren, since Wren decides','Ask the VP to overrule Platform’s caution'],0,
   'Tomas is an old-timer on the shadow org chart. Win Tomas over and the formal decision gets much easier.',
   'Wren holds the title, but influence flows through Tomas. The book says the people you need to convince are the real influencers, not just the official deciders.');}},
{part:2,src:'Chapter 2 · Keeping Your Topographic Map Up to Date',run(L){
  L.h(L.kick('learn','Keep the map fresh')+'<h1 class="q">The terrain changes faster than anything else</h1>'+
   L.prose('A team you depend on gets a new lead. A project you were waiting for is cancelled. Planning is about to start. Ways to keep up:')+
   L.list([['list','Announcement channels','For new design docs, outages and changes. If they don’t exist, consider creating them.'],
     ['eye','Walking the floor','The Lean idea of '+L.g('gemba','gemba')+': pair on a change, run an incident, do a deploy. It keeps your technical credibility too.'],
     ['info','Lurking','Skim agendas and notes of meetings you’re not in, or newest Slack channels to spot new projects.'],
     ['book','Reading','Skim the RFCs and design docs, or block time to read deeply.'],
     ['person','Checking in with leaders','Hear the behind-the-scenes news and stay aligned.'],
     ['chat','Talking with people','Including product, sales, legal, support and admins, who often know the most.']],1)+
   '<p class="small" style="margin-top:10px">Not a natural networker? Ask about someone’s work, or sincerely praise something they chose to do, like a well-run meeting.</p>');
  L.done();}},
{part:2,src:'Chapter 2 · If the Terrain Is Still Difficult to Navigate, Be a Bridge',run(L){
  L.h(L.kick('learn','Be a bridge')+'<h1 class="q">Go where others fear to tread</h1>'+
   L.prose('The problems that slow tech companies down are mostly human: teams that don’t talk, decisions nobody feels able to make, power struggles. It’s tempting to write “here be dragons” and steer away. A staff engineer often has the most impact by making that ground easier for everyone.')+
   L.flow([['chat','Send the summary','that nobody else is sending','',1],['people','Introduce people','who should have spoken a month ago','',2],['pencil','Write it down','how the projects connect','',3]])+
   L.prose('Build bridges early: invite someone whose work you don’t understand, or which frustrates you, for coffee. And where you can, shape your scope so it spans a <b>whole</b> system or problem, across team lines, so you can catch dropped work and tell one story.'));
  L.done();}},
{part:2,src:'Chapter 2 · If the Terrain Is Still Difficult to Navigate, Be a Bridge',pts:1,run(L){
  L.h(L.kick('pr','What next?')+'<h1 class="q">The Resale team is planning a feature that will need new load-balancer capacity. Wren’s team has no idea. Quarterly planning is two months away. What’s the best bridging move?</h1>');
  L.mc(L.card,['Wait for quarterly planning, the official place to raise it','Introduce the two leads now, with a short summary for both','Tell Resale to work around Infrastructure for now'],1,
   'Exactly the bridge the book describes: when planning is far off, connect the two sides before the gap turns into a crisis.',
   'Waiting lets the gap grow, and working around the team skips their wisdom. Introduce the people who need to talk and send the summary nobody else is sending.');}},

/* ---------- PART 4: TREASURE ---------- */
{part:3,src:'Chapter 2 · Chasing Shiny Things',run(L){
  L.h(L.kick('learn','The treasure map')+'<h1 class="q">Where are we going, and why?</h1>'+
   L.prose('The '+L.g('treasure-map','treasure map')+' tells a compelling story of where you’re headed. You need perspective across <b>time</b>, not just across teams. Short-term wins are fine. Thinking <i>only</i> short term causes trouble:')+
   L.list([['Hard to keep everyone aligned','Without the big plan, teams wander or argue over every decision.'],
     ['You won’t finish big things','Multi-step, long-term problems never get solved.'],
     ['You collect cruft','Teams either support every possible future (overcomplicated) or make local choices that become odd edge cases.'],
     ['Initiatives compete','Several people rally support for different directions. Chaos.'],
     ['Engineers stop growing','Short, fully specified tasks never build the muscle for big, messy projects.']],2));
  L.done();}},
{part:3,src:'Chapter 2 · Why are you doing whatever you’re doing?',run(L){
  L.h(L.kick('learn','The tech tree')+'<h1 class="q">You research physics because you want a railroad</h1>'+
   L.prose('In the game <i>Civilization</i>, technologies form a '+L.g('tech-tree','tree')+': you can’t build a railroad without steam engines and bridges, and those need physics first. So at some point you’re researching physics while your real goal is the train.')+
   L.flow([['layers','Service mesh','what you build'],['box','Easier framework','so new services start fast'],['trend','Ship faster','the real goal: time to market']])+
   L.prose('The book’s example: nobody builds a service mesh for the joy of it. When you know the real goal, you can check whether any proposed work actually moves you closer, and teams can choose their own routes without tight coordination.'));
  L.done();}},
{part:3,src:'Chapter 2 · Why are you doing whatever you’re doing?',pts:1,run(L){
  L.h(L.kick('pr','Trace the tree')+'<h1 class="q">Put Quinn’s steps in order, from the first piece of work to the real goal.</h1>');
  L.order(L.card,['Move Box Office deploys onto Runway','Deploys take minutes, not 40 minutes','Fixes ship fast during an on-sale incident','Checkout stays up when fans are buying'],
   'Each step only matters because of the one above it. Moving to Runway isn’t the goal; fans being able to buy tickets is.',['First step','','','Real goal']);}},
{part:3,src:'Chapter 2 · Sharing the map',run(L){
  L.h(L.kick('learn','Share the map, and your own story')+'<h1 class="q">Don’t keep the treasure map to yourself</h1>'+
   L.list([['star','Share it','Show where you are, where you’re going and why. Mark the sea monsters and shortcuts, skip the distractions, and define what success looks like.'],
     ['cycle','Show progress','It’s easy to forget how far you’ve come. Tell the story of where you started as well as where you’re going.'],
     ['pencil','No map? Draw one','If you find competing destinations or none, write a short summary of the confusion to force the talk into the open. If there’s still no agreed destination, it’s time to make a new map (next lesson).']],2)+
   L.note('<b>Your own journey.</b> Staff work takes longer to show impact, so tell its story: what you were trying to do, how it went, and how this week’s work fits a bigger goal. Chapter 9 adds a fourth map, the trail map.','compass'));
  L.done();}},
{part:3,src:'Chapter 2 · Sharing the map',pts:1,run(L){
  L.h(L.kick('pr','What next?')+'<h1 class="q">Six months into the on-sale reliability work, Box Office engineers say it feels like they’re “getting nowhere.” Two big milestones are already done. What should Quinn do?</h1>');
  L.mc(L.card,['Add a new milestone so the team has a fresh target','Ask Ezra to announce the project is on schedule','Tell the story of where they started and where they’re headed'],2,
   'The person with the map can show everyone how far they’ve come, and how close the treasure is.',
   'New targets and status announcements don’t fix the feeling. The book says to tell the story of where you were and the progress made, as well as where you’re going.');}}
  ]
});
</script>
