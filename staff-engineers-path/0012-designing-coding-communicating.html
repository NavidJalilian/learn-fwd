<script>
Course.lesson({
  id:'0012', title:'Designing, coding and communicating', minutes:19, icon:'pencil',
  goals:['Write a design document (RFC) that people can actually check, and catch the common design pitfalls','Decide how much to code on a project you lead, without becoming the bottleneck','Share project status in terms of impact, and stay honest when plans change'],
  parts:['Write it down','Pitfalls','Coding','Status and change'],
  read:'Read the last part of chapter 5 for the full RFC template, more design pitfalls and the stories from staff engineers about how they code.',
  glossary:{
    'rfc':'RFC (request for comment): a design document you share so others can check your plan, your assumptions and whether you’re solving the right problem.',
    'bikeshedding':'Bikeshedding: spending most of a discussion on the small, easy-to-grasp decisions while the hard ones get little attention.',
    'watermelon':'Watermelon project: a project reported as green on the outside while it’s really red inside, because its problems are being hidden.',
    'snacking':'Snacking: doing lots of low-effort, low-impact work because it’s quick and feels good, at the cost of work that matters.',
    'critical-path':'Critical path: the chain of tasks that sets the end date. If any of them is late, the whole project is late.'
  },
  cheatsheet:[
    'Silence isn’t agreement. <b>Write the design down</b>: a short doc is fine, and a written design is a cheap way to try an idea.',
    'Every RFC needs at least <b>context, goals, design, security/privacy/compliance and alternatives considered</b>. Useful extras: background, trade-offs, risks, dependencies, operations.',
    'The goal says <b>why</b>, never how. The implementation should serve the goal, not be the goal.',
    '<b>Wrong is better than vague.</b> Name who does each action, and add a noun after a bare “this” or “that.”',
    'Pitfalls: not really new, looks easy, built only for today, built for the distant future, “every user just needs to,” hard part later, hidden rewrite, not operable, bikeshedding.',
    'If you code, stay off the critical path. Be an <b>exemplar, not a bottleneck</b>: set patterns, pair, and don’t do every review.',
    'Status = <b>impact, headlines first</b>. Follow facts with “That means…” Never report a watermelon.',
    'Something will go wrong. You own the reroute, the escalation or the bad news, and you don’t have to struggle alone.'
  ],
  steps:[
/* ---------- PART 1: WRITE IT DOWN ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Quinn walks the Resale team through the plan in a meeting. Nobody objects. Does that mean everyone agrees with it?</h1>');
  L.mc(L.card,['Yes, silence in the room means agreement','Not necessarily: people may not have taken it in'],1,
   'Nodding along isn’t the same as understanding. This lesson starts with the cheapest way to find out: write the plan down.',
   'People often stay quiet because they haven’t really absorbed the plan yet. Their silent agreement may mean nothing. Writing it down is how you find out.');}},
{part:0,src:'Chapter 5 · Why share designs?',run(L){
  L.h(L.kick('learn','Why share designs?')+'<h1 class="q">You don’t know people agree until it’s written down</h1>'+
   L.prose('Once a project is explored and clarified, the lead has lots of ideas about what to build. Don’t assume the others understand or agree, even if nobody argues. When many people must build one thing together, you need a shared understanding, and a written plan is how you check you have one.')+
   L.flow([['chat','Said in a meeting','Everyone nods','agreement unknown',3],['pencil','Written down','People read and comment','problems surface',2],['check','Shared plan','Same page, literally','',1]])+
   L.prose('It doesn’t have to be a 20-page deep dive. A short, easy read can be perfect. And a review isn’t only “will this architecture work?” It also asks: <b>are we solving the right problem</b>, and are our assumptions about other teams and systems true? The book’s point, borrowed from a friend: a written design is a very cheap way to iterate.'));
  L.done();}},
{part:0,src:'Chapter 5 · What goes in an RFC?',run(L){
  L.h(L.kick('learn','The RFC')+'<h1 class="q">The sections every design document needs</h1>'+
   L.prose('A common format is the '+L.g('rfc','RFC')+', or request for comment. Companies run them differently. The author likes a template because, like a checklist, it reminds you of things you’d otherwise forget. If your company has a template, use it. Otherwise, here is the minimum:')+
   L.list([['Context','Title, author, dates and status (early idea, open for review, being built, done…), so a reader in two years knows if it’s relevant.'],
     ['Goals','Why you’re doing this: the problem or opportunity. Enough for readers to judge if it’s the right problem.'],
     ['Design','How you’ll reach the goal, with enough detail that readers can tell whether it will work.'],
     ['Security, privacy, compliance','What’s worth protecting and from whom. If you think nothing applies, write down why.'],
     ['Alternatives considered','Why simpler options, bought products or existing internal systems won’t do.']],1)+
   '<p class="small" style="margin-top:10px">Often useful too: background, trade-offs, risks, dependencies and operations (who runs it and monitors it).</p>');
  L.done();}},
{part:0,src:'Chapter 5 · What goes in an RFC?',run(L){
  L.h(L.kick('ex','Quinn drafts the Resale RFC')+'<h1 class="q">Watch the draft get better, section by section</h1>');
  L.beats(L.card,[
   ['Context','“Usherly Resale: design. Author: Quinn. Created Jan 9, last updated Jan 16. Status: open for review.” Anyone who finds it later can tell at a glance what it is.'],
   ['Goals, draft 1','Quinn writes: <i>“Build a resale service on Runway.”</i> Noa replies: “That’s already a design decision. Why are we doing this at all?”'],
   ['Goals, draft 2','<i>“Let fans resell tickets safely at capped prices inside Usherly, instead of on scalper sites.”</i> Now a reviewer can ask whether this is the right problem.'],
   ['Security','Resale moves money between fans. Quinn notes which parts touch personal data and payouts, and that Payments holds the bank details.'],
   ['Alternatives','Swap, the old transfer feature, already moves tickets between fans. Quinn explains why it isn’t enough and sends the RFC to Lucia’s team, who own Swap, so they can respond.']],
   'The goal says why. The design says how. And when an existing internal system could plausibly do the job, the author’s own policy is to send the design to its owners.');}},
{part:0,src:'Chapter 5 · What goes in an RFC? (Goals)',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Which of these is the best goal for an RFC?</h1>');
  L.mc(L.card,['Move seat-map lookups to a new caching layer','Cut seat-map load time so fans stop abandoning','Rewrite seat maps as a separate microservice'],1,
   'It names the problem and who it’s for, and leaves the “how” for the design section.',
   'The other two put the solution in the goal. Reviewers can’t judge whether caching or a new service is right if they don’t know the problem it solves.');}},
{part:0,src:'Chapter 5 · What goes in an RFC?',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which RFC section?',['Context','Goals','Design','Security/privacy','Alternatives'],[
   ['“Status: superseded by the Resale v2 doc.”',0,'Status, dates and author belong in the context header.'],
   ['“Box Office will call the Payments API to hold the buyer’s money until the seller’s ticket is cancelled.”',2,'This is how the system will work, so it goes in the design.'],
   ['“Fans who can’t attend have no safe way to sell their tickets today.”',1,'It names the problem you’re solving. That’s the goal.'],
   ['“We looked at buying a white-label resale product. It can’t read our seat maps.”',4,'Showing that a simpler or bought option won’t work is the alternatives section.'],
   ['“Seller phone numbers are stored; only Trust &amp; Safety can read them.”',3,'Who can see personal data is a privacy question.']]);}},

/* ---------- PART 2: PITFALLS ---------- */
{part:1,src:'Chapter 5 · Wrong Is Better Than Vague',run(L){
  L.h(L.kick('learn','Wrong is better than vague')+'<h1 class="q">Commit to a plan, even if people argue</h1>'+
   L.prose('People often stay hand-wavy in the design section so nobody argues with the details. The book says that’s the worse choice. If you’re wrong, someone tells you and you learn. If you’re controversial, you find out early who will push back.')+
   L.quote('Wrong gets corrected, vague sticks around.','Tanya Reilly, chapter 5')+
   L.list([['person','Say who does each action','“The data will be encrypted” hides who encrypts it. Write “The client encrypts the data before sending it.”'],
     ['pencil','Add a noun after “this” or “that”','“TeamB needs this.” Needs what: the proposal, the old feature or the new one? Spend the extra words.']],2));
  L.done();}},
{part:1,src:'Chapter 5 · Wrong Is Better Than Vague',pts:1,
 solve:async L=>{const c=L.$('#vt').children;c[0].click();c[1].click();},
 run(L){
  const V=[['Vague draft','Resale traffic will be handled by the existing infrastructure, and this will be scaled up as needed.','<b>3 days later:</b> two thumbs-up. No comments.',3],
           ['Precise draft','Box Office will send resale checkouts through Platform’s load balancers. Wren’s team will add a resale pool before the March on-sale.','<b>3 days later:</b> Wren comments, “We can’t add a pool before April. Can we talk?”',2]];
  const seen=new Set();
  L.h(L.kick('pr','Toggle and compare')+'<h1 class="q">Two versions of the same RFC sentence. Open each and see what reviewers do with it.</h1><div id="vt" style="display:flex;flex-wrap:wrap;gap:8px"></div>'+
   '<div id="vb" style="background:var(--soft);border-radius:16px;padding:14px;margin:10px 0;min-height:110px"><div class="small">Pick a draft above.</div></div><div id="vq"></div>');
  V.forEach((v,j)=>{const b=document.createElement('button');b.className='chip';b.innerHTML=L.ic('pencil')+v[0];b.onclick=()=>{[...L.$('#vt').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(j);
    L.$('#vb').innerHTML='<p class="prose" style="margin:0 0 10px">“'+v[1]+'”</p><div class="small" style="color:var(--h'+v[3]+')">'+v[2]+'</div>';
    if(seen.size===2&&!L.$('#vq').innerHTML){const q=L.$('#vq');q.innerHTML='<h2 class="sub">The precise draft drew an objection. Why is it still the better one?</h2>';
      L.mc(q,['It surfaced Wren’s timing problem while it’s still cheap to fix','Precise drafts get approved sooner because there is less to read'],0,
       'The vague draft hid who does what, so nobody could object. The precise one named Wren’s team and a date, and the conflict came out in January instead of the week of the on-sale.',
       'Approval speed isn’t the point; the vague draft “passed” only because nobody could tell what it promised. Being specific surfaced the dependency early.');}};L.$('#vt').appendChild(b);});}},
{part:1,src:'Chapter 5 · Wrong Is Better Than Vague',pts:1,run(L){
  L.h(L.kick('try','Fix the sentence')+'<h1 class="q">Quinn’s draft says: “The ticket will be cancelled after resale.” Tap each piece until the sentence is precise.</h1>');
  L.sentence(L.card,[['The ticket','Box Office','This'],['will be cancelled','handles it','will cancel'],['the seller’s original ticket','it'],['at some point','once the buyer’s payment clears']],[1,2,0,1],
   [['“The ticket” is the thing acted on. Who does the cancelling?','A bare “this” leaves the reader guessing what you mean.'],['Passive voice hides who acts.','“Handles it” is too loose to review.'],['Bare “it”: which ticket? Spell it out.'],['“At some point” can’t be checked. When exactly?']],
   'Now a reviewer knows who acts, on what, and when, so they can tell you if any of it is wrong.');}},
{part:1,src:'Chapter 5 · Technical pitfalls',run(L){
  L.h(L.kick('learn','Technical pitfalls, part 1')+'<h1 class="q">Catch these in your own design before others have to</h1>'+
   L.list([['It’s a brand-new problem (it isn’t)','Your problem is almost never new. Look for others who solved it and reuse what you can.'],
     ['This looks easy!','Other fields are as complex as ours. If accounting or payroll looks trivial, you don’t understand it yet.'],
     ['Building for the present','Will it still work in three years, as the company, its products and your team grow?'],
     ['Building for the distant future','Designing for far more users than you need adds complexity. “We might need it later” isn’t a reason.'],
     ['Every user just needs to…','Five users can learn your rules. Hundreds will get them wrong. Any change to how people work belongs in the design.']],4));
  L.done();}},
{part:1,src:'Chapter 5 · Technical pitfalls',run(L){
  L.h(L.kick('learn','Technical pitfalls, part 2')+'<h1 class="q">Flip each card to see the trap and the question to ask</h1>');
  L.flips(L.card,[
   ['We’ll figure out the hard part later','Common in migrations: polish the easy cases for a quarter, then find the hard case is impossible. Or push the hard part onto others, like making every caller change their code.'],
   ['Solving the small problem by making the big one harder','Hacky workarounds quietly depend on today’s behavior and make a real fix harder later. If you must, at least say so in the design.'],
   ['It’s not really a rewrite (but it is!)','“Just” refactoring a big, tangled system usually means rewriting much more than planned. Be honest about it.'],
   ['But is it operable?','If you struggle to understand it at 3 p.m., you won’t at 3 a.m. Make it observable, and name who’s on call: more than three people, ideally six.'],
   ['Discussing the smallest decisions the most',L.g('bikeshedding','Bikeshedding')+': easy, reversible details get long debates while the hard decisions get none.']],
   'The book says this list isn’t complete. Add the pitfalls you’ve seen yourself.');}},
{part:1,src:'Chapter 5 · Technical pitfalls',run(L){
  L.h(L.kick('ex','Noa reviews the Resale RFC')+'<h1 class="q">Five comments, five pitfalls caught early</h1>');
  L.beats(L.card,[
   ['Comment 1','The RFC says “we’ll support stadium on-sales in phase two.” Noa: “That’s the hardest case. What if phase two can’t work?” <b>Hard part later.</b>'],
   ['Comment 2','“Every seller just needs to verify their phone first.” Noa: “Thousands of fans will skip that. Design for it.” <b>Every user just needs to.</b>'],
   ['Comment 3','“We’ll write our own fraud scoring; it’s a few rules.” Noa: “Trust &amp; Safety has spent years on fraud. Ask Bao.” <b>This looks easy.</b>'],
   ['Comment 4','“Active-active in three regions from day one.” Noa: “Why? Box Office runs in one.” <b>Distant future.</b>'],
   ['Comment 5','Forty comments argue over the service’s name; none on the price-cap logic. Noa: “Let’s pick a name in five minutes.” <b>Bikeshedding.</b>']],
   'None of these needed deep architecture skills. They needed someone to ask the uncomfortable questions while changing the plan was still cheap.');}},
{part:1,src:'Chapter 5 · But is it operable?',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">The RFC says the new Resale team will be on call for the service. The team has three engineers. What should Quinn flag?</h1>');
  L.mc(L.card,['Three is fine as long as the runbook is good','Three on call risks burnout and missed pages','Nobody should be on call for a new service'],1,
   'The book suggests more than three people, ideally at least six, or the team burns out and drops pages.',
   'A good runbook helps, but three people can’t carry a rotation. And production systems do need someone on call: the RFC should name who, with enough people (ideally six).');}},
{part:1,src:'Chapter 5 · Technical pitfalls',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Spot the pitfall',['This looks easy','Distant future','Every user needs to','Hard part later','Hidden rewrite'],[
   ['“We’ll just pull the business logic out of Box Office and tidy it up as we go.”',4,'In an 11-year-old system, “just tidy it up” usually means rewriting far more than planned.'],
   ['“Ticket refunds are simple: send the money back. Why is Payments’ code so big?”',0,'Refunds involve fees, partial orders and chargebacks. If it looks trivial, you don’t understand it yet.'],
   ['“Each venue just needs to update its door-scanning app before the launch.”',2,'Hundreds of venues won’t all do it. Plan for the ones who don’t.'],
   ['“We’ll move the three easy event types first. Tours with seat holds can wait.”',3,'If seat holds turn out not to fit, the quarter of polish was spent on the easy part.'],
   ['“Build it to handle 1,000× today’s resale traffic, just in case.”',1,'“Just in case” isn’t a reason. Explain why that size is worth the extra complexity.']]);}},

/* ---------- PART 3: CODING ---------- */
{part:2,src:'Chapter 5 · Should you code on the project?',run(L){
  L.h(L.kick('learn','Should you code?')+'<h1 class="q">It depends, and that’s fine</h1>'+
   L.prose('How much a project lead codes depends on the project, the team and your own taste. On a tiny team you may touch every change. On a multi-team project you might write small fixes, or no code at all. Many leads review a lot of code and write little.')+
   L.lanes([['check','Why coding helps','It gives you depth that’s hard to get otherwise and helps you spot problems. It can keep you engaged. And you feel the cost of your own architecture choices.',1],
            ['alert','When it’s a trap','Code is rarely your highest-leverage work. If it pulls you away from hard design decisions or organizational work, it’s '+L.g('snacking','snacking')+': easy, quick-feedback work that dodges the important stuff.',4]])+
   L.note('Engineer Joy Ebertz notes that most of the code a senior engineer writes could be written by someone more junior.','book'));
  L.done();}},
{part:2,src:'Chapter 5 · Be an exemplar, but not a bottleneck',run(L){
  L.h(L.kick('learn','Exemplar, not bottleneck')+'<h1 class="q">Use your code as a lever for everyone else</h1>'+
   L.list([['clock','Stay off the critical path','Your days are full of meetings and interruptions, so you’ll be slower. Pick work that isn’t urgent and that nobody is waiting on.'],
     ['layers','Set a pattern others copy','One staff engineer rewrote all the API pagination tests in one standard style. Every new test copied it.'],
     ['people','Pair, then hand off','Do the key part together, then let a colleague finish. They learn, and you don’t own it forever.'],
     ['eye','Review gently, and not everything','A staff engineer’s comment can feel harsh to a junior. Let “good enough” stand sometimes, and don’t do all the reviews.'],
     ['star','Your work sets the bar','Tests, comments, docs: if the most senior person is sloppy, the team will be too.']],2)+
   '<p class="small" style="margin-top:10px">The '+L.g('critical-path','critical path')+' is the chain of tasks that sets the end date.</p>');
  L.done();}},
{part:2,src:'Chapter 5 · Be an exemplar, but not a bottleneck',run(L){
  L.h(L.kick('ex','Quinn’s first month of coding on Resale')+'<h1 class="q">From bottleneck to lever</h1>');
  L.beats(L.card,[
   ['Week 1','Quinn grabs the core “transfer a seat” change in Box Office. It’s the most important code, and Quinn knows Box Office best.'],
   ['Week 2','Quinn spends four days in meetings with Legal, Payments and Trust &amp; Safety. The change sits half-done. Three engineers wait on it.'],
   ['Week 3','Quinn pairs with Ines, a Resale engineer, on the tricky seat-lock part for two hours, then hands the rest to Ines.'],
   ['Week 4','Quinn writes the first price-cap check test in a clean, standard shape and converts the old ones to match. New tests from the team copy it without being asked.']],
   'Quinn still codes, but on work nobody waits for, and in ways that spread knowledge and set the pattern.');}},
{part:2,src:'Chapter 5 · Be an exemplar, but not a bottleneck',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Quinn has a free afternoon and wants to code. Which task fits a busy project lead best?</h1>');
  L.mc(L.card,['Write a test helper the team will reuse, due in no rush','Take the seller-payout change that launch is waiting for','Become the required reviewer on every Resale change'],0,
   'It’s off the critical path, and it sets a pattern others will copy.',
   'The payout change is on the critical path, and Quinn’s meetings would make it late. Reviewing everything makes Quinn a single point of failure, and the team learns less.');}},
{part:2,src:'Chapter 5 · Coding',pts:5,run(L){
  L.h(L.kick('pr','Lever or bottleneck?')+'<h1 class="q">Sort what Quinn does this month.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Exemplar','Bottleneck','Snacking'],[
   ['Writes the first resale event handler in a clean style, then hands the next five to the team',0,'Setting a pattern and handing off spreads knowledge.'],
   ['Insists on approving every pull request before it merges',1,'Nothing moves when Quinn is in meetings, and the team learns less.'],
   ['Fixes small lint warnings all week while the price-cap design waits',2,'Easy, quick-feedback work that avoids the hard decision.'],
   ['Keeps the only working copy of the seat-lock logic in a personal branch',1,'Only Quinn understands it, so everyone waits on Quinn.'],
   ['Adds clear tests and comments to every change, even under time pressure',0,'The most senior person’s habits become the team’s.']],
   'Code as a lever: set patterns, pair and hand off, and keep the hard thinking as your main job.');}},

/* ---------- PART 4: STATUS AND CHANGE ---------- */
{part:3,src:'Chapter 5 · Communicating',run(L){
  L.h(L.kick('learn','Talking and sharing status')+'<h1 class="q">Two kinds of communication keep a project moving</h1>'+
   L.lanes([['people','Inside: talking to each other','Help people across teams build relationships: shared meetings, friendly channels, demos. The goal is comfortable familiarity, so asking “What does that term mean?” feels normal.',2],
            ['chat','Outside: sharing status','Sponsors and stakeholders want to know how it’s going. Lead with the headlines. Explain <b>impact</b>: what users can do now, and when they can do the next thing.',3]])+
   L.prose('More detail isn’t better: it buries the message. A delay that doesn’t change your date may not matter to them at all. Spell out the takeaway: follow a fact with <b>“That means…”</b> or explain you’re doing something <b>“so that we can…”</b>')+
   L.note('Be honest. A '+L.g('watermelon','watermelon project')+' looks green outside and is red inside. If you’re stuck, say so and ask for help.','alert'));
  L.done();}},
{part:3,src:'Chapter 5 · Sharing status',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">Quinn rewrites the weekly update to Ezra</h1>'+
   L.lanes([['x','Before','Stood up 3 new services. Lucia’s screen is 4 days late (no effect on dates). Hollis refactored the payout queue. Oskar still reviewing caps. Status: green.',4],
            ['check','After','<b>Launch moves from March 2 to March 23.</b> Legal hasn’t ruled on price caps. That means sellers can’t list tickets for the spring tour on-sale. We need a ruling by Feb 1 so that we can hold March 23.',1]])+
   L.prose('The “before” is full of true facts and hides the only one Ezra needs. The “after” leads with the headline, says what it means for fans, and ends with what would help.'));
  L.done();}},
{part:3,src:'Chapter 5 · Sharing status',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Every Resale workstream is green except one: the Legal price-cap ruling, without which Resale can’t launch. What’s the honest status?</h1>');
  L.mc(L.card,['Green, with a note about the Legal ruling','Yellow, since most of the work is on track','Not green: launch is blocked until Legal rules'],2,
   'If one problem stops the launch, the project isn’t green, whatever the other rows say.',
   'That’s a watermelon: green outside, red inside. One blocking problem makes the whole project not green, and saying so is how Quinn gets help early.');}},
{part:3,src:'Chapter 5 · Sharing status',pts:1,
 solve:async L=>{const c=L.$('#sf').children;c[1].click();c[2].click();c[4].click();L.$('#send').click();},
 run(L){
  const F=[['We stood up three new microservices this sprint.',0,'Ezra cares what fans can do, not how many services exist.'],
           ['Resale opens to sellers on April 6, not March 23.',1,''],
           ['That means fans can’t resell tickets for the big April 2 tour.',1,''],
           ['Lucia’s team is two days late on a screen; the date doesn’t change.',0,'A delay that doesn’t move the date isn’t news for Ezra. It can even look like an escalation.'],
           ['We need Wren’s team for one day in March so that we can hold April 6.',1,'']];
  let first=true;
  L.h(L.kick('pr','Build the update')+'<h1 class="q">A new slip. Pick the lines that belong in Quinn’s update to Ezra, then send it.</h1><div id="sf" style="display:flex;flex-direction:column;gap:8px;align-items:stretch"></div>'+
   '<button class="btn pri" id="send" style="margin-top:12px">'+L.ic('arrow')+'Send to Ezra</button><div id="sr"></div>');
  F.forEach((f,j)=>{const b=document.createElement('button');b.className='chip';b.style.textAlign='left';b.style.whiteSpace='normal';b.textContent=f[0];b.onclick=()=>b.classList.toggle('sel');L.$('#sf').appendChild(b);});
  L.$('#send').onclick=()=>{const sel=[...L.$('#sf').children].map(b=>b.classList.contains('sel'));
    const wrongIn=F.filter((f,j)=>sel[j]&&!f[1]),missing=F.filter((f,j)=>!sel[j]&&f[1]);
    if(!wrongIn.length&&!missing.length){if(first)L.award(true);L.$('#sr').innerHTML='';L.$('#send').remove();
      L.sheet(first?'ok':'info',first?'Ezra gets it in ten seconds':'Now it reads right','The new date, what it means for fans, and the one thing that would help. Everything else can wait for anyone who asks.');L.done();}
    else{if(first)L.award(false);first=false;
      L.fb(L.$('#sr'),(wrongIn.length?'<b>Leave out:</b> '+wrongIn.map(f=>f[2]).join(' '):'')+(missing.length?' <b>Missing:</b> the update needs the new date, what it means for fans, and the ask.':'')+' Adjust and send again.','no');}};}},
