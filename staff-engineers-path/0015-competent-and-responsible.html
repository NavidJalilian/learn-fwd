<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Competent and Responsible</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0015', title:'Competent and responsible', minutes:19, icon:'shield',
  goals:['Explain why a staff engineer’s everyday behavior sets the culture','Show competence: know things, know yourself, keep high standards and own mistakes','Act as the responsible grown-up: own the problem, take charge and keep things calm'],
  parts:['Role model','Be competent','Take ownership','Charge and calm'],
  read:'Read the first half of chapter 7 for the stories behind each habit, including the advice on speaking up.',
  glossary:{
    'role-model':'Role model: someone whose behavior others copy. For a staff engineer this happens whether they want it or not.',
    'cyae':'CYAE (“cover your ass engineering”): John Allspaw’s name for dodging responsibility, as in “I built it to spec, so it’s not my fault,” instead of asking whether the work actually helped the people it was for.',
    'radiate-intent':'Radiating intent: saying what you’re about to do before you do it, so others have context and a chance to stop you, while you keep the responsibility.',
    'glue-work':'Glue work: the unrewarded tasks that hold a team together, such as onboarding, reminders, scheduling and unblocking.',
    'eli5':'ELI5: “Explain it like I’m five.” A request to start from the basics, with a promise not to be offended.',
    'feigned-surprise':'Feigned surprise: acting shocked that someone doesn’t know something (“You’ve never used Linux?”), which makes people afraid to ask.',
    'retro':'Retrospective: a meeting or write-up where the team looks back at what happened and what it learned, after failures and successes alike.'
  },
  cheatsheet:[
    'Your words carry weight now: <b>don’t think out loud</b>. Half-baked ideas turn into projects.',
    'Values are what you <b>do</b>. People copy how senior engineers behave, and who gets promoted shows what the company really values.',
    'Four attributes to model: <b>be competent, be responsible, remember the goal, look ahead</b>. They are ideals, not a test.',
    '<b>Competent</b>: build experience and domain knowledge, stay current, know what you do and don’t know, and keep high standards.',
    'Own your mistakes: admit it, fix it, tell people fast, clear anyone who might be blamed, and hold a retrospective.',
    '<b>Take ownership</b>: own the whole problem, make decisions, ask “obvious” questions, and don’t leave glue work to junior people.',
    '<b>Take charge</b>: coordinate emergencies out loud, ask when everyone is confused, drive meetings, and speak up publicly when someone is disrespectful.',
    '<b>Create calm</b>: keep small problems small, avoid blame, and be consistent. Take care of yourself so you can.'
  ],
  steps:[
/* ---------- PART 1: ROLE MODEL ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">In a big Box Office meeting, Quinn muses: “Maybe someday we should rebuild seat maps from scratch.” What’s most likely a month later?</h1>');
  L.mc(L.card,['Three teams are planning around a “seat-map rebuild”','Everyone has forgotten the passing comment'],0,
   'When a staff engineer says something, people assume it’s considered. A passing thought can quietly become a project. That’s where this lesson starts.',
   'Coming from a new staff engineer, a passing comment rarely gets forgotten. People assume Quinn has thought it through, and start planning around it.');}},
{part:0,src:'Chapter 7 · You’re a Role Model Now (Sorry)',run(L){
  L.h(L.kick('learn','Your words weigh more now')+'<h1 class="q">People assume you know what you’re talking about</h1>'+
   L.quote('Don’t think out loud.','Carla Geisser, the author’s friend, quoted in chapter 7')+
   L.prose('That was the warning the author got on becoming a staff engineer. A half-formed idea you mention can be discussed a month later as if it were already a project.')+
   L.lanes([['star','The blessing','Your ideas seem more credible, and your work gets checked a bit less.',2],
            ['alert','The curse','So you’d better be right. People now look to you for guidance instead of guiding you.',3]])+
   L.prose('This lesson is about <b>passive</b> influence: the kind you have just by how you behave.'));
  L.done();}},
{part:0,src:'Chapter 7 · Values Are What You Do',run(L){
  L.h(L.kick('learn','Values are what you do')+'<h1 class="q">People copy what senior engineers do, not what the wiki says</h1>'+
   L.prose('Your company may have written values. But the clearest sign of what it values is <b>who gets promoted</b>. Talk of teamwork means little if people reach staff through lone heroics.')+
   L.prose('If the principles promise careful code review but senior engineers approve pull requests without reading them, everyone will rubber-stamp too. Your work sets the standard others treat as correct.')+
   L.note('It covers how you treat people too. Be constructive and accountable, and that’s what juniors learn a senior engineer is. Be condescending or never available, and they learn that instead.','people')+
   '<p class="small" style="margin-top:10px">You don’t have to be loud. Many of the best leaders are quiet and thoughtful. If leading scares you, start small and treat it as a skill you practice.</p>');
  L.done();}},
{part:0,src:'Chapter 7 · Values Are What You Do',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Usherly’s engineering principles say “review code carefully.” Busy before an on-sale, Quinn approves a large Box Office change after a 30-second skim. What does the team learn?</h1>');
  L.mc(L.card,['That careful review matters, as the principles say','That a quick skim is what senior people really do','Nothing, because nobody looks at who approved it'],1,
   'People copy what senior engineers do. A skim from Quinn quietly teaches that skimming is the real standard.',
   'Written principles lose to visible behavior, and people do notice who approved what. The team learns from Quinn’s skim that a glance is good enough.');}},
{part:0,src:'Chapter 7 · But I Don’t Want to Be a Role Model!',pts:1,run(L){
  L.h(L.kick('pr','What should Mika do?')+'<h1 class="q">Mika tells Quinn: “I want to reach staff, but I’m quiet. I can’t be some loud role model.” What’s the book’s advice?</h1>');
  L.mc(L.card,['Start speaking up in every meeting, even if it’s forced','Wait until the staff promotion, then start leading','Start small, like praising someone’s work in a public channel'],2,
   'Quiet people can lead well. The book suggests starting small and building leadership like any other skill.',
   'Being a role model doesn’t mean being louder than you’re comfortable with, and it doesn’t wait for a title. Start small, for example public praise or helping onboard someone, and practice.');}},

/* ---------- PART 2: BE COMPETENT ---------- */
{part:1,src:'Chapter 7 · What Does It Mean to Do a Good Job as a Senior Engineer?',run(L){
  L.h(L.kick('learn','Four attributes')+'<h1 class="q">What a senior engineer should model</h1>'+
   L.tiers([['check','Be competent','Know things, know yourself, keep high standards.','This lesson',true,'Now'],
            ['shield','Be responsible','Own the problem, take charge, create calm.','This lesson',true,'Now'],
            ['target','Remember the goal','There’s a business, a user and a team.','Next lesson'],
            ['eye','Look ahead','Prepare for the future of your systems and people.','Next lesson']])+
   L.note('These are ideals to keep working toward, not a score you must hit to be a “real engineer.” Advice depends on the situation: if it clashes with your own judgment, trust yourself.','compass'));
  L.done();}},
{part:1,src:'Chapter 7 · Know Things',run(L){
  L.h(L.kick('learn','Know things')+'<h1 class="q">No technical leadership without the technical part</h1>'+
   L.list([['clock','Build experience','Skill comes from study and practice, not talent. It takes years: the book notes staff engineers usually have at least 10, principals at least 15. Don’t rush past your prime learning years into roles far from the tech.'],
     ['layers','Build domain knowledge','In a new area you may know the least, and juniors may teach you. Your experience lets you spot the <i>shape</i> of a problem you’ve seen elsewhere. Learn the new area quickly and on purpose.'],
     ['bulb','Stay up to date','Don’t push a “best practice” the industry dropped years ago. Stay anchored in the technology, not only in how your company works.']],1)+
   L.note('Hear someone called “not technical enough”? Be precise instead: not enough hands-on years, new to this domain, or missing a specific skill? Each has a path forward.','info'));
  L.done();}},
{part:1,src:'Chapter 7 · Build domain knowledge',run(L){
  L.h(L.kick('ex','Usherly story')+'<h1 class="q">Quinn, a beginner again</h1>');
  L.beats(L.card,[
   ['New ground','Quinn knows Box Office inside out. Resale also needs payouts and fraud checks, which Quinn has never worked on.'],
   ['Spotting shapes','Bao explains how fraud scores flag suspicious resales. Quinn recognizes the shape: it’s like the bot detection Box Office uses during on-sales. That gives Quinn a hook to hang the new details on.'],
   ['Learning on purpose','Quinn reads the payments basics Hollis recommends and asks who the well-known voices in the field are.'],
   ['Learning in public','In the design review, Quinn says: “I learned this from Bao last week, so here’s how I reached my conclusion.” The juniors see that even staff engineers are still learning.']],
   'Even very experienced engineers become beginners in a new area. Say so, and show how you’re learning.');}},
{part:1,src:'Chapter 7 · Are You “Technical Enough”?',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Hollis grumbles that Bao’s new Trust &amp; Safety engineer “just isn’t technical enough.” What’s the most useful reply?</h1>');
  L.mc(L.card,['“Do you mean years, this domain, or one specific skill?”','“Then we should ask Bao to hire someone else.”','“Everyone is technical enough in their own way.”'],0,
   'Being precise turns a label about who someone is into a skill gap with a way to close it.',
   'The book pushes back on “not technical enough” because it describes a person, not their skills. Neither giving up on them nor brushing it off helps. Ask which gap is meant, so there’s a way forward.');}},
{part:1,src:'Chapter 7 · Be Self-Aware',run(L){
  L.h(L.kick('learn','Be self-aware')+'<h1 class="q">Know what you know, and what you don’t</h1>'+
   L.prose('Real confidence comes from doing the work long enough to trust yourself. No bragging or jargon needed. Tap each card.'));
  L.flips(L.card,[
   ['Admit what you know','You don’t have to be the best in the industry. When your skill is needed, volunteer it. That’s a fact, not a brag.'],
   ['Admit what you don’t','Bluffing costs you learning and can lead to bad decisions. Ask for an '+L.g('eli5','ELI5')+'. When senior people admit gaps, everyone else can too.'],
   ['Know your own context','Your view isn’t everyone’s. Notice what others don’t know, and bridge the gap. Explaining simply shows real expertise.']],
   'Self-aware engineers know where they can step up, where they can mentor, and what to learn next.');}},
{part:1,src:'Chapter 7 · Have High Standards',run(L){
  L.h(L.kick('learn','Have high standards')+'<h1 class="q">Quality in everything, not just the fun parts</h1>'+
   L.list([['star','Aim high everywhere','Write the clearest docs you can. Be the first to know when your software breaks. A quick, duct-tape fix is fine when the problem calls for it, not because the work bores you.'],
     ['chat','Seek out criticism','Ask for code review and design review. Invite people to poke holes in ideas you love. Your work is not you.'],
     ['shield','Own your mistakes','Admit it, then fix it. Tell people quickly and clearly. If someone else might be blamed, clear them. If you hurt someone, apologize. Consider a '+L.g('retro','retrospective')+'.'],
     ['check','Be reliable','Be the person others trust to handle it, so they don’t need to be in the room. Finish what you start, or say clearly why you stopped.']],2));
  L.done();}},
{part:1,src:'Chapter 7 · Own your mistakes',pts:1,
 solve:async L=>{for(let i=0;i<3;i++){L.$('#ok'+i).click();await new Promise(r=>setTimeout(r,60));}},
 run(L){
  const R=[['The Payments channel asks what happened.',[['“It was Mika’s change. I only reviewed it.”',0,'People go quiet. Mika now feels blamed, and nobody learns what really happened.'],['“I approved a change that broke listings. Fixing it now. Update in 20 minutes.”',1,'Clear, fast and honest. People stop guessing and start helping.']]],
   ['Mika, who wrote the change, looks miserable.',[['Tell the channel Mika followed the process, and the miss was in Quinn’s review.',1,'Mika relaxes. The team sees that mistakes here are survivable.'],['Say nothing more, so the outage fades from view faster.',0,'Mika assumes the blame is theirs. Rumors fill the silence.']]],
   ['The fix is in and listings work again.',[['Move on quickly and hope people forget about it.',0,'The same gap could bite again, and the team learns that mistakes get hidden.'],['Hold a retrospective, open about Quinn’s own part.',1,'It’s easy to see what happened when nobody downplays their part.']]]];
  let r=0,trust=50,all=true;
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Quinn approved a change that broke Resale listings for 40 minutes. Choose Quinn’s responses and watch the team’s trust.</h1>'+
   '<div class="meterrow"><div class="lb">Team trust</div><div class="meter"><div id="tm" style="width:50%;background:var(--ok-strong);transition:width .4s"></div></div></div><div id="sc"></div><div id="lg"></div>');
  const draw=()=>{const s=R[r];L.$('#sc').innerHTML='<h2 class="sub">'+(r+1)+' of 3 · '+s[0]+'</h2><div id="op"></div>';
    s[1].forEach(o=>{const b=document.createElement('button');b.className='chip';b.style.textAlign='left';b.textContent=o[0];if(o[1])b.id='ok'+r;b.onclick=()=>pick(o);L.$('#op').appendChild(b);});};
  const pick=o=>{if(!o[1])all=false;trust=Math.max(5,Math.min(100,trust+(o[1]?17:-17)));L.$('#tm').style.width=trust+'%';
    L.$('#lg').insertAdjacentHTML('beforeend','<p class="small" style="margin:6px 0">'+(o[1]?L.ic('check'):L.ic('x'))+' '+o[2]+'</p>');r++;
    if(r<3)draw();else{L.$('#sc').innerHTML='';L.award(all);
      L.sheet(all?'ok':'info',all?'Trust went up, not down':'Look at what moved the meter','Owning a mistake well can leave you with <i>more</i> respect than before: admit it, fix it, tell people fast, clear anyone else, and learn from it openly. It also makes it safer for everyone else to own theirs.');L.done();}};
  draw();}},
{part:1,src:'Chapter 7 · Be Competent',pts:6,run(L){
  L.h(L.kick('pr','Which part of competence?')+'<h1 class="q">Sort each thing Quinn does.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Know things','Be self-aware','Have high standards'],[
   ['Quinn reads the core payments literature before the Resale design review.',0,'Deliberately learning a new domain builds knowledge.'],
   ['In a meeting, Quinn says: “I don’t know how bank payouts settle. Can someone ELI5?”',1,'Admitting what you don’t know is self-awareness.'],
   ['Quinn asks Noa and Wren to poke holes in Quinn’s favorite design.',2,'Seeking criticism makes the work better.'],
   ['Quinn tells Ezra: “I’m strong on seat maps, so I’ll take that part.”',1,'Admitting what you <i>do</i> know is self-awareness too.'],
   ['Quinn writes a clear on-sale runbook, though it’s the dull part.',2,'High standards apply to all the work, not just the fun parts.'],
   ['Quinn notices a team practice the industry dropped years ago, and checks the current advice.',0,'Staying up to date is part of knowing things.']],
   'Competence is knowledge, self-awareness and high standards working together.');}},

/* ---------- PART 3: TAKE OWNERSHIP ---------- */
{part:2,src:'Chapter 7 · Be Responsible',run(L){
  L.h(L.kick('learn','Be responsible')+'<h1 class="q">Nobody else is coming to be the grown-up</h1>'+
   L.prose('A staff title makes you an authority figure. When you think “someone should do something,” that someone is <b>you</b>.')+
   L.prose('<b>Take ownership:</b> you own the whole problem, not just the parts that go to plan. When things go wrong, you don’t shrug and call it impossible. Avoid '+L.g('cyae','cover-your-ass engineering')+': “I built it to spec, they used it wrong.”')+
   L.flow([['lock','Ask permission','Blame moves to whoever said yes','',3],['chat','Radiate intent','“Here’s what I’m about to do”','',2],['shield','Result','Others get context and can stop you; you keep the responsibility','',1]])+
   '<p class="small" style="margin-top:10px">'+L.g('radiate-intent','Radiating intent')+' is Elizabeth Ayer’s idea: use your judgment without hiding it.</p>');
  L.done();}},
{part:2,src:'Chapter 7 · Take Ownership',run(L){
  L.h(L.kick('learn','Three ownership habits')+'<h1 class="q">Decide, ask, and pick up the glue</h1>'+
   L.list([['scale','Make decisions','Don’t sit on the fence. Weigh the options, choose and explain why, even against your own preference. Make being wrong cheap, and own it if you are.'],
     ['info','Ask “obvious” questions','“With two engineers, how will you run on-call for it?” When a junior asks, the team may sigh. When a senior asks, the team learns to answer it in the design doc.'],
     ['people','Don’t delegate through neglect','Someone must do the '+L.g('glue-work','glue work')+'. It often falls to a junior person who can’t look away, and it costs them technical learning. It counts as leadership when staff do it. So do much of it yourself, and steer juniors to career-building work.']],1));
  L.done();}},
{part:2,src:'Chapter 7 · Don’t delegate through neglect',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">For six months Mika has run Payments’ release reminders, onboarding notes and meeting scheduling. Mika’s code output has dropped. What should Quinn do?</h1>');
  L.mc(L.card,['Thank Mika, since the team needs this work done','Take on some of it, and steer Mika to technical work','Ask Mika to do the glue work faster, on top of the code'],1,
   'The glue work matters, but it’s costing Mika prime learning years. Quinn can pick much of it up, where it counts as leadership.',
   'Thanks alone, or more speed, leaves Mika stuck in work that rarely gets rewarded at their level. The book says to take on glue work yourself and redirect juniors to career-building tasks.');}},
{part:2,src:'Chapter 7 · Take Ownership',pts:1,run(L){
  L.h(L.kick('pr','What should Quinn do?')+'<h1 class="q">Quinn wants to switch off an old Box Office endpoint that Quinn believes nobody calls. What’s the best way to go about it?</h1>');
  L.mc(L.card,['Ask Ezra for permission, so Ezra owns the risk','Post: “I plan to switch it off Thursday. Shout if you use it.”','Switch it off quietly, then apologize if anything breaks'],1,
   'That’s radiating intent: people get context and a chance to object, and Quinn still owns the outcome.',
   'Asking permission hands the blame to Ezra. Acting in private gives nobody the chance to warn Quinn. Radiating intent keeps ownership and gives others a chance to intervene.');}},
{part:2,src:'Chapter 7 · Ask “obvious” questions',pts:1,run(L){
  L.h(L.kick('pr','Why it matters')+'<h1 class="q">Last week a junior engineer asked Lucia’s team who would be on call for their new Resale alerts service. The team sighed. In the design review, Quinn asks the same thing. Why does it matter that Quinn asked?</h1>');
  L.mc(L.card,['Quinn has the authority to block the design','The team learns to answer it in design docs','Junior engineers shouldn’t ask design questions'],1,
   'From an expert, the question tells the team it belongs in the design doc, or makes them truly think about it for the first time.',
   'It isn’t about blocking anything, and juniors asking is fine. It’s unfair, but a senior asking makes the team take it seriously: they start answering it explicitly in their design docs.');}},

/* ---------- PART 4: CHARGE AND CALM ---------- */
{part:3,src:'Chapter 7 · Take Charge',run(L){
  L.h(L.kick('learn','Take charge')+'<h1 class="q">See a gap, fill it, even without authority</h1>'+
   L.list([['flame','Step up in an emergency','Many responders working separately make it worse. Coordinating only works if everyone <b>knows</b> you’re coordinating, so say it. Then add value: take clear notes, give everyone the same context, and ask people to radiate intent.'],
     ['info','Ask when everyone is confused','“The seat-hold service has 1% errors.” Is that bad? What’s normal? Someone must say: “I don’t know what to do with that.” It’s safer for a senior person to ask.']],3)+
   L.note('Never use '+L.g('feigned-surprise','feigned surprise')+' (“You’ve <i>never</i> used that?”). It stops people asking. When someone apologizes for a “basic” question, reassure them.','alert'));
  L.done();}},
{part:3,src:'Chapter 7 · Drive meetings',run(L){
  L.h(L.kick('learn','Meetings and hard moments')+'<h1 class="q">Two more places to step up</h1>'+
   L.lanes([['cal','Drive meetings','Make sure there’s an agenda. Pull the talk back to the goal. Volunteer to take notes: from a junior person it looks like admin, from a senior person it impresses, and you get to frame the decisions. “Wait, I need to catch up on the notes” buys thinking time.',1],
            ['chat','Say something','Someone says something disrespectful in a public channel. Speak up, in public, because the attack was public. It will be awkward, and there’s no perfect wording. Name the culture you want, give the person a way back, and tell their manager if it’s a pattern.',4]]));
  L.done();}},
{part:3,src:'Chapter 7 · Step up in an emergency',run(L){
  L.h(L.kick('ex','Usherly story')+'<h1 class="q">The next on-sale goes wrong</h1>');
  L.beats(L.card,[
   ['The chaos','A big tour goes on sale. Checkout errors climb. Eight people jump into the incident channel, each trying a different fix.'],
   ['Taking charge','Quinn posts: “I’m coordinating this one. Tell me before you change anything.” Now there’s one person everyone knows to follow.'],
   ['Making sense','Someone posts: “Seat-holds at 2% errors.” Quinn asks: “Is that normal for an on-sale? What do you think it means?” Greta answers that it’s usually below 0.1%. Now everyone understands.'],
   ['Radiating intent','Quinn asks each responder to say what they’ll do before they do it. Wren’s team flags that one planned restart would drop every queued fan.'],
   ['Notes','Quinn keeps a running timeline in the channel. Everyone has the same picture, and the later write-up is easy.']],
   'Quinn didn’t fix the bug. Quinn made the response work: one coordinator, shared context, intent out loud, clear notes.');}},
{part:3,src:'Chapter 7 · Drive meetings',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Fifteen minutes into the weekly Resale sync, people are still chatting. There’s no agenda and nobody is taking notes. What should Quinn do?</h1>');
  L.mc(L.card,['Wait politely for Ezra to start the meeting','Leave early and read whatever summary follows','Say “let’s start,” gather topics and take notes'],2,
   'Anyone could start the meeting; most people won’t. Quinn steps up, and taking the notes lets Quinn frame the decisions too.',
   'Waiting or leaving leaves the gap open, and there may be no summary at all. The book says step up: get an agenda, steer the talk, and volunteer for the notes.');}},
{part:3,src:'Chapter 7 · Create Calm',run(L){
  L.h(L.kick('learn','Create calm')+'<h1 class="q">If you stay calm and constructive, others will too</h1>'+
   L.list([['shield','Defuse, don’t amplify','Make big problems smaller and keep small ones small. Ask why someone is telling you: to vent or for action? Don’t react on reflex: a senior person’s fuss can make a small thing loud. Don’t pour your worries onto junior people. Vent to peers or your manager, and say whether you want action.'],
     ['leaf','Avoid blame','An outage is an expensive lesson, so learn from it. Ask: what exactly happened? What led people down that path? What did they not know? Where did their picture of the system differ from reality?'],
     ['compass','Be consistent','Don’t be the wild-card leader who cares about dates one day and tiny details the next. Be predictable. That means looking after yourself: leave slack, rest, take time off.']],2));
  L.done();}},
{part:3,src:'Chapter 7 · Create Calm',pts:6,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Calming or amplifying?',['Calms it down','Amplifies it'],[
   ['A junior engineer reports a scary-looking error. Quinn first asks whether they want help or just want to vent.',0,'Asking questions before acting keeps a small thing small.'],
   ['Quinn spots a minor bug and posts “This is unacceptable!” in the main engineering channel.',1,'A senior person’s fuss turns a small issue into a loud one.'],
   ['Quinn shares worries about the Resale deadline with the two newest engineers.',1,'It’s unfair to make junior people carry your worries, and it spreads anxiety.'],
   ['Quinn vents to Noa about Legal, saying first: “No action needed, I’m just venting.”',0,'Venting to a peer, and saying so clearly, keeps it contained.'],
   ['In the retrospective, Quinn asks where the team’s picture of the system differed from reality.',0,'Curious, blame-free questions help everyone learn.'],
   ['One week Quinn only cares about dates; the next, Quinn grills every tiny technical choice.',1,'Being unpredictable leaves people unsure where they stand.']]);}},
{part:3,src:'Chapter 7 · If you see something, say something',pts:1,run(L){
  L.h(L.kick('pr','What should Quinn do?')+'<h1 class="q">In the public engineering channel, someone posts a mocking joke about Platform engineers being “useless.” A few people react with laughing emojis. What should Quinn do?</h1>');
  L.mc(L.card,['Reply in the channel, naming the respect the team values','Message the poster privately and leave the channel alone','Stay out of it, since it isn’t Quinn’s team or place'],0,
   'A public jab needs a public answer, or it looks acceptable. Quinn can point to the culture the team wants, and tell a manager if it’s a pattern.',
   'The usual “criticize in private” rule doesn’t fit here: if the post goes unanswered in public, it looks acceptable. And staying out of it wastes the standing Quinn has to speak up.');}}
  ]
});
</script>
</body>
</html>
