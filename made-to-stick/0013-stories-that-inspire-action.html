<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Stories That Inspire Action</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">

</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0013', title:'Stories that inspire action', minutes:19, icon:'flame',
  goals:['Spot a story with inspiring potential before it ends up on the bulletin board','Tell Challenge, Connection and Creativity plots apart, and pick the one that fits your goal','Use a springboard story to win over skeptics instead of arguing with them'],
  parts:['Jared','Spotting','Three plots','Springboards'],
  read:'Read the second half of chapter 6 for the full Jared story, the three plots and Stephen Denning’s talk at the World Bank.',
  glossary:{
    'spotting':'Spotting: noticing a sticky idea or story that already exists, and acting on it, instead of inventing one from scratch.',
    'challenge-plot':'Challenge plot: a story where someone overcomes obstacles that seem daunting. It makes us want to work harder and take on challenges.',
    'connection-plot':'Connection plot: a story where people build a relationship across a gap of race, class, age, religion or the like. It makes us want to help and get along with others.',
    'creativity-plot':'Creativity plot: a story where someone makes a mental breakthrough or solves a problem in a new way. It makes us want to experiment.',
    'little-voice':'The little voice: the skeptic inside a listener’s head that debates everything a speaker says.'
  },
  cheatsheet:[
    'Stories give <b>inspiration</b> as well as simulation: Jared’s story is less a flight simulator than a pep talk.',
    'Lay two messages side by side on the <b>SUCCESs</b> checklist and you can often predict the winner in advance (Jared beat “7 Under 6”).',
    '<b>Spotting beats creating.</b> Great stories die when someone in the middle pins them to the bulletin board instead of passing them on.',
    'Three plots cover most inspiring stories: <b>Challenge</b> (overcome daunting odds), <b>Connection</b> (bridge a gap between people), <b>Creativity</b> (a new way to solve a problem).',
    'Pick the plot that fits your goal: Challenge for a project kickoff, Connection for the holiday party, Creativity to change how people work.',
    'A <b>springboard story</b> shows how an existing problem could change. It gives the listener’s inner skeptic something to do, so the idea becomes theirs.',
    'Slogans like “keep communication open” are pure common sense. Keep the story; the moral comes with it.',
    'Stories are naturally concrete, emotional and often unexpected. The hard part is making sure they carry <b>your core</b>.'
  ],
  steps:[
/* ---------- PART 1: JARED ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Two winter mailers from Kestrel. Which one would make you pick up the phone?</h1>');
  L.mc(L.card,['“Heat pumps give up to three times more heat from the same electricity.”','“Gloria wore a coat in their own kitchen for years. This winter they took it off, and their bill fell from $380 to $150.”'],1,
   'You can picture Gloria, and you want what they got. This lesson is about stories that make people want to act.',
   'The number is true and tidy, but it gives you nothing to picture or feel. Gloria’s story makes you want the same thing for yourself.');}},
{part:0,src:'Chapter 6 · Stories as Inspiration: The Tale of Jared',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">How a sandwich chain almost missed its best ad</h1>');
  L.beats(L.card,[
   ['The statistic','In the late 1990s Subway pushed a line of healthier sandwiches with a statistic: “7 Under 6”, seven subs under six grams of fat. It did fine, nothing more.'],
   ['The student','Jared, a college student, weighed 425 pounds. A roommate noticed swollen ankles; his doctor father warned he might not live past 35. Jared made up his own Subway-only diet and walked everywhere. He lost almost 100 pounds in three months.'],
   ['The spotter','A former dormmate wrote him up in the campus paper. A men’s magazine mentioned a nameless “sub sandwich diet”. A Subway franchise owner, Bob Ocwieja, read it and tracked down the creative director at Subway’s ad agency.'],
   ['The hurdles','An intern found Jared at the first Subway he tried. But Subway’s new marketing director said fast food can’t sell healthy, and the lawyers worried about medical claims. The idea seemed dead.'],
   ['The gamble','Some regional franchise owners wanted the ad. The agency’s president, Barry Krause, shot it for free, the only time in his career he did that. It aired on January 1, 2000.'],
   ['The result','The phones rang for days; Oprah’s show called them. The ad went national. Subway’s flat sales jumped 18% in 2000 and 16% in 2001, while smaller rivals grew about 7% a year.']],
   'Same promise as “7 Under 6”: low-fat subs, weight loss. One was a modest success; the other was a sensation.');}},
{part:0,src:'Chapter 6 · Stories as Inspiration: The Tale of Jared',run(L){
  L.h(L.kick('learn','The second power of stories')+'<h1 class="q">Less a flight simulator, more a pep talk</h1>'+
   L.prose('The last lesson showed that stories let us <b>simulate</b>: rehearse how to act. Jared’s story has a little of that: you can picture the lunch order and the walking. But its real power is <b>inspiration</b>. A man beat huge odds by sticking with it, and even people who never diet feel the pull.')+
   L.lanes([['list','“7 Under 6”','Simple, but a weak core: we have low-fat subs. Not surprising, not concrete (numbers aren’t), easy to believe only because it claims little. No emotion, no story.',4],
            ['flame','Jared','Simple: eat subs, lose weight. Unexpected: fast food made someone thin. Concrete: the giant pants. Credible: a former 425-pound man giving diet advice. Emotional: one person. A story of beating the odds.',2]])+
   L.prose('The book’s point: anyone who knew the '+L.g('success','SUCCESs')+' checklist could have picked the winner <b>in advance</b>, just by laying the two side by side. Yet the experienced marketing director wanted to walk away from Jared.'));
  L.done();}},
{part:0,src:'Chapter 6 · Stories as Inspiration: The Tale of Jared',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Jared’s story mostly gives viewers which of these?</h1>');
  L.mc(L.card,['A step-by-step plan they can rehearse for their own diet','A strong push to take on their own hard goal','Expert proof that fast food is healthy for everyone'],1,
   'It has a little simulation value, but mainly it’s a pep talk: if he could do it, so can I.',
   'There’s a little rehearsal in it, but not much. And it isn’t expert proof; its credibility comes from Jared himself. Its main gift is inspiration.');}},
{part:0,src:'Chapter 6 · Stories as Inspiration: The Tale of Jared',pts:1,
 solve:async L=>{[...L.$('#tr').children].forEach(b=>b.click());},
 run(L){
  const T=[
   ['Simple',1,'Short, but its core is only “heat pumps are efficient”.','Its core is the whole promise: a warm home, a smaller bill.'],
   ['Unexpected',0,'A number doesn’t touch the belief that heat pumps fail in the cold.','The heat pump ran all through a cold January, and the bill still fell.'],
   ['Concrete',0,'Numbers aren’t concrete. There’s nothing to picture.','A coat worn in the kitchen. A bill going from $380 to $150.'],
   ['Credible',1,'Believable, but only because it asks you to believe little.','A real neighbor with real bills and nothing to sell.'],
   ['Emotional',0,'Nothing to feel.','One person you can picture, finally warm at home.'],
   ['Story',0,'No story at all.','Years of cold, then the coat comes off.']];
  const seen=new Set();
  L.h(L.kick('pr','Lay them side by side')+'<h1 class="q">Jun can’t decide between the two mailers from the warm-up. Tap each trait to score both on the checklist.</h1><div id="tr"></div><div id="rw"></div><div id="tq"></div>');
  T.forEach((t,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=t[0];
    b.onclick=()=>{if(seen.has(j))return;seen.add(j);b.classList.add('sel');
      const d=document.createElement('div');d.style.cssText='background:var(--soft);border-radius:12px;padding:10px 12px;margin:8px 0';
      d.innerHTML='<b>'+t[0]+'</b><div class="small" style="margin-top:4px">'+(t[1]?'<span style="color:var(--h3)">Partly</span>':'<span style="color:var(--no)">No</span>')+' · <b>Stat line:</b> '+t[2]+'</div><div class="small" style="margin-top:4px"><span style="color:var(--ok)">Yes</span> · <b>Gloria:</b> '+t[3]+'</div>';
      L.$('#rw').appendChild(d);
      if(seen.size===T.length){const q=L.$('#tq');q.innerHTML='<h2 class="sub">What did the side-by-side tell Jun?</h2>';
        L.mc(q,['Only a test mailing can show which one works','The winner is clear before a single mailer goes out'],1,
         'Like Jared and “7 Under 6”, the checklist predicts the winner. Jun can save the test budget for something truly uncertain.',
         'The book’s claim is that you can predict this one in advance. Gloria’s version wins on almost every trait.');}};
    L.$('#tr').appendChild(b);});}},

/* ---------- PART 2: SPOTTING ---------- */
{part:1,src:'Chapter 6 · Stories as Inspiration: The Tale of Jared',run(L){
  L.h(L.kick('learn','Spotting beats creating')+'<h1 class="q">Nobody at Subway invented Jared. Someone noticed him.</h1>'+
   L.prose('Jared is the hero of the weight-loss story. But the book says the heroes of the <i>idea</i> story are the people who passed it along. Look how many unusual moves it took:')+
   L.list([['eye','Someone spots it','A franchise owner took a magazine blurb seriously and sent it up the chain.'],
     ['flask','Someone invests','The creative director spent time and money on what could have been a wasted errand.'],
     ['flame','Someone gambles','The agency president shot the ad for free because he believed in it.'],
     ['cycle','Someone admits a mistake','The national office swallowed its pride and aired the ad it had turned down.']],2)+
   L.note('In the normal world, the franchise owner chuckles, pins the article to the bulletin board by the restroom, and that’s the end of it. Great ideas often die with someone in the middle. '+L.g('spotting','Spotting')+' is often easier, and more useful, than creating.','alert'));
  L.done();}},
{part:1,src:'Chapter 6 · Stories as Inspiration: The Tale of Jared',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">On a call, Gloria tells Marisol they took off their indoor coat for the first time in years. Which outcome is the one the Jared story warns about?</h1>');
  L.mc(L.card,['Marisol tells it at lunch, everyone smiles, and it stops there','Marisol sends it to Jun, who calls Gloria to hear more'],0,
   'That’s the bulletin board: enjoyed, then forgotten. The story only works if someone in the middle passes it on.',
   'Sending it to Jun is what the franchise owner did. The danger is the other one: a nice moment at lunch that goes nowhere.');}},
{part:1,src:'Chapter 6 · Stories as Inspiration: The Tale of Jared',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Link in the chain, or dead end?',['Passes it on','Dead end'],[
   ['Marisol prints Gloria’s thank-you note and pins it to the break-room board.',1,'The bulletin board is exactly where the book says great stories go to die.'],
   ['Jun visits Gloria, checks the two bills and asks if they’d share their story.',0,'Like the intern in Bloomington, Jun makes sure the story is real before betting on it.'],
   ['Rosa says, “We tried testimonials years ago,” and drops it.',1,'Like Subway’s marketing director: experience can make a leader wave off a winner.'],
   ['The video budget is spent, so Jun films Gloria on a phone anyway.',0,'Like the agency president shooting the ad for free: a small gamble that keeps the story alive.']]);}},

/* ---------- PART 3: THREE PLOTS ---------- */
{part:2,src:'Chapter 6 · The Art of Spotting',run(L){
  L.h(L.kick('learn','Three plots to look for')+'<h1 class="q">Know what you’re looking for, and stories become easier to spot</h1>'+
   L.prose('Ideas don’t flag themselves. Just as ad templates helped beginners make better ads (lesson 1), story templates make spotting easier. The authors sorted hundreds of inspiring stories and found three basic plots. Together they cover more than 80% of the original <i>Chicken Soup for the Soul</i> stories and more than 60% of <i>People</i> magazine’s stories about non-celebrities.')+
   L.tiers([['flame','Challenge','Someone overcomes obstacles that <b>seem daunting</b>: the underdog, rags to riches. Inspires courage and hard work.','David and Goliath'],
            ['people','Connection','People build a bond across a gap of race, class, religion or age. Inspires us to help, tolerate and work with others.','The Good Samaritan'],
            ['bulb','Creativity','Someone makes a breakthrough or attacks a problem in a new way. Inspires us to experiment.','Newton’s falling apple']]));
  L.done();}},
{part:2,src:'Chapter 6 · The Art of Spotting',run(L){
  L.h(L.kick('ex','Stories from the book')+'<h1 class="q">One story for each plot. Flip each card.</h1>');
  L.flips(L.card,[
   ['Challenge · Rose Blumkin','A Russian immigrant with no English and no schooling started a furniture store with $500 she’d saved. It grew to $100 million a year. At 100 she still worked seven days a week and moved her birthday party to a night the store was closed.'],
   ['Connection · The Good Samaritan','Robbers leave a man half dead. Two respected travelers pass by. A Samaritan, from a group hated by the man’s people, stops, bandages him and pays for his care. The point: be a neighbor even across a deep divide.'],
   ['Creativity · The Drag Test','A company team had a year to build a new grinder, a quarter of the usual time. Plastic or metal casing? Instead of long lab studies, they tied both to a rental car’s bumper and dragged them around a parking lot until the police stopped them. Plastic held up. Decision made.'],
   ['Creativity · Shackleton’s tent','On a dangerous expedition, the explorer Ernest Shackleton feared complainers could spark a mutiny. His fix: they slept in his own tent and worked in his group, so his presence kept them in check.']],
   'Notice the Drag Test isn’t melodramatic. You don’t need tearjerkers, just stories that fit a plot.');}},
{part:2,src:'Chapter 6 · The Challenge Plot',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Which of these Kestrel moments is a Challenge plot?</h1>');
  L.mc(L.card,['A crew re-caulks one window on a mild spring afternoon','A two-person crew insulates a whole house in a blizzard week','A crew finishes a routine job half an hour early'],1,
   'The key to a Challenge plot is obstacles that seem daunting. Two people, a whole house, a blizzard.',
   'Those are fine days at work, but nothing looks daunting. A Challenge plot needs real odds, like the blizzard job.');}},
{part:2,src:'Chapter 6 · The Art of Spotting',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which plot is it?',['Challenge','Connection','Creativity'],[
   ['When the smoke pencil broke, Dana’s crew found the draft with a child’s bubble wand.',2,'A new way to solve a problem on the spot, like the Drag Test.'],
   ['A 19-year-old installer and an 88-year-old homeowner now swap letters every month.',1,'A bond across a big age gap.'],
   ['A crew drove through an ice storm to get heat back on at a family shelter.',0,'Daunting odds, and they pushed through.'],
   ['Theo cut a week of heat-loss math to an hour with a cheap thermal camera.',2,'A breakthrough in how the work gets done.'],
   ['Marisol, who speaks Spanish, stayed on the line until a frightened caller’s grandson arrived.',1,'Someone crossing a language gap to help a stranger.']]);}},
{part:2,src:'Chapter 6 · The Connection Plot',run(L){
  L.h(L.kick('learn','Match the plot to the goal')+'<h1 class="q">Each plot inspires a different kind of action</h1>'+
   L.prose('The point of the plots isn’t to invent stories. It’s to recognize, fast, what a story will do to the people who hear it, and whether that’s what you want.')+
   L.flow([['flame','Challenge','Work harder, take on the hard thing','project kickoff',3],['people','Connection','Help, include and work with others','holiday party',2],['bulb','Creativity','Try new approaches','changing how people work',1]],false)+
   L.prose('The book’s examples: tell a Connection story at the company holiday party and a Challenge story at a project kickoff. If you’re trying to change a culture like the grinder team, watch for Creativity plots. And a general lining up troops before battle shouldn’t tell a Connection story.')+
   L.note('You don’t have to exaggerate or be melodramatic. You just have to notice when life hands you a good story.','eye'));
  L.done();}},
{part:2,src:'Chapter 6 · The Creativity Plot',pts:5,run(L){
  L.h(L.kick('pr','Which plot should they look for?')+'<h1 class="q">Each Kestrel leader needs a story for a different goal. Sort each goal by the plot that fits it.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Challenge','Connection','Creativity'],[
   ['Rosa kicks off the hard Eastgate push: 220 rowhouses before winter',0,'A big, daunting job. A Challenge story makes crews want to rise to it.'],
   ['Kestrel’s end-of-year party, where crews meet office staff they rarely see',1,'A social occasion. A Connection story brings people together.'],
   ['Dana wants crews to stop doing air sealing “the way we always have”',2,'Changing how work is done calls for a Creativity story.'],
   ['Marisol wants new care staff to be patient with callers unlike themselves',1,'Bridging gaps between people is the Connection plot’s job.'],
   ['Theo wants engineers to test ideas quickly instead of writing long studies',2,'That’s the grinder team’s goal. Look for a Drag Test of your own.']],
   'First know what you want people to do. Then you know which plot to keep your eyes open for.');}},

/* ---------- PART 4: SPRINGBOARDS ---------- */
{part:3,src:'Chapter 6 · Stories at the World Bank',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">Ten minutes to sell an idea nobody wanted</h1>');
  L.beats(L.card,[
   ['The demotion','In 1996 Stephen Denning ran the World Bank’s work in Africa. After his mentors left, he was moved to “information”: knowledge management at a bank that cared about money, not knowledge.'],
   ['The problem','The bank knew a lot about what works in poor countries, but that know-how was scattered across projects. An expert in Zambia had no way to help an expert in Bangladesh.'],
   ['The anecdote','A colleague back from Zambia told him about a health worker in a small town who needed help fighting malaria. He got online and found answers on a US government health website. In 1996, that was rare.'],
   ['The talk','Denning got 10 to 12 minutes with senior managers. He set up the problem. Then, instead of theory and expert quotes, he told the Zambia story: the worker found what he needed, but it should have come from the bank.'],
   ['The result','Two executives rushed up with advice on what he should be doing. First he felt they’d stolen his idea; then he saw it had become <i>their</i> idea. By year’s end, the bank’s president made knowledge management a top priority.']],
   'Denning later called this a springboard story.');}},
{part:3,src:'Chapter 6 · Stories at the World Bank',run(L){
  L.h(L.kick('learn','How a springboard story works')+'<h1 class="q">Don’t fight the little voice. Give it a job.</h1>'+
   L.prose('A '+L.g('springboard','springboard story')+' lets people see how a problem they already have might change. Denning first distrusted stories: why not just say the point directly? But a direct argument invites a fight.')+
   L.lanes([['scale','An argument','Asks listeners to judge it. Their '+L.g('little-voice','little voice')+' debates, criticizes and argues back, at least in their heads.',4],
            ['play','A springboard story','Gives the little voice something to do. Listeners start solving the problem, and each lands on their own version of the idea.',2]])+
   L.prose('Stories with a visible goal and a barrier push people into problem-solving mode. A springboard goes further: listeners problem-solve <b>for themselves</b>. That’s why it beats skepticism and gets people to act.'));
  L.done();}},
{part:3,src:'Chapter 6 · Stories at the World Bank',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Why did the World Bank executives start pitching Denning ideas right after his talk?</h1>');
  L.mc(L.card,['He quoted top experts on why knowledge management matters','The story let them picture the fix, so they started solving it','He explained the theory of knowledge management step by step'],1,
   'The story moved them from judging into problem-solving, so the idea became theirs.',
   'Expert quotes and theory are exactly what Denning skipped. They invite judging. The story invited the executives to solve the problem themselves.');}},
{part:3,src:'Chapter 6 · Stories at the World Bank',pts:1,
 solve:async L=>{L.$('#ma').click();L.$('#mb').click();},
 run(L){
  const M=[['Argue the case','“Our model shows the 600 homes would cut heating use by about a third. Here are the figures behind it.”','Whose model? Our winters? Every vendor says that.'],
           ['Tell a springboard story','“The Nwosu family rents a duplex where frost formed inside the kids’ bedroom windows. A Kestrel tech showed them how to seal the windows in an afternoon. That night, no frost.”','How many rentals like that are in my ward? Could we get the landlords near the school in first?']];
  const seen=new Set();
  L.h(L.kick('pr','Toggle and compare')+'<h1 class="q">Theo has two minutes with Councilmember Brandt about the grant. Try both openings and listen to Brandt’s little voice.</h1>'+
   '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="chip" id="ma">'+L.ic('scale')+M[0][0]+'</button><button class="chip" id="mb">'+L.ic('play')+M[1][0]+'</button></div>'+
   '<div id="mp" style="background:var(--soft);border-radius:16px;padding:14px;margin:10px 0;min-height:110px"><div class="small">Pick an opening above.</div></div><div id="mq"></div>');
  const show=j=>{seen.add(j);L.$('#ma').classList.toggle('sel',j===0);L.$('#mb').classList.toggle('sel',j===1);
    L.$('#mp').innerHTML='<div class="small"><b>Theo says</b></div><p class="prose" style="margin:4px 0 10px">'+M[j][1]+'</p><div class="small"><b>Brandt’s little voice</b></div><p class="prose" style="margin:4px 0 0;color:'+(j?'var(--ok)':'var(--no)')+'">'+L.ic(j?'bulb':'x')+' '+M[j][2]+'</p>';
    if(seen.size===2&&!L.$('#mq').innerHTML){const q=L.$('#mq');q.innerHTML='<h2 class="sub">Like Denning, what is Theo hoping the story does?</h2>';
      L.mc(q,['Gets Brandt to agree that every figure is correct','Gets Brandt treating the plan as their own idea'],1,
       'Brandt is already planning which landlords to bring in. The idea is becoming Brandt’s, just as Denning’s became the executives’.',
       'The figures are what Brandt’s little voice was attacking. The story moves Brandt from checking numbers to solving the problem themselves.');}};
  L.$('#ma').onclick=()=>show(0);L.$('#mb').onclick=()=>show(1);}},
{part:3,src:'Chapter 6 · The Conference Storybook',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">The conference summary that made the speakers furious</h1>');
  L.beats(L.card,[
   ['The job','A conference organizer asked Gary Klein’s firm (the source of the nurse story) to sum up the conference: shorter than a transcript, clearer than a pile of slides.'],
   ['The method','One person sat in on each of the five parallel tracks and wrote down every story a speaker told. The result was funny, tragic and exciting.'],
   ['The organizer','Thrilled. It was far more vivid and useful than the usual dry abstracts. She asked for money to turn it into a book, and sent the notes to the speakers.'],
   ['The speakers','Furious. They didn’t want to be remembered for anecdotes. Their abstracts held their real lessons: advice like keeping communication open and acting before problems grow.'],
   ['The end','The speakers wouldn’t budge, and the project was dropped.']],
   'The book sides with Klein: keep the stories, because the morals were nearly empty without them.');}},
{part:3,src:'Chapter 6 · The Conference Storybook',run(L){
  L.h(L.kick('learn','Why the stories were the real lesson')+'<h1 class="q">The speakers were tapping a tune only they could hear</h1>'+
   L.list([['layers','You can’t hand over the whole building','A 90-minute talk can’t pass on years of experience. The best you can do is pass on a few building blocks, and a slogan is a block pulled from the roof.'],
     ['x','The morals were common sense','Nobody wants to close communication or wait while problems grow. Sticky messages need uncommon sense.'],
     ['alert','Curse of Knowledge','Each speaker heard the struggles behind “keep communication open”. The audience heard a platitude.']],4)+
   L.prose('Stories nearly beat the '+L.g('curse','Curse of Knowledge')+' alone: they’re almost always concrete, and usually emotional and unexpected. The hardest part is <b>Simple</b>: the story has to carry your '+L.g('core','core')+', not just be a great story.'));
  L.done();}},
{part:3,src:'Chapter 6 · The Conference Storybook',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">After the crew leads’ winter retreat, Dana is writing the summary for every crew. Tap each piece until the sentence says what to put at its heart.</h1>');
  L.sentence(L.card,[['The leads’ slogans','The leads’ stories'],['because they show how a lesson played out on a real job,','because they sum up years of work in a few words,'],['so crews can file them away for later.','so crews can rehearse them before it happens.']],[1,0,1],
   [['Slogans like “respect the home” are common sense. Crews already agree, and nothing changes.'],['A few words are exactly what loses the lesson. The story carries what the slogan leaves out.'],['Filing away is the bulletin-board fate. The point is to let crews simulate the job.']],
   'Like Klein’s storybook: keep the gift-wrapping story, drop the punch-line slide. The moral comes along with the story.');}},
{part:3,src:'Chapter 6 · The Conference Storybook',pts:1,run(L){
  L.h(L.kick('pr','Does it carry the core?')+'<h1 class="q">Jun wants one customer story for the front of the winter mailer. Kestrel’s core is “warm homes on smaller winter bills.” Which story should Jun use?</h1><div id="hq"></div>');
  L.mc(L.$('#hq'),['The crew that found a raccoon living in a customer’s attic','The crew lead who fixed a customer’s porch step for free','Gloria taking off their indoor coat as the bill fell by half'],2,
   'It’s concrete, emotional and, for heat pumps, unexpected. Most of all, it carries the core: a warm home and a smaller bill.',
   'Those are good stories, but they say nothing about warm homes or smaller bills. The hardest part of a story is making it carry your core.');}}
  ]
});
</script>
</body>
</html>
