<script>
Course.lesson({
  id:'0007', title:'Concrete goals teams can share', minutes:19, icon:'people',
  goals:['Spot when an expert has drifted into “blueprint talk” and pull the message down to the level everyone shares','Turn a vague goal into a concrete target a whole team can line up behind','Use a prop or a real person to give a room something to think with'],
  parts:['Blueprints','Shared goals','Shared turf','Real people'],
  read:'Read the second half of chapter 3, “Concrete,” for the full Boeing, Jerry Kaplan, Hamburger Helper and Saddleback Sam stories.',
  glossary:{
    'blueprint':'Blueprint vs. machine: experts think in abstract patterns (the blueprint); everyone else thinks in the physical thing (the machine). Problems get solved faster at the level everyone understands.',
    'turf':'Concrete turf: a shared, physical or specific thing (a prop, a target, a person) that lets a group point at the same problem and bring what they know to it.'
  },
  cheatsheet:[
    'Experts see details as patterns, so they drift up to the <b>blueprint</b>. Everyone else lives at the <b>machine</b>. Meet them there.',
    'The fix isn’t to “dumb it down.” It’s to find the shared, concrete language everyone speaks fluently.',
    '<b>Concrete goals coordinate.</b> “Seat 131, fly Miami to New York nonstop, land on Runway 4-22” beats “the best plane in the world.”',
    'Even experts read an abstract goal in different ways. Make the target concrete and they pull in one direction.',
    'Concrete focuses the brain: “white things in your fridge” is as easy to fill as “white things.”',
    'A prop (Kaplan’s portfolio, Grant’s salt-and-sugar packet) gives the room a <b>concrete turf</b>, and turns critics into collaborators.',
    'Guide decisions by <b>specific people</b>: home visits beat data binders; a detailed “Saddleback Sam” lets hundreds of volunteers aim at the same person.',
    'Concrete is perhaps the easiest trait to use. The only barrier is forgetting that others don’t know what we know.'
  ],
  steps:[
/* ---------- PART 1: BLUEPRINTS ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">An installer calls Theo from an attic: a vent pipe sits right where the plan says the new insulation goes. What would help the installer most?</h1>');
  L.mc(L.card,['Theo emails a more detailed drawing of the attic','Theo climbs up and points at what to move','Theo explains the heat-loss math behind the plan'],1,
   'The installer’s problem is a pipe in a real attic. Talking about that pipe, in that attic, is the fastest fix. This lesson is about why experts so often reach for the drawing instead.',
   'A better drawing or more math keeps the talk up at the expert’s level. The installer is looking at a real pipe. Meeting them there, in the attic, solves it fastest.');}},
{part:0,src:'Chapter 3 · The Path to Abstraction: The Blueprint and the Machine',run(L){
  L.h(L.kick('learn','Why experts drift upward')+'<h1 class="q">Expertise is the ability to think abstractly, and that’s the trap</h1>'+
   L.prose('If '+L.g('concrete','concrete')+' ideas are so powerful, why do we slip into abstraction so easily? Because that is what makes someone an expert. A new juror notices the lawyer’s tie. A judge compares the case to past rulings.')+
   L.flow([['eye','Novice','Sees details as details','“The bishop moves diagonally.”',1],['layers','Expert','Sees details as patterns','“Control the center.”',3]])+
   L.prose('Because experts <i>see</i> the higher level, they want to <i>talk</i> at the higher level. This is the '+L.g('curse','Curse of Knowledge')+' again: they forget what it’s like to see only the details.'));
  L.done();}},
{part:0,src:'Chapter 3 · The Path to Abstraction: The Blueprint and the Machine',run(L){
  L.h(L.kick('ex','A real study from the book')+'<h1 class="q">Engineers who kept fixing the drawings</h1>');
  L.beats(L.card,[
   ['The firm','A researcher, Beth Bechky, studied a company that built complex machines for making silicon chips. It needed two groups: engineers who designed, and manufacturing people who built.'],
   ['The problem','When a part didn’t fit on the factory floor, the builders brought it to the engineers. The engineers got to work… on their <b>drawings</b>.'],
   ['It got worse','The drawings grew more elaborate and more abstract, which made communication even harder. Like a tourist speaking English louder and slower abroad.'],
   ['What the builders wanted','Come down to the floor and show me where the part goes.'],
   ['The fix','Not “meet in the middle.” The <b>engineers</b> had to change, because everyone understood the physical machine fluently. Solve problems at the level of the machine.']],
   'This isn’t about dumbing things down; the builders faced hard problems. It’s about finding the shared language everyone speaks fluently. That language is almost always concrete.');}},
{part:0,src:'Chapter 3 · The Path to Abstraction: The Blueprint and the Machine',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">In Bechky’s study, who needed to change for the two groups to work well together?</h1>');
  L.mc(L.card,['Both groups, each meeting the other halfway','The builders, by learning to read the drawings','The engineers, by working at the machine itself'],2,
   'Everyone understood the machine. So the engineers, the ones with the Curse of Knowledge, had to come down to that level.',
   'The book says meeting halfway isn’t the answer, and the builders didn’t need more drawings. The machine was the language everyone already spoke, so the engineers had to move.');}},
{part:0,src:'Chapter 3 · The Path to Abstraction: The Blueprint and the Machine',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Blueprint or machine?',['Blueprint talk','Machine talk'],[
   ['Theo tells a new installer: “Reduce the air-change rate at the top plate.”',0,'Accurate, but abstract. The installer needs to know which gap to fill, where.'],
   ['Dana shows a new installer the gap above a wall where warm air escapes into the attic, and hands them the foam.',1,'A real gap, a real tool. Everyone understands this level.'],
   ['A crew lead says a duct won’t fit. Theo updates the spec sheet and adds three footnotes.',0,'That’s Bechky’s engineers again: fixing the drawing instead of looking at the problem.'],
   ['Theo meets the crew in the basement and points at where the duct should run.',1,'Theo went down to the factory floor. Problem solved at the level everyone shares.'],
   ['Rosa tells crews the new plan “optimizes our install workflow.”',0,'Nobody can picture what changes on Monday. That’s the blueprint level.']]);}},

/* ---------- PART 2: SHARED GOALS ---------- */
{part:1,src:'Chapter 3 · Concrete Allows Coordination',run(L){
  L.h(L.kick('learn','Concrete targets line people up')+'<h1 class="q">Even experts need to see the same target</h1>'+
   L.prose('Recall the pocketable radio and the man on the moon. They were unexpected, but they were also <b>concrete</b>. Nobody at NASA argued about what “moon” meant.')+
   L.prose('Abstract goals split even smart people with the same training. The book imagines a start-up aiming for “the next great search engine,” with two programmers side by side:')+
   L.lanes([['person','Programmer A','“Great” means <b>complete</b>: find everything relevant, however obscure.',1],
            ['person','Programmer B','“Great” means <b>fast</b>: pretty good results, very quickly.',3]])+
   '<p class="prose" style="margin-top:14px">Same goal, two different jobs. They won’t pull together until the goal is made concrete.</p>');
  L.done();}},
{part:1,src:'Chapter 3 · Concrete Allows Coordination',run(L){
  L.h(L.kick('ex','A real story from the book')+'<h1 class="q">How Boeing aimed thousands of experts at one plane</h1>');
  L.beats(L.card,[
   ['The 1960s','Boeing starts designing the 727 passenger jet. Thousands of engineers and builders will work on it.'],
   ['The easy goal','“Build the best passenger plane in the world.” Inspiring, and almost useless. Best at what?'],
   ['The goal they set','It must seat <b>131 passengers</b>, fly <b>nonstop from Miami to New York City</b>, and land on <b>Runway 4-22 at La Guardia</b>.'],
   ['Why that runway','Runway 4-22 was less than a mile long, much too short for any passenger jet of the time. So that one detail made the challenge both hard and crystal clear.'],
   ['The effect','Every specialist knew exactly what “done” looked like, so their work fit together.']],
   'A concrete goal makes the target visible to everyone. Each expert can check their own work against it.');}},
{part:1,src:'Chapter 3 · Concrete Allows Coordination',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Dana wants all 12 crews to treat customers’ homes the same careful way. Which goal will line them up best?</h1>');
  L.mc(L.card,['Deliver a premium, respectful on-site experience','Leave every floor as clean as you found it, with no footprints','Uphold Kestrel’s high standards in every home'],1,
   'Every crew can picture it and check it at the door on the way out. That’s a target, not a slogan.',
   '“Premium” and “high standards” mean different things to different crews, like the two programmers. A clean floor with no footprints is something everyone can see.');}},
{part:1,src:'Chapter 3 · Concrete Allows Coordination',pts:1,
 solve:async L=>{const g=L.$('#gs').children;g[0].click();g[1].click();},
 run(L){
  const G=['“Lead our city’s customer-centric energy transformation.”','“By next winter, one crew seals and insulates a typical 1920s house in a single day, and the family sleeps warm that night.”'];
  const R=[[['Theo','Builds a 40-slide model of citywide energy savings.'],['Jun','Plans a campaign about “the energy future.”'],['Dana','Not sure what changes, so crews keep working as before.']],
           [['Theo','Times each attic step to find the slowest one.'],['Jun','Plans a mailer: “Drafty at breakfast. Warm by bedtime.”'],['Dana','Drills crews on a one-day attic routine.']]];
  const seen=new Set();
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Rosa gives the team a goal for next year. Try both versions and watch what each person does with it.</h1><div id="gs"></div>'+
   '<div id="gr" style="background:var(--soft);border-radius:16px;padding:14px;margin:8px 0 6px;min-height:120px"><div class="small">Choose a goal above.</div></div><div id="gq"></div>');
  G.forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.style.whiteSpace='normal';b.style.textAlign='left';b.innerHTML=L.ic(j?'target':'cycle')+(j?'Goal B':'Goal A');b.onclick=()=>{[...L.$('#gs').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(j);
    L.$('#gr').innerHTML='<p class="prose" style="margin:0 0 10px"><i>'+n+'</i></p>'+R[j].map(r=>'<div class="small" style="margin:6px 0"><b>'+r[0]+':</b> <span style="color:var(--'+(j?'ok':'no')+')">'+r[1]+'</span></div>').join('');
    if(seen.size===2&&!L.$('#gq').innerHTML){const q=L.$('#gq');q.innerHTML='<h2 class="sub">Why did Goal B line everyone up?</h2>';
      L.mc(q,['It gave each team a bigger budget to work with','It came from the CEO, so people took it seriously','Everyone could picture the same finish line'],2,
       'Like Boeing’s runway, the one-day house gave Theo, Jun and Dana the same target, so their work fit together.',
       'Both goals came from Rosa, and neither mentioned money. The difference is that Goal B is concrete: everyone pictured the same house on the same day.');}};L.$('#gs').appendChild(b);});}},
{part:1,src:'Chapter 3 · Concrete Allows Coordination',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Jun wants every Home Energy Check to end the same way. Tap each piece until the goal is concrete enough for all the technicians to share.</h1>');
  L.sentence(L.card,[['Leave the homeowner with','Provide value to the homeowner through'],['a holistic picture of their energy use','their three biggest leaks, marked with tape'],['in an efficient timeframe','before the 90 minutes are up']],[0,1,1],
   [['“Provide value” is filler. Say what the homeowner actually holds when the technician leaves.'],['A “holistic picture” means something different to every technician. What exactly do they see?'],['“Efficient” to whom? Name the actual limit.']],
   'Every technician can picture it, and every homeowner can check it: three pieces of tape, one finished visit.');}},

/* ---------- PART 3: SHARED TURF ---------- */
{part:2,src:'Chapter 3 · Concrete Brings Knowledge to Bear: White Things',
 solve:async L=>{L.$('#rv').click();},
 run(L){
  L.h(L.kick('learn','Concrete focuses the brain')+'<h1 class="q">A 15-second experiment you can do in your head</h1>'+
   L.flow([['list','Step 1','List as many <b>white things</b> as you can.','15 seconds',1],['home','Step 2','List as many <b>white things in your fridge</b> as you can.','15 seconds',2]])+
   L.prose('Try both now. Which list was easier to fill?')+
   '<button class="btn" id="rv">'+L.ic('eye')+'Show what most people find</button><div id="ro"></div>');
  L.$('#rv').onclick=function(){this.remove();L.$('#ro').innerHTML=L.note('Most people list about as many white things from their fridge as white things from the whole universe, and many find the fridge <i>easier</i>. A concrete frame gives the brain somewhere to start. “Five silly things your child did” works the same way.','bulb');L.done();};}},
{part:2,src:'Chapter 3 · Kaplan and Go Computers',run(L){
  L.h(L.kick('ex','A real story from the book')+'<h1 class="q">The leather folder that won a $4.5 million investment</h1>');
  L.beats(L.card,[
   ['1987','Jerry Kaplan, 29, gets a meeting at Kleiner Perkins, the most famous venture firm in Silicon Valley. He thinks it’s a casual chat.'],
   ['The panic','The founder before him has a suit, color charts and a hard grilling. Kaplan has a sport jacket and a maroon folder with a blank pad. No plan, no slides, no prototype.'],
   ['The pitch','He describes a pen-operated computer, more notebook than typewriter, for professionals away from their desks.'],
   ['The gamble','Feeling he has nothing to lose, he tosses the folder onto the table: this is a model of the future of computing.'],
   ['The shift','A partner reaches out and touches it, then asks how much it could store. Another answers. Soon the partners are trading questions and ideas, and Kaplan barely needs to talk.'],
   ['The result','Days later, they back him. The investment values his not-yet-existing company at $4.5 million.']],
   'The folder turned a grilling into a brainstorm. It gave experts a '+L.g('turf','concrete turf')+': one shared object to aim their knowledge at, like “white things in your fridge.”');}},
{part:2,src:'Chapter 3 · Clinic: Oral Rehydration Therapy Saves Children’s Lives!',run(L){
  L.h(L.kick('ex','Idea Clinic: before and after')+'<h1 class="q">More than a million children a year die of dehydration from diarrhea. The fix is cheap. How do you get leaders to act?</h1>'+
   L.lanes([['book','Message 1','A health charity’s web page. It explains how fluid loss shuts down organs, how fast death can come, and why a blend of salts, sugar and water works best. Accurate and scientific.',4],
            ['bowl','Message 2','James Grant, long-time head of UNICEF, carried a packet of salt and sugar. Meeting a prime minister, he’d hold it up: this costs less than a cup of tea, and it could save hundreds of thousands of children in your country.',2]])+
   L.note('Ask yourself after each one: <i>what would I do tomorrow?</i> Message 1 makes the problem sound complex. Message 2 has you brainstorming: packets for schools, teaching mothers the mix. Grant skipped the statistics, but as UNICEF’s head his facts weren’t in doubt.','info')+
   '<p class="small" style="margin-top:10px">The packet did what Kaplan’s folder did: it invited the audience to the table.</p>');
  L.done();}},
{part:2,src:'Chapter 3 · Clinic: Oral Rehydration Therapy Saves Children’s Lives!',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">What did Grant’s salt-and-sugar packet and Kaplan’s folder have in common?</h1>');
  L.mc(L.card,['Each gave the audience a concrete thing to think with','Each replaced weak facts with a strong emotion','Each was carefully rehearsed in advance'],0,
   'A physical object put everyone on the same turf, so experts started applying what they knew instead of judging.',
   'Kaplan’s toss was a last-minute gamble, and Grant’s facts were never in doubt. What they shared was a concrete object that got the audience brainstorming.');}},
{part:2,src:'Chapter 3 · Kaplan and Go Computers',pts:1,
 solve:async L=>{const g=L.$('#tv').children;g[0].click();g[1].click();},
 run(L){
  const V=[['Slides','Theo shows 22 slides of heat-loss data from last winter’s jobs.',[['Crew lead 1','“How long will all this take us?”'],['Crew lead 2','Checks phone.'],['Crew lead 3','“What exactly do you want us to change?”']],'no'],
           ['Hatch','Theo drops an old attic hatch cover on the table. Light shows all around its edges.',[['Crew lead 1','“Foam tape on the frame, ten minutes.”'],['Crew lead 2','“Add a latch so it pulls tight.”'],['Crew lead 3','“We pass forty of these a month. Let’s fix every one.”']],'ok']];
  const seen=new Set();
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Theo wants the crew leads’ ideas for cutting attic heat loss. Try both openings and watch the room.</h1><div id="tv"></div>'+
   '<div id="tr" style="background:var(--soft);border-radius:16px;padding:14px;margin:8px 0 6px;min-height:130px"><div class="small">Choose an opening above.</div></div><div id="tq"></div>');
  V.forEach((v,j)=>{const b=document.createElement('button');b.className='chip';b.innerHTML=L.ic(j?'box':'list')+v[0];b.onclick=()=>{[...L.$('#tv').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(j);
    L.$('#tr').innerHTML='<p class="prose" style="margin:0 0 10px">'+v[1]+'</p>'+v[2].map(r=>'<div class="small" style="margin:6px 0"><b>'+r[0]+':</b> <span style="color:var(--'+v[3]+')">'+r[1]+'</span></div>').join('');
    if(seen.size===2&&!L.$('#tq').innerHTML){const q=L.$('#tq');q.innerHTML='<h2 class="sub">What did the hatch cover change?</h2>';
      L.mc(q,['It proved Theo’s data was correct','It made the meeting shorter and calmer','It gave the crew leads a shared problem to solve'],2,
       'Like Kaplan’s folder, the hatch turned the crew leads from listeners into problem-solvers. They brought their own know-how to one concrete thing.',
       'The hatch didn’t prove any data, and the meeting got livelier, not calmer. It gave everyone the same concrete turf to work on.');}};L.$('#tv').appendChild(b);});}},
{part:2,src:'Chapter 3 · Concrete Brings Knowledge to Bear: White Things',pts:5,run(L){
  L.h(L.kick('pr','Turf or fog?')+'<h1 class="q">Kestrel’s people are about to open a meeting. Sort each opener.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Gives a shared turf','Stays abstract'],[
   ['Jun passes around last year’s mailer and asks: “Where would you stop reading?”',0,'A real mailer in everyone’s hands. People can point at the exact spot.'],
   ['Rosa opens with “Let’s align on our engagement strategy.”',1,'Nobody knows what to look at or what to say first.'],
   ['Dana sets a cracked, frost-covered window sash on the table: “This came out of a customer’s house.”',0,'One object, and the whole room starts thinking about drafts.'],
   ['Theo opens by asking for “thoughts on our efficiency roadmap.”',1,'An abstract request gets polite nods, not ideas.'],
   ['Marisol plays a 30-second customer voicemail about a cold nursery.',0,'A specific voice and a specific room: something concrete to react to.']],
   'A prop, a real document or a real voice gives a room something to think <i>with</i>, the same way “your fridge” narrows “white things.”');}},

/* ---------- PART 4: REAL PEOPLE ---------- */
{part:3,src:'Chapter 3 · Making Ideas Concrete',run(L){
  L.h(L.kick('learn','Think of specific people')+'<h1 class="q">Decisions get easier when you picture who they’re for</h1>'+
   L.prose('How do you make your own messages concrete? The book’s answer: let decisions be guided by the needs of <b>specific people</b>, your readers, students or customers, rather than averages in a report.')+
   L.flow([['list','Data binder','Ages, incomes, survey scores','easy to file, hard to use',4],['person','A real person','A parent cooking with a toddler on one hip','easy to picture, easy to consult',2]])+
   L.prose('The next two stories show it working at a giant food company and at a church of 50,000 members.'));
  L.done();}},
{part:3,src:'Chapter 3 · Making Ideas Concrete',run(L){
  L.h(L.kick('ex','A real story from the book')+'<h1 class="q">From “death binders” to a mother at the stove</h1>');
  L.beats(L.card,[
   ['2004','Melissa Studzinski, 28, becomes brand manager of Hamburger Helper at General Mills. The brand has slumped for a decade, and the CEO wants it fixed.'],
   ['The binders','She’s handed three huge binders of sales data and market research. Too heavy to lift, let alone remember. She calls them the “death binders.”'],
   ['The visits','The team sets the data aside and visits two to three dozen customers’ homes to watch them cook. One mother mixes dinner with a toddler on her hip.'],
   ['The insight','Families want <b>predictability</b>. Kids care about flavor, not the 11 pasta shapes. Moms struggle to find their favorite among 30-plus flavors, and see new ones as risky.'],
   ['The result','With those concrete pictures, the team persuades groups from supply chain to finance to simplify the product line. Sales rise 11% by the end of fiscal 2005.'],
   ['Afterwards','Facing a decision, she now asks what the women she met would do in her place.']],
   'She had memorized the data, yet seeing one real family changed her decisions. Specific people are easier to think with than statistics about people.');}},
{part:3,src:'Chapter 3 · Making Ideas Concrete',run(L){
  L.h(L.kick('ex','A second story')+'<h1 class="q">One imaginary man who guides a whole church. Tap each card.</h1>');
  L.flips(L.card,[
   ['Who is Saddleback Sam?','The Saddleback Church in California sketched the typical local man it wanted to reach: late thirties or early forties, college-educated, married with two kids, likes his job, wary of “organized” religion. They even know his tastes.'],
   ['A tempting idea','Someone proposes telemarketing to locals. It sounds promising, but the research says Sam hates telemarketers. Idea scratched.'],
   ['Hundreds of ministries','Volunteers run hundreds of small programs with no daily direction from staff. They still pull together, because nearly every member can describe Sam.']],
   'A detailed, concrete person works like Boeing’s runway: everyone checks their choices against the same target. The church grew past 50,000 members.');}},
{part:3,src:'Chapter 3 · Making Ideas Concrete',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Jun has a spreadsheet of who books a Home Energy Check: ages, zip codes, home sizes. The mailer still isn’t working. What does this chapter suggest next?</h1>');
  L.mc(L.card,['Add more columns so the data is complete','Visit a few homes and watch people decide','Survey every customer with a longer form'],1,
   'That’s Studzinski’s move: the data was there, but seeing real people at home is what changed her decisions.',
   'More data is more binder. The book’s lesson is to see specific people, as the Hamburger Helper team did in customers’ kitchens.');}},
{part:3,src:'Chapter 3 · Making Ideas Concrete',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Would the Nwosus go for it?',['Keep the idea','Scratch the idea'],[
   ['Jun makes the Nwosu family Kestrel’s “Sam”: young parents <b>renting</b> a drafty duplex, kids’ bedroom always cold, frost inside the windows, both parents working day shifts. First idea: offer checks only on weekday mornings.',1,'Both parents work days. Weekday mornings shut them out. Scratch it.'],
   ['Open the renters’ mailer with a photo of frost on the inside of a bedroom window.',0,'That’s their life, exactly. They’ll recognize it at a glance.'],
   ['Lead with a heat-pump install that needs the owner’s sign-off.',1,'They rent, so they can’t say yes. Like Sam and telemarketing: scratch it.'],
   ['Show how a Kestrel tech taught a renter to block a door draft for free.',0,'Something they can do themselves, today, without asking a landlord.'],
   ['Open with the heat pump’s “coefficient of performance.”',1,'Blueprint talk. The Nwosus care about a warm bedroom, not the spec.']]);}},
{part:3,src:'Chapter 3 · Making Ideas Concrete',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Mixed review: which concrete move?',['Go down to the machine','Set a concrete goal','Give the room a turf','Picture a specific person'],[
   ['Theo’s explainer for crews says “minimize thermal bridging.” Dana suggests Theo show them the actual cold spot on a wall with a thermal camera.',0,'From the drawing to the real wall: the level everyone shares.'],
   ['Rosa’s target “be the region’s energy leader” becomes “every Home Energy Check booked within 48 hours of the call.”',1,'Now every team can see the finish line and check against it.'],
   ['Before asking the board for ideas, Jun puts a frost-covered window sash in the middle of the table.',2,'An object everyone can aim their knowledge at, like Kaplan’s folder.'],
   ['Marisol asks the team, before each mailer goes out: “Would the Nwosus open this?”',3,'One specific person to check choices against, like Saddleback Sam.'],
   ['Dana stops explaining the attic rule on a whiteboard and walks new hires across real beams.',0,'Problem solved at the level of the machine, not the blueprint.']]);}}
  ]
});
</script>
</body>
</html>
