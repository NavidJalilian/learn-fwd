<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Make People Care: Appeal to Identity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0011', title:'Make people care: appeal to identity', minutes:19, icon:'person',
  goals:['Tell a self-interest appeal from an identity appeal, and know when each backfires','Move a “why should I care?” answer out of Maslow’s basement','Use “Why?” and one particular person to beat the Curse of Knowledge'],
  parts:['Two ways to decide','Out of the basement','Don’t Mess with Texas','Why, and the particular'],
  read:'Read the second half of chapter 5 for the full Texas campaign, the three algebra answers and the duo-piano exchange.',
  glossary:{
    'identity-model':'Identity model: deciding by asking three questions: Who am I? What kind of situation is this? What do people like me do here? No weighing of costs and benefits.',
    'consequence-model':'Consequence model: deciding by weighing each option’s costs and benefits and picking the one that gives you the most.',
    'group-interest':'Group interest: asking “what’s in it for my group?” rather than “what’s in it for me?”',
    'three-whys':'Three Whys: asking “Why does this matter?” again and again until you move from what you do to why you do it.'
  },
  cheatsheet:[
    'Self-interest works, but it’s <b>one color on the palette</b>. Used in the wrong place it insults people (the firefighters’ popcorn popper).',
    'People often decide by <b>identity</b>: Who am I? What kind of situation is this? What do people like me do here?',
    'Opinions follow <b>group interest</b> more than narrow self-interest. Self-interest matters most when effects are big, tangible and immediate.',
    'Stay out of <b>Maslow’s basement</b>: algebra as “mental weight training” beats “you need it for your diploma.”',
    'Show people that <b>people like them</b> act this way (“Texans don’t litter”). The slogan isn’t the idea; the identity is.',
    'The messenger matters only if they <b>stand for the identity</b>. An authority figure lecturing can backfire.',
    'Beat the Curse of Knowledge with <b>Three Whys</b>: move from <i>what</i> you do to <i>why</i> it matters.',
    'Empathy comes from <b>the particular, not the pattern</b>: show one person’s experience, not a problem list.'
  ],
  steps:[
/* ---------- PART 1: TWO WAYS TO DECIDE ---------- */
{part:0,src:'Warm-up',pts:1,
 solve:async L=>{L.$('#po').children[2].click();L.$('#go').click();},
 run(L){
  let p=null;const O=['They pick the popcorn popper','They pick the carving knives','They get angry at the offer'];
  L.h(L.kick('try','Warm-up · trust your gut')+'<h1 class="q">A marketer calls fire stations about a new fire-safety training film. Every station wants to see it. Then he asks: “As thanks for reviewing it, would you prefer a popcorn popper or a set of chef’s knives?” What happens?</h1><div id="po"></div>'+
   '<div id="gw" hidden><button class="btn pri" id="go" style="margin-top:12px">'+L.ic('play')+'Hear what happened</button></div><div id="pr"></div>');
  O.forEach((o,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=o;b.onclick=()=>{if(p!==null)return;p=j;b.classList.add('sel');L.$('#gw').hidden=false;};L.$('#po').appendChild(b);});
  L.$('#go').onclick=function(){L.$('#gw').remove();
    L.$('#pr').innerHTML=L.note('The first two stations both exploded: did he really think they’d use a safety program because of a popcorn popper? He stopped offering gifts.','flame');
    L.award(p===2);
    L.sheet(p===2?'ok':'no',p===2?'Your gut was right':'They got angry','The gift wasn’t a bribe, and taking it cost nothing. By pure self-interest, saying yes is the smart choice. Yet it insulted them. This lesson explains why.');L.done();};}},
{part:0,src:'Chapter 5 · The Popcorn Popper and Political Science',run(L){
  L.h(L.kick('learn','Self-interest is weaker than we think')+'<h1 class="q">Even voters don’t vote their wallets as much as you’d expect</h1>'+
   L.prose('The common view: people back whatever helps them personally. But a political scientist, Donald Kinder, reviewed thirty years of research and found self-interest barely predicts people’s political views. The unemployed don’t especially favor job-relief policies; parents with kids in public schools aren’t more likely to back school funding.')+
   L.list([['target','When self-interest does matter','When the effect is big, tangible and immediate. California homeowners backed a sharp property-tax cut in 1978; librarians and firefighters voted against it.'],
     ['eye','What it does shape','What we pay attention to. People with a stake form clearer opinions, even when those opinions go against their own interest.'],
     ['people','What predicts better','Principles (like free speech) and above all '+L.g('group-interest','group interest')+': not “what’s in it for me?” but “what’s in it for <i>my group</i>?”']],1));
  L.done();}},
{part:0,src:'Chapter 5 · The Popcorn Popper and Political Science',run(L){
  L.h(L.kick('learn','Two ways people decide')+'<h1 class="q">Weighing the payoff, or asking who you are</h1>'+
   L.prose('A Stanford professor, James March, describes two basic ways people make decisions.')+
   L.lanes([['scale','Weigh consequences','List the options, judge the value of each, pick the best deal. The economics-class view: “Which sofa gives me the most comfort for the price?”',3],
            ['person','Act on identity','No calculation, just norms. Ask three questions and do what fits.',2]])+
   L.flow([['person','Who am I?','','',2],['compass','What kind of situation is this?','','',2],['check','What do people like me do here?','','',2]])+
   L.prose('In the '+L.g('identity-model','identity model')+' it’s as if people check an ideal picture of themselves: <i>what would someone like me do?</i>'));
  L.done();}},
{part:0,src:'Chapter 5 · The Popcorn Popper and Political Science',run(L){
  L.h(L.kick('ex','The popper, replayed')+'<h1 class="q">Why turning down a free popper made perfect sense</h1>');
  L.beats(L.card,[
   ['By the numbers','Say yes and you get a popper. Say no and you don’t. Nothing else changes. By the '+L.g('consequence-model','consequence model')+', refusing is simply foolish.'],
   ['By identity','“I’m a firefighter. We run into burning buildings to save people. We don’t need a little gift to make us learn about safety. Shame on you for suggesting it.”'],
   ['A better offer?','The book suggests one: donate $50 to a school’s fire-safety program if they view the film. That fits a firefighter’s identity instead of insulting it.'],
   ['Floyd Lee again','Floyd Lee could have rewarded his Pegasus cooks with early nights or first pick of the steaks. Instead he gave them an identity: a Pegasus cook runs morale, not just food. Each small decision became “what would a Pegasus person do?”']],
   'Self-interest is one color on the palette. Paint with it alone and you bore people, or offend them.');}},
{part:0,src:'Chapter 5 · The Popcorn Popper and Political Science',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Which thought belongs to the identity model?</h1>');
  L.mc(L.card,['“Which quote saves us the most money this winter?”','“Is the rebate worth the hassle of the paperwork?”','“People who take care of their homes get this done.”'],2,
   'It asks what people like me do. No costs or benefits are being weighed.',
   'That one weighs costs and benefits, so it’s the consequence model. The identity thought is “people who take care of their homes get this done.”');}},
{part:0,src:'Chapter 5 · The Popcorn Popper and Political Science',pts:5,run(L){
  L.h(L.kick('pr','Which model is talking?')+'<h1 class="q">Sort what people around Kestrel say: weighing payoffs, or acting on identity?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Weighing consequences','Identity'],[
   ['Gloria Hale: “Would the heat pump pay for itself before I’m eighty?”',0,'Gloria is doing the math on payback. That’s weighing consequences.'],
   ['An installer: “I’m a roofer. Roofers don’t leave a job half-sealed.”',1,'Who am I, and what do people like me do? Pure identity.'],
   ['Councilmember Brandt: “I’m the one on this council who reads the numbers.”',1,'Brandt is describing who they are. Their vote will follow that self-image.'],
   ['The Nwosu family: “Which fix keeps the kids’ room warmest for the least money?”',0,'They are comparing options by value: the consequence model.'],
   ['Theo: “Engineers like me check the calculation twice, even if nobody will notice.”',1,'There’s no payoff here, only a norm Theo holds about people like them.']],
   'Both models are real. The book’s point is that the identity model is often forgotten, and it’s often stronger.');}},
{part:0,src:'Chapter 5 · The Popcorn Popper and Political Science',pts:1,run(L){
  L.h(L.kick('pr','Pick the appeal')+'<h1 class="q">Dana wants installers to lay floor runners in every home, every time. Which message fits what you just learned?</h1><div id="hq"></div>');
  L.mc(L.$('#hq'),['Earn a $5 bonus for each job with no floor scuffs','Kestrel crews are guests in someone’s home, always','A $50 fine for any scuff a customer reports'],1,
   'It tells installers who they are and what people like them do. Like Floyd Lee’s cooks, they can apply it to hundreds of small choices no rule covers.',
   'A bonus or a fine treats installers as if only a payoff moves them, and like the popper it can feel insulting to proud tradespeople. The identity line, “guests in someone’s home”, guides every small choice.');}},

/* ---------- PART 2: OUT OF THE BASEMENT ---------- */
{part:1,src:'Chapter 5 · The Need for Algebra and Maslow’s Basement',run(L){
  L.h(L.kick('learn','A quick reminder')+'<h1 class="q">Most “why should I care?” answers stay in the basement</h1>'+
   L.prose('Last lesson’s idea: people’s needs run from the physical (food, safety) up to belonging, esteem, learning, beauty, growing into your potential, and helping others grow into theirs.')+
   L.tiers([['star','Higher levels','Learning, beauty, realizing your potential, helping others','Often forgotten, often more motivating',true,'Aim here too'],
            ['person','Esteem','Being competent, approval, status',''],
            ['shield','Physical and security','Money, safety, comfort','']])+
   L.prose('Staying in '+L.g('basement','Maslow’s basement')+' means assuming other people care only about the bottom layers. The algebra Clinic shows how to climb out, even on a dull topic.'));
  L.done();}},
{part:1,src:'Chapter 5 · The Need for Algebra and Maslow’s Basement',run(L){
  L.h(L.kick('ex','Idea Clinic')+'<h1 class="q">Three answers to a student’s “When will I ever use algebra?”</h1>');
  L.beats(L.card,[
   ['Answer 1 · Experts','A conference of math experts listed what algebra is: the science of variables, a way to model the world with symbols. Fine as a definition. As a reason to care, it’s the Curse of Knowledge: no restless student is moved.'],
   ['Answer 2 · Practical','You need it for your diploma, for later math classes, for college, maybe for a budget. Plus a brother who struggled with math and later found it made him a sharper salesman. Clear, but it stays near the basement: mostly esteem, and “do it because you have to.”'],
   ['Answer 3 · A teacher','Dean Sherman surprises his ninth-graders: they will never use it. Then he explains that people don’t lift weights to be ready for a barbell on the sidewalk. They lift so they’re stronger for everything else.'],
   ['Why 3 wins','A surprise opening grabs attention. The weight-lifting analogy taps a '+L.g('schema','schema')+' everyone has. And it climbs to the higher levels: learning, and becoming more of who you could be.']],
   L.quote('Math is mental weight training.','Dean Sherman, a high school teacher, quoted in chapter 5'));}},
{part:1,src:'Chapter 5 · The Need for Algebra and Maslow’s Basement',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Why does the book prefer “mental weight training” to “you need it for your diploma”?</h1>');
  L.mc(L.card,['It appeals to growth and potential, not just to requirements','It is shorter, so students can memorize it more easily','It promises students higher grades if they work harder'],0,
   'The diploma answer stays in the basement. Weight training speaks to getting stronger and realizing your potential.',
   'Length and grades aren’t the point. The weight-training answer moves up from “because you have to” to growing stronger and realizing your potential.');}},
{part:1,src:'Chapter 5 · The Need for Algebra and Maslow’s Basement',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'A new installer asks Dana: “Why do I have to learn to read a blower-door test?” Basement or higher?',['Basement answer','Higher-level answer'],[
   ['“You need it to pass your certification.”',0,'“Do it because you have to” is the algebra teacher’s diploma answer.'],
   ['“It turns you into the installer who can read a whole house, not just follow a list.”',1,'That’s about mastery and growing into your potential.'],
   ['“Techs who know it get paid more.”',0,'Money sits in the basement. It may be true, but it’s a narrow appeal.'],
   ['“The day you find the leak nobody else could, you’ll know why.”',1,'It points to competence and the pleasure of solving a puzzle, higher up the list.'],
   ['“If you skip it, you’ll get written up.”',0,'Fear of punishment is about security, the bottom floor.']]);}},

/* ---------- PART 3: DON'T MESS WITH TEXAS ---------- */
{part:2,src:'Chapter 5 · Don’t Mess with Texas',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">How Texas got the people who litter to stop</h1>');
  L.beats(L.card,[
   ['The problem','In the 1980s Texas spent $25 million a year cleaning roadsides, and the cost rose 15% a year. “Please don’t litter” signs and trash cans weren’t working.'],
   ['Who litters','Researcher Dan Syrek found the typical litterer was a man aged 18 to 35 who drove a pickup, liked sports and country music, and disliked authority. Weepy ads and cartoon owls meant nothing to him.'],
   ['What won’t work','Self-interest? Not littering gains him nothing. Fear of fines? He hates authority, so it might backfire.'],
   ['The idea','Convince him that <b>people like him</b> don’t litter. The campaign: “Don’t Mess with Texas”, voiced by Dallas Cowboys players, Texan musicians and athletes. In one ad, a player crushes a beer can and says he has a message for whoever threw it.'],
   ['The result','Within months, 73% of Texans could name it as an anti-litter message. Litter fell 29% in a year. A planned $1 million enforcement push was dropped as unneeded. In five years visible litter fell 72%.']],
   'An identity appeal reached people that self-interest and fear could not.');}},
{part:2,src:'Chapter 5 · Don’t Mess with Texas',run(L){
  L.h(L.kick('learn','It wasn’t just celebrities')+'<h1 class="q">The stars mattered only because they meant “Texan”</h1>'+
   L.prose('The book insists this was not a plain celebrity endorsement. Each star was useful only because they quickly called up a picture of the ideal, tough Texan.')+
   L.list([['x','A macho star from elsewhere','A famous action hero would add muscle but no “Texan-ness”. The identity is missing.'],
     ['x','A Texan playing the authority','“I’m a famous boxer, and littering is uncool” puts the star in the lecturing role these men hate.'],
     ['check','A Texan speaking as a Texan','“Texans don’t litter.” The message is about who you are, not what you’ll gain or lose.']],2)+
   L.note('<b>The slogan is not the idea.</b> The book says even a weaker line like “Don’t Disrespect Texas” would still have cut litter. The idea was the identity appeal.','bulb'));
  L.done();}},
{part:2,src:'Chapter 5 · Don’t Mess with Texas',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Why would a country singer famous across Texas beat a global action-movie star for this campaign?</h1>');
  L.mc(L.card,['The singer would cost far less to film','The singer stands for being a real Texan','The singer is more famous with all ages'],1,
   'The star’s only job was to call up “people like me, Texans”. Fame without that identity adds little.',
   'Cost and broad fame weren’t the point. The messenger had to stand for the identity: a real Texan.');}},
{part:2,src:'Chapter 5 · Don’t Mess with Texas',pts:1,
 solve:async L=>{const c=L.$('#tg').children;c[0].click();c[1].click();c[2].click();},
 run(L){
  const V=[['Fear','Rosa sends a memo: falls cause serious injuries, and anyone found unclipped on a roof gets a written warning.','Many hear “the office is lecturing us again.” Some clip in only when a supervisor is watching.'],
           ['Self-interest','Kestrel offers a $50 gift card each month to every crew with a perfect harness record.','Some go along. The proudest veterans feel it’s the popcorn popper all over again: “We need a gift card to stay alive?”'],
           ['Identity','Dana, a former roofer, tells the crews: “The best roofers I ever worked with clipped in every time. Pros don’t gamble with a fall.”','It says what people like them do, from someone who is one of them. No lecture, no bribe.']];const seen=new Set();
  L.h(L.kick('pr','Toggle and compare')+'<h1 class="q">Some of Kestrel’s veteran installers skip their safety harness on roofs. Like the Texas litterers, they’re proud and dislike rules. Try all three messages.</h1><div id="tg"></div>'+
   '<div style="background:var(--soft);border-radius:16px;padding:14px;margin:8px 0 6px;min-height:120px" id="tv"><div class="small">Choose a message above.</div></div><div id="tq"></div>');
  V.forEach((v,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=v[0];b.onclick=()=>{[...L.$('#tg').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(j);
    L.$('#tv').innerHTML='<div class="small"><b>The message</b></div><p class="prose" style="margin:4px 0 10px">'+v[1]+'</p><div class="small"><b>How proud veterans are likely to hear it</b></div><p class="prose" style="margin:4px 0 0">'+v[2]+'</p>';
    if(seen.size===3&&!L.$('#tq').innerHTML){const q=L.$('#tq');q.innerHTML='<h2 class="sub">Which message should Kestrel lead with?</h2>';
      L.mc(q,['Fear of warnings','Dana on what pros do','The monthly gift card'],1,
       'Like Syrek with the Texas litterers, Dana shows that people like them act this way, and Dana really is one of them.',
       'For proud people who dislike authority, a threat can backfire and a gift can insult. Dana’s identity message is the Texas approach.');}};L.$('#tg').appendChild(b);});}},
{part:2,src:'Chapter 5 · Don’t Mess with Texas',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Identity appeal or not?',['Identity appeal','Something else'],[
   ['Jun’s mailer: “Neighbors on your street already keep the cold out. Join them.”',0,'It says people like you, your neighbors, do this. That’s an identity cue.'],
   ['A mailer line: “Save up to $230 a month on heating.”',1,'That’s a self-interest appeal. Useful, but a different tool.'],
   ['A ticket from the city for an unsealed rental unit.',1,'That’s fear and enforcement, the approach Texas found it didn’t need.'],
   ['Dana to new hires: “Kestrel installers leave a home cleaner than they found it.”',0,'It tells new hires who they are now and what people like them do.']]);}},

/* ---------- PART 4: WHY, AND THE PARTICULAR ---------- */
{part:3,src:'Chapter 5 · The Music of Duo Piano',run(L){
  L.h(L.kick('learn','The Curse strikes again')+'<h1 class="q">The people who care most can be worst at making others care</h1>'+
   L.prose('This chapter has shown three ways to make people care: tap the right associations, appeal to self-interest, appeal to identity. All three can be wrecked by our old villain, the '+L.g('curse','Curse of Knowledge')+'.')+
   L.prose('If you spend years inside a cause, its value feels obvious. You forget that most people have never heard of it. You’re the tapper, and the world is the listener.')+
   L.flow([['pencil','What we do','Means a lot inside the group','',4],['bulb','Why it matters','Means something to outsiders','',2]]));
  L.done();}},
{part:3,src:'Chapter 5 · The Music of Duo Piano',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">Asking “why?” until a piano foundation made a room care</h1>');
  L.beats(L.card,[
   ['The mission','At a seminar for arts leaders, a foundation for duo-piano music (two pianos played together) read out its purpose: keeping duo-piano music alive and promoting it.'],
   ['Why?','Because not much of it is played any more, and they want to keep it from dying out. The room stayed cold. One person had pictured the dueling pianos of a tourist bar.'],
   ['Why, really?','Someone finally asked, a bit rudely, why the world would be any poorer if duo-piano music vanished completely.'],
   ['The answer','A piano can hold the range of a whole orchestra under one player. Put two in a room, playing off each other, and you get an orchestra’s sound with a small group’s closeness. Eyebrows went up. People finally understood.'],
   ['The lesson','They knew the value better than anyone, but the Curse of Knowledge hid it. Asking “Why?” three times moved them from <i>what</i> they did to <i>why</i>.']],
   'The book calls this the '+L.g('three-whys','Three Whys')+'. (Toyota uses five on its production line. Use as many as you need.)');}},
{part:3,src:'Chapter 5 · The Music of Duo Piano',run(L){
  L.h(L.kick('learn','The particular, not the pattern')+'<h1 class="q">A hospital staff sees the ER through one patient’s eyes</h1>'+
   L.prose('A hospital asked the design firm IDEO to improve its workflow. IDEO expected resistance, so first it had to make staff <i>care</i> about the problem.')+
   L.prose('It filmed a video from the eyes of a patient with a broken leg: hunting for where to check in, staff speaking medical jargon, long stretches of ceiling from a gurney, voices with no faces, long waits with no idea what’s next.')+
   L.note('Staff kept reacting the same way: they had simply never realized what patients went through. The problem became real, no longer a line on a problem list. IDEO’s psychologist explained that business tends to focus on broad patterns, not single cases, and patterns stop people caring.','eye')+
   L.prose('This is the Mother Teresa effect from last lesson, full circle: people act for <b>the one</b>, not the mass.'));
  L.done();}},
{part:3,src:'Chapter 5 · The Music of Duo Piano',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Marisol wants Kestrel’s managers to care that callers wait on hold too long. Which approach follows the IDEO lesson?</h1>');
  L.mc(L.card,['A chart of average hold times for every month this year','A list of five call-center changes, ranked by cost','A recording of one caller, Gloria, waiting 22 minutes'],2,
   'Hearing one particular person wait makes the problem real, the way the patient’s-eye video did.',
   'Charts and ranked lists show the pattern. The IDEO lesson is that empathy comes from the particular: let managers hear one caller wait.');}},
{part:3,src:'Chapter 5 · The Music of Duo Piano',pts:1,
 solve:async L=>{for(let i=0;i<3;i++)L.$('#why').click();},
 run(L){
  const W=['Lead customer-centric energy transformation.','Because homes in our city waste a huge amount of heat.','Because that waste lands on families as big winter bills and cold rooms.','Because no kid should wake up to frost on the inside of their bedroom window, the way the Nwosu children do.'];let lv=0;
  L.h(L.kick('pr','Ask why')+'<h1 class="q">Rosa will pitch Kestrel to volunteers at a city housing fair. Their first line is a strategy pillar. Press “Why?” three times.</h1><div class="ladder" id="ld"></div><button class="btn pri" id="why">Why? '+L.ic('down')+'</button><div id="wq"></div>');
  const draw=()=>{L.$('#ld').innerHTML=W.slice(0,lv+1).map((x,j)=>(j?'<div class="conn"></div>':'')+'<div class="rung'+(j===lv?' cur':'')+'">'+(j?'<small>why '+j+'</small>':'<small>Rosa’s first line</small>')+x+'</div>').join('');};draw();
  L.$('#why').onclick=function(){if(lv>=3)return;lv++;draw();
    if(lv===3){this.remove();const q=L.$('#wq');q.innerHTML='<h2 class="sub">Which line should open Rosa’s pitch to the volunteers?</h2>';
      L.mc(q,['Lead customer-centric energy transformation','Homes in our city waste a huge amount of heat','No kid should wake to frost inside their window'],2,
       'Three whys took Rosa from what Kestrel does to why it matters, landing on one particular family. Kestrel’s core, warm homes on smaller winter bills, now has a face.',
       'That line is still about <i>what</i> Kestrel does, and it means most to people inside Kestrel. The last “why” reaches outsiders: one particular child’s cold room.');}};}}
  ]
});
</script>
</body>
</html>
