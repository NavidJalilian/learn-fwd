<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concrete Ideas People Remember</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0006', title:'Concrete ideas people understand and remember', minutes:18, icon:'box',
  goals:['Tell concrete language from abstract language at a glance','Build an abstract idea on a concrete foundation people already know','Add more memory “hooks” so an idea clings'],
  parts:['Concrete sticks','Understand','Remember','Hooks'],
  read:'Read the first half of chapter 3, “Concrete,” for the full Nature Conservancy, accounting class and brown-eyes, blue-eyes stories.',
  glossary:{
    'landscape':'Landscape (The Nature Conservancy): a named, connected piece of land with special natural features, used instead of “acres” to make a huge goal concrete.',
    'context':'Computing in Context: teaching an abstract idea through a familiar, concrete situation, like buying a notebook to teach subtraction.',
    'velcro':'Velcro theory of memory: an idea sticks better the more “hooks” it has, such as sights, sounds, feelings and links to things you know.'
  },
  cheatsheet:[
    '<b>Concrete</b> = something you can see, hear or touch. Most often: specific people doing specific things.',
    'Abstraction makes ideas harder to <b>understand</b>, to <b>remember</b> and to <b>coordinate</b> around.',
    'Big, vague goals get stuck. Turn them into concrete, named pieces, like The Nature Conservancy’s <b>landscapes</b>.',
    'Abstraction is the luxury of the expert. When unsure what people know, <b>concrete is the safe language</b>.',
    'Build abstract ideas on a concrete foundation (100 yen minus a 70-yen notebook), not a roof in the air.',
    'One rich, running example (Kris and Sandy’s business) can teach a whole subject, and it sticks for years.',
    '<b>Velcro theory:</b> the more hooks an idea has (sights, sounds, feelings), the better it clings.',
    'Strongest of all: turn the idea into an <b>experience</b>, like Jane Elliott’s brown-eyes, blue-eyes class.'
  ],
  steps:[
/* ---------- PART 1: CONCRETE STICKS ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Two lines from Kestrel ads. Which one will you still remember tomorrow?</h1>');
  L.mc(L.card,['“We optimize residential thermal comfort.”','“We stop the cold draft under your front door.”'],1,
   'You can picture a door and feel the draft. That’s what this lesson is about: concrete ideas stick.',
   'It sounds impressive, but there’s nothing to picture. The draft under the door is something you can see and feel, so it sticks.');}},
{part:0,src:'Chapter 3 · Concrete',run(L){
  L.h(L.kick('learn','Why fables last')+'<h1 class="q">A fox, some grapes, and 2,500 years</h1>'+
   L.prose('In Aesop’s fable, a fox jumps again and again for grapes he can’t reach, then walks off saying they were probably sour anyway. The phrase “sour grapes” has traveled into many languages.')+
   L.prose('The book’s point: the fable survived because of <b>how it was told</b>. A plain tip like “don’t be bitter when you fail” would have faded long ago.')+
   L.lanes([['x','Abstract','“Customer-centric energy transformation.” Buzzwords anyone could say about anything.',4],
            ['box','Concrete','A crew sealing the gap under a customer’s attic hatch. Something you can picture.',2]])+
   L.prose('Language drifts to the abstract, but life doesn’t. Abstraction makes ideas harder to <b>understand</b>, to <b>remember</b>, and to <b>coordinate</b> around, since everyone reads them differently.'));
  L.done();}},
{part:0,src:'Chapter 3 · The Nature Conservancy',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">How The Nature Conservancy made a vague goal concrete</h1>');
  L.beats(L.card,[
   ['Bucks and acres','For decades The Nature Conservancy (TNC) protected nature by simply buying land. Donors loved it: a bigger gift bought more land.'],
   ['The problem','In 2002, TNC’s California team mapped the land worth saving: 40% of the state, with 9% in critical danger. Far too much to buy.'],
   ['New tactics','So TNC would pay owners not to develop, work on public policy, and protect sea areas. Sensible, but now donors had nothing to picture, and staff had no deals to celebrate.'],
   ['Acres fail','Splitting the goal into acres doesn’t help either: 2% of California is about two million acres. Nobody can picture that.'],
   ['Landscapes','TNC switched to '+L.g('landscape','landscapes')+': named, connected areas with special features. The goal became 50 landscapes in ten years.'],
   ['An eco-celebrity','Some plain brown hills east of Silicon Valley became the “Mount Hamilton Wilderness.” A big grant followed, and other groups started using the name.']],
   'The work got more complicated, but TNC refused to let the <b>message</b> get vaguer. Named landscapes gave everyone something to see.');}},
{part:0,src:'Chapter 3 · The Nature Conservancy',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Why did “the Mount Hamilton Wilderness” work better than “an important area east of Silicon Valley”?</h1>');
  L.mc(L.card,['It gave a vague area a name and a shape people could picture','It made the land sound bigger than it really was','It used scientific terms that experts trust more'],0,
   'A named place has edges and a personality, like a neighborhood. People knew where to start caring.',
   'Size and science weren’t the point. Naming the area turned a blob on a map into a place people could picture, so they took notice.');}},
{part:0,src:'Chapter 3 · The Nature Conservancy',pts:1,run(L){
  L.h(L.kick('pr','Make the goal concrete')+'<h1 class="q">Rosa’s plan says Kestrel will “weatherize 3% of the city’s housing stock each year.” Staff nod and forget it. Which rewrite does what TNC did?</h1>');
  L.mc(L.card,['“Seal and insulate about 1,800 dwelling units every year.”','“Speed up citywide residential energy transformation.”','“This winter: the Eastgate rowhouses, 220 homes on six streets.”'],2,
   'Like a TNC landscape, Eastgate is a named place crews can picture, walk and finish. Progress becomes something you can celebrate.',
   'A bigger number of units is still a blob nobody can picture, and the slogan is even vaguer. A named set of streets is the “landscape” move.');}},

/* ---------- PART 2: UNDERSTAND ---------- */
{part:1,src:'Chapter 3 · Understanding Subtraction',run(L){
  L.h(L.kick('learn','What “concrete” means')+'<h1 class="q">If you can sense it, it’s concrete</h1>'+
   L.prose('Something is '+L.g('concrete','concrete')+' if you can see, hear, touch, smell or taste it. A V8 engine is concrete; “high-performance” is not. Most often, concrete means <b>specific people doing specific things</b>.')+
   L.flow([['star','Abstract','“World-class customer service”','',4],['person','Concrete','A Nordstrom clerk ironing a customer’s shirt','',2]])+
   L.note('<b>Abstraction is the luxury of the expert.</b> Novices crave concreteness. When you don’t know what your audience knows, concrete is the only safe language.','alert'));
  L.done();}},
{part:1,src:'Chapter 3 · Understanding Subtraction',run(L){
  L.h(L.kick('ex','Research from the book')+'<h1 class="q">How some of the world’s best math classrooms teach abstract ideas</h1>');
  L.beats(L.card,[
   ['The study','In 1993, researchers watched math lessons in schools in Japan, Taiwan and the United States. All the teachers used plenty of memorizing.'],
   ['Familiar scenes','A Japanese teacher: you had 100 yen and bought a 70-yen notebook; how much is left? A Taiwanese teacher drew three kids playing ball, then two more, then one more.'],
   ['Computing in Context','The researchers called this '+L.g('context','Computing in Context')+'. It showed up in 61% of lessons in Asia, against 31% in the US.'],
   ['The tiles','One teacher laid out 5 rows of 10 tiles, took away 3 rows, and asked how the students knew this was subtraction. They could see it.'],
   ['The gap','Questions like that, building a concept on something visible, came up in 37% of lessons in Japan, 20% in Taiwan and 2% in the US.']],
   'The stereotype is drill and memorizing. The reality: start from something concrete and familiar, then build the abstract idea on top.');}},
{part:1,src:'Chapter 3 · Understanding Subtraction',run(L){
  L.h(L.kick('learn','Foundation first')+'<h1 class="q">You can’t build a roof in the air</h1>'+
   L.prose('Novices crave concreteness. Think of a recipe that says “cook until the mixture reaches a hearty consistency.” The first time, that means nothing. Tell me how many minutes. Show me a photo.')+
   L.prose('After you’ve cooked it a few times, “hearty consistency” starts to make sense, because now you have a picture to hang it on.')+
   L.tiers([['home','Abstract insight','“Subtraction,” “hearty consistency,” “air sealing”','built last'],
            ['box','Concrete foundation','Tiles taken away, a photo of the dish, smoke drifting from a gap','built first',true,'Start here']]));
  L.done();}},
{part:1,src:'Chapter 3 · Understanding Subtraction',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Which of these lines from Kestrel’s website is concrete?</h1>');
  L.mc(L.card,['“Best-in-class home comfort solutions.”','“Superior thermal envelope performance.”','“The tech holds a smoke pencil by your outlet, and the smoke streams sideways.”'],2,
   'You can see the smoke move. It’s a specific person doing a specific thing.',
   'Those are phrases you can’t see or touch. The smoke streaming sideways from an outlet is something you can actually picture.');}},
{part:1,src:'Chapter 3 · Understanding Subtraction',pts:6,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Concrete or abstract?',['Concrete','Abstract'],[
   ['“Holistic energy-efficiency upgrades.”',1,'Nothing to see or touch. Each reader fills it in differently.'],
   ['“Frost on the inside of the Nwosu kids’ bedroom window.”',0,'You can picture it, even feel the cold.'],
   ['“Theo’s heat pump has a coefficient of performance of 3.”',1,'Precise, but abstract for a homeowner. An expert’s luxury.'],
   ['“A tech kneels by the back door and feels cold air pour over their hand.”',0,'A specific person doing a specific thing.'],
   ['“Our installers deliver a premium customer experience.”',1,'A buzzword. Compare it with a specific action, like the Nordstrom clerk ironing a shirt.'],
   ['“Dana’s crews lay drop cloths from the door to the attic hatch.”',0,'You can see exactly what the crew does.']]);}},
{part:1,src:'Chapter 3 · Understanding Subtraction',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Dana’s binder says: “Maintain appropriate floor-protection protocols.” Tap each piece until it’s a concrete instruction a new installer can follow.</h1>');
  L.sentence(L.card,[['Ensure suitable measures','Lay drop cloths'],['in relevant areas','from the front door to the attic hatch'],['before you carry in','as needed for'],['a single tool.','optimal outcomes.']],[1,1,0,0],
   [['That’s the binder’s abstract wording again. What do your hands actually do?'],['“Relevant areas” means something different to each installer. Name the path.'],['“As needed” leaves it to judgment. Give a clear moment.'],['“Optimal outcomes” is a buzzword. Name the concrete trigger.']],
   'Specific people doing specific things: a new installer can picture it, follow it and remember it.');}},
{part:1,src:'Chapter 3 · Understanding Subtraction',pts:1,run(L){
  L.h(L.kick('pr','Climb down the ladder')+'<h1 class="q">Order Theo’s descriptions from most abstract to most concrete.</h1><div id="od"></div>');
  L.order(L.$('#od'),['Customer-centric energy transformation','Home efficiency upgrades','Attic insulation','A crew blankets an Eastgate attic floor with insulation in one afternoon'],
   'Each step down adds something you can see. The last one has a person, a place and an action.',['Most abstract','','','Most concrete']);}},

/* ---------- PART 3: REMEMBER ---------- */
{part:2,src:'Chapter 3 · Concrete Is Memorable',run(L){
  L.h(L.kick('learn','Concrete is memorable')+'<h1 class="q">Abstractions evaporate. Concrete details survive.</h1>'+
   L.prose('Memory experiments show people remember concrete, easy-to-picture words like “bicycle” or “avocado” better than abstract ones like “justice” or “personality.”')+
   L.prose('A Yale scholar, Eric Havelock, studied tales passed on by word of mouth, like the <i>Iliad</i> and the <i>Odyssey</i>. They are full of concrete action and short on abstraction. His view: as the stories were retold over generations, the concrete details survived and the abstractions fell away.')+
   L.note('Remember the Kidney Heist legend? It would never have spread if the man had woken up missing his self-esteem instead of a kidney.','book'));
  L.done();}},
{part:2,src:'Chapter 3 · Concrete Is Memorable',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">Accounting taught as a soap opera</h1>');
  L.beats(L.card,[
   ['The problem','To a beginner, accounting is abstract: balance sheets, T-accounts, receivables. No people anywhere.'],
   ['The idea','In 2000, two Georgia State professors built a whole semester around one made-up case: two students, Kris and Sandy, starting a business.'],
   ['You’re in it','Kris and Sandy are your friends and ask for help. Can the business pay their tuition? Fixed versus variable costs aren’t just defined; you <b>discover</b> them.'],
   ['Plot twists','A court wants to lease the device instead of buying it. Later sales boom, yet a check bounces. Why? Now cash flow versus profit makes sense.'],
   ['Two years later','In the next accounting course, students who’d done the case scored higher on the first exam. C students gained the most, about 12 points. Top students were also more likely to major in accounting.']],
   'One rich, running example gave every abstract idea a concrete home, and it stuck for years.');}},
{part:2,src:'Chapter 3 · Concrete Is Memorable',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Why did Kris and Sandy’s story help students two years later?</h1>');
  L.mc(L.card,['The course covered fewer topics than usual','Each abstract idea was tied to a concrete situation','The students spent more hours on homework'],1,
   'Fixed costs, cash flow and the rest were each tied to something that happened to people students cared about.',
   'The case covered the full course, and extra hours alone don’t explain it. Each idea had a concrete situation to hang on, so it was still there two years later.');}},
{part:2,src:'Chapter 3 · Concrete Is Memorable',pts:1,run(L){
  L.h(L.kick('pr','Your call')+'<h1 class="q">Theo must teach new sales staff how heat-pump savings work. Right now it’s a 40-slide deck of formulas. What should Theo try?</h1>');
  L.mc(L.card,['Follow one real-looking house through quote, install and a winter of bills','Cut the deck to 15 slides and keep only the key formulas','Add a glossary page that defines every technical term'],0,
   'Like Kris and Sandy, one rich case lets staff discover each idea when it matters to the house, and it sticks.',
   'Fewer slides or a glossary still leave the ideas abstract. One running case gives each formula a concrete home, like the accounting soap opera.');}},

/* ---------- PART 4: HOOKS ---------- */
{part:3,src:'Chapter 3 · The Velcro Theory of Memory',run(L){
  L.h(L.kick('learn','The Velcro theory of memory')+'<h1 class="q">Try it: spend a few seconds remembering each one, then flip</h1>');
  L.flips(L.card,[
   ['The capital of Kansas','Probably a dry fact pulled from a list. Few hooks, unless you live there.'],
   ['A song you know well','You likely heard a voice or instrument in your head.'],
   ['Your childhood home','Rooms, smells, sounds, maybe where your family sat. Hooks everywhere.'],
   ['The definition of “watermelon”','First the stripes, taste and weight came, then you had to squeeze them into words.']],
   'Each one felt different. Memory isn’t one filing cabinet; it’s more like '+L.g('velcro','Velcro')+'. Your mind is covered in loops, and every sight, sound or feeling in an idea is another hook. <b>The more hooks, the better it clings.</b> Your childhood home has countless hooks; a new card number has one, if that.');}},
{part:3,src:'Chapter 3 · Brown Eyes, Blue Eyes',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">A teacher who made prejudice concrete</h1>');
  L.beats(L.card,[
   ['The day after','April 1968, the day after Martin Luther King Jr. was killed. Jane Elliott’s third-graders in an all-white Iowa town can’t understand why anyone would want him dead.'],
   ['Day one','Elliott announces brown-eyed kids are better. Blue-eyed kids sit at the back and wear collars; brown-eyed kids get extra recess. Friendships crack within hours.'],
   ['Day two','She says she was wrong: blue eyes are better. The blue-eyed kids cheer and put the collars on their brown-eyed classmates.'],
   ['It showed in their work','A phonics drill took the blue-eyed kids 5.5 minutes on their “low” day and 2.5 minutes on their “high” day. They couldn’t stop thinking about the collars.'],
   ['Years later','Studies 10 and 20 years on found her students were clearly less prejudiced than peers. At a reunion, they still remembered it vividly.']],
   'Elliott didn’t teach prejudice as a fact. She made it an <b>experience</b>, with sights, feelings and a collar around your neck: hooks that never came loose.');}},
{part:3,src:'Chapter 3 · Brown Eyes, Blue Eyes',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Why did Elliott’s students remember the lesson for decades?</h1>');
  L.mc(L.card,['She repeated the definition of prejudice every day','She tested them on it often for the rest of the year','They lived it, so it had many hooks: sights, feelings, a collar'],2,
   'Being taunted, wearing a collar, feeling stupid for a day: each was a hook in memory.',
   'Repeating or testing a definition keeps it abstract, like the capital of Kansas. Elliott turned the idea into an experience full of hooks.');}},
{part:3,src:'Chapter 3 · The Velcro Theory of Memory',pts:1,
 solve:async L=>{L.$('#ba').click();L.$('#bb').click();},
 run(L){
  const A='Kestrel delivers <span class="hk">comprehensive</span> home energy solutions for <span class="hk">year-round</span> comfort and savings.',
   B='Every evening, a family on Elm Street huddled around a <span class="hk">space heater</span> in the <span class="hk">living room</span>. Kestrel <span class="hk">sealed the attic</span>. The heater went down to the <span class="hk">basement</span>, and the <span class="hk">$290</span> heating bill dropped to <span class="hk">$230</span>.';
  const seen=new Set();
  L.h(L.kick('pr','Count the hooks')+'<h1 class="q">Jun has two versions of the mailer’s first line. Show the hooks in each: things you can see, feel or picture.</h1>'+
   L.lanes([['list','Version A','<div id="ta">'+A+'</div><div class="res" id="ca"></div><button class="btn" id="ba" style="margin-top:8px">'+L.ic('eye')+'Show hooks</button>',1],
            ['person','Version B','<div id="tb">'+B+'</div><div class="res" id="cb"></div><button class="btn" id="bb" style="margin-top:8px">'+L.ic('eye')+'Show hooks</button>',2]])+'<div id="hq"></div>');
  const show=(k,real,msg)=>{seen.add(k);const box=L.$('#t'+k);[...box.querySelectorAll('.hk')].forEach((s,i)=>{if(real[i]){s.style.background='var(--ok-bg)';s.style.borderRadius='6px';s.style.padding='0 3px';}else{s.style.textDecoration='line-through';s.style.opacity='.6';}});
    L.$('#c'+k).innerHTML=msg;L.$('#b'+k).remove();
    if(seen.size===2&&!L.$('#hq').innerHTML){const q=L.$('#hq');q.innerHTML='<h2 class="sub">Which line should lead Jun’s mailer?</h2>';
      L.mc(q,['Version A, because it covers every benefit','Version B, because it has far more hooks'],1,
       'A space heater, a living room, a basement, two real bill amounts: each is a hook. Readers can picture the family, so they remember Kestrel.',
       'Covering every benefit leaves nothing to picture. Version B gives readers a family, a heater and two numbers to hang the idea on.');}};
  L.$('#ba').onclick=()=>show('a',[0,0],'<span style="color:var(--no)"><b>0 hooks.</b> Both candidates are abstract: nothing to see or touch.</span>');
  L.$('#bb').onclick=()=>show('b',[1,1,1,1,1,1],'<span style="color:var(--ok)"><b>6 hooks.</b> A heater, a living room, an attic, a basement, two numbers.</span>');}},
{part:3,src:'Chapter 3 · Brown Eyes, Blue Eyes',pts:1,run(L){
  L.h(L.kick('pr','Your call')+'<h1 class="q">New installers keep forgetting the binder’s page on protecting floors. Using Jane Elliott’s lesson, what should Dana try?</h1>');
  L.mc(L.card,['Turn the page into a bold poster for the van','Have trainees walk a white practice rug in work boots, then try to clean it','Add a quiz on the floor rules at the end of week one'],1,
   'They’ll see the boot prints, feel the scrubbing and remember the dread. An experience gives the rule many hooks.',
   'A poster or a quiz keeps the rule abstract, a fact to recall. Living it, by seeing and scrubbing those boot prints, adds the hooks that make it stick.');}}
  ]
});
</script>
</body>
</html>
