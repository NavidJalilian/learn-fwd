<title>Putting SUCCESs to Work</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">

</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0014', title:'Putting SUCCESs to work', minutes:20, icon:'star',
  goals:['Judge whether the audience’s version of your idea still carries the core','Name the villain behind a message that didn’t stick, from burying the lead to the Curse of Knowledge','Match a communication symptom to the SUCCESs trait that fixes it'],
  parts:['The audience votes','Spotting','Speakers and stickers','The toolkit'],
  read:'Read the epilogue, then keep the book’s Easy Reference Guide at the back as a one-page reminder of every principle and story.',
  glossary:{
    'core-glasses':'Core Idea Glasses: keeping your core message so firmly in mind that stories which fit it jump out at you, the way a gift idea jumps out when you’re shopping for someone.',
    'answer-stage':'Answer stage: the first step of getting a message across, when you use your expertise to work out the idea you want to share.',
    'telling-stage':'Telling Others stage: the second step, when you share that idea with people who don’t have your expertise. The Curse of Knowledge strikes here.',
    'comm-framework':'Communication framework: the five things a sticky idea must get the audience to do: pay attention, understand and remember, agree or believe, care, and be able to act.'
  },
  cheatsheet:[
    'The audience gets a vote. They may change, improve or trim your idea. Ask one question: <b>is their version still core?</b> If yes, embrace it.',
    '<b>Spotting</b> is as good as creating. Wear <b>Core Idea Glasses</b> so stories that fit your core stand out.',
    'Polish isn’t stickiness. In the Stanford exercise, <b>63%</b> recalled the stories and only <b>5%</b> any single statistic.',
    'Villains: <b>burying the lead</b>, focusing on <b>delivery</b> over message, <b>decision paralysis</b>, and the archvillain, the <b>Curse of Knowledge</b>.',
    'The skills that win the <b>Answer stage</b> backfire in the <b>Telling Others stage</b>: you talk as if the audience were you.',
    'Attention → <b>Unexpected</b>. Understand and remember → <b>Concrete</b>. Believe → <b>Credible</b>. Care → <b>Emotional</b>. Act → <b>Stories</b>. Simple sets <i>what</i> to say.',
    'Two steps: <b>find the core</b>, then translate it with the <b>SUCCESs</b> checklist. A checklist, not a formula.',
    'You don’t need to be JFK. Normal people with normal jobs make ideas stick.'
  ],
  steps:[
/* ---------- PART 1: THE AUDIENCE VOTES ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Customers describe Kestrel to friends as “the people who make your house warm for less.” That isn’t Jun’s tagline. Should Jun ask them to use the real one?</h1>');
  L.mc(L.card,['No, their version says the same thing','Yes, the exact wording matters most'],0,
   'Their words carry the point, and they’re spreading it for free. This lesson starts there: the audience gets a vote.',
   'What matters is whether the point survives, and here it does. Policing the wording would only slow the idea down.');}},
{part:0,src:'Epilogue · What Sticks',run(L){
  L.h(L.kick('ex','Stories from the book')+'<h1 class="q">Three ideas the audience reshaped</h1>');
  L.beats(L.card,[
   ['Changed','In 1946 baseball manager Leo Durocher mocked a rival team as nice guys sitting in seventh place. Retold again and again, it shrank to “Nice guys finish last”: no team, no baseball. Durocher denied saying it for years, then used it as the title of his autobiography.'],
   ['Improved','Sherlock Holmes never said “Elementary, my dear Watson.” He said “Elementary” and “my dear Watson” separately. Readers fused them into a line that captures Holmes better than anything he actually said.'],
   ['Trimmed','James Carville’s whiteboard for the 1992 Clinton campaign held three phrases. “It’s the economy, stupid” stuck. The other two, on change and health care, vanished. A huge hit, and only a third of his message.']],
   'In each case the audience, not the author, decided what survived.');}},
{part:0,src:'Epilogue · What Sticks',run(L){
  L.h(L.kick('learn','Is it still core?')+'<h1 class="q">Swap idea pride for one question</h1>'+
   L.prose('We all have “idea pride”: we want our message to last in the exact form we built. When the audience reshapes it, the urge is to deny and correct, like Durocher.')+
   L.flow([['people','Audience reshapes it','changes, improves or trims','',3],['target','Ask','Is their version still core?','',2],['check','If yes','Embrace it, humbly','',1]])+
   L.prose('The test of success isn’t whether people repeat your exact words. It’s whether you reach your goal. If their version still carries your '+L.g('core','core')+', as Carville’s slogan did, let it run.'));
  L.done();}},
{part:0,src:'Epilogue · What Sticks',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Crews have shortened Dana’s phrase “guests in someone’s home” to just “be a guest.” What should Dana do?</h1>');
  L.mc(L.card,['Retrain the crews on the original, full phrase','Let it run, since the short version keeps the point'],1,
   'The short version still tells crews how to act in a customer’s house. That’s core, so embrace it.',
   'Retraining would be idea pride. The question is only whether the new version is still core, and it is.');}},
{part:0,src:'Epilogue · What Sticks',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Kestrel’s core is “warm homes on smaller winter bills.” Embrace or correct?',['Embrace it','Correct it'],[
   ['Staff have dropped eight of Rosa’s nine pillars and only say “warm homes, smaller bills.”',0,'Like Carville’s whiteboard: one phrase survived, and it’s the core.'],
   ['Neighbors pass around that Kestrel gives out free heat pumps.',1,'That’s not the core, and it’s false. It will disappoint people who call.'],
   ['Locals now call Kestrel “the raccoon people” after the attic story.',1,'Memorable, but it carries nothing about warm homes or bills. Steer back to the core.'],
   ['Customers say a Kestrel visit means “no more coat indoors.”',0,'A concrete version of the core that people made up themselves. Like the Holmes line, it may even be better.']]);}},

/* ---------- PART 2: SPOTTING ---------- */
{part:1,src:'Epilogue · The Power of Spotting',run(L){
  L.h(L.kick('learn','The power of spotting')+'<h1 class="q">A wall in our minds hides good stories</h1>'+
   L.prose('It’s just as effective to spot a sticky idea as to create one. But it’s harder than it sounds, because we treat stories and abstractions differently.')+
   L.lanes([['target','An abstraction','“Raise satisfaction scores 10% this quarter” switches on manager mode: how do we get there?',3],
            ['chat','A story','A sales rep warming a customer’s car gets filed as office gossip: interesting, but trivial.',4]])+
   L.prose('Tearing down that wall takes '+L.g('core-glasses','Core Idea Glasses')+'. When Dad’s birthday is coming, gadgets jump out at you in every shop. Keep your core message just as present, and stories that fit it jump out the same way.')+
   L.note('A great spotter beats a great creator, because the world produces more good ideas than any one person can. Nordies, Jared and the nurse were all spotted, not invented.','eye'));
  L.done();}},
{part:1,src:'Epilogue · The Power of Spotting',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Why does Marisol hear stories like Gloria’s every week, yet none ever leave the call log?</h1>');
  L.mc(L.card,['Customers rarely tell stories that are good enough to use','Kestrel has no budget to turn stories into campaigns','Stories get filed as small talk, not seen as big-picture material'],2,
   'That’s the wall in our minds. Core Idea Glasses help Marisol see Gloria’s call as a symbol of the core, not a nice chat.',
   'The stories are there, and money wasn’t what stopped Subway’s franchise owner. The barrier is mental: stories get filed as trivia.');}},
{part:1,src:'Epilogue · The Power of Spotting',pts:1,
 solve:async L=>{const c=L.$('#cl').children;[0,2,4].forEach(i=>c[i].click());L.$('#ck').click();},
 run(L){
  const N=[['“Bill went from $410 to $190 after the sealing and the heat pump. First winter the house has felt warm.”',1],
           ['“Asked whether Kestrel recycles old furnaces.”',0],
           ['“The Nwosu kids’ windows have no frost on the inside anymore.”',1],
           ['“Loved the crew’s matching orange hats.”',0],
           ['“Retired couple turned the heat up for the first time in years, and still paid less.”',1],
           ['“Upset that the crew parked on the lawn.”',0]];
  const sel=new Set();let done=false;
  L.h(L.kick('pr','Put on the glasses')+'<h1 class="q">Here’s a page of Marisol’s call log. Tap every note that’s worth passing to Jun as a story for Kestrel’s core, then check.</h1>'+
   '<div id="cl" style="display:flex;flex-direction:column;gap:8px"></div><button class="btn pri" id="ck" style="margin-top:12px">'+L.ic('eye')+'Check with Core Idea Glasses</button><div id="cf"></div>');
  N.forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.style.cssText='display:block;width:100%;text-align:left;white-space:normal;margin:0';b.textContent=n[0];
    b.onclick=()=>{if(done)return;if(sel.has(j)){sel.delete(j);b.classList.remove('sel');}else{sel.add(j);b.classList.add('sel');}};L.$('#cl').appendChild(b);});
  L.$('#ck').onclick=function(){if(done)return;done=true;this.remove();const ok=N.every((n,j)=>!!n[1]===sel.has(j));
    [...L.$('#cl').children].forEach((b,j)=>{b.classList.remove('sel');if(N[j][1]){b.className='chip static ok';b.style.cssText='display:block;width:100%;text-align:left;white-space:normal;margin:0';}else b.style.opacity='.4';});
    L.award(ok);
    L.sheet(ok?'ok':'no',ok?'You spotted all three':'The glasses pick out three','The core is warm homes on smaller winter bills. The bill drop, the frost-free windows and the couple who turned up the heat all show it. The others matter for running the business, but they aren’t stories about the core.');L.done();};}},

/* ---------- PART 3: SPEAKERS AND STICKERS ---------- */
{part:2,src:'Epilogue · The Speakers and the Stickers',run(L){
  L.h(L.kick('ex','A classroom exercise from the book')+'<h1 class="q">Smart students, one-minute speeches</h1>');
  L.beats(L.card,[
   ['The task','In Chip Heath’s class at Stanford, students get government data on crime. Half argue that nonviolent crime is a serious problem; half argue it isn’t.'],
   ['The speeches','In small groups, each gives a one-minute speech. Nobody gives a bad one. The typical speech uses about 2.5 statistics. Only one student in ten tells a story.'],
   ['The ratings','Listeners rate each speaker on delivery and persuasion. The most poised, smooth speakers score highest. No surprise.'],
   ['The twist','Chip plays a short comedy clip to fill time. Then, out of nowhere, he asks everyone to write down every idea they remember from each speech, about ten minutes later.'],
   ['The blank','Students are stunned at how little they recall: one or two ideas per speaker at best, and nothing at all for some.']],
   'So what <i>did</i> stick? Predict it on the next screen.');}},
{part:2,src:'Epilogue · The Speakers and the Stickers',pts:1,
 solve:async L=>{L.$('#po').children[0].click();L.$('#rv').click();},
 run(L){
  let p=null;const N=['Stories','Statistics','About the same'],R=[['Recalled a story',63,'var(--ok-strong)'],['Recalled any single statistic',5,'var(--h3)']];
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">Most speeches were full of statistics. Few told stories. Which did listeners remember?</h1><div id="po"></div>'+
   '<div id="rs" hidden><button class="btn pri" id="rv" style="margin:8px 0">'+L.ic('play')+'Show what they recalled</button>'+
   R.map((r,j)=>'<div class="meterrow"><div class="lb">'+r[0]+' <b id="v'+j+'">0%</b></div><div class="meter"><div id="m'+j+'" style="background:'+r[2]+';width:0"></div></div></div>').join('')+'</div>');
  N.forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=n;b.onclick=()=>{if(p!==null)return;p=j;b.classList.add('sel');L.$('#rs').hidden=false;};L.$('#po').appendChild(b);});
  L.$('#rv').onclick=function(){this.remove();let k=0;
    const t=setInterval(()=>{k++;if(!L.$('#m0')){clearInterval(t);return;}
      R.forEach((r,j)=>{const v=Math.round(r[1]*k/10);L.$('#m'+j).style.width=v+'%';L.$('#v'+j).textContent=v+'%';});
      if(k>=10){clearInterval(t);L.award(p===0);
        L.sheet(p===0?'ok':'no',p===0?'You called it!':'Stories won, by far','63% of listeners recalled the stories; just 5% recalled any single statistic. Polish made no difference: smooth speakers did no better at sticking, and less fluent speakers caught up. The stickiest used stories, emotion, or one point instead of ten.');L.done();}},150);};}},
{part:2,src:'Epilogue · More Villains',run(L){
  L.h(L.kick('learn','The villains, all together')+'<h1 class="q">Four things that keep good ideas from sticking</h1>'+
   L.list([['Burying the lead','Knowing a lot tempts us to share it all, like students who stuff every fact into a paper. Stripping down to the core doesn’t come naturally.'],
     ['Delivery over message','Speakers want to seem poised and charismatic. Charisma helps a well-built message, but it can’t save a dense, unfocused one.'],
     ['Decision paralysis','Too many choices or a vague situation freeze people. The cure is finding the core and sharing it as a proverb, like “THE low-fare airline.”'],
     ['Curse of Knowledge','The archvillain. Once you know something, you can’t remember not knowing it, so you talk to the audience as if they were you.']],4));
  L.done();}},
{part:2,src:'Epilogue · More Villains',run(L){
  L.h(L.kick('learn','Two stages')+'<h1 class="q">What wins the Answer stage loses the Telling Others stage</h1>'+
   L.lanes([['flask','Answer stage','You use your expertise to work out the idea. Doctors train for a decade; managers deliberate for months.',2],
            ['chat','Telling Others stage','You share it with people who lack that expertise. The same knowledge now curses you.',4]])+
   L.prose('In the '+L.g('telling-stage','Telling Others stage')+' you stress the statistics that convinced <i>you</i> (nobody remembers them) and share the punch line (nobody can link it to their daily work). We train people for years to reach the '+L.g('answer-stage','Answer')+' and almost never train them to tell it.')+
   L.note('Clicking through a slide deck of conclusions isn’t communicating. It’s sharing data.','alert'));
  L.done();}},
{part:2,src:'Epilogue · More Villains',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Theo spent three months on data and found that most homes Kestrel checks lose more heat through the attic than the windows. Now Theo is briefing the crews. What’s Theo’s likeliest mistake?</h1>');
  L.mc(L.card,['Walking the crews through the 40 slides that convinced Theo','Telling the crews one attic job where the finding showed up','Leaving out the math the crews would never need on the job'],0,
   'That’s the Telling Others trap: the data that won the Answer stage won’t stick with the crews.',
   'That’s what Theo <i>should</i> do. The likeliest mistake is the opposite: talking to the crews as if they were Theo, with all those slides.');}},
{part:2,src:'Epilogue · More Villains',pts:5,run(L){
  L.h(L.kick('pr','Name the villain')+'<h1 class="q">Five Kestrel messages that didn’t stick. Which villain is behind each?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Burying the lead','Delivery over message','Decision paralysis','Curse of Knowledge'],[
   ['Jun’s mailer lists ten benefits. The free Home Energy Check is number nine.',0,'The point that matters is lost in the pile.'],
   ['Rosa hires a speaking coach for the all-hands but keeps all nine pillars.',1,'A smoother delivery won’t save an unfocused message.'],
   ['Crews can’t decide whether to finish fast or seal every last gap, so each does it differently.',2,'Too many unranked priorities freeze people. A shared core would settle it.'],
   ['Theo tells a homeowner the heat pump’s “coefficient of performance is 3.2” and assumes it lands.',3,'Theo can’t imagine not knowing what that means.'],
   ['Marisol’s report lists every call statistic; the spike in cold-bedroom calls is on page four.',0,'The real news is buried under everything else.']],
   'Naming the villain tells you where to start fixing the message.');}},

/* ---------- PART 4: THE TOOLKIT ---------- */
{part:3,src:'Epilogue · Making an Idea Stick: The Communication Framework',run(L){
  L.h(L.kick('learn','The communication framework')+'<h1 class="q">Five things a sticky idea must get people to do</h1>'+
   L.list([['eye','Pay attention','→ Unexpected'],['bulb','Understand and remember it','→ Concrete'],['shield','Agree or believe','→ Credible'],['flame','Care','→ Emotional'],['play','Be able to act on it','→ Stories']],1)+
   L.prose('Why didn’t the book start with this '+L.g('comm-framework','framework')+'? Because of the Curse of Knowledge. Ask an expert “Will people understand?” and the answer is yes, because <i>they</i> understand. So swap the guess for a concrete check: not “will they get it?” but “is it concrete?”')+
   '<p class="small" style="margin-top:10px">Simple isn’t on the list because it belongs mostly to the Answer stage: finding the core and making it compact. It helps every step, especially understanding and acting.</p>');
  L.done();}},
{part:3,src:'Epilogue · Making an Idea Stick: The Communication Framework',run(L){
  L.h(L.kick('ex','Symptoms and solutions')+'<h1 class="q">The book’s quick diagnosis guide. Flip each symptom.</h1>');
  L.flips(L.card,[
   ['“They’re bored; they’ve heard it all.”','Break their guessing machine with uncommon sense, like “There will be no school next Thursday.”'],
   ['“I lost them halfway through.”','Open a curiosity gap or a mystery solved bit by bit, like the rings of Saturn.'],
   ['“They nod, but it never turns into action.”','Make it simpler and more concrete: a generative analogy or a real example, like the Zambia health worker instead of “knowledge management”.'],
   ['“They’re not buying it.”','Find a telling detail. Use fewer authorities and more antiauthorities. If they quibble with everything, try a springboard story or one that passes the Sinatra Test.'],
   ['“No one seems fired up.”','Remember the Mother Teresa effect: one person beats a statistic. Tell a Challenge or Creativity story, appeal to identity, and get out of Maslow’s basement.'],
   ['“Everyone nods, then nothing happens.”','Inspire with a Challenge story or a springboard story, and turn the message into a proverb people can use.']],
   'Each symptom points to one stage of the framework, and that stage points to a SUCCESs trait.');}},
{part:3,src:'Epilogue · Making an Idea Stick: The Communication Framework',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Put the five steps of the communication framework in order.</h1>');
  L.order(L.card,['Pay attention','Understand and remember it','Agree or believe','Care','Be able to act on it'],
   'Attention first, action last. Each step matches a trait: Unexpected, Concrete, Credible, Emotional, Stories.');}},
{part:3,src:'Epilogue · Making an Idea Stick: The Communication Framework',pts:6,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which trait should they reach for?',['Unexpected','Concrete','Credible','Emotional','Stories'],[
   ['Jun: “People toss the mailer unread. They’ve seen a hundred like it.”',0,'An attention problem. Break the guessing machine.'],
   ['Theo: “Homeowners can’t repeat my heat-pump explainer back a day later.”',1,'An understand-and-remember problem. Give them something to picture.'],
   ['Councilmember Brandt: “I just don’t believe the savings are real.”',2,'A belief problem. A telling detail or a testable credential helps.'],
   ['Rosa: “Staff agree with the plan, but nobody seems to care.”',3,'A caring problem. One person’s story beats a pillar.'],
   ['Dana: “Crews get it and agree, but don’t know what to do differently on Monday.”',4,'An acting problem. Stories simulate the job and inspire the move.'],
   ['Marisol: “Callers drift off halfway through my explanation.”',0,'Attention again, this time keeping it. Open a curiosity gap.']]);}},
{part:3,src:'Epilogue · Making an Idea Stick: The Communication Framework',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">At last year’s all-hands, staff nodded at Rosa’s plan and then nothing changed. Tap each piece until the sentence gives Rosa the book’s fix.</h1>');
  L.sentence(L.card,[['Add more data slides','Tell a Challenge story'],['and shrink the core to a proverb','and walk through all nine pillars'],['so staff know what to do on Monday.','so staff see how much was planned.']],[1,0,0],
   [['More data is what got nods last time. Inspire people instead, like Jared or the blizzard crew.'],['Nine pillars is the decision paralysis the core is meant to cure.'],['Impressing people with the plan isn’t the goal. Action is.']],
   'For “nods, then nothing”: inspire with a story, and make the message simple and concrete enough to use, like “names, names, and names.”');}},
{part:3,src:'Epilogue · John F. Kennedy versus Floyd Lee',run(L){
  L.h(L.kick('learn','You’re not JFK, and you don’t need to be')+'<h1 class="q">Normal people with normal jobs make ideas stick</h1>'+
   L.prose('Kennedy’s moon goal moved a nation. But he’s the exception, not the standard. Most sticky ideas in this book came from people whose names you’ve probably forgotten, even though you remember their stories:')+
   L.list([['Art Silverman','Laid a day’s worth of fatty food next to a tub of movie popcorn.'],
     ['Nora Ephron’s teacher','Taught a class what a lead is with one sentence about no school next Thursday.'],
     ['Bob Ocwieja','Spotted Jared and passed the story up the chain.'],
     ['Floyd Lee','Ran an army mess hall in Iraq as if his job was morale, not food.'],
     ['Jane Elliott','Gave her students an experience of prejudice they still remember decades later.']],3)+
   L.prose('None had power, fame or ad budgets, just ideas. SUCCESs is a checklist, not an equation. It isn’t hard, but it isn’t natural either. It takes care and attention.'));
  L.done();}},
{part:3,src:'Epilogue · John F. Kennedy versus Floyd Lee',pts:5,run(L){
  L.h(L.kick('pr','Capstone: the all-hands')+'<h1 class="q">Rosa’s all-hands is next week. Rosa has found the core: warm homes on smaller winter bills. Now Rosa checks each draft item against SUCCESs. Keep it or cut it?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Keep','Cut'],[
   ['Gloria’s story: the coat in the kitchen, and the bill that fell from $380 to $150',0,'Concrete, emotional, unexpected, and it carries the core.'],
   ['A slide listing all nine strategic pillars',1,'Nine pillars bury the lead and invite decision paralysis.'],
   ['The core said as a proverb staff can use when deciding: “warm homes on smaller winter bills”',0,'Simple: a short line that helps people decide on their own.'],
   ['Theo’s 40 slides of energy data that led to the plan',1,'That’s Answer-stage material. Nobody will remember it.'],
   ['The blizzard crew’s story, told as a challenge for the Eastgate push',0,'A Challenge plot fits a kickoff and inspires action.']],
   'Find the core, then translate it with the checklist. No idea needs all six traits, and none is guaranteed. But this all-hands now has a real chance to stick.');}}
  ]
});
</script>
</body>
</html>
