<title>The Sinatra Test and Testable Credentials</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">

<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0009', title:'The Sinatra Test and testable credentials', minutes:18, icon:'shield',
  goals:['Find the one example that settles a doubt on its own','Let your audience check a claim for themselves','Turn a point into something people experience, not just hear'],
  parts:['Sinatra Test','Stack the sources','See for yourself','Experience it'],
  read:'Read the second half of chapter 4, “Credible,” for the full Safexpress, edible-fabric, Wendy’s and NBA rookie stories.',
  glossary:{
    'internal':'Internal credibility: belief the message earns on its own, through vivid details, well-used statistics or one convincing example.',
    'external':'External credibility: belief borrowed from a source outside the message, such as an expert, a celebrity or an antiauthority.',
    'falsifiable':'Falsifiable claim: a claim that could be shown wrong by checking it, like “our burger has more beef.”',
    'availability':'Availability bias: judging how common something is by how easily it comes to mind, not by how often it really happens.'
  },
  cheatsheet:[
    '<b>Sinatra Test:</b> one example so strong it settles the case alone. If it works there, it works anywhere.',
    'A Sinatra example convinces through <b>concreteness</b>, not through numbers or authority.',
    'Strongest stories stack all three inside sources: <b>vivid details</b>, a <b>statistic that shows a relationship</b>, and a <b>Sinatra example</b>.',
    '<b>Testable credential:</b> hand the proof to the audience. “See for yourself” lets people try before they buy.',
    'Careful: a valid “see for yourself” step can carry a false conclusion (the Snapple rumor). Check the leap, not just the step.',
    'Ask a question people answer from their own lives, instead of selling them your numbers.',
    'Strongest of all: let people <b>experience</b> the point. Make them predict first, or put them in the situation.',
    'No source always wins. If one well of credibility is dry, draw from another.'
  ],
  steps:[
/* ---------- PART 1: SINATRA TEST ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Rosa needs a crew to clear snow from Kestrel’s parking lot. Which crew would you trust more?</h1>');
  L.mc(L.card,['A crew that says it has cleared hundreds of driveways','A crew that keeps the city airport’s runways clear'],1,
   'One hard case beats a big count. If they can keep runways open in a storm, a parking lot is easy. This lesson is about finding that one case.',
   'Hundreds of driveways sounds good, but driveways are easy. A crew trusted with airport runways has passed a much harder test. One hard case beats a big count.');}},
{part:0,src:'Chapter 4 · The Sinatra Test and Safexpress',run(L){
  L.h(L.kick('learn','The Sinatra Test')+'<h1 class="q">Sometimes one example is enough to settle the case</h1>'+
   L.prose('In the last lesson you met '+L.g('internal','internal credibility')+': making a message believable through its own vivid details and well-used statistics. The book adds a third tool: an example that passes the '+L.g('sinatra','Sinatra Test')+'.')+
   L.prose('The name comes from Frank Sinatra’s song “New York, New York,” whose chorus says that if you succeed in New York, you can succeed anywhere. An example passes when <b>that one example alone</b> proves you can do the job.')+
   L.list([['shield','Security','Guard Fort Knox, and you’re in the running for any security contract, even with no other clients.'],
           ['star','Catering','Cater a White House dinner, and you can bid on any catering job.']],1)+
   '<p class="small" style="margin-top:10px">The trick is to find the case your audience sees as the hardest one.</p>');
  L.done();}},
{part:0,src:'Chapter 4 · The Sinatra Test and Safexpress',run(L){
  L.h(L.kick('ex','A real story from the book')+'<h1 class="q">A shipping firm wins a film studio with two deliveries</h1>');
  L.beats(L.card,[
   ['The firm','Safexpress, a family-owned shipping company in India, promised safe, on-time delivery in a market where many shippers couldn’t promise that at all.'],
   ['The doubt','Rubal Jain, from the founding family, pitched a big Bollywood studio. The studio scoffed. Films that go missing in transit turn into pirated copies on street corners.'],
   ['Story one','Jain told how Safexpress delivered the fifth <i>Harry Potter</i> book to every bookstore in India. Every copy had to arrive by 8 a.m. on release day: not earlier, or shops might sell early; not later, or shops lost sales. And nothing could leak.'],
   ['Story two','Then Jain mentioned that Safexpress had also carried the exam papers, and the answer sheets, for the national school exams the executive’s own brother had just taken.'],
   ['The result','Two months later the deal was signed. Jain could have quoted an on-time percentage or a big client’s praise. Instead, two hard cases did the work.']],
   'The stories won through <b>concreteness</b>, not numbers or authority. If Safexpress could handle those, it could handle anything.');}},
{part:0,src:'Chapter 4 · The Sinatra Test and Safexpress',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Many homeowners believe heat pumps quit in a cold winter. Which Kestrel example passes the Sinatra Test?</h1>');
  L.mc(L.card,['Kestrel installed 900 heat pumps last year','Pinecrest seniors’ home stayed warm all January','A national lab rates heat pumps as efficient'],1,
   'Pinecrest is a home for frail older people, where a cold room is a real danger. If heat pumps keep them warm through January, they can keep anyone warm.',
   'A big count and a lab rating help, but neither is the one hard case. Pinecrest is: if heat pumps keep frail residents warm through January, they can keep anyone warm.');}},
{part:0,src:'Chapter 4 · The Sinatra Test and Safexpress',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which kind of credibility?',['Sinatra Test','Statistic','Authority'],[
   ['“We kept Pinecrest seniors’ home warm through the coldest week of the year.”',0,'One hard case that settles the doubt on its own.'],
   ['“Kestrel installed 900 heat pumps last year.”',1,'A count. It may help, but no single case stands out.'],
   ['“The city’s chief building inspector endorses our work.”',2,'Trust borrowed from an expert: '+L.g('external','external credibility')+'.'],
   ['“We sealed the city’s 110-year-old library without closing it for a single day.”',0,'The oldest, busiest building in town. If they can seal that, your house is easy.']]);}},

/* ---------- PART 2: STACK THE SOURCES ---------- */
{part:1,src:'Chapter 4 · Edible Fabrics',run(L){
  L.h(L.kick('ex','A real story from the book')+'<h1 class="q">An environmentalist wins over skeptical executives with one factory</h1>');
  L.beats(L.card,[
   ['The skeptics','Bill McDonough helps companies improve both the environment and their profits. Executives tend to distrust environmentalists, so he needs a story that settles the doubt.'],
   ['The mission','In 1993 he and a chemist were hired by Rohner Textil, a Swiss maker of chair fabric, to do what the industry thought impossible: make fabric with no toxic chemicals.'],
   ['The vivid detail','The factory’s leftover scraps were so toxic that Swiss law called them hazardous waste. They had to be shipped abroad to be disposed of.'],
   ['The number','Sixty chemical firms refused to open their books before one agreed. The team tested 8,000 chemicals. Only 38 passed, and McDonough calls those “safe enough to eat.”'],
   ['The twist','When the new process ran, Swiss inspectors thought their instruments were broken: they found nothing in the water leaving the factory. The fabric was actually cleaning the water further.'],
   ['The payoff','Costs fell 20 percent. Workers no longer needed protective gear. The scraps became felt that farmers bought to insulate their crops.']],
   'If McDonough could make that factory both clean and cheaper, executives in any industry have to listen.');}},
{part:1,src:'Chapter 4 · Edible Fabrics',run(L){
  L.h(L.kick('learn','Three sources in one story')+'<h1 class="q">The fabric story uses every inside source at once</h1>'+
   L.prose('The book picks this story because it combines all three ways to build credibility from inside the message:')+
   L.tiers([['eye','Vivid details','Scraps shipped abroad as hazardous waste. Inspectors who thought their equipment had failed.','make it feel real'],
            ['scale','A statistic that shows a relationship','38 safe chemicals out of 8,000. The number isn’t impressive on its own; the tiny share is.','make the point visible'],
            ['star','A Sinatra example','An “impossible” job in a famously dirty industry, done cleanly and more cheaply.','settle the doubt',true,'Key']])+
   L.note('Notice what the story doesn’t need: no celebrity, no outside expert. The message carries its own proof.','info'));
  L.done();}},
{part:1,src:'Chapter 4 · Edible Fabrics',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Theo adds one line to the Pinecrest story: “Residents stopped bringing blankets to dinner.” What does that line do?</h1>');
  L.mc(L.card,['It makes the story feel real and easy to believe','It proves the money saved with a hard number','It borrows trust from an outside expert'],0,
   'It’s a vivid, telling detail. You can picture the dining room, so you believe the rest.',
   'There’s no number and no expert in that line. It’s a vivid detail: you can picture the dining room, so the story feels true.');}},
{part:1,src:'Chapter 4 · Edible Fabrics',pts:4,run(L){
  L.h(L.kick('pr','Build Theo’s story')+'<h1 class="q">Theo is stacking the Pinecrest story the way McDonough stacks his. Sort each piece.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Vivid detail','Statistic','Sinatra example'],[
   ['A home for frail older people, where a cold room is a real health risk',2,'This is the hard case that settles the doubt: if it works there, it works anywhere.'],
   ['Residents stopped bringing blankets to the dining room',0,'You can picture it, so you believe it.'],
   ['The building’s heating bill fell by about half',1,'A number that shows a relationship: before versus after.'],
   ['The lounge armchair is back by the window, where it used to be too cold to sit',0,'A small, specific detail that only someone who was there would know.']],
   'Details make it real, the number makes the change visible, and the hard case settles the doubt.');}},
{part:1,src:'Chapter 4 · The Sinatra Test and Safexpress',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Tap each piece to change it until Theo has a one-line Sinatra Test for doubtful homeowners.</h1>');
  L.sentence(L.card,[['If 900 homes trust','If our heat pumps keep','If a national lab rated'],['our installers','our equipment','Pinecrest’s frail residents'],['warm through a minus-25 week,','highly on paper,','on schedule,'],['we must be the best company.','they can keep your home warm too.','you should trust the experts.']],[1,2,0,1],
   [['A count of homes is a statistic, not one settling case.','A lab rating is an authority, not a case people can picture.'],['Installers aren’t the doubt. The doubt is whether people stay warm.','Equipment is abstract. Frail residents are the hard, human case.'],['On paper is exactly what doubters don’t trust. Use real cold.','Being on time says nothing about winter.'],['That leaps to a brag. Bring it back to the listener’s home.','That swaps back to outside authority.']],
   'If it works there, it works anywhere: the Sinatra Test in one sentence, aimed at the listener’s own home.');}},

/* ---------- PART 3: SEE FOR YOURSELF ---------- */
{part:2,src:'Chapter 4 · Where’s the Beef?',run(L){
  L.h(L.kick('learn','Testable credentials')+'<h1 class="q">The strongest source of credibility may be the audience itself</h1>'+
   L.prose('In 1984, Wendy’s ran an ad where three elderly women admire a giant bun, lift it, and find a tiny patty. One of them demands: “Where’s the beef?” The point was true: Wendy’s burgers really had more beef.')+
   L.prose('The ad used no expert and no statistic. It made a '+L.g('falsifiable','falsifiable claim')+' and dared customers to check it: compare the burgers yourself. The book calls this a '+L.g('testable','testable credential')+'. It lets people try before they buy.')+
   L.flow([['people','Outside','Experts, celebrities, antiauthorities','external'],['book','Inside','Details, statistics, Sinatra examples','internal'],['eye','The audience','“See for yourself”','testable',2]])+
   '<p class="small" style="margin-top:10px">Wendy’s own polls found 47% more customers believed its burger was bigger two months later. Revenue rose 31% in the first full year.</p>');
  L.done();}},
{part:2,src:'Chapter 4 · Where’s the Beef?',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Jun wants mailer readers to believe their house leaks heat. Which line is a testable credential?</h1>');
  L.mc(L.card,['“Our technicians find drafts in most homes they check.”','“Trusted by homeowners across the city since 2009.”','“Hold a tissue by your front door. If it flutters, heat is leaking.”'],2,
   'Readers can check it in ten seconds, in their own hallway. Kestrel no longer has to be believed.',
   'That line asks readers to take Kestrel’s word for it. The tissue test hands the proof to the reader: they check it in their own hallway.');}},
{part:2,src:'Chapter 4 · Testable Credentials',run(L){
  L.h(L.kick('learn','When “see for yourself” backfires')+'<h1 class="q">A true check can carry a false conclusion</h1>'+
   L.prose('In the 1990s, a rumor claimed Snapple supported the Ku Klux Klan. Its “proof” was testable: look at the label and you’ll see a ship and a <b>K</b> in a circle.')+
   L.flow([['eye','The check','Yes, there’s a ship and a circled K','true',2],['alert','The leap','So the company backs the Klan','false',4]])+
   L.prose('The ship came from a picture of the Boston Tea Party. The circled K means kosher. But because the check was real, some people swallowed the conclusion too.')+
   L.note('Testable credentials are powerful for true and false ideas alike. When someone says “see for yourself,” check the leap, not just the step.','alert'));
  L.done();}},
{part:2,src:'Chapter 4 · Testable Credentials',pts:1,run(L){
  L.h(L.kick('pr','Spot the pattern')+'<h1 class="q">Neighbors tell each other: “Look at a heat pump on a frosty morning. It’s puffing steam. Proof they can’t handle the cold.” What is this?</h1><div id="hq"></div>');
  L.mc(L.$('#hq'),['A Sinatra Test that happens to work against Kestrel','A true “see for yourself” step leading to a false conclusion','A statistic that was never put on a human scale'],1,
   'Just like the Snapple label. The steam is real: Theo explains the unit is melting its own frost, which is normal. The leap to “it can’t handle the cold” is false.',
   'There’s no single settling case and no number here. It’s the Snapple pattern: a real thing anyone can see (steam) attached to a false conclusion (it’s failing).');}},
{part:2,src:'Chapter 4 · Testable Credentials',run(L){
  L.h(L.kick('learn','Hand the question to the audience')+'<h1 class="q">A question people answer from their own lives</h1>'+
   L.prose('In his 1980 debate with Jimmy Carter, Ronald Reagan could have listed inflation, lost jobs and rising interest rates. Instead, he asked voters whether they were better off than four years earlier.')+
   L.lanes([['scale','Selling the case','Here are my numbers. Trust me.',3],['eye','Handing it over','Look at your own life and decide.',2]])+
   L.prose('Each voter checked the claim against their own wallet. A testable credential doesn’t have to be a product demo. It can be a question whose answer people already hold.'));
  L.done();}},
{part:2,src:'Chapter 4 · Testable Credentials',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Can the audience check it themselves?',['Testable credential','Take our word for it'],[
   ['Jun’s mailer: “Hold a tissue by your front door on a windy day.”',0,'Readers test it in their own hallway.'],
   ['“Kestrel is rated five stars by the regional builders’ association.”',1,'Readers have to trust the association. That’s outside authority.'],
   ['Theo to Councilmember Brandt: “Pull your own ward’s calls about cold homes from last January.”',0,'Brandt checks the evidence directly, in their own office’s records.'],
   ['“Our heat pumps reach a coefficient of performance of 3.”',1,'Accurate, but homeowners can’t check it. They must take Theo’s word.'],
   ['At a home show, Kestrel runs a heat pump with its outdoor unit inside a freezer. Visitors feel the warm vent.',0,'Visitors feel the warm air with their own hand. Very Wendy’s.']]);}},

/* ---------- PART 4: EXPERIENCE IT ---------- */
{part:3,src:'Chapter 4 · Testable Credentials',run(L){
  L.h(L.kick('learn','Let them feel it')+'<h1 class="q">The coaches who caught themselves</h1>'+
   L.prose('The Positive Coaching Alliance trains youth sports coaches. Its trainers compare a player’s confidence to an “Emotional Tank”: like a car’s gas tank, run it empty and you can’t go far.')+
   L.list([['flame','Drain it','Coaches imagine a teammate just fumbled a key play and say something to drain their tank. The room fills with laughter and clever put-downs.'],
           ['leaf','Fill it','Same mistake, but now they must fill the tank. The room goes quiet. At last someone offers one weak word of comfort.']],2)+
   L.prose('No one had to tell the coaches they criticize more easily than they encourage. They <b>watched themselves do it</b>. The point became a testable credential they experienced.'));
  L.done();}},
{part:3,src:'Chapter 4 · Clinic: Our Intuition Is Flawed, but Who Wants to Believe That?',run(L){
  L.h(L.kick('ex','Idea Clinic from the book')+'<h1 class="q">Two ways a textbook can teach that our hunches are biased</h1>');
  L.beats(L.card,[
   ['The situation','Psychologists know intuition has blind spots, like the '+L.g('availability','availability bias')+'. But people trust their own hunches. How do you make the bias believable?'],
   ['Version 1','Readers first guess: which kills more Americans, homicide or suicide? Floods or tuberculosis? Tornadoes or asthma? Then they learn the second of each pair is far deadlier: asthma kills about eighty times more people than tornadoes.'],
   ['Version 2','The more typical textbook way: define the bias, then report that people in a study guessed wrong on those same pairs.'],
   ['The difference','Version 2 invites a smug thought: those study participants weren’t very sharp. Version 1 makes most readers miss at least one, so they catch the bias in themselves.']],
   'Ask people to predict before you reveal. Their own wrong guess becomes the proof.');}},
{part:3,src:'Chapter 4 · Clinic: Our Intuition Is Flawed, but Who Wants to Believe That?',pts:1,
 solve:async L=>{L.$('#pg').children[0].click();},
 run(L){
  L.h(L.kick('pr','Predict first')+'<h1 class="q">Theo tries the Clinic’s trick in a new homeowner explainer. Make your guess: in most homes Kestrel checks, where does more heat escape?</h1><div id="pg"></div><div id="rv"></div><div id="pq"></div>');
  ['Through the windows','Through the attic'].forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.innerHTML=L.ic(j?'home':'eye')+n;
   b.onclick=()=>{if(L.$('#rv').innerHTML)return;b.classList.add('sel');
    L.$('#rv').innerHTML=L.note(j?'<b>Right: the attic.</b> In most homes Kestrel checks, more heat escapes up through the attic than through the windows. Most homeowners guess windows, because windows are what they can see and feel.':'<b>Most people guess that. It’s the attic.</b> In most homes Kestrel checks, more heat escapes up through the attic than through the windows. You just felt your own hunch miss.','home');
    const q=L.$('#pq');q.innerHTML='<h2 class="sub">Why does Theo ask for a guess before giving the answer?</h2>';
    L.mc(q,['So the fact sounds more exact and scientific','So the explainer needs fewer facts and numbers','So homeowners test the claim on their own hunch'],2,
     'The guess turns the fact into a testable credential. People who guessed windows don’t need persuading; they caught themselves.',
     'The guess isn’t about sounding scientific or saving facts. It lets homeowners test the claim on their own hunch, so they catch themselves, like the readers of Version 1.');};
   L.$('#pg').appendChild(b);});}},
{part:3,src:'Chapter 4 · Rookie Orientation',run(L){
  L.h(L.kick('ex','A real story from the book')+'<h1 class="q">How the NBA made rookies believe the risk of AIDS</h1>');
  L.beats(L.card,[
   ['The problem','NBA rookies are young, newly famous, and have heard about AIDS all their lives. The danger isn’t ignorance. It’s dropping their guard for one night.'],
   ['The setting','Before the season, rookies spend six days at a closed orientation in a hotel: no phones, sessions on everything from the media to money.'],
   ['Night one','One year, a group of women who seemed to be fans appeared in the hotel bar. There was lots of flirting, and players made plans to meet them later.'],
   ['Next morning','The rookies walked into their session and found the same women at the front of the room. One by one they introduced themselves, each saying they were HIV positive.'],
   ['The contrast','The NFL had rookies practice putting a condom on a banana, and later had two former groupies describe trying to seduce players. A strong talk, but the NBA rookies had been fooled themselves.']],
   'Hearing about someone else being fooled is one thing. Being fooled yourself is a credential you can’t argue with.');}},
{part:3,src:'Chapter 4 · Rookie Orientation',pts:1,run(L){
  L.h(L.kick('pr','Make them experience it')+'<h1 class="q">Jun insists the busy mailer is clear. Marisol hears callers who can’t find how to book. How can Marisol make Jun believe it?</h1><div id="hq"></div>');
  L.mc(L.$('#hq'),['Have Jun find the booking number on the mailer in five seconds','Show Jun a chart of call-log complaints about the mailer','Ask Rosa to tell Jun the mailer needs fixing'],0,
   'Jun experiences the problem firsthand, like the rookies or the coaches. Hard to argue with your own five seconds.',
   'A chart or the CEO’s word can be argued with. Letting Jun try to find the number in five seconds makes Jun live the problem, like the NBA rookies.');}},
{part:3,src:'Chapter 4 · Rookie Orientation',run(L){
  L.h(L.kick('learn','Choose the right well')+'<h1 class="q">When one source of credibility runs dry, draw on another</h1>'+
   L.prose('Remember Barry Marshall from the last lesson? His supervisors’ backing didn’t convince doctors, and neither did his careful data. So he drank the bacteria himself and got sick: in effect, a testable credential. See for yourself: drink this and you’ll get an ulcer too.')+
   L.tiers([['people','External','Authorities and antiauthorities','borrowed trust'],
            ['book','Internal','Vivid details, human-scale statistics, Sinatra examples','proof inside the message'],
            ['eye','The audience','Testable credentials: questions, checks, experiences','people prove it to themselves']])+
   L.prose('The most obvious sources, experts and statistics, aren’t always the best. Marshall’s real skill was knowing when to switch wells.'));
  L.done();}},
{part:3,src:'Chapter 4 · Rookie Orientation',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which well is Kestrel drawing on for Councilmember Brandt?',['External','Internal','The audience'],[
   ['A retired city engineer vouches for Kestrel’s work at the council meeting.',0,'Trust borrowed from a respected outsider.'],
   ['The Nwosu family invites Brandt to touch the frost inside their kids’ bedroom window.',2,'Brandt feels the problem firsthand and proves it to themselves.'],
   ['Theo tells Brandt the Pinecrest story, with blankets at dinner and the bill cut in half.',1,'Details, a number and a hard case, all inside the message.'],
   ['Theo asks Brandt to recall how many cold-home complaints their own office took last winter.',2,'Like Reagan’s question, Brandt checks the claim against their own experience.']]);}}
  ]
});
</script>
</body>
</html>
