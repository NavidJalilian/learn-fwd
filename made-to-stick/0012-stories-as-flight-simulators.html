<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stories as Flight Simulators</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0012', title:'Stories as flight simulators', minutes:19, icon:'play',
  goals:['Explain the two things a story gives: simulation and inspiration','Rehearse the process, not just the happy ending','Turn a list of tips into a story people can practice with'],
  parts:['Two powers','Shop talk','Playing along','Flight simulators'],
  read:'Read the first half of chapter 6 for the full nurse story, the Xerox lunchroom and the research on mental practice.',
  glossary:{
    'story-sim':'Simulation (in a story): the know-how a story gives you, a rehearsal of how to act in a situation like it.',
    'story-insp':'Inspiration (in a story): the energy a story gives you to act, by showing someone who did something hard.',
    'mental-sim':'Mental simulation: playing out an event in your head, step by step. It uses many of the same brain areas as really doing it.',
    'flight-sim':'Flight simulator (for the brain): a story that lets you practice a real situation in your head before you face it.'
  },
  cheatsheet:[
    'Stories give two things, both aimed at action: <b>simulation</b> (how to act) and <b>inspiration</b> (the energy to act).',
    'Shop talk teaches: a good story lets listeners <b>play along</b> and test what they would have done.',
    'A story isn’t the same as its tip. It adds hooks (emotion, background) and often a bigger lesson, like “don’t trust the error code blindly”.',
    'There’s no passive audience: we <b>simulate</b> stories in our heads, even where things are in space.',
    'Rehearse the <b>process</b>, not the outcome. Replaying the steps beats picturing success.',
    'Mental practice gave about <b>two-thirds</b> of the benefit of real practice in the research the book cites.',
    'Stories are <b>flight simulators</b>: problems don’t label themselves, so people need practice spotting them in context.',
    'Fight the urge to skip to the tips: a few real stories train better than a bullet list.'
  ],
  steps:[
/* ---------- PART 1: TWO POWERS ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">A new Kestrel installer is about to climb into their first attic. Which will help them more up there?</h1>');
  L.mc(L.card,['A binder line: “Watch for hidden hazards in attics.”','Dana’s tale of the day a hidden roofing nail tore an installer’s glove in a dark attic'],1,
   'You can picture Dana’s attic and feel what went wrong. That’s what this lesson is about: stories let people rehearse.',
   'The binder line is true but gives nothing to picture or practice. Dana’s story lets the new installer replay the moment in their head.');}},
{part:0,src:'Chapter 6 · Stories',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">The nurse who didn’t trust the heart monitor</h1>');
  L.beats(L.card,[
   ['The scare','In a newborn intensive-care unit, a nurse has been watching a baby whose color keeps wavering. Suddenly the baby turns blue-black.'],
   ['The team’s guess','The team assumes a collapsed lung, a common problem for babies on breathing machines, and gets ready to treat the lung.'],
   ['The nurse’s guess','She suspects air is trapped around the heart, squeezing it so it can’t beat. Last time she saw this, the baby died before anyone knew.'],
   ['The monitor','The others point at the heart monitor: a steady, normal rate. She pushes their hands away, demands quiet and listens with a stethoscope. No heartbeat.'],
   ['The save','She starts chest compressions and hands the chief doctor a syringe. The X-ray confirms her call. The air is released and the baby lives.'],
   ['Why the monitor lied','It measures the heart’s electrical signals, not actual beats. The signals were firing, but the trapped air kept the heart from pumping.']],
   'Psychologist Gary Klein collected this story. In high-stakes jobs, stories like it get told and retold because they carry wisdom.');}},
{part:0,src:'Chapter 6 · Stories',run(L){
  L.h(L.kick('learn','What a story gives you')+'<h1 class="q">Two powers, both aimed at action</h1>'+
   L.prose('For medical staff, the nurse story teaches a lot: how to spot this condition, and not to lean too hard on machines. For everyone else, those lessons are of little use. Yet the story still moves us: a nurse stood her ground against the group, and against the chief doctor.')+
   L.flow([['map','Simulation','Knowledge of how to act',''+L.g('story-sim','what to do'),2],['flame','Inspiration','Motivation to act',L.g('story-insp','the push to do it'),3],['play','Action','People do something','',1]])+
   L.prose('The book lines up the last three traits: a <b>credible</b> idea makes people believe, an <b>emotional</b> idea makes them care, and the right <b>story</b> makes them act. This lesson is about simulation. The next one is about inspiration.'));
  L.done();}},
{part:0,src:'Chapter 6 · Stories',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">For Jun, who will never work in a hospital, what does the nurse story mainly offer?</h1>');
  L.mc(L.card,['Inspiration: someone stood firm when it mattered','Simulation: how to treat air trapped by the heart','Credibility: proof that heart monitors are faulty'],0,
   'The medical how-to is for medical staff. For everyone else, it’s an underdog story that inspires.',
   'The how-to is useful only to medical staff, and the monitor worked as designed. For Jun, the value is inspiration: a nurse who stuck to her guns.');}},
{part:0,src:'Chapter 6 · Stories',pts:4,run(L){
  L.h(L.kick('pr','Simulation or inspiration?')+'<h1 class="q">Dana tells new installers about a winter job. Sort what each part of the story gives them.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Simulation (how to act)','Inspiration (energy to act)'],[
   ['Dana found the leak by holding a smoke pencil along the attic hatch edge',0,'That’s a move a new installer can copy on the next job.'],
   ['Dana, the newest crew member that week, spoke up when the lead was about to skip the attic',1,'It shows the courage to speak up, like the nurse.'],
   ['Dana checked the bathroom fan duct before blowing in insulation',0,'A concrete step to rehearse: check ducts first.'],
   ['The family’s grandmother hugged the whole crew on the way out',1,'It gives the work meaning and makes people want to do it well.']],
   'Most good stories carry both. Knowing which is which helps you choose what to tell, and when.');}},

/* ---------- PART 2: SHOP TALK ---------- */
{part:1,src:'Chapter 6 · Shop Talk in the Xerox Lunchroom',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">Copier repairmen swapping stories over lunch</h1>');
  L.beats(L.card,[
   ['The setting','Researcher Julian Orr spent time with Xerox copier repairmen and noticed how much they swapped stories, for example over cards at lunch.'],
   ['The story','One explains: after a recent design change, a dead part (a dicorotron) no longer fries the board. Instead the machine crashes and shows an error code, E053, that points to an unrelated area.'],
   ['The chase','He and a colleague spent four hours chasing that code. In the end it was just one dead dicorotron.'],
   ['What changed','Anyone at the table who hadn’t met this now knows: an E053 may be lying. Their mental picture of that code has been updated.']],
   'It’s part entertainment and part instruction. Shop talk carries clues about how to respond to the world.');}},
{part:1,src:'Chapter 6 · Shop Talk in the Xerox Lunchroom',run(L){
  L.h(L.kick('learn','Why the story beats the memo')+'<h1 class="q">The story is not the same as its tip</h1>'+
   L.prose('The repairman could have said “I had a bad morning.” Or skipped to the end: “It was a dead dicorotron.” The company could have emailed one line: watch out for false E053 codes.')+
   L.list([['play','Listeners play along','The story gives enough detail for each listener to test how they would have handled it.'],
     ['layers','More hooks','Frustration at being misled, the history of the design change. The Velcro theory: more hooks, better recall.'],
     ['bulb','A bigger lesson','Underneath sits a lesson for every future job: don’t trust an error code blindly.']],1)+
   L.prose('A one-line warning passes on a fact. The story passes on a way of thinking.'));
  L.done();}},
{part:1,src:'Chapter 6 · Shop Talk in the Xerox Lunchroom',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">What does the E053 story give that the one-line email can’t?</h1>');
  L.mc(L.card,['A more exact list of which parts can fail','A chance to test your own moves along the way','A shorter way to share the same warning'],1,
   'Listeners mentally try their own approach as the chase unfolds. The email only hands over the conclusion.',
   'The email is shorter and just as exact. What it lacks is the chance to play along and test what you would have done.');}},
{part:1,src:'Chapter 6 · Shop Talk in the Xerox Lunchroom',pts:1,run(L){
  L.h(L.kick('pr','Find the bigger lesson')+'<h1 class="q">At lunch Dana tells this one: the smoke pencil showed no draft at the windows, yet the bedroom was freezing. Three hours later the crew found a gap behind the knee wall, where the attic meets the room. What lesson will new installers carry to every job?</h1><div id="hq"></div>');
  L.mc(L.$('#hq'),['Every knee wall in town needs extra insulation','Smoke pencils don’t work well around windows','The obvious suspect isn’t always the real leak'],2,
   'Like the repairmen’s distrust of the E053 code, this travels to every house, not just ones with knee walls.',
   'That’s too narrow, or not what happened: the pencil worked fine at the windows. The lesson that travels is to look past the obvious suspect.');}},
{part:1,src:'Chapter 6 · Shop Talk in the Xerox Lunchroom',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Tap each piece until the sentence says how Dana should share the knee-wall lesson.</h1>');
  L.sentence(L.card,[['Dana should email the tip “check knee walls”','Dana should tell the whole three-hour hunt'],['so installers get the answer faster','so installers can test their own moves'],['and stop trusting the obvious suspect.','and memorize one house’s layout.']],[1,1,0],
   [['A one-line tip hands over the answer but skips the chase that teaches.'],['Speed isn’t the goal. Playing along is what makes the lesson stick.'],['The point isn’t one house. It’s a habit for every house.']],
   'Same as the Xerox lunchroom: the story lets people play along and carry a bigger lesson to every job.');}},

/* ---------- PART 3: PLAYING ALONG ---------- */
{part:2,src:'Chapter 6 · The Un-passive Audience',run(L){
  L.h(L.kick('learn','There is no passive audience')+'<h1 class="q">We don’t just watch a story. We run it.</h1>'+
   L.prose('In one study, people read a short story on a computer. Some read that John <b>put on</b> his sweatshirt before jogging. Others read that he <b>took it off</b>.')+
   L.flow([['person','Put it on','The sweatshirt jogs along with John','',2],['home','Took it off','The sweatshirt is left back at the house','',4]],false)+
   L.prose('Two sentences later the story mentioned the sweatshirt again. Readers who thought it was left behind took <b>longer</b> to read that line, as if their minds had to go back and fetch it.')+
   L.prose('So we don’t just see pictures. We '+L.g('mental-sim','simulate')+' the story, even where things are in space. When we hear a story, our minds move from room to room.'));
  L.done();}},
{part:2,src:'Chapter 6 · The Un-passive Audience',pts:1,
 solve:async L=>{L.$('#po').children[1].click();L.$('#run').click();},
 run(L){
  let p=null;const N=['Control: tips only','Replay how it happened','Picture it solved'],C=['var(--h3)','var(--ok-strong)','var(--h2)'],E=[30,85,40];
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">UCLA students each picked a stressful problem in their lives. Three groups, one week. Which group coped best?</h1>'+
   L.list([['Control','Got brief tips on problem-solving and went home.'],['Replay how it happened','Pictured, step by step, how the problem arose: what they did, said, where they were.'],['Picture it solved','Pictured the relief and pride of having solved it.']],2)+
   '<div id="po" style="margin-top:10px"></div>'+
   '<div id="race" hidden><div style="display:flex;align-items:center;justify-content:space-between;margin-top:6px"><div><div class="small">Simulated time</div><div class="week" id="dy">Day 0</div></div><button class="btn pri" id="run">'+L.ic('play')+'Run the week</button></div>'+
   N.map((n,j)=>'<div class="meterrow"><div class="lb">'+n+'</div><div class="meter"><div id="m'+j+'" style="background:'+C[j]+'"></div></div></div>').join('')+
   '<p class="small">Bars are illustrative. The book reports which group did better, not exact scores.</p></div>');
  N.forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=n;b.onclick=()=>{if(p!==null)return;p=j;b.classList.add('sel');L.$('#race').hidden=false;};L.$('#po').appendChild(b);});
  L.$('#run').onclick=function(){this.remove();let d=0;
    const t=setInterval(()=>{d++;const dy=L.$('#dy');if(!dy){clearInterval(t);return;}dy.textContent='Day '+d;
      E.forEach((e,j)=>{const el=L.$('#m'+j);if(el)el.style.width=Math.round(e*(j===1?Math.min(1,0.4+d*0.09):d/7))+'%';});
      if(d>=7){clearInterval(t);L.award(p===1);
        L.sheet(p===1?'ok':'no',p===1?'You called it!':'Replaying the steps won','The students who replayed how the problem unfolded did better on almost every measure. They felt better from the first night, and by the week’s end they were more likely to have acted, asked for help, and learned something. Picturing success wasn’t enough.');L.done();}},250);};}},
{part:2,src:'Chapter 6 · The Un-passive Audience',run(L){
  L.h(L.kick('learn','Why mental rehearsal works')+'<h1 class="q">Imagining uses much of the same machinery as doing</h1>'+
   L.prose('Imagine a flashing light and your brain’s seeing areas light up. Imagine drinking lemon juice while drinking water, and you make more saliva.')+
   L.list([['shield','It calms fears','Phobia treatment walks people step by step toward what they fear, relaxing at each step. It rehearses the events, not the happy ending.'],
     ['list','It helps you plan','Picture the trip to the store and you remember the dry cleaning next door. Picture the tense talk with your boss and you have better words ready.'],
     ['star','It builds skill','Across 35 studies with over 3,000 people, picturing a task from start to finish gave about <b>two-thirds</b> of the benefit of real practice.']],3)+
   L.note('Mental practice isn’t as good as the real thing, but it’s the next best thing. And a good story is a ready-made mental practice session.','info'));
  L.done();}},
{part:2,src:'Chapter 6 · The Un-passive Audience',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">A new installer is nervous about their first homeowner who gets upset mid-job. What should Dana have them rehearse?</h1>');
  L.mc(L.card,['How proud they’ll feel when the homeowner thanks them','The moment the homeowner complains, and each step they take','A list of calming words to memorize word for word'],1,
   'Rehearse the process: what the homeowner says, what you do, what happens next. That’s what helped the UCLA students.',
   'Picturing the happy ending felt nice but helped the UCLA students far less. And memorized words aren’t a walk-through. Rehearse the steps of the moment itself.');}},
{part:2,src:'Chapter 6 · The Un-passive Audience',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Process or outcome rehearsal?',['Rehearses the process','Pictures the outcome'],[
   ['Theo pictures the council clapping at the end of the grant hearing.',1,'A happy ending. Pleasant, but it won’t prepare Theo for the hard questions.'],
   ['Theo walks through Councilmember Brandt’s likely questions and their answers, one by one.',0,'Step by step through the event itself, like the UCLA replayers.'],
   ['Marisol replays last week’s worst call, moment by moment, to see where it went wrong.',0,'Retracing how a problem unfolded is exactly what worked best in the study.'],
   ['Jun imagines the mailer being a huge hit with the whole city.',1,'That’s visualizing success, the approach the study found weaker.']]);}},

/* ---------- PART 4: FLIGHT SIMULATORS ---------- */
{part:3,src:'Chapter 6 · The Un-passive Audience',run(L){
  L.h(L.kick('learn','Stories as flight simulators')+'<h1 class="q">Problems don’t arrive with labels on them</h1>'+
   L.prose('Pilots train in flight simulators, not with stacks of flash cards. The more training looks like the real situation, the better it works. The book’s claim: the right story is a '+L.g('flight-sim','flight simulator')+' for the brain.')+
   L.lanes([['x','Knowing the fix','A doctor can treat appendicitis once it’s named. Students can solve equations once they’re written out.',4],
            ['eye','Spotting the problem','The hard part is telling appendicitis from a stomach bug, or seeing the equation inside a word problem.',2]])+
   L.prose('Stories put knowledge back into the messy context where it’s needed, so people learn to recognize the problem as well as the answer.'));
  L.done();}},
{part:3,src:'Chapter 6 · Clinic: Dealing with Problem Students',run(L){
  L.h(L.kick('ex','Idea Clinic')+'<h1 class="q">Two ways to teach professors to handle a disruptive student</h1>');
  L.beats(L.card,[
   ['Message 1 · Tips','A university’s guide lists advice: stay calm, don’t get defensive, meet the student privately, listen and acknowledge their feelings.'],
   ['What’s wrong','It’s too abstract and too obvious to stick. Nobody thinks you should panic. If it were truly common sense, why publish it?'],
   ['Message 2 · A story','Professor Alyson Buckman describes a student who talked loudly at the back and challenged everything. She called him in, with witnesses nearby. He sat in sunglasses, defiant, and said little.'],
   ['The turn','Only when she told him other students were complaining did he change, and he caused no more trouble. Her lesson: he was performing for his classmates, and they didn’t want it.'],
   ['Why it works','The tips are <i>shown</i> inside the story: calm, a private meeting. And the fix, peer pressure, is concrete and unexpected. We care about a person more than a bullet list.']],
   'The book’s punch line: most training departments would write Message 1. Fight the urge to skip straight to the tips.');}},
{part:3,src:'Chapter 6 · Clinic: Dealing with Problem Students',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Why does the professor’s story train better than the list of tips?</h1>');
  L.mc(L.card,['It covers more situations than the list does','It comes from a professor, so it is more credible','It lets you walk through the process as it unfolds'],2,
   'You follow Buckman step by step, so you rehearse the process, and you meet an unexpected fix along the way.',
   'It actually covers one case, not more, and credibility isn’t the main point. Its power is that you simulate the process with her.');}},
{part:3,src:'Chapter 6 · Clinic: Dealing with Problem Students',pts:1,run(L){
  L.h(L.kick('pr','Put it in order')+'<h1 class="q">Dana is turning the binder page “Talking with homeowners” into a story new installers can rehearse. Put the story in order.</h1>');
  L.order(L.card,['Mr. Duarte meets the crew at the door, arms crossed: the last contractor scratched their floors.','Dana doesn’t argue, and asks them to show where the scratches are.','Dana lays the floor runners while Mr. Duarte watches, and asks them to inspect the floors at the end.','By lunch Mr. Duarte has stopped hovering and is bringing the crew coffee.','Mr. Duarte checks the floors, finds them spotless, and asks about a heat-pump quote.'],
   'Told in order, new installers can follow each move and rehearse it: listen, show the protection, invite inspection. The tips “stay calm” and “respect the home” are shown, not told.');}},
{part:3,src:'Chapter 6 · Clinic: Dealing with Problem Students',pts:1,run(L){
  L.h(L.kick('pr','Fix the training')+'<h1 class="q">Marisol’s guide for new customer-care staff says: “Stay calm. Listen. Don’t argue. Offer a solution.” New staff still freeze on hard calls. What should Marisol change?</h1><div id="hq"></div>');
  L.mc(L.$('#hq'),['Add a few real calls, told step by step, that show how a hard one turned around','Make the tips bold, number them, and test staff on them each month','Shorten the guide to one line so it’s easier to remember'],0,
   'Real calls are flight simulators: staff rehearse how a hard call unfolds and spot the warning signs next time.',
   'Bolder or shorter tips are still tips: abstract and obvious. Staff need to rehearse the process, and real calls told step by step let them.');}},
{part:3,src:'Chapter 6 · The Un-passive Audience',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Flight simulator or flash card?',['Flight simulator','Flash card'],[
   ['A slide in Theo’s deck: “Check for ice on the outdoor unit in winter.”',1,'A fact with no context. True, but nothing to rehearse.'],
   ['Theo’s story of a night call when a heat pump iced over, and how the tech worked it out.',0,'Listeners follow the tech step by step and learn to spot the problem next time.'],
   ['Dana walks new hires through the raccoon-in-the-attic job, minute by minute.',0,'A real job told in order lets them rehearse a surprise before they meet one.'],
   ['A poster in the break room: “Safety first, every job.”',1,'Too abstract to simulate. Everyone already agrees with it.']]);}}
  ]
});
</script>
</body>
</html>
