<!doctype html>
<html lang="en">

<title>Hold Attention With Curiosity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0005', title:'Hold attention with curiosity', minutes:19, icon:'eye',
  goals:['Turn a flat summary into a mystery people want solved','Open a knowledge gap before you fill it, even with a know-it-all audience','Set a big, unexpected goal that pulls people forward without freezing them'],
  parts:['Mysteries','The gap','Knowledge first','Big gaps'],
  read:'Read the second half of chapter 2, “Unexpected,” for the full rings-of-Saturn, Roone Arledge and Sony stories.',
  glossary:{
    'second':'Second-level unexpectedness: not a one-time surprise, but a journey whose ending you can’t predict, so your interest lasts.',
    'turning':'Turning point: a moment in a story that raises a new question, so the audience wonders what will happen next.',
    'overconfidence':'Overconfidence: our habit of believing we know more than we do, which hides the gaps that make us curious.',
    'abyss':'Abyss vs. gap: when people know almost nothing about a topic, there’s no gap to feel. You first give them enough context to turn the abyss into a gap.'
  },
  cheatsheet:[
    'Surprise <b>gets</b> attention. Curiosity <b>keeps</b> it, by opening a mystery people want solved.',
    'A one-time surprise is first-level. A <b>journey</b> with an unknown ending is second-level, and lasts longer.',
    '<b>Gap theory:</b> curiosity is the itch of a felt gap in what we know. Open the gap <i>before</i> you fill it.',
    'Open gaps with a puzzle, with “someone knows what you don’t,” with an unknown outcome, or by asking for a prediction.',
    'Plan the questions you want your audience to wonder about, not just the facts you must deliver.',
    'People are <b>overconfident</b>. Make them commit to a guess, or let them disagree, so they feel the gap.',
    'Gaps start with knowledge. If people know too little, give context first; then drop clues, one at a time.',
    'Big goals like a pocketable radio or a man on the moon open huge gaps, <b>but not paralyzing ones</b>.'
  ],
  steps:[
/* ---------- PART 1: MYSTERIES ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Theo gives two 20-minute talks with the same facts. Talk A lists the facts in order. Talk B opens with a puzzle nobody in the room can answer yet. Which talk is the room still following at minute 18?</h1>');
  L.mc(L.card,['Talk A, because order is easy to follow','Talk B, because people want the answer'],1,
   'People hang on to find out how a puzzle ends. This lesson is about using that pull on purpose.',
   'Order helps people understand, but it gives them no reason to stay. A puzzle keeps them waiting for the answer. That pull is what this lesson is about.');}},
{part:0,src:'Chapter 2 · Keeping People’s Attention: The Mystery of the Rings',run(L){
  L.h(L.kick('learn','From getting attention to keeping it')+'<h1 class="q">A surprise lasts seconds. Some messages need minutes.</h1>'+
   L.prose('The last lesson used surprise to <b>get</b> attention. That works for quick ideas. But a 40-slide deck or a long article needs people to <b>stay</b>. How do you keep them?')+
   L.prose('The psychologist Robert Cialdini wanted to explain science better. He collected the best pieces scientists had written for ordinary readers and looked for what they shared.')+
   L.flow([['book','Expected','Clear structure, vivid examples, easy language','what he thought he’d find'],['bulb','Unexpected','The best pieces all opened with a mystery','what he actually found',2]])+
   L.prose('They described something that seemed not to make sense, then invited the reader along to solve it.'));
  L.done();}},
{part:0,src:'Chapter 2 · Keeping People’s Attention: The Mystery of the Rings',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">How an astronomer made dust exciting</h1>');
  L.beats(L.card,[
   ['The puzzle','An astronomer opens an article with a question: what are the rings of Saturn made of?'],
   ['Deeper','Three respected teams of scientists studied the same rings and reached three different answers: gas, dust and ice. How could that be?'],
   ['The journey','For twenty pages the reader follows the scientists through leads, dead ends and clues.'],
   ['The answer','Dust. Ice-covered dust, which explains some of the confusion. Cialdini didn’t care about dust at all, yet he raced through every page.'],
   ['In class','Cialdini tried mysteries in his lectures. One day the bell rang before he revealed the answer. Nobody packed up, and students protested when he tried to stop.']],
   'Cialdini’s point: the satisfying “Aha!” needs a “Huh?” before it. A mystery creates a need for closure.');}},
{part:0,src:'Chapter 2 · Keeping People’s Attention: The Mystery of the Rings',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Why did Cialdini keep reading about dust he didn’t care about?</h1>');
  L.mc(L.card,['The topic mattered a lot in his daily life','He needed to know how the puzzle ended','The article was short and simply written'],1,
   'The article posed a puzzle, then made him wait for the answer. That need for closure carried him through twenty pages.',
   'Cialdini said the topic was irrelevant to his life, and twenty pages isn’t short. What kept him going was a puzzle he wanted to see solved.');}},
{part:0,src:'Chapter 2 · Curiosity in Hollywood Screenplays',run(L){
  L.h(L.kick('learn','Two levels of unexpected')+'<h1 class="q">A surprise is a moment. A mystery is a journey.</h1>'+
   L.tiers([['alert','First level: a one-time surprise','Your '+L.g('guessing','guessing machine')+' fails, you fix it, done. Nordstrom staff warming up customers’ cars? Surprise, then it’s over.','Gets attention for a moment'],
            ['compass','Second level: an unfolding mystery','You know where you’re headed (the answer) but not how you’ll get there. The rings of Saturn.','Holds attention for a long time',true,'This lesson']])+
   L.prose('Screenwriting teacher Robert McKee says the same about movies. A great script makes every scene a '+L.g('turning','turning point')+' that raises a question: <i>What will happen next? How will it turn out?</i> That question is why we sit through bad films to the end.'));
  L.done();}},
{part:0,src:'Chapter 2 · Curiosity in Hollywood Screenplays',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Quick surprise or mystery?',['One-time surprise','Unfolding mystery'],[
   ['Theo’s fact card: “Most homes we check lose more heat through the attic than the windows.”',0,'One fact breaks one guess, and it’s over in a second. Useful, but it won’t hold a room for long.'],
   ['Theo opens a talk: two houses on one street, same size, and one bill is double the other. The talk then works out why.',1,'There’s a question with no obvious answer, and the talk is the journey to it.'],
   ['Dana’s training video: a crew opens an attic hatch and finds a raccoon living there.',0,'A quick jolt to the guessing machine. Once you’ve seen it, there’s nothing left to wonder about.'],
   ['Marisol’s newsletter: one clue each month about the coldest house Kestrel ever fixed, solved in December.',1,'Readers know where it’s heading but not how. That keeps them opening each issue.']]);}},

/* ---------- PART 2: THE GAP ---------- */
{part:1,src:'Chapter 2 · The “Gap Theory” of Curiosity',run(L){
  L.h(L.kick('learn','The gap theory of curiosity')+'<h1 class="q">Curiosity is the itch of a gap in what you know</h1>'+
   L.prose('In 1994 the economist George Loewenstein offered a simple explanation of interest. We get curious when we notice a '+L.g('gap','knowledge gap')+': something we want to know but don’t.')+
   L.flow([['check','What I know','“Same street, same size”'],['alert','The gap','“…so why is one bill double?”','',2],['eye','I need to know','I keep listening','',3]])+
   L.prose('Gaps feel uncomfortable, like an itch we must scratch. Movies ask “What will happen?”, sports ask “Who will win?”, crosswords ask “What’s the word?” Each one opens a gap.')+
   L.note('<b>The big lesson:</b> open the gap <i>before</i> you fill it. Our habit is to hand people facts. First they must feel they need those facts.','bulb'));
  L.done();}},
{part:1,src:'Chapter 2 · The “Gap Theory” of Curiosity',run(L){
  L.h(L.kick('learn','How to open a gap')+'<h1 class="q">Four ways to show people what they’re missing</h1>'+
   L.list([['chat','Pose a puzzle','Ask a question that confronts people with something they can’t yet explain.'],
     ['person','Someone else knows','Point out that another person knows something they don’t.'],
     ['clock','Leave the outcome open','Use a situation whose ending is still unknown, like an election or a game.'],
     ['target','Ask for a prediction','Have people guess what will happen. That opens two gaps: what will happen, and was I right?']],2)+
   L.prose('Evening-news teasers are the loud, silly version: they hint that a local restaurant was caught with something gross, but not which one. You didn’t care until you learned you didn’t know.'));
  L.done();}},
{part:1,src:'Chapter 2 · Clinic: An Internal Presentation on Fund-raising',run(L){
  L.h(L.kick('ex','Idea Clinic from the book')+'<h1 class="q">Same facts, two openings: a theater reports on fund-raising</h1>');
  L.beats(L.card,[
   ['The job','A theater’s fund-raising manager reports to the board at year’s end. The book makes up two versions of the talk.'],
   ['Version 1','A tidy summary: we targeted donors under 35, ran a phone campaign, and got almost a 20% response, which we call a success. Safe, logical, and forgettable.'],
   ['Version 2','It opens with a puzzle: people under 35 are 40% of our audience but give only 10% of donations. Why? Our theory: they don’t know how much we rely on gifts.'],
   ['The cliffhanger','So we called them with a short overview. We hoped for 10% to respond. “Before I tell you what happened, let me explain how we set it up…”'],
   ['Why it works','The board now wonders what happened and whether the theory was right. The facts are the same; only the <b>structure</b> changed.']],
   'It’s not a thrilling mystery, and it doesn’t need to be. Our minds are generous to the mystery format. A little goes a long way.');}},
{part:1,src:'Chapter 2 · Clinic: An Internal Presentation on Fund-raising',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Jun’s quarterly update starts: “This quarter we mailed 20,000 flyers and about 4 in 100 people booked a check.” Which opening opens a gap instead?</h1>');
  L.mc(L.card,['“We mailed 20,000 flyers, and here are the results in order.”','“About 4 in 100 booked a check, a small gain on last year.”','“96 in 100 people ignored a free offer. We tested one reason why.”'],2,
   'It puts a puzzle in front of the room (why ignore something free?) and promises a test with an unknown result.',
   'That still just hands over the facts. The gap-opening version asks why 96 in 100 people would ignore something free, then promises a test result.');}},
{part:1,src:'Chapter 2 · Clinic: An Internal Presentation on Fund-raising',pts:1,
 solve:async L=>{L.$('#play').click();},
 run(L){
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Theo runs a heat-pump evening for homeowners. Two openings, same slides after. Press play to jump 15 minutes in.</h1>'+
   L.lanes([['list','Opening A: summary','“Tonight: how heat pumps work, their efficiency ratings, and costs.”<div class="res" id="ra"></div>',1],
            ['chat','Opening B: mystery','“It’s minus 15 outside. How can a machine pull heat out of air that cold? Three neighbors gave me three different answers.”<div class="res" id="rb"></div>',2]])+
   '<button class="btn pri" id="play" style="margin-top:14px">'+L.ic('play')+'15 minutes later</button><div id="pq"></div>');
  L.$('#play').onclick=function(){this.remove();
    L.$('#ra').innerHTML='<span style="color:var(--no)">Phones are out. A few people slip out at the coffee break.</span>';
    L.$('#rb').innerHTML='<span style="color:var(--ok)">People lean in at each clue, and someone shouts their own guess.</span>';
    const q=L.$('#pq');q.innerHTML='<h2 class="sub">What did Opening B do that A didn’t?</h2>';
    L.mc(q,['It made people want an answer first','It gave people more technical facts'],0,
     'Same facts, new order: B opened a gap before filling it, and even mimicked the rings of Saturn with three conflicting answers.',
     'Both talks share the same slides. B just opened a gap first, so the facts arrived as answers people wanted.');};}},
{part:1,src:'Chapter 2 · The “Gap Theory” of Curiosity',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Tap each piece until Jun’s mailer opens a gap instead of listing benefits.</h1>');
  L.sentence(L.card,[['Here are ten reasons','Why do so many'],['brand-new homes','homes in our city'],['still feel cold?','could save energy.'],['Our checks found out.','Book a check today.']],[1,0,0,0],
   [['A list of reasons is a summary. It fills a gap nobody feels yet.'],['Too vague to puzzle anyone. A specific case (new, yet cold) is what feels strange.'],['Saving energy is no puzzle. A new home that still feels cold doesn’t make sense, and that’s the gap.'],['Jumping to the ask closes the door. Hinting that someone knows the answer keeps the gap open.']],
   'A specific puzzle, plus a hint that Kestrel knows the answer. Now the reader wants the rest of the mailer.');}},
{part:1,src:'Chapter 2 · The “Gap Theory” of Curiosity',pts:4,run(L){
  L.h(L.kick('pr','Which way to open the gap?')+'<h1 class="q">Sort each Kestrel opener by how it opens the gap.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Pose a puzzle','Someone knows','Open outcome','Predict'],[
   ['Theo: “Write down how much of a home’s heat you think escapes through the attic. Then we’ll check.”',3,'Asking for a guess opens two gaps: the answer, and whether you were right.'],
   ['Jun’s mailer: “Your neighbor on Elm Street found out where their house leaks heat. Do you know where yours does?”',1,'Someone else knows something the reader doesn’t. That stings a little, so they read on.'],
   ['Rosa’s update: “Two crews are racing to seal the most homes this winter. Winner announced in March.”',2,'Like a game in progress, nobody knows the ending yet.'],
   ['Dana: “Why would a house with brand-new windows still run up a huge heating bill?”',0,'A question that doesn’t seem to make sense invites people to solve it.']],
   'Four routes, one goal: make people feel what they’re missing before you tell them.');}},

/* ---------- PART 3: KNOWLEDGE FIRST ---------- */
{part:2,src:'Chapter 2 · Battling Overconfidence',run(L){
  L.h(L.kick('learn','The know-it-all problem')+'<h1 class="q">People can’t feel a gap they think they don’t have</h1>'+
   L.prose('Gaps only work if people notice them, and we tend to be '+L.g('overconfidence','overconfident')+'. In one study, people listed fixes for their university’s parking problem. On average they missed over 70% of the best ideas an expert panel found, yet they guessed they had found 75%.')+
   L.prose('Two ways to break through:')+
   L.lanes([['target','Make them commit','A physics professor, Eric Mazur, stops class to pose a question and has students vote publicly. Committing to an answer makes them curious whether they were right.',2],
            ['people','Let them disagree','Kids who were steered into disagreement were far more curious than kids who agreed easily. 45% gave up recess to watch a film on the topic, against 18%.',3]]));
  L.done();}},
{part:2,src:'Chapter 2 · Gaps Start with Knowledge',run(L){
  L.h(L.kick('learn','Gaps start with knowledge')+'<h1 class="q">Know a little more, and you notice what’s missing</h1>'+
   L.prose('You might think knowing more makes us less curious. Loewenstein argues the opposite. Someone who knows 17 state capitals feels proud. Someone who knows 47 feels the 3 they’re missing.')+
   L.prose('That’s why gossip and human-interest stories grip us: we know a lot about the people, but not the missing pieces.')+
   L.note('If people know almost nothing, there’s no gap, just an '+L.g('abyss','abyss')+'. First give them enough knowledge to turn the abyss into a gap. Remind them what they know, then point at what they don’t.','layers')+
   L.prose('Then <b>sequence</b> it. A movie treasure map shows a few landmarks and a big X, not door-to-door directions. Drop one clue, then another.'));
  L.done();}},
{part:2,src:'Chapter 2 · Gaps Start with Knowledge',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">How Roone Arledge made strangers care about college football</h1>');
  L.beats(L.card,[
   ['The problem','In the 1960s, ABC won the rights to college football. Most fans care only about their own school, and ABC could show just a few games in each region.'],
   ['The old way','Cameras pointed at the field and waited. The fans, the campus, the rivalry: all ignored.'],
   ['The memo','Roone Arledge, 29, wrote a three-page memo: before kickoff, show the town, the campus, the crowd, and what this game means to both schools.'],
   ['The result','Viewers who knew nothing about these teams got enough backstory to care who won. ABC asked Arledge to produce a game his way two days later.'],
   ['Later','He used the same idea on <i>Wide World of Sports</i>, for events most viewers had never seen, and went on to run ABC Sports and ABC News.']],
   'Arledge turned an abyss into a gap. Give people context first, and they start to care about what they don’t know.');}},
{part:2,src:'Chapter 2 · Battling Overconfidence',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Dana’s new installers say “We already know ladder safety” and tune out that chapter. What should Dana try first?</h1>');
  L.mc(L.card,['Skip ladder safety, since they say they know it','Read the binder’s ladder rules aloud, slowly','Have everyone vote on a tricky ladder question first'],2,
   'A public vote makes them commit. Once some find out they were wrong, they feel the gap and want the rest.',
   'Their confidence is the problem, so neither skipping nor reading louder helps. A public vote makes them commit to a guess, and a wrong guess reveals the gap.');}},
{part:2,src:'Chapter 2 · Gaps Start with Knowledge',pts:1,run(L){
  L.h(L.kick('pr','Sequence the clues')+'<h1 class="q">Jun builds a five-minute community talk around one customer’s drafty house. Put the steps in the best order.</h1><div id="od"></div>');
  L.order(L.$('#od'),['Start with what people know: a cozy 1920s house, heat turned up','Show the gap: so why was its heating bill double the neighbors’?','Drop a clue: it isn’t the furnace, and it isn’t the windows','Reveal: the heat was escaping through the attic'],
   'Known ground first, then the gap, then a clue, then the answer. Like a treasure map: a landmark and an X, not every turn at once.',['1st','2nd','3rd','4th']);}},
{part:2,src:'Chapter 2 · Gaps Start with Knowledge',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Gap or abyss? What should the speaker do first?',['Open the gap now','Give context first'],[
   ['Retired engineers at a library talk who already know how furnaces work.',0,'They know plenty. A sharp puzzle will land right away.'],
   ['Teenagers at a school fair who have never thought about where a home’s heat goes.',1,'There’s no gap yet, just an abyss. Show them a few things first, like a frosty window, so they have something to wonder about.'],
   ['Homeowners who each just opened a big winter heating bill.',0,'They know their bill well. “Where did that money go?” is a gap they already half-feel.'],
   ['Parks-department staff who know nothing about home energy, at a city briefing.',1,'Like Arledge’s viewers, they need some backstory before a question can hook them.']]);}},

/* ---------- PART 4: BIG GAPS ---------- */
{part:3,src:'Chapter 2 · Walking on the Moon and Radios in Pockets',run(L){
  L.h(L.kick('ex','Two stories from the book')+'<h1 class="q">Two unexpected goals that drove years of work</h1>');
  L.beats(L.card,[
   ['Sony, early 1950s','A struggling young company in Tokyo. Bell Labs, which invented the transistor, doubts a transistor radio is even possible.'],
   ['The choice','Ibuka, Sony’s lead technologist, wants his team on transistor radios. But “transistor radio” is about technology, not value. So what? He proposes a <b>pocketable radio</b>.'],
   ['Why it shocked','Radios were furniture, built by cabinetmakers. And “Made in Japan” then meant cheap. The goal sounded absurd.'],
   ['The result','In 1957 Sony released the TR-55, the first pocketable transistor radio. It sold 1.5 million units and put Sony on the map.'],
   ['Kennedy, 1961','At the end of a speech full of ordinary requests, JFK proposes landing a man on the moon and bringing him home safely within the decade.'],
   ['The result','That goal kept tens of thousands of people, in dozens of organizations, working for almost ten years.']],
   'Neither was a quick surprise. Each opened a gap so big and so clear that people spent years closing it.');}},
{part:3,src:'Chapter 2 · Walking on the Moon and Radios in Pockets',run(L){
  L.h(L.kick('learn','Why these goals worked')+'<h1 class="q">Audacious, but not paralyzing</h1>'+
   L.list([['alert','Surprise','Radios don’t fit in pockets. People don’t walk on the moon.'],
     ['eye','Insight','Instead of slow, small steps, each goal showed a sudden picture of where the world could go, and why.'],
     ['compass','A gap people can start on','Huge, but not hopeless. Engineers heard “moon” and began listing what to solve first.']],3)+
   L.flow([['pointer','Too small','No gap: nothing to wonder about','',1],['target','Just right','Pocket radio, man on the moon','',2],['x','Too big','Man on Mercury, implantable radio','',4]],false)+
   '<p class="small" style="margin-top:10px">A gap that looks impossible doesn’t spark curiosity. It freezes people.</p>');
  L.done();}},
{part:3,src:'Chapter 2 · Walking on the Moon and Radios in Pockets',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Why did Kennedy’s moon goal keep so many people working for years?</h1>');
  L.mc(L.card,['It came with a detailed step-by-step plan','It opened a huge gap that still looked solvable','It was one item in a long list of requests'],1,
   'People could see the goal clearly and could start on step one. A big, clear gap kept them pulling for a decade.',
   'It wasn’t the plan or the list. The moon goal stood out from that list as a huge but solvable gap, so engineers started working out the first steps.');}},
{part:3,src:'Chapter 2 · Walking on the Moon and Radios in Pockets',pts:1,
 solve:async L=>{const g=L.$('#gd').children;g[0].click();g[1].click();g[2].click();},
 run(L){
  const G=['Install 5% more heat pumps than last year','No Kestrel customer ever needs a coat indoors','Every home in the city heated free, forever'],
   R=[['Crews shrug. It’s last year plus a bit. Nothing to wonder about, so nothing to chase.','no'],
      ['Crews start talking: “First we’d need to fix attics faster, then…” A huge gap, but they can see step one.','ok'],
      ['Crews laugh. Nobody knows where to begin, so nobody begins.','no']];const seen=new Set();
  L.h(L.kick('pr','Size the gap')+'<h1 class="q">Rosa wants a ten-year goal for Kestrel’s 12 crews. Tap each one to see how the crews react.</h1><div id="gd"></div>'+
   '<div style="background:var(--soft);border-radius:16px;padding:14px;margin:8px 0 6px;min-height:90px"><div id="gr" class="small">Choose a goal above.</div></div><div id="gq"></div>');
  G.forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.innerHTML=L.ic('target')+n;b.onclick=()=>{[...L.$('#gd').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(j);
    L.$('#gr').innerHTML='<span style="color:var(--'+R[j][1]+')">'+R[j][0]+'</span>';
    if(seen.size===3&&!L.$('#gq').innerHTML){const q=L.$('#gq');q.innerHTML='<h2 class="sub">Which goal should Rosa choose?</h2>';
      L.mc(q,['Install 5% more heat pumps','Heated free, forever','No coat indoors, ever'],2,
       'It’s surprising and concrete, it serves the core of warm homes on smaller winter bills, and crews can see where to start. Audacious, not paralyzing.',
       'Too small opens no gap, and too big freezes people. “No customer needs a coat indoors” is the pocket radio of the three.');}};L.$('#gd').appendChild(b);});}}
  ]
});
</script>
</body>
</html>
