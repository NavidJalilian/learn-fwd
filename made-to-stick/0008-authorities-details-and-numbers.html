<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0008', title:'Authorities, details and numbers', minutes:20, icon:'shield',
  goals:['Choose a messenger people will trust, including an “antiauthority” with nothing to sell','Back a claim with a vivid, truthful detail instead of an adjective','Turn a statistic into a relationship people can feel, at a human scale'],
  parts:['Who says so','Telling details','Numbers','Human scale'],
  read:'Read the first half of chapter 4, “Credible,” for the full Barry Marshall, Pam Laffin, Beyond War and shark-attack stories.',
  glossary:{
    'external':'External credibility: belief borrowed from a source outside the message, such as an expert, a celebrity or an antiauthority.',
    'internal':'Internal credibility: belief the message earns on its own, through vivid details, well-used statistics or one convincing example.',
    'antiauthority':'Antiauthority: a messenger with no status or credentials who is believed because they lived the problem and have nothing to gain, like a dying smoker warning against smoking.',
    'humanscale':'Human-Scale principle: put a big or abstract number into everyday terms people have a feel for, so their intuition can judge it.'
  },
  cheatsheet:[
    'We can’t control what people learned from family, faith or experience. We can choose sources and build credibility into the message.',
    '<b>External credibility</b>: experts, celebrities, and <b>antiauthorities</b>. Honesty and trustworthiness can matter more than status.',
    '<b>Internal credibility</b>: vivid details make a claim feel real, even irrelevant ones (the Darth Vader toothbrush).',
    'Use details that are <b>true and core</b>, like the 73-year-old dancer who proved a dance company’s diversity.',
    'Statistics rarely stick. Use them to show a <b>relationship</b> (one BB vs. a bucketful), not for their own sake.',
    '<b>Human-Scale principle</b>: translate numbers into everyday terms (a soccer team, a minute or two a day).',
    'Pick an honest comparison, and use statistics as <b>input</b> to decide, not as output to defend a decision.',
    'The less a message leans on the raw numbers, the better: shark vs. deer beats 12 deaths vs. 0.4.'
  ],
  steps:[
/* ---------- PART 1: WHO SAYS SO ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Councilmember Brandt hears “sealing drafts cut my heating bill” twice: once from a Kestrel salesperson, once from a neighbor who had the work done. Which one does Brandt believe more?</h1>');
  L.mc(L.card,['The Kestrel salesperson, who knows the work best','The neighbor, who has nothing to sell'],1,
   'The neighbor gains nothing if Brandt believes them. This lesson is about where believability comes from, and status isn’t the only source.',
   'The salesperson knows more, but also wants the sale. People ask “what do they gain if I believe them?” The neighbor gains nothing, so they’re trusted more.');}},
{part:0,src:'Chapter 4 · Credible',run(L){
  L.h(L.kick('ex','A real story from the book')+'<h1 class="q">A true idea nobody believed</h1>');
  L.beats(L.card,[
   ['Early 1980s','Two researchers in Perth, Australia, Barry Marshall and Robin Warren, find that stomach ulcers are caused by bacteria. That means ulcers could be <b>cured</b> in days with antibiotics.'],
   ['Problem 1: common sense','Stomach acid is strong enough to dissolve a nail. Bacteria living in there sounded absurd.'],
   ['Problem 2: the source','Marshall was 30 and still in medical training, not a famous professor at a big research center.'],
   ['Problem 3: the place','Perth was not where people expected breakthroughs to come from. Journals rejected the paper; scientists snickered at conferences.'],
   ['1984','Out of patience, Marshall drinks a glass of the bacteria. Within days he has the early symptoms of an ulcer, then cures himself with antibiotics.'],
   ['The ending','It still took a decade: health authorities in the US endorsed antibiotics in 1994. In 2005, Marshall and Warren won the Nobel Prize.']],
   'They were right all along. So why did one of them have to poison himself to be believed? That question is what this chapter is about.');}},
{part:0,src:'Chapter 4 · Finding Credibility',run(L){
  L.h(L.kick('learn','Where belief comes from')+'<h1 class="q">Some sources you can’t touch. Some you can borrow.</h1>'+
   L.prose('We believe things because of our parents and friends, our own experience and our faith. You can’t route a memo through someone’s mother. Yet false rumors persuade people all the time, so some levers must be within reach.')+
   L.note('Around 1999 an email warned that bananas carried flesh-eating bacteria. It claimed a research institute had found it and the FDA knew. Later versions added the CDC. Big names made a wild claim feel checked.','alert')+
   L.prose('That is '+L.g('external','external credibility')+': belief borrowed from someone else. The book names two familiar kinds of authority:')+
   L.list([['star','Experts','People with framed credentials on the wall, like a famous physicist or economist.'],
           ['people','Celebrities','People we want to be like. If a star athlete likes something, so do we.']],1));
  L.done();}},
{part:0,src:'Chapter 4 · Pam Laffin, the Antiauthority',run(L){
  L.h(L.kick('ex','Antiauthorities')+'<h1 class="q">No fame, no degree, and more believable than both. Tap each card.</h1>');
  L.flips(L.card,[
   ['Pam Laffin','A mother of two who started smoking at 10, had emphysema by 24 and a failed lung transplant. In 1990s TV ads for Massachusetts she showed, unflinchingly, what smoking had done to her. She died at 31.'],
   ['Dennis, the driver','The Doe Fund in New York trains homeless men for jobs. It sent Dennis, once homeless himself, to drive visiting funders. His story on the ride convinced them more than any director could.'],
   ['The shampoo','A shampoo ad promises bouncier hair. Your best friend raves about the same shampoo. The friend wins, because the company wants your money and your friend doesn’t.']],
   'An '+L.g('antiauthority','antiauthority')+' is believed because they’re honest and have lived it, not because of status. Sometimes they beat any expert.');}},
{part:0,src:'Chapter 4 · Pam Laffin, the Antiauthority',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Why did Dennis convince the funders better than the Doe Fund’s directors could?</h1>');
  L.mc(L.card,['He was living proof, with nothing to sell','He knew the program’s numbers by heart','He had the most senior title in the room'],0,
   'He had been homeless and had come through the program. Living proof, with nothing to gain, is the antiauthority’s power.',
   'Dennis was a driver, not a director, and the book says nothing about him quoting numbers. His power was being living proof of the program.');}},
{part:0,src:'Chapter 4 · Pam Laffin, the Antiauthority',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Who should speak at the grant hearing?',['Authority','Antiauthority','Weak source'],[
   ['A building-science professor at the state university who has studied 200 sealed homes.',0,'An expert with credentials: classic external credibility.'],
   ['A tenant who spent last winter scraping frost off the inside of the kids’ bedroom window.',1,'No title, no stake, and they lived the problem. That’s an antiauthority.'],
   ['A Kestrel salesperson paid by commission on every job.',2,'The council will ask what they gain. Plenty, so they get few trust points.'],
   ['The city’s best-known hockey coach, whose own drafty house Kestrel fixed.',0,'A local celebrity people look up to is the book’s second kind of authority.'],
   ['Jun’s new slide: “Kestrel: trusted by thousands!”',2,'Kestrel vouching for Kestrel. The source has everything to gain.']]);}},

/* ---------- PART 2: TELLING DETAILS ---------- */
{part:1,src:'Chapter 4 · The Power of Details',run(L){
  L.h(L.kick('learn','Credibility built into the message')+'<h1 class="q">Most of the time, your message has to vouch for itself</h1>'+
   L.prose('Usually there’s no expert to borrow. The message needs '+L.g('internal','internal credibility')+'. The first source is <b>details</b>.')+
   L.prose('Urban legends know this. In a classic one, a couple’s car runs out of gas on a dark road, with a creepy scratching on the roof. Whoever tells it always adds a local spot: “It happened right off Farm Road 121.”')+
   L.flow([['person','Details show expertise','A history buff proves it with one vivid anecdote.','',1],['eye','Details make it real','A tangible claim feels more true, whoever tells it.','',2]],false));
  L.done();}},
{part:1,src:'Chapter 4 · Jurors and the Darth Vader Toothbrush',run(L){
  L.h(L.kick('ex','A real experiment from the book')+'<h1 class="q">Mock jurors and the Darth Vader toothbrush</h1>');
  L.beats(L.card,[
   ['The setup','In 1986, researchers gave mock jurors a made-up custody case: should a boy stay with his mother, Mrs. Johnson? Eight arguments for her, eight against.'],
   ['The twist','Every juror heard the same arguments. Only the <b>vivid details</b> changed: one group got details on her side, the other on the opposing side.'],
   ['A detail for her','She makes sure her son brushes his teeth before bed. Vivid version: he uses a <i>Star Wars</i> toothbrush shaped like Darth Vader.'],
   ['A detail against her','He came to school with an uncleaned scrape. Vivid version: the nurse spilled red antiseptic on her uniform while cleaning it.'],
   ['The result','Jurors with vivid details on her side rated her fitness 5.8 out of 10. With vivid details against her: 4.3.']],
   'The details were irrelevant to her parenting, yet they shifted the verdict. Seeing the toothbrush makes it easier to picture a well-cared-for boy.');}},
{part:1,src:'Chapter 4 · Jurors and the Darth Vader Toothbrush',run(L){
  L.h(L.kick('ex','Use true, core details')+'<h1 class="q">The detail that silenced a skeptic</h1>');
  L.beats(L.card,[
   ['The claim','At a 2004 workshop, leaders of the Liz Lerman Dance Exchange said one of their core values was <b>diversity</b>.'],
   ['The doubt','A professor scoffed: every group says that, and you’re probably all tall, thin 25-year-olds. People nodded.'],
   ['The detail','The artistic director replied: their longest-serving member is <b>Thomas Dwyer, 73</b>, who joined after retiring from a government career, with no dance experience, 17 years earlier.'],
   ['The effect','The room went quiet. The professors had nothing to say.'],
   ['Why it came fast','Diversity truly was core to the company. Its projects put local people on stage, from teenage Hmong dancers to a weekly card club of six women.']],
   'Darth Vader shows details persuade. Thomas Dwyer shows the right way to use that: a <b>true</b> detail that stands for your <b>core</b> idea.');}},
{part:1,src:'Chapter 4 · Jurors and the Darth Vader Toothbrush',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Kestrel tells the council, “We treat your home with respect.” Which detail backs that claim best?</h1>');
  L.mc(L.card,['Kestrel has won three regional service awards','Crews put on shoe covers and lay floor runners at the door','Respect is one of Kestrel’s nine strategic pillars'],1,
   'Like Thomas Dwyer, it’s specific, true and tied to the claim. You can picture it.',
   'Awards borrow outside credibility, and a pillar is just another claim. Shoe covers and floor runners are a detail you can see.');}},
{part:1,src:'Chapter 4 · Jurors and the Darth Vader Toothbrush',pts:6,run(L){
  L.h(L.kick('pr','Pick the details')+'<h1 class="q">Theo is drafting Kestrel’s grant pitch: drafty low-income homes deserve sealing. Sort each line Theo might use.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['True, core detail','Vivid but off-core','Vague claim'],[
   ['In the Nwosus’ rented duplex, frost forms on the inside of the kids’ bedroom window.',0,'True, vivid, and it is the problem the grant would fix.'],
   ['The technician who visited drove a bright orange van.',1,'Vivid, but it says nothing about drafty homes.'],
   ['Many residents face ongoing comfort challenges.',2,'No picture at all. A council member can’t see it or check it.'],
   ['After the work, one family stopped running a space heater in the kids’ room.',0,'A vivid result that shows exactly what the grant buys.'],
   ['A crew once found a raccoon living in a customer’s attic.',1,'Memorable, but off the point. Like the stained uniform, it might sway people for the wrong reason.'],
   ['Our crews deliver best-in-class results.',2,'An adjective, not a detail. Nothing to picture.']],
   'Vivid beats vague. But the strongest details are both vivid <i>and</i> core, so they persuade for the right reason.');}},

/* ---------- PART 3: NUMBERS ---------- */
{part:2,src:'Chapter 4 · Beyond War',run(L){
  L.h(L.kick('learn','The trouble with statistics')+'<h1 class="q">Numbers are credible, and eye-glazing</h1>'+
   L.prose('The second source of internal credibility is <b>statistics</b>. We’re taught from grade school to back our arguments with numbers. But numbers alone rarely move anyone.')+
   L.prose('In the 1980s a citizens’ group called Beyond War faced a puzzle. We shout when a child runs with scissors. Yet news about nuclear weapons that could kill millions of children barely makes us pause.')+
   L.note('They went door to door at neighborhood house parties. Their problem: how do you make the <i>scale</i> of the arms race real? Stories felt too small, and big numbers felt invisible.','info'));
  L.done();}},
{part:2,src:'Chapter 4 · Beyond War',
 solve:async L=>{for(let i=0;i<3;i++){L.$('#drop').click();}},
 run(L){
  const steps=[[1,'This is the Hiroshima bomb.','One BB clatters into an empty metal bucket. Then a few minutes on what that one bomb destroyed.'],
               [10,'This is one nuclear submarine.','Ten BBs: the firepower of the missiles on a single US or Soviet submarine. Louder, messier.'],
               [5000,'This is every nuclear weapon in the world.','Eyes closed. 5,000 BBs, one per warhead, pour into the bucket. The roar goes on and on. Then silence.']];
  let k=0,total=0;
  L.h(L.kick('ex','See it happen')+'<h1 class="q">Geoff Ainscow of Beyond War carried a metal bucket and a pocket full of BBs. Drop them in, one step at a time.</h1>'+
   '<div style="max-width:300px;margin:6px auto 0"><canvas id="bk8" width="280" height="190" style="width:100%;display:block;background:var(--soft);border:3px solid var(--line,#bbb);border-top:none;border-radius:0 0 40px 40px"></canvas>'+
   '<div class="small" id="bc" style="text-align:center;margin-top:6px">0 BBs in the bucket</div></div>'+
   '<div id="bt" style="min-height:70px;margin:10px 0"></div><button class="btn pri" id="drop">'+L.ic('down')+'Drop 1 BB</button>');
  const cv=L.$('#bk8'),cx=cv.getContext('2d');let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
  const add=n=>{cx.fillStyle='#8a8f98';for(let i=0;i<n;i++){const t=total+i,fill=Math.min(1,t/5000);const y=184-rnd()*Math.max(8,fill*170)-2;const x=6+rnd()*268;cx.beginPath();cx.arc(x,y,1.6,0,6.3);cx.fill();}total+=n;};
  L.$('#drop').onclick=function(){const s=steps[k];add(s[0]);L.$('#bc').textContent=total.toLocaleString('en-US')+' BBs in the bucket';
    L.$('#bt').innerHTML='<p class="prose" style="margin:0"><b>“'+s[1]+'”</b> '+s[2]+'</p>';k++;
    if(k===1)this.innerHTML=L.ic('down')+'Drop 10 BBs';
    else if(k===2)this.innerHTML=L.ic('down')+'Pour 5,000 BBs';
    else{this.remove();L.sheet('info','What just happened','Ainscow turned a statistic into a sound and a sight. One BB next to a bucketful shows a <b>relationship</b>: how far the danger had grown since 1945. BBs are even weapons, which fit the message.');L.done();}};}},
{part:2,src:'Chapter 4 · Beyond War',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">A week after the house party, what do most guests still remember?</h1>');
  L.mc(L.card,['That there were 5,000 warheads in the world','How loud one submarine’s worth of BBs was','That the danger had grown out of control'],2,
   'The book is blunt: nobody remembered the number. What stuck was the gut sense of scale. Whether it was 4,135 or 9,437 didn’t matter.',
   'The number didn’t stick, and the submarine was only a step on the way. The relationship stuck: one bomb then, a roaring bucketful now. That’s why statistics should illustrate a relationship.');}},
{part:2,src:'Chapter 4 · Beyond War',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Bare number or relationship?',['A bare number','A relationship'],[
   ['“Kestrel crews sealed 18,400 meters of gaps last year.”',0,'Big, but compared to what? Nobody knows if that’s good.'],
   ['“Most homes we check lose more heat through the attic than through the windows.”',1,'It compares two things people already think about, and flips what they expected.'],
   ['“The average Home Energy Check finds 37 leaks.”',0,'Is 37 a lot? With nothing to compare it to, it slides right past.'],
   ['“Two same-size houses on one street: the drafty one’s heating bill is double.”',1,'One house next to another, like one BB next to a bucketful. The gap is what sticks.']]);}},

/* ---------- PART 4: HUMAN SCALE ---------- */
{part:3,src:'Chapter 4 · The Human-Scale Principle',run(L){
  L.h(L.kick('learn','The Human-Scale principle')+'<h1 class="q">Put numbers where intuition works</h1>'+
   L.prose('Another way to bring a statistic to life is the '+L.g('humanscale','Human-Scale principle')+': put it in everyday terms people have a feel for.')+
   L.lanes([['people','Covey’s soccer team','A survey of 23,000 workers found only 37% knew what their organization was trying to achieve. Covey retold it as a soccer team: only 4 of 11 players know which goal is theirs.',1],
            ['clock','Cisco’s wireless network','Cost: about $500 per employee per year. Hard to judge. Then someone asked: does it save each person a minute or two a day? If so, it pays for itself.',2]])+
   '<p class="prose" style="margin-top:14px">We have no feel for “37% of employees.” We can instantly picture seven players who don’t know which way to kick.</p>');
  L.done();}},
{part:3,src:'Chapter 4 · The Human-Scale Principle',pts:1,run(L){
  L.h(L.kick('try','Predict')+'<h1 class="q">Scientists measured something with extreme accuracy. Two groups heard it described two ways. Which version did more people call “very impressive”?</h1>');
  L.mc(L.card,['Like throwing a rock from the sun to the earth and landing within a third of a mile','Like throwing a rock from New York to Los Angeles and landing within two-thirds of an inch','About the same for both, since the accuracy is identical'],1,
   'Right: 83% found it very impressive, against 58% for the sun version, even though the accuracy is the same. Nobody has a feel for the distance to the sun.',
   'The accuracy is identical, but people didn’t rate it that way: 83% called the New York version very impressive, only 58% the sun version. We have intuition for New York to LA, none for the sun.');}},
{part:3,src:'Chapter 4 · Clinic: Dealing with Shark Attack Hysteria',run(L){
  L.h(L.kick('ex','Idea Clinic: before and after')+'<h1 class="q">Shark attacks are rare, but one terrifying story can drown out the facts. How do you calm people down?</h1>'+
   L.lanes([['list','Message 1','You’re more likely to drown at a beach with a lifeguard than be killed by a shark. In one recent year: 12 drownings in guarded areas, no shark deaths (about 0.4 in a typical year).',4],
            ['eye','Message 2','Which is more likely to kill you: a shark or a deer? The deer, by a long way: about 300 times more likely, through car crashes.',2]])+
   L.note('Message 1 is fine, but people already fear drowning, and 12 vs. 0.4 won’t be remembered. Message 2 is unexpected and a bit funny. It also uses the <b>audience</b> as the proof: you know you don’t fear deer, so why fear sharks?','bulb')+
   '<p class="small" style="margin-top:10px">The book’s punch line: the less you rely on the raw numbers, the better. Shark vs. deer works like the BBs in the bucket.</p>');
  L.done();}},
{part:3,src:'Chapter 4 · The Human-Scale Principle',run(L){
  L.h(L.kick('learn','Honest numbers')+'<h1 class="q">Choose the comparison, and choose it honestly</h1>'+
   L.prose('Remember the movie-popcorn campaign from lesson 1? “37 grams of saturated fat” meant nothing. Compared with a whole day of fatty meals, it shocked people.')+
   L.prose('The same trick can be abused. A sleazy version could compare popcorn to fat-free lollipops and get a huge, meaningless number. Clever people can make statistics say almost anything.')+
   L.flow([['x','Output','Decide first, then hunt for numbers that agree','asking for trouble',4],['check','Input','Look at the numbers, then make up your mind','share the pivotal ones',2]],false)+
   '<p class="small" style="margin-top:10px">Data still keeps us honest: it’s harder to lie with real numbers than without them.</p>');
  L.done();}},
{part:3,src:'Chapter 4 · The Human-Scale Principle',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">The grant asks the city for $2.4 million to seal and insulate 600 homes. Brandt’s eyes glaze. Tap each piece until the pitch is at a human scale.</h1>');
  L.sentence(L.card,[['$2.4 million in total','$4,000 a home'],['takes about $60 a month off a family’s winter heating bill','saves 2,900 megawatt-hours across the program'],['for a family like the Nwosus, with frost inside the kids’ window','for the program’s target demographic']],[1,0,0],
   [['$2.4 million is too big to judge. Break it down to one home, where intuition works.'],['Megawatt-hours are the “sun to the earth” of energy: nobody has a feel for them.'],['A “target demographic” is nobody in particular. Name a household Brandt can picture.']],
   'One home, one monthly bill, one family. Now Brandt can judge it the way the Cisco employee judged wireless: “Is that worth it?”');}},
{part:3,src:'Chapter 4 · The Human-Scale Principle',pts:1,run(L){
  L.h(L.kick('pr','Input or output?')+'<h1 class="q">Jun decides the new mailer will say heat pumps “pay for themselves fast,” then starts searching for a number to back it up. What does the book advise?</h1>');
  L.mc(L.card,['Study the numbers first, then decide what to claim','Find a more dramatic number to support the claim','Leave numbers out so nobody can dispute them'],0,
   'Use statistics as input, not output. If the numbers support the claim, Jun can share the key one with confidence.',
   'Hunting for a better number is exactly the trap, and dropping numbers throws away a source of credibility. Look at the data first, then decide.');}},
{part:3,src:'Chapter 4 · Credible',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Mixed review: which source of credibility?',['Antiauthority','Telling detail','Stat as a relationship','Human scale'],[
   ['A retired bus driver whose house Kestrel sealed, with nothing to gain, tells the council about sleeping in a wool hat every winter.',0,'No title, no stake, and they lived it: an antiauthority.'],
   ['Theo mentions that in January the Nwosu kids hang a blanket over their bedroom window every night.',1,'One small, true, vivid fact that makes the draft real.'],
   ['Jun’s chart shows two same-size houses side by side: the drafty one’s bill is twice the other’s.',2,'The point is the comparison, not the dollar figures.'],
   ['Theo says the gaps in a typical drafty house add up to leaving a window open a hand’s width all winter.',3,'A hidden total turned into something everyone has felt.'],
   ['Marisol shares that one customer’s cat stopped sleeping on the heating vent after the work.',1,'A tiny, vivid detail that makes the change believable.']]);}}
  ]
});
</script>
