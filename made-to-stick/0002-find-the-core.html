<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find the Core</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0002', title:'Find the core', minutes:19, icon:'target',
  goals:['Write a Commander’s Intent for a plan with two simple questions','Put the core first instead of burying the lead','Explain how one clear core frees people from decision paralysis'],
  parts:['Intent','The core','Lead first','Paralysis'],
  read:'Read the first half of chapter 1, “Simple,” for the full Army, Southwest, Clinton and Dunn stories.',
  glossary:{
    'lead':'Lead: the first sentence of a news story, which carries the most important point.',
    'pyramid':'Inverted pyramid: writing with the most important information first and the rest in order of falling importance.',
    'buried':'Burying the lead: letting the most important point slip down where readers may never reach it.',
    'forced':'Forced prioritization: choosing the one point that matters most, even when the others are good too.',
    'paralysis':'Decision paralysis: freezing or putting off a choice because of uncertainty or too many good options.'
  },
  cheatsheet:[
    '<b>Simple</b> means finding the core, not dumbing down. It’s about prioritizing.',
    '<b>Commander’s Intent</b>: plans break, but people can still act on the goal. Ask “If we do nothing else, we must…”',
    'The core is <b>one</b> thing. The hard part is cutting ideas that are important but not the <i>most</i> important.',
    'Test decisions against the core, like Southwest’s chicken-salad question.',
    'Put the core first (the <b>inverted pyramid</b>). Don’t <b>bury the lead</b> under interesting side points.',
    'Say three things and you’ve said nothing. <b>Forced prioritization</b> hurts, and it works.',
    'Uncertainty and too many options cause <b>decision paralysis</b>. A clear core tells people what matters.',
    'Finding the core isn’t the same as <b>sharing</b> it. That’s the next lesson.'
  ],
  steps:[
/* ---------- PART 1: INTENT ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">A friend will play a chess game for you while you’re away. What helps them most?</h1>');
  L.mc(L.card,['A list of your planned moves for the whole game','A clear idea of what you’re trying to achieve'],1,
   'Your opponent’s first surprise move would wreck a move-by-move plan. A clear goal lets your friend adapt. The Army learned the same lesson.',
   'The first surprise move from the opponent would make your list useless. A clear goal lets your friend adapt. The Army learned the same lesson.');}},
{part:0,src:'Chapter 1 · Simple',run(L){
  L.h(L.kick('learn','Commander’s Intent')+'<h1 class="q">Plans break. The goal survives.</h1>'+
   L.prose('The U.S. Army plans in huge detail, from the top down to each soldier. Yet the plans often fall apart minutes into a battle: the weather changes, equipment is lost, the enemy does something unexpected.')+
   L.prose('So in the 1980s the Army added the '+L.g('intent','Commander’s Intent')+': a short, plain statement at the top of every order that says what the operation must achieve.')+
   L.flow([['list','The plan','Who does what, when, with what','often useless after first contact',2],['target','The intent','The end result we need','survives when the plan breaks',1]])+
   L.prose('Soldiers can lose the ability to follow the plan, but they never lose the duty to achieve the intent.'));
  L.done();}},
{part:0,src:'Chapter 1 · Simple',run(L){
  L.h(L.kick('ex','How intent works in the field')+'<h1 class="q">One sentence, many people improvising toward it</h1>');
  L.beats(L.card,[
   ['The intent','A captain’s intent: get Third Battalion onto Hill 4305 and clear it, so they can protect the flank of Third Brigade as it passes through.'],
   ['Things go wrong','Suppose most of the battalion is lost. The plan is gone.'],
   ['Still useful','Even if only one soldier is left on that hill, they know what matters: protect Third Brigade’s flank.'],
   ['Another case','A commander says, “We’re passing this infantry unit through our lines.” Mechanics know to stage repair crews along the roads. Artillery knows to lay smoke where the infantry moves.'],
   ['The point','Nobody listed those tasks. Once people knew the intent, they came up with their own solutions.']],
   'Intent lines people up without step-by-step orders. Knowing the destination frees them to improvise the route.');}},
{part:0,src:'Chapter 1 · Simple',run(L){
  L.h(L.kick('learn','Two questions')+'<h1 class="q">How officers find the intent</h1>'+
   L.prose('The Army’s training center suggests officers finish two sentences:')+
   L.list([['target','If we do nothing else during tomorrow’s mission, we must…',''],['star','The single most important thing we must do tomorrow is…','']],1)+
   L.prose('Plans meeting reality isn’t just an Army problem. No sales plan survives the customer; no lesson plan survives a room of teenagers. Wherever plans break, people need to know the one thing that matters.'));
  L.done();}},
{part:0,src:'Chapter 1 · Simple',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Which of these is a Commander’s Intent for a Kestrel crew on an install day?</h1>');
  L.mc(L.card,['Leave the family with a warm house and a clean one, whatever happens','Arrive 7:30, attic first, then walls, then the heat pump at noon','Follow all 80 pages of the installer binder in order'],0,
   'It states the end result. If the schedule breaks, the crew still knows what they must achieve.',
   'That’s a plan, a list of steps. An intent states the end result, so the crew can still act when the steps break down.');}},
{part:0,src:'Chapter 1 · Simple',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Dana is writing an intent for the first week of a new installer. Tap each piece until it works as a Commander’s Intent.</h1>');
  L.sentence(L.card,[['If they learn nothing else this week,','Over the course of this week,'],['new installers must','new installers should try to'],['finish all 80 binder pages','never put a foot through a ceiling','learn every tool’s name']],[0,1,1],
   [['That drops the “nothing else” test that forces a single priority.'],['“Should try to” is soft. The intent is what they <i>must</i> achieve.'],['Reading pages is a task, not an end result that matters in a home.','Useful, but hardly the single most important thing on a roof or in an attic.']],
   'One end result, in plain words, that a new hire can act on when nobody is watching.');}},

/* ---------- PART 2: THE CORE ---------- */
{part:1,src:'Chapter 1 · Simple',run(L){
  L.h(L.kick('learn','What “simple” really means')+'<h1 class="q">Simple is finding the core, not dumbing down</h1>'+
   L.prose('The book’s first principle is to be simple. Not sound bites, not short words. Simple means finding the '+L.g('core','core')+': the most essential part of your idea.')+
   L.prose('Cutting fluff is the easy part. The hard part is cutting ideas that are truly important but aren’t <b>the most</b> important. You can’t have five North Stars or five most important goals.')+
   L.note('The book in one line: <b>Step 1</b>, find the core. <b>Step 2</b>, translate it using the '+L.g('success','SUCCESs')+' checklist. This lesson is Step 1.','target'));
  L.done();}},
{part:1,src:'Chapter 1 · Finding the Core at Southwest Airlines',run(L){
  L.h(L.kick('ex','A core that guides thousands')+'<h1 class="q">Southwest and the chicken Caesar salad</h1>');
  L.beats(L.card,[
   ['The company','Southwest stayed profitable for over 30 years in an industry that rarely is. A big reason: decades of relentless cost cutting across thousands of staff.'],
   ['The core','Longtime CEO Herb Kelleher said he could teach anyone to run the airline in 30 seconds: Southwest is <b>THE low-fare airline</b>.'],
   ['The test','Tracy from marketing reports that passengers on the Houston–Las Vegas flight might like a chicken Caesar salad instead of just peanuts.'],
   ['The answer','Kelleher’s reply, roughly: will the salad help us be THE low-fare airline on that route? If not, no salad.'],
   ['The next ring','Southwest is also fun to work at. Joking about a flight attendant’s birthday over the speaker? Fine. Throwing confetti? No: cleanup takes time, and time raises fares.']],
   'The core sits in the center. Other values fit around it, as long as they never threaten it.');}},
{part:1,src:'Chapter 1 · Finding the Core at Southwest Airlines',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Months from now, “Simple” may come back to you as “make it easy.” Which is simple in the book’s sense?</h1>');
  L.mc(L.card,['A short slogan full of easy, friendly words','A message trimmed to fit a single slide','A plain goal that settles real trade-offs'],2,
   'Right. “THE low-fare airline” isn’t simple because the words are easy. It’s simple because it captures the priority that settles decisions.',
   'Short or easy isn’t the test. Simple means it captures the core: the one priority people can use to settle trade-offs, like the chicken salad.');}},
{part:1,src:'Chapter 1 · Finding the Core at Southwest Airlines',pts:5,run(L){
  L.h(L.kick('pr','The chicken-salad test at Kestrel')+'<h1 class="q">Suppose Rosa boils the nine pillars down to one core: <i>warm homes on smaller winter bills</i>. Does each idea pass?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Serves the core','Fails the test'],[
   ['Branded Kestrel tote bags handed out at every Home Energy Check',1,'Nice, but they don’t make anyone warmer or cut a bill. No “salad.”'],
   ['Sealing the attic before adding the heat pump, so a smaller unit does the job',0,'Directly warmer and cheaper to run. It fits the core.'],
   ['A glossy annual report about the company’s “transformation journey”',1,'It doesn’t touch a single home’s warmth or bill.'],
   ['Evening check slots so working parents like the Nwosus can book',0,'More drafty homes get found and fixed. It serves the core.'],
   ['A premium smart thermostat that adds $400 but saves little',1,'It raises the cost without much saving. That works against smaller bills.']],
   'One core turns a dozen debates into one question: does this help warm homes on smaller bills?');}},

/* ---------- PART 3: LEAD FIRST ---------- */
{part:2,src:'Chapter 1 · Burying the Lead',run(L){
  L.h(L.kick('learn','The inverted pyramid')+'<h1 class="q">Journalists put the most important thing first</h1>'+
   L.prose('A news story’s first sentence, the '+L.g('lead','lead')+', carries the most essential point. Everything after comes in falling order of importance. This is the '+L.g('pyramid','inverted pyramid')+'.')+
   L.tiers([['star','The lead','The single most important point','read by everyone',true,'Core'],['list','Key details','Next most important','read by many'],['layers','Background','Least important','cut first when space runs out']])+
   L.prose('Readers who stop early still get the point. Editors short of space can cut from the bottom. One account, maybe not true, says it began in the Civil War, when reporters’ telegraph lines could be cut at any moment.'));
  L.done();}},
{part:2,src:'Chapter 1 · Burying the Lead',run(L){
  L.h(L.kick('learn','Burying the lead')+'<h1 class="q">The longer you work on it, the easier it is to lose the point</h1>'+
   L.prose('Reporters can get so deep in details that they lose sight of what readers care about. When the main point slips too far down, journalists call it '+L.g('buried','burying the lead')+'.')+
   L.prose('Writing a lead is a model for finding the core. Both need '+L.g('forced','forced prioritization')+'. If your telegraph line could die after one sentence, what would you send?')+
   L.note('Smart people find this painful. They see the nuance and value of every point, so they’re tempted to keep them all. That pull toward complexity fights the need to choose.','alert'));
  L.done();}},
{part:2,src:'Chapter 1 · “If You Say Three Things, You Don’t Say Anything.”',run(L){
  L.h(L.kick('ex','A campaign that chose one thing')+'<h1 class="q">“It’s the economy, stupid”</h1>'+L.quote('If you say three things, you don’t say anything.','Clinton’s advisers, chapter 1'));
  L.beats(L.card,[
   ['The mess','Bill Clinton’s 1992 campaign ran on volunteers, daily media pressure, and a candidate who loved talking about every policy.'],
   ['The whiteboard','Adviser James Carville wrote three phrases on a whiteboard for the staff. One was “It’s the economy, stupid.” It became the core of the campaign.'],
   ['The “stupid”','The word was aimed at the staff themselves: don’t get too clever, remember the basics.'],
   ['The pushback','Clinton wanted to keep talking about balanced budgets, which a rival was getting praise for. His advisers said no.'],
   ['The lead','With the country in a recession, the economy was the lead. A balanced budget couldn’t <i>also</i> be the lead.']],
   'Carville’s job was to stop the candidate from burying his own lead.');}},
{part:2,src:'Chapter 1 · “If You Say Three Things, You Don’t Say Anything.”',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Jun’s Home Energy Check mailer lists ten benefits, each with its own headline. What’s the problem?</h1>');
  L.mc(L.card,['Ten is too few; list every benefit people might want','The benefits are fine; the mailer needs bolder colors','With ten headlines, no single point gets through'],2,
   'If you say ten things, you don’t say anything. Jun needs to pick the one that matters most and lead with it.',
   'More points or louder design won’t fix it. With ten equal headlines, readers keep none. Jun needs forced prioritization: one core, up front.');}},
{part:2,src:'Chapter 1 · Clinic: Warning: Sun Exposure Is Dangerous',run(L){
  L.h(L.kick('ex','Idea Clinic: before and after')+'<h1 class="q">A sun-safety web page with its core at the bottom</h1>');
  L.beats(L.card,[
   ['Before','A university health page opens with tans as a status symbol, then three paragraphs on melanin and UVA and UVB rays.'],
   ['The buried lead','Only the last paragraph says the key fact: sun damage builds up over the years and can’t be undone.'],
   ['After','The rewrite puts that fact first and compares it to aging: it adds up and can’t be reversed, but unlike aging it can be prevented.'],
   ['Cut','The melanin details go. They’re interesting, but smokers don’t need to know how lungs work to fear smoking.'],
   ['Punch line','Don’t open with something interesting but off-point. Make the core itself interesting.']],
   'Unburying the lead meant moving the core up and cutting good material that wasn’t the core.');}},
{part:2,src:'Chapter 1 · Clinic: Warning: Sun Exposure Is Dangerous',pts:1,run(L){
  L.h(L.kick('pr','Unbury Theo’s lead')+'<h1 class="q">Theo’s heat-pump page has four paragraphs. Drag them into inverted-pyramid order, most important first.</h1>');
  L.order(L.card,[
   'Heat pumps keep homes warm through our coldest winters, at a lower cost',
   'A customer’s heat pump ran all January, and their bill fell by more than half',
   'How it works: it moves heat in from outside air, even cold air',
   'A fun fact: your fridge works on the very same idea'],
   'The core claim leads. Proof follows, then how it works. The fun fact goes last, or gets cut, like the melanin details.',
   ['Lead','Next','Then','Last']);}},
{part:2,src:'Chapter 1 · Burying the Lead',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Lead first, or lead buried?',['Lead first','Lead buried'],[
   ['Rosa’s memo opens: “Our company was founded in 2009 by two friends with a shared vision…”',1,'History first. The point of the memo is somewhere further down.'],
   ['Dana’s safety sheet opens: “Step only on the wooden beams in an attic. Everything else is ceiling.”',0,'The one rule that matters most comes first.'],
   ['Marisol’s report opens: “Calls about cold bedrooms doubled this month. Here’s why.”',0,'The key finding is in the first line.'],
   ['Theo’s grant memo spends two pages on test methods before the result.',1,'The result is the lead. Methods can follow, or go in an appendix.']]);}},

/* ---------- PART 4: PARALYSIS ---------- */
{part:3,src:'Chapter 1 · Decision Paralysis',run(L){
  L.h(L.kick('learn','Why choosing is so hard')+'<h1 class="q">Uncertainty can freeze us, even when it shouldn’t matter</h1>'+
   L.prose('In one study, students had just taken a big exam and could buy a cheap Hawaii trip. Told they <b>passed</b>, 57 percent bought it. Told they <b>failed</b>, 54 percent bought it.')+
   L.prose('Students who <b>didn’t know</b> their grade yet mostly (61 percent) paid five dollars to wait two days. Whichever way the grade went, they’d have wanted the trip, yet not knowing made them stall.')+
   L.note('This is '+L.g('paralysis','decision paralysis')+': uncertainty, even uncertainty that doesn’t matter, makes people freeze.','clock'));
  L.done();}},
{part:3,src:'Chapter 1 · Decision Paralysis',pts:1,
 solve:async L=>{L.$('#po').children[0].click();L.$('#go').click();},
 run(L){
  let p=null;const N=['More students study','Fewer students study','About the same'];
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">Students choose between a one-night lecture by an author they admire and studying in the library. Then a second group also gets a third option: a film they’ve wanted to see. What happens to studying?</h1><div id="po" style="display:flex;flex-wrap:wrap;gap:8px"></div>'+
   '<div id="run" hidden><div style="display:flex;justify-content:flex-end;margin-top:10px"><button class="btn pri" id="go">'+L.ic('play')+'Show results</button></div>'+
   '<div class="meterrow"><div class="lb">Lecture or study</div><div class="meter"><div id="m0" style="background:var(--h2)"></div></div></div>'+
   '<div class="meterrow"><div class="lb">Lecture, study or film</div><div class="meter"><div id="m1" style="background:var(--h3)"></div></div></div><div class="small" id="lab"></div></div>');
  N.forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=n;b.onclick=()=>{if(p!==null)return;p=j;b.classList.add('sel');L.$('#run').hidden=false;};L.$('#po').appendChild(b);});
  L.$('#go').onclick=function(){this.remove();let k=0;
    const t=setInterval(()=>{k++;const a=L.$('#m0'),b=L.$('#m1');if(!a){clearInterval(t);return;}
      a.style.width=Math.round(21*k/10)+'%';b.style.width=Math.round(40*k/10)+'%';
      if(k>=10){clearInterval(t);L.$('#lab').textContent='Share who chose to study: 21% with two options, 40% with three.';L.award(p===0);
        L.sheet(p===0?'ok':'no',p===0?'You called it: studying doubled':'Studying doubled',
         'With two good alternatives instead of one, twice as many students chose to study. Picking between the lecture and the film was hard, so many skipped both. Not rational, but human.');L.done();}},150);};}},
{part:3,src:'Chapter 1 · Decision Paralysis',run(L){
  L.h(L.kick('learn','The core as a rescue')+'<h1 class="q">A clear core tells people what matters when the choice is hard</h1>'+
   L.prose('The people we talk to make choices all day under uncertainty, often between two good options. That’s exactly where they stall or choose badly.')+
   L.flow([['alert','Hard choice','Salad or no salad? Both sound good.','',4],['target','The core','THE low-fare airline','',1],['check','Easy choice','No salad.','',3]])+
   L.prose('That’s why finding the core is worth the pain of '+L.g('forced','forced prioritization')+'. It does the deciding in advance, so people don’t have to.'));
  L.done();}},
{part:3,src:'Chapter 1 · Decision Paralysis',pts:1,
 solve:async L=>{const g=L.$('#gg').children;g[0].click();g[1].click();},
 run(L){
  const D=['A customer asks for a costly add-on that saves little','Run late to seal one more leak, or leave on time?','Spend the extra hour on a report or on the attic?'];
  const R=[['“Customer-centric” says yes; “operational excellence” says no','“Innovation” says try; “safety” says stop; “growth” says…','Three pillars point three ways'],
           ['Smaller bills? It saves little, so explain and suggest a better fix','Warmer home? Seal the leak and call the next customer','The attic. That’s what warms the home']];
  const seen=new Set();
  L.h(L.kick('pr','See it happen')+'<h1 class="q">A crew lead faces three calls on a job. Switch between Rosa’s nine pillars and one core, and watch the answers.</h1><div id="gg" style="display:flex;flex-wrap:wrap;gap:8px"></div>'+
   '<div style="background:var(--soft);border-radius:16px;padding:14px;margin:10px 0;min-height:140px" id="gv"><div class="small">Choose a guide above.</div></div><div id="gq"></div>');
  ['Nine pillars','One core'].forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.innerHTML=L.ic(j?'target':'layers')+n;b.onclick=()=>{[...L.$('#gg').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(j);
    L.$('#gv').innerHTML=D.map((d,x)=>'<div style="margin:0 0 10px"><div class="small"><b>'+d+'</b></div><div class="small" style="display:flex;gap:6px;align-items:flex-start;color:var('+(j?'--ok':'--no')+')">'+L.ic(j?'check':'alert')+'<span>'+R[j][x]+'</span></div></div>').join('');
    if(seen.size===2&&!L.$('#gq').innerHTML){const q=L.$('#gq');q.innerHTML='<h2 class="sub">Why did the nine pillars leave the crew lead stuck?</h2>';
      L.mc(q,['Too many good options pull different ways','The crew lead didn’t read the memo'],0,
       'Like the students with three choices, nine priorities make every call harder. One core settles them.',
       'Even someone who read every word would be stuck: nine good priorities pull in different directions. One core settles the call.');}};L.$('#gg').appendChild(b);});}},
{part:3,src:'Chapter 1 · Names, Names, and Names',run(L){
  L.h(L.kick('ex','A small-town paper')+'<h1 class="q">Why more than everyone in Dunn reads the <i>Daily Record</i></h1>');
  L.beats(L.card,[
   ['The puzzle','Dunn, North Carolina, has about 14,000 people and plenty of news options. Yet its local paper has a “penetration” of 112 percent, the highest of any U.S. paper: some homes buy two, or outsiders buy it too.'],
   ['The founder','Hoover Adams started the paper in 1950 and ran it for 55 years with one fixed belief: be relentlessly <b>local</b>.'],
   ['His reason','People read a local paper for local names and pictures, the one thing no other outlet can give them. To his towns, their mayors matter as much as New York’s mayor does to New Yorkers.'],
   ['The catch','Almost every small-town publisher would agree. Yet most local papers are full of wire stories and pro-sports coverage.'],
   ['The lesson','Knowing the core isn’t the same as getting people to act on it. Adams both found <i>and</i> shared his.']],
   'How Adams made “local” stick with his staff is where the next lesson begins.');}},
{part:3,src:'Chapter 1 · Names, Names, and Names',pts:1,run(L){
  L.h(L.kick('pr','What comes next?')+'<h1 class="q">Rosa has settled on one core. Six weeks on, crews agree with it but still work the old way. What does the Dunn story suggest?</h1>');
  L.mc(L.card,['The core must be wrong, so pick a new one','Finding a core isn’t enough; it must be shared','The crews need more pillars to guide them'],1,
   'Like most small-town publishers, Rosa knows the core. Adams shows the next step: making it stick with the people who make the daily calls.',
   'Most publishers had the right core and still didn’t act on it. The core can be right; the gap is in sharing it so it sticks.');}},
{part:3,src:'Chapter 1 · Decision Paralysis',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Mixed review: what’s the fix?',['Name the intent','Unbury the lead','Cut to one core'],[
   ['Dana’s new installers follow the checklist step by step, but freeze when a job doesn’t match it.',0,'They need the end result behind the steps, so they can improvise when the plan breaks.'],
   ['Theo’s explainer starts with the history of refrigeration and gets to “it works in winter” on page three.',1,'The main point is there, just too far down. Move it to the top.'],
   ['Rosa’s plan gives staff nine equal priorities, and every meeting ends in a tug-of-war.',2,'Nine North Stars means none. Force the one that matters most.'],
   ['A crew is told the schedule in detail, but not what a good day for the customer looks like.',0,'Give the “if we do nothing else, we must…” statement on top of the plan.']]);}}
  ]
});
</script>
</body>
</html>
