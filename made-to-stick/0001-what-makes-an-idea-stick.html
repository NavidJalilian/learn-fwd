<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What Makes an Idea Stick?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0001', title:'What makes an idea stick?', minutes:18, icon:'bulb',
  goals:['Say what makes an idea “sticky” and why delivery tips aren’t enough','Name the six SUCCESs traits and spot them in a message','Recognize the Curse of Knowledge in yourself and others'],
  parts:['What sticks','Six traits','The villain','Learnable'],
  read:'Read the introduction, “What Sticks?”, for the full popcorn, Halloween and tapping stories.',
  glossary:{
    'urban-legend':'Urban legend: a made-up story passed from person to person as if it really happened, usually to “a friend of a friend.”',
    'template':'Template: a repeatable pattern for building an idea. Award-winning ads, the book reports, mostly follow a handful of them.'
  },
  cheatsheet:[
    'A <b>sticky</b> idea is understood, remembered, and changes what people think or do.',
    'Ideas aren’t born interesting; they’re <b>made</b> interesting. A true, dull-sounding fact (movie popcorn is fatty) can stick as well as a legend.',
    'Most advice is about delivery. The missing piece is <b>designing the message itself</b>.',
    'The six traits: <b>Simple, Unexpected, Concrete, Credible, Emotional, Stories</b> (SUCCESs).',
    'SUCCESs is a <b>checklist, not a formula</b>: no idea needs all six, and none is guaranteed to stick.',
    'The villain is the <b>Curse of Knowledge</b>: you hear the tune; your listener hears only taps.',
    'You can’t unlearn what you know, so <b>transform the idea</b> with the checklist.',
    'Creativity can be learned: novices given a few <b>templates</b> beat brainstormers.'
  ],
  steps:[
/* ---------- PART 1: WHAT STICKS ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">At Kestrel’s Monday meeting, Rosa presents nine “strategic pillars.” Later a crew lead mentions finding a raccoon living in a customer’s attic. A week on, which will staff retell more accurately?</h1>');
  L.mc(L.card,['Rosa’s nine strategic pillars','The raccoon in the attic'],1,
   'Everyone will tell the raccoon story, and almost no one will recall the nine pillars. This lesson asks why, and how to give an important idea the same pull.',
   'Be honest: a week later, few people could list nine pillars, but everyone remembers the raccoon. This lesson asks why, and how to give an important idea the same pull.');}},
{part:0,src:'Introduction · What Sticks?',run(L){
  L.h(L.kick('learn','Two ends of a scale')+'<h1 class="q">Why does a silly legend outlast a careful report?</h1>'+
   L.prose('The book opens with the Kidney Heist, an '+L.g('urban-legend','urban legend')+': a traveler accepts a drink from a stranger and wakes up in a bathtub full of ice, missing a kidney. Read it once and you could retell it an hour later, almost word for word.')+
   L.prose('Then it quotes a paragraph from a nonprofit paper full of phrases like “return-on-investment rationale.” Try retelling that an hour later.')+
   L.flow([['flame','Kidney Heist','Remembered and retold','false, yet it spreads',4],['list','Nonprofit memo','Gone in an hour','true, yet it fades',2]],false)+
   L.prose('Most workplace messages sit near the memo end. Are some ideas simply born dull? The authors say no: this is a book about how ideas are <b>made</b> interesting.'));
  L.done();}},
{part:0,src:'Introduction · The Truth About Movie Popcorn',run(L){
  L.h(L.kick('ex','A true idea that stuck')+'<h1 class="q">How a nutrition group made people care about popcorn fat</h1>');
  L.beats(L.card,[
   ['The finding','A nutrition nonprofit, CSPI, had movie popcorn tested. A medium bag held <b>37 grams</b> of saturated fat. The recommended daily limit is 20.'],
   ['The problem','Art Silverman, who had to share the news, saw that “37 grams of saturated fat” meant nothing to most people. Is that bad? How bad?'],
   ['The tempting fix','A bar chart comparing 37 to 20 would be accurate, but it felt too dry for something so absurd.'],
   ['The message','At a press conference, CSPI said a medium popcorn had more of this fat than a bacon-and-eggs breakfast, a fast-food lunch and a steak dinner <b>put together</b>. They laid the whole day of food out on a table for the cameras.'],
   ['What happened','It was everywhere: TV news, front pages, late-night jokes. Popcorn sales fell, and most big theater chains stopped using the coconut oil behind it.']],
   'Same facts, different design. No celebrity, no scandal, no ad budget: just a true idea shaped so people could feel it.');}},
{part:0,src:'Introduction · On Stickiness',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">What turned “37 grams of fat” into an idea people acted on?</h1>');
  L.mc(L.card,['CSPI repeated the number until people learned it','CSPI found a famous doctor to say the number on TV','CSPI put the number next to meals people could picture'],2,
   'People can’t picture 37 grams. They can picture a day of greasy meals on one table, and they can feel how absurd that is.',
   'Neither repetition nor a famous voice did it. CSPI compared the fat to a full day of greasy meals people could picture, laid out on a table.');}},
{part:0,src:'Introduction · On Stickiness',run(L){
  L.h(L.kick('learn','What “sticky” means')+'<h1 class="q">Understood, remembered, and acted on</h1>'+
   L.prose('An idea is '+L.g('sticky','sticky')+' when people <b>understand</b> it, <b>remember</b> it, and it has a <b>lasting effect</b>: it changes what they think or do.')+
   L.prose('Not everything needs this. “Pass the gravy” doesn’t have to be memorable. People told the authors they need an idea to stick somewhere between once a week and once a month: a new strategy, a lesson, a cause.')+
   L.lanes([['chat','Usual advice','Make eye contact. Know your audience. Tell ’em what you’ll tell ’em. Repeat, repeat, repeat.',2],
            ['pencil','The missing piece','None of it tells you <b>what message</b> to say. Silverman knew how to speak. He needed to know what to say.',1]])+
   L.note('On repetition the authors are blunt: if you must say it ten times, the idea probably wasn’t well designed. No legend needs ten tellings.','info'));
  L.done();}},
{part:0,src:'Introduction · On Stickiness',pts:5,run(L){
  L.h(L.kick('pr','Worth the effort?')+'<h1 class="q">Which Kestrel messages need to stick, and which don’t?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Needs to stick','Doesn’t need to'],[
   ['Dana’s rule for new installers on how to move safely in an attic',0,'Installers must remember and act on it months later, alone in an attic. That’s worth designing.'],
   ['A note that van 7 needs gas before Friday',1,'It only has to work once. Plain is fine.'],
   ['Theo’s explanation that heat pumps work in cold winters',0,'Homeowners have to understand it, believe it and act on it. That’s a sticky-idea job.'],
   ['Where the team is ordering lunch today',1,'Like “pass the gravy,” it’s used and forgotten. No need for stickiness.'],
   ['Rosa’s three-year plan for the company',0,'A strategy only works if staff remember it and change what they do.']],
   'Save your design effort for the few ideas that must change what people think or do.');}},
{part:0,src:'Introduction · On Stickiness',pts:1,run(L){
  L.h(L.kick('pr','What would you advise?')+'<h1 class="q">Only about 4 in 100 people who get Jun’s mailer book a free Home Energy Check. Jun suggests mailing the same piece every month for a year. What does the book’s view suggest?</h1>');
  L.mc(L.card,['Repetition is the fix: people need to see it many times','Rethink the message: if it needs ten sends, it’s not well designed','Change the delivery: a glossier card will get more attention'],1,
   'The authors see heavy repetition as a sign of a weak design. Jun should rework what the mailer says first.',
   'Repetition and polish are delivery fixes. The book says the real problem is usually the message itself: a well-designed idea doesn’t need ten tellings.');}},

/* ---------- PART 2: SIX TRAITS ---------- */
{part:1,src:'Introduction · Who Spoiled Halloween?',run(L){
  L.h(L.kick('ex','A false idea that stuck')+'<h1 class="q">The Halloween candy scare</h1>');
  L.beats(L.card,[
   ['The rumor','In the 1960s and 70s, stories spread about strangers hiding razor blades in apples and poisoning candy.'],
   ['The reaction','Parents checked every candy bag. Hospitals offered to X-ray them. In a 1985 poll, 60 percent of parents worried their kids could be hurt.'],
   ['The research','Two sociologists studied every reported case since 1958. They found no case of a stranger causing a child life-threatening harm by tampering with Halloween candy.'],
   ['The cost','The scare still changed how millions of families behave, made neighbors suspicious of neighbors, and even led two states to pass special laws.']],
   'The book calls this the evil twin of the popcorn story. Both stuck, for the same reasons.');}},
{part:1,src:'Introduction · Six Principles of Sticky Ideas',pts:1,
 solve:async L=>{[...L.$('#tr').children].forEach(b=>b.click());},
 run(L){
  const T=[['Unexpected','A hidden danger in a harmless habit','Popcorn is a whole day of fatty food','Candy from neighbors could be deadly'],
           ['Simple','One clear action','Skip the popcorn','Check the candy bag'],
           ['Concrete','A picture you can see','A table of greasy meals','A razor blade in an apple'],
           ['Emotional','A feeling, not just a fact','Disgust','Fear']];
  const seen=new Set();
  L.h(L.kick('ex','Compare the twins')+'<h1 class="q">Tap each trait to see how both stories use it.</h1><div id="tr" style="display:flex;flex-wrap:wrap;gap:8px"></div>'+
   '<div id="tv" style="background:var(--soft);border-radius:16px;padding:14px;margin:12px 0;min-height:110px"><div class="small">Choose a trait above.</div></div><div id="tq"></div>');
  T.forEach((t,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=t[0];b.onclick=()=>{[...L.$('#tr').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(j);
    L.$('#tv').innerHTML='<div class="small" style="margin-bottom:8px"><b>'+t[0]+':</b> '+t[1]+'</div>'+L.lanes([['eye','Popcorn',t[2],1],['alert','Halloween',t[3],4]]);
    if(seen.size===T.length&&!L.$('#tq').innerHTML){const q=L.$('#tq');q.innerHTML='<h2 class="sub">One story is true and one is false. What does that tell you?</h2>';
      L.mc(q,['These traits help any idea spread, true or false','These traits only work for false scare stories'],0,
       'Exactly. The traits are neutral. The book’s goal is to put them to work for true, useful ideas.',
       'The popcorn story is true, and it uses the same four traits. The traits help any idea spread, so it’s worth using them for true ones.');}};L.$('#tr').appendChild(b);});}},
{part:1,src:'Introduction · Six Principles of Sticky Ideas',run(L){
  L.h(L.kick('learn','The six principles')+'<h1 class="q">Sticky ideas share six traits</h1>'+
   L.prose('After studying hundreds of sticky ideas, the authors kept seeing the same six traits. Their first letters make '+L.g('success','SUCCESs')+'.')+
   L.list([['Simple','Find the core and say only that. Short <i>and</i> deep, like a proverb.'],
     ['Unexpected','Break people’s expectations to get attention, then open gaps to keep it.'],
     ['Concrete','Use things people can see and touch, like an ice-filled bathtub.'],
     ['Credible','Help people believe it, ideally by letting them test it themselves.'],
     ['Emotional','Make people feel something. We care about people, not abstractions.'],
     ['Stories','Stories work like a mental rehearsal, so people are ready to act.']],1));
  L.done();}},
{part:1,src:'Introduction · Six Principles of Sticky Ideas',run(L){
  L.h(L.kick('learn','A checklist, not a formula')+'<h1 class="q">Think of a basketball player</h1>'+
   L.prose('Great players tend to have some of these: height, speed, power, court sense. But a short guard can be great, and a tall player can be clumsy. Picking strangers for a pickup game, you’d still bet on the seven-footer.')+
   L.prose('Ideas work the same way. You don’t need all six traits, and having all six guarantees nothing. They just raise the odds.')+
   L.flow([['eye','Spot','Notice ideas that already have the traits','like a store owner spotting a great customer story',3],['pencil','Create','Build the traits into your own idea on purpose','“genetically engineer” the player',1]],false));
  L.done();}},
{part:1,src:'Introduction · Six Principles of Sticky Ideas',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Jun says: “If our mailer has all six SUCCESs traits, it’s guaranteed to work.” Is that right?</h1>');
  L.mc(L.card,['Yes, all six traits together make success certain','No, the traits raise the odds but guarantee nothing'],1,
   'Right. Like a seven-footer on the court, an idea with the traits is a good bet, not a sure thing.',
   'The authors are clear there’s no formula. Like height in basketball, the traits make success more likely, not certain.');}},
{part:1,src:'Introduction · Six Principles of Sticky Ideas',pts:6,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which trait is Kestrel using?',['Simple','Unexpected','Concrete','Credible','Emotional','Stories'],[
   ['Marisol’s note: “The Nwosu kids’ bedroom has frost on the inside of the windows.”',2,'You can see frost on a window. That’s concrete.'],
   ['Jun’s mailer: “Don’t take our word for it. Compare your own January bills, before and after.”',3,'It lets readers test the claim themselves, which builds credibility.'],
   ['Rosa: “If you remember one thing: book the free check.”',0,'One core action, nothing else. That’s simple.'],
   ['Theo: “The biggest leak we find in most homes isn’t the windows.”',1,'It breaks what people expect, so they want to know more.'],
   ['Dana tells new hires how a rookie once put a boot through a customer’s ceiling, and how the crew made it right.',5,'It’s a story: a person, a problem and a change people can replay in their heads.'],
   ['A flyer asks parents to picture their kids sleeping warm without three blankets.',4,'It aims at a feeling, not a fact. That’s emotional.']]);}},

/* ---------- PART 3: THE VILLAIN ---------- */
{part:2,src:'Introduction · Tappers and Listeners',run(L){
  L.h(L.kick('learn','So why is it hard?')+'<h1 class="q">If the traits are common sense, why is work full of memos instead of proverbs?</h1>'+
   L.prose('Nobody argues <i>for</i> lifeless, overcomplicated messages. Most of us already believe we should “keep it simple” and “tell stories.” Yet we don’t.')+
   L.prose('The book blames a villain: a natural mental habit that gets in the way every time we try to explain something we know well. It has a name, the '+L.g('curse','Curse of Knowledge')+'. A simple game shows it at work.')+
   L.note('In the game, one person, the <b>tapper</b>, picks a well-known song like “Happy Birthday” and taps its rhythm on a table. The other, the <b>listener</b>, tries to name the song.','info'));
  L.done();}},
{part:2,src:'Introduction · Tappers and Listeners',pts:1,
 solve:async L=>{L.$('#po').children[2].click();L.$('#go').click();},
 run(L){
  let p=null;const N=['1 in 2','1 in 4','1 in 40'];
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">In the study, 120 songs were tapped. Tappers expected listeners to get 1 in 2. How often did listeners actually name the song?</h1><div id="po" style="display:flex;flex-wrap:wrap;gap:8px"></div>'+
   '<div id="run" hidden><div style="display:flex;align-items:center;justify-content:space-between;margin-top:10px"><div><div class="small">Songs tapped</div><div class="week" id="ct">0</div></div><button class="btn pri" id="go">'+L.ic('play')+'Tap 120 songs</button></div>'+
   '<div class="meterrow"><div class="lb">Tappers predicted</div><div class="meter"><div id="m0" style="background:var(--h3)"></div></div></div>'+
   '<div class="meterrow"><div class="lb">Listeners got</div><div class="meter"><div id="m1" style="background:var(--ok-strong)"></div></div></div></div>');
  N.forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=n;b.onclick=()=>{if(p!==null)return;p=j;b.classList.add('sel');L.$('#run').hidden=false;};L.$('#po').appendChild(b);});
  L.$('#go').onclick=function(){this.remove();let k=0;
    const t=setInterval(()=>{k+=10;const ct=L.$('#ct');if(!ct){clearInterval(t);return;}ct.textContent=k;
      const a=L.$('#m0'),b=L.$('#m1');if(a)a.style.width=Math.round(50*k/120)+'%';if(b)b.style.width=Math.max(1,Math.round(2.5*k/120))+'%';
      if(k>=120){clearInterval(t);L.award(p===2);
        L.sheet(p===2?'ok':'no',p===2?'You called it: 3 out of 120':'Only 3 out of 120',
         'Listeners named just 1 song in 40, while tappers expected 1 in 2. Tappers were stunned that the song wasn’t obvious. The next screen shows why.');L.done();}},150);};}},
{part:2,src:'Introduction · Tappers and Listeners',run(L){
  L.h(L.kick('learn','The Curse of Knowledge')+'<h1 class="q">The tapper hears a song. The listener hears knocks.</h1>'+
   L.lanes([['chat','The tapper','Hears the full tune playing in their head while tapping. The song feels obvious.',3],
            ['eye','The listener','Hears only scattered knocks on a table, like strange Morse code.',2]])+
   L.prose('Once we know something, it’s hard to imagine not knowing it. That knowledge “curses” us. CEOs and staff, teachers and students, experts and customers: the knower always hears a tune the others can’t.')+
   L.quote('Reversing the process is as impossible as un-ringing a bell.','Chip and Dan Heath, introduction')+
   L.prose('So there are only two reliable cures: never learn anything, or <b>transform your idea</b> so it makes sense to people who don’t know what you know. The six traits are the tools for that.'));
  L.done();}},
{part:2,src:'Introduction · Tappers and Listeners',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Theo tells homeowners a heat pump “holds a coefficient of performance above 2 at minus 15.” They still ask if it works in winter. Theo is baffled. What’s going on?</h1>');
  L.mc(L.card,['The homeowners aren’t listening closely enough','Theo needs to say it more slowly and clearly','Theo hears a tune the homeowners can’t hear'],2,
   'Theo is the tapper. To Theo the numbers clearly say “yes, it works.” To homeowners they’re just knocks on a table.',
   'Theo is the tapper. The numbers mean “yes” to Theo, but homeowners only hear knocks. Listening harder or speaking slower won’t give them the tune.');}},
{part:2,src:'Introduction · Tappers and Listeners',pts:1,
 solve:async L=>{const g=L.$('#cg').children;g[0].click();g[1].click();},
 run(L){
  const K=['Simple','Unexpected','Concrete','Credible','Emotional','Story'];
  const M=[['“Maximize shareholder value”',[0,0,0,0,0,0],['Short, but not deep','No','Not at all','Only because the CEO said it','No','No']],
           ['“Put a man on the moon and bring him back by the end of the decade”',[1,1,1,1,1,1],['Yes','Yes','Amazingly so','Sounded like fiction, but from a credible source','Yes','A story in miniature']]];
  const seen=new Set();
  L.h(L.kick('ex','Run the checklist')+'<h1 class="q">A CEO’s goal versus President Kennedy’s 1961 goal. Tap each to run the six-trait checklist.</h1><div id="cg" style="display:flex;flex-wrap:wrap;gap:8px"></div><div id="cv" style="margin:12px 0"></div><div id="cq"></div>');
  M.forEach((m,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=j?'The moon goal':'Shareholder value';b.onclick=()=>{[...L.$('#cg').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(j);
    L.$('#cv').innerHTML='<p class="prose" style="margin:0 0 8px"><b>'+m[0]+'</b></p>'+K.map((k,x)=>'<div class="small" style="display:flex;gap:8px;align-items:flex-start;margin:4px 0"><span style="color:var('+(m[1][x]?'--ok':'--no')+')">'+L.ic(m[1][x]?'check':'x')+'</span><span><b>'+k+':</b> '+m[2][x]+'</span></div>').join('');
    if(seen.size===2&&!L.$('#cq').innerHTML){const q=L.$('#cq');q.innerHTML='<h2 class="sub">The book jokes about how a typical CEO would have phrased Kennedy’s goal. Which version would that be?</h2>';
      L.mc(q,['“Lead the space industry through team-centered, strategically targeted innovation”','“Land a person on the moon and fly them home before 1970”'],0,
       'Right. Same goal, but the abstract version fails every check. That’s the Curse of Knowledge talking.',
       'That one keeps the moon, the person and the deadline, so it’s still concrete. The CEO-speak version is the abstract one that fails every check.');}};L.$('#cg').appendChild(b);});}},
{part:2,src:'Introduction · Tappers and Listeners',pts:5,run(L){
  L.h(L.kick('pr','Spot the curse')+'<h1 class="q">Is each person hearing a tune their audience can’t?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Curse at work','Curse avoided'],[
   ['Rosa tells crews their job is “customer-centric energy transformation.”',0,'To Rosa the phrase is full of meaning. To a crew it’s taps on a table.'],
   ['Before mailing it, Jun reads the new mailer to a neighbor who has never heard of Kestrel.',1,'Jun checks how a real listener hears it, instead of assuming the tune comes through.'],
   ['Theo’s homeowner flyer explains “ACH50 air-leakage readings.”',0,'An expert’s term that means nothing to most homeowners.'],
   ['Dana shows a new hire the exact spot where a boot went through a ceiling last spring.',1,'A concrete place and event. The new hire doesn’t need Dana’s 20 years to get it.'],
   ['Marisol’s report to Rosa says only “Call patterns trending negative, see CSAT.”',0,'Marisol knows what the numbers mean. Rosa sees a summary with nothing to picture.']],
   'The curse hits whoever knows more. The cure is to check the idea from the listener’s seat and transform it.');}},

/* ---------- PART 4: LEARNABLE ---------- */
{part:3,src:'Introduction · Systematic Creativity',run(L){
  L.h(L.kick('learn','Who comes up with great ideas?')+'<h1 class="q">Not just “creative geniuses”</h1>'+
   L.prose('Picture someone great at ideas. Most people imagine a hip ad-agency type in a long brainstorm. The book argues sticky ideas can be <b>learned</b>.')+
   L.prose('An Israeli research team gathered 200 award-winning ads. <b>89 percent</b> fit just six patterns, or '+L.g('template','templates')+'. One, “extreme consequences,” shows a surprising result of a product’s feature, like car speakers so loud a bridge starts to shake.')+
   L.flow([['star','Award winners','89% fit a template','',1],['x','Other ads','2% fit a template','',4]],false)+
   L.prose('Great ads turned out to be <i>more</i> predictable than weak ones.'));
  L.done();}},
{part:3,src:'Introduction · Systematic Creativity',run(L){
  L.h(L.kick('ex','The experiment')+'<h1 class="q">Can novices learn to be creative in two hours?</h1>');
  L.beats(L.card,[
   ['The setup','Three groups of novices wrote ads for a shampoo, a diet food and a sneaker. An expert picked each group’s best 15 without knowing how they were trained, and consumers rated them.'],
   ['Group 1 · No training','They started writing straight away. Consumers rated their ads “annoying.”'],
   ['Group 2 · Brainstorming','Two hours with a creativity coach on free-association brainstorming. Their ads were less annoying, but no more creative.'],
   ['Group 3 · Templates','Two hours learning the six templates. Their ads were rated <b>50 percent more creative</b> and made people feel 55 percent more positive about the products.']],
   'A few patterns beat a blank page. The SUCCESs checklist is meant to work the same way for your ideas.');}},
{part:3,src:'Introduction · Systematic Creativity',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Jun wants to fix the mailer with a four-hour, anything-goes brainstorm. Based on the ad study, what would likely help more?</h1>');
  L.mc(L.card,['Checking ideas against proven patterns','A longer, wilder brainstorm session','Hiring a born creative to write it'],0,
   'In the study, two hours with templates beat two hours of brainstorming. Jun’s team should work through the SUCCESs checklist.',
   'In the study, brainstorming made ads less annoying but no more creative, and untrained novices did worst. Learning proven patterns made the real difference.');}},
{part:3,src:'Introduction · Systematic Creativity',run(L){
  L.h(L.kick('learn','Isn’t a checklist confining?')+'<h1 class="q">Invent new ideas, not new rules</h1>'+
   L.prose('It can feel like painting by numbers. The authors say yes, that’s the point: if you want an idea to spread, work inside the rules that have helped other ideas spread for a long time.')+
   L.note('They’re honest about limits. There’s no foolproof recipe, and your process memo won’t become a proverb. But a little focused effort can make almost any idea stickier.','book')+
   L.prose('The rest of the course takes the six traits one at a time, starting with <b>Simple</b>.'));
  L.done();}},
{part:3,src:'Introduction · What Sticks?',pts:1,run(L){
  L.h(L.kick('pr','What would you say?')+'<h1 class="q">Rosa sighs: “Gossip will always beat home insulation. Our ideas are just boring.” What does the book suggest?</h1>');
  L.mc(L.card,['Rosa’s right: some topics can’t compete','Spend more on ads so the boring idea gets seen','Popcorn fat was boring too; design made it stick'],2,
