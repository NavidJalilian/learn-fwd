<!doctype html>
<html lang="en">

<title>Associations and Self-Interest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0010', title:'Make people care: associations and self-interest', minutes:19, icon:'flame',
  goals:['Make people care by showing one person, not a mass of numbers','Spot worn-out words and find a fresh association','Appeal to self-interest, and to more than money and safety'],
  parts:['The one','Associations','Self-interest','The basement'],
  read:'Read the first half of chapter 5, “Emotional,” for the full Rokia, Truth campaign, Honoring the Game and Pegasus stories.',
  glossary:{
    'mte':'Mother Teresa effect: people give and act more for one identifiable person than for a large problem described in statistics.',
    'hat':'Analytical Hat: the calculating frame of mind that numbers and sums put people in, which makes them feel less.',
    'stretch':'Semantic stretch: overusing a word for its emotional punch until it loses its power, the way “unique” no longer means one of a kind.',
    'wiify':'WIIFY: “what’s in it for you,” the benefit to the listener, spelled out plainly.',
    'bob':'Benefit of the benefit: what the benefit lets people do in their own lives. People don’t buy drill bits; they buy holes to hang their kids’ pictures.'
  },
  cheatsheet:[
    '<b>Belief isn’t enough.</b> To act, people have to <b>care</b>.',
    '<b>Mother Teresa effect:</b> one person moves us more than a mass. Adding statistics can even <i>lower</i> giving.',
    'Numbers put people in the <b>Analytical Hat</b>, which dampens feeling. Lead with the one, not the table.',
    'The basic move: <b>link</b> what people don’t care about yet to something they already do care about.',
    'Beware <b>semantic stretch</b>: overused words (“unique”) lose their power. Shift to new turf, like Honoring the Game.',
    'Don’t bury self-interest. Spell out the <b>benefit of the benefit</b>, and say “you.”',
    'Help people <b>imagine themselves</b> enjoying it: tangible beats huge.',
    'Don’t live in <b>Maslow’s basement</b>. People also care about learning, beauty and meaning, like Floyd Lee’s “morale.”'
  ],
  steps:[
/* ---------- PART 1: THE ONE ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Theo opens Kestrel’s grant talk to the city council. Which opening makes the council care more?</h1>');
  L.mc(L.card,['“Thousands of homes in our city are drafty and costly to heat.”','“Meet the Nwosu kids. Frost forms inside their bedroom window.”'],1,
   'One family you can picture beats a big, faceless number. This lesson is about why, and what else makes people care.',
   'The big number is true, but it’s hard to feel. One family you can picture moves people more. This lesson shows the research behind that.');}},
{part:0,src:'Chapter 5 · Emotional',run(L){
  L.h(L.kick('learn','Believing isn’t caring')+'<h1 class="q">People can believe you and still do nothing</h1>'+
   L.prose('The last two lessons were about making people <b>believe</b> an idea. But belief isn’t enough. Everyone believes there’s great suffering in Africa, and that fatty food is bad for you. Few act on it. For people to act, they have to <b>care</b>.')+
   L.prose('This isn’t about pushing emotional buttons like a tearjerker movie. The goal is simply to make people care enough to act.')+
   L.note('In 2004, researchers at Carnegie Mellon paid people five one-dollar bills for a survey, then handed them a surprise letter from Save the Children asking for a donation. One version gave <b>statistics</b> about hunger across Africa. The other told about <b>Rokia</b>, a seven-year-old girl in Mali. A third group got <b>both</b>.','book'));
  L.done();}},
{part:0,src:'Chapter 5 · Emotional',pts:1,
 solve:async L=>{L.$('#pk').children[1].click();},
 run(L){
  const N=['Statistics letter','Rokia letter','Both together'],V=[1.14,2.38,1.43];let p=null;
  L.h(L.kick('pr','Predict, then see')+'<h1 class="q">Which letter raised the most money per person?</h1><div id="pk"></div><div id="bars" hidden style="margin-top:12px">'+
   N.map((n,j)=>'<div class="meterrow"><div class="lb">'+n+'</div><div class="meter"><div id="b'+j+'" style="width:0%;transition:width .8s;background:var(--h'+(j+2)+')"></div></div><div class="small" id="v'+j+'" style="min-width:44px;text-align:right"></div></div>').join('')+'</div>');
  N.forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=n;
   b.onclick=()=>{if(p!==null)return;p=j;b.classList.add('sel');L.$('#bars').hidden=false;
    V.forEach((v,k)=>{L.$('#b'+k).style.width=Math.round(v/2.5*100)+'%';L.$('#v'+k).textContent='$'+v.toFixed(2);});
    L.award(p===1);
    L.sheet(p===1?'ok':'no',p===1?'You called it':'Rokia alone raised the most','Rokia’s letter raised more than twice as much as the statistics. And adding the statistics to Rokia’s story <i>cut</i> giving by almost a dollar. The book calls this the '+L.g('mte','Mother Teresa effect')+': we act for the one, not the mass.');L.done();};
   L.$('#pk').appendChild(b);});}},
{part:0,src:'Chapter 5 · Emotional',run(L){
  L.h(L.kick('learn','The Analytical Hat')+'<h1 class="q">Why did the statistics make people give less?</h1>'+
   L.prose('The researchers suspected that numbers put people in a calculating mood, and calculating crowds out feeling. So they ran a second study. Before reading Rokia’s letter, some people did a little math problem; others wrote down how the word “baby” made them feel.')+
   L.lanes([['scale','Primed to calculate','Gave about <b>$1.26</b> to Rokia',3],['flame','Primed to feel','Gave about <b>$2.34</b> to Rokia',2]])+
   L.prose('Just doing a sum lowered giving. Once we put on the '+L.g('hat','Analytical Hat')+', we feel less. Charities know this: you sponsor one named child, not “poverty,” and nobody donates to the general office-supplies fund.'));
  L.done();}},
{part:0,src:'Chapter 5 · Emotional',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Theo’s grant talk tells the Nwosu story. Then Theo wants to follow it straight away with a big table of energy-poverty statistics. What does the research predict?</h1>');
  L.mc(L.card,['The table will add to the story’s pull','The table may make the council care less','The table won’t change how people feel'],1,
   'Like the third Rokia letter: adding the statistics pulled giving down. Numbers right after the story can switch the council into the Analytical Hat.',
   'In the Rokia study, story plus statistics raised less than the story alone. Numbers can switch people into the Analytical Hat and dampen what they feel.');}},
{part:0,src:'Chapter 5 · The Truth',run(L){
  L.h(L.kick('ex','A real story from the book')+'<h1 class="q">Two antismoking campaigns, one horse race</h1>');
  L.beats(L.card,[
   ['The problem','Teenagers already believe smoking is dangerous. There’s no credibility problem. They start anyway. How do you make them care?'],
   ['Campaign 1: Truth','In a rough, documentary-style ad, teens unload body bags outside a tobacco company’s headquarters and stack them up: 1,800, the number of people tobacco kills each day. You can’t watch it without getting angry at the tobacco companies.'],
   ['Campaign 2','At the same time, a tobacco company ran its own required ads with the line “Think. Don’t Smoke.”'],
   ['Memory','In a survey of over 10,000 teens, 22 percent recalled the Truth ads unprompted; 3 percent recalled the Think ads. Yet most had seen both.'],
   ['Action','Teens who saw Truth were 66 percent less likely to say they’d smoke next year. Those who saw Think were 36 percent <i>more</i> likely.'],
   ['Why','“Think” asks teens to put on the Analytical Hat. Truth taps a feeling teens already have: resentment of authority. Teens once smoked to rebel; now they rebel by <i>not</i> smoking.']],
   'Truth didn’t make teens believe more. It made them care, by hooking onto an emotion they already felt.');}},
{part:0,src:'Chapter 5 · Emotional',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Does it invite feeling, or the Analytical Hat?',['Invites feeling','Analytical Hat'],[
   ['Grant slide: a formula for heat loss in an average drafty home',1,'A formula puts the council in calculating mode.'],
   ['Grant slide: a photo of frost on the inside of the Nwosu kids’ window',0,'One family, one cold room: the Mother Teresa effect.'],
   ['Mailer: “Work out your savings: multiply your floor area by 0.8, then…”',1,'Asking readers to do sums is exactly the priming that lowered giving.'],
   ['Mailer: the Elm Street family who finally carried their space heater down to the basement',0,'One family you can picture. Readers feel it before they think it.']]);}},

/* ---------- PART 2: ASSOCIATIONS ---------- */
{part:1,src:'Chapter 5 · Semantic Stretch and the Power of Association',run(L){
  L.h(L.kick('learn','Borrow feelings people already have')+'<h1 class="q">The basic move: link your idea to something people care about</h1>'+
   L.prose('You don’t have to create emotion from nothing. Most ideas piggyback: they <b>associate</b> themselves with something people already care about. A film critic once compared a movie to Einstein’s theory of relativity, to lend it a sense of awe, even though the theory says almost the opposite of “everything is relative.”')+
   L.prose('The catch: everyone reaches for the same words, so they wear out. Researchers call this '+L.g('stretch','semantic stretch')+'. In the top U.S. newspapers over 20 years, the share of articles calling something “unique” rose 73 percent, while “unusual” fell. Unique things didn’t multiply. The word just got cheaper.')+
   L.note('It becomes an arms race: if their product is “unique,” yours must be “truly unique.” Words like cool and awesome fade the same way.','alert'));
  L.done();}},
{part:1,src:'Chapter 5 · Semantic Stretch and the Power of Association',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Jun’s mailer calls the Home Energy Check “unique, revolutionary and world-class.” Readers feel nothing. Why?</h1>');
  L.mc(L.card,['The words are too technical for most readers','Those words are stretched thin from overuse','The mailer needs more of those strong words'],1,
   'Every company uses them, so they no longer carry a feeling. Piling on more just escalates the arms race.',
   'They aren’t technical, and more of them would only escalate the arms race. They’re stretched: every company uses them, so they carry no feeling.');}},
{part:1,src:'Chapter 5 · Fighting Semantic Stretch: The Case of “Sportsmanship”',run(L){
  L.h(L.kick('ex','A real story from the book')+'<h1 class="q">How a coaching group rescued a worn-out word</h1>');
  L.beats(L.card,[
   ['The problem','Jim Thompson, founder of the Positive Coaching Alliance, wanted to clean up bad behavior in youth sports. Fights between parents or coaches and referees were getting more common.'],
   ['The worn-out word','“Sportsmanship” had lost its punch. It had come to mean just not doing bad things: don’t yell at the referee. Sportsmanship trophies felt like prizes for losers.'],
   ['The ideal still lived','People still admired real examples, like a cyclist who slowed down to wait for a rival who had crashed. Parents, coaches and kids all wanted the ideal. Only the word was dead.'],
   ['New turf','Thompson’s group called it <b>Honoring the Game</b>. People care about the Game itself, which is bigger than any player. You owe it respect. Messing with it is dishonorable.'],
   ['The results','A Dallas league went from a technical foul every 15 games to one every 52. A California baseball league saw ejections for bad behavior fall 90 percent.']],
   'When a word is stretched too far, shift to new turf, or find an association that belongs to your idea alone.');}},
{part:1,src:'Chapter 5 · Fighting Semantic Stretch: The Case of “Sportsmanship”',pts:1,run(L){
  L.h(L.kick('pr','What would Thompson do?')+'<h1 class="q">Rosa wants installers to care about “customer service.” It’s on every company’s wall, and crews shrug. What should Rosa try?</h1><div id="hq"></div>');
  L.mc(L.$('#hq'),['Say “customer service” more often, in bigger letters','Start a monthly customer-service trophy for one crew','Recast it as new turf: crews are guests in someone’s home'],2,
   'Like Honoring the Game: crews already know how a good guest behaves, so the idea comes with feelings and rules built in.',
   'Repeating a stretched word or giving it a trophy keeps it on worn-out turf (remember the sportsmanship trophies). Being guests in someone’s home borrows a feeling crews already have.');}},

/* ---------- PART 3: SELF-INTEREST ---------- */
{part:2,src:'Chapter 5 · Appealing to Self-Interest',run(L){
  L.h(L.kick('learn','What’s in it for you?')+'<h1 class="q">People matter to themselves. Don’t bury that.</h1>'+
   L.prose('John Caples, often called the greatest copywriter ever, wrote mail-order ads. Each ad version listed a slightly different address, so Caples knew exactly which ads sold. His lesson from that laboratory: put self-interest into every headline.')+
   L.list([['target','Benefits, not features','Don’t brag about the world’s best seed. Promise the world’s best lawn. Even better, spell out the '+L.g('bob','benefit of the benefit')+': not drill bits, not holes, but your kids’ pictures on the wall.'],
           ['chat','Spell it out','Speech coach Jerry Weissman says every talk needs a clear '+L.g('wiify','WIIFY')+'. Busy listeners won’t connect the dots in time.'],
           ['person','Say “you”','Not “people will feel safe with these tires” but “<i>you</i> will feel safe.”']],1)+
   '<p class="small" style="margin-top:10px">The book notes many of Caples’s ads were shady. Take the method, not the hype.</p>');
  L.done();}},
{part:2,src:'Chapter 5 · Cable TV in Tempe',run(L){
  L.h(L.kick('ex','A study from the book')+'<h1 class="q">Imagining it made people buy it</h1>');
  L.beats(L.card,[
   ['The setup','In 1982, when cable TV was still new, students visited homeowners in Tempe, Arizona, with a short pitch about it.'],
   ['Group 1','Heard the benefits described: more entertainment, plan events ahead, skip the babysitter and gas, spend time at home.'],
   ['Group 2','Heard the <i>same</i> benefits, but were asked to <b>imagine themselves</b> enjoying them. The script was full of “you.”'],
   ['A month later','Cable arrived. Group 1 subscribed at about 20 percent, like the rest of the neighborhood. Group 2 subscribed at <b>47 percent</b>.']],
   'The benefits weren’t huge: mainly skipping the hassle of going out. It may be how <b>tangible</b> a benefit is, not how big, that makes people care.');}},
{part:2,src:'Chapter 5 · Cable TV in Tempe',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Which mailer line follows both Caples and the Tempe study?</h1>');
  L.mc(L.card,['“Homeowners enjoy warmer winters with Kestrel.”','“Kestrel can cut heating costs by a large margin.”','“Picture your family in a warm living room in January.”'],2,
   'It says “you” (your family) and asks readers to imagine themselves enjoying it, just like Group 2 in Tempe.',
   'That line talks about other people or about Kestrel. The winner speaks to “you” and asks readers to picture themselves enjoying it, like Group 2 in Tempe.');}},
{part:2,src:'Chapter 5 · Appealing to Self-Interest',pts:5,run(L){
  L.h(L.kick('pr','Dig to the benefit of the benefit')+'<h1 class="q">Jun’s mailer lists ten items. Sort them so Jun can lead with what readers really want.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Feature','Benefit','Benefit of the benefit'],[
   ['An infrared camera that finds hidden leaks',0,'It’s what Kestrel has, not what the reader gets.'],
   ['Your house stops leaking heat',1,'A real benefit, but still about the house.'],
   ['Your kids can play on their bedroom floor in January',2,'What the benefit lets the family do: the picture on the wall.'],
   ['Spray-foam sealing rated to last 30 years',0,'A spec. Readers have to work out why it matters.'],
   ['Your winter heating bill gets smaller',1,'A benefit. Ask once more what it lets people do, and you reach the benefit of the benefit.']],
   'Lead with the benefit of the benefit. Features belong lower down, as support.');}},
{part:2,src:'Chapter 5 · Cable TV in Tempe',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Tap each piece to change it until Jun’s headline makes readers imagine themselves enjoying the result.</h1>');
  L.sentence(L.card,[['Studies show','Imagine','Homeowners report'],['your kids','residents','families citywide'],['seeing lower energy use','gaining better insulation values','waking up in a warm bedroom'],['all next winter.','over the system’s lifetime.','by a measurable percentage.']],[1,0,2,0],
   [['That invites the Analytical Hat. Ask readers to picture it instead.','That’s about other people. Make the reader the star.'],['“Residents” is someone else. Make it the reader’s own family.','Citywide is the mass, not the one.'],['Energy use is abstract. What would readers actually see?','A spec, not a picture. Show the moment they’d enjoy.'],['Too far off to picture. Keep it close: next winter.','Percentages put the Analytical Hat back on.']],
   'It says “you,” and it asks readers to picture a tangible moment, just like the Tempe homeowners who imagined themselves with cable.');}},

/* ---------- PART 4: THE BASEMENT ---------- */
{part:3,src:'Chapter 5 · Maslow',run(L){
  L.h(L.kick('learn','More than money and safety')+'<h1 class="q">People care about more than their basic needs, all at once</h1>'+
   L.prose('If self-interest meant only wealth and safety, no one would join the army. In 1954, psychologist Abraham Maslow summed up research on what people seek:')+
   L.tiers([['star','Transcendence, self-actualization','Help others reach their potential; reach your own.',''],
            ['bulb','Aesthetic, learning','Beauty, order and balance; to know and understand.',''],
            ['people','Esteem, belonging','Achievement and status; love, family and friends.',''],
            ['home','Security, physical','Safety and stability; food, warmth and comfort.','']])+
   L.prose('Maslow called it a ladder you climb one rung at a time. The book says later research disagrees: people pursue all of these <b>at the same time</b>. But when we talk about “self-interest,” we usually stop at the bottom few.'));
  L.done();}},
{part:3,src:'Chapter 5 · Maslow',pts:1,
 solve:async L=>{L.$('#me').children[2].click();L.$('#ot').children[0].click();},
 run(L){
  const P=['A down payment on that car or home project','Extra security for a rainy day','Proof the company values your work'];let a=null,b=null;
  L.h(L.kick('pr','Try it on yourself')+'<h1 class="q">Kestrel offers a $1,000 bonus for hitting targets. Which way of describing it would motivate <i>you</i> most?</h1><div id="me"></div><div id="s2" hidden><h2 class="sub">Now: which would motivate most of your <i>coworkers</i>?</h2><div id="ot"></div></div><div id="rv"></div><div id="hq"></div>');
  const mk=(host,set)=>P.forEach((t,j)=>{const c=document.createElement('button');c.className='chip';c.textContent=t;c.onclick=()=>set(j,c);L.$(host).appendChild(c);});
  const reveal=()=>{L.$('#rv').innerHTML=L.note('<b>What the book reports:</b> most people pick <b>being valued</b> for themselves, but predict that <b>others</b> want the down payment, then the security. The same gap shows up when people pitch a job: they’d want the chance to learn; others, they assume, want security or status.','people');
    const q=L.$('#hq');q.innerHTML='<h2 class="sub">What does this gap tell Rosa about bonus messages?</h2>';
    L.mc(q,['Most staff secretly care only about the cash','Recognition only motivates senior managers','We wrongly assume others live in the basement'],2,
     'That’s '+L.g('basement','Maslow’s basement')+': we picture ourselves in the penthouse and everyone else below. Rosa’s staff likely care about being valued too.',
     'The finding points the other way: people say they’re moved by being valued, yet assume others only want money or safety. That’s Maslow’s basement.');};
  mk('#me',(j,c)=>{if(a!==null)return;a=j;c.classList.add('sel');L.$('#s2').hidden=false;});
  mk('#ot',(j,c)=>{if(b!==null)return;b=j;c.classList.add('sel');reveal();});}},
{part:3,src:'Chapter 5 · Maslow',run(L){
  L.h(L.kick('learn','Maslow’s basement')+'<h1 class="q">We live in the penthouse; we assume everyone else lives downstairs</h1>'+
   L.prose('Most of us think we’re moved by meaning, learning and being valued, but that other people care mainly about pay and security. The book calls this living in '+L.g('basement','Maslow’s basement')+'.')+
   L.flow([['person','About ourselves','“I want to learn and be valued.”','',2],['people','About others','“They just want the money.”','',4]])+
   L.prose('Money and security do motivate. Everyone likes a bonus. The mistake is appealing <i>only</i> to them, and missing deeper reasons people care.'));
  L.done();}},
{part:3,src:'Chapter 5 · Dining in Iraq',run(L){
  L.h(L.kick('ex','A real story from the book')+'<h1 class="q">The mess-hall manager who wasn’t in charge of food</h1>'+L.quote('I am in charge of morale.','Floyd Lee, on running the Pegasus dining hall'));
  L.beats(L.card,[
   ['The job','Army food is usually bland and served in bulk. Floyd Lee, a retired military cook, came out of retirement to run the Pegasus dining hall near Baghdad’s airport.'],
   ['The mission','Lee knew soldiers worked 18-hour days under constant danger. He defined his job not as serving food but as running morale.'],
   ['The details','Sports banners on the walls, soft lights instead of harsh tubes, tablecloths, tall chef’s hats. Five kinds of pie at night. Prime rib marinated for two days.'],
   ['The twist','Pegasus used the same 21-day Army menu and the same suppliers as every other dining hall. Only the mission was different.'],
   ['The result','Stories spread of soldiers driving one of Iraq’s most dangerous roads just to eat there.']],
   'Serving food is a job; lifting morale is a mission. Lee reached past the basement, to beauty, mastery and helping others.');}},
{part:3,src:'Chapter 5 · Dining in Iraq',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Dana wants Kestrel’s install crews to care more about their work. Which message climbs out of Maslow’s basement?</h1>');
  L.mc(L.card,['Your crew is in charge of a family’s first warm winter','Hit your install targets and you’ll earn the bonus','Steady work all winter: every crew keeps its hours'],0,
   'Like Floyd Lee’s “morale,” it turns a job into a mission that matters to someone else.',
   'Bonuses and steady hours do motivate, but they stay in the basement. Being in charge of a family’s first warm winter is a mission, like Floyd Lee’s morale.');}},
{part:3,src:'Chapter 5 · Maslow',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which idea from this lesson is at work?',['Mother Teresa effect','Semantic stretch','Self-interest','Maslow’s basement'],[
   ['Rosa tells the council Kestrel is “deeply committed to sustainability.” The council shrugs.',1,'A word every company uses. It’s been stretched until it carries no feeling.'],
   ['Theo opens with one cold bedroom instead of a chart of 600 homes.',0,'One family moves people more than the mass.'],
   ['Jun swaps “homeowners save money” for “you stop paying to heat the street.”',2,'Self-interest, spelled out and aimed at “you.”'],
   ['Rosa assumes installers care only about pay, so every message is about the bonus.',3,'Assuming others live downstairs means missing what else they care about.']]);}},
{part:3,src:'Chapter 5 · Emotional',pts:1,run(L){
  L.h(L.kick('pr','Put it together')+'<h1 class="q">Theo’s draft grant talk for Councilmember Brandt: a cost table for 600 homes, a heat-loss chart, then “we are uniquely positioned.” What’s the best single change?</h1><div id="hq"></div>');
  L.mc(L.$('#hq'),['Add a second table breaking costs down by ward','Open with the Nwosu family, then show the numbers','Swap “uniquely” for “truly, exceptionally” instead'],1,
   'Start with the one family Brandt can picture. The numbers still matter for credibility, but leading with them puts everyone in the Analytical Hat.',
   'More tables push Brandt deeper into the Analytical Hat, and stronger adjectives just escalate the arms race. Open with the one family, then bring in the numbers.');}}
  ]
});
</script>
</body>
</html>
