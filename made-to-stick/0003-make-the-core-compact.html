<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Make the Core Compact</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0003', title:'Make the core compact', minutes:19, icon:'bulb',
  goals:['Tell a compact, core message from an empty sound bite','Pack a lot of meaning into few words by using what people already know','Pick an analogy that helps people make their own decisions'],
  parts:['Core + compact','Proverbs','Use what’s there','Analogies'],
  read:'Read the second half of chapter 1, “Simple,” for the full Palm Pilot, pomelo, Hollywood and Disney stories.',
  glossary:{
    'compact':'Compact: short and light enough to learn and remember, like a proverb.',
    'proverb':'Proverb: a short saying that carries a deep, useful lesson, like “a bird in the hand is worth two in the bush.”',
    'creep':'Feature creep: the slow pile-up of extra features until a product no longer does its main job well.',
    'useless':'Useless accuracy: a message so complete and exact that people can’t use it to predict or decide anything.',
    'pitch':'High-concept pitch: a one-line description of a new idea that borrows a known one, like “Die Hard on a bus.”',
    'generative':'Generative analogy: a comparison so useful that people can work out how to act in new situations from it.'
  },
  cheatsheet:[
    '<b>Simple = core + compact.</b> Finding the core is step one; making it short enough to stick is step two.',
    'Compact alone is a <b>sound bite</b>. Compact <i>and</i> core is a <b>proverb</b>: it guides choices.',
    'Show you mean it: put the core above costs and comfort, like Adams’s “names, names, and names.”',
    'Fight feature creep with a <b>visual proverb</b>, like Hawkins’s wooden block: “Where would it fit?”',
    '<b>Use what’s there.</b> Tie the new idea to a schema people already have: a pomelo is a supersized grapefruit.',
    'Avoid <b>useless accuracy</b>. Give just enough to act on, then a little more, then a little more.',
    'A <b>high-concept pitch</b> borrows a known idea so people can make dozens of decisions from a few words.',
    'The best analogies are <b>generative</b>: Disney’s “cast members” tells staff how to act in new situations.'
  ],
  steps:[
/* ---------- PART 1: CORE + COMPACT ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">A new hire gets guidance from two managers. Which will still be shaping their choices six months from now?</h1>');
  L.mc(L.card,['A twelve-page handbook of company values','One short line about what matters most'],1,
   'Nobody carries twelve pages around in their head. A short line they remember can guide them on the spot. This lesson is about making that line short <i>and</i> meaningful.',
   'The handbook may be complete, but nobody carries twelve pages in their head. A short line they remember can guide them on the spot.');}},
{part:0,src:'Chapter 1 · Sharing the Core',run(L){
  L.h(L.kick('ex','Step 2: sharing the core')+'<h1 class="q">How Hoover Adams made “local” stick with his staff</h1>');
  L.beats(L.card,[
   ['Where we left off','Adams, who ran the Dunn <i>Daily Record</i>, had found his core: local focus. Most publishers agree with that and still fill their pages with wire stories. Adams had to make it stick.'],
   ['Names over money','He said he’d gladly hire more typesetters and add pages to every edition, if reporters brought in enough local names. Local beat costs.'],
   ['Names over polish','He bet that if the paper reprinted the phone book, half the town would check it for their own name.'],
   ['The phrase','Asked why the paper succeeds, he answered: <b>names, names, and names</b>. No staffer could misread that. It’s concrete and short.'],
   ['Everywhere at once','Over some 20,000 issues, staff made countless calls without him: which story, which photo, what to cut. They didn’t freeze, because the intent was clear.']],
   'Adams couldn’t be in every meeting. By finding the core and sharing it clearly, he was there anyway.');}},
{part:0,src:'Chapter 1 · Simple = Core + Compact',run(L){
  L.h(L.kick('learn','Simple = core + compact')+'<h1 class="q">The second half of simple: make it short enough to carry</h1>'+
   L.flow([['target','Core','The one thing that matters most','from lesson 2',1],['pencil','Compact','Short enough to learn and remember','this lesson',2],['check','Simple','A message people can use','',3]])+
   L.prose('We can only take in so much at once. A sentence beats a paragraph; two bullet points beat five. The less information an idea carries, the stickier it is.')+
   L.prose('But '+L.g('compact','compact')+' alone isn’t enough. A short line can be false (“the earth is flat”), beside the point (“goats like sprouts”) or bad advice. Short says nothing about worth.')+
   L.note('Experts often resist this. Deep in the nuance, simplifying feels like “dumbing down.” That’s the '+L.g('curse','Curse of Knowledge')+' talking.','alert'));
  L.done();}},
{part:0,src:'Chapter 1 · Simple = Core + Compact',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Jun proposes a new tagline for Kestrel: “Comfort, redefined.” It’s short and catchy. What’s wrong with it?</h1>');
  L.mc(L.card,['Nothing; being short is what simple means','It’s compact, but it doesn’t carry the core','It needs to be longer and more detailed'],1,
   'Right. It would fit any company selling anything. Compare Kestrel’s core: warm homes on smaller winter bills. Simple is core <i>and</i> compact.',
   'Short isn’t the whole test, and longer won’t fix it. The tagline could belong to any company. Simple means compact <i>and</i> core.');}},
{part:0,src:'Chapter 1 · Sharing the Core',pts:1,run(L){
  L.h(L.kick('pr','Show you mean it')+'<h1 class="q">Rosa wants crews to see that “warm homes on smaller winter bills” is more than a nice phrase. Which line follows Adams’s lead?</h1>');
  L.mc(L.card,['“Warm homes on smaller bills is one of our nine pillars.”','“Our journey toward customer-centric energy transformation.”','“I’d rather skip the trade show than delay one attic job.”'],2,
   'Like Adams hiring typesetters for names, Rosa puts the core above something leaders usually protect. That shows people it truly comes first.',
   'Adams showed the core beat other goals, even costs. Calling it one of nine pillars, or wrapping it in strategy words, tells people it’s optional.');}},

/* ---------- PART 2: PROVERBS ---------- */
{part:1,src:'Chapter 1 · “A Bird in the Hand”',run(L){
  L.h(L.kick('learn','Proverbs')+'<h1 class="q">Can a sound bite say anything that matters? Proverbs can.</h1>'+
   L.prose('“A bird in the hand is worth two in the bush” warns against trading a sure thing for a maybe. Versions exist in Swedish, Spanish, Polish, Russian and more. One of Aesop’s fables makes the same point about 2,500 years ago.')+
   L.prose('Nobody ran an ad campaign for it. It spread by itself, across cultures and centuries. Almost every documented culture has its own set of '+L.g('proverb','proverbs')+'.')+
   L.quote('Short sentences drawn from long experience.','Cervantes, defining proverbs, quoted in chapter 1')+
   L.lanes([['chat','Sound bite','Short. Often empty or misleading.',4],['star','Proverb','Short <i>and</i> deep: compact and core.',1]]));
  L.done();}},
{part:1,src:'Chapter 1 · “A Bird in the Hand”',run(L){
  L.h(L.kick('ex','Proverbs guide choices')+'<h1 class="q">A proverb is a rule of thumb people use on their own</h1>');
  L.beats(L.card,[
   ['What they’re for','Proverbs help each person decide well when a group shares the same standards. The Golden Rule can guide a whole lifetime.'],
   ['A newsroom proverb','“Names, names, and names” works the same way. Taken literally, it’s no use to a photographer, unless they shoot name tags.'],
   ['The choice','A <i>Daily Record</i> photographer has a dull committee meeting and a gorgeous sunset over the park. Which to shoot?'],
   ['The answer','The committee meeting: specific local people doing specific things. The proverb decided it, and Adams wasn’t in the room.']],
   'A proverb is compact enough to remember and deep enough to settle real choices.');}},
{part:1,src:'Chapter 1 · “A Bird in the Hand”',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Why does the book aim for proverbs rather than sound bites?</h1>');
  L.mc(L.card,['A proverb is compact and also carries the core','A proverb is always shorter than a sound bite','A proverb sounds older, so people trust it more'],0,
   'Both are short. Only the proverb carries something deep enough to guide a decision.',
   'Length and age aren’t the difference. Both are short; only the proverb carries the core, so it guides decisions.');}},
{part:1,src:'Chapter 1 · “A Bird in the Hand”',pts:5,run(L){
  L.h(L.kick('pr','Sound bite or proverb?')+'<h1 class="q">Kestrel staff suggest five short lines. Which would actually guide a choice on a job?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Sound bite','Proverb'],[
   ['“Kestrel: feel the difference.”',0,'Catchy, but it tells nobody what to do differently.'],
   ['“Seal first, then heat.”',1,'It settles a real choice on every job: fix the leaks before sizing the heat pump.'],
   ['“Energy for tomorrow, today.”',0,'It sounds good and means almost nothing.'],
   ['“If it doesn’t warm the home or cut the bill, it can wait.”',1,'Anyone can test an idea against it, like Southwest’s salad.'],
   ['“We are passionate about excellence.”',0,'Every company says this. It settles no choice.']],
   'Both kinds are short. The proverbs carry the core, so people can use them to decide.');}},
{part:1,src:'Chapter 1 · Palm Pilot and the Visual Proverb',run(L){
  L.h(L.kick('ex','A proverb you can hold')+'<h1 class="q">The Palm Pilot and the wooden block</h1>');
  L.beats(L.card,[
   ['Feature creep','Why do remotes have buttons nobody uses? An engineer sees spare room and adds a calendar switch. Nobody cares enough to fight it. That’s '+L.g('creep','feature creep')+'.'],
   ['The danger','In the early 1990s, handheld organizers had all failed. One rival looked like a shrunken computer, with a keyboard and plug-in ports.'],
   ['The goal','Team leader Jeff Hawkins wanted four things done well: calendar, contacts, memos and task lists. Nothing more.'],
   ['The block','He carried a wooden block the size of the Palm and pretended to take notes on it. When someone proposed a feature, he pulled it out and asked where it would fit.'],
   ['The parallel','Like Clinton’s campaign, the team was full of able people who wanted to do everything. Both needed a simple reminder to say no.']],
   'The block was a <b>visual proverb</b>: do a few things, and do them well. The product was defined as much by what it was not.');}},
{part:1,src:'Chapter 1 · Palm Pilot and the Visual Proverb',pts:1,run(L){
  L.h(L.kick('pr','Jun’s wooden block')+'<h1 class="q">Every colleague who sees Jun’s mailer suggests one more benefit to add. What would be Jun’s version of Hawkins’s block?</h1>');
  L.mc(L.card,['A rule that only Rosa may suggest new benefits','A longer mailer so each benefit gets a page','A blank postcard: “Show me where this fits”'],2,
   'Like the block, the blank card makes the limit visible. Every new idea has to win a place on a small space, so most quietly drop out.',
   'Hawkins didn’t add room or pick who could ask. He made the limit visible. A blank postcard makes every new benefit fight for space.');}},

/* ---------- PART 3: USE WHAT’S THERE ---------- */
{part:2,src:'Chapter 1 · Using What’s There',pts:1,
 solve:async L=>{L.$('#rg').click();},
 run(L){
  L.h(L.kick('ex','See it happen')+'<h1 class="q">Compact has limits. How do you fit more into a short message? Study these letters for a few seconds.</h1>'+
   '<div id="lt" style="font:600 22px/1.5 ui-monospace,Menlo,monospace;letter-spacing:.06em;background:var(--soft);border-radius:16px;padding:16px;text-align:center;word-break:break-word">J FKFB INAT OUP SNA SAI RS</div>'+
   '<p class="small" id="lc" style="margin-top:8px">20 letters. Most people recall about 7 to 10 of them.</p>'+
   '<button class="btn pri" id="rg" style="margin-top:6px">'+L.ic('cycle')+'Regroup the same letters</button><div id="lq"></div>');
  L.$('#rg').onclick=function(){this.remove();
    L.$('#lt').textContent='JFK FBI NATO UPS NASA IRS';
    L.$('#lc').innerHTML='Same 20 letters, same order. Now it’s <b>6 things you already know</b>. Most people do far better.';
    const q=L.$('#lq');q.innerHTML='<h2 class="sub">“JFK” carries far more information than three letters. Why is it easier to remember?</h2>';
    L.mc(q,['The letters are in a more logical order now','Each group points to something already in memory','Groups of three or four are always easy to recall'],1,
     'The work of remembering JFK was done long ago. You just plant one flag on it, instead of three flags for three loose letters.',
     'The order didn’t change, and random groups of three wouldn’t help. Each group points to an idea already in your memory, so it costs one flag instead of several.');};}},
{part:2,src:'Chapter 1 · The Pomelo Schema',run(L){
  L.h(L.kick('learn','Use what’s there')+'<h1 class="q">A pomelo is a supersized grapefruit</h1>'+
   L.prose('The book explains a pomelo two ways:')+
   L.lanes([['list','Explanation 1','The largest citrus fruit. Thick, soft rind. Flesh from pale yellow to coral pink, juicy to dry, sweet to tart.',4],['bulb','Explanation 2','Basically a supersized grapefruit with a very thick, soft rind.',1]])+
   L.prose('The second calls up a '+L.g('schema','schema')+' you already have, grapefruit, then tells you what to change. Your picture inherits the rest: you can guess pomelo juice would mix well with orange juice, as grapefruit juice does.')+
   L.note('Six months later, people remember the lead at best. From the first, “a citrus fruit.” From the second, “like a grapefruit.”','clock'));
  L.done();}},
{part:2,src:'Chapter 1 · The Pomelo Schema',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Many homeowners have never seen a heat pump. Which explanation gives them a schema to build on?</h1>');
  L.mc(L.card,['An electric vapor-compression system, rated by efficiency','Like an air conditioner that can also run backward','A modern, efficient, all-season comfort solution'],1,
   'Everyone knows what an air conditioner does. Theo just tells them what to change: it can also run the other way to heat the house.',
   'Technical terms or vague praise give people nothing to picture. “An air conditioner that also runs backward” starts from something they already know.');}},
{part:2,src:'Chapter 1 · Complexity from Simplicity',run(L){
  L.h(L.kick('learn','Complexity from simplicity')+'<h1 class="q">Start simple, then stretch it</h1>'+
   L.prose('Compact doesn’t mean everything stays basic. Teachers build expertise from simple schemas: economics starts with two people trading apples and oranges; physics starts with pulleys. Students then stretch and combine them.')+
   L.prose('Kids learn that electrons circle the nucleus like planets around the sun. Physicists know it isn’t quite true, but it gets kids closer than “probability clouds” would.')+
   L.flow([['scale','Accurate but useless','“Maximize shareholder value”','can’t help a flight attendant decide',4],['target','Useful','“THE low-fare airline”','settles the salad question',1]])+
   L.note('A message people can’t use to predict or decide has no value, however accurate. '+L.g('useless','Useless accuracy')+' is a symptom of the Curse of Knowledge. Give just enough, then a little more, then a little more.','info'));
  L.done();}},
{part:2,src:'Chapter 1 · Complexity from Simplicity',pts:1,run(L){
  L.h(L.kick('pr','Layer it')+'<h1 class="q">Theo will explain heat pumps to homeowners in layers. Drag the four lines into order: just enough first, then a little more.</h1>');
  L.order(L.card,[
   'A heat pump is like an air conditioner that can also run backward.',
   'In winter it pulls heat out of the outdoor air and moves it inside.',
   'Even freezing air still holds some heat, so it keeps working.',
   'Here’s how its efficiency changes as our winter temperatures drop.'],
   'Schema first, then one stretch of it, then the surprise, then the numbers for those who want them. Each layer builds on the one before.',
   ['First','Then','Then','Last']);}},
{part:2,src:'Chapter 1 · Complexity from Simplicity',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Useful, or uselessly accurate?',['Useful to them','Uselessly accurate'],[
   ['Rosa tells crew leads their goal is “to optimize lifetime customer value.”',1,'It may be true, but a crew lead can’t use it to decide anything in an attic.'],
   ['Dana tells new installers: “Step only on the beams. Everything else is ceiling.”',0,'Short, and it settles every step they take in an attic.'],
   ['Theo opens a homeowner talk with airflow readings for every room tested.',1,'Exact, and nobody in the room can act on it yet. Start with the schema.'],
   ['Theo tells the council: “A sealed house works like a thermos, not a mug.”',0,'Everyone knows a thermos. It makes the point quickly, and details can follow.']]);}},

/* ---------- PART 4: ANALOGIES ---------- */
{part:3,src:'Chapter 1 · Schemas in Hollywood: High-concept Pitches',run(L){
  L.h(L.kick('learn','High-concept pitches')+'<h1 class="q">Five words that settle a hundred-million-dollar plan</h1>'+
   L.prose('A movie idea changes with every writer, director, star and marketer who touches it. So Hollywood leans on '+L.g('pitch','high-concept pitches')+': <i>Speed</i> was “<i>Die Hard</i> on a bus.” <i>Alien</i> was “<i>Jaws</i> on a spaceship.”')+
   L.prose('Those words pour a known movie into a new idea. From “<i>Die Hard</i> on a bus” alone you can decide:')+
   L.list([['play','Director','An action director, not an indie one.'],['star','Cast','A big star, not an ensemble.'],['cal','Release','Summer, not Christmas, with a big budget.']],2)+
   L.prose('A designer told “<i>Jaws</i> on a spaceship” knows the ship should feel cramped, dingy and sweaty, not gleaming. A good pitch doesn’t make a good movie, but a bad one can sink it.'));
  L.done();}},
{part:3,src:'Chapter 1 · Schemas in Hollywood: High-concept Pitches',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Jun briefs a video crew on an ad for the Home Energy Check. Which brief lets the crew make the most decisions on their own?</h1>');
  L.mc(L.card,['“A fresh, modern, customer-first piece.”','“A home makeover show, but for drafts.”','“Something that shows our values and quality.”'],1,
   'The crew already knows makeover shows: a real family, a walk-through, a big before-and-after reveal. Six words settle the format, the cast and the ending.',
   'Vague praise gives the crew nothing to work from. “A home makeover show, but for drafts” borrows a format they know, so they can decide format, cast and ending.');}},
{part:3,src:'Chapter 1 · Generative Analogies',run(L){
  L.h(L.kick('learn','Generative analogies')+'<h1 class="q">Some comparisons tell people how to act in new situations</h1>'+
   L.prose('Some analogies don’t just explain; they spark new ideas. Psychologists comparing the brain to a computer found new questions to ask. A psychologist named Donald Schon called such metaphors '+L.g('generative','generative')+'.')+
   L.lanes([['star','Disney: “cast members”','People audition for roles, are onstage in the park, serve guests and wear costumes. So: no breaks in costume in public. Street sweepers are trained to answer visitors’ questions.',1],
            ['x','Subway: “sandwich artists”','Artists express themselves. Subway doesn’t want that. The label gives staff no guide to how to act.',4]])+
   L.prose('You can predict a cast member’s behavior in a situation nobody wrote down. That’s the test of a generative analogy.'));
  L.done();}},
{part:3,src:'Chapter 1 · Generative Analogies',pts:1,
 solve:async L=>{const g=L.$('#gg').children;g[0].click();g[1].click();},
 run(L){
  const S=['Muddy boots at the front door','A homeowner asks a question mid-job','Finishing at 5 p.m. with dust on the floor'];
  const R=[['Cover them or take them off, like any visitor','Stop, listen and answer politely','Clean up before leaving, as a guest would'],
           ['Rock stars… stomp in?','Rock stars… sign an autograph?','Rock stars… leave it for the crew?']];
  const seen=new Set();
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Dana is choosing a phrase for new installers. Switch between the two and watch what each one predicts on a job.</h1><div id="gg" style="display:flex;flex-wrap:wrap;gap:8px"></div>'+
   '<div style="background:var(--soft);border-radius:16px;padding:14px;margin:10px 0;min-height:140px" id="gv"><div class="small">Choose a phrase above.</div></div><div id="gq"></div>');
  ['Guests in someone’s home','Comfort rock stars'].forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.innerHTML=L.ic(j?'flame':'home')+n;b.onclick=()=>{[...L.$('#gg').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(j);
    L.$('#gv').innerHTML=S.map((d,x)=>'<div style="margin:0 0 10px"><div class="small"><b>'+d+'</b></div><div class="small" style="display:flex;gap:6px;align-items:flex-start;color:var('+(j?'--no':'--ok')+')">'+L.ic(j?'alert':'check')+'<span>'+R[j][x]+'</span></div></div>').join('');
    if(seen.size===2&&!L.$('#gq').innerHTML){const q=L.$('#gq');q.innerHTML='<h2 class="sub">Which phrase is a generative analogy?</h2>';
      L.mc(q,['Guests in someone’s home','Comfort rock stars'],0,
       'Like Disney’s cast members, “guests” tells installers how to act in situations Dana never wrote down.',
       '“Rock stars” is Kestrel’s “sandwich artists”: catchy, but it predicts nothing useful, or the wrong thing. “Guests” tells installers what to do.');}};L.$('#gg').appendChild(b);});}},
{part:3,src:'Chapter 1 · Generative Analogies',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Generative or empty?',['Generative','Empty label'],[
   ['Home Energy Check technicians as “house detectives”',0,'Detectives look for clues, ask questions and explain what they found. That’s the job.'],
   ['Customer care reps as “happiness ninjas”',1,'Ninjas are silent and hidden. It tells reps nothing useful about a call.'],
   ['Treating each house “like a patient at a checkup”',0,'Examine first, diagnose, then treat and explain. It guides the whole visit.'],
   ['Sales staff as “comfort wizards”',1,'Wizards work secret magic. Customers want the opposite: plain explanations.']]);}},
{part:3,src:'Chapter 1 · The Power of Simplicity',run(L){
  L.h(L.kick('learn','The power of simplicity')+'<h1 class="q">Swap something hard to think about for something easy</h1>'+
   L.prose('Proverbs and generative analogies work the same trick. “A bird in the hand” turns a tense, complicated choice into a simple picture. A Disney worker facing something new can ask what an actor would do.')+
   L.flow([['alert','Hard','A new, messy situation','',4],['bulb','Swap','Proverb or analogy','',2],['check','Easy','A choice people can make','',3]])+
   L.note('Coming up with a short phrase is easy; anyone can. Coming up with a short phrase that is also <b>profound</b> is hard. The book argues it’s worth the effort.','star'));
  L.done();}},
{part:3,src:'Chapter 1 · The Power of Simplicity',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Mixed review: what’s going on?',['Compact but not core','Uses a schema','Uselessly accurate','Generative analogy'],[
   ['Rosa’s new banner for the office: “Kestrel: Bold. Bright. Better.”',0,'Short and catchy, but it carries nothing about warm homes or smaller bills.'],
   ['Theo describes the Home Energy Check as “a blood test for your house.”',1,'It borrows something people know: a quick check that finds hidden problems.'],
   ['Theo’s flyer gives a full table of heat-loss figures before saying what a heat pump is.',2,'Exact, but readers can’t use it yet. Give just enough first.'],
   ['Marisol tells new reps to act as each caller’s “guide,” so they stay on until the next step is booked.',3,'A guide doesn’t leave you halfway. Reps can work out what to do in new calls.'],
   ['Theo tells a homeowner a drafty house is “like a sweater full of holes.”',1,'Everyone knows a holey sweater lets the cold in. The point lands at once.']]);}}
  ]
});
</script>
</body>
</html>
