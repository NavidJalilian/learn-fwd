<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get Attention with Surprise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0004', title:'Get attention with surprise', minutes:19, icon:'alert',
  goals:['Explain why surprise grabs attention, using guessing machines','Tell a surprise that serves the core from an empty gimmick','Find the uncommon sense in a message and use it to break, then fix, a guess'],
  parts:['Break a pattern','Guessing machines','Not a gimmick','Uncommon sense'],
  read:'Read the first half of chapter 2, “Unexpected,” for the full Enclave, Nordstrom and Nora Ephron stories.',
  glossary:{
    'pattern':'Breaking a pattern: changing something people have stopped noticing, so their attention snaps back.',
    'brow':'Surprise brow: the raised eyebrows and wide eyes of surprise, which help us take in more of what just happened.',
    'postdictable':'Postdictable: a surprise you couldn’t have predicted, but which makes sense once you think about it.',
    'gimmick':'Gimmick: a surprise that grabs attention but has nothing to do with the message.',
    'uncommon':'Uncommon sense: the part of your message that sounds obvious but isn’t, the part people don’t already act on.'
  },
  cheatsheet:[
    'The first job of a message is getting attention. The basic tool: <b>break a pattern</b>.',
    'Surprise <b>gets</b> attention; interest <b>keeps</b> it. This lesson is about surprise.',
    'Schemas are <b>guessing machines</b>. When a guess fails, surprise makes people stop and look for the reason.',
    'Avoid <b>gimmicks</b>: a surprise that doesn’t serve the core is worthless, however memorable.',
    'Good surprise is <b>postdictable</b>: you didn’t see it coming, but it makes sense afterward.',
    'The process: find the core, find what’s <b>counterintuitive</b> about it, break the guess on that point, then help fix it.',
    'Common sense is the enemy of sticky messages. Push from common sense to <b>uncommon sense</b>.',
    'Let people commit to their guess first, then surprise them, like Ephron’s journalism teacher.'
  ],
  steps:[
/* ---------- PART 1: BREAK A PATTERN ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">You must give a safety talk everyone has heard a hundred times. What’s most likely to make people look up?</h1>');
  L.mc(L.card,['Say the usual words, just louder','Change something they don’t expect'],1,
   'People tune out what they’ve heard before. Change something and their attention snaps back. That’s where this lesson starts.',
   'Louder is still the same old talk, and people tune it out. Changing something they don’t expect is what makes them look up.');}},
{part:0,src:'Chapter 2 · Unexpected',run(L){
  L.h(L.kick('learn','Break a pattern')+'<h1 class="q">We stop noticing what never changes</h1>'+
   L.prose('Nobody listens to a flight-safety announcement. A flight attendant named Karen Wood changed that. She delivered the usual exits-and-seat-belts talk as a string of jokes. Passengers tuned in, and some applauded at the end.')+
   L.prose('Most of the time we can’t demand attention; we have to attract it. The most basic way: '+L.g('pattern','break a pattern')+'. We tune out steady things, like the hum of an air conditioner. We notice the moment it shuts off.')+
   L.note('Designers know this. Warning lights blink, because we’d stop seeing a light that stayed on. Sirens wail in changing patterns. Wood could have got attention just by stopping mid-sentence.','eye'));
  L.done();}},
{part:0,src:'Chapter 2 · Unexpected',run(L){
  L.h(L.kick('learn','Two jobs, two emotions')+'<h1 class="q">Getting attention and keeping it are different problems</h1>'+
   L.flow([['alert','Surprise','Gets attention','this lesson',4],['eye','Interest','Keeps attention','next lesson',2]])+
   L.prose('Many naturally sticky ideas are surprising “facts”: you use only 10 percent of your brain; the Great Wall is visible from space. Urban legends are full of plot twists.')+
   L.prose('If our ideas were more unexpected, they’d stick better. But can you <i>plan</i> to be unexpected? The book says yes, and shows how.'));
  L.done();}},
{part:0,src:'Chapter 2 · Unexpected',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Jun’s mailer looks like every other energy flyer: a smiling family, a logo, “Save energy today!” Most go straight in the recycling. What does the first rule of attention suggest?</h1>');
  L.mc(L.card,['Mail the same flyer more often','Pack more benefits into the layout','Change something readers don’t expect'],2,
   'Readers have learned the pattern and tune it out before reading a word. Jun has to break that pattern.',
   'More copies or more benefits keep the same pattern that readers already tune out. Jun has to break the pattern.');}},

/* ---------- PART 2: GUESSING MACHINES ---------- */
{part:1,src:'Chapter 2 · No One Ever Does',run(L){
  L.h(L.kick('ex','A car ad nobody forgets')+'<h1 class="q">The Enclave minivan</h1>');
  L.beats(L.card,[
   ['The setup','A TV ad: a family climbs into a new minivan, the Enclave. A cheerful voice lists cable channels, a sky-view roof, cup holders everywhere.'],
   ['The drive','The van rolls through quiet suburban streets. The boy gazes out the window. Dad pulls into an intersection.'],
   ['The crash','A speeding car slams into the side of the van. Metal buckles, glass explodes.'],
   ['The screen','Black screen. It asks if you saw that coming, then says nobody ever does. Then: buckle up, always.'],
   ['The reveal','There is no Enclave. The ad was made by the Ad Council for the U.S. Department of Transportation. It was a seat-belt message all along.']],
   'It broke two expectations: car ads never show anyone dying, and trips around the neighborhood almost always end safely.');}},
{part:1,src:'Chapter 2 · The Surprise Brow',run(L){
  L.h(L.kick('learn','Guessing machines')+'<h1 class="q">Surprise is what happens when our guesses fail</h1>'+
   L.prose('Our '+L.g('schema','schemas')+' work like '+L.g('guessing','guessing machines')+': they predict what comes next, so we know how to act. The Enclave ad made our car-ad guessing machine fail.')+
   L.prose('Then the body takes over. The '+L.g('brow','surprise brow')+' lifts, widening the eyes to see more. The jaw drops, we go quiet and still. It’s an emergency override: stop and take this in.')+
   L.flow([['cycle','Guess','Car ads end happily','',2],['alert','Guess fails','Surprise: what’s going on?','',4],['bulb','Repair','We fix the guess for next time','',1]])+
   L.prose('That extra attention and thinking burns surprises into memory. Big surprises call for big answers, which is why sudden deaths of young celebrities breed conspiracy theories.'));
  L.done();}},
{part:1,src:'Chapter 2 · The Surprise Brow',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">According to the book, what is surprise <i>for</i>?</h1>');
  L.mc(L.card,['To make us laugh so we relax and listen','To stop us and fix a guess that just failed','To make us more certain we were right'],1,
   'Surprise fires when a schema fails. It halts us and focuses attention, so we can repair the guessing machine.',
   'Surprise isn’t about relaxing or feeling certain (anger does that). It fires when a guess fails, so we stop and repair the guessing machine.');}},
{part:1,src:'Chapter 2 · The Surprise Brow',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Breaks a guess, or fits it?',['Breaks a guess','Fits the guess'],[
   ['A mailer photo: frost on the <i>inside</i> of the Nwosu kids’ bedroom window.',0,'People expect frost outside. Frost indoors makes them stop and wonder why.'],
   ['“Kestrel cares about your comfort.”',1,'Every company says this. Readers predicted it before they read it.'],
   ['“Your attic leaks more heat than all your windows put together.”',0,'Most people blame windows. If Theo’s checks back this up, it breaks that guess.'],
   ['“Save energy and money this winter.”',1,'It’s exactly what an energy flyer is expected to say.']]);}},

/* ---------- PART 3: NOT A GIMMICK ---------- */
{part:2,src:'Chapter 2 · Avoiding Gimmickry',run(L){
  L.h(L.kick('learn','Avoid gimmicks')+'<h1 class="q">Surprise that serves nothing is worth nothing</h1>'+
   L.prose('During the dot-com boom, a Super Bowl ad showed a marching band practicing. Then a pack of wolves burst onto the field and chased them. Unforgettable. The authors still have no idea what it was selling.')+
   L.lanes([['x','Wolves ad','A huge surprise with no link to the message. A '+L.g('gimmick','gimmick')+'.',4],['check','Enclave ad','A huge surprise that <i>is</i> the message: crashes come out of nowhere, so buckle up.',1]])+
   L.prose('Both ads shocked. Only one used the shock to drive home its core. (The wolves would have been perfect for mauling-proof band uniforms.)'));
  L.done();}},
{part:2,src:'Chapter 2 · Hension and Phraug',pts:1,
 solve:async L=>{[...L.$('#ww').children].forEach(b=>b.click());},
 run(L){
  const W=[['HENSION','Hmm… sounds like a real word, but it’s made up.',0],['PHRAUG','Oh! It’s just “frog,” spelled oddly.',1],['BARDLE','Hmm… feels familiar, but it’s made up.',0],['TAYBL','Oh! It’s just “table.”',1]];const seen=new Set();
  L.h(L.kick('ex','See it happen')+'<h1 class="q">Is each of these a real English word? Say it in your head, then tap to find out.</h1><div id="ww" style="display:flex;flex-wrap:wrap;gap:8px"></div><div id="wr" style="margin-top:10px"></div><div id="wq"></div>');
  W.forEach((w,j)=>{const b=document.createElement('button');b.className='chip';b.style.fontWeight='600';b.textContent=w[0];b.onclick=()=>{if(seen.has(j))return;seen.add(j);b.classList.add('sel');
    const d=document.createElement('div');d.className='small';d.style.cssText='display:flex;gap:6px;align-items:flex-start;margin:0 0 8px;color:var('+(w[2]?'--ok':'--no')+')';d.innerHTML=L.ic(w[2]?'bulb':'alert')+'<span><b>'+w[0]+'</b>: '+w[1]+'</span>';L.$('#wr').appendChild(d);
    if(seen.size===4){const q=L.$('#wq');q.innerHTML='<h2 class="sub">In the study, two words got an “Oh!” and two got a frown. Which surprise should a message aim for?</h2>';
      L.mc(q,['PHRAUG and TAYBL: odd at first, then it clicks','HENSION and BARDLE: they seem real but aren’t','Any of the four: all surprise sticks the same'],0,
       'They look strange but make sense the moment you get it. Surprise <i>plus</i> insight. HENSION and BARDLE only frustrate.',
       'HENSION and BARDLE send you hunting for an answer that doesn’t exist, which just frustrates. PHRAUG and TAYBL surprise you, then click: surprise plus insight.');}};L.$('#ww').appendChild(b);});}},
{part:2,src:'Chapter 2 · Hension and Phraug',run(L){
  L.h(L.kick('learn','Postdictable')+'<h1 class="q">You can’t see it coming, but it makes sense afterward</h1>'+
   L.prose('A surprise can’t be predictable, or it wouldn’t surprise. But to satisfy, it must be '+L.g('postdictable','postdictable')+': once you think about it, it fits. A great twist ending ties together clues you saw all along. “It was all a dream” just feels cheap.')+
   L.note('<b>The bottom line:</b> to make an idea stickier, break someone’s guessing machine, then fix it.','cycle')+
   L.prose('How do you avoid the wolves? Aim the surprise at the part of the audience’s guessing machine that relates to your core message.'));
  L.done();}},
{part:2,src:'Chapter 2 · Avoiding Gimmickry',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Jun proposes a mailer that looks like a lottery win: “YOU’VE WON!” Inside, an offer for a free Home Energy Check. What’s the problem?</h1>');
  L.mc(L.card,['The surprise is too small for anyone to notice','The surprise doesn’t lead anywhere near the core','Surprises only work on TV, not in the mail'],1,
   'Readers feel tricked, not enlightened. Nothing about the lottery joke says “warm homes on smaller winter bills.” It’s the wolves, in an envelope.',
   'The surprise would be noticed, and mail can surprise just fine. The trouble is it has no link to the core, so it’s a gimmick: the wolves, in an envelope.');}},
{part:2,src:'Chapter 2 · Avoiding Gimmickry',pts:5,run(L){
  L.h(L.kick('pr','Gimmick or core?')+'<h1 class="q">Jun’s team brainstorms surprising ideas for the fall campaign. Sort them.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Serves the core','Gimmick'],[
   ['A mailer shaped like a pizza box, with a coupon for a free slice',1,'Surprising, but pizza says nothing about warm homes or bills.'],
   ['A heat-camera photo of the reader’s own street, attics glowing with lost heat',0,'It breaks “my house is fine” and points right at the core.'],
   ['A radio ad that opens with a fake breaking-news alarm',1,'It grabs ears, then annoys. The alarm has nothing to do with the message.'],
   ['A customer’s two real heating bills side by side, before and after the work',0,'A surprising drop that <i>is</i> the message: smaller winter bills.'],
   ['A billboard of a polar bear in sunglasses, holding the Kestrel logo',1,'Memorable and empty, like the wolves. What is it saying?']],
   'Every idea here is surprising. Only the ones aimed at the core make the surprise pay off.');}},

/* ---------- PART 4: UNCOMMON SENSE ---------- */
{part:3,src:'Chapter 2 · Hension and Phraug',run(L){
  L.h(L.kick('learn','The process')+'<h1 class="q">Find the uncommon sense, and break the guess right there</h1>'+
   L.list([['target','Find the core','The one message that matters most.'],['bulb','Find what’s counterintuitive','What does it imply that people don’t expect? Why isn’t it already happening?'],['cycle','Break, then fix','Break the audience’s guess on exactly that point, then help them build a better one.']],1)+
   L.prose('<b>Common sense is the enemy of sticky messages.</b> If it sounds obvious, it goes in one ear and out the other. But what sounds obvious often isn’t. Your job is to expose the '+L.g('uncommon','uncommon sense')+'.')+
   L.note('“Names, names, and names” sounded like common sense to reporters. Then Adams said he’d add pages for more names. Their guess, “use local angles when you can,” became “names come before even profit.”','book'));
  L.done();}},
{part:3,src:'Chapter 2 · Tire Chains at Nordstrom',run(L){
  L.h(L.kick('ex','Stories that break a schema')+'<h1 class="q">Tire chains at Nordstrom</h1>');
  L.beats(L.card,[
   ['The strategy','Nordstrom charges more and wins on service. For that to work, every clerk must be a service fanatic.'],
   ['The old schema','Most new hires come from stores where good service means: get people in and out fast, and smile.'],
   ['The stories','Staff, called “Nordies,” trade tales: one ironed a shirt for a customer’s afternoon meeting, one gift-wrapped something bought at Macy’s, one warmed customers’ cars in winter.'],
   ['The best one','A Nordie refunded a customer for tire chains. Nordstrom doesn’t sell tire chains.'],
   ['Why it works','“The best service in the industry” is common sense; any store could say it. Warming cars is uncommon sense, and it fits Nordstrom’s goal exactly. At a convenience store, gift-wrapping clerks would be a problem.']],
   'The stories break new hires’ guessing machines, then show them what good service means here.');}},
{part:3,src:'Chapter 2 · Tire Chains at Nordstrom',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Which line would jolt new Kestrel hires the way Nordie stories jolt new clerks?</h1>');
  L.mc(L.card,['“We aim to give the best service in our industry.”','“Always be polite and wear clean boots inside.”','“A tech spent an hour teaching a renter to seal windows, so they bought nothing.”'],2,
   'It breaks the “always be selling” guess, and it fits the core exactly: a warmer home on a smaller bill, even with no sale.',
   'Those are common sense; every company says them. The tech who taught a renter to seal their own windows breaks the guess and serves the core.');}},
{part:3,src:'Chapter 2 · Hension and Phraug',pts:1,run(L){
  L.h(L.kick('pr','Run the process')+'<h1 class="q">Theo wants homeowners to stop dismissing heat pumps. Drag the steps into the order the book suggests.</h1>');
  L.order(L.card,[
   'Core: heat pumps keep homes warm on smaller winter bills.',
   'Counterintuitive: most people believe heat pumps quit in the cold.',
   'Break the guess: a customer’s heat pump ran all through January’s coldest week.',
   'Fix the guess: even freezing air holds heat a pump can move.'],
   'Core, then what’s counterintuitive, then break the guess on exactly that point, then help people fix it.',
   ['Step 1','Step 2','Step 3','Step 4']);}},
{part:3,src:'Chapter 2 · Journalism 101',
 solve:async L=>{L.$('#ld').children[0].click();},
 run(L){
  L.h(L.kick('ex','Your first assignment')+'<h1 class="q">You’re in a high-school journalism class. Write the lead for this story. Pick the one you’d send.</h1>'+
   L.note('The principal announced today that the whole faculty will travel to Sacramento next Thursday for a conference on new teaching methods. Speakers include anthropologist Margaret Mead, college president Robert Maynard Hutchins and Governor Pat Brown.','book')+
   '<div id="ld" style="display:flex;flex-direction:column;gap:8px;margin-top:12px"></div><div id="lr"></div>');
  ['Governor Pat Brown, Margaret Mead and Robert Hutchins will address the faculty Thursday in Sacramento.','The principal announced today that teachers will attend a Sacramento conference on teaching methods.'].forEach(t=>{
    const b=document.createElement('button');b.className='chip';b.style.textAlign='left';b.textContent=t;b.onclick=()=>{if(L.$('#lr').innerHTML)return;b.classList.add('sel');
      L.$('#lr').innerHTML='<p class="prose" style="margin-top:14px">That’s roughly what Nora Ephron and most of her classmates wrote. Then the teacher read out his version:</p>'+
       L.quote('There will be no school next Thursday.','Nora Ephron’s journalism teacher, chapter 2')+
       L.list([['eye','He knew their schema was wrong','They thought journalism meant rearranging the facts.'],['pencil','He made them commit','Writing a lead put their faulty model on paper.'],['bulb','He broke it, then fixed it','In seconds, journalism became about finding the point.']],2)+
       '<p class="small" style="margin-top:10px">Ephron, who went on to write films like <i>When Harry Met Sally</i>, still remembered that moment decades later.</p>';
      L.done();};L.$('#ld').appendChild(b);});}},
{part:3,src:'Chapter 2 · Journalism 101',pts:1,run(L){
  L.h(L.kick('pr','Use the teacher’s move')+'<h1 class="q">Dana’s new installers think the job is “put in the insulation.” Which opener to the first training day follows the journalism teacher?</h1>');
  L.mc(L.card,['Start by telling them the job is really about the family','Have each write the job’s goal, then reveal the real one','Show a slideshow of forty well-insulated attics'],1,
   'They commit to “install the insulation” on paper. Then Dana reveals the real goal, say, a family who can take their coats off indoors, and the old model breaks.',
   'Telling or showing skips the key move. The teacher had students commit to their guess first, so the surprise broke a model they owned.');}},
{part:3,src:'Chapter 2 · Clinic: Does America Spend Too Much on Foreign Aid?',run(L){
  L.h(L.kick('ex','Idea Clinic: before and after')+'<h1 class="q">Does America spend too much on foreign aid?</h1>');
  L.beats(L.card,[
   ['The situation','For years, polls showed many Americans thought the government spent too much on foreign aid. An advocacy group wanted to argue the opposite.'],
   ['Before','Their message piled up figures in billions, and only at the very end said the U.S. gives the least, proportionally, of any industrialized nation.'],
   ['The diagnosis','The lead was buried. That last fact was the one that breaks people’s schema of a generous America. And huge numbers in billions don’t stick.'],
   ['After','The rewrite opens with the schema break: people guess 10 to 15 percent of the budget goes to foreign aid; the truth is under 1 percent.'],
   ['Concrete swap','A bomber-cost comparison became everyday ones: give up one soft drink a month each, and aid to Africa could double.'],
   ['Punch line','The best way to get attention is to break people’s existing schemas directly.']],
   'The surprising fact was there all along. The rewrite just moved it to the front and aimed it at the guess.');}},
{part:3,src:'Chapter 2 · Clinic: Does America Spend Too Much on Foreign Aid?',pts:1,run(L){
  L.h(L.kick('pr','Apply the Clinic')+'<h1 class="q">Jun’s mailer opens with ten benefits and ends with: “Most homes we check lose more heat through the attic than the windows.” What would the Clinic suggest?</h1>');
  L.mc(L.card,['Keep it last so readers finish on a strong note','Cut it, since surprises distract from the offer','Move it to the top: it breaks the reader’s guess'],2,
   'It’s the schema-breaking fact, buried at the bottom. Lead with it, then help readers fix the guess: their attic is the place to look.',
   'Like the foreign-aid message, the strongest line is buried. It isn’t a distraction; it breaks the reader’s guess. Move it up front.');}},
{part:3,src:'Chapter 2 · Tire Chains at Nordstrom',pts:6,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Mixed review',['Gimmick','Common sense','Uncommon sense'],[
   ['“Kestrel: quality work you can trust.”',1,'True, and it sounds like every company. It floats in one ear and out the other.'],
   ['A Kestrel van painted to look like a giant toaster',0,'Memorable, but what does a toaster say about warm homes on smaller bills?'],
   ['“One customer’s heat pump ran all through January, and their bill still fell by more than half.”',2,'It breaks “heat pumps quit in the cold” and serves the core.'],
   ['An installer stays after the job to show a renter how to block a door draft, free',2,'Like the Nordie tire chains: surprising, and it fits the core exactly.'],
   ['A mailer printed upside down “to grab attention”',0,'Readers flip it over, and the surprise teaches nothing.'],
   ['“Insulation helps keep your home warm.”',1,'Everyone already believes it, so nobody stops to think about it.']]);}}
  ]
});
</script>
</body>
</html>
