<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Problem Solving When There’s No Structure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">

<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0014', title:'Problem solving when there’s no structure', minutes:19, icon:'flask',
  goals:['Tell a problem you can’t explain from one whose result you just don’t like','Tell deduction, induction and abduction apart by where they start','Turn a puzzle into hypotheses and clear yes-or-no tests'],
  parts:['No structure','Abduction','Scientific method','Same pattern'],
  read:'Read Appendix A of the book for the full Galileo story and Exhibit A-2 side by side.',
  glossary:{
    abduction:'Abduction: reasoning that starts from a result you observe, picks a rule that could explain it, then checks whether that rule applies in this case. Named by Charles Sanders Peirce.',
    'rule-case-result':'Rule, Case, Result: the three parts of any reasoning. A Rule is a belief about how the world works. A Case is an observed fact. A Result is what you expect when the Rule applies to the Case.',
    hypothesis:'Hypothesis: a guessed structure that could explain a result, stated so that a test can keep it or throw it out.'
  },
  cheatsheet:[
    'Most problems: a <b>known structure</b> gives a result you don’t like. Some: you <b>can’t explain</b> the result at all.',
    'Why you can’t explain it: the structure <b>doesn’t exist</b> yet, is <b>invisible</b>, or <b>fails to explain</b> the result.',
    'Every reasoning has a <b>Rule</b>, a <b>Case</b> and a <b>Result</b>. Deduction starts with the Rule, induction with the Case, abduction with the Result.',
    'Analytical problem solving is abduction: see the Result, find a likely cause in the structure you know (Rule), check it (Case).',
    'Scientific abduction: you must <b>invent</b> the structure first. Hypothesize → design a test → get a clear yes or no → recycle.',
    'Hypotheses come from the <b>structural elements</b> of the situation, often by analogy, never out of thin air.',
    'A good test says <b>keep or discard</b> the hypothesis. “Let’s see what happens” is not a test.',
    'Both kinds follow five questions: What is the problem? Where does it lie? Why? What could we do? What should we do?'
  ],
  steps:[
/* ---------- PART 1: NO STRUCTURE ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">One Fellwick tent model comes back for leaks about four times as often from the Harbourside store as from anywhere else. Same model, same factory. Kenji asks Nadia to “just look at the warehouse, like with late orders”. Will that work?</h1>');
  L.mc(L.card,['Yes, the warehouse layout will show the cause','Not yet: nobody knows what could cause this'],1,
   'With late orders, Nadia could see the warehouse and how it worked. Here, nothing anyone knows explains the leaks. This lesson is about that kind of puzzle.',
   'Late orders had a structure Nadia could see: shelves, pickers, vans. Here, nothing anyone knows explains why one store’s tents leak. This lesson is about that kind of puzzle.');}},
{part:0,src:'Appendix A · Problem Solving in Structureless Situations',run(L){
  L.h(L.kick('learn','Two kinds of problem')+'<h1 class="q">Not liking a result is different from not being able to explain it</h1>'+
   L.prose('Chapter 8 treated problem solving as a strictly logical hunt for the structure behind an event you don’t like. The fix always lies in changing that structure.')+
   L.lanes([['target','You don’t like the result','You know the structure that produces it. Change the structure, change the result.<div class="res">Late orders: the warehouse is full, picking is slow.</div>',1],
            ['alert','You can’t explain the result','Nothing you know about the structure accounts for what you see.<div class="res">Leaky tents: same model, but only Harbourside’s leak.</div>',4]])+
   L.prose('The second kind is rarer, but you can meet it in the middle of an ordinary assignment. It takes more visual thinking, but the reasoning, the book says, is very similar.'));
  L.done();}},
{part:0,src:'Appendix A · Problem Solving in Structureless Situations',run(L){
  L.h(L.kick('learn','Why you can’t explain it')+'<h1 class="q">Three reasons a result has no structure behind it</h1>'+
   L.list([['box','The structure doesn’t exist','You are inventing something new, like the telephone or a way to tunnel under water.'],
     ['eye','The structure is invisible','As with the brain or DNA: you only see what the structure produces, never the structure itself.'],
     ['x','The structure fails to explain the result','Aristotle’s idea of force couldn’t explain why a cannonball keeps flying. Or tools rust no matter how you protect them.']],3));
  L.done();}},
{part:0,src:'Appendix A · Problem Solving in Structureless Situations',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Fellwick knows how this tent is made and shipped. By that knowledge, every store’s tents should leak equally. Which reason fits the leaky-tent puzzle?</h1>');
  L.mc(L.card,['The structure doesn’t exist yet','The structure is invisible','The known structure fails to explain it'],2,
   'Fellwick has a structure in mind, and it predicts equal leaks. The result contradicts it, like Aristotle and the cannonball.',
   'The tent and its supply chain exist and can be looked at. The problem is that what Fellwick knows about them predicts equal leaks, and the result says otherwise.');}},
{part:0,src:'Appendix A · Problem Solving in Structureless Situations',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'What kind of problem is this?',['Known structure, unwanted result','Structure doesn’t exist yet','Structure is invisible','Known structure fails to explain it'],[
   ['Late online orders rose to 15% after the warehouse filled up and picking slowed.',0,'Nadia knows the warehouse well. The result is unwanted, so the fix is to change the structure.'],
   ['Fellwick wants to create a tent that a child can pitch in ten seconds. Nothing like it exists.',1,'You are inventing something new, so there is no structure yet to study.'],
   ['A boot sole comes unglued, but the glue sits sealed deep inside, where nobody can look without destroying the boot.',2,'You only see the result of what happens inside, never the structure itself.'],
   ['Jackets stored exactly by the rules still get mould spots in one store, and the rules say that can’t happen.',3,'The structure you trust predicts no mould, yet mould appears.']]);}},

/* ---------- PART 2: ABDUCTION ---------- */
{part:1,src:'Appendix A · Analytical Abduction',run(L){
  L.h(L.kick('learn','Rule, Case, Result')+'<h1 class="q">Every piece of reasoning juggles three things</h1>'+
   L.prose('The philosopher Charles Sanders Peirce coined the word '+L.g('abduction','abduction')+' in 1890 for the reasoning we use to solve problems. His insight: any reasoning deals with three distinct things. Tap each one.'));
  L.flips(L.card,[['Rule','A belief about how the world is structured. <i>“If the price is too high, sales go down.”</i>'],
                  ['Case','A fact you observe in the world. <i>“We have set the price too high.”</i>'],
                  ['Result','What you expect when the Rule applies to the Case. <i>“Sales will go down.”</i>']],
   'Which kind of reasoning you are doing depends on <b>where you start</b> among the three, and what extra fact you know.');}},
{part:1,src:'Appendix A · Analytical Abduction',run(L){
  L.h(L.kick('ex','The book’s example')+'<h1 class="q">One price story, reasoned three ways</h1>');
  L.beats(L.card,[
   ['Deduction','Start with the <b>Rule</b>: if the price is too high, sales go down. Add the <b>Case</b>: we have set it too high. So the <b>Result</b> follows <i>necessarily</i>: sales will go down.'],
   ['Induction','Start with the <b>Case</b>: we put the price up. Then the <b>Result</b>: sales went down. Infer the <b>Rule</b>: sales <i>probably</i> fell because the price is too high.'],
   ['Abduction','Start with the <b>Result</b>: sales have gone down. Recall a <b>Rule</b>: sales often fall when the price is too high. Then check the <b>Case</b>: is our price <i>possibly</i> too high? Let’s find out.'],
   ['Notice','The words change with the starting point: <b>necessarily</b>, <b>probably</b>, <b>possibly</b>.']],
   'Deduction starts with a Rule, induction with a Case, abduction with a Result.');}},
{part:1,src:'Appendix A · Analytical Abduction',run(L){
  L.h(L.kick('learn','You have been doing abduction all along')+'<h1 class="q">Analytical problem solving is abduction</h1>'+
   L.prose('The book has said throughout that analytical problem solving means three moves. Put side by side with abduction, they match exactly:')+
   L.flow([['alert','Result','notice an unwanted result','',4],['layers','Rule','look for its cause in what you know of the structure','',2],['check','Case','test whether you found it','',1]])+
   L.prose('Abduction differs from deduction and induction, and the difference matters. But the three are close cousins. On any complex problem you will use all three in rotation, depending on where you start.'));
  L.done();}},
{part:1,src:'Appendix A · Analytical Abduction',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Kenji says: “City-store sales fell this winter. Sales often fall when fewer people walk past. Let me check whether footfall dropped.” What kind of reasoning is that?</h1>');
  L.mc(L.card,['Deduction, because it ends in a firm conclusion','Abduction, because it starts from the result','Induction, because it infers a general rule'],1,
   'Kenji starts from the Result (sales fell), reaches for a Rule (footfall drives sales), then checks the Case (did footfall drop?).',
   'Look at where Kenji starts: with the Result. Then a Rule, then a check of the Case. That order is abduction, and it ends in “let me check”, not a firm conclusion.');}},
{part:1,src:'Appendix A · Analytical Abduction',pts:5,run(L){
  L.h(L.kick('pr','Where does it start?')+'<h1 class="q">Sort each line of reasoning from Fellwick’s week.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Deduction','Induction','Abduction'],[
   ['Boot returns doubled. Returns often rise when a size chart is wrong. Let’s check whether ours is wrong.',2,'It starts from the Result, picks a Rule, then checks the Case.'],
   ['Orders placed after 1pm miss the 2pm van. This order came in at 1:30. So it will miss the van.',0,'Rule, then Case, then a Result that must follow.'],
   ['We moved slow sellers to the overflow space, and late orders fell. Clearing the aisles probably caused the drop.',1,'Case and Result first, then a probable Rule.'],
   ['Harbourside’s tents leak more. Leaks often come from damaged seam tape. Let’s check the seams on Harbourside’s tents.',2,'Result first, then a likely Rule, then a check.'],
   ['A tent packed away damp grows mould. This tent was packed damp. So it will grow mould.',0,'A Rule applied to a Case gives a Result that follows necessarily.']],
   'The giveaway is the first sentence: a Rule means deduction, a Case means induction, a Result means abduction.');}},

/* ---------- PART 3: SCIENTIFIC METHOD ---------- */
{part:2,src:'Appendix A · Scientific Abduction',run(L){
  L.h(L.kick('learn','Analytical vs scientific')+'<h1 class="q">When you have to invent the Rule first</h1>'+
   L.lanes([['layers','Analytical abduction','You know the structure behind the result. You hold two of the three elements and reason to the third.',2],
            ['flask','Scientific abduction','You don’t know the structure. You must invent the Rule before you can reason to the Case.',3]])+
   L.prose('To invent it, you follow the classic scientific method:')+
   L.list([['Hypothesize','Guess a structure that could explain the result: a '+L.g('hypothesis','hypothesis')+'.'],
     ['Design a test','Devise an experiment that will confirm or exclude it.'],
     ['Run it','Carry it out to get a clear yes or no.'],
     ['Recycle','Make sub-hypotheses or next hypotheses to narrow what remains, and repeat.']],1)+
   '<p class="small" style="margin-top:10px">The two hallmarks are generating hypotheses and devising experiments. Both demand a lot of visual thinking.</p>');
  L.done();}},
{part:2,src:'Appendix A · Generating Hypotheses',run(L){
  L.h(L.kick('learn','Where hypotheses come from')+'<h1 class="q">Look at the parts of the situation, not at thin air</h1>'+
   L.prose('Hypotheses are suggested by the <b>structural elements</b> of the situation that produced the problem. Want people to talk across long distances without shouting? Then you think about ways to change the voice or boost the ear.')+
   L.note('Alexander Graham Bell noticed that the ear’s bones are heavy compared with the thin membrane that moves them. If a thin membrane can move heavy bones, he reasoned, why not a thicker one moving a piece of steel? The telephone followed.','bulb')+
   L.prose('There is no recipe for spotting such analogies. Knowing the problem situation completely helps, and so does spelling out and re-checking all your assumptions. Those who describe the moment of insight say it always arrives as a visual image.'));
  L.done();}},
{part:2,src:'Appendix A · Devising Experiments',run(L){
  L.h(L.kick('ex','The book’s example, retold')+'<h1 class="q">Galileo and the cannonball</h1>');
  L.beats(L.card,[
   ['Result','Aristotle said force produces speed, so a body should stop when the force stops. Yet a cannonball keeps flying after the blast. Aristotle’s idea of force must be wrong.'],
   ['Look at the parts','Galileo drops a ball from his hand. The situation has three structural elements: the ball’s <b>weight</b>, the <b>distance</b> it falls, and the <b>time</b> it falls.'],
   ['Three hypotheses','Force is proportional to the weight, or to the distance, or to the time over which it acts.'],
   ['What would follow','If it’s the time, then distance grows with the square of the time: 1 unit in 1 second, 4 in 2, 9 in 3.'],
   ['The test','He rolls a ball down a slope, which slows the fall enough to measure distance against time.'],
   ['The answer','The distances match. New Rule: force is what produces a <b>change</b> of speed.']],
   'Elements of the situation suggested the hypotheses. A clear prediction made the test decisive.');}},
{part:2,src:'Appendix A · Devising Experiments',run(L){
  L.h(L.kick('learn','A test must say yes or no')+'<h1 class="q">“Let’s see what happens” is not an experiment</h1>'+
   L.prose('To design a test, picture the hypothesis as if it were true and ask what would have to follow. Then check whether it does:')+
   L.tiers([['alert','Result','I observe an unexpected fact, A.'],
            ['bulb','Rule','A may be so because B is the case.'],
            ['arrow','Case','If B were the case, C would follow as a matter of course.'],
            ['check','Check','Let me check whether C does in fact follow.','',true,'The test']])+
   L.prose('The trick is that the result must let you say, without doubt, whether you keep or discard the hypothesis. The book credits that demand with the greatest advances in knowledge of the 80 years before it was written, and cites Darwin: every observation must be for or against some view to be of any use.'));
  L.done();}},
{part:2,src:'Appendix A · Devising Experiments',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Nadia’s hypothesis: the leaky tents all come from one faulty factory batch. Which test gives a clear yes or no?</h1>');
  L.mc(L.card,['Ask Harbourside staff what they think causes the leaks','Change a few things at Harbourside and see what happens','Check if tents from that batch sold in other stores leak too'],2,
   'If the batch is to blame, its tents must leak wherever they were sold. If they don’t, the hypothesis is out.',
   'Opinions and “see what happens” can’t keep or discard a hypothesis. Ask what <i>must</i> follow if it’s true: that batch’s tents would leak in every store.');}},
{part:2,src:'Appendix A · Scientific Abduction',pts:1,
 solve:async L=>{L.$('#hy').children[2].click();},
 run(L){
  const H=[['box','The factory batch','Harbourside got a faulty batch.','Find tents from the same batch sold in other stores, and count their leak returns.','Same batch, sold elsewhere: no extra leaks. <b>Discard.</b>',0],
           ['cycle','The van journey','Something on the trip damages the tents.','Water-test tents from the same van run before they are unloaded at the store.','They pass the water test. <b>Discard.</b>',0],
           ['home','Harbourside’s stockroom','Something where the tents are stored at Harbourside damages them.','Water-test unsold tents from Harbourside’s stockroom beside tents from the same batch kept at Mill Lane.','Stockroom tents leak at the seams; Mill Lane ones don’t. <b>Keep.</b>',1],
           ['map','Where customers camp','Harbourside buyers camp somewhere wetter.','Compare leak returns from Harbourside buyers who camp inland with those who camp on the coast.','Inland buyers’ tents leak just as often. <b>Discard.</b>',0]];
  const tried=new Set();
  L.h(L.kick('pr','Run the method')+'<h1 class="q">Nadia lists the tent’s journey from factory to campsite. Each part suggests a hypothesis. Test them until one survives.</h1><div id="hy" style="display:flex;flex-wrap:wrap;gap:6px"></div><div id="hr"></div><div id="hq"></div>');
  H.forEach((h,j)=>{const b=document.createElement('button');b.className='chip';b.innerHTML=L.ic(h[0])+h[1];
    b.onclick=()=>{if(tried.has(j))return;tried.add(j);b.classList.add('sel');
      const d=document.createElement('div');d.style.cssText='background:var(--soft);border-radius:14px;padding:12px;margin:10px 0 0';
      d.innerHTML='<div class="small"><b>Hypothesis:</b> '+h[2]+'</div><div class="small" style="margin-top:4px"><b>Test:</b> '+h[3]+'</div><div style="margin-top:6px;color:var('+(h[5]?'--ok':'--no')+')">'+h[4]+'</div>';
      L.$('#hr').appendChild(d);
      if(h[5]&&!L.$('#hq').innerHTML){const q=L.$('#hq');q.innerHTML='<h2 class="sub">One hypothesis survived. What should Nadia do next?</h2>';
        L.mc(q,['Recycle: make sub-hypotheses about what in the stockroom does it','Stop here: the stockroom is the answer, so close the case','Go back and retest the three discarded hypotheses'],0,
         'The stockroom is where it happens, not yet why. Nadia now asks: is it heat, damp, or how the tents are stacked? Then Nadia tests each.',
         'Discarded hypotheses got a clear no, so retesting them wastes time. And “the stockroom” isn’t a cause yet. The method says recycle: sub-hypotheses about heat, damp or stacking, each with its own test.');}};
    L.$('#hy').appendChild(b);});}},
{part:2,src:'Appendix A · Devising Experiments',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'A real test, or just watching?',['Clear yes-or-no test','Just seeing what happens'],[
   ['Imani moves a few tents to a cool shelf for a month and water-tests them against stockroom tents. If heat is the cause, only the stockroom ones leak.',0,'It states what must follow if heat is the cause, so the result keeps or discards the idea.'],
   ['Kenji rearranges the Harbourside stockroom “to see if anything changes”.',1,'No prediction, so whatever happens, nothing is proved or ruled out.'],
   ['Leah adds a few more columns to the returns spreadsheet in case a pattern shows up.',1,'Gathering data with no view to test is exactly what Darwin warned against.'],
   ['Nadia predicts that if the seam tape is the weak spot, leaks will start only along seams, never on the fabric, and checks every returned tent.',0,'A clear prediction checked against every tent: it either holds or it doesn’t.']]);}},

/* ---------- PART 4: SAME PATTERN ---------- */
{part:3,src:'Appendix A · Exhibit A-2',run(L){
  L.h(L.kick('learn','One pattern for both')+'<h1 class="q">Analytical and scientific problem solving ask the same five questions</h1>'+
   L.list([['What is the problem?','<b>Analytical:</b> the gap between the result you get and the one you want. <b>Scientific:</b> the gap between the result you get and what the accepted theory says you should get.'],
     ['Where does it lie?','<b>Analytical:</b> the parts of the present structure that could cause it. <b>Scientific:</b> the theory’s usual assumptions that could cause the gap.'],
     ['Why does it exist?','<b>Analytical:</b> check each part to see if, and why, it causes the result. <b>Scientific:</b> hypothesize other structures that would explain the result.'],
     ['What could we do about it?','<b>Analytical:</b> list the logical changes to the structure. <b>Scientific:</b> devise experiments that rule out one or more hypotheses.'],
     ['What should we do about it?','<b>Analytical:</b> build the new structure that gives the result best. <b>Scientific:</b> restate the theory based on the experiments.']],2));
  L.done();}},
{part:3,src:'Appendix A · Exhibit A-2',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">Nadia walks the leaky-tent puzzle through the five questions</h1>');
  L.beats(L.card,[
   ['What is the problem?','What Fellwick knows predicts equal leak rates everywhere. Harbourside’s are four times higher.'],
   ['Where does it lie?','In the assumption everyone made: “a tent is the same when it reaches the customer, whichever store sold it.”'],
   ['Why does it exist?','Four hypotheses from the tent’s journey: the batch, the van, the stockroom, the campsite.'],
   ['What could we do about it?','A clear yes-or-no test for each. Only the stockroom survives. Recycled: tents kept on a cool shelf stay dry, so <b>heat</b> is the cause. The stockroom sits above the boiler room, and the heat dries out the seam tape.'],
   ['What should we do about it?','New rule: store tents away from heat. Harbourside moves its tents to a cool room, and every store checks where its tents sit.']],
   'Each step ends in something Nadia can literally see: a gap, an assumption, four candidates, one survivor, a new rule.');}},
{part:3,src:'Appendix A · Exhibit A-2',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Put the five questions in the order the book gives them.</h1>');
  L.order(L.card,['What is the problem?','Where does it lie?','Why does it exist?','What could we do about it?','What should we do about it?'],
   'Same five steps whether you know the structure or have to invent it.');}},
{part:3,src:'Appendix A · Exhibit A-2',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Boot returns: which question is Nadia on?',['What is the problem?','Where does it lie?','Why does it exist?','What could we do?','What should we do?'],[
   ['Boot returns are double what they were. Fellwick wants them back to last year’s level.',0,'Nadia is stating the gap between the result now and the result wanted.'],
   ['Nadia lists the parts that could cause returns: the online size info, the photos, the packing.',1,'Nadia is pointing to the elements of the structure that could be at fault.'],
   ['Nadia finds that half the returns are wrong sizes, because Fellwick’s size chart differs from the brand’s.',2,'Nadia has checked an element and found why it causes the result.'],
   ['Options: use the brand’s chart, add half sizes online, or add a fit guide.',3,'These are the possible changes to the structure.'],
   ['Nadia recommends switching to the brand’s chart and adding half sizes, as the changes that cut returns most.',4,'Nadia chooses the new structure that best gives the wanted result.']]);}},
{part:3,src:'Appendix A · Exhibit A-2',run(L){
  L.h(L.kick('learn','Why it’s worth it')+'<h1 class="q">A pattern that pushes your thinking forward</h1>'+
   L.prose('The book closes Appendix A with the value of this pattern. It forces your thinking forward rigorously, in the fewest steps, with no dawdling and no detours into what doesn’t matter.')+
   L.flow([['eye','Each step','ends in something you can literally see','',1],['compass','Each image','points to where the next analysis should go','',2],['pencil','Once solved','the images guide how you talk and write about it','',3]])+
   L.prose('It quotes Herb Simon: solving a problem simply means representing it so that the solution becomes obvious. The author believes most of us can think far more creatively than we try to, and that knowing the process might make us try.'));
  L.done();}}
  ]
});
</script>
</body>
</html>
