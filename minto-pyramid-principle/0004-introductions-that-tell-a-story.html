<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Introductions That Tell a Story</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0004', title:'Introductions that tell a story', minutes:19, icon:'book',
  goals:['Open with a Situation the reader accepts, then a Complication that raises their Question','Choose the order of Situation, Complication and Answer to set the tone','Set out the Key Line as ideas, and size the introduction to the reader'],
  parts:['The story','Situation, Complication','Order and Key Line','Length and focus'],
  read:'Read chapter 4 of the book for its many sample introductions, from memos to magazine articles.',
  glossary:{
    'mini-introduction':'Mini-introduction: a short Situation–Complication–Question at the start of each Key Line section, so the reader sees why that point comes next.'
  },
  cheatsheet:[
    'An introduction <b>reminds</b>, it doesn’t inform. Tell the reader a story they already know.',
    'Start the <b>Situation</b> with a statement about the Subject that is self-sufficient, noncontroversial and anchored in time and place.',
    'The <b>Complication</b> is what happened next. It creates the tension that raises the Question.',
    'Four common patterns: a task is blocked; a known fix needs carrying out; a fix was suggested; an action failed.',
    'Order sets the tone: <b>Standard</b> S-C-A, <b>Direct</b> A-S-C, <b>Concerned</b> C-S-A, <b>Aggressive</b> Q-S-C. All parts always appear.',
    'The Key Line sets the plan. State its points as ideas, never as topics like “Background”.',
    'Length depends on the reader: from one sentence to a few paragraphs, and no exhibits.',
    'One Question per document. Each Key Line section gets its own short S-C-Q.'
  ],
  steps:[
/* ---------- PART 1: THE STORY ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Nadia is writing to Theo about late online orders. Which opening line makes Theo want to read the next one?</h1>');
  L.mc(L.card,['This note covers warehouse space, courier terms and staffing.','This year, late online orders have risen from 4% to 15%.'],1,
   'The second line starts a story Theo knows, and they want to hear what comes next. This lesson shows how to build that story.',
   'A list of topics gives Theo nothing to care about. The second line starts a story they know, so they want the next part.');}},
{part:0,src:'Chapter 4 · Why a story?',run(L){
  L.h(L.kick('learn','The pull of an unfinished story')+'<h1 class="q">Start a story and the reader can’t look away</h1>'+
   L.prose('The book’s example is a story that begins with two people meeting on a bridge at midnight in a strange city. Whatever you were thinking about, your mind is now fixed on a time and a place, and you want to know what happens. It stays with the story until the ending.')+
   L.prose('An introduction should use the same pull. Every good story has a beginning, a middle and an end:')+
   L.flow([['home','Situation','the beginning','',1],['alert','Complication','the middle','',4],['target','Resolution','your Main Point','',2]])+
   L.prose('The resolution is always your '+L.g('main-point','Main Point')+', because you always write to solve a problem or answer a question the reader already has.'));
  L.done();}},
{part:0,src:'Chapter 4 · Why a story?',run(L){
  L.h(L.kick('learn','Remind, don’t inform')+'<h1 class="q">The best story is one the reader already knows</h1>'+
   L.prose('Children love best the stories they’ve heard before. Readers are the same. So the introduction tells the reader things they know, or could be expected to know if they’re well informed.')+
   L.lanes([['check','Introduction','Things the reader will agree with. Easy to read, so they relax and listen.',2],
            ['bulb','Body','Your new ideas, which they might question. They meet them in a receptive mood.',1]])+
   L.prose('Easy, agreeable points first make the reader more open to your ideas than wading through a swamp of detail would.'));
  L.done();}},
{part:0,src:'Chapter 4 · Why a story?',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">What should the opening of Nadia’s note give Theo?</h1>');
  L.mc(L.card,['New facts that will surprise Theo','A story Theo already knows and accepts','Every detail behind Nadia’s thinking'],1,
   'An introduction reminds rather than informs. Agreeing first makes Theo more open to the new ideas that follow.',
   'Surprises and details belong in the body. The introduction tells a story Theo already knows, so they agree before meeting anything new.');}},

/* ---------- PART 2: SITUATION, COMPLICATION ---------- */
{part:1,src:'Chapter 4 · Where do you start the Situation?',run(L){
  L.h(L.kick('learn','Where to start the Situation')+'<h1 class="q">The first sentence: a statement about the Subject the reader accepts</h1>'+
   L.list([['pointer','About the Subject','If you don’t want to open with a statement about your '+L.g('subject','Subject')+', you have the wrong Subject, or you’re starting in the wrong place.'],
     ['check','Self-sufficient','It needs no earlier sentence to make its meaning clear.'],
     ['people','Noncontroversial','The reader understands it and agrees with it straight away.'],
     ['clock','Anchored in time and place','It sets the scene for a story, like the bridge at midnight.']],1)+
   L.prose('Writing for a wide audience, like a report or article? Then you plant the question rather than remind them of it. Assume they’re fairly well informed, and open with what is already widely accepted.'));
  L.done();}},
{part:1,src:'Chapter 4 · Where do you start the Situation?',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">Nadia tries four first sentences for the note to Theo</h1>');
  L.beats(L.card,[
   ['Draft 1','“It has been a hard year for all of us.” Not about the Subject (late orders). Theo can’t tell what story this is.'],
   ['Draft 2','“The warehouse team has lost control of picking.” About the Subject, but Theo might dispute it. That makes it controversial, so it can’t open the story.'],
   ['Draft 3','“As with the other option, this one has drawbacks.” Which other option? It leans on something said before, so it isn’t self-sufficient.'],
   ['Draft 4','“This year, the share of online orders arriving late has risen from 4% to 15%.” About the Subject, true, checkable, anchored in time.'],
   ['Theo’s reaction','Theo nods: “Yes, I know. So what?” That’s exactly the opening Nadia needs for the Complication.']],
   'A good Situation earns a “So what?”, not a “Wait, is that true?”');}},
{part:1,src:'Chapter 4 · Where do you start the Situation?',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Can this open the Situation?',['Yes, a good opening','No, reader may dispute it','No, needs earlier context'],[
   ['“This spring, Fellwick signed a new contract with its courier.”',0,'It’s about the Subject, it’s true, and it’s anchored in time.'],
   ['“Mill Lane is clearly the worst-run part of the business.”',1,'Plenty of people would argue with that. The Situation must be something the reader accepts.'],
   ['“That is why the numbers look the way they do.”',2,'Which numbers? It needs an earlier sentence, so it isn’t self-sufficient.'],
   ['“Our 9 stores are restocked from the Mill Lane warehouse.”',0,'A plain fact Theo knows, and a natural start to a story about the warehouse.'],
   ['“Kenji’s idea for store deliveries is plainly wrong.”',1,'That’s a claim to argue in the body, not a starting point everyone agrees on.']]);}},
{part:1,src:'Chapter 4 · What’s a Complication?',run(L){
  L.h(L.kick('learn','What’s a Complication?')+'<h1 class="q">What happened next, so a question had to follow</h1>'+
   L.prose('A '+L.g('complication','Complication')+' isn’t necessarily a problem, though it often is. It’s the twist in the story you’re telling: starting from the Situation, it says what happened next, and that creates the tension that raises the Question. The book shows four common patterns:')+
   L.tiers([['list','We have a task → something stops us','Question: What should we do?',''],
            ['check','We have a problem → we know the solution','Question: How do we carry it out?',''],
            ['bulb','We have a problem → a solution is suggested','Question: Is it the right one?',''],
            ['x','We took an action → it didn’t work','Question: Why not?','']]));
  L.done();}},
{part:1,src:'Chapter 4 · What’s a Complication?',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Situation: late online orders keep rising. Complication: the board has suggested handing online orders to a third-party logistics firm. What Question does that raise?</h1>');
  L.mc(L.card,['What should we do about late orders?','Why didn’t the board’s plan work?','Is that the right solution for us?'],2,
   'A problem plus a suggested solution raises “Is it the right one?”',
   'Nobody has tried the plan, so “Why didn’t it work?” can’t arise yet. And a solution is already on the table, so the reader isn’t asking “What should we do?” but “Is this the right fix?”');}},
{part:1,src:'Chapter 4 · What’s a Complication?',pts:5,run(L){
  L.h(L.kick('pr','Match the pattern')+'<h1 class="q">Each line is a Situation and Complication at Fellwick. Which Question does it raise?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['What should we do?','How do we do it?','Is it the right fix?','Why didn’t it work?'],[
   ['Peak orders must ship on time, but Mill Lane has run out of room.',0,'A task, and something blocking it.'],
   ['We added weekend shifts at Mill Lane last month, and late orders haven’t fallen.',3,'An action that didn’t work raises “Why not?”'],
   ['Late orders are rising, and we’ve agreed to rent overflow space near Mill Lane.',1,'The fix is decided, so the question is how to carry it out.'],
   ['Late orders are rising, and Kenji suggests shipping online orders from the stores.',2,'A suggested fix raises “Is it the right one?”'],
   ['Click-and-collect must launch by March, but three stores have no back-room space.',0,'Another blocked task.']],
   'Know the pattern, and you know which Question your Main Point must answer.');}},

/* ---------- PART 3: ORDER AND KEY LINE ---------- */
{part:2,src:'Chapter 4 · Why that order?',run(L){
  L.h(L.kick('learn','Why that order?')+'<h1 class="q">The parts are fixed. The order is your choice.</h1>'+
   L.prose('Situation, Complication and Answer must all be there. But you can change their order to set the tone you want. The book rewrites one introduction four ways:')+
   L.list([['Standard','Situation → Complication → Answer. The classic story order.'],
     ['Direct','Answer → Situation → Complication. The recommendation comes first.'],
     ['Concerned','Complication → Situation → Answer. Opens with the worry.'],
     ['Aggressive','Question → Situation → Complication. Opens by putting the question to the reader.']],3)+
   '<p class="small" style="margin-top:10px">The book’s case: a consulting office whose diversification work had grown 40% in five years, yet couldn’t show any client a clear benefit from it. All four versions propose the same project to fix that.</p>');
  L.done();}},
{part:2,src:'Chapter 4 · Why that order?',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Kenji’s email opens: “Store orders should be picked first on Fridays.” Then it reminds Theo that Saturday is the busiest day, and that shelves keep running empty. Which order is that?</h1>');
  L.mc(L.card,['Concerned','Standard','Direct'],2,
   'Answer first, then Situation, then Complication: that’s Direct.',
   'Concerned opens with the worry; Standard opens with the Situation. Kenji opens with the Answer, so it’s Direct.');}},
{part:2,src:'Chapter 4 · Why that order?',pts:1,
 solve:async L=>{const g=L.$('#og').children;for(const b of g)b.click();},
 run(L){
  const P={S:'This year, late online orders have risen from 4% to 15%.',C:'Mill Lane has no room left, and peak season starts in six weeks.',A:'We should rent overflow space near Mill Lane for the peak.',Q:'How do we keep orders on time through the peak?'};
  const K={S:['Situation',1],C:['Complication',4],A:['Answer',2],Q:['Question',3]};
  const O=[['Standard','SCA'],['Direct','ASC'],['Concerned','CSA'],['Aggressive','QSCA']];const seen=new Set();
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Same note, four orders. Tap each one and notice how the tone shifts.</h1><div id="og"></div><div id="ov" style="background:var(--soft);border-radius:16px;padding:14px;margin:6px 0;min-height:150px"><div class="small">Choose an order above.</div></div><div id="oq"></div>');
  O.forEach((o,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=o[0];b.onclick=()=>{[...L.$('#og').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(j);
    L.$('#ov').innerHTML=o[1].split('').map(k=>'<p style="margin:0 0 8px"><span class="small" style="font-weight:700;color:var(--h'+K[k][1]+')">'+K[k][0]+'</span><br>'+P[k]+'</p>').join('');
    if(seen.size===4&&!L.$('#oq').innerHTML){const q=L.$('#oq');q.innerHTML='<h2 class="sub">What changed between the four versions?</h2>';
      L.mc(q,['Which parts of the story got left out','Only the order, and with it the tone','The facts each version relies on'],1,
       'The facts and the parts stay the same. Only the order moves, and the tone moves with it.',
       'Every version keeps the same facts and the same parts. The book says the story elements must always be there; only their order, and so the tone, changes.');}};L.$('#og').appendChild(b);});}},
{part:2,src:'Chapter 4 · What about the Key Line?',run(L){
  L.h(L.kick('learn','What about the Key Line?')+'<h1 class="q">The Key Line is also the plan of the document</h1>'+
   L.prose('The '+L.g('key-line','Key Line')+' answers the New Question your Main Point raises. It also tells the reader how the document is laid out.')+
   L.lanes([['layers','Long document','Set the Key Line points out at the end of the introduction. Then give each one a heading and write.',1],
            ['pencil','Short document','Don’t list the points and repeat them as headings. Use each as an underlined topic sentence.',2]])+
   L.prose('Either way, state the points as <b>ideas</b>, not topics. A list like “Background, Approach, Benefits, Prerequisites” tells the reader nothing, and the ideas hiding behind such topics rarely form a clear argument. Never have a section called “Background” or “Introduction”: it won’t be at the same level as the other points.')+
   L.quote('Never write about categories, only about ideas.','Barbara Minto'));
  L.done();}},
{part:2,src:'Chapter 4 · What about the Key Line?',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Tap each piece until the end of Nadia’s introduction gives Theo the Main Point and the Key Line as ideas.</h1>');
  L.sentence(L.card,[['This note covers','We should'],['background, options and costs','rent overflow space near Mill Lane'],['in three sections','because it’s fast, cheap and easy to undo']],[1,1,1],
   [['“This note covers” announces topics, not an idea.'],['Those are categories. Theo still doesn’t know what Nadia thinks.'],['That describes the layout, not the reasons.']],
   'Now Theo has the Main Point and its three reasons in one line. Each reason becomes a section heading.');}},
{part:2,src:'Chapter 4 · What about the Key Line?',pts:1,run(L){
  L.h(L.kick('pr','Fix the plan')+'<h1 class="q">Imani plans a report with four sections: Background, Options, Costs, Recommendation. What’s wrong with it?</h1>');
  L.mc(L.card,['The sections are topics, not ideas','It has too few sections for a report','Recommendation should come first'],0,
   'Topic headings don’t tell the reader anything, and “Background” sits on a different level from the rest. Each section should state an idea.',
   'Moving or adding sections doesn’t help. The problem is that every heading is a category: the reader learns nothing from the plan, and “Background” isn’t at the same level as the rest.');}},

/* ---------- PART 4: LENGTH AND FOCUS ---------- */
{part:3,src:'Chapter 4 · How long a story?',run(L){
  L.h(L.kick('learn','How long a story?')+'<h1 class="q">Long enough that you and the reader stand in the same place</h1>'+
   L.prose('Usually that means two or three paragraphs. The Situation and the Complication can each run to three or four paragraphs, but never more: how much does it take to remind someone of what they know? If you find yourself adding charts and tables, you’re overstating the obvious.')+
   L.prose('It can also be a single sentence that reminds the reader what they asked you in last week’s note. The closer you are to the reader day to day, the shorter it can be. But it must always remind them of their Question.')+
   L.note('Length follows the reader’s needs, not the length of the document. The book warns that introductions are botched more often than any other part.','info'));
  L.done();}},
{part:3,src:'Chapter 4 · How long a story?',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Yesterday Theo messaged Nadia: “Should we take the courier’s second collection?” How long should the reply’s introduction be?</h1>');
  L.mc(L.card,['Two paragraphs on the courier contract','None at all: just say yes','One sentence recalling the question'],2,
   'They work closely and the question is fresh, so one sentence is enough, as long as it reminds Theo of the question.',
   'Theo knows the background, so two paragraphs overstate the obvious. But the book says an introduction must always remind the reader of the Question, so one sentence is right.');}},
{part:3,src:'Chapter 4 · Do I need to introduce the Key Line points?',run(L){
  L.h(L.kick('learn','Mini-introductions')+'<h1 class="q">Each Key Line section gets its own short story</h1>'+
   L.prose('Before each Key Line point, tell a brief S-C-Q again, so the reader is standing where you are when the point arrives. This '+L.g('mini-introduction','mini-introduction')+' does a different job depending on where the reader is:')+
   L.tiers([['book','The opening introduction','Reminds them what they know about the Subject.',''],
            ['pointer','The first Key Line section','Shows why this point matters to the Main Point.',''],
            ['arrow','Each later section','Shows how this point follows from the one before.','']])+
   L.note('The book’s example is a paper on management tools. Its section on benchmarking opens: suppose you’ve cut loan processing from 2 days to 2 hours. You’d assume that’s enough. Is it? You can’t tell until you compare yourself with competitors.','book'));
  L.done();}},
{part:3,src:'Chapter 4 · Do I need to introduce the Key Line points?',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">Kenji adds mini-introductions to the email</h1>');
  L.beats(L.card,[
   ['The pyramid','Main Point: we can fix the Saturday gaps. Key Line: pick store orders before online orders on Fridays, and fill the open weekend jobs.'],
   ['Section 1 · S','Every Friday the warehouse picks online orders first, then store orders.'],
   ['Section 1 · C, Q, A','So store deliveries arrive mid-afternoon, too late for Saturday. What should change? Pick store orders first.'],
   ['Section 2 · S','With store orders picked first, stock reaches stores in time for Saturday.'],
   ['Section 2 · C, Q, A','But someone has to unpack it, and stores are short of weekend staff. Who’ll do it? Fill the open weekend jobs.']],
   'Section 2’s story starts where section 1 ended, so Theo sees why the second point follows the first.');}},
{part:3,src:'Chapter 4 · Do I need to introduce the Key Line points?',pts:1,run(L){
  L.h(L.kick('pr','One question only')+'<h1 class="q">Imani asks Nadia: “Should we move to Quarry Road, and if so, how?” How should Nadia structure the answer?</h1>');
  L.mc(L.card,['Two separate pyramids, one for each part','One pyramid: “yes” on top, then “how”','Answer “how” first, then whether to move'],1,
   'If the answer is yes, that’s the Main Point, and it raises “How?”, answered on the Key Line. If it’s no, “how” never arises.',
   'A document has only one Question; two linked ones are really one. Put “yes” at the top and let it raise “How?” for the Key Line. If the answer is no, “how” never comes up.');}},
{part:3,src:'Chapter 4 · Do I need to introduce the Key Line points?',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'In the introduction, or not?',['Can go in the introduction','Keep it out'],[
   ['A chart proving late orders rose this year',1,'An introduction reminds; it doesn’t prove. If it needs a chart, you’re overstating the obvious.'],
   ['What Nadia means by a “late” order',0,'The book lists definitions of terms among things an introduction can include, woven into the story.'],
   ['Last year’s review of the warehouse, and what it concluded',0,'Earlier investigations and their conclusions can go in, as part of the story.'],
   ['A new cost analysis Theo has never seen',1,'That’s new information. It belongs in the body, where it can be argued.'],
   ['A line on what the rest of a long report covers',0,'In longer documents the book adds an explanation of what’s to come.']]);}},
{part:3,src:'Chapter 4 · Do I need to introduce the Key Line points?',pts:1,run(L){
  L.h(L.kick('pr','Work backward')+'<h1 class="q">Kenji has five solid points about store deliveries, but can’t work out what Question they answer. What should Kenji do?</h1>');
  L.mc(L.card,['Start from the points and ask why Theo needs them','Write the Situation first and hope it comes','Drop the introduction and send the points'],0,
   'The reader needs the points only because they answer a question, and the question arose from their situation. Working backward gives the introduction.',
   'When thinking through the introduction doesn’t give the Question, the book says work backward from the body: why should the reader know these points? What question do they answer? What situation raised it?');}}
  ]
});
</script>
</body>
</html>
