<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Why a Pyramid Structure?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0001', title:'Why a pyramid structure?', minutes:20, icon:'layers',
  goals:['Tell a structure problem from a style problem in any piece of writing','Explain why readers need the point before the details','Check a group of ideas against the three pyramid rules'],
  parts:['Structure','Grouping','Top down','Three rules'],
  read:'Read the introduction to Part One and chapter 1 of the book for the full shopping-list, facial-hair and equal-pay examples.',
  glossary:{
    'abstraction':'Level of abstraction: how general an idea is. “Fruit” sits one level above “apples” and “pears”.',
    'plural-noun':'Plural noun: one word that names the kind of idea in a group, such as reasons, steps or problems. The plural-noun test checks that it fits every idea in the group.'
  },
  cheatsheet:[
    'Most unclear writing is a <b>structure</b> problem (the order of ideas), not a style problem. Structure is far easier to fix.',
    'The mind <b>groups</b> ideas that arrive together and looks for what links them. It can hold only about <b>seven</b> items at once.',
    'Grouping isn’t enough: <b>name the logic</b> of each group so the reader holds three ideas, not nine.',
    '<b>Top down:</b> always give the summarizing idea before the ideas it summarizes. Otherwise the reader guesses, often wrongly.',
    'You <b>think bottom up</b> (sentences → paragraphs → sections → one thought) but <b>present top down</b>.',
    'Rule 1: an idea at any level <b>summarizes</b> the ideas grouped below it.',
    'Rule 2: ideas in a group are the <b>same kind</b>. Test: one plural noun fits them all.',
    'Rule 3: ideas in a group are in <b>logical order</b>: deductive, chronological, structural or comparative.'
  ],
  steps:[
/* ---------- PART 1: STRUCTURE ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Theo opens Nadia’s message on their phone between store visits. It begins: “The courier rep called to say they can’t make 3:00. Finance says later works, but not before 10:30 tomorrow…” Can Theo tell yet what Nadia wants?</h1>');
  L.mc(L.card,['Not yet: Theo has to keep reading and guess','Yes: the request is already clear'],0,
   'Theo has two facts and no idea why they matter. This lesson is about putting the point where a busy reader meets it first.',
   'Nothing so far says what Nadia wants. Theo has two facts and has to keep reading, guessing why they matter.');}},
{part:0,src:'Warm-up',run(L){
  L.h(L.kick('ex','Meet the course’s running example')+'<h1 class="q">Fellwick Outdoor runs on memos, emails and updates</h1>'+
   L.prose('Fellwick is a made-up outdoor-gear retailer: tents, boots, jackets, climbing kit. It has 9 stores, an online shop and one warehouse on Mill Lane. Tap each card to meet the two people you’ll help first.'));
  L.flips(L.card,[
   ['Nadia · head of operations','Thorough and well-informed. Writes things in the order they found them out, so the point turns up in the last paragraph.'],
   ['Theo · founder and CEO','The busy reader. Reads the first few lines on their phone, then often replies: “So what do you want me to do?”'],
   ['The problem on the desk','The share of online orders that arrive late has risen from 4% to 15% this year. Nadia has to explain why, and what to do.']],
   'Later lessons add more of Fellwick’s team. Every one of them writes for a reader like Theo.');}},
{part:0,src:'Introduction to Part One',run(L){
  L.h(L.kick('learn','Two causes of unclear writing')+'<h1 class="q">“Write more clearly” usually isn’t about sentences</h1>'+
   L.prose('People told to write more clearly tend to work on shorter, simpler sentences. The book calls overlong sentences, heavy jargon and clumsy paragraphs weaknesses of <b>style</b>. Style is hard to change once school is behind you. Like learning to type, it takes lots of practice most people never find time for.')+
   L.lanes([['pencil','Style','How each sentence is written. Common, but slow to fix.',4],
            ['layers','Structure','The order the ideas appear in, however well each sentence is written. Even more common, and much easier to fix.',2]])+
   L.prose('If writing is unclear, the book says, it’s most likely because the order of the ideas fights the way a reader’s mind takes them in. Readers find it easiest to get the big, general ideas first and the supporting details after.'));
  L.done();}},
{part:0,src:'Introduction to Part One',run(L){
  L.h(L.kick('learn','The shape that fits the mind')+'<h1 class="q">Ideas fit together as a pyramid</h1>'+
   L.prose('Big ideas always come from smaller ones. So the ideal structure is a '+L.g('pyramid','pyramid')+': groups of ideas tied together by one overall thought at the top, the '+L.g('main-point','Main Point')+'.')+
   L.tiers([['target','One Main Point','The single thought the whole document supports.','top'],
            ['layers','Ideas below it','Each one sums up the group of ideas under it.','vertical link'],
            ['list','Groups of ideas','Each group belongs together because it makes one logical argument.','horizontal link']])+
   L.prose('You start at the top and walk down. Each statement makes the reader ask a question, and the level below answers it. The book adds a bonus: you can’t know exactly what you think until you say it or write it down, and the shape that clears up your own thinking is the same pyramid.'));
  L.done();}},
{part:0,src:'Preface',run(L){
  L.h(L.kick('ex','Before and after')+'<h1 class="q">Nadia needs to move today’s operations meeting</h1>');
  L.beats(L.card,[
   ['As it came to Nadia','The courier rep can’t make 3:00. Finance can do later, or tomorrow, but not before 10:30. The store managers are away until tomorrow night. The meeting room is booked tomorrow but free Thursday. Thursday at 11 looks good. OK with you?'],
   ['Theo’s job','Hold five facts in mind, work out how they fit, and only then reach the request in the last line.'],
   ['Same facts, top down','<b>Can we move today’s meeting to Thursday at 11?</b> It suits the courier rep and finance better, it lets the store managers attend, and it’s the only other time this week the room is free.'],
   ['What changed','Nothing in the sentences. Only the <b>order</b>: the request first, then three reasons that support it.']],
   'The book’s preface shows the same kind of before and after. The point on top, the reasons underneath: a small pyramid.');}},
{part:0,src:'Introduction to Part One',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Theo says Nadia’s reports need to be “clearer.” Nadia plans to spend weekends practicing shorter sentences. According to the book, what should Nadia look at first?</h1>');
  L.mc(L.card,['The word choice and the sentence length','The order in which the ideas appear'],1,
   'Structure is the more common cause of unclear writing, and the easier one to fix.',
   'Sentence work is style: slow to change. The book says the more common, easier fix is the order of the ideas.');}},

/* ---------- PART 2: GROUPING ---------- */
{part:1,src:'Chapter 1 · Sorting into pyramids',run(L){
  L.h(L.kick('learn','The mind sorts automatically')+'<h1 class="q">Things that arrive together look like they belong together</h1>'+
   '<div style="display:flex;justify-content:center;gap:34px;margin:6px 0 14px">'+[0,1].map(()=>'<div style="display:flex;gap:8px">'+[0,1,2].map(()=>'<span style="width:14px;height:14px;border-radius:50%;background:var(--h2);display:inline-block"></span>').join('')+'</div>').join('')+'</div>'+
   L.prose('Look at the six dots. Almost everyone sees two groups of three, just because some gaps are smaller. The mind imposes order on whatever it sees. The book’s example: people looked at scattered stars and saw figures.')+
   L.prose('Reading works the same way. When ideas come one after another, you <b>assume</b> they belong together, and you hunt for the pattern that links them. That pattern is always a pyramid: a group, and the idea that sums it up.'));
  L.done();}},
{part:1,src:'Chapter 1 · The magical number seven',run(L){
  L.h(L.kick('learn','The magical number seven')+'<h1 class="q">Short-term memory runs out fast</h1>'+
   L.prose('The book retells a scene: someone heads out to buy a newspaper and, on the way to the door, is asked for nine groceries, one at a time. Most people come back with the paper and one item.')+
   L.note('Psychologist George A. Miller showed the mind can hold only <b>about seven</b> items in short-term memory. Some people manage nine, others five. Three is comfortable. One is easiest.','bulb')+
   L.prose('So once a list grows past four or five items, the mind starts sorting it into categories, such as the sections of a supermarket. Remembering three categories is far easier than nine loose items.'));
  L.done();}},
{part:1,src:'Chapter 1 · The magical number seven',pts:1,
 solve:async L=>{L.$('#grp').click();},
 run(L){
  const IT=['Rain jacket','Trail mix','Tent','Wool socks','Coffee','Sleeping bag','Hiking boots','Camp stove','Energy bars'];
  const G=[['Shelter and cooking',['Tent','Sleeping bag','Camp stove']],['Clothing',['Rain jacket','Hiking boots','Wool socks']],['Food',['Trail mix','Coffee','Energy bars']]];
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Theo phones Nadia with nine things to bring to a store demo day. Press the button to sort them the way a mind does.</h1>'+
   '<div id="pile" style="display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px">'+IT.map(x=>'<span class="chip static">'+x+'</span>').join('')+'</div>'+
   '<button class="btn pri" id="grp">'+L.ic('layers')+'Sort into groups</button><div id="gq"></div>');
  L.$('#grp').onclick=function(){this.remove();
    L.$('#pile').innerHTML=G.map(g=>'<div style="width:100%;background:var(--soft);border-radius:14px;padding:10px 12px"><div class="small" style="font-weight:700;margin-bottom:6px">'+g[0]+'</div>'+g[1].map(x=>'<span class="chip static ok" style="margin:0 4px 4px 0">'+x+'</span>').join('')+'</div>').join('');
    const q=L.$('#gq');q.innerHTML='<h2 class="sub">What does Theo’s memory now have to hold?</h2>';
    L.mc(q,['Nine items, one after another','Three groups that bring back the items'],1,
     'Three names, each of which calls up its own three items. That’s well inside the magical number seven.',
     'Nine loose items is past what most memories hold. The three group names are what stick, and each brings back its items.');};}},
{part:1,src:'Chapter 1 · The need to state the logic',run(L){
  L.h(L.kick('learn','Name the group')+'<h1 class="q">Grouping alone doesn’t help. Naming the group does.</h1>'+
   L.prose('Splitting nine items into groups of three still leaves nine items. The win comes from moving <b>up</b>: you remember the three group names, and each name brings back what’s under it.')+
   L.flow([['list','9 items','tent, socks, coffee…'],['layers','3 groups','sorted, but unnamed'],['target','3 names','shelter, clothing, food']])+
   L.prose('That’s thinking one '+L.g('abstraction','level of abstraction')+' higher. The book suggests every mind works like this, holding its knowledge as a huge set of linked pyramids. To get through to a reader, what you say has to fit into those pyramids.'));
  L.done();}},
{part:1,src:'Chapter 1 · The need to state the logic',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Nadia’s update has six facts about late orders, split into two paragraphs. Neither paragraph says what its facts have in common. What’s missing?</h1>');
  L.mc(L.card,['A line that names the logic of each group','More facts, so each group looks complete'],0,
   'Without a name, Theo still has six facts to hold. With one, Theo holds two ideas.',
   'More facts make it worse. Theo needs the name of each group, so six facts become two ideas.');}},
{part:1,src:'Chapter 1 · The need to state the logic',pts:6,run(L){
  L.h(L.kick('pr','Sort Nadia’s notes')+'<h1 class="q">Nadia jotted six notes from the Mill Lane warehouse. Sort them into groups.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Space','Picking','Courier'],[
   ['Overflow stock blocks the end of every aisle',0,'It’s about room in the building.'],
   ['Saturday picking runs at half speed',1,'It’s about how fast staff pick orders.'],
   ['The courier now collects once a day',2,'Collections are the courier’s side.'],
   ['There’s no free bay for new deliveries',0,'Again, room in the building.'],
   ['New pickers need two weeks to reach full speed',1,'Another note about picking speed.'],
   ['Packed parcels miss the single afternoon pickup',2,'Missed pickups belong with the courier.']],
   'Six notes, three groups. Once Nadia names each group, Theo has three ideas to hold, not six.');}},

/* ---------- PART 3: TOP DOWN ---------- */
{part:2,src:'Chapter 1 · Ordering from the top down',run(L){
  L.h(L.kick('learn','Point first, always')+'<h1 class="q">The single most important habit in clear writing</h1>'+
   L.prose('The book says controlling the order of your ideas matters more than anything else. And the clearest order never changes:')+
   L.quote('give the summarizing idea before you give the individual ideas being summarized.','Barbara Minto, chapter 1')+
   L.prose('Why? A reader takes in one sentence at a time and assumes ideas that come together belong together. If you don’t say how they fit, the reader guesses. Different readers guess differently, some see no link at all, and even a right guess costs effort.'));
  L.done();}},
{part:2,src:'Chapter 1 · Ordering from the top down',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">The author tests a friend with facial hair</h1>');
  L.beats(L.card,[
   ['Fact 1','Over a drink, the author mentions lunch in Zurich, a famously conservative city, where many people had beards or moustaches.'],
   ['The guess','The listener starts guessing: is this about Zurich changing? Comparing cities? An odd interest in beards?'],
   ['Fact 2','Then: in New York offices, almost everyone has sideburns or a moustache. Now it seems to be about office workers, and all facial hair. New guesses.'],
   ['Fact 3','Then: facial hair has long been normal in London. The listener decides the point is “London is ahead of other cities.” Logical, and wrong.'],
   ['The real point','Facial hair has become an accepted part of business life: in Zurich, in New York and in London. Said first, the three facts click into place at once.']],
   'The reader will always look for a link between ideas. Tell them the link first, so they find the one you meant.');
  }},
{part:2,src:'Chapter 1 · Ordering from the top down',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Nadia visited a possible new warehouse on Quarry Road. Which first line of Nadia’s note to Theo is top down?</h1>');
  L.mc(L.card,['I drove out to Quarry Road on Tuesday with the agent.','Quarry Road is big enough for our next five years.','The Quarry Road loading bay faces the main road.'],1,
   'It’s the summarizing idea. Everything else in the note can now support it.',
   'That’s a detail. Theo would have to guess why it matters. The top-down line is the one that sums up the visit.');}},
{part:2,src:'Chapter 1 · Ordering from the top down',pts:1,
 solve:async L=>{for(let i=0;i<4;i++)L.$('#nx').click();},
 run(L){
  const S=[['Saturday picking at Mill Lane now runs at half speed.','Are we short of pickers?'],
           ['Since spring, the courier collects once a day instead of twice.','Is this a complaint about the courier?'],
           ['Overflow stock now fills the end of every aisle.','Is this about safety?'],
           ['So Mill Lane can no longer get online orders out on time. That’s why late orders rose from 4% to 15%.','Oh. Why didn’t you say that first?']];
  let n=0;
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Read Nadia’s email the way Theo does: one sentence at a time. Watch Theo’s guesses.</h1><div id="em"></div>'+
   '<button class="btn pri" id="nx" style="margin-top:8px">'+L.ic('play')+'Next sentence</button><div id="eq"></div>');
  L.$('#nx').onclick=function(){if(n>=S.length)return;const s=S[n];n++;
    L.$('#em').insertAdjacentHTML('beforeend','<div style="background:var(--soft);border-radius:14px;padding:10px 12px;margin:0 0 6px">'+s[0]+'<div class="small" style="margin-top:4px;color:var(--h3)">'+L.ic('chat')+' Theo thinks: <i>'+s[1]+'</i></div></div>');
    if(n===S.length){this.remove();const q=L.$('#eq');q.innerHTML='<h2 class="sub">What would have saved Theo three wrong guesses?</h2>';
      L.mc(q,['Shorter sentences, with plainer words','Putting the last sentence first','More detail on each of the problems'],1,
       'With the point first, each fact lands as a reason. Theo spends no energy guessing and has more left to weigh what it means.',
       'The sentences were already short and plain. The trouble was order: the point came last, so Theo guessed at every step.');}};}},
{part:2,src:'Chapter 1 · Thinking from the bottom up',run(L){
  L.h(L.kick('learn','Think bottom up, present top down')+'<h1 class="q">You build the pyramid from below</h1>'+
   L.prose('When you write, you start small. You group sentences into a paragraph because they all explain one idea, which is a summary of them. You would never mix five sentences on finance with one on tennis: no single sentence could sum them up.')+
   L.flow([['pencil','Sentences','single ideas'],['list','Paragraphs','each sums up its sentences'],['layers','Sections','each sums up its paragraphs'],['target','One thought','sums up everything']])+
   L.prose('You keep grouping and summing up until nothing is left to group. So every document ends up supporting <b>one</b> single thought. That should be your Main Point, and the reader should get it first, even though you reached it last.'));
  L.done();}},
{part:2,src:'Chapter 1 · Thinking from the bottom up',pts:1,run(L){
  L.h(L.kick('pr','Retrace Nadia’s thinking')+'<h1 class="q">Put the steps Nadia took to build the warehouse memo in the order they happened.</h1>');
  L.order(L.card,['Write a sentence for each thing found at Mill Lane','Group related sentences into paragraphs','Group the paragraphs into sections','State the one thought all sections support'],
   'That’s how thinking works: bottom up. Theo should read it the other way round, with that one thought first.');}},

/* ---------- PART 4: THREE RULES ---------- */
{part:3,src:'Chapter 1 · Thinking from the bottom up',run(L){
  L.h(L.kick('learn','The three pyramid rules')+'<h1 class="q">Check your ideas before you write a word</h1>'+
   L.prose('You can test whether a pyramid is built properly. The ideas must obey three rules:')+
   L.list([['Summarize','An idea at any level always sums up the ideas grouped below it.'],
           ['Same kind','The ideas in each group are always the same kind of idea.'],
           ['Logical order','The ideas in each group are always in a logical order.']],2)+
   L.prose('Rule 1 is the main act of thinking: making a new idea out of the ones below. Rules 2 and 3 make that possible, because you can only sum up a group that was formed properly.'));
  L.done();}},
{part:3,src:'Chapter 1 · Thinking from the bottom up',run(L){
  L.h(L.kick('learn','Rule 2: the same kind of idea')+'<h1 class="q">Apples and chairs don’t make a group</h1>'+
   L.flow([['leaf','Apples + pears','= fruit','one level up',2],['home','Tables + chairs','= furniture','one level up',3],['x','Apples + chairs','= “things”','far too broad',4]],false)+
   L.prose('Group apples with chairs and the only label left is something vague like “things,” which says nothing. So if the first idea in a group is a <i>reason</i>, the rest must be reasons too. If it’s a <i>step</i>, they must all be steps in the same process.')+
   L.note('<b>The '+L.g('plural-noun','plural-noun test')+':</b> can one plural noun label every idea in the group? Reasons, steps, problems, changes. If not, the group is broken.','check'));
  L.done();}},
{part:3,src:'Chapter 1 · Thinking from the bottom up',run(L){
  L.h(L.kick('learn','Rule 3: logical order')+'<h1 class="q">There must be a reason the second idea comes second</h1>'+
   L.prose('The book says there are only four ways to order a group, and the right one depends on how you formed the group:')+
   L.list([['Deductive','You reasoned it out: the ideas go in argument order, ending in a “therefore”.'],
           ['Chronological','You worked out cause and effect: first, second, third, in time order.'],
           ['Structural','You split a whole into parts: follow the structure, such as north, central, south.'],
           ['Comparative','You put things into a category: most important first.']],1)+
   '<p class="small" style="margin-top:10px">Chapter 6 goes deeper. For now: if a group fits none of these orders, something in your thinking is off.</p>');
  L.done();}},
{part:3,src:'Chapter 1 · Thinking from the bottom up',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">Nadia checks one group in the warehouse memo against the rules</h1>');
  L.beats(L.card,[
   ['The draft','Under the point “Mill Lane can’t get online orders out on time,” Nadia lists: shelves are full at peak, the courier collects once a day, and <b>we should rent overflow space near Mill Lane</b>.'],
   ['Rule 2 check','One plural noun: <i>reasons Mill Lane can’t cope</i>. Full shelves fits. One daily pickup fits. Renting overflow space doesn’t: it’s a recommendation, not a reason.'],
   ['The fix','Nadia moves the overflow-space idea out of this group. It belongs at a different level of the memo, as something to do about the problem.'],
   ['Rule 3 check','Why does “full shelves” come first? Nadia ranks the reasons by how many late orders each one causes, biggest first: comparative order.'],
   ['Rule 1 check','Does the point sum up the group? Full shelves and one daily pickup together explain why orders go out late. Yes.']],
   'Breaking a rule is a sign of a flaw in the thinking. Fixing it now saves rewriting later.');}},
{part:3,src:'Chapter 1 · Thinking from the bottom up',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Which group passes the plural-noun test?</h1>');
  L.mc(L.card,['Things about Mill Lane: full shelves, a new manager, low rent','Steps to move: pick a site, sign a lease, rising courier costs','Problems at Mill Lane: full shelves, slow peak picking, one pickup'],2,
   'Every item is a problem at Mill Lane, so one plural noun fits them all.',
   '“Things” is the apples-and-chairs label: too broad to say anything. And rising courier costs aren’t a step. Only the problems group shares one plural noun.');}},
{part:3,src:'Chapter 1 · Thinking from the bottom up',pts:6,run(L){
  L.h(L.kick('pr','Which rule is broken?')+'<h1 class="q">Each draft from Nadia’s team breaks one rule. Sort them.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['1 · Summary','2 · Same kind','3 · Order'],[
   ['Point: “Our stores are doing well.” Below it: three reasons late online orders are rising.',0,'The ideas below don’t support the point above them.'],
   ['Reasons to rent overflow space: it’s the cheapest option, it can start next month, and a list of warehouse staff.',1,'A staff list isn’t a reason.'],
   ['Steps to open overflow space: sign the lease, find a site, move the stock.',2,'You can’t sign a lease before you find a site. Steps need time order.'],
   ['Problems at Mill Lane: full shelves, slow picking, and a move to Quarry Road.',1,'A move is a fix, not a problem.'],
   ['Point: “Picking is our only problem.” Below it: picking, space and courier problems.',0,'The point doesn’t sum up the group; it contradicts it.'],
   ['The nine stores, listed neither by region nor by sales, just as they came to mind.',2,'No reason for the order. Pick one, such as by region (structural).']],
   'Each broken rule points to a gap in the thinking, not just in the wording.');}},
{part:3,src:'Chapter 1 · Thinking from the bottom up',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which order is this?',['Deductive','Chronological','Structural','Comparative'],[
   ['Most orders ship at peak. The courier fails at peak. So most orders ride on a failing courier.',0,'A statement, a comment on it, and a “so”: argument order.'],
   ['Update by area: north stores, then central stores, then south stores.',2,'It follows how the whole (the region) splits into parts.'],
   ['Three causes of late orders, biggest first.',3,'Ranked by importance: comparative order.'],
   ['Sign the lease in May, move the stock in June, start shipping in July.',1,'First, second, third in time.']]);}},
{part:3,src:'Chapter 1 · Thinking from the bottom up',pts:1,run(L){
  L.h(L.kick('pr','Build the point')+'<h1 class="q">Tap each piece until the sentence sums up Nadia’s group: pickers wait for space at peak, overflow stock blocks aisles, the courier collects once a day.</h1>');
  L.sentence(L.card,[['Three new steps','Space, picking and pickup problems','Our warehouse options'],['at Mill Lane','in the city stores'],['will lift store sales','are making online orders late']],[1,0,1],
   [['The ideas below aren’t steps. They’re problems.','They aren’t options either. They’re problems.'],['These notes are all about the warehouse, not the stores.'],['Nothing in the group is about store sales. Sum up what the problems cause.']],
   'It names what the ideas have in common and what they lead to. Rule 1: the point sums up the group below.');}}
  ]
});
</script>
</body>
</html>
