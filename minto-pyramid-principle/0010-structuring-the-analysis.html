<link rel="preconnect" href="https://fonts.googleapis.com">

<body>
<script src="../assets/course.js"></script>

<script>
Course.lesson({
  id:'0010', title:'Structuring the analysis of the problem', minutes:20, icon:'tree',
  goals:['Plan your analysis before you gather data, so every fact answers a question','Build a diagnostic framework and turn it into yes-or-no questions','Use logic trees to list solutions and to catch flaws in a list of “issues”'],
  parts:['Data first?','Frameworks','Using them','Issue Analysis'],
  read:'Read chapter 9 of the book for its full set of framework diagrams, from sales chains to the cigarette company’s task tree.',
  glossary:{
    'opening-scene':'Opening Scene (or Starting Point): the part of the business where the problem started, pictured as a structure or process at a set time and place.',
    'diagnostic-framework':'Diagnostic framework: a picture of how the problem area works (its parts, its causes and effects, or its classes of possible causes) that shows where to look for the cause of a problem.',
    'logic-tree':'Logic tree: a diagram that breaks one thing into all its possible parts, level by level, such as every way to cut a cost.',
    'issue':'Issue: a question that must be answered yes or no, such as “Should we reorganize by function?”',
    'concern':'Concern: a topic that worries the client, such as “warehouse costs”. Not yet a yes-or-no question.'
  },
  cheatsheet:[
    'Gathering all the data first, then thinking, wastes effort and leads to long, dull reports.',
    'Structure the analysis <b>before</b> gathering data: guess the likely causes, then gather only what proves or disproves them.',
    'Get the likely causes from a <b>diagnostic framework</b> of the Opening Scene: divide it (physical structure), trace cause and effect, or classify possible causes (MECE).',
    'Turn each part into a <b>yes-or-no question</b>. The answers rule causes in or out, and tell you when you’re finished.',
    'Use <b>logic trees</b> to list every possible solution, and to test whether a list of ideas really hangs together.',
    'An <b>issue</b> is a yes-or-no question. Call open topics <b>concerns</b>.',
    'Issues come from the structure behind R1, not from the client’s question.',
    'If a report is painful to write, the thinking probably came too late.'
  ],
  steps:[
/* ---------- PART 1: DATA FIRST? ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Leah is asked to find out why online orders arrive late. Leah’s plan: pull every report the warehouse has, then look for patterns. Good plan?</h1>');
  L.mc(L.card,['Yes, more data gives a better answer','Risky, Leah may drown in facts'],1,
   'Without a sense of what to look for, Leah can’t tell which facts matter. This lesson shows how to decide that before gathering anything.',
   'More data feels safe, but with no question to answer, Leah can’t tell which facts matter. This lesson shows a better route.');}},
{part:0,src:'Chapter 9 · Structuring the Analysis of the Problem',run(L){
  L.h(L.kick('learn','Gather first, think later?')+'<h1 class="q">The usual habit: collect everything, then try to make sense of it</h1>'+
   L.flow([['list','Gather data','',''],['eye','Findings','',''],['bulb','Conclusions','',''],['arrow','Actions','','']])+
   L.prose('Problem analysis usually follows these four steps. The trouble is how people do the first one: they gather whatever data exists, and put off real thinking until it’s all in one place.')+
   L.prose('That always makes extra work. The better way is to plan the gathering so it produces findings that fit together. You do that with '+L.g('diagnostic-framework','diagnostic frameworks')+' and '+L.g('logic-tree','logic trees')+'. The analysis gets faster, and turning the results into a pyramid gets much simpler.'));
  L.done();}},
{part:0,src:'Chapter 9 · Starting with the Data',run(L){
  L.h(L.kick('ex','How the habit started')+'<h1 class="q">Why consultants used to start with the data, and why they stopped</h1>');
  L.beats(L.card,[
   ['The 1950s and 60s','Consulting was young and firms knew little about each industry. So every job began with a full study: what it takes to succeed in the industry, the client’s strengths and weaknesses, a comparison, then recommendations.'],
   ['The result','Mountains of facts and few clear conclusions. One big firm estimated that 60% of its fact-finding effort was wasted. Data for the main recommendations was often missing, so teams scrambled at the last minute.'],
   ['The write-up','Facts were filed under headings like Operations and Marketing, or Findings, Conclusions and Recommendations. Headings like these don’t force any thinking, so reports came out long and dull.'],
   ['The fix','Better firms now structure the analysis <b>before</b> gathering data, much like the scientific method: think up the likely reasons for the problem, then gather data to prove each one right or wrong.']],
   'Decide what you’re trying to prove, then gather only what proves or disproves it.');}},
{part:0,src:'Chapter 9 · Starting with the Data',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">The better firms copy the scientific method. Put its steps in order.</h1>');
  L.order(L.card,['Think up the possible explanations','Design a test that can rule some out','Run the test to get a clean result','Act on what the result shows'],
   'Explanations first, then a test whose result rules some out. Each step tells you exactly which data you need.');}},

/* ---------- PART 2: FRAMEWORKS ---------- */
{part:1,src:'Chapter 9 · Devising Diagnostic Frameworks',run(L){
  L.h(L.kick('learn','Where likely causes come from')+'<h1 class="q">You don’t pull causes out of the air. You picture the problem area</h1>'+
   L.prose('The likely causes come from looking hard at the area where the problem started: the Opening Scene from the last lesson. A '+L.g('diagnostic-framework','diagnostic framework')+' is a picture of that area.')+
   L.prose('The book’s simple example: your head hurts and you don’t know why. Lay out the possible causes, '+L.g('mece','MECE')+' at each level:')+
   L.tiers([['alert','Head hurts','The problem'],
            ['layers','Physical or mental?','Every cause is one or the other'],
            ['pointer','If physical: external or internal?','External might be a bump, an allergy, the weather…']])+
   L.prose('Now you can check the causes that are easiest to rule out first. Nobody books a brain scan before ruling out a sinus headache.'));
  L.done();}},
{part:1,src:'Chapter 9 · Devising Diagnostic Frameworks',run(L){
  L.h(L.kick('learn','Three ways to build one')+'<h1 class="q">There are only three ways to structure anything, so three kinds of framework</h1>'+
   L.list([['box','Divide it: show the physical structure','Draw the units of the business and how they connect, such as maker → wholesaler → retailer → customer. Then ask where the flow breaks: are customers not aware, or not persuaded to buy?'],
     ['arrow','Trace cause and effect','Break a result into what produces it: money (return on investment into profits and assets), tasks (each part stated as a job, like “reduce leaf costs”), or activities (installations take too long → too few people, more hours each, fewer hours on duty).'],
     ['layers','Classify the possible causes','Group likely culprits into MECE classes at the top branch, such as fixed versus variable factors. A <b>choice structure</b> splits into two at each stage: the right stores or the wrong ones? If right, the right visiting frequency or the wrong one?']],1));
  L.done();}},
{part:1,src:'Chapter 9 · Showing Physical Structure',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">Nadia draws how an online order moves, and finds the questions</h1>');
  L.beats(L.card,[
   ['The picture','Order placed online → picked at Mill Lane → packed → collected by the courier → delivered to the customer.'],
   ['Picking','Question: <i>Does picking an order take longer at peak than it did last year?</i> Yes or no.'],
   ['Packing','Question: <i>Do picked orders queue for packing for more than a few hours?</i>'],
   ['Collection','Question: <i>Do packed parcels miss the day’s courier collection?</i>'],
   ['Delivery','Question: <i>Has the courier taken longer to deliver since the spring contract change?</i>'],
   ['What Nadia has now','Four questions, each with a yes-or-no answer. Each one names exactly the data needed, and together they cover the whole flow.']],
   'Draw the structure of the Opening Scene, then ask a yes-or-no question about each part.');}},
{part:1,src:'Chapter 9 · Showing Physical Structure',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Which question fits Nadia’s framework best?</h1>');
  L.mc(L.card,['What’s going on with the courier lately?','How could the warehouse work better?','Do parcels wait over a day for collection?'],2,
   'It has a clear yes-or-no answer, and you know exactly what data would settle it.',
   'Open questions invite endless data gathering. A yes-or-no question, like whether parcels wait over a day, tells you what to measure and when you’re done.');}},
{part:1,src:'Chapter 9 · Applying the Frameworks',run(L){
  L.h(L.kick('learn','Why yes or no?')+'<h1 class="q">Yes-or-no questions are your crucial experiments</h1>'+
   L.prose('The key thing about a diagnostic framework is the yes-or-no questions it produces. Like a scientist’s crucial experiment, each answer clearly identifies a cause or rules it out.')+
   L.lanes([['check','They settle things','A “yes” keeps a cause in play; a “no” crosses it off.',2],
            ['clock','They tell you when you’re done','Once every question is answered, the research is finished. You know that in advance.',1]])+
   L.prose('That makes them different from decision trees and project schedules, which show what action to take, not what question to ask.')+
   L.note('A framework is also a good way to explain the problem to the reader: how the setup works today, what it must have been doing to produce R1, and what it should look like to deliver R2.','chat'));
  L.done();}},
{part:1,src:'Chapter 9 · Devising Diagnostic Frameworks',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which kind of framework?',['Physical structure','Cause and effect','Classify causes'],[
   ['Map how a pair of boots moves from supplier to Mill Lane to a store shelf to a customer.',0,'You’re drawing the units of the business and how goods flow between them.'],
   ['Break profit into sales and costs, then each of those into what drives it.',1,'You’re tracing the money that produces a result: a financial structure.'],
   ['Split possible causes of late orders into “inside the warehouse” and “after it leaves”.',2,'Two MECE classes at the top branch, to guide the search below.'],
   ['Start from “parcels leave late” and list what could produce it: fewer pickers, slower picks, unexpected delays.',1,'You’re tracing the activities that lead to an undesired result.'],
   ['Ask: right stock in the store or not? If right, displayed well or not? If well, priced right or not?',2,'A choice structure: two options at each stage, following the order of the process.']]);}},
{part:1,src:'Chapter 9 · Classifying Possible Causes',pts:1,
 solve:async L=>{for(const r of [0,1,1])L.$('#o'+r).click();},
 run(L){
  const ST=[
   ['Late inside Mill Lane, or late after the courier collects?','Leah’s first check: 4 in 5 late parcels left Mill Lane at least a day behind schedule.',['Inside Mill Lane','After collection'],0,'Most late parcels were already late when they left. Look inside the warehouse first.'],
   ['Inside Mill Lane: do packed parcels wait, or is picking slow?','Packed parcels wait about two hours for the courier. At peak, picking an order can take more than a day.',['Packed parcels wait','Picking is slow'],1,'Two hours of waiting can’t explain a day’s delay. Picking can.'],
   ['Picking is slow: too few pickers, or does each pick take longer?','There are as many pickers as last year. But the warehouse is full, stock is stacked in the aisles, and pickers walk much further per order.',['Too few pickers','Each pick takes longer'],1,'Same staff, longer walks. The time goes into each pick.']];
  let k=0,miss=0;
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Follow the choice structure for late orders. At each split, read Leah’s data and pick the branch.</h1><div id="tr" style="display:flex;flex-wrap:wrap;gap:6px;margin:6px 0"></div><div id="ch"></div><div id="cf"></div>');
  const show=()=>{const s=ST[k];
    L.$('#ch').innerHTML='<h2 class="sub">'+s[0]+'</h2><div class="small" style="background:var(--soft);border-radius:14px;padding:12px;margin:8px 0">'+L.ic('eye')+' '+s[1]+'</div><div style="display:flex;gap:8px;flex-wrap:wrap">'+s[2].map((o,j)=>'<button class="btn" id="o'+j+'">'+o+'</button>').join('')+'</div>';
    s[2].forEach((o,j)=>{L.$('#o'+j).onclick=()=>{L.$('#cf').innerHTML='';
      if(j!==s[3]){miss++;L.fb(L.$('#cf'),'<b>Check the data again.</b> '+s[4],'no');return;}
      L.$('#tr').insertAdjacentHTML('beforeend','<span class="chip static ok">'+L.ic('check')+o+'</span>');k++;
      if(k<ST.length){show();return;}
      L.$('#ch').innerHTML='';L.award(miss===0);
      L.sheet(miss===0?'ok':'info',miss===0?'Straight to the cause':'Found it','Three yes-or-no splits narrowed a vague problem to one area: the full warehouse makes every pick slower. Nadia now knows which data to gather next, and that the courier isn’t the main cause.');L.done();};});};
  show();}},

/* ---------- PART 3: USING THEM ---------- */
{part:2,src:'Chapter 9 · Applying the Frameworks',run(L){
  L.h(L.kick('learn','Which framework, when?')+'<h1 class="q">Know the field, and let the Opening Scene point the way</h1>'+
   L.prose('Which framework you need, and how much of it to dig into, depends on how well you know the subject. Good problem solving can’t be done in the abstract. Nothing replaces deep knowledge of the area where the problem happened.')+
   L.prose('Still, there’s a strong clue: the frameworks you need are usually implied by the '+L.g('opening-scene','Opening Scene')+' of your problem definition. If the problem lives in the factory’s activities, picture those activities. If it lives in the order flow at Mill Lane, picture that flow.'));
  L.done();}},
{part:2,src:'Chapter 9 · The Client’s Problem',run(L){
  L.h(L.kick('ex','The book’s example')+'<h1 class="q">A consultant’s data list versus a framework</h1>');
  L.beats(L.card,[
   ['The problem','A new division of a company called Barrows is growing faster than expected. Despite new planning systems, it’s missing parts and falling behind on orders, and may miss growth chances.'],
   ['The proposal','The consultant plans to gather data on eight broad areas: growth forecasts, objectives, current systems, causes of inefficiency and more.'],
   ['The risk','Interviewing people on all eight areas brings back far more than anyone can absorb, with no easy way to tell what’s relevant.'],
   ['The better route','Gather only enough to draw how the operation works, from purchasing to scheduling. Then guess where it’s weak and frame yes-or-no questions, like “Are shortages hurting sales or raising costs?”'],
   ['The payoff','For each question: what must I find out to answer it? Now each piece of data has a known purpose, and before starting he can name its source, who collects it, when, and the cost.']],
   'A framework first, then only the data that answers its questions.');}},
{part:2,src:'Chapter 9 · The Approach to Analysis',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Nadia has an order-flow diagram and four yes-or-no questions. What can Nadia now do before gathering a single figure?</h1>');
  L.mc(L.card,['Plan each data source, owner, date and cost','Write the final recommendation','Skip data gathering entirely'],0,
   'Each question names the data needed, so the whole effort can be planned in advance.',
   'Nadia can’t recommend anything yet, and still needs data to answer the questions. But the data can be planned: source, owner, schedule and cost for each piece.');}},
{part:2,src:'Chapter 9 · The Approach to Analysis',pts:5,run(L){
  L.h(L.kick('pr','Needed or not?')+'<h1 class="q">Nadia’s questions: “Does picking take longer at peak than last year?” and “Do packed parcels miss the day’s collection?” Sort Leah’s data requests.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Needed','Skip for now'],[
   ['Time to pick each order, by hour, this year and last',0,'It answers the picking question directly.'],
   ['Staff satisfaction survey from last spring',1,'Interesting, but it answers neither question.'],
   ['Time from packing to the courier’s collection scan',0,'It answers the collection question directly.'],
   ['The history of the Mill Lane lease',1,'Nothing in either question depends on it.'],
   ['Courier collection times each day since spring',0,'You need them to tell whether parcels miss the collection.']],
   'Each question names its own data. Anything that answers no question can wait.');}},
{part:2,src:'Chapter 9 · Developing Logic Trees',run(L){
  L.h(L.kick('learn','Logic trees for solutions')+'<h1 class="q">Once you know the cause, a logic tree lists every way to fix it</h1>'+
   L.prose('Diagnostic frameworks model what exists (where is the problem, and why?). For “what could we do?” you look the other way, and use a '+L.g('logic-tree','logic tree')+' to spell out every possible action, MECE at each level.')+
   L.prose('The book’s example: a cigarette maker wants to cut direct labor cost. The consultant splits cost per cigarette into two parts and lists the ways to cut each:')+
   L.flow([['clock','Cost per hour','less overtime, cheaper labor, smaller wage rises','',1],['cycle','Hours per million','fewer people per machine, faster and more efficient machines','',2]],false)+
   L.prose('With every option laid out, you can estimate the benefit and risk of each, and pick the set to recommend. Experts may see solutions beyond strict logic; a tree helps everyone else.'));
  L.done();}},
{part:2,src:'Chapter 9 · Generating Possible Solutions',pts:5,run(L){
  L.h(L.kick('pr','Build the tree')+'<h1 class="q">The cause is a full warehouse. Sort these ideas onto the branches of Nadia’s tree, “Make room to pick online orders fast.”</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['More room at Mill Lane','A bigger or extra site','Send the work out'],[
   ['Clear slow-selling stock out of the picking aisles',0,'It frees space inside the current warehouse.'],
   ['Move to the larger warehouse on Quarry Road',1,'A new, bigger site.'],
   ['Hand online orders to a third-party logistics firm',2,'Someone else does the picking and shipping.'],
   ['Rent overflow space near Mill Lane',1,'An extra site alongside the current one.'],
   ['Fit taller shelving to use the full roof height',0,'More room in the same building.']],
   'Three branches that don’t overlap and between them cover the options. Now each idea can be costed against the R2.');}},
{part:2,src:'Chapter 9 · Revealing Flaws in Grouped Ideas',run(L){
  L.h(L.kick('learn','Trees catch muddled lists')+'<h1 class="q">Map a list of “issues” onto a tree, and the gaps and strays show up</h1>'+
   L.prose('The book takes a proposal to a Texas pipe distributor. New owners thought $27 million of stock was too much. The proposal listed five wordy “key issues”, some of them not yes-or-no questions at all.')+
   L.prose('Laid out properly, R1 is too much capital tied up in stock and R2 is the right amount. A tree of causes says stock runs high because you <b>order too much</b> or <b>keep it too long</b>. That gives two real questions: is the system ordering properly, and is it holding too much slow-moving stock?')+
   L.prose('In a second example, ten “issues” on cutting a factory’s energy costs were mapped onto a tree of ways to cut energy costs. Three didn’t relate to the subject at all.')+
   L.note('Every group of ideas comes from some analysis. Match the group to the structure behind it, and you can see whether it holds up.','tree'));
  L.done();}},
{part:2,src:'Chapter 9 · Revealing Flaws in Grouped Ideas',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Map Leah’s list onto the tree',['Picking is slow','Parcels wait to go','Courier is slow','Doesn’t fit'],[
   ['Is the full warehouse making each pick take longer?',0,'That tests the picking branch.'],
   ['Should delivery boxes carry the new Fellwick logo?',3,'Nothing to do with why orders arrive late. Drop it.'],
   ['Do packed parcels miss the day’s collection?',1,'That tests the waiting branch.'],
   ['Has the spring contract made the courier slower?',2,'That tests the courier branch.'],
   ['Should store staff get a new uniform?',3,'It doesn’t belong under any cause of late orders.']]);}},

/* ---------- PART 4: ISSUE ANALYSIS ---------- */
{part:3,src:'Chapter 9 · Performing an Issue Analysis',run(L){
  L.h(L.kick('learn','What an issue really is')+'<h1 class="q">An issue is a yes-or-no question. Everything else is a concern</h1>'+
   L.prose('The word comes from the legal phrase “at issue”: two sides argue a point, and one will win. So an '+L.g('issue','issue')+' must be phrased to need a yes or no.')+
   L.lanes([['x','Not an issue','“How should we reorganize?” Nothing is at issue yet.',4],
            ['check','An issue','“Should we reorganize by function?” The thinking has reached a decision point.',2]])+
   L.prose('How well you can frame clear yes-or-no questions decides how efficient your problem solving will be. When you’re just listing topics that worry the client, call them '+L.g('concern','concerns')+', and keep “issues” for yes-or-no questions.'));
  L.done();}},
{part:3,src:'Chapter 9 · The History',run(L){
  L.h(L.kick('ex','A short history')+'<h1 class="q">Where “Issue Analysis” came from, and how the name drifted</h1>');
  L.beats(L.card,[
   ['The start','As far as the author can tell, two McKinsey consultants coined “Issue Analysis” in a 1960s study for New York City, for urgent, complex decisions such as how much middle-income housing to provide.'],
   ['The method','They drew the physical system (sites, builders, tenants, rents) and marked the key decision points, such as tenant selection rules, which affect how many people apply and so how many homes to build.'],
   ['Then','Each key decision was weighed against its feasible alternatives in a standard form. It was far too complex for ordinary use, and it was dropped.'],
   ['Now','The idea of mapping the system and making guesses stuck, and so did the name. Almost any analytical framework now gets called “Issue Analysis”, and the confusion spread as consultants changed firms.']],
   'The original idea, mapping the system to find the decisions, is sound. The label is now used loosely.');}},
{part:3,src:'Chapter 9 · Performing an Issue Analysis',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Which of these is an issue, in the book’s strict sense?</h1>');
  L.mc(L.card,['Warehouse space and running costs','How should we handle online orders?','Should online orders go to a third party?'],2,
   'It can only be answered yes or no, so it’s an issue.',
   'One is a topic (a concern) and one is an open question. Only “Should online orders go to a third party?” demands a yes or no.');}},
{part:3,src:'Chapter 9 · Performing an Issue Analysis',pts:6,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Issue or not?',['An issue','Not an issue'],[
   ['Should Fellwick move to Quarry Road?',0,'Yes or no, with two sides to argue.'],
   ['The future of Mill Lane',1,'A topic, so it’s a concern.'],
   ['What level of stock should Mill Lane hold?',1,'An open question. As an issue: “Is Mill Lane holding too much stock?”'],
   ['Is picking slower at peak than last year?',0,'A clean yes-or-no question the data can settle.'],
   ['Courier performance since spring',1,'A topic. Turn it into “Has the courier got slower since spring?”'],
   ['Do packed parcels miss the day’s collection?',0,'Yes or no, and it tells you what to measure.']]);}},
{part:3,src:'Chapter 9 · The Misconceptions',run(L){
  L.h(L.kick('learn','Four common muddles')+'<h1 class="q">Where firms’ “Issue Analysis” steps go wrong</h1>'+
   L.list([['Starting from the client’s question','The client’s question (“What should our strategy be?”) usually reflects an R2. Issues must come from the structure of the situation that produced R1.'],
     ['Jumping to a list of issues','With no structure behind it, there’s no way to know where the issues came from or whether the list is complete.'],
     ['A separate “hypothesis” step','Guessing yes or no in advance adds nothing. The issues all come from the same tree anyway.'],
     ['Calling solution trees “Issue Analysis”','Trees that list possible actions are useful, but they’re a different kind of tree from diagnostic ones.']],4)+
   L.note('Defining the problem, frameworks and logic trees do two jobs: they keep problem solving on the real problem, and they make the final report far easier to write. When a report is a struggle, the thinking usually came too late.','bulb'));
  L.done();}},
{part:3,src:'Chapter 9 · The Misconceptions',pts:1,run(L){
  L.h(L.kick('pr','Review a plan')+'<h1 class="q">An outside adviser’s plan for Fellwick starts: “Step 1: take the client’s question, ‘What should our warehouse strategy be?’ Step 2: list the issues.” What would the book say?</h1>');
  L.mc(L.card,['Derive issues from how Mill Lane works today','Fine, as long as the issues are numbered','Add a hypothesis step before listing issues'],0,
   'The client’s question reflects the R2. Issues come from the structure that produced the R1: how Mill Lane handles orders now.',
   'Numbering doesn’t help, and a hypothesis step adds nothing. The issues should come from the structure behind the R1: how Mill Lane works today.');}}
  ]
});
</script>
</body>
</html>
