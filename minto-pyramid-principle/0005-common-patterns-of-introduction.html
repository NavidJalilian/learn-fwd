<script>
Course.lesson({
  id:'0005', title:'Common patterns of introduction', minutes:19, icon:'list',
  goals:['Name which of the four common questions a document answers','Use the ready-made S-C-Q patterns for directives, money requests, “how to” and choices','Open a proposal or a progress review with the right pattern'],
  parts:['Four questions','Direction and money','How-to and choices','Consulting'],
  read:'Read the second half of chapter 4 of the book for every pattern in skeleton form, then Appendix B for full real-life introductions.',
  glossary:{
    'directive':'Directive: a note that asks or tells someone else to do something. Its Question is planted by the writer, not already in the reader’s mind.',
    'progress-review':'Progress review: a planned update to a client or a boss at the end of each phase of a project, often leading up to a final report.'
  },
  cheatsheet:[
    'Most documents answer one of four questions: <b>What should we do? How should we do it? Should we do it? Why did it happen?</b>',
    '<b>Directive:</b> S = we want to do X · C = we need you to do Y · Q = how do we do Y? The Key Line is steps.',
    '<b>Money request:</b> S = we have a problem · C = we have a solution that costs $ · Q = should I approve? Reasons: it can’t wait, it solves the problem, the money adds up, plus any extra benefits.',
    '<b>How to:</b> the Key Line is always steps. To fix a process, lay out the present process and the better one; the differences are your steps.',
    '<b>Alternatives:</b> write about them only when the reader already knows them. Argue by criteria, or give the main reason for and against each.',
    '<b>Proposals:</b> new client = “are you the one to hire?” (understand, approach, experience, terms). Known client = “how will you help?”, built around the approach.',
    '<b>Progress reviews:</b> S = we told you X · C = you asked us to look into Y, and we have · Q = what did you find?'
  ],
  steps:[
/* ---------- PART 1: FOUR QUESTIONS ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Nadia sends Theo a note: the Mill Lane warehouse needs new shelving, and it will cost $40,000. What will Theo want to know as they read?</h1>');
  L.mc(L.card,['How the shelving was designed and built','Whether they should say yes to spending it'],1,
   'A request for money always raises the same question in the reader’s mind. This lesson shows that most documents answer one of a few questions like it, each with a ready-made opening.',
   'Theo is being asked to spend money, so the one thing on their mind is “Should I approve this?”. Most documents answer one of a few questions like it, each with a ready-made opening.');}},
{part:0,src:'Chapter 4 · Some Common Patterns',run(L){
  L.h(L.kick('learn','Four questions')+'<h1 class="q">Most documents answer one of just four questions</h1>'+
   L.prose('Once you have thought through many introductions, the book says, you notice the same patterns coming back. Nearly everything you write answers one of four questions:')+
   L.list([['target','What should we do?','The reader needs a recommended action.'],
     ['list','How should we do it?','Or how will we, or how did we. The answer is a set of steps.'],
     ['scale','Should we do it?','The reader must decide yes or no, often about money.'],
     ['eye','Why did it happen?','The reader wants a cause explained.']],1)+
   L.prose('By far most documents tell people what action to take. People rarely want to know <i>why</i> something happened without also wanting to know what to do about it. The exception is reporting findings early in an analysis.'));
  L.done();}},
{part:0,src:'Chapter 4 · Some Common Patterns',run(L){
  L.h(L.kick('learn','Four business patterns')+'<h1 class="q">Four kinds of document come up again and again</h1>'+
   L.prose('Which patterns you meet most depends on your business. The four the book has seen most often in business each answer one of the questions:')+
   L.tiers([['pointer','Giving direction','You ask or tell someone to do something.','What should we do? or How should we do it?'],
            ['scale','Seeking approval to spend money','You ask the reader to say yes to a cost.','Should we do it?'],
            ['list','Explaining “how to”','You tell the reader how to solve a problem.','How should we do it?'],
            ['compass','Choosing among alternatives','You pick one of several known options.','What should we do?']])+
   '<p class="small" style="margin-top:10px">Each one has a standard '+L.g('scq','S-C-Q')+' you can reuse. The next parts take them one at a time.</p>');
  L.done();}},
{part:0,src:'Chapter 4 · Some Common Patterns',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Kenji writes to the 9 store managers: “To launch click-and-collect, we need each store’s floor plan by Friday.” Which kind of document is this?</h1>');
  L.mc(L.card,['Choosing among alternatives','Seeking approval to spend money','Giving direction'],2,
   'Kenji is asking the store managers to do something. That’s a '+L.g('directive','directive')+'.',
   'No money is being approved and no options are compared. Kenji is telling the managers to do something, so it’s giving direction.');}},
{part:0,src:'Chapter 4 · Some Common Patterns',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which question does it answer?',['What should we do?','How should we do it?','Should we do it?','Why did it happen?'],[
   ['Imani’s note asking Theo to sign off $1.2M to fit out Quarry Road.',2,'A request for money always asks the reader for a yes or a no.'],
   ['Kenji’s guide for store staff on handing over click-and-collect orders.',1,'A guide to doing something is an answer to “How?”: a set of steps.'],
   ['Nadia’s early finding that late orders began rising once Mill Lane filled up.',3,'Explaining a cause on its own is rare. It fits early findings like this one.'],
   ['Nadia’s note recommending one of three ways to get more warehouse space.',0,'Picking among options tells the reader what action to take.'],
   ['Leah’s steps for checking stock counts at month end.',1,'Steps again, so the question is “How?”.']]);}},

/* ---------- PART 2: DIRECTION AND MONEY ---------- */
{part:1,src:'Chapter 4 · Giving Direction',run(L){
  L.h(L.kick('learn','Giving direction')+'<h1 class="q">In a directive, you plant the question</h1>'+
   L.prose('A directive is probably the most common business memo there is: you write to ask or tell someone else to do something. Here the reader doesn’t already have a question. <b>You plant it.</b>')+
   L.flow([['book','Situation','We want to do X','',1],['alert','Complication','We need you to do Y','',2],['chat','Question','How do we do Y?','',3]])+
   L.prose('The Question is usually left unsaid; the writing flows fine without it. But spell it out for yourself before you write, or you risk not being sure what you’re answering. The answer to “How?” is always <b>steps</b>.'));
  L.done();}},
{part:1,src:'Chapter 4 · Giving Direction',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">A sales manager needs something from every salesperson</h1>');
  L.beats(L.card,[
   ['Situation','At the next field sales meeting, the manager wants to teach the sales team how to present a new way of organizing shelf space in grocery chains.'],
   ['Complication','To teach it well, they need information from each salesperson about one problem chain in their area.'],
   ['Question','Unstated, but there: <i>How do I give you that information?</i>'],
   ['Answer and Key Line','Steps, each with a date: pick a suitable chain, collect the data, organize it and send it back.'],
   ['Notice','The Answer is roughly the Complication turned around. Carry out the steps and the need for information is met.']],
   'A second example in the book: a procedures manual many people update. S = you do X; C = it must be done in a set way; Q = what is that way?');}},
{part:1,src:'Chapter 4 · Giving Direction',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Nadia writes to store managers: “We launch click-and-collect in March. To plan shelf space for parcels, we need each store’s floor plan.” What Question should Nadia spell out before writing?</h1>');
  L.mc(L.card,['How do I send you my floor plan?','Should we launch click-and-collect?','Why is click-and-collect launching?'],0,
   'Nadia planted it with the Complication. The Key Line will be the steps, with dates.',
   'The launch is already decided. The question Nadia planted is “How do I send you my floor plan?”, and the answer is a set of steps.');}},
{part:1,src:'Chapter 4 · Seeking Approval to Spend Money',run(L){
  L.h(L.kick('learn','Seeking approval to spend money')+'<h1 class="q">The reader’s question is always “Should I approve?”</h1>'+
   L.flow([['alert','Situation','We have a problem','',1],['bulb','Complication','We have a solution that costs $…','',2],['scale','Question','Should I approve?','',3]])+
   L.prose('The Answer: “We urge you to approve.” Then the Key Line gives three, sometimes four, standard reasons:')+
   L.list([['clock','It can’t wait','Here you describe the problem in full.'],
     ['check','It will solve the problem','Here you describe the solution. If you looked at options: it’s the best of them.'],
     ['scale','The money makes sense','The normal financial case: for example, savings will more than cover the cost.'],
     ['star','There are extra benefits','Only if the facts support it. You wouldn’t act for this reason alone, but you might as well mention it.']],2));
  L.done();}},
{part:1,src:'Chapter 4 · Seeking Approval to Spend Money',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">A department that ran out of hours</h1>');
  L.beats(L.card,[
   ['Situation','Work in a department has grown by 20% a year for four years. Head office policy kept staff at 14 people, so there is overtime, weekend work and a growing backlog.'],
   ['Complication','The backlog has reached 22 weeks, the field won’t accept it, and there are no more hours to add. A new computer system would cut both the backlog and the overtime, at a stated cost.'],
   ['Question','Left unsaid: <i>Should I approve?</i>'],
   ['Answer','We urge your approval of this request.'],
   ['Key Line','It can’t wait. It will solve the problem. The cost is more than covered. Plus any extra benefits the facts support.']],
   'The pattern is so regular that you can sketch the whole pyramid before you write a word.');}},
{part:1,src:'Chapter 4 · Seeking Approval to Spend Money',pts:5,run(L){
  L.h(L.kick('pr','Sort the reasons')+'<h1 class="q">Nadia asks Theo to approve $40,000 for taller shelving at Mill Lane. Which standard reason does each point support?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['It can’t wait','It solves it','Money adds up','Extra benefit'],[
   ['Late orders are at 15%, and peak season starts in six weeks',0,'This describes the problem and why it’s urgent.'],
   ['Taller racks free enough floor for pickers to move quickly at peak',1,'This shows the solution fixes the problem.'],
   ['Lower overtime pays back the cost within two years',2,'This is the financial case.'],
   ['The new racks also make the yearly stock count faster',3,'Nice to have, but nobody would buy racks for this alone.'],
   ['Without more room, the warehouse can’t take the extra winter stock',0,'Another part of the problem: why it must be settled now.']],
   'Problem, solution, money, extras: the Key Line almost writes itself once you know the pattern.');}},

/* ---------- PART 3: HOW-TO AND CHOICES ---------- */
{part:2,src:'Chapter 4 · Explaining “How to”',run(L){
  L.h(L.kick('learn','Explaining “how to”')+'<h1 class="q">The Key Line is always steps. The opening depends on what’s new.</h1>'+
   L.prose('Often you write because someone has a problem and you’re telling them how to solve it. The Key Line of any “how to” document is <b>steps</b>. But the introduction has two forms:')+
   L.lanes([['leaf','Something new','S = we must do X<br>C = we aren’t set up to do it<br>Q = how do we get set up?',1],
            ['cycle','Fixing what exists','S = your present system is X<br>C = it doesn’t work properly<br>Q = how do we change it so it does?',2]])+
   L.note('<b>The trick for fixing a process:</b> lay out the present process step by step, then the process as it should be. The differences between the two are your Key Line steps. Don’t trust your memory: without laying both out, it’s easy to leave something important out.','pencil'));
  L.done();}},
{part:2,src:'Chapter 4 · Explaining “How to”',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Click-and-collect has never run at Fellwick. Kenji writes the store managers’ guide to launching it. Which introduction fits?</h1>');
  L.mc(L.card,['S = your handover process is X · C = it fails · Q = how do we fix it?','S = we must run click-and-collect · C = we aren’t set up · Q = how do we get set up?'],1,
   'It’s something the stores have never done, so the opening is about getting set up. The Key Line will be the steps.',
   'There’s no present process to fix yet. For something new: we must do X, we aren’t set up, how do we get set up?');}},
{part:2,src:'Chapter 4 · Explaining “How to”',pts:1,
 solve:async L=>{const g=L.$('#pp').children;g[0].click();g[1].click();},
 run(L){
  const P=[['Orders print once, at 8am','Orders are released every hour'],['Pickers fetch one order per walk','Pickers fetch one order per walk'],['Packers wait for a full trolley','Packers pack each order as it arrives'],['Courier collects at 2pm','Courier collects at 2pm']];
  const seen=new Set();
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Late online orders: Nadia lays out the picking process as it is, and as it should be. Look at both.</h1><div id="pp"></div>'+
   '<div style="background:var(--soft);border-radius:16px;padding:14px;margin:8px 0 6px;min-height:150px"><div class="small" id="pc" style="margin-bottom:8px">Choose a process above.</div><div id="pl"></div></div><div id="pq"></div>');
  ['Present process','Process as it should be'].forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.innerHTML=L.ic(j?'check':'clock')+n;
    b.onclick=()=>{[...L.$('#pp').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(j);
      L.$('#pc').innerHTML=j?'<b>Changed steps are highlighted.</b>':'<b>Today, step by step</b>';
      L.$('#pl').innerHTML=P.map((s,k)=>{const ch=j&&s[0]!==s[1];return '<div class="chip static'+(ch?' ok':'')+'" style="display:flex;margin:4px 0;'+(j&&!ch?'opacity:.45':'')+'">'+(k+1)+' · '+s[j]+'</div>';}).join('');
      if(seen.size===2&&!L.$('#pq').innerHTML){const q=L.$('#pq');q.innerHTML='<h2 class="sub">So which Key Line should Nadia’s “how to” note have?</h2>';
        L.mc(q,['Release orders hourly, and pack each order as it arrives','Print orders, pick them, pack them, hand them over','Change the picking walk and the courier collection time'],0,
         'Only two steps differ, so those two changes are the Key Line. The unchanged steps need no instructions.',
         'The Key Line comes from the <i>differences</i> between the two processes. Only the release time and the packing changed; the picking walk and the courier stay the same.');}};
    L.$('#pp').appendChild(b);});}},
{part:2,src:'Chapter 4 · Choosing Among Alternatives',run(L){
  L.h(L.kick('learn','Choosing among alternatives')+'<h1 class="q">A well-defined problem rarely has “alternative solutions”</h1>'+
   L.prose('Managers often say “and show me the alternatives.” Strictly, the book says, a properly defined problem has none: what you recommend either solves it or it doesn’t. What the manager really means is “what else could we try if nothing fully solves it?”')+
   L.prose('So you should only need a memo about real alternatives when the reader <b>already knows them</b>, usually because they’ve been discussed in the company. Then the introduction is easy:')+
   L.flow([['target','Situation','We want to do X','',1],['layers','Complication','There are several ways to do it','',2],['compass','Question','Which makes the most sense?','',3]]));
  L.done();}},
{part:2,src:'Chapter 4 · Choosing Among Alternatives',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">Nadia picks one of the three warehouse options</h1>');
  L.beats(L.card,[
   ['Situation','Theo and the board know Mill Lane is full and that Fellwick needs more space for online orders.'],
   ['Complication','Three options have been discussed for months: move to Quarry Road, rent overflow space near Mill Lane, or hand online orders to a third-party logistics firm.'],
   ['Question','Which one makes the most sense?'],
   ['Key Line, shape 1','If the winner beats the others on every criterion, build the Key Line on the criteria: “It’s cheaper, it’s faster, it’s easier to run.”'],
   ['Key Line, shape 2','If it doesn’t win on everything, make one statement per option: the main reason to choose it, and the main reason each of the others was dropped.'],
   ['If none gives everything','Answer “It depends on what you want”: choose A if you want this, B if you want that. You’re now grouping around different <i>goals</i>, not different solutions.']],
   'Same introduction every time. Only the Key Line changes, and it follows what the analysis found.');}},
{part:2,src:'Chapter 4 · Choosing Among Alternatives',pts:1,run(L){
  L.h(L.kick('pr','Pick the Key Line')+'<h1 class="q">Nadia recommends overflow space. It’s the cheapest and quickest option, but the logistics firm would be easier to run. How should Nadia build the Key Line?</h1>');
  L.mc(L.card,['List what is good about each option equally','Build it on the three criteria: cost, speed, ease','Give the main reason for overflow space, and against each other option'],2,
   'Overflow space doesn’t win on every criterion, so Nadia states the main reason for the choice and the main reason each other option was dropped.',
   'Criteria only work as a Key Line when the winner beats the others on all of them; here it loses on ease. And a neutral list hides the answer. Nadia states the main reason for overflow space and against each of the others.');}},

/* ---------- PART 4: CONSULTING ---------- */
{part:3,src:'Chapter 4 · Some Common Patterns: Consulting',run(L){
  L.h(L.kick('learn','Letters of proposal')+'<h1 class="q">Two ways to open a proposal</h1>'+
   L.prose('Consulting documents are longer and written mainly to get the client to act. They usually answer the first three of the four questions. The most common are proposals and progress reviews. Proposals come in two shapes:')+
   L.lanes([['person','New client','S = you have a problem (a sentence or two)<br>C = you’ve decided to bring in an outsider<br>Q = are you the one to hire?<br><b>A = yes, because:</b> we understand the problem; our approach is sound; we have long experience with it; our terms make sense.',1],
            ['people','Known client, or a formality','S = you have a problem (3–4 paragraphs)<br>C = you want help solving it<br>Q = how will you help?<br><b>Body:</b> built around the approach, with experience woven in. Terms go in a cover letter.',2]])+
   '<p class="small" style="margin-top:10px">The first shape gives a new client room to see the consultant’s expertise in how the problem is explained.</p>');
  L.done();}},
{part:3,src:'Chapter 4 · Letters of Proposal',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Fellwick asks Larkspan Logistics, a logistics firm it has used for years, for a formal proposal to run online orders. How should Larkspan open it?</h1>');
  L.mc(L.card,['Explain the problem in depth, then ask: how will we help?','Describe the problem briefly, then ask: are we the one to hire?'],0,
   'Fellwick knows Larkspan well and the proposal is close to a formality, so the body is built around the approach.',
   'The “are we the one to hire?” shape is for new clients who still need convincing. Fellwick already knows Larkspan, so the problem goes in the introduction and the body explains the approach.');}},
{part:3,src:'Chapter 4 · Letters of Proposal',pts:1,run(L){
  L.h(L.kick('pr','Put in order')+'<h1 class="q">A logistics firm Fellwick has never used writes its first proposal. Put its Key Line points in the usual order.</h1>');
  L.order(L.card,['We understand your late-order problem','We have a sound approach to solving it','We have long experience with that approach','Our fees and terms make sense'],
   'Problem, approach, experience, terms: the four-part answer to “Are you the one we should hire?”.');}},
{part:3,src:'Chapter 4 · Progress Reviews',run(L){
  L.h(L.kick('learn','Progress reviews')+'<h1 class="q">After the first one, every update has the same skeleton</h1>'+
   L.prose('A '+L.g('progress-review','progress review')+' comes at the end of each phase of a project. The first one opens like this:')+
   L.note('S = we have been working on problem X · C = we said step one was to find out whether Y is true, and we have · Q = what did you find?','book')+
   L.prose('The reader reacts. Maybe they ask you to look into something odd you found, or tell you to go on to the next phase. So every later review opens the same way:')+
   L.flow([['book','Situation','Last time we told you X','',1],['pointer','Complication','You asked us to look into Y, and we have','',2],['chat','Question','What did you find?','',3]]));
  L.done();}},
{part:3,src:'Chapter 4 · Progress Reviews',pts:1,run(L){
  L.h(L.kick('pr','Build the opening')+'<h1 class="q">Theo wants monthly click-and-collect updates. Last month, Nadia reported that 3 stores lack counter space; Theo asked Nadia to check whether back offices could be used. Tap the pieces in S-C-Q-A order.</h1>');
  L.order(L.card,['Last month we told you 3 stores lack counter space','You asked us to check the back offices, and we have','What did we find?','Two back offices work; the third store needs a counter'],
   'The first update set the story up. From now on, each month starts from what Theo asked last time.',['S','C','Q','A']);}},
{part:3,src:'Chapter 4 · Some Common Patterns: Consulting',run(L){
  L.h(L.kick('learn','Why the effort pays')+'<h1 class="q">A good introduction shapes how the reader sees everything after it</h1>'+
   L.quote('A good introduction does more than simply gain and hold the reader’s interest.','Barbara Minto')+
   L.list([['eye','It shapes how they see the facts','Any story is a selection of facts. Told as a story, your reading of the situation feels believable, the way a lawyer’s opening statement frames the evidence for a jury.'],
     ['check','It makes your conclusion feel right','The story flow makes the logic seem inevitable, so the reader is less inclined to argue.'],
     ['people','It shows you care','It tells the reader you want them to understand the reality behind the story.']],3));
  L.done();}},
{part:3,src:'Chapter 4 · Some Common Patterns',pts:6,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which pattern fits?',['Directive','Money request','How to','Alternatives','Progress review'],[
   ['Imani needs each store manager to send last winter’s sales by Monday.',0,'Imani is asking people to do something: S = we want X, C = we need you to do Y.'],
   ['Kenji asks Theo for $15,000 to add parcel lockers at two stores.',1,'The reader’s question is “Should I approve?”.'],
   ['Leah explains to store staff how to fix the way they count stock, which keeps going wrong.',2,'A present process that doesn’t work: lay out old and new, and the steps are the differences.'],
   ['Nadia tells the board which of the three warehouse options to take.',3,'The board already knows the options, so the Question is “Which makes most sense?”.'],
   ['Nadia’s note to Theo: “You asked us to check the courier’s spring changes. We have.”',4,'“You asked us to look into Y, which we have done” is the review skeleton.'],
   ['Kenji asks Theo to approve hiring weekend staff at four stores.',1,'Hiring costs money, so the reader must decide whether to approve.']]);}}
  ]
});
</script>
</body>
</html>
