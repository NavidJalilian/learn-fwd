<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How to Build a Pyramid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0003', title:'How to build a pyramid', minutes:18, icon:'pencil',
  goals:['Build a pyramid top down, from Subject to Key Line','Rescue a rambling list of points by working bottom up','Avoid the beginner mistakes the book warns about'],
  parts:['Top down','Bottom up','Caveats'],
  read:'Read chapter 3 of the book for the full soft-drinks memo and the printing-company memo, before and after.',
  glossary:{
    'new-question':'New Question: the question your Main Point raises in the reader’s mind (often “Why?” or “How?”). The Key Line answers it.'
  },
  cheatsheet:[
    'You know more than you think before you write: a Subject, a reader with a Question, and the story that raised it.',
    '<b>Top down:</b> Subject → Question → Answer → Situation → Complication → recheck Question and Answer → '+'New Question → Key Line.',
    'If the Complication doesn’t raise your Question, change the Question, or rethink the Complication.',
    '<b>Bottom up</b> (when you can’t see the point): list all the points → work out how they relate → draw conclusions → think through the introduction.',
    'State the Key Line in the introduction so the reader gets your whole thinking in about 30 seconds. Headings state ideas, never “Findings”.',
    'Always try top down first; don’t dictate a draft “to get it all down”.',
    'The introduction holds the history and only what the reader already accepts as true. The body holds only ideas.',
    'Given a choice, make the Key Line inductive, even if you worked it out deductively.'
  ],
  steps:[
/* ---------- PART 1: TOP DOWN ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Fellwick’s courier has offered to collect parcels from the Mill Lane warehouse twice a day instead of once. Theo asks Nadia for a note on it. Nadia isn’t sure yet what to say. What does Nadia already know for sure?</h1>');
  L.mc(L.card,['The exact wording of each paragraph','Who will read it and what it’s about'],1,
   'Even before writing a single sentence, Nadia knows the reader and the subject. This lesson shows how to build the whole pyramid out of what Nadia already knows.',
   'Wording comes last. What Nadia already knows is the reader (Theo) and the subject (the courier’s offer), and that is enough to start building.');}},
{part:0,src:'Chapter 3 · opening',run(L){
  L.h(L.kick('learn','You know more than you think')+'<h1 class="q">A blank page isn’t really blank</h1>'+
   L.prose('When you sit down to write, you usually know roughly what you’ll write <i>about</i>, but not what you’ll <i>say</i>. The book points out that you still know quite a lot about the finished pyramid:')+
   L.list([['target','A sentence at the top','It will be your '+L.g('main-point','Main Point')+', and its subject will be the '+L.g('subject','Subject')+' of the whole document.'],
     ['chat','It answers a question','The reader already has that question in mind.'],
     ['book','A story raised the question','A '+L.g('situation','Situation')+' the reader knows, then a '+L.g('complication','Complication')+' they also know.']],1)+
   L.prose('You can use that knowledge in two ways: start at the top and work down, or start at the bottom and work up. Top down is usually easier, so <b>try it first</b>.'));
  L.done();}},
{part:0,src:'Chapter 3 · The top-down approach',run(L){
  L.h(L.kick('learn','The top-down approach')+'<h1 class="q">Pull the right points out of your head, one at a time</h1>'+
   L.prose('Don’t start by writing the opening paragraph. Use the parts of the introduction as prompts, in this order:')+
   L.list([['Subject','Draw a box for the top of the pyramid. Write in it what you’re discussing.'],
     ['Question','Picture your reader. What question about the Subject should be answered in their mind when they finish?'],
     ['Answer','Write it down, or at least note that you can answer it.'],
     ['Situation','The first statement about the Subject the reader will agree is true.'],
     ['Complication','The reader nods: “Yes, I know that, so what?” What happened that raised the Question?'],
     ['Recheck','Does the Complication raise the Question you wrote? If not, fix one of them.']],2)+
   '<p class="small" style="margin-top:10px">Then move down: what '+L.g('new-question','New Question')+' does your Answer raise? Its answer is your '+L.g('key-line','Key Line')+'.</p>');
  L.done();}},
{part:0,src:'Chapter 3 · The top-down approach',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">A memo that never answered the question</h1>');
  L.beats(L.card,[
   ['The request','A big burger-chain customer of a soft-drinks company asks to change how it pays: track deliveries itself, then send one disk and one check a month.'],
   ['The memo','The head of accounting is asked whether that’s feasible. Their memo explains, step by step, how the new system <i>would work</i>. It never says yes or no.'],
   ['Top of the box','Run the steps instead. Subject: the customer’s request for change. Question: is it a good idea? Answer: yes.'],
   ['Check it','Situation: they’ve asked for a change. Complication: you asked me if it makes sense. That raises “Does it make sense?”, which matches the Question.'],
   ['Move down','The Answer “yes” raises a New Question: <i>Why?</i> The answer to “Why?” is always reasons. Key Line: it gives us the information we need, it increases our cash flow, and it reduces our workload.']],
   'The method draws out only what answers the reader’s question, and it forces the writer to answer it fully.');}},
{part:0,src:'Chapter 3 · The top-down approach',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Nadia has drawn the box and written the Subject: “the courier’s offer of a second daily collection.” What should Nadia do next?</h1>');
  L.mc(L.card,['Write the opening paragraph of the note','Decide what question Theo wants answered','List every known fact about the courier'],1,
   'Right. Picture the reader and the question about the Subject they want answered. Here: “Should we accept it?”',
   'The next step is the Question: picture Theo and ask what they want answered about the Subject. Writing paragraphs or listing facts comes much later, if at all.');}},
{part:0,src:'Chapter 3 · The top-down approach',pts:1,run(L){
  L.h(L.kick('pr','Put in order')+'<h1 class="q">Tap Nadia’s thinking steps in the order the top-down approach uses them.</h1>');
  L.order(L.card,['Subject: the courier’s offer','Question: should we accept it?','Answer: yes','Situation: the courier offered two collections a day','Complication: Theo asked if we should accept','New Question: why?'],
   'Top of the box first (Subject, Question, Answer), then the introduction to check them, then down to the Key Line.');}},
{part:0,src:'Chapter 3 · The top-down approach',pts:1,
 solve:async L=>{L.$('#cx').children[1].click();},
 run(L){
  const C=[['Online orders keep arriving late','Why are orders late?',false],['Theo asked whether we should accept','Should we accept it?',true],['The courier wants a higher price for it','Is the higher price worth paying?',false]];
  let first=true,done=false;
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Nadia’s Question is “Should we accept the second collection?” Try each Complication and see which question it raises.</h1>'+
   L.note('<b>Situation:</b> The courier has offered to collect from Mill Lane twice a day, not once.','book')+
   '<div id="cx" style="margin-top:12px"></div><div style="background:var(--soft);border-radius:16px;padding:14px;margin:6px 0;min-height:70px"><div class="small">The reader then asks:</div><div id="raise" style="font-weight:600;margin-top:4px">Pick a Complication above.</div></div><div id="cf"></div>');
  C.forEach((c,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=c[0];
    b.onclick=()=>{if(done)return;[...L.$('#cx').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');
      L.$('#raise').innerHTML=(c[2]?L.ic('check'):L.ic('x'))+' “'+c[1]+'”';L.$('#cf').innerHTML='';
      if(first){L.award(c[2]);first=false;}
      if(c[2]){done=true;b.classList.add('ok');L.sheet('ok','It matches','This Complication leads straight to Nadia’s Question, so Nadia’s Question and Answer are confirmed. The book says the whole point of the exercise is to be sure which question you’re answering.');L.done();}
      else L.fb(L.$('#cf'),'<b>That raises a different question.</b> If this really were what happened, Nadia would have to change the Question to the one it raises, or rethink. Try another.','no');};
    L.$('#cx').appendChild(b);});}},
{part:0,src:'Chapter 3 · The top-down approach',pts:1,run(L){
  L.h(L.kick('pr','Find the Key Line')+'<h1 class="q">Nadia’s Main Point: “Yes, we should accept the second collection.” Theo’s New Question is “Why?” Which Key Line fits?</h1>');
  L.mc(L.card,['Ask the courier, compare prices, sign by Friday','Parcels leave sooner, the floor stays clear, cost is unchanged','The courier, the contract, the warehouse floor'],1,
   'The answer to “Why?” is always reasons, and these three are all reasons.',
   'An answer to “Why?” must be a set of reasons. The first option is steps (an answer to “How?”), and the last is just topics.');}},

/* ---------- PART 2: BOTTOM UP ---------- */
{part:1,src:'Chapter 3 · The bottom-up approach',run(L){
  L.h(L.kick('learn','The bottom-up approach')+'<h1 class="q">When you can’t see the top yet</h1>'+
   L.prose('Sometimes your thinking isn’t far enough along. You can’t pin down the Subject, the Question isn’t clear, or you aren’t sure what the reader knows. Then drop to the Key Line. If no Key Line points come to you either, don’t despair. Work up from the bottom in three steps:')+
   L.flow([['list','1 · List','every point you want to make','',1],['cycle','2 · Relate','how the points connect','',2],['bulb','3 · Conclude','what they add up to','',3]])+
   L.prose('Then think through the introduction to choose between the possible conclusions. One tip from the book: look at the recommendations first, because action ideas are easier to judge than situation ideas.'));
  L.done();}},
{part:1,src:'Chapter 3 · The bottom-up approach',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">A young consultant’s memo that rambles</h1>');
  L.beats(L.card,[
   ['The memo','After two weeks at a printing company, a new consultant writes to their manager. Costs, staff shortages, overtime and two vague “conclusions” all tumble out in no clear order.'],
   ['1 · List','Eight problems (low productivity, every job going through the same steps, low wages, staff shortage, high overtime…) and two solutions. The two solutions turn out to say the same thing.'],
   ['2 · Relate','Laid out as cause and effect, the problems form two separate chains: low wages lead to too few staff, then overtime and high costs; identical steps for every job lead to low productivity and high costs.'],
   ['3 · Conclude','Either “costs are high because of low productivity and high overtime”, or “to cut costs, simplify the steps and raise wages”.'],
   ['Introduction','What does the reader already know? That these costs matter, and that the firm’s prices look uncompetitive. So the Question is “Could the costs be cut?” Answer: yes. New Question: how? Key Line: eliminate unnecessary steps, and raise wages to competitive levels.']],
   'The rewrite barely changed the wording. The clarity came from putting the ideas in pyramid order.');}},
{part:1,src:'Chapter 3 · The bottom-up approach',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Kenji, Fellwick’s regional manager, has notes from store visits but can’t see the point yet. What should Kenji do first?</h1>');
  L.mc(L.card,['Choose headings for the main sections','Guess a Main Point and defend it','List every point to be made'],2,
   'Step one of bottom up: get all the points down in a list. Relationships and conclusions come next.',
   'When you can’t see the point, don’t force a top or pick headings. Start bottom up: list every point, then work out how they relate.');}},
{part:1,src:'Chapter 3 · The bottom-up approach',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">Kenji rebuilds the email to Theo, bottom up</h1>');
  L.beats(L.card,[
   ['The email','“Eleven things I noticed on my store visits.” Friday deliveries arrive mid-afternoon. Boots run out by Saturday. Staff unpack boxes in the busy hours. Weekend overtime is over budget. And so on.'],
   ['1 · List','Problems: the warehouse picks store orders after online orders; Friday deliveries arrive mid-afternoon; stock isn’t on the shelves for Saturday; customers leave without buying; stores are short of weekend staff; staff unpack in busy hours; overtime is over budget.'],
   ['2 · Relate','Two chains appear. <b>Stock:</b> store orders picked last → late Friday deliveries → empty shelves on Saturday → lost sales. <b>Staff:</b> too few weekend staff → unpacking in busy hours → overtime over budget.'],
   ['3 · Conclude','Each chain points to a fix: pick store orders first on Fridays, and fill the open weekend jobs.'],
   ['Introduction','Situation: Saturday is the stores’ busiest day. Complication: shelves run empty and overtime is over budget. Question: can we fix it? Answer: yes. New Question: how? Key Line: pick store orders before online orders on Fridays, and fill the open weekend jobs.']],
   'Same facts as the eleven-point list, but now Theo sees the point and both actions in the first lines.');}},
{part:1,src:'Chapter 3 · The bottom-up approach',pts:1,run(L){
  L.h(L.kick('pr','Work out the relationships')+'<h1 class="q">Kenji’s stock chain is scrambled. Tap the points from cause to final effect.</h1>');
  L.order(L.card,['The warehouse picks store orders after online orders','Friday deliveries reach stores mid-afternoon','Boots and jackets aren’t on shelves for Saturday','Saturday customers leave without buying'],
   'Laid out as cause and effect, the chain shows where to act: at the start, by picking store orders first.',['Cause','Then','Then','Effect']);}},
{part:1,src:'Chapter 3 · The bottom-up approach',pts:1,run(L){
  L.h(L.kick('pr','The 30-second test')+'<h1 class="q">Theo reads only the first few lines on their phone. Where should Kenji state the two Key Line points?</h1>');
  L.mc(L.card,['In the introduction, right after the Main Point','In a closing section headed “Conclusions”','Only as headings further down the email'],0,
   'The book says the introduction should include the Key Line, so the reader gets your whole thinking in about 30 seconds. If they can’t, rewrite.',
   'If the Key Line waits until the end or hides in headings, Theo misses it. State it in the introduction so Theo has the whole thinking in about 30 seconds, and can skip the rest if they trust it.');}},
{part:1,src:'Chapter 3 · The bottom-up approach',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Does this heading help a scanning reader?',['Yes, it states an idea','No, it’s just a category'],[
   ['“Findings”',1,'The book says never use a heading like “Findings”: it tells a scanning reader nothing.'],
   ['“Picking store orders first fixes Saturday gaps”',0,'It states the point of the section, so the reader can find it at a glance.'],
   ['“Conclusions”',1,'Another category. The reader still has to read on to learn what was concluded.'],
   ['“Filling weekend jobs cuts overtime”',0,'It reflects the idea, not the category.']]);}},

/* ---------- PART 3: CAVEATS ---------- */
{part:2,src:'Chapter 3 · Caveats for beginners',run(L){
  L.h(L.kick('learn','Caveats for beginners, 1–3')+'<h1 class="q">Plan first, before the words fall in love with you</h1>'+
   L.list([['Always try top down first','Don’t dictate the whole document “to get it all down” and plan to fix the structure later. Once an idea is written, it looks far better than it is.'],
     ['Start your thinking with the Situation','When you write, you can put Situation, Complication, Question and Answer in any order to set the tone. But think them through starting from the Situation: you’ll find the right Complication and Question more easily.'],
     ['Don’t skip the introduction','Even when the Main Point is obvious, think the introduction through. Skip it and you end up stuffing background into the body as a clumsy chain of “because… therefore…”.']],1)+
   L.quote('It appears to have been chiseled in gold.','Barbara Minto, on a first draft'));
  L.done();}},
{part:2,src:'Chapter 3 · Caveats for beginners',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Nadia plans to dictate the whole warehouse report “to get it all down”, then fix the structure afterwards. What’s the risk?</h1>');
  L.mc(L.card,['Nadia will grow attached to a draft whose thinking is disjointed','The report will come out too short for the board','Dictating takes longer than typing the report'],0,
   'Once it’s written, the draft looks finished, so Nadia won’t want to change it. Plan top down first.',
   'The book’s worry isn’t length or speed. A written draft looks far better than it is, so Nadia won’t want to restructure it. Plan top down first.');}},
{part:2,src:'Chapter 3 · Caveats for beginners',run(L){
  L.h(L.kick('learn','Caveats for beginners, 4–5')+'<h1 class="q">What goes in the introduction, and what goes in the body</h1>'+
   L.lanes([['book','Introduction','The history: what happened, in time order. Only things the reader knows, or would accept as true because anyone could easily check them.',1],
            ['layers','Body (the pyramid)','Only ideas: new thinking that raises a question. Events can appear only as cause and effect you worked out by analysis.',2]])+
   L.prose('Mixing them up breaks the pyramid. Put something the reader <i>doesn’t</i> know in the introduction and you distort their Question. Use something they <i>do</i> know to answer a question lower down, and it means you left it out of the introduction, which would have led them to a different Question.'));
  L.done();}},
{part:2,src:'Chapter 3 · Caveats for beginners',pts:5,run(L){
  L.h(L.kick('pr','Introduction or body?')+'<h1 class="q">Nadia is writing to Theo about late online orders. Where does each item belong?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Introduction','Body'],[
   ['Late orders rose from 4% to 15% this year, as Theo’s monthly figures show',0,'Theo knows it and can check it. It belongs in the Situation or Complication.'],
   ['The courier contract changed in spring',0,'Plain history the reader already knows goes in the introduction.'],
   ['Nadia’s new finding: pickers lose time walking around full aisles',1,'It’s new to Theo and came from analysis, so it’s an idea for the body.'],
   ['Theo asked Nadia last week what to do about it',0,'That’s the Complication that raises the Question.'],
   ['Overflow space near Mill Lane would ease picking at peak times',1,'It’s new thinking that raises “Why?” or “How?”, so it’s in the pyramid.']],
   'Known and checkable: introduction. New thinking: body. Getting this right keeps the Question true to what the reader is really asking.');}},
{part:2,src:'Chapter 3 · Caveats for beginners',pts:1,
 solve:async L=>{const g=L.$('#tg').children;g[0].click();g[1].click();},
 run(L){
  const V=[
   L.flow([['list','Criteria','We judge warehouses on three criteria','',1],['check','Fit','This building meets them','',2],['arrow','So','Therefore, buy it','',3]]),
   L.tiers([['home','Buy the Pacific Avenue warehouse, because it meets our criteria','','',true],['check','It’s on a corner',''],['check','It’s larger than 5,000 square feet',''],['check','It costs under $10 a square foot','']])];
  const T=['Deductive Key Line','Inductive Key Line'],N=['The reader has to hold step one in mind to follow step two, and the last box raises no question at all. The book calls this overstructured.','The reasons sit side by side under one top point. Easier to take in, same message.'];const seen=new Set();
  L.h(L.kick('pr','Toggle and compare')+'<h1 class="q">Caveat 6: given a choice, use induction on the Key Line. Look at the book’s warehouse example both ways.</h1><div id="tg"></div><div id="tv" style="margin:6px 0"></div><div class="small" id="tn"></div><div id="tq"></div>');
  T.forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=n;b.onclick=()=>{[...L.$('#tg').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(j);
    L.$('#tv').innerHTML=V[j];L.$('#tn').innerHTML=N[j];
    if(seen.size===2&&!L.$('#tq').innerHTML){const q=L.$('#tq');q.innerHTML='<h2 class="sub">Nadia worked out the case for overflow space step by step: peak stock needs more room, Mill Lane has none spare, so rent nearby. How should the Key Line read?</h2>';
      L.mc(q,['Keep it as a chain, in the order it was reasoned','Rent overflow space, because it meets our needs','Drop the reasons and give the decision only'],1,
       'You can work it out deductively and still present it inductively. The book notes most deductive thinking can be turned this way.',
       'The order you reasoned in isn’t the order the reader needs, and dropping the reasons leaves Theo asking “Why?”. State the point with its reasons side by side.');}};L.$('#tg').appendChild(b);});}},
{part:2,src:'Chapter 3 · Caveats for beginners',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which caveat is being broken?',['Try top down first','Think the introduction through','History goes in the introduction','Intro holds only what’s accepted','Prefer induction on the Key Line'],[
   ['Nadia knows the Main Point, jumps straight to the Key Line, and ends up arguing background facts in a long “because… therefore…” chain.',1,'Sorting out the introduction first would have taken that background out of the body.'],
   ['A section in the body of Nadia’s report is titled “What happened this spring” and lists events in date order.',2,'Plain history belongs in the introduction. The body can hold only ideas.'],
   ['Kenji opens an email with figures from a survey Theo has never seen, then states the Question.',3,'New information in the introduction distorts the reader’s Question. Keep it to what they know or would accept.'],
   ['Kenji writes a first draft straight through, planning to “sort out the structure later”.',0,'A finished-looking draft is hard to give up. Plan top down first.'],
   ['Nadia’s Key Line reads: our criteria are A, B and C; the overflow unit meets them; therefore, take it.',4,'That chain is overstructured. State the point with the reasons side by side.']]);}}
  ]
});
</script>
</body>
</html>
