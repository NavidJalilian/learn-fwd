/* ======================================================================
   Lesson-only pieces. The pyramid builder (PB) is the signature
   interactive: idea cards go into the boxes of a pyramid, every box is
   checked against the book's rules, and a live chat shows what the
   reader hears. A second interactive (the chain board) is on the

const PBCSS='<style>'+

'.pb-intro{border:1.5px dashed var(--line2);border-radius:14px;padding:8px;display:grid;gap:6px}'+

const KIND={reason:'reasons',step:'steps'};
const NEED={'Why?':'reason','How?':'step'};
const LAB={S:'Situation',C:'Complication',Q:'Question',A:'Main Point (the Answer)',K1:'Key Line',K2:'Key Line',K3:'Key Line'};
const cap=t=>t.charAt(0).toUpperCase()+t.slice(1);
function sc(o){Object.keys(o.cards).forEach(k=>o.cards[k].id=k);o.ks=o.ks||['K1','K2','K3'];return o;}

/* judge every box against the book's rules */
function pbJudge(S_,st){
  const g=k=>st[k]?S_.cards[st[k]]:null,R=S_.R,ks=S_.ks;
  const S=g('S'),C=g('C'),Q=g('Q'),A=g('A'),r={};
  r.S=!S?null:S.k==='s'?(S.known===false?['no','New to '+R+'. A fact the reader doesn’t know distorts their Question.']:['ok',cap(R)+' already knows this.']):S.k==='c'?['no','This is what happened to raise the Question: a Complication.']:['no','Not something '+R+' already accepts as true.'];
  const rc=C&&C.k==='c'?C:null;
  r.C=!C?null:!rc?['no','Nothing happens here that would raise a question.']:(Q&&Q.k==='q'&&C.q!==Q.id)?['no','It makes '+R+' ask “'+C.rq+'”, not your Question.']:['ok','It raises '+R+'’s Question.'];
  r.Q=!Q?null:Q.k!=='q'?['no','Not a question.']:(rc&&rc.q!==Q.id)?['no','The Complication raises a different question. Change one of them.']:['ok','The question '+R+' wants answered.'];
  const target=Q&&Q.k==='q'?Q.id:rc?rc.q:null;
  r.A=!A?null:A.k!=='a'?['no','That doesn’t answer the Question.']:A.blank?['no','It describes, but never answers the Question.']:(target&&A.q!==target)?['no','It answers a different question.']:['ok','It answers the Question.'];
  const nq=r.A&&r.A[0]==='ok'?A.nq:null,need=nq?NEED[nq]:null;
  const ps=ks.map(g).filter(x=>x&&x.k==='p'&&x.kind!=='topic');
  let maj=need;if(!maj&&ps.length){const n={};ps.forEach(p=>n[p.kind]=(n[p.kind]||0)+1);maj=Object.keys(n).sort((a,b)=>n[b]-n[a])[0];}
  ks.forEach(k=>{const x=g(k);r[k]=!x?null:
    x.k==='s'?(x.known===false?['no','New, but it doesn’t answer '+(nq?'“'+nq+'”':'the question')+'.']:['no',cap(R)+' already knows this. Facts and history belong in the introduction; the body holds only ideas.']):
    x.k!=='p'?['no','Not a point that answers the New Question.']:
    x.kind==='topic'?['no','Just a topic. It states no idea, so it answers nothing.']:
    (maj&&x.kind!==maj)?['no',need?(x.kind==='step'?'A step answers “How?”, not “'+nq+'”.':'A reason answers “Why?”, not “'+nq+'”.'):'A different kind of idea from the others.']:
    ['ok',need?'Answers “'+nq+'”.':'Same kind as the others.'];});
  const kinds=[...new Set(ks.map(g).filter(Boolean).map(x=>x.k==='p'?x.kind:'x'))];
  r.noun=ks.every(k=>st[k])&&kinds.length===1&&KIND[kinds[0]]&&ks.every(k=>r[k][0]==='ok')?KIND[kinds[0]]:null;
  r.mixed=ks.filter(k=>st[k]).length>1&&kinds.length>1;
  r.nq=nq;r.rq=rc?rc.rq:null;r.rqid=rc?rc.q:null;
  r.all=['S','C','Q','A'].concat(ks).every(k=>r[k]&&r[k][0]==='ok');
  return r;}

/* what the reader hears, line by line */
function pbTalk(S_,st,r){
  const g=k=>st[k]?S_.cards[st[k]]:null,out=[],w=t=>out.push(['w',t]),rd=(t,c)=>out.push(['r',t,c||'']);
  const S=g('S'),C=g('C'),A=g('A');
  if(!S&&!C&&A)rd('No introduction? I’m not sure what question this answers.','bad');
  if(S){w(S.t);rd(r.S[0]==='ok'?'Yes, I know that. So what?':S.known===false?'Hang on, I didn’t know that. Where’s it from?':'Is that something I already know?',r.S[0]==='ok'?'':'bad');}
  if(C){w(C.t);rd(C.k==='c'?C.rq:'So what’s the problem?',C.k==='c'?'':'bad');}
  if(!A)return out;
  w(A.t);
  if((S||C)&&!C){rd('Wait, what question are you answering?','bad');return out;}
  if(r.A[0]!=='ok'){rd(A.blank?'Fine, but you haven’t answered me.'+(r.rq?' '+r.rq:''):'That answers a question I didn’t ask.','bad');return out;}
  if(r.rqid&&A.q!==r.rqid){rd('That answers a question I didn’t ask. I asked: '+r.rq,'bad');return out;}
  rd(r.nq);
  const pts=S_.ks.map(g).filter(Boolean);if(!pts.length)return out;
  w(pts.map(p=>'• '+p.t).join('<br>'));
  if(pts.length<S_.ks.length)return out;
  const bad=S_.ks.filter(k=>r[k][0]!=='ok');
  if(bad.some(k=>g(k).k==='s'&&g(k).known!==false))rd('I know that already. Why tell me again?','bad');
  else if(bad.length)rd('Some of those don’t answer my “'+r.nq+'”.','bad');
  else if(!r.all)rd('The points work, but the opening threw me.','bad');
  else rd(S_.end||'Clear. I have your whole thinking.','good');
  return out;}

/* render a pyramid into host. o: {id, st, lock[], tray[], talk, msgs, mute, after(k,r)} */
function PB(host,S_,o){
  o=o||{};const ks=S_.ks,id=o.id||'pb',st={S:null,C:null,Q:null,A:null};ks.forEach(k=>st[k]=null);Object.assign(st,o.st||{});
  const lock=new Set(o.lock||[]);let arm=null,frozen=false,last=null;
  const slot=k=>'<button type="button" class="pb-s" data-s="'+k+'" id="'+id+'-'+k+'"></button>';
  const path=ks.length===3?'M150 0V9M50 9H250M50 9V18M150 9V18M250 9V18':'M150 0V9M75 9H225M75 9V18M225 9V18';
  host.innerHTML='<div class="pb">'+(S_.subj?'<p class="pb-subj">Subject: <b>'+S_.subj+'</b>'+(o.tray?'<br>Tap a box to choose a card for it.':'')+'</p>':'')+
    '<div class="pb-intro"><div class="pb-cap" style="margin:0">Introduction</div>'+slot('S')+slot('C')+slot('Q')+'</div>'+
    '<div class="pb-stem"></div><div class="pb-top">'+slot('A')+'</div><div class="pb-nq" id="'+id+'-nq"></div>'+
    '<svg viewBox="0 0 300 18" preserveAspectRatio="none" style="width:100%;height:18px;display:block" aria-hidden="true"><path d="'+path+'" stroke="var(--line2)" stroke-width="2" fill="none" vector-effect="non-scaling-stroke"/></svg>'+
    '<div class="pb-kl" style="grid-template-columns:repeat('+ks.length+',minmax(0,1fr))">'+ks.map(slot).join('')+'</div>'+
    '<div class="pb-noun" id="'+id+'-noun"></div>'+
    '<div class="pb-pick" id="'+id+'-pick" hidden></div>'+
    (o.msgs===false?'':'<div class="pb-msgs" id="'+id+'-msgs"></div>')+
    (o.talk===false?'':'<div class="pb-rv"><div class="pb-cap">What '+S_.R+' hears</div><div id="'+id+'-rv" aria-live="polite"></div></div>')+'</div>';
  const $=s=>host.querySelector(s);
  function draw(){
    const r=pbJudge(S_,st);
    ['S','C','Q','A'].concat(ks).forEach(k=>{const b=$('#'+id+'-'+k),c=st[k]?S_.cards[st[k]]:null,v=r[k];
      b.className='pb-s'+(!c?' e':o.mute?'':' '+v[0])+(arm===k?' arm':'')+(lock.has(k)||!o.tray?' lk':'')+(k===last?' pop':'');
      b.innerHTML='<span class="pb-l">'+LAB[k]+(c&&!o.mute?(v[0]==='ok'?' ✓':' ✗'):'')+'</span>'+(c?c.t:(o.tray&&!lock.has(k)?'Tap to choose':'…'));
      b.setAttribute('aria-label',LAB[k]+': '+(c?c.t+(o.mute?'':v[0]==='ok'?' (passes)':' (broken: '+v[1]+')'):'empty'));});
    last=null;
    $('#'+id+'-nq').innerHTML=r.nq&&!o.mute?'↓ '+cap(S_.R)+' asks: <b>'+r.nq+'</b>':'';
    $('#'+id+'-noun').innerHTML=o.mute?'':r.noun?'<span style="color:var(--ok)">One kind of idea: <b>'+r.noun+'</b></span>':r.mixed?'<span style="color:var(--no)">Mixed kinds: no single plural noun fits</span>':'';
    
    const m=$('#'+id+'-msgs');if(m&&!o.mute){const bad=['S','C','Q','A'].concat(ks).filter(k=>r[k]&&r[k][0]==='no');
      m.innerHTML=bad.map(k=>'<div style="color:var(--no)"><b>'+LAB[k].replace(' (the Answer)','')+':</b> '+r[k][1]+'</div>').join('')+(r.all?'<div style="color:var(--ok)"><b>Every box passes.</b></div>':'');}
    const rv=$('#'+id+'-rv');if(rv){const t=o.mute?[]:pbTalk(S_,st,r);rv.innerHTML=t.length?t.map(x=>'<div class="pb-b '+x[0]+(x[2]?' '+x[2]:'')+'"><small>'+(x[0]==='w'?S_.W:S_.R)+'</small>'+x[1]+'</div>').join(''):'<div class="small" style="padding:4px 2px 8px">'+(o.empty||'Nothing yet. Place cards to start the conversation.')+'</div>';}
    return r;}
  function put(k,c){Object.keys(st).forEach(x=>{if(st[x]===c)st[x]=null;});st[k]=c;last=k;}
  const $p=()=>$('#'+id+'-pick');
  function closePick(){const p=$p();p.hidden=true;p.innerHTML='';}
  function openPick(k){const p=$p(),used=Object.values(st),av=o.tray.filter(c=>!used.includes(c));
    p.innerHTML='<div class="pb-cap">Choose a card for the '+LAB[k].replace(' (the Answer)','')+'</div><div class="pb-tray">'+av.map(c=>'<button type="button" class="chip" data-c="'+c+'">'+S_.cards[c].t+'</button>').join('')+'</div>'+
      '<div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">'+(st[k]?'<button type="button" class="btn" data-x="rm">Take card out</button>':'')+'<button type="button" class="btn" data-x="no">Cancel</button></div>';
    p.hidden=false;(k[0]==='K'?$('.pb-kl'):$('#'+id+'-'+k)).after(p);if(p.scrollIntoView)p.scrollIntoView({block:'nearest',behavior:'smooth'});}
  host.onclick=e=>{if(frozen||!o.tray)return;const c=e.target.closest('[data-c]'),s=e.target.closest('[data-s]'),x=e.target.closest('[data-x]');
    if(c&&arm){const k=arm;arm=null;put(k,c.dataset.c);closePick();const r=draw();if(o.after)o.after(k,r);return;}
    if(x){const k=arm;arm=null;closePick();if(x.dataset.x==='rm'&&k){st[k]=null;const r=draw();if(o.after)o.after(k,r);}else draw();return;}
    if(s){const k=s.dataset.s;if(lock.has(k))return;if(arm===k){arm=null;closePick();draw();return;}arm=k;openPick(k);draw();}};
  draw();
  return {st,draw,set(x){Object.assign(st,x);return draw();},judge:()=>pbJudge(S_,st),freeze(v){frozen=v;}};}

/* autoplay helper: place cards through the real controls */
async function pbPlace(L,id,pairs){for(const [k,c] of pairs){L.$('#'+id+'-'+k).click();L.$('#'+id+'-pick [data-c="'+c+'"]').click();await L.sleep(5);}}

/* small pyramid sketch used on the two opening Learn screens */
function MINI(id){
  const box=(gid,x,y,w,h,t1,t2,cls)=>'<g id="'+id+'-'+gid+'"'+(cls?' class="'+cls+'"':'')+'><rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="9"/><text x="'+(x+w/2)+'" y="'+(y+(t2?h/2-2:h/2+4))+'" text-anchor="middle">'+t1+'</text>'+(t2?'<text class="sm" x="'+(x+w/2)+'" y="'+(y+h/2+13)+'" text-anchor="middle">'+t2+'</text>':'')+'</g>';
  return '<svg class="mn" viewBox="0 0 320 250" role="img" aria-label="A pyramid: an introduction (Situation, Complication, Question) leads to the Main Point, with Key Line points below it.">'+
   '<g id="'+id+'-sc">'+box('s',4,8,96,44,'Situation','reader knows')+box('c',112,8,96,44,'Complication','reader knows')+
   '<path class="ln" d="M100 30H112M208 30H220"/></g>'+
   '<g id="'+id+'-qq">'+box('q',220,8,96,44,'Question','in reader’s mind')+'<path class="ln" d="M268 52V66H160V80"/></g>'+
   '<g id="'+id+'-tp">'+box('top',60,80,200,48,'Main Point','Answer to the Question')+'</g>'+
   '<g id="'+id+'-sp"><rect x="62" y="133" width="196" height="15" rx="4" style="stroke:none;fill:var(--card)"/><text class="sm" x="160" y="144" text-anchor="middle">its subject = the document’s Subject</text></g>'+
   '<g id="'+id+'-kk" class="dash"><path class="ln" d="M160 128V150M55 150H265M55 150V160M160 150V160M265 150V160"/>'+box('k1',12,160,86,34,'Key Line')+box('k2',117,160,86,34,'Key Line')+box('k3',222,160,86,34,'Key Line')+'</g>'+
   '<g id="'+id+'-lw" class="dash"><path class="ln" d="M55 194V206M160 194V206M265 194V206"/>'+
     [12,57,117,162,222,267].map((x,j)=>'<rect x="'+x+'" y="206" width="41" height="26" rx="7"/>').join('')+
     '<text class="sm" x="160" y="246" text-anchor="middle">support points</text></g></svg>';}

  id:'0003', title:'How to build a pyramid', minutes:20, icon:'pencil',
  goals:['Build a pyramid top down, from Subject to Key Line','Rescue a rambling list of points by working bottom up','Avoid the beginner mistakes the book warns about'],
  parts:['Top down','Bottom up','Caveats'],
  read:'Read chapter 3 of the book for the full soft-drinks memo and the printing-company memo, before and after.',
  glossary:{
    'new-question':'New Question: the question your Main Point raises in the reader’s mind (often “Why?” or “How?”). The Key Line answers it.'
  },
  cheatsheet:[
    'You know more than you think before you write: a sentence at the top, a reader with a Question, and the story that raised it.',
    '<b>Top down:</b> Subject → Question → Answer → Situation → Complication → recheck Question and Answer → New Question → Key Line.',
    'If the Complication doesn’t raise your Question, change the Question, or rethink the Complication.',
    'The New Question sets the kind of point on the Key Line: “Why?” always needs reasons; “How?” needs steps. One kind, one plural noun.',
    '<b>Bottom up</b> (when you can’t see the point): list all the points → work out how they relate → draw conclusions → think through the introduction to choose.',
    'State the Key Line in the introduction so the reader gets your whole thinking in about 30 seconds. Headings state ideas, never “Findings”.',
    'Always try top down first. The introduction holds the history and only what the reader accepts as true; the body holds only ideas.',
    'Given a choice, make the Key Line inductive, even if you worked it out deductively.'
  ],

/* ---------- PART 1: TOP DOWN ---------- */

{part:0,src:'Chapter 3 · The top-down approach',

{part:1,src:'Chapter 3 · The bottom-up approach',pts:1,
 solve:async L=>{for(const [a,b] of [['a','b'],['b','c'],['c','d'],['e','f'],['f','g']]){L.$('#cb [data-p="'+a+'"]').click();L.$('#cb [data-p="'+b+'"]').click();await L.sleep(5);}},
 run(L){
  const P={a:['The warehouse picks store orders after online orders','b',1],b:['Friday deliveries reach stores mid-afternoon','c',1],c:['Boots and jackets aren’t on shelves for Saturday','d',1],d:['Saturday customers leave without buying',null,1],
    e:['Stores are short of weekend staff','f',2],f:['Staff unpack boxes in the busy hours','g',2],g:['Weekend overtime is over budget',null,2]};
  const order=['c','e','a','g','b','f','d'],links={};let sel=null,miss=0,fin=false;
  L.h(PBCSS+L.kick('pr','Work out the relationships')+'<h1 class="q">Kenji’s notes, listed. Tap a cause, then the point it leads to. Link them all.</h1>'+
   '<div id="cb" style="display:grid;gap:6px"></div><div id="cm" style="min-height:8px"></div><div class="pb-cap" style="margin-top:14px">Chains so far</div><div id="cc"></div>');
  const inc=x=>Object.keys(links).find(k=>links[k]===x);
  function draw(){
    L.$('#cb').innerHTML=order.map(k=>{const used=links[k]||inc(k),col=P[k][2]===1?'h1':'h2';
      return '<button type="button" class="chip" data-p="'+k+'" style="margin:0;text-align:left;justify-content:flex-start;min-height:40px'+(sel===k?';border-color:var(--pri);background:var(--pri-bg)':used?';border-color:var(--'+col+');background:var(--'+col+'-bg)':'')+'">'+(sel===k?'<b>Cause:</b> ':'')+P[k][0]+'</button>';}).join('');
    const roots=Object.keys(links).filter(k=>!inc(k));
    L.$('#cc').innerHTML=roots.length?roots.map(r=>{const ch=[r];let x=r;while(links[x]){x=links[x];ch.push(x);}const col=P[r][2]===1?'h1':'h2';
      return '<div style="border-left:4px solid var(--'+col+');background:var(--'+col+'-bg);border-radius:10px;padding:8px 10px;margin-bottom:8px;font-size:13.5px;line-height:1.45">'+ch.map(k=>P[k][0]).join('<br><span style="color:var(--'+col+');font-weight:700">↓</span><br>')+'</div>';}).join(''):'<p class="small">No links yet.</p>';}
  draw();
  L.$('#cb').onclick=e=>{const b=e.target.closest('[data-p]');if(!b||fin)return;const k=b.dataset.p;L.$('#cm').innerHTML='';
    if(!sel){if(!P[k][1]){L.fb(L.$('#cm'),'“'+P[k][0]+'” is a final effect: nothing else on the list follows from it. Pick a cause first.','info');return;}
      if(links[k]){L.fb(L.$('#cm'),'Already linked. Pick another cause.','info');return;}sel=k;draw();return;}
    if(k===sel){sel=null;draw();return;}
    if(P[sel][1]===k){links[sel]=k;sel=null;draw();
      if(Object.keys(links).length===5){fin=true;L.award(miss===0);
        L.sheet(miss===0?'ok':'info',miss===0?'Two clean chains':'Both chains found','Kenji’s list hides two separate lines of reasoning. <b>Stock:</b> store orders picked last, so Friday deliveries arrive late, shelves are empty on Saturday, and sales walk out. <b>Staff:</b> too few weekend staff, so unpacking eats the busy hours, and overtime runs over budget. Each chain starts where Kenji can act, and that gives the conclusions: pick store orders first on Fridays; fill the open weekend jobs.');L.done();}}
    else{miss++;const back=P[k][1]===sel;L.fb(L.$('#cm'),back?'<b>Backwards.</b> “'+P[k][0]+'” comes first and leads to “'+P[sel][0]+'”.':'<b>Not a direct link.</b> Ask: what does “'+P[sel][0]+'” lead to straight away?','no');L.shake(b);sel=null;draw();}};}},

{part:1,src:'Chapter 3 · The bottom-up approach',pts:1,
 solve:async L=>{L.$('#kp').children[0].click();L.$('#hp').children[1].click();L.$('#pck').click();},
 run(L){
  let kl=1,hd=0,first=true;
  L.h(PBCSS+L.kick('pr','The 30-second test')+'<h1 class="q">Theo reads Kenji’s email on their phone and stops after about 30 seconds. Set it up so Theo gets Kenji’s whole thinking, and can find each section by its heading.</h1>'+
   '<div class="pb-cap">Where is the Key Line?</div><div id="kp"></div><div class="pb-cap">Section headings</div><div id="hp"></div>'+
   '<div id="ph" style="border:2px solid var(--line2);border-radius:22px;padding:12px 12px 6px;margin-top:6px;background:var(--bg);font-size:13.5px;line-height:1.45"></div>'+
   '<div id="po" style="font-size:14px;line-height:1.6;margin-top:10px"></div><button type="button" class="btn pri" id="pck" style="margin-top:10px">'+L.ic('check')+'Check</button><div id="pf"></div>');
  const chips=(host,opts,get,set)=>opts.forEach((t,j)=>{const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=t;b.onclick=()=>{set(j);draw();};L.$(host).appendChild(b);});
  chips('#kp',['In the introduction','In a closing “Conclusions” section'],()=>kl,v=>kl=v);
  chips('#hp',['“Findings” and “Staffing”','The two Key Line points'],()=>hd,v=>hd=v);
  const KL='Two changes will fix it: pick store orders first on Fridays, and fill the open weekend jobs.';
  function H(t){return '<div style="font-weight:700;margin-top:2px">'+t+'</div>';}
  function draw(){
    [...L.$('#kp').children].forEach((b,j)=>b.classList.toggle('sel',j===kl));[...L.$('#hp').children].forEach((b,j)=>b.classList.toggle('sel',j===hd));
    const h=hd?['Pick store orders first on Fridays','Fill the open weekend jobs']:['Findings','Staffing'];
    const B=['<div class="small" style="margin-bottom:4px">From: Kenji · To: Theo</div>Saturday is our stores’ busiest day. But shelves keep running empty, and weekend overtime is over budget. Can we fix it? Yes.'];
    if(kl===0)B.push('<b>'+KL+'</b>');
    B.push(H(h[0])+'The warehouse picks store orders after online orders, so Friday deliveries reach stores mid-afternoon…');
    B.push(H(h[1])+'Stores are short of weekend staff, so boxes get unpacked in the busy hours…');
    if(kl===1)B.push(H('Conclusions')+KL);
    L.$('#ph').innerHTML=B.map((b,j)=>(j===2?'<div style="border-top:2px dashed var(--no-line);margin:8px 0 6px;font-size:11px;font-weight:700;color:var(--no);text-transform:uppercase;letter-spacing:.05em;padding-top:3px">About 30 seconds · Theo stops here</div>':'')+'<div style="margin-bottom:8px;'+(j>=2?'opacity:.4':'')+'">'+b+'</div>').join('');
    L.$('#po').innerHTML='<div style="color:var(--'+(kl===0?'ok':'no')+')">'+(kl===0?'✓ In 30 seconds Theo gets the Main Point <b>and</b> the Key Line.':'✗ In 30 seconds Theo gets the Main Point, but not how to fix it.')+'</div><div style="color:var(--'+(hd?'ok':'no')+')">'+(hd?'✓ Each heading states its idea, so Theo can scan to it.':'✗ “Findings” tells a scanning reader nothing.')+'</div>';}
  draw();
  L.$('#pck').onclick=()=>{const ok=kl===0&&hd===1;L.$('#pf').innerHTML='';if(first){L.award(ok);first=false;}
    if(ok){L.$('#pck').disabled=true;L.sheet('ok','Whole thinking, first 30 seconds','The book says the introduction should include the Key Line points, so the reader gets your entire thinking in about 30 seconds and can trust nothing will surprise them later. If they can’t, rewrite. And word headings as ideas, never “Findings” or “Conclusions”.');L.done();}
    else L.fb(L.$('#pf'),kl!==0?'<b>Theo stops before the Key Line.</b> Move it into the introduction, right after the Main Point.':'<b>The headings are categories.</b> Make each one state its point.','no');};}},

/* ---------- PART 3: CAVEATS ---------- */
{part:2,src:'Chapter 3 · Caveats for beginners',run(L){
  L.h(L.kick('learn','Caveats for beginners, 1–3')+'<h1 class="q">Plan first, before the words fall in love with you</h1>'+
   L.list([['Always try top down first','Don’t dictate the whole document “to get it all down” and plan to fix the structure later. Once an idea is written, it looks far better than it is.'],
     ['Start your thinking with the Situation','When you write, you can put Situation, Complication, Question and Answer in any order to set the tone. But think them through starting from the Situation: you’ll find the right Complication and Question more easily.'],
     ['Don’t skip the introduction','Even when the Main Point is obvious, think the introduction through. Skip it and background ends up in the body as a clumsy deductive chain of “because… therefore…”.']],1)+
   L.quote('It appears to have been chiseled in gold.','Barbara Minto, on a first draft'));
  L.done();}},

{part:2,src:'Chapter 3 · Caveats for beginners',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Nadia plans to dictate the whole warehouse report “to get it all down”, then fix the structure afterwards. What’s the risk?</h1>');
  L.mc(L.card,['Nadia will grow attached to a draft whose thinking is disjointed','The report will come out too short for the board','Dictating takes longer than typing the report'],0,
   'Once it’s written, the draft looks finished, so Nadia won’t want to change it. Plan top down first.',
   'The book’s worry isn’t length or speed. A written draft looks far better than it is, so Nadia won’t want to restructure it. Plan top down first.');}},

{part:2,src:'Chapter 3 · Caveats for beginners',run(L){
  L.h(L.kick('learn','Caveats for beginners, 4–5')+'<h1 class="q">What goes in the introduction, and what goes in the body</h1>'+
   L.lanes([['book','Introduction','The history: what happened. Only what the reader knows, or would accept as true because anyone could easily check it.',1],
            ['layers','Body (the pyramid)','Only ideas: new thinking that raises a question. Events appear only as cause and effect you worked out by analysis.',2]])+
   L.prose('Put something the reader <i>doesn’t</i> know in the introduction and you distort their Question. Use something they <i>do</i> know to answer a question lower down, and you left it out of the introduction, which would have led them to a different Question.'));
  L.done();}},

{part:2,src:'Chapter 3 · Caveats for beginners',pts:5,run(L){
  L.h(L.kick('pr','Introduction or body?')+'<h1 class="q">Nadia is writing to Theo about late online orders. Where does each item belong?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Introduction','Body'],[
   ['Late orders rose from 4% to 15% this year, as Theo’s monthly figures show',0,'Theo knows it and can check it. It belongs in the Situation or Complication.'],
   ['The courier contract changed in spring',0,'Plain history the reader already knows goes in the introduction.'],
   ['Nadia’s new finding: pickers lose time walking around full aisles',1,'It’s new to Theo and came from analysis, so it’s an idea for the body.'],
   ['Theo asked Nadia last week what to do about it',0,'That’s the Complication that raises the Question.'],
   ['Overflow space near Mill Lane would ease picking at peak times',1,'It’s new thinking that raises “Why?” or “How?”, so it’s in the pyramid.']],
   'Known and checkable: introduction. New thinking: body. Getting this right keeps the Question true to what the reader is really asking.');}},

{part:2,src:'Chapter 3 · Caveats for beginners',
 solve:async L=>{const c=L.$('#ep').children;for(let j=0;j<4;j++){c[j].click();await L.sleep(5);}},
 run(L){
  const BASE={S:'s1',C:'c1',Q:'q1',A:'a1',K1:'p1',K2:'p2',K3:'p3'};
  const PR=[['No Main Point',{A:'a0'},'The top box reports what Nadia looked at instead of answering. It’s the Big Chief memo’s flaw, and Theo is left asking.','Step 3 (write the Answer), then the recheck.'],
    ['Wrong question',{C:'c2'},'The Complication makes Theo ask “Why are online orders late?”, but Nadia answers a different question. To Theo the note dodges them.','The recheck: change the Question to the one the Complication raises, or find the right Complication.'],
    ['Mixed kinds on the Key Line',{K2:'p4',K3:'p5'},'Theo asked “Why?”, so every point must be a reason. A step answers “How?”, and a bare topic answers nothing. No plural noun fits the group.','Step 7: the New Question sets the plural noun. “Why?” always needs reasons.'],
    ['New fact in the introduction',{S:'s2'},'Theo has never seen this count. A fact the reader doesn’t know, put in the introduction, distorts their Question.','Caveat 5: the introduction holds only what the reader will agree is true. New findings go in the pyramid.'],
    ['History in the body',{K3:'s3'},'A plain event isn’t an idea: it raises no question, and Theo already knows it.','Caveat 4: history goes in the introduction. The body holds only ideas.'],
    ['Skipped the introduction',{S:null,C:null,Q:null,K1:'s4',K2:'s5',K3:'p6'},'With no introduction, the background lands on the Key Line as a “because… therefore…” chain, and Theo can’t tell which question is being answered.','Caveat 3: think the introduction through first, so the Key Line holds only ideas.']];
  const seen=new Set();
  L.h(PBCSS+L.kick('pr','Break it on purpose')+'<h1 class="q">Here is Nadia’s overflow-space note, working. Tap each way to break it, see where it fails, then repair it.</h1>'+
   '<div id="ep"></div><div id="en"></div><div id="eb"></div>');
  const api=PB(L.$('#eb'),OVER,{id:'eg',st:BASE});
  PR.forEach((p,j)=>{const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=p[0];
    b.onclick=()=>{[...L.$('#ep').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');api.set(Object.assign({},BASE,p[1]));seen.add(j);
      L.$('#en').innerHTML='<div class="fb no" style="margin-top:4px;font-size:14px"><b>What breaks:</b> '+p[2]+'<br><b>What catches it:</b> '+p[3]+'<div style="margin-top:8px"><button type="button" class="btn" id="rep">'+L.ic('cycle')+'Repair it</button> <span class="small">'+seen.size+' of 6 tried</span></div></div>';
      L.$('#rep').onclick=()=>{api.set(BASE);L.$('#en').innerHTML='<div class="fb ok" style="margin-top:4px;font-size:14px"><b>Repaired.</b> Every box passes again. Try another break.</div>';};
      if(seen.size>=4&&!L.$('#eb').dataset.done){L.$('#eb').dataset.done=1;
        L.sheet('info','Where the method stops protecting you','Each break looks fine from the writer’s side and only shows up in the reader’s dialogue. The top-down steps and the caveats are the checks that catch them: write an actual Answer, recheck the Question against the Complication, let the New Question set the plural noun, and keep the introduction to what the reader already knows.');L.done();}};
    L.$('#ep').appendChild(b);});}},

{part:2,src:'Chapter 3 · Caveats for beginners',pts:1,
 solve:async L=>{const g=L.$('#tg').children;g[0].click();g[1].click();},
 run(L){
  const V=[
   L.flow([['list','Criteria','We judge warehouses on three criteria','',1],['check','Fit','This building meets them','',2],['arrow','So','Therefore, buy it','',3]]),
   L.tiers([['home','Buy the Pacific Avenue warehouse, because it meets our criteria','','',true],['check','It’s on a corner',''],['check','It’s larger than 5,000 square feet',''],['check','It costs under $10 a square foot','']])];
  const T=['Deductive Key Line','Inductive Key Line'],N=['The reader has to hold step one in mind to follow step two, and the last box raises no question at all. The book calls this overstructured.','The reasons sit side by side under one top point. Easier to take in, same message.'];const seen=new Set();
  L.h(L.kick('pr','Toggle and compare')+'<h1 class="q">Caveat 6: given a choice, use induction on the Key Line. Look at the book’s warehouse example both ways.</h1><div id="tg"></div><div id="tv" style="margin:6px 0"></div><div class="small" id="tn"></div><div id="tq"></div>');
  T.forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=n;b.onclick=()=>{[...L.$('#tg').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(j);
    L.$('#tv').innerHTML=V[j];L.$('#tn').innerHTML=N[j];
    if(seen.size===2&&!L.$('#tq').innerHTML){const q=L.$('#tq');q.innerHTML='<h2 class="sub">Nadia worked out the case for overflow space step by step: peak stock needs more room, Mill Lane has none spare, so rent nearby. How should the Key Line read?</h2>';
      L.mc(q,['Keep it as a chain, in the order it was reasoned','Rent overflow space, because it meets our needs','Drop the reasons and give the decision only'],1,
       'You can work it out deductively and still present it inductively. The book notes most deductive thinking can be turned this way.',
       'The order you reasoned in isn’t the order the reader needs, and dropping the reasons leaves Theo asking “Why?”. State the point with its reasons side by side.');}};L.$('#tg').appendChild(b);});}},

{part:2,src:'Chapter 3 · Caveats for beginners',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which caveat is being broken?',['Try top down first','Think the introduction through','History goes in the introduction','Intro holds only what’s accepted','Prefer induction on the Key Line'],[
   ['Nadia knows the Main Point, jumps straight to the Key Line, and ends up arguing background facts in a long “because… therefore…” chain.',1,'Sorting out the introduction first would have taken that background out of the body.'],
   ['A section in the body of Nadia’s report is titled “What happened this spring” and lists events in date order.',2,'Plain history belongs in the introduction. The body can hold only ideas.'],
   ['Kenji opens an email with figures from a survey Theo has never seen, then states the Question.',3,'New information in the introduction distorts the reader’s Question. Keep it to what they know or would accept.'],
   ['Kenji writes a first draft straight through, planning to “sort out the structure later”.',0,'A finished-looking draft is hard to give up. Plan top down first.'],
   ['Nadia’s Key Line reads: our criteria are A, B and C; the overflow unit meets them; therefore, take it.',4,'That chain is overstructured. State the point with the reasons side by side.']]);}},

{part:2,src:'Chapter 3 · The top-down approach',pts:3,
 solve:async L=>{await pbPlace(L,'rd',[['S','s1'],['C','c1'],['Q','q1'],['A','a1'],['K1','p1'],['K2','p2'],['K3','p3']]);L.$('#rck').click();},
 run(L){
  let first=true;
  L.h(PBCSS+L.kick('pr','Challenge · build it from scratch')+'<h1 class="q">Theo wants to know how Mill Lane gets ready for the November peak. Build Nadia’s pyramid so every box passes, then check it.</h1>'+
   '<p class="small" style="margin:-8px 0 4px">Some cards are traps. Boxes turn green or red as you go; your first check earns the points.</p><div id="rdb"></div>'+
   '<button type="button" class="btn pri" id="rck" style="margin-top:12px">'+L.ic('check')+'Check my pyramid</button><div id="rf"></div>');
  const api=PB(L.$('#rdb'),READY,{id:'rd',tray:Object.keys(READY.cards)});
  L.$('#rck').onclick=()=>{L.$('#rf').innerHTML='';
    if(!Object.keys(api.st).every(k=>api.st[k])){L.fb(L.$('#rf'),'Fill every box first.','info');return;}
    const r=api.judge(),c1=['S','C','Q'].every(k=>r[k][0]==='ok'),c2=r.A[0]==='ok',c3=['K1','K2','K3'].every(k=>r[k][0]==='ok');
    if(first){first=false;L.award(c1);L.award(c2);L.award(c3);}
    if(c1&&c2&&c3){api.freeze(true);L.$('#rck').disabled=true;L.sheet('ok','A pyramid Theo can read in 30 seconds','The introduction raises Theo’s own Question; the Main Point answers it; “How?” calls for steps, so the Key Line is three steps. One kind of idea, one plural noun.');L.done();}
    else L.fb(L.$('#rf'),[c1?'':'<b>Introduction:</b> the Situation must be something Theo knows, and the Complication must raise your Question.',c2?'':'<b>Main Point:</b> it must answer that Question, not describe your work.',c3?'':'<b>Key Line:</b> the Main Point raises “How?”, so all three points must be steps.'].filter(Boolean).join('<br>'),'no');};}}
  ]
});
</script>
