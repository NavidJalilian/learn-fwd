<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reflecting the Pyramid on a Screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0012', title:'Reflecting the pyramid on a screen', minutes:19, icon:'eye',
  goals:['Split what you say from what you show on a slide','Title every slide and chart with its message, not its topic','Turn a pyramid into a storyboard, step by step'],
  parts:['A show','Text slides','Exhibits','Storyboard'],
  read:'Read chapter 11 of the book for the sample slides, the chart examples and the full Jackson Foods storyboard.',
  glossary:{
    'exhibit-slide':'Exhibit slide: a slide that shows a chart, table or diagram, so the audience sees a relationship words alone can’t make clear.',
    'storyboard':'Storyboard: a sheet divided into blank slide boxes. You write the point of each slide across the top and sketch how you will show it.'
  },
  cheatsheet:[
    'A presentation is a <b>show</b>, not a report in slide form. The speaker is the star; slides keep it moving.',
    'Two kinds of slide: <b>text</b> (show the structure, stress conclusions and next steps) and <b>exhibits</b> (show relationships). Aim for about 90% exhibits.',
    'Say the transitions and introductions aloud. <b>Show</b> only the major points of the pyramid, starkly.',
    'Text slides: one idea at a time · statements, not captions · about 6 lines or 30 words · simple words and round numbers · readable type · interesting layout · build complex slides piece by piece.',
    'Rule of 32: distance to the farthest viewer in feet ÷ 32 = smallest letter height in inches.',
    'Exhibits: decide the question, <b>state the answer as the title</b>, then choose the chart that shows it. Keep it simple.',
    'Storyboard: write the introduction in full → put intro, Key Line and next-level points atop blank slides → rough out visuals → script → finish design → rehearse.'
  ],
  steps:[
/* ---------- PART 1: A SHOW ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Leah plans to pitch two new stores to Fellwick’s board by copying the written report onto 40 slides and reading each one aloud. How will the board likely react?</h1>');
  L.mc(L.card,['They’ll follow closely, since nothing is left out','They’ll drift off or read ahead of Leah'],1,
   'An audience reads faster than you speak, and a wall of text gives them nothing to look up for. This lesson shows what to put on the screen instead.',
   'Leaving nothing out is what makes it dull. The board reads faster than Leah talks, then tunes out. This lesson shows what to put on the screen instead.');}},
{part:0,src:'Chapter 11 · Reflecting the Pyramid on a Screen',run(L){
  L.h(L.kick('learn','A show, not a report')+'<h1 class="q">A presentation is not a report in slide form</h1>'+
   L.prose('Many people think a presentation is just the pyramid turned into text slides that they stand up and explain. The book says it isn’t that simple. A live audience is often uncomfortable, would rather be elsewhere and is open to any distraction.')+
   L.prose('So you have to keep its attention: in effect, entertain it. That needs a <b>show</b>, with a star, a script, a storyboard, good visuals, and care for timing, pace and suspense.')+
   L.note('The book’s typical bad slide: seven “guiding principles” in long sentences. It’s a list, not grouped ideas with a summary, and seven is too many. Then the speaker reads every word, or changes the words, which confuses everyone.','alert'));
  L.done();}},
{part:0,src:'Chapter 11 · Reflecting the Pyramid on a Screen',run(L){
  L.h(L.kick('learn','The basic minimum')+'<h1 class="q">Two kinds of slide, each with a job</h1>'+
   L.prose('Whoever designs a business presentation needs at least: text slides with only the key ideas, grouped and summarized, stated briefly; clear exhibits; and a well-planned storyboard and script.')+
   L.tiers([['list','Text slide','Makes the structure of the talk clear.','e.g. the Main Point and Key Line'],
            ['star','Text slide','Stresses an important group of ideas.','e.g. conclusions, recommendations, next steps'],
            ['trend','Exhibit slide','Shows a relationship words alone can’t make clear.','a chart, table or diagram',true,'Most slides']])+
   L.prose('The ideal mix, the book says, is about <b>90% '+L.g('exhibit-slide','exhibits')+' and 10% text</b>.'));
  L.done();}},
{part:0,src:'Chapter 11 · Reflecting the Pyramid on a Screen',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Leah’s first draft for the board has 30 slides: 26 are bullet text, 4 are charts. What’s the biggest problem with the mix?</h1>');
  L.mc(L.card,['Too few slides for a board meeting','Far too much text, too few exhibits','The charts should all come first'],1,
   'The book aims for about 90% exhibits. Leah has nearly the reverse.',
   'The number and order of slides aren’t the issue. The book aims for about 90% exhibits and 10% text, and Leah has nearly the reverse.');}},
{part:0,src:'Chapter 11 · Reflecting the Pyramid on a Screen',pts:5,run(L){
  L.h(L.kick('pr','Text or exhibit?')+'<h1 class="q">Which kind of slide fits each job in Leah’s pitch?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Text slide','Exhibit slide'],[
   ['The Main Point and the three Key Line points, up front',0,'Text slides make the structure of the talk clear.'],
   ['How online orders from the two towns grew month by month',1,'A change over time is a relationship; a chart shows it at a glance.'],
   ['The three things the board must approve today',0,'A recommendation or next-step group is stressed with a text slide.'],
   ['How each new store’s costs compare with an existing store',1,'Comparing amounts is a job for a chart.'],
   ['The share of current online sales that ship to those towns',1,'Parts of a whole: an exhibit makes it visible.']],
   'Text slides show the structure and stress key groups. Everything that compares, changes or relates goes on an exhibit.');}},

/* ---------- PART 2: TEXT SLIDES ---------- */
{part:1,src:'Chapter 11 · Designing Text Slides',run(L){
  L.h(L.kick('learn','What you say vs what you show')+'<h1 class="q">The star of the show is the speaker</h1>'+
   L.quote('The most interesting thing in the room is always you, not the slides.','Barbara Minto, chapter 11')+
   L.prose('Slides are visual aids that keep the talk moving. So keep a clear line between what you <b>say</b> and what you <b>show</b>. Transitions and lead-ins are spoken; the slide carries only the stark points.')+
   L.lanes([['chat','Leah says','“Late online orders have climbed from 4% to 15% this year. Partly that’s the full warehouse; it’s made worse by slow peak picking and the courier change.”',1],
            ['eye','The slide shows','<b>Late orders: 4% → 15%</b><br>· Full warehouse<br>· Slow peak picking<br>· Courier change',2]])+
   '<p class="small" style="margin-top:10px">Slides alone then make a poor handout. One fix: print each slide with an outline of the script on the facing page.</p>');
  L.done();}},
{part:1,src:'Chapter 11 · What You Show',run(L){
  L.h(L.kick('learn','Seven guidelines')+'<h1 class="q">Rules for each text slide</h1>'+
   L.list([['One idea at a time','Except when you list points as a summary or a preview.'],
     ['Statements, not captions','“Online sales are growing”, not “Online sales”. It leaves no room for a wrong guess.'],
     ['Keep it brief','About 6 lines or 30 words at most. More? Use more slides.'],
     ['Simple words and numbers','$4.9 million, not $4,876,987. Long words pull eyes away from you.'],
     ['Readable type','Use the rule of 32 (next screen).'],
     ['Interesting to look at','Treat a text slide like an exhibit made of words: show how the ideas relate.'],
     ['Use build slides','Reveal a complex slide piece by piece as you explain it.']],2));
  L.done();}},
{part:1,src:'Chapter 11 · What You Show',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Which slide title follows “statements, not captions”?</h1>');
  L.mc(L.card,['City-centre store sales this winter','Winter sales in the city stores: overview','City-centre stores sold 9% less this winter'],2,
   'It states the point, so nobody in the room can take away the wrong message.',
   'That’s a caption: it names the topic and leaves each viewer to guess the point. A statement says it: city stores sold 9% less.');}},
{part:1,src:'Chapter 11 · What You Show',pts:1,
 solve:async L=>{L.$('#dd').children[2].click();},
 run(L){
  const D=[8,16,24,32,40];
  L.h(L.kick('pr','See it happen')+'<h1 class="q">The rule of 32: pick how far the farthest board member sits from the screen.</h1>'+
   L.prose('Divide that distance in feet by 32. The answer is the smallest letter height, in inches, they can still read.')+
   '<div id="dd"></div><div style="background:var(--soft);border-radius:16px;padding:14px;margin:8px 0 6px;min-height:150px;overflow:hidden"><div class="small" id="dl">Choose a distance above.</div><div id="dv" style="font-weight:700;line-height:1.1;margin-top:8px"></div></div><div id="dq"></div>');
  D.forEach(d=>{const b=document.createElement('button');b.className='chip';b.textContent=d+' feet';
    b.onclick=()=>{[...L.$('#dd').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');const h=d/32;
      L.$('#dl').innerHTML=d+' ÷ 32 = <b>'+h+' inch'+(h===1?'':'es')+'</b> tall letters, at least';
      L.$('#dv').style.fontSize=Math.round(16+h*40)+'px';L.$('#dv').textContent='Aa';
      if(!L.$('#dq').innerHTML){const q=L.$('#dq');q.innerHTML='<h2 class="sub">Fellwick’s boardroom screen uses letters 0.5 inches tall. How far away can the board read them?</h2>';
        L.mc(q,['Up to about 8 feet','Up to about 16 feet','Up to about 32 feet'],1,
         'Run it backwards: letter height × 32 = farthest distance. 0.5 × 32 = 16 feet.',
         'Run the rule backwards: letter height in inches × 32 = farthest distance in feet. 0.5 × 32 = 16 feet.');}};
    L.$('#dd').appendChild(b);});}},
{part:1,src:'Chapter 11 · What You Show',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which guideline does it break?',['One idea at a time','Statements, not captions','Keep it brief','Simple words and numbers','Use build slides'],[
   ['A slide titled “Warehouse options”, followed by three bullets.',1,'A caption names a topic. Say the point: “Overflow space is the fastest, cheapest option.”'],
   ['A slide with 11 lines and about 90 words on store staffing.',2,'About 6 lines or 30 words is the limit. Split it over more slides.'],
   ['The new-store cost slide reads “$1,187,460 fit-out (capex-amortized)”.',3,'Round it ($1.2 million) and drop the jargon. Hard numbers pull attention from the speaker.'],
   ['One slide argues both the new-store case and the overflow-space budget.',0,'Two separate ideas, two slides. Show and support one at a time.'],
   ['A dense diagram of the whole click-and-collect process appears all at once, and the board looks lost.',4,'Show it in pieces as you explain, so the full picture never overwhelms.']]);}},
{part:1,src:'Chapter 11 · What You Show',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Tap each piece until it’s a good text-slide title for Leah’s pitch.</h1>');
  L.sentence(L.card,[['New stores','Two new stores'],[': an overview of the business case','would pay back within three years','would deliver significant multi-channel synergies']],[1,1],
   [['Which stores? Be specific so the statement can be checked.'],['That’s a caption: it names a topic and makes no point.','Long, abstract words distract the board from the speaker.']],
   'A short, plain statement of the point: exactly what a text slide should carry.');}},

/* ---------- PART 3: EXHIBITS ---------- */
{part:2,src:'Chapter 11 · Designing Exhibit Slides',run(L){
  L.h(L.kick('learn','Exhibit slides')+'<h1 class="q">Charts speak through visual relationships</h1>'+
   L.prose('Text slides use words. Exhibits (charts, tables, diagrams) show relationships, so you can present lots of data that words can’t carry. The viewer has no time to study them, so keep each one simple. One or two complex diagrams that become clear as you talk are fine; not more.')+
   L.prose('Exhibits answer five kinds of question:')+
   L.list([['layers','What are the parts?','The elements of a structure or process.'],
     ['scale','How do amounts compare?','To the whole, or to each other.'],
     ['trend','How has it changed?','Over time.'],
     ['people','How are items spread out?','How they are distributed.'],
     ['cycle','How do items relate?','Whether one moves with another.']],3)+
   L.note('<b>The trick:</b> decide which question the exhibit answers, state the answer as the title, then choose the chart that best shows that point.','bulb'));
  L.done();}},
{part:2,src:'Chapter 11 · Designing Exhibit Slides',pts:1,
 solve:async L=>{const g=L.$('#pp').children;g[0].click();g[1].click();g[2].click();},
 run(L){
  const P=[['Imani','“Costs at the city stores look too high.”'],['Kenji','“The suburban stores are doing great.”'],['Theo','“Online is about to overtake the stores.”']];const seen=new Set();
  const bars=[['City stores',58,'var(--h3)'],['Suburban stores',74,'var(--h2)'],['Online',66,'var(--ok-strong)']];
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Leah shows a chart titled “Sales by channel”. Tap each board member to see what they take from it.</h1>'+
   '<div style="background:var(--soft);border-radius:16px;padding:14px;margin:8px 0"><div class="small" style="margin-bottom:8px"><b>Sales by channel</b></div>'+
   bars.map(b=>'<div class="meterrow"><div class="lb">'+b[0]+'</div><div class="meter"><div style="width:'+b[1]+'%;background:'+b[2]+'"></div></div></div>').join('')+'</div>'+
   '<div id="pp"></div><div id="pr" style="min-height:40px"></div><div id="pq"></div>');
  P.forEach((p,j)=>{const b=document.createElement('button');b.className='chip';b.innerHTML=L.ic('person')+p[0];
    b.onclick=()=>{b.classList.add('sel');seen.add(j);L.$('#pr').innerHTML='<p class="prose"><b>'+p[0]+':</b> '+p[1]+'</p>';
      if(seen.size===3&&!L.$('#pq').innerHTML){const q=L.$('#pq');q.innerHTML='<h2 class="sub">Leah’s point was that online sales grew 20% this winter. What fixes this?</h2>';
        L.mc(q,['Add more data so the trend is clear','Make that point the chart’s title','Explain it aloud after the chart'],1,
         'Left alone, each viewer sees what their own role makes them look for. A message title points everyone at the same thing, and lets Leah check the chart actually shows it.',
         'More data adds more to misread, and speaking afterwards comes too late. Put the message in the title so everyone looks for the same thing from the start.');}};
    L.$('#pp').appendChild(b);});}},
{part:2,src:'Chapter 11 · Designing Exhibit Slides',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">Leah fixes one chart, step by step</h1>');
  L.beats(L.card,[
   ['The draft','A chart titled <b>“Online sales overview”</b> with every month, every product group and two years of data.'],
   ['Ask the question','What should the board take away? That online orders from the two target towns keep rising. That’s a question of <b>change over time</b>.'],
   ['State the answer','New title: <b>“Online orders from Wexley and Corran have doubled in two years.”</b> A full sentence, with a verb.'],
   ['Check the chart','Does the picture say the same thing? Leah drops the product groups and the other towns, leaving one clear rising line per town.'],
   ['Result','The title and the picture now agree, and every board member looks at the same thing.']],
   'Question first, answer as the title, then the simplest chart that shows that answer.');}},
{part:2,src:'Chapter 11 · Designing Exhibit Slides',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Which chart title is best?</h1>');
  L.mc(L.card,['Boot returns by reason, this year','Fit and sizing cause most boot returns','Boot returns: a breakdown by reason'],1,
   'It states the message as a sentence, so the board knows what the chart is meant to show.',
   'That title only names the data. A message title says what it shows: fit and sizing cause most returns.');}},
{part:2,src:'Chapter 11 · Designing Exhibit Slides',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which question does the chart answer?',['What are the parts?','How do amounts compare?','How has it changed?','How are items spread?','How do items relate?'],[
   ['“Late orders have risen every month since the spring.”',2,'A trend over time.'],
   ['“Most online orders are placed on Sunday evenings.”',3,'How orders are distributed across the week.'],
   ['“Late orders don’t rise with order size.”',4,'Whether one thing moves with another: a relationship.'],
   ['“Click-and-collect has four stages, from order to pickup.”',0,'The elements of a process.'],
   ['“Boots make up half of all returns.”',1,'One part compared with the whole.']]);}},

/* ---------- PART 4: STORYBOARD ---------- */
{part:3,src:'Chapter 11 · Storyboarding',run(L){
  L.h(L.kick('learn','From pyramid to slides')+'<h1 class="q">The author’s six steps</h1>'+
   L.list([['Write the introduction in full','Every word, in order. It shows nothing is missing and lets you check the Question is real for this audience.'],
     ['Fill a blank '+L.g('storyboard','storyboard'),'Across the top of each blank slide, write a point: from the introduction, the Key Line, and one level below it.'],
     ['Rough out each visual','No real numbers yet; just the kind of data and the relationship to show.'],
     ['Script the words','Write what you’ll say around each slide, so the set flows as a story.'],
     ['Finish the design','Then send the slides off to be properly drawn.'],
     ['Rehearse','Then rehearse, and rehearse again.']],4)+
   '<p class="small" style="margin-top:10px">A storyboard can be a sheet turned sideways and split into boxes, one per slide. Mark which will be text and which will be graphics.</p>');
  L.done();}},
{part:3,src:'Chapter 11 · Storyboarding',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">Leah storyboards the new-stores pitch</h1>');
  L.beats(L.card,[
   ['The pyramid','Main Point: <b>open two stores, at Wexley and Corran retail parks, next year</b>. Key Line: demand is already there; each store pays back within three years; the overflow space can stock them.'],
   ['Introduction','Leah writes it word for word: city stores fell 9% this winter while online grew 20%; many online orders come from towns with no Fellwick store. The Question: should we open stores there?'],
   ['Slides 1–2','Text slides for the introduction: the Situation and Complication points, then one with the Main Point and the three Key Line points.'],
   ['Slides 3–8','For each Key Line point, a slide stating it, then exhibits for the points one level below, each with a message title such as “Online orders from Wexley doubled in two years”.'],
   ['Rough, then script','Leah sketches each chart with no real numbers, then writes the spoken links between slides.'],
   ['Last','Design is finished and the slides are drawn. Then Leah and Nadia rehearse, more than once.']],
   'The pyramid sets the order of the slides; the storyboard shows what each one says and how.');}},
{part:3,src:'Chapter 11 · Storyboarding',pts:1,run(L){
  L.h(L.kick('try','Put it in order')+'<h1 class="q">Put the storyboarding steps in the right order.</h1>');
  L.order(L.card,['Write the introduction in full','Write points atop blank slides','Rough out each visual','Script the words','Finish the design','Rehearse'],
   'Words before pictures: the full introduction first, the points next, then visuals, script, design, and plenty of rehearsal.');}},
{part:3,src:'Chapter 11 · Storyboarding',pts:4,run(L){
  L.h(L.kick('pr','Slide or spoken?')+'<h1 class="q">Leah has more to say than slides to show. Where does each item go?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Its own slide','Say it aloud'],[
   ['“Each new store pays back within three years” (a Key Line point)',0,'Key Line points go on the storyboard.'],
   ['“Now let’s turn from demand to cost.”',1,'Transitions are spoken, not shown.'],
   ['“Online orders from Wexley doubled in two years” (one level below)',0,'The storyboard reaches one level below the Key Line.'],
   ['“As you’ll recall from last quarter’s meeting…”',1,'Lead-ins and reminders belong in the script, not on a slide.']],
   'Show the introduction’s key points, the Key Line and one level below. Say the links between them.');}},
{part:3,src:'Chapter 11 · Designing Text Slides',pts:1,run(L){
  L.h(L.kick('pr','After the meeting')+'<h1 class="q">A board member missed the meeting and asks for “the slides”. Leah’s slides are stark and full of message titles. What should Leah send?</h1>');
  L.mc(L.card,['The slides with the script outline beside them','The slides alone, since the titles are clear','A new written report from scratch'],0,
   'Stark slides don’t stand alone. Pairing each with an outline of the script, without the transitions, does both jobs at once.',
   'Good slides leave the explaining to the speaker, so alone they won’t make sense; a whole new report is more work than needed. Pair each slide with an outline of the script.');}},
{part:3,src:'Chapter 11 · Storyboarding',pts:1,run(L){
  L.h(L.kick('pr','Last check')+'<h1 class="q">Two days before the board meeting, the slides are drawn and the script is written. Leah wants to spend the time adding three more charts. What does the book’s process say?</h1>');
  L.mc(L.card,['Add the charts, since more data helps','Rewrite the introduction from scratch','Rehearse the talk, more than once'],2,
   'The last step is rehearsal, and the book stresses it three times over.',
   'More charts make it harder to keep each one simple, and the introduction was written out at the start. The final step is to rehearse, and rehearse again.');}}
  ]
});
</script>
</body>
</html>
