<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reflecting the Pyramid on the Page</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0011', title:'Reflecting the pyramid on the page', minutes:19, icon:'layers',
  goals:['Lay out a report so the reader gets your whole answer in 30 seconds','Write headings that follow the six rules and read as a summary','Link sections so the reader never loses the thread'],
  parts:['See it fast','Headings','Other formats','Transitions'],
  read:'Read the introduction to Part 4 and chapter 10 of the book for the full sample layouts and the Ritz-Ryan transitions.',
  glossary:{
    'dot-dash':'Dot-dash outline: a page of short statements, each level set further to the right and marked with a number, letter, dash or dot. Used for progress reviews read around a table.',
    'next-steps':'Next Steps: a closing section listing the obvious first actions the reader should take if they accept your recommendation.'
  },
  cheatsheet:[
    'Aim: the reader gets the <b>Introduction, Main Point and Key Line in the first 30 seconds</b>. The eye sees the logic before the mind takes it in.',
    'Very short document? <b>Underline</b> the Key Line points. Longer? <b>Introduce</b> the points, then turn each into a heading.',
    'Heading rules: never only one at a level · parallel wording · as few words as possible · text must read without them · introduce each group · don’t overdo it.',
    'Good headings read as a <b>summary</b> in the table of contents. “Background, Findings, Conclusions” says nothing.',
    'Numbers: use them <b>with</b> headings, not instead of them. Indented lists: same grammatical form; one set per memo.',
    'Transitions relate what sections <b>say</b>, not what they do: tell a mini S-C-Q story, or pick up the key phrase from the section before.',
    'Skip a closing conclusion unless you can do it well. <b>Next Steps</b> hold only actions the reader won’t question.'
  ],
  steps:[
/* ---------- PART 1: SEE IT FAST ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Theo opens Nadia’s 12-page report on late online orders. The headings read: Introduction, Background, Findings, Conclusions, Recommendations. Can Theo tell what Nadia recommends from the headings alone?</h1>');
  L.mc(L.card,['Yes, the headings show the plan clearly','No, they name topics but say nothing'],1,
   'The headings tell Theo where things are, but not what Nadia thinks. This lesson is about making the page itself show your ideas.',
   'Those headings would fit any report ever written. They show where things are, not what Nadia thinks. This lesson is about making the page itself show your ideas.');}},
{part:0,src:'Introduction to Part 4',run(L){
  L.h(L.kick('learn','Pick the form')+'<h1 class="q">Length and audience decide the form</h1>'+
   L.prose('Once your pyramid is worked out, you have to put it in front of people. The book says the form you pick depends on two things: how long the message is and how many people it is for.')+
   L.tiers([['person','Short, for one or a few people','Write it as prose: a memo or report they read alone.','Nadia’s note to Theo'],
            ['people','Short, for many people','A '+L.g('dot-dash','dot-dash')+' memo, talked through around a table.','A review with the managers'],
            ['layers','Long, for a large group','Slides, shown on a screen while you talk.','Fellwick’s quarterly board meeting']])+
   L.prose('Whatever the form, the layout must show the logic of the pyramid. The reader’s eye sees the logic before the mind takes it in, so use what the eye sees to back up what the mind gets.'));
  L.done();}},
{part:0,src:'Chapter 10 · Reflecting the Pyramid on the Page',run(L){
  L.h(L.kick('learn','The 30-second goal')+'<h1 class="q">Your whole thinking, in the first 30 seconds</h1>'+
   L.prose('Most of what you write will be read by one person sitting alone. Ideally, the book says, that reader should get your whole thinking in the first 30 seconds:')+
   L.flow([['book','Introduction','the story they know','',1],['target','Main Point','your answer','',2],['list','Key Line','the points under it','',3]])+
   L.prose('In a long report you show the levels of the pyramid with one of five devices: <b>headings</b>, <b>underlined points</b>, <b>decimal numbering</b>, <b>indented display</b> or <b>dot-dash outlines</b>. Each level of the pyramid gets its own level of heading or numbering. The author herself prefers headings.'));
  L.done();}},
{part:0,src:'Introduction to Part 4',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Nadia needs to tell Theo, and only Theo, why the overflow space should be rented before peak season. Which form fits?</h1>');
  L.mc(L.card,['Slides for a presentation to Theo','A short prose memo Theo reads alone','A dot-dash memo for a group review'],1,
   'A short message for one reader is best written as prose and sent for them to read alone.',
   'Slides are for long messages to large groups, and dot-dash memos are for many people around a table. A short message for one person is a prose memo.');}},
{part:0,src:'Introduction to Part 4',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which form fits?',['Prose memo or report','Dot-dash memo','Slides on a screen'],[
   ['Leah’s 40-minute pitch to Fellwick’s board for opening two new stores.',2,'Long, and for a large group: that calls for slides.'],
   ['Nadia’s one-page update to Imani on what the overflow space will cost.',0,'Short and for one reader, who will read it alone.'],
   ['Kenji’s short review of click-and-collect progress, talked through with all 9 store managers around a table.',1,'Short, for many people, discussed at a table: a dot-dash memo.'],
   ['Nadia’s 12-page report to Theo on fixing late online orders.',0,'Long, but for one reader reading alone, so it stays a written report.']]);}},

/* ---------- PART 2: HEADINGS ---------- */
{part:1,src:'Chapter 10 · Highlight the Structure',run(L){
  L.h(L.kick('learn','Make the points jump out')+'<h1 class="q">Short document: underline. Longer: introduce, then head.</h1>'+
   L.lanes([['pencil','Very short','Fewer than two paragraphs under each Key Line point? Number the points and underline each one. They will jump out at the eye.',1],
            ['layers','Longer','More than a paragraph or two per point? State the points in the introduction first, then turn each one into a heading over its section.',2]])+
   L.prose('With <b>hierarchical headings</b>, ideas lower in the pyramid sit further to the right of the page, and ideas at the same level always look the same. Every heading marks a division of thought, never just a break in the page.'));
  L.done();}},
{part:1,src:'Chapter 10 · Hierarchical Headings',run(L){
  L.h(L.kick('learn','Six rules for headings')+'<h1 class="q">A heading shows where one idea in a group starts</h1>'+
   L.list([['Never use only one','Headings show a level of the pyramid, and no level has just one idea. One section, or one subsection, means something is wrong.'],
     ['Make parallel ideas look parallel','If the first heading in a group starts with a verb, they all do. Parallel only matters inside a group, not between groups.'],
     ['Keep the wording short','A heading reminds the reader. It shouldn’t carry the whole idea.'],
     ['Treat headings as outside the text','People skim them. The text must read smoothly with the headings taken out.'],
     ['Introduce each group','Before the first heading of a group, say what point the group makes and what is coming. Never start a heading right under the title.'],
     ['Don’t overdo it','Use headings only where they help. Often nothing below the main sections is needed.']],2));
  L.done();}},
{part:1,src:'Chapter 10 · Hierarchical Headings',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">Nadia fixes the headings in the late-orders report</h1>');
  L.beats(L.card,[
   ['First draft','Under the title, Nadia jumps straight to “Reorganize the picking floor”. Under it sits a single subsection, “Moving the fast sellers”.'],
   ['Rule 5','Nadia adds an opening under the title: late orders can drop back to about 4% with three changes, and names them. Now Theo knows what’s coming.'],
   ['Rule 1','One subsection means it isn’t a group. Nadia folds it into the section’s text, since there is nothing to divide.'],
   ['Rule 2','The three section headings read “Reorganize the picking floor”, “Slow sellers” and “Accepting a second courier collection”. Nadia makes them all start with a verb: <b>Reorganize…, Move…, Accept…</b>'],
   ['Rule 3','“Move slow sellers to the overflow space to free up aisles for peak picking” is too long. It becomes <b>“Move slow sellers to the overflow space”</b>.'],
   ['Rule 4','Under that heading the text began “This will free the aisles…”. “This” leans on the heading. Nadia rewrites: “Slow sellers fill a third of the aisles, so moving them…”']],
   'Each fix makes the headings mirror the pyramid: a group of like ideas, worded alike, that the text can do without.');}},
{part:1,src:'Chapter 10 · Hierarchical Headings',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Kenji’s report on click-and-collect has a section with just one subsection under it, called “Store training”. Which rule does that break?</h1>');
  L.mc(L.card,['Keep the wording short','Introduce each group','Never use only one'],2,
   'A heading marks one idea in a group. A level with only one idea isn’t a group, so the heading shouldn’t be there.',
   '“Store training” is short, and the problem isn’t a missing introduction. A level can never hold just one idea, so a lone subsection breaks “never use only one”.');}},
{part:1,src:'Chapter 10 · Hierarchical Headings',pts:1,
 solve:async L=>{const g=L.$('#tg').children;g[0].click();g[1].click();},
 run(L){
  const V=[['Topic headings',['Introduction','Background','Findings','Conclusions','Recommendations']],
           ['Idea headings',['Late orders can fall back to 4% with three changes','Reorganize the picking floor','Move slow sellers to the overflow space','Accept the courier’s second daily collection']]];
  const seen=new Set();
  L.h(L.kick('pr','Toggle and compare')+'<h1 class="q">Theo only reads the table of contents. Switch between Nadia’s two versions.</h1><div id="tg"></div>'+
   '<div style="background:var(--soft);border-radius:16px;padding:14px;margin:8px 0 6px;min-height:150px"><div class="small" id="tl" style="margin-bottom:8px">Choose a version above.</div><div id="tc"></div></div><div id="tq"></div>');
  V.forEach((v,j)=>{const b=document.createElement('button');b.className='chip';b.innerHTML=L.ic('list')+v[0];
    b.onclick=()=>{[...L.$('#tg').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(j);
      L.$('#tl').innerHTML='<b>Table of contents</b> · '+v[0];
      L.$('#tc').innerHTML=v[1].map((t,k)=>'<div style="display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--soft2)"><span>'+t+'</span><span class="small">'+(k*3+1)+'</span></div>').join('');
      if(seen.size===2&&!L.$('#tq').innerHTML){const q=L.$('#tq');q.innerHTML='<h2 class="sub">What does Theo get from the idea headings that the topic ones hide?</h2>';
        L.mc(q,['A neater, more professional-looking page','Nadia’s answer and the three reasons','Where to find each part of the analysis'],1,
         'Good headings read like a summary of the report. Theo has Nadia’s whole argument without opening a page.',
         'Both versions look tidy and both show where things are. Only the idea headings carry Nadia’s answer and the three changes, so they work as a summary.');}};
    L.$('#tg').appendChild(b);});}},
{part:1,src:'Chapter 10 · Hierarchical Headings',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which heading rule is broken?',['Never use only one','Parallel wording','Keep it short','Headings outside the text','Introduce each group'],[
   ['The report’s title is followed at once by the first section heading, with no opening paragraphs.',4,'The reader starts a section without knowing the point it supports. Introduce the group first.'],
   ['Headings in one group: “Hire weekend staff”, “Better unpacking”, “Overtime budget review”.',1,'Ideas of the same kind should be worded the same way: “Hire…, Unpack…, Review…”.'],
   ['A heading reads “Accept the courier’s second collection so parcels leave Mill Lane before the 2pm cut-off”.',2,'That’s the whole idea, not a reminder. Cut it to the essence.'],
   ['The text under “Rent overflow space” begins “It will cost $3,000 a month.”',3,'“It” only makes sense if you read the heading. The text must stand on its own.'],
   ['Section 3 has a subsection “3.1 Fitting costs” and nothing else.',0,'A level with one item isn’t a group. Fold it into the section or find its partners.']]);}},

/* ---------- PART 3: OTHER FORMATS ---------- */
{part:2,src:'Chapter 10 · Underlined Points',run(L){
  L.h(L.kick('learn','Underlined points')+'<h1 class="q">Underline every support point, and obey three strict rules</h1>'+
   L.prose('Another format underlines the whole statement of every point below the Key Line, with lower levels indented. The idea is that a busy reader can zip through the underlined points alone and still get the whole message. That is easy for the reader and hard on the writer:')+
   L.list([['check','Strict question/answer logic','Points below answer the question the point above raises, and nothing more. Background goes in the opening or closing paragraphs of a section.'],
     ['pencil','Sparse wording','More than about a dozen words, or more than one subject and verb, and you should think again.'],
     ['layers','Only the real argument','No more than four points in a chain of deduction, or five in an inductive group. More means you missed a chance to group.']],3));
  L.done();}},
{part:2,src:'Chapter 10 · Decimal Numbering',run(L){
  L.h(L.kick('learn','Decimal numbering')+'<h1 class="q">Numbers help you point to a spot, but they don’t show ideas</h1>'+
   L.prose('Many companies and most governments number sections (4, 4.1, 4.1.2), so anyone can point to an exact spot. The book sees two costs: frequent numbers break the reader’s focus on the content, and deleting one paragraph can force you to renumber everything after it.')+
   L.lanes([['x','Number alone','“See section 4.1.” The reader must get there before they know what it is about.',4],
            ['check','Number with heading','“See section 4.1 on picking speed.” The reader has the idea in mind on the way.',2]])+
   L.prose('So if you like numbers, use them <b>with</b> headings, not instead of them. And only number real divisions of thought: not the introduction, closing summaries, linking comments or the lead-in to a set of points.'));
  L.done();}},
{part:2,src:'Chapter 10 · Indented Display',run(L){
  L.h(L.kick('ex','Before and after')+'<h1 class="q">Kenji sets off a group of points in a short email</h1>');
  L.beats(L.card,[
   ['The email','Kenji writes to store managers about the click-and-collect launch. Four requests sit buried in two long paragraphs: a floor plan, a named contact, shelf space near the till, and something about the stockroom.'],
   ['Too short for headings','It is one page. Headings or decimal numbers would be overkill, but the four requests are still a group.'],
   ['Indent them','Kenji opens: “Before launch, each store needs to send me:” and lists four numbered items, each in the same form.'],
   ['The list exposes a gap','Written in the same form, three items are clear: <b>a floor plan, a named contact, shelf space near the till</b>. The fourth reads “stockroom”. Kenji never said what is needed about it.'],
   ['Fix and stop','Kenji rewrites it as “a stockroom shelf for orders waiting longer than a day”. One indented group per memo is enough; more and the effect fades.']],
   'Setting a group apart in the same grammatical form makes it easy to take in, and it shows you whether you said what you meant.');}},
{part:2,src:'Chapter 10 · Indented Display',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Nadia indents three asks to the warehouse team. Which version follows the main rule?</h1>');
  L.mc(L.card,['Clear aisle 4; moving slow sellers; a rota for Fridays','Clear aisle 4; move slow sellers; set a Friday rota','Aisle 4 clearing; slow sellers should move; Friday rota'],1,
   'All three start with a verb. Points set off as a group should share one grammatical form.',
   'The points mix forms (“clear”, “moving”, “a rota”). Set off as a group, they should all share one form, like “Clear…, Move…, Set…”.');}},
{part:2,src:'Chapter 10 · Dot-Dash Outlines',run(L){
  L.h(L.kick('learn','Dot-dash outlines')+'<h1 class="q">For a small group reading one page at a time</h1>'+
   L.prose('A '+L.g('dot-dash','dot-dash outline')+' is a kind of indented display used for progress reviews. A few people sit around a table and go through the document together, a page at a time. Lower ideas sit further to the right.')+
   L.prose('Its rules are looser: you don’t need at least two points at every level. The aim is to show the main points simply, without too much at once, so people read slowly and discuss. Still:')+
   L.list([['Short, direct statements','No grace notes or linking phrases.'],['One statement per level','Each line says one thing.'],['Parallel wording','Where you can, at the same level.'],['Tie each level to the one above','Each line explains or supports the line above it.']],4));
  L.done();}},
{part:2,src:'Chapter 10 · Highlight the Structure',pts:5,run(L){
  L.h(L.kick('pr','Pick the device')+'<h1 class="q">Which layout suits each Fellwick document?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Headings','Underline points','Indented list','Dot-dash'],[
   ['Nadia’s 12-page report to Theo on late orders',0,'A long report read alone: introduce the Key Line points, then use them as headings.'],
   ['A half-page memo with three Key Line points of one paragraph each',1,'Very short: just underline the points so they jump out.'],
   ['Leah’s month-end review, read page by page with Imani’s team at a table',3,'A small group reading together at a table is what dot-dash outlines are for.'],
   ['A short email asking each store for four items before launch',2,'Too short for headings, but the four items are a group. Set them off in a list.'],
   ['Imani’s 20-page budget report to the board, read before the meeting',0,'Long and read alone: hierarchical headings, with numbers alongside if wanted.']],
   'Length and reading situation pick the device. Whatever you choose, it has to match the levels of your pyramid.');}},

/* ---------- PART 4: TRANSITIONS ---------- */
{part:3,src:'Chapter 10 · Show Transitions Between Groups',run(L){
  L.h(L.kick('learn','Show transitions')+'<h1 class="q">Look back and forward at once</h1>'+
   L.prose('In the body of a document, each Key Line point needs a short introduction of its own. In longer documents, pause now and then to show where the reader has been and where you are going next.')+
   L.lanes([['x','Says what sections do','“This chapter looked at the need for priorities. The next looks at how to set them.”',4],
            ['check','Says what sections say','Carries the main idea of one section into the main idea of the next.',2]])+
   L.prose('The book gives five techniques: <b>telling a story</b> and <b>referencing backward</b> to open a section, <b>summarizing</b> to close a long one, and at the very end, a <b>full conclusion</b> or <b>Next Steps</b>.'));
  L.done();}},
{part:3,src:'Chapter 10 · Telling a Story',run(L){
  L.h(L.kick('ex','Telling a story')+'<h1 class="q">A small S-C-Q in front of each Key Line point</h1>');
  L.beats(L.card,[
   ['The book’s case','A talk on quality management had three Key Line points. Each section opened with a short '+L.g('scq','Situation–Complication–Question')+' story whose answer was that section’s point.'],
   ['Its scope shrinks','Each story starts where the reader stands now, not back at the start. One section opens: you have now compared yourself to rivals and you are the best. But is being best at it worth the real cost?'],
   ['At Fellwick','Nadia’s second section opens: <i>With the fast sellers near packing, picking walks are shorter</i> (Situation). <i>But at peak, slow sellers still fill a third of the aisles</i> (Complication).'],
   ['The answer','That raises the Question “Where should they go?”, and the heading answers it: <b>Move slow sellers to the overflow space</b>.'],
   ['The rule','Like the opening introduction, each mini-story holds only things the reader already knows or will agree are true.']],
   'A short story in front of each section brings the reader to its point, so each section answers a question they now have.');}},
{part:3,src:'Chapter 10 · Show Transitions Between Groups',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Which opening for Nadia’s third section is a good transition?</h1>');
  L.mc(L.card,['Freeing the aisles helps parcels leave faster, but they still wait for the 2pm collection.','Section 2 covered slow sellers. Section 3 now covers the courier contract.','The next section discusses the courier contract and its options for us.'],0,
   'It carries the idea of the last section forward and raises the next question: so how do parcels leave sooner?',
   'That one only says what sections do. A good transition says what they say: it carries one idea into the next.');}},
{part:3,src:'Chapter 10 · Referencing Backward',run(L){
  L.h(L.kick('learn','Referencing backward and summarizing')+'<h1 class="q">Pick up the key phrase and carry it forward</h1>'+
   L.prose('<b>Referencing backward</b> means taking a word, phrase or the main idea of the part you just finished and using it in your first sentence. You don’t need a story here: the reader met the next point in your introduction already. You do need to introduce the group of ideas coming up.')+
   L.note('“<b>Just as moving the fast sellers</b> shortens picking walks, <b>moving the slow sellers</b> frees the aisles that pickers still have to squeeze through.”','pencil')+
   L.prose('<b>Summarizing sections:</b> if a section is very long or complex, stop and sum it up before going on. Restate its main content and tone. You already have both in your pyramid, so you are only pulling them together again.'));
  L.done();}},
{part:3,src:'Chapter 10 · Making Full Conclusions',run(L){
  L.h(L.kick('learn','Endings')+'<h1 class="q">Most documents don’t need a conclusion. Some need Next Steps.</h1>'+
   L.prose('With a proper introduction and a sound pyramid, you have asked the reader’s question and fully answered it. A conclusion is optional, and the book discourages it because it is hard to do well. If you add one, don’t just say “This report outlined our recommendations.” Put the message in perspective and leave the reader wanting to act.')+
   L.prose('A <b>'+L.g('next-steps','Next Steps')+'</b> section is different. You need it when you recommend action the reader is likely to take. It lists what they should do first to get going.')+
   L.note('<b>The one rule:</b> Next Steps hold only actions the reader won’t question. Anything that would raise a “Why?” belongs in the body, where it has to fit the pyramid.','alert'));
  L.done();}},
{part:3,src:'Chapter 10 · Stating Next Steps',pts:4,run(L){
  L.h(L.kick('pr','Next Steps or body?')+'<h1 class="q">Theo will approve Nadia’s three changes. Where does each action belong?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Next Steps','Body of report'],[
   ['Call the Mill Lane landlord to book a viewing of the overflow unit',0,'Obvious once the overflow space is approved. Nobody will ask why.'],
   ['Stop stocking slow sellers in the stores altogether',1,'Theo would surely ask “Why?”. A point like that has to be argued in the body.'],
   ['Tell the courier Fellwick accepts the second daily collection',0,'It simply puts an approved change in motion.'],
   ['Switch online orders over to Larkspan Logistics',1,'A big move that raises questions. It would need its own place in the pyramid.']],
   'Next Steps are things the reader will do without a second thought. Anything debatable must earn its place in the argument.');}},
{part:3,src:'Chapter 10 · Making Full Conclusions',pts:1,run(L){
  L.h(L.kick('pr','Fix the ending')+'<h1 class="q">Nadia ends the report: “This report has set out our analysis of late orders and the changes we recommend.” What should Nadia do?</h1>');
  L.mc(L.card,['Repeat the three changes in more detail','Add a line inviting Theo to ask questions','Cut it, or show what fixing it means'],2,
   'A lame restatement adds nothing. Either drop it, or show the reader why the message matters so they want to act.',
   'Repeating the content or adding a polite sign-off still adds nothing. Either drop the ending, or put the message in perspective so Theo wants to act.');}}
  ]
});
</script>
</body>
</html>
