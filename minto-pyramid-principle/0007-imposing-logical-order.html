<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Imposing Logical Order</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0007', title:'Imposing logical order', minutes:20, icon:'list',
  goals:['Name the order a group of ideas should follow, and why','Use time, structural and degree order to find gaps and mix-ups','Turn a long, loose list into a few groups that hold together'],
  parts:['Why order','Time order','Structural order','Degree order'],
  read:'Read the introduction to Part 2 and chapter 6 of the book for the full plastic-bottle list, the city-government chart and the New York example.',
  glossary:{
    'class-grouping':'Class grouping: ideas put together because they share one characteristic, such as “problems” or “reasons”.'
  },
  cheatsheet:[
    'Two common errors: a loose list that only shares a plural noun, topped with an '+'intellectually blank assertion (“There are five problems”).',
    'Every grouping comes from one of three mental acts, and that act sets its order: <b>causes of an effect → time order</b>, <b>whole into parts → structural order</b>, <b>like things classed → degree order</b>.',
    '<b>Time order:</b> picture yourself doing each step and what you hold at the end. Done <i>before</i> the next step = same level; done <i>in order to</i> do it = a level below.',
    'Keep groups to four or five points. Longer lists usually hide closer links.',
    '<b>Structural order:</b> divide the whole so the parts are MECE (no overlaps, nothing left out), then describe them as they sit on the picture.',
    '<b>Degree order:</b> define the shared characteristic exactly, check you have every item that has it, and put the strongest first.',
    'For a long list: name the type of each point, group the same types, then find the order the groups imply.',
    'No order fits? The ideas don’t belong together, or the thinking isn’t finished.'
  ],
  steps:[
/* ---------- PART 1: WHY ORDER ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Store managers sent Kenji eight complaints about the click-and-collect trial. Theo has to decide what to fix. Which version helps Theo decide faster?</h1>');
  L.mc(L.card,['All eight complaints, in the order they came in','Three types of problem, each with its complaints'],1,
   'Three groups tell Theo what kinds of fix they need. Eight loose points leave Theo to do that sorting alone. This lesson shows how to find those groups.',
   'Eight loose points leave Theo to sort them alone. Three types of problem already point to three kinds of fix. This lesson shows how to find them.');}},
{part:0,src:'Introduction to Part 2',run(L){
  L.h(L.kick('learn','Two common errors')+'<h1 class="q">A first draft usually hides two mistakes</h1>'+
   L.prose('Part 2 of the book starts from a draft you have already written. When you look back at it, you will often find two errors:')+
   L.list([['list','A loose list','“Ten steps” or “five problems” that seem to belong together only because they fit the same plural noun, not because they share any real logic.'],
           ['alert','A blank top line','The list is topped with an '+L.g('blank-assertion','intellectually blank assertion')+' such as “The company has five problems”, instead of an insight.']],3)+
   L.prose('Listing is fine as a rough first pass. The trick is not to stop there. Check that each group has a real logic, then say what that logic implies. The book calls this '+L.g('hard-headed-thinking','Hard-Headed Thinking')+'. This lesson covers the first half: finding the order.'));
  L.done();}},
{part:0,src:'Chapter 6 · opening',run(L){
  L.h(L.kick('learn','Where groups come from')+'<h1 class="q">Your mind can build a group in only three ways, and each one sets an order</h1>'+
   L.prose('Ideas never land in a group by chance. Your mind picked them because it saw a link. The book says there are only three kinds of analysis that create such a link:')+
   L.tiers([['cycle','You worked out the causes of an effect','Steps that together produce a result go in <b>time order</b>.','Fellwick: the steps to launch click-and-collect'],
            ['layers','You divided a whole into its parts','The parts go in <b>structural order</b>, as they appear on the picture.','Fellwick: what each part of the warehouse needs'],
            ['list','You classed like things together','The items go in <b>degree order</b>: the strongest first.','Fellwick: the three biggest causes of boot returns']])+
   L.note('A deductive group needs no choice: the argument sets its order. For an inductive group, if you can’t find one of these three orders, something is wrong with the group.','compass'));
  L.done();}},
{part:0,src:'Chapter 6 · opening',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Kenji writes that the city-centre stores have “three problems”. Which mental act created that group?</h1>');
  L.mc(L.card,['Working out the causes of an effect','Dividing a whole into its parts','Classing like things together'],2,
   'Out of all the problems the stores have, Kenji picked three that share something. That is classing, so the group needs degree order.',
   '“Three problems” picks a few items out of many that share a feature. That is classing like things, which calls for degree order (strongest first).');}},
{part:0,src:'Introduction to Part 2',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which common error is this?',['A loose list','A blank top line','Neither'],[
   ['Nadia’s memo opens: “Click-and-collect has four problems.”',1,'It names the kind of idea coming, not what the four problems add up to.'],
   ['Kenji’s ten “launch steps” mix things Fellwick does with things that then happen.',0,'They share the label “steps” but not one process.'],
   ['“The warehouse can’t cope at peak because it is full and picking is slow.”',2,'It states a real point and gives its support. No error here.'],
   ['Eight “problems” that are alike only because each one is called a problem.',0,'The plural noun is the only link. That is a loose list.'],
   ['Leah’s slide title: “We recommend five changes.”',1,'It tells you how many, not what the changes achieve.']]);}},

/* ---------- PART 2: TIME ORDER ---------- */
{part:1,src:'Chapter 6 · Time order',run(L){
  L.h(L.kick('learn','Time order')+'<h1 class="q">Steps go one, two, three, and together they make one effect</h1>'+
   L.prose('When you tell someone to do something, you do it because you expect an effect. If several actions are needed for that effect, they form a process, and a process can only be done one step at a time. So the steps go in <b>time order</b>, and the summary above them is the <b>effect</b> of carrying them out.')+
   L.flow([['check','Step 1','Pick a counter spot in each store'],['check','Step 2','Train staff on the pickup routine'],['target','Effect','Click-and-collect runs in all 9 stores','the summary on top',2]])+
   L.prose('Two things go wrong. People don’t separate <b>cause from effect</b> in their list, or they don’t notice that a list of conclusions rests on a <b>hidden process</b>. Also keep each group to about <b>four or five</b> points: past that, some of them are almost always more closely linked to each other.'));
  L.done();}},
{part:1,src:'Chapter 6 · Distinguishing cause from effect',run(L){
  L.h(L.kick('ex','A real example from the book')+'<h1 class="q">Eight steps that were really three</h1>');
  L.beats(L.card,[
   ['The list','A consultant proposed eight steps to improve a company’s productivity: interview managers, trace the work flow, identify the critical functions, analyze the organization, understand services and measures, assess performance, identify problems, and identify improvement areas.'],
   ['Problem 1','Eight is too many to grasp at once.'],
   ['Problem 2','The steps are not all at the same level. Some are done only to <b>produce</b> another: you interview people and trace work flow <i>in order to</i> find the critical functions.'],
   ['Regrouped','Three steps, each with its sub-steps: <b>find the critical functions</b> (interview, trace work flow), <b>find weaknesses in them</b> (organization, measures, performance), and <b>recommend practical changes</b>.'],
   ['The payoff','Now the writer can check: are these three really enough to find improvements? Are those two sub-steps enough to find the critical functions?']],
   'The trick: picture yourself doing each action and ask what you hold in your hand at the end. Then ask: is this done <i>before</i> the next step (same level), or <i>in order to</i> do it (a level below)?');}},
{part:1,src:'Chapter 6 · Distinguishing cause from effect',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Nadia’s launch list has “Book trainers for each store” right next to “Train store staff on the pickup routine.” Where does booking trainers belong?</h1>');
  L.mc(L.card,['Below “train staff”, as a sub-step of it','Beside “train staff”, as a step of its own'],0,
   'You book trainers <i>in order to</i> train staff. That makes it a lower-level step under training.',
   'Booking trainers isn’t a separate step done before training. It’s done <i>in order to</i> train staff, so it sits one level below.');}},
{part:1,src:'Chapter 6 · Distinguishing cause from effect',pts:1,
 solve:async L=>{for(let i=0;i<6;i++){const b=L.$('#nx');if(b)b.click();}},
 run(L){
  const S=['Choose a pickup counter spot in each store','Train staff on the pickup routine','Go live in all 9 stores','Strong uptake in the first month','Queues at the counter on Saturdays','Repeat orders level off'];
  let k=0;
  L.h(L.kick('pr','Walk it through')+'<h1 class="q">Kenji’s “click-and-collect launch plan” has six steps. Put yourself in Fellwick’s place and say each one aloud.</h1>'+
   '<div id="wk" style="background:var(--soft);border-radius:16px;padding:12px 14px;margin:8px 0 12px;min-height:60px"></div>'+
   '<button class="btn pri" id="nx">'+L.ic('play')+'Say the first step</button><div id="wq"></div>');
  L.$('#nx').onclick=function(){
    const t=S[k];const said=(k===0?'First I ':'Then I ')+t.charAt(0).toLowerCase()+t.slice(1)+(k>=3?'…?':'.');
    L.$('#wk').insertAdjacentHTML('beforeend','<div style="margin:4px 0"><b>'+(k+1)+'.</b> '+t+'<div class="small" style="color:'+(k>=3?'var(--no)':'var(--ok)')+'">“'+said+'”</div></div>');
    k++;
    if(k<S.length){this.innerHTML=L.ic('play')+'Say the next step';}
    else{this.remove();const q=L.$('#wq');q.innerHTML='<h2 class="sub">Where does the list stop being things Fellwick does?</h2>';
      L.mc(q,['At “Go live in all 9 stores”','At “Strong uptake in the first month”','At “Queues at the counter on Saturdays”'],1,
       'From step 4 on, these are the market’s reaction, not actions. A clearer plan: step 4 “Track how customers respond”, step 5 “Adjust staffing to match”.',
       'Going live is still something Fellwick does. The first thing you can’t do yourself is “strong uptake”: that’s how customers react. From there on, the list mixes results into the steps.');}};}},
{part:1,src:'Chapter 6 · Revealing the underlying process',run(L){
  L.h(L.kick('learn','Find the hidden process')+'<h1 class="q">A list of conclusions often rests on a process nobody wrote down</h1>'+
   L.prose('People often list conclusions that hint at their point without saying it. Each line makes sense, so the list feels fine. But ask “Why this order?” and a process often appears.')+
   L.prose('The book’s example criticizes a common way of judging investments. Its points really follow three steps of a process:')+
   L.flow([['bulb','Step 1','Set up a concept','criticized'],['pencil','Step 2','Build a technique on it','criticized'],['play','Step 3','Apply the technique','not mentioned',4]])+
   L.prose('Once you see the process, you see the gap. The writer found fault with steps 1 and 2 but said nothing about step 3. Either step 3 is fine, or they forgot. Now a reviewer knows exactly what to ask.'));
  L.done();}},
{part:1,src:'Chapter 6 · Revealing the underlying process',pts:1,run(L){
  L.h(L.kick('pr','Check someone else’s thinking')+'<h1 class="q">Imani’s draft for the board says Fellwick’s way of choosing warehouse sites (1) rests on rough guesses about online growth and (2) compares rents but ignores courier costs. Picture the process: forecast demand, compare sites, agree the lease. What should Nadia ask Imani?</h1>');
  L.mc(L.card,['Should we forecast online growth at all?','Is anything wrong with how we agree leases?','Why compare rents between the sites?'],1,
   'Imani’s points cover steps 1 and 2 of the process. Step 3 is missing, so that’s the question to ask.',
   'Imani has already commented on forecasting and comparing. The process shows a third step Imani skipped: agreeing the lease. Ask about that.');}},

/* ---------- PART 3: STRUCTURAL ORDER ---------- */
{part:2,src:'Chapter 6 · Structural order · Creating a structure',run(L){
  L.h(L.kick('learn','Structural order')+'<h1 class="q">Picture the whole, split it cleanly, then describe the parts as they appear</h1>'+
   L.prose('Structural order follows what you see once you have pictured something: a diagram, a map, an org chart. The thing can be real or an idea. But it must be split into parts properly, which means the parts are '+L.g('mece','MECE')+'.')+
   L.lanes([['x','Mutually exclusive','No overlaps. Nothing in one part also turns up in another.',3],
            ['check','Collectively exhaustive','Nothing left out. All the parts together make up the whole.',2]])+
   L.prose('The book shows a company split into three divisions. Nothing one division does is repeated in another, and the three together are the whole firm. Split this way, your picture shows every piece you must explain. Then describe the pieces in the order they appear on it.'));
  L.done();}},
{part:2,src:'Chapter 6 · Describing a structure',run(L){
  L.h(L.kick('ex','Which order on the picture?')+'<h1 class="q">How you divided the whole decides the order of the parts. Tap each card.</h1>');
  L.flips(L.card,[
   ['Divided by activity','Buying, warehousing, selling. The activities form a process, so they go in <b>time order</b>.'],
   ['Divided by location','Fellwick’s stores, region by region. These follow the map: <b>structural order</b>, as geography lays them out.'],
   ['Divided by product','Tents, boots, jackets, climbing kit. This is classing, so rank them in <b>degree order</b>, for example by sales.'],
   ['Describing a machine or a map','Go top down and left to right, or follow how it works (the book’s radar set), or follow the path the eye takes across a map.'],
   ['Recommending changes to a structure','If all the changes matter equally and happen together, state them in the order you would draw the new chart on a blank page.']],
   'The order isn’t a style choice. It reflects how you split the whole in the first place.');}},
{part:2,src:'Chapter 6 · Structural order · Creating a structure',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Kenji splits Fellwick’s sales into four parts: city-centre stores, other stores, the online shop, and click-and-collect orders. What’s wrong with this split?</h1>');
  L.mc(L.card,['A part of the sales is missing','Two of the parts overlap','Nothing, it’s MECE'],1,
   'Click-and-collect orders are placed online and picked up in stores, so they would be counted twice. The parts aren’t mutually exclusive.',
   'Every sale is covered, so nothing is missing. But click-and-collect orders are also online orders, so two parts overlap. It isn’t mutually exclusive.');}},
{part:2,src:'Chapter 6 · Using the concept to clarify thinking',run(L){
  L.h(L.kick('ex','A real example from the book')+'<h1 class="q">Eleven “risks” that turned out to be two messages</h1>');
  L.beats(L.card,[
   ['The list','A soft-drinks company had to choose: buy plastic bottles, or make its own. One manager opposed making them, and wrote eleven loosely connected risks and constraints.'],
   ['Step 1','Ask of each point: <i>why is this bad?</i> The answers come down to high costs, lower prices, lower sales, a big investment, lower earnings, borrowing, and a possible legal ban.'],
   ['Step 2','Costs, prices, sales and investment are parts of a structure every business reader knows: the tree that builds up return on investment.'],
   ['Step 3','Placed on that tree, most points say one thing: profits would suffer, short term and long term. Borrowing fits too, one layer down. Only the legal ban stands apart.'],
   ['The message','Think hard before making bottles: a ban might stop us, and even without one, profitability would drop.'],
   ['The twist','The book notes the company did make its own bottles, and did very well. What the list left out was the good effect on <b>sales</b>.']],
   'You can’t see that a list is nonsense until you put a structure on it. The structure shows the flaws and the gaps.');}},
{part:2,src:'Chapter 6 · Using the concept to clarify thinking',pts:5,run(L){
  L.h(L.kick('pr','Put it on the tree')+'<h1 class="q">Imani lists five worries about moving to Quarry Road. Ask “why is this bad?” and place each one where it hits the profit picture.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Raises costs','Cuts sales','Ties up money'],[
   ['About $1.2M to fit out the new building',2,'That is money invested up front, before any return.'],
   ['Rent at Quarry Road is higher than at Mill Lane',0,'A bigger bill every month is a cost.'],
   ['A longer drive to the city stores burns more van fuel',0,'Fuel is a running cost.'],
   ['Online orders slow down for two weeks during the move',1,'Slow orders lose online customers, so sales drop.'],
   ['Stock sits in vans and boxes for a week in transit',2,'Stock you can’t sell is money tied up.']],
   'Seen on the tree, Imani’s five worries make one point: the move as planned would hurt Fellwick’s return on investment. And, like the bottle list, it says nothing yet about the good the move might do.');}},

/* ---------- PART 4: DEGREE ORDER ---------- */
{part:3,src:'Chapter 6 · Degree order · Creating proper class groupings',run(L){
  L.h(L.kick('learn','Degree order')+'<h1 class="q">When you class ideas together, rank them, strongest first</h1>'+
   L.prose('“The stores have three problems” is never literally true. The stores have many problems. You have picked out three that share one feature, and set them apart from all the rest. That is a '+L.g('class-grouping','class grouping')+', and it is where the urge to list instead of think is strongest.')+
   L.list([['Name the feature exactly','Say precisely what the items have in common.'],
           ['Check you have them all','Search what you know for every item with that feature.'],
           ['Rank by degree','Each has the feature to a different degree. Put the strongest first.']],1)+
   L.prose('Saving the strongest for last may feel more dramatic. The book says that is a style choice, and fine now and then. By default, the order itself tells the reader what matters most.'));
  L.done();}},
{part:3,src:'Chapter 6 · Identifying improper class groupings',run(L){
  L.h(L.kick('learn','When a “class” is really something else')+'<h1 class="q">Many “reasons” or “problems” really came from a process or a structure</h1>'+
   L.prose('People call ideas “reasons” even when they came from a process or a structure, not from a shared feature. That is fine, as long as you know the true source and use the order it gives.')+
   L.prose('Long lists often hide several smaller kinds of problem inside one label. The book gives one way to get at the real thinking:')+
   L.flow([['eye','1 · Name the type','What kind of point is each one?'],['layers','2 · Group the same types','Put like with like'],['list','3 · Find the order','What order do the groups imply?']]));
  L.done();}},
{part:3,src:'Chapter 6 · Identifying improper class groupings',run(L){
  L.h(L.kick('ex','A real example from the book')+'<h1 class="q">Eight complaints about a report, sorted into three</h1>');
  L.beats(L.card,[
   ['The list','Buyers at a company disliked their monthly sales and inventory report, and someone wrote down eight complaints.'],
   ['Name the type','For each complaint, name the kind of problem. “Report frequency is wrong” is a <b>timing</b> problem. “Data can’t be matched” is a <b>data</b> problem.'],
   ['Group','Three types appear: <b>bad timing</b>, <b>poor data</b>, <b>unhelpful format</b>.'],
   ['Find the order','The order depends on the question being answered. <i>Why do buyers hate it?</i> Follow their reading: it comes late; when it comes, they can’t find anything; when they find it, it’s wrong.'],
   ['Another question','<i>Why is the report useless?</i> Follow how it is made: it gathers unreliable data, lays it out badly, and sends it too late.']],
   'Same three groups, different order. The order follows the process behind the question your reader is asking.');}},
{part:3,src:'Chapter 6 · Degree order · Creating proper class groupings',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Kenji writes: “From the trial, store managers want 1. clear pickup signs, 2. more counter staff on Saturdays, 3. a faster label printer.” What does this order tell Theo?</h1>');
  L.mc(L.card,['The signs must go up before the rest','Each request matters equally','Signs matter most to the managers'],2,
   'These are classed together as “wants”, so the order is degree order: the first one is the strongest.',
   'They aren’t steps, so the order isn’t about timing, and degree order is never “all equal”. In a class grouping, the first item is the one that matters most.');}},
{part:3,src:'Chapter 6 · Identifying improper class groupings',pts:6,run(L){
  L.h(L.kick('pr','Name the type')+'<h1 class="q">Kenji collected six notes on why customers return hiking boots. Sort each one by the kind of problem it shows.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Wrong size','Arrived damaged','Not as expected'],[
   ['Half sizes aren’t shown on the website',0,'The customer couldn’t pick the right size.'],
   ['The box was crushed by the courier',1,'Harm done on the way to the customer.'],
   ['The colour looked lighter in the photo',2,'The boot was fine, but not what the customer pictured.'],
   ['Our size chart differs from the brand’s chart',0,'Two charts that disagree lead to the wrong size.'],
   ['A toe was scuffed on the warehouse shelf',1,'Damage before it left Mill Lane.'],
   ['Heavier than the description suggested',2,'The description set the wrong expectation.']],
   'Six scattered notes become three types of problem. Next step: find the order those three imply.');}},
{part:3,src:'Chapter 6 · Identifying improper class groupings',pts:1,
 solve:async L=>{const c=L.$('#qs').children;c[0].click();c[1].click();},
 run(L){
  const O=[{q:'What causes most returns?',why:'Degree order: ranked by share of returns',ord:[['Wrong size','about half of returns'],['Not as expected','about a third'],['Arrived damaged','the rest']]},
           {q:'Where does each go wrong for the customer?',why:'Time order: following the boot’s journey',ord:[['Wrong size','when they choose online'],['Arrived damaged','while it is shipped'],['Not as expected','when they open the box']]}];
  const seen=new Set();
  L.h(L.kick('pr','Toggle and compare')+'<h1 class="q">Same three groups, two questions. Pick each question and watch the order change.</h1><div id="qs"></div>'+
   '<div style="background:var(--soft);border-radius:16px;padding:14px;margin:8px 0 6px;min-height:140px"><div class="small" id="ow" style="margin-bottom:8px">Choose a question above.</div><div id="ol"></div></div><div id="oq"></div>');
  O.forEach((o,j)=>{const b=document.createElement('button');b.className='chip';b.innerHTML=L.ic('chat')+o.q;
    b.onclick=()=>{[...L.$('#qs').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(j);
      L.$('#ow').innerHTML='<b>'+o.why+'</b>';
      L.$('#ol').innerHTML=o.ord.map((r,i)=>'<div style="margin:6px 0"><span class="chip static ok">'+(i+1)+' · '+r[0]+'</span> <span class="small">'+r[1]+'</span></div>').join('');
      if(seen.size===2&&!L.$('#oq').innerHTML){const q=L.$('#oq');q.innerHTML='<h2 class="sub">Theo asks Nadia: “Which return problem is costing us most?” Which order should Nadia’s memo use?</h2>';
        L.mc(q,['The order of the boot’s journey','The order of importance'],1,
         'Theo is asking how much each one matters, so rank them: wrong size first.',
         'Theo isn’t asking where things go wrong along the way. They want to know which matters most, so rank by importance.');}};
    L.$('#qs').appendChild(b);});}},
{part:3,src:'Chapter 6 · Identifying improper class groupings',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which order fits this group?',['Time order','Structural order','Degree order'],[
   ['What store staff do when a click-and-collect customer walks in',0,'A routine done step by step, so time order.'],
   ['What each store needs, going round the region from north to south',1,'Following the map of the region: structural order.'],
   ['The three biggest causes of late online orders',2,'Classed together as causes and ranked: degree order.'],
   ['How the Mill Lane floor should change, zone by zone along the aisles',1,'Following the layout of the building: structural order.'],
   ['If the board approves Quarry Road: moving the stock over one weekend',0,'A process with a start and an end, so time order.']]);}}
  ]
});
</script>
</body>
</html>
