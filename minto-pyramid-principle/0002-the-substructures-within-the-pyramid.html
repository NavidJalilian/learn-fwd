<title>The Substructures Within the Pyramid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0002', title:'The substructures within the pyramid', minutes:18, icon:'tree',
  goals:['Predict the question each statement raises, and answer it on the line below','Tell a deductive grouping from an inductive one','Open a document with a Situation, Complication and Question the reader already shares'],
  parts:['Vertical','Horizontal','Introduction'],
  read:'Read chapter 2 of the book for the full Chesterton pig argument and the before-and-after board memo.',
  glossary:{
    'idea':'Idea (in the book’s sense): a statement that tells the reader something they don’t know, so it raises a question in their mind.'
  },
  cheatsheet:[
    'You rarely know your ideas before you write. Three <b>substructures</b> help you find them: vertical, horizontal, and the introduction.',
    '<b>Vertical:</b> each statement raises a question (Why? How?). The line below answers it. Stop when the reader has no more logical questions.',
    'Never raise a question you aren’t ready to answer, and never answer one the reader hasn’t asked yet (no “Our assumptions” up front).',
    '<b>Horizontal:</b> a group answers its question either <b>deductively</b> or <b>inductively</b>, never both at once.',
    '<b>Deductive:</b> a statement, a comment on it, a “therefore”. Sum it up resting on the last point: “Because…, …”.',
    '<b>Inductive:</b> like ideas under one plural noun. Sum it up by inferring what their sameness means.',
    '<b>Introduction:</b> tell the story the reader knows: <b>Situation → Complication → Question</b>. Your Main Point is the <b>Answer</b>.',
    'The beginning question keeps every idea relevant: an idea belongs only if it helps answer it.'
  ],
  steps:[
/* ---------- PART 1: VERTICAL ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Imani, Fellwick’s finance director, reads the first line of Nadia’s memo: “We should rent overflow space near Mill Lane.” What happens in Imani’s mind next?</h1>');
  L.mc(L.card,['Takes it in and moves on to the next topic','Asks “Why?” and expects the reasons next'],1,
   'A new claim always raises a question. This lesson shows how to use that question to build the rest of the memo.',
   'A careful reader can’t just move on from a new claim. It raises a question, here “Why?”, and they expect the answer next.');}},
{part:0,src:'Chapter 2 · opening',run(L){
  L.h(L.kick('learn','You find your ideas as you build')+'<h1 class="q">Most writers start with only a hazy idea</h1>'+
   L.prose('If you already know your ideas, the pyramid rules make arranging them fairly easy. But most people sit down to write with only a vague notion of what they think. The book says that’s normal: you can’t know exactly what you think until you say it or write it down, and even then the first version is rough.')+
   L.prose('So you have to <b>discover</b> your ideas first. The pyramid helps, because it has three built-in relationships that tell you what to look for:')+
   L.flow([['down','Vertical','point and subpoints',1],['layers','Horizontal','ideas within one group',2],['book','Introduction','the story that leads in',3]]));
  L.done();}},
{part:0,src:'Chapter 2 · The vertical relationship',run(L){
  L.h(L.kick('learn','The vertical relationship')+'<h1 class="q">Every statement raises a question</h1>'+
   L.prose('The book defines an '+L.g('idea','idea')+' as a statement that tells the reader something they don’t know. People don’t read to learn what they already know, so that’s always your job.')+
   L.flow([['chat','You state','something new','',1],['alert','Reader asks','Why? How? Why do you say that?','',4],['list','Line below','answers that question','',2]])+
   L.prose('Your answer tells them more new things, so it raises more questions, and you answer those on the next line down. This is the '+L.g('qa-dialogue','question/answer dialogue')+'. You stop when the reader has no more logical questions. They may not agree with you, but they can follow you. Then you go back up to the '+L.g('key-line','Key Line')+' and continue with your next main point.'));
  L.done();}},
{part:0,src:'Chapter 2 · The vertical relationship',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">A writer argues that pigs make good pets</h1>');
  L.beats(L.card,[
   ['The claim','In a humorous essay, G. K. Chesterton says pigs should be kept as pets. The reader asks: <i>Why?</i>'],
   ['Two reasons','They are beautiful, and they could be bred into fascinating variations. Reader: <i>What makes pigs beautiful?</i>'],
   ['One level down','They are wonderfully fat, and they are typically English. Reader: <i>What’s beautiful about fat?</i>'],
   ['Another level','Fat gives the onlooker lovely curves and gives the owner modesty. No more questions on this leg, so the argument moves to “typically English”.'],
   ['The rest','Pigs are tied to the land, which shows power can be kind, which is so English they deserve to be the national symbol. Then the variations: in size, personality and use.']],
   'You probably don’t agree. But you can see exactly why he says what he says, because each group answers only the question the point above raised.');}},
{part:0,src:'Chapter 2 · The vertical relationship',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Nadia’s Main Point is “We should rent overflow space near Mill Lane.” Which line belongs directly below it?</h1>');
  L.mc(L.card,['Mill Lane has been our only warehouse since the shop opened.','It costs the least, and it can be ready by next month.'],1,
   'It answers the question the point raises: <i>Why?</i>',
   'That may be true, but it doesn’t answer the question Imani is asking: <i>Why rent overflow space?</i>');}},
{part:0,src:'Chapter 2 · The vertical relationship',run(L){
  L.h(L.kick('learn','Timing matters')+'<h1 class="q">Answer questions only once they’ve been asked</h1>'+
   L.prose('To keep a reader’s full attention, the book gives two rules: don’t raise a question before you’re ready to answer it, and don’t answer a question before you’ve raised it.')+
   L.note('A memo that opens with a section called <b>“Our assumptions”</b> breaks the second rule. It answers questions the reader hasn’t had a chance to ask, so the same material has to be repeated, or reread, later where it matters.','alert')+
   L.prose('The pyramid fixes this almost by itself. Because each group answers the question raised just above it, information shows up exactly when the reader needs it.'));
  L.done();}},
{part:0,src:'Chapter 2 · The vertical relationship',pts:1,
 solve:async L=>{for(let i=0;i<4;i++)L.$('#nx').click();},
 run(L){
  const T=[['We should rent overflow space near Mill Lane.','Why?'],
           ['It’s the cheapest fix, and it can be ready next month.','How do you know it’s cheapest?'],
           ['Two quotes put the rent at a small share of the $1.2M Quarry Road fit-out.','And why next month?'],
           ['The landlord can hand over the keys on the 1st.','I’m not sure I agree yet. But I follow your reasoning.']];
  let n=0;
  const bub=(t,who,me)=>'<div style="display:flex;justify-content:'+(me?'flex-start':'flex-end')+';margin:0 0 6px"><div style="max-width:82%;background:'+(me?'var(--soft)':'var(--h3-bg)')+';border-radius:14px;padding:8px 12px"><div class="small" style="font-weight:700">'+who+'</div>'+t+'</div></div>';
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Nadia walks Imani through the idea in a chat. Send each line and watch Imani’s questions.</h1><div id="ch"></div>'+
   '<button class="btn pri" id="nx" style="margin-top:8px">'+L.ic('chat')+'Send next line</button><div id="cq"></div>');
  L.$('#nx').onclick=function(){if(n>=T.length)return;const t=T[n];n++;
    L.$('#ch').insertAdjacentHTML('beforeend',bub(t[0],'Nadia',true)+bub(t[1],'Imani',false));
    if(n===T.length){this.remove();const q=L.$('#cq');q.innerHTML='<h2 class="sub">Why can Nadia now move on to the next point?</h2>';
      L.mc(q,['Imani has no more logical questions here','Imani now agrees with every point Nadia made'],0,
       'The dialogue on this leg is done. Imani can judge the reasoning, which is all a writer can hope for.',
       'Imani said they aren’t sure they agree. The leg is done because Imani has no more questions and can follow the reasoning.');}};}},
{part:0,src:'Chapter 2 · The vertical relationship',pts:6,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Imani asked “Why rent overflow space?” Does this line fit now?',['Answers Imani’s question','Answers one not asked yet'],[
   ['It’s the cheapest of the three options on the table.',0,'A reason. That’s exactly what “Why?” asks for.'],
   ['Our assumptions: online sales keep growing 20% a year.',1,'An assumptions block answers questions Imani hasn’t raised. Bring it in where it’s needed.'],
   ['It can be ready before the winter peak.',0,'Another reason, so it answers “Why?”.'],
   ['Here is how we would staff the new space, shift by shift.',1,'That answers “How?”, a question for later, once Imani accepts the idea.'],
   ['It’s close enough for the Mill Lane team to work both sites.',0,'A reason it’s a good choice: it answers “Why?”.'],
   ['A history of how Mill Lane was chosen in the first place.',1,'Nothing in Imani’s question asks for this history.']]);}},

/* ---------- PART 2: HORIZONTAL ---------- */
{part:1,src:'Chapter 2 · The horizontal relationship',run(L){
  L.h(L.kick('learn','The horizontal relationship')+'<h1 class="q">A group answers its question in one of two ways</h1>'+
   L.prose('The ideas on a line must answer the question above them <b>logically</b>. The book says there are only two ways: a '+L.g('deduction','deductive')+' argument or an '+L.g('induction','inductive')+' one. One or the other, never both at once.')+
   L.lanes([['arrow','Deductive','1. A statement about the world.<br>2. A comment on its subject or predicate.<br>3. What follows: “therefore”.<div class="small" style="margin-top:6px">Men are mortal. Socrates is a man. Therefore Socrates is mortal.</div>',1],
            ['layers','Inductive','A set of ideas that are alike, so one plural noun covers them all: reasons, steps, problems.<div class="small" style="margin-top:6px">French, German and Russian tanks are at the Polish border.</div>',2]]));
  L.done();}},
{part:1,src:'Chapter 2 · The horizontal relationship',run(L){
  L.h(L.kick('learn','Moving up a level')+'<h1 class="q">Each kind gets summed up differently</h1>'+
   L.tiers([['arrow','Deductive summary','Restate the argument, leaning on the last point.','“Because Socrates is a man, he is mortal.”'],
            ['layers','Inductive summary','Ask what the ideas have in common, then infer what that sameness means.','All three are warlike moves: “Poland is about to be invaded.”']])+
   L.prose('So when you choose how to answer a question, you know what to check. Deductive: does point two comment on point one, and does point three draw a “therefore” from both? Inductive: are the ideas truly alike, under one plural noun?'));
  L.done();}},
{part:1,src:'Chapter 2 · The horizontal relationship',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">Imani asks “Why rent overflow space?” Nadia can answer two ways</h1>');
  L.beats(L.card,[
   ['Deductive line','1. Peak orders need more room than Mill Lane has.<br>2. The overflow site adds more room than that.<br>3. Therefore the overflow site can carry the peak.'],
   ['Its summary','Lean on the last point: <b>“Because the overflow site adds more room than we lack, it can carry the peak.”</b>'],
   ['Inductive line','It’s the cheapest option. It can be ready next month. It keeps the team close to Mill Lane. All three are <i>reasons to choose it</i>.'],
   ['Its summary','Infer from what they share: <b>“Overflow space is the quickest, cheapest fix.”</b>'],
   ['What not to do','Mix them: two reasons, then a “therefore” tacked on at the end. Imani can’t tell whether to check a chain or compare like ideas.']],
   'Same question, two logical answers. Pick one per group and check it by its own test.');}},
{part:1,src:'Chapter 2 · The horizontal relationship',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">“The courier missed its Monday pickup. It missed Wednesday’s. It missed Friday’s.” What kind of grouping is this?</h1>');
  L.mc(L.card,['Inductive: like ideas under one plural noun','Deductive: a chain that ends in “therefore”'],0,
   'Three alike ideas (missed pickups). The inference might be: “The courier can’t be relied on.”',
   'No point comments on another, and there’s no “therefore”. They’re three alike ideas: missed pickups.');}},
{part:1,src:'Chapter 2 · The horizontal relationship',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Deductive or inductive?',['Deductive','Inductive'],[
   ['Late orders lead to refunds. Refunds come out of online profit. So late orders eat into online profit.',0,'Point two comments on point one, and point three is the “so”.'],
   ['Shelves are full at peak. Picking slows at peak. Pickups fell to one a day.',1,'Three alike ideas: problems at Mill Lane.'],
   ['It’s the cheapest option. It can start next month. It keeps the team together.',1,'Three reasons for the same choice.'],
   ['Every online order ships from Mill Lane. Mill Lane is full. So every online order passes through a full warehouse.',0,'A statement, a comment on it, and the implication.'],
   ['Quarry Road costs $1.2M to fit out. Theo and the board must approve any spend. So Quarry Road needs board approval.',0,'A chain that ends in a “so”.']]);}},
{part:1,src:'Chapter 2 · The horizontal relationship',pts:1,run(L){
  L.h(L.kick('pr','Build the summary')+'<h1 class="q">Sum up this deductive group: “Peak orders need more room than Mill Lane has. The overflow site adds more room than that. Therefore it can carry the peak.”</h1>');
  L.sentence(L.card,[['Even though','Because'],['the overflow site adds more room than we lack','Mill Lane has served us well for years'],['we must move to Quarry Road','it can carry our peak orders']],[1,0,1],
   [['“Even though” sets up a contrast. A deductive summary rests on a “because”.'],['That isn’t in the argument at all. Use the step that leads to the conclusion.'],['That isn’t where the argument ends. Rest the summary on the final point.']],
   'A deductive summary leans on the last point, joined by “because”: just like “Because Socrates is a man, he is mortal.”');}},

/* ---------- PART 3: INTRODUCTION ---------- */
{part:2,src:'Chapter 2 · The introductory flow',run(L){
  L.h(L.kick('learn','The introductory flow')+'<h1 class="q">Start from a question the reader already has</h1>'+
   L.prose('The dialogue only holds a reader if the first statement matters to them. The surest way: make your Main Point the answer to a question that’s already in their mind, or would be if they thought for a minute about what’s going on.')+
   L.prose('The introduction reminds them where that question came from, as a short story in the classic order:')+
   L.flow([['map','Situation','time and place, which the reader knows','',1],['alert','Complication','what happened','',4],['chat','Question','what it makes them ask','',3],['target','Answer','your Main Point','',2]])+
   L.prose('This '+L.g('scq','Situation–Complication–Question')+' story makes sure you and the reader are “standing in the same place” before you lead them through your reasoning.'));
  L.done();}},
{part:2,src:'Chapter 2 · The introductory flow',run(L){
  L.h(L.kick('ex','Before and after, from the book')+'<h1 class="q">A memo about a company’s board</h1>');
  L.beats(L.card,[
   ['Before','“The purpose of this memo is to pull together ideas for discussion on:” then five topics, such as the board’s size, its role, outside members and how to get from here to there. No point, no story.'],
   ['Situation','A reorganization in October gave the division managers full charge of day-to-day running. That frees the board to focus on policy and planning.'],
   ['Complication','But the board has spent so long on short-term operating problems that it isn’t ready to focus on long-range strategy.'],
   ['Question','It isn’t written out, but the reader now asks it: <i>What must the board change to do that?</i>'],
   ['Answer','Hand day-to-day matters to the executive committee, add outside members, and set up policies and procedures for how it works.']],
   'Same subject, but now the purpose and the message are clear in a few lines.');}},
{part:2,src:'Chapter 2 · The introductory flow',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Which part of Nadia’s introduction is this sentence? “But this year Mill Lane ran out of room, and late orders have climbed to 15%.”</h1>');
  L.mc(L.card,['Complication','Situation','Answer'],0,
   'It’s what happened next: the change that creates tension and raises Theo’s question.',
   'The Situation is the stable background Theo already accepts. This sentence is the change that disturbs it: the Complication.');}},
{part:2,src:'Chapter 2 · The introductory flow',pts:1,run(L){
  L.h(L.kick('pr','Tell the story')+'<h1 class="q">Put Nadia’s introduction for Theo in the right order.</h1>');
  L.order(L.card,['Mill Lane has shipped every online order since the shop opened.','This year it ran out of room, and late orders rose from 4% to 15%.','What should we do about it?','Rent overflow space near Mill Lane before the winter peak.'],
   'Situation, Complication, Question, Answer. Theo nods along to the first two lines, and the last one answers the question Theo is now asking.',
   ['Situation','Complication','Question','Answer']);}},
{part:2,src:'Chapter 2 · The introductory flow',run(L){
  L.h(L.kick('learn','How the three fit together')+'<h1 class="q">Three substructures, one pyramid</h1>'+
   L.prose('Once you state the Answer, your '+L.g('main-point','Main Point')+', it raises a new question. The Key Line below answers it, and the dialogue carries on. Each substructure helps you find the ideas you need:')+
   L.list([['down','Vertical','Tells you what the ideas below must say: they must answer the question.'],
           ['layers','Horizontal','Tells you whether they say it logically: a proper deductive or inductive group.'],
           ['chat','The reader’s question','Most important of all: it keeps every idea relevant. An idea belongs only if it helps answer that question.']],2));
  L.done();}},
{part:2,src:'Chapter 2 · The introductory flow',pts:6,run(L){
  L.h(L.kick('pr','Keep or cut?')+'<h1 class="q">Theo’s question is “What should we do about late online orders?” Which of Nadia’s notes belong in the memo?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Keep','Cut'],[
   ['Overflow space can be ready before the winter peak',0,'It supports the answer to Theo’s question.'],
   ['Mill Lane’s staff room was repainted in May',1,'True, but it helps answer nothing Theo is asking.'],
   ['A logistics firm would need six months to take over',0,'It shows why another option is slower, which bears on what to do.'],
   ['Climbing kit was the fastest-growing online category',1,'Interesting, but it doesn’t help decide what to do about late orders.'],
   ['Late orders now lead to refunds every week',0,'It shows why the question matters, so it belongs in the story.'],
   ['How Fellwick chose the site of its first store',1,'Old history that answers no question Theo has.']],
   'The question is the filter. Every note that stays is there because it helps answer it.');}},
{part:2,src:'Chapter 2 · The introductory flow',pts:1,run(L){
  L.h(L.kick('pr','Fix the memo')+'<h1 class="q">Nadia’s memo opens with “Background”, then “Our findings”. Theo replies: “So what do you want me to do?” What should Nadia change first?</h1>');
  L.mc(L.card,['Add more findings, so the case looks stronger','Cut the findings and keep just the background','Lead with a short S-C-Q story, then the Answer'],2,
   'The story reminds Theo of the question they already have, and the Answer meets it right away.',
   'The trouble isn’t how much Nadia says but where the memo starts. A Situation, Complication and Question lead Theo straight to Nadia’s Answer.');}}
  ]
});
</script>
</body>
</html>
