<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Summarizing Grouped Ideas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0008', title:'Summarizing grouped ideas', minutes:20, icon:'layers',
  goals:['Replace blank top lines like “There are three problems” with a real point','Word actions as end products and sum them up by their effect','Find what a list of findings has in common and make the inductive leap'],
  parts:['Blank assertions','Action ideas','Situation ideas','The leap'],
  read:'Read chapter 7 of the book for the full overdue-accounts story, the planning-system example and the car-parts market case.',
  glossary:{
    'end-product':'End product: what you will have in your hand once an action is done, so anyone can tell whether it has been done.',
    'action-idea':'Action idea: a statement that tells the reader to do something (a step, a recommendation, an objective).',
    'situation-idea':'Situation idea: a statement that tells the reader something is the case (a reason, a problem, a finding).',
    'inductive-leap':'Inductive leap: stating the new insight that a group of similar ideas points to, beyond what any one of them says.'
  },
  cheatsheet:[
    'The point above a group must sum up the group. Summing up is where the thinking gets finished.',
    'Ban blank top lines (“There are three problems”, “We recommend five changes”). They hide unfinished thinking and bore the reader.',
    'First make sure the group is MECE and in a real order. Then look at what kind of idea it holds.',
    '<b>Actions:</b> word each one as an end product you could hold in your hand. Done <i>before</i> the next = same level; done <i>so that</i> the next can happen = a level below.',
    'Sum up actions by their <b>direct effect</b>. Ask: “I do these in order to make what happen?”',
    '<b>Findings:</b> look for the same kind of subject, the same kind of predicate, or the same kind of judgment. Then look for closer links.',
    'Make the inductive leap: say what the similarity implies. If two points aren’t alike, they may form a “therefore” chain. Finish it.',
    'Ask of every group: “Why these ideas and no others?” Shared feature → state the insight. Joint actions → state the effect.'
  ],
  steps:[
/* ---------- PART 1: BLANK ASSERTIONS ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Theo reads the first line of Kenji’s email on their phone: “There are three problems with the click-and-collect trial.” Then a store visit starts. What does Theo now know?</h1>');
  L.mc(L.card,['That problems exist, and not much else','What Kenji thinks needs changing first'],0,
   'Theo knows the number of problems, but not what they add up to. This lesson is about writing a top line that actually says something.',
   'Nothing in that line says what to change. Theo knows only that there are three problems. This lesson is about top lines that say something.');}},
{part:0,src:'Chapter 7 · opening',run(L){
  L.h(L.kick('learn','The first pyramid rule, up close')+'<h1 class="q">The idea on top must say what the group below adds up to</h1>'+
   L.prose('The first pyramid rule says each idea sums up the ideas below it. For a '+L.g('deduction','deductive')+' group that is easy: the summary leans on the final “therefore”. For an '+L.g('induction','inductive')+' group, the idea on top must say what the link between the ideas <i>implies</i>.')+
   L.quote('the act of summarizing the grouping is the act of completing the thinking.','Barbara Minto, chapter 7')+
   L.prose('Most writers skip this hard step. They fall back on lines like “Click-and-collect has three problems” or “We recommend five changes”. These name the <i>kind</i> of idea coming, not its content. The book calls them '+L.g('blank-assertion','intellectually blank assertions')+'.'));
  L.done();}},
{part:0,src:'Chapter 7 · Avoid intellectually blank assertions',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">Why “for three reasons” makes people talk past each other</h1>');
  L.beats(L.card,[
   ['On the radio','A speaker reports that a writer feels well placed to write a life of the poet Samuel Johnson, for three reasons.'],
   ['The reasons','The same humble background in the same county, the same university, the same taste in books.'],
   ['The reply','A second speaker disagrees with the first reason only. Everyone laughs, and the talk moves on.'],
   ['What went wrong','“For three reasons” gave listeners no idea to hold. So they took the first reason for the main point and barely heard the other two.'],
   ['The fix','Say the point first: the writer and Johnson are essentially <b>the same kind of person</b>. Then the reasons support it, and a reply would answer that point.']],
   'A blank line leaves the reader with no idea to anchor on. A real summary tells them what to think about the points before they read them.');}},
{part:0,src:'Chapter 7 · Avoid intellectually blank assertions',run(L){
  L.h(L.kick('learn','Blank lines hide unfinished thinking')+'<h1 class="q">The worse harm is to the writer</h1>'+
   L.prose('In the book, a writer had “The company has two organization problems.” When pushed to say how the two were alike, the writer found they really meant “areas where more <b>delegation</b> is needed”. There were four such areas, not two. The real point: the company can’t delegate authority. Now they could work on a fix.')+
   L.prose('A true summary also moves your thinking on. You can comment on it (deduction) or look for more ideas like it (induction). But first you need two things: a valid group, and the kind of idea it holds.')+
   L.lanes([['play','Action ideas','Tell the reader to do something. <b>Sum up by the effect</b> of doing them.',2],
            ['eye','Situation ideas','Tell the reader that something is so. <b>Sum up by what their likeness implies.</b>',3]]));
  L.done();}},
{part:0,src:'Chapter 7 · Avoid intellectually blank assertions',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Which of these top lines for Nadia’s memo is <i>not</i> intellectually blank?</h1>');
  L.mc(L.card,['Click-and-collect has three problems','Our review found four key issues','Stores can’t find orders fast enough'],2,
   'It makes a claim the reader can test and ask “Why?” about.',
   '“Three problems” and “four key issues” only say how many points are coming. “Stores can’t find orders fast enough” is the only real claim.');}},
{part:0,src:'Chapter 7 · Avoid intellectually blank assertions',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Blank assertion or real summary?',['Blank assertion','Real summary'],[
   ['“We recommend five changes to the Mill Lane warehouse.”',0,'It says how many, not what the changes achieve.'],
   ['“Late orders come from one cause: picking can’t keep up at peak.”',1,'It states a cause the reader can check.'],
   ['“There are several factors behind the winter slump.”',0,'Every slump has factors. It says nothing about these ones.'],
   ['“Boot returns doubled because customers can’t pick the right size online.”',1,'A specific claim that the points below can support.'],
   ['“Leah’s analysis raised a number of questions.”',0,'It names the kind of idea, not the ideas.']]);}},

/* ---------- PART 2: ACTION IDEAS ---------- */
{part:1,src:'Chapter 7 · State the effect of actions',run(L){
  L.h(L.kick('learn','Action ideas')+'<h1 class="q">Actions only link up through the effect they produce</h1>'+
   L.prose('Most ideas in business writing are '+L.g('action-idea','actions')+': steps, recommendations, objectives, changes. They are hard to group, because every action looks alike (“We should…” plus a verb). You can only tell if actions belong together by the effect they are meant to have.')+
   L.list([['Word each one specifically','State it as an '+L.g('end-product','end product')+' you could hold in your hand.'],
           ['Separate the levels','Find the cause-and-effect groups, and keep each to five steps or fewer.'],
           ['Sum up directly','State the effect that carrying out the actions produces.']],1)+
   L.prose('“Improve profits” is too vague: a 10% rise and a 2% rise need different steps. “Improve profits by 10% by a set date” lets you check whether your steps will get you there.'));
  L.done();}},
{part:1,src:'Chapter 7 · Make the wording specific',run(L){
  L.h(L.kick('ex','A real example from the book')+'<h1 class="q">“Pursue overdue accounts”: what does that mean you do?</h1>');
  L.beats(L.card,[
   ['The draft','A writer proposed a new process for overdue accounts: six vague steps, starting with “identify and pursue overdue accounts”.'],
   ['Pressed to explain','They drew a chart of the accounts by how late and how large they were. One month late: send the normal bill. Two: a note. Three: a salesperson calls. Four: a director calls. Older: a collection agency.'],
   ['Rewritten','“Reduce accounts receivable: 1. Sort the accounts by age and amount. 2. Assign who collects by how serious each one is.”'],
   ['Still not right','One paid bill already “reduces accounts receivable”. And neither step gets a bill paid. What will the company hold at the end? <b>A system for following up overdue accounts.</b>'],
   ['The payoff','With that end product in view, a gap shows: a system needs a follow-up step too, such as telling salespeople to stop calling on customers who never pay.']],
   'Picture someone doing the action and ask what they hold at the end. Word the step as that end product, and missing steps become visible.');}},
{part:1,src:'Chapter 7 · Make the wording specific',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Which click-and-collect step is worded as an end product?</h1>');
  L.mc(L.card,['Improve the pickup experience for customers','Set up a labelled pickup shelf in every store','Strengthen how stores handle pickup orders'],1,
   'You can walk into a store and see whether the shelf is there. You know when the step is done.',
   '“Improve” and “strengthen” give no point at which the step is done. A labelled shelf in every store is something you can check.');}},
{part:1,src:'Chapter 7 · Make the wording specific',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Late orders keep slipping through at Mill Lane. Tap each piece until Nadia’s step is a clear end product.</h1>');
  L.sentence(L.card,[['Look into','Set up','Improve'],['order handling','a list of unpicked orders','warehouse performance'],['sent to the shift lead','shared more widely'],['by 10 a.m. each day','over time']],[1,1,0,0],
   [['“Look into” has no end point. When is it done?','“Improve” never ends either. Name the thing you will have.'],['Too broad to picture. What would you hold in your hand?','Performance isn’t a thing you can hand to someone.'],['Shared with whom? A vague audience means nobody acts.'],['“Over time” gives no cutoff, so nobody can tell if it worked.']],
   'Anyone can check this step: at 10 a.m. the shift lead either has the list or doesn’t.');}},
{part:1,src:'Chapter 7 · Distinguish the levels of action',run(L){
  L.h(L.kick('learn','Separate the levels')+'<h1 class="q">“Before” or “so that”: the test for which level a step belongs on</h1>'+
   L.prose('Most people list every step in the order they will be done. That mixes causes and effects on one level.')+
   L.lanes([['arrow','Same level','You expect the reader to do it <b>before</b> the next step.',2],
            ['down','One level lower','You expect the reader to do it <b>so that</b> they can do the next step.',4]])+
   L.prose('The book shows a ten-step telecoms program regrouped into three steps, each with its sub-steps. Now a reader grasps it at a glance, and gaps show up.')+
   L.note('Don’t overdo it. Labelling actions “Tasks”, “Objectives” and “Benefits” doesn’t help. Nothing marks an action as one or the other, so the labels lead to repeats. Organize around end products instead.','alert'));
  L.done();}},
{part:1,src:'Chapter 7 · Distinguish the levels of action',pts:6,run(L){
  L.h(L.kick('pr','Find the levels')+'<h1 class="q">Nadia’s launch list has six flat steps. Each one is done <i>so that</i> one of three bigger results happens. Sort them.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Stores can hand over orders','Stores receive orders daily','Customers know about it'],[
   ['Fit a pickup shelf behind each counter',0,'The shelf is there so that staff can hand orders over.'],
   ['Add a store run to the daily van schedule',1,'The van run gets the orders to the stores.'],
   ['Email online customers about the new option',2,'This makes customers aware they can collect.'],
   ['Train counter staff on the handover routine',0,'Training lets staff hand over orders smoothly.'],
   ['Pack each order in a labelled bag at Mill Lane',1,'Labelled bags arrive ready to shelve.'],
   ['Put posters in every store window',2,'Posters tell passing customers about it.']],
   'Six flat steps become three end-product steps with two sub-steps each. Now Nadia can check each set: is anything missing to make that result happen?');}},
{part:1,src:'Chapter 7 · Summarize directly',run(L){
  L.h(L.kick('ex','A real example from the book')+'<h1 class="q">From “improve sales” to a point worth reading</h1>');
  L.beats(L.card,[
   ['The draft','“To improve sales in one city market, we should rank customers by revenue potential, decide how far to go in each area, and reassign salespeople to match.”'],
   ['Too weak','One extra sale “improves sales”. These steps aim at something more specific.'],
   ['The question','“I rank, decide and reassign <i>in order to</i> make what happen? If I don’t, what won’t happen?”'],
   ['The summary','<b>Focus our resources on the customers with the highest potential.</b> Now the reader asks “How?”, and the three steps answer it.'],
   ['Two rules','The group must be MECE. The summary states the <b>direct effect</b> of the actions, worded as an end product.']],
   'Sum up actions by their direct effect. Ask what doing them makes happen, then word that as an end product.');}},
{part:1,src:'Chapter 7 · Summarize directly',pts:1,run(L){
  L.h(L.kick('pr','Sum it up')+'<h1 class="q">Kenji plans to rank stores by weekly click-and-collect orders, work out the counter hours each store needs, and move staff hours to match. What should Kenji’s top line be?</h1>');
  L.mc(L.card,['Improve click-and-collect across the stores','Review counter staffing in all nine stores','Put counter staff where the orders are'],2,
   'That’s the direct effect of the three steps, and the reader will ask “How?”',
   '“Improve” would be true after one better pickup, and “review” describes only the first step. The direct effect of all three is staff placed where the orders are.');}},

/* ---------- PART 3: SITUATION IDEAS ---------- */
{part:2,src:'Chapter 7 · Look for the similarity in conclusions',run(L){
  L.h(L.kick('learn','Situation ideas')+'<h1 class="q">Listing is step one. Two more steps finish the thinking.</h1>'+
   L.prose(L.g('situation-idea','Situation ideas')+' are reasons, problems, findings. Calling them “problems” only sets them apart from all other problems. That reveals nothing yet.')+
   L.flow([['list','1 · List','Points that may be worth thinking about'],['layers','2 · Find the link','Prove they belong together'],['bulb','3 · Say what it means','The new idea the link implies']])+
   L.prose('Every sentence has a <b>subject</b> and a <b>predicate</b> (what it says about the subject). So the link usually shows as the same <i>kind</i> of subject, the same kind of predicate, or the same kind of judgment. If the subjects are all identical, look in the predicates. If the predicates are identical, look at the subjects. If neither, look at the judgment the sentences imply.'));
  L.done();}},
{part:2,src:'Chapter 7 · Find the structural similarity',run(L){
  L.h(L.kick('ex','A real example from the book')+'<h1 class="q">Elegant words, no message</h1>');
  L.beats(L.card,[
   ['The draft','“There are four characteristics of the new planning and control system,” followed by four well-written sentences.'],
   ['Strip the language','Every subject is the same: the plans or the planning system. So the link must be in the predicates.'],
   ['The predicates','The system is annual, integrated, top-down, and separates current practice from planned change.'],
   ['So what?','Nothing. Four true points don’t make a message. The blank top line stopped anyone thinking further.'],
   ['After rewriting','The real point: the new system is meant to focus every unit on improving profits, by requiring annual profit plans, coordinating them, and holding managers to them.']],
   'If you can’t find a clear link between the ideas in a group, something is wrong with the group, and more thinking is needed.');}},
{part:2,src:'Chapter 7 · Find the structural similarity',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Leah’s four findings all begin “The pickup counter…”. Where should Leah look for what they have in common?</h1>');
  L.mc(L.card,['In what each one says about the counter','In who or what each finding is about','In the judgment each finding implies'],0,
   'The subjects are identical, so the link must be in the predicates.',
   'Every finding is about the same subject, the counter, so the subjects can’t separate them. Look at what each one says about it: the predicates.');}},
{part:2,src:'Chapter 7 · Look for closer links',pts:1,
 solve:async L=>{L.$('#sp').click();},
 run(L){
  const F=[['Pickup wait times per store should be updated weekly','should be updated',1],['Figures on uncollected orders are now needed','is needed',0],['Data on which products people collect should be gathered','should be gathered',0],['The current count of orders per store is not reliable','is not reliable',1],['Customer feedback after pickup is needed','is needed',0]];
  L.h(L.kick('pr','Strip it bare')+'<h1 class="q">Theo wants monthly updates on the launch. Leah lists five complaints about the data. Strip the language and look for closer links.</h1>'+
   '<div id="fl">'+F.map((f,j)=>'<div class="res" style="margin:6px 0"><b>'+(j+1)+'.</b> <span>'+f[0]+'</span></div>').join('')+'</div>'+
   '<button class="btn pri" id="sp" style="margin-top:10px">'+L.ic('eye')+'Strip the language</button><div id="sq"></div>');
  L.$('#sp').onclick=function(){this.remove();
    L.$('#fl').innerHTML=F.map((f,j)=>'<div style="margin:6px 0"><span class="chip static'+(f[2]?'':' ok')+'">'+(j+1)+' · the data '+f[1]+'</span></div>').join('')+
     '<p class="small" style="margin-top:8px"><b>Two groups:</b> data that doesn’t exist yet (2, 3, 5), and data that exists but isn’t good enough (1, 4).</p>';
    const q=L.$('#sq');q.innerHTML='<h2 class="sub">Why these two groups and no others? What should Leah’s top line say?</h2>';
    L.mc(q,['There are five problems with our launch data','Our data can’t yet show how the launch is going','The stores need better dashboards before March'],1,
     'Both groups make the data useless for tracking the launch. And now Leah can check for a third gap: data that exists and is good, but is badly presented.',
     'Five problems is a blank line, and dashboards jump to a fix nobody tested. What the two groups share is that the data can’t track the launch.');};}},

/* ---------- PART 4: THE LEAP ---------- */
{part:3,src:'Chapter 7 · Make the inductive leap',run(L){
  L.h(L.kick('learn','The inductive leap')+'<h1 class="q">When the link is hard to see, picture where it comes from</h1>'+
   L.prose('Sometimes what a group implies isn’t obvious. Putting it into words takes an '+L.g('inductive-leap','inductive leap')+'. The springboard is usually a picture of what the ideas describe.')+
   L.prose('Watch out for lists that look like findings but are really actions in disguise. In the book, “four variables to manage” turned out to be four steps toward one effect. Try stating each one more specifically. If you can picture the effect they achieve together, switch to summing up by that effect.')+
   L.note('Ask of every group: <b>“Why have I brought together these ideas and no others?”</b> If they share a feature, state the insight it implies. If they are the actions that together produce an effect, state the effect.','bulb'));
  L.done();}},
{part:3,src:'Chapter 7 · Make the inductive leap',run(L){
  L.h(L.kick('ex','A real example from the book')+'<h1 class="q">Should the client enter the car-parts market?</h1>');
  L.beats(L.card,[
   ['The list','A consultant’s five conclusions on the market for replacement car parts: large, growing, profitable, favorable trends, but high barriers to entry, unclear outlook for some segments, and very fragmented.'],
   ['Two kinds','The positives sum up at once: the market is <b>attractive</b>. Picture it as a circle.'],
   ['Draw the negatives','Fragmented: the circle has segments. Unclear outlook: some segments look different. Barriers: a line that blocks the way in.'],
   ['Two conclusions','Only some parts of the market are attractive, and those will be hard to get into.'],
   ['Not alike','Being attractive and being hard to enter share nothing, so they can’t form an inductive group. They form a chain: this, and this, <b>therefore…</b> what?'],
   ['Never finished','Give up? Buy your way in? Hire the consultant for a careful entry plan? The presentation never said.']],
   'The leap starts from a picture of what the ideas describe. And if the points form a “therefore” chain, carry it all the way to its conclusion.');}},
{part:3,src:'Chapter 7 · Summarizing grouped ideas',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Nadia’s group: fit pickup shelves, train counter staff, add a store run to the van schedule. These are the actions that together make click-and-collect work. What should the line above them state?</h1>');
  L.mc(L.card,['The insight their similarity points to','The direct effect of doing all three','How many steps the launch will need'],1,
   'Actions are summed up by their effect, here something like “Every store can hand over click-and-collect orders.”',
   'Insights come from findings that share a feature. A step count is a blank line. A group of actions is summed up by the effect they produce together.');}},
{part:3,src:'Chapter 7 · Summarizing grouped ideas',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'How should each group be summed up?',['State the effect','State the insight'],[
   ['Three steps to move stock to Quarry Road, if the board approves',0,'Steps are actions. Sum them up by what they achieve.'],
   ['Five findings on why boot returns doubled',1,'Findings share a feature. Say what that likeness implies.'],
   ['“Four variables” in the launch: timing, who does what, what information they need, who decides',0,'Actions in disguise. Stated specifically, they are steps toward one effect.'],
   ['Four reasons Imani doubts the Quarry Road budget',1,'Reasons are situation ideas. Find what they have in common.'],
   ['Kenji’s three recommendations for the city stores this winter',0,'Recommendations are actions, so state their direct effect.']]);}},
{part:3,src:'Chapter 7 · Make the inductive leap',pts:1,run(L){
  L.h(L.kick('pr','Make the leap')+'<h1 class="q">On the winter slump, Kenji notes: shoppers try boots on in the city stores, then order them online; city-store sales fell 9% while online grew 20%; customers ask staff to check online stock. What is the best top line?</h1>');
  L.mc(L.card,['The city stores have three issues this winter','City stores are becoming showrooms for online','The city stores should shorten winter hours'],1,
   'All three notes show customers using the store to look and the website to buy. Saying so is the inductive leap.',
   '“Three issues” is a blank assertion. Shorter hours is an action the notes don’t support. What the notes share is shoppers looking in store and buying online.');}}
  ]
});
</script>
</body>
</html>
