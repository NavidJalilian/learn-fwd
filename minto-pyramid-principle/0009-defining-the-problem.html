<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Defining the Problem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0009', title:'Defining the problem', minutes:20, icon:'compass',
  goals:['Lay out any problem as an Opening Scene, a Disturbing Event, an R1 and an R2','Work out the reader’s real question from how far they’ve got with a solution','Turn the problem layout into a Situation, Complication and Question'],
  parts:['Problem documents','The framework','The question','The introduction'],
  read:'Read chapter 8 of the book for the seven question patterns drawn out in full, and Appendix B for complete sample introductions.',
  glossary:{
    'r1':'R1 (Undesired Result): the result the reader is getting now and doesn’t like, such as falling sales.',
    'r2':'R2 (Desired Result): the result the reader wants instead, stated as specifically as possible, ideally with a number.',
    'opening-scene':'Opening Scene (or Starting Point): the part of the business where the problem started, pictured as a structure or process at a set time and place.',
    'disturbing-event':'Disturbing Event: what happened, or could happen, to upset the Opening Scene and bring about the undesired result.'
  },
  cheatsheet:[
    'Long problem documents answer one of three questions: <b>What should we do? Should we do it? How should we do it?</b>',
    'Work in four stages: define the problem → structure the analysis → find the solution → build the pyramid.',
    'A problem is a gap between <b>R1</b> (the result you get) and <b>R2</b> (the result you want).',
    'Lay it out: <b>Opening Scene</b> + <b>Disturbing Event</b> (the Situation), then R1 and R2. State R2 in numbers or a clear end state.',
    'Before choosing the Question, check how far the reader has got: no solution, a suggested one, an accepted one, a failed one, or several to pick from.',
    'To write the introduction, read the layout left to right and down. <b>The last thing the reader knows is the Complication.</b>',
    'Alternatives go in the Complication, and only if the reader already knows them. Never raise options just to knock them down.'
  ],
  steps:[
/* ---------- PART 1: PROBLEM DOCUMENTS ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Theo asks Nadia for a full report on late online orders. Nadia has 40 pages of figures and interview notes. What should Nadia do first?</h1>');
  L.mc(L.card,['Write up the findings in the order they were found','Pin down exactly what problem the report must solve'],1,
   'With a pile of facts, the risk is drowning in them. Knowing the exact problem tells Nadia which facts matter. This lesson shows a tidy way to pin it down.',
   'Writing up in the order of discovery is how points get buried. First Nadia needs to know exactly what problem the report solves. This lesson shows how.');}},
{part:0,src:'Introduction to Part 3',run(L){
  L.h(L.kick('learn','Why problem documents are harder')+'<h1 class="q">Short notes get easier with practice. Big reports don’t, unless you prepare</h1>'+
   L.prose('With practice, the '+L.g('scq','Situation–Complication–Question')+' opening becomes second nature for short notes. Long reports, proposals and project plans are different. There has usually been a long stretch of data gathering, several people may be writing, and it’s easy to be buried in facts before you know your message.')+
   L.prose('Most of these documents answer one of three questions, depending on what the reader already knows:')+
   L.list([['bulb','What should we do?','No solution is known yet.'],['scale','Should we do it?','A solution has been suggested.'],['list','How should we do it?','The solution is known and accepted.']],1));
  L.done();}},
{part:0,src:'Introduction to Part 3',run(L){
  L.h(L.kick('learn','Four stages, in order')+'<h1 class="q">Do the thinking in a fixed order, and the pyramid almost builds itself</h1>'+
   L.flow([['compass','Define','the problem','',1],['tree','Structure','the analysis','',2],['flask','Analyze','find the solution','',3],['layers','Pyramid','write it up','',4]])+
   L.prose('The book’s secret for writing reports efficiently: get the first two stages right. If you define the problem and plan your analysis carefully, the results drop easily into a '+L.g('pyramid','pyramid')+'.')+
   L.prose('It isn’t simple. The history of a problem is often muddled, there’s far too much data, and lots of “solutions” compete for attention. This chapter gives you a framework for the first stage. The next lesson covers the second.'));
  L.done();}},
{part:0,src:'Chapter 8 · Defining the Problem',run(L){
  L.h(L.kick('ex','Five questions in sequence')+'<h1 class="q">How the five problem-solving questions split into the stages</h1>');
  L.beats(L.card,[
   ['Question 1','<b>Is there a problem</b> (or an opportunity), or is one likely? Fellwick: late online orders went from 4% to 15%. Yes.'],
   ['Question 2','<b>Where does it lie?</b> In online orders shipped from the Mill Lane warehouse. Questions 1 and 2 <b>define the problem</b>.'],
   ['Question 3','<b>Why does it exist?</b> A full warehouse? Slow picking at peak? The spring courier change? This is where you <b>structure the analysis</b>.'],
   ['Questions 4 and 5','<b>What could we do</b> about it, and <b>what should we do</b>? These <b>find the solution</b>.'],
   ['On the page','When Nadia writes it up, the answers to 1 and 2 become the introduction. The answers to 3, 4 and 5 become the points of the pyramid.']],
   'Define (1–2), structure (3), solve (4–5). The definition turns into the introduction; the rest turns into the pyramid.');}},
{part:0,src:'Chapter 8 · Defining the Problem',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Which answers end up in the introduction of Nadia’s report?</h1>');
  L.mc(L.card,['Why it exists, and what could be done','What could be done, and what should be','Whether there’s a problem, and where it lies'],2,
   'Questions 1 and 2 define the problem, and the definition becomes the introduction.',
   'The causes and solutions (questions 3 to 5) become the points of the pyramid. The introduction holds the answers to 1 and 2: is there a problem, and where is it?');}},
{part:0,src:'Chapter 8 · Defining the Problem',pts:5,run(L){
  L.h(L.kick('pr','Which stage?')+'<h1 class="q">Imani jots down questions about late orders. Which stage does each belong to?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Define','Structure','Solve'],[
   ['Are late orders really rising, or was spring a blip?',0,'“Is there a problem?” is question 1, which defines the problem.'],
   ['Is it online orders from Mill Lane, or store deliveries too?',0,'“Where does it lie?” is question 2, still defining.'],
   ['Why are parcels leaving Mill Lane late?',1,'“Why does it exist?” is question 3, where you structure the analysis.'],
   ['Could we rent space, move, or hand orders to a third party?',2,'“What could we do?” is question 4, finding the solution.'],
   ['Which of those options should Theo approve?',2,'“What should we do?” is question 5, the end of the search for a solution.']],
   'Questions 1–2 define, 3 structures the analysis, 4–5 find the solution.');}},

/* ---------- PART 2: THE FRAMEWORK ---------- */
{part:1,src:'Chapter 8 · Defining the Problem',run(L){
  L.h(L.kick('learn','A problem is a gap')+'<h1 class="q">You don’t like the result you’re getting, and you want a different one</h1>'+
   L.prose('When you say “we have a problem,” you’re noticing a gap. Some situation gives you a result you don’t like: the '+L.g('r1','Undesired Result, R1')+'. You want a different one: the '+L.g('r2','Desired Result, R2')+'.')+
   L.flow([['home','Situation','what’s going on','',1],['alert','R1','sales are falling','',4],['target','R2','sales are growing','',2]])+
   L.prose('The solution is whatever gets you from R1 to R2. And because the gap grew out of a real situation, you need its history to see what the gap is and why it matters.'));
  L.done();}},
{part:1,src:'Chapter 8 · Problem-Definition Framework',run(L){
  L.h(L.kick('ex','The book’s example')+'<h1 class="q">A sales team that stopped growing, laid out piece by piece</h1>');
  L.beats(L.card,[
   ['Opening Scene','For 30 years a company has sold industrial property the same way: list the prospects, write a sales script, deliver it. This structure or process is the <b>Opening Scene</b>.'],
   ['Desired Result (R2)','That process has delivered about 10% sales growth every year. The company wants that to continue.'],
   ['Disturbing Event','Going into the last quarter, the company works out its projected sales. That calculation is the event that brings the trouble to light.'],
   ['Undesired Result (R1)','The projection shows sales down 10%, not up 10%. Growth is under threat.'],
   ['Where to look','The causes usually lie in the activities of the Opening Scene. So: the list may be out of date, the script may be weak, or the delivery may not work.']],
   'Situation (Opening Scene + Disturbing Event), then R1 and R2. Once that’s laid out, you know where to look for causes.');}},
{part:1,src:'Chapter 8 · Lay out the problem',run(L){
  L.h(L.kick('learn','Think of it as a play')+'<h1 class="q">The curtain opens on a scene, then something disturbs it</h1>'+
   L.list([['home','Opening Scene','The curtain opens on one part of the business, at a set time and place: a structure or process you can picture. Keep it short, as if you were starting to tell a friend the story.'],
     ['alert','Disturbing Event','Something happens, or could happen, that upsets that scene and brings about the R1.'],
     ['x','R1 · what don’t we like?','The problem the reader faces, or an opportunity they could take. State it briefly.'],
     ['target','R2 · what do we want instead?','The result the reader wants in place of R1.']],1)+
   L.note('Three questions to answer: <b>What’s going on?</b> (the Situation) <b>What don’t we like about it?</b> (R1) <b>What do we want instead?</b> (R2)','compass'));
  L.done();}},
{part:1,src:'Chapter 8 · Lay out the problem',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Nadia writes: “This year the share of online orders arriving late has risen from 4% to 15%.” Which part of the framework is this?</h1>');
  L.mc(L.card,['R1, the undesired result','The Opening Scene','R2, the desired result'],0,
   'It’s the result Fellwick is getting and doesn’t like.',
   'The Opening Scene is the setup (Mill Lane serving stores and online orders). R2 is what Fellwick wants instead. A late-order rate of 15% is the result they don’t like: R1.');}},
{part:1,src:'Chapter 8 · The Disturbing Event',run(L){
  L.h(L.kick('learn','Disturbing Events and R2s')+'<h1 class="q">Where the disturbance comes from, and how sharp the R2 must be</h1>'+
   L.prose('A '+L.g('disturbing-event','Disturbing Event')+' comes from one of three places:')+
   L.tiers([['arrow','External','A change outside the company: a new competitor, new technology, a shift in customer or government policy.'],
            ['home','Internal','A change the company made: a new process, a new computer system, a new market, a new product line.'],
            ['eye','Recently recognized','New evidence that change is needed: lagging performance, poor results, research hinting customers’ attitudes are shifting.']])+
   L.note('Can’t tell what set it off? Don’t invent a Disturbing Event. Go straight to R1.','info')+
   L.prose('State R2 as specifically as you can, ideally with a number or a clear end state, so you’ll know when you’ve reached it. Without that, you can’t choose between solutions. If you can’t state it yet, write the general state you want, and make finding the exact R2 your first step.'));
  L.done();}},
{part:1,src:'Chapter 8 · Lay out the problem',pts:6,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Lay out the late-orders problem',['Opening Scene','Disturbing Event','R1','R2'],[
   ['One warehouse on Mill Lane stocks the 9 stores and ships every online order.',0,'That’s the structure the curtain opens on.'],
   ['Online orders grew fast this year, and the warehouse ran out of room.',1,'Something happened that upset the setup. That’s the Disturbing Event.'],
   ['Customers are getting their parcels late far more often than before.',2,'That’s the result Fellwick doesn’t like.'],
   ['No more than 4% of online orders arrive late, even at peak.',3,'A specific result Fellwick wants instead, with a number to check against.'],
   ['Staff pick store orders and online orders from the same shelves.',0,'Part of how the operation works today: the setup, not a change to it.'],
   ['Some customers have stopped ordering online after a late parcel.',2,'Another undesired result. A problem can have more than one R1.']]);}},
{part:1,src:'Chapter 8 · The Disturbing Event',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'What kind of Disturbing Event?',['External','Internal','Recently recognized'],[
   ['A rival chain starts offering next-day delivery on all outdoor gear.',0,'A new competitor move, outside Fellwick’s control.'],
   ['Fellwick switches its online shop to a new ordering system.',1,'A change Fellwick made itself.'],
   ['A customer survey hints that shoppers now expect delivery within two days.',2,'Research suggesting attitudes may be shifting.'],
   ['Fellwick launches click-and-collect in all 9 stores.',1,'A new process Fellwick chose to add.'],
   ['Monthly reports show picking times falling further behind target.',2,'Evidence of lagging performance that says change is needed.']]);}},
{part:1,src:'Chapter 8 · R2 (Desired Result)',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Tap each piece until the sentence is an R2 that Nadia could check.</h1>');
  L.sentence(L.card,[['The warehouse team','Late online orders'],['fall back below 4%','become less of a worry'],['as soon as we can','by the November peak']],[1,0,1],
   [['R2 is a result, not a group of people to blame. Name the result you want to change.'],['Too vague. Nobody could tell when it’s been reached. Use a number or a clear end state.'],['That gives no end point to check against. Name when the result must hold.']],
   'A number and a deadline. Now Nadia can test each possible solution: does it get late orders under 4% by the peak?');}},

/* ---------- PART 3: THE QUESTION ---------- */
{part:2,src:'Chapter 8 · Look for the Question',run(L){
  L.h(L.kick('learn','Where does the reader stand?')+'<h1 class="q">The question depends on how far the reader has got with a solution</h1>'+
   L.prose('A big mistake writers make is not checking whether the reader has <b>already taken some action</b>. Does the reader just want to get from R1 to R2? Or have they already picked a way to do it? The book lists seven positions:')+
   L.tiers([['star','Most common','1 · They don’t know how to get from R1 to R2.<br>2 · They think they know, but aren’t sure.<br>3 · They know the solution, but not how to carry it out.','',true,'Most often'],
            ['cycle','Variations','4 · They tried a solution and it didn’t work.<br>5 · They have several solutions and can’t pick one.'],
            ['info','Possible but rare','6 · They know R1 but can’t state R2 clearly enough.<br>7 · They know R2 but aren’t sure if they’re at R1 (typical of benchmarking).']]));
  L.done();}},
{part:2,src:'Chapter 8 · Problem-Definition Framework',run(L){
  L.h(L.kick('ex','A problem with three layers')+'<h1 class="q">The book’s supermarket story: each failed fix becomes part of the history</h1>');
  L.beats(L.card,[
   ['Layer 1','A packaged-foods maker wants to test new products on supermarket shelves for a week before a full launch. The supermarkets say no.'],
   ['Fix 1','The maker offers a modest fee. The supermarkets accept.'],
   ['Layer 2','Years pass, supermarkets join into chains, and the fee climbs to $20,000 a week. The maker thinks that’s outrageous.'],
   ['Fix 2','A committee meets, can’t agree on anything else, and refuses to pay.'],
   ['Layer 3','Now the supermarkets refuse to allow the shelf tests at all.'],
   ['The introduction','Situation: everything from the fee to the refusal to pay. Complication: the supermarkets have now banned testing. Question: how should we respond?']],
   'Lay the history out in order, and even a messy past fits in a few sentences. The newest layer is the Complication.');}},
{part:2,src:'Chapter 8 · Look for the Question',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Suppose Theo accepts Nadia’s plan to rent overflow space near Mill Lane before the peak. What question should Nadia’s next paper answer?</h1>');
  L.mc(L.card,['What should we do about late orders?','How do we set up the overflow space?','Do we really have a problem?'],1,
   'Theo knows the solution and has accepted it. Their question is how to carry it out.',
   'Theo is past “what should we do?” and has no doubt there’s a problem. They’ve accepted a solution, so the question is how to carry it out.');}},
{part:2,src:'Chapter 8 · Look for the Question',pts:6,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which question does the reader have?',['What should we do?','Is it the right solution?','How do we carry it out?','Which alternative is best?','Do we have a problem?'],[
   ['Theo knows late orders are up and has no idea what to do about them.',0,'No solution yet, so it’s the simplest case: how do we get from R1 to R2?'],
   ['Imani has suggested a third-party logistics firm. Theo isn’t sure it’s the answer.',1,'A solution is on the table, but the reader doubts it.'],
   ['Suppose the board approves Quarry Road, and the move team needs a plan.',2,'The solution is accepted. Now they need to know how to do it.'],
   ['A Saturday picking shift started in summer, but late orders kept rising.',0,'A failed solution brings the reader back to “What should we do?”, now with a longer history.'],
   ['Quarry Road, overflow space and a third-party firm are all on Theo’s desk.',3,'Several known options, and the reader can’t pick one.'],
   ['Theo hears a rival delivers 98% of orders on time and wonders if Fellwick is behind.',4,'They know the R2 but aren’t sure they’re at an R1. That’s a benchmarking question.']]);}},

/* ---------- PART 4: THE INTRODUCTION ---------- */
{part:3,src:'Chapter 8 · Move to the Introduction',run(L){
  L.h(L.kick('learn','From layout to introduction')+'<h1 class="q">Read left to right and down. The last thing the reader knows is the Complication</h1>'+
   L.prose('The framework lays the parts out in roughly the order you need them. Turning it into an introduction is mostly reading it off.')+
   L.lanes([['home','No action yet','<b>S:</b> We have a process we like.<br><b>C:</b> It isn’t giving us what we want (R1, R2).<br><b>Q:</b> What should we do?',1],
            ['cycle','A fix already exists','<b>S:</b> We had a problem (R1, R2).<br><b>C:</b> We came up with a solution.<br><b>Q:</b> Is it right? Or, how do we carry it out?',2]])+
   L.prose('If the fix then failed, the failure becomes the new Complication, and the question goes back to “What should we do?”'));
  L.done();}},
{part:3,src:'Chapter 8 · Real-Life Example',run(L){
  L.h(L.kick('ex','The book’s real-life example')+'<h1 class="q">A household-goods retailer running out of warehouse room</h1>');
  L.beats(L.card,[
   ['Opening Scene','Three distribution centres plus some rented space, built to serve 490 stores. In practice they struggle to serve the current 438.'],
   ['Disturbing Event','Volume grows 4–5% a year, and 198 more stores are planned.'],
   ['R1 and R2','R1: out of capacity in 2 years. R2: enough capacity to cope, at the lowest capital and running cost, with the same speed and the same full product range.'],
   ['Where the reader stands','There are several ways to add room (expand centres, build a fourth or fifth, upgrade handling, keep using third parties), and each affects return on investment differently. That’s position 5: several solutions, which one?'],
   ['Introduction','S: we have a capacity problem. C: there are several ways to fix it, with different costs. Q: what should the distribution strategy be?'],
   ['Main Point','Add capacity step by step, to put off building a fourth warehouse as long as possible. Key Line: modify two existing centres, speed up materials handling, keep selected third-party arrangements.']],
   'Laid out first, a complicated capacity problem turned into a three-line introduction and a clear Main Point.');}},
{part:3,src:'Chapter 8 · Move to the Introduction',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Theo knows the whole story of late orders, and nothing has been tried yet. Reading Nadia’s layout left to right, what becomes the Complication?</h1>');
  L.mc(L.card,['The Opening Scene at Mill Lane','The late orders, R1, against R2','The question of what to do next'],1,
   'With no action taken, the last thing Theo knows is the gap: late orders at 15% when Fellwick wants under 4%.',
   'The Opening Scene comes first, in the Situation, and the Question comes after the Complication. The last thing Theo knows is the gap between R1 and R2, so that’s the Complication.');}},
{part:3,src:'Chapter 8 · Converting to an Introduction',pts:1,
 solve:async L=>{const c=L.$('#rd').children;c[0].click();c[1].click();},
 run(L){
  const EV=[['Opening Scene','Mill Lane stocks the 9 stores and ships every online order.'],['Disturbing Event','Online orders grew fast, and the warehouse ran out of room.'],['R1 and R2','Late orders rose from 4% to 15%. We want them back under 4%.'],['Fix tried','In summer we added a Saturday picking shift.'],['Fix failed','Late orders are still at 15%.']];
  const RD=[['Theo',5,'What should we do now?'],['A new board member',3,'What should we do?']];const seen=new Set();
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Same problem, two readers. Tap each reader and watch the introduction change.</h1><div id="rd"></div><div id="tl" style="margin:10px 0"></div><div id="iq"></div><div id="hq"></div>');
  const draw=k=>{const n=RD[k][1];
    L.$('#tl').innerHTML=EV.map((e,j)=>'<div class="small" style="padding:8px 10px;border-radius:12px;margin:4px 0;background:var(--soft);'+(j<n?'':'opacity:.35')+(j===n-1?';outline:2px solid var(--ok)':'')+'"><b>'+e[0]+'</b> · '+e[1]+(j<n?'':' <i>(doesn’t know)</i>')+'</div>').join('');
    L.$('#iq').innerHTML='<div class="prose" style="margin-top:8px"><b>S:</b> '+EV.slice(0,n-1).map(e=>e[1]).join(' ')+'<br><b>C:</b> '+EV[n-1][1]+'<br><b>Q:</b> '+RD[k][2]+'</div>';};
  RD.forEach((r,k)=>{const b=document.createElement('button');b.className='chip';b.innerHTML=L.ic('person')+r[0];b.onclick=()=>{[...L.$('#rd').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(k);draw(k);
    if(seen.size===2&&!L.$('#hq').innerHTML){const q=L.$('#hq');q.innerHTML='<h2 class="sub">Why did the Complication change?</h2>';
      L.mc(q,['The board member needs a shorter story','Theo cares more about the cost','Each reader knows a different last thing'],2,
       'The Complication is always the last thing the reader already knows. Theo knows the Saturday shift failed; the new board member’s story stops at the rise in late orders.',
       'Length and cost have nothing to do with it. The Complication is the last thing the reader knows, and the two readers know different amounts.');}};L.$('#rd').appendChild(b);});}},
{part:3,src:'Chapter 8 · Which alternative should we choose?',run(L){
  L.h(L.kick('learn','Alternatives in the introduction')+'<h1 class="q">Put alternatives in the Complication, and never set them up to knock them down</h1>'+
   L.prose('Alternatives go in the '+L.g('complication','Complication')+', and only if the reader already knows about them, usually because they raised the options themselves and want them weighed.')+
   L.lanes([['x','Avoid','“A is no good because… B is no good because… therefore do C.”',4],
            ['check','Do','“Do C, because it solves the problem,” with the reasons below it.',2]])+
   L.prose('The reason to do C is never that A and B are bad. It’s that C gets you to R2.'));
  L.done();}},
{part:3,src:'Chapter 8 · Move to the Introduction',pts:1,run(L){
  L.h(L.kick('pr','Build the introduction')+'<h1 class="q">Nadia writes to the board about the warehouse options. Put the introduction in order, reading the layout left to right and down.</h1>');
  L.order(L.card,['Mill Lane stocks our 9 stores and ships every online order.','Online orders grew fast this year, and the warehouse ran out of room.','Late orders rose from 4% to 15%; we want them under 4%.','You’ve asked us to weigh Quarry Road, overflow space and a third-party firm.','Which of the three should we choose?'],
   'Opening Scene, Disturbing Event, R1 and R2 make the Situation. The options the board already knows are the Complication, and the Question follows.',['S','S','S','C','Q']);}},
{part:3,src:'Chapter 8 · Which alternative should we choose?',pts:1,run(L){
  L.h(L.kick('pr','Review a draft')+'<h1 class="q">Leah drafts the Key Line: “Quarry Road costs too much. A third-party firm is too risky. So rent overflow space.” What should Nadia tell Leah?</h1>');
  L.mc(L.card,['Put the cheapest option first to keep the board calm','Argue that overflow space gets us to under 4% late','Add more reasons why the other two options fail'],1,
   'The case for overflow space is that it solves the problem, not that the others are bad.',
   'Knocking options down doesn’t prove the chosen one works. Leah should show how overflow space gets late orders back under 4%.');}},
{part:3,src:'Chapter 8 · Defining the Problem',pts:1,run(L){
  L.h(L.kick('pr','Reviewing someone else’s draft')+'<h1 class="q">Kenji sends Nadia a draft report on store deliveries. The framework helps Nadia review it too. Put the review steps in order.</h1>');
  L.order(L.card,['Lay out the parts of the problem','See where Kenji stands on a solution','Work out the right question','Check the introduction fits the problem','Check the pyramid answers the question'],
   'The same five steps work for writing your own document and for fixing one handed to you.');}}
  ]
});
</script>
</body>
</html>
