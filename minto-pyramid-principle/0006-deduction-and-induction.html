<!doctype html>

<title>Deduction and Induction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">

<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0006', title:'Deduction and induction: the difference', minutes:20, icon:'scale',
  goals:['Tell a deductive group from an inductive one in seconds','Choose actions-first induction for the Key Line, and know the rare cases for deduction','Check an inductive group with its plural noun and an inference that stays inside it'],
  parts:['Two patterns','Deduction','Which to use','Induction'],
  read:'Read chapter 5 of the book for its many sample deductive chains and the full test on Japanese businessmen and the Chinese market.',
  glossary:{
    'plural-noun':'Plural noun: one word that names the kind of idea in a group, such as reasons, steps or problems. The plural-noun test checks that it fits every idea in the group.',
    'rec-worksheet':'Recommendation worksheet: a table with three columns (what’s going wrong, what’s causing it, what to do about it) that holds the results of an analysis.'
  },
  cheatsheet:[
    'Sideways, ideas in a group relate in only two ways: <b>deductively</b> or <b>inductively</b>.',
    '<b>Deduction:</b> a statement, a second statement that comments on its subject or predicate, then the “therefore”. Summarize it with “because”, leaning on the last point.',
    'Deduction makes the reader hold every step before the payoff. Keep it low in the pyramid: at most four points, at most two “therefore”s chained.',
    'At the Key Line, put <b>actions before argument</b>: turn the findings–conclusions–recommendations worksheet 90° so the recommendations sit on top.',
    'Use deduction at the Key Line only when the Main Point is alien to what the reader expects, or they can’t grasp the action without the reasoning first.',
    '<b>Induction:</b> group like ideas under one <b>plural noun</b>, then infer what their sameness means. Check from the bottom up: does it follow, and only from these?',
    'Test: does point 2 comment on point 1? Deductive. Does it share point 1’s plural noun? Inductive. Neither? It’s news, not thinking. Cut it.'
  ],
  steps:[
/* ---------- PART 1: TWO PATTERNS ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Kenji says: “Every store that got its Friday delivery late had empty shelves on Saturday. Harbourside got its delivery late.” What follows?</h1>');
  L.mc(L.card,['Harbourside had empty shelves on Saturday','Harbourside should change its courier'],0,
   'Each point builds on the one before, and the conclusion drops out. That’s one of the two ways ideas can hang together. This lesson covers both.',
   'Nothing in Kenji’s two points is about couriers. What follows is only that Harbourside had empty shelves. Each point builds on the one before: that’s deduction, one of the two patterns in this lesson.');}},
{part:0,src:'Chapter 5 · Deduction and Induction: The Difference',run(L){
  L.h(L.kick('learn','Up, down and sideways')+'<h1 class="q">Ideas in a group are linked in only two ways</h1>'+
   L.prose('Ideas in a '+L.g('pyramid','pyramid')+' relate in three directions. The idea above sums up the ideas below. The ideas below explain or defend it. And sideways, the ideas in a group march in '+L.g('logical-order','logical order')+'.')+
   L.prose('What counts as logical order depends on how the group was formed. There are only two ways to form one:')+
   L.lanes([['arrow','Deductive','A line of reasoning: each point comes from the one before. <br><i>Birds fly. I am a bird. Therefore I fly.</i><br>Top: I fly, because I’m a bird.',1],
            ['layers','Inductive','Points that are the same kind of thing, plus an inference about that sameness. <br><i>French tanks are at the Polish border. German tanks are at the Polish border.</i><br>Top: Poland is about to be invaded.',2]])+
   '<p class="small" style="margin-top:10px">Deductive points derive from each other. Inductive points don’t.</p>');
  L.done();}},
{part:0,src:'Chapter 5 · Deduction and Induction: The Difference',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Imani lists: “Rent at Mill Lane is up. Courier fees are up. Overtime is up.” Top point: “Warehouse costs are rising on every front.” How is this group formed?</h1>');
  L.mc(L.card,['Deductively: each cost leads to the next','Inductively: three of the same kind of thing'],1,
   'All three are cost increases, and none comes from another. The top point is an inference about what they share.',
   'Rent doesn’t cause courier fees, and neither causes overtime. They’re three of a kind (rising costs), so the group is inductive.');}},

/* ---------- PART 2: DEDUCTION ---------- */
{part:1,src:'Chapter 5 · Deductive Reasoning: How It Works',run(L){
  L.h(L.kick('learn','How deduction works')+'<h1 class="q">Three moves: a statement, a comment on it, a “therefore”</h1>'+
   L.list([['Make a statement','About a situation that exists in the world.'],
     ['Make a second statement','About a related situation that exists at the same time. It relates to the first only if it <b>comments on its subject or its predicate</b> (what the first one says about the subject).'],
     ['State the implication','What follows from both being true at once: the “therefore”.']],1)+
   L.prose('To sum up a deductive group, put a sentence on top that leans on the last point, usually with “because”. The book’s examples: <i>because Socrates is a man, he is mortal</i>; <i>since the unions act as a monopoly, they should be controlled by the monopolies law</i>.'));
  L.done();}},
{part:1,src:'Chapter 5 · Deductive Reasoning: How It Works',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">Imani argues for Quarry Road, one step at a time</h1>');
  L.beats(L.card,[
   ['Statement','Any warehouse option that pays for itself within three years is worth doing.'],
   ['Comment','Quarry Road would pay for itself in two and a half years. This comments on the subject of the first statement: it says Quarry Road is one of those options.'],
   ['Therefore','Therefore Quarry Road is worth doing.'],
   ['Summary on top','“Because it pays for itself within three years, Quarry Road is worth doing.” It leans on the last point.'],
   ['Chaining','Imani could skip a step and chain two arguments, which the book allows if Theo would grasp and agree with the missing step. Spell out every step and the argument turns tedious.']],
   'The book’s complaint about deduction in writing: it turns a straightforward point into a mystery story.');}},
{part:1,src:'Chapter 5 · Deductive Reasoning: How It Works',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Kenji’s argument: “Stores need stock on shelves by Saturday morning. Friday deliveries reach stores mid-afternoon. Therefore Friday deliveries must arrive earlier.” Which top point sums it up?</h1>');
  L.mc(L.card,['Friday deliveries and Saturday stock are both issues','Because stock must be out by Saturday, deliveries must come earlier','Stores need more stock on Saturdays than other days'],1,
   'It states the “therefore” and gives the reason with “because”, which is how a deductive group is summed up.',
   'A deductive summary leans on the “therefore” and gives the reason. Calling things “issues” says nothing, and the third option isn’t in the argument at all.');}},
{part:1,src:'Chapter 5 · Deductive Reasoning: How It Works',pts:1,run(L){
  L.h(L.kick('pr','Put in order')+'<h1 class="q">Nadia’s deductive argument is scrambled. Tap the points in order.</h1>');
  L.order(L.card,['Peak-season orders need picking within a day','At Mill Lane, picking now takes two days at peak','Therefore Mill Lane can’t meet peak demand as it is'],
   'The second point comments on the first (picking time), and the third states what follows from both.',['Statement','Comment','Therefore']);}},

/* ---------- PART 3: WHICH TO USE ---------- */
{part:2,src:'Chapter 5 · Deductive Reasoning: When to Use It',run(L){
  L.h(L.kick('learn','A ponderous way to write')+'<h1 class="q">Deduction makes the reader carry every step before the payoff</h1>'+
   L.prose('The mind seems to like deduction for thinking, and it’s how most problem solving goes. So writers lay their reports out that way: here’s what’s going wrong, here’s what’s causing it, here’s what to do.')+
   L.flow([['alert','What’s wrong','A, B, C','hold all three',1],['eye','What causes it','A, B, C','match to the first',2],['target','What to do','A, B, C','finally!',3]])+
   L.prose('The reader must hold problems A, B and C, link each to its cause, then haul both to its fix. They wait a long time to learn what to do on Monday morning, and they relive your whole analysis first. So at the '+L.g('key-line','Key Line')+', the book urges: <b>present inductively</b>.'));
  L.done();}},
{part:2,src:'Chapter 5 · Deductive Reasoning: When to Use It',run(L){
  L.h(L.kick('learn','Same reasoning, different layout')+'<h1 class="q">Isn’t deduction stronger? No. It’s the same reasoning.</h1>'+
   L.prose('At the end of an analysis, your ideas fit on a '+L.g('rec-worksheet','recommendation worksheet')+': findings, then conclusions, then recommendations. (A finding and a conclusion differ only in how abstract they are.)')+
   L.prose('The reasoning in the worksheet is finished. The only choice is how to present it:')+
   L.lanes([['arrow','Deductively','One column at a time: all the problems, then all the causes, then all the actions.',1],
            ['layers','Inductively','Turn the sheet 90°. The recommendations go on the Key Line, each with its own finding and conclusion underneath.',2]])+
   L.note('Rule of thumb: put the <b>action before the argument</b>. The action is what the reader cares about.','target'));
  L.done();}},
{part:2,src:'Chapter 5 · Deductive Reasoning: When to Use It',pts:1,
 solve:async L=>{const g=L.$('#lt').children;g[0].click();g[1].click();},
 run(L){
  const R=[['Picking is slow at peak','Pickers walk long routes for one order','Pick several orders per walk'],['The warehouse is full','Slow-selling stock fills the aisles','Move slow sellers to overflow space'],['Orders miss the courier','The spring contract moved collection to 2pm','Accept a second daily collection']];
  const seen=new Set();
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Nadia’s worksheet on late online orders. View it both ways, and watch what Theo reads first.</h1><div id="lt"></div>'+
   '<div style="background:var(--soft);border-radius:16px;padding:14px;margin:8px 0 6px;min-height:170px"><div class="small" id="lc" style="margin-bottom:8px">Choose a layout above.</div><div id="lg"></div></div><div id="lq"></div>');
  const box=(t,top)=>'<div class="chip static'+(top?' ok':'')+'" style="display:block;margin:3px 0;white-space:normal">'+t+'</div>';
  ['Deductive layout','Inductive layout'].forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.innerHTML=L.ic(j?'layers':'arrow')+n;
    b.onclick=()=>{[...L.$('#lt').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(j);
      if(j===0){L.$('#lc').innerHTML='<b>Key Line:</b> three columns, read in turn';
        L.$('#lg').innerHTML=['What’s going wrong','What’s causing it','What to do'].map((h,c)=>box('<b>'+(c+1)+' · '+h+'</b>',true)+'<div class="small" style="margin:0 0 8px 10px">'+R.map(r=>r[c]).join(' · ')+'</div>').join('');}
      else{L.$('#lc').innerHTML='<b>Key Line:</b> three actions, each with its why below';
        L.$('#lg').innerHTML=R.map((r,k)=>box('<b>'+(k+1)+' · '+r[2]+'</b>',true)+'<div class="small" style="margin:0 0 8px 10px">'+r[0]+' · '+r[1]+'</div>').join('');}
      if(seen.size===2&&!L.$('#lq').innerHTML){const q=L.$('#lq');q.innerHTML='<h2 class="sub">Theo reads only the Key Line on their phone. Which layout tells them what to do?</h2>';
        L.mc(q,['The deductive layout','The inductive layout'],1,
         'Same nine ideas, same reasoning. Turned 90°, the Key Line is the three actions, and each “why” sits right under its action.',
         'In the deductive layout the Key Line is “what’s wrong, what’s causing it, what to do”: Theo learns the actions last. Turned 90°, the actions are the Key Line.');}};
    L.$('#lt').appendChild(b);});}},
{part:2,src:'Chapter 5 · Deductive Reasoning: When to Use It',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">When the argument matters more than the action</h1>');
  L.beats(L.card,[
   ['Dialogue 1','A client says: tell me how to cut my costs. You: it’s easy. They: how? You: do A, do B, do C.'],
   ['Layout 1','A plain inductive pyramid. The reader asked for actions and gets them on the Key Line.'],
   ['Dialogue 2','Same request. But you answer: forget cutting costs, you should think about selling the business. They: why? how? are you sure?'],
   ['Layout 2','Here you need deduction: the business faces a growing threat from abroad; its current structure can’t respond; other owners could. So sell.'],
   ['The other case','Deduction also fits when the reader can’t understand the actions without the reasoning first, as with a new analysis method they’ve never seen.']],
   'Few business readers fall into either case. Most of the time, your Key Line should be inductive.');}},
{part:2,src:'Chapter 5 · Deductive Reasoning: When to Use It',run(L){
  L.h(L.kick('learn','Keep deduction low')+'<h1 class="q">Lovely in a paragraph, heavy across ten pages</h1>'+
   L.prose('A short deductive argument is easy to follow when it reaches you all at once: <i>I am a bird, therefore I fly</i>. Spread it over ten or twelve pages between steps, and it loses its clarity.')+
   L.prose('So push deduction as low in the pyramid as you can. At paragraph level it flows well; higher up, induction is always easier to take in.')+
   L.list([['list','No more than four points','in one deductive group.'],['cycle','No more than two “therefore”s','chained together.']],4)+
   '<p class="small" style="margin-top:10px">You can break these limits, but then the group gets too heavy to sum up well.</p>');
  L.done();}},
{part:2,src:'Chapter 5 · Deductive Reasoning: When to Use It',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Theo asks Nadia how to get late orders back to 4%. Nadia has three fixes, each backed by analysis. How should Nadia’s Key Line run?</h1>');
  L.mc(L.card,['The three fixes, each with its reasons below','What’s wrong, then the causes, then the fixes'],0,
   'Theo asked for action, and nothing about the fixes is a shock. Actions first, reasons underneath.',
   'That’s the deductive layout: Theo would have to carry every problem and cause before reaching what to do. Theo asked “how?”, so the fixes go on the Key Line.');}},
{part:2,src:'Chapter 5 · Deductive Reasoning: When to Use It',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Deductive or inductive?',['Inductive is better here','Deductive is better here'],[
   ['Key Line: Theo asked how to cut warehouse costs, and Nadia has four ways.',0,'The reader wants actions they expect. Give the actions first.'],
   ['Key Line: Theo expects ideas to save the city stores; Nadia will say close two of them.',1,'The Main Point is alien to what Theo expects. They’ll ask “Why? Are you sure?”, so lead with the argument.'],
   ['A single paragraph: all orders need picking in a day; Mill Lane takes two; so it can’t cope.',1,'Low in the pyramid, a short deductive chain reads easily.'],
   ['Key Line: the board must approve a new way of forecasting that they can’t follow without the reasoning.',1,'The reader can’t grasp the actions without the explanation first.'],
   ['Key Line: Kenji recommends three changes to weekend staffing that store managers asked for.',0,'Nothing surprising, and the readers want actions. Induction.']]);}},

/* ---------- PART 4: INDUCTION ---------- */
{part:3,src:'Chapter 5 · Inductive Reasoning',run(L){
  L.h(L.kick('learn','How induction works')+'<h1 class="q">Notice a likeness, group the ideas, say what the likeness means</h1>'+
   L.prose('Induction is harder to do well than deduction, because it’s more creative. The mind sees that several things are alike in some way, groups them, and comments on what that likeness means.')+
   L.prose('How you <i>define</i> the group decides what you can infer. Call the tanks at the Polish border “warlike moves against Poland”, and you infer an invasion. Call them “preparations by Poland’s allies to attack the rest of Europe”, and you’d infer something quite different.')+
   L.note('The key technique: find one word for the kind of idea in the group. It is always a '+L.g('plural-noun','plural noun')+': a noun because it names a kind of thing, plural because there’s more than one. Then check every idea fits it. Any that doesn’t is a misfit.','bulb'));
  L.done();}},
{part:3,src:'Chapter 5 · Inductive Reasoning: How It Works',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">Kenji groups notes on the winter store slump</h1>');
  L.beats(L.card,[
   ['The facts','City-centre store sales are down 9% on last winter. Online sales are up 20%. Kenji has many notes.'],
   ['Three notes','Staff see customers try on boots, then leave to order online. Online orders from city postcodes are up sharply. Gift-card buyers now mostly use the website.'],
   ['Plural noun','What kind of idea is each? <b>Signs that city shoppers are moving online.</b> All three fit.'],
   ['Inference','City-centre customers aren’t gone; they’re buying from Fellwick online instead.'],
   ['Check from the bottom up','If you saw those three signs, could you infer that? Yes, and it says something about these three points only.']],
   'Defining the group with the right plural noun is what lets Kenji make the leap.');}},
{part:3,src:'Chapter 5 · Inductive Reasoning: How It Works',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Nadia’s group: “Batch-pick orders at peak.” “Release orders every hour.” “Move slow sellers out of the aisles.” Which plural noun fits all three?</h1>');
  L.mc(L.card,['Ways to speed up picking','Problems at Mill Lane','Causes of late orders'],0,
   'Each one is an action that makes picking faster, so they all fit “ways to speed up picking”.',
   'These are actions, not problems or causes. The plural noun that fits all three is “ways to speed up picking”.');}},
{part:3,src:'Chapter 5 · Inductive Reasoning: How It Works',pts:5,run(L){
  L.h(L.kick('pr','Spot the misfits')+'<h1 class="q">Kenji’s group is labelled “reasons city-centre sales fell”. Which ideas fit that plural noun?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Fits','Misfit'],[
   ['Fewer people visit the city centre on winter weekdays',0,'A reason sales fell. It fits.'],
   ['Shoppers try boots in store, then buy online',0,'Another reason, so it fits.'],
   ['Open a click-and-collect counter in each city store',1,'That’s an action, not a reason. It belongs in a group of fixes.'],
   ['The Harbourside store was shut for two weeks of repairs',0,'A reason sales fell at one store. It fits.'],
   ['Kenji visited all four city stores in January',1,'News about Kenji’s visits, not a reason sales fell.']],
   'Every idea in an inductive group must fit the plural noun. Misfits go elsewhere, or out.');}},
{part:3,src:'Chapter 5 · Inductive Reasoning: How It Works',run(L){
  L.h(L.kick('learn','Check the leap')+'<h1 class="q">The inference must not go beyond the group</h1>'+
   L.prose('Check your reasoning by questioning from the bottom up: given exactly these points, can you infer the top one? The book shows two ways it goes wrong:')+
   L.lanes([['x','A sloppy leap','Managers don’t face reality, won’t accept criticism, ignore details. Therefore they mismanage <i>because they want to</i>? Nothing in the group shows that.',4],
            ['alert','Too high a level','Low productivity, high overtime, high prices. Therefore “a profit-improvement opportunity”? Several other things could earn that label too. The top point isn’t about these points only.',3]])+
   L.prose('The second one is really deduction in disguise: low productivity caused the overtime, which pushed up prices. A better top point: <i>our prices are high because our productivity is low</i>.'));
  L.done();}},
{part:3,src:'Chapter 5 · Inductive Reasoning: How It Works',pts:1,run(L){
  L.h(L.kick('pr','Fix the top point')+'<h1 class="q">Under the top point “Fellwick has a growth opportunity”, Leah groups: online sales up 20%, online orders from city postcodes up sharply, gift cards now mostly bought online. What’s wrong?</h1>');
  L.mc(L.card,['Nothing: the three points support it well','The points are a deductive chain, not a group','The top point is too broad for these three points'],2,
   'Many things could be a growth opportunity. These three say something narrower: more Fellwick shoppers are buying online.',
   'The points are alike (all signs of a shift online), so it is a group, but “growth opportunity” goes beyond them. Make the top point about these three only: shoppers are moving online.');}},
{part:3,src:'Chapter 5 · Deductive Reasoning: How It Differs',run(L){
  L.h(L.kick('learn','How they differ')+'<h1 class="q">A two-question test, and a third possibility</h1>'+
   L.list([['arrow','Does point 2 comment on point 1?','On its subject or its predicate. If yes, it’s deductive and heads for a “therefore”.'],
     ['layers','Does point 2 share point 1’s plural noun?','If yes, it’s inductive. Usually you keep the subject and vary the predicate, or keep the predicate and vary the subject.'],
     ['x','Neither?','Then it’s just news. The facts may be true, but nothing ties them together, so they can’t support an idea. Leave them out.']],1)+
   L.prose('Why give the top point first? A reader who sees two linked ideas expects a summary or a “therefore”, and starts guessing it. If their guess differs from your point, they get confused and annoyed.'));
  L.done();}},
{part:3,src:'Chapter 5 · Deductive Reasoning: How It Differs',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Point 1: “City-centre store sales are down 9% this winter.” How does point 2 relate?',['Deductive','Inductive','Just news'],[
   ['“That fall wipes out the stores’ profit for the season.”',0,'It comments on point 1 (the fall in sales) and heads for a “therefore”.'],
   ['“Retail-park store sales are down 9% this winter.”',1,'Same predicate, new subject: two of the same kind, “stores with falling sales”.'],
   ['“Fellwick’s new boot range arrives in May.”',2,'No comment on point 1 and no shared plural noun. It may be true, but it’s news.'],
   ['“A drop that size triggers a review of each store’s lease.”',0,'It comments on point 1’s predicate (a 9% drop) and leads to a “therefore”.']]);}}
  ]
});
</script>
</body>
</html>
