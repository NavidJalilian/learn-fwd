<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">

<body>
<script src="../assets/course.js"></script>

<script>
Course.lesson({
  id:'0015', title:'Examples of introductory structures', minutes:20, icon:'book',
  goals:['Match a document to one of the four questions and its ready-made S-C-Q','Build a proposal or project plan around the thinking, not standard headings','Handle alternatives and process changes with a short, clear introduction'],
  parts:['Four questions','Proposals','Alternatives','Process changes'],
  read:'Read Appendix B of the book for Exhibit B-1 in full and the six worked introductions.',
  glossary:{
    r1:'R1 (Undesired Result): the result the reader is getting now and doesn’t like, such as falling sales.',
    r2:'R2 (Desired Result): the result the reader wants instead, stated as specifically as possible, ideally with a number.'
  },
  cheatsheet:[
    'Your most important thinking happens while you work out the <b>introduction</b>.',
    'Most introductions answer one of four questions: <b>What should we do? Should we do what we plan? How do/did we do it? Why did it happen?</b> Each has standard '+'S-C-Q patterns.',
    'Proposals and project plans: the introduction <b>defines the problem</b>; the body follows the <b>steps</b> (known client, all project plans) or the <b>reasons to hire you</b> (competitive bid).',
    'Standard proposal headings breed overlapping lists. Fees, timing and qualifications sit <b>outside</b> the thinking; a separate Benefits section adds nothing.',
    'There are no alternative solutions to a well-defined problem: compare options to the <b>R2</b>, not to each other.',
    'Discuss alternatives only if the reader already knows them. Asked for them anyway? Offer <b>alternative R2s</b>, or put a criteria chart in an appendix.',
    'Process changes: picture the <b>before</b> and the <b>after</b>. The changes become the Key Line; describe only the steps where a problem occurs.'
  ],
  steps:[
/* ---------- PART 1: FOUR QUESTIONS ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Kenji is about to write to Theo about the click-and-collect trial. What will save Kenji the most rewriting?</h1>');
  L.mc(L.card,['Knowing the exact question Theo wants answered','Choosing a clear font and good headings first'],0,
   'Pin down the question and the rest of the document falls into place. This last lesson shows the standard questions and how their introductions look.',
   'Fonts and headings come last. Once Kenji knows the question in Theo’s mind, the introduction and the body follow from it. This lesson shows the standard questions and their introductions.');}},
{part:0,src:'Appendix B · Examples of Introductory Structures',run(L){
  L.h(L.kick('learn','The four questions')+'<h1 class="q">Most introductions answer one of four questions</h1>'+
   L.prose('The book says you do your most important thinking while working out the introduction. With practice you find the same few patterns again and again. Most introductions answer one of three standard questions, and now and then a fourth:')+
   L.tiers([['compass','What should we do?','The reader has a problem and wants a course of action.'],
            ['scale','Should we do what we plan to do?','The reader has an action in mind and wants it judged.'],
            ['list','How do (or did) we do something?','The reader wants the steps, or wants to know how it was done.'],
            ['clock','Why did it happen?','The occasional fourth. In the book’s table it holds progress reviews: what did you find?']])+
   L.prose('Exhibit B-1 in the book lists the usual '+L.g('scq','S-C-Q')+' under each question. The next screen shows a few you haven’t met yet.'));
  L.done();}},
{part:0,src:'Appendix B · Exhibit B-1',run(L){
  L.h(L.kick('learn','Patterns from the table')+'<h1 class="q">Five less-common patterns worth knowing. Tap each.</h1>');
  L.flips(L.card,[['Audit','<b>S</b> We follow a process to achieve X. <b>C</b> We checked whether it needs changes. <b>Q</b> Does it?'],
                  ['Changing an unquestioned habit','<b>S</b> We’re about to do X. <b>C</b> We could do it as before, or change it. <b>Q</b> Which makes most sense?'],
                  ['Will there be a problem?','<b>S</b> We had a problem and have a solution. <b>C</b> We fear trouble putting it in place. <b>Q</b> Will there be?'],
                  ['Does the solution work?','<b>S</b> We had a problem and have a solution. <b>C</b> We tested it. <b>Q</b> Is it okay?'],
                  ['Tell how it works','<b>S</b> We have an objective. <b>C</b> We’re installing a system to achieve it. <b>Q</b> How does it work?']],
   'The first two answer “What should we do?”, the next two “Should we do what we plan?”, the last “How do we do it?”.');}},
{part:0,src:'Appendix B · Common Patterns of Introduction',run(L){
  L.h(L.kick('ex','The book’s worked introductions, retold')+'<h1 class="q">Real introductions, one per question</h1>');
  L.beats(L.card,[
   ['What should we do?','A lab-supplies firm sells through a small, skilled sales force. Its main market will double in three years, and the sales force can’t keep up, while dealers are costly and starting to compete. <b>Answer:</b> a separate way of selling for each market.'],
   ['Should we do it?','A scanner maker leads its market at a premium price. Rivals start selling scanners on their own, at a much lower price. Does it have to change? <b>Answer:</b> yes, launch a major effort to sell its own scanners that way, now.'],
   ['How do we do it?','A city needs jobs for a growing workforce but has weak infrastructure that puts companies off. It knows it must attract business. How? <b>Answer:</b> start with actions local effort can launch.'],
   ['Which alternative?','A supermarket planned a central computer system, but most of its use will be in branches. Central or branch-based? <b>Answer:</b> branch-based.'],
   ['Our fix hasn’t worked','A food company changed its terms of trade to cut supply-chain costs. Costs barely moved. <b>Answer:</b> treat the supply chain as a source of advantage and target cost and service together.']],
   'Each one is a few short paragraphs: Situation, then Complication, sometimes the Question in brackets, then the answer in one sentence.');}},
{part:0,src:'Appendix B · Exhibit B-1',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Theo writes: “The board is leaning towards the Quarry Road move. Is it the right call?” Which of the four questions is Theo asking?</h1>');
  L.mc(L.card,['What should we do?','How do we do something?','Should we do what we plan to do?'],2,
   'Theo already has an action in mind and wants it judged. That’s “Should we do what we plan to do?”.',
   '“What should we do?” has no action chosen yet, and “How?” assumes the decision is made. Theo has a planned action and wants a verdict on it.');}},
{part:0,src:'Appendix B · Exhibit B-1',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which question does the reader have?',['What should we do?','Should we do what we plan?','How do/did we do it?','Why did it happen?'],[
   ['Store managers know click-and-collect launches in March. Kenji needs them to set up pickup shelves. Their question: what exactly do we do?',2,'The decision is made. The managers want steps: a “Give direction” pattern.'],
   ['Late orders keep rising and nobody has a fix. Theo wants a recommendation.',0,'A problem and no chosen action: the reader wants a course of action.'],
   ['Nadia’s overflow space has been running a month. Theo asked for a review of whether it’s working.',1,'There is a solution in place and it was tested. “Is it okay?” sits under “Should we do what we plan?”.'],
   ['Last month Nadia promised to check Harbourside’s stockroom. Nadia has. Theo’s question: what did you find?',3,'That’s a progress review, which the book’s table files under “Why did it happen?”.'],
   ['Leah wants to change how stock is counted. Nobody has questioned the current way. Continue, or change?',0,'Recommending change in a practice the reader hasn’t questioned is a “What should we do?” pattern.']]);}},
{part:0,src:'Appendix B · Exhibit B-1',pts:1,run(L){
  L.h(L.kick('pr','Build the introduction')+'<h1 class="q">Kenji tried a pickup shelf in two stores. Build the S-C-Q for “Does the solution work?”. Tap each piece to change it.</h1>');
  L.sentence(L.card,[['Pickups were slow at the counter, so we added a shelf.','Customers love click-and-collect.'],['We will roll the shelf out to all stores.','We tried it in two stores for a month.'],['Is the shelf worth keeping?','What else could we try?']],[0,1,0],
   [['That’s not the problem the shelf solved. The Situation states the problem and the solution you had.'],['That’s an answer, not a Complication. The Complication here is that you tested it.'],['That opens a new search. The question is whether the tested solution is okay.']],
   'Had a problem, have a solution; tested it; is it okay? Exactly the book’s pattern.');}},

/* ---------- PART 2: PROPOSALS ---------- */
{part:1,src:'Appendix B · Proposing Steps to Solve Problems',run(L){
  L.h(L.kick('learn','Documents written before the answer')+'<h1 class="q">Proposals and project plans describe how you’ll find the answer</h1>'+
   L.prose('Most business documents are written after the problem is solved. Consulting proposals and project plans are different: they tell the reader the steps you will take to find the solution.')+
   L.prose('Both define the problem in the introduction, and both are built around the steps of the analysis. A consulting proposal is also a contract: what the client buys, what it costs, when it ends and who does what.')+
   L.note('To make sure all that gets in, many firms use a standard list of headings: Introduction, Background, Objectives and Scope, Issues, Technical Approach, Work Plan and Deliverables, Benefits, Qualifications, Timing, Staffing and Fees.','list')+
   L.prose('The trouble: those headings invite a list under each one. The lists overlap and hide your actual thinking.'));
  L.done();}},
{part:1,src:'Appendix B · Proposing Steps to Solve Problems',run(L){
  L.h(L.kick('learn','What the headings really are')+'<h1 class="q">Two jobs hide under nine headings</h1>'+
   L.flow([['alert','Define the problem','Introduction, Background, Objectives and Scope','',4],['list','Steps to solve it','Issues, Technical Approach, Work Plan','',2]])+
   L.prose('A separate <b>Benefits</b> section puzzles the author: the benefit is solving the problem, which was the objective all along. <b>Qualifications</b>, <b>timing</b>, <b>staffing</b> and <b>fees</b> belong in the proposal but sit outside the structure of the thinking.')+
   L.lanes([['cycle','Build on the steps','The client knows you and the proposal confirms agreed work. Project plans are always built this way.',1],
            ['star','Build on the reasons','A competitive bid. The Key Line gives the reasons the client should hire you.',3]])+
   L.prose('Either way, the introduction explains the problem.'));
  L.done();}},
{part:1,src:'Appendix B · Proposing Steps to Solve Problems',run(L){
  L.h(L.kick('ex','The book’s example, retold')+'<h1 class="q">A proposal for a phone company, built on steps</h1>');
  L.beats(L.card,[
   ['The facts','A US phone company had built its own business software for years. Some was now outdated for its own use, but it saw demand in developing countries and set up a joint venture to sell there.'],
   ['The gap','It had never sold to those markets and didn’t know the segments, let alone which were attractive. So it decided to hire a consultant.'],
   ['Laid out','The book first sets these facts in the Problem-Definition Framework: the opening scene, the disturbing event, '+L.g('r1','R1')+' and '+L.g('r2','R2')+'.'],
   ['Introduction','<b>S</b> Phone-company software in developing countries is the fastest-growing segment, and buyers will now buy from other phone companies. <b>C</b> You want to supply it but don’t know which segments are best. <b>Q</b> How will you help us find out?'],
   ['Key Line','Identify the segments and how each buys · project yearly spending in each area · work out how buyers see suppliers · pick the markets, customers and approaches that suit you.']],
   'The introduction defines the problem. The Key Line is the steps. Fees and staffing sit outside the pyramid.');}},
{part:1,src:'Appendix B · Proposing Steps to Solve Problems',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Theo asks Nadia for a project plan to find out why boot returns doubled. How should Nadia build the body?</h1>');
  L.mc(L.card,['Around the reasons Theo should trust Nadia','Around the steps Nadia will take','Around the nine standard headings'],1,
   'The book says project plans are always built around the process. The introduction defines the problem; the body is the steps.',
   'Reasons-to-hire is for competitive proposals, and the standard headings breed overlapping lists. A project plan follows the steps of the analysis.');}},
{part:1,src:'Appendix B · Proposing Steps to Solve Problems',pts:6,run(L){
  L.h(L.kick('pr','Sort the headings')+'<h1 class="q">Leah drafts a steps-based project plan using the standard headings. Where does each one’s content really belong?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Define the problem','Steps to solve it','Outside the thinking','Not needed'],[
   ['Background',0,'Background is part of explaining the problem.'],
   ['Objectives and Scope',0,'What we want and where we’ll look: still the problem definition.'],
   ['Work Plan and Deliverables',1,'That’s the steps of the analysis.'],
   ['Technical Approach',1,'How the work will be done: the steps again.'],
   ['Timing, Staffing and Fees',2,'Needed in the document, but outside the structure of the thinking.'],
   ['Benefits',3,'The benefit is solving the problem, which was the objective all along.']],
   'Two jobs (define the problem, show the steps), plus business details outside the pyramid.');}},
{part:1,src:'Appendix B · Proposing Steps to Solve Problems',pts:1,run(L){
  L.h(L.kick('pr','Pick the structure')+'<h1 class="q">Fellwick invites three property advisers to bid for help choosing sites for its two new stores. None has worked with Fellwick before. How should a bidder build its proposal?</h1>');
  L.mc(L.card,['Around the reasons Fellwick should hire it','Around the steps of its site analysis','Around a full list of its past clients'],0,
   'It’s a competitive bid, so the Key Line gives the reasons to hire this adviser. The introduction still explains Fellwick’s problem.',
   'Steps suit a client who already knows you and is confirming agreed work. A client list is one piece of support, not a structure. In a competitive bid, the Key Line gives the reasons to hire you.');}},

/* ---------- PART 3: ALTERNATIVES ---------- */
{part:2,src:'Appendix B · Dealing with Alternative Solutions',run(L){
  L.h(L.kick('learn','Compare to the goal, not to each other')+'<h1 class="q">Alternatives appear when the goal is vague</h1>'+
   L.prose('Strictly, the book says, a problem has no alternative solutions. What you recommend either gets the reader from '+L.g('r1','R1')+' to '+L.g('r2','R2')+', or it doesn’t.')+
   L.prose('So-called alternatives appear when the R2 is vague, so nobody can recognize a solution on sight. People then pick three or four likely actions and weigh their pros and cons against each other.')+
   L.flow([['scale','What people do','compare options with each other','',4],['target','What matters','compare each option with the R2','',2]])+
   L.prose('Comparing options with each other is really a slow way of backing into what the R2 should be. Define the R2 first. Often, the book says, step one of solving a problem is exactly that.'));
  L.done();}},
{part:2,src:'Appendix B · Dealing with Alternative Solutions',run(L){
  L.h(L.kick('learn','When alternatives belong in the document')+'<h1 class="q">Only when the reader already knows them</h1>'+
   L.prose('If the reader has named the options themselves, their question is simply “Which one?”. Otherwise you are raising options just to knock them down: A is no good, B is no good, so do C. But the reason for C is that it solves the problem, not that A and B fail.')+
   L.list([['target','Reader asks for alternatives','They can only need them if their R2 is unclear. So they really want <b>alternative R2s</b>: do X if you want steady earnings, Y if you want fast growth.'],
     ['list','Reader insists anyway','You have a clear answer to a clear R2. Put the options in the introduction (clumsy) or in an <b>appendix chart</b>: options down the side, criteria across the top, ticks where each one meets them.']],2));
  L.done();}},
{part:2,src:'Appendix B · Dealing with Alternative Solutions',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">Theo asks for “the long-term warehouse alternatives”</h1>');
  L.beats(L.card,[
   ['The request','Overflow space covers peaks for now. Theo asks Nadia to “set out the long-term alternatives”: keep renting overflow space, move to Quarry Road, or hand online orders to Larkspan.'],
   ['First draft','Three sections of pros and cons, each option measured against the others. Imani asks: “Better at <i>what</i>?”'],
   ['Spot the gap','Nadia realizes nobody has stated the R2. “Fix the warehouse for good” can’t tell you which option wins.'],
   ['No single winner','No option gives everything: overflow space is cheapest, Quarry Road gives room to grow, Larkspan is easiest to run. So Theo really needs to choose a goal.'],
   ['Alternative R2s','Nadia’s Key Line: if you want the lowest spend, keep renting overflow space · if you want room for the two new stores, move to Quarry Road · if you want the least to manage, hand online orders to Larkspan.']],
   'Each point pairs a goal with the option that meets it. Theo now chooses between goals, which is the real decision.');}},
{part:2,src:'Appendix B · Dealing with Alternative Solutions',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Leah recommends one courier for click-and-collect returns. Nobody asked about other couriers. Should Leah’s memo open with “There are three couriers we could use”?</h1>');
  L.mc(L.card,['Yes, showing all options proves the work was thorough','No, Leah would only be raising options to knock them down'],1,
   'The reader didn’t know the options, so listing them invites “A is no good, B is no good”. The reason for Leah’s choice is that it solves the problem.',
   'Thoroughness belongs in the analysis, not the structure. If the reader didn’t know the options, raising them just to reject them hides the real reason: Leah’s choice solves the problem.');}},
{part:2,src:'Appendix B · Dealing with Alternative Solutions',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'How should the writer handle the options?',['Answer “Which one?”','Offer alternative R2s','Recommend; chart in appendix'],[
   ['The board has debated two van leasing firms for months and asks Nadia which to pick.',0,'The reader already knows the options, so the question is simply “Which one?”.'],
   ['Theo asks for “some options” on the winter slump, but can’t say whether they want sales back or costs cut.',1,'The goal itself is unclear, so set out what to do for each possible goal.'],
   ['Imani has a clear goal (payback within 3 years) and Nadia has one plan that meets it, but Imani still wants to see the others.',2,'Clear R2, clear answer. Keep the pyramid clean and put the comparison chart at the back.'],
   ['Kenji must pick one of three till systems store managers have already tried in a trial.',0,'They know all three, so the memo answers “Which one?” directly.']]);}},

/* ---------- PART 4: PROCESS CHANGES ---------- */
{part:3,src:'Appendix B · Describing Changes to Processes',run(L){
  L.h(L.kick('learn','Before and after')+'<h1 class="q">To describe a change, first picture both processes</h1>'+
   L.prose('Usually the reader knows the process and its problems, so the introduction is short: <b>S</b> we have process X; <b>C</b> it isn’t working; <b>Q</b> how should we change it? The trick is to picture the steps “before” and “after”, so the changes are clear to you.')+
   L.lanes([['check','Reader knows old and new','Their question is “How do I put it in place?” or “Should I?”',2],
            ['info','Reader knows nothing','They don’t know how it works or that it has problems. Their question: how do you want to change it, and why?',3]])+
   L.prose('In both cases writers tend either to skip describing the process at all, or to describe every step of it.'));
  L.done();}},
{part:3,src:'Appendix B · Describing Changes to Processes',run(L){
  L.h(L.kick('ex','The book’s two examples, retold')+'<h1 class="q">One introduction says too little, one says far too much</h1>');
  L.beats(L.card,[
   ['Too little','A report on sending documents electronically, for a European body. Its introduction never says what the reader wants. The book sketches the process: today, a user finds a document in a listing, phones a library, and gets a mailed copy in 7 to 10 days. Wanted: the document on screen within an hour.'],
   ['Fixed','The reader knows the problem <i>and</i> the solution, so the real question is: can a low-cost system do it? Answer: possible, but not practical yet. It needs Europe-wide scale, there are barriers to that, so start with a demonstration project.'],
   ['Too much','A memo on producing monthly graph books for top management. It describes every step, lists the problems, and offers no solution but “needs streamlining”. Rule of thumb: never present problems without solutions.'],
   ['Fixed','Draw the two current processes and mark where errors creep in: entering data, calculating figures, presenters editing graphs. The three changes become the Key Line: a direct data link, a reliable computerized routine, and revalidating presenters’ edits.'],
   ['Then','The question is “What changes do you recommend?”. Each Key Line point raises “Why?”, and below it you describe only the steps where a problem occurs.']],
   'Picture before and after; the changes are the Key Line; work back to an introduction that raises that question.');}},
{part:3,src:'Appendix B · Describing Changes to Processes',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Put the book’s steps for an over-described process in order.</h1>');
  L.order(L.card,['Draw a picture of the present process','State what is wrong at each step','Draw the process needed to remove the problems','State the changes from the old to the new','Explain the problem briefly in the introduction'],
   'The introduction comes last: once the changes are clear, you know what question it must raise.');}},
{part:3,src:'Appendix B · Describing Changes to Processes',pts:1,
 solve:async L=>{const c=L.$('#ps').children;[1,2,3].forEach(i=>c[i].click());L.$('#pg').click();},
 run(L){
  const S=['Customer posts the boots back','Returns desk writes the reason on a paper slip','Leah retypes the slips into a spreadsheet each Friday','Most reasons go under “other”','Boots go back on the shelf'],R=[1,2,3];const sel=new Set();
  L.h(L.kick('pr','Picture the before')+'<h1 class="q">Leah’s first memo on boot returns described every step in detail. Here’s the process. Tap the <b>three</b> steps where problems creep in.</h1>'+
   '<div id="ps"></div><button class="btn pri" id="pg" style="margin-top:12px">'+L.ic('check')+'Show the after</button><div id="pf"></div><div id="pa"></div><div id="pq"></div>');
  S.forEach((s,j)=>{const b=document.createElement('button');b.className='chip';b.style.cssText='display:block;width:100%;text-align:left;margin:0 0 6px';b.innerHTML=L.ic(j?'arrow':'box')+s;
    b.onclick=()=>{if(L.$('#pa').innerHTML)return;sel.has(j)?sel.delete(j):sel.add(j);b.classList.toggle('sel');};L.$('#ps').appendChild(b);});
  L.$('#pg').onclick=function(){
    if(!(sel.size===3&&R.every(i=>sel.has(i)))){L.fb(L.$('#pf'),'<b>Not quite.</b> Posting boots and restocking them work fine. Look for where information gets lost, copied or blurred.','no');return;}
    this.remove();L.$('#pf').innerHTML='';
    L.$('#pa').innerHTML='<div style="background:var(--soft);border-radius:16px;padding:14px;margin:10px 0"><div class="small" style="margin-bottom:6px"><b>After:</b> three changes, one per problem step</div>'+
      ['Log each return straight into the system at the desk','Drop the Friday retyping','Replace “other” with fit, sizing, damage and “changed my mind”'].map(t=>'<span class="chip static ok" style="display:block;margin:0 0 6px">'+L.ic('check')+t+'</span>').join('')+'</div>';
    const q=L.$('#pq');q.innerHTML='<h2 class="sub">Those three changes are Leah’s Key Line. Under each one, what should the memo describe?</h2>';
    L.mc(q,['Every step of the returns process, start to finish','Only the step where that problem occurs, and why','Every problem anyone has ever reported at the desk'],1,
     'Each point raises “Why?”. The answer is the faulty step and how the change removes the problem. The steps that work need no words.',
     'Describing every step, or every complaint, is how Leah’s first memo got so long. Under each change, explain only the step where the problem occurs.');};}},
{part:3,src:'Appendix B · Describing Changes to Processes',pts:1,run(L){
  L.h(L.kick('pr','Final check')+'<h1 class="q">Leah now writes to Imani, who has never seen how returns are handled and doesn’t know there’s a problem. What must Leah’s introduction do?</h1>');
  L.mc(L.card,['Describe every step of the current returns process first','Skip the process and go straight to the three changes','Say just enough for Imani to see a problem could exist'],2,
   'The introduction can only hold what Imani will accept as true. Leah says enough to let Imani “see” the problem and that the fix is plausible, then the changes follow.',
   'A full walk-through is the over-described memo; skipping it leaves Imani asking “Why change anything?”. Say just enough for Imani to see the problem and that a fix is plausible.');}}
  ]
});
</script>
</body>
</html>
