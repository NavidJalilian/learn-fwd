<title>Reflecting the Pyramid in Prose</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">

<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0013', title:'Reflecting the pyramid in prose', minutes:17, icon:'pencil',
  goals:['Explain why jargon-heavy sentences leave the reader with nothing to hold','Picture an idea as a rough sketch before you write it','Rewrite a foggy sentence by finding its nouns and how they relate'],
  parts:['Two steps','Think in images','Skeleton images','Copy it in words'],
  read:'Read chapter 12 of the book for the Thoreau passage, the World Bank example and all three rewrites.',
  glossary:{
    'memory-image':'Memory image: the rough picture a reader builds in their mind, piece by piece, while reading. It sums up what they read and helps them recall it later.',
    'skeleton-image':'Skeleton image: a bare sketch of how ideas relate, made of a few simple shapes (lines, circles, boxes) and arrows. Not a detailed picture.'
  },
  cheatsheet:[
    'Writing is <b>two steps</b>: decide the point (your pyramid), then put it into words.',
    'Heavy jargon is <b>fashion, not necessity</b>. Specialists need their technical terms; nobody needs fog.',
    'We think in <b>images</b>: one picture can hold far more than the seven or so items the mind juggles at once.',
    'See it first, then <b>copy the image into words</b>. The reader rebuilds the image from your sentence.',
    'Good prose lets the reader build a <b>memory image</b> as they read. If they can’t “see” it, they haven’t understood it.',
    'Abstract ideas need only a <b>skeleton image</b>: a few lines, shapes and arrows.',
    'To rewrite a foggy sentence: <b>find the nouns you can picture, see how they relate, write what you see</b>.'
  ],
  steps:[
/* ---------- PART 1: TWO STEPS ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Theo reads two sentences about late orders on their phone. Which one will Theo still remember tomorrow?</h1>');
  L.mc(L.card,['“Suboptimal alignment of dispatch scheduling is driving fulfilment latency.”','“The courier van now comes at 2pm, before half the parcels are packed.”'],1,
   'You can <i>see</i> the van and the half-packed parcels. This lesson shows why that picture is what makes a sentence stick.',
   'Read it again: what do you actually see? Nothing. The second sentence gives Theo a van, a clock and a pile of parcels. That picture is what sticks.');}},
{part:0,src:'Chapter 12 · Reflecting the Pyramid in Prose',run(L){
  L.h(L.kick('learn','The last step')+'<h1 class="q">Writing clearly takes two steps</h1>'+
   L.prose('The book opened with a simple claim: to write clearly, first decide the point you want to make, then put it into words.')+
   L.flow([['layers','Step 1 · Decide the point','Build the '+L.g('pyramid','pyramid')+' and check each group','chapters 1 to 11'],['pencil','Step 2 · Put it into words','Turn each point into clear sentences','this lesson']])+
   L.prose('Once your pyramid is done, you know exactly which points to make and in what order. In theory, only the wording is left. In practice, the book says, the average business sentence comes out long-winded and heavy with <b>jargon</b> (words of a trade or a fashion that outsiders can’t picture). Paragraphs feel impossible to get into, and the subject feels endlessly dull.'));
  L.done();}},
{part:0,src:'Chapter 12 · Reflecting the Pyramid in Prose',run(L){
  L.h(L.kick('learn','Why clever people write fog')+'<h1 class="q">Jargon is a fashion, not a need</h1>'+
   L.prose('The book’s foggy examples came from bright people who solved problems well and could explain their ideas perfectly out loud. On paper, they seemed to believe that the drier and more technical the style, the more respect it would earn.')+
   L.quote('Good ideas ought not to be dressed up in bad prose.','Barbara Minto, chapter 12')+
   L.lanes([['check','Fine','Technical terms in a document written <b>for specialists</b> who use them every day.',2],
            ['x','Fashion','Piling on jargon and a cramped, twisted style for any reader. That’s habit, not necessity.',4]])+
   L.prose('The aim is prose that gets the idea across clearly <i>and</i> is a pleasure to take in.'));
  L.done();}},
{part:0,src:'Chapter 12 · Reflecting the Pyramid in Prose',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Nadia says: “The board is all finance people. If my memo sounds technical, they’ll take it more seriously.” What does the book say?</h1>');
  L.mc(L.card,['Right: the more technical it sounds, the more respect it earns','Partly: use their finance terms, but heavy jargon is just fashion','Wrong: never use any technical term in a business memo'],1,
   'Specialists need their own technical words. Fog on top of that is a fashion, and it earns nothing.',
   'The book allows technical language when you write for specialists, but says piling on jargon for respect is nonsense. The middle answer keeps both halves.');}},
{part:0,src:'Chapter 12 · Reflecting the Pyramid in Prose',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Needed or just fashion?',['Fine: the reader needs it','Fashion: say it plainly'],[
   ['Imani’s note to the board’s audit committee uses “depreciation” and “payback period”.',0,'Finance specialists use these words daily. They are the most exact words for that reader.'],
   ['Kenji tells store managers to “leverage cross-functional synergies at the counter”.',1,'Nobody can picture that. Say who should do what: “Counter staff help with click-and-collect at lunch.”'],
   ['Nadia writes to Theo about “optimizing fulfilment throughput velocity”.',1,'Theo can’t see anything here. Say what happens: “Pick and pack orders faster.”'],
   ['Leah’s note to the warehouse team mentions each item’s “SKU”, their daily stock-code word.',0,'The pickers use this word all day. For them, it’s plain language.']]);}},

/* ---------- PART 2: THINK IN IMAGES ---------- */
{part:1,src:'Chapter 12 · Reflecting the Pyramid in Prose',run(L){
  L.h(L.kick('learn','We think in pictures')+'<h1 class="q">An image holds far more than a list of words</h1>'+
   L.prose('The book argues that we do all our conceptual thinking in images, not words. An image squeezes a mass of facts into one shape. Since the mind can only juggle about seven or eight items at once, that squeezing is a huge help.')+
   L.lanes([['list','In words','A is longer than B.<br>B is longer than C.<br>So A is longer than C.',1],
            ['eye','As an image','<div style="margin-top:6px"><div style="height:9px;width:95%;background:var(--h1);border-radius:5px;margin:6px 0"></div><div style="height:9px;width:65%;background:var(--h2);border-radius:5px;margin:6px 0"></div><div style="height:9px;width:35%;background:var(--h3);border-radius:5px;margin:6px 0"></div><div class="small">A, B, C</div></div>',2]])+
   L.prose('You grasp how the three lines relate faster from the picture than from the sentences. The same is true of every idea you write about.'));
  L.done();}},
{part:1,src:'Chapter 12 · Reflecting the Pyramid in Prose',run(L){
  L.h(L.kick('learn','The method in one line')+'<h1 class="q">See it, then copy it into words</h1>'+
   L.prose('To write a clear sentence, you first have to “see” what you are talking about. Once you have the image, you simply copy it into words.')+
   L.flow([['eye','1 · You see it','a picture of how the ideas relate','',1],['pencil','2 · You copy it','plain words that describe the picture','',2],['person','3 · Reader rebuilds it','the same picture, in their head','',3]])+
   L.prose('The reader then rebuilds your image from your words. They get your thinking, and they enjoy the work of getting it.')+
   L.note('The trick, the book says, is to consciously picture the images you used when you first thought of the ideas.','bulb'));
  L.done();}},
{part:1,src:'Chapter 12 · Create the Image',run(L){
  L.h(L.kick('ex','The book’s example, retold')+'<h1 class="q">Watch a picture grow as you read</h1>');
  L.beats(L.card,[
   ['The passage','The book quotes a short passage from Thoreau’s <i>Walden</i>, and asks you to notice what happens in your mind as you read it.'],
   ['First phrase','It is March 1845. Maybe you sense a grey day long ago.'],
   ['Next','Someone borrows an axe and walks to the woods by Walden Pond. You see a figure, axe in hand.'],
   ['Then','The trees become tall young white pines, and you see him chopping at them. Next, the trees are on a pleasant hillside.'],
   ['Last','He stands and looks out at the pond, a small open field, and ice that hasn’t yet melted.'],
   ['What you built','Not a photo but a '+L.g('memory-image','memory image')+', the book’s term borrowed from psychologist George Miller. It grew piece by piece, it sums up what you read, and it helps you recall it.']],
   'You can’t repeat the passage word for word, but you can “read off” the picture and say roughly the same thing. The book’s test: if the reader can’t see it, they haven’t understood it.');}},
{part:1,src:'Chapter 12 · Create the Image',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Why does it matter that a reader builds a picture while reading?</h1>');
  L.mc(L.card,['It makes a long document feel shorter to read','It is how they understand and later recall it','It saves the writer from building a pyramid'],1,
   'The image sums up what they read, and they can read it back later. No picture, no real understanding.',
   'The picture doesn’t shorten anything or replace the pyramid. It is how the reader understands the passage and remembers it afterward.');}},
{part:1,src:'Chapter 12 · Create the Image',pts:1,
 solve:async L=>{const g=L.$('#vg').children;g[0].click();g[1].click();},
 run(L){
  const V=[['Version 1',['Suboptimal alignment between outbound dispatch scheduling and order-consolidation throughput is generating latency in fulfilment performance.'],null],
           ['Version 2',['The courier van now collects at 2pm.','By then, packers have finished only half the morning’s orders.','The rest wait on the dock until the next day.'],[['clock','Van arrives at 2pm'],['box','Half the parcels packed'],['alert','Rest wait overnight']]]];
  const seen=new Set();
  L.h(L.kick('pr','Toggle and compare')+'<h1 class="q">Nadia has two drafts of one sentence for Theo. Switch between them and watch what your mind can draw.</h1><div id="vg"></div>'+
   '<div style="background:var(--soft);border-radius:16px;padding:14px;margin:8px 0 6px;min-height:150px"><div class="prose" id="vt" style="margin:0 0 10px">Choose a version above.</div><div id="vp"></div></div><div id="vq"></div>');
  V.forEach((v,j)=>{const b=document.createElement('button');b.className='chip';b.innerHTML=L.ic('book')+v[0];
    b.onclick=()=>{[...L.$('#vg').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(j);
      L.$('#vt').innerHTML=v[1].join(' ');
      L.$('#vp').innerHTML=v[2]?'<div class="small" style="margin-bottom:6px">The picture you build:</div>'+v[2].map((p,k)=>(k?'<div style="text-align:center;line-height:1">'+L.ic('down')+'</div>':'')+'<span class="chip static ok">'+L.ic(p[0])+p[1]+'</span>').join(''):
        '<div class="small" style="margin-bottom:6px">The picture you build:</div><span class="chip static" style="opacity:.6">'+L.ic('info')+'nothing solid to hold on to</span>';
      if(seen.size===2&&!L.$('#vq').innerHTML){const q=L.$('#vq');q.innerHTML='<h2 class="sub">Theo has to explain the late orders to the board next week. Which draft helps?</h2>';
        L.mc(q,['Version 1, because it sounds more expert','Version 2, because Theo can picture it'],1,
         'Theo will remember the van, the clock and the waiting parcels, and can “read off” that picture to the board.',
         'Sounding expert doesn’t help if nothing sticks. Version 2 gives Theo a picture to recall and retell.');}};
    L.$('#vg').appendChild(b);});}},

/* ---------- PART 3: SKELETON IMAGES ---------- */
{part:2,src:'Chapter 12 · Create the Image',run(L){
  L.h(L.kick('learn','Abstract ideas need only a skeleton')+'<h1 class="q">You don’t need a photo, just lines and arrows</h1>'+
   L.prose('Some ideas are abstract. The book shows a passage from a debate on whether the World Bank should switch from a fixed to a floating lending rate. It’s about risk allowances, extra income and lower rates later. No photo there.')+
   L.prose('Yet words like “spread”, “excess” and “reduction” still let you see the relationships. You could draw them with about four lines and two arrows.')+
   L.tiers([['layers','Skeleton, not photo','A '+L.g('skeleton-image','skeleton image')+' shows only the <b>structure</b> of the relationships.'],
            ['box','Simple shapes','A circle, a straight line, an oval, a box, arranged roughly.'],
            ['arrow','Arrows','To show direction and how one thing acts on another.']])+
   '<p class="small" style="margin-top:10px">It may look childish. But great visual thinkers, from Einstein on, described their own mental images as vague and hazy in just this way.</p>');
  L.done();}},
{part:2,src:'Chapter 12 · Create the Image',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">Imani sketches an abstract point before writing it</h1>');
  L.beats(L.card,[
   ['The idea','Imani wants to tell the board why renting overflow space near Mill Lane is cheap for now: Fellwick pays only for the busy months, while a bigger warehouse costs rent all year.'],
   ['Find the shapes','A year is a <b>long line</b>. The busy season is a <b>short block</b> on that line. Each option’s rent is a <b>bar</b> above the line.'],
   ['Draw it','Overflow space: a short bar over the busy block only. Quarry Road: a bar right across the whole line. Five shapes, no detail.'],
   ['Copy it in words','“We pay for overflow space only from October to January, when orders peak. A bigger warehouse would cost rent all twelve months.”']],
   'The sketch took seconds, and the sentence simply describes it. The board can rebuild the same picture as they read.');}},
{part:2,src:'Chapter 12 · Create the Image',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Leah has to explain an abstract idea: “More click-and-collect orders mean fewer courier parcels, which lowers delivery cost.” What image should Leah picture first?</h1>');
  L.mc(L.card,['A few shapes with arrows linking them','A detailed photo of a courier van','A full table of last year’s costs'],0,
   'Three boxes (click-and-collect, parcels, cost) and two arrows show the whole relationship. That’s all a skeleton needs.',
   'The book says abstract ideas need a skeleton, not a photo or a mass of figures: a few shapes and arrows showing how one thing acts on another.');}},
{part:2,src:'Chapter 12 · Create the Image',pts:1,run(L){
  L.h(L.kick('pr','Match the sketch')+'<h1 class="q">Kenji writes: “Each extra Saturday counter worker cuts the pickup queue, and shorter queues mean fewer customers walk away.” Which skeleton fits?</h1>');
  L.mc(L.card,['A pie chart of who works on Saturdays','A store floor plan with every shelf drawn in','Worker → shorter queue → fewer walk-aways'],2,
   'Three boxes and two arrows: one thing acts on the next. That is the shape of Kenji’s idea.',
   'Kenji’s idea is a chain of causes. A pie chart shows shares, and a floor plan shows far more detail than the idea needs. The skeleton is a chain with arrows.');}},

/* ---------- PART 4: COPY IT IN WORDS ---------- */
{part:3,src:'Chapter 12 · Copy the Image in Words',run(L){
  L.h(L.kick('learn','Rewriting fog')+'<h1 class="q">Find the nouns, then find how they relate</h1>'+
   L.prose('When a sentence calls up no image, your mind gropes for something solid to hold. In a long jargon sentence, by the time the fourth phrase arrives, the first one has gone.')+
   L.prose('The book’s trick for rewriting it:')+
   L.list([['Find the nouns you can picture','Skip the abstract ones like “area of improvement”. Keep things you could point at: the sales force, a store.'],
     ['Look for how they relate','Who does what to whom? What is next to, inside or causing what?'],
     ['See the relationship as an image','Sketch it roughly, in your head or on paper.'],
     ['Copy the image into a sentence','Describe what you see, simply.']],1));
  L.done();}},
{part:3,src:'Chapter 12 · Copy the Image in Words',run(L){
  L.h(L.kick('ex','The book’s three rewrites')+'<h1 class="q">Three foggy sentences, three pictures, three plain lines</h1>');
  L.beats(L.card,[
   ['Fog 1','A long sentence about improving the cost-effectiveness of how a field sales force is deployed, to suit new “selling missions” in stores after the trade environment changed.'],
   ['Its picture','Nouns you can see: the sales force, the store, a changed environment. Sketch: a salesperson heading for a store that now sits in a new environment.'],
   ['Rewrite 1','Roughly: <b>redeploy the sales force to match the new trading environment.</b>'],
   ['Fog 2 and 3','One sentence about “preplanned adjustments” and “prioritized guides”. Another about a system not ready to meet accuracy needs for cash-flow analysis.'],
   ['Their pictures','The first is really a contingency plan, so it becomes: <b>outline the order in which activities would be cut if the plan needs adjusting.</b> The second becomes: <b>the system can give accurate cash-flow analyses if we feed it a certain kind of information.</b>'],
   ['A bonus','In the cash-flow case, the picture shows a gap: which information? Without the author, the book admits, you can’t tell. A sketch shows you what the sentence never said.']],
   'Same move every time: nouns you can picture, the relationship between them, then a sentence that describes the picture.');}},
{part:3,src:'Chapter 12 · Copy the Image in Words',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Put the book’s rewriting steps in order.</h1>');
  L.order(L.card,['Find the nouns you can picture','Work out how those nouns relate','See the relationship as a rough image','Write a sentence that copies the image'],
   'You can’t write the picture until you have it, and you can’t draw it until you know which things are in it.');}},
{part:3,src:'Chapter 12 · Copy the Image in Words',pts:1,
 solve:async L=>{const c=L.$('#nc').children;[3,4,5].forEach(i=>c[i].click());L.$('#dr').click();},
 run(L){
  const P=['a primary lever','for margin recovery','is the rationalization','of slow-moving stock','in warehouse aisles','to enable peak picking'],R=[3,4,5];const sel=new Set();
  L.h(L.kick('pr','Find the nouns')+'<h1 class="q">Nadia’s draft says the sentence below. Tap the <b>three</b> phrases you can actually picture, then draw.</h1>'+
   '<div id="nc" style="display:flex;flex-wrap:wrap;gap:6px"></div><button class="btn pri" id="dr" style="margin-top:12px">'+L.ic('pencil')+'Draw the picture</button><div id="nf"></div><div id="np"></div><div id="nq"></div>');
  P.forEach((p,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=p;b.onclick=()=>{if(L.$('#np').innerHTML)return;sel.has(j)?sel.delete(j):sel.add(j);b.classList.toggle('sel');};L.$('#nc').appendChild(b);});
  L.$('#dr').onclick=function(){
    const ok=sel.size===3&&R.every(i=>sel.has(i));
    if(!ok){L.fb(L.$('#nf'),'<b>Not quite.</b> Ask of each phrase: could I point at it? “Margin recovery” and “rationalization” are ideas, not things. Stock, aisles and pickers at peak are things.','no');return;}
    this.remove();L.$('#nf').innerHTML='';
    L.$('#np').innerHTML='<div style="background:var(--soft);border-radius:16px;padding:14px;margin:10px 0"><div class="small" style="margin-bottom:6px">How they relate:</div>'+
      '<span class="chip static">'+L.ic('box')+'Slow sellers</span> fill <span class="chip static">'+L.ic('layers')+'the aisles</span>, so <span class="chip static">'+L.ic('people')+'pickers at peak</span> walk around them</div>';
    const q=L.$('#nq');q.innerHTML='<h2 class="sub">Now copy the picture. Which sentence does it?</h2>';
    L.mc(q,['Rationalize slow-moving stock positions to lift peak picking throughput','Move slow sellers out of the aisles so pickers move faster at peak','Margin recovery depends on better use of aisle space at peak times'],1,
     'It names the things in the picture and what should happen to them. Theo can see it.',
     'The other two keep the abstract words (“rationalize”, “throughput”, “margin recovery”) that blocked the picture in the first place.');};}},
{part:3,src:'Chapter 12 · Copy the Image in Words',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Kenji’s note to store managers is pure fog. Tap each piece until it says something they can picture.</h1>');
  L.sentence(L.card,[['Optimize','Keep'],['click-and-collect bags','fulfilment assets'],['within designated storage zones','on the shelf behind the counter'],['to enhance retrieval','in order of surname']],[1,0,1,1],
   [['“Optimize” names no action anyone can see. What should staff physically do?'],['“Fulfilment assets” could mean anything. What are they holding?'],['Where exactly is a “designated storage zone”? Name the place.'],['“Enhance retrieval” is a goal, not a picture. Say how the bags are arranged.']],
   'Every piece is now something a store manager can point at: the bags, the shelf, the order they stand in.');}},
{part:3,src:'Chapter 12 · Copy the Image in Words',pts:6,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Can you picture it?',['Yes, I can point at it','No, it’s an abstraction'],[
   ['“the courier van”',0,'You can see it pull into Mill Lane.'],
   ['“operational synergies”',1,'There is nothing to point at. Ask what actually happens, and to what.'],
   ['“returned hiking boots”',0,'A pile of boxes on the returns desk. Easy to see.'],
   ['“resource utilization”',1,'Which resource? Used how? Find the thing behind it, like pickers or shelves.'],
   ['“the shelf behind the counter”',0,'A real place in every store.'],
   ['“an area of potential improvement”',1,'Pure abstraction. It tells the mind nothing to draw.']]);}},
{part:3,src:'Chapter 12 · Copy the Image in Words',run(L){
  L.h(L.kick('learn','Why the effort is worth it')+'<h1 class="q">One soldier at a time through a narrow gap</h1>'+
   L.prose('Reading happens word by word, and we can hold only a few words in mind at once. When the reader rescues the image from your words, they take in your knowledge in big chunks and keep it as a vivid picture that’s easy to recall.')+
   L.prose('The book closes with an image from William Minto, a relative of the author. A writer is like a commander marching troops through a gap so narrow that only one can pass at a time. On the far side, the reader has to re-form them into ranks.')+
   L.note('That is why order and arrangement matter so much. Your pyramid gives the reader the ranks. Clear, picturable sentences let each soldier through.','book'));
  L.done();}},
{part:3,src:'Chapter 12 · Copy the Image in Words',pts:1,run(L){
  L.h(L.kick('pr','Final check')+'<h1 class="q">Leah’s note on boot returns says: “Sizing-related return drivers indicate misalignment between online size information and brand specifications.” Which rewrite copies the picture?</h1>');
  L.mc(L.card,['Size-related return drivers show our data and brand data are misaligned','Many boots come back too small or big because our size chart differs from the brand’s','Return drivers relating to size show a need to align online size information'],1,
   'The boots, the two size charts that don’t match, and the result: boots sent back. You can see all of it.',
   'Those two only shuffle the same abstract nouns (“drivers”, “misaligned”, “size information”). The picture is boots coming back because two charts disagree.');}}
  ]
});
</script>
</body>
</html>
