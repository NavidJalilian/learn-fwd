<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">

<body>

<script>
Course.lesson({
  id:'0012', title:'Managing evaluations', minutes:20, icon:'flask',
  goals:['Decide whether an evaluation should happen at all','Set measurable success criteria and a Sequence of Events with the customer','Price an evaluation and handle the usual mid-evaluation problems'],
  parts:['Why evaluate','Success criteria','Price and terms','When it wobbles'],
  read:'Read chapter 13 of the book for the full cost lists, the sample 25-day timeline and the “Database Breakeven Point”.',
  glossary:{
    evaluation:'Evaluation: a trial where the customer uses your software in their own setting, for a set time, before deciding to buy.',
    'sequence-of-events':'Sequence of Events: a shared table of an evaluation’s tasks, dates, owners and Go/No Go points, built by vendor and customer together.',
    'go-no-go':'Go/No Go: a planned decision point where both sides agree whether to continue or stop.',
    champion:'Champion: a person at the customer who willingly and actively supports buying and rolling out your product, and helps you reach the right people.',
    rollover:'Rollover agreement: one contract covering both the evaluation and the full license, so a successful trial turns into a sale without a second agreement.',
    pilot:'Pilot: a real, paid license for a small starter group of users, often with incentives to expand later.'
  },
  cheatsheet:[
    'Two kinds of technical proof: <b>demos</b> and <b>evaluations</b>. Evaluations cost far more, for both sides.',
    'Don’t evaluate with no CBI, for “education”, to get rid of a pushy rep, on vendor hope, with no path to purchase, or without agreed objectives.',
    'Before starting, agree: <b>objectives</b> (measurable), <b>timeline</b>, <b>players and roles</b>, the <b>value equation</b>, the <b>purchasing process</b>.',
    'A <b>Sequence of Events</b>: task, track, dates, owner, done, Go/No Go. Draft it, then build it with the customer. Run tasks in parallel. Carry it past the decision into roll-out.',
    'Real value shouldn’t be free. Put a price on it; you can waive or refund it if they buy. A <b>Rollover agreement</b> saves a second contract.',
    '<b>Pilot</b> instead of evaluation when value needs heavy setup or takes a long time to show.',
    'Trouble signs: nobody using it, “another month?”, “expand the objectives”, “use it while legal finishes?”. Ask <b>why</b> first.',
    '<b>Database Breakeven Point</b>: users switch when the new tool is as likely to have the answer as the old way. Pre-fill the box to get there sooner.'
  ],
  steps:[
/* ---------- PART 1: WHY EVALUATE ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">A neighbor asks to borrow your spare car for a month “to see if I’d like one.” They have no budget for a car this year. Do you lend it?</h1>');
  L.mc(L.card,['Probably not, there’s no way it leads to a sale','Yes, once they try it they’ll find the money'],0,
   'A month of your car, with no chance of a purchase at the end. Software evaluations can go the same way, and this lesson shows how to spot it.',
   'That’s hope talking. With no budget there’s no path to a purchase, however much they enjoy it. The same trap catches software vendors.');}},
{part:0,src:'Chapter 13 · Managing Evaluations – Introduction; Costs Considerations',run(L){
  L.h(L.kick('learn','The other kind of proof')+'<h1 class="q">Demos and evaluations both prove the software. One costs far more.</h1>'+
   L.prose('Customers get technical proof in two ways: a <b>demonstration</b> or an '+L.g('evaluation','evaluation')+'. The book calls evaluations possibly the single most expensive part of a sales cycle, for both sides. If a focused demo gives enough proof, everyone wins.')+
   L.lanes([['box','Vendor pays in','The SE’s time (often a lot), training, consulting or customization, sales management, legal for the trial license, accounting.',4],
            ['people','Customer pays in','Fees, users’ time and changed routines, the coordinators’ and Champion’s energy, IT staff time, its own legal and accounting.',3]])+
   L.note('Many evaluations are offered carelessly. When they don’t lead to a sale, the vendor loses the deal <i>and</i> all the time it spent.','alert'));
  L.done();}},
{part:0,src:'Chapter 13 · Why Do Evaluations? Customer Perspective; Vendor Perspective',run(L){
  L.h(L.kick('learn','Why evaluate?')+'<h1 class="q">The customer wants to cut risk. Find out which risk.</h1>'+
   L.list([['eye','Deeper proof','The demo wasn’t enough: they need to see their own data or workflow, or know users will truly adopt it.'],
     ['people','No good references','No similar customer to call, so a trial stands in for one.'],
     ['shield','Specific risks','Will users accept it? Can our IT handle it? Will it be fast enough? Does that capability really work outside a demo?']],1)+
   L.prose('Vendors have their own reasons: complex products best proven on site, products so easy to set up a trial is cheap, getting in before rivals (customers rarely run two trials at once), or software users won’t give back once they have it.')+
   '<p class="small">“The customer wants one” is a reason too, but only once you know <i>why</i> they want it.</p>');
  L.done();}},
{part:0,src:'Chapter 13 · Why Do Evaluations? When NOT To Do Evaluations',run(L){
  L.h(L.kick('learn','When not to')+'<h1 class="q">Six signs an evaluation will waste everyone’s time</h1>'+
   L.list([['No clear CBI','No pain, no change. Without a business problem behind it, a trial rarely becomes a sale.'],
     ['They want an education','They’re learning or comparing, with no plan to buy.'],
     ['To get the rep off their back','“If we do a trial, will you go away?”'],
     ['The vendor hopes they’ll buy','“If we can just get in the door…” Hope is not a strategy. Pushed trials leave angry customers.'],
     ['No path to purchase','No budget, or the person who controls it hasn’t agreed to buy if the trial succeeds.'],
     ['No agreed objectives','Both sides must agree what success means before starting.']],4));
  L.done();}},
{part:0,src:'Chapter 13 · Why Do Evaluations?',run(L){
  L.h(L.kick('ex','Fenmore asks for a trial')+'<h1 class="q">After the store managers’ demo, Dana asks for a 30-day evaluation in five stores</h1>');
  L.beats(L.card,[
   ['Jordan asks why','Not “sure!”, but “what would the trial need to prove?” Dana: the buyers must trust forecasts built on Fenmore’s own sales. Lee adds: will it run on Fenmore’s network without slowing the stores’ tills?'],
   ['CBI check','The CBI is clear and unchanged: margin below target, driven by spoilage and empty shelves.'],
   ['Path to purchase','Jordan asks who signs. The CFO approves new software. Dana confirms there’s budget and that, if the agreed criteria are met, Fenmore will buy.'],
   ['Objectives','Both sides agree to write measurable success criteria before anything is installed.'],
   ['Decision','Specific risks, a real CBI, budget, a signer, and a plan for criteria: Jordan says yes.']],
   'Before agreeing to a trial, find the specific risks it must remove and confirm a real path to purchase.');}},
{part:0,src:'Chapter 13 · When NOT To Do Evaluations',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Which of these is a reason to hold back from an evaluation?</h1>');
  L.mc(L.card,['The customer needs to see its own data work','The budget holder hasn’t agreed to buy if it works','There are no similar customers to call'],1,
   'With no commitment from the person who controls the money, even a perfect trial may not lead to a sale.',
   'Seeing their own data and lacking references are fair customer reasons for a trial. No agreement from the budget holder is the warning sign.');}},
{part:0,src:'Chapter 13 · Why Do Evaluations?',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Go ahead, or hold back?',['Go ahead','Hold back'],[
   ['Ostrova’s analysts want a free 90-day trial “to learn about forecasting.” No problem is named yet.',1,'That’s an education request with no CBI behind it.'],
   ['Fenmore’s IT team must confirm Planner runs on its servers before the CFO signs. Budget is set.',0,'A specific risk, a signer and a budget: a sound reason to evaluate.'],
   ['Jordan pushes a trial at a chain that hasn’t named any problem, “to get our foot in the door.”',1,'Vendor hope. It risks an angry customer and makes going back harder.'],
   ['A buyer at another chain says: “Fine, we’ll trial it if you stop calling.”',1,'Agreed only to get rid of the rep. A poor reason.'],
   ['A chain with a clear spoilage CBI and budget hasn’t agreed what success looks like.',1,'Not yet: agree the objectives and success criteria first.']]);}},

/* ---------- PART 2: SUCCESS CRITERIA ---------- */
{part:1,src:'Chapter 13 · Success Criteria For Evaluations',run(L){
  L.h(L.kick('learn','Five things to agree first')+'<h1 class="q">An evaluation without clear objectives is a strategy of hope</h1>'+
   L.list([['target','Objectives','Clear, achievable and measurable.'],
     ['cal','Timeline','For the whole trial, and for each objective.'],
     ['people','Players and roles','Who does what, on both sides, and when.'],
     ['scale','The value equation','What the trial is worth, and who pays for it.'],
     ['check','The purchasing process','Who signs, when, with what budget, and who else must approve.']],2)+
   L.prose('Agree all five before investing in the trial. Then a successful evaluation leads straight to a decision.'));
  L.done();}},
{part:1,src:'Chapter 13 · Define And Agree Upon Clear And Achievable Objectives',run(L){
  L.h(L.kick('learn','Measurable objectives')+'<h1 class="q">“Did you like it?” is a trap for both sides</h1>'+
   L.prose('Each objective should map back to the CBIs, Reasons and Specific Capabilities found in qualification. The more it can be counted, the less room for disagreement at the end.')+
   L.lanes([['check','Measurable','Time to finish a task. Time for a screen or query to return. Clicks to finish a task. Matches an agreed report format.',2],
            ['x','Vague','“Did you like the software?” “Did it help your day-to-day work?” These lead to mismatched expectations and bad feelings.',4]])+
   L.prose('If the vendor thinks the criteria are too hard, it negotiates or withdraws. If the customer is uneasy, it negotiates too. Nobody starts until both agree.'));
  L.done();}},
{part:1,src:'Chapter 13 · Define And Agree Upon Clear And Achievable Objectives',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">Kai and Sam turn wishes into success criteria</h1>');
  L.beats(L.card,[
   ['Wish 1','“The buyers should like it.” Kai asks: what would show they trust it? Sam: they accept most suggested orders without rebuilding them.'],
   ['Criterion 1','<b>Buyers accept at least 8 in 10 suggested order lines as they stand.</b> (Ties to Specific Capability 1, the forecast.)'],
   ['Wish 2','“It should save time.” Fenmore’s Delta was 12 person-days a week down to 1.'],
   ['Criterion 2','<b>One buyer builds all five stores’ weekly lists in under one day.</b> (Capability 2, the reorder report.)'],
   ['Wish 3','Lee: “It mustn’t slow the stores.”'],
   ['Criterion 3','<b>The reorder report opens in under 10 seconds in every test store.</b> (Lee’s performance risk.)']],
   'Each vague wish became a number tied to a Specific Capability or a named risk. At the end, everyone can just check.');}},
{part:1,src:'Chapter 13 · Define And Agree Upon Clear And Achievable Objectives',pts:5,run(L){
  L.h(L.kick('try','Sort them')+'<h1 class="q">Which draft criteria for Fenmore’s trial are measurable?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Measurable','Too vague'],[
   ['Store managers feel more confident about orders',1,'A feeling. Ask what they would do differently, then count that.'],
   ['Approved orders reach suppliers with no retyping',0,'Easy to check: did anyone retype an order?'],
   ['The planner is generally helpful to buyers',1,'“Helpful” can’t be measured. Tie it to a task and a time.'],
   ['Spoilage alerts appear by 7 a.m. each Monday',0,'A clear output and a clear time.'],
   ['Robin rebuilds no more than 2 in 10 order lines',0,'A countable number linked to trust in the forecast.']],
   'Measurable criteria name a task, a number or an output, so the final Go/No Go is a fact, not an opinion.');}},
{part:1,src:'Chapter 13 · Managing Evaluations – The “Sequence Of Events”',run(L){
  L.h(L.kick('learn','The Sequence of Events')+'<h1 class="q">A simple shared table that keeps the trial on track</h1>'+
   L.prose('A '+L.g('sequence-of-events','Sequence of Events')+' lists each key task in a few words, with these columns:')+
   '<div style="display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px">'+['Task or event','Track (business, legal, IT, user)','Start date','End date','Done?','Who’s responsible','Go/No Go'].map(w=>'<span class="chip static">'+w+'</span>').join('')+'</div>'+
   L.list([['Build it together','The vendor drafts; the customer adds, cuts and assigns its own people. Shared work creates shared ownership.'],
     ['Run tasks side by side','Legal can review the agreement while IT checks the network.'],
     ['Plan small yeses','Several easy '+L.g('go-no-go','Go/No Go')+' points make the final “yes” easier.'],
     ['Go past the finish','A great one runs into early roll-out, showing you care about success, not just the sale.']],3)+
   '<p class="small">A classic check: slip in an odd date, like user testing on a Sunday, to see if the customer really reads it.</p>');
  L.done();}},
{part:1,src:'Chapter 13 · Managing Evaluations – The “Sequence Of Events”',pts:1,
 solve:async L=>{L.$('#par').click();},
 run(L){
  const T=[['Sign trial agreement','Legal',0,10,0],['IT checks network','IT',10,7,0],['Load sales history','IT',17,3,10],['Train buyers','User',20,1,10],['30-day store trial','User',21,30,10]];
  const S=55;let par=false;
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Dana wants a decision before quarter end, 45 days away. Will the plan fit?</h1>'+
   '<div style="background:var(--soft);border-radius:16px;padding:14px;margin:8px 0 6px"><div id="gt"></div><div class="small" id="tt" style="margin-top:8px"></div></div>'+
   '<button class="btn pri" id="par" style="margin-top:6px">'+L.ic('layers')+'Run legal alongside IT</button><div id="pq"></div>');
  const draw=()=>{let end=0;L.$('#gt').innerHTML=T.map(t=>{const st=par?t[2]-t[4]:t[2];end=Math.max(end,st+t[3]);
     return '<div style="margin:6px 0"><div class="small">'+t[0]+' · '+t[1]+'</div><div style="position:relative;height:12px;background:var(--card);border-radius:6px"><div style="position:absolute;left:'+(st/S*100)+'%;width:'+(t[3]/S*100)+'%;height:12px;border-radius:6px;background:var(--'+(t[1]==='Legal'?'h3':t[1]==='IT'?'h2':'ok-strong')+');transition:left .5s"></div><div style="position:absolute;left:'+(45/S*100)+'%;top:-3px;width:2px;height:18px;background:var(--no)"></div></div></div>';}).join('');
    L.$('#tt').innerHTML='Decision on <b>day '+end+'</b>. Quarter ends on day 45 (red line). '+(end<=45?'<span style="color:var(--ok)">It fits.</span>':'<span style="color:var(--no)">Too late.</span>');};
  draw();
  L.$('#par').onclick=function(){this.remove();par=true;draw();
    const q=L.$('#pq');q.innerHTML='<h2 class="sub">Why could legal and IT overlap, but not training and the store trial?</h2>';
    L.mc(q,['Training must finish before buyers can test','Legal and IT share the same people'],0,
     'Legal and IT don’t depend on each other, so they can run side by side. The trial needs trained buyers, so it must follow training.',
     'They overlap because they don’t depend on each other, not because of shared staff. The store trial needs trained buyers, so it waits for training.');};}},
{part:1,src:'Chapter 13 · Agree On The Timeline; The “Sequence Of Events”',pts:1,run(L){
  L.h(L.kick('pr','Put it in order')+'<h1 class="q">Put the main rows of Fenmore’s Sequence of Events in order.</h1><div id="od"></div>');
  L.order(L.$('#od'),['Agree objectives, timeline and roles · Go/No Go','Sign the evaluation agreement','Install Planner and load sales history','Train the five stores’ buyers','Test report speed in each store · Go/No Go','Buyers run four weekly order cycles','Summary meeting · final Go/No Go','Roll out to the next ten stores'],
   'Agree first, then paperwork, setup, training, testing with early checkpoints, the final decision, and dates running on into roll-out.');}},

/* ---------- PART 3: PRICE AND TERMS ---------- */
{part:2,src:'Chapter 13 · Managing Evaluations – Pricing And Value; Payment Options',run(L){
  L.h(L.kick('learn','Should it be free?')+'<h1 class="q">If the trial has real value, don’t give it away</h1>'+
   L.prose('Value in an evaluation comes from the customer’s use of the software, the vendor’s training, setup and data work, and the vendor’s people (their direct cost and the deals they’re not working on).')+
   L.lanes([['x','Unpaid','No “skin in the game”, so often little commitment. Free can also suggest the trial, or the software, has no value, which makes it hard to get the customer’s people to take part.',4],
            ['check','Paid','Raises its importance for everyone. The customer pays for some or all of the value: services used, a fair share of the license for the time used.',2]])+
   L.prose('You can always set a price and then waive it, or refund it if they buy. Either way the customer has agreed what the trial is worth. If they see <i>no</i> value in it, requalify.'));
  L.done();}},
{part:2,src:'Chapter 13 · License Agreement Options; Pilots vs. Evaluations',run(L){
  L.h(L.kick('learn','Contracts and pilots')+'<h1 class="q">One agreement instead of two, and a trial that’s really a start</h1>'+
   L.prose('A standard trial needs two license agreements: one for the trial, one for the purchase. Getting each through legal is slow. A '+L.g('rollover','Rollover agreement')+' covers both. It can roll into a sale automatically unless the customer sends a “No Go” letter, or start the sale when they send an acceptance letter.')+
   L.lanes([['flask','Evaluation fits when','The software works out of the box, needs little customization, and little data preparation.',1],
            ['leaf','A pilot fits when','Heavy setup or workflow change is needed, value builds over a long time, or you want to seed key users before a bigger license.',2]])+
   '<p class="small">A '+L.g('pilot','pilot')+' is a real paid license for a starter group of users.</p>');
  L.done();}},
{part:2,src:'Chapter 13 · Pricing And Value; License Agreement Options',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">Jordan sets the terms for Fenmore’s trial</h1>');
  L.beats(L.card,[
   ['Count the value','Kai’s setup days, loading two years of sales history, buyer training, and five stores getting real reorder lists for a month.'],
   ['Name a price','Jordan proposes a fee covering the training and data work, plus a fair share of the license for 30 days.'],
   ['Soften it','The fee is refunded in full if Fenmore buys. Sam likes that: the money is only “lost” if Planner fails.'],
   ['One contract','Jordan offers a Rollover agreement: if the criteria are met, Fenmore sends an acceptance letter and the sale starts. No second trip through legal.'],
   ['Result','Fenmore has skin in the game, the CFO sees a defined value, and the path from trial to purchase is already on paper.']],
   'Price the value, offer to refund it on purchase, and use one agreement for trial and sale.');}},
{part:2,src:'Chapter 13 · Pricing And Value; Payment Options',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Lee asks: “Other vendors trial for free. Why should we pay?” What’s Jordan’s best reply?</h1>');
  L.mc(L.card,['“Fine, we’ll make it free to keep things simple.”','“It has real value. We’ll refund it if you buy.”','“Our price is fixed and not open for discussion.”'],1,
   'It names the value, keeps the customer committed, and removes the sting if the trial succeeds.',
   'Free removes the customer’s commitment and suggests no value. Refusing to talk is needlessly rigid. Name the value and offer the refund on purchase.');}},
{part:2,src:'Chapter 13 · Pilots vs. Evaluations',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Evaluation or pilot?',['Evaluation','Pilot'],[
   ['Planner works out of the box for a 12-store chain with clean sales data.',0,'Little setup or data work: an evaluation fits.'],
   ['A chain must clean ten years of messy data and change how buyers work before seeing value.',1,'Heavy preparation and slow payback: a pilot fits better.'],
   ['Pallaro wants to seed a few keen buyers to build support for a chain-wide license.',1,'Seeding users is a classic reason for a pilot.'],
   ['The only open question is whether reports load fast on the customer’s network.',0,'A narrow check on ready-to-run software: an evaluation.']]);}},

/* ---------- PART 4: WHEN IT WOBBLES ---------- */
{part:3,src:'Chapter 13 · Comments, Observations and Tips',run(L){
  L.h(L.kick('learn','Common complaints')+'<h1 class="q">Things still go wrong. Tap each card for the book’s advice.</h1>');
  L.flips(L.card,[
   ['“Install or data loading wasn’t finished”','Don’t start until both sides are ready. Better to miss the quarter than run a half-built trial.'],
   ['“The training wasn’t very good”','Standard training may not fit. Train only the tasks the trial needs, ideally by the SE, then follow up with Tips and Tricks sessions.'],
   ['“Nobody is using it”','Check: are the CBIs clear? Was training focused? Are objectives agreed? Is there a Sequence of Events? Then drive users, gently but firmly.'],
   ['“Can we have another month?”','Ask why. They may want it while buying completes, or may be avoiding bad news. Should they pay for the extra use?'],
   ['“We want to expand the objectives”','Ask why. More users or uses can be good news, so renegotiate. Raising the bar can be a way out, so be ready to stop.'],
   ['“Can we use it while legal finishes?”','Tough love: saying yes removes the pressure to sign. Taking it away may speed them up.'],
   ['“Sorry, it didn’t work out”','Find out why, from facts not opinions. Then uninstall cleanly and leave a good last impression.']],
   'The common thread: before reacting, find out <b>why</b>.');}},
{part:3,src:'Chapter 13 · “Nobody Is Using/Used Your Software…”',run(L){
  L.h(L.kick('ex','Day 12 of Fenmore’s trial')+'<h1 class="q">Wen checks the logs: two of the five stores haven’t opened Planner</h1>');
  L.beats(L.card,[
   ['Check the basics','The CBIs and criteria are clear and agreed, and there’s a Sequence of Events. But the user tasks for Stores 3 and 9 were never assigned to anyone.'],
   ['Check the training','Those stores’ buyers sat through Pallaro’s standard day-long course. Little of it covered the weekly reorder tasks.'],
   ['Act','With Jordan’s OK, Wen runs a focused hour at each store: just the reorder report and approving orders.'],
   ['Stay close','Wen adds the missing tasks and owners to the Sequence of Events with Sam, then calls both buyers each Monday.'],
   ['Day 20','Both stores are running weekly cycles. The trial is back on track.']],
   'When nobody’s using it, check the CBIs, the training, the objectives and the Sequence of Events, then drive users forward yourself.');}},
{part:3,src:'Chapter 13 · “Can We Use The Software While We Wait For Legal…?”',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">The trial met every criterion. Sam asks: “Can the five stores keep using Planner while our legal team finishes?” What should Jordan do?</h1>');
  L.mc(L.card,['Say yes, it shows goodwill to the Champion','Say yes, as long as Sam asks legal to hurry','Kindly say no, and remove it until signed'],2,
   'Tough love. Taking it away keeps the pressure to sign, and people hold on harder to what’s being pulled away.',
   'A friendly yes removes Jordan’s only lever on legal and purchasing. The book recommends taking it away until the agreement is signed.');}},
{part:3,src:'Chapter 13 · Comments, Observations and Tips',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Jordan’s best first move',['Hold the start date','Ask why, then decide','Focus the training','Pull it back kindly'],[
   ['Quarter end looms, but data for two stores isn’t loaded yet. The team wants to start anyway.',0,'Don’t start until both sides are ready, even if it means missing the quarter.'],
   ['Near the end, Dana asks to add the bakery department to the criteria.',1,'It might be new value, or a way to raise the bar. Ask why before agreeing.'],
   ['Robin says the course covered dozens of screens the trial never uses.',2,'Training should cover only the tasks the trial needs.'],
   ['On day 28, Sam asks for “another month, just to be safe.”',1,'Find out what’s behind it, and whether extra use should be paid for.'],
   ['Fenmore signed off on success but wants to keep using it until legal finishes.',3,'Taking it away keeps the pressure on to sign.']]);}},
{part:3,src:'Chapter 13 · The “Database Breakeven Point”',run(L){
  L.h(L.kick('learn','The Database Breakeven Point')+'<h1 class="q">When does a new database become worth checking first?</h1>'+
   L.prose('Tools whose value depends on what’s stored in them start empty, and nearly useless. Each user silently asks: “Am I more likely to find this here, or the way I always have?”')+
   L.flow([['box','Empty','Users stick to the old way','',4],['trend','Filling','Answers sometimes there','',3],['check','Breakeven','As likely as the old way: users try it first','',2]])+
   L.list([['Set expectations','Tell customers how long other customers took to get there.'],
     ['Pre-fill the box','Ship it with useful content already loaded.'],
     ['Collect and curate','Load the customer’s existing data for them, as a paid service, rather than waiting for them to do it.']],2));
  L.done();}},
{part:3,src:'Chapter 13 · The “Database Breakeven Point”',pts:1,run(L){
  L.h(L.kick('pr','What should Kai do?')+'<h1 class="q">Fenmore’s buyers keep a shared notes file on suppliers. Planner can store these notes, but a new store would start empty. How can Kai get buyers using Planner’s notes sooner?</h1>');
  L.mc(L.card,['Load the existing notes file before go-live','Wait until buyers have typed in enough notes','Remind buyers by email to use the new notes'],0,
   'That’s “collect and curate”: filling the box with content they already have, so it’s worth checking from day one.',
