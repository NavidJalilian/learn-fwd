<script>
Course.lesson({
  id:'0007', title:'Building the demo, from Illustration to practice', minutes:20, icon:'layers',
  goals:['Write a demo Outline, Summary and Introduction before touching the software','Build a Situation Slide and Illustration that make the audience ask “how?”','Trim Do It and Do It Again, then practice, rehearse and re-confirm'],
  parts:['Outline','Summary first','Illustration','Do It to ready'],
  read:'Read chapter 8 of the book (from “Create Your Outline”) for the SAR Table story and the full Summary and Introduction templates.',
  glossary:{
    outline:'Outline: the list of the demo’s sections in order (what happens, not how), which also becomes the Introduction.',
    'reference-story':'Reference Story: a Situation Slide built from a similar customer’s success (same job title, details removed), used when you don’t yet know this customer’s situation.',
    'demo-info-sheet':'Demonstration Information Sheet: the Salesperson’s handover to the SE: org chart and Chain of Pain, meeting objective, each person’s CBIs, Reasons and Specific Capabilities, plus the Meeting Information Sheet.',
    'canned-demo':'Canned Demo: a demo prepared in advance, usually recorded, for times when nobody can give a live demo.'
  },
  cheatsheet:[
    'The <b>Outline</b> says <i>what</i> happens, not how: Introduction, Illustrations, then for each Solution a fast pass and a slow pass with summaries, then Q&amp;A and a final Summary.',
    'Write the <b>Summary first</b>, shaped by the objective (Technical Proof or Vision Generation). The <b>Introduction</b> is the same thing in the future tense.',
    'Restate the Specific Capabilities in the Introduction and every summary, so the audience can agree it’s a Solution.',
    'The best Illustrations sit on the customer’s desk, in the files they open every morning, on their whiteboard. Or design the report with them.',
    '<b>Situation Slide</b>: customer and job title, CBI, Reasons, Specific Capabilities, Delta. Confirm it, describe the Illustration, recall the Delta. For Vision Generation use a <b>Reference Story</b>.',
    '<b>Do It</b> = fewest clicks, about 1–2 minutes, real file names, visible menus, end on the best screen. <b>Do It Again</b> = the scenic route, 5–10 minutes, still only what they need.',
    'Whole demo: <b>15–30 minutes</b>. Time it; too long, trim Do It Again; too short, check for a missed capability, or finish early.',
    'Rehearse with the Selling Team (no new features), adjust (a changed Illustration changes both passes), then call the customer: objectives, people, time.'
  ],
  steps:[
/* ---------- PART 1: OUTLINE ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">You have to give a five-minute toast at a friend’s wedding. What do you settle first?</h1>');
  L.mc(L.card,['The exact words of your opening joke','The three points you’ll make, in order'],1,
   'Decide <i>what</i> you’ll cover and in which order, and the wording can follow. The book builds a demo the same way, starting with an Outline.',
   'Polishing one line before you know the shape of the whole toast risks a great joke in a speech that wanders. Settle the points and their order first.');}},
{part:0,src:'Chapter 8 · 3. Create Your Outline',run(L){
  L.h(L.kick('learn','Step 3: the Outline')+'<h1 class="q">Plan the sections before you plan the clicks</h1>'+
   L.prose('After research (step 1) and infrastructure (step 2), the SE writes an '+L.g('outline','Outline')+': which sections the demo has, in which order, with a line about each.')+
   L.quote('An Outline defines the “What”, not the “How”.','Peter Cohan, Great Demo!')+
   L.prose('The book’s simplest case: one person, one Solution, two Specific Capabilities (search for data and report it). One Illustration, the finished report, proves both, because the report can’t exist without the search.')+
   L.list([['Introduction',''],['The Illustration','the finished report'],['Fast pass','build it quickly, then a short summary'],['Slow pass','the same again, in more detail, then a short summary'],['Questions and Answers',''],['Final Summary','']],1));
  L.done();}},
{part:0,src:'Chapter 8 · 3. Create Your Outline',run(L){
  L.h(L.kick('ex','Kai’s first draft')+'<h1 class="q">Kai turns the Fenmore research into an Outline</h1>');
  L.beats(L.card,[
   ['The input','From Jordan’s '+L.g('demo-info-sheet','Demonstration Information Sheet')+': Fenmore needs to forecast demand per store, get a weekly reorder report with risk flags, and send approved orders to suppliers.'],
   ['One Solution','All three feed one result Sam cares about: the <b>Store reorder report</b>. That’s the Illustration.'],
   ['The Outline','Introduction · Store reorder report · fast build + summary · slow build + summary · Q&amp;A · final Summary.'],
   ['The surprise','Kai notices the Outline <i>is</i> the Introduction: “First I’ll show you the finished report, then quickly how it’s built, then again in more detail…”'],
   ['The habit','Kai names the three capabilities in the Introduction and in every summary. That gives Sam and Dana a chance to say, “Yes, that solves it.”']],
   'A Solution only counts as one if the customer agrees. Restating the capabilities at the start and in each summary invites that agreement.');}},
{part:0,src:'Chapter 8 · 3. Create Your Outline',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Which line belongs in Kai’s Outline?</h1>');
  L.mc(L.card,['Click Forecast, set 8 weeks, then press Run','Show the finished Store reorder report','Explain the menu bar before starting'],1,
   'That’s a section of the demo, a <i>what</i>. The clicks come later, when Kai builds Do It.',
   'An Outline lists sections, not clicks or menu tours. “Show the finished Store reorder report” is a what; the rest are hows, or don’t belong at all.');}},
{part:0,src:'Chapter 8 · 3. Create Your Outline',run(L){
  L.h(L.kick('learn','More than one Solution')+'<h1 class="q">A formula that works for any number of Solutions</h1>'+
   L.tiers([['pencil','1 · Introduction','',''],['star','2 · All the Illustrations','Every Solution’s result, right up front',''],
     ['cycle','3 · For each Solution','Show its Illustration again → fast pass + summary → slow pass + summary','',true,'repeat'],
     ['list','4 · Summary across all','',''],['chat','5 · Q&amp;A','',''],['check','6 · Final Summary','','']])+
   L.prose('Showing every Illustration early proves there is an answer to each problem. Someone who only cares about the second Solution now has a reason to wait for it.')+
   '<p class="small">The many summaries also act as a road map: the audience always knows where they are.</p>');
  L.done();}},
{part:0,src:'Chapter 8 · 3. Create Your Outline',pts:1,run(L){
  L.h(L.kick('pr','Build the Outline')+'<h1 class="q">Dana asks for supplier ordering to be its own Solution, with its own Illustration: the sent-orders screen. Tap Kai’s new Outline into order.</h1><div id="od"></div>');
  L.order(L.$('#od'),['Introduction','Both Illustrations, up front','Report: show it again, fast pass, summary','Report: slow pass, summary','Orders: show it, fast pass, summary','Orders: slow pass, summary','Summary of both Solutions','Questions and Answers','Final Summary'],
   'Both results first, then each Solution in turn (fast, then slow, with summaries), then the cross-summary, Q&amp;A and the close.');}},

/* ---------- PART 2: SUMMARY FIRST ---------- */
{part:1,src:'Chapter 8 · 4. Create Your Summary and Introduction',run(L){
  L.h(L.kick('learn','Step 4: Summary, then Introduction')+'<h1 class="q">Write the ending before the middle</h1>'+
   L.prose('The book compares building a demo without a Summary to picking a random address from the phone book and driving off with no map. You need to know where you’re going.')+
   L.prose('The Summary depends on the demo’s objective, found on the Demonstration Information Sheet: '+L.g('technical-proof','Technical Proof')+' or '+L.g('vision-generation','Vision Generation')+'. It follows the Outline:')+
   L.list([['Objective','“Our objective today was to…”'],['Each Solution','The capability, the Illustration, the fast pass, the slow pass, “we showed we can…”'],['Each question','What was asked, what we answered, briefly'],['Close','“I believe we met our objective.”']],2)+
   L.note('<b>The Introduction is the Summary in the future tense.</b> Same parts, but describing what <i>will</i> happen.','cycle'));
  L.done();}},
{part:1,src:'Chapter 8 · 4. Create Your Summary and Introduction',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">Kai writes the Fenmore Summary, then flips it</h1>');
  L.beats(L.card,[
   ['Objective','The sheet says <b>Technical Proof</b>. Kai writes: “Our objective was to prove Pallaro Planner can build each store’s reorder list for you.”'],
   ['The Solution','“I showed you the Store reorder report, then quickly how it’s built, then the same again in detail.”'],
   ['The questions','“Your question was… We said…” Kai leaves blanks for whatever gets asked, to fill in at the end.'],
   ['The close','“I believe we showed Fenmore can build reorder lists in one person-day instead of twelve.”'],
   ['The flip','Kai copies it and changes the tense: “Our objective today <b>is</b>… First I’ll show you… Then I’ll show you…” That’s the Introduction.']],
   'Tell them what you’ll show, show it, then tell them what you showed. Writing the Summary first makes the other two easy.');}},
{part:1,src:'Chapter 8 · 4. Create Your Summary and Introduction',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Wen has a finished Summary for a bakery-chain demo. What’s the quickest way to write the Introduction?</h1>');
  L.mc(L.card,['Start fresh, with a story about Pallaro','Recast the Summary in the future tense','Skip it and open the software at once'],1,
   'Same parts, same order, different tense. The Introduction says what will happen; the Summary says what did.',
   'The book gives a shortcut: the Introduction has the same form as the Summary, only in the future tense. A fresh story or no Introduction loses that link.');}},
{part:1,src:'Chapter 8 · 4. Create Your Summary and Introduction',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Tap each piece until it’s a good opening for Kai’s Fenmore Introduction.</h1>');
  L.sentence(L.card,[['Today I’ll tour every feature so you can','Our objective today is to prove you can'],
     ['see what each Pallaro module does.','build each store’s reorder list fast.'],
     ['First I’ll show you the finished report,','First we’ll set up a sample store,'],
     ['then quickly how it’s built,','then the log-in and settings,'],
     ['then the same again in detail.','then whatever else time allows.']],[1,1,0,0,0],
   [['A tour of every feature has no objective tied to Fenmore’s problem.'],['Fenmore didn’t ask about every module. Name the capability they need.'],['Setting up first is the old story order. Show the end first.'],['Log-in and settings aren’t the Do It. The fast pass goes straight to the report.'],['An open-ended “whatever else” invites a feature tour. The slow pass repeats the same path.']],
   'Objective, then the Illustration, the fast pass and the slow pass: it’s the Outline, said out loud.');}},

/* ---------- PART 3: ILLUSTRATION ---------- */
{part:2,src:'Chapter 8 · 5. Create Your Illustration',run(L){
  L.h(L.kick('learn','Step 5: the Illustration')+'<h1 class="q">The heart of the demo is one picture of the result</h1>'+
   L.prose('People half-listen to a Selling Team’s words, but they study images quickly and carefully. An '+L.g('illustration','Illustration')+' is a short, visual proof that the Solution is real, often the report the customer wants.')+
   L.prose('Where to find it? The book says the best material is often <b>on top of the customer’s desk</b>, because that’s their most important work. Also look at:')+
   L.list([['list','The files they open every morning','Reports, spreadsheets, dashboards'],['pencil','Their whiteboard','Where key projects and status live'],['box','Their briefcase','Documents they carry everywhere']],3)+
   '<p class="small" style="margin-top:10px">Surest of all: design the report <i>with</i> the customer. Then match the format to how they use it, on screen or on paper.</p>');
  L.done();}},
{part:2,src:'Chapter 8 · 5. Create Your Illustration',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Kai visits Fenmore to find material for the Illustration. Where should Kai look first?</h1>');
  L.mc(L.card,['The reorder spreadsheet Robin opens every Monday','The highlights page of Pallaro’s latest release','Malik’s standard trade-show slide deck'],0,
   'It’s the work Fenmore already does every week. An Illustration that mimics it, done better and faster, speaks straight to them.',
   'Pallaro’s own materials show what Pallaro thinks is exciting. The best Illustrations come from the customer’s desk: here, Robin’s Monday spreadsheet.');}},
{part:2,src:'Chapter 8 · 5. Create Your Illustration',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">Three Illustrations, building to a climax</h1>');
  L.beats(L.card,[
   ['The plan','An SE prepared three Illustrations for one Solution: a basic version of what the customer needed, a clearer and richer one, and one with everything they could imagine.'],
   ['First','After the Introduction the SE showed the basic one. People asked, “How did you make that?”'],
   ['Second','The richer one got a stronger reaction. The audience asked to be shown how, right now.'],
   ['Third','The last was a report they had been trying to produce for years. The room erupted and demanded to learn how to make it.'],
   ['Why it worked','The audience had seen <i>what</i> was possible, so they pulled the SE into the <i>how</i>. The demo was a huge success.']],
   'More than one Illustration can fit one Solution, either to prove several capabilities or to build to a climax.');}},
{part:2,src:'Chapter 8 · Presenting Illustrations',run(L){
  L.h(L.kick('learn','The Situation Slide')+'<h1 class="q">Set the scene before you show the result</h1>'+
   L.prose('Before the Illustration, show a '+L.g('situation-slide','Situation Slide')+'. For Technical Proof it simply recalls what the customer already told you:')+
   L.list([['Customer','Company, and job title of the person who owns the CBI'],['CBI',''],['Reasons',''],['Specific Capabilities needed',''],['The Delta','Cheaper, better, faster, or couldn’t be done before, in money, time or people']],1)+
   L.flow([['check','Confirm','Review the slide; ask if it’s right','',1],['eye','Describe','Say what they’re seeing in the Illustration','',2],['trend','Recall the Delta','How it was done before, and now','',3]]));
  L.done();}},
{part:2,src:'Chapter 8 · Presenting Illustrations',pts:6,run(L){
  L.h(L.kick('pr','Build the slide')+'<h1 class="q">Kai drafts Fenmore’s Situation Slide. Which items belong on it?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['On the slide','Leave it off'],[
   ['Fenmore Markets · Dana Reyes, VP of Operations',0,'The customer and the job title of the person who owns the CBI.'],
   ['Pallaro’s history and list of happy customers',1,'This slide is about Fenmore’s situation, not about Pallaro.'],
   ['Operating margin is below target this year',0,'That’s Dana’s CBI.'],
   ['Reorder lists: 12 person-days a week down to 1',0,'That’s the Delta, stated in people and time.'],
   ['Every module in the latest Pallaro Planner release',1,'Only the Specific Capabilities Fenmore needs belong here.'],
   ['Too much fresh food is thrown away; best-sellers run out',0,'Those are the Reasons behind the CBI.']],
   'Customer, CBI, Reasons, Specific Capabilities, Delta. Everything on it came from Fenmore, so Dana can confirm it in a minute.');}},
{part:2,src:'Chapter 8 · Presenting Illustrations',run(L){
  L.h(L.kick('learn','When you don’t know their situation yet')+'<h1 class="q">For Vision Generation, borrow a similar customer’s story</h1>'+
   L.prose('In a Vision Generation demo you may know little about the customer’s CBIs. So the Situation Slide shows an <b>expected</b> situation instead.')+
   L.prose('People with the same job title in the same industry tend to share the same problems. If a Solution worked for one, its slide and Illustration (with names removed) is likely to land with someone in the same job elsewhere. This is a '+L.g('reference-story','Reference Story')+'.')+
   L.note('If the customer gets excited by the Illustration, stop there. Turn the talk to <b>their</b> situation, and hold the rest of the demo until you’ve qualified them.','pointer')+
   '<p class="small">Good Illustrations and their Situation Slides are worth sharing across the Selling Teams, and even in brochures.</p>');
  L.done();}},
{part:2,src:'Chapter 8 · Presenting Illustrations',pts:1,run(L){
  L.h(L.kick('pr','What should Wen do?')+'<h1 class="q">Wen has an early meeting with the head of fresh food at a new grocery chain. Nobody has qualified them yet. Two minutes in, they lean forward: “We need exactly that.” What next?</h1>');
  L.mc(L.card,['Carry on through Do It and Do It Again','Ask about their own situation, and hold the rest','Show three more modules while they’re keen'],1,
   'The Reference Story worked. Now learn their CBIs and Reasons; the rest of the demo can wait until they’re qualified.',
   'Excitement at the Illustration is the signal to switch to their situation. Pressing on, or adding modules, demos to someone whose needs you still don’t know.');}},

/* ---------- PART 4: DO IT TO READY ---------- */
{part:3,src:'Chapter 8 · 6. Develop The First Pass – The “Do It”',run(L){
  L.h(L.kick('learn','Step 6: Do It')+'<h1 class="q">The straight line from launch to the Illustration</h1>'+
   L.prose('<b>'+L.g('do-it','Do It')+'</b> is the fewest clicks from opening the software to the Illustration. No side trips, little talk. It proves two things: the software really produces that result, and it’s quick and easy to use.')+
   L.list([['clock','How long?','Ask how short it could be. Most take a minute or two.'],['star','End on the best screen','Finish on the Illustration and leave it up while you summarize and take questions. It’s the picture they take home.'],['pencil','Real file names','Not “demo1” or “test”. Use the customer’s name, or their own naming style.'],['eye','Visible menus','Keyboard shortcuts hide how you got from step to step.']],2)+
   '<p class="small" style="margin-top:10px">Keep demo files one click away, for example as desktop icons. Every click the customer sees looks like work they’ll have to do.</p>');
  L.done();}},
{part:3,src:'Chapter 8 · 6. Develop The First Pass – The “Do It”',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Kai finishes Do It on the Store reorder report. What should happen right then?</h1>');
  L.mc(L.card,['Move straight on to the slow pass','Close the report and open settings','Summarize, with the report still showing'],2,
   'A capability has just been proven. Call it out in a short summary while the best screen stays up.',
   'The book insists on a short summary at this point, with the Illustration still on screen so it sinks in.');}},
{part:3,src:'Chapter 8 · 6. Develop The First Pass – The “Do It”',pts:1,
 solve:async L=>{[1,3,5].forEach(j=>L.$('#tp').children[j].click());L.$('#run').click();},
 run(L){
  const S=[['Open Pallaro Planner from the desktop icon',1,0],['Tour the settings menu “so you know where things are”',8,1],['Open Fenmore’s Store 12 sales history',2,0],['Show the new staff-scheduling module',5,1],['Run the 8-week forecast',1,0],['Explain every forecast option in detail',4,1],['Open the Store reorder report and leave it up',1,0]];
  const cut=new Set();let first=true;
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Kai’s draft Do It is 22 clicks long. Tap each step to cut what doesn’t belong, then run it.</h1>'+
   '<div id="tp" style="display:flex;flex-direction:column;gap:8px;align-items:stretch"></div>'+
   '<div style="display:flex;align-items:center;justify-content:space-between;margin-top:12px;gap:10px"><div><div class="small">Clicks the audience sees</div><div class="week" id="ck">22</div></div><button class="btn pri" id="run">'+L.ic('play')+'Run it</button></div><div id="tf"></div>');
  const draw=()=>{L.$('#ck').textContent=S.reduce((a,s,j)=>a+(cut.has(j)?0:s[1]),0);};
  S.forEach((s,j)=>{const b=document.createElement('button');b.className='chip';b.style.cssText='justify-content:space-between;text-align:left;width:100%';
    b.innerHTML='<span>'+s[0]+'</span><span class="small">'+s[1]+'</span>';
    b.onclick=()=>{if(cut.has(j)){cut.delete(j);b.style.textDecoration='';b.style.opacity='';}else{cut.add(j);b.style.textDecoration='line-through';b.style.opacity='.45';}L.$('#tf').innerHTML='';draw();};
    L.$('#tp').appendChild(b);});
  L.$('#run').onclick=()=>{L.$('#tf').innerHTML='';const wrong=S.map((s,j)=>(s[2]===1)!==cut.has(j)?j:-1).filter(j=>j>=0);
    if(!wrong.length){if(first)L.award(true);L.$('#run').remove();
      L.sheet('ok','5 clicks, straight to the report','Settings tours and new modules aren’t on the path. Explaining every option belongs in Do It Again, the scenic route. Now the audience sees how little it takes.');L.done();}
    else{if(first)L.award(false);first=false;const s=S[wrong[0]];
      L.fb(L.$('#tf'),s[2]?'<b>“'+s[0]+'” is still in.</b> Does the report need it? If not, it’s a side trip.':'<b>You cut “'+s[0]+'”.</b> The report can’t be built without that step.','no');}};}},
{part:3,src:'Chapter 8 · 6. Develop The First Pass – The “Do It”',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Keep it or fix it?',['Keep it','Fix it'],[
   ['Kai saves the forecast as “demo_test3”.',1,'Use real names, such as “Fenmore Store 12, week 45”. Realistic names help the audience picture their own work.'],
   ['Kai uses a keyboard shortcut to copy the order list.',1,'The audience can’t see how Kai got there. Use the visible menu instead.'],
   ['Kai launches from a desktop icon, one click.',0,'Fewer visible clicks makes the software look as easy as it is.'],
   ['Kai ends the pass on the report and leaves it up for questions.',0,'The longer the best screen stays up, the better it’s remembered.'],
   ['Kai clicks through five folders to find the file.',1,'Every click looks like work the customer will have to do. Keep files one click away.']]);}},
{part:3,src:'Chapter 8 · 7. Develop The Second Pass – The “Do It Again”',run(L){
  L.h(L.kick('learn','Step 7: Do It Again')+'<h1 class="q">The same path, now the scenic route</h1>'+
   L.lanes([['play','Do It','The fastest route. A minute or two. Proves it can be done, and easily.',1],
            ['cycle','Do It Again','The scenic route. Five to ten minutes. Options, details, harder examples, and answers to the questions Do It raised.',2]])+
   L.prose('It still covers <b>only</b> the Specific Capabilities the customer needs. Run longer and the software starts to look complicated. End again on the strongest screen, and summarize.')+
   L.note('Questions from a first demo overlap a lot with the next similar audience’s, perhaps 80%. Those repeat questions are good material for your next Do It Again.','bulb'));
  L.done();}},
{part:3,src:'Chapter 8 · 8. Practice',run(L){
  L.h(L.kick('learn','Steps 8 to 11')+'<h1 class="q">Time it, rehearse it, adjust it, then call the customer</h1>'+
   L.tiers([['clock','8 · Practice','Time the demo. Introduction 1–2, Illustration 1–2, Do It 1–2, Do It Again 5–10, Q&amp;A 5–10, Summary 2–4 minutes: <b>15 to 30 in all</b>. Too long? Trim Do It Again. Too short? Check for a missed capability; if none, finish early.',''],
     ['people','9 · Present to the Selling Team','A rehearsal, with teammates playing the audience. Take feedback, but add no new capabilities.',''],
     ['pencil','10 · Adjust and refine','A changed Illustration means redoing Do It and Do It Again, a Chain of Pain of its own. Re-time it.',''],
     ['chat','11 · Confirm with the customer','A day or two before: is the infrastructure ready? Have objectives, people or time changed?','']])+
   '<p class="small" style="margin-top:10px">Ready means memorized, covering the needed capabilities, and inside the time. A script is a crutch, but better than a fumbled demo.</p>');
  L.done();}},
{part:3,src:'Chapter 8 · 8. Practice to 11. Confirm Infrastructure',pts:6,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'What should Kai do?',['Trim Do It Again','Look for a missed capability','Redo both passes','Call Fenmore','Leave it alone'],[
   ['The timed run is 38 minutes. The agreed slot is 30.',0,'Too long usually means Do It Again holds lower-priority items. Trim those.'],
   ['The run is 12 minutes. Kai wonders if something is missing.',1,'Check the Demonstration Information Sheet for a required capability and make sure the Illustration is strong. If all is there, finish early.'],
   ['At rehearsal, Jordan wants the report to show a spoilage chart.',2,'A changed Illustration flows down: Do It and Do It Again both need redoing.'],
   ['It’s two days before the meeting.',3,'Re-check the Infrastructure Checklist and ask if objectives, attendees or time limits have changed.'],
   ['It covers every capability, fits in 22 minutes, and Kai is confident.',4,'Finishing early is fine. Everybody loves a meeting that ends early.'],
   ['At rehearsal, Malik asks to add the dashboard themes.',4,'The Selling Team must resist adding capabilities Fenmore doesn’t need. Keep the plan as it is.']]);}},
{part:3,src:'Chapter 8 · But – What If You Don’t Know Your Product Well?',run(L){
  L.h(L.kick('learn','What if you don’t know the product well?')+'<h1 class="q">New release, bought-in product, or new job</h1>'+
   L.prose('Sometimes the product is brand new, came from another company, or you just joined. If you are the technical person, you have two choices at first:')+
   L.lanes([['flame','Learn it fast','Work hard and get to know it quickly. In the end you must anyway.',1],
