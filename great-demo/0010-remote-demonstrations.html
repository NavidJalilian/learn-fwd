<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remote demonstrations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0010', title:'Remote demonstrations', minutes:17, icon:'eye',
  goals:['Decide when a remote demo fits, and how to set one up so it can work','Push your energy out and pull reactions back with the right tools','Prepare the day before and run the call so nobody drifts away'],
  parts:['Pros and risks','Interactivity','Prepare and run'],
  read:'Read chapter 11 of the book for its two short exercises on presenting without seeing your audience.',
  glossary:{
    'remote-demo':'Remote Demo: a demo where the audience is in a different place from the presenter, shown over a video call or screen-sharing tool.',
    'demo-roadmap':'Demonstration Roadmap: your Outline, reworded for the audience and kept in view, so people always know where they are in the demo.',
    'champion':'Champion: a person at the customer who willingly and actively supports buying and rolling out your product, and helps you reach the right people.'
  },
  cheatsheet:[
    '<b>Pros:</b> cheaper, no travel, fast to arrange before a deadline, great for “delta” updates on a new release.',
    '<b>Big risk:</b> you lose faces and puzzled looks, and people speak up less. For critical deals, prefer face to face.',
    'If you must go remote: <b>split your forces</b> (SE remote, a colleague on site). Next best: a good existing relationship, or one-on-one.',
    '<b>Interactivity is everything:</b> push your energy out (Roadmap, pen and highlights), pull reactions back (polls, chat, questions, a volunteer driver).',
    'Let your <b>Champion</b> drive, after a short rehearsal. Type the Not Now List where all can see; strike items through when answered.',
    '<b>Before:</b> test the customer’s network a day ahead, learn the tool, match their screen size, watch on an audience machine, use a headset, clean your desktop.',
    '<b>During:</b> best screen up when sharing starts, mouse slow, ask questions often, don’t point at your own screen, summarize early and often.'
  ],
  steps:[
/* ---------- PART 1: PROS AND RISKS ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">You describe a great meal to a friend twice: once on the phone, once across the table. When can you better tell if they’re bored?</h1>');
  L.mc(L.card,['Across the table, watching their face','On the phone, listening closely'],0,
   'Faces give you feedback all the time. On a remote demo you lose most of it, and that’s the problem this lesson solves.',
   'On the phone you hear words, but you miss the glazed look or the frown. Remote demos have the same blind spot.');}},
{part:0,src:'Chapter 11 · Remote Demonstrations',run(L){
  L.h(L.kick('learn','Remote demos')+'<h1 class="q">Everything has to travel down a wire</h1>'+
   L.prose('In a '+L.g('remote-demo','Remote Demo')+', every bit of communication goes through the network and the phone line. Your personality, your energy and your movements all have to get through. And you have to judge reactions from people you can’t see.')+
   L.prose('Think of the last online demo you watched. Did your mind wander? Did you read email, mute the line to chat, or drop off? Your audience can do the same.')+
   L.quote('The name of the game in Remote Demonstrations is interactivity!','Peter Cohan, Great Demo!'));
  L.done();}},
{part:0,src:'Chapter 11 · Best and Worst Practices',run(L){
  L.h(L.kick('learn','Good news, bad news')+'<h1 class="q">Remote demos save a lot, and risk a lot</h1>'+
   L.lanes([['check','Good news','<b>Cost:</b> no flights, less time on the road.<br><b>Speed:</b> set one up in minutes when a customer must decide by tomorrow.<br><b>“Delta” updates:</b> show the key parts of a new release to a customer who already knows the product.',2],
            ['alert','Bad news','Little or no direct contact. You lose faces, puzzled looks and questions people are about to ask.<br><b>Customers speak up less</b> than they would in the room.',4]])+
   L.prose('The author strongly prefers face to face, and for <b>critical sales or important events</b> recommends meeting in person. But budgets, time and people are limited, so sometimes remote is the right call.'));
  L.done();}},
{part:0,src:'Chapter 11 · Best and Worst Practices',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Which of these is the best fit for a fully remote demo?</h1>');
  L.mc(L.card,['Fenmore’s final, deal-deciding Technical Proof','Showing Fenmore the highlights of Planner 7','A first meeting with a huge new chain’s board'],1,
   'Fenmore already knows Pallaro Planner, so a short “delta” update on the new release is exactly what remote demos are great for.',
   'Deal-deciding and high-stakes first meetings are the critical events where the book recommends going in person. A “delta” update for a customer who knows the product suits remote best.');}},
{part:0,src:'Chapter 11 · When To Use Remote Demos',run(L){
  L.h(L.kick('learn','When to go remote')+'<h1 class="q">If it must be remote, set it up to work</h1>'+
   L.tiers([['people','Split your forces','The SE demos from the office; a colleague sits with the customer to read reactions and watch the pace. The audience pays attention because someone is in the room.','Best',true,'best'],
            ['star','A relationship you already have','Respect and credibility you’ve already earned buy more attention.','Next best'],
            ['person','One-on-one','Often manageable: nobody can hide among other people on the call.','Also workable']])+
   L.prose('Splitting forces still sends one person, but it saves a lot while keeping the demo effective.'));
  L.done();}},
{part:0,src:'Chapter 11 · When To Use Remote Demos',run(L){
  L.h(L.kick('ex','Planning the Ostrova demo')+'<h1 class="q">Wen’s first remote demo, for a second prospect</h1>');
  L.beats(L.card,[
   ['The prospect','<b>Ostrova Pharmacies</b>, a pharmacy chain. It throws away out-of-date stock and runs short of cold-and-flu items every winter, but its managers mostly see that as normal.'],
   ['The objective','It’s early, so this is a '+L.g('vision-generation','Vision Generation')+' demo: short and focused, built from a Reference Story and an Illustration.'],
   ['The audience','Mira Castell, head of store operations; Teo Varga, a pharmacy manager keen on change; and three regional managers.'],
   ['The budget','Flying Wen out isn’t worth it at this stage. A fully remote call to five strangers would be risky.'],
   ['The plan','Split forces: Jordan sits in Ostrova’s meeting room, and Wen demos from Pallaro’s office.']],
   'Jordan in the room can read faces, watch the pace, and make sure people are actually paying attention.');}},
{part:0,src:'Chapter 11 · When To Use Remote Demos',pts:1,run(L){
  L.h(L.kick('pr','Rank them')+'<h1 class="q">Order these remote set-ups from the book’s best to the riskiest.</h1><div id="od"></div>');
  L.order(L.$('#od'),['SE remote, Salesperson in the room','Remote, with a customer who knows you','Remote, one-on-one with one person','Remote, to eight people you’ve never met'],
   'Someone on site is best. Then earned credibility, then one-on-one where nobody can hide. A group of strangers on a call is the hardest case.');}},

/* ---------- PART 2: INTERACTIVITY ---------- */
{part:1,src:'Chapter 11 · Generating Interactivity is Critical!',run(L){
  L.h(L.kick('learn','Push out, pull back')+'<h1 class="q">Push your energy out; pull their reactions back</h1>'+
   L.prose('They can’t see you, and you can’t see them. So you must <b>push</b> your enthusiasm through the connection, and <b>pull</b> their responses back the same way.')+
   L.lanes([['arrow','Outbound tools','Switch between a '+L.g('demo-roadmap','Demonstration Roadmap')+' and the software, so people know where they are.<br>Underline and highlight key points with the pen tool: a mark appearing on screen wakes people up.',1],
            ['cycle','Two-way tools','Polls for big groups: people want to see how their vote compares.<br>Ask questions out loud, or in the chat.<br>Hand control to a volunteer.<br>Keep inviting questions.',2]])+
   L.note('Type the Not Now List in a document everyone can see. When you answer a question later, strike it through.','list'));
  L.done();}},
{part:1,src:'Chapter 11 · Generating Interactivity is Critical!',run(L){
  L.h(L.kick('learn','Let a volunteer drive')+'<h1 class="q">The book’s most powerful tip</h1>'+
   L.prose('Give control of your desktop to someone in the audience and let them drive for a while.')+
   L.list([['person','The driver','becomes deeply engaged.'],
     ['eye','Everyone else','sits on the edge of their seat: will the volunteer make a mistake?'],
     ['check','Quiet proof','If the volunteer could do it, so could they. It shows the software is easy to use.']],3)+
   L.note('Got a '+L.g('champion','Champion')+' in the audience? Make them the volunteer, and rehearse briefly with them beforehand. That removes most of the risk and keeps all the benefits.','star'));
  L.done();}},
{part:1,src:'Chapter 11 · Generating Interactivity is Critical!',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Teo is keen on Pallaro. Wen wants Teo to drive the software during the Ostrova call. What lowers the risk most?</h1>');
  L.mc(L.card,['Let Teo explore freely, so it feels real','A short rehearsal with Teo the day before','Pick whoever seems quietest on the call'],1,
   'With a quick rehearsal, Teo knows the path. The room still gets the drama and the “if Teo can, so can I” proof.',
   'Free exploring or a random pick invites a stumble at the worst time. The book’s advice: choose your Champion and rehearse briefly first.');}},
{part:1,src:'Chapter 11 · Generating Interactivity is Critical!',pts:1,
 solve:async L=>{['t0','t2','t4'].forEach(id=>L.$('#'+id).click());L.$('#run').click();},
 run(L){
  const T=[['Poll: “How much stock do you bin each month?”',1],['Ten minutes of talk over the login screen',0],['Teo drives the Do It',1],['Long silence while the report loads',0],['Strike through Not Now items as answered',1],['Read the slides word for word',0]];
  const pick=new Set();
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Plan Wen’s 20-minute Ostrova call. Pick three moves, then run it and watch attention.</h1><div id="tp"></div>'+
   '<button class="btn pri" id="run" style="margin-top:12px" disabled>'+L.ic('play')+'Run the call</button>'+
   '<div id="sim" hidden><div class="meterrow"><div class="lb">Attention</div><div class="meter"><div id="am" style="background:var(--ok-strong);width:100%"></div></div></div><div class="small" id="mn">Minute 0</div></div><div id="rf"></div>');
  T.forEach((t,j)=>{const b=document.createElement('button');b.className='chip';b.id='t'+j;b.textContent=t[0];
    b.onclick=()=>{if(L.$('#run')===null||L.$('#run').dataset.done)return;if(pick.has(j)){pick.delete(j);b.classList.remove('sel');}else if(pick.size<3){pick.add(j);b.classList.add('sel');}L.$('#run').disabled=pick.size!==3;};
    L.$('#tp').appendChild(b);});
  L.$('#run').onclick=function(){if(pick.size!==3)return;this.dataset.done='1';this.hidden=true;L.$('#sim').hidden=false;
    const good=[...pick].filter(j=>T[j][1]).length;const end=[25,45,70,95][good];let m=0;
    const t=setInterval(()=>{m+=2;const am=L.$('#am'),mn=L.$('#mn');if(!am){clearInterval(t);return;}
      am.style.width=Math.round(100-(100-end)*m/20)+'%';mn.textContent='Minute '+m;
      if(m>=20){clearInterval(t);const ok=good===3;L.award(ok);
        L.sheet(ok?'ok':'no',ok?'They stayed with you':'Attention drained away',(ok?'Every move pulled a reaction back: a poll, a volunteer driver, visible progress on the list.':'Moves that only push words out (or nothing at all) let a remote audience drift to email. Pick moves that make people <i>respond</i>: the poll, Teo driving, striking through answered questions.')+' On a remote call, interactivity is what holds attention.');L.done();}},150);};}},
{part:1,src:'Chapter 11 · Generating Interactivity is Critical!',pts:6,run(L){
  L.h(L.kick('pr','Push or pull?')+'<h1 class="q">Sort each move: does it push energy out, or pull a response back?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Outbound (push)','Two-way (pull)'],[
   ['Flip back to the Roadmap slide between sections',0,'Guides the audience and breaks the demo into easy chunks, but asks nothing of them.'],
   ['Run a poll on how often shelves go empty',1,'People vote and want to see how their answer compares.'],
   ['Circle the red flags with the pen tool',0,'A mark appearing on screen draws the eye, but it’s one-way.'],
   ['Ask Mira by name what they think of the report',1,'A direct question needs an answer back.'],
   ['Hand the mouse to Teo for the Do It',1,'The volunteer drives, and everyone watches closely.'],
   ['Invite questions in the chat window',1,'Chat lets a bigger group answer and ask without talking over each other.']],
   'Outbound tools keep people oriented; two-way tools bring reactions back to you. A good remote demo uses both.');}},

/* ---------- PART 3: PREPARE AND RUN ---------- */
{part:2,src:'Chapter 11 · Preparing Before the Demo',run(L){
  L.h(L.kick('learn','Before the demo')+'<h1 class="q">Most remote disasters can be caught the day before</h1>'+
   L.list([['shield','Test their network','Check the customer’s firewall and set-up with them, at least a day ahead.'],
     ['play','Learn the tool','Practice its pointers, highlighters, chat and sharing with a colleague, so you use them smoothly.'],
     ['eye','Match their screen','Set your screen resolution to the audience’s lowest. Otherwise they may see only the top-left corner.'],
     ['layers','Watch as they will','Keep a separate “audience” computer in your office to see what they really see.'],
     ['chat','Wear a headset','Speakerphones sound like a tunnel, and your voice drops when you turn your head.'],
     ['lock','Clean your desktop','And your recent-files list. Nobody should see where you sold last week.']],1)+
   '<p class="small" style="margin-top:10px">The book also suggests a dedicated computer just for remote demos, so it’s always ready.</p>');
  L.done();}},
{part:2,src:'Chapter 11 · Preparing Before the Demo',run(L){
  L.h(L.kick('ex','The day before')+'<h1 class="q">Wen’s test run finds three problems</h1>');
  L.beats(L.card,[
   ['Network','Wen and Ostrova’s IT person test the video call tool. Ostrova’s firewall blocks screen sharing; IT opens it that afternoon.'],
   ['Screen','On the audience laptop, Wen sees only the top-left of the Illustration: Ostrova’s meeting-room screen is smaller. Wen lowers the resolution.'],
   ['Desktop','Wen’s recent-files list shows “Fenmore reorder data.” Wen clears it, and closes the email window too.'],
   ['Sound','Wen swaps the laptop speaker for a headset.'],
   ['Ready','Wen tells Jordan, who is already in Ostrova’s building tomorrow: everything checked.']],
   'Each of these would have cost minutes, or trust, during the real call. A day’s notice turned them into small fixes.');}},
{part:2,src:'Chapter 11 · Preparing Before the Demo',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which preparation step would have prevented it?',['Test their network','Match their screen','Clean your desktop','Wear a headset'],[
   ['Halfway through a remote demo, Kai’s voice keeps fading whenever Kai turns to the second monitor.',3,'A headset keeps your voice steady, wherever you look.'],
   ['The customer asks, “Why does your file list say Northgate pricing?”',2,'Clear recent files and close other windows before you share.'],
   ['Ten minutes in, the customer still can’t see the shared screen at all.',0,'Firewalls and settings need testing with the customer at least a day ahead.'],
   ['The customer says, “We can only see the top-left corner of your report.”',1,'Set your resolution to the audience’s lowest, and check it on an audience machine.']]);}},
{part:2,src:'Chapter 11 · During the Demo',run(L){
  L.h(L.kick('learn','During the demo')+'<h1 class="q">Start with the end in mind, and keep them talking</h1>'+
   L.list([['star','Best screen first','Have your most compelling screen ready when sharing starts. Never leave a blinking login box up during the introduction.'],
     ['pointer','Mouse slow','There’s a lag. Smooth movement on your screen can look jerky on theirs, especially with heavy graphics.'],
     ['chat','Ask questions as you go','Even if a colleague is in their room. Don’t assume people are awake. A joke like “this will be on the test” helps.'],
     ['x','Don’t point at your screen','They can’t see your finger. The author has seen people do it.'],
     ['list','Summarize early and often','It checks people are still with you and invites questions. The Roadmap gives you natural places to do it.']],2));
  L.done();}},
{part:2,src:'Chapter 11 · During the Demo',pts:1,
 solve:async L=>{L.$('#va').click();L.$('#vb').click();},
 run(L){
  const V=[['Version A','Sharing starts on Pallaro’s login box. Wen talks through the introduction for four minutes, cursor blinking. Then Wen logs in, opens menus quickly, and says “here” while pointing at the laptop screen.','no'],
           ['Version B','Sharing starts on the Illustration: a pharmacy reorder report with red flags on expiring stock. Wen gives a short introduction, asks Mira what they notice, then moves the mouse slowly to the first flag.','ok']];
  const seen=new Set();
  L.h(L.kick('pr','Toggle and compare')+'<h1 class="q">The first minutes of Wen’s Ostrova call, two ways. Look at both.</h1>'+
   '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="chip" id="va">'+L.ic('x')+'Version A</button><button class="chip" id="vb">'+L.ic('check')+'Version B</button></div>'+
   '<div style="background:var(--soft);border-radius:16px;padding:14px;margin:10px 0 6px;min-height:120px" id="vv"><span class="small">Pick a version above.</span></div><div id="vq"></div>');
  const show=(j,b)=>{[L.$('#va'),L.$('#vb')].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(j);
    L.$('#vv').innerHTML='<b style="color:var(--'+V[j][2]+')">'+V[j][0]+'</b><p style="margin:6px 0 0">'+V[j][1]+'</p>';
    if(seen.size===2&&!L.$('#vq').innerHTML){const q=L.$('#vq');q.innerHTML='<h2 class="sub">How many of the book’s “during” mistakes are in Version A?</h2>';
      L.mc(q,['One: the login box','Two: login box and fast mouse','Three: login box, fast mouse, pointing'],2,
       'A blinking login box during the intro, fast mouse moves the audience sees as jerky, and pointing at a screen nobody can see.',
       'Look again: the login box, the quick menus (jerky on their end), and pointing at a laptop the audience can’t see. That’s three.');}};
  L.$('#va').onclick=function(){show(0,this);};L.$('#vb').onclick=function(){show(1,this);};}},
{part:2,src:'Chapter 11 · During the Demo',pts:1,run(L){
  L.h(L.kick('pr','What should Wen do?')+'<h1 class="q">Jordan texts from Ostrova’s room: “Two regional managers are on their phones.” Wen is midway through Do It. Best move?</h1>');
  L.mc(L.card,['Speed up, so the call ends sooner','Keep going, since Jordan is in the room','Pause, sum up, and ask a manager a question'],2,
   'A quick summary checks people are still with you, and a direct question pulls them back in. That’s what having Jordan on site is for: early warning.',
   'Speeding up loses more people, and having Jordan in the room doesn’t mean everyone is listening. The book says ask questions as you go and summarize early and often.');}},
{part:2,src:'Chapter 11 · During the Demo',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Tap each piece until it’s a strong summary for Wen to give after the Illustration.</h1>');
  L.sentence(L.card,[['So far we’ve covered quite a few things;','So that’s the reorder report:'],
     ['every item about to expire is flagged red,','it has lots of filters and settings,'],
     ['and that’s just one of forty screens.','and best-sellers are flagged before they run out.'],
     ['Let’s move on to the next part.','Mira, which flag matters most to you?']],[1,0,1,1],
   [['Vague. Name what they just saw.'],['That’s about features, not the problem it solves.'],['A screen count says nothing about value.'],['Moving on without a check loses people. End with a question to pull a reaction back.']],
   'Name the screen, say what it solves in their terms, then ask a question so the summary becomes two-way.');}},
{part:2,src:'Chapter 11 · Remote Demonstrations',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Mixed review: Wen’s next move',['Go in person','Split your forces','Ask, poll or hand over','Summarize'],[
   ['Fenmore’s final Technical Proof decides the whole deal. Kai suggests doing it by video to save the flight.',0,'For critical sales, the book recommends face to face.'],
   ['A remote demo to Ostrova’s whole board is booked, and Jordan has a free day to travel.',1,'Send Jordan to the room, keep the SE remote: attention, pace and reactions all improve.'],
   ['Twelve minutes into a call, nobody has said a word since the introduction.',2,'Silence on a remote call isn’t agreement. Pull a reaction: a question, a poll, or let the Champion drive.'],
   ['Wen just finished Do It and is about to start Do It Again.',3,'Summarize after each section; it checks people are with you and invites questions.'],
   ['A call for 30 people from several stores; Wen wants to know who sees spoilage as a big problem.',2,'For big groups, a poll gets everyone’s view at once and keeps them curious.']]);}}
  ]
});
</script>
</body>
</html>
