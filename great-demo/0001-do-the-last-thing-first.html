<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Do the last thing first</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0001', title:'Do the last thing first', minutes:18, icon:'play',
  goals:['Name the three big challenges every demo has to beat','Rebuild a feature tour so the best screen comes first','Use the newspaper idea to let each person choose how deep to go'],
  parts:['The setup','Last thing first','Like a newspaper','Who worries'],
  read:'Read the Introduction and chapter 1 of the book for the full newspaper exercise and the list of questions each role asks.',
  glossary:{
    qualification:'Qualification: finding out, before the demo, who the customer is, what they need and why, so you know what to show.',
    'feature-tour':'Feature tour: a demo that walks through the product screen by screen, showing everything it can do, with the best part near the end.'
  },
  cheatsheet:[
    'Every demo faces three challenges: <b>qualifying the customer</b>, <b>organizing the content</b>, and <b>infrastructure</b> (equipment and technical set-up).',
    '<b>Salesperson</b> owns the deal, the <b>SE</b> brings the technical skill, and the <b>Selling Team</b> is everyone on your side working on that one sale.',
    'The core idea: <b>do the last thing first</b>. Move the end of your demo to the very front.',
    'Step 1: the best screen or few screens, in <b>under 2 minutes</b>.',
    'Step 2: a smooth, quick walk through how you got there, in <b>under 4 minutes</b>, with little explanation.',
    'Step 3: the audience asks for detail and steers you. Usually <b>20–30 minutes</b> is enough.',
    'Build demos like a newspaper story: <b>headline</b>, short <b>summary</b>, then <b>detail</b> for those who want it.',
    'Every role worries about demos for its own reasons. A good demo answers all of them at once.'
  ],
  steps:[
/* ---------- PART 1: THE SETUP ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Kai’s demo of Pallaro Planner runs 90 minutes. The best report shows up at minute 50. Dana, Fenmore’s VP, must leave after 20 minutes. What does Dana see?</h1>');
  L.mc(L.card,['The best report, near the end of the demo','Mostly setup screens, never the best report'],1,
   'Dana leaves 30 minutes before the good part. This lesson is about fixing exactly that.',
   'The report comes at minute 50 and Dana is gone at minute 20. Dana only sees the warm-up. This lesson is about fixing exactly that.');}},
{part:0,src:'Introduction',run(L){
  L.h(L.kick('learn','The three big challenges')+'<h1 class="q">Every demo has to beat the same three problems</h1>'+
   L.prose('The book’s method is called <b>Great Demo!</b> (with the exclamation mark). It offers guidelines for three challenges that come up whenever you build and give a software demo:')+
   L.list([['people','Qualification and needs analysis',L.g('qualification','Qualifying')+' the customer: knowing who they are, what they need and why, before you show anything.'],
     ['layers','Organizing the content','Deciding what to show, in what order, and what to leave out.'],
     ['box','Infrastructure and technical issues','The computers, network, projector and software set-up that must simply work on the day.']],1)+
   '<p class="small" style="margin-top:10px">This lesson focuses on the second challenge. Later lessons cover the other two.</p>');
  L.done();}},
{part:0,src:'Introduction',run(L){
  L.h(L.kick('learn','Who’s who')+'<h1 class="q">Job titles differ between companies, so the book uses three plain names</h1><p class="small">Tap each card.</p>');
  L.flips(L.card,[
   ['Salesperson','Owns the deal. Other titles: sales rep, account manager, account representative. At Pallaro, that’s <b>Jordan Okafor</b>.'],
   ['SE (sales engineer)','The technical expert who helps complete the sale and gives the demo. Titles vary a lot: systems engineer, solution architect, technical evangelist, and more. At Pallaro: <b>Kai Lindqvist</b> and <b>Wen Zhao</b>.'],
   ['Selling Team','Everyone on your side needed to win one sale: the Salesperson and SE, and sometimes consultants, developers, product marketing, support, finance or senior managers.']],
   'The book uses these three names all the way through, and so does this course.');}},
{part:0,src:'Introduction',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">On the day of the Fenmore demo, Kai’s laptop can’t connect to the projector in Fenmore’s meeting room. Which challenge is this?</h1>');
  L.mc(L.card,['Qualifying the customer','Organizing the content','Infrastructure and technical issues'],2,
   'Projectors, cables and networks are infrastructure. They have nothing to do with what Kai planned to show, yet they can sink the demo.',
   'This is about equipment, not about what Fenmore needs or how Kai ordered the screens. That’s the infrastructure challenge.');}},
{part:0,src:'Introduction',pts:5,run(L){
  L.h(L.kick('pr','Name the role')+'<h1 class="q">Sort these Pallaro people into the book’s role names. Watch the job titles: they can mislead you.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Salesperson','SE','Other Selling Team'],[
   ['Jordan, the account manager who owns the Fenmore deal',0,'An account manager who owns a deal is a Salesperson, whatever the business card says.'],
   ['Kai, who builds and gives the Planner demo',1,'The technical expert giving the demo is the SE.'],
   ['Wen, whose title is “Solution Architect”',1,'Solution architect is one of many SE titles. What counts is the role, not the label.'],
   ['Malik, product marketing, joining one Fenmore call',2,'Product marketing staff can be part of the Selling Team without being the Salesperson or the SE.'],
   ['Pallaro’s finance lead, who approves a special discount',2,'Finance staff can also belong to the Selling Team for this sale.']],
   'Look at what each person does for this sale, not at their job title.');}},

/* ---------- PART 2: LAST THING FIRST ---------- */
{part:1,src:'Chapter 1 · The Answer',run(L){
  L.h(L.kick('learn','The whole book in one line')+'<h1 class="q">Take the end of your demo and move it to the very front</h1>'+
   L.quote('Do The Last Thing First.','Peter E. Cohan, chapter 1')+
   L.prose('Most demos build slowly toward a big finish. The book says to flip that: open with the finish. If you remember nothing else from the book, the author says, remember this.')+
   L.lanes([['clock','Feature tour','Setup screens → menus → options → … → <b>the best report, at the end</b>',4],
            ['star','Great Demo!','<b>The best report, first</b> → how you got there → the detail people ask for',2]])+
   L.prose('The author compares it to Stephen Covey’s advice to “begin with the end in mind.” It sounds obvious once you have tried it.'));
  L.done();}},
{part:1,src:'Chapter 1 · A Little More of the Answer',run(L){
  L.h(L.kick('learn','Three steps, with time limits')+'<h1 class="q">How a Great Demo! runs</h1>'+
   L.tiers([['star','1 · Show the best screen','The most compelling screen, or a handful of them, showing your solution at its strongest. You want the audience wondering how you did it.','Under 2 minutes',true,'Hook'],
     ['play','2 · Show how you got there','Walk through the path to that screen smoothly, quickly and confidently. Talk only enough to fill the time while the software works.','Under 4 minutes'],
     ['chat','3 · Let them ask for more','If you hit the target, the audience asks to see the steps in more detail. They steer you to the capabilities they need.','Usually no more than 20–30 minutes']])+
   '<p class="small" style="margin-top:10px">Notice what step 2 is <i>not</i>: it is not the place for detailed explanations. Those wait for step 3, and only if people ask.</p>');
  L.done();}},
{part:1,src:'Chapter 1 · A Little More of the Answer',run(L){
  L.h(L.kick('ex','Kai’s first Fenmore demo')+'<h1 class="q">How a feature tour lost the room</h1>');
  L.beats(L.card,[
   ['The plan','Kai loves Pallaro Planner and knows it inside out. The plan: a 90-minute tour of every screen, building up to the best part.'],
   ['Minutes 0–20','Data import, settings, store set-up, user roles. Dana, the VP of Operations, checks the clock.'],
   ['Minute 20','Dana has to leave for another meeting. Dana has not seen a single result yet.'],
   ['Minute 50','Kai finally shows the <b>Store reorder report</b>: suggested orders, with red flags on items about to spoil or run out. Only Sam and a few others are still watching.'],
   ['Afterwards','Sam, Fenmore’s replenishment manager, says: “I never saw what I needed.” Pallaro has to fly back for a second try.']],
   'The best screen was there all along. It was just in the wrong place.');}},
{part:1,src:'Chapter 1 · A Little More of the Answer',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Put Kai’s new Fenmore demo in Great Demo! order.</h1><div id="or"></div>');
  L.order(L.$('#or'),['Show the Store reorder report with its red flags','Click quickly through how that report was made','Go deeper on whatever Fenmore asks about'],
   'Best screen first, then the fast path to it, then detail on request.',['First','Then','Last']);}},
{part:1,src:'Chapter 1 · A Little More of the Answer',pts:1,
 solve:async L=>{L.$('#go').click();},
 run(L){
  const T=[['Feature tour',[[0,20,'Setup and settings','var(--line)'],[20,50,'Menus and options','var(--line)'],[50,90,'Store reorder report','var(--h2)']]],
           ['Great Demo!',[[0,2,'Report','var(--ok-strong)'],[2,6,'Path','var(--h2)'],[6,30,'Detail Fenmore asks for','var(--h3)']]]];
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Dana leaves at minute 20. Press play and see what Dana saw in each version.</h1>'+
   T.map((t,i)=>'<h2 class="sub">'+t[0]+'</h2><div style="position:relative;height:30px;background:var(--soft);border-radius:10px;overflow:hidden">'+
     t[1].map((s,j)=>'<div id="s'+i+'_'+j+'" style="position:absolute;top:0;bottom:0;left:'+(s[0]/90*100)+'%;width:'+((s[1]-s[0])/90*100)+'%;background:'+s[3]+';opacity:.25;border-right:2px solid var(--bg)"></div>').join('')+
     '<div id="cut'+i+'" style="position:absolute;top:0;bottom:0;left:'+(20/90*100)+'%;width:2px;background:var(--no);display:none"></div></div><div class="small res" id="r'+i+'" style="margin-top:4px"></div>').join('')+
   '<p class="small">Bars are drawn to scale: 90 minutes in total.</p><button class="btn pri" id="go" style="margin-top:8px">'+L.ic('play')+'Play the first 20 minutes</button><div id="dq"></div>');
  L.$('#go').onclick=function(){this.remove();let k=0;
    const t=setInterval(()=>{k++;T.forEach((tl,i)=>tl[1].forEach((s,j)=>{const el=L.$('#s'+i+'_'+j);if(el&&s[0]<k*4)el.style.opacity=1;}));
      if(k>=5){clearInterval(t);if(!L.$('#dq'))return;[0,1].forEach(i=>{L.$('#cut'+i).style.display='block';});
        L.$('#r0').innerHTML='<span style="color:var(--no)">Dana saw only setup screens. No result at all.</span>';
        L.$('#r1').innerHTML='<span style="color:var(--ok)">Dana saw the report, the path to it, and 14 minutes of detail.</span>';
        const q=L.$('#dq');q.innerHTML='<h2 class="sub">Which part of the new demo matters most for Dana?</h2>';
        L.mc(q,['The 2-minute report at the very start','The detailed walk-through at the end'],0,
         'Busy senior people may only stay a few minutes. Showing the best screen first means even they leave with the key result.',
         'Dana might leave early again. The detail is for people who stay; the opening report is what everyone, Dana included, gets to see.');}},350);};}},
{part:1,src:'Chapter 1 · A Little More of the Answer',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Tap each piece until the sentence describes a Great Demo! correctly.</h1><p class="small">It reads: open with [1] in [2], walk the path with [3], then show the detail [4].</p>');
  L.sentence(L.card,[['the setup screens','the best screen'],['under 2 minutes','about 20 minutes'],['a full explanation','little explanation'],['you choose','the audience asks for']],[1,0,1,1],
   [['Setup screens are the slow start of a tour. Open with the best screen.'],['Twenty minutes is far too long for the opening. The book’s limit is two.'],['Step 2 should be fast and smooth. Detailed explanation waits for step 3.'],['In step 3 the audience steers. You follow what they want to see.']],
   'Best screen in under 2 minutes, a quick path with little talk, then the detail the audience asks for.');
}},
{part:1,src:'Chapter 1 · A Little More of the Answer',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which step is Kai on?',['Step 1 · best screen','Step 2 · quick path','Step 3 · detail'],[
   ['Kai opens with the Store reorder report for one Fenmore store, red flags and all.',0,'The strongest screen, shown right away: step 1.'],
   ['Kai clicks from sales history to forecast to reorder list in about three minutes, saying little.',1,'Fast, smooth, little talk: that’s the path in step 2.'],
   ['Sam asks how the spoilage flags are worked out, and Kai shows the settings behind them.',2,'The audience asked for more depth, so this is step 3.'],
   ['Robin asks to see how a buyer would edit one suggested order, and Kai takes ten minutes on it.',2,'Robin is steering toward what Robin needs. That’s step 3.'],
   ['Within the first two minutes, Kai shows the chart of spoilage saved next to the report.',0,'Still the opening hook, within two minutes: step 1.']]);}},

/* ---------- PART 3: LIKE A NEWSPAPER ---------- */
{part:2,src:'Chapter 1 · Exercise (the newspaper)',run(L){
  L.h(L.kick('learn','How you read a newspaper')+'<h1 class="q">Nobody reads the whole paper, and nobody minds</h1>'+
   L.prose('Think about how you read a newspaper. You scan the headlines. Most stories you skip after the headline. Some you read for a paragraph or two. A few you read to the end, because you really care about the topic.')+
   L.prose('Readers don’t cancel because they didn’t read everything. They want a fast way to find the parts they care about. Each story is built to let them choose:')+
   L.flow([['star','Headline','Tells you the topic','read or move on?'],['list','First paragraphs','A short summary','enough for many readers'],['book','The rest','More depth and angles','for the truly interested']])+
   L.prose('The book says to build demos the same way.'));
  L.done();}},
{part:2,src:'Chapter 1 · Exercise (the newspaper)',run(L){
  L.h(L.kick('ex','The newspaper inside the Fenmore demo')+'<h1 class="q">Each part of the demo matches one part of the story</h1>');
  L.beats(L.card,[
   ['Headline','Kai opens with the Store reorder report. In two minutes everyone sees the topic: fewer spoiled items and fewer empty shelves. That “hooks” the room.'],
   ['Summary','Kai shows the key steps in a few quick clicks. Like the first paragraphs of a story, this is a summary, not every detail.'],
   ['Detail','Sam and Robin, who use this every week, ask for more. Kai digs into the capabilities they care about, like a reader finishing the article.'],
   ['Who reads what','Dana may stop after the headline and summary. Robin reads to the end. Both got what they came for.']],
   'One demo, three depths. Each person decides how far to read.');}},
{part:2,src:'Chapter 1 · Exercise (the newspaper)',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">In the newspaper picture, Kai’s quick three-minute click-through of the path to the report is like…</h1>');
  L.mc(L.card,['The headline','The first paragraphs','The rest of the story'],1,
   'The first paragraphs summarize the story. The quick path shows the key steps without the details.',
   'The headline is the opening report itself. The rest of the story is the deep detail. The quick path is the short summary in between: the first paragraphs.');}},
{part:2,src:'Chapter 1 · Exercise (the newspaper)',pts:5,run(L){
  L.h(L.kick('pr','Headline, summary or detail?')+'<h1 class="q">Wen is planning a Planner demo for another grocery chain. Sort each moment.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Headline','Summary','Detail'],[
   ['Open on the reorder report with its red flags',0,'The single most compelling screen goes first, like a headline.'],
   ['Click from sales data to forecast to report in 3 minutes',1,'A fast pass through the key steps is the summary.'],
   ['Explain how the forecast handles holidays, because a buyer asked',2,'Depth on request is the rest of the story.'],
   ['Show how orders reach suppliers, after the IT lead asks',2,'Again, extra depth for someone who wants it.'],
   ['Name the key steps once, in a few clicks, without the options',1,'Key steps, no options: that’s still the summary.']],
   'Headline first, summary next, detail only for those who ask.');}},
{part:2,src:'Chapter 1 · Exercise (the newspaper)',pts:1,run(L){
  L.h(L.kick('pr','A real decision')+'<h1 class="q">Wen worries: “If I only show the report and a quick path, people will think the product is thin.” What should Wen remember?</h1>');
  L.mc(L.card,['Show every feature up front, so nothing seems missing','Hook them first; people who want depth will ask for it','Skip the quick path and go straight into the detail'],1,
   'Like newspaper readers, interested people keep reading. If the opening hooks them, they will ask for the depth themselves.',
   'Showing everything is the feature tour that lost Dana. Skipping the quick path loses those who only want a summary. Hook first, and let the interested ask for more.');}},

/* ---------- PART 4: WHO WORRIES ---------- */
{part:3,src:'Chapter 1 · What Is The Most Important Problem You Face Today?',run(L){
  L.h(L.kick('learn','Everyone worries about demos')+'<h1 class="q">Each role asks its own questions</h1><p class="small">Tap each card to see the kind of worry the book lists for that role.</p>');
  L.flips(L.card,[
   ['SE','How many demos before we win? Am I showing the right things? Why do people fidget, or leave before I finish?'],
   ['Salesperson','Why does the technical sale take so long? Why are our demos boring? Why am I missing my target for sales (quota)?'],
   ['Sales manager','How do we make our numbers, and grow 20% with the same people? Why do we build so many custom demos?'],
   ['Product or marketing manager','How do I get the sales team to sell my product? What tools would help them most?'],
   ['Trainers, developers, executives','Trainers: how to give an overview before the detail. Developers: how to show what they built. Executives: how to build a strong, predictable sales engine.']],
   'Different worries, one shared answer in the book: demos that succeed.');}},
{part:3,src:'Chapter 1 · What Is The Most Important Problem You Face Today?',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Jordan asks: “Why does it take so long to close the technical sale with Fenmore?” This is typically whose worry?</h1>');
  L.mc(L.card,['The SE’s','The Salesperson’s','The developer’s'],1,
   'It’s on the book’s list for the sales rep: the person waiting for the technical sale to finish so the deal can close.',
   'Jordan owns the deal, and this question sits on the book’s list for the Salesperson. The SE worries more about what to show and how many demos it takes.');}},
{part:3,src:'Chapter 1 · What Is The Most Important Problem You Face Today?',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Whose worry is it?',['SE','Salesperson','Manager or executive','Product marketing'],[
   ['Kai: “Do people leave before I’m through?”',0,'Watching people walk out is the SE’s worry.'],
   ['Pallaro’s sales director: “How do we grow 20% with the same team?”',2,'Doing more with the same people is a manager’s question.'],
   ['Malik: “How do I get the field to sell my new release?”',3,'Wanting the field to push “my” product is a product marketing worry.'],
   ['Jordan: “If Kai blows this one, we won’t get another chance.”',1,'Fear of losing the only shot at a deal is the Salesperson’s.']]);}},
{part:3,src:'Chapter 1 · What Is The Most Important Problem You Face Today?',run(L){
  L.h(L.kick('learn','Why it matters')+'<h1 class="q">A demo is where all these worries meet</h1>'+
   L.prose('The book ends the chapter with an exercise: write down your goals for this quarter and this year from memory, then compare them with where you are. Are you in pain? Or in denial?')+
   L.flow([['check','Demo goes well','Sales, revenue, growth, repeat business','',2],['x','Demo fails','A failed demo can feel like the end of the world','',4]],false)+
   L.note('For Pallaro: Jordan’s quota, Kai’s workload, Malik’s release and the sales director’s growth target all ride on how the next Fenmore demo goes.','target'));
  L.done();}},
{part:3,src:'Chapter 1 · A Little More of the Answer',pts:1,run(L){
  L.h(L.kick('pr','Put it together')+'<h1 class="q">Fenmore gives Pallaro a second meeting: 30 minutes, and Dana can stay for 10. Which plan should Kai bring?</h1>');
  L.mc(L.card,['Start with setup so the report makes sense, then show it near minute 25','Open with the reorder report, then the quick path, then Sam and Robin’s questions','Show only the reorder report for all 30 minutes, then stop'],1,
   'Dana sees the report and the path inside 6 minutes. The remaining time goes to the detail Sam and Robin ask for.',
   'Showing the report at minute 25 repeats the first mistake: Dana is gone by then. Showing only the report skips the path and the detail people need. Best screen, quick path, then their questions.');}}
  ]
});
</script>
</body>
</html>
