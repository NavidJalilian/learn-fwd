<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Great Demo! strategy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0004', title:'The Great Demo! strategy', minutes:19, icon:'play',
  goals:['Lay out the Great Demo! pathway and say what each step is for','Explain why showing extra features can shrink a sale','Open any demo with the two questions that protect it'],
  parts:['The pathway','What, then how','Only what they need','Start and prepare'],
  read:'Read chapters 5 and 6 of the book for the car-dealership exercises and the full 50-seat story.',
  glossary:{
    'power-user':'Power user: someone who uses the software heavily and knows it in depth.',
    'hope-curiosity':'Hope and curiosity: what an audience feels on seeing the solution first: hope it could work for them, and curiosity about how. Michael Bosworth’s phrase.'
  },
  cheatsheet:[
    'The pathway: <b>Illustration → Do It → Do It Again</b> (a short summary after each), then <b>Q&amp;A</b>, then a final <b>Summary</b>.',
    'Two essentials: show the <b>end first</b>, and show <b>only the Specific Capabilities</b> the customer needs.',
    'Story-style demos fail two ways: “they never showed what I needed” and “it took forever and I lost track.”',
    'Show the <b>what</b> fast, then the <b>how</b>. Seeing the Solution first creates <b>hope and curiosity</b>, and the audience starts pulling.',
    'Extra features add risk: bugs, boredom, unwanted features, running out of time, confusion, looking complex, looking expensive.',
    'The 50-seat story: a 10-minute demo stretched to 2 hours turned a $250,000 a year order into one seat.',
    'Open every demo by asking: <b>what do you want from this meeting</b>, and <b>how much time do you have</b>? Ask even if you think you know.',
    'Preparation is shared: the <b>Sales</b> role gathers and passes on CBIs; the <b>Technical</b> role builds and gives the demo.'
  ],
  steps:[
/* ---------- PART 1: THE PATHWAY ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">You queue for 40 minutes at a passport office, then learn you’re in the wrong line. What would have saved you?</h1>');
  L.mc(L.card,['A clear sign at the front saying what the line is for','A faster clerk working at the end of the line'],0,
   'Knowing the destination up front lets you decide at once whether to stay. The book uses this feeling to explain why demos should show the end first.',
   'A faster clerk only gets you to the wrong window sooner. You needed to know where the line ends before you joined it. Demos work the same way.');}},
{part:0,src:'Chapter 5 · The Great Demo! Strategy',run(L){
  L.h(L.kick('learn','The pathway')+'<h1 class="q">Five steps, with a short summary after each of the first three</h1>'+
   L.tiers([['star','1 · Illustration','Show the result: the best screen or report. Then summarize.',''],
     ['play','2 · Do It','The quickest path to that result. Then summarize.',''],
     ['cycle','3 · Do It Again','The same path, slower, with explanation. Then summarize.',''],
     ['chat','4 · Questions & Answers','Take the audience’s questions.',''],
     ['check','5 · Summary','Close by summing up what they saw.','']])+
   L.prose('Two things make it work: show the <b>end of the demo at the very beginning</b>, and show <b>only the Specific Capabilities</b> needed to fix the customer’s problem.'));
  L.done();}},
{part:0,src:'Chapter 5 · The Great Demo! Strategy',run(L){
  L.h(L.kick('learn','Why turn the demo upside down?')+'<h1 class="q">The usual story makes the customer wait for the payoff</h1>'+
   L.prose('Most of us were taught to tell a story and reach the big payoff screen at the end. The book asks: why make the customer wait? Why make them follow your story for 20, 40, 60 minutes, only to find the ending isn’t what they had in mind?')+
   L.prose('The book names the two thoughts behind most failed demos:')+
   L.lanes([['eye','“They never showed what I really needed to see.”','The demo missed the capabilities that matter to this person.',4],
            ['clock','“It took forever and I lost track.”','The point got lost in a long build-up.',3]])+
   '<p class="small" style="margin-top:10px">Both are deadly for the sale, and both are expensive.</p>');
  L.done();}},
{part:0,src:'Chapter 5 · The Great Demo! Strategy',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">After Kai’s old demo, Lee from Fenmore IT said: “Ninety minutes, and I couldn’t tell you what the main point was.” Which deadly thought is that?</h1>');
  L.mc(L.card,['“They never showed what I needed.”','“It took forever and I lost track.”'],1,
   'Lee isn’t saying something was missing. Lee is saying the point drowned in a long demo.',
   'Lee doesn’t complain about a missing capability. The complaint is length: the point got lost along the way.');}},
{part:0,src:'Chapter 5 · The Great Demo! Strategy',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Where in the pathway is Kai?',['Illustration','Do It','Do It Again','Q&A','Summary'],[
   ['Kai walks through the same steps slowly, explaining the forecast settings.',2,'A second, slower pass along the same path is Do It Again.'],
   ['Two minutes in, Kai puts up the Store reorder report with its red flags.',0,'The result, shown right at the start: the Illustration.'],
   ['Kai clicks from sales history to the finished report in a few quick steps.',1,'The fastest route to the result, with few words: Do It.'],
   ['At the end, Kai recaps the three capabilities shown and the time saved.',4,'The final wrap-up of what the audience saw is the Summary.'],
   ['Robin asks whether last-minute promotions change the forecast.',3,'Taking the audience’s questions is the Q&A step.']]);}},

/* ---------- PART 2: WHAT, THEN HOW ---------- */
{part:1,src:'Chapter 5 · Give ‘Em What They Need…',run(L){
  L.h(L.kick('learn','Give them what they need')+'<h1 class="q">Show the Solution first, and the audience starts to chase you</h1>'+
   L.prose('When people see right away the Solution they need, they get interested fast. The book uses Michael Bosworth’s phrase for this: generating '+L.g('hope-curiosity','hope and curiosity')+'.')+
   L.flow([['star','Hope','“This might actually work for us.”','',2],['bulb','Curiosity','“How do they do that?”','',3],['pointer','Pull','The audience drives the demo forward','',1]])+
   L.prose('So plan to show the Solution twice: first a very quick look at <b>what</b> it is, then a fuller look at <b>how</b> it works.'));
  L.done();}},
{part:1,src:'Chapter 5 · Give ‘Em What They Need…',run(L){
  L.h(L.kick('ex','The book’s car-shopping exercise')+'<h1 class="q">How do you shop for a new car?</h1>');
  L.beats(L.card,[
   ['First','You walk the lot. You look at the cars and what each one comes with. This is the <b>what</b>.'],
   ['Then','You find one you like. Now you want to know how the controls work, in more detail. This is the <b>how</b>.'],
   ['The bad dealer','Picture a salesperson who grabs you on arrival, rushes you into a car you never got to look at, and heads out on a test drive.'],
   ['Your reaction','You feel your time is being wasted. You don’t yet know if you even want this car.'],
   ['The link','A demo that starts with “first, log in, then open settings…” is that test drive. The customer hasn’t seen the what yet.']],
   'Great Demos show the what right away, and follow with the how.');}},
{part:1,src:'Chapter 5 · Give ‘Em What They Need…',pts:1,
 solve:async L=>{L.$('#ta').click();L.$('#tb').click();},
 run(L){
  const seen=new Set();
  const V=[['Old order, minute 5','Kai is on the log-in screen, then store set-up.',['Dana checks the time','Robin opens email','Sam waits politely']],
           ['Great Demo! order, minute 5','The Store reorder report is on screen, red flags and all.',['Sam: “Does it flag lettuce too?”','Robin: “How did it build that?”','Dana: “For all 40 stores?”']]];
  L.h(L.kick('pr','Toggle and compare')+'<h1 class="q">Same Fenmore meeting, same five minutes. Look at both versions.</h1>'+
   '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="chip" id="ta">'+L.ic('clock')+'Old order</button><button class="chip" id="tb">'+L.ic('star')+'Great Demo! order</button></div>'+
   '<div style="background:var(--soft);border-radius:16px;padding:14px;margin:10px 0;min-height:120px" id="vw"><div class="small">Pick a version above.</div></div><div id="vq"></div>');
  const show=j=>{[L.$('#ta'),L.$('#tb')].forEach((b,x)=>b.classList.toggle('sel',x===j));seen.add(j);
    L.$('#vw').innerHTML='<div class="small"><b>'+V[j][0]+'</b></div><p class="small">'+V[j][1]+'</p>'+V[j][2].map(x=>'<span class="chip static'+(j?' ok':'')+'" style="margin:3px">'+L.ic(j?'chat':'clock')+x+'</span>').join('');
    if(seen.size===2&&!L.$('#vq').innerHTML){const q=L.$('#vq');q.innerHTML='<h2 class="sub">What did showing the report first create?</h2>';
      L.mc(q,['Hope and curiosity, so they start asking','A sense that the demo is nearly over'],0,
       'They saw a Solution they want, so now they want the how. The audience starts pulling the demo forward.',
       'Nobody is packing up. Seeing the Solution gave them hope and made them curious how it works, so they start asking.');}};
  L.$('#ta').onclick=()=>show(0);L.$('#tb').onclick=()=>show(1);}},
{part:1,src:'Chapter 5 · Give ‘Em What They Need…',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Which belongs in the quick first look at the <i>what</i>?</h1>');
  L.mc(L.card,['How to set the forecast’s safety stock','The finished report with its red flags','Where the supplier settings are stored'],1,
   'The finished result is the what. Settings and set-up are part of the how, which comes later.',
   'Settings and where things are stored explain how it works. The what is the finished result: the flagged report.');}},
{part:1,src:'Chapter 5 · Give ‘Em What They Need…',pts:5,run(L){
  L.h(L.kick('pr','What or how?')+'<h1 class="q">Wen is planning a Planner demo. Sort each moment.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['The what','The how'],[
   ['A chart of spoilage saved at one store last month',0,'A result the customer can see at a glance: the what.'],
   ['Which sales history feeds the forecast',1,'This explains how the result is produced.'],
   ['The weekly reorder list, ready to approve',0,'The finished output is the what.'],
   ['Changing how far ahead the forecast looks',1,'An option along the path: part of the how.'],
   ['The clicks that send approved orders to a supplier',1,'Steps through the software are the how.']],
   'Show the results first, quickly. The steps and options come after, once the audience wants them.');}},

/* ---------- PART 3: ONLY WHAT THEY NEED ---------- */
{part:2,src:'Chapter 5 · …And Only What They Need',run(L){
  L.h(L.kick('learn','…and only what they need')+'<h1 class="q">Every extra feature adds risk</h1>'+
   L.prose('Showing more might spark extra interest. But the book lists what each extra capability puts at risk:')+
   L.list([['alert','Bugs and crashes','More screens, more chances for something to break.'],
     ['clock','Boredom, and running out of time','The audience drifts, or time runs out before they see what they need.'],
     ['x','Unwanted capabilities','You show things they never asked for, and confuse them with too many functions.'],
     ['layers','Looking too complicated','A product with “everything” looks hard to use.'],
     ['scale','Looking too expensive','“Why am I paying for all these features I won’t use?”']],4)+
   '<p class="small" style="margin-top:10px">The book’s car exercise: walk into a dealer acting as if you don’t know what you want. You’ll be shown the “popular” models, not the features on your own list.</p>');
  L.done();}},
{part:2,src:'Chapter 5 · …And Only What They Need',run(L){
  L.h(L.kick('ex','A true story from the book, retold')+'<h1 class="q">The demo that shrank an order from 50 seats to 1</h1>');
  L.beats(L.card,[
   ['The setup','A customer is fully qualified and ready to buy 50 seats at about $5,000 each per year: a <b>$250,000 a year</b> order. One simple demo of the agreed capabilities is the last step.'],
   ['The room','The buyer and about a dozen future users.'],
   ['The choice','The SE decides they’d enjoy seeing the product’s full range, and turns a 10-minute demo into a <b>2-hour</b> teaching session.'],
   ['The verdict','The buyer confers with the team: the software looks far more complicated than expected.'],
   ['The order','They buy <b>one</b> seat for a '+L.g('power-user','power user')+', who will run the work for the other 49.'],
   ['The cost','The demo cut the sale by <b>$245,000 a year</b>.']],
   'The what and the how should both cover the Specific Capabilities the customer needs. No more, no less.');}},
{part:2,src:'Chapter 5 · …And Only What They Need',pts:1,
 solve:async L=>{[...L.$('#ex').children].forEach(b=>b.click());},
 run(L){
  const F=['Store-layout designer','Staff scheduling','Loyalty-card analysis','Custom dashboard themes'];const M=[['Demo length',[30,48,64,80,95]],['Looks complicated',[20,38,56,74,92]],['Looks expensive',[15,32,50,68,88]],['Chance of a bug',[15,30,45,60,75]]];let n=0;const on=new Set();
  L.h(L.kick('pr','See it happen')+'<h1 class="q">Malik wants four new features added to Kai’s Fenmore demo. None fixes a Fenmore Reason. Add them and watch.</h1>'+
   '<div id="ex" style="display:flex;flex-wrap:wrap;gap:6px"></div>'+
   M.map((m,j)=>'<div class="meterrow"><div class="lb">'+m[0]+'</div><div class="meter"><div id="m'+j+'" style="background:'+(j?'var(--no)':'var(--h3)')+';width:'+m[1][0]+'%"></div></div></div>').join('')+'<div id="eq"></div>');
  F.forEach((f,j)=>{const b=document.createElement('button');b.className='chip';b.innerHTML=L.ic('box')+f;
    b.onclick=()=>{if(on.has(j))return;on.add(j);n++;b.classList.add('sel');M.forEach((m,k)=>{const el=L.$('#m'+k);if(el)el.style.width=m[1][n]+'%';});
      if(n===4){const q=L.$('#eq');q.innerHTML='<h2 class="sub">Malik says: “More features make Planner look richer.” What’s the best reply?</h2>';
        L.mc(q,['True, so show them after the Q&amp;A','Richer can look complex and costly; leave them out','True, but keep each one under a minute'],1,
         'Like the 50-seat story, extras make the product look harder and pricier, and add risk. Show only the Specific Capabilities Fenmore needs.',
         'Shorter or later, they still add length, confusion and price worries with no Fenmore Reason behind them. Leave them out.');}};L.$('#ex').appendChild(b);});}},
{part:2,src:'Chapter 5 · …And Only What They Need',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">During a long demo, Dana asks: “Why would we pay for all these extras we’ll never use?” Which risk just came true?</h1>');
  L.mc(L.card,['Looking too expensive','Running into a bug','Running out of time'],0,
   'Every feature that isn’t needed makes the price feel bigger for what the customer will actually use.',
   'Nothing broke and time isn’t the complaint. Dana is asking about price for unused features: the product now looks too expensive.');}},
{part:2,src:'Chapter 5 · …And Only What They Need',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which risk is this?',['Bug or crash','Out of time','Too complicated','Unwanted feature'],[
   ['Kai opens the rarely used import wizard to show it off, and it freezes.',0,'More screens shown, more places for something to break.'],
   ['Dana leaves for a board call before the reorder report ever appears.',1,'Extras ate the time the key person needed.'],
   ['Robin says: “I’d need a training course just to find the reorder screen.”',2,'Showing too many functions made Planner look hard to use.'],
   ['Kai spends ten minutes on loyalty-card analysis; nobody at Fenmore asked.',3,'A capability nobody needs, taking time from the ones they do.']]);}},

/* ---------- PART 4: START AND PREPARE ---------- */
{part:3,src:'Chapter 5 · Starting The Demo',run(L){
  L.h(L.kick('learn','Starting the demo')+'<h1 class="q">Open every demo with two questions</h1>'+
   L.list([['target','What do you want to get out of this meeting?','Their objectives for today.'],
     ['clock','How much time do you have?','Their time limits, person by person.']],1)+
   L.prose('Ask even if you already know. It shows you mean to spend the time on what they want, and things may have changed since you last spoke. Confirming the time is simply professional.')+
   L.note('The book’s example: you learn the key person can stay only 20 minutes. Prove your capabilities to them in those 20 minutes, or the whole effort may be wasted. The most important people are always in demand and short on time.','alert'));
  L.done();}},
{part:3,src:'Chapter 5 · Starting The Demo',run(L){
  L.h(L.kick('ex','The new Fenmore demo begins')+'<h1 class="q">Kai asks the two questions, and the plan changes</h1>');
  L.beats(L.card,[
   ['Kai asks','“Before we start: what would you like to get out of today, and how much time does everyone have?”'],
   ['Dana','“I need to see if this cuts waste across the chain. I have to leave at twenty past.”'],
   ['Sam','“Same goal. And since we last spoke, supplier ordering has become a big headache.”'],
   ['Kai adjusts','The Illustration and Do It happen in Dana’s first 20 minutes. Kai notes to give supplier ordering more time in Do It Again.'],
   ['Why it worked','Without asking, Kai would have held the best part for a slot Dana would miss, and underplayed Sam’s new worry.']],
   'Two short questions at the start protect the whole meeting.');}},
{part:3,src:'Chapter 5 · Starting The Demo',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Jordan says: “We agreed the agenda last week. Don’t waste time asking Fenmore their objectives again.” What should Kai say?</h1>');
  L.mc(L.card,['Agreed; asking again could look unprepared','Fine, but ask only Dana, since Dana decides','It takes a minute, shows respect, and things change'],2,
   'Asking again shows real interest in Fenmore’s goals, and catches anything that changed, like Dana’s new time limit.',
   'The book says to ask every time, everyone in the room. It shows interest, and needs or time limits may have changed since last week.');}},
{part:3,src:'Chapter 6 · Preparation',run(L){
  L.h(L.kick('learn','Preparation')+'<h1 class="q">The key: find the Specific Capabilities, then map your software to them</h1>'+
   L.quote('Perspiration is inversely proportional to preparation.','Peter E. Cohan, chapter 6')+
   L.prose('Preparation covers the customer’s needs and the equipment: Who gets the hardware ready? Is the software up to date and working? What projector, screens and network do you need?')+
   L.lanes([['people','The “Sales” role','Anyone who gathers CBIs, Reasons and Specific Capabilities from the customer and passes them on.',1],
            ['pointer','The “Technical” role','Anyone who creates the demo and presents it to the customer.',2]])+
   L.prose('One person can play both. A Salesperson strong with senior buyers may leave the detailed questions to the SE, so both play a Sales role. At a young company, the Salesperson may do it all.'));
  L.done();}},
{part:3,src:'Chapter 6 · Preparation',pts:5,run(L){
  L.h(L.kick('pr','Which role is this?')+'<h1 class="q">Sort each piece of work on the Fenmore deal by role, not by job title.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Sales role','Technical role'],[
   ['Jordan asks Dana about the year’s margin goal',0,'Gathering CBIs from the customer is the Sales role.'],
   ['Kai sits with Robin to learn how each reorder list is built',0,'Kai is an SE, but gathering detailed Reasons is Sales-role work.'],
   ['Kai builds the Fenmore Illustration in Planner',1,'Creating the demo is the Technical role.'],
   ['Jordan sends Kai the CBIs and Reasons a week early',0,'Passing customer needs into Pallaro is part of the Sales role.'],
   ['Kai presents the demo in Fenmore’s meeting room',1,'Presenting is the Technical role.']],
   'Roles are about the work, not the title. That’s why the book wants both sides to read both preparation chapters.');}},
{part:3,src:'Chapter 6 · Preparation',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Tap each piece until the sentence sums up the Great Demo! strategy.</h1>');
  L.sentence(L.card,[['Show the end first','Build up to the end'],['show only the needed Specific Capabilities','show the full range of features'],['ask their objectives and time limits','ask them to hold questions']],[0,0,0],
   [['Building up makes them wait, and risks “it took forever and I lost track.”'],['The full range made a 50-seat order shrink to one seat.'],['Holding questions isn’t the opening move. Start by checking what they want and how long they have.']],
   'End first, only what they need, and open by asking what they want and how long they have.');}},
{part:3,src:'Chapter 6 · Preparation',pts:1,run(L){
  L.h(L.kick('pr','Put it together')+'<h1 class="q">Wen joins Pallaro’s tiny new office in another country. The only Salesperson there qualifies customers and gives every demo alone. What does that mean?</h1>');
  L.mc(L.card,['They skip the Sales role, since nobody is an SE','They play both roles, so must prepare for both','They play only the Technical role during demos'],1,
   'The book notes this at young companies: one person qualifies and demos. All the preparation still has to happen; it just falls on one person.',
   'No role disappears. Someone still has to gather the CBIs and someone has to build and give the demo. Here, it’s the same person.');}}
  ]
});
</script>
</body>
</html>
