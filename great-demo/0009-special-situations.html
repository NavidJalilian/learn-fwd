<script>
Course.lesson({
  id:'0009', title:'Special situations', minutes:20, icon:'compass',
  goals:['Give a 15-second Elevator Demo and build a Generic Demo from “why did they buy?”','Run a trade-show booth with open questions, the Menu Approach and clean Handoffs','Handle big unqualified groups, recorded, scripted and roll-out demos without losing the method'],
  parts:['Pitch and generic','Trade shows','Big groups','Other demos'],
  read:'Read chapter 10 of the book for the full classroom To Do List story and the list of recorded-demo formats.',
  glossary:{
    'elevator-demo':'Elevator Demo: one crisp sentence on what your company does, plus your best Illustrations on paper, for a chance meeting that lasts seconds.',
    'generic-demo':'Generic Demo: a demo for an audience you could not qualify, built around the capabilities past customers actually bought your product for.',
    'reference-story':'Reference Story: a Situation Slide built from a similar customer’s success (same job title, details removed), used when you don’t yet know this customer’s situation.',
    'menu-approach':'Menu Approach: showing one Situation Slide and Illustration at a time, asking “is this what you need?”, and moving to the next one if not (3–5 at most).',
    'handoff':'Handoff: when a booth colleague passes a visitor to the person at the demo station, together with what they have learned about that visitor.',
    'to-do-list':'To Do List: a whiteboard list of what each person in a big audience wants to see, tallied, marked and ticked off as you demo it.',
    'canned-demo':'Canned Demo: a demo prepared in advance, usually recorded, for times when nobody can give a live demo.',
    'shelfware':'Shelfware: software a customer paid for but never rolled out or uses.'
  },
  cheatsheet:[
    '<b>Elevator Demo:</b> one sentence on the problem you solve. Test it: “Would I want to learn more?” Always carry your best Illustrations on paper.',
    '<b>Generic Demo:</b> ask questions first. If you can’t qualify, show why past customers <i>did</i> buy (a “why did they buy?” session), with customer data cleaned out.',
    '<b>Vision Generation</b> is a kind of Generic Demo for a customer who can’t yet see their problem: shorter, more focused, smaller audience.',
    '<b>Trade shows:</b> hold the mouse still and ask open questions. If they won’t talk, use the <b>Menu Approach</b>: 3–5 Situation Slides + Illustrations, about 2 minutes each.',
    '<b>Handoff:</b> introduce both people, the visitor’s job and interests, their CBIs and Reasons, and any limits like time.',
    '<b>Big unqualified group:</b> build a <b>To Do List</b> from everyone’s wishes, mark what you have and will show, agree the plan, show all Illustrations first, tick each off, then summarize it all.',
    '<b>Roll-outs and Canned Demos:</b> frame new things as business problems solved; recordings show Illustration then Do It, summarize constantly, end with a call to action.',
    '<b>Scripted demos:</b> respect the script, but use the Introduction time for Illustrations. <b>Deployment:</b> pass the CBIs to the trainers and start training with the value.'
  ],
  steps:[
/* ---------- PART 1: PITCH AND GENERIC ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">At a wedding, a guest asks Kai: “So what does Pallaro do?” Which answer makes the guest want to hear more?</h1>');
  L.mc(L.card,['“We make software for demand planning and forecasting.”','“We help grocers stop throwing away food and running out.”'],1,
   'It names a problem people recognize. This lesson starts with that kind of answer, then takes the Great Demo! method into messier situations.',
   'Category words like “demand planning” describe the software, not the problem it solves. The second answer names a pain the guest can picture.');}},
{part:0,src:'Chapter 10 · The “Elevator” Demo',run(L){
  L.h(L.kick('learn','The Elevator Demo')+'<h1 class="q">You may have fifteen seconds before the doors open</h1>'+
   L.prose('The method so far fits well-qualified Technical Proof demos. Real life brings other situations, maybe more often than “normal” demos. The same principles still steer them. The shortest is the '+L.g('elevator-demo','Elevator Demo')+'.')+
   L.list([['chat','One sentence','Your most important, most-used capabilities, said as the problem they solve for customers.'],
     ['eye','Test it','Read it back and ask: “Would I want to learn more?” If not, rewrite it until you would.'],
     ['book','Carry your best Illustrations','When they ask for a card, hand over printed copies of your best Illustrations too.'],
     ['people','Loop in the Salesperson','If they follow up, make sure your Salesperson is in the loop fast.']],1)+
   L.note('The book’s weak example: “software and services to the pharmaceutical industry.” Its stronger one says it helps drug firms get more successful drug candidates by giving scientists the information for better, faster decisions.','book'));
  L.done();}},
{part:0,src:'Chapter 10 · The “Elevator” Demo',run(L){
  L.h(L.kick('ex','At a retail-tech conference')+'<h1 class="q">Jordan gets the lift ride of the year</h1>');
  L.beats(L.card,[
   ['The lift','Jordan steps in beside Priya Nair, VP of Supply Chain at Brightwell Grocers. Jordan has worked on Brightwell for a year and never met Priya.'],
   ['The question','Priya glances at Jordan’s badge: “Pallaro… what do you do?”'],
   ['The draft','Jordan’s first thought: “We make demand-planning software for retailers.” It fails the “would I want to learn more?” test.'],
   ['What Jordan says','“We help grocery chains stop throwing away fresh food and stop running out of best-sellers, by building each store’s weekly order for them.”'],
   ['The card','Priya: “Really? Got a card?” Jordan hands over a card and a printed Store reorder report filled with made-up demo data, red flags and all.'],
   ['Next day','Priya’s assistant emails to ask how that report was made. Jordan books a meeting and calls Kai.']],
   'One sentence earned the card. The printed Illustration earned the follow-up.');}},
{part:0,src:'Chapter 10 · The “Elevator” Demo',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Wen drafts an elevator line. Which one passes the “would I want to learn more?” test?</h1>');
  L.mc(L.card,['“Pallaro offers advanced forecasting and analytics tools.”','“We’re a fast-growing software firm founded ten years ago.”','“We help store chains order what will sell, not what will rot.”'],2,
   'It names the customer’s problem and hints at the result. A busy VP can picture it in one breath.',
   'Feature words and company history don’t make anyone want more. The winning line names the problem the customer feels: food that rots and orders that miss.');}},
{part:0,src:'Chapter 10 · Generic Demos',run(L){
  L.h(L.kick('learn','Generic Demos')+'<h1 class="q">When you can’t qualify, show why others bought</h1>'+
   L.prose('Trade shows, webinars, analysts, third parties and on-the-fly events all bring unqualified audiences. You don’t know their CBIs, Reasons or Specific Capabilities, or how the people in the room relate to each other.')+
   L.flow([['chat','Ask first','Even basic answers raise your odds','',1],['star','Learned enough?','Turn it into a Great Demo!','',2],['layers','If not','Give a '+(L.g('generic-demo','Generic Demo'))+'','',3]])+
   L.prose('The best Generic Demo shows the capabilities that were the <b>reason past customers bought</b>. To find them, the book suggests a <b>“why did they buy?”</b> session: Salespeople list their last 3–5 wins, each with its CBI, Reasons and Specific Capabilities, then group what’s similar and gather the Illustrations that won each deal.'));
  L.done();}},
{part:0,src:'Chapter 10 · Generic Demos',run(L){
  L.h(L.kick('ex','Wen’s whiteboard session')+'<h1 class="q">Wen builds Pallaro’s Generic Demos from real wins</h1>');
  L.beats(L.card,[
   ['Who','Wen books an hour, a whiteboard, Jordan and two other Salespeople.'],
   ['Five wins','They list five recent sales, including Juniper Delis, Larchmont Garden Centres and Halden Hardware. For each: the CBI, the Reasons, the Specific Capabilities.'],
   ['Clusters','Two tight groups appear: <b>fresh stock thrown away</b> (delis, garden centres) and <b>best-sellers running out</b> (hardware and two others).'],
   ['Illustrations','Wen tracks down the Illustration used to win each deal and sorts them into the two groups.'],
   ['Result','Two Generic Demos, each opening with a '+L.g('reference-story','Reference Story')+' and a proven Illustration.']],
   'Marketing often asks “why <i>should</i> they buy?” This session asks why they <i>did</i>.');}},
{part:0,src:'Chapter 10 · Generic Demos',pts:1,
 solve:async L=>{L.$('#ga').click();L.$('#gb').click();},
 run(L){
  const S=[['Execute research','General research only: “why did they buy?” and Marketing’s material','chg'],
   ['Coordinate infrastructure with the customer','There’s no customer to set up with','cut'],
   ['Create your Outline','','keep'],['Create your Summary and Introduction','','keep'],
   ['Create your Illustration','Reuse past ones, but replace any real customer data with generic data','chg'],
   ['Develop the first pass (Do It)','','keep'],['Develop the second pass (Do It Again)','','keep'],['Practice','','keep'],
   ['Present to the Selling Team','Better: to a group of Salespeople and SEs','chg'],['Adjust and refine','','keep'],
   ['Confirm infrastructure with the customer','There’s no customer to confirm with','cut']];
  const seen=new Set();
  L.h(L.kick('pr','Toggle and compare')+'<h1 class="q">The eleven steps of a Great Demo! change for a Generic Demo. Look at both.</h1>'+
   '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="chip" id="ga">'+L.ic('star')+'Great Demo!</button><button class="chip" id="gb">'+L.ic('layers')+'Generic Demo</button></div>'+
   '<div style="background:var(--soft);border-radius:16px;padding:14px;margin:10px 0 6px;min-height:150px" id="gv"><span class="small">Pick a version above.</span></div><div id="gq"></div>');
  const show=(j,b)=>{[L.$('#ga'),L.$('#gb')].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(j);
    L.$('#gv').innerHTML=S.map((s,x)=>{const cut=j&&s[2]==='cut',chg=j&&s[2]==='chg';
      return '<div style="margin:5px 0;'+(cut?'opacity:.45;text-decoration:line-through':'')+'"><b>'+(x+1)+'.</b> '+s[0]+(chg||cut?'<div class="small" style="text-decoration:none;color:var(--'+(cut?'no':'ok')+')">'+s[1]+'</div>':'')+'</div>';}).join('')+
      (j?'<div style="margin:8px 0 0;color:var(--ok);font-weight:600">'+L.ic('check')+' New last step: print copies of the Illustrations and keep them with you.</div>':'');
    if(seen.size===2&&!L.$('#gq').innerHTML){const q=L.$('#gq');q.innerHTML='<h2 class="sub">Why did both infrastructure steps disappear?</h2>';
      L.mc(q,['Generic events never have equipment problems','There’s no known customer to set up with','Marketing always handles the room and screens'],1,
       'Steps 2 and 11 are done <i>with the customer</i>. A Generic Demo has no qualified customer yet, so those steps can’t happen. Research shrinks to general research for the same reason.',
       'Equipment can fail anywhere, and nobody is promised a helper. The steps vanish because they are done together with a specific customer, and a Generic Demo has none yet.');}};
  L.$('#ga').onclick=function(){show(0,this);};L.$('#gb').onclick=function(){show(1,this);};}},
{part:0,src:'Chapter 10 · Generic Demos (exercise: “Why did they buy?”)',run(L){
  L.h(L.kick('learn','Win analysis')+'<h1 class="q">Go back a few months after each sale and ask</h1>'+
   L.quote('Many companies do sales “loss” analysis; very few do “win” analysis.','Peter Cohan, Great Demo!')+
   L.list([['Why did you buy?','Which CBIs, Reasons and Specific Capabilities drove it?'],
     ['How do you use it today?','Which problems is it really solving now?'],
     ['Any surprises?','Problems it solves that nobody planned for. The book calls this one really exciting.'],
     ['What value do you actually get?','Real-life Delta numbers, which the book calls stunningly important.']],2)+
   L.prose('The answers become your Reference Stories for the next sale, and the next. The book suggests making these interviews standard after every product goes live.'));
  L.done();}},
{part:0,src:'Chapter 10 · Vision Generation',run(L){
  L.h(L.kick('learn','Vision Generation')+'<h1 class="q">When you can see the problem, and the customer can’t</h1>'+
   L.prose('The book’s everyday example: a colleague drives off at dusk with broken taillights. You can see it; they can’t. Pointing it out may save them a ticket or a crash.')+
   L.prose('Sometimes a talk with the Salesperson is enough for a customer to see their problem. Sometimes they need to <b>see a solution</b> before the problem becomes real to them. That is a '+L.g('vision-generation','Vision Generation demo')+'.')+
   L.list([['layers','A kind of Generic Demo','Research is hard at this stage, so build it from Generic Demo material.'],
     ['target','Shorter and more focused','Even more than a Technical Proof demo, and usually for a smaller audience.'],
     ['trend','What it can lead to','A good one earns a Technical Proof meeting. A truly great one can bring a fast sale.']],3));
  L.done();}},
{part:0,src:'Chapter 10 · Special Situations',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which kind of demo fits?',['Elevator Demo','Generic Demo','Vision Generation'],[
   ['An industry analyst asks Pallaro for a 30-minute product demo. There’s no customer problem to research.',1,'Analysts are on the book’s list of Generic Demo audiences: show what customers actually bought for.'],
   ['Jordan sees that Ostrova Pharmacies throws away lots of out-of-date stock, but Ostrova’s managers think that’s normal.',2,'The Selling Team sees the problem; the customer doesn’t yet. A short vision of the solution can make it real.'],
   ['Between courses at a supplier dinner, a grocery CEO asks Kai what Pallaro does.',0,'Seconds, not minutes: one crisp sentence, then a printed Illustration with the card.'],
   ['Pallaro runs a webinar; 80 people from unknown companies sign up.',1,'No way to qualify 80 strangers in advance. Use a Generic Demo built from real wins.'],
   ['A garden-centre owner hasn’t linked dead plants to how they order. Jordan wants them to picture the fix.',2,'They can’t see the problem yet. Showing the solution helps them see it.']]);}},

/* ---------- PART 2: TRADE SHOWS ---------- */
{part:1,src:'Chapter 10 · Trade Show Demos',run(L){
  L.h(L.kick('learn','Trade shows')+'<h1 class="q">“Show me your product.” Hold the mouse, and ask first.</h1>'+
   L.prose('Two frustrating openers happen all the time: a visitor walks up and says “show me your product,” or a booth colleague brings someone over and says “show them our product.” They’re really the same situation.')+
   L.prose('<b>Hold back.</b> Keep the mouse ready in your hand, but don’t move it. Ask <b>open-ended questions</b> (ones that can’t be answered with yes or no) about their situation, CBIs and Reasons. If you learn enough and have a matching Illustration, you might give a Great Demo! right there.')+
   L.lanes([['x','Openers that end it','“Can I help you?” “No.”<br>“Can I show you anything?” “No, thanks.”',4],
            ['check','Openers that open up','“What are you most interested in accomplishing at this conference?”<br>“What kind of stores do you run?”',2]]));
  L.done();}},
{part:1,src:'Chapter 10 · Trade Show Demos',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">At Pallaro’s booth at a grocery expo, a visitor lingers, watching Wen’s screen. What should Wen say first?</h1>');
  L.mc(L.card,['“Would you like a quick tour of Pallaro Planner?”','“What do you most want to get from this expo?”','“Can I show you anything in particular today?”'],1,
   'It’s open-ended, so the visitor has to think and tell Wen something useful to qualify from.',
   'A yes-or-no opener invites “no, thanks” and ends the talk, or starts an unqualified tour. An open question gets the visitor talking about their goals.');}},
{part:1,src:'Chapter 10 · Trade Show Demos (the “Menu Approach”)',run(L){
  L.h(L.kick('learn','The Menu Approach')+'<h1 class="q">If they won’t talk, offer a menu</h1>'+
   L.prose('Some visitors share nothing, or insist on seeing a demo first. The '+L.g('menu-approach','Menu Approach')+' works with whatever little you know, maybe just industry, company and job title.')+
   L.flow([['star','Show one','The Situation Slide + Illustration most liked by that job title in that industry','',1],['chat','Ask','“Is this what you’re interested in?”','',2],['cycle','Yes or no','Yes: qualify more, then Do It. No: show the next one.','',3]])+
   L.list([['“I have that exact problem.”','Move into a deeper talk and demo.'],
     ['“Not exactly, but something similar.”','Also move into a deeper talk, and maybe a demo.'],
     ['“I don’t have that problem.”','Show the next item on the menu.']],2)+
   '<p class="small" style="margin-top:10px">Each item takes about two minutes, so 3–5 items fit in ten. If none fits, close the talk politely.</p>');
  L.done();}},
{part:1,src:'Chapter 10 · Trade Show Demos (the “Menu Approach”)',pts:1,
 solve:async L=>{L.$('#nx').click();L.$('#nx').click();},
 run(L){
  const M=[['Juniper Delis: fresh food thrown away','Spoilage report with red flags','“We hardly sell fresh food. Not my problem.”','no'],
           ['Halden Hardware: best-sellers running out','Stock-out flags on top items','“Not exactly… but we run out of cold drinks every hot weekend. Something like that.”','ok']];
  let i=0;
  L.h(L.kick('pr','See it happen')+'<h1 class="q">A visitor: “I run 12 convenience stores. Just show me.” Wen tries the Menu Approach. Show each item.</h1>'+
   '<div class="small">Wen’s menu for this job title, most likely first:</div><div style="margin:6px 0 10px">'+
   ['Fresh food thrown away','Best-sellers running out','Retyping supplier orders'].map((t,x)=>'<span class="chip static" id="mi'+x+'">'+(x+1)+' · '+t+'</span>').join('')+'</div>'+
   '<div id="log"></div><button class="btn pri" id="nx" style="margin-top:10px">'+L.ic('play')+'Show item 1</button><div id="mq"></div>');
  L.$('#nx').onclick=function(){const m=M[i];
    L.$('#log').insertAdjacentHTML('beforeend','<div style="background:var(--soft);border-radius:14px;padding:12px;margin:8px 0"><b>Item '+(i+1)+' · '+m[0]+'</b><div class="small">Situation Slide, then: '+m[1]+'</div><div style="margin-top:6px;color:var(--'+m[3]+');font-weight:600">'+m[2]+'</div></div>');
    i++;
    if(i<M.length){this.innerHTML=L.ic('play')+'Show item 2';}
    else{this.remove();const q=L.$('#mq');q.innerHTML='<h2 class="sub">About four minutes in. What should Wen do now?</h2>';
      L.mc(q,['Show item 3 so the whole menu gets seen','Thank the visitor and close the talk','Ask more questions, then show Do It'],2,
       '“Something similar” is the second good outcome: go deeper, qualify a little more, and if it fits, show Do It and Do It Again.',
       'Item 3 is only needed while nothing fits, and closing is for when 3–5 items all miss. “Something similar” is a signal to go deeper and qualify.');}};}},
{part:1,src:'Chapter 10 · Trade Show Demos (the “Handoff”)',run(L){
  L.h(L.kick('learn','The Handoff')+'<h1 class="q">A fumbled Handoff gains nothing; a clean one moves you forward</h1>'+
   L.prose('When a booth colleague brings someone to the demo station, a clean '+L.g('handoff','Handoff')+' gives the person at the station:')+
   L.list([['people','Introductions','The visitor to the SE, and the SE to the visitor.'],
     ['person','The visitor’s situation','Their job and main interests.'],
     ['target','CBIs, Reasons, capabilities','Even a short list, given trade-show time.'],
     ['clock','Anything else important','For example: they have 15 minutes before a talk.']],1)+
   L.prose('Visitors notice a professional Handoff. It shows real interest in their problems, so they open up. Booths are often staffed by marketing people: the book says to train them to qualify briefly and hand off well.'));
  L.done();}},
{part:1,src:'Chapter 10 · Trade Show Demos (the “Handoff”)',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Malik brings a visitor to Wen’s station. Tap each piece until it’s a clean Handoff.</h1>');
  L.sentence(L.card,[['Wen, this is Tara Bell; Tara, this is Wen.','Wen, quick, show this person our product.'],
     ['Tara seemed pretty interested in us.','Tara runs buying for 18 bakeries.'],
     ['Unsold bread costs them most, and orders are by hand.','Tara loves dashboards and wants to see them all.'],
     ['They’ve got time for the full tour.','Tara has 10 minutes before a talk.']],[0,1,0,1],
   [['That’s the fumbled Handoff: no introductions and nothing learned.'],['Too vague. Give the visitor’s job and main interests.'],['That’s a feature, not a problem. Pass on the CBI and the Reason.'],['A guess. Pass on real limits, like the time the visitor has.']],
   'Introductions, job, CBI and Reason, and the time limit. Wen can ask Tara to say more, and might even give a Great Demo!');}},

/* ---------- PART 3: BIG GROUPS ---------- */
{part:2,src:'Chapter 10 · Large Groups, Largely Unqualified',run(L){
  L.h(L.kick('learn','The To Do List')+'<h1 class="q">You qualified three people. Twenty-two walk in.</h1>'+
   L.prose('A bigger crowd is good news: wider interest. But you can’t qualify everyone one by one, and they came for a demo. For groups up to about 40, use a '+L.g('to-do-list','To Do List')+'.')+
   L.list([['Ask everyone','After your Introduction, each person gives their name, job and exactly what they want to see. Write each wish on the whiteboard; tally repeats.'],
     ['Mark it aloud','Say which items you have, which you don’t, and which you’ll show. Give extra weight to your first contacts and senior people.'],
     ['Agree the plan','Walk the list and ask the room if the plan is OK.'],
     ['Hook everyone first','Like a demo with several Solutions, show all the Illustrations up front.'],
     ['Tick and summarize','Demo each item, summarize, tick it. End with a summary of the whole list.']],3));
  L.done();}},
{part:2,src:'Chapter 10 · Large Groups, Largely Unqualified (anecdote)',run(L){
  L.h(L.kick('ex','A story from the book')+'<h1 class="q">The author expects two hosts and finds a full classroom</h1>');
  L.beats(L.card,[
   ['The surprise','He had qualified two people. Over 30 arrived. He had about an hour.'],
   ['The list','Each person said who they were, what they did and what they hoped to see. Many wishes overlapped, so tally marks showed where the real problems were.'],
   ['Honesty','A few wishes were things the software couldn’t do. He crossed them out, said so plainly, and told those people they were free to leave.'],
   ['The demo','Each item got the Great Demo! treatment, minus Q&amp;A. Most questions went on a Not Now List on the same board.'],
   ['Ticking off','After each item: a summary and a tick. At the end, a summary of the whole list, linking each capability back to who asked.'],
   ['The result','A few people stayed 30 more minutes running their own real problems. The order came soon after, larger than planned.']],
   'Honesty about what you can’t do showed respect for people’s time, and the visible ticks kept the whole room on track.');}},
{part:2,src:'Chapter 10 · Large Groups, Largely Unqualified',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">At Brightwell’s demo, a store manager adds “schedule our delivery trucks” to the list. Pallaro Planner can’t. What should Kai do?</h1>');
  L.mc(L.card,['Leave it on the list and hope time runs out','Show the staff-scheduling extra in its place','Cross it out, say so, and let them leave if they wish'],2,
   'Setting expectations clearly is part of the method. It respects the manager’s time and makes everything else Kai says more believable.',
   'Hoping time runs out leaves a promise broken, and a different feature doesn’t answer the wish. Say plainly it isn’t offered, and free that person to go.');}},
{part:2,src:'Chapter 10 · Large Groups, Largely Unqualified',pts:1,run(L){
  L.h(L.kick('pr','Put it in order')+'<h1 class="q">Kai runs Brightwell’s surprise crowd of 22. Tap the moves in order.</h1><div id="od"></div>');
  L.order(L.$('#od'),['Thank the hosts and confirm the hour','Ask each person what they want to see','Mark what Pallaro has and will show','Ask the room to agree the plan','Show all the Illustrations up front','Demo, summarize and tick each item','Summarize the whole list at the end'],
   'Gather wishes, set expectations, agree, hook everyone, then work the list visibly and close with a full summary.');}},

/* ---------- PART 4: OTHER DEMOS ---------- */
{part:3,src:'Chapter 10 · Product Roll-out Demos',run(L){
  L.h(L.kick('learn','Product roll-outs')+'<h1 class="q">A new release is not a list of new features</h1>'+
   L.prose('Pallaro launches Pallaro Planner 7 at an event for 200 people. You can’t learn much about an audience that size, so use a Generic Demo of the release’s highlights.')+
   L.prose('The pull is to show every new feature. Malik wants exactly that. The book says new features are fine, as long as each one is shown as a <b>Solution</b> to a real business problem.')+
   L.list([['flask','Ask the beta customers','If early customers have used it, run a “why did they buy?” study with them. Real stories beat guesses and feature lists.'],
     ['people','Ask for a show of hands','“How many of you use Pallaro today? How many don’t? How many didn’t raise a hand?” It warms the room and tells you something.']],2));
  L.done();}},
{part:3,src:'Chapter 10 · Canned Demos',run(L){
  L.h(L.kick('learn','Canned Demos')+'<h1 class="q">Recorded demos: sometimes needed, always risky</h1>'+
   L.prose('A '+L.g('canned-demo','Canned Demo')+' fits a website, a video, staff who can’t run the software, or software that needs heavy set-up. But nobody can adjust it, and viewers often watch alone, so you can’t learn their CBIs.')+
   L.lanes([['alert','The risks','Can’t adapt to the viewer. A stale demo may be worse than none. Competitors can watch it too.',4],
            ['check','What helps','Start pages by problem that lead viewers to the right demo. Show the Illustration, then Do It, with a summary after each. End with a call to action.',2]])+
   L.prose('You might add Do It Again and Q&amp;A when needed, for example when a colleague runs it and can pause it to fit the moment. And the less you know about the audience, the less reason to build one.'));
  L.done();}},
{part:3,src:'Chapter 10 · Canned Demos',pts:6,run(L){
  L.h(L.kick('pr','Sort the plan')+'<h1 class="q">Malik and Wen plan a recorded demo for Pallaro’s website. Sort each idea.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Good practice','Risky'],[
   ['Start pages by problem: “Throwing away fresh food?”',0,'Lead-in pages describing CBIs and Reasons guide each viewer to the demo that fits them.'],
   ['One 25-minute recording of every Planner 7 feature',1,'A feature tour can’t find the viewer’s problem, and nobody is there to steer it.'],
   ['Open each demo on the Store reorder report',0,'Illustration first, then Do It: the shape the book suggests for most Canned Demos.'],
   ['Leave last year’s screens up until the next release',1,'A stale demo may be worse than no demo at all.'],
   ['End with a “have a Salesperson call me” form',0,'Nobody from Pallaro is there, so the call to action must be built in.'],
   ['Show Juniper Delis’ real numbers, unedited',1,'Anyone can watch, competitors included. Use generic data.']],
   'Lead viewers by problem, show the value first, keep it current, protect data, and tell them what to do next.');}},
{part:3,src:'Chapter 10 · Scripted Demonstrations',run(L){
  L.h(L.kick('learn','Scripted demos')+'<h1 class="q">When the customer writes the script</h1>'+
   L.prose('Some companies, and especially government buyers and formal requests for proposals (RFPs), demand that every vendor follow a script: “first show this, then this…”, often with a time limit. The customer wants a fair side-by-side comparison. Vendors know scripts often don’t match how the software is really used.')+
   L.flow([['shield','1 · Respect it','Ignore the script and you’ll likely be disqualified','',1],['pencil','2 · Try to reshape it','Rarely works, but worth asking','',2],['star','3 · Use the Introduction','Cut the company overview; show Situation Slides and Illustrations','',3]])+
   L.prose('Then follow the script faithfully. The book tells of vendors whose short, crisp Introductions created a vision that won the business.'));
  L.done();}},
{part:3,src:'Chapter 10 · Deployment Demos',run(L){
  L.h(L.kick('ex','After the sale')+'<h1 class="q">Halden Hardware bought 60 licences. Fifteen people use them.</h1>');
  L.beats(L.card,[
   ['Shelfware','The other 45 licences sit unused: '+L.g('shelfware','shelfware')+'. Selling Halden more software is now close to impossible.'],
   ['Reason 1?','The book’s first cause is selling a vision the software can’t deliver. It offers no fix for that, and it isn’t Halden’s case.'],
   ['Reason 2','Once the deal closed, Jordan moved on and never passed Halden’s CBIs, Reasons and Specific Capabilities to the trainers.'],
   ['Reason 3','So training was a general “how-to” tour of menus. Buyers left confused and went back to spreadsheets.'],
   ['The fix','Pass the CBIs on, and run training like a Great Demo!: first show the stock-out report each buyer will get, then the how-to.']],
   'Deployment demos can matter as much as the ones that won the order: they make future sales and happy Reference Stories possible.');}},
{part:3,src:'Chapter 10 · Special Situations',pts:6,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Mixed review: best move',['Use the Introduction time','Show value first in training','Frame it as a business problem','Hold the mouse, ask questions'],[
   ['Valecrest Co-op’s RFP script: 10 minutes “about your company,” then 40 fixed steps.',0,'Respect the script, but use those 10 minutes for Situation Slides and Illustrations.'],
   ['A new customer’s training starts with a tour of the menu bar.',1,'Show what the software will do for these users first; how-to comes after.'],
   ['Malik’s Planner 7 launch talk opens with “five new features.”',2,'New features are fine when each is shown as the Solution to a real problem.'],
   ['A visitor at the booth: “Go on, show me what it does.”',3,'Don’t start clicking. Hold the mouse ready and ask open questions first.'],
   ['Trainers at Halden were never told why Halden bought.',1,'Pass the CBIs and Reasons to the trainers so training shows the value Halden bought for.'],
   ['A webinar teaser for Planner 7 lists every new menu option.',2,'Lead with the business problems the release solves, ideally from beta customers’ stories.']]);}}
  ]
});
