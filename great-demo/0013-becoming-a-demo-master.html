<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Becoming a Demo Master</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0013', title:'Becoming a Demo Master', minutes:19, icon:'compass',
  goals:['Plan how to know your software, its companions, your rivals and your customers deeply','Run a Tips and Tricks session and an SE Demo Day','Triage capabilities into IN, NOT and RESERVE, and keep growing by teaching others'],
  parts:['Practice first','Know thy…','Teach and share','Extend thyself'],
  read:'Read chapter 14 of the book for its many exercises, the “whole product” checklist and the sample Demo Day schedule.',
  glossary:{
    'tips-and-tricks':'Tips and Tricks session: a free 1–2 hour session at the customer’s site where an SE works real problems with a handful of users. Halfway between a demo and training.',
    'demo-day':'Demo Day: a few hours at a sales meeting where several SEs each give one demo and their peers discuss it.',
    'reserve':'RESERVE capability: one not in the demo, held back because it might matter to the customer, set you apart or add value if the moment comes.'
  },
  cheatsheet:[
    'Give at least <b>ten live Great Demos</b> before polishing further. Adults learn by repetition.',
    '<b>Know thy software</b>: try everything, on slow machines and networks, moving data in and out. Trim demos each release; they never shrink on their own.',
    '<b>Know thy complementary products</b>: if the finished result is made in another tool, show it finished there.',
    '<b>Know thy competition</b>, but never criticize it to customers. Diagnose with a bias: “Would it <i>also</i> be useful to…?”',
    '<b>Know thy customers</b>: good, ask customer service; better, take training with them; best, have them demo their own use to you.',
    '<b>Tips and Tricks</b>: Salesperson agrees, you’re truly prepared, never cancel, 2–4 mini Great Demos ready, problems gathered as a To Do List.',
    '<b>Demo Days</b>: several SEs, 20 minutes each plus 10–20 of discussion. The bigger the audience, the harder to stay focused.',
    '<b>Extend thyself</b>: take customer examples live, triage capabilities into <b>IN / NOT / RESERVE</b>, and train someone else.'
  ],
  steps:[
/* ---------- PART 1: PRACTICE FIRST ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">A new cook wants to learn advanced plating. When will a plating class help most?</h1>');
  L.mc(L.card,['After cooking the basic dishes many times','Before cooking anything at all'],0,
   'Advanced tricks only stick once the basics are automatic. The book’s last chapter starts with exactly this warning.',
   'Without the basics, advanced tips are just more to juggle. Repeat the basics first, then add polish. The book opens its last chapter the same way.');}},
{part:0,src:'Chapter 14 · Caveat; Beyond The Basics',run(L){
  L.h(L.kick('learn','Ten demos first')+'<h1 class="q">Master the basics, then go beyond them</h1>'+
   L.prose('The book asks you to give at least <b>ten live customer demos</b> with the Great Demo! method before reading its final chapter. Adults learn by repetition, and you need to be confident and consistent before adding anything new.')+
   L.prose('Wen has now done eleven, from the trade-show booth to the Ostrova remote demo. Time to go further. The path to Demo Master has four parts:')+
   L.flow([['eye','Know thy…','software, complementary products, competition, customers'],['people','Teach thy customers','Tips and Tricks'],['layers','Know thy peers','Demo Days'],['compass','Extend thyself','take examples, triage, teach']]));
  L.done();}},
{part:0,src:'Chapter 14 · Know Thy Software',run(L){
  L.h(L.kick('learn','Know thy software')+'<h1 class="q">Try everything, and try to break it</h1>'+
   L.list([['Try it everywhere','A slow old machine, a brand-new operating system, slow and fast networks.'],
     ['Move data in and out','Import and export complex data. Watch what gets lost on the way: nothing stretches software like that.'],
     ['Push the limits','Run the hardest queries. Find bugs nobody has found yet.'],
     ['Read the manual','And the help pages, for your products and the ones they work with.']],1)+
   L.note('<b>Demos never seem to get shorter.</b> Each release adds new features to the old demo. Test whether new capabilities matter to your audience’s CBIs, and trim old demos hard, or better, start fresh.','alert'));
  L.done();}},
{part:0,src:'Chapter 14 · Know Thy Software',run(L){
  L.h(L.kick('ex','Wen’s exploring week')+'<h1 class="q">Wen sets out to know Pallaro Planner better than anyone</h1>');
  L.beats(L.card,[
   ['Slow machine','Wen runs Planner on an old back-office PC like those in Fenmore’s smaller stores. The reorder report takes twice as long to open. Good to know before a store demo.'],
   ['Data out','Wen exports a reorder list to a spreadsheet and spots that item codes starting with zero lose the zero. Wen reports it to development.'],
   ['Manual','Wen reads the help pages and finds a forecast setting even Kai hadn’t used.'],
   ['New release','Planner version 7 arrives. Malik wants all five new features added to the standard demo. Wen checks each against retailers’ CBIs: two matter, three don’t.']],
   'Exploring finds problems before customers do. And every release is a chance to trim, not just to add.');}},
{part:0,src:'Chapter 14 · Know Thy Software',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">How should Wen update the standard demo for Planner version 7?</h1>');
  L.mc(L.card,['Append all five new features to the end','Start fresh with the most relevant capabilities','Keep the old demo and skip the new release'],1,
   'Starting fresh, keeping only what matters to the audience’s CBIs, stops the demo from growing with every release.',
   'Appending is how demos grow from 20 minutes to 90. Ignoring the release misses what’s relevant. Rebuild around the best, most relevant capabilities.');}},
{part:0,src:'Chapter 14 · Know Thy Complementary Products',run(L){
  L.h(L.kick('learn','Know thy complementary products')+'<h1 class="q">The customer buys a Solution, not just your product</h1>'+
   L.prose('Your software rarely works alone. If a Solution needs another product, such as a spreadsheet, you must know that product as well as your own.')+
   L.prose('The book’s example: a demo exports data to a spreadsheet, where it should be sorted into the report the customer wants. If you skip the sort and the formatting, you haven’t proved the capability, and the demo fails. Don’t assume they can picture the last step; they may not know how.')+
   L.note('<b>Show the finished deliverable</b>, even if the final step happens in someone else’s product.','check'));
  L.done();}},
{part:0,src:'Chapter 14 · Know Thy Complementary Products',pts:1,run(L){
  L.h(L.kick('pr','What should Wen do?')+'<h1 class="q">Fenmore’s store managers get a printed reorder sheet every Monday, sorted by aisle. Planner exports the list; the sorting and layout happen in a spreadsheet. How should Wen end this part of a demo?</h1>');
  L.mc(L.card,['Show the export, then say they can sort it later','Show the finished, aisle-sorted sheet ready to print','Skip the export and show only Planner’s screen'],1,
   'The managers need the Monday sheet, not a raw export. Showing it finished proves the whole Solution.',
   'The deliverable is the aisle-sorted sheet. Stopping short, or skipping the export, leaves the capability unproven. Show the finished sheet.');}},

/* ---------- PART 2: KNOW THY… ---------- */
{part:1,src:'Chapter 14 · Know Thy Competition',run(L){
  L.h(L.kick('learn','Know thy competition')+'<h1 class="q">Study rivals closely, and never knock them</h1>'+
   L.prose('Learning a competitor’s product shows you features worth asking your developers for, the rival’s weaknesses, <i>your</i> weaknesses, and how to move a customer’s data across from it.')+
   L.lanes([['x','The golden rule','When customers ask about a competitor: don’t comment. Even if you know its flaws, don’t call them out.',4],
            ['chat','What to say','“As I don’t work for them, I can’t really speak for their products. I can tell you about ours.”',2]])+
   L.prose('The book reminds you that today’s competitor may be tomorrow’s partner.'));
  L.done();}},
{part:1,src:'Chapter 14 · Know Thy Competition',run(L){
  L.h(L.kick('learn','Diagnose with a bias')+'<h1 class="q">Use what you know without attacking anyone</h1>'+
   L.prose('While qualifying, steer gently toward needs your product meets and your rival’s doesn’t. The key word is <b>also</b>: “Would it <i>also</i> be useful to…?”')+
   L.flow([['chat','Ask','“Would it also help to…?”'],['check','They say yes','A new Specific Capability you can show, and a barrier for the rival','',2],['x','They say no','Drop it and move on. Don’t demo it.','',4]])+
   L.prose('“Also” adds the idea without feature glut. And you never criticized the competition.'));
  L.done();}},
{part:1,src:'Chapter 14 · Know Thy Competition',run(L){
  L.h(L.kick('ex','Wen studies Northgate')+'<h1 class="q">Wen learns Northgate Planning, the rival Pallaro meets most often</h1>');
  L.beats(L.card,[
   ['The table','Wen lists Planner’s key capabilities, ticks Pallaro’s column, then adds a column for Northgate Planning.'],
   ['A gap','Northgate forecasts by region, not for each store separately. Per-store forecasts are Planner’s first Specific Capability for Fenmore.'],
   ['A row for them','Northgate has a phone app for store managers; Planner doesn’t. Wen adds that row, plans a work-around answer and tells product management.'],
   ['On a call','A new prospect asks, “Is Northgate any good?” Wen: “I don’t work for Northgate, so I can’t speak for them. I can show you what we do.”'],
   ['The also','Later: “Would it also help to see a forecast for each store, not just each region?” The prospect says yes. A new Specific Capability, and Northgate can’t match it.']],
   'Know the rival in detail, say nothing against them, and let your questions do the work.');}},
{part:1,src:'Chapter 14 · Know Thy Competition',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">A buyer asks Wen: “Northgate says their forecasts are better. Is that true?” What should Wen say?</h1>');
  L.mc(L.card,['“I can’t speak for them, but I can show ours.”','“Not really. They only forecast by region.”','“They’re fine, but they’re a bit behind us.”'],0,
   'Decline to comment on the rival, then turn to what Pallaro can prove.',
   'Even a true weakness shouldn’t be called out. Decline politely, talk about your own product, and use “also” questions later to surface the gap.');}},
{part:1,src:'Chapter 14 · Know Thy Competition',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Good move or misstep?',['Good move','Misstep'],[
   ['Wen asks: “Would it also help to approve orders from one screen?” The buyer shrugs, so Wen moves on.',0,'Exactly how “also” works: if they’re not interested, drop it.'],
   ['Kai tells a prospect that Northgate “crashes all the time.”',1,'Never knock a competitor, even if it’s true.'],
   ['Wen practises moving a Northgate customer’s data into Planner.',0,'Knowing how to migrate data smooths replacing a rival’s product.'],
   ['The buyer said no to the extra capability, but Wen demos it anyway.',1,'Only show it if they want it as a Specific Capability.'],
   ['Wen adds a row for a Northgate strength and prepares a work-around.',0,'Know your own weaknesses and be ready to address them.']]);}},
{part:1,src:'Chapter 14 · Know Thy Customers',run(L){
  L.h(L.kick('learn','Know thy customers')+'<h1 class="q">Good, better and best ways to learn about customers</h1>'+
   L.tiers([['chat','A good idea','Work with your customer service team to find key customer issues and unmet needs.',''],
     ['book','A better idea','Take product training alongside customers. Hear their impressions, plans and feedback.',''],
     ['eye','The best idea','Visit customers and have <b>them</b> demo how they use your product, and any rival or companion products.','',true,'Best']])+
   L.prose('Users’ group meetings help too, and the smaller the group, the more people share. Treat what customers tell you as confidential unless you’re clear it can be shared.'));
  L.done();}},
{part:1,src:'Chapter 14 · Know Thy Customers',pts:1,run(L){
  L.h(L.kick('pr','What should Wen do?')+'<h1 class="q">Wen has one free afternoon to learn how retailers really use Planner. Which plan teaches the most?</h1>');
  L.mc(L.card,['Read last quarter’s support tickets','Join a customer training class','Watch Fenmore’s buyers demo their own use'],2,
   'Seeing customers show their real work is the book’s best idea. Wen should still keep what they see confidential.',
   'Support tickets are good and training classes are better, but having customers demo their own use is the best of the three.');}},

/* ---------- PART 3: TEACH AND SHARE ---------- */
{part:2,src:'Chapter 14 · Teach Thy Customers',run(L){
  L.h(L.kick('learn','Teach thy customers')+'<h1 class="q">Every demo is a little training, so lean into it</h1>'+
   L.prose('In real training, customers often voice needs they keep hidden when a Salesperson is in the room. Use that, but respect the trust: never misuse what you learn.')+
   L.prose('A '+L.g('tips-and-tricks','Tips and Tricks session')+' sits halfway between a demo and training: usually 1–2 hours, at the customer’s site, with a handful of users, working on <b>their real problems</b>. The focus is “how”, not “what”: “How do I attack this?”, “Is there a way to…?”')+
   L.note('Customers get targeted, high-value help. You get close contact with real users and their real issues, trust, and ideas for better demos and products.','bulb'));
  L.done();}},
{part:2,src:'Chapter 14 · Teach Thy Customers',run(L){
  L.h(L.kick('learn','Running a Tips and Tricks session')+'<h1 class="q">Six steps the book recommends</h1>'+
   L.list([['Get the Salesperson’s agreement','Usually the session is free, so agree it first.'],
     ['Be truly prepared','Know your software very well. Confidence isn’t execution.'],
     ['Propose it to the customer','Free, at their site, with an expert. Ask them to bring real “how to” problems.'],
     ['Honor the date','Canceling tells the customer they don’t matter.'],
     ['Prepare 2–4 mini Great Demos','Short segments on popular capabilities, in case nobody brings a problem.'],
     ['Open with introductions, then collect problems','Organize them with the To Do List method.']],2));
  L.done();}},
{part:2,src:'Chapter 14 · Teach Thy Customers',run(L){
  L.h(L.kick('ex','Six weeks after go-live')+'<h1 class="q">Wen runs a Tips and Tricks session for five Fenmore buyers</h1>');
  L.beats(L.card,[
   ['Set up','Jordan agrees. Sam books the room. Wen preps three mini Great Demos: holiday weeks, changing a forecast horizon, bulk-approving orders.'],
   ['Open','Introductions, then: “What are you stuck on?” Silence. Wen runs the holiday-week segment, and hands start going up.'],
   ['To Do List','Wen writes each problem on the whiteboard, the group picks an order, and they work through them, ticking each off.'],
   ['Robin opens up','With no Salesperson there, Robin admits the buyers still copy last week’s order by hand for slow-moving items.'],
   ['After','Wen passes the “copy last week” need to product management and books a follow-up. The buyers ask Wen to come back.']],
   'Prepared segments get things moving; the To Do List keeps it organized; and the real problems are gold for future demos.');}},
{part:2,src:'Chapter 14 · Teach Thy Customers',pts:1,run(L){
  L.h(L.kick('try','Put it in order')+'<h1 class="q">Put Wen’s steps for a second Tips and Tricks session, for Fenmore’s store managers, in order.</h1><div id="od"></div>');
  L.order(L.$('#od'),['Get Jordan’s agreement','Propose the free session to Sam','Prepare mini Great Demo! segments','Hold the session on the agreed date','Start with introductions','Collect problems as a To Do List'],
   'Salesperson first, then the customer, then preparation; keep the date, open with introductions, and organize their problems.');}},
{part:2,src:'Chapter 14 · Know Thy Peers',run(L){
  L.h(L.kick('learn','Know thy peers')+'<h1 class="q">Your fellow SEs are a goldmine, if you ask</h1>'+
   L.prose('An SE '+L.g('demo-day','Demo Day')+' shares demos, tools and experience. At the next sales meeting, set aside a few hours:')+
   L.list([['people','Several SEs, one demo each','Agree in advance who presents.'],
     ['clock','20 minutes plus discussion','Each demo gets about 20 minutes, then 10–20 minutes of discussion.'],
     ['list','End with the tools','Close with the Illustrations, data sets and tools people need.'],
     ['target','Decide who’s invited','SEs only keeps the focus on the details of good demos. Inviting sales or marketing spreads the word, but larger groups lose focus.']],3)+
   '<p class="small" style="margin-top:10px">Also build a network of everyone in your company who talks to customers and learns things you could use.</p>');
  L.done();}},
{part:2,src:'Chapter 14 · Know Thy Peers',pts:1,
 solve:async L=>{const c=L.$('#au').children;c[0].click();c[1].click();c[2].click();},
 run(L){
  const O=[['SEs only','Six SEs.',[90,30],'Deep debate on Illustration choices and click paths.'],
           ['SEs + sales','Six SEs and eight Salespeople.',[60,65],'Salespeople learn which demos exist; detail discussions get shorter.'],
           ['SEs + sales + marketing','Add Malik’s team and consulting.',[30,95],'Lots of reach, but talk drifts to release features and messaging.']];
  const seen=new Set();
  L.h(L.kick('pr','Toggle and compare')+'<h1 class="q">Wen is organizing Pallaro’s first Demo Day. Try each guest list.</h1><div id="au" style="display:flex;gap:8px;flex-wrap:wrap"></div>'+
   '<div style="background:var(--soft);border-radius:16px;padding:14px;margin:10px 0 6px;min-height:160px" id="aw"><span class="small">Pick a guest list above.</span></div><div id="aq"></div>');
  O.forEach((o,j)=>{const b=document.createElement('button');b.className='chip';b.innerHTML=L.ic('people')+o[0];
    b.onclick=()=>{[...L.$('#au').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(j);
      L.$('#aw').innerHTML='<p class="small" style="margin:0 0 8px">'+o[1]+'</p>'+
        '<div class="meterrow"><div class="lb">Focus on demo craft</div><div class="meter"><div style="width:'+o[2][0]+'%;background:var(--ok-strong)"></div></div></div>'+
        '<div class="meterrow"><div class="lb">Reach across Pallaro</div><div class="meter"><div style="width:'+o[2][1]+'%;background:var(--h2)"></div></div></div>'+
        '<p style="margin:8px 0 0"><i>'+o[3]+'</i></p>';
      if(seen.size===3&&!L.$('#aq').innerHTML){const q=L.$('#aq');q.innerHTML='<h2 class="sub">Wen’s goal: help every SE build sharper Illustrations. Who should come?</h2>';
        L.mc(q,['SEs + sales + marketing, for reach','SEs only, to keep the focus'],1,
         'The goal is about demo craft, so a small SE-only group fits. Reach can come at a later session.',
         'The bigger the group, the harder it is to stay on specific objectives. For sharper Illustrations, keep it to SEs.');}};
    L.$('#au').appendChild(b);});}},

/* ---------- PART 4: EXTEND THYSELF ---------- */
{part:3,src:'Chapter 14 · Extend Thyself',run(L){
  L.h(L.kick('learn','Extend thyself')+'<h1 class="q">Create opportunities, and seize them as they come</h1>'+
   L.list([['Take customer examples','Even on the fly. It takes deep confidence in your software and in turning their problem into a solution live. Tips and Tricks sessions are a safe place to practise.'],
     ['Go beyond the list','Show other capabilities when questions or new qualification make them relevant.'],
     ['Triage your capabilities','Sort everything you could show into three groups before the demo (below).'],
     ['Train someone else','Teaching forces you to sharpen what you know and clear up your own confusion.']],1)+
   L.flow([['check','IN','Specific Capabilities found in qualification','',2],['x','NOT','Clearly not relevant to this customer','',4],['lock','RESERVE','Might matter, set you apart or add value','',3]],false));
  L.done();}},
{part:3,src:'Chapter 14 · Extend Thyself',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">Wen triages for a new prospect: a 15-store bakery-café chain</h1>');
  L.beats(L.card,[
   ['Their CBI','Too many unsold pastries thrown away each night, while morning favorites sell out.'],
   ['IN','Per-store demand forecasts, and the reorder report with spoilage flags. Both came up in qualification.'],
   ['NOT','The 40-store roll-up view: they have 15 stores and didn’t ask. The supplier link: they bake on site.'],
   ['RESERVE','Holiday-week forecasting. Not asked for, but Easter is near and Northgate can’t do it per store. Wen keeps it ready in case a question opens the door.'],
   ['In the demo','The finance lead asks, “What about Easter week?” Wen shows the holiday forecast in two minutes.']],
   'IN is the demo. NOT stays out. RESERVE is ready if a question makes it relevant.');}},
{part:3,src:'Chapter 14 · Extend Thyself',pts:5,run(L){
  L.h(L.kick('try','Triage it')+'<h1 class="q">Ostrova Pharmacies has qualified: its CBI is out-of-date stock thrown away, and cold-and-flu items running short each winter. Sort Planner’s capabilities.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['IN','NOT','RESERVE'],[
   ['Forecast demand per item per pharmacy',0,'Directly tied to their CBI, found in qualification.'],
   ['Flags items about to expire or run out',0,'Exactly their Reason. It belongs in the demo.'],
   ['Fresh-produce spoilage chart',1,'Pharmacies don’t sell produce. Clearly not relevant.'],
   ['Flu-season forecasting, which Northgate lacks',2,'Not asked for yet, but could set Pallaro apart if the topic comes up.'],
   ['Sending orders to suppliers with no retyping',2,'Could add value; hold it ready in case they raise ordering effort.']],
   'IN is what qualification found. NOT is irrelevant. RESERVE is what might matter, set you apart or add value.');}},
{part:3,src:'Chapter 14 · Congratulations!',run(L){
  L.h(L.kick('learn','What a Demo Master looks like')+'<h1 class="q">There’s no diploma, but you’ll know</h1>'+
   L.list([['people','In demand','Salespeople ask for you on key deals. Customers ask for help with new problems and with new users. Partners invite you to their events.'],
     ['scale','More weight','Your view counts in what gets built next. Support and consulting ask for your help.'],
     ['book','More responsibility','You must pass it on: share what you know with new hires and build a training plan for new SEs.']],2)+
   L.prose('For Wen, six months in at the start of this course, that’s the road ahead. One day Wen will coach the next new SE through a first Great Demo!, just as Kai coached Wen.'));
  L.done();}},
{part:3,src:'Chapter 14 · Becoming A Demo Master',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Mixed review: which habit is Wen using?',['Know thy software','Know thy competition','Teach thy customers','Know thy peers','Extend thyself'],[
   ['Wen imports a messy file from an old ordering system to see what data gets lost.',0,'Pushing data in and out is a core way to learn your own software.'],
   ['Wen asks a prospect: “Would it also help to forecast each store separately?”',1,'Diagnosing with a bias, using what Wen knows about Northgate.'],
   ['Wen spends two hours at Fenmore working through buyers’ real problems.',2,'A Tips and Tricks session.'],
   ['Wen books a morning at the sales meeting for four SEs to show and discuss demos.',3,'An SE Demo Day.'],
   ['Wen coaches a new SE through their first Great Demo! outline.',4,'Training someone else is the last way to extend yourself.']]);}}
  ]
});
</script>
</body>
</html>
