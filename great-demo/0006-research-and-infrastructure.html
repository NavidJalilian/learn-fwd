<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Technical preparation: research and infrastructure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0006', title:'Technical preparation: research and infrastructure', minutes:18, icon:'compass',
  goals:['Explain why the SE needs the customer’s context, not just a list','Run Direct and Indirect Research and turn it into a value number','Use an Infrastructure Checklist before building anything'],
  parts:['The SE’s job','Direct Research','Value and trust','Infrastructure'],
  read:'Read the first part of chapter 8 of the book for the full research checklist and every item on the Infrastructure Checklist.',
  glossary:{
    champion:'Champion: a person at the customer who willingly and actively supports buying and rolling out your product, and helps you reach the right people.',
    'direct-research':'Direct Research: contacting the customer and asking them for their workflow, example reports and real problems.',
    'indirect-research':'Indirect Research: learning about the customer from public sources when they can’t or won’t share information directly.',
    'earned-reputation':'Earned Reputation: the mix of trust and proven results that a company, Salesperson or SE builds with customers over time.',
    nda:'Non-Disclosure Agreement (NDA): a legal document that says which information is confidential and how it may be used.',
    'infra-checklist':'Infrastructure Checklist: a list of all the equipment, software, network, power, room and handout needs for one demo, split into required and optional.'
  },
  cheatsheet:[
    'The SE turns the qualification into a demo that shows the Specific Capabilities <b>in the customer’s context</b>, not as a list.',
    'A Solution is only a Solution when the <b>customer</b> sees how it solves their CBIs.',
    'Eleven steps; the first two are <b>research</b> and <b>infrastructure</b>, before you build anything.',
    '<b>Direct Research</b>: ask the customer for their workflow, example reports and real (solvable!) problems. Get permission to use them.',
    'Value = today minus the goal, in the <b>customer’s numbers</b>: person-days × cycles, then × the cost per day. Promise conservatively.',
    'Involving people in research creates allies and a <b>Champion</b>. Protect confidential data; check whether an NDA is needed.',
    '<b>Indirect Research</b> (website, publications, patents, competitors) is weaker, but far better than nothing.',
    'Fill in an <b>Infrastructure Checklist</b> now, split into required and optional, and build the demo around anything missing.'
  ],
  steps:[
/* ---------- PART 1: THE SE’S JOB ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Jordan hands Kai a tidy list: the three things Fenmore needs to see. Kai plans to show them one by one, in list order. Will that convince Fenmore?</h1>');
  L.mc(L.card,['Maybe, but it may not feel like Fenmore’s problem','Yes, a correct list is all a demo needs'],0,
   'Right. A list proves features, not that they fix <i>Fenmore’s</i> problem. This lesson is about what the SE does with the list.',
   'A correct list is a good start, but shown in isolation it may not connect to Fenmore’s day. This lesson is about adding that connection.');}},
{part:0,src:'Chapter 8 · The Role Of The SE',run(L){
  L.h(L.kick('learn','The SE’s job')+'<h1 class="q">Turn the list into a Solution the customer recognizes</h1>'+
   L.prose('The Salesperson hands over the qualification. The '+L.g('se','SE')+' must turn it into a demo that presents the '+L.g('specific-capability','Specific Capabilities')+' in a logical order and <b>in the context of the customer’s situation</b>.')+
   L.quote('A Solution is only a Solution if the customer agrees.','Peter E. Cohan, chapter 8')+
   L.prose('In other words, a set of capabilities only becomes a Solution when the customer can see how it solves their '+L.g('cbi','CBIs')+'. Walking down the list, one item at a time, might be adequate. It won’t be a Great Demo!'));
  L.done();}},
{part:0,src:'Chapter 8 · The Role Of The SE',run(L){
  L.h(L.kick('learn','Eleven steps')+'<h1 class="q">The SE’s preparation, from research to rehearsal</h1>'+
   L.list([['Execute research','This lesson'],['Coordinate infrastructure with the customer','This lesson'],['Create your Outline',''],['Create your Summary and Introduction',''],['Create your Illustration',''],['Develop the first pass (Do It)',''],['Develop the second pass (Do It Again)',''],['Practice',''],['Present to the Selling Team',''],['Adjust and refine',''],['Confirm infrastructure with the customer','']],1)+
   '<p class="small" style="margin-top:10px">Notice that two steps come before you build a single screen: learn the customer’s context, and make sure you’ll be able to show the demo at all. Steps 3 to 11 are the next lesson.</p>');
  L.done();}},
{part:0,src:'Chapter 8 · The Role Of The SE',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">In a practice run, Kai shows all three capabilities without a hitch. But Sam says, “I still don’t see how this cuts our spoilage.” Has Kai shown a Solution?</h1>');
  L.mc(L.card,['Yes: all three capabilities worked perfectly','Mostly: the features are right, so it counts','No: Sam can’t see how it solves the problem'],2,
   'A Solution is only a Solution if the customer agrees. Until Sam sees the link to spoilage, it’s a set of working features.',
   'Working features aren’t enough. The customer has to see how they solve their CBI. Sam doesn’t yet, so it isn’t a Solution.');}},
{part:0,src:'Chapter 8 · The Role Of The SE',pts:1,run(L){
  L.h(L.kick('pr','Put it in order')+'<h1 class="q">Wen keeps mixing up the steps. Put these five of the eleven in the book’s order.</h1>');
  L.order(L.card,['Execute research','Coordinate infrastructure with the customer','Create your Outline','Create your Illustration','Practice'],
   'Research and infrastructure come first, before any building. Then the Outline, the Illustration, and practice.');}},

/* ---------- PART 2: DIRECT RESEARCH ---------- */
{part:1,src:'Chapter 8 · 1. Execute Research',run(L){
  L.h(L.kick('learn','Context is critical')+'<h1 class="q">The right capability in the wrong setting still misses</h1>'+
   L.prose('The book’s example: your software can draw shapes in every colour of the spectrum, and that is exactly what the customer needs. So you show off bright orange, green and purple. Then you learn they only care about subtle skin tones.')+
   L.flow([['check','Right capability','Any colour, any shade','',2],['x','Wrong context','Bright show-off colours','',3],['alert','Result','Customer can’t see their own problem','',4]])+
   L.prose('The fix is simple: ask questions and do some research. The more general your product, the more context matters, because its customers do very different things with it.'));
  L.done();}},
{part:1,src:'Chapter 8 · 1. Execute Research',run(L){
  L.h(L.kick('learn','Direct Research')+'<h1 class="q">Ask the customer, and collect three things</h1>'+
   L.lanes([['chat','Direct Research','Contact the customer and ask. Start with the contact on the Meeting Information Sheet or your '+L.g('champion','Champion')+'. Check with the Salesperson first who you may call, and any politics to watch.',1],
            ['book','Indirect Research','For when the customer can’t or won’t share. Public sources instead. Less targeted, but much better than nothing. More on it later.',2]])+
   L.list([['cycle','The workflow','The order of their work, which your demo can follow.'],
     ['list','Example reports','Real documents show what your Illustration should look like.'],
     ['flask','Specific problems','Real challenges to solve live. Warning: check that each one is actually solvable first.']],3)+
   '<p class="small" style="margin-top:10px">For all three, agree with the customer that you may use their material in the demo. Someone who sent it as background may not expect to see it in front of the whole room.</p>');
  L.done();}},
{part:1,src:'Chapter 8 · 1. Execute Research',run(L){
  L.h(L.kick('ex','Kai maps Fenmore’s workflow')+'<h1 class="q">A whiteboard, a pen, and Sam</h1>');
  L.beats(L.card,[
   ['Check first','Kai asks Jordan who to contact. Jordan: “Sam and Robin are happy to help. Go through Sam before you contact Dana.”'],
   ['Hand over the pen','The book says workflow talks work best face to face at a whiteboard, even better if the customer draws. Kai gives Sam the marker and takes notes.'],
   ['What’s broken, what’s fine','Sam draws the weekly cycle. The bottleneck: four buyers rebuilding lists by hand. Deliveries, on the other hand, run smoothly and shouldn’t change.'],
   ['Words and outputs','Kai notes that Fenmore calls thrown-away stock “shrink”, and that each store manager gets a printed reorder sheet every Monday. Kai asks for a real copy.'],
   ['The vision and the numbers','Sam explains what they want instead, and the numbers behind it: 4 buyers × 3 days today, 1 buyer × 1 day wanted.']],
   'One session gave Kai the order of the demo, Fenmore’s own words, the shape of the Illustration, and the numbers for the value.');}},
{part:1,src:'Chapter 8 · 1. Execute Research',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Robin offers a tough challenge: “Forecast a brand-new product we’ve never sold.” Planner forecasts from sales history. What should Kai do before agreeing?</h1>');
  L.mc(L.card,['Agree at once; customers love live challenges','Check that it can really be solved first','Promise to solve it after the demo instead'],1,
   'The book’s warning: make sure a customer’s problem is solvable before you agree to tackle it in a demo.',
   'Customers do love seeing their problems solved, which is why a failed attempt hurts. Check it’s solvable before agreeing.');}},
{part:1,src:'Chapter 8 · 1. Execute Research',pts:5,run(L){
  L.h(L.kick('pr','Read the whiteboard')+'<h1 class="q">More notes from Kai’s session with Sam. What should Kai do with each?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Fix in the demo','Leave alone','Use as context'],[
   ['Lists are rebuilt by hand every week from last month’s numbers.',0,'A bottleneck the customer wants gone.'],
   ['Supplier price lists already arrive automatically, and nobody complains.',1,'It works today and doesn’t need changing.'],
   ['Everyone at Fenmore calls thrown-away stock “shrink”.',2,'Use the customer’s own words in the demo.'],
   ['Each store manager gets a printed reorder sheet every Monday.',2,'How the output is reported tells you what the Illustration should look like.'],
   ['The weekly delivery schedule works well.',1,'Not every step needs your product. Leave what works.']],
   'A workflow session tells you what to fix, what to leave alone, and the words and reports that make the demo feel like the customer’s own.');}},
{part:1,src:'Chapter 8 · 1. Execute Research',pts:1,
 solve:async L=>{const t=L.$('#tg').children;t[0].click();t[1].click();},
 run(L){
  const V=[
   {n:'Sample data',rows:[['Store 001 · Item A','Order 120',''],['Store 001 · Item B','Order 80',''],['Store 001 · Item C','Order 45','']],foot:'Waste saved: 3.2%'},
   {n:'Fenmore’s context',rows:[['Riverside · Strawberries 400g','Order 60','Shrink risk'],['Riverside · Bananas','Order 140','Running out'],['Riverside · Sourdough loaf','Order 35','']],foot:'Shrink saved this week: $1,480'}];
  const seen=new Set();
  L.h(L.kick('pr','Toggle and compare')+'<h1 class="q">Same report, same capability. Look at both versions Kai could show.</h1><div id="tg"></div>'+
   '<div style="background:var(--soft);border-radius:16px;padding:14px;margin:8px 0 6px;min-height:150px"><div class="small" id="vh" style="margin-bottom:8px">Choose a version above.</div><div id="vr"></div></div><div id="vq"></div>');
  V.forEach((v,j)=>{const b=document.createElement('button');b.className='chip';b.innerHTML=L.ic('eye')+v.n;b.onclick=()=>{[...L.$('#tg').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(j);
    L.$('#vh').innerHTML='<b>Store reorder report</b> · '+v.n;
    L.$('#vr').innerHTML=v.rows.map(r=>'<div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px;padding:6px 0;border-bottom:1px solid var(--line,#ddd);font-size:14.5px"><span>'+r[0]+'</span><span>'+r[1]+(r[2]?' <b style="color:var(--no)">'+r[2]+'</b>':'')+'</span></div>').join('')+'<div class="small" style="margin-top:8px">'+v.foot+'</div>';
    if(seen.size===2&&!L.$('#vq').innerHTML){const q=L.$('#vq');q.innerHTML='<h2 class="sub">Which version will make Sam say “that’s our problem, solved”?</h2>';
      L.mc(q,['The sample data, because it’s neutral','Fenmore’s context, in their own words'],1,
       'Same capability, but now it’s Fenmore’s store, Fenmore’s products, and Fenmore’s word for waste. Context is critical.',
       'Neutral data asks Sam to imagine the link. Fenmore’s stores, products and the word “shrink” make the link for them.');}};L.$('#tg').appendChild(b);});}},

/* ---------- PART 3: VALUE AND TRUST ---------- */
{part:2,src:'Chapter 8 · 1. Execute Research',run(L){
  L.h(L.kick('learn','Put a value on it')+'<h1 class="q">Use the customer’s numbers, not your price</h1>'+
   L.prose('In the workflow talk, ask how long the process takes today and what it must become. The gap gives the value of the Solution, based on <b>their</b> numbers. The book’s worked example:')+
   L.flow([['clock','Today','2 weeks × 4 people = 40 person-days','per cycle',3],['target','Needed','2 days × 2 people = 4 person-days','per cycle',2],['trend','Per year','36 × 20 cycles = 720 person-days','the Delta',1]])+
   L.prose('Then turn it into money: divide by working days a year (often 180 to 200) and multiply by the full yearly cost of one employee. At $100,000 and 200 days, that’s 720 ÷ 200 × $100,000 = <b>$360,000 a year</b>.'));
  L.done();}},
{part:2,src:'Chapter 8 · 1. Execute Research',pts:1,run(L){
  L.h(L.kick('try','Your turn')+'<h1 class="q">Fenmore’s Delta is 11 person-days a week, about 50 weeks a year. A buyer costs $60,000 a year in full, over 200 working days. What is the yearly value?</h1>');
  L.mc(L.card,['$165,000','$132,000','$330,000'],0,
   '11 × 50 = 550 person-days. 550 ÷ 200 = 2.75 buyers’ worth of time. 2.75 × $60,000 = $165,000 a year. (Illustrative numbers.)',
   'Work it in three steps: 11 × 50 = 550 person-days; 550 ÷ 200 = 2.75 people; 2.75 × $60,000 = $165,000.');}},
{part:2,src:'Chapter 8 · 1. Execute Research',pts:1,run(L){
  L.h(L.kick('pr','Set expectations')+'<h1 class="q">Kai suspects Planner could get Fenmore down to half a day, not just one buyer for one day. What should Kai tell Sam?</h1>');
  L.mc(L.card,['“We can get you to half a day, guaranteed.”','“Let’s not talk numbers until after you buy.”','“You’ll reach one buyer, one day. Maybe better, depending on set-up.”'],2,
   'The book suggests erring on the conservative side: commit to what the customer needs, and mention that more may be possible depending on the implementation.',
   'The book advises promising conservatively: commit to the customer’s own goal, and only hint that more may be possible.');}},
{part:2,src:'Chapter 8 · 1. Execute Research',run(L){
  L.h(L.kick('learn','Research builds allies')+'<h1 class="q">People who help prepare the demo want it to succeed</h1>'+
   L.prose('Involving audience members in your research gives them a stake in the result. The more of their data and examples you use, the more they want them to look good. That’s how allies, and a real '+L.g('champion','Champion')+', are made.')+
   L.prose('Use their information wisely and accurately, and protect anything confidential, and you earn their trust. The book credits Hansruedi Kottmann with the name '+L.g('earned-reputation','Earned Reputation')+' for that mix of trust and results.')+
   L.note('<b>Confidentiality can be critical.</b> Whenever a customer gives you data, workflows or reports, decide whether you need a confidentiality agreement or '+L.g('nda','NDA')+'. If in doubt, ask your legal team before you use anything.','shield'));
  L.done();}},
{part:2,src:'Chapter 8 · 1. Execute Research',pts:1,run(L){
  L.h(L.kick('pr','A real decision')+'<h1 class="q">Robin emails a real spreadsheet with Fenmore’s supplier prices. Kai would love to use it in the demo. What first?</h1>');
  L.mc(L.card,['Use it as is; Robin sent it willingly','Agree its use with Robin and check if an NDA is needed','Use it, but blur the numbers on screen'],1,
   'Get Robin’s agreement to show it, and settle whether it’s confidential before it goes in front of the room.',
   'Robin may have sent it only as background, and prices are often confidential. Agree its use and check the confidentiality question first.');}},
{part:2,src:'Chapter 8 · 1. Execute Research',run(L){
  L.h(L.kick('learn','Indirect Research')+'<h1 class="q">When the customer can’t share, look in public</h1>'+
   L.prose('Sometimes a customer can’t give you examples, often for confidentiality reasons. Then you research '+L.g('indirect-research','indirectly')+'. It’s less targeted, but much better than nothing. Sources the book suggests:')+
   L.list([['home','The customer’s website','Often shows their processes and outputs. It’s public, so no confidentiality risk.'],
     ['book','Their papers and publications','Useful for technical buyers. Ask the authors before you use their work; you may win an ally.'],
     ['layers','Patents','Sometimes rich, sometimes not. At least they give names and terms to search for.'],
     ['people','Their competitors, and yours','Rivals often face the same problems. Only borrow from your competitor if your product clearly does it better.']],4));
  L.done();}},
{part:2,src:'Chapter 8 · 1. Execute Research',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Direct or Indirect Research?',['Direct Research','Indirect Research'],[
   ['Kai phones Sam to ask how the reorder lists are built today.',0,'Contacting the customer and asking is Direct Research.'],
   ['Kai reads Fenmore’s website to learn its store formats.',1,'A public source, no contact needed.'],
   ['Robin emails Kai a real reorder spreadsheet.',0,'Example documents straight from the customer.'],
   ['Kai reads a trade-magazine article by Fenmore’s head of produce.',1,'A public publication. Kai should still ask before using it in the demo.'],
   ['Kai studies a rival grocery chain’s public annual report.',1,'The customer’s competition often faces the same problems.']]);}},

/* ---------- PART 4: INFRASTRUCTURE ---------- */
{part:3,src:'Chapter 8 · 2. Coordinate Infrastructure With The Customer',run(L){
  L.h(L.kick('learn','Step 2 · Make sure you can show it')+'<h1 class="q">Check the room before you build the demo</h1>'+
   L.prose('Everyone has watched presenters fight with a projector while the audience grows restless. The book is clear: making sure everything works on the day is <b>your</b> responsibility. One missing piece can waste all your preparation, or even lose the sale.')+
   L.prose('The tool is an '+L.g('infra-checklist','Infrastructure Checklist')+'. It covers:')+
   '<div style="display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px">'+['Laptop and server','Software versions','Network access','Projector','Power and plugs','Lighting','Screens','Sound','Whiteboard','Handouts'].map(x=>'<span class="chip static">'+x+'</span>').join('')+'</div>'+
   L.note('Split it into <b>required</b> and <b>optional</b> items. Do it now, not after the demo is built: if a required item is missing, you have to build the demo around it.','list'));
  L.done();}},
{part:3,src:'Chapter 8 · 2. Coordinate Infrastructure With The Customer',run(L){
  L.h(L.kick('ex','Kai calls Lee in IT')+'<h1 class="q">Fifteen minutes on the phone that save the demo</h1>');
  L.beats(L.card,[
   ['The memory','Kai’s first Fenmore demo lost time to a projector that wouldn’t show Kai’s screen. Not again.'],
   ['Projector','Fenmore’s room has a projector, but its cable won’t fit Kai’s laptop. Kai adds an adapter to the required list, and plans to arrive early to test the customer’s equipment.'],
   ['Network','Lee says the guest network blocks outside connections. Kai’s demo normally runs online, so Kai will build it on a local copy on the laptop instead.'],
   ['Power and whiteboard','The plugs are far from the table: bring an extension cord. There’s a whiteboard for capturing questions, and Kai notes to wipe it clean before leaving.'],
   ['Optional','Printed copies of the reorder report for Dana would be nice to have. They go on the optional list.']],
   'Because Kai checked before building, the network limit changed how the demo is built, instead of breaking it on the day.');}},
{part:3,src:'Chapter 8 · 2. Coordinate Infrastructure With The Customer',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Why does the book put the infrastructure check at step 2, before the demo is built?</h1>');
  L.mc(L.card,['So the demo can be built around anything missing','So the customer can approve the equipment budget','So the SE has less to carry on the day'],0,
   'If a required item won’t be there, you design around it from the start instead of discovering it in the meeting.',
   'The reason is design: if something required is missing, the demo has to be built to work without it. Finding out late leaves no time to adapt.');}},
{part:3,src:'Chapter 8 · 2. Coordinate Infrastructure With The Customer',pts:6,run(L){
  L.h(L.kick('pr','Required or optional?')+'<h1 class="q">Wen drafts the checklist for a demo at another grocery chain. Sort each item.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Required','Optional'],[
   ['A laptop with the right Planner version installed',0,'No software, no demo.'],
   ['An adapter that fits the customer’s projector',0,'If the room can’t show your screen, nothing else matters.'],
   ['A working connection, or a local copy of the demo',0,'The demo must run, one way or the other.'],
   ['Printed copies of the Illustration',1,'A nice handout, but the demo works without it.'],
   ['Pallaro give-aways for the audience',1,'Nice to have, never essential.'],
   ['A laser pointer',1,'Helpful, but you can point without it.']],
   'Get every required item ready and you have one less thing to worry about. Optional items are a bonus.');}},
{part:3,src:'Chapter 8 · 2. Coordinate Infrastructure With The Customer',pts:1,run(L){
  L.h(L.kick('pr','A real decision')+'<h1 class="q">Wen is preparing a demo for another grocery chain. A week out, Wen learns a new screen they planned to show won’t be released in time, and the meeting can’t move. What should Wen do?</h1>');
  L.mc(L.card,['Hope the release arrives the night before','Cancel the meeting and wait for the release','Build the demo around what will be ready'],2,
   'The book’s advice: map the demo to the infrastructure you will actually have. Then tell the Salesperson, to keep the no-surprises rule from lesson 5.',
   'If you can’t reschedule, you build around the gap. Hoping risks failing in front of Fenmore, and cancelling throws away the meeting.');}}
  ]
});
</script>
</body>
</html>
