<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your customer and the Chain of Pain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0003', title:'Your customer and the Chain of Pain', minutes:19, icon:'people',
  goals:['Break any audience member’s needs into CBI, Reason and Specific Capabilities','Link a group’s problems into a Chain of Pain and map your solution upward','Get the facts you need, from your Salesperson or in the room'],
  parts:['Your audience','CBI and Reason','Chain of Pain','Getting the facts'],
  read:'Read chapter 4 of the book for the full Chain of Pain example and the exercises to try with your own customers.',
  glossary:{
    qualification:'Qualification: finding out, before the demo, who the customer is, what they need and why, so you know what to show.',
    'perceived-value':'Perceived value: how much a solution seems to be worth to the customer, which rises when it helps more senior people.'
  },
  cheatsheet:[
    'Each title in the room has its own goals. Put your product aside and <b>start from the customer</b>.',
    '<b>CBI</b> = the big problem a person must solve this quarter or year. <b>Reason</b> = what stops them. <b>Specific Capability</b> = what fixes that Reason.',
    '<b>No pain, no change</b> (Michael Bosworth): someone on track for their goals isn’t looking for help.',
    'Show the Specific Capabilities, not everything. The bleeding cyclist wants <b>bandages and aspirin</b>, not a map.',
    '<b>Chain of Pain</b>: your boss’s Reason is your CBI. Pain flows downhill; gain flows uphill.',
    'Fix a lower person’s Reason, then <b>map the gain upward</b>. The higher the title you help, the higher the perceived value.',
    'Finding CBIs is the Salesperson’s job, but they must <b>tell the SE well before the demo</b>. If nobody did, spend the first minutes asking.',
    'Senior people state CBIs clearly. With junior staff, ask <b>“How are you measured?”</b>'
  ],
  steps:[
/* ---------- PART 1: YOUR AUDIENCE ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Kai has a week to prepare the next Fenmore demo. Where should the preparation start?</h1>');
  L.mc(L.card,['With what each person at Fenmore needs','With a full review of every Planner feature'],0,
   'Kai already knows every feature. What Kai doesn’t yet know is what Dana, Sam and the others need. That’s what this lesson is about.',
   'Kai already knows every feature, and a feature review leads straight back to a tour. Start from what each Fenmore person needs.');}},
{part:0,src:'Chapter 4 · Target Your Audience',run(L){
  L.h(L.kick('learn','Target your audience')+'<h1 class="q">Different titles have different problems</h1>'+
   L.prose('The first fact you need for any demo is <b>who will be in the room</b>. Senior managers, technology leaders, operations staff and IT people each worry about different things, and so does each person within those groups.')+
   L.prose('So for now, the book says, put your own goals and your product’s features to one side. Focus on what the customer wants and needs.')+
   L.prose('You have big objectives you must hit each quarter and each year. So does every customer. The book calls these key objectives '+L.g('cbi','Critical Business Issues')+', or CBIs.')+
   L.note('The more specific a CBI, the more useful it is. “Hit quota” is vague. “Hit my $750,000 quota in the North region this quarter, with today’s products” has an amount, a time and limits.','target'));
  L.done();}},
{part:0,src:'Chapter 4 · Target Your Audience',run(L){
  L.h(L.kick('ex','Who is coming to Fenmore’s meeting room?')+'<h1 class="q">Jordan and Kai list the audience, one person at a time</h1>');
  L.beats(L.card,[
   ['Dana Reyes','VP of Operations. Cares about the year’s results for the whole chain. Very short on time.'],
   ['Sam Achebe','Replenishment manager. Cares about what sits on the shelves each week, and what gets thrown away.'],
   ['Robin Tate','A buyer who builds the reorder spreadsheets every week. Cares about how the daily work gets done.'],
   ['Lee Park','IT lead. Cares about how a new system fits with Fenmore’s other systems, and whether it is safe.'],
   ['The point','Four people, four sets of worries. One demo built around “what Planner can do” would fit none of them well.']],
   'Before deciding what to show, list who will be there and what each of them must achieve.');}},
{part:0,src:'Chapter 4 · Target Your Audience',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Which of these sounds like a CBI for Dana, Fenmore’s VP of Operations?</h1>');
  L.mc(L.card,['Robin’s spreadsheets take too long to open','Operating margin is below target this year','The reorder screen needs better filters'],1,
   'It’s a big objective for the year, the kind of problem that keeps a VP awake. That’s a CBI.',
   'A CBI is a person’s biggest objective for the quarter or year. For a VP that’s a result like operating margin, not a detail of a screen or a spreadsheet.');}},

/* ---------- PART 2: CBI AND REASON ---------- */
{part:1,src:'Chapter 4 · Target Your Audience',run(L){
  L.h(L.kick('learn','From pain to capability')+'<h1 class="q">Three questions, always in this order</h1>'+
   L.prose('The book walks through a Salesperson who is worried about missing quota. To help, you ask three things:')+
   L.flow([['alert','CBI','What big goal is at risk?','“I won’t make quota this quarter.”',4],['info','Reason','What’s causing it?','“Our demos aren’t working.”',3],['check','Specific Capability','What exactly fixes that?','Demo skills for the SEs',2]])+
   L.prose('Notice what is <i>not</i> on the list. This Salesperson already qualifies well and has plenty of prospects, so more prospects or qualifying skills won’t help. Only the '+L.g('specific-capability','Specific Capabilities')+' that fix the '+L.g('reason','Reason')+' matter.'));
  L.done();}},
{part:1,src:'Chapter 4 · Target Your Audience',run(L){
  L.h(L.kick('learn','No pain, no change')+'<h1 class="q">Ask how someone is doing against their goal, and listen</h1>'+
   L.prose('Midway through a quarter, a Salesperson can give you only one of two answers. The book credits Michael Bosworth, author of <i>Solution Selling</i>, with the idea behind them: <b>no pain, no change</b>.')+
   L.lanes([['check','“I’m on track”','No pain. This person doesn’t need your help right now, however good your product is.',2],
            ['alert','“I’m going to miss it”','Real pain. This person is open to looking for solutions, so find out why.',4]])+
   L.prose('Each Reason behind the pain is an opening for a solution. That is why the book calls Reasons so important.'));
  L.done();}},
{part:1,src:'Chapter 4 · Target Your Audience',pts:1,
 solve:async L=>{const c=L.$('#of').children;c[2].click();c[5].click();L.$('#give').click();},
 run(L){
  const O=['Water','A tire patch kit','Bandages','A map','A new chain','Aspirin','Music','A bike bag'];const sel=new Set();
  L.h(L.kick('pr','The book’s bicycle story')+'<h1 class="q">You skid on gravel and fall. Your arms and legs are scraped and bleeding; your bike is fine. A helper offers all of this. Pick only what you need.</h1>'+
   '<div id="of" style="display:flex;flex-wrap:wrap;gap:6px"></div><button class="btn pri" id="give" style="margin-top:14px">'+L.ic('check')+'Take these</button><div id="bf"></div>');
  O.forEach((o,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=o;
    b.onclick=()=>{if(b.disabled)return;if(sel.has(j)){sel.delete(j);b.classList.remove('sel');}else{sel.add(j);b.classList.add('sel');}};L.$('#of').appendChild(b);});
  L.$('#give').onclick=function(){if(!sel.size){L.fb(L.$('#bf'),'Pick at least one thing first.','no');return;}
    this.remove();[...L.$('#of').children].forEach(b=>b.disabled=true);
    const ok=sel.size===2&&sel.has(2)&&sel.has(5);L.award(ok);
    L.sheet(ok?'ok':'no',ok?'Exactly: bandages and aspirin':'Only two things help here',
     'Bandages and aspirin. Every other offer is kind, but you’re bleeding. In the book, each extra offer leaves the rider more irritated, not more grateful. Customers feel the same in a demo that shows everything except the Specific Capabilities they need.');L.done();};}},
{part:1,src:'Chapter 4 · Target Your Audience',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Sam’s Reason: reorder lists are built by hand from last month’s numbers, too slowly to react. Which Planner capability fixes that Reason?</h1>');
  L.mc(L.card,['A dashboard of last year’s sales by region','A weekly reorder report built from forecasts','A screen to customize Planner’s colors'],1,
   'It replaces the slow, hand-built list with one built from up-to-date forecasts. That targets Sam’s Reason directly.',
   'Sam’s problem is slow, hand-built reorder lists. Only a reorder report built from forecasts fixes that. The others may be nice, but they’re the map and the music in the bicycle story.');}},
{part:1,src:'Chapter 4 · Target Your Audience',pts:6,run(L){
  L.h(L.kick('pr','Sort Sam’s needs')+'<h1 class="q">From Sam’s point of view, where does each item belong?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['CBI','Reason','Capability','Not needed'],[
   ['Cut spoilage and empty shelves',0,'This is the big goal Sam must hit: Sam’s CBI.'],
   ['Reorder lists are built by hand from last month’s numbers',1,'This is what stops Sam from cutting spoilage: a Reason.'],
   ['Forecast demand for each item in each store',2,'A thing Planner does that fixes the slow, backward-looking lists.'],
   ['Flag items about to spoil or run out on the weekly report',2,'It turns the forecast into action Sam can take: a Specific Capability.'],
   ['Send approved orders to suppliers without retyping',2,'It removes slow manual work from the reorder process.'],
   ['Planner’s new dashboard color themes',3,'Nice to have, but it fixes none of Sam’s Reasons. Leave it out.']],
   'One CBI, one Reason, three Specific Capabilities. Those three are what the demo must show Sam.');}},
{part:1,src:'Chapter 4 · Target Your Audience',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Tap each piece until the sentence states Sam’s needs in the right order.</h1>');
  L.sentence(L.card,[['Sam must cut spoilage and empty shelves','Sam wants a faster spreadsheet'],['because reorder lists are built by hand','because Planner has a forecast screen'],['so the demo must show the flagged reorder report','so the demo must show every Planner screen']],[0,0,0],
   [['A faster spreadsheet is a guess at a solution, not Sam’s big goal.'],['That’s a feature of Pallaro’s product. The Reason is a problem at Fenmore.'],['Showing everything is the bicycle helper’s mistake. Show what fixes the Reason.']],
   'CBI, then Reason, then Specific Capability. Start from the customer’s pain and end at the exact thing that fixes it.');}},

/* ---------- PART 3: CHAIN OF PAIN ---------- */
{part:2,src:'Chapter 4 · The Chain of Pain',run(L){
  L.h(L.kick('learn','The Chain of Pain')+'<h1 class="q">In a group, one person’s Reason is the next person’s CBI</h1>'+
   L.prose('Most demos are to a group. The book shows that the problems in a group are linked, using a software company as the example:')+
   L.tiers([['trend','CEO','CBI: shareholder value isn’t rising enough. Reason: quarterly revenue is below what analysts expect.'],
     ['people','VP Sales','CBI: revenue targets are being missed. Reason: salespeople are missing quota.'],
     ['person','Salesperson','CBI: missing quota. Reason: demos fail to close the technical sale.'],
     ['pointer','SE','CBI: can’t produce demos that close the sale. Reason: lacks demo skills and knowledge of customer CBIs.']])+
   L.quote('Pain flows downhill; gain flows uphill.','Peter E. Cohan, chapter 4')+
   '<p class="small">It makes sense: your boss sets your goals based on what the boss needs done. So your boss’s Reason is your CBI.</p>');
  L.done();}},
{part:2,src:'Chapter 4 · The Chain of Pain',run(L){
  L.h(L.kick('ex','Fenmore’s Chain of Pain')+'<h1 class="q">Jordan maps the links, from the top down</h1>');
  L.beats(L.card,[
   ['The CEO','Fenmore’s CEO must hit a margin target, and is leaning on Dana to deliver it.'],
   ['Dana','CBI: operating margin is below target this year. Reason: too much fresh food is thrown away, and best-sellers run out.'],
   ['Sam','Dana’s Reason is Sam’s CBI: cut spoilage and empty shelves. Sam’s Reason: reorder lists are built by hand, too slowly to react.'],
   ['The match','Planner has nothing that directly raises a CEO’s margin. But it does fix Sam’s Reason, with forecasts, a flagged reorder report and supplier ordering.'],
   ['Up the chain','Fix Sam’s Reason, and Sam’s CBI is solved. That solves Dana’s Reason, which helps Dana’s CBI, which helps the CEO.']],
   'You rarely solve a senior person’s CBI directly. You solve a problem lower down and show how the gain climbs the chain.');}},
{part:2,src:'Chapter 4 · The Chain of Pain',pts:1,
 solve:async L=>{L.$('#pc').children[2].click();L.$('#fix').click();},
 run(L){
  const R=[['Fenmore’s CEO','Margin target met'],['Dana · VP of Operations','Margin back toward target'],['Sam · replenishment manager','Less spoilage, fewer empty shelves'],['Pallaro Planner','Forecasts, flagged reorder report, supplier orders']];
  const P=['Only Sam','Sam and Dana','Sam, Dana and the CEO'];let p=null;
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">Planner fixes Sam’s Reason. Who gains?</h1><div id="pc" style="display:flex;flex-wrap:wrap;gap:6px"></div>'+
   '<div id="sim" hidden><div class="ladder" id="ld" style="margin-top:12px"></div><button class="btn pri" id="fix">'+L.ic('play')+'Fix Sam’s Reason</button></div>');
  L.$('#ld').innerHTML=R.map((r,j)=>(j?'<div class="conn"></div>':'')+'<div class="rung" id="r'+j+'"><small>'+r[0]+'</small><span id="g'+j+'">'+(j===3?r[1]:'Waiting…')+'</span></div>').join('');
  P.forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=n;b.onclick=()=>{if(p!==null)return;p=j;b.classList.add('sel');L.$('#sim').hidden=false;};L.$('#pc').appendChild(b);});
  L.$('#fix').onclick=function(){this.remove();let k=3;L.$('#r3').classList.add('cur');
    const t=setInterval(()=>{k--;const el=L.$('#r'+k);if(!el){clearInterval(t);return;}el.classList.add('cur');L.$('#g'+k).innerHTML=L.ic('check')+R[k][1];
      if(k<=0){clearInterval(t);L.award(p===2);
        L.sheet(p===2?'ok':'no',p===2?'Gain flows uphill':'The gain keeps climbing',
         'Sam’s solved CBI was Dana’s Reason, and Dana’s CBI feeds the CEO’s. The book adds that the higher the title you can help, the higher the '+L.g('perceived-value','perceived value')+' of your solution.');L.done();}},550);};}},
{part:2,src:'Chapter 4 · The Chain of Pain',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Dana’s Reason is “too much fresh food is thrown away, and best-sellers run out.” In the Chain of Pain, that same problem is…</h1>');
  L.mc(L.card,['The CEO’s CBI','Robin’s Specific Capability','Sam’s CBI'],2,
   'Dana’s Reason becomes the goal Dana sets for Sam. Your boss’s Reason is your CBI.',
   'Pain flows downhill: Dana’s Reason is handed down as the goal of the person who reports to Dana. That’s Sam’s CBI.');}},
{part:2,src:'Chapter 4 · The Chain of Pain',run(L){
  L.h(L.kick('learn','Three steps before you build')+'<h1 class="q">The book’s recipe for knowing exactly what to show</h1>'+
   L.list([['people','Identify','Find the CBIs and Reasons of each person who will be in the audience.'],
     ['layers','Organize','Arrange them into a Chain of Pain, to see how the people and their problems are linked.'],
     ['check','Match','Review your product and pick the Specific Capabilities that fix the Reasons you can address.']],1)+
   L.prose('Only then do you start building the demo. By that point you know exactly which capabilities to show, and which people in the room will care about each one.')+
   L.note('Notice what isn’t a step: reviewing all your product’s features. That comes last, and only to find the matching capabilities.','info'));
  L.done();}},
{part:2,src:'Chapter 4 · The Chain of Pain',pts:1,run(L){
  L.h(L.kick('pr','Put it in order')+'<h1 class="q">Kai is preparing for a different grocery chain. Put the preparation in the book’s order.</h1>');
  L.order(L.card,['Find each attendee’s CBIs and Reasons','Link them into a Chain of Pain','Pick the Planner capabilities that fix those Reasons','Start building the demo'],
   'Customer first, then the links between people, then your product, then the demo itself.');}},
{part:2,src:'Chapter 4 · The Chain of Pain',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Does this follow the Chain of Pain?',['Yes, it fits','No, it breaks it'],[
   ['Kai shows Sam the flagged reorder report, then shows Dana how less waste lifts margin.',0,'Fix the lower Reason, then map the gain up to the senior person.'],
   ['Kai looks for a Planner screen that raises Fenmore’s margin directly, for the CEO.',1,'Your product rarely solves a top CBI directly. Solve a Reason lower down and map the gain upward.'],
   ['Jordan treats Sam’s CBI as unrelated to anything Dana cares about.',1,'Sam’s CBI is Dana’s Reason. They are linked, and that link is the selling point.'],
   ['Jordan expects Dana to value Planner more once Dana sees the margin link.',0,'The higher the title you help, the higher the perceived value.']]);}},

/* ---------- PART 4: GETTING THE FACTS ---------- */
{part:3,src:'Chapter 4 · The Key Is Communication',run(L){
  L.h(L.kick('learn','The key is communication')+'<h1 class="q">“Hey, am I in sales or what?”</h1>'+
   L.prose('An SE may wonder whose job all this is. The book’s answer: finding CBIs and Reasons, and building the Chain of Pain, is part of '+L.g('qualification','qualification')+'. That’s the Salesperson’s job.')+
   L.flow([['person','Salesperson','Uncovers CBIs and Reasons while qualifying','the best ones also name the Specific Capabilities',1],['chat','Hand-over','Tells the SE, well before the demo','',2],['pointer','SE','Builds the demo around them','',3]])+
   L.prose('If that hand-over isn’t happening at your company, the fix is simple: <b>ask your Salespeople for it.</b>')+
   '<p class="small">The book also suggests writing up the CBIs, Reasons and Chain of Pain behind past wins, building a “why did they buy” collection.</p>');
  L.done();}},
{part:3,src:'Chapter 4 · The Key Is Communication',run(L){
  L.h(L.kick('ex','When nobody told you')+'<h1 class="q">Wen is sent to a demo with no briefing at all</h1>');
  L.beats(L.card,[
   ['The call','Late on a Tuesday, Wen is asked to cover a demo for a small bakery chain the next morning. The Salesperson is away. No notes, no CBIs.'],
   ['The worry','Wen thinks: “I’m an SE, not a salesperson. I’m not trained to ask people what they need.” The book expects this worry.'],
   ['The choice','Wen plans to spend the <b>first few minutes</b> of the meeting asking questions instead of clicking.'],
   ['In the room','Wen asks each person about their biggest challenge and what is causing it. The owner says bread waste is eating the profit.'],
   ['The result','Wen skips most of the standard demo and shows the forecast and reorder report for one shop.']],
   'Without the facts, expect to fail. A few minutes of asking greatly raises the odds of success and cuts the risk of an embarrassing failure.');}},
{part:3,src:'Chapter 4 · The Key Is Communication',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Jordan’s old habit: briefing Kai in the car park, five minutes before the meeting. What should Kai ask for instead?</h1>');
  L.mc(L.card,['The CBIs and Reasons from qualification, well before','A longer car-park chat, maybe fifteen minutes','A list of the features Fenmore asked about'],0,
   'The book puts it plainly: the Salesperson should pass on the CBIs and Reasons well before the demo. A great one adds the Specific Capabilities too.',
   'Kai needs time to build the demo around Fenmore’s problems. That means getting the CBIs and Reasons well before the meeting, not a feature wish list on the day.');}},
{part:3,src:'Chapter 4 · The Key Is Communication',run(L){
  L.h(L.kick('learn','Who can tell you their CBI?')+'<h1 class="q">The higher the title, the clearer the answer</h1>'+
   L.prose('The book suggests a test: on a plane, ask the stranger next to you, “What is the biggest challenge you face in your job today?” They pause, take a breath, and out comes their CBI.')+
   L.tiers([['trend','C-level and VPs','Usually state their CBIs short and precise.','Dana'],
     ['people','Directors and managers','Good at summing up their objectives, a bit less precise.','Sam'],
     ['person','Junior staff','May find “What are your CBIs?” hard, even confusing.','Robin']])+
   L.prose('So go higher in the organization for clarity. With junior staff, the book suggests a different question: <b>“How are you measured?”</b> How do you know, at year end, that you deserve a raise?'));
  L.done();}},
{part:3,src:'Chapter 4 · The Key Is Communication',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'What should Kai ask?',['“What’s your biggest challenge?”','“How are you measured?”'],[
   ['Dana has ten minutes before the next meeting.',0,'A VP usually states their CBI crisply when asked directly.'],
   ['Robin looks puzzled when asked about “critical business issues.”',1,'Junior staff often think in daily tasks. Asking how they are judged lifts their view to their real goals.'],
   ['A new store clerk at Fenmore joins the meeting to watch.',1,'For junior staff, ask how they know they’ve had a good year.'],
   ['Fenmore’s CEO drops by for five minutes.',0,'The higher the title, the clearer the answer. Ask straight out.']]);}},
{part:3,src:'Chapter 4 · The Key Is Communication',pts:1,run(L){
  L.h(L.kick('pr','A real decision')+'<h1 class="q">Wen interviews Robin, who only talks about daily tasks: “I build the lists, I chase suppliers.” Wen still can’t see the bigger goal. What’s the best next move?</h1>');
  L.mc(L.card,['Show Robin Planner’s full feature list to spark ideas','Ask about Robin’s yearly goals, then ask Sam too','Assume Robin has no pain and drop Robin from the demo'],1,
   'Asking about yearly goals helps Robin think beyond the daily rush, and Sam, a manager, will state the goal more clearly.',
   'A feature list puts the product before the customer, and giving up on Robin is too early. Ask about yearly goals and how Robin is measured, and go higher, to Sam, for a clearer answer.');}}
  ]
});
</script>
</body>
</html>
