<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Managing time and questions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0008', title:'Managing time and questions', minutes:19, icon:'chat',
  goals:['Sort any question into Great, Good or Stupid, and handle each one','Park questions on a Not Now List without losing the asker','Answer, show, run examples and close Q&amp;A so every question gets closure'],
  parts:['Three kinds','Not Now List','Answering well','Closing'],
  read:'Read chapter 9 of the book for the Oracle-versus-Ingres story and the full support-policy Q&amp;A script.',
  glossary:{
    'great-question':'Great Question: a question about a Specific Capability the customer needs, tied to what you are showing. Answer it right away, briefly.',
    'good-question':'Good Question: a fair question that needs a longer answer or leads off the path. Write it down and answer it later.',
    'stupid-question':'Stupid Question (the book’s label): a question that never should have been asked, from someone showing off, trying to trip you, or confused. Treat it like a Good Question.',
    'demo-roadmap':'Demonstration Roadmap: your Outline, reworded for the audience and kept in view, so people always know where they are in the demo.'
  },
  cheatsheet:[
    '<b>Great Questions</b> (about needed capabilities, on the current topic): answer now, briefly. A plain “yes” is fine. Never lie.',
    'If the answer needs more than about two sentences, it’s a <b>Good Question</b>: write it on the <b>Not Now List</b>.',
    'Not Now List keys: acknowledge sincerely, write it where all can see, ask “Is that OK with you?”, and <b>always</b> answer it later.',
    '<b>Stupid Questions</b>: treat them exactly like Good Questions. For you, there are only Great and Good Questions.',
    'Answer the list in Q&amp;A, after the last Do It Again summary. If agreed with the Salesperson first, let satisfied people leave.',
    'Answer process: <b>restate</b> (and check), <b>answer crisply</b>, <b>summarize</b> question and answer.',
    '“Show me”: if you can, run a mini Great Demo!; if you can’t, say so, then follow up or test how much it matters. Their own example: set expectations first.',
    'Close Q&amp;A by ticking off every list item with a one-line answer. <b>Outline = Agenda = Demonstration Roadmap.</b>'
  ],
  steps:[
/* ---------- PART 1: THREE KINDS ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">You’re guiding a lost tourist to the station. Halfway there, they ask about the history of a church you pass. What works best?</h1>');
  L.mc(L.card,['Give the church’s full history right there','Get them to the station, then chat if they like'],1,
   'The question is fair, but answering in full now risks the train. A demo has the same tension, and this lesson is about handling it.',
   'A long answer now could make them miss the train. A fair question can still wait for the right moment; demos work the same way.');}},
{part:0,src:'Chapter 9 · Handling Questions',run(L){
  L.h(L.kick('learn','Three kinds of question')+'<h1 class="q">Every question in a demo is one of three types</h1>'+
   L.tiers([['star','Great Questions','Answer them right away.','',true,'now'],
     ['clock','Good Questions','Answer them later.',''],
     ['alert','Stupid Questions','Answer them anyway, even though they never should have been asked.','']])+
   L.prose('Handling each kind well matters, but so does something bigger: keeping the demo’s flow from being broken or derailed.')+
   '<p class="small">The book warns: the more technical the audience, the more Good and Stupid Questions you’ll get.</p>');
  L.done();}},
{part:0,src:'Chapter 9 · Great Questions (That Should Be Answered Right Away)',run(L){
  L.h(L.kick('learn','Great Questions')+'<h1 class="q">On topic, about what they need: answer now, and briefly</h1>'+
   L.prose('A '+L.g('great-question','Great Question')+' touches a Specific Capability the customer needs, and relates to what you’re showing. Answering at once supports your point and raises the value they see.')+
   L.list([['pointer','Leads to your next screen?','Say you’re glad they asked, since that’s exactly what comes next. A little praise makes the asker part of your team.'],
     ['check','A plain “yes” or “no” is fine','If it satisfies them, stop talking. Not sure? Ask, “Is that enough, or would you like more?”'],
     ['scale','Over two sentences?','Then it wasn’t a Great Question. It’s a Good Question.'],
     ['shield','Never lie','A lie to win this sale loses you the next ones.']],1));
  L.done();}},
{part:0,src:'Chapter 9 · Great Questions (That Should Be Answered Right Away)',run(L){
  L.h(L.kick('ex','At the Fenmore demo')+'<h1 class="q">Three questions in the first ten minutes</h1>');
  L.beats(L.card,[
   ['Minute 4','Kai shows the Store reorder report. Sam asks: “Can it flag dairy as well as produce?” That’s Kai’s next screen. “Glad you asked, that’s just what I’ll show next.” Sam grins.'],
   ['Minute 6','Dana asks: “Does this work for all 40 stores?” Kai: “Yes.” Dana nods. Kai stops there.'],
   ['Minute 9','Robin asks how the forecast handles a promotion week. Kai starts answering and feels it: one sentence, two, three, and more to say.'],
   ['The catch','Kai realizes it isn’t a Great Question after all. It’s a Good Question, and it needs a different treatment.']],
   'Great Questions get short answers on the spot. When the answer keeps growing, you’re holding a Good Question.');}},
{part:0,src:'Chapter 9 · Great Questions (That Should Be Answered Right Away)',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">During Do It, Sam asks: “So it builds the order list for me every week?” It does. How should Kai answer?</h1>');
  L.mc(L.card,['“Yes,” and continue with the demo','A ten-minute tour of the scheduler','“We’ll cover that in Q&A later”'],0,
   'It’s on topic and about a needed capability. A confident “yes” closes it. If Sam wants more, Sam will say so.',
   'It’s a Great Question: on topic and about what Sam needs. Answer it at once, as briefly as possible, here with a simple “yes.”');}},

/* ---------- PART 2: NOT NOW LIST ---------- */
{part:1,src:'Chapter 9 · Good Questions (That Should Be Answered Later)',run(L){
  L.h(L.kick('learn','Good Questions')+'<h1 class="q">Most questions are good, and they are the biggest risk to your demo</h1>'+
   L.prose('A '+L.g('good-question','Good Question')+' deserves a considered answer. The danger isn’t that it’s hard. It’s what happens once you start answering:')+
   L.list([['Follow-ups','More questions on the same topic pull the demo down a side road, and the rest of the room drifts.'],
     ['Side debates','You reopen an argument the audience has had for months, and others start their own.'],
     ['Boredom','Key people who don’t care about that topic switch off.']],4)+
   L.note('The author once answered “Does it run on Oracle?” in a sentence, and two people in the room started a heated debate over which database to choose. It could have eaten the whole hour.','book'));
  L.done();}},
{part:1,src:'Chapter 9 · The “Not Now” List',run(L){
  L.h(L.kick('learn','The Not Now List')+'<h1 class="q">Write it down where everyone can see, and promise to come back</h1>'+
   L.prose('The answer is a '+L.g('not-now-list','Not Now List')+'. Say something like: “Excellent question. I want to address it, but I’d like to keep to our plan for now. Let me write it here. Is that OK with you?” Four keys make it work:')+
   L.list([['Acknowledge it sincerely','If the asker feels brushed off, it failed. Then answer right away.'],
     ['Write it in public','A whiteboard, flipchart or document, so the asker sees you understood.'],
     ['Ask “Is that OK with you?”','The asker takes part in the decision to wait.'],
     ['Always answer it later','An unanswered question festers and can hurt the sale.']],2));
  L.done();}},
{part:1,src:'Chapter 9 · The “Not Now” List',pts:1,
 solve:async L=>{L.$('#ta').click();L.$('#tb').click();},
 run(L){
  const seen=new Set();
  const V=[['Kai answers now','Lee asks: “How does it connect to our stock system?”',['Kai explains for four minutes.','Lee follows up on security; Robin joins in.','Lee and Robin argue about the old stock system.','At twenty past, Dana leaves before Do It Again.'],'no'],
           ['Kai uses the Not Now List','Lee asks: “How does it connect to our stock system?”',['“Great question. Can I write it here and answer it in Q&amp;A?”','Kai writes it on the whiteboard. Lee: “Sure.”','The demo stays on track.','Dana sees Do It Again before leaving at twenty past.'],'ok']];
  L.h(L.kick('pr','Toggle and compare')+'<h1 class="q">Same Fenmore meeting, same question from Lee. Look at both versions.</h1>'+
   '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="chip" id="ta">'+L.ic('chat')+'Answer now</button><button class="chip" id="tb">'+L.ic('list')+'Not Now List</button></div>'+
   '<div style="background:var(--soft);border-radius:16px;padding:14px;margin:10px 0 6px;min-height:150px" id="vw"><span class="small">Pick a version above.</span></div><div id="vq"></div>');
  const show=(j,b)=>{[L.$('#ta'),L.$('#tb')].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(j);const v=V[j];
    L.$('#vw').innerHTML='<b>'+v[0]+'</b><p class="small" style="margin:6px 0">'+v[1]+'</p>'+v[2].map((t,x)=>'<div style="display:flex;gap:8px;align-items:flex-start;margin:6px 0">'+L.ic(x===3?(v[3]==='ok'?'check':'x'):'arrow')+'<span'+(x===3?' style="color:var(--'+v[3]+');font-weight:600"':'')+'>'+t+'</span></div>').join('');
    if(seen.size===2&&!L.$('#vq').innerHTML){const q=L.$('#vq');q.innerHTML='<h2 class="sub">What made Lee happy to wait?</h2>';
      L.mc(q,['Kai promised to send a brochure afterwards','Kai wrote it down and asked if that was OK'],1,
       'Seeing the question written down, and being asked, let Lee share the decision to wait. Kai still has to answer it in Q&amp;A.',
       'A brochure promise is easy to doubt. Writing it where Lee can see it, and asking “Is that OK?”, is what made Lee agree.');}};
  L.$('#ta').onclick=function(){show(0,this);};L.$('#tb').onclick=function(){show(1,this);};}},
{part:1,src:'Chapter 9 · The “Not Now” List',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Robin asks a long question about promotion weeks. Kai writes it on the list. Robin frowns: “No, I really need to know this now.” What should Kai do?</h1>');
  L.mc(L.card,['Move on, the question is already written down','Answer it now, as briefly as possible','Promise Robin a call with support next week'],1,
   'If the asker feels brushed off, the Not Now List has failed for them. Answer it, then get back on track.',
   'The first key is sincere acknowledgment. When the asker won’t accept waiting, the book says answer the question right away.');}},
{part:1,src:'Chapter 9 · Stupid Questions (That Need To Be Answered…)',run(L){
  L.h(L.kick('learn','Stupid Questions')+'<h1 class="q">A chance to show your professionalism</h1>'+
   L.prose('The book’s '+L.g('stupid-question','Stupid Questions')+' come from two kinds of people: those showing off or trying to trip you up (sometimes openly hostile), and those who really don’t understand.')+
   L.lanes([['x','Don’t','Squirm, argue, or brush them off. Some people enjoy trying to stump the vendor.',4],
            ['check','Do','Treat each one exactly like a Good Question: same respect, same attention. Put it on the Not Now List.',2]])+
   L.prose('The rest of the room respects you for it, and the would-be derailer is satisfied for now. As far as you’re concerned, there are only Great Questions and Good Questions.'));
  L.done();}},
{part:1,src:'Chapter 9 · Handling Questions',pts:6,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Answer now, or Not Now List?',['Answer it now','Not Now List'],[
   ['Kai is on the reorder report. Dana: “Are the red flags the items about to spoil?”',0,'On screen, about a needed capability, and “yes” answers it.'],
   ['Lee: “Which databases do you support, and how is login handled?”',1,'Fair, technical and long. It would pull the demo off its path.'],
   ['A Fenmore analyst, smirking: “Isn’t forecasting just guessing with extra steps?”',1,'An attempt to trip Kai up. Treat it like a Good Question and park it respectfully.'],
   ['During Do It, Sam asks: “Can I change the forecast to six weeks?” That’s Kai’s next click.',0,'It leads straight to the next screen. Answer, and thank Sam for the cue.'],
   ['Robin: “Walk me through how the model weighs last year’s holiday sales.”',1,'Needs far more than two sentences. That makes it a Good Question.'],
   ['Lee: “What’s your plan for the next five years of releases?”',1,'Off the current topic and open-ended. List it and answer later.']]);}},

/* ---------- PART 3: ANSWERING WELL ---------- */
{part:2,src:'Chapter 9 · Addressing The Not Now List',run(L){
  L.h(L.kick('learn','When to answer the list')+'<h1 class="q">In Q&amp;A, after the last Do It Again summary</h1>'+
   L.flow([['star','Illustration','+ summary'],['play','Do It','+ summary'],['cycle','Do It Again','+ summary'],['list','Q&amp;A','answer the list',4]])+
   L.prose('If the demo is the last item on the agenda, you can offer a choice: those who want answers stay; those already convinced can get back to work.')+
   L.prose('That leaves the people most interested, and often the would-be derailers leave. You still owe them answers. It also gives the Salesperson a chance to talk with key people.')+
   L.note('<b>No surprises:</b> agree the stay-or-leave move with the Selling Team, especially the Salesperson, when planning the agenda.','alert'));
  L.done();}},
{part:2,src:'Chapter 9 · Answering Questions – The Process',run(L){
  L.h(L.kick('learn','How to answer')+'<h1 class="q">Three steps for every answer</h1>'+
   L.flow([['chat','1 · Restate','“If I understand, you want to know… Is that right?”','',1],['check','2 · Answer','Crisply, but enough','',2],['list','3 · Summarize','The question and the answer, in a line','',3]])+
   L.prose('Restating finds the person who asked, so you can answer them directly, one to one. It also checks you understood. The longer and more complex the answer, the more the summary matters.'));
  L.done();}},
{part:2,src:'Chapter 9 · Answering Questions – The Process',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">Kai answers Lee’s question from the list</h1>');
  L.beats(L.card,[
   ['On the list','“How does it connect to our stock system?”'],
   ['Restate','Kai turns to Lee: “If I understand, you want to know how stock levels get into Pallaro Planner, and how often. Is that right?”'],
   ['Lee adds','“Yes. Mostly I worry about stores whose stock counts come in late.”'],
   ['Answer','Kai explains, in a few sentences, how the stock data comes in and what happens when one store is late.'],
   ['Summarize','“So stock data comes in automatically, and a late store is flagged rather than guessed. I can send the technical details.” Lee: “That covers it.”']],
   'Restate and check, answer crisply, then sum up both. Restating also surfaced Lee’s real worry: late stores.');}},
{part:2,src:'Chapter 9 · Answering Questions – The Process',pts:1,run(L){
  L.h(L.kick('try','Put it in order')+'<h1 class="q">Wen answers a Not Now List question for the first time. Tap the moves in order.</h1><div id="od"></div>');
  L.order(L.$('#od'),['Read the question back, in their words','Ask, “Is that right?”','Give a crisp answer','Sum up the question and answer','Tick it off on the list'],
   'Restate and check, answer, summarize, then mark it done so everyone sees it’s closed.');}},
{part:2,src:'Chapter 9 · Can You Show Me?',run(L){
  L.h(L.kick('learn','“Can you show me?”')+'<h1 class="q">A fair request, since a demo is meant to prove things</h1>'+
   L.lanes([['check','You can','Run a <b>mini Great Demo!</b>: Illustration, Do It, Do It Again, each with a summary, then Q&amp;A and summary. One or two minutes. Check at each step; the Illustration alone may settle it.',2],
            ['x','You can’t','<b>It exists, but not here:</b> say so. Try a brochure or whiteboard; if they need it live, set up a follow-up.<br><b>It doesn’t exist:</b> say so. Offer an alternative, or test how much it matters.',4]])+
   L.prose('If it’s only nice to have, offer to pass it to your developers. If it’s needed to close the sale, tell the Salesperson, and capture exactly how the customer would use it.'));
  L.done();}},
{part:2,src:'Chapter 9 · Can You Show Me?',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'What should Kai do?',['Run a mini demo','Say so, then follow up','Say so, test how needed'],[
   ['Sam: “Can you show me how it handles a holiday week?” Kai has that ready.',0,'Kai can show it, so run a short Illustration, Do It, Do It Again.'],
   ['Lee: “Show me orders actually reaching a supplier.” It works, but not on this laptop.',1,'The capability exists but can’t be shown now. Say so, describe it, and book a follow-up if they need to see it live.'],
   ['Robin: “Can it also schedule our delivery trucks?” Pallaro Planner can’t.',2,'Say so plainly, then find out if it’s nice to have or truly needed.'],
   ['Dana: “Show me all 40 stores in one view.” The roll-up is in Kai’s build.',0,'Kai can show it, so a one-minute mini Great Demo! closes it.']]);}},
{part:2,src:'Chapter 9 · Can You Run My Example?',run(L){
  L.h(L.kick('learn','“Can you run my example?”')+'<h1 class="q">A terrific chance, if you set expectations first</h1>'+
   L.prose('In Q&amp;A, running a customer’s own real problem can be very powerful, if it’s appropriate and you’re confident the result will be positive. People love leaving a demo with something they can actually use.')+
   L.prose('But their example is unrehearsed. You might get no results, the wrong results, a bug, even a crash. So <b>start expectations at zero</b> and say what might happen, so everyone is ready.')+
   L.note('No results can still be a win: it may mean something truly new, a search they no longer need to repeat, and a negative answer found much faster than before.','bulb'));
  L.done();}},
{part:2,src:'Chapter 9 · Can You Run My Example?',pts:1,run(L){
  L.h(L.kick('pr','What should Kai do?')+'<h1 class="q">In Q&amp;A, Robin pulls out a USB stick: “Can you run Store 7’s real sales from last month?” What’s Kai’s best move?</h1>');
  L.mc(L.card,['Decline, since unrehearsed data is too risky','Run it at once and promise great results','Run it, after saying what could go wrong'],2,
   'Setting expectations first means a gap or a bug won’t shock anyone, and a good result makes Robin a strong supporter.',
   'The book calls this a terrific opportunity, so don’t decline. But promising great results on unrehearsed data is risky: set expectations at zero first, then run it.');}},

/* ---------- PART 4: CLOSING ---------- */
{part:3,src:'Chapter 9 · Closing Q & A',run(L){
  L.h(L.kick('learn','Closing Q&amp;A')+'<h1 class="q">Close it like every other section: with a summary</h1>'+
   L.list([['chat','Any other questions?','When the list is done, ask. If several come up, queue them on the list too.'],
     ['check','Review the list','Each question, with a one-line answer. Put a tick next to each as you go. Make sure none is left open.'],
     ['flame','Call out what matters','Requests for new capabilities, the follow-ups you promised, and any live example that worked.'],
     ['people','Thank them','Thank people for staying, and make sure they can contact you.']],3));
  L.done();}},
{part:3,src:'Chapter 9 · Closing Q & A',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Tap each piece until it’s a good closing line for Fenmore’s Q&amp;A.</h1>');
  L.sentence(L.card,[['Lee had some IT questions earlier,','Lee, you asked how stock data comes in;'],
     ['we said it’s automatic, with late stores flagged.','we talked about that for a while.'],
     ['Let me show you a few more features,','I promised Lee our technical details,'],
     ['and Robin’s Store 7 data ran live.','and that’s about all, I think.']],[1,0,1,0],
   [['Too vague. Name the question so Lee knows it was heard and closed.'],['That doesn’t restate the answer. Give it in one line.'],['Q&amp;A isn’t the time to add features. Call out promised follow-ups instead.'],['A weak ending. Call attention to the live example that worked.']],
   'Each question restated with a one-line answer, the promised follow-up named, and the live success called out.');}},
{part:3,src:'Chapter 9 · Demonstration Roadmaps',run(L){
  L.h(L.kick('learn','Demonstration Roadmaps')+'<h1 class="q">Your Outline, turned toward the audience</h1>'+
   L.prose('With several Solutions, people can get lost. A '+L.g('demo-roadmap','Demonstration Roadmap')+' is an expanded agenda that keeps them on track. You write the Outline for yourself; the Roadmap is the same thing, written for them.')+
   L.quote('Outline = Agenda = Demonstration Roadmap.','Peter Cohan, Great Demo!')+
   L.list([['Reword it','Make each line clear and customer-oriented: “Overview of both Solutions”, “Solution 1: Illustration”…'],
     ['Keep it handy','A slide you can flip back to, or leave in view. Test that switching doesn’t break the demo.'],
     ['Mark progress','Tick each finished section and dim past ones. Use it again for the summaries.']],2));
  L.done();}},
{part:3,src:'Chapter 9 · Demonstration Roadmaps',pts:1,run(L){
  L.h(L.kick('pr','What should Kai do?')+'<h1 class="q">Kai’s next Fenmore demo has two Solutions. At rehearsal Jordan, playing Dana, says, “I lost track of where we were.” What’s the best fix?</h1>');
  L.mc(L.card,['A Roadmap slide, ticked off section by section','A longer Introduction listing every click','Hand out printed notes at the end'],0,
   'The Roadmap is the Outline in the audience’s words. Flip back to it and tick each finished section, so people always know where they are.',
   'Listing clicks or handing out notes later doesn’t help someone lost mid-demo. A Roadmap slide, ticked as each section finishes, keeps the room oriented.');}},
{part:3,src:'Chapter 9 · Managing Time and Questions',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Mixed review: Kai’s next move',['Answer it now','Write it on the list','Restate it first','Offer stay or leave'],[
   ['Q&amp;A begins. First on the list: Lee’s question about logins.',2,'Every answer starts by restating the question and checking it’s right.'],
   ['During the Illustration, Dana asks: “Same report for every store?” It is.',0,'On topic, about a needed capability, one word answers it.'],
   ['A visitor asks, with a smirk, whether Pallaro will still exist next year.',1,'Treat it like a Good Question: respectfully parked for Q&amp;A.'],
   ['The last summary is done, the demo ends the agenda, and Jordan agreed to the plan.',3,'Satisfied people can leave; the interested stay for the list.'],
   ['During Do It, Robin starts a long question about pricing rules.',1,'Long and off the current path: a Good Question for the list.']]);}}
  ]
});
</script>
</body>
</html>
