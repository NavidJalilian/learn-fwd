<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sales preparation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0005', title:'Sales preparation', minutes:19, icon:'list',
  goals:['List the Salesperson’s seven jobs before any demo','Measure the Delta and choose the right demo objective','Hand the SE everything they need, with no surprises'],
  parts:['Seven jobs','Map the customer','Pick the objective','Hand it over'],
  read:'Read chapter 7 of the book for the full example organization, its CBIs and the sample information sheets.',
  glossary:{
    qualification:'Qualification: finding out, before the demo, who the customer is, what they need and why, so you know what to show.',
    'org-chart':'Organization chart: a drawing of who works for whom at the customer, used to map the audience and their links.',
    'workflow-map':'Workflow map: a step-by-step drawing of how the customer does the job today, who does each step and how long it takes.',
    'meeting-info-sheet':'Meeting Information Sheet: one page with the meeting’s place, date, start and end times, objective, who does what and when, and the customer contact.',
    'demo-info-sheet':'Demonstration Information Sheet: the Salesperson’s handover to the SE: org chart and Chain of Pain, meeting objective, each person’s CBIs, Reasons and Specific Capabilities, plus the Meeting Information Sheet.'
  },
  cheatsheet:[
    'The Salesperson owns qualification and has <b>seven jobs</b>: audience, CBIs/Reasons/Specific Capabilities, Chain of Pain, objective, agenda and roles, <b>tell the SE</b>, agree what to show.',
    'Job 6, passing it all to the SE <b>well before</b> the demo, is the one that most often fails (“in the car park”).',
    'Map the audience on an <b>org chart</b>, including people who won’t attend but matter to the decision.',
    'Ask the customer to <b>map their workflow</b>: it reveals people, CBIs, Reasons and the links between them.',
    'The <b>Delta</b> = today vs with your Solution, in time, people or money. It always comes down to <b>cheaper, better, faster, or couldn’t be done before</b>.',
    'End qualification by asking: “Is there anything I should be asking that I haven’t yet asked?”',
    'Three objectives: <b>Technical Proof</b>, <b>Vision Generation</b>, <b>Information</b> (avoid). Show only what’s needed.',
    'Put it on paper: a <b>Meeting Information Sheet</b> and a <b>Demonstration Information Sheet</b>. Then agree with the SE what can be shown: no surprises.'
  ],
  steps:[
/* ---------- PART 1: SEVEN JOBS ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Jordan knows a lot about Fenmore: who decides, what hurts, what they need. Jordan tells Kai all of it in the car park, five minutes before the meeting. What’s the problem?</h1>');
  L.mc(L.card,['The car park is a poor place to talk about clients','Kai has no time left to build the demo around it'],1,
   'Right. Good information that arrives five minutes early can’t shape the demo. This lesson is about the Salesperson’s side of preparation.',
   'Where they talk matters less than when. Five minutes is too late for Kai to change anything in the demo. This lesson is about fixing that.');}},
{part:0,src:'Chapter 7 · The Role Of The Salesperson',run(L){
  L.h(L.kick('learn','The Salesperson’s seven jobs')+'<h1 class="q">Before a Great Demo!, the Salesperson has a checklist</h1>'+
   L.prose('The book puts the final responsibility for '+L.g('qualification','qualifying')+' the customer on the Salesperson. To prepare a Great Demo!, the Salesperson must:')+
   L.list([['Identify the audience','Everyone expected in the room, their titles and how they relate.'],
     ['Find each person’s needs','Their '+L.g('cbi','CBIs')+', '+L.g('reason','Reasons')+' and the '+L.g('specific-capability','Specific Capabilities')+' that fix them.'],
     ['Draw the Chain of Pain','How those problems link the people together.'],
     ['Set the demo objective','What this meeting has to achieve.'],
     ['Set the agenda and roles','Start and end times, and who does the intro, demo and summary.'],
     ['Tell the SE and the Selling Team','All of the above, explained.'],
     ['Agree what will be shown','Settle with the SE which Specific Capabilities the demo will prove.']],1));
  L.done();}},
{part:0,src:'Chapter 7 · The Role Of The Salesperson',run(L){
  L.h(L.kick('ex','The car-park briefing')+'<h1 class="q">Why job 6 is the one that matters most</h1>');
  L.beats(L.card,[
   ['The book’s question','When do SEs usually get the account details for a demo? The book says the answer it hears most is: in the car, in the car park, at the customer’s site.'],
   ['At Pallaro','That was Jordan’s habit. Before the first Fenmore demo, Jordan knew Dana was short on time and Sam needed a reorder report. Kai heard it on the walk to reception.'],
   ['The effect','With no time to change the demo, Kai ran the usual feature tour. Everything Jordan had learned was wasted.'],
   ['The book’s point','Finding the CBIs, Reasons and Specific Capabilities is no help if the SE never hears them in time. Passing them on is crucial.']],
   'Jobs 1 to 5 are only worth something once job 6 happens: the SE must get the information early enough to use it.');}},
{part:0,src:'Chapter 7 · The Role Of The Salesperson',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Jordan has done jobs 1 to 5 for the next Fenmore demo. It’s a week before the meeting. What should Jordan do next?</h1>');
  L.mc(L.card,['Ask Kai to qualify Fenmore again from scratch','Wait and tell Kai on the morning of the demo','Send it all to Kai now and talk it through'],2,
   'That’s job 6. A week gives Kai time to build the demo around what Fenmore needs, and then they can agree what to show (job 7).',
   'Jordan already has the information. Job 6 is passing it to Kai early, and explaining it, so Kai has time to use it.');}},
{part:0,src:'Chapter 7 · The Role Of The Salesperson',pts:1,run(L){
  L.h(L.kick('pr','Put it in order')+'<h1 class="q">Wen is shadowing Jordan. Put the Salesperson’s seven jobs in the book’s order.</h1>');
  L.order(L.card,['Identify the audience','Find CBIs, Reasons, Specific Capabilities','Draw the Chain of Pain','Set the demo objective','Set the agenda and roles','Tell the SE and Selling Team','Agree what will be shown'],
   'Who, what they need, how they connect, what the meeting is for, how it will run. Then hand it all over, and agree what the demo will prove.');}},

/* ---------- PART 2: MAP THE CUSTOMER ---------- */
{part:1,src:'Chapter 7 · 1. Identify Each Member of the Audience',run(L){
  L.h(L.kick('learn','Job 1 · Who’s who')+'<h1 class="q">Know the people, and how they connect</h1>'+
   L.prose('Listing names is the easy part. The book says the real key is understanding the <b>relationships</b> between the people. Most Salespeople already draw an '+L.g('org-chart','organization chart')+'. The point is to share it with the SE and talk it through.')+
   L.tiers([['person','Fenmore CEO','Must hit a margin target this year.','Won’t attend, but the deal matters to them',false,'Not in the room'],
            ['trend','Dana Reyes · VP of Operations','The senior decision-maker. Short on time.','Attends the first 20 minutes',true,'Decides'],
            ['people','Sam Achebe · Replenishment manager','Pallaro’s Champion. Owns the reorder process.','Attends'],
            ['list','Robin Tate · Buyer','Builds the reorder spreadsheets every week.','Attends']])+
   '<p class="small" style="margin-top:10px">The book also suggests adding people who won’t be at the demo but matter to the decision or the roll-out, like Fenmore’s CEO here.</p>');
  L.done();}},
{part:1,src:'Chapter 7 · 2. Identify Each Person’s CBI’s, Reasons, and Specific Capabilities',run(L){
  L.h(L.kick('learn','Job 2 · Who finds the needs?')+'<h1 class="q">One person or two, and a powerful way to ask</h1>'+
   L.lanes([['person','Salesperson alone','Works if the Salesperson knows the product well enough. It’s the cheapest way: only one person’s time.',1],
            ['people','As a team','More common. The Salesperson asks about people, CBIs and Reasons. The SE helps turn Reasons into Specific Capabilities.',2]])+
   L.prose('A very effective method: ask the customer to draw a '+L.g('workflow-map','map of their workflow')+'. Walking through it, you can ask about each person, their role, and their CBIs, Reasons and Specific Capabilities.')+
   L.note('A workflow map also shows how the people <b>depend on each other</b>. That is the raw material of the '+L.g('chain-of-pain','Chain of Pain')+', and it makes your Solution look more valuable.','map'));
  L.done();}},
{part:1,src:'Chapter 7 · 2. Identify Each Person’s CBI’s, Reasons, and Specific Capabilities',run(L){
  L.h(L.kick('ex','Finding the Delta with Sam')+'<h1 class="q">Two questions turn a complaint into a number</h1>');
  L.beats(L.card,[
   ['Ask about today','Jordan: “How long does building the weekly reorder lists take today?” Sam: “Four buyers, three days every week.”'],
   ['Ask about the goal','Jordan: “What would you like it to be?” Sam: “One buyer, one day. That’s what we need to hit our targets this year.”'],
   ['Do the sum','Today: 4 people × 3 days = <b>12 person-days</b>. Goal: 1 × 1 = <b>1 person-day</b>. The '+L.g('delta','Delta')+' is <b>11 person-days a week</b>.'],
   ['Go one step further','Later, Jordan can ask about the indirect value: what could the buyers do with those 11 days, and who else in Fenmore gains when the lists come out faster?']],
   'The Delta is the gap between how the customer works today and how they could work with your Solution. Now Jordan knows both what Fenmore needs and what it’s worth.');}},
{part:1,src:'Chapter 7 · 2. Identify Each Person’s CBI’s, Reasons, and Specific Capabilities',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Sam mentions another chore: 3 store managers spend 2 days a week marking down ageing produce. Sam wants it done by 1 person in 1 day. What’s the Delta?</h1>');
  L.mc(L.card,['4 person-days a week','5 person-days a week','2 person-days a week'],1,
   'Today: 3 × 2 = 6 person-days. Goal: 1 × 1 = 1. The gap is 5 person-days a week.',
   'Multiply people by days for both: 3 × 2 = 6 today, 1 × 1 = 1 wanted. The Delta is 6 − 1 = 5 person-days a week.');}},
{part:1,src:'Chapter 7 · 2. Identify Each Person’s CBI’s, Reasons, and Specific Capabilities',run(L){
  L.h(L.kick('learn','Four kinds of Delta')+'<h1 class="q">Every Delta comes down to one of four things</h1>'+
   L.prose('A Delta can be counted in time, people, steps, money, or anything else the customer measures. But the book boils every Delta down to four measures:')+
   L.list([['scale','Cheaper','It costs less: fewer people, less overtime, less waste paid for.'],
     ['star','Better','The result is of higher quality: fewer mistakes, fuller shelves.'],
     ['clock','Faster','The same job takes less time.'],
     ['bulb','Couldn’t be done before','Something that was impossible today becomes possible.']],2)+
   '<p class="small" style="margin-top:10px">Work out which of these your Solution delivers, and put a number on it.</p>');
  L.done();}},
{part:1,src:'Chapter 7 · 2. Identify Each Person’s CBI’s, Reasons, and Specific Capabilities',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which kind of Delta?',['Cheaper','Better','Faster','Couldn’t be done before'],[
   ['Reorder lists ready in 1 day instead of 3.',2,'Same job, less time: faster.'],
   ['Fenmore spends $40,000 less a year on buyers’ overtime.',0,'Less money spent: cheaper.'],
   ['Best-sellers run out far less often, so shelves stay full.',1,'The result itself improves: better.'],
   ['A forecast for every item in every store, which Fenmore can’t produce at all today.',3,'It isn’t faster or cheaper than today, because today it doesn’t exist.'],
   ['Two buyers can move to supplier talks instead of spreadsheets.',0,'Fewer people needed for the same job: cheaper.']]);}},
{part:1,src:'Chapter 7 · 2. Identify Each Person’s CBI’s, Reasons, and Specific Capabilities',pts:1,
 solve:async L=>{L.$('#cq').children[1].click();L.$('#play').click();},
 run(L){
  let p=null;const Q=['So, are we all set for the demo?','Is there anything I should be asking that I haven’t yet asked?','Shall I send you our product brochure?'];
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">Jordan’s call with Sam is ending. Which closing question is most likely to uncover something Jordan missed?</h1><div id="cq"></div>'+
   '<div id="ans" hidden><button class="btn pri" id="play" style="margin-top:12px">'+L.ic('play')+'Play the end of the call</button><div class="res" id="rr"></div></div>');
  Q.forEach((q,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=q;b.onclick=()=>{if(p!==null)return;p=j;b.classList.add('sel');L.$('#ans').hidden=false;};L.$('#cq').appendChild(b);});
  L.$('#play').onclick=function(){this.remove();
    L.$('#rr').innerHTML='<p class="prose"><b>Jordan</b> asks it. <b>Sam</b> pauses for a long moment: “Actually, yes. Our CFO signs off on all new software, and they’ll want the savings in money, not hours. Nobody has spoken to them.”</p>';
    L.award(p===1);
    L.sheet(p===1?'ok':'no',p===1?'You called it!':'The open question wins',
     L.quote('Is there anything I should be asking that I haven’t yet asked?','Peter E. Cohan, chapter 7')+
     'The book recommends this question at the end of a qualification talk. It makes the customer stop and think, and they often bring up something important that both sides missed. Here: a decision-maker who wasn’t on Jordan’s chart, and a Delta that needs to be in money.');
    L.done();};}},

/* ---------- PART 3: PICK THE OBJECTIVE ---------- */
{part:2,src:'Chapter 7 · 3. Identify the Chain Of Pain',run(L){
  L.h(L.kick('learn','Job 3 · The Chain of Pain')+'<h1 class="q">Put a value on the Solution for each person in the chain</h1>'+
   L.prose('Once each person’s CBIs and Reasons are on the org chart, the Chain of Pain shows how one problem runs through several people. The book suggests using the Delta to price the Solution <b>for each person</b>.')+
   L.flow([['person','CEO','Margin target met','',3],['trend','Dana','Less food thrown away','',2],['people','Sam','Lists in time to react','',1],['list','Robin','Spreadsheet days back','',4]])+
   L.prose('The book’s own example: if a developer spends six months on the wrong features because needs were badly passed on, and a developer costs $250,000 a year, that’s $125,000 wasted, plus the misery of building features nobody uses.'));
  L.done();}},
{part:2,src:'Chapter 7 · 4. Determine The Objective Of The Demonstration',run(L){
  L.h(L.kick('learn','Job 4 · What is this demo for?')+'<h1 class="q">Three possible objectives, and one to avoid</h1>'+
   L.tiers([['check','Technical Proof','The customer is qualified, the budget and timing are right, and you’ve said your product can do the job. Now prove the agreed Specific Capabilities.','Closes the technical sale',true,'Most common'],
            ['eye','Vision Generation','Help the customer picture how your product could solve their CBIs. Usually earlier, less detailed, and often for a different set of people.','Often comes before Technical Proof'],
            ['alert','Information','A “just show me” demo for someone you haven’t qualified: a trade-show visitor, a web request. You don’t know their needs, so you risk showing things they don’t value.','Avoid if you can']])+
   L.note('For Technical Proof, the book’s rule: show only what is specifically needed. However cool the other features are, hold them back.','lock'));
  L.done();}},
{part:2,src:'Chapter 7 · 4. Determine The Objective Of The Demonstration',run(L){
  L.h(L.kick('ex','Three Pallaro meetings')+'<h1 class="q">Same product, three different objectives</h1>');
  L.beats(L.card,[
   ['Fenmore','Qualified. Dana has budget, the timing is right, and Jordan has told Fenmore that Planner can do all three things they need. Fenmore now wants proof. <b>'+L.g('technical-proof','Technical Proof')+'.</b>'],
   ['Ostrova Pharmacies','A pharmacy chain at an early stage. They know they have a stock problem but can’t yet picture what fixing it would look like. <b>'+L.g('vision-generation','Vision Generation')+'.</b>'],
   ['A web request','Someone fills in “show me a demo” on Pallaro’s website. Nobody knows who they are or what they need. That would be an <b>Information</b> demo, so the better move is to qualify them first.']],
   'Know your objective before you build anything. If it turns out to be “Information”, invest in qualifying the customer instead.');}},
{part:2,src:'Chapter 7 · 4. Determine The Objective Of The Demonstration',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">What should Jordan write as the objective for the next Fenmore demo?</h1>');
  L.mc(L.card,['Vision Generation','Technical Proof','Information'],1,
   'Fenmore is qualified and has been told what Planner can do. The demo must prove the three agreed Specific Capabilities.',
   'Fenmore already knows what it needs and has been told Planner can do it. What’s missing is proof: Technical Proof.');}},
{part:2,src:'Chapter 7 · 4. Determine The Objective Of The Demonstration',pts:5,run(L){
  L.h(L.kick('pr','Name the objective')+'<h1 class="q">Sort each upcoming Pallaro meeting by its objective.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Technical Proof','Vision Generation','Information'],[
   ['A chain that has agreed its needs and budget asks to see the three capabilities working.',0,'Qualified, needs agreed, proof wanted.'],
   ['Ostrova’s head of stores wants to imagine what a fix could look like before asking for budget.',1,'They are still forming a picture of the Solution.'],
   ['A visitor at a trade booth says, “Just show me what it does.”',2,'Nobody knows their needs, so this is the risky kind.'],
   ['Ostrova’s team says they are short of stock but unsure software could help.',1,'Helping them picture how it could help is Vision Generation.'],
   ['Fenmore’s IT lead must confirm that the agreed capabilities work before sign-off.',0,'It proves agreed Specific Capabilities to close the technical sale.']],
   'Technical Proof proves what was agreed. Vision Generation helps a customer picture a Solution. Information demos happen without qualifying anyone, so avoid them where you can.');}},
{part:2,src:'Chapter 7 · 4. Determine The Objective Of The Demonstration',pts:1,run(L){
  L.h(L.kick('pr','A real decision')+'<h1 class="q">Malik from product marketing asks Kai to add the shiny new promotions planner to the Fenmore demo. Fenmore never asked for it. What should Kai do?</h1>');
  L.mc(L.card,['Open with it, so Fenmore sees the newest work first','Show it at the end if there’s spare time','Hold it back and show only the agreed capabilities'],2,
   'This is Technical Proof. The book says show only what is specifically needed and hold back everything else, however cool.',
   'Fenmore’s demo is Technical Proof. Extra features, at the start or the end, take time and attention from the proof. Hold them back.');}},

/* ---------- PART 4: HAND IT OVER ---------- */
{part:3,src:'Chapter 7 · 5. Define The Meeting Agenda And Roles',run(L){
  L.h(L.kick('learn','Job 5 · The meeting on one page')+'<h1 class="q">Agree the agenda with the customer, then write it down</h1>'+
   L.prose('The Salesperson sets the agenda with the customer and decides who on the Selling Team does what. The book puts it on a '+L.g('meeting-info-sheet','Meeting Information Sheet')+'. Jordan’s for Fenmore:')+
   '<div style="background:var(--soft);border-radius:16px;padding:14px 16px;margin:6px 0 10px;font-size:14.5px;line-height:1.55">'+
   '<b>Where:</b> Fenmore head office, main meeting room<br><b>When:</b> Tuesday, 10:00 to 11:00<br><b>Objective:</b> Technical Proof of the three agreed capabilities<br>'+
   '<b>Roles and timing:</b><br>10:00 Welcome · Dana<br>10:03 Review of goals and needs · Jordan<br>10:08 Demo · Kai<br>10:40 Questions · Kai<br>10:50 Summary · Kai<br>10:55 Next steps · Jordan<br>'+
   '<b>Customer contact:</b> Sam Achebe, with phone and email<br><b>Other notes:</b> meet Sam at reception at 9:45</div>'+
   '<p class="small">The book stresses being consistent: the same sheet is agreed with the customer and inside the Selling Team.</p>');
  L.done();}},
{part:3,src:'Chapter 7 · 6. Communicate Information To Full Selling Team',run(L){
  L.h(L.kick('learn','Jobs 6 and 7 · Hand over, then agree')+'<h1 class="q">The SE gets four things, in good time</h1>'+
   L.prose('The Salesperson may have done jobs 1 to 5 alone. Next, they pass it all to the SE, early enough to prepare, using a '+L.g('demo-info-sheet','Demonstration Information Sheet')+':')+
   L.list([['map','Org chart and Chain(s) of Pain',''],['target','The meeting objective',''],['people','Each key person’s CBIs, Reasons and Specific Capabilities',''],['cal','The agenda and roles','The Meeting Information Sheet, attached.']],1)+
   L.note('<b>Then job 7: no surprises.</b> Some capabilities may not be showable: the product changed, a feature is still in early testing, or a bug gets in the way. The Salesperson and SE agree what will and won’t be shown, and the Salesperson uses that to plan the introduction and summary.','shield'));
  L.done();}},
{part:3,src:'Chapter 7 · 5. Define The Meeting Agenda And Roles',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Who should set the agenda and roles for the Fenmore meeting?</h1>');
  L.mc(L.card,['Kai, since Kai is giving the demo','Jordan, agreeing it with Fenmore','Dana, as the most senior person'],1,
   'It’s the Salesperson’s job, agreed with the customer and then shared inside the Selling Team.',
   'The book gives this job to the Salesperson, who agrees it with the customer. Kai gets it on the Meeting Information Sheet.');}},
{part:3,src:'Chapter 7 · 6. Communicate Information To Full Selling Team',pts:5,run(L){
  L.h(L.kick('pr','Which sheet?')+'<h1 class="q">Wen is filling in the paperwork for a new prospect. Where does each item go first?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Meeting Information Sheet','Demonstration Information Sheet'],[
   ['Start and end times: 14:00 to 15:00',0,'Times and place describe the meeting itself.'],
   ['Who presents what, and when',0,'Roles and timing live on the meeting sheet.'],
   ['The customer contact and where to meet them',0,'Practical meeting details.'],
   ['The org chart with the Chain of Pain marked',1,'This is the people map the SE needs to plan the demo.'],
   ['Each person’s CBIs, Reasons and Specific Capabilities',1,'The heart of the handover to the SE.']],
   'The meeting sheet says how the meeting runs. The demonstration sheet says who the customer is and what they need, and has the meeting sheet attached.');}},
{part:3,src:'Chapter 7 · 7. Agree Upon Which Specific Capabilities Will Be Demonstrated',pts:1,run(L){
  L.h(L.kick('pr','No surprises')+'<h1 class="q">Two days before the Fenmore demo, Kai finds that sending orders to one of Fenmore’s suppliers only works in a test version that sometimes crashes. What should happen?</h1>');
  L.mc(L.card,['Kai shows it anyway and hopes it holds up','Kai tells Jordan now, and they agree what to show','Kai quietly skips it on the day without saying'],1,
   'The Salesperson must know exactly what can and can’t be shown. Jordan can then set expectations in the introduction and summary.',
   'Either way Jordan gets a surprise in front of the customer. The book’s rule is no surprises: tell Jordan now and agree what will be shown.');}},
{part:3,src:'Chapter 7 · 6. Communicate Information To Full Selling Team',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Tap each piece until the sentence describes a good handover.</h1>');
  L.sentence(L.card,[['Kai sends','Jordan sends'],['the product brochure','the Demonstration Information Sheet','a list of every feature'],['in the car park,','after the demo,','well before the demo,'],['then they add extra features','then they agree what to show']],[1,1,2,1],
   [['Kai is the SE who receives it. The Salesperson, Jordan, sends it.'],['A brochure says nothing about Fenmore’s needs.','A feature list is about Pallaro, not about Fenmore.'],['Too late to shape the demo.','Far too late to help at all.'],['Extras don’t belong in a Technical Proof demo.']],
   'Jordan sends the Demonstration Information Sheet well before the demo, then they agree which capabilities to show. The book’s worst case is doing everything else right but getting the Specific Capabilities lost in the handover.');}}
  ]
});
</script>
</body>
</html>
