<!doctype html>

<title>Style: substance first, then polish</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0011', title:'Style: substance first, then polish', minutes:19, icon:'star',
  goals:['Swap empty buzzwords for facts the customer can check','Use your voice, the mouse, a whiteboard and your Champion to make the proof land','Recover calmly from cosmetic bugs, serious bugs and crashes'],
  parts:['Substance first','Words','Delivery','Bugs'],
  read:'Read chapter 12 of the book for the full list of style elements, the stuck-car joke and the “system is slow” crash story.',
  glossary:{
    champion:'Champion: a person at the customer who willingly and actively supports buying and rolling out your product, and helps you reach the right people.',
    'buzzword-list':'Content-Free Buzzword-Compliant Vocabulary List: the book’s name for empty sales words such as robust, powerful, seamless and world-class. Replace them with facts.'
  },
  cheatsheet:[
    '<b>Substance over style.</b> Get the CBIs, Reasons and Specific Capabilities right first. Style only helps a demo that already has substance.',
    'Humor: safest at your own expense, then a teammate’s. Not the audience’s. A crash is a great moment for it.',
    'Appearance covers your kit and the room too: clean screen, tidy cables, cleared whiteboard. First visit: dress one level up, unless the customer tells you otherwise.',
    'Ask “<b>In whose opinion?</b>” of every buzzword, then replace it with a specific fact or number.',
    'Pace: if they fall behind, you failed; if they’re bored, you failed. For non-native speakers: slower, shorter, simpler, no colloquialisms.',
    'Let your <b>Champion drive</b> the Do It, after practicing together. Proof from a non-expert beats proof from you.',
    'Your mouse is you: slow, deliberate, parked on the key item. Laser pointers magnify every shake.',
    'Bugs: <b>cosmetic</b> → keep going. <b>Serious</b> → acknowledge, show what should happen, skip past; never repeat it. <b>Crash</b> → a teammate takes the room while the SE restarts quietly.'
  ],
  steps:[
/* ---------- PART 1: SUBSTANCE FIRST ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Two builders quote the same price for the same job, with the same skill. One listens and explains calmly. The other talks over you. Who gets the job?</h1>');
  L.mc(L.card,['It’s a coin toss, since the work is identical','The calm one who listens to you'],1,
   'When everything else is equal, how someone treats you decides it. This lesson is about that “how” in a demo, and why it still comes second.',
   'In practice, people buy from those they like and respect when the offer is equal. That “how” is style, and this lesson is about it.');}},
{part:0,src:'Chapter 12 · Style',run(L){
  L.h(L.kick('learn','Substance over style')+'<h1 class="q">Style can lift a good demo. It can’t rescue an empty one.</h1>'+
   L.quote('Substance over style. Always.','Peter Cohan, Great Demo!')+
   L.prose('No amount of polish or humor makes up for missing substance. Your first job is still to find the CBIs, Reasons and Specific Capabilities and build the demo around them.')+
   L.prose('Once that’s done, style helps in four ways: people connect with you, they forgive your mistakes, you stand out from rivals, and a longer relationship can grow.')+
   '<p class="small">The book lists many “elements of style”: humor, appearance, language, buzzwords, pace, presentation skills, letting your Champion drive, the mouse, props, and recovering from bugs. This lesson takes them in that order.</p>');
  L.done();}},
{part:0,src:'Chapter 12 · Humor; Appearance',run(L){
  L.h(L.kick('learn','Humor and appearance')+'<h1 class="q">Be human, and look ready</h1>'+
   L.lanes([['chat','Humor','You don’t need an opening joke, but a little humor during a demo helps. <b>Safest:</b> poke fun at yourself. <b>Next:</b> at a teammate. <b>Avoid:</b> the audience, unless you have a long, trusted relationship. A crash or bug is a great moment for it.',2],
            ['eye','Appearance','It’s more than clothes: a clean laptop screen, tidy cables, spotless handouts. Ask for time to prepare the room: chairs, tables, a clean whiteboard. It reflects on you, even if it isn’t your room.',3]])+
   L.prose('<b>What to wear?</b> Match the norms of the market and region. A safe rule: go one “dress level” up on a first visit, then adjust. If the customer tells you how to dress, respect it.'));
  L.done();}},
{part:0,src:'Chapter 12 · Appearance',run(L){
  L.h(L.kick('ex','Wen’s first Fenmore visit')+'<h1 class="q">Kai takes Wen to a demo for six Fenmore store managers</h1>');
  L.beats(L.card,[
   ['The week before','Kai asks Sam for fifteen minutes in the meeting room before the managers arrive. Sam agrees.'],
   ['What to wear','Wen plans a suit, one level up for a first visit. Then Sam mentions that head office is casual and suits make store managers wary. Wen goes smart-casual.'],
   ['On arrival','Kai wipes old notes off the whiteboard, clears coffee cups, lines up the chairs and tucks the cables away. Wen cleans the laptop screen.'],
   ['Five minutes in','The projector flickers. Kai grins: “That’s me plugging things in with my coffee hand.” The managers laugh, and the room relaxes.']],
   'Prepare the room as if it were yours, follow the customer’s dress advice when they give it, and aim jokes at yourself.');}},
{part:0,src:'Chapter 12 · Humor',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Mid-demo, the report is slow to load. Kai wants to fill the pause with a light joke. Which target is safest?</h1>');
  L.mc(L.card,['Robin’s famous giant spreadsheets','Fenmore’s creaky old stock system','Kai’s own record with gadgets'],2,
   'Joking at your own expense is the safest humor. Nobody in the audience is put on the spot.',
   'Both of those make fun of the customer, which the book advises against unless you have a long, trusted relationship. Laugh at yourself instead.');}},
{part:0,src:'Chapter 12 · Humor; Appearance',pts:6,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Does it help or hurt?',['Helps','Hurts'],[
   ['Kai jokes that Jordan’s briefings used to happen in the car park.',0,'A teammate is the next-safest target after yourself.'],
   ['Kai jokes about Robin’s spreadsheets in front of Robin’s boss.',1,'That makes fun of the audience. Leave it unless the trust runs very deep.'],
   ['A tangle of cables spills out from under the demo table.',1,'Messy kit reflects on you and the demo. Tidy it before people arrive.'],
   ['With no dress advice, Wen goes one level up for a first visit to a new prospect.',0,'That’s the book’s safe default for a first visit.'],
   ['Sam says “no ties here, please,” and Kai wears a tie anyway.',1,'When the customer tells you how to dress, respect it.'],
   ['Kai arrives early to clear old cups and wipe the whiteboard.',0,'Preparing the room, even someone else’s, shows care.']]);}},

/* ---------- PART 2: WORDS ---------- */
{part:1,src:'Chapter 12 · Language',run(L){
  L.h(L.kick('learn','Language')+'<h1 class="q">Competent, but never arrogant</h1>'+
   L.list([['layers','Match their level','Talk above the audience and you lose them. Talk below them and they doubt you. Your research tells you which level fits.'],
     ['book','Go easy on acronyms','Say the full words, then the acronym. After about three times, the acronym alone is fine.'],
     ['pencil','Phrasing matters','“I’d like to share how we…” lands softer than “I’ll show you…”. “We explored” beats “I showed you”.'],
     ['alert','“But” sounds like “no”','“I hear you, but…” means “I disagree”. Try “and” instead.']],1));
  L.done();}},
{part:1,src:'Chapter 12 · The Content-Free Buzzword-Compliant Vocabulary List',run(L){
  L.h(L.kick('learn','Empty words')+'<h1 class="q">Words that sound good and say nothing</h1>'+
   L.prose('The book’s '+L.g('buzzword-list','Content-Free Buzzword-Compliant Vocabulary List')+' has 15 entries, including:')+
   '<div style="display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px">'+['Robust','Powerful','Flexible','Integrated','Seamless','Scalable','Easy-to-use','Intuitive','User-friendly','Best-of-breed','World-class','Cutting-edge'].map(w=>'<span class="chip static">'+w+'</span>').join('')+'</div>'+
   L.prose('Demos must deal in facts. Buzzwords cost you credibility, and the book links them to longer sales cycles. As a customer, the author gave vendors about twenty minutes, and showed the vague ones the door.')+
   L.note('<b>The test:</b> ask “In whose opinion?” If it’s a named customer, quote them. If it’s your marketing team (or you), replace the word with a specific fact or number.','scale'));
  L.done();}},
{part:1,src:'Chapter 12 · The Content-Free Buzzword-Compliant Vocabulary List',run(L){
  L.h(L.kick('ex','Worked example')+'<h1 class="q">Kai rewrites the opening line from the old Pallaro deck</h1>');
  L.beats(L.card,[
   ['The old line','“Pallaro Planner is a powerful, intuitive forecasting platform that integrates seamlessly with your systems.”'],
   ['“Powerful”?','In whose opinion? Kai swaps it for what it does: “It forecasts demand for every item in every store from your sales history.”'],
   ['“Intuitive”?','Kai counts clicks instead: “A store’s reorder report is four clicks from the start screen.”'],
   ['“Seamless”?','Kai names the actual link: “Approved orders go to your suppliers without retyping.”'],
   ['Add the Delta','“For Fenmore, that could take reorder work from 12 person-days a week to 1.”']],
   'Each buzzword became a fact the store managers can check. Facts are harder to argue with, and they set Pallaro apart from rivals who say “powerful” too.');}},
{part:1,src:'Chapter 12 · The Content-Free Buzzword-Compliant Vocabulary List',pts:1,run(L){
  L.h(L.kick('try','Build it yourself')+'<h1 class="q">Tap each piece until the sentence is a fact, not fluff.</h1>');
  L.sentence(L.card,[['Pallaro Planner','Our powerful planner'],['seamlessly integrates with','sends approved orders to'],['Fenmore’s suppliers','all your partners'],['in a best-of-breed way.','with no retyping.']],[0,1,0,1],
   [['“Powerful” is on the list. Say what it is, not how great it is.'],['“Seamlessly integrates” is one of the worst offenders. Say what actually moves where.'],['Too vague. Name who receives the orders.'],['“Best-of-breed” is empty. Say what the customer no longer has to do.']],
   'Every word can be checked: who sends what, to whom, and what work disappears.');}},
{part:1,src:'Chapter 12 · The Content-Free Buzzword-Compliant Vocabulary List',pts:6,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Buzzword or fact?',['Empty buzzword','Fact-based claim'],[
   ['“Pallaro Planner is easy to use.”',0,'In whose opinion? Give clicks or time to finish a task instead.'],
   ['“Robin built Store 7’s reorder list in five minutes, on a first try.”',1,'Specific person, task and time. Anyone can check it.'],
   ['“Our scalable platform grows with your business.”',0,'Scalable to what? Say how many stores or items it handles.'],
   ['“It forecasts every item in all 40 Fenmore stores in one weekly run.”',1,'A concrete number tied to this customer.'],
   ['“A Pallaro customer says it cut list-building from three days to one.”',1,'A named customer view, with numbers, passes the “in whose opinion?” test.'],
   ['“A flexible, comprehensive, cutting-edge solution.”',0,'Three list words in a row, and not one fact.']]);}},
{part:1,src:'Chapter 12 · Pace',run(L){
  L.h(L.kick('learn','Pace')+'<h1 class="q">Two rules, and a tool</h1>'+
   L.list([['If your audience falls behind, you have failed.',''],['If you bore them by going too slowly, you have failed.','']],4)+
   L.prose('Between those rules, pace is a tool. People in different regions expect different speeds; you can match them, or stand out on purpose.')+
   L.prose('When some listeners aren’t native speakers of the demo’s language: <b>slow down</b>, use <b>shorter sentences</b> and <b>simpler words</b>, organize your ideas before you speak, and <b>avoid colloquialisms</b>. “Pick your brains” can sound alarming if taken literally.'));
  L.done();}},
{part:1,src:'Chapter 12 · Pace',pts:1,run(L){
  L.h(L.kick('pr','What should Kai change?')+'<h1 class="q">Two of the store managers learned English as adults. Kai’s rehearsed line: “This report will knock your socks off, so let me pick your brains about Mondays.”</h1>');
  L.mc(L.card,['Keep it, since the energy will carry it','Speak faster to leave more time for Q&amp;A','Use plain words, short sentences, slower'],2,
   'Idioms like “knock your socks off” may mean nothing, or something odd, to non-native speakers. Plain, short and slower keeps everyone with you.',
   'If listeners fall behind, the demo has failed. Drop the idioms, shorten the sentences and slow down.');}},

/* ---------- PART 3: DELIVERY ---------- */
{part:2,src:'Chapter 12 · Presentation skills; Linear vs. Non-Linear',run(L){
  L.h(L.kick('learn','Presentation skills')+'<h1 class="q">Talk to people, not to screens</h1>'+
   L.list([['eye','Eye contact','Speak to one person for five to ten seconds, then move on to someone else. They’ll nod back.'],
     ['person','Move','Stand up from the keyboard for the introduction or summary, then sit back down to demo.'],
     ['chat','Vary your voice','A steady volume bores people. Step closer and speak more quietly: they lean in.'],
     ['check','Tick things off','Mark each finished item on the Roadmap, To Do List or Not Now List.'],
     ['shield','Never step back from a question','Look at the asker, stand firm or step slightly toward them, then answer.']],2)+
   '<p class="small" style="margin-top:10px">The book also recommends a presentation course, ideally one that films you. It can be humbling.</p>');
  L.done();}},
{part:2,src:'Chapter 12 · Linear vs. Non-Linear Presentation Methods; Using Props',run(L){
  L.h(L.kick('learn','Break the slide-after-slide pattern')+'<h1 class="q">Whiteboards and props wake a room up</h1>'+
   L.lanes([['pencil','Whiteboard or flipchart','Blank the slides and walk over. Ideas built live feel fresh, stay in view all meeting, and people remember what they helped draw. Best of all: the customer takes the pen to map their own workflow.',1],
            ['box','Props','Something people can hold makes software feel real. The book tells of an SE who walked in with a pile of reference books and sighed over searching them, before showing the search in seconds.',3]])+
   L.prose('Another good whiteboard moment: drawing your software’s architecture box by box, so people can map it onto their own systems as it grows.'));
  L.done();}},
{part:2,src:'Chapter 12 · Letting Your Champion Drive',run(L){
  L.h(L.kick('learn','Let your Champion drive')+'<h1 class="q">The best proof of “easy to use” is someone else using it</h1>'+
   L.prose('Demos are usually run by an expert, for an audience of non-experts. So however smooth you are, people may think, “Easy for <i>them</i>.” Have your '+L.g('champion','Champion')+' run part of it instead.')+
   L.list([['Proof feels deeper','A non-expert gets to the result without dead ends. Less risk of “smoke and mirrors”.'],
     ['“If they can, I can”','The audience starts to believe they could run it themselves.'],
     ['People talk about it','It’s unusual, so word of mouth spreads through the customer.']],2)+
   L.note('<b>Guidelines:</b> practice with the Champion beforehand. Keep it to the Do It, since longer segments raise the risk of slips. No Champion? A volunteer works, with more guidance. Safer still, but weaker: you drive and ask the room, “Where should I click next?”','list'));
  L.done();}},
{part:2,src:'Chapter 12 · Letting Your Champion Drive',pts:1,
 solve:async L=>{const c=L.$('#dv').children;c[0].click();c[1].click();c[2].click();},
 run(L){
  const O=[['Kai drives','Kai runs the Do It at expert speed.',[95,35],'A manager whispers: “Sure, but Kai built it.”'],
           ['Kai asks the room','“Where should I click next?” Managers call out steps; Kai clicks.',[80,60],'Managers lean in and join in. Still Kai’s hands on the mouse.'],
           ['Sam drives','Sam, who practiced with Kai on Thursday, runs the Do It alone.',[55,95],'A manager: “If Sam can do that, I can.” Talked about all week.']];
  const seen=new Set();
  L.h(L.kick('pr','Toggle and compare')+'<h1 class="q">Store managers need proof it’s simple. Try all three ways to run the Do It.</h1><div id="dv" style="display:flex;gap:8px;flex-wrap:wrap"></div>'+
   '<div style="background:var(--soft);border-radius:16px;padding:14px;margin:10px 0 6px;min-height:170px" id="dw"><span class="small">Pick a way above.</span></div><div id="dq"></div>');
  O.forEach((o,j)=>{const b=document.createElement('button');b.className='chip';b.innerHTML=L.ic(j===2?'people':'person')+o[0];
    b.onclick=()=>{[...L.$('#dv').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');seen.add(j);
      L.$('#dw').innerHTML='<p class="small" style="margin:0 0 8px">'+o[1]+'</p>'+
        '<div class="meterrow"><div class="lb">Kai’s control</div><div class="meter"><div style="width:'+o[2][0]+'%;background:var(--h2)"></div></div></div>'+
        '<div class="meterrow"><div class="lb">Proof the room feels</div><div class="meter"><div style="width:'+o[2][1]+'%;background:var(--ok-strong)"></div></div></div>'+
        '<p style="margin:8px 0 0"><i>'+o[3]+'</i></p>';
      if(seen.size===3&&!L.$('#dq').innerHTML){const q=L.$('#dq');q.innerHTML='<h2 class="sub">What does Kai give up when Sam drives?</h2>';
        L.mc(q,['Some control, so a slip becomes more likely','The chance to show the Illustration first'],0,
         'Exactly the trade. That’s why the book says practice with the Champion first and keep it to the short Do It.',
         'The Illustration still comes first; Sam only runs the Do It. The cost is control: a non-expert might slip, which is why they practice first.');}};
    L.$('#dv').appendChild(b);});}},
{part:2,src:'Chapter 12 · Confidence And Poise; Mouse Movements; Screen Pointing',run(L){
  L.h(L.kick('learn','Confidence, the mouse and pointers')+'<h1 class="q">Your mouse is you</h1>'+
   L.prose('Confidence comes naturally or from practice, and knowing exactly what to show (this method) builds it. Confident presenters get more slack when things go wrong. A visibly nervous SE tends to attract the people who enjoy tripping vendors up.')+
   L.list([['pointer','The mouse','The audience sees only the screen, so the mouse speaks for you. Move it deliberately, never randomly, and slower than you could. Leave it on the key item when you stand up.'],
     ['alert','Laser pointer','It magnifies every tremor. If you’re nervous, steady it with two hands, hold it still, and don’t flash it on and off.'],
     ['arrow','Stick pointer or hands','Pick the stick up, point, put it down; don’t swing it. Your hands can point, circle and underline, too.']],1));
  L.done();}},
{part:2,src:'Chapter 12 · Mouse Movements',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Kai knows the menus by heart, so the cursor zips across the screen. What will the store managers likely conclude?</h1>');
  L.mc(L.card,['The software looks complicated','Kai is impressively well prepared','The software must be very fast'],0,
   'Moving faster than the audience can follow makes software look hard to use. Slow, deliberate moves make it look logical and easy.',
   'The book warns that a fast mouse confuses people and makes the software look complex, even “user hostile”. Slow down so every move is clear.');}},
{part:2,src:'Chapter 12 · Linear vs. Non-Linear; Letting Your Champion Drive; Using Props',pts:5,run(L){
  L.h(L.kick('pr','Pick the tool')+'<h1 class="q">Which delivery tool fits each moment at the store managers’ demo?</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Whiteboard','Champion drives','Prop'],[
   ['Learn how each manager builds Monday’s order today',0,'Map the workflow on the whiteboard. Better still, hand a manager the pen.'],
   ['Show that a non-expert can reach the reorder report',1,'Sam running the Do It proves it far better than Kai can.'],
   ['Make the pain of hand-built lists feel real',2,'Kai carries in a thick stack of last month’s printed reorder sheets.'],
   ['Lee wants to see how Planner fits Fenmore’s systems',0,'Draw the architecture box by box so Lee can map it onto Fenmore’s setup.'],
   ['Get managers saying “if Sam can, I can”',1,'Seeing a colleague succeed is what makes them believe it.']],
   'Whiteboards build ideas with the room, Champions prove ease of use, and props make an abstract problem tangible.');}},

/* ---------- PART 4: BUGS ---------- */
{part:3,src:'Chapter 12 · Recovering From Bugs, Mistakes And Crashes',run(L){
  L.h(L.kick('learn','Plan on bugs')+'<h1 class="q">All useful software has bugs, so plan for them</h1>'+
   L.prose('The book half-jokes that the more important the demo, the worse the bug that appears. While preparing, if one path triggers a bug, choose another and report it. Showing a test version? Tell the audience up front to expect bugs.')+
   L.tiers([['eye','Cosmetic bug','Wrong colors, a cursor that doesn’t change, leftover screen marks. <b>Ignore it and keep going.</b> They probably didn’t notice.','Switch screens and back to clear clutter'],
     ['alert','Serious bug','Something that should work doesn’t: a search with wrong results, an error message. <b>Never just repeat it</b>, as it will happen again. Acknowledge it briefly, show what should have happened, pick up right after it.','Retry later, or show it in a remote session'],
     ['x','Crash','Same as a serious bug, plus time to restart. <b>A teammate takes the room</b> (a summary, the Roadmap, a Not Now List question, a joke) while the SE blanks the screen and restarts quietly.','The SE signals when ready',true,'Team play']])+
   '<p class="small" style="margin-top:10px">Team play in general: while one person presents, the rest of the Selling Team watches reactions and tracks questions. Stay calm, whatever happens.</p>');
  L.done();}},
{part:3,src:'Chapter 12 · Recovering From Bugs, Mistakes And Crashes',run(L){
  L.h(L.kick('ex','The crash')+'<h1 class="q">Halfway through Do It Again, Kai’s laptop freezes</h1>');
  L.beats(L.card,[
   ['The freeze','The screen locks, then the laptop starts to restart. Six store managers watch.'],
   ['Blank it','Kai never screws in the projector cable, for exactly this moment. One tug and the wall goes blank, so nobody watches the restart.'],
   ['Jordan steps in','Jordan stands up: “While Kai sorts that out, let’s take a question from our Not Now List.” A manager’s question about weekend deliveries gets answered.'],
   ['Back in business','Kai reopens Store 7’s report quietly, then nods to Jordan. Jordan: “Kai, back to you.” Kai: “Let’s pick up right where we were.”'],
   ['Afterwards','A manager tells Sam the team “handled it like pros.” Wen notes: calm, a handoff, and no one stared at a restart screen.']],
   'In a crash the Selling Team works as one: the SE recovers out of sight while a teammate keeps the room busy.');}},
{part:3,src:'Chapter 12 · Recovering From Bugs, Mistakes And Crashes',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">During the Do It, the red spoilage flags fail to appear on the reorder report. What should Kai do?</h1>');
  L.mc(L.card,['Run the same steps again, more carefully','Restart the laptop and begin again','Say it’s a bug, show what it should be, move on'],2,
   'Acknowledge it briefly, show what should have happened (the Illustration slide works well), and pick up right after the bug.',
   'Serious bugs repeat. Running into it again proves you don’t know your software and that it doesn’t work. Acknowledge, show the expected result, move on.');}},
{part:3,src:'Chapter 12 · Recovering From Bugs, Mistakes And Crashes',pts:1,run(L){
  L.h(L.kick('pr','Put it in order')+'<h1 class="q">Wen hits a serious bug while sending orders to a supplier. Put Wen’s moves in order.</h1><div id="od"></div>');
  L.order(L.$('#od'),['Say briefly and plainly that it’s a bug','Show what should have happened, using the Illustration','Pick the demo up just after the bug','After the demo, quietly test it again','If it works now, tell Jordan a short re-show is possible'],
   'Acknowledge, show, move past. Later, test it yourself; if it’s fixed, a brief re-show (or a remote session) can still prove that capability.');}},
{part:3,src:'Chapter 12 · Recovering From Bugs, Mistakes And Crashes',pts:5,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which recovery fits?',['Ignore it, keep going','Acknowledge, show, move on','Teammate fills, SE restarts'],[
   ['A menu label is drawn in the wrong spot for a second.',0,'Cosmetic. They likely didn’t notice, so don’t point it out.'],
   ['The forecast comes back blank for every store.',1,'Serious: a core capability failed. Don’t repeat it; show what it should look like.'],
   ['The laptop freezes and begins to restart.',2,'A crash. Jordan takes the room while Kai blanks the screen and recovers.'],
   ['“Send to supplier” throws an error message.',1,'Serious. Acknowledge it, describe the expected result, carry on past it.'],
   ['A chart leaves a faint smear after redrawing.',0,'Cosmetic. Switch screens and back if it bothers you, and keep going.']]);}}
  ]
});
</script>
</body>
</html>
