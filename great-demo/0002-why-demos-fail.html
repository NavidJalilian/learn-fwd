<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Why demos fail, and what it costs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/course.css">
</head>
<body>
<script src="../assets/course.js"></script>
<script src="course-data.js"></script>
<script>
Course.lesson({
  id:'0002', title:'Why demos fail, and what it costs', minutes:18, icon:'alert',
  goals:['Sort any demo failure into one of three groups','Explain why demos get longer and less focused over time','Add up what a failed demo really costs, beyond the travel bill'],
  parts:['Why demos fail','Where tours come from','Counting the cost','The point of focus'],
  read:'Read chapters 2 and 3 of the book for the full list of failure reasons and the worked cost example.',
  glossary:{
    'opportunity-cost':'Opportunity cost: what you lose by spending time on one thing, because that time can’t go to another customer or deal.',
    'technical-sale':'Technical sale: the part of a sale where the customer becomes convinced the product can really do what they need.'
  },
  cheatsheet:[
    'Dozens of failure reasons boil down to three groups: <b>technical or infrastructure</b> problems, <b>content and organization</b>, and <b>failing to qualify</b> the customer.',
    'Many demo paths start with <b>developers</b>, who show the narrow path the early code can handle. Marketing and sales keep reusing it.',
    'Each release adds features to the demo. Demos almost never get <b>shorter</b>.',
    'If closing one customer takes more than one demo, you are wasting money and <b>time</b>.',
    'The book’s two-trip example costs about <b>$12,500</b> in direct costs, plus trade-show costs and 6.5 days of lost selling time.',
    'Opportunity cost: quota ÷ selling days. $2,000,000 ÷ 200 days = <b>$10,000</b> of sales needed per selling day.',
    'The real cost of a failed demo is the <b>whole sale plus all future business</b> with that customer.',
    'In the demo, <b>you</b> are the one link between everyone at your company and everyone at the customer.'
  ],
  steps:[
/* ---------- PART 1: WHY DEMOS FAIL ---------- */
{part:0,src:'Warm-up',pts:1,run(L){
  L.h(L.kick('try','Warm-up · common sense only')+'<h1 class="q">Kai knows Pallaro Planner better than almost anyone. Yet Fenmore walked out of Kai’s demo unconvinced. Was product knowledge the problem?</h1>');
  L.mc(L.card,['Probably not; something else went wrong','Yes; Kai needs more product training'],0,
   'Kai’s knowledge was fine. The problems were what Kai showed, in what order, and to whom. This lesson looks at why demos fail.',
   'Kai knows the product inside out. Expert presenters fail too, for other reasons. This lesson looks at what those reasons are.');}},
{part:0,src:'Chapter 2 · Why Do Demos Fail?',run(L){
  L.h(L.kick('learn','The long list')+'<h1 class="q">Ask a room of presenters why demos fail, and the list never ends</h1>'+
   L.prose('The book collects reasons from many workshops and hundreds of demos. Here are some of them:')+
   '<div style="display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px">'+
   ['Software crashed','Didn’t know the product','No story','Too long','Too many features','Didn’t stop in time','No conclusion','Audience needs unknown','Capabilities didn’t match needs','No clear objective','Equipment failed','Questions broke the flow','People coming and going'].map(x=>'<span class="chip static">'+x+'</span>').join('')+'</div>'+
   L.prose('Look closely and they fall into just <b>three groups</b>:')+
   L.list([['box','Technical or infrastructure','Equipment, networks, bugs, set-up.'],
     ['layers','Content and organization','What you show, how much, in what order, with what story.'],
     ['people','Failing to qualify','Not understanding the customer’s needs and interests.']],1)+
   '<p class="small" style="margin-top:10px">These match the three challenges from lesson 1. The rest of the book tackles each one.</p>');
  L.done();}},
{part:0,src:'Chapter 2 · Why Do Demos Fail?',run(L){
  L.h(L.kick('ex','Back to Kai’s first Fenmore demo')+'<h1 class="q">One demo, failing in all three ways</h1>');
  L.beats(L.card,[
   ['Before','Jordan briefs Kai in the car park, five minutes before the meeting. Nobody has asked Fenmore what each person needs. <i>Failing to qualify.</i>'],
   ['Minute 0','The meeting-room projector won’t show Kai’s screen. Ten minutes go on cables. <i>Technical.</i>'],
   ['Minutes 10–80','Kai tours every screen. The Store reorder report, the one thing Sam needed, appears at minute 50, buried among features nobody asked for. <i>Content and organization.</i>'],
   ['The result','Dana left at minute 20. Sam says: “I never saw what I needed.”']],
   'Most failed demos aren’t one disaster. They are a few small failures from these three groups, adding up.');}},
{part:0,src:'Chapter 2 · Why Do Demos Fail?',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Kai keeps going after the key report, showing five more features Fenmore never asked about. Which group is that?</h1>');
  L.mc(L.card,['Technical or infrastructure','Failing to qualify','Content and organization'],2,
   'Not stopping in time, and showing too many features, are about what you show and when. That’s content and organization.',
   'Nothing broke, and Kai did know what Fenmore needed by then. The problem was showing too much and not stopping: content and organization.');}},
{part:0,src:'Chapter 2 · Why Do Demos Fail?',pts:6,run(L){
  L.h(L.kick('pr','Sort the failures')+'<h1 class="q">Wen collected notes from failed Pallaro demos. Sort each one.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Technical','Content','Qualify'],[
   ['The forecast screen froze with an error mid-demo',0,'A software bug or crash is a technical failure.'],
   ['The demo had no clear ending, it just stopped',1,'No conclusion is a problem of organization.'],
   ['Nobody knew the audience were store managers, not buyers',2,'Not knowing who is in the room and what they need is a qualification failure.'],
   ['The hotel had no projector to borrow',0,'Missing equipment is infrastructure.'],
   ['Wen showed supplier tools; the customer needed forecasting',2,'Capabilities that don’t match needs come from not understanding the customer.'],
   ['Twenty features in forty minutes, with no story linking them',1,'Too many features and no story: content and organization.']],
   'Three groups cover almost every failure. That makes them something you can prepare for.');}},

/* ---------- PART 2: WHERE TOURS COME FROM ---------- */
{part:1,src:'Chapter 3 · The Origin Of Problem(s)',run(L){
  L.h(L.kick('learn','Where demo paths come from')+'<h1 class="q">Many demos were first designed by a programmer</h1>'+
   L.prose('Demos aren’t only for selling. Inside a software company, developers show new features to their colleagues in marketing. The early code only works along a <b>narrow path</b>, so that’s the path they show.')+
   L.flow([['pencil','Developer','Shows the new feature along the one path that works','early code'],['eye','Marketing','Shows customers the same safe path, to avoid bugs','early versions'],['cycle','Everyone','Keeps repeating that path as the product matures','for years']])+
   L.prose('So many demos come from people whose job is building software, not understanding customers. The path was chosen because it was safe, not because it solves anyone’s problem.'));
  L.done();}},
{part:1,src:'Chapter 3 · The Origin Of Problem(s)',pts:1,
 solve:async L=>{L.$('#pr').children[0].click();L.$('#go').click();},
 run(L){
  let p=null;const V=[20,32,45,60,75,90];
  L.h(L.kick('pr','Predict, then watch')+'<h1 class="q">Pallaro Planner version 1 had a tight 20-minute demo. Each new version adds features. What happens to the demo by version 6?</h1><div id="pr"></div>'+
   '<div id="sim" hidden><div id="bars" style="margin-top:10px"></div><button class="btn pri" id="go" style="margin-top:10px">'+L.ic('play')+'Ship five releases</button></div>');
  ['It gets longer','It stays about the same','It gets shorter'].forEach((n,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=n;b.onclick=()=>{if(p!==null)return;p=j;b.classList.add('sel');L.$('#sim').hidden=false;};L.$('#pr').appendChild(b);});
  L.$('#bars').innerHTML=V.map((v,j)=>'<div class="meterrow"><div class="lb">Version '+(j+1)+'</div><div class="meter"><div id="b'+j+'" style="background:'+(j?'var(--h3)':'var(--ok-strong)')+';width:'+(j?0:Math.round(v/90*100))+'%"></div></div></div>').join('');
  L.$('#go').onclick=function(){this.remove();let k=0;
    const t=setInterval(()=>{k++;const el=L.$('#b'+k);if(!el){clearInterval(t);return;}el.style.width=Math.round(V[k]/90*100)+'%';
      if(k>=5){clearInterval(t);L.award(p===0);
        L.sheet(p===0?'ok':'no',p===0?'You called it':'It got longer','Version 1 was focused on real customer problems. Each release added its new features to the existing demo, so it grew from 20 to 90 minutes. The book doubts you have ever seen a demo get shorter as the software matured.');L.done();}},400);};}},
{part:1,src:'Chapter 3 · The Origin Of Problem(s)',run(L){
  L.h(L.kick('learn','Release creep')+'<h1 class="q">More features, more minutes, more for the audience to absorb</h1>'+
   L.quote('Have you ever seen a demo get shorter as the software matures?','Peter E. Cohan, chapter 3')+
   L.prose('Version 1 of a product is usually aimed at specific customer problems, and so are its demos. From version 2 on, new features get added to the demo to show them off. Then version 3, 4, 5…')+
   L.prose('The audience has to watch and take in more with every release. That’s how Kai ended up with a 90-minute tour.'));
  L.done();}},
{part:1,src:'Chapter 3 · The Origin Of Problem(s)',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Why does Pallaro’s standard demo always click through the same screens, in the same order?</h1>');
  L.mc(L.card,['It was tested with customers and proved best','It started as a developer’s safe, narrow path','Sales chose it to match Fenmore’s workflow'],1,
   'The path was shown first by a developer because early code worked there, and everyone kept reusing it.',
   'Nobody designed it around customers. It began as the narrow path a developer could show without bugs, and it stuck.');}},
{part:1,src:'Chapter 3 · The Origin Of Problem(s)',pts:4,run(L){
  L.h('<div id="qk"></div>');
  L.quick(L.$('#qk'),'Which origin problem is this?',['The developer’s path','Release creep'],[
   ['Malik adds release 6’s new dashboard to the standard demo “so the field shows it.”',1,'A new feature added to the demo just because it’s new: release creep.'],
   ['Wen notices the demo avoids the import screen because it used to crash in beta.',0,'The path still follows what was safe in early code.'],
   ['The trade-show demo now takes 40 minutes; at launch it took 15.',1,'Each release made it longer.'],
   ['The demo uses a sample store set up years ago by the engineering team.',0,'The demo still runs on the programmers’ original set-up, not on a customer’s situation.']]);}},

/* ---------- PART 3: COUNTING THE COST ---------- */
{part:2,src:'Chapter 3 · Your Sales Cup Is (At Least) Half Empty',run(L){
  L.h(L.kick('ex','The book’s two-trip story, retold')+'<h1 class="q">Top performers, a ready buyer, and still two trips</h1>');
  L.beats(L.card,[
   ['Trade show','A visitor watches the standard booth demo, takes some brochures and moves on.'],
   ['The call','A Salesperson follows up and finds a real, budgeted problem the product solves well. The visitor admits the booth demo didn’t show what they were looking for.'],
   ['Trip 1','The Salesperson and an expert SE fly in. The SE gives a polished one-hour tour of everything. The technical staff get bored; the main contact goes quiet.'],
   ['In the hallway','The customer says there seems to be a lot in the product, but they got lost and never saw what they needed. It looks complex and costly.'],
   ['Rebuild','The SE spends two and a half days building a custom demo with the customer’s data and workflow.'],
   ['Trip 2','Both fly back. The SE shows exactly the needed capabilities. The technical sale is won and the order comes in.']],
   'A happy ending. But why did it take two tries, and what did that cost?');}},
{part:2,src:'Chapter 3 · Your Sales Cup Is (At Least) Half Empty',pts:1,
 solve:async L=>{[...L.$('#ct').children].forEach(b=>b.click());},
 run(L){
  const C=[['Trip 1: two people’s travel and time',5000],['SE builds a custom demo: 2.5 days',2500],['Trip 2: two people again',5000]];let tot=0;const on=new Set();
  L.h(L.kick('pr','Add it up')+'<h1 class="q">Tap each cost from the book’s example to add it to the bill.</h1><div id="ct" style="display:flex;flex-direction:column;gap:8px;align-items:flex-start"></div>'+
   '<div style="background:var(--soft);border-radius:16px;padding:14px;margin:12px 0"><div class="small">Direct Selling Team cost</div><div class="week" id="tt">$0</div><div class="small" id="tx"></div></div><div id="cq"></div>');
  C.forEach((c,j)=>{const b=document.createElement('button');b.className='chip';b.innerHTML=c[0]+' · <b>$'+c[1].toLocaleString('en-US')+'</b>';
    b.onclick=()=>{if(on.has(j))return;on.add(j);b.classList.add('sel');tot+=c[1];L.$('#tt').textContent='$'+tot.toLocaleString('en-US');
      if(on.size===3){L.$('#tx').innerHTML='Plus the trade-show booth (thousands to tens of thousands of dollars) and about <b>6.5 days</b> of selling time lost.';
        const q=L.$('#cq');q.innerHTML='<h2 class="sub">If the SE had nailed trip 1, how much of this direct cost would the company have skipped?</h2>';
        L.mc(q,['$5,000','$7,500','$12,500'],1,
         'The custom build ($2,500) and the second trip ($5,000) only happened because trip 1 failed. Together: $7,500, plus the days those two people could have spent with other customers.',
         'Trip 1 had to happen either way. What a failed first demo added was the custom build ($2,500) and trip 2 ($5,000): $7,500.');}};L.$('#ct').appendChild(b);});}},
{part:2,src:'Chapter 3 · Your Sales Cup Is (At Least) Half Empty',run(L){
  L.h(L.kick('learn','The hidden cost: time')+'<h1 class="q">Every day spent on a repeat trip is a selling day gone</h1>'+
   L.prose('The book’s rule of thumb: if it takes more than one demo to close any single customer, you are throwing away money and your most valuable resource, <b>time</b>. You can only be in front of one customer at a time.')+
   L.prose('One way to price that lost time is the '+L.g('opportunity-cost','opportunity cost')+' of a selling day:')+
   L.flow([['target','Quota','$2,000,000 a year','the sales target'],['cal','Selling days','200 a year',''],['trend','Per selling day','$10,000','of sales needed']])+
   '<p class="small" style="margin-top:10px">So each lost day is not just a salary. It is a day’s share of the sales target that now has to be found somewhere else.</p>');
  L.done();}},
{part:2,src:'Chapter 3 · Your Sales Cup Is (At Least) Half Empty',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Jordan’s quota is $3,000,000 a year, over 200 selling days. How much in sales does each selling day need to bring in?</h1>');
  L.mc(L.card,['$1,500','$15,000','$150,000'],1,
   '$3,000,000 ÷ 200 = $15,000. Every selling day lost to a repeat trip costs Jordan about that much.',
   'Divide the quota by the selling days: $3,000,000 ÷ 200 = $15,000 per day.');}},
{part:2,src:'Chapter 3 · But Wait, There’s More',run(L){
  L.h(L.kick('learn','But wait, there’s more')+'<h1 class="q">The real cost of a failed demo is much bigger than the travel bill</h1>'+
   L.tiers([['box','Your direct costs','Travel, salaries, preparation days. The book puts it in the order of $10,000.','Smallest'],
     ['people','The customer’s direct costs','Gathering their people is costly too: an hour with 8 people might cost them about $1,000.',''],
     ['clock','Time','Money is minor next to time, which nobody gets back. People who feel you wasted their time won’t favor you.',''],
     ['alert','The sale and everything after it','A failed demo puts at risk the whole sale plus all future business: services, installation, support, add-ons, new products.','Hundreds of thousands to millions',true,'The real cost']])+
   '<p class="small" style="margin-top:10px">The book adds that software companies lose millions every year to poor demos, and most never notice.</p>');
  L.done();}},
{part:2,src:'Chapter 3 · But Wait, There’s More',pts:6,run(L){
  L.h(L.kick('pr','Whose cost is it?')+'<h1 class="q">Sort the costs of Kai’s failed Fenmore demo.</h1><div id="bk"></div>');
  L.buckets(L.$('#bk'),['Pallaro direct','Fenmore direct','Future business'],[
   ['Flights and hotel for Jordan and Kai’s second trip',0,'Travel for the Selling Team is a direct cost to Pallaro.'],
   ['Kai’s days rebuilding the demo',0,'Prep time is paid by Pallaro.'],
   ['Dana, Sam, Robin and Lee giving up a morning, twice',1,'The customer pays for its own people’s time in the meeting.'],
   ['The yearly support contract after go-live',2,'Support is ongoing business that a failed demo puts at risk.'],
   ['Rolling Planner out to Fenmore’s new stores next year',2,'Future expansion depends on winning now.'],
   ['Help setting Planner up at all 40 stores',2,'Implementation services come with the sale, or don’t.']],
   'Pallaro’s bill is the small part. The big number is everything Fenmore might buy over the years.');}},
{part:2,src:'Chapter 3 · But Wait, There’s More',pts:1,run(L){
  L.h(L.kick('pr','A real decision')+'<h1 class="q">Jordan shrugs: “The second trip cost us about $5,000. Not great, but no big deal.” What’s the strongest reply?</h1>');
  L.mc(L.card,['Fair enough; $5,000 is small for a deal this size','We nearly lost the whole deal and all of Fenmore’s future business','The real problem is only the two selling days we lost'],1,
   'The trip is the visible cost. What was really at stake was the Fenmore sale and everything that could follow it.',
   'The money and the lost days are real, but they’re the small part. A failed demo risks the whole sale plus all future business with Fenmore.');}},

/* ---------- PART 4: THE POINT OF FOCUS ---------- */
{part:3,src:'Chapter 3 · You Are The Point Of Focus',run(L){
  L.h(L.kick('learn','You are the point of focus')+'<h1 class="q">Years of work come down to one short demo, and one person giving it</h1>'+
   L.prose('Think of everyone at your company who builds, sells and supports the product: developers, testers, writers, marketing, sales, support, accounting, management. Now think of everyone at the customer who would use or support it.')+
   L.flow([['layers','Pallaro','Development, marketing, sales, support, accounting, management','',1],['person','Kai','The one link, for 30 minutes','',2],['home','Fenmore','Regular users, occasional users, power users, IT support, accounting, management','',3]])+
   L.prose('The person giving the demo is where all of that meets. Everyone’s hopes rest on those few minutes. That is why the book wants you to close the '+L.g('technical-sale','technical sale')+' the <b>first time</b>.'));
  L.done();}},
{part:3,src:'Chapter 3 · You Are The Point Of Focus',pts:1,run(L){
  L.h(L.kick('try','Check your understanding')+'<h1 class="q">Robin builds Fenmore’s reorder spreadsheets every week and knows every shortcut. On the customer side of the picture, Robin is a…</h1>');
  L.mc(L.card,['Power user','Occasional user','Manager'],0,
   'Robin uses the tools heavily and in depth: a power user. Kai has to connect with Robin too, not just with Dana.',
   'Robin works in the reorder tools every week, in depth. That’s a power user, one of the groups the demo has to reach.');}},
{part:3,src:'Chapter 3 · You Are The Point Of Focus',pts:1,run(L){
  L.h(L.kick('pr','Build it yourself')+'<h1 class="q">Tap each piece until the sentence sums up the chapter.</h1>');
  L.sentence(L.card,[['the travel bill','the whole sale'],['all future business','one more trip'],['the first time','by the third visit']],[1,0,0],
   [['The travel bill is the smallest part of the cost.'],['One more trip is a direct cost; the bigger risk is all the business after this sale.'],['Every extra visit wastes money and selling time. Aim for the first time.']],
   'A failed demo risks the whole sale plus all future business, so close the technical sale the first time.');}},
{part:3,src:'Chapter 3 · You Are The Point Of Focus',pts:1,run(L){
  L.h(L.kick('pr','Put it together')+'<h1 class="q">Kai says: “If the Fenmore demo goes badly again, we’ll just book another one.” What should you tell Kai?</h1>');
  L.mc(L.card,['Fine, a few trips are a normal part of selling','Book two demos now, so one can be a rehearsal','Each repeat costs time, money and trust; aim to win the first time'],2,
   'Fenmore’s people are short on time, and each repeat costs Pallaro days it can’t get back. The next lessons show how to prepare so one demo is enough.',
   'Repeat demos cost the Selling Team money and selling days, cost Fenmore its people’s time, and risk the whole relationship. The goal is to close the technical sale the first time.');}}
  ]
});
</script>
</body>
</html>
